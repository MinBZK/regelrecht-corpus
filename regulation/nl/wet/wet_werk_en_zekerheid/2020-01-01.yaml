  - number: XXIIe
    text: |-
      1 [Artikel 668a van Boek 7 van het Burgerlijk Wetboek][ref1], zoals dat artikel luidde op de dag voor het tijdstip
      van inwerkingtreding van [artikel I, onderdeel N][ref2], van deze wet, blijft van toepassing op een op die dag
      geldende collectieve arbeidsovereenkomst of regeling door of namens een daartoe bevoegd bestuursorgaan waarin
      hetgeen in artikel 668a van Boek 7 van het Burgerlijk Wetboek, zoals dat artikel luidde op die dag, van toepassing
      is verklaard of waarin toepassing is gegeven aan artikel 668a, lid 5, van Boek 7 van het Burgerlijk Wetboek, zoals
      dat artikel luidde op de dag voor dat tijdstip, en de arbeidsovereenkomsten waarop deze van toepassing zijn of
      worden, voor de duur van de looptijd van de collectieve arbeidsovereenkomst of regeling, maar ten hoogste gedurende
      twaalf maanden na die inwerkingtreding.

      2 Op arbeidsovereenkomsten voor bepaalde tijd die worden voortgezet op of na het
      tijdstip van inwerkingtreding van [artikel I, onderdeel N][ref3], van deze wet, is
      [artikel 668a, lid 1, van Boek 7 van het Burgerlijk Wetboek][ref4], zoals dat artikel komt te luiden na dat
      tijdstip, eerst van toepassing, indien op of na dat tijdstip een volgende arbeidsovereenkomst wordt aangegaan ten
      hoogste zes maanden na de dag waarop de daaraan voorafgaande arbeidsovereenkomst eindigde, met dien verstande dat
      in afwijking van artikel 668a, lid 1, een arbeidsovereenkomst die is aangegaan voor dat tijdstip en de daaraan
      voorafgaande arbeidsovereenkomsten geacht worden elkaar niet te hebben opgevolgd, indien zij elkaar hebben
      opgevolgd met tussenpozen van meer dan drie maanden, of met tussenpozen langer dan de tussenpoos die gold op
      grond van een collectieve arbeidsovereenkomst of regeling door of namens een daartoe bevoegd bestuursorgaan waarin
      toepassing is gegeven aan artikel 668a, vijfde lid, van Boek 7 van het Burgerlijk Wetboek, zoals dat artikel luidde
      op de dag voor het tijdstip van inwerkingtreding van artikel I, onderdeel N, van de Wet werk en zekerheid.

      3 In afwijking van [artikel 668a, lid 1][ref5], zoals dat artikel komt te luiden na het tijdstip van
      inwerkingtreding van [artikel I, onderdeel N][ref6], van deze wet worden de arbeidsovereenkomst, bedoeld in het
      eerste lid, en de daaraan voorafgaande arbeidsovereenkomsten geacht elkaar niet te hebben opgevolgd, indien zij
      elkaar hebben opgevolgd met tussenpozen van meer dan drie maanden, of met tussenpozen langer dan de tussenpoos die
      gold op grond van een collectieve arbeidsovereenkomst of regeling door of namens een daartoe bevoegd bestuursorgaan
      waarin toepassing is gegeven aan artikel 668a, vijfde lid, van Boek 7 van het Burgerlijk Wetboek, zoals dat artikel
      luidde op de dag voor het tijdstip van inwerkingtreding van artikel I, onderdeel N, van de Wet werk en zekerheid.


