  - number: XXII
    text: |-
      1 Het [Buitengewoon Besluit Arbeidsverhoudingen 1945][ref1] alsmede [artikel 665][ref2] en
      [afdeling 9 van Boek 7, titel 10 van het Burgerlijk Wetboek][ref3], zoals deze luidden de dag voor het tijdstip van
      inwerkingtreding van [artikel I, onderdeel O][ref4], van deze wet, blijven van toepassing:

      a. op een verzoek om toestemming voor opzegging van de arbeidsovereenkomst gedaan voor dat tijdstip en een
      opzegging gedaan na dat tijdstip op grond van een verzoek om toestemming voor opzegging van de arbeidsovereenkomst
      gedaan voor dat tijdstip en op de gedingen die daarop betrekking hebben;

      b. op een opzegging van de arbeidsovereenkomst gedaan voor dat tijdstip en op de gedingen die daarop betrekking
      hebben; en

      c. op een geding dat is aangevangen voor dat tijdstip.

      2 [Artikel 8 van het Buitengewoon Besluit Arbeidsverhoudingen 1945][ref5], alsmede
      [artikel 30, zesde lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref6], zoals deze luidden
      voor het tijdstip van inwerkingtreding van [artikel I, onderdeel Ca][ref7], van deze wet, blijven van toepassing
      op het verzoek van een werkgever om ontheffing op grond van artikel 8, derde lid, van het Buitengewoon Besluit
      Arbeidsverhoudingen 1945 dat door Onze Minister van Sociale Zaken en Werkgelegenheid is ontvangen voor genoemd
      tijdstip, de daarop te verlenen ontheffing en maximaal drie verzoeken om aansluitende verlenging en de daarop te
      verlenen ontheffingen alsmede op de voor genoemd tijdstip verleende ontheffing en de daarop gedane verzoeken om
      aansluitende verlenging en de daarop te verlenen ontheffingen tot een maximum van drie ontheffingen.

      3 De [Wet melding collectief ontslag][ref8], zoals deze luidde voor het tijdstip van inwerkingtreding van
      [artikel IV][ref9] van deze wet, blijft van toepassing op verzoeken om toestemming voor opzegging van een
      arbeidsovereenkomst alsmede op opzeggingen die hebben plaatsgevonden voor dat tijdstip.

      4 De [artikelen 8 van de Algemene wet gelijke behandeling][ref10],
      [9 van de Wet gelijke behandeling op grond van handicap of chronische ziekte][ref11],
      [11 van de Wet gelijke behandeling op grond van leeftijd bij de arbeid][ref12] en
      [1b, vijfde lid, van de Wet gelijke behandeling van mannen en vrouwen][ref13], zoals die luidden voor het tijdstip
      van inwerkingtreding van de [artikelen XI][ref14], [XII][ref15], [XIII][ref16] en [XIV][ref17] van deze wet,
      blijven van toepassing op een beëindiging van een arbeidsverhouding voor dat tijdstip.

      5 [Artikel 104 van de Pensioenwet][ref18] en, vanaf het tijdstip van inwerkingtreding
      van [artikel I, onderdeel D, van de Wet versterking bestuur pensioenfondsen][ref19],
      [artikel 108 van de Pensioenwet][ref20], zoals deze luidden voor het tijdstip van inwerkingtreding van
      [artikel XIX][ref21] van deze wet, blijven van toepassing indien de toestemming van de kantonrechter is gevraagd
      voor dat tijdstip.

      6 Indien op grond van [artikel 6, derde lid, van de Wet sociale werkvoorziening][ref22]
      zoals dit luidde voor het tijdstip van inwerkingtreding van [artikel IX][ref23] van deze
      wet, voor dat tijdstip advies aan het Uitvoeringsinstituut werknemersverzekeringen is
      gevraagd, blijven het [Buitengewoon Besluit Arbeidsverhoudingen 1945][ref24] alsmede
      [afdeling 9 van Boek 7, titel 10 van het Burgerlijk Wetboek][ref25], zoals deze luidden voor dat tijdstip van
      inwerkingtreding, van toepassing op het advies en de opzegging en de daarop betrekking hebbende gedingen.

      7 In afwijking van de [artikelen 673][ref26] en [673a van Boek 7 van het Burgerlijk Wetboek][ref27] kan bij
      of krachtens algemene maatregel van bestuur worden bepaald dat de transitievergoeding geheel of gedeeltelijk
      niet verschuldigd is gedurende een bepaalde periode en onder bepaalde voorwaarden, indien de werknemer wegens
      de beëindiging van de arbeidsovereenkomst recht heeft op een vergoeding of voorziening, op grond van tussen de
      werkgever of verenigingen van werkgevers en de werknemer of verenigingen van werknemers voor het tijdstip van
      inwerkingtreding van [artikel I, onderdelen V en W][ref28], van deze wet gemaakte afspraken.

      8 In afwijking van [artikel 673, vierde lid, onderdeel b, van Boek 7 van het Burgerlijk Wetboek][ref29]
      worden voorafgaande arbeidsovereenkomsten niet samengeteld als zij elkaar hebben opgevolgd met tussenpozen
      van meer dan drie maanden, of een langere tussenpoos dan de tussenpoos die gold op grond van een collectieve
      arbeidsovereenkomst of regeling door of namens een daartoe bevoegd bestuursorgaan waarin toepassing is gegeven aan
      [artikel 668a, vijfde lid, van Boek 7 van het Burgerlijk Wetboek][ref30], zoals dat artikel luidde op de dag voor
      het tijdstip van inwerkingtreding van [artikel I, onderdeel N][ref31], van de Wet werk en zekerheid indien:

      a. deze zijn geëindigd voor 1 juli 2012; of

      b. deze zijn geëindigd voor 1 juli 2015 en ten hoogste zes maanden na het einde van een voorafgaande
      arbeidsovereenkomst een arbeidsovereenkomst voor onbepaalde tijd is ingegaan.


