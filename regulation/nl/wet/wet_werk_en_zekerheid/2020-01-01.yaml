  - number: XXIIb
    text: |-
      1 [Artikel 652 van Boek 7 van het Burgerlijk Wetboek][ref1], zoals dat artikel luidde op de dag voor het
      tijdstip van inwerkingtreding van [artikel I, onderdeel H][ref2], van deze wet blijft van toepassing op
      arbeidsovereenkomsten die tot stand zijn gekomen voor dat tijdstip.

      2 [Artikel 652 van Boek 7 van het Burgerlijk Wetboek][ref3], zoals dat artikel luidde op de dag voor het tijdstip
      van inwerkingtreding van [artikel I, onderdeel H][ref4], van deze wet blijft van toepassing op een op die dag
      geldende collectieve arbeidsovereenkomst of regeling door of namens een daartoe bevoegd bestuursorgaan waarin
      toepassing is gegeven aan artikel 652, lid 6, van Boek 7 van het Burgerlijk Wetboek, zoals dat artikel luidde op
      de dag voor dat tijdstip, en de arbeidsovereenkomsten waarop deze van toepassing zijn of worden, voor de duur van
      de looptijd van de collectieve arbeidsovereenkomst of regeling, maar ten hoogste gedurende achttien maanden na
      die inwerkingtreding.


