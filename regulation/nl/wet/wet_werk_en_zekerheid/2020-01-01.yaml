  - number: XXIIc
    text: |-
      Op arbeidsovereenkomsten die tot stand zijn gekomen voor de
      inwerkingtreding van [artikel I, onderdeel I, onder 1 en 2][ref1], blijft
      [artikel 653, leden 1 en 2, van Boek 7 van het Burgerlijk Wetboek][ref2], zoals dat luidde op de dag voor dat
      tijdstip van toepassing en is artikel 653, lid 3, van Boek 7 van het Burgerlijk Wetboek, zoals dat komt te luiden
      na dat tijdstip niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0035254#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel653
