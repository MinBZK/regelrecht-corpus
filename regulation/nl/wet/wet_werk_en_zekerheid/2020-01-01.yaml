  - number: XXIIa
    text: |-
      1 [Artikel 628, leden 5 tot en met 7, van Boek 7 van het Burgerlijk Wetboek][ref1], zoals dat artikel luidde
      op de dag voor het tijdstip van inwerkingtreding van [artikel I, onderdeel C][ref2], van deze wet, blijft van
      toepassing op een op die dag geldende collectieve arbeidsovereenkomst of regeling door of namens een daartoe
      bevoegd bestuursorgaan waarin toepassing is gegeven aan artikel 628, lid 7, van Boek 7 van het Burgerlijk Wetboek,
      zoals dat artikel luidde op de dag voor dat tijdstip, en de arbeidsovereenkomsten waarop deze van toepassing
      zijn of worden, voor de duur van de looptijd van de collectieve arbeidsovereenkomst of regeling, maar ten hoogste
      gedurende achttien maanden na die inwerkingtreding.

      2 [Artikel 628, leden 5 tot en met 7, van Boek 7 van het Burgerlijk Wetboek][ref3], zoals dat artikel
      luidde op de dag voor het tijdstip van inwerkingtreding van [artikel I, onderdeel C][ref4], van deze wet,
      blijft van toepassing op collectieve arbeidsovereenkomsten of regelingen door of namens daartoe bevoegde
      bestuursorganen tot en met de dag voor het tijdstip van inwerkingtreding van artikel I, onderdeel Ca, van
      deze wet, uitsluitend voor zover daarin vanwege buitengewone natuurlijke omstandigheden als bedoeld in
      [artikel 18 van de Werkloosheidswet][ref5] toepassing is gegeven aan de in artikel 628, lid 7, van Boek 7 van het
      Burgerlijk Wetboek, zoals dat luidde voor het tijdstip van inwerkingtreding van artikel I, onderdeel C, van deze
      wet opgenomen afwijkingsmogelijkheid.


