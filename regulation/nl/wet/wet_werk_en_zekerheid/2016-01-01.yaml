      [Artikel 668a van Boek 7 van het Burgerlijk Wetboek][ref1], zoals dat artikel luidde op de dag voor het tijdstip
      van inwerkingtreding van [artikel I, onderdeel N][ref2], van deze wet, blijft van toepassing op een op die dag
      geldende collectieve arbeidsovereenkomst of regeling door of namens een daartoe bevoegd bestuursorgaan waarin
      hetgeen in artikel 668a van Boek 7 van het Burgerlijk Wetboek, zoals dat artikel luidde op die dag, van toepassing
      is verklaard of waarin toepassing is gegeven aan artikel 668a, lid 5, van Boek 7 van het Burgerlijk Wetboek, zoals
      dat artikel luidde op de dag voor dat tijdstip, en de arbeidsovereenkomsten waarop deze van toepassing zijn of
      worden, voor de duur van de looptijd van de collectieve arbeidsovereenkomst of regeling, maar ten hoogste gedurende
      twaalf maanden na die inwerkingtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel668a
      [ref2]: https://wetten.overheid.nl/BWBR0035254#ArtikelI
