      van [artikel I, onderdeel N][ref2], van deze wet worden de arbeidsovereenkomst, bedoeld in het eerste lid, en
      de daaraan voorafgaande arbeidsovereenkomsten geacht elkaar niet te hebben opgevolgd, indien zij elkaar hebben
      opgevolgd met tussenpozen van meer dan drie maanden, of met tussenpozen langer dan de tussenpoos die gold op
