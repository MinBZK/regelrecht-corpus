      In afwijking van de [artikelen 673][ref1] en [673a van Boek 7 van het Burgerlijk Wetboek][ref2] kan bij of
      krachtens algemene maatregel van bestuur worden bepaald dat de transitievergoeding geheel of gedeeltelijk niet
      verschuldigd is gedurende een bepaalde periode en onder bepaalde voorwaarden, indien de werknemer wegens de
      beëindiging van de arbeidsovereenkomst recht heeft op een vergoeding of voorziening, op grond van tussen de
      werkgever of verenigingen van werkgevers en de werknemer of verenigingen van werknemers voor het tijdstip van
      inwerkingtreding van [artikel I, onderdelen V en W][ref3], van deze wet gemaakte afspraken.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel673
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel673a
      [ref3]: https://wetten.overheid.nl/BWBR0035254#ArtikelI
    url: https://wetten.overheid.nl/BWBR0035254/2016-01-01#ArtikelXXII
