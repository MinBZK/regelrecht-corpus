      In afwijking van [artikel 673, vierde lid, onderdeel b, van Boek 7 van het Burgerlijk Wetboek][ref1] worden
      voorafgaande arbeidsovereenkomsten niet samengeteld als zij elkaar hebben opgevolgd met tussenpozen van
      meer dan drie maanden, of een langere tussenpoos dan de tussenpoos die gold op grond van een collectieve
      arbeidsovereenkomst of regeling door of namens een daartoe bevoegd bestuursorgaan waarin toepassing is gegeven aan
      [artikel 668a, vijfde lid, van Boek 7 van het Burgerlijk Wetboek][ref2], zoals dat artikel luidde op de dag voor
      het tijdstip van inwerkingtreding van [artikel I, onderdeel N][ref3], van de Wet werk en zekerheid indien:


