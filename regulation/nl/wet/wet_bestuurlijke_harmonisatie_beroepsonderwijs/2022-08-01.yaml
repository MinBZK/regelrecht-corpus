$id: wet_bestuurlijke_harmonisatie_beroepsonderwijs
regulatory_layer: WET
publication_date: '2022-03-21'
valid_from: '2022-08-01'
bwb_id: BWBR0045852
url: https://wetten.overheid.nl/BWBR0045852/2022-08-01
preamble:
  text: >-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.


    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:


    Alzo Wij in overweging genomen hebben, dat het wenselijk is de bestuurlijke inrichting van het stelsel voor
    beroepsonderwijs te stroomlijnen door het agrarisch opleidingscentrum voortaan vorm te geven als een verticale
    scholengemeenschap en voor bijzondere instellingen de rechtspersoon die de instelling in stand houdt als
    normadressant in de wet aan te duiden (bestuurlijke harmonisatie beroepsonderwijs);


    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0045852/2022-08-01#ArtikelAanhef
articles:
  - number: XI
    text: >-
      Onze Minister zendt binnen 5 jaren na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0045852/2022-08-01#ArtikelXI
  - number: XIII
    text: >-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0045852/2022-08-01#ArtikelXIII
  - number: XIV
    text: 'Deze wet wordt aangehaald als: Wet bestuurlijke harmonisatie beroepsonderwijs.'
    url: https://wetten.overheid.nl/BWBR0045852/2022-08-01#ArtikelXIV
