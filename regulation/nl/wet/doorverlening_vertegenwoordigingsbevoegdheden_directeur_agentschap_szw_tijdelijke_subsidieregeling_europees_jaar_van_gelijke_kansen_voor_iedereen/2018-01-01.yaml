preamble:
  text: |-
    Gelet op artikel 22, eerste en derde lid, van het Organisatie-, mandaat- en volmachtbesluit SZW 2004;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0021838/2018-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Aan de directeur van het Agentschap SZW wordt mandaat en machtiging verleend tot het nemen van besluiten
      over en het vaststellen en ondertekenen van stukken die betrekking hebben op de uitvoering van de
      [Tijdelijke subsidieregeling Europees Jaar van gelijke kansen voor iedereen][ref1], waaronder begrepen:

      a. het verlenen en vaststellen van subsidies;

      b. beslissingen in bezwaar- en beroepsprocedures, met uitzondering van de beslissing op een beroepschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0020704
    url: https://wetten.overheid.nl/BWBR0021838/2018-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020704
  - number: '2'
    text: |-
      De directeur van het Agentschap SZW kan de bevoegdheid, bedoeld in [artikel 1, onder a][ref1], in een door hem te
      bepalen omvang doorverlenen aan onder hem ressorterende functionarissen.


      [ref1]: https://wetten.overheid.nl/BWBR0021838#Artikel1
    url: https://wetten.overheid.nl/BWBR0021838/2018-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0021838
        artikel: '1'
  - number: '3'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst en werkt terug tot en met 1 januari 2007.
    url: https://wetten.overheid.nl/BWBR0021838/2018-01-01#Artikel3
