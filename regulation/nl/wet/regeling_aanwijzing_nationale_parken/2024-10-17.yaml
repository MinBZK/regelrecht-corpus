        - Drentsche Aa;
        - Drents-Friese Wold;
        - Duinen van Texel;
        - Dwingelderveld;
        - De Groote Peel;
        - Lauwersmeer;
        - De Maasduinen;
        - De Meinweg;
        - Nieuw Land;
        - Oosterschelde;
        - De Sallandse Heuvelrug;
        - Schiermonnikoog;
        - Utrechtse Heuvelrug;
        - Weerribben-Wieden;
        - Van Gogh;
        - Zuid-Kennemerland.
    url: https://wetten.overheid.nl/BWBR0022396/2024-10-17#Artikel2
  - number: '2.2'
    text: |-
      De nationale parken, bedoeld in het eerste lid, omvatten de gebieden, zoals aangegeven op de kaarten, opgenomen in
      de bijlage bij deze regeling.
