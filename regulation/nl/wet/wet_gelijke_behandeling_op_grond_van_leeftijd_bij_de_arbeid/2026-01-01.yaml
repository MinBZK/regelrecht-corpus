$id: wet_gelijke_behandeling_op_grond_van_leeftijd_bij_de_arbeid
regulatory_layer: WET
publication_date: '2025-11-25'
valid_from: '2026-01-01'
bwb_id: BWBR0016185
url: https://wetten.overheid.nl/BWBR0016185/2026-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om ter uitvoering van de Richtlijn 2000/78/EG, tot
    instelling van een algemeen kader voor gelijke behandeling in arbeid en beroep (PbEG, 2000, L303) alsmede in
    verband met artikel 1 van de Grondwet, het maken van onderscheid op grond van leeftijd bij arbeid, beroep en
    beroepsonderwijs te verbieden;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0016185/2026-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet wordt verstaan onder:

        - onderscheid: direct en indirect onderscheid, alsmede de opdracht daartoe;
        - direct onderscheid: indien een persoon op grond van leeftijd op een andere wijze wordt behandeld dan een ander in
      een vergelijkbare situatie wordt, is of zou worden behandeld;
        - indirect onderscheid: indien een ogenschijnlijk neutrale bepaling, maatstaf of handelwijze personen met een
      bepaalde leeftijd in vergelijking met andere personen bijzonder treft.
    url: https://wetten.overheid.nl/BWBR0016185/2026-01-01#Artikel1
  - number: '2'
    text: |-
      1 Het in deze wet neergelegde verbod van onderscheid houdt mede in een verbod op intimidatie.

      2 Onder intimidatie als bedoeld in het eerste lid wordt verstaan: gedrag dat met leeftijd verband houdt en dat tot
      doel of gevolg heeft dat de waardigheid van de persoon wordt aangetast en een bedreigende, vijandige, beledigende,
      vernederende of kwetsende omgeving wordt gecreëerd.
    url: https://wetten.overheid.nl/BWBR0016185/2026-01-01#Artikel2
  - number: '3'
    text: |-
      Onderscheid is verboden bij:

      a. de aanbieding van een betrekking en de behandeling bij de vervulling van een openstaande betrekking;

      b. de arbeidsbemiddeling;

      c. het aangaan en het beëindigen van een arbeidsverhouding;

      d. het aanstellen of ontslaan van personen, op wie [artikel 3 van de Ambtenarenwet 2017][ref1] van toepassing is en
      het aanstellen of ontslaan van ambtenaren als bedoeld in de [Ambtenarenwet BES][ref2];

      e. de arbeidsvoorwaarden;

      f. het laten volgen van onderwijs, scholing en vorming tijdens of voorafgaand aan een arbeidsverhouding;

      g. de bevordering en

      h. de arbeidsomstandigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0028215
    url: https://wetten.overheid.nl/BWBR0016185/2026-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001947
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0028215
  - number: '4'
    text: |-
      Onderscheid is verboden met betrekking tot de voorwaarden voor en de toegang tot het vrije beroep en de
      mogelijkheden tot uitoefening van en ontplooiing binnen het vrije beroep.
    url: https://wetten.overheid.nl/BWBR0016185/2026-01-01#Artikel4
  - number: '5'
    text: |-
      Onderscheid is verboden bij:

      a. het verlenen van toegang tot en het geven van loopbaanoriëntatie en beroepskeuzevoorlichting;

      b. het verlenen van toegang tot, het aanbieden van, het afnemen van toetsen tijdens en het afsluiten van onderwijs
      dat gericht is op de toetreding tot en het functioneren op de arbeidsmarkt.
    url: https://wetten.overheid.nl/BWBR0016185/2026-01-01#Artikel5
  - number: '6'
    text: |-
      Onderscheid is verboden bij het lidmaatschap van of de betrokkenheid bij een werkgevers- of werknemersorganisatie
      of een vereniging van beroepsgenoten. Dit geldt ook voor de voordelen die voortvloeien uit het lidmaatschap van
      deze organisaties en verenigingen.
    url: https://wetten.overheid.nl/BWBR0016185/2026-01-01#Artikel6
  - number: '7'
    text: |-
      1 Het verbod van onderscheid geldt niet indien het onderscheid:

      a. gebaseerd is op werkgelegenheids- of arbeidsmarktbeleid ter bevordering van arbeidsparticipatie van bepaalde
      leeftijdscategorieën, voor zover dit beleid is vastgesteld bij of krachtens wet;

      b. betrekking heeft op het beëindigen van een arbeidsverhouding of van het dienstverband van een ambtenaar
      in verband met het bereiken van de leeftijd waarop op grond van de [Algemene Ouderdomswet][ref1] recht op
      ouderdomspensioen ontstaat, of van een bij of krachtens wet vastgestelde of tussen partijen overeengekomen hogere
      leeftijd;

      c. anderszins objectief gerechtvaardigd is door een legitiem doel en de middelen voor het bereiken van dat doel
      passend en noodzakelijk zijn.

      2 Het eerste lid is niet van toepassing in geval van intimidatie als bedoeld in [artikel 2][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002221
      [ref2]: https://wetten.overheid.nl/BWBR0016185#Artikel2
    url: https://wetten.overheid.nl/BWBR0016185/2026-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002221
      - id: ref2
        bwb_id: BWBR0016185
        artikel: '2'
        paragraaf: '1'
  - number: '8'
    text: |-
      1 Voor de toepassing van dit artikel wordt verstaan onder pensioenvoorziening: een pensioenvoorziening ten behoeve
      van een of meer personen, uitsluitend in verband met hun werkzaamheden in een onderneming, bedrijfstak, tak
      van beroep of openbare dienst, in aanvulling op een wettelijk stelsel van sociale zekerheid en, ingeval van een
      voorziening ten behoeve van een persoon, anders dan door die persoon zelf tot stand gebracht.

      2 Het verbod van onderscheid is niet van toepassing op in pensioenvoorzieningen vastgelegde toetredingsleeftijden
      en op pensioengerechtigde leeftijden, alsmede op de vaststelling van verschillende toetredings- en
      pensioengerechtigde leeftijden voor werknemers of voor groepen of categorieën van werknemers.
    url: https://wetten.overheid.nl/BWBR0016185/2026-01-01#Artikel8
  - number: '9'
    text: |-
      Indien bij een openlijke aanbieding van een betrekking onderscheid op grond van leeftijd wordt gemaakt, wordt de
      grond daarvan uitdrukkelijk vermeld.
    url: https://wetten.overheid.nl/BWBR0016185/2026-01-01#Artikel9
  - number: '10'
    text: |-
      Het is verboden om personen te benadelen wegens het feit dat zij in of buiten rechte een beroep hebben gedaan op
      deze wet of terzake bijstand hebben verleend.
    url: https://wetten.overheid.nl/BWBR0016185/2026-01-01#Artikel10
  - number: '11'
    text: |-
      In geval van een beëindiging van de arbeidsverhouding door de werkgever in strijd met [artikel 3][ref1],
      of wegens de omstandigheid dat de werknemer in of buiten rechte een beroep heeft gedaan op deze wet
      of ter zake bijstand heeft verleend, is [artikel 681 van Boek 7 van het Burgerlijk Wetboek][ref2] of
      [artikel 1615s van Boek 7a van het Burgerlijk Wetboek BES][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0016185#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel681
      [ref3]: https://wetten.overheid.nl/BWBR0028752#Artikel1615s
    url: https://wetten.overheid.nl/BWBR0016185/2026-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0016185
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '681'
      - id: ref3
        bwb_id: BWBR0028752
        artikel: 1615s
  - number: '12'
    text: |-
      1 Indien degene die meent dat te zijnen nadeel een onderscheid is of wordt gemaakt als bedoeld in deze wet, in
      rechte feiten aanvoert die dat onderscheid kunnen doen vermoeden, dient de wederpartij te bewijzen dat niet in
      strijd met deze wet is gehandeld.

      2 Het eerste lid is van overeenkomstige toepassing op vorderingen als
      bedoeld in [artikel 305a van Boek 3 van het Burgerlijk Wetboek][ref1] of
      [artikel 305a van Boek 3 van het Burgerlijk Wetboek BES][ref2] en op beroepen ingesteld door
      belanghebbenden in de zin van [artikel 1:2, derde lid, van de Algemene wet bestuursrecht][ref3] of
      [artikel 7, eerste lid, derde zin, van de Wet administratieve rechtspraak BES][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel305a
      [ref2]: https://wetten.overheid.nl/BWBR0028745#Artikel305a
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0028455#Artikel7
    url: https://wetten.overheid.nl/BWBR0016185/2026-01-01#Artikel12
    references:
