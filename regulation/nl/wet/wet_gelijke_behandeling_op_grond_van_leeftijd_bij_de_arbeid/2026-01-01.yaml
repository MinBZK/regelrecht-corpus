  - number: '13'
    text: Bedingen in strijd met deze wet zijn nietig.
    url: https://wetten.overheid.nl/BWBR0016185/2026-01-01#Artikel13
  - number: '14'
    text: |-
      De [artikelen 1 tot en met 13][ref1] van deze wet zijn mede van toepassing in de openbare lichamen Bonaire, Sint
      Eustatius en Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0016185#Artikel1
    url: https://wetten.overheid.nl/BWBR0016185/2026-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0016185
        artikel: '1'
        paragraaf: '1'
  - number: '15'
    text: |-
      Onze Minister van Sociale Zaken en Werkgelegenheid zendt in overeenstemming met Onze Ministers van Justitie,
      van Binnenlandse Zaken en Koninkrijksrelaties en van Onderwijs, Cultuur en Wetenschap binnen vijf jaar na de
      inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze
      wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0016185/2026-01-01#Artikel15
  - number: '16'
    text: |-
      Het in deze wet neergelegde verbod van onderscheid is tot 2 december 2006 niet van toepassing op onderscheid dat
      betrekking heeft op het beëindigen van een arbeidsverhouding of het dienstverband van een ambtenaar in verband met
      het bereiken van een bij arbeidsovereenkomst overeengekomen, een bij een toezegging omtrent pensioen toegezegde,
      of een bij regeling van een daartoe bevoegd bestuursorgaan vastgestelde pensioengerechtigde leeftijd lager
      dan de AOW-gerechtigde leeftijd, voorzover die leeftijd voor de datum van inwerkingtreding van deze wet in de
      arbeidsovereenkomst, de toezegging omtrent pensioen of de regeling van het bestuursorgaan was opgenomen.
    url: https://wetten.overheid.nl/BWBR0016185/2026-01-01#Artikel16
  - number: '17'
    text: |-
      Het in deze wet neergelegde verbod van onderscheid is niet van toepassing ten aanzien van militaire ambtenaren
      als bedoeld in [artikel 1 van de Militaire Ambtenarenwet 1931][ref1] tot 1 januari 2008, of tot een eerdere
      datum waarop in de [Militaire ambtenarenwet 1931][ref2] een regeling is getroffen ten aanzien van het gebruik van
      leeftijdsgrenzen binnen de krijgsmacht betreffende aanstelling, functietoewijzing, aanwijzing voor een opleiding
      en ontslag.


      [ref1]: https://wetten.overheid.nl/BWBR0001952#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0001952
    url: https://wetten.overheid.nl/BWBR0016185/2026-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001952
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0001952
  - number: '20'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0016185/2026-01-01#Artikel20
  - number: '21'
    text: 'Deze wet wordt aangehaald als: Wet gelijke behandeling op grond van leeftijd bij de arbeid.'
    url: https://wetten.overheid.nl/BWBR0016185/2026-01-01#Artikel21
