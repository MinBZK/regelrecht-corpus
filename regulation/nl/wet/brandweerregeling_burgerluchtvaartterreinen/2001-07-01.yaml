---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: brandweerregeling_burgerluchtvaartterreinen
regulatory_layer: WET
publication_date: '1994-12-23'
valid_from: '2001-07-01'
bwb_id: BWBR0007138
url: https://wetten.overheid.nl/BWBR0007138/2001-07-01
preamble:
  text: |-
    Gelet op artikel 129, vijfde lid van de Regeling Toezicht Luchtvaart;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

            a
            alarmregeling:

              het samenstel van maatregelen, dat is voorbereid, in geval van een ongeval of voorval op of in de
      onmiddellijke omgeving van het luchtvaartterrein;



            b
            blusstof:

              een vaste, vloeibare of gasvormige stof geschikt voor het blussen van branden;



            c
            brandrisicoklasse:

              de risicoklassen waarin een luchtvaartterrein met betrekking tot de brandweervoorzieningen wordt ingedeeld
      aan de hand van het aantal en de afmetingen van de vliegtuigen welke van het luchtvaartterrein gebruik maken of
      de risicoklassen waarin een vliegtuig met betrekking tot de brandbestrijding wordt ingedeeld aan de hand van de
      totale lengte en rompbreedte van dat vliegtuig;



            d
            brandweervoertuigen:

              voertuigen, die voor het gebruik bij de brandweer op luchtvaartterreinen, zijn gebouwd, ingericht of
      uitgerust;



            e
            brandweervoorzieningen:

              het personeel en de middelen aanwezig op het luchtvaartterrein voor het redden van mens en dier en voor het
      voorkomen, beperken en bestrijden van brand bij ongevallen met luchtvaartuigen;



            f
            gecontroleerd luchtvaartterrein:

              een luchtvaartterrein, waar luchtverkeersleiding wordt gegeven aan luchtvaartterreinverkeer;



            g
            meldingspost:

              de plaats op het luchtvaartterrein waar alle berichten voor de brandweer binnenkomen en worden verwerkt;



            h
            notice to airmen (NOTAM):

              bericht aan luchtvarenden



            i
            opkomsttijd:

              het tijdsverloop tussen de eerste melding van een luchtvaartongeval aan de brandweer en de aankomst van de
      brandweervoorzieningen met de minimum vereiste capaciteit;



            j
            onmiddellijke omgeving van het luchtvaartterrein:

              een in overleg met de lokale overheid vastgesteld gebied buiten een luchtvaartterrein;



            k
            svm:

              schuimvormend middel voor de produktie van blusschuim;



            l
            uitruksterkte:

              brandweerpersoneel en -materieel benodigd om de repressieve taak naar behoren uit te kunnen voeren;



            m
            vliegtuigbeweging:

              een landing of opstijging van een vliegtuig
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel1
  - number: '2'
    text: |-
      De bepalingen in deze regeling zijn van toepassing op alle voor het openbaar luchtverkeer met burgerluchtvaartuigen
      aangewezen luchtvaartterreinen in Nederland, met uitzondering van terreinen welke uitsluitend zijn ingericht voor
      het gebruik van hefschroefvliegtuigen.
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel2
  - number: '3.1'
    text: |-
      De exploitant draagt zorg voor de vaststelling van een alarmregeling met inachtneming van de overige wettelijke
      bepalingen terzake van het bestrijden van ongevallen en rampen.
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel3
  - number: '3.2'
    text: 'De alarmregeling van een luchtvaartterrein bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel3
  - number: 3.2.a
    text: begripsomschrijvingen;
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel3
  - number: 3.2.b
    text: een overzicht van de luchtvaartongevallen en overige voorvallen waarop de alarmregeling van toepassing is;
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel3
  - number: 3.2.c
    text: |-
      een overzicht van diensten, instanties, organisaties en individuele personen, die bij de bestrijding van de in punt
      b genoemde gevallen kunnen of moeten worden betrokken;
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel3
  - number: 3.2.d
    text: |-
      een overzicht waarin de leiding over en de gecoördineerde inzet van diensten en organisaties is weergegeven,
      gerelateerd aan de onder punt b genoemde gevallen;
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel3
  - number: 3.2.e
    text: |-
      een overzicht van de taken en verantwoordelijkheden van de functionarissen, diensten en organisaties per geval als
      bedoeld onder punt b;
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel3
  - number: 3.2.f
    text: een intern en extern verbindings- en alarmschema;
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel3
  - number: 3.2.g
    text: een overzichtskaart van het luchtvaartterrein en de onmiddellijke omgeving voorzien van een coördinatenstelsel;
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel3
  - number: 3.2.h
    text: regels over de verslaglegging;
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel3
  - number: 3.2.i
    text: een verzendlijst, in ieder geval bevattende de onder c genoemden en de Minister van Verkeer en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel3
  - number: '3.3'
    text: |-
      De exploitant overlegt over het ontwerp met de in het tweede lid onder c van dit artikel bedoelde diensten,
      instanties, organisaties en personen.
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel3
  - number: '3.4'
    text: |-
      Vóór de vaststelling van de alarmregeling wordt tevens overleg gepleegd met de burgemeester van de gemeente
      waarbinnen het luchtvaartterrein is gelegen.
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel3
  - number: '3.5'
    text: |-
      De alarmregeling wordt binnen 1 maand na vaststelling of wijziging aan de Minister van Verkeer en Waterstaat
      aangeboden.
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel3
  - number: '3.6'
    text: |-
      De Minister van Verkeer en Waterstaat kan de exploitant opdragen de vastgestelde alarmregeling binnen een door
      hem te bepalen termijn te wijzigen indien hij van oordeel is deze niet voldoet aan de eisen van het onderhavige
      artikel.
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel3
  - number: '4.1'
    text: |-
      Bij inwerkingtreding van de alarmregeling moet over een ruimte kunnen worden beschikt van waaruit de algehele
      leiding en coördinatie kan plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel4
  - number: '4.2'
    text: |-
      De ruimte bedoeld in het eerste lid is of kan worden voorzien van de benodigde verbindingsmiddelen om contact te
      kunnen houden met de eigen eenheden en de bijstandverlenende instanties.
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel4
  - number: '5.1'
    text: |-
      Zo spoedig mogelijk na vaststelling maar tenminste éénmaal per jaar wordt de alarmregeling op haar bruikbaarheid
      getoetst.
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel5
  - number: '5.2'
    text: |-
      Op luchtvaartterreinen ingedeeld in brandrisicoklasse 3 en hoger vindt de toets als bedoeld in het eerste lid
      éénmaal in de twee jaar plaats in de vorm van een praktische oefening, waarbij een waarnemer van de divisie
      Luchtvaart van de Inspectie Verkeer en Waterstaat wordt uitgenodigd.
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel5
  - number: '5.3'
    text: |-
      Bij de uitvoering en de evaluatie van de bruikbaarheidstoets worden de diensten en organisaties, als bedoeld in
      [artikel 3, tweede lid onder c][ref1], betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0007138#Artikel3
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007138
        artikel: '3'
  - number: '6.1'
    text: De exploitant van een luchtvaartterrein stelt voor het luchtvaartterrein een brandrisicoklasse vast.
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel6
  - number: '6.2'
    text: |-
      De brandrisicoklasse wordt vastgesteld aan de hand van het aantal vliegtuigbewegingen van de vliegtuigen
      met de hoogste brandrisicoklasse, welke gedurende de drie drukste opeenvolgende maanden van het jaar van het
      luchtvaartterrein gebruik maken.
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel6
  - number: '6.3'
    text: |-
      Indien in deze drie maanden het aantal vliegtuigbewegingen van vliegtuigen met de hoogste brandrisicoklasse 700
      of meer bedraagt, krijgt het luchtvaartterrein dezelfde brandrisicoklasse als de vliegtuigen bedoeld in het vorige
      lid.
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel6
  - number: '6.4'
    text: |-
      Indien in deze drie maanden het aantal vliegtuigbewegingen van vliegtuigen met de hoogste brandrisicoklasse
      700 of minder bedraagt, krijgt het luchtvaartterrein een brandrisicoklasse welke één klasse lager ligt dan de
      brandrisicoklasse van de vliegtuigen bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel6
  - number: '6.5'
    text: |-
      Tijdens perioden van verminderde vliegtuigbewegingen kan de exploitant voor het luchtvaartterrein een
      brandrisicoklasse vaststellen overeenkomstig de brandrisicoklasse van het grootste vliegtuig dat in deze periode
      het luchtvaartterrein gebruikt, ongeacht het aantal vliegtuigbewegingen.
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel6
  - number: '6.6'
    text: |-
      Vaststelling en wijziging van de brandrisicoklasse van het luchtvaartterrein maakt de exploitant bekend aan de
      Minister van Verkeer en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel6
  - number: '6.7'
    text: |-
      Deze vaststelling of wijziging van de brandrisicoklasse wordt gemeld in de desbetreffende luchtvaartpublicaties. In
      spoedeisende gevallen wordt een NOTAM uitgegeven.
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel6
  - number: '6.8'
    text: |-
      Indien de Minister van Verkeer en Waterstaat van mening is dat de brandrisicoklasse van het luchtvaartterrein niet
      overeenkomstig dit artikel is vastgesteld kan hij de exploitant opdragen de brandrisicoklasse te wijzigen, waartoe
      de exploitant zo spoedig mogelijk dient over te gaan.
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel6
  - number: '7.1'
    text: |-
      Tijdens de openstellingsuren van een luchtvaartterrein is voor de uitruksterkte tenminste het aantal personen
      aanwezig genoemd in tabel 1 van [bijlage A][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007138
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007138
  - number: '7.2'
    text: |-
      De exploitant treft zodanige voorzieningen dat de vereiste kennis en vaardigheid van het in het vorige lid bedoelde
      personeel voldoet aan de eisen opgenomen in [bijlage A][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007138
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007138
  - number: '7.3'
    text: |-
      Op aanwijzing van de Minister van Verkeer en Waterstaat dient de geoefendheid van het in het tweede lid bedoelde
      personeel te worden getoond.
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel7
  - number: '7.4'
    text: |-
      De exploitant kan de personen, bedoeld in het eerste lid van dit artikel, afhankelijk van de omstandigheden, met
      andere taken belasten mits deze niet strijdig zijn met hun taakuitvoering en paraatheid.
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel7
  - number: '8.1'
    text: |-
      Het brandweer- en reddingsmaterieel op luchtvaartterreinen bestaat tenminste uit brandweervoertuigen zoals
      opgenomen in [bijlage B][ref1] en eventueel voorgeschreven bijzonder materieel.


      [ref1]: https://wetten.overheid.nl/BWBR0007138
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0007138
  - number: '8.2'
    text: |-
      De voorgeschreven brandweervoertuigen bezitten zodanige eigenschappen dat onder de gemiddelde weers- en
      terreinomstandigheden op of in de onmiddellijke omgeving van het luchtvaartterrein kan worden geopereerd.
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel8
  - number: '8.3'
    text: |-
      Een luchtvaartterrein dat tussen zonsondergang en zonsopgang is opengesteld beschikt, ten behoeve van opsporings-
      en reddingswerkzaamheden alsmede voor de verlichting van het werkterrein, over adequate verlichtingsmiddelen.
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel8
  - number: '8.4'
    text: |-
      Bij aanwezigheid van waterrijke of drassige gebieden op of in de onmiddellijke omgeving van het luchtvaartterrein
      draagt de exploitant zorg voor voldoende en doelmatige reddingsmiddelen.
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel8
  - number: '8.5'
    text: |-
      Op ten minste één van de voertuigen opgenomen in [bijlage B][ref1] is adequaat redgereedschap aanwezig voor de
      onmiddellijke hulpverlening.


      [ref1]: https://wetten.overheid.nl/BWBR0007138
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0007138
  - number: '8.6'
    text: |-
      Op gecontroleerde luchtvaartterreinen en luchtvaartterreinen waarvan de brandrisicoklasse 4 of hoger bedraagt, zijn
      de brandweervoertuigen voorzien van adequate verbindingsapparatuur voor het onderhouden van contact met ten minste:
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel8
  - number: 8.6.a
    text: de brandweervoertuigen onderling;
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel8
  - number: 8.6.b
    text: de meldingspost;
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel8
  - number: 8.6.c
    text: de plaatselijke verkeersleidingsdienst.
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel8
  - number: '8.7'
    text: Het brandweerpersoneel beschikt over een uitrusting die zijn persoonlijke bescherming zo goed mogelijk waarborgt.
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel8
  - number: '8.8'
    text: Voor het materieel en de middelen bedoeld in de vorige leden kunnen nadere voorwaarden worden gegeven.
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel8
  - number: '9.1'
    text: |-
      Indien door bijzondere omstandigheden niet aan de eisen van [artikel 6][ref1] kan worden voldaan, kunnen afwijkende
      brandweervoorzieningen op het luchtvaartterrein worden vastgesteld. Voorstellen hiertoe worden door de exploitant
      aan de Minister van Verkeer en Waterstaat ter toestemming voorgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0007138#Artikel6
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007138
        artikel: '6'
  - number: '9.2'
    text: |-
      Bij een onvoorziene wijziging van 2 uur of minder in de brandweervoorzieningen worden de gezagvoerders van de
      luchtvaartuigen, welke van het luchtvaartterrein gebruik willen maken, hiervan onmiddellijk op de hoogte gesteld.
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel9
  - number: '10'
    text: |-
      De vereiste brandweervoorzieningen zijn tijdens de openstellingsuren van het luchtvaartterrein en tenminste tot 15
      minuten na de werkelijke vertrektijd van het laatste luchtvaartuig aanwezig.
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel10
  - number: '11.1'
    text: |-
      De brandweervoertuigen zijn ten minste voorzien van een hoeveelheid blusstof bestaande uit water met een
      bijbehorende hoeveelheid svm alsmede aanvullende blusstof, zoals aangegeven in [bijlage B][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007138
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0007138
  - number: '11.2'
    text: |-
      De afgifte van water vermengd met svm bedraagt per minuut zoveel als aangegeven in [bijlage B][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007138
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0007138
  - number: '11.3'
    text: |-
      Om de brandweervoertuigen na of tijdens een actie zo snel mogelijk weer gebruiksgereed te maken zijn op het
      luchtvaartterrein een reserve hoeveelheid svm en aanvullende blusstoffen beschikbaar ten minste gelijk aan de in
      [bijlage B][ref1] genoemde hoeveelheden.


      [ref1]: https://wetten.overheid.nl/BWBR0007138
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0007138
  - number: '11.4'
    text: |-
      Op luchtvaartterreinen worden voldoende waterwinplaatsen aangebracht, waaruit minstens 1000 liter water per minuut
      kan worden onttrokken.
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel11
  - number: '11.5'
    text: |-
      Ten aanzien van de kwaliteit van de in de voorgaande leden bedoelde blusstoffen worden nadere eisen gesteld in
      [bijlage C][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007138
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0007138
  - number: '11.6'
    text: |-
      In de hoeveelheden blusstof als genoemd in het eerste, derde of vierde lid zijn niet begrepen de voor het houden
      van oefeningen benodigde blusstoffen.
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel11
  - number: '12.1'
    text: |-
      De opkomsttijd tot aan de baaneinden van elk der banen bedraagt niet meer dan drie minuten, onder optimale zicht-
      en terreinomstandigheden.
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel12
  - number: '12.2'
    text: |-
      Nadere voorwaarden kunnen worden gegeven voor de geleiding van reddings- en brandweervoertuigen tijdens beperkte
      zichtomstandigheden.
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel12
  - number: '13.1'
    text: |-
      Het materieel bedoeld in [artikel 8][ref1] wordt ondergebracht in een deugdelijke stallingsruimte, welke zodanig is
      geconstrueerd en ingericht dat de brandweervoertuigen bij alarmering onmiddellijk kunnen uitrukken.


      [ref1]: https://wetten.overheid.nl/BWBR0007138#Artikel8
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0007138
        artikel: '8'
  - number: '13.2'
    text: |-
      De stallingsruimte van het materieel is zodanig gelegen dat de brandweervoertuigen een onbelemmerde toegang hebben
      tot het landingsterrein.
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel13
  - number: '13.3'
    text: 'Indien een meldingspost aanwezig is beschikt deze tenminste over de volgende voorzieningen:'
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel13
  - number: 13.3.a
    text: |-
      alarmregeling zoals genoemd in [artikel 3][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007138#Artikel3
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0007138
        artikel: '3'
  - number: 13.3.b
    text: een systeem ter alarmering van het brandweerpersoneel;
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel13
  - number: 13.3.c
    text: een directe lijnverbinding met de plaatselijke verkeersleidingsdienst (voor zover van toepassing);
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel13
  - number: 13.3.d
    text: voorzieningen ter alarmering van de in de alarmregeling genoemde instanties;
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel13
  - number: 13.3.e
    text: apparatuur voor draadloze verbinding met de brandweervoertuigen die uitrukken;
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel13
  - number: 13.3.f
    text: middelen om alle desbetreffende berichtgeving vast te leggen, en,
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel13
  - number: 13.3.g
    text: |-
      een naslagsysteem van alle typen luchtvaartuigen welke in de regel van het terrein gebruik maken, zodat
      bijzonderheden direct kunnen worden doorgegeven.
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel13
  - number: '13.4'
    text: De meldingspost is tijdens de openstellingsuren van het luchtvaartterrein bezet door terzake kundig personeel.
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel13
  - number: '14.1'
    text: |-
      De exploitant draagt zorg voor uitvalswegen op en in de onmiddellijke omgeving van het luchtvaartterrein voor zover
      de infrastructuur of de terreinomstandigheden dit toelaten.
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel14
  - number: '14.2'
    text: |-
      De in het eerste lid bedoelde uitvalswegen zijn toegankelijk voor het brandweer- en reddingsmaterieel als bedoeld
      in [artikel 8, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007138#Artikel8
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0007138
        artikel: '8'
  - number: '14.3'
    text: |-
      Indien de in het eerste lid bedoelde uitvalswegen niet te onderscheiden zijn van hun directe omgeving moeten
      bermmarkeringen worden aangebracht.
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel14
  - number: '15.1'
    text: 'Tijdens de grondafhandeling van luchtvaartuigen zijn aanwezig:'
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel15
  - number: 15.1.a
    text: voor onmiddellijk gebruik geschikte blusstoffen ter bestrijding van vloeistofbranden, en
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel15
  - number: 15.1.b
    text: deskundige personeelsleden voor de bestrijding van vloeistofbranden.
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel15
  - number: '15.2'
    text: Bij een brand of een omvangrijke brandstoflekkage kan de brandweer snel worden gealarmeerd.
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel15
  - number: '15.3'
    text: |-
      Tijdens brandstofhandelingen aan een luchtvaartuig met passagiers aan boord dan wel tijdens in- of uitstappen van
      passagiers is het afhandelingsmaterieel zodanig opgesteld dat het gebruik van voldoende uitgangen voor een snelle
      evacuatie met een onbelemmerde vluchtweg mogelijk is.
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel15
  - number: '16.1'
    text: |-
      Elke drie maanden brengt de exploitant verslag uit aan de Minister van Verkeer en Waterstaat over de toestand van
      het luchtvaartterrein.
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel16
  - number: '16.2'
    text: 'In het verslag wordt opgenomen:'
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel16
  - number: 16.2.a
    text: de van belang zijnde wijzigingen met betrekking tot het personeel;
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel16
  - number: 16.2.b
    text: de toestand van materieel en middelen, en
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel16
  - number: 16.2.c
    text: overige bijzonderheden de brandweer betreffende.
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel16
  - number: '16.2'
    text: In het verslag van het eerste kwartaal wordt de uitruksterkte opgeven naar de toestand op 1 januari van dat jaar.
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel16
  - number: '16.1'
    text: |-
      Van ieder voorval met een luchtvaartuig op of in de onmiddellijke omgeving van het luchtvaartterrein, waarbij de
      brandweer daadwerkelijk is uitgerukt, dient een register te worden bijgehouden waarin wordt vermeld:
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel16
  - number: 16.1.a
    text: datum en tijd van de alarmering;
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel16
  - number: 16.1.b
    text: tijd ter plaatse;
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel16
  - number: 16.1.c
    text: aard alarmering;
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel16
  - number: 16.1.d
    text: eigenaar van het luchtvaartuig;
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel16
  - number: 16.1.e
    text: type luchtvaartuig;
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel16
  - number: 16.1.f
    text: de genomen acties.
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel16
  - number: '16.2'
    text: |-
      Een afschrift van dit register dient aan het verslag, zoals bedoeld in [artikel 15][ref1], te worden toegevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0007138#Artikel15
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0007138
        artikel: '15'
  - number: '16.3'
    text: |-
      Indien de brandweer daadwerkelijk reddingsacties heeft verricht dan wel brand heeft voorkomen, beperkt of bestreden
      wordt door de exploitant een rapport opgemaakt zoals weergegeven in bijlage D.
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel16
  - number: '16.4'
    text: Het rapport wordt binnen 7 dagen aan de directeur-generaal aangeboden.
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel16
  - number: '17'
    text: De regeling van de directeur-generaal van 13 februari 1985, nr. LT/L/20565, wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel17
  - number: '18'
    text: Deze regeling treedt in werking met ingang van 1 januari 1995.
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel18
  - number: '19'
    text: 'De regeling wordt aangehaald als volgt: Brandweerregeling Burgerluchtvaartterreinen.'
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel19
  - number: BA:1.1.1
    text: |-
      Voor actieve dienst bij de brandweer op luchtvaartterreinen komt in aanmerking hij/zij die voldoet aan de
      keuringseisen voor brandweerpersoneel, zoals vastgelegd door het Ministerie van Binnenlandse Zaken.
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel1
  - number: BA:1.1.2
    text: Door de exploitant kunnen aanvullende eisen worden gesteld voor zover nodig voor een juiste dienstvervulling.
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel1
  - number: BA:2.2.1
    text: |-
      Voor luchtvaartterreinen in de brandrisicoklasse 1 en 2 kan het personeel voor de brandweer geselecteerd worden uit
      het dienstdoend personeel van de havendienst, zonodig aangevuld met op het luchtvaartterrein aanwezige personeel
      van bedrijven, vliegclubs etc.
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel2
  - number: BA:2.2.2
    text: |-
      Voor luchtvaartterreinen in de brandrisicoklasse 3 t/m 9 zijn ten aanzien van de aanstellings- en bevorderingseisen
      voor het brandweerpersoneel de artikelen 2, 3, 4.a.1° t/m 4°, 6 en 7 Besluit Brandweerpersoneel, van
      overeenkomstige toepassing, met dien verstande dat onder bevoegd gezag, in deze, de exploitant wordt verstaan.
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel2
  - number: BA:2.2.3
    text: |-
      De exploitant draagt er zorg voor dat het brandweerpersoneel een opleiding volgt voor rijkscertificaten en
      rijksdiploma, s overeenkomstig het gestelde in tabel 1 behorende bij deze Bijlage.
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel2
  - number: BA:3.3.1
    text: |-
      Naast de algemene opleiding als bedoeld in punt 2.3 dient het brandweerpersoneel zich te bekwamen in de specifieke
      kennis met betrekking tot de bestrijding van vliegtuigbranden, alsmede het redden van personen betrokken bij een
      vliegtuigongeval.
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel3
  - number: BA:3.3.2
    text: |-
      Voor luchtvaartterreinen in de brandrisicoklasse 1 en 2 dient het personeel mede belast met de repressieve
      brandweerdienst, tenminste jaarlijks in de gelegenheid te worden gesteld de specifieke brandweerkennis voor
      luchtvaartterreinen op peil te houden middels een daarvoor door de Minister van Verkeer en Waterstaat geaccepteerde
      opleiding.
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel3
  - number: BA:3.3.3
    text: |-
      Voor de overige brandrisicoklassen dient, aansluitend op de verplichte modules, de module vliegtuigbrandbestrijding
      behorende bij het desbetreffende niveau, met goed gevolg te zijn afgesloten.
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel3
  - number: BA:4.4.1
    text: |-
      Door de Minister van Verkeer en Waterstaat kan met betrekking tot de specifieke kennis en vaardigheid ten aanzien
      van het bestrijden van vliegtuigbranden voor personeel van luchtvaartterreinen in de brandrisicoklasse 1 en 2 een
      bewijs van bekwaamheid worden afgegeven.
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel4
  - number: BA:4.4.2
    text: |-
      Voor de overige brandrisicoklassen dient een examen ter beoordeling van de kennis en bedrevenheid van het
      brandweerpersoneel op luchtvaartterreinen in het bestrijden van vliegtuigbranden en het redden van mensenlevens
      conform de vigerende examenregelgeving die door het Ministerie van Binnenlandse Zaken voor het brandweerpersoneel
      is vastgesteld ter verkrijging van rijkscertificaten en rijksdiploma's.
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel4
  - number: BA:5.5.1
    text: |-
      De kennis en bedrevenheid van het brandweerpersoneel wordt geregeld door middel van lessen en oefeningen op een zo
      hoog mogelijk peil gehouden. De lessen en oefeningen bevatten tenminste de volgende onderwerpen:
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel5
  - number: BA:5.5.1.a
    text: vliegtuigkennis;
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel5
  - number: BA:5.5.1.b
    text: specifieke blusstoffen voor vliegtuigbrandbestrijding
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel5
  - number: BA:5.5.1.c
    text: specifiek materieel voor vliegtuigbrandbestrijding;
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel5
  - number: BA:5.5.1.d
    text: terreinkennis van het luchtvaartterrein en de onmiddellijke omgeving;
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel5
  - number: BA:5.5.1.e
    text: specifieke brandbestrijdingstechniek en tactiek;
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel5
  - number: BA:5.5.1.f
    text: de op het luchtvaartterrein geldende radioprocedures;
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel5
  - number: BA:5.5.1.g
    text: de van toepassing zijnde luchtvaartwetgeving.
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel5
  - number: BA:5.5.2
    text: |-
      Indien het luchtvaartterrein ook 's nachts is opengesteld voor het luchtverkeer vinden ook 's nachts praktische
      oefeningen plaats.
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel5
  - number: BA:5.5.3
    text: |-
      De exploitant van een luchtvaartterrein stelt een oefenprogramma voor het brandweerpersoneel vast, afgestemd op het
      soort en de hoeveelheid luchtverkeer, dat in de regel van het luchtvaartterrein gebruik maakt.
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel5
  - number: BA:5.5.4
    text: 'De oefenfrequentie moet voldoende hoog zijn om te waarborgen, dat elk lid van de repressieve brandweerdienst:'
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel5
  - number: BA:5.5.4.a
    text: bekwaam is in het uitvoeren van de hem toegewezen taken en functies in geval van een ongeval met een luchtvaartuig;
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel5
  - number: BA:5.5.4.b
    text: |-
      geoefend en bekwaam is in het gebruik van het materieel en de uitrusting ten behoeve van het bestrijden van brand
      en het redden van mensenlevens;
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel5
  - number: BA:5.5.4.c
    text: |-
      bekend is met de aan andere leden van zijn groep toegewezen taken voorzover dit voor de uitvoering van zijn eigen
      taak nodig is.
    url: https://wetten.overheid.nl/BWBR0007138/2001-07-01#Artikel5
  - number: BA:6
    text: |-
      Het personeel belast met de algehele leiding, de repressieve dienst en de minimale personele bezetting van de
      brandweer op een luchtvaartterrein dient te voldoen aan het gestelde in tabel 1 behorende bij deze bijlage.

