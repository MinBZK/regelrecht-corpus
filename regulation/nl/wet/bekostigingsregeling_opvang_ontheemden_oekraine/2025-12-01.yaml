    text: |-
      1 Gemeenten ontvangen:

      a. tot 15 oktober 2022, ter bekostiging van de kosten, bedoeld in [artikel 2, eerste lid, onderdeel a][ref1], een
      normbedrag van € 100 per dag per gerealiseerde opvangplek;

      b. met ingang van 15 oktober 2022, ter bekostiging van de kosten, bedoeld in
      [artikel 2, eerste lid, onderdeel a][ref2], een normbedrag van € 83 per dag per gerealiseerde opvangplek;

      c. met ingang van 1 januari 2024, ter bekostiging van de kosten, bedoeld in
      [artikel 2, eerste lid, onderdelen a en f][ref3], een normbedrag van € 61 per dag per gerealiseerde opvangplek;

      d. met ingang van 1 januari 2025, ter bekostiging van de kosten, bedoeld in
      [artikel 2, eerste lid, onderdelen a en f][ref4], een normbedrag van € 44 per dag per gerealiseerde opvangplek.

      2 Indien de totale werkelijke kosten, bedoeld in [artikel 2, eerste lid, onderdelen a en f][ref5], per
      bestedingsjaar, een uitkering op basis van de normbedragen, bedoeld in het eerste lid, in betekenende mate zouden
      overschrijden dan kan de gemeente deze totale werkelijke kosten per opvangplek per dag declareren. De gemeente
      kan eveneens de totale werkelijke kosten, bedoeld in [artikel 2, eerste lid, onderdelen a en f][ref6], per
      bestedingsjaar, declareren indien deze werkelijke kosten een uitkering op basis van normbedragen in betekenende
      mate zouden onderschrijden. Voor het jaar 2022 ligt de oorzaak van de kosten in alle gevallen in de periode 1 maart
      2022 tot en met 31 december 2022.

      3 Gemeenten ontvangen ter bekostiging van de kosten, bedoeld in [artikel 2, eerste lid, onderdeel b][ref7], een
      vergoeding van de werkelijke kosten per verstrekking als bedoeld in de [Regeling opvang ontheemden Oekraïne][ref8].

      4 Gemeenten ontvangen:

      a. tot 1 januari 2024, ter bekostiging van de kosten, bedoeld in [artikel 2, eerste lid, onderdelen c en d][ref9],
      een normbedrag van € 210 per geregistreerde persoon per maand waarin aan deze persoon een verstrekking is gedaan;

      b. met ingang van 1 januari 2024, ter bekostiging van de kosten, bedoeld in
      [artikel 2, eerste lid, onderdelen c en d][ref10], een normbedrag van € 92 per geregistreerde persoon per maand
      waarin aan deze persoon een verstrekking is gedaan;

      c. met ingang van 1 januari 2025, ter bekostiging van de kosten, bedoeld in
      [artikel 2, eerste lid, onderdelen c en d][ref11], een normbedrag van € 48 per geregistreerde persoon per maand
      waarin aan deze persoon een verstrekking is gedaan.

      5 Gemeenten ontvangen ter bekostiging van de transitiekosten, bedoeld in
      [artikel 2, eerste lid, onderdeel e][ref12], een vergoeding van de werkelijke kosten.

      6 Indien de kosten, bedoeld in het vijfde lid, het aangevraagde en door het Ministerie van Justitie goedgekeurde
      bedrag met meer dan 10% overschrijden, doet de gemeente een aanvullende aanvraag voor het gedeelte dat hoger is dan
      het aangevraagde en goedgekeurde bedrag.

      7 Op het totaalbedrag op basis van het eerste lid, wordt in mindering gebracht de bedragen
      die de gemeente in een boekjaar ontvangt op grond van de [artikelen 7, vierde lid][ref13], en
      [8 van de Regeling opvang ontheemden Oekraïne][ref14].


