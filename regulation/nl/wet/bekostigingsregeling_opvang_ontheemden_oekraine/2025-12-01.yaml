  - number: '6'
    text: |-
      1 De gemeenten leggen uiterlijk 15 juli van het jaar dat volgt op het jaar van besteding verantwoording af over de
      besteding van de specifieke uitkering. [Artikel 17a van de Financiële-verhoudingswet][ref1] is van overeenkomstige
      toepassing.

      2 De gemeenten nemen de artikelen 107 en 108 van het Verdrag betreffende de Werking van de Europese Unie in acht
      bij de besteding van de specifieke uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel17a
    url: https://wetten.overheid.nl/BWBR0046732/2025-12-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: 17a
  - number: '7'
    text: |-
      1 De minister stelt de uitkering uiterlijk op 31 december van het jaar dat volgt op het jaar van besteding vast. De
      minister kan de uitkering lager vaststellen:

      a. voor zover er geen volledige of onjuiste verantwoordingsinformatie is verstrekt;

      b. indien de verantwoordingsinformatie na 15 juli van het jaar van vaststelling is ontvangen, tenzij SiSa tussen
      overheden van toepassing is;

      c. voor zover de uitkering niet rechtmatig is besteed;

      d. voor zover de rechtmatigheid van de besteding volgens de controlerende accountant onzeker is.

      2 Indien de verantwoordingsinformatie te laat, niet of niet volledig wordt verstrekt kan de minister de uitkering
      op een lager bedrag vaststellen.
    url: https://wetten.overheid.nl/BWBR0046732/2025-12-01#Artikel7
  - number: '8'
    text: |-
      De uitkering kan worden teruggevorderd voor het deel dat blijkens de verantwoordingsinformatie niet of niet
      rechtmatig is uitgegeven. Onverschuldigd betaalde uitkeringsbedragen en voorschotten kunnen worden teruggevorderd,
      voor zover na de dag waarop de beschikking waarbij de uitkering wordt vastgesteld is bekendgemaakt, nog geen vijf
      jaren zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0046732/2025-12-01#Artikel8
  - number: '9'
    text: |-
      Deze regeling treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin zij
      wordt geplaatst en werkt terug tot en met 1 maart 2022.
    url: https://wetten.overheid.nl/BWBR0046732/2025-12-01#Artikel9
  - number: '10'
    text: 'Deze regeling wordt aangehaald als: Bekostigingsregeling opvang ontheemden Oekraïne.'
    url: https://wetten.overheid.nl/BWBR0046732/2025-12-01#Artikel10
