  - number: '2'
    text: |-
      1 De minister verstrekt aan gemeenten een specifieke uitkering ter bekostiging van:

      a. de kosten van de verstrekkingen, bedoeld in
      __REF000___________________________________________________________________________________________________________
      ____, waaronder de uitvoeringskosten, van de opvang van ontheemden in een opvangvoorziening van de gemeente binnen
      de gemeentegrens;

      b. de kosten van de verstrekkingen, bedoeld in [artikel 6, eerste lid, onderdeel b][ref2] en
      [artikel 12, eerste tot en met vijfde lid, van de Regeling opvang ontheemden Oekraïne][ref3];

      c. de kosten voor de verstrekkingen, bedoeld in
      [artikel 12, achtste en negende lid, van de Regeling opvang ontheemden Oekraïne][ref4];

      d. de uitvoeringskosten van de verstrekkingen aan ontheemden die verblijven in opvangvoorzieningen van
      particulieren, bedoeld in [artikel 12 van de Regeling opvang ontheemden uit Oekraïne][ref5];

      e. de transitiekosten voor opvang van ontheemden in de gemeentelijke opvang;

      f. de kosten van de verstrekkingen in het tijdvak nadat de aanspraken op basis van de
      [Regeling opvang ontheemden Oekraïne][ref6] zijn geëindigd, voor zo ver de gemeente op verzoek van de minister
      onderbouwt dat inspanningen verricht worden met het oog op het beëindigen van de verstrekkingen door het vertrek
      in de zin van [artikel 61 van de Vreemdelingenwet 2000][ref7], ofwel gedurende de tijd die nodig is voor het voeren
      van noodzakelijke procedures om de ontruiming van een opvanglocatie te realiseren en de kosten die daarbij gemoeid
      zijn.

      2 De transitiekosten, bedoeld in het eerste lid, onderdeel e, worden op aanvraag verstrekt.

      3 De aanvraag, bedoeld in het tweede lid, bevat ten minste:

      a. een omschrijving van de transitiekosten voor het realiseren of geschikt maken van de opvang waarvoor de
      specifieke uitkering wordt aangevraagd en de wijze waarop de locatie voldoet aan de voorwaarden, bedoeld in
      [artikel 5 van de Regeling opvang ontheemden Oekraïne][ref8];

      b. een omschrijving van de wijze waarop het project uitgevoerd wordt en welke partijen daarbij betrokken zijn;

      c. het aantal te realiseren opvangplekken;

      d. een financiële begroting waarin in ieder geval de totale kosten en de afschrijvingstermijn zijn opgenomen;

      e. de periode die de transitie duurt, evenals de periode dat de opvanglocatie beschikbaar is.

      4 De gemeente, bedoeld in het eerste lid, verstrekt op verzoek van de minister een onderbouwing van de wijze
      waarop zij invulling geeft aan een continue en voldoende betrouwbare uitvoering van de taak als bedoeld in
      [artikel 2, eerste lid, van de Regeling opvang ontheemden Oekraïne][ref9].


