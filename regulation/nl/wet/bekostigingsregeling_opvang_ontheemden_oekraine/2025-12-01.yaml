  - number: '4'
    text: |-
      De gemeenten besteden de specifieke uitkering gedurende de periode van 1 maart 2022 tot en met 31 december 2023
      of tot en met de dag waarop een binnen dat tijdvak bij de Staten-Generaal ingediend voorstel van wet waarop deze
      regeling komt te berusten is verworpen, danwel, indien dat voorstel tot wet is verheven en in werking is getreden,
      tot en met de dag waarop die wet vervalt.
    url: https://wetten.overheid.nl/BWBR0046732/2025-12-01#Artikel4
  - number: '5'
    text: |-
      1 Op aanvraag verstrekt en betaalt de minister in 2022 aan gemeenten een voorschot van 100% van het aantal
      opvangplekken voor ontheemden dat een gemeente in een boekjaar verwacht te realiseren maal het normbedrag, de
      werkelijke transitiekosten en de verwachte kosten volgend uit [artikel 2, eerste lid, onderdeel b][ref1]. Daarop
      wordt in mindering gebracht het bedrag dat de gemeente in het betreffende boekjaar verwacht te ontvangen op grond
      van de [artikelen 7, vierde lid][ref2] en [8 van de Regeling opvang ontheemden Oekraïne][ref3].

      2 De aanvraag voor een voorschot, bedoeld in het eerste lid, kan de gemeente voor 1 november van het betreffende
      boekjaar indienen bij de minister.

      3 In het geval, bedoeld in [artikel 4][ref4], wordt in het eerste lid de zinsnede ‘in 2022’ gelezen als ‘in het
      jaar van besteding van de uitkering’.

      4 In afwijking van het tweede lid kan de minister een aanvraag voor een voorschot ingediend na 1 november van het
      betreffende boekjaar, maar vóór 1 mei van het daarop volgende boekjaar, in behandeling nemen, indien er sprake
      is van:

      a. een onverwacht hoge toestroom van ontheemden na 1 november van het betreffende boekjaar;

      b. een stagnatie of afname van het aantal opvangplekken ten opzichte van het aantal ontheemden dat een opvangplek
      nodig heeft; of

      c. een andere aantoonbare reden waarom de kosten door de gemeente niet konden worden voorzien.

      5 De aanvraag, bedoeld in het vierde lid, wordt alleen in behandeling genomen indien:

      a. de landelijke bezettingsgraad van het aantal gerealiseerde opvangplekken boven de 95% ligt, waardoor de urgentie
      om nieuwe opvangplekken te realiseren groot is;

      b. de kosten zijn of worden gemaakt in het betreffende boekjaar.


