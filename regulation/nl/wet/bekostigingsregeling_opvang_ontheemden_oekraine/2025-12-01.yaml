articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. *minister:* de Minister van Asiel en Migratie;

      b. *ontheemden:* personen op wie het Uitvoeringsbesluit van 4 maart 2022 van de [richtlijn 2001/55/EG](32001L0055)
      van de raad van 2001 van toepassing is, ingevolge artikel 2 van dat besluit;

      c. *opvangvoorziening:* een accommodatie waarin opvang wordt geboden aan ontheemden;

      d. *leefgeld:* financiële toelage ten behoeve van voedsel, kleding en andere persoonlijke uitgaven;

      e. *wooncomponent:* financiële toelage ten behoeve van kosten voor het openbaar vervoer, voor activiteiten
      buitenshuis of een vrijwillige bijdrage in het particuliere huishouden;

      f. *verstrekkingen:* de voorzieningen die een ontheemde uit Oekraïne ontvangt zoals opgenomen in de
      [Regeling opvang ontheemden Oekraïne][ref1];

      g. *transitiekosten:* de kosten die gemeenten maken voor het geschikt maken of realiseren van gebouwen voor de
      opvang van ontheemden;

      h. *uitvoeringskosten:* de kosten die gemeenten maken voor alle processen rond het realiseren en de uitvoering van
      de opvang en het doen van verstrekkingen;

      i. *SiSa:* het systeem van single information, single audit, zoals bepaald in de ministeriële regeling
      informatieverstrekking SiSa.


      [ref1]: https://wetten.overheid.nl/BWBR0046503
