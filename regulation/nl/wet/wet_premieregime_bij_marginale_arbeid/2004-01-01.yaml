preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het uit het oogpunt van arbeidsmarktbeleid wenselijk is een
    vrijstelling van de betaalde premies voor de werknemersverzekeringen te introduceren bij dienstbetrekkingen van
    uitkeringsgerechtigden en bepaalde categorieën aangewezen werknemers van zeer korte duur;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008510/2004-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. werknemer: de werknemer bedoeld in § 2 van respectievelijk [Hoofdstuk I van de Werkloosheidswet][ref1] en de
      [Wet op de arbeidsongeschiktheidsverzekering][ref2] en van de [Eerste Afdeling van de Ziektewet][ref3];

      b. werkgever: de natuurlijke persoon tot wie, of het lichaam tot welk een of meer
      natuurlijke personen in dienstbetrekking staan, in de zin van de [Ziektewet][ref4], van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref5] en van de [Werkloosheidswet][ref6];

      c. premies werknemersverzekeringen: de premies, die werkgevers en werknemers verschuldigd zijn ingevolge de
      [Ziekenfondswet][ref7], de [Wet op de arbeidsongeschiktheidsverzekering][ref8] en de [Werkloosheidswet][ref9];

      d. Uitvoeringsinstituut werknemersverzekeringen: het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref10].

      e. Algemeen Werkloosheidsfonds: het fonds, genoemd in [artikel 103 van de Werkloosheidswet][ref11];

      f. uitkeringsgerechtigde: degene, wiens inkomen uit en in verband met arbeid in het bedrijfs- en
      beroepsleven onmiddellijk voorafgaande aan de aanvang van de dienstbetrekking, waarop deze wet
      betrekking heeft uitsluitend bestaat uit een uitkering ingevolge de [Wet werk en bijstand][ref12],
      de [Wet Inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref13],
      de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref14],
      de [Werkloosheidswet][ref15], de [Wet op de arbeidsongeschiktheidsverzekering][ref16],
      de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref17], de
      [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref18], de [Toeslagenwet][ref19] of uit een uitkering
      ingevolge vergelijkbare regelingen dan wel uit een combinatie van deze uitkeringen en die bij de Centrale
      organisatie werk en inkomen als werkzoekende is geregistreerd.


