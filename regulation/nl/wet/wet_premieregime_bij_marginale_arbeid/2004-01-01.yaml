  - number: '2'
    text: |-
      1 Op aanvraag van een werkgever verleent het Uitvoeringsinstituut werknemersverzekeringen ter zake van een
      dienstbetrekking tussen deze werkgever en een uitkeringsgerechtigde vrijstelling van de verplichting tot het
      betalen van de door de werkgever en die uitkeringsgerechtigde verschuldigde premies werknemersverzekeringen.

      2 De vrijstelling wordt verleend, indien:

      a. de dienstbetrekking ten hoogste zes aaneengesloten weken duurt; en

      b. de werkgever in het kalenderjaar niet eerder een dienstbetrekking met die uitkeringsgerechtigde is aangegaan; en

      c. voor een dienstbetrekking van die uitkeringsgerechtigde in het kalenderjaar niet eerder vrijstelling is
      verleend.

      3 Voor de toepassing van het tweede lid worden dienstbetrekkingen tussen de werkgever en de uitkeringsgerechtigde
      geacht eenzelfde, niet onderbroken dienstbetrekking te zijn, indien die dienstbetrekkingen elkander met tussenpozen
      van niet meer dan 31 dagen zijn opgevolgd.

      4 De vrijstelling gaat in op het tijdstip waarop de dienstbetrekking aanvangt.
    url: https://wetten.overheid.nl/BWBR0008510/2004-01-01#Artikel2
  - number: '3'
    text: |-
      1 De werkgever vraagt de vrijstelling aan voor de afloop van de dienstbetrekking. De aanvraag wordt mede door de
      uitkeringsgerechtigde ondertekend.

      2 De aanvraag bevat in ieder geval het sociaal-fiscaal nummer, bedoeld in
      [artikel 1, onderdeel k, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1] van de
      uitkeringsgerechtigde.

      3

      4 Het Uitvoeringsinstituut werknemersverzekeringen kan nadere regels stellen voor de aanvraag door de werkgever.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel1
    url: https://wetten.overheid.nl/BWBR0008510/2004-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '1'
  - number: '4'
    text: |-
      1 Bij ministeriële regeling kunnen voor de Tabakverwerkende en Agrarische sector categorieën van werknemers
      aangewezen worden, waarvoor het Uitvoeringsinstituut werknemersverzekeringen de werkgever ter zake van een
      dienstbetrekking met een onder die categorie vallende werknemer vrijstelling van de verplichting tot het betalen
      van de door die werkgever en die werknemer verschuldigde premies werknemersverzekeringen kan verlenen.

      2 Voor aanwijzing komen in aanmerking categorieën van werknemers, die behalve uit de in het eerste lid bedoelde
      dienstbetrekking bij aanvang van die dienstbetrekking niet aangewezen zijn op inkomen uit arbeid en geen
      uitkeringsgerechtigde zijn.
    url: https://wetten.overheid.nl/BWBR0008510/2004-01-01#Artikel4
  - number: '5'
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen verleent voor de Tabakverwerkende en Agrarische sector
      op aanvraag van een werkgever vrijstelling van de verplichting tot het betalen van premies ter zake van een
      dienstbetrekking met een werknemer vallend onder een categorie als bedoeld in [artikel 4, eerste lid][ref1].

      2 [De artikelen 2, tweede tot en met vierde lid][ref2], en [3][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008510#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008510#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0008510#Artikel3
    url: https://wetten.overheid.nl/BWBR0008510/2004-01-01#Artikel5
