  - number: '6'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen herziet de beslissing over de premievrijstelling, indien deze
      vrijstelling ten onrechte is verleend, omdat onjuiste of onvolledige gegevens zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0008510/2004-01-01#Artikel6
  - number: '8'
    text: |-
      1 Voor de jaren 1997, 1998 en 1999 komt respectievelijk 25, 50 en 75% van de totale premies voor de betaling
      waarvan op grond van § 2 van [hoofdstuk 2][ref1] aan werkgevers vrijstelling is verleend ten laste van een
      wachtgeldfonds.

      2 Met toepassing van het eerste lid komen in de jaren 1997, 1998 en 1999 premies voor de betaling waarvan op grond
      van § 2 van [hoofdstuk 2][ref2] aan werkgevers vrijstelling is verleend, voor maximaal 200 000 werknemers ten laste
      van het Algemeen Werkloosheidsfonds. Bij het bereiken van dit maximum komen die premies in afwijking van het eerste
      lid geheel ten laste van een wachtgeldfonds.


      [ref1]: https://wetten.overheid.nl/BWBR0008510#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0008510#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0008510/2004-01-01#Artikel8
