  - number: '9'
    text: |-
      In afwijking van [artikel 7:2 van de Algemene wet bestuursrecht][ref1] wordt de belanghebbende in een
      bezwaarschriftprocedure ten aanzien van een besluit op grond van deze wet gehoord op zijn verzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel72
    url: https://wetten.overheid.nl/BWBR0008510/2004-01-01#Artikel9
