  - number: '22.1'
    text: |-
      Voor het tussentijds onderzoek van de uitrusting in verband met het viseren van het veiligheidscertificaat van
      geklasseerde schepen is een tarief verschuldigd van € 700.
    url: https://wetten.overheid.nl/BWBR0016086/2004-01-01#Artikel22
  - number: '22.2'
    text: |-
      Voor het tussentijds onderzoek van de inrichting en uitrusting in verband met het viseren van het certificaat van
      geschiktheid van geklasseerde gas- en chemicaliëntankers is een tarief verschuldigd van € 878.
    url: https://wetten.overheid.nl/BWBR0016086/2004-01-01#Artikel22
  - number: '23.1'
    text: |-
      Voor het onderzoek van geklasseerde bestaande schepen en de verdere werkzaamheden nodig voor de eerste afgifte van
      certificaten, volgens het geharmoniseerde systeem van onderzoek en certificering, is een toeslag van 100% van de in
      deze regeling genoemde tarieven voor de hernieuwde afgifte van certificaten verschuldigd.
    url: https://wetten.overheid.nl/BWBR0016086/2004-01-01#Artikel23
  - number: '23.2'
    text: |-
      Het eerste lid is mede van toepassing op schepen als bedoeld in het eerste lid, die een verbouwing hebben
      ondergaan.
    url: https://wetten.overheid.nl/BWBR0016086/2004-01-01#Artikel23
  - number: '24'
    text: |-
      Indien een scheepstype niet is opgenomen in een van de genoemde artikelen wordt door het Hoofd van de
      Scheepvaartinspectie het tarief gebaseerd op het tarief van het scheepstype dat hiermee het meest overeenkomt.
    url: https://wetten.overheid.nl/BWBR0016086/2004-01-01#Artikel24
  - number: '25.1'
    text: |-
      Voor het onderzoek van een radio-installatie aan boord van de schepen als bedoeld in dit hoofdstuk, zijn de
      volgende tarieven verschuldigd:
    url: https://wetten.overheid.nl/BWBR0016086/2004-01-01#Artikel25
  - number: 25.1.a
    text: 'nieuwbouw radio-installatie: € 1.036;'
    url: https://wetten.overheid.nl/BWBR0016086/2004-01-01#Artikel25
  - number: 25.1.b
    text: 'jaarlijkse inspectie radio-installatie: € 255;'
    url: https://wetten.overheid.nl/BWBR0016086/2004-01-01#Artikel25
  - number: 25.1.c
    text: 'herinspectie radio-installatie: € 130.'
    url: https://wetten.overheid.nl/BWBR0016086/2004-01-01#Artikel25
  - number: '25.2'
    text: |-
      Indien het onderzoek van een radio-installatie aan boord van een in Nederland thuis behorend schip geheel of
      gedeeltelijk in het buitenland plaatsvindt, is onverminderd de [artikelen 46][ref1] en [47][ref2] een toeslag
      verschuldigd van 25% van het desbetreffende tarief, genoemd in het eerste lid.


