  - number: '28'
    text: |-
      Voor het tussentijds onderzoek van de romp aan de buitenzijde van niet-geklasseerde schepen nodig voor het viseren
      van het certificaat van deugdelijkheid of het veiligheidscertificaat, volgens het geharmoniseerde systeem van
      onderzoek en certificering, is een tarief verschuldigd van € 588.
    url: https://wetten.overheid.nl/BWBR0016086/2004-01-01#Artikel28
  - number: '29.1'
    text: |-
      Voor het onderzoek van een radio-installatie aan boord van de schepen als bedoeld in dit hoofdstuk, zijn de
      volgende tarieven verschuldigd.
    url: https://wetten.overheid.nl/BWBR0016086/2004-01-01#Artikel29
  - number: 29.1.a
    text: 'nieuwbouw radio-installatie: € 1.036;'
    url: https://wetten.overheid.nl/BWBR0016086/2004-01-01#Artikel29
  - number: 29.1.b
    text: 'jaarlijkse inspectie radio-installatie: € 255;'
    url: https://wetten.overheid.nl/BWBR0016086/2004-01-01#Artikel29
  - number: 29.1.c
    text: 'herinspectie radio-installatie: € 130.'
    url: https://wetten.overheid.nl/BWBR0016086/2004-01-01#Artikel29
  - number: '29.2'
    text: |-
      Indien het onderzoek van een radio-installatie aan boord van een in Nederland thuis behorend schip geheel of
      gedeeltelijk in het buitenland plaatsvindt, is onverminderd de [artikelen 46][ref1] en [47][ref2] een toeslag
      verschuldigd van 25% van het desbetreffende tarief, genoemd in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0016086#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0016086#Artikel47
    url: https://wetten.overheid.nl/BWBR0016086/2004-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0016086
        artikel: '46'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0016086
        artikel: '47'
        hoofdstuk: '7'
  - number: '29.3'
    text: Voor het verstrekken van een certificaat voor de radio-installatie is een tarief verschuldigd van € 183.
    url: https://wetten.overheid.nl/BWBR0016086/2004-01-01#Artikel29
  - number: '29.4'
    text: |-
      Voor zeilende passagiersschepen met een lengte 40 meter of minder en met maximale capaciteit voor 36 passagiers
      gelden de tarieven als vermeld onder het eerste lid, met uitzondering van onderdeel b, waarvoor een tarief geldt
      van € 223.
    url: https://wetten.overheid.nl/BWBR0016086/2004-01-01#Artikel29
  - number: '30.1'
    text: |-
      Voor het onderzoek van schepen en de verdere werkzaamheden nodig voor de afgifte van een vergunning krachtens
      [artikel 2bis van de Schepenwet][ref1], is het tarief verschuldigd, genoemd in onderstaande tabel:


      [ref1]: https://wetten.overheid.nl/BWBR0001876#Artikel2bis
    url: https://wetten.overheid.nl/BWBR0016086/2004-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0001876
        artikel: 2bis
  - number: '30.2'
    text: |-
      Geen tarief is verschuldigd indien het een vergunning betreft, uitsluitend bestemd voor het maken van een
      proefvaart dan wel het ondernemen van een reis uit een haven in Nederland, in beide gevallen met de bedoeling het
      schip gereed te maken voor het verkrijgen van een certificaat van deugdelijkheid.
    url: https://wetten.overheid.nl/BWBR0016086/2004-01-01#Artikel30
  - number: '31'
    text: |-
      Voor het onderzoek van schepen en de verdere werkzaamheden nodig voor de afgifte van een certificaat van ontheffing
      als bedoeld in [artikel 17 van het Schepenbesluit 1965][ref1], is een tarief verschuldigd van € 409.


      [ref1]: https://wetten.overheid.nl/BWBR0002501#Artikel17
    url: https://wetten.overheid.nl/BWBR0016086/2004-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002501
        artikel: '17'
  - number: '32'
    text: |-
      Voor het onderzoek aan boord en de verdere werkzaamheden nodig voor de afgifte van een verklaring,
      waaruit blijkt dat het schip voldoet aan de voorschriften voor het vervoer van graan, bedoeld in
      [artikel 128 van het Schepenbesluit 1965][ref1], is een tarief verschuldigd van € 409.


      [ref1]: https://wetten.overheid.nl/BWBR0002501#Artikel128
    url: https://wetten.overheid.nl/BWBR0016086/2004-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002501
        artikel: '128'
  - number: '33'
    text: |-
      Voor het onderzoek aan boord en de verdere werkzaamheden nodig voor de afgifte van een verklaring, waaruit
      blijkt dat het schip voldoet aan de voorschriften voor het vervoer van gevaarlijke stoffen, bedoeld in de
      [artikelen 130 tot en met 130h, van het Schepenbesluit 1965][ref1], is een tarief verschuldigd van € 409.


      [ref1]: https://wetten.overheid.nl/BWBR0002501#Artikel130
    url: https://wetten.overheid.nl/BWBR0016086/2004-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002501
        artikel: '130'
  - number: '34'
    text: |-
      Voor het onderzoek en de verdere werkzaamheden nodig voor de afgifte of de tussentijdse visering van het
      certificaat van geschiktheid voor het vervoer en het behandelen van beperkte hoeveelheden gevaarlijke en
      schadelijke vloeistoffen in bulk aan boord van offshore support vessels, is het volgende tarief verschuldigd:
    url: https://wetten.overheid.nl/BWBR0016086/2004-01-01#Artikel34
  - number: 34.a
    text: voor de eerste afgifte € 624;
    url: https://wetten.overheid.nl/BWBR0016086/2004-01-01#Artikel34
  - number: 34.b
    text: voor de hernieuwde afgifte € 425;
    url: https://wetten.overheid.nl/BWBR0016086/2004-01-01#Artikel34
  - number: 34.c
    text: voor de tussentijdse visering € 355.
    url: https://wetten.overheid.nl/BWBR0016086/2004-01-01#Artikel34
  - number: '35.1'
    text: |-
      Voor het onderzoek en de verdere werkzaamheden nodig voor de afgifte van het diploma als sloepsgast, bedoeld in
      [artikel 1 bij bijlage XXII van het Schepenbesluit 1965][ref1], is een tarief verschuldigd van € 114.


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0016086/2004-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: '35.2'
    text: |-
      Voor de werkzaamheden nodig voor de afgifte van het duplicaat van het diploma als sloepsgast, bedoeld in
      [artikel 7 van bijlage XXII bij het Schepenbesluit 1965][ref1], is een tarief verschuldigd van € 57.


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0016086/2004-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: '35.3'
    text: |-
      Indien het onderzoek, bedoeld in het eerste lid, niet leidt tot afgifte van een diploma als sloepsgast, is een
      tarief verschuldigd van € 108.
    url: https://wetten.overheid.nl/BWBR0016086/2004-01-01#Artikel35
  - number: '36.1'
    text: |-
      Voor het onderzoek en de verdere werkzaamheden nodig voor de afgifte van een verklaring
      omtrent de bekendheid met de werktuiglijke installatie aan boord van schepen als bedoeld in
      [artikel 112, eerste lid, van het Schepenbesluit 1965][ref1], is een tarief verschuldigd van € 344.


      [ref1]: https://wetten.overheid.nl/BWBR0002501#Artikel112
    url: https://wetten.overheid.nl/BWBR0016086/2004-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0002501
        artikel: '112'
  - number: '36.2'
    text: |-
      Voor de afgifte van een verklaring als bedoeld in het eerste lid, zonder dat hiervoor een onderzoek plaatsvindt, is
      een tarief verschuldigd van € 132.
    url: https://wetten.overheid.nl/BWBR0016086/2004-01-01#Artikel36
  - number: '36.3'
    text: |-
      Indien het onderzoek, bedoeld in het eerste lid, niet leidt tot de afgifte van een verklaring als bedoeld in het
      eerste lid, is een tarief verschuldigd van € 319.
    url: https://wetten.overheid.nl/BWBR0016086/2004-01-01#Artikel36
  - number: '37'
    text: |-
      Voor een verzoek aan een buitenlandse autoriteit tot afgifte van certificaten als bedoeld in
      [artikel 6, eerste lid, van de Schepenwet][ref1], is een tarief verschuldigd van € 105.


      [ref1]: https://wetten.overheid.nl/BWBR0001876#Artikel6
    url: https://wetten.overheid.nl/BWBR0016086/2004-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0001876
        artikel: '6'
  - number: '38.1'
    text: |-
      Voor het onderzoek aan boord en de verdere werkzaamheden nodig voor een tussentijdse aanpassing of een verlenging
      van een document als bedoeld in deze regeling, is een tarief verschuldigd van € 408.
    url: https://wetten.overheid.nl/BWBR0016086/2004-01-01#Artikel38
  - number: '38.2'
    text: |-
      Voor de werkzaamheden nodig voor het verstrekken van een extra exemplaar, een tussentijdse vervanging of
      een verlenging van een document als bedoeld in deze regeling, alsmede voor de afgifte van een document, met
      uitzondering van het document, bedoeld in [artikel 37][ref1], zonder dat hiervoor een onderzoek aan boord
      plaatsvindt, is een tarief verschuldigd van € 183.


      [ref1]: https://wetten.overheid.nl/BWBR0016086#Artikel37
    url: https://wetten.overheid.nl/BWBR0016086/2004-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0016086
        artikel: '37'
        hoofdstuk: '4'
  - number: '38.3'
    text: |-
      Indien ten behoeve van een schip tegelijkertijd meerdere documenten als bedoeld in het tweede lid worden verstrekt,
      zonder dat hiervoor een onderzoek aan boord plaatsvindt, is voor elk volgend document een tarief verschuldigd van
      € 118.
    url: https://wetten.overheid.nl/BWBR0016086/2004-01-01#Artikel38
  - number: '38.4'
    text: |-
      Voor de vervanging van documenten die door een scheepsongeval verloren zijn gegaan, is geen vergoeding
      verschuldigd.
    url: https://wetten.overheid.nl/BWBR0016086/2004-01-01#Artikel38
  - number: '38.5'
    text: |-
      Voor de werkzaamheden nodig in het kader van de vernieuwing van een document als bedoeld in deze regeling is,
      indien het onderzoek door anderen wordt verricht, een tarief van € 183 verschuldigd.
    url: https://wetten.overheid.nl/BWBR0016086/2004-01-01#Artikel38
  - number: '39'
    text: |-
      Indien de werkzaamheden ten behoeve van de afgifte van een document als bedoeld in deze regeling, met uitzondering
      van de documenten, bedoeld in de [artikelen 36][ref1], [37][ref2] en [42][ref3], buiten toedoen van de ambtenaren
      van de Scheepvaartinspectie**niet leiden tot de afgifte van dat document, is het volgende tarief verschuldigd:


      [ref1]: https://wetten.overheid.nl/BWBR0016086#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0016086#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0016086#Artikel42
    url: https://wetten.overheid.nl/BWBR0016086/2004-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0016086
        artikel: '36'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0016086
        artikel: '37'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0016086
        artikel: '42'
        hoofdstuk: '5'
  - number: 39.a
    text: indien de werkzaamheden niet volledig zijn uitgevoerd € 87 per uur per ambtenaar;
    url: https://wetten.overheid.nl/BWBR0016086/2004-01-01#Artikel39
  - number: 39.b
    text: indien de werkzaamheden volledig zijn uitgevoerd het tarief dat is vastgesteld voor de afgifte van het document.
    url: https://wetten.overheid.nl/BWBR0016086/2004-01-01#Artikel39
  - number: '40'
    text: |-
      Voor werkzaamheden voortvloeiende uit het bepaalde bij of krachtens de [Schepenwet][ref1], die niet op grond van
      een van de artikelen van deze regeling in rekening worden gebracht, is een tarief verschuldigd van € 87 per uur
      per ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0001876
    url: https://wetten.overheid.nl/BWBR0016086/2004-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0001876
  - number: '41.1'
    text: |-
      Voor het onderzoek ten behoeve van de typegoedkeuring van uitrustingsstukken en materialen, alsmede de daarbij
      behorende afgifte van documenten ten bewijze dat deze uitrustingsstukken en materialen voldoen aan de bij of
      krachtens de [Schepenwet][ref1] gestelde eisen, is het tarief verschuldigd, genoemd in onderstaande tabel.


      [ref1]: https://wetten.overheid.nl/BWBR0001876
    url: https://wetten.overheid.nl/BWBR0016086/2004-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0001876
  - number: '41.2'
    text: |-
      De tarieven, genoemd in kolom 1, zijn verschuldigd indien het document kan worden afgegeven zonder dat daarvoor
      beproevingen nodig zijn die de aanwezigheid van een ambtenaar van de Scheepvaartinspectie vereisen.
    url: https://wetten.overheid.nl/BWBR0016086/2004-01-01#Artikel41
  - number: '41.3'
    text: |-
      De tarieven, genoemd in kolom 2, zijn verschuldigd indien het document kan worden afgegeven nadat daarvoor
      beproevingen zijn uitgevoerd die de aanwezigheid van een ambtenaar van de Scheepvaartinspectie vereisen.
    url: https://wetten.overheid.nl/BWBR0016086/2004-01-01#Artikel41
  - number: '42.1'
    text: |-
      Indien het onderzoek, bedoeld in [artikel 40, eerste lid][ref1], niet leidt tot de afgifte van een document, is,
      inclusief reistijd, een tarief verschuldigd van € 87 per uur.


      [ref1]: https://wetten.overheid.nl/BWBR0016086#Artikel40
    url: https://wetten.overheid.nl/BWBR0016086/2004-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0016086
        artikel: '40'
        hoofdstuk: '4'
  - number: '42.2'
    text: |-
      Voor hernieuwing van een document als bedoeld in [artikel 35, eerste lid][ref1], is een tarief verschuldigd van
      € 183.


      [ref1]: https://wetten.overheid.nl/BWBR0016086#Artikel35
    url: https://wetten.overheid.nl/BWBR0016086/2004-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0016086
        artikel: '35'
        hoofdstuk: '4'
  - number: '42.3'
    text: |-
      Bij gelijktijdige aanbieding voor een onderzoek ter goedkeuring van meerdere vrijwel identieke uitvoeringen
      van uitrustingsstukken en materialen, is voor de afgifte van het eerste document het tarief, genoemd in
      [artikel 41][ref1] en voor elk van de volgende documenten een tarief verschuldigd van € 183.


      [ref1]: https://wetten.overheid.nl/BWBR0016086#Artikel41
    url: https://wetten.overheid.nl/BWBR0016086/2004-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0016086
        artikel: '41'
        hoofdstuk: '5'
  - number: '43'
    text: |-
      Voor het onderzoek verbonden aan de produktietest van uitrustingsstukken of onderdelen daarvan is, inclusief
      reistijd, een tarief verschuldigd van € 87 per uur.
    url: https://wetten.overheid.nl/BWBR0016086/2004-01-01#Artikel43
  - number: '44'
    text: |-
      Voor het behandelen van een verzoek tot samenlading van gevaarlijke stoffen in één laadeenheid is een tarief
      verschuldigd van € 52.
    url: https://wetten.overheid.nl/BWBR0016086/2004-01-01#Artikel44
  - number: '45'
    text: |-
      Voor het behandelen van een verzoek tot goedkeuring op grond van de International Maritime Dangerous Goods Code is
      een vergoeding verschuldigd van € 241.
    url: https://wetten.overheid.nl/BWBR0016086/2004-01-01#Artikel45
  - number: '46.1'
    text: |-
      Indien een onderzoek als bedoeld in deze regeling geheel of gedeeltelijk in het buitenland wordt uitgevoerd
      en de voor het betreffende onderzoek vastgestelde termijn, opgenomen in de bijlage, wordt overschreden, is per
      termijnoverschrijdende dag een aanvullend tarief verschuldigd van € 701.
    url: https://wetten.overheid.nl/BWBR0016086/2004-01-01#Artikel46
  - number: '46.2'
    text: |-
      De eventuele reis- en verblijfskosten van de ambtenaar ten behoeve van de in deze regeling genoemde onderzoeken in
      het buitenland komen voor rekening van de opdrachtgever. Deze kosten worden afzonderlijk in rekening gebracht.
    url: https://wetten.overheid.nl/BWBR0016086/2004-01-01#Artikel46
  - number: '47.1'
    text: |-
      Indien de in deze regeling genoemde onderzoeken geheel of gedeeltelijk worden uitgevoerd op werkdagen tussen 18.00
      uur en 08.00 uur, op een zaterdag, op een zondag of op een in het [Algemeen Rijksambtenarenreglement][ref1] daaraan
      gelijkgestelde dag, is een aanvullend tarief verschuldigd van € 43 per uur per ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0001950
    url: https://wetten.overheid.nl/BWBR0016086/2004-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0001950
  - number: '47.2'
    text: |-
      Het in het eerste lid genoemde tarief is eveneens voor uitgevoerde onderzoeken in het buitenland buiten de daar ter
      plaatse geldende werktijden verschuldigd.
    url: https://wetten.overheid.nl/BWBR0016086/2004-01-01#Artikel47
  - number: '48'
    text: |-
      Alvorens een onderzoek als bedoeld in deze regeling wordt aangevangen, kan vooruitbetaling van het naar verwachting
      verschuldigde tarief worden verlangd.
    url: https://wetten.overheid.nl/BWBR0016086/2004-01-01#Artikel48
  - number: '49'
    text: |-
      De [Regeling Nederlandse tarieven Schepenwet 2003][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0014430
    url: https://wetten.overheid.nl/BWBR0016086/2004-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0014430
  - number: '50'
    text: Deze regeling treedt in werking met ingang van 1 januari 2004
    url: https://wetten.overheid.nl/BWBR0016086/2004-01-01#Artikel50
  - number: '51'
    text: 'Deze regeling wordt aangehaald als: Regeling Nederlandse tarieven Schepenwet 2004.'
    url: https://wetten.overheid.nl/BWBR0016086/2004-01-01#Artikel51
