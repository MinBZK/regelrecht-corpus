preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de toekomstbestendigheid van de Werkloosheidswet
    te waarborgen en het besluit om die wet te dereguleren en inzichtelijker te maken af te ronden alsmede de
    ontslagpraktijk te versoepelen en in verband daarmee de Werkloosheidswet en enkele andere wetten te wijzigen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0023243/2006-10-01#ArtikelAanhef
