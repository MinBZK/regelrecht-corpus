preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is in het kader van de herziening van de Luchtvaartwet de
    regels met betrekking tot het vervoer van gevaarlijke stoffen en het vervoer van dieren opnieuw vast te stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0011704/2008-09-24#ArtikelAanhef
articles:
  - number: II.1
    text: |-
      Erkenningen die krachtens de [Luchtvaartwet][ref1] zijn verleend aan natuurlijke personen of rechtspersonen die
      werkzaamheden verrichten, verband houdend met het aanbieden ten vervoer, het doen vervoeren of het daadwerkelijk
      vervoer van gevaarlijke stoffen door de lucht, en die op het tijdstip van inwerkingtreding van deze wet geldig
      zijn, worden vanaf dat tijdstip aangemerkt als erkenningen als bedoeld in [artikel 6.55][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002267
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel6
    url: https://wetten.overheid.nl/BWBR0011704/2008-09-24#ArtikelII
    references:
      - id: ref1
        bwb_id: BWBR0002267
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '6'
  - number: II.2
    text: |-
      Opleidingsinstituten voor het afnemen van examens inzake het vervoer van gevaarlijke stoffen door de lucht die
      krachtens de [Luchtvaartwet][ref1] zijn aangewezen, waarvan de aanwijzing op het tijdstip van inwerkingtreding
      van deze wet geldig is, worden vanaf dat tijdstip aangemerkt als erkende opleidingen als bedoeld in
      [artikel 6.56][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002267
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel6
    url: https://wetten.overheid.nl/BWBR0011704/2008-09-24#ArtikelII
    references:
      - id: ref1
        bwb_id: BWBR0002267
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '6'
  - number: II.3
    text: |-
      Krachtens de [Luchtvaartwet][ref1] verleende ontheffingen terzake van het vervoer van gevaarlijke stoffen, blijven
      na het in werking treden van deze wet, met inbegrip van de in voorkomend geval aan deze ontheffingen verbonden
      voorschriften of beperkingen, van kracht.


      [ref1]: https://wetten.overheid.nl/BWBR0002267
    url: https://wetten.overheid.nl/BWBR0011704/2008-09-24#ArtikelII
    references:
      - id: ref1
        bwb_id: BWBR0002267
  - number: III.1
    text: |-
      De behandeling van aanvragen om erkenningen, aanwijzingen of ontheffingen als bedoeld in [artikel II][ref1], welke
      voor het tijdstip van inwerkingtreding van deze wet zijn ingediend, geschiedt overeenkomstig het bepaalde bij of
      krachtens de [Luchtvaartwet][ref2], zoals die tot dat tijdstip luidde.


      [ref1]: https://wetten.overheid.nl/BWBR0011704#ArtikelII
      [ref2]: https://wetten.overheid.nl/BWBR0002267
    url: https://wetten.overheid.nl/BWBR0011704/2008-09-24#ArtikelIII
    references:
      - id: ref1
        bwb_id: BWBR0011704
        artikel: II
      - id: ref2
        bwb_id: BWBR0002267
  - number: III.2
    text: |-
      De procedure van schorsing of intrekking of tot beëindiging van de schorsing van erkenningen of aanwijzingen als
      bedoeld in [artikel II][ref1], welke voor het tijdstip van inwerkingtreding van deze wet is aangevangen, wordt
      afgehandeld overeenkomstig het bepaalde bij of krachtens de [Luchtvaartwet][ref2], zoals die tot dat tijdstip
      luidde.


      [ref1]: https://wetten.overheid.nl/BWBR0011704#ArtikelII
      [ref2]: https://wetten.overheid.nl/BWBR0002267
    url: https://wetten.overheid.nl/BWBR0011704/2008-09-24#ArtikelIII
    references:
      - id: ref1
        bwb_id: BWBR0011704
        artikel: II
      - id: ref2
        bwb_id: BWBR0002267
  - number: III.3
    text: |-
      Beroepen terzake van erkenningen of aanwijzingen als bedoeld in [artikel II][ref1], welke op het tijdstip van
      inwerkingtreding van deze wet in behandeling zijn, worden behandeld overeenkomstig het bepaalde bij of krachtens de
      [Luchtvaartwet][ref2], zoals die tot dat tijdstip luidde.


      [ref1]: https://wetten.overheid.nl/BWBR0011704#ArtikelII
      [ref2]: https://wetten.overheid.nl/BWBR0002267
    url: https://wetten.overheid.nl/BWBR0011704/2008-09-24#ArtikelIII
    references:
      - id: ref1
        bwb_id: BWBR0011704
        artikel: II
      - id: ref2
        bwb_id: BWBR0002267
  - number: III.4
    text: |-
      De in het eerste, tweede of derde lid bedoelde erkenningen of verrichte aanwijzingen worden aangemerkt
      als erkenningen, respectievelijk erkende opleidingen als bedoeld in [artikel 6.55][ref1], respectievelijk
      [artikel 6.56][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel6
    url: https://wetten.overheid.nl/BWBR0011704/2008-09-24#ArtikelIII
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '6'
  - number: VIII
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0011704/2008-09-24#ArtikelVIII
