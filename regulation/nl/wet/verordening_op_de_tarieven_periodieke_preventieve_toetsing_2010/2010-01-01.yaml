  - number: '6'
    text: De in deze verordening genoemde tarieven zijn exclusief omzetbelasting.
    url: https://wetten.overheid.nl/BWBR0026195/2010-01-01#Artikel6
  - number: '7'
    text: |-
      1 Deze verordening treedt in werking op 1 januari 2010.

      2 De [Verordening op de tarieven periodieke preventieve toetsing 2009][ref1] wordt ingetrokken op het tijdstip van
      inwerkingtreding van deze verordening.

      3 Deze verordening wordt aangehaald als: Verordening op de tarieven periodieke preventieve toetsing 2010.


