articles:
  - number: '1'
    text: |-
      Het tarief voor het beoordelen en goedkeuren van het verbeterplan als bedoeld in
      [artikel 11, zevende lid, van de Verordening op de Periodieke Preventieve Toetsing][ref1] bedraagt € 535,–.


      [ref1]: https://wetten.overheid.nl/BWBR0014165#Artikel11
    url: https://wetten.overheid.nl/BWBR0026195/2010-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0014165
        artikel: '11'
  - number: '2'
    text: |-
      Het tarief voor de behandeling van een verzoek tot vrijstelling van de toetsing of de verlenging daarvan als
      bedoeld in [artikel 14, tweede lid, van de Verordening op de Periodieke Preventieve Toetsing][ref1] bedraagt

      a. bij een eerste verzoek € 100,–;

      b. bij een tweede verzoek € 175,–; en

      c. bij een derde of volgend verzoek € 250,–.


      [ref1]: https://wetten.overheid.nl/BWBR0014165#Artikel14
    url: https://wetten.overheid.nl/BWBR0026195/2010-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0014165
        artikel: '14'
  - number: '3'
    text: |-
      Het tarief voor een accreditatie als bedoeld in
      [artikel 15, derde lid, van de Verordening op de Periodieke Preventieve Toetsing][ref1] bedraagt € 810,– per
      toetser per dagdeel.


      [ref1]: https://wetten.overheid.nl/BWBR0014165#Artikel15
    url: https://wetten.overheid.nl/BWBR0026195/2010-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0014165
        artikel: '15'
  - number: '4'
    text: |-
      Het tarief voor de toetsing als bedoeld in
      [artikel 18, eerste lid, van de Verordening op de Periodieke Preventieve Toetsing][ref1] bedraagt:

      a. voor een eerste toetsing bij een accountantspraktijk: € 695,– per toetser per dagdeel;

      b. voor een hertoetsing bij een accountantspraktijk: € 1.020,– per toetser per dagdeel.


      [ref1]: https://wetten.overheid.nl/BWBR0014165#Artikel18
    url: https://wetten.overheid.nl/BWBR0026195/2010-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0014165
        artikel: '18'
  - number: '5'
    text: |-
      1 Toetsers die voor een toetsing of accreditatie worden ingeschakeld, ontvangen voor de bij de te toetsen
      accountantspraktijk of de te accrediteren koepelorganisatie bestede tijd een vergoeding ten bedrage van € 355,–
      per dagdeel.

      2 Toetsers ontvangen een vergoeding van reis- en verblijfkosten overeenkomstig de regeling van de
      [artikelen 1][ref1], [2][ref2] en [3 van de Verordening op de kostenvergoedingen][ref3].

      3 Toetsers die voor een toetsing of accreditatie worden ingeschakeld, ontvangen in afwijking van
      [artikel 2, derde lid, van de Verordening op de kostenvergoeding][ref4], een afzonderlijke vergoeding voor
      de kosten van parkeergelden welke zijn gemaakt in verband met de toetsing van een accountantspraktijk of te
      accrediteren koepelorganisatie.

      4 Een toetsers verzoekt om toepassing van het vorige lid en overlegt daarbij bewijsstukken.


      [ref1]: https://wetten.overheid.nl/BWBR0006183#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006183#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0006183#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0006183#Artikel2
