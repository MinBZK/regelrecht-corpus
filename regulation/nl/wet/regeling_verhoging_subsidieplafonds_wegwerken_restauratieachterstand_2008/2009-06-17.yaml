      [artikel 7, tweede lid, van de Regeling rijkssubsidiëring wegwerken restauratieachterstand 2008][ref2], wordt voor
      zover het betreft monumenten als bedoeld in [artikel 3, onder f][ref3], vastgesteld op € 4.635.000.


