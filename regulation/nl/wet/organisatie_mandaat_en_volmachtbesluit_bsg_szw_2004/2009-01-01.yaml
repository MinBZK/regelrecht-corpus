---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: organisatie_mandaat_en_volmachtbesluit_bsg_szw_2004
regulatory_layer: WET
publication_date: '2009-06-02'
valid_from: '2009-01-01'
bwb_id: BWBR0016367
url: https://wetten.overheid.nl/BWBR0016367/2009-01-01
preamble:
  text: |-
    Gelet op artikel 3, onderdeel k, en artikel 6 van het Organisatie-, mandaat- en volmachtbesluit plaatsvervangend
    secretaris-generaal SZW 2004;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0016367/2009-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0016367/2009-01-01#Artikel1
  - number: 1.a
    text: 'SZW: het Ministerie van Sociale Zaken en Werkgelegenheid;'
    url: https://wetten.overheid.nl/BWBR0016367/2009-01-01#Artikel1
  - number: 1.b
    text: |-
      Ministerstaf: het wekelijks overleg van de minister en de staatssecretaris met de secretaris-generaal, de
      plaatsvervangend secretaris-generaal, de directeuren-generaal, de inspecteur-generaal en daartoe permanent of
      incidenteel uitgenodigde andere personen;
    url: https://wetten.overheid.nl/BWBR0016367/2009-01-01#Artikel1
  - number: 1.c
    text: 'BSG: Bureau secretaris-generaal.'
    url: https://wetten.overheid.nl/BWBR0016367/2009-01-01#Artikel1
  - number: '2.1'
    text: 'BSG bestaat uit de volgende afdelingen en bureaus:'
    url: https://wetten.overheid.nl/BWBR0016367/2009-01-01#Artikel2
  - number: 2.1.a
    text: het Bureau Advies SG;
    url: https://wetten.overheid.nl/BWBR0016367/2009-01-01#Artikel2
  - number: 2.1.b
    text: het Bureau Control en Advies;
    url: https://wetten.overheid.nl/BWBR0016367/2009-01-01#Artikel2
  - number: 2.1.c
    text: de afdeling Bestuursondersteuning, Bedrijfsvoering en Control;
    url: https://wetten.overheid.nl/BWBR0016367/2009-01-01#Artikel2
  - number: 2.1.d
    text: de afdeling Coördinatie Departementale Stukken;
    url: https://wetten.overheid.nl/BWBR0016367/2009-01-01#Artikel2
  - number: 2.1.e
    text: de afdeling Kabinet.
    url: https://wetten.overheid.nl/BWBR0016367/2009-01-01#Artikel2
  - number: '2.2'
    text: De directeur en de hoofden van de afdelingen vormen tezamen het Managementteam BSG.
    url: https://wetten.overheid.nl/BWBR0016367/2009-01-01#Artikel2
  - number: '3'
    text: 'Het hoofd van het Bureau Advies SG is verantwoordelijk voor de volgende algemene taken:'
    url: https://wetten.overheid.nl/BWBR0016367/2009-01-01#Artikel3
  - number: 3.a
    text: |-
      het beoordelen en zo nodig van commentaar voorzien van stukken ten behoeve van de secretaris-generaal en in
      voorkomend geval van de bewindspersonen;
    url: https://wetten.overheid.nl/BWBR0016367/2009-01-01#Artikel3
  - number: 3.b
    text: het adviseren en ondersteunen van de secretaris-generaal in alle facetten van zijn functie;
    url: https://wetten.overheid.nl/BWBR0016367/2009-01-01#Artikel3
  - number: 3.c
    text: het voeren van het secretariaat van overlegvormen van bewindspersonen;
    url: https://wetten.overheid.nl/BWBR0016367/2009-01-01#Artikel3
  - number: 3.d
    text: |-
      het voorbereiden en coördineren van de advisering en voeren van het secretariaat ten behoeve van diverse
      overlegvormen van de secretaris-generaal;
    url: https://wetten.overheid.nl/BWBR0016367/2009-01-01#Artikel3
  - number: 3.e
    text: het zorgdragen voor interne en externe coördinatie ten aanzien van ministerraads- en parlementaire aangelegenheden;
    url: https://wetten.overheid.nl/BWBR0016367/2009-01-01#Artikel3
  - number: 3.f
    text: het coördineren van de inbreng van het ministerie in plenaire debatten in het parlement;
    url: https://wetten.overheid.nl/BWBR0016367/2009-01-01#Artikel3
  - number: 3.g
    text: |-
      de advisering over lacunes en dubbelingen in lopend en voorgenomen onderzoek naar aanleiding van directieplannen en
      Managementrapportages van de directeuren-generaal;
    url: https://wetten.overheid.nl/BWBR0016367/2009-01-01#Artikel3
  - number: 3.h
    text: het initiëren en organiseren van periodieke bijeenkomsten over strategische thema’s;
    url: https://wetten.overheid.nl/BWBR0016367/2009-01-01#Artikel3
  - number: 3.i
    text: het deelnemen aan gesprekken van de bewindspersonen met derden.
    url: https://wetten.overheid.nl/BWBR0016367/2009-01-01#Artikel3
  - number: '4.1'
    text: Het Bureau Control en Advies wordt rechtstreeks aangestuurd door de directeur.
    url: https://wetten.overheid.nl/BWBR0016367/2009-01-01#Artikel4
  - number: '4.2'
    text: 'Het Bureau Control en Advies is verantwoordelijk voor de volgende algemene taken:'
    url: https://wetten.overheid.nl/BWBR0016367/2009-01-01#Artikel4
  - number: 4.2.a
    text: |-
      het beoordelen en zo nodig van commentaar voorzien van stukken ten behoeve van de plaatsvervangend secretaris-
      generaal;
    url: https://wetten.overheid.nl/BWBR0016367/2009-01-01#Artikel4
  - number: 4.2.b
    text: het adviseren en ondersteunen van de plaatsvervangend secretaris-generaal in alle facetten van zijn functie;
    url: https://wetten.overheid.nl/BWBR0016367/2009-01-01#Artikel4
  - number: 4.2.c
    text: |-
      het voorbereiden en coördineren van de advisering en voeren van het secretariaat van overlegvormen van de
      plaatsvervangend secretaris-generaal;
    url: https://wetten.overheid.nl/BWBR0016367/2009-01-01#Artikel4
  - number: 4.2.d
    text: |-
      het ondersteunen van de secretaris-generaal en de plaatsvervangend secretaris-generaal op het gebied van planning
      en control bij de aansturing van de directies die rechtstreeks onder hen ressorteren.
    url: https://wetten.overheid.nl/BWBR0016367/2009-01-01#Artikel4
  - number: '5'
    text: |-
      Het hoofd van de afdeling Bestuursondersteuning, Bedrijfsvoering en Control is verantwoordelijk voor de volgende
      algemene taken:
    url: https://wetten.overheid.nl/BWBR0016367/2009-01-01#Artikel5
  - number: 5.a
    text: het voeren van het secretariaat van overlegvormen van de secretaris-generaal en van de directeur;
    url: https://wetten.overheid.nl/BWBR0016367/2009-01-01#Artikel5
  - number: 5.b
    text: het secretarieel een logistiek ondersteunen van de directeur en de afdelingshoofden;
    url: https://wetten.overheid.nl/BWBR0016367/2009-01-01#Artikel5
  - number: 5.c
    text: |-
      het financieel-, materieel- en personeelsbeheer ten behoeve van bewindspersonen, van de secretaris-generaal en
      de plaatsvervangend secretaris-generaal, en van die medewerkers van het ministerie waarvoor dezen rechtstreeks
      verantwoordelijk zijn, alsmede van de directeur, de afdelingshoofden en het bureauhoofd van BSG;
    url: https://wetten.overheid.nl/BWBR0016367/2009-01-01#Artikel5
  - number: 5.d
    text: |-
      advies en ondersteuning van de directeur, de afdelingshoofden en het bureauhoofd van BSG op het vlak van planning
      en control;
    url: https://wetten.overheid.nl/BWBR0016367/2009-01-01#Artikel5
  - number: 5.e
    text: |-
      het optreden als contactpersoon op alle facetten van de bedrijfsvoering voor de andere onderdelen van het
      ministerie;
    url: https://wetten.overheid.nl/BWBR0016367/2009-01-01#Artikel5
  - number: 5.f
    text: het beheer, de redactie en coördinatie van uitingen van het BSG op het intranet.
    url: https://wetten.overheid.nl/BWBR0016367/2009-01-01#Artikel5
  - number: '6'
    text: 'Het hoofd van de afdeling Coördinatie Departementale Stukken is verantwoordelijk voor de volgende algemene taken:'
    url: https://wetten.overheid.nl/BWBR0016367/2009-01-01#Artikel6
  - number: 6.a
    text: |-
      het ontvangen, registreren en bepalen van de stappen ter afhandeling van post van derden en van stukken van
      directies en directoraten-generaal van het ministerie gericht aan de bewindspersonen, de secretaris-generaal of de
      plaatsvervangend secretaris-generaal;
    url: https://wetten.overheid.nl/BWBR0016367/2009-01-01#Artikel6
  - number: 6.b
    text: |-
      de verzending van door één of meer bewindsperso(o)n(en), de secretaris-generaal of de plaatsvervangend secretaris-
      generaal getekende stukken;
    url: https://wetten.overheid.nl/BWBR0016367/2009-01-01#Artikel6
  - number: 6.c
    text: |-
      het zorgdragen voor de interne en externe informatievoorziening ten aanzien van ministerraads- en parlementaire
      aangelegenheden en het onderhouden van de daarvoor noodzakelijke externe contacten;
    url: https://wetten.overheid.nl/BWBR0016367/2009-01-01#Artikel6
  - number: 6.d
    text: het zorgdragen voor de administratieve begeleiding bij de verzending en publicatie van wet- en regelgeving;
    url: https://wetten.overheid.nl/BWBR0016367/2009-01-01#Artikel6
  - number: 6.e
    text: |-
      het zorgdragen voor de logistieke ondersteuning van de bewindspersonen bij departementsbrede debatten in het
      parlement;
    url: https://wetten.overheid.nl/BWBR0016367/2009-01-01#Artikel6
  - number: 6.f
    text: de interne postvoorziening en overige bodewerkzaamheden binnen BSG.
    url: https://wetten.overheid.nl/BWBR0016367/2009-01-01#Artikel6
  - number: '7'
    text: 'Het hoofd van de afdeling Kabinet is verantwoordelijk voor de volgende algemene taken:'
    url: https://wetten.overheid.nl/BWBR0016367/2009-01-01#Artikel7
  - number: 7.a
    text: |-
      het bijstaan, in adviserende en uitvoerende zin, van bewindspersonen, de secretaris-generaal en de plaatsvervangend
      secretaris-generaal in protocollaire en representatieve aangelegenheden;
    url: https://wetten.overheid.nl/BWBR0016367/2009-01-01#Artikel7
  - number: 7.b
    text: |-
      het adviseren van bewindspersonen, de secretaris-generaal en de plaatsvervangend secretaris-generaal over en het
      afhandelen van aangelegenheden betreffende koninklijke onderscheidingen;
    url: https://wetten.overheid.nl/BWBR0016367/2009-01-01#Artikel7
  - number: 7.c
    text: |-
      het verzorgen van adviezen van de secretaris-generaal betreffende toekenning van predikaten aan bedrijven en
      instellingen;
    url: https://wetten.overheid.nl/BWBR0016367/2009-01-01#Artikel7
  - number: 7.d
    text: |-
      het adviseren over en zorgdragen voor relatiegeschenken ten behoeve van bewindspersonen, de secretaris-generaal en
      de plaatsvervangend secretaris-generaal;
    url: https://wetten.overheid.nl/BWBR0016367/2009-01-01#Artikel7
  - number: 7.e
    text: |-
      de ondersteuning van bewindspersonen, de secretaris-generaal en de plaatsvervangend secretaris-generaal, door
      managementassistenten en kamerbewaarders.
    url: https://wetten.overheid.nl/BWBR0016367/2009-01-01#Artikel7
  - number: '8'
    text: |-
      Aan de hoofden van het bureau en de afdelingen, genoemd in [artikel 2, eerste lid][ref1], wordt mandaat en
      machtiging verleend met betrekking tot het nemen van besluiten over en het ondertekenen van stukken die betrekking
      hebben op:


      [ref1]: https://wetten.overheid.nl/BWBR0016367#Artikel2
    url: https://wetten.overheid.nl/BWBR0016367/2009-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0016367
        artikel: '2'
        paragraaf: '2'
  - number: 8.a
    text: de taken van het eigen bureau of de eigen afdeling;
    url: https://wetten.overheid.nl/BWBR0016367/2009-01-01#Artikel8
  - number: 8.b
    text: 'de personeelsaangelegenheden van het eigen bureau of de eigen afdeling, voorzover het betreft:'
    url: https://wetten.overheid.nl/BWBR0016367/2009-01-01#Artikel8
  - number: 8.b.1°
    text: het opmaken, niet zijnde vaststellen, van een beoordeling van medewerkers;
    url: https://wetten.overheid.nl/BWBR0016367/2009-01-01#Artikel8
  - number: 8.b.2°
    text: het houden van manager-medewerkergesprekken;
    url: https://wetten.overheid.nl/BWBR0016367/2009-01-01#Artikel8
  - number: 8.b.3°
    text: verlof van medewerkers;
    url: https://wetten.overheid.nl/BWBR0016367/2009-01-01#Artikel8
  - number: 8.b.4°
    text: kleine beloningen, niet zijnde gratificaties, onder gelijktijdige mededeling daarvan aan de directeur.
    url: https://wetten.overheid.nl/BWBR0016367/2009-01-01#Artikel8
  - number: '9'
    text: |-
      Het hoofd van de afdeling Coördinatie Departementale Stukken is gevolmachtigd tot het aangaan van overeenkomsten
      met betrekking tot de taken, genoemd in [artikel 6][ref1], tot een bedrag van € 1.000,– per overeenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0016367#Artikel6
    url: https://wetten.overheid.nl/BWBR0016367/2009-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0016367
        artikel: '6'
        paragraaf: '3'
  - number: '10'
    text: |-
      Het hoofd van de afdeling Kabinet is gevolmachtigd tot het aangaan van overeenkomsten met betrekking tot de taken,
      genoemd in [artikel 7][ref1], tot een bedrag van € 1.000,– per overeenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0016367#Artikel7
    url: https://wetten.overheid.nl/BWBR0016367/2009-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0016367
        artikel: '7'
        paragraaf: '3'
  - number: '11.1'
    text: |-
      Het hoofd van de afdeling Bestuursondersteuning, Bedrijfsvoering en Control is gevolmachtigd tot het aangaan van
      overeenkomsten tot een bedrag van € 1.000,–, voor zover het betreft de taken, genoemd in [artikel 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016367#Artikel5
    url: https://wetten.overheid.nl/BWBR0016367/2009-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0016367
        artikel: '5'
        paragraaf: '3'
  - number: '11.2'
    text: |-
      Het hoofd van de afdeling Bestuursondersteuning, Bedrijfsvoering en Control is gevolmachtigd om de volgende
      overeenkomsten aan te gaan tot een waarde van maximaal € 10.000,– per overeenkomst:
    url: https://wetten.overheid.nl/BWBR0016367/2009-01-01#Artikel11
  - number: 11.2.a
    text: |-
      overeenkomsten voor de aanschaf van kantoorbenodigdheden, reisbescheiden en waardebonnen ten behoeve van
      bewindspersonen, de secretaris-generaal, de plaatsvervangend secretaris-generaal en BSG;
    url: https://wetten.overheid.nl/BWBR0016367/2009-01-01#Artikel11
  - number: 11.2.b
    text: overeenkomsten voor de opleiding van medewerkers van BSG.
    url: https://wetten.overheid.nl/BWBR0016367/2009-01-01#Artikel11
  - number: '12.1'
    text: |-
      Bij afwezigheid of verhindering van de directeur worden, voor de duur van de afwezigheid of verhindering, diens
      taken en bevoegdheden waargenomen door diens plaatsvervanger, het hoofd van de afdeling Bestuursondersteuning,
      Bedrijfsvoering en Control.
    url: https://wetten.overheid.nl/BWBR0016367/2009-01-01#Artikel12
  - number: '12.2'
    text: |-
      Bij afwezigheid of verhindering van het hoofd van het Bureau Advies SG worden, voor de duur van de afwezigheid of
      verhindering, diens taken en bevoegdheden waargenomen door de fungerend secretaris van de Ministerstaf.
    url: https://wetten.overheid.nl/BWBR0016367/2009-01-01#Artikel12
  - number: '12.3'
    text: |-
      Bij afwezigheid of verhindering van het hoofd van de afdeling Coördinatie Departementale Stukken worden, voor de
      duur van de afwezigheid of verhindering, diens taken en bevoegdheden waargenomen door het hoofd van de afdeling
      Kabinet.
    url: https://wetten.overheid.nl/BWBR0016367/2009-01-01#Artikel12
  - number: '12.4'
    text: |-
      Bij afwezigheid of verhindering van het hoofd van de afdeling Kabinet worden, voor de duur van de afwezigheid
      of verhindering, diens taken, genoemd in [artikel 7, onderdelen a tot en met d][ref1], waargenomen door de
      1e medewerker Kabinet, en diens overige taken en bevoegdheden door het hoofd van de afdeling Coördinatie
      Departementale Stukken.


      [ref1]: https://wetten.overheid.nl/BWBR0016367#Artikel7
    url: https://wetten.overheid.nl/BWBR0016367/2009-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0016367
        artikel: '7'
        paragraaf: '3'
  - number: '13.1'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst en werkt terug tot en met 1 januari 2004.
    url: https://wetten.overheid.nl/BWBR0016367/2009-01-01#Artikel13
  - number: '13.2'
    text: 'Deze regeling wordt aangehaald als: Organisatie-, mandaat- en volmachtbesluit BSG SZW 2004.'
    url: https://wetten.overheid.nl/BWBR0016367/2009-01-01#Artikel13
