articles:
  - number: '1'
    text: |-
      Het tarief, bedoeld in [artikel 15, achtste lid, van de Verordening op de kwaliteitstoetsing NOvAA][ref1] bedraagt
      € 550,–.


      [ref1]: https://wetten.overheid.nl/BWBR0031878#Artikel15
    url: https://wetten.overheid.nl/BWBR0031879/2012-08-08#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0031878
        artikel: '15'
  - number: '2'
    text: |-
      Het tarief, bedoeld in [artikel 25, eerste lid, van de Verordening op de kwaliteitstoetsing NOvAA][ref1] bedraagt

      a. bij een eerste verzoek € 105,–;

      b. bij een tweede verzoek € 180,–; en

      c. bij een derde of volgend verzoek € 255,–.


      [ref1]: https://wetten.overheid.nl/BWBR0031878#Artikel25
    url: https://wetten.overheid.nl/BWBR0031879/2012-08-08#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0031878
        artikel: '25'
  - number: '3'
    text: |-
      Het tarief, bedoeld in [artikel 27, eerste lid, van de Verordening op de kwaliteitstoetsing NOvAA][ref1] bedraagt
      € 830,– per toetser per dagdeel.


      [ref1]: https://wetten.overheid.nl/BWBR0031878#Artikel27
    url: https://wetten.overheid.nl/BWBR0031879/2012-08-08#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0031878
        artikel: '27'
  - number: '4'
    text: |-
      Het tarief, bedoeld in [artikel 30, tweede lid, van de Verordening op de kwaliteitstoetsing NOvAA][ref1] bedraagt:

      a. voor een eerste toetsing: € 710,– per toetser per dagdeel;

      b. voor een hertoetsing: € 1.045,– per toetser per dagdeel.


      [ref1]: https://wetten.overheid.nl/BWBR0031878#Artikel30
    url: https://wetten.overheid.nl/BWBR0031879/2012-08-08#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0031878
        artikel: '30'
  - number: '5'
    text: |-
      1 Een toetser die voor een toetsing of accreditatie wordt ingeschakeld, ontvangt voor de bij de te toetsen
      accountantspraktijk of de te accrediteren koepelorganisatie ten behoeve van de toetsing aangevangen dagdelen een
      vergoeding ten bedrage van € 365,– per dagdeel.

      2 De vergoeding, bedoeld in het eerste lid, geldt voor ten hoogste twee dagdelen per dag.

      3 Een dagdeel omvat een tijdsperiode van drie uur.

      4 Toetsers ontvangen een vergoeding van reis- en verblijfkosten en reistijdkosten overeenkomstig artikelen 1a van
      de Verordening op de kostenvergoedingen.

      5 Toetsers die voor een toetsing of accreditatie worden ingeschakeld, ontvangen in afwijking van artikel 1a,
      zevende lid, van de Verordening op de kostenvergoedingen, een afzonderlijke vergoeding voor de kosten van
      parkeergelden welke zijn gemaakt in verband met de toetsing van een accountantspraktijk of te accrediteren
      koepelorganisatie.

      6 Een toetser verzoekt om toepassing van het vorige lid en overlegt daarbij bewijsstukken.
    url: https://wetten.overheid.nl/BWBR0031879/2012-08-08#Artikel5
  - number: '6'
    text: De in deze verordening genoemde tarieven zijn exclusief omzetbelasting.
    url: https://wetten.overheid.nl/BWBR0031879/2012-08-08#Artikel6
  - number: '7'
    text: |-
      De [Verordening op de tarieven periodieke preventieve toetsing 2012][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0030349
    url: https://wetten.overheid.nl/BWBR0031879/2012-08-08#Artikel7
