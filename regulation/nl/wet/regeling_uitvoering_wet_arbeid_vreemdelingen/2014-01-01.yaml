  text: |-
    Gelet op de artikelen 3, tweede lid, 5, tweede lid, 8, derde lid, 9 en 22 van de Wet arbeid vreemdelingen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0034570/2014-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      De bevoegdheid inzake het afgeven en intrekken van een tewerkstellingsvergunning wordt overgedragen aan het
      Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0034570/2014-01-01#Artikel1
  - number: '2'
    text: |-
      Bij de uitoefening van de bevoegdheden, bedoeld in [artikel 1][ref1], neemt het
      Uitvoeringsinstituut werknemersverzekeringen, naast de in de [Wet arbeid vreemdelingen][ref2], het
      [Besluit uitvoering Wet arbeid vreemdelingen][ref3] en in deze regeling gestelde regels, de nadere regels in acht
      inzake de wijze van toepassing van de [Wet arbeid vreemdelingen][ref4], als omschreven in de bij deze regeling
      behorende bijlage uitvoeringsregels.


      [ref1]: https://wetten.overheid.nl/BWBR0034570#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007149
      [ref3]: https://wetten.overheid.nl/BWBR0007523
      [ref4]: https://wetten.overheid.nl/BWBR0007149
    url: https://wetten.overheid.nl/BWBR0034570/2014-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0034570
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0007149
      - id: ref3
