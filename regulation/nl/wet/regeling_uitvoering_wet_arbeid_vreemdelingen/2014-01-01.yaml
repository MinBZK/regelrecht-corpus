      - id: ref4
        bwb_id: BWBR0007149
  - number: '3'
    text: |-
      Voor aanvragen die geschoold werk betreffen, worden bij de personalia van de werknemer de gewaarmerkte diploma’s
      en de getuigschriften dat aan de vereiste kwalificaties is voldaan, bij de vergunningaanvraag gevoegd. De waarde
      van de diploma’s kan worden geverifieerd aan de hand van een door een deskundige instantie afgegeven verklaring met
      welk Nederlands diploma of welke graad van vakbekwaamheid deze documenten vergelijkbaar zijn.
    url: https://wetten.overheid.nl/BWBR0034570/2014-01-01#Artikel3
  - number: '4'
    text: |-
      De houder van de tewerkstellingsvergunning is verplicht onverwijld schriftelijk mededeling te doen als van de
      tewerkstellingsvergunning langer dan een maand geen gebruik wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0034570/2014-01-01#Artikel4
  - number: '5'
    text: |-
      Afwijking van [artikel 8, eerste lid, onder b, van de Wet arbeid vreemdelingen][ref1] vindt slechts plaats in geval
      er sprake is van buitengewone omstandigheden die een spoedige vervulling van de arbeidsplaats noodzakelijk maken
      en die niet door de werkgever waren te voorzien of door hem te beïnvloeden waren of indien het Uitvoeringsinstituut
      werknemersverzekeringen voor ommekomst van de termijn van vijf weken heeft vastgesteld dat er voor de
      desbetreffende arbeidsplaats geen prioriteitgenietend aanbod op de arbeidsmarkt aanwezig is of op voorhand reeds
      duidelijk is dat geen prioriteitgenietend aanbod aanwezig is.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel8
    url: https://wetten.overheid.nl/BWBR0034570/2014-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '8'
  - number: '6'
    text: |-
      Afwijking van [artikel 8, eerste lid, onder a, b en c, van de Wet arbeid vreemdelingen][ref1] vindt slechts plaats
      ten behoeve van de bevordering van internationale handelscontacten als omschreven in de bij deze regeling behorende
      bijlage uitvoeringsregels.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel8
    url: https://wetten.overheid.nl/BWBR0034570/2014-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '8'
  - number: '7'
    text: |-
      Afwijking van [artikel 8, eerste lid, onder a, b, c of f, van de Wet arbeid vreemdelingen][ref1] vindt slechts
      plaats in het kader van de uitoefening van een geestelijke, godsdienstige of levensbeschouwelijke functie als
      omschreven in de bij deze regeling behorende bijlage uitvoeringsregels.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel8
    url: https://wetten.overheid.nl/BWBR0034570/2014-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '8'
  - number: '8'
    text: |-
      Afwijking van [artikel 8, eerste lid, onder a, b, c, d of f, van de Wet arbeid vreemdelingen][ref1] vindt
      slechts plaats in het kader van scholing, opleiding, vrijwilligerswerk, internationale uitwisseling en andere
      internationale culturele contacten alsmede ten behoeve van vreemdelingen die beschikken over een voor het
      verrichten van arbeid geldige vergunning tot verblijf, voor zover dit is omschreven in de bij deze regeling
      behorende bijlage uitvoeringsregels.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel8
    url: https://wetten.overheid.nl/BWBR0034570/2014-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '8'
  - number: '9'
    text: Een tewerkstellingsvergunning kan worden geweigerd ten aanzien van een vreemdeling die jonger is dan 18 jaar.
    url: https://wetten.overheid.nl/BWBR0034570/2014-01-01#Artikel9
  - number: '10'
    text: |-
      Het [Delegatie- en uitvoeringsbesluit Wet arbeid vreemdelingen][ref1] met de daarbij behorende bijlage
      uitvoeringsregels wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0007514
    url: https://wetten.overheid.nl/BWBR0034570/2014-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0007514
  - number: '11'
    text: Deze regeling treedt in werking met ingang van 1 januari 2014.
    url: https://wetten.overheid.nl/BWBR0034570/2014-01-01#Artikel11
  - number: '12'
    text: 'Deze regeling wordt aangehaald als: Regeling uitvoering Wet arbeid vreemdelingen.'
    url: https://wetten.overheid.nl/BWBR0034570/2014-01-01#Artikel12
