preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om enkele wijzigingen in de wetgeving op het terrein
    van het Ministerie van Sociale Zaken en Werkgelegenheid, van het Ministerie van Financiën en van het Ministerie van
    Volksgezondheid, Welzijn en Sport aan te brengen;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0036013/2017-04-01#ArtikelAanhef
articles:
  - number: XXXVIb
    text: |-
      De [Wet participatiebudget][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0025039
    url: https://wetten.overheid.nl/BWBR0036013/2017-04-01#ArtikelXXXVIb
    references:
      - id: ref1
        bwb_id: BWBR0025039
  - number: XXXVIc
    text: |-
      1 Op uitkeringen die zijn verleend of verstrekt aan een college van burgemeester en wethouders op grond van de
      [Wet participatiebudget][ref1] voor het tijdstip van inwerkingtreding van [artikel XXXVIB][ref2] van deze wet
      blijven de Wet participatiebudget en de daarop berustende bepalingen zoals deze luidden op de dag voorafgaand aan
      de datum van inwerkingtreding artikel XXXVIB van deze wet, van toepassing.

      2 Middelen die op grond van [artikel 2][ref3] of [artikel 4 van de Wet participatiebudget][ref4] of daarop
      berustende bepalingen zijn gereserveerd voor besteding in 2015 met uitzondering van het bedrag dat door Onze
      Minister van Onderwijs, Cultuur en Wetenschap beschikbaar is gesteld, kunnen door het college van burgemeester en
      wethouders in 2015 vrij worden besteed binnen de kaders van een integratie-uitkering op grond van de Financiële-
      verhoudingswet. Dit gereserveerde bedrag wordt niet teruggevorderd op de wijze, bedoeld in artikel 4, tweede en
      derde lid, van de Wet participatiebudget, zoals dat artikel luidde op de dag, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0025039
      [ref2]: https://wetten.overheid.nl/BWBR0036013#ArtikelXXXVIb
      [ref3]: https://wetten.overheid.nl/BWBR0025039#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0025039#Artikel4
    url: https://wetten.overheid.nl/BWBR0036013/2017-04-01#ArtikelXXXVIc
