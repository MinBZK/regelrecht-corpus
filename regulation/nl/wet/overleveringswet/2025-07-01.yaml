  - number: '40'
    text: |-
      1 Uiterlijk tien dagen nadat een verklaring overeenkomstig [artikel 39][ref1] is afgelegd, beslist de rechtbank
      of de opgeëiste persoon ter beschikking zal worden gesteld van de uitvaardigende justitiële autoriteit van wie de
      signalering als bedoeld in [artikel 4, eerste en tweede lid][ref2], of het Europees aanhoudingsbevel is uitgegaan.

      2 Het eerste lid blijft in ieder geval buiten toepassing indien voor het feit of de feiten, in verband waarmee
      de signalering is gedaan of het Europees aanhoudingsbevel is afgegeven, ingevolge [artikel 9, tweede lid][ref3],
      [artikel 10][ref4] of [artikel 11][ref5] geen overlevering wordt toegestaan.

      3 De rechtbank kan het eerste lid buiten toepassing laten indien blijkt dat tegen de opgeëiste persoon in Nederland
      een strafrechtelijke vervolging gaande is of dat tegen hem door een Nederlandse rechter een nog geheel of ten dele
      voor tenuitvoerlegging vatbaar strafvonnis is gewezen.

      4 In de beslissing, bedoeld in het eerste lid, worden het feit of de feiten waarvoor de opgeëiste persoon ter
      beschikking wordt gesteld, de bedingen waaronder de overlevering wordt toegestaan, bedoeld in [artikel 14][ref6],
      en, in voorkomend geval, de garantie tot teruglevering, bedoeld in [artikel 6, eerste lid][ref7], vermeld.

      5 Van elke beslissing, genomen krachtens het eerste lid van dit artikel, geeft de officier van justitie onverwijld
      kennis aan de opgeëiste persoon en de uitvaardigende justitiële autoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel39
