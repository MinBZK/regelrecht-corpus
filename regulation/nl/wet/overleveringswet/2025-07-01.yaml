  - number: '13'
    text: |-
      1 Overlevering kan worden geweigerd indien het Europees aanhoudingsbevel betrekking heeft op een strafbaar feit
      dat:

      a. geacht wordt geheel of gedeeltelijk op Nederlands grondgebied of buiten Nederland aan boord van een Nederlands
      vaartuig of luchtvaartuig te zijn gepleegd; of

      b. buiten het grondgebied van de uitvaardigende staat is gepleegd, terwijl naar Nederlands recht geen vervolging
      zou kunnen worden ingesteld indien het feit buiten Nederland zou zijn gepleegd.

      2
    url: https://wetten.overheid.nl/BWBR0016664/2025-07-01#Artikel13
  - number: '14'
    text: |-
      1 Overlevering wordt niet toegestaan dan onder het algemene beding, dat de opgeëiste persoon niet zal worden
      vervolgd, gestraft of op enige andere wijze in zijn persoonlijke vrijheid beperkt, ter zake van feiten die vóór het
      tijdstip van zijn overlevering zijn begaan en waarvoor hij niet is overgeleverd, tenzij:

      a. de opgeëiste persoon, hoewel hij daartoe de mogelijkheid had, niet binnen 45 dagen na zijn definitieve
      invrijheidstelling het grondgebied van de lidstaat waaraan hij is overgeleverd, heeft verlaten of indien hij na dit
      gebied verlaten te hebben daarnaar is teruggekeerd;

      b. de feiten niet zijn bedreigd met een vrijheidsstraf;

      c. de strafvervolging niet leidt tot de toepassing van enige maatregel die de vrijheid beperkt;

      d. het gaat om de tenuitvoerlegging van een andere dan een vrijheidsstraf, met inbegrip van een vervangende straf
      waaronder vervangende hechtenis;

      e. de opgeëiste persoon overeenkomstig [artikel 39][ref1] heeft ingestemd met zijn onmiddellijke overlevering en
      daarbij op hetzelfde tijdstip afstand heeft gedaan van de bescherming van het specialiteitsbeginsel;

      f. de opgeëiste persoon na zijn overlevering uitdrukkelijk met een vervolging heeft ingestemd; of

      g. daartoe voorafgaand toestemming aan de rechtbank wordt gevraagd en deze is verkregen.

      2 Overlevering wordt voorts niet toegestaan dan onder het algemene beding, dat de opgeëiste persoon niet ter
      beschikking zal worden gesteld van de autoriteiten van een andere lidstaat van de Europese Unie, ter zake van
      feiten die vóór het tijdstip van zijn overlevering zijn begaan, tenzij:

      a. de opgeëiste persoon, hoewel hij daartoe de mogelijkheid had, niet binnen 45 dagen na zijn definitieve
      invrijheidstelling het grondgebied van de lidstaat waaraan hij is overgeleverd, heeft verlaten of indien hij na dit
      gebied verlaten te hebben daarnaar is teruggekeerd;

      b. de opgeëiste persoon na zijn overlevering daarmee uitdrukkelijk heeft ingestemd;

      c. de opgeëiste persoon, overeenkomstig het eerste lid, onderdeel a, e, f, of g, niet de bescherming van het
      specialiteitsbeginsel geniet; of

      d. daartoe voorafgaand toestemming wordt gevraagd aan de rechtbank en deze is verkregen.

      3 De officier van justitie vordert uiterlijk op de derde dag na ontvangst van een verzoek van de uitvaardigende
      justitiële autoriteit om de in het eerste lid, onderdeel g, of het tweede lid, onderdeel d, bedoelde toestemming,
      schriftelijk dat de rechtbank het verzoek in behandeling zal nemen. De officier van justitie legt daartoe
      het verzoek met bijbehorende vertaling aan de rechtbank over. Voorafgaand aan de beslissing op een verzoek om
      toestemming heeft de opgeëiste persoon de gelegenheid te worden gehoord. De rechtbank treedt zo nodig in overleg
      met de uitvaardigende justitiële autoriteit om overeen te komen of het verhoor door de rechtbank, dan wel de
      uitvaardigende justitiële autoriteit plaatsvindt, en al hetgeen overigens voor dit verhoor noodzakelijk is. De
      rechtbank geeft de toestemming ten aanzien van feiten waarvoor krachtens deze wet overlevering had kunnen worden
      toegestaan. De beslissing op een vordering wordt in elk geval binnen zevenentwintig dagen na de ontvangst ervan
      genomen. De officier van justitie brengt de beslissing van de rechtbank onverwijld ter kennis van de uitvaardigende
      justitiële autoriteit.

      4 Overlevering wordt voorts niet toegestaan dan onder het algemene beding, dat de opgeëiste persoon niet ter
      beschikking zal worden gesteld van de autoriteiten van een derde staat, ter zake van feiten die vóór het tijdstip
      van zijn overlevering zijn begaan, tenzij daartoe voorafgaand toestemming wordt verzocht aan Onze Minister en deze
      is verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel39
