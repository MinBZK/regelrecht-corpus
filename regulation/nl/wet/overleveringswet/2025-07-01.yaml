  - number: '51'
    text: |-
      1 Opgeëiste personen die, ten behoeve van een strafrechtelijk onderzoek of de tenuitvoerlegging van een
      strafvonnis, door de uitvoerende justitiële autoriteit van een lidstaat feitelijk worden overgeleverd aan de
      uitvaardigende justitiële autoriteit van een andere lidstaat of door een derde staat aan een andere lidstaat worden
      uitgeleverd, kunnen met toestemming van de officier van justitie over Nederlands grondgebied worden vervoerd.

      2 Toestemming voor vervoer over land wordt gegeven door de officier van justitie mits de volgende gegevens zijn
      ontvangen:

      a. de identiteit en de nationaliteit van de persoon tegen wie het Europees aanhoudingsbevel is afgegeven of ten
      aanzien van wie een uitleveringsverzoek is gedaan;

      b. het bestaan van een Europees aanhoudingsbevel of van een uitleveringsverzoek aan een derde staat;

      c. de aard en wettelijke kwalificatie van het strafbare feit;

      d. een beschrijving van de omstandigheden waaronder het strafbare feit is begaan, met inbegrip van tijd en plaats.

      3 De doorvoer van Nederlanders of daarmee op grond van deze wet gelijkgestelde vreemdelingen ten behoeve van een
      tegen hen gericht strafrechtelijk onderzoek kan afhankelijk worden gesteld van een garantie van teruglevering
      als bedoeld in [artikel 6, eerste lid][ref1]. De doorvoer van Nederlanders of daarmee op grond van deze wet
      gelijkgestelde vreemdelingen ten behoeve van de tenuitvoerlegging van een bij onherroepelijk vonnis aan hen
      opgelegde vrijheidsstraf kan worden geweigerd.

      4 De toestemming van de officier van justitie is niet vereist voor vervoer door de lucht waarbij geen landing op
      Nederlands gebied wordt gemaakt.

      5 In geval van een niet voorziene landing op Nederlands grondgebied kan de opgeëiste persoon, op verzoek van de
      hem begeleidende buitenlandse ambtenaren, voorlopig worden aangehouden krachtens een bevel van de officier of
      hulpofficier van justitie. [Artikel 17][ref2] is van overeenkomstige toepassing.

      6 Het vervoer van de voorlopig aangehouden opgeëiste persoon kan worden voortgezet, zodra de officier van justitie
      de in het tweede lid bedoelde informatie heeft ontvangen en daartoe toestemming verleent. Is de toestemming na
      afloop van de termijn van inverzekeringstelling nog niet verleend of binnen die termijn geweigerd, dan wordt de
      opgeëiste persoon terstond in vrijheid gesteld, behoudens de mogelijkheid van verdere vrijheidsbeneming uit anderen
      hoofde.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0016664#Artikel17
    url: https://wetten.overheid.nl/BWBR0016664/2025-07-01#Artikel51
