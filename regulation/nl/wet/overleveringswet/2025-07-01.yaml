  - number: '26'
    text: |-
      1 De rechtbank onderzoekt de identiteit van de opgeëiste persoon op de wijze, bedoeld in
      [artikel 27a, eerste lid, eerste volzin, van het Wetboek van Strafvordering][ref1], alsmede de ontvankelijkheid
      van het Europees aanhoudingsbevel en de mogelijkheid van overlevering. De rechtbank is tevens bevoegd de identiteit
      van de opgeëiste persoon vast te stellen op de wijze, bedoeld in artikel 27a, tweede lid, van dat wetboek, indien
      over zijn identiteit twijfel bestaat. [Artikel 29c, tweede lid, van dat wetboek][ref2] is van overeenkomstige
      toepassing.

      2 De officier van justitie geeft ter zitting van de rechtbank zijn opvatting over de verzochte overlevering en
      legt een schriftelijke samenvatting, waarin, in voorkomend geval, de beslissing tot staking van de vervolging is
      vermeld, aan de rechtbank over. De opgeëiste persoon en diens raadsman worden eveneens in de gelegenheid gesteld
      tot het maken van ter zake dienende opmerkingen omtrent het Europees aanhoudingsbevel en de in verband daarmede te
      nemen beslissingen.

      3 In geval van samenloop van Europese aanhoudingsbevelen vermeldt de officier van justitie eveneens aan welk van de
      Europese aanhoudingsbevelen – voor zover de overlevering op basis daarvan kan worden toegestaan – de rechtbank naar
      zijn oordeel voorrang zal geven, daarbij rekening houdend met het belang van een goede rechtsbedeling en voorts in
      het bijzonder met:

      a. de meerdere of mindere ernst van de verschillende feiten waarvoor de overlevering is gevraagd;

      b. de plaats of plaatsen waar de feiten zijn begaan;

      c. de data van de onderscheiden Europese aanhoudingsbevelen;

      d. het doel van de overlevering;

      e. de mate waarin de nationaliteit van de opgeëiste persoon een belemmering zal vormen voor verderlevering;

      f. de mogelijkheid dat de opgeëiste persoon, nadat hij naar het grondgebied van een van de betrokken lidstaten
      is verwijderd, vervolgens door de justitiële autoriteiten van die lidstaat ter beschikking wordt gesteld van de
      uitvaardigende justitiële autoriteit van een andere lidstaat.

      4 Indien de rechtbank zulks met het oog op het door haar krachtens het eerste lid in te stellen onderzoek
      noodzakelijk acht, gelast zij, rekening houdend met de termijnen, genoemd in [artikel 22][ref3], – zo nodig onder
      bijvoeging van een bevel tot medebrenging – tegen een door haar te bepalen tijdstip de dagvaarding of schriftelijke
      oproeping van getuigen of deskundigen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel27a
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel29c
