  - number: '75'
    text: |-
      Deze wet treedt in werking met ingang van 1 januari 2004. Indien het Staatsblad waarin deze wet wordt geplaatst,
      wordt uitgegeven na 31 december 2003, treedt zij in werking met ingang van de dag na de datum van uitgifte van het
      Staatsblad waarin zij wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0016664/2025-07-01#Artikel75
