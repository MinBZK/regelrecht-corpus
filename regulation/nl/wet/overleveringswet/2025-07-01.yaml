        paragraaf: D
        afdeling: '2'
  - number: '38'
    text: |-
      Bij de feitelijke overlevering deelt de officier van justitie aan de uitvaardigende justitiële autoriteit of, in
      voorkomend geval, aan de bevoegde centrale autoriteit de duur van de vrijheidsbeneming van de opgeëiste persoon met
      het oog op zijn overlevering, mee.
    url: https://wetten.overheid.nl/BWBR0016664/2025-07-01#Artikel38
  - number: '39'
    text: |-
      1 De opgeëiste persoon die overeenkomstig [artikel 4, eerste of tweede lid][ref1], is gesignaleerd ter fine van
      aanhouding met het oog op zijn overlevering of ten aanzien van wie een Europees aanhoudingsbevel is ontvangen,
      kan, uiterlijk op de dag voorafgaande aan die welke overeenkomstig [artikel 24][ref2] is bepaald voor zijn verhoor
      door de rechtbank, verklaren dat hij instemt met zijn onmiddellijke overlevering en, in voorkomend geval, dat hij
      afstand doet van de bescherming van het specialiteitsbeginsel.

      2 Een verklaring overeenkomstig het eerste lid kan tijdens de termijn van inverzekeringstelling als bedoeld in
      [artikel 17, vierde lid, eerste volzin][ref3], of [artikel 21, vijfde lid][ref4], worden afgelegd voor elke
      rechtbank. Nadien kan de verklaring uitsluitend worden afgelegd ten overstaan van de rechtbank. De afgelegde
      verklaring kan niet worden herroepen.

      3 De rechtbank is bevoegd de identiteit van de opgeëiste persoon vast te stellen op de wijze, bedoeld
      in [artikel 27a, eerste lid, eerste volzin, en tweede lid, van het Wetboek van Strafvordering][ref5].
      [Artikel 29c, tweede lid, van dat wetboek][ref6] is van overeenkomstige toepassing.

      4 De opgeëiste persoon kan zich bij het afleggen van de verklaring doen bijstaan door een raadsman. Hierop wordt,
      zo hij zonder raadsman verschijnt, zijn aandacht gevestigd door de rechtbank.

      5 Voordat hij de verklaring aflegt, wordt de opgeëiste persoon op de mogelijke gevolgen daarvan gewezen. Van de
      verklaring wordt proces-verbaal opgemaakt.

      6 De rechtbank waarvoor de verklaring is afgelegd, zendt het proces-verbaal daarvan onverwijld aan de officier
      van justitie.


