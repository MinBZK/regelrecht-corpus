        artikel: 5.1.8
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 5.1.9
  - number: '54'
    text: |-
      1 De rechtbank staat op verzoek van de uitvaardigende justitiële autoriteit, gehoord de officier van justitie,
      toe dat een opgeëiste persoon die op basis van een Europees aanhoudingsbevel ten behoeve van een tegen hem gericht
      strafrechtelijk onderzoek is aangehouden, voorafgaand aan de beslissing over de overlevering, tijdelijk ter
      beschikking wordt gesteld van de uitvaardigende justitiële autoriteit voor het afleggen van een verklaring.

      2 De rechtbank staat de tijdelijke terbeschikkingstelling niet toe, indien de opgeëiste persoon daardoor niet
      aanwezig zou kunnen zijn op het door de rechtbank, overeenkomstig [artikel 24, eerste lid][ref1], bepaalde tijdstip
      waarop de opgeëiste persoon zal worden gehoord.

      3 De rechtbank bepaalt daartoe, gehoord de officier van justitie, in overleg met de uitvaardigende justitiële
      autoriteit de duur van de terbeschikkingstelling en de voorwaarden waaronder de terbeschikkingstelling plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel24
    url: https://wetten.overheid.nl/BWBR0016664/2025-07-01#Artikel54
