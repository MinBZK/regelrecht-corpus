  - number: '42'
    text: |-
      1 Na de dag waarop hij de in [artikel 39][ref1] bedoelde verklaring heeft afgelegd, kan de opgeëiste persoon nog
      slechts gedurende ten hoogste twintig dagen in bewaring of in verzekering gesteld blijven.

      2 Het eerste lid blijft buiten toepassing, indien de rechtbank heeft beslist dat aan de verklaring geen gevolg zal
      worden gegeven en het Europees aanhoudingsbevel, overeenkomstig [artikel 23, tweede lid][ref2], aan de rechtbank
      is overgelegd.

      3 De in het eerste lid van dit artikel gestelde termijn kan, op vordering van de officier van justitie,
      door de rechtbank telkens met ten hoogste dertig dagen worden verlengd uitsluitend wanneer de feitelijke
      overlevering door omstandigheden buiten de macht van enige lidstaat of door ernstige humanitaire
      redenen niet binnen de termijn van twintig dagen, bedoeld in het eerste lid, heeft kunnen plaatsvinden.
      [Artikel 35, tweede tot en met vierde lid][ref3], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0016664#Artikel23
