  - number: '20'
    text: |-
      1 Een Europees aanhoudingsbevel wordt, zo het niet aan de officier van justitie is toegezonden, onverwijld aan
      hem doorgezonden.

      2 Een Europees aanhoudingsbevel kan slechts in behandeling worden genomen, indien het voldoet aan de vereisten
      omschreven in [artikel 2][ref1].

      3 Indien een Europees aanhoudingsbevel naar het oordeel van de officier van justitie niet voldoet aan de eisen
      omschreven in [artikel 2][ref2] biedt hij de uitvaardigende justitiële autoriteit de gelegenheid tot completering
      of verbetering.

      4 Indien naar het oordeel van de officier van justitie, dan wel naar het oordeel van de rechtbank
      naast het Europees aanhoudingsbevel aanvullende gegevens noodzakelijk zijn, met name in verband met de
      [artikelen 7 tot en met 9][ref3] en [11 tot en met 13][ref4], stelt de officier van justitie de uitvaardigende
      justitiële autoriteit in de gelegenheid tot completering of verbetering, rekening houdend met de in
      [artikel 22][ref5] genoemde termijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel2
