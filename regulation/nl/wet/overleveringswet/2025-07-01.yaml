  - number: 21a
    text: |-
      De opgeëiste persoon die is aangehouden, kan verzoeken een advocaat in de uitvaardigende lidstaat aan te wijzen
      met het oog op het, door het verstrekken van informatie en advies, verlenen van bijstand aan zijn raadsman in
      Nederland ten behoeve van de procedure voor overlevering in Nederland. De officier van justitie stelt na ontvangst
      van het verzoek de uitvaardigende justitiële autoriteit terstond van het verzoek in kennis; de termijnen voor de
      behandeling van het Europees aanhoudingsbevel gelden onverkort.
    url: https://wetten.overheid.nl/BWBR0016664/2025-07-01#Artikel21a
  - number: '22'
    text: |-
      1 De uitspraak, houdende de beslissing over de overlevering dient door de rechtbank te worden gedaan uiterlijk
      zestig dagen na de aanhouding van de opgeëiste persoon, bedoeld in [artikel 21][ref1].

      2 Indien de overlevering mede afhankelijk is van de instemming van de bevoegde autoriteit van een andere lidstaat
      of van een derde staat, begint de in het eerste lid genoemde termijn te lopen vanaf de dag dat de vereiste
      instemming is ontvangen.

      3 In specifieke gevallen en onder opgave van redenen aan de uitvaardigende justitiële autoriteit kan de rechtbank
      de termijn van zestig dagen met maximaal dertig dagen verlengen.

      4 In uitzonderlijke gevallen kan de rechtbank, totdat zij uitspraak doet, de in het derde lid bedoelde termijn met
      telkens maximaal zestig dagen verlengen, behoudens het vijfde lid. Van een uitzonderlijk geval is in ieder geval
      sprake indien:

      a. de rechtbank binnen de in het derde lid bedoelde termijn nog geen uitspraak heeft kunnen doen, omdat zij
      voornemens is om een of meer prejudiciële vragen voor te leggen aan het Hof van Justitie van de Europese Unie of in
      afwachting is van een uitspraak van dat Hof over prejudiciële vragen die relevant zijn voor haar beslissing;

      b. de rechtbank binnen de in het derde lid bedoelde termijn nog geen uitspraak heeft kunnen doen, omdat zij
      onderzoek doet naar een reëel gevaar van schending van de grondrechten van de opgeëiste persoon, als bedoeld in
      [artikel 11, eerste lid][ref2];

      c. de rechtbank haar beslissing heeft aangehouden krachtens [artikel 11, tweede lid][ref3].

      5 In het uitzonderlijke geval, bedoeld in het vierde lid, onderdeel b, kan de rechtbank de termijn met telkens
      maximaal dertig dagen verlengen, totdat het onderzoek is afgerond en de rechtbank uitspraak doet.

      6 In geval van verlenging van de termijn als bedoeld in het vierde en vijfde lid stelt de officier van justitie
      Eurojust en de uitvaardigende justitiële autoriteit daarvan onverwijld in kennis, onder opgave van de redenen voor
      de vertraging.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0016664#Artikel11
