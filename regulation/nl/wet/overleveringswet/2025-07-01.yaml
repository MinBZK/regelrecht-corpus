  - number: '52'
    text: |-
      1 Bij vervoer te land, overeenkomstig [artikel 51][ref1], is de bewaking van de opgeëiste persoon opgedragen
      aan Nederlandse ambtenaren die bevoegd zijn alle dienstige maatregelen te nemen ter beveiliging van de opgeëiste
      persoon en ter voorkoming van zijn ontvluchting.

      2 Indien het ten gevolge van bijzondere omstandigheden niet mogelijk is het vervoer door Nederland zonder
      onderbreking voort te zetten, kan de opgeëiste persoon, in afwachting van een passende gelegenheid tot vertrek
      naar elders, zo nodig worden opgenomen in een huis van bewaring, zulks op vertoon van een stuk waaruit de door de
      officier van justitie verleende toestemming tot het vervoer blijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel51
    url: https://wetten.overheid.nl/BWBR0016664/2025-07-01#Artikel52
