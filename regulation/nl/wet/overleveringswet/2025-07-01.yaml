  - number: '7'
    text: |-
      1 Overlevering kan worden toegestaan ten behoeve van:

      a. een door autoriteiten van de uitvaardigende lidstaat of het Europees Openbaar Ministerie bedoeld in artikel 1
      van Verordening EOM, ingesteld strafrechtelijk onderzoek ter zake van het vermoeden dat de opgeëiste persoon zich
      naar het oordeel van de uitvaardigende justitiële autoriteit schuldig heeft gemaakt aan:

      1º. een naar het recht van de uitvaardigende lidstaat benoemd strafbaar feit dat tevens op de in [bijlage 1][ref1]
      bij deze wet behorende lijst staat vermeld, waarop naar het recht van de uitvaardigende lidstaat een vrijheidsstraf
      met een maximum van ten minste drie jaren is gesteld; of

      2º. een ander feit dat zowel naar het recht van de uitvaardigende lidstaat als naar dat van Nederland strafbaar is
      en waarop naar het recht van de uitvaardigende lidstaat een vrijheidsstraf met een maximum van ten minste twaalf
      maanden is gesteld;

      b. de tenuitvoerlegging van een vrijheidsstraf van vier maanden, of van langere duur, door de opgeëiste persoon
      op het grondgebied van de uitvaardigende lidstaat te ondergaan wegens een feit als onder 1° bedoeld of wegens een
      ander feit dat zowel naar het recht van de uitvaardigende lidstaat als naar dat van Nederland strafbaar is.

      2 Overlevering kan, behoudens het derde lid, worden geweigerd indien sprake is van:

      a. een ander feit als bedoeld in het eerste lid, onderdeel a, onder 2°, maar dat niet strafbaar is naar Nederlands
      recht, ongeacht de bestanddelen of de kwalificatie ervan; of

      b. de tenuitvoerlegging van een vrijheidsstraf van vier maanden, of van langere duur, door de opgeëiste persoon op
      het grondgebied van de uitvaardigende lidstaat te ondergaan wegens een ander feit als bedoeld in het eerste lid,
      onderdeel b, maar dat niet strafbaar is naar Nederlands recht, ongeacht de bestanddelen of de kwalificatie ervan.

      3 Ter zake van retributies en belastingen, douane en deviezen mag de overlevering niet worden geweigerd op grond
      van het feit dat Nederland niet dezelfde soort retributies of belastingen heft, of niet dezelfde soort regelgeving
      inzake retributies, belastingen, douane en deviezen kent als de uitvaardigende lidstaat.

      4 De in het eerste lid, onderdeel a, onder 1°, bedoelde lijst kan, wanneer de Raad van de Europese Unie besluit
      tot uitbreiding of wijziging van de daarop vermelde strafbare feiten, bij algemene maatregel van bestuur worden
      herzien. De voordracht voor deze algemene maatregel van bestuur wordt niet eerder gedaan dan vier weken nadat het
      ontwerp aan beide kamers der Staten-Generaal is overgelegd.

      5 Voor de toepassing van het eerste lid, onderdeel a, onder 2°, wordt onder een naar Nederlands recht strafbaar
      feit mede verstaan een feit waardoor inbreuk is gemaakt op de rechtsorde van de verzoekende staat, terwijl
      krachtens de Nederlandse wet eenzelfde inbreuk op de Nederlandse rechtsorde strafbaar is.

      6 Indien het Europees aanhoudingsbevel betrekking heeft op verscheidene afzonderlijke feiten die hetzij naar het
      recht van zowel de uitvaardigende als de uitvoerende lidstaat strafbaar zijn, hetzij uitsluitend naar het recht van
      de uitvaardigende lidstaat strafbaar zijn, maar waarvan één of meer van die feiten niet voldoen aan de voorwaarde
      met betrekking tot de hoogte van de straf, bedoeld in het eerste lid, onderdeel a, onder 2°, of onderdeel b, kan de
      overlevering ook voor deze feiten worden toegestaan, gelijktijdig met de overlevering voor het feit dat wel voldoet
      of de feiten die wel voldoen aan die voorwaarde.

      7 [Artikel 51a van de Uitleveringswet][ref2] is van overeenkomstige toepassing op overlevering tussen de lidstaten
      van de Europese Unie.


