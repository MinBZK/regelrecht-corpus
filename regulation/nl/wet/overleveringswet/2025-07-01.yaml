        paragraaf: C
        afdeling: '2'
  - number: '55'
    text: |-
      Elke rechter-commissaris kan de uitvoerende justitiële autoriteit verzoeken voorwerpen, aangetroffen
      in het bezit van degene wiens overlevering hij op basis van een signalering als bedoeld in
      [artikel 4, eerste en tweede lid][ref1] of van een Europees aanhoudingsbevel heeft gevraagd, in beslag te nemen en
      aan hem over te dragen.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel4
    url: https://wetten.overheid.nl/BWBR0016664/2025-07-01#Artikel55
    references:
