  - number: '23'
    text: |-
      1 Indien de officier van justitie reeds aanstonds van oordeel is dat de overlevering niet kan worden
      toegestaan op grond van het voorliggende Europees aanhoudingsbevel, brengt hij dit oordeel uiterlijk op
      de derde dag na ontvangst van het Europees aanhoudingsbevel ter kennis van de rechtbank, onder overlegging
      van het Europees aanhoudingsbevel met bijbehorende vertaling. De rechtbank kan in dat geval het bepaalde in
      [artikel 23, tweede lid, van het Wetboek van Strafvordering][ref1] buiten toepassing laten. De rechtbank beslist
      binnen een termijn van tien dagen over het reeds aanstonds weigeren van de overlevering. Indien de rechtbank
      beslist dat het Europees aanhoudingsbevel wordt geweigerd, stelt de officier van justitie de uitvaardigende
      justitiële autoriteit onmiddellijk in kennis van deze beslissing.

      2 In alle andere gevallen vordert de officier van justitie uiterlijk op de derde dag na de ontvangst van het
      Europees aanhoudingsbevel of op de derde dag na de beslissing van de rechtbank dat het Europees aanhoudingsbevel
      niet reeds aanstonds kan worden geweigerd schriftelijk, dat de rechtbank het aanhoudingsbevel in behandeling zal
      nemen. Hij legt daartoe het Europees aanhoudingsbevel met bijbehorende vertaling en, in voorkomend geval, van
      de uitvaardigende justitiële autoriteit ontvangen aanvullende informatie aan de rechtbank over. In voorkomend
      geval vermeldt hij daarbij dat ten aanzien van de opgeëiste persoon een concurrerend uitleveringsverzoek ter fine
      van strafvervolging is ontvangen en dat het Europees aanhoudingsbevel is uitgevaardigd nadat de uitvaardigende
      justitiële autoriteit overeenkomstig [artikel 2, derde lid][ref2], in de gelegenheid is gesteld om een Europees
      aanhoudingsbevel uit te vaardigen voor dezelfde feiten als die welke aan het uitleveringsverzoek ten grondslag
      liggen.

      3 Een afschrift van de krachtens het tweede lid vereiste vordering, met als bijlage een kopie van het Europees
      aanhoudingsbevel, de bijbehorende vertaling en, in voorkomend geval, de aanvullende informatie wordt aan de
      opgeëiste persoon betekend. De eerste volzin geldt eveneens in het geval dat de officier van justitie naar
      aanleiding van een naderhand ontvangen ander Europees aanhoudingsbevel zijn vordering heeft aangevuld of
      gewijzigd. Van de ontvangst van aanvullende stukken, die in het dossier worden gevoegd, wordt de opgeëiste
      persoon mededeling gedaan. Indien de opgeëiste persoon de taal waarin het Europees aanhoudingsbevel is gesteld
      of die van de bijbehorende vertaling niet of onvoldoende beheerst, wordt hem een schriftelijke vertaling van ten
      minste de relevante onderdelen van het Europees aanhoudingsbevel in een voor hem begrijpelijke taal verstrekt.
      Als relevante onderdelen worden aangemerkt de lidstaat waarin het bevel is uitgevaardigd, het besluit dat aan het
      aanhoudingsbevel ten grondslag ligt en de duur van de nog uit te zitten straf dan wel een beknopte omschrijving van
      het strafbare feit dat ten grondslag ligt aan het bevel.

      4 Het derde lid is van overeenkomstige toepassing indien de officier naar aanleiding van een naderhand ontvangen
      uitleveringsverzoek zijn vordering heeft aangevuld of gewijzigd.

      5 Indien tegen de opgeëiste persoon in Nederland een strafvervolging gaande is voor het feit dat aan het Europees
      aanhoudingsbevel ten grondslag ligt, zendt de officier van justitie eveneens een afschrift van zijn vordering
      ter kennisneming aan de officier van justitie die met de vervolging is belast, met het verzoek hem onverwijld te
      informeren of de vervolging kan worden gestaakt.

      6 Indien tegen de opgeëiste persoon in Nederland een strafvervolging gaande is voor een ander feit dan aan het
      Europees aanhoudingsbevel ten grondslag ligt, zendt de officier van justitie eveneens een afschrift van zijn
      vordering ter kennisneming aan de officier van justitie die met de vervolging is belast, met het verzoek hem
      onverwijld te informeren over de stand van zaken met betrekking tot die vervolging.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0016664#Artikel2
