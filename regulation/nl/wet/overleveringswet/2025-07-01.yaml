        artikel: '81'
  - number: '65'
    text: |-
      Op bevelen tot beëindiging van vrijheidsbeneming, krachtens deze wet gegeven, en op de tenuitvoerlegging van
      zodanige bevelen zijn de [artikelen 73][ref1], [79][ref2], [6:2:5 van het Wetboek van Strafvordering][ref3] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel73
