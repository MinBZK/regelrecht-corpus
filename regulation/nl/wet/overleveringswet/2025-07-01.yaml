  - number: '3'
    text: |-
      1 Het Europees aanhoudingsbevel kan, indien de verblijfplaats van de opgeëiste persoon bekend is, door de
      uitvaardigende justitiële autoriteit rechtstreeks worden toegezonden aan de uitvoerende justitiële autoriteit in de
      lidstaat van verblijf.

      2 Rechtstreekse toezending als bedoeld in het eerste lid is niet toegestaan in die gevallen dat een lidstaat voor
      de toezending of de ontvangst van Europese aanhoudingsbevelen een centrale autoriteit heeft aangewezen.

      3 De toezending kan plaatsvinden per gewone post, telefax of, mits de mogelijkheid bestaat om de echtheid van de
      herkomst vast te stellen, per elektronische post.
    url: https://wetten.overheid.nl/BWBR0016664/2025-07-01#Artikel3
  - number: '4'
    text: |-
      1 De uitvaardigende justitiële autoriteit kan besluiten de opgeëiste persoon te doen signaleren in het Schengen-
      informatiesysteem, overeenkomstig artikel 95 van de Uitvoeringsovereenkomst van Schengen.

      2 Met het oog op de opsporing en aanhouding in een lidstaat van de Europese Unie die geen toegang heeft tot het
      Schengen-informatie systeem kan de uitvaardigende justitiële autoriteit eveneens besluiten de opgeëiste persoon te
      signaleren via Interpol.

      3 Een signalering, bedoeld in het eerste en tweede lid, dient onmiddellijk nadat de opgeëiste persoon is
      aangetroffen, te worden gevolgd door toezending van het Europees aanhoudingsbevel aan de in [artikel 3][ref1]
      bedoelde autoriteit.

      4 Een signalering, bedoeld in het eerste lid, wordt voor de toepassing van deze wet gelijkgesteld met een Europees
      aanhoudingsbevel, mits daarin alle gegevens, bedoeld in [artikel 2, tweede lid][ref2], zijn opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel3
