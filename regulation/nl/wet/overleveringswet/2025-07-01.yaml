  - number: '27'
    text: |-
      1 Op vordering van de officier van justitie kan de rechtbank ter zitting de gevangenneming van de opgeëiste persoon
      bevelen.

      2 Voordat het onderzoek ter zitting wordt gesloten, beslist de rechtbank ambtshalve omtrent de gevangenhouding van
      de opgeëiste persoon, zo deze in bewaring of in verzekering is gesteld.

      3 In geval van verlenging van de termijn als bedoeld in [artikel 22, vierde en vijfde lid][ref1], beslist de
      rechtbank ten minste bij elke verlenging ambtshalve omtrent de verlenging van de vrijheidsbeneming van de opgeëiste
      persoon.

      4 In geval van weigering van de overlevering als bedoeld in [artikel 6a, eerste lid][ref2], kan de rechtbank de
      gevangenhouding van de opgeëiste persoon bevelen tot aan de tenuitvoerlegging van de vrijheidsstraf.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0016664#Artikel6a
