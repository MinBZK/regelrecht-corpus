  - number: '67'
    text: |-
      1 In gevallen waarin de overlevering is geweigerd, kan de rechtbank, op verzoek van de opgeëiste persoon,
      hem een vergoeding ten laste van de Staat toekennen voor de schade die hij heeft geleden ten gevolge
      van vrijheidsbeneming, bevolen krachtens deze wet. Onder schade is begrepen het nadeel dat niet in
      vermogensschade bestaat. De [artikelen 533, derde, vierde en zesde lid][ref1], [534][ref2], [535][ref3] en
      [536 van het Wetboek van Strafvordering][ref4] zijn van overeenkomstige toepassing.

      2 In gevallen als bedoeld in het eerste lid vinden de [artikelen 529][ref5] en
      [530 van het Wetboek van Strafvordering][ref6] overeenkomstige toepassing op vergoeding van kosten en schaden
      voor de opgeëiste persoon of diens erfgenamen. In de plaats van het in die artikelen bedoelde gerecht treedt de
      rechtbank.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel533
