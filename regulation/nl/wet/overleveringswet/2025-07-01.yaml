  - number: '41'
    text: |-
      1 Indien de rechtbank overeenkomstig [artikel 40][ref1] heeft beslist dat de opgeëiste persoon ter
      beschikking zal worden gesteld van de uitvaardigende justitiële autoriteit van de andere lidstaat, blijft
      [artikel 23, tweede lid][ref2], buiten toepassing.

      2 Is de in [artikel 23, tweede lid][ref3], bedoelde vordering reeds bij de rechtbank ingediend, dan wordt deze
      onverwijld ingetrokken. De griffier van de rechtbank stelt alsdan het Europees aanhoudingsbevel, met de daarbij
      behorende stukken, weer in handen van de officier van justitie.

      3 Van het intrekken van de vordering geeft de officier van justitie kennis aan de opgeëiste persoon.


