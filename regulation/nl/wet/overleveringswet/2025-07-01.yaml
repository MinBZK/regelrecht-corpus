        bwb_id: BWBR0016664
        artikel: '4'
        hoofdstuk: I
        afdeling: '2'
  - number: '56'
    text: |-
      1 De rechter-commissaris die een Europees aanhoudingsbevel heeft uitgevaardigd of de officier van justitie die
      een Europees aanhoudingsbevel of uitleveringsverzoek in behandeling heeft genomen, zendt een verzoek om doorvoer
      van een opgeëiste persoon aan de bevoegde autoriteit van de lidstaat van de Europese Unie over wiens grondgebied
      betrokkene moet worden vervoerd.

      2 Een verzoek om doorvoer dient de volgende gegevens te bevatten:

      a. de identiteit en de nationaliteit van de persoon tegen wie het Europees aanhoudingsbevel is afgegeven of ten
      aanzien van wie een uitleveringsverzoek is gedaan;

      b. het bestaan van een Europees aanhoudingsbevel of van een uitleveringsverzoek aan een derde staat;

      c. de aard en wettelijke kwalificatie van het strafbare feit;

      d. een beschrijving van de omstandigheden waaronder het strafbare feit is begaan, met inbegrip van tijd en plaats.
    url: https://wetten.overheid.nl/BWBR0016664/2025-07-01#Artikel56
  - number: '57'
    text: |-
      De rechter-commissaris kan de uitvoerende justitiële autoriteit verzoeken om de persoon die op basis van een
      door hem afgegeven Europees aanhoudingsbevel ten behoeve van een tegen hem gericht strafrechtelijk onderzoek is
      aangehouden, voorafgaand aan de beslissing over diens overlevering:

      a. te horen in zijn aanwezigheid dan wel in de aanwezigheid van een door hem aangewezen vertegenwoordiger;

      b. tijdelijk over te brengen naar Nederland.
    url: https://wetten.overheid.nl/BWBR0016664/2025-07-01#Artikel57
  - number: '58'
    text: |-
      1 In de gevallen bedoeld in [artikel 57, onder b][ref1], bepaalt de rechter-commissaris die het Europees
      aanhoudingsbevel heeft uitgevaardigd in overleg met de uitvoerende justitiële autoriteit de duur van de
      terbeschikkingstelling en de voorwaarden waaronder de terbeschikkingstelling plaatsvindt.

      2 Gedurende zijn verblijf hier te lande wordt de tijdelijk ter beschikking gestelde persoon op bevel van de
      officier van justitie in verzekering gesteld. De [artikelen 61][ref2] en [64, eerste lid][ref3], zijn, voor zoveel
      nodig, van overeenkomstige toepassing.

      3 Bij de feitelijke overlevering is de bewaking van de ter beschikking gestelde persoon opgedragen aan Nederlandse
      ambtenaren die bevoegd zijn alle dienstige maatregelen te nemen ter beveiliging van de ter beschikking gestelde
      persoon en ter voorkoming van zijn ontvluchting.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0016664#Artikel61
      [ref3]: https://wetten.overheid.nl/BWBR0016664#Artikel64
