  - number: '44'
    text: Elke rechter-commissaris kan fungeren als uitvaardigende justitiële autoriteit.
    url: https://wetten.overheid.nl/BWBR0016664/2025-07-01#Artikel44
  - number: '45'
    text: |-
      1 Bij of in een Europees aanhoudingsbevel dient door de uitvaardigende rechter-commissaris te worden verklaard:

      a. indien de opgeëiste persoon een onderdaan is van de uitvoerende lidstaat, dat, zo hij ter zake van de feiten
      waarvoor de overlevering kan worden toegestaan in Nederland tot een onvoorwaardelijke vrijheidsstraf wordt
      veroordeeld, hij deze straf in de uitvoerende lidstaat zal mogen ondergaan;

      b. indien het strafbare feit dat aan het Europees aanhoudingsbevel ten grondslag ligt, is bedreigd met een
      levenslange vrijheidsstraf dat, in voorkomend geval, naar Nederlands recht de mogelijkheid bestaat van de
      toepassing van gratie op de opgelegde straf of maatregel.

      2 Aan een verklaring, bedoeld in het eerste lid, is iedere persoon of instantie die in Nederland is belast met een
      publieke taak, gebonden.
    url: https://wetten.overheid.nl/BWBR0016664/2025-07-01#Artikel45
  - number: 45a
    text: |-
      1 Indien het Europees aanhoudingsbevel strekt tot tenuitvoerlegging van een beslissing terwijl de verdachte niet
      in persoon is verschenen bij het proces dat tot de beslissing heeft geleid, verklaart de uitvaardigende rechter-
      commissaris in het Europees aanhoudingsbevel dat:

      a. de verdachte tijdig en in persoon is gedagvaard en daarbij op de hoogte is gebracht van de datum en plaats van
      het proces dat tot het vonnis heeft geleid of anderszins daadwerkelijk officieel in kennis is gesteld van de datum
      en de plaats van het proces, zodat op ondubbelzinnige wijze vaststaat dat hij op de hoogte was van het voorgenomen
      proces en ervan in kennis is gesteld dat een beslissing kan worden genomen wanneer hij niet op het proces
      verschijnt; of

      b. de verdachte op de hoogte was van het voorgenomen proces en een door hem gekozen of een hem van overheidswege
      toegewezen advocaat heeft gemachtigd zijn verdediging op het proces te voeren en dat die advocaat tijdens het
      proces zijn verdediging heeft gevoerd; of

      c. de verdachte nadat de beslissing aan hem was betekend en hij uitdrukkelijk was geïnformeerd over zijn recht op
      een verzetprocedure of een procedure in hoger beroep, waarbij hij het recht heeft aanwezig te zijn en tijdens welke
      de zaak opnieuw ten gronde wordt behandeld en nieuw bewijsmateriaal wordt toegelaten, die kan leiden tot herziening
      van de oorspronkelijke beslissing uitdrukkelijk te kennen heeft gegeven dat hij de beslissing niet betwist of niet
      binnen de voorgeschreven termijn verzet of hoger beroep heeft aangetekend; of

      d. de beslissing niet in persoon aan de verdachte is betekend, maar:

      1°. hem na zijn overlevering onverwijld in persoon zal worden betekend en hij uitdrukkelijk zal worden geïnformeerd
      over zijn recht op een verzetprocedure of een procedure in hoger beroep, waarbij hij het recht heeft aanwezig te
      zijn, waarop de zaak opnieuw ten gronde wordt behandeld en nieuw bewijsmateriaal wordt toegelaten, die kan leiden
      tot herziening van de oorspronkelijke beslissing en

      2°. hij wordt geïnformeerd over de termijn waarbinnen hij verzet of hoger beroep dient aan te tekenen, als vermeld
      in het desbetreffende Europees aanhoudingsbevel.

      2 Aan een verklaring als bedoeld in onderdeel d van het eerste lid, is iedere persoon of instantie die in Nederland
      is belast met een publieke taak, gebonden.
    url: https://wetten.overheid.nl/BWBR0016664/2025-07-01#Artikel45a
  - number: 45b
    text: |-
      In de gevallen als bedoeld in [artikel 45a, eerste lid, onderdeel d][ref1], verstrekt de uitvaardigende rechter-
      commissaris op verzoek van de persoon tegen wie het Europees aanhoudingsbevel is uitgevaardigd en die nog niet
      officieel van de tegen hem ingestelde strafprocedure in kennis is gesteld, onverwijld en door tussenkomst van
      de uitvoerende justitiële autoriteit, een afschrift van het vonnis, dat ten grondslag ligt aan het Europees
      aanhoudingsbevel. [Artikel 408, tweede lid, van het Wetboek van Strafvordering][ref2] is in dit geval niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel45a
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel408
    url: https://wetten.overheid.nl/BWBR0016664/2025-07-01#Artikel45b
    references:
      - id: ref1
        bwb_id: BWBR0016664
        artikel: 45a
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '408'
  - number: '46'
    text: |-
      1 De uitvaardigende rechter-commissaris is bevoegd rechtstreeks contact te onderhouden met de uitvoerende
      justitiële autoriteit.

      2 Indien de autoriteit van een andere staat of van een internationale organisatie bevoegd is tot opheffing van
      een voorrecht of van een immuniteit van strafvervolging of van de tenuitvoerlegging van straffen die de opgeëiste
      persoon geniet, verzoekt de uitvaardigende rechter-commissaris hierom.

      3 Een signalering als bedoeld in [artikel 4, eerste en tweede lid][ref1], draagt de uitvaardigende rechter-
      commissaris, zo veel mogelijk door tussenkomst van de officier van justitie op aan een of meerdere landelijke
      eenheden van de politie, onder overlegging van een gewaarmerkt afschrift van het door hem afgegeven Europees
      aanhoudingsbevel.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel4
    url: https://wetten.overheid.nl/BWBR0016664/2025-07-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0016664
        artikel: '4'
        hoofdstuk: I
        afdeling: '2'
  - number: '47'
    text: |-
      De uitvaardigende rechter-commissaris is met het oog op de behandeling en uitvoering van het door hem afgegeven
      Europees aanhoudingsbevel bevoegd de uitvoerende justitiële autoriteit op verzoek of eigener beweging aanvullende
      informatie te verstrekken en, in voorkomend geval, schriftelijk de voorwaarden overeen te komen in het geval de
      opgeëiste persoon voorlopig ter beschikking wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0016664/2025-07-01#Artikel47
  - number: '48'
    text: |-
      De voorwaarden die door de buitenlandse uitvoerende justitiële autoriteit in overeenstemming met het op 13 juni
      2002 door de Raad vastgestelde kaderbesluit betreffende het Europees aanhoudingsbevel en de procedures van
      overlevering tussen de lidstaten van de Europese Unie (PbEG L 190) worden gesteld bij de overlevering van de
      opgeëiste persoon aan Nederland, zijn verbindend voor iedere persoon of instantie die in Nederland is belast met
      een publieke taak.
    url: https://wetten.overheid.nl/BWBR0016664/2025-07-01#Artikel48
  - number: 48a
    text: |-
      Na ontvangst van een kennisgeving van de uitvoerende justitiële autoriteit dat de opgeëiste persoon heeft verzocht
      om aanwijzing van een in Nederland ingeschreven advocaat met het oog op het, door het verstrekken van informatie
      en advies, verlenen van bijstand aan zijn raadsman in de uitvoerende lidstaat ten behoeve van de procedure voor
      overlevering in die lidstaat, verstrekt de uitvaardigende rechter-commissaris, al dan niet door tussenkomst van die
      autoriteit, de daarvoor benodigde gegevens aan de opgeëiste persoon. Deze verstrekking vindt onverwijld plaats; de
      termijnen voor behandeling van het Europees aanhoudingsbevel gelden onverkort.
    url: https://wetten.overheid.nl/BWBR0016664/2025-07-01#Artikel48a
  - number: '49'
    text: |-
      1 Voorwerpen, aangetroffen in het bezit van de opgeëiste persoon, kunnen op verzoek van de uitvaardigende
      justitiële autoriteit in beslag worden genomen. De inbeslagneming kan door elke officier of hulpofficier van
      justitie worden gelast.

      2 Indien de inbeslagneming niet in het arrondissement Amsterdam heeft plaatsgevonden, wordt de officier van
      justitie bij het arrondissementsparket Amsterdam daarvan in kennis gesteld en worden voorwerpen bij de overdracht
      van de opgeëiste persoon of, indien dat onmogelijk is, zo spoedig mogelijk daarna aan hem overgedragen.

      3 Bij de in [artikel 23, tweede lid][ref1], bedoelde vordering legt de officier van justitie een lijst van de in
      beslag genomen voorwerpen aan de rechtbank over.

      4 In geval van overlevering overeenkomstig [§ E van afdeling 2 van hoofdstuk II][ref2], legt de officier van
      justitie tijdig voorafgaand aan de beslissing van de rechtbank, genoemd in [artikel 50, derde lid][ref3], in
      samenhang met [artikel 40, eerste lid][ref4], een lijst van de in beslag genomen voorwerpen aan de rechtbank over.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0016664#HoofdstukII
      [ref3]: https://wetten.overheid.nl/BWBR0016664#Artikel50
      [ref4]: https://wetten.overheid.nl/BWBR0016664#Artikel40
    url: https://wetten.overheid.nl/BWBR0016664/2025-07-01#Artikel49
    references:
