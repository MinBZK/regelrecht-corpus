  - number: '69'
    text: |-
      De bepalingen van deze wet zijn niet van toepassing op:

      a. overlevering van gedeserteerde schepelingen aan autoriteiten van de staat waartoe zij behoren;

      b. overlevering van leden van een vreemde krijgsmacht en van personen die met hen zijn gelijkgesteld, aan de
      bevoegde militaire autoriteiten, voor zover die overlevering geschiedt krachtens een overeenkomst met een of meer
      staten waarmee Nederland bondgenootschappelijke betrekkingen onderhoudt.
    url: https://wetten.overheid.nl/BWBR0016664/2025-07-01#Artikel69
  - number: '70'
    text: |-
      De officier van justitie draagt zorg voor een halfjaarlijkse rapportage aan Onze Minister over:

      a. het aantal Europese aanhoudingsbevelen dat is ontvangen en in behandeling is genomen;

      b. het aantal malen dat de verkorte procedure is toegepast;

      c. het aantal malen dat verhoor door de rechtbank heeft plaatsgevonden;

      d. het aantal malen dat de rechtbank de overlevering heeft toegestaan en geweigerd;

      e. de gemiddelde duur van de procedures, bedoeld onder b en c.
    url: https://wetten.overheid.nl/BWBR0016664/2025-07-01#Artikel70
  - number: '73'
    text: |-
      Onze Minister zendt binnen drie jaren na inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de
      toepassing van deze wet op de overlevering door Nederland, in het bijzonder over de effecten van de behandeling van
      overleveringsverzoeken in één instantie.
    url: https://wetten.overheid.nl/BWBR0016664/2025-07-01#Artikel73
  - number: '74'
    text: |-
      1 Deze wet treedt in de relatie met de lidstaten van de Europese Unie in de plaats van de [Uitleveringswet][ref1],
      met uitzondering van de [artikelen 50a][ref2] en [51 van die wet][ref3], en van de in de relatie tussen Nederland
      en de lidstaten van de Europese Unie geldende verdragen inzake de uitlevering, te weten:

      a. het op 13 december 1957 te Parijs tot stand gekomen Europees Verdrag betreffende uitlevering (Trb. 1965, 9), het
      op 15 oktober 1975 te Straatsburg tot stand gekomen Aanvullend Protocol bij dit Verdrag (Trb. 1979, 119), het op
      17 maart 1978 te Straatsburg tot stand gekomen Tweede Aanvullend Protocol bij dit Verdrag (Trb. 1979, 120) en, voor
      zover het op uitlevering betrekking heeft, het op 27 januari 1977 te Straatsburg tot stand gekomen Europees Verdrag
      tot bestrijding van terrorisme (Trb. 1985, 66);

      b. de op 30 augustus 1979 te Wittem tot stand gekomen Overeenkomst tussen het koninkrijk der Nederlanden en de
      Bondsrepubliek Duitsland betreffende de aanvulling en het vergemakkelijken van de toepassing van het Europees
      Verdrag betreffende de uitlevering van 13 december 1957 (Trb. 1979, nr. 142);

      c. afdeling I en voor zover van toepassing afdeling III van het op 27 juni 1962 te Brussel tot stand gekomen
      Verdrag aangaande de uitlevering en de rechtshulp in strafzaken tussen het Koninkrijk België, het Groothertogdom
      Luxemburg en het Koninkrijk der Nederlanden, zoals gewijzigd bij het op 11 mei 1974 te Brussel tot stand gekomen
      protocol (Trb. 1962, 97, en 1974, 11);

      d. hoofdstuk III, afdeling 4, van de Uitvoeringsovereenkomst van Schengen;

      e. de Overeenkomst tussen de lidstaten van de Europese Gemeenschappen betreffende de vereenvoudiging en de
      modernisering van de wijze van toezending van uitleveringsverzoeken van 26 mei 1989 (Trb. 1990, 97);

      f. de op 10 maart 1995 te Brussel tot stand gekomen Overeenkomst opgesteld op grond van artikel K.3 van het Verdrag
      betreffende de Europese Unie aangaande de verkorte procedure tot uitlevering tussen de Lid-Staten van de Europese
      Unie (Trb. 1995, 10);

      g. de op 27 september 1996 te Dublin tot stand gekomen Overeenkomst opgesteld op grond van artikel K.3 van het
      Verdrag betreffende de Europese Unie betreffende uitlevering tussen de lidstaten van de Europese Unie (Trb. 1996,
      304).

      2 Het eerste lid blijft buiten toepassing in relatie tot een andere lidstaat van de Europese Unie voorzover en
      voorzolang die lidstaat niet de maatregelen heeft getroffen die noodzakelijk zijn om aan het op 13 juni 2003 te
      Brussel totstandgekomen kaderbesluit van de Raad betreffende het Europees aanhoudingsbevel en de procedures van
      overlevering tussen de lidstaten van de Europese Unie (PbEG L 190) te voldoen.

      3 Voor zover de Raad van de Europese Unie een besluit neemt dat afwijkt van het eerste of tweede lid, kan daaraan
      bij algemene maatregel van bestuur uitvoering worden gegeven.

      4 De [Uitleveringswet][ref4] blijft van toepassing op de behandeling van een verzoek tot uitlevering en op de in
      verband daarmede te nemen beslissingen, in gevallen waarin de stukken betreffende dat verzoek vóór het tijdstip van
      het in werking treden van deze wet zijn ontvangen door Onze Minister.

      5 Een opgeëiste persoon die op het tijdstip van het in werking treden van deze wet is gedetineerd ingevolge
      een bevel gegeven krachtens [artikel 14][ref5], [13a][ref6] of [15 van de Uitleveringswet][ref7], wordt, zo
      het Europees aanhoudingsbevel nog niet is ontvangen, beschouwd en behandeld als een persoon die krachtens
      [artikel 16][ref8], [17][ref9] of [18][ref10] van deze wet in bewaring wordt gehouden of in verzekering is gesteld.


