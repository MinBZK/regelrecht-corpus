  - number: 1a
    text: |-
      In afwijking van de [onderdelen b, i en j van artikel 1][ref1] wordt voor de toepassing van [hoofdstuk II][ref2]
      van deze wet ten behoeve van de uitoefening van de taken van het Europees Openbaar Ministerie als bedoeld in
      artikel 4 van de Verordening EOM, gelezen voor:

        - *Europees aanhoudingsbevel:* de schriftelijk vastgelegde beslissing op grond van artikel 33, tweede lid, van de
      Verordening EOM strekkende tot de aanhouding en de overlevering van een persoon door de justitiële autoriteit van
      een andere lidstaat;
        - *uitvaardigende justitiële autoriteit:* de justitiële autoriteit van een lidstaat van de Europese Unie, krachtens
      het nationale recht bevoegd tot het afgeven van een Europees aanhoudingsbevel of de gedelegeerd Europese aanklager
      bedoeld in artikel 13 van de Verordening EOM;
        - *uitvaardigende lidstaat:* de lidstaat van de Europese Unie waar de uitvaardigende justitiële autoriteit of de
      gedelegeerd Europese aanklager bedoeld in artikel 13 van de Verordening EOM werkzaam is.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0016664#HoofdstukII
