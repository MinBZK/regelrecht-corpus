  - number: '35'
    text: |-
      1 Zo spoedig mogelijk na de uitspraak waarbij de overlevering geheel of gedeeltelijk is toegestaan, maar niet later
      dan tien dagen na de datum van deze uitspraak, wordt de opgeëiste persoon feitelijk overgeleverd. De officier van
      justitie bepaalt, na overleg met de uitvaardigende justitiële autoriteit, de tijd en plaats.

      2 De rechtbank kan op vordering van de officier van justitie de in het eerste lid gestelde termijn telkens met ten
      hoogste dertig dagen verlengen, indien dit noodzakelijk is doordat als gevolg van omstandigheden buiten de macht
      van enige lidstaat de feitelijke overlevering niet binnen die termijn kan plaatsvinden. De officier van justitie
      dient de vordering in, nadat deze met de uitvaardigende justitiële autoriteit een nieuwe datum is overeengekomen
      die valt binnen de te verlengen termijn. De feitelijke overlevering vindt in dat geval uiterlijk tien dagen na de
      vastgestelde datum plaats.

      3 De rechtbank kan, ambtshalve, op vordering van de officier van justitie of op verzoek van de opgeëiste persoon
      of diens raadsman, de in het eerste lid bedoelde termijn tijdelijk opschorten, indien door ernstige humanitaire
      redenen de feitelijke overlevering bij wijze van uitzondering niet binnen die termijn kan plaatsvinden. Van
      ernstige humanitaire redenen is in ieder geval sprake indien er gegronde redenen bestaan om aan te nemen dat
      de feitelijke overlevering het leven of de gezondheid van de opgeëiste persoon in gevaar zou brengen. Indien
      de rechtbank beslist dat de in het eerste lid gestelde termijn tijdelijk wordt opgeschort, stelt de officier
      van justitie de uitvaardigende justitiële autoriteit daarvan onverwijld in kennis. Zodra deze redenen naar het
      oordeel van de officier van justitie of van de opgeëiste persoon niet langer bestaan, vordert de officier van
      justitie dat de rechtbank die termijn met maximaal dertig dagen verlengt, nadat hij de uitvaardigende justitiële
      autoriteit daarvan onverwijld in kennis heeft gesteld en in onderling overleg met die autoriteit een nieuwe datum
      is overeengekomen die valt binnen de te verlengen termijn. De feitelijke overlevering vindt in dat geval uiterlijk
      tien dagen na de vastgestelde datum plaats.

      4 De vrijheidsbeneming van de opgeëiste persoon wordt beëindigd na het verstrijken van de in het eerste tot en
      met derde lid genoemde termijnen. De invrijheidstelling gebeurt niet dan nadat de rechtbank op vordering van de
      officier van justitie één of meer van de volgende vrijheidsbeperkende voorwaarden heeft kunnen stellen, indien dit
      noodzakelijk is ter voorkoming van vlucht:

      a. een verplichting op bepaalde tijdstippen of gedurende een bepaalde periode op een bepaalde locatie aanwezig
      te zijn;

      b. een verplichting zich op bepaalde tijdstippen te melden bij een bepaalde instantie;

      c. een beperking van het recht om Nederland te verlaten;

      d. andere vrijheidsbeperkende voorwaarden die strekken ter voorkoming van vlucht.

      5 De rechtbank stelt de opgeëiste persoon in de gelegenheid te worden gehoord over de vrijheidsbeperkende
      voorwaarden. Aan deze voorwaarden kan elektronisch toezicht worden verbonden.

      6 De officier van justitie stelt de uitvaardigende justitiële autoriteit onverwijld in kennis van een
      invrijheidstelling als bedoeld in het vierde lid en van daarbij gestelde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0016664/2025-07-01#Artikel35
  - number: '36'
    text: |-
      1 De beslissing omtrent de tijd en de plaats van de feitelijke overlevering kan door de rechtbank, op vordering
      van de officier van justitie of op verzoek van de opgeëiste persoon of diens raadsman worden aangehouden, indien
      en zolang tegen de opgeëiste persoon een strafrechtelijke vervolging in Nederland gaande is, of een door een
      Nederlandse rechter tegen hem gewezen strafvonnis nog geheel of ten dele voor tenuitvoerlegging vatbaar is.

      2 In gevallen als voorzien in het eerste lid kan de rechtbank, na advies van het openbaar ministerie, bepalen
      dat en onder welke voorwaarden de opgeëiste persoon ten behoeve van diens vervolging of de tenuitvoerlegging
      van een hem bij onherroepelijk vonnis opgelegde vrijheidsstraf reeds aanstonds voorlopig ter beschikking van de
      uitvaardigende justitiële autoriteit kan worden gesteld.

      3 Tot de door de rechtbank te stellen voorwaarden behoort in geval van:

      a. een lopende strafvervolging als bedoeld in het eerste lid in elk geval dat het recht op aanwezigheid van de
      opgeëiste persoon bij de voortzetting van de strafvervolging in Nederland zal worden gerespecteerd en dat hij de
      hem in Nederland opgelegde straf in Nederland zal ondergaan.

      b. een door een Nederlandse rechter tegen de opgeëiste persoon gewezen strafvonnis als bedoeld in het eerste lid in
      elk geval de garantie dat de opgeëiste persoon na de berechting terugkomt naar Nederland voor de tenuitvoerlegging
      van het resterende deel van de hem in Nederland opgelegde straf.

      4 In geval van toepassing van het tweede lid bericht de officier van justitie dat de opgeëiste persoon voorlopig
      ter beschikking zal worden gesteld van de uitvaardigende justitiële autoriteit, met wie hij ook de daaraan
      verbonden voorwaarden schriftelijk overeenkomt.

      5 Ondergaat de opgeëiste persoon, te wiens aanzien het vierde lid wordt toegepast, een vrijheidsstraf, dan komt
      de tijd gedurende welke hij in het buitenland ter beschikking van de uitvaardigende justitiële autoriteit is, in
      mindering op zijn straftijd.

      6 Is de opgeëiste persoon, te wiens aanzien het derde lid is toegepast, op het moment dat hij naar Nederland wordt
      teruggebracht met het oog op zijn aanwezigheid bij de behandeling van zijn strafzaak, in de uitvaardigende lidstaat
      veroordeeld tot een onvoorwaardelijke vrijheidsstraf dan kan hij gedurende zijn verblijf hier te lande op bevel
      van de officier van justitie in verzekering worden gesteld. De [artikelen 61][ref1] en [64, eerste lid][ref2], zijn
      voor zover nodig van overeenkomstige toepassing.

      7 De inverzekeringstelling kan worden opgeheven zodra de officier van justitie bericht ontvangt dat de gronden voor
      de detentie in het buitenland niet langer bestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0016664#Artikel64
    url: https://wetten.overheid.nl/BWBR0016664/2025-07-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0016664
        artikel: '61'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0016664
        artikel: '64'
        hoofdstuk: V
  - number: '37'
    text: |-
      1 Indien zulks voor de toepassing van [artikel 35, eerste lid][ref1], tenzij de vrijheidsbeneming op grond van
      artikel 35, vierde lid, is beëindigd, of van [artikel 36, tweede lid][ref2], noodzakelijk is, wordt de opgeëiste
      persoon op bevel van de officier van justitie aangehouden voor ten hoogste drie dagen. Indien de feitelijke
      overlevering niet binnen de termijn van drie dagen heeft kunnen plaatsvinden, kan het bevel tot aanhouding door de
      officier van justitie eenmaal voor ten hoogste drie dagen worden verlengd.

      2 Na verlenging van de in het eerste lid bedoelde termijn door de officier van justitie, kan deze uitsluitend op
      vordering van de officier van justitie door de rechtbank voor ten hoogste tien dagen worden verlengd.

      3 Een verlenging als bedoeld in het tweede lid kan alleen geschieden wanneer de feitelijke overlevering door
      omstandigheden buiten de macht van enige lidstaat of door ernstige humanitaire redenen niet binnen de termijn van
      zes dagen, ingevolge het eerste lid, heeft kunnen plaatshebben.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0016664#Artikel36
    url: https://wetten.overheid.nl/BWBR0016664/2025-07-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0016664
