  - number: '32'
    text: |-
      De officier van justitie brengt de uitspraak van de rechtbank onverwijld ter kennis van de uitvaardigende
      justitiële autoriteit. Indien de overlevering is toegestaan, vermeldt hij hetzij de termijn waarbinnen de
      overlevering dient plaats te vinden, hetzij het bestaan van een concurrerend uitleveringsverzoek of een
      overleveringsverzoek van het Internationaal Strafhof of een ander internationaal tribunaal.
    url: https://wetten.overheid.nl/BWBR0016664/2025-07-01#Artikel32
  - number: '33'
    text: |-
      Een krachtens [artikel 27][ref1] bevolen vrijheidsbeneming wordt – behoudens de mogelijkheid van verdere
      vrijheidsbeneming uit anderen hoofde – beëindigd zodra:

      a. zulks door de rechtbank of door de officier van justitie, ambtshalve of op verzoek van de opgeëiste persoon of
      diens raadsman, wordt gelast;

      b. zij sedert de dag van de uitspraak tien dagen heeft geduurd, tenzij de rechtbank, op vordering van de officier
      van justitie, de vrijheidsbeneming inmiddels heeft verlengd overeenkomstig [artikel 34][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0016664#Artikel34
    url: https://wetten.overheid.nl/BWBR0016664/2025-07-01#Artikel33
