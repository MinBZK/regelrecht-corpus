  - number: '21'
    text: |-
      1 De opgeëiste persoon wordt op basis van een Europees aanhoudingsbevel dat voldoet aan de vereisten omschreven in
      [artikel 2][ref1] zonder verdere formaliteiten aangehouden. [Artikel 17, derde lid][ref2], is van overeenkomstige
      toepassing.

      2 Het eerste lid blijft buiten toepassing zolang de opgeëiste persoon in Nederland een voorrecht of immuniteit
      geniet van strafvervolging of van de tenuitvoerlegging van straffen. De uitvaardigende justitiële autoriteit wordt
      over het bestaan en de aard van het voorrecht of de immuniteit onverwijld in kennis gesteld, met het verzoek om
      bericht zodra het voorrecht of de immuniteit is opgeheven.

      3 Indien de opgeëiste persoon reeds overeenkomstig [artikel 17][ref3] voorlopig werd aangehouden, zet de
      rechtbank, op vordering van de officier van justitie, de voorlopige aanhouding om in een aanhouding als bedoeld
      in het eerste lid, te rekenen vanaf de dag dat het aanhoudingsbevel door de officier van justitie overeenkomstig
      [artikel 20, tweede lid][ref4], in behandeling is genomen. De opgeëiste persoon kan over die omzetting worden
      gehoord en wordt in ieder geval ervan in kennis gesteld dat de aanhouding voortduurt tot het tijdstip waarop de
      rechtbank over zijn gevangenhouding beslist.

      4 De opgeëiste persoon die overeenkomstig het eerste lid werd aangehouden, wordt binnen vierentwintig uren na zijn
      aanhouding geleid voor de officier van justitie, of bij diens afwezigheid, voor de hulpofficier van justitie in het
      arrondissement waar hij werd aangehouden.

      5 Na de opgeëiste persoon te hebben gehoord, kan de officier van justitie of hulpofficier van justitie, bedoeld in
      het vierde lid, bevelen dat deze persoon gedurende drie dagen, te rekenen vanaf het tijdstip van de aanhouding, in
      verzekering gesteld zal blijven. Bij zijn verhoor kan de opgeëiste persoon zich door zijn raadsman doen bijstaan.

      6 Indien de opgeëiste persoon buiten het arrondissement Amsterdam is aangehouden en in verzekering is gesteld,
      wordt hij binnen de termijn van inverzekeringstelling overgedragen aan de officier van justitie bij het
      arrondissementsparket Amsterdam.

      7 Het zesde lid kan buiten toepassing blijven indien de opgeëiste persoon op grond van
      [artikel 39, tweede lid][ref5], tegenover de rechtbank in het rechtsgebied waar hij is aangehouden heeft
      verklaard, in te stemmen met zijn onmiddellijke overlevering, de rechtbank heeft beslist dat de opgeëiste persoon
      ter beschikking zal worden gesteld van de uitvaardigende justitiële autoriteit en de feitelijke overlevering binnen
      de termijn van de inverzekeringstelling kan plaatsvinden.

      8 Na de opgeëiste persoon te hebben gehoord, kan de rechtbank, op vordering van de officier van justitie bij het
      arrondissementsparket Amsterdam bevelen dat deze in verzekering gesteld zal blijven tot het tijdstip waarop de
      rechtbank over zijn gevangenhouding beslist. Bij zijn verhoor kan de opgeëiste persoon zich door zijn raadsman
      doen bijstaan.

      9 Het bevel tot inverzekeringstelling of de omgezette aanhouding, bedoeld in het derde lid, kan te allen tijde
      zowel door de rechtbank als door de officier van justitie bij het arrondissementsparket Amsterdam, ambtshalve of op
      verzoek van de opgeëiste persoon of diens raadsman, worden opgeheven.

      10 Indien de opgeëiste persoon minderjarig is en de identiteit en verblijfplaats van de ouders of voogd bekend zijn
      en deze binnen een afzienbare termijn daartoe in de gelegenheid zijn, kan de minderjarige zich tijdens een verhoor
      als bedoeld in het vierde lid laten vergezellen door de ouders, voogd of een vertrouwenspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel2
