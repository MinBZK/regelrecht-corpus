  - number: '18'
    text: |-
      1 De rechter-commissaris kan, op vordering van de officier van justitie bij het arrondissementsparket te Amsterdam,
      de bewaring van de opgeëiste persoon bevelen.

      2 Alvorens een bevel ingevolge het eerste lid te geven, hoort de rechter-commissaris zo mogelijk de opgeëiste
      persoon. Bij zijn verhoor kan de opgeëiste persoon zich door zijn raadsman doen bijstaan.
    url: https://wetten.overheid.nl/BWBR0016664/2025-07-01#Artikel18
  - number: '19'
    text: |-
      Een opgeëiste persoon wiens bewaring overeenkomstig [artikel 18][ref1] is bevolen, wordt – behoudens de
      mogelijkheid van verdere vrijheidsbeneming uit anderen hoofde – in vrijheid gesteld:

      a. zodra zulks door de rechtbank, de rechter-commissaris of de officier van justitie, ambtshalve of op verzoek van
      de opgeëiste persoon of diens raadsman, wordt gelast;

      b. zodra de bewaring twintig dagen heeft geduurd en het Europees aanhoudingsbevel nog niet is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel18
