  - number: 43a
    text: |-
      1 De opgeëiste persoon heeft in de procedure voor overlevering door Nederland het recht zich door een raadsman te
      doen bijstaan. De [artikelen 28][ref1], [28a][ref2], [28c, tweede lid][ref3], [29a, eerste lid][ref4], [37][ref5],
      [38][ref6], [43 tot en met 45][ref7] en [124 van het Wetboek van Strafvordering][ref8] zijn van overeenkomstige
      toepassing.

      2 Indien de opgeëiste persoon krachtens deze wet wordt aangehouden, stelt de hulpofficier van justitie
      het bestuur van de raad voor rechtsbijstand hiervan in kennis, opdat het bestuur een raadsman aanwijst. De
      [artikelen 28b, eerste lid, tweede volzin][ref9], en [39 van het Wetboek van Strafvordering][ref10] zijn van
      overeenkomstige toepassing.

      3 Indien de raadsman niet binnen twee uur na de in het tweede lid bedoelde kennisgeving beschikbaar is, kan de
      officier van justitie of – met toestemming van de officier van justitie – de hulpofficier van justitie, wanneer
      de opgeëiste persoon alsnog afstand doet van zijn recht op rechtsbijstand in verband met het horen, beslissen dat
      wordt begonnen met het horen van de opgeëiste persoon in verband met de beslissing over de inverzekeringstelling,
      bedoeld in de [artikelen 17, vierde lid][ref11], en [21, vijfde lid][ref12].

      4 De opgeëiste persoon voor wie ingevolge het tweede lid een raadsman beschikbaar is, wordt de gelegenheid
      verschaft om voorafgaand aan zijn verhoor in verband met de in het derde lid bedoelde beslissing gedurende ten
      hoogste een half uur met hem een onderhoud te hebben.

      5 Indien een persoon die geen raadsman heeft overeenkomstig deze wet zijn vrijheid wordt benomen – anders dan
      uit kracht van een Europees aanhoudingsbevel of een Nederlands bevel tot aanhouding of voorlopige aanhouding,
      dan wel tot inverzekeringstelling of tot verlenging van de termijn daarvan – wijst het bestuur van de raad voor
      rechtsbijstand, na mededeling van de vrijheidsbeneming door het openbaar ministerie, een raadsman aan.


