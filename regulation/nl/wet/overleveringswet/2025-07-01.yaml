  - number: '28'
    text: |-
      1 Uiterlijk veertien dagen na de sluiting van het onderzoek ter zitting doet de rechtbank uitspraak over de
      overlevering. De uitspraak wordt met redenen omkleed.

      2 Bevindt de rechtbank, hetzij dat het Europees aanhoudingsbevel niet voldoet aan de vereisten van
      [artikel 2][ref1], hetzij dat de overlevering niet kan worden toegestaan, dan weigert zij bij haar uitspraak de
      overlevering.

      3 In andere dan de in het tweede lid voorziene gevallen staat de rechtbank bij haar uitspraak overlevering toe,
      tenzij zij van oordeel is dat met toepassing van [artikel 11, eerste lid][ref2], geen gevolg dient te worden
      gegeven aan het Europees aanhoudingsbevel. In dat geval verklaart de rechtbank de officier van justitie niet
      ontvankelijk in zijn vordering als bedoeld in [artikel 23, tweede lid][ref3], van de Overleveringswet, waarmee de
      overleveringsprocedure wordt beëindigd.

      4 Indien uitvaardigende justitiële autoriteiten van twee of meer lidstaten de overlevering van dezelfde persoon
      hebben gevraagd, beslist de rechtbank aan welk van de Europese aanhoudingsbevelen – voor zover de overlevering op
      basis daarvan kan worden toegestaan – voorrang dient te worden gegeven.

      5 In een uitspraak als bedoeld in dit artikel worden de toepasselijke wetsbepalingen, alsmede – in voorkomend
      geval – het feit of de feiten waarvoor de overlevering wordt toegestaan en de letterlijke tekst van de door
      de uitvaardigende justitiële autoriteit afgegeven garanties, bedoeld in [artikel 6, eerste lid][ref4], en in
      [artikel 12][ref5] vermeld.


