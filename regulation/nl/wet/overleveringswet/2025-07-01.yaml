        artikel: 66a
  - number: '64'
    text: |-
      1 In gevallen waarin krachtens deze wet een beslissing omtrent de vrijheidsbeneming kan of moet worden genomen,
      kan worden bevolen dat die vrijheidsbeneming voorwaardelijk wordt opgeschort of geschorst tot het moment van
      de uitspraak van de rechtbank waarbij de overlevering wordt toegestaan. De te stellen voorwaarden mogen alleen
      strekken ter voorkoming van vlucht.

      2 Op bevelen krachtens het eerste lid gegeven door de rechtbank, dan wel door de rechter-
      commissaris, zijn de [artikelen 80, met uitzondering van het tweede lid][ref1], en
      [81 tot en met 88 van het Wetboek van Strafvordering][ref2] van overeenkomstige toepassing.

      3 De officier van justitie stelt de uitvaardigende justitiële autoriteit onverwijld in kennis van een bevel van de
      rechtbank, respectievelijk, de rechter-commissaris als bedoeld in het eerste lid, en van de daaraan ten grondslag
      liggende redenen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel80
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel81
    url: https://wetten.overheid.nl/BWBR0016664/2025-07-01#Artikel64
    references:
