  - number: '2'
    text: |-
      1 Een Europees aanhoudingsbevel kan slechts worden afgegeven wegens feiten die door de wet van de uitvaardigende
      lidstaat strafbaar zijn gesteld en waarop een vrijheidsstraf met een maximum van ten minste twaalf maanden is
      gesteld of indien een straf of maatregel is opgelegd, wanneer deze een duur heeft van ten minste vier maanden.

      2 Een Europees aanhoudingsbevel wordt volgens het in [bijlage 2][ref1] bij deze wet opgenomen model opgemaakt en
      dient in elk geval de volgende gegevens te bevatten:

      a. de identiteit en de nationaliteit van de gezochte persoon;

      b. de naam, het adres, het telefoon- en het faxnummer en het elektronische postadres van de uitvaardigende
      justitiële autoriteit;

      c. de vermelding dat een voor tenuitvoerlegging vatbaar vonnis, een aanhoudingsbevel of een andere voor
      tenuitvoerlegging vatbare gelijkwaardige rechterlijke beslissing bestaat;

      d. de aard en de wettelijke kwalificatie van het strafbare feit, in het bijzonder rekening houdend met
      [artikel 7, eerste lid, onderdeel a, onder 1°][ref2];

      e. een beschrijving van de omstandigheden waaronder het strafbare feit is gepleegd, met vermelding van onder meer
      het tijdstip, de plaats en de mate van betrokkenheid van de gezochte persoon bij het strafbare feit;

      f. de opgelegde straf of maatregel, indien een onherroepelijk vonnis bestaat, of de in de uitvaardigende lidstaat
      voor het betrokken feit geldende strafbedreiging;

      g. indien mogelijk, andere gevolgen van het strafbaar feit.

      3 De uitvaardigende justitiële autoriteit van de lidstaat van nationaliteit van een burger van de Unie die gebruik
      heeft gemaakt van het recht op vrij verkeer als bedoeld in artikel 21 van het Verdrag betreffende de werking van
      de Europese Unie en in een andere lidstaat is aangehouden met het oog op uitlevering ter fine van strafvervolging
      aan een derde staat, kan na daarover te zijn geïnformeerd, ter voorkoming van een inbreuk op de artikelen 18 en 21
      van dat Verdrag en met in achtneming van het eerste en tweede lid, een Europees aanhoudingsbevel uitvaardigen voor
      dezelfde feiten als die welke aan het uitleveringsverzoek ten grondslag liggen en voor zover zij naar nationaal
      recht bevoegd is rechtsmacht uit te oefenen ter zake van die feiten.

      4 Het Europees aanhoudingsbevel dient te zijn vertaald in de officiële taal of in een van de officiële talen van de
      uitvoerende lidstaat, dan wel in de taal die deze lidstaat in een bij het secretariaat-generaal van de Raad van de
      Europese Unie neergelegde verklaring heeft aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0016664
      [ref2]: https://wetten.overheid.nl/BWBR0016664#Artikel7
