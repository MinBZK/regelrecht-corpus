  - number: '59'
    text: |-
      Krachtens deze wet gegeven bevelen tot inverzekeringstelling of bewaring, dan wel tot verlenging van een termijn
      van vrijheidsbeneming, worden gedagtekend en ondertekend. De grond voor uitvaardiging wordt in het bevel vermeld.
      Aan degene op wie het bevel betrekking heeft, wordt onverwijld een afschrift daarvan uitgereikt.
    url: https://wetten.overheid.nl/BWBR0016664/2025-07-01#Artikel59
  - number: '60'
    text: |-
      1 De bevelen tot vrijheidsbeneming, gegeven krachtens deze wet, zijn dadelijk uitvoerbaar.

      2 Bevoegd tot het ten uitvoer leggen van Europese aanhoudingsbevelen, Nederlandse bevelen tot aanhouding,
      voorlopige aanhouding of gevangenneming zijn de in [artikel 141 van het Wetboek van Strafvordering][ref1] bedoelde
      ambtenaren.

      3 Op de tenuitvoerlegging van een Europees aanhoudingsbevel, de in het eerste lid bedoelde bevelen tot
      vrijheidsbeneming en de last daartoe zijn de [artikelen 6:1:6][ref2], [6:1:7][ref3], [6:1:9][ref4], [6:1:15][ref5]
      en [6:2:1 van het Wetboek van Strafvordering][ref6] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel616
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel617
