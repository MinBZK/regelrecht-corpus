  - number: '50'
    text: |-
      1 De rechtbank beslist bij haar uitspraak over de overlevering tevens over de afgifte dan wel de teruggave van de
      in beslag genomen voorwerpen en vermeldt dit in haar uitspraak. Afgifte van die voorwerpen aan de uitvaardigende
      justitiële autoriteit kan alleen worden bevolen in het geval van inwilliging van het verzoek tot overlevering.

      2 Met het oog op de mogelijke rechten van derden kan de rechtbank ten aanzien van bepaalde voorwerpen beslissen,
      dat afgifte slechts mag geschieden onder het beding, dat die voorwerpen onmiddellijk zullen worden teruggezonden
      nadat daarvan het voor de strafvordering nodige gebruik zal zijn gemaakt.

      3 In geval van overlevering overeenkomstig [§ E van afdeling 2 van hoofdstuk II][ref1], beslist de rechtbank bij
      haar beslissing, bedoeld in [artikel 40, eerste lid][ref2], over de afgifte dan wel de teruggave van de in beslag
      genomen voorwerpen. De rechtbank houdt daarbij, overeenkomstig het tweede lid, rekening met de mogelijke rechten
      van derden.

      4 Voorwerpen ten aanzien waarvan de rechtbank de overdracht heeft toegestaan, worden ook overgedragen indien de
      opgeëiste persoon wegens overlijden of ontsnapping niet feitelijk kan worden overgeleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0016664#Artikel40
    url: https://wetten.overheid.nl/BWBR0016664/2025-07-01#Artikel50
