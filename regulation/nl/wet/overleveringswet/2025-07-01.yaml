  - number: '10'
    text: |-
      Overlevering wordt niet toegestaan indien de opgeëiste persoon ten tijde van het begaan van het strafbare feit de
      leeftijd van twaalf jaren nog niet heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0016664/2025-07-01#Artikel10
  - number: '11'
    text: |-
      1 Aan een Europees aanhoudingsbevel wordt geen gevolg gegeven in gevallen, waarin naar het oordeel van de rechtbank
      zwaarwegende en op feiten berustende gronden bestaan dat de opgeëiste persoon na overlevering een reëel gevaar
      loopt dat zijn door het Handvest van de grondrechten van de Europese Unie gewaarborgde grondrechten zullen worden
      geschonden.

      2 Indien er een mogelijkheid bestaat dat bij wijziging van de omstandigheden het reële gevaar van de in het eerste
      lid bedoelde schending alsnog kan worden uitgesloten, dient de rechtbank de beslissing over de overlevering aan
      te houden.

      3 De uitvaardigende autoriteit wordt onder opgave van redenen van die aanhouding in kennis gesteld en de rechtbank
      gaat gedurende de aanhouding na of er wijziging in de omstandigheden optreedt.

      4 Indien na toepassing van het derde lid niet binnen een redelijke termijn het reële gevaar van de in
      het eerste lid bedoelde schending kan worden uitgesloten, doet de rechtbank uitspraak als bedoeld in
      [artikel 28, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel28
