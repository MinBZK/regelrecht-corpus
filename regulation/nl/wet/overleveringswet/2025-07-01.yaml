preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat de implementatie van het kaderbesluit van de Raad van de Europese Unie
    betreffende het Europees aanhoudingsbevel en de procedures van overlevering tussen de lidstaten van de Europese
    Unie van 13 juni 2002 (2002/584/JBZ), gepubliceerd in het Publicatieblad van de Europese Gemeenschappen L 190 van
    18 juli 2002, noodzaakt tot het stellen van nieuwe regels voor de overlevering van personen tussen lidstaten van de
    Europese Unie en daarmee verbandhoudende andere vormen van rechtshulp;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0016664/2025-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet wordt verstaan onder:

      a. overlevering: de terbeschikkingstelling van een persoon door de justitiële autoriteiten van de ene lidstaat
      aan de justitiële autoriteiten van een andere lidstaat van de Europese Unie ten behoeve van hetzij een in die
      andere lidstaat tegen hem gericht strafrechtelijk onderzoek, hetzij de tenuitvoerlegging van een hem opgelegde
      vrijheidsbenemende straf of maatregel;

      b. Europees aanhoudingsbevel: de schriftelijk vastgelegde beslissing van een justitiële autoriteit van een lidstaat
      van de Europese Unie strekkende tot de aanhouding en de overlevering van een persoon door de justitiële autoriteit
      van een andere lidstaat;

      c. vrijheidsstraffen: door de rechter op te leggen straffen met een vrijheidsbenemend karakter alsmede de door deze
      naast of in plaats van een straf op te leggen maatregelen strekkende tot vrijheidsbeneming;

      d. opgeëiste persoon: de persoon op wie een Europees aanhoudingsbevel, een signalering in het Schengen-
      informatiesysteem of via Interpol strekkende tot aanhouding en overlevering betrekking heeft;

      e. officier van justitie: voor zover aldus vermeld, elke officier van justitie, en overigens de officier van
      justitie bij het arrondissementsparket Amsterdam;

      f. rechter-commissaris: voor zover aldus vermeld, elke rechter-commissaris belast met de behandeling van
      strafzaken, en overigens, de rechter-commissaris belast met de behandeling van strafzaken in de rechtbank
      Amsterdam;

      g. rechtbank: voor zover aldus vermeld, elke rechtbank, en overigens de rechtbank Amsterdam;

      h. Onze Minister: Onze Minister van Justitie;

      i. uitvaardigende justitiële autoriteit: de justitiële autoriteit van een lidstaat van de Europese Unie, krachtens
      het nationale recht bevoegd tot het afgeven van een Europees aanhoudingsbevel;

      j. uitvaardigende lidstaat: de lidstaat van de Europese Unie waar de uitvaardigende justitiële autoriteit werkzaam
      is;

      k. uitvoerende justitiële autoriteit: de justitiële autoriteit van een lidstaat van de Europese Unie, krachtens het
      nationale recht bevoegd tot het nemen van de beslissing tot overlevering op basis van een Europees aanhoudingsbevel
      en voor zover het [artikel 39, tweede lid][ref1], betreft, elke rechtbank;

      l. uitvoerende lidstaat: de lidstaat van de Europese Unie waar de uitvoerende justitiële autoriteit werkzaam is;

      m. Uitvoeringsovereenkomst van Schengen: de Overeenkomst ter uitvoering van het tussen de regeringen van de staten
      van de Benelux Economische Unie, de Bondsrepubliek Duitsland en de Franse Republiek op 14 juni 1985 gesloten
      Akkoord betreffende de geleidelijke afschaffing van de controles aan de gemeenschappelijke grenzen, Schengen,
      19 juni 1990 (Trb. 1985, 101);

      n. EU-rechtshulpovereenkomst 2000: de Overeenkomst, door de Raad vastgesteld overeenkomstig artikel 34 van het
      Verdrag betreffende de Europese Unie, betreffende de wederzijdse rechtshulp in strafzaken tussen de Lid-Staten van
      de Europese Unie, Brussel, 29 mei 2000 (Trb. 2000, 96);

      o. *Verordening EOM:* de Verordening (EU) 2017/1939 van de Raad van 12 oktober 2017 betreffende nauwere
      samenwerking bij de instelling bij de instelling van het Europees Openbaar Ministerie («EOM») (PbEU 2017, L 283).


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel39
