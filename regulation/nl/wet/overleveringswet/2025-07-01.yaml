      1 De uitspraak van de rechtbank is dadelijk uitvoerbaar, tenzij er ten aanzien van de opgeëiste persoon een
      concurrerend uitleveringsverzoek of overleveringsverzoek van het Internationaal Strafhof of van een ander
      internationaal tribunaal is ontvangen, dat in behandeling is genomen.

      2 Tegen de uitspraak van de rechtbank staat geen rechtsmiddel open, anders dan beroep in cassatie in het belang der
