  - number: '31'
    text: |-
      1 De uitspraak van de rechtbank wordt aan de opgeëiste persoon die bij de voorlezing daarvan niet tegenwoordig is
      geweest, betekend. Daarbij wordt hem meegedeeld dat hij tegen de uitspraak geen rechtsmiddel kan instellen.

      2 Indien het Europees aanhoudingsbevel is uitgevaardigd nadat de uitvaardigende justitiële autoriteit
      overeenkomstig [artikel 2, derde lid][ref1], in de gelegenheid is gesteld om een Europees aanhoudingsbevel
      uit te vaardigen voor dezelfde feiten als die welke aan het uitleveringsverzoek ten grondslag
      liggen, wordt door de officier van justitie aan de opgeëiste persoon meegedeeld dat Onze Minister,
      indien het verzoek tot uitlevering ontvankelijk en voor inwilliging vatbaar is, het bepaalde in
      [artikel 35, tweede lid, van de Uitleveringswet][ref2] buiten toepassing zal laten en aan de uitspraak van de
      rechtbank voorrang zal geven.

      3 Indien, buiten de in het tweede lid bedoelde gevallen, ten aanzien van de opgeëiste persoon een
      concurrerend uitleveringsverzoek of overleveringsverzoek van het Internationaal Strafhof of een ander
      internationaal tribunaal in behandeling is genomen, wordt de opgeëiste persoon eveneens meegedeeld
      dat Onze Minister, met inachtneming van [artikel 35 van de Uitleveringswet][ref3] respectievelijk
      [artikel 31 van de Uitvoeringswet Internationaal Strafhof][ref4] of andere toepasselijke wetgeving, zal beslissen
      of aan de uitspraak van de rechtbank gevolg wordt gegeven, dan wel of betrokkene wordt uitgeleverd respectievelijk
      wordt overgeleverd aan het Internationaal Strafhof of aan een ander internationaal tribunaal.

      4 De griffier van de rechtbank zendt uiterlijk drie dagen na de uitspraak het Europees aanhoudingsbevel met de
      daarbij behorende stukken terug aan de officier van justitie.

      5 In de gevallen bedoeld in het tweede en derde lid zendt de griffier van de rechtbank tevens een afschrift van het
      Europees aanhoudingsbevel met de daarbij behorende stukken aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002559#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0002559#Artikel35
      [ref4]: https://wetten.overheid.nl/BWBR0013796#Artikel31
