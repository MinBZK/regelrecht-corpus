  - number: '53'
    text: |-
      1 Aan een verzoek van de uitvaardigende justitiële autoriteit om een opgeëiste persoon die op basis van een
      door hem afgegeven Europees aanhoudingsbevel ten behoeve van een tegen hem gericht strafrechtelijk onderzoek is
      aangehouden voorafgaand aan diens overlevering te horen, geeft de officier van justitie zo veel mogelijk gevolg.

      2 Op het verhoor zijn de [artikelen 5.1.8][ref1] en [5.1.9 van het Wetboek van Strafvordering][ref2] en artikel 4,
      eerste tot en met derde lid, van de EU-rechtshulpovereenkomst 2000 van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel5.1.8
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel5.1.9
    url: https://wetten.overheid.nl/BWBR0016664/2025-07-01#Artikel53
