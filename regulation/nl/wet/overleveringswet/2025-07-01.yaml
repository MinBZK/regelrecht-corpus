  - number: '43'
    text: |-
      1 In geval van toepassing van [artikel 40, eerste lid][ref1], bepaalt de officier van justitie, na overleg met
      de bevoegde buitenlandse autoriteiten, onverwijld de tijd en de plaats waarop de feitelijke overlevering zal
      geschieden.

      2 De officier van justitie kan, zo nodig, met het oog op de feitelijke overlevering krachtens deze paragraaf, de
      aanhouding van de opgeëiste persoon bevelen voor ten hoogste drie dagen. Indien de feitelijke overlevering niet
      binnen de termijn van drie dagen heeft kunnen plaatsvinden, kan het bevel tot aanhouding door de officier van
      justitie eenmaal voor ten hoogste drie dagen worden verlengd. [Artikel 37, tweede en derde lid][ref2], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0016664#Artikel37
