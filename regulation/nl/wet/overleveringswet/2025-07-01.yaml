  - number: '34'
    text: |-
      1 De voortgezette vrijheidsbeneming kan telkens worden verlengd met ten hoogste dertig dagen indien:

      a. ook de uitlevering is gevraagd of de overlevering door het Internationaal Strafhof of een ander internationaal
      tribunaal, en Onze Minister nog niet op die verzoeken heeft beslist;

      b. de overlevering wel is toegestaan, maar de feitelijke overlevering niet binnen de gestelde termijn heeft kunnen
      plaatshebben en voor zover [artikel 35, tweede of derde lid][ref1], of [artikel 36, eerste lid][ref2], daartoe
      noodzaakt.

      2 De opgeëiste persoon wordt in de gelegenheid gesteld op de vordering tot verlenging te worden gehoord.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0016664#Artikel36
