  - number: 6a
    text: |-
      1 Overlevering van een Nederlander ten behoeve van de tenuitvoerlegging van een bij onherroepelijk vonnis aan hem
      opgelegde vrijheidsstraf kan worden geweigerd, indien de rechtbank van oordeel is dat de tenuitvoerlegging van die
      straf kan worden overgenomen. In geval van een weigering van de overlevering, beveelt de rechtbank, gelijktijdig
      met de weigering, de tenuitvoerlegging van de opgelegde vrijheidsstraf.

      2 Bij de beoordeling van een verzoek tot overlevering als bedoeld in het eerste lid beoordeelt de rechtbank:

      a. of er gronden als bedoeld in [artikel 2:13, eerste lid, onderdelen c tot en met i][ref1], en
      __REF001___________________________________________________________________________________________________________
      ____________________ zijn waarop de overname van de tenuitvoerlegging van de vrijheidsstraf geweigerd kan worden;

      b. of de overname van de tenuitvoerlegging van de vrijheidsstraf zal bijdragen aan de maatschappelijke re-
      integratie van de Nederlander;

      c. of de ten uitvoer te leggen vrijheidsstraf is opgelegd voor een feit dat ook naar Nederlands recht strafbaar is,
      en zo ja, welk strafbaar feit dit oplevert;

      d. of het derde of vierde lid aanleiding geeft tot een aanpassing van de opgelegde vrijheidsstraf, en zo ja, welke
      aanpassing.

      3 Indien de opgelegde vrijheidsstraf een langere duur heeft dan het voor het desbetreffende feit naar Nederlands
      recht toepasselijke strafmaximum, wordt de duur van de opgelegde vrijheidsstraf tot dat strafmaximum verlaagd.

      4 Indien de aard van de opgelegde vrijheidsstraf onverenigbaar is met het Nederlands recht, wordt de vrijheidsstraf
      gewijzigd in een straf of maatregel waarin het Nederlands recht voorziet en die zoveel mogelijk overeenstemt met de
      in de uitvaardigende lidstaat opgelegde vrijheidsstraf.

      5 De aanpassing op grond van het derde of vierde lid houdt in geen geval een verzwaring van de opgelegde
      vrijheidsstraf in.

      6 Onze Minister kan de rechtbank of de officier van justitie desgevraagd adviseren over de overname van de straf.

      7 De officier van justitie stelt Onze Minister onverwijld in kennis van het bevel tot tenuitvoerlegging van de
      opgelegde vrijheidsstraf.

      8 Onze Minister draagt er zorg voor dat de opgelegde vrijheidsstraf overeenkomstig de regels van
      het Nederlands recht en met overeenkomstige toepassing van [artikel 2:15, tweede lid][ref3], met
      dien verstande dat onder detentie wordt verstaan vrijheidsbeneming op grond van deze wet en van
      __REF001___________________________________________________________________________________________________________
      _______, met inachtneming van het bevel van de rechtbank als bedoeld in het eerste lid, ten uitvoer wordt gelegd.

      9 Het eerste tot en met het achtste lid is eveneens van toepassing op een vreemdeling die tijdens het verhoor
      door de rechtbank aantoont dat hij ten minste vijf jaren ononderbroken rechtmatig in Nederland heeft verbleven als
      bedoeld in [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref5], voor zover ten aanzien van
      hem de verwachting bestaat dat hij niet zijn recht van verblijf in Nederland verliest ten gevolge van de opgelegde
      straf of maatregel. Eventuele bewijsstukken dienen tijdig voorafgaand aan het verhoor door de rechtbank te worden
      overlegd.


