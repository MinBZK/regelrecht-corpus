  - number: '66'
    text: |-
      De termijnen, genoemd in de [artikelen 19, onder b][ref1], [22][ref2], en [37, eerste en tweede lid][ref3], lopen
      niet gedurende de tijd dat de betrokkene zich aan de verdere tenuitvoerlegging van de in die artikelen bedoelde
      bevelen heeft onttrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel19
