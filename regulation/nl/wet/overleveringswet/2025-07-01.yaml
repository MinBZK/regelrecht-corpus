  - number: '5'
    text: |-
      Overlevering geschiedt uitsluitend aan uitvaardigende justitiële autoriteiten van andere lidstaten van de Europese
      Unie en met inachtneming van het bepaalde bij of krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0016664/2025-07-01#Artikel5
  - number: '6'
    text: |-
      1 Overlevering van een Nederlander kan worden toegestaan voor zover deze is gevraagd ten behoeve van een tegen
      hem gericht strafrechtelijk onderzoek. De rechtbank kan, voor het geval dat de Nederlander ter zake van de
      feiten waarvoor de overlevering kan worden toegestaan in de uitvaardigende lidstaat tot een onvoorwaardelijke
      vrijheidsstraf wordt veroordeeld, de voorwaarde stellen dat de opgeëiste persoon zijn straf in Nederland mag
      ondergaan. De rechtbank beoordeelt daarbij in het bijzonder of het ondergaan van de straf in Nederland zal
      bijdragen aan de maatschappelijke re-integratie van de Nederlander.

      2 De officier van justitie stelt Onze Minister onverwijld in kennis van elke overlevering onder garantie van
      teruglevering als bedoeld in het eerste lid.

      3 Het eerste lid is eveneens van toepassing op een vreemdeling die tijdens het verhoor door de rechtbank
      aantoont dat hij ten minste vijf jaren ononderbroken rechtmatig in Nederland heeft verbleven als bedoeld in
      [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref1], voor zover ten aanzien van hem
      de verwachting bestaat dat hij niet zijn recht van verblijf in Nederland verliest ten gevolge van een hem na
      overlevering opgelegde straf of maatregel. Eventuele bewijsstukken dienen tijdig voorafgaand aan het verhoor door
      de rechtbank te worden overlegd.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
