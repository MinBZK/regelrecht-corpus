  - number: '12'
    text: |-
      Overlevering kan worden geweigerd indien het Europees aanhoudingsbevel strekt tot de tenuitvoerlegging van
      een vrijheidsbenemende straf of maatregel terwijl de verdachte niet in persoon is verschenen bij het proces
      dat tot de beslissing heeft geleid, tenzij in het Europees aanhoudingsbevel is vermeld dat overeenkomstig de
      procedurevoorschriften van de uitvaardigende lidstaat:

      a. de verdachte tijdig en in persoon is gedagvaard en daarbij op de hoogte is gebracht van de datum en plaats
      van het proces dat tot de beslissing heeft geleid of anderszins daadwerkelijk officieel in kennis is gesteld van
      de datum en de plaats van het proces, zodat op ondubbelzinnige wijze vaststaat dat hij op de hoogte was van het
      voorgenomen proces en ervan in kennis is gesteld dat een beslissing kan worden genomen wanneer hij niet op het
      proces verschijnt; of

      b. de verdachte op de hoogte was van het voorgenomen proces en een door hem gekozen of een hem van overheidswege
      toegewezen advocaat heeft gemachtigd zijn verdediging op het proces te voeren en dat die advocaat tijdens het
      proces zijn verdediging heeft gevoerd; of

      c. de verdachte nadat de beslissing aan hem was betekend en hij uitdrukkelijk was geïnformeerd over zijn recht op
      een verzetprocedure of een procedure in hoger beroep, waarbij hij het recht heeft aanwezig te zijn en tijdens welke
      de zaak opnieuw ten gronde wordt behandeld en nieuw bewijsmateriaal wordt toegelaten, die kan leiden tot herziening
      van de oorspronkelijke beslissing:

      1°. uitdrukkelijk te kennen heeft gegeven dat hij de beslissing niet betwist; of

      2°. niet binnen de voorgeschreven termijn verzet of hoger beroep heeft aangetekend; of

      d. de beslissing niet in persoon aan de verdachte is betekend, maar:

      1°. hem na zijn overlevering onverwijld in persoon zal worden betekend en hij uitdrukkelijk zal worden geïnformeerd
      over zijn recht op een verzetprocedure of een procedure in hoger beroep, waarbij hij het recht heeft aanwezig te
      zijn, waarop de zaak opnieuw ten gronde wordt behandeld en nieuw bewijsmateriaal wordt toegelaten, die kan leiden
      tot herziening van de oorspronkelijke beslissing en

      2°. hij wordt geïnformeerd over de termijn waarbinnen hij verzet of hoger beroep dient aan te tekenen, als vermeld
      in het desbetreffende Europees aanhoudingsbevel.
    url: https://wetten.overheid.nl/BWBR0016664/2025-07-01#Artikel12
  - number: 12a
    text: |-
      1 In de gevallen als bedoeld in [artikel 12, onderdeel d][ref1], kan de persoon tegen wie het Europees
      aanhoudingsbevel is uitgevaardigd en die nog niet officieel van de tegen hem ingestelde strafprocedure in kennis is
      gesteld, hetzij rechtstreeks hetzij door tussenkomst van de officier van justitie aan de uitvaardigende justitiële
      autoriteit om een afschrift van het vonnis dat ten grondslag ligt aan het Europees aanhoudingsbevel, verzoeken.

      2 Nadat de officier van justitie een afschrift van het vonnis van de uitvaardigende justitiële autoriteit heeft
      ontvangen, verstrekt hij dit onverwijld aan de persoon tegen wie het Europees aanhoudingsbevel is uitgevaardigd.

      3 Een verzoek als bedoeld in het eerste lid en het tijdstip van verstrekking van het afschrift van het vonnis kan
      geen afbreuk doen aan de behandeling van het Europees aanhoudingsbevel binnen de in [artikel 22][ref2] gestelde
      termijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0016664#Artikel22
