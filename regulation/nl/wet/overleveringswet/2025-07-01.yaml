  - number: '17'
    text: |-
      1 Elke officier van justitie of hulpofficier van justitie is bevoegd de voorlopige aanhouding van een opgeëiste
      persoon overeenkomstig [artikel 15][ref1] te bevelen.

      2 Kan het optreden van de officier van justitie of de hulpofficier, bedoeld in het eerste lid, niet worden
      afgewacht, dan is elke opsporingsambtenaar bevoegd de opgeëiste persoon aan te houden onder de verplichting zorg te
      dragen dat hij zo spoedig mogelijk wordt voorgeleid voor de officier van justitie of de hulpofficier van justitie.

      3 Nadat de opgeëiste persoon is aangehouden, wordt hem onverwijld schriftelijk mededeling gedaan van:

      a. het recht een afschrift van het Europees aanhoudingsbevel te ontvangen, bedoeld in
      [artikel 23, derde lid][ref2];

      b. het recht op bijstand van een raadsman, bedoeld in [artikel 43a][ref3], en de mogelijkheid te verzoeken om
      aanwijzing van een advocaat in de uitvaardigende lidstaat, bedoeld in [artikel 21a][ref4];

      c. het recht op vertolking, bedoeld in [artikel 30][ref5], en het recht op vertaling, bedoeld in
      [artikel 23, derde lid, vierde en vijfde volzin][ref6];

      d. het recht om gehoord te worden, bedoeld in [artikel 24][ref7];

      e. de in [artikel 27c, derde lid, onder g en h, van het Wetboek van Strafvordering][ref8] bedoelde rechten.

      Aan de opgeëiste persoon die de Nederlandse taal niet of onvoldoende beheerst, wordt de mededeling
      van rechten in een voor hem begrijpelijke taal gedaan. De [artikelen 27e][ref9], [488ab][ref10] en
      [488b van het Wetboek van Strafvordering][ref11] zijn van overeenkomstige toepassing.

      4 Na de opgeëiste persoon te hebben gehoord, kan elke officier van justitie of hulpofficier bevelen dat hij
      gedurende drie dagen, te rekenen vanaf het tijdstip van de voorlopige aanhouding, in verzekering gesteld zal
      blijven. De termijn van inverzekeringstelling kan door de officier van justitie bij het arrondissementsparket te
      Amsterdam éénmaal met drie dagen worden verlengd. Bij zijn verhoor kan de opgeëiste persoon zich door zijn raadsman
      doen bijstaan.

      5 Indien de opgeëiste persoon buiten het arrondissement Amsterdam is aangehouden en in verzekering is
      gesteld, wordt hij binnen de termijnen van het vierde lid overgedragen aan de officier van justitie bij het
      arrondissementsparket te Amsterdam.

      6 Het vijfde lid kan buiten toepassing blijven indien de opgeëiste persoon op grond van
      [artikel 39, tweede lid][ref12], tegenover de rechtbank in het rechtsgebied waar hij is aangehouden heeft
      verklaard, in te stemmen met zijn onmiddellijke overlevering, de rechtbank heeft beslist dat de opgeëiste persoon
      ter beschikking zal worden gesteld van de uitvaardigende justitiële autoriteit en de feitelijke overlevering kan
      plaatsvinden binnen de termijnen van het vierde lid.

      7 De opgeëiste persoon kan te allen tijde door de officier van justitie bij het arrondissementsparket te Amsterdam
      in vrijheid worden gesteld.


