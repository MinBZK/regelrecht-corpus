        bwb_id: BWBR0001903
  - number: 61a
    text: |-
      Bij de feitelijke overlevering van of naar Nederland is de bewaking van de opgeëiste persoon opgedragen aan
      Nederlandse ambtenaren die bevoegd zijn alle dienstige maatregelen te nemen ter beveiliging van de opgeëiste
      persoon en ter voorkoming van zijn ontvluchting.
    url: https://wetten.overheid.nl/BWBR0016664/2025-07-01#Artikel61a
  - number: '62'
    text: |-
      [Artikel 490, eerste lid, eerste volzin en derde lid, van het Wetboek van Strafvordering][ref1] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel490
    url: https://wetten.overheid.nl/BWBR0016664/2025-07-01#Artikel62
