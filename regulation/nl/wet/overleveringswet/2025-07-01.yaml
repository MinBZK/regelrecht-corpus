  - number: '25'
    text: |-
      1 Het verhoor van de opgeëiste persoon geschiedt in het openbaar, tenzij deze een behandeling van de zaak met
      gesloten deuren verlangt of de rechtbank om gewichtige, in het proces-verbaal der zitting te vermelden redenen
      sluiting der deuren beveelt.

      2 Het verhoor heeft plaats in tegenwoordigheid van de officier van justitie.

      3 Bij zijn verhoor kan de opgeëiste persoon zich door zijn raadsman doen bijstaan.

      4 Is de opgeëiste persoon niet verschenen en acht de rechtbank zijn aanwezigheid bij het verhoor wenselijk, dan
      gelast de rechtbank, rekening houdend met de termijnen genoemd in [artikel 22][ref1], tegen een door haar te
      bepalen tijdstip diens dagvaarding, zo nodig onder bijvoeging van een bevel tot medebrenging.

      5 Indien de opgeëiste persoon minderjarig is, worden verschenen ouders of voogd en de verschenen vertegenwoordiger
      van de raad voor de kinderbescherming in de gelegenheid gesteld de minderjarige bij te staan.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel22
