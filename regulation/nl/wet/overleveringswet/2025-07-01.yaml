  - number: '8'
    text: |-
      Met vrijheidsstraffen van langere duur dan twaalf maanden worden voor de toepassing van deze wet gelijkgesteld:
      levenslange vrijheidsstraffen en vrijheidsstraffen van onbepaalde duur.
    url: https://wetten.overheid.nl/BWBR0016664/2025-07-01#Artikel8
  - number: '9'
    text: |-
      1 Overlevering van de opgeëiste persoon kan worden geweigerd voor een feit ter zake waarvan:

      a. tegen hem een strafvervolging in Nederland gaande is;

      b. in Nederland is besloten om af te zien van vervolging wegens het strafbaar feit waarvoor het Europees
      aanhoudingsbevel is uitgevaardigd of om de vervolging voor dit feit niet voort te zetten;

      c. hij naar het recht van een andere lidstaat niet meer kan worden vervolgd, ten gevolge van een in die lidstaat
      ter zake van hetzelfde feit genomen onherroepelijke beslissing;

      d. te zijnen aanzien een overeenkomstig het tweede lid, onder a, onherroepelijke beslissing door een rechter van
      een derde land is genomen;

      e. hij bij rechterlijk gewijsde van een rechter in een derde land is veroordeeld, in gevallen als bedoeld in het
      tweede lid, onder b, sub 1 tot en met 4;

      f. naar Nederlands recht rechtsmacht kon worden uitgeoefend, maar wegens verjaring geen vervolging, of, zo de
      overlevering is gevraagd ten behoeve van de tenuitvoerlegging van een straf of maatregel, geen bestraffing meer
      kan plaatshebben.

      2 De overlevering van de opgeëiste persoon wordt niet toegestaan voor een feit ter zake waarvan:

      a. hij bij gewijsde van de Nederlandse rechter is vrijgesproken of ontslagen van rechtsvervolging, dan wel te
      zijnen aanzien een overeenkomstige onherroepelijke beslissing door een rechter van een andere lidstaat van de
      Europese Unie is genomen;

      b. hij bij rechterlijke gewijsde van de Nederlandse rechter dan wel van een rechter in een andere lidstaat van de
      Europese Unie is veroordeeld, in gevallen waarin:

      1°. de opgelegde straf of maatregel reeds is ondergaan;

      2°. de opgelegde straf of maatregel niet meer voor tenuitvoerlegging of verdere tenuitvoerlegging vatbaar is;

      3°. de veroordeling een schuldigverklaring zonder oplegging van straf of maatregel inhoudt;

      4°. de opgelegde straf of maatregel in Nederland wordt ondergaan;

      c. hij in Nederland is vervolgd, maar hernieuwde vervolging is uitgesloten op grond van [artikel 255][ref1]
      of [artikel 255a van het Wetboek van Strafvordering][ref2], dan wel in Nederland het recht tot strafvordering
      is vervallen omdat hij aan voorwaarden heeft voldaan die door de officier van justitie voor aanvang van de
      terechtzitting ter voorkoming van de strafvervolging zijn gesteld, dan wel te zijnen aanzien een overeenkomstige
      beslissing is genomen in een andere lidstaat waarbij sprake is van een onherroepelijke berechting voor dezelfde
      feiten.

      3 Onderdeel a van het eerste lid lijdt uitzondering in gevallen waarin Onze Minister na advies van het openbaar
      ministerie en voorafgaand aan de beslissing tot overlevering opdracht heeft gegeven de vervolging te staken.

      4 Onderdeel c van het tweede lid lijdt uitzondering in gevallen waarin de vervolging
      in Nederland is gestaakt, hetzij omdat de Nederlandse strafwet op grond van een van de
      [artikelen 2 tot en met 8d van het Wetboek van Strafrecht][ref3] niet van toepassing bleek te zijn, hetzij omdat
      aan berechting in het buitenland de voorkeur werd gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel255
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel255a
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel2
