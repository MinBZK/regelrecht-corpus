  - number: '30.2'
    text: |-
      De in het eerste lid genoemde artikelen vinden geen toepassing voor zover deze betrekking hebben op een getuige
      wiens identiteit niet of slechts ten dele blijkt.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel30
  - number: '31.1'
    text: |-
      De uitspraak van de rechtbank wordt aan de opgeëiste persoon die bij de voorlezing daarvan niet tegenwoordig is
      geweest, betekend. Daarbij wordt hem meegedeeld dat hij tegen de uitspraak geen rechtsmiddel kan instellen.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel31
  - number: '31.2'
    text: |-
      Indien het Europees aanhoudingsbevel is uitgevaardigd nadat de uitvaardigende justitiële autoriteit overeenkomstig
      [artikel 2, derde lid][ref1], in de gelegenheid is gesteld om een Europees aanhoudingsbevel uit te vaardigen voor
      dezelfde feiten als die welke aan het uitleveringsverzoek ten grondslag liggen, wordt door de officier van justitie
      aan de opgeëiste persoon meegedeeld dat Onze Minister, indien het verzoek tot uitlevering ontvankelijk en voor
      inwilliging vatbaar is, het bepaalde in [artikel 35, tweede lid, van de Uitleveringswet][ref2] buiten toepassing
      zal laten en aan de uitspraak van de rechtbank voorrang zal geven.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002559#Artikel35
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0016664
        artikel: '2'
        hoofdstuk: I
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002559
        artikel: '35'
  - number: '31.3'
    text: |-
      Indien, buiten de in het tweede lid bedoelde gevallen, ten aanzien van de opgeëiste persoon een
      concurrerend uitleveringsverzoek of overleveringsverzoek van het Internationaal Strafhof of een ander
      internationaal tribunaal in behandeling is genomen, wordt de opgeëiste persoon eveneens meegedeeld
      dat Onze Minister, met inachtneming van [artikel 35 van de Uitleveringswet][ref1] respectievelijk
      [artikel 31 van de Uitvoeringswet Internationaal Strafhof][ref2] of andere toepasselijke wetgeving, zal beslissen
      of aan de uitspraak van de rechtbank gevolg wordt gegeven, dan wel of betrokkene wordt uitgeleverd respectievelijk
      wordt overgeleverd aan het Internationaal Strafhof of aan een ander internationaal tribunaal.


      [ref1]: https://wetten.overheid.nl/BWBR0002559#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0013796#Artikel31
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002559
        artikel: '35'
      - id: ref2
        bwb_id: BWBR0013796
        artikel: '31'
  - number: '31.4'
    text: |-
      De griffier van de rechtbank zendt uiterlijk drie dagen na de uitspraak het Europees aanhoudingsbevel met de
      daarbij behorende stukken terug aan de officier van justitie.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel31
  - number: '31.5'
    text: |-
      In de gevallen bedoeld in het tweede en derde lid zendt de griffier van de rechtbank tevens een afschrift van het
      Europees aanhoudingsbevel met de daarbij behorende stukken aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel31
  - number: '32'
    text: |-
      De officier van justitie brengt de uitspraak van de rechtbank onverwijld ter kennis van de uitvaardigende
      justitiële autoriteit. Indien de overlevering is toegestaan, vermeldt hij hetzij de termijn waarbinnen de
      overlevering dient plaats te vinden, hetzij het bestaan van een concurrerend uitleveringsverzoek of een
      overleveringsverzoek van het Internationaal Strafhof of een ander internationaal tribunaal.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel32
  - number: '33'
    text: |-
      Een krachtens [artikel 27][ref1] bevolen vrijheidsbeneming wordt – behoudens de mogelijkheid van verdere
      vrijheidsbeneming uit anderen hoofde – beëindigd zodra:


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel27
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0016664
        artikel: '27'
        hoofdstuk: II
        paragraaf: C
        afdeling: '2'
  - number: 33.a
    text: |-
      zulks door de rechtbank of door de officier van justitie, ambtshalve of op verzoek van de opgeëiste persoon of
      diens raadsman, wordt gelast;
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel33
  - number: 33.b
    text: |-
      zij sedert de dag van de uitspraak tien dagen heeft geduurd, tenzij de rechtbank, op vordering van de officier van
      justitie, de vrijheidsbeneming inmiddels heeft verlengd.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel33
  - number: '34.1'
    text: |-
      Verlenging van de vrijheidsbeneming als bedoeld in [artikel 33, onderdeel b][ref1], kan voor ten hoogste tien dagen
      geschieden.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel33
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0016664
        artikel: '33'
        hoofdstuk: II
        paragraaf: D
        afdeling: '2'
  - number: '34.2'
    text: |-
      In afwijking van het eerste lid kan de vrijheidsbeneming telkens worden verlengd met ten hoogste dertig dagen
      indien:
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel34
  - number: 34.2.a
    text: |-
      ook de uitlevering is gevraagd of de overlevering door het Internationaal Strafhof of een ander internationaal
      tribunaal, en Onze Minister nog niet op die verzoeken heeft beslist;
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel34
  - number: 34.2.b
    text: |-
      de overlevering wel is toegestaan, maar de feitelijke overlevering niet binnen de gestelde termijn heeft kunnen
      plaatshebben.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel34
  - number: '34.3'
    text: De opgeëiste persoon wordt in de gelegenheid gesteld op de vordering tot verlenging te worden gehoord.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel34
  - number: '35.1'
    text: |-
      Zo spoedig mogelijk na de uitspraak waarbij de overlevering geheel of gedeeltelijk is toegestaan, maar niet later
      dan tien dagen na de datum van deze uitspraak, wordt de opgeëiste persoon feitelijk overgeleverd. De officier van
      justitie bepaalt, na overleg met de uitvaardigende justitiële autoriteit, de tijd en plaats.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel35
  - number: '35.2'
    text: |-
      Indien door bijzondere omstandigheden de feitelijke overlevering niet binnen de in het eerste lid gestelde termijn
      kan plaatsvinden, wordt in onderling overleg een nieuwe datum bepaald. De feitelijke overlevering vindt alsdan
      uiterlijk tien dagen na de vastgestelde datum plaats.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel35
  - number: '35.3'
    text: |-
      Feitelijke overlevering kan bij wijze van uitzondering achterwege blijven zolang er ernstige humanitaire
      redenen bestaan die aan de feitelijke overlevering in de weg staan, in het bijzonder zolang het gelet op de
      gezondheidstoestand van de opgeëiste persoon niet verantwoord is om te reizen. De uitvaardigende justitiële
      autoriteit wordt onverwijld hiervan in kennis gesteld. De officier van justitie bepaalt, na overleg met de
      uitvaardigende justitiële autoriteit, de tijd en plaats waarop de feitelijke overlevering alsnog kan plaatsvinden.
      De feitelijke overlevering vindt alsdan uiterlijk tien dagen na de vastgestelde datum plaats.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel35
  - number: '35.4'
    text: |-
      De vrijheidsbeneming van de opgeëiste persoon wordt beëindigd na het verstrijken van de in het eerste tot en met
      derde lid genoemde termijnen.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel35
  - number: '36.1'
    text: |-
      De beslissing omtrent de tijd en de plaats van de feitelijke overlevering kan worden aangehouden, indien en zolang
      tegen de opgeëiste persoon een strafrechtelijke vervolging in Nederland gaande is, of een door een Nederlandse
      rechter tegen hem gewezen strafvonnis nog geheel of ten dele voor tenuitvoerlegging vatbaar is.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel36
  - number: '36.2'
    text: |-
      In gevallen als voorzien in het eerste lid kan Onze Minister, na advies van het openbaar ministerie, bepalen dat en
      onder welke voorwaarden de opgeëiste persoon ten behoeve van diens berechting of de tenuitvoerlegging van een hem
      bij onherroepelijk vonnis opgelegde vrijheidsstraf reeds aanstonds voorlopig ter beschikking van de uitvaardigende
      justitiële autoriteit kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel36
  - number: '36.3'
    text: 'Tot de door Onze Minister te stellen voorwaarden behoort in geval van:'
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel36
  - number: 36.3.a
    text: |-
      een lopende strafvervolging als bedoeld in het eerste lid in elk geval dat het recht op aanwezigheid van de
      opgeëiste persoon bij de voortzetting van de strafvervolging in Nederland zal worden gerespecteerd en dat hij de
      hem in Nederland opgelegde straf in Nederland zal ondergaan.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel36
  - number: 36.3.b
    text: |-
      een door een Nederlandse rechter tegen de opgeëiste persoon gewezen strafvonnis als bedoeld in het eerste lid in
      elk geval de garantie dat de opgeëiste persoon na de berechting terugkomt naar Nederland voor de tenuitvoerlegging
      van het resterende deel van de hem in Nederland opgelegde straf.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel36
  - number: '36.4'
    text: |-
      In geval van toepassing van het tweede lid bericht de officier van justitie dat de opgeëiste persoon voorlopig ter
      beschikking zal worden gesteld van de uitvaardigende justitiële autoriteit, met wie hij ook de daaraan verbonden
      voorwaarden schriftelijk overeenkomt.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel36
  - number: '36.5'
    text: |-
      Ondergaat de opgeëiste persoon, te wiens aanzien het vierde lid wordt toegepast, een vrijheidsstraf, dan komt
      de tijd gedurende welke hij in het buitenland ter beschikking van de uitvaardigende justitiële autoriteit is, in
      mindering op zijn straftijd.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel36
  - number: '36.6'
    text: |-
      Is de opgeëiste persoon, te wiens aanzien het derde lid is toegepast, op het moment dat hij naar Nederland wordt
      teruggebracht met het oog op zijn aanwezigheid bij de behandeling van zijn strafzaak, in de uitvaardigende lidstaat
      veroordeeld tot een onvoorwaardelijke vrijheidsstraf dan kan hij gedurende zijn verblijf hier te lande op bevel
      van de officier van justitie in verzekering worden gesteld. De [artikelen 61][ref1] en [64, eerste lid][ref2], zijn
      voor zover nodig van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0016664#Artikel64
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0016664
        artikel: '61'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0016664
        artikel: '64'
        hoofdstuk: V
  - number: '36.7'
    text: |-
      De inverzekeringstelling kan worden opgeheven zodra de officier van justitie bericht ontvangt dat de gronden voor
      de detentie in het buitenland niet langer bestaan.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel36
  - number: '37.1'
    text: |-
      Indien zulks voor de toepassing van [artikel 35, eerste of tweede lid][ref1], noodzakelijk is, wordt de opgeëiste
      persoon op bevel van de officier van justitie aangehouden voor ten hoogste drie dagen. Indien de feitelijke
      overlevering niet binnen de termijn van drie dagen heeft kunnen plaatsvinden, kan het bevel tot aanhouding door de
      officier van justitie eenmaal voor ten hoogste drie dagen worden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel35
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0016664
        artikel: '35'
        hoofdstuk: II
        paragraaf: D
        afdeling: '2'
  - number: '37.2'
    text: |-
      Na verlenging van de in het eerste lid bedoelde termijn door de officier van justitie, kan deze uitsluitend op
      vordering van de officier van justitie door de rechtbank voor ten hoogste tien dagen worden verlengd.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel37
  - number: '37.3'
    text: |-
      Een verlenging als bedoeld in het tweede lid kan alleen geschieden wanneer de feitelijke overlevering door
      bijzondere omstandigheden niet binnen de termijn van zes dagen, ingevolge het eerste lid, heeft kunnen
      plaatshebben.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel37
  - number: '38'
    text: |-
      Bij de feitelijke overlevering deelt de officier van justitie aan de uitvaardigende justitiële autoriteit of, in
      voorkomend geval, aan de bevoegde centrale autoriteit de duur van de vrijheidsbeneming van de opgeëiste persoon met
      het oog op zijn overlevering, mee.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel38
  - number: '39.1'
    text: |-
      De opgeëiste persoon die overeenkomstig [artikel 4, eerste of tweede lid][ref1], is gesignaleerd ter fine van
      aanhouding met het oog op zijn overlevering of ten aanzien van wie een Europees aanhoudingsbevel is ontvangen, kan,
      uiterlijk op de dag voorafgaande aan die welke overeenkomstig [artikel 24][ref2] is bepaald voor zijn verhoor door
      de rechtbank, verklaren dat hij instemt met zijn onmiddellijke overlevering.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0016664#Artikel24
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0016664
        artikel: '4'
        hoofdstuk: I
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0016664
        artikel: '24'
        hoofdstuk: II
        paragraaf: C
        afdeling: '2'
  - number: '39.2'
    text: |-
      Een verklaring overeenkomstig het eerste lid kan tijdens de termijn van inverzekeringstelling als bedoeld in
      [artikel 17, vierde lid, eerste volzin][ref1], of [artikel 21, vijfde lid][ref2], worden afgelegd voor elke
      rechtbank. Nadien kan de verklaring uitsluitend worden afgelegd ten overstaan van de rechtbank. De afgelegde
      verklaring kan niet worden herroepen.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0016664#Artikel21
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0016664
        artikel: '17'
        hoofdstuk: II
        paragraaf: A
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0016664
        artikel: '21'
        hoofdstuk: II
        paragraaf: B
        afdeling: '2'
  - number: '39.3'
    text: |-
      De rechtbank is bevoegd de identiteit van de opgeëiste persoon vast te stellen op de wijze, bedoeld
      in [artikel 27a, eerste lid, eerste volzin, en tweede lid, van het Wetboek van Strafvordering][ref1].
      [Artikel 29c, tweede lid, van dat wetboek][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel27a
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel29c
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 27a
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 29c
  - number: '39.4'
    text: |-
      De opgeëiste persoon kan zich bij het afleggen van de verklaring doen bijstaan door een raadsman. Hierop wordt, zo
      hij zonder raadsman verschijnt, zijn aandacht gevestigd de rechtbank.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel39
  - number: '39.5'
    text: |-
      Voordat hij de verklaring aflegt, wordt de opgeëiste persoon op de mogelijke gevolgen daarvan gewezen. Van de
      verklaring wordt proces-verbaal opgemaakt.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel39
  - number: '39.6'
    text: |-
      De rechtbank waarvoor de verklaring is afgelegd, zendt het proces-verbaal daarvan onverwijld aan de officier van
      justitie.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel39
  - number: '40.1'
    text: |-
      Uiterlijk tien dagen nadat een verklaring overeenkomstig [artikel 39][ref1] is afgelegd, beslist de rechtbank of
      de opgeëiste persoon ter beschikking zal worden gesteld van de uitvaardigende justitiële autoriteit van wie de
      signalering als bedoeld in [artikel 4, eerste en tweede lid][ref2], of het Europees aanhoudingsbevel is uitgegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0016664#Artikel4
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0016664
        artikel: '39'
        hoofdstuk: II
        paragraaf: E
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0016664
        artikel: '4'
        hoofdstuk: I
        afdeling: '2'
  - number: '40.2'
    text: 'Het eerste lid blijft buiten toepassing:'
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel40
  - number: 40.2.a
    text: |-
      indien voor het feit of de feiten, in verband waarmede de signalering is gedaan of het Europees aanhoudingsbevel is
      afgegeven, ingevolge een der [artikelen 6a, eerste lid][ref1], en [9 tot en met 11][ref2] geen overlevering wordt
      toegestaan;


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0016664#Artikel9
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0016664
        artikel: 6a
        hoofdstuk: II
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0016664
        artikel: '9'
        hoofdstuk: II
        afdeling: '1'
  - number: 40.2.b
    text: |-
      indien blijkt dat tegen de opgeëiste persoon in Nederland een strafrechtelijke vervolging gaande is of dat tegen
      hem door een Nederlandse rechter een nog geheel of ten dele voor tenuitvoerlegging vatbaar strafvonnis is gewezen.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel40
  - number: '40.3'
    text: |-
      In de beslissing, bedoeld in het eerste lid, worden het feit of de feiten waarvoor de opgeëiste persoon ter
      beschikking wordt gesteld, de bedingen waaronder de overlevering wordt toegestaan, bedoeld in [artikel 14][ref1],
      en, in voorkomend geval, de garantie tot teruglevering, bedoeld in [artikel 6, eerste lid][ref2], vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0016664#Artikel6
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0016664
        artikel: '14'
        hoofdstuk: II
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0016664
        artikel: '6'
        hoofdstuk: II
        afdeling: '1'
  - number: '40.4'
    text: |-
      Van elke beslissing, genomen krachtens het eerste lid van dit artikel, geeft de officier van justitie onverwijld
      kennis aan de opgeëiste persoon en de uitvaardigende justitiële autoriteit.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel40
  - number: '41.1'
    text: |-
      Indien de rechtbank overeenkomstig [artikel 40][ref1] heeft beslist dat de opgeëiste persoon ter
      beschikking zal worden gesteld van de uitvaardigende justitiële autoriteit van de andere lidstaat, blijft
      [artikel 23, tweede lid][ref2], buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0016664#Artikel23
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0016664
        artikel: '40'
        hoofdstuk: II
        paragraaf: E
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0016664
        artikel: '23'
        hoofdstuk: II
        paragraaf: C
        afdeling: '2'
  - number: '41.2'
    text: |-
      Is de in [artikel 23, tweede lid][ref1], bedoelde vordering reeds bij de rechtbank ingediend, dan wordt deze
      onverwijld ingetrokken. De griffier van de rechtbank stelt alsdan het Europees aanhoudingsbevel, met de daarbij
      behorende stukken, weer in handen van de officier van justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel23
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0016664
        artikel: '23'
        hoofdstuk: II
        paragraaf: C
        afdeling: '2'
  - number: '41.3'
    text: Van het intrekken van de vordering geeft de officier van justitie kennis aan de opgeëiste persoon.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel41
  - number: '42.1'
    text: |-
      Na de dag waarop hij de in [artikel 39][ref1] bedoelde verklaring heeft afgelegd, kan de opgeëiste persoon nog
      slechts gedurende ten hoogste twintig dagen in bewaring of in verzekering gesteld blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel39
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0016664
        artikel: '39'
        hoofdstuk: II
        paragraaf: E
        afdeling: '2'
  - number: '42.2'
    text: |-
      Het eerste lid blijft buiten toepassing, indien de rechtbank heeft beslist dat aan de verklaring geen gevolg zal
      worden gegeven en het Europees aanhoudingsbevel, overeenkomstig [artikel 23, tweede lid][ref1], aan de rechtbank
      is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel23
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0016664
        artikel: '23'
        hoofdstuk: II
        paragraaf: C
        afdeling: '2'
  - number: '42.3'
    text: |-
      De in het eerste lid van dit artikel gestelde termijn kan, op vordering van de officier van justitie, door de
      rechtbank telkens met ten hoogste dertig dagen worden verlengd uitsluitend wanneer de feitelijke overlevering
      door bijzondere omstandigheden niet binnen de termijn van twintig dagen, bedoeld in het eerste lid, heeft kunnen
      plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel42
  - number: '43.1'
    text: |-
      In geval van toepassing van [artikel 40, eerste lid][ref1], bepaalt de officier van justitie, na overleg met
      de bevoegde buitenlandse autoriteiten, onverwijld de tijd en de plaats waarop de feitelijke overlevering zal
      geschieden.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel40
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0016664
        artikel: '40'
        hoofdstuk: II
        paragraaf: E
        afdeling: '2'
  - number: '43.2'
    text: |-
      De officier van justitie kan, zo nodig, met het oog op de feitelijke overlevering krachtens deze paragraaf, de
      aanhouding van de opgeëiste persoon bevelen voor ten hoogste drie dagen. Indien de feitelijke overlevering niet
      binnen de termijn van drie dagen heeft kunnen plaatsvinden, kan het bevel tot aanhouding door de officier van
      justitie eenmaal voor ten hoogste drie dagen worden verlengd. [Artikel 37, tweede en derde lid][ref1], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel37
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0016664
        artikel: '37'
        hoofdstuk: II
        paragraaf: D
        afdeling: '2'
  - number: 43a.1
    text: |-
      De opgeëiste persoon heeft in de procedure voor overlevering door Nederland het recht zich door een raadsman te
      doen bijstaan. De [artikelen 28][ref1], [28a][ref2], [28c, tweede lid][ref3], [29a, eerste lid][ref4], [37][ref5],
      [38][ref6], [43 tot en met 45][ref7] en [124 van het Wetboek van Strafvordering][ref8] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel28a
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel28c
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel29a
      [ref5]: https://wetten.overheid.nl/BWBR0001903#Artikel37
      [ref6]: https://wetten.overheid.nl/BWBR0001903#Artikel38
      [ref7]: https://wetten.overheid.nl/BWBR0001903#Artikel43
      [ref8]: https://wetten.overheid.nl/BWBR0001903#Artikel124
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 28a
      - id: ref3
        bwb_id: BWBR0001903
        artikel: 28c
      - id: ref4
        bwb_id: BWBR0001903
        artikel: 29a
      - id: ref5
        bwb_id: BWBR0001903
        artikel: '37'
      - id: ref6
        bwb_id: BWBR0001903
        artikel: '38'
      - id: ref7
        bwb_id: BWBR0001903
        artikel: '43'
      - id: ref8
        bwb_id: BWBR0001903
        artikel: '124'
  - number: 43a.2
    text: |-
      Indien de opgeëiste persoon krachtens deze wet wordt aangehouden, stelt de hulpofficier van justitie het
      bestuur van de raad voor rechtsbijstand hiervan in kennis, opdat het bestuur een raadsman aanwijst. De
      [artikelen 28b, eerste lid, tweede volzin][ref1], en [39 van het Wetboek van Strafvordering][ref2] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel28b
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel39
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 28b
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '39'
  - number: 43a.3
    text: |-
      Indien de raadsman niet binnen twee uur na de in het tweede lid bedoelde kennisgeving beschikbaar is, kan
      officier van justitie of – met toestemming van de officier van justitie – de hulpofficier van justitie beginnen
      met het horen van de opgeëiste persoon in verband met de beslissing over de inverzekeringstelling, bedoeld in de
      [artikelen 17, vierde lid][ref1], en [21, vijfde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0016664#Artikel21
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0016664
        artikel: '17'
        hoofdstuk: II
        paragraaf: A
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0016664
        artikel: '21'
        hoofdstuk: II
        paragraaf: B
        afdeling: '2'
  - number: 43a.4
    text: |-
      De opgeëiste persoon voor wie ingevolge het tweede lid een raadsman beschikbaar is, wordt de gelegenheid verschaft
      om voorafgaand aan zijn verhoor in verband met de in het derde lid bedoelde beslissing gedurende ten hoogste een
      half uur met hem een onderhoud te hebben.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel43a
  - number: 43a.5
    text: |-
      Indien een persoon die geen raadsman heeft overeenkomstig deze wet zijn vrijheid wordt benomen – anders dan
      uit kracht van een Europees aanhoudingsbevel of een Nederlands bevel tot aanhouding of voorlopige aanhouding,
      dan wel tot inverzekeringstelling of tot verlenging van de termijn daarvan – wijst het bestuur van de raad voor
      rechtsbijstand, na mededeling van de vrijheidsbeneming door het openbaar ministerie, een raadsman aan.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel43a
  - number: '44'
    text: Elke rechter-commissaris kan fungeren als uitvaardigende justitiële autoriteit.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel44
  - number: '45.1'
    text: 'Bij of in een Europees aanhoudingsbevel dient door de uitvaardigende rechter-commissaris te worden verklaard:'
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel45
  - number: 45.1.a
    text: |-
      indien de opgeëiste persoon een onderdaan is van de uitvoerende lidstaat, dat, zo hij ter zake van de feiten
      waarvoor de overlevering kan worden toegestaan in Nederland tot een onvoorwaardelijke vrijheidsstraf wordt
      veroordeeld, hij deze straf in de uitvoerende lidstaat zal mogen ondergaan;
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel45
  - number: 45.1.b
    text: |-
      indien het strafbare feit dat aan het Europees aanhoudingsbevel ten grondslag ligt, is bedreigd met een levenslange
      vrijheidsstraf dat, in voorkomend geval, naar Nederlands recht de mogelijkheid bestaat van de toepassing van gratie
      op de opgelegde straf of maatregel.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel45
  - number: '45.2'
    text: |-
      Aan een verklaring, bedoeld in het eerste lid, is iedere persoon of instantie die in Nederland is belast met een
      publieke taak, gebonden.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel45
  - number: 45a.1
    text: |-
      Indien het Europees aanhoudingsbevel strekt tot tenuitvoerlegging van een beslissing terwijl de verdachte niet
      in persoon is verschenen bij het proces dat tot de beslissing heeft geleid, verklaart de uitvaardigende rechter-
      commissaris in het Europees aanhoudingsbevel dat:
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel45a
  - number: 45a.1.a
    text: |-
      de verdachte tijdig en in persoon is gedagvaard en daarbij op de hoogte is gebracht van de datum en plaats van het
      proces dat tot het vonnis heeft geleid of anderszins daadwerkelijk officieel in kennis is gesteld van de datum en
      de plaats van het proces, zodat op ondubbelzinnige wijze vaststaat dat hij op de hoogte was van het voorgenomen
      proces en ervan in kennis is gesteld dat een beslissing kan worden genomen wanneer hij niet op het proces
      verschijnt; of
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel45a
  - number: 45a.1.b
    text: |-
      de verdachte op de hoogte was van het voorgenomen proces en een door hem gekozen of een hem van overheidswege
      toegewezen advocaat heeft gemachtigd zijn verdediging op het proces te voeren en dat die advocaat tijdens het
      proces zijn verdediging heeft gevoerd; of
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel45a
  - number: 45a.1.c
    text: |-
      de verdachte nadat de beslissing aan hem was betekend en hij uitdrukkelijk was geïnformeerd over zijn recht op een
      verzetprocedure of een procedure in hoger beroep, waarbij hij het recht heeft aanwezig te zijn en tijdens welke de
      zaak opnieuw ten gronde wordt behandeld en nieuw bewijsmateriaal wordt toegelaten, die kan leiden tot herziening
      van de oorspronkelijke beslissing uitdrukkelijk te kennen heeft gegeven dat hij de beslissing niet betwist of niet
      binnen de voorgeschreven termijn verzet of hoger beroep heeft aangetekend; of
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel45a
  - number: 45a.1.d
    text: 'de beslissing niet in persoon aan de verdachte is betekend, maar:'
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel45a
  - number: 45a.1.d.1°
    text: |-
      hem na zijn overlevering onverwijld in persoon zal worden betekend en hij uitdrukkelijk zal worden geïnformeerd
      over zijn recht op een verzetprocedure of een procedure in hoger beroep, waarbij hij het recht heeft aanwezig te
      zijn, waarop de zaak opnieuw ten gronde wordt behandeld en nieuw bewijsmateriaal wordt toegelaten, die kan leiden
      tot herziening van de oorspronkelijke beslissing en
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel45a
  - number: 45a.1.d.2°
    text: |-
      hij wordt geïnformeerd over de termijn waarbinnen hij verzet of hoger beroep dient aan te tekenen, als vermeld in
      het desbetreffende Europees aanhoudingsbevel.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel45a
  - number: 45a.2
    text: |-
      Aan een verklaring als bedoeld in onderdeel d van het eerste lid, is iedere persoon of instantie die in Nederland
      is belast met een publieke taak, gebonden.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel45a
  - number: 45b
    text: |-
      In de gevallen als bedoeld in [artikel 45a, eerste lid, onderdeel d][ref1], verstrekt de uitvaardigende rechter-
      commissaris op verzoek van de persoon tegen wie het Europees aanhoudingsbevel is uitgevaardigd en die nog niet
      officieel van de tegen hem ingestelde strafprocedure in kennis is gesteld, onverwijld en door tussenkomst van
      de uitvoerende justitiële autoriteit, een afschrift van het vonnis, dat ten grondslag ligt aan het Europees
      aanhoudingsbevel. [Artikel 408, tweede lid, van het Wetboek van Strafvordering][ref2] is in dit geval niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel45a
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel408
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel45b
    references:
      - id: ref1
        bwb_id: BWBR0016664
        artikel: 45a
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '408'
  - number: '46.1'
    text: |-
      De uitvaardigende rechter-commissaris is bevoegd rechtstreeks contact te onderhouden met de uitvoerende justitiële
      autoriteit.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel46
  - number: '46.2'
    text: |-
      Een signalering als bedoeld in [artikel 4, eerste en tweede lid][ref1], draagt de uitvaardigende rechter-
      commissaris, zo veel mogelijk door tussenkomst van de officier van justitie op aan een of meerdere landelijke
      eenheden van de politie, onder overlegging van een gewaarmerkt afschrift van het door hem afgegeven Europees
      aanhoudingsbevel.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel4
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0016664
        artikel: '4'
        hoofdstuk: I
        afdeling: '2'
  - number: '47'
    text: |-
      De uitvaardigende rechter-commissaris is met het oog op de behandeling en uitvoering van het door hem afgegeven
      Europees aanhoudingsbevel bevoegd de uitvoerende justitiële autoriteit op verzoek of eigener beweging aanvullende
      informatie te verstrekken en, in voorkomend geval, schriftelijk de voorwaarden overeen te komen in het geval de
      opgeëiste persoon voorlopig ter beschikking wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel47
  - number: '48'
    text: |-
      De voorwaarden die door de buitenlandse uitvoerende justitiële autoriteit in overeenstemming met het op 13 juni
      2002 door de Raad vastgestelde kaderbesluit betreffende het Europees aanhoudingsbevel en de procedures van
      overlevering tussen de lidstaten van de Europese Unie (PbEG L 190) worden gesteld bij de overlevering van de
      opgeëiste persoon aan Nederland, zijn verbindend voor iedere persoon of instantie die in Nederland is belast met
      een publieke taak.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel48
  - number: 48a
    text: |-
      Na ontvangst van een kennisgeving van de uitvoerende justitiële autoriteit dat de opgeëiste persoon heeft verzocht
      om aanwijzing van een in Nederland ingeschreven advocaat met het oog op het, door het verstrekken van informatie
      en advies, verlenen van bijstand aan zijn raadsman in de uitvoerende lidstaat ten behoeve van de procedure voor
      overlevering in die lidstaat, verstrekt de uitvaardigende rechter-commissaris, al dan niet door tussenkomst van die
      autoriteit, de daarvoor benodigde gegevens aan de opgeëiste persoon. Deze verstrekking vindt onverwijld plaats; de
      termijnen voor behandeling van het Europees aanhoudingsbevel gelden onverkort.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel48a
  - number: '49.1'
    text: |-
      Voorwerpen, aangetroffen in het bezit van de opgeëiste persoon, kunnen op verzoek van de uitvaardigende justitiële
      autoriteit in beslag worden genomen. De inbeslagneming kan door elke officier of hulpofficier van justitie worden
      gelast.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel49
  - number: '49.2'
    text: |-
      Indien de inbeslagneming niet in het arrondissement Amsterdam heeft plaatsgevonden, wordt de officier van justitie
      bij het arrondissementsparket Amsterdam daarvan in kennis gesteld en worden voorwerpen bij de overdracht van de
      opgeëiste persoon of, indien dat onmogelijk is, zo spoedig mogelijk daarna aan hem overgedragen.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel49
  - number: '49.3'
    text: |-
      Bij de in [artikel 23, tweede lid][ref1], bedoelde vordering legt de officier van justitie een lijst van de in
      beslag genomen voorwerpen aan de rechtbank over.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel23
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0016664
        artikel: '23'
        hoofdstuk: II
        paragraaf: C
        afdeling: '2'
  - number: '50.1'
    text: |-
      De rechtbank beslist bij haar uitspraak over de overlevering tevens over de afgifte dan wel de teruggave van de
      in beslag genomen voorwerpen en vermeldt dit in haar uitspraak. Afgifte van die voorwerpen aan de uitvaardigende
      justitiële autoriteit kan alleen worden bevolen in het geval van inwilliging van het verzoek tot overlevering.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel50
  - number: '50.2'
    text: |-
      Met het oog op de mogelijke rechten van derden kan de rechtbank ten aanzien van bepaalde voorwerpen beslissen, dat
      afgifte slechts mag geschieden onder het beding, dat die voorwerpen onmiddellijk zullen worden teruggezonden nadat
      daarvan het voor de strafvordering nodige gebruik zal zijn gemaakt.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel50
  - number: '50.3'
    text: |-
      In geval van overlevering overeenkomstig [§ E van afdeling 2 van hoofdstuk II][ref1], beslist de officier
      van justitie over de afgifte dan wel de teruggave van de in beslag genomen voorwerpen. Hij houdt daarbij,
      overeenkomstig het tweede lid, rekening met de mogelijke rechten van derden.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0016664
        hoofdstuk: II
        paragraaf: E
        afdeling: '2'
  - number: '50.4'
    text: |-
      Voorwerpen ten aanzien waarvan de rechtbank de overdracht heeft toegestaan, worden ook overgedragen indien de
      opgeëiste persoon wegens overlijden of ontsnapping niet feitelijk kan worden overgeleverd.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel50
  - number: '51.1'
    text: |-
      Vreemdelingen die, ten behoeve van een strafrechtelijk onderzoek of de tenuitvoerlegging van een strafvonnis,
      door de uitvoerende justitiële autoriteit van een lidstaat feitelijk worden overgeleverd aan de uitvaardigende
      justitiële autoriteit van een andere lidstaat of door een derde staat aan een andere lidstaat worden uitgeleverd,
      kunnen met toestemming van de officier van justitie over Nederlands grondgebied worden vervoerd.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel51
  - number: '51.2'
    text: |-
      Toestemming voor vervoer over land wordt gegeven door de officier van justitie mits de volgende gegevens zijn
      ontvangen:
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel51
  - number: 51.2.a
    text: |-
      de identiteit en de nationaliteit van de persoon tegen wie het Europees aanhoudingsbevel is afgegeven of ten
      aanzien van wie een uitleveringsverzoek is gedaan;
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel51
  - number: 51.2.b
    text: het bestaan van een Europees aanhoudingsbevel of van een uitleveringsverzoek aan een derde staat;
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel51
  - number: 51.2.c
    text: de aard en wettelijke kwalificatie van het strafbare feit;
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel51
  - number: 51.2.d
    text: een beschrijving van de omstandigheden waaronder het strafbare feit is begaan, met inbegrip van tijd en plaats.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel51
  - number: '51.3'
    text: |-
      De in het tweede lid bedoelde toestemming wordt niet gegeven in gevallen, waarin de door te voeren persoon staat
      gesignaleerd ter fine van overlevering aan een andere lidstaat dan die van bestemming, aan het Internationaal
      Strafhof of aan een ander internationaal tribunaal of ter fine van uitlevering aan een derde staat.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel51
  - number: '51.4'
    text: |-
      De doorvoer van Nederlanders kan slechts worden toegestaan voor zover hun overlevering krachtens deze wet mogelijk
      is en onder dezelfde waarborgen.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel51
  - number: '51.5'
    text: |-
      De toestemming van de officier van justitie is niet vereist voor vervoer door de lucht waarbij geen landing op
      Nederlands gebied wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel51
  - number: '51.6'
    text: |-
      In geval van een niet voorziene landing op Nederlands grondgebied kan de vreemdeling, op verzoek van de hem
      begeleidende buitenlandse ambtenaren, voorlopig worden aangehouden krachtens een bevel van de officier of
      hulpofficier van justitie. [Artikel 17][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel17
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0016664
        artikel: '17'
        hoofdstuk: II
        paragraaf: A
        afdeling: '2'
  - number: '51.7'
    text: |-
      Het vervoer van de voorlopig aangehouden vreemdeling kan worden voortgezet, zodra de officier van justitie de in
      het tweede lid bedoelde informatie heeft ontvangen en daartoe toestemming verleent. Is de toestemming na afloop van
      de termijn van inverzekeringstelling nog niet verleend of binnen die termijn geweigerd, dan wordt de vreemdeling
      terstond in vrijheid gesteld, behoudens de mogelijkheid van verdere vrijheidsbeneming uit anderen hoofde.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel51
  - number: '52.1'
    text: |-
      Bij vervoer te land, overeenkomstig [artikel 51][ref1], wordt de bewaking van de vreemdeling opgedragen aan
      Nederlandse ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel51
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0016664
        artikel: '51'
        hoofdstuk: IV
        afdeling: '1'
  - number: '52.2'
    text: |-
      Indien het ten gevolge van bijzondere omstandigheden niet mogelijk is het vervoer door Nederland zonder
      onderbreking voort te zetten, kan de vreemdeling, in afwachting van een passende gelegenheid tot vertrek naar
      elders, zo nodig worden opgenomen in een huis van bewaring, zulks op vertoon van een stuk waaruit de door de
      officier van justitie verleende toestemming tot het vervoer blijkt.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel52
  - number: '52.3'
    text: |-
      De kosten verbonden aan het vervoer en de detentie worden in rekening gebracht bij de uitvaardigende justitiële
      autoriteit.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel52
  - number: '53.1'
    text: |-
      Aan een verzoek van de uitvaardigende justitiële autoriteit om een opgeëiste persoon die op basis van een door hem
      afgegeven Europees aanhoudingsbevel is aangehouden voorafgaand aan diens overlevering te horen, geeft de officier
      van justitie zo veel mogelijk gevolg.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel53
  - number: '53.2'
    text: |-
      Op het verhoor zijn de [artikelen 5.1.8][ref1] en [5.1.9 van het Wetboek van Strafvordering][ref2] en artikel 4,
      eerste tot en met derde lid, van de EU-rechtshulpovereenkomst 2000 van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel5
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '5'
  - number: '54.1'
    text: |-
      De officier van justitie kan op verzoek van de uitvaardigende justitiële autoriteit toestaan dat een opgeëiste
      persoon die op basis van een Europees aanhoudingsbevel is aangehouden, voorafgaand aan de beslissing over de
      overlevering, tijdelijk ter beschikking wordt gesteld van de uitvaardigende justitiële autoriteit voor het afleggen
      van een verklaring.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel54
  - number: '54.2'
    text: De instemming van de opgeëiste persoon is daartoe vereist.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel54
  - number: '54.3'
    text: |-
      De officier van justitie staat de tijdelijke terbeschikkingstelling niet toe, indien de opgeëiste persoon daardoor
      niet aanwezig zou kunnen zijn op het door de rechtbank, overeenkomstig [artikel 24, eerste lid][ref1], bepaalde
      tijdstip waarop de opgeëiste persoon zal worden gehoord.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel24
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0016664
        artikel: '24'
        hoofdstuk: II
        paragraaf: C
        afdeling: '2'
  - number: '54.4'
    text: |-
      De officier van justitie bepaalt daartoe in overleg met de uitvaardigende justitiële autoriteit de duur van de
      terbeschikkingstelling en de voorwaarden waaronder de terbeschikkingstelling plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel54
  - number: '55'
    text: |-
      Elke rechter-commissaris kan de uitvoerende justitiële autoriteit verzoeken voorwerpen, aangetroffen
      in het bezit van degene wiens overlevering hij op basis van een signalering als bedoeld in
      [artikel 4, eerste en tweede lid][ref1] of van een Europees aanhoudingsbevel heeft gevraagd, in beslag te nemen en
      aan hem over te dragen.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel4
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0016664
        artikel: '4'
        hoofdstuk: I
        afdeling: '2'
  - number: '56.1'
    text: |-
      De rechter-commissaris die een Europees aanhoudingsbevel heeft uitgevaardigd of de officier van justitie die
      een Europees aanhoudingsbevel of uitleveringsverzoek in behandeling heeft genomen, zendt een verzoek om doorvoer
      van een opgeëiste persoon aan de bevoegde autoriteit van de lidstaat van de Europese Unie over wiens grondgebied
      betrokkene moet worden vervoerd.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel56
  - number: '56.2'
    text: 'Een verzoek om doorvoer dient de volgende gegevens te bevatten:'
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel56
  - number: 56.2.a
    text: |-
      de identiteit en de nationaliteit van de persoon tegen wie het Europees aanhoudingsbevel is afgegeven of ten
      aanzien van wie een uitleveringsverzoek is gedaan;
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel56
  - number: 56.2.b
    text: het bestaan van een Europees aanhoudingsbevel of van een uitleveringsverzoek aan een derde staat;
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel56
  - number: 56.2.c
    text: de aard en wettelijke kwalificatie van het strafbare feit;
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel56
  - number: 56.2.d
    text: een beschrijving van de omstandigheden waaronder het strafbare feit is begaan, met inbegrip van tijd en plaats.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel56
  - number: '56.3'
    text: |-
      Op verzoek van de bevoegde autoriteit van de lidstaat over wiens grondgebied de doorvoer plaatsvindt, worden de
      kosten van de doorvoer door de rechter-commissaris of de officier van justitie vergoed.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel56
  - number: '57'
    text: |-
      De rechter-commissaris kan de uitvoerende justitiële autoriteit verzoeken om de persoon die op basis van een door
      hem afgegeven Europees aanhoudingsbevel is aangehouden, voorafgaand aan de beslissing over diens overlevering:
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel57
  - number: 57.a
    text: te horen in zijn aanwezigheid dan wel in de aanwezigheid van een door hem aangewezen vertegenwoordiger;
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel57
  - number: 57.b
    text: tijdelijk over te brengen naar Nederland.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel57
  - number: '58.1'
    text: |-
      In de gevallen bedoeld in [artikel 57, onder b][ref1], bepaalt de rechter-commissaris die het Europees
      aanhoudingsbevel heeft uitgevaardigd in overleg met de uitvoerende justitiële autoriteit de duur van de
      terbeschikkingstelling en de voorwaarden waaronder de terbeschikkingstelling plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel57
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0016664
        artikel: '57'
        hoofdstuk: IV
        afdeling: '2'
  - number: '58.2'
    text: |-
      Gedurende zijn verblijf hier te lande wordt de tijdelijk ter beschikking gestelde persoon op bevel van de officier
      van justitie in verzekering gesteld. De [artikelen 61][ref1] en [64, eerste lid][ref2], zijn, voor zoveel nodig,
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0016664#Artikel64
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0016664
        artikel: '61'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0016664
        artikel: '64'
        hoofdstuk: V
  - number: '59'
    text: |-
      Krachtens deze wet gegeven bevelen tot inverzekeringstelling of bewaring, dan wel tot verlenging van een termijn
      van vrijheidsbeneming, worden gedagtekend en ondertekend. De grond voor uitvaardiging wordt in het bevel vermeld.
      Aan degene op wie het bevel betrekking heeft, wordt onverwijld een afschrift daarvan uitgereikt.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel59
  - number: '60.1'
    text: De bevelen tot vrijheidsbeneming, gegeven krachtens deze wet, zijn dadelijk uitvoerbaar.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel60
  - number: '60.2'
    text: |-
      Bevoegd tot het ten uitvoer leggen van Europese aanhoudingsbevelen, Nederlandse bevelen tot aanhouding, voorlopige
      aanhouding of gevangenneming zijn de in [artikel 141 van het Wetboek van Strafvordering][ref1] bedoelde ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '60.3'
    text: |-
      Op de tenuitvoerlegging van een Europees aanhoudingsbevel, de in het eerste lid bedoelde bevelen tot
      vrijheidsbeneming en de last daartoe zijn de [artikelen 6:1:6][ref1], [6:1:7][ref2], [6:1:9][ref3], [6:1:15][ref4]
      en [6:2:1 van het Wetboek van Strafvordering][ref5] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0001903#Artikel6
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0001903
        artikel: '6'
      - id: ref4
        bwb_id: BWBR0001903
        artikel: '6'
      - id: ref5
        bwb_id: BWBR0001903
        artikel: '6'
  - number: '61'
    text: |-
      Personen die krachtens deze wet in verzekering of in bewaring zijn gesteld, of wier gevangenneming of
      gevangenhouding is bevolen, worden behandeld als verdachten die krachtens het [Wetboek van Strafvordering][ref1]
      aan een overeenkomstige maatregel zijn onderworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0001903
  - number: '62'
    text: |-
      [Artikel 490, eerste lid, eerste volzin en derde lid, van het Wetboek van Strafvordering][ref1] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel490
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '490'
  - number: '63'
    text: |-
      Op de bevelen tot bewaring en gevangenhouding, krachtens deze wet gegeven, is
      [artikel 66a van het Wetboek van Strafvordering][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel66a
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 66a
  - number: '64.1'
    text: |-
      In gevallen waarin krachtens deze wet een beslissing omtrent de vrijheidsbeneming kan of moet worden genomen,
      kan worden bevolen dat die vrijheidsbeneming voorwaardelijk wordt opgeschort of geschorst tot het moment van
      de uitspraak van de rechtbank waarbij de overlevering wordt toegestaan. De te stellen voorwaarden mogen alleen
      strekken ter voorkoming van vlucht.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel64
  - number: '64.2'
    text: |-
      Op bevelen krachtens het eerste lid gegeven door de rechtbank, dan wel door de rechter-
      commissaris, zijn de [artikelen 80, met uitzondering van het tweede lid][ref1], en
      [81 tot en met 88 van het Wetboek van Strafvordering][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel80
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel81
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '80'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '81'
  - number: '64.3'
    text: |-
      De officier van justitie stelt de uitvaardigende justitiële autoriteit onverwijld in kennis van een bevel van de
      rechtbank, respectievelijk, de rechter-commissaris als bedoeld in het eerste lid, en van de daaraan ten grondslag
      liggende redenen.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel64
  - number: '65'
    text: |-
      Op bevelen tot beëindiging van vrijheidsbeneming, krachtens deze wet gegeven, en op de tenuitvoerlegging van
      zodanige bevelen zijn de [artikelen 73][ref1], [79][ref2], [6:2:5 van het Wetboek van Strafvordering][ref3] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel73
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel79
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel6
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '73'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '79'
      - id: ref3
        bwb_id: BWBR0001903
        artikel: '6'
  - number: '66'
    text: |-
      De termijnen, genoemd in de [artikelen 19, onder b][ref1], [22][ref2], en [37, eerste en tweede lid][ref3], lopen
      niet gedurende de tijd dat de betrokkene zich aan de verdere tenuitvoerlegging van de in die artikelen bedoelde
      bevelen heeft onttrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0016664#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0016664#Artikel37
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0016664
        artikel: '19'
        hoofdstuk: II
        paragraaf: A
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0016664
        artikel: '22'
        hoofdstuk: II
        paragraaf: C
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0016664
        artikel: '37'
        hoofdstuk: II
        paragraaf: D
        afdeling: '2'
  - number: 66a
    text: |-
      Waar in deze wet de bevoegdheid wordt gegeven tot het horen van personen, is
      [artikel 131a van het Wetboek van Strafvordering][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel131a
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel66a
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 131a
  - number: '67.1'
    text: |-
      In gevallen waarin de overlevering is geweigerd, kan de rechtbank, op verzoek van de opgeëiste persoon,
      hem een vergoeding ten laste van de Staat toekennen voor de schade die hij heeft geleden ten gevolge
      van vrijheidsbeneming, bevolen krachtens deze wet. Onder schade is begrepen het nadeel dat niet in
      vermogensschade bestaat. De [artikelen 533, derde, vierde en zesde lid][ref1], [534][ref2], [535][ref3] en
      [536 van het Wetboek van Strafvordering][ref4] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel533
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel534
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel535
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel536
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '533'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '534'
      - id: ref3
        bwb_id: BWBR0001903
        artikel: '535'
      - id: ref4
        bwb_id: BWBR0001903
        artikel: '536'
  - number: '67.2'
    text: |-
      In gevallen als bedoeld in het eerste lid vinden de [artikelen 529][ref1] en
      [530 van het Wetboek van Strafvordering][ref2] overeenkomstige toepassing op vergoeding van kosten en schaden
      voor de opgeëiste persoon of diens erfgenamen. In de plaats van het in die artikelen bedoelde gerecht treedt de
      rechtbank.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel529
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel530
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '529'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '530'
  - number: '68'
    text: |-
      Op betekeningen, kennisgevingen en oproepingen, gedaan krachtens deze wet, zijn de
      [artikelen 36b tot en met 36e][ref1], [36g][ref2], [36h][ref3] en [36n van het Wetboek van Strafvordering][ref4]
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel36b
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel36g
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel36h
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel36n
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 36b
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 36g
      - id: ref3
        bwb_id: BWBR0001903
        artikel: 36h
      - id: ref4
        bwb_id: BWBR0001903
        artikel: 36n
  - number: '69'
    text: 'De bepalingen van deze wet zijn niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel69
  - number: 69.a
    text: overlevering van gedeserteerde schepelingen aan autoriteiten van de staat waartoe zij behoren;
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel69
  - number: 69.b
    text: |-
      overlevering van leden van een vreemde krijgsmacht en van personen die met hen zijn gelijkgesteld, aan de bevoegde
      militaire autoriteiten, voor zover die overlevering geschiedt krachtens een overeenkomst met een of meer staten
      waarmee Nederland bondgenootschappelijke betrekkingen onderhoudt.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel69
  - number: '70'
    text: 'De officier van justitie draagt zorg voor een halfjaarlijkse rapportage aan Onze Minister over:'
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel70
  - number: 70.a
    text: het aantal Europese aanhoudingsbevelen dat is ontvangen en in behandeling is genomen;
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel70
  - number: 70.b
    text: het aantal malen dat de verkorte procedure is toegepast;
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel70
  - number: 70.c
    text: het aantal malen dat verhoor door de rechtbank heeft plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel70
  - number: 70.d
    text: het aantal malen dat de rechtbank de overlevering heeft toegestaan en geweigerd;
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel70
  - number: 70.e
    text: de gemiddelde duur van de procedures, bedoeld onder b en c.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel70
  - number: '73'
    text: |-
      Onze Minister zendt binnen drie jaren na inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de
      toepassing van deze wet op de overlevering door Nederland, in het bijzonder over de effecten van de behandeling van
      overleveringsverzoeken in één instantie.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel73
  - number: '74.1'
    text: |-
      Deze wet treedt in de relatie met de lidstaten van de Europese Unie in de plaats van de [Uitleveringswet][ref1],
      met uitzondering van de [artikelen 50a][ref2] en [51 van die wet][ref3], en van de in de relatie tussen Nederland
      en de lidstaten van de Europese Unie geldende verdragen inzake de uitlevering, te weten:


      [ref1]: https://wetten.overheid.nl/BWBR0002559
      [ref2]: https://wetten.overheid.nl/BWBR0002559#Artikel50a
      [ref3]: https://wetten.overheid.nl/BWBR0002559#Artikel51
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0002559
      - id: ref2
        bwb_id: BWBR0002559
        artikel: 50a
      - id: ref3
        bwb_id: BWBR0002559
        artikel: '51'
  - number: 74.1.a
    text: |-
      het op 13 december 1957 te Parijs tot stand gekomen Europees Verdrag betreffende uitlevering (Trb. 1965, 9), het
      op 15 oktober 1975 te Straatsburg tot stand gekomen Aanvullend Protocol bij dit Verdrag (Trb. 1979, 119), het op
      17 maart 1978 te Straatsburg tot stand gekomen Tweede Aanvullend Protocol bij dit Verdrag (Trb. 1979, 120) en, voor
      zover het op uitlevering betrekking heeft, het op 27 januari 1977 te Straatsburg tot stand gekomen Europees Verdrag
      tot bestrijding van terrorisme (Trb. 1985, 66);
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel74
  - number: 74.1.b
    text: |-
      de op 30 augustus 1979 te Wittem tot stand gekomen Overeenkomst tussen het koninkrijk der Nederlanden en de
      Bondsrepubliek Duitsland betreffende de aanvulling en het vergemakkelijken van de toepassing van het Europees
      Verdrag betreffende de uitlevering van 13 december 1957 (Trb. 1979, nr. 142);
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel74
  - number: 74.1.c
    text: |-
      afdeling I en voor zover van toepassing afdeling III van het op 27 juni 1962 te Brussel tot stand gekomen Verdrag
      aangaande de uitlevering en de rechtshulp in strafzaken tussen het Koninkrijk België, het Groothertogdom Luxemburg
      en het Koninkrijk der Nederlanden, zoals gewijzigd bij het op 11 mei 1974 te Brussel tot stand gekomen protocol
      (Trb. 1962, 97, en 1974, 11);
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel74
  - number: 74.1.d
    text: hoofdstuk III, afdeling 4, van de Uitvoeringsovereenkomst van Schengen;
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel74
  - number: 74.1.e
    text: |-
      de Overeenkomst tussen de lidstaten van de Europese Gemeenschappen betreffende de vereenvoudiging en de
      modernisering van de wijze van toezending van uitleveringsverzoeken van 26 mei 1989 (Trb. 1990, 97);
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel74
  - number: 74.1.f
    text: |-
      de op 10 maart 1995 te Brussel tot stand gekomen Overeenkomst opgesteld op grond van artikel K.3 van het Verdrag
      betreffende de Europese Unie aangaande de verkorte procedure tot uitlevering tussen de Lid-Staten van de Europese
      Unie (Trb. 1995, 10);
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel74
  - number: 74.1.g
    text: |-
      de op 27 september 1996 te Dublin tot stand gekomen Overeenkomst opgesteld op grond van artikel K.3 van het Verdrag
      betreffende de Europese Unie betreffende uitlevering tussen de lidstaten van de Europese Unie (Trb. 1996, 304).
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel74
  - number: '74.2'
    text: |-
      Het eerste lid blijft buiten toepassing in relatie tot een andere lidstaat van de Europese Unie voorzover en
      voorzolang die lidstaat niet de maatregelen heeft getroffen die noodzakelijk zijn om aan het op 13 juni 2003 te
      Brussel totstandgekomen kaderbesluit van de Raad betreffende het Europees aanhoudingsbevel en de procedures van
      overlevering tussen de lidstaten van de Europese Unie (PbEG L 190) te voldoen.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel74
  - number: '74.3'
    text: |-
      Voor zover de Raad van de Europese Unie een besluit neemt dat afwijkt van het eerste of tweede lid, kan daaraan bij
      algemene maatregel van bestuur uitvoering worden gegeven.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel74
  - number: '74.4'
    text: |-
      De [Uitleveringswet][ref1] blijft van toepassing op de behandeling van een verzoek tot uitlevering en op de in
      verband daarmede te nemen beslissingen, in gevallen waarin de stukken betreffende dat verzoek vóór het tijdstip van
      het in werking treden van deze wet zijn ontvangen door Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0002559
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0002559
  - number: '74.5'
    text: |-
      Een opgeëiste persoon die op het tijdstip van het in werking treden van deze wet is gedetineerd ingevolge een bevel
      gegeven krachtens [artikel 14][ref1], [13a][ref2] of [15 van de Uitleveringswet][ref3], wordt, zo het Europees
      aanhoudingsbevel nog niet is ontvangen, beschouwd en behandeld als een persoon die krachtens [artikel 16][ref4],
      [17][ref5] of [18][ref6] van deze wet in bewaring wordt gehouden of in verzekering is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002559#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0002559#Artikel13a
      [ref3]: https://wetten.overheid.nl/BWBR0002559#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0016664#Artikel16
      [ref5]: https://wetten.overheid.nl/BWBR0016664#Artikel17
      [ref6]: https://wetten.overheid.nl/BWBR0016664#Artikel18
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel74
