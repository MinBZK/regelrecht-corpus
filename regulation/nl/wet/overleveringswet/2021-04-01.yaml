---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: overleveringswet
regulatory_layer: WET
publication_date: '2025-05-14'
valid_from: '2021-04-01'
bwb_id: BWBR0016664
url: https://wetten.overheid.nl/BWBR0016664/2021-04-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat de implementatie van het kaderbesluit van de Raad van de Europese Unie
    betreffende het Europees aanhoudingsbevel en de procedures van overlevering tussen de lidstaten van de Europese
    Unie van 13 juni 2002 (2002/584/JBZ), gepubliceerd in het Publicatieblad van de Europese Gemeenschappen L 190 van
    18 juli 2002, noodzaakt tot het stellen van nieuwe regels voor de overlevering van personen tussen lidstaten van de
    Europese Unie en daarmee verbandhoudende andere vormen van rechtshulp;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel1
  - number: 1.a
    text: |-
      overlevering: de terbeschikkingstelling van een persoon door de justitiële autoriteiten van de ene lidstaat
      aan de justitiële autoriteiten van een andere lidstaat van de Europese Unie ten behoeve van hetzij een in die
      andere lidstaat tegen hem gericht strafrechtelijk onderzoek, hetzij de tenuitvoerlegging van een hem opgelegde
      vrijheidsbenemende straf of maatregel;
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel1
  - number: 1.b
    text: |-
      Europees aanhoudingsbevel: de schriftelijk vastgelegde beslissing van een justitiële autoriteit van een lidstaat
      van de Europese Unie strekkende tot de aanhouding en de overlevering van een persoon door de justitiële autoriteit
      van een andere lidstaat;
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel1
  - number: 1.c
    text: |-
      vrijheidsstraffen: door de rechter op te leggen straffen met een vrijheidsbenemend karakter alsmede de door deze
      naast of in plaats van een straf op te leggen maatregelen strekkende tot vrijheidsbeneming;
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel1
  - number: 1.d
    text: |-
      opgeëiste persoon: de persoon op wie een Europees aanhoudingsbevel, een signalering in het Schengen-
      informatiesysteem of via Interpol strekkende tot aanhouding en overlevering betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel1
  - number: 1.e
    text: |-
      officier van justitie: voor zover aldus vermeld, elke officier van justitie, en overigens de officier van justitie
      bij het arrondissementsparket Amsterdam;
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel1
  - number: 1.f
    text: |-
      rechter-commissaris: voor zover aldus vermeld, elke rechter-commissaris belast met de behandeling van strafzaken,
      en overigens, de rechter-commissaris belast met de behandeling van strafzaken in de rechtbank Amsterdam;
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel1
  - number: 1.g
    text: 'rechtbank: de rechtbank Amsterdam;'
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel1
  - number: 1.h
    text: 'Onze Minister: Onze Minister van Justitie;'
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel1
  - number: 1.i
    text: |-
      uitvaardigende justitiële autoriteit: de justitiële autoriteit van een lidstaat van de Europese Unie, krachtens het
      nationale recht bevoegd tot het afgeven van een Europees aanhoudingsbevel;
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel1
  - number: 1.j
    text: 'uitvaardigende lidstaat: de lidstaat van de Europese Unie waar de uitvaardigende justitiële autoriteit werkzaam is;'
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel1
  - number: 1.k
    text: |-
      uitvoerende justitiële autoriteit: de justitiële autoriteit van een lidstaat van de Europese Unie, krachtens
      het nationale recht bevoegd tot het nemen van de beslissing tot overlevering op basis van een Europees
      aanhoudingsbevel;
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel1
  - number: 1.l
    text: 'uitvoerende lidstaat: de lidstaat van de Europese Unie waar de uitvoerende justitiële autoriteit werkzaam is;'
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel1
  - number: 1.m
    text: |-
      Uitvoeringsovereenkomst van Schengen: de Overeenkomst ter uitvoering van het tussen de regeringen van de staten van
      de Benelux Economische Unie, de Bondsrepubliek Duitsland en de Franse Republiek op 14 juni 1985 gesloten Akkoord
      betreffende de geleidelijke afschaffing van de controles aan de gemeenschappelijke grenzen, Schengen, 19 juni 1990
      (Trb. 1985, 101);
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel1
  - number: 1.n
    text: |-
      EU-rechtshulpovereenkomst 2000: de Overeenkomst, door de Raad vastgesteld overeenkomstig artikel 34 van het Verdrag
      betreffende de Europese Unie, betreffende de wederzijdse rechtshulp in strafzaken tussen de Lid-Staten van de
      Europese Unie, Brussel, 29 mei 2000 (Trb. 2000, 96).
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel1
  - number: '2.1'
    text: |-
      Een Europees aanhoudingsbevel kan slechts worden afgegeven wegens feiten die door de wet van de uitvaardigende
      lidstaat strafbaar zijn gesteld en waarop een vrijheidsstraf met een maximum van ten minste twaalf maanden is
      gesteld of indien een straf of maatregel is opgelegd, wanneer deze een duur heeft van ten minste vier maanden.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel2
  - number: '2.2'
    text: |-
      Een Europees aanhoudingsbevel wordt volgens het in [bijlage 2][ref1] bij deze wet opgenomen model opgemaakt en
      dient in elk geval de volgende gegevens te bevatten:


      [ref1]: https://wetten.overheid.nl/BWBR0016664
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0016664
  - number: 2.2.a
    text: de identiteit en de nationaliteit van de gezochte persoon;
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel2
  - number: 2.2.b
    text: |-
      de naam, het adres, het telefoon- en het faxnummer en het elektronische postadres van de uitvaardigende justitiële
      autoriteit;
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel2
  - number: 2.2.c
    text: |-
      de vermelding dat een voor tenuitvoerlegging vatbaar vonnis, een aanhoudingsbevel of een andere voor
      tenuitvoerlegging vatbare gelijkwaardige rechterlijke beslissing bestaat;
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel2
  - number: 2.2.d
    text: |-
      de aard en de wettelijke kwalificatie van het strafbare feit, in het bijzonder rekening houdend met
      [artikel 7, eerste lid, onderdeel a, onder 1°][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel7
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0016664
        artikel: '7'
        hoofdstuk: II
        afdeling: '1'
  - number: 2.2.e
    text: |-
      een beschrijving van de omstandigheden waaronder het strafbare feit is gepleegd, met vermelding van onder meer het
      tijdstip, de plaats en de mate van betrokkenheid van de gezochte persoon bij het strafbare feit;
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel2
  - number: 2.2.f
    text: |-
      de opgelegde straf of maatregel, indien een onherroepelijk vonnis bestaat, of de in de uitvaardigende lidstaat voor
      het betrokken feit geldende strafbedreiging;
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel2
  - number: 2.2.g
    text: indien mogelijk, andere gevolgen van het strafbaar feit.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel2
  - number: '2.3'
    text: |-
      De uitvaardigende justitiële autoriteit van de lidstaat van nationaliteit van een burger van de Unie die gebruik
      heeft gemaakt van het recht op vrij verkeer als bedoeld in artikel 21 van het Verdrag betreffende de werking van
      de Europese Unie en in een andere lidstaat is aangehouden met het oog op uitlevering ter fine van strafvervolging
      aan een derde staat, kan na daarover te zijn geïnformeerd, ter voorkoming van een inbreuk op de artikelen 18 en 21
      van dat Verdrag en met in achtneming van het eerste en tweede lid, een Europees aanhoudingsbevel uitvaardigen voor
      dezelfde feiten als die welke aan het uitleveringsverzoek ten grondslag liggen en voor zover zij naar nationaal
      recht bevoegd is rechtsmacht uit te oefenen ter zake van die feiten.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel2
  - number: '2.4'
    text: |-
      Het Europees aanhoudingsbevel dient te zijn vertaald in de officiële taal of in een van de officiële talen van de
      uitvoerende lidstaat, dan wel in de taal die deze lidstaat in een bij het secretariaat-generaal van de Raad van de
      Europese Unie neergelegde verklaring heeft aangegeven.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel2
  - number: '3.1'
    text: |-
      Het Europees aanhoudingsbevel kan, indien de verblijfplaats van de opgeëiste persoon bekend is, door de
      uitvaardigende justitiële autoriteit rechtstreeks worden toegezonden aan de uitvoerende justitiële autoriteit in de
      lidstaat van verblijf.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel3
  - number: '3.2'
    text: |-
      Rechtstreekse toezending als bedoeld in het eerste lid is niet toegestaan in die gevallen dat een lidstaat voor de
      toezending of de ontvangst van Europese aanhoudingsbevelen een centrale autoriteit heeft aangewezen.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel3
  - number: '3.3'
    text: |-
      De toezending kan plaatsvinden per gewone post, telefax of, mits de mogelijkheid bestaat om de echtheid van de
      herkomst vast te stellen, per elektronische post.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel3
  - number: '4.1'
    text: |-
      De uitvaardigende justitiële autoriteit kan besluiten de opgeëiste persoon te doen signaleren in het Schengen-
      informatiesysteem, overeenkomstig artikel 95 van de Uitvoeringsovereenkomst van Schengen.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel4
  - number: '4.2'
    text: |-
      Met het oog op de opsporing en aanhouding in een lidstaat van de Europese Unie die geen toegang heeft tot het
      Schengen-informatie systeem kan de uitvaardigende justitiële autoriteit eveneens besluiten de opgeëiste persoon te
      signaleren via Interpol.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel4
  - number: '4.3'
    text: |-
      Een signalering, bedoeld in het eerste en tweede lid, dient onmiddellijk nadat de opgeëiste persoon is
      aangetroffen, te worden gevolgd door toezending van het Europees aanhoudingsbevel aan de in [artikel 3][ref1]
      bedoelde autoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel3
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0016664
        artikel: '3'
        hoofdstuk: I
        afdeling: '2'
  - number: '4.4'
    text: |-
      Een signalering, bedoeld in het eerste lid, wordt voor de toepassing van deze wet gelijkgesteld met een Europees
      aanhoudingsbevel, mits daarin alle gegevens, bedoeld in [artikel 2, tweede lid][ref1], zijn opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel2
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0016664
        artikel: '2'
        hoofdstuk: I
        afdeling: '2'
  - number: '5'
    text: |-
      Overlevering geschiedt uitsluitend aan uitvaardigende justitiële autoriteiten van andere lidstaten van de Europese
      Unie en met inachtneming van het bepaalde bij of krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel5
  - number: '6.1'
    text: |-
      Overlevering van een Nederlander kan worden toegestaan voor zover deze is gevraagd ten behoeve van een tegen hem
      gericht strafrechtelijk onderzoek en naar het oordeel van de uitvoerende justitiële autoriteit is gewaarborgd dat,
      zo hij ter zake van de feiten waarvoor de overlevering kan worden toegestaan in de uitvaardigende lidstaat tot een
      onvoorwaardelijke vrijheidsstraf wordt veroordeeld, hij deze straf in Nederland zal mogen ondergaan.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel6
  - number: '6.2'
    text: |-
      De officier van justitie stelt Onze Minister onverwijld in kennis van elke overlevering onder garantie van
      teruglevering als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel6
  - number: '6.3'
    text: |-
      Het eerste lid is eveneens van toepassing op een vreemdeling die tijdens het verhoor door de rechtbank
      aantoont dat hij ten minste vijf jaren ononderbroken rechtmatig in Nederland heeft verbleven als bedoeld in
      [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref1], voor zover hij in Nederland kan
      worden vervolgd voor de feiten welke aan het Europees aanhoudingsbevel ten grondslag liggen en voor zover ten
      aanzien van hem de verwachting bestaat dat hij niet zijn recht van verblijf in Nederland verliest ten gevolge van
      een hem na overlevering opgelegde straf of maatregel. Eventuele bewijsstukken dienen tijdig voorafgaand aan het
      verhoor door de rechtbank te worden overlegd.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 6a.1
    text: |-
      Overlevering van een Nederlander ten behoeve van de tenuitvoerlegging van een bij onherroepelijk vonnis aan hem
      opgelegde vrijheidsstraf kan worden geweigerd, indien de rechtbank van oordeel is dat de tenuitvoerlegging van die
      straf kan worden overgenomen. In geval van een weigering van de overlevering, beveelt de rechtbank, gelijktijdig
      met de weigering, de tenuitvoerlegging van de opgelegde vrijheidsstraf.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel6a
  - number: 6a.2
    text: 'Bij de beoordeling van een verzoek tot overlevering als bedoeld in het eerste lid beoordeelt de rechtbank:'
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel6a
  - number: 6a.2.a
    text: |-
      of er gronden als bedoeld in [artikel 2:13, eerste lid, onderdelen c tot en met i][ref1], en
      __REF001___________________________________________________________________________________________________________
      ____________________ zijn waarop de overname van de tenuitvoerlegging van de vrijheidsstraf geweigerd kan worden;


      [ref1]: https://wetten.overheid.nl/BWBR0031814#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0031814#Artikel2
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0031814
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0031814
        artikel: '2'
  - number: 6a.2.b
    text: |-
      of de ten uitvoer te leggen vrijheidsstraf is opgelegd voor een feit dat ook naar Nederlands recht strafbaar is, en
      zo ja, welk strafbaar feit dit oplevert;
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel6a
  - number: 6a.2.c
    text: |-
      of het derde of vierde lid aanleiding geeft tot een aanpassing van de opgelegde vrijheidsstraf, en zo ja, welke
      aanpassing.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel6a
  - number: 6a.3
    text: |-
      Indien de opgelegde vrijheidsstraf een langere duur heeft dan het voor het desbetreffende feit naar Nederlands
      recht toepasselijke strafmaximum, wordt de duur van de opgelegde vrijheidsstraf tot dat strafmaximum verlaagd.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel6a
  - number: 6a.4
    text: |-
      Indien de aard van de opgelegde vrijheidsstraf onverenigbaar is met het Nederlands recht, wordt de vrijheidsstraf
      gewijzigd in een straf of maatregel waarin het Nederlands recht voorziet en die zoveel mogelijk overeenstemt met de
      in de uitvaardigende lidstaat opgelegde vrijheidsstraf.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel6a
  - number: 6a.5
    text: |-
      De aanpassing op grond van het derde of vierde lid houdt in geen geval een verzwaring van de opgelegde
      vrijheidsstraf in.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel6a
  - number: 6a.6
    text: Onze Minister kan de rechtbank of de officier van justitie desgevraagd adviseren over de overname van de straf.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel6a
  - number: 6a.7
    text: |-
      De officier van justitie stelt Onze Minister onverwijld in kennis van het bevel tot tenuitvoerlegging van de
      opgelegde vrijheidsstraf.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel6a
  - number: 6a.8
    text: |-
      Onze Minister draagt er zorg voor dat de opgelegde vrijheidsstraf overeenkomstig de regels van het
      Nederlands recht en met overeenkomstige toepassing van de [artikelen 2:15, tweede lid][ref1], en
      [2:18 van de Wet wederzijdse erkenning en tenuitvoerlegging vrijheidsbenemende en voorwaardelijke sancties][ref2],
      met inachtneming van het bevel van de rechtbank als bedoeld in het eerste lid, ten uitvoer wordt gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0031814#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0031814#Artikel2
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0031814
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0031814
        artikel: '2'
  - number: 6a.9
    text: |-
      Het eerste tot en met het achtste lid is eveneens van toepassing op een vreemdeling die tijdens het verhoor door de
      rechtbank aantoont dat hij ten minste vijf jaren ononderbroken rechtmatig in Nederland heeft verbleven als bedoeld
      in [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref1], voor zover ten aanzien van hem
      de verwachting bestaat dat hij niet zijn recht van verblijf in Nederland verliest ten gevolge van de opgelegde
      straf of maatregel. Eventuele bewijsstukken dienen tijdig voorafgaand aan het verhoor door de rechtbank te worden
      overlegd.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '7.1'
    text: 'Overlevering kan worden toegestaan ten behoeve van:'
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel7
  - number: 7.1.a
    text: |-
      een door autoriteiten van de uitvaardigende lidstaat ingesteld strafrechtelijk onderzoek ter zake van het vermoeden
      dat de opgeëiste persoon zich naar het oordeel van de uitvaardigende justitiële autoriteit schuldig heeft gemaakt
      aan:
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel7
  - number: 7.1.a.1º
    text: |-
      een naar het recht van de uitvaardigende lidstaat benoemd strafbaar feit dat tevens op de in [bijlage 1][ref1] bij
      deze wet behorende lijst staat vermeld, waarop naar het recht van de uitvaardigende lidstaat een vrijheidsstraf met
      een maximum van ten minste drie jaren is gesteld; of


      [ref1]: https://wetten.overheid.nl/BWBR0016664
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0016664
  - number: 7.1.a.2º
    text: |-
      een ander feit dat zowel naar het recht van de uitvaardigende lidstaat als naar dat van Nederland strafbaar is
      en waarop naar het recht van de uitvaardigende lidstaat een vrijheidsstraf met een maximum van ten minste twaalf
      maanden is gesteld;
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel7
  - number: 7.1.b
    text: |-
      de tenuitvoerlegging van een vrijheidsstraf van vier maanden, of van langere duur, door de opgeëiste persoon op het
      grondgebied van de uitvaardigende lidstaat te ondergaan wegens een feit als onder 1° of 2° bedoeld.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel7
  - number: '7.2'
    text: |-
      De in het eerste lid, onderdeel a, onder 1°, bedoelde lijst kan, wanneer de Raad van de Europese Unie besluit
      tot uitbreiding of wijziging van de daarop vermelde strafbare feiten, bij algemene maatregel van bestuur worden
      herzien. De voordracht voor deze algemene maatregel van bestuur wordt niet eerder gedaan dan vier weken nadat het
      ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel7
  - number: '7.3'
    text: |-
      Voor de toepassing van het eerste lid, onderdeel a, onder 2°, wordt onder een naar Nederlands recht strafbaar feit
      mede verstaan een feit waardoor inbreuk is gemaakt op de rechtsorde van de verzoekende staat, terwijl krachtens de
      Nederlandse wet eenzelfde inbreuk op de Nederlandse rechtsorde strafbaar is.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel7
  - number: '7.4'
    text: |-
      Indien het Europees aanhoudingsbevel betrekking heeft op verscheidene afzonderlijke feiten die alle naar het recht
      van de uitvaardigende en de uitvoerende lidstaat strafbaar zijn en waarop naar het recht van de uitvaardigende
      lidstaat een vrijheidsstraf is gesteld, maar waarvan sommige niet voldoen aan de voorwaarde met betrekking tot de
      hoogte van de straf, bedoeld in het eerste lid, onderdeel a, onder 2°, of onderdeel b, kan de overlevering eveneens
      voor de laatste feiten worden toegestaan.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel7
  - number: '7.5'
    text: |-
      [Artikel 51a van de Uitleveringswet][ref1] is van overeenkomstige toepassing op overlevering tussen de lidstaten
      van de Europese Unie.


      [ref1]: https://wetten.overheid.nl/BWBR0002559#Artikel51a
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002559
        artikel: 51a
  - number: '8'
    text: |-
      Met vrijheidsstraffen van langere duur dan twaalf maanden worden voor de toepassing van deze wet gelijkgesteld:
      levenslange vrijheidsstraffen en vrijheidsstraffen van onbepaalde duur.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel8
  - number: '9.1'
    text: 'Overlevering van de opgeëiste persoon kan worden geweigerd voor een feit ter zake waarvan:'
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel9
  - number: 9.1.a
    text: tegen hem een strafvervolging in Nederland gaande is;
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel9
  - number: 9.1.b
    text: |-
      hij in Nederland is vervolgd maar hernieuwde vervolging is
      uitgesloten op grond van [artikel 255, eerste of tweede lid][ref1], of
      [artikel 255a, eerste of tweede lid, van het Wetboek van Strafvordering][ref2], dan wel in Nederland het recht tot
      strafvordering is vervallen omdat hij aan voorwaarden heeft voldaan die door de officier van justitie voor aanvang
      van de terechtzitting ter voorkoming van de strafvervolging zijn gesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel255
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel255a
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '255'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 255a
  - number: 9.1.c
    text: |-
      hij naar het recht van een andere lidstaat niet meer kan worden vervolgd, ten gevolge van een in die lidstaat ter
      zake van hetzelfde feit genomen onherroepelijke beslissing;
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel9
  - number: 9.1.d
    text: |-
      te zijnen aanzien een overeenkomstig het tweede lid, onder a, onherroepelijke beslissing door een rechter van een
      derde land is genomen;
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel9
  - number: 9.1.e
    text: |-
      hij bij rechterlijk gewijsde van een rechter in een derde land is veroordeeld, in gevallen als bedoeld in het
      tweede lid, onder b, sub 1 tot en met 4;
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel9
  - number: 9.1.f
    text: |-
      naar Nederlands recht rechtsmacht kon worden uitgeoefend, maar wegens verjaring geen vervolging, of, zo de
      overlevering is gevraagd ten behoeve van de tenuitvoerlegging van een straf of maatregel, geen bestraffing meer
      kan plaatshebben.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel9
  - number: '9.2'
    text: 'De overlevering van de opgeëiste persoon wordt niet toegestaan voor een feit ter zake waarvan:'
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel9
  - number: 9.2.a
    text: |-
      hij bij gewijsde van de Nederlandse rechter is vrijgesproken of ontslagen van rechtsvervolging, dan wel te zijnen
      aanzien een overeenkomstige onherroepelijke beslissing door een rechter van een andere lidstaat van de Europese
      Unie is genomen;
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel9
  - number: 9.2.b
    text: |-
      hij bij rechterlijke gewijsde van de Nederlandse rechter dan wel van een rechter in een andere lidstaat van de
      Europese Unie is veroordeeld, in gevallen waarin:
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel9
  - number: 9.2.b.1°
    text: de opgelegde straf of maatregel reeds is ondergaan;
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel9
  - number: 9.2.b.2°
    text: de opgelegde straf of maatregel niet meer voor tenuitvoerlegging of verdere tenuitvoerlegging vatbaar is;
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel9
  - number: 9.2.b.3°
    text: de veroordeling een schuldigverklaring zonder oplegging van straf of maatregel inhoudt;
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel9
  - number: 9.2.b.4°
    text: de opgelegde straf of maatregel in Nederland wordt ondergaan.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel9
  - number: '9.3'
    text: |-
      Onderdeel a van het eerste lid lijdt uitzondering in gevallen waarin Onze Minister na advies van het openbaar
      ministerie en voorafgaand aan de beslissing tot overlevering opdracht heeft gegeven de vervolging te staken.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel9
  - number: '9.4'
    text: |-
      Onderdeel b van het eerste lid lijdt uitzondering in gevallen waarin de vervolging in
      Nederland is gestaakt, hetzij omdat de Nederlandse strafwet op grond van een van de
      [artikelen 2 tot en met 8d van het Wetboek van Strafrecht][ref1] niet van toepassing bleek te zijn, hetzij omdat
      aan berechting in het buitenland de voorkeur werd gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel2
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '2'
  - number: '10'
    text: |-
      Overlevering wordt niet toegestaan indien de opgeëiste persoon ten tijde van het begaan van het strafbare feit de
      leeftijd van twaalf jaren nog niet heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel10
  - number: '11.1'
    text: |-
      Aan een Europees aanhoudingsbevel wordt geen gevolg gegeven in gevallen, waarin naar het oordeel van de rechtbank
      zwaarwegende en op feiten berustende gronden bestaan dat de opgeëiste persoon na overlevering een reëel gevaar
      loopt dat zijn door het Handvest van de grondrechten van de Europese Unie gewaarborgde grondrechten zullen worden
      geschonden.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel11
  - number: '11.2'
    text: |-
      Indien er een mogelijkheid bestaat dat bij wijziging van de omstandigheden het reële gevaar van de in het eerste
      lid bedoelde schending alsnog kan worden uitgesloten, dient de rechtbank de beslissing over de overlevering aan
      te houden.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel11
  - number: '11.3'
    text: |-
      De uitvaardigende autoriteit wordt onder opgave van redenen van die aanhouding in kennis gesteld en de rechtbank
      gaat gedurende de aanhouding na of er wijziging in de omstandigheden optreedt.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel11
  - number: '11.4'
    text: |-
      Indien na toepassing van het derde lid niet binnen een redelijke termijn het reële gevaar van de in
      het eerste lid bedoelde schending kan worden uitgesloten, doet de rechtbank uitspraak als bedoeld in
      [artikel 22, zesde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel22
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0016664
        artikel: '22'
        hoofdstuk: II
        paragraaf: C
        afdeling: '2'
  - number: '12'
    text: |-
      Overlevering kan worden geweigerd indien het Europees aanhoudingsbevel strekt tot de tenuitvoerlegging van
      een vrijheidsbenemende straf of maatregel terwijl de verdachte niet in persoon is verschenen bij het proces
      dat tot de beslissing heeft geleid, tenzij in het Europees aanhoudingsbevel is vermeld dat overeenkomstig de
      procedurevoorschriften van de uitvaardigende lidstaat:
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel12
  - number: 12.a
    text: |-
      de verdachte tijdig en in persoon is gedagvaard en daarbij op de hoogte is gebracht van de datum en plaats van het
      proces dat tot de beslissing heeft geleid of anderszins daadwerkelijk officieel in kennis is gesteld van de datum
      en de plaats van het proces, zodat op ondubbelzinnige wijze vaststaat dat hij op de hoogte was van het voorgenomen
      proces en ervan in kennis is gesteld dat een beslissing kan worden genomen wanneer hij niet op het proces
      verschijnt; of
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel12
  - number: 12.b
    text: |-
      de verdachte op de hoogte was van het voorgenomen proces en een door hem gekozen of een hem van overheidswege
      toegewezen advocaat heeft gemachtigd zijn verdediging op het proces te voeren en dat die advocaat tijdens het
      proces zijn verdediging heeft gevoerd; of
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel12
  - number: 12.c
    text: |-
      de verdachte nadat de beslissing aan hem was betekend en hij uitdrukkelijk was geïnformeerd over zijn recht op een
      verzetprocedure of een procedure in hoger beroep, waarbij hij het recht heeft aanwezig te zijn en tijdens welke de
      zaak opnieuw ten gronde wordt behandeld en nieuw bewijsmateriaal wordt toegelaten, die kan leiden tot herziening
      van de oorspronkelijke beslissing:
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel12
  - number: 12.c.1°
    text: uitdrukkelijk te kennen heeft gegeven dat hij de beslissing niet betwist; of
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel12
  - number: 12.c.2°
    text: niet binnen de voorgeschreven termijn verzet of hoger beroep heeft aangetekend; of
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel12
  - number: 12.d
    text: 'de beslissing niet in persoon aan de verdachte is betekend, maar:'
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel12
  - number: 12.d.1°
    text: |-
      hem na zijn overlevering onverwijld in persoon zal worden betekend en hij uitdrukkelijk zal worden geïnformeerd
      over zijn recht op een verzetprocedure of een procedure in hoger beroep, waarbij hij het recht heeft aanwezig te
      zijn, waarop de zaak opnieuw ten gronde wordt behandeld en nieuw bewijsmateriaal wordt toegelaten, die kan leiden
      tot herziening van de oorspronkelijke beslissing en
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel12
  - number: 12.d.2°
    text: |-
      hij wordt geïnformeerd over de termijn waarbinnen hij verzet of hoger beroep dient aan te tekenen, als vermeld in
      het desbetreffende Europees aanhoudingsbevel.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel12
  - number: 12a.1
    text: |-
      In de gevallen als bedoeld in [artikel 12, onderdeel d][ref1], kan de persoon tegen wie het Europees
      aanhoudingsbevel is uitgevaardigd en die nog niet officieel van de tegen hem ingestelde strafprocedure in kennis is
      gesteld, hetzij rechtstreeks hetzij door tussenkomst van de officier van justitie aan de uitvaardigende justitiële
      autoriteit om een afschrift van het vonnis dat ten grondslag ligt aan het Europees aanhoudingsbevel, verzoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel12
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0016664
        artikel: '12'
        hoofdstuk: II
        afdeling: '1'
  - number: 12a.2
    text: |-
      Nadat de officier van justitie een afschrift van het vonnis van de uitvaardigende justitiële autoriteit heeft
      ontvangen, verstrekt hij dit onverwijld aan de persoon tegen wie het Europees aanhoudingsbevel is uitgevaardigd.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel12a
  - number: 12a.3
    text: |-
      Een verzoek als bedoeld in het eerste lid en het tijdstip van verstrekking van het afschrift van het vonnis kan
      geen afbreuk doen aan de behandeling van het Europees aanhoudingsbevel binnen de in [artikel 22][ref1] gestelde
      termijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel22
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0016664
        artikel: '22'
        hoofdstuk: II
        paragraaf: C
        afdeling: '2'
  - number: '13.1'
    text: 'Overlevering kan worden geweigerd indien het Europees aanhoudingsbevel betrekking heeft op een strafbaar feit dat:'
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel13
  - number: 13.1.a
    text: |-
      geacht wordt geheel of gedeeltelijk op Nederlands grondgebied of buiten Nederland aan boord van een Nederlands
      vaartuig of luchtvaartuig te zijn gepleegd; of
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel13
  - number: 13.1.b
    text: |-
      buiten het grondgebied van de uitvaardigende staat is gepleegd, terwijl naar Nederlands recht geen vervolging zou
      kunnen worden ingesteld indien het feit buiten Nederland zou zijn gepleegd.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel13
  - number: '14.1'
    text: |-
      Overlevering wordt niet toegestaan dan onder het algemene beding, dat de opgeëiste persoon niet zal worden
      vervolgd, gestraft of op enige andere wijze in zijn persoonlijke vrijheid beperkt, ter zake van feiten die vóór het
      tijdstip van zijn overlevering zijn begaan en waarvoor hij niet is overgeleverd, tenzij:
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel14
  - number: 14.1.a
    text: |-
      de opgeëiste persoon, hoewel hij daartoe de mogelijkheid had, niet binnen 45 dagen na zijn definitieve
      invrijheidstelling het grondgebied van de lidstaat waaraan hij is overgeleverd, heeft verlaten of indien hij na dit
      gebied verlaten te hebben daarnaar is teruggekeerd;
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel14
  - number: 14.1.b
    text: de feiten niet zijn bedreigd met een vrijheidsstraf;
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel14
  - number: 14.1.c
    text: de strafvervolging niet leidt tot de toepassing van enige maatregel die de vrijheid beperkt;
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel14
  - number: 14.1.d
    text: |-
      het gaat om de tenuitvoerlegging van een andere dan een vrijheidsstraf, met inbegrip van een vervangende straf
      waaronder vervangende hechtenis;
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel14
  - number: 14.1.e
    text: de opgeëiste persoon na zijn overlevering uitdrukkelijk met een vervolging heeft ingestemd; of
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel14
  - number: 14.1.f
    text: daartoe voorafgaand toestemming aan de rechtbank wordt gevraagd en deze is verkregen.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel14
  - number: '14.2'
    text: |-
      Overlevering wordt voorts niet toegestaan dan onder het algemene beding, dat de opgeëiste persoon niet ter
      beschikking zal worden gesteld van de autoriteiten van een andere lidstaat van de Europese Unie, ter zake van
      feiten die vóór het tijdstip van zijn overlevering zijn begaan, tenzij:
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel14
  - number: 14.2.a
    text: |-
      de opgeëiste persoon, hoewel hij daartoe de mogelijkheid had, niet binnen 45 dagen na zijn definitieve
      invrijheidstelling het grondgebied van de lidstaat waaraan hij is overgeleverd, heeft verlaten of indien hij na dit
      gebied verlaten te hebben daarnaar is teruggekeerd;
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel14
  - number: 14.2.b
    text: de opgeëiste persoon na zijn overlevering daarmee uitdrukkelijk heeft ingestemd; of
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel14
  - number: 14.2.c
    text: daartoe voorafgaand toestemming wordt gevraagd aan de rechtbank en deze is verkregen.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel14
  - number: '14.3'
    text: |-
      De officier van justitie vordert uiterlijk op de derde dag na ontvangst van een verzoek van de uitvaardigende
      justitiële autoriteit om de in het eerste lid onder f, of het tweede lid, onder c, bedoelde toestemming,
      schriftelijk dat de rechtbank het verzoek in behandeling zal nemen. De officier van justitie legt daartoe het
      verzoek met bijbehorende vertaling aan de rechtbank over. De rechtbank geeft de in het eerste lid, onder f, of
      het tweede lid, onder c, bedoelde toestemming ten aanzien van feiten waarvoor krachtens deze wet overlevering
      had kunnen worden toegestaan. De beslissing op een vordering wordt in elk geval binnen zevenentwintig dagen na de
      ontvangst ervan genomen. De officier van justitie brengt de beslissing van de rechtbank onverwijld ter kennis van
      de uitvaardigende justitiële autoriteit.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel14
  - number: '14.4'
    text: |-
      Overlevering wordt voorts niet toegestaan dan onder het algemene beding, dat de opgeëiste persoon niet ter
      beschikking zal worden gesteld van de autoriteiten van een derde staat, ter zake van feiten die vóór het tijdstip
      van zijn overlevering zijn begaan, tenzij daartoe voorafgaand toestemming wordt verzocht aan Onze Minister en deze
      is verkregen.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel14
  - number: '15'
    text: |-
      Op basis van een signalering als bedoeld in [artikel 4, eerste en tweede lid][ref1], kan de voorlopige aanhouding
      worden bevolen van een zich in Nederland bevindende opgeëiste persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel4
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0016664
        artikel: '4'
        hoofdstuk: I
        afdeling: '2'
  - number: '16'
    text: |-
      Een vreemdeling die op grond van [artikel 54, vijfde lid, van het Wetboek van Strafvordering][ref1] is aangehouden,
      kan op bevel van de officier of hulpofficier van justitie in het arrondissement waar hij werd aangehouden worden
      opgehouden, indien gegronde redenen bestaan voor de verwachting dat te zijnen aanzien onverwijld een signalering
      als bedoeld in [artikel 4, eerste en tweede lid][ref2], zal worden gedaan dan wel een Europees aanhoudingsbevel
      zal worden ontvangen. [Artikel 56a, eerste tot en met derde lid, van dat wetboek][ref3] is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0016664#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel56a
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '54'
      - id: ref2
        bwb_id: BWBR0016664
        artikel: '4'
        hoofdstuk: I
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0001903
        artikel: 56a
  - number: '17.1'
    text: |-
      Elke officier van justitie of hulpofficier van justitie is bevoegd de voorlopige aanhouding van een opgeëiste
      persoon overeenkomstig [artikel 15][ref1] te bevelen.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel15
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0016664
        artikel: '15'
        hoofdstuk: II
        paragraaf: A
        afdeling: '2'
  - number: '17.2'
    text: |-
      Kan het optreden van de officier van justitie of de hulpofficier, bedoeld in het eerste lid, niet worden afgewacht,
      dan is elke opsporingsambtenaar bevoegd de opgeëiste persoon aan te houden onder de verplichting zorg te dragen dat
      hij zo spoedig mogelijk wordt voorgeleid voor de officier van justitie of de hulpofficier van justitie.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel17
  - number: '17.3'
    text: 'Nadat de opgeëiste persoon is aangehouden, wordt hem onverwijld schriftelijk mededeling gedaan van:'
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel17
  - number: 17.3.a
    text: |-
      het recht een afschrift van het Europees aanhoudingsbevel te ontvangen, bedoeld in [artikel 23, derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel23
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0016664
        artikel: '23'
        hoofdstuk: II
        paragraaf: C
        afdeling: '2'
  - number: 17.3.b
    text: |-
      het recht op bijstand van een raadsman, bedoeld in [artikel 43a][ref1], en de mogelijkheid te verzoeken om
      aanwijzing van een advocaat in de uitvaardigende lidstaat, bedoeld in [artikel 21a][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel43a
      [ref2]: https://wetten.overheid.nl/BWBR0016664#Artikel21a
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0016664
        artikel: 43a
        hoofdstuk: II
        paragraaf: F
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0016664
        artikel: 21a
        hoofdstuk: II
        paragraaf: Ba
        afdeling: '2'
  - number: 17.3.c
    text: |-
      het recht op vertolking, bedoeld in [artikel 30][ref1], en het recht op vertaling, bedoeld in
      [artikel 23, derde lid, vierde en vijfde volzin][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0016664#Artikel23
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0016664
        artikel: '30'
        hoofdstuk: II
        paragraaf: C
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0016664
        artikel: '23'
        hoofdstuk: II
        paragraaf: C
        afdeling: '2'
  - number: 17.3.d
    text: |-
      het recht om gehoord te worden, bedoeld in [artikel 24][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel24
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0016664
        artikel: '24'
        hoofdstuk: II
        paragraaf: C
        afdeling: '2'
  - number: 17.3.e
    text: |-
      de in [artikel 27c, derde lid, onder g en h, van het Wetboek van Strafvordering][ref1] bedoelde rechten.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel27c
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 27c
  - number: '17.4'
    text: |-
      Na de opgeëiste persoon te hebben gehoord, kan elke officier van justitie of hulpofficier bevelen dat hij gedurende
      drie dagen, te rekenen vanaf het tijdstip van de voorlopige aanhouding, in verzekering gesteld zal blijven. De
      termijn van inverzekeringstelling kan door de officier van justitie bij het arrondissementsparket te Amsterdam
      éénmaal met drie dagen worden verlengd. Bij zijn verhoor kan de opgeëiste persoon zich door zijn raadsman doen
      bijstaan.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel17
  - number: '17.5'
    text: |-
      Indien de opgeëiste persoon buiten het arrondissement Amsterdam is aangehouden en in verzekering is gesteld, wordt
      hij binnen de termijnen van het vierde lid overgedragen aan de officier van justitie bij het arrondissementsparket
      te Amsterdam.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel17
  - number: '17.6'
    text: |-
      Het vijfde lid kan buiten toepassing blijven indien de opgeëiste persoon tegenover de rechtbank in het rechtsgebied
      waar hij is aangehouden heeft verklaard, in te stemmen met zijn onmiddellijke overlevering, de rechtbank heeft
      beslist dat de opgeëiste persoon ter beschikking zal worden gesteld van de uitvaardigende justitiële autoriteit en
      de feitelijke overlevering kan plaatsvinden binnen de termijnen van het vierde lid.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel17
  - number: '17.7'
    text: |-
      De opgeëiste persoon kan te allen tijde door de officier van justitie bij het arrondissementsparket te Amsterdam in
      vrijheid worden gesteld.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel17
  - number: '18.1'
    text: |-
      De rechter-commissaris kan, op vordering van de officier van justitie bij het arrondissementsparket te Amsterdam,
      de bewaring van de opgeëiste persoon bevelen.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel18
  - number: '18.2'
    text: |-
      Alvorens een bevel ingevolge het eerste lid te geven, hoort de rechter-commissaris zo mogelijk de opgeëiste
      persoon. Bij zijn verhoor kan de opgeëiste persoon zich door zijn raadsman doen bijstaan.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel18
  - number: '19'
    text: |-
      Een opgeëiste persoon wiens bewaring overeenkomstig [artikel 18][ref1] is bevolen, wordt – behoudens de
      mogelijkheid van verdere vrijheidsbeneming uit anderen hoofde – in vrijheid gesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel18
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0016664
        artikel: '18'
        hoofdstuk: II
        paragraaf: A
        afdeling: '2'
  - number: 19.a
    text: |-
      zodra zulks door de rechtbank, de rechter-commissaris of de officier van justitie, ambtshalve of op verzoek van de
      opgeëiste persoon of diens raadsman, wordt gelast;
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel19
  - number: 19.b
    text: zodra de bewaring twintig dagen heeft geduurd en het Europees aanhoudingsbevel nog niet is ontvangen.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel19
  - number: '20.1'
    text: |-
      Een Europees aanhoudingsbevel wordt, zo het niet aan de officier van justitie is toegezonden, onverwijld aan hem
      doorgezonden.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel20
  - number: '20.2'
    text: |-
      Een Europees aanhoudingsbevel kan slechts in behandeling worden genomen, indien het voldoet aan de vereisten
      omschreven in [artikel 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel2
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0016664
        artikel: '2'
        hoofdstuk: I
        afdeling: '2'
  - number: '20.3'
    text: |-
      Indien een Europees aanhoudingsbevel naar het oordeel van de officier van justitie niet voldoet aan de eisen
      omschreven in [artikel 2][ref1] biedt hij de uitvaardigende justitiële autoriteit de gelegenheid tot completering
      of verbetering.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel2
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0016664
        artikel: '2'
        hoofdstuk: I
        afdeling: '2'
  - number: '20.4'
    text: |-
      Indien naar het oordeel van de officier van justitie naast het Europees aanhoudingsbevel aanvullende gegevens
      noodzakelijk zijn, met name in verband met de [artikelen 7 tot en met 9][ref1] en [11 tot en met 13][ref2], stelt
      hij de uitvaardigende justitiële autoriteit in de gelegenheid tot completering of verbetering, rekening houdend met
      de in [artikel 22][ref3] genoemde termijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0016664#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0016664#Artikel22
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0016664
        artikel: '7'
        hoofdstuk: II
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0016664
        artikel: '11'
        hoofdstuk: II
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0016664
        artikel: '22'
        hoofdstuk: II
        paragraaf: C
        afdeling: '2'
  - number: '21.1'
    text: |-
      De opgeëiste persoon kan op basis van een Europees aanhoudingsbevel dat voldoet aan de vereisten omschreven
      in [artikel 2][ref1], zonder verdere formaliteiten worden aangehouden. [Artikel 17, derde lid][ref2], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0016664#Artikel17
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0016664
        artikel: '2'
        hoofdstuk: I
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0016664
        artikel: '17'
        hoofdstuk: II
        paragraaf: A
        afdeling: '2'
  - number: '21.2'
    text: |-
      Het eerste lid blijft buiten toepassing zolang de opgeëiste persoon in Nederland immuniteit geniet van
      strafvervolging en van de tenuitvoerlegging van straffen. De uitvaardigende justitiële autoriteit wordt over het
      bestaan en de aard van de immuniteit onverwijld in kennis gesteld, met het verzoek om bericht zodra de immuniteit
      is opgeheven.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel21
  - number: '21.3'
    text: |-
      Indien de opgeëiste persoon reeds overeenkomstig [artikel 17][ref1] voorlopig werd aangehouden, wordt de
      voorlopige aanhouding omgezet in een aanhouding als bedoeld in het eerste lid, te rekenen vanaf de dag dat het
      aanhoudingsbevel door de officier van justitie overeenkomstig [artikel 20, tweede lid][ref2], in behandeling
      is genomen. De opgeëiste persoon wordt van die omzetting in kennis gesteld, onder vermelding dat de aanhouding
      voortduurt tot het tijdstip waarop de rechtbank over zijn gevangenhouding beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0016664#Artikel20
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0016664
        artikel: '17'
        hoofdstuk: II
        paragraaf: A
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0016664
        artikel: '20'
        hoofdstuk: II
        paragraaf: B
        afdeling: '2'
  - number: '21.4'
    text: |-
      De opgeëiste persoon die overeenkomstig het eerste lid werd aangehouden, wordt binnen vierentwintig uren na zijn
      aanhouding geleid voor de officier van justitie, of bij diens afwezigheid, voor de hulpofficier van justitie in het
      arrondissement waar hij werd aangehouden.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel21
  - number: '21.5'
    text: |-
      Na de opgeëiste persoon te hebben gehoord, kan de officier van justitie of hulpofficier van justitie, bedoeld in
      het vierde lid, bevelen dat deze persoon gedurende drie dagen, te rekenen vanaf het tijdstip van de aanhouding, in
      verzekering gesteld zal blijven. Bij zijn verhoor kan de opgeëiste persoon zich door zijn raadsman doen bijstaan.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel21
  - number: '21.6'
    text: |-
      Indien de opgeëiste persoon buiten het arrondissement Amsterdam is aangehouden en in verzekering is gesteld,
      wordt hij binnen de termijn van inverzekeringstelling overgedragen aan de officier van justitie bij het
      arrondissementsparket Amsterdam.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel21
  - number: '21.7'
    text: |-
      Het zesde lid kan buiten toepassing blijven indien de opgeëiste persoon tegenover de rechtbank in het rechtsgebied
      waar hij is aangehouden heeft verklaard, in te stemmen met zijn onmiddellijke overlevering, de rechtbank heeft
      beslist dat de opgeëiste persoon ter beschikking zal worden gesteld van de uitvaardigende justitiële autoriteit en
      de feitelijke overlevering binnen de termijn van de inverzekeringstelling kan plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel21
  - number: '21.8'
    text: |-
      Na de opgeëiste persoon te hebben gehoord, kan de officier van justitie bij het arrondissementsparket Amsterdam
      bevelen dat deze in verzekering gesteld zal blijven tot het tijdstip waarop de rechtbank over zijn gevangenhouding
      beslist. Bij zijn verhoor kan de opgeëiste persoon zich door zijn raadsman doen bijstaan.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel21
  - number: '21.9'
    text: |-
      Het bevel tot inverzekeringstelling kan te allen tijde zowel door de rechtbank als door de officier van justitie
      bij het arrondissementsparket Amsterdam, ambtshalve of op verzoek van de opgeëiste persoon of diens raadsman,
      worden opgeheven.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel21
  - number: '21.10'
    text: |-
      Indien de opgeëiste persoon minderjarig is en de identiteit en verblijfplaats van de ouders of voogd bekend zijn en
      deze binnen een afzienbare termijn daartoe in de gelegenheid zijn, kan de minderjarige zich tijdens een verhoor als
      bedoeld in het vierde lid laten vergezellen door de ouders, voogd of een vertrouwenspersoon.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel21
  - number: 21a
    text: |-
      De opgeëiste persoon die is aangehouden, kan verzoeken een advocaat in de uitvaardigende lidstaat aan te wijzen
      met het oog op het, door het verstrekken van informatie en advies, verlenen van bijstand aan zijn raadsman in
      Nederland ten behoeve van de procedure voor overlevering in Nederland. De officier van justitie stelt na ontvangst
      van het verzoek de uitvaardigende justitiële autoriteit terstond van het verzoek in kennis; de termijnen voor de
      behandeling van het Europees aanhoudingsbevel gelden onverkort.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel21a
  - number: '22.1'
    text: |-
      De uitspraak, houdende de beslissing over de overlevering dient door de rechtbank te worden gedaan uiterlijk zestig
      dagen na de aanhouding van de opgeëiste persoon, bedoeld in [artikel 21][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel21
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0016664
        artikel: '21'
        hoofdstuk: II
        paragraaf: B
        afdeling: '2'
  - number: '22.2'
    text: |-
      Indien de overlevering mede afhankelijk is van de instemming van de bevoegde autoriteit van een andere lidstaat of
      van een derde staat, begint de in het eerste lid genoemde termijn te lopen vanaf de dag dat de vereiste instemming
      is ontvangen.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel22
  - number: '22.3'
    text: |-
      In specifieke gevallen en onder opgave van redenen aan de uitvaardigende justitiële autoriteit kan de rechtbank de
      termijn van zestig dagen met maximaal dertig dagen verlengen.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel22
  - number: '22.4'
    text: |-
      Indien de rechtbank in uitzonderlijke omstandigheden binnen de in het derde lid bedoelde termijn nog geen uitspraak
      heeft kunnen doen, omdat zij in afwachting is van een uitspraak van het Hof van Justitie van de Europese Unie over
      prejudiciële vragen die relevant is voor haar beslissing, kan de rechtbank de termijn met telkens maximaal zestig
      dagen verlengen, totdat het Hof arrest heeft gewezen en de rechtbank uitspraak doet.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel22
  - number: '22.5'
    text: |-
      Indien de rechtbank in uitzonderlijke omstandigheden binnen de in het derde lid bedoelde termijn nog geen uitspraak
      heeft kunnen doen, omdat zij onderzoek doet naar een reëel gevaar van schending van de grondrechten van de
      opgeëiste persoon zoals bedoeld in het [artikel 11, eerste lid][ref1], kan de rechtbank de termijn met telkens
      maximaal dertig dagen verlengen, totdat het onderzoek is afgerond en de rechtbank uitspraak doet.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel11
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0016664
        artikel: '11'
        hoofdstuk: II
        afdeling: '1'
  - number: '22.6'
    text: |-
      Indien de rechtbank in uitzonderlijke omstandigheden zijn beslissing heeft aangehouden krachtens
      [artikel 11, tweede lid][ref1], kan de rechtbank daarna de termijn met telkens maximaal zestig dagen verlengen,
      totdat de rechtbank uitspraak doet.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel11
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0016664
        artikel: '11'
        hoofdstuk: II
        afdeling: '1'
  - number: '22.7'
    text: |-
      In geval van verlenging van de termijn als bedoeld in het vierde tot en met het zesde lid stelt de officier van
      justitie Eurojust en de uitvaardigende justitiële autoriteit daarvan onverwijld in kennis, onder opgave van de
      redenen voor de vertraging.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel22
  - number: '23.1'
    text: |-
      Indien de officier van justitie reeds aanstonds van oordeel is dat de overlevering niet kan worden toegestaan op
      grond van het voorliggende Europees aanhoudingsbevel, stelt hij de uitvaardigende justitiële autoriteit daarvan
      onmiddellijk in kennis.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel23
  - number: '23.2'
    text: |-
      In alle andere gevallen vordert hij uiterlijk op de derde dag na de ontvangst van het Europees aanhoudingsbevel
      schriftelijk, dat de rechtbank het aanhoudingsbevel in behandeling zal nemen. Hij legt daartoe het Europees
      aanhoudingsbevel met bijbehorende vertaling en, in voorkomend geval, van de uitvaardigende justitiële autoriteit
      ontvangen aanvullende informatie aan de rechtbank over. In voorkomend geval vermeldt hij daarbij dat ten aanzien
      van de opgeëiste persoon een concurrerend uitleveringsverzoek ter fine van strafvervolging is ontvangen en dat
      het Europees aanhoudingsbevel is uitgevaardigd nadat de uitvaardigende justitiële autoriteit overeenkomstig
      [artikel 2, derde lid][ref1], in de gelegenheid is gesteld om een Europees aanhoudingsbevel uit te vaardigen voor
      dezelfde feiten als die welke aan het uitleveringsverzoek ten grondslag liggen.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel2
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0016664
        artikel: '2'
        hoofdstuk: I
        afdeling: '2'
  - number: '23.3'
    text: |-
      Een afschrift van de krachtens het tweede lid vereiste vordering, met als bijlage een kopie van het Europees
      aanhoudingsbevel, de bijbehorende vertaling en, in voorkomend geval, de aanvullende informatie wordt aan de
      opgeëiste persoon betekend. De eerste volzin geldt eveneens in het geval dat de officier van justitie naar
      aanleiding van een naderhand ontvangen ander Europees aanhoudingsbevel zijn vordering heeft aangevuld of
      gewijzigd. Van de ontvangst van aanvullende stukken, die in het dossier worden gevoegd, wordt de opgeëiste
      persoon mededeling gedaan. Indien de opgeëiste persoon de taal waarin het Europees aanhoudingsbevel is gesteld
      of die van de bijbehorende vertaling niet of onvoldoende beheerst, wordt hem een schriftelijke vertaling van ten
      minste de relevante onderdelen van het Europees aanhoudingsbevel in een voor hem begrijpelijke taal verstrekt.
      Als relevante onderdelen worden aangemerkt de lidstaat waarin het bevel is uitgevaardigd, het besluit dat aan het
      aanhoudingsbevel ten grondslag ligt en de duur van de nog uit te zitten straf dan wel een beknopte omschrijving van
      het strafbare feit dat ten grondslag ligt aan het bevel.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel23
  - number: '23.4'
    text: |-
      Het derde lid is van overeenkomstige toepassing indien de officier naar aanleiding van een naderhand ontvangen
      uitleveringsverzoek zijn vordering heeft aangevuld of gewijzigd.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel23
  - number: '23.5'
    text: |-
      Indien tegen de opgeëiste persoon in Nederland een strafvervolging gaande is voor het feit dat aan het Europees
      aanhoudingsbevel ten grondslag ligt, zendt de officier van justitie eveneens een afschrift van zijn vordering
      ter kennisneming aan de officier van justitie die met de vervolging is belast, met het verzoek hem onverwijld te
      informeren of de vervolging kan worden gestaakt.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel23
  - number: '23.6'
    text: |-
      Indien tegen de opgeëiste persoon in Nederland een strafvervolging gaande is voor een ander feit dan aan het
      Europees aanhoudingsbevel ten grondslag ligt, zendt de officier van justitie eveneens een afschrift van zijn
      vordering ter kennisneming aan de officier van justitie die met de vervolging is belast, met het verzoek hem
      onverwijld te informeren over de stand van zaken met betrekking tot die vervolging.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel23
  - number: '24.1'
    text: |-
      Dadelijk na de ontvangst van de in [artikel 23, tweede lid][ref1], bedoelde vordering bepaalt de voorzitter van
      de rechtbank, rekening houdend met de termijnen, genoemd in [artikel 22][ref2], het tijdstip waarop de opgeëiste
      persoon door de rechtbank zal worden gehoord. Hij kan daarbij diens medebrenging bevelen.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0016664#Artikel22
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0016664
        artikel: '23'
        hoofdstuk: II
        paragraaf: C
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0016664
        artikel: '22'
        hoofdstuk: II
        paragraaf: C
        afdeling: '2'
  - number: '24.2'
    text: |-
      De griffier van de rechtbank doet onverwijld aan de officier van justitie en aan de opgeëiste persoon mededeling
      van het voor het verhoor bepaalde tijdstip. Die mededeling – alsmede, zo een bevel tot medebrenging is gegeven, een
      afschrift van dat bevel – wordt aan de opgeëiste persoon betekend.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel24
  - number: '24.3'
    text: |-
      In geval de opgeëiste persoon geen raadsman heeft, geeft de voorzitter aan het bestuur van de raad voor
      rechtsbijstand last tot aanwijzing van een raadsman.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel24
  - number: '24.4'
    text: |-
      Indien de opgeëiste persoon minderjarig is, wordt de raad voor de kinderbescherming van de tijd en plaats van het
      verhoor op de hoogte gesteld. Indien de identiteit en verblijfplaats van de ouders of voogd bekend zijn, worden de
      ouders of voogd eveneens van de tijd en plaats van het verhoor op de hoogte gesteld.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel24
  - number: '25.1'
    text: |-
      Het verhoor van de opgeëiste persoon geschiedt in het openbaar, tenzij deze een behandeling van de zaak met
      gesloten deuren verlangt of de rechtbank om gewichtige, in het proces-verbaal der zitting te vermelden redenen
      sluiting der deuren beveelt.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel25
  - number: '25.2'
    text: Het verhoor heeft plaats in tegenwoordigheid van de officier van justitie.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel25
  - number: '25.3'
    text: Bij zijn verhoor kan de opgeëiste persoon zich door zijn raadsman doen bijstaan.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel25
  - number: '25.4'
    text: |-
      Is de opgeëiste persoon niet verschenen en acht de rechtbank zijn aanwezigheid bij het verhoor wenselijk, dan
      gelast de rechtbank, rekening houdend met de termijnen genoemd in [artikel 22][ref1], tegen een door haar te
      bepalen tijdstip diens dagvaarding, zo nodig onder bijvoeging van een bevel tot medebrenging.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel22
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0016664
        artikel: '22'
        hoofdstuk: II
        paragraaf: C
        afdeling: '2'
  - number: '25.5'
    text: |-
      Indien de opgeëiste persoon minderjarig is, worden verschenen ouders of voogd en de verschenen vertegenwoordiger
      van de raad voor de kinderbescherming in de gelegenheid gesteld de minderjarige bij te staan.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel25
  - number: '26.1'
    text: |-
      De rechtbank onderzoekt de identiteit van de opgeëiste persoon op de wijze, bedoeld in
      [artikel 27a, eerste lid, eerste volzin, van het Wetboek van Strafvordering][ref1], alsmede de ontvankelijkheid
      van het Europees aanhoudingsbevel en de mogelijkheid van overlevering. De rechtbank is tevens bevoegd de identiteit
      van de opgeëiste persoon vast te stellen op de wijze, bedoeld in artikel 27a, tweede lid, van dat wetboek, indien
      over zijn identiteit twijfel bestaat. [Artikel 29c, tweede lid, van dat wetboek][ref2] is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel27a
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel29c
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 27a
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 29c
  - number: '26.2'
    text: |-
      De officier van justitie geeft ter zitting van de rechtbank zijn opvatting over de verzochte overlevering en
      legt een schriftelijke samenvatting, waarin, in voorkomend geval, de beslissing tot staking van de vervolging is
      vermeld, aan de rechtbank over. De opgeëiste persoon en diens raadsman worden eveneens in de gelegenheid gesteld
      tot het maken van ter zake dienende opmerkingen omtrent het Europees aanhoudingsbevel en de in verband daarmede te
      nemen beslissingen.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel26
  - number: '26.3'
    text: |-
      In geval van samenloop van Europese aanhoudingsbevelen vermeldt de officier van justitie eveneens aan welk van
      de Europese aanhoudingsbevelen – voor zover de overlevering op basis daarvan kan worden toegestaan – voorrang zal
      worden gegeven, daarbij rekening houdend met het belang van een goede rechtsbedeling en voorts in het bijzonder
      met:
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel26
  - number: 26.3.a
    text: de meerdere of mindere ernst van de verschillende feiten waarvoor de overlevering is gevraagd;
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel26
  - number: 26.3.b
    text: de plaats of plaatsen waar de feiten zijn begaan;
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel26
  - number: 26.3.c
    text: de data van de onderscheiden Europese aanhoudingsbevelen;
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel26
  - number: 26.3.d
    text: het doel van de overlevering;
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel26
  - number: 26.3.e
    text: de mate waarin de nationaliteit van de opgeëiste persoon een belemmering zal vormen voor verderlevering;
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel26
  - number: 26.3.f
    text: |-
      de mogelijkheid dat de opgeëiste persoon, nadat hij naar het grondgebied van een van de betrokken lidstaten is
      verwijderd, vervolgens door de justitiële autoriteiten van die lidstaat ter beschikking wordt gesteld van de
      uitvaardigende justitiële autoriteit van een andere lidstaat.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel26
  - number: '26.4'
    text: |-
      Beweert de opgeëiste persoon niet schuldig te zijn aan de feiten waarvoor zijn overlevering wordt verzocht, dan
      dient hij dat tijdens het verhoor aan te tonen en onderzoekt de rechtbank die bewering.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel26
  - number: '26.5'
    text: |-
      Indien de rechtbank zulks met het oog op het door haar krachtens het eerste lid in te stellen onderzoek
      noodzakelijk acht, gelast zij, rekening houdend met de termijnen, genoemd in [artikel 22][ref1], – zo nodig onder
      bijvoeging van een bevel tot medebrenging – tegen een door haar te bepalen tijdstip de dagvaarding of schriftelijke
      oproeping van getuigen of deskundigen.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel22
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0016664
        artikel: '22'
        hoofdstuk: II
        paragraaf: C
        afdeling: '2'
  - number: '27.1'
    text: |-
      Op vordering van de officier van justitie kan de rechtbank ter zitting de gevangenneming van de opgeëiste persoon
      bevelen.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel27
  - number: '27.2'
    text: |-
      Voordat het onderzoek ter zitting wordt gesloten, beslist de rechtbank ambtshalve omtrent de gevangenhouding van de
      opgeëiste persoon, zo deze in bewaring of in verzekering is gesteld.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel27
  - number: '27.3'
    text: |-
      In geval van verlenging van de termijn als bedoeld in [artikel 22, vierde tot en met zesde lid][ref1], beslist de
      rechtbank ten minste bij elke verlenging ambtshalve omtrent de verlenging van de vrijheidsbeneming van de opgeëiste
      persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel22
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0016664
        artikel: '22'
        hoofdstuk: II
        paragraaf: C
        afdeling: '2'
  - number: '27.4'
    text: |-
      In geval van weigering van de overlevering als bedoeld in [artikel 6a, eerste lid][ref1], kan de rechtbank de
      gevangenhouding van de opgeëiste persoon bevelen tot aan de tenuitvoerlegging van de vrijheidsstraf.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel6a
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0016664
        artikel: 6a
        hoofdstuk: II
        afdeling: '1'
  - number: '28.1'
    text: |-
      Uiterlijk veertien dagen na de sluiting van het onderzoek ter zitting doet de rechtbank uitspraak over de
      overlevering. De uitspraak wordt met redenen omkleed.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel28
  - number: '28.2'
    text: |-
      Bevindt de rechtbank, hetzij dat het Europees aanhoudingsbevel niet voldoet aan de vereisten van [artikel 2][ref1],
      hetzij dat de overlevering niet kan worden toegestaan, hetzij dat ten aanzien van de opgeëiste persoon geen sprake
      kan zijn van een vermoeden van schuld aan de feiten waarvoor zijn overlevering is gevraagd, dan weigert zij bij
      haar uitspraak de overlevering.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel2
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0016664
        artikel: '2'
        hoofdstuk: I
        afdeling: '2'
  - number: '28.3'
    text: |-
      In andere dan de in het tweede lid voorziene gevallen staat de rechtbank bij haar uitspraak overlevering toe,
      tenzij zij van oordeel is dat met toepassing van [artikel 11, eerste lid][ref1], geen gevolg dient te worden
      gegeven aan het Europees aanhoudingsbevel dan wel ingevolge [artikel 13][ref2] de overlevering dient te worden
      geweigerd.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0016664#Artikel13
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0016664
        artikel: '11'
        hoofdstuk: II
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0016664
        artikel: '13'
        hoofdstuk: II
        afdeling: '1'
  - number: '28.4'
    text: |-
      Indien uitvaardigende justitiële autoriteiten van twee of meer lidstaten de overlevering van dezelfde persoon
      hebben gevraagd, bevestigt de rechtbank het oordeel van de officier van justitie aan welk van de Europese
      aanhoudingsbevelen – voor zover de overlevering op basis daarvan kan worden toegestaan – voorrang dient te worden
      gegeven, tenzij naar het oordeel van de rechtbank de officier van justitie met inachtneming van de daarvoor
      gestelde criteria niet in redelijkheid tot zijn keuze heeft kunnen komen.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel28
  - number: '28.5'
    text: |-
      In een uitspraak als bedoeld in dit artikel worden de toepasselijke wetsbepalingen, alsmede – in voorkomend
      geval – het feit of de feiten waarvoor de overlevering wordt toegestaan en de letterlijke tekst van de door
      de uitvaardigende justitiële autoriteit afgegeven garanties, bedoeld in [artikel 6, eerste lid][ref1], en in
      [artikel 12][ref2] vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0016664#Artikel12
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0016664
        artikel: '6'
        hoofdstuk: II
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0016664
        artikel: '12'
        hoofdstuk: II
        afdeling: '1'
  - number: '28.6'
    text: |-
      Wordt de overlevering toegestaan niettegenstaande een bewering van de persoon overeenkomstig
      [artikel 26, vierde lid][ref1], dan vermeldt de uitspraak hetgeen de rechtbank te dien aanzien heeft bevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel26
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0016664
        artikel: '26'
        hoofdstuk: II
        paragraaf: C
        afdeling: '2'
  - number: '29.1'
    text: |-
      De uitspraak van de rechtbank is dadelijk uitvoerbaar, tenzij er ten aanzien van de opgeëiste persoon een
      concurrerend uitleveringsverzoek of overleveringsverzoek van het Internationaal Strafhof of van een ander
      internationaal tribunaal is ontvangen, dat in behandeling is genomen.
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel29
  - number: '29.2'
    text: |-
      Tegen de uitspraak van de rechtbank staat geen rechtsmiddel open, anders dan beroep in cassatie in het belang der
      wet, bedoeld in [artikel 456 van het Wetboek van Strafvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel456
    url: https://wetten.overheid.nl/BWBR0016664/2021-04-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '456'
  - number: '30.1'
    text: |-
      De artikelen [21 tot en met 25][ref1], [260, eerste lid][ref2], [268][ref3], [269, vijfde lid][ref4],
      [271][ref5], [272][ref6], [273, derde lid][ref7], [274 tot en met 277][ref8], [279][ref9], [281][ref10],
      [286][ref11], [288, vierde lid][ref12], [289, eerste en derde lid][ref13], [290 tot en met 301][ref14],
      [318 tot en met 322][ref15], [324 tot en met 327][ref16], [328 tot en met 331][ref17],
      [345, eerste lid][ref18], [346][ref19], [357][ref20], [362][ref21], [363][ref22] en
      [365, eerste tot en met vijfde lid van het Wetboek van Strafvordering][ref23] zijn van overeenkomstige toepassing.


