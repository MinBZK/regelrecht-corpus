$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_gebruik_friese_taal_in_het_rechtsverkeer
regulatory_layer: WET
publication_date: '2013-10-17'
valid_from: '2004-09-01'
bwb_id: BWBR0002219
url: https://wetten.overheid.nl/BWBR0002219/2004-09-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is enige regelen te stellen betreffende het gebruik van de
    Friese taal, in het bijzonder in het rechtsverkeer;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002219/2004-09-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Hij die ter uitvoering van een wettelijk voorschrift mondeling een eed, belofte of bevestiging moet afleggen, is
      bevoegd in plaats van de wettelijk voorgeschreven woorden de daarmede in de Friese taal overeenkomende woorden
      uit te spreken, tenzij de woorden van de eed, belofte of bevestiging bij de [Grondwet][ref1] of mede bij de
      [Grondwet][ref2] zijn vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001840
      [ref2]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0002219/2004-09-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001840
      - id: ref2
        bwb_id: BWBR0001840
  - number: '1.2'
    text: 'In het geval, bedoeld in het voorgaande lid, treden:'
    url: https://wetten.overheid.nl/BWBR0002219/2004-09-01#Artikel1
  - number: 1.2.a
    text: |-
      indien een eed wordt afgelegd, voor de woorden: "Zoo waarlijk helpe mij God Almachtig" in de plaats de woorden: "Sa
      wier helpe my God Almachtich";
    url: https://wetten.overheid.nl/BWBR0002219/2004-09-01#Artikel1
  - number: 1.2.b
    text: |-
      indien een belofte wordt afgelegd, voor de woorden: "Dat beloof ik" in de plaats de woorden: "Dat ûnthjit ik", en
      indien een bevestiging wordt afgelegd, voor de woorden: "Dat verklaar ik" in de plaats de woorden: "Dat ferklearje
      ik".
    url: https://wetten.overheid.nl/BWBR0002219/2004-09-01#Artikel1
  - number: '2'
    text: |-
      In alle gevallen, waarin iemand op een terechtzitting, welke gehouden wordt in de provincie Friesland, van
      ambtswege het woord voert, dan wel verplicht is zich aan een verhoor te onderwerpen of bevoegd is het woord te
      voeren, is hij bevoegd zich te bedienen van de Friese taal.
    url: https://wetten.overheid.nl/BWBR0002219/2004-09-01#Artikel2
  - number: '3'
    text: |-
      Indien tijdens het onderzoek ter terechtzitting in een strafzaak een verdachte of getuige zich op de voet van
      [artikel 2][ref1] wil bedienen van het Fries, bepaalt de rechter die de leiding van de zitting heeft, indien
      hij zulks wenselijk acht, dat bijstand wordt verleend door een tolk. De [artikelen 260, eerste lid][ref2], en
      [276, eerste en vierde lid, van het Wetboek van Strafvordering][ref3] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002219#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel260
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel276
    url: https://wetten.overheid.nl/BWBR0002219/2004-09-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002219
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '260'
      - id: ref3
        bwb_id: BWBR0001903
        artikel: '276'
  - number: '4'
    text: |-
      Indien tijdens een terechtzitting in een civiele zaak een partij, belanghebbende of getuige zich op de voet van
      [artikel 2][ref1] wil bedienen van het Fries, bepaalt de rechter die de leiding heeft van de zitting, indien hij
      zulks wenselijk acht, dat bijstand wordt verleend door een tolk, mits de rechtsgang daardoor naar zijn oordeel niet
      onnodig wordt vertraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0002219#Artikel2
    url: https://wetten.overheid.nl/BWBR0002219/2004-09-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002219
        artikel: '2'
  - number: 4a
    text: |-
      De rechter kan bepalen dat de vergoeding aan de tolk die ingevolge [artikel 4][ref1] is opgetreden ten laste
      van het Rijk komt. Het bij of krachtens de [Wet tarieven in strafzaken][ref2] bepaalde is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002219#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002406
    url: https://wetten.overheid.nl/BWBR0002219/2004-09-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0002219
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0002406
  - number: '5'
    text: |-
      Indien tijdens het onderzoek ter zitting in een bestuursrechtelijke zaak een partij of getuige zich op de voet van
      [artikel 2][ref1] wil bedienen van het Fries, bepaalt de rechter die de leiding van de zitting heeft, indien hij
      zulks wenselijk acht, dat bijstand wordt verleend door een tolk, mits de rechtsgang daardoor naar zijn oordeel niet
      onnodig wordt vertraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0002219#Artikel2
    url: https://wetten.overheid.nl/BWBR0002219/2004-09-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002219
        artikel: '2'
  - number: '6.1'
    text: |-
      Hetgeen in het Fries is gesproken wordt, indien het in het proces-verbaal wordt opgenomen, in die taal vermeld. De
      rechter kan bepalen dat een vertaling in het Nederlands wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0002219/2004-09-01#Artikel6
  - number: '6.2'
    text: |-
      Indien naar het oordeel van de rechter opneming van het gesprokene in het Fries in redelijkheid niet kan worden
      gevergd, wordt het in het Nederlands in het proces-verbaal opgenomen en wordt daarin aangetekend dat het Fries
      is gebezigd.
    url: https://wetten.overheid.nl/BWBR0002219/2004-09-01#Artikel6
  - number: '7.1'
    text: |-
      In strafzaken, civiele zaken en bestuursrechtelijke zaken die aanhangig zijn bij een in de provincie Friesland
      gevestigd gerecht, mogen processtukken, met uitzondering van dagvaardingen en telasteleggingen in strafzaken, in
      het Fries worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002219/2004-09-01#Artikel7
  - number: '7.2'
    text: |-
      Indien dat voor een goede beoordeling van het stuk wenselijk is, kan de rechter ambtshalve of op verzoek van een
      van de andere bij de zaak betrokkenen verlangen, dat een vertaling in het Nederlands wordt toegevoegd.
    url: https://wetten.overheid.nl/BWBR0002219/2004-09-01#Artikel7
  - number: 7a
    text: |-
      De rechter kan bepalen dat de kosten van de vertaling van processtukken in civiele zaken als bedoeld in
      [artikel 7][ref1] ten laste van het Rijk komen. Het bij of krachtens de [Wet tarieven in strafzaken][ref2] bepaalde
      is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002219#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002406
    url: https://wetten.overheid.nl/BWBR0002219/2004-09-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0002219
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0002406
  - number: '8.1'
    text: |-
      Indien stukken of opgaven, welke ingevolge wettelijk voorschrift in openbare registers moeten worden ingeschreven,
      in de Friese taal zijn gesteld, wordt daarnevens de overlegging gevorderd van letterlijke vertalingen in het
      Nederlands, vervaardigd en voor overeenstemmend verklaard door een voor de Friese taal als bevoegd toegelaten
      beëdigde vertaler of, indien de inschrijving betrekking heeft op een notariële akte, door de notaris, die de akte
      heeft verleden.
    url: https://wetten.overheid.nl/BWBR0002219/2004-09-01#Artikel8
  - number: '8.2'
    text: |-
      De vertalingen worden ingeschreven in plaats van de in de Friese taal gestelde stukken of opgaven, welke aan het
      register blijven gehecht. Voorts wordt met de vertalingen gehandeld op dezelfde wijze als anders ten aanzien van
      die stukken of opgaven zou moeten geschieden.
    url: https://wetten.overheid.nl/BWBR0002219/2004-09-01#Artikel8
  - number: '8.3'
    text: |-
      In afwijking van het eerste en tweede lid worden akten van de burgerlijke stand zowel in het Fries als in het
      Nederlands opgemaakt.
    url: https://wetten.overheid.nl/BWBR0002219/2004-09-01#Artikel8
  - number: '8.4'
    text: Het bepaalde in het eerste tot en met derde lid is van toepassing, tenzij bij de wet anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0002219/2004-09-01#Artikel8
  - number: '9'
    text: |-
      In alle gevallen, waarin een ontwerp van een akte de goedkeuring behoeft van een rechter, kan de definitieve akte
      in de Friese taal worden opgemaakt, mits daaronder wordt gesteld een verklaring van een voor de Friese taal als
      bevoegd toegelaten beëdigde vertaler waaruit blijkt, dat de akte een getrouwe vertaling is van het door de rechter
      goedgekeurde ontwerp. Wordt de akte notarieel verleden, dan kan de verklaring van de beëdigde vertaler worden
      vervangen door een verklaring van de notaris, die de akte verlijdt.
    url: https://wetten.overheid.nl/BWBR0002219/2004-09-01#Artikel9
  - number: '10'
    text: |-
      Op vordering van ’s Rijks ambtenaar moet bij een akte, welke in de Friese taal is gesteld en welke hem ter
      registratie wordt aangeboden, worden gevoegd een letterlijke vertaling in het Nederlands vervaardigd en
      voor overeenstemmend verklaard door een voor de Friese taal als bevoegd toegelaten beëdigde vertaler of,
      indien de registratie betrekking heeft op een notariële akte, door de notaris, die de akte heeft verleden.
      [Artikel 6, tweede en derde lid, van de Registratiewet 1970][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002739#Artikel6
    url: https://wetten.overheid.nl/BWBR0002219/2004-09-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002739
        artikel: '6'
  - number: '11.1'
    text: |-
      Hij die bevoegd is tot het geven van middelbaar onderwijs in de Friese taal, wordt op zijn verlangen door de
      arrondissements-rechtbank zijner woonplaats als vertaler voor de Friese taal beëdigd, wanneer hij een verklaring
      omtrent het gedrag, als bedoeld in [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref1],
      overlegt.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel28
    url: https://wetten.overheid.nl/BWBR0002219/2004-09-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '28'
  - number: '11.2'
    text: |-
      De [artikelen 2-6 van de wet van 6 mei 1878, ][ref1], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001849#Artikel2
    url: https://wetten.overheid.nl/BWBR0002219/2004-09-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0001849
        artikel: '2'
  - number: '11.3'
    text: |-
      Hij die de bevoegdheid heeft als beëdigd vertaler op te treden voor de Friese taal en voor een of meer vreemde
      talen, is tevens bevoegd op te treden als beëdigde vertaler voor vertalingen uit de Friese taal in die vreemde
      talen en uit die vreemde talen in de Friese taal.
    url: https://wetten.overheid.nl/BWBR0002219/2004-09-01#Artikel11
  - number: '12'
    text: |-
      Indien een verdachte of getuige tijdens het onderzoek ter terechtzitting in een strafzaak buiten de
      provincie Friesland zich wil bedienen van het Fries en aannemelijk maakt dat hij zich in het Nederlands
      onvoldoende kan uitdrukken, bepaalt de rechter die de leiding van de zitting heeft, indien hij zulks
      wenselijk acht, dat bijstand wordt verleend door een tolk. De [artikelen 260, eerste lid][ref1], en
      [276, eerste en vierde lid, van het Wetboek van Strafvordering][ref2] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel260
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel276
    url: https://wetten.overheid.nl/BWBR0002219/2004-09-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '260'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '276'
  - number: '13'
    text: 'Deze wet wordt aangehaald als: Wet gebruik Friese taal in het rechtsverkeer.'
    url: https://wetten.overheid.nl/BWBR0002219/2004-09-01#Artikel13
