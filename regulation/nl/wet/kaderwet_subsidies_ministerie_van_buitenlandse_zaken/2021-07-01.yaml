$id: kaderwet_subsidies_ministerie_van_buitenlandse_zaken
regulatory_layer: WET
publication_date: '2024-09-02'
valid_from: '2021-07-01'
bwb_id: BWBR0010178
url: https://wetten.overheid.nl/BWBR0010178/2021-07-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat de totstandkoming van de derde tranche van de Algemene wet bestuursrecht
    het nodig maakt wettelijke regels op te stellen voor de verstrekking van subsidies door Onze Minister van
    Buitenlandse Zaken en Onze Minister voor Ontwikkelingssamenwerking;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk wij goed vinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0010178/2021-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder «Onze Minister»: Onze Minister van Buitenlandse
      Zaken of Onze Minister voor Buitenlandse Handel en Ontwikkelingssamenwerking.
    url: https://wetten.overheid.nl/BWBR0010178/2021-07-01#Artikel1
  - number: '2'
    text: 'Onze Minister kan subsidies verstrekken voor activiteiten welke passen in het beleid ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0010178/2021-07-01#Artikel2
  - number: 2.a
    text: het bevorderen van de internationale rechtsorde;
    url: https://wetten.overheid.nl/BWBR0010178/2021-07-01#Artikel2
  - number: 2.b
    text: het bevorderen van vrede en veiligheid;
    url: https://wetten.overheid.nl/BWBR0010178/2021-07-01#Artikel2
  - number: 2.c
    text: het behartigen van politieke belangen in het buitenland;
    url: https://wetten.overheid.nl/BWBR0010178/2021-07-01#Artikel2
  - number: 2.d
    text: het bevorderen van ontwikkelings- en transitieprocessen in andere landen;
    url: https://wetten.overheid.nl/BWBR0010178/2021-07-01#Artikel2
  - number: 2.e
    text: het behartigen van sociale, culturele en economische belangen in het buitenland;
    url: https://wetten.overheid.nl/BWBR0010178/2021-07-01#Artikel2
  - number: 2.f
    text: |-
      het voorlichten op het terrein van het buitenlands beleid en het bevorderen van mondiale bewustwording in
      Nederland;
    url: https://wetten.overheid.nl/BWBR0010178/2021-07-01#Artikel2
  - number: 2.g
    text: het bevorderen van onderzoek en advisering ter ondersteuning van het buitenlands beleid;
    url: https://wetten.overheid.nl/BWBR0010178/2021-07-01#Artikel2
  - number: 2.h
    text: het lenigen van menselijke noden ten gevolge van crises;
    url: https://wetten.overheid.nl/BWBR0010178/2021-07-01#Artikel2
  - number: 2.i
    text: het bevorderen van de internationale economische betrekkingen en
    url: https://wetten.overheid.nl/BWBR0010178/2021-07-01#Artikel2
  - number: 2.j
    text: het bevorderen van het welzijn van het personeel van het Ministerie van Buitenlandse Zaken.
    url: https://wetten.overheid.nl/BWBR0010178/2021-07-01#Artikel2
  - number: '3.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur of bij ministeriële regeling worden de activiteiten waarvoor
      subsidie kan worden verstrekt nader bepaald en worden nadere regels voor die verstrekking vastgesteld.
    url: https://wetten.overheid.nl/BWBR0010178/2021-07-01#Artikel3
  - number: '3.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur of bij ministeriële regeling kunnen voorts regels worden
      vastgesteld met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0010178/2021-07-01#Artikel3
  - number: 3.2.a
    text: de vaststelling van een subsidieplafond;
    url: https://wetten.overheid.nl/BWBR0010178/2021-07-01#Artikel3
  - number: 3.2.b
    text: het bedrag van de subsidie dan wel de wijze waarop dit bedrag wordt bepaald;
    url: https://wetten.overheid.nl/BWBR0010178/2021-07-01#Artikel3
  - number: 3.2.c
    text: de aanvraag van een subsidie en de besluitvorming daarover;
    url: https://wetten.overheid.nl/BWBR0010178/2021-07-01#Artikel3
  - number: 3.2.d
    text: de bevoegdheid om besluiten te nemen over subsidieverlening;
    url: https://wetten.overheid.nl/BWBR0010178/2021-07-01#Artikel3
  - number: 3.2.e
    text: de voorwaarden waaronder de subsidie wordt verleend;
    url: https://wetten.overheid.nl/BWBR0010178/2021-07-01#Artikel3
  - number: 3.2.f
    text: de verplichtingen voor de subsidieontvanger, waaronder de rapportage over toepassing van de subsidie;
    url: https://wetten.overheid.nl/BWBR0010178/2021-07-01#Artikel3
  - number: 3.2.g
    text: de vaststelling van de subsidie;
    url: https://wetten.overheid.nl/BWBR0010178/2021-07-01#Artikel3
  - number: 3.2.h
    text: de betaling van de subsidie en de eventuele verlening van voorschotten;
    url: https://wetten.overheid.nl/BWBR0010178/2021-07-01#Artikel3
  - number: 3.2.i
    text: de rapportage over de doeltreffendheid en de effecten van de verstrekte subsidies in de praktijk en
    url: https://wetten.overheid.nl/BWBR0010178/2021-07-01#Artikel3
  - number: 3.2.j
    text: overige onderwerpen die betrekking hebben op de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0010178/2021-07-01#Artikel3
  - number: '3.3'
    text: |-
      In aanvulling op het bepaalde krachtens het eerste en tweede lid kan de verstrekking van subsidie afhankelijk
      worden gesteld van het voldoen aan beoordelingsmaatstaven, niet strekkende tot verwezenlijking van het doel van de
      subsidie, met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0010178/2021-07-01#Artikel3
  - number: 3.3.a
    text: het beloningsbeleid van de subsidieaanvrager,
    url: https://wetten.overheid.nl/BWBR0010178/2021-07-01#Artikel3
  - number: 3.3.b
    text: het integriteitsbeleid van de subsidieaanvrager,
    url: https://wetten.overheid.nl/BWBR0010178/2021-07-01#Artikel3
  - number: 3.3.c
    text: de naleving van algemeen gangbare normen van maatschappelijk verantwoord ondernemen door de subsidieaanvrager,
    url: https://wetten.overheid.nl/BWBR0010178/2021-07-01#Artikel3
  - number: 3.3.d
    text: de naleving van internationaal aanvaarde humanitaire principes door de subsidieaanvrager,
    url: https://wetten.overheid.nl/BWBR0010178/2021-07-01#Artikel3
  - number: 3.3.e
    text: de positie van vrouwen,
    url: https://wetten.overheid.nl/BWBR0010178/2021-07-01#Artikel3
  - number: 3.3.f
    text: de gevolgen voor het milieu,
    url: https://wetten.overheid.nl/BWBR0010178/2021-07-01#Artikel3
  - number: 3.3.g
    text: de gevolgen voor internationaal erkende burger-, politieke, economische, sociale en culturele rechten van mensen en
    url: https://wetten.overheid.nl/BWBR0010178/2021-07-01#Artikel3
  - number: 3.3.h
    text: overige uit oogpunt van algemeen belang bij algemene maatregel van bestuur geregelde beoordelingsmaatstaven.
    url: https://wetten.overheid.nl/BWBR0010178/2021-07-01#Artikel3
  - number: '3.4'
    text: |-
      Aan de subsidie kunnen verplichtingen worden verbonden met betrekking tot de bij of krachtens deze wet geregelde
      beoordelingsmaatstaven.
    url: https://wetten.overheid.nl/BWBR0010178/2021-07-01#Artikel3
  - number: '4.1'
    text: Deze wet is niet van toepassing op subsidies waarvan de verstrekking bij afzonderlijke wet is geregeld.
    url: https://wetten.overheid.nl/BWBR0010178/2021-07-01#Artikel4
  - number: '4.2'
    text: |-
      Deze wet en [afdeling 3.3 tot en met 3.7][ref1] en de [hoofdstukken 4][ref2], [5][ref3], [6][ref4], [7][ref5],
      [8][ref6] en [10 van de Algemene wet bestuursrecht][ref7] zijn niet van toepassing op de verstrekking van
      financiële middelen aan natuurlijke personen en rechtspersonen buiten de Europese Unie door een Nederlandse
      vertegenwoordiging buiten de Europese Unie namens Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk6
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk7
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk8
      [ref7]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk10
    url: https://wetten.overheid.nl/BWBR0010178/2021-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.3'
      - id: ref2
        bwb_id: BWBR0005537
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0005537
        hoofdstuk: '5'
      - id: ref4
        bwb_id: BWBR0005537
        hoofdstuk: '6'
      - id: ref5
        bwb_id: BWBR0005537
        hoofdstuk: '7'
      - id: ref6
        bwb_id: BWBR0005537
        hoofdstuk: '8'
      - id: ref7
        bwb_id: BWBR0005537
        hoofdstuk: '10'
  - number: '5.1'
    text: |-
      Een aanvraag voor een subsidie kan worden afgewezen en een beschikking inhoudende de verstrekking van een subsidie
      kan door Onze Minister worden ingetrokken of gewijzigd voor zover subsidieverstrekking in strijd zou zijn met
      volkenrechtelijke verplichtingen rustend op de staat.
    url: https://wetten.overheid.nl/BWBR0010178/2021-07-01#Artikel5
  - number: '5.2'
    text: |-
      Bij de intrekking of wijziging kan worden bepaald, dat over onverschuldigd betaalde subsidiebedragen een
      rentevergoeding verschuldigd is.
    url: https://wetten.overheid.nl/BWBR0010178/2021-07-01#Artikel5
  - number: '5.3'
    text: |-
      Onze Minister kan in een beschikking tot subsidieverlening bepalen dat het instellen van bezwaar en beroep tegen
      een verleende subsidie schorsende werking heeft.
    url: https://wetten.overheid.nl/BWBR0010178/2021-07-01#Artikel5
  - number: '6.1'
    text: |-
      Met het toezicht op de naleving van de bij of krachtens deze wet aan de subsidieontvanger opgelegde verplichtingen
      zijn belast de bij besluit van Onze Minister aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0010178/2021-07-01#Artikel6
  - number: '6.2'
    text: |-
      De toezichthouder beschikt niet over de bevoegdheden, vermeld in de [artikelen 5:18][ref1] en
      [5:19 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0010178/2021-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '6.3'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0010178/2021-07-01#Artikel6
  - number: 6a.1
    text: |-
      De op grond van [artikel 3][ref1] in samenhang met
      [artikel 2, eerste lid, onder e, van de Kaderwet EZ-subsidies][ref2], zoals deze luidde voor inwerkingtreding
      van de wet van 11 november 2013 tot wijziging van de Kaderwet EZ-subsidies (aanpassing aan de samenvoeging van
      de voormalige ministeries van Economische Zaken en van Landbouw, Natuur en Voedselkwaliteit) (Stb. 2013, 482),
      vastgestelde ministeriële regelingen, berusten op [artikel 3, eerste lid][ref3], van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0010178#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009194#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0010178#Artikel3
    url: https://wetten.overheid.nl/BWBR0010178/2021-07-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0010178
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0009194
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0010178
        artikel: '3'
  - number: 6a.2
    text: |-
      Het bij of krachtens de [Kaderwet EZ-subsidies][ref1] bepaalde blijft van toepassing op subsidies die zijn
      verstrekt krachtens [artikel 3][ref2] in samenhang met [artikel 2, eerste lid, onder e, van die wet][ref3], zoals
      deze luidde voor inwerkingtreding van de wet van 11 november 2013 tot wijziging van de Kaderwet EZ-subsidies
      (aanpassing aan de samenvoeging van de voormalige ministeries van Economische Zaken en van Landbouw, Natuur en
      Voedselkwaliteit) (Stb. 2013, 482).


      [ref1]: https://wetten.overheid.nl/BWBR0009194
      [ref2]: https://wetten.overheid.nl/BWBR0010178#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0009194#Artikel2
    url: https://wetten.overheid.nl/BWBR0010178/2021-07-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0009194
      - id: ref2
        bwb_id: BWBR0010178
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0009194
        artikel: '2'
  - number: '7'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0010178/2021-07-01#Artikel7
  - number: '8'
    text: 'Deze wet wordt aangehaald als: Kaderwet subsidies Ministerie van Buitenlandse Zaken.'
    url: https://wetten.overheid.nl/BWBR0010178/2021-07-01#Artikel8
