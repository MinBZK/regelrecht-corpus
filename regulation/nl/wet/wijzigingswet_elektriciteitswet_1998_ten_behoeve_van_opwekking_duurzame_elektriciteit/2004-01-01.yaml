preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is, ter uitvoering van richtlijn 2001/77/EG van
    het Europees Parlement en de Raad van de Europese Unie van 27 september 2001 betreffende de bevordering van
    elektriciteitsopwekking uit hernieuwbare energiebronnen op de interne elektriciteitsmarkt (PbEG L 283) het duurzaam
    functioneren van de elektriciteitsvoorziening te bevorderen, de productie van duurzame elektriciteit te stimuleren
    en te waarborgen dat duurzame elektriciteit daadwerkelijk op duurzame wijze is opgewekt;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0015924/2004-01-01#ArtikelAanhef
articles:
  - number: V
    text: |-
      1 Vanaf het moment van inwerkingtreding van artikel I van deze wet zet de op grond van
      [artikel 73, tweede lid, van de Elektriciteitswet 1998][ref1] aangewezen instantie de groencertificaten verstrekt
      ten behoeve van in Nederland opgewekte duurzame elektriciteit om in garanties van oorsprong.

      2 De voor het moment van inwerkingtreding van artikel I van deze wet ingediende aanvragen om boeking van
      groencertificaten ten behoeve van in Nederland opgewekte duurzame elektriciteit worden beschouwd als verzoeken om
      boeking van garanties van oorsprong.

      3 De [Regeling groencertificaten Elektriciteitswet 1998][ref2] is van toepassing op de voor het moment van
      inwerkingtreding van [artikel I van deze wet][ref3] verstrekte groencertificaten ten behoeve van in het buitenland
      opgewekte duurzame elektriciteit, alsmede op de voor het moment van inwerkingtreding van artikel I van deze
      wet ingediende aanvragen om boeking van groencertificaten ten behoeve van in het buitenland opgewekte duurzame
      elektriciteit.

      4 Voor de toepassing van [artikel 36i, zesde lid, van de Wet belastingen op milieugrondslag][ref4] worden de
      groencertificaten, bedoeld in het derde lid, als garanties van oorsprong beschouwd.

      5 Gedurende de termijn waarbinnen een afnemer als bedoeld in
      [artikel 1, eerste lid, onderdeel d, onder 2°, van de Elektriciteitswet 1998][ref5]
      wordt beschouwd als een beschermde afnemer, is de vergunninghouder, bedoeld in
      [artikel 1, eerste lid, onderdeel l, van de Elektriciteitswet 1998][ref6] verplicht een aanbod
      tot het leveren van elektriciteit te aanvaarden, indien een beschermde afnemer als bedoeld in
      [artikel 1, eerste lid, onderdeel d, onder 2°, van de Elektriciteitswet 1998][ref7] dit aanbod doet en deze
      afnemer elektriciteit opwekt met een installatie voor warmtekrachtkoppeling.

      6 De vergoeding die de vergunninghouder aan de beschermde afnemer, bedoeld in het eerste lid, verschuldigd is
      voor het leveren van elektriciteit opgewekt met een installatie voor warmtekrachtkoppeling, wordt vastgesteld
      overeenkomstig het bepaalde in artikel 71 van de Elektriciteitswet 1998 zoals dit luidde voor 1 juli 2003.


