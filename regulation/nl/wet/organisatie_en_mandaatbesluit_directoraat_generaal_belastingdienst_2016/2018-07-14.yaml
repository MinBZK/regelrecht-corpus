articles:
  - number: '2'
    text: |-
      1 De taken en verantwoordelijkheden van de onder de directeur-generaal ressorterende hoofddirecteuren, algemeen
      directeuren en directeuren zijn als volgt:

      a) de hoofddirecteur Control en Bedrijfsvoering, is concernbreed verantwoordelijk voor de totstandkoming van het
      beleid en de uitvoering binnen alle aandachtsvelden met betrekking tot PIOFH-taken. Voor wat betreft Finance ligt
      de focus op de concernbrede control. Tevens is hij verantwoordelijk voor het functioneren van de organisatie-
      onderdelen HR, Finance, Centrum voor Kennis en Communicatie, Centrum voor Facilitaire Dienstverlening en Data
      & Analytics;

      b) de hoofddirecteur Informatie Voorziening (IV), is concernbreed verantwoordelijk voor de totstandkoming van het
      beleid en de uitvoering van informatievoorziening en ICT. Tevens is hij verantwoordelijk voor het functioneren
      van de organisatieonderdelen Centrum voor Infrastructuur en Exploitatie, Centrum voor Applicatie-ontwikkeling en
      -onderhoud, Informatie Management en IV-Accent;

      c) de hoofddirecteur Fiscaliteit en Juridische Zaken, is concernbreed verantwoordelijk voor de totstandkoming van
      het fiscaal (uitvoerings)beleid en strategische en politiek-bestuurlijke advisering (van ambtelijke en politieke
      top) binnen dit domein. Tevens is hij verantwoordelijk voor de cassatieprocedures;

      d) de algemeen directeur Belastingen & Toeslagen, is verantwoordelijk voor het functioneren van het
      organisatieonderdeel Belastingen en Toeslagen. Tevens is hij verantwoordelijk voor het organisatieonderdeel
      Belastingdienst/Caribisch Nederland;

      e) de algemeen directeur Douane, is verantwoordelijk voor het functioneren van het organisatieonderdeel Douane
      Nederland;

      f) de algemeen directeur Fiscale Inlichtingen- en Opsporingsdienst (FIOD), is verantwoordelijk voor het
      functioneren van het organisatieonderdeel FIOD;

      g) de directeur directoraat-generaal Belastingdienst (DGBel), is verantwoordelijk voor het functioneren van het
      organisatieonderdeel DGBel;

      h) de directeur programmamanagement Investeringsagenda, is verantwoordelijk voor het programmamanagement van de
      Investeringsagenda;

      i) de directeur Switch, is verantwoordelijk voor het functioneren van het organisatieonderdeel Switch;

      2 De hoofddirecteuren, algemeen directeuren en directeuren, zoals bedoeld in het eerste lid, dragen
      bij de uitoefening van hun taken en verantwoordelijkheden zorg voor de samenhang tussen deze taken en
      verantwoordelijkheden en voor de bijbehorende bedrijfsvoering.

      3 De hoofddirecteuren, algemeen directeuren en directeuren, zoals bedoeld in het eerste lid, treden over
      vraagstukken die van politiek gevoelige of anderszins zwaarwegende aard zijn in contact met de directeur-generaal
      Belastingdienst, voordat van bevoegdheden gebruik wordt gemaakt.

      4 De directeur-generaal kan besluiten om één van de in het eerste lid genoemde functionarissen aan te wijzen als
      zijn vervanger.
    url: https://wetten.overheid.nl/BWBR0038862/2018-07-14#Artikel2
  - number: '3'
    text: |-
      1 Er is een Managementteam (MT) Belastingdienst, waarin regelmatig overleg wordt gevoerd over de hoofdlijnen van al
      hetgeen dat nodig is voor een goed functioneren van de Belastingdienst als concern.

      2 Het MT Belastingdienst staat onder leiding van de directeur-generaal Belastingdienst.

      3 De onder [artikel 2, eerste lid, onder a t/m g][ref1], genoemde hoofddirecteuren, algemeen directeuren
      en directeur maken vast deel uit van het MT Belastingdienst. De onder artikel 2, eerste lid, onder h en i,
      genoemde directeuren zijn agendalid en kunnen afhankelijk van het te bespreken onderwerp aansluiten bij het MT
      Belastingdienst. Indien de directeur-generaal Belastingdienst dit wenselijk acht, kan ook een persoon die wordt
      vertegenwoordigd door een hoofd-, algemeen directeur of directeur aan de MT-vergadering deelnemen.

      4 Ieder van de deelnemers is onderdeel van het MT Belastingdienst met behoud van de eigen verantwoordelijkheden
      en bevoegdheden.


