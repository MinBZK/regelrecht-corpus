  - number: '4'
    text: |-
      Binnen de gegeven kaders en richtlijnen vanuit het ministerie van Financiën zijn de budgethouders in bijlage
      2 aangewezen alsmede de budgetten waarvoor zij bevoegd zijn. De budgethouders zijn bevoegd verplichtingen
      – met financiële consequenties – aan te gaan en uitgaven goed te keuren binnen hun budgetten en passend
      binnen hun taken en verkregen mandaten met inachtneming van het bepaalde over verscherpt toezicht in
      [artikel 11, tweede lid, Organisatie- en mandaat besluit Ministerie van Financiën][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037135#Artikel11
    url: https://wetten.overheid.nl/BWBR0038862/2018-07-14#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0037135
        artikel: '11'
  - number: '5'
    text: |-
      1 De leden van het MT Belastingdienst (zoals genoemd in [artikel 3, derde lid][ref1]) hebben binnen het kader
      van het jaarplan en binnen eventueel door de bewindspersoon of namens de bewindspersoon door de secretaris-
      generaal of de directeur-generaal Belastingdienst gegeven richtlijnen mandaat tot het nemen van besluiten en
      afdoen van stukken betreffende de beleids-, bedrijfsvoerings- en uitvoeringsaangelegenheden, zoals genoemd in
      [bijlage 1 van het Organisatie- en mandaatbesluit ministerie van Financiën][ref2].

      2 Het mandaat zoals toegekend in het eerste lid kan binnen het kader van hun taken ook worden uitgeoefend door
      functionarissen die daartoe worden gemandateerd in bijlage 2.

      3 De mandaathouder, zoals bedoeld in het tweede lid, treedt over vraagstukken die van politiek gevoelige of
      anderszins zwaarwegende aard zijn in contact met het lid van het MT Belastingdienst waaronder hij ressorteert,
      voordat van bevoegdheden gebruik wordt gemaakt.

      4 De ondertekening van uitgaande stukken zal luiden als volgt:

      *DE MINISTER VAN FINANCIËN, resp. DE STAATSSECRETARIS VAN FINANCIËN,*

      *namens deze,*

      *(handtekening)*

      *gevolgd door naam en functie van de (onder)gemandateerde functionaris.*


      [ref1]: https://wetten.overheid.nl/BWBR0038862#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037135
