---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_drinkwater_bes
regulatory_layer: WET
publication_date: '2016-04-22'
valid_from: '2010-10-10'
bwb_id: BWBR0028180
url: https://wetten.overheid.nl/BWBR0028180/2010-10-10
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel1
  - number: 1.1.a
    text: |-
      *afzonderlijke watervoorziening:* een voorziening ter zake van drinkwater dat niet afkomstig is van een openbare of
      een interne watervoorziening dan wel geleverd wordt in het kader van een commerciële - of openbare activiteit;
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel1
  - number: 1.1.b
    text: |-
      *drinkwater:* alle voor menselijke consumptie bestemd water dat onbehandeld of na behandeling bestemd is voor
      drinken, koken, voedselbereiding of andere huishoudelijke doeleinden;
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel1
  - number: 1.1.c
    text: '*gebouw:* elk pand in gebruik voor bewoning of bedrijfsuitoefening;'
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel1
  - number: 1.1.d
    text: |-
      *inspecteur:* inspecteur als bedoeld in [artikel 24, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028180#Artikel24
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0028180
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 1.1.e
    text: |-
      *intern leidingnet:* een samenstel van leidingen, fittingen en toestellen bestemd voor de distributie van
      drinkwater binnen één gebouw of een aantal in elkaars directe nabijheid liggende en door dat leidingnet met elkaar
      verbonden gebouwen, die de verbinding vormt tussen een interne watervoorziening, een afzonderlijke watervoorziening
      of een openbaar leidingnet en een of meer tappunten in dat gebouw respectievelijk die gebouwen;
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel1
  - number: 1.1.f
    text: |-
      *interne watervoorziening:* de al dan niet voor openbaar gebruik bestemde productie van drinkwater en de
      distributie daarvan via een intern leidingnet;
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel1
  - number: 1.1.g
    text: '*Onze Minister:* Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;'
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel1
  - number: 1.1.h
    text: |-
      *openbaar leidingnet:* een samenstel van leidingen, fittingen en toestellen bestemd voor de distributie van
      drinkwater afkomstig van een openbare watervoorziening, dat ieder die daarop is aangesloten tegen betaling aan
      tappunten kan afnemen;
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel1
  - number: 1.1.i
    text: |-
      *openbare watervoorziening:* de voor openbaar gebruik bestemde productie van drinkwater en de distributie daarvan
      via een openbaar leidingnet;
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel1
  - number: 1.1.j
    text: |-
      *Raad:* de Raad voor het drinkwater, bedoeld in [artikel 19][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028180#Artikel19
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0028180
        artikel: '19'
        hoofdstuk: '3'
  - number: 1.1.k
    text: |-
      *tappunt:* plaats in of aan een gebouw of een andere voor het publiek toegankelijke plaats waar drinkwater voor
      direct gebruik beschikbaar is;
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel1
  - number: 1.1.l
    text: '*toezichthouder:* de door het bestuurscollege aangewezen eilandelijke dienst belast met het toezicht.'
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel1
  - number: '1.2'
    text: |-
      Onder distribueren en distributie wordt in deze wet mede verstaan het leveren en afleveren onderscheidenlijk de
      levering en de aflevering aan een afnemer.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel1
  - number: '2'
    text: |-
      Deze wet is van toepassing op drinkwater ongeacht de herkomst ervan en ongeacht of het water wordt geleverd via een
      openbaar of intern leidingnet dan wel afkomstig is van een afzonderlijke watervoorziening, uit een tankschip of uit
      een tankauto.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel2
  - number: '3'
    text: Deze wet is niet van toepassing op drinkwater dat is verpakt in flessen of andersoortig klein verpakkingsmateriaal.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel3
  - number: '4.1'
    text: |-
      Bij algemene maatregel van bestuur kan, gehoord de inspecteur, op verzoek van het bestuurscollege van de toepassing
      van deze wet en de daarop berustende bepalingen geheel of gedeeltelijk worden uitgezonderd drinkwater:
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel4
  - number: 4.1.a
    text: |-
      dat afkomstig is van een afzonderlijke watervoorziening die gemiddeld minder dan 10m3 water per dag levert of
      waarvan minder dan 50 personen gebruik maken, tenzij het water wordt geleverd in het kader van een commerciële of
      openbare activiteit;
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel4
  - number: 4.1.b
    text: |-
      dat uitsluitend bestemd is voor doeleinden waarvoor de kwaliteit van het water naar de overtuiging van dat
      bestuurscollege direct noch indirect van invloed is op de gezondheid van de betrokken verbruikers.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel4
  - number: '4.2'
    text: |-
      Indien het eerste lid, onder a, toepassing heeft gevonden, is de verleende uitzondering niet van toepassing op
      het drinkwater dat afkomstig is van een afzonderlijke watervoorziening die gemiddeld meer dan 10 m3 water per dag
      levert of waarvan meer dan 50 personen gebruik maken.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel4
  - number: '4.3'
    text: |-
      Voor zover het eerste lid toepassing heeft gevonden, stelt het desbetreffende bestuurscollege ter zake regels
      ter waarborging dat de volksgezondheid wordt beschermd tegen de schadelijke gevolgen van verontreiniging van
      drinkwater. Deze regels zijn zoveel mogelijk in overeenstemming met deze wet en de daarop berustende bepalingen.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel4
  - number: '5.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen, gehoord de inspecteur, deze wet en de daarop berustende bepalingen
      mede geheel of gedeeltelijk van toepassing worden verklaard op eigenaren of beheerders van een collectieve
      watervoorziening of een collectief leidingnet waarop direct of indirect tappunten als bedoeld in het tweede lid,
      zijn aangesloten, voor zover die tappunten aanwezig zijn:
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel5
  - number: 5.1.a
    text: 'in instellingen:'
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel5
  - number: 5.1.a.1
    text: voor medisch-specialistische zorg;
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel5
  - number: 5.1.a.2
    text: |-
      die een of meer vormen van persoonlijke verzorging of behandeling van een psychiatrische aandoening bieden, niet in
      combinatie met verblijf, binnen een op grond van de [Algemene Wet Bijzondere Ziektekosten][ref1] bekostigd gebouw;


      [ref1]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002614
  - number: 5.1.b
    text: |-
      in een gebouw, een gedeelte van een gebouw of een samenhangend geheel van gebouwen of gedeelten daarvan met een
      gebruiksfunctie voor het bieden van recreatief verblijf of tijdelijk onderdak aan mensen, met uitzondering van
      zomerhuisjes, huisjes op volkstuincomplexen en gebouwen waar uitsluitend wordt overnacht door personen die ter
      plaatse werkzaam zijn;
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel5
  - number: 5.1.c
    text: in opvangvoorziening, niet zijnde een woning, hotel of pension, waarin aan asielzoekers opvang wordt geboden;
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel5
  - number: 5.1.d
    text: |-
      in een gebouw, een gedeelte van een gebouw of een samenhangend geheel van gebouwen of gedeelten daarvan met een
      gebruiksfunctie als dwangverblijf van mensen;
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel5
  - number: 5.1.e
    text: |-
      in een badinrichting als bedoeld in
      [artikel 1.2, eerste lid, van de Wet volkshuisvesting, ruimtelijke ordening en milieubeheer BES][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel1
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '1'
  - number: 5.1.f
    text: |-
      op een terrein of plaats, geheel of gedeeltelijk ingericht, en blijkens die inrichting
      bestemd, om daarop ten behoeve van recreatief nachtverblijf gelegenheid te geven tot het
      plaatsen of geplaatst houden van tenten, tentwagens, kampeerauto’s of andere voertuigen of
      gewezen voertuigen of gedeelten daarvan, voor zover geen bouwwerk zijnde, waarvoor ingevolge
      [artikel 2.2, eerste lid, van de Wet volkshuisvesting, ruimtelijke ordening en milieubeheer BES][ref1] een
      bouwvergunning vereist is; een en ander voor zover deze onderkomens of voertuigen geheel of ten dele blijvend zijn
      bestemd of opgericht dan wel worden of kunnen worden gebruikt voor recreatief nachtverblijf;


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel2
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '2'
  - number: 5.1.g
    text: |-
      in een haven met de daarbij behorende grond waar overwegend gelegenheid wordt gegeven voor het aanleggen, afmeren
      of afgemeerd houden van pleziervaartuigen.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel5
  - number: '5.2'
    text: 'Als tappunten, bedoeld in het eerste lid, worden aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel5
  - number: 5.2.a
    text: tappunten met een douche of andere appendage waarmee water kan worden gesproeid of verneveld;
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel5
  - number: 5.2.b
    text: |-
      tappunten die al dan niet tijdelijk gebruikt worden voor het aansluiten van een douche, andere appendage of toestel
      waarmee water kan worden gesproeid of verneveld;
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel5
  - number: 5.2.c
    text: |-
      tappunten waarvan de eigenaar redelijkerwijze kan weten of vermoeden dat deze al dan niet tijdelijk gebruikt worden
      voor het aansluiten van een douche, andere appendage of toestel waarmee water kan worden gesproeid of verneveld;
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel5
  - number: 5.2.d
    text: |-
      alle tappunten in een instelling als bedoeld in het eerste lid, onderdeel a, onder 1, voor zover het een
      afdeling hematologie of oncologie is, dan wel waar transplantaties worden uitgevoerd, of patiënten met chronische
      longaandoeningen of met immuunstoornissen verblijven.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel5
  - number: '6'
    text: |-
      Met de zorg voor het tot stand brengen en instandhouden van een deugdelijke en duurzame voorziening van drinkwater
      voor alle inwoners van een eilandgebied en dat voldoet aan de bij of krachtens deze wet gestelde regels is belast
      het bestuurscollege van het desbetreffende eilandgebied.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel6
  - number: '7'
    text: |-
      Onze Minister kan op verzoek van een bestuurscollege in het belang van de volksgezondheid geheel of gedeeltelijk
      voorzien in faciliteiten, middelen en bijstand die noodzakelijk zijn voor de uitvoering van het bepaalde bij of
      krachtens deze wet en de daaruit voortvloeiende regelgeving in het desbetreffende eilandgebied.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel7
  - number: '8.1'
    text: |-
      Ter zake van beslissingen drinkwater betreffende die het belang van de volksgezondheid raken raadplegen Onze
      Minister en het bestuurscollege alsmede de producenten en distributeurs van drinkwater tenminste de inspecteur.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel8
  - number: '8.2'
    text: |-
      Onverminderd het bepaalde in het eerste lid, raadplegen het bestuurscollege alsmede de producenten en distributeurs
      van drinkwater tevens de toezichthouder in het desbetreffende eilandgebied.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel8
  - number: '9.1'
    text: |-
      Het is in het belang van de volksgezondheid verboden in een eilandgebied drinkwater te produceren of te
      distribueren zonder daartoe strekkende concessie of vergunning van, dan wel overeenkomst met, het bestuurscollege
      van dat eilandgebied.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel9
  - number: '9.2'
    text: |-
      Een concessie of een vergunning als bedoeld in het eerste lid wordt slechts verleend en een overeenkomst als
      bedoeld in dat lid wordt slechts aangegaan indien het belang van de volksgezondheid en het belang van een
      doelmatige voorziening van drinkwater zich daartegen niet verzetten.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel9
  - number: '9.3'
    text: |-
      Indien de productie en distributie van drinkwater in handen is van verschillende bedrijven draagt het
      bestuurscollege zorg dat de desbetreffende concessies, vergunningen of overeenkomsten in het belang van de
      volksgezondheid voorzien in de afstemming van de productie en de distributie op elkaar.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel9
  - number: '10.1'
    text: |-
      Aan een concessie of een vergunning worden voorwaarden verbonden. Een concessie of een vergunning kan onder
      beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel10
  - number: '10.2'
    text: |-
      De in het eerste lid bedoelde voorwaarden of beperkingen hebben ten minste betrekking op de naleving van de bij of
      krachtens deze wet gestelde eisen ter zake van:
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel10
  - number: 10.2.a
    text: de kwaliteit van het drinkwater;
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel10
  - number: 10.2.b
    text: de bij de productie en distributie van drinkwater te gebruiken materialen en chemicaliën;
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel10
  - number: 10.2.c
    text: de levering van het drinkwater;
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel10
  - number: 10.2.d
    text: voor de levering van drinkwater op te stellen en bekend te maken algemene voorwaarden;
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel10
  - number: 10.2.e
    text: |-
      de hoeveelheid te produceren water en de druk waarmee het water via een openbaar of intern leidingnet aan tappunten
      beschikbaar komt;
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel10
  - number: 10.2.f
    text: wijziging in de productie of in de distributie;
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel10
  - number: 10.2.g
    text: het regelmatig onderhoud van het leidingnet;
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel10
  - number: 10.2.h
    text: de regelmatige controle van de kwaliteit van het drinkwater;
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel10
  - number: 10.2.i
    text: |-
      de melding van elke daling van de waterkwaliteit beneden het niveau van de bij [artikel 12, eerste lid][ref1], of
      krachtens artikel 12, tweede lid, gestelde eisen;


      [ref1]: https://wetten.overheid.nl/BWBR0028180#Artikel12
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0028180
        artikel: '12'
        hoofdstuk: '2'
  - number: 10.2.j
    text: |-
      de te treffen maatregelen ter voorkoming van gevaar voor de volksgezondheid in geval van daling van de
      waterkwaliteit beneden het niveau van de bij [artikel 12, eerste lid][ref1], of krachtens artikel 12, tweede lid,
      gestelde eisen;


      [ref1]: https://wetten.overheid.nl/BWBR0028180#Artikel12
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0028180
        artikel: '12'
        hoofdstuk: '2'
  - number: 10.2.k
    text: |-
      de te treffen maatregelen voor het zo spoedig mogelijk herstel van de waterkwaliteit op tenminste het niveau van de
      bij [artikel 12, eerste lid][ref1], of krachtens artikel 12, tweede lid, gestelde eisen;


      [ref1]: https://wetten.overheid.nl/BWBR0028180#Artikel12
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0028180
        artikel: '12'
        hoofdstuk: '2'
  - number: 10.2.l
    text: de rapportage ter zake van kwaliteitscontrole;
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel10
  - number: 10.2.m
    text: |-
      de vakbekwaamheid van het personeel werkzaam bij producenten of distributeurs van drinkwater en de door hen in acht
      te nemen technische en hygiënische eisen; en
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel10
  - number: 10.2.n
    text: de voorlichting aan afnemers van drinkwater.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel10
  - number: '10.3'
    text: |-
      Indien ter zake van de productie of distributie van drinkwater een overeenkomst wordt gesloten bevat deze
      overeenkomst ten minste bepalingen overeenkomende met de in het tweede lid bedoelde voorwaarden of beperkingen.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel10
  - number: '10.4'
    text: |-
      Het is een producent of distributeur van drinkwater verboden te handelen in strijd met: de bij of krachtens deze
      wet gegeven voorschriften; de voorwaarden die aan een concessie of vergunning zijn verbonden; de beperkingen
      waaronder een concessie of vergunning is verleend; de bepalingen van een overeenkomst als bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel10
  - number: '11'
    text: |-
      De producent of distributeur van drinkwater draagt zorg voor de productie respectievelijk de distributie van
      drinkwater dat in overeenstemming is met de in [artikel 12, eerste lid][ref1], gestelde eis en de in artikel
      12, tweede lid, bedoelde kwaliteitseisen in zodanige hoeveelheid en onder zodanige druk als het belang van de
      volksgezondheid vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0028180#Artikel12
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0028180
        artikel: '12'
        hoofdstuk: '2'
  - number: '12.1'
    text: |-
      Drinkwater bevat geen micro-organismen, parasieten of andere stoffen in hoeveelheden of concentraties die een
      gevaar kunnen opleveren voor de volksgezondheid.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel12
  - number: '12.2'
    text: |-
      Drinkwater voldoet aan bij of krachtens algemene maatregel van bestuur, gestelde minimum kwaliteitseisen. Deze
      eisen kunnen ook betrekking hebben op de door de producenten en distributeurs van drinkwater bij de winning,
      bereiding, behandeling, opslag, transport en distributie van zodanig water te gebruiken infrastructuur, materialen
      en chemicaliën.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel12
  - number: '12.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur, wordt vastgesteld door wie, waar, wanneer en op welke wijze wordt
      gecontroleerd of drinkwater voldoet aan de bij het eerste lid en krachtens het tweede lid gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel12
  - number: '12.4'
    text: 'Bij of krachtens algemene maatregel van bestuur, kunnen voorts regels worden gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel12
  - number: 12.4.a
    text: de waarborging van de kwaliteit van de bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel12
  - number: 12.4.b
    text: de vakbekwaamheid van het personeel dat werkzaam is bij producenten en distributeurs van drinkwater;
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel12
  - number: 12.4.c
    text: gezondheidseisen te stellen aan het onder c bedoelde personeel;
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel12
  - number: 12.4.d
    text: de door het onder c bedoelde personeel in acht te nemen hygiënische eisen;
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel12
  - number: 12.4.e
    text: 'de voorlichting door producenten en distributeurs van drinkwater aan hun afnemers en gebruikers:'
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel12
  - number: 12.4.e.1°
    text: ter zake van de kwaliteit van het te leveren drinkwater;
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel12
  - number: 12.4.e.2°
    text: indien het gebruik van het water een gevaar kan opleveren voor de volksgezondheid;
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel12
  - number: 12.4.e.3°
    text: |-
      ter zake van te treffen herstelmaatregelen indien het drinkwater aan het tappunt niet voldoet aan de bij het eerste
      lid of krachtens het tweede lid gestelde eisen of anderszins ondeugdelijk is en zulks is te wijten aan een intern
      leidingnet.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel12
  - number: '12.5'
    text: |-
      In het geval dat ingevolge de in het tweede, derde of vierde lid, bedoelde algemene maatregelen van bestuur, nog
      niet in de aanpak van een bepaald probleem kan worden voorzien, kunnen, indien gevaar voor de volksgezondheid
      direct ingrijpen vereist, de regels bedoeld in het tweede, derde en vierde lid, in afwachting van de totstandkoming
      van een in die leden bedoelde algemene maatregel van bestuur, tijdelijk bij ministeriële regeling worden
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel12
  - number: '12.6'
    text: |-
      Een ministeriële regeling als bedoeld in het vijfde lid vervalt na verloop van een termijn van zes maanden nadat
      zij in werking is getreden, dan wel, indien binnen die termijn een algemene maatregel van bestuur, ter vervanging
      van die ministeriële regeling in werking getreden is, met ingang van het tijdstip waarop een zodanige algemene
      maatregel van bestuur in werking getreden is.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel12
  - number: '13.1'
    text: |-
      Indien drinkwater niet voldoet aan de bij [artikel 12, eerste lid][ref1], of krachtens artikel 12, tweede lid,
      gestelde eisen:


      [ref1]: https://wetten.overheid.nl/BWBR0028180#Artikel12
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0028180
        artikel: '12'
        hoofdstuk: '2'
  - number: 13.1.a
    text: |-
      stelt de producent of de distributeur onmiddellijk een onderzoek naar de oorzaak daarvan en de mogelijke nadelige
      gevolgen daarvan voor de volksgezondheid;
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel13
  - number: 13.1.b
    text: |-
      stelt de producent respectievelijk de distributeur onmiddellijk de toezichthouder in kennis van het feit dat het
      water niet langer voldoet aan de bij [artikel 12, eerste lid][ref1] of krachtens artikel 12, tweede lid, gestelde
      eisen alsmede van de wijze waarop uitvoering wordt gegeven aan het in de onderdelen a en c bepaalde;


      [ref1]: https://wetten.overheid.nl/BWBR0028180#Artikel12
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0028180
        artikel: '12'
        hoofdstuk: '2'
  - number: 13.1.c
    text: |-
      treft de producent of de distributeur zo spoedig mogelijk de nodige herstelmaatregelen om de kwaliteit weer op
      het peil te brengen dat tenminste gelijk is aan het niveau van de bij [artikel 12, eerste lid][ref1], of krachtens
      artikel 12, tweede lid, gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0028180#Artikel12
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0028180
        artikel: '12'
        hoofdstuk: '2'
  - number: '13.2'
    text: De toezichthouder stelt terstond het bestuurscollege en de inspecteur hiervan in kennis.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel13
  - number: '13.3'
    text: |-
      Het bestuurscollege draagt zorg dat, indien er herstelmaatregelen worden genomen die de volksgezondheid raken,
      de producent of distributeur de gebruikers hiervan zo spoedig mogelijk in kennis stellen. Bij die gelegenheid
      worden de gebruikers tevens voorgelicht over door hen te nemen maatregelen om eventuele nadelige gevolgen voor de
      gezondheid te voorkomen.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel13
  - number: '13.4'
    text: |-
      Het derde lid vindt geen toepassing indien de toezichthouder van oordeel is dat de mate waarin niet wordt voldaan
      aan de bij [artikel 12, eerste lid][ref1], en krachtens artikel 12, tweede lid, gestelde eisen niet van betekenis
      is en er geen gevaar voor de volksgezondheid is te duchten.


      [ref1]: https://wetten.overheid.nl/BWBR0028180#Artikel12
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0028180
        artikel: '12'
        hoofdstuk: '2'
  - number: '13.5'
    text: |-
      Indien wordt vastgesteld dat het niet voldoen aan de bij [artikel 12, eerste lid][ref1] of krachtens artikel 12,
      tweede lid, gestelde eisen, is te wijten aan het desbetreffende interne leidingnet of het onderhoud daarvan, zijn
      het eerste en tweede lid niet van toepassing. In een dergelijk geval is de producent of de distributeur van het
      desbetreffende drinkwater gehouden de eigenaar of gebruiker van het interne leidingnet hiervan op de hoogte te
      stellen en deze te adviseren over mogelijke te treffen herstelmaatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0028180#Artikel12
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0028180
        artikel: '12'
        hoofdstuk: '2'
  - number: '13.6'
    text: |-
      Het eerste tot en met vijfde lid is niet van toepassing indien het afwijken van de bij
      [artikel 12, eerste lid][ref1], of krachtens artikel 12, tweede lid, gestelde eisen tijdelijk van aard is en wordt
      veroorzaakt door onderhoud aan het leidingnet.


      [ref1]: https://wetten.overheid.nl/BWBR0028180#Artikel12
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0028180
        artikel: '12'
        hoofdstuk: '2'
  - number: '14.1'
    text: |-
      Het onderzoek naar de kwaliteit van het drinkwater, bedoeld in [artikel 12, eerste en tweede lid][ref1], geschiedt
      met behulp van laboratoriumtesten. Zodanige testen geschieden uitsluitend door of op verzoek van een laboratorium
      dat door Onze Minister daartoe is aangewezen met in achtneming van bij algemene maatregel van bestuur, te stellen
      regels.


      [ref1]: https://wetten.overheid.nl/BWBR0028180#Artikel12
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0028180
        artikel: '12'
        hoofdstuk: '2'
  - number: '14.2'
    text: |-
      Indien het in het eerste lid bedoelde laboratorium bij het testen constateert dat het drinkwater niet voldoet aan
      de bij [artikel 12, eerste lid][ref1], of krachtens artikel 12, tweede lid, gestelde eisen, stelt het onmiddellijk
      de producent of distributeur en de toezichthouder hiervan in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0028180#Artikel12
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0028180
        artikel: '12'
        hoofdstuk: '2'
  - number: '14.3'
    text: De toezichthouder stelt vervolgens onmiddellijk het bestuurscollege en de inspecteur hiervan in kennis.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel14
  - number: '15.1'
    text: |-
      Het bestuurscollege kan ter zake van drinkwater dat een gevaar kan opleveren voor de volksgezondheid, na overleg
      met de producent of distributeur van het desbetreffende drinkwater en gehoord de toezichthouder, de producent of
      distributeur:
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel15
  - number: 15.1.a
    text: verplichten maatregelen te treffen ter bescherming van de volksgezondheid;
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel15
  - number: 15.1.b
    text: verplichten het gebruik hiervan in te perken; of
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel15
  - number: 15.1.c
    text: verbieden dit verder te produceren of te distribueren.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel15
  - number: '15.2'
    text: |-
      In gevallen als bedoeld in het eerste lid stelt het bestuurscollege of de producent respectievelijk de distributeur
      de gebruikers zo spoedig mogelijk hiervan in kennis. Daarbij wordt zonodig advies verstrekt over het watergebruik.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel15
  - number: '15.3'
    text: |-
      Bij de beoordeling of en zo ja welke maatregelen, bedoeld in het eerste lid, onder a, noodzakelijk zijn, wordt
      rekening gehouden met de risico’s die onderbreking van de levering of inperking van het gebruik van drinkwater zou
      kunnen opleveren voor de volksgezondheid.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel15
  - number: '16.1'
    text: |-
      Indien het belang van de volksgezondheid zich daar niet tegen verzet, kan de toezichthouder op verzoek van de
      producent of distributeur van drinkwater toestemming geven de productie of distributie in strijd met de bij of
      krachtens [artikel 12][ref1] gegeven voorschriften gedurende een beperkte tijd voort te zetten in afwachting van de
      behandeling van een verzoek om ontheffing als bedoeld in [artikel 17, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028180#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0028180#Artikel17
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0028180
        artikel: '12'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0028180
        artikel: '17'
        hoofdstuk: '2'
  - number: '16.2'
    text: De toezichthouder stelt terstond de inspecteur van een zodanige toestemming in kennis.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel16
  - number: '17.1'
    text: |-
      Indien het belang van de volksgezondheid zich daar niet tegen verzet, kan het bestuurscollege op verzoek van
      de producent of distributeur van drinkwater, gehoord de inspecteur, tijdelijk overeenkomstig bij algemene
      maatregel van bestuur, te stellen regels ontheffing verlenen van de naleving van een of meer van de krachtens
      [artikel 12, tweede, derde en vierde lid][ref1], gegeven voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0028180#Artikel12
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0028180
        artikel: '12'
        hoofdstuk: '2'
  - number: '17.2'
    text: Een ontheffing kan onder beperkingen worden verleend en aan een ontheffing kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel17
  - number: '18.1'
    text: |-
      De in een intern leidingnet of een openbaar leidingnet gebezigde materialen voldoen tenminste aan de bij of
      krachtens [artikel 12, tweede lid][ref1], gestelde voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0028180#Artikel12
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0028180
        artikel: '12'
        hoofdstuk: '2'
  - number: '18.2'
    text: 'In het belang van de volksgezondheid wordt:'
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel18
  - number: 18.2.a
    text: |-
      een intern leidingnet niet in gebruik genomen indien dit niet door de producent of distributeur is goedgekeurd
      overeenkomstig bij eilandsverordening te stellen regels.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel18
  - number: 18.2.b
    text: |-
      een openbaar leidingnet niet in gebruik genomen indien dit niet door de toezichthouder is goedgekeurd
      overeenkomstig bij algemene maatregel van bestuur, te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel18
  - number: '18.3'
    text: Het eerste lid geldt mede ten aanzien van elke wijziging in het desbetreffende leidingnet.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel18
  - number: '19'
    text: Er is een Raad voor het drinkwater.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel19
  - number: '20'
    text: 'De Raad heeft tot taak:'
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel20
  - number: 20.a
    text: 'het desgevraagd of uit eigen beweging uitbrengen van advies over aangelegenheden drinkwater betreffende aan:'
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel20
  - number: 20.a.1°
    text: Onze Minister,
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel20
  - number: 20.a.2°
    text: het bestuurscollege, en
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel20
  - number: 20.a.3°
    text: de producenten en distributeurs van drinkwater.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel20
  - number: 20.b
    text: 'het uitbrengen van advies over ontwerpen van:'
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel20
  - number: 20.b.1°
    text: wijziging van deze wet;
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel20
  - number: 20.b.2°
    text: algemene maatregelen van bestuur en ministeriële regelingen ter uitvoering van deze wet;
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel20
  - number: 20.b.3°
    text: |-
      eilandelijke ontwerp-regelgeving ter zake van drinkwater en de productie of distributie daarvan voor zover aan de
      Raad om advies voorgelegd.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel20
  - number: '21.1'
    text: |-
      De Raad bestaat uit ten hoogste vijf leden, waaronder een voorzitter. De leden worden telkens voor een periode van
      vijf jaren bij koninklijk besluit op de voordracht van Onze Minister handelende in overeenstemming met het gevoelen
      van de Raad van Ministers benoemd, met dien verstande dat de eerste zittingsperiode voor de helft van de leden
      wordt gesteld op twee en een half jaar.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel21
  - number: '21.2'
    text: Tot lid worden benoemd zij die deskundig zijn ter zake van drinkwater.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel21
  - number: '21.3'
    text: Gewezen leden van de Raad zijn terstond herbenoembaar.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel21
  - number: '21.4'
    text: |-
      De Raad kan in het belang van de volksgezondheid advies inwinnen van externe deskundigen. Indien hieraan kosten
      verbonden zijn is voorafgaande instemming van Onze Minister vereist, tenzij de kosten niet op de begroting van het
      Ministerie van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer zullen drukken.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel21
  - number: '21.5'
    text: De Raad kiest uit zijn midden een voorzitter.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel21
  - number: '21.6'
    text: Vervallen.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel21
  - number: '22.1'
    text: De Raad stelt een reglement van orde op dat de goedkeuring van Onze Minister behoeft.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel22
  - number: '22.2'
    text: |-
      Jaarlijks dient de Raad vóór 1 april bij Onze Minister een begroting in ter zake van de geraamde uitgaven in het
      daarop volgende jaar. Na afloop van het kalenderjaar legt de Raad binnen vier maanden schriftelijk verantwoording
      af aan Onze Minister over de verrichte werkzaamheden. Daartoe behoort mede een overzicht van het financieel beheer.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel22
  - number: '23.1'
    text: |-
      De Raad is bevoegd tot het horen van producenten en distributeurs van drinkwater, deskundigen, maatschappelijke
      organisaties en andere betrokkenen ten einde informatie te verkrijgen die noodzakelijk is voor het voorbereiden van
      een advies.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel23
  - number: '23.2'
    text: |-
      De Raad is voorts bevoegd voor zover zulks strekt ten behoeve van zijn werkzaamheden stukken die berusten onder
      producenten en distributeurs van drinkwater, deskundigen, maatschappelijke organisaties en andere betrokkenen,
      op te vragen of daarvan ter plekke inzage te nemen met uitzondering van stukken die betrekking hebben op of te
      herleiden zijn tot individuele personen, tenzij deze geanonimiseerd zijn.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel23
  - number: '24.1'
    text: |-
      Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde, zijn belast de bij besluit van Onze
      Minister aangewezen inspecteur en de overige daartoe aangewezen ambtenaren. Ambtenaren, ressorterende onder een
      ander dan zijn ministerie, wijst hij niet aan dan in overeenstemming met Onze betrokken Minister onder wiens
      ministerie zij ressorteren.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel24
  - number: '24.2'
    text: |-
      Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde binnen hun ambtsgebied zijn eveneens
      belast de bij besluit van het bestuurscollege aangewezen personen die werkzaam zijn bij de toezichthouder.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel24
  - number: '24.3'
    text: Van een besluit als bedoeld in het eerste en tweede lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel24
  - number: '24.4'
    text: |-
      De krachtens het eerste of tweede lid aangewezen personen zijn, uitsluitend voor zover dat voor de vervulling van
      hun taak redelijkerwijze noodzakelijk is, bevoegd:
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel24
  - number: 24.4.a
    text: alle inlichtingen te vragen;
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel24
  - number: 24.4.b
    text: |-
      inzage te verlangen van alle boeken, bescheiden en andere informatiedragers en daarvan afschrift te nemen of deze
      daartoe tijdelijk mee te nemen;
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel24
  - number: 24.4.c
    text: |-
      goederen aan opneming en onderzoek te onderwerpen, deze daartoe tijdelijk mee te nemen en daarvan monsters te
      nemen;
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel24
  - number: 24.4.d
    text: |-
      alle plaatsen met uitzondering van woningen zonder de uitdrukkelijke toestemming van de bewoner te betreden,
      eventueel vergezeld van door hen aangewezen personen;
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel24
  - number: 24.4.e
    text: |-
      woningen of tot woning bestemde gedeelten van vaartuigen zonder de uitdrukkelijke toestemming van de bewoner binnen
      te treden.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel24
  - number: '24.5'
    text: |-
      Zo nodig, wordt de toegang tot een plaats als bedoeld in het vierde lid, onderdeel d, verschaft met behulp van de
      sterke arm.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel24
  - number: '24.6'
    text: |-
      Op het binnentreden van woningen of van tot woning bestemde gedeelten van vaartuigen als bedoeld in het
      vierde lid, onderdeel e, is [Titel 4 van het Derde Boek van het Wetboek van Strafvordering BES][ref1] van
      overeenkomstige toepassing, met uitzondering van de [artikelen 155, vierde lid][ref2], [156, tweede lid][ref3],
      [157, tweede en derde lid][ref4], [158, eerste lid, laatste zinsnede][ref5], en [160, eerste lid][ref6], en met
      dien verstande dat de machtiging wordt verleend door de procureur-generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0028681
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel155
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel156
      [ref4]: https://wetten.overheid.nl/BWBR0028681#Artikel157
      [ref5]: https://wetten.overheid.nl/BWBR0028681#Artikel158
      [ref6]: https://wetten.overheid.nl/BWBR0028681#Artikel160
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0028681
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '155'
      - id: ref3
        bwb_id: BWBR0028681
        artikel: '156'
      - id: ref4
        bwb_id: BWBR0028681
        artikel: '157'
      - id: ref5
        bwb_id: BWBR0028681
        artikel: '158'
      - id: ref6
        bwb_id: BWBR0028681
        artikel: '160'
  - number: '24.7'
    text: |-
      Een ieder is verplicht aan de krachtens het eerste of tweede lid aangewezen personen alle medewerking te verlenen
      die op grond van het derde lid wordt gevorderd.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel24
  - number: '24.8'
    text: |-
      Zij die uit hoofde van ambt, beroep of wettelijk voorschrift verplicht zijn tot geheimhouding, kunnen het verlenen
      van medewerking weigeren, voor zover dit uit hun geheimhoudingsplicht voortvloeit.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel24
  - number: '25.1'
    text: |-
      Bij de uitoefening van hun taak dragen de krachtens [artikel 24, eerste of tweede lid][ref1], aangewezen personen
      een door het desbetreffende bestuurscollege te verstrekken legitimatiebewijs bij zich.


      [ref1]: https://wetten.overheid.nl/BWBR0028180#Artikel24
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0028180
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '25.2'
    text: Desgevraagd tonen zij hun legitimatiebewijs aanstonds.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel25
  - number: '25.3'
    text: |-
      Het legitimatiebewijs bevat een foto van de krachtens [artikel 24, eerste of tweede lid][ref1], aangewezen persoon
      en vermeldt in ieder geval diens naam en hoedanigheid.


      [ref1]: https://wetten.overheid.nl/BWBR0028180#Artikel24
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0028180
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '25.4'
    text: |-
      Bij algemene maatregel van bestuur, kunnen regels worden gesteld met betrekking tot de wijze van taakuitoefening
      van de krachtens [artikel 24, eerste of tweede lid][ref1], aangewezen personen.


      [ref1]: https://wetten.overheid.nl/BWBR0028180#Artikel24
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0028180
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '26'
    text: |-
      Het bestuurscollege is bevoegd tot het doen wegnemen, ontruimen, beletten, in de vorige toestand herstellen of
      verrichten van hetgeen in strijd met de in deze wet en de daarop berustende bepalingen is of wordt gedaan, gehouden
      of nagelaten.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel26
  - number: '27.1'
    text: |-
      Een beslissing tot toepassing van bestuursdwang wordt op schrift gesteld en geldt als een beschikking. De
      beschikking vermeldt welk voorschrift is overtreden.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel27
  - number: '27.2'
    text: De bekendmaking ervan geschiedt aan de overtreder en andere rechthebbenden.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel27
  - number: '27.3'
    text: |-
      In de beschikking wordt een termijn gesteld waarbinnen de overtreder en eventuele andere rechthebbenden de
      tenuitvoerlegging kunnen voorkomen door zelf de in de beschikking vermelde maatregelen te treffen. Geen termijn
      behoeft te worden gegund, indien de vereiste spoed zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel27
  - number: '27.4'
    text: |-
      Indien de situatie dermate spoedeisend is dat het bestuurscollege de beslissing tot toepassing van bestuursdwang
      niet tevoren op schrift kan stellen, zorgt het bestuurscollege alsnog zo spoedig mogelijk voor de opschriftstelling
      en de bekendmaking.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel27
  - number: '28.1'
    text: |-
      De overtreder is de kosten verbonden aan de toepassing van bestuursdwang verschuldigd, tenzij de kosten
      redelijkerwijze niet of niet geheel te zijnen laste behoren te komen.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel28
  - number: '28.2'
    text: De beschikking vermeldt dat de toepassing van bestuursdwang op kosten van de overtreder plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel28
  - number: '28.3'
    text: |-
      Indien echter de kosten geheel of gedeeltelijk niet ten laste van de overtreder zullen worden gebracht, wordt dat
      in de beschikking vermeld.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel28
  - number: '28.4'
    text: |-
      Onder de kosten worden begrepen de kosten verbonden aan de voorbereiding van bestuursdwang, voor zover deze kosten
      zijn gemaakt na het tijdstip waarop de termijn bedoeld in [artikel 27, derde lid][ref1], is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0028180#Artikel27
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0028180
        artikel: '27'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '28.5'
    text: |-
      De kosten zijn ook verschuldigd indien de bestuursdwang door opheffing van de onrechtmatige situatie niet of niet
      volledig is uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel28
  - number: '29.1'
    text: |-
      Het bestuurscollege kan van de overtreder bij dwangbevel de verschuldigde kosten, verhoogd met de op de invordering
      vallende kosten, invorderen.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel29
  - number: '29.2'
    text: |-
      Het dwangbevel wordt op kosten van de overtreder bij deurwaardersexploit betekend en levert een executoriale titel
      op in de zin van het [Wetboek van Burgerlijke Rechtsvordering BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028496
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0028496
  - number: '29.3'
    text: |-
      Gedurende zes weken na de dag van betekening staat verzet tegen het dwangbevel open door dagvaarding van het
      eilandgebied.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel29
  - number: '29.4'
    text: |-
      Het verzet schorst de tenuitvoerlegging. Op verzoek van het eilandgebied kan het gerecht in eerste aanleg de
      schorsing van de tenuitvoerlegging opheffen.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel29
  - number: '30'
    text: |-
      De kosten verbonden aan de toepassing van bestuursdwang zijn bevoorrecht op de zaak ten aanzien waarvan zij zijn
      besteed en worden na de kosten, bedoeld in [Boek 3, artikel 284, van het Burgerlijk Wetboek BES][ref1], uit de
      opbrengst van de zaak betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel284
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '284'
  - number: '31'
    text: |-
      Om aan een beslissing van bestuursdwang uitvoering te geven, komen de personen die daartoe door het bestuurscollege
      zijn aangewezen, de bevoegdheden toe, genoemd in [artikel 24, tweede en derde lid][ref1]. Artikel 24, vierde lid,
      is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028180#Artikel24
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0028180
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '32'
    text: |-
      Tot de bevoegdheid tot toepassing van bestuursdwang behoort het verzegelen van gebouwen, terreinen en hetgeen zich
      daarin of daarop bevindt.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel32
  - number: '33.1'
    text: |-
      Tot de bevoegdheid tot toepassing van bestuursdwang behoort het meevoeren en opslaan van daarvoor vatbare zaken
      voor zover de toepassing van bestuursdwang dit vereist.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel33
  - number: '33.2'
    text: |-
      Indien zaken zijn meegevoerd en opgeslagen, doet het bestuurscollege daarvan proces-verbaal opmaken, waarvan
      afschrift wordt verstrekt aan de rechthebbende.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel33
  - number: '33.3'
    text: |-
      Het bestuurscollege draagt zorg voor de bewaring van de opgeslagen zaken en geeft deze zaken terug aan de
      rechthebbende, zodra dat redelijkerwijze nodig is.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel33
  - number: '33.4'
    text: |-
      Het bestuurscollege is bevoegd de afgifte op te schorten totdat de verschuldigde kosten zijn voldaan. Indien de
      rechthebbende niet tevens de overtreder is, is het bestuurscollege bevoegd de afgifte op te schorten totdat de
      kosten van bewaring zijn voldaan.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel33
  - number: '33.5'
    text: |-
      Het eilandgebied is, behoudens in geval van onzorgvuldig handelen, niet aansprakelijk voor afgifte van het
      opgeslagene aan een onbevoegde.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel33
  - number: '34.1'
    text: |-
      Het bestuurscollege is bevoegd indien een opgeslagen zaak niet binnen dertien weken na de opslag kan worden
      teruggegeven aan de rechthebbende, deze te doen verkopen of, indien verkoop naar zijn oordeel niet mogelijk is, de
      zaak om niet aan een derde in eigendom over te dragen of te laten vernietigen.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel34
  - number: '34.2'
    text: |-
      Gelijke bevoegdheid heeft het bestuurscollege ook binnen die termijn zodra de aan de toepassing van bestuursdwang
      verbonden kosten vermeerderd met de voor de verkoop, de eigendomsoverdracht om niet of de vernietiging geraamde
      kosten, in verhouding tot de waarde van de zaak onevenredig hoog worden.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel34
  - number: '34.3'
    text: |-
      Verkoop, eigendomsoverdracht of vernietiging vindt niet plaats binnen twee weken na de verstrekking van het
      afschrift van het proces-verbaal betreffende het meevoeren en opslaan, tenzij het gevaarlijke stoffen of eerder aan
      bederf onderhevige stoffen betreft.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel34
  - number: '34.4'
    text: |-
      Gedurende drie jaren na het tijdstip van verkoop heeft degene die op dat tijdstip rechthebbende was, recht op de
      opbrengst van het goed onder aftrek van de aan de toepassing van bestuursdwang verbonden kosten en de kosten van de
      verkoop. Indien de rechthebbende niet tevens de overtreder is, wordt van de opbrengst de kosten van bestuursdwang
      niet in mindering gebracht.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel34
  - number: '34.5'
    text: |-
      Het openbaar lichaam Bonaire, Sint Eustatius of Saba is, behoudens in geval van onzorgvuldig handelen, niet
      aansprakelijk voor afgifte van de opbrengst uit de verkoop aan een onbevoegde.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel34
  - number: '35.1'
    text: |-
      Het bestuurscollege kan in plaats van het uitoefenen van bestuursdwang aan de overtreder een last onder dwangsom
      opleggen, die ertoe strekt de overtreding ongedaan te maken dan wel een herhaling van de overtreding te voorkomen.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel35
  - number: '35.2'
    text: |-
      Een last onder dwangsom wordt niet opgelegd indien het belang dat het betrokken voorschrift beoogt te beschermen
      zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel35
  - number: '35.3'
    text: |-
      Het bestuurscollege stelt de dwangsom vast hetzij op een bedrag ineens hetzij op een bedrag per tijdseenheid waarin
      de last niet is uitgevoerd of op een bedrag per overtreding van de last. Het bestuurscollege stelt tevens een
      bedrag vast waarboven geen dwangsom meer wordt verbeurd. Het vastgestelde bedrag van de dwangsom dient in redelijke
      verhouding te staan tot de zwaarte van het geschonden belang en de beoogde werking van de dwangsomoplegging.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel35
  - number: '35.4'
    text: |-
      In de beschikking tot oplegging van een last onder dwangsom die strekt tot het ongedaan maken of het beëindigen
      wordt een termijn gesteld gedurende welke de overtreder de last kan uitvoeren zonder dat een dwangsom wordt
      verbeurd.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel35
  - number: '36.1'
    text: |-
      Verbeurde dwangsommen komen toe aan het desbetreffende openbaar lichaam Bonaire, Sint Eustatius of Saba. Het
      bestuurscollege kan bij dwangbevel het verschuldigde bedrag invorderen.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel36
  - number: '36.2'
    text: |-
      [Artikel 29, tweede, derde en vierde lid][ref1], zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028180#Artikel29
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0028180
        artikel: '29'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '37.1'
    text: |-
      Het bestuurscollege kan op verzoek van de overtreder de last opheffen, de looptijd ervan opschorten voor
      een bepaalde termijn of de dwangsom verminderen ingeval van blijvende of tijdelijke gehele of gedeeltelijke
      onmogelijkheid voor de overtreder om aan zijn verplichtingen te voldoen.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel37
  - number: '37.2'
    text: |-
      Het bestuurscollege kan op verzoek van de overtreder de last opheffen indien de beschikking een jaar van kracht is
      geweest zonder dat de dwangsom is verbeurd.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel37
  - number: '38.1'
    text: |-
      De bevoegdheid tot invordering van verbeurde bedragen verjaart door verloop van een jaar na de dag waarop zij zijn
      verbeurd.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel38
  - number: '38.2'
    text: De verjaring wordt gestuit door faillissement en ieder wettelijk beletsel voor invordering van de dwangsom.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel38
  - number: '39.1'
    text: |-
      Met de opsporing van de bij [artikel 40][ref1] strafbaar gestelde feiten zijn, naast de in
      [artikel 184 van het Wetboek van Strafvordering BES][ref2], de krachtens [artikel 24, eerste en tweede lid][ref3],
      aangewezen personen belast.


      [ref1]: https://wetten.overheid.nl/BWBR0028180#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel184
      [ref3]: https://wetten.overheid.nl/BWBR0028180#Artikel24
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0028180
        artikel: '40'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '184'
      - id: ref3
        bwb_id: BWBR0028180
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '39.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld omtrent de vereisten waaraan de ingevolge het
      eerste lid aangewezen personen dienen te voldoen.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel39
  - number: '40.1'
    text: |-
      Overtreding van de in de [artikelen 9, eerste lid][ref1], en [10, vierde lid][ref2], gestelde verboden is:


      [ref1]: https://wetten.overheid.nl/BWBR0028180#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0028180#Artikel10
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0028180
        artikel: '9'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0028180
        artikel: '10'
        hoofdstuk: '2'
  - number: 40.1.a
    text: |-
      voor zover opzettelijk begaan, een misdrijf en wordt gestraft met gevangenisstraf van ten hoogste zes jaren of
      geldboete van de vijfde categorie;
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel40
  - number: 40.1.b
    text: |-
      voor zover geen misdrijf, een overtreding en wordt gestraft met hechtenis van ten hoogste een jaar of geldboete van
      de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel40
  - number: '40.2'
    text: |-
      Degene die verontreiniging van het drinkwater veroorzaakt, zodanig dat door de betrokken producent of distributeur
      niet meer wordt voldaan aan [artikel 12, eerste lid][ref1], of de krachtens artikel 12, tweede lid, bij algemene
      maatregel van bestuur, gestelde regels ter zake van de kwaliteit van het drinkwater, begaat:


      [ref1]: https://wetten.overheid.nl/BWBR0028180#Artikel12
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0028180
        artikel: '12'
        hoofdstuk: '2'
  - number: 40.2.a
    text: |-
      voor zover opzettelijk, een misdrijf en wordt gestraft met gevangenisstraf van ten hoogste zes jaren of geldboete
      van de vijfde categorie;
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel40
  - number: 40.2.b
    text: |-
      voor zover geen misdrijf, een overtreding en wordt gestraft met hechtenis van ten hoogste een jaar of geldboete van
      de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel40
  - number: '41'
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel41
  - number: '42.1'
    text: |-
      Onze Minister stelt een maal per vijf jaren, gehoord de Raad voor het drinkwater, een beleidsplan vast ter zake van
      drinkwater dat de openbare lichamen Bonaire, Sint Eustatius en Saba omvat.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel42
  - number: '42.2'
    text: Onze Minister bereidt het in het eerste lid bedoelde plan voor in nauw overleg met het bestuurscollege.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel42
  - number: '42.3'
    text: |-
      Het plan heeft in het bijzonder betrekking op de gezondheidsaspecten van de voorziening van drinkwater alsmede
      op de coördinerende en ondersteunende taken van Onze Minister terzake jegens de openbare lichamen Bonaire, Sint
      Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel42
  - number: '42.4'
    text: |-
      Onze Minister stelt de inspecteur in de gelegenheid haar zienswijze te geven over het ontwerp van het beleidsplan
      voordat het aan de Staten-Generaal wordt aangeboden.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel42
  - number: '42.5'
    text: Onze Minister zendt een exemplaar van het beleidsplan aan de Staten-Generaal, de inspecteur en het bestuurscollege.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel42
  - number: '43'
    text: |-
      Jaarlijks vóór 1 september brengt Onze Minister verslag uit over de stand van zaken met betrekking tot de
      uitvoering van het in [artikel 42][ref1] bedoelde beleidsplan aan de Staten-Generaal. Het verslag bevat voorts
      alle relevante informatie over de op de openbare lichamen Bonaire, Sint Eustatius en Saba van belang zijnde
      gebeurtenissen ter zake van drinkwater gedurende de verslagperiode. Onze Minister zendt een exemplaar van het
      verslag tevens aan het bestuurscollege en de inspecteur.


      [ref1]: https://wetten.overheid.nl/BWBR0028180#Artikel42
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0028180
        artikel: '42'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '44.1'
    text: |-
      Het bestuurscollege stelt een maal per vijf jaren, gehoord de Raad voor het Drinkwater, een beleidsplan voor het
      desbetreffende openbare lichaam vast ter zake van drinkwater.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel44
  - number: '44.2'
    text: Het beleidsplan behoeft de goedkeuring van de eilandsraad.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel44
  - number: '44.3'
    text: 'Het beleidsplan, dat steeds een periode van tien jaar omvat, bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel44
  - number: 44.3.a
    text: de hoofdlijnen van het beleid met betrekking tot de voorziening van drinkwater in het eilandgebied;
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel44
  - number: 44.3.b
    text: een prognose van de toekomstige behoefte aan drinkwater;
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel44
  - number: 44.3.c
    text: |-
      een beschrijving van de wijze waarop in de betrokken periode wordt voorzien in de levering van drinkwater, de
      noodzakelijke uitbreiding of vernieuwing van productie- of distributiemiddelen en een raming van de daarmee
      gemoeide investeringen;
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel44
  - number: 44.3.d
    text: |-
      een beschrijving van de wijze waarop wordt voorzien in de levering van drinkwater indien de normale productie- of
      distributiemiddelen geheel of gedeeltelijk zijn uitgevallen.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel44
  - number: '44.4'
    text: |-
      Bij de voorbereiding van het beleidsplan betrekt het bestuurscollege de producenten en distributeurs van drinkwater
      alsmede andere belanghebbende instanties en organisaties.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel44
  - number: '44.5'
    text: |-
      Het bestuurscollege stelt de toezichthouder in de gelegenheid hun zienswijze te geven over het ontwerp van het
      beleidsplan voordat het aan de eilandsraad ter goedkeuring wordt aangeboden.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel44
  - number: '44.6'
    text: Het bestuurscollege zendt een exemplaar van het beleidsplan aan Onze Minister en aan de toezichthouder.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel44
  - number: '45.1'
    text: |-
      Jaarlijks vóór 1 september brengt het bestuurcollege verslag uit over de stand van zaken met betrekking tot de
      voorziening van drinkwater aan de eilandsraad. Het verslag bevat in ieder geval:
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel45
  - number: 45.1.a
    text: een overzicht van de kwaliteit van het drinkwater in het voorgaande kalenderjaar;
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel45
  - number: 45.1.b
    text: |-
      bijzondere feiten en omstandigheden die zich het voorgaande kalenderjaar met betrekking tot de kwaliteit en
      leveringszekerheid van de voorziening van drinkwater hebben voorgedaan en de in dat verband genomen maatregelen;
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel45
  - number: 45.1.c
    text: |-
      een overzicht van de activiteiten die het voorgaande kalenderjaar in het kader van het toezicht en de handhaving
      met betrekking tot de voorziening van drinkwater hebben plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel45
  - number: 45.1.d
    text: |-
      de stand van zaken met betrekking tot de uitvoering van het geldende beleidsplan, bedoeld in [artikel 44][ref1],
      alsmede met betrekking tot de voorbereiding van het ontwerp van een zodanig plan.


      [ref1]: https://wetten.overheid.nl/BWBR0028180#Artikel44
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0028180
        artikel: '44'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '45.2'
    text: Het bestuurscollege zendt een exemplaar van het verslag tevens aan Onze Minister en de toezichthouder.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel45
  - number: '46.1'
    text: |-
      Voor een concessie, vergunning of overeenkomst als bedoeld in [artikel 9, eerste lid][ref1], is een bij
      eilandsverordening vast te stellen vergoeding verschuldigd welke vergoeding strekt ter dekking van de kosten van de
      bemoeiingen met betrekking tot het verlenen van de concessie, vergunning of het aangaan van de overeenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0028180#Artikel9
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0028180
        artikel: '9'
        hoofdstuk: '2'
  - number: '46.2'
    text: |-
      Bij eilandsverordening worden regels gesteld betreffende een jaarlijkse bijdrage die is verschuldigd door een
      producent of distributeur van drinkwater ter dekking van de kosten die voor de overheid voortvloeien uit de
      toepassing van het bij of krachtens deze wet ter zake van de kwaliteit van het drinkwater bepaalde, in het
      bijzonder waar het betreft kosten die verband houden met het toezicht op de naleving van de bij of krachtens deze
      wet gegeven regels, voorschriften en beperkingen.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel46
  - number: '46.3'
    text: |-
      Indien de vergoeding en de bijdrage, bedoeld in respectievelijk het eerste en tweede lid, verschuldigd zijn door
      een privaatrechtelijke rechtspersoon, is iedere bestuurder van die rechtspersoon, behoudens voor zover deze kan
      aantonen dat hem terzake geen verwijt treft, hoofdelijk aansprakelijk voor het afdragen van die vergoeding en
      bijdrage.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel46
  - number: '47'
    text: |-
      Een ieder die is betrokken bij de uitvoering van het bij of krachtens deze wet bepaalde en daarbij de beschikking
      krijgt over gegevens waarvan hij het vertrouwelijke karakter kent of redelijkerwijs moet vermoeden, en voor wie
      niet reeds uit hoofde van ambt, beroep of wettelijk voorschrift ter zake van die gegevens een geheimhoudingsplicht
      geldt, is verplicht tot geheimhouding van die gegevens, behoudens voor zover enig wettelijk voorschrift hem tot
      mededeling verplicht of uit zijn taak de noodzaak tot mededeling voortvloeit.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel47
  - number: '48'
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0028180/2010-10-10#Artikel48
