  - number: '2'
    text: |-
      De jaarverslaggeving, inclusief de jaarrekening, wordt ingericht en ingediend overeenkomstig de wettelijke
      bepalingen en de modellen en nadere aanwijzingen van deze regeling. Als basis voor de inrichting van de posten uit
      de jaarrekening gelden de inrichtingsvoorschriften zoals bedoeld in boek 2, titel 9 van het Burgerlijk Wetboek BES
      en de richtlijnen zoals gepubliceerd door de Raad voor de Jaarverslaggeving. Onvermijdelijke afwijkingen of voor
      het geven van het inzicht noodzakelijke afwijkingen ten opzichte van de voorschriften in deze regeling worden in
      het jaarverslag aangegeven.
    url: https://wetten.overheid.nl/BWBR0031801/2023-03-16#Artikel2
  - number: '3'
    text: |-
      1 De jaarverslaggeving wordt gepubliceerd in de Nederlandse taal en wordt daarnaast bij voorkeur tevens
      gepubliceerd in de voertaal van het desbetreffende eiland.

      2 De bedragen worden aangegeven in USD.

      3 Het verslagjaar is gelijk aan een kalenderjaar.

      4 De individuele beloningsgegevens van bestuurders en toezichthouders worden in de jaarrekening opgenomen.

      5 Indien een onderwijsinstelling een interne toezichthouder heeft, wordt aan het jaarverslag een verslag toegevoegd
      waarin deze verantwoording aflegt over zijn handelen en van de resultaten van dat handelen.

      6 De balans, de staat van baten en lasten, het kasstroomoverzicht en de toelichting worden opgesteld overeenkomstig
      de modellen in de bijlage bij deze regeling, waarbij geldt dat deze modellen de minimale indeling omvatten en
      naargelang de behoefte kunnen worden uitgebreid.

      7 Ten aanzien van onderwijsinstellingen voor openbaar onderwijs zonder afgescheiden vermogen die niet door een
      privaatrechtelijke rechtspersoon in stand worden gehouden of voor onderwijsinstellingen waarvoor anderszins geen
      toerekening mogelijk is van een of meer balansposten aan het belang van de instelling, blijft het model van de
      bijlage, onder A, beperkt tot die posten waarvoor die toerekening wel mogelijk is.

      8 Aan het jaarverslag wordt een onderdeel toegevoegd waarin het bevoegd gezag met gebruikmaking van de in
      [bijlage 2][ref1] bij deze regeling opgenomen set gegevens en de daarbij behorende toelichting de resultaten van
      het financiële beleid over het verslagjaar aangeeft. Daarnaast rapporteert het bevoegd gezag in dit onderdeel
      in meerjarenperspectief over de drie verslagjaren volgend op het verslagjaar. Deze rapportage omvat ook het
      risicomanagement en het interne toezicht.


      [ref1]: https://wetten.overheid.nl/BWBR0031801
    url: https://wetten.overheid.nl/BWBR0031801/2023-03-16#Artikel3
