articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *bevoegd gezag:* het bevoegd gezag, bedoeld in [artikel 1 van de Wet primair onderwijs BES][ref1],
      of in [artikel 1.1 van de Wet voortgezet onderwijs 2020][ref2], of
      [artikel 1.1.1 van de Wet educatie en beroepsonderwijs BES][ref3];
        - *onderwijsinstelling:* een bekostigde school als bedoeld in [artikel 1 van de Wet primair onderwijs BES][ref4] of
      [artikel 1.1 van de Wet voortgezet onderwijs 2020][ref5], gelegen in het openbaar lichaam Bonaire, Sint Eustatius
      of Saba, een instelling als bedoeld in [artikel 1.1.1 van de Wet educatie en beroepsonderwijs BES][ref6], dan wel
      het expertisecentrum onderwijszorg, bedoeld in [artikel 28, eerste lid, van de Wet primair onderwijs BES][ref7],
      [artikel 11.18, eerste lid, van de Wet voortgezet onderwijs 2020][ref8] of
      [artikel 3.4, eerste lid, van de Wet educatie en beroepsonderwijs BES][ref9];
        - *jaarrekening:* het onderdeel van het jaarverslag, bestaande uit de balans, de staat van baten en lasten, het
      kasstroomoverzicht, de toelichting op de balans en de staat van baten en lasten – waaronder het overzicht: ‘niet
      uit de balans blijkende zaken’ – en de overige gegevens;
        - *jaarverslag:* het verslag, bestaande uit een bestuursverslag, een jaarrekening en andere gegevens, waarmee het
      bevoegd gezag interne en externe belanghebbenden informeert over het gevoerde beleid en de gang van zaken bij de
      instelling, de uitkomsten van het gevoerde beleid in het jaar waarover verslag wordt gedaan alsmede de aanwending
      van middelen in dat jaar en verantwoording aflegt overeenkomstig de gestelde wettelijke eisen;
        - *jaarverslaggeving*: het geheel van verslaggevingsdocumenten bestaande uit de jaarrekening, het jaarverslag en de
      overige gegevens, waarvan is aangegeven dat zij deel uitmaken van de jaarverslaggeving.


