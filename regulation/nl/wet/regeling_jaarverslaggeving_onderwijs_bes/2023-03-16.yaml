  - number: '4'
    text: |-
      1 Het bestuursverslag bevat in ieder geval de volgende onderdelen:

      a. indien een onderwijsinstelling een interne toezichthouder heeft: een verslag van die interne toezichthouder;

      b. kerngegevens en kernactiviteiten;

      c. de juridische structuur;

      d. de organisatiestructuur;

      e. een beschrijving van de stand van zaken op de balansdatum en de ontwikkelingen gedurende het boekjaar in de
      organisatie, de onderwijskundige ontwikkelingen, de onderwijsprestaties, het personeel, de huisvesting en de
      financiën;

      f. een financieel verslag, waarin aandacht wordt geschonken aan het investeringenbeleid, de financieringsstructuur,
      de financiële kengetallen en de liquiditeitspositie (treasury verslag). De financiële kengetallen bevatten
      uitgewerkte calculaties van de liquiditeitspositie, de solvabiliteit, de rentabiliteit, een en ander voorzien van
      een toelichting op de ontwikkeling van deze kengetallen. Het financieel verslag bevat bovendien een analyse van de
      realisatie van de begroting en de gevolgen van het gevoerde beleid voor de meerjarenraming.

      2 De financiële kengetallen kunnen, in afwijking van het eerste lid, onder f, worden opgenomen in de jaarrekening.
    url: https://wetten.overheid.nl/BWBR0031801/2023-03-16#Artikel4
  - number: '5'
    text: |-
      1 De jaarrekening bevat in ieder geval de navolgende onderdelen:

      a. grondslagen voor de waardering van activa en passiva;

      b. de balans, voorzien van een toelichting op de onderscheiden posten;

      c. de staat van baten en lasten, voorzien van een toelichting op de onderscheiden posten;

      d. het kasstroomoverzicht;

      e. een overzicht van niet uit de balans blijkende zaken;

      f. overige gegevens.

      2 De jaarrekening kan gesegmenteerde overzichten en toelichtingen bevatten indien dit voor het geven van inzicht
      noodzakelijk is.

      3 In de jaarrekening worden de cijfers vergeleken met de overeenkomstige cijfers van het voorafgaande jaar (jaar
      t-1).
    url: https://wetten.overheid.nl/BWBR0031801/2023-03-16#Artikel5
  - number: '6'
    text: |-
      Het bevoegd gezag levert het jaarverslag uiterlijk 1 juli van het jaar volgend op het verslagjaar in schriftelijke
      vorm aan bij de Dienst Uitvoering Onderwijs.
    url: https://wetten.overheid.nl/BWBR0031801/2023-03-16#Artikel6
  - number: '7'
    text: |-
      Indien het voor het bevoegd gezag onmogelijk is om deze regeling volledig na te leven, geeft het bevoegd
      gezag in het jaarverslag uitdrukkelijk en gemotiveerd aan in hoeverre het de in deze regeling opgenomen
      inrichtingsvoorschriften niet heeft nageleefd met daarbij de aanduiding op welke termijn wel volledig aan de
      inrichtingsvoorschriften kan worden voldaan.
    url: https://wetten.overheid.nl/BWBR0031801/2023-03-16#Artikel7
  - number: 7a
    text: |-
      Deze regeling is mede gebaseerd op [artikel 6.19, zesde lid, van het Uitvoeringsbesluit WVO 2020][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel6.19
