preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat de landelijke publieke omroep efficiënter kan opereren als
    omroepverenigingen daarin hun krachten bundelen, dat erkende omroepverenigingen van zins zijn daarop hun
    organisaties in te richten en dat voor het realiseren van een dergelijk, slagvaardiger bestel wijziging
    noodzakelijk is van onder meer de wettelijke voorschriften die de organisatie en financiering van landelijke
    publieke media-instellingen betreffen en dat ook overigens, wat betreft de voorlopige erkende omroepverenigingen
    op doelmatigheid gerichte voorzieningen worden mogelijk gemaakt, en ten slotte dat het wettelijke regime van
    zendgemachtigde kerkgenootschappen en genootschappen op geestelijke grondslag vervalt;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0034182/2015-01-01#ArtikelAanhef
