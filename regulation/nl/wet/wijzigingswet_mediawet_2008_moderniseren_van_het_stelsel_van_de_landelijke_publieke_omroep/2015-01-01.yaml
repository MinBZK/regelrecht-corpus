  - number: III
    text: |-
      [Artikel I][ref1] met uitzondering van de onderdelen A, aanhef en onder 1 en 2, F, O, U, aanhef en onder 3,
      X tot en met Z, AA, aanhef en onder 1, BB, aanhef en onder 1, DD, aanhef en onder 2, LL tot en met NN, QQ en
      RR, CCC, DDD, aanhef en onder 1, EEE, aanhef en onder 4, 5 en 7, GGG, KKK, aanhef en onder 2, MMM, aanhef en
      onder 1, NNN, SSS tot en met UUU, YYY tot en met BBBB, EEEE, FFFF, aanhef en onder 2, IIII en LLLL, aanhef en
      [afdeling 9.2.2 tot en met 9.2.4][ref2] en [9.2.6][ref3], is voor het eerst van toepassing op de organisatie van de
      landelijke publieke mediadienst, de erkenningverlening, de vaststelling van uren programma-aanbod en de bekostiging
      voor de erkenningperiode die loopt van 1 januari 2016 tot en met 31 december 2020.


