preamble:
  text: |-
    Gelet op artikel 23 van de IJkwet 1937 (Stb. 627) en de artikelen 22 en 28 van het Algemeen EEG-IJkbesluit (Stb.
    1978, 168);

    Besluit:
  url: https://wetten.overheid.nl/BWBR0003349/2000-12-24#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Deze regeling geldt ten aanzien van alcoholmeters en areometers voor alcohol, bestemd ter bepaling van het
      alcoholvolumegehalte of het alcoholmassagehalte van een mengsel van water en alcohol, als nader omschreven in punt
      1.1 van de bij deze regeling behorende bijlage.
    url: https://wetten.overheid.nl/BWBR0003349/2000-12-24#Artikel1
  - number: '2'
    text: |-
      De bepalingen van de bij deze regeling behorende bijlage moeten in acht worden genomen bij het verrichten van het
      onderzoek tot EEG-modelgoedkeuring en bij de eerste EEG-ijk.
    url: https://wetten.overheid.nl/BWBR0003349/2000-12-24#Artikel2
  - number: '3'
    text: |-
      1 In afwijking van het bepaalde in [artikel 7, eerste lid, van de Algemene IJkregeling][ref1] is het uit twee delen
      bestaande ijkmerk van eerste EEG-ijk voor alcoholmeters en areometers voor alcohol samengesteld uit:

      a. voor zover het betreft het eerste deel: de kleine letter ‘e’ en de kenletter of kenletters van de EER-Staat,
      door of vanwege welke de eerste EEG-ijk is verricht en

      b. voor zover het betreft het tweede deel: de laatste twee cijfers van het jaartal van het jaar, waarin de
      eerste EEG-ijk is verricht, met dien verstande dat het tweede deel zich bevindt tussen de kleine letter ‘e’ en de
      kenletter of kenletters bedoeld onder a.

      2 De in het eerste lid, onder a, bedoelde kenletters zijn voor Nederland ‘NL’ en voor de andere EER-Staten die
      welke in bijlage 3, onder 1, van de Algemene IJkregeling zijn bekendgemaakt.

      3 Aan de kenletter(s), bedoeld in het eerste lid, onder a, kan, voor zover die tekens door of vanwege een andere
      EER-Staat worden aangebracht, een kencijfer zijn toegevoegd ter aanduiding van het ijkkantoor, onder welks
      verantwoordelijkheid de eerste EEG-ijk is verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0003178#Artikel7
    url: https://wetten.overheid.nl/BWBR0003349/2000-12-24#Artikel3
