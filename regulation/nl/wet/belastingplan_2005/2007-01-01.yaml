  - number: XXVII.1
    text: |-
      Voorafgaand aan de inwerkingtreding van [artikel XIV][ref1] kunnen bij ministeriële regeling het aantal mg per
      km en het bedrag, genoemd in [dat artikel][ref2], worden gewijzigd, indien daartoe aanleiding bestaat ingevolge
      door de Europese Commissie voor te stellen dan wel voorgestelde wijzigingen van de geldende Europese norm voor
      de emissie van deeltjes ten aanzien van personenauto's en bestelauto's die worden aangedreven door een motor met
      compressieontsteking, dan wel ingevolge de uitkomsten van de notificatieprocedure op grond van [richtlijn 98/34/
      EG](31998L0034) van het Europees Parlement en de Raad van 22 juni 1998 betreffende een informatieprocedure op het
      gebied van normen en technische voorschriften (PbEG L 204).


      [ref1]: https://wetten.overheid.nl/BWBR0017748#ArtikelXIV
      [ref2]: https://wetten.overheid.nl/BWBR0017748#ArtikelXIV
