      In afwijking van het eerste lid treedt [artikel VI, onderdeel B][ref1], in werking op een bij koninklijk besluit te
      bepalen tijdstip, met dien verstande dat indien het Staatsblad waarin dat besluit wordt geplaatst na 1 januari 2005
      wordt uitgegeven, in dat besluit bepaald wordt dat deze bepaling terugwerkt tot en met 1 januari 2005.


      [ref1]: https://wetten.overheid.nl/BWBR0017748#ArtikelVI
    url: https://wetten.overheid.nl/BWBR0017748/2007-01-01#ArtikelXXXIII
