      [Artikel 11, eerste lid, onderdeel p, van de Wet op de loonbelasting 1964][ref1] zoals dit onderdeel luidde op 27
      augustus 2004 vóór 17.00 uur, blijft van toepassing voor gevallen waarin het computers en bijbehorende apparatuur
      betreft die door de werknemer vóór het genoemde tijdstip in gebruik zijn genomen of ter zake waarvan door de
      werknemer nog vóór dat tijdstip een verplichting tot aanschaffing is aangegaan.

      [Artikel 6, eerste lid, onderdeel y, van de Coördinatiewet Sociale Verzekering][ref2], zoals dit onderdeel luidde
      op 27 augustus 2004, vóór 17.00 uur, blijft van toepassing voor gevallen waarin het computers en bijbehorende
      apparatuur betreft die door de werknemer vóór het genoemde tijdstip in gebruik zijn genomen of ter zake waarvan
      door de werknemer nog vóór dat tijdstip een verplichting tot aanschaffing is aangegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel11
