articles:
  - number: '1'
    text: |-
      Een type amalgaamafscheider als bedoeld in voorschrift 2.1.4 van
      [Bijlage I behorende bij het Besluit tandarts-praktijken milieubeheer][ref1], wordt getest volgens de methode die
      is beschreven in de [artikelen 2 tot en met 13][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008877
      [ref2]: https://wetten.overheid.nl/BWBR0009188#Artikel2
    url: https://wetten.overheid.nl/BWBR0009188/1998-02-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008877
      - id: ref2
        bwb_id: BWBR0009188
        artikel: '2'
  - number: '2'
    text: |-
      De te testen amalgaamafscheider en het testmateriaal worden minstens

      10 uur voorafgaande aan de rendementstest bij kamertemperatuur bewaard. Bij de test wordt drinkwater gebruikt.
      In de testopstelling is een waterfilter opgenomen met een poriegrootte van 1 mm. Het water, met uitzondering van
      het water waaraan het testmonster is toegevoegd, wordt door dit filter geleid, voordat het de amalgaamafscheider
      doorstroomt.
    url: https://wetten.overheid.nl/BWBR0009188/1998-02-01#Artikel2
  - number: '3'
    text: |-
      Bij de rendementstest wordt gebruik gemaakt van een standaard testmonster zoals beschreven in de
      [artikelen 4 tot en met 7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009188#Artikel4
    url: https://wetten.overheid.nl/BWBR0009188/1998-02-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009188
        artikel: '4'
  - number: '4'
    text: |-
      Als legeringspoeder voor de amal-gaambereiding wordt een poeder gebruikt dat is samengesteld uit circa 50
      gewichtsprocent zilver, circa 30 gewichtsprocent tin en circa 20 gewichtsprocent koper. De maximale afwijking in
      het gewichtspercentage voor elke stof bedraagt 5 gewichts-procent.

      Het legeringspoeder wordt met kwik gemengd in de gewichtsverhouding

      1 : 1,2 en wordt daarna tot amalgaampasta gemengd in een amalgaammenger, zodanig dat er geen vrij kwik meer in het
      mengsel aanwezig is.
    url: https://wetten.overheid.nl/BWBR0009188/1998-02-01#Artikel4
  - number: '5'
    text: |-
      De verkregen amalgaampasta wordt op een glasplaat met een spatel in porties verdeeld van 2 à 3 mm. De deeltjes
      moeten vervolgens 48 uur uitharden en daarna tot poeder worden verkleind. Hiervoor wordt een kogelmolen gebruikt,
      gevuld met stalen kogels met een diameter van 15 mm. Het toerental van de kogelmolen bedraagt tijdens het
      maalproces 1300 toeren per minuut.
    url: https://wetten.overheid.nl/BWBR0009188/1998-02-01#Artikel5
  - number: '6'
    text: |-
      Het poeder wordt verdeeld in de volgende vier fracties:



             fractie 1:

              deeltjes met een afmeting van 1000 mm tot 2000 mm;



             fractie 2:

              deeltjes met een afmeting van 350 mm tot 1000 mm;



            fractie 3:

              deeltjes met een afmeting van 44 mm tot 350 mm;



             fractie 4:

              deeltjes met een afmeting van 20 mm tot 44 mm.




      De massa van elke fractie bedraagt ten minste 8 gram.
    url: https://wetten.overheid.nl/BWBR0009188/1998-02-01#Artikel6
  - number: '7'
    text: |-
      Het standaard testmonster wordt samengesteld uit:

        - 5 gram deeltjes fractie 1
        - 2,5 gram deeltjes fractie 2
        - 1,5 gram deeltjes fractie 3
        - 1 gram deeltjes fractie 4.

      De totale massa (A) van het testmonster bedraagt 10 gram.
    url: https://wetten.overheid.nl/BWBR0009188/1998-02-01#Artikel7
  - number: '8'
    text: |-
      De testopstelling wordt zo uitgevoerd dat het waterdebiet door de amal-gaamafscheider kan worden geregeld en
      gemeten. Bij het installeren van de amalgaamafscheider worden de voorschriften van de fabrikant in acht genomen.
    url: https://wetten.overheid.nl/BWBR0009188/1998-02-01#Artikel8
  - number: '9'
    text: |-
      Het standaard testmonster met de massa (A) wordt met 2 ml wateront-spanningsvloeistof in 1 liter overeenkomstig
      [artikel 2][ref1] gefilterd water gedispergeerd. Het verkregen mengsel wordt ten minste 15 minuten ultrasoon
      behandeld, waarbij het mengsel zich bevindt in een bekerglas met een binnendiameter van minimaal 7 cm. Tijdens de
      ultrasoonbehandeling wordt het monster met de hand geroerd. Het monster wordt direct na de ultrasoonbehandeling
      voor de rendementstest gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0009188#Artikel2
    url: https://wetten.overheid.nl/BWBR0009188/1998-02-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009188
        artikel: '2'
  - number: '10'
    text: |-
      Het rendement van de te testen afscheider wordt bepaald bij het door de fabrikant aangegeven maximale
      waterdebiet. Bij dit debiet wordt het testmonster gelijkmatig in minimaal 2 minuten en maximaal 10 minuten
      aan de amalgaamafscheider toegevoerd. Nadat het testmonster is toegevoerd, houdt de waterstroom nog 8 minuten
      aan. Bij amalgaamafscheiders met een sedimenteersysteem bedraagt het volume water daarbij minstens 2 maal het
      amalgaamafvalwatervolume van de afscheider.
    url: https://wetten.overheid.nl/BWBR0009188/1998-02-01#Artikel10
  - number: '11'
    text: |-
      De bepaling van het rendement geschiedt bij een vulgraad van 0 procent en bij een vulgraad van 100 procent.
      Ter simulatie van een vulgraad van 100 procent kan de amalgaamafvalhouder van de afscheider tot 70 procent van
      de maximale vulhoogte met glaskogels en de rest met testmateriaal worden gevuld. Tevens wordt een blanco proef
      uitgevoerd waarbij de amalgaamafvalhouder tot 70 procent van de maximale vulhoogte is volgegoten met een harde,
      niet waterdoorlaatbare kunststof.
    url: https://wetten.overheid.nl/BWBR0009188/1998-02-01#Artikel11
  - number: '12'
    text: |-
      Het water-amalgaam mengsel dat de afscheider verlaat, wordt gefilterd over een glasfilter nummer 4 en wordt
      vervolgens onder vacuüm gedroogd. De massa (B) van het amalgaam dat de amalgaamafscheider is gepasseerd, wordt
      daarna op 3 decimalen nauwkeurig teruggewonnen.
    url: https://wetten.overheid.nl/BWBR0009188/1998-02-01#Artikel12
  - number: '13'
    text: |-
      Het afscheidingsrendement h voor amalgaam wordt berekend met de volgende formule:









                  η=


                  (A-B)


                  .100%





                  A







      Er wordt een gemiddeld rendement bepaald uit 3 testen bij een vulgraad van 0 procent en er wordt een gemiddeld
      rendement bepaald uit 3 testen bij een vulgraad van 100 procent. Het in het testcertificaat vermelde rendement van
      de afscheider is het kleinste van deze twee gemiddelden.
    url: https://wetten.overheid.nl/BWBR0009188/1998-02-01#Artikel13
  - number: '14'
    text: |-
      Aan de in de [artikelen 2 tot en met 13][ref1] beschreven methode zijn in ieder geval gelijkwaardig:

      a. de Bau- und Prüfungssätze für Amalgamabscheider (Fassung November 1988) door het Institut für Bautechnik te
      Berlijn, Duitsland;

      b. de Standard test for separation device for waste containing mercury from waste water from dental hygiene units
      (21 oktober 1980), door Statens Provningsanstalt te Stockholmsen-heten, te Zweden.


      [ref1]: https://wetten.overheid.nl/BWBR0009188#Artikel2
    url: https://wetten.overheid.nl/BWBR0009188/1998-02-01#Artikel14
