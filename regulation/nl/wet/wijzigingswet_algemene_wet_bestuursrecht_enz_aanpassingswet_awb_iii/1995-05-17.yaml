preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het met het oog op de invoering van de Algemene wet bestuursrecht
    wenselijk is dat de andere wetten daarmee in overeenstemming worden gebracht;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006364/1995-05-17#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende onderdelen
      van de wet verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006364/1995-05-17#Artikel1
  - number: '2'
    text: |-
      1 Voor de bekendmaking van deze wet brengt Onze Minister van Justitie de daarin voorkomende aanhalingen
      van artikelen, paragrafen, afdelingen, titels en hoofdstukken van de [Algemene wet bestuursrecht][ref1] in
      overeenstemming met de opnieuw vastgestelde nummering daarvan.

      2 Indien voor de bekendmaking van deze wet door Onze Minister van Binnenlandse Zaken een nieuwe nummering
      is vastgesteld van onderscheidenlijk de [Provinciewet][ref2] en de [Gemeentewet][ref3], brengt Onze Minister
      van Justitie voor de bekendmaking van deze wet de in deze wet voorkomende aanhalingen van artikelen van
      onderscheidenlijk de [Provinciewet][ref4] en de [Gemeentewet][ref5] in overeenstemming met de opnieuw vastgestelde
      nummering daarvan.

      3 Indien het tweede lid toepassing vindt, plaatst Onze Minister van Justitie tevens in het *Staatsblad* de teksten
      van onderscheidenlijk de artikelen 16 en 17 van hoofdstuk IV van de wet van 4 juni 1992, houdende aanpassing van
      een aantal wetten aan de eerste tranche van de [Algemene wet bestuursrecht][ref6] (*Stb.* 422), zoals gewijzigd
      ingevolge deze wet, waarin de aanhalingen van artikelen van onderscheidenlijk de [Provinciewet][ref7] en de
      [Gemeentewet][ref8] in overeenstemming zijn gebracht met de opnieuw vastgestelde nummering daarvan.


