regulatory_layer: WET
publication_date: '2025-03-12'
valid_from: '2025-03-13'
bwb_id: BWBR0050841
url: https://wetten.overheid.nl/BWBR0050841/2025-03-13
preamble:
  text: |-
    Gelet op artikel 1 van het Besluit bekendmaking taak Staatssecretaris Justitie en Veiligheid, de artikelen 10:3,
    10:4, 10:9 en 10:12 van de Algemene wet bestuursrecht en artikel 4.6 van de Comptabiliteitswet 2016;

    Gelet op de instemmingen van de Minister van Sociale Zaken en Werkgelegenheid en de secretaris-generaal van het
    Ministerie van Sociale Zaken en Werkgelegenheid;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0050841/2025-03-13#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. *mandaat:* de bevoegdheid om in naam van de Staatssecretaris van Justitie en Veiligheid besluiten te nemen;

      b. *volmacht:* de bevoegdheid om in naam van de Staatssecretaris van Justitie en Veiligheid privaatrechtelijke
      rechtshandelingen te verrichten;

      c. *machtiging:* de bevoegdheid om in naam van de Staatssecretaris van Justitie en Veiligheid handelingen te
      verrichten die noch een besluit, noch een privaatrechtelijke rechtshandeling zijn;

      d. *de SG SZW:* de secretaris-generaal van het Ministerie van Sociale Zaken en Werkgelegenheid.
    url: https://wetten.overheid.nl/BWBR0050841/2025-03-13#Artikel1
  - number: '2'
    text: |-
      1 Aan de SG SZW wordt mandaat, volmacht en machtiging verleend ten aanzien van de aangelegenheden op het terrein
      van inburgering.

      2 Het mandaat, de volmacht en de machtiging worden in ieder geval begrensd door het budget dat voor inburgering is
      gereserveerd op de begroting van het Ministerie van Justitie en Veiligheid.
    url: https://wetten.overheid.nl/BWBR0050841/2025-03-13#Artikel2
  - number: '3'
    text: |-
      1 Het mandaat, de volmacht en de machtiging kunnen door de SG SZW worden doorverleend aan onder de Minister van
      Sociale Zaken en Werkgelegenheid ressorterende functionarissen.

      2 De SG SZW en de functionarissen aan wie op grond van dit besluit ondermandaat, volmacht of machtiging is
      verleend, zijn gehouden in de ondertekening van stukken die op basis van dit besluit worden ondertekend, de
      vertegenwoordigingsbevoegdheid tot uiting te brengen door opneming van de volgende formule:

      De Staatssecretaris van Justitie en Veiligheid,

      namens deze,

      handtekening van de betrokken vertegenwoordigingsbevoegde

      naam van de betrokken vertegenwoordigingsbevoegde

      functie betrokken vertegenwoordigingsbevoegde.
    url: https://wetten.overheid.nl/BWBR0050841/2025-03-13#Artikel3
  - number: '4'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin het wordt
      geplaatst en werkt terug tot en met 2 juli 2024.
    url: https://wetten.overheid.nl/BWBR0050841/2025-03-13#Artikel4
  - number: '5'
    text: 'Dit besluit wordt aangehaald als: Besluit mandaat, volmacht en machtiging secretaris-generaal SZW inburgering.'
    url: https://wetten.overheid.nl/BWBR0050841/2025-03-13#Artikel5
