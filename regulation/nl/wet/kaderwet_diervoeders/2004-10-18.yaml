  - number: '40.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur dan wel bij door Onze Minister ter uitvoering van deze wet gestelde
      regelen van algemene aard kan medewerking worden gevorderd van het bestuur van een productschap of een bedrijfschap
      als bedoeld in [artikel 66 van de Wet op de bedrijfsorganisatie][ref1]. Daarbij kunnen tevens de ingevolge het
      bepaalde bij of krachtens deze wet aan Onze Minister toekomende bevoegdheden tot het nemen van besluiten en tot het
      vaststellen van regels of nadere regels, alsmede aan Onze Minister opgedragen taken worden overgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel66
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '66'
  - number: '40.2'
    text: |-
      Indien de in het eerste lid bedoelde medewerking bestaat uit het stellen van regelen of nadere regelen bij
      verordening, behoeft zodanige verordening de goedkeuring van Onze Minister. Krachtens de verordening vastgestelde
      nadere voorschriften en genomen besluiten behoeven, voorzover zulks bij de algemene maatregel van bestuur of
      regelen, bedoeld in het eerste lid, is bepaald, de goedkeuring van de daarbij aangewezen autoriteit.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel40
  - number: '40.3'
    text: |-
      Verordeningen, bedoeld in het tweede lid, kunnen onder meer inhouden toekenning aan een daarbij aan te wijzen
      orgaan van de bevoegdheid vrijstelling, en op aanvrage, ontheffing van die verordeningen of krachtens deze vast te
      stellen voorschriften te verlenen.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel40
  - number: '41'
    text: |-
      Tegen een op grond van deze wet genomen besluit kan een belanghebbende beroep instellen bij het College van Beroep
      voor het bedrijfsleven.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel41
  - number: '49.1'
    text: |-
      Degene die op het tijdstip van inwerkingtreding van [artikel 10][ref1] over een geldende ingevolge een
      communautaire maatregel vereiste en door het Productschap Diervoeder verleende erkenning beschikt of door dat
      productschap is geregistreerd ter uitvoering van een communautaire maatregel, wordt voor de daarin genoemde
      activiteiten gedurende de eerste 12 maanden na de inwerkingtreding van [artikel 10 van deze wet][ref2] geacht in
      het bezit te zijn van de daarvoor ingevolge deze wet vereiste erkenning, dan wel daarvoor te zijn geregistreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0015764#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0015764#Artikel10
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0015764
        artikel: '10'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0015764
        artikel: '10'
        hoofdstuk: IV
  - number: '49.2'
    text: |-
      Zij die binnen de in het eerste lid gestelde termijn een aanvraag tot erkenning of registratie op de krachtens
      deze wet voorgeschreven wijze hebben ingediend, worden geacht ook na het verstrijken van de aldaar genoemde
      termijn in het bezit van de erkenning te zijn, dan wel te zijn geregistreerd, totdat de beslissing op de aanvraag
      onherroepelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel49
  - number: '49.3'
    text: |-
      De [artikelen 14][ref1] en [15][ref2] zijn van overeenkomstige toepassing op de in dit artikel bedoelde erkenningen
      en registraties.


      [ref1]: https://wetten.overheid.nl/BWBR0015764#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0015764#Artikel15
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0015764
        artikel: '14'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0015764
        artikel: '15'
        hoofdstuk: IV
  - number: '50'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel50
  - number: '51'
    text: 'Deze wet wordt aangehaald als: Kaderwet diervoeders.'
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel51
