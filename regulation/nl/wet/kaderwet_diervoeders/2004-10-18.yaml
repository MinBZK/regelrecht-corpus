---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: kaderwet_diervoeders
regulatory_layer: WET
publication_date: '2003-11-25'
valid_from: '2004-10-18'
bwb_id: BWBR0015764
url: https://wetten.overheid.nl/BWBR0015764/2004-10-18
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is in verband met de gezondheid van mens en dier
    alsmede het milieu en met het oog op de afzet en de eerlijkheid in de handel regelen te stellen aangaande
    diervoeders, toevoegingsmiddelen en de voor diervoeders te gebruiken grondstoffen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Landbouw, Natuurbeheer en Visserij;'
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel1
  - number: 1.1.b
    text: |-
      diervoeders: producten van plantaardige of dierlijke oorsprong in natuurlijke staat, vers of verduurzaamd,
      afgeleide producten van de industriële verwerking van deze producten, alsmede organische of anorganische stoffen,
      al dan niet gemengd, met of zonder toevoegingsmiddelen en bestemd voor dierlijke voeding langs orale weg;
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel1
  - number: 1.1.c
    text: |-
      voedermiddelen: diervoeders die bestemd zijn om te worden gebruikt voor vervoedering, hetzij als zodanig, hetzij na
      be- of verwerking, voor de bereiding van mengvoeders voor dieren of als dragers in voormengsels;
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel1
  - number: 1.1.d
    text: 'mengvoeders: mengsels van voedermiddelen;'
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel1
  - number: 1.1.e
    text: 'toevoegingsmiddelen: stoffen of preparaten die in diervoeding worden gebruikt:'
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel1
  - number: 1.1.e.1°
    text: |-
      teneinde: '- de eigenschappen van diervoeders of van de dierlijke producten gunstig te beïnvloeden;'
        - te voldoen aan de voedingsbehoeften van dieren, of de dierlijke productie te verbeteren, met name door in te
      werken op de maag- en darmflora of op de verteerbaarheid van de diervoeders;
        - aan de voeding elementen toe te voegen die het makkelijker maken om bijzondere voedingsdoelen te bereiken of
      tegemoet te komen aan specifieke tijdelijke behoeften inzake voeding bij dieren, of
        - door dierlijke uitwerpselen veroorzaakte hinder te voorkomen of te beperken, of de leefomgeving van de dieren te
      verbeteren, en
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel1
  - number: 1.1.e.2°
    text: |-
      niet zijnde: - diergeneesmiddelen als bedoeld in [artikel 1, eerste lid, van de Diergeneesmiddelenwet][ref1];
        - een technisch hulpmiddel dat als stof in de verwerking van voedermiddelen of van diervoeders wordt gebruikt om
      tijdens de behandeling of verwerking aan een bepaalde technologische doelstelling te beantwoorden en die kan leiden
      tot de onbedoelde maar technisch onvermijdelijke aanwezigheid van residuen van deze stof of derivaten ervan in
      het eindproduct op de voorwaarde dat deze residuen geen gevaar voor de gezondheid opleveren en geen technologische
      effecten op het eindproduct hebben, en
        - stoffen die van nature aanwezig zijn in voedermiddelen in hun normale samenstelling en die overeenstemmen met een
      op grond van [artikel 5][ref2] toegelaten stof, voorzover het geen producten betreft die speciaal verrijkt zijn met
      stoffen die met toevoegingsmiddelen overeenstemmen;


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0015764#Artikel5
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0015764
        artikel: '5'
        hoofdstuk: III
  - number: 1.1.f
    text: |-
      voormengsels: mengsels van toevoegingsmiddelen onderling of mengsels van een of meer toevoegingsmiddelen met
      stoffen die dragers vormen, die bestemd zijn voor de bereiding van diervoeders;
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel1
  - number: 1.1.g
    text: |-
      vervangende voederproteïnen: voor vervoedering bestemde producten die – als zodanig of verwerkt in diervoeders –
      volgens bepaalde technische procédés worden vervaardigd met het oog op hun directe of indirecte eiwitvoorziening;
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel1
  - number: 1.1.h
    text: |-
      dieren: dieren behorend tot de soorten die gewoonlijk door de mens worden gevoederd en gehouden of gegeten, dan wel
      waarvan producten worden geconsumeerd of een andere bestemming hebben, alsmede in de vrije natuur levende dieren
      voorzover hun voeding uit diervoeders bestaat;
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel1
  - number: 1.1.i
    text: |-
      huisdieren: dieren behorend tot de soorten die in de regel door de mens worden gehouden en gevoederd, maar waarvan
      de producten niet worden geconsumeerd;
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel1
  - number: 1.1.j
    text: |-
      bijzonder voedingsdoel: eigenschap van een mengvoeder om te kunnen voldoen aan een specifieke voedingsbehoefte
      van een dier waarvan het spijsverterings- of het absorptiemechanisme dan wel het metabolisme dreigt te worden
      verstoord, of tijdelijk of onherstelbaar is verstoord;
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel1
  - number: 1.1.k
    text: |-
      diervoeders met een bijzonder voedingsdoel: mengvoeders ten aanzien waarvan op enigerlei wijze wordt vermeld dat
      zij over een bijzonder voedingsdoel beschikken, en die zich gegeven hun bijzondere samenstelling of het bij de
      bereiding toegepaste bijzondere procédé duidelijk onderscheiden van:
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel1
  - number: 1.1.k.1°
    text: andere diervoeders;
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel1
  - number: 1.1.k.2°
    text: |-
      gemedicineerde voeders als bedoeld in [artikel 1, eerste lid, van de Diergeneesmiddelenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel1
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '1'
  - number: 1.1.l
    text: |-
      communautaire maatregel: verordening, richtlijn of beschikking als bedoeld in artikel 249 van het Verdrag tot
      oprichting van de Europese Economische Gemeenschap ter zake van diervoeders en daaraan verbonden onderwerpen;
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel1
  - number: 1.1.m
    text: |-
      ongewenste stoffen: stoffen en producten, met uitzondering van ziekteverwekkers, die in of op een diervoeder, een
      toevoegingsmiddel of een voormengsel aanwezig zijn en die een potentieel gevaar opleveren voor de gezondheid van
      mens of dier of voor het milieu, of die de productie ongunstig kunnen beïnvloeden.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel1
  - number: '1.2'
    text: |-
      Voor de toepassing van deze wet en de daarop berustende bepalingen wordt onder in het verkeer brengen begrepen
      het in het bezit hebben van een voor diervoeding bestemd product met het oog op de verkoop, met inbegrip van het
      aanbieden, of enige andere vorm van al dan niet gratis overdracht aan derden, alsmede de verkoop en de andere
      vormen van overdracht zelf.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel1
  - number: '1.3'
    text: |-
      Onze Minister doet mededeling in de Staatscourant van de vaststelling of wijziging van een communautaire
      maatregel voorzover daaraan uitvoering moet worden gegeven, onder vermelding van de artikelen van deze wet waarop
      de communautaire maatregel betrekking heeft. Een communautaire maatregel of wijziging daarvan treedt voor de
      toepassing van deze wet in werking met ingang van de dag waarop daaraan uiterlijk uitvoering moet zijn gegeven,
      tenzij Onze Minister hiervoor een ander tijdstip heeft vastgesteld.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel1
  - number: '2.1'
    text: |-
      Het is verboden diervoeders, toevoegingsmiddelen en voormengsels te bereiden, te be- of verwerken, te verpakken, te
      etiketteren, voorhanden of in voorraad te hebben, te vervoeren of in het verkeer te brengen:
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel2
  - number: 2.1.a
    text: die niet gezond, zuiver, deugdelijk of van de gebruikelijke handelskwaliteit zijn;
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel2
  - number: 2.1.b
    text: |-
      die bij een correct gebruik een gevaar opleveren voor de gezondheid van mens of dier, of voor het milieu, of de
      dierlijke productie ongunstig beïnvloeden, of
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel2
  - number: 2.1.c
    text: op een wijze die misleidend kan zijn.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel2
  - number: '2.2'
    text: |-
      Diervoeders, toevoegingsmiddelen en voormengsels zijn in elk geval niet gezond, zuiver, deugdelijk of van
      gebruikelijke handelskwaliteit indien:
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel2
  - number: 2.2.a
    text: zij niet voldoen aan het bij of krachtens deze wet of bij een communautaire maatregel bepaalde in het belang van
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel2
  - number: 2.2.a.1°
    text: de volksgezondheid, de diergezondheid of het milieu;
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel2
  - number: 2.2.a.2°
    text: |-
      de afzet of de eerlijkheid in de handel, voorzover hetgeen bij of krachtens wet is bepaald voortvloeit uit een
      communautaire maatregel of enig andere internationale verplichting.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel2
  - number: 2.2.b
    text: het gehalte aan ongewenste stoffen of producten een door Onze Minister vastgesteld gehalte overschrijdt.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel2
  - number: '2.3'
    text: |-
      Voor de toepassing van dit artikel wordt onder be- of verwerking tevens menging met andere diervoeders,
      toevoegingsmiddelen of voormengsels begrepen.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel2
  - number: '2.4'
    text: |-
      Onze Minister kan dit artikel van overeenkomstige toepassing verklaren op de door hem aangewezen producten die zijn
      bedoeld voor of worden gebruikt in de diervoeding en waarvan het gehalte aan ongewenste stoffen als bedoeld in het
      tweede lid, onderdeel b, een door hem vastgesteld gehalte overschrijdt.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel2
  - number: '3'
    text: |-
      Het is verboden de door Onze Minister aangewezen voedermiddelen te vervoederen, in mengvoeders te be- of verwerken
      of als diervoeder in het verkeer te brengen.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel3
  - number: '4.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ter zake van diervoeders regels worden gesteld met
      betrekking tot:
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel4
  - number: 4.1.a
    text: |-
      de bereiding, de be- of verwerking, het verpakken, het bewaren, het vervoeren, het vervoederen en het in het
      verkeer brengen;
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel4
  - number: 4.1.b
    text: de hoedanigheid;
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel4
  - number: 4.1.c
    text: de verpakking;
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel4
  - number: 4.1.d
    text: de aanduidingen op of bij verpakkingen dan wel op de een zending of partij begeleidende documenten.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel4
  - number: '4.2'
    text: |-
      Diervoeders met een bijzonder voedingsdoel zijn door hun aard of samenstelling geschikt voor het bijzonder
      voedingsdoel waarvoor zij bestemd zijn.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel4
  - number: '4.3'
    text: |-
      Het is verboden diervoeders met andere dan bij communautaire maatregel aangewezen bijzondere voedingsdoelen
      voorhanden of in voorraad te hebben of in het verkeer te brengen.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel4
  - number: '5.1'
    text: 'Het is verboden:'
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel5
  - number: 5.1.a
    text: |-
      een toevoegingsmiddel of een vervangend voederproteïne dat niet ingevolge een communautaire maatregel is
      toegelaten, voorhanden of in voorraad te hebben, in het verkeer te brengen, te vervoeren of in voormengsels of
      diervoeders te verwerken;
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel5
  - number: 5.1.b
    text: |-
      voormengsels of diervoeders met een niet ingevolge een communautaire maatregel toegelaten toevoegingsmiddel of
      vervangend voederproteïne voorhanden of in voorraad te hebben, in het verkeer te brengen, te vervoeren of te
      vervoederen.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel5
  - number: '5.2'
    text: |-
      Het verbod van het eerste lid geldt niet met betrekking tot toevoegingsmiddelen en vervangende voederproteïnen,
      voormengsels en diervoeders die kennelijk bestemd zijn voor uitvoer naar derde landen, mits is voldaan aan bij of
      krachtens algemene maatregel van bestuur gestelde regelen.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel5
  - number: '6.1'
    text: |-
      Bij ministeriële regeling worden regelen gesteld omtrent het indienen van een aanvraag tot verlening, wijziging of
      intrekking van een toelating als bedoeld in [artikel 5, eerste lid, onderdeel a][ref1], en de wijze van behandeling
      daarvan. Daarbij kan onder meer worden bepaald welke gegevens en bescheiden worden overgelegd, alsmede dat monsters
      ter beschikking worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0015764#Artikel5
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0015764
        artikel: '5'
        hoofdstuk: III
  - number: '6.2'
    text: |-
      Bij de regeling, bedoeld in het eerste lid, wordt bepaald in welke gevallen en onder welke voorwaarden het
      overleggen van gegevens achterwege kan blijven.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel6
  - number: '6.3'
    text: |-
      Een aanvraag kan slechts worden gedaan door een binnen de Europese Gemeenschappen permanent gevestigde natuurlijke
      of rechtspersoon die er verantwoordelijk voor is dat het middel in het verkeer wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel6
  - number: '6.4'
    text: |-
      Wijzigingen in de aan de aanvraag ten grondslag liggende gegevens of bescheiden, wijzigingen die op grond van de
      technische en wetenschappelijke ontwikkelingen in de gegevens dienen te worden aangebracht alsmede onvoorziene en
      ongewenste werking tussen toevoegingsmiddelen onderling en tussen toevoegingsmiddelen en diergeneesmiddelen worden
      volgens bij ministeriële regeling te stellen regelen aan Onze Minister en door hem aangewezen instanties gemeld.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel6
  - number: '6.5'
    text: Dit artikel is van overeenkomstige toepassing op wijziging of verlenging van de toelating.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel6
  - number: '7.1'
    text: Het is verboden te handelen in strijd met de bij een toelating gegeven voorschriften.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel7
  - number: '7.2'
    text: |-
      Het is bij de vervoedering van diervoeders, waarin toevoegingsmiddelen of vervangende voederproteïnen zijn
      verwerkt, verboden te handelen in strijd met de bij die diervoeders vermelde voorschriften.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel7
  - number: '7.3'
    text: |-
      Het is verboden de door Onze Minister aangewezen toevoegingsmiddelen, vervangende voederproteïnen of voormengsels,
      dan wel diervoeders waarin deze zijn verwerkt, met betrekking waartoe niet aan [artikel 10][ref1] is voldaan,
      in ontvangst te nemen, in voorraad of voorhanden te hebben, te vervoeren, verder in het verkeer te brengen of te
      vervoederen.


      [ref1]: https://wetten.overheid.nl/BWBR0015764#Artikel10
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0015764
        artikel: '10'
        hoofdstuk: IV
  - number: '8'
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel8
  - number: 8.a
    text: de menging van toevoegingsmiddelen en vervangende voederproteïnen, zowel onderling als met andere stoffen;
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel8
  - number: 8.b
    text: |-
      de bereiding, be- of verwerking, het verpakken, bewaren, vervoeren of in het verkeer brengen van
      toevoegingsmiddelen, vervangende voederproteïnen en voormengsels;
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel8
  - number: 8.c
    text: |-
      het gehalte aan toevoegingsmiddelen of vervangende voederproteïnen in aanvullende diervoeders en het in het verkeer
      brengen van die diervoeders;
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel8
  - number: 8.d
    text: de verwerking van toevoegingsmiddelen en vervangende voederproteïnen in diervoeders;
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel8
  - number: 8.e
    text: de verpakking van toevoegingsmiddelen, vervangende voederproteïnen en voormengsels;
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel8
  - number: 8.f
    text: |-
      de aanduidingen op of bij verpakkingen van toevoegingsmiddelen, vervangende voederproteïnen, en van voormengsels en
      diervoeders met die toevoegingsmiddelen, vervangende voederproteïnen of voormengsels;
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel8
  - number: 8.g
    text: |-
      de aflevering van toevoegingsmiddelen, vervangende voederproteïnen, en van voormengsels en diervoeders met die
      toevoegingsmiddelen, vervangende voederproteïnen of voormengsels;
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel8
  - number: 8.h
    text: |-
      de vervoedering van toevoegingsmiddelen, vervangende voederproteïnen, en van voormengsels en diervoeders met die
      toevoegingsmiddelen, vervangende voederproteïnen of voormengsels.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel8
  - number: '9'
    text: |-
      Onze Minister kan het voorhanden of in voorraad hebben, het in het verkeer brengen, het vervoeren of het
      vervoederen van toegelaten toevoegingsmiddelen en van vervangende voederproteïnen, alsmede van voormengsels en
      diervoeders met die toevoegingsmiddelen of vervangende voederproteïnen verbieden, dan wel de bij een toelating
      gegeven voorschriften wijzigen, indien hij van mening is dat het toevoegingsmiddel of vervangend voederproteïne een
      gevaar voor de gezondheid van mens of dier of voor het milieu oplevert.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel9
  - number: '10.1'
    text: |-
      Het is verboden zonder daartoe strekkende erkenning of registratie door Onze Minister de door hem aangewezen
      toevoegingsmiddelen, vervangende voederproteïnen, voormengsels, en diervoeders te bereiden, te be- of verwerken, in
      voorraad of voorhanden te hebben of in het verkeer te brengen.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel10
  - number: '10.2'
    text: |-
      Een erkenning of registratie is slechts geldig voor een daarbij genoemde periode voor de daarbij genoemde
      handelingen met betrekking tot de daarbij genoemde toevoegingsmiddelen, vervangende voederproteïnen, voormengsels
      en diervoeders, en voorzover deze handelingen in lokaliteiten plaatsvinden, voor de daarbij genoemde lokaliteiten.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel10
  - number: '10.3'
    text: |-
      Aan een erkenning of registratie kunnen voorwaarden of voorschriften worden verbonden. Een erkenning of registratie
      kan onder beperkingen worden verleend, onderscheidenlijk plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel10
  - number: '11.1'
    text: |-
      Een erkenning of registratie als bedoeld in [artikel 10][ref1] wordt op verzoek verleend, onderscheidenlijk vindt
      op verzoek plaats indien is voldaan aan de bij of krachtens algemene maatregel van bestuur gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0015764#Artikel10
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0015764
        artikel: '10'
        hoofdstuk: IV
  - number: '11.2'
    text: 'De in het eerste lid bedoelde eisen kunnen onder meer betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel11
  - number: 11.2.a
    text: |-
      de lokaliteiten waarin het bedrijf wordt uitgeoefend, de inrichting en het gebruik van die lokaliteiten en de
      technische uitrusting van het bedrijf;
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel11
  - number: 11.2.b
    text: de deskundigheid van de bij de bedrijfsuitoefening betrokken personen;
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel11
  - number: 11.2.c
    text: het productieproces en de opslag;
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel11
  - number: 11.2.d
    text: documentatie met betrekking tot het productieproces, de opslag of de aflevering;
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel11
  - number: 11.2.e
    text: voorzieningen ten behoeve van de controle op de naleving van het bepaalde bij of krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel11
  - number: '12'
    text: |-
      Bij ministeriële regeling worden regelen gesteld omtrent het indienen van een aanvraag tot erkenning of registratie
      dan wel tot verlenging of wijziging daarvan alsmede omtrent de wijze van behandeling. Daarbij kan onder meer worden
      bepaald:
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel12
  - number: 12.a
    text: |-
      dat alvorens een erkenning of registratie wordt verleend, onderscheidenlijk plaatsvindt, dan wel wordt verlengd of
      gewijzigd een onderzoek ter plaatse noodzakelijk is;
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel12
  - number: 12.b
    text: welke gegevens en bescheiden worden overgelegd alvorens een aanvraag in behandeling wordt genomen;
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel12
  - number: 12.c
    text: |-
      binnen welke termijn na wijziging van de in onderdeel b bedoelde gegevens wijziging van de erkenning of registratie
      wordt aangevraagd, alsmede
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel12
  - number: 12.d
    text: |-
      in welke gevallen voorafgaand aan de tenuitvoerlegging van de verlenging of wijziging een aanvraag daartoe wordt
      ingediend.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel12
  - number: '13.1'
    text: |-
      Naar het voldoen aan de eisen, bedoeld in [artikel 11][ref1], kan een onderzoek ter plaatse worden uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0015764#Artikel11
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0015764
        artikel: '11'
        hoofdstuk: IV
  - number: '13.2'
    text: |-
      Het in het eerste lid bedoelde onderzoek wordt generiek uitgevoerd bij een ieder die ingevolge [artikel 10][ref1]
      erkend of geregistreerd dient te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0015764#Artikel10
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0015764
        artikel: '10'
        hoofdstuk: IV
  - number: '14'
    text: |-
      Een erkenning of registratie als bedoeld in [artikel 10][ref1] kan worden geschorst, ingetrokken of
      onderscheidenlijk doorgehaald, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0015764#Artikel10
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0015764
        artikel: '10'
        hoofdstuk: IV
  - number: 14.a
    text: de handelingen waarvoor de erkenning is verleend of registratie heeft plaatsgevonden, niet meer worden verricht, of
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel14
  - number: 14.b
    text: |-
      niet meer aan de in [artikel 11][ref1] bedoelde eisen wordt voldaan, nadat de houder van de erkenning of de
      registratie een redelijke termijn tot aanpassing is gegeven indien de belangen van de gezondheid van mens of dier
      of van het milieu zich niet tegen die termijn verzetten.


      [ref1]: https://wetten.overheid.nl/BWBR0015764#Artikel11
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0015764
        artikel: '11'
        hoofdstuk: IV
  - number: '15.1'
    text: Van een besluit betreffende een erkenning of registratie wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel15
  - number: '15.2'
    text: |-
      Onze Minister draagt zorg dat van erkenningen en registraties volgens door hem te stellen regelen aantekening wordt
      gehouden in een register.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel15
  - number: '16.1'
    text: |-
      Het brengen in of buiten Nederland van toevoegingsmiddelen, vervangende voederproteïnen, voormengsels of
      diervoeders is verboden.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel16
  - number: '16.2'
    text: |-
      Het in het eerste lid vermelde verbod geldt niet indien de toevoegingsmiddelen, vervangende voederproteïnen,
      voormengsels of diervoeders voldoen aan de met het oog op het in of buiten Nederland brengen door Onze Minister
      gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel16
  - number: '16.3'
    text: 'De in het tweede lid bedoelde eisen kunnen betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel16
  - number: 16.3.a
    text: |-
      de gezondheid, deugdelijkheid, aanduiding en herkomst van de toevoegingsmiddelen, vervangende voederproteïnen,
      voormengsels of diervoeders;
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel16
  - number: 16.3.b
    text: bewijsstukken die de toevoegingsmiddelen, vervangende voederproteïnen, voormengsels of diervoeders vergezellen;
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel16
  - number: 16.3.c
    text: |-
      de controles waaraan de toevoegingsmiddelen, vervangende voederproteïnen, voormengsels of diervoeders worden
      onderworpen;
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel16
  - number: 16.3.d
    text: |-
      andere onderwerpen, voorzover voortvloeiende uit: - een communautaire maatregel, of
        - een nationale maatregel ter afwending van een gevaar voor de gezondheid van mens of dier of voor het milieu.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel16
  - number: '16.4'
    text: 'Ter uitvoering van het tweede lid kan Onze Minister voorts regelen stellen met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel16
  - number: 16.4.a
    text: |-
      de plaatsen waar, alsmede de tijdsruimte waarbinnen de toevoegingsmiddelen, vervangende voederproteïnen,
      voormengsels of diervoeders ter controle worden aangeboden;
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel16
  - number: 16.4.b
    text: |-
      de wijze waarop de toevoegingsmiddelen, vervangende voederproteïnen, voormengsels of diervoeders ter controle
      worden aangeboden, en
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel16
  - number: 16.4.c
    text: de wijze waarop het in het derde lid bedoelde bewijsstuk kan worden verkregen.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel16
  - number: '16.5'
    text: |-
      Bij de regeling kan Onze Minister voorts bepalen dat de in Nederland te brengen toevoegingsmiddelen, vervangende
      voederproteïnen, voormengsels of diervoeders voor rekening van de verzender of diens gemachtigde dan wel de
      importeur ter beschikking van de controlerende instantie blijven tot de voorgeschreven controles zijn afgerond en
      de uitslagen daarvan bekend zijn.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel16
  - number: '16.6'
    text: |-
      Onze Minister kan dit artikel van overeenkomstige toepassing verklaren op de ingevolge
      [artikel 2, vierde lid][ref1], aangewezen producten.


      [ref1]: https://wetten.overheid.nl/BWBR0015764#Artikel2
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0015764
        artikel: '2'
        hoofdstuk: II
  - number: '17.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van Onze
      Minister aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel17
  - number: '17.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel17
  - number: '18'
    text: |-
      De in[ artikel 17, eerste lid][ref1], bedoelde ambtenaren zijn bevoegd, met medeneming van de benodigde apparatuur,
      een woning binnen te treden zonder toestemming van de bewoner.


      [ref1]: https://wetten.overheid.nl/BWBR0015764#Artikel17
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0015764
        artikel: '17'
        hoofdstuk: VI
  - number: '19.1'
    text: |-
      In het in [artikel 5:18, eerste lid, van de Algemene wet bestuursrecht][ref1] bedoelde geval vindt de monstername
      in tweevoud plaats en verpakken en verzegelen de in [artikel 17][ref2] bedoelde ambtenaren de monsters ter plaatse.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0015764#Artikel17
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0015764
        artikel: '17'
        hoofdstuk: VI
  - number: '19.2'
    text: |-
      In het in [artikel 5:18, derde lid, van de Algemene wet bestuursrecht][ref1] bedoelde geval laten de in
      [artikel 17][ref2] bedoelde ambtenaren tevens een derde monster verpakt en verzegeld in het bezit van de
      belanghebbende.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0015764#Artikel17
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0015764
        artikel: '17'
        hoofdstuk: VI
  - number: '20.1'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat degenen die toevoegingsmiddelen, vervangende
      voederproteïnen, voormengsels en diervoeders, behorende tot een daartoe bij de maatregel aangewezen categorie,
      bereiden, be- of verwerken, verpakken, etiketteren, voorhanden of in voorraad houden, opslaan, vervoeren of
      in het verkeer brengen verplicht zijn de daarbij omschreven maatregelen te treffen, strekkende ter bevordering
      van een goede naleving van het met betrekking tot die producten bij of krachtens deze wet bepaalde. Tot deze
      maatregelen kunnen behoren het onderwerpen van die producten aan controles, het toetsen van die producten aan
      de hand van een controle van uit die producten genomen steekproeven, al dan niet met toepassing van een erkend
      bedrijfscontrolesysteem, het voeren van een administratie en het aanbrengen of het aangebracht houden van kentekens
      of vermeldingen ten behoeve van een doelmatig toezicht op bedoelde naleving, een en ander overeenkomstig de
      voorschriften, bij of krachtens die algemene maatregel van bestuur daaromtrent gesteld.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel20
  - number: '20.2'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat het degene voor wie een krachtens het eerste lid gestelde
      verplichting geldt, verboden is producten als bedoeld in het eerste lid in het verkeer te brengen ten aanzien
      waarvan de vereiste maatregelen niet zijn genomen.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel20
  - number: '20.3'
    text: |-
      Bij algemene maatregel van bestuur kan voorts worden bepaald dat het degene voor wie krachtens het eerste lid
      de verplichting geldt tot het toetsen van producten aan de hand van een steekproef, is verboden producten met
      betrekking waartoe bij zodanige toetsing een ongunstig resultaat wordt verkregen, in het verkeer te brengen, dan
      wel in het verkeer te brengen alvorens met betrekking tot die producten de maatregelen zijn genomen die bij of
      krachtens die algemene maatregel van bestuur zijn voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel20
  - number: '20.4'
    text: |-
      Bij of krachtens de algemene maatregel van bestuur waarbij met toepassing van het eerste lid de verplichting is
      opgelegd tot het toetsen van producten met een erkend bedrijfscontrolesysteem, worden regelen gesteld omtrent
      de voorwaarden voor erkenning van een zodanig systeem, de aanvraag tot erkenning, de duur van de erkenning, de
      wijze van mededeling van een besluit inzake erkenning en omtrent de wijziging, verlenging, weigering, schorsing of
      intrekking van een erkenning.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel20
  - number: '21.1'
    text: |-
      Onze Minister kan bepalen dat bij het toezicht op de naleving van het bepaalde bij of krachtens deze wet rekening
      wordt gehouden met:
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel21
  - number: 21.1.a
    text: |-
      de deelname aan een door Onze Minister erkend samenhangend stelsel van voorzorgsmaatregelen en daarop gerichte
      keuringen met betrekking tot de gezondheid en deugdelijkheid van toevoegingsmiddelen, vervangende voederproteïnen,
      voormengsels of diervoeders, dat is gericht op de verschillende bij de bereiding en het in het verkeer brengen
      betrokken ondernemingen, of
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel21
  - number: 21.1.b
    text: de toepassing van een door Onze Minister erkend bedrijfscontrolesysteem.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel21
  - number: '21.2'
    text: |-
      Indien aan het eerste lid, onderdeel a of b, toepassing wordt gegeven, stelt Onze Minister regelen omtrent de
      voorwaarden voor erkenning van een zodanig stelsel, onderscheidenlijk systeem, de aanvraag tot erkenning, de duur
      van de erkenning, de wijze van mededeling van een besluit inzake erkenning en omtrent de wijziging, verlenging,
      weigering, schorsing of intrekking van een erkenning.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel21
  - number: '22.1'
    text: |-
      Onze Minister kan bepalen dat van voormengsels, toevoegingsmiddelen, vervangende voederproteïnen en diervoeders
      door bereiders, be- of verwerkers, verpakkers, vervoerders, handelaren of vervoederaars monsters worden genomen.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel22
  - number: '22.2'
    text: |-
      [Artikel 19][ref1] is van overeenkomstige toepassing met betrekking tot deze monsters.


      [ref1]: https://wetten.overheid.nl/BWBR0015764#Artikel19
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0015764
        artikel: '19'
        hoofdstuk: VI
  - number: '22.3'
    text: |-
      Bij ministeriële regeling kunnen regelen worden gesteld omtrent de wijze en omvang van de monsterneming alsmede de
      periode gedurende welke de monsters worden bewaard en de wijze waarop.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel22
  - number: '22.4'
    text: Het is verboden te handelen in strijd met het bepaalde krachtens het eerste en derde lid.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel22
  - number: '23'
    text: |-
      Onze Minister kan instellingen aanwijzen voor het onderzoek van de door met toezicht en controles belaste
      ambtenaren of personen genomen monsters of van de in [artikel 22][ref1] bedoelde monsters.


      [ref1]: https://wetten.overheid.nl/BWBR0015764#Artikel22
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0015764
        artikel: '22'
        hoofdstuk: VII
  - number: '24'
    text: |-
      Analyses geschieden overeenkomstig de bij communautaire maatregel vastgestelde methoden, of, voorzover deze
      methoden niet zijn vastgesteld, overeenkomstig door Onze Minister vastgestelde of goedgekeurde methoden.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel24
  - number: '25.1'
    text: 'Onze Minister kan een vergoeding van kosten heffen overeenkomstig een door hem vastgesteld tarief ter zake van:'
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel25
  - number: 25.1.a
    text: |-
      de behandeling van een aanvraag tot een bij of krachtens deze wet voorgeschreven toelating, aanwijzing, erkenning,
      registratie of vergunning dan wel een aanvraag tot verlenging of wijziging daarvan;
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel25
  - number: 25.1.b
    text: |-
      de instandhouding van de bij of krachtens deze wet verleende toelating, aanwijzing, erkenning, registratie of
      vergunning;
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel25
  - number: 25.1.c
    text: |-
      een onderzoek als bedoeld in [artikel 13][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015764#Artikel13
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0015764
        artikel: '13'
        hoofdstuk: IV
  - number: 25.1.d
    text: |-
      een krachtens [artikel 16][ref1] voorgeschreven controle;


      [ref1]: https://wetten.overheid.nl/BWBR0015764#Artikel16
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0015764
        artikel: '16'
        hoofdstuk: V
  - number: 25.1.e
    text: |-
      de afgifte van een krachtens [artikel 16][ref1] voorgeschreven bewijsstuk;


      [ref1]: https://wetten.overheid.nl/BWBR0015764#Artikel16
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0015764
        artikel: '16'
        hoofdstuk: V
  - number: 25.1.f
    text: |-
      de behandeling van een aanvraag als bedoeld in [artikel 36, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015764#Artikel36
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0015764
        artikel: '36'
        hoofdstuk: X
  - number: 25.1.g
    text: |-
      andere onderzoeken of verrichtingen met betrekking tot toevoegingsmiddelen, vervangende voederproteïnen,
      voormengsels of diervoeders voorzover de onderzoeken of verrichtingen zijn voorgeschreven bij een communautaire
      maatregel dan wel op verzoek van betrokkenen plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel25
  - number: '25.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan een vergoeding van kosten worden geheven overeenkomstig
      een vastgesteld tarief ter zake van bij die maatregel benoemde onderzoeken of verrichtingen met betrekking
      tot toevoegingsmiddelen, vervangende voederproteïnen, voormengsels of diervoeders voorzover de onderzoeken of
      verrichtingen zijn voorgeschreven bij of krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel25
  - number: '25.3'
    text: |-
      Een tarief als bedoeld in het eerste of tweede lid wordt zodanig vastgesteld dat de geraamde baten niet uitgaan
      boven de geraamde kosten die in een rechtstreeks verband staan met de werkzaamheden waarvoor het tarief wordt
      opgelegd, onverminderd de daaromtrent bij een communautaire maatregel vastgestelde verplichtingen.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel25
  - number: '25.4'
    text: Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de betaling van de vergoeding.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel25
  - number: '25.5'
    text: |-
      Het tarief als bedoeld in het eerste of tweede lid wordt niet eerder vastgesteld dan vier weken nadat een voorstel
      daartoe aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel25
  - number: '26.1'
    text: |-
      Met betrekking tot binnen het grondgebied van Nederland aanwezige toevoegingsmiddelen, vervangende voederproteïnen,
      voormengsels en diervoeders die niet voldoen aan het bepaalde bij of krachtens deze wet, dan wel waarvan wordt
      vermoed dat zij daaraan niet voldoen of de gezondheid van mens of dier of het milieu in gevaar kunnen brengen, kan
      Onze Minister maatregelen treffen. Deze maatregelen kunnen onder meer inhouden:
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel26
  - number: 26.1.a
    text: een verbod op het vervoeren, be- of verwerken en in het verkeer brengen;
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel26
  - number: 26.1.b
    text: een verbod op het vervoederen aan dieren;
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel26
  - number: 26.1.c
    text: de verplichting tot tijdelijke opslag;
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel26
  - number: 26.1.d
    text: de verplichting tot vernietiging of uit de handel nemen;
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel26
  - number: 26.1.e
    text: de verplichting tot ontsmetting, dan wel een andere passende behandeling;
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel26
  - number: 26.1.f
    text: de verplichting tot terugzending naar het land van oorsprong;
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel26
  - number: 26.1.g
    text: |-
      de verplichting om houders, dan wel vermoedelijke houders van de producten onverwijld en op doeltreffende wijze op
      de hoogte te stellen, en
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel26
  - number: 26.1.h
    text: de verplichting om in het verkeer gebrachte producten op te halen en centraal op te slaan;
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel26
  - number: 26.1.i
    text: de verplichting tot het identificeren en registreren van producten.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel26
  - number: '26.2'
    text: |-
      De in het eerste lid bedoelde maatregelen houden geen risico's in voor de gezondheid van mens of dier of voor het
      milieu.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel26
  - number: '26.3'
    text: |-
      De kosten van de in het eerste lid bedoelde maatregelen komen ten laste van degene die verantwoordelijk is voor het
      in het verkeer brengen van de producten, de eigenaar of de houder van de producten.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel26
  - number: '26.4'
    text: |-
      De in het eerste lid bedoelde maatregelen kunnen onder voorwaarden en beperkingen worden opgelegd. Aan de
      maatregelen kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel26
  - number: '26.5'
    text: |-
      De in het eerste lid bedoelde maatregelen kunnen voor een of meer afzonderlijke zendingen of partijen, dan wel ten
      algemene worden voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel26
  - number: '26.6'
    text: |-
      Een ieder die partijen toevoegingsmiddelen, vervangende voederproteïnen, voormengsels en diervoeders onder
      zich heeft of heeft gehad met betrekking waartoe maatregelen als bedoeld in het eerste lid zijn getroffen of
      voorgeschreven, verstrekt op het eerste verzoek van Onze Minister inlichtingen omtrent herkomst en verhandeling van
      deze partijen.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel26
  - number: '26.7'
    text: |-
      Onze Minister kan dit artikel van overeenkomstige toepassing verklaren op de ingevolge
      [artikel 2, vierde lid][ref1], aangewezen producten.


      [ref1]: https://wetten.overheid.nl/BWBR0015764#Artikel2
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0015764
        artikel: '2'
        hoofdstuk: II
  - number: '27.1'
    text: |-
      Met betrekking tot binnen Nederland te brengen toevoegingsmiddelen, vervangende voederproteïnen, voormengsels en
      diervoeders die niet voldoen aan het bepaalde bij of krachtens deze wet of de gezondheid van mens of dier of het
      milieu in gevaar kunnen brengen kan Onze Minister maatregelen treffen. Deze maatregelen kunnen onder meer inhouden
      dat deze producten voor rekening van de verzender of diens gemachtigde dan wel de importeur en met inachtneming van
      de aanwijzingen van Onze Minister worden:
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel27
  - number: 27.1.a
    text: teruggezonden buiten het grondgebied van de Europese Gemeenschap;
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel27
  - number: 27.1.b
    text: teruggezonden naar de lidstaat van oorsprong;
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel27
  - number: 27.1.c
    text: vernietigd of uit de handel worden genomen;
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel27
  - number: 27.1.d
    text: |-
      in overeenstemming gebracht met het bepaalde bij of krachtens deze wet, ontsmet, dan wel op andere passende wijze
      behandeld;
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel27
  - number: 27.1.e
    text: gebruikt voor andere doeleinden;
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel27
  - number: 27.1.f
    text: geïdentificeerd en geregistreerd.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel27
  - number: '27.2'
    text: |-
      De in het eerste lid bedoelde maatregelen houden geen risico's in voor de gezondheid van mens of dier of voor het
      milieu.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel27
  - number: '27.3'
    text: |-
      Onze Minister kan dit artikel van overeenkomstige toepassing verklaren op de ingevolge
      [artikel 2, vierde lid][ref1], aangewezen producten.


      [ref1]: https://wetten.overheid.nl/BWBR0015764#Artikel2
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0015764
        artikel: '2'
        hoofdstuk: II
  - number: '28.1'
    text: |-
      Met betrekking tot dieren die door middel van vervoedering of drenking aan te wijzen schadelijke stoffen hebben
      opgenomen of waarvan wordt vermoed dat zij dergelijke stoffen hebben opgenomen, kan Onze Minister besluiten dat,
      totdat het tegendeel is gebleken, dan wel van overheidswege is vastgesteld dat het dier weer vrij is van deze
      stoffen:
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel28
  - number: 28.1.a
    text: |-
      de dieren alsmede de van deze dieren afkomstige producten het bedrijf waar deze dieren worden gehouden niet
      verlaten dan met toestemming van Onze Minister;
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel28
  - number: 28.1.b
    text: de dieren opgestald worden of de stallen niet verlaten dan met toestemming van Onze Minister;
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel28
  - number: 28.1.c
    text: de dieren opgehokt worden of het hok niet verlaten dan met toestemming van Onze Minister;
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel28
  - number: 28.1.d
    text: de dieren op een aangewezen plaats worden gehouden en deze niet verlaten dan met toestemming van Onze Minister;
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel28
  - number: 28.1.e
    text: andere maatregelen worden getroffen, voorzover de maatregelen zijn voorgeschreven bij een communautaire maatregel.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel28
  - number: '28.2'
    text: |-
      De in het eerste lid bedoelde aanwijzing van schadelijke stoffen geschiedt door Onze Minister in overeenstemming
      met Onze Minister van Volksgezondheid, Welzijn en Sport.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel28
  - number: '28.3'
    text: |-
      Onze Minister kan besluiten dat de in het eerste lid bedoelde dieren en producten op een door hem voorgeschreven
      wijze worden gemerkt of geïdentificeerd en geregistreerd.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel28
  - number: '28.4'
    text: |-
      De toestemming, bedoeld in het eerste lid, kan onder beperkingen worden verleend. Aan de toestemming kunnen
      voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel28
  - number: '28.5'
    text: |-
      Ter voorkoming dat dieren door middel van vervoedering of drenking aan te wijzen schadelijke stoffen opnemen kan
      Onze Minister besluiten dat de maatregelen, bedoeld in het eerste lid, worden getroffen totdat is gebleken, dan
      wel van overheidswege is vastgesteld, dat de mogelijkheid dat schadelijke stoffen worden opgenomen is geweken. Het
      tweede tot en met vierde lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel28
  - number: '28.6'
    text: |-
      Onverminderd het eerste lid kan Onze Minister met betrekking tot producten van dieren die door middel van
      vervoedering of drenking aan te wijzen schadelijke stoffen hebben opgenomen of waarvan wordt vermoed dat zij
      dergelijke stoffen hebben opgenomen, totdat het tegendeel is gebleken, dan wel van overheidswege is vastgesteld dat
      deze dieren vrij zijn van deze stoffen, besluiten dat de producten uit de handel worden genomen en centraal worden
      opgeslagen.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel28
  - number: '28.7'
    text: |-
      Een ieder die dieren en producten onder zich heeft of heeft gehad met betrekking waartoe maatregelen als bedoeld
      in het eerste, vijfde en zesde lid zijn getroffen, verstrekt op het eerste verzoek van Onze Minister inlichtingen
      omtrent herkomst en verhandeling van deze dieren en producten.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel28
  - number: '29'
    text: |-
      Een ieder wie zulks aangaat handelt overeenkomstig dan wel verleent zijn medewerking aan de uitvoering van een
      krachtens deze wet gegeven bevel of genomen maatregel.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel29
  - number: '30'
    text: |-
      Onze Minister is bevoegd tot toepassing van bestuursdwang ter handhaving van de bij of krachtens deze wet gestelde
      verplichtingen, indien dit in verband met risico's voor de gezondheid van dier of mens noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel30
  - number: '31'
    text: |-
      Onverminderd het bij of krachtens deze wet bepaalde is het verboden toevoegingsmiddelen, vervangende
      voederproteïnen, voormengsels en diervoeders te bereiden waarvan de verwerking tot gevolg heeft dat deze de
      gezondheid van mens of dier of het milieu in gevaar kunnen brengen.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel31
  - number: '32.1'
    text: |-
      Degene die toevoegingsmiddelen, vervangende voederproteïnen, voormengsels of diervoeders bereidt, be- of verwerkt,
      voorhanden of in voorraad heeft, opslaat, verpakt, in het verkeer brengt, verhandelt, vervoert, in- of buiten
      Nederland brengt, vervoedert of onderzoekt, stelt onverwijld Onze Minister op de hoogte indien hij constateert of
      vermoedt dat deze producten niet voldoen aan het bepaalde bij of krachtens deze wet of de gezondheid van mens of
      dier of het milieu in gevaar kunnen brengen alsmede van de maatregelen die hij heeft getroffen ter voorkoming van
      risico`s voor de gezondheid van mens of dier of voor het milieu.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel32
  - number: '32.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op grondstoffen voor de bereiding van de in het eerste lid
      genoemde producten.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel32
  - number: '32.3'
    text: De verplichting, bedoeld in het eerste lid, is van overeenkomstige toepassing op dierenartsen.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel32
  - number: '32.4'
    text: |-
      Bij ministeriële regeling kunnen nadere regelen worden gesteld omtrent het verstrekken van de in het eerste lid
      bedoelde inlichtingen en over de maatregelen die ter voorkoming van risico`s voor de gezondheid van mens of dier of
      voor het milieu zijn ondernomen.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel32
  - number: '33'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voor bij die maatregel aangewezen categorieën van houders
      van dieren van bij die maatregel aangewezen soorten of categorieën van dieren regelen worden gesteld omtrent:
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel33
  - number: 33.a
    text: de herkomst en de bereiding van diervoeders;
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel33
  - number: 33.b
    text: |-
      de opslag, bewaring en verdere behandeling van toevoegingsmiddelen, vervangende voederproteïnen, voormengsels en
      diervoeders;
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel33
  - number: 33.c
    text: de bij bereiding te gebruiken hulpmiddelen of apparaten;
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel33
  - number: 33.d
    text: |-
      het houden van aantekeningen omtrent ontvangen, bereide, bij de bereiding gebruikte of vervoederde
      toevoegingsmiddelen, vervangende voederproteïnen, voormengsels of diervoeders, of
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel33
  - number: 33.e
    text: de vervoedering aan dieren.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel33
  - number: '34.1'
    text: |-
      Het is degene die bedrijfsmatig dieren houdt verboden om door Onze Minister aangewezen substanties voorhanden of in
      voorraad te hebben, te vervoederen of anderszins oraal toe te dienen.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel34
  - number: '34.2'
    text: 'Ingevolge het eerste lid kunnen slechts worden aangewezen, substanties die:'
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel34
  - number: 34.2.a
    text: als grondstof voor toevoegingsmiddelen, vervangende voederproteïnen, voormengsels of diervoeders kunnen dienen, of
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel34
  - number: 34.2.b
    text: in een communautaire maatregel zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel34
  - number: '35.1'
    text: |-
      Onze Minister kan, voorzover het belang van de gezondheid van mens of dier of van het milieu zich daartegen naar
      zijn oordeel niet verzet, van het bepaalde bij of krachtens deze wet vrijstelling of ontheffing verlenen in geval
      van calamiteiten, incidenten en onvoorziene omstandigheden.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel35
  - number: '35.2'
    text: |-
      Aan een vrijstelling of ontheffing kunnen voorschriften of voorwaarden worden verbonden. Zij kunnen onder
      beperkingen worden verleend. Zij kunnen te allen tijde worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel35
  - number: '35.3'
    text: Een vrijstelling wordt bekendgemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel35
  - number: '36.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voorschriften gegeven betreffende het bereiden, het
      verpakken, het etiketteren, het in het verkeer brengen, het voorhanden of in voorraad hebben, het vervoeren en het
      vervoederen van toevoegingsmiddelen, vervangende voederproteïnen, voormengsels en diervoeders welke als zodanig dan
      wel voor wat betreft een uitbreiding van de toepassingsmogelijkheden kennelijk in een proefstadium verkeren of voor
      onderzoeksdoeleinden worden aangewend.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel36
  - number: '36.2'
    text: |-
      De in het eerste lid bedoelde voorschriften kunnen inhouden dat proefnemingen en onderzoeken slechts na daartoe
      gedane aanvraag kunnen worden toegestaan.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel36
  - number: '36.3'
    text: Aan een toestemming kunnen voorwaarden worden verbonden. Een toestemming kan onder beperkingen worden gegeven.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel36
  - number: '37.1'
    text: |-
      Indien in het belang van de gezondheid van mens of dier of het milieu naar het oordeel van Onze Minister een
      onverwijlde voorziening noodzakelijk is, kan hij in de onderwerpen die op grond van deze wet bij algemene maatregel
      van bestuur worden bepaald, bij regeling voorzien.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel37
  - number: '37.2'
    text: |-
      De regeling vervalt een jaar nadat zij in werking is getreden, of, indien binnen die termijn een algemene maatregel
      van bestuur ter vervanging van die regeling in werking is getreden, op het moment waarop de maatregel in werking
      treedt. De termijn kan door Onze Minister eenmaal met ten hoogste een jaar worden verlengd.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel37
  - number: '37.3'
    text: |-
      Indien in het belang van de gezondheid van mens en dier naar het oordeel van Onze Minister een onverwijlde
      voorziening noodzakelijk is, kan hij bepalen dat door hem krachtens deze wet of algemene maatregelen van bestuur
      vastgestelde regelingen onmiddellijk na hun bekendmaking in werking treden. In dat geval kan hij zodanige regeling,
      in afwijking van [artikel 4, eerste lid, van de Bekendmakingswet][ref1], op andere dan de daar genoemde wijze
      bekendmaken.


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel4
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '4'
  - number: '38.1'
    text: |-
      In situaties waarin na beoordeling van de beschikbare informatie de mogelijkheid van schadelijke gevolgen voor de
      gezondheid van mens of dier of voor het milieu is geconstateerd, maar er nog wetenschappelijke onzekerheid heerst,
      kunnen, in afwachting van nadere wetenschappelijke gegevens ten behoeve van een vollediger risicobeoordeling,
      voorlopige maatregelen voor risicomanagement worden vastgesteld om het gekozen niveau van gezondheidsbescherming
      te waarborgen.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel38
  - number: '38.2'
    text: |-
      De maatregelen, bedoeld in het eerste lid, zijn evenredig en beperken de handel niet meer dan nodig is om het
      gekozen niveau van bescherming te verwezenlijken, rekening houdend met de technische en economische haalbaarheid
      en andere terzake dienende factoren. De maatregelen worden binnen een redelijke termijn opnieuw bezien, afhankelijk
      van de aard van het geconstateerde risico voor het leven of de gezondheid en het soort wetenschappelijke informatie
      dat nodig is om de wetenschappelijke onzekerheid weg te nemen en een vollediger risicobeoordeling uit te voeren.
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel38
  - number: '38.3'
    text: 'De maatregelen, bedoeld in het eerste lid, kunnen bestaan uit:'
    url: https://wetten.overheid.nl/BWBR0015764/2004-10-18#Artikel38
  - number: 38.3.a
    text: |-
      het stellen van regels, onderscheidenlijk eisen, bedoeld in de [artikelen 4][ref1], [5, tweede lid][ref2],
      [8][ref3], [11, eerste lid][ref4], [16, tweede en vierde lid][ref5], en [33][ref6], bij of krachtens algemene
      maatregel van bestuur;


      [ref1]: https://wetten.overheid.nl/BWBR0015764#Artikel4
