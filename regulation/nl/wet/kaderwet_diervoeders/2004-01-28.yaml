---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.5.2/schema.json
$id: kaderwet_diervoeders
regulatory_layer: WET
publication_date: '2003-11-25'
valid_from: '2004-01-28'
bwb_id: BWBR0015764
url: https://wetten.overheid.nl/BWBR0015764/2004-01-28
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is in verband met de gezondheid van mens en dier
    alsmede het milieu en met het oog op de afzet en de eerlijkheid in de handel regelen te stellen aangaande
    diervoeders, toevoegingsmiddelen en de voor diervoeders te gebruiken grondstoffen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Landbouw, Natuurbeheer en Visserij;'
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel1
  - number: 1.1.b
    text: |-
      diervoeders: producten van plantaardige of dierlijke oorsprong in natuurlijke staat, vers of verduurzaamd,
      afgeleide producten van de industriële verwerking van deze producten, alsmede organische of anorganische stoffen,
      al dan niet gemengd, met of zonder toevoegingsmiddelen en bestemd voor dierlijke voeding langs orale weg;
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel1
  - number: 1.1.c
    text: |-
      voedermiddelen: diervoeders die bestemd zijn om te worden gebruikt voor vervoedering, hetzij als zodanig, hetzij na
      be- of verwerking, voor de bereiding van mengvoeders voor dieren of als dragers in voormengsels;
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel1
  - number: 1.1.d
    text: 'mengvoeders: mengsels van voedermiddelen;'
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel1
  - number: 1.1.e
    text: 'toevoegingsmiddelen: stoffen of preparaten die in diervoeding worden gebruikt:'
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel1
  - number: 1.1.e.1°
    text: |-
      teneinde: '- de eigenschappen van diervoeders of van de dierlijke producten gunstig te beïnvloeden;'
        - te voldoen aan de voedingsbehoeften van dieren, of de dierlijke productie te verbeteren, met name door in te
      werken op de maag- en darmflora of op de verteerbaarheid van de diervoeders;
        - aan de voeding elementen toe te voegen die het makkelijker maken om bijzondere voedingsdoelen te bereiken of
      tegemoet te komen aan specifieke tijdelijke behoeften inzake voeding bij dieren, of
        - door dierlijke uitwerpselen veroorzaakte hinder te voorkomen of te beperken, of de leefomgeving van de dieren te
      verbeteren, en
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel1
  - number: 1.1.e.2°
    text: |-
      niet zijnde: - diergeneesmiddelen als bedoeld in [artikel 1, eerste lid, van de Diergeneesmiddelenwet][ref1];
        - een technisch hulpmiddel dat als stof in de verwerking van voedermiddelen of van diervoeders wordt gebruikt om
      tijdens de behandeling of verwerking aan een bepaalde technologische doelstelling te beantwoorden en die kan leiden
      tot de onbedoelde maar technisch onvermijdelijke aanwezigheid van residuen van deze stof of derivaten ervan in
      het eindproduct op de voorwaarde dat deze residuen geen gevaar voor de gezondheid opleveren en geen technologische
      effecten op het eindproduct hebben, en
        - stoffen die van nature aanwezig zijn in voedermiddelen in hun normale samenstelling en die overeenstemmen met een
      op grond van [artikel 5][ref2] toegelaten stof, voorzover het geen producten betreft die speciaal verrijkt zijn met
      stoffen die met toevoegingsmiddelen overeenstemmen;


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0015764#Artikel5
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0015764
        artikel: '5'
        hoofdstuk: III
  - number: 1.1.f
    text: |-
      voormengsels: mengsels van toevoegingsmiddelen onderling of mengsels van een of meer toevoegingsmiddelen met
      stoffen die dragers vormen, die bestemd zijn voor de bereiding van diervoeders;
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel1
  - number: 1.1.g
    text: |-
      vervangende voederproteïnen: voor vervoedering bestemde producten die – als zodanig of verwerkt in diervoeders –
      volgens bepaalde technische procédés worden vervaardigd met het oog op hun directe of indirecte eiwitvoorziening;
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel1
  - number: 1.1.h
    text: |-
      dieren: dieren behorend tot de soorten die gewoonlijk door de mens worden gevoederd en gehouden of gegeten, dan wel
      waarvan producten worden geconsumeerd of een andere bestemming hebben, alsmede in de vrije natuur levende dieren
      voorzover hun voeding uit diervoeders bestaat;
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel1
  - number: 1.1.i
    text: |-
      huisdieren: dieren behorend tot de soorten die in de regel door de mens worden gehouden en gevoederd, maar waarvan
      de producten niet worden geconsumeerd;
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel1
  - number: 1.1.j
    text: |-
      bijzonder voedingsdoel: eigenschap van een mengvoeder om te kunnen voldoen aan een specifieke voedingsbehoefte
      van een dier waarvan het spijsverterings- of het absorptiemechanisme dan wel het metabolisme dreigt te worden
      verstoord, of tijdelijk of onherstelbaar is verstoord;
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel1
  - number: 1.1.k
    text: |-
      diervoeders met een bijzonder voedingsdoel: mengvoeders ten aanzien waarvan op enigerlei wijze wordt vermeld dat
      zij over een bijzonder voedingsdoel beschikken, en die zich gegeven hun bijzondere samenstelling of het bij de
      bereiding toegepaste bijzondere procédé duidelijk onderscheiden van:
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel1
  - number: 1.1.k.1°
    text: andere diervoeders;
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel1
  - number: 1.1.k.2°
    text: |-
      gemedicineerde voeders als bedoeld in [artikel 1, eerste lid, van de Diergeneesmiddelenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel1
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '1'
  - number: 1.1.l
    text: |-
      communautaire maatregel: verordening, richtlijn of beschikking als bedoeld in artikel 249 van het Verdrag tot
      oprichting van de Europese Economische Gemeenschap ter zake van diervoeders en daaraan verbonden onderwerpen.
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel1
  - number: '1.2'
    text: |-
      Voor de toepassing van deze wet en de daarop berustende bepalingen wordt onder in het verkeer brengen begrepen
      het in het bezit hebben van een voor diervoeding bestemd product met het oog op de verkoop, met inbegrip van het
      aanbieden, of enige andere vorm van al dan niet gratis overdracht aan derden, alsmede de verkoop en de andere
      vormen van overdracht zelf.
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel1
  - number: '1.3'
    text: |-
      Onze Minister doet mededeling in de Staatscourant van de vaststelling of wijziging van een communautaire
      maatregel voorzover daaraan uitvoering moet worden gegeven, onder vermelding van de artikelen van deze wet waarop
      de communautaire maatregel betrekking heeft. Een communautaire maatregel of wijziging daarvan treedt voor de
      toepassing van deze wet in werking met ingang van de dag waarop daaraan uiterlijk uitvoering moet zijn gegeven,
      tenzij Onze Minister hiervoor een ander tijdstip heeft vastgesteld.
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel1
  - number: '9'
    text: |-
      Onze Minister kan het voorhanden of in voorraad hebben, het in het verkeer brengen, het vervoeren of het
      vervoederen van toegelaten toevoegingsmiddelen en van vervangende voederproteïnen, alsmede van voormengsels en
      diervoeders met die toevoegingsmiddelen of vervangende voederproteïnen verbieden, dan wel de bij een toelating
      gegeven voorschriften wijzigen, indien hij van mening is dat het toevoegingsmiddel of vervangend voederproteïne een
      gevaar voor de gezondheid van mens of dier of voor het milieu oplevert.
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel9
  - number: '17.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van Onze
      Minister aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel17
  - number: '17.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel17
  - number: '18'
    text: |-
      De in[ artikel 17, eerste lid][ref1], bedoelde ambtenaren zijn bevoegd, met medeneming van de benodigde apparatuur,
      een woning binnen te treden zonder toestemming van de bewoner.


      [ref1]: https://wetten.overheid.nl/BWBR0015764#Artikel17
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0015764
        artikel: '17'
        hoofdstuk: VI
  - number: '19.1'
    text: |-
      In het in [artikel 5:18, eerste lid, van de Algemene wet bestuursrecht][ref1] bedoelde geval vindt de monstername
      in tweevoud plaats en verpakken en verzegelen de in [artikel 17][ref2] bedoelde ambtenaren de monsters ter plaatse.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0015764#Artikel17
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0015764
        artikel: '17'
        hoofdstuk: VI
  - number: '19.2'
    text: |-
      In het in [artikel 5:18, derde lid, van de Algemene wet bestuursrecht][ref1] bedoelde geval laten de in
      [artikel 17][ref2] bedoelde ambtenaren tevens een derde monster verpakt en verzegeld in het bezit van de
      belanghebbende.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0015764#Artikel17
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0015764
        artikel: '17'
        hoofdstuk: VI
  - number: '23'
    text: |-
      Onze Minister kan instellingen aanwijzen voor het onderzoek van de door met toezicht en controles belaste
      ambtenaren of personen genomen monsters of van de in [artikel 22][ref1] bedoelde monsters.


      [ref1]: https://wetten.overheid.nl/BWBR0015764#Artikel22
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0015764
        artikel: '22'
        hoofdstuk: VII
  - number: '24'
    text: |-
      Analyses geschieden overeenkomstig de bij communautaire maatregel vastgestelde methoden, of, voorzover deze
      methoden niet zijn vastgesteld, overeenkomstig door Onze Minister vastgestelde of goedgekeurde methoden.
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel24
  - number: '26.1'
    text: |-
      Met betrekking tot binnen het grondgebied van Nederland aanwezige toevoegingsmiddelen, vervangende voederproteïnen,
      voormengsels en diervoeders die niet voldoen aan het bepaalde bij of krachtens deze wet, dan wel waarvan wordt
      vermoed dat zij daaraan niet voldoen of de gezondheid van mens of dier of het milieu in gevaar kunnen brengen, kan
      Onze Minister maatregelen treffen. Deze maatregelen kunnen onder meer inhouden:
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel26
  - number: 26.1.a
    text: een verbod op het vervoeren, be- of verwerken en in het verkeer brengen;
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel26
  - number: 26.1.b
    text: een verbod op het vervoederen aan dieren;
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel26
  - number: 26.1.c
    text: de verplichting tot tijdelijke opslag;
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel26
  - number: 26.1.d
    text: de verplichting tot vernietiging of uit de handel nemen;
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel26
  - number: 26.1.e
    text: de verplichting tot ontsmetting, dan wel een andere passende behandeling;
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel26
  - number: 26.1.f
    text: de verplichting tot terugzending naar het land van oorsprong;
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel26
  - number: 26.1.g
    text: |-
      de verplichting om houders, dan wel vermoedelijke houders van de producten onverwijld en op doeltreffende wijze op
      de hoogte te stellen, en
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel26
  - number: 26.1.h
    text: de verplichting om in het verkeer gebrachte producten op te halen en centraal op te slaan;
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel26
  - number: 26.1.i
    text: de verplichting tot het identificeren en registreren van producten.
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel26
  - number: '26.2'
    text: |-
      De in het eerste lid bedoelde maatregelen houden geen risico's in voor de gezondheid van mens of dier of voor het
      milieu.
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel26
  - number: '26.3'
    text: |-
      De kosten van de in het eerste lid bedoelde maatregelen komen ten laste van degene die verantwoordelijk is voor het
      in het verkeer brengen van de producten, de eigenaar of de houder van de producten.
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel26
  - number: '26.4'
    text: |-
      De in het eerste lid bedoelde maatregelen kunnen onder voorwaarden en beperkingen worden opgelegd. Aan de
      maatregelen kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel26
  - number: '26.5'
    text: |-
      De in het eerste lid bedoelde maatregelen kunnen voor een of meer afzonderlijke zendingen of partijen, dan wel ten
      algemene worden voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel26
  - number: '26.6'
    text: |-
      Een ieder die partijen toevoegingsmiddelen, vervangende voederproteïnen, voormengsels en diervoeders onder
      zich heeft of heeft gehad met betrekking waartoe maatregelen als bedoeld in het eerste lid zijn getroffen of
      voorgeschreven, verstrekt op het eerste verzoek van Onze Minister inlichtingen omtrent herkomst en verhandeling van
      deze partijen.
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel26
  - number: '26.7'
    text: |-
      Onze Minister kan dit artikel van overeenkomstige toepassing verklaren op de ingevolge
      [artikel 2, vijfde lid][ref1], aangewezen producten.


      [ref1]: https://wetten.overheid.nl/BWBR0015764#Artikel2
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0015764
        artikel: '2'
        hoofdstuk: II
  - number: '27.1'
    text: |-
      Met betrekking tot binnen Nederland te brengen toevoegingsmiddelen, vervangende voederproteïnen, voormengsels en
      diervoeders die niet voldoen aan het bepaalde bij of krachtens deze wet of de gezondheid van mens of dier of het
      milieu in gevaar kunnen brengen kan Onze Minister maatregelen treffen. Deze maatregelen kunnen onder meer inhouden
      dat deze producten voor rekening van de verzender of diens gemachtigde dan wel de importeur en met inachtneming van
      de aanwijzingen van Onze Minister worden:
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel27
  - number: 27.1.a
    text: teruggezonden buiten het grondgebied van de Europese Gemeenschap;
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel27
  - number: 27.1.b
    text: teruggezonden naar de lidstaat van oorsprong;
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel27
  - number: 27.1.c
    text: vernietigd of uit de handel worden genomen;
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel27
  - number: 27.1.d
    text: |-
      in overeenstemming gebracht met het bepaalde bij of krachtens deze wet, ontsmet, dan wel op andere passende wijze
      behandeld;
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel27
  - number: 27.1.e
    text: gebruikt voor andere doeleinden;
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel27
  - number: 27.1.f
    text: geïdentificeerd en geregistreerd.
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel27
  - number: '27.2'
    text: |-
      De in het eerste lid bedoelde maatregelen houden geen risico's in voor de gezondheid van mens of dier of voor het
      milieu.
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel27
  - number: '27.3'
    text: |-
      Onze Minister kan dit artikel van overeenkomstige toepassing verklaren op de ingevolge
      [artikel 2, vijfde lid][ref1], aangewezen producten.


      [ref1]: https://wetten.overheid.nl/BWBR0015764#Artikel2
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0015764
        artikel: '2'
        hoofdstuk: II
  - number: '28.1'
    text: |-
      Met betrekking tot dieren die door middel van vervoedering of drenking aan te wijzen schadelijke stoffen hebben
      opgenomen of waarvan wordt vermoed dat zij dergelijke stoffen hebben opgenomen, kan Onze Minister besluiten dat,
      totdat het tegendeel is gebleken, dan wel van overheidswege is vastgesteld dat het dier weer vrij is van deze
      stoffen:
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel28
  - number: 28.1.a
    text: |-
      de dieren alsmede de van deze dieren afkomstige producten het bedrijf waar deze dieren worden gehouden niet
      verlaten dan met toestemming van Onze Minister;
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel28
  - number: 28.1.b
    text: de dieren opgestald worden of de stallen niet verlaten dan met toestemming van Onze Minister;
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel28
  - number: 28.1.c
    text: de dieren opgehokt worden of het hok niet verlaten dan met toestemming van Onze Minister;
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel28
  - number: 28.1.d
    text: de dieren op een aangewezen plaats worden gehouden en deze niet verlaten dan met toestemming van Onze Minister;
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel28
  - number: 28.1.e
    text: andere maatregelen worden getroffen, voorzover de maatregelen zijn voorgeschreven bij een communautaire maatregel.
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel28
  - number: '28.2'
    text: |-
      De in het eerste lid bedoelde aanwijzing van schadelijke stoffen geschiedt door Onze Minister in overeenstemming
      met Onze Minister van Volksgezondheid, Welzijn en Sport.
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel28
  - number: '28.3'
    text: |-
      Onze Minister kan besluiten dat de in het eerste lid bedoelde dieren en producten op een door hem voorgeschreven
      wijze worden gemerkt of geïdentificeerd en geregistreerd.
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel28
  - number: '28.4'
    text: |-
      De toestemming, bedoeld in het eerste lid, kan onder beperkingen worden verleend. Aan de toestemming kunnen
      voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel28
  - number: '28.5'
    text: |-
      Ter voorkoming dat dieren door middel van vervoedering of drenking aan te wijzen schadelijke stoffen opnemen kan
      Onze Minister besluiten dat de maatregelen, bedoeld in het eerste lid, worden getroffen totdat is gebleken, dan
      wel van overheidswege is vastgesteld, dat de mogelijkheid dat schadelijke stoffen worden opgenomen is geweken. Het
      tweede tot en met vierde lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel28
  - number: '28.6'
    text: |-
      Onverminderd het eerste lid kan Onze Minister met betrekking tot producten van dieren die door middel van
      vervoedering of drenking aan te wijzen schadelijke stoffen hebben opgenomen of waarvan wordt vermoed dat zij
      dergelijke stoffen hebben opgenomen, totdat het tegendeel is gebleken, dan wel van overheidswege is vastgesteld dat
      deze dieren vrij zijn van deze stoffen, besluiten dat de producten uit de handel worden genomen en centraal worden
      opgeslagen.
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel28
  - number: '28.7'
    text: |-
      Een ieder die dieren en producten onder zich heeft of heeft gehad met betrekking waartoe maatregelen als bedoeld
      in het eerste, vijfde en zesde lid zijn getroffen, verstrekt op het eerste verzoek van Onze Minister inlichtingen
      omtrent herkomst en verhandeling van deze dieren en producten.
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel28
  - number: '29'
    text: |-
      Een ieder wie zulks aangaat handelt overeenkomstig dan wel verleent zijn medewerking aan de uitvoering van een
      krachtens deze wet gegeven bevel of genomen maatregel.
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel29
  - number: '30'
    text: |-
      Onze Minister is bevoegd tot toepassing van bestuursdwang ter handhaving van de bij of krachtens deze wet gestelde
      verplichtingen, indien dit in verband met risico's voor de gezondheid van dier of mens noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel30
  - number: '31'
    text: |-
      Onverminderd het bij of krachtens deze wet bepaalde is het verboden toevoegingsmiddelen, vervangende
      voederproteïnen, voormengsels en diervoeders te bereiden waarvan de verwerking tot gevolg heeft dat deze de
      gezondheid van mens of dier of het milieu in gevaar kunnen brengen.
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel31
  - number: '34.1'
    text: |-
      Het is degene die bedrijfsmatig dieren houdt verboden om door Onze Minister aangewezen substanties voorhanden of in
      voorraad te hebben, te vervoederen of anderszins oraal toe te dienen.
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel34
  - number: '34.2'
    text: 'Ingevolge het eerste lid kunnen slechts worden aangewezen, substanties die:'
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel34
  - number: 34.2.a
    text: als grondstof voor toevoegingsmiddelen, vervangende voederproteïnen, voormengsels of diervoeders kunnen dienen, of
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel34
  - number: 34.2.b
    text: in een communautaire maatregel zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel34
  - number: '38.1'
    text: |-
      In situaties waarin na beoordeling van de beschikbare informatie de mogelijkheid van schadelijke gevolgen voor de
      gezondheid van mens of dier of voor het milieu is geconstateerd, maar er nog wetenschappelijke onzekerheid heerst,
      kunnen, in afwachting van nadere wetenschappelijke gegevens ten behoeve van een vollediger risicobeoordeling,
      voorlopige maatregelen voor risicomanagement worden vastgesteld om het gekozen niveau van gezondheidsbescherming
      te waarborgen.
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel38
  - number: '38.2'
    text: |-
      De maatregelen, bedoeld in het eerste lid, zijn evenredig en beperken de handel niet meer dan nodig is om het
      gekozen niveau van bescherming te verwezenlijken, rekening houdend met de technische en economische haalbaarheid
      en andere terzake dienende factoren. De maatregelen worden binnen een redelijke termijn opnieuw bezien, afhankelijk
      van de aard van het geconstateerde risico voor het leven of de gezondheid en het soort wetenschappelijke informatie
      dat nodig is om de wetenschappelijke onzekerheid weg te nemen en een vollediger risicobeoordeling uit te voeren.
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel38
  - number: '38.3'
    text: 'De maatregelen, bedoeld in het eerste lid, kunnen bestaan uit:'
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel38
  - number: 38.3.f
    text: |-
      het verbieden van handelingen dan wel het wijzigen van voorschriften, bedoeld in [artikel 9][ref1], door Onze
      Minister;


      [ref1]: https://wetten.overheid.nl/BWBR0015764#Artikel9
    url: https://wetten.overheid.nl/BWBR0015764/2004-01-28#Artikel38
    references:
