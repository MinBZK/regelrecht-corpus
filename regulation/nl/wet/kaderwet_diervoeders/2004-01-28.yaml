        bwb_id: BWBR0015764
        artikel: '9'
        hoofdstuk: III
  - number: 38.3.i
    text: |-
      het treffen van maatregelen, bedoeld in de [artikelen 26, eerste lid][ref1], [27, eerste lid][ref2],
      [28, eerste, vijfde en zesde lid][ref3], alsmede het stellen van voorwaarden, beperkingen en het verbinden van
      voorwaarden aan deze maatregelen, bedoeld in de [artikelen 26, vierde lid][ref4], en [28, vierde lid][ref5], door
      Onze Minister;


