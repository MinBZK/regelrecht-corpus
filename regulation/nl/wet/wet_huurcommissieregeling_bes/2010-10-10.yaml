  - number: '9'
    text: |-
      Blijft de verhuurder in gebreke aan de verplichtingen in het eerste en tweede lid van het voorgaand artikel binnen
      de daarbij gestelde termijn te voldoen, dan geldt met ingang van de eerste dag der maand na afloop van die termijn,
      in plaats van de bedongen huurprijs, die waarvoor de woning op of laatstelijk voor 1 Augustus 1939 is verhuurd
      geweest; de som welke door de huurcommissie als de huurprijs van 1 Augustus 1939 is geschat, dan wel, indien het
      een nieuw gebouwde woning betreft, welke na die datum voor het eerste in gebruik is genomen, de huurprijs waarvoor
      de woning voor het eerst is verhuurd, of, indien huurprijs vaststelling heeft plaats gehad, de huurprijs, welke
      door de huurcommissie is vastgesteld.

      Indien de verhuurder de schatting van de huurprijs van 1 maart 1977 voor wat betreft de openbare lichamen Bonaire,
      Sint Eustatius en Saba niet heeft gevraagd, kan de commissie daartoe te allen tijde ambtshalve overgaan.
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel9
  - number: 9bis
    text: |-
      De rechter kan elke vordering tot terugbetaling van op grond van de voorgaande artikelen teveel betaalde huur
      matigen, indien de billijkheid zulks vordert.
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel9bis
  - number: '10'
    text: |-
      De huur van een woonhuis wordt door opzegging van de zijde van de verhuurder niet beëindigd, zo daartoe niet
      de toestemming van de huurcommissie is verkregen, zelfs indien de opzegging is geschied voor de datum van de
      instelling der huurcommissie.

      Indien ingevolge het bepaalde in [artikel 1587 van het Burgerlijk Wetboek BES][ref1] de huur van rechtswege een
      einde zou nemen, zonder dat de opzegging is vereist, doch de huurder deze voor bepaalde of onbepaalde tijd wenst te
      verlengen, houdt de huur niet op dan na verkregen toestemming van de huurcommissie.

      De toestemming van de huurcommissie is eveneens vereist, indien de koper van een huis gebruik wil maken van de
      bevoegdheid, bij de huurovereenkomst voorbehouden om, ingeval van verkoop, de huurder tot de ontruiming van het
      gehuurde te noodzaken overeenkomstig het bepaalde in [artikel 1595 van het Burgerlijk Wetboek BES][ref2].

      De huurcommissie kan aan haar toestemming voorwaarden verbinden treffende het gebruik van de woning. Niet/niet
      volledig nakomen der voorwaarden kan intrekking van de toestemming ten gevolge hebben en de toewijzing van de
      woning aan de oorspronkelijke huurder geschieden, onverminderd het recht van deze op vergoeding van kosten, schaden
      en interessen.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1587
      [ref2]: https://wetten.overheid.nl/BWBR0028752#Artikel1595
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel10
    references:
      - id: ref1
