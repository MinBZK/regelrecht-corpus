  - number: '13'
    text: |-
      De verhuurder, die een der bepalingen van [artikelen 2 bis][ref1] of [8][ref2] overtreedt, wordt gestraft met een
      geldboete van de eerste categorie. Is een naamloze vennootschap, een coöperatieve of andere rechtspersoonlijkheid
      bezittende vereniging of een stichting verhuurder, dan worden de bestuurders, leden van het bestuur of
      commissarissen met dezelfde straf gestraft. De bij dit besluit strafbaar gestelde feiten worden beschouwd als
      overtredingen.


      [ref1]: https://wetten.overheid.nl/BWBR0028558#Artikel2bis
      [ref2]: https://wetten.overheid.nl/BWBR0028558#Artikel8
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0028558
        artikel: 2bis
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0028558
        artikel: '8'
        hoofdstuk: I
  - number: '14'
    text: |-
      De huurcommissie en het Gerecht in eerste aanleg zijn bevoegd bij de toepassing van dit besluit zodanige personen
      op te roepen en, al of niet na beëdiging, als getuigen of deskundigen te horen of te doen horen, als zij te hunner
      voorlichting nodig achten. Die personen zijn verplicht te verschijnen en de gevorderde voorlichting te geven. Zij
      worden opgeroepen bij aangetekende brief.

      Aan de verschenen personen kan vergoeding worden toegelegd op de voet van het tarief van
      [Besluit tarief justitiekosten strafzaken BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028534
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0028534
  - number: '15'
    text: |-
      De huurcommissie en het Gerecht in eerste aanleg zijn bevoegd om kosteloos inzage en afschrift of uittreksel
      te nemen of te doen nemen van de kohieren van de gebruiksbelasting voor zoveel betreft het eiland, waarvoor de
      commissie is ingesteld.
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel15
  - number: '16'
    text: |-
      Ter zake van de werkzaamheden van de huurcommissie en van het Gerecht in eerste aanleg ingevolge dit besluit worden
      aan belanghebbenden geen kosten in rekening gebracht.

      Alle stukken, krachtens dit besluit opgemaakt, zijn vrij van kosten.
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel16
  - number: '17'
    text: |-
      Onder huur en verhuur wordt verstaan iedere overeenkomst onder welke naam of in welke vorm ook aangegaan, die ten
      doel heeft, het ten gebruike verkrijgen en verstrekken van een woning.

      Onder huurprijs wordt verstaan het geheel van de geldelijke verplichtingen, welke de huurder tegen over de
      verhuurder bij of terzake van huur en verhuur op zich neemt.

      Onder woning wordt verstaan ieder gebouw of elk gedeelte van een gebouw dat afzonderlijk wordt verhuurd, alsmede
      elk perceel huurgrond voor het hebben daarop van woning.
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel17
  - number: 17bis
    text: |-
      1 De regeling hierbij bedoeld vindt overeenkomstige toepassing ten aanzien van winkels, magazijnen, tapperijen,
      koffiehuizen, logementen, sociëteiten, bierhuizen, ijshuizen, restaurants en kantoren, met dien verstande dat in
      plaats van het in [artikel 2 bis, eerste en tweede lid][ref1], genoemde percentage een maximum-percentage van 10
      zal gelden en in plaats van het in artikel 2 bis, derde lid, genoemde percentage een maximum-percentage van 14
      zal gelden.

      Evenmin is de regeling hierbij bedoeld van toepassing op de eerder genoemde panden, voor zover deze zijn gevestigd
      in een vrije zone op een daartoe bij besluit van de eilandsraad aangewezen industrieterrein.

      De regeling hierbij bedoeld is niet van toepassing ten aanzien van zeehavens, luchthavens, hotels en op eerder
      genoemde panden voorzover deze in een zeehaven, op een luchthaven of in een hotel gevestigd zijn.

      2 Ten aanzien van de in het 1e lid genoemde objecten wordt de in [het 1e en 2e lid van artikel 8 ][ref2]der
      regeling bedoelde termijn gerekend in te gaan op de dag van de inwerkingtreding van dit besluit en wordt voor de
      toepassing van [het 1e lid van artikel 9][ref3] evenbedoelde termijn gesteld in de plaats van die aldaar bedoeld.


      [ref1]: https://wetten.overheid.nl/BWBR0028558#Artikel2bis
      [ref2]: https://wetten.overheid.nl/BWBR0028558#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0028558#Artikel9
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel17bis
    references:
