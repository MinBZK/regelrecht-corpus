      - id: ref1
        bwb_id: BWBR0028558
        artikel: '28'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0028558
        artikel: '38'
        hoofdstuk: II
        paragraaf: '2'
  - number: '49'
    text: |-
      Van de indiening van een verzoek als bedoeld in het [voorgaand artikel][ref1] wordt door de secretaris der
      huurcommissie onverwijld kennis gegeven aan de huurder.

      De [artikelen 36][ref2] en [40][ref3] vinden overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028558#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0028558#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0028558#Artikel40
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0028558
        artikel: '48'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0028558
        artikel: '36'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0028558
        artikel: '40'
        hoofdstuk: II
        paragraaf: '2'
  - number: '50'
    text: |-
      Indien de verhuurder ener woning, welke voor onbepaalde tijd is verhuurd, of waarvan de huur ingevolge de
      schriftelijke huurovereenkomst kan worden opgezegd, aan de huurder de huur wil opzeggen, wendt hij zich vooraf tot
      de huurcommissie met het schriftelijk verzoek daartoe toestemming te verlenen.

      Hij vermeldt daarbij de naam van de huurder en kortelijks de gronden waarop hij meent de huur te moeten opzeggen.
      Die gronden moeten, behoudens het geval, bedoeld in het [tweede lid van artikel 12][ref1], uitsluitend betrekking
      hebben op het niet voldoen door de huurder aan zijn verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0028558#Artikel12
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0028558
        artikel: '12'
        hoofdstuk: I
  - number: '51'
    text: |-
      Voor het verzoekschrift, bedoeld bij het voorgaand artikel, kan het volgend model worden gebezigd:

      «De ondergetekende .........................,

      wonende te ......................... deelt bij deze aan de huurcommissie te .........................
      mede, dat hij de woning, gelegen ......................... voor onbepaalde tijd (bij schriftelijke
      overeenkomst, waarvan afschrift hierbij overgelegd wordt, met ingang van ......................... voor
      de tijd van .........................) heeft verhuurd aan ......................... voor de huurprijs van
      USD ................. per .................; dat hij de huur met ingang van ......................... wenst op
      te zeggen.

      De reden waarom hij daartoe wil overgaan is ......................... Derhalve verzoekt hij overeenkomst het
      bepaalde in artikel 10 van Huurcommissie-Regeling de huurcommissie om tot de opzegging van de huur toestemming
      te verlenen».

      (ondertekening en dagtekening).
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel51
  - number: '52'
    text: |-
      Indien bij de behandeling van het verzoek blijkt, dat er tussen de verhuurder en de huurder geschil bestaat
      over het bedrag der huur, hetwelk op grond van bepalingen van dit besluit verschuldigd is, zal de huurcommissie
      daarnaar onderzoek doen, aan partijen mededelen, welk bedrag van de huur naar hare mening verschuldigd is en hare
      toestemming niet verlenen alvorens de huurder een termijn te hebben gegund om alsnog aan zijne verplichtingen te
      voldoen.
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel52
  - number: '53'
    text: |-
      [Artikel 50][ref1] vindt overeenkomstige toepassing in de gevallen bedoeld in het
      [tweede en derde lid van artikel 10][ref2].

      Het verzoekschrift kan, met de nodige wijzigingen, worden ingekleed volgens het model, bij [artikel 51][ref3]
      vastgesteld.

      Bij de behandeling van het verzoekschrift is [artikel 52][ref4] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028558#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0028558#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0028558#Artikel51
      [ref4]: https://wetten.overheid.nl/BWBR0028558#Artikel52
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0028558
        artikel: '50'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0028558
        artikel: '10'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0028558
        artikel: '51'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0028558
        artikel: '52'
        hoofdstuk: II
        paragraaf: '2'
  - number: '54'
    text: |-
      Bij afwezigheid of ontstentenis van de voorzitter worden zijn werkzaamheden verricht door de plaatsvervangende
      voorzitter. Bij afwezigheid of ontstentenis van een ander lid, neemt een der plaatsvervangende leden zitting op
      verzoek van de voorzitter en met inachtneming van het bepaalde bij [artikel 19, derde lid][ref1]. Bij afwezigheid
      of ontstentenis van de secretaris worden zijn werkzaamheden verricht door de plaatsvervangende secretaris of, bij
      afwezigheid of ontstentenis van deze, door het lid der huurcommissie, dat de voorzitter daartoe zal aanwijzen.


      [ref1]: https://wetten.overheid.nl/BWBR0028558#Artikel19
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0028558
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
  - number: '55'
    text: |-
      Waar in deze wet sprake is van de «voorzitter» van de huurcommissie, wordt daaronder mede verstaan de
      plaatsvervangende voorzitter, die bij afwezigheid of ontstentenis van de voorzitter diens werkzaamheden verricht.

      Onder de «secretaris» wordt mede verstaan de plaatsvervangende secretaris, wanneer deze op verzoek van de
      voorzitter de werkzaamheden van de secretaris verricht.

      Een plaatsvervangend lid, dat op verzoek van de voorzitter aan de werkzaamheden van de huurcommissie deelneemt is,
      wat die werkzaamheden betreft, lid der huurcommissie in de plaats van het lid dat hij vervangt.
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel55
  - number: '56'
    text: |-
      De secretaris geniet voor zijn werkzaamheden een schadeloosstelling, waarvan het bedrag door het bestuurscollege
      wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel56
  - number: '57'
    text: |-
      De huurcommissie kan geen zaak behandelen, indien niet drie leden aanwezig zijn en de belangen van huurders en die
      van verhuurders van woningen niet gelijkelijk vertegenwoordigd zijn.
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel57
  - number: '58'
    text: |-
      De leden en de secretaris van de huurcommissie zijn verplicht het geheim der beraadslagingen te bewaren. Zij zijn
      voorts verplicht tot geheimhouding omtrent al hetgeen hun in hun hoedanigheid is bekend geworden.
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel58
  - number: '59'
    text: |-
      De secretaris doet alle ingekomen stukken, betrekking hebbende op woningen waaromtrent de huurcommissie heeft te
      oordelen, onverwijld aan de voorzitter ter kennisneming toekomen.
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel59
  - number: '60'
    text: |-
      De voorzitter bepaalt dag, plaats en uur van behandeling van de zaak. De secretaris geeft daarvan onverwijld kennis
      aan de leden.

      Schriftelijke bescheiden, tot de zaak betrekkelijk, worden voor de behandeling bij de secretaris nedergelegd ter
      kennisneming van de leden.
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel60
  - number: '61'
    text: |-
      De leden onthouden zich van deelneming aan de behandeling van enige zaak, welke hun, hun echtgenoten of bloed-
      of aanverwanten tot en met de derde graad, persoonlijk aangaat, of waarin zij of een der genoemde personen als
      gemachtigden zijn betrokken. Deze onthouding wordt ten aanzien van de bepaalde zaak als afwezigheid aangemerkt.
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel61
  - number: '62'
    text: |-
      De oproeping van de huurder en van de verhuurder om bij de behandeling van een verzoek om goedkeuring van een
      hogere huurprijs of om toestemming tot opzegging van de huur tegenwoordig te zijn, geschiedt door de secretaris bij
      aangetekende brief.
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel62
  - number: '63'
    text: |-
      Indien de huurcommissie ingeval van een verzoek om goedkeuring van een hogere huurprijs na kennisneming van het
      verzoekschrift van oordeel is, dat de verhuurder aannemelijk heeft gemaakt, dat de hogere huurprijs redelijk is in
      verband met de normale huurwaarde der woning op 1 maart 1977 voor wat betreft de openbare lichamen Bonaire, Sint
      Eustatius en Saba, vermeerderd met de hogere uitgaven, die hij ter zake van de woning heeft te bestrijden, dan kan
      zij de hogere huurprijs goedkeuren zonder oproeping van huurder en verhuurder.
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel63
  - number: '64'
    text: |-
      Huurder en verhuurder kunnen zich voor de huurcommissie door een gemachtigde doen bijstaan of door een schriftelijk
      gemachtigde doen vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel64
  - number: '65'
    text: |-
      De oproeping van personen om als getuigen of deskundigen te worden gehoord geschiedt door de secretaris.

      Indien de huurcommissie beëdiging van een getuige wenselijk oordeelt, geschiedt deze op de wijze van zijn
      godsdienstige gezindheid voor het afleggen der verklaring.

      Ook kan de huurcommissie getuigen of deskundigen horen, die door een der partijen medegebracht, vrijwillig voor
      haar verschijnen.
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel65
  - number: '66'
    text: |-
      Indien de huurcommissie voor de schatting van de huurprijs van 1 maart 1977 voor wat betreft de openbare lichamen
      Bonaire, Sint Eustatius en Saba van een woning, die voor of op die dag niet is verhuurd geweest, voorlichting door
      deskundigen, zoals bij [artikel 14][ref1] bedoeld, onnodig oordeelt, kan zij een of meer harer leden opdragen een
      onderzoek in te stellen en verslag uit te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0028558#Artikel14
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0028558
        artikel: '14'
        hoofdstuk: I
  - number: '67'
    text: |-
      De huurcommissie kan een of meer harer leden opdragen de zaken te onderzoeken, voordat deze door haar worden
      beslist.

      De huurcommissie kan voorts een of meer harer leden opdragen een plaatselijk onderzoek in te stellen of getuigen of
      deskundigen te horen. Zij kan deze leden de secretaris toevoegen.
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel67
  - number: '68'
    text: |-
      In alle zaken doet de voorzitter hoofdelijk rondvraag, te beginnen met het jongste lid in leeftijd. Zelf brengt hij
      het laatst zijn advies uit.

      Ieder aanwezig lid is verplicht zijn advies uit te brengen.
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel68
  - number: '69'
    text: Alle beslissingen worden genomen bij meerderheid van stemmen.
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel69
  - number: '70'
    text: |-
      De uitspraak der huurcommissie wordt op het verzoekschrift gesteld of daaraan gehecht. Zij is met redenen omkleed,
      zij vermeldt de leden, die haar hebben gegeven, en wordt door de voorzitter en de secretaris der zitting, waarin de
      beslissing genomen is, ondertekend.

      De mededeling van de uitspraak der huurcommissie ingevolge [artikel 5, eerste lid][ref1] in verband met
      [artikel 8, derde lid][ref2] en [artikel 12, vierde lid][ref3], geschiedt bij gedagtekende aan te tekenen brieven
      van de secretaris, waarbij aan ieder hunner een afschrift der uitspraak en van het verzoekschrift toegezonden
      wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0028558#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0028558#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0028558#Artikel12
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0028558
        artikel: '5'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0028558
        artikel: '8'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0028558
        artikel: '12'
        hoofdstuk: I
  - number: '71'
    text: |-
      Indien een verzoekschrift niet voldoende mededeling bevat, stelt de secretaris de verzoeker in de gelegenheid het
      verzoekschrift aan te vullen. De secretaris is hem daarbij, voor zoveel nodig, behulpzaam.
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel71
  - number: '72'
    text: |-
      De secretaris is bij de zitting der huurcommissie tegenwoordig. Hij houdt aantekening van hetgeen aldaar verhandeld
      wordt, met vermelding van de zakelijke inhoud van de verklaringen van de door de commissie gehoorde personen.
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel72
  - number: '73'
    text: |-
      Op schriftelijke aanvrage geeft de secretaris schriftelijke inlichtingen betreffende uitspraken der huurcommissie
      in zake schattingen, goedkeuringen en vaststellingen van huurprijzen en toestemmingen tot opzegging en beëindiging
      van huur.
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel73
  - number: '74'
    text: |-
      De secretaris houdt drie afzonderlijke registers, te weten:

      1°. van de uitspraken der huurcommissie waarbij de huurprijs van 1 maart 1977 voor wat betreft de openbare
      lichamen Bonaire, Sint Eustatius en Saba is geschat van woningen die voor of op die dag niet zijn verhuurd geweest
      («Schattingen»);.

      2°. van de uitspraken der huurcommissie, waarbij beslist is op verzoek om goedkeuring van een hogere huurprijs
      («Verhoging»);

      3°. van de uitspraken der huurcommissie, waarbij beslist is op verzoeken om toestemming tot opzegging of
      beëindiging van huur («Beëindiging»).

      In deze registers worden, ieder onder een afzonderlijk nummer kortelijks vermeld alle zaken in de volgorde waarin
      zij worden aangebracht.
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel74
  - number: '75'
    text: De secretaris verricht voorts de werkzaamheden, hem door de huurcommissie of door haar voorzitter opgedragen.
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel75
  - number: '76'
    text: |-
      Voor de bestrijding van bureau-onkosten en de uitbetaling van de aan getuigen en deskundigen toe te leggen
      vergoedingen worden de secretaris gelden ter goede rekening verstrekt.
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel76
  - number: '77'
    text: |-
      Het beroep van de uitspraak van de huurcommissie geschiedt bij een geschrift, waarin aan het Gerecht in eerste
      aanleg wordt verzocht die uitspraak te vernietigen en een andere te geven.
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel77
  - number: '78'
    text: |-
      Het verzoekschrift vermeldt de redenen, waarom de uitspraak van de huurcommissie de verzoeker onjuist voorkomt, en
      de uitspraak, die de verzoeker in de plaats daarvan wenst.
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel78
  - number: '79'
    text: |-
      Bij het verzoekschrift worden overgelegd het de verzoeker toegezonden afschrift van de uitspraak van de
      huurcommissie en de brief van de secretaris waarbij het werd toegezonden.
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel79
  - number: '80'
    text: |-
      Voor het verzoekschrift, door de verhuurder in te zenden, kan het volgend model worden gebezigd:

      «De ondergetekende .........................

      wonende te ......................... deelt bij deze aan het Gerecht in eerste aanleg te .........................
      mede, dat de huurcommissie te ......................... op zijn verzoek om ......................... heeft beschikt
      volgens de uitspraak, waarvan een afschrift hiernevens wordt overgelegd;

      dat die uitspraak hem onjuist voorkomt op grond dat .........................

      Weshalve hij het Gerecht in eerste aanleg verzoekt die uitspraak te vernietigen en in plaats
      daarvan .........................»

      (ondertekening en dagtekening)
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel80
  - number: '81'
    text: |-
      Voor het verzoekschrift, door de huurder in te zenden, kan het volgend model worden gebezigd:

      «De ondergetekende .........................

      wonende ......................... deelt bij deze aan het Gerecht in eerste aanleg te .........................
      mede, dat de huurcommissie te ......................... op verzoek van de verhuurder omtrent zijn woning een
      beschikking heeft gegeven, waarvan een afschrift hiernevens wordt overgelegd;

      Dat die uitspraak hem onjuist voorkomt op grond dat .........................;

      Weshalve hij het Gerecht in eerste aanleg verzoekt die uitspraak te vernietigen en in plaats
      daarvan .........................»

      (ondertekening en dagtekening)
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel81
  - number: '82'
    text: |-
      De griffier van het Gerecht in eerste aanleg deelt onverwijld aan de secretaris der huurcommissie schriftelijk mede
      dat beroep van de uitspraak is aangetekend.

      Hij deelt hem de beslissing van de rechter met haar dagtekening onverwijld schriftelijk mede en zendt hem, indien
      het Gerecht in eerste aanleg de uitspraak van de huurcommissie niet in allen dele heeft bevestigd, een afschrift
      dier beslissing.

      De secretaris van de huurcommissie doet van de uitspraak van het Gerecht in eerste aanleg, onverwijld schriftelijk
      mededeling aan de verhuurder en de huurder en houdt daarvan aantekening in zijn registers.
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel82
  - number: '83'
    text: |-
      Het Gerecht in eerste aanleg verklaart het beroep van de huurder of van de verhuurder van de uitspraak van de
      huurcommissie niet ontvankelijk, indien het niet steunt op de grond dat de huurcommissie bij die uitspraak niet
      of niet voldoende in acht heeft genomen, hetgeen bepaald is bij [artikelen 3][ref1], [4][ref2], [8][ref3] of
      [12][ref4] of bij een van de [artikelen van Hoofdstuk II § 3][ref5] van dit besluit, en indien daarbij niet de
      reden is vermeld waarom dit naar de mening van de verzoeker het geval is.


      [ref1]: https://wetten.overheid.nl/BWBR0028558#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0028558#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0028558#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0028558#Artikel12
      [ref5]: https://wetten.overheid.nl/BWBR0028558#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0028558
        artikel: '3'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0028558
        artikel: '4'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0028558
        artikel: '8'
        hoofdstuk: I
      - id: ref4
        bwb_id: BWBR0028558
        artikel: '12'
        hoofdstuk: I
      - id: ref5
        bwb_id: BWBR0028558
        hoofdstuk: II
        paragraaf: '3'
  - number: '84'
    text: |-
      Indien het Gerecht in eerste aanleg uit de toegezonden stukken blijkt, dat het beroep niet ontvankelijk is,
      verwerpt hij het beroep zonder nader onderzoek van de zaak.
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel84
  - number: '85'
    text: |-
      Indien het Gerecht in eerste aanleg een nader onderzoek der zaak nodig oordeelt, bepaalt hij dag, plaats en uur van
      behandeling en doet hij de verzoeker en diens wederpartij door de griffier bij aangetekende brief oproepen om bij
      de behandeling tegenwoordig te zijn.
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel85
  - number: '86'
    text: |-
      Indien het Gerecht in eerste aanleg beëdiging van een getuige of een deskundige wenselijk oordeelt, geschiedt deze
      voor het afleggen van de verklaring op de wijze van zijn godsdienstige gezindheid.

      Ook kan het Gerecht in eerste aanleg getuigen of deskundigen horen, die, door een der partijen medegebracht,
      vrijwillig voor hem verschijnen.
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel86
  - number: '87'
    text: |-
      Indien het Gerecht in eerste aanleg de uitspraak der huurcommissie niet bevestigt, is hij, doende wat der
      huurcommissie was, niet gebonden aan hetgeen in het verzoekschrift is verzocht.
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel87
  - number: '88'
    text: |-
      Op schriftelijke aanvrage geeft de griffier schriftelijke inlichtingen betreffende beslissingen door het Gerecht in
      eerste aanleg genomen.
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel88
  - number: '89'
    text: |-
      In de modellen hierboven wordt in plaats van «woning» gelezen «een perceel huurgrond voor het hebben daarop van een
      woning», indien het zodanig perceel huurgrond betreft.
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel89
  - number: '90'
    text: Deze wet kan worden aangehaald als Wet huurcommissieregeling BES
