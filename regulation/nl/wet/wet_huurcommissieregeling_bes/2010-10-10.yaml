        artikel: '1587'
      - id: ref2
        bwb_id: BWBR0028752
        artikel: '1595'
  - number: '11'
    text: |-
      In de gevallen, in het [voorgaand artikel][ref1] bedoeld, doet de huurcommissie, partijen gehoord althans
      behoorlijk opgeroepen, zo spoedig mogelijk uitspraak. Hare beslissing is met redenen omkleed.


      [ref1]: https://wetten.overheid.nl/BWBR0028558#Artikel10
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0028558
        artikel: '10'
        hoofdstuk: I
  - number: '12'
    text: |-
      Behoudens het bepaalde in het tweede lid, verleent de huurcommissie haar toestemming alleen indien de huurder aan
      zijn in [artikel 1577 van het Burgerlijk Wetboek BES][ref1] omschreven verplichtingen niet voldoet. Zij kan de
      huurder, op zijn verzoek, een termijn gunnen om alsnog aan zijn verplichtingen te voldoen. Na het verstrijken van
      die termijn beslist de huurcommissie na verhoor, althans behoorlijke oproeping, van partijen.

      In bijzondere gevallen kan de huurcommissie de beëindiging van de huur op andere grond toestaan, indien haar
      blijkt, dat de eigenaar, of in geval van gedeeltelijke onderhuur, de hoofdbewoner daarbij een rechtmatig belang
      heeft.

      Indien de huurcommissie haar toestemming verleent, bepaalt zij, met inachtneming van de termijnen welke het
      plaatselijk gebruik tot het doen van opzeggingen medebrengt, het tijdstip waarop de huur een einde zal nemen.

      Van de uitspraken der huurcommissie, bedoeld in [artikel 11][ref2], is hoger beroep op de rechter toegelaten. Het
      bepaalde in [artikel 5][ref3] is ten deze toepasselijk.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1577
      [ref2]: https://wetten.overheid.nl/BWBR0028558#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0028558#Artikel5
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: '1577'
      - id: ref2
        bwb_id: BWBR0028558
        artikel: '11'
