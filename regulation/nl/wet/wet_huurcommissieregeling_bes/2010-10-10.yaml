articles:
  - number: '1'
    text: |-
      In elk der openbare lichamen Bonaire, Sint Eustatius en Saba wordt door het bestuurscollege een huurcommissie
      ingesteld die bevoegd is voor het desbetreffende openbare lichaam.
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel1
  - number: '2'
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel2
  - number: 2bis
    text: |-
      1 Het is verboden op de openbare lichamen Bonaire, Sint Eustatius en Saba als verhuurder een hogere huurprijs
      onder welke naam of in welke vorm ook, te bedingen voor het gebruik van een woning dan de huurprijs voor de woning
      geldende op of laatstelijk voor 1 maart 1977, indien niet die hogere huurprijs door de betrokken huurcommissie
      is goedgekeurd of vastgesteld, met dien verstande dat de huurprijs per jaar niet meer mag bedragen dan 8% van de
      totale bouwkosten, waaronder begrepen de waarde van de grond, van de betreffende woning.

      2 Is een woning voor of op 1 maart 1977 niet verhuurd geweest, dan vraagt de verhuurder aan de huurcommissie
      schatting van de huurprijs van 1 maart 1977, indien deze schatting nog niet heeft plaats gehad en geldt als die
      huurprijs de som, welke door de huurcommissie als huurprijs van 1 maart 1977 wordt geschat met dien verstande dat
      de huurprijs per jaar niet meer mag bedragen dan 8% van de totale bouwkosten, waaronder begrepen de waarde van de
      grond, van de betreffende woning. Die schatting kan door de huurcommissie ook ambtshalve geschieden.

      3 Nieuw gebouwde, op of na 1 maart 1977 voor het eerst in gebruik genomen, woningen mogen niet verhuurd worden,
      tenzij de huurcommissie de huurprijs, hetzij ambtshalve, hetzij op verzoek van de huurder of verhuurder heeft
      vastgesteld. Bij deze vaststelling van de huurprijs houdt de huurcommissie rekening met de totale bouwkosten,
      waaronder begrepen de waarde van de grond, van de betreffende woning, met dien verstande dat de huurprijs per jaar
      niet meer dan 12% van de bouwkosten bedragen.

      4 De eilandsraad kan de in de voorgaande leden genoemde percentages verhogen of verlagen. Aan de verhoging of
      verlaging kunnen voorwaarden worden verbonden.

      5 a. De huurcommissie geeft bij haar beslissing aan wanneer de vastgestelde huurprijs voor de nieuw gebouwde, na 1
      maart 1977 voor het eerst in gebruik genomen woning ingaat. De dag van ingang mag niet op een vroegere datum worden
      vastgesteld dan de dag waarop het verzoek tot huurprijsvaststelling is ingediend.

      b. Bij verhuur van een gemeubileerde woning is de verhuurder verplicht de prijzen voor woning en meubilering
      afzonderlijk vast te stellen. Voor de meubilering mag geen hogere huurprijs worden berekend dan het bedrag dat door
      de huurcommissie is vastgesteld.

      6 Wanneer het bedrag der bouwkosten, waaronder begrepen de waarde van de grond, van woningen door de huurcommissie
      op USD 56.000 of meer is vastgesteld, zijn de bepalingen van deze wet welke betrekking hebben op de huurprijs niet
      meer van toepassing op bedoelde woningen.
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel2bis
  - number: '3'
    text: |-
      De huurcommissie behandelt en beslist de bij haar aangebrachte zaken zo spoedig mogelijk. Hare beslissing is met
      redenen omkleed.

      Zij keurt de hogere huurprijs niet goed, zo de verhuurder niet aannemelijk maakt, dat de hogere huurprijs redelijk
      is in verband met de normale huurwaarde op 1 maart 1977 voor wat betreft de openbare lichamen Bonaire, Sint
      Eustatius en Saba vermeerderd met de hogere uitgaven, die hij terzake van de woning heeft te bestrijden en de
      kosten wegens het aanbrengen van ingrijpende verbeteringen en veranderingen. In bijzondere gevallen echter kan de
      huurcommissie de verhoging op andere grond goedkeuren.

      De huurcommissie is bevoegd aan haar goedkeuring van de hogere huurprijs terugwerkende kracht te verlenen tot een
      bij de uitspraak te bepalen tijdstip, hetwelk niet vroeger kan zijn dan de dag, waarop het verzoek om goedkeuring
      is ingekomen, doch slechts indien haar gebleken is, dat de huurder met de verhoging instemt.

      De huurcommissie is bevoegd de huurprijs voorwaardelijk goed te keuren, in dien zin, dat wanneer de door haar
      aangewezen verbeteringen of herstellingen aan de woning niet zijn aangebracht binnen een bij de uitspraak te
      bepalen tijd, de huurcommissie ambtshalve of op verzoek van de huurder, met terzijdestelling van de eerste
      uitspraak, alsnog een lagere huurprijs kan vaststellen.
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel3
  - number: '4'
    text: |-
      Keurt de huurcommissie de hogere huurprijs niet goed, dan stelt zij, de verhuurder gehoord, althans behoorlijk
      opgeroepen, het bedrag vast, waarvoor de woning mag worden verhuurd. Daarbij wordt rekening gehouden met de normale
      huurwaarde op 1 maart 1977 voor wat betreft de openbare lichamen Bonaire, Sint Eustatius en Saba vermeerderd met
      de hogere uitgaven, die de verhuurder ter zake van de woning heeft te bestrijden, alsmede met de aangebrachte
      ingrijpende veranderingen en verbeteringen of, wat betreft een nieuw gebouwde woning, na 1 augustus 1939
      voor het eerst in gebruik genomen, met de huurprijs, waarvoor de woning voor het eerst is verhuurd, of indien
      huurprijsvaststelling heeft plaats gehad, met de huurprijs, welke door de huurcommissie is vastgesteld.

      Bij haar beslissing houdt de huurcommissie rekening met de staat van onderhoud der woning, voor zover dit door
      verhuurder bekostigd wordt.
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel4
  - number: '5'
    text: |-
      De huurcommissie deelt aan de verhuurder en aan de huurder haar uitspraak schriftelijk mede.

      Van de uitspraak der huurcommissie staat zowel aan de huurder als aan de verhuurder gedurende veertien dagen na de
      dagtekening der mededeling beroep open bij het Gerecht in eerste aanleg.

      Het Gerecht in eerste aanleg behandelt en beslist de bij hem aangebrachte zaken zo spoedig mogelijk. Indien hij de
      uitspraak niet bevestigd, doet hij wat der huurcommissie was.

      Tegen zijne beslissing is geen rechtsmiddel toegelaten.

      De regelen en vormen van het beroep van de uitspraken van de huurcommissie op het Gerecht in eerste aanleg worden
      nader in [Hoofdstuk III][ref1] geregeld.


      [ref1]: https://wetten.overheid.nl/BWBR0028558#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0028558
        hoofdstuk: III
  - number: '6'
    text: |-
      Na het verstrijken van zes maanden nadat omtrent de huurprijs van ene woning bij einduitspraak is beslist, kan een
      nieuwe uitspraak der huurcommissie omtrent die woning worden verzocht.
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel6
  - number: '7'
    text: |-
      Indien een hogere huurprijs voor het gebruik van een woning is bedongen dan ingevolge het bepaalde in de voorgaande
      artikelen geoorloofd is, geldt, in plaats van dat bedrag, de huurprijs, waarvoor de woning op of laatstelijk voor
      1 Augustus 1939 is verhuurd geweest. Betreft het een woning welke voor 1 maart 1977 voor wat betreft de openbare
      lichamen Bonaire, Sint Eustatius en Saba niet is verhuurd geweest dan geldt de som, welke door de huurcommissie
      als de huurprijs van 1 Augustus 1939 is geschat. Betreft het een nieuw gebouwde woning, na 1 Augustus 1939 voor
      het eerst in gebruik genomen, dan geldt de huurprijs waarvoor de woning voor het eerst is verhuurd of, indien
      huurprijsvaststelling heeft plaats gehad, de huurprijs, welke door de huurcommissie is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel7
  - number: '8'
    text: |-
      Is voor de instelling der huurcommissie, doch na 1 Augustus 1939 een hogere huurprijs bedongen dan op of
      laatstelijk voor laatstgemeld tijdstip gold, of indien het een nieuw gebouwde woning betreft, dan de huurprijs
      waarvoor de woning voor het eerst is verhuurd, of, indien huurprijsvaststelling heeft plaats gehad, dan de
      huurprijs welke door de huurcommissie is vastgesteld, dan is de verhuurder gehouden binnen een maand na die
      instelling zich tot de huurcommissie te wenden met het verzoek die hogere huurprijs goed te keuren, tenzij hij
      vrijwillig de huurprijs met ingang van de eerste dag der volgende maand verlaagt tot de huurprijs van 1 Augustus
      1939 of die waarvoor de woning voor het eerst is verhuurd, of, indien huurprijsvaststelling heeft plaats gehad, tot
      de huurprijs, welke door de huurcommissie is vastgesteld.

      Is een woning, welke voor of op 1 Augustus 1939 niet verhuurd is geweest, daarna, doch voor de instelling der
      huurcommissie, wel verhuurd, dan vraagt de verhuurder binnen een maand na die instelling aan de huurcommissie
      schatting van de huurprijs van 1 maart 1977 voor wat betreft de openbare lichamen Bonaire, Sint Eustatius en Saba
      en is hij gehouden ingeval die huurprijs wordt geschat op een lager bedrag dan de bedongen huurprijs, binnen een
      maand na de dag waarop omtrent de schatting bij einduitspraak is beslist, zich tot de huurcommissie te wenden met
      het verzoek de bedongen huurprijs goed te keuren, tenzij hij vrijwillig de huurprijs met ingang van de eerste dag
      der volgende maand verlaagt tot het door de commissie geschat bedrag.

      Het bepaalde in de [artikelen 3][ref1], [5][ref2] en [6][ref3] is van toepassing.

      Keurt de huurcommissie de hogere huurprijs niet goed, dan stelt zij, op de wijze als in [artikel 4][ref4]
      bepaald, een lager bedrag vast, hetwelk als huurprijs geldt. Deze verlaging werkt terug tot het tijdstip, door de
      huurcommissie te bepalen, welke tijdstip niet vroeger kan zijn dan 1 augustus 1939.

      Van de vrijwillige verlaging van de huur, bedoeld in het eerst en tweede lid van dit artikel, geeft de verhuurder
      kennis aan de huurcommissie, die daarvan schriftelijk mededeling doet aan de huurder.


      [ref1]: https://wetten.overheid.nl/BWBR0028558#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0028558#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0028558#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0028558#Artikel4
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel8
    references:
