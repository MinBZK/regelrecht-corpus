  - number: '18'
    text: |-
      De huurcommissie bestaat uit drie leden.

      De leden der huurcommissie moeten zijn meerderjarige Nederlandse onderdanen, woonachtig op het eiland, waarvoor de
      huurcommissie is ingesteld.
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel18
  - number: '19'
    text: |-
      Onder de leden is een voorzitter, een vertegenwoordiger van de belangen van de huurders van woningen en een
      vertegenwoordiger van de belangen der verhuurders van woningen.

      Niemand kan worden benoemd in meer dan een der bij het voorgaand lid genoemde hoedanigheden.

      Bij iedere huurcommissie worden voorts benoemd een plaatsvervangend voorzitter, een plaatsvervangend lid,
      uitsluitend om bij afwezigheid of ontstentenis van het daartoe benoemd lid in de commissie de belangen van
      de huurders van woningen te vertegenwoordigen, een plaatsvervangend lid, uitsluitend om bij afwezigheid of
      ontstentenis van het daartoe benoemd lid in de commissie de belangen van de verhuurders te vertegenwoordigen. Zijn
      moeten aan dezelfde vereisten voldoen als de leden der huurcommissie.
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel19
  - number: '20'
    text: |-
      De eigenaar van een woonhuis wordt geacht als zodanig niet bij de belangen van de verhuurders betrokken te zijn,
      zolang hij dat huis zelf bewoont. De huurder van een woonhuis wordt geacht als zodanig niet bij de belangen van de
      huurders betrokken te zijn, zolang hij een huurcontract, ingegaan voor 1 maart 1977 voor wat betreft de openbare
      lichamen Bonaire, Sint Eustatius en Saba, bezit, dat hem de huur van het huis voor tenminste twee jaren waarborgt.
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel20
  - number: '21'
    text: |-
      Aan de huurcommissie worden een secretaris en een plaatsvervangend secretaris toegevoegd; zij moeten aan dezelfde
      vereisten voldoen als de leden der huurcommissie.
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel21
  - number: '22'
    text: |-
      De voorzitter, de plaatsvervangend voorzitter, de verdere leden, de plaatsvervangende leden, de secretaris en de
      plaatsvervangende secretaris der huurcommissie worden door het bestuurscollege benoemd en ontslagen.
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel22
  - number: '23'
    text: Een zaak kan alleen schriftelijk bij de huurcommissie aanhangig worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel23
  - number: '24'
    text: |-
      Hij die een verzoekschrift tot de huurcommissie heeft gericht, verschaft haar alle hem ten dienste staande gegevens
      ter vervulling van haar taak. Hij draagt zich ten deze naar de wenken, hem door of namens de huurcommissie gegeven.
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel24
  - number: '25'
    text: |-
      Wanneer er verschil bestaat tussen de verplichtingen, waartoe de verhuurder of de huurder was gehouden op 1 maart
      1977 voor wat betreft de openbare lichamen Bonaire, Sint Eustatius en Saba en die waartoe hij ter zake van de
      woning later gehouden is, dan begroot de huurcommissie de geldswaarde van het verschil in de verplichtingen des
      verhuurders of des huurders op de beide tijdstippen, en houdt met die begroting rekening bij de beoordeling of de
      hogere huurprijs redelijk is.
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel25
  - number: '26'
    text: |-
      Een woning die op 1 maart 1977 voor wat betreft de openbare lichamen Bonaire, Sint Eustatius en Saba niet verhuurd
      was, wordt voor de toepassing van deze wet geacht ook voor die dag niet verhuurd te zijn geweest, indien blijkt,
      dat zij zo vele jaren voor genoemde dag niet verhuurd is geweest, dat, ook al was de laatste huurprijs der woning
      bekend, het bedrag daarvan voor het bepalen van de normale huurwaarde der woning op 1 Augustus 1939 niet een
      geschikte maatstaf zou kunnen zijn.
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel26
  - number: '27'
    text: |-
      De huurcommissie schat ambtshalve de huurprijs van 1 maart 1977 voor wat betreft de openbare lichamen Bonaire,
      Sint Eustatius en Saba van een woning, die voor of op die dag niet is verhuurd geweest, indien de schatting voor de
      uitvoering van dit besluit noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel27
  - number: '28'
    text: |-
      Hij die voor een woning een hogere huurprijs wil bedingen dan die van 1 maart 1977 voor wat betreft de openbare
      lichamen Bonaire, Sint Eustatius en Saba, wendt zich vooraf tot de huurcommissie met het schriftelijk verzoek die
      hogere huurprijs goed te keuren.

      Hij vermeldt daarbij kortelijks de gronden, waarop hij meent tot verhoging te moeten overgaan.

      Die grond moet behoudens in de gevallen bedoeld aan het slot van het[ tweede lid van artikel 3][ref1], uitsluitend
      betrekking hebben op de normale huurwaarde op 1 Augustus 1939, de hogere uitgaven, die hij ter zake van de woning
      heeft te bestrijden, zoals meerdere onderhoudskosten en verhoogde hypotheekrente en ingrijpende verbeteringen of
      veranderingen aan de woning aangebracht.

      Is de woning verhuurd, dan vermeldt hij tevens de naam des huurders.


      [ref1]: https://wetten.overheid.nl/BWBR0028558#Artikel3
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0028558
        artikel: '3'
        hoofdstuk: I
  - number: '29'
    text: |-
      Voor het verzoekschrift, bedoeld bij het voorgaand artikel, kan het volgend model worden gebezigd:

      «De ondergetekende .........................

      Wonende ............., verzoekt de huurcommissie te ......... om goed te keuren, dat hij de huurprijs van
      USD ........ per ........ van de woning, gelegen ............. met ingang van ........... verhoogt tot USD ........
      per .............

      De reden waarom verzoeker het noodzakelijk oordeelt tot verhoging over te gaan, is

      De 1 ste maart 1977 voor wat betreft de openbare lichamen Bonaire, Sint Eustatius en Saba was de woning verhuurd
      voor USD ........ per ...........

      De tegenwoordige huurder der woning is »

      (ondertekening en dagtekening)

      Indien dezelfde woning reeds het onderwerpen van een beslissing der huurcommissie heeft uitgemaakt, wordt daarvan
      melding gemaakt, b.v. op deze wijze:

      «Bij beslissing van de ............. 19.. heeft de huurcommissie een verhoging van de maandelijkse huurprijs tot
      USD ........ goedgekeurd; het beroep van de toenmalige huurder tegen deze goedkeuring is door het Gerecht in eerste
      aanleg bij beschikking van de ............. 19.. verworpen».
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel29
  - number: '30'
    text: |-
      Het door de huurcommissie ingevolge [artikel 4][ref1] als huurprijs vast te stellen bedrag kan niet lager zijn dan
      de huurprijs van 1 maart 1977 voor wat betreft de openbare lichamen Bonaire, Sint Eustatius en Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0028558#Artikel4
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0028558
        artikel: '4'
        hoofdstuk: I
  - number: '31'
    text: |-
      Hij, die voor het eerst een woning wil verhuren, welke vóór of op 1 Augustus 1939 niet is verhuurd geweest, wendt
      zich vooraf tot de huurcommissie met het schriftelijk verzoek de huurprijs van 1 Augustus 1939 van die woning te
      schatten.

      Verhuurt hij nochtans de woning zonder vooraf schatting van de huurprijs te hebben gevraagd, dan kan de huurder te
      allen tijde der huurcommissie verzoeken tot die schatting ambtshalve over te gaan.

      Van de uitspraak der huurcommissie waarbij de huurprijs van 1 maart 1977 voor wat betreft de openbare lichamen
      Bonaire, Sint Eustatius en Saba is geschat, wordt door de secretaris der commissie aan de verhuurder en, ingeval
      het huis reeds verhuurd is, ook aan de huurder kennis gegeven.

      De verplichting van het eerste lid vervalt, indien de huurcommissie de huurprijs van 1 Augustus 1939 reeds
      ambtshalve heeft geschat.
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel31
  - number: '32'
    text: |-
      Voor het verzoekschrift, bedoeld in de aanhef van het [voorgaand artikel][ref1], kan het volgend model worden
      gebezigd:

      «De ondergetekende .........................

      wonende te ......................... verzoekt de huurcommissie te ....................... de huurprijs van 1
      maart 1977 voor wat betreft de openbare lichamen Bonaire, Sint Eustatius en Saba te schatten van de woning,
      gelegen ......................., welke vóór of op 1 Augustus 1939 niet is verhuurd geweest.

      Dit verzoek geschiedt omdat verzoeker de woning thans wenst te verhuren».

      (ondertekening en dagtekening)


      [ref1]: https://wetten.overheid.nl/BWBR0028558#Artikel31
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0028558
        artikel: '31'
        hoofdstuk: II
        paragraaf: '2'
  - number: '33'
    text: |-
      In het geval, omschreven in het [eerste lid van artikel 31][ref1], kan de verhuurder ook desgewenst de
      huurcommissie tegelijk verzoeken, indien de huurprijs van 1 maart 1977 voor wat betreft de openbare lichamen
      Bonaire, Sint Eustatius en Saba lager mocht geschat worden dan de huurprijs die hij wil bedingen, deze laatste goed
      te keuren.

      Hij vermeldt dan kortelijks de gronden waarop hij meent, dat de huurcommissie de hogere huurprijs zou kunnen
      goedkeuren.


      [ref1]: https://wetten.overheid.nl/BWBR0028558#Artikel31
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0028558
        artikel: '31'
        hoofdstuk: II
        paragraaf: '2'
  - number: '34'
    text: |-
      Wil de verhuurder tegelijk schatting verzoeken en goedkeuring van de hogere huurprijs, dan wordt aan het model,
      vastgesteld bij [artikel 32][ref1], het volgende toegevoegd:

      «En aangezien verzoeker meent voor de woning een huurprijs te moeten bedingen van USD ..............
      per ................. verzoekt hij de huurcommissie tevens, om, indien dit bedrag hoger mocht blijken dan door de
      commissie geschatte huurprijs van 1 maart 1977 voor wat betreft de openbare lichamen Bonaire, Sint Eustatius en
      Saba, die hogere huurprijs goed te keuren en zulks op grond dat ................»


      [ref1]: https://wetten.overheid.nl/BWBR0028558#Artikel32
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0028558
        artikel: '32'
        hoofdstuk: II
        paragraaf: '2'
  - number: '35'
    text: |-
      Hij, die voor een nieuw gebouwde woning, na 1 maart 1977 voor wat betreft de openbare lichamen Bonaire, Sint
      Eustatius en Saba voor het eerst in gebruik genomen, een hogere huurprijs wil bedingen dan die, waarvoor de woning
      voor het eerst is verhuurd, of indien huurprijsvaststelling heeft plaats gehad, dan de huurprijs, welke door
      de huurcommissie is vastgesteld, wendt zich vooraf tot de huurcommissie met het schriftelijk verzoek die hogere
      huurprijs goed te keuren.

      [Artikel 28, tweede en derde lid][ref1], vindt overeenkomstige toepassing.

      Het verzoekschrift kan, met de nodige wijziging, worden ingekleed volgens het model, bij [artikel 29][ref2]
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028558#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0028558#Artikel29
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0028558
        artikel: '28'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0028558
        artikel: '29'
        hoofdstuk: II
        paragraaf: '2'
  - number: '36'
    text: |-
      Bij de behandeling van een verzoek als bedoeld in het [voorgaand artikel][ref1] aanvaardt de huurcommissie als de
      normale huurwaarde der woning de huurprijs, waarvoor zij voor het eerst is verhuurd.

      Het bepaalde in [artikel 25][ref2] vindt overeenkomstige toepassing.

      Het door de huurcommissie ingevolge [artikel 4][ref3] als huurprijs vast te stellen bedrag kan niet lager zijn dan
      de huurprijs, waarvoor de woning voor het eerst is verhuurd. Bij de vaststelling houdt de huurcommissie rekening
      met de hogere uitgaven, die de verhuurder ter zake van de woning heeft te bestrijden.


      [ref1]: https://wetten.overheid.nl/BWBR0028558#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0028558#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0028558#Artikel4
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0028558
        artikel: '35'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0028558
        artikel: '25'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0028558
        artikel: '4'
        hoofdstuk: I
  - number: '37'
    text: |-
      Indien de verhuurder van een woning, die vóór de instelling van de huurcommissie is verhuurd voor een hogere
      huurprijs dan die van 1 maart 1977 voor wat betreft de openbare lichamen Bonaire, Sint Eustatius en Saba er in
      toestemt de huur overeenkomstig het bepaalde in [artikel 8][ref1] te verlagen, doet hij binnen een maand na de
      instelling van de huurcommissie een schriftelijke mededeling toekomen, welke kan worden gedaan in deze vorm:

      «De ondergetekende .........................

      wonende te ......................... deelt bij deze aan de huurcommissie te mede dat de huurprijs van de woning
      gelegen ........................., welke thans bedraagt USD ................. per ................., met ingang
      van de eerste der komende maand door hem wordt verlaagd tot USD ................. per ................. zijnde de
      huurprijs die voor de woning gold op (laatstelijk vóór) 1 Augustus 1939».

      (ondertekening en dagtekening)


      [ref1]: https://wetten.overheid.nl/BWBR0028558#Artikel8
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0028558
        artikel: '8'
        hoofdstuk: I
  - number: '38'
    text: |-
      Indien de verhuurder niet bereid is de huur overeenkomstig het bepaalde in het [voorgaand artikel][ref1] te
      verlagen, wendt hij zich binnen een maand na de instelling tot de huurcommissie met het schriftelijk verzoek de
      hogere huurprijs goed te keuren.

      [Artikel 28, tweede en derde lid][ref2], vindt overeenkomstige toepassing.

      Voor het verzoekschrift kan het volgend model worden gebezigd:

      «De ondergetekende ........................., wonende te ......................... deelt bij deze aan de
      huurcommissie te ......................... mede, dat hij de woning, gelegen ........................., die op 1
      maart 1977 voor wat betreft de openbare lichamen Bonaire, Sint Eustatius en Saba verhuurd was voor een huurprijs
      van USD ................. per .................. later, namelijk de dus voor de instelling van de huurcommissie,
      heeft verhuurd voor USD ................. per .................

      De reden waarom verzoeker het noodzakelijk heeft geoordeeld tot die verhoging over te gaan,
      is .........................

      Mitsdien verzoekt hij de huurcommissie die hogere huurprijs goed te keuren».

      (ondertekening en dagtekening).


      [ref1]: https://wetten.overheid.nl/BWBR0028558#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0028558#Artikel28
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0028558
        artikel: '37'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0028558
        artikel: '28'
        hoofdstuk: II
        paragraaf: '2'
  - number: '39'
    text: |-
      Van de indiening van een mededeling als bedoeld in [artikel 37][ref1] en van een verzoek als bedoeld in
      [artikel 38][ref2] wordt door de secretaris der huurcommissie onverwijld kennis gegeven aan de huurder.

      Het door de huurcommissie ingevolge [artikel 8, vierde lid][ref3] als huurprijs vast te stellen bedrag kan niet
      lager zijn dan de huurprijs van 1 maart 1977 voor wat betreft de openbare lichamen Bonaire, Sint Eustatius en Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0028558#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0028558#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0028558#Artikel8
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0028558
        artikel: '37'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0028558
        artikel: '38'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0028558
        artikel: '8'
        hoofdstuk: I
  - number: '40'
    text: |-
      Indien de verhuurder eerst na het verstrijken van een maand na de instelling van de huurcommissie zich tot haar
      wendt met het verzoek de voor die instelling bedongen hogere huurprijs goed te keuren, wordt daarvan door de
      secretaris der huurcommissie onverwijld kennis gegeven aan de huurder, onder aantekening dat, gerekend vanaf de
      eerste dag der maand na het verstrijken van bedoelde termijn, geen hogere huur verschuldigd is geweest dan die
      welke op 1 maart 1977 voor wat betreft de openbare lichamen Bonaire, Sint Eustatius en Saba voor de woning gold.

      De huurcommissie neemt het verzoek in behandeling als ware het een verzoek om een hogere huurprijs te mogen
      bedingen als bedoeld in [artikel 28][ref1]. De secretaris doet intussen aan de bevoegde ambtenaar van het Openbaar
      Ministerie mededeling van de overtreding van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0028558#Artikel28
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0028558
        artikel: '28'
        hoofdstuk: II
        paragraaf: '2'
  - number: '41'
    text: |-
      Indien een woning, welke voor of op 1 maart 1977 voor wat betreft de openbare lichamen Bonaire, Sint Eustatius en
      Saba niet is verhuurd geweest, vóór de instelling van de huurcommissie is verhuurd, wendt de verhuurder zich binnen
      een maand na die instelling tot de huurcommissie met het schriftelijk verzoek de huurprijs van 1 Augustus 1939 van
      die woning te schatten.

      Na het verstrijken van de in het eerste lid bedoelde termijn kan de huurder te allen tijde der huurcommissie
      verzoeken tot die schatting ambtshalve over te gaan.
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel41
  - number: '42'
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel42
  - number: '43'
    text: |-
      In het geval, omschreven in het [eerste lid van artikel 41][ref1], kan de verhuurder ook desgewenst de
      huurcommissie tegelijk verzoeken, indien de huurprijs van 1 maart 1977 voor wat betreft de openbare lichamen
      Bonaire, Sint Eustatius en Saba lager mocht worden geschat dan de tegenwoordige huurprijs, deze laatste goed te
      keuren.

      Hij vermeldt dan kortelijks de gronden waarop hij meent dat de huurcommissie de hogere huurprijs zou kunnen
      goedkeuren en de naam van de huurders.


      [ref1]: https://wetten.overheid.nl/BWBR0028558#Artikel41
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0028558
        artikel: '41'
        hoofdstuk: II
        paragraaf: '2'
  - number: '44'
    text: |-
      Wil de verhuurder tegelijk schatting verzoeken en goedkeuring van de hogere huurprijs, dan wordt aan het model,
      vastgesteld bij[ artikel 42][ref1], het volgende toegevoegd:

      «En aangezien verzoeker bij bovenbedoelde overeenkomst voor de woning een huurprijs heeft bedongen van
      USD ................. per ........................., verzoekt hij de huurcommissie tevens om, indien de
      tegenwoordige huurprijs hoger blijkt dan de door de huurcommissie geschatte huurprijs van 1 maart 1977 voor wat
      betreft de openbare lichamen Bonaire, Sint Eustatius en Saba, die hogere huurprijs goed te keuren.

      Die goedkeuring zou kunnen gegrond zijn op de overweging

      De tegenwoordige huurder der woning is .........................»


      [ref1]: https://wetten.overheid.nl/BWBR0028558#Artikel42
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0028558
        artikel: '42'
        hoofdstuk: II
        paragraaf: '2'
  - number: '45'
    text: |-
      Indien een woning welke voor of op 1 augustus 1939 niet is verhuurd geweest, voor de instelling van de
      huurcommissie is verhuurd en de verhuurder eerst na het verstrijken van een maand na de instelling van de
      huurcommissie zich tot haar wendt met het verzoek de huurprijs van 1 maart 1977 voor wat betreft de openbare
      lichamen Bonaire, Sint Eustatius en Saba van de woning te schatten, dan neemt de huurcommissie het verzoek in
      behandeling evenals ware het tijdig gedaan. De secretaris doet intussen aan de bevoegde ambtenaar van het Openbaar
      Ministerie mededeling van de overtreding van dit besluit.
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel45
  - number: '46'
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel46
  - number: '47'
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel47
  - number: '48'
    text: |-
      Indien de verhuurder niet bereid is de huur overeenkomstig het bepaalde in het voorgaand artikel te verlagen, wendt
      hij zich binnen een maand na de instelling van de huurcommissie tot haar met het schriftelijk verzoek de hogere
      huurprijs goed te keuren.

      [Artikel 28, tweede en derde lid][ref1], vindt overeenkomstige toepassing.

      Het verzoekschrift kan, met de nodige wijziging, worden ingekleed volgens het model bij [artikel 38][ref2]
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028558#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0028558#Artikel38
    url: https://wetten.overheid.nl/BWBR0028558/2010-10-10#Artikel48
