  - number: XXXIIId.1
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld over door de rijksbelastingdienst te verstrekken
      tegemoetkomingen specifieke zorgkosten aan belastingplichtigen met uitgaven voor specifieke zorgkosten als bedoeld
      in [afdeling 6.5 van de Wet inkomstenbelasting 2001][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Afdeling6.5
    url: https://wetten.overheid.nl/BWBR0034538/2017-01-01#ArtikelXXXIIId
    references:
      - id: ref1
        bwb_id: BWBR0011353
        afdeling: '6.5'
  - number: XXXIIId.2
    text: |-
      De uitbetaling en terugvordering van verstrekte tegemoetkomingen specifieke zorgkosten geschieden overeenkomstig
      de regels die gelden voor de invordering van inkomstenbelasting, met dien verstande dat bij de overeenkomstige
      toepassing van [artikel 24 van de Invorderingswet 1990][ref1] een uit te betalen tegemoetkoming specifieke
      zorgkosten uitsluitend kan worden verrekend met een terugvordering van een tegemoetkoming specifieke zorgkosten.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel24
    url: https://wetten.overheid.nl/BWBR0034538/2017-01-01#ArtikelXXXIIId
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '24'
