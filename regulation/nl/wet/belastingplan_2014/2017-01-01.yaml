  - number: XVII
    text: |-
      Het aan de ondernemer toekomend recht om de belasting in aftrek te brengen op het tijdstip dat de belasting
      in rekening is gebracht ter zake van goederen en diensten voor zover deze waren bestemd voor de vervaardiging
      van een goed als bedoeld in [artikel 3, derde lid, onderdeel b, van de Wet op de omzetbelasting 1968][ref1],
      zoals dat artikel luidde op 31 december 2013, blijft in stand voor zover de ondernemer dit recht al had
      vóór 1 januari 2014. Deze aftrek wordt herzien bij ingebruikname van de goederen en diensten in de zin van
      [artikel 15, vierde lid, van de Wet op de omzetbelasting 1968][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel15
    url: https://wetten.overheid.nl/BWBR0034538/2017-01-01#ArtikelXVII
    references:
      - id: ref1
