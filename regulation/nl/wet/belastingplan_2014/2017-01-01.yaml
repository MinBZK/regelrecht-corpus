    text: |-
      Bij een overlijden in de periode van 1 januari 2015 tot en met 29 juni 2015 is
      [artikel 12, eerste lid, eerste volzin, van de Successiewet 1956][ref1] niet van toepassing op een schenking als
      bedoeld in [artikel 33a, eerste lid, van die wet][ref2], zoals dat luidde op 31 december 2014, voor zover voor die
      schenking een verhoogde vrijstelling gold.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0002226#Artikel33a
