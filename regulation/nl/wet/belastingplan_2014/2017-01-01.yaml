    text: |-
      Na toepassing van de [artikelen I][ref1], [II][ref2], [III][ref3], [V][ref4], [VI][ref5] of [VII][ref6] worden
      de bedragen in kolom III van de tabel in [artikel 2.10, eerste lid, van de Wet inkomstenbelasting 2001][ref7]
      bij ministeriële regeling gewijzigd in de bedragen die na toepassing van die artikelen voortvloeien
      uit de in de kolommen I en II van die tabel vermelde bedragen en de in kolom IV van die tabel vermelde
      percentages. De eerste volzin is van overeenkomstige toepassing op de bedragen in kolom III van de tabel in
      [artikel 2.10a, eerste lid, van de Wet inkomstenbelasting 2001][ref8], op de bedragen in kolom III van de tabel in
      [artikel 20a, eerste lid, van de Wet op de loonbelasting 1964][ref9] en op de bedragen in kolom III van de tabel in
