        artikel: '629'
  - number: 2.2.2°.c
    text: |-
      € 314 wanneer de eis of het verzoekschrift strekt tot betaling van een bepaalde geldsom van meer dan € 4538 en niet
      meer dan € 11 345 in hoofdsom.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel2
  - number: 2.2.2°.d
    text: |-
      Wanneer de eis of het verzoekschrift strekt tot een betaling van een bepaalde geldsom van meer dan € 11 345, 2,2
      procent van die geldsom, met een minimum van € 317 en een maximum van € 4 951 en met een minimum van € 317 en een
      maximum van € 1 188 voor de gedaagde of verweerder indien deze een natuurlijke persoon is. Het verschuldigde vast
      recht wordt afgerond op het meest nabijgelegen veelvoud van € 5.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel2
  - number: 2.2.2°.e
    text: |-
      in zaken waarin een dagvaarding in vrijwaring wordt gedaan, 2,2 procent van de achterliggende vordering indien deze
      op een financieel belang waardeerbaar is, met een minimum van € 240 en een maximum van € 4 954 en tot een maximum
      van € 1 187 voor de gedaagde of verweerder indien deze een natuurlijke persoon is. Het verschuldigde vast recht
      wordt afgerond op het meest nabijgelegen veelvoud van € 5.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel2
  - number: 2.2.2°.f
    text: |-
      In zaken waarin een vordering tot onteigening wordt gedaan 2,2 procent van de som die in de uitspraak als
      schadeloosstelling wordt toegekend, met een minimum van € 240 en een maximum van € 4 954 en tot een maximum van € 1
      187 voor de gedaagde of verweerder indien deze een natuurlijke persoon is. Voorshands is verschuldigd 2,2 procent
      van de som die als schadeloosstelling wordt aangeboden, met een minimum van € 240 en een maximum van € 4 954 en tot
      een maximum van € 1 187 voor de gedaagde of verweerder indien deze een natuurlijke persoon is. Het verschuldigde
      vast recht wordt afgerond op het meest nabijgelegen veelvoud van € 5.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel2
  - number: 2.2.2°.g
    text: € 263 in alle andere gevallen.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel2
  - number: '2.3'
    text: 'Het vast recht bij de gerechtshoven en de Hoge Raad bedraagt:'
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel2
  - number: 2.3.a
    text: |-
      € 263 wanneer de eis of het verzoekschrift enkel betrekking heeft op het bij of krachtens
      [Boek 1 van het Burgerlijk Wetboek][ref1] bepaalde.


