    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel2
  - number: 2.2.1°.f
    text: In alle andere gevallen € 111 indien eiser een natuurlijk persoon is of € 298 indien eiser een rechtspersoon is.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel2
