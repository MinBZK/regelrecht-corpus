    text: |-
      € 111 wanneer de eis uitsluitend strekt tot betaling van loon als bedoeld in
      [artikel 629 van Boek 7 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel629
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '629'
  - number: 2.3.c
    text: |-
      € 420 wanneer de eis of het verzoekschrift strekt tot betaling van een bepaalde geldsom van meer dan € 4538 en niet
      meer dan € 11 345 in hoofdsom.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel2
  - number: 2.3.d
    text: |-
      Wanneer de eis of het verzoekschrift strekt tot betaling van een bepaalde geldsom van meer dan € 11 345, 3
      procent van die geldsom, met een minimum van € 423 en een maximum van € 6 190 en met een minimum van € 423 en een
      maximum van € 1 188 voor de gedaagde of verweerder in hoger beroep indien deze een natuurlijke persoon is. Het
      verschuldigde vast recht wordt afgerond op het meest nabijgelegen veelvoud van € 5.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel2
  - number: 2.3.e
    text: € 263 in zaken in hoger beroep van een vonnis of beschikking van de kantonrechter of de pachtkamer.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel2
  - number: 2.3.f
    text: € 314 in alle andere gevallen.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel2
  - number: '2.4'
    text: |-
      Het recht wordt bepaald aan de hand van de eis in de dagvaarding, met uitzondering van het recht bedoeld in het
      tweede lid, onder 2°, onder f, eerste volzin. Met de eis in de dagvaarding wordt gelijkgesteld de som die in
      de dagvaarding als schadeloosstelling wordt aangeboden. In geval van vermindering van eis wordt het recht niet
      verminderd; in geval van vermeerdering van eis tot een bepaalde geldsom als bedoeld in het tweede lid, onder 1°,
      onder b, c, d of e, en onder 2°, onder c of d wordt het recht overeenkomstig verhoogd. De verhoging is verschuldigd
      na de uitroeping van de zaak ter terechtzitting waarop de eiser zijn eis bij conclusie of akte ter rolle heeft
      vermeerderd.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel2
  - number: '2.5'
    text: |-
      Indien de eiser veroordeling tot schadevergoeding op te maken bij staat heeft gevorderd, maar de rechter in het
      vonnis of arrest de schade heeft begroot, wordt alsnog van elke eisende partij en van elke verschenen gedaagde
      het vast recht geheven dat dezen verschuldigd zouden zijn indien de eis had gestrekt tot betaling van een bepaalde
      geldsom ten belope van de begrote schade.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel2
  - number: '2.6'
    text: |-
      Op het ingevolge de vorige leden verschuldigde vast recht wordt het in de zaak waarop het geding of verzoekschrift
      betrekking heeft reeds betaalde recht in mindering gebracht.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel2
  - number: '2.7'
    text: |-
      Indien in de loop van een aanhangig geding een op dit geding betrekking hebbend verzoekschrift
      wordt ingediend, is daarvoor geen vast recht verschuldigd. Evenmin is vast recht verschuldigd
      ter zake van een verzoekschrift strekkende tot begroting van kosten als bedoeld in
      [artikel 237, vierde lid, van het Wetboek van Burgerlijke Rechtsvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel237
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '237'
  - number: '3.1'
    text: |-
      Eisers of gedaagden, die bij eenzelfde advocaat of gemachtigde verschijnen en gelijkluidende conclusies nemen, zijn
      gezamenlijk slechts eenmaal vast recht verschuldigd.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel3
  - number: '3.2'
    text: |-
      Het geding in reconventie, het incidenteel beroep als bedoeld in de [artikelen 339, derde lid][ref1], en
      [410 van het Wetboek van Burgerlijke Rechtsvordering][ref2] en het doen van rekening en verantwoording worden niet
      als afzonderlijke gedingen beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel339
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel410
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '339'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '410'
  - number: '3.3'
    text: |-
      De vordering tot voeging of tussenkomst, als bedoeld in
      [artikel 217 van het Wetboek van Burgerlijke Rechtsvordering][ref1], geldt voor de partij, die de vordering
      doet, als het aanvangen van een nieuw geding. Voor een zodanige vordering is een gelijk bedrag aan vast recht
      verschuldigd als voor de vordering in het oorspronkelijke geding.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel217
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '217'
  - number: '3.4'
    text: In een geding tot vrijwaring is de eiser tot vrijwaring geen vast recht verschuldigd.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel3
  - number: '3.5'
    text: In geval van verzet is de geopposeerde geen vast recht verschuldigd.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel3
  - number: '3.6'
    text: |-
      Voor de indiening van een gemeenschappelijk verzoek tot echtscheiding, scheiding van tafel en bed, ontbinding van
      het huwelijk na scheiding van tafel en bed of beëindiging van een geregistreerd partnerschap, wordt van elk van de
      verzoekers de helft van het verschuldigde vast recht geheven.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel3
  - number: '3.7'
    text: |-
      Indien de eiser in een zaak, te behandelen door de kantonrechter, onmiddellijk na de eerste oproeping ter
      terechtzitting en voordat is geantwoord afstand van instantie doet, is geen vast recht verschuldigd.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel3
  - number: '3.8'
    text: |-
      In geval van verwijzing door of naar de kantonrechter op de voet van
      [artikel 71 van het Wetboek van Burgerlijke Rechtsvordering][ref1] wordt het vast recht verhoogd voor zover uit
      [artikel 2][ref2] een hoger bedrag aan vast recht voortvloeit.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel71
      [ref2]: https://wetten.overheid.nl/BWBR0001852#Artikel2
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '71'
      - id: ref2
        bwb_id: BWBR0001852
        artikel: '2'
        paragraaf: '1'
  - number: '3.9'
    text: |-
      Bij verwijzing van een zaak naar een ander gerecht is opnieuw vast recht verschuldigd, met dien verstande dat het
      eerder verschuldigde vast recht in mindering wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel3
  - number: '4'
    text: |-
      In afwijking van het bepaalde in [artikel 2, tweede lid, onder 2°][ref1] bedraagt het vast recht voor de
      verschenen gedaagde in een kort geding bij de rechtbanken € 263.


      [ref1]: https://wetten.overheid.nl/BWBR0001852#Artikel2
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001852
        artikel: '2'
        paragraaf: '1'
  - number: '5.1'
    text: 'Aan elke partij worden, ongeacht of door haar het vaste recht verschuldigd is, kosteloos verstrekt:'
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel5
  - number: 5.1.a
    text: een grosse of afschrift van alle uitspraken en beschikkingen;
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel5
  - number: 5.1.b
    text: |-
      verdere afschriften van de einduitspraak of eindbeschikking voor zover deze nodig mochten zijn voor de
      tenuitvoerlegging, voor het aanwenden van rechtsmiddelen of krachtens wettelijk voorschrift;
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel5
  - number: 5.1.c
    text: |-
      één afschrift van alle akten en processen-verbaal die met betrekking tot de behandeling ter terechtzitting zijn
      opgemaakt.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel5
  - number: '5.2'
    text: |-
      Evenmin worden kosten in rekening gebracht voor beslissingen, akten en processen-verbaal, die een rechtstreeks
      uitvloeisel van de uitspraak of beschikking zijn, met inbegrip van grossen of afschriften op de voet van het vorige
      lid.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel5
  - number: '5.3'
    text: Onze Minister van Justitie kan nadere regelen stellen omtrent de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel5
  - number: '9.1'
    text: |-
      In elk faillissement betaalt de curator uit de baten van de boedel bij het deponeren van de eerste uitdelingslijst
      of zodra de uitspraak tot homologatie van een akkoord in kracht van gewijsde is gegaan, een vast recht van € 519.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel9
  - number: '9.2'
    text: |-
      Onder dit vaste recht is niet begrepen het recht, volgens [artikel 2][ref1] voor verificatiegeschillen
      verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0001852#Artikel2
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0001852
        artikel: '2'
        paragraaf: '1'
  - number: '9.3'
    text: |-
      In geval van indiening van een verzoekschrift in hoger beroep of cassatie van de beslissing betreffende de
      homologatie van een akkoord, evenals in geval van indiening van een verzoekschrift tot ontbinding van een akkoord
      en van een verzoekschrift in hoger beroep of cassatie van die beslissing, wordt een vast recht geheven van € 263.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel9
  - number: '9.4'
    text: |-
      Hij die, als niet geverifieerd schuldeiser, verzet doet tegen de uitdelingslijst teneinde als schuldeiser
      geverifieerd te worden, voldoet een vast recht van € 263. [Artikel 3, lid 1][ref1], is van overeenkomstige
      toepassing. Het recht wordt niet geheven, indien tevens door wel geverifieerde schuldeisers verzet tegen de
      uitdelingslijst wordt gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001852#Artikel3
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0001852
        artikel: '3'
        paragraaf: '1'
  - number: '9.5'
    text: Het derde en vierde lid zijn van toepassing in de schuldsaneringsregeling natuurlijke personen.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel9
  - number: 9a
    text: |-
      [Artikel 9, eerste, tweede en derde lid][ref1], is van overeenkomstige toepassing:


      [ref1]: https://wetten.overheid.nl/BWBR0001852#Artikel9
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0001852
        artikel: '9'
        paragraaf: '1'
  - number: 9a.a
    text: |-
      in geval van een opdracht aan de curator om het beheer van de onder bewind staande goederen over te nemen en voor
      de vereffening zorg te dragen, gegeven door de rechtbank op verzoek van een schuldeiser die op de goederen verhaal
      heeft, maar niet in het faillissement kan opkomen;
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel9a
  - number: 9a.b
    text: |-
      in geval van benoeming door de rechter van een of meer vereffenaars van een ontbonden rechtspersoon, van een
      gemeenschap of van een nalatenschap.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel9a
  - number: '10.1'
    text: |-
      Voor de opening van een gerechtelijke rangregeling buiten faillissement wordt een bedrag van € 103 geheven
      van degene die benoeming van een rechter-commissaris heeft verzocht en, zodra deze is benoemd, € 208.
      [Artikel 3, eerste lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001852#Artikel3
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001852
        artikel: '3'
        paragraaf: '1'
  - number: '10.2'
    text: |-
      Voor de indiening van verzoekschriften tot rangschikking wordt geen recht geheven. In geval van verwijzing
      ingevolge tegenspraak is het recht overeenkomstig [artikel 2][ref1] verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0001852#Artikel2
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001852
        artikel: '2'
        paragraaf: '1'
  - number: '13.1'
    text: |-
      Onverminderd het bepaalde in de overige artikelen worden aan partijen en aan belanghebbenden afschriften van of
      uittreksels uit beslissingen, akten, processen-verbaal, registers of andere stukken zonder betaling afgegeven ten
      behoeve van hun advocaten of hun gemachtigden.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel13
  - number: '13.2'
    text: |-
      Voorts is de griffier bevoegd aan partijen en belanghebbenden afschriften of uittreksels, als in het eerste
      lid bedoeld, zonder betaling af te geven, indien en voor zover zij daarbij belang hebben en niet in staat
      zijn op andere wijze in de behoefte te voorzien. Bij weigering van de griffier kunnen partijen de beslissing
      van de voorzieningenrechter of van de kantonrechter inroepen. Hiervoor is geen vast recht, als bedoeld in
      [paragraaf 1 van deze titel][ref1], verschuldigd. Tegen deze beslissing is geen hogere voorziening toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0001852#Paragraaf1
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0001852
        paragraaf: '1'
  - number: '13.3'
    text: |-
      Voor het overige worden bij en krachtens algemene maatregel van bestuur regelen gesteld met betrekking tot de
      vergoedingen, verschuldigd voor afschriften van en uittreksels uit vonnissen en beschikkingen.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel13
  - number: '13.4'
    text: |-
      Voor de geregelde verstrekking van niet-getekende afschriften van of uittreksels uit de rol aan advocaten,
      procureurs of gemachtigden wordt een recht geheven van € 17 per maand.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel13
  - number: '13.5'
    text: |-
      Voor de uitgifte van afschriften en uittreksels uit de registers van de burgerlijke stand met bijlagen worden de
      bedragen berekend, bedoeld bij de [Wet rechten burgerlijke stand][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001851
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0001851
  - number: '13.6'
    text: |-
      Voor de overschrijving van huwelijkse voorwaarden of van de voorwaarden van een geregistreerd partnerschap in de
      registers wordt een recht geheven van € 155 van degene die overschrijving verzoekt.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel13
  - number: '13.7'
    text: |-
      Voor de legalisaties van handtekeningen wordt een recht geheven van € 17 voor iedere handtekening, met dien
      verstande dat meerdere handtekeningen, van dezelfde persoon op hetzelfde stuk als één handtekening worden
      beschouwd.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel13
  - number: '13.8'
    text: |-
      Voor de afgifte van apostilles, als bedoeld in artikel 3, eerste lid, van het op 5 oktober 1961 te 's-Gravenhage
      tot stand gekomen Verdrag tot afschaffing van het vereiste van legalisatie van buitenlandse openbare akten, wordt
      een recht geheven van € 17 voor iedere apostille.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel13
  - number: '14.1'
    text: |-
      Voor elke akte, proces-verbaal, beschikking of andere beslissing, gedaan, gegeven of opgemaakt door een rechter
      of een griffier anders dan in een geding, anders dan bij de behandeling van een verzoekschrift of van andere zaken
      waaromtrent in [paragraaf 1][ref1] het vast recht geregeld is, wordt een recht geheven van € 103.


      [ref1]: https://wetten.overheid.nl/BWBR0001852#Paragraaf1
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0001852
        paragraaf: '1'
  - number: '14.2'
    text: |-
      Voor de noodzakelijke afschriften dezer beschikkingen, akten en processen-verbaal wordt geen recht geheven. Onze
      Minister van Justitie kan nadere regelen geven ter uitvoering van het in dit lid bepaalde.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel14
  - number: '14.3'
    text: |-
      Voor verzoekschriften aan de voorzieningenrechter van de rechtbank of de voorzieningenrechter van het gerechtshof
      wordt een recht geheven van € 103.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel14
  - number: '15.1'
    text: |-
      Geen recht wordt geheven ter zake van beëdigingen welke ingevolge wettelijk voorschrift plaats vinden, voor
      de akte van bewaargeving der registers van de burgerlijke stand en voor de behandeling der aangifte voor eigen
      faillissement of van een verzoekschrift tot het van toepassing verklaren van de schuldsaneringsregeling natuurlijke
      personen. Voor de afschriften der in die gevallen op te maken akten is geen recht verschuldigd.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel15
  - number: '15.2'
    text: |-
      Ook wordt geen recht geheven van openbare colleges en van ambtenaren van openbare lichamen, die afschriften
      of uittreksels van stukken of legalisaties van handtekeningen dan wel afgifte van apostilles, als bedoeld in
      [artikel 13, achtste lid][ref1], behoeven voor de waarneming van de dienst.


      [ref1]: https://wetten.overheid.nl/BWBR0001852#Artikel13
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0001852
        artikel: '13'
        paragraaf: '3'
  - number: '15.3'
    text: |-
      Voorts wordt geen recht geheven in de gevallen, waarin bij bijzondere wetten vrijstellingen zijn toegestaan of
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel15
  - number: '16.1'
    text: Betaling der rechten en verschotten geschiedt hetzij contant, hetzij uit voorschot.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel16
  - number: '16.2'
    text: |-
      Voor de voldoening daarvan zijn mede-aansprakelijk de advocaten of gemachtigden van partijen of van
      belanghebbenden, en in geval van faillissement de curator.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel16
  - number: '17.1'
    text: |-
      Indien op het tijdstip waarop het vast recht verschuldigd wordt een afschrift van het bewijs van toevoeging als
      bedoeld in [artikel 29 van de Wet op de rechtsbijstand][ref1] is overgelegd wordt het recht door de betrokkene
      verschuldigd voor drievierde deel, of indien bij de toevoeging een eigen bijdrage is opgelegd als bedoeld in
      [artikel 35, derde lid, onder e][ref2], of [artikel 35, vierde lid, onder e, van die wet][ref3], voor de helft in
      debet gesteld. Indien het vast recht meer dan € 471 bedraagt, wordt het recht in de hiervoor bedoelde gevallen,
      behoudens een bedrag van € 119 onderscheidenlijk € 239 in debet gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0006368#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0006368#Artikel35
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0006368
        artikel: '35'
      - id: ref3
        bwb_id: BWBR0006368
        artikel: '35'
  - number: '17.2'
    text: |-
      Indien op het tijdstip waarop het vast recht verschuldigd wordt een afschrift van het besluit waarbij de voorlopige
      toevoeging is verleend als bedoeld in [artikel 30, eerste lid van de Wet op de rechtsbijstand][ref1] dan wel een
      afschrift van de in [artikel 24, tweede lid, van de Wet op rechtsbijstand][ref2] bedoelde aanvraag is overgelegd,
      wordt het recht door de betrokkene verschuldigd voorlopig voor drievierde deel in debet gesteld. Het gestelde in de
      tweede volzin van het eerste lid is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0006368#Artikel24
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '30'
      - id: ref2
        bwb_id: BWBR0006368
        artikel: '24'
  - number: '17.3'
    text: |-
      Indien toevoeging wordt geweigerd of een toevoeging met toepassing van het bepaalde in de
      [Wet op de rechtsbijstand][ref1] wordt ingetrokken of zodanig wordt verleend of gewijzigd dat minder recht in debet
      dient te worden gesteld, is het alsdan verschuldigde recht terstond opvorderbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0006368
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0006368
  - number: '17.4'
    text: |-
      De advocaat of gemachtigde van de betrokkene is niet aansprakelijk voor het recht dat na een weigering of
      intrekking van een toevoeging ingevolge het bepaalde in het derde lid opvorderbaar is.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel17
  - number: '18.1'
    text: |-
      Indien geen toevoeging overeenkomstig de [Wet op de rechtsbijstand][ref1] is verleend, stelt de griffier
      het vast recht verschuldigd door de betrokkene wiens inkomen blijkens de door deze over te leggen verklaring
      van de raad voor rechtsbijstand, bedoeld in [artikel 1 van die wet][ref2], niet meer bedraagt dan in
      __REF002___________________________________________________________________________________________________________
      _____________________ is bedoeld, voor het drievierde deel, onderscheidenlijk voor de helft in debet.


      [ref1]: https://wetten.overheid.nl/BWBR0006368
      [ref2]: https://wetten.overheid.nl/BWBR0006368#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0006368#Artikel35
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0006368
      - id: ref2
        bwb_id: BWBR0006368
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0006368
        artikel: '35'
  - number: '18.2'
    text: |-
      [Artikel 35, vijfde tot en met achtste lid, van de Wet op de rechtsbijstand][ref1],
      [artikel 243 van het Wetboek van Burgerlijke Rechtsvordering][ref2], en [artikel 17, eerste lid][ref3], zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel243
      [ref3]: https://wetten.overheid.nl/BWBR0001852#Artikel17
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '35'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '243'
      - id: ref3
        bwb_id: BWBR0001852
        artikel: '17'
  - number: 18a.1
    text: |-
      Indien tijdige overlegging van stukken als bedoeld in [artikel 17, eerste en tweede lid][ref1], en
      [artikel 18, eerste lid][ref2], is uitgebleven ten gevolge van omstandigheden die redelijkerwijs niet aan de
      betrokkene zijn toe te rekenen, stelt de griffier het vast recht op verzoek van de betrokkene alsnog gedeeltelijk,
      onderscheidenlijk voorlopig gedeeltelijk, in debet. Het verzoek wordt door de betrokkene ondertekend. De griffier
      betaalt hetgeen inmiddels teveel is voldaan terug aan de betrokkene. Was het vast recht voldaan door een ander dan
      de betrokkene, dan kan terugbetaling ook plaatsvinden aan die ander, tenzij de betrokkene bij het verzoek te kennen
      heeft gegeven dit niet te wensen.


      [ref1]: https://wetten.overheid.nl/BWBR0001852#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0001852#Artikel18
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0001852
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0001852
        artikel: '18'
  - number: 18a.2
    text: |-
      Is de wederpartij van de betrokkene op het tijdstip waarop alsnog stukken als bedoeld in het eerste lid worden
      overgelegd, reeds verwezen in de kosten van de instantie waarvoor het vast recht is verschuldigd, dan wordt het
      vast recht slechts in debet gesteld indien de wederpartij deze kosten nog niet heeft voldaan. Alsdan dient de
      wederpartij het alsnog in debet gestelde vast recht aan de griffier te voldoen en verliest de betrokkene in zoverre
      zijn recht op betaling. Het [derde lid van artikel 243 van het Wetboek van Burgerlijke Rechtsvordering][ref1] is
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel243
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '243'
  - number: 18a.3
    text: |-
      In het geval, bedoeld in het tweede lid, wijst de griffier het verzoek slechts toe indien de betrokkene de aan hem
      afgegeven afschriften overlegt van het vonnis of de beschikking waarbij zijn wederpartij in de kosten is verwezen.
      De griffier doet van de indebetstelling aantekening op de minuut en de overgelegde afschriften van het vonnis of
      de beschikking.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel18a
  - number: '20'
    text: In debet gestelde opvorderbare rechten worden voldaan zodra de griffier de vordering tot betaling doet.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel20
  - number: '21'
    text: |-
      Verschotten voor reis- en verblijfkosten, advertenties, exploiten en oproepingen anders dan per post door de
      griffier gedaan, worden door belanghebbenden terugbetaald. Advocaten en gemachtigden zijn voor de terugbetaling
      mede aansprakelijk.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel21
  - number: '22.1'
    text: |-
      Bij gebreke van betaling geschiedt invordering der rechten en betaalde verschotten krachtens een door de griffier
      uit te vaardigen dwangbevel.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel22
  - number: '22.2'
    text: |-
      Het dwangbevel wordt uitvoerbaar verklaard indien het een enkelvoudige kamer betreft, door de rechter in
      die kamer, indien het een meervoudige kamer betreft, door de voorzitter van die kamer van het betrokken
      gerecht en levert dan een executoriale titel op, die met toepassing van de voorschriften van het
      [Wetboek van Burgerlijke Rechtsvordering][ref1] kan worden tenuitvoergelegd, indien tenminste een maand na de
      betekening is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '22.4'
    text: |-
      Gedurende een maand na de betekening van het dwangbevel kan de schuldenaar bij het betrokken gerecht, rechtdoende
      in burgerlijke zaken, daartegen, bij verzoekschrift, in verzet komen.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel22
  - number: '24.1'
    text: |-
      De griffiers zijn bevoegd, van de belanghebbenden, hun advocaten, raadslieden of gemachtigden, tegen bewijs
      van ontvangst en ter latere verrekening, een voorschot te vragen tot dekking van de vermoedelijke rechten en
      verschotten.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel24
  - number: '24.2'
    text: De griffiers kunnen hun dienst weigeren, zolang het verlangde voorschot niet is gestort.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel24
  - number: '24.3'
    text: |-
      Gedurende een maand na de storting van het voorschot kan de voorschotgever bij het gerecht ter welks griffie het
      voorschot is gestort, rechtdoende in burgerlijke zaken, tegen de beslissing van de griffier, bij verzoekschrift, in
      verzet komen.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel24
  - number: '24.4'
    text: Tegen de beslissing van het gerecht is geen hogere voorziening toegelaten.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel24
  - number: '25.1'
    text: |-
      Gedurende een maand na de mededeling van de uit het voorschot verrekende rechten en verschotten, en bij
      rechtstreekse betaling daarvan, binnen een maand na die betaling, kunnen hij van wie de rechten en verschotten
      zijn geheven alsmede, in het eerste geval de voorschotgever, in het tweede geval hij die de rechten en verschotten
      betaalde, bij het gerecht ter griffie waarvan voorschot werd gestort of werd betaald, rechtdoende in burgerlijke
      zaken, tegen de beslissing van de griffier, bij verzoekschrift, in verzet komen. Tegen de beslissing van de
      griffier omtrent de toepassing van [artikel 18a][ref1] kunnen de betrokkene en de voorschotgever, onderscheidenlijk
      degene die het vast recht betaalde, op overeenkomstige wijze gedurende een maand na de mededeling daarvan in verzet
      komen.


      [ref1]: https://wetten.overheid.nl/BWBR0001852#Artikel18a
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0001852
        artikel: 18a
  - number: '25.2'
    text: Tegen de beslissing van het gerecht is geen hogere voorziening toegelaten.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel25
  - number: '26'
    text: |-
      Voor de indiening een verzoek als bedoeld in [artikel 18a, eerste lid][ref1], en van een verzoekschrift ingevolge
      een der [artikelen 24][ref2] en [25][ref3] is geen recht verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0001852#Artikel18a
      [ref2]: https://wetten.overheid.nl/BWBR0001852#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0001852#Artikel25
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0001852
        artikel: 18a
      - id: ref2
        bwb_id: BWBR0001852
        artikel: '24'
      - id: ref3
        bwb_id: BWBR0001852
        artikel: '25'
  - number: '29.1'
    text: 'Aan de advocaten is verschuldigd:'
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel29
  - number: 29.1.a
    text: |-
      Voor elke besogne of conferentie met of voor hunne clienten € 0,82, des echter dat zij, voor elk besogne of
      conferentie, welke langer dan een uur duurt, gelijke € 0,82, gedeelten voor het geheel genomen, per uur mogen
      berekenen;
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel29
  - number: 29.1.b
    text: Voor eene comparitie € 1,63;
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel29
  - number: 29.1.c
    text: |-
      Voor eene vacatie buiten de plaats hunner woning € 5,45 voor eenen geheelen dag, en € 2,72 voor een gedeelte
      van den dag, zes uren of minder bedragende, onverminderd, in beide gevallen, hetgeen voor de gedurende dien tijd
      verrigte werkzaamheden verschuldigd is, mitsgaders de reis- en verblijfkosten;
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel29
  - number: 29.1.e
    text: Voor het schrijven van eenen brief en voor het lezen van eenen ontvangen brief € 0,41;
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel29
  - number: '29.2'
    text: |-
      Indien dezelve buitengewoon groot of van veel gewigt is, alsdan naar mate van den tijd, welke daartoe noodig mogt
      zijn geweest, berekend op den voet sub litt *a* vermeld.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel29
  - number: '30'
    text: |-
      Voor werkzaamheden, niet in het vorig artikel vermeld, berekenen de advocaten het hun verschuldigde salaris, naar
      mate van het belang en de moeijelijkheid der zaken, mitsgaders van den tijd, welke daaraan besteed heeft moeten
      worden.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel30
  - number: '31.1'
    text: |-
      De advocaten zijn verpligt aan hunne clienten, des gevorderd wordende, te geven gespecificeerde rekeningen met
      opgave van den dag waarop de werkzaamheden zijn verrigt en van den besteedden tijd, voor zoo verre de hoegrootheid
      van het salaris daarvan afhankelijk is.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel31
  - number: '31.2'
    text: |-
      Voor werkzaamheden ten behoeve van personen, die het vrije beheer over hunne goederen niet bezitten, alsmede in
      vacante boedels, onderwerpen de advocaten hunne rekeningen vooraf aan de begrooting van den voorzitter der regtbank
      van het arrondissement waarin hunne woonplaats is gevestigd, of van een der leden daartoe door hem benoemd; van die
      begrootte rekening wordt een ongezegeld afschrift aan de clienten uitgegeven.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel31
  - number: '32'
    text: |-
      Buiten de gevallen in het [2de lid van art. 31][ref1] vermeld, geschiedt, in geval van verschil over het salaris,
      door den advocaat aan den client berekend, de begrooting door de raden van toezigt en discipline in de hoofdplaats
      van het arrondissement waarin de advocaat woonachtig is, of, indien aldaar geen raad van toezigt aanwezig is, door
      dien in de residentie van het provinciaal geregtshof waaronder de woonplaats van den advocaat behoort; en indien
      ook aldaar geen zoodanige raad bestaat, alsdan door dien, gevestigd in de residentie van den hoogen raad.


      [ref1]: https://wetten.overheid.nl/BWBR0001852#Artikel31
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0001852
        artikel: '31'
  - number: '33.1'
    text: |-
      Indien de advocaat met de begrooting van den raad van toezigt geen genoegen neemt, of de client weigerachtig blijft
      het bedrag daarvan te voldoen, wordt het bedrag van het verschuldigde nader vastgesteld door den voorzitter van
      het collegie waar de zaak, waarin het salaris berekend is, gediend heeft, of door een der leden, daartoe door hem
      benoemd.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel33
  - number: '33.2'
    text: |-
      Indien de zaak voor geen regterlijk collegie is aanhangig geweest, geschiedt zulks door den voorzitter der regtbank
      van het arrondissement waarin de woonplaats van den advocaat is gevestigd, of door een der leden, daartoe door
      hem benoemd.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel33
  - number: '34.1'
    text: |-
      De begrooting geschiedt op gezegelde rekeningen, waarop iedere post, zoo van salaris als verschot, behoorlijk is
      omschreven, en het bedrag daarvan afzonderlijk uitgedrukt, en waarop, naast de uitgetrokkene som, een wit vak is
      opengelaten.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel34
  - number: '34.2'
    text: |-
      Onder de rekening wordt gesteld: *ter begrooting ingediend door* . . . . . . ., met onderteekening en dagteekening,
      zonder dat er eenige andere vorm, bij de indiening ter begrooting, in acht genomen behoeft te worden.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel34
  - number: '35.1'
    text: De regter, door wien de begrooting geschiedt, is bevoegd de overlegging der justificatoire stukken te vorderen.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel35
  - number: '35.2'
    text: |-
      Hij slaat bij de begrooting acht op de omstandigheid, of de gemaakte kosten en verschotten en de gedeclareerde
      vacatien, naar den aard der zaak, nuttig, doelmatig of noodig kunnen geacht worden, of door den client zijn
      verlangd, en wijzigt, roijeert of vermindert de zoodanige, welke daarbij geoordeeld worden overbodig te zijn, of
      de palen eener billijke gematigdheid te overschrijden, daarbij in aanmerking nemende het gewigt der zaak, en de
      moeijelijkheid die zij mogt hebben opgeleverd.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel35
  - number: '36.1'
    text: |-
      Wanneer in de rekeningen als verschot worden gebragt posten, die uit eigen hoofde aan begrooting onderworpen, doch
      niet begroot zijn, zijn deze posten nog steeds voor vermindering vatbaar, en worden alleen geleden tot zoodanig
      bedrag, als waarop de regter dezelve begroot, onverminderd het verhaal tegen hem, die aldus blijken mogt te veel te
      hebben ontvangen.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel36
  - number: '36.2'
    text: |-
      Posten wegens betaalde zegel-, griffie- en registratie-regten, mits van derzelver voldoening behoorlijk blijke,
      zijn niet aan vermindering onderworpen.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel36
  - number: '37.1'
    text: |-
      Het bedrag der te hoog gestelde of onaannemelijke posten wordt doorgehaald en in het daarvoor opengelaten wit vak
      de verschuldigde som, of wel *nihil*, gesteld.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel37
  - number: '37.2'
    text: |-
      Aan het slot der rekening wordt door den regter gesteld: *goedgekeurd ter somma van* . . . . . . . . . . . ., met
      uitdrukking, in letters, van het geheel bedrag waarop dezelve is begroot, en daaronder een bevelschrift van ten
      uitvoer legging, hetwelk op de minuut ten uitvoer wordt gelegd.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel37
  - number: '37.3'
    text: |-
      De advocaat kan de herziening der begrooting aan het collegie, welks voorzitter of benoemd lid dezelve heeft
      gedaan, verzoeken bij een verzoekschrift, waarop niet wordt beschikt, dan nadat de belanghebbenden voor twee
      commissarissen uit het collegie, daartoe benoemd, zijn opgeroepen, om in hunne belangen te worden gehoord.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel37
  - number: '38'
    text: De begrootingen van den regter zijn niet aan regten van registratie of griffie onderworpen.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel38
  - number: '39'
    text: |-
      De schuldenaar wordt tot de betaling genoodzaakt, hetzij krachtens het bevelschrift van ten uitvoer legging van den
      voorzitter of benoemden regter, hetzij krachtens de beschikking, door het collegie op een verzoek tot herziening
      genomen.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel39
  - number: '40.1'
    text: Degene, ten wiens laste zoodanig bevelschrift is afgegeven, kan daartegen verzet doen.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel40
  - number: '40.2'
    text: |-
      Dit verzet wordt gebragt voor het collegie, welks voorzitter of benoemd lid het bevelschrift heeft afgegeven, en
      wordt als eene summiere zaak afgedaan.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel40
  - number: '40.3'
    text: |-
      De uitspraak op het verzet en de beschikking op een verzoek om herziening, zijn niet vatbaar voor verzet, hooger
      beroep of voorziening in cassatie.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel40
  - number: '57'
    text: |-
      Wij stellen, bij algemene maatregel van bestuur, de bedragen vast, welke wegens werkzaamheden, tijdverzuim en
      daarmede verband houdende noodzakelijke kosten, en wegens reis- en verblijfkosten toekomen aan:
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel57
  - number: 57.a
    text: |-
      houders of bewaarders van stukken, die opgeroepen worden om stukken, welke onder hun berusting of bewaring zijn,
      voor de rechter te brengen;
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel57
  - number: 57.b
    text: deskundigen;
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel57
  - number: 57.c
    text: getuigen.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel57
  - number: '58'
    text: |-
      In de gevallen, waarin de partijen, tengevolge van een rechterlijke uitspraak verplicht zijn te reizen, worden de
      kosten, daardoor veroorzaakt, ten laste gebracht van de in de kosten veroordeelde partij, overeenkomstig de daarvan
      door de rechter vast te stellen begroting.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel58
  - number: '59'
    text: Deze wet kan worden aangehaald als Wet tarieven in burgerlijke zaken.
    url: https://wetten.overheid.nl/BWBR0001852/2010-02-01#Artikel59
