bwb_id: BWBR0001852
url: https://wetten.overheid.nl/BWBR0001852/2004-02-01
preamble:
  text: >-
    Wij WILLEM II, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, Groot-Hertog van Luxemburg,
    enz., enz., enz.


    Allen die deze zullen zien of hooren lezen, salut! doen te weten:


    Alzoo Wij in overweging genomen hebben de noodzakelijkheid, om het, krachtens de wet van den 15den December
    1838 (Staatsblad n°. 43), bij reglement van openbaar bestuur van den 30sten November 1839 ( Staatsblad n°. 49)
    vastgesteld en krachtens de wet van den 15den December 1842 (Staatsblad n°. 26) nog in werking zijnde tarief van
    justitie-kosten en salarissen in burgerlijke zaken, door wettelijke bepalingen te doen vervangen;


    Zoo is het, dat Wij, den Raad van State gehoord en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze, vast te stellen de navolgende algemeene bepaling en titel,
    welke zullen uitmaken een gedeelte van het tarief van justitie-kosten en salarissen in burgerlijke zaken:
  url: https://wetten.overheid.nl/BWBR0001852/2004-02-01#ArtikelAanhef
articles:
  - number: '1'
    text: >-
      1 In burgerlijke zaken worden de volgende rechten geheven, behalve van het openbaar ministerie indien het
      ambtshalve optreedt.


      2 Wij kunnen bij algemene maatregel van bestuur de bedragen genoemd in deze titel wijzigen, indien het
      prijsindexcijfer van de gezinsconsumptie daartoe aanleiding geeft.


      3 Onze Minister van Justitie kan bepalen dat voor bepaalde categorieën van zaken geen vast recht verschuldigd zal
      zijn.
    url: https://wetten.overheid.nl/BWBR0001852/2004-02-01#Artikel1
  - number: '2'
    text: |-
      1 Voor een geding wordt van elke eisende partij, na de eerste uitroeping van de zaak ter terechtzitting, en van
      elke verschenen gedaagde voor iedere instantie een vast recht geheven. Voor de indiening van een verzoekschrift
      anders dan bedoeld in [artikel 14, derde lid][ref1], of een verweerschrift wordt eveneens voor iedere instantie
      een vast recht geheven. Gedaagden en verweerders zijn geen vast recht verschuldigd in zaken, te behandelen door de
      kantonrechter of de pachtkamer.

      2 Het vast recht bij de rechtbanken bedraagt:

      1°. In zaken te behandelen en te beslissen door de kantonrechter of de pachtkamer:

      a. € 33 wanneer de eis uitsluitend strekt tot betaling van loon als bedoeld in
      [artikel 629 van Boek 7 van het Burgerlijk Wetboek][ref2].

      b. € 57 wanneer de eis of het verzoekschrift enkel strekt tot betaling van een bepaalde geldsom van niet meer dan €
      90 in hoofdsom.

      c. € 90 wanneer de eis of het verzoekschrift strekt tot betaling van een bepaalde geldsom van meer dan € 90 en niet
      meer dan € 453 in hoofdsom.

      d. € 144 wanneer de eis of het verzoekschrift strekt tot betaling van een bepaalde geldsom van meer dan € 453 en
      niet meer dan € 1361 in hoofdsom.

      e. € 190 wanneer de eis of het verzoekschrift strekt tot betaling van een bepaalde geldsom van meer dan € 1361
      in hoofdsom.

      f. In alle andere gevallen € 102 indien eiser een natuurlijk persoon is of € 273 indien eiser een rechtspersoon is.

      2°. In andere zaken:

      a. € 190 wanneer de eis of het verzoekschrift enkel betrekking heeft op het bij of krachtens
      [Boek 1 van het Burgerlijk Wetboek][ref3] bepaalde.

      b. € 102 wanneer de eis uitsluitend strekt tot betaling van loon als bedoeld in
      [artikel 629 van Boek 7 van het Burgerlijk Wetboek][ref4].

      c. € 288 wanneer de eis of het verzoekschrift strekt tot betaling van een bepaalde geldsom van meer dan € 4538 en
      niet meer dan € 11 345 in hoofdsom.

      d. Wanneer de eis of het verzoekschrift strekt tot een betaling van een bepaalde geldsom van meer dan € 11 345, 2,2
      procent van die geldsom, met een minimum van € 291 en een maximum van € 4 535 en met een minimum van € 291 en een
      maximum van € 1 088 voor de gedaagde of verweerder indien deze een natuurlijke persoon is. Het verschuldigde vast
      recht wordt afgerond op het meest nabijgelegen veelvoud van € 5.

      e. in zaken waarin een dagvaarding in vrijwaring wordt gedaan, 2,2 procent van de achterliggende vordering indien
      deze op een financieel belang waardeerbaar is, met een minimum van € 220 en een maximum van € 4 537 en tot een
      maximum van € 1 087 voor de gedaagde of verweerder indien deze een natuurlijke persoon is. Het verschuldigde vast
      recht wordt afgerond op het meest nabijgelegen veelvoud van € 5.

      f. In zaken waarin een vordering tot onteigening wordt gedaan 2,2 procent van de som die in de uitspraak als
      schadeloosstelling wordt toegekend, met een minimum van € 220 en een maximum van € 4 537 en tot een maximum van €
      1 087 voor de gedaagde of verweerder indien deze een natuurlijke persoon is. Voorshands is verschuldigd 2,2 procent
      van de som die als schadeloosstelling wordt aangeboden, met een minimum van € 220 en een maximum van € 4 537 en tot
      een maximum van € 1 087 voor de gedaagde of verweerder indien deze een natuurlijke persoon is. Het verschuldigde
      vast recht wordt afgerond op het meest nabijgelegen veelvoud van € 5.

      g. € 241 in alle andere gevallen.

      3 Het vast recht bij de gerechtshoven en de Hoge Raad bedraagt:

      a. € 241 wanneer de eis of het verzoekschrift enkel betrekking heeft op het bij of krachtens
      [Boek 1 van het Burgerlijk Wetboek][ref5] bepaalde.

      b. € 102 wanneer de eis uitsluitend strekt tot betaling van loon als bedoeld in
      [artikel 629 van Boek 7 van het Burgerlijk Wetboek][ref6].

      c. € 385 wanneer de eis of het verzoekschrift strekt tot betaling van een bepaalde geldsom van meer dan € 4538 en
      niet meer dan € 11 345 in hoofdsom.

      d. Wanneer de eis of het verzoekschrift strekt tot betaling van een bepaalde geldsom van meer dan € 11 345, 3
      procent van die geldsom, met een minimum van € 388 en een maximum van € 5 669 en met een minimum van € 388 en een
      maximum van € 1 088 voor de gedaagde of verweerder in hoger beroep indien deze een natuurlijke persoon is. Het
      verschuldigde vast recht wordt afgerond op het meest nabijgelegen veelvoud van € 5.

      e. € 241 in zaken in hoger beroep van een vonnis of beschikking van de kantonrechter of de pachtkamer.

      f. € 288 in alle andere gevallen.

      4 Het recht wordt bepaald aan de hand van de eis in de dagvaarding, met uitzondering van het recht bedoeld in
      het tweede lid, onder 2°, onder f, eerste volzin. Met de eis in de dagvaarding wordt gelijkgesteld de som die in
      de dagvaarding als schadeloosstelling wordt aangeboden. In geval van vermindering van eis wordt het recht niet
      verminderd; in geval van vermeerdering van eis tot een bepaalde geldsom als bedoeld in het tweede lid, onder 1°,
      onder b, c, d of e, en onder 2°, onder c of d wordt het recht overeenkomstig verhoogd. De verhoging is verschuldigd
      na de uitroeping van de zaak ter terechtzitting waarop de eiser zijn eis bij conclusie of akte ter rolle heeft
      vermeerderd.

      5 Indien de eiser veroordeling tot schadevergoeding op te maken bij staat heeft gevorderd, maar de rechter in het
      vonnis of arrest de schade heeft begroot, wordt alsnog van elke eisende partij en van elke verschenen gedaagde
      het vast recht geheven dat dezen verschuldigd zouden zijn indien de eis had gestrekt tot betaling van een bepaalde
      geldsom ten belope van de begrote schade.

      6 Op het ingevolge de vorige leden verschuldigde vast recht wordt het in de zaak waarop het geding of
      verzoekschrift betrekking heeft reeds betaalde recht in mindering gebracht.

      7 Indien in de loop van een aanhangig geding een op dit geding betrekking hebbend verzoekschrift
      wordt ingediend, is daarvoor geen vast recht verschuldigd. Evenmin is vast recht verschuldigd
      ter zake van een verzoekschrift strekkende tot begroting van kosten als bedoeld in
      [artikel 237, vierde lid, van het Wetboek van Burgerlijke Rechtsvordering][ref7].


