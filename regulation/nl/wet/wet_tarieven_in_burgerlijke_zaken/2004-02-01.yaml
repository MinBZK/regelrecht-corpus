  - number: 9a
    text: |-
      [Artikel 9, eerste, tweede en derde lid][ref1], is van overeenkomstige toepassing:

      a. in geval van een opdracht aan de curator om het beheer van de onder bewind staande goederen over te nemen en
      voor de vereffening zorg te dragen, gegeven door de rechtbank op verzoek van een schuldeiser die op de goederen
      verhaal heeft, maar niet in het faillissement kan opkomen;

      b. in geval van benoeming door de rechter van een of meer vereffenaars van een ontbonden rechtspersoon, van een
      gemeenschap of van een nalatenschap.


      [ref1]: https://wetten.overheid.nl/BWBR0001852#Artikel9
    url: https://wetten.overheid.nl/BWBR0001852/2004-02-01#Artikel9a
