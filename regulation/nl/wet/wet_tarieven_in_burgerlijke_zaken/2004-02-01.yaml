        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0001851
  - number: '14'
    text: |-
      1 Voor elke akte, proces-verbaal, beschikking of andere beslissing, gedaan, gegeven of opgemaakt door een rechter
      of een griffier anders dan in een geding, anders dan bij de behandeling van een verzoekschrift of van andere zaken
      waaromtrent in [paragraaf 1][ref1] het vast recht geregeld is, wordt een recht geheven van € 94.

      2 Voor de noodzakelijke afschriften dezer beschikkingen, akten en processen-verbaal wordt geen recht geheven. Onze
      Minister van Justitie kan nadere regelen geven ter uitvoering van het in dit lid bepaalde.

      3 Voor verzoekschriften aan de voorzieningenrechter van de rechtbank of de voorzieningenrechter van het gerechtshof
      wordt een recht geheven van € 94.


      [ref1]: https://wetten.overheid.nl/BWBR0001852#Paragraaf1
    url: https://wetten.overheid.nl/BWBR0001852/2004-02-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0001852
        paragraaf: '1'
  - number: '15'
    text: |-
      1 Geen recht wordt geheven ter zake van beëdigingen welke ingevolge wettelijk voorschrift plaats vinden, voor
      de akte van bewaargeving der registers van de burgerlijke stand en voor de behandeling der aangifte voor eigen
      faillissement of van een verzoekschrift tot het van toepassing verklaren van de schuldsaneringsregeling natuurlijke
      personen. Voor de afschriften der in die gevallen op te maken akten is geen recht verschuldigd.

      2 Ook wordt geen recht geheven van openbare colleges en van ambtenaren van openbare lichamen, die afschriften
      of uittreksels van stukken of legalisaties van handtekeningen dan wel afgifte van apostilles, als bedoeld in
      [artikel 13, achtste lid][ref1], behoeven voor de waarneming van de dienst.

      3 Voorts wordt geen recht geheven in de gevallen, waarin bij bijzondere wetten vrijstellingen zijn toegestaan of
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001852#Artikel13
    url: https://wetten.overheid.nl/BWBR0001852/2004-02-01#Artikel15
    references:
