        artikel: '2'
        paragraaf: '1'
  - number: '5'
    text: >-
      1 Aan elke partij worden, ongeacht of door haar het vaste recht verschuldigd is, kosteloos verstrekt:


      a. een grosse of afschrift van alle uitspraken en beschikkingen;


      b. verdere afschriften van de einduitspraak of eindbeschikking voor zover deze nodig mochten zijn voor de
      tenuitvoerlegging, voor het aanwenden van rechtsmiddelen of krachtens wettelijk voorschrift;


      c. één afschrift van alle akten en processen-verbaal die met betrekking tot de behandeling ter terechtzitting zijn
      opgemaakt.


      2 Evenmin worden kosten in rekening gebracht voor beslissingen, akten en processen-verbaal, die een rechtstreeks
      uitvloeisel van de uitspraak of beschikking zijn, met inbegrip van grossen of afschriften op de voet van het vorige
      lid.


      3 Onze Minister van Justitie kan nadere regelen stellen omtrent de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0001852/2004-02-01#Artikel5
  - number: '9'
    text: |-
      1 In elk faillissement betaalt de curator uit de baten van de boedel bij het deponeren van de eerste
      uitdelingslijst of zodra de uitspraak tot homologatie van een akkoord in kracht van gewijsde is gegaan, een vast
      recht van € 475.

      2 Onder dit vaste recht is niet begrepen het recht, volgens [artikel 2][ref1] voor verificatiegeschillen
      verschuldigd.

      3 In geval van indiening van een verzoekschrift in hoger beroep of cassatie van de beslissing betreffende de
      homologatie van een akkoord, evenals in geval van indiening van een verzoekschrift tot ontbinding van een akkoord
      en van een verzoekschrift in hoger beroep of cassatie van die beslissing, wordt een vast recht geheven van € 241.

      4 Hij die, als niet geverifieerd schuldeiser, verzet doet tegen de uitdelingslijst teneinde als schuldeiser
      geverifieerd te worden, voldoet een vast recht van € 241. [Artikel 3, lid 1][ref2], is van overeenkomstige
      toepassing. Het recht wordt niet geheven, indien tevens door wel geverifieerde schuldeisers verzet tegen de
      uitdelingslijst wordt gedaan.

      5 Het derde en vierde lid zijn van toepassing in de schuldsaneringsregeling natuurlijke personen.


      [ref1]: https://wetten.overheid.nl/BWBR0001852#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001852#Artikel3
