  - number: '3'
    text: |-
      1 Eisers of gedaagden, die bij eenzelfde procureur of gemachtigde verschijnen en gelijkluidende conclusies nemen,
      zijn gezamenlijk slechts eenmaal vast recht verschuldigd.

      2 Het geding in reconventie, het incidenteel beroep als bedoeld in de [artikelen 339, derde lid][ref1], en
      [410 van het Wetboek van Burgerlijke Rechtsvordering][ref2] en het doen van rekening en verantwoording worden niet
      als afzonderlijke gedingen beschouwd.

      3 De vordering tot voeging of tussenkomst, als bedoeld in
      [artikel 217 van het Wetboek van Burgerlijke Rechtsvordering][ref3], geldt voor de partij, die de vordering
      doet, als het aanvangen van een nieuw geding. Voor een zodanige vordering is een gelijk bedrag aan vast recht
      verschuldigd als voor de vordering in het oorspronkelijke geding.

      4 In een geding tot vrijwaring is de eiser tot vrijwaring geen vast recht verschuldigd.

      5 In geval van verzet is de geopposeerde geen vast recht verschuldigd.

      6 Voor de indiening van een gemeenschappelijk verzoek tot echtscheiding, scheiding van tafel en bed, ontbinding van
      het huwelijk na scheiding van tafel en bed of beëindiging van een geregistreerd partnerschap, wordt van elk van de
      verzoekers de helft van het verschuldigde vast recht geheven.

      7 Indien de eiser in een zaak, te behandelen door de kantonrechter, onmiddellijk na de eerste oproeping ter
      terechtzitting en voordat is geantwoord afstand van instantie doet, is geen vast recht verschuldigd.

      8 In geval van verwijzing door of naar de kantonrechter op de voet van
      [artikel 71 van het Wetboek van Burgerlijke Rechtsvordering][ref4] wordt het vast recht verhoogd voor zover uit
      [artikel 2][ref5] een hoger bedrag aan vast recht voortvloeit.

      9 Bij verwijzing van een zaak naar een ander gerecht is opnieuw vast recht verschuldigd, met dien verstande dat het
      eerder verschuldigde vast recht in mindering wordt gebracht.


