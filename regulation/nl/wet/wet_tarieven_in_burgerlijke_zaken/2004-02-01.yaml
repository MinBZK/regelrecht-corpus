  - number: '18'
    text: |-
      1 Indien geen toevoeging overeenkomstig de [Wet op de rechtsbijstand][ref1] is verleend, stelt de griffier
      het vast recht verschuldigd door de betrokkene wiens inkomen blijkens de door deze over te leggen verklaring
      of de bescheiden als bedoeld in [artikel 25, eerste lid, van die wet][ref2] niet meer bedraagt dan in
      [artikel 35, derde lid onderdelen ][ref3] is bedoeld, voor het drievierde deel, onderscheidenlijk voor de helft
      in debet.

      2 [Artikel 35, vierde tot en met achtste lid, van de Wet op de rechtsbijstand][ref4],
      [artikel 243 van het Wetboek van Burgerlijke Rechtsvordering][ref5], en [artikel 17, eerste lid][ref6], zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006368
