  - number: '10'
    text: |-
      1 Voor de opening van een gerechtelijke rangregeling buiten faillissement wordt een bedrag van € 94 geheven
      van degene die benoeming van een rechter-commissaris heeft verzocht en, zodra deze is benoemd, € 190.
      [Artikel 3, eerste lid][ref1], is van overeenkomstige toepassing.

      2 Voor de indiening van verzoekschriften tot rangschikking wordt geen recht geheven. In geval van verwijzing
      ingevolge tegenspraak is het recht overeenkomstig [artikel 2][ref2] verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0001852#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0001852#Artikel2
