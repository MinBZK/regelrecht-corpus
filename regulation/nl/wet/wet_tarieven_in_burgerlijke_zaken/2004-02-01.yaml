  - number: '13'
    text: |-
      1 Onverminderd het bepaalde in de overige artikelen worden aan partijen en aan belanghebbenden afschriften van of
      uittreksels uit beslissingen, akten, processen-verbaal, registers of andere stukken zonder betaling afgegeven ten
      behoeve van hun procureurs of hun gemachtigden.

      2 Voorts is de griffier bevoegd aan partijen en belanghebbenden afschriften of uittreksels, als in het eerste
      lid bedoeld, zonder betaling af te geven, indien en voor zover zij daarbij belang hebben en niet in staat
      zijn op andere wijze in de behoefte te voorzien. Bij weigering van de griffier kunnen partijen de beslissing
      van de voorzieningenrechter of van de kantonrechter inroepen. Hiervoor is geen vast recht, als bedoeld in
      [paragraaf 1 van deze titel][ref1], verschuldigd. Tegen deze beslissing is geen hogere voorziening toegelaten.

      3 Voor het overige worden bij en krachtens algemene maatregel van bestuur regelen gesteld met betrekking tot de
      vergoedingen, verschuldigd voor afschriften van en uittreksels uit vonnissen en beschikkingen.

      4 Onze Minister van Justitie kan een bedrag vaststellen, te heffen van advocaten, procureurs of gemachtigden voor
      het verstrekken van niet-getekende afschriften van of uittreksels uit de rol. Dit bedrag zal niet hoger zijn dan €
      190 per kalenderjaar.

      5 Voor de uitgifte van afschriften en uittreksels uit de registers van de burgerlijke stand met bijlagen worden de
      bedragen berekend, bedoeld bij de [Wet rechten burgerlijke stand][ref2].

      6 Voor de overschrijving van huwelijkse voorwaarden of van de voorwaarden van een geregistreerd partnerschap in de
      registers wordt een recht geheven van € 141 van degene die overschrijving verzoekt.

      7 Voor de legalisaties van handtekeningen wordt een recht geheven van € 15 voor iedere handtekening, met dien
      verstande dat meerdere handtekeningen, van dezelfde persoon op hetzelfde stuk als één handtekening worden
      beschouwd.

      8 Voor de afgifte van apostilles, als bedoeld in artikel 3, eerste lid, van het op 5 oktober 1961 te 's-Gravenhage
      tot stand gekomen Verdrag tot afschaffing van het vereiste van legalisatie van buitenlandse openbare akten, wordt
      een recht geheven van € 15 voor iedere apostille.


      [ref1]: https://wetten.overheid.nl/BWBR0001852#Paragraaf1
      [ref2]: https://wetten.overheid.nl/BWBR0001851
    url: https://wetten.overheid.nl/BWBR0001852/2004-02-01#Artikel13
    references:
      - id: ref1
