        artikel: '13'
        paragraaf: '3'
  - number: '16'
    text: >-
      1 Betaling der rechten en verschotten geschiedt hetzij contant, hetzij uit voorschot.


      2 Voor de voldoening daarvan zijn mede-aansprakelijk de advocaten of procureurs of gemachtigden van partijen of van
      belanghebbenden, en in geval van faillissement de curator.
    url: https://wetten.overheid.nl/BWBR0001852/2004-02-01#Artikel16
  - number: '17'
    text: |-
      1 Indien op het tijdstip waarop het vast recht verschuldigd wordt een afschrift van het bewijs van
      toevoeging dan wel van voorwaardelijke toevoeging als bedoeld in [artikel 29][ref1] onderscheidenlijk
      [artikel 31 van de Wet op de rechtsbijstand][ref2] is overgelegd, wordt het recht door de betrokkene
      verschuldigd, voor drievierde deel, of indien bij de toevoeging een eigen bijdrage is opgelegd als bedoeld in
      [artikel 35, derde lid, onderdelen ][ref3], voor de helft in debet gesteld. Indien het vast recht meer dan € 431
      bedraagt, wordt het recht in de hiervoor bedoelde gevallen, behoudens een bedrag van € 109 onderscheidenlijk € 219
      in debet gesteld.

      2 Indien op het tijdstip waarop het vast recht verschuldigd wordt een afschrift van het bewijs van voorlopige
      toevoeging als bedoeld in [artikel 30, eerste lid, van de Wet op de rechtsbijstand][ref4] dan wel een afschrift van
      het in [artikel 24, tweede lid, van de Wet op de rechtsbijstand][ref5] bedoelde verzoek is overgelegd, wordt het
      recht door de betrokkene verschuldigd voorlopig voor drievierde deel in debet gesteld. Het gestelde in de tweede
      volzin van het eerste lid is van overeenkomstige toepassing.

      3 Indien toevoeging wordt geweigerd of een toevoeging met toepassing van het bepaalde in de
      [Wet op de rechtsbijstand][ref6] wordt ingetrokken of zodanig wordt verleend of gewijzigd dat minder recht in debet
      dient te worden gesteld, is het alsdan verschuldigde recht terstond opvorderbaar.

      4 De advocaat, procureur of gemachtigde van de betrokkene is niet aansprakelijk voor het recht dat na een weigering
      of intrekking van een toevoeging ingevolge het bepaalde in het derde lid opvorderbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0006368#Artikel31
