  - number: '20'
    text: In debet gestelde opvorderbare rechten worden voldaan zodra de griffier de vordering tot betaling doet.
    url: https://wetten.overheid.nl/BWBR0001852/2004-02-01#Artikel20
  - number: '21'
    text: >-
      Verschotten voor reis- en verblijfkosten, advertenties, exploiten en oproepingen anders dan per post door de
      griffier gedaan, worden door belanghebbenden terugbetaald. Advocaten, procureurs en gemachtigden zijn voor de
      terugbetaling mede aansprakelijk.
    url: https://wetten.overheid.nl/BWBR0001852/2004-02-01#Artikel21
  - number: '22'
    text: |-
      1 Bij gebreke van betaling geschiedt invordering der rechten en betaalde verschotten krachtens een door de griffier
      uit te vaardigen dwangbevel.

      2 Het dwangbevel wordt uitvoerbaar verklaard indien het een enkelvoudige kamer betreft, door de rechter
      in die kamer, indien het een meervoudige kamer betreft, door de voorzitter van die kamer van het
      betrokken gerecht en levert dan een executoriale titel op, die met toepassing van de voorschriften van het
      [Wetboek van Burgerlijke Rechtsvordering][ref1] kan worden tenuitvoergelegd, indien tenminste een maand na de
      betekening is verstreken.

      3

      4 Gedurende een maand na de betekening van het dwangbevel kan de schuldenaar bij het betrokken gerecht, rechtdoende
      in burgerlijke zaken, daartegen, bij verzoekschrift, in verzet komen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0001852/2004-02-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '24'
    text: >-
      1 De griffiers zijn bevoegd, van de belanghebbenden, hun advocaten, procureurs, raadslieden of gemachtigden, tegen
      bewijs van ontvangst en ter latere verrekening, een voorschot te vragen tot dekking van de vermoedelijke rechten
      en verschotten.


      2 De griffiers kunnen hun dienst weigeren, zolang het verlangde voorschot niet is gestort.


      3 Gedurende een maand na de storting van het voorschot kan de voorschotgever bij het gerecht ter welks griffie het
      voorschot is gestort, rechtdoende in burgerlijke zaken, tegen de beslissing van de griffier, bij verzoekschrift, in
      verzet komen.


      4 Tegen de beslissing van het gerecht is geen hogere voorziening toegelaten.
    url: https://wetten.overheid.nl/BWBR0001852/2004-02-01#Artikel24
  - number: '25'
    text: |-
      1 Gedurende een maand na de mededeling van de uit het voorschot verrekende rechten en verschotten, en bij
      rechtstreekse betaling daarvan, binnen een maand na die betaling, kunnen hij van wie de rechten en verschotten
      zijn geheven alsmede, in het eerste geval de voorschotgever, in het tweede geval hij die de rechten en verschotten
      betaalde, bij het gerecht ter griffie waarvan voorschot werd gestort of werd betaald, rechtdoende in burgerlijke
      zaken, tegen de beslissing van de griffier, bij verzoekschrift, in verzet komen. Tegen de beslissing van de
      griffier omtrent de toepassing van [artikel 18a][ref1] kunnen de betrokkene en de voorschotgever, onderscheidenlijk
      degene die het vast recht betaalde, op overeenkomstige wijze gedurende een maand na de mededeling daarvan in verzet
      komen.

      2 Tegen de beslissing van het gerecht is geen hogere voorziening toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0001852#Artikel18a
    url: https://wetten.overheid.nl/BWBR0001852/2004-02-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0001852
        artikel: 18a
  - number: '26'
    text: |-
      Voor de indiening een verzoek als bedoeld in [artikel 18a, eerste lid][ref1], en van een verzoekschrift ingevolge
      een der [artikelen 24][ref2] en [25][ref3] is geen recht verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0001852#Artikel18a
      [ref2]: https://wetten.overheid.nl/BWBR0001852#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0001852#Artikel25
    url: https://wetten.overheid.nl/BWBR0001852/2004-02-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0001852
        artikel: 18a
      - id: ref2
        bwb_id: BWBR0001852
        artikel: '24'
      - id: ref3
        bwb_id: BWBR0001852
        artikel: '25'
  - number: '29'
    text: >-
      1 Aan de advocaten is verschuldigd:


      a. Voor elke besogne of conferentie met of voor hunne clienten € 0,82, des echter dat zij, voor elk besogne of
      conferentie, welke langer dan een uur duurt, gelijke € 0,82, gedeelten voor het geheel genomen, per uur mogen
      berekenen;


      b. Voor eene comparitie € 1,63;


      c. Voor eene vacatie buiten de plaats hunner woning € 5,45 voor eenen geheelen dag, en € 2,72 voor een gedeelte
      van den dag, zes uren of minder bedragende, onverminderd, in beide gevallen, hetgeen voor de gedurende dien tijd
      verrigte werkzaamheden verschuldigd is, mitsgaders de reis- en verblijfkosten;


      d.


      e. Voor het schrijven van eenen brief en voor het lezen van eenen ontvangen brief € 0,41;


      2 Indien dezelve buitengewoon groot of van veel gewigt is, alsdan naar mate van den tijd, welke daartoe noodig mogt
      zijn geweest, berekend op den voet sub litt *a* vermeld.
    url: https://wetten.overheid.nl/BWBR0001852/2004-02-01#Artikel29
  - number: '30'
    text: >-
      Voor werkzaamheden, niet in het vorig artikel vermeld, berekenen de advocaten het hun verschuldigde salaris, naar
      mate van het belang en de moeijelijkheid der zaken, mitsgaders van den tijd, welke daaraan besteed heeft moeten
      worden.
    url: https://wetten.overheid.nl/BWBR0001852/2004-02-01#Artikel30
  - number: '31'
    text: >-
      1 De advocaten zijn verpligt aan hunne clienten, des gevorderd wordende, te geven gespecificeerde rekeningen met
      opgave van den dag waarop de werkzaamheden zijn verrigt en van den besteedden tijd, voor zoo verre de hoegrootheid
      van het salaris daarvan afhankelijk is.


      2 Voor werkzaamheden ten behoeve van personen, die het vrije beheer over hunne goederen niet bezitten, alsmede in
      vacante boedels, onderwerpen de advocaten hunne rekeningen vooraf aan de begrooting van den voorzitter der regtbank
      van het arrondissement waarin hunne woonplaats is gevestigd, of van een der leden daartoe door hem benoemd; van die
      begrootte rekening wordt een ongezegeld afschrift aan de clienten uitgegeven.
    url: https://wetten.overheid.nl/BWBR0001852/2004-02-01#Artikel31
  - number: '32'
    text: |-
      Buiten de gevallen in het [2de lid van art. 31][ref1] vermeld, geschiedt, in geval van verschil over het salaris,
      door den advocaat aan den client berekend, de begrooting door de raden van toezigt en discipline in de hoofdplaats
      van het arrondissement waarin de advocaat woonachtig is, of, indien aldaar geen raad van toezigt aanwezig is, door
      dien in de residentie van het provinciaal geregtshof waaronder de woonplaats van den advocaat behoort; en indien
      ook aldaar geen zoodanige raad bestaat, alsdan door dien, gevestigd in de residentie van den hoogen raad.


      [ref1]: https://wetten.overheid.nl/BWBR0001852#Artikel31
    url: https://wetten.overheid.nl/BWBR0001852/2004-02-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0001852
        artikel: '31'
  - number: '33'
    text: >-
      1 Indien de advocaat met de begrooting van den raad van toezigt geen genoegen neemt, of de client weigerachtig
      blijft het bedrag daarvan te voldoen, wordt het bedrag van het verschuldigde nader vastgesteld door den voorzitter
      van het collegie waar de zaak, waarin het salaris berekend is, gediend heeft, of door een der leden, daartoe door
      hem benoemd.


      2 Indien de zaak voor geen regterlijk collegie is aanhangig geweest, geschiedt zulks door den voorzitter der
      regtbank van het arrondissement waarin de woonplaats van den advocaat is gevestigd, of door een der leden, daartoe
      door hem benoemd.
    url: https://wetten.overheid.nl/BWBR0001852/2004-02-01#Artikel33
  - number: '34'
    text: >-
      1 De begrooting geschiedt op gezegelde rekeningen, waarop iedere post, zoo van salaris als verschot, behoorlijk
      is omschreven, en het bedrag daarvan afzonderlijk uitgedrukt, en waarop, naast de uitgetrokkene som, een wit vak
      is opengelaten.


      2 Onder de rekening wordt gesteld: *ter begrooting ingediend door* . . . . . . ., met onderteekening en
      dagteekening, zonder dat er eenige andere vorm, bij de indiening ter begrooting, in acht genomen behoeft te worden.
    url: https://wetten.overheid.nl/BWBR0001852/2004-02-01#Artikel34
  - number: '35'
    text: >-
      1 De regter, door wien de begrooting geschiedt, is bevoegd de overlegging der justificatoire stukken te vorderen.


      2 Hij slaat bij de begrooting acht op de omstandigheid, of de gemaakte kosten en verschotten en de gedeclareerde
      vacatien, naar den aard der zaak, nuttig, doelmatig of noodig kunnen geacht worden, of door den client zijn
      verlangd, en wijzigt, roijeert of vermindert de zoodanige, welke daarbij geoordeeld worden overbodig te zijn, of
      de palen eener billijke gematigdheid te overschrijden, daarbij in aanmerking nemende het gewigt der zaak, en de
      moeijelijkheid die zij mogt hebben opgeleverd.
    url: https://wetten.overheid.nl/BWBR0001852/2004-02-01#Artikel35
  - number: '36'
    text: >-
      1 Wanneer in de rekeningen als verschot worden gebragt posten, die uit eigen hoofde aan begrooting onderworpen,
      doch niet begroot zijn, zijn deze posten nog steeds voor vermindering vatbaar, en worden alleen geleden tot
      zoodanig bedrag, als waarop de regter dezelve begroot, onverminderd het verhaal tegen hem, die aldus blijken mogt
      te veel te hebben ontvangen.


      2 Posten wegens betaalde zegel-, griffie- en registratie-regten, mits van derzelver voldoening behoorlijk blijke,
      zijn niet aan vermindering onderworpen.
    url: https://wetten.overheid.nl/BWBR0001852/2004-02-01#Artikel36
  - number: '37'
    text: >-
      1 Het bedrag der te hoog gestelde of onaannemelijke posten wordt doorgehaald en in het daarvoor opengelaten wit vak
      de verschuldigde som, of wel *nihil*, gesteld.


      2 Aan het slot der rekening wordt door den regter gesteld: *goedgekeurd ter somma van* . . . . . . . . . . . .,
      met uitdrukking, in letters, van het geheel bedrag waarop dezelve is begroot, en daaronder een bevelschrift van ten
      uitvoer legging, hetwelk op de minuut ten uitvoer wordt gelegd.


      3 De advocaat kan de herziening der begrooting aan het collegie, welks voorzitter of benoemd lid dezelve heeft
      gedaan, verzoeken bij een verzoekschrift, waarop niet wordt beschikt, dan nadat de belanghebbenden voor twee
      commissarissen uit het collegie, daartoe benoemd, zijn opgeroepen, om in hunne belangen te worden gehoord.
    url: https://wetten.overheid.nl/BWBR0001852/2004-02-01#Artikel37
  - number: '38'
    text: De begrootingen van den regter zijn niet aan regten van registratie of griffie onderworpen.
    url: https://wetten.overheid.nl/BWBR0001852/2004-02-01#Artikel38
  - number: '39'
    text: >-
      De schuldenaar wordt tot de betaling genoodzaakt, hetzij krachtens het bevelschrift van ten uitvoer legging van den
      voorzitter of benoemden regter, hetzij krachtens de beschikking, door het collegie op een verzoek tot herziening
      genomen.
    url: https://wetten.overheid.nl/BWBR0001852/2004-02-01#Artikel39
  - number: '40'
    text: >-
      1 Degene, ten wiens laste zoodanig bevelschrift is afgegeven, kan daartegen verzet doen.


      2 Dit verzet wordt gebragt voor het collegie, welks voorzitter of benoemd lid het bevelschrift heeft afgegeven, en
      wordt als eene summiere zaak afgedaan.


      3 De uitspraak op het verzet en de beschikking op een verzoek om herziening, zijn niet vatbaar voor verzet, hooger
      beroep of voorziening in cassatie.
    url: https://wetten.overheid.nl/BWBR0001852/2004-02-01#Artikel40
  - number: '43'
    text: >-
      Het salaris van de procureurs wordt in alle zaken, zonder onderscheid, berekend op den volgenden voet:


      a. Voor regt van retenue, bij den aanvang van iedere zaak waarin eene regterlijke uitspraak wordt gevraagd, hetzij
      op verzoekschrift, hetzij op eene dagvaarding, € 0,45;


      b. Voor besognes, comparitien met of voor de clienten of met den advocaat, op het stellen en op het resumeren en
      arresteren van akten, exploiten, requesten, judiciële akten of op eenige belangrijke akte van een regtsgeding; voor
      conferentien met partij of derzelver practizijns, tot mededeeling van hetgeen in den loop der zaak gebeurt, of tot
      daarstelling van schikkingen; voor vacatien bij het doen van voorloopige opnemingen van plaatsen of werken; voor
      die op de kantoren van de bewaring der hypotheken en andere, tot het doen van onderzoek, het ter overschrijving
      aanbieden en ligten van stukken; voor die ter griffie tot het kennis nemen van aldaar nedergelegde stukken; voor
      die met de deurwaarders, over het doen van exploiten en het resumeren van dezelve, met uitzondering nogtans der
      akten welke van procureur aan procureur worden beteekend; en eindelijk, voor het in orde brengen der stukken welke
      aan den regter worden overgelegd, het formeren van de lijst of inventaris daaronder begrepen, voor elk uur of
      gedeelte daarvan € 0,45;


      c. Voor het onderzoek van ontvangen of beteekende stukken en documenten, en het resumeren van door den advocaat
      ontworpen akten en schrifturen, naar mate van derzelver getal, den omvang en den tijd daartoe vereischt, voor elk
      uur of gedeelte daarvan € 0,45;


      d. Voor het opstellen van akten en exploiten, requesten, judiciële akten, memorien of andere stukken, mits niet
      vallende in de categoriën van die judiciële stukken of akten, welke hierna, sub litt. *n*, *o* en *p*, bepaaldelijk
      zijn opgenoemd en berekend, voor elk uur of gedeelte daarvan € 0,82;


      e. Voor het grosseren, kopijeren van requesten, akten en schrifturen, met gelijke uitzondering, voor elke drie
      honderd lettergrepen, € 0,09;


      f. Voor afschriften van processen-verbaal, vonnissen, in het algemeen van alle akten die ter griffie zijn
      uitgeleverd, en voor zoo verre die noodig zijn om te worden beteekend of overgelegd, per bladzijde, berekend naar
      het getal bladzijden van het origineel, € 0,09;


      g. Voor het resumeren en teekenen van judiciële akten en stukken, met uitzondering van die, welke hierna, sub litt.
      *n*, *o* en *p* bepaaldelijk zijn opgenoemd, voor zoo verre die teekening bij de wet wordt vereischt, en anders
      niet, per stuk € 0,11;


      h. Voor het schrijven van eenen brief en voor het lezen van eenen ontvangen brief € 0,23. Indien dezelve
      buitengewoon groot of van veel gewigt is, alsdan naar mate van den tijd welke daartoe noodig mogt zijn geweest,
      berekend op den voet, sub litt. *b*, *c* en *d* vermeld;


      i. Voor elke vacatie tot het doen inschrijven eener zaak ter rolle, het nederleggen en terugnemen van stukken ter
      griffie, het doen van mededeeling van stukken aan het openbaar ministerie, of het doen opmaken, teekenen en ligten
      van akten en andere stukken, ter griffie of elders, € 0,45;


      k. Voor elke vacatie ter teregtzitting, wanneer de behandeling eener zaak of van eenige verrigting in dezelve tot
      eenen anderen dag wordt uitgesteld, € 0,45;


      l. Voor elke vacatie ter teregtzitting, vereischt tot het doen van eenig verzoek of van eenige verklaring, anders
      dan die welke strekt tot het uitstellen der zaak; voor elke vacatie tot het nemen of hooren van conclusien of
      regterlijke uitspraken, het tegenwoordig zijn bij pleidooijen, bij getuigen-verhoor, bij regterlijke plaats-
      opneming, bij het onderzoek van deskundigen en dergelijke werkzaamheden, mitsgaders op de bevolen comparitien voor
      den president of bij commissarissen, € 0,68;


      In geen geval wordt daarvoor meer dan ééne vacatie op denzelfden dag in rekening gebragt, des echter, dat
      voor adsistentie bij pleidooijen, mitsgaders bij getuigen-verhoor, geregtelijke plaats-opneming, onderzoek van
      deskundigen en dergelijke werkzaamheden, indien dezelve langer dan een uur duren, voor ieder volgend uur of
      gedeelte daarvan, eene gelijke som van € 0,68 wordt berekend;


      m. Voor noodzakelijke en ter zake dienende vacatien, buiten de plaats hunner woning, per dag of gedeelte daarvan,
      buiten de besognes en werkzaamheden aldaar te houden of te verrigten, reis- en verblijfkosten daaronder niet
      begrepen, € 2,72;


      wordende echter voor deze vacatie, met de besognes en werkzaamheden, nimmer meer dan € 5,45 berekend;


      n. Voor alle eenvoudige akten van procureur aan procureur, als die van procureurstelling, tot vervolging van de
      zaak ter teregtzitting, tot het vragen of het doen van mededeeling van stukken en andere van gelijken aard:


      Voor het origineel € 0,34


      Voor elk afschrift € 0,11;


      o. Voor alle akten van procureur aan procureur van meerderen omvang, die verklaringen, verzoeken of ongemotiveerde
      conclusien inhouden:


      Voor het origineel € 0,68


      Voor elk afschrift € 0,23;


      p. Voor alle eenvoudige, niet aan de wederpartij vooraf beteekende requesten, gerigt aan de voorzieningenrechter
      van het collegie, in de gevallen waarin bij de wet, tot het bekomen eener bijzondere vergunning, zoodanig
      verzoekschrift is voorgeschreven; alsmede voor eenvoudige requesten aan de voorzieningenrechter of aan de benoemde
      commissarissen, om eenige benoeming of tijdsbepaling, € 0,68;


      Voor het stellen, grosseren, resumeren, teekenen der akten of requesten, sub. litt. *n*, *o* en *p* bedoeld, wordt
      niet afzonderlijk berekend;


      q. Voor het opmaken van den staat van kosten, door de veroordeelde partij verschuldigd, voor elk artikel, dat
      geheel of ten deele wordt toegewezen, € 0,02.
    url: https://wetten.overheid.nl/BWBR0001852/2004-02-01#Artikel43
  - number: '44'
    text: >-
      Voor de behandeling eener zaak in kort geding bij de voorzieningenrechter, de dagvaarding en hetgeen daaraan is
      voorafgegaan, het ligten der uitspraak (des gevorderd) daaronder begrepen, wordt door de procureurs berekend in
      eens af en zonder deswege, onder welke benaming ook, meer in rekening te mogen brengen:


      a. Bijaldien de zaak door den procureur, zonder bijstand van eenen advocaat, is behandeld, en er eene beslissing
      van de voorzieningenrechter is gevolgd, € 4,54, en in geval van verwijzing naar de regtbank, € 2,27;


      b. Bijaldien de procureur door eenen advocaat is bijgestaan, wordt in beide gevallen slechts de helft der hierboven
      vermelde sommen berekend.
    url: https://wetten.overheid.nl/BWBR0001852/2004-02-01#Artikel44
  - number: '45'
    text: >-
      De procureurs, die zelve de zaken bepleiten, berekenen hun salaris voor de pleidooijen en de voorbereiding daartoe
      even als de advocaten.
    url: https://wetten.overheid.nl/BWBR0001852/2004-02-01#Artikel45
  - number: '46'
    text: |-
      1 Onverminderd de berekening der vacatien en werkzaamheden, naar den bij [art. 43][ref1] vermelden maatstaf,
      wordt bij geregtelijke uitwinning en verkoop van onroerende goederen en schepen, grooter dan tien lasten, aan den
      procureur van den executant toegekend, op den prijs waarvoor de goederen zijn toegewezen:

      wanneer de prijs de som van € 1361 of minder bedraagt, één ten honderd;

      van sommen boven de € 1361 tot € 4538, één half ten honderd van het hoogere;

      van sommen boven de € 4538 tot € 11 345, één vierde van het hoogere; en

      van sommen boven de € 11 345, onbepaald tot welk eene som, één achtste ten honderd van het hoogere.

      2 Bij gelijktijdigen verkoop van verschillende perceelen, bepalen de prijzen, te zamen genomen, de afnemende
      gradatie in de percentsgewijze belooning.


      [ref1]: https://wetten.overheid.nl/BWBR0001852#Artikel43
    url: https://wetten.overheid.nl/BWBR0001852/2004-02-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0001852
        artikel: '43'
  - number: '47'
    text: >-
      1 De bovenstaande bepalingen zijn verbindend voor de procureurs bij alle regtbanken, zonder onderscheid.


      2 De daarbij bepaalde belooningen worden voor de procureurs bij de provinciale geregtshoven en bij den hoogen raad
      met 1/5 verhoogd.
    url: https://wetten.overheid.nl/BWBR0001852/2004-02-01#Artikel47
  - number: '48'
    text: >-
      1 De procureurs zijn bevoegd om, hetzij bij den aanvang, hetzij gedurende den loop eener zaak, van hunne clienten
      te vorderen het storten van zekere som, ter bestrijding der door hen te doene uitschotten.


      2 Het eerste door den aanlegger eener zaak te doene voorschot wordt bepaald op € 27,23, boven en behalve de
      geregtelijke geldboeten, welke volgens de wet moeten worden geconsigneerd.


      3 Voor een gedaagde of verweerder in eene zaak, wordt het te doene voorschot op de helft bepaald.


      4 De procureurs zijn verder bevoegd om, indien daarvoor redenen bestaan, vermeerdering van het gedane voorschot te
      vragen, en in geval van verschil daarover, beslist daaromtrent de voorzitter van het collegie bij hetwelk de zaak
      aanhangig is, op verzoek van den procureur, des noods na verhoor van den client.
    url: https://wetten.overheid.nl/BWBR0001852/2004-02-01#Artikel48
  - number: '49'
    text: >-
      1 De procureurs mogen zich aan de zaak onttrekken, indien de gevraagde of bevolene storting niet is gedaan, mits
      zij daarvan, ten minste drie dagen te voren, bij insinuatie aan hunnen client kennis gegeven, en het origineel
      daarvan nedergelegd hebben ter griffie van het collegie waar de zaak aanhangig is.


      2 De kosten van deze insinuatie en nederlegging komen ten laste van den client welke het voorschot heeft geweigerd.


      3 De bepalingen van dit en het vorig artikel zijn niet van toepassing op zaken uit de kolonien van den Staat bij
      den hoogen raad behandeld wordende.
    url: https://wetten.overheid.nl/BWBR0001852/2004-02-01#Artikel49
  - number: '50'
    text: >-
      Behalve voor de registratie-regten van vonnissen of arresten, welke op de minuten derzelve worden geheven, zijn de
      procureurs bij de regterlijke collegien persoonlijk aansprakelijk voor alle zegel-, registratie- en griffie-regten,
      door hunne clienten aan den griffier verschuldigd, in zaken, welke door hen zijn behandeld, of voor stukken,
      waarvan de opmaking of afgifte door hen is verzocht.
    url: https://wetten.overheid.nl/BWBR0001852/2004-02-01#Artikel50
  - number: '52'
    text: |-
      De bepalingen, vervat in [art. 31][ref1], zijn insgelijks van toepassing op de procureurs, welke, in geval van
      weigering of verzuim der voldoening van het aan hen verschuldigd salaris en verschot, handelen overeenkomstig de
      voorschriften, in de [artikelen 33][ref2], [34][ref3], [35][ref4], [36][ref5], [37][ref6], [38][ref7], [39][ref8]
      en [40][ref9] vervat.


