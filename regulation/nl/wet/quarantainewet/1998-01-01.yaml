$id: quarantainewet
regulatory_layer: WET
publication_date: '2008-11-18'
valid_from: '1998-01-01'
bwb_id: BWBR0002343
url: https://wetten.overheid.nl/BWBR0002343/1998-01-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is gebleken voor de toepassing van de op 25
    mei 1951 te Genève tot stand gekomen Internationale Sanitaire Regeling met Bijlagen (Regeling No. 2 van de
    Wereldgezondheidsorganisatie, aangenomen door de vierde Wereldgezondheidsvergadering; Trb. 1952, 145), zoals
    gewijzigd, welke regeling ingevolge de artikelen 21 en 22 van het Statuut der Wereldgezondheidsorganisatie juncto
    artikel 67 van de Grondwet voor Nederland verbindend is, enige voorziening te treffen nopens het weren van bepaalde
    besmettelijke ziekten, welke door internationaal verkeer worden verbreid;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder: "de Internationale
      Gezondheidsregeling": de Internationale Gezondheidsregeling met Bijlagen (*Trb.* 1970, 30); "Onze Minister": Onze
      Minister van Sociale Zaken en Volksgezondheid; "de inspecteur": de regionale inspecteur van het Staatstoezicht op
      de volksgezondheid.
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel1
  - number: '2'
    text: |-
      Voor de toepassing van de Internationale Gezondheidsregeling en het bij of krachtens deze wet bepaalde wordt
      verstaan onder: "haveninrichting": los-, laad- en ligplaats van schepen, en zich in de nabijheid daarvan bevindende
      bedrijven, magazijnen, vemen en andere opslagplaatsen, alsmede terreinen en gebouwen, welke op grond van hun
      ligging en bestemming of gebruik moeten worden geacht daartoe te behoren; "pokken": variola major en variola minor.
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel2
  - number: '3'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde gelden mede de definities van artikel 1 van de
      Internationale Gezondheidsregeling.
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel3
  - number: '4'
    text: |-
      In Nederland worden de taken van de "gezondheidsadministratie", als bedoeld in artikel 1 van de Internationale
      Gezondheidsregeling, vervuld door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel4
  - number: '5.1'
    text: |-
      De burgemeester van de gemeente, waar de gezondheidsmaatregelen, toegestaan of voorgeschreven bij de Internationale
      Gezondheidsregeling of deze wet, worden genomen, treedt op als "gezondheidsautoriteit", als bedoeld in artikel 1
      van de Internationale Gezondheidsregeling.
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel5
  - number: '5.2'
    text: |-
      Wij kunnen bepalen, dat, in daarbij aangewezen gevallen, een andere burgemeester bepaalde taken van de
      gezondheidsautoriteit vervult.
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel5
  - number: '6.1'
    text: |-
      De bevoegde hoofdinspecteur van het Staatstoezicht op de volksgezondheid geeft van het vermoeden of het vastgesteld
      zijn van een quarantainabele ziekte bij een uit het buitenland komende persoon daarvan onverwijld kennis aan de
      gezondheidsadministratie van het gebied waaruit die persoon vertrokken is.
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel6
  - number: '6.2'
    text: |-
      Indien een besmetting met pest onder knaagdieren door de dienst, bedoeld in artikel 15 van de Internationale
      Gezondheidsregeling, is vastgesteld, is het hoofd van die dienst verplicht daarvan binnen twee uren mededeling te
      doen aan de burgemeester, die de inspecteur onverwijld en op de snelste wijze op de hoogte stelt.
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel6
  - number: '7'
    text: |-
      Indien een ingevolge de Internationale Gezondheidsregeling onder toezicht gesteld persoon naar het buitenland
      vertrekt, doet de burgemeester van de gemeente waar het toezicht laatstelijk werd uitgeoefend, hiervan onverwijld
      mededeling aan de bevoegde hoofdinspecteur van het Staatstoezicht op de volksgezondheid, die zorg draagt voor de in
      artikel 28, tweede lid, van de Internationale Gezondheidsregeling vereiste kennisgeving.
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel7
  - number: '8.1'
    text: |-
      Het hoofd van de dienst, bedoeld in artikel 15 van de Internationale Gezondheidsregeling, is verplicht
      de burgemeester eenmaal per kwartaal verslag uit te brengen van zijn werkzaamheden ter uitvoering van de
      Internationale Gezondheidsregeling en van deze wet.
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel8
  - number: '8.2'
    text: |-
      De in het eerste lid bedoelde burgemeester brengt, met inachtneming van de ter zake door Onze Minister gegeven
      voorschriften, eenmaal per kwartaal verslag uit van zijn verrichtingen en van de maatregelen, welke hij ter
      uitvoering van de Internationale Gezondheidsregeling en van deze wet heeft genomen. Het verslag wordt uitgebracht
      aan de inspecteur, in wiens ambtsgebied de gemeente is gelegen.
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel8
  - number: '9'
    text: |-
      Onze Minister is bevoegd voorschriften te geven in het belang van een goede uitvoering van artikel 14, tweede en
      derde lid, van de Internationale Gezondheidsregeling.
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel9
  - number: '10'
    text: |-
      Onze Minister wijst de havens aan, welke moeten beschikken over voorzieningen, als bedoeld in artikel 15 van de
      Internationale Gezondheidsregeling.
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel10
  - number: '11'
    text: |-
      Onze Minister treft regelingen met betrekking tot ontratting, de afgifte van certificaten van ontratting en
      de afgifte van certificaten tot vrijstelling van ontratting, als bedoeld in artikel 54 van de Internationale
      Gezondheidsregeling. Daarbij worden de havens aangewezen, welke moeten beschikken over personeel, dat bevoegd en
      bekwaam is schepen te ontratten en te inspecteren ten behoeve van de afgifte van certificaten.
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel11
  - number: '12.1'
    text: |-
      Onze Minister wijst, in overeenstemming met Onze Minister van Verkeer en Waterstaat, de luchthavens aan, welke
      voorzien moeten zijn van een terrein voor direct doorgaand verkeer.
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel12
  - number: '12.2'
    text: |-
      Indien het luchthavens betreft in gebruik bij de krijgsmacht, wijst Onze Minister deze luchthavens aan in
      overeenstemming met Onze Minister van Defensie.
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel12
  - number: '13'
    text: |-
      De burgemeester neemt, na advies van de arts, bedoeld in [artikel 14, eerste lid][ref1], de noodzakelijke ingevolge
      de Internationale Gezondheidsregeling en deze wet voorgeschreven maatregelen om de verbreiding van quarantainabele
      ziekten door het internationale verkeer te voorkomen of tegen te gaan. Hij neemt ook overigens bij de toepassing
      van deze wet geen maatregelen of besluiten zonder deze arts te hebben gehoord.


      [ref1]: https://wetten.overheid.nl/BWBR0002343#Artikel14
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002343
        artikel: '14'
  - number: '14.1'
    text: |-
      De burgemeester wordt bij de uitoefening van zijn taak ingevolge de Internationale Gezondheidsregeling en deze wet
      bijgestaan, hetzij door een of meer door hem benoemde artsen, hetzij door de inspecteur, welke laatste zich kan
      doen bijstaan door een door hem aan te wijzen deskundige.
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel14
  - number: '14.2'
    text: |-
      De burgemeester benoemt een arts als bedoeld in het eerste lid niet dan na overleg met de inspecteur. Indien
      de in het eerste lid bedoelde taak moet worden uitgeoefend op een luchthaven in gebruik bij de krijgsmacht,
      geschiedt het overleg met de inspecteur van de betrokken geneeskundige dienst van de krijgsmacht. Van de benoeming
      doet de burgemeester mededeling aan de inspecteur en de bevoegde hoofdinspecteur van het Staatstoezicht op de
      volksgezondheid.
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel14
  - number: '14.3'
    text: |-
      Onze Minister kan gemeenten aanwijzen waarvan de burgemeester verplicht is een of meer artsen als bedoeld in het
      eerste lid te benoemen.
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel14
  - number: '15.1'
    text: |-
      Bij verschil van mening tussen de burgemeester en een arts als bedoeld in [artikel 14, eerste lid][ref1], over
      maatregelen, te nemen ter uitvoering van de Internationale Gezondheidsregeling of deze wet, beslist de burgemeester
      niet dan na overleg met de inspecteur. Van zijn beslissing doet hij onverwijld mededeling aan de inspecteur.


      [ref1]: https://wetten.overheid.nl/BWBR0002343#Artikel14
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002343
        artikel: '14'
  - number: '15.2'
    text: |-
      De inspecteur kan binnen achtenveertig uren nadat de beslissing te zijner kennis is gebracht, daartegen
      beroep instellen bij Onze Minister. De beslissing van de burgemeester wordt niet uitgevoerd zolang de termijn
      van achtenveertig uren niet is verstreken en, indien beroep is ingesteld, zolang daarop niet is beslist. De
      burgemeester houdt zich aan de beslissing van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel15
  - number: '15.3'
    text: |-
      De inspecteur kan de burgemeester verzoeken binnen een door de inspecteur gestelde termijn de door hem ter
      uitvoering van de Internationale Gezondheidsregeling noodzakelijk geachte maatregelen te nemen. Indien de
      burgemeester aan het verzoek geen gevolg geeft, kan de inspecteur binnen achtenveertig uren na afloop van de
      gestelde termijn beroep instellen bij Onze Minister. De burgemeester houdt zich aan de beslissing van Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel15
  - number: '15.4'
    text: |-
      De [hoofdstukken 6][ref1] en [7 van de Algemene wet bestuursrecht][ref2] zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0005537
        hoofdstuk: '7'
  - number: '16.1'
    text: |-
      De burgemeester geeft de nodige aanwijzingen of neemt de nodige maatregelen met betrekking tot de verdelging en
      wering van knaagdieren in haveninrichtingen.
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel16
  - number: '16.2'
    text: |-
      Aanwijzingen of maatregelen, strekkende tot het ontoegankelijk maken van haveninrichtingen voor ratten door middel
      van afbraak of verbouwing, worden door de burgemeester slechts gegeven of genomen, nadat hij daaromtrent advies van
      de inspecteur heeft ingewonnen.
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel16
  - number: '16.3'
    text: |-
      Van de beslissing van de burgemeester wordt binnen vierentwintig uren schriftelijk of telegrafisch mededeling
      gedaan aan de inspecteur en de eigenaar en de exploitant van de haveninrichting.
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel16
  - number: '16.4'
    text: |-
      Van een beslissing van de burgemeester, houdende een aanwijzing of een maatregel, als bedoeld in het eerste lid,
      kunnen de inspecteur en de eigenaar en de exploitant van de haveninrichting binnen achtenveertig uren, nadat deze
      beslissing te hunner kennis is gebracht, bij Onze Minister beroep instellen. De beslissing van de burgemeester
      treedt niet in werking binnen de genoemde termijn van achtenveertig uren, dan wel, indien beroep is ingesteld,
      voordat daarop is beslist.
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel16
  - number: '16.5'
    text: |-
      Indien de burgemeester in gebreke blijft de noodzakelijke aanwijzingen te geven of de noodzakelijke maatregelen te
      nemen, is Onze Minister op voorstel van de inspecteur bevoegd zodanige aanwijzing te geven of zodanige maatregel
      te nemen. Alvorens te beslissen stelt de Minister de eigenaar en de exploitant van de haveninrichting in de
      gelegenheid hun gevoelen te doen kennen.
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel16
  - number: '16.6'
    text: |-
      De [hoofdstukken 6][ref1] en [7 van de Algemene wet bestuursrecht][ref2] zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0005537
  - number: '17.1'
    text: |-
      De burgemeester beslist, of zich voordoet een noodgeval, waarin ernstig gevaar voor de volksgezondheid bestaat, als
      bedoeld in artikel 29 van de Internationale Gezondheidsregeling.
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel17
  - number: '17.2'
    text: |-
      In een noodgeval, bedoeld in het voorgaande lid, kan de burgemeester aanwijzingen geven aan de gezagvoerder van
      een schip of een luchtvaartuig betreffende het lossen of laden van vracht of voorraden en het innemen van brandstof
      of water.
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel17
  - number: '17.3'
    text: |-
      De burgemeester draagt, indien zulks door de voor het vervoermiddel verantwoordelijke persoon wordt geëist, zorg
      voor de verwijdering van een besmette persoon, als bedoeld in artikel 39 van de Internationale Gezondheidsregeling.
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel17
  - number: '17.4'
    text: |-
      Ter uitvoering van het bepaalde in het tweede en derde lid kan de burgemeester zich bedienen van de hulp van de
      sterke arm.
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel17
  - number: '18'
    text: |-
      Het ingevolge de Internationale Gezondheidsregeling aan de gezondheidsautoriteit opgedragen medisch onderzoek
      geschiedt door of onder verantwoordelijkheid van de arts die de burgemeester bijstaat.
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel18
  - number: '19.1'
    text: |-
      De gezagvoerder van een schip, die een Nederlandse haven wil aandoen en weet of vermoedt, dat zijn schip als besmet
      of verdacht moet worden beschouwd of een haven in een besmette kring heeft aangedaan, draagt zorg:
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel19
  - number: 19.1.a
    text: |-
      dat hij van zijn wetenschap of vermoeden, zo mogelijk per radio, kennis geeft aan de burgemeester van de gemeente,
      waarbinnen de haven ligt, welke zijn schip zal aandoen, zodra het binnen de Nederlandse wateren is aangekomen;
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel19
  - number: 19.1.b
    text: |-
      dat, zodra het schip in het gezicht van de wal komt, een door Onze Minister vast te stellen sein wordt gevoerd,
      totdat het schip tot het vrije verkeer is toegelaten, of totdat dit het Nederlandse gebied heeft verlaten;
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel19
  - number: 19.1.c
    text: |-
      dat geen gemeenschap van het schip met de wal of met andere schepen plaatsheeft, alvorens het medische onderzoek is
      beëindigd en het schip tot het vrije verkeer zal zijn toegelaten.
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel19
  - number: '19.2'
    text: Een aan boord genomen loods is verplicht de gezagvoerder op zijn in lid 1 genoemde verplichtingen te wijzen.
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel19
  - number: '19.3'
    text: |-
      Hij, die de leiding heeft bij trein- of wegvervoer en weet of vermoedt, dat in zijn middel van vervoer bij aankomst
      in Nederland personen aanwezig zijn, die afkomstig zijn uit een besmette kring òf lijden aan, dan wel verdacht
      worden gevaar op te leveren voor verspreiding van, een quarantainabele ziekte, draagt zorg, dat hiervan onverwijld
      mededeling wordt gedaan aan de burgemeester van de gemeente, waar het vervoermiddel zich bevindt. Totdat hij
      terzake nadere aanwijzingen heeft ontvangen van de burgemeester of de arts, die deze bijstaat, draagt hij zorg, dat
      geen gevaar voor besmetting van anderen ontstaat.
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel19
  - number: '19.4'
    text: |-
      Degenen, die zich in de trein of in het middel van wegvervoer bevinden, zijn verplicht zich te gedragen naar de
      aanwijzingen, die de leider van trein- of wegvervoer hun verstrekt ter uitvoering van het bepaalde in de tweede
      volzin van het derde lid. Zij zijn in elk geval verplicht in de trein of in het middel van wegvervoer of in
      de onmiddellijke nabijheid daarvan te blijven en contacten te vermijden, totdat op hen van toepassing zijn de
      aanwijzingen, gegeven door de burgemeester of de arts, die deze bijstaat.
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel19
  - number: '19.5'
    text: |-
      Hij, die de leiding heeft bij het vervoer, wijst de in het vierde lid bedoelde personen op de in dat lid bedoelde
      verplichtingen.
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel19
  - number: '19.6'
    text: |-
      De gezagvoerder van een luchtvaartuig is gehouden, gelijktijdig met het overleggen van het gezondheidsgedeelte van
      de algemene verklaring voor luchtvaartuigen aan de burgemeester of aan de arts, bedoeld in [artikel 14][ref1], mede
      te delen, of het luchtvaartuig gedurende zijn laatste internationale reis een besmette kring heeft aangedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002343#Artikel14
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002343
        artikel: '14'
  - number: '20.1'
    text: |-
      Het verbod van gemeenschap met de wal of met andere schepen brengt mede, dat, behoudens in de hierna te noemen
      gevallen, niemand zich aan boord van het schip mag begeven of het schip mag verlaten.
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel20
  - number: '20.2'
    text: |-
      Het verbod om zich aan boord van het schip te begeven en het schip te verlaten, geldt niet voor de loods, voor de
      ambtenaren van het Staatstoezicht op de Volksgezondheid, de burgemeester en de arts, bedoeld in [artikel 14][ref1],
      de personen belast met de uitvoering van de ingevolge de Internationale Gezondheidsregeling of deze wet dan wel
      krachtens deze wet te nemen maatregelen, de artsen, het verplegend personeel en de geestelijken, belast met het
      verlenen van geneeskundige hulp, verpleging of geestelijke bijstand, en de rijksambtenaren der belastingen tot
      uitoefening van hun functies, de ambtenaren van justitie en politie, wanneer hun ambtsverrichtingen dit vereisen,
      alsmede, mits met toestemming van de burgemeester, de personen die zijn belast met het overbrengen van goederen
      aan boord.


      [ref1]: https://wetten.overheid.nl/BWBR0002343#Artikel14
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002343
        artikel: '14'
  - number: '20.3'
    text: |-
      Het verbod om het schip te verlaten geldt niet voor degenen, die daarvoor toestemming hebben gekregen van de
      burgemeester. De burgemeester mag besluiten, dat hij slechts toestemming verleent, indien te zijnen genoege is
      aangetoond, dat de betrokkene zich zal doen inenten, zich onder toezicht zal stellen of zich zal laten afzonderen.
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel20
  - number: '20.4'
    text: |-
      Het verbod van gemeenschap met de wal brengt mede, dat geen goederen gelost en geen andere goederen aan boord
      gebracht mogen worden dan die, welke ingevolge artikel 45 van de Internationale Gezondheidsregeling mogen worden
      ingenomen.
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel20
  - number: '21.1'
    text: |-
      De gezagvoerder van een zeeschip, komende uit een buitenlandse haven, overhandigt bij aankomst in de eerste
      Nederlandse haven de maritieme gezondheidsverklaring aan de aan boord gekomen loods, die zorg draagt, dat deze
      verklaring onverwijld wordt ingeleverd bij de burgemeester of de arts, bedoeld in [artikel 14][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002343#Artikel14
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002343
        artikel: '14'
  - number: '21.2'
    text: |-
      In het geval, dat een zeeschip niet wordt beloodst, geeft de gezagvoerder de maritieme gezondheidsverklaring
      uiterlijk binnen een uur na aankomst van het schip aan de eigenaar of de rompbevrachter of de gemachtigde van één
      dezer, die zorg draagt, dat deze verklaring onverwijld wordt ingeleverd bij de burgemeester of de arts, bedoeld
      in [artikel 14][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002343#Artikel14
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002343
        artikel: '14'
  - number: '22.1'
    text: |-
      De gezagvoerder van een schip of luchtvaartuig en zij, die de leiding hebben bij trein- of wegvervoer, dragen
      zorg voor de naleving van de voorschriften, welke op grond van bij of krachtens deze wet, dan wel op grond van de
      Internationale Gezondheidsregeling, zijn gegeven en van de maatregelen, welke ter uitvoering zijn genomen.
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel22
  - number: '22.2'
    text: |-
      Indien ingevolge de Internationale Gezondheidsregeling, dan wel bij of krachtens deze wet, een verplichting bestaat
      ten aanzien van een haven, een luchtvaartterrein of een haveninrichting, is de eigenaar of exploitant, alsmede het
      toezichthoudende personeel daarvan, voor de nakoming dier verplichting aansprakelijk.
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel22
  - number: '23'
    text: |-
      De inenting tegen pokken en cholera ter verkrijging van een internationaal geldig certificaat geschiedt onder door
      Onze Minister vast te stellen voorwaarden, door of onder directe verantwoordelijkheid van een arts.
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel23
  - number: '24'
    text: |-
      Onze Minister stelt de vorm vast van de afdruk van het officiële stempel, bedoeld in de aanhangsels 2 en 4 der
      Internationale Gezondheidsregeling.
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel24
  - number: '25'
    text: De arts gebruikt voor de enting tegen pokken en cholera de entstoffen, toegelaten door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel25
  - number: '26'
    text: |-
      Onze Minister bepaalt, wie gerechtigd zijn met de door hem aan te geven entstof te enten tegen gele koorts ter
      verkrijging van een internationaal geldig certificaat.
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel26
  - number: '27.1'
    text: |-
      De kosten van het medische onderzoek, hetwelk krachtens de Internationale Gezondheidsregeling of deze wet wordt
      verricht, en die van algemene onderzoekingen, nodig voor de uitvoering van artikel 16 van de Internationale
      Gezondheidsregeling en van [artikel 16, eerste en tweede lid][ref1] van deze wet, komen voor rekening van de
      gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0002343#Artikel16
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002343
        artikel: '16'
  - number: '27.2'
    text: |-
      De noodzakelijke kosten van de maatregelen, welke door een burgemeester naar aanleiding van een medisch onderzoek
      van een schip, luchtvaartuig, trein of middel van wegvervoer worden genomen, komen voor rekening van de gemeente.
      Deze kosten kunnen niet van derden worden teruggevorderd. Zij, op wie, dan wel op wier goederen, deze maatregelen
      zijn toegepast, hebben geen recht op vergoeding van schade, tenzij schade is veroorzaakt door onjuiste of
      gebrekkige toepassing van de maatregelen.
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel27
  - number: '27.3'
    text: |-
      De vergoeding voor de werkzaamheden van een arts tot bijstand van de burgemeester ter uitvoering van de
      Internationale Gezondheidsregeling of deze wet komt ten laste van de gemeente.
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel27
  - number: '27.4'
    text: |-
      De vergoeding voor de werkzaamheden van de deskundige, bedoeld in [artikel 14, eerste lid][ref1], komt voor
      rekening van de gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0002343#Artikel14
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002343
        artikel: '14'
  - number: '28.1'
    text: |-
      De kosten, voortvloeiende uit de toepassing van de artikelen 14, 15, 16, 17, 18 en 19 van de Internationale
      Gezondheidsregeling, alsmede uit de toepassing van [artikel 16][ref1] van deze wet, komen, behoudens het in
      [artikel 29][ref2] van deze wet bepaalde, ten laste van de exploitant van de betreffende haveninrichting of
      luchthaven.


      [ref1]: https://wetten.overheid.nl/BWBR0002343#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0002343#Artikel29
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002343
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0002343
        artikel: '29'
  - number: '28.2'
    text: |-
      In afwijking van het bepaalde in het vorige lid komen de kosten van de toerusting voor de onmiddellijke afzondering
      en verpleging van besmette en verdachte personen ten laste van het Rijk. Deze kosten van toerusting behoeven de
      goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel28
  - number: '29'
    text: |-
      De schade, welke het gevolg is van de uitvoering van maatregelen, als bedoeld in [artikel 16, tweede lid][ref1],
      van deze wet, komt voor rekening van de exploitant van de betreffende haveninrichting. Deze schade kan worden
      verhaald op het Rijk, indien de maatregelen noodzakelijk zijn geworden buiten de schuld van de exploitant.


      [ref1]: https://wetten.overheid.nl/BWBR0002343#Artikel16
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002343
        artikel: '16'
  - number: '30'
    text: |-
      De kosten van het onderzoek van schepen, noodzakelijk ter verkrijging van één der certificaten, bedoeld in
      artikel 54, tweede lid, der Internationale Gezondheidsregeling, alsmede de kosten der ter verkrijging van zodanig
      certificaat verrichte ontrattingen van schepen, komen ten laste van de gezagvoerder van het desbetreffende schip.
      Onze Minister stelt het tarief vast voor het onderzoek en voor de ontrattingen, als bedoeld in de vorige volzin,
      hetwelk in geheel Nederland geldt en gelijkluidend is voor elk schip, varende onder welke vlag ook.
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel30
  - number: '31'
    text: |-
      Behoudens het bepaalde in artikel 95 van de Internationale Gezondheidsregeling alsmede in andere door Onze Minister
      te bepalen gevallen komen de kosten van inenting ter verkrijging van een internationaal geldig certificaat van
      inenting ten laste van belanghebbende.
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel31
  - number: '32.1'
    text: |-
      Indien in een land, dat niet door de Internationale Gezondheidsregeling gebonden is, een besmette kring is, is Onze
      Minister bevoegd deze kring besmet te verklaren.
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel32
  - number: '32.2'
    text: |-
      Ten aanzien van verkeer uit zodanig land stelt de burgemeester de eisen en neemt hij de maatregelen, welke hij
      nuttig en nodig acht, ten einde verbreiding van besmettelijke ziekten te voorkomen en tegen te gaan, een en ander
      voor zover de in artikel 99 van de Internationale Gezondheidsregeling bedoelde internationale sanitaire verdragen
      hem dit ten aanzien van de landen, waarmede Nederland ter zake verbonden is gebleven, toestaan.
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel32
  - number: '33'
    text: |-
      De burgemeester, de ambtenaren van het Staatstoezicht op de volksgezondheid en alle anderen, die met de uitvoering
      van de ingevolge de Internationale Gezondheidsregeling en deze wet voorgeschreven maatregelen zijn belast, zijn na
      behoorlijke legitimatie en voor zover dat redelijkerwijs voor de vervulling van hun taak nodig is bevoegd schepen,
      luchtvaartuigen, treinen, andere middelen van vervoer en haveninrichtingen met inbegrip van woningen te betreden,
      zelfs zonder toestemming van de op of in het vervoermiddel of op de haveninrichting verantwoordelijke personen of
      van hen, die met de leiding van een haveninrichting zijn belast. Zij zijn tevens bevoegd alle plaatsen te betreden
      teneinde schepen, luchtvaartuigen, andere middelen van vervoer en haveninrichtingen te bereiken. Degene, die de
      leiding heeft op het betreffende voertuig of op de betreffende haveninrichting, stelt hem in de gelegenheid zich
      aldaar toegang te verschaffen.
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel33
  - number: '34'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regelen worden gegeven ter uitvoering van deze wet en van de
      Internationale Gezondheidsregeling.
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel34
  - number: 34a.1
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de ambtenaren van het
      Staatstoezicht op de volksgezondheid.
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel34a
  - number: 34a.2
    text: |-
      De in het eerste lid bedoelde ambtenaren beschikken niet over de bevoegdheden, genoemd in de [artikelen 5:18][ref1]
      en [5:19 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel34a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '35.1'
    text: |-
      Hij, die handelt in strijd met de bepalingen van deze wet of de Internationale Gezondheidsregeling, of niet
      voldoet aan bij of krachtens deze wet en bij de Internationale Gezondheidsregeling te zijnen aanzien gegeven
      aanwijzingen of voorgeschreven maatregelen, dan wel voorwerpen of dieren onttrekt aan bij of krachtens deze wet
      en de Internationale Gezondheidsregeling te dien aanzien gegeven aanwijzingen en voorgeschreven maatregelen, wordt
      gestraft met hechtenis van ten hoogste één jaar of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel35
  - number: '35.2'
    text: Het strafbare feit is een overtreding.
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel35
  - number: '36.1'
    text: |-
      Hij, die bij een medisch onderzoek opzettelijk onjuiste inlichtingen geeft, wordt gestraft met gevangenisstraf van
      ten hoogste één jaar of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel36
  - number: '36.2'
    text: Het strafbare feit is een misdrijf.
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel36
  - number: '37'
    text: |-
      De wet van 28 maart 1877, *Stb.* 35, tot wering van besmetting door uit zee aankomende schepen, laatstelijk
      gewijzigd bij de wet van 24 maart 1922, *Stb.* 135, en de wet van 26 oktober 1935, *Stb.* 626, tot regeling van het
      sanitaire toezicht op de luchtvaart, worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel37
  - number: '38'
    text: |-
      Deze wet kan worden aangehaald onder de titel "Quarantainewet". Zij treedt in werking op een door Ons te bepalen
      tijdstip. Wij kunnen het inwerkingtreden van de verschillende onderdelen van deze wet op verschillende tijdstippen
      bepalen.
    url: https://wetten.overheid.nl/BWBR0002343/1998-01-01#Artikel38
