  - number: '26'
    text: |-
      1 Het is de apotheker geoorloofd aan een of meer personen in opleiding tot apotheker of apothekersassistent,
      gelegenheid te geven in zijn apotheek werkzaam te zijn.

      2 Bij algemene maatregel van bestuur, kunnen voorwaarden worden gesteld, waaronder deze personen in de apotheek
      werkzaam mogen zijn.
    url: https://wetten.overheid.nl/BWBR0028486/2025-01-01#Artikel26
  - number: 26a
    text: |-
      1 Het is verboden, middellijk of onmiddellijk, een apotheek te vestigen, te verplaatsen, over te nemen dan wel te
      drijven, zonder een daartoe door Onze Minister verleende vergunning.

      2 Voor het in behandeling nemen van een aanvraag tot het verkrijgen van een vergunning als bedoeld in het eerste
      lid, wordt een eenmalige vergoeding geheven overeenkomstig regelen bij algemene maatregel van bestuur, vast te
      stellen.

      3 Voor een vergunning als bedoeld in het eerste lid, wordt jaarlijks een vergoeding geheven overeenkomstig regelen
      bij algemene maatregel van bestuur, vast te stellen.

      4 De vergunning kan worden ingetrokken indien de verschuldigde vergoeding niet is betaald.

      5 Onze Minister kan aan de vergunning voorwaarden verbinden, de vergunning weigeren of deze intrekken, indien het
      belang van de volksgezondheid zulks vordert en voorts indien naar het oordeel van Onze Minister het algemeen belang
      zulks vordert.

      6 Onze Minister beslist niet eerder tot toekenning, weigering of intrekking van een vergunning als bedoeld in het
      eerste lid, dan nadat een bij Onze Minister aan te wijzen commissie is gehoord. Bij regeling van Onze Minister
      kunnen regels worden gesteld over de uitvoering van de werkzaamheden van de commissie.
    url: https://wetten.overheid.nl/BWBR0028486/2025-01-01#Artikel26a
  - number: 26b
    text: |-
      1 In het belang van een goede uitvoering van [artikel 26a][ref1] kunnen door Onze Minister nadere regelen worden
      gegeven.

      2 [Artikel 26a][ref2] is niet van toepassing op apotheken in ziekenhuizen als bedoeld in
      [artikel 44, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0028486#Artikel26a
      [ref2]: https://wetten.overheid.nl/BWBR0028486#Artikel26a
