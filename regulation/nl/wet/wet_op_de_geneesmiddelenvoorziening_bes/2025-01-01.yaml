  - number: '56'
    text: |-
      De besluiten van de Gouverneur van de 25ste juli 1906 (P.B. 1906, No. 33) en van de 25ste juli 1906 (P.B. 1906,
      no. 34) ter uitvoering van respectievelijk artikel 5 en artikel 8 van de Verordening van de 30ste oktober 1873
      (P.B. 1874, No. 6), regelende de uitoefening van de artsenijmengkunst in de Nederlandse Antillen, zoals gewijzigd,
      blijven van kracht totdat zij zijn vervangen door de landsbesluiten, houdende algemene maatregelen, bedoeld in de
      [artikelen 30, lid 1 sub d][ref1] en [32, lid 1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028486#Artikel30
