  - number: 3a
    text: |-
      1 Voor een vergunning, als bedoeld in [artikel 3, eerste lid, onderdeel d, en tweede lid][ref1], wordt jaarlijks
      een vergoeding geheven overeenkomstig regelen bij algemene maatregel van bestuur, vast te stellen.

      2 Onverminderd het bepaalde in [artikel 3, eerste lid, onderdeel d, en tweede lid][ref2], kan Onze Minister een
      vergunning intrekken:

      a. indien naar het oordeel van Onze Minister het algemeen belang zulks vordert;

      b. indien is gebleken dat gedurende een periode bij algemene maatregel van bestuur, vast te stellen, geen
      daadwerkelijk gebruik is gemaakt van de bij de vergunning verleende bevoegdheid;

      c. indien de krachtens het eerste lid verschuldigde vergoeding niet is betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0028486#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0028486#Artikel3
