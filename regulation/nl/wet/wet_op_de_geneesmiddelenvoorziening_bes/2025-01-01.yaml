        artikel: 48a
        hoofdstuk: Xa
  - number: '49'
    text: |-
      1 Met hechtenis van ten hoogste zes maanden of geldboete van ten hoogste de tweede categorie wordt gestraft hij,
      die:

      a. de in [artikel 3,eerste lid, onder d][ref1] bedoelde bevoegdheid overschrijdt;

      b. een der [artikelen 3 derde lid][ref2], [4][ref3], [5 eerste lid laatste volzin en het vierde lid][ref4],
      [7 eerste lid][ref5], [11][ref6], [12][ref7], [14 eerste lid][ref8], [15][ref9], [16][ref10],
      [17 eerste en tweede lid][ref11][18][ref12], [19][ref13], [20][ref14], [21 derde lid][ref15][22][ref16],
      [23][ref17], [25 tweede en derde lid][ref18], [26a, eerste lid][ref19], [27 eerste lid][ref20],
      [28 derde lid][ref21], [29][ref22], [30][ref23], [31][ref24], [32][ref25], [33][ref26],
      [34][ref27][35 vierde lid][ref28], [36][ref29], [37 eerste lid][ref30], [38 tweede lid][ref31],
      [41 eerste lid][ref32][42][ref33], [47][ref34], [48a][ref35], [48b][ref36], [48c][ref37] en [51][ref38] overtreedt;

      c. voorschriften, uitgevaardigd op grond van [artikelen 6][ref39], [26 tweede lid][ref40], [27 derde lid][ref41],
      [37 tweede lid][ref42] of [44 eerste lid][ref43], overtreedt;

      d. geen gevolg geeft aan een aanwijzing, bedoeld in [artikel 48 tweede lid][ref44];

      e. niet voldoet aan de voorwaarden, verbonden aan een vergunning krachtens deze wet verleend.

      2 De bij dit artikel strafbaar gestelde feiten worden beschouwd als overtredingen.

      3 Op de bij dit artikel strafbaar gestelde feiten zijn niet van toepassing de strafbepalingen, voorkomende in de
      Algemene Verordening I.U. & D. 1908 (P.B. 1949, no 62).


