  - number: '4'
    text: |-
      1 Hij, die de artsenijbereidkunde uitoefent, is gehouden dit met nauwkeurigheid en met inachtneming van de
      wettelijke voorschriften te doen.

      2 Een geneesmiddel mag slechts worden afgeleverd, indien duidelijk is aangegeven hetgeen wordt verlangd.
    url: https://wetten.overheid.nl/BWBR0028486/2025-01-01#Artikel4
  - number: '5'
    text: |-
      1 Het is verboden verpakte geneesmiddelen welke niet staan in het register, bedoeld in
      [artikel 53 van de Geneesmiddelenwet][ref1], te bereiden, in voorraad te hebben, te verkopen, af te leveren, ter
      hand te stellen, in te voeren, of te verhandelen.

      2 Het in het eerste lid vervatte verbod geldt niet voor:

      a. door onze Minister aan te wijzen verpakte geneesmiddelen;

      b. het bereiden, in voorraad hebben, afleveren of terhandstellen van zich nog in het stadium
      van proefneming bevindende verpakte geneesmiddelen welke niet staan in het register, bedoeld in
      [artikel 53 van de Geneesmiddelenwet][ref2];

      c. de invoer van verpakte geneesmiddelen welke niet staan in het register, bedoeld in
      [artikel 53 van de Geneesmiddelenwet][ref3], en het in voorraad hebben, de aflevering en de ter hand stelling van
      deze geneesmiddelen in de bij algemene maatregel van bestuur aangegeven gevallen, een en ander indien is voldaan
      aan de bij algemene maatregel van bestuur gestelde voorschriften.

      3 Indien het belang van de volksgezondheid zulks vordert, is onze Minister bevoegd ten aanzien van een
      geneesmiddel, welk staat in het register, bedoeld in [artikel 53 van de Geneesmiddelenwet][ref4], te bepalen, dat
      gedurende een bij zijn beschikking aan te wijzen tijdvak van ten hoogste twaalf maanden niet mag worden afgeleverd
      of terhandgesteld dan met inachtneming van bij die beschikking gestelde voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0021505#Artikel53
