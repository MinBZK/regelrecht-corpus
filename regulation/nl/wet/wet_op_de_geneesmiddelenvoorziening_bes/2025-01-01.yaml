  - number: '27'
    text: |-
      1 Een lokaal mag aan het publiek alleen dan als apotheek kenbaar worden gemaakt, wanneer het als zodanig in gebruik
      is bij een apotheker en voldoet aan de voor een apotheek gestelde eisen.

      2 Onder als apotheek kenbaar maken wordt mede verstaan het voorzien van een benaming onder gebruikmaking van een
      synoniem of vertaling van het woord apotheek.

      3 Bij algemene maatregel van bestuur, worden nadere voorschriften gegeven betreffende de inrichting van het lokaal
      of de lokalen waarin de apotheek wordt gevestigd.
    url: https://wetten.overheid.nl/BWBR0028486/2025-01-01#Artikel27
  - number: '28'
    text: |-
      1 Het openings- en sluitingsuur van de openbare apotheken wordt bij eialgemene maatregel van bestuur, zodanig
      geregeld dat er steeds voldoende gelegenheid tot het verkrijgen van geneesmiddelen is.

      2 Indien de apotheek is gesloten moet ter plaatse op duidelijk zichtbare wijze kenbaar zijn gemaakt, welke apotheek
      open is.

      3 Het is verboden buiten het in het eerste lid bedoelde openings- en sluitingsuur een apotheek voor het publiek
      geopend te hebben.

      4 Het in [artikel 27 leden 1 en 2][ref1] en in de vorige leden van dit artikel gestelde is niet van toepassing op
      de apotheken in ziekenhuizen en poliklinieken van ondernemingen ondergebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0028486#Artikel27
