  - number: '25'
    text: |-
      1 De apotheker kan zich doen bijstaan door een of meer apothekers-assistenten, die onverminderd het bepaalde in
      het [eerste lid van artikel 14][ref1] verantwoordelijk zijn voor hetgeen door hen in de uitoefening van hun beroep
      wordt gedaan of nagelaten.

      2 Hij, die de hoedanigheid van apothekers-assistent bezit, mag van zijn bevoegdheid tot uitoefening van de
      artsenijbereidkunde geen gebruik maken, voordat hij op zijn verzoek door de Inspecteur in het register der
      apothekers-assistenten, die de artsenijbereidkunde uitoefenen, is ingeschreven.

      3 Bij een verzoek om inschrijving moet door de verzoeker het bewijs van zijn hoedanigheid van apothekers-assistent
      worden overgelegd. Van de inschrijving wordt aantekening gedaan op het bewijs van bevoegdheid.

      4 Wanneer een apothekers-assistent in een apotheek aangenomen of daaruit ontslagen is, geeft de apotheker daarvan
      terstond kennis aan de Inspecteur.

      5 Het bepaalde in de [artikelen 7 lid 3][ref2] en [9 lid l onder a. en c][ref3]. is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028486#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0028486#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0028486#Artikel9
