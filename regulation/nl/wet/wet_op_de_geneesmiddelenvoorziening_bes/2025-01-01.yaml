  - number: 48b
    text: |-
      Het is de eigenaar, bedoeld in [artikel 48a][ref1], verboden te handelen of handelingen na te laten in strijd met
      het bij of krachtens deze wet bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0028486#Artikel48a
    url: https://wetten.overheid.nl/BWBR0028486/2025-01-01#Artikel48b
    references:
      - id: ref1
        bwb_id: BWBR0028486
        artikel: 48a
        hoofdstuk: Xa
  - number: 48c
    text: |-
      Het is de eigenaar, bedoeld in [artikel 48a][ref1], voorts verboden in strijd met het bepaalde bij of krachtens
      deze wet te doen handelen of handelingen te doen nalaten dan wel zodanige beletselen op te werpen dat anderen de
      aan hen bij of krachtens deze wet opgelegde verplichtingen niet kunnen nakomen.


      [ref1]: https://wetten.overheid.nl/BWBR0028486#Artikel48a
    url: https://wetten.overheid.nl/BWBR0028486/2025-01-01#Artikel48c
