  - number: '6'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden vastgesteld nopens de bereiding, het in voorraad hebben,
      het verkopen, het afleveren, de ter hand stelling, de invoer, de handel en het ter aflevering in voorraad hebben,
      de aanprijzing en de verpakking van verpakte geneesmiddelen. Bij algemene maatregel van bestuur, kan, in het belang
      van de volksgezondheid bepaald worden dat een of meer van die voorschriften niet van toepassing zullen zijn op een
      verpakt geneesmiddel, of wel van toepassing zullen zijn op enige zelfstandigheid.
    url: https://wetten.overheid.nl/BWBR0028486/2025-01-01#Artikel6
  - number: '7'
    text: |-
      1 Hij, die de hoedanigheid van apotheker bezit, mag van zijn bevoegdheid tot uitoefening artsenijbereidkunde
      geen gebruik maken voordat hij op zijn verzoek door de Inspecteur in het register der apothekers die de
      artsenijbereidkunde uitoefenen is ingeschreven.

      2 Bij een verzoek om inschrijving moet door de verzoeker het bewijs van zijn hoedanigheid van apotheker worden
      overgelegd. Van de inschrijving wordt aantekening gedaan op het bewijs van bevoegdheid.

      3 De inschrijving geschiedt voor een apotheek bevestigd in een bepaald aangewezen perceel.

      4 Voor een inschrijving als bedoeld in het eerste lid, wordt een vergoeding geheven overeenkomstig regelen bij
      algemene maatregel van bestuur, vast te stellen. De inschrijving geschiedt niet dan nadat de vergoeding is betaald.

      5 Bij het verzoek tot inschrijving dient door de verzoeker te worden overgelegd:

      a. een door de verzoeker ondertekende verklaring, waaruit blijkt dat hij de artstenijbereidkunde al dan niet in
      dienstbetrekking, maatschap of andere vorm van samenwerkingsverband met derden zal uitoefenen:

      b. ingeval de verzoeker een persoon is die voornemens is de artsenijbereidkunde uit te oefenen in dienst van een
      apotheker, van een instelling van apothekers, van personen die geen apotheker zijn of van instellingen die geen
      instellingen van apothekers zijn, een door de werkgever ondertekende verklaring, waaruit ten genoegen van de
      Inspecteur moet blijken dat de verzoeker in staat wordt gesteld de artsenijbereidkunde in onafhankelijkheid en naar
      behoren uit te oefenen.
    url: https://wetten.overheid.nl/BWBR0028486/2025-01-01#Artikel7
  - number: '8'
    text: |-
      1 De inschrijving wordt door de Inspecteur geweigerd, indien de aanvrager in de uitoefening zijner bevoegdheid is
      geschorst en de termijn van schorsing nog niet is verstreken, zomede indien hem deze bevoegdheid is ontnomen.

      2 De Inspecteur is bevoegd de inschrijving te weigeren:

      a. indien hem blijkt dat de apotheek niet aan de eisen, bij of krachtens deze wet aan apotheken gesteld, voldoet;

      b. indien niet de nodige waarborgen aanwezig zijn voor de aflevering van deugdelijke geneesmiddelen. Onder deze
      waarborgen is mede begrepen, dat het door de apotheker in zijn apotheek uit te oefenen toezicht voldoende zal zijn.
    url: https://wetten.overheid.nl/BWBR0028486/2025-01-01#Artikel8
  - number: '9'
    text: |-
      1 De inschrijving vervalt:

      a. bij overlijden van de ingeschrevene;

      b. indien de ingeschrevene in de uitoefening zijner bevoegdheid is geschorst of hem deze is ontnomen;

      c. indien de ingeschrevene aan de Inspecteur te kennen geeft, dat hij ophoudt de artsenijbereidkunde uit te oefenen
      in de apotheek waarvoor hij is ingeschreven.

      2 De Inspecteur is bevoegd de inschrijving van een apotheker in te trekken, indien naar zijn oordeel voldoende
      waarborgen voor de aflevering van deugdelijke geneesmiddelen niet aanwezig zijn. Onder deze waarborgen is mede
      begrepen dat het door de apotheker in zijn apotheek uit te oefenen toezicht voldoende zal zijn.

      3 In de gevallen, bedoeld in het eerste en tweede lid, is de Inspecteur bevoegd de apotheek te sluiten en de
      toegang te verzegelen en verzegeld te houden zolang geen nieuwe inschrijving is geschied.
    url: https://wetten.overheid.nl/BWBR0028486/2025-01-01#Artikel9
  - number: '10'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028486/2025-01-01#Artikel10
  - number: '11'
    text: |-
      De apotheker is verplicht, zodra hij ophoudt de artsenijbereidkunde uit te oefenen in de apotheek waarvoor hij is
      ingeschreven, daarvan schriftelijk kennis te geven aan de Inspecteur.
    url: https://wetten.overheid.nl/BWBR0028486/2025-01-01#Artikel11
  - number: '12'
    text: |-
      De apotheker mag de artsenijbereidkunde slechts in één apotheek uitoefenen, behoudens in de gevallen bedoeld in
      [artikel 24][ref1] en het tweede lid laatste zin van [artikel 44][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028486#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0028486#Artikel44
    url: https://wetten.overheid.nl/BWBR0028486/2025-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0028486
        artikel: '24'
        hoofdstuk: IV
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0028486
        artikel: '44'
        hoofdstuk: IX
  - number: '13'
    text: |-
      Indien in een apotheek meer dan één apotheker de artsenijbereidkunde uitoefent, rusten alle verplichtingen, welke
      deze wet of de ter uitvoering daarvan te geven voorschriften de apotheker oplegt, op de oudste in leeftijd, tenzij
      de betrokken apothekers schriftelijk anders zijn overeengekomen en de Inspecteur aan belanghebbenden schriftelijk
      van zijn instemming met deze overeenkomst heeft doen blijken.
    url: https://wetten.overheid.nl/BWBR0028486/2025-01-01#Artikel13
  - number: '14'
    text: |-
      1 De apotheker is verplicht zorg te dragen, dat de in zijn apotheek werkzame personen de bij of krachtens deze wet
      vastgestelde bepalingen naleven.

      2 Hij is van de verplichting, bedoeld in het eerste lid van dit artikel, bevrijd, voor zover hij kan aantonen, dat
      hij gedaan heeft wat redelijkerwijze mogelijk was om een overtreding te voorkomen.
    url: https://wetten.overheid.nl/BWBR0028486/2025-01-01#Artikel14
  - number: '15'
    text: |-
      Het is de apotheker verboden, met een geneeskundige, tandheelkundige of vroedvrouw rechtstreeks of zijdelings enige
      overeenkomst betreffende het leveren van geneesmiddelen aan derden aan te gaan, waardoor voor hen, die het gebruik
      der geneesmiddelen voorschrijft, deze bereidt of deze aflevert, rechtstreeks of zijdelings geldelijk of in geld
      waardeerbaar belang bij de levering zou bestaan.
    url: https://wetten.overheid.nl/BWBR0028486/2025-01-01#Artikel15
  - number: '16'
    text: |-
      1 De apotheker stelt geneesmiddelen terhand op recept of op enig ander verzoek met inachtneming van het bepaalde
      bij het [tweede lid van artikel 4][ref1].

      2 De geneesmiddelen welke als UR-geneesmiddelen staan vermeld in de lijst, bedoeld in
      [artikel 60 van de Geneesmiddelenwet][ref2], mogen niet anders dan op recept worden afgeleverd.

      3 Een apotheker die in een apotheek werkt, is bevoegd in spoedgevallen geneesmiddelen, bedoeld in het tweede lid
      van dit artikel, ter hand te stellen zonder dat een recept wordt overgelegd, indien hij zich voldoende zekerheid
      heeft verschaft dat gevaar voor misbruik niet kan ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028486#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0021505#Artikel60
    url: https://wetten.overheid.nl/BWBR0028486/2025-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0028486
        artikel: '4'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0021505
        artikel: '60'
  - number: '17'
    text: |-
      1 De apotheker stelt op recept geen geneesmiddelen terhand dan nauwkeurig volgens het recept en van deugdelijke
      bestanddelen bereid.

      2 Vermoedt hij in een recept een wellicht schadelijke vergissing, dan geeft hij daarvan terstond mondeling of
      schriftelijk kennis aan degene die het recept voorschreef. Hij gaat niet tot aflevering over voordat hij zekerheid
      heeft gekregen,

      3 Hij wordt geacht zekerheid te hebben verkregen, indien hij zijn vermoeden en de gronden waarop dit vermoeden
      steunt heeft kenbaar gemaakt aan degene die het recept voorschreef en deze de juistheid van het recept schriftelijk
      heeft bevestigd of een tweede gelijkluidend recept heeft afgegeven.
    url: https://wetten.overheid.nl/BWBR0028486/2025-01-01#Artikel17
  - number: '18'
    text: |-
      1 De apotheker zorgt, dat aan of op elk voorwerp waarin hij een geneesmiddel op recept terhandstelt, een papier
      gehecht is, waarop de naam van degene te wiens behoeve het is voorgeschreven is vermeld, dan wel diens initialen of
      een cijfer ter vervanging daarvan, alsmede de wijze van gebruik, de dag der aflevering en zijn naam.

      2 De aanduidingen in het eerste lid bedoeld worden bij geneesmiddelen tot inwendig gebruik op ongekleurd, bij die
      tot uitwendig gebruik op gekleurd papier gesteld.
    url: https://wetten.overheid.nl/BWBR0028486/2025-01-01#Artikel18
  - number: '19'
    text: |-
      1 De apothekers liasseren de hun aangeboden en bereide recepten naar de volgorde der bereiding en bewaren die
      aldus gedurende vijf jaren. De bewaring van de recepten dient in de apotheek te geschieden en wel op geordende en
      overzichtelijke wijze overeenkomstig door de Inspecteur vast te stellen richtlijnen of te geven aanwijzingen.

      2 Bij overgang van de apotheek op een andere apotheker gaan ook de recepten op deze over; bij opheffing der
      apotheek worden zij door de naaste belanghebbende aan de Inspecteur overgegeven.
    url: https://wetten.overheid.nl/BWBR0028486/2025-01-01#Artikel19
  - number: '20'
    text: |-
      1 De apotheker mag, behoudens het in het volgende artikel bepaalde, een recept aan niemand ter inzage geven, nog
      afschrift daarvan verstrekken, noch mededelingen daaromtrent doen dan aan:

      a. degene die het voorschreef;

      b. degene te wiens behoeve het is voorgeschreven;

      c. de geneeskundige, de tandheelkundige of vroedvrouw die degene, te wiens behoeve het is voorgeschreven,
      behandelt;

      d. de rechter;

      e. de Inspecteur.

      2 De apotheker is verplicht éénmaal een afschrift van een recept af te geven aan een der in het vorige lid van dit
      artikel bedoelde personen, indien dit door deze wordt verlangd.
    url: https://wetten.overheid.nl/BWBR0028486/2025-01-01#Artikel20
  - number: '21'
    text: |-
      1 De apotheker geeft, wanneer dit door een der in [artikel 20][ref1] genoemde personen verlangd wordt, een
      gespecificeerde rekening der geleverde geneesmiddelen.

      2 Hij is bevoegd aan op openbaar gezag ingestelde lichamen, naamloze vennootschappen, wederkerige verzekerings- of
      waarborgmaatschappijen, coöperatieve of andere rechtspersoonlijkheid bezittende verenigingen of aan stichtingen,
      voor welker rekening aan verzekerden, leden of anderen, geneesmiddelen worden verstrekt, een gespecificeerde
      rekening der voor haar rekening geleverde geneesmiddelen en des gewenst de recepten ter inzage over te leggen of
      afschriften der recepten te geven.

      3 De bestuurders van en de verdere personen werkzaam aan de in het voorgaande lid bedoelde lichamen,
      vennootschappen, maatschappijen, verenigingen, of stichtingen, mogen de gespecificeerde rekening en de
      afschriften der recepten aan niemand ter inzage, noch afschrift daarvan geven, dan aan de in het eerste lid van
      [artikel 20][ref2] genoemde personen.


      [ref1]: https://wetten.overheid.nl/BWBR0028486#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0028486#Artikel20
    url: https://wetten.overheid.nl/BWBR0028486/2025-01-01#Artikel21
