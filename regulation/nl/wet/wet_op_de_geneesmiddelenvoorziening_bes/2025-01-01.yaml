  - number: '24'
    text: |-
      1 Indien een apotheker door ziekte of tijdelijke afwezigheid verhinderd is de artsenijbereidkunde in zijn apotheek
      uit te oefenen, dan wel de inschrijving volgens [artikel 9][ref1] is vervallen of ingetrokken, kan de Inspecteur
      aan een andere apotheker op diens verzoek toestaan de artsenijbereidkunde in die apotheek als waarnemende apotheker
      uit te oefenen. De Inspecteur kan aan deze toestemming voorwaarden verbinden.

      2 Gedurende de waarneming heeft de waarnemende apotheker alle bevoegdheden en verplichtingen, welke de apotheker
      ingevolge deze wet of de ter uitvoering daarvan te geven voorschriften heeft.

      3 De in het eerste lid bedoelde toestemming wordt door de Inspecteur verleend, indien naar zijn oordeel voldoende
      waarborgen aanwezig zijn voor het nakomen van de verplichtingen in het tweede lid bedoeld. De toestemming wordt in
      eerste instantie voor drie maanden verleend en kan op aanvrage telkens met drie maanden worden verlengd, met een
      maximum van één jaar voor de totale waarnemingsperiode voor die apotheek.

      4 De Inspecteur is bevoegd een verleende toestemming in te trekken, indien aan de in het tweede lid gestelde
      verplichtingen of aan de voorwaarden, waaronder de toestemming is verleend, niet wordt voldaan.

      5 Voor een toestemming tot waarneming als bedoeld in dit artikel, wordt een vergoeding geheven overeenkomstig
      regelen bij algemene maatregel van bestuur, vast te stellen. De toestemming tot waarneming wordt niet verleend dan
      nadat de vergoeding is betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0028486#Artikel9
