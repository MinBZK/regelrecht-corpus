  - number: '1'
    text: |-
      Voor de toepassing van deze wet en de uitvoering daarvan te geven voorschriften wordt verstaan onder:

        - *Onze Minister:* Onze Minister van Volksgezondheid, Welzijn en Sport;
        - *Inspecteur:* de Inspecteur van de inspectie, bedoeld in onderdeel c;
        - *Inspectie:* de Inspectie gezondheidszorg en jeugd;
        - *zelfstandigheden:* stoffen, dieren, planten delen of producten van dieren of planten, producten bereid uit
      dieren of planten of uit gedeelten van dieren of planten, alsmede de mengsels hiervan;
        - *geneesmiddelen:* 1°. Zelfstandigheden, welke worden gebruikt voor genezing, leniging of voorkoming van enige
      aandoening, ziekte, ziekteverschijnsel, pijn, verwonding of gebrek bij de mens, voor zover zij in een apotheek
      plegen aanwezig te zijn of uit een apotheek zijn of plegen te worden afgeleverd; 2°. Zelfstandigheden, welke
      op recept zijn bereid waarbij onder bereiden tevens wordt verstaan het in de vereiste vorm brengen of het ter
      aflevering gereedmaken; 3°. Zelfstandigheden, welke zich bevinden in een verpakking of voorwerp, en kennelijk
      bestemd zijn om in die verpakking of in dat voorwerp aan de verbruiker te worden afgeleverd en welke op enigerlei
      wijze worden of werden aangeduid of aangeprezen als zijnde geschikt of als zouden zij geschikt kunnen zijn ter
      genezing, leniging of voorkoming van enige aandoening ziekte, ziekte- verschijnsel pijn, verwonding of gebrek bij
      de mens; 4°. Zelfstandigheden, als zodanig door Onze Minister aangewezen;
        - *verpakte geneesmiddelen:* de geneesmiddelen, bedoeld in onderdeel e, onder 3° en 4° voor zover deze zich
      bevinden in een verpakking of voorwerp, en kennelijk bestemd zijn om in die verpakking of in dat voorwerp aan de
      verbruiker te worden afgeleverd;
        - uitoefening der artsenijbereidkunde: 1°. bereiden: geheel of gedeeltelijk vervaardigen van geneesmiddelen
      dan wel het verpakken of etiketteren daarvan; 2°. in voorraad hebben; hieronder wordt niet verstaan het door
      geneeskundigen, tandheelkundigen, verloskundigen, mondhygiënisten of optometristen onder zich hebben van
      terhandgestelde geneesmiddelen alsmede het bewaren van terhandgestelde geneesmiddelen door de patiënt voor wie
      het geneesmiddel is bestemd; 3°. afleveren: anders dan door terhandstelling of uitvoer leveren van geneesmiddelen;
      4° terhandstellen: rechtstreeks verstrekken of doen bezorgen van een geneesmiddel aan de patiënt voor wie
      het geneesmiddel is bestemd, dan wel aan geneeskundigen, tandheelkundigen, verloskundigen, mondhygiënisten
      of optometristen die geneesmiddelen onder zich hebben ten behoeve van toediening aan hun patiënten; hieronder
      wordt niet verstaan het aanwenden van terhandgestelde geneesmiddelen door een geneeskundige, tandheelkundige,
      verloskundige, mondhygiënist of optometrist bij een patiënt;
        - *apotheek:* het lokaal dat of bij de elkaar behorende lokalen en bewaarplaatsen welke door een apotheker of een
      geneeskundige als bedoeld in [artikel 35][ref1] wordt of worden gebruikt voor of in verband met de uitoefening van
      de artsenijbereidkunde.
        - *recept:* de schriftelijke aanwijzing nopens de bereiding of de aflevering van een geneesmiddel, afgegeven door
      een geneeskundige, een tandheelkundige of een vroedvrouw ten behoeve van een of meer met name genoemde dan wel met
      cijfers of letters aangeduide personen;
        - *ziekenhuis:* een inrichting bestemd voor of gebezigd tot verpleging van personen, opgenomen voor het ondergaan
      van genees-, heel- of verloskundige behandelingen of genees-, heel of verloskundig onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0028486#Artikel35
