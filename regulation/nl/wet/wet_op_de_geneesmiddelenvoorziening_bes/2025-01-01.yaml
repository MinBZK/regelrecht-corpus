  - number: '23'
    text: |-
      1 De apotheker schrijft zonder uitstel in een register elke aflevering van vergiften met vermelding van de dag
      waarop en van naam en adres van de persoon aan wie de aflevering is gedaan.

      2 Deze bepaling is niet toepasselijk op de aflevering op voorschrift van een geneeskundige, tandheelkundige
      of vroedvrouw. Hij liasseert de in het vorige artikel bedoelde schriftelijke aanvragen afgescheiden van de
      voorschriften der geneeskundigen, tandheelkundigen en vroedvrouwen en bewaart die gedurende tenminste twintig
      jaren.

      3 Het [tweede lid van artikel 19][ref1], zomede het [derde lid van artikel 22][ref2] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028486#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0028486#Artikel22
