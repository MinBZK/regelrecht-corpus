  - number: '29'
    text: |-
      Onverminderd de bepaling van het [tweede lid van artikel 3][ref1] mogen in een apotheek slechts werkzaamheden,
      die geacht kunnen worden betrekking te hebben op de uitoefening van de artsenijbereidkunde of op wetenschappelijke
      onderzoekingen, worden verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0028486#Artikel3
    url: https://wetten.overheid.nl/BWBR0028486/2025-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0028486
        artikel: '3'
        hoofdstuk: II
  - number: '30'
    text: |-
      1 In elke apotheek moeten steeds schouwbaar voorhanden zijn:

      a. nauwkeurige maten, gewichten en balansen, waaronder een milligram balans;

      b. voldoende en in goede staat verkerende farmaceutische toestellen;

      e. een exemplaar van de laatste uitgave van de Nederlandse Farmacopee;

      d. de geneesmiddelen, vermeld op een bij algemene maatregel van bestuur, vast te stellen lijst.

      2 Overigens mogen slechts aanwezig zijn:

      a. geneesmiddelen, waarvan de aanwezigheid niet verplicht is;

      b. dietetische preparaten;

      c. goederen, welke bij de verpleging van zieken, de leniging van gebreken en de voorkoming van ziekten toepassing
      kunnen vinden;

      d. stoffen, werktuigen en verdere benodigheden, welke voor wetenschappelijke onderzoekingen nodig zijn;

      e. cosmetica, zomede andere bij algemene maatregel van bestuur, aan te wijzen artikelen.
    url: https://wetten.overheid.nl/BWBR0028486/2025-01-01#Artikel30
  - number: '31'
    text: |-
      Elke geneesmiddel moet voldoen aan de vereisten vermeld in de laatste uitgave van de Nederlandse Farmacopee en
      bewaard worden in een daartoe geschikt voorwerp, hetwelk de officiële of de meest gebruikelijke naam van het middel
      duidelijk leesbaar ten opschrift heeft.
    url: https://wetten.overheid.nl/BWBR0028486/2025-01-01#Artikel31
  - number: '32'
    text: |-
      Giftige zelfstandigheden vermeld op een bij algemene maatregel van bestuur vast te stellen lijst, worden bewaard in
      een of meer gesloten kasten, waarvan de sleutels uitsluitend bij de apotheker of de apothekersassistent berusten.
    url: https://wetten.overheid.nl/BWBR0028486/2025-01-01#Artikel32
  - number: '33'
    text: |-
      1 Indien een apotheek wordt verkocht is de verkoper verplicht zorg te dragen, dat de verkoop van de in de
      apotheek aanwezige voorraad geneesmiddelen en giftige zelfstandigheden alleen geschiedt aan een apotheker
      of een geneeskundige als bedoeld in [artikel 35][ref1] of aan de houder ener vergunning als bedoeld in
      [artikel 3 onder d][ref2].

      2 Bij openbare verkoop draagt de openbare ambtenaar te wiens overstaan de verkoping heeft mede zorg voor de
      naleving van het in het vorige lid bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0028486#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0028486#Artikel3
    url: https://wetten.overheid.nl/BWBR0028486/2025-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0028486
        artikel: '35'
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0028486
        artikel: '3'
        hoofdstuk: II
  - number: '34'
    text: |-
      De uitoefening van de artsenijbereidkunde is aan geneeskundigen die tevens de hoedanigheid van apotheker bezien,
      verboden zolang zij de geneeskundige praktijk uitoefenen, behoudens het bepaalde in [artikel 35][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028486#Artikel35
    url: https://wetten.overheid.nl/BWBR0028486/2025-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0028486
        artikel: '35'
        hoofdstuk: VII
  - number: '35'
    text: |-
      1 Onze Minister kan, de Inspecteur gehoord, in het belang van een goede geneesmiddelenvoorziening de bevoegdheid
      tot het uitoefenen van de artsenijbereidkunde verlenen aan geneeskundigen, die zich in een van de openbare lichamen
      Bonaire, Sint Eustatius of Saba vestigen, doch uitsluitend in dat openbaar lichaam.

      2 De bevoegdheid, bedoeld in het eerste lid, wordt verleend uitsluitend ten behoeve van tot de praktijk van de
      geneeskundige behorende personen en voor zover de artsenijbereidkunde uitsluitend wordt uitgeoefend in de tot zijn
      praktijk behorende apotheek.

      3 De in het eerste lid bedoelde bevoegdheid kan alleen worden verleend, indien zich in het betrokken openbaar
      lichaam geen apotheek bevindt op een afstand van minder dan drie kilometer van de plaats van vestiging van de
      geneeskundige.

      4 Een volgens het eerste lid verleende bevoegdheid is slechts geldig tot een jaar na de vestiging van een
      apotheek in het betrokken gebied op een afstand van minder dan vijf kilometer van de plaats van vestiging van de
      geneeskundige.

      5 Onze Minister kan de bevoegdheid tot het uitoefenen van de artsenijbereidkunde eveneens verlenen aan officieren
      van gezondheid, ten behoeve van de tot hun geneeskundige praktijk behorende militairen en hun gezinnen, en voor
      zover zij de artsenijbereidkunde uitsluitend uitoefenen, in een militaire apotheek.

      6 [Artikel 26a][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028486#Artikel26a
    url: https://wetten.overheid.nl/BWBR0028486/2025-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0028486
        artikel: 26a
        hoofdstuk: VI
  - number: '36'
    text: |-
      1 De in [artikel 35][ref1] bedoelde geneeskundigen stellen geen geneesmiddelen ter hand dan na in een daartoe
      bestemd register aantekening te hebben gehouden van de naam of samenstelling van het geneesmiddel, met vermelding
      van de dag waarop en van. de persoon ten behoeve van wie de aflevering is gedaan.

      2 Zij bewaren het in het vorige lid bedoelde register gedurende tenminste vijf jaren. Wanneer zij de in
      [artikel 35][ref2] bedoelde bevoegdheid niet langer bezitten, dragen zij dit register over aan de Inspecteur.

      3 Overigens zijn op hen de bij of krachtens deze wet voor apothekers geldende bepalingen, voor zover deze voor hen
      geen uitdrukkelijke afwijking inhouden, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028486#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0028486#Artikel35
    url: https://wetten.overheid.nl/BWBR0028486/2025-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0028486
        artikel: '35'
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0028486
        artikel: '35'
        hoofdstuk: VII
  - number: '37'
    text: |-
      1 De in [artikel 35][ref1] bedoelde geneeskundigen moeten, behalve nauwkeurige maten, gewichten en balansen,
      de geneesmiddelen en giftige zelfstandigheden, vermeld op een voor hen bij algemene maatregel van bestuur,
      vastgestelde lijst, voorradig houden, zomede een exemplaar van de laatste uitgave van de Nederlandse Farmacopee.

      2 De in het vorige lid bedoelde algemene maategel van bestuur houdt tevens voorschriften in betreffende de wijze
      van bewaring der geneesmiddelen en giftige zelfstandigheden.

      3 Overigens mogen in de apotheek van een geneeskundige slechts aanwezig zijn:

      a. geneesmiddelen waarvan de aanwezigheid niet verplicht is;

      b. goederen welke bij de verpleging van zieken, de leniging van gebreken, de voorkoming van ziekten en het stellen
      van een diagnose toepassing kunnen vinden;

      c. stoffen, werktuigen en verdere benodigdheden welke voor wetenschappelijke onderzoekingen nodig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0028486#Artikel35
    url: https://wetten.overheid.nl/BWBR0028486/2025-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0028486
        artikel: '35'
        hoofdstuk: VII
  - number: '38'
    text: |-
      De in [artikel 35][ref1] bedoelde geneeskundigen kunnen zich doen bijstaan door een of meer apothekers-assistenten.
      [Artikel 25][ref2] is alsdan van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028486#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0028486#Artikel25
    url: https://wetten.overheid.nl/BWBR0028486/2025-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0028486
        artikel: '35'
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0028486
        artikel: '25'
        hoofdstuk: V
  - number: '39'
    text: |-
      Indien de praktijk van een geneeskundige, aan wie de bevoegdheid tot uitoefening van de artsenijbereidkunde
      ingevolge [artikel 35][ref1] is verleend, door een andere geneeskundige wordt waargenomen, gaan tijdens de
      waarneming de bevoegdheden en verplichtingen, welke de eerstgenoemde geneeskundige ingevolge deze wet heeft, over
      op degene die zijn praktijk waarneemt.


      [ref1]: https://wetten.overheid.nl/BWBR0028486#Artikel35
    url: https://wetten.overheid.nl/BWBR0028486/2025-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0028486
        artikel: '35'
        hoofdstuk: VII
  - number: '40'
    text: |-
      De geneeskundige, die zich als zodanig voor de dienst op een van de openbare lichamen Bonaire, Sint Eustatius
      of Saba thuis behorend schip heeft verbonden, is aan boord van dat schip bevoegd tot de uitoefening van de
      artsenijbereidkunde ten behoeve van de opvarenden.
    url: https://wetten.overheid.nl/BWBR0028486/2025-01-01#Artikel40
  - number: '41'
    text: |-
      1 De reder van een schip waarop zich een geneeskundige voor de dienst heeft verbonden, is verplicht er zorg voor
      te dragen dat tijdig voor iedere reis de zelfstandigheden, werktuigen en verdere benodigdheden, vermeld op een door
      de geneeskundige opgemaakte en door hem ondertekende lijst, in deugdelijke staat en in voldoende hoeveelheid aan
      boord van het schip aanwezig zijn in een daartoe geschikte ruimte, alsmede dat de geneeskundige de ingevolge bij of
      krachtens deze wet op hem rustende verplichtingen kan nakomen.

      2 Indien de Inspecteur van tekortkomingen in de verplichtingen van de reder, in het eerste lid bedoeld, niet is
      gebleken, geeft de Inspecteur van een en ander een schriftelijke verklaring af, welke bij vertrek van het schip
      door de kapitein aan de bevoegde ambtenaren van de Scheepvaart-inspectie moet worden getoond.

      3 Op de in het eerste lid bedoelde lijst mogen de door Onze Minister aan te wijzen zelfstandigheden niet ontbreken.
    url: https://wetten.overheid.nl/BWBR0028486/2025-01-01#Artikel41
  - number: '42'
    text: |-
      1 De kapitein maakt, telkens wanneer hij van oordeel is dat de geneeskundige een der bij of krachtens deze wet
      vastgestelde bepalingen heeft overtreden, daarvan melding in het scheepsdagboek.

      2 Hij zendt een afschrift van zijn hierop betrekking hebbende aantekeningen, bij aankomst ter plaatse van
      bestemming hier te lande, aan de Inspecteur.
    url: https://wetten.overheid.nl/BWBR0028486/2025-01-01#Artikel42
  - number: '43'
    text: |-
      1 Aan het bestuur van een ziekenhuis kan, op een daartoe tot de Inspecteur gericht verzoek, door de Inspecteur, al
      of niet onder door hem te bepalen voorwaarden, vergunning worden verleend tot het in voorraad hebben en verstrekken
      van geneesmiddelen. Daarnaast kan een vergunning door de Inspecteur, al dan niet onder het stellen van voorwaarden,
      worden verleend tot het bereiden van geneesmiddelen, mits zulks geschiedt onder toezicht van een apotheker.

      2 Het bepaalde in het eerste lid, eerste volzin is van overeenkomstige toepassing met betrekking tot poliklinieken
      van ondernemingen.

      3 Voor een vergunning als bedoeld in het eerste lid, eerste volzin, wordt jaarlijks een vergoeding geheven
      overeenkomstig regelen bij algemene maatregel van bestuur, vast te stellen.
    url: https://wetten.overheid.nl/BWBR0028486/2025-01-01#Artikel43
  - number: '44'
    text: |-
      1 Onze Minister kan als verplichting voorschrijven dat de geneesmiddelenvoorziening van ieder ziekenhuis, dat
      een door hem te bepalen, grootte te boven gaat, zal plaats vinden door een apotheker, die de artsenijbereidkunde
      uitsluitend uitoefent ten behoeve van de verpleegden van dat ziekenhuis in een daartoe door Onze Minister
      goedgekeurde in het ziekenhuis onder gebrachte apotheek.

      2 Onze Minister kan voor een bepaald ziekenhuis, al dan niet onder het stellen van voorwaarden, ontheffing verlenen
      van de verplichting, in het eerste lid bedoeld. Bij die ontheffing kan tevens worden afgeweken van de bepaling
      van [artikel 12][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028486#Artikel12
    url: https://wetten.overheid.nl/BWBR0028486/2025-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0028486
        artikel: '12'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '45'
    text: |-
      1 Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn belast de ambtenaren van de
      inspectie, alsmede de bij ministeriële regeling aangewezen personen. Een zodanige aanwijzing wordt bekendgemaakt in
      de Staatscourant.

      2 De krachtens het eerste lid bevoegde personen zijn, uitsluitend voor zover dat voor de vervulling van hun taak
      redelijkerwijze noodzakelijk is, bevoegd:

      a. alle inlichtingen te vragen;

      b. inzage te verlangen van alle boeken, bescheiden en andere informatiedragers en daarvan afschrift te nemen of
      deze daartoe tijdelijk mee te nemen;

      c. goederen aan opneming en onderzoek te onderwerpen, deze daartoe tijdelijk mee te nemen en daarvan monsters te
      nemen;

      d. alle plaatsen, met uitzondering van woningen zonder de uitdrukkelijke toestemming van de bewoner, te betreden,
      vergezeld van door hen bevoegde personen;

      e. vaartuigen, stilstaande voertuigen en de lading daarvan te onderzoeken;

      f. tot voorlopige inbeslagneming van geneesmiddelen die onderwerp van overtreding van een of meer voorschriften van
      deze wet zijn.

      3 Zo nodig, wordt de toegang tot een plaats als bedoeld in het tweede lid, onderdeel d, verschaft met behulp van de
      sterke arm.

      4 Na een voorlopige inbeslagneming als bedoeld in het tweede lid, onderdeel f, wordt onverwijld het bevoegd gezag
      ingeschakeld.

      5 Bij algemene maatregel van bestuur, kunnen regels worden gesteld met betrekking tot de wijze van taakuitoefening
      van de krachtens het eerste lid aangewezen personen.

      6 Een ieder is verplicht aan de krachtens het eerste lid aangewezen personen alle medewerking te verlenen die op
      grond van het tweede lid wordt gevorderd.
    url: https://wetten.overheid.nl/BWBR0028486/2025-01-01#Artikel45
  - number: '46'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028486/2025-01-01#Artikel46
  - number: '47'
    text: |-
      Indien aan de in [artikel 45, eerste lid][ref1], bedoelde personen blijkt dat niet is of wordt voldaan aan het
      bij of krachtens deze wet bepaalde, doen zij daarvan mededeling aan de betrokkene en stellen zij, onverminderd
      de bevoegdheid tot voorlopige inbeslagneming als bedoeld in artikel 45, tweede lid, onderdeel f, een termijn
      waarbinnen daaraan alsnog moet zijn voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028486#Artikel45
    url: https://wetten.overheid.nl/BWBR0028486/2025-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0028486
        artikel: '45'
        hoofdstuk: X
  - number: '48'
    text: |-
      1 De Inspecteur is bevoegd apothekers en krachtens [artikel 35][ref1] tot uitoefening van de artsenijbereidkunde
      bevoegde geneeskundigen aanwijzingen te geven ter verbetering van de inrichting en de toestand van de apotheek en
      van de wijze waarop daarin de artsenijbereidkunde wordt uitgeoefend.

      2 De Inspecteur geeft de in het eerste lid bedoelde aanwijzingen schriftelijk, waarbij hij een termijn bepaalt,
      binnen welke aan de aanwijzing gevolg moet zijn gegeven.

      3 Indien tegen de aanwijzing, bedoeld in het tweede lid, beroep wordt ingesteld, schorst het beroep de aanwijzing.


      [ref1]: https://wetten.overheid.nl/BWBR0028486#Artikel35
    url: https://wetten.overheid.nl/BWBR0028486/2025-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0028486
        artikel: '35'
        hoofdstuk: VII
  - number: 48a
    text: |-
      Het bepaalde in de [artikelen 14][ref1], [15][ref2], [47][ref3] en [48][ref4] is van overeenkomstige toepassing ten
      aanzien van de eigenaar van een apotheek.


      [ref1]: https://wetten.overheid.nl/BWBR0028486#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0028486#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0028486#Artikel47
      [ref4]: https://wetten.overheid.nl/BWBR0028486#Artikel48
    url: https://wetten.overheid.nl/BWBR0028486/2025-01-01#Artikel48a
