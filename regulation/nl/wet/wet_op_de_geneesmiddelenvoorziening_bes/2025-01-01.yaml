  - number: '2'
    text: |-
      1 Onze Minister wijst zelfstandigheden aan, welke zowel als geneesmiddel als voor ander dan geneeskundig doel
      plegen te worden gebruikt en die onder de voorwaarden, die Onze Minister stelt, niet worden geacht te zijn
      geneesmiddel.

      2 Onze Minister wijst geneesmiddelen aan, welke anderen dan de in het [eerste lid van artikel 3][ref1] bedoelde
      personen ter aflevering in voorraad mogen hebben, mogen afleveren en mogen terhandstellen.

      3 Indien andere dan de in het [eerste lid van artikel 3][ref2] bedoelde personen geneesmiddelen, aangewezen
      krachtens de vorige leden, ter aflevering in voorraad hebben of afleveren, worden zij niet geacht de
      artsenijbereidkunde uit te oefenen.

      4 Het afleveren van geneesmiddelen op recept wordt steeds geacht te zijn uitoefening van de artsenijbereidkunde.

      5 Aan geneeskundigen, tandheelkundigen, verloskundigen, mondhygiënisten of optometristen worden geneesmiddelen
      slechts ter hand gesteld na ontvangst van een daartoe strekkend schriftelijk verzoek. Het verzoek vermeldt de naam,
      het adres en de hoedanigheid van de verzoeker alsmede de naam en de hoeveelheid van het geneesmiddel.


      [ref1]: https://wetten.overheid.nl/BWBR0028486#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0028486#Artikel3
    url: https://wetten.overheid.nl/BWBR0028486/2025-01-01#Artikel2
