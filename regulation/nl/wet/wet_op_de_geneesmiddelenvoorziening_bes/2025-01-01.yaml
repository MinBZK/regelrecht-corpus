  - number: '3'
    text: |-
      1 Tot uitoefening der artsenijbereidkunde zijn bevoegd:

      a. apothekers

      b. geneeskundigen, voor zoveel hun dat is toegestaan krachtens [artikel 35][ref1];

      c. apothekers-assistenten, gedurende de uitoefening hunner werkzaamheden in een apotheek, mits onder toezicht van
      een apotheker of van een geneeskundige als bedoeld in [artikel 35][ref2].

      d. andere personen, rechtspersonen daaronder begrepen, aan wie daartoe door Onze Minister vergunning is verleend.
      Onze Minister kan aan de vergunning voorwaarden verbinden, de vergunning weigeren of deze intrekken, indien het
      belang der volksgezondheid zulks vordert. De vergunning of intrekking is met redenen omkleed. De vergunning strekt
      bereiden, invoeren, in voorraad hebben, verkopen, afleveren, of verhandelen, dan wel een combinatie van deze in
      het groot van geneesmiddelen. Onder afleveren in het groot wordt mede verstaan het uitvoeren en doorvoeren van
      geneesmiddelen. De vergunninghouder mag niet over de toonbank verkopen nog open winkel houden.

      2 Onze Minister kan aan personen, die niet bevoegd zijn tot uitoefening van de artsenijbereidkunde, vergunning
      verlenen tot het in voorraad hebben, afleveren, terhandstellen dan wel een combinatie van het in voorraad hebben,
      afleveren of terhandstellen van bepaalde bij die vergunning aan te wijzen verpakte geneesmiddelen. Onze Minister
      kan aan de vergunning voorwaarden verbinden, de vergunning weigeren of deze intrekken, indien het belang van de
      volksgezondheid zulks vordert.

      3 Aan personen, die niet bevoegd zijn tot uitoefening van artsenijbereidkunde, is het bereiden, het in voorraad
      hebben, het afleveren of terhandstellen van geneesmiddelen verboden, met uitzondering van het in voorraad hebben,
      afleveren of terhandstellen van de zelfstandigheden aangewezen krachtens het eerste of van de geneesmiddelen
      aangewezen krachtens het [tweede lid van artikel 2][ref3] en het in voorraad hebben, afleveren of terhandstellen
      van verpakte geneesmiddelen krachtens een vergunning als bedoeld in het tweede lid.

      4 [vervallen]


