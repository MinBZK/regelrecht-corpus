  - number: '22'
    text: |-
      1 De apotheker levert geen giftige zelfstandigheden af dan op voorschrift van een geneeskundige, tandheelkundige
      of vroedvrouw of aan apothekers aan geneeskundigen als in [artikel 35][ref1] bedoeld, of op schriftelijke en
      ondertekende aanvraag, met opgave van het doel waartoe de giftige zelfstandigheden dienen moeten, aan andere, doch
      bij hem bekende personen.

      2 De giftige zelfstandigheid, niet door een geneeskundige, tandheelkundige of vroedvrouw voorgeschreven, wordt
      afgeleverd in een verzegeld voorwerp, waarop nevens de naam, het woord «vergift» duidelijk staat aangegeven.

      3 Dit artikel is niet van toepassing op giftige zelfstandigheden, welke in het algemeen ook buiten de apotheek in
      de handel verkrijgbaar zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0028486#Artikel35
    url: https://wetten.overheid.nl/BWBR0028486/2025-01-01#Artikel22
