preamble:
  text: |-
    Wij WILLEM III, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, Groot-Hertog van Luxemburg,
    enz., enz., enz.

    Allen die deze zullen zien of hooren lezen, salut! doen te weten:

    Alzoo Wij in overweging genomen hebben, dat ter uitvoering van artikel 95 der Grondwet, het recht van onderzoek
    (enquête) van de Kamers der Staten-Generaal moet geregeld worden door de wet;

    Zoo is het, dat Wij, den Raad van State gehoord en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0001841/2004-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Elk der Kamers of de verenigde vergadering der Staten-Generaal kan op voorstel van een of meer van haar leden of
      van een door haar ingestelde commissie besluiten een onderzoek in te stellen.

      2 De uitvoering van dit besluit wordt opgedragen aan hetzij een reeds door de betreffende Kamer of door de
      verenigde vergadering ingestelde commissie, hetzij aan een daartoe in te stellen commissie.

      3 Het besluit bevat een omschrijving van het onderwerp waarop het onderzoek betrekking zal hebben. Deze
      omschrijving kan hangende het onderzoek al dan niet op verzoek van de commissie die het onderzoek verricht, door de
      Kamer of de verenigde vergadering worden gewijzigd.

      4 Elk der Kamers of de verenigde vergadering der Staten-Generaal bepaalt de wijze waarop het aantal leden en
      plaatsvervangende leden van de commissie waaraan een onderzoek wordt opgedragen wordt vastgesteld alsmede de wijze
      waarop zij worden benoemd en ontslagen.

      5 Een commissie van onderzoek kan geen der bevoegdheden, haar bij deze wet verleend, uitoefenen, indien niet ten
      minste drie harer leden of als zodanig optredende plaatsvervangende leden tegenwoordig zijn.
    url: https://wetten.overheid.nl/BWBR0001841/2004-07-01#Artikel1
  - number: '2'
    text: |-
      1 Het besluit tot het instellen van een onderzoek wordt in de *Staatscourant* geplaatst. Daarbij wordt vermeld aan
      welke commissie het onderzoek is opgedragen.

      2 Van wijzigingen in de omschrijving van het onderwerp van onderzoek en van beëindiging van het onderzoek wordt op
      gelijke wijze kennis gegeven.
    url: https://wetten.overheid.nl/BWBR0001841/2004-07-01#Artikel2
  - number: '3'
    text: |-
      1 Vanaf het tijdstip van de eerste bekendmaking zijn alle Nederlanders, alle ingezetenen en andere binnen het
      grondgebied van het Rijk verblijfhoudende personen, benevens alle binnen het grondgebied van het Rijk gevestigde
      rechtspersonen verplicht te voldoen aan de vordering van de commissie tot het verschaffen van inzage in, het nemen
      van afschrift van of het anderszins laten kennisnemen van alle bescheiden waarover zij beschikken en waarvan naar
      het redelijk oordeel van de commissie inzage, afschrift of kennisneming anderszins voor de vervulling van haar taak
      nodig is.

      2 De in het eerste lid genoemde personen zijn voorts vanaf het tijdstip van de eerste bekendmaking verplicht te
      voldoen aan een oproeping door de commissie uitgevaardigd om als getuige of deskundige te worden verhoord.

      3 Alle ambtenaren zijn vanaf het tijdstip van de eerste bekendmaking gehouden om, in overeenstemming met de
      bepalingen van deze wet, gevolg te geven aan de vorderingen van de commissie die deze tot uitvoering van haar taak
      nodig oordeelt.
    url: https://wetten.overheid.nl/BWBR0001841/2004-07-01#Artikel3
  - number: '4'
    text: |-
      De getuigen en deskundigen verschijnen voor de commissie van onderzoek, hetzij vrijwillig op een schriftelijke
      oproeping, hetzij ingevolge dagvaarding.
    url: https://wetten.overheid.nl/BWBR0001841/2004-07-01#Artikel4
  - number: 4a
    text: Een getuige of deskundige die door de commissie wordt verhoord kan niet tevens zijn lid van de commissie.
    url: https://wetten.overheid.nl/BWBR0001841/2004-07-01#Artikel4a
  - number: '5'
    text: |-
      1 Dagvaarding van getuigen of deskundigen geschiedt door de deurwaarders bij de verschillende rechterlijke
      colleges, hetzij op rechtstreekse last der commissie, hetzij, ten gevolge van haar vordering, op last der
      ambtenaren van het openbaar ministerie.

      2 Onder dagvaarding wordt in deze wet mede begrepen voor wat betreft personen, die geen bekende woon- of
      verblijfplaats binnen het Rijk hebben, een oproeping op last der commissie op door haar te bepalen wijze.
    url: https://wetten.overheid.nl/BWBR0001841/2004-07-01#Artikel5
  - number: '6'
    text: |-
      De getuigen of deskundigen worden in persoon of te hunner woonplaats gedagvaardigd, ten minste drie dagen voor de
      dag van het verhoor.
    url: https://wetten.overheid.nl/BWBR0001841/2004-07-01#Artikel6
  - number: '7'
    text: |-
      1 De verhoren van getuigen en deskundigen worden door de commissie gehouden op de plaats, waar zij zulks het meest
      wenselijk oordeelt.

      2 De schriftelijke aantekening der afgelegde verklaringen of gegeven berichten wordt aan de getuigen of deskundigen
      voorgelezen of ter inzage verstrekt en door dezen ondertekend.
    url: https://wetten.overheid.nl/BWBR0001841/2004-07-01#Artikel7
  - number: '8'
    text: |-
      1 De commissie kan besluiten dat getuigen, mits zij de leeftijd van zestien jaren hebben bereikt, niet worden
      verhoord dan na het afleggen van de eed of belofte.

      2 Zij leggen in dat geval in handen van de voorzitter van de commissie de eed of belofte af dat zij de gehele
      waarheid en niets dan de waarheid zullen zeggen.

      3 De deskundige is verplicht zijn taak onpartijdig en naar beste weten te verrichten.
    url: https://wetten.overheid.nl/BWBR0001841/2004-07-01#Artikel8
  - number: 8a
    text: |-
      1 Een getuige is gerechtigd zich tijdens het verhoor te laten bijstaan.

      2 Om gewichtige redenen kan de commissie besluiten, dat een getuige zonder bijstand wordt verhoord.
    url: https://wetten.overheid.nl/BWBR0001841/2004-07-01#Artikel8a
  - number: '9'
    text: |-
      1 Indien de behoorlijk gedagvaarde getuige of deskundige niet verschijnt, wordt daarvan een proces-verbaal
      opgemaakt, hetwelk een nauwkeurige omschrijving der akte van dagvaarding behelst en door de aanwezige leden der
      commissie wordt ondertekend.

      2 Dit proces-verbaal wordt door de commissie, wanneer zij het nodig oordeelt, in handen gesteld van het openbaar
      ministerie bij de rechtbank van het arrondissement, waarin de in gebreke gebleven getuige of deskundige woont.
    url: https://wetten.overheid.nl/BWBR0001841/2004-07-01#Artikel9
  - number: '10'
    text: |-
      1 De vervolging van hem die weigert gevolg te geven aan een vordering ingevolge [artikel 3, eerste lid][ref1], en
      van de nalatige getuige of deskundige staat ter kennisneming van de burgerlijke rechter en wordt, zowel in eerste
      aanleg als in hoger beroep, ter terechtzitting voor burgerlijke zaken behandeld, op de wijze bij de wet voor
      strafzaken ter kennisneming van de rechtbank voorgeschreven.

      2 De bepalingen van de eerste titel van het [vijfde Boek van het Wetboek van Strafvordering](onbekend) zijn van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001841#Artikel3
    url: https://wetten.overheid.nl/BWBR0001841/2004-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001841
        artikel: '3'
  - number: '11'
    text: |-
      Het proces-verbaal van niet-verschijning, door de commissie, opgemaakt, levert, behoudens tegenbewijs, een volledig
      bewijs op van hetgeen daarin vermeld staat.
    url: https://wetten.overheid.nl/BWBR0001841/2004-07-01#Artikel11
  - number: '12'
    text: |-
      De Nederlandse strafwet is toepasselijk op ieder die niet voldoet aan de verplichting in [artikel 3][ref1]
      omschreven, ook indien het feit buiten Nederland is begaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001841#Artikel3
    url: https://wetten.overheid.nl/BWBR0001841/2004-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0001841
        artikel: '3'
  - number: '13'
    text: |-
      Onverminderd de vervolging wegens de eerste niet-verschijning, kan de commissie een nadere dagvaarding van dezelfde
      getuige of deskundige bevelen, en zelfs door tussenkomst van de officier bij de betrokken rechtbank een bevel
      van medebrenging van de rechter-commissaris in het arrondissement waarin de getuige of deskundige woont, of zich
      werkelijk bevindt, doen requireren, om bij de dagvaarding te worden gevoegd.
    url: https://wetten.overheid.nl/BWBR0001841/2004-07-01#Artikel13
  - number: '14'
    text: |-
      Bij herhaalde niet-verschijning zijn de [artikelen 9][ref1], [10][ref2], [11][ref3] en [12][ref4] dezer wet mede
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001841#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0001841#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0001841#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0001841#Artikel12
    url: https://wetten.overheid.nl/BWBR0001841/2004-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0001841
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0001841
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0001841
        artikel: '11'
      - id: ref4
        bwb_id: BWBR0001841
        artikel: '12'
  - number: '15'
    text: |-
      1 Van een weigering gevolg te geven aan een vordering van de commissie ingevolge [artikel 3, eerste lid][ref1],
      wordt proces-verbaal opgemaakt, hetwelk de redenen van de weigering, zo die gegeven zijn, inhoudt, en door de leden
      van de commissie wordt ondertekend.

      2 Wanneer een getuige of deskundige, hetzij vrijwillig, hetzij op de nadere dagvaarding verschenen of uit kracht
      van het bevel tot medebrenging voor de commissie gebracht zijnde, weigert te antwoorden, of de eed of de belofte
      af te leggen, wordt daarvan proces-verbaal opgemaakt, hetwelk de redenen van die weigering, zo die gegeven zijn,
      inhoudt, en door de aanwezige leden van de commissie wordt ondertekend.

      3 De in het eerste en tweede lid bedoelde processen-verbaal bezitten de bewijskracht in [artikel 11][ref2]
      omschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0001841#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0001841#Artikel11
    url: https://wetten.overheid.nl/BWBR0001841/2004-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0001841
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0001841
        artikel: '11'
  - number: '16'
    text: |-
      1 De commissie stelt het proces-verbaal, bedoeld in [artikel 15, eerste lid][ref1], wanneer zij het nodig oordeelt,
      in handen van het openbaar ministerie bij de rechtbank van het arrondissement waarin zij het verschaffen van
      inzage, het nemen van afschrift of het anderszins kennisnemen heeft gevorderd.

      2 De commissie stelt het proces-verbaal, bedoeld in [artikel 15, tweede lid][ref2], wanneer zij het nodig oordeelt,
      in handen van het openbaar ministerie bij de rechtbank van het arrondissement waarin het verhoor was gelast.

      3 De vervolging geschiedt op de wijze bij [artikel 10][ref3] omschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0001841#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0001841#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0001841#Artikel10
    url: https://wetten.overheid.nl/BWBR0001841/2004-07-01#Artikel16
    references:
