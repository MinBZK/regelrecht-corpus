        bwb_id: BWBR0001841
        artikel: '10'
  - number: '17'
    text: |-
      1 De rechtbank van het arrondissement kan de gijzeling van de weigerachtige getuige of deskundige gelasten. Deze
      gijzeling wordt voor een tijdvak van zes maanden uitgesproken, doch houdt op wanneer de getuige of deskundige
      vroeger aan zijn verplichting mocht hebben voldaan.

      2 Op de vordering der commissie, gelast de voorzieningenrechter van de rechtbank de dadelijke gijzeling van de
      weigerachtige getuige of deskundige, die inmiddels tot aan de uitspraak van de voorzieningenrechter, op last
      der commissie, binnen het lokaal, waar zij vergadert, in bewaring kan worden gehouden; indien de weigerachtige
      getuige of deskundige, die op last van de commissie in bewaring wordt gehouden, om zijn invrijheidstelling
      verzoekt, wordt hij binnen vierentwintig uren door de voorzieningenrechter van de rechtbank gehoord; het door de
      voorzieningenrechter af te geven bevel vermeldt de gedane vordering, benoemt de deurwaarder met de overbrenging
      belast, en wijst de plaats der voorlopige gijzeling aan.

      3 Van de in-gijzeling-stelling wordt een akte opgemaakt, waarin het bevel tot gijzeling wordt aangehaald en waarvan
      onmiddellijk een afschrift aan de gegijzelde wordt overhandigd.

      4 Deze voorlopige gijzeling houdt op bij de voldoening aan de vroeger geweigerde verplichting, en vervalt van
      rechtswege, indien de bekrachtiging daarvan niet binnen acht dagen bij de rechter is gevraagd.

      5 De bij vonnis bevolen of bekrachtigde gijzeling is uitvoerbaar, niettegenstaande verzet of hoger beroep.
    url: https://wetten.overheid.nl/BWBR0001841/2004-07-01#Artikel17
  - number: '18'
    text: |-
      Niemand kan genoodzaakt worden aan de commissie geheimen te openbaren, voor zover daardoor onevenredige schade zou
      worden toegebracht aan het belang van de uitoefening van zijn beroep, danwel aan het belang van zijn onderneming of
      de onderneming waarbij hij werkzaam is of geweest is.
    url: https://wetten.overheid.nl/BWBR0001841/2004-07-01#Artikel18
  - number: 18a
    text: |-
      1 De getuigen en deskundigen worden in een openbare zitting van de commissie verhoord.

      2 De commissie kan echter om gewichtige redenen besluiten een verhoor of een gedeelte daarvan niet in het openbaar
      af te nemen.

      3 De leden en plaatsvervangende leden van de commissie bewaren geheimhouding omtrent hetgeen hun tijdens een
      besloten zitting ter kennis komt.

      4 De aantekening, bedoeld in artikel 7, van een verhoor of een gedeelte van een verhoor als bedoeld in het tweede
      lid, wordt ter inzage gelegd van de leden van de Kamer of de verenigde vergadering door wie de commissie is
      ingesteld. De leden bewaren omtrent de inhoud van zodanige aantekening geheimhouding.
    url: https://wetten.overheid.nl/BWBR0001841/2004-07-01#Artikel18a
  - number: 18b
    text: |-
      1 De commissie kan om gewichtige redenen in verband met de bescherming van de in [artikel 3, eerste lid][ref1],
      genoemde personen of van een belang, bedoeld in [artikel 18][ref2], besluiten aan haar overgelegde bescheiden of
      gedeelten daarvan niet openbaar te maken.

      2 De leden en plaatsvervangende leden van de commissie bewaren geheimhouding omtrent de inhoud van de bescheiden of
      gedeelten daarvan, die ingevolge een besluit, bedoeld in het eerste lid, niet openbaar worden gemaakt.

      3 Voor zover de in het tweede lid bedoelde bescheiden deel uitmaken van het onderzoeksverslag van de commissie,
      worden deze ter inzage of anderszins ter kennisneming gelegd van de leden van de Kamer of verenigde vergadering
      door welke de commissie is ingesteld. De leden bewaren omtrent de inhoud van de zodanige bescheiden geheimhouding.


      [ref1]: https://wetten.overheid.nl/BWBR0001841#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0001841#Artikel18
    url: https://wetten.overheid.nl/BWBR0001841/2004-07-01#Artikel18b
    references:
      - id: ref1
        bwb_id: BWBR0001841
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0001841
        artikel: '18'
  - number: '19'
    text: |-
      1 Zij die uit hoofde van hun ambt, beroep of betrekking tot geheimhouding verplicht zijn, kunnen zich verschonen
      getuigenis af te leggen, doch alleen en bij uitsluiting nopens hetgeen waarvan de wetenschap aan hen als zodanig
      is toevertrouwd.

      2 Zij kunnen inzage, afschrift of kennisneming anderszins weigeren van bescheiden of gedeelten daarvan tot welke
      hun plicht tot geheimhouding zich uitstrekt.
    url: https://wetten.overheid.nl/BWBR0001841/2004-07-01#Artikel19
  - number: '20'
    text: |-
      1 De gevoelens, door de leden van colleges bij de behandeling van zaken ter vergadering geuit, en de deswege plaats
      gehad hebbende beraadslagingen mogen, voor zover bij de wet een verplichting tot geheimhouding is opgelegd, nimmer
      een onderwerp van verhoor of ondervraging uitmaken. Met betrekking tot de behandeling van zaken ter vergadering van
      de ministerraad en de op grond daarvan plaatsgehad hebbende beraadslagingen mogen ministers en staatssecretarissen,
      gewezen ministers en staatssecretarissen, tenzij de ministerraad op een daartoe strekkend verzoek van de commissie
      ontheffing verleent van de geheimhoudingsplicht, slechts worden ondervraagd over in die raad gevallen beslissingen
      en de gronden waarp deze rusten.

      2 De verschoning van verplichte geheimhouding door burgerlijke ambtenaren of militairen of gewezen burgerlijke
      ambtenaren en militairen van alle rang ingebracht, moet evenzo worden aangenomen indien zij rust op het beweren dat
      de verlangde openbaarmaking wordt geoordeeld in strijd te zijn met het belang van de staat, of op de stellige last
      van hun meerderen dezelfde grond van verschoning aanduidende.

      3 In beide gevallen kan echter de Kamer of de verenigde vergadering der Staten-Generaal op het verslag van haar
      commissie verlangen, dat de gegrondheid van de ingebrachte verschoning door de minister, onder wie de betrokken
      ambtenaar of militair behoort of heeft behoord nader wordt bevestigd.

      4 Met betrekking tot gewezen ministers en staatssecretarissen geschiedt voor zaken, welke betrekking hebben op de
      tijd van hun ambtsvervulling, de bevestiging door de minister-president.
    url: https://wetten.overheid.nl/BWBR0001841/2004-07-01#Artikel20
  - number: '21'
    text: |-
      1 De minister bij wie of onder wiens ondergeschikte ambtenaren bescheiden voorhanden zijn, waarvan inzage of
      kennisneming anderszins door de commissie schriftelijk wordt verlangd, bewilligt in die inzage of kennisneming,
      tenzij hij mocht beoordelen dat zij met het belang van de staat in strijd zou kunnen zijn.

      2 Tenzij de ministerraad anders besluit, wordt evenwel van bescheiden, weergevende de behandeling van zaken ter
      vergadering van de ministerraad niet anders verstrekt dan een door de minister-president ondertekend uittreksel,
      vermeldende de in die raad gevallen beslissingen.
    url: https://wetten.overheid.nl/BWBR0001841/2004-07-01#Artikel21
  - number: '22'
    text: |-
      Bij de toepassing van de bepalingen, in de beide voorafgaande artikelen vervat, op leden van staatscolleges of
      andere ambtenaren, wier werkkring hen niet rechtstreeks onder enig ministerie rangschikt, zal de toestemming tot
      of weigering van inzage of kennisneming anderszins van bescheiden, of verklaring van strijdig staatsbelang, worden
      gegeven door de minister of ministers tot wier werkkring die behandelde zaken specifiek behoren.
    url: https://wetten.overheid.nl/BWBR0001841/2004-07-01#Artikel22
  - number: '23'
    text: |-
      1 Wanneer de commissie nodig acht buiten Nederland verblijfhoudende personen als getuigen of deskundigen te horen,
      kan zij van de vragen, waarop antwoord wordt verlangd, in geschrifte mededeling doen aan het betrokken ministerie,
      dat de voldoening daaraan bevordert.

      2 Indien de medegedeelde vragen door ambtenaren of militairen van alle rang moeten worden beantwoord en de minister
      van oordeel is, dat het belang van de Staat de beantwoording niet toelaat, wordt daarvan aan de commissie kennis
      gegeven.

      3 [Artikel 20, derde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001841#Artikel20
    url: https://wetten.overheid.nl/BWBR0001841/2004-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0001841
        artikel: '20'
  - number: '24'
    text: |-
      Behalve in het geval van [artikel 25][ref1], kunnen nimmer verklaringen voor een commissie, of op haar vordering
      afgelegd, als bewijs in rechte gelden, hetzij tegen degene door wie zij afgelegd zijn, hetzij tegen derden.


      [ref1]: https://wetten.overheid.nl/BWBR0001841#Artikel25
    url: https://wetten.overheid.nl/BWBR0001841/2004-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0001841
        artikel: '25'
  - number: '25'
    text: |-
      1 Getuigen, die in hun onder ede afgelegde verklaringen feiten hebben vervalst, of tegen de waarheid voorgedragen,
      worden gestraft met de straffen tegen valse getuigenis in burgerlijke zaken bij het [Wetboek van Strafrecht][ref1]
      bedreigd.

      2 Hij die schuldig is aan het omkopen van getuigen, wordt gestraft naar de voorschriften die in het
      [Wetboek van Strafrecht][ref2] over omkoping van getuigen zijn gegeven.

      3 Het proces-verbaal van gehouden getuigenverhoor bezit de bewijskracht als omschreven in [artikel 11][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001854
      [ref2]: https://wetten.overheid.nl/BWBR0001854
      [ref3]: https://wetten.overheid.nl/BWBR0001841#Artikel11
    url: https://wetten.overheid.nl/BWBR0001841/2004-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0001854
      - id: ref2
        bwb_id: BWBR0001854
      - id: ref3
        bwb_id: BWBR0001841
        artikel: '11'
  - number: '26'
    text: |-
      De getuigen en deskundigen ontvangen op hun daartoe strekkend verzoek schadeloosstelling, door de commissie op
      vertoon van de schriftelijke oproeping of de akte van dagvaarding, te begroten overeenkomstig het bepaalde omtrent
      getuigen en deskundigen krachtens [artikel 57 van de Wet tarieven in burgerlijke zaken][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001852#Artikel57
    url: https://wetten.overheid.nl/BWBR0001841/2004-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0001852
        artikel: '57'
  - number: '28'
    text: |-
      De bevoegdheid en de werkzaamheden van een commissie van onderzoek worden door de ontbinding van één of van beide
      Kamers der Staten-Generaal niet geschorst.
    url: https://wetten.overheid.nl/BWBR0001841/2004-07-01#Artikel28
  - number: '29'
    text: |-
      De Kamer of de verenigde vergadering der Staten-Generaal stelt een raming vast van de kosten, welke naar haar
      oordeel voor het onderzoek in een bepaald jaar vereist zijn. Zij brengt deze te Onzer kennis. Wij dienen vervolgens
      een voorstel van wet in tot verhoging van de rijksbegroting.
    url: https://wetten.overheid.nl/BWBR0001841/2004-07-01#Artikel29
  - number: 29a
    text: |-
      1 Na de beëindiging van het onderzoek van een door haar ingestelde commissie besluit de Kamer of de verenigde
      vergadering, dat de processen-verbaal en de overige bescheiden van het onderzoek worden vernietigd, dan wel
      gedurende een door haar te bepalen periode worden bewaard in het archief van de Kamer of in het Rijksarchief.

      2 Bescheiden en aantekeningen, die ingevolge een besluit van de commissie, genomen krachtens de haar bij
      [artikel 18][ref1] en 18*b* van deze wet verleende bevoegdheid, geheim dienen te worden gehouden, maken geen deel
      uit van dit archief.

      3 De commissie bepaalt waar de in het tweede lid bedoelde bescheiden worden bewaard en gedurende welke periode zij
      geheim zullen zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0001841#Artikel18a
    url: https://wetten.overheid.nl/BWBR0001841/2004-07-01#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0001841
        artikel: 18a
  - number: '30'
    text: Deze wet kan worden aangehaald als de Wet op de Parlementaire Enquête.
    url: https://wetten.overheid.nl/BWBR0001841/2004-07-01#Artikel30
