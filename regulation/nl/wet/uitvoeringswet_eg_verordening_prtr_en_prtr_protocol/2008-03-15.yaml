preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is ter uitvoering van verordening (EG) nr. 166/2006
    van het Europees Parlement en de Raad van de Europese Unie van 18 januari 2006 betreffende de instelling van
    een Europees register inzake de uitstoot en overbrenging van verontreinigende stoffen en tot wijziging van de
    Richtlijnen 91/689/EEG en 96/61/EG van de Raad (PbEU L 33) en van het op 21 mei 2003 te Kiev tot stand gekomen
    Protocol betreffende registers inzake de uitstoot en overbrenging van verontreinigende stoffen, met Bijlagen (Trb.
    2003, 153, en Trb. 2007, 95) de Wet milieubeheer en enkele andere wetten te wijzigen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0023429/2008-03-15#ArtikelAanhef
articles:
  - number: V
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0023429/2008-03-15#ArtikelV
  - number: VI
    text: 'Deze wet wordt aangehaald als: Uitvoeringswet EG-verordening PRTR en PRTR-protocol.'
    url: https://wetten.overheid.nl/BWBR0023429/2008-03-15#ArtikelVI
