preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Wet kenbaarheid publiekrechtelijke beperkingen
    onroerende zaken op onderdelen te wijzigen met het oog op een goede uitvoering van die wet, de inwerkingtreding
    ervan onder het geven van samenloopbepalingen bij wet te regelen en enkele andere wetten in verband met het
    voorgaande te wijzigen teneinde uit die wetten voortvloeiende registratieplichten te doen vervallen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0021607/2008-06-13#ArtikelAanhef
