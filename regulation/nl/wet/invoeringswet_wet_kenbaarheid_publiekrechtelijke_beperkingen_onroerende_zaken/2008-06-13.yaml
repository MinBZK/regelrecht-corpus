  - number: 13a
    text: |-
      Indien het bij koninklijke boodschap van 5 januari 2004 ingediende voorstel van
      __REF000___________________________________________________________________________________________________________
      ______________________ (29 392), tot wet is verheven en in werking is getreden op het
      tijdstip dat deze wet in werking treedt, zijn ten aanzien van een aanschrijving als bedoeld in
      [artikel V, onder a, van die wijzigingswet][ref2] de volgende artikelonderdelen van de [Woningwet][ref3], zoals
      deze luidde tot het tijdstip van inwerkingtreding van [die wijzigingswet][ref4], niet langer van kracht:

      a. [artikel 28, vijfde lid][ref5];

      b. [artikel 28, zesde lid][ref6], voorzover daarbij het vijfde lid van toepassing wordt verklaard.


