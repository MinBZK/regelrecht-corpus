preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om de positie van studenten die een beroepsopleiding
    volgen te versterken door het instellen van een mbo-studentenfonds, maatregelen te treffen voor zwangere studenten,
    mbo-instellingen te verplichten een mbo-verklaring af te geven als aan een student geen diploma of mbo-certificaat
    kan worden uitgereikt, maar de student wel een deel van de opleiding heeft gevolgd en de wettelijke benaming te
    wijzigen van studenten die een beroepsopleiding volgen van deelnemer naar student en voorts dat het wenselijk is om
    nadere vooropleidingseisen niet verplicht te stellen;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0043965/2021-08-01#ArtikelAanhef
articles:
  - number: XLVI
    text: |-
      Ten aanzien van de afwikkeling van de aanvragen voor een voorziening en beroep tegen een beslissing die op grond
      van de [Tijdelijke regeling voorziening leermiddelen voor deelnemers uit minimagezinnen][ref1] is genomen voor
      het tijdstip van inwerkingtreding van deze wet, is het recht zoals dat gold voorafgaand aan het tijdstip van
      inwerkingtreding van deze wet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0038600
    url: https://wetten.overheid.nl/BWBR0043965/2021-08-01#ArtikelXLVI
    references:
      - id: ref1
        bwb_id: BWBR0038600
  - number: XLVIa
    text: |-
      1 Indien ingevolge enig wettelijk voorschrift, anders dan het derde lid,

      a. over het ontwerp van een regeling of het voornemen tot het treffen van een regeling advies moet worden gevraagd
      of extern overleg moet worden gevoerd,

      b. van het ontwerp van een regeling kennis moet worden gegeven,

      c. een regeling niet eerder in werking kan treden dan nadat sedert haar vaststelling of bekendmaking een bepaalde
      termijn is verstreken,

      d. een regeling bij de wet moet worden goedgekeurd,

      e. door of namens een van de Kamers van de Staten-Generaal of een aantal leden daarvan kan worden verlangd dat het
      onderwerp of de inwerkingtreding van de regeling bij de wet wordt geregeld, of

      f. de voordracht voor een algemene maatregel van bestuur moeten worden gedaan door een andere minister dan Onze
      Minister van Onderwijs, Cultuur en Wetenschap, geldt dat voorschrift niet ten aanzien van het Aanpassingsbesluit
      Wet versterken positie mbo-studenten.

      2 Het eerste lid, onderdeel a, is niet van toepassing op het horen van de Raad van State.

      3 De voordracht voor het Aanpassingsbesluit Wet versterken positie mbo-studenten wordt niet eerder gedaan dan vier
      weken nadat het ontwerp aan beide Kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0043965/2021-08-01#ArtikelXLVIa
  - number: LXIV
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0043965/2021-08-01#ArtikelLXIV
