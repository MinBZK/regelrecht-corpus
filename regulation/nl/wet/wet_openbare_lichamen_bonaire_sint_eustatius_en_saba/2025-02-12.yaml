  - number: '152'
    text: De eilandsraad maakt de eilandsverordeningen die hij in het belang van het openbaar lichaam nodig oordeelt.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel152
  - number: '153'
    text: |-
      Indien het toezicht op de naleving of de opsporing van een overtreding van een voorschrift van een
      eilandsverordening, dat strekt tot handhaving van de openbare orde of veiligheid of tot bescherming van het leven
      of de gezondheid van personen vereist dat de met het toezicht op de naleving of de opsporing belaste personen
      bevoegd zijn binnen te treden in een woning zonder toestemming van de bewoner, kan de eilandsraad deze bevoegdheid
      bij eilandsverordening verlenen.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel153
  - number: '154'
    text: |-
      De eilandsraad stelt een eilandsverordening vast waarin regels worden gesteld met betrekking tot de wijze waarop
      ingezetenen en belanghebbenden bij de voorbereiding van het beleid van het openbaar lichaam worden betrokken.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel154
  - number: '155'
    text: |-
      1 De eilandsraad kan bij eilandsverordening de gezaghebber de bevoegdheid verlenen om bij verstoring van
      de openbare orde door de aanwezigheid van wapens, dan wel bij ernstige vrees voor het ontstaan daarvan,
      een gebied, met inbegrip van de daarin gelegen voor het publiek openstaande gebouwen en daarbij behorende
      erven, aan te wijzen als veiligheidsrisicogebied. In een veiligheidsrisicogebied kan de officier van
      justitie de bevoegdheden, bedoeld in de [artikelen 50, derde lid][ref1], [51, derde lid][ref2], en
      [52, derde lid, van de Wet wapens en munitie][ref3] toepassen. Voor de vaststelling van de eilandsverordening bij
      stemming is de volstrekte meerderheid van het aantal zitting hebbende leden vereist.

      2 De gezaghebber gaat niet over tot aanwijzing als veiligheidsrisicogebied dan na overleg met de officier van
      justitie.

      3 De aanwijzing als veiligheidsrisicogebied wordt gegeven voor een bepaalde duur die niet langer is en voor een
      gebied dat niet groter is dan strikt noodzakelijk voor de handhaving van de openbare orde.

      4 De beslissing tot gebiedsaanwijzing wordt op schrift gesteld en bevat een omschrijving van het gebied waarop
      deze van toepassing is alsmede de geldigheidsduur. Indien de situatie dermate spoedeisend is dat de gezaghebber de
      beslissing tot gebiedsaanwijzing niet tevoren op schrift kan stellen, zorgt hij alsnog zo spoedig mogelijk voor de
      opschriftstelling en voor de bekendmaking daarvan.

      5 De gezaghebber brengt de gebiedsaanwijzing zo spoedig mogelijk ter kennis van de eilandsraad en van de officier
      van justitie, bedoeld in het tweede lid.

      6 Zodra de verstoring van de openbare orde door de aanwezigheid van wapens, dan wel de ernstige vrees voor het
      ontstaan daarvan, bedoeld in het eerste lid, is geweken, trekt de gezaghebber de gebiedsaanwijzing in. Het vijfde
      lid is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0008804#Artikel51
      [ref3]: https://wetten.overheid.nl/BWBR0008804#Artikel52
