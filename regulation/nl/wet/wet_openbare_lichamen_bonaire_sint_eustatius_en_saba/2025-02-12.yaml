  - number: '35'
    text: |-
      1 De eilandsraad en elk van zijn leden hebben recht op ambtelijke bijstand.

      2 De in de eilandsraad vertegenwoordigde groeperingen hebben recht op ondersteuning.

      3 De eilandsraad stelt met betrekking tot de ambtelijke bijstand en de ondersteuning van de in de eilandsraad
      vertegenwoordigde groeperingen een eilandsverordening vast. De eilandsverordening bevat ten aanzien van de
      ondersteuning regels over de besteding en de verantwoording.

      4 De eilandsverordening behoeft de goedkeuring van de Rijksvertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel35
  - number: '36'
    text: |-
      1 De gezaghebber en de eilandgedeputeerden vormen te zamen het bestuurscollege.

      2 De gezaghebber is voorzitter van het bestuurscollege.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel36
  - number: '37'
    text: |-
      1 De eilandsraad benoemt de eilandgedeputeerden. [Artikel 32][ref1] is van toepassing op de stemming inzake de
      benoeming.

      2 De gezaghebber wordt geïnformeerd over de uitkomsten van de college-onderhandelingen. Hij wordt alsdan in de
      gelegenheid gesteld zijn opvattingen over voorstellen ten behoeve van het collegeprogramma kenbaar te maken.


