  - number: '123'
    text: |-
      1 Buiten hetgeen hun bij of krachtens de wet is toegekend, ontvangen de leden van de eilandsraad en de van een door
      de eilandsraad, het bestuurscollege of de gezaghebber ingestelde commissie, als zodanig geen andere vergoedingen en
      tegemoetkomingen ten laste van het openbaar lichaam.

      2 Voordelen ten laste van het openbaar lichaam, anders dan in de vorm van vergoedingen en tegemoetkomingen,
      genieten zij slechts voor zover dat is bepaald bij of krachtens de wet dan wel bij eilandsverordening van de
      eilandsraad. De eilandsverordening behoeft de goedkeuring van de Rijksvertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel123
  - number: '124'
    text: |-
      1 In ieder openbaar lichaam is een eilandsecretaris en een eilandgriffier.

      2 Een eilandsecretaris is niet tevens eilandgriffier.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel124
  - number: '125'
    text: |-
      [Artikel 16, eerste en tweede lid][ref1], is van overeenkomstige toepassing op de eilandsecretaris en de
      eilandgriffier.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel16
