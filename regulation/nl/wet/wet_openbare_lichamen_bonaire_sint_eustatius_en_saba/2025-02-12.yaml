        artikel: '38'
  - number: '187'
    text: |-
      1 Er is een Rijksvertegenwoordiger voor de openbare lichamen Bonaire, Sint Eustatius en Saba.

      2 De Rijksvertegenwoordiger heeft zijn zetel in een bij koninklijk besluit te bepalen openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel187
  - number: '188'
    text: |-
      1 De Rijksvertegenwoordiger wordt bij koninklijk besluit op voordracht van Onze Minister benoemd voor de tijd van
      zes jaar.

      2 De Rijksvertegenwoordiger kan bij koninklijk besluit op voordracht van Onze Minister worden herbenoemd voor de
      tijd van zes jaar.

      3 Alvorens Onze Minister een voordracht als bedoeld in het eerste en tweede lid doet, wint hij over de voor te
      dragen persoon het gevoelen in van de bestuurscolleges van de openbare lichamen.

      4 De rijksbelastingdienst verstrekt Onze Minister gegevens inzake bestuurlijke boeten als bedoeld in
      [hoofdstuk VIIIA van de Algemene wet inzake rijksbelastingen][ref1] en inzake strafbeschikkingen als bedoeld in
      [artikel 76 van die wet][ref2], voor zover deze boeten en beschikkingen zijn opgelegd dan wel hadden kunnen worden
      opgelegd ter zake van feiten die zijn gebleken na de termijn om deze op te leggen.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#HoofdstukVIIIA
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel76
