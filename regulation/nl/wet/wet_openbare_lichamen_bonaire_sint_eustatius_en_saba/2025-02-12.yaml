  - number: '157'
    text: |-
      1 De eilandsraad kan op overtreding van zijn eilandsverordeningen en van het bestuurscollege waaraan ingevolge
      [artikel 166][ref1] verordenende bevoegdheid is gedelegeerd, straf stellen maar geen andere of zwaardere dan
      hechtenis van ten hoogste drie maanden of geldboete van de tweede categorie, al dan niet met openbaarmaking van de
      rechterlijke uitspraak.

      2 Indien een krachtens het eerste lid strafbaar gestelde overtreding van voorschriften met betrekking
      tot het plaatsen of laten staan van motorrijtuigen op parkeerterreinen of weggedeelten, bedoeld in
      [artikel 56 van de Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba][ref2] wordt begaan door een
      bij de ontdekking van het feit onbekend gebleven bestuurder van een motorrijtuig, kunnen de op het feit gestelde
      straffen worden opgelegd aan de eigenaar of houder van dat motorrijtuig voor zover deze niet reeds naast de
      bestuurder voor dat feit aansprakelijk is.

      3 Het tweede lid geldt niet, indien de eigenaar of houder:

      a. de naam en het volledige adres van de bestuurder bekend heeft gemaakt;

      b. niet heeft kunnen vaststellen wie de bestuurder was en hem daarvan redelijkerwijs geen verwijt kan worden
      gemaakt.

      4 De strafbare feiten, bedoeld in het eerste lid, zijn overtredingen.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel166
      [ref2]: https://wetten.overheid.nl/BWBR0028151#Artikel56
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel157
