  - number: '108'
    text: |-
      Indien de eilandsraden een gezamenlijke ombudsman of een gezamenlijke ombudscommissie instellen met toepassing
      van de [Wet gemeenschappelijke regelingen][ref1], zijn de in die wet ten aanzien van gemeenschappelijke organen
      opgenomen bepalingen slechts van toepassing voor zover de aard van de aan de gezamenlijke ombudsman of de
      gezamenlijke ombudscommissie opgedragen taken zich daartegen niet verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0003740
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel108
