  - number: '31'
    text: |-
      1 Voor het tot stand komen van een beslissing bij stemming wordt de volstrekte meerderheid vereist van hen die een
      stem hebben uitgebracht.

      2 Bij een schriftelijke stemming wordt onder het uitbrengen van een stem verstaan het inleveren van een behoorlijk
      ingevuld stembriefje.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel31
  - number: '32'
    text: |-
      1 De stemming over personen voor het doen van benoemingen, voordrachten of aanbevelingen is geheim.

      2 Indien de stemmen staken over personen tot wie de keuze door een voordracht of bij een herstemming is beperkt,
      wordt in dezelfde vergadering een herstemming gehouden.

      3 Staken bij deze stemming de stemmen opnieuw, dan beslist terstond het lot.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel32
  - number: '33'
    text: |-
      1 De overige stemmingen geschieden bij hoofdelijke oproeping, indien de voorzitter of een van de leden dat
      verlangt. In dat geval geschieden zij mondeling.

      2 Bij hoofdelijke oproeping is ieder ter vergadering aanwezig lid dat zich niet van deelneming aan de stemming moet
      onthouden verplicht zijn stem voor of tegen uit te brengen.

      3 Indien over een voorstel geen stemming wordt gevraagd, is het aangenomen.

      4 Tenzij de vergadering voltallig is, wordt bij staking van stemmen het nemen van een beslissing uitgesteld tot een
      volgende vergadering, waarin de beraadslagingen kunnen worden heropend.

      5 Indien de stemmen staken in een voltallige vergadering of in een ingevolge het vierde lid opnieuw belegde
      vergadering, is het voorstel niet aangenomen.

      6 Onder een voltallige vergadering wordt verstaan een vergadering waarin alle leden waaruit de eilandsraad bestaat,
      voor zover zij zich niet van deelneming aan de stemming moesten onthouden, een stem hebben uitgebracht.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel33
  - number: '34'
    text: |-
      1 De stukken die van de eilandsraad uitgaan, worden door de gezaghebber ondertekend en door de eilandgriffier
      medeondertekend. Bij verhindering of ontstentenis van de gezaghebber worden de stukken die van de eilandsraad
      uitgaan ondertekend door degene die krachtens [artikel 90][ref1] de gezaghebber als voorzitter van de eilandsraad
      vervangt.

      2 De eilandsraad kan de gezaghebber toestaan de ondertekening op te dragen aan de eilandgriffier of aan een of meer
      andere bij de griffie werkzame ambtenaren. In dat geval blijft medeondertekening achterwege.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel90
