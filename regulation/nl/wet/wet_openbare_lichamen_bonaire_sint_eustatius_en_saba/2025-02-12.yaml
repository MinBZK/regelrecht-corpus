  - number: '118'
    text: |-
      1 De eilandsraad, het bestuurscollege of de gezaghebber kan andere commissies dan de commissies, bedoeld in
      [artikel 117, eerste lid][ref1], instellen.

      2 De gezaghebber en de eilandgedeputeerden zijn geen lid van een door de eilandsraad ingestelde andere commissie.
      Leden van de eilandsraad zijn geen lid van een door het bestuurscollege of de gezaghebber ingestelde commissie.

      3 De eilandsraad, het bestuurscollege onderscheidenlijk de gezaghebber regelt ten aanzien van een door hem
      ingestelde andere commissie de openbaarheid van de vergaderingen. [Artikel 24, vijfde en zesde lid][ref2], is
      van overeenkomstige toepassing op vergaderingen met gesloten deuren van een door de eilandsraad ingestelde andere
      commissie.

      4 [Artikel 19 van de Bekendmakingswet][ref3] is van overeenkomstige toepassing op een besluit tot instelling van
      een andere commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel117
      [ref2]: https://wetten.overheid.nl/BWBR0028142#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0004287#Artikel19
