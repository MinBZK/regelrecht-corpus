  - number: '149'
    text: |-
      1 Eilandsverordeningen worden door de eilandsraad vastgesteld voor zover de bevoegdheid daartoe niet bij de wet of
      door de eilandsraad krachtens de wet aan het bestuurscollege of de gezaghebber is toegekend.

      2 De overige bevoegdheden, bedoeld in [artikel 136, eerste lid][ref1], berusten bij de eilandsraad.

      3 De overige bevoegdheden, bedoeld in [artikel 136, tweede lid][ref2], berusten bij het bestuurscollege, voor zover
      deze niet bij of krachtens de wet aan de eilandsraad of de gezaghebber zijn toegekend.


