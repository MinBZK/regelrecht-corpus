  - number: '95'
    text: De eilandsraden stellen gezamenlijk bij eilandsverordening een gezamenlijke rekenkamer in.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel95
  - number: '96'
    text: |-
      1 De gezamenlijke rekenkamer bestaat uit drie leden.

      2 Elke eilandsraad benoemt één lid van de gezamenlijke rekenkamer voor de duur van zes jaar

      3 De eilandsraad kan voor het lid dat hij heeft benoemd een plaatsvervangend lid benoemen. Deze afdeling is op
      plaatsvervangende leden van overeenkomstige toepassing.

      4 De eilandsraad kan een lid herbenoemen.

      5 Voorafgaand aan de benoemingen, bedoeld in het tweede tot en met het vierde lid, pleegt de eilandsraad overleg
      met de gezamenlijke rekenkamer.

      6 Een lid van de gezamenlijke rekenkamer wordt door de eilandsraad die hem heeft benoemd, ontslagen:

      a. op eigen verzoek;

      b. bij de aanvaarding van een functie die onverenigbaar is met het lidmaatschap;

      c. indien hij bij onherroepelijk geworden rechterlijke uitspraak wegens misdrijf is veroordeeld, dan wel hem bij
      zulk een uitspraak een maatregel is opgelegd die vrijheidsbeneming tot gevolg heeft;

      d. indien hij bij onherroepelijk geworden rechterlijke uitspraak onder curatele is gesteld, in staat van
      faillissement is verklaard, surséance van betaling heeft verkregen of wegens schulden is gegijzeld.

      7 Een lid van de gezamenlijke rekenkamer kan door de eilandsraad die hem heeft benoemd, worden ontslagen:

      a. indien hij door ziekte of gebreken blijvend ongeschikt is zijn functie te vervullen;

      b. indien hij handelt in strijd met [artikel 101][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel101
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '101'
        hoofdstuk: III
        afdeling: V
  - number: '97'
    text: |-
      1 De eilandsraad stelt een door hem benoemd lid van de gezamenlijke rekenkamer op non-actief indien:

      a. hij zich in voorlopige hechtenis bevindt;

      b. hij bij een nog niet onherroepelijk geworden rechterlijke uitspraak wegens misdrijf is veroordeeld, dan wel hem
      bij zulk een uitspraak een maatregel is opgelegd die vrijheidsbeneming tot gevolg heeft;

      c. hij onder curatele is gesteld, in staat van faillissement is verklaard, surséance van betaling heeft verkregen
      of wegens schulden is gegijzeld ingevolge een nog niet onherroepelijk geworden rechterlijke uitspraak.

      2 De eilandsraad kan een door hem benoemd lid van de gezamenlijke rekenkamer op non-actief stellen, indien tegen
      dit lid een gerechtelijk onderzoek ter zake van een misdrijf wordt ingesteld of indien er een ander ernstig
      vermoeden is van het bestaan van feiten en omstandigheden die tot ontslag, anders dan op gronden, genoemd in
      [artikel 96, zesde lid, onderdeel a, en zevende lid, onderdeel a][ref1], zouden kunnen leiden.

      3 De eilandsraad beëindigt de non-activiteit zodra de grond voor de maatregel is vervallen, met dien verstande dat
      in een geval als bedoeld in het tweede lid de non-activiteit in ieder geval eindigt na zes maanden. In dat geval
      kan de eilandsraad de maatregel telkens voor ten hoogste drie maanden verlengen.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel96
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel97
