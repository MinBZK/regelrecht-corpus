    text: |-
      1 De gezaghebber is aan de eilandsraad verantwoording schuldig over het door hem gevoerde bestuur.

      2 Hij geeft de eilandsraad alle inlichtingen die de eilandsraad voor de uitoefening van zijn taak nodig heeft.

      3 Hij geeft de eilandsraad mondeling of schriftelijk de door een of meer leden gevraagde inlichtingen, tenzij het
      verstrekken ervan in strijd is met het openbaar belang.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel182
  - number: '183'
    text: |-
      1 De gezamenlijke rekenkamer onderzoekt de doelmatigheid, de doeltreffendheid en de rechtmatigheid van het door de
      eilandsbesturen gevoerde bestuur. Een door de gezamenlijke rekenkamer ingesteld onderzoek naar de rechtmatigheid
      van het door de eilandsbesturen gevoerde bestuur bevat geen controle van de jaarrekening als bedoeld in
      [artikel 38, derde lid, van de Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba][ref1].

      2 Op verzoek van een of meer eilandsraden kan de gezamenlijke rekenkamer een onderzoek instellen.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel38
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel183
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '38'
  - number: '184'
    text: |-
      1 De gezamenlijke rekenkamer is bevoegd alle documenten die berusten bij de eilandsbesturen te onderzoeken voor
      zover zij dat ter vervulling van haar taak nodig acht.

      2 Het eilandsbestuur verstrekt desgevraagd alle inlichtingen die de gezamenlijke rekenkamer ter vervulling van haar
      taak nodig acht.

      3 Indien de zorg voor een administratie aan een derde is uitbesteed, is het eerste lid van overeenkomstige
      toepassing op de administratie van de betrokken derde dan wel van degene die de administratie in opdracht van die
      derde voert.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel184
  - number: '185'
    text: |-
      1 De gezamenlijke rekenkamer heeft de in de volgende leden vermelde bevoegdheden ten aanzien van de volgende
      instellingen en over de volgende periode:

      a. samenwerkingslichamen en gemeenschappelijke organen ingesteld krachtens de
      [Wet gemeenschappelijke regelingen][ref1], waaraan de openbare lichamen deelnemen, over de jaren dat door de
      openbare lichamen aan de regeling wordt deelgenomen;

      b. naamloze vennootschappen en besloten vennootschappen met beperkte aansprakelijkheid waarvan een openbaar lichaam
      meer dan vijftig procent van het geplaatste aandelenkapitaal houdt, over de jaren dat het desbetreffende openbaar
      lichaam meer dan vijftig procent van het geplaatste aandelenkapitaal houdt;

      c. andere privaatrechtelijke rechtspersonen waaraan een openbaar lichaam of een derde voor rekening en risico van
      het openbaar lichaam rechtstreeks of middellijk een subsidie, lening of garantie heeft verstrekt ten bedrage van
      ten minste vijftig procent van de baten van deze instelling, over de jaren waarop deze subsidie, lening of garantie
      betrekking heeft.

      2 De gezamenlijke rekenkamer is bevoegd bij de betrokken instelling nadere inlichtingen in te winnen over de
      jaarrekeningen, daarop betrekking hebbende rapporten van hen die deze jaarrekeningen hebben gecontroleerd en
      overige documenten met betrekking tot die instelling die bij het eilandsbestuur berusten. Indien een of meer
      documenten ontbreken, kan de gezamenlijke rekenkamer van de betrokken instelling de overlegging daarvan vorderen.

      3 De gezamenlijke rekenkamer kan, indien de documenten, bedoeld in het tweede lid, daartoe aanleiding geven,
      bij de betrokken instelling dan wel bij de derde die de administratie in opdracht van de instelling voert, een
      onderzoek instellen, waaronder een onderzoek naar het gevoerde bestuur van de instelling, bedoeld in het eerste
      lid, onderdeel a. De gezamenlijke rekenkamer stelt de eilandsraad en het bestuurscollege van het betrokken openbare
      lichaam van haar voornemen een dergelijk onderzoek in te stellen in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0003740
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel185
    references:
      - id: ref1
        bwb_id: BWBR0003740
  - number: '186'
    text: |-
      1 De gezamenlijke rekenkamer legt haar bevindingen en haar oordeel vast in rapporten, met dien verstande dat hierin
      niet worden opgenomen gegevens en bevindingen die naar hun aard vertrouwelijk zijn.

      2 De gezamenlijke rekenkamer deelt aan de eilandsraad en het bestuurscollege van het betrokken openbaar lichaam en,
      indien van toepassing, aan de betrokken instelling, de opmerkingen en bedenkingen mee die zij naar aanleiding van
      haar bevindingen van belang acht. Aan de eilandsraad of het bestuurscollege kan zij ter zake voorstellen doen.

      3 De gezamenlijke rekenkamer stelt elk jaar voor 1 april een verslag op van haar werkzaamheden over het voorgaande
      jaar. Het verslag wordt door de gezamenlijke rekenkamer aan de eilandsraden en de bestuurscolleges van de openbare
      lichamen gezonden.

      4 De gezamenlijke rekenkamer zendt een afschrift van haar rapporten aan de eilandsraad
      en het bestuurscollege van het betrokken openbare lichaam. Indien zij met toepassing van
      [artikel 38, elfde lid, van de Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba][ref1] een
      onderzoek heeft ingesteld, zendt de gezamenlijke rekenkamer tevens een afschrift van het rapport aan de betrokken
      instelling.

      5 De rapporten en de verslagen van de gezamenlijke rekenkamer zijn openbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel38
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel186
