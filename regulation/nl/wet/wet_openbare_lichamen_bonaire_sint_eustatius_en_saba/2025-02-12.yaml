  - number: '70'
    text: |-
      1 Indien bij een stemming, anders dan over personen voor het doen van benoemingen, voordrachten of aanbevelingen,
      de stemmen staken, wordt opnieuw gestemd.

      2 Staken de stemmen andermaal over hetzelfde voorstel, dan beslist de stem van de voorzitter.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel70
  - number: '71'
    text: |-
      1 De stukken die van het bestuurscollege uitgaan, worden door de gezaghebber ondertekend en door de
      eilandsecretaris medeondertekend.

      2 Het bestuurscollege kan hem toestaan de ondertekening op te dragen aan een ander lid van het bestuurscollege, aan
      de eilandsecretaris of aan een of meer andere ambtenaren van het openbaar lichaam.

      3 De medeondertekening door de eilandsecretaris is niet van toepassing indien de ondertekening van stukken die
      van het bestuurscollege uitgaan ingevolge het tweede lid is opgedragen aan de eilandsecretaris of een of meer
      ambtenaren van het openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel71
  - number: '72'
    text: |-
      1 De eilandsraad kan regelen van welke beslissingen van het bestuurscollege aan de leden van de eilandsraad
      kennisgeving wordt gedaan. Daarbij kan de eilandsraad de gevallen bepalen waarin met terinzagelegging kan worden
      volstaan.

      2 Het bestuurscollege laat de kennisgeving of terinzagelegging achterwege voor zover deze in strijd is met het
      openbaar belang.

      3 Het bestuurscollege maakt de besluitenlijst van zijn vergaderingen terstond na de vaststelling daarvan openbaar
      op de in het openbaar lichaam gebruikelijke wijze. Het bestuurscollege laat de openbaarmaking achterwege in de
      gevallen waarin een verplichting tot geheimhouding geldt of wanneer openbaarmaking in strijd is met het openbaar
      belang.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel72
  - number: '73'
    text: |-
      1 De gezaghebber wordt bij koninklijk besluit op voordracht van Onze Minister benoemd en herbenoemd voor de tijd
      van zes jaar. Hij kan te allen tijde bij koninklijk besluit op voordracht van Onze Minister worden ontslagen.

      2 De Rijksvertegenwoordiger maakt voor elke door benoeming te vervullen plaats een met redenen omklede aanbeveling
      op. Alvorens zijn aanbeveling te doen verzoekt hij de eilandsraad, gehoord het bestuurscollege, zijn gevoelen
      kenbaar te maken met betrekking tot de aan de te benoemen gezaghebber te stellen eisen van bekwaamheid en
      geschiktheid.

      3 De eilandsraad kan uit zijn midden een vertrouwenscommissie instellen belast met de beoordeling van de op haar
      verzoek door de Rijksvertegenwoordiger daartoe geselecteerde kandidaten. De eilandsraad stelt het bestuurscollege
      in de gelegenheid een eilandgedeputeerde af te vaardigen die als adviseur aan de vertrouwenscommissie
      wordt toegevoegd. De vertrouwenscommissie brengt vertrouwelijk verslag uit van haar bevindingen aan de
      Rijksvertegenwoordiger.

      4 Onverminderd het bepaalde in het tweede en derde lid kunnen bij algemene maatregel van bestuur nadere regels
      worden gesteld omtrent de bij benoeming te volgen procedure.

      5 De beraadslagingen van de vertrouwenscommissie, bedoeld in het derde lid, vinden plaats met gesloten deuren. Van
      deze beraadslagingen wordt een afzonderlijk verslag gemaakt, dat niet openbaar is.

      6 Er geldt een geheimhoudingsplicht ten aanzien van:

      a. de aanbeveling van de Rijksvertegenwoordiger, bedoeld in het tweede lid;

      b. het verslag van de bevindingen van de vertrouwenscommissie, bedoeld in het derde lid;

      c. de beraadslagingen van de vertrouwenscommissie en het verslag van de beraadslagingen, bedoeld in het vijfde lid.

      7 De rijksbelastingdienst verstrekt Onze Minister de benodigde gegevens inzake bestuurlijke boeten als bedoeld in
      [hoofdstuk VIII, titel 4, van de Belastingwet BES][ref1] voor zover deze boeten zijn opgelegd dan wel hadden kunnen
      worden opgelegd ter zake van feiten die zijn gebleken na de termijn om deze op te leggen.

      8 De Rijksvertegenwoordiger doet een voorstel tot herbenoeming. Bij algemene maatregel van bestuur kunnen nadere
      regels worden gesteld over de wijze waarop de eilandsraad in verband daarmee zijn gevoelen omtrent het functioneren
      van de gezaghebber kenbaar kan maken aan de Rijksvertegenwoordiger.


      [ref1]: https://wetten.overheid.nl/BWBR0029244
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0029244
  - number: '74'
    text: |-
      1 De gezaghebber kan bij koninklijk besluit worden geschorst.

      2 Onze Minister kan, in afwachting van een besluit omtrent schorsing, bepalen dat de gezaghebber zijn functie niet
      uitoefent.

      3 Een besluit als bedoeld in het tweede lid vervalt, indien niet binnen een maand een besluit omtrent de schorsing
      is genomen.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel74
  - number: '75'
    text: Voor de benoembaarheid tot gezaghebber is het Nederlanderschap vereist.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel75
  - number: '76'
    text: Dezelfde persoon kan niet in meer dan een openbaar lichaam tot gezaghebber worden benoemd.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel76
  - number: '77'
    text: |-
      1 De gezaghebber legt ten overstaan van de eilandsraad in handen van de Rijksvertegenwoordiger de volgende eed
      (verklaring en belofte) af:

      «Ik zweer (verklaar) dat ik, om tot gezaghebber benoemd te worden, rechtstreeks noch middellijk, onder welke naam
      of welk voorwendsel ook, enige gift of gunst heb gegeven of beloofd.

      Ik zweer (verklaar en beloof) dat ik, om iets in dit ambt te doen of te laten, rechtstreeks noch middellijk enig
      geschenk of enige belofte heb aangenomen of zal aannemen.

      Ik zweer (beloof) dat ik getrouw zal zijn aan de [Grondwet][ref1], dat ik de wetten zal nakomen en dat ik mijn
      plichten als gezaghebber naar eer en geweten zal vervullen.

      Zo waarlijk helpe mij God Almachtig!»

      (Dat verklaar en beloof ik!»)

      2 In plaats van in het Nederlands kan de eed (verklaring en belofte) in het Papiaments of het Engels worden
      afgelegd.

      3 Wanneer de eed (verklaring en belofte) in het Papiaments wordt afgelegd, luidt de tekst van de eed (verklaring en
      belofte) als volgt:

      «Mi ta hura (deklará) ku pa mi nombramentu den e kargo o funshon di gezaghebber mi no a duna ni primintí, ni
      direkta- ni indirektamente, bou di ningun nòmber ni denominashon ni preteksto, ningun regalo ni fabor.

      Mi ta hura (deklará i primintí) ku mi no a risibí ni mi no a aseptá, ni lo mi no aseptá, ni direkta- ni
      indirektamente, ningun regalo ni ningun promesa di hasi algu o laga di hasi algu den e kargo o funshon en kuestion.

      Mi ta hura (primintí) ku lo mi ta fiel na Konstitushon, ku lo mi kumpli ku lei i ku lo mi kumpli ku mi
      obligashonnan komo gezaghebber segun mi konsenshi i honor.

      Ku Dios Todopoderoso yudami!»

      (Esei mi ta deklará i primintí!»)

      4 Wanneer de eed (verklaring en belofte) in het Engels wordt afgelegd, luidt de tekst van de eed (verklaring en
      belofte) als volgt:

      «I swear (affirm) that I neither gave nor promised any gift or favour, either directly or indirectly, under any
      name or pretext whatsoever, in order to be appointed Island Governor.

      I swear (affirm and promise) that I have made no gift or promise, and shall accept no gift or promise, either
      directly or indirectly, in order to do or to omit to do anything in the course of my duties.

      I swear (promise) that I will bear allegiance to the Constitution, that I will observe the laws and that I will
      perform my duties as Island Governor in good faith.

      So help me God Almighty!

      (This I affirm and promise!)


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: '78'
    text: |-
      1 De gezaghebber geniet ten laste van het openbaar lichaam een bezoldiging, die bij of krachtens algemene maatregel
      van bestuur wordt geregeld.

      2 Bij de algemene maatregel van bestuur, bedoeld in het eerste lid, kunnen tevens regels worden gesteld betreffende
      tegemoetkoming in of vergoeding van bijzondere kosten en betreffende andere voorzieningen die verband houden met de
      vervulling van het ambt van gezaghebber.

      3 Buiten hetgeen hem bij of krachtens de wet is toegekend, geniet de gezaghebber als zodanig geen inkomsten, in
      welke vorm ook, ten laste van het openbaar lichaam.

      4 De gezaghebber geniet geen vergoedingen, in welke vorm ook, voor werkzaamheden, verricht in nevenfuncties welke
      hij vervult uit hoofde van het ambt van gezaghebber, ongeacht of die vergoedingen ten laste van het openbaar
      lichaam komen of niet. Indien deze vergoedingen worden uitgekeerd, worden zij gestort in de kas van het openbaar
      lichaam.

      5 Tot vergoedingen als bedoeld in het vierde lid, behoren inkomsten, onder welke benaming ook, uit nevenfuncties
      die de gezaghebber neerlegt bij beëindiging van het ambt.

      6 Andere inkomsten dan die bedoeld in het vierde lid worden met de bezoldiging verrekend overeenkomstig
      [artikel 3 van de Wet schadeloosstelling leden Tweede Kamer][ref1] met dien verstande dat in dat artikel:

      a. onder neveninkomsten wordt verstaan: opbrengst van onderneming en arbeid, bedoeld in
      [artikel 6 van de Wet inkomstenbelasting BES][ref2];

      b. in het derde lid voor «de [Wet inkomstenbelasting 2001][ref3]» wordt gelezen: de
      [Wet inkomstenbelasting BES][ref4].

      7 Bij algemene maatregel van bestuur worden regels gesteld over de wijze waarop de gezaghebber gegevens over de
      inkomsten, bedoeld in het zesde lid, verstrekt, en de gevolgen van het niet verstrekken van deze gegevens.

      8 De rijksbelastingdienst verstrekt Onze Minister ten behoeve van de verrekening de benodigde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0004939#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0029281#Artikel6
