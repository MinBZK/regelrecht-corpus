  - number: '180'
    text: |-
      1 De gezaghebber is bevoegd door hem aangewezen groepen van personen op een door hem aangegeven plaats tijdelijk te
      doen ophouden. De ophouding kan mede omvatten, indien nodig, het overbrengen naar die plaats.

      2 De gezaghebber oefent de bevoegdheid, bedoeld in het eerste lid, slechts uit:

      a. jegens personen die door hem daartoe aangewezen specifieke onderdelen van een bevel als bedoeld in
      [artikel 178][ref1] of van een algemeen verbindend voorschrift als bedoeld in [artikel 179][ref2], groepsgewijs
      niet naleven, en

      b. indien het ophouden noodzakelijk is ter voorkoming van voortzetting of herhaling van de niet-naleving en de
      naleving redelijkerwijs niet op andere geschikte wijze kan worden verzekerd.

      3 [Artikel 158, derde tot en met veertiende lid][ref3], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel178
      [ref2]: https://wetten.overheid.nl/BWBR0028142#Artikel179
