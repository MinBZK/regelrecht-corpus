        artikel: '11'
  - number: 119b
    text: |-
      1 De eilandsraad kan informatie ten aanzien waarvan krachtens [artikel 24, vijfde lid][ref1], een verplichting tot
      geheimhouding geldt of zij een verplichting tot geheimhouding heeft opgelegd, verstrekken aan het bestuurscollege,
      de gezaghebber, de gezamenlijke rekenkamer en een commissie als bedoeld in [hoofdstuk III, afdeling VII][ref2].

      2 Het bestuurscollege kan informatie ten aanzien waarvan hij een verplichting tot geheimhouding heeft
      opgelegd, verstrekken aan de eilandsraad, de gezamenlijke rekenkamer en een commissie als bedoeld in
      [hoofdstuk III, afdeling VII][ref3].

      3 De gezaghebber kan informatie ten aanzien waarvan hij een verplichting tot geheimhouding heeft opgelegd,
      verstrekken aan de eilandsraad, het bestuurscollege, de gezamenlijke rekenkamer en een commissie als bedoeld in
      [hoofdstuk III, afdeling VII][ref4].

      4 Een commissie als bedoeld in [hoofdstuk III, afdeling VII][ref5], kan informatie ten aanzien waarvan zij een
      verplichting tot geheimhouding heeft opgelegd, verstrekken aan de eilandsraad, het bestuurscollege, de gezaghebber
      en de gezamenlijke rekenkamer.

      5 Indien het bestuurscollege of de gezaghebber overeenkomstig het tweede of derde lid informatie verstrekt aan
      een commissie waarin leden van de eilandsraad zitting hebben, verstrekt het bestuurscollege of de gezaghebber die
      informatie tevens aan de eilandsraad.

      6 Indien het bestuurscollege, de gezaghebber of een commissie overeenkomstig het tweede, derde of vierde lid
      informatie verstrekt aan de eilandsraad, kan de eilandsraad die informatie verstrekken aan anderen. De eilandsraad
      kan regels stellen over het verstrekken van informatie ten aanzien waarvan een verplichting tot geheimhouding is
      opgelegd door het bestuurscollege, de gezaghebber of een commissie en die tevens aan de eilandsraad is verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0028142#HoofdstukIII
      [ref3]: https://wetten.overheid.nl/BWBR0028142#HoofdstukIII
      [ref4]: https://wetten.overheid.nl/BWBR0028142#HoofdstukIII
      [ref5]: https://wetten.overheid.nl/BWBR0028142#HoofdstukIII
