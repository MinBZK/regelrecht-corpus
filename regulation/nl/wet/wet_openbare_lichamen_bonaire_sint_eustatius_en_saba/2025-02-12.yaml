  - number: 165b
    text: |-
      De [artikelen 161 tot en met 165][ref1] zijn van overeenkomstige toepassing op de gemeenschappelijke
      onderzoekscommissie, bedoeld in [artikel 165a][ref2], met dien verstande dat:

      a. in de [artikelen 161 tot en met 164][ref3] voor «onderzoekscommissie» telkens wordt gelezen: gemeenschappelijke
      onderzoekscommissie;

      b. de verplichtingen, bedoeld in de [artikelen 161, eerste lid][ref4], en [162, eerste lid][ref5], ook
      van toepassing zijn op de ambtenaren en gewezen ambtenaren aangesteld door of vanwege het bestuur van een
      samenwerkingslichaam als bedoeld in [artikel 125, eerste lid, van de Wet gemeenschappelijke regelingen][ref6]
      aangesteld of daaraan ondergeschikt;

      c. bij de toepassing van [artikel 161, derde lid][ref7], voor «het eilandbestuur» wordt gelezen «het eilandbestuur,
      indien onderzoek gedaan wordt naar de bestuursvoering van een instelling ingesteld bij een regeling als bedoeld in
      [artikel 124 van de Wet gemeenschappelijke regelingen][ref8], het bestuur van een samenwerkingslichaam als bedoeld
      in [artikel 125, eerste lid, van de Wet gemeenschappelijke regelingen][ref9]» en voor «[artikel 160][ref10]» wordt
      gelezen: [artikel 165a][ref11];

      d. bij de toepassing van [artikel 164, derde lid][ref12], voor «door of vanwege het bestuurscollege» wordt gelezen:
      door of vanwege het bestuurscollege of het bestuur van een samenwerkingslichaam, ingesteld bij een regeling als
      bedoeld in [artikel 124 van de Wet gemeenschappelijke regelingen][ref13] die uitsluitend of mede is getroffen door
      bestuurscolleges of gezaghebbers.

      e. bij de toepassing van [artikel 164, vierde lid][ref14], voor «de gezaghebber gevoerde bestuur, door de
      gezaghebber» wordt gelezen: de gezaghebber of het bestuur van een samenwerkingslichaam of gemeenschappelijk orgaan
      als bedoeld in [artikel 125 van de Wet gemeenschappelijke regelingen][ref15] gevoerde bestuur, door de gezaghebber
      of het bestuur van een samenwerkingslichaam of gemeenschappelijk orgaan.


