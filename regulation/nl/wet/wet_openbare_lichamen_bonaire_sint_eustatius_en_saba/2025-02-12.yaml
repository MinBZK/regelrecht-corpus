  - number: '60'
    text: |-
      1 Indien een uitspraak van de eilandsraad inhoudende de opzegging van zijn vertrouwen in een eilandgedeputeerde
      er niet toe leidt dat de betrokken eilandgedeputeerde onmiddellijk ontslag neemt, kan de eilandsraad besluiten tot
      ontslag. [Artikel 32][ref1] is van toepassing op de stemming inzake het ontslag.

      2 Op het ontslagbesluit is [artikel 7, eerste lid, van de Wet administratieve rechtspraak BES][ref2] niet van
      toepassing.


