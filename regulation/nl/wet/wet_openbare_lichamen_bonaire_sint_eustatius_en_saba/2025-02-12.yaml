  - number: '205'
    text: |-
      1 De Rijksvertegenwoordiger is verantwoording verschuldigd aan Onze Minister wie het aangaat.

      2 Onze Minister wie het aangaat kan de Rijksvertegenwoordiger de nodige algemene en bijzondere aanwijzingen geven
      met betrekking tot de aan hem toegekende taken en bevoegdheden. Alvorens een aanwijzing te geven treedt Onze
      Minister wie het aangaat in overleg met Onze Minister.

      3 De Rijksvertegenwoordiger verstrekt Onze Minister wie het aangaat desgevraagd inlichtingen over zijn
      werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel205
  - number: '206'
    text: |-
      De eilandsbesturen alsmede de onder hen ressorterende diensten en ambtenaren verlenen op verzoek van de
      Rijksvertegenwoordiger hun medewerking bij de uitoefening van de hem toegekende taken.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel206
  - number: '207'
    text: |-
      Onze Minister wie het aangaat en de Rijksvertegenwoordiger doen het bestuurscollege desgevraagd mededeling van hun
      standpunten en voornemens met betrekking tot aangelegenheden die voor het openbaar lichaam van belang zijn, tenzij
      het openbaar belang zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel207
  - number: '208'
    text: |-
      Onze Minister wie het aangaat en de Rijksvertegenwoordiger bieden het bestuurscollege desgevraagd de gelegenheid
      tot het plegen van overleg met betrekking tot aangelegenheden die voor het openbaar lichaam van belang zijn, tenzij
      het openbaar belang zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel208
  - number: '209'
    text: |-
      1 Onze Minister wie het aangaat stelt de betrokken bestuurscolleges of een instantie die voor deze representatief
      kan worden geacht, zo nodig binnen een te stellen termijn, in de gelegenheid hun oordeel te geven omtrent
      voorstellen van wet, ontwerpen van algemene maatregel van bestuur of ontwerpen van ministeriële regeling waarbij:

      a. van de openbare lichamen regeling of bestuur wordt gevorderd;

      b. in betekenende mate wijziging wordt gebracht in de taken en bevoegdheden van het eilandsbestuur.

      2 Voorstellen als bedoeld in het eerste lid bevatten in de bijbehorende toelichting een weergave van de gevolgen
      voor de inrichting en werking van de openbare lichamen en een weergave van het in het eerste lid bedoelde oordeel
      van de betrokken bestuurscolleges of representatieve instantie.

      3 Onverminderd het eerste en tweede lid stelt Onze Minister wie het aangaat de betrokken bestuurscolleges of een
      instantie die voor deze representatief kan worden geacht, zo nodig binnen een te stellen termijn, vooraf in de
      gelegenheid hun oordeel te geven omtrent:

      a. ingrijpende beleidsvoornemens, die uitsluitend op de openbare lichamen betrekking hebben;

      b. beleidsvoornemens ten aanzien van de openbare lichamen om op ingrijpende wijze af te wijken van regelgeving die
      van toepassing is in het Europese deel van Nederland.

      4 Onze Minister wie het aangaat is niet verplicht vooraf het in het eerste en derde lid bedoelde oordeel in te
      winnen indien zulks ten gevolge van dringende omstandigheden niet mogelijk is. In dat geval wordt het oordeel zo
      spoedig mogelijk ingewonnen en openbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel209
  - number: '210'
    text: |-
      1 Een wet waarbij van de eilandsbesturen regeling of bestuur wordt gevorderd of waarbij in betekenende mate
      wijziging wordt gebracht in taken en bevoegdheden van de eilandsbesturen, wijkt van het bepaalde in deze wet niet
      af dan wanneer dat bijzonder aangewezen moet worden geacht voor de behartiging van het daarmee te dienen openbaar
      belang.

      2 Het voorstel voor een wet als bedoeld in het eerste lid bevat in de bijbehorende toelichting de gronden voor de
      voorgestelde afwijking.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel210
  - number: '211'
    text: |-
      1 Onze Minister is belast met de coördinatie van het rijksbeleid dat de openbare lichamen raakt. Hij bevordert
      voorts de beleidsvrijheid van het eilandsbestuur.

      2 Over maatregelen en voornemens die van betekenis zijn voor het rijksbeleid inzake de openbare lichamen treden
      Onze Ministers onder wier verantwoordelijkheid die maatregelen en voornemens tot stand komen in een vroegtijdig
      stadium in overleg met Onze Minister.

      3 Onze Minister maakt bedenkingen kenbaar tegen een maatregel of een voornemen voor zover hem die maatregel of dat
      voornemen met het oog op het door de regering gevoerde decentralisatiebeleid niet toelaatbaar voorkomt.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel211
  - number: '212'
    text: |-
      1 Onze Minister bevordert de decentralisatie ten behoeve van de openbare lichamen.

      2 Voorstellen van maatregelen waarbij bepaalde aangelegenheden tot rijksbeleid worden gerekend, worden slechts
      gedaan indien het onderwerp van zorg niet op doelmatige en doeltreffende wijze door de eilandsbesturen kan worden
      behartigd.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel212
  - number: '213'
    text: |-
      Over al hetgeen het openbaar lichaam betreft dient het bestuurscollege Onze Ministers en de Rijksvertegenwoordiger
      desgevraagd van bericht en raad, tenzij dit uitdrukkelijk van de gezaghebber wordt verlangd.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel213
  - number: '214'
    text: |-
      1 Bij de wet of krachtens de wet bij algemene maatregel van bestuur worden de gevallen geregeld waarin het
      bestuurscollege verplicht is tot het verstrekken van systematische informatie aan Onze Minister wie het aangaat.
      Daarbij kan worden bepaald dat bij ministeriële regeling nadere voorschriften worden gegeven ten behoeve van de
      toepassing van de wet of de algemene maatregel van bestuur.

      2 Bij algemene maatregel van bestuur op voordracht van Onze Minister van Economische Zaken, na overleg met Onze
      Minister, kan worden bepaald dat in die maatregel te omschrijven gegevens ten behoeve van statistische doeleinden
      aan het Centraal Bureau voor de Statistiek worden verstrekt.

      3 Omtrent de in het eerste en tweede lid bedoelde verstrekking van informatie en de inwinning daarvan worden bij
      algemene maatregel van bestuur nadere algemene regels gesteld.

      4 Omtrent de in het eerste en tweede lid bedoelde verstrekking van informatie en de inwinning daarvan, alsmede
      omtrent de verstrekking en inwinning van incidentele informatie, wordt, voorzover dat niet bij wet geschiedt, bij
      algemene maatregel van bestuur aangegeven hoe de financiële gevolgen van de verplichting tot informatieverstrekking
      worden gecompenseerd.

      5 De voordrachten voor de algemene maatregelen van bestuur, bedoeld in het derde en het vierde lid, worden gedaan
      door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel214
  - number: '215'
    text: |-
      De bevoegdheid tot het maken van eilandsverordeningen blijft ten aanzien van het onderwerp waarin door wetten of
      algemene maatregelen van bestuur is voorzien, gehandhaafd, voor zover de eilandsverordeningen met die wetten en
      algemene maatregelen van bestuur niet in strijd zijn.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel215
  - number: '216'
    text: |-
      De bepalingen van eilandsverordeningen in wier onderwerp door een wet of een algemene maatregel van bestuur wordt
      voorzien, zijn van rechtswege vervallen.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel216
  - number: '217'
    text: |-
      1 Beslissingen van eilandsbesturen kunnen slechts aan goedkeuring worden onderworpen in bij de wet bepaalde
      gevallen.

      2 Op de goedkeuring van beslissingen van eilandsbesturen is
      [afdeling 10.2.1 van de Algemene wet bestuursrecht][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling10.2.1
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel217
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 10.2.1
  - number: '218'
    text: |-
      1 Een beslissing die aan goedkeuring bij koninklijk besluit is onderworpen, wordt toegezonden aan Onze Minister wie
      het aangaat.

      2 Een voordracht tot onthouding van goedkeuring wordt gedaan door of mede door Onze Minister.

      3 Onthouding van goedkeuring geschiedt niet, dan nadat de Raad van State is gehoord. De toepassing van
      [artikel 10:30, eerste lid, van de Algemene wet bestuursrecht][ref1] vindt in dat geval plaats voordat het ontwerp-
      besluit bij de Raad van State ter overweging wordt gebracht. [Artikel 18a van de Wet op de Raad van State][ref2] is
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1030
      [ref2]: https://wetten.overheid.nl/BWBR0002367#Artikel18a
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel218
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 10:30
      - id: ref2
        bwb_id: BWBR0002367
        artikel: 18a
  - number: '219'
    text: |-
      Op de schorsing en vernietiging van beslissingen van eilandsbesturen zijn [afdeling 10.2.2][ref1] en
      [10.2.3 van de Algemene wet bestuursrecht][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling10.2.2
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling10.2.3
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel219
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 10.2.2
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: 10.2.3
  - number: '220'
    text: |-
      Een besluit dan wel een niet-schriftelijke beslissing gericht op enig rechtsgevolg van het eilandsbestuur kan bij
      koninklijk besluit worden vernietigd.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel220
  - number: '221'
    text: |-
      De gezaghebber zendt elk eilandsbesluit van algemene strekking, dat niet is bekendgemaakt in het afkondigingsblad
      van het openbaar lichaam, binnen twee dagen na de bekendmaking daarvan aan de Rijksvertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel221
  - number: '222'
    text: |-
      1 Indien een besluit naar het oordeel van de Rijksvertegenwoordiger voor vernietiging in aanmerking komt, doet hij
      daarvan binnen twee dagen na de bekendmaking van het besluit, of, indien het betreft een besluit als bedoeld in
      [artikel 221][ref1], binnen twee dagen nadat het te zijner kennis is gekomen, mededeling aan Onze Minister wie het
      aangaat. Hij geeft hiervan tegelijkertijd kennis aan het orgaan dat het besluit nam, en zo nodig aan het orgaan dat
      met de uitvoering van het besluit is belast.

      2 Het besluit ten aanzien waarvan het eerste lid toepassing heeft gevonden, wordt niet of niet verder uitgevoerd,
      voordat van Onze Minister wie het aangaat de mededeling is ontvangen, dat voor schorsing of vernietiging
      geen redenen bestaan. Indien het besluit niet binnen vier weken na de dagtekening van de mededeling van de
      Rijksvertegenwoordiger is geschorst of vernietigd, wordt het uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel221
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel222
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '221'
        hoofdstuk: V
        paragraaf: '2'
        afdeling: III
  - number: '223'
    text: |-
      1 Indien een besluit naar het oordeel van de gezaghebber voor vernietiging in aanmerking komt, doet hij daarvan
      binnen twee dagen nadat het te zijner kennis is gekomen, door tussenkomst van de Rijksvertegenwoordiger, mededeling
      aan Onze Minister wie het aangaat. Hij geeft hiervan tegelijkertijd kennis aan het orgaan dat het besluit nam, en
      zo nodig aan het orgaan dat met de uitvoering van het besluit is belast.

      2 De Rijksvertegenwoordiger zendt de stukken, vergezeld van zijn advies, binnen een week na de dagtekening van de
      mededeling van de gezaghebber toe aan Onze Minister wie het aangaat.

      3 [Artikel 222, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel222
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel223
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '222'
        hoofdstuk: V
        paragraaf: '2'
        afdeling: III
  - number: '224'
    text: |-
      1 Een voordracht tot schorsing wordt gedaan door Onze Minister wie het aangaat.

      2 Over de voordracht pleegt Onze Minister wie het aangaat overleg met Onze Minister, tenzij schorsing onverwijld
      plaats dient te vinden. In de voordracht wordt het achterwege blijven van overleg gemotiveerd.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel224
  - number: '225'
    text: |-
      Indien een bekendgemaakt besluit niet is vernietigd binnen de tijd waarvoor het is geschorst, wordt hiervan door
      het eilandsbestuur kennisgegeven in het afkondigingsblad.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel225
  - number: '226'
    text: |-
      1 De voordracht tot vernietiging wordt gedaan door of mede door Onze Minister.

      2 [Artikel 15, derde lid, van de Wet op de Raad van State][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002367#Artikel15
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel226
    references:
      - id: ref1
        bwb_id: BWBR0002367
        artikel: '15'
  - number: '227'
    text: |-
      Het koninklijk besluit tot schorsing, opheffing of verlenging van de schorsing of tot vernietiging wordt in de
      Staatscourant geplaatst.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel227
  - number: '228'
    text: |-
      Het eilandsbestuur neemt opnieuw een besluit omtrent het onderwerp van het vernietigde besluit, waarbij met het
      koninklijk besluit wordt rekening gehouden.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel228
  - number: '229'
    text: |-
      1 In afwijking van
      __REF000___________________________________________________________________________________________________________
      ____________ kan een belanghebbende tegen een koninklijk besluit als bedoeld in [artikel 220][ref2] binnen zes
      weken nadat het besluit is bekendgemaakt beroep instellen bij de Afdeling bestuursrechtspraak van de Raad van
      State.

      2 Geen beroep kan worden ingesteld tegen de weigering om de vernietiging te bevorderen en tegen het niet tijdig
      nemen van een besluit tot vernietiging.


      [ref1]: https://wetten.overheid.nl/BWBR0028063#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0028142#Artikel220
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel229
    references:
      - id: ref1
        bwb_id: BWBR0028063
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0028142
        artikel: '220'
        hoofdstuk: V
        paragraaf: '2'
        afdeling: III
  - number: '230'
    text: |-
      Wanneer de eilandsraad bij of krachtens een andere dan deze wet of de
      [Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba][ref1] gevorderde beslissingen niet of niet naar
      behoren neemt, voorziet het bestuurscollege daarin.


      [ref1]: https://wetten.overheid.nl/BWBR0028151
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel230
    references:
      - id: ref1
        bwb_id: BWBR0028151
  - number: '231'
    text: |-
      1 Wanneer het bestuurscollege of de gezaghebber bij of krachtens een andere dan deze wet of de
      [Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba][ref1] gevorderde beslissingen niet of niet naar
      behoren neemt, voorziet de Rijksvertegenwoordiger daarin namens het bestuurscollege of de gezaghebber en ten laste
      van het openbaar lichaam.

      2 Spoedeisende gevallen uitgezonderd, vindt het eerste lid geen toepassing dan nadat het
      bestuurscollege, onderscheidenlijk de gezaghebber in de gelegenheid is gesteld binnen een door de
      Rijksvertegenwoordiger gestelde termijn alsnog de bij of krachtens een andere dan deze wet of de
      [Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba][ref2] gevorderde beslissingen te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0028151
      [ref2]: https://wetten.overheid.nl/BWBR0028151
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel231
    references:
      - id: ref1
        bwb_id: BWBR0028151
      - id: ref2
        bwb_id: BWBR0028151
  - number: '232'
    text: |-
      Bij de wet kunnen met afwijking van de [artikelen 5][ref1] en [149][ref2] voorzieningen worden getroffen voor het
      geval het bestuur van een openbaar lichaam zijn taken grovelijk verwaarloost.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0028142#Artikel149
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel232
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '5'
        hoofdstuk: III
        afdeling: I
      - id: ref2
        bwb_id: BWBR0028142
        artikel: '149'
        hoofdstuk: IV
        afdeling: II
  - number: '233'
    text: |-
      De gedragscode, bedoeld in [artikel 16, derde lid][ref1], gelezen in samenhang met
      [artikel 94d][ref2], wordt vastgesteld uiterlijk in de kalendermaand voorafgaande aan de
