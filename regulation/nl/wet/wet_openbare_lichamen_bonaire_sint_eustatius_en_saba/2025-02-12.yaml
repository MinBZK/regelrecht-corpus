      1 Een lid van de eilandsraad kan een voorstel voor een eilandsverordening of een ander voorstel ter behandeling in
      de eilandsraad indienen.

      2 De eilandsraad regelt op welke wijze een voorstel voor een eilandsverordening wordt ingediend en behandeld.

      3 De eilandsraad regelt op welke wijze en onder welke voorwaarden een ander voorstel wordt ingediend en behandeld.

      4 De eilandsraad neemt geen besluit over een voorstel dan nadat het bestuurscollege in de gelegenheid is gesteld
      zijn wensen en bedenkingen ter kennis van de raad te brengen.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel150
  - number: '151'
    text: |-
      1 Een lid van de eilandsraad kan een voorstel tot wijziging van een voor de vergadering van de eilandsraad
      geagendeerde ontwerp-eilandsverordening of ontwerp-beslissing indienen.

      2 [Artikel 150, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel150
