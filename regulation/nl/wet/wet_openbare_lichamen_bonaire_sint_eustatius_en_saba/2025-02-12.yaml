  - number: '110'
    text: |-
      1 De gezamenlijke ombudsman vervult geen betrekkingen waarvan de uitoefening ongewenst is met het oog op een goede
      vervulling van zijn ambt of op de handhaving van zijn onpartijdigheid en onafhankelijkheid of van het vertrouwen
      daarin.

      2 [Artikel 13][ref1] is van overeenkomstige toepassing op de gezamenlijke ombudsman.


