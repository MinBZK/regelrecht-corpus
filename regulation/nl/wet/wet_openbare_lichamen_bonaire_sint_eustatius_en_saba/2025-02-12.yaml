  - number: 119a
    text: |-
      De eilandsraad, het bestuurscollege, de gezaghebber en een commissie als bedoeld
      in [hoofdstuk III, afdeling VII][ref1], kunnen op grond van een belang, genoemd in
      [artikel 11 van de Wet openbaarheid van bestuur BES][ref2], een verplichting tot geheimhouding opleggen ten aanzien
      van informatie die bij dat orgaan berust.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#HoofdstukIII
      [ref2]: https://wetten.overheid.nl/BWBR0028154#Artikel11
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel119a
