        artikel: '20'
        hoofdstuk: III
        afdeling: II
  - number: '160'
    text: |-
      1 De eilandsraad kan op voorstel van een of meer van zijn leden een onderzoek naar het door het bestuurscollege of
      de gezaghebber gevoerde bestuur instellen.

      2 Het besluit tot het instellen van een onderzoek omvat een omschrijving van het onderwerp van onderzoek alsmede
      een toelichting. Deze omschrijving kan hangende het onderzoek door de eilandsraad worden gewijzigd.

      3 Het onderzoek wordt uitgevoerd door een door de eilandsraad in te stellen onderzoekscommissie. De commissie heeft
      ten minste drie leden en bestaat uitsluitend uit leden van de eilandsraad.

      4 De [artikelen 23][ref1], [24, vierde en vijfde lid][ref2], [117, derde lid][ref3], [119a][ref4] en [119c][ref5]
      zijn van overeenkomstige toepassing op de onderzoekscommissie.

      5 De onderzoekscommissie kan de bij deze wet verleende bevoegdheden uitsluitend uitoefenen, indien ten minste drie
      van haar leden aanwezig zijn.

      6 De bevoegdheden en werkzaamheden van een onderzoekscommissie worden niet geschorst door het aftreden van de
      eilandsraad.

      7 Op het besluit tot instelling van een onderzoek en tot instelling van een onderzoekscommissie,
      alsmede het besluit tot wijziging van de omschrijving van het onderwerp van een onderzoek is
      [artikel 19 van de Bekendmakingswet][ref6] van overeenkomstige toepassing.

      8 Alvorens de eilandsraad besluit tot een onderzoek, stelt hij bij eilandsverordening nadere regels met betrekking
      tot deze onderzoeken. In elk geval worden daarin regels opgenomen over de wijze waarop ambtelijke bijstand wordt
      verleend aan de commissie.


