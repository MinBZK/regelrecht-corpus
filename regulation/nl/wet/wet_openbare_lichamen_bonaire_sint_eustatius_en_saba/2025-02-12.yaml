  - number: '12'
    text: |-
      Ter vervulling van een tussentijds opengevallen plaats is niet benoembaar tot lid van de eilandsraad hij
      die na de laatstgehouden periodieke verkiezing van de leden van de eilandsraad wegens handelen in strijd met
      [artikel 16][ref1] van het lidmaatschap van de eilandsraad is vervallen verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel16
