  - number: '195'
    text: |-
      De Rijksvertegenwoordiger is niet tevens:

      a. minister;

      b. staatssecretaris;

      c. lid van de Raad van State;

      d. lid van de Algemene Rekenkamer;

      e. Nationale ombudsman;

      f. substituut-ombudsman als bedoeld in [artikel 9, eerste lid, van de Wet Nationale ombudsman][ref1];

      g. lid van een eilandsraad;

      h. gezaghebber;

      i. eilandgedeputeerde;

      j. lid van het kiescollege;

      k. lid van de gezamenlijke rekenkamer;

      l. gezamenlijke ombudsman of lid van de gezamenlijke ombudscommissie;

      m. ambtenaar, door of vanwege het bestuur van een openbaar lichaam aangesteld of daaraan ondergeschikt;

      n. functionaris die krachtens de wet of een algemene maatregel van bestuur het bestuur van een openbaar lichaam van
      advies dient.

      o. lid van provinciale staten;

      p. commissaris van de Koning;

      q. gedeputeerde van een provincie;

      r. lid van een gemeenteraad;

      s. burgemeester;

      t. wethouder.


      [ref1]: https://wetten.overheid.nl/BWBR0001865#Artikel9
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel195
    references:
      - id: ref1
        bwb_id: BWBR0001865
        artikel: '9'
  - number: '196'
    text: |-
      De Rijksvertegenwoordiger mag niet:

      a. als advocaat, procureur of adviseur in geschillen werkzaam zijn ten behoeve van een openbaar lichaam of een
      eilandsbestuur dan wel ten behoeve van de wederpartij van een openbaar lichaam of een eilandsbestuur;

      b. als gemachtigde in geschillen werkzaam zijn ten behoeve van de wederpartij van een openbaar lichaam of een
      eilandsbestuur;

      c. als vertegenwoordiger of adviseur werkzaam zijn ten behoeve van derden tot het met een openbaar lichaam aangaan
      van:

      1°. overeenkomsten als bedoeld in onderdeel d;

      2°. overeenkomsten tot het leveren van onroerende zaken aan een openbaar lichaam;

      d. rechtstreeks of middellijk een overeenkomst aangaan betreffende:

      1°. het aannemen van werk ten behoeve van een openbaar lichaam;

      2°. het buiten dienstbetrekking tegen beloning verrichten van werkzaamheden ten behoeve van een openbaar lichaam;

      3°. het leveren van roerende zaken anders dan om niet aan een openbaar lichaam;

      4°. het verhuren van roerende zaken aan een openbaar lichaam;

      5°. het verwerven van betwiste vorderingen ten laste van een openbaar lichaam;

      6°. het van een openbaar lichaam onderhands verwerven van onroerende zaken of beperkte rechten waaraan deze zijn
      onderworpen;

      7°. het onderhands huren of pachten van een openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel196
  - number: '197'
    text: |-
      Het ambt van Rijksvertegenwoordiger ontheft van alle bij of krachtens de wet opgelegde verplichtingen tot het
      verrichten van persoonlijke diensten.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel197
  - number: '198'
    text: |-
      1 De Rijksvertegenwoordiger heeft zijn werkelijke woonplaats in één van de openbare lichamen.

      2 Onze Minister kan voor ten hoogste een jaar ontheffing verlenen van de verplichting om de werkelijke woonplaats
      in één van de openbare lichamen te hebben.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel198
  - number: '199'
    text: |-
      1 Indien de Rijksvertegenwoordiger langer dan zes weken buiten de openbare lichamen wenst te verblijven, behoeft
      hij daartoe de toestemming van Onze Minister.

      2 De Rijksvertegenwoordiger die buiten de openbare lichamen verblijft kan door Onze Minister wegens dringende
      redenen van dienstbelang worden teruggeroepen.

      3 De [Algemene Termijnenwet][ref1] is niet van toepassing op de termijn, genoemd in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002448
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel199
