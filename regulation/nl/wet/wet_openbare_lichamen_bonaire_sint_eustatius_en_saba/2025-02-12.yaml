preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat met de eilandgebieden Bonaire, Sint Eustatius en Saba is overeengekomen
    dat zij een staatsrechtelijke positie krijgen binnen het Nederlandse staatsbestel en worden ingericht als openbaar
    lichaam in de zin van artikel 134 van de Grondwet en dat het in verband hiermee wenselijk is de instelling en
    inrichting van deze openbare lichamen te regelen, de samenstelling en bevoegdheid van hun besturen, de openbaarheid
    van hun vergaderingen alsmede het toezicht op deze besturen, waarbij voor zover mogelijk aansluiting wordt gezocht
    bij het gemeentelijk bestuursmodel;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. *openbaar lichaam:* openbaar lichaam Bonaire, Sint Eustatius of Saba;

      b. *eilandsbestuur:* ieder bevoegd orgaan van het openbaar lichaam;

      c. *Onze Minister:* Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;

      d. *Rijksvertegenwoordiger:* Rijksvertegenwoordiger voor de openbare lichamen Bonaire, Sint Eustatius en Saba.

      2 In deze wet wordt onder ambtenaar mede verstaan: degene die op arbeidsovereenkomst naar burgerlijk recht werkzaam
      is.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel1
  - number: '2'
    text: |-
      1 Er is een openbaar lichaam Bonaire.

      2 Het openbaar lichaam Bonaire omvat de eilanden Bonaire en Klein Bonaire.

      3 Het openbaar lichaam Bonaire bezit rechtspersoonlijkheid.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel2
  - number: '3'
    text: |-
      1 Er is een openbaar lichaam Sint Eustatius.

      2 Het openbaar lichaam Sint Eustatius omvat het eiland Sint Eustatius.

      3 Het openbaar lichaam Sint Eustatius bezit rechtspersoonlijkheid.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel3
  - number: '4'
    text: |-
      1 Er is een openbaar lichaam Saba.

      2 Het openbaar lichaam Saba omvat het eiland Saba.

      3 Het openbaar lichaam Saba bezit rechtspersoonlijkheid.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel4
  - number: 4a
    text: Bij algemene maatregel van bestuur worden de grenzen van de openbare lichamen vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel4a
  - number: '5'
    text: |-
      In elk openbaar lichaam is een eilandsraad, een bestuurscollege, een gezaghebber en een kiescollege voor de Eerste
      Kamer.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel5
  - number: '6'
    text: De eilandsraad vertegenwoordigt de gehele bevolking van het openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel6
  - number: '9'
    text: |-
      Het aantal leden van de eilandsraad bedraagt:

      a. negen in het openbaar lichaam Bonaire;

      b. vijf in de openbare lichamen Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel9
  - number: '10'
    text: De gezaghebber is voorzitter van de eilandsraad.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel10
  - number: '11'
    text: |-
      1 Voor het lidmaatschap van de eilandsraad is vereist dat men ingezetene van het openbaar lichaam is, de leeftijd
      van achttien jaar heeft bereikt en niet is uitgesloten van het kiesrecht.

      2 Onder ingezetene wordt verstaan hij die zijn werkelijke woonplaats in het openbaar lichaam heeft.

      3 Hij die als ingezetene met een adres is ingeschreven in de bevolkingsadministratie van een openbaar lichaam,
      wordt, behoudens bewijs van het tegendeel, geacht werkelijke woonplaats te hebben in het openbaar lichaam.

      4 Zij die geen Nederlander zijn, dienen tevens te voldoen aan de vereisten dat:

      a. zij rechtmatig in Nederland verblijven op grond van [artikel 3][ref1] of
      [artikel 6 van de Wet toelating en uitzetting BES][ref2] of op grond van een verdrag tussen een internationale
      organisatie en de Staat der Nederlanden inzake de zetel van deze organisatie in Nederland, en

      b. zij onmiddellijk voorafgaand aan de dag waarop de eilandsraad beslist over de toelating als lid tot de
      eilandsraad gedurende een onafgebroken periode van tenminste vijf jaren ingezetene van Nederland waren en
      beschikten over een verblijfsrecht als bedoeld onder a, dan wel rechtmatig in Nederland verbleven op grond van
      [artikel 8, onder a, b, c, d, e of l, van de Vreemdelingenwet 2000][ref3].

      5 Geen lid van de eilandsraad kunnen zijn zij die geen Nederlander zijn, en als door andere staten uitgezonden
      leden van diplomatieke of consulaire vertegenwoordigingen, in Nederland werkzaam zijn, alsmede hun niet-Nederlandse
      echtgenoten, geregistreerde partners of levensgezellen en kinderen, voor zover dezen met hen een gemeenschappelijke
      huishouding voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0028571#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0028571#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel8
