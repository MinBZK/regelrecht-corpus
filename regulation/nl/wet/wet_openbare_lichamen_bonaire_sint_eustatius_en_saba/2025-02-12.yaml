  - number: '112'
    text: |-
      1 Op voordracht van de gezamenlijke ombudsman benoemen de bestuurscolleges het personeel van de gezamenlijke
      ombudsman dat nodig is voor een goede uitoefening van zijn werkzaamheden.

      2 De gezamenlijke ombudsman ontvangt ter zake van de uitoefening van zijn werkzaamheden geen instructies, noch in
      het algemeen, noch voor een enkel geval.

      3 Het personeel van de gezamenlijke ombudsman verricht geen werkzaamheden voor een bestuursorgaan naar wiens
      gedraging de gezamenlijke ombudsman een onderzoek kan instellen.

      4 Het personeel van de gezamenlijke ombudsman is ter zake van de werkzaamheden die het voor de gezamenlijke
      ombudsman verricht, uitsluitend aan hem verantwoording schuldig.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel112
  - number: '113'
    text: De gezamenlijke ombudsman zendt jaarlijks een verslag van zijn werkzaamheden aan de eilandsraden.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel113
  - number: '114'
    text: |-
      De gezamenlijke ombudsman ontvangt een bij eilandsverordening van de eilandsraden vastgestelde vergoeding voor zijn
      werkzaamheden en een tegemoetkoming in de kosten.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel114
  - number: '115'
    text: |-
      1 Indien de eilandsraden besluiten tot het instellen van een gezamenlijke ombudscommissie, stellen zij het aantal
      leden van de gezamenlijke ombudscommissie vast.

      2 De eilandsraden benoemen de leden van de gezamenlijke ombudscommissie voor de duur van zes jaar.

      3 De eilandsraden benoemen uit de leden de voorzitter en de plaatsvervangend voorzitter van de gezamenlijke
      ombudscommissie.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel115
  - number: '116'
    text: |-
      1 De gezamenlijke ombudscommissie zendt jaarlijks een verslag van zijn werkzaamheden aan de eilandsraden.

      2 Op de gezamenlijke ombudscommissie en op ieder lid afzonderlijk zijn de
      [artikelen 109, derde en vierde lid][ref1], [110][ref2], [111][ref3], [112][ref4] en [114][ref5] van
      overeenkomstige toepassing.


