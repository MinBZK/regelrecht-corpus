  - number: '156'
    text: |-
      1 De eilandsraad kan bij eilandsverordening de gezaghebber de bevoegdheid verlenen om, indien dat in
      het belang van de handhaving van de openbare orde noodzakelijk is, te besluiten tot plaatsing van vaste
      camera’s voor een bepaalde duur ten behoeve van het toezicht op een openbare plaats als bedoeld in
      [artikel 1 van de Wet openbare manifestaties][ref1] en andere bij eilandsverordening aan te wijzen plaatsen die
      voor een ieder toegankelijk zijn. De gezaghebber bepaalt de duur van de plaatsing en wijst de openbare plaats of
      plaatsen aan, met inachtneming van hetgeen daaromtrent in de eilandsverordening is bepaald. Voor de vaststelling
      van de eilandsverordening bij stemming is de volstrekte meerderheid van het aantal zitting hebbende leden vereist.

      2 De gezaghebber stelt, na overleg met de officier van justitie, de periode vast waarin in het belang van de
      handhaving van de openbare orde daadwerkelijk gebruik van de camera’s plaatsvindt en de met de camera’s gemaakte
      beelden in elk geval rechtstreeks worden bekeken.

      3 De gezaghebber bedient zich bij de uitvoering van het in het eerste lid bedoelde besluit van de onder zijn gezag
      staande politie.

      4 De aanwezigheid van camera’s als bedoeld in het eerste lid is op duidelijke wijze kenbaar voor een ieder die de
      desbetreffende openbare plaats betreedt.

      5 Met de camera’s worden uitsluitend beelden gemaakt van een openbare plaats als bedoeld in
      [artikel 1 van de Wet openbare manifestaties][ref2] en andere bij eilandsverordening aan te wijzen plaatsen die
      voor een ieder toegankelijk zijn.

      6 De met de camera’s gemaakte beelden mogen in het belang van de handhaving van de openbare orde worden vastgelegd.

      7 De verwerking van de gegevens, bedoeld in het zesde lid, is een verwerking als bedoeld
      in de [Wet politiegegevens][ref3], met dien verstande dat, in afwijking van het bepaalde in
      [artikel 8 van die wet][ref4], de vastgelegde beelden na ten hoogste vier weken worden vernietigd en de gegevens,
      bedoeld in het zesde lid, indien er concrete aanleiding bestaat te vermoeden dat die gegevens noodzakelijk zijn
      voor de opsporing van een strafbaar feit, ten behoeve van de opsporing van dat strafbare feit kunnen worden
      verwerkt.

      8 Bij of krachtens algemene maatregel van bestuur kunnen met het oog op de goede uitvoering van het toezicht,
      bedoeld in het eerste lid, regels worden gesteld omtrent:

      a. de vaste camera’s en andere technische hulpmiddelen benodigd voor het toezicht, bedoeld in het eerste lid, en de
      wijze waarop deze hulpmiddelen worden aangebracht;

      b. de personen belast met of anderszins direct betrokken bij de uitvoering van het toezicht; en

      c. de ruimten waarin de waarneming of verwerking van door het toezicht vastgelegde beelden plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0004318#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004318#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0022463
      [ref4]: https://wetten.overheid.nl/BWBR0004318#Artikel8
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel156
