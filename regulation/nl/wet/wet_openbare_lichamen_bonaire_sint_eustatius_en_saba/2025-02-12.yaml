        artikel: '17'
      - id: ref3
        bwb_id: BWBR0028151
        artikel: '28'
  - number: '139'
    text: |-
      1 Het vaststellen van een plan of een beleidsverslag als bedoeld in [artikel 138][ref1] en het ter voorbereiding
      daarvan volgen van een voorgeschreven procedure wordt alleen gevorderd, indien:

      a. dit noodzakelijk is uit een oogpunt van afstemming tussen het beleid van het openbaar lichaam en het beleid van
      het Rijk, of

      b. de ontwikkeling van beleid op een nieuw beleidsterrein dit noodzakelijk maakt.

      2 Het vaststellen van een plan of een beleidsverslag als bedoeld in [artikel 138][ref2] en het ter voorbereiding
      daarvan volgen van een voorgeschreven procedure wordt niet gevorderd, indien:

      a. het eilandsbestuur daardoor ontoelaatbaar beperkt wordt in zijn inhoudelijke of financiële beleidsruimte;

      b. de bestuurslasten niet in redelijke verhouding staan tot de te verwachten baten of een aanzienlijk beslag leggen
      op de voor het betrokken beleidsterrein beschikbare middelen;

      c. integratie met een bestaand plan of een bestaand beleidsverslag dan wel met de begroting
      of de jaarrekening en het jaarverslag, bedoeld in [artikel 17][ref3], onderscheidenlijk
      [artikel 28 van de Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba][ref4] mogelijk is;

      d. het bevorderen van de samenhang in het beleid in de openbare lichamen door onderlinge afstemming van onderdelen
      daarvan onmogelijk wordt;

      e. het uitsluitend dient tot het verkrijgen van informatie.

      3 Indien in een voorstel van wet tot invoering of wijziging van bepalingen waarbij het vaststellen van een
      plan of een beleidsverslag als bedoeld in [artikel 138][ref5] en het ter voorbereiding daarvan volgen van een
      voorgeschreven procedure wordt gevorderd, wordt afgeweken van het bepaalde bij of krachtens artikel 138 en dit
      artikel, wordt die afwijking gemotiveerd in de bij het voorstel behorende toelichting.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel138
