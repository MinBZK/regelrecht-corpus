  - number: '163'
    text: |-
      1 Getuigen en deskundigen worden schriftelijk opgeroepen. De brief, houdende de oproep, wordt aangetekend verzonden
      of tegen gedagtekend ontvangstbewijs uitgereikt.

      2 De onderzoekscommissie kan bevelen dat getuigen en deskundigen die, hoewel opgeroepen in overeenstemming met
      het eerste lid, niet zijn verschenen, door de openbare macht voor hen worden gebracht om aan hun verplichting te
      voldoen. De onderzoekscommissie stelt de getuige of deskundige hiervan schriftelijk in kennis op de wijze, bedoeld
      in het eerste lid. In de beschikking wordt een termijn gesteld waarbinnen de belanghebbende de tenuitvoerlegging
      kan voorkomen door alsnog aan zijn verplichting te voldoen.

      3 Op een beschikking als bedoeld in het
      [eerste en het tweede lid is artikel 55 van de Wet administratieve rechtspraak BES][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028455#Artikel55
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel163
    references:
      - id: ref1
        bwb_id: BWBR0028455
        artikel: '55'
  - number: '164'
    text: |-
      1 Niemand kan genoodzaakt worden aan de onderzoekscommissie geheimen te openbaren, voor zover daardoor onevenredige
      schade zou worden toegebracht aan het belang van de uitoefening van zijn beroep, dan wel aan het belang van zijn
      onderneming of de onderneming waarbij hij werkzaam is of is geweest.

      2 Zij die uit hoofde van hun ambt, beroep of betrekking tot geheimhouding verplicht zijn, kunnen zich verschonen
      getuigenis af te leggen, doch uitsluitend met betrekking tot hetgeen waarvan de wetenschap aan hen als zodanig is
      toevertrouwd. Zij kunnen inzage, afschrift of kennisneming anderszins weigeren van bescheiden of gedeelten daarvan
      tot welke hun plicht tot geheimhouding zich uitstrekt.

      3 De gezaghebber en gewezen gezaghebbers, eilandgedeputeerden en gewezen eilandgedeputeerden, leden en
      gewezen leden van een door het bestuurscollege of de gezaghebber ingestelde commissie, ambtenaren en gewezen
      ambtenaren, door of vanwege het bestuurscollege aangesteld of daaraan ondergeschikt, zijn niet verplicht aan
      [artikel 161][ref1] en [artikel 162][ref2] te voldoen, indien het verstrekken van de inlichtingen in strijd is met
      het openbaar belang.

      4 De onderzoekscommissie kan verlangen dat een beroep als bedoeld in het derde lid op strijd met het openbaar
      belang wordt bevestigd door het bestuurscollege, of, voor zover de inlichtingen betrekking hebben op het door de
      gezaghebber gevoerde bestuur, door de gezaghebber.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel161
      [ref2]: https://wetten.overheid.nl/BWBR0028142#Artikel162
