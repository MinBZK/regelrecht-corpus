  - number: '13'
    text: |-
      1 De leden van de eilandsraad maken openbaar welke andere functies dan het lidmaatschap van de eilandsraad zij
      vervullen.

      2 De openbaarmaking vindt plaats terstond na benoeming tot lid van de eilandsraad of na aanvaarding van een andere
      functie en geschiedt zowel op elektronische wijze als door terinzagelegging van een opgave van de functies op het
      bestuurskantoor van het openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel13
  - number: '14'
    text: |-
      1 Een lid van de eilandsraad is niet tevens:

      a. minister;

      b. staatssecretaris;

      c. lid van de Raad van State;

      d. lid van de Algemene Rekenkamer;

      e. Nationale ombudsman;

      f. substituut-ombudsman als bedoeld in [artikel 9, eerste lid, van de Wet Nationale ombudsman][ref1];

      g. Rijksvertegenwoordiger;

      h. gezaghebber;

      i. eilandgedeputeerde;

      j. lid van de gezamenlijke rekenkamer;

      k. gezamenlijke ombudsman of lid van de gezamenlijke ombudscommissie;

      l. ambtenaar, door of vanwege het bestuur van het openbaar lichaam aangesteld of daaraan ondergeschikt.

      2 In afwijking van het eerste lid, aanhef en onder i, kan een lid van de eilandsraad tevens eilandgedeputeerde zijn
      van het openbaar lichaam waar hij lid van de eilandsraad is gedurende het tijdvak dat:

      a. aanvangt op de dag van de stemming voor de verkiezing van de leden van de eilandsraad en eindigt op het tijdstip
      waarop de eilandgedeputeerden ingevolge [artikel 54, eerste lid][ref2], aftreden, of

      b. aanvangt op het tijdstip van zijn benoeming tot eilandgedeputeerde en eindigt op het tijdstip met ingang waarvan
      de geloofsbrief van zijn opvolger als lid van de eilandsraad is goedgekeurd of waarop het centraal stembureau heeft
      beslist dat geen opvolger kan worden benoemd.

      3 Het lid van de eilandsraad, bedoeld in het tweede lid, onderdeel b, wordt geacht ontslag te nemen als lid
      van de eilandsraad met ingang van het tijdstip waarop hij zijn benoeming tot eilandgedeputeerde aanvaardt.
      [Artikel X 6 van de Kieswet][ref3] is van overeenkomstige toepassing.

      4 In afwijking van het eerste lid, aanhef en onder l, kan een lid van de eilandsraad tevens zijn:

      a. ambtenaar van de burgerlijke stand;

      b. vrijwilliger of ander persoon die uit hoofde van een wettelijke verplichting niet bij wijze van beroep
      hulpdiensten verricht;

      c. ambtenaar werkzaam voor een school voor openbaar onderwijs.


