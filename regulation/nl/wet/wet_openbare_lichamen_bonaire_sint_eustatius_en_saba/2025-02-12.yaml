  - number: '189'
    text: |-
      De Rijksvertegenwoordiger kan te allen tijde bij koninklijk besluit op voordracht van Onze Minister worden
      ontslagen.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel189
  - number: '190'
    text: |-
      1 De Rijksvertegenwoordiger kan bij koninklijk besluit op voordracht van Onze Minister worden geschorst.

      2 Onze Minister kan, in afwachting van het besluit omtrent schorsing, bepalen dat de Rijksvertegenwoordiger zijn
      functie niet uitoefent.

      3 Een besluit als bedoeld in het tweede lid vervalt, indien niet binnen een maand een besluit omtrent de schorsing
      is genomen.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel190
  - number: '191'
    text: Voor de benoembaarheid tot Rijksvertegenwoordiger is het Nederlanderschap vereist.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel191
  - number: '192'
    text: |-
      1 Alvorens zijn ambt te aanvaarden, legt de Rijksvertegenwoordiger in handen van de Koning de volgende eed
      (verklaring en belofte) af:

      «Ik zweer (verklaar) dat ik, om tot Rijksvertegenwoordiger voor de openbare lichamen Bonaire, Sint Eustatius en
      Saba benoemd te worden, rechtstreeks noch middellijk, onder welke naam of welk voorwendsel ook, enige gift of gunst
      heb gegeven of beloofd.

      Ik zweer (verklaar en beloof) dat ik, om iets in dit ambt te doen of te laten, rechtstreeks noch middellijk enig
      geschenk of enige belofte heb aangenomen of zal aannemen.

      Ik zweer (beloof) dat ik getrouw zal zijn aan de [Grondwet][ref1], dat ik de wetten zal nakomen en dat ik mijn
      plichten als Rijksvertegenwoordiger voor de openbare lichamen Bonaire, Sint Eustatius en Saba naar eer en geweten
      zal vervullen.

      Zo waarlijk helpe mij God Almachtig!»

      (Dat verklaar en beloof ik!»)

      2 In geval van herbenoeming wordt de eed (verklaring en belofte) in handen van de Koning of in handen van Onze
      Minister, daartoe door de Koning gemachtigd, afgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel192
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: '193'
    text: |-
      1 De Rijksvertegenwoordiger geniet een bezoldiging, die bij of krachtens algemene maatregel van bestuur wordt
      geregeld. De bezoldiging komt ten laste van de begroting van Onze Minister.

      2 Bij de algemene maatregel van bestuur kunnen tevens regels worden gesteld betreffende tegemoetkoming in of
      vergoeding van bijzondere kosten en betreffende andere voorzieningen die verband houden met de vervulling van het
      ambt van Rijksvertegenwoordiger.

      3 Buiten hetgeen hem bij of krachtens de wet is toegekend, geniet de Rijksvertegenwoordiger als zodanig geen
      inkomsten, in welke vorm ook, ten laste van het Rijk.

      4 De Rijksvertegenwoordiger geniet geen vergoedingen, in welke vorm ook, voor werkzaamheden, verricht in
      nevenfuncties welke hij vervult uit hoofde van het ambt van Rijksvertegenwoordiger. Indien deze vergoedingen worden
      uitgekeerd, worden zij gestort in de Rijkskas.

      5 Tot vergoedingen als bedoeld in het vijfde lid, behoren inkomsten, onder welke benaming ook, uit nevenfuncties
      die de Rijksvertegenwoordiger neerlegt bij beëindiging van het ambt.

      6 Andere inkomsten dan die bedoeld in het vijfde lid worden met de bezoldiging verrekend overeenkomstig
      [artikel 3 van de Wet schadeloosstelling leden Tweede Kamer][ref1].

      7 Bij algemene maatregel van bestuur worden regels gesteld over de wijze waarop de Rijksvertegenwoordiger gegevens
      over de inkomsten, bedoeld in het zevende lid, verstrekt, en de gevolgen van het niet verstrekken van deze
      gegevens.

      8 De rijksbelastingdienst verstrekt Onze Minister ten behoeve van de verrekening de benodigde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0004939#Artikel3
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel193
    references:
      - id: ref1
        bwb_id: BWBR0004939
        artikel: '3'
  - number: '194'
    text: |-
      1 De Rijksvertegenwoordiger vervult geen nevenfuncties waarvan de uitoefening ongewenst is met het oog op
      de goede vervulling van zijn ambt van Rijksvertegenwoordiger of op de handhaving van zijn onpartijdigheid en
      onafhankelijkheid of van het vertrouwen daarin.

      2 De Rijksvertegenwoordiger meldt zijn voornemen tot aanvaarding van een nevenfunctie, anders dan uit hoofde van
      zijn ambt van Rijksvertegenwoordiger, aan Onze Minister.

      3 De Rijksvertegenwoordiger maakt nevenfuncties, anders dan uit hoofde van zijn ambt van Rijksvertegenwoordiger,
      openbaar. De openbaarmaking vindt plaats terstond na benoeming tot Rijksvertegenwoordiger of aanvaarding van een
      nevenfunctie en geschiedt zowel op elektronische wijze als door terinzaggelegging van een opgave van de functies op
      het Bureau van de Rijksvertegenwoordiger, bedoeld in [artikel 202, eerste lid][ref1].

      4 De Rijksvertegenwoordiger maakt tevens de inkomsten uit de nevenfuncties, bedoeld in het derde lid,
      openbaar. Openbaarmaking geschiedt zowel op elektronische wijze als door terinzagelegging op het Bureau van de
      Rijksvertegenwoordiger uiterlijk op 1 april na het kalenderjaar waarin de inkomsten zijn genoten.

      5 Onder inkomsten wordt verstaan: loon in de zin van [artikel 9 van de Wet op de loonbelasting 1964][ref2],
      verminderd met de eindheffingsbestanddelen bedoeld in [artikel 31 van die wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel202
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel31
