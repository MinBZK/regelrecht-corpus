  - number: '137'
    text: Bij of krachtens de wet kan zo nodig onderscheid worden gemaakt tussen de openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel137
  - number: '138'
    text: |-
      1 In dit artikel wordt verstaan onder:

      a. *plan:* een beslissing die een samenhangend geheel van op elkaar afgestemde keuzes bevat omtrent door het
      eilandsbestuur te nemen besluiten of te verrichten andere handelingen, ten einde een of meer doelstellingen te
      bereiken;

      b. *beleidsverslag:* een schriftelijke rapportage betreffende het door het eilandsbestuur gevoerde beleid op een of
      meer beleidsterreinen dan wel op onderdelen daarvan en de samenhang daarbinnen of daartussen.

      2 Het vaststellen van een plan of een beleidsverslag en het ter voorbereiding daarvan volgen van een voorgeschreven
      procedure kan vanwege het Rijk van het eilandsbestuur slechts worden gevorderd in bij de wet te bepalen gevallen.

      3 Een verplichting als bedoeld in het tweede lid geldt voor ten hoogste vier jaren, tenzij de wet anders bepaalt.

      4 Het vaststellen van een plan of een beleidsverslag en het ter voorbereiding daarvan volgen van een voorgeschreven
      procedure kan vanwege het Rijk in andere dan bij de wet bepaalde gevallen voor een termijn van ten hoogste vier jaar
      van het eilandsbestuur worden gevraagd als onderdeel van de regeling van een tijdelijke bijzondere uitkering als
      bedoeld in [artikel 92, derde lid, van de Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba][ref1].

      5 Het vaststellen van een plan of een beleidsverslag en het ter voorbereiding daarvan volgen van de voorgeschreven
      procedure wordt van een eilandsbestuur niet gevorderd of gevraagd, dan nadat is aangegeven hoe de financiële
      gevolgen ervan voor het openbaar lichaam worden gecompenseerd.

      6 Dit artikel is niet van toepassing op de begroting en op de jaarrekening
      en het jaarverslag, bedoeld in [artikel 17][ref2], onderscheidenlijk
      [artikel 28 van de Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel92
      [ref2]: https://wetten.overheid.nl/BWBR0028151#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0028151#Artikel28
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel138
    references:
      - id: ref1
