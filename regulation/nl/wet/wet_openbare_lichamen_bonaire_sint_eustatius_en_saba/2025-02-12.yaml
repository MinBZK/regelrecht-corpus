  - number: '101'
    text: |-
      [Artikel 16, eerste en tweede lid][ref1], is van overeenkomstige toepassing op de leden van de gezamenlijke
      rekenkamer.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel16
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '16'
        hoofdstuk: III
        afdeling: II
  - number: '102'
    text: |-
      1 De gezamenlijke rekenkamer stelt een reglement van orde vast voor haar werkzaamheden en haar vergaderingen.

      2 De gezamenlijke rekenkamer zendt het reglement ter kennisneming aan de eilandsraden en maakt het bekend door
      plaatsing in de afkondigingsbladen van de openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel102
  - number: '103'
    text: |-
      De eilandsraden stellen, na overleg met de gezamenlijke rekenkamer, de gezamenlijke rekenkamer de nodige middelen
      ter beschikking voor een goede uitoefening van haar werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel103
  - number: '104'
    text: |-
      1 De personen die werkzaamheden verrichten voor de gezamenlijke rekenkamer, zijn ter zake van die werkzaamheden
      uitsluitend verantwoording schuldig aan de gezamenlijke rekenkamer.

      2 Ambtenaren die werkzaamheden verrichten voor een orgaan van een openbaar lichaam kunnen niet tevens werkzaamheden
      verrichten voor de gezamenlijke rekenkamer.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel104
  - number: '105'
    text: |-
      1 In de eilandsverordening waarbij de gezamenlijke rekenkamer wordt ingesteld worden ten minste regels gesteld met
      betrekking tot:

      a. het voorzitterschap van de gezamenlijke rekenkamer;

      b. de vergoeding die de leden van de gezamenlijke rekenkamer voor hun werkzaamheden ontvangen en de tegemoetkoming
      in de kosten;

      c. de ondersteuning van de gezamenlijke rekenkamer.

      2 De eilandsverordening behoeft de goedkeuring van de Rijksvertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel105
  - number: '106'
    text: |-
      [Titel 9.2 van de Algemene wet bestuursrecht][ref1], met uitzondering van de [artikelen 9:20][ref2] en
      [9:21][ref3], is van overeenkomstige toepassing op schriftelijke verzoeken om een onderzoek in te stellen naar de
      wijze waarop een bestuursorgaan van het openbaar lichaam zich in een bepaalde aangelegenheid heeft gedragen met
      dien verstande dat in [artikel 9:36, eerste lid][ref4], voor «[artikel 5.1 van de Wet open overheid][ref5]» wordt
      gelezen: [artikel 11 van de Wet openbaarheid van bestuur BES][ref6].


