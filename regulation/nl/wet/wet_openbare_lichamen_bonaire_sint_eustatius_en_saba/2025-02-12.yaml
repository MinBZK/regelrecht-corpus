  - number: '165'
    text: |-
      Het bestuurscollege neemt de door de eilandsraad geraamde kosten voor een onderzoek in een bepaald jaar op in de
      ontwerp-begroting.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel165
  - number: 165a
    text: |-
      1 De eilandsraad kan tezamen met de eilandsraden van de andere deelnemende
      openbare lichamen aan een gemeenschappelijke regeling als bedoeld in
      [artikel 125, eerste of tweede lid, van de Wet gemeenschappelijke regelingen][ref1] op voorstel van een van de
      eilandsraden van de deelnemende openbare lichamen aan de betreffende regeling een onderzoek instellen naar het door
      het samenwerkingslichaam of het gemeenschappelijk orgaan gevoerde bestuur.

      2 Het eerste lid is niet van toepassing op een regeling die uitsluitend of mede is getroffen door de eilandsraad of
      eilandsraden van de deelnemende openbare lichamen.

      3 Het besluit tot het instellen van een gemeenschappelijke onderzoekscommissie omvat een omschrijving van
      het onderwerp van onderzoek alsmede een toelichting. Deze omschrijving kan hangende het onderzoek door de
      vertegenwoordigende organen, bedoeld in het eerste lid, worden gewijzigd.

      4 Het onderzoek wordt uitgevoerd door een door de eilandsraden gezamenlijk, met toepassing van de
      [artikelen 124][ref2] en [125, tweede lid, van de Wet gemeenschappelijke regelingen][ref3] in te stellen
      gemeenschappelijke onderzoekscommissie. De gemeenschappelijke onderzoekscommissie heeft ten minste drie leden en
      bestaat uitsluitend uit leden van de vertegenwoordigende organen, bedoeld in het eerste lid.

      5 Bij de samenstelling van de gemeenschappelijke onderzoekscommissie wordt gezorgd voor een evenwichtige
      vertegenwoordiging van de in het samenwerkingslichaam of gemeenschappelijk orgaan deelnemende openbare lichamen.

      6 De regeling waarbij de gemeenschappelijke onderzoekscommissie wordt ingesteld houdt bepalingen in omtrent het
      onderzoek, bedoeld in het eerste lid. In elk geval worden bepalingen opgenomen over de wijze waarop ambtelijke
      bijstand wordt verleend aan de gemeenschappelijke onderzoekscommissie.

      7 De [artikelen 23][ref4] en [119, eerste lid][ref5], zijn van overeenkomstige toepassing op de gemeenschappelijke
      onderzoekscommissie.

      8 De gemeenschappelijke onderzoekscommissie kan de bij deze wet verleende bevoegdheden uitsluitend uitoefenen,
      indien ten minste drie van haar leden aanwezig zijn.

      9 De bevoegdheden en werkzaamheden van een gemeenschappelijke onderzoekscommissie worden niet geschorst door het
      aftreden van een van de eilandsraden, bedoeld in het eerste lid.

      10 Op het besluit tot instelling van een onderzoek en tot instelling van een gemeenschappelijke
      onderzoekscommissie, alsmede het besluit tot wijziging van de omschrijving van het onderwerp van een onderzoek, is
      [artikel 19 van de Bekendmakingswet][ref6] van overeenkomstige toepassing.

      11 De [artikelen 10, tweede, derde en vijfde tot en met achtste lid][ref7], [10a][ref8],
      [11][ref9], [11a][ref10], [15][ref11], [16][ref12], [17, derde lid][ref13], [21][ref14] en
      [23 van de Wet gemeenschappelijke regelingen][ref15] zijn niet van toepassing. De overige bepalingen uit
      de [Wet gemeenschappelijke regelingen][ref16] zijn slechts van toepassing voor zover de aard van de aan de
      gemeenschappelijke onderzoekscommissie opgedragen taken zich daartegen niet verzet.


