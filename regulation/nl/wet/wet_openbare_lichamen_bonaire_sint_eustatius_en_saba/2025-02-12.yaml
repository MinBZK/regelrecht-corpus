  - number: '84'
    text: |-
      Het ambt van gezaghebber ontheft van alle bij of krachtens de wet opgelegde verplichtingen tot het verrichten van
      persoonlijke diensten.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel84
  - number: '85'
    text: |-
      1 De gezaghebber heeft zijn werkelijke woonplaats in het openbaar lichaam.

      2 De Rijksvertegenwoordiger kan voor ten hoogste drie maanden ontheffing verlenen van de verplichting om de
      werkelijke woonplaats in het openbaar lichaam te hebben.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel85
  - number: '86'
    text: |-
      1 Indien de gezaghebber langer dan zes weken buiten het openbaar lichaam wenst te verblijven, behoeft hij daartoe
      de toestemming van de Rijksvertegenwoordiger. De toestemming mag alleen worden verleend indien het belang van het
      openbaar lichaam zich daartegen niet verzet.

      2 De [Algemene Termijnenwet][ref1] is niet van toepassing op de termijn, genoemd in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002448
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0002448
  - number: '87'
    text: |-
      1 Voor zover dit niet bij de wet is geschied, worden bij of krachtens algemene maatregel van bestuur ten aanzien
      van de gezaghebber regels vastgesteld betreffende:

      a. benoeming, herbenoeming, schorsing, tijdelijk niet uitoefenen van zijn functie en ontslag;

      b. het onderzoek naar de geschiktheid en bekwaamheid;

      c. uitkering bij ontslag;

      d. aanspraken in geval van ziekte;

      e. bescherming bij de arbeid;

      f. andere aangelegenheden, zijn rechtspositie betreffende, die regeling behoeven.

      2 Bij de regels betreffende de aangelegenheden, genoemd in het eerste lid, kunnen financiële voorzieningen worden
      getroffen die ten laste van het openbaar lichaam komen.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel87
  - number: '88'
    text: |-
      1 Alle aan de eilandsraad of aan het bestuurscollege gerichte stukken worden door of namens de gezaghebber geopend.

      2 Van de ontvangst van aan de eilandsraad gerichte stukken die niet terstond in de vergadering van de eilandsraad
      aan de orde worden gesteld, doet hij in de eerstvolgende vergadering van de eilandsraad mededeling.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel88
  - number: '89'
    text: |-
      Bij koninklijk besluit wordt bepaald, welke de onderscheidingstekenen van de gezaghebber zijn en bij welke
      gelegenheden hij deze zal dragen.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel89
  - number: '90'
    text: |-
      1 Bij verhindering of ontstentenis van de gezaghebber wordt zijn ambt waargenomen door een door de
      Rijksvertegenwoordiger aangewezen waarnemend gezaghebber. De Rijksvertegenwoordiger kan voorts in de waarneming
      voorzien, indien hij dit in het belang van het openbaar lichaam nodig oordeelt.

      2 Alvorens tot de aanwijzing van een waarnemend gezaghebber over te gaan hoort de Rijksvertegenwoordiger de
      eilandsraad, tenzij gewichtige redenen zich daartegen verzetten.

      3 Hij die door de Rijksvertegenwoordiger met de waarneming van het ambt van gezaghebber is belast, legt in handen
      van de Rijksvertegenwoordiger een overeenkomstig [artikel 77][ref1] luidende eed (verklaring en belofte) af.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel77
