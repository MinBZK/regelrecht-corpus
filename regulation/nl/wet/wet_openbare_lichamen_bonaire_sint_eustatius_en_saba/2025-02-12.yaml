  - number: '117'
    text: |-
      1 De eilandsraad kan eilandsraadscommissies instellen die besluitvorming van de eilandsraad kunnen voorbereiden
      en met het bestuurscollege of de gezaghebber kunnen overleggen. Hij regelt daarbij de taken, de bevoegdheden,
      de samenstelling en de werkwijze, daaronder begrepen de wijze waarop de leden van de eilandsraad inzage hebben
      in stukken waaromtrent door een eilandsraadscommissie geheimhouding is opgelegd. Deze inzage kan slechts worden
      geweigerd voor zover zij in strijd is met het openbaar belang.

      2 De gezaghebber en de eilandgedeputeerden zijn geen lid van een eilandsraadscommissie.

      3 Bij de samenstelling van een eilandsraadscommissie zorgt de eilandsraad, voor zover het de benoeming betreft
      van leden van de eilandsraad, voor een evenwichtige vertegenwoordiging van de in de eilandsraad vertegenwoordigde
      groeperingen.

      4 Een lid van de eilandsraad is voorzitter van een eilandsraadscommissie.

      5 De [artikelen 20][ref1] en [22 tot en met 24][ref2] zijn van overeenkomstige toepassing op een vergadering
      van een eilandsraadscommissie, met dien verstande dat in [artikel 20][ref3] voor «gezaghebber» wordt gelezen
      «voorzitter van een eilandsraadscommissie».


