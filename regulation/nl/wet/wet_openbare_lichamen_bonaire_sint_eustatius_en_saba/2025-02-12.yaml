  - number: '79'
    text: |-
      1 De gezaghebber vervult geen nevenfuncties waarvan de uitoefening ongewenst is met het oog op de goede vervulling
      van zijn ambt van gezaghebber of op de handhaving van zijn onpartijdigheid en onafhankelijkheid of van het
      vertrouwen daarin.

      2 De gezaghebber meldt zijn voornemen tot aanvaarding van een nevenfunctie, anders dan uit hoofde van zijn ambt van
      gezaghebber, aan de eilandsraad.

      3 De gezaghebber maakt nevenfuncties, anders dan uit hoofde van zijn ambt van gezaghebber, openbaar. De
      openbaarmaking vindt plaats terstond na benoeming tot gezaghebber of aanvaarding van een nevenfunctie en geschiedt
      zowel op elektronische wijze als door terinzaggelegging van een opgave van de functies op het bestuurskantoor van
      het openbaar lichaam.

      4 De gezaghebber maakt tevens de inkomsten uit de nevenfuncties, bedoeld in het derde lid, openbaar. Openbaarmaking
      geschiedt zowel op elektronische wijze als door terinzagelegging op het bestuurskantoor uiterlijk op 1 april na het
      kalenderjaar waarin de inkomsten zijn genoten.

      5 Onder inkomsten wordt verstaan: loon in de zin van [artikel 6 van de Wet loonbelasting BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029283#Artikel6
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0029283
        artikel: '6'
  - number: '80'
    text: |-
      1 De gezaghebber is niet tevens:

      a. minister;

      b. staatssecretaris;

      c. lid van de Raad van State;

      d. lid van de Algemene Rekenkamer;

      e. Nationale ombudsman;

      f. substituut-ombudsman als bedoeld in [artikel 9, eerste lid, van de Wet Nationale ombudsman][ref1];

      g. Rijksvertegenwoordiger;

      h. lid van een eilandsraad;

      i. eilandgedeputeerde;

      j. lid van het kiescollege;

      k. lid van de gezamenlijke rekenkamer;

      l. gezamenlijke ombudsman of lid van de gezamenlijke ombudscommissie;

      m. ambtenaar, door of vanwege het bestuur van een openbaar lichaam aangesteld of daaraan ondergeschikt;

      n. ambtenaar, door of vanwege het Rijk aangesteld, tot wiens taak behoort het verrichten van werkzaamheden in het
      kader van het toezicht op het openbaar lichaam;

      o. functionaris die krachtens de wet of een algemene maatregel van bestuur het bestuur van een openbaar lichaam van
      advies dient.

      2 In afwijking van het eerste lid, aanhef en onderdeel l, kan een gezaghebber tevens ambtenaar van de burgerlijke
      stand zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel9
