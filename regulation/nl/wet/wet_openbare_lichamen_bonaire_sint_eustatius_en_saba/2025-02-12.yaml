        bwb_id: BWBR0001840
  - number: '16'
    text: |-
      1 Een lid van de eilandsraad mag niet:

      a. als advocaat, procureur of adviseur in geschillen werkzaam zijn ten behoeve van het openbaar lichaam of het
      eilandsbestuur dan wel ten behoeve van de wederpartij van het openbaar lichaam of het eilandsbestuur;

      b. als gemachtigde in geschillen werkzaam zijn ten behoeve van de wederpartij van het openbaar lichaam of het
      eilandsbestuur;

      c. als vertegenwoordiger of adviseur werkzaam zijn ten behoeve van derden tot het met het openbaar lichaam aangaan
      van:

      1°. overeenkomsten als bedoeld in onderdeel d;

      2°. overeenkomsten tot het leveren van onroerende zaken aan het openbaar lichaam;

      d. rechtstreeks of middellijk een overeenkomst aangaan betreffende:

      1°. het aannemen van werk ten behoeve van het openbaar lichaam;

      2°. het buiten dienstbetrekking tegen beloning verrichten van werkzaamheden ten behoeve van het openbaar lichaam;

      3°. het leveren van roerende zaken anders dan om niet aan het openbaar lichaam;

      4°. het verhuren van roerende zaken aan het openbaar lichaam;

      5°. het verwerven van betwiste vorderingen ten laste van het openbaar lichaam;

      6°. het van het openbaar lichaam onderhands verwerven van onroerende zaken of beperkte rechten waaraan deze zijn
      onderworpen;

      7°. het onderhands huren of pachten van het openbaar lichaam.

      2 Van het eerste lid, aanhef en onderdeel d, kan de Rijksvertegenwoordiger ontheffing verlenen.

      3 De eilandsraad stelt voor zijn leden een gedragscode vast.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel16
  - number: '17'
    text: De eilandsraad stelt een reglement van orde voor zijn vergaderingen en andere werkzaamheden vast.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel17
  - number: '18'
    text: |-
      1 De eilandsraad vergadert zo vaak als hij daartoe heeft besloten.

      2 Voorts vergadert de eilandsraad indien de gezaghebber het nodig oordeelt of indien ten minste een vijfde van het
      aantal leden waaruit de eilandsraad bestaat schriftelijk, met opgave van redenen, daarom verzoekt.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel18
  - number: '19'
    text: |-
      De eilandsraad vergadert na de periodieke verkiezing van zijn leden voor de eerste maal in nieuwe samenstelling op
      de dag met ingang waarvan de leden van de eilandsraad in oude samenstelling aftreden.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel19
  - number: '20'
    text: |-
      1 De gezaghebber roept de leden schriftelijk tot de vergadering op.

      2 Tegelijkertijd met de oproeping brengt de gezaghebber dag, tijdstip en plaats van de vergadering ter openbare
      kennis. De agenda en de daarbij behorende voorstellen met uitzondering van de informatie waarop een verplichting
      tot geheimhouding rust worden tegelijkertijd met de oproeping en op een bij de openbare kennisgeving aan te geven
      wijze ter inzage gelegd.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel20
  - number: '21'
    text: |-
      1 De vergadering van de eilandsraad wordt niet geopend voordat blijkens de presentielijst meer dan de helft van het
      aantal zitting hebbende leden tegenwoordig is.

      2 Indien ingevolge het eerste lid de vergadering niet kan worden geopend, belegt de gezaghebber, onder verwijzing
      naar dit artikel, opnieuw een vergadering tegen een tijdstip dat ten minste vierentwintig uur na het bezorgen van
      de oproeping is gelegen.

      3 Op de vergadering, bedoeld in het tweede lid, is het eerste lid niet van toepassing. De eilandsraad kan echter
      over andere aangelegenheden dan die waarvoor de ingevolge het eerste lid niet geopende vergadering was belegd
      alleen beraadslagen of besluiten, indien blijkens de presentielijst meer dan de helft van het aantal zitting
      hebbende leden tegenwoordig is.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel21
  - number: '22'
    text: |-
      1 De gezaghebber heeft het recht in de vergadering aan de beraadslaging deel te nemen.

      2 Een eilandgedeputeerde heeft toegang tot de vergaderingen en kan aan de beraadslaging deelnemen.

      3 Een eilandgedeputeerde kan door de eilandsraad worden uitgenodigd om ter vergadering aanwezig te zijn.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel22
  - number: '23'
    text: |-
      De leden van het eilandsbestuur en andere personen die deelnemen aan de beraadslaging kunnen niet in rechte
      worden vervolgd of aangesproken voor dan wel worden verplicht in rechte getuigenis af te leggen als bedoeld
      in [artikel 144, eerste lid, van het Wetboek van Burgerlijke Rechtsvordering BES][ref1] over hetgeen zij in de
      vergadering van de eilandsraad hebben gezegd of aan de eilandsraad schriftelijk hebben overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028496#Artikel144
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0028496
        artikel: '144'
  - number: '24'
    text: |-
      1 De vergadering van de eilandsraad wordt in het openbaar gehouden.

      2 De deuren worden gesloten, wanneer ten minste één vijfde van het aantal leden dat de presentielijst heeft
      getekend daarom verzoekt of de voorzitter het nodig oordeelt.

      3 De eilandsraad beslist vervolgens of met gesloten deuren zal worden vergaderd.

      4 De voorzitter kan vervolgens alsnog besluiten dat de vergadering in het openbaar wordt gehouden indien hij dit in
      het kader van het openbaar belang nodig acht.

      5 Indien met gesloten deuren wordt vergaderd, geldt een verplichting tot geheimhouding omtrent informatie die in
      die vergadering ter kennis van de aanwezigen komt. De verplichting duurt voort, totdat de eilandsraad haar opheft.

      6 Van een vergadering met gesloten deuren wordt een afzonderlijk verslag opgemaakt, dat niet openbaar wordt gemaakt
      tenzij de eilandsraad besluit de verplichting, bedoeld in het vijfde lid, op te heffen.

      7 De eilandsraad maakt de besluitenlijst van zijn vergaderingen terstond na de vaststelling daarvan openbaar op de
      in het openbaar lichaam gebruikelijke wijze. De eilandsraad laat de openbaarmaking achterwege in de gevallen waarin
      een verplichting tot geheimhouding geldt of wanneer openbaarmaking in strijd is met het openbaar belang.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel24
  - number: '25'
    text: |-
      1 In een besloten vergadering kan niet worden beraadslaagd of besloten over:

      a. de toelating van nieuw benoemde leden;

      b. de vaststelling en wijziging van de begroting en de vaststelling van de jaarrekening;

      c. de invoering, wijziging en afschaffing van eilandbelastingen, en

      d. de benoeming en het ontslag van eilandgedeputeerden.

      2 In een besloten vergadering kan geen besluit worden genomen over:

      a. ontwerpen van eilandsverordeningen;

      b. het doen van uitgaven, op de begroting niet voorkomende of de daarop uitgetrokken posten te boven gaande;

      c. het aanwijzen van middelen tot dekking van zodanige uitgaven;

      d. het geheel of gedeeltelijk vervreemden en het bezwaren van de eigendommen van het openbaar lichaam;

      e. het onderhands verhuren, verpachten of in gebruik geven van eigendommen van het openbaar lichaam;

      f. het onderhands gunnen of aanbesteden van werken of leveranties.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel25
  - number: '27'
    text: |-
      1 De voorzitter zorgt voor de handhaving van de orde in de vergadering en is bevoegd, wanneer die orde op enigerlei
      wijze door toehoorders wordt verstoord, deze en zo nodig andere toehoorders te doen vertrekken.

      2 Hij is bevoegd toehoorders die bij herhaling de orde in de vergadering verstoren voor ten hoogste drie maanden de
      toegang tot de vergadering te ontzeggen.

      3 Hij kan de eilandsraad voorstellen aan een lid dat door zijn gedragingen de geregelde gang van zaken belemmert,
      het verdere verblijf in de vergadering te ontzeggen. Over het voorstel wordt niet beraadslaagd. Na aanneming
      daarvan verlaat het lid de vergadering onmiddellijk. Zo nodig doet de voorzitter hem verwijderen. Bij herhaling van
      zijn gedrag kan het lid bovendien voor ten hoogste drie maanden de toegang tot de vergadering worden ontzegd.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel27
  - number: '28'
    text: De leden van de eilandsraad stemmen zonder last.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel28
  - number: '29'
    text: |-
      1 Een lid van de eilandsraad neemt niet deel aan de beraadslaging en stemming over:

      a. een aangelegenheid die hem rechtstreeks of middellijk persoonlijk aangaat of waarbij hij als vertegenwoordiger
      is betrokken;

      b. de vaststelling of goedkeuring der rekening van een lichaam waaraan hij rekenplichtig is of tot welks bestuur
      hij behoort.

      2 Bij een schriftelijke stemming wordt onder het deelnemen aan de stemming verstaan het inleveren van een
      stembriefje.

      3 Een benoeming gaat iemand persoonlijk aan, wanneer hij behoort tot de personen tot wie de keuze door een
      voordracht of bij een herstemming is beperkt.

      4 Het eerste lid is niet van toepassing bij het besluit betreffende de toelating van de na periodieke verkiezing
      benoemde leden.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel29
  - number: '30'
    text: |-
      1 Een stemming is alleen geldig, indien meer dan de helft van het aantal leden dat zitting heeft en zich niet van
      deelneming aan de stemming moet onthouden, daaraan heeft deelgenomen.

      2 Het eerste lid is niet van toepassing:

      a. ingeval opnieuw wordt gestemd over een voorstel of over een benoeming, voordracht of aanbeveling van een of meer
      personen ten aanzien van wie in een vorige vergadering een stemming op grond van dat lid niet geldig was;

      b. in een vergadering als bedoeld in [artikel 21, tweede lid][ref1], voor zover het betreft onderwerpen die in
      de daaraan voorafgaande, ingevolge [artikel 21, eerste lid][ref2], niet geopende vergadering aan de orde waren
      gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0028142#Artikel21
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel30
