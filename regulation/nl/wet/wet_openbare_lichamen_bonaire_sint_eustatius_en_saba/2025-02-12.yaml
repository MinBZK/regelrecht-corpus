  - number: '54'
    text: |-
      1 Na de verkiezing van de leden van de eilandsraad treden de eilandgedeputeerden af op het moment dat de
      eilandsraad ten minste de helft van het aantal eilandgedeputeerden heeft benoemd en deze benoemingen zijn
      aangenomen.

      2 Indien zoveel eilandgedeputeerden hun ontslag indienen of worden ontslagen dat niet ten minste de helft van het
      aantal eilandgedeputeerden in functie is, treedt de gezaghebber in de plaats van het bestuurscollege totdat dit wel
      het geval is.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel54
  - number: '55'
    text: |-
      1 Een eilandgedeputeerde kan te allen tijde ontslag nemen. Hij doet daarvan schriftelijk mededeling aan de
      eilandsraad.

      2 Behoudens het geval dat de eilandgedeputeerde onmiddellijk ontslag neemt, gaat het ontslag in met ingang van
      de dag, gelegen een maand na de dag waarop hij zijn ontslag heeft genomen of zoveel eerder als zijn opvolger de
      benoeming heeft aangenomen.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel55
  - number: '56'
    text: |-
      1 De eilandgedeputeerden genieten ten laste van het openbaar lichaam een bezoldiging, die bij of krachtens algemene
      maatregel van bestuur wordt geregeld.

      2 Bij de algemene maatregel van bestuur, bedoeld in het eerste lid, kunnen tevens regels worden gesteld betreffende
      tegemoetkoming in of vergoeding van bijzondere kosten en betreffende andere voorzieningen die verband houden met de
      vervulling van het ambt van eilandgedeputeerde.

      3 Buiten hetgeen hun bij of krachtens de wet is toegekend genieten de eilandgedeputeerden als zodanig geen
      inkomsten, in welke vorm ook, ten laste van het openbaar lichaam.

      4 De eilandgedeputeerden genieten geen vergoedingen, in welke vorm ook, voor werkzaamheden, verricht in
      nevenfuncties die zij vervullen uit hoofde van het ambt van eilandgedeputeerde ongeacht of die vergoedingen ten
      laste van het openbaar lichaam komen of niet. Indien deze vergoedingen worden uitgekeerd, worden zij gestort in de
      kas van het openbaar lichaam.

      5 Tot vergoedingen als bedoeld in het vierde lid, behoren inkomsten, onder welke benaming ook, uit nevenfuncties
      die de eilandgedeputeerde neerlegt bij beëindiging van het ambt.

      6 Andere inkomsten dan die bedoeld in het vierde lid worden met de bezoldiging verrekend overeenkomstig
      [artikel 3 van de Wet schadeloosstelling leden Tweede Kamer][ref1], met dien verstande dat in dat artikel:

      a. onder neveninkomsten wordt verstaan: opbrengst van onderneming en arbeid, bedoeld in
      [artikel 6 van de Wet inkomstenbelasting BES][ref2];

      b. in het derde lid voor «de [Wet inkomstenbelasting 2001][ref3]» wordt gelezen: de
      [Wet inkomstenbelasting BES][ref4].

      7 Bij algemene maatregel van bestuur worden regels gesteld over de wijze waarop de eilandgedeputeerde gegevens over
      de inkomsten, bedoeld in het zesde lid, verstrekt, en de gevolgen van het niet verstrekken van deze gegevens.

      8 De rijksbelastingdienst verstrekt Onze Minister ten behoeve van de verrekening de benodigde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0004939#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0029281#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0011353
      [ref4]: https://wetten.overheid.nl/BWBR0029281
