  - number: '168'
    text: |-
      1 Het bestuurscollege is in ieder geval bevoegd:

      a. het dagelijks bestuur van het openbaar lichaam te voeren, voor zover niet bij of krachtens de wet de eilandsraad
      of de gezaghebber hiermee is belast;

      b. beslissingen van de eilandsraad voor te bereiden en uit te voeren, tenzij bij of krachtens de wet de gezaghebber
      hiermee is belast;

      c. regels vast te stellen over de ambtelijke organisatie van het openbaar lichaam, met uitzondering van de
      organisatie van de griffie;

      d. ambtenaren, niet zijnde de eilandgriffier en de op de griffie werkzame ambtenaren, te benoemen, te bevorderen,
      te schorsen en te ontslaan;

      e. tot privaatrechtelijke rechtshandelingen van het openbaar lichaam te besluiten;

      f. te besluiten namens het openbaar lichaam, het bestuurscollege of de eilandsraad rechtsgedingen,
      bezwaarprocedures of administratief beroepsprocedures te voeren of handelingen ter voorbereiding daarop te
      verrichten, tenzij de eilandsraad, voor zover het de eilandsraad aangaat, in voorkomende gevallen anders beslist;

      g. ten aanzien van de voorbereiding van de civiele verdediging;

      h. jaarmarkten of gewone marktdagen in te stellen, af te schaffen of te veranderen.

      2 Besluiten als bedoeld in het eerste lid, onderdeel d, worden genomen op grond van door het bestuurscollege
      vastgestelde regels inzake de benoeming, bevordering, schorsing en ontslag van ambtenaren. Deze regels bevatten in
      ieder geval de gronden voor deze besluiten.

      3 Besluiten als bedoeld in het eerste lid, onderdeel d, behoeven de goedkeuring van de Rijksvertegenwoordiger.
      De goedkeuring kan slechts worden onthouden wegens strijd met het recht of op een grond, die is neergelegd in de
      regels, bedoeld in het tweede lid.

      4 Het tweede en derde lid zijn van overeenkomstige toepassing op besluiten tot het sluiten van een overeenkomst
      van opdracht als bedoeld in [Boek 7 van het Burgerlijk Wetboek BES][ref1], op grond waarvan de opdrachtnemer
      ten behoeve van het openbaar lichaam voor meer dan een maand en gedurende ten minste 16 uur gemiddeld per week
      werkzaamheden verricht of laat verrichten door derden.

      5 Het bestuurscollege neemt, ook alvorens is besloten tot het voeren van een rechtsgeding, alle conservatoire
      maatregelen en doet wat nodig is ter voorkoming van verjaring of verlies van recht of bezit.


      [ref1]: https://wetten.overheid.nl/BWBR0028751
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel168
    references:
      - id: ref1
        bwb_id: BWBR0028751
  - number: '169'
    text: |-
      Het bestuurscollege kan een in het openbaar lichaam dienstdoende ambtenaar van politie machtigen in zijn naam
      besluiten te nemen of andere handelingen te verrichten.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel169
  - number: '170'
    text: |-
      1 Het bestuurscollege kan een of meer leden van het bestuurscollege machtigen tot uitoefening van een of meer van
      zijn bevoegdheden, tenzij de regeling waarop de bevoegdheid steunt zich daartegen verzet.

      2 Een krachtens machtiging uitgeoefende bevoegdheid wordt uit naam en onder verantwoordelijkheid van het
      bestuurscollege uitgeoefend.

      3 Het bestuurscollege kan te dien aanzien alle aanwijzingen geven die het nodig acht.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel170
  - number: '171'
    text: |-
      1 Het bestuurscollege en elk van zijn leden afzonderlijk zijn aan de eilandsraad verantwoording schuldig over het
      door het bestuurscollege gevoerde bestuur.

      2 Zij geven de eilandsraad alle inlichtingen die de eilandsraad voor de uitoefening van zijn taak nodig heeft.

      3 Zij geven de eilandsraad mondeling of schriftelijk de door een of meer leden gevraagde inlichtingen, tenzij het
      verstrekken ervan in strijd is met het openbaar belang.

      4 Zij geven de eilandsraad vooraf inlichtingen over de uitoefening van de bevoegdheden, bedoeld in
      [artikel 168, eerste lid, onderdeel e, f, g en h][ref1], indien de eilandsraad daarom verzoekt of indien
      de uitoefening ingrijpende gevolgen kan hebben voor het openbaar lichaam. In het laatste geval neemt het
      bestuurscollege geen besluit dan nadat de eilandsraad in de gelegenheid is gesteld zijn wensen en bedenkingen ter
      kennis van het bestuurscollege te brengen.

      5 Indien de uitoefening van de bevoegdheid, bedoeld in [artikel 168, eerste lid, onderdeel f][ref2], geen uitstel
      kan lijden, geven zij in afwijking van het vierde lid de eilandsraad zo spoedig mogelijk inlichtingen over de
      uitoefening van deze bevoegdheid en het terzake genomen besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel168
      [ref2]: https://wetten.overheid.nl/BWBR0028142#Artikel168
