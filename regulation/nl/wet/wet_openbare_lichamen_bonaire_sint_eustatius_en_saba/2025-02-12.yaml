  - number: '126'
    text: |-
      1 Het bestuurscollege benoemt de eilandsecretaris. Hij is tevens bevoegd de eilandsecretaris te schorsen en te
      ontslaan.

      2 Een besluit houdende de benoeming, bevordering, schorsing of ontslag van de eilandsecretaris behoeft de
      goedkeuring van de Rijksvertegenwoordiger. De goedkeuring kan slechts worden onthouden wegens strijd met het recht
      of de regels, bedoeld in [artikel 168, tweede lid][ref1].


