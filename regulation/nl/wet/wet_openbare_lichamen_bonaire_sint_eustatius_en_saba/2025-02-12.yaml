    text: |-
      1 De eilandsraad kan regels stellen over de organisatie van de griffie.

      2 De eilandsraad is bevoegd de op de griffie werkzame ambtenaren te benoemen, te schorsen en te ontslaan.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel134
  - number: '135'
    text: |-
      Een besluit houdende de benoeming, bevordering, schorsing of ontslag van de eilandgriffier en de op de griffie
      werkzame ambtenaren behoeft de goedkeuring van de Rijksvertegenwoordiger. De goedkeuring kan slechts worden
      onthouden wegens strijd met het recht of de regels die door de eilandsraad zijn vastgesteld voor benoeming,
      bevordering, schorsing en ontslag van de eilandgriffier en de op de griffie werkzame ambtenaren.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel135
  - number: '136'
    text: |-
      1 De bevoegdheid tot regeling en bestuur inzake de huishouding van het openbaar lichaam wordt aan het
      eilandsbestuur overgelaten.

      2 Regeling en bestuur kunnen van het eilandsbestuur worden gevorderd bij of krachtens een andere dan deze wet of de
      [Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba][ref1] ter verzekering van de uitvoering daarvan,
      met dien verstande dat het geven van aanwijzingen aan het eilandsbestuur en het aan het eilandsbestuur opleggen
      of in zijn plaats vaststellen van beslissingen, slechts kan geschieden indien de bevoegdheid daartoe bij de wet
      is toegekend.

      3 Onverminderd de [artikelen 138, vijfde lid][ref2], en [213, vierde lid][ref3], worden de kosten, verbonden aan de
      uitvoering van het tweede lid, voor zover zij ten laste van de betrokken openbare lichamen blijven, door het Rijk
      aan hen vergoed.


      [ref1]: https://wetten.overheid.nl/BWBR0028151
      [ref2]: https://wetten.overheid.nl/BWBR0028142#Artikel138
      [ref3]: https://wetten.overheid.nl/BWBR0028142#Artikel213
