  - number: 122a
    text: |-
      De eilandsverordeningen, bedoeld in de [artikelen 120 tot en met 122][ref1], worden aan de Rijksvertegenwoordiger
      gezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel120
