  - number: '40'
    text: |-
      1 Een eilandgedeputeerde is niet tevens:

      a. minister;

      b. staatssecretaris;

      c. lid van de Raad van State;

      d. lid van de Algemene Rekenkamer;

      e. Nationale ombudsman;

      f. substituut-ombudsman als bedoeld in [artikel 9, eerste lid, van de Wet Nationale ombudsman][ref1];

      g. Rijksvertegenwoordiger;

      h. lid van een eilandsraad;

      i. gezaghebber;

      j. lid van de gezamenlijke rekenkamer;

      k. gezamenlijke ombudsman of lid van de gezamenlijke ombudscommissie;

      l. ambtenaar, door of vanwege het bestuur van een openbaar lichaam aangesteld of daaraan ondergeschikt;

      m. ambtenaar, door of vanwege het Rijk aangesteld, tot wiens taak behoort het verrichten van werkzaamheden in het
      kader van het toezicht op het openbaar lichaam;

      n. functionaris die krachtens de wet of een algemene maatregel van bestuur het bestuur van een openbaar lichaam van
      advies dient.

      2 In afwijking van het eerste lid, aanhef en onderdeel h, kan een eilandgedeputeerde tevens lid zijn van de
      eilandsraad van het openbaar lichaam waar hij eilandgedeputeerde is gedurende het tijdvak dat:

      a. aanvangt op de dag van de stemming voor de verkiezing van de leden van de eilandsraad en eindigt op het tijdstip
      waarop de eilandgedeputeerden ingevolge [artikel 54, eerste lid][ref2], aftreden, of

      b. aanvangt op het tijdstip van zijn benoeming tot eilandgedeputeerde en eindigt op het tijdstip met ingang waarvan
      de goedkeuring van de geloofsbrief van zijn opvolger als lid van de eilandsraad onherroepelijk is geworden of
      waarop het centraal stembureau heeft beslist dat geen opvolger kan worden benoemd.

      3 De eilandgedeputeerde, bedoeld in het tweede lid, onderdeel b, wordt geacht ontslag te nemen als lid
      van de eilandsraad met ingang van het tijdstip waarop hij zijn benoeming tot eilandgedeputeerde aanvaardt.
      [Artikel X 6 van de Kieswet][ref3] is van overeenkomstige toepassing.

      4 In afwijking van het eerste lid, aanhef en onderdeel l, kan een eiland- gedeputeerde tevens zijn:

      a. ambtenaar van de burgerlijke stand;

      b. vrijwilliger of ander persoon die uit hoofde van een wettelijke verplichting niet bij wijze van beroep
      hulpdiensten verricht;

      c. ambtenaar werkzaam voor een school voor openbaar onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0028142#Artikel54
      [ref3]: https://wetten.overheid.nl/BWBR0004627#ArtikelX_6
