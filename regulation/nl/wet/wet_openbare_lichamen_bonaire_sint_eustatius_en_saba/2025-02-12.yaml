  - number: '178'
    text: |-
      1 In geval van oproerige beweging, van andere ernstige wanordelijkheden of van rampen of zware ongevallen,
      dan wel van ernstige vrees voor het ontstaan daarvan, is de gezaghebber bevoegd alle bevelen te geven die hij
      ter handhaving van de openbare orde of ter beperking van gevaar nodig acht. Daarbij kan van andere dan bij de
      [Grondwet][ref1] gestelde voorschriften worden afgeweken.

      2 De gezaghebber laat tot maatregelen van geweld niet overgaan dan na het doen van de nodige waarschuwing.


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel178
