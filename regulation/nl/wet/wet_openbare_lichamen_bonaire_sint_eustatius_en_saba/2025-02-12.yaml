  - number: '41'
    text: |-
      1 Bloed- of aanverwantschap tot en met de tweede graad of huwelijk mag niet bestaan tussen leden van het
      bestuurscollege.

      2 Voor de toepassing van het eerste lid wordt

      a. een ongehuwd samenlevende gelijkgesteld met een echtgenoot

      b. als ongehuwd tevens aangemerkt degene die duurzaam gescheiden leeft van zijn echtgenoot.

      3 In het tweede lid wordt verstaan onder ongehuwd samenlevende: de ongehuwde meerderjarige die met een andere
      ongehuwde meerderjarige een gezamenlijke huishouding voert, met uitzondering van bloedverwanten in de eerste graad

      4 In het derde lid wordt verstaan onder het voeren van een gezamenlijke huishouding de situatie waarin twee
      personen hun hoofdverblijf hebben in dezelfde woning en:

      a. zij blijk geven zorg te dragen voor elkaar door middel van het leveren van een bijdrage in de kosten van de
      huishouding dan wel anderszins;

      b. zij met elkaar gehuwd zijn geweest;

      c. zij elkaars geregistreerde partner zijn geweest;

      d. zij eerder met elkaar ongehuwd samenlevend zijn geweest, of

      e. de man het kind van de vrouw heeft erkend.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel41
  - number: '42'
    text: |-
      De benoeming van eilandgedeputeerden na de verkiezing van de leden van de eilandsraad vindt plaats in een
      vergadering van de eilandsraad in nieuwe samenstelling.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel42
  - number: '43'
    text: |-
      In het geval van [artikel 42][ref1] gaat de benoeming van degene die zijn benoeming tot eilandgedeputeerde heeft
      aangenomen, in op het tijdstip waarop ten minste de helft van het aantal eilandgedeputeerden zijn benoeming heeft
      aangenomen of, indien de aanneming van de benoeming op een later tijdstip plaatsvindt, op dat tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel42
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '42'
        hoofdstuk: III
        afdeling: III
  - number: '44'
    text: De benoeming ter vervulling van een plaats die tussentijds openvalt, geschiedt zo spoedig mogelijk.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel44
  - number: '45'
    text: |-
      De benoemde eilandgedeputeerde deelt de eilandsraad uiterlijk op de tiende dag na de kennisgeving van zijn
      benoeming mee of hij de benoeming aanneemt. Indien deze termijn verstrijkt zonder mededeling, wordt de benoemde
      eilandgedeputeerde geacht de benoeming niet aan te nemen.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel45
  - number: '46'
    text: Wanneer de benoeming niet is aangenomen, geschiedt zo spoedig mogelijk een nieuwe benoeming.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel46
  - number: '47'
    text: |-
      1 Alvorens hun functie te kunnen uitoefenen leggen de eilandgedeputeerden, in de vergadering van de eilandsraad, in
      handen van de voorzitter, de volgende eed (verklaring en belofte) af:

      «Ik zweer (verklaar) dat ik, om tot eilandgedeputeerde benoemd te worden, rechtstreeks noch middellijk, onder welke
      naam of welk voorwendsel ook, enige gift of gunst heb gegeven of beloofd.

      Ik zweer (verklaar en beloof) dat ik, om iets in dit ambt te doen of te laten, rechtstreeks noch middellijk enig
      geschenk of enige belofte heb aangenomen of zal aannemen.

      Ik zweer (beloof) dat ik getrouw zal zijn aan de [Grondwet][ref1], dat ik de wetten zal nakomen en dat ik mijn
      plichten als eilandgedeputeerde naar eer en geweten zal vervullen.

      Zo waarlijk helpe mij God Almachtig!»

      («Dat verklaar en beloof ik!»)

      2 In plaats van in het Nederlands kan de eed (verklaring en belofte) in het Papiaments of het Engels worden
      afgelegd.

      3 Wanneer de eed (verklaring en belofte) in het Papiaments wordt afgelegd, luidt de tekst van de eed (verklaring en
      belofte) als volgt:

      «Mi ta hura (deklará) ku pa mi nombramentu den e kargo o funshon di diputado, mi no a duna ni primintí, ni direkta-
      ni indirektamente, bou di ningun nòmber ni denominashon ni preteksto, ningun regalo ni fabor.

      Mi ta hura (deklará i primintí) ku mi no a risibí ni mi no a aseptá, ni lo mi no aseptá, ni direkta- ni
      indirektamente, ningun regalo ni ningun promesa di hasi algu o laga di hasi algu den e kargo o funshon en kuestion.

      Mi ta hura (primintí) ku lo mi ta fiel na Konstitushon, ku lo mi kumpli ku lei i ku lo mi kumpli ku mi
      obligashonnan komo diputado segun mi konsenshi i honor.

      Ku Dios Todopoderoso yudami!»

      (Esei mi ta deklará i primintí!»)

      4 Wanneer de eed (verklaring en belofte) in het Engels wordt afgelegd, luidt de tekst van de eed (verklaring en
      belofte) als volgt:

      «I swear (affirm) that I neither gave nor promised any gift or favour, either directly or indirectly, under any
      name or pretext whatsoever, in order to be appointed member of the island executive.

      I swear (affirm and promise) that I have made no gift or promise, and shall accept no gift or promise, either
      directly or indirectly, in order to do or to omit to do anything in the course of my duties.

      I swear (promise) that I will bear allegiance to the Constitution, that I will observe the laws and that I will
      perform my duties as member of the island executive in good faith.

      So help me God Almighty!

      (This I affirm and promise!)


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: '48'
    text: |-
      1 Een eilandgedeputeerde vervult geen nevenfuncties waarvan de uitoefening ongewenst is met het oog op een goede
      vervulling van zijn functie als eilandgedeputeerde.

      2 Een eilandgedeputeerde meldt zijn voornemen tot aanvaarding van een nevenfunctie aan de eilandsraad.

      3 Een eilandgedeputeerde maakt zijn nevenfuncties openbaar. De openbaarmaking vindt plaats terstond na benoeming
      tot eilandgedeputeerde of aanvaarding van een nevenfunctie en geschiedt zowel op elektronische wijze als door
      terinzagelegging van een opgave van de functies op het bestuurskantoor van het openbaar lichaam.

      4 Een eilandgedeputeerde maakt tevens de inkomsten uit nevenfuncties openbaar. Openbaarmaking geschiedt zowel
      op elektronische wijze als door terinzagelegging op het bestuurskantoor uiterlijk op 1 april na het kalenderjaar
      waarin de inkomsten zijn genoten.

      5 Onder inkomsten wordt verstaan: loon in de zin van [artikel 6 van de Wet loonbelasting BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029283#Artikel6
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0029283
        artikel: '6'
  - number: '49'
    text: |-
      1 Een eilandgedeputeerde dient bij de Rijksvertegenwoordiger binnen dertig dagen na aanneming van zijn benoeming en
      binnen dertig dagen na zijn ontslag een schriftelijke verklaring in met:

      a. een nauwkeurige omschrijving van de zakelijke belangen die hij en zijn echtgenoot hebben of beheren;

      b. een nauwkeurige omschrijving van de onroerende zaken, roerende zaken, op geld waardeerbare rechten alsmede
      vorderingen en schulden van hem en zijn echtgenoot;

      c. een nauwkeurige omschrijving van de aard van zijn nevenfuncties alsmede de functies van zijn echtgenoot;

      d. de vermelding of aan de nevenfuncties inkomsten of voordelen in welke vorm dan ook, zijn verbonden en voorzover
      een geldelijke vergoeding daaraan is verbonden de omvang daarvan.

      2 [Artikel 41, tweede tot en met vierde lid][ref1], is van toepassing.

      3 Geen opgave hoeft te worden gedaan van belangen, zaken, met uitzondering van onroerende zaken, rechten,
      vorderingen en schulden, waarvan de waarde niet meer dan USD 11 175 bedraagt.

      4 De verklaring wordt door de eilandgedeputeerde ondertekend.

      5 Bij ministeriële regeling wordt voor de verklaring een model vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel41
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel49
    references:
