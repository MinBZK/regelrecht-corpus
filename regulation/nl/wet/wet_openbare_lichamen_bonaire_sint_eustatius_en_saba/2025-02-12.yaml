  - number: '140'
    text: |-
      1 Het eilandsbestuur is bevoegd tot oplegging van een last onder bestuursdwang.

      2 De bevoegdheid tot oplegging van een last onder bestuursdwang wordt uitgeoefend door het bestuurscollege, indien
      de last dient tot handhaving van regels welke het eilandsbestuur uitvoert.

      3 De bevoegdheid tot oplegging van een last onder bestuursdwang wordt uitgeoefend door de gezaghebber, indien de
      last dient tot handhaving van regels welke hij uitvoert.

      4 De [artikelen 1:1, vierde lid][ref1], [4:116][ref2], [5:1 tot en met 5:10][ref3] en
      [titel 5.3 van de Algemene wet bestuursrecht][ref4] zijn van toepassing met dien verstande dat in
      [artikel 4:116][ref5] voor «het [Wetboek van Burgerlijke Rechtsvordering][ref6]» wordt gelezen: het
      [Wetboek van Burgerlijke Rechtsvordering BES][ref7].

      5 De [titels X][ref8] en [XI van het Wetboek van Strafvordering BES][ref9] zijn van overeenkomstige toepassing met
      dien verstande dat:

      a. de machtiging, bedoeld in [artikel 155 van het Wetboek van Strafvordering BES][ref10], wordt verleend door:

      1°. het bestuurscollege in de gevallen, bedoeld in het tweede lid;

      2°. de gezaghebber in de gevallen, bedoeld in het derde lid;

      b. het legitimatiebewijs, bedoeld in [artikel 162 van het Wetboek van Strafvordering BES][ref11], wordt uitgegeven
      door de gezaghebber;

      c. het schriftelijk verslag omtrent het binnentreden, bedoeld in
      [artikel 163 van het Wetboek van Strafvordering BES][ref12], wordt toegezonden aan:

      1°. het bestuurscollege in de gevallen, bedoeld in het tweede lid;

      2°. de gezaghebber in de gevallen, bedoeld in het derde lid.


