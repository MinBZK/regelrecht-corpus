    text: |-
      De toekenning van een vergoeding aan de waarnemend Rijksvertegenwoordiger wordt geregeld bij of krachtens algemene
      maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel201
  - number: '202'
    text: |-
      1 Voor zijn ondersteuning beschikt de Rijksvertegenwoordiger over een Bureau, dat hem bijstaat bij de uitoefening
      van zijn taken.

      2 De bezoldiging van de medewerkers van het Bureau, alsmede de bekostiging van de overige apparaatsuitgaven van het
      Bureau komen ten laste van de begroting van Onze Minister.

      3 De medewerkers van het Bureau worden door de Rijksvertegenwoordiger benoemd, bevorderd, geschorst en ontslagen.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel202
  - number: '203'
    text: |-
      Voor zover dit niet bij wet is geschied, worden bij of krachtens algemene maatregel van bestuur ten aanzien van de
      Rijksvertegenwoordiger en de waarnemend Rijksvertegenwoordiger regels vastgesteld betreffende:

      a. benoeming, herbenoeming, schorsing, tijdelijk niet uitoefenen van zijn functie en ontslag;

      b. onderzoek naar de geschiktheid en bekwaamheid;

      c. aanspraken in geval van ziekte;

      d. bescherming bij de arbeid;

      e. andere aangelegenheden, zijn rechtspositie betreffende, die regeling behoeven.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel203
  - number: '204'
    text: |-
      1 De Rijksvertegenwoordiger is in ieder geval belast met:

      a. het rapporteren aan Onze Minister wie het aangaat over aangelegenheden dan wel bijzondere bevindingen die de
      openbare lichamen betreffen;

      b. het goedkeuren van besluiten houdende benoeming, bevordering, schorsing en ontslag van eilandsambtenaren;

      c. het goedkeuren van besluiten tot het sluiten van een overeenkomst van opdracht als bedoeld in
      [Boek 7 van het Burgerlijk Wetboek BES][ref1], op grond waarvan de opdrachtnemer ten behoeve van het openbaar
      lichaam voor meer dan een maand en gedurende ten minste 16 uur gemiddeld per week werkzaamheden verricht of laat
      verrichten door derden;

      d. het doen van een aanbeveling tot benoeming en een voorstel tot herbenoeming van de gezaghebber;

      e. het goedkeuren van de eilandsverordeningen bedoeld in de [artikelen 14, vijfde lid][ref2],
      [35, vierde lid][ref3], [105, tweede lid][ref4], en [123, tweede lid][ref5];

      f. het verlenen van ontheffingen als bedoeld in de [artikelen 16, tweede lid][ref6] en [85, tweede lid][ref7];

      g. het bevorderen van de samenwerking tussen de in de openbare lichamen werkzame rijksambtenaren onderling en met
      de eilandsbesturen;

      h. het voorleggen aan Onze Minister wie het aangaat van besluiten en niet-schriftelijke beslissingen gericht op
      enig rechtsgevolg van de eilandsbesturen die naar zijn mening voor vernietiging in aanmerking komen;

      i. het voorzien in de waarneming van de gezaghebber indien hij dat in het belang van het openbaar lichaam nodig
      oordeelt;

      j. al het overige ter bevordering van goed bestuur in de openbare lichamen.

      2 Bij de wet kan de Rijksvertegenwoordiger worden belast met andere taken dan de taken, genoemd in het eerste lid.

      3 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de uitvoering van de
      taken, bedoeld in het eerste en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0028751
      [ref2]: https://wetten.overheid.nl/BWBR0028142#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0028142#Artikel35
      [ref4]: https://wetten.overheid.nl/BWBR0028142#Artikel105
      [ref5]: https://wetten.overheid.nl/BWBR0028142#Artikel123
      [ref6]: https://wetten.overheid.nl/BWBR0028142#Artikel16
      [ref7]: https://wetten.overheid.nl/BWBR0028142#Artikel85
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel204
