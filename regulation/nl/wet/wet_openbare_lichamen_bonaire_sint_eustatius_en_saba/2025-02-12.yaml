  - number: '99'
    text: |-
      1 Een lid van de gezamenlijke rekenkamer is niet tevens:

      a. minister;

      b. staatssecretaris;

      c. lid van de Raad van State;

      d. lid van de Algemene Rekenkamer;

      e. Nationale ombudsman;

      f. substituut-ombudsman als bedoeld in [artikel 9, eerste lid, van de Wet Nationale ombudsman][ref1];

      g. Rijksvertegenwoordiger;

      h. lid van een eilandsraad;

      i. gezaghebber;

      j. eilandgedeputeerde;

      k. lid van het kiescollege;

      l. gezamenlijke ombudsman of lid van de gezamenlijke ombudscommissie;

      m. lid van een commissie als bedoeld in de [artikelen 117][ref2] en [118][ref3];

      n. ambtenaar, door of vanwege het bestuur van een openbaar lichaam aangesteld of daaraan ondergeschikt;

      o. ambtenaar, door of vanwege het Rijk aangesteld, tot wiens taak behoort het verrichten van werkzaamheden in het
      kader van het toezicht op een openbaar lichaam;

      p. functionaris die krachtens de wet of een algemene maatregel van bestuur het bestuur van een openbaar lichaam van
      advies dient.

      2 In afwijking van het eerste lid, aanhef en onderdeel m, kan een lid van de gezamenlijke rekenkamer tevens zijn:

      a. ambtenaar van de burgerlijke stand;

      b. vrijwilliger of ander persoon die uit hoofde van een wettelijke verplichting niet bij wijze van beroep
      hulpdiensten verricht;

      c. ambtenaar werkzaam voor een school voor openbaar onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0028142#Artikel117
