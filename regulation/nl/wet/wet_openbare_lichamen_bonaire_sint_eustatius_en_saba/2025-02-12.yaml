    text: |-
      1 De eilandsraad kan aan het bestuurscollege bevoegdheden overdragen, tenzij de aard van de bevoegdheid zich
      daartegen verzet.

      2 De eilandsraad kan in ieder geval niet overdragen de bevoegdheid tot:

      a. de instelling van de gezamenlijke rekenkamer;

      b. de instelling van een onderzoek, bedoeld in [artikel 160, eerste lid][ref1], en
      [artikel 165a, eerste lid][ref2];

      c. de vaststelling of wijziging van de begroting, bedoeld in
      [artikel 15 van de Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba][ref3];

      d. de vaststelling van de jaarrekening, bedoeld in
      [artikel 29 van de Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba][ref4];

      e. het stellen van straf op overtreding van eilandsverordeningen;

      f. de vaststelling van de eilandsverordeningen, bedoeld in [artikelen 34, eerste lid][ref5] en
      [38, eerste lid, van de Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba][ref6];

      g. de aanwijzing van een of meer accountants, bedoeld in
      [artikel 38, derde lid, van de Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba][ref7];

      h. de heffing van andere belastingen dan de precariobelasting, bedoeld in
      [artikel 60 van de Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba][ref8], de rechten,
      genoemd in [artikel 62 van de Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba][ref9]
      en de rechten waarvan de heffing geschiedt krachtens andere wetten dan de
      [Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba][ref10].

      3 De bevoegdheid tot het vaststellen van eilandsverordeningen, door strafbepaling of bestuursdwang te handhaven,
      kan de eilandsraad slechts overdragen voor zover het betreft de vaststelling van nadere regels met betrekking tot
      bepaalde door hem in zijn eilandsverordeningen aangewezen onderwerpen.

      4 [Artikel 19 van de Bekendmakingswet][ref11] is van overeenkomstige toepassing op een besluit dat wordt genomen op
      grond van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel160
