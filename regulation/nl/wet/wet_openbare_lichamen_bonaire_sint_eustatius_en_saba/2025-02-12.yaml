        artikel: '41'
        hoofdstuk: III
        afdeling: III
  - number: '50'
    text: |-
      De Rijksvertegenwoordiger bewaart de verklaringen, bedoeld in [artikel 49][ref1], gedurende tien jaren, te rekenen
      vanaf het tijdstip waarop hij deze heeft ontvangen. Na afloop van deze termijn draagt hij zorg voor de vernietiging
      hiervan.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel49
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel50
