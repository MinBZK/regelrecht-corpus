  - number: '57'
    text: |-
      1 Indien degene wiens benoeming tot eilandgedeputeerde is ingegaan, een functie bekleedt als bedoeld in
      [artikel 40, eerste lid][ref1], en het tweede of vierde lid van dat artikel niet van toepassing zijn, draagt hij er
      onverwijld zorg voor dat hij uit die functie wordt ontheven.

      2 De eilandsraad verleent hem ontslag indien hij dit nalaat.

      3 Het ontslag gaat in terstond na de bekendmaking van het ontslagbesluit.

      4 Indien de eilandsraad naar het oordeel van de gezaghebber ten onrechte nalaat ontslag te verlenen, wordt de
      eilandgedeputeerde door de gezaghebber van zijn betrekking vervallen verklaard.

      5 De werking van een besluit, inhoudende de vervallenverklaring, wordt opgeschort totdat de beroepstermijn
      is verstreken of, indien beroep is ingesteld, op het beroep is beslist. Gedurende deze periode is de
      eilandgedeputeerde in zijn betrekking geschorst.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel40
