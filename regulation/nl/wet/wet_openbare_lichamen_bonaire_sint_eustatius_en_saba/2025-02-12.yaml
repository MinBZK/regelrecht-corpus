      2 Geen machtiging wordt verleend tot het nemen van besluiten ingevolge de [artikelen 155][ref1], [158][ref2],
      [174][ref3], [175][ref4], [176, tweede lid][ref5], [177][ref6], [178][ref7], [179][ref8] en [180][ref9] en tot
