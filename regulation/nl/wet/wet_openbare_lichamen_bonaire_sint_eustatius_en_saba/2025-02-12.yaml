        bwb_id: BWBR0003740
  - number: '109'
    text: |-
      1 Indien de eilandsraden besluiten tot het instellen van een gezamenlijke ombudsman benoemen zij deze voor de duur
      van zes jaar.

      2 De eilandsraden benoemen een plaatsvervangend gezamenlijke ombudsman. Deze paragraaf is op de plaatsvervangend
      gezamenlijke ombudsman van overeenkomstige toepassing.

      3 De gezamenlijke ombudsman wordt door de eilandsraden ontslagen:

      a. op eigen verzoek;

      b. wanneer hij door ziekte of gebreken blijvend ongeschikt is zijn functie te vervullen;

      c. bij de aanvaarding van een betrekking als bedoeld in [artikel 110, eerste lid][ref1];

      d. wanneer hij bij onherroepelijk geworden rechterlijke uitspraak wegens misdrijf is veroordeeld, dan wel hem bij
      zulk een uitspraak een maatregel is opgelegd die vrijheidsbeneming tot gevolg heeft;

      e. indien hij bij onherroepelijk geworden rechterlijke uitspraak onder curatele is gesteld, in staat van
      faillissement is verklaard, hij surseance van betaling heeft verkregen of wegens schulden is gegijzeld;

      f. indien hij naar het oordeel van de eilandsraden ernstig nadeel toebrengt aan het in hem gestelde vertrouwen.

      4 De eilandsraden stellen de gezamenlijke ombudsman op non-actief indien hij:

      a. zich in voorlopige hechtenis bevindt;

      b. bij een nog niet onherroepelijk geworden rechterlijke uitspraak wegens misdrijf is veroordeeld, dan wel hem bij
      zulk een uitspraak een maatregel is opgelegd die vrijheidsbeneming tot gevolg heeft;

      c. onder curatele is gesteld, in staat van faillissement is verklaard, hij surseance van betaling heeft verkregen
      of wegens schulden is gegijzeld ingevolge een nog niet onherroepelijk geworden rechterlijke uitspraak.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel110
