  - number: '161'
    text: |-
      1 Leden en gewezen leden van de eilandsraad, de gezaghebber en gewezen gezaghebbers, eilandgedeputeerden en
      gewezen eilandgedeputeerden, leden en gewezen leden van de gezamenlijke rekenkamer, leden en gewezen leden
      van een door de eilandsraad, het bestuurscollege of de gezaghebber ingestelde commissie, ambtenaren en gewezen
      ambtenaren, door of vanwege het eilandsbestuur aangesteld of daaraan ondergeschikt, zijn verplicht te voldoen aan
      een vordering van de onderzoekscommissie tot het verschaffen van inzage in, het nemen van afschrift van of het
      anderszins laten kennisnemen van alle bescheiden waarover zij beschikken en waarvan naar het redelijk oordeel van
      de onderzoekscommissie inzage, afschrift of kennisneming anderszins voor het doen van een onderzoek als bedoeld in
      [artikel 160][ref1] nodig is.

      2 Indien een vordering als bedoeld in het eerste lid betrekking heeft op bescheiden die afkomstig zijn van een
      instelling van de Europese Unie of van het Rijk en kennisneming van die bescheiden door de onderzoekscommissie
      het belang van de Europese Unie of de Staat kan schaden, wordt niet dan met toestemming van Onze Minister aan de
      vordering voldaan.

      3 Ambtenaren, door of vanwege het eilandsbestuur aangesteld of daaraan ondergeschikt, zijn gehouden om aan een
      onderzoek als bedoeld in [artikel 160][ref2] alle door de onderzoekscommissie gevorderde medewerking te verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel160
      [ref2]: https://wetten.overheid.nl/BWBR0028142#Artikel160
