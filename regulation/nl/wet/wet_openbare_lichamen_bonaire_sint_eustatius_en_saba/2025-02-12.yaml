  - number: 119c
    text: |-
      1 Een verplichting tot geheimhouding wordt vermeld op het stuk ten aanzien waarvan de geheimhouding geldt. Indien
      de geheimhouding geldt ten aanzien van informatie anders dan in schriftelijke vorm, wordt de verplichting op een
      passende wijze kenbaar gemaakt.

      2 Een verplichting tot geheimhouding wordt in acht genomen door allen die van de informatie kennis dragen.

      3 Een verplichting tot geheimhouding duurt voort totdat het orgaan dat de verplichting heeft opgelegd haar opheft.
      Indien de verplichting tot geheimhouding is opgelegd door een commissie, kan die verplichting tevens worden
      opgeheven door het orgaan dat de commissie heeft ingesteld.

      4 Indien informatie ten aanzien waarvan een verplichting tot geheimhouding geldt aan de eilandsraad is verstrekt,
      duurt die verplichting in afwijking van het derde lid voort totdat de eilandsraad haar opheft.

      5 Een lid van de eilandsraad of van een door de eilandsraad ingestelde commissie als bedoeld in
      [hoofdstuk III, afdeling VII][ref1], dat in strijd handelt met het tweede lid kan bij besluit van de eilandsraad
      ten hoogste drie maanden worden uitgesloten van het ontvangen van informatie ten aanzien waarvan een verplichting
      tot geheimhouding geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel119c
