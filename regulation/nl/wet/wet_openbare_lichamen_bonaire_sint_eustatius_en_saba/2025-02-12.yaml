  - number: '121'
    text: |-
      1 De leden van een door de eilandsraad, het bestuurscollege of de gezaghebber ingestelde commissie ontvangen, voor
      zover zij geen lid zijn van de eilandsraad of het bestuurscollege, een door de eilandsraad bij eilandsverordening
      vastgestelde vergoeding:

      a. voor het bijwonen van vergaderingen van een commissie en

      b. van reis- en verblijfkosten in verband met reizen binnen het openbaar lichaam.

      2 In bijzondere gevallen kan de eilandsraad bij eilandsverordening bepalen dat de leden van het dagelijks
      bestuur van een commissie als bedoeld in [artikel 118][ref1], een vaste vergoeding voor hun werkzaamheden en een
      tegemoetkoming in de kosten ontvangen.

      3 Ten aanzien van de vergoeding, bedoeld in het eerste lid, onderdeel a, worden bij of krachtens algemene maatregel
      van bestuur nadere regels gesteld. Ten aanzien van de overige vergoedingen bedoeld in dit artikel kunnen bij of
      krachtens algemene maatregel van bestuur nadere regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel118
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel121
    references:
      - id: ref1
