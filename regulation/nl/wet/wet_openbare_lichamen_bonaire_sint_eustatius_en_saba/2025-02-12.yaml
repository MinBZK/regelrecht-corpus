  - number: '141'
    text: |-
      1 In geval van toepassing van [artikel 231][ref1] kan de Rijksvertegenwoordiger een last
      onder bestuursdwang opleggen namens het eilandsbestuur en ten laste van het openbaar lichaam.
      [Artikel 140, vierde en vijfde lid][ref2], zijn alsdan van overeenkomstige toepassing met dien verstande dat
      de machtiging, bedoeld in het vijfde lid, onderdeel a, wordt verleend door de Rijksvertegenwoordiger, het
      legitimatiebewijs, bedoeld in het vijfde lid, onderdeel b, wordt uitgegeven door de Rijksvertegenwoordiger en dat
      het schriftelijk verslag, bedoeld in het vijfde lid, onderdeel c, wordt toegezonden aan de Rijksvertegenwoordiger.

      2 Het openbaar lichaam heeft in dat geval voor het bedrag van de te zijnen laste gebrachte kosten verhaal op de
      overtreder.

      3 De [artikelen 1:1, vierde lid][ref3], [4:116][ref4] en [5:10 van de Algemene wet bestuursrecht][ref5] zijn alsdan
      van toepassing.


