  - number: '159'
    text: |-
      1 Een lid van de eilandsraad kan het bestuurscollege of de gezaghebber mondeling of schriftelijk vragen stellen.

      2 Een lid van de eilandsraad kan de eilandsraad verlof vragen tot het houden van een interpellatie over een
      onderwerp dat niet staat vermeld op de agenda, bedoeld in [artikel 20, tweede lid][ref1], om het bestuurscollege of
      de gezaghebber hierover inlichtingen te vragen. De eilandsraad stelt hierover nadere regels.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel20
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel159
