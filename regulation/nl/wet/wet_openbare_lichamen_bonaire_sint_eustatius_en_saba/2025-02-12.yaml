  - number: '107'
    text: |-
      1 De eilandsraden kunnen voor de behandeling van verzoekschriften als bedoeld in
      [artikel 9:18, eerste lid, van de Algemene wet bestuursrecht][ref1] een gezamenlijke ombudsman of een gezamenlijke
      ombudscommissie instellen.

      2 Een gezamenlijke ombudsman of gezamenlijke ombudscommissie kan slechts per 1 januari van enig jaar worden
      ingesteld. Indien de eilandsraden hiertoe besluiten, zenden zij het besluit tot instelling aan de Nationale
      ombudsman voor 1 juli van het jaar voorafgaand aan het jaar waarin de instelling ingaat.

      3 De instelling van een gezamenlijke ombudsman of gezamenlijke ombudscommissie kan slechts per 1 januari van
      enig jaar worden beëindigd. Indien de eilandsraden hiertoe besluiten, zenden zij het besluit tot beëindiging van
      de instelling aan de Nationale ombudsman voor 1 juli van het jaar voorafgaand aan het jaar waarin de instelling
      eindigt.


