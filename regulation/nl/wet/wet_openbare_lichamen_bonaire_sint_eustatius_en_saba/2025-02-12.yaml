  - number: '162'
    text: |-
      1 Personen als bedoeld in [artikel 161][ref1] zijn verplicht te voldoen aan een oproep van de onderzoekscommissie
      om als getuige of deskundige te worden gehoord.

      2 Een getuige of deskundige die door de onderzoekscommissie wordt gehoord, is niet tevens lid van de
      onderzoekscommissie.

      3 De getuigen zijn verplicht getuigenis af te leggen.

      4 De deskundigen zijn verplicht hun diensten onpartijdig en naar beste weten als zodanig te verlenen.

      5 De onderzoekscommissie kan besluiten dat getuigen uitsluitend worden verhoord na het afleggen van een eed of
      belofte. Zij leggen dan in de vergadering van de onderzoekscommissie, in handen van de voorzitter, de eed of
      belofte af dat zij de gehele waarheid en niets dan de waarheid zullen zeggen.

      6 De getuigen en deskundigen worden in een openbare zitting van de onderzoekscommissie gehoord. Plaats en tijd van
      de openbare zitting worden door de voorzitter tijdig ter openbare kennis gebracht.

      7 De onderzoekscommissie kan om gewichtige redenen besluiten een verhoor of een gedeelte daarvan niet in het
      openbaar af te nemen. De leden en plaatsvervangende leden van de commissie bewaren geheimhouding over hetgeen hun
      tijdens een besloten zitting ter kennis komt.

      8 Een getuige is gerechtigd zich tijdens het verhoor te laten bijstaan. Om gewichtige redenen kan de commissie
      besluiten, dat een getuige zonder bijstand wordt gehoord.

      9 Verklaringen die zijn afgelegd voor de onderzoekscommissie kunnen, behalve in het geval van een strafrechtelijke
      procedure naar meineed, niet als bewijs in rechte gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel161
