  - number: '38'
    text: |-
      Het aantal eilandgedeputeerden bedraagt:

      a. drie in het openbaar lichaam Bonaire;

      b. twee in de openbare lichamen Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel38
  - number: '39'
    text: |-
      1 Voor de functie van eilandgedeputeerde gelden de vereisten voor het lidmaatschap van de eilandsraad, bedoeld
      in [artikel 11][ref1].

      2 Bij de benoeming is de beoogde eilandgedeputeerde in het bezit van een verklaring omtrent het gedrag als bedoeld in
      __REF000___________________________________________________________________________________________________________
      __, die niet ouder is dan drie maanden.

      3 De eilandsraad kan voor de duur van een jaar ontheffing verlenen van het vereiste van ingezetenschap.

      4 Dezelfde persoon kan niet in meer dan één openbaar lichaam eilandgedeputeerde zijn.


