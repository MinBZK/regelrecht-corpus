        artikel: '166'
        hoofdstuk: IV
        afdeling: II
      - id: ref2
        bwb_id: BWBR0028151
        artikel: '56'
  - number: '158'
    text: |-
      1 De eilandsraad kan bij eilandsverordening de gezaghebber de bevoegdheid verlenen om door de gezaghebber
      aangewezen groepen van personen, op een door de gezaghebber aangegeven plaats tijdelijk te doen ophouden.
      De ophouding kan mede omvatten, indien nodig, het overbrengen naar die plaats. Voor de vaststelling van de
      eilandsverordening bij stemming is de volstrekte meerderheid van het aantal zitting hebbende leden vereist.

      2 De gezaghebber oefent de bevoegdheid, bedoeld in het eerste lid, slechts uit:

      a. jegens personen die een door de raad bij eilandsverordening vastgesteld en daartoe aangewezen specifiek
      voorschrift dat strekt tot handhaving van de openbare orde of beperking van gevaar in omstandigheden als bedoeld in
      [artikel 178][ref1], groepsgewijs niet naleven, en

      b. indien het ophouden noodzakelijk is ter voorkoming van voortzetting of herhaling van de niet-naleving en de
      naleving redelijkerwijs niet op andere geschikte wijze kan worden verzekerd.

      3 De beslissing tot ophouding wordt op schrift gesteld. De schriftelijke beslissing is een beschikking. Indien de
      situatie dermate spoedeisend is dat de gezaghebber de beslissing tot ophouding niet tevoren op schrift kan stellen,
      zorgt hij alsnog zo spoedig mogelijk voor de opschriftstelling en voor de bekendmaking.

      4 De beschikking vermeldt welk voorschrift niet wordt nageleefd.

      5 De gezaghebber laat tot ophouding als bedoeld in het eerste lid niet overgaan dan nadat de personen uit de in het
      eerste lid bedoelde groep in de gelegenheid zijn gesteld de tenuitvoerlegging van de beschikking tot ophouding te
      voorkomen, door alsnog het voorschrift, bedoeld in het vierde lid, na te leven.

      6 De gezaghebber draagt er zorg voor dat zo spoedig mogelijk een verslag van de bevindingen inzake de
      tenuitvoerlegging van de ophouding wordt opgesteld.

      7 De ophouding mag niet langer duren dan de tijd die nodig is ter voorkoming van voortzetting of herhaling van de
      niet-naleving, met een maximum van twaalf uren.

      8 De plaats van ophouding dient geschikt te zijn voor de opvang van de op te houden personen. Bij algemene
      maatregel van bestuur kunnen nadere regels hieromtrent worden gesteld.

      9 De gezaghebber draagt er voor zover mogelijk zorg voor dat de opgehouden personen in de gelegenheid worden
      gesteld door een daartoe door hem aangewezen ambtenaar hun gegevens te laten vastleggen ten bewijze dat zij zijn
      opgehouden.

      10 De [artikelen 54][ref2] en [55 van de Wet administratieve rechtspraak BES][ref3] zijn niet van toepassing op de
      beschikking tot ophouding.

      11 Indien tegen de beschikking tot ophouding een verzoek om een voorlopige voorziening als bedoeld in
      [artikel 85 van de Wet administratieve rechtspraak BES][ref4] wordt gedaan:

      a. wordt, in afwijking van [artikel 86 van de van de Wet administratieve rechtspraak BES][ref5], de verzoeker die
      is opgehouden zo mogelijk nog tijdens zijn ophouding door de voorzieningenrechter gehoord;

      b. doet de voorzieningenrechter in afwijking van [artikel 86 van de Wet administratieve rechtspraak BES][ref6]
      onmiddellijk na het horen van partijen uitspraak, en

      c. wordt, in afwijking van [artikel 17][ref7] en [artikel 81 van de Wet administratieve rechtspraak BES][ref8],
      geen griffierecht geheven.

      12 Bij de beoordeling van het verzoek betrekt de voorzieningenrechter tevens de rechtmatigheid van de
      tenuitvoerlegging van de beschikking tot ophouding jegens verzoeker.

      13 Indien de voorzieningenrechter een of meer verzoeken toewijst op de grond dat de beschikking tot ophouding naar
      zijn voorlopig oordeel onrechtmatig is, kan hij bepalen dat alle personen die op basis van de betrokken beschikking
      zijn opgehouden, onverwijld in vrijheid worden gesteld.

      14 Het twaalfde lid is van overeenkomstige toepassing op de beoordeling van een beroep tegen de beschikking tot
      ophouding als bedoeld in [artikel 7 van de Wet administratieve rechtspraak BES][ref9].


