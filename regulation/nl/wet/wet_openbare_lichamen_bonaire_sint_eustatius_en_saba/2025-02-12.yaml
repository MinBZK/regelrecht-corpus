  - number: '179'
    text: |-
      1 Wanneer een omstandigheid als bedoeld in [artikel 178, eerste lid][ref1] zich voordoet, kan de gezaghebber
      algemeen verbindende voorschriften geven die ter handhaving van de openbare orde of ter beperking van gevaar nodig
      zijn. Daarbij kan van andere dan bij de [Grondwet][ref2] gestelde voorschriften worden afgeweken. Hij maakt deze
      voorschriften bekend op een door hem te bepalen wijze. Indien bekendmaking van deze voorschriften geschiedt op
      andere wijze dan door plaatsing in het afkondigingsblad van het openbaar lichaam, wordt van deze voorschriften zo
      spoedig mogelijk na bekendmaking mededeling gedaan in het afkondigingsblad.

      2 De gezaghebber brengt de voorschriften zo spoedig mogelijk ter kennis van de eilandsraad, van de
      Rijksvertegenwoordiger en van de officier van justitie, hoofd van het parket in eerste aanleg.

      3 De voorschriften vervallen, indien zij niet door de eilandsraad in zijn eerstvolgende vergadering die blijkens de
      presentielijst door meer dan de helft van het aantal zitting hebbende leden is bezocht, worden bekrachtigd.

      4 Indien de eilandsraad de voorschriften niet bekrachtigt, kan de gezaghebber binnen vierentwintig uren
      administratief beroep instellen bij de Rijksvertegenwoordiger. Deze beslist binnen twee dagen. Gedurende de
      beroepstermijn en de behandeling van het administratief beroep blijven de voorschriften van kracht.

      5 De Rijksvertegenwoordiger kan de werking van de voorschriften opschorten zolang zij niet bekrachtigd zijn. Het
      opschorten stuit onmiddellijk de werking van de voorschriften.

      6 Zodra een omstandigheid als bedoeld in [artikel 178, eerste lid][ref3], zich niet langer voordoet, trekt de
      gezaghebber de voorschriften in. Het tweede lid is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel178
      [ref2]: https://wetten.overheid.nl/BWBR0001840
      [ref3]: https://wetten.overheid.nl/BWBR0028142#Artikel178
