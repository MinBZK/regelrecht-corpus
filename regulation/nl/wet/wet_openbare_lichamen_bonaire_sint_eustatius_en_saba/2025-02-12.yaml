      1 Indien een eilandgedeputeerde niet langer voldoet aan de vereisten voor de functie van eilandgedeputeerde,
      bedoeld in [artikel 39][ref1], of een functie gaat bekleden als bedoeld in [artikel 40, eerste lid][ref2], en het
      tweede of vierde lid van dat artikel niet van toepassing zijn, neemt hij onmiddellijk ontslag. Hij doet hiervan
      schriftelijk mededeling aan de eilandsraad.

      2 De [artikelen 57, tweede tot en met vijfde lid][ref3], en [artikel 58][ref4] zijn van overeenkomstige toepassing.


