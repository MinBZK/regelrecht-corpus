  - number: '172'
    text: |-
      1 De gezaghebber ziet toe op:

      a. een tijdige voorbereiding, vaststelling en uitvoering van het beleid van het openbaar lichaam en van de daaruit
      voortvloeiende besluiten, alsmede op een goede afstemming tussen degenen die bij die voorbereiding, vaststelling en
      uitvoering zijn betrokken;

      b. een goede samenwerking van het openbaar lichaam met de andere openbare lichamen en andere overheden;

      c. de kwaliteit van procedures op het vlak van burgerparticipatie;

      d. een zorgvuldige behandeling van bezwaarschriften;

      e. een zorgvuldige behandeling van klachten door het eilandsbestuur.

      2 De gezaghebber bevordert de bestuurlijke integriteit van het openbaar lichaam.

      3 De gezaghebber bevordert overigens een goede behartiging van de aangelegenheden van het openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel172
  - number: '173'
    text: |-
      1 De gezaghebber vertegenwoordigt het openbaar lichaam in en buiten rechte.

      2 De gezaghebber kan de vertegenwoordiging opdragen aan een door hem aan te wijzen persoon.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel173
  - number: '174'
    text: |-
      1 De gezaghebber is belast met de handhaving van de openbare orde.

      2 De gezaghebber is bevoegd overtredingen van wettelijke voorschriften die betrekking hebben op de openbare orde,
      te beletten of te beëindigen. Hij bedient zich daarbij van de onder zijn gezag staande politie.

      3 De gezaghebber is bevoegd bij verstoring van de openbare orde of bij ernstige vrees voor het ontstaan daarvan, de
      bevelen te geven die noodzakelijk te achten zijn voor de handhaving van de openbare orde.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel174
  - number: '175'
    text: |-
      1 De gezaghebber heeft het opperbevel bij brand alsmede bij ongevallen anders dan bij brand voor zover de brandweer
      daarbij een taak heeft.

      2 De gezaghebber is bevoegd bij brand en ongevallen, bedoeld in het eerste lid, de bevelen te geven die met het oog
      op het voorkomen, beperken en bestrijden van gevaar nodig zijn.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel175
  - number: '176'
    text: |-
      1 De gezaghebber is belast met het toezicht op de openbare samenkomsten en vermakelijkheden alsmede op de voor het
      publiek openstaande gebouwen en daarbij behorende erven.

      2 De gezaghebber is bevoegd bij de uitoefening van het toezicht, bedoeld in het eerste lid, de bevelen te geven die
      met het oog op de bescherming van veiligheid en gezondheid nodig zijn.

      3 De gezaghebber is belast met de uitvoering van eilandsverordeningen voor zover deze betrekking hebben op het
      toezicht, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel176
  - number: '177'
    text: |-
      1 De gezaghebber kan besluiten een woning, een niet voor het publiek toegankelijk lokaal of een bij die woning of
      dat lokaal behorend erf te sluiten, indien:

      a. door gedragingen in de woning of het lokaal of op het erf de openbare orde rond de woning, het lokaal of het erf
      ernstig wordt verstoord;

      b. door ernstig geweld, of bedreiging daarmee, in of in de onmiddellijke nabijheid van de woning of het lokaal of
      op het erf of in de onmiddellijke nabijheid van het erf, de openbare orde rond de woning, het lokaal of het erf
      ernstig wordt verstoord of ernstige vrees bestaat voor het ontstaan van een zodanige verstoring;

      c. door het aantreffen in de woning of het lokaal of op het erf van een wapen als bedoeld in
      [artikel 1, tweede lid, van de Wapenwet BES][ref1] de openbare orde rond de woning, het lokaal of het erf ernstig
      wordt verstoord of ernstige vrees bestaat voor het ontstaan van een zodanige verstoring.

      2 De in het eerste lid, aanhef, genoemde bevoegdheid komt de gezaghebber eveneens toe in geval van ernstige vrees
      voor verstoring van de openbare orde op de grond dat de rechthebbende op de woning, het lokaal of het erf eerder
      een woning, een niet voor het publiek toegankelijk lokaal of een bij die woning of dat lokaal behorend erf op
      een zodanige wijze heeft gebruikt of doen gebruiken dat die woning, dat lokaal of dat erf op grond van het eerste
      lid, onderdeel a, is gesloten, en er aanwijzingen zijn dat betrokkene de woning, het lokaal of het erf ten aanzien
      waarvan hij rechthebbende is eveneens op een zodanige wijze zal gebruiken of doen gebruiken.

      3 De gezaghebber bepaalt in het besluit de duur van de sluiting. In geval van ernstige vrees voor herhaling of het
      ontstaan van de ernstige verstoring van de openbare orde kan hij besluiten de duur van de sluiting tot een door hem
      te bepalen tijdstip te verlengen.

      4 Bij de bekendmaking van het besluit worden belanghebbenden in de gelegenheid gesteld binnen een te stellen
      termijn maatregelen te treffen waardoor de ernstige verstoring van de openbare orde wordt beëindigd of voorkomen.
      De eerste volzin is niet van toepassing, indien voorafgaande bekendmaking in spoedeisende gevallen niet mogelijk
      is.

      5 De [artikelen 1:1, vierde lid][ref2], [4:116][ref3], [5:10][ref4] en
      [5:25 tot en met 5:28 van de Algemene wet bestuursrecht][ref5] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028756#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel4116
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel510
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel525
