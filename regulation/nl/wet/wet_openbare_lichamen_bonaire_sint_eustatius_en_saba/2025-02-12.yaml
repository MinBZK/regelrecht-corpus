  - number: '58'
    text: |-
      1 Tegen een besluit van de gezaghebber als bedoeld in [artikel 57, vierde lid][ref1], kan de eilandgedeputeerde
      beroep instellen bij het Gemeenschappelijk Hof van Justitie van Curaçao, Aruba, Sint Maarten en van Bonaire, Sint
      Eustatius en Saba.

      2 [De Wet administratieve rechtspraak BES][ref2] is voor zoveel nodig van overeenkomstige toepassing, met
      uitzondering van de [artikelen 54][ref3] en [55][ref4] en [paragraaf 1][ref5] en [3 van hoofdstuk 6][ref6].

      3 In afwijking van [artikel 17, vijfde lid, van de Wet administratieve rechtspraak BES][ref7] bedraagt de termijn
      binnen welke de bijschrijving of storting van het verschuldigde bedrag dient plaats te vinden, twee weken. De
      president van het Gemeenschappelijk Hof kan een kortere termijn stellen.

      4 Het Gemeenschappelijk Hof behandelt de zaak met overeenkomstige toepassing van
      [paragraaf 2 van hoofdstuk 6 van de Wet administratieve rechtspraak BES][ref8]. Aan de gezaghebber en degene die
      beroep heeft ingesteld wordt terstond een afschrift van het beroepschrift toegezonden.


