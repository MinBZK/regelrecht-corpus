  - number: '61'
    text: |-
      De rechter treedt niet in de beoordeling van de gronden waarop de eilandsraad tot ontslag van een
      eilandgedeputeerde heeft besloten.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel61
  - number: '62'
    text: |-
      Het bestuurscollege stelt een reglement van orde voor zijn vergaderingen en andere werkzaamheden vast, dat aan de
      eilandsraad wordt toegezonden.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel62
  - number: '63'
    text: |-
      1 De gezaghebber stelt, met inachtneming van hetgeen het bestuurscollege heeft bepaald, dag en plaats van de
      vergadering van het bestuurscollege en het tijdstip van de opening vast.

      2 De gezaghebber maakt dag en plaats van te houden openbare vergaderingen en het tijdstip van de opening bekend.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel63
  - number: '64'
    text: |-
      1 De gezaghebber bevordert de eenheid van het beleid van het bestuurscollege.

      2 De gezaghebber kan onderwerpen aan de agenda voor een vergadering van het bestuurscollege toevoegen.

      3 De gezaghebber kan ten aanzien van geagendeerde onderwerpen een eigen voorstel aan het bestuurscollege
      voorleggen.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel64
  - number: '65'
    text: |-
      1 De vergaderingen van het bestuurscollege worden met gesloten deuren gehouden, voor zover het bestuurscollege niet
      anders heeft bepaald.

      2 Het reglement van orde voor de vergaderingen kan regels geven omtrent de openbaarheid van de vergaderingen van
      het bestuurscollege.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel65
  - number: '67'
    text: |-
      1 In de vergadering van het bestuurscollege kan slechts worden beraadslaagd of besloten, indien ten minste de helft
      van het aantal zitting hebbende leden tegenwoordig is.

      2 Indien het vereiste aantal leden niet tegenwoordig is, belegt de gezaghebber, onder verwijzing naar dit artikel,
      opnieuw een vergadering.

      3 Op de vergadering, bedoeld in het tweede lid, is het eerste lid niet van toepassing. Het bestuurscollege kan
      echter over andere aangelegenheden dan die waarvoor de eerdere vergadering was belegd alleen beraadslagen of
      besluiten, indien ten minste de helft van het aantal zitting hebbende leden tegenwoordig is.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel67
  - number: '68'
    text: |-
      De leden van het bestuurscollege en andere personen die deelnemen aan de beraadslaging kunnen niet in rechte
      worden vervolgd of aangesproken voor hetgeen zij in de vergadering van het bestuurscollege hebben gezegd of aan het
      bestuurscollege schriftelijk hebben overgelegd.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel68
  - number: '69'
    text: |-
      De [artikelen 29, eerste tot en met derde lid][ref1], en [31][ref2] zijn ten aanzien van de vergaderingen van het
      bestuurscollege van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0028142#Artikel31
