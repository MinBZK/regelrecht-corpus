  - number: '120'
    text: |-
      1 De leden van de eilandsraad en de leden van de eilandsraad aan wie ingevolge [artikel Ya 13][ref1] juncto
      [artikel X 10 van de Kieswet][ref2] ontslag is verleend wegens zwangerschap en bevalling of ziekte ontvangen een
      bij eilandsverordening van de eilandsraad vast te stellen vergoeding voor hun werkzaamheden en een tegemoetkoming
      in de kosten.

      2 De eilandsraad kan bij eilandsverordening regels stellen over de tegemoetkoming in of vergoeding van bijzondere
      kosten en over andere voorzieningen die verband houden met de vervulling van het lidmaatschap van de eilandsraad.

      3 Het eerste en tweede lid zijn niet van toepassing op een lid van de eilandsraad dat met inachtneming van
      [artikel 14, tweede lid][ref3], tevens eilandgedeputeerde is.

      4 De eilandsverordeningen, bedoeld in het eerste en tweede lid, worden vastgesteld overeenkomstig bij of krachtens
      algemene maatregel van bestuur te stellen regels.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelYa_13
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelX_10
      [ref3]: https://wetten.overheid.nl/BWBR0028142#Artikel14
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel120
