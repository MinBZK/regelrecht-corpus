  - number: '92'
    text: |-
      De toekenning van een vergoeding ten laste van het openbaar lichaam aan degene die met de waarneming van het ambt
      van gezaghebber is belast, wordt geregeld bij of krachtens algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel92
  - number: '93'
    text: |-
      Ten aanzien van degene die met de waarneming van het ambt van gezaghebber is belast, zijn de [artikelen 75][ref1]
      en [79 tot en met 82][ref2] van overeenkomstige toepassing.


