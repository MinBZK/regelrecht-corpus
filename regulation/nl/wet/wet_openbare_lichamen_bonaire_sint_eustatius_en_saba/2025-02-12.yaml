      1 Bij verhindering of ontstentenis van de Rijksvertegenwoordiger wordt het ambt van Rijksvertegenwoordiger
      waargenomen door de waarnemend Rijksvertegenwoordiger.

      2 De waarnemend Rijksvertegenwoordiger wordt bij koninklijk besluit op voordracht van Onze Minister benoemd voor de
      tijd van zes jaar.

      3 Ten aanzien van de waarnemend Rijksvertegenwoordiger zijn de [artikelen 188, tweede, derde en vierde lid][ref1],
      [189 tot en met 192][ref2], [194 tot en met 196][ref3], [198][ref4] en [199][ref5] van overeenkomstige toepassing.


