      1 De voorschriften met betrekking tot de bevoegdheid van de eilandsraad, de uitoefening daarvan en het toezicht
      daarop zijn ten aanzien van de ingevolge [artikel 166][ref1] overgedragen bevoegdheden van overeenkomstige
      toepassing.

      2 Onder de in het eerste lid bedoelde voorschriften zijn niet begrepen die betreffende vergaderingen.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel166
