        hoofdstuk: III
        afdeling: III
  - number: '51'
    text: |-
      De Rijksvertegenwoordiger en degenen die in zijn opdracht handelen zijn verplicht tot geheimhouding van de op grond
      van [artikel 49][ref1] ontvangen verklaringen. Zij verstrekken de verklaringen of doen hierover slechts mededeling
      aan instanties die zijn belast met de opsporing en vervolging van strafbare feiten.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel49
    url: https://wetten.overheid.nl/BWBR0028142/2025-02-12#Artikel51
