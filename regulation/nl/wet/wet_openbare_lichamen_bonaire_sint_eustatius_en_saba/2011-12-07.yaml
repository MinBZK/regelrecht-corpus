  - number: '182.1'
    text: De gezaghebber is aan de eilandsraad verantwoording schuldig over het door hem gevoerde bestuur.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel182
  - number: '182.2'
    text: Hij geeft de eilandsraad alle inlichtingen die de eilandsraad voor de uitoefening van zijn taak nodig heeft.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel182
  - number: '182.3'
    text: |-
      Hij geeft de eilandsraad mondeling of schriftelijk de door een of meer leden gevraagde inlichtingen, tenzij het
      verstrekken ervan in strijd is met het openbaar belang.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel182
  - number: '183.1'
    text: |-
      De gezamenlijke rekenkamer onderzoekt de doelmatigheid, de doeltreffendheid en de rechtmatigheid van het door de
      eilandsbesturen gevoerde bestuur. Een door de gezamenlijke rekenkamer ingesteld onderzoek naar de rechtmatigheid
      van het door de eilandsbesturen gevoerde bestuur bevat geen controle van de jaarrekening als bedoeld in
      [artikel 38, derde lid, van de Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel38
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel183
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '38'
  - number: '183.2'
    text: Op verzoek van een of meer eilandsraden kan de gezamenlijke rekenkamer een onderzoek instellen.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel183
  - number: '184.1'
    text: |-
      De gezamenlijke rekenkamer is bevoegd alle documenten die berusten bij de eilandsbesturen te onderzoeken voor zover
      zij dat ter vervulling van haar taak nodig acht.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel184
  - number: '184.2'
    text: |-
      Het eilandsbestuur verstrekt desgevraagd alle inlichtingen die de gezamenlijke rekenkamer ter vervulling van haar
      taak nodig acht.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel184
  - number: '184.3'
    text: |-
      Indien de zorg voor een administratie aan een derde is uitbesteed, is het eerste lid van overeenkomstige toepassing
      op de administratie van de betrokken derde dan wel van degene die de administratie in opdracht van die derde voert.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel184
  - number: '185.1'
    text: |-
      De gezamenlijke rekenkamer heeft de in de volgende leden vermelde bevoegdheden ten aanzien van de volgende
      instellingen en over de volgende periode:
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel185
  - number: 185.1.a
    text: |-
      samenwerkingslichamen en gemeenschappelijke organen ingesteld krachtens de
      [Wet gemeenschappelijke regelingen][ref1], waaraan de openbare lichamen deelnemen, over de jaren dat door de
      openbare lichamen aan de regeling wordt deelgenomen;


      [ref1]: https://wetten.overheid.nl/BWBR0003740
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel185
    references:
      - id: ref1
        bwb_id: BWBR0003740
  - number: 185.1.b
    text: |-
      naamloze vennootschappen en besloten vennootschappen met beperkte aansprakelijkheid waarvan een openbaar lichaam
      meer dan vijftig procent van het geplaatste aandelenkapitaal houdt, over de jaren dat het desbetreffende openbaar
      lichaam meer dan vijftig procent van het geplaatste aandelenkapitaal houdt;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel185
  - number: 185.1.c
    text: |-
      andere privaatrechtelijke rechtspersonen waaraan een openbaar lichaam of een derde voor rekening en risico van het
      openbaar lichaam rechtstreeks of middellijk een subsidie, lening of garantie heeft verstrekt ten bedrage van ten
      minste vijftig procent van de baten van deze instelling, over de jaren waarop deze subsidie, lening of garantie
      betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel185
  - number: '185.2'
    text: |-
      De gezamenlijke rekenkamer is bevoegd bij de betrokken instelling nadere inlichtingen in te winnen over de
      jaarrekeningen, daarop betrekking hebbende rapporten van hen die deze jaarrekeningen hebben gecontroleerd en
      overige documenten met betrekking tot die instelling die bij het eilandsbestuur berusten. Indien een of meer
      documenten ontbreken, kan de gezamenlijke rekenkamer van de betrokken instelling de overlegging daarvan vorderen.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel185
  - number: '185.3'
    text: |-
      De gezamenlijke rekenkamer kan, indien de documenten, bedoeld in het tweede lid, daartoe aanleiding geven, bij de
      betrokken instelling dan wel bij de derde die de administratie in opdracht van de instelling voert, een onderzoek
      instellen. De gezamenlijke rekenkamer stelt de eilandsraad en het bestuurscollege van het betrokken openbare
      lichaam van haar voornemen een dergelijk onderzoek in te stellen in kennis.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel185
  - number: '186.1'
    text: |-
      De gezamenlijke rekenkamer legt haar bevindingen en haar oordeel vast in rapporten, met dien verstande dat hierin
      niet worden opgenomen gegevens en bevindingen die naar hun aard vertrouwelijk zijn.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel186
  - number: '186.2'
    text: |-
      De gezamenlijke rekenkamer deelt aan de eilandsraad en het bestuurscollege van het betrokken openbaar lichaam en,
      indien van toepassing, aan de betrokken instelling, de opmerkingen en bedenkingen mee die zij naar aanleiding van
      haar bevindingen van belang acht. Aan de eilandsraad of het bestuurscollege kan zij ter zake voorstellen doen.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel186
  - number: '186.3'
    text: |-
      De gezamenlijke rekenkamer stelt elk jaar voor 1 april een verslag op van haar werkzaamheden over het voorgaande
      jaar. Het verslag wordt door de gezamenlijke rekenkamer aan de eilandsraden en de bestuurscolleges van de openbare
      lichamen gezonden.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel186
  - number: '186.4'
    text: |-
      De gezamenlijke rekenkamer zendt een afschrift van haar rapporten aan de eilandsraad en
      het bestuurscollege van het betrokken openbare lichaam. Indien zij met toepassing van
      [artikel 38, elfde lid, van de Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba][ref1] een
      onderzoek heeft ingesteld, zendt de gezamenlijke rekenkamer tevens een afschrift van het rapport aan de betrokken
      instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel38
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel186
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '38'
  - number: '186.5'
    text: De rapporten en de verslagen van de gezamenlijke rekenkamer zijn openbaar.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel186
  - number: '187.1'
    text: Er is een Rijksvertegenwoordiger voor de openbare lichamen Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel187
  - number: '187.2'
    text: De Rijksvertegenwoordiger heeft zijn zetel in een bij koninklijk besluit te bepalen openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel187
  - number: '188.1'
    text: |-
      De Rijksvertegenwoordiger wordt bij koninklijk besluit op voordracht van Onze Minister benoemd voor de tijd van
      zes jaar.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel188
  - number: '188.2'
    text: |-
      De Rijksvertegenwoordiger kan bij koninklijk besluit op voordracht van Onze Minister worden herbenoemd voor de tijd
      van zes jaar.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel188
  - number: '188.3'
    text: |-
      Alvorens Onze Minister een voordracht als bedoeld in het eerste en tweede lid doet, wint hij over de voor te dragen
      persoon het gevoelen in van de bestuurscolleges van de openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel188
  - number: '189'
    text: |-
      De Rijksvertegenwoordiger kan te allen tijde bij koninklijk besluit op voordracht van Onze Minister worden
      ontslagen.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel189
  - number: '190.1'
    text: De Rijksvertegenwoordiger kan bij koninklijk besluit op voordracht van Onze Minister worden geschorst.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel190
  - number: '190.2'
    text: |-
      Onze Minister kan, in afwachting van het besluit omtrent schorsing, bepalen dat de Rijksvertegenwoordiger zijn
      functie niet uitoefent.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel190
  - number: '190.3'
    text: |-
      Een besluit als bedoeld in het tweede lid vervalt, indien niet binnen een maand een besluit omtrent de schorsing
      is genomen.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel190
  - number: '191'
    text: Voor de benoembaarheid tot Rijksvertegenwoordiger is het Nederlanderschap vereist.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel191
  - number: '192.1'
    text: |-
      Alvorens zijn ambt te aanvaarden, legt de Rijksvertegenwoordiger in handen van de Koning de volgende eed
      (verklaring en belofte) af: «Ik zweer (verklaar) dat ik, om tot Rijksvertegenwoordiger voor de openbare lichamen
      Bonaire, Sint Eustatius en Saba benoemd te worden, rechtstreeks noch middellijk, onder welke naam of welk
      voorwendsel ook, enige gift of gunst heb gegeven of beloofd. Ik zweer (verklaar en beloof) dat ik, om iets in
      dit ambt te doen of te laten, rechtstreeks noch middellijk enig geschenk of enige belofte heb aangenomen of zal
      aannemen. Ik zweer (beloof) dat ik getrouw zal zijn aan de [Grondwet][ref1], dat ik de wetten zal nakomen en dat
      ik mijn plichten als Rijksvertegenwoordiger voor de openbare lichamen Bonaire, Sint Eustatius en Saba naar eer en
      geweten zal vervullen. Zo waarlijk helpe mij God Almachtig!» (Dat verklaar en beloof ik!»)


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel192
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: '192.2'
    text: |-
      In geval van herbenoeming wordt de eed (verklaring en belofte) in handen van de Koning of in handen van Onze
      Minister, daartoe door de Koning gemachtigd, afgelegd.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel192
  - number: '193.1'
    text: |-
      De Rijksvertegenwoordiger geniet een bezoldiging, die bij of krachtens algemene maatregel van bestuur wordt
      geregeld. De bezoldiging komt ten laste van de begroting van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel193
  - number: '193.2'
    text: |-
      Bij de algemene maatregel van bestuur kunnen tevens regels worden gesteld betreffende tegemoetkoming in of
      vergoeding van bijzondere kosten en betreffende andere financiële voorzieningen die verband houden met de
      vervulling van het ambt van Rijksvertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel193
  - number: '193.3'
    text: |-
      Een krachtens het eerste lid vastgestelde algemene maatregel van bestuur treedt niet eerder in werking dan twee
      maanden na de datum van uitgifte van het Staatsblad waarin hij is geplaatst. Van de plaatsing wordt onverwijld
      mededeling gedaan aan de beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel193
  - number: '193.4'
    text: |-
      Buiten hetgeen hem bij of krachtens de wet is toegekend, geniet de Rijksvertegenwoordiger als zodanig geen
      inkomsten, in welke vorm ook, ten laste van het Rijk.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel193
  - number: '193.5'
    text: |-
      De Rijksvertegenwoordiger geniet geen vergoedingen, in welke vorm ook, voor werkzaamheden, verricht in
      nevenfuncties welke hij vervult uit hoofde van het ambt van Rijksvertegenwoordiger. Indien deze vergoedingen worden
      uitgekeerd, worden zij gestort in de Rijkskas.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel193
  - number: '193.6'
    text: |-
      Tot vergoedingen als bedoeld in het vijfde lid, behoren inkomsten, onder welke benaming ook, uit nevenfuncties die
      de Rijksvertegenwoordiger neerlegt bij beëindiging van het ambt.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel193
  - number: '193.7'
    text: |-
      Andere inkomsten dan die bedoeld in het vijfde lid worden met de bezoldiging verrekend overeenkomstig
      [artikel 3 van de Wet schadeloosstelling leden Tweede Kamer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004939#Artikel3
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel193
    references:
      - id: ref1
        bwb_id: BWBR0004939
        artikel: '3'
  - number: '193.8'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld over de wijze waarop de Rijksvertegenwoordiger gegevens
      over de inkomsten, bedoeld in het zevende lid, verstrekt, en de gevolgen van het niet verstrekken van deze
      gegevens.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel193
  - number: '194.1'
    text: |-
      De Rijksvertegenwoordiger vervult geen nevenfuncties waarvan de uitoefening ongewenst is met het oog op de
      goede vervulling van zijn ambt van Rijksvertegenwoordiger of op de handhaving van zijn onpartijdigheid en
      onafhankelijkheid of van het vertrouwen daarin.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel194
  - number: '194.2'
    text: |-
      De Rijksvertegenwoordiger meldt zijn voornemen tot aanvaarding van een nevenfunctie, anders dan uit hoofde van zijn
      ambt van Rijksvertegenwoordiger, aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel194
  - number: '194.3'
    text: |-
      De Rijksvertegenwoordiger maakt nevenfuncties, anders dan uit hoofde van zijn ambt van Rijksvertegenwoordiger,
      openbaar. De openbaarmaking vindt plaats terstond na benoeming tot Rijksvertegenwoordiger of aanvaarding
      van een nevenfunctie en geschiedt door terinzaggelegging van een opgave van de functies op het Bureau van de
      Rijksvertegenwoordiger, bedoeld in [artikel 202, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel202
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel194
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '202'
        hoofdstuk: V
        paragraaf: '1'
        afdeling: I
  - number: '194.4'
    text: |-
      De Rijksvertegenwoordiger maakt tevens de inkomsten uit de nevenfuncties, bedoeld in het derde lid, openbaar.
      Openbaarmaking geschiedt door terinzagelegging op het Bureau van de Rijksvertegenwoordiger uiterlijk op 1 april na
      het kalenderjaar waarin de inkomsten zijn genoten.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel194
  - number: '194.5'
    text: |-
      Onder inkomsten wordt verstaan: loon in de zin van [artikel 9 van de Wet op de loonbelasting 1964][ref1],
      verminderd met de eindheffingsbestanddelen bedoeld in [artikel 31 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel31
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel194
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '31'
  - number: '195'
