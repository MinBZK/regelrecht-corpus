  - number: '239'
    text: |-
      Onze Minister zendt binnen zes jaar na de inwerkingtreding van deze wet aan de beide kamers der Staten-Generaal een
      verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel239
  - number: '240'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel240
  - number: '241'
    text: 'Deze wet wordt aangehaald als: Wet openbare lichamen Bonaire, Sint Eustatius en Saba.'
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel241
