  - number: 195.e
    text: Nationale ombudsman;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel195
  - number: 195.f
    text: |-
      substituut-ombudsman als bedoeld in [artikel 9, eerste lid, van de Wet Nationale ombudsman][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001865#Artikel9
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel195
    references:
      - id: ref1
        bwb_id: BWBR0001865
        artikel: '9'
  - number: 195.g
    text: lid van een eilandsraad;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel195
  - number: 195.h
    text: gezaghebber;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel195
  - number: 195.i
    text: eilandgedeputeerde;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel195
  - number: 195.j
    text: lid van de gezamenlijke rekenkamer;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel195
  - number: 195.k
    text: gezamenlijke ombudsman of lid van de gezamenlijke ombudscommissie;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel195
  - number: 195.l
    text: ambtenaar, door of vanwege het bestuur van een openbaar lichaam aangesteld of daaraan ondergeschikt;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel195
  - number: 195.m
    text: |-
      functionaris die krachtens de wet of een algemene maatregel van bestuur het bestuur van een openbaar lichaam van
      advies dient.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel195
  - number: 195.n
    text: lid van provinciale staten;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel195
  - number: 195.o
    text: commissaris van de Koning;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel195
  - number: 195.p
    text: gedeputeerde van een provincie;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel195
  - number: 195.q
    text: lid van een gemeenteraad;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel195
  - number: 195.r
    text: burgemeester;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel195
  - number: 195.s
    text: wethouder;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel195
  - number: 195.t
    text: lid van een deelraad van een gemeente;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel195
  - number: 195.u
    text: lid van het dagelijks bestuur van een deelgemeente.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel195
  - number: '196'
    text: 'De Rijksvertegenwoordiger mag niet:'
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel196
  - number: 196.a
    text: |-
      als advocaat, procureur of adviseur in geschillen werkzaam zijn ten behoeve van een openbaar lichaam of een
      eilandsbestuur dan wel ten behoeve van de wederpartij van een openbaar lichaam of een eilandsbestuur;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel196
  - number: 196.b
    text: |-
      als gemachtigde in geschillen werkzaam zijn ten behoeve van de wederpartij van een openbaar lichaam of een
      eilandsbestuur;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel196
  - number: 196.c
    text: |-
      als vertegenwoordiger of adviseur werkzaam zijn ten behoeve van derden tot het met een openbaar lichaam aangaan
      van:
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel196
  - number: 196.c.1°
    text: overeenkomsten als bedoeld in onderdeel d;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel196
  - number: 196.c.2°
    text: overeenkomsten tot het leveren van onroerende zaken aan een openbaar lichaam;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel196
  - number: 196.d
    text: 'rechtstreeks of middellijk een overeenkomst aangaan betreffende:'
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel196
  - number: 196.d.1°
    text: het aannemen van werk ten behoeve van een openbaar lichaam;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel196
  - number: 196.d.2°
    text: het buiten dienstbetrekking tegen beloning verrichten van werkzaamheden ten behoeve van een openbaar lichaam;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel196
  - number: 196.d.3°
    text: het leveren van roerende zaken anders dan om niet aan een openbaar lichaam;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel196
  - number: 196.d.4°
    text: het verhuren van roerende zaken aan een openbaar lichaam;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel196
  - number: 196.d.5°
    text: het verwerven van betwiste vorderingen ten laste van een openbaar lichaam;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel196
  - number: 196.d.6°
    text: |-
      het van een openbaar lichaam onderhands verwerven van onroerende zaken of beperkte rechten waaraan deze zijn
      onderworpen;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel196
  - number: 196.d.7°
    text: het onderhands huren of pachten van een openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel196
  - number: '197'
    text: |-
      Het ambt van Rijksvertegenwoordiger ontheft van alle bij of krachtens de wet opgelegde verplichtingen tot het
      verrichten van persoonlijke diensten.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel197
  - number: '198.1'
    text: De Rijksvertegenwoordiger heeft zijn werkelijke woonplaats in één van de openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel198
  - number: '198.2'
    text: |-
      Onze Minister kan voor ten hoogste een jaar ontheffing verlenen van de verplichting om de werkelijke woonplaats in
      één van de openbare lichamen te hebben.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel198
  - number: '199.1'
    text: |-
      Indien de Rijksvertegenwoordiger langer dan zes weken buiten de openbare lichamen wenst te verblijven, behoeft hij
      daartoe de toestemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel199
  - number: '199.2'
    text: |-
      De Rijksvertegenwoordiger die buiten de openbare lichamen verblijft kan door Onze Minister wegens dringende redenen
      van dienstbelang worden teruggeroepen.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel199
  - number: '199.3'
    text: |-
      De [Algemene Termijnenwet][ref1] is niet van toepassing op de termijn, genoemd in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002448
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel199
    references:
      - id: ref1
        bwb_id: BWBR0002448
  - number: '200.1'
    text: |-
      Bij verhindering of ontstentenis van de Rijksvertegenwoordiger wordt het ambt van Rijksvertegenwoordiger
      waargenomen door de waarnemend Rijksvertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel200
  - number: '200.2'
    text: |-
      De waarnemend Rijksvertegenwoordiger wordt bij koninklijk besluit op voordracht van Onze Minister benoemd voor de
      tijd van zes jaar.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel200
  - number: '200.3'
    text: |-
      Ten aanzien van de waarnemend Rijksvertegenwoordiger zijn de [artikelen 188, tweede en derde lid][ref1],
      [189 tot en met 192][ref2], [194 tot en met 196][ref3], [198][ref4] en [199][ref5] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel188
      [ref2]: https://wetten.overheid.nl/BWBR0028142#Artikel189
      [ref3]: https://wetten.overheid.nl/BWBR0028142#Artikel194
      [ref4]: https://wetten.overheid.nl/BWBR0028142#Artikel198
      [ref5]: https://wetten.overheid.nl/BWBR0028142#Artikel199
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel200
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '188'
        hoofdstuk: V
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0028142
        artikel: '189'
        hoofdstuk: V
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0028142
        artikel: '194'
        hoofdstuk: V
        paragraaf: '1'
        afdeling: I
      - id: ref4
        bwb_id: BWBR0028142
        artikel: '198'
        hoofdstuk: V
        paragraaf: '1'
        afdeling: I
      - id: ref5
        bwb_id: BWBR0028142
        artikel: '199'
        hoofdstuk: V
        paragraaf: '1'
        afdeling: I
  - number: '201'
    text: |-
      De toekenning van een vergoeding aan de waarnemend Rijksvertegenwoordiger wordt geregeld bij of krachtens algemene
      maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel201
  - number: '202.1'
    text: |-
      Voor zijn ondersteuning beschikt de Rijksvertegenwoordiger over een Bureau, dat hem bijstaat bij de uitoefening van
      zijn taken.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel202
  - number: '202.2'
    text: |-
      De bezoldiging van de medewerkers van het Bureau, alsmede de bekostiging van de overige apparaatsuitgaven van het
      Bureau komen ten laste van de begroting van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel202
  - number: '202.3'
    text: De medewerkers van het Bureau worden door de Rijksvertegenwoordiger benoemd, bevorderd, geschorst en ontslagen.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel202
  - number: '203'
    text: |-
      Voor zover dit niet bij wet is geschied, worden bij of krachtens algemene maatregel van bestuur ten aanzien van de
      Rijksvertegenwoordiger en de waarnemend Rijksvertegenwoordiger regels vastgesteld betreffende:
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel203
  - number: 203.a
    text: benoeming, herbenoeming, schorsing, tijdelijk niet uitoefenen van zijn functie en ontslag;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel203
  - number: 203.b
    text: onderzoek naar de geschiktheid en bekwaamheid;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel203
  - number: 203.c
    text: aanspraken in geval van ziekte;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel203
  - number: 203.d
    text: bescherming bij de arbeid;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel203
  - number: 203.e
    text: andere aangelegenheden, zijn rechtspositie betreffende, die regeling behoeven.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel203
  - number: '204.1'
    text: 'De Rijksvertegenwoordiger is in ieder geval belast met:'
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel204
  - number: 204.1.a
    text: |-
      het rapporteren aan Onze Minister wie het aangaat over aangelegenheden dan wel bijzondere bevindingen die de
      openbare lichamen betreffen;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel204
  - number: 204.1.b
    text: het goedkeuren van besluiten houdende benoeming, bevordering, schorsing en ontslag van eilandsambtenaren;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel204
  - number: 204.1.c
    text: het doen van een aanbeveling tot benoeming en een voorstel tot herbenoeming van de gezaghebber;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel204
  - number: 204.1.d
    text: |-
      het goedkeuren van de eilandsverordeningen bedoeld in de [artikelen 14, vijfde lid][ref1], [35, vierde lid][ref2],
      [105, tweede lid][ref3], en [123, tweede lid][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0028142#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0028142#Artikel105
      [ref4]: https://wetten.overheid.nl/BWBR0028142#Artikel123
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel204
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '14'
        hoofdstuk: III
        afdeling: II
      - id: ref2
        bwb_id: BWBR0028142
        artikel: '35'
        hoofdstuk: III
        afdeling: II
      - id: ref3
        bwb_id: BWBR0028142
        artikel: '105'
        hoofdstuk: III
        afdeling: V
      - id: ref4
        bwb_id: BWBR0028142
        artikel: '123'
        hoofdstuk: III
        afdeling: VIII
  - number: 204.1.e
    text: |-
      het verlenen van ontheffingen als bedoeld in de [artikelen 16, tweede lid][ref1] en [85, tweede lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0028142#Artikel85
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel204
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '16'
        hoofdstuk: III
        afdeling: II
      - id: ref2
        bwb_id: BWBR0028142
        artikel: '85'
        hoofdstuk: III
        afdeling: IV
  - number: 204.1.f
    text: |-
      het bevorderen van de samenwerking tussen de in de openbare lichamen werkzame rijksambtenaren onderling en met
      de eilandsbesturen;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel204
  - number: 204.1.g
    text: |-
      het voorleggen aan Onze Minister wie het aangaat van besluiten en niet-schriftelijke beslissingen gericht op enig
      rechtsgevolg van de eilandsbesturen die naar zijn mening voor vernietiging in aanmerking komen;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel204
  - number: 204.1.h
    text: |-
      het voorzien in de waarneming van de gezaghebber indien hij dat in het belang van het openbaar lichaam nodig
      oordeelt;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel204
  - number: 204.1.i
    text: al het overige ter bevordering van goed bestuur in de openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel204
  - number: '204.2'
    text: Bij de wet kan de Rijksvertegenwoordiger worden belast met andere taken dan de taken, genoemd in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel204
  - number: '204.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de uitvoering van de
      taken, bedoeld in het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel204
  - number: '205.1'
    text: De Rijksvertegenwoordiger is verantwoording verschuldigd aan Onze Minister wie het aangaat.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel205
  - number: '205.2'
    text: |-
      Onze Minister wie het aangaat kan de Rijksvertegenwoordiger de nodige algemene en bijzondere aanwijzingen geven met
      betrekking tot de aan hem toegekende taken en bevoegdheden. Alvorens een aanwijzing te geven treedt Onze Minister
      wie het aangaat in overleg met Onze Minister.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel205
  - number: '205.3'
    text: De Rijksvertegenwoordiger verstrekt Onze Minister wie het aangaat desgevraagd inlichtingen over zijn werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel205
  - number: '206'
    text: |-
      De eilandsbesturen alsmede de onder hen ressorterende diensten en ambtenaren verlenen op verzoek van de
      Rijksvertegenwoordiger hun medewerking bij de uitoefening van de hem toegekende taken.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel206
  - number: '207'
    text: |-
      Onze Minister wie het aangaat en de Rijksvertegenwoordiger doen het bestuurscollege desgevraagd mededeling van hun
      standpunten en voornemens met betrekking tot aangelegenheden die voor het openbaar lichaam van belang zijn, tenzij
      het openbaar belang zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel207
  - number: '208'
    text: |-
      Onze Minister wie het aangaat en de Rijksvertegenwoordiger bieden het bestuurscollege desgevraagd de gelegenheid
      tot het plegen van overleg met betrekking tot aangelegenheden die voor het openbaar lichaam van belang zijn, tenzij
      het openbaar belang zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel208
  - number: '209.1'
    text: |-
      Onze Minister wie het aangaat stelt de betrokken bestuurscolleges of een instantie die voor deze representatief kan
      worden geacht, zo nodig binnen een te stellen termijn, in de gelegenheid hun oordeel te geven omtrent voorstellen
      van wet, ontwerpen van algemene maatregel van bestuur of ontwerpen van ministeriële regeling waarbij:
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel209
  - number: 209.1.a
    text: van de openbare lichamen regeling of bestuur wordt gevorderd;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel209
  - number: 209.1.b
    text: in betekenende mate wijziging wordt gebracht in de taken en bevoegdheden van het eilandsbestuur.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel209
  - number: '209.2'
    text: |-
      Voorstellen als bedoeld in het eerste lid bevatten in de bijbehorende toelichting een weergave van de gevolgen voor
      de inrichting en werking van de openbare lichamen en een weergave van het in het eerste lid bedoelde oordeel van de
      betrokken bestuurscolleges of representatieve instantie.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel209
  - number: '209.3'
    text: |-
      Onverminderd het eerste en tweede lid stelt Onze Minister wie het aangaat de betrokken bestuurscolleges of een
      instantie die voor deze representatief kan worden geacht, zo nodig binnen een te stellen termijn, vooraf in de
      gelegenheid hun oordeel te geven omtrent:
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel209
  - number: 209.3.a
    text: ingrijpende beleidsvoornemens, die uitsluitend op de openbare lichamen betrekking hebben;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel209
  - number: 209.3.b
    text: |-
      beleidsvoornemens ten aanzien van de openbare lichamen om op ingrijpende wijze af te wijken van regelgeving die van
      toepassing is in het Europese deel van Nederland.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel209
  - number: '209.4'
    text: |-
      Onze Minister wie het aangaat is niet verplicht vooraf het in het eerste en derde lid bedoelde oordeel in te winnen
      indien zulks ten gevolge van dringende omstandigheden niet mogelijk is. In dat geval wordt het oordeel zo spoedig
      mogelijk ingewonnen en openbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel209
  - number: '210.1'
    text: |-
      Een wet waarbij van de eilandsbesturen regeling of bestuur wordt gevorderd of waarbij in betekenende mate wijziging
      wordt gebracht in taken en bevoegdheden van de eilandsbesturen, wijkt van het bepaalde in deze wet niet af dan
      wanneer dat bijzonder aangewezen moet worden geacht voor de behartiging van het daarmee te dienen openbaar belang.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel210
  - number: '210.2'
    text: |-
      Het voorstel voor een wet als bedoeld in het eerste lid bevat in de bijbehorende toelichting de gronden voor de
      voorgestelde afwijking.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel210
  - number: '211.1'
    text: |-
      Onze Minister is belast met de coördinatie van het rijksbeleid dat de openbare lichamen raakt. Hij bevordert voorts
      de beleidsvrijheid van het eilandsbestuur.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel211
  - number: '211.2'
    text: |-
      Over maatregelen en voornemens die van betekenis zijn voor het rijksbeleid inzake de openbare lichamen treden Onze
      Ministers onder wier verantwoordelijkheid die maatregelen en voornemens tot stand komen in een vroegtijdig stadium
      in overleg met Onze Minister.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel211
  - number: '211.3'
    text: |-
      Onze Minister maakt bedenkingen kenbaar tegen een maatregel of een voornemen voor zover hem die maatregel of dat
      voornemen met het oog op het door de regering gevoerde decentralisatiebeleid niet toelaatbaar voorkomt.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel211
  - number: '212.1'
    text: Onze Minister bevordert de decentralisatie ten behoeve van de openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel212
  - number: '212.2'
    text: |-
      Voorstellen van maatregelen waarbij bepaalde aangelegenheden tot rijksbeleid worden gerekend, worden slechts
      gedaan indien het onderwerp van zorg niet op doelmatige en doeltreffende wijze door de eilandsbesturen kan worden
      behartigd.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel212
  - number: '213'
    text: |-
      Over al hetgeen het openbaar lichaam betreft dient het bestuurscollege Onze Ministers en de Rijksvertegenwoordiger
      desgevraagd van bericht en raad, tenzij dit uitdrukkelijk van de gezaghebber wordt verlangd.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel213
  - number: '214.1'
    text: |-
      Bij de wet of krachtens de wet bij algemene maatregel van bestuur worden de gevallen geregeld waarin het
      bestuurscollege verplicht is tot het verstrekken van systematische informatie aan Onze Minister wie het aangaat.
      Daarbij kan worden bepaald dat bij ministeriële regeling nadere voorschriften worden gegeven ten behoeve van de
      toepassing van de wet of de algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel214
  - number: '214.2'
    text: |-
      Bij algemene maatregel van bestuur op voordracht van Onze Minister van Economische Zaken, na overleg met Onze
      Minister, kan worden bepaald dat in die maatregel te omschrijven gegevens ten behoeve van statistische doeleinden
      aan het Centraal Bureau voor de Statistiek worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel214
  - number: '214.3'
    text: |-
      Omtrent de in het eerste en tweede lid bedoelde verstrekking van informatie en de inwinning daarvan worden bij
      algemene maatregel van bestuur nadere algemene regels gesteld.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel214
  - number: '214.4'
    text: |-
      Omtrent de in het eerste en tweede lid bedoelde verstrekking van informatie en de inwinning daarvan, alsmede
      omtrent de verstrekking en inwinning van incidentele informatie, wordt, voorzover dat niet bij wet geschiedt, bij
      algemene maatregel van bestuur aangegeven hoe de financiële gevolgen van de verplichting tot informatieverstrekking
      worden gecompenseerd.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel214
  - number: '214.5'
    text: |-
      De voordrachten voor de algemene maatregelen van bestuur, bedoeld in het derde en het vierde lid, worden gedaan
      door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel214
  - number: '215'
    text: |-
      De bevoegdheid tot het maken van eilandsverordeningen blijft ten aanzien van het onderwerp waarin door wetten of
      algemene maatregelen van bestuur is voorzien, gehandhaafd, voor zover de eilandsverordeningen met die wetten en
      algemene maatregelen van bestuur niet in strijd zijn.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel215
  - number: '216'
    text: |-
      De bepalingen van eilandsverordeningen in wier onderwerp door een wet of een algemene maatregel van bestuur wordt
      voorzien, zijn van rechtswege vervallen.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel216
  - number: '217.1'
    text: Beslissingen van eilandsbesturen kunnen slechts aan goedkeuring worden onderworpen in bij de wet bepaalde gevallen.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel217
  - number: '217.2'
    text: |-
      Op de goedkeuring van beslissingen van eilandsbesturen is [afdeling 10.2.1 van de Algemene wet bestuursrecht][ref1]
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling10.2.1
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel217
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 10.2.1
  - number: '218.1'
    text: |-
      Een beslissing die aan goedkeuring bij koninklijk besluit is onderworpen, wordt toegezonden aan Onze Minister wie
      het aangaat.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel218
  - number: '218.2'
    text: Een voordracht tot onthouding van goedkeuring wordt gedaan door of mede door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel218
  - number: '218.3'
    text: |-
      Onthouding van goedkeuring geschiedt niet, dan nadat de Raad van State is gehoord. De toepassing van
      [artikel 10:30, eerste lid, van de Algemene wet bestuursrecht][ref1] vindt in dat geval plaats voordat het ontwerp-
      besluit bij de Raad van State ter overweging wordt gebracht. [Artikel 18a van de Wet op de Raad van State][ref2] is
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002367#Artikel18a
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel218
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0002367
        artikel: 18a
  - number: '219'
    text: |-
      Op de schorsing en vernietiging van beslissingen van eilandsbesturen zijn [afdeling 10.2.2][ref1] en
      [10.2.3 van de Algemene wet bestuursrecht][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling10.2.2
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling10.2.3
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel219
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 10.2.2
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: 10.2.3
  - number: '220'
    text: |-
      Een besluit dan wel een niet-schriftelijke beslissing gericht op enig rechtsgevolg van het eilandsbestuur kan bij
      koninklijk besluit worden vernietigd.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel220
  - number: '221'
    text: |-
      De gezaghebber zendt elk eilandsbesluit van algemene strekking, dat niet is bekendgemaakt in het afkondigingsblad
      van het openbaar lichaam, binnen twee dagen na de bekendmaking daarvan aan de Rijksvertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel221
  - number: '222.1'
    text: |-
      Indien een besluit naar het oordeel van de Rijksvertegenwoordiger voor vernietiging in aanmerking komt, doet hij
      daarvan binnen twee dagen na de bekendmaking van het besluit, of, indien het betreft een besluit als bedoeld in
      [artikel 221][ref1], binnen twee dagen nadat het te zijner kennis is gekomen, mededeling aan Onze Minister wie het
      aangaat. Hij geeft hiervan tegelijkertijd kennis aan het orgaan dat het besluit nam, en zo nodig aan het orgaan dat
      met de uitvoering van het besluit is belast.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel221
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel222
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '221'
        hoofdstuk: V
        paragraaf: '2'
        afdeling: III
  - number: '222.2'
    text: |-
      Het besluit ten aanzien waarvan het eerste lid toepassing heeft gevonden, wordt niet of niet verder uitgevoerd,
      voordat van Onze Minister wie het aangaat de mededeling is ontvangen, dat voor schorsing of vernietiging
      geen redenen bestaan. Indien het besluit niet binnen vier weken na de dagtekening van de mededeling van de
      Rijksvertegenwoordiger is geschorst of vernietigd, wordt het uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel222
  - number: '223.1'
    text: |-
      Indien een besluit naar het oordeel van de gezaghebber voor vernietiging in aanmerking komt, doet hij daarvan
      binnen twee dagen nadat het te zijner kennis is gekomen, door tussenkomst van de Rijksvertegenwoordiger, mededeling
      aan Onze Minister wie het aangaat. Hij geeft hiervan tegelijkertijd kennis aan het orgaan dat het besluit nam, en
      zo nodig aan het orgaan dat met de uitvoering van het besluit is belast.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel223
  - number: '223.2'
    text: |-
      De Rijksvertegenwoordiger zendt de stukken, vergezeld van zijn advies, binnen een week na de dagtekening van de
      mededeling van de gezaghebber toe aan Onze Minister wie het aangaat.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel223
  - number: '223.3'
    text: |-
      [Artikel 222, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel222
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel223
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '222'
        hoofdstuk: V
        paragraaf: '2'
        afdeling: III
  - number: '224.1'
    text: Een voordracht tot schorsing wordt gedaan door Onze Minister wie het aangaat.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel224
  - number: '224.2'
    text: |-
      Over de voordracht pleegt Onze Minister wie het aangaat overleg met Onze Minister, tenzij schorsing onverwijld
      plaats dient te vinden. In de voordracht wordt het achterwege blijven van overleg gemotiveerd.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel224
  - number: '225'
    text: |-
      Indien een bekend gemaakt besluit niet is vernietigd binnen de tijd waarvoor het is geschorst, wordt hiervan door
      het eilandsbestuur openbaar kennis gegeven.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel225
  - number: '226.1'
    text: De voordracht tot vernietiging wordt gedaan door of mede door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel226
  - number: '226.2'
    text: |-
      [Artikel 15, derde lid, van de Wet op de Raad van State][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002367#Artikel15
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel226
    references:
      - id: ref1
        bwb_id: BWBR0002367
        artikel: '15'
  - number: '227'
    text: |-
      Het koninklijk besluit tot schorsing, opheffing of verlenging van de schorsing of tot vernietiging wordt in het
      Staatsblad geplaatst.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel227
  - number: '228'
    text: |-
      Het eilandsbestuur neemt opnieuw een besluit omtrent het onderwerp van het vernietigde besluit, waarbij met het
      koninklijk besluit wordt rekening gehouden.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel228
  - number: '229.1'
    text: |-
      In afwijking van
      __REF000___________________________________________________________________________________________________________
      ____________ kan een belanghebbende tegen een koninklijk besluit als bedoeld in [artikel 220][ref2] binnen zes
      weken nadat het besluit is bekendgemaakt beroep instellen bij de Afdeling bestuursrechtspraak van de Raad van
      State.


      [ref1]: https://wetten.overheid.nl/BWBR0028063#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0028142#Artikel220
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel229
    references:
      - id: ref1
        bwb_id: BWBR0028063
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0028142
        artikel: '220'
        hoofdstuk: V
        paragraaf: '2'
        afdeling: III
  - number: '229.2'
    text: |-
      Geen beroep kan worden ingesteld tegen de weigering om de vernietiging te bevorderen en tegen het niet tijdig nemen
      van een besluit tot vernietiging.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel229
  - number: '230'
    text: |-
      Wanneer de eilandsraad bij of krachtens een andere dan deze wet of de
      [Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba][ref1] gevorderde beslissingen niet of niet naar
      behoren neemt, voorziet het bestuurscollege daarin.


      [ref1]: https://wetten.overheid.nl/BWBR0028151
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel230
    references:
      - id: ref1
        bwb_id: BWBR0028151
  - number: '231.1'
    text: |-
      Wanneer het bestuurscollege of de gezaghebber bij of krachtens een andere dan deze wet of de
      [Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba][ref1] gevorderde beslissingen niet of niet naar
      behoren neemt, voorziet de Rijksvertegenwoordiger daarin namens het bestuurscollege of de gezaghebber en ten laste
      van het openbaar lichaam.


      [ref1]: https://wetten.overheid.nl/BWBR0028151
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel231
    references:
      - id: ref1
        bwb_id: BWBR0028151
  - number: '231.2'
    text: |-
      Spoedeisende gevallen uitgezonderd, vindt het eerste lid geen toepassing dan nadat het
      bestuurscollege, onderscheidenlijk de gezaghebber in de gelegenheid is gesteld binnen een door de
      Rijksvertegenwoordiger gestelde termijn alsnog de bij of krachtens een andere dan deze wet of de
      [Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba][ref1] gevorderde beslissingen te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0028151
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel231
    references:
      - id: ref1
        bwb_id: BWBR0028151
  - number: '232'
    text: |-
      Bij de wet kunnen met afwijking van de [artikelen 5][ref1] en [149][ref2] voorzieningen worden getroffen voor het
      geval het bestuur van een openbaar lichaam zijn taken grovelijk verwaarloost.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0028142#Artikel149
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel232
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '5'
        hoofdstuk: III
        afdeling: I
      - id: ref2
        bwb_id: BWBR0028142
        artikel: '149'
        hoofdstuk: IV
        afdeling: II
  - number: '233.1'
    text: |-
      De eilandsraden, die op de dag voor de inwerkingtreding van deze wet fungeren als eilandsraden van de
      eilandgebieden Bonaire, Sint Eustatius en Saba, worden aangemerkt als eilandsraad van het openbaar lichaam Bonaire,
      het openbaar lichaam Sint Eustatius, onderscheidenlijk het openbaar lichaam Saba.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel233
  - number: '233.2'
    text: |-
      De leden van de eilandsraden, bedoeld in het eerste lid, worden geacht te zijn gekozen tot lid van de eilandsraad
      van het openbaar lichaam Bonaire, het openbaar lichaam Sint Eustatius, onderscheidenlijk het openbaar lichaam
      Saba. Zij treden, behoudens in het geval van tussentijds aftreden of overlijden, af met ingang van de dag waarop
      de leden van provinciale staten, die op de dag voor de inwerkingtreding van deze wet zitting hebben, ingevolge
      [artikel C 4, tweede lid, van de Kieswet][ref1] aftreden.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelC_4
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel233
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: C_4
  - number: '233.3'
    text: 'Tot het moment van aftreden, bedoeld in het tweede lid:'
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel233
  - number: 233.3.a
    text: |-
      is [artikel 14][ref1] slechts van toepassing voor zover de Eilandenregeling Nederlandse Antillen, zoals die luidde
      op de dag voor de inwerkingtreding van deze wet, ter zake eveneens een verbod inhield;


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel14
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel233
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '14'
        hoofdstuk: III
        afdeling: II
  - number: 233.3.b
    text: |-
      worden de vergoeding, tegemoetkoming in de kosten en andere financiële voorzieningen, bedoeld in
      [artikel 120, eerste en tweede lid][ref1], vastgesteld bij algemene maatregel van bestuur in plaats van bij
      eilandsverordening.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel120
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel233
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '120'
        hoofdstuk: III
        afdeling: VIII
  - number: '233.4'
    text: |-
      In afwijking van [artikel 14, vijfde lid][ref1], wordt een eilandsverordening als bedoeld in artikel 14, vierde
      lid, onderdeel d, die betrekking heeft op de eilandsraad van Sint Eustatius of Saba die op 2 maart 2011 wordt
      gekozen uiterlijk vastgesteld op 1 december 2010.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel14
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel233
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '14'
        hoofdstuk: III
        afdeling: II
  - number: '234.1'
    text: |-
      De gedeputeerden, die op de dag voor de inwerkingtreding van deze wet fungeren als gedeputeerden van de
      eilandgebieden Bonaire, Sint Eustatius en Saba, worden geacht voor de resterende duur van hun benoeming
      te zijn benoemd door de eilandsraad van het openbaar lichaam Bonaire, het openbaar lichaam Sint Eustatius,
      onderscheidenlijk het openbaar lichaam Saba, tot eilandgedeputeerde van het openbaar lichaam Bonaire, het openbaar
      lichaam Sint Eustatius, onderscheidenlijk het openbaar lichaam Saba.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel234
  - number: '234.2'
    text: |-
      Tot het moment dat de eilandgedeputeerden voor de eerste keer na de inwerkingtreding van deze wet op grond van
      [artikel 54][ref1] zijn afgetreden bedraagt het aantal eilandgedeputeerden:


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel54
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel234
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '54'
        hoofdstuk: III
        afdeling: III
  - number: 234.2.a
    text: vier in het openbaar lichaam Bonaire;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel234
  - number: 234.2.b
    text: twee in de openbare lichamen Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel234
  - number: '234.3'
    text: 'Tot het moment van aftreden, bedoeld in het tweede lid:'
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel234
  - number: 234.3.a
    text: |-
      is [artikel 40][ref1] slechts van toepassing voor zover de Eilandenregeling Nederlandse Antillen, zoals die luidde
      op de dag voor de inwerkingtreding van deze wet, ter zake eveneens een verbod inhield;


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel40
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel234
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '40'
        hoofdstuk: III
        afdeling: III
  - number: 234.3.b
    text: |-
      is [artikel 56, derde tot en met zevende lid][ref1], niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel56
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel234
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '56'
        hoofdstuk: III
        afdeling: III
  - number: '234.4'
    text: |-
      [Artikel 49][ref1] is niet van toepassing op de eilandgedeputeerden, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel49
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel234
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '49'
        hoofdstuk: III
        afdeling: III
  - number: '235.1'
    text: |-
      De gezaghebbers, die op de dag voor de inwerkingtreding van deze wet fungeren als gezaghebbers van de
      eilandgebieden Bonaire, Sint Eustatius en Saba, worden geacht voor de resterende duur van hun benoeming te zijn
      benoemd tot gezaghebbers van het openbaar lichaam Bonaire, het openbaar lichaam Sint Eustatius, onderscheidenlijk
      het openbaar lichaam Saba.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel235
  - number: '235.2'
    text: 'Ten aanzien van de gezaghebbers, bedoeld in het eerste lid, is gedurende de resterende tijd van hun benoeming:'
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel235
  - number: 235.2.a
    text: |-
      [artikel 78, vierde tot en met zevende lid][ref1], niet van toepassing;


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel78
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel235
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '78'
        hoofdstuk: III
        afdeling: IV
  - number: 235.2.b
    text: |-
      [artikel 80][ref1] slechts van toepassing voor zover de Eilandenregeling Nederlandse Antillen, zoals die luidde op
      de dag voor de inwerkingtreding van deze wet, ter zake eveneens een verbod inhield.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel80
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel235
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '80'
        hoofdstuk: III
        afdeling: IV
  - number: '235.3'
    text: |-
      [Artikel 83][ref1] is niet van toepassing op de gezaghebbers, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel83
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel235
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '83'
        hoofdstuk: III
        afdeling: IV
  - number: '236'
    text: De gezamenlijke rekenkamer wordt ingesteld binnen twee jaar na inwerkingtreding van deze wet.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel236
  - number: '237.1'
    text: De eilandgriffier wordt benoemd binnen één jaar na inwerkingtreding van deze wet.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel237
  - number: '237.2'
    text: |-
      Tot de datum waarop de eilandgriffier wordt benoemd staat de eilandsecretaris de eilandsraad en de door hem
      ingestelde commissies bij de uitoefening van hun taak terzijde.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel237
  - number: '237.3'
    text: |-
      Tot de datum waarop de eilandgriffier is benoemd blijft de medeondertekening van de stukken die van de eilandsraad
      uitgaan, bedoeld in [artikel 34][ref1], achterwege.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel34
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel237
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '34'
        hoofdstuk: III
        afdeling: II
  - number: '238'
    text: |-
      De eilandsverordeningen, bedoeld in de [artikelen 35, derde lid][ref1] en [154][ref2], alsmede de gedragscodes,
      bedoeld in de [artikelen 16, derde lid][ref3], [53, tweede lid][ref4] en [82, tweede lid][ref5], worden vastgesteld
      binnen een jaar na de dag van de inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0028142#Artikel154
      [ref3]: https://wetten.overheid.nl/BWBR0028142#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0028142#Artikel53
