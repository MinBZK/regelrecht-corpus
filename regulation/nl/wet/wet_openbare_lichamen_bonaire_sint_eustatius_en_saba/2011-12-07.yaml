---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht-mvp/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_openbare_lichamen_bonaire_sint_eustatius_en_saba
regulatory_layer: WET
publication_date: '2024-07-02'
valid_from: '2011-12-07'
bwb_id: BWBR0028142
url: https://wetten.overheid.nl/BWBR0028142/2011-12-07
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat met de eilandgebieden Bonaire, Sint Eustatius en Saba is overeengekomen
    dat zij een staatsrechtelijke positie krijgen binnen het Nederlandse staatsbestel en worden ingericht als openbaar
    lichaam in de zin van artikel 134 van de Grondwet en dat het in verband hiermee wenselijk is de instelling en
    inrichting van deze openbare lichamen te regelen, de samenstelling en bevoegdheid van hun besturen, de openbaarheid
    van hun vergaderingen alsmede het toezicht op deze besturen, waarbij voor zover mogelijk aansluiting wordt gezocht
    bij het gemeentelijk bestuursmodel;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel1
  - number: 1.1.a
    text: '*openbaar lichaam:* openbaar lichaam Bonaire, Sint Eustatius of Saba;'
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel1
  - number: 1.1.b
    text: '*eilandsbestuur:* ieder bevoegd orgaan van het openbaar lichaam;'
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel1
  - number: 1.1.c
    text: '*Onze Minister:* Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;'
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel1
  - number: 1.1.d
    text: '*Rijksvertegenwoordiger:* Rijksvertegenwoordiger voor de openbare lichamen Bonaire, Sint Eustatius en Saba.'
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel1
  - number: '1.2'
    text: |-
      In deze wet wordt onder ambtenaar mede verstaan: degene die op arbeidsovereenkomst naar burgerlijk recht werkzaam
      is.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel1
  - number: '2.1'
    text: Er is een openbaar lichaam Bonaire.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel2
  - number: '2.2'
    text: Het openbaar lichaam Bonaire omvat de eilanden Bonaire en Klein Bonaire.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel2
  - number: '2.3'
    text: Het openbaar lichaam Bonaire bezit rechtspersoonlijkheid.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel2
  - number: '3.1'
    text: Er is een openbaar lichaam Sint Eustatius.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel3
  - number: '3.2'
    text: Het openbaar lichaam Sint Eustatius omvat het eiland Sint Eustatius.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel3
  - number: '3.3'
    text: Het openbaar lichaam Sint Eustatius bezit rechtspersoonlijkheid.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel3
  - number: '4.1'
    text: Er is een openbaar lichaam Saba.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel4
  - number: '4.2'
    text: Het openbaar lichaam Saba omvat het eiland Saba.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel4
  - number: '4.3'
    text: Het openbaar lichaam Saba bezit rechtspersoonlijkheid.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel4
  - number: 4a
    text: Bij algemene maatregel van bestuur worden de grenzen van de openbare lichamen vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel4a
  - number: '5'
    text: In elk openbaar lichaam is een eilandsraad, een bestuurscollege en een gezaghebber.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel5
  - number: '6'
    text: De eilandsraad vertegenwoordigt de gehele bevolking van het openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel6
  - number: '7.1'
    text: |-
      De leden van de eilandsraad worden gekozen op de grondslag van evenredige vertegenwoordiging binnen door de wet te
      stellen grenzen.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel7
  - number: '7.2'
    text: De verkiezingen worden gehouden bij geheime stemming.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel7
  - number: '8'
    text: De zittingsduur van de eilandsraad is vier jaren.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel8
  - number: '9'
    text: 'Het aantal leden van de eilandsraad bedraagt:'
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel9
  - number: 9.a
    text: negen in het openbaar lichaam Bonaire;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel9
  - number: 9.b
    text: vijf in de openbare lichamen Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel9
  - number: '10'
    text: De gezaghebber is voorzitter van de eilandsraad.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel10
  - number: '11.1'
    text: |-
      Voor het lidmaatschap van de eilandsraad is vereist dat men Nederlander en ingezetene van het openbaar lichaam is,
      de leeftijd van achttien jaar heeft bereikt en niet is uitgesloten van het kiesrecht.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel11
  - number: '11.2'
    text: Onder ingezetene wordt verstaan hij die zijn werkelijke woonplaats in het openbaar lichaam heeft.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel11
  - number: '11.3'
    text: |-
      Hij die als ingezetene met een adres is ingeschreven in de bevolkingsadministratie van een openbaar lichaam, wordt,
      behoudens bewijs van het tegendeel, geacht werkelijke woonplaats te hebben in het openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel11
  - number: '12'
    text: |-
      Ter vervulling van een tussentijds opengevallen plaats is niet benoembaar tot lid van de eilandsraad hij
      die na de laatstgehouden periodieke verkiezing van de leden van de eilandsraad wegens handelen in strijd met
      [artikel 16][ref1] van het lidmaatschap van de eilandsraad is vervallen verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel16
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '16'
        hoofdstuk: III
        afdeling: II
  - number: '13.1'
    text: |-
      De leden van de eilandsraad maken openbaar welke andere functies dan het lidmaatschap van de eilandsraad zij
      vervullen.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel13
  - number: '13.2'
    text: |-
      De openbaarmaking vindt plaats terstond na benoeming tot lid van de eilandsraad of na aanvaarding van een andere
      functie en geschiedt door terinzagelegging van een opgave van de functies op het bestuurskantoor van het openbaar
      lichaam.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel13
  - number: '14.1'
    text: 'Een lid van de eilandsraad is niet tevens:'
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel14
  - number: 14.1.a
    text: minister;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel14
  - number: 14.1.b
    text: staatssecretaris;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel14
  - number: 14.1.c
    text: lid van de Raad van State;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel14
  - number: 14.1.d
    text: lid van de Algemene Rekenkamer;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel14
  - number: 14.1.e
    text: Nationale ombudsman;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel14
  - number: 14.1.f
    text: |-
      substituut-ombudsman als bedoeld in [artikel 9, eerste lid, van de Wet Nationale ombudsman][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel9
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: '9'
  - number: 14.1.g
    text: Rijksvertegenwoordiger;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel14
  - number: 14.1.h
    text: gezaghebber;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel14
  - number: 14.1.i
    text: eilandgedeputeerde;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel14
  - number: 14.1.j
    text: lid van de gezamenlijke rekenkamer;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel14
  - number: 14.1.k
    text: gezamenlijke ombudsman of lid van de gezamenlijke ombudscommissie;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel14
  - number: 14.1.l
    text: ambtenaar, door of vanwege het bestuur van het openbaar lichaam aangesteld of daaraan ondergeschikt.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel14
  - number: '14.2'
    text: |-
      In afwijking van het eerste lid, aanhef en onder i, kan een lid van de eilandsraad tevens eilandgedeputeerde zijn
      van het openbaar lichaam waar hij lid van de eilandsraad is gedurende het tijdvak dat:
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel14
  - number: 14.2.a
    text: |-
      aanvangt op de dag van de stemming voor de verkiezing van de leden van de eilandsraad en eindigt op het tijdstip
      waarop de eilandgedeputeerden ingevolge [artikel 54, eerste lid][ref1], aftreden, of


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel54
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '54'
        hoofdstuk: III
        afdeling: III
  - number: 14.2.b
    text: |-
      aanvangt op het tijdstip van zijn benoeming tot eilandgedeputeerde en eindigt op het tijdstip met ingang waarvan
      de geloofsbrief van zijn opvolger als lid van de eilandsraad is goedgekeurd of waarop het centraal stembureau heeft
      beslist dat geen opvolger kan worden benoemd.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel14
  - number: '14.3'
    text: |-
      Het lid van de eilandsraad, bedoeld in het tweede lid, onderdeel b, wordt geacht ontslag te nemen als lid
      van de eilandsraad met ingang van het tijdstip waarop hij zijn benoeming tot eilandgedeputeerde aanvaardt.
      [Artikel X 6 van de Kieswet][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelX_6
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: X_6
  - number: '14.4'
    text: 'In afwijking van het eerste lid, aanhef en onder l, kan een lid van de eilandsraad tevens zijn:'
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel14
  - number: 14.4.a
    text: ambtenaar van de burgerlijke stand;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel14
  - number: 14.4.b
    text: |-
      vrijwilliger of ander persoon die uit hoofde van een wettelijke verplichting niet bij wijze van beroep hulpdiensten
      verricht;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel14
  - number: 14.4.c
    text: ambtenaar werkzaam voor een school voor openbaar onderwijs;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel14
  - number: 14.4.d
    text: |-
      ambtenaar werkzaam in een bij eilandsverordening van de eilandsraad van het openbaar lichaam Sint Eustatius
      of Saba aan te wijzen functie, die niet zodanige bevoegdheden of verantwoordelijkheden meebrengt, dat voor
      belangenverstrengeling moet worden gevreesd.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel14
  - number: '14.5'
    text: |-
      Een eilandsverordening als bedoeld in het vierde lid, onderdeel d, wordt ten minste vier maanden voor de dag van
      kandidaatstelling voor de verkiezing van de leden van de eilandsraad vastgesteld en behoeft de goedkeuring van
      de Rijksvertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel14
  - number: '15.1'
    text: |-
      Alvorens hun functie te kunnen uitoefenen, leggen de leden van de eilandsraad in de vergadering, in handen van de
      voorzitter, de volgende eed (verklaring en belofte) af: «Ik zweer (verklaar) dat ik, om tot lid van de eilandsraad
      benoemd te worden, rechtstreeks noch middellijk, onder welke naam of welk voorwendsel ook, enige gift of gunst heb
      gegeven of beloofd. Ik zweer (verklaar en beloof) dat ik, om iets in dit ambt te doen of te laten, rechtstreeks
      noch middellijk enig geschenk of enige belofte heb aangenomen of zal aannemen. Ik zweer (beloof) dat ik getrouw zal
      zijn aan de [Grondwet][ref1], dat ik de wetten zal nakomen en dat ik mijn plichten als lid van de eilandsraad naar
      eer en geweten zal vervullen. Zo waarlijk helpe mij God Almachtig!» (Dat verklaar en beloof ik!»)


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: '15.2'
    text: In plaats van in het Nederlands kan de eed (verklaring en belofte) in het Papiaments of het Engels worden afgelegd.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel15
  - number: '15.3'
    text: |-
      Wanneer de eed (verklaring en belofte) in het Papiaments wordt afgelegd, luidt de tekst van de eed (verklaring en
      belofte) als volgt: «Mi ta hura (deklará) ku pa mi nombramentu den e kargo o funshon di miembro di konseho insular
      mi no a duna ni primintí, ni direkta- ni indirektamente, bou di ningun nòmber ni denominashon ni preteksto, ningun
      regalo ni fabor. Mi ta hura (deklará i primintí) ku mi no a risibí ni mi no a aseptá, ni lo mi no aseptá, ni
      direkta- ni indirektamente, ningun regalo ni ningun promesa di hasi algu o laga di hasi algu den e kargo o funshon
      en kuestion. Mi ta hura (primintí) ku lo mi ta fiel na Konstitushon, ku lo mi kumpli ku lei i ku lo mi kumpli ku mi
      obligashonnan komo miembro di konseho insular segun mi konsenshi i honor. Ku Dios Todopoderoso yudami!» (Esei mi ta
      deklará i primintí!»)
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel15
  - number: '15.4'
    text: |-
      Wanneer de eed (verklaring en belofte) in het Engels wordt afgelegd, luidt de tekst van de eed (verklaring en
      belofte) als volgt: «I swear (affirm) that I neither gave nor promised any gift or favour, either directly or
      indirectly, under any name or pretext whatsoever, in order to be appointed member of the island council. I swear
      (affirm and promise) that I have made no gift or promise, and shall accept no gift or promise, either directly or
      indirectly, in order to do or to omit to do anything in the course of my duties. I swear (promise) that I will bear
      allegiance to the Constitution, that I will observe the laws and that I will perform my duties as member of the
      island council in good faith. So help me God Almighty! (This I affirm and promise!)
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel15
  - number: '16.1'
    text: 'Een lid van de eilandsraad mag niet:'
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel16
  - number: 16.1.a
    text: |-
      als advocaat, procureur of adviseur in geschillen werkzaam zijn ten behoeve van het openbaar lichaam of het
      eilandsbestuur dan wel ten behoeve van de wederpartij van het openbaar lichaam of het eilandsbestuur;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel16
  - number: 16.1.b
    text: |-
      als gemachtigde in geschillen werkzaam zijn ten behoeve van de wederpartij van het openbaar lichaam of het
      eilandsbestuur;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel16
  - number: 16.1.c
    text: |-
      als vertegenwoordiger of adviseur werkzaam zijn ten behoeve van derden tot het met het openbaar lichaam aangaan
      van:
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel16
  - number: 16.1.c.1°
    text: overeenkomsten als bedoeld in onderdeel d;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel16
  - number: 16.1.c.2°
    text: overeenkomsten tot het leveren van onroerende zaken aan het openbaar lichaam;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel16
  - number: 16.1.d
    text: 'rechtstreeks of middellijk een overeenkomst aangaan betreffende:'
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel16
  - number: 16.1.d.1°
    text: het aannemen van werk ten behoeve van het openbaar lichaam;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel16
  - number: 16.1.d.2°
    text: het buiten dienstbetrekking tegen beloning verrichten van werkzaamheden ten behoeve van het openbaar lichaam;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel16
  - number: 16.1.d.3°
    text: het leveren van roerende zaken anders dan om niet aan het openbaar lichaam;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel16
  - number: 16.1.d.4°
    text: het verhuren van roerende zaken aan het openbaar lichaam;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel16
  - number: 16.1.d.5°
    text: het verwerven van betwiste vorderingen ten laste van het openbaar lichaam;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel16
  - number: 16.1.d.6°
    text: |-
      het van het openbaar lichaam onderhands verwerven van onroerende zaken of beperkte rechten waaraan deze zijn
      onderworpen;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel16
  - number: 16.1.d.7°
    text: het onderhands huren of pachten van het openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel16
  - number: '16.2'
    text: Van het eerste lid, aanhef en onderdeel d, kan de Rijksvertegenwoordiger ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel16
  - number: '16.3'
    text: De eilandsraad stelt voor zijn leden een gedragscode vast.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel16
  - number: '17'
    text: De eilandsraad stelt een reglement van orde voor zijn vergaderingen en andere werkzaamheden vast.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel17
  - number: '18.1'
    text: De eilandsraad vergadert zo vaak als hij daartoe heeft besloten.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel18
  - number: '18.2'
    text: |-
      Voorts vergadert de eilandsraad indien de gezaghebber het nodig oordeelt of indien ten minste een vijfde van het
      aantal leden waaruit de eilandsraad bestaat schriftelijk, met opgave van redenen, daarom verzoekt.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel18
  - number: '19'
    text: |-
      De eilandsraad vergadert na de periodieke verkiezing van zijn leden voor de eerste maal in nieuwe samenstelling op
      de dag met ingang waarvan de leden van de eilandsraad in oude samenstelling aftreden.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel19
  - number: '20.1'
    text: De gezaghebber roept de leden schriftelijk tot de vergadering op.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel20
  - number: '20.2'
    text: |-
      Tegelijkertijd met de oproeping brengt de gezaghebber dag, tijdstip en plaats van de vergadering ter
      openbare kennis. De agenda en de daarbij behorende voorstellen met uitzondering van de stukken, bedoeld in
      [artikel 26, tweede lid][ref1], worden tegelijkertijd met de oproeping en op een bij de openbare kennisgeving aan
      te geven wijze ter inzage gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel26
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '26'
        hoofdstuk: III
        afdeling: II
  - number: '21.1'
    text: |-
      De vergadering van de eilandsraad wordt niet geopend voordat blijkens de presentielijst meer dan de helft van het
      aantal zitting hebbende leden tegenwoordig is.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel21
  - number: '21.2'
    text: |-
      Indien ingevolge het eerste lid de vergadering niet kan worden geopend, belegt de gezaghebber, onder verwijzing
      naar dit artikel, opnieuw een vergadering tegen een tijdstip dat ten minste vierentwintig uur na het bezorgen van
      de oproeping is gelegen.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel21
  - number: '21.3'
    text: |-
      Op de vergadering, bedoeld in het tweede lid, is het eerste lid niet van toepassing. De eilandsraad kan echter over
      andere aangelegenheden dan die waarvoor de ingevolge het eerste lid niet geopende vergadering was belegd alleen
      beraadslagen of besluiten, indien blijkens de presentielijst meer dan de helft van het aantal zitting hebbende
      leden tegenwoordig is.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel21
  - number: '22.1'
    text: De gezaghebber heeft het recht in de vergadering aan de beraadslaging deel te nemen.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel22
  - number: '22.2'
    text: Een eilandgedeputeerde heeft toegang tot de vergaderingen en kan aan de beraadslaging deelnemen.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel22
  - number: '22.3'
    text: Een eilandgedeputeerde kan door de eilandsraad worden uitgenodigd om ter vergadering aanwezig te zijn.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel22
  - number: '23'
    text: |-
      De leden van het eilandsbestuur en andere personen die deelnemen aan de beraadslaging kunnen niet in rechte
      worden vervolgd of aangesproken voor dan wel worden verplicht in rechte getuigenis af te leggen als bedoeld
      in [artikel 144, eerste lid, van het Wetboek van Burgerlijke Rechtsvordering BES][ref1] over hetgeen zij in de
      vergadering van de eilandsraad hebben gezegd of aan de eilandsraad schriftelijk hebben overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028496#Artikel144
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0028496
        artikel: '144'
  - number: '24.1'
    text: De vergadering van de eilandsraad wordt in het openbaar gehouden.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel24
  - number: '24.2'
    text: |-
      De deuren worden gesloten, wanneer ten minste één vijfde van het aantal leden dat de presentielijst heeft getekend
      daarom verzoekt of de voorzitter het nodig oordeelt.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel24
  - number: '24.3'
    text: De eilandsraad beslist vervolgens of met gesloten deuren zal worden vergaderd.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel24
  - number: '24.4'
    text: |-
      De voorzitter kan vervolgens alsnog besluiten dat de vergadering in het openbaar wordt gehouden indien hij dit in
      het kader van het openbaar belang nodig acht.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel24
  - number: '24.5'
    text: |-
      Van een vergadering met gesloten deuren wordt een afzonderlijk verslag opgemaakt, dat niet openbaar wordt gemaakt
      tenzij de eilandsraad anders beslist.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel24
  - number: '24.6'
    text: |-
      De eilandsraad maakt de besluitenlijst van zijn vergaderingen terstond na de vaststelling daarvan openbaar op
      de in het openbaar lichaam gebruikelijke wijze. De eilandsraad laat de openbaarmaking achterwege voor zover het
      aangelegenheden betreft ten aanzien waarvan op grond van [artikel 26][ref1] geheimhouding is opgelegd of ten
      aanzien waarvan openbaarmaking in strijd is met het openbaar belang.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel26
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '26'
        hoofdstuk: III
        afdeling: II
  - number: '25.1'
    text: 'In een besloten vergadering kan niet worden beraadslaagd of besloten over:'
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel25
  - number: 25.1.a
    text: de toelating van nieuw benoemde leden;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel25
  - number: 25.1.b
    text: de vaststelling en wijziging van de begroting en de vaststelling van de jaarrekening;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel25
  - number: 25.1.c
    text: de invoering, wijziging en afschaffing van eilandbelastingen, en
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel25
  - number: 25.1.d
    text: de benoeming en het ontslag van eilandgedeputeerden.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel25
  - number: '25.2'
    text: 'In een besloten vergadering kan geen besluit worden genomen over:'
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel25
  - number: 25.2.a
    text: ontwerpen van eilandsverordeningen;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel25
  - number: 25.2.b
    text: het doen van uitgaven, op de begroting niet voorkomende of de daarop uitgetrokken posten te boven gaande;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel25
  - number: 25.2.c
    text: het aanwijzen van middelen tot dekking van zodanige uitgaven;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel25
  - number: 25.2.d
    text: het geheel of gedeeltelijk vervreemden en het bezwaren van de eigendommen van het openbaar lichaam;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel25
  - number: 25.2.e
    text: het onderhands verhuren, verpachten of in gebruik geven van eigendommen van het openbaar lichaam;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel25
  - number: 25.2.f
    text: het onderhands gunnen of aanbesteden van werken of leveranties.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel25
  - number: '26.1'
    text: |-
      De eilandsraad kan op grond van een belang, genoemd in [artikel 11 van de Wet openbaarheid van bestuur BES][ref1]
      omtrent het in een besloten vergadering behandelde en omtrent de inhoud van de stukken die aan de eilandsraad
      worden overgelegd, geheimhouding opleggen. Geheimhouding omtrent het in een besloten vergadering behandelde wordt
      tijdens die vergadering opgelegd. De geheimhouding wordt door hen die bij de behandeling aanwezig waren en allen
      die van het behandelde of de stukken kennis dragen, in acht genomen totdat de eilandsraad haar opheft.


      [ref1]: https://wetten.overheid.nl/BWBR0028154#Artikel11
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0028154
        artikel: '11'
  - number: '26.2'
    text: |-
      Op grond van een belang, genoemd in [artikel 11 van de Wet openbaarheid van bestuur BES][ref1], kan de
      geheimhouding eveneens worden opgelegd door het bestuurscollege, de gezaghebber en een commissie, ieder ten aanzien
      van de stukken die zij aan de eilandsraad of aan leden van de eilandsraad overleggen. Daarvan wordt op de stukken
      melding gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0028154#Artikel11
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0028154
        artikel: '11'
  - number: '26.3'
    text: |-
      Met betrekking tot aan de eilandsraad overlegde stukken vervalt de krachtens het tweede lid opgelegde verplichting
      tot geheimhouding, indien de oplegging niet door de eilandsraad in zijn eerstvolgende vergadering die blijkens
      de presentielijst door meer dan de helft van het aantal zitting hebbende leden is bezocht, wordt bekrachtigd. De
      eilandsraad kan de geheimhouding nadien opheffen in een vergadering die blijkens de presentielijst door meer dan de
      helft van het aantal zitting hebbende leden is bezocht.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel26
  - number: '26.4'
    text: |-
      Met betrekking tot aan de leden van de eilandsraad overlegde stukken wordt de krachtens het tweede lid opgelegde
      verplichting tot geheimhouding in acht genomen totdat het orgaan dat de verplichting heeft opgelegd haar opheft.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel26
  - number: '27.1'
    text: |-
      De voorzitter zorgt voor de handhaving van de orde in de vergadering en is bevoegd, wanneer die orde op enigerlei
      wijze door toehoorders wordt verstoord, deze en zo nodig andere toehoorders te doen vertrekken.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel27
  - number: '27.2'
    text: |-
      Hij is bevoegd toehoorders die bij herhaling de orde in de vergadering verstoren voor ten hoogste drie maanden de
      toegang tot de vergadering te ontzeggen.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel27
  - number: '27.3'
    text: |-
      Hij kan de eilandsraad voorstellen aan een lid dat door zijn gedragingen de geregelde gang van zaken belemmert, het
      verdere verblijf in de vergadering te ontzeggen. Over het voorstel wordt niet beraadslaagd. Na aanneming daarvan
      verlaat het lid de vergadering onmiddellijk. Zo nodig doet de voorzitter hem verwijderen. Bij herhaling van zijn
      gedrag kan het lid bovendien voor ten hoogste drie maanden de toegang tot de vergadering worden ontzegd.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel27
  - number: '28'
    text: De leden van de eilandsraad stemmen zonder last.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel28
  - number: '29.1'
    text: 'Een lid van de eilandsraad neemt niet deel aan de stemming over:'
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel29
  - number: 29.1.a
    text: |-
      een aangelegenheid die hem rechtstreeks of middellijk persoonlijk aangaat of waarbij hij als vertegenwoordiger
      is betrokken;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel29
  - number: 29.1.b
    text: |-
      de vaststelling of goedkeuring der rekening van een lichaam waaraan hij rekenplichtig is of tot welks bestuur hij
      behoort.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel29
  - number: '29.2'
    text: |-
      Bij een schriftelijke stemming wordt onder het deelnemen aan de stemming verstaan het inleveren van een
      stembriefje.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel29
  - number: '29.3'
    text: |-
      Een benoeming gaat iemand persoonlijk aan, wanneer hij behoort tot de personen tot wie de keuze door een voordracht
      of bij een herstemming is beperkt.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel29
  - number: '29.4'
    text: |-
      Het eerste lid is niet van toepassing bij het besluit betreffende de toelating van de na periodieke verkiezing
      benoemde leden.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel29
  - number: '30.1'
    text: |-
      Een stemming is alleen geldig, indien meer dan de helft van het aantal leden dat zitting heeft en zich niet van
      deelneming aan de stemming moet onthouden, daaraan heeft deelgenomen.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel30
  - number: '30.2'
    text: 'Het eerste lid is niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel30
  - number: 30.2.a
    text: |-
      ingeval opnieuw wordt gestemd over een voorstel of over een benoeming, voordracht of aanbeveling van een of meer
      personen ten aanzien van wie in een vorige vergadering een stemming op grond van dat lid niet geldig was;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel30
  - number: 30.2.b
    text: |-
      in een vergadering als bedoeld in [artikel 21, tweede lid][ref1], voor zover het betreft onderwerpen die in
      de daaraan voorafgaande, ingevolge [artikel 21, eerste lid][ref2], niet geopende vergadering aan de orde waren
      gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0028142#Artikel21
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '21'
        hoofdstuk: III
        afdeling: II
      - id: ref2
        bwb_id: BWBR0028142
        artikel: '21'
        hoofdstuk: III
        afdeling: II
  - number: '31.1'
    text: |-
      Voor het tot stand komen van een beslissing bij stemming wordt de volstrekte meerderheid vereist van hen die een
      stem hebben uitgebracht.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel31
  - number: '31.2'
    text: |-
      Bij een schriftelijke stemming wordt onder het uitbrengen van een stem verstaan het inleveren van een behoorlijk
      ingevuld stembriefje.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel31
  - number: '32.1'
    text: De stemming over personen voor het doen van benoemingen, voordrachten of aanbevelingen is geheim.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel32
  - number: '32.2'
    text: |-
      Indien de stemmen staken over personen tot wie de keuze door een voordracht of bij een herstemming is beperkt,
      wordt in dezelfde vergadering een herstemming gehouden.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel32
  - number: '32.3'
    text: Staken bij deze stemming de stemmen opnieuw, dan beslist terstond het lot.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel32
  - number: '33.1'
    text: |-
      De overige stemmingen geschieden bij hoofdelijke oproeping, indien de voorzitter of een van de leden dat verlangt.
      In dat geval geschieden zij mondeling.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel33
  - number: '33.2'
    text: |-
      Bij hoofdelijke oproeping is ieder ter vergadering aanwezig lid dat zich niet van deelneming aan de stemming moet
      onthouden verplicht zijn stem voor of tegen uit te brengen.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel33
  - number: '33.3'
    text: Indien over een voorstel geen stemming wordt gevraagd, is het aangenomen.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel33
  - number: '33.4'
    text: |-
      Tenzij de vergadering voltallig is, wordt bij staking van stemmen het nemen van een beslissing uitgesteld tot een
      volgende vergadering, waarin de beraadslagingen kunnen worden heropend.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel33
  - number: '33.5'
    text: |-
      Indien de stemmen staken in een voltallige vergadering of in een ingevolge het vierde lid opnieuw belegde
      vergadering, is het voorstel niet aangenomen.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel33
  - number: '33.6'
    text: |-
      Onder een voltallige vergadering wordt verstaan een vergadering waarin alle leden waaruit de eilandsraad bestaat,
      voor zover zij zich niet van deelneming aan de stemming moesten onthouden, een stem hebben uitgebracht.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel33
  - number: '34'
    text: |-
      De stukken die van de eilandsraad uitgaan, worden door de gezaghebber ondertekend en door de eilandgriffier
      medeondertekend. Bij verhindering of ontstentenis van de gezaghebber worden de stukken die van de eilandsraad
      uitgaan ondertekend door degene die krachtens [artikel 90][ref1] de gezaghebber als voorzitter van de eilandsraad
      vervangt.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel90
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '90'
        hoofdstuk: III
        afdeling: IV
  - number: '35.1'
    text: De eilandsraad en elk van zijn leden hebben recht op ambtelijke bijstand.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel35
  - number: '35.2'
    text: De in de eilandsraad vertegenwoordigde groeperingen hebben recht op ondersteuning.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel35
  - number: '35.3'
    text: |-
      De eilandsraad stelt met betrekking tot de ambtelijke bijstand en de ondersteuning van de in de eilandsraad
      vertegenwoordigde groeperingen een eilandsverordening vast. De eilandsverordening bevat ten aanzien van de
      ondersteuning regels over de besteding en de verantwoording.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel35
  - number: '35.4'
    text: De eilandsverordening behoeft de goedkeuring van de Rijksvertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel35
  - number: '36.1'
    text: De gezaghebber en de eilandgedeputeerden vormen te zamen het bestuurscollege.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel36
  - number: '36.2'
    text: De gezaghebber is voorzitter van het bestuurscollege.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel36
  - number: '37.1'
    text: De eilandsraad benoemt de eilandgedeputeerden.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel37
  - number: '37.2'
    text: |-
      De gezaghebber wordt geïnformeerd over de uitkomsten van de college-onderhandelingen. Hij wordt alsdan in de
      gelegenheid gesteld zijn opvattingen over voorstellen ten behoeve van het collegeprogramma kenbaar te maken.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel37
  - number: '38'
    text: 'Het aantal eilandgedeputeerden bedraagt:'
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel38
  - number: 38.a
    text: drie in het openbaar lichaam Bonaire;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel38
  - number: 38.b
    text: twee in de openbare lichamen Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel38
  - number: '39.1'
    text: |-
      Voor de functie van eilandgedeputeerde gelden de vereisten voor het lidmaatschap van de eilandsraad, bedoeld in
      [artikel 11][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel11
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '11'
        hoofdstuk: III
        afdeling: II
  - number: '39.2'
    text: De eilandsraad kan voor de duur van een jaar ontheffing verlenen van het vereiste van ingezetenschap.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel39
  - number: '39.3'
    text: Dezelfde persoon kan niet in meer dan één openbaar lichaam eilandgedeputeerde zijn.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel39
  - number: '40.1'
    text: 'Een eilandgedeputeerde is niet tevens:'
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel40
  - number: 40.1.a
    text: minister;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel40
  - number: 40.1.b
    text: staatssecretaris;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel40
  - number: 40.1.c
    text: lid van de Raad van State;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel40
  - number: 40.1.d
    text: lid van de Algemene Rekenkamer;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel40
  - number: 40.1.e
    text: Nationale ombudsman;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel40
  - number: 40.1.f
    text: |-
      substituut-ombudsman als bedoeld in [artikel 9, eerste lid, van de Wet Nationale ombudsman][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel9
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: '9'
  - number: 40.1.g
    text: Rijksvertegenwoordiger;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel40
  - number: 40.1.h
    text: lid van een eilandsraad;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel40
  - number: 40.1.i
    text: gezaghebber;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel40
  - number: 40.1.j
    text: lid van de gezamenlijke rekenkamer;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel40
  - number: 40.1.k
    text: gezamenlijke ombudsman of lid van de gezamenlijke ombudscommissie;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel40
  - number: 40.1.l
    text: ambtenaar, door of vanwege het bestuur van een openbaar lichaam aangesteld of daaraan ondergeschikt;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel40
  - number: 40.1.m
    text: |-
      ambtenaar, door of vanwege het Rijk aangesteld, tot wiens taak behoort het verrichten van werkzaamheden in het
      kader van het toezicht op het openbaar lichaam;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel40
  - number: 40.1.n
    text: |-
      functionaris die krachtens de wet of een algemene maatregel van bestuur het bestuur van een openbaar lichaam van
      advies dient.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel40
  - number: '40.2'
    text: |-
      In afwijking van het eerste lid, aanhef en onderdeel h, kan een eilandgedeputeerde tevens lid zijn van de
      eilandsraad van het openbaar lichaam waar hij eilandgedeputeerde is gedurende het tijdvak dat:
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel40
  - number: 40.2.a
    text: |-
      aanvangt op de dag van de stemming voor de verkiezing van de leden van de eilandsraad en eindigt op het tijdstip
      waarop de eilandgedeputeerden ingevolge [artikel 54, eerste lid][ref1], aftreden, of


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel54
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '54'
        hoofdstuk: III
        afdeling: III
  - number: 40.2.b
    text: |-
      aanvangt op het tijdstip van zijn benoeming tot eilandgedeputeerde en eindigt op het tijdstip met ingang waarvan de
      goedkeuring van de geloofsbrief van zijn opvolger als lid van de eilandsraad onherroepelijk is geworden of waarop
      het centraal stembureau heeft beslist dat geen opvolger kan worden benoemd.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel40
  - number: '40.3'
    text: |-
      De eilandgedeputeerde, bedoeld in het tweede lid, onderdeel b, wordt geacht ontslag te nemen als lid van
      de eilandsraad met ingang van het tijdstip waarop hij zijn benoeming tot eilandgedeputeerde aanvaardt.
      [Artikel X 6 van de Kieswet][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelX_6
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: X_6
  - number: '40.4'
    text: 'In afwijking van het eerste lid, aanhef en onderdeel l, kan een eiland- gedeputeerde tevens zijn:'
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel40
  - number: 40.4.a
    text: ambtenaar van de burgerlijke stand;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel40
  - number: 40.4.b
    text: |-
      vrijwilliger of ander persoon die uit hoofde van een wettelijke verplichting niet bij wijze van beroep hulpdiensten
      verricht;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel40
  - number: 40.4.c
    text: ambtenaar werkzaam voor een school voor openbaar onderwijs.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel40
  - number: '41.1'
    text: |-
      Bloed- of aanverwantschap tot en met de tweede graad of huwelijk mag niet bestaan tussen leden van het
      bestuurscollege.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel41
  - number: '41.2'
    text: Voor de toepassing van het eerste lid wordt
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel41
  - number: 41.2.a
    text: een ongehuwd samenlevende gelijkgesteld met een echtgenoot
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel41
  - number: 41.2.b
    text: als ongehuwd tevens aangemerkt degene die duurzaam gescheiden leeft van zijn echtgenoot.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel41
  - number: '41.3'
    text: |-
      In het tweede lid wordt verstaan onder ongehuwd samenlevende: de ongehuwde meerderjarige die met een andere
      ongehuwde meerderjarige een gezamenlijke huishouding voert, met uitzondering van bloedverwanten in de eerste graad
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel41
  - number: '41.4'
    text: |-
      In het derde lid wordt verstaan onder het voeren van een gezamenlijke huishouding de situatie waarin twee personen
      hun hoofdverblijf hebben in dezelfde woning en:
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel41
  - number: 41.4.a
    text: |-
      zij blijk geven zorg te dragen voor elkaar door middel van het leveren van een bijdrage in de kosten van de
      huishouding dan wel anderszins;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel41
  - number: 41.4.b
    text: zij met elkaar gehuwd zijn geweest;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel41
  - number: 41.4.c
    text: zij elkaars geregistreerde partner zijn geweest;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel41
  - number: 41.4.d
    text: zij eerder met elkaar ongehuwd samenlevend zijn geweest, of
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel41
  - number: 41.4.e
    text: de man het kind van de vrouw heeft erkend.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel41
  - number: '42'
    text: |-
      De benoeming van eilandgedeputeerden na de verkiezing van de leden van de eilandsraad vindt plaats in een
      vergadering van de eilandsraad in nieuwe samenstelling.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel42
  - number: '43'
    text: |-
      In het geval van [artikel 42][ref1] gaat de benoeming van degene die zijn benoeming tot eilandgedeputeerde heeft
      aangenomen, in op het tijdstip waarop ten minste de helft van het aantal eilandgedeputeerden zijn benoeming heeft
      aangenomen of, indien de aanneming van de benoeming op een later tijdstip plaatsvindt, op dat tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel42
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '42'
        hoofdstuk: III
        afdeling: III
  - number: '44'
    text: De benoeming ter vervulling van een plaats die tussentijds openvalt, geschiedt zo spoedig mogelijk.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel44
  - number: '45'
    text: |-
      De benoemde eilandgedeputeerde deelt de eilandsraad uiterlijk op de tiende dag na de kennisgeving van zijn
      benoeming mee of hij de benoeming aanneemt. Indien deze termijn verstrijkt zonder mededeling, wordt de benoemde
      eilandgedeputeerde geacht de benoeming niet aan te nemen.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel45
  - number: '46'
    text: Wanneer de benoeming niet is aangenomen, geschiedt zo spoedig mogelijk een nieuwe benoeming.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel46
  - number: '47.1'
    text: |-
      Alvorens hun functie te kunnen uitoefenen leggen de eilandgedeputeerden, in de vergadering van de eilandsraad,
      in handen van de voorzitter, de volgende eed (verklaring en belofte) af: «Ik zweer (verklaar) dat ik, om tot
      eilandgedeputeerde benoemd te worden, rechtstreeks noch middellijk, onder welke naam of welk voorwendsel ook,
      enige gift of gunst heb gegeven of beloofd. Ik zweer (verklaar en beloof) dat ik, om iets in dit ambt te doen of
      te laten, rechtstreeks noch middellijk enig geschenk of enige belofte heb aangenomen of zal aannemen. Ik zweer
      (beloof) dat ik getrouw zal zijn aan de [Grondwet][ref1], dat ik de wetten zal nakomen en dat ik mijn plichten
      als eilandgedeputeerde naar eer en geweten zal vervullen. Zo waarlijk helpe mij God Almachtig!» («Dat verklaar en
      beloof ik!»)


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: '47.2'
    text: In plaats van in het Nederlands kan de eed (verklaring en belofte) in het Papiaments of het Engels worden afgelegd.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel47
  - number: '47.3'
    text: |-
      Wanneer de eed (verklaring en belofte) in het Papiaments wordt afgelegd, luidt de tekst van de eed (verklaring
      en belofte) als volgt: «Mi ta hura (deklará) ku pa mi nombramentu den e kargo o funshon di diputado, mi no a
      duna ni primintí, ni direkta- ni indirektamente, bou di ningun nòmber ni denominashon ni preteksto, ningun regalo
      ni fabor. Mi ta hura (deklará i primintí) ku mi no a risibí ni mi no a aseptá, ni lo mi no aseptá, ni direkta-
      ni indirektamente, ningun regalo ni ningun promesa di hasi algu o laga di hasi algu den e kargo o funshon en
      kuestion. Mi ta hura (primintí) ku lo mi ta fiel na Konstitushon, ku lo mi kumpli ku lei i ku lo mi kumpli ku
      mi obligashonnan komo diputado segun mi konsenshi i honor. Ku Dios Todopoderoso yudami!» (Esei mi ta deklará
      i primintí!»)
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel47
  - number: '47.4'
    text: |-
      Wanneer de eed (verklaring en belofte) in het Engels wordt afgelegd, luidt de tekst van de eed (verklaring en
      belofte) als volgt: «I swear (affirm) that I neither gave nor promised any gift or favour, either directly or
      indirectly, under any name or pretext whatsoever, in order to be appointed member of the island executive. I swear
      (affirm and promise) that I have made no gift or promise, and shall accept no gift or promise, either directly or
      indirectly, in order to do or to omit to do anything in the course of my duties. I swear (promise) that I will bear
      allegiance to the Constitution, that I will observe the laws and that I will perform my duties as member of the
      island executive in good faith. So help me God Almighty! (This I affirm and promise!)
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel47
  - number: '48.1'
    text: |-
      Een eilandgedeputeerde vervult geen nevenfuncties waarvan de uitoefening ongewenst is met het oog op een goede
      vervulling van zijn functie als eilandgedeputeerde.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel48
  - number: '48.2'
    text: Een eilandgedeputeerde meldt zijn voornemen tot aanvaarding van een nevenfunctie aan de eilandsraad.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel48
  - number: '48.3'
    text: |-
      Een eilandgedeputeerde maakt zijn nevenfuncties openbaar. De openbaarmaking vindt plaats terstond na benoeming tot
      eilandgedeputeerde of aanvaarding van een nevenfunctie en geschiedt door terinzagelegging van een opgave van de
      functies op het bestuurskantoor van het openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel48
  - number: '48.4'
    text: |-
      Een eilandgedeputeerde maakt tevens de inkomsten uit nevenfuncties openbaar. Openbaarmaking geschiedt door
      terinzagelegging op het bestuurskantoor uiterlijk op 1 april na het kalenderjaar waarin de inkomsten zijn genoten.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel48
  - number: '48.5'
    text: |-
      Onder inkomsten wordt verstaan: loon in de zin van [artikel 6 van de Wet loonbelasting BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029283#Artikel6
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0029283
        artikel: '6'
  - number: '49.1'
    text: |-
      Een eilandgedeputeerde dient bij de Rijksvertegenwoordiger binnen dertig dagen na aanneming van zijn benoeming en
      binnen dertig dagen na zijn ontslag een schriftelijke verklaring in met:
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel49
  - number: 49.1.a
    text: een nauwkeurige omschrijving van de zakelijke belangen die hij en zijn echtgenoot hebben of beheren;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel49
  - number: 49.1.b
    text: |-
      een nauwkeurige omschrijving van de onroerende zaken, roerende zaken, op geld waardeerbare rechten alsmede
      vorderingen en schulden van hem en zijn echtgenoot;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel49
  - number: 49.1.c
    text: een nauwkeurige omschrijving van de aard van zijn nevenfuncties alsmede de functies van zijn echtgenoot;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel49
  - number: 49.1.d
    text: |-
      de vermelding of aan de nevenfuncties inkomsten of voordelen in welke vorm dan ook, zijn verbonden en voorzover een
      geldelijke vergoeding daaraan is verbonden de omvang daarvan.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel49
  - number: '49.2'
    text: |-
      [Artikel 41, tweede tot en met vierde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel41
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '41'
        hoofdstuk: III
        afdeling: III
  - number: '49.3'
    text: |-
      Geen opgave hoeft te worden gedaan van belangen, zaken, met uitzondering van onroerende zaken, rechten, vorderingen
      en schulden, waarvan de waarde niet meer dan USD 11 175 bedraagt.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel49
  - number: '49.4'
    text: De verklaring wordt door de eilandgedeputeerde ondertekend.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel49
  - number: '49.5'
    text: Bij ministeriële regeling wordt voor de verklaring een model vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel49
  - number: '50'
    text: |-
      De Rijksvertegenwoordiger bewaart de verklaringen, bedoeld in [artikel 49][ref1], gedurende tien jaren, te rekenen
      vanaf het tijdstip waarop hij deze heeft ontvangen. Na afloop van deze termijn draagt hij zorg voor de vernietiging
      hiervan.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel49
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '49'
        hoofdstuk: III
        afdeling: III
  - number: '51'
    text: |-
      De Rijksvertegenwoordiger en degenen die in zijn opdracht handelen zijn verplicht tot geheimhouding van de op grond
      van [artikel 49][ref1] ontvangen verklaringen. Zij verstrekken de verklaringen of doen hierover slechts mededeling
      aan instanties die zijn belast met de opsporing en vervolging van strafbare feiten.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel49
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '49'
        hoofdstuk: III
        afdeling: III
  - number: '52'
    text: |-
      Indien een eilandgedeputeerde de verklaring, bedoeld in [artikel 49][ref1], niet tijdig bij de
      Rijksvertegenwoordiger indient, informeert deze onverwijld de eilandsraad.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel49
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '49'
        hoofdstuk: III
        afdeling: III
  - number: '53.1'
    text: |-
      [Artikel 16, eerste en tweede lid][ref1], is van overeenkomstige toepassing op de eilandgedeputeerden.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel16
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '16'
        hoofdstuk: III
        afdeling: II
  - number: '53.2'
    text: De eilandsraad stelt voor de eilandgedeputeerden een gedragscode vast.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel53
  - number: '54.1'
    text: |-
      Na de verkiezing van de leden van de eilandsraad treden de eilandgedeputeerden af op het moment dat de eilandsraad
      ten minste de helft van het aantal eilandgedeputeerden heeft benoemd en deze benoemingen zijn aangenomen.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel54
  - number: '54.2'
    text: |-
      Indien zoveel eilandgedeputeerden hun ontslag indienen of worden ontslagen dat niet ten minste de helft van het
      aantal eilandgedeputeerden in functie is, treedt de gezaghebber in de plaats van het bestuurscollege totdat dit wel
      het geval is.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel54
  - number: '55.1'
    text: |-
      Een eilandgedeputeerde kan te allen tijde ontslag nemen. Hij doet daarvan schriftelijk mededeling aan de
      eilandsraad.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel55
  - number: '55.2'
    text: |-
      Het ontslag gaat in met ingang van de dag, gelegen een maand na de dag waarop hij zijn ontslag heeft genomen of
      zoveel eerder als zijn opvolger de benoeming heeft aangenomen.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel55
  - number: '56.1'
    text: |-
      De eilandgedeputeerden genieten ten laste van het openbaar lichaam een bezoldiging, die bij of krachtens algemene
      maatregel van bestuur wordt geregeld.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel56
  - number: '56.2'
    text: |-
      Bij de algemene maatregel van bestuur, bedoeld in het eerste lid, kunnen tevens regels worden gesteld betreffende
      tegemoetkoming in of vergoeding van bijzondere kosten en betreffende andere financiële voorzieningen die verband
      houden met de vervulling van het ambt van eilandgedeputeerde.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel56
  - number: '56.3'
    text: |-
      Buiten hetgeen hun bij of krachtens de wet is toegekend genieten de eilandgedeputeerden als zodanig geen inkomsten,
      in welke vorm ook, ten laste van het openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel56
  - number: '56.4'
    text: |-
      De eilandgedeputeerden genieten geen vergoedingen, in welke vorm ook, voor werkzaamheden, verricht in nevenfuncties
      die zij vervullen uit hoofde van het ambt van eilandgedeputeerde ongeacht of die vergoedingen ten laste van het
      openbaar lichaam komen of niet. Indien deze vergoedingen worden uitgekeerd, worden zij gestort in de kas van het
      openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel56
  - number: '56.5'
    text: |-
      Tot vergoedingen als bedoeld in het vierde lid, behoren inkomsten, onder welke benaming ook, uit nevenfuncties die
      de eilandgedeputeerde neerlegt bij beëindiging van het ambt.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel56
  - number: '56.6'
    text: |-
      Andere inkomsten dan die bedoeld in het vierde lid worden met de bezoldiging verrekend overeenkomstig
      [artikel 3 van de Wet schadeloosstelling leden Tweede Kamer][ref1], met dien verstande dat in dat artikel:


      [ref1]: https://wetten.overheid.nl/BWBR0004939#Artikel3
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0004939
        artikel: '3'
  - number: 56.6.a
    text: |-
      onder neveninkomsten wordt verstaan: opbrengst van onderneming en arbeid, bedoeld in
      [artikel 6 van de Wet inkomstenbelasting BES][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0029281#Artikel6
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0029281
        artikel: '6'
  - number: 56.6.b
    text: |-
      in het derde lid voor «de [Wet inkomstenbelasting 2001][ref1]» wordt gelezen: de
      [Wet inkomstenbelasting BES][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011353
      [ref2]: https://wetten.overheid.nl/BWBR0029281
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0011353
      - id: ref2
        bwb_id: BWBR0029281
  - number: '56.7'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld over de wijze waarop de eilandgedeputeerde gegevens over
      de inkomsten, bedoeld in het zesde lid, verstrekt, en de gevolgen van het niet verstrekken van deze gegevens.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel56
  - number: '57.1'
    text: |-
      Indien degene wiens benoeming tot eilandgedeputeerde is ingegaan, een functie bekleedt als bedoeld in
      [artikel 40, eerste lid][ref1], en het tweede of vierde lid van dat artikel niet van toepassing zijn, draagt hij er
      onverwijld zorg voor dat hij uit die functie wordt ontheven.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel40
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '40'
        hoofdstuk: III
        afdeling: III
  - number: '57.2'
    text: De eilandsraad verleent hem ontslag indien hij dit nalaat.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel57
  - number: '57.3'
    text: Het ontslag gaat in terstond na de bekendmaking van het ontslagbesluit.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel57
  - number: '57.4'
    text: |-
      Indien de eilandsraad naar het oordeel van de gezaghebber ten onrechte nalaat ontslag te verlenen, wordt de
      eilandgedeputeerde door de gezaghebber van zijn betrekking vervallen verklaard.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel57
  - number: '57.5'
    text: |-
      De werking van een besluit, inhoudende de vervallenverklaring, wordt opgeschort totdat de beroepstermijn
      is verstreken of, indien beroep is ingesteld, op het beroep is beslist. Gedurende deze periode is de
      eilandgedeputeerde in zijn betrekking geschorst.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel57
  - number: '58.1'
    text: |-
      Tegen een besluit van de gezaghebber als bedoeld in [artikel 57, vierde lid][ref1], kan de eilandgedeputeerde
      beroep instellen bij het Gemeenschappelijk Hof van Justitie van Curaçao, Aruba, Sint Maarten en van Bonaire, Sint
      Eustatius en Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel57
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '57'
        hoofdstuk: III
        afdeling: III
  - number: '58.2'
    text: |-
      [De Wet administratieve rechtspraak BES][ref1] is voor zoveel nodig van overeenkomstige toepassing, met
      uitzondering van de [artikelen 54][ref2] en [55][ref3] en [paragraaf 1][ref4] en [3 van hoofdstuk 6][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0028455
      [ref2]: https://wetten.overheid.nl/BWBR0028455#Artikel54
      [ref3]: https://wetten.overheid.nl/BWBR0028455#Artikel55
      [ref4]: https://wetten.overheid.nl/BWBR0028455#Paragraaf1
      [ref5]: https://wetten.overheid.nl/BWBR0028455#Paragraaf3
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0028455
      - id: ref2
        bwb_id: BWBR0028455
        artikel: '54'
      - id: ref3
        bwb_id: BWBR0028455
        artikel: '55'
      - id: ref4
        bwb_id: BWBR0028455
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0028455
        paragraaf: '3'
  - number: '58.3'
    text: |-
      In afwijking van [artikel 17, vijfde lid, van de Wet administratieve rechtspraak BES][ref1] bedraagt de termijn
      binnen welke de bijschrijving of storting van het verschuldigde bedrag dient plaats te vinden, twee weken. De
      president van het Gemeenschappelijk Hof kan een kortere termijn stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0028455#Artikel17
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0028455
        artikel: '17'
  - number: '58.4'
    text: |-
      Het Gemeenschappelijk Hof behandelt de zaak met overeenkomstige toepassing van
      [paragraaf 2 van hoofdstuk 6 van de Wet administratieve rechtspraak BES][ref1]. Aan de gezaghebber en degene die
      beroep heeft ingesteld wordt terstond een afschrift van het beroepschrift toegezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0028455#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0028455
        paragraaf: '2'
  - number: '59.1'
    text: |-
      Indien een eilandgedeputeerde niet langer voldoet aan de vereisten voor de functie van eilandgedeputeerde, bedoeld
      in [artikel 39][ref1], of een functie gaat bekleden als bedoeld in [artikel 40, eerste lid][ref2], en het tweede of
      vierde lid van dat artikel niet van toepassing zijn, neemt hij onmiddellijk ontslag. Hij doet hiervan schriftelijk
      mededeling aan de eilandsraad.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0028142#Artikel40
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '39'
        hoofdstuk: III
        afdeling: III
      - id: ref2
        bwb_id: BWBR0028142
        artikel: '40'
        hoofdstuk: III
        afdeling: III
  - number: '59.2'
    text: |-
      De [artikelen 57, tweede tot en met vijfde lid][ref1], en [artikel 58][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0028142#Artikel58
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '57'
        hoofdstuk: III
        afdeling: III
      - id: ref2
        bwb_id: BWBR0028142
        artikel: '58'
        hoofdstuk: III
        afdeling: III
  - number: '60.1'
    text: |-
      Indien een uitspraak van de eilandsraad inhoudende de opzegging van zijn vertrouwen in een eilandgedeputeerde er
      niet toe leidt dat de betrokken eilandgedeputeerde onmiddellijk ontslag neemt, kan de eilandsraad besluiten tot
      ontslag.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel60
  - number: '60.2'
    text: |-
      Op het ontslagbesluit is [artikel 7, eerste lid, van de Wet administratieve rechtspraak BES][ref1] niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028455#Artikel7
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0028455
        artikel: '7'
  - number: '61'
    text: |-
      De rechter treedt niet in de beoordeling van de gronden waarop de eilandsraad tot ontslag van een
      eilandgedeputeerde heeft besloten.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel61
  - number: '62'
    text: |-
      Het bestuurscollege stelt een reglement van orde voor zijn vergaderingen en andere werkzaamheden vast, dat aan de
      eilandsraad wordt toegezonden.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel62
  - number: '63.1'
    text: |-
      De gezaghebber stelt, met inachtneming van hetgeen het bestuurscollege heeft bepaald, dag en plaats van de
      vergadering van het bestuurscollege en het tijdstip van de opening vast.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel63
  - number: '63.2'
    text: De gezaghebber maakt dag en plaats van te houden openbare vergaderingen en het tijdstip van de opening bekend.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel63
  - number: '64.1'
    text: De gezaghebber bevordert de eenheid van het beleid van het bestuurscollege.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel64
  - number: '64.2'
    text: De gezaghebber kan onderwerpen aan de agenda voor een vergadering van het bestuurscollege toevoegen.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel64
  - number: '64.3'
    text: De gezaghebber kan ten aanzien van geagendeerde onderwerpen een eigen voorstel aan het bestuurscollege voorleggen.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel64
  - number: '65.1'
    text: |-
      De vergaderingen van het bestuurscollege worden met gesloten deuren gehouden, voor zover het bestuurscollege niet
      anders heeft bepaald.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel65
  - number: '65.2'
    text: |-
      Het reglement van orde voor de vergaderingen kan regels geven omtrent de openbaarheid van de vergaderingen van
      het bestuurscollege.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel65
  - number: '66.1'
    text: |-
      Het bestuurscollege kan op grond van een belang, genoemd in
      [artikel 11 van de Wet openbaarheid van bestuur BES][ref1], omtrent het in een besloten vergadering behandelde
      en omtrent de inhoud van de stukken die aan het bestuurscollege worden overgelegd, geheimhouding opleggen.
      Geheimhouding omtrent het in een besloten vergadering behandelde wordt tijdens die vergadering opgelegd. De
      geheimhouding wordt door hen die bij de behandeling aanwezig waren en allen die van het behandelde of de stukken
      kennis dragen, in acht genomen totdat het bestuurscollege haar opheft.


      [ref1]: https://wetten.overheid.nl/BWBR0028154#Artikel11
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0028154
        artikel: '11'
  - number: '66.2'
    text: |-
      Op grond van een belang, genoemd in [artikel 11 van de Wet openbaarheid van bestuur BES][ref1], kan de
      geheimhouding eveneens worden opgelegd door de gezaghebber of een commissie, ten aanzien van de stukken die zij aan
      het bestuurscollege overleggen. Daarvan wordt op de stukken melding gemaakt. De geheimhouding wordt in acht genomen
      totdat het orgaan dat de verplichting heeft opgelegd, dan wel de eilandsraad haar opheft.


      [ref1]: https://wetten.overheid.nl/BWBR0028154#Artikel11
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0028154
        artikel: '11'
  - number: '66.3'
    text: |-
      Indien het bestuurscollege zich ter zake van het behandelde waarvoor een verplichting tot geheimhouding geldt tot
      de eilandsraad heeft gericht, wordt de geheimhouding in acht genomen totdat de eilandsraad haar opheft.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel66
  - number: '67.1'
    text: |-
      In de vergadering van het bestuurscollege kan slechts worden beraadslaagd of besloten, indien ten minste de helft
      van het aantal zitting hebbende leden tegenwoordig is.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel67
  - number: '67.2'
    text: |-
      Indien het vereiste aantal leden niet tegenwoordig is, belegt de gezaghebber, onder verwijzing naar dit artikel,
      opnieuw een vergadering.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel67
  - number: '67.3'
    text: |-
      Op de vergadering, bedoeld in het tweede lid, is het eerste lid niet van toepassing. Het bestuurscollege kan echter
      over andere aangelegenheden dan die waarvoor de eerdere vergadering was belegd alleen beraadslagen of besluiten,
      indien ten minste de helft van het aantal zitting hebbende leden tegenwoordig is.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel67
  - number: '68'
    text: |-
      De leden van het bestuurscollege en andere personen die deelnemen aan de beraadslaging kunnen niet in rechte
      worden vervolgd of aangesproken voor hetgeen zij in de vergadering van het bestuurscollege hebben gezegd of aan het
      bestuurscollege schriftelijk hebben overgelegd.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel68
  - number: '69'
    text: |-
      De [artikelen 29, eerste tot en met derde lid][ref1], [30][ref2] en [31][ref3] zijn ten aanzien van de
      vergaderingen van het bestuurscollege van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0028142#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0028142#Artikel31
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '29'
        hoofdstuk: III
        afdeling: II
      - id: ref2
        bwb_id: BWBR0028142
        artikel: '30'
        hoofdstuk: III
        afdeling: II
      - id: ref3
        bwb_id: BWBR0028142
        artikel: '31'
        hoofdstuk: III
        afdeling: II
  - number: '70.1'
    text: |-
      Indien bij een stemming, anders dan over personen voor het doen van benoemingen, voordrachten of aanbevelingen, de
      stemmen staken, wordt opnieuw gestemd.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel70
  - number: '70.2'
    text: Staken de stemmen andermaal over hetzelfde voorstel, dan beslist de stem van de voorzitter.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel70
  - number: '71.1'
    text: |-
      De stukken die van het bestuurscollege uitgaan, worden door de gezaghebber ondertekend en door de eilandsecretaris
      medeondertekend.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel71
  - number: '71.2'
    text: |-
      Het bestuurscollege kan hem toestaan de ondertekening op te dragen aan een ander lid van het bestuurscollege, aan
      de eilandsecretaris of aan een of meer andere ambtenaren van het openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel71
  - number: '71.3'
    text: |-
      De medeondertekening door de eilandsecretaris is niet van toepassing indien de ondertekening van stukken die
      van het bestuurscollege uitgaan ingevolge het tweede lid is opgedragen aan de eilandsecretaris of een of meer
      ambtenaren van het openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel71
  - number: '72.1'
    text: |-
      De eilandsraad kan regelen van welke beslissingen van het bestuurscollege aan de leden van de eilandsraad
      kennisgeving wordt gedaan. Daarbij kan de eilandsraad de gevallen bepalen waarin met terinzagelegging kan worden
      volstaan.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel72
  - number: '72.2'
    text: |-
      Het bestuurscollege laat de kennisgeving of terinzagelegging achterwege voor zover deze in strijd is met het
      openbaar belang.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel72
  - number: '72.3'
    text: |-
      Het bestuurscollege maakt de besluitenlijst van zijn vergaderingen terstond na de vaststelling daarvan openbaar op
      de in het openbaar lichaam gebruikelijke wijze. Het bestuurscollege laat de openbaarmaking achterwege voor zover
      het aangelegenheden betreft ten aanzien waarvan op grond van [artikel 66][ref1] geheimhouding is opgelegd of ten
      aanzien waarvan openbaarmaking in strijd is met het openbaar belang.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel66
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '66'
        hoofdstuk: III
        afdeling: III
  - number: '73.1'
    text: |-
      De gezaghebber wordt bij koninklijk besluit op voordracht van Onze Minister benoemd en herbenoemd voor de tijd van
      zes jaar. Hij kan te allen tijde bij koninklijk besluit op voordracht van Onze Minister worden ontslagen.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel73
  - number: '73.2'
    text: |-
      De Rijksvertegenwoordiger maakt voor elke door benoeming te vervullen plaats een met redenen omklede aanbeveling
      op. Alvorens zijn aanbeveling te doen verzoekt hij de eilandsraad, gehoord het bestuurscollege, zijn gevoelen
      kenbaar te maken met betrekking tot de aan de te benoemen gezaghebber te stellen eisen van bekwaamheid en
      geschiktheid.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel73
  - number: '73.3'
    text: |-
      De eilandsraad kan uit zijn midden een vertrouwenscommissie instellen belast met de beoordeling van de op haar
      verzoek door de Rijksvertegenwoordiger daartoe geselecteerde kandidaten. De eilandsraad stelt het bestuurscollege
      in de gelegenheid een eilandgedeputeerde af te vaardigen die als adviseur aan de vertrouwenscommissie
      wordt toegevoegd. De vertrouwenscommissie brengt vertrouwelijk verslag uit van haar bevindingen aan de
      Rijksvertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel73
  - number: '73.4'
    text: |-
      Onverminderd het bepaalde in het tweede en derde lid kunnen bij algemene maatregel van bestuur nadere regels worden
      gesteld omtrent de bij benoeming te volgen procedure.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel73
  - number: '73.5'
    text: |-
      De beraadslagingen van de vertrouwenscommissie, bedoeld in het derde lid, vinden plaats met gesloten deuren. Van
      deze beraadslagingen wordt een afzonderlijk verslag gemaakt, dat niet openbaar is.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel73
  - number: '73.6'
    text: 'Er geldt een geheimhoudingsplicht ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel73
  - number: 73.6.a
    text: de aanbeveling van de Rijksvertegenwoordiger, bedoeld in het tweede lid;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel73
  - number: 73.6.b
    text: het verslag van de bevindingen van de vertrouwenscommissie, bedoeld in het derde lid;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel73
  - number: 73.6.c
    text: de beraadslagingen van de vertrouwenscommissie en het verslag van de beraadslagingen, bedoeld in het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel73
  - number: '73.7'
    text: |-
      De Rijksvertegenwoordiger doet een voorstel tot herbenoeming. Bij algemene maatregel van bestuur kunnen nadere
      regels worden gesteld over de wijze waarop de eilandsraad in verband daarmee zijn gevoelen omtrent het functioneren
      van de gezaghebber kenbaar kan maken aan de Rijksvertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel73
  - number: '74.1'
    text: De gezaghebber kan bij koninklijk besluit worden geschorst.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel74
  - number: '74.2'
    text: |-
      Onze Minister kan, in afwachting van een besluit omtrent schorsing, bepalen dat de gezaghebber zijn functie niet
      uitoefent.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel74
  - number: '74.3'
    text: |-
      Een besluit als bedoeld in het tweede lid vervalt, indien niet binnen een maand een besluit omtrent de schorsing
      is genomen.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel74
  - number: '75'
    text: Voor de benoembaarheid tot gezaghebber is het Nederlanderschap vereist.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel75
  - number: '76'
    text: Dezelfde persoon kan niet in meer dan een openbaar lichaam tot gezaghebber worden benoemd.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel76
  - number: '77.1'
    text: |-
      Alvorens zijn ambt te aanvaarden, legt de gezaghebber in handen van de Rijksvertegenwoordiger de volgende eed
      (verklaring en belofte) af: «Ik zweer (verklaar) dat ik, om tot gezaghebber benoemd te worden, rechtstreeks
      noch middellijk, onder welke naam of welk voorwendsel ook, enige gift of gunst heb gegeven of beloofd. Ik zweer
      (verklaar en beloof) dat ik, om iets in dit ambt te doen of te laten, rechtstreeks noch middellijk enig geschenk
      of enige belofte heb aangenomen of zal aannemen. Ik zweer (beloof) dat ik getrouw zal zijn aan de [Grondwet][ref1],
      dat ik de wetten zal nakomen en dat ik mijn plichten als gezaghebber naar eer en geweten zal vervullen. Zo waarlijk
      helpe mij God Almachtig!» (Dat verklaar en beloof ik!»)


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: '77.2'
    text: In plaats van in het Nederlands kan de eed (verklaring en belofte) in het Papiaments of het Engels worden afgelegd.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel77
  - number: '77.3'
    text: |-
      Wanneer de eed (verklaring en belofte) in het Papiaments wordt afgelegd, luidt de tekst van de eed (verklaring
      en belofte) als volgt: «Mi ta hura (deklará) ku pa mi nombramentu den e kargo o funshon di gezaghebber mi no a
      duna ni primintí, ni direkta- ni indirektamente, bou di ningun nòmber ni denominashon ni preteksto, ningun regalo
      ni fabor. Mi ta hura (deklará i primintí) ku mi no a risibí ni mi no a aseptá, ni lo mi no aseptá, ni direkta-
      ni indirektamente, ningun regalo ni ningun promesa di hasi algu o laga di hasi algu den e kargo o funshon en
      kuestion. Mi ta hura (primintí) ku lo mi ta fiel na Konstitushon, ku lo mi kumpli ku lei i ku lo mi kumpli ku
      mi obligashonnan komo gezaghebber segun mi konsenshi i honor. Ku Dios Todopoderoso yudami!» (Esei mi ta deklará
      i primintí!»)
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel77
  - number: '77.4'
    text: |-
      Wanneer de eed (verklaring en belofte) in het Engels wordt afgelegd, luidt de tekst van de eed (verklaring en
      belofte) als volgt: «I swear (affirm) that I neither gave nor promised any gift or favour, either directly or
      indirectly, under any name or pretext whatsoever, in order to be appointed Island Governor. I swear (affirm and
      promise) that I have made no gift or promise, and shall accept no gift or promise, either directly or indirectly,
      in order to do or to omit to do anything in the course of my duties. I swear (promise) that I will bear allegiance
      to the Constitution, that I will observe the laws and that I will perform my duties as Island Governor in good
      faith. So help me God Almighty! (This I affirm and promise!)
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel77
  - number: '78.1'
    text: |-
      De gezaghebber geniet ten laste van het openbaar lichaam een bezoldiging, die bij of krachtens algemene maatregel
      van bestuur wordt geregeld.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel78
  - number: '78.2'
    text: |-
      Bij de algemene maatregel van bestuur, bedoeld in het eerste lid, kunnen tevens regels worden gesteld betreffende
      tegemoetkoming in of vergoeding van bijzondere kosten en betreffende andere financiële voorzieningen die verband
      houden met de vervulling van het ambt van gezaghebber.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel78
  - number: '78.3'
    text: |-
      Buiten hetgeen hem bij of krachtens de wet is toegekend, geniet de gezaghebber als zodanig geen inkomsten, in welke
      vorm ook, ten laste van het openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel78
  - number: '78.4'
    text: |-
      De gezaghebber geniet geen vergoedingen, in welke vorm ook, voor werkzaamheden, verricht in nevenfuncties welke hij
      vervult uit hoofde van het ambt van gezaghebber, ongeacht of die vergoedingen ten laste van het openbaar lichaam
      komen of niet. Indien deze vergoedingen worden uitgekeerd, worden zij gestort in de kas van het openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel78
  - number: '78.5'
    text: |-
      Tot vergoedingen als bedoeld in het vierde lid, behoren inkomsten, onder welke benaming ook, uit nevenfuncties die
      de gezaghebber neerlegt bij beëindiging van het ambt.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel78
  - number: '78.6'
    text: |-
      Andere inkomsten dan die bedoeld in het vierde lid worden met de bezoldiging verrekend overeenkomstig
      [artikel 3 van de Wet schadeloosstelling leden Tweede Kamer][ref1] met dien verstande dat in dat artikel:


      [ref1]: https://wetten.overheid.nl/BWBR0004939#Artikel3
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0004939
        artikel: '3'
  - number: 78.6.a
    text: |-
      onder neveninkomsten wordt verstaan: opbrengst van onderneming en arbeid, bedoeld in artikel 6 van de Wet
      inkomstenbelasting BES;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel78
  - number: 78.6.b
    text: |-
      in het derde lid voor «de [Wet inkomstenbelasting 2001][ref1]» wordt gelezen: de Wet inkomstenbelasting BES.


      [ref1]: https://wetten.overheid.nl/BWBR0011353
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0011353
  - number: '78.7'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld over de wijze waarop de gezaghebber gegevens over de
      inkomsten, bedoeld in het zesde lid, verstrekt, en de gevolgen van het niet verstrekken van deze gegevens.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel78
  - number: '79.1'
    text: |-
      De gezaghebber vervult geen nevenfuncties waarvan de uitoefening ongewenst is met het oog op de goede vervulling
      van zijn ambt van gezaghebber of op de handhaving van zijn onpartijdigheid en onafhankelijkheid of van het
      vertrouwen daarin.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel79
  - number: '79.2'
    text: |-
      De gezaghebber meldt zijn voornemen tot aanvaarding van een nevenfunctie, anders dan uit hoofde van zijn ambt van
      gezaghebber, aan de eilandsraad.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel79
  - number: '79.3'
    text: |-
      De gezaghebber maakt nevenfuncties, anders dan uit hoofde van zijn ambt van gezaghebber, openbaar. De
      openbaarmaking vindt plaats terstond na benoeming tot gezaghebber of aanvaarding van een nevenfunctie en geschiedt
      door terinzaggelegging van een opgave van de functies op het bestuurskantoor van het openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel79
  - number: '79.4'
    text: |-
      De gezaghebber maakt tevens de inkomsten uit de nevenfuncties, bedoeld in het derde lid, openbaar. Openbaarmaking
      geschiedt door terinzagelegging op het bestuurskantoor uiterlijk op 1 april na het kalenderjaar waarin de inkomsten
      zijn genoten.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel79
  - number: '79.5'
    text: |-
      Onder inkomsten wordt verstaan: loon in de zin van [artikel 6 van de Wet loonbelasting BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029283#Artikel6
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0029283
        artikel: '6'
  - number: '80.1'
    text: 'De gezaghebber is niet tevens:'
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel80
  - number: 80.1.a
    text: minister;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel80
  - number: 80.1.b
    text: staatssecretaris;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel80
  - number: 80.1.c
    text: lid van de Raad van State;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel80
  - number: 80.1.d
    text: lid van de Algemene Rekenkamer;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel80
  - number: 80.1.e
    text: Nationale ombudsman;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel80
  - number: 80.1.f
    text: |-
      substituut-ombudsman als bedoeld in [artikel 9, eerste lid, van de Wet Nationale ombudsman][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel9
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: '9'
  - number: 80.1.g
    text: Rijksvertegenwoordiger;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel80
  - number: 80.1.h
    text: lid van een eilandsraad;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel80
  - number: 80.1.i
    text: eilandgedeputeerde;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel80
  - number: 80.1.j
    text: lid van de gezamenlijke rekenkamer;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel80
  - number: 80.1.k
    text: gezamenlijke ombudsman of lid van de gezamenlijke ombudscommissie;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel80
  - number: 80.1.l
    text: ambtenaar, door of vanwege het bestuur van een openbaar lichaam aangesteld of daaraan ondergeschikt;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel80
  - number: 80.1.m
    text: |-
      ambtenaar, door of vanwege het Rijk aangesteld, tot wiens taak behoort het verrichten van werkzaamheden in het
      kader van het toezicht op het openbaar lichaam;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel80
  - number: 80.1.n
    text: |-
      functionaris die krachtens de wet of een algemene maatregel van bestuur het bestuur van een openbaar lichaam van
      advies dient.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel80
  - number: '80.2'
    text: |-
      In afwijking van het eerste lid, aanhef en onderdeel l, kan een gezaghebber tevens ambtenaar van de burgerlijke
      stand zijn.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel80
  - number: '81.1'
    text: |-
      Bloed- of aanverwantschap tot en met de tweede graad of huwelijk mag niet bestaan tussen de gezaghebber en een
      ander lid van het bestuurscollege.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel81
  - number: '81.2'
    text: |-
      [Artikel 41, tweede tot en met vierde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel41
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '41'
        hoofdstuk: III
        afdeling: III
  - number: '82.1'
    text: |-
      [Artikel 16, eerste en tweede lid][ref1], is van overeenkomstige toepassing op de gezaghebber.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel16
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '16'
        hoofdstuk: III
        afdeling: II
  - number: '82.2'
    text: De eilandsraad stelt voor de gezaghebber een gedragscode vast.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel82
  - number: '83'
    text: |-
      De [artikelen 49 tot en met 52][ref1] zijn van overeenkomstige toepassing op de gezaghebber, met dien verstande dat
      in [artikel 49][ref2] voor «ontslag» wordt gelezen «ontslag onderscheidenlijk afloop van de benoemingstermijn» en
      dat in [artikel 52][ref3] voor «eilandsraad» wordt gelezen «Onze Minister».


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0028142#Artikel49
      [ref3]: https://wetten.overheid.nl/BWBR0028142#Artikel52
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '49'
        hoofdstuk: III
        afdeling: III
      - id: ref2
        bwb_id: BWBR0028142
        artikel: '49'
        hoofdstuk: III
        afdeling: III
      - id: ref3
        bwb_id: BWBR0028142
        artikel: '52'
        hoofdstuk: III
        afdeling: III
  - number: '84'
    text: |-
      Het ambt van gezaghebber ontheft van alle bij of krachtens de wet opgelegde verplichtingen tot het verrichten van
      persoonlijke diensten.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel84
  - number: '85.1'
    text: De gezaghebber heeft zijn werkelijke woonplaats in het openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel85
  - number: '85.2'
    text: |-
      De Rijksvertegenwoordiger kan voor ten hoogste drie maanden ontheffing verlenen van de verplichting om de
      werkelijke woonplaats in het openbaar lichaam te hebben.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel85
  - number: '86.1'
    text: |-
      Indien de gezaghebber langer dan zes weken buiten het openbaar lichaam wenst te verblijven, behoeft hij daartoe
      de toestemming van de Rijksvertegenwoordiger. De toestemming mag alleen worden verleend indien het belang van het
      openbaar lichaam zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel86
  - number: '86.2'
    text: |-
      De [Algemene Termijnenwet][ref1] is niet van toepassing op de termijn, genoemd in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002448
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0002448
  - number: '87.1'
    text: |-
      Voor zover dit niet bij de wet is geschied, worden bij of krachtens algemene maatregel van bestuur ten aanzien van
      de gezaghebber regels vastgesteld betreffende:
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel87
  - number: 87.1.a
    text: benoeming, schorsing, tijdelijk niet uitoefenen van zijn functie en ontslag;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel87
  - number: 87.1.b
    text: het onderzoek naar de geschiktheid en bekwaamheid;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel87
  - number: 87.1.c
    text: uitkering bij ontslag;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel87
  - number: 87.1.d
    text: aanspraken in geval van ziekte;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel87
  - number: 87.1.e
    text: bescherming bij de arbeid;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel87
  - number: 87.1.f
    text: andere aangelegenheden, zijn rechtspositie betreffende, die regeling behoeven.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel87
  - number: '87.2'
    text: |-
      Bij de regels betreffende de aangelegenheden, genoemd in het eerste lid, kunnen financiële voorzieningen worden
      getroffen die ten laste van het openbaar lichaam komen.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel87
  - number: '88.1'
    text: Alle aan de eilandsraad of aan het bestuurscollege gerichte stukken worden door of namens de gezaghebber geopend.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel88
  - number: '88.2'
    text: |-
      Van de ontvangst van aan de eilandsraad gerichte stukken die niet terstond in de vergadering van de eilandsraad aan
      de orde worden gesteld, doet hij in de eerstvolgende vergadering van de eilandsraad mededeling.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel88
  - number: '89'
    text: |-
      Bij koninklijk besluit wordt bepaald, welke de onderscheidingstekenen van de gezaghebber zijn en bij welke
      gelegenheden hij deze zal dragen.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel89
  - number: '90.1'
    text: |-
      Bij verhindering of ontstentenis van de gezaghebber wordt zijn ambt waargenomen door een door het bestuurscollege
      aan te wijzen eilandgedeputeerde. Het voorzitterschap van de eilandsraad wordt in dat geval waargenomen door het
      langstzittende lid van de eilandsraad. Indien meer leden van de eilandsraad even lang zitting hebben, vindt de
      waarneming plaats door het oudste lid in jaren van hen. De eilandsraad kan een ander lid van de eilandsraad met de
      waarneming belasten.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel90
  - number: '90.2'
    text: |-
      Bij verhindering of ontstentenis van alle eilandgedeputeerden wordt het ambt waargenomen door het langstzittende
      lid van de eilandsraad. Indien meer leden van de eilandsraad even lang zitting hebben, vindt de waarneming plaats
      door het oudste lid in jaren van hen. De eilandsraad kan een ander lid van de eilandsraad met de waarneming
      belasten.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel90
  - number: '91.1'
    text: |-
      Indien de Rijksvertegenwoordiger het in het belang van het openbaar lichaam nodig oordeelt, voorziet hij in
      afwijking van [artikel 90][ref1] in de waarneming. Alvorens daartoe over te gaan hoort hij de eilandsraad, tenzij
      gewichtige redenen zich daartegen verzetten.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel90
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '90'
        hoofdstuk: III
        afdeling: IV
  - number: '91.2'
    text: |-
      Hij die door de Rijksvertegenwoordiger met de waarneming van het ambt van gezaghebber is belast, legt in handen van
      de Rijksvertegenwoordiger een overeenkomstig [artikel 77][ref1] luidende eed (verklaring en belofte) af.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel77
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '77'
        hoofdstuk: III
        afdeling: IV
  - number: '92'
    text: |-
      De toekenning van een vergoeding ten laste van het openbaar lichaam aan degene die met de waarneming van het ambt
      van gezaghebber is belast, wordt geregeld bij of krachtens algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel92
  - number: '93'
    text: |-
      Ten aanzien van degene die met de waarneming van het ambt van gezaghebber is belast, zijn de
      [artikelen 80 tot en met 82][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel80
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '80'
        hoofdstuk: III
        afdeling: IV
  - number: '94.1'
    text: |-
      De eilandsraad kan regelen van welke beslissingen van de gezaghebber aan de leden van de eilandsraad kennisgeving
      wordt gedaan. Daarbij kan de eilandsraad de gevallen bepalen waarin met terinzagelegging kan worden volstaan.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel94
  - number: '94.2'
    text: |-
      De gezaghebber laat de kennisgeving of terinzagelegging achterwege voor zover deze in strijd is met het openbaar
      belang.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel94
  - number: '95'
    text: De eilandsraden stellen gezamenlijk bij eilandsverordening een gezamenlijke rekenkamer in.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel95
  - number: '96.1'
    text: De gezamenlijke rekenkamer bestaat uit drie leden.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel96
  - number: '96.2'
    text: Elke eilandsraad benoemt één lid van de gezamenlijke rekenkamer voor de duur van zes jaar
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel96
  - number: '96.3'
    text: |-
      De eilandsraad kan voor het lid dat hij heeft benoemd een plaatsvervangend lid benoemen. Deze afdeling is op
      plaatsvervangende leden van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel96
  - number: '96.4'
    text: De eilandsraad kan een lid herbenoemen.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel96
  - number: '96.5'
    text: |-
      Voorafgaand aan de benoemingen, bedoeld in het tweede tot en met het vierde lid, pleegt de eilandsraad overleg met
      de gezamenlijke rekenkamer.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel96
  - number: '96.6'
    text: 'Een lid van de gezamenlijke rekenkamer wordt door de eilandsraad die hem heeft benoemd, ontslagen:'
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel96
  - number: 96.6.a
    text: op eigen verzoek;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel96
  - number: 96.6.b
    text: bij de aanvaarding van een functie die onverenigbaar is met het lidmaatschap;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel96
  - number: 96.6.c
    text: |-
      indien hij bij onherroepelijk geworden rechterlijke uitspraak wegens misdrijf is veroordeeld, dan wel hem bij zulk
      een uitspraak een maatregel is opgelegd die vrijheidsbeneming tot gevolg heeft;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel96
  - number: 96.6.d
    text: |-
      indien hij bij onherroepelijk geworden rechterlijke uitspraak onder curatele is gesteld, in staat van faillissement
      is verklaard, surséance van betaling heeft verkregen of wegens schulden is gegijzeld.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel96
  - number: '96.7'
    text: 'Een lid van de gezamenlijke rekenkamer kan door de eilandsraad die hem heeft benoemd, worden ontslagen:'
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel96
  - number: 96.7.a
    text: indien hij door ziekte of gebreken blijvend ongeschikt is zijn functie te vervullen;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel96
  - number: 96.7.b
    text: |-
      indien hij handelt in strijd met [artikel 101][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel101
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '101'
        hoofdstuk: III
        afdeling: V
  - number: '97.1'
    text: 'De eilandsraad stelt een door hem benoemd lid van de gezamenlijke rekenkamer op non-actief indien:'
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel97
  - number: 97.1.a
    text: hij zich in voorlopige hechtenis bevindt;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel97
  - number: 97.1.b
    text: |-
      hij bij een nog niet onherroepelijk geworden rechterlijke uitspraak wegens misdrijf is veroordeeld, dan wel hem bij
      zulk een uitspraak een maatregel is opgelegd die vrijheidsbeneming tot gevolg heeft;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel97
  - number: 97.1.c
    text: |-
      hij onder curatele is gesteld, in staat van faillissement is verklaard, surséance van betaling heeft verkregen of
      wegens schulden is gegijzeld ingevolge een nog niet onherroepelijk geworden rechterlijke uitspraak.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel97
  - number: '97.2'
    text: |-
      De eilandsraad kan een door hem benoemd lid van de gezamenlijke rekenkamer op non-actief stellen, indien tegen
      dit lid een gerechtelijk onderzoek ter zake van een misdrijf wordt ingesteld of indien er een ander ernstig
      vermoeden is van het bestaan van feiten en omstandigheden die tot ontslag, anders dan op gronden, genoemd in
      [artikel 96, zesde lid, onderdeel a, en zevende lid, onderdeel a][ref1], zouden kunnen leiden.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel96
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '96'
        hoofdstuk: III
        afdeling: V
  - number: '97.3'
    text: |-
      De eilandsraad beëindigt de non-activiteit zodra de grond voor de maatregel is vervallen, met dien verstande dat in
      een geval als bedoeld in het tweede lid de non-activiteit in ieder geval eindigt na zes maanden. In dat geval kan
      de eilandsraad de maatregel telkens voor ten hoogste drie maanden verlengen.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel97
  - number: '98'
    text: |-
      [Artikel 13][ref1] is van overeenkomstige toepassing op de leden van de gezamenlijke rekenkamer.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel13
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '13'
        hoofdstuk: III
        afdeling: II
  - number: '99.1'
    text: 'Een lid van de gezamenlijke rekenkamer is niet tevens:'
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel99
  - number: 99.1.a
    text: minister;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel99
  - number: 99.1.b
    text: staatssecretaris;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel99
  - number: 99.1.c
    text: lid van de Raad van State;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel99
  - number: 99.1.d
    text: lid van de Algemene Rekenkamer;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel99
  - number: 99.1.e
    text: Nationale ombudsman;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel99
  - number: 99.1.f
    text: |-
      substituut-ombudsman als bedoeld in [artikel 9, eerste lid, van de Wet Nationale ombudsman][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel9
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: '9'
  - number: 99.1.g
    text: Rijksvertegenwoordiger;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel99
  - number: 99.1.h
    text: lid van een eilandsraad;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel99
  - number: 99.1.i
    text: gezaghebber;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel99
  - number: 99.1.j
    text: eilandgedeputeerde;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel99
  - number: 99.1.k
    text: gezamenlijke ombudsman of lid van de gezamenlijke ombudscommissie;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel99
  - number: 99.1.l
    text: |-
      lid van een commissie als bedoeld in de [artikelen 117][ref1] en [118][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel117
      [ref2]: https://wetten.overheid.nl/BWBR0028142#Artikel118
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '117'
        hoofdstuk: III
        afdeling: VII
      - id: ref2
        bwb_id: BWBR0028142
        artikel: '118'
        hoofdstuk: III
        afdeling: VII
  - number: 99.1.m
    text: ambtenaar, door of vanwege het bestuur van een openbaar lichaam aangesteld of daaraan ondergeschikt;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel99
  - number: 99.1.n
    text: |-
      ambtenaar, door of vanwege het Rijk aangesteld, tot wiens taak behoort het verrichten van werkzaamheden in het
      kader van het toezicht op een openbaar lichaam;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel99
  - number: 99.1.o
    text: |-
      functionaris die krachtens de wet of een algemene maatregel van bestuur het bestuur van een openbaar lichaam van
      advies dient.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel99
  - number: '99.2'
    text: 'In afwijking van het eerste lid, aanhef en onderdeel m, kan een lid van de gezamenlijke rekenkamer tevens zijn:'
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel99
  - number: 99.2.a
    text: ambtenaar van de burgerlijke stand;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel99
  - number: 99.2.b
    text: |-
      vrijwilliger of ander persoon die uit hoofde van een wettelijke verplichting niet bij wijze van beroep hulpdiensten
      verricht;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel99
  - number: 99.2.c
    text: ambtenaar werkzaam voor een school voor openbaar onderwijs.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel99
  - number: '100.1'
    text: |-
      Alvorens zijn functie te kunnen uitoefenen, legt een lid van de gezamenlijke rekenkamer in de vergadering van de
      eilandsraad, die hem heeft benoemd, in handen van de voorzitter, de volgende eed (verklaring en belofte) af: «Ik
      zweer (verklaar) dat ik, om tot lid van de gezamenlijke rekenkamer benoemd te worden, rechtstreeks noch middellijk,
      onder welke naam of welk voorwendsel ook, enige gift of gunst heb gegeven of beloofd. Ik zweer (verklaar en beloof)
      dat ik, om iets in dit ambt te doen of te laten, rechtstreeks noch middellijk enig geschenk of enige belofte heb
      aangenomen of zal aannemen. Ik zweer (beloof) dat ik getrouw zal zijn aan de [Grondwet][ref1], dat ik de wetten
      zal nakomen en dat ik mijn plichten als lid van de gezamenlijke rekenkamer naar eer en geweten zal vervullen. Zo
      waarlijk helpe mij God Almachtig!» («Dat verklaar en beloof ik!»)


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: '100.2'
    text: In plaats van in het Nederlands kan de eed (verklaring en belofte) in het Papiaments of het Engels worden afgelegd.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel100
  - number: '100.3'
    text: |-
      Wanneer de eed (verklaring en belofte) in het Papiaments wordt afgelegd, luidt de tekst van de eed (verklaring
      en belofte) als volgt: «Mi ta hura (deklará) ku pa mi nombramentu den e kargo o funshon di kontraloria general mi
      no a duna ni primintí, ni direkta- ni indirektamente, bou di ningun nòmber ni denominashon ni preteksto, ningun
      regalo ni fabor. Mi ta hura (deklará i primintí) ku mi no a risibí ni mi no a aseptá, ni lo mi no aseptá, ni
      direkta- ni indirektamente, ningun regalo ni ningun promesa di hasi algu o laga di hasi algu den e kargo o funshon
      en kuestion. Mi ta hura (primintí) ku lo mi ta fiel na Konstitushon, ku lo mi kumpli ku lei i ku lo mi kumpli ku
      mi obligashonnan komo kontraloria general segun mi konsenshi i honor. Ku Dios Todopoderoso yudami!» (Esei mi ta
      deklará i primintí!»)
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel100
  - number: '100.4'
    text: |-
      Wanneer de eed (verklaring en belofte) in het Engels wordt afgelegd, luidt de tekst van de eed (verklaring en
      belofte) als volgt: «I swear (affirm) that I neither gave nor promised any gift or favour, either directly or
      indirectly, under any name or pretext whatsoever, in order to be appointed Member of the court of audit. I swear
      (affirm and promise) that I have made no gift or promise, and shall accept no gift or promise, either directly or
      indirectly, in order to do or to omit to do anything in the course of my duties. I swear (promise) that I will bear
      allegiance to the Constitution, that I will observe the laws and that I will perform my duties as Member of the
      court of audit in good faith. So help me God Almighty! (This I affirm and promise!)
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel100
  - number: '101'
    text: |-
      [Artikel 16, eerste en tweede lid][ref1], is van overeenkomstige toepassing op de leden van de gezamenlijke
      rekenkamer.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel16
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '16'
        hoofdstuk: III
        afdeling: II
  - number: '102.1'
    text: De gezamenlijke rekenkamer stelt een reglement van orde vast voor haar werkzaamheden en haar vergaderingen.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel102
  - number: '102.2'
    text: |-
      De gezamenlijke rekenkamer zendt het reglement ter kennisneming aan de eilandsraden en maakt het bekend door
      plaatsing in de afkondigingsbladen van de openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel102
  - number: '103'
    text: |-
      De eilandsraden stellen, na overleg met de gezamenlijke rekenkamer, de gezamenlijke rekenkamer de nodige middelen
      ter beschikking voor een goede uitoefening van haar werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel103
  - number: '104.1'
    text: |-
      De personen die werkzaamheden verrichten voor de gezamenlijke rekenkamer, zijn ter zake van die werkzaamheden
      uitsluitend verantwoording schuldig aan de gezamenlijke rekenkamer.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel104
  - number: '104.2'
    text: |-
      Ambtenaren die werkzaamheden verrichten voor een orgaan van een openbaar lichaam kunnen niet tevens werkzaamheden
      verrichten voor de gezamenlijke rekenkamer.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel104
  - number: '105.1'
    text: |-
      In de eilandsverordening waarbij de gezamenlijke rekenkamer wordt ingesteld worden ten minste regels gesteld met
      betrekking tot:
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel105
  - number: 105.1.a
    text: het voorzitterschap van de gezamenlijke rekenkamer;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel105
  - number: 105.1.b
    text: |-
      de vergoeding die de leden van de gezamenlijke rekenkamer voor hun werkzaamheden ontvangen en de tegemoetkoming in
      de kosten;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel105
  - number: 105.1.c
    text: de ondersteuning van de gezamenlijke rekenkamer.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel105
  - number: '105.2'
    text: De eilandsverordening behoeft de goedkeuring van de Rijksvertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel105
  - number: '106'
    text: |-
      [Titel 9.2 van de Algemene wet bestuursrecht][ref1], met uitzondering van de [artikelen 9:20][ref2] en [9:21][ref3],
      is van overeenkomstige toepassing op schriftelijke verzoeken om een onderzoek in te stellen naar de wijze waarop
      een bestuursorgaan van het openbaar lichaam zich in een bepaalde aangelegenheid heeft gedragen met dien verstande
      dat in [artikel 9:36, eerste lid][ref4], voor «[artikel 10 van de Wet openbaarheid van bestuur][ref5]» wordt
      gelezen: [artikel 11 van de Wet openbaarheid van bestuur BES][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel9
      [ref5]: https://wetten.overheid.nl/BWBR0005252#Artikel10
      [ref6]: https://wetten.overheid.nl/BWBR0028154#Artikel11
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '9'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '9'
      - id: ref5
        bwb_id: BWBR0005252
        artikel: '10'
      - id: ref6
        bwb_id: BWBR0028154
        artikel: '11'
  - number: '107.1'
    text: |-
      De eilandsraden kunnen voor de behandeling van verzoekschriften als bedoeld in
      [artikel 9:18, eerste lid, van de Algemene wet bestuursrecht][ref1] een gezamenlijke ombudsman of een gezamenlijke
      ombudscommissie instellen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel9
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '9'
  - number: '107.2'
    text: |-
      Een gezamenlijke ombudsman of gezamenlijke ombudscommissie kan slechts per 1 januari van enig jaar worden
      ingesteld. Indien de eilandsraden hiertoe besluiten, zenden zij het besluit tot instelling aan de Nationale
      ombudsman voor 1 juli van het jaar voorafgaand aan het jaar waarin de instelling ingaat.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel107
  - number: '107.3'
    text: |-
      De instelling van een gezamenlijke ombudsman of gezamenlijke ombudscommissie kan slechts per 1 januari van enig
      jaar worden beëindigd. Indien de eilandsraden hiertoe besluiten, zenden zij het besluit tot beëindiging van de
      instelling aan de Nationale ombudsman voor 1 juli van het jaar voorafgaand aan het jaar waarin de instelling
      eindigt.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel107
  - number: '108'
    text: |-
      Indien de eilandsraden een gezamenlijke ombudsman of een gezamenlijke ombudscommissie instellen met toepassing
      van de [Wet gemeenschappelijke regelingen][ref1], zijn de in die wet ten aanzien van gemeenschappelijke organen
      opgenomen bepalingen slechts van toepassing voor zover de aard van de aan de gezamenlijke ombudsman of de
      gezamenlijke ombudscommissie opgedragen taken zich daartegen niet verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0003740
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0003740
  - number: '109.1'
    text: |-
      Indien de eilandsraden besluiten tot het instellen van een gezamenlijke ombudsman benoemen zij deze voor de duur
      van zes jaar.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel109
  - number: '109.2'
    text: |-
      De eilandsraden benoemen een plaatsvervangend gezamenlijke ombudsman. Deze paragraaf is op de plaatsvervangend
      gezamenlijke ombudsman van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel109
  - number: '109.3'
    text: 'De gezamenlijke ombudsman wordt door de eilandsraden ontslagen:'
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel109
  - number: 109.3.a
    text: op eigen verzoek;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel109
  - number: 109.3.b
    text: wanneer hij door ziekte of gebreken blijvend ongeschikt is zijn functie te vervullen;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel109
  - number: 109.3.c
    text: |-
      bij de aanvaarding van een betrekking als bedoeld in [artikel 110, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel110
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '110'
        hoofdstuk: III
        paragraaf: '2'
        afdeling: VI
  - number: 109.3.d
    text: |-
      wanneer hij bij onherroepelijk geworden rechterlijke uitspraak wegens misdrijf is veroordeeld, dan wel hem bij zulk
      een uitspraak een maatregel is opgelegd die vrijheidsbeneming tot gevolg heeft;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel109
  - number: 109.3.e
    text: |-
      indien hij bij onherroepelijk geworden rechterlijke uitspraak onder curatele is gesteld, in staat van faillissement
      is verklaard, hij surseance van betaling heeft verkregen of wegens schulden is gegijzeld;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel109
  - number: 109.3.f
    text: indien hij naar het oordeel van de eilandsraden ernstig nadeel toebrengt aan het in hem gestelde vertrouwen.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel109
  - number: '109.4'
    text: 'De eilandsraden stellen de gezamenlijke ombudsman op non-actief indien hij:'
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel109
  - number: 109.4.a
    text: zich in voorlopige hechtenis bevindt;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel109
  - number: 109.4.b
    text: |-
      bij een nog niet onherroepelijk geworden rechterlijke uitspraak wegens misdrijf is veroordeeld, dan wel hem bij
      zulk een uitspraak een maatregel is opgelegd die vrijheidsbeneming tot gevolg heeft;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel109
  - number: 109.4.c
    text: |-
      onder curatele is gesteld, in staat van faillissement is verklaard, hij surseance van betaling heeft verkregen of
      wegens schulden is gegijzeld ingevolge een nog niet onherroepelijk geworden rechterlijke uitspraak.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel109
  - number: '110.1'
    text: |-
      De gezamenlijke ombudsman vervult geen betrekkingen waarvan de uitoefening ongewenst is met het oog op een goede
      vervulling van zijn ambt of op de handhaving van zijn onpartijdigheid en onafhankelijkheid of van het vertrouwen
      daarin.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel110
  - number: '110.2'
    text: |-
      [Artikel 13][ref1] is van overeenkomstige toepassing op de gezamenlijke ombudsman.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel13
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '13'
        hoofdstuk: III
        afdeling: II
  - number: '111.1'
    text: |-
      Alvorens zijn functie te kunnen uitoefenen, legt de gezamenlijke ombudsman in de vergadering van een bij zijn
      benoeming aan te wijzen eilandsraad, in handen van de voorzitter, de volgende eed (verklaring en belofte) af:
      «Ik zweer (verklaar) dat ik, om tot ombudsman benoemd te worden, rechtstreeks noch middellijk, onder welke naam
      of welk voorwendsel ook, enige gift of gunst heb gegeven of beloofd. Ik zweer (verklaar en beloof) dat ik, om
      iets in dit ambt te doen of te laten, rechtstreeks noch middellijk enig geschenk of enige belofte heb aangenomen
      of zal aannemen. Ik zweer (verklaar en beloof) dat ik getrouw zal zijn aan de [Grondwet][ref1], dat ik de wetten
      zal nakomen en dat ik mijn plichten als ombudsman naar eer en geweten zal vervullen. Zo waarlijk helpe mij God
      almachtig!» («Dat verklaar en beloof ik!»)


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: '111.2'
    text: In plaats van in het Nederlands kan de eed (verklaring en belofte) in het Papiaments of het Engels worden afgelegd.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel111
  - number: '111.3'
    text: |-
      Wanneer de eed (verklaring en belofte) in het Papiaments wordt afgelegd, luidt de tekst van de eed (verklaring
      en belofte) als volgt: «Mi ta hura (deklará) ku pa mi nombramentu den e kargo o funshon di ombudsman mi no a
      duna ni primintí, ni direkta- ni indirektamente, bou di ningun nòmber ni denominashon ni preteksto, ningun regalo
      ni fabor. Mi ta hura (deklará i primintí) ku mi no a risibí ni mi no a aseptá, ni lo mi no aseptá, ni direkta-
      ni indirektamente, ningun regalo ni ningun promesa di hasi algu o laga di hasi algu den e kargo o funshon en
      kuestion. Mi ta hura (primintí) ku lo mi ta fiel na Konstitushon, ku lo mi kumpli ku lei i ku lo mi kumpli ku
      mi obligashonnan komo ombudsman segun mi konsenshi i honor. Ku Dios Todopoderoso yudami!» (Esei mi ta deklará
      i primintí!»)
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel111
  - number: '111.4'
    text: |-
      Wanneer de eed (verklaring en belofte) in het Engels wordt afgelegd, luidt de tekst van de eed (verklaring en
      belofte) als volgt: «I swear (affirm) that I neither gave nor promised any gift or favour, either directly or
      indirectly, under any name or pretext whatsoever, in order to be appointed ombudsman. I swear (affirm and promise)
      that I have made no gift or promise, and shall accept no gift or promise, either directly or indirectly, in order
      to do or to omit to do anything in the course of my duties. I swear (promise) that I will bear allegiance to the
      Constitution, that I will observe the laws and that I will perform my duties as ombudsman in good faith. So help me
      God Almighty! (This I affirm and promise!)
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel111
  - number: '112.1'
    text: |-
      Op voordracht van de gezamenlijke ombudsman benoemen de bestuurscolleges het personeel van de gezamenlijke
      ombudsman dat nodig is voor een goede uitoefening van zijn werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel112
  - number: '112.2'
    text: |-
      De gezamenlijke ombudsman ontvangt ter zake van de uitoefening van zijn werkzaamheden geen instructies, noch in het
      algemeen, noch voor een enkel geval.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel112
  - number: '112.3'
    text: |-
      Het personeel van de gezamenlijke ombudsman verricht geen werkzaamheden voor een bestuursorgaan naar wiens
      gedraging de gezamenlijke ombudsman een onderzoek kan instellen.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel112
  - number: '112.4'
    text: |-
      Het personeel van de gezamenlijke ombudsman is ter zake van de werkzaamheden die het voor de gezamenlijke ombudsman
      verricht, uitsluitend aan hem verantwoording schuldig.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel112
  - number: '113'
    text: De gezamenlijke ombudsman zendt jaarlijks een verslag van zijn werkzaamheden aan de eilandsraden.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel113
  - number: '114'
    text: |-
      De gezamenlijke ombudsman ontvangt een bij eilandsverordening van de eilandsraden vastgestelde vergoeding voor zijn
      werkzaamheden en een tegemoetkoming in de kosten.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel114
  - number: '115.1'
    text: |-
      Indien de eilandsraden besluiten tot het instellen van een gezamenlijke ombudscommissie, stellen zij het aantal
      leden van de gezamenlijke ombudscommissie vast.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel115
  - number: '115.2'
    text: De eilandsraden benoemen de leden van de gezamenlijke ombudscommissie voor de duur van zes jaar.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel115
  - number: '115.3'
    text: |-
      De eilandsraden benoemen uit de leden de voorzitter en de plaatsvervangend voorzitter van de gezamenlijke
      ombudscommissie.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel115
  - number: '116.1'
    text: De gezamenlijke ombudscommissie zendt jaarlijks een verslag van zijn werkzaamheden aan de eilandsraden.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel116
  - number: '116.2'
    text: |-
      Op de gezamenlijke ombudscommissie en op ieder lid afzonderlijk zijn de [artikelen 109, derde en vierde lid][ref1],
      [110][ref2], [111][ref3], [112][ref4] en [114][ref5] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel109
      [ref2]: https://wetten.overheid.nl/BWBR0028142#Artikel110
      [ref3]: https://wetten.overheid.nl/BWBR0028142#Artikel111
      [ref4]: https://wetten.overheid.nl/BWBR0028142#Artikel112
      [ref5]: https://wetten.overheid.nl/BWBR0028142#Artikel114
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '109'
        hoofdstuk: III
        paragraaf: '2'
        afdeling: VI
      - id: ref2
        bwb_id: BWBR0028142
        artikel: '110'
        hoofdstuk: III
        paragraaf: '2'
        afdeling: VI
      - id: ref3
        bwb_id: BWBR0028142
        artikel: '111'
        hoofdstuk: III
        paragraaf: '2'
        afdeling: VI
      - id: ref4
        bwb_id: BWBR0028142
        artikel: '112'
        hoofdstuk: III
        paragraaf: '2'
        afdeling: VI
      - id: ref5
        bwb_id: BWBR0028142
        artikel: '114'
        hoofdstuk: III
        paragraaf: '2'
        afdeling: VI
  - number: '117.1'
    text: |-
      De eilandsraad kan eilandsraadscommissies instellen die besluitvorming van de eilandsraad kunnen voorbereiden
      en met het bestuurscollege of de gezaghebber kunnen overleggen. Hij regelt daarbij de taken, de bevoegdheden,
      de samenstelling en de werkwijze, daaronder begrepen de wijze waarop de leden van de eilandsraad inzage hebben
      in stukken waaromtrent door een eilandsraadscommissie geheimhouding is opgelegd. Deze inzage kan slechts worden
      geweigerd voor zover zij in strijd is met het openbaar belang.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel117
  - number: '117.2'
    text: De gezaghebber en de eilandgedeputeerden zijn geen lid van een eilandsraadscommissie.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel117
  - number: '117.3'
    text: |-
      Bij de samenstelling van een eilandsraadscommissie zorgt de eilandsraad, voor zover het de benoeming betreft van
      leden van de eilandsraad, voor een evenwichtige vertegenwoordiging van de in de eilandsraad vertegenwoordigde
      groeperingen.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel117
  - number: '117.4'
    text: Een lid van de eilandsraad is voorzitter van een eilandsraadscommissie.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel117
  - number: '117.5'
    text: |-
      De [artikelen 20][ref1] en [22 tot en met 24][ref2] zijn van overeenkomstige toepassing op een vergadering van een
      eilandsraadscommissie, met dien verstande dat in [artikel 20][ref3] voor «gezaghebber» wordt gelezen «voorzitter
      van een eilandsraadscommissie» en in [artikel 24, zesde lid][ref4], voor «[artikel 26][ref5]» wordt gelezen
      «[artikel 119][ref6]».


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0028142#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0028142#Artikel20
      [ref4]: https://wetten.overheid.nl/BWBR0028142#Artikel24
      [ref5]: https://wetten.overheid.nl/BWBR0028142#Artikel26
      [ref6]: https://wetten.overheid.nl/BWBR0028142#Artikel119
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '20'
        hoofdstuk: III
        afdeling: II
      - id: ref2
        bwb_id: BWBR0028142
        artikel: '22'
        hoofdstuk: III
        afdeling: II
      - id: ref3
        bwb_id: BWBR0028142
        artikel: '20'
        hoofdstuk: III
        afdeling: II
      - id: ref4
        bwb_id: BWBR0028142
        artikel: '24'
        hoofdstuk: III
        afdeling: II
      - id: ref5
        bwb_id: BWBR0028142
        artikel: '26'
        hoofdstuk: III
        afdeling: II
      - id: ref6
        bwb_id: BWBR0028142
        artikel: '119'
        hoofdstuk: III
        afdeling: VII
  - number: '118.1'
    text: |-
      De eilandsraad, het bestuurscollege of de gezaghebber kan andere commissies dan de commissies, bedoeld in
      [artikel 117, eerste lid][ref1], instellen.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel117
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '117'
        hoofdstuk: III
        afdeling: VII
  - number: '118.2'
    text: |-
      De gezaghebber en de eilandgedeputeerden zijn geen lid van een door de eilandsraad ingestelde andere commissie.
      Leden van de eilandsraad zijn geen lid van een door het bestuurscollege of de gezaghebber ingestelde commissie.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel118
  - number: '118.3'
    text: |-
      Het tweede lid is niet van toepassing op commissies die zijn ingesteld om te adviseren over de beslissing op
      ingediende bezwaarschriften en commissies belast met de behandeling van en de advisering over klachten.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel118
  - number: '118.4'
    text: |-
      De eilandsraad, het bestuurscollege onderscheidenlijk de gezaghebber regelt ten aanzien van een door hem ingestelde
      andere commissie de openbaarheid van de vergaderingen.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel118
  - number: '118.5'
    text: |-
      De [artikelen 129, tweede lid][ref1], [143][ref2] en [144][ref3] zijn van overeenkomstige toepassing op een besluit
      tot instelling van een andere commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel129
      [ref2]: https://wetten.overheid.nl/BWBR0028142#Artikel143
      [ref3]: https://wetten.overheid.nl/BWBR0028142#Artikel144
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '129'
        hoofdstuk: III
        paragraaf: '2'
        afdeling: IX
      - id: ref2
        bwb_id: BWBR0028142
        artikel: '143'
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0028142
        artikel: '144'
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: I
  - number: '119.1'
    text: |-
      Een commissie kan in een besloten vergadering, op grond van een belang, genoemd in
      [artikel 11 van de Wet openbaarheid van bestuur BES][ref1], omtrent het in die vergadering met gesloten deuren
      behandelde en omtrent de inhoud van de stukken die aan de commissie worden overgelegd, geheimhouding opleggen.
      Geheimhouding omtrent het in een besloten vergadering behandelde wordt tijdens die vergadering opgelegd. De
      geheimhouding wordt door hen die bij de behandeling aanwezig waren en allen die van het behandelde of de stukken
      kennis dragen, in acht genomen totdat de commissie haar opheft.


      [ref1]: https://wetten.overheid.nl/BWBR0028154#Artikel11
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0028154
        artikel: '11'
  - number: '119.2'
    text: |-
      Op grond van een belang, genoemd in [artikel 11 van de Wet openbaarheid van bestuur BES][ref1], kan de
      geheimhouding eveneens worden opgelegd door de voorzitter van een commissie, het bestuurscollege en de gezaghebber,
      ieder ten aanzien van stukken die hij aan een commissie overlegt. Daarvan wordt op de stukken melding gemaakt. De
      geheimhouding wordt in acht genomen totdat het orgaan dat de verplichting heeft opgelegd, dan wel de eilandsraad
      haar opheft.


      [ref1]: https://wetten.overheid.nl/BWBR0028154#Artikel11
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0028154
        artikel: '11'
  - number: '119.3'
    text: |-
      Indien een commissie zich ter zake van het behandelde waarvoor een verplichting tot geheimhouding geldt tot de
      eilandsraad heeft gericht, wordt de geheimhouding in acht genomen totdat de eilandsraad haar opheft.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel119
  - number: '120.1'
    text: |-
      De leden van de eilandsraad en de leden van de eilandsraad aan wie ingevolge [artikel Ya 13][ref1] juncto
      [artikel X 10 van de Kieswet][ref2] ontslag is verleend wegens zwangerschap en bevalling of ziekte ontvangen een
      bij eilandsverordening van de eilandsraad vast te stellen vergoeding voor hun werkzaamheden en een tegemoetkoming
      in de kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0004627
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelX_10
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0004627
      - id: ref2
        bwb_id: BWBR0004627
        artikel: X_10
  - number: '120.2'
    text: |-
      De eilandsraad kan bij eilandsverordening regels stellen over de tegemoetkoming in of vergoeding van bijzondere
      kosten en over andere financiële voorzieningen die verband houden met de vervulling van het lidmaatschap van de
      eilandsraad.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel120
  - number: '120.3'
    text: |-
      Het eerste en tweede lid zijn niet van toepassing op een lid van de eilandsraad dat met inachtneming van
      [artikel 14, tweede lid][ref1], tevens eilandgedeputeerde is.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel14
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '14'
        hoofdstuk: III
        afdeling: II
  - number: '120.4'
    text: |-
      De eilandsverordeningen, bedoeld in het eerste en tweede lid, worden vastgesteld overeenkomstig bij of krachtens
      algemene maatregel van bestuur te stellen regels.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel120
  - number: '121.1'
    text: |-
      De leden van een door de eilandsraad, het bestuurscollege of de gezaghebber ingestelde commissie ontvangen, voor
      zover zij geen lid zijn van de eilandsraad of het bestuurscollege, een door de eilandsraad bij eilandsverordening
      vastgestelde vergoeding:
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel121
  - number: 121.1.a
    text: voor het bijwonen van vergaderingen van een commissie en
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel121
  - number: 121.1.b
    text: van reis- en verblijfkosten in verband met reizen binnen het openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel121
  - number: '121.2'
    text: |-
      In bijzondere gevallen kan de eilandsraad bij eilandsverordening bepalen dat de leden van het dagelijks bestuur van
      een commissie als bedoeld in [artikel 118][ref1], een vaste vergoeding voor hun werkzaamheden en een tegemoetkoming
      in de kosten ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel118
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '118'
        hoofdstuk: III
        afdeling: VII
  - number: '121.3'
    text: |-
      Ten aanzien van de vergoeding, bedoeld in het eerste lid, onderdeel a, worden bij of krachtens algemene maatregel
      van bestuur nadere regels gesteld. Ten aanzien van de overige vergoedingen bedoeld in dit artikel kunnen bij of
      krachtens algemene maatregel van bestuur nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel121
  - number: '122'
    text: |-
      Aan de leden van de eilandsraad en de personen, genoemd in [artikel 121, eerste lid][ref1], vindt vergoeding
      van reis- en verblijfkosten, gemaakt in verband met reizen buiten het grondgebied van het openbaar lichaam ter
      uitvoering van een beslissing van het eilandsbestuur, slechts plaats overeenkomstig door de eilandsraad bij
      eilandsverordening vastgestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel121
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel122
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '121'
        hoofdstuk: III
        afdeling: VIII
  - number: 122a
    text: |-
      De eilandsverordeningen, bedoeld in de [artikelen 120 tot en met 122][ref1], worden aan de Rijksvertegenwoordiger
      gezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel120
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel122a
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '120'
        hoofdstuk: III
        afdeling: VIII
  - number: '123.1'
    text: |-
      Buiten hetgeen hun bij of krachtens de wet is toegekend, ontvangen de leden van de eilandsraad en de van een door
      de eilandsraad, het bestuurscollege of de gezaghebber ingestelde commissie, als zodanig geen andere vergoedingen en
      tegemoetkomingen ten laste van het openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel123
  - number: '123.2'
    text: |-
      Voordelen ten laste van het openbaar lichaam, anders dan in de vorm van vergoedingen en tegemoetkomingen, genieten
      zij slechts voor zover de eilandsraad dit bij eilandsverordening bepaalt. De eilandsverordening behoeft de
      goedkeuring van de Rijksvertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel123
  - number: '124.1'
    text: In ieder openbaar lichaam is een eilandsecretaris en een eilandgriffier.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel124
  - number: '124.2'
    text: Een eilandsecretaris is niet tevens eilandgriffier.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel124
  - number: '125'
    text: |-
      [Artikel 16, eerste en tweede lid][ref1], is van overeenkomstige toepassing op de eilandsecretaris en de
      eilandgriffier.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel16
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '16'
        hoofdstuk: III
        afdeling: II
  - number: '126.1'
    text: |-
      Het bestuurscollege benoemt de eilandsecretaris. Hij is tevens bevoegd de eilandsecretaris te schorsen en te
      ontslaan.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel126
  - number: '126.2'
    text: |-
      Een besluit houdende de benoeming, bevordering, schorsing of ontslag van de eilandsecretaris behoeft de goedkeuring
      van de Rijksvertegenwoordiger. De goedkeuring kan slechts worden onthouden wegens strijd met het recht of het
      algemeen belang.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel126
  - number: '127.1'
    text: |-
      De eilandsecretaris staat het bestuurscollege, de gezaghebber en de door hen ingestelde commissies bij de
      uitoefening van hun taak terzijde.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel127
  - number: '127.2'
    text: Het bestuurscollege stelt in een instructie nadere regels over de taak en de bevoegdheden van de eilandsecretaris.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel127
  - number: '128'
    text: De eilandsecretaris is in de vergadering van het bestuurscollege aanwezig.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel128
  - number: '129.1'
    text: Het bestuurscollege regelt de vervanging van de eilandsecretaris.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel129
  - number: '129.2'
    text: |-
      De [artikelen 124, tweede lid][ref1] en [125 tot en met 128][ref2] zijn van overeenkomstige toepassing op degene
      die de eilandsecretaris vervangt.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel124
      [ref2]: https://wetten.overheid.nl/BWBR0028142#Artikel125
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '124'
        hoofdstuk: III
        paragraaf: '1'
        afdeling: IX
      - id: ref2
        bwb_id: BWBR0028142
        artikel: '125'
        hoofdstuk: III
        paragraaf: '1'
        afdeling: IX
  - number: '130'
    text: De eilandsraad benoemt de eilandgriffier. Hij is tevens bevoegd de eilandgriffier te schorsen en te ontslaan.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel130
  - number: '131.1'
    text: |-
      De eilandgriffier staat de eilandsraad en de door de eilandsraad ingestelde commissies bij de uitoefening van hun
      taak terzijde.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel131
  - number: '131.2'
    text: De eilandsraad stelt in een instructie nadere regels over de taak en de bevoegdheden van de eilandgriffier.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel131
  - number: '132'
    text: De eilandgriffier is in de vergadering van de eilandsraad aanwezig.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel132
  - number: '133.1'
    text: De eilandsraad regelt de vervanging van de eilandgriffier.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel133
  - number: '133.2'
    text: |-
      De [artikelen 124, tweede lid][ref1], [125][ref2], [130 tot en met 132][ref3] en [135][ref4] zijn van
      overeenkomstige toepassing op degene die de eilandgriffier vervangt.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel124
      [ref2]: https://wetten.overheid.nl/BWBR0028142#Artikel125
      [ref3]: https://wetten.overheid.nl/BWBR0028142#Artikel130
      [ref4]: https://wetten.overheid.nl/BWBR0028142#Artikel135
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel133
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '124'
        hoofdstuk: III
        paragraaf: '1'
        afdeling: IX
      - id: ref2
        bwb_id: BWBR0028142
        artikel: '125'
        hoofdstuk: III
        paragraaf: '1'
        afdeling: IX
      - id: ref3
        bwb_id: BWBR0028142
        artikel: '130'
        hoofdstuk: III
        paragraaf: '3'
        afdeling: IX
      - id: ref4
        bwb_id: BWBR0028142
        artikel: '135'
        hoofdstuk: III
        paragraaf: '3'
        afdeling: IX
  - number: '134.1'
    text: De eilandsraad kan regels stellen over de organisatie van de griffie.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel134
  - number: '134.2'
    text: De eilandsraad is bevoegd de op de griffie werkzame ambtenaren te benoemen, te schorsen en te ontslaan.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel134
  - number: '135'
    text: |-
      Een besluit houdende de benoeming, bevordering, schorsing of ontslag van de eilandgriffier en de op de griffie
      werkzame ambtenaren behoeft de goedkeuring van de Rijksvertegenwoordiger. De goedkeuring kan slechts worden
      onthouden wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel135
  - number: '136.1'
    text: |-
      De bevoegdheid tot regeling en bestuur inzake de huishouding van het openbaar lichaam wordt aan het eilandsbestuur
      overgelaten.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel136
  - number: '136.2'
    text: |-
      Regeling en bestuur kunnen van het eilandsbestuur worden gevorderd bij of krachtens een andere dan deze wet of de
      [Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba][ref1] ter verzekering van de uitvoering daarvan,
      met dien verstande dat het geven van aanwijzingen aan het eilandsbestuur en het aan het eilandsbestuur opleggen
      of in zijn plaats vaststellen van beslissingen, slechts kan geschieden indien de bevoegdheid daartoe bij de wet
      is toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0028151
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel136
    references:
      - id: ref1
        bwb_id: BWBR0028151
  - number: '136.3'
    text: |-
      Onverminderd de [artikelen 138, vijfde lid][ref1], en [213, vierde lid][ref2], worden de kosten, verbonden aan de
      uitvoering van het tweede lid, voor zover zij ten laste van de betrokken openbare lichamen blijven, door het Rijk
      aan hen vergoed.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel138
      [ref2]: https://wetten.overheid.nl/BWBR0028142#Artikel213
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel136
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '138'
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0028142
        artikel: '213'
        hoofdstuk: V
        afdeling: II
  - number: '137'
    text: Bij of krachtens de wet kan zo nodig onderscheid worden gemaakt tussen de openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel137
  - number: '138.1'
    text: 'In dit artikel wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel138
  - number: 138.1.a
    text: |-
      *plan:* een beslissing die een samenhangend geheel van op elkaar afgestemde keuzes bevat omtrent door het
      eilandsbestuur te nemen besluiten of te verrichten andere handelingen, ten einde een of meer doelstellingen te
      bereiken;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel138
  - number: 138.1.b
    text: |-
      *beleidsverslag:* een schriftelijke rapportage betreffende het door het eilandsbestuur gevoerde beleid op een of
      meer beleidsterreinen dan wel op onderdelen daarvan en de samenhang daarbinnen of daartussen.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel138
  - number: '138.2'
    text: |-
      Het vaststellen van een plan of een beleidsverslag en het ter voorbereiding daarvan volgen van een voorgeschreven
      procedure kan vanwege het Rijk van het eilandsbestuur slechts worden gevorderd in bij de wet te bepalen gevallen.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel138
  - number: '138.3'
    text: Een verplichting als bedoeld in het tweede lid geldt voor ten hoogste vier jaren, tenzij de wet anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel138
  - number: '138.4'
    text: |-
      Het vaststellen van een plan of een beleidsverslag en het ter voorbereiding daarvan volgen van een voorgeschreven
      procedure kan vanwege het Rijk in andere dan bij de wet bepaalde gevallen voor een termijn van ten hoogste vier jaar
      van het eilandsbestuur worden gevraagd als onderdeel van de regeling van een tijdelijke bijzondere uitkering als
      bedoeld in [artikel 92, derde lid, van de Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel92
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '92'
  - number: '138.5'
    text: |-
      Het vaststellen van een plan of een beleidsverslag en het ter voorbereiding daarvan volgen van de voorgeschreven
      procedure wordt van een eilandsbestuur niet gevorderd of gevraagd, dan nadat is aangegeven hoe de financiële
      gevolgen ervan voor het openbaar lichaam worden gecompenseerd.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel138
  - number: '138.6'
    text: |-
      Dit artikel is niet van toepassing op de begroting en op de jaarrekening
      en het jaarverslag, bedoeld in [artikel 17][ref1], onderscheidenlijk
      [artikel 28 van de Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0028151#Artikel28
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0028151
        artikel: '28'
  - number: '139.1'
    text: |-
      Het vaststellen van een plan of een beleidsverslag als bedoeld in [artikel 138][ref1] en het ter voorbereiding
      daarvan volgen van een voorgeschreven procedure wordt alleen gevorderd, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel138
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel139
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '138'
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: I
  - number: 139.1.a
    text: |-
      dit noodzakelijk is uit een oogpunt van afstemming tussen het beleid van het openbaar lichaam en het beleid van het
      Rijk, of
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel139
  - number: 139.1.b
    text: de ontwikkeling van beleid op een nieuw beleidsterrein dit noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel139
  - number: '139.2'
    text: |-
      Het vaststellen van een plan of een beleidsverslag als bedoeld in [artikel 138][ref1] en het ter voorbereiding
      daarvan volgen van een voorgeschreven procedure wordt niet gevorderd, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel138
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel139
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '138'
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: I
  - number: 139.2.a
    text: het eilandsbestuur daardoor ontoelaatbaar beperkt wordt in zijn inhoudelijke of financiële beleidsruimte;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel139
  - number: 139.2.b
    text: |-
      de bestuurslasten niet in redelijke verhouding staan tot de te verwachten baten of een aanzienlijk beslag leggen op
      de voor het betrokken beleidsterrein beschikbare middelen;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel139
  - number: 139.2.c
    text: |-
      integratie met een bestaand plan of een bestaand beleidsverslag dan wel met de begroting
      of de jaarrekening en het jaarverslag, bedoeld in [artikel 17][ref1], onderscheidenlijk
      [artikel 28 van de Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba][ref2] mogelijk is;


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0028151#Artikel28
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel139
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0028151
        artikel: '28'
  - number: 139.2.d
    text: |-
      het bevorderen van de samenhang in het beleid in de openbare lichamen door onderlinge afstemming van onderdelen
      daarvan onmogelijk wordt;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel139
  - number: 139.2.e
    text: het uitsluitend dient tot het verkrijgen van informatie.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel139
  - number: '139.3'
    text: |-
      Indien in een voorstel van wet tot invoering of wijziging van bepalingen waarbij het vaststellen van een
      plan of een beleidsverslag als bedoeld in [artikel 138][ref1] en het ter voorbereiding daarvan volgen van een
      voorgeschreven procedure wordt gevorderd, wordt afgeweken van het bepaalde bij of krachtens artikel 138 en dit
      artikel, wordt die afwijking gemotiveerd in de bij het voorstel behorende toelichting.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel138
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel139
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '138'
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: I
  - number: '140.1'
    text: Het eilandsbestuur is bevoegd tot oplegging van een last onder bestuursdwang.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel140
  - number: '140.2'
    text: |-
      De bevoegdheid tot oplegging van een last onder bestuursdwang wordt uitgeoefend door het bestuurscollege, indien de
      last dient tot handhaving van regels welke het eilandsbestuur uitvoert.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel140
  - number: '140.3'
    text: |-
      De bevoegdheid tot oplegging van een last onder bestuursdwang wordt uitgeoefend door de gezaghebber, indien de last
      dient tot handhaving van regels welke hij uitvoert.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel140
  - number: '140.4'
    text: |-
      De [artikelen 1:1, vierde lid][ref1], [4:116][ref2], [5:1 tot en met 5:10][ref3] en
      [titel 5.3 van de Algemene wet bestuursrecht][ref4] zijn van toepassing met dien verstande dat in
      [artikel 4:116][ref5] voor «het [Wetboek van Burgerlijke Rechtsvordering][ref6]» wordt gelezen: het
      [Wetboek van Burgerlijke Rechtsvordering BES][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref6]: https://wetten.overheid.nl/BWBR0001827
      [ref7]: https://wetten.overheid.nl/BWBR0028496
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel140
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0005537
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref6
        bwb_id: BWBR0001827
      - id: ref7
        bwb_id: BWBR0028496
  - number: '140.5'
    text: |-
      De [titels X][ref1] en [XI van het Wetboek van Strafvordering BES][ref2] zijn van overeenkomstige toepassing met
      dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0028681
      [ref2]: https://wetten.overheid.nl/BWBR0028681
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel140
    references:
      - id: ref1
        bwb_id: BWBR0028681
      - id: ref2
        bwb_id: BWBR0028681
  - number: 140.5.a
    text: |-
      de machtiging, bedoeld in [artikel 155 van het Wetboek van Strafvordering BES][ref1], wordt verleend door:


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel155
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel140
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '155'
  - number: 140.5.a.1°
    text: het bestuurscollege in de gevallen, bedoeld in het tweede lid;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel140
  - number: 140.5.a.2°
    text: de gezaghebber in de gevallen, bedoeld in het derde lid;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel140
  - number: 140.5.b
    text: |-
      het legitimatiebewijs, bedoeld in [artikel 162 van het Wetboek van Strafvordering BES][ref1], wordt uitgegeven door
      de gezaghebber;


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel162
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel140
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '162'
  - number: 140.5.c
    text: |-
      het schriftelijk verslag omtrent het binnentreden, bedoeld in
      [artikel 163 van het Wetboek van Strafvordering BES][ref1], wordt toegezonden aan:


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel163
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel140
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '163'
  - number: 140.5.c.1°
    text: het bestuurscollege in de gevallen, bedoeld in het tweede lid;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel140
  - number: 140.5.c.2°
    text: de gezaghebber in de gevallen, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel140
  - number: '141.1'
    text: |-
      In geval van toepassing van [artikel 231][ref1] kan de Rijksvertegenwoordiger een last onder bestuursdwang opleggen
      namens het eilandsbestuur en ten laste van het openbaar lichaam. [Artikel 140, vierde en vijfde lid][ref2], zijn
      alsdan van overeenkomstige toepassing met dien verstande dat de machtiging, bedoeld in het vijfde lid, onderdeel a,
      wordt verleend door de Rijksvertegenwoordiger, het legitimatiebewijs, bedoeld in het vijfde lid, onderdeel b, wordt
      uitgegeven door de Rijksvertegenwoordiger en dat het schriftelijk verslag, bedoeld in het vijfde lid, onderdeel c,
      wordt toegezonden aan de Rijksvertegenwoordiger.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel231
      [ref2]: https://wetten.overheid.nl/BWBR0028142#Artikel140
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel141
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '231'
        hoofdstuk: V
        paragraaf: '3'
        afdeling: III
      - id: ref2
        bwb_id: BWBR0028142
        artikel: '140'
        hoofdstuk: IV
        paragraaf: '2'
        afdeling: I
  - number: '141.2'
    text: |-
      Het openbaar lichaam heeft in dat geval voor het bedrag van de te zijnen laste gebrachte kosten verhaal op de
      overtreder.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel141
  - number: '141.3'
    text: |-
      De [artikelen 1:1, vierde lid][ref1], [4:116][ref2] en [5:10 van de Algemene wet bestuursrecht][ref3] zijn alsdan
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel141
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '142.1'
    text: |-
      Besluiten van het eilandsbestuur die algemeen verbindende voorschriften inhouden, verbinden niet dan wanneer zij
      zijn bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel142
  - number: '142.2'
    text: |-
      De bekendmaking geschiedt door plaatsing in het op een algemeen toegankelijke wijze uit te geven afkondigingsblad
      van het openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel142
  - number: '142.3'
    text: |-
      Het afkondigingsblad kan elektronisch worden uitgegeven. Na de uitgifte blijft het afkondigingsblad elektronisch
      op een algemeen toegankelijke wijze beschikbaar. Indien elektronische uitgifte geheel of gedeeltelijk onmogelijk
      is, voorziet het eilandsbestuur in een vervangende uitgave. Bij of krachtens algemene maatregel van bestuur worden
      omtrent het bepaalde in de eerste en tweede volzin nadere regels gesteld.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel142
  - number: '142.4'
    text: |-
      Bij de bekendmaking van een besluit dat aan goedkeuring is onderworpen, wordt de dagtekening vermeld van het
      besluit waarbij die goedkeuring is verleend of wordt de mededeling gedaan van de omstandigheid dat ingevolge
      [artikel 10:31, vierde lid, van de Algemene wet bestuursrecht][ref1] een besluit tot goedkeuring wordt geacht te
      zijn genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel142
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '10'
  - number: '143.1'
    text: |-
      De teksten van besluiten van het eilandsbestuur die algemeen verbindende voorschriften inhouden, zijn in
      geconsolideerde vorm voor een ieder beschikbaar door middel van een bij algemene maatregel van bestuur aangewezen
      algemeen toegankelijk elektronisch medium.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel143
  - number: '143.2'
    text: |-
      Een geconsolideerde tekst van een besluit die op grond van het eerste lid beschikbaar is gesteld, blijft
      beschikbaar indien het besluit na de beschikbaarstelling is gewijzigd of ingetrokken.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel143
  - number: '143.3'
    text: |-
      Onze Minister kan regels stellen over de wijze waarop de in het eerste lid bedoelde teksten beschikbaar worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel143
  - number: '143.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen categorieën van besluiten worden aangewezen, waarop het
      eerste lid niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel143
  - number: '144'
    text: |-
      Een ieder kan op verzoek een papieren afschrift verkrijgen van de besluiten van het eilandsbestuur die algemeen
      verbindende voorschriften inhouden. Het afschrift wordt verstrekt tegen ten hoogste de kosten van het maken van
      het afschrift.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel144
  - number: '145'
    text: |-
      De bekendgemaakte besluiten treden in werking met ingang van de achtste dag na die van de bekendmaking, tenzij in
      deze besluiten daarvoor een ander tijdstip is aangewezen.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel145
  - number: '146'
    text: |-
      Een besluit als bedoeld in [artikel 142][ref1] op overtreding waarvan straf is gesteld, wordt na de bekendmaking
      medegedeeld aan het parket in eerste aanleg.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel142
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel146
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '142'
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: I
  - number: '147'
    text: |-
      Met betrekking tot de intrekking van besluiten die algemeen verbindende voorschriften inhouden, zijn de
      [artikelen 142][ref1], [145][ref2] en [146][ref3] van overeenkomstige toepassing, met dien verstande dat de
      mededeling aan het parket in eerste aanleg geschiedt binnen een week.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel142
      [ref2]: https://wetten.overheid.nl/BWBR0028142#Artikel145
      [ref3]: https://wetten.overheid.nl/BWBR0028142#Artikel146
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel147
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '142'
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0028142
        artikel: '145'
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0028142
        artikel: '146'
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: I
  - number: '148'
    text: |-
      Op termijnen gesteld in een eilandsverordening zijn de [artikelen 1 tot en met 4 van de Algemene Termijnenwet][ref1]
      van overeenkomstige toepassing, tenzij in de eilandsverordening anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002448#Artikel1
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel148
    references:
      - id: ref1
        bwb_id: BWBR0002448
        artikel: '1'
  - number: '149.1'
    text: |-
      Eilandsverordeningen worden door de eilandsraad vastgesteld voor zover de bevoegdheid daartoe niet bij de wet of
      door de eilandsraad krachtens de wet aan het bestuurscollege of de gezaghebber is toegekend.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel149
  - number: '149.2'
    text: |-
      De overige bevoegdheden, bedoeld in [artikel 136, eerste lid][ref1], berusten bij de eilandsraad.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel136
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel149
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '136'
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: I
  - number: '149.3'
    text: |-
      De overige bevoegdheden, bedoeld in [artikel 136, tweede lid][ref1], berusten bij het bestuurscollege, voor zover
      deze niet bij of krachtens de wet aan de eilandsraad of de gezaghebber zijn toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel136
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel149
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '136'
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: I
  - number: '150.1'
    text: |-
      Een lid van de eilandsraad kan een voorstel voor een eilandsverordening of een ander voorstel ter behandeling in de
      eilandsraad indienen.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel150
  - number: '150.2'
    text: De eilandsraad regelt op welke wijze een voorstel voor een eilandsverordening wordt ingediend en behandeld.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel150
  - number: '150.3'
    text: De eilandsraad regelt op welke wijze en onder welke voorwaarden een ander voorstel wordt ingediend en behandeld.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel150
  - number: '151.1'
    text: |-
      Een lid van de eilandsraad kan een voorstel tot wijziging van een voor de vergadering van de eilandsraad
      geagendeerde ontwerp-eilandsverordening of ontwerp-beslissing indienen.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel151
  - number: '151.2'
    text: |-
      [Artikel 150, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel150
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel151
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '150'
        hoofdstuk: IV
        afdeling: II
  - number: '152'
    text: De eilandsraad maakt de eilandsverordeningen die hij in het belang van het openbaar lichaam nodig oordeelt.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel152
  - number: '153'
    text: |-
      Indien het toezicht op de naleving of de opsporing van een overtreding van een voorschrift van een
      eilandsverordening, dat strekt tot handhaving van de openbare orde of veiligheid of tot bescherming van het leven
      of de gezondheid van personen vereist dat de met het toezicht op de naleving of de opsporing belaste personen
      bevoegd zijn binnen te treden in een woning zonder toestemming van de bewoner, kan de eilandsraad deze bevoegdheid
      bij eilandsverordening verlenen.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel153
  - number: '154'
    text: |-
      De eilandsraad stelt een eilandsverordening vast waarin regels worden gesteld met betrekking tot de wijze waarop
      ingezetenen en belanghebbenden bij de voorbereiding van het beleid van het openbaar lichaam worden betrokken.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel154
  - number: '155.1'
    text: |-
      De eilandsraad kan bij eilandsverordening de gezaghebber de bevoegdheid verlenen om bij verstoring van de openbare
      orde door de aanwezigheid van wapens, dan wel bij ernstige vrees voor het ontstaan daarvan, een gebied, met
      inbegrip van de daarin gelegen voor het publiek openstaande gebouwen en daarbij behorende erven, aan te wijzen als
      veiligheidsrisicogebied. In een veiligheidsrisicogebied kan de officier van justitie de bevoegdheden, bedoeld in
      de [artikelen 50, derde lid][ref1], [51, derde lid][ref2], en [52, derde lid, van de Wet wapens en munitie][ref3]
      toepassen. Voor de vaststelling van de eilandsverordening bij stemming is de volstrekte meerderheid van het aantal
      zitting hebbende leden vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0008804#Artikel51
      [ref3]: https://wetten.overheid.nl/BWBR0008804#Artikel52
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel155
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '50'
      - id: ref2
        bwb_id: BWBR0008804
        artikel: '51'
      - id: ref3
        bwb_id: BWBR0008804
        artikel: '52'
  - number: '155.2'
    text: |-
      De gezaghebber gaat niet over tot aanwijzing als veiligheidsrisicogebied dan na overleg met de officier van
      justitie.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel155
  - number: '155.3'
    text: |-
      De aanwijzing als veiligheidsrisicogebied wordt gegeven voor een bepaalde duur die niet langer is en voor een
      gebied dat niet groter is dan strikt noodzakelijk voor de handhaving van de openbare orde.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel155
  - number: '155.4'
    text: |-
      De beslissing tot gebiedsaanwijzing wordt op schrift gesteld en bevat een omschrijving van het gebied waarop deze
      van toepassing is alsmede de geldigheidsduur. Indien de situatie dermate spoedeisend is dat de gezaghebber de
      beslissing tot gebiedsaanwijzing niet tevoren op schrift kan stellen, zorgt hij alsnog zo spoedig mogelijk voor de
      opschriftstelling en voor de bekendmaking daarvan.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel155
  - number: '155.5'
    text: |-
      De gezaghebber brengt de gebiedsaanwijzing zo spoedig mogelijk ter kennis van de eilandsraad en van de officier van
      justitie, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel155
  - number: '155.6'
    text: |-
      Zodra de verstoring van de openbare orde door de aanwezigheid van wapens, dan wel de ernstige vrees voor het
      ontstaan daarvan, bedoeld in het eerste lid, is geweken, trekt de gezaghebber de gebiedsaanwijzing in. Het vijfde
      lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel155
  - number: '156.1'
    text: |-
      De eilandsraad kan bij eilandsverordening de gezaghebber de bevoegdheid verlenen om, indien dat in het
      belang van de handhaving van de openbare orde noodzakelijk is, te besluiten tot plaatsing van vaste
      camera’s voor een bepaalde duur ten behoeve van het toezicht op een openbare plaats als bedoeld in
      [artikel 1 van de Wet openbare manifestaties][ref1] en andere bij eilandsverordening aan te wijzen plaatsen die
      voor een ieder toegankelijk zijn. De gezaghebber bepaalt de duur van de plaatsing en wijst de openbare plaats of
      plaatsen aan, met inachtneming van hetgeen daaromtrent in de eilandsverordening is bepaald. Voor de vaststelling
      van de eilandsverordening bij stemming is de volstrekte meerderheid van het aantal zitting hebbende leden vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0004318#Artikel1
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel156
    references:
      - id: ref1
        bwb_id: BWBR0004318
        artikel: '1'
  - number: '156.2'
    text: |-
      De gezaghebber stelt, na overleg met de officier van justitie, de periode vast waarin in het belang van de
      handhaving van de openbare orde daadwerkelijk gebruik van de camera’s plaatsvindt en de met de camera’s gemaakte
      beelden in elk geval rechtstreeks worden bekeken.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel156
  - number: '156.3'
    text: |-
      De gezaghebber bedient zich bij de uitvoering van het in het eerste lid bedoelde besluit van de onder zijn gezag
      staande politie.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel156
  - number: '156.4'
    text: |-
      De aanwezigheid van camera’s als bedoeld in het eerste lid is op duidelijke wijze kenbaar voor een ieder die de
      desbetreffende openbare plaats betreedt.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel156
  - number: '156.5'
    text: |-
      Met de camera’s worden uitsluitend beelden gemaakt van een openbare plaats als bedoeld in
      [artikel 1 van de Wet openbare manifestaties][ref1] en andere bij eilandsverordening aan te wijzen plaatsen die
      voor een ieder toegankelijk zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0004318#Artikel1
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel156
    references:
      - id: ref1
        bwb_id: BWBR0004318
        artikel: '1'
  - number: '156.6'
    text: De met de camera’s gemaakte beelden mogen in het belang van de handhaving van de openbare orde worden vastgelegd.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel156
  - number: '156.7'
    text: |-
      De verwerking van de gegevens, bedoeld in het zesde lid, is een verwerking als bedoeld in
      de [Wet politiegegevens][ref1], met dien verstande dat, in afwijking van het bepaalde in
      [artikel 8 van die wet][ref2], de vastgelegde beelden na ten hoogste vier weken worden vernietigd en de gegevens,
      bedoeld in het zesde lid, indien er concrete aanleiding bestaat te vermoeden dat die gegevens noodzakelijk zijn
      voor de opsporing van een strafbaar feit, ten behoeve van de opsporing van dat strafbare feit kunnen worden
      verwerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0022463
      [ref2]: https://wetten.overheid.nl/BWBR0004318#Artikel8
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel156
    references:
      - id: ref1
        bwb_id: BWBR0022463
      - id: ref2
        bwb_id: BWBR0004318
        artikel: '8'
  - number: '156.8'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen met het oog op de goede uitvoering van het toezicht, bedoeld
      in het eerste lid, regels worden gesteld omtrent:
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel156
  - number: 156.8.a
    text: |-
      de vaste camera’s en andere technische hulpmiddelen benodigd voor het toezicht, bedoeld in het eerste lid, en de
      wijze waarop deze hulpmiddelen worden aangebracht;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel156
  - number: 156.8.b
    text: de personen belast met of anderszins direct betrokken bij de uitvoering van het toezicht; en
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel156
  - number: 156.8.c
    text: de ruimten waarin de waarneming of verwerking van door het toezicht vastgelegde beelden plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel156
  - number: '157.1'
    text: |-
      De eilandsraad kan op overtreding van zijn eilandsverordeningen en van het bestuurscollege waaraan ingevolge
      [artikel 166][ref1] verordenende bevoegdheid is gedelegeerd, straf stellen maar geen andere of zwaardere dan
      hechtenis van ten hoogste drie maanden of geldboete van de tweede categorie, al dan niet met openbaarmaking van de
      rechterlijke uitspraak.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel166
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel157
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '166'
        hoofdstuk: IV
        afdeling: II
  - number: '157.2'
    text: |-
      Indien een krachtens het eerste lid strafbaar gestelde overtreding van voorschriften met betrekking
      tot het plaatsen of laten staan van motorrijtuigen op parkeerterreinen of weggedeelten, bedoeld in
      [artikel 56 van de Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba][ref1] wordt begaan door een
      bij de ontdekking van het feit onbekend gebleven bestuurder van een motorrijtuig, kunnen de op het feit gestelde
      straffen worden opgelegd aan de eigenaar of houder van dat motorrijtuig voor zover deze niet reeds naast de
      bestuurder voor dat feit aansprakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel56
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel157
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '56'
  - number: '157.3'
    text: 'Het tweede lid geldt niet, indien de eigenaar of houder:'
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel157
  - number: 157.3.a
    text: de naam en het volledige adres van de bestuurder bekend heeft gemaakt;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel157
  - number: 157.3.b
    text: niet heeft kunnen vaststellen wie de bestuurder was en hem daarvan redelijkerwijs geen verwijt kan worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel157
  - number: '157.4'
    text: De strafbare feiten, bedoeld in het eerste lid, zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel157
  - number: '158.1'
    text: |-
      De eilandsraad kan bij eilandsverordening de gezaghebber de bevoegdheid verlenen om door de gezaghebber aangewezen
      groepen van personen, op een door de gezaghebber aangegeven plaats tijdelijk te doen ophouden. De ophouding kan
      mede omvatten, indien nodig, het overbrengen naar die plaats. Voor de vaststelling van de eilandsverordening bij
      stemming is de volstrekte meerderheid van het aantal zitting hebbende leden vereist.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel158
  - number: '158.2'
    text: 'De gezaghebber oefent de bevoegdheid, bedoeld in het eerste lid, slechts uit:'
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel158
  - number: 158.2.a
    text: |-
      jegens personen die een door de raad bij eilandsverordening vastgesteld en daartoe aangewezen specifiek
      voorschrift dat strekt tot handhaving van de openbare orde of beperking van gevaar in omstandigheden als bedoeld in
      [artikel 178][ref1], groepsgewijs niet naleven, en


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel178
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel158
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '178'
        hoofdstuk: IV
        afdeling: IV
  - number: 158.2.b
    text: |-
      indien het ophouden noodzakelijk is ter voorkoming van voortzetting of herhaling van de niet-naleving en de
      naleving redelijkerwijs niet op andere geschikte wijze kan worden verzekerd.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel158
  - number: '158.3'
    text: |-
      De beslissing tot ophouding wordt op schrift gesteld. De schriftelijke beslissing is een beschikking. Indien de
      situatie dermate spoedeisend is dat de gezaghebber de beslissing tot ophouding niet tevoren op schrift kan stellen,
      zorgt hij alsnog zo spoedig mogelijk voor de opschriftstelling en voor de bekendmaking.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel158
  - number: '158.4'
    text: De beschikking vermeldt welk voorschrift niet wordt nageleefd.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel158
  - number: '158.5'
    text: |-
      De gezaghebber laat tot ophouding als bedoeld in het eerste lid niet overgaan dan nadat de personen uit de in het
      eerste lid bedoelde groep in de gelegenheid zijn gesteld de tenuitvoerlegging van de beschikking tot ophouding te
      voorkomen, door alsnog het voorschrift, bedoeld in het vierde lid, na te leven.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel158
  - number: '158.6'
    text: |-
      De gezaghebber draagt er zorg voor dat zo spoedig mogelijk een verslag van de bevindingen inzake de
      tenuitvoerlegging van de ophouding wordt opgesteld.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel158
  - number: '158.7'
    text: |-
      De ophouding mag niet langer duren dan de tijd die nodig is ter voorkoming van voortzetting of herhaling van de
      niet-naleving, met een maximum van twaalf uren.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel158
  - number: '158.8'
    text: |-
      De plaats van ophouding dient geschikt te zijn voor de opvang van de op te houden personen. Bij algemene maatregel
      van bestuur kunnen nadere regels hieromtrent worden gesteld.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel158
  - number: '158.9'
    text: |-
      De gezaghebber draagt er voor zover mogelijk zorg voor dat de opgehouden personen in de gelegenheid worden
      gesteld door een daartoe door hem aangewezen ambtenaar hun gegevens te laten vastleggen ten bewijze dat zij zijn
      opgehouden.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel158
  - number: '158.10'
    text: |-
      De [artikelen 54][ref1] en [55 van de Wet administratieve rechtspraak BES][ref2] zijn niet van toepassing op de
      beschikking tot ophouding.


      [ref1]: https://wetten.overheid.nl/BWBR0028455#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0028455#Artikel55
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel158
    references:
      - id: ref1
        bwb_id: BWBR0028455
        artikel: '54'
      - id: ref2
        bwb_id: BWBR0028455
        artikel: '55'
  - number: '158.11'
    text: |-
      Indien tegen de beschikking tot ophouding een verzoek om een voorlopige voorziening als bedoeld in
      [artikel 85 van de Wet administratieve rechtspraak BES][ref1] wordt gedaan:


      [ref1]: https://wetten.overheid.nl/BWBR0028455#Artikel85
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel158
    references:
      - id: ref1
        bwb_id: BWBR0028455
        artikel: '85'
  - number: 158.11.a
    text: |-
      wordt, in afwijking van [artikel 86 van de van de Wet administratieve rechtspraak BES][ref1], de verzoeker die is
      opgehouden zo mogelijk nog tijdens zijn ophouding door de voorzieningenrechter gehoord;


      [ref1]: https://wetten.overheid.nl/BWBR0028455#Artikel86
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel158
    references:
      - id: ref1
        bwb_id: BWBR0028455
        artikel: '86'
  - number: 158.11.b
    text: |-
      doet de voorzieningenrechter in afwijking van [artikel 86 van de Wet administratieve rechtspraak BES][ref1]
      onmiddellijk na het horen van partijen uitspraak, en


      [ref1]: https://wetten.overheid.nl/BWBR0028455#Artikel86
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel158
    references:
      - id: ref1
        bwb_id: BWBR0028455
        artikel: '86'
  - number: 158.11.c
    text: |-
      wordt, in afwijking van [artikel 17][ref1] en [artikel 81 van de Wet administratieve rechtspraak BES][ref2], geen
      griffierecht geheven.


      [ref1]: https://wetten.overheid.nl/BWBR0028455#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0028455#Artikel81
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel158
    references:
      - id: ref1
        bwb_id: BWBR0028455
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0028455
        artikel: '81'
  - number: '158.12'
    text: |-
      Bij de beoordeling van het verzoek betrekt de voorzieningenrechter tevens de rechtmatigheid van de
      tenuitvoerlegging van de beschikking tot ophouding jegens verzoeker.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel158
  - number: '158.13'
    text: |-
      Indien de voorzieningenrechter een of meer verzoeken toewijst op de grond dat de beschikking tot ophouding naar
      zijn voorlopig oordeel onrechtmatig is, kan hij bepalen dat alle personen die op basis van de betrokken beschikking
      zijn opgehouden, onverwijld in vrijheid worden gesteld.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel158
  - number: '158.14'
    text: |-
      Het twaalfde lid is van overeenkomstige toepassing op de beoordeling van een beroep tegen de beschikking tot
      ophouding als bedoeld in [artikel 7 van de Wet administratieve rechtspraak BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028455#Artikel7
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel158
    references:
      - id: ref1
        bwb_id: BWBR0028455
        artikel: '7'
  - number: '159.1'
    text: Een lid van de eilandsraad kan het bestuurscollege of de gezaghebber mondeling of schriftelijk vragen stellen.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel159
  - number: '159.2'
    text: |-
      Een lid van de eilandsraad kan de eilandsraad verlof vragen tot het houden van een interpellatie over een onderwerp
      dat niet staat vermeld op de agenda, bedoeld in [artikel 20, tweede lid][ref1], om het bestuurscollege of de
      gezaghebber hierover inlichtingen te vragen. De eilandsraad stelt hierover nadere regels.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel20
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel159
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '20'
        hoofdstuk: III
        afdeling: II
  - number: '160.1'
    text: |-
      De eilandsraad kan op voorstel van een of meer van zijn leden een onderzoek naar het door het bestuurscollege of de
      gezaghebber gevoerde bestuur instellen.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel160
  - number: '160.2'
    text: |-
      Het besluit tot het instellen van een onderzoek omvat een omschrijving van het onderwerp van onderzoek alsmede een
      toelichting. Deze omschrijving kan hangende het onderzoek door de eilandsraad worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel160
  - number: '160.3'
    text: |-
      Het onderzoek wordt uitgevoerd door een door de eilandsraad in te stellen onderzoekscommissie. De commissie heeft
      ten minste drie leden en bestaat uitsluitend uit leden van de eilandsraad.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel160
  - number: '160.4'
    text: |-
      De [artikelen 23][ref1], [117, derde lid][ref2], en [119, eerste lid][ref3], zijn van overeenkomstige toepassing op
      de onderzoekscommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0028142#Artikel117
      [ref3]: https://wetten.overheid.nl/BWBR0028142#Artikel119
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel160
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '23'
        hoofdstuk: III
        afdeling: II
      - id: ref2
        bwb_id: BWBR0028142
        artikel: '117'
        hoofdstuk: III
        afdeling: VII
      - id: ref3
        bwb_id: BWBR0028142
        artikel: '119'
        hoofdstuk: III
        afdeling: VII
  - number: '160.5'
    text: |-
      De onderzoekscommissie kan de bij deze wet verleende bevoegdheden uitsluitend uitoefenen, indien ten minste drie
      van haar leden aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel160
  - number: '160.6'
    text: |-
      De bevoegdheden en werkzaamheden van een onderzoekscommissie worden niet geschorst door het aftreden van de
      eilandsraad.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel160
  - number: '160.7'
    text: |-
      Op het besluit tot instelling van een onderzoek en tot instelling van een onderzoekscommissie, alsmede het besluit
      tot wijziging van de omschrijving van het onderwerp van een onderzoek zijn de [artikelen 142, tweede lid][ref1],
      [143][ref2] en [144][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel142
      [ref2]: https://wetten.overheid.nl/BWBR0028142#Artikel143
      [ref3]: https://wetten.overheid.nl/BWBR0028142#Artikel144
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel160
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '142'
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0028142
        artikel: '143'
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0028142
        artikel: '144'
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: I
  - number: '160.8'
    text: |-
      Alvorens de eilandsraad besluit tot een onderzoek, stelt hij bij eilandsverordening nadere regels met betrekking
      tot deze onderzoeken. In elk geval worden daarin regels opgenomen over de wijze waarop ambtelijke bijstand wordt
      verleend aan de commissie.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel160
  - number: '161.1'
    text: |-
      Leden en gewezen leden van de eilandsraad, de gezaghebber en gewezen gezaghebbers, eilandgedeputeerden en gewezen
      eilandgedeputeerden, leden en gewezen leden van de gezamenlijke rekenkamer, leden en gewezen leden van een door
      de eilandsraad, het bestuurscollege of de gezaghebber ingestelde commissie, ambtenaren en gewezen ambtenaren, door
      of vanwege het eilandsbestuur aangesteld of daaraan ondergeschikt, zijn verplicht te voldoen aan een vordering
      van de onderzoekscommissie tot het verschaffen van inzage in, het nemen van afschrift van of het anderszins
      laten kennisnemen van alle bescheiden waarover zij beschikken en waarvan naar het redelijk oordeel van de
      onderzoekscommissie inzage, afschrift of kennisneming anderszins voor het doen van een onderzoek als bedoeld in
      [artikel 160][ref1] nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel160
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel161
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '160'
        hoofdstuk: IV
        afdeling: II
  - number: '161.2'
    text: |-
      Indien een vordering als bedoeld in het eerste lid betrekking heeft op bescheiden die afkomstig zijn van een
      instelling van de Europese Unie of van het Rijk en kennisneming van die bescheiden door de onderzoekscommissie
      het belang van de Europese Unie of de Staat kan schaden, wordt niet dan met toestemming van Onze Minister aan de
      vordering voldaan.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel161
  - number: '161.3'
    text: |-
      Ambtenaren, door of vanwege het eilandsbestuur aangesteld of daaraan ondergeschikt, zijn gehouden om aan een
      onderzoek als bedoeld in [artikel 160][ref1] alle door de onderzoekscommissie gevorderde medewerking te verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel160
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel161
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '160'
        hoofdstuk: IV
        afdeling: II
  - number: '162.1'
    text: |-
      Personen als bedoeld in [artikel 161][ref1] zijn verplicht te voldoen aan een oproep van de onderzoekscommissie om
      als getuige of deskundige te worden gehoord.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel161
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel162
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '161'
        hoofdstuk: IV
        afdeling: II
  - number: '162.2'
    text: |-
      Een getuige of deskundige die door de onderzoekscommissie wordt gehoord, is niet tevens lid van de
      onderzoekscommissie.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel162
  - number: '162.3'
    text: De getuigen zijn verplicht getuigenis af te leggen.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel162
  - number: '162.4'
    text: De deskundigen zijn verplicht hun diensten onpartijdig en naar beste weten als zodanig te verlenen.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel162
  - number: '162.5'
    text: |-
      De onderzoekscommissie kan besluiten dat getuigen uitsluitend worden verhoord na het afleggen van een eed of
      belofte. Zij leggen dan in de vergadering van de onderzoekscommissie, in handen van de voorzitter, de eed of
      belofte af dat zij de gehele waarheid en niets dan de waarheid zullen zeggen.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel162
  - number: '162.6'
    text: |-
      De getuigen en deskundigen worden in een openbare zitting van de onderzoekscommissie gehoord. Plaats en tijd van de
      openbare zitting worden door de voorzitter tijdig ter openbare kennis gebracht.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel162
  - number: '162.7'
    text: |-
      De onderzoekscommissie kan om gewichtige redenen besluiten een verhoor of een gedeelte daarvan niet in het openbaar
      af te nemen. De leden en plaatsvervangende leden van de commissie bewaren geheimhouding over hetgeen hun tijdens
      een besloten zitting ter kennis komt.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel162
  - number: '162.8'
    text: |-
      Een getuige is gerechtigd zich tijdens het verhoor te laten bijstaan. Om gewichtige redenen kan de commissie
      besluiten, dat een getuige zonder bijstand wordt gehoord.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel162
  - number: '162.9'
    text: |-
      Verklaringen die zijn afgelegd voor de onderzoekscommissie kunnen, behalve in het geval van een strafrechtelijke
      procedure naar meineed, niet als bewijs in rechte gelden.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel162
  - number: '163.1'
    text: |-
      Getuigen en deskundigen worden schriftelijk opgeroepen. De brief, houdende de oproep, wordt aangetekend verzonden
      of tegen gedagtekend ontvangstbewijs uitgereikt.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel163
  - number: '163.2'
    text: |-
      De onderzoekscommissie kan bevelen dat getuigen en deskundigen die, hoewel opgeroepen in overeenstemming met
      het eerste lid, niet zijn verschenen, door de openbare macht voor hen worden gebracht om aan hun verplichting te
      voldoen. De onderzoekscommissie stelt de getuige of deskundige hiervan schriftelijk in kennis op de wijze, bedoeld
      in het eerste lid. In de beschikking wordt een termijn gesteld waarbinnen de belanghebbende de tenuitvoerlegging
      kan voorkomen door alsnog aan zijn verplichting te voldoen.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel163
  - number: '163.3'
    text: |-
      Op een beschikking als bedoeld in het
      [eerste en het tweede lid is artikel 55 van de Wet administratieve rechtspraak BES][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028455#Artikel55
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel163
    references:
      - id: ref1
        bwb_id: BWBR0028455
        artikel: '55'
  - number: '164.1'
    text: |-
      Niemand kan genoodzaakt worden aan de onderzoekscommissie geheimen te openbaren, voor zover daardoor onevenredige
      schade zou worden toegebracht aan het belang van de uitoefening van zijn beroep, dan wel aan het belang van zijn
      onderneming of de onderneming waarbij hij werkzaam is of is geweest.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel164
  - number: '164.2'
    text: |-
      Zij die uit hoofde van hun ambt, beroep of betrekking tot geheimhouding verplicht zijn, kunnen zich verschonen
      getuigenis af te leggen, doch uitsluitend met betrekking tot hetgeen waarvan de wetenschap aan hen als zodanig is
      toevertrouwd. Zij kunnen inzage, afschrift of kennisneming anderszins weigeren van bescheiden of gedeelten daarvan
      tot welke hun plicht tot geheimhouding zich uitstrekt.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel164
  - number: '164.3'
    text: |-
      De gezaghebber en gewezen gezaghebbers, eilandgedeputeerden en gewezen eilandgedeputeerden, leden en gewezen leden
      van een door het bestuurscollege of de gezaghebber ingestelde commissie, ambtenaren en gewezen ambtenaren, door
      of vanwege het bestuurscollege aangesteld of daaraan ondergeschikt, zijn niet verplicht aan [artikel 161][ref1] en
      [artikel 162][ref2] te voldoen, indien het verstrekken van de inlichtingen in strijd is met het openbaar belang.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel161
      [ref2]: https://wetten.overheid.nl/BWBR0028142#Artikel162
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel164
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '161'
        hoofdstuk: IV
        afdeling: II
      - id: ref2
        bwb_id: BWBR0028142
        artikel: '162'
        hoofdstuk: IV
        afdeling: II
  - number: '164.4'
    text: |-
      De onderzoekscommissie kan verlangen dat een beroep als bedoeld in het derde lid op strijd met het openbaar
      belang wordt bevestigd door het bestuurscollege, of, voor zover de inlichtingen betrekking hebben op het door de
      gezaghebber gevoerde bestuur, door de gezaghebber.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel164
  - number: '165'
    text: |-
      Het bestuurscollege neemt de door de eilandsraad geraamde kosten voor een onderzoek in een bepaald jaar op in de
      ontwerp-begroting.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel165
  - number: '166.1'
    text: |-
      De eilandsraad kan aan het bestuurscollege bevoegdheden overdragen, tenzij de aard van de bevoegdheid zich
      daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel166
  - number: '166.2'
    text: 'De eilandsraad kan in ieder geval niet overdragen de bevoegdheid tot:'
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel166
  - number: 166.2.a
    text: de instelling van de gezamenlijke rekenkamer;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel166
  - number: 166.2.b
    text: |-
      de instelling van een onderzoek, bedoeld in [artikel 160, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel160
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel166
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '160'
        hoofdstuk: IV
        afdeling: II
  - number: 166.2.c
    text: |-
      de vaststelling of wijziging van de begroting, bedoeld in
      [artikel 15 van de Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel15
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel166
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '15'
  - number: 166.2.d
    text: |-
      de vaststelling van de jaarrekening, bedoeld in
      [artikel 29 van de Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel29
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel166
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '29'
  - number: 166.2.e
    text: het stellen van straf op overtreding van eilandsverordeningen;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel166
  - number: 166.2.f
    text: |-
      de vaststelling van de eilandsverordeningen, bedoeld in [artikelen 34, eerste lid][ref1] en
      [38, eerste lid, van de Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0028151#Artikel38
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel166
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '34'
      - id: ref2
        bwb_id: BWBR0028151
        artikel: '38'
  - number: 166.2.g
    text: |-
      de aanwijzing van een of meer accountants, bedoeld in
      [artikel 38, derde lid, van de Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel38
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel166
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '38'
  - number: 166.2.h
    text: |-
      de heffing van andere belastingen dan de precariobelasting, bedoeld in
      [artikel 60 van de Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba][ref1], de rechten,
      genoemd in [artikel 62 van de Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba][ref2]
      en de rechten waarvan de heffing geschiedt krachtens andere wetten dan de
      [Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0028151#Artikel62
      [ref3]: https://wetten.overheid.nl/BWBR0028151
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel166
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '60'
      - id: ref2
        bwb_id: BWBR0028151
        artikel: '62'
      - id: ref3
        bwb_id: BWBR0028151
  - number: '166.3'
    text: |-
      De bevoegdheid tot het vaststellen van eilandsverordeningen, door strafbepaling of bestuursdwang te handhaven,
      kan de eilandsraad slechts overdragen voor zover het betreft de vaststelling van nadere regels met betrekking tot
      bepaalde door hem in zijn eilandsverordeningen aangewezen onderwerpen.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel166
  - number: '166.4'
    text: |-
      De [artikelen 142, tweede lid][ref1], [143][ref2] en [144][ref3] zijn van overeenkomstige toepassing op een besluit
      dat wordt genomen op grond van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel142
      [ref2]: https://wetten.overheid.nl/BWBR0028142#Artikel143
      [ref3]: https://wetten.overheid.nl/BWBR0028142#Artikel144
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel166
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '142'
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0028142
        artikel: '143'
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0028142
        artikel: '144'
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: I
  - number: '167.1'
    text: |-
      De voorschriften met betrekking tot de bevoegdheid van de eilandsraad, de uitoefening daarvan en het toezicht
      daarop zijn ten aanzien van de ingevolge [artikel 166][ref1] overgedragen bevoegdheden van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel166
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel167
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '166'
        hoofdstuk: IV
        afdeling: II
  - number: '167.2'
    text: Onder de in het eerste lid bedoelde voorschriften zijn niet begrepen die betreffende vergaderingen.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel167
  - number: '168.1'
    text: 'Het bestuurscollege is in ieder geval bevoegd:'
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel168
  - number: 168.1.a
    text: |-
      het dagelijks bestuur van het openbaar lichaam te voeren, voor zover niet bij of krachtens de wet de eilandsraad of
      de gezaghebber hiermee is belast;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel168
  - number: 168.1.b
    text: |-
      beslissingen van de eilandsraad voor te bereiden en uit te voeren, tenzij bij of krachtens de wet de gezaghebber
      hiermee is belast;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel168
  - number: 168.1.c
    text: |-
      regels vast te stellen over de ambtelijke organisatie van het openbaar lichaam, met uitzondering van de organisatie
      van de griffie;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel168
  - number: 168.1.d
    text: |-
      ambtenaren, niet zijnde de eilandgriffier en de op de griffie werkzame ambtenaren, te benoemen, te bevorderen, te
      schorsen en te ontslaan;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel168
  - number: 168.1.e
    text: tot privaatrechtelijke rechtshandelingen van het openbaar lichaam te besluiten;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel168
  - number: 168.1.f
    text: |-
      te besluiten namens het openbaar lichaam, het bestuurscollege of de eilandsraad rechtsgedingen, bezwaarprocedures
      of administratief beroepsprocedures te voeren of handelingen ter voorbereiding daarop te verrichten, tenzij de
      eilandsraad, voor zover het de eilandsraad aangaat, in voorkomende gevallen anders beslist;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel168
  - number: 168.1.g
    text: ten aanzien van de voorbereiding van de civiele verdediging;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel168
  - number: 168.1.h
    text: jaarmarkten of gewone marktdagen in te stellen, af te schaffen of te veranderen.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel168
  - number: '168.2'
    text: |-
      Besluiten als bedoeld in het eerste lid, onderdeel d, worden genomen op grond van door het bestuurscollege
      vastgestelde regels inzake de benoeming, bevordering, schorsing en ontslag van ambtenaren. Deze regels bevatten in
      ieder geval de gronden voor deze besluiten.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel168
  - number: '168.3'
    text: |-
      Besluiten als bedoeld in het eerste lid, onderdeel d, behoeven de goedkeuring van de Rijksvertegenwoordiger. De
      goedkeuring kan slechts worden onthouden wegens strijd met het recht of op een grond, die is neergelegd in de
      regels, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel168
  - number: '168.4'
    text: |-
      Het bestuurscollege neemt, ook alvorens is besloten tot het voeren van een rechtsgeding, alle conservatoire
      maatregelen en doet wat nodig is ter voorkoming van verjaring of verlies van recht of bezit.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel168
  - number: '169'
    text: |-
      Het bestuurscollege kan een in het openbaar lichaam dienstdoende ambtenaar van politie machtigen in zijn naam
      besluiten te nemen of andere handelingen te verrichten.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel169
  - number: '170.1'
    text: |-
      Het bestuurscollege kan een of meer leden van het bestuurscollege machtigen tot uitoefening van een of meer van
      zijn bevoegdheden, tenzij de regeling waarop de bevoegdheid steunt zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel170
  - number: '170.2'
    text: |-
      Een krachtens machtiging uitgeoefende bevoegdheid wordt uit naam en onder verantwoordelijkheid van het
      bestuurscollege uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel170
  - number: '170.3'
    text: Het bestuurscollege kan te dien aanzien alle aanwijzingen geven die het nodig acht.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel170
  - number: '171.1'
    text: |-
      Het bestuurscollege en elk van zijn leden afzonderlijk zijn aan de eilandsraad verantwoording schuldig over het
      door het bestuurscollege gevoerde bestuur.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel171
  - number: '171.2'
    text: Zij geven de eilandsraad alle inlichtingen die de eilandsraad voor de uitoefening van zijn taak nodig heeft.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel171
  - number: '171.3'
    text: |-
      Zij geven de eilandsraad mondeling of schriftelijk de door een of meer leden gevraagde inlichtingen, tenzij het
      verstrekken ervan in strijd is met het openbaar belang.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel171
  - number: '171.4'
    text: |-
      Zij geven de eilandsraad vooraf inlichtingen over de uitoefening van de bevoegdheden, bedoeld in
      [artikel 168, eerste lid, onderdeel e, f, g en h][ref1], indien de eilandsraad daarom verzoekt of indien
      de uitoefening ingrijpende gevolgen kan hebben voor het openbaar lichaam. In het laatste geval neemt het
      bestuurscollege geen besluit dan nadat de eilandsraad in de gelegenheid is gesteld zijn wensen en bedenkingen ter
      kennis van het bestuurscollege te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel168
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel171
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '168'
        hoofdstuk: IV
        afdeling: III
  - number: '171.5'
    text: |-
      Indien de uitoefening van de bevoegdheid, bedoeld in [artikel 168, eerste lid, onderdeel f][ref1], geen uitstel
      kan lijden, geven zij in afwijking van het vierde lid de eilandsraad zo spoedig mogelijk inlichtingen over de
      uitoefening van deze bevoegdheid en het terzake genomen besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel168
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel171
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '168'
        hoofdstuk: IV
        afdeling: III
  - number: '172.1'
    text: 'De gezaghebber ziet toe op:'
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel172
  - number: 172.1.a
    text: |-
      een tijdige voorbereiding, vaststelling en uitvoering van het beleid van het openbaar lichaam en van de daaruit
      voortvloeiende besluiten, alsmede op een goede afstemming tussen degenen die bij die voorbereiding, vaststelling en
      uitvoering zijn betrokken;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel172
  - number: 172.1.b
    text: een goede samenwerking van het openbaar lichaam met de andere openbare lichamen en andere overheden;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel172
  - number: 172.1.c
    text: de kwaliteit van procedures op het vlak van burgerparticipatie;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel172
  - number: 172.1.d
    text: een zorgvuldige behandeling van bezwaarschriften;
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel172
  - number: 172.1.e
    text: een zorgvuldige behandeling van klachten door het eilandsbestuur.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel172
  - number: '172.2'
    text: De gezaghebber bevordert overigens een goede behartiging van de aangelegenheden van het openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel172
  - number: '173.1'
    text: De gezaghebber vertegenwoordigt het openbaar lichaam in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel173
  - number: '173.2'
    text: De gezaghebber kan de vertegenwoordiging opdragen aan een door hem aan te wijzen persoon.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel173
  - number: '174.1'
    text: De gezaghebber is belast met de handhaving van de openbare orde.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel174
  - number: '174.2'
    text: |-
      De gezaghebber is bevoegd overtredingen van wettelijke voorschriften die betrekking hebben op de openbare orde, te
      beletten of te beëindigen. Hij bedient zich daarbij van de onder zijn gezag staande politie.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel174
  - number: '174.3'
    text: |-
      De gezaghebber is bevoegd bij verstoring van de openbare orde of bij ernstige vrees voor het ontstaan daarvan, de
      bevelen te geven die noodzakelijk te achten zijn voor de handhaving van de openbare orde.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel174
  - number: '175.1'
    text: |-
      De gezaghebber heeft het opperbevel bij brand alsmede bij ongevallen anders dan bij brand voor zover de brandweer
      daarbij een taak heeft.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel175
  - number: '175.2'
    text: |-
      De gezaghebber is bevoegd bij brand en ongevallen, bedoeld in het eerste lid, de bevelen te geven die met het oog
      op het voorkomen, beperken en bestrijden van gevaar nodig zijn.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel175
  - number: '176.1'
    text: |-
      De gezaghebber is belast met het toezicht op de openbare samenkomsten en vermakelijkheden alsmede op de voor het
      publiek openstaande gebouwen en daarbij behorende erven.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel176
  - number: '176.2'
    text: |-
      De gezaghebber is bevoegd bij de uitoefening van het toezicht, bedoeld in het eerste lid, de bevelen te geven die
      met het oog op de bescherming van veiligheid en gezondheid nodig zijn.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel176
  - number: '176.3'
    text: |-
      De gezaghebber is belast met de uitvoering van eilandsverordeningen voor zover deze betrekking hebben op het
      toezicht, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel176
  - number: '177.1'
    text: |-
      De gezaghebber kan besluiten een woning, een niet voor het publiek toegankelijk lokaal of een bij die woning of dat
      lokaal behorend erf te sluiten, indien door gedragingen in de woning of het lokaal of op het erf de openbare orde
      rond de woning, het lokaal of het erf wordt verstoord.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel177
  - number: '177.2'
    text: |-
      De bevoegdheid, genoemd in het eerste lid, komt de gezaghebber eveneens toe in geval van ernstige vrees voor
      verstoring van de openbare orde op de grond dat de rechthebbende op de woning, het lokaal of het erf eerder een
      woning, een niet voor het publiek toegankelijk lokaal of een bij die woning of dat lokaal behorend erf op een
      zodanige wijze heeft gebruikt of doen gebruiken dat die woning, dat lokaal of dat erf op grond van het eerste
      lid is gesloten, en er aanwijzingen zijn dat betrokkene de woning, het lokaal of het erf ten aanzien waarvan hij
      rechthebbende is eveneens op een zodanige wijze zal gebruiken of doen gebruiken.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel177
  - number: '177.3'
    text: |-
      De gezaghebber bepaalt in het besluit de duur van de sluiting. In geval van ernstige vrees voor herhaling van de
      verstoring van de openbare orde kan hij besluiten de duur van de sluiting tot een door hem te bepalen tijdstip
      te verlengen.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel177
  - number: '177.4'
    text: |-
      Bij de bekendmaking van het besluit worden belanghebbenden in de gelegenheid gesteld binnen een te stellen termijn
      maatregelen te treffen waardoor de verstoring van de openbare orde wordt beëindigd. De eerste volzin is niet van
      toepassing, indien voorafgaande bekendmaking in spoedeisende gevallen niet mogelijk is.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel177
  - number: '177.5'
    text: |-
      De [artikelen 1:1, vierde lid][ref1], [4:116][ref2], [5:10][ref3] en
      [5:25 tot en met 5:28 van de Algemene wet bestuursrecht][ref4] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel177
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '178.1'
    text: |-
      In geval van oproerige beweging, van andere ernstige wanordelijkheden of van rampen of zware ongevallen, dan
      wel van ernstige vrees voor het ontstaan daarvan, is de gezaghebber bevoegd alle bevelen te geven die hij
      ter handhaving van de openbare orde of ter beperking van gevaar nodig acht. Daarbij kan van andere dan bij de
      [Grondwet][ref1] gestelde voorschriften worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel178
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: '178.2'
    text: De gezaghebber laat tot maatregelen van geweld niet overgaan dan na het doen van de nodige waarschuwing.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel178
  - number: '179.1'
    text: |-
      Wanneer een omstandigheid als bedoeld in [artikel 178, eerste lid][ref1] zich voordoet, kan de gezaghebber
      algemeen verbindende voorschriften geven die ter handhaving van de openbare orde of ter beperking van gevaar nodig
      zijn. Daarbij kan van andere dan bij de [Grondwet][ref2] gestelde voorschriften worden afgeweken. Hij maakt deze
      voorschriften bekend op een door hem te bepalen wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel178
      [ref2]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel179
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '178'
        hoofdstuk: IV
        afdeling: IV
      - id: ref2
        bwb_id: BWBR0001840
  - number: '179.2'
    text: |-
      De gezaghebber brengt de voorschriften zo spoedig mogelijk ter kennis van de eilandsraad, van de
      Rijksvertegenwoordiger en van de officier van justitie, hoofd van het parket in eerste aanleg.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel179
  - number: '179.3'
    text: |-
      De voorschriften vervallen, indien zij niet door de eilandsraad in zijn eerstvolgende vergadering die blijkens de
      presentielijst door meer dan de helft van het aantal zitting hebbende leden is bezocht, worden bekrachtigd.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel179
  - number: '179.4'
    text: |-
      Indien de eilandsraad de voorschriften niet bekrachtigt, kan de gezaghebber binnen vierentwintig uren
      administratief beroep instellen bij de Rijksvertegenwoordiger. Deze beslist binnen twee dagen. Gedurende de
      beroepstermijn en de behandeling van het administratief beroep blijven de voorschriften van kracht.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel179
  - number: '179.5'
    text: |-
      De Rijksvertegenwoordiger kan de werking van de voorschriften opschorten zolang zij niet bekrachtigd zijn. Het
      opschorten stuit onmiddellijk de werking van de voorschriften.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel179
  - number: '179.6'
    text: |-
      Zodra een omstandigheid als bedoeld in [artikel 178, eerste lid][ref1], zich niet langer voordoet, trekt de
      gezaghebber de voorschriften in. Het tweede lid is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel178
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel179
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '178'
        hoofdstuk: IV
        afdeling: IV
  - number: '180.1'
    text: |-
      De gezaghebber is bevoegd door hem aangewezen groepen van personen op een door hem aangegeven plaats tijdelijk te
      doen ophouden. De ophouding kan mede omvatten, indien nodig, het overbrengen naar die plaats.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel180
  - number: '180.2'
    text: 'De gezaghebber oefent de bevoegdheid, bedoeld in het eerste lid, slechts uit:'
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel180
  - number: 180.2.a
    text: |-
      jegens personen die door hem daartoe aangewezen specifieke onderdelen van een bevel als bedoeld in
      [artikel 178][ref1] of van een algemeen verbindend voorschrift als bedoeld in [artikel 179][ref2], groepsgewijs
      niet naleven, en


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel178
      [ref2]: https://wetten.overheid.nl/BWBR0028142#Artikel179
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel180
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '178'
        hoofdstuk: IV
        afdeling: IV
      - id: ref2
        bwb_id: BWBR0028142
        artikel: '179'
        hoofdstuk: IV
        afdeling: IV
  - number: 180.2.b
    text: |-
      indien het ophouden noodzakelijk is ter voorkoming van voortzetting of herhaling van de niet-naleving en de
      naleving redelijkerwijs niet op andere geschikte wijze kan worden verzekerd.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel180
  - number: '180.3'
    text: |-
      [Artikel 158, derde tot en met veertiende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel158
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel180
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '158'
        hoofdstuk: IV
        afdeling: II
  - number: '181.1'
    text: |-
      De gezaghebber kan een in het openbaar lichaam dienstdoende ambtenaar van politie machtigen in zijn naam besluiten
      te nemen of andere handelingen te verrichten.
    url: https://wetten.overheid.nl/BWBR0028142/2011-12-07#Artikel181
  - number: '181.2'
    text: |-
      Geen machtiging wordt verleend tot het nemen van besluiten ingevolge de [artikelen 155][ref1], [158][ref2],
      [174][ref3], [175][ref4], [176, tweede lid][ref5], [177][ref6], [178][ref7], [179][ref8] en [180][ref9] en tot
      uitvoering van beslissingen van de eilandsraad.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel155
      [ref2]: https://wetten.overheid.nl/BWBR0028142#Artikel158
