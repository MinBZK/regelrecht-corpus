      - id: ref1
        bwb_id: BWBR0007807
        artikel: '40'
        hoofdstuk: IV
        paragraaf: '7'
  - number: '40'
    text: |-
      Een instellingssubsidie aan een landelijke sportorganisatie of een bijzondere landelijke sportorganisatie
      voor de uitvoering van een door de minister erkende sportopleiding, een sportbijscholing of een experimentele
      sportopleiding bestaat uit een bedrag dat ontstaat door vermenigvuldiging van het aantal gerealiseerde
      onderwijscontact-uren, tot een door de minister vastgesteld maximum, met een door de minister vast te stellen
      normbedrag.
    url: https://wetten.overheid.nl/BWBR0007807/2006-04-29#Artikel40
  - number: '41'
    text: |-
      Een instellingssubsidie aan een landelijke sportorganisatie of een bijzondere landelijke sportorganisatie voor
      sportmedisch beleid wordt slechts verleend, indien:

      a. medische handelingen, medische onderzoeken en individuele sportmedische adviseringen geschieden door een
      sportarts of een sportarts in opleiding;

      b. medische handelingen en medische onderzoeken geschieden met gebruikmaking van medische uitrusting van gangbare
      kwaliteit in een daartoe adequaat ingerichte ruimte.
    url: https://wetten.overheid.nl/BWBR0007807/2006-04-29#Artikel41
  - number: '42'
    text: |-
      1 Een projectsubsidie voor de realisering van een A-accommodatie bedraagt ten hoogste 25% van de met de
      gesubsidieerde activiteiten samenhangende werkelijke kosten, voor zover opgenomen in de door de minister
      goedgekeurde begroting, en niet meer dan € 5.000.000.

      2 Een projectsubsidie voor de realisering van een B-accommodatie bedraagt ten hoogste 25% van de met de
      gesubsidieerde activiteiten samenhangende werkelijke kosten, voor zover opgenomen in de door de minister
      goedgekeurde begroting, en niet meer dan € 1.000.000.

      3 Een subsidie als bedoeld in het eerste en het tweede lid wordt slechts verleend indien:

      a. de accommodatie is opgenomen in het topsportbeleidsplan van de landelijke sportorganisatie die gebaat is bij
      de accommodatie;

      b. inzicht wordt gegeven in de manier waarop de accommodatie wordt geëxploiteerd en in de activiteiten en
      evenementen die plaats kunnen vinden in de accommodatie;

      c. er een sluitende meerjarenbegroting voor de exploitatie is.

      4 Onder kosten van realisering van een A-accommodatie of een B-accommodatie worden verstaan de kosten van de
      sporttechnische en -functionele voorzieningen die noodzakelijk zijn om een sportaccommodatie als A-accommodatie,
      onderscheidenlijk B-accommodatie, te kunnen aanmerken.
    url: https://wetten.overheid.nl/BWBR0007807/2006-04-29#Artikel42
  - number: '43'
    text: |-
      1 Een projectsubsidie voor de realisering van een of meer evenementaccommodaties bedraagt per evenement ten hoogste
      50% van de met de gesubsidieerde activiteiten samenhangende werkelijke kosten, voor zover opgenomen in de door de
      minister goedgekeurde begroting, en niet meer dan € 1.500.000.

      2 Onder kosten van realisering van evenementaccommodaties worden verstaan de kosten van aanpassing van
      accommodaties aan de sporttechnische en -functionele eisen die de internationale sportorganisatie stelt aan
      evenementaccommodaties.
    url: https://wetten.overheid.nl/BWBR0007807/2006-04-29#Artikel43
  - number: 43a
    text: |-
      1 Een projectsubsidie voor een topsportevenement bedraagt ten hoogste 25% van de met de gesubsidieerde activiteiten
      samenhangende werkelijke kosten, voor zover opgenomen in de door de minister goedgekeurde begroting, van de
      voorbereiding en de organisatie en niet meer dan € 500.000.

      2 Onder kosten van voorbereiding worden verstaan:

      a. de kosten van het onderzoek naar de haalbaarheid van het verkrijgen en van het organiseren van het
      topsportevenement tot ten hoogste de helft van de werkelijke kosten en niet meer dan € 20.000;

      b. de kosten van het verkrijgen van het topsportevenement tot ten hoogste de helft van de werkelijke kosten en niet
      meer dan € 30.000;

      3 Indien een ander dan een landelijke sportorganisatie subsidie als bedoeld in het eerste lid ontvangt, houdt deze
      zich aan de World Anti Doping Code.
    url: https://wetten.overheid.nl/BWBR0007807/2006-04-29#Artikel43a
  - number: 43b
    text: |-
      1 Een subsidie als bedoeld in de [artikelen 42][ref1], [43][ref2] en [43a][ref3] kan worden verleend voor een
      periode van ten hoogste vier opeenvolgende kalenderjaren aansluitend op het jaar waarin de aanvraag is ingediend.

      2 Een aanvraag voor subsidie als bedoeld in de [artikelen 42][ref4], [43][ref5] en [43a][ref6], wordt ingediend
      voor 1 oktober van het jaar voorafgaand aan het jaar waarin de subsidiabele activiteit aanvangt.


