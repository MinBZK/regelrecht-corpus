      - id: ref1
        bwb_id: BWBR0007807
        artikel: '19'
        hoofdstuk: IV
        paragraaf: '2'
  - number: 20a
    text: |-
      De instelling die subsidie ontvangt op grond van [artikel 19][ref1] overlegt met de minister jaarlijks:

      a. in het tweede kwartaal naar aanleiding van de aanvraag tot vaststelling van de subsidie over de resultaten
      van het voorafgaande jaar mede met het oog op de opstelling door de instelling van het activiteitenplan voor het
      komende jaar en

      b. in het vierde kwartaal over het activiteitenplan voor het volgende jaar mede in het licht van de voortgang van
      de activiteiten in het lopende jaar en de resultaten van het onder a bedoelde overleg.


      [ref1]: https://wetten.overheid.nl/BWBR0007807#Artikel19
