    url: https://wetten.overheid.nl/BWBR0007807/2006-04-29#Artikel2c
  - number: '3'
    text: |-
      1 Een jaarlijkse instellingssubsidie of een meerjarige instellingssubsidie bestaat uit een bedrag voor
      overeenkomstig een door de minister goedgekeurd activiteitenplan, onderscheidenlijk beleidsplan, uitgevoerde
      activiteiten.

      2 Het eerste lid is niet van toepassing op de subsidies, bedoeld in de [artikelen 16][ref1], [19][ref2],
      [28][ref3], [40][ref4] en [44b][ref5].


