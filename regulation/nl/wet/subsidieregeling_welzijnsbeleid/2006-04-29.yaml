  - number: '18'
    text: |-
      In deze paragraaf wordt verstaan onder:



            a
             vorming, training en advies:

              het geheel van programma’s gericht op het toerusten van deelnemers inzake hun functioneren als vrijwilliger
      ten behoeve van het voorkomen van sociaal isolement van personen in een kwetsbare positie of ter bevordering van
      maatschappelijke participatie van zodanige personen;



            b
             deelnemer:

              een vrijwilliger of aspirant-vrijwilliger, die deelneemt aan een programma;



            c
             programma:

              een samenstel van leeractiviteiten op het terrein van vorming, training en advies;



            d
             geslaagde deelnemer:

              een deelnemer die volledig heeft deelgenomen aan een programma en schriftelijk te kennen heeft gegeven dat
      de vooraf gestelde leerdoelen zijn gerealiseerd;



            e
             normbedrag:

              een jaarlijks door de minister vast te stellen bedrag.
    url: https://wetten.overheid.nl/BWBR0007807/2006-04-29#Artikel18
  - number: '19'
    text: |-
      1 Een instellingssubsidie voor vorming, training en advies bestaat uit een bedrag dat ontstaat door
      vermenigvuldiging van het aantal geslaagde deelnemers, tot het door de minister verleende maximale aantal, met
      het normbedrag.

      2 Een subsidie als bedoeld in het eerste lid wordt slechts verstrekt voorzover een programma past binnen de door
      de minister jaarlijks uiterlijk voor 1 september voorafgaand aan het desbetreffende subsidiejaar bekend te maken
      beleidsprioriteiten.
    url: https://wetten.overheid.nl/BWBR0007807/2006-04-29#Artikel19
  - number: '20'
    text: |-
      Een instelling die subsidie ontvangt op grond van [artikel 19][ref1]:

      a. realiseert programma’s voor groepen met op jaarbasis een groepsgrootte van gemiddeld 14 geslaagde deelnemers en
      een duur van gemiddeld vijf dagdelen;

      b. stelt de minister per kwartaal schriftelijk op de hoogte van de stand van zaken en ontwikkelingen overeenkomstig
      het in bijlage 10 bij deze regeling opgenomen model en

      c. draagt zorg voor een registratiesysteem per deelnemer dat voldoende inzicht biedt in de mate waarin voldaan
      wordt aan deze paragraaf.


      [ref1]: https://wetten.overheid.nl/BWBR0007807#Artikel19
    url: https://wetten.overheid.nl/BWBR0007807/2006-04-29#Artikel20
