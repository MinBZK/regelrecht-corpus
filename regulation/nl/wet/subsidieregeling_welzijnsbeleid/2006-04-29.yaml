  - number: '44'
    text: |-
      Een projectsubsidie voor een project op het terrein van sportmedisch beleid wordt slechts verstrekt, indien:

      a. medische handelingen, medische onderzoeken en individuele sportmedische adviseringen geschieden door een
      sportarts of een sportarts in opleiding, en

      b. medische handelingen en medische onderzoeken geschieden met gebruikmaking van medische uitrusting van gangbare
      kwaliteit in een daartoe adequaat ingerichte ruimte.
    url: https://wetten.overheid.nl/BWBR0007807/2006-04-29#Artikel44
  - number: 44a
    text: |-
      In deze paragraaf wordt verstaan onder:



            a
             oorlogsgetroffene:

              een persoon die tot één van de wetten voor oorlogsgetroffenen is toegelaten, dan wel op grond van één van
      die wetten een aanvraag heeft ingediend welke nog in behandeling is;



            b
             maatschappelijk werk aan oorlogsgetroffenen:

              het bieden van informatie, psycho-sociale hulpverlening, alsmede signalering en preventie aan
      oorlogsgetroffenen;



            c
             jeugdvoorlichting WOII-heden:

              voorlichting aan en educatie van scholieren en buitenschoolse jongeren over de geschiedenis van de Tweede
      Wereldoorlog waarin een verband wordt gelegd met hedendaagse ontwikkelingen inzake racisme, discriminatie en
      intolerantie.
    url: https://wetten.overheid.nl/BWBR0007807/2006-04-29#Artikel44a
  - number: 44b
    text: |-
      De subsidie aan een instelling voor maatschappelijk werk ten behoeve van maatschappelijk werk aan
      oorlogsgetroffenen bestaat uit een bedrag dat ontstaat door vermenigvuldiging van het aantal door de minister
      subsidiabel gestelde formatieplaatsen met een door de minister vast te stellen normbedrag.
    url: https://wetten.overheid.nl/BWBR0007807/2006-04-29#Artikel44b
  - number: '45'
    text: |-
      De ministers kan, gelet op het belang dat dit besluit beoogt te beschermen, artikelen buiten toepassing laten of
      daarvan afwijken, voor zover strikte toepassing leidt tot een onbillijkheid van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0007807/2006-04-29#Artikel45
  - number: '46'
    text: |-
      De Regeling subsidiëring welzijnsbeleid 1995 wordt ingetrokken, met dien verstande dat die regeling van toepassing
      blijft ten aanzien van de op grond van die regeling verleende subsidies.
    url: https://wetten.overheid.nl/BWBR0007807/2006-04-29#Artikel46
  - number: '47'
    text: |-
