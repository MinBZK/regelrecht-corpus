  - number: '4'
    text: |-
      Een aanvraag van een meerjarige instellingssubsidie wordt ingediend uiterlijk dertien weken voor de aanvang van het
      eerste kalenderjaar van de periode waarvoor subsidie wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0007807/2006-04-29#Artikel4
  - number: '5'
    text: |-
      1 De minister verstrekt de volgende voorschotten op een verleende instellingssubsidie: in januari 8%, februari 8%,
      maart 8%, april 7%, mei 16%, juni 7%, juli 8%, augustus 8%, september 7%, oktober 8%, november 8% en december 7%
      van van het voor het desbetreffende jaar verleende subsidiebedrag.

      2 Indien de minister voorschotten verstrekt voordat hij de beschikking tot een subsidieverlening heeft gegeven,
      worden de percentages, bedoeld in het eerste lid, tot de datum van subsidieverlening, toegepast op het voor het
      voorafgaande jaar verleende bedrag, in voorkomende gevallen bijgesteld overeenkomstig door de minister gegeven
      beschikkingen. Zodra de beschikking tot subsidieverlening voor het lopende jaar is gegeven, wordt het bedrag dat,
      gezien het in die beschikking verleende bedrag, te veel of te weinig is bevoorschot, zo spoedig mogelijk verrekend
      of door de subsidie-aanvrager terugbetaald, onderscheidenlijk door de minister betaald.
    url: https://wetten.overheid.nl/BWBR0007807/2006-04-29#Artikel5
  - number: '6'
    text: |-
      1 In het activiteitenplan of beleidsplan, behorende bij een aanvraag van een instellingssubsidie, komen ten minste
      de in bijlage 1 bij deze regeling genoemde onderwerpen aan de orde.

      Indien door een instelling gelijktijdig zowel een jaarlijkse als een meerjarige instellingssubsidie wordt gevraagd,
      wordt in het activiteitenplan en in het beleidsplan een duidelijke scheiding gemaakt tussen de activiteiten die op
      grond van de te onderscheiden subsidies worden bekostigd.

      2 In de begroting, behorende bij de aanvraag van een instellingssubsidie, wordt per activiteit aangegeven welke
      baten en lasten daaraan direct en indirect zijn verbonden.
    url: https://wetten.overheid.nl/BWBR0007807/2006-04-29#Artikel6
  - number: '7'
    text: |-
      1 Voorzover het bedrag van de verleende instellingssubsidie, zonder toepassing van de in [artikel 3a][ref1]
      bedoelde vermindering, na uitvoering van de gesubsidieerde activiteiten overeenkomstig de geldende verplichtingen,
      niet is besteed aan de doeleinden waarvoor het is verstrekt, wordt het gereserveerd.

      2 Voor de berekening van het in het eerste lid bedoelde te reserveren bedrag wordt het totaal van de met de
      gesubsidieerde activiteiten samenhangende baten, bestaande uit de verleende instellingssubsidie en de gerealiseerde
      overige baten, verminderd met de lasten van de gesubsidieerde activiteiten. Deze uitkomst wordt toegerekend naar
      rato van de verleende instellingssubsidie en de, in de ingediende begroting opgenomen, met de gesubsidieerde
      activiteiten samenhangende, overige baten. Het te reserveren bedrag is het aan de instellingssubsidie toegerekende
      deel.

      3 Toevoegingen aan voorzieningen als bedoeld in
      [artikel 374, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref2], die samenhangen met de gesubsidieerde
      activiteiten, worden gerekend tot de lasten van de gesubsidieerde activiteiten, bedoeld in het tweede lid, tenzij
      de minister anders bepaalt.

      4 Indien in de ingediende begroting onder de met de gesubsidieerde activiteiten samenhangende baten een
      vrijgevallen voorziening is opgenomen, blijft deze buiten beschouwing bij de berekening van het te reserveren
      bedrag, bedoeld in het tweede lid.

      5 De verplichting, bedoeld in het eerste lid, geldt niet voor de ontvanger van een subsidie als bedoeld in
      [artikel 19][ref3].

      6 De in het eerste lid bedoelde reservering kan uitsluitend worden besteed aan doeleinden waarvoor de subsidie
      werd verstrekt.

      7 Het totaal van de in het eerste lid bedoelde reservering bedraagt ten hoogste 10% van het bedrag van de verleende
      subsidie, zonder toepassing van de in [artikel 3a][ref4] bedoelde vermindering. In afwijking van de eerste volzin
      is in geval van een meerjarige instellingssubsidie, het percentage gelijk aan 10 gedeeld door het aantal jaren
      waarvoor de subsidie is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0007807#Artikel3a
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel374
      [ref3]: https://wetten.overheid.nl/BWBR0007807#Artikel19
      [ref4]: https://wetten.overheid.nl/BWBR0007807#Artikel3a
