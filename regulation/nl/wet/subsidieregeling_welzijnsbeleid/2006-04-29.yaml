  - number: '12'
    text: |-
      1 In de beschikking tot subsidieverlening worden de hoogte en het tempo van de bevoorschotting vastgesteld.

      2 Gedurende het project bedragen de voorschotten in totaal niet meer dan 90% van het bedrag van de verleende
      projectsubsidie.

      3 Uiterlijk twee maanden na ontvangst van de volledige aanvraag voor de subsidievaststelling worden de voorschotten
      verhoogd tot het bedrag van de subsidiedeclaratie voor zover het bedrag van de subsidiedeclaratie niet hoger is dan
      het bedrag van de verleende projectsubsidie.
    url: https://wetten.overheid.nl/BWBR0007807/2006-04-29#Artikel12
  - number: '13'
    text: In een projectplan komen ten minste de in bijlage 4 bij deze regeling genoemde onderwerpen aan de orde.
    url: https://wetten.overheid.nl/BWBR0007807/2006-04-29#Artikel13
  - number: '14'
    text: |-
      Baten en lasten van een project die door middel van interne doorberekeningen worden toegerekend, worden bepaald
      op bedrijfseconomische en maatschappelijk aanvaardbare grondslagen. Voor zover hierin lasten zijn begrepen van
      materiële vaste activa, worden deze lasten op basis van aanschaffingsprijzen van die activa berekend.
    url: https://wetten.overheid.nl/BWBR0007807/2006-04-29#Artikel14
  - number: '15'
    text: |-
      De rapportage omtrent de naleving van de subsidiebepalingen, bedoeld in [artikel 36, tweede lid][ref1], van
      het bekostigingsbesluit, geschiedt in geval van een projectsubsidie overeenkomstig het als bijlage 5 bij deze
      regeling opgenomen controleprotocol en met gebruikmaking van de in bijlage 6 bij deze regeling opgenomen model-
      accountantsverklaringen.


      [ref1]: https://wetten.overheid.nl/BWBR0007807#Artikel36
