  - number: '37'
    text: |-
      In deze paragraaf wordt verstaan onder:



            a
            landelijke sportorganisatie:

              een instelling met ten minste 2500 leden uit ten minste vijf provincies, die werkzaam is op het gebied van
      de sport, een landelijk werkterrein heeft en representatief is voor één of meer takken van sport;



            b
            bijzondere landelijke sportorganisatie:

              een instelling die een landelijk werkterrein heeft en uitsluitend of in hoofdzaak werkzaam is op één of
      meer van de volgende gebieden:
              deskundigheidsbevordering;
      sportgezondheidszorg en sportmedische begeleiding;
      arbeidsaangelegenheden in de sport;
      sportaccommodatie;
      topsport;
      sportveiligheid;
      sportstimulering;
      gehandicaptensport;
      ondersteuning van aangesloten landelijke sportorganisaties;



            c
             sportopleiding:

              een samenhangende reeks van lessen op het gebied van de sport, opleidend tot bekwaamheden voor functies in
      de sport;



            d
             experimentele sportopleiding:

              een sportopleiding in ontwikkeling;



            e
             sportbijscholing:

              een samenhangende reeks van lessen, gericht op het vergroten van de deskundigheid van sportfunctionarissen;



            f
            lid:

              een natuurlijke persoon die bij een landelijke sportorganisatie of bij een vereniging, aangesloten bij
      een landelijke sportorganisatie, als lid geregistreerd staat, door wie of ten behoeve van wie aan de landelijke
      sportorganisatie jaarlijks een bedrag wordt afgedragen en die zich uitdrukkelijk als zodanig heeft opgegeven;



            g
             A-accommodatie:

              een sportaccommodatie die door een landelijke sportorganisatie is aangewezen als een nationale en
      internationale trainings- en wedstrijdaccommodatie voor een of meer bepaalde takken van sport;



            h
             B-accommodatie:

              een sportaccommodatie die door een landelijke sportorganisatie is aangewezen als een regionale trainings-
      en wedstrijdaccommodatie voor een of meer bepaalde takken van sport;



            i
             topsportevenement:

              een eindronde van een Europees- of wereldkampioenschap;
      een evenement om een vergelijkbare titel;
      een evenement dat onderdeel is van een serie wedstrijden die beslissend is voor de titel Europees of
      wereldkampioen;
      een Olympisch of Paralympisch kwalificatietoernooi;
      een ander door de minister als zodanig aangewezen evenement;



            j
             evenementaccommodatie:

              een accommodatie voor een topsportevenement;



            k
            World Anti Doping Code:

              de antidopingcode, zoals deze is vastgesteld door de World Anti Doping Agency te Montreal.
    url: https://wetten.overheid.nl/BWBR0007807/2006-04-29#Artikel37
  - number: '38'
    text: |-
      1 Een landelijke sportorganisatie voert een antidopingbeleid conform de World Anti Doping Code.

      2 Indien een landelijke sportorganisatie niet voldoet aan het eerste lid, kan de minister het totaal van
      de subsidies dat op basis van de [artikelen 40 tot en met 44][ref1] van deze regeling aan een landelijke
      sportorganisatie is verleend met ten hoogste 10% lager vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0007807#Artikel40
    url: https://wetten.overheid.nl/BWBR0007807/2006-04-29#Artikel38
