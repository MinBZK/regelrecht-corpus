  - number: '16'
    text: |-
      1 Een instellingssubsidie aan een bejaardenpension voor de huisvesting en verzorging van zorgbehoevende personen
      bestaat uit een bedrag dat ontstaat door vermenigvuldiging van het aantal verzorgde personen met een door de
      minister vast te stellen bedrag, verminderd met de overeenkomstig het tweede lid in rekening te brengen eigen
      bijdragen.

      2 De aan een zorgbehoevende persoon per maand in rekening te brengen eigen bijdrage, bedraagt het netto-
      maandinkomen, berekend op de in [bijlage 7][ref1] aangegeven wijze, verminderd met de norm, bedoeld in
      [artikel 23, eerste lid, van de Wet werk en bijstand][ref2], tot ten hoogste het bedrag van de verzorgingsprijs. De
      hoogte van de in rekening te brengen maandelijkse eigen bijdrage wordt één maal per jaar vastgesteld, doch kan op
      verzoek van de zorgbehoevende persoon worden herzien.

      3 Indien het bejaardenpension niet gedurende het gehele jaar heeft voorzien in de huisvesting en verzorging van een
      persoon wordt het normbedrag, bedoeld in het eerste lid, evenredig verminderd.


      [ref1]: https://wetten.overheid.nl/BWBR0007807
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel23
    url: https://wetten.overheid.nl/BWBR0007807/2006-04-29#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0007807
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '23'
  - number: '17'
    text: |-
      1 Een subsidie als bedoeld in [artikel 16][ref1] wordt slechts verstrekt voor zorgbehoevende personen ten behoeve
      van wie de minister ook in 1994 subsidie heeft verstrekt.

      2 De aanvraag van een subsidie gaat vergezeld van een opgave van de in het eerste lid bedoelde personen, voor
      zover zij nog gebruik maken van het bejaardenpension, alsmede van de aan die personen in rekening te brengen eigen
      bijdragen. De opgave geschiedt overeenkomstig het als bijlage 8 bij deze regeling opgenomen formulier.

      3 In geval van een subsidie als bedoeld in [artikel 16][ref2] is [artikel 6, eerste lid][ref3], niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007807#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0007807#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0007807#Artikel6
