  - number: 29b
    text: |-
      1 CENSIS verricht jaarlijks een vergelijkend onderzoek naar de werkelijke kosten van de huisvesting, verzorging en
      opvoeding van een kind in een internaat en naar de personeelsformatie per kind.

      2 De uitkomsten van het onderzoek, bedoeld in het eerste lid, worden als bijlage gevoegd bij de jaarrekening van
      CENSIS die bij de aanvraag tot subsidievaststelling wordt overgelegd.

      3 CENSIS rapporteert driejaarlijks op basis van een rapportage van een onafhankelijke derde aan de minister over
      de kwaliteit en de kwaliteitsontwikkeling van de huisvesting, verzorging en opvoeding van kinderen in internaten en
      pleeggezinnen, of telkens wanneer dat nodig is voor een beoordeling van de kwaliteit of de kwaliteitsontwikkeling.
      Indien een exploitant voorziet in de huisvesting, verzorging en opvoeding van kinderen, ziet CENSIS toe op de
      naleving van haar kwaliteitsbeleid.

      4 CENSIS komt schriftelijk met de ouders of de wettelijk vertegenwoordiger van een kind overeen dat ten behoeve van
      de huisvesting, verzorging en opvoeding van het kind in een internaat of in een pleeggezin een ouderbijdrage per
      schooljaar is verschuldigd overeenkomstig [bijlage 9b][ref1]. De ouderbijdrage wordt vastgesteld naar evenredigheid
      van het aantal maanden dat het kind gebruik maakt van de door CENSIS aangeboden huisvesting, verzorging en
      opvoeding in een internaat of een pleeggezin.

      5 CENSIS draagt per kwartaal aan het Ministerie van Volksgezondheid, Welzijn en Sport een bedrag af, dat per
      subsidiejaar wordt vastgesteld op de som van de in het vierde lid bedoelde ouderbijdragen.

      6 Indien CENSIS het huisvesten, verzorgen en opvoeden van kinderen doet uitvoeren door een exploitant, komt CENSIS
      met hen overeen, dat zij op verzoek van de accountant van CENSIS of op verzoek van de accountantsdienst van het
      Ministerie van Volksgezondheid, Welzijn en Sport alle bescheiden en inlichtingen aan CENSIS verstrekken, die nodig
      zijn voor een juiste vervulling van hun taak. De accountantsdienst van het Ministerie van Volksgezondheid, Welzijn
      en Sport richt haar verzoek tot CENSIS.


      [ref1]: https://wetten.overheid.nl/BWBR0007807
    url: https://wetten.overheid.nl/BWBR0007807/2006-04-29#Artikel29b
