  - number: '27'
    text: |-
      1 In deze paragraaf wordt verstaan onder:



              a

                *binnenschipper:*


                de schipper die met zijn gezin aan boord van een bedrijfsmatig voor de binnenvaart gebruikt schip
      woont, alsmede een aldaar met zijn gezin wonende en werkzame werknemer van een zodanige schipper of van een
      binnenvaartrederij;



              b

                *kermisexploitant:*


                de ondernemer die het kermisbedrijf uitoefent of een werknemer van een zodanige ondernemer, indien deze
      ten behoeve van zijn werkzaamheden gedurende ten minste vier maanden per jaar met zijn gezin een trekkend bestaan
      leidt;



              c
               CENSIS:

                de Centrale Stichting van Internaten voor Schippers- en kermisjeugd;



              d
               kind:

                een kind of pleegkind van een binnenschipper, kermisexploitant of circusartiest;



              e
               internaat:

                een gebouw of een samenstel van gebouwen waarin kinderen huisvesting, verzorging en opvoeding wordt
      geboden;



              f
               exploitant:

                een persoon of rechtspersoon die een internaat exploiteert;



              g
               pleeggezin:

                een gezin van een ander dan de natuurlijke ouders of de wettelijk vertegenwoordiger van een kind, waarin
      kinderen huisvesting, verzorging en opvoeding wordt geboden.




      2 De minister kan voor de toepassing van deze regeling een persoon die in vergelijkbare omstandigheden verkeert,
      gelijk stellen met een binnenschipper of een kermisexploitant.
    url: https://wetten.overheid.nl/BWBR0007807/2006-04-29#Artikel27
  - number: '28'
    text: |-
      De minister verstrekt aan CENSIS een instellingssubsidie voor het in internaten of pleeggezinnen huisvesten,
      verzorgen en opvoeden van kinderen.
    url: https://wetten.overheid.nl/BWBR0007807/2006-04-29#Artikel28
  - number: '29'
    text: |-
      1 De subsidie, bedoeld in [artikel 28][ref1], bestaat uit € 383 per kind in een internaat of pleeggezin, verhoogd
      met de som van de bedragen die ontstaat door vermenigvuldiging van het aantal kinderen:

      a. in een internaat, indien de exploitant:

      1e. huurder is, met € 17.887;

      2e. eigenaar is en in verband met een op of na 1 januari 2001 op het internaat gevestigde hypotheek rente-
      en aflossingskosten verschuldigd is, met € 16.688 vermeerderd met een toeslag van € 4.511 voor de rente- en
      aflossingskosten;

      3e. eigenaar is, doch niet of niet langer rente- en aflossingskosten verschuldigd is in verband met een daarop
      gevestigde hypotheek, met € 16.688;

      4e. eigenaar is, doch niet van de onroerende zaak waarop het internaat is gebouwd, met € 16.783;

      b. in een pleeggezin met € 2.763.

      2 Voor de toepassing van het eerste lid komen slechts in aanmerking kinderen die op 15 september van het jaar,
      voorafgaand aan het jaar waarvoor subsidie wordt verleend, door CENSIS in een internaat of pleeggezin werden
      gehuisvest, verzorgd en opgevoed.

      3 Indien een kind wordt gehuisvest, verzorgd en opgevoed in een internaat als bedoeld in het eerste lid, onderdeel
      a, onder 2e en dit internaat onderdeel uitmaakt van een in een meerjarig capaciteitsplan opgenomen nieuwbouwplan,
      wordt de toeslag met betrekking tot de rente- en aflossingskosten slechts verleend, indien dit capaciteitsplan door
      de minister is goedgekeurd.

      4 Indien een internaat bestaat uit een samenstel van gebouwen en deze gebouwen onder meer dan één categorie vallen,
      zoals omschreven in het eerste lid, onderdeel a, wordt voor de toepassing van dit artikel uitgegaan van het gebouw
      waarin het kind overnacht.


      [ref1]: https://wetten.overheid.nl/BWBR0007807#Artikel28
    url: https://wetten.overheid.nl/BWBR0007807/2006-04-29#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0007807
        artikel: '28'
        hoofdstuk: IV
        paragraaf: '4'
  - number: 29a
    text: |-
      1 Onverminderd [hoofdstuk II van het Bekostigingsbesluit welzijnsbeleid][ref1] gaat de aanvraag voor de subsidie,
      bedoeld in [artikel 28][ref2], vergezeld van een meerjarig capaciteitsplan, waarin in ieder geval is opgenomen:

      a. de beschikbare capaciteit in internaten;

      b. de naar verwachting benodigde capaciteit voor de huisvesting, verzorging en opvoeding van kinderen in internaten
      voor de komende vijf jaar;

      c. het verschil per internaat tussen beschikbare en benodigde capaciteit en

      d. het voorgenomen capaciteitsbeleid, waaruit blijkt op welke wijze de beschikbare capaciteit wordt aangepast aan
      de benodigde capaciteit.

      2 Het voorgenomen capaciteitsbeleid geeft aan welke reductie dient plaats te vinden, waar en wanneer deze
      zal plaatsvinden, welke internaten of panden worden gehandhaafd, welke zullen worden gesloten, waar bestaande
      panden ten behoeve van andere internaten worden ingezet en waar sprake zal zijn van nieuwe huur-, koop- of
      erfpachtsituaties dan wel nieuwbouw.

      3 Het meerjarig capaciteitsplan behoeft de goedkeuring van de minister. De minister verleent geen goedkeuring,
      indien het capaciteitsplan voorziet in nieuwe internaten of onderdelen van internaten zonder dat tevens wordt
      voorzien in de afstoting van huisvestingscapaciteit die niet wordt gebruikt voor het huisvesten, verzorgen en
      opvoeden van kinderen zodat doelmatig wordt aangesloten bij een dalende behoefte aan huisvestingscapaciteit.

      4 De aanvraag voor de subsidie, bedoeld in [artikel 28][ref3], gaat vergezeld van een verklaring van een accountant
      als bedoeld in artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek, waaruit blijkt dat de gegevens
      omtrent het aantal gehuisveste kinderen door CENSIS op 15 september van het jaar, voorafgaand aan het jaar
      waarvoor subsidie wordt aangevraagd, juist zijn. De accountantsverklaring wordt opgesteld overeenkomstig het in
      [bijlage 9a][ref4] opgenomen model.


      [ref1]: https://wetten.overheid.nl/BWBR0007133#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0007807#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0007807#Artikel28
