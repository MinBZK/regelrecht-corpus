  - number: B9a:1.1
    text: |-
      afgegeven ten behoeve van het Ministerie van Volksgezondheid, Welzijn en Sport

      Wij hebben de bijgevoegde opgave van het aantal door ... (naam instelling) te ... (plaats) per ...
      (datum) ingeschreven en gehuisveste kinderen in internaten gecontroleerd. Deze opgave is opgesteld
      onder verantwoordelijkheid van de leiding van ... (naam instelling of soort rechtspersoon). Het is onze
      verantwoordelijkheid een accountantsverklaring inzake deze opgave te verstrekken.

      Onze controle is verricht overeenkomstig algemeen aanvaarde richtlijnen met betrekking tot controle-opdrachten
      en de aanwijzingen die de minister in [bijlage 2 bij de Subsidieregeling welzijnsbeleid][ref1] heeft gegeven met
      betrekking tot de controle op en de rapportage over de naleving van de subsidiebepalingen.

      Volgens de algemeen aanvaarde richtlijnen met betrekking tot controle-opdachten dient onze controle zodanig te
      worden gepland en uitgevoerd, dat een redelijke mate van zekerheid wordt verkregen dat de opgave van het aantal
      kinderen geen onjuistheden van materieel belang bevat. Een controle omvat onder meer een onderzoek door middel van
      deelwaarnemingen en relevante gegevens. Wij zijn van mening dat onze controle een deugdelijke grondslag vormt voor
      ons oordeel.

        - GOEDKEURENDE VERKLARING:

      Wij zijn van oordeel dat de opgave de gegevens over het aantal per ... (datum) ingeschreven en gehuisveste kinderen
      in internaten juist weergeeft.


      [ref1]: https://wetten.overheid.nl/BWBR0007807
