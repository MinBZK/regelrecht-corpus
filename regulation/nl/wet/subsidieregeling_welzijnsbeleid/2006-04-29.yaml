  - number: '8'
    text: |-
      Op de balans worden de voorzieningen, gesplitst naar hun aard, en de reservering opgenomen. In de toelichting op de
      balans worden de toevoegingen en de onttrekkingen aan de voorzieningen en reservering toegelicht.
    url: https://wetten.overheid.nl/BWBR0007807/2006-04-29#Artikel8
  - number: '9'
    text: |-
      Baten en lasten die door middel van interne doorberekeningen worden toegerekend, worden bepaald op
      bedrijfseconomische en maatschappelijk aanvaardbare grondslagen. Voor zover hierin lasten zijn begrepen van
      materiële vaste activa, worden deze lasten op basis van aanschaffings-prijzen van die activa berekend.
    url: https://wetten.overheid.nl/BWBR0007807/2006-04-29#Artikel9
  - number: '10'
    text: |-
      De rapportage omtrent de naleving van de subsidiebepalingen, bedoeld in [artikel 36, tweede lid][ref1], van het
      bekostigingsbesluit, geschiedt in geval van een instellingssubsidie overeenkomstig het als bijlage 2 bij deze
      regeling opgenomen controleprotocol en met gebruikmaking van de in bijlage 3 bij deze regeling opgenomen model-
      accountantsverklaringen.


      [ref1]: https://wetten.overheid.nl/BWBR0007807#Artikel36
    url: https://wetten.overheid.nl/BWBR0007807/2006-04-29#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0007807
        artikel: '36'
        hoofdstuk: IV
        paragraaf: '6'
  - number: '11'
    text: |-
      Een projectsubsidie, anders dan een subsidie als bedoeld in de [artikelen 42][ref1], [43][ref2] en [43a][ref3],
      bestaat uit het verschil tussen de met de gesubsidieerde activiteiten samenhangende werkelijke lasten, voor zover
      opgenomen in een door de minister goedgekeurde begroting, en de met de gesubsidieerde activiteiten samenhangende
      baten. De subsidie bedraagt niet meer dan een door de minister vast te stellen maximum.


      [ref1]: https://wetten.overheid.nl/BWBR0007807#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0007807#Artikel43
      [ref3]: https://wetten.overheid.nl/BWBR0007807#Artikel43a
