  - number: '2'
    text: Deze regeling is van toepassing op subsidies waarop het bekostigingsbesluit van toepassing is.
    url: https://wetten.overheid.nl/BWBR0007807/2006-04-29#Artikel2
  - number: 2a
    text: |-
      1 De minister stelt jaarlijks subsidieplafonds vast voor de verstrekking van de subsidies krachtens de
      [artikelen 19][ref1], [42][ref2], [43][ref3] en [43a][ref4].

      2 Het beschikbare bedrag voor de subsidies krachtens [artikel 19][ref5] wordt verdeeld met toepassing van
      [artikel 2b, tweede lid][ref6].

      3 Het beschikbare bedrag voor de subsidies krachtens de [artikelen 42][ref7], [43][ref8] en [43a][ref9] wordt
      verdeeld met toepassing van [artikel 2b, derde lid, tweede volzin][ref10].


