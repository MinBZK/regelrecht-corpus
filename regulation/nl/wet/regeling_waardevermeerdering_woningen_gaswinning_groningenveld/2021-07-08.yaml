  - number: '2'
    text: |-
      1 De minister verstrekt op aanvraag subsidie voor een verduurzamingsmaatregel of een maatwerkadviesrapport aan een
      eigenaar van een woning waaraan, blijkens een schriftelijk stuk:

      a. door het Centrum Veilig Wonen fysieke schade door bodembeweging als gevolg van gaswinning in het Groningenveld
      van categorie A of B is vastgesteld, die:

      1°. ten minste € 1.000,- bedraagt, en

      2°. is erkend vanaf 1 januari 2016;

      b. door de Nederlandse Aardolie Maatschappij fysieke schade door bodembeweging als gevolg van gaswinning in het
      Groningenveld is vastgesteld, die:

      1°. ten minste € 1.000,- bedraagt, en

      2°. is erkend vanaf 1 maart 2018;

      c. door de Tijdelijke commissie mijnbouwschade Groningen of het Instituut Mijnbouwschade Groningen fysieke
      schade door bodembeweging als gevolg van gaswinning in het Groningenveld of als gevolg van de gasopslag Norg, is
      vastgesteld, die:

      1°. ten minste € 1.000,- bedraagt, en

      2°. is erkend vanaf 19 maart 2018;

      d. door de Tijdelijke commissie mijnbouwschade Groningen of het Instituut
      Mijnbouwschade Groningen een vergoeding is toegekend op grond van
      [artikel 3, eerste of tweede lid, van de Regeling Stuwmeer Tijdelijke Commissie Mijnbouwschade Groningen][ref1].

      2 Aanvragen om subsidie als bedoeld in het eerste lid, kunnen worden ingediend in de periode van 1 januari 2021
      tot en met 31 december 2021. Aanvragen zijn tijdig ingediend indien ze op de laatstgenoemde datum vóór 17:00 uur
      zijn ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0042372#Artikel3
    url: https://wetten.overheid.nl/BWBR0039336/2021-07-08#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0042372
        artikel: '3'
  - number: '3'
    text: |-
      1 De subsidiabele kosten zijn de kosten ter zake van een woning als bedoeld in [artikel 2, eerste lid][ref1], of
      ter zake van een lokaal energieproject, voor:

      a. een maatwerkadviesrapport;

      b. het aanschaffen van materiaal en de kosten van de installatie voor zover de installatie wordt uitgevoerd door
      een onderneming, voor het aanbrengen of installeren van de navolgende energiebesparende of -opwekkende maatregelen:

      1°. dak-, vloer- of gevelisolatie;

      2°. muurisolatie;

      3°. HR++(+) glas of isolerend glas voor een monument;

      4°. kozijn vereist voor HR++(+) glas of kozijn vereist voor het isoleren van glas voor een monument;

      5°. combiketel met hoog rendement inclusief daarvoor vereiste verwarmingselementen en leidingen voor zover niet
      aanwezig;

      6°. (micro) HRe ketel;

      7°. HR luchtverwarming;

      8°. zonnepanelen en zonnecollectoren;

      9°. zonneboiler;

      10°. pelletkachel;

      11°. warmtepomp;

      12°. infraroodpanelen;

      13°. warmte-koudeopslag;

      14°. technieken voor warmteterugwinning;

      15°. lage temperatuurverwarming;

      16°. energiezuinige vloerverwarmingspomp;

      17°. apparaat te koppelen aan een slimme meter, hoofdzakelijk bedoeld voor het geven van inzicht in het
      energieverbruik;

      18°. technieken voor de opwekking van windenergie.

      2 In afwijking van [artikel 10, tweede lid, van het Kaderbesluit nationale EZ-subsidies][ref2], komen de
      kosten, bedoeld in het eerste lid, voor subsidie in aanmerking, indien deze zijn gemaakt ter voldoening aan een
      contractuele verplichting die is aangegaan vóór de indiening van de aanvraag, doch na de datum van erkenning van de
      schade, bedoeld in [artikel 2, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0039336#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel10
