  - number: '4'
    text: De subsidie bedraagt 100% van de subsidiabele kosten met een maximum van € 4.000,– per woning.
    url: https://wetten.overheid.nl/BWBR0039336/2021-07-08#Artikel4
  - number: '5'
    text: |-
      1 De minister beslist afwijzend op een aanvraag indien:

      a. voor de woning reeds subsidie is verstrekt op grond van de Interimregeling waardevermeerdering van de provincie
      Groningen;

      b. voor de woning reeds subsidie is verstrekt op grond van deze regeling, behoudens indien deze is verstrekt aan
      dezelfde eigenaar en voor zover het maximum subsidiebedrag, genoemd in [artikel 4][ref1], door verlening van de
      subsidie niet wordt overschreden;

      c. voor de woning reeds door de Nederlandse Aardolie Maatschappij een met deze regeling vergelijkbare vergoeding
      voor verduurzamingsmaatregelen is verstrekt; of

      d. de aanvraag betrekking heeft op een verduurzamingsmaatregel die bestaat uit een gebruikte installatie voor de
      productie van duurzame energie.

      2 De afwijzingsgronden, genoemd in het eerste lid, onderdelen a tot en met c, zijn niet van toepassing indien voor
      de woning door een andere eigenaar voor een andere schade, bedoeld in [artikel 2, eerste lid][ref2], subsidie wordt
      aangevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0039336#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0039336#Artikel2
    url: https://wetten.overheid.nl/BWBR0039336/2021-07-08#Artikel5
