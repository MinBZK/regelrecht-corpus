        artikel: '2'
  - number: '7'
    text: |-
      1 Een verduurzamingsmaatregel of een maatwerkadviesrapport, waarvoor op grond van deze regeling een subsidie is
      verleend, wordt binnen een termijn van twaalf maanden na de verlening van de subsidie aangebracht of geïnstalleerd
      en in gebruik genomen, respectievelijk opgeleverd.

      2 De minister kan op verzoek van de subsidieontvanger de termijn met negen maanden verlengen indien de termijn,
      bedoeld in het eerste lid, niet kan worden gehaald in verband met de datum van afronding van de versterking. Het
      verzoek wordt ingediend voorafgaand aan het einde van deze termijn.

      3 Behoudens als onderdeel van de verkoop van de woning, vervreemdt de subsidieontvanger:

      a. een verduurzamingsmaatregel waarvoor subsidie is verleend niet binnen twaalf maanden na de datum van de
      subsidievaststelling;

      b. de deelneming in een lokaal energieproject ten behoeve waarvan subsidie is verleend niet binnen vijf jaar na de
      datum van de subsidievaststelling.
    url: https://wetten.overheid.nl/BWBR0039336/2021-07-08#Artikel7
  - number: '8'
    text: |-
      1 Een aanvraag voor subsidie als bedoeld in [artikel 2][ref1], bevat de gegevens van de aanvrager, waaronder ten
      minste:

      a. de naam, het post- en bezoekadres, het e-mailadres en het telefoonnummer;

      b. het Burgerservicenummer of het nummer waaronder de onderneming is geregistreerd bij de Kamer van Koophandel;

      c. het bankrekeningnummer, met overlegging van een kopie van een actueel bankafschrift of een bankpas ter
      verificatie daarvan;

      d. de onderbouwing van in het aanvraagformulier vermelde kosten, blijkende uit:

      1°. een door de aanvrager aanvaarde offerte of opdrachtbevestiging van de aannemer of leverancier met daarop
      vermeld de datum van aanvang van de werkzaamheden, respectievelijk levering van de installatie, van maximaal twee
      maanden oud, respectievelijk een factuur en het daarbij behorende betalingsbewijs;

      2°. een door de aanvrager aanvaarde offerte of opdrachtbevestiging van een gecertificeerd adviseur met daarop
      vermeld de datum van oplevering van het maatwerkadviesrapport, van maximaal twee maanden oud, respectievelijk een
      factuur en het daarbij behorende betalingsbewijs;

      f. een afschrift van de besluiten tot verlening van andere subsidies in de kosten van de op grond van deze regeling
      te subsidiëren activiteiten dan wel van de aanvragen tot verlening van deze andere subsidies;

      g. een schriftelijk stuk als bedoeld in [artikel 2, eerste lid, aanhef][ref2];

      h. een opgave van de omzetbelasting die in rekening is gebracht voor de getroffen maatregelen voor zover deze
      omzetbelasting is verrekend.

      2 De aanvraag door een onderneming bevat tevens een verklaring over alle andere onder de algemene de-
      minimisverordening of andere de- minimisverordeningen vallende de-minimissteun die deze onderneming gedurende de
      twee voorgaande belastingjaren en het lopende belastingjaar heeft ontvangen, als bedoeld in artikel 6, eerste lid,
      van de algemene de-minimisverordening.


      [ref1]: https://wetten.overheid.nl/BWBR0039336#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0039336#Artikel2
    url: https://wetten.overheid.nl/BWBR0039336/2021-07-08#Artikel8
