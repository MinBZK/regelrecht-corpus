  - number: '6'
    text: |-
      1 Het subsidieplafond voor het verlenen van subsidie die is aangevraagd in de periode, genoemd in
      [artikel 2, tweede lid][ref1], bedraagt € 77.661.000,–.

      2 De minister verdeelt het subsidieplafond op volgorde van binnenkomst van de aanvragen.


      [ref1]: https://wetten.overheid.nl/BWBR0039336#Artikel2
    url: https://wetten.overheid.nl/BWBR0039336/2021-07-08#Artikel6
