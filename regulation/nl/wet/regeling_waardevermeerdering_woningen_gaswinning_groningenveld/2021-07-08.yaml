  - number: '9'
    text: |-
      De subsidie, bedoeld in [artikel 2][ref1] bevat, indien deze aan een onderneming wordt verstrekt, staatssteun en
      wordt gerechtvaardigd door de algemene de-minimisverordening.


      [ref1]: https://wetten.overheid.nl/BWBR0039336#Artikel2
