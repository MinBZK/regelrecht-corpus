preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben dat het, in verband met de houdbaarheid van de overheidsfinanciën en de
    noodzaak ook voor toekomstige generaties een solide stelsel van collectieve voorzieningen zeker te stellen,
    wenselijk is de leeftijd waarop op grond van de Algemene Ouderdomswet recht op ouderdomspensioen ontstaat met
    ingang van 2013 stapsgewijs te verhogen naar 66 jaar in 2019 en naar 67 jaar in 2023 en vervolgens te koppelen aan
    de stijging van de levensverwachting en in samenhang daarmee ook de Wet werk en bijstand, de Wet inkomstenbelasting
    2001 en de Wet op de loonbelasting 1964 aan te passen;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0031799/2020-01-01#ArtikelAanhef
