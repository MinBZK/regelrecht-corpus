preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is in de wet een regeling op te nemen op grond waarvan
    adoptiefouders een tegemoetkoming in de kosten van interlandelijke adoptie kan worden verleend;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0030286/2012-01-01#ArtikelAanhef
articles:
  - number: II
    text: |-
      Voor adoptiefouders die op of na 1 januari 2009 doch voor inwerkingtreding van deze
      wet via interlandelijke adoptie een kind hebben geadopteerd, vangt in afwijking van
      [artikel 9a, eerste lid onder a, van de Wet opneming buitenlandse kinderen ter adoptie][ref1], de in dat artikel
      genoemde de termijn van drie jaar aan op het moment van inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0004447#Artikel9a
    url: https://wetten.overheid.nl/BWBR0030286/2012-01-01#ArtikelII
    references:
      - id: ref1
        bwb_id: BWBR0004447
        artikel: 9a
  - number: III
    text: Deze wet treedt in werking met ingang van een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0030286/2012-01-01#ArtikelIII
