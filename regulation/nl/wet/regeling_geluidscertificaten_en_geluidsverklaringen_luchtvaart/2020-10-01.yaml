        artikel: 3.19c
  - number: 1a
    text: |-
      Deze regeling berust op [artikel 3.24 van de Wet luchtvaart][ref1] en
      [artikel 16 van het Besluit luchtvaartuigen 2008][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3.24
      [ref2]: https://wetten.overheid.nl/BWBR0023922#Artikel16
    url: https://wetten.overheid.nl/BWBR0018244/2020-10-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3.24'
      - id: ref2
        bwb_id: BWBR0023922
        artikel: '16'
  - number: '2'
    text: |-
      1 De aanvraag tot afgifte van een geluidscertificaat of van een geluidsverklaring geschiedt door indiening bij de
      minister van een volledig ingevuld en ondertekend formulier, dat door de minister elektronisch beschikbaar wordt
      gesteld.

      2 De aanvraag, bedoeld in het eerste lid, is mede ondertekend door de houder van een bewijs van bevoegdheid, dat de
      bevoegdheid geeft tot afgifte van een certificaat van vrijgave voor gebruik van het desbetreffende luchtvaartuig.

      3 In het geval als bedoeld in [artikel 14, derde lid, onderdeel b, van het Besluit luchtvaartuigen 2008][ref1]
      wordt bij de aanvraag van een geluidscertificaat of een geluidsverklaring het geluidsmeetrapport ingediend.

      4 De modellen van het geluidscertificaat, de geluidsverklaring en de in [artikel 1, tweede lid][ref2], genoemde
      documenten zijn opgenomen in de bij deze regeling behorende bijlage.


      [ref1]: https://wetten.overheid.nl/BWBR0023922#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0018244#Artikel1
    url: https://wetten.overheid.nl/BWBR0018244/2020-10-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0023922
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0018244
        artikel: '1'
        paragraaf: '1'
  - number: '3'
    text: |-
      1 Een aanvraag om wijziging van een geluidscertificaat of van een geluidsverklaring geschiedt door indiening
      door de houder van het desbetreffende certificaat of de desbetreffende verklaring bij de minister van een
      volledig ingevuld en ondertekend formulier, dat door de minister elektronisch beschikbaar wordt gesteld.
      [Artikel 2, tweede en derde lid][ref1], zijn van overeenkomstige toepassing.

      2 De in het eerste lid bedoelde houder is verplicht het geluidscertificaat of geluidsverklaring, waarvoor het
      gewijzigde certificaat of verklaring in de plaats komt, een week na de datum van verzending van het in het eerste
      lid bedoelde gewijzigde certificaat of verklaring aan de minister te zenden.

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing op de aanvraag om wijziging van een
      geluidsverklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0018244#Artikel2
    url: https://wetten.overheid.nl/BWBR0018244/2020-10-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0018244
        artikel: '2'
        paragraaf: '2'
  - number: '4'
    text: |-
      Indien is gebleken dat de gegevens, vermeld op het geluidscertificaat of de geluidsverklaring, niet meer met
      de werkelijkheid overeenkomen, wordt een geluidscertificaat respectievelijk een geluidsverklaring met de juiste
      gegevens aan de houder van het certificaat of de verklaring gezonden. [Artikel 3, tweede en derde lid][ref1], zijn
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018244#Artikel3
    url: https://wetten.overheid.nl/BWBR0018244/2020-10-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0018244
        artikel: '3'
        paragraaf: '3'
  - number: '5'
    text: |-
      Bij de overdracht van een luchtvaartuig wordt het geluidscertificaat of de geluidsverklaring, behorende bij
      dat luchtvaartuig, door de voormalige houder van dat luchtvaartuig overgedragen aan de nieuwe houder van dat
      luchtvaartuig.
    url: https://wetten.overheid.nl/BWBR0018244/2020-10-01#Artikel5
  - number: '6'
    text: |-
      1 Schorsing of intrekking van een geluidscertificaat of een geluidsverklaring wordt bij aangetekende brief aan de
      houder van het betrokken luchtvaartuig medegedeeld.

      2 Om een schorsing op te heffen toont de houder aan, dat de redenen, die tot schorsing hebben geleid, zijn
      vervallen.
    url: https://wetten.overheid.nl/BWBR0018244/2020-10-01#Artikel6
  - number: '7'
    text: |-
      1 Een geluidscertificaat of een geluidsverklaring kan door de minister worden vernieuwd, indien het document wordt
      vermist of indien het document onleesbaar, beschadigd of anderszins onbruikbaar is geworden.

      2 In geval van vermissing van het geluidscertificaat of de geluidsverklaring wordt bij de aanvraag tot vernieuwing
      een afschrift van het proces-verbaal van de aangifte van vermissing overgelegd.

      3 Indien een geluidscertificaat of geluidsverklaring wegens vermissing is vernieuwd en het vermiste
      geluidscertificaat of geluidsverklaring wordt teruggevonden, is de houder van het betrokken luchtvaartuig verplicht
      het teruggevonden document zo spoedig mogelijk aan de minister te zenden.

      4 Indien een geluidscertificaat of een geluidsverklaring anders dan wegens vermissing is vernieuwd, is de houder
      van het luchtvaartuig verplicht het oorspronkelijke document binnen een week na de datum van verzending van het
      nieuwe document aan de minister te zenden.
    url: https://wetten.overheid.nl/BWBR0018244/2020-10-01#Artikel7
  - number: '9'
    text: 'Deze regeling wordt aangehaald als: Regeling geluidscertificaten en geluidsverklaringen luchtvaart.'
    url: https://wetten.overheid.nl/BWBR0018244/2020-10-01#Artikel9
