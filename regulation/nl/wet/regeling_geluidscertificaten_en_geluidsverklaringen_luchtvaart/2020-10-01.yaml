preamble:
  text: |-
    Gelet op artikel 3.24 van de Wet luchtvaart en op artikel 22d van het Besluit luchtvaartuigen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0018244/2020-10-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze regeling wordt verstaan onder:

      a. minister: Minister van Infrastructuur en Waterstaat;

      b. geluidscertificaat: certificaat als bedoeld in [artikel 3.19a van de Wet luchtvaart][ref1];

      c. geluidsverklaring: verklaring als bedoeld in [artikel 3.19c van de Wet luchtvaart][ref2].

      2 Deze regeling is eveneens van toepassing op een voorlopig geluidscertificaat, een voorlopige geluidsverklaring,
      een aanvullende geluidsverklaring en een voorlopige aanvullende geluidsverklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3.19a
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel3.19c
    url: https://wetten.overheid.nl/BWBR0018244/2020-10-01#Artikel1
