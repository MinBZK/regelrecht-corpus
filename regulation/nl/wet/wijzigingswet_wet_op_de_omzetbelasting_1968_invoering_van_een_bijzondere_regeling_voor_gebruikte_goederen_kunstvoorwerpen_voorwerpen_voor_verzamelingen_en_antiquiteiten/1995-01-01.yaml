preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat de wetgeving inzake omzetbelasting dient te worden aangepast
    aan richtlijn nr. 94/5/EG van de Raad van de Europese Unie van 14 februari 1994 tot aanvulling van het
    gemeenschappelijk stelsel van belasting over de toegevoegde waarde en tot wijziging van Richtlijn 77/388/EEG -
    Bijzondere regeling voor gebruikte goederen, kunstvoorwerpen, voorwerpen voor verzamelingen en antiquiteiten (PbEG
    L 60);

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007167/1995-01-01#ArtikelAanhef
articles:
  - number: II
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld, die zonodig afwijken van de
      [Wet op de omzetbelasting 1968][ref1] zoals die luidt nadat deze wet in werking is getreden, ter zake van
      leveringen aan ondernemers door andere ondernemers uit een lid-staat die één van de bijzondere overgangsbepalingen
      toepast van artikel 28 *sexdecies* van de Zesde Richtlijn als bedoeld in artikel 2*a*, eerste lid, onderdeel *a*,
      van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002629
    url: https://wetten.overheid.nl/BWBR0007167/1995-01-01#ArtikelII
    references:
      - id: ref1
        bwb_id: BWBR0002629
  - number: III
    text: |-
      De [artikelen 28][ref1], [28][ref2] en [28][ref3] zijn niet van toepassing op leveringen van de in die artikelen
      bedoelde goederen die voor 1 januari 1995 aan een wederverkoper zijn geleverd met toepassing van artikel 8, derde
      lid, van die wet, zoals dat artikellid luidde voor die datum.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel28b
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel28c
      [ref3]: https://wetten.overheid.nl/BWBR0002629#Artikel28d
    url: https://wetten.overheid.nl/BWBR0007167/1995-01-01#ArtikelIII
