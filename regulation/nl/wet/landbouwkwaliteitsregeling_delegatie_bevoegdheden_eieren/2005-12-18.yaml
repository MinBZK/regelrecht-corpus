$id: landbouwkwaliteitsregeling_delegatie_bevoegdheden_eieren
regulatory_layer: WET
publication_date: '2007-09-28'
valid_from: '2005-12-18'
bwb_id: BWBR0014118
url: https://wetten.overheid.nl/BWBR0014118/2005-12-18
preamble:
  text: |-
    Gelet op artikel 5 van het Landbouwkwaliteitsbesluit eieren;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0014118/2005-12-18#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. minister: Minister van Landbouw, Natuur en Voedselkwaliteit;

      b. productschap: Productschap Pluimvee en Eieren.
    url: https://wetten.overheid.nl/BWBR0014118/2005-12-18#Artikel1
  - number: 1a
    text: Deze regeling is mede gebaseerd op [artikel 3, tweede en vierde lid, van het Legkippenbesluit 2003](onbekend).
    url: https://wetten.overheid.nl/BWBR0014118/2005-12-18#Artikel1a
  - number: '2'
    text: |-
      Het productschap is belast met het stellen van nadere regels als bedoeld in
      [artikel 3 van het Landbouwkwaliteitsbesluit eieren][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013953#Artikel3
    url: https://wetten.overheid.nl/BWBR0014118/2005-12-18#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0013953
        artikel: '3'
  - number: '3'
    text: |-
      Het productschap is belast met het vaststellen van een officieel kenteken en een model als bedoeld in
      [artikel 4 van het Landbouwkwaliteitsbesluit eieren][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013953#Artikel4
    url: https://wetten.overheid.nl/BWBR0014118/2005-12-18#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0013953
        artikel: '4'
  - number: 3a
    text: |-
      Het productschap is belast met de registratie, bedoeld in
      [artikel 3, eerste lid, van het Landbouwkwaliteitsbesluit pluimveevlees][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015006#Artikel3
    url: https://wetten.overheid.nl/BWBR0014118/2005-12-18#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0015006
        artikel: '3'
  - number: '4'
    text: |-
      Regels vastgesteld krachtens [artikel 2][ref1] behoeven de goedkeuring van de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0014118#Artikel2
    url: https://wetten.overheid.nl/BWBR0014118/2005-12-18#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0014118
        artikel: '2'
  - number: '5'
    text: |-
      De minister kan met betrekking tot het verlenen van de in [artikel 2][ref1] en [3][ref2] bedoelde medewerking
      beleidsregels stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0014118#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0014118#Artikel3
    url: https://wetten.overheid.nl/BWBR0014118/2005-12-18#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0014118
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0014118
        artikel: '3'
  - number: 5a
    text: |-
      1 Registratie en uitgifte van nummers als bedoeld in [artikel 3, eerste lid, van het Legkippenbesluit 2003][ref1]
      vindt plaats overeenkomstig de bijlage bij [Richtlijn 2002/4/EG](32002L0004) van de Commissie van 30 januari 2002
      met betrekking tot de registratie van onder [Richtlijn 1999/74/EG](31999L0074) van de Raad vallende inrichtingen
      waar legkippen worden gehouden.

      2 Het productschap is belast met de registratie en met de uitgifte van nummers, als bedoeld in het eerste lid.

      3 Het Productschap Pluimvee en Eieren kan in de Verordening identificatie en registratie van pluimveebedrijven,
      broedeieren en levend pluimvee (PPE) 2005 bepalen dat bij overtreding van artikel 2 van die verordening
      tuchtrechtelijke maatregelen worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0015138#Artikel3
    url: https://wetten.overheid.nl/BWBR0014118/2005-12-18#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0015138
        artikel: '3'
  - number: '6'
    text: De Landbouwkwaliteitsregeling delegatie bevoegdheden scharreleieren wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0014118/2005-12-18#Artikel6
  - number: '7'
    text: |-
      1 Deze regeling treedt in werking met ingang van de dag waarop het [Landbouwkwaliteitsbesluit eieren][ref1] in
      werking treedt.

      2 Deze regeling wordt aangehaald als: Landbouwkwaliteitsregeling delegatie bevoegdheden eieren.


      [ref1]: https://wetten.overheid.nl/BWBR0013953
    url: https://wetten.overheid.nl/BWBR0014118/2005-12-18#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0013953
