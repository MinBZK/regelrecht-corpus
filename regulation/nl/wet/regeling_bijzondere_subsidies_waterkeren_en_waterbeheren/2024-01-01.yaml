  - number: 14a
    text: |-
      Op aanvragen voor subsidieverlening die zijn ingediend vóór 1 januari 2012 zijn
      [artikel 2, eerste lid, onderdeel a][ref1], [artikel 3, tweede lid][ref2], [artikel 6, eerste lid][ref3],
      [artikel 7][ref4], [artikel 9, tweede lid, onderdeel a][ref5], en [artikel 11, eerste lid][ref6], van toepassing
      zoals deze luidden onmiddellijk vóór de inwerkingtreding van de Regeling van de Staatssecretaris van Infrastructuur
      en Milieu van 30 november 2011, tot wijziging van de Regeling bijzondere subsidies waterkeren en waterbeheren in
      verband met vervanging van het forfait voor de subsidiëring van kosten voor voorbereiding van het werk in subsidie
      op basis van werkelijk gemaakte kosten en enige technische wijzigingen (Stcrt. 2011, 22111).


