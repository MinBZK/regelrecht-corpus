articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. Minister: de Minister van Infrastructuur en Waterstaat;

      b. plan: een projectbesluit als bedoeld in [artikel 5.44 van de Omgevingswet][ref1];

      c. subsidie: een subsidie voor een maatregel als bedoeld in [artikel 7.23, vijfde lid, van de Waterwet][ref2];

      d. werk: een werk ter uitvoering van een projectbesluit als bedoeld in onderdeel b;

      e. hoofdingenieur-directeur: de hoofdingenieur-directeur Rijkswaterstaat Grote Projecten en Onderhoud.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel5.44
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel7.23
