  - number: '8'
    text: |-
      Op de intrekking of wijziging van de beschikking tot subsidieverlening zijn de [artikelen 4:48][ref1]
      en [4:50 van de Algemene wet bestuursrecht][ref2] van overeenkomstige toepassing, met uitzondering van
      [artikel 4:48, eerste lid, onderdeel e][ref3].


