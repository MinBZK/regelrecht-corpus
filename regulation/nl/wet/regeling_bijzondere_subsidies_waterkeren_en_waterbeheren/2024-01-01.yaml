        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 4:37
  - number: '6'
    text: |-
      1 Aan de subsidieontvanger kan gedurende de realisatie van het werk jaarlijks op aanvraag een voorschot worden
      verleend. Het totaal aan te verlenen voorschotten ten behoeve van de realisatie van het werk bedraagt niet meer dan
      80 procent van de raming van de kosten, bedoeld in [artikel 2, eerste lid][ref1].

      2 De aanvraag tot voorschotverlening wordt ingediend voor 15 april van het kalenderjaar waarvoor een voorschot
      wordt aangevraagd. Bij de aanvraag legt de subsidieontvanger een raming over van de te maken kosten in de periode
      waarvoor een voorschot wordt gevraagd en een raming van de bedragen waarvoor een voorschot zal worden gevraagd in
      de daaropvolgende kalenderjaren.

      3 De aanvraag wordt niet in behandeling genomen zolang het verantwoordingsverslag, bedoeld in [artikel 7][ref2],
      niet is overgelegd.

      4 De Minister neemt binnen acht weken na ontvangst van de aanvraag een besluit omtrent de voorschotverlening. De
      beschikking tot voorschotverlening vermeldt het bedrag waarvoor het voorschot wordt verleend.

      5 Een voorschot wordt binnen zes weken na de voorschotverlening betaald, tenzij bij de voorschotverlening anders
      is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0019518#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019518#Artikel7
    url: https://wetten.overheid.nl/BWBR0019518/2024-01-01#Artikel6
