  - number: '9'
    text: |-
      1 De subsidieontvanger dient binnen zes maanden na voltooiing van het werk bij de hoofdingenieur-directeur een
      aanvraag tot subsidievaststelling in.

      2 Bij de aanvraag, bedoeld in het eerste lid, overlegt de subsidieontvanger:

      a. een financiële eindverantwoording over het werk bestaande uit:

      1°. een overzicht van de gemaakte kosten voor de in [artikel 2, eerste lid][ref1], onderscheiden posten;

      2°. een overzicht van de uitbetaalde voorschotten waarbij voorschotten voor de kosten van voorbereiding, bedoeld in
      [artikel 2, eerste lid, onderdeel a][ref2], afzonderlijk worden vermeld;

      b. een verklaring over de financiële eindverantwoording, afgegeven door een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref3], waaruit blijkt of het werk is uitgevoerd
      overeenkomstig de beschikking tot subsidieverlening en waaruit blijkt dat de in onderdeel a bedoelde kosten zijn
      gemaakt, overeenkomstig het daartoe door de Minister bekendgemaakte controleprotocol.

      3 Op gemotiveerd verzoek van de subsidieontvanger, ingediend binnen zes maanden na voltooiing van het werk, kan de
      in het eerste lid bedoelde termijn worden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0019518#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019518#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel393
