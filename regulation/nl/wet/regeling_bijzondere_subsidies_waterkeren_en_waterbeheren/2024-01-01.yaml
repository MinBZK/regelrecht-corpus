    text: |-
      De Minister kan bij het verlenen en vaststellen van de subsidie afwijken van het in
      [artikel 2, eerste lid, onderdeel a][ref1], genoemde percentage voor zover toepassing daarvan, gelet op het doel of
      de strekking van die bepaling, voor de subsidieontvanger zal leiden tot een onbillijkheid van overwegende aard.


      [ref1]: https://wetten.overheid.nl/BWBR0019518#Artikel2
