  - number: '11'
    text: |-
      1 Indien vanwege nog lopende gerechtelijke procedures, voor een deel van de kosten bedoeld in
      [artikel 2, eerste lid][ref1], de subsidie nog niet kan worden vastgesteld, kan op verzoek van de subsidieontvanger
      de subsidie voor de kosten van of voortvloeiend uit deze procedures, afzonderlijk worden vastgesteld.

      2 Een verzoek als bedoeld in het eerste lid wordt ingediend bij de aanvraag tot subsidievaststelling, bedoeld in
      [artikel 9, eerste lid][ref2], waarbij met redenen wordt omkleed voor welke kosten de subsidie nog niet kan worden
      vastgesteld.

      3 Binnen zes maanden na afronding van de gerechtelijke procedures, bedoeld in het eerste lid, dient de
      subsidieontvanger bij de hoofdingenieur-directeur een aanvraag tot subsidievaststelling in. Op deze afzonderlijke
      subsidievaststelling zijn [artikel 9, tweede lid][ref3], en [artikel 10][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019518#Artikel2
