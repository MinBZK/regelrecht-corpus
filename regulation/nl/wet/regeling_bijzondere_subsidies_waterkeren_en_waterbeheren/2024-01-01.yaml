  - number: '10'
    text: |-
      1 Een beschikking tot subsidievaststelling vermeldt:

      a. de dagtekening en het nummer van de beschikking tot subsidieverlening;

      b. de berekeningswijze voor de vaststelling van het subsidiebedrag;

      c. het bedrag van de vastgestelde subsidie uitgesplitst overeenkomstig de in [artikel 2, eerste lid][ref1],
      onderscheiden posten;

      d. de betaalde voorschotten;

      e. het te betalen dan wel terug te vorderen bedrag.

      2 De subsidie kan ambtshalve worden vastgesteld indien de subsidieontvanger niet tijdig een aanvraag heeft
      ingediend als bedoeld in [artikel 9, eerste lid][ref2], of een verzoek als bedoeld in [artikel 9, derde lid][ref3].

      3 [Artikel 4:46, tweede lid en derde lid, van de Algemene wet bestuursrecht][ref4] is van overeenkomstige
      toepassing op de subsidievaststelling.

      4 [Artikel 4:49 van de Algemene wet bestuursrecht][ref5] van overeenkomstige toepassing op de intrekking of
      wijziging van de beschikking tot subsidievaststelling.


      [ref1]: https://wetten.overheid.nl/BWBR0019518#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019518#Artikel9
