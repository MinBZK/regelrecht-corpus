  - number: '5'
    text: |-
      1 De beschikking tot subsidieverlening bevat:

      a. een omschrijving van het werk waarvoor subsidie wordt verleend;

      b. een raming van het totale te subsidiëren bedrag;

      c. het bedrag waarvoor een voorschot wordt verleend, waarbij het bedrag voor de kosten van voorbereiding, bedoeld
      in [artikel 2, eerste lid, onderdeel a][ref1], afzonderlijk wordt vermeld.

      2 [Artikel 4:37, eerste lid, onderdeel c, van de Algemene wet bestuursrecht][ref2] is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019518#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel437
    url: https://wetten.overheid.nl/BWBR0019518/2024-01-01#Artikel5
