  - number: '7'
    text: |-
      De subsidieontvanger overlegt gedurende de realisatiefase van het werk jaarlijks voor 15 april, aan de
      hoofdingenieur-directeur een verantwoordingsverslag met betrekking tot de uitvoering van het werk met daarin:

      a. een financiële verantwoording waarin onderscheid wordt gemaakt tussen de kosten, bedoeld in
      [artikel 2, eerste lid, onderdelen b tot en met i][ref1];

      b. een financiële verantwoording van de kosten, bedoeld in [artikel 2, eerste lid, onderdeel a][ref2], die niet
      zijn opgenomen in het overzicht, bedoeld in [artikel 3, tweede lid, onderdeel c][ref3];

      c. een controleverklaring, overeenkomstig het daartoe door de Minister bekendgemaakte controleprotocol;

      d. eventuele wijzigingen in het tijdschema bedoeld in [artikel 3, tweede lid, onderdeel f][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0019518#Artikel2
