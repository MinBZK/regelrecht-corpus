  - number: '2'
    text: |-
      1 Een subsidie bestaat uit een vergoeding van de kosten voor voorbereiding en realisatie van een werk, te weten:

      a. de kosten van de voorbereiding van het werk inclusief het verkrijgen van de voor de realisatie van het werk
      benodigde vergunningen, met een maximum van 15 procent van de in de beschikking tot subsidieverlening opgenomen
      raming van de in onderdelen b tot en met i bedoelde kosten;

      b. de kosten voor de opruiming van explosieven die door een gemeente worden vergoed;

      c. de kosten voortvloeiend uit de voor de realisatie van het werk gesloten overeenkomsten van aanneming en
      overeenkomsten tot levering van diensten en materialen;

      d. de voor het verleggen van kabels en leidingen verschuldigde nadeelcompensatie berekend volgens
      __REF000___________________________________________________________________________________________________________
      ________________________;

      e. nadeelcompensatie aan derden, anders dan uit hoofde van het in de onderdelen b en d bepaalde, voor zover de
      beheerder daartoe rechtens gehouden is;

      f. de kosten voor bodemsanering, behoudens de kosten bedoeld in het tweede lid, onderdeel a;

      g. de kosten voor de opruiming van explosieven, behoudens de kosten bedoeld in het tweede lid, onderdeel b;

      h. de kosten voor begeleiding en toezicht op de uitvoering van de werkzaamheden die benodigd zijn voor de
      realisatie van het plan, voor zover dit geen betrekking heeft op de controle op eigen handelen van de beheerder;

      i. andere kosten dan de kosten, bedoeld in de onderdelen b tot en met h, die in redelijkheid zijn aan te merken
      als realisatiekosten.

      2 Niet voor vergoeding komen in aanmerking:

      a. de kosten voor bodemsanering die voor vergoeding in aanmerking komen op grond van het bepaalde bij of krachtens
      de [Kaderwet subsidies I en M][ref2];

      b. de kosten voor de opruiming van explosieven die voor vergoeding in aanmerking komen op grond van het
      [Bijdragebesluit kosten ruiming explosieven Tweede Wereldoorlog 1999][ref3];

      c. de kosten die de subsidieaanvrager op andere wijze vergoed kan krijgen;

      d. de kosten die voortkomen uit achterstallig onderhoud.


      [ref1]: https://wetten.overheid.nl/BWBR0010461
      [ref2]: https://wetten.overheid.nl/BWBR0032789
      [ref3]: https://wetten.overheid.nl/BWBR0010700
