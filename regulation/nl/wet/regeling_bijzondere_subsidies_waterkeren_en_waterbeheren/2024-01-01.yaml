  - number: '4'
    text: |-
      1 De Minister neemt binnen acht weken na ontvangst van de aanvraag een besluit omtrent de subsidieverlening. Indien
      de beschikking niet binnen acht weken kan worden gegeven, stelt de Minister de aanvrager daarvan in kennis en noemt
      hij daarbij een redelijke termijn waarbinnen de beschikking tegemoet kan worden gezien.

      2 De subsidie kan worden geweigerd indien:

      a. het werk waarvoor subsidie is aangevraagd niet is opgenomen in het hoogwaterbeschermingsprogramma, voor het jaar
      waarvoor de aanvraag is ingediend;

      b. het ontwerp van de waterkering niet voldoet aan eisen van soberheid en doelmatigheid;

      c. er sprake is van een weigeringsgrond als bedoeld in [artikel 4:35 van de Algemene wet bestuursrecht][ref1].

      3 De subsidie wordt geweigerd indien door verlening van de subsidie het subsidieplafond
      wordt overschreden. Bij mogelijke overschrijding van het subsidieplafond is
      [artikel 4:25, derde lid, van de Algemene wet bestuursrecht][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel435
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel425
    url: https://wetten.overheid.nl/BWBR0019518/2024-01-01#Artikel4
