  - number: '3'
    text: |-
      1 Een aanvraag voor subsidieverlening wordt ingediend bij de hoofdingenieur-directeur.

      2 De aanvraag voor subsidieverlening bevat:

      a. een door Gedeputeerde Staten goedgekeurd plan;

      b. een ontwerp en een beschrijving van het werk ter uitvoering van het goedgekeurde plan;

      c. een overzicht van de gemaakte kosten van voorbereiding, bedoeld in [artikel 2, eerste lid, onderdeel a][ref1],
      een financiële verantwoording over deze kosten en een controleverklaring waaruit blijkt dat deze kosten zijn
      gemaakt, overeenkomstig het daartoe door de Minister bekendgemaakte controleprotocol;

      d. een raming van de nog te maken kosten van voorbereiding, bedoeld in [artikel 2, eerste lid, onderdeel a][ref2],
      conform een daartoe door de Minister voorgeschreven ramingssystematiek;

      e. een raming van de kosten, bedoeld in [artikel 2, eerste lid, onderdelen b tot en met i][ref3], conform een
      daartoe door de Minister voorgeschreven ramingssystematiek;

      f. het bedrag waarvoor subsidie wordt gevraagd;

      g. het bedrag waarvoor een voorschot wordt gevraagd voor het eerste kalenderjaar van realisatie van het werk en een
      raming van de bedragen waarvoor een voorschot zal worden gevraagd in de daarop volgende kalenderjaren;

      h. een tijdschema en de geplande datum van voltooiing van het werk, conform een daartoe door de Minister
      voorgeschreven planningsmethodiek;

      i. voor projecten met een startraming van meer dan € 25 miljoen: een kosten-batenanalyse, conform een door de
      Minister voorgeschreven systematiek.


      [ref1]: https://wetten.overheid.nl/BWBR0019518#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019518#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0019518#Artikel2
