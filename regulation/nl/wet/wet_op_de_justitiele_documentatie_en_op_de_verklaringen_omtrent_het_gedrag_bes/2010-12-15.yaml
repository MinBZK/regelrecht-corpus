        artikel: '20'
        paragraaf: '2'
  - number: '22'
    text: |-
      1 De gezaghebber geeft een verklaring omtrent het gedrag slechts af wanneer hem uit een onderzoek met betrekking
      tot het gedrag van de betrokkene niet is gebleken van bezwaren tegen die persoon. In alle andere gevallen weigert
      hij de gevraagde verklaring af te geven.

      2 In de verklaring wordt het doel, waarvoor de afgifte is gevraagd, vermeld.
    url: https://wetten.overheid.nl/BWBR0028258/2010-12-15#Artikel22
  - number: '23'
    text: |-
      1 De gezaghebber mag bij zijn onderzoek uitsluitend acht slaan op:

      1°. de uittreksels uit de strafregisters, die hem ten aanzien van de betrokkene verstrekt worden;

      2°. gegevens ontleend aan de registers van de politie in de tegenwoordige of in de vroegere woonplaatsen of
      verblijfplaatsen van betrokkene;

      3°. andere schriftelijke bescheiden, welke hem in verband met de afgifte van de verklaring omtrent het gedrag ter
      beschikking zijn gesteld.

      2 Indien ten aanzien van betrokkenen geen strafblad in de strafregisters voorkomt, let de gezaghebber bij zijn
      onderzoek niet op feiten en gedragingen, vermeld in andere registers en bescheiden, indien sedert de dag, waarop
      deze zijn voorgevallen, meer dan vier jaren zijn verlopen.

      3 In bijzondere gevallen kan de gezaghebber van het bepaalde in het voorgaande lid afwijken. Alvorens in zodanig
      geval op het verzoek te beslissen, wint hij het advies in van de procureur-generaal.

      4 De gezaghebber beslist binnen veertien dagen nadat het verzoek is gedaan of, indien Onze Minister van Justitie
      op grond van [artikel 21][ref1] heeft beslist, dat het verzoek alsnog in verdere behandeling wordt genomen, binnen
      veertien dagen te rekenen van de dagtekening van de verzending van diens beslissing, of de verklaring kan worden
      afgegeven.

      5 Indien de gezaghebber, gelet op het ingestelde onderzoek, van oordeel is, dat de verklaring niet behoort te
      worden afgegeven, deelt hij binnen de in het voorgaande lid bedoelde termijn bij aangetekende brief zijn met
      redenen omklede beslissing tot weigering mede aan de betrokkene, waarbij deze tevens wordt gewezen op het bepaalde
      in [artikel 25][ref2]. Onder de redenen worden de feiten en gedragingen opgenomen, waarop de beslissing steunt.

      In het bijzondere geval, bedoeld in [artikel 23 derde lid][ref3], wordt in de beslissing vermeld, dat die bepaling
      toepassing heeft gevonden.

      6 De in het vierde en vijfde lid bedoelde termijnen kunnen, indien de gezaghebber de procureur-generaal hoort, ten
      hoogste met veertien dagen worden verlengd.

      Van de verlenging wordt mededeling gedaan aan de betrokkene.


      [ref1]: https://wetten.overheid.nl/BWBR0028258#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0028258#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0028258#Artikel23
