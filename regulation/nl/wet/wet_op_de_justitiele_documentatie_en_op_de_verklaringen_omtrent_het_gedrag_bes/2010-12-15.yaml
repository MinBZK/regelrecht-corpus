  - number: '15'
    text: |-
      1 De gezaghebber geeft geen andere verklaring omtrent het gedrag, onder welke benaming ook, af dan overeenkomstig
      de bepalingen van deze wet.

      2 Het voorgaand lid geldt niet:

      a. indien het verzoek om inlichtingen betrekking heeft op politiepersoneel, dat onder hem dient of onder hem
      gediend heeft;

      b. indien het verzoek om inlichtingen betrekking heeft op een persoon in dienst van het openbaar lichaam;

      c. indien, buiten het geval, waarin het verzoek om inlichtingen omtrent een bepaald persoon verband houdt met het
      vervullen van een bepaalde werkzaamheid, de gezaghebber gehouden is andere bestuursorganen te dienen van bericht
      en raad;

      d. indien, buiten het geval, waarin het verzoek om inlichtingen omtrent een bepaald persoon verband houdt met het
      vervullen van een bepaalde werkzaamheid, de gezaghebber optreedt als plaatselijk hoofd van politie.

      3 Een verklaring omtrent het gedrag houdt niet anders in dan dat de gezaghebber uit het onderzoek met betrekking
      tot het gedrag van de betrokkene ingesteld, gelet op het doel waarvoor de afgifte is gevraagd, niet is gebleken van
      bezwaren tegen die persoon. Onze Minister van Justitie stelt het model voor de verklaring vast, die behalve in het
      Nederlands ook in het Engels en in het Spaans kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0028258/2010-12-15#Artikel15
  - number: '16'
    text: |-
      De afgifte van een verklaring omtrent het gedrag geschiedt door de gezaghebber van het openbaar lichaam waar
      betrokkene in het bevolkingsregister is opgenomen, dan wel indien hij verblijft buiten Bonaire, Sint Eustatius of
      Saba, vóór zijn vertrek laatstelijk was opgenomen.
    url: https://wetten.overheid.nl/BWBR0028258/2010-12-15#Artikel16
  - number: '17'
    text: |-
      1 Het verzoek tot afgifte geschiedt schriftelijk.

      2 Het behelst de naam, de voornamen, de dag en het jaar van geboorte van de betrokkene, alsmede een omschrijving
      van het doel, waarvoor de afgifte van de verklaring wordt gevraagd. Indien het doel, waarvoor de afgifte wordt
      gevraagd, verband houdt met het vervullen van een bepaalde werkzaamheid, wordt bij het verzoekschrift overgelegd
      een geschrift van degene te wiens behoeve die werkzaamheid zal worden vervuld, waarin de aard dier werkzaamheden
      is vermeld.

      3 Onze Minister van Justitie stelt het model vast van een daartoe door de aanvrager in te vullen formulier.
    url: https://wetten.overheid.nl/BWBR0028258/2010-12-15#Artikel17
  - number: '18'
    text: |-
      1 Het verzoek tot afgifte van een verklaring omtrent het gedrag wordt gedaan door degene omtrent wiens gedrag een
      verklaring wordt gevraagd.

      2 Onze Minister van Justitie kan voor bijzondere gevallen een afwijkende regeling vaststellen. Alsdan moet in ieder
      geval ten genoege van de gezaghebber blijken, dat degene omtrent wiens gedrag een verklaring wordt gevraagd, met
      het verzoek instemt.
    url: https://wetten.overheid.nl/BWBR0028258/2010-12-15#Artikel18
  - number: '19'
    text: |-
      1 Onze Minister van Justitie kan doeleinden aanwijzen, welke een onderzoek naar het gedrag niet kunnen wettigen.

      2 De beschikking van Onze Minister van Justitie wordt bekendgemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0028258/2010-12-15#Artikel19
  - number: '20'
    text: |-
      1 De gezaghebber weigert het verzoek in behandeling te nemen, indien:

      1°. ingevolge [artikel 16][ref1] de gezaghebber van een ander openbaar lichaam tot de afgifte bevoegd is;

      2°. niet voldaan is aan het bepaalde in [artikel 17][ref2] of in, dan wel krachtens, [artikel 18][ref3];

      3°. de afgifte zou strijden met een beschikking als in het [voorgaande artikel][ref4] bedoeld, dan wel anderszins
      het doel, waarvoor de afgifte wordt gevraagd, het instellen van een onderzoek niet wettigt.

      2 Zodanige beslissing wordt onverwijld bij aangetekende brief aan de verzoeker medegedeeld, met vermelding van de
      reden der weigering en van de bevoegdheid als bedoeld in [artikel 21, eerste lid][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0028258#Artikel16
