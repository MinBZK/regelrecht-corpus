  - number: '3'
    text: |-
      1 Het strafblad vermeldt:

      1°. de personalia van de veroordeelde;

      2°. de rechter bij wiens onherroepelijk geworden uitspraak de straffen of maatregelen zijn bepaald;

      3°. de dagtekening van de uitspraak;

      4°. kwalificatie van het feit, waarvoor de veroordeling is uitgesproken met aanhaling van de daarbij betrokken
      strafbepalingen. De procureur-generaal kan bepalen, dat in daartoe aangewezen gevallen wordt volstaan met een korte
      aanduiding;

      5°. de opgelegde straffen of maatregelen;

      6°. de datum, waarop de uitspraak onherroepelijk is geworden;

      7°. indien gehele of gedeeltelijke gratie wordt verleend van de opgelegde straf, het daartoe strekkende koninklijk
      besluit; bij het verlenen van voorwaardelijke gratie, met vermelding van de duur van de proeftijd.

      2 Het strafblad vermeld tevens:

      1°. de bij een uitspraak of beslissing, krachtens welke een veroordeling, door een andere dan een rechter in
      het Gemeenschappelijk Hof van Justitie van Aruba, Curaçao, Sint Maarten en van Bonaire, Sint Eustatius en Saba
      gewezen, op Bonaire, Sint Eustatius en Saba kan worden ten uitvoer gelegd, opgelegde of uitvoerbaar geworden straf
      of maatregel;

      2°. de in een vreemde staat genomen beslissing als gevolg waarvan het recht tot tenuitvoerlegging op Bonaire,
      Sint Eustatius en Saba van een door de rechter van die staat gewezen veroordeling geheel of gedeeltelijk is komen
      te vervallen.

      3 Op de wijze door de procureur-generaal te bepalen wordt in de strafregisters aantekening gehouden van:

      1°. een last tot herroeping van een voorwaardelijke veroordeling;

      2°. een last tot verlenging van de proeftijd van een voorwaardelijke veroordeling;

      3°. een beschikking tot voorwaardelijke invrijheidstelling, met vermelding van de duur van de proeftijd;

      4°. een beschikking tot intrekking van de voorwaardelijke invrijheidstelling;

      5°. een bevel tot verlenging van de termijn van terbeschikkingstelling van de Regering;

      6°. een last tot verlenging van de proeftijd van een voorwaardelijke terbeschikkingstelling van de Regering;

      7°. een beschikking tot vervallenverklaring van een voorwaardelijke gratie.
    url: https://wetten.overheid.nl/BWBR0028258/2010-12-15#Artikel3
  - number: '4'
    text: |-
      Een strafblad wordt uit het strafregister verwijderd, indien na vernietiging van het gewijsde geen straf of
      maatregel wordt opgelegd.
    url: https://wetten.overheid.nl/BWBR0028258/2010-12-15#Artikel4
  - number: '5'
    text: |-
      1 Een strafblad wordt uit het strafregister verwijderd na verloop van een termijn van vier jaren.

      2 De termijn beloopt acht jaren, indien bij de veroordeling is opgelegd gevangenisstraf.

      3 Het voorgaande lid is niet van toepassing:

      a. indien de rechter met toepassing van [artikel 17a van het Wetboek van Strafrecht BES][ref1] heeft bepaald, dat
      de straf of straffen geheel niet zullen worden tenuitvoergelegd en een last tot herroeping voor het geheel of een
      deel niet is gegeven;

      b. indien de veroordeling een persoon betreft, die tijdens de uitspraak van het eindvonnis in eerste aanleg de
      leeftijd van achttien jaren nog niet heeft bereikt en de opgelegde straf de duur van drie maanden niet te boven
      gaat.

      4 Vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel17a
    url: https://wetten.overheid.nl/BWBR0028258/2010-12-15#Artikel5
    references:
