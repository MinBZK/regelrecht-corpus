  - number: 14h
    text: |-
      1 Onze Minister van Justitie kan voor de mededeling, bedoeld in de [artikelen 14a][ref1] en [14b][ref2], een
      vergoeding van kosten verlangen die niet hoger is dan een bij ministeriële regeling vast te stellen bedrag. Daarbij
      wordt tevens de wijze van betaling bepaald.

      2 De vergoeding wordt teruggegeven ingeval Onze Minister op verzoek van de betrokkene, of op bevel van de rechter
      tot verbetering, aanvulling, verwijdering of afscherming is overgegaan of wanneer het verzoek moet worden geweigerd
      op grond van [artikel 14d][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0028258#Artikel14a
      [ref2]: https://wetten.overheid.nl/BWBR0028258#Artikel14b
      [ref3]: https://wetten.overheid.nl/BWBR0028258#Artikel14d
