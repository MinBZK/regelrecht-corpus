  - number: '1'
    text: |-
      1 Er is een justitiële documentatiedienst, die belast is met het registreren van de door deze wet aangewezen
      justitiële gegevens.

      2 De registratie geschiedt, naar door deze wet gestelde regelen, in strafregisters en op strafkaarten.

      3 De leiding van de dienst berust bij Onze Minister van Justitie. De procureur-generaal is belast met het
      beheer van de strafregisters, en de officier van justitie met het beheer van de strafkaarten, ieder voor zijn
      bevoegdheidsgebied.

      4 Onze Minister van Justitie treft de nodige maatregelen opdat de gegevens, bedoeld in het tweede lid, gelet op de
      doeleinden waarvoor zij worden verwerkt, juist en nauwkeurig zijn. Hij verbetert of verwijdert de gegevens dan wel
      vult deze aan of schermt deze af indien hem blijkt dat deze onjuist of onvolledig zijn.
    url: https://wetten.overheid.nl/BWBR0028258/2010-12-15#Artikel1
  - number: '2'
    text: |-
      1 De strafregisters bestaan uit:

      a. strafbladen van de tegen natuurlijke personen gewezen onherroepelijke veroordelingen, waarbij, al dan niet
      tezamen met maatregelen, een of meer straffen zijn opgelegd, door rechters in het Gemeenschappelijk Hof van
      Justitie van Aruba, Curaçao, Sint Maarten en van Bonaire, Sint Eustatius en Saba gewezen:

      1°. wegens misdrijven;

      2°. wegens overtredingen, indien daarbij vrijheidsstraf – anders dan vervangende – is opgelegd, alsmede wegens
      overtreding van [artikel 474 van het Wetboek van Strafrecht BES][ref1];

      b. uittreksels van onherroepelijk geworden veroordelingen door andere dan rechters in het Gemeenschappelijk Hof van
      Justitie van Aruba, Curaçao, Sint Maarten en van Bonaire, Sint Eustatius en Saba gewezen, voorzover Onze Minister
      van Justitie daartoe een voorschrift heeft gegeven. Deze uittreksels worden voor de toepassing van deze wet met
      strafbladen gelijkgesteld.

      2 Met veroordeling wordt gelijkgesteld het in [artikel 39 van het Wetboek van Strafrecht BES][ref2] bedoelde bevel
      van de rechter, dat de schuldige ter beschikking van de Regering zal worden gesteld, teneinde van harentwege te
      worden verpleegd.

      3 Met veroordeling wordt mede gelijkgesteld het in [artikel 41 van het Wetboek van Strafrecht BES][ref3]
      bedoelde bevel van de rechter, dat de schuldige ter beschikking van de Regering zal worden gesteld,
      hetzij zonder toepassing van straf, hetzij tezamen met een veroordeling tot gevangenisstraf als bedoeld in
      [artikel 41ter van het Wetboek van Strafrecht BES][ref4].

      4 De strafregisters bestaan tevens uit de strafbladen van de omtrent natuurlijke personen gewezen onherroepelijke
      uitspraken of beslissingen krachtens welke tegen deze personen veroordelingen, door andere dan rechters in het
      Gemeenschappelijk Hof van Justitie van Aruba, Curaçao, Sint Maarten en van Bonaire, Sint Eustatius en Saba gewezen,
      op Bonaire, Sint Eustatius en Saba kunnen worden ten uitvoer gelegd, voor zover die veroordelingen zijn gewezen
      wegens feiten, die misdrijven opleveren, of ingevolge die uitspraken of beslissingen op Bonaire, Sint Eustatius en
      Saba vrijheidsstraf, anders dan vervangende, moet worden ondergaan. Betreft het een persoon die de leeftijd van 21
      jaar nog niet heeft bereikt, dan geldt het voorgaande eveneens indien ingevolge de bedoelde uitspraak of beslissing
      de in het derde lid genoemde straffen of maatregelen moeten worden ondergaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel474
