  - number: '25'
    text: |-
      1 De betrokkene kan binnen veertien dagen na ontvangst van de mededeling, bedoeld in
      [artikel 23, vijfde lid][ref1], daartegen een klaagschrift indienen bij het Gerecht in eerste aanleg van Bonaire,
      Sint Eustatius en Saba.

      2 Het klaagschrift wordt door betrokkene, zijn gemachtigde of zijn raadsman ondertekend en wordt in tweevoud
      ingediend.

      3 Het klaagschrift houdt in:

      a. de naam en de woonplaats van de betrokkene;

      b. een gekozen woonplaats binnen Bonaire, Sint Eustatius en Saba, indien de verzoeker daarbuiten woonplaats heeft;

      c. een duidelijke omschrijving van de beslissing van de gezaghebber, waartegen het klaagschrift is gericht, onder
      overlegging voor zoveel mogelijk van een afschrift van de beslissing.


      [ref1]: https://wetten.overheid.nl/BWBR0028258#Artikel23
    url: https://wetten.overheid.nl/BWBR0028258/2010-12-15#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0028258
        artikel: '23'
        paragraaf: '3'
  - number: '26'
    text: |-
      1 Het gerecht stelt binnen zeven dagen na ontvangst van het klaagschrift de dag vast, waartegen de betrokkene en de
      gezaghebber worden opgeroepen om te worden gehoord.

      2 De griffier doet de gezaghebber bij de oproeping een exemplaar van het klaagschrift toekomen.

      3 De gezaghebber doet onverwijld na ontvangst van de oproeping de bescheiden, op grond waarvan zijn beslissing is
      genomen, aan het gerecht overleggen.

      4 Het gerecht stelt het openbaar ministerie, de klager en zijn raadsman in de gelegenheid van de door de
      gezaghebber overgelegde bescheiden kennis te nemen.
    url: https://wetten.overheid.nl/BWBR0028258/2010-12-15#Artikel26
  - number: '27'
    text: |-
      1 Het openbaar ministerie wordt bij de behandeling van het klaagschrift gehoord.

      2 De betrokkene wordt in persoon gehoord. Hij kan zich doen vertegenwoordigen door een gemachtigde en zich doen
      bijstaan door een raadsman. Het gerecht kan weigeren bepaalde personen, die geen advocaat zijn, als gemachtigde toe
      te laten.

      3 De gezaghebber kan zich doen vertegenwoordigen. Hij kan zich doen bijstaan door een raadsman.

      4 Indien het gerecht dit in het belang van het onderzoek nodig oordeelt, hoort het getuigen. Het kan het openbaar
      ministerie bevelen de getuigen tegen een bepaalde dag te dagvaarden.

      5 Ieder die als getuige is gedagvaard, is verplicht voor het gerecht te verschijnen, de eed of de belofte te
      doen en getuigenis af te leggen, een en ander behoudens verschoning wegens ambts- of beroepsgeheim. Indien de
      getuige niet op de dagvaarding verschijnt, kan het gerecht hem andermaal doen dagvaarden en daarbij tevens zijn
      medebrenging gelasten.

      6 Degene, die als getuige is verschenen, ontvangt een vergoeding overeenkomstig het tarief van justitiekosten in
      strafzaken.

      7 Het gerecht kan door tussenkomst van instellingen, die werkzaam zijn op het gebied van de reclassering,
      inlichtingen omtrent de betrokkene inwinnen.
    url: https://wetten.overheid.nl/BWBR0028258/2010-12-15#Artikel27
  - number: '28'
    text: |-
      1 Het gerecht geeft binnen dertig dagen nadat het klaagschrift is ontvangen, zijn met redenen omklede beschikking,
      die de griffier onverwijld bij aangetekende brief of tegen ontvangstbewijs aan de betrokkene en aan de gezaghebber
      doet toekomen.

      2 De behandeling der zaak geschiedt in raadkamer.

      3 Tegen de beschikking van het gerecht staat hoger beroep niet open.
    url: https://wetten.overheid.nl/BWBR0028258/2010-12-15#Artikel28
  - number: '29'
    text: |-
      Wordt het klaagschrift gegrond verklaard, dan geeft de gezaghebber binnen drie dagen na ontvangst van de in het
      [voorgaande artikel][ref1] bedoelde brief de verklaring omtrent het gedrag af.


      [ref1]: https://wetten.overheid.nl/BWBR0028258#Artikel28
    url: https://wetten.overheid.nl/BWBR0028258/2010-12-15#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0028258
        artikel: '28'
        paragraaf: '4'
  - number: '30'
    text: |-
      In de gevallen ten aanzien waarvan vóór de inwerkingtreding van deze wet voorschriften zijn gegeven over de afgifte
      of de overlegging van een bewijs van goed gedrag of een verklaring van overeenkomstige strekking, worden deze
      bewijzen of verklaringen, onder de benaming verklaring omtrent het gedrag, bij uitsluiting door de gezaghebber
      overeenkomstig de bepalingen van deze wet afgegeven. De bepalingen betreffende deze bewijzen of verklaringen in
      bedoelde voorschriften blijven buiten toepassing.
    url: https://wetten.overheid.nl/BWBR0028258/2010-12-15#Artikel30
  - number: '31'
    text: |-
      1 Behoudens de gevallen, waarin met betrekking tot de uitvoering van een wettelijk voorschrift, mededeling
      is toegelaten, is een ieder verplicht tot geheimhouding van de gegevens, die hem met betrekking tot een derde
      ingevolge deze wet ter kennis zijn gekomen.

      2 Opzettelijke schending van de in het eerste lid bedoelde verplichting is een misdrijf en wordt gestraft met
      gevangenisstraf van ten hoogste zes maanden of geldboete van de tweede categorie.

      3 Hij aan wiens schuld te wijten is, dat een verplichting tot geheimhouding als bedoeld in het eerste lid van dit
      artikel wordt geschonden, wordt gestraft met hechtenis van ten hoogste twee maanden of geldboete van de eerste
      categorie.

      Dit feit wordt beschouwd als een overtreding.
    url: https://wetten.overheid.nl/BWBR0028258/2010-12-15#Artikel31
  - number: '32'
    text: |-
      De verklaring omtrent het gedrag en het in [artikel 17][ref1] bedoelde formulier zijn vrij van zegel. Onze Minister
      van Justitie bepaalt het bedrag, dat ten bate van ’s Rijks kas geheven wordt voor de afgifte van een verklaring
      omtrent het gedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0028258#Artikel17
    url: https://wetten.overheid.nl/BWBR0028258/2010-12-15#Artikel32
