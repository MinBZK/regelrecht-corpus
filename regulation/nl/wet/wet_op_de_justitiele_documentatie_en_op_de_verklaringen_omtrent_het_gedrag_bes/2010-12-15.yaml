        artikel: '12'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0028258
        artikel: '13'
        paragraaf: '4'
  - number: 14c
    text: |-
      1 Bij de behandeling van verzoeken als bedoeld in [artikelen 14a][ref1] en [14b][ref2], draagt Onze Minister van
      Justitie zorg voor een deugdelijke vaststelling van de identiteit van de verzoeker.

      2 De verzoeken worden ten aanzien van minderjarigen die de leeftijd van zestien jaren nog niet hebben bereikt, en
      ten aanzien van onder curatele gestelden gedaan door hun wettelijke vertegenwoordigers. De betrokken mededeling
      geschiedt eveneens aan de wettelijke vertegenwoordigers.

      3 De verzoeken kunnen tevens worden gedaan door een advocaat aan wie de betrokkene een bijzondere machtiging heeft
      verleend met het oog op de uitoefening van zijn rechten krachtens deze wet en die het verzoek uitsluitend doet
      met de bedoeling de belangen van zijn cliënt te behartigen. De betrokken mededeling geschiedt aan de advocaat. Bij
      ministeriële regeling kunnen aan de bijzondere machtiging nadere eisen worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028258#Artikel14a
      [ref2]: https://wetten.overheid.nl/BWBR0028258#Artikel14b
    url: https://wetten.overheid.nl/BWBR0028258/2010-12-15#Artikel14c
    references:
      - id: ref1
        bwb_id: BWBR0028258
        artikel: 14a
      - id: ref2
        bwb_id: BWBR0028258
        artikel: 14b
  - number: 14d
    text: |-
      Een mededeling als bedoeld in de [artikelen 14a][ref1] en [14b][ref2] blijft achterwege voor zover dit noodzakelijk
      is in het belang van:

      a. de veiligheid van de staat,

      b. het voorkomen, opsporen en vervolgen van strafbare feiten,

      c. het toezicht op de naleving van wettelijke voorschriften die zijn gesteld ten behoeve van de belangen, bedoeld
      onder b, of

      d. de bescherming van de betrokkene of van de rechten en vrijheden van anderen.


      [ref1]: https://wetten.overheid.nl/BWBR0028258#Artikel14a
      [ref2]: https://wetten.overheid.nl/BWBR0028258#Artikel14b
    url: https://wetten.overheid.nl/BWBR0028258/2010-12-15#Artikel14d
    references:
      - id: ref1
        bwb_id: BWBR0028258
        artikel: 14a
      - id: ref2
        bwb_id: BWBR0028258
        artikel: 14b
  - number: 14e
    text: |-
      1 Degene aan wie overeenkomstig [artikel 14b][ref1] kennis is gegeven van hem betreffende inlichtingen, kan
      Onze Minister van Justitie schriftelijk verzoeken om deze te verbeteren, aan te vullen, te verwijderen of af
      te schermen, indien deze feitelijk onjuist zijn, voor het doel van de verwerking onvolledig of niet ter zake
      dienend zijn dan wel in strijd met een wettelijk voorschrift zijn verwerkt. Het verzoek bevat de aan te brengen
      wijzigingen.

      2 Onze Minister van Justitie bericht de verzoeker binnen vier weken na ontvangst
      van het verzoek schriftelijk of, dan wel in hoeverre, hij daaraan voldoet.
      [Artikel 29, eerste lid, van de Wet bescherming persoonsgegevens BES][ref2] is van overeenkomstige toepassing.

      3 Onze Minister van Justitie draagt zorg dat een beslissing tot verbetering, aanvulling, verwijdering of
      afscherming zo spoedig mogelijk wordt uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0028258#Artikel14b
      [ref2]: https://wetten.overheid.nl/BWBR0028067#Artikel29
    url: https://wetten.overheid.nl/BWBR0028258/2010-12-15#Artikel14e
    references:
      - id: ref1
        bwb_id: BWBR0028258
        artikel: 14b
      - id: ref2
        bwb_id: BWBR0028067
        artikel: '29'
  - number: 14f
    text: |-
      Een schriftelijke beslissing op een verzoek als bedoeld in de [artikelen 14a][ref1], [14b][ref2] of [14e][ref3]
      geldt als een beschikking, bedoeld in [artikel 3 van de Wet administratieve rechtspraak BES][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0028258#Artikel14a
      [ref2]: https://wetten.overheid.nl/BWBR0028258#Artikel14b
      [ref3]: https://wetten.overheid.nl/BWBR0028258#Artikel14e
      [ref4]: https://wetten.overheid.nl/BWBR0028455#Artikel3
