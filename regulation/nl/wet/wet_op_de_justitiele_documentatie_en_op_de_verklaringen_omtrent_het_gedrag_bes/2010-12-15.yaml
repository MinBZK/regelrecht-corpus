  - number: '21'
    text: |-
      1 De verzoeker kan binnen zeven dagen na ontvangst van de in het [voorgaande artikel][ref1] bedoelde mededeling
      tegen de beslissing bij Onze Minister van Justitie voorziening vragen.

      2 Onze Minister van Justitie beslist binnen tien dagen of het verzoek al dan niet in verdere behandeling moet
      worden genomen. Zijn beslissing wordt onverwijld medegedeeld aan de betrokken gezaghebber en, bij aangetekende
      brief, aan de verzoeker.


      [ref1]: https://wetten.overheid.nl/BWBR0028258#Artikel20
    url: https://wetten.overheid.nl/BWBR0028258/2010-12-15#Artikel21
