        bwb_id: BWBR0028570
        artikel: 17a
  - number: '6'
    text: |-
      De termijn, in het [voorgaande artikel][ref1] bedoeld, vangt aan op de dag na die, waarop de uitspraak
      onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0028258#Artikel5
    url: https://wetten.overheid.nl/BWBR0028258/2010-12-15#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0028258
        artikel: '5'
        paragraaf: '2'
  - number: '7'
    text: |-
      1 De in [artikel 5][ref1] bedoelde termijn wordt verlengd met de bij de uitspraak bepaalde duur van de opgelegde
      vrijheidsstraf met uitzondering van de straf of het gedeelte daarvan ten aanzien waarvan de rechter heeft bepaald
      dat het niet zal worden tenuitvoergelegd en een last tot herroeping niet is gegeven.

      2 De termijn wordt mede verlengd met de duur van de verlenging van de proeftijd van een voorwaardelijke
      veroordeling, met de duur van de verlenging van de termijn van terbeschikkingstelling van de Regering of
      van de proeftijd van een voorwaardelijke terbeschikkingstelling van de Regering; indien het bevel dat de
      terbeschikkingstelling niet zal worden tenuitvoergelegd, wordt herroepen, wordt de termijn tevens verlengd met de
      duur van de terbeschikkingstelling van de Regering.

      3 De termijn loopt niet in de tijd gedurende welke de veroordeelde uit het gesticht of de inrichting, waarin
      hij zijn straf of maatregel ondergaat, ontvlucht is, of gedurende welke hij zich aan de tenuitvoerlegging heeft
      onttrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0028258#Artikel5
    url: https://wetten.overheid.nl/BWBR0028258/2010-12-15#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0028258
        artikel: '5'
        paragraaf: '2'
  - number: '8'
    text: |-
      1 Een strafblad wordt niet verwijderd zolang nog enig ander strafblad ten aanzien van de veroordeelde in het
      strafregister blijft geplaatst.

      2 Indien de veroordeelde vóór afloop van de in [artikel 5][ref1] bedoelde termijn opnieuw wordt vervolgd of zal
      worden vervolgd, kan het gerecht, voor hetwelk de zaak wordt vervolgd, of zal worden vervolgd, op vordering van het
      openbaar ministerie gelasten, dat het strafblad niet wordt verwijderd alvorens over die strafzaak onherroepelijk
      is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0028258#Artikel5
    url: https://wetten.overheid.nl/BWBR0028258/2010-12-15#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0028258
        artikel: '5'
        paragraaf: '2'
  - number: 8a
    text: |-
      In geval van tenuitvoerlegging op Bonaire, Sint Eustatius of Saba van een veroordeling, door een andere dan de
      rechter in het Gemeenschappelijk Hof van Justitie van Aruba, Curaçao, Sint Maarten en van Bonaire, Sint Eustatius
      en Saba gewezen, vangt de in [artikel 5][ref1] bedoelde termijn aan op de dag na die waarop die veroordeling
      onherroepelijk is geworden. De duur van de termijn wordt bepaald aan de hand van de bij de uitspraak of beslissing,
      krachtens welke de bovenbedoelde veroordeling op Bonaire, Sint Eustatius en Saba kan worden ten uitvoer gelegd,
      opgelegde of uitvoerbaar geworden straf of maatregel.


      [ref1]: https://wetten.overheid.nl/BWBR0028258#Artikel5
    url: https://wetten.overheid.nl/BWBR0028258/2010-12-15#Artikel8a
    references:
