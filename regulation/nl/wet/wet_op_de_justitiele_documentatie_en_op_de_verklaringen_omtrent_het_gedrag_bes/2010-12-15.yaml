        artikel: '3'
  - number: 14g
    text: |-
      1 Indien een verbetering, aanvulling, verwijdering of afscherming als bedoeld in [artikel 14e][ref1] is uitgevoerd,
      doet Onze Minister van Justitie het aan de personen of instanties, bedoeld in de [artikelen 12][ref2] en [13][ref3]
      in het jaar voorafgaand aan het verzoek en in de sinds dat verzoek verstreken periode de betrokken inlichtingen
      zijn verstrekt, zo spoedig mogelijk mededeling van deze verbetering, aanvulling, verwijdering of afscherming,
      tenzij dit onmogelijk blijkt of een onevenredige inspanning kost.

      2 Onze Minister van Justitie deelt aan de verzoeker en voor zover van toepassing aan de wettelijk vertegenwoordiger
      desgevraagd mede aan wie hij de mededeling heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028258#Artikel14e
      [ref2]: https://wetten.overheid.nl/BWBR0028258#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0028258#Artikel13
