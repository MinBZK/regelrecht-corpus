        artikel: '5'
        paragraaf: '2'
  - number: '9'
    text: |-
      Alle bij het parket van de officier van justitie binnengekomen processen-verbaal of politiële rapporten betreffende
      een persoon, worden geregistreerd op een ten name van die persoon gestelde strafkaart.
    url: https://wetten.overheid.nl/BWBR0028258/2010-12-15#Artikel9
  - number: '10'
    text: |-
      1 Op de wijze door Onze Minister van Justitie te bepalen worden op de strafkaart de volgende gegevens
      geregistreerd:

      1°. de personalia van degene ten wiens name de strafkaart gesteld is;

      2°. het registratienummer van het proces-verbaal of politieel rapport;

      3°. de datum van het strafbaar feit of van het feit, waaromtrent een politieel rapport is opgemaakt;

      4°. een korte aanduiding van het strafbaar feit of van het feit, waaromtrent een politieel rapport is opgemaakt;

      5°. de wijze van afdoening van het proces-verbaal of het politieel rapport, met vermelding van de datum;

      6°. een korte aanduiding van het eindresultaat;

      7°. al hetgeen voorts in het belang van een goede rechtsbedeling nodig is.

      2 Het model van de strafkaart zal door Onze Minister van Justitie worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028258/2010-12-15#Artikel10
  - number: '11'
    text: |-
      Een strafkaart wordt vernietigd:

      a. indien de daarop geregistreerde strafbare feiten overtredingen zijn en vijf jaren zijn verstreken sedert de
      datum, waarop de desbetreffende zaken zijn afgedaan, zonder dat een nieuw proces-verbaal of politieel rapport is
      geregistreerd;

      b. indien de daarop geregistreerde feiten misdrijven zijn, die gestraft zijn met een geldboete van niet meer dan
      USD 28, terwijl er acht jaren zijn verstreken sinds de dag van het eindvonnis, zonder dat er een nieuw proces-
      verbaal of politieel rapport is geregistreerd;

      c. indien de verdachte ter zake van de daarop geregistreerde strafbare feiten is vrijgesproken dan wel indien het
      openbaar ministerie besloten heeft de zaak niet te vervolgen en twee jaren zijn verstreken sedert de datum van het
      eindvonnis onderscheidenlijk de beslissing tot niet-vervolging;

      d. indien betrokkene is overleden;

      e. indien de geboortedatum van betrokkene tachtig jaar of langer in het verleden ligt.
    url: https://wetten.overheid.nl/BWBR0028258/2010-12-15#Artikel11
  - number: '12'
    text: |-
      1 Onze Minister van Justitie verstrekt inlichtingen uit het strafkaartsysteem en de strafregisters aan:

      a. rechters in het Gemeenschappelijk Hof van Justitie van Aruba, Curaçao, Sint Maarten en van Bonaire, Sint
      Eustatius en Saba, en andere rechterlijke ambtenaren buiten de zittingsplaatsen van het Gemeenschappelijk
      Hof van Justitie van Aruba, Curaçao, Sint Maarten en van Bonaire, Sint Eustatius en Saba, ten behoeve van de
      strafrechtspleging;

      b. de gezaghebbers van de openbare lichamen.

      2 De op grond van het voorgaande lid verkregen gegevens mogen uitsluitend ten behoeve der justitie worden gebruikt.

      3 Onze Minister van Justitie verstrekt voorts inlichtingen uit het strafkaartsysteem en de strafregisters aan
      bij ministeriële regeling aan te wijzen instellingen, die werkzaam zijn op het gebied van de reclassering en
      kinderbescherming, alsmede aan bij ministeriële regeling aan te wijzen psychiaters en psychologen, en aan de
      secretarissen van de voogdijraden, in die gevallen waarin dit nodig is voor het voorbereiden van enig rapport of
      het uitoefenen van enig toezicht.

      4 Tot het geven van inlichtingen als in dit artikel bedoeld is bevoegd de procureur-generaal en – voor zover
      betreft het strafkaartsysteem – mede de officier van justitie.
    url: https://wetten.overheid.nl/BWBR0028258/2010-12-15#Artikel12
  - number: '13'
    text: |-
      1 Voor zover dit noodzakelijk is met het oog op een zwaarwegend algemeen belang en voor de goede taakuitoefening
      van degene aan wie inlichtingen uit het strafkaartsysteem en de strafregisters worden verstrekt, kunnen bij
      ministeriële regeling personen of instanties die met een publieke taak zijn belast, worden aangewezen aan wie
      bedoelde inlichtingen worden verstrekt. Daarbij kunnen nadere voorschriften worden gegeven in verband met de
      verwerking en verdere verwerking.

      2 De inlichtingen worden niet voor een ander doel gebruikt dan waarvoor zij zijn verstrekt, tenzij bij wettelijk
      voorschrift anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0028258/2010-12-15#Artikel13
  - number: '14'
    text: |-
      1 Onze Minister van Justitie verstrekt aan de gezaghebbers uittreksels uit de strafregisters ten dienste van de
      afgifte van de verklaringen omtrent het gedrag.

      2 De afgifte van deze uittreksels geschiedt door of namens de procureur-generaal.
    url: https://wetten.overheid.nl/BWBR0028258/2010-12-15#Artikel14
  - number: 14a
    text: |-
      1 Onze Minister van Justitie deelt een ieder op diens verzoek binnen vier weken mede of en zo ja welke gegevens
      deze persoon betreffende in de strafregisters zijn vastgelegd.

      2 De mededeling, bedoeld in het eerste lid, wordt niet gedaan in schriftelijke vorm, tenzij het betreft een
      weigering om mededeling te doen.

      3 Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent het verzoek en de wijze van kennisneming.
    url: https://wetten.overheid.nl/BWBR0028258/2010-12-15#Artikel14a
  - number: 14b
    text: |-
      1 Elke verstrekking van inlichtingen op grond van de [artikelen 12][ref1] en [13][ref2] wordt vastgelegd en
      gedurende ten minste een jaar bewaard.

      2 Onze Minister van Justitie deelt een ieder op diens verzoek schriftelijk binnen vier weken mede of hem
      betreffende inlichtingen in het jaar voorafgaande aan het verzoek, zijn verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0028258#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0028258#Artikel13
    url: https://wetten.overheid.nl/BWBR0028258/2010-12-15#Artikel14b
