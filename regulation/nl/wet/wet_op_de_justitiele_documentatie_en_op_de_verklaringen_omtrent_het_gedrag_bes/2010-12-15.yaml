        artikel: '17'
        paragraaf: '1'
  - number: '33'
    text: 'Deze wet wordt aangehaald als: Wet op de justitiële documentatie en op de verklaringen omtrent het gedrag BES.'
    url: https://wetten.overheid.nl/BWBR0028258/2010-12-15#Artikel33
