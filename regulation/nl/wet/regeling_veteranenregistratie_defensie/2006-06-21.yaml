articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. veteraan: de gewezen militair met de Nederlandse nationaliteit die het Koninkrijk der Nederlanden heeft gediend
      in oorlogsomstandigheden of daarmee overeenkomende situaties, inbegrepen internationale vredesmissies binnen en
      buiten het verband van de Verenigde Naties, alsmede personeel van voormalige gouvernementele krijgsmachten dat
      onder oorlogsomstandigheden of in internationale vredesmissies heeft gediend en het gemilitariseerde vaarplichtige
      koopvaardijpersoneel uit de Tweede Wereldoorlog;

      b. veteranenregistratie: de veteranenregistratie, bedoeld in [artikel 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019956#Artikel2
    url: https://wetten.overheid.nl/BWBR0019956/2006-06-21#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0019956
        artikel: '2'
  - number: '2'
    text: |-
      1 De Minister van Defensie houdt een veteranenregistratie bij, waarin persoonsgegevens van veteranen worden
      verwerkt.

      2 De verwerking van persoonsgegevens in de veteranenregistratie vindt plaats bij het DienstenCentrum Human
      Resources te Enschede.

      3 De verwerking van persoonsgegevens in de veteranenregistratie geschiedt slechts voor:

      a. het onderhouden van contacten met de betrokken veteraan;

      b. het verzenden van informatie aan de betrokken veteraan.
    url: https://wetten.overheid.nl/BWBR0019956/2006-06-21#Artikel2
  - number: '3'
    text: |-
      In de veteranenregistratie worden geen andere persoonsgegevens verwerkt dan:

      a. naam, voornamen, voorletters, rang, titulatuur, geslacht, geboortedatum, adres, postcode, woonplaats,
      telefoonnummer en soortgelijke voor communicatie benodigde gegevens;

      b. een administratienummer dat geen andere informatie bevat dan bedoeld onder a;

      c. gegevens betreffende de functie waarin en de periode gedurende welke de veteraan deel uitmakend van of ten
      behoeve van de krijgsmacht werkzaam is geweest.
    url: https://wetten.overheid.nl/BWBR0019956/2006-06-21#Artikel3
  - number: '4'
    text: |-
      De persoonsgegevens worden slechts verstrekt aan:

      a. degenen, waaronder begrepen derden, die zijn belast met of leiding geven aan de in [artikel 2, derde lid][ref1],
      bedoelde activiteiten of die daarbij noodzakelijk zijn betrokken;

      b. anderen, in de gevallen bedoeld in [artikel 8, onder a, c en d][ref2], en
      [artikel 9, derde lid, van de Wet bescherming persoonsgegevens][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0019956#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011468#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0011468#Artikel9
    url: https://wetten.overheid.nl/BWBR0019956/2006-06-21#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0019956
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0011468
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0011468
        artikel: '9'
  - number: '5'
    text: |-
      De persoonsgegevens van de veteraan worden uit de veteranenregistratie verwijderd op een daartoe strekkend verzoek
      van de veteraan of bij diens overlijden.
    url: https://wetten.overheid.nl/BWBR0019956/2006-06-21#Artikel5
  - number: '6'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0019956/2006-06-21#Artikel6
  - number: '7'
    text: 'Deze regeling wordt aangehaald als: Regeling veteranenregistratie Defensie.'
    url: https://wetten.overheid.nl/BWBR0019956/2006-06-21#Artikel7
