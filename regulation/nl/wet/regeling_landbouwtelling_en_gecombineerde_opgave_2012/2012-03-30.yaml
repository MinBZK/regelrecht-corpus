articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. *Dienst Regelingen:* Dienst Regelingen van het Ministerie van Economische Zaken, Landbouw en Innovatie;

      b. *beschrijvingsbiljet:* formulier, waarvan het model als [bijlagen I tot en met VII][ref1] bij deze regeling
      is opgenomen;

      c. *opgaveplichtige:* persoon die, anders dan in het kader van de teelt van griendhout, riet en biezen, in de
      landbouw zijn hoofdbestaan of een gedeelte van zijn bestaan vindt, voor zover aan hem een beschrijvingsbiljet,
      bedoeld in onderdeel b, dan wel anderszins een oproep voor de landbouwtelling is uitgereikt of toegezonden;

      d. *probleemgebiedenvergoeding:* betaling als bedoeld in artikel 36, onderdeel a, subonderdelen i) en ii), van
      Verordening (EG) Nr. 1698/2005 van de Raad van 20 september 2005 inzake steun voor plattelandsontwikkeling uit het
      Europees Landbouwfonds voor Plattelandsontwikkeling (ELFPO) (PbEU L 277);

      e. *minister:* Minister van Economische Zaken, Landbouw en Innovatie.


      [ref1]: https://wetten.overheid.nl/BWBR0031402
    url: https://wetten.overheid.nl/BWBR0031402/2012-03-30#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0031402
  - number: '2'
    text: |-
      In het tijdvak dat loopt van 1 april 2012 tot en met 15 mei 2012 wordt een landbouwtelling gehouden als bedoeld in
      de [artikelen 24][ref1] en [25 van de Landbouwwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002252#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0002252#Artikel25
    url: https://wetten.overheid.nl/BWBR0031402/2012-03-30#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002252
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0002252
        artikel: '25'
  - number: '3'
    text: |-
      Ten behoeve van de telling, bedoeld in [artikel 2][ref1], wordt door de minister aan landbouwers een oproep
      uitgereikt of toegezonden tot deelname aan de landbouwtelling.

      Voor de toepassing van [artikel 24 van de Landbouwwet][ref2] geldt de uitreiking of toezending van deze oproep als
      uitreiking of toezending van het beschrijvingsbiljet, bedoeld in dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0031402#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002252#Artikel24
    url: https://wetten.overheid.nl/BWBR0031402/2012-03-30#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0031402
        artikel: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002252
        artikel: '24'
  - number: '4'
    text: |-
      1 De opgaveplichtige verstrekt de ten aanzien van de veestapel gevraagde gegevens naar de toestand op 1 april 2012.

      2 De opgaveplichtige verstrekt de ten aanzien van de oppervlakten gevraagde gegevens naar de verwachte toestand
      op 15 mei 2012. Indien een beteelde oppervlakte op 15 mei 2012 nog niet zal zijn beteeld, wordt de eerstvolgende
      geplande teelt opgegeven.

      3 Onverminderd het eerste en tweede lid, verstrekt de opgaveplichtige de op het beschrijvingsbiljet gevraagde
      gegevens naar de toestand op de datum van verzending, tenzij op het biljet anders is aangegeven, en neemt daarbij
      de overige op het biljet of door Dienst Regelingen gegeven aanwijzingen in acht.
    url: https://wetten.overheid.nl/BWBR0031402/2012-03-30#Artikel4
  - number: '5'
    text: |-
      1 De bedrijfsomvang wordt bepaald op basis van de totale standaardopbrengst van het bedrijf. Deze omvang wordt
      uitgedrukt in euro's.

      2 De standaardopbrengst wordt vastgesteld met inachtneming van [bijlage VIII][ref1] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0031402
    url: https://wetten.overheid.nl/BWBR0031402/2012-03-30#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0031402
  - number: '6'
    text: |-
      Onverminderd het bepaalde in [artikel 4][ref1] maakt de opgaveplichtige die tevens gehouden is:

      a. gegevens te verstrekken met betrekking tot aanvragen op grond van de bedrijfstoeslagregeling als opgenomen
      in [hoofdstuk 2 van de Regeling GLB-inkomenssteun 2006][ref2] en de specifieke steunregelingen als opgenomen in
      [hoofdstuk 2a van de Regeling GLB-inkomenssteun 2006][ref3],

      b. gegevens te verstrekken als bedoeld in [artikel 26, eerste lid, van het Uitvoeringsbesluit Meststoffenwet][ref4],

      c. gegevens te verstrekken met betrekking tot de aanvraag voor probleemgebiedenvergoeding, of

      d. gegevens te verstrekken met betrekking tot betaalverzoeken op grond van de Subsidieverordening natuur- en
      landschapsbeheer van de onderscheiden provincies,

      voor het verstrekken van alle onderscheiden gegevens gebruik van het beschrijvingsbiljet.


      [ref1]: https://wetten.overheid.nl/BWBR0031402#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0019131#Hoofdstuk2
      [ref3]: https://wetten.overheid.nl/BWBR0019131#Hoofdstuk2a
      [ref4]: https://wetten.overheid.nl/BWBR0019031#Artikel26
    url: https://wetten.overheid.nl/BWBR0031402/2012-03-30#Artikel6
    references:
      - id: ref1
