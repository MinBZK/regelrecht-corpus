preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is om te voorzien in wettelijke regels om het
    Protocol van Nagoya inzake toegang tot genetische rijkdommen en de eerlijke en billijke verdeling van voordelen
    voortvloeiende uit hun gebruik bij het Verdrag inzake biologische diversiteit te implementeren en uitvoering te
    geven aan ter zake geldende verordeningen van de Europese Unie.

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0037150/2019-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *EU-verordeningen inzake genetische rijkdommen:* verordeningen als bedoeld in artikel 288 van het Verdrag
      betreffende de werking van de Europese Unie die betrekking hebben op de toegang tot genetische rijkdommen en de
      eerlijke en billijke verdeling van voordelen voortvloeiende uit hun gebruik, waaronder in ieder geval Verordening
      (EU) nr. 511/2014 van het Europees parlement en de Raad van 16 april 2014 betreffende voor gebruikers bestemde
      nalevingsmaatregelen uit het Protocol van Nagoya inzake toegang tot genetische rijkdommen en de eerlijke en
      billijke verdeling van voordelen voortvloeiende uit hun gebruik in de Unie (PbEU 2014, 150) en verordeningen die
      daarop berusten;
        - *Nagoya Protocol:* op 29 oktober 2010 te Nagoya tot stand gekomen Protocol van Nagoya inzake toegang tot
      genetische rijkdommen en de eerlijke en billijke verdeling van voordelen voortvloeiende uit hun gebruik bij het
      Verdrag inzake biologische diversiteit (Trb. 2012, 16 en Trb. 2012, 244);
        - *Onze Minister:* Onze Minister van Landbouw, Natuur en Voedselkwaliteit.
    url: https://wetten.overheid.nl/BWBR0037150/2019-01-01#Artikel1
  - number: '2'
    text: |-
      1 Het is verboden in strijd te handelen met bij ministeriële regeling aangewezen voorschriften van EU-verordeningen
      inzake genetische rijkdommen.

      2 Bij ministeriële regeling worden regels gesteld ter uitvoering van onderdelen van EU-verordeningen inzake
      genetische rijkdommen die geen beoordelingsruimte laten, of die betrekking hebben op de wijze waarop aanvragen en
      documenten worden ingediend.

      3 Onverminderd het eerste en tweede lid, kunnen bij of krachtens algemene maatregel van bestuur ter uitvoering
      van het Nagoya Protocol en EU-verordeningen inzake genetische rijkdommen regels worden gesteld met betrekking tot
      de toegang tot genetische rijkdommen en de eerlijke en billijke verdeling van voordelen voortvloeiende uit hun
      gebruik.
    url: https://wetten.overheid.nl/BWBR0037150/2019-01-01#Artikel2
  - number: '3'
    text: |-
      Onze Minister kan ontheffing of vrijstelling verlenen van het bepaalde bij of krachtens [artikel 2][ref1],
      overeenkomstig de voorwaarden en beperkingen die in voorkomend geval voortvloeien uit het Nagoya Protocol of EU-
      verordeningen inzake genetische rijkdommen.


      [ref1]: https://wetten.overheid.nl/BWBR0037150#Artikel2
    url: https://wetten.overheid.nl/BWBR0037150/2019-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0037150
        artikel: '2'
  - number: '4'
    text: |-
      1 Onze Minister wijst een nationaal contactpunt voor toegang en verdeling van voordelen als bedoeld in artikel 13,
      eerste lid, van het Nagoya Protocol aan.

      2 Onze Minister is de bevoegde nationale instantie voor toegang en verdeling van voordelen als bedoeld in artikel
      13, tweede lid, van het Nagoya Protocol.

      3 Onze Minister is de bevoegde instantie belast met de uitvoering van EU-verordeningen inzake genetische
      rijkdommen, indien deze verplichten tot het aanwijzen van een bevoegde instantie, tenzij Onze Minister een andere
      bevoegde instantie heeft aangewezen.

      4 Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast:

      a. de bij besluit van Onze Minister aangewezen ambtenaren;

      b. de door Onze Minister van Veiligheid en Justitie op grond van
      [artikel 17 van de Wet op de economische delicten][ref1] met de opsporing van de bij of krachtens deze wet
      strafbaar gestelde feiten belaste ambtenaren.

      5 Van een besluit als bedoeld in het vierde lid, onderdeel a, wordt mededeling gedaan door plaatsing in de
      Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel17
    url: https://wetten.overheid.nl/BWBR0037150/2019-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002063
        artikel: '17'
  - number: '5'
    text: |-
      Onze Minister is bevoegd tot het opleggen van een last onder bestuursdwang ter handhaving van het bepaalde bij of
      krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0037150/2019-01-01#Artikel5
  - number: '6'
    text: |-
      1 Onverminderd [artikel 5][ref1] en [artikel 117 van het Wetboek van Strafvordering][ref2] kan Onze Minister
      overeenkomstig de toepasselijke EU-verordeningen inzake genetische rijkdommen onmiddellijke tijdelijke maatregelen
      treffen ten aanzien van gebruikers die handelen in strijd met het bepaalde bij of krachtens deze wet. Deze
      maatregelen kunnen inhouden het in bewaring nemen van genetische rijkdommen of daaruit ontwikkelde producten, of
      een besluit houdende oplegging van:

      a. een verbod tot het vervoeren, be- of verwerken of in het verkeer brengen van genetische rijkdommen of daaruit
      ontwikkelde producten;

      b. een verbod op het verdere gebruik van genetische rijkdommen of daaruit ontwikkelde producten;

      c. de verplichting tot tijdelijke opslag van genetische rijkdommen of daaruit ontwikkelde producten;

      d. de verplichting om houders, dan wel vermoedelijke houders van de genetische rijkdommen of daaruit ontwikkelde
      producten onverwijld en op doeltreffende wijze op de hoogte te stellen van het feit dat de rijkdommen niet in
      overeenstemming met het bij of krachtens deze wet bepaalde zijn verworven;

      e. de verplichting tot terugzending naar het land dat de genetische rijkdommen heeft geleverd;

      f. de verplichting om de genetische rijkdommen of de daaruit ontwikkelde producten die in het verkeer zijn gebracht
      terug te halen of centraal op te slaan;

      g. de verplichting tot het identificeren en registreren van de genetische rijkdommen.

      2 De kosten van de in het eerste lid bedoelde maatregelen komen ten laste van degene die verantwoordelijk is voor
      de toegang tot of het gebruik van de genetische rijkdommen, de eigenaar daarvan, of de gemachtigde van een of meer
      van deze personen. Bij gebreke van volledige betaling binnen de door hem gestelde termijn kan Onze Minister het
      verschuldigde bedrag invorderen bij dwangbevel.

      3 De in het eerste lid bedoelde besluiten kunnen onder voorwaarden of beperkingen worden genomen. Aan de bij
      besluit opgelegde verplichtingen kunnen voorschriften worden verbonden.

      4 Het is verboden in strijd te handelen met een besluit als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel117
    url: https://wetten.overheid.nl/BWBR0037150/2019-01-01#Artikel6
    references:
