  - number: '2'
    text: |-
      Het vaststellen van geringe, matige of ernstige smog vindt plaats door het RIVM
      overeenkomstig [artikel 3, eerste lid][ref1], en de [paragrafen 3.1 tot en met 3.6][ref2] en
      [3.10 van de Regeling beoordeling luchtkwaliteit 2007][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0022817#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022817#Paragraaf3.1
      [ref3]: https://wetten.overheid.nl/BWBR0022817#Paragraaf3.10
    url: https://wetten.overheid.nl/BWBR0027705/2016-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0022817
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0022817
        paragraaf: '3.1'
      - id: ref3
        bwb_id: BWBR0022817
        paragraaf: '3.10'
  - number: '3.1'
    text: |-
      Het RIVM stelt basisinformatie over zwaveldioxide, stikstofdioxide, ozon en zwevende deeltjes (PM) beschikbaar op
      www.lml.rivm.nl en zo mogelijk via andere landelijke media, zoals NOS Teletekst.
    url: https://wetten.overheid.nl/BWBR0027705/2016-07-01#Artikel3
  - number: '3.2'
    text: 'Basisinformatie als bedoeld in het eerste lid omvat ten minste:'
    url: https://wetten.overheid.nl/BWBR0027705/2016-07-01#Artikel3
  - number: 3.2.a
    text: |-
      een beschrijving van het ontstaan van concentraties van zwaveldioxide, stikstofdioxide, ozon en zwevende deeltjes
      (PM) in de buitenlucht;
    url: https://wetten.overheid.nl/BWBR0027705/2016-07-01#Artikel3
  - number: 3.2.b
    text: |-
      een weergave van de actuele kwaliteitsniveaus van zwaveldioxide, stikstofdioxide, ozon en zwevende deeltjes (PM),
      en
    url: https://wetten.overheid.nl/BWBR0027705/2016-07-01#Artikel3
  - number: 3.2.c
    text: |-
      een aanduiding van de actuele kwaliteitsniveaus van zwaveldioxide, stikstofdioxide, ozon en zwevende deeltjes (PM)
      als geen, geringe, matige of ernstige smog.
    url: https://wetten.overheid.nl/BWBR0027705/2016-07-01#Artikel3
  - number: '4'
    text: |-
      Indien naar redelijke verwachting van het RIVM het risico bestaat op matige of ernstige smog
      en in perioden van matige of ernstige smog, analyseert het RIVM ieder uur de ontwikkeling
      van de luchtkwaliteit, op basis van de vaststelling van de kwaliteitsniveaus, bedoeld in
      [artikel 3, eerste lid, van de Regeling beoordeling luchtkwaliteit 2007][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022817#Artikel3
    url: https://wetten.overheid.nl/BWBR0027705/2016-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0022817
        artikel: '3'
  - number: '5'
    text: |-
      Bij matige smog of ernstige smog stelt het RIVM, in aanvulling op de in [artikel 3][ref1] genoemde basisinformatie,
      beschikbaar op www.lml.rivm.nl en zo mogelijk via andere landelijke media, zoals NOS Teletekst:


      [ref1]: https://wetten.overheid.nl/BWBR0027705#Artikel3
    url: https://wetten.overheid.nl/BWBR0027705/2016-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0027705
        artikel: '3'
        paragraaf: '2'
  - number: 5.a
    text: |-
      een beschrijving van het ontstaan van smog en van de verontreinigende stoffen in de buitenlucht die matige of
      ernstige smog veroorzaken;
    url: https://wetten.overheid.nl/BWBR0027705/2016-07-01#Artikel5
  - number: 5.b
    text: |-
      een weergave van de actuele kwaliteitsniveaus van zwaveldioxide, stikstofdioxide, ozon en zwevende deeltjes (PM)
      per zone en agglomeratie alsmede een toelichting daarop;
    url: https://wetten.overheid.nl/BWBR0027705/2016-07-01#Artikel5
  - number: 5.c
    text: |-
      een prognose van de kwaliteitsniveaus van zwaveldioxide, stikstofdioxide, ozon en zwevende deeltjes (PM) voor de
      eerstvolgende middag, dag of dagen;
    url: https://wetten.overheid.nl/BWBR0027705/2016-07-01#Artikel5
  - number: 5.d
    text: |-
      een beschrijving van de bevolkingsgroep of bevolkingsgroepen waarvoor matige of ernstige smog risico’s kan inhouden
      voor de gezondheid, alsmede van te verwachten symptomen en van door die bevolkingsgroep of bevolkingsgroepen te
      treffen voorzorgsmaatregelen, en
    url: https://wetten.overheid.nl/BWBR0027705/2016-07-01#Artikel5
  - number: 5.e
    text: een verwijzing naar het Astma Fonds, de GGD en het RIVM als bronnen van nadere informatie over smog.
    url: https://wetten.overheid.nl/BWBR0027705/2016-07-01#Artikel5
  - number: '6'
    text: |-
      Indien matige smog is vastgesteld in één of meer agglomeraties of zones, stelt het RIVM gedeputeerde staten van de
      betreffende provincies, de GGD, alsmede het Departementaal Coördinatiecentrum Crisisbeheersing van het ministerie
      van Infrastructuur en Milieu (DCC) in kennis van de actuele kwaliteitsniveaus van zwaveldioxide en stikstofdioxide.
    url: https://wetten.overheid.nl/BWBR0027705/2016-07-01#Artikel6
  - number: '7.1'
    text: |-
      Indien ernstige smog is vastgesteld in één of meer agglomeraties of zones, stelt het RIVM gedeputeerde staten van
      de betreffende provincies, het ANP, de GGD, evenals het Departementaal Coördinatiecentrum Crisisbeheersing van het
      Ministerie van Infrastructuur en Milieu (DCC), onmiddellijk in kennis van:
    url: https://wetten.overheid.nl/BWBR0027705/2016-07-01#Artikel7
  - number: 7.1.a
    text: de actuele kwaliteitsniveaus van zwaveldioxide, stikstofdioxide, ozon en zwevende deeltjes (PM);
    url: https://wetten.overheid.nl/BWBR0027705/2016-07-01#Artikel7
  - number: 7.1.b
    text: de alarmdrempel die wordt overschreden;
    url: https://wetten.overheid.nl/BWBR0027705/2016-07-01#Artikel7
  - number: 7.1.c
    text: de hoogste uurgemiddelde concentratie en voor ozon de hoogste acht-uurgemiddelde concentratie;
    url: https://wetten.overheid.nl/BWBR0027705/2016-07-01#Artikel7
  - number: 7.1.d
    text: |-
      de datum, het tijdstip van aanvang, de duur, de plaats en indien bekend de oorzaak van overschrijding van de
      betreffende alarmdrempel;
    url: https://wetten.overheid.nl/BWBR0027705/2016-07-01#Artikel7
  - number: 7.1.e
    text: |-
      een gemotiveerde prognose van de kwaliteitsniveaus van zwaveldioxide, stikstofdioxide, ozon en zwevende deeltjes
      (PM) voor de eerstvolgende middag, dag of dagen in het betreffende geografische gebied en de verwachte duur van de
      ernstige smog;
    url: https://wetten.overheid.nl/BWBR0027705/2016-07-01#Artikel7
  - number: 7.1.f
    text: |-
      een beschrijving van de bevolkingsgroep of bevolkingsgroepen waarvoor ernstige smog risico’s kan inhouden voor
      de gezondheid, alsmede van te verwachten symptomen en door de bevolkingsgroep of bevolkingsgroepen te treffen
      voorzorgsmaatregelen, en
    url: https://wetten.overheid.nl/BWBR0027705/2016-07-01#Artikel7
  - number: 7.1.g
    text: informatie over de stoffen waarvan het kwaliteitsniveau tijdelijk verhoogd is.
    url: https://wetten.overheid.nl/BWBR0027705/2016-07-01#Artikel7
  - number: '7.2'
    text: |-
      Op een dag die volgt op een dag dat ernstige smog is vastgesteld stelt het RIVM de in het eerste lid genoemde
      instanties ten minste eenmaal per dag in kennis van geactualiseerde gegevens als bedoeld in het eerste lid, onder a
      tot en met g.
    url: https://wetten.overheid.nl/BWBR0027705/2016-07-01#Artikel7
  - number: '7.3'
    text: |-
      De commissaris van de Koning doet van het optreden van ernstige smog zo spoedig mogelijk mededeling aan het publiek
      door middel van radio en televisie of op een andere door de commissaris te bepalen wijze. De mededeling omvat de
      informatie genoemd in het eerste lid, alsmede:
    url: https://wetten.overheid.nl/BWBR0027705/2016-07-01#Artikel7
  - number: 7.3.a
    text: een verwijzing naar het Astma Fonds, de GGD en het RIVM als bronnen van nadere informatie over smog, en
    url: https://wetten.overheid.nl/BWBR0027705/2016-07-01#Artikel7
  - number: 7.3.b
    text: |-
      indien van toepassing, gegevens over de belangrijkste bronsectoren die bijdragen aan de ernstige smog en
      aanbevelingen voor maatregelen om de emissies te verminderen.
    url: https://wetten.overheid.nl/BWBR0027705/2016-07-01#Artikel7
  - number: '7.4'
    text: |-
      Het eerste en derde lid zijn van overeenkomstige toepassing indien naar redelijke verwachting van het RIVM ernstige
      smog dreigt te ontstaan.
    url: https://wetten.overheid.nl/BWBR0027705/2016-07-01#Artikel7
  - number: '8'
    text: |-
      [Artikel 7, eerste, tweede en derde lid][ref1], is van overeenkomstige toepassing indien naar redelijke verwachting
      van het RIVM het risico bestaat op overschrijding van de informatiedrempel voor ozon, genoemd in voorschrift 8.3
      van [bijlage 2 bij de wet][ref2], of overschrijding van die informatiedrempel is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0027705#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0027705/2016-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0027705
        artikel: '7'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003245
  - number: '9'
    text: |-
      Gedeputeerde staten stellen voor de uitvoering van de [artikelen 7, derde en vierde lid][ref1], en [8][ref2] een
      provinciaal draaiboek smog vast, op basis van het door de Minister vastgestelde Modeldraaiboek Smog 2010.


      [ref1]: https://wetten.overheid.nl/BWBR0027705#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0027705#Artikel8
    url: https://wetten.overheid.nl/BWBR0027705/2016-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0027705
        artikel: '7'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0027705
        artikel: '8'
        paragraaf: '4'
  - number: '10'
    text: De Smogregeling 2001 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0027705/2016-07-01#Artikel10
  - number: '11'
    text: |-
      Deze regeling treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0027705/2016-07-01#Artikel11
  - number: '12'
    text: 'Deze regeling wordt aangehaald als: Smogregeling 2010.'
    url: https://wetten.overheid.nl/BWBR0027705/2016-07-01#Artikel12
