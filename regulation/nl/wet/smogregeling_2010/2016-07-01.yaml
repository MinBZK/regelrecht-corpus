preamble:
  text: |-
    Gelet op richtlijn nr. 2008/50/EG van 21 mei 2008 van het Europees Parlement en de Raad betreffende de
    luchtkwaliteit en schonere lucht voor Europa (PbEG L 152) en artikel 5.18, tweede lid, van de Wet milieubeheer;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0027705/2016-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder: - *ernstige smog:* smog waarbij: a. de concentratie van zwaveldioxide
      of stikstofdioxide gedurende drie opeenvolgende uren in gebieden met een oppervlakte van ten minste 100 km2
      of in een volledige op grond van [artikel 5.22 van de wet][ref1] aangewezen zone of agglomeratie hoger is
      dan de alarmdrempel, genoemd in voorschrift 1.3 respectievelijk 2.4 van [bijlage 2 bij de wet][ref2], b. de
      concentratie van ozon gedurende drie opeenvolgende uren hoger is dan de alarmdrempel, genoemd in voorschrift 8.4
      van [bijlage 2 bij de wet][ref3], of c. de daggemiddelde concentratie van zwevende deeltjes (PM) hoger is dan 100
      microgram per kubieke meter;
        - *geringe smog:* smog waarbij: a. de concentratie van zwaveldioxide of stikstofdioxide lager is dan de
      grenswaarde, genoemd in voorschrift 1.1, onder a respectievelijk voorschrift 2.1, eerste lid, onder a, van
      [bijlage 2 bij de wet][ref4], b. de concentratie van ozon lager is dan de informatiedrempel, genoemd in voorschrift
      8.3 van [bijlage 2 bij de wet][ref5], of c. de daggemiddelde concentratie van zwevende deeltjes (PM) lager is dan
      70 microgram per kubieke meter;
        - *matige smog:* smog waarbij: a. de concentratie van zwaveldioxide of stikstofdioxide hoger is dan de grenswaarde,
      genoemd in voorschrift 1.1, onder a, respectievelijk 2.1, eerste lid, onder a, van [bijlage 2 bij de wet][ref6],
      maar gedurende drie opeenvolgende uren in gebieden met een oppervlakte van ten minste 100 km2 of in een volledige
      op grond van [artikel 5.22 van de wet][ref7] aangewezen zone of agglomeratie lager is dan de alarmdrempel, genoemd
      in de voorschriften 1.3 respectievelijk 2.4 van bijlage 2 bij de wet, b. de concentratie van ozon hoger is dan de
      informatiedrempel, genoemd in voorschrift 8.3 van [bijlage 2 bij de wet][ref8], maar gedurende drie opeenvolgende
      uren lager is dan de alarmdrempel, genoemd in voorschrift 8.4 van bijlage 2 bij de wet, of c. de daggemiddelde
      concentratie van zwevende deeltjes (PM) zich bevindt tussen 70 en 100 microgram per kubieke meter;
        - *Minister:* Minister van Infrastructuur en Milieu;
        - *RIVM:* Rijksinstituut voor Volksgezondheid en Milieu;
        - *smog:* tijdelijk verhoogd kwaliteitsniveau van zwaveldioxide, stikstofdioxide, ozon of zwevende deeltjes (PM);
        - *wet:* [Wet milieubeheer][ref9].


