      het paraferen van overige stukken, met uitzondering van stukken waarvan, gelet op het belang daarvan,
      redelijkerwijs vermoed kan worden dat deze door de directeur SIOD moeten worden afgedaan;
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel7
  - number: 7.c
    text: |-
