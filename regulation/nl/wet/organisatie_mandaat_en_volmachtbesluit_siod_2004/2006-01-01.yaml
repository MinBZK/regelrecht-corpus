  - number: '11'
    text: 'Aan de regiomanagers van de regiokantoren van de SIOD wordt mandaat en machtiging verleend met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel11
  - number: 11.a
    text: |-
      het nemen van besluiten over en het ondertekenen van stukken die betrekking hebben op het regionale selectieoverleg
      tussen de SIOD, het Openbaar Ministerie, de Arbeidsinspectie, het Uitvoeringsinstituut werknemersverzekeringen, de
      Sociale verzekeringsbank en de sociale recherche van de gemeenten;
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel11
  - number: 11.b
    text: |-
      het ondertekenen van samenwerkingsconvenanten en rechercheplannen met betrekking tot het uitvoeren van
      recherchewerkzaamheden binnen de regio;
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel11
  - number: 11.c
    text: |-
      het nemen van besluiten over en het vaststellen en ondertekenen van stukken die betrekking hebben op de uitvoering
      van opsporingsonderzoeken;
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel11
  - number: 11.d
    text: |-
      personeelsaangelegenheden ten behoeve van medewerkers van het eigen regiokantoor (hemzelf uitgezonderd), voorzover
      deze betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel11
  - number: 11.d.1º
    text: het houden van manager–medewerkergesprekken;
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel11
  - number: 11.d.2º
    text: het opmaken, niet zijnde vaststellen, van een beoordeling van medewerkers;
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel11
  - number: 11.d.3º
    text: verlof van medewerkers;
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel11
  - number: 11.d.4º
    text: |-
      kleine beloningen, niet zijnde gratificaties, tot € 100,– per medewerker, onder gelijktijdige mededeling daarvan
      aan de directeur.
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel11
  - number: '12'
    text: |-
      Aan de regionale teamleiders en de officemanagers van de afdeling Recherche en aan de teamleiders van de afdeling
      Opsporingsbeleid en Innovatie, van de afdeling Planning, Control en Interne Beleidsontwikkeling, van de afdeling
      Opsporingsinformatie en Expertise en van de criminele inlichtingen eenheid SIOD wordt mandaat en machtiging
      verleend met betrekking tot het nemen van besluiten over en het vaststellen en ondertekenen van stukken die
      betrekking hebben op de personeelsaangelegenheden ten behoeve van medewerkers van de eigen organisatorische
      eenheid, hemzelf uitgezonderd, voor zover deze betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel12
  - number: 12.a
    text: het houden van manager-medewerkergesprekken;
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel12
  - number: 12.b
    text: het opmaken, niet zijnde vaststellen, van een beoordeling van medewerkers;
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel12
  - number: 12.c
    text: verlof van medewerkers.
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel12
  - number: '13'
    text: |-
      Het hoofd van de afdeling Planning, Control en Interne Beleidsontwikkeling is gevolmachtigd tot het aangaan van de
      volgende overeenkomsten met een waarde van maximaal € 20.000,– per overeenkomst:
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel13
  - number: 13.a
    text: |-
      overeenkomsten voor het inhuren van personeel voor de uitvoering van werkzaamheden die onder de directe
      verantwoordelijkheid van het departementale management binnen de SIOD worden verricht;
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel13
  - number: 13.b
    text: |-
      koopovereenkomsten met betrekking tot kantoorbenodigdheden, reisbescheiden en representatieve aangelegenheden ten
      behoeve van de SIOD;
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel13
  - number: 13.c
    text: overeenkomsten voor het opleiden van medewerkers van de SIOD binnen de kaders van het opleidingsplan van de SIOD.
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel13
  - number: '14'
    text: |-
      Het hoofd van de afdeling Recherche is gevolmachtigd tot het verrichten van privaatrechtelijke rechtshandelingen
      voor verplichtingen tot ten hoogste het bedrag van € 20.000,– per overeenkomst, binnen de budgettaire kaders van
      het directieplan SIOD, betreffende:
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel14
  - number: 14.a
    text: |-
      het aangaan van overeenkomsten voor het inhuren van personeel, binnen de afdeling Recherche, voor de uitvoering
      van werkzaamheden die onder de directe verantwoordelijkheid van het departementale management binnen de SIOD worden
      verricht;
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel14
  - number: 14.b
    text: |-
      het aangaan van overeenkomsten voor het opleiden van medewerkers van de afdeling Recherche binnen de kaders van het
      opleidingsplan van de SIOD;
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel14
  - number: 14.c
    text: representatieve aangelegenheden, vergaderingen en recepties voor de afdeling Recherche;
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel14
  - number: 14.d
    text: de aanschaf van kantoorbenodigdheden en documentatie;
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel14
  - number: 14.e
    text: de uitvoering van rechercheactiviteiten;
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel14
  - number: 14.f
    text: |-
      huisvestingskosten in relatie tot de regionale kantoren van de afdeling Recherche met inbegrip van bouwkundige
      aanpassingen.
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel14
  - number: '15'
    text: |-
      De regiomanagers van de regiokantoren van de SIOD zijn gevolmachtigd tot het verrichten van privaatrechtelijke
      rechtshandelingen voor verplichtingen tot ten hoogste het bedrag van € 10.000,– per overeenkomst, binnen de
      budgettaire kaders van het directieplan SIOD, betreffende:
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel15
  - number: 15.a
    text: |-
      het aangaan van overeenkomsten voor het inhuren van personeel, binnen het betreffende regiokantoor van de afdeling
      Recherche, voor de uitvoering van werkzaamheden die onder de directe verantwoordelijkheid van het departementale
      management binnen de SIOD worden verricht;
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel15
  - number: 15.b
    text: het opleiden van medewerkers van het betreffende regiokantoor binnen de kaders van het opleidingsplan van de SIOD;
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel15
  - number: 15.c
    text: representatieve aangelegenheden, vergaderingen en recepties voor het betreffende regiokantoor;
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel15
  - number: 15.d
    text: de aanschaf van kantoorbenodigdheden en documentatie voor het betreffende regiokantoor;
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel15
  - number: 15.e
    text: |-
      de uitvoering van rechercheactiviteiten voor het betreffende regiokantoor, met uitzondering van de inzet van
      observatieteams;
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel15
  - number: 15.f
    text: huisvestingskosten in relatie tot het betreffende regiokantoor met uitzondering van bouwkundige aanpassingen.
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel15
  - number: '16'
    text: |-
      De officemanagers van de regiokantoren van de SIOD en van de afdeling Planning, Control en Interne
      Beleidsontwikkeling zijn gevolmachtigd tot het verrichten van privaatrechtelijke rechtshandelingen voor
      verplichtingen, binnen de budgettaire kaders van het directieplan SIOD, betreffende:
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel16
  - number: 16.a
    text: kantoorbenodigdheden en documentatie tot ten hoogste het bedrag van € 1.000,– per overeenkomst;
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel16
  - number: 16.b
    text: |-
      representatieve aangelegenheden, vergaderingen en recepties voor het betreffende regiokantoor en de afdeling
      Planning, Control en Interne Beleidsontwikkeling tot ten hoogste het bedrag van € 500,–;
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel16
  - number: 16.c
    text: |-
      huisvesting in relatie tot het betreffende regiokantoor tot ten hoogste het bedrag € 5000,–, met uitzondering van
      bouwkundige aanpassingen.
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel16
  - number: '17'
    text: |-
      Het hoofd van de criminele inlichtingen eenheid SIOD is gevolmachtigd tot het verrichten van privaatrechtelijke
      rechtshandelingen voor verplichtingen tot ten hoogste het bedrag van € 10.000,– per overeenkomst, binnen de
      budgettaire kaders van het directieplan SIOD, betreffende:
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel17
  - number: 17.a
    text: |-
      het aangaan van overeenkomsten voor het inhuren van personeel, binnen de criminele inlichtingen eenheid SIOD, voor
      de uitvoering van werkzaamheden die onder de directe verantwoordelijkheid van het departementale management binnen
      de SIOD worden verricht;
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel17
  - number: 17.b
    text: |-
      het aangaan van overeenkomsten voor het opleiden van medewerkers van de criminele inlichtingen eenheid SIOD binnen
      de kaders van het opleidingsplan van de SIOD;
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel17
  - number: 17.c
    text: representatieve aangelegenheden, vergaderingen en recepties voor de criminele inlichtingen eenheid SIOD;
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel17
  - number: 17.d
    text: de aanschaf van bureaubenodigdheden en documentatie;
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel17
  - number: 17.e
    text: de ondersteuning van rechercheactiviteiten, inclusief inzet van observatieteams.
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel17
  - number: '18'
    text: |-
      Het hoofd van de afdeling Opsporingsbeleid en Innovatie is gevolmachtigd tot het verrichten van privaatrechtelijke
      rechtshandelingen voor verplichtingen tot ten hoogste het bedrag van € 10.000,– per overeenkomst, binnen de
      budgettaire kaders van het directieplan SIOD, betreffende:
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel18
  - number: 18.a
    text: |-
      het aangaan van overeenkomsten voor het inhuren van personeel, binnen de afdeling Opsporingsbeleid en Innovatie,
      voor de uitvoering van werkzaamheden die onder de directe verantwoordelijkheid van het departementale management
      binnen de SIOD worden verricht;
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel18
  - number: 18.b
    text: |-
      het aangaan van overeenkomsten voor het opleiden van medewerkers van de afdeling Opsporingsbeleid en Innovatie
      binnen de kaders van het opleidingsplan van de SIOD;
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel18
  - number: 18.c
    text: de aanschaf van documentatie;
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel18
  - number: 18.d
    text: representatieve aangelegenheden, vergaderingen en recepties voor de afdeling Opsporingsbeleid en Innovatie.
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel18
  - number: '19'
    text: |-
      Het hoofd van de afdeling Opsporingsinformatie en Expertise is gevolmachtigd tot het verrichten van de
      volgende privaatrechtelijke rechtshandelingen voor verplichtingen tot ten hoogste het bedrag van € 10.000,– per
      overeenkomst, binnen de budgettaire kaders van het directieplan SIOD, betreffende:
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel19
  - number: 19.a
    text: |-
      het aangaan van overeenkomsten voor het inhuren van personeel, binnen de afdeling Opsporingsinformatie en
      Expertise, voor de uitvoering van werkzaamheden die onder de directe verantwoordelijkheid van het departementale
      management binnen de SIOD worden verricht;
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel19
  - number: 19.b
    text: |-
      het aangaan van overeenkomsten voor het opleiden van medewerkers van de afdeling Opsporingsinformatie en Expertise
      binnen de kaders van het opleidingsplan van de SIOD;
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel19
  - number: 19.c
    text: representatieve aangelegenheden, vergaderingen en recepties voor de afdeling Opsporingsinformatie en Expertise.
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel19
  - number: '20.1'
    text: |-
      Bij afwezigheid van de directeur SIOD worden diens taken en bevoegdheden, of een nader genoemd deel daarvan,
      waargenomen door het hoofd van de afdeling Recherche, welke is aangewezen als plaatsvervangend directeur.
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel20
  - number: '20.2'
    text: |-
      Bij afwezigheid van zowel de directeur SIOD als de plaatsvervangend directeur, worden diens taken en bevoegdheden
      waargenomen door een van de aanwezige afdelingshoofden.
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel20
  - number: '21'
    text: |-
      Doorverlening van mandaat, machtiging en volmacht is slechts toegestaan na voorafgaande schriftelijke toestemming
      van de directeur SIOD.
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel21
  - number: '22.1'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst en werkt terug tot en met 1 januari 2004.
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel22
  - number: '22.2'
    text: 'Deze regeling wordt aangehaald als: Organisatie-, mandaat- en volmachtbesluit SIOD 2004.'
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel22
