  - number: '3'
    text: 'Het hoofd van de afdeling Opsporingsbeleid en Innovatie is verantwoordelijk voor de volgende algemene taken:'
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel3
  - number: 3.a
    text: het beleidsmatig, vaktechnisch en juridisch ondersteunen van de SIOD;
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel3
  - number: 3.b
    text: het vormgeven en faciliteren van alle samenwerking van de SIOD;
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel3
  - number: 3.c
    text: |-
      het vertalen van algemeen beleid van het ministerie naar opsporingsbeleid en het vertalen van signaleringen van de
      SIOD naar concrete beleidsaanbevelingen;
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel3
  - number: 3.d
    text: het ontwikkelen en coördineren van de implementatie van kwaliteits- en procesmanagement binnen de SIOD;
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel3
  - number: 3.e
    text: ondersteunen van het MT van de SIOD.
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel3
  - number: '4'
    text: |-
      Het hoofd van de afdeling Recherche is, onverminderd het bepaalde in het
      [Besluit instelling criminele inlichtingen eenheid SIOD][ref1], verantwoordelijk voor de volgende algemene taken:


      [ref1]: https://wetten.overheid.nl/BWBR0015445
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0015445
  - number: 4.a
    text: |-
      het selecteren, voorbereiden en uitvoeren van (internationale, landelijke en regionale) onderzoeken enhet treffen
      van de benodigde maatregelen tijdens de onderzoeken;
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel4
  - number: 4.b
    text: het rapporteren over de opsporingsonderzoeken aan de directeur SIOD en het Openbaar Ministerie;
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel4
  - number: 4.c
    text: |-
      het ontwikkelen en uitvoeren van het beveiligingsbeleid van de SIOD, binnen de kaders van het departementsbrede
      beveiligingsbeleid.
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel4
  - number: '5'
    text: 'Het hoofd van de afdeling Opsporingsinformatie en Expertise is verantwoordelijk voor de volgende algemene taken:'
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel5
  - number: 5.a
    text: het leveren van kwalitatieve en kwantitatieve informatie als input voor strategische- en beleidskeuzes;
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel5
  - number: 5.b
    text: het coördineren van de informatie-uitwisseling met andere relevante partnerorganisaties;
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel5
  - number: 5.c
    text: het op specialistisch gebied participeren in of ondersteunen van SIOD-opsporingsonderzoeken;
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel5
  - number: 5.d
    text: het ontwikkelen van kennismanagement binnen de SIOD;
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel5
  - number: 5.e
    text: |-
      het ontwikkelen en uitvoeren van het informatiebeleid van de SIOD, binnen de daarvoor geldende departementsbrede
      kaders.
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel5
  - number: '6'
    text: |-
      Het hoofd van de afdeling Planning, Control en Interne Beleidsontwikkeling is verantwoordelijk voor de volgende
      algemene taken:
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel6
  - number: 6.a
    text: |-
      het ontwikkelen en vormgeven van het beleid van de SIOD met betrekking tot planning en control, personeel,
      organisatie, financiën, materieel beheer, archief en huisvesting;
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel6
  - number: 6.b
    text: het opstellen van bedrijfsvoeringsplannen met betrekking tot het beleid, bedoeld onder a;
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel6
  - number: 6.c
    text: het adviseren van het management over de bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel6
  - number: 6.d
    text: het voeren van de administratie over de bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel6
  - number: 6.e
    text: het beheren van de aan de SIOD toegekende middelen.
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel6
  - number: '7'
    text: |-
      Aan het hoofd van de afdeling Opsporingsbeleid en Innovatie wordt mandaat en machtiging verleend met betrekking
      tot:
    url: https://wetten.overheid.nl/BWBR0016547/2006-01-01#Artikel7
