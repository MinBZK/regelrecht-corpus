  - number: '30'
    text: |-
      1 Indien een subsidie is verleend als bedoeld in [artikel 9, tweede lid, onderdeel b of c][ref1], draagt de
      subsidieontvanger er zorg voor dat uiterlijk zeventien maanden nadat de subsidie is verleend, de gebouwen waarop
      de subsidieverlening betrekking heeft zijn gesloopt en in voorkomend geval de aan BBL over te dragen gronden zijn
      overgedragen of de in [artikel 12, onderdeel b][ref2], bedoelde pacht is beëindigd, en in het geval, bedoeld in
      [artikel 9, tweede lid, onderdeel b][ref3], voorzover vereist aan het Bureau Heffingen een kennisgeving als bedoeld
      in [artikel 10, tweede lid][ref4], in samenhang met [artikel 9, van de Wet verplaatsing mestproductie][ref5],
      betrekking hebbend op de verplaatsing naar een andere locatie, is gedaan en dient binnen deze termijn een aanvraag
      tot subsidievaststelling in.

      2 De in het eerste lid bedoelde aanvraag wordt ingediend bij de Directeur Laser met gebruikmaking van een daartoe
      door de Directeur Laser ter beschikking gesteld formulier en gaat vergezeld van:

        - een afschrift van een verklaring van het sloopbedrijf dat de desbetreffende gebouwen zijn afgebroken,
        - in voorkomend geval een gewaarmerkt afschrift van de akte van overdracht van gronden als bedoeld in
      [artikel 12, onderdeel b][ref6], of een afschrift van de overeenkomst tot beëindiging van een pachtverhouding als
      bedoeld in [artikel 12, onderdeel b][ref7], of een afschrift van een door de subsidieontvanger ingediende aanvraag
      van een beheerssubsidie als bedoeld in [artikel 12a][ref8], dan wel, indien reeds op die aanvraag is beslist, een
      afschrift van die beslissing.

      3 Indien een subsidie is verleend als bedoeld in [artikel 9, tweede lid, onderdeel c][ref9], gaat de in het eerste
      lid bedoelde aanvraag naast de in het tweede lid bedoelde gegevens vergezeld van een afschrift van de beschikking
      van het bevoegd gezag dat de milieuvergunning is ingetrokken.

      4 Indien de mededeling bedoeld in [artikel 22, tweede lid][ref10], na de subsidieverlening in de Staatscourant
      wordt geplaatst, vangt de in het eerste lid bedoelde termijn aan op de datum dat de desbetreffende mededeling in de
      Staatscourant wordt geplaatst.

      5 [Artikel 27, vijfde lid][ref11], is van overeenkomstige toepassing.


