articles:
  - number: '1'
    text: |-
      1 In deze regeling wordt verstaan onder:



              a

                *minister:*


                Minister van Landbouw, Natuurbeheer en Visserij;



              b

                *aanvrager:*


                degene die overeenkomstig [paragraaf 5][ref1] een aanvraag tot subsidieverlening indient;



              c

                *belanghebbende:*


                belanghebbende als bedoeld in
      [artikel 5, eerste lid, onderdeel j, van de Wet herstructurering varkenshouderij][ref2];



              d

                *bedrijf:*


                bedrijf als bedoeld in [artikel 1, eerste lid, onderdeel j, van de Meststoffenwet][ref3];



              e

                *produceren van dierlijke meststoffen:*


                produceren van dierlijke meststoffen als bedoeld in
      [artikel 1, eerste lid, onderdeel k, van de Meststoffenwet][ref4];



              f

                *varken:*


                dier van de diersoort varken, aangegeven in [bijlage A bij de Meststoffenwet][ref5];



              g

                *kip:*


                dier van de diersoort kippen, aangegeven in [bijlage A bij de Meststoffenwet][ref6];



              h

                *kalkoen:*


                dier van de diersoort kalkoen, aangegeven in [bijlage A bij de Meststoffenwet][ref7];



              i

                *rundvee:*


                dieren van de diersoort rundvee, behorende tot de diercategorieën die in
      [bijlage A bij de Meststoffenwet][ref8] worden aangeduid met de nummers 110, 111, 112, 120, 121, 122, 123, 124
      en 125;



              j

                *veehouderijtak:*


                de productie van dierlijke meststoffen afkomstig van hetzij de varkens, hetzij de kippen en kalkoenen,
      hetzij het rundvee afzonderlijk;



              k

                *mestproductierecht:*


                mestproductierecht als bedoeld in [artikel 1, eerste lid, onderdeel][ref9] ad, van de
      [Meststoffenwet][ref10];



              l

                *grondgebonden mestproductierecht:*


                grondgebonden mestproductierecht als bedoeld in
      [artikel 1, eerste lid, onderdeel ai, van de Meststoffenwet][ref11];



              m

                *niet-gebonden mestproductierecht:*


                niet-gebonden mestproductierecht als bedoeld in
      [artikel 1, eerste lid, onderdeel ae, van de Meststoffenwet][ref12];



              n

                *varkensrecht:*


                varkensrecht als bedoeld in [artikel 1, onderdeel h, van de Wet herstructurering varkenshouderij][ref13];



              o

                *grondgebonden deel van het varkensrecht:*


                grondgebonden deel van het varkensrecht als bedoeld in
      [artikel 1, onderdeel o, van de Wet herstructurering varkenshouderij][ref14];



              p

                *pluimveerecht:*


                pluimveerecht als bedoeld in [artikel 1, eerste lid, onderdeel aj, van de Meststoffenwet][ref15];



              q

                *niet-grondgebonden deel van het varkensrecht:*


                varkensrecht verminderd met het grondgebonden deel van het varkensrecht;



              r

                *doorhaling van het niet-gebonden mestproductierecht:*


                doorhaling van de voor het bedrijf geregistreerde gegevens betreffende de mestproductie als bedoeld in
      [artikel 15 van het Besluit administratieve verplichtingen Meststoffenwet][ref16];



              s

                *kennisgeving van het vervallen van het varkensrecht:*


                kennisgeving van het vervallen van het varkensrecht als bedoeld in
      [artikel 30 van de Wet herstructurering varkenshouderij][ref17];



              t

                *kennisgeving van het vervallen van het pluimveerecht:*


                kennisgeving van het vervallen van het pluimveerecht als bedoeld in
      [artikel 58x van de Meststoffenwet][ref18];



              u

                *verplaatsing:*


                verplaatsing als bedoeld in [artikel 1, eerste lid, van de Wet verplaatsing mestproductie][ref19];



              v

                *kennisgeving van verplaatsing:*


                kennisgeving als bedoeld in de [artikelen 9][ref20] en [10 van de Wet verplaatsing mestproductie][ref21],
      betrekking hebbend op de verplaatsing naar een ander bedrijf;



              w

                *registratie van een kennisgeving van verplaatsing:*


                registratie als bedoeld in [artikel 9 van de Wet verplaatsing mestproductie][ref22] en als bedoeld
      in [artikel 10, tweede lid][ref23], in samenhang met [artikel 9 van die wet][ref24], betrekking hebbend op de
      verplaatsing naar een ander bedrijf;



              x

                *tot het bedrijf behorende oppervlakte landbouwgrond:*


                tot het bedrijf behorende oppervlakte landbouwgrond als bedoeld in
      [artikel 1, eerste lid, onderdeel q, van de Meststoffenwet][ref25];



              y

                *Laser:*


                Dienst Landelijke service bij regelingen van het Ministerie van Landbouw, Natuurbeheer en Visserij;



              z

                *Bureau Heffingen:*


                Bureau Heffingen van het Ministerie van Landbouw, Natuurbeheer en Visserij, te Assen;



              aa

                *BBL:*


                Bureau beheer landbouwgronden als bedoeld in [artikel 28 van de Wet agrarisch grondverkeer][ref26];



              ab

                *milieuvergunning:*


                vergunning verleend krachtens [artikel 8.1, eerste lid, van de Wet milieubeheer][ref27];



              ac

                *erfperceel:*


                tot het bedrijf behorend perceel, niet zijnde landbouwgrond, waarop de gebouwen bestemd voor de
      uitoefening van het bedrijf gelegen zijn;



              ad

                *reservaatsgebied:*


                reservaatsgebied als bedoeld in artikel 1 van de Regeling beheersovereenkomsten en natuurontwikkeling
      zoals het krachtens die regeling nader door de provincies is begrensd;



              ae

                *natuurontwikkelingsproject:*


                natuurontwikkelingsproject als bedoeld in artikel 1 van de Regeling beheersovereenkomsten en
      natuurontwikkeling zoals het krachtens die regeling nader door de provincies is begrensd;



              af

                *natuurgebied:*


                natuurgebied als bedoeld in [artikel 1 van de Subsidieregeling natuurbeheer 2000][ref28] zoals het
      krachtens die regeling nader door de provincie is begrensd;



              ag

                *aankoopgebied:*


                aankoopgebied als bedoeld in artikel 1, onderdeel q, van de Regeling beheersovereenkomsten en
      natuurontwikkeling, zoals het krachtens die regeling nader door de provincies is begrensd;



              ah

                *ruilgebied:*


                ruilgebied als bedoeld in [artikel 1, onderdeel u, van de Subsidieregeling natuurbeheer 2000][ref29].




      2 Indien het varkensrecht is bepaald op grond van krachtens
      [artikel 25 van de Wet herstructurering varkenshouderij][ref30] gestelde regels en deze regels voorzien in een
      afwijkende bepaling van het grondgebonden deel van het varkensrecht, wordt, in afwijking van het eerste lid,
      onderdeel o, voor de toepassing van deze regeling het grondgebonden deel van het varkensrecht in aanmerking genomen
      zoals dat is bepaald op grond van de krachtens [artikel 25 van de Wet herstructurering varkenshouderij][ref31]
      gestelde regels.


