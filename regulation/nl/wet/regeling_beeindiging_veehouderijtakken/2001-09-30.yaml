  - number: '15'
    text: |-
      1 De door BBL te betalen prijs voor de grond, bedoeld in [artikel 14, eerste lid, onderdeel a][ref1], wordt
      bepaald op basis van de daartoe in opdracht van BBL, ten laste van de aanvrager, op de voor BBL gebruikelijke wijze
      getaxeerde waarde van de betrokken grond.

      2 Bij de taxatie ingevolge het eerste lid wordt in voorkomende gevallen geen rekening gehouden met de omstandigheid
      dat:

      a. op de betrokken grond een aangepaste agrarische bedrijfsvoering plaatsvindt uit hoofde van een
      beheersovereenkomst als bedoeld in artikel 18, eerste lid, van de Regeling beheersovereenkomsten en
      natuurontwikkeling dan wel uit hoofde van een beheerssubsidie respectievelijk een landschapssubsidie als bedoeld in
      [artikel 21, eerste lid][ref2], respectievelijk [artikel 60 van de Subsidieregeling agrarisch natuurbeheer][ref3];

      b. dat de betrokken grond is gelegen in een reservaatsgebied, natuurontwikkelingsproject of een natuurgebied.


      [ref1]: https://wetten.overheid.nl/BWBR0011234#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011000#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0011000#Artikel60
