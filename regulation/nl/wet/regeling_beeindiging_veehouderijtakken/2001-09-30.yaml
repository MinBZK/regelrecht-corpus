      1 Voor de toepassing van deze regeling:

      a. worden het niet-gebonden mestproductierecht, het grondgebonden mestproductierecht, het varkensrecht,
      het grondgebonden deel van het varkensrecht en het pluimveerecht in aanmerking genomen zoals deze voor het
      desbetreffende bedrijf op het tijdstip van de aanvraag tot subsidieverlening door het Bureau Heffingen zijn
      geregistreerd;

      b. wordt voor de bepaling van de omvang van het niet-gebonden mestproductierecht
      [artikel 23 van het Besluit hardheidsgevallen herstructurering varkenshouderij][ref1] niet in
      aanmerking genomen, indien op de datum van de aanvraag van de subsidieverlening niet is voldaan aan
      [artikel 9, tweede lid, van dat besluit][ref2];

      c. wordt voor de bepaling van de omvang van het varkensrecht [hoofdstuk 2, paragrafen 3][ref3],
      [4][ref4] en [5, van het Besluit hardheidsgevallen herstructurering varkenshouderij][ref5] niet
      in aanmerking genomen, indien op de datum van de aanvraag tot subsidieverlening niet is voldaan aan
      [artikel 9, eerste en tweede lid, onderdelen b, c, d en e, van dat besluit][ref6];

      d. wordt voor de bepaling van de omvang van het pluimveerecht [artikel 58k van de Meststoffenwet][ref7] niet in
      aanmerking genomen, indien op de datum van de aanvraag tot subsidieverlening niet is voldaan aan de voorwaarde dat
      extra huisvesting wordt gebouwd, bedoeld in [artikel 58k, eerste lid, onderdeel a, van de Meststoffenwet][ref8] en
      [artikel 6 van het Uitvoeringsbesluit pluimveerechten Meststoffenwet][ref9].

      2 Voor de toepassing van deze regeling:

      a. wordt de gemiddeld in 1999 geproduceerde hoeveelheid dierlijke meststoffen afkomstig van de onderscheiden
      in [bijlage A bij de Meststoffenwet][ref10] genoemde diersoorten bepaald op basis van het gemiddeld in 1999 op
      het bedrijf gehouden, uitgeschaarde of elders ter weiding ondergebrachte aantal dieren, van de onderscheiden
      diercategorieën en op basis van de forfaitaire productienormen voor de onderscheiden diercategorieën, uitgedrukt in
      kilogrammen fosfaat per dier per jaar, die zijn opgenomen in [bijlage A bij de Meststoffenwet][ref11];

      b. is het gemiddeld in 1999 op het bedrijf gehouden, uitgeschaarde of elders ter weiding ondergebrachte
      aantal dieren, het aantal dieren opgegeven in de aangifte, bedoeld in [artikel 21][ref12] of
      [28 van de Meststoffenwet][ref13], dan wel, bij gebreke daarvan, het aantal dieren vermeld op de opgave, bedoeld in
      [artikel 11 van de Regeling administratieve verplichtingen Meststoffenwet][ref14];

      c. worden de gegevens van de aangifte en de opgave en de correcties daarop slechts in aanmerking genomen voorzover
      deze door het Bureau Heffingen zijn ontvangen voor 1 januari 2001.


