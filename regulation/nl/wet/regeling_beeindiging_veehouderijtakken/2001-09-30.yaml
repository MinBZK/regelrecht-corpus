      1 Voor de toepassing van [artikel 2, tweede lid, onderdeel a][ref1], komt de gemiddeld in 1999 geproduceerde
      hoeveelheid dierlijke meststoffen van een door samenvoeging ontstaan bedrijf, indien de registratie van een
      kennisgeving van verplaatsing met betrekking tot een samenvoeging van bedrijven in 1999 heeft plaatsgevonden,
      overeen met de som van de gemiddeld in 1999 op de oorspronkelijke bedrijven en het na samenvoeging ontstane bedrijf
      geproduceerde hoeveelheden dierlijke meststoffen.

      2 Voor toepassing van [artikel 2, tweede lid, onderdeel a][ref2], komt de gemiddeld in 1999 geproduceerde
      hoeveelheid dierlijke meststoffen van een door samenvoeging ontstaan bedrijf, indien de registratie van een
      kennisgeving van verplaatsing met betrekking tot een samenvoeging van bedrijven na 1999 heeft plaatsgevonden,
      overeen met de som van de gemiddeld in 1999 op de oorspronkelijke bedrijven geproduceerde hoeveelheid dierlijke
      meststoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0011234#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011234#Artikel2
