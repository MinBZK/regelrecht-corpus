  - number: '9'
    text: |-
      1 Indien beëindiging van een of meer veehouderijtakken als bedoeld in [artikel 7][ref1] plaatsvindt, verstrekt de
      minister naast de subsidie, bedoeld in [artikel 5, eerste lid][ref2], op aanvraag een subsidie voor de afbraak van
      de gebouwen, bestemd voor de uitoefening van de veehouderijtakken die worden beëindigd, met inachtneming van het
      bepaalde in de [artikelen 10 tot en met 13][ref3].

      2 Buiten gevallen van beëindiging van een of meer veehouderijtakken overeenkomstig [artikel 7][ref4], verstrekt de
      minister een subsidie voor de afbraak van gebouwen, bestemd tot uitoefening van de veehouderij, met inachtneming
      van het bepaalde in de [artikelen 10 tot en met 13][ref5], indien het gebouwen betreft:

      a. die uiterlijk op het moment van de inwerkingtreding van deze regeling niet meer voor de uitoefening van de
      veehouderij werden gebruikt en sedertdien ook niet meer daarvoor zijn gebruikt;

      b. die behoren tot een bedrijf, dat bestaat uit meerdere locaties, en deze gebouwen als gevolg van de samenvoeging
      van alle veehouderijactiviteiten van dat bedrijf op een locatie aan de uitoefening van de veehouderij zullen worden
      onttrokken, of

      c. die behoren tot een bedrijf dat de varkens- of rundveetak beëindigt, en die zijn bestemd tot uitoefening
      van de te beëindigen veehouderijtakken, voorzover dat bedrijf ter zake van de te beëindigen takken
      uitsluitend beschikt over een grondgebonden varkens- of mestproductierecht, en onder de voorwaarde
      dat de milieuvergunning, voorzover deze betrekking heeft op de te beëindigen takken, overeenkomstig
      [artikel 8:26, eerste lid, van de Wet milieubeheer][ref6] wordt ingetrokken, dan wel overeenkomstig
      [artikel 8:4][ref7] of [8:24, eerste lid, van de Wet milieubeheer][ref8] zodanig wordt gewijzigd dat de uitoefening
      van de te beëindigen veehouderijtak op het desbetreffende bedrijf niet langer mogelijk is.

      3 De minister verstrekt met inachtneming van het bepaalde in de [artikelen 10 tot en met 13][ref9] op aanvraag
      van een ontvanger van een subsidie als bedoeld in [artikel 5, eerste lid][ref10], die bij zijn aanvraag voor die
      subsidie niet tevens een aanvraag als bedoeld in het eerste lid heeft ingediend, een subsidie voor de afbraak van
      de gebouwen, bestemd voor de uitoefening van de veehouderijtakken die onder verlening van een subsidie als bedoeld
      in [artikel 5, eerste lid][ref11], worden of zijn beëindigd.

      4 Ingeval het [Besluit akkerbouwbedrijven milieubeheer][ref12] of het
      [Besluit melkrundveehouderijen milieubeheer][ref13] op het bedrijf van toepassing is, geldt in afwijking van het
      in het eerste lid, onderdeel c, bepaalde ten aanzien van de milieuvergunning als voorwaarde dat een melding als
      bedoeld in artikel 3, tweede lid, onderscheidenlijk artikel 4, tweede lid, van de voornoemde besluiten is gedaan
      dat niet langer dieren worden gehouden die behoren tot de veehouderijtak die wordt beëindigd.


