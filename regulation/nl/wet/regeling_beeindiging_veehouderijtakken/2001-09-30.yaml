  - number: 30a
    text: |-
      Indien de kippen- en kalkoenentak wordt beëindigd en de subsidie-aanvrager in het referentiejaar, bedoeld in
      [artikel 58g, tweede of derde lid, van de Meststoffenwet][ref1] op het bedrijf kalkoenen heeft gehouden vangen
      de termijnen, bedoeld in [artikel 25, eerste en tweede lid][ref2], [artikel 27, eerste en tweede lid][ref3],
      [artikel 29, eerste lid][ref4], en [artikel 30, eerste lid][ref5], aan op het moment dat de mededeling, bedoeld
      in [artikel 21, tweede lid][ref6], in de Staatscourant wordt geplaatst, indien deze mededeling later in de
      Staatscourant wordt geplaatst dan de mededeling bedoeld in [artikel 22, tweede lid][ref7].


