  - number: '25'
    text: |-
      1 Indien de varkenstak wordt beëindigd, worden de varkens uiterlijk twaalf maanden nadat de subsidie is verleend
      van het bedrijf afgevoerd.

      2 Indien de kippen- en kalkoenentak of de rundveetak wordt beëindigd, worden de dieren behorende tot de
      desbetreffende tak uiterlijk vijftien maanden nadat de subsidie is verleend van het bedrijf afgevoerd.

      3 Indien de kippen- en kalkoenentak wordt beëindigd en de subsidie-aanvrager in het referentiejaar, bedoeld in
      [artikel 58g, tweede of derde lid, van de Meststoffenwet][ref1] op het bedrijf kalkoenen hield, vangen de in het
      tweede lid bedoelde termijnen aan op de datum dat de mededeling, bedoeld in [artikel 21, tweede lid][ref2], in de
      Staatscourant is geplaatst.

      4 Voorzover de subsidieverlening mede betrekking heeft op een subsidie als bedoeld in
      [artikel 9, eerste lid][ref3], en de mededeling, bedoeld in [artikel 22, tweede lid][ref4], na subsidieverlening in
      de Staatscourant wordt geplaatst, vangen de in het eerste en tweede lid bedoelde termijnen aan op de datum dat de
      desbetreffende mededeling in de Staatscourant wordt geplaatst.

      5 Indien op het tijdstip waarop de dieren ingevolge het eerste en tweede lid
      uiterlijk van het bedrijf hadden moeten zijn afgevoerd een vervoersverbod krachtens
      [artikel 30, eerste lid, van de Gezondheids- en welzijnswet voor dieren][ref5] van kracht is, worden de dieren
      uiterlijk 21 dagen nadat het vervoersverbod is opgeheven van het bedrijf afgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58g
      [ref2]: https://wetten.overheid.nl/BWBR0011234#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0011234#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0011234#Artikel22
      [ref5]: https://wetten.overheid.nl/BWBR0005662#Artikel30
