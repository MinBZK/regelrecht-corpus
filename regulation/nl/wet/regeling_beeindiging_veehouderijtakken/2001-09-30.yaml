  - number: '26'
    text: |-
      De aanvrager voert nadat een of meer van de termijnen, bedoeld in [artikel 25][ref1], zijn aangevangen op zijn
      bedrijf geen dieren meer aan die behoren tot de veehouderijtak die wordt beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0011234#Artikel25
    url: https://wetten.overheid.nl/BWBR0011234/2001-09-30#Artikel26
