  - number: '7'
    text: |-
      1 De subsidie wordt verstrekt indien is voldaan aan elk van de volgende voorwaarden:

      a. beëindiging van de productie van dierlijke meststoffen afkomstig van de varkens, van de kippen en kalkoenen; of
      van het rundvee;

      b. registratie van de kennisgeving van het vervallen van het varkensrecht van het bedrijf, indien de varkenstak
      wordt beëindigd, of registratie van de kennisgeving van het vervallen van het pluimveerecht van het bedrijf,
      indien de kippen- en kalkoenentak wordt beëindigd, dan wel doorhaling van het deel van het niet-gebonden
      mestproductierecht dat overeenkomt met de in 1999 op het desbetreffende bedrijf geproduceerde hoeveelheid dierlijke
      meststoffen afkomstig van rundvee;

      c. doorhaling van het deel van het niet-gebonden mestproductierecht dat overeenkomt met het verschil tussen het
      met betrekking tot 1999 geregistreerde mestproductierecht en de gemiddeld in 1999 op het bedrijf geproduceerde
      hoeveelheid dierlijke meststoffen voorzover niet afkomstig van de varkens;

      d. intrekking van de milieuvergunning, voorzover die vergunning betrekking heeft op
      de veehouderijtak van het desbetreffende bedrijf die wordt beëindigd, overeenkomstig
      [artikel 8:26, eerste lid, van de Wet milieubeheer][ref1], dan wel wijziging van de milieuvergunning overeenkomstig
      [artikel 8.4][ref2] of [8.24, eerste lid, van de Wet milieubeheer][ref3], zodanig dat uitoefening van de te
      beëindigen veehouderijtak op het desbetreffende bedrijf niet langer mogelijk is;

      e. de aanvrager oefent gedurende tien jaren, te rekenen vanaf het moment van subsidievaststelling, op de locatie
      van de overeenkomstig deze regeling beëindigde veehouderijtak de desbetreffende veehouderijtak niet uit, noch
      als persoon noch tezamen met anderen in de vorm van een rechtspersoon of een samenwerkingsverband van personen of
      rechtspersonen, en stelt zeker dat gedurende deze tien jaren op het desbetreffende bedrijf op de desbetreffende
      locatie de desbetreffende veehouderijtak evenmin door derden wordt uitgeoefend.

      2 Ingeval het [Besluit akkerbouwbedrijven milieubeheer][ref4] of het
      [Besluit melkrundveehouderijen milieubeheer][ref5] op het bedrijf van toepassing is, geldt in afwijking van
      het eerste lid, onderdeel d, als voorwaarde dat een melding als bedoeld in [artikel 3, tweede lid][ref6],
      onderscheidenlijk [artikel 4, tweede lid][ref7], van de voornoemde besluiten is gedaan dat niet langer dieren
      worden gehouden die behoren tot de veehouderijtak die wordt beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8.26
