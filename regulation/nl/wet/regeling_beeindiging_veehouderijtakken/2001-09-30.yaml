  - number: '4'
    text: |-
      1 Voor de toepassing van [artikel 2, tweede lid, onderdeel a][ref1], komt de gemiddeld in 1999 geproduceerde
      hoeveelheid dierlijke meststoffen van een door afsplitsing ontstaan bedrijf, indien de registratie van een
      kennisgeving van verplaatsing met betrekking tot een afsplitsing van een bedrijf in 1999 heeft plaatsgevonden,
      overeen met de gemiddeld in 1999 tot het tijdstip van de registratie van de kennisgeving van verplaatsing op
      het bedrijf dat tot het tijdstip van de registratie van de kennisgeving van verplaatsing bestond geproduceerde
      hoeveelheid dierlijke meststoffen vermenigvuldigd met een breuk, waarvan de teller gelijk is aan het op de
      datum van de registratie van de kennisgeving van verplaatsing op het na afsplitsing ontstane bedrijf rustende
      mestproductierecht en de noemer gelijk is aan het op het bedrijf dat tot het tijdstip van de registratie van de
      kennisgeving bestond, rustende mestproductierecht.

      2 Voor de toepassing van [artikel 2, tweede lid, onderdeel a][ref2], komt de gemiddeld in 1999 geproduceerde
      hoeveelheid dierlijke meststoffen van het na afsplitsing voortgezette oorspronkelijke bedrijf, indien de
      registratie van een kennisgeving van verplaatsing met betrekking tot een afsplitsing van een bedrijf in 1999
      heeft plaatsgevonden, overeen met de gemiddeld in 1999 tot het tijdstip van de registratie van de kennisgeving
      van verplaatsing op het bedrijf dat tot het tijdstip van de registratie van de kennisgeving van verplaatsing
      bestond geproduceerde hoeveelheid dierlijke meststoffen vermenigvuldigd met een breuk, waarvan de teller gelijk
      is aan het op de datum van de registratie van de kennisgeving van verplaatsing op het na afsplitsing voortgezette
      oorspronkelijke bedrijf rustende mestproductierecht en de noemer gelijk is aan het op het bedrijf dat tot het
      tijdstip van de registratie van de kennisgeving bestond, rustende mestproductierecht.

      3 Indien de registratie van de kennisgeving van verplaatsing met betrekking tot een afsplitsing na 1999 heeft
      plaatsgevonden, wordt in het eerste en tweede lid in plaats van ‘de gemiddeld in 1999 tot het tijdstip van de
      registratie van de kennisgeving van verplaatsing geproduceerde hoeveelheid dierlijke meststoffen’ gelezen: de
      gemiddeld in 1999 geproduceerde hoeveelheid dierlijke meststoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0011234#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011234#Artikel2
