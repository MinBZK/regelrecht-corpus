  - number: '29'
    text: |-
      1 Indien een subsidie is verleend als bedoeld in [artikel 9, tweede lid, onderdeel a, of derde lid][ref1], draagt
      de subsidieontvanger er zorg voor dat uiterlijk acht maanden nadat de subsidie is verleend, de gebouwen waarop
      de subsidieverlening betrekking heeft zijn gesloopt en in voorkomend geval de aan BBL over te dragen gronden zijn
      overgedragen of de in [artikel 12, onderdeel b][ref2], bedoelde pacht is beëindigd, en dient binnen deze termijn
      een aanvraag tot subsidievaststelling in.

      2 [Artikel 27, derde lid, aanhef, en tweede, derde, vierde en vijfde streepje, en vijfde lid][ref3], is van
      overeenkomstige toepassing.

      3 Indien de mededeling bedoeld in [artikel 22, tweede lid][ref4], na de subsidieverlening in de Staatscourant
      wordt geplaatst, vangt de in het eerste lid bedoelde termijn aan op de datum dat de desbetreffende mededeling in de
      Staatscourant wordt geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0011234#Artikel9
