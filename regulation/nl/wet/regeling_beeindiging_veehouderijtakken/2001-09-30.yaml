  - number: '11'
    text: |-
      De minister maakt in de Staatscourant de periode bekend waarin een subsidie als bedoeld in
      [artikel 9, eerste, tweede of derde lid][ref1], kan worden aangevraagd, welke periode voor
      de onderscheiden gebieden, bedoeld in de bijlage bij deze regeling, verschillend kan worden
      vastgesteld. Daarbij maakt de minister tevens per gebied voor de subsidies, bedoeld in
      [artikel 9, eerste en derde lid, onderscheidenlijk tweede lid][ref2], afzonderlijk bekend welk subsidieplafond voor
      de desbetreffende periode geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0011234#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0011234#Artikel9
