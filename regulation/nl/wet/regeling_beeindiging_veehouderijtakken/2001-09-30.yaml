  - number: '22'
    text: |-
      1 De subsidie, bedoeld in [artikel 9, eerste, tweede en derde lid][ref1], wordt verleend onder het
      voorbehoud dat de Provinciale Staten van de provincie waarin het desbetreffende bedrijf gelegen is ingevolge
      [artikel 196, eerste lid, van de Provinciewet][ref2] een besluit tot wijziging van de begroting heeft genomen
      inhoudende de financiering van de subsidie, bedoeld in [artikel 9, eerste, tweede en derde lid][ref3].

      2 Van de in het eerste lid bedoelde besluit wordt mededeling gedaan in de Staatscourant.

      3 Indien het besluit, bedoeld in het eerste lid, niet is genomen binnen de periode waarin de subsidie kan worden
      aangevraagd, geldt, in afwijking van de mededeling, bedoeld in [artikel 11][ref4], als subsidieplafond voor
      de subsidies, bedoeld in [artikel 9, eerste, tweede en derde lid][ref5], voor de desbetreffende provincie een
      subsidieplafond van nihil.


