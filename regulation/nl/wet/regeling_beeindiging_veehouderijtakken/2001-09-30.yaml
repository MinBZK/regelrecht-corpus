  - number: '19'
    text: |-
      1 De aanvrager geeft de Directeur Laser toestemming gebruik te maken van de door hem aan de gemeente of provincie
      waar het desbetreffende bedrijf gelegen is, het Bureau Heffingen en de Dienst Landelijk Gebied van het Ministerie
      van Landbouw, Natuurbeheer en Visserij verstrekte gegevens.

      2 De aanvrager geeft de Directeur Laser toestemming gegevens te verstrekken aan het college van burgemeester
      en wethouders van de gemeente en aan gedeputeerde staten van de provincie waarin het desbetreffende bedrijf is
      gelegen, en de Dienst Landelijk Gebied van het Ministerie van Landbouw, Natuurbeheer en Visserij.

      3 De aanvrager verschaft op verzoek van de Directeur Laser aanvullende gegevens binnen een door de Directeur Laser
      te stellen termijn.
    url: https://wetten.overheid.nl/BWBR0011234/2001-09-30#Artikel19
  - number: '20'
    text: |-
      Door het indienen van het aanvraagformulier verplicht de aanvrager zich tot nakoming van de in deze regeling
      gestelde voorwaarden en verplichtingen.
    url: https://wetten.overheid.nl/BWBR0011234/2001-09-30#Artikel20
  - number: '21'
    text: |-
      1 De subsidie voor beëindiging van de kippen- en kalkoenentak wordt, ingeval de subsidie-aanvrager in het
      referentiejaar, bedoeld in [artikel 58g, tweede of derde lid, van de Meststoffenwet][ref1] op het bedrijf kalkoenen
      hield, verleend onder voorbehoud dat de Commissie van de Europese Gemeenschappen ingevolge de artikelen 87 en 88 EG
      verklaart geen bezwaar te hebben tegen de toepassing van deze regeling.

      2 Van de in het eerste lid bedoelde verklaring wordt mededeling gedaan in de Staatscourant.

      3 De beschikking tot subsidieverlening wordt ingetrokken indien de Commissie van de Europese Gemeenschappen
      ingevolge de artikelen 87 en 88 EG verklaren bezwaar te hebben tegen de desbetreffende subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58g
