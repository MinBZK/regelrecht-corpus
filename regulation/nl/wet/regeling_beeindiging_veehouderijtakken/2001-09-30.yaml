  - number: 32a
    text: |-
      Een beschikking tot subsidievaststelling met betrekking tot een subsidie als bedoeld in [artikel 9][ref1] wordt
      ingetrokken indien de subsidieontvanger, aan wie een beheerssubsidie als bedoeld in [artikel 12a][ref2] is verleend
      en die in verband daarmee niet heeft hoeven voldoen aan de voorwaarden, bedoeld in [artikel 12, onderdeel b][ref3],
      zich niet houdt aan de verplichtingen die aan de verlening van die beheerssubsidie zijn verbonden en op grond
      daarvan de beschikking tot verlening of vaststelling van die beheerssubsidie wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0011234#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0011234#Artikel12a
      [ref3]: https://wetten.overheid.nl/BWBR0011234#Artikel12
    url: https://wetten.overheid.nl/BWBR0011234/2001-09-30#Artikel32a
    references:
      - id: ref1
        bwb_id: BWBR0011234
        artikel: '9'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0011234
        artikel: 12a
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0011234
        artikel: '12'
        paragraaf: '3'
  - number: '33'
    text: |-
      Indien de beschikking tot subsidieverlening of -vaststelling is ingetrokken of ten nadele van de subsidieontvanger
      is gewijzigd, betaalt de aanvrager de door hem ontvangen subsidiebedragen en voorschotten terug op eerste vordering
      van de minister vermeerderd met de wettelijke rente over de periode van de datum van uitbetaling van de subsidie
      tot het tijdstip van voldoening.
    url: https://wetten.overheid.nl/BWBR0011234/2001-09-30#Artikel33
  - number: '35'
    text: |-
      Met het toezicht op de naleving van deze regeling zijn belast medewerkers van Laser en van de Algemene
      Inspectiedienst van het Ministerie van Landbouw, Natuurbeheer en Visserij.
    url: https://wetten.overheid.nl/BWBR0011234/2001-09-30#Artikel35
  - number: '36'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0011234/2001-09-30#Artikel36
  - number: '37'
    text: 'Deze regeling wordt aangehaald als: Regeling beëindiging veehouderijtakken.'
    url: https://wetten.overheid.nl/BWBR0011234/2001-09-30#Artikel37
