  - number: '17'
    text: |-
      1 De aanvrager van een subsidie als bedoeld in [artikel 5, eerste lid][ref1]:

      a. doet, indien de varkenstak wordt beëindigd, onder het voorbehoud dat de subsidie wordt verleend, aan het Bureau
      Heffingen een kennisgeving van het vervallen van het varkensrecht van het bedrijf;

      b. doet, indien de kippen- en kalkoenentak wordt beëindigd, onder voorbehoud dat de subsidie wordt verleend, aan
      het Bureau Heffingen een kennisgeving van het vervallen van het pluimveerecht van het bedrijf;

      c. verzoekt, indien de rundveetak wordt beëindigd, onder het voorbehoud dat de subsidie wordt verleend, aan het
      Bureau Heffingen om doorhaling van het in [artikel 7, onderdeel b][ref2], bedoelde deel van het niet-gebonden
      mestproductierecht;

      d. verzoekt, onder het voorbehoud dat de subsidie wordt verleend, om doorhaling van het deel van het in
      [artikel 7, onderdeel c][ref3], bedoelde deel van het niet-gebonden mestproductierecht;

      e. doet gelijktijdig met zijn aanvraag aan de Directeur Laser een ondertekende verklaring toekomen waarin hij
      verklaart:

      1º met welke diersoort of diersoorten, onderscheidenlijk diercategorie of diercategorieën, hij zijn bedrijf
      voortzet, en

      2º gedurende tien jaren, te rekenen vanaf het moment van subsidievaststelling, op het desbetreffende bedrijf op
      de locatie van de overeenkomstig deze regeling beëindigde veehouderijtak de desbetreffende veehouderijtak niet uit
      te oefenen, noch als persoon noch tezamen met anderen in de vorm van een rechtspersoon of een samenwerkingsverband
      van personen of rechtspersonen, en zeker te stellen dat gedurende deze tien jaren op de desbetreffende locatie de
      desbetreffende veehouderijtak evenmin door derden wordt uitgeoefend.

      2 De aanvraag van een subsidie als bedoeld in [artikel 9, eerste lid][ref4], wordt ingediend tezamen met de
      aanvraag van een subsidie als bedoeld in [artikel 5, eerste lid][ref5].

      3 In afwijking van het tweede lid kan een aanvrager van een subsidie als bedoeld in [artikel 5, eerste lid][ref6],
      die bij die aanvraag aangeeft dat hij voornemens is om met betrekking tot zijn erfperceel of de tot zijn bedrijf
      behorende oppervlakte landbouwgrond een bouwvergunning voor een woning aan te vragen, binnen 9 maanden na de
      aanvraag van de subsidie als bedoeld in [artikel 5, eerste lid][ref7], zijn aanvraag aanvullen met een aanvraag
      van een subsidie als bedoeld in [artikel 9, eerste lid][ref8]. Tenzij de aanvraag tot verlening van een subsidie
      als bedoeld in [artikel 5, eerste lid][ref9] kennelijk niet-ontvankelijk is, of moet worden afgewezen, houdt de
      minister de beslissing op de aanvraag van de subsidie, bedoeld in [artikel 5, eerste lid][ref10], aan totdat deze
      overeenkomstig de eerste volzin is aangevuld, dan wel totdat de in de eerste volzin bedoelde termijn is verstreken
      zonder dat zodanige aanvulling heeft plaatsgevonden.

      4 De aanvraag van een subsidie als bedoeld in [artikel 9, eerste lid][ref11], onderscheidenlijk als bedoeld in
      [artikel 9, tweede lid][ref12], gaat vergezeld van een verklaring van de aanvrager dat hij geen bezwaar maakt tegen
      een voorbereidingsbesluit als bedoeld in [artikel 21 van de Wet op de Ruimtelijke Ordening][ref13] en een wijziging
      van het bestemmingsplan als bedoeld in [artikel 10 van de Wet op de Ruimtelijke Ordening][ref14], strekkende tot
      verwijdering of verkleining van het agrarisch bouwblok, overeenkomend met de oppervlakte en lokatie van de in
      [artikel 12, eerste lid, onderdeel a][ref15] bedoelde gebouwen.


