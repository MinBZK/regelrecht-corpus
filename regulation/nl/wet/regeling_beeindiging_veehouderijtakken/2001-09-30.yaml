  - number: '13'
    text: |-
      1 Geen subsidie als bedoeld in [artikel 9, eerste of tweede lid][ref1], wordt verstrekt:

      a. indien op het erfperceel of op het geheel of een deel van de tot het bedrijf behorende oppervlakte landbouwgrond
      krachtens een vigerend bestemmingsplan als bedoeld in [artikel 10 van de Wet op de Ruimtelijke Ordening][ref2], dan
      wel krachtens een besluit als bedoeld in [artikel 19 van deze wet][ref3] woningbouw is toegelaten, of

      b. indien de tot het bedrijf behorende oppervlakte landbouwgrond, voorzover deze is gelegen in een
      reservaatsgebied, een natuurontwikkelingsproject of een natuurgebied, op of na de datum waarop deze regeling wordt
      bekendgemaakt, anders dan door eigendomsoverdracht aan BBL, dan wel door beëindiging van de pacht voor zover de
      betrokken grond eigendom is van Staatsbosbeheer of een particuliere natuurbeschermingsorganisatie, is verkleind, of

      c. indien de grondoppervlakte van de in [artikel 10][ref4] bedoelde gebouwen minder is dan 200 vierkante meter.

      2 De subsidie, bedoeld in [artikel 9, derde lid][ref5], wordt slechts verstrekt indien de aanvrager bij de aanvraag
      tot subsidieverlening een afschrift overlegt van

      a. een onherroepelijk geworden besluit van het bestuur van de desbetreffende gemeente, houdende de weigering van
      een bouwvergunning voor woningbouw op het erfperceel of de tot het bedrijf behorende oppervlakte landbouwgrond, of

      b. een onherroepelijk geworden rechterlijke uitspraak met betrekking tot een eerder verleende dan wel geweigerde
      bouwvergunning als bedoeld onder a, als gevolg waarvan woningbouw op het erfperceel of de tot het bedrijf behorende
      oppervlakte landbouwgrond niet mogelijk is, of

      c. een besluit of uitspraak als bedoeld onder a of b, waartegen op het moment van de aanvraag nog enige voorziening
      openstaat, vergezeld van een verklaring van de aanvrager dat hij van die voorziening geen gebruik zal maken.

      3 Het eerste lid, aanhef en onderdelen b en c, zijn van overeenkomstige toepassing met betrekking tot de subsidie,
      bedoeld in [artikel 9, derde lid][ref6].


