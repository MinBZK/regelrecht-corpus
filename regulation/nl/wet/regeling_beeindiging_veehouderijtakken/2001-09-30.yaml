        artikel: '25'
        paragraaf: '6'
  - number: '27'
    text: |-
      1 De subsidieontvanger draagt er zorg voor dat, uiterlijk veertien maanden nadat de subsidie is verleend, aan de
      in [artikel 7, onderdelen a en d][ref1], genoemde voorwaarden is voldaan, alsmede, indien de subsidieverlening
      mede betrekking heeft op een subsidie als bedoeld in [artikel 9, eerste lid][ref2], de desbetreffende
      gebouwen zijn gesloopt en in voorkomend geval de aan BBL over te dragen gronden zijn overgedragen of de in
      [artikel 12, onderdeel b][ref3], bedoelde pacht is beëindigd, en dient een aanvraag tot subsidievaststelling in.

      2 Indien de kippen- en kalkoenentak of de rundveetak wordt beëindigd, wordt in het eerste lid in plaats van
      ‘veertien maanden’ gelezen: zeventien maanden.

      3 De in het eerste lid bedoelde aanvraag wordt ingediend bij de Directeur Laser met gebruikmaking van een daartoe
      door de Directeur Laser ter beschikking gesteld formulier en gaat vergezeld van:

        - een afschrift van de beschikking van het bevoegd gezag dat de milieuvergunning is ingetrokken, en indien afbraak
      van de gebouwen, bedoeld in [artikel 9][ref4], heeft plaatsgevonden,
        - bescheiden waaruit blijkt dat de desbetreffende gebouwen zijn afgebroken, alsmede in voorkomend geval
        - een gewaarmerkt afschrift van de akte van overdracht van gronden als bedoeld in [artikel 12, onderdeel b][ref5],
      of
        - een afschrift van de overeenkomst tot beëindiging van een pachtverhouding als bedoeld in
      [artikel 12, onderdeel b][ref6], of
        - een afschrift van een door de subsidieontvanger ingediende aanvraag van een beheerssubsidie als bedoeld in
      [artikel 12a][ref7], dan wel, indien reeds op die aanvraag is beslist, een afschrift van die beslissing.

      4 Voorzover de subsidieverlening mede betrekking heeft op een subsidie als bedoeld in
      [artikel 9, eerste lid][ref8], en de mededeling, bedoeld in [artikel 22, tweede lid][ref9], na subsidieverlening in
      de Staatscourant wordt geplaatst, vangen de in het eerste en tweede lid bedoelde termijnen aan op de datum dat de
      desbetreffende mededeling in de Staatscourant wordt geplaatst.

      5 Aan de subsidievaststelling wordt in voorkomend geval de verplichting verbonden dat de subsidieontvanger binnen
      3 maanden nadat onherroepelijk is beslist omtrent de door de subsidieontvanger ingediende aanvraag tot verlening
      van een beheerssubsidie als bedoeld in [artikel 12a][ref10], voorzover deze beslissing strekt tot weigering van
      die beheerssubsidie, alsnog voldoet aan de voorwaarden, bedoeld in [artikel 12, onderdeel b][ref11], en ten bewijze
      daarvan binnen de genoemde termijn aan de Directeur Laser een gewaarmerkt afschrift van de akte van overdracht van
      gronden als bedoeld in [artikel 12, onderdeel b][ref12], of een afschrift van de overeenkomst tot beëindiging van
      een pachtverhouding als bedoeld in [artikel 12, onderdeel b][ref13], zendt.


