  - number: '5'
    text: |-
      1

      De minister verstrekt op aanvraag subsidie voor de beëindiging van een of meer veehouderijtakken op een bedrijf.

      2 Geen subsidie wordt verstrekt aan bedrijven die geheel of gedeeltelijk zijn gelegen in een door de minister
      in de Staatscourant bekend gemaakt gebied. Uitsluiting van subsidieverstrekking geschiedt uitsluitend ingeval
      het desbetreffende gebied is genoemd in de bijlage bij deze regeling en voor dit gebied voor de periode waarin
      aanvragen tot subsidieverlening kunnen worden ingediend het subsidieplafond, bedoeld in [artikel 11][ref1], nihil
      is.


      [ref1]: https://wetten.overheid.nl/BWBR0011234#Artikel11
    url: https://wetten.overheid.nl/BWBR0011234/2001-09-30#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011234
        artikel: '11'
        paragraaf: '3'
  - number: '6'
    text: |-
      De minister maakt in de Staatscourant de periode bekend waarin een aanvraag tot subsidieverlening als bedoeld in
      [artikel 5, eerste lid][ref1], kan worden ingediend. Daarbij maakt de minister tevens het subsidiebedrag, bedoeld
      in [artikel 14, eerste lid, onderdeel b, onder 1°, 2° en 3°][ref2] de subsidieplafonds bekend die voor de
      desbetreffende aanvraagperiode gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0011234#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011234#Artikel14
