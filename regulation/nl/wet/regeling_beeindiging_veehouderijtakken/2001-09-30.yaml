  - number: '28'
    text: |-
      Het Bureau Heffingen:

      a. registreert, indien de varkenstak wordt beëindigd, de kennisgeving van het vervallen van het varkensrecht
      en haalt het deel van het niet-gebonden mestproductierecht, bedoeld in [artikel 7, onderdeel c][ref1], door
      onmiddellijk nadat de subsidie is vastgesteld, doch uiterlijk twaalf maanden nadat de subsidie is verleend
      of, in het geval, bedoeld in [artikel 27, vierde lid][ref2], uiterlijk twaalf maanden na de overeenkomstig dat
      artikelonderdeel van toepassing zijnde datum;

      b. registreert, indien de kippen- en kalkoenentak wordt beëindigd, de kennisgeving van het vervallen
      van het pluimveerecht en haalt het deel van het niet-gebonden mestproductierecht, bedoeld in
      [artikel 7, onderdeel c][ref3], door onmiddellijk nadat de subsidie is vastgesteld, doch uiterlijk 12 maanden nadat
      de subsidie is verleend, of, in het geval, bedoel in [artikel 27, vierde lid][ref4], uiterlijk 12 maanden na de
      overeenkomstig dat onderdeel van toepassing zijnde datum;

      c. haalt, indien de rundveetak wordt beëindigd, het in [artikel 7, onderdelen b en c][ref5] bedoelde delen van
      het niet-gebonden mestproductierecht door, onmiddellijk nadat de subsidie is vastgesteld, doch uiterlijk vijftien
      maanden nadat de subsidie is verleend of, in het geval, bedoeld in [artikel 27, vierde lid][ref6], uiterlijk
      vijftien maanden na de overeenkomstig dat artikelonderdeel van toepassing zijnde datum.


