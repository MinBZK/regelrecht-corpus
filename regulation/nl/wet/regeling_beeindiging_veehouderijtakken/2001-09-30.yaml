  - number: '32'
    text: |-
      1 Een beschikking tot subsidieverlening of -vaststelling, voorzover deze betrekking heeft op een subsidie als
      bedoeld in [artikel 9][ref1], wordt ingetrokken indien binnen vijf jaren nadat deze is genomen, met betrekking
      tot het erfperceel of de tot het bedrijf behorende landbouwgrond voorzover deze niet overeenkomstig deze regeling
      aan BBL in eigendom is of zal worden overgedragen, een bestemmingsplan dan wel een besluit als bedoeld in
      [artikel 19 van de Wet op de Ruimtelijke Ordening][ref2] tot stand komt op basis waarvan woningbouw is toegelaten,
      tenzij de subsidieontvanger de desbetreffende gronden heeft vervreemd en ten genoegen van de minister aannemelijk
      kan maken:

      a. dat hij noch zijn wederpartij op het tijdstip waarop de vervreemding plaatsvond op de hoogte waren of konden
      zijn van het feit dat een zodanig bestemmingsplan of besluit werd of zou worden voorbereid, alsmede

      b. dat de voorwaarden waaronder de vervreemding plaatsgevonden heeft zodanig zijn dat daaruit blijkt dat
      daarbij geen rol heeft gespeeld de verwachting dat het gemeentebestuur nadien zou kunnen besluiten een zodanig
      bestemmingsplan of besluit te gaan voorbereiden en nemen.

      2 Een beschikking tot subsidieverlening of -vaststelling, voorzover deze betrekking heeft op een subsidie als
      bedoeld in [artikel 9][ref3], wordt ingetrokken indien de subsidieontvanger meer dan 1 jaar doch minder dan
      vijf jaren na het tijdstip van subsidievaststelling een aanvraag doet voor een bouwvergunning als bedoeld in
      [artikel 40 van de Woningwet][ref4] voor het bouwen van een woning op het erfperceel of de tot het bedrijf
      behorende landbouwgrond voorzover deze niet overeenkomstig deze regeling aan BBL in eigendom is of zal worden
      overgedragen.


