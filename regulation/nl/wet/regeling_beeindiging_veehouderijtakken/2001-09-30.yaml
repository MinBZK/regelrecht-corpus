  - number: '10'
    text: |-
      1 De subsidie, bedoeld in [artikel 9, eerste, tweede of derde lid][ref1], wordt slechts verstrekt voor de afbraak
      van gebouwen, die zijn gelegen in de gebieden die zijn opgenomen in de bijlage bij deze regeling.

      2 De gebouwen zijn gelegen in een gebied, opgenomen in de bijlage bij deze regeling, indien zij hoofdzakelijk zijn
      gelegen in het desbetreffende gebied.


      [ref1]: https://wetten.overheid.nl/BWBR0011234#Artikel9
