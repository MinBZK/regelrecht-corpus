  - number: '18'
    text: |-
      De aanvrager van een subsidie als bedoeld in [artikel 9, tweede lid][ref1]:

      a. verklaart, in het geval, bedoeld in [artikel 9, tweede lid, onderdeel a][ref2], dat de gebouwen, waarop de
      aanvraag betrekking heeft, op het moment van inwerkingtreding van deze regeling niet meer in gebruik waren voor de
      uitoefening van de veehouderij en sedertdien daarvoor ook niet meer zijn gebruikt;

      b. geeft, in het geval bedoeld in [artikel 9, tweede lid, onderdeel b][ref3], aan op welke locatie de samenvoeging
      van alle veehouderijactiviteiten van zijn bedrijf zal worden gerealiseerd en legt daarbij afschriften over van de
      aan hem verleende bouw- en milieuvergunningen, voorzover deze terzake zijn vereist;

      c. doet, in het geval bedoeld in [artikel 9, tweede lid, onderdeel c][ref4], gelijktijdig met zijn aanvraag aan de
      Directeur Laser een verklaring als bedoeld in [artikel 17, onderdeel e][ref5], toekomen.


