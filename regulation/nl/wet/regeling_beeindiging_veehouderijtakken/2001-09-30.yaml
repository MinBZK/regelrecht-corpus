  - number: '8'
    text: |-
      1 Geen subsidie wordt verleend indien ten aanzien van het bedrijf in de periode van de aanvraag tot verlening van
      een subsidie als bedoeld in [artikel 5, eerste lid][ref1], tot het tijdstip van de registratie van de kennisgeving
      van het vervallen van het varkensrecht, onderscheidenlijk van het pluimveerecht, onderscheidenlijk van de
      doorhaling van het deel van het niet-gebonden mestproductierecht, bedoeld in [artikel 28, eerste lid][ref2]:

        - een kennisgeving van overgang van het varkensrecht als bedoeld in
      [artikel 18 van de Wet herstructurering varkenshouderij][ref3] met betrekking tot de overgang van het varkensrecht
      of een deel daarvan naar een ander bedrijf is gedaan, indien de varkenstak wordt beëindigd;
        - een kennisgeving van overgang van het pluimveerecht als bedoeld in
      [artikel 58q, eerste lid, van de Meststoffenwet][ref4] met betrekking tot de overgang van het pluimveerecht of een
      deel daarvan naar een ander bedrijf is gedaan, indien de kippen- en kalkoenentak wordt beëindigd;
        - een kennisgeving van verplaatsing van de mestproductie daarvan naar een ander bedrijf is gedaan, indien de
      rundveetak wordt beëindigd.

      2 Voor de beëindiging van de varkenstak wordt geen subsidie verleend indien de aanvrager een subsidie
      is verleend uit hoofde van de Beëindigingsregeling varkensbedrijven in de EHS of uit hoofde van de
      [Opkoopregeling varkensrechten][ref5], of indien de aanvrager uit anderen hoofde een subsidie is verleend ter zake
      van de beëindiging van de varkenshouderij op het desbetreffende bedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0011234#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011234#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0009542#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0004054#Artikel58q
      [ref5]: https://wetten.overheid.nl/BWBR0010147
