  - number: 12a
    text: |-
      De voorwaarden, bedoeld in [artikel 12, eerste lid, onderdeel b][ref1], gelden niet
      ten aanzien van gronden met betrekking tot welke de aanvrager bij zijn aanvraag tot
      subsidieverlening aangeeft voor de aanvraag tot vaststelling van de subsidie als bedoeld in
      [artikel 9, eerste, tweede of derde lid][ref2], een aanvraag te zullen indienen voor een beheerssubsidie
      als bedoeld in [artikel 1, eerste lid, onderdeel t, van de Subsidieregeling agrarisch natuurbeheer][ref3] of
      [artikel 1, eerste lid, onderdeel l, van de Subsidieregeling natuurbeheer 2000][ref4], met dien verstande dat als
      een zodanige aanvraag niet binnen de genoemde termijn is ingediend, of als een zodanige aanvraag onherroepelijk is
      afgewezen, aan de voorwaarden, bedoeld in [artikel 12, onderdeel b][ref5], alsnog moet worden voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0011234#Artikel12
