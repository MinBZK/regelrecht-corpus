  - number: '14'
    text: |-
      1 - Voor een bedrijf dat voldoet aan de gestelde voorwaarden worden, voor zover van toepassing, de volgende
      bedragen verstrekt: een bedrag voor de overdracht aan BBL van het tot het bedrijf behorende oppervlakte grond,
      en een subsidie die de som is van: 1°. een subsidiebedrag per varkenseenheid vermenigvuldigd met het aantal
      varkenseenheden dat overeenkomt met het niet-grondgebonden deel van het varkensrecht indien de varkenstak wordt
      beëindigd, 2°. een subsidiebedrag per kilogram fosfaat vermenigvuldigd met het aantal kilogrammen fosfaat dat
      overeenkomt met het pluimveerecht, indien de kippen- en kalkoenentak wordt beëindigd, verminderd met het op het
      tijdstip van de aanvraag tot subsidieverlening geregistreerde grondgebonden mestproductierecht, voorzover de
      desbetreffende hoeveelheid fosfaat niet tevens in mindering is gebracht bij de berekening van het subsidiebedrag
      onder 3°; 3°. een subsidiebedrag per kilogram fosfaat, vermenigvuldigd met het aantal kilogrammen fosfaat
      dat overeenkomt met de in 1999 op het desbetreffende bedrijf geproduceerde hoeveelheid dierlijke meststoffen
      afkomstig van rundvee, indien de rundveetak wordt beëindigd, voorzover deze hoeveelheid niet groter is dan de
      in 1999 geproduceerde hoeveelheid dierlijke meststoffen afkomstig van andere diersoorten dan varkens verminderd
      met het op het tijdstip van de aanvraag tot subsidieverlening geregistreerde grondgebonden mestproductierecht,
      4°. een bedrag voor de afbraak van de in [artikel 10][ref1] bedoelde gebouwen van 50 gulden ofwel 22,69 euro per
      vierkante meter grondoppervlakte van die gebouwen, en 5°. een bedrag overeenkomend met een door de minister in de
      Staatscourant bekend te maken percentage van de op basis van de gecorrigeerde vervangingswaarde, overeenkomstig
      [artikel 17, derde lid, tweede volzin van de Wet waardering onroerende zaken][ref2], ten laste van de aanvrager
      vastgestelde waarde van de onder 4° bedoelde gebouwen, waarbij voor de bepaling van deze waarde wordt uitgegaan van
      de waarde van deze gebouwen op het tijdstip van de aanvraag tot subsidieverlening en een bij de afschrijving van
      deze gebouwen te hanteren restwaarde van 25% van de vervangingswaarde.

      2 Het gedeelte van de subsidie dat betrekking heeft op het niet-gebonden mestproductierecht is niet groter dan
      het bedrag per kilogram fosfaat, bedoeld in het eerste lid, onderdeel b, onder 2°, vermenigvuldigd met het aantal
      kilogrammen fosfaat dat overeenkomt met het voor het bedrijf op het tijdstip van de aanvraag tot subsidieverlening
      geregistreerde niet-gebonden mestproductierecht.

      3 Indien in de periode van 10 september 1999 tot het tijdstip van de aanvraag tot een subsidieverlening van een
      subsidie als bedoeld in [artikel 5, eerste lid][ref3] een kennisgeving van verplaatsing met betrekking tot de
      overgang van het mestproductierecht of een deel daarvan naar een ander bedrijf is gedaan, wordt het gedeelte van
      de subsidie dat overeenkomt met de som van de subsidie voor het pluimveerecht en de subsidie dat overeenkomt met
      de som van de subsidie voor het pluimveerecht en de subsidie voor het niet-gebonden mestproductierecht verminderd
      met een bedrag dat wordt berekend door het deel van het niet-gebonden mestproductierecht waar de kennisgeving van
      verplaatsing betrekking op heeft te vermenigvuldigen met het bedrag per kilogram fosfaat, bedoeld in het eerste
      lid, onderdeel b, onder 3°.

      4 Indien in de periode van 10 september 1999 tot het tijdstip van de aanvraag tot subsidieverlening van een
      subsidie als bedoeld in [artikel 5, eerste lid][ref4] de tot het bedrijf behorende oppervlakte landbouwgrond is
      verkleind, wordt het gedeelte van de subsidie voor het niet-gebonden mestproductierecht verminderd met een bedrag
      dat wordt berekend door het grondgebonden mestproductierecht overkomend met de oppervlakte waarmee de tot het
      bedrijf behorende oppervlakte landbouwgrond is verkleind te vermenigvuldigen met het bedrag per kilogram fosfaat,
      bedoeld in het eerste lid, onderdeel b, onder 3°.


      [ref1]: https://wetten.overheid.nl/BWBR0011234#Artikel10
