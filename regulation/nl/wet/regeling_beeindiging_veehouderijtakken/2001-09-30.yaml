  - number: '12'
    text: |-
      1 De subsidie, bedoeld in [artikel 9, eerste, tweede of derde lid][ref1], wordt slechts verstrekt indien de
      aanvrager aan elk van de volgende voorwaarden voldoet:

      a. de gebouwen, bestemd voor de uitoefening van de veehouderijtakken die overeenkomstig [artikel 7][ref2] worden
      of zijn beëindigd, dan wel, indien het een subsidie betreft als bedoeld in [artikel 9, tweede lid][ref3], de in dat
      lid bedoelde gebouwen, worden afgebroken, het sloopafval en puin worden van het desbetreffende perceel afgevoerd,
      de tot de afgebroken opstallen behorende putten, funderingen en dergelijke worden verwijderd en het perceel waar de
      sloop heeft plaatsgevonden wordt geëgaliseerd;

      b. de tot het bedrijf behorende oppervlakte landbouwgrond, met uitzondering van het erfperceel, waarvan de
      oppervlakte ten hoogste een hectare bedraagt, voorzover die in een reservaatsgebied, een natuurontwikkelingsproject
      of een natuurgebied ligt, wordt in eigendom aan BBL overgedragen, dan wel de pacht wordt beëindigd voorzover de
      betrokken grond eigendom is van Staatsbosbeheer of van een particuliere natuurbeschermingsorganisatie;

      c. bij de aanvraag doet de aanvrager ten behoeve van BBL melding van de tot het bedrijf behorende oppervlakte
      landbouwgrond, voorzover deze bij hem in eigendom is en is gelegen in een aankoopgebied of een ruilgebied;

      d. de aanvrager verklaart ermee bekend te zijn dat kan worden overgegaan tot verwijdering of verkleining
      van het agrarisch bouwblok, overeenkomend met de oppervlakte en locatie van de in het eerste lid,
      onderdeel a, bedoelde gebouwen en maakt geen bezwaar tegen het voorbereidingsbesluit als bedoeld in
      [artikel 21 van de Wet op de Ruimtelijke Ordening][ref4] of een wijziging van het bestemmingsplan als bedoeld
      in [artikel 10 van de Wet op de Ruimtelijke Ordening][ref5], strekkende tot verwijdering of verkleining van het
      agrarisch bouwblok, overeenkomend met de oppervlakte en locatie van de in het eerste lid, onderdeel a bedoelde
      gebouwen;

      e. de aanvrager heeft in de periode gelegen tussen de inwerkingtreding van deze regeling en de aanvraag tot
      subsidieverlening bij het bestuur van de desbetreffende gemeente geen aanvraag ingediend voor een bouwvergunning
      voor de oprichting van gebouwen bestemd voor de uitoefening van een of meer veehouderijtakken op de locatie van
      de in het eerste lid, onderdeel a, bedoelde gebouwen en dient evenmin een aanvraag in voor een bouwvergunning
      voor de oprichting van deze en andere agrarische opstallen op de desbetreffende locatie vóór het verstrijken
      van zes maanden na indiening van de aanvraag tot subsidieverlening, tenzij inmiddels het in onderdeel d bedoelde
      voorbereidingsbesluit is genomen of het bestemmingsplan is gewijzigd.

      2 De voorwaarden, bedoeld in het eerste lid, onderdelen a en d, zijn niet van toepassing op gebouwen waarvoor
      de aanvrager bij zijn aanvraag een verklaring van het bestuur van de desbetreffende gemeente kan overleggen
      dat afbraak daarvan niet zal worden toegestaan, en evenmin op gebouwen die onlosmakelijk verbonden zijn met het
      woonhuis en daarmee architectonisch een geheel vormen.


      [ref1]: https://wetten.overheid.nl/BWBR0011234#Artikel9
