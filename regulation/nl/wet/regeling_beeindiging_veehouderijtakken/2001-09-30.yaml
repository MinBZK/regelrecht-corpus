  - number: '31'
    text: |-
      De minister kan op verzoek van de subsidie-ontvanger voorschotten verlenen tot ten hoogste 80% van de verleende
      subsidie, bedoeld in [artikel 14, eerste lid, onderdeel b, onder 3°][ref1].


