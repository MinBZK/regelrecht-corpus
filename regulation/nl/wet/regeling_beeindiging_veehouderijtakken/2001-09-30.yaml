  - number: '16'
    text: |-
      1 Een aanvraag wordt ingediend bij de Directeur Laser, te Diemen.

      2 De aanvraag wordt ingediend met gebruikmaking van een daartoe door de Directeur Laser ter beschikking gesteld
      formulier.

      3 De aanvraag kan worden ingediend door de belanghebbende op wiens naam onderscheidenlijk het varkensrecht,
      het pluimveerecht of het niet-gebonden mestproductierecht bij het Bureau Heffingen staat geregistreerd, dan
      wel, in de gevallen, bedoeld in [artikel 9, tweede lid][ref1], door de eigenaar van de gebouwen en in het
      geval, bedoeld in [artikel 9, derde lid][ref2], door de subsidieontvanger van een subsidie als bedoeld in
      [artikel 5, eerste lid][ref3].

      4 De aanvraag wordt mede ondertekend door de hypotheekhouder die een aanmelding als bedoeld in
      artikel 5, eerste lid, van de Regeling leges en blokkade Wet herstructurering varkenshouderij,
      artikel 3, eerste lid, van de Regeling leges en blokkade pluimveerechten Meststoffenwet of
      [artikel 3, eerste lid, van de Regeling blokkade verplaatsing mestproductie][ref4], heeft gedaan.

      5 De aanvragen worden in behandeling genomen in volgorde van ontvangst van de volledig ingediende aanvragen. Bij
      gelijktijdige ontvangst wordt de volgorde van behandeling door loting bepaald.

      6 Indien bij toewijzing van alle aanvragen voor een subsidie het subsidieplafond voor zover betrekking hebbend
      op [artikel 14, eerste lid, onderdeel b, onder 4° en 5°][ref5], zou worden overschreden, worden, in afwijking
      van het vijfde lid, de aanvragen in behandeling genomen in volgorde van een rangschikking, waarbij de aanvragen
      die betrekking hebben op bedrijven die geheel of gedeeltelijk gelegen zijn in een reservaatsgebied, een
      natuurontwikkelingsproject of natuurgebied als eerste worden gerangschikt in volgorde van ontvangst van de volledig
      ingediende aanvragen en vervolgens de aanvragen die betrekking hebben op bedrijven die niet geheel of gedeeltelijk
      gelegen zijn in een reservaatsgebied, een natuurontwikkelingsproject of natuurgebied, eveneens in volgorde van
      ontvangst van de volledig ingediende aanvragen. Bij gelijktijdige ontvangst wordt de volgorde van behandeling door
      loting bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0011234#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0011234#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0011234#Artikel5
