$id: wet_deelneming_grevelingen
regulatory_layer: WET
publication_date: '2005-12-15'
valid_from: '1985-08-14'
valid_to: '2005-12-22'
bwb_id: BWBR0003806
url: https://wetten.overheid.nl/BWBR0003806/1985-08-14
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is dat het Rijk deelneemt aan een gemeenschappelijke
    regeling ter behartiging in onderlinge samenhang van de belangen van natuur, landschap en openluchtrecreatie in het
    gebied van De Grevelingen, en dat het ingevolge artikel 41, tweede lid, van de Wet gemeenschappelijke regelingen
    noodzakelijk is de deelneming door het Rijk aan zulk een regeling alsmede de gevolgen daarvan bij wet te regelen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003806/1985-08-14#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Het Rijk neemt deel aan de gemeenschappelijke regeling waarbij een rechtspersoonlijkheid bezittend lichaam, genaamd
      Natuur- en Recreatiegebied De Grevelingen - verder te noemen het lichaam - wordt gevormd.
    url: https://wetten.overheid.nl/BWBR0003806/1985-08-14#Artikel1
  - number: '2'
    text: |-
      Uittreding door het Rijk uit de in [artikel 1][ref1] bedoelde gemeenschappelijke regeling alsmede medewerking door
      het Rijk aan de opheffing daarvan geschiedt bij een wet, die mede de gevolgen hiervan regelt.


      [ref1]: https://wetten.overheid.nl/BWBR0003806#Artikel1
    url: https://wetten.overheid.nl/BWBR0003806/1985-08-14#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003806
        artikel: '1'
  - number: '3'
    text: |-
      De kosten van het tot stand brengen van de algemene voorzieningen in het gebied waarop de in [artikel 1][ref1]
      bedoelde gemeenschappelijke regeling van toepassing is komen ten laste van het Rijk.


      [ref1]: https://wetten.overheid.nl/BWBR0003806#Artikel1
    url: https://wetten.overheid.nl/BWBR0003806/1985-08-14#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003806
        artikel: '1'
  - number: '4'
    text: Een nadelig saldo der rekening van baten en lasten van het lichaam komt voor 60 procent ten laste van het Rijk.
    url: https://wetten.overheid.nl/BWBR0003806/1985-08-14#Artikel4
  - number: '5'
    text: Deze wet kan worden aangehaald als "Wet deelneming Grevelingen".
    url: https://wetten.overheid.nl/BWBR0003806/1985-08-14#Artikel5
