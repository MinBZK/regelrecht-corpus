preamble:
  text: |-
    Gezien het advies van de Voorlopige Commissie Nationale Parken van 12 juni 1993;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0006031/1996-01-24#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a

              *minister:*


              Minister van Landbouw, Natuurbeheer en Visserij;



            b

              *overlegorgaan:*


              overlegorgaan als bedoeld in [artikel 3][ref1];



            c

              *nationaal park:*


              gebied zoals omschreven in het Structuurschema Natuur- en Landschapsbehoud (Kamerstukken II, 1980–1981,
      16820, nrs. 1–2, blz. 122).


      [ref1]: https://wetten.overheid.nl/BWBR0006031#Artikel3
    url: https://wetten.overheid.nl/BWBR0006031/1996-01-24#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006031
        artikel: '3'
  - number: '2'
    text: |-
      Als nationaal park wordt aangewezen het natuurgebied de Groote Peel, zoals aangegeven op de kaart die als bijlage
      behoort bij deze regeling.
    url: https://wetten.overheid.nl/BWBR0006031/1996-01-24#Artikel2
  - number: '3'
    text: Er is een overlegorgaan nationaal park de Groote Peel.
    url: https://wetten.overheid.nl/BWBR0006031/1996-01-24#Artikel3
  - number: '4'
    text: |-
      Het overlegorgaan heeft tot taak zorg te dragen voor de inrichting en het beheer van het nationaal park de Groote
      Peel. Daartoe behoort onder meer:

      a. het streven naar onderlinge afstemming van alle voor de inrichting en het beheer van belang zijnde plannen en
      activiteiten;

      b. het doen van voorstellen aan de minister voor de besteding van de voor het nationaal park de Groote Peel
      beschikbare middelen in het kader van een jaarlijks voor te stellen activiteitenprogramma met bijbehorende
      begroting;

      c. het opstellen van een meerjarenprogramma voorlichting en educatie, ter bevordering en coördinatie van
      voorlichting en educatie met betrekking tot het nationaal park de Groote Peel.
    url: https://wetten.overheid.nl/BWBR0006031/1996-01-24#Artikel4
  - number: '5'
    text: |-
      Het overlegorgaan voert zijn taak uit overeenkomstig het beheers- en inrichtingsplan voor het nationaal park
      de Groote Peel van juli 1991, met inachtneming van de daarbij bij brief van de Staatssecretaris van Landbouw,
      Natuurbeheer en Visserij van 24 november 1992 (NBLF. 928644) geplaatste kanttekeningen.
    url: https://wetten.overheid.nl/BWBR0006031/1996-01-24#Artikel5
  - number: '6'
    text: |-
      In het overlegorgaan hebben zitting:

      a. één door de minister te benoemen lid, tevens voorzitter;

      b. acht door de minister te benoemen leden, als vertegenwoordiger en op voordracht van onderscheidenlijk:

      1º. de provincie Noord-Brabant;

      2º. de provincie Limburg;

      3º. de gemeente Asten;

      4º. de gemeente Meijel;

      5º. de gemeente Nederweert;

      6º. het waterschap de Aa;

      7º. het waterschap Midden Limburg;

      8º. het Staatsbosbeheer.

      c. één lid als vertegenwoordiger van de kleine particuliere eigenaren, door de minister te benoemen op voordracht
      van het overlegorgaan;

      d. de Directeur van de Directie Zuid van het Ministerie van Landbouw, Natuurbeheer en Visserij.
    url: https://wetten.overheid.nl/BWBR0006031/1996-01-24#Artikel6
  - number: '7'
    text: |-
      1 Het secretariaat van het overlegorgaan berust bij een door de provincie Noord-Brabant te benoemen ambtenaar van
      die provincie.

      2 Het overlegorgaan regelt de openbaarheid en de plaats van zijn vergadering alsmede de overige aspecten van zijn
      inrichting en werkwijze.

      3 Het overlegorgaan brengt jaarlijks van zijn werkzaamheden verslag uit aan de minister.
    url: https://wetten.overheid.nl/BWBR0006031/1996-01-24#Artikel7
  - number: '8'
    text: |-
      Indien in het overlegorgaan belangrijke verschillen van inzicht blijken te bestaan, doet de voorzitter van het
      overlegorgaan daarvan mededeling aan de minister, die daarop de naar zijn oordeel nodige stappen onderneemt.
    url: https://wetten.overheid.nl/BWBR0006031/1996-01-24#Artikel8
  - number: '9'
    text: De Beschikking aanwijzing nationaal park in oprichting de Groote Peel wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0006031/1996-01-24#Artikel9
  - number: '10'
    text: |-
      1 Deze regeling treedt in werking met ingang van 1 juli 1993.

      2 Deze regeling kan worden aangehaald als: Regeling aanwijzing nationaal park de Groote Peel.

      Deze regeling zal met de toelichting in de Staatscourant worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0006031/1996-01-24#Artikel10
