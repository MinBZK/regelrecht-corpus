  - number: '5'
    text: |-
      1 Het uitvoeren van een SAR-vlucht of politievlucht buiten de daglichtperiode, bedoeld in
      [artikel 44, eerste lid, onderdeel a, van het Luchtverkeersreglement][ref1] is toegestaan indien wordt voldaan aan
      de volgende voorschriften:

      a. de helikopter is voorzien van de uitrusting, bedoeld in JAR-OPS 3, subpart K, Instruments and equipment
      en subpart L, Communication and navigation equipment voor zover betrekking hebbend op het vliegen buiten de
      daglichtperiode;

      b. de gezagvoerder voldoet aan de eisen in Appendix I, JAR-OPS 3.005 (d) (c) (3) para’s (ii), en (iii); en aan JAR-
      OPS 3, subpart N, ‘Flight Crew’;

      c. een SSR-transponder met de Mode S wordt gebruikt, ongeacht de classificatie van het luchtruim of de vlieghoogte;

      d. voor het uitvoeren van de vlucht is een tweezijdige radioverbinding tot stand gebracht met de betrokken
      luchtverkeersdienst en wordt voortdurend op de aangewezen radiofrequentie geluisterd;

      2 De voorschriften, bedoeld in het eerste lid, onderdelen c en d, zijn van overeenkomstige toepassing op HEMS-
      vluchten buiten de daglichtperiode.


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel44
    url: https://wetten.overheid.nl/BWBR0021092/2013-01-01#Artikel5
