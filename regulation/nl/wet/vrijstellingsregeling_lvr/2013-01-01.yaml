        artikel: '44'
  - number: '6'
    text: |-
      Voor het uitvoeren van een vlucht met een vrije ballon buiten de daglichtperiode, bedoeld in
      [artikel 44, eerste lid, onderdeel a, van het Luchtverkeersreglement][ref1] gelden als eisen:

      a. de gezagvoerder is in het bezit van een geldig bewijs van bevoegdheid als ballonvaarder en heeft als
      gezagvoerder ten minste 100 uur aan ballonvaarten uitgevoerd;

      b. een vlucht wordt alleen uitgevoerd indien de weersomstandigheden zodanig zijn dat het vliegzicht minimaal 5 km
      bedraagt en de afstand van het luchtvaartuig tot de wolken horizontaal minimaal 1500 m en verticaal 300 m (1000
      voet) boven gemiddeld zeeniveau bedraagt;

      c. de minimum vlieghoogte bedraagt 600 m (2000 voet) boven gemiddeld zeeniveau;

      d. een vlucht wordt niet uitgevoerd in de Amsterdam CTA’s, de Schiphol CTR, de Schiphol TMA’s, de Rotterdam CTR en
      de Rotterdam TMA 1 als bedoeld in de [Regeling luchtverkeersdienstverlening][ref2];

      e. tijdens de vlucht zijn de volgende, naar behoren functionerende, instrumenten, luchtvaartradiocommunicatie- en
      identificatie-apparatuur aan boord:

      1°. een drukhoogtemeter;

      2°. een stijgsnelheidsmeter;

      3°. een magnetisch kompas;

      4°. twee VHF-zendontvanginstallaties met een frequentieseparatie van 25 kHZ, waarmee voortdurend een tweezijdige
      radioverbinding kan worden onderhouden met de betrokken luchtverkeersleidingsdiensten op de frequenties zoals
      gepubliceerd in de luchtvaartgids, bedoeld in [artikel 60, onderdeel a, van het Luchtverkeersreglement][ref3];

      5°. een SSR-transponder met de Mode S wordt gebruikt, ongeacht de classificatie van het luchtruim of de
      vlieghoogte;

      6°. noodverlichting in de vorm van zaklantaarns;

      f. tijdens de vlucht wordt een ononderbroken wit licht gevoerd dat op ten minste vijf en ten hoogste tien meter
      onder de mand is aangebracht;

      g. ten minste twee uren vóór de aanvang van de vlucht wordt een vliegplan voorgelegd aan de supervisor van AOCS
      Nieuw Milligen, bedoeld in [artikel 1 van de Regeling luchtverkeersdienstverlening][ref4] onder opgave van:

      1. registratiekenmerk van de vrije ballon;

      2. plaats van vertrek;

      3. verwachte tijd van opstijging, en

      4. maximum vlieghoogte;

      h. ongeacht de plaats van opstijging wordt een vliegplan voor de vlucht met de vrije ballon ten minste twaalf uren
      voor de verwachte tijd van opstijging ingeleverd op de adressen EHMCZRZX en EHAAZRZX;

      i. de voorbereiding van de vlucht met een vrije ballon is zodanig dat:

      1. gelet op de hoeveelheid brandstof tot minimaal één uur na aanvang van de daglichtperiode kan worden gevlogen;

      2. rekening houdend met een ruime wijziging van de windrichting en snelheid van de wind, er geen
      luchtverkeerleidingsgebieden zullen worden binnen gevlogen die niet zijn vermeld in het vliegplan;

      j. het landen vindt uitsluitend plaats binnen de daglichtperiode.


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0009899
