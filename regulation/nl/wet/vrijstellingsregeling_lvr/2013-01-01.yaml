  - number: '4'
    text: |-
      1 De gezagvoerder van een luchtvaartuig die deelneemt aan een luchtvaartvertoning waarvoor krachtens
      [artikel 17 van de Luchtvaartwet][ref1] een vergunning is verleend, mag beneden de minimum-VFR-vlieghoogte, bedoeld
      in [artikel 45, eerste lid, van het Luchtverkeersreglement][ref2] vliegen.

      2 De minimum-VFR-vlieghoogte, bedoeld in het eerste lid, is niet lager dan de vlieghoogte als vermeld in een
      vertoninglicentie als bedoeld in [artikel 1, tweede lid, onderdeel s, van de Regeling luchtvaartvertoningen][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel17
