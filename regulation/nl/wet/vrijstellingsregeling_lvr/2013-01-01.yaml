  - number: '2'
    text: |-
      1 Dit artikel is van toepassing op vluchten die niet plaatsvinden binnen een plaatselijk
      luchtverkeersleidingsgebied of boven gebieden met aaneengesloten bebouwing, industrie- en
      havengebieden daaronder begrepen, of boven mensenverzamelingen en die worden uitgevoerd met
      een vliegtuig of helikopter door een gezagvoerder die beschikt over een CPL als bedoeld in
      [artikel 2, eerste lid, onderdeel c, van het Besluit bewijzen van bevoegdheid voor de luchtvaart][ref1] voor:

      a. het controleren van pijpleidingen en het hoogspanningsnetwerk;

      b. het inmeten van dijken, wegen, waterkeringen en andere infrastructurele werken;

      c. het maken van audio of visuele opnamen ten behoeve van professionele nieuwsgaring en cartografie;

      d. het loodsen door een loods als bedoeld in [artikel 1 van de Loodsenwet][ref2];

      e. het transport van mensen of goederen in de offshore;

      f. het uitvoeren van milieucontroles;

      g. surveillance door de Kustwacht.

      2 Voor het uitvoeren van een vlucht als bedoeld in het eerste lid waarbij gevlogen wordt beneden de minimum-VFR-
      vlieghoogte, bedoeld in [artikel 45, eerste lid, onderdeel b, van het Luchtverkeersreglement][ref3] gelden als
      eisen:

      a. de minimum toegestane vlieghoogte bedraagt 60 meter (200 voet) boven de grond of het water, maar tenminste 30
      meter (100 voet) boven de hoogste hindernis gelegen binnen een afstand van 100 meter van de helikopter of 600 meter
      van het vliegtuig;

      b. er wordt niet gevlogen beneden de minimum-VFR-vlieghoogte over vogelreservaten, zoals gepubliceerd in de
      luchtvaartgids;

      c. er wordt uitsluitend gevlogen beneden de minimum-VFR-vlieghoogte gedurende de periode dat dit noodzakelijk is
      voor het doel van de vlucht.


      [ref1]: https://wetten.overheid.nl/BWBR0010629#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004365#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0005775#Artikel45
