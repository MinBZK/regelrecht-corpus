  - number: 6a
    text: |-
      Het uitvoeren van een vlucht met een vliegtuig buiten de daglichtperiode, bedoeld in
      [artikel 44, eerste lid, onderdeel a, van het Luchtverkeersreglement][ref1] is toegestaan, indien:

      a. de vlucht wordt uitgevoerd in het kader van de vliegopleiding voor het verkrijgen van een CPL(A) als bedoeld in
      [artikel 2, eerste lid, onderdeel c, van het Besluit bewijzen van bevoegdheid voor de luchtvaart][ref2];

      b. de vlucht noodzakelijk is om te voldoen aan de opleidingsvereisten die krachtens het in onderdeel a bedoelde
      artikel zijn gesteld aan het verkrijgen van het CPL;

      c. wordt voldaan aan de volgende voorschriften:

      1. voor aanvang van de vlucht wordt een vliegplan ingediend;

      2. voor het uitvoeren van de vlucht is een tweezijdige radioverbinding tot stand gebracht met de betrokken
      luchtverkeersdienst en wordt voortdurend op de aangewezen radiofrequentie geluisterd;

      3. het vliegzicht bedraagt ten minste 8 km en de afstand tot de wolken ten minste 1500 m horizontaal en 300 m (1000
      voet) verticaal;

      4. de vlucht wordt uitgevoerd op ten minste 300 m (1000 voet) boven de hoogste hindernis binnen een afstand van 8
      km van de gegiste positie van het vliegtuig, tenzij een lagere hoogte noodzakelijk is om op te stijgen van of te
      landen op een luchthaven of naderings- of vertrekprocedures alsmede luchtverkeerspatronen uit te voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0010629#Artikel2
