        artikel: '45'
  - number: '3'
    text: |-
      1 In afwijking van [artikel 45, eerste lid, van het Luchtverkeersreglement][ref1] bedraagt de minimum-VFR-
      vlieghoogte voor een HEMS-vlucht, SAR-vlucht of politievlucht:

      a. boven gebieden met aaneengesloten bebouwing, industrie- en havengebieden, dan wel boven mensenverzamelingen
      90 meter (300 voet) boven de grond of het water, doch tenminste 30 meter (100 voet) boven de hoogste hindernis,
      gelegen binnen een afstand van 100 meter van de helikopter of 600 meter van het vliegtuig;

      b. elders dan in onderdeel a aangegeven: 60 meter (200 voet) boven de grond of het water, doch tenminste 30 meter
      (100 voet) boven de hoogste hindernis, gelegen binnen een afstand van 100 meter van de helikopter of 600 meter van
      het vliegtuig;

      2 Er wordt uitsluitend beneden de minimum-VFR-vlieghoogte, bedoeld in
      [artikel 45, eerste lid, van het Luchtverkeersreglement][ref2], gevlogen gedurende de periode dat dit noodzakelijk
      is voor het doel van de vlucht als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0005775#Artikel45
