  text: |-
    De Staatssecretaris van Verkeer en Waterstaat, handelende in overeenstemming met de Staatssecretaris van Defensie;

    Gelet op de artikelen 44, vierde lid, en 45, vierde lid, van het Luchtverkeersreglement;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0021092/2013-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      HEMS-vlucht: vlucht met een helikopter uitgevoerd krachtens een AOC met voorziening A3-Emergency medical service;

      JAR-OPS 3: sectie 1 van het technisch voorschrift, vastgesteld door de Joint Aviation Authorities, betreffende
      uitvoering van een vlucht met een helikopter;

      luchtvaartgids: de luchtvaartgids, bedoeld in [artikel 60, onderdeel a, van het Luchtverkeersreglement][ref1];

      politievlucht: vlucht uitgevoerd met een vliegtuig of helikopter in het kader van de politietaak, bedoeld in
      [artikel 3 van de Politiewet 2012][ref2];

      SAR-vlucht: vlucht uitgevoerd met een vliegtuig of helikopter door de SAR-dienst als bedoeld in
      [artikel 1 van de Regeling inzake de SAR-dienst 1994][ref3] met als doel de opsporing en redding van mens of dier
      die zich in een levensbedreigende omstandigheid bevindt.


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel3
