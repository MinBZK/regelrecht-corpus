      De [artikelen 3][ref1] en [5][ref2] zijn van overeenkomstige toepassing op een politievlucht uitgevoerd
      door de bevoegde autoriteit van de Bondsrepubliek Duitsland in Nederland met een luchtvaartuig als bedoeld in
      artikel 25, vierde lid, van het op 2 maart 2005 tot stand gekomen Verdrag tussen het Koninkrijk der Nederlanden
      en de Bondsrepubliek Duitsland inzake de grensoverschrijdende politiële samenwerking en de samenwerking in
      strafrechtelijke aangelegenheden (Trb. 2005, 86).


      [ref1]: https://wetten.overheid.nl/BWBR0021092#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0021092#Artikel5
