        artikel: '5'
  - number: '8'
    text: |-
      Voor het uitvoeren van een VFR-vlucht met een militair luchtvaartuig in luchtverkeersdienstverleningsgebieden met
      klasse A, als bedoeld in [artikel 44, eerste lid, onderdeel b, van het Luchtverkeersreglement][ref1], gelden als
      eisen:

      a. het luchtverkeersdienstverleningsgebied valt op basis van [artikel 13][ref2] dan wel
      [artikel 17 van de Regeling luchtverkeersdienstverlening][ref3] onder de verantwoordelijkheid van AOCS Nieuw
      Milligen, en

      b. de vluchten worden gecontroleerd uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0009899#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0009899#Artikel17
