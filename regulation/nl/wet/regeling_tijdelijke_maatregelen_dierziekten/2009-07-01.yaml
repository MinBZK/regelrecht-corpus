  - number: '2.7'
    text: |-
      1 Het is verboden een vervoermiddel als bedoeld in [artikel 2.6, eerste lid][ref1], dat in een derde land is
      gebruik om gevogelte of broedeieren te vervoeren, alsmede in lidstaten van de Europese Unie waar een uitbraak van
      hoogpathogene aviaire Influenza is bevestigd, vanuit deze derde landen en lidstaten, anders dan in doorvoer, leeg
      in Nederland te brengen.

      2 Het verbod in het eerste lid is niet van toepassing indien wordt voldaan aan het bepaalde in [artikel 2.6][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022975#Artikel2.6
      [ref2]: https://wetten.overheid.nl/BWBR0022975#Artikel2.6
