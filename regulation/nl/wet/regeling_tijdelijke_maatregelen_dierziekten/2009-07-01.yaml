        bwb_id: BWBR0022975
        artikel: 3.3.1
        paragraaf: '3.3'
      - id: ref2
        bwb_id: BWBR0022975
        artikel: 3.3.2
        paragraaf: '3.3'
      - id: ref3
        bwb_id: BWBR0014538
        artikel: '3'
  - number: 3.3.4
    text: >-
      De houder van de gevaccineerde herkauwers of kameelachtigen bewaart de factuur van de dierenarts, die betrekking
      heeft op de vaccinatie overeenkomstig deze regeling, gedurende drie jaren vanaf dagtekening.
    url: https://wetten.overheid.nl/BWBR0022975/2009-07-01#Artikel3.3.4
  - number: 3.3.5
    text: |-
      1 De subsidie, bedoeld in [artikel 3.3.1, eerste lid][ref1], bedraagt:

      a. per gevaccineerd rund: € 4,00;

      b. per gevaccineerd(e) schaap of geit: € 1,50;

      c. per gevaccineerde overige herkauwer of kameelachtige: € 4,00.

      2 De in het eerste lid genoemde bedragen zijn exclusief BTW.


      [ref1]: https://wetten.overheid.nl/BWBR0022975#Artikel3.3.1
    url: https://wetten.overheid.nl/BWBR0022975/2009-07-01#Artikel3.3.5
    references:
      - id: ref1
        bwb_id: BWBR0022975
        artikel: 3.3.1
        paragraaf: '3.3'
  - number: 3.3.6
    text: Het subsidieplafond bedraagt € 12 miljoen.
    url: https://wetten.overheid.nl/BWBR0022975/2009-07-01#Artikel3.3.6
  - number: 5.1.1
    text: |-
      In deze paragraaf wordt verstaan onder:

      a. tijdstip: tijdstip waarop de verdenking is ontstaan dat een dier lijdt aan een besmettelijke dierziekte als
      bedoeld in [artikel 24 van de wet][ref1];

      b. verdachte dieren: dieren die op basis van [artikel 2, onderdeel a, van het Besluit verdachte dieren][ref2] zijn
      aangemerkt als verdacht van een besmetting met Q-koorts;

      c. lammerperiode: periode waarin schapen of geiten jongen werpen;

      d. mest: mest geproduceerd door een schaap of geit;

      e. composteren: proces waarin mest wordt afgebroken met behulp van micro-organismen om te worden omgezet
      een homogeen en zodanig stabiel eindproduct waarin alleen nog een langzame afbraak van humeuze verbindingen
      plaatsvindt;

      f. GD: Gezondheidsdienst voor Dieren.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0006829#Artikel2
    url: https://wetten.overheid.nl/BWBR0022975/2009-07-01#Artikel5.1.1
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0006829
        artikel: '2'
  - number: 5.1.2
    text: >-
      Het is gedurende 90 dagen gerekend vanaf het tijdstip waarop de verdenking van besmetting met Q-koorts is ontstaan,
      verboden om mest te verwijderen uit een stal waar verdachte dieren zijn of worden gehouden.
    url: https://wetten.overheid.nl/BWBR0022975/2009-07-01#Artikel5.1.2
  - number: 5.1.3
    text: >-
      1 Het is voor bezoekers van een bedrijf, waar verdachte dieren zijn of worden gehouden, gedurende 90 dagen gerekend
      vanaf het tijdstip waarop de verdenking van besmetting met Q-koorts is ontstaan, verboden de stal waar deze dieren
      zijn of worden gehouden, te betreden.


      2 Het eerste lid is niet van toepassing op personen voor wie het met het oog op de uitoefening van beroep of
      bedrijf, noodzakelijk is de stal te betreden.
    url: https://wetten.overheid.nl/BWBR0022975/2009-07-01#Artikel5.1.3
  - number: 5.1.4
    text: |-
      Indien de verdenking, bedoeld in [artikel 2, onderdeel a, van het Besluit verdachte dieren][ref1], is beëindigd
      op grond van [artikel 4, onderdeel b, van het Besluit verdachte dieren][ref2], zijn de [artikelen 5.1.2][ref3] en
      [5.1.3][ref4] niet langer van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006829#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006829#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0022975#Artikel5.1.2
      [ref4]: https://wetten.overheid.nl/BWBR0022975#Artikel5.1.3
    url: https://wetten.overheid.nl/BWBR0022975/2009-07-01#Artikel5.1.4
    references:
      - id: ref1
        bwb_id: BWBR0006829
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0006829
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0022975
        artikel: 5.1.2
        paragraaf: '5.1'
      - id: ref4
        bwb_id: BWBR0022975
        artikel: 5.1.3
        paragraaf: '5.1'
  - number: 5.1.5
    text: >-
      1 Het is verboden meer dan 50 schapen en geiten te houden ten behoeve van de bedrijfsmatige melkproductie.


      2 Het verbod, bedoeld in het eerste lid, is niet van toepassing indien de desbetreffende houder handelt
      overeenkomstig het derde tot en met het zevende lid.


      3 De houder:


      a. bestrijdt ongedierte op zijn bedrijf adequaat;


      b. verwijdert geen mest uit de stal vanaf de aanvang van de lammerperiode op zijn bedrijf tot en met een maand na
      afloop daarvan;


      c. draagt er zorg voor dat mest bij opslag en afvoer adequaat wordt afgedekt;


      d. brengt geen mest op of in de bodem van zijn bedrijf, tenzij:


      i. de mest onmiddellijk wordt ondergewerkt, of


      ii. de mest ten minste drie maanden gecomposteerd is;


      e. zorgt voor voldoende bakken in de stallen, waar schapen of geiten worden gehouden, waarin categorie 1-materiaal
      of categorie 2-materiaal als bedoeld in artikel 4 en 5 van Verordening (EG) nr. 1774/2002 van het Europees
      Parlement en de Raad van 3 oktober 2002 tot vaststelling van gezondheidsvoorschriften inzake niet voor menselijke
      consumptie bestemde dierlijke bijproducten (PB L 237), overeenkomstig de Regeling dierlijke bijproducten 2008 moet
      worden verzameld.


      4 Het onderwerken van de mest, bedoeld in het derde lid, onderdeel d, geschiedt in maximaal twee direct
      opeenvolgende werkgangen op zodanige wijze dat de mest direct nadat deze op het grondoppervlak is gebracht ofwel in
      de grond wordt gebracht, ofwel intensief met de grond wordt vermengd, met als gevolg dat de mest als zodanig niet
      meer zichtbaar op het grondoppervlak ligt.


      5 De houder houdt een administratie bij van:


      a. de datum dat de mest uit de stal wordt verwijderd;


      b. de begin- en einddatum van de composteringsperiode op het bedrijf;


      c. de datum van het uitrijden van de mest op het eigen bedrijf.


      6 De houder vermeldt in de administratie, bedoeld in het vijfde lid, telkens de desbetreffende hoeveelheid mest,
      uitgedrukt in kubieke meters.


      7 De houder bewaart de administratie, bedoeld in het vijfde lid, gedurende een jaar.
    url: https://wetten.overheid.nl/BWBR0022975/2009-07-01#Artikel5.1.5
  - number: 5.1.6
    text: |-
      1 Het is verboden om mest die is afgevoerd van een bedrijf waar meer dan 50 schapen en geiten worden gehouden ten
      behoeve van de bedrijfsmatige melkproductie, te vervoeren, op te slaan of op of in de bodem te brengen.

      2 Het verbod, bedoeld in het eerste lid, is niet van toepassing op het vervoer van mest, indien:

      a. de mest adequaat is afgedekt,

      b. de mest rechtstreeks, zonder tussenopslag, wordt vervoerd naar een bedrijf als bedoeld in
      [artikel 1, eerste lid, van de Meststoffenwet][ref1], alwaar het op of in de bodem wordt gebracht, en

      c. voor zover het mest betreft die ten minste drie maanden gecomposteerd is, de mest vergezeld gaat van een
      verklaring van het bedrijf, bedoeld in het eerste lid, waarin de composteringsperiode vermeld staat.

      3 Het verbod, bedoeld in het eerste lid, is niet van toepassing op het opslaan van mest, indien deze adequaat is
      afgedekt.

      4 Het verbod, bedoeld in het eerste lid, is niet van toepassing op het op of in de bodem brengen van mest, indien:

      a. de mest onmiddellijk wordt ondergewerkt, of

      b. de mest ten minste drie maanden gecomposteerd is.

      5 [Artikel 5.1.5, vierde lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0022975#Artikel5.1.5
    url: https://wetten.overheid.nl/BWBR0022975/2009-07-01#Artikel5.1.6
    references:
      - id: ref1
