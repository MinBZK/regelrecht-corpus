        artikel: '3'
  - number: 3.1.4
    text: |-
      1 De dierenarts past het middel, bedoeld in [artikel 3.1.1][ref1], toe overeenkomstig de gebruiksvoorschriften en
      de instructies van de fabrikant van het middel.

      2 Indien runderen op grond van deze regeling worden gevaccineerd, draagt de houder van de runderen ervoor zorg
      dat zijn dieren tweemaal worden gevaccineerd, waarbij de tweede vaccinatie minimaal drie weken nadat de eerste
      vaccinatie is verricht, wordt uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0022975#Artikel3.1.1
    url: https://wetten.overheid.nl/BWBR0022975/2009-07-01#Artikel3.1.4
    references:
      - id: ref1
        bwb_id: BWBR0022975
        artikel: 3.1.1
        paragraaf: '3.1'
  - number: 3.2.1
    text: >-
      1 De houder van gevaccineerde herkauwers die bestemd zijn voor export overeenkomstig de voorwaarden, bedoeld in
      bijlage III, punt 5, van verordening (EG) nr. 1266/2007, ondertekent terstond na de vaccinatie van deze dieren
      een volledig en naar waarheid ingevuld door het Ministerie van Landbouw, Natuur en Voedselkwaliteit verstrekt
      exportformulier en laat dit formulier mede ondertekenen door de dierenarts die de dieren heeft gevaccineerd.


      2 De houder vermeldt op het formulier, bedoeld in het eerste lid, tenminste de locatie waar de dieren zijn
      gevaccineerd en gegevens over de identificatie van de gevaccineerde herkauwers.
    url: https://wetten.overheid.nl/BWBR0022975/2009-07-01#Artikel3.2.1
  - number: 3.2.2
    text: |-
      1 Export van gevaccineerde runderen overeenkomstig de voorwaarden, bedoeld in bijlage III, punt 5, van verordening
      (EG) nr. 1266/2007 vindt plaats:

      a. vanaf de locatie waar de dieren zijn gevaccineerd rechtstreeks naar een buiten Nederland gelegen locatie, of

      b. vanaf een exportverzamelcentrum.

      2 Ingeval van export, bedoeld in het eerste lid, onderdeel b, stuurt de houder van de gevaccineerde runderen het
      exportformulier, bedoeld in [artikel 3.2.1][ref1], naar DR ten behoeve van registratie van de vaccinatie in het I&R-
      systeem rund, bedoeld in [artikel 14, onderdeel a, van de Regeling identificatie en registratie van dieren][ref2],
      met dien verstande dat het formulier niet eerder wordt verstuurd dan nadat de tweede vaccinatie is verricht en niet
      later dan twee weken na de tweede vaccinatie.


      [ref1]: https://wetten.overheid.nl/BWBR0022975#Artikel3.2.1
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel14
    url: https://wetten.overheid.nl/BWBR0022975/2009-07-01#Artikel3.2.2
    references:
      - id: ref1
        bwb_id: BWBR0022975
        artikel: 3.2.1
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0014538
        artikel: '14'
  - number: 3.2.3
    text: |-
      1 Voor de registratie, bedoeld in [artikel 3.2.2, tweede lid][ref1], is de houder van de gevaccineerde runderen aan
      de Minister een tarief verschuldigd van € 4,75 per exportformulier als bedoeld in [artikel 3.2.1][ref2], en € 0,75
      per rund.

      2 De hoogte van het totaal verschuldigde bedrag wordt vastgesteld door de Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0022975#Artikel3.2.2
      [ref2]: https://wetten.overheid.nl/BWBR0022975#Artikel3.2.1
    url: https://wetten.overheid.nl/BWBR0022975/2009-07-01#Artikel3.2.3
    references:
