  - number: 3.1.3
    text: |-
      Van het verbod in [artikel 3 van het Besluit gebruik sera en entstoffen][ref1] wordt vrijstelling verleend tot 1
      juli 2009 voor het overeenkomstig deze regeling vaccineren van herkauwers of kameelachtigen.


      [ref1]: https://wetten.overheid.nl/BWBR0009198#Artikel3
    url: https://wetten.overheid.nl/BWBR0022975/2009-07-01#Artikel3.1.3
    references:
