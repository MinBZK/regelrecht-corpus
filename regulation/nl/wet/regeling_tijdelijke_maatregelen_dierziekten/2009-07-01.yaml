        artikel: '2'
      - id: ref2
        bwb_id: BWBR0022975
        artikel: 3.1.4
        paragraaf: '3.1'
  - number: 3.1.2
    text: |-
      Het diergeneesmiddel, bedoeld in [artikel 3.1.1][ref1], wordt voor de toepassing van deze regeling aangewezen als:

      a. een middel als bedoeld in [artikel 29, eerste lid, Diergeneesmiddelenwet][ref2];

      b. een middel als bedoeld in [artikel 30, vierde lid, Diergeneesmiddelenwet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0022975#Artikel3.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0003818#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0003818#Artikel30
