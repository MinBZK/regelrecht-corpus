  - number: 5.2.1
    text: |-
      1 Van het verbod, gesteld in [artikel 2, eerste lid, van de Diergeneesmiddelenwet][ref1], wordt vrijstelling
      verleend voor het toepassen van het diergeneesmiddel ‘Coxevac’ van de firma CEVA SANTE ANIMALE B.V. te Naaldwijk
      voor het vaccineren van schapen en geiten tegen Q-koorts en met het oog daarop het voorhanden of in voorraad hebben
      en het afleveren van dit middel onder de voorwaarden, gesteld in [artikel 5.2.4 tot en met 5.2.6][ref2].

      2 De vrijstelling, bedoeld in het eerste lid, wordt verleend tot 1 januari 2010.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022975#Artikel5.2.4
    url: https://wetten.overheid.nl/BWBR0022975/2009-07-01#Artikel5.2.1
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0022975
        artikel: 5.2.4
        paragraaf: '5.2'
  - number: 5.2.2
    text: |-
      Het diergeneesmiddel, bedoeld in [artikel 5.2.1, eerste lid][ref1], wordt voor de toepassing van deze regeling
      aangewezen als:

      a. een middel als bedoeld in [artikel 29, eerste lid, van de Diergeneesmiddelenwet][ref2];

      b. een middel als bedoeld in [artikel 30, vierde lid, van de Diergeneesmiddelenwet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0022975#Artikel5.2.1
      [ref2]: https://wetten.overheid.nl/BWBR0003818#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0003818#Artikel30
    url: https://wetten.overheid.nl/BWBR0022975/2009-07-01#Artikel5.2.2
    references:
      - id: ref1
        bwb_id: BWBR0022975
        artikel: 5.2.1
        paragraaf: '5.2'
      - id: ref2
        bwb_id: BWBR0003818
        artikel: '29'
      - id: ref3
        bwb_id: BWBR0003818
        artikel: '30'
  - number: 5.2.3
    text: |-
      Van het verbod, in [artikel 3 van het Besluit gebruik sera en entstoffen][ref1] wordt vrijstelling verleend voor
      het overeenkomstig deze regeling vaccineren van schapen en geiten.


      [ref1]: https://wetten.overheid.nl/BWBR0009198#Artikel3
    url: https://wetten.overheid.nl/BWBR0022975/2009-07-01#Artikel5.2.3
    references:
      - id: ref1
        bwb_id: BWBR0009198
        artikel: '3'
  - number: 5.2.4
    text: |-
      1 De dierenarts past het diergeneesmiddel, bedoeld in [artikel 5.2.1, eerste lid][ref1], toe overeenkomstig de
      gebruiksvoorschriften en de instructies van de fabrikant van het middel.

      2 Het diergeneesmiddel, bedoeld in [artikel 5.2.1, eerste lid][ref2], wordt niet toegepast bij drachtige schapen
      en geiten.


      [ref1]: https://wetten.overheid.nl/BWBR0022975#Artikel5.2.1
      [ref2]: https://wetten.overheid.nl/BWBR0022975#Artikel5.2.1
    url: https://wetten.overheid.nl/BWBR0022975/2009-07-01#Artikel5.2.4
    references:
      - id: ref1
        bwb_id: BWBR0022975
        artikel: 5.2.1
        paragraaf: '5.2'
      - id: ref2
        bwb_id: BWBR0022975
        artikel: 5.2.1
        paragraaf: '5.2'
  - number: 5.2.5
    text: |-
      Een houder van schapen en geiten is verplicht de op zijn bedrijf aanwezige schapen en geiten te laten vaccineren
      vóór 1 januari 2010 indien het gaat om schapen of geiten die:

      a. binnen het in [bijlage I][ref1] bedoelde gebied, worden gehouden:

      i. op een locatie ten behoeve van de bedrijfsmatige melkproductie waar meer dan 50 schapen en/of geiten aanwezig
      zijn;

      ii. op een zorgboerderij;

      iii. op een kinderboerderij, of

      iv. in een dierentuin.

      b. worden gehouden op een bedrijf waar een verdenking van besmetting met Q-koorts als bedoeld in
      [artikel 2, onderdeel a, van het Besluit verdachte dieren][ref2], is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0022975
      [ref2]: https://wetten.overheid.nl/BWBR0006829#Artikel2
    url: https://wetten.overheid.nl/BWBR0022975/2009-07-01#Artikel5.2.5
    references:
      - id: ref1
        bwb_id: BWBR0022975
      - id: ref2
        bwb_id: BWBR0006829
        artikel: '2'
  - number: 5.2.6
    text: |-
      1 De houder, bedoeld in [artikel 5.2.5][ref1], aanhef en onderdeel a, is verplicht om vóór 1 juni 2009 aan de GD de
      volgende gegevens te doen toekomen:

      a. het aantal schapen en geiten aanwezig op een locatie, bedoeld in [artikel 5.2.5, onderdeel a][ref2];

      b. het aantal schapen en geiten dat in 2008 tweemaal is gevaccineerd in verband met Q-koorts;

      c. het aantal schapen en geiten dat in 2009 voor het eerst gevaccineerd zal worden;

      d. de maanden waarin de houder de schapen en geiten wenst te laten vaccineren.

      2 De houder, bedoeld in [artikel 5.2.5, aanhef en onderdeel b][ref3], is verplicht om binnen twee weken na
      vaststelling van de verdenking van besmetting, de kennisgeving, bedoeld in het eerste lid, te doen.

      3 De kennisgeving, bedoeld in het eerste, tweede en derde lid, geschiedt met gebruikmaking van een daartoe door de
      GD ter beschikking gesteld formulier.


      [ref1]: https://wetten.overheid.nl/BWBR0022975#Artikel5.2.5
      [ref2]: https://wetten.overheid.nl/BWBR0022975#Artikel5.2.5
      [ref3]: https://wetten.overheid.nl/BWBR0022975#Artikel5.2.5
    url: https://wetten.overheid.nl/BWBR0022975/2009-07-01#Artikel5.2.6
    references:
