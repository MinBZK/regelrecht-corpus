        artikel: '50'
  - number: '2.9'
    text: Deze paragraaf is niet van toepassing op gevogelte, gehouden in dierentuinen.
    url: https://wetten.overheid.nl/BWBR0022975/2009-07-01#Artikel2.9
  - number: '3.1'
    text: >-
      Voor de toepassing van deze paragraaf wordt geheel Nederland aangemerkt als beperkingsgebied voor bluetongue
      serotype 8.
    url: https://wetten.overheid.nl/BWBR0022975/2009-07-01#Artikel3.1
  - number: '3.2'
    text: >-
      De Minister is de bevoegde autoriteit, bedoeld in:


      a. artikel 7, eerste en tweede lid, van verordening (EG) nr. 1266/2007;


      b. artikel 8, eerste lid, van verordening (EG) nr. 1266/2007;


      c. artikel 9, eerste lid, van verordening (EG) nr. 1266/2007;


      d. bijlage III, hoofdstuk A, onderdeel 5, van verordening (EG) nr. 1266/2007.
    url: https://wetten.overheid.nl/BWBR0022975/2009-07-01#Artikel3.2
  - number: '3.3'
    text: >-
      De VWA is de bevoegde autoriteit bedoeld in artikel 8, derde lid, vierde lid, onderdeel c, en vijfde lid, van
      verordening (EG) nr. 1266/2007.
    url: https://wetten.overheid.nl/BWBR0022975/2009-07-01#Artikel3.3
  - number: '3.4'
    text: >-
      1 Het is verboden herkauwers te verplaatsen.


      2 Het eerste lid is niet van toepassing indien de te verplaatsen dieren op de dag van vervoer geen klinische
      tekenen van bluetongue vertonen.


      3 Het eerste lid is niet van toepassing op een verplaatsing vanuit een beschermingsgebied, bedoeld in artikel
      8, tweede lid, onderdeel a, van richtlijn 2000/75/EG naar een toezichtsgebied, bedoeld in artikel 8, tweede lid,
      onderdeel b, van richtlijn 2000/75/EG, mits voldaan is aan de voorwaarden, bedoeld in artikel 7, tweede lid, van
      verordening (EG) nr. 1266/2007.
    url: https://wetten.overheid.nl/BWBR0022975/2009-07-01#Artikel3.4
  - number: '3.5'
    text: >-
      1 Het is verboden in strijd te handelen met de voorwaarden van artikel 8, eerste, derde, vierde, vijfde lid en lid
      5 bis en artikel 9 bis van verordening (EG) nr. 1266/2007.


      2 Het is verboden herkauwers die oorspronkelijk afkomstig zijn uit gebieden waar een ander bluetongue serotype
      voorkomt dan serotype 8 in Nederland te brengen.


      3 Het tweede lid is niet van toepassing op herkauwers indien wordt voldaan aan:


      a. voor zover het gaat om herkauwers, jonger dan 90 dagen, de voorwaarden van artikel 9 bis, eerste lid, onderdelen
      b en c, van verordening (EG) nr. 1266/2007, of


      b. de toepasselijke voorwaarden van artikel 8 van verordening (EG) nr. 1266/2007 en voor zover hierop van
      toepassing de voorwaarden van artikel 9 bis van verordening (EG) nr. 1266/2007.


      4 Het is verboden herkauwers te houden die niet overeenkomstig het derde lid in Nederland zijn binnengebracht.


      5 Het tweede, derde en vierde lid, zijn van toepassing tot en met 31 december 2009.
    url: https://wetten.overheid.nl/BWBR0022975/2009-07-01#Artikel3.5
  - number: '3.6'
    text: >-
      1 De doorvoer van herkauwers is verboden.


      2 Het eerste lid is niet van toepassing indien is voldaan aan de voorwaarden, genoemd in artikel 9, eerste lid,
      onderdelen a, b, of c, van verordening (EG) nr. 1266/2007.


      3 Het eerste en tweede lid zijn niet van toepassing in de periode, bedoeld in artikel 9, derde lid, van verordening
      (EG) nr. 1266/2007.
    url: https://wetten.overheid.nl/BWBR0022975/2009-07-01#Artikel3.6
  - number: 3.1.1
    text: |-
      1 Van het verbod, gesteld in [artikel 2, eerste lid, van de Diergeneesmiddelenwet][ref1], wordt vrijstelling
      verleend voor het toepassen van het diergeneesmiddel “Bovilis BTV8” van de firma Intervet International BV te
      Boxmeer voor het vaccineren van herkauwers of kameelachtigen, en met het oog daarop het bereiden, het voorhanden of
      in voorraad hebben en het afleveren van dit middel onder de voorwaarden, gesteld in [artikel 3.1.4][ref2].

      2 De vrijstelling, bedoeld in het eerste lid, wordt verleend tot 1 juli 2009.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022975#Artikel3.1.4
    url: https://wetten.overheid.nl/BWBR0022975/2009-07-01#Artikel3.1.1
