        artikel: 5.2.5
        paragraaf: '5.2'
      - id: ref2
        bwb_id: BWBR0022975
        artikel: 5.2.5
        paragraaf: '5.2'
      - id: ref3
        bwb_id: BWBR0022975
        artikel: 5.2.5
        paragraaf: '5.2'
  - number: 5.2.7
    text: |-
      1 De dierenarts die de vaccinatie, bedoeld in [artikel 5.2.4][ref1], heeft uitgevoerd, ontvangt hiervoor een
      vergoeding.

      2 Om in aanmerking te komen voor de vergoeding, stuurt de dierenarts, bedoeld in het eerste lid, vóór 1 februari
      2010 aan de GD een overzicht per bedrijf van de uren die hij heeft besteed aan de vaccinatie en het aantal
      gevaccineerde schapen en geiten.

      3 Indien alle schapen en geiten, die onder de vaccinatieplicht, bedoeld in [artikel 5.2.5][ref2] vallen, zijn
      gevaccineerd, meldt de houder van deze dieren dit aan de GD.

      4 De kennisgeving, bedoeld in het tweede en het derde lid, geschiedt op één formulier, dat door de GD ter
      beschikking is gesteld formulier.

      5 Het formulier, bedoeld in het vierde lid, wordt ondertekend door de dierenarts, bedoeld in het eerste lid, en
      door de houder van de desbetreffende gevaccineerde schapen en geiten, bedoeld in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0022975#Artikel5.2.4
      [ref2]: https://wetten.overheid.nl/BWBR0022975#Artikel5.2.5
    url: https://wetten.overheid.nl/BWBR0022975/2009-07-01#Artikel5.2.7
