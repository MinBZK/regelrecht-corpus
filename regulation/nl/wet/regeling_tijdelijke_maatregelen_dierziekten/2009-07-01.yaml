  - number: '2.8'
    text: |-
      In afwijking van [artikel 50, eerste lid, onderdelen d en e, van de Flora- en Faunawet][ref1] is het gebruik van
      gehouden eenden als lokvogels als middel tot jagen verboden.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel50
    url: https://wetten.overheid.nl/BWBR0022975/2009-07-01#Artikel2.8
    references:
