preamble:
  text: >-
    Gelet op:


    – richtlijn 2005/94/EG van de Raad van de Europese Unie van 20 december 2005 betreffende communautaire maatregelen
    ter bestrijding van aviaire influenza en tot intrekking van Richtlijn 92/40 (PbEU L 10);


    – beschikking 2005/734/EG van de Commissie van de Europese Gemeenschappen van 19 oktober 2005 tot vaststelling
    van bioveiligheidsmaatregelen ter beperking van het risico van overdracht van hoogpathogene aviaire influenza,
    veroorzaakt door het influenza A-virus subtype H5N1, van in het wild levende vogels naar pluimvee en andere in
    gevangenschap gehouden vogels en tot instelling van een systeem voor vroege opsporing in risicogebieden (PbEU
    L 274);


    – beschikking 2006/474/EG van de Commissie van de Europese Gemeenschappen van 6 juli 2006 tot vaststelling van
    maatregelen ter preventie van de verspreiding van hoogpathogene aviaire influenza, veroorzaakt door influenza A-
    virus subtype H5N1, naar vogels in dierentuinen en officieel erkende instellingen, instituten of centra in de
    lidstaten en tot intrekking van Beschikking 2005/744/EG (PbEU L 187);


    – richtlijn 2000/75/EG van de Raad van de Europese Unie van 20 november 2000 tot vaststelling van specifieke
    bepalingen inzake de bestrijding en uitroeiing van bluetongue (PbEU L 327);


    – verordening (EG) nr. 1266/2007 van de Commissie van 26 oktober 2007 tot vaststelling van uitvoeringsbepalingen
    voor richtlijn 2000/75/EG van de Raad wat betreft bestrijding, monitoring, surveillance en beperkingen op de
    verplaatsingen van bepaalde dieren van vatbare soorten in verband met bluetongue (PbEU L 283);


    – artikel 10, eerste lid, van richtlijn 90/425 van de Raad van de Europese Unie van 26 juni 1990 inzake veterinaire
    en zoötechnische controles in het intracommunautaire handelsverkeer in bepaalde levende dieren en produkten in het
    vooruitzicht van de totstandbrenging van de interne markt (PbEU L 224);


    – de artikelen 10, 17, 18, 19, 29, 30, eerste en derde lid, 31, 32, 100, 107 en 114 van de Gezondheids- en
    welzijnswet voor dieren;


    – de Regeling aanwijzing ambtenaren Gezondheids- en welzijnswet voor dieren;


    Besluit:
  url: https://wetten.overheid.nl/BWBR0022975/2009-07-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. dierentuin: dierentuin als bedoeld in artikel 2, tweede alinea, van beschikking 2006/474/EG van de Commissie van
      de Europese Gemeenschappen van 6 juli 2006 tot vaststelling van maatregelen ter preventie van de verspreiding van
      hoogpathogene aviaire influenza, veroorzaakt door influenza A-virus subtype H5N1, naar vogels in dierentuinen en
      officieel erkende instellingen, instituten of centra in de lidstaten en tot intrekking van Beschikking 2005/744/EG
      (PbEU L 187);

      b. evenhoevigen: herkauwers en varkens;

      c. gevogelte: pluimvee, alsmede andere gehouden dieren van een soort behorende tot de orde van de eendvogels
      ( Anseriformes), tot de families van de struisvogels ( Struthionidae), emoes ( Dromaiidae) en nandoes ( Rheidae) en
      de familie van de duiven ( Columbidae);

      d. hobbypluimvee: gevogelte als bedoeld in
      __REF000___________________________________________________________________________________________________________
      ___________________________________;

      e. [richtlijn 2000/75/EG](32000L0075): [richtlijn 2000/75/EG](32000L0075) van de Raad van de Europese Unie van 20
      november 2000 tot vaststelling van specifieke bepalingen inzake de bestrijding en uitroeiing van bluetongue (PbEU
      L 327);

      f. [richtlijn 2005/94/EG](32005L0094): [Richtlijn 2005/94/EG](32005L0094) van de Raad van de Europese Unie van 20
      december 2005 betreffende communautaire maatregelen ter bestrijding van aviaire influenza en tot intrekking van
      [Richtlijn 92/40](31992L0040) (PbEG L10);

      g. [verordening (EG) nr. 1266/2007](32007R1266): [verordening (EG) nr. 1266/2007](32007R1266) van de Commissie van
      26 oktober 2007 tot vaststelling van uitvoeringsbepalingen voor [richtlijn 2000/75/EG](32000L0075) van de Raad wat
      betreft bestrijding, monitoring, surveillance en beperkingen op de verplaatsingen van bepaalde dieren van vatbare
      soorten in verband met bluetongue;

      h. vervoermiddel: voertuig, waaronder mede begrepen een combinatie van een voertuig met één of meer door dat
      voertuig voortbewogen aanhangwagens, opleggers of containers;

      i. VWA: Voedsel en Waren Autoriteit;

      j. Minister: Minister van Landbouw, Natuur en Voedselkwaliteit;

      k. DR: Dienst Regelingen van het Ministerie van Landbouw, Natuur en Voedselkwaliteit;

      l. wet: [Gezondheids- en welzijnswet voor dieren][ref2];

      m. derde land: land, niet zijnde Nederland en niet zijnde een lidstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0019657#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005662
    url: https://wetten.overheid.nl/BWBR0022975/2009-07-01#Artikel1.1
