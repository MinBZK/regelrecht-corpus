  - number: 3.2.4
    text: >-
      Gevaccineerde schapen en geiten die bestemd zijn voor export overeenkomstig de voorwaarden, bedoeld in bijlage
      III, punt 5, van verordening (EG) nr. 1266/2007 worden rechtstreeks vervoerd van het bedrijf waar deze dieren zijn
      gevaccineerd naar een buiten Nederland gelegen locatie.
    url: https://wetten.overheid.nl/BWBR0022975/2009-07-01#Artikel3.2.4
  - number: 3.3.1
    text: |-
      1 De Minister stelt op aanvraag een subsidie vast voor de kosten die door de houder van herkauwers of
      kameelachtigen zijn gemaakt voor het voor 1 januari 2009 door een dierenarts overeenkomstig deze regeling laten
      vaccineren van zijn dieren tegen bluetongue.

      2 De subsidie wordt niet verleend:

      a. indien een houder van herkauwers of kameelachtigen zich niet heeft aangemeld overeenkomstig
      [artikel 2 van de Regeling identificatie en registratie van dieren][ref1];

      b. indien de houder niet heeft voldaan aan [artikel 3.1.4, tweede lid][ref2], of [artikel 3.3.2][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022975#Artikel3.1.4
      [ref3]: https://wetten.overheid.nl/BWBR0022975#Artikel3.3.2
    url: https://wetten.overheid.nl/BWBR0022975/2009-07-01#Artikel3.3.1
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0022975
        artikel: 3.1.4
        paragraaf: '3.1'
      - id: ref3
        bwb_id: BWBR0022975
        artikel: 3.3.2
        paragraaf: '3.3'
  - number: 3.3.2
    text: |-
      1 De houder van de gevaccineerde herkauwers of kameelachtigen ondertekent de volledige en naar waarheid ingevulde
      door het Ministerie van Landbouw, Natuur en Voedselkwaliteit verstrekte vaccinatieverklaring terstond na de
      laatste vaccinatie op zijn bedrijf en laat deze verklaring mede ondertekenen door de dierenarts die de dieren heeft
      gevaccineerd.

      2 De houder van de gevaccineerde herkauwers of kameelachtigen vermeldt tenminste de volgende gegevens op de
      verklaring, bedoeld in het eerste lid:

      a. naam, adres, woonplaats en bankrekeningnummer van de houder van de gevaccineerde herkauwers of kameelachtigen;

      b. het door de Minister toegewezen uniek bedrijfsnummer, bedoeld in
      [artikel 3, eerste lid, van de Regeling identificatie en registratie van dieren][ref1];

      c. gegevens over de locatie, waar de dieren zijn gevaccineerd;

      d. gegevens over de dierenarts die de dieren heeft gevaccineerd;

      e. de datum van de vaccinatie;

      f. het aantal gevaccineerde dieren en de diersoort;

      g. het totaal bedrag van de factuur van de dierenarts, die de dieren heeft gevaccineerd, exclusief BTW.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel3
    url: https://wetten.overheid.nl/BWBR0022975/2009-07-01#Artikel3.3.2
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '3'
  - number: 3.3.3
    text: |-
      1 De aanvraag, bedoeld in [artikel 3.3.1, eerste lid][ref1], vindt plaats door de vaccinatieverklaring, bedoeld in
      [artikel 3.3.2][ref2], te versturen naar DR.

      2 De houder van de gevaccineerde herkauwers of kameelachtigen dient ten hoogste
      twee aanvragen in per door de Minister toegewezen uniek bedrijfsnummer, bedoeld in
      [artikel 3, eerste lid, van de Regeling identificatie en registratie van dieren][ref3].

      3 De aanvraag is op uiterlijk 15 februari 2009 in het bezit van DR.


      [ref1]: https://wetten.overheid.nl/BWBR0022975#Artikel3.3.1
      [ref2]: https://wetten.overheid.nl/BWBR0022975#Artikel3.3.2
      [ref3]: https://wetten.overheid.nl/BWBR0014538#Artikel3
    url: https://wetten.overheid.nl/BWBR0022975/2009-07-01#Artikel3.3.3
    references:
