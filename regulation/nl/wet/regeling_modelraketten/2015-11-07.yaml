  - number: '4'
    text: |-
      Een kleine modelraket wordt niet gebruikt:

      a. in de Schiphol CTR, bedoeld in
      __REF000___________________________________________________________________________________________________________
      ______ en binnen een afstand van tien km van de grens van deze CTR;

      b. binnen een oefengebied voor nood- of voorzorgslandingen van burgerluchtvaartuigen aangewezen door de Minister van
      Infrastructuur en Milieu krachtens [artikel 19, eerste lid, onderdeel c, van het Besluit luchtverkeer 2014][ref2];

      c. binnen de routes en gebieden, bedoeld in de [artikelen 2, eerste lid][ref3], en
      __REF001___________________________________________________________________________________________________________
      ________________________________, behalve op vrijdagen na 17.00 uur plaatselijke tijd en op zaterdagen, zondagen en
      nationale feestdagen;

      d. binnen een afstand van 5 km van de gebieden en route, bedoeld in
      __REF000___________________________________________________________________________________________________________
      ________________________________________, behalve op vrijdagen na 17.00 uur plaatselijke tijd en op zaterdagen,
      zondagen en nationale feestdagen;

      e. binnen een afstand van 10 km van de grens van een luchthaven als bedoeld
      in [artikel 1.1 van de Wet luchtvaart][ref6] waarboven geen plaatselijk
      luchtverkeersleidingsgebied is ingesteld, tenzij de havenmeester als bedoeld in
      [artikel 6 van de Regeling veilig gebruik luchthavens en andere terreinen][ref7], respectievelijk de beheerder van
      het terrein tenminste 24 uur van tevoren, maar niet langer dan 48 uur van tevoren, is geïnformeerd over:

      1°. naam, adres en telefoonnummer van het lid van de betreffende vereniging, bedoeld in
      [artikel 2, eerste lid][ref8], dat als coördinator van de lancering optreedt;

      2°. lanceerplaats;

      3°. de periode waarbinnen de modelraket worden gebruikt;

      4°. een indicatie van het aantal te lanceren modelraketten;

      5°. de afmeting en de massa van de modelraket, en

      6°. de berekende maximale hoogte en afstand die de modelraket kan bereiken;

      f. in een plaatselijk luchtverkeersleidingsgebied en binnen een afstand van 10 km van de grens van een
      dergelijk gebied, niet zijnde de Schiphol CTR, tenzij na overleg van een lid van een vereniging als bedoeld in
      [artikel 2, eerste lid][ref9], met de instantie die de plaatselijke luchtverkeersleiding verzorgt is gebleken dat
      voldoende separatie van het overige luchtverkeer is gewaarborgd. Het overleg vindt plaats tenminste één week vóór
      het beoogde gebruik van de modelraket ten behoeve waarvan de informatie bedoeld in onderdeel e is overgelegd.


