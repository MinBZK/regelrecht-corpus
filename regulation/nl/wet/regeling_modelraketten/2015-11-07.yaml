        artikel: '3'
  - number: '3'
    text: |-
      1 Het ontwerp en de constructie van een modelraket:

      a. is voorzien van aërodynamische vlakken voor stabiliteit en herstellende krachten, die een voorspelbaar en
      stabiel traject bewerkstelligen;

      b. is zodanig dat de kans op een voorval als bedoeld in [artikel 1.1 van de Wet luchtvaart][ref1] of ongeval als
      gevolg van breken, defect of onbedoeld losraken van enig onderdeel tijdens de vlucht redelijkerwijs kan worden
      uitgesloten;

      c. is voorzien van een bergingssysteem dat de modelraket, of delen daarvan, doet afdalen met een zodanig beperkte
      landingssnelheid, dat de modelraket landt in de directe omgeving en dat geen gevaar kan ontstaan voor mensen,
      dieren of zaken op de grond of op het water;

      d. is voorzien van naam en adres van de eigenaar.

      2 De lanceerinrichting is zodanig geconstrueerd dat de modelraket altijd de inrichting stabiel verlaat in een
      richting die, gerekend vanuit het horizontale vlak, minstens 70º is.

      3 Voorafgaand aan de lancering zorgt de eigenaar ervoor dat het traject van de te verwachten vlucht van de
      modelraket is berekend.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel1.1
    url: https://wetten.overheid.nl/BWBR0020593/2015-11-07#Artikel3
