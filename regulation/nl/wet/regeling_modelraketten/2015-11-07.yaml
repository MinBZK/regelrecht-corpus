  - number: '2'
    text: |-
      1 Voor het gebruik van een kleine of grote modelraket in het luchtruim door een lid van een vereniging die zich
      bezig houdt met het ontwikkelen en het gebruik van een kleine of grote modelraket wordt vrijstelling verleend van
      het verbod in [artikel 1.2a van de Wet luchtvaart][ref1].

      2 Aan de vrijstelling zijn de in de [artikelen 3 tot en met 5][ref2] opgenomen voorschriften en beperkingen
      verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel1.2a
