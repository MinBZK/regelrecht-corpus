---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_modelraketten
regulatory_layer: WET
publication_date: '2015-11-06'
valid_from: '2006-12-07'
bwb_id: BWBR0020593
url: https://wetten.overheid.nl/BWBR0020593/2006-12-07
preamble:
  text: |-
    Handelende in overeenstemming met de Staatssecretaris van Defensie;

    Gelet op artikel 1.2a van de Wet luchtvaart;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0020593/2006-12-07#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder een:'
    url: https://wetten.overheid.nl/BWBR0020593/2006-12-07#Artikel1
  - number: 1.a
    text: |-
      modelraket: kleine of grote modelraket, niet zijnde vuurwerk als bedoeld in
      [artikel 1.1.1, eerste lid, van het Vuurwerkbesluit][ref1], en niet zijnde militair raket of militair projectiel;


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1
    url: https://wetten.overheid.nl/BWBR0020593/2006-12-07#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '1'
  - number: 1.b
    text: |-
      kleine modelraket: een toestel met een startmassa van maximaal 1500 gram, dat is gemaakt van papier, hout of
      kunststof en geen metalen hoofdonderdelen bevat, uitgezonderd een (licht)metalen motor, dat geen brandbare of
      explosieve lading bevat, behalve maximaal 125 gram brandstof die nodig is voor de voortstuwing, en dat wordt
      voortgestuwd door de reactiekracht van een uitgestoten massa aan de achterzijde;
    url: https://wetten.overheid.nl/BWBR0020593/2006-12-07#Artikel1
  - number: 1.c
    text: |-
      grote modelraket: een toestel met een startmassa van meer dan 1500 gram, maar niet meer dan 35000 gram, dat is
      gemaakt van papier, hout, (licht)metaal of kunststof en geen brandbare of explosieve lading bevat, behalve de
      brandstof die nodig is voor de voortstuwing, en dat wordt voortgestuwd door de reactiekracht van een uitgestoten
      massa aan de achterzijde.
    url: https://wetten.overheid.nl/BWBR0020593/2006-12-07#Artikel1
  - number: '2.1'
    text: |-
      Voor het gebruik van een kleine of grote modelraket in het luchtruim door een lid van een vereniging die zich bezig
      houdt met het ontwikkelen en het gebruik van een kleine of grote modelraket wordt vrijstelling verleend van het
      verbod in [artikel 1.2a van de Wet luchtvaart][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel1
    url: https://wetten.overheid.nl/BWBR0020593/2006-12-07#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '1'
  - number: '2.2'
    text: |-
      Aan de vrijstelling zijn de in de [artikelen 3 tot en met 5][ref1] opgenomen voorschriften en beperkingen
      verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0020593#Artikel3
    url: https://wetten.overheid.nl/BWBR0020593/2006-12-07#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0020593
        artikel: '3'
  - number: '3.1'
    text: 'Het ontwerp en de constructie van een modelraket:'
    url: https://wetten.overheid.nl/BWBR0020593/2006-12-07#Artikel3
  - number: 3.1.a
    text: |-
      is voorzien van aërodynamische vlakken voor stabiliteit en herstellende krachten, die een voorspelbaar en stabiel
      traject bewerkstelligen;
    url: https://wetten.overheid.nl/BWBR0020593/2006-12-07#Artikel3
  - number: 3.1.b
    text: |-
      is zodanig dat de kans op een voorval als bedoeld in [artikel 1.1 van de Wet luchtvaart][ref1] of ongeval als
      gevolg van breken, defect of onbedoeld losraken van enig onderdeel tijdens de vlucht redelijkerwijs kan worden
      uitgesloten;


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel1
    url: https://wetten.overheid.nl/BWBR0020593/2006-12-07#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '1'
  - number: 3.1.c
    text: |-
      is voorzien van een bergingssysteem dat de modelraket, of delen daarvan, doet afdalen met een zodanig beperkte
      landingssnelheid, dat de modelraket landt in de directe omgeving en dat geen gevaar kan ontstaan voor mensen,
      dieren of zaken op de grond of op het water;
    url: https://wetten.overheid.nl/BWBR0020593/2006-12-07#Artikel3
  - number: 3.1.d
    text: is voorzien van naam en adres van de eigenaar.
    url: https://wetten.overheid.nl/BWBR0020593/2006-12-07#Artikel3
  - number: '3.2'
    text: |-
      De lanceerinrichting is zodanig geconstrueerd dat de modelraket altijd de inrichting stabiel verlaat in een
      richting die, gerekend vanuit het horizontale vlak, minstens 70º is.
    url: https://wetten.overheid.nl/BWBR0020593/2006-12-07#Artikel3
  - number: '3.3'
    text: |-
      Voorafgaand aan de lancering zorgt de eigenaar ervoor dat het traject van de te verwachten vlucht van de modelraket
      is berekend.
    url: https://wetten.overheid.nl/BWBR0020593/2006-12-07#Artikel3
  - number: '4'
    text: 'Een kleine modelraket wordt niet gebruikt:'
    url: https://wetten.overheid.nl/BWBR0020593/2006-12-07#Artikel4
  - number: 4.a
    text: |-
      in de Schiphol CTR, bedoeld in
      __REF000___________________________________________________________________________________________________________
      ______ en binnen een afstand van tien km van de grens van deze CTR;


      [ref1]: https://wetten.overheid.nl/BWBR0009899#Artikel5
    url: https://wetten.overheid.nl/BWBR0020593/2006-12-07#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009899
        artikel: '5'
  - number: 4.b
    text: |-
      binnen een oefengebied voor nood- of voorzorgslandingen van burgerluchtvaartuigen aangewezen door de Minister van
      Verkeer en Waterstaat krachtens [artikel 45, tweede lid, onderdeel c, van het Luchtverkeersreglement][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel45
    url: https://wetten.overheid.nl/BWBR0020593/2006-12-07#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005775
        artikel: '45'
  - number: 4.c
    text: |-
      binnen routes en gebieden, bedoeld in de [artikelen 4][ref1] en
      [5 van de Regeling VFR-nachtvluchten en minimum vlieghoogten voor militaire luchtvaartuigen][ref2], behalve op
      vrijdagen na 17.00 uur plaatselijke tijd en op zaterdagen, zondagen en nationale feestdagen;


      [ref1]: https://wetten.overheid.nl/BWBR0007141#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007141#Artikel5
    url: https://wetten.overheid.nl/BWBR0020593/2006-12-07#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007141
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0007141
        artikel: '5'
  - number: 4.d
    text: |-
      binnen een afstand van 5 km van routes en gebieden, bedoeld in
      [artikel 5 van de Regeling VFR-nachtvluchten en minimum vlieghoogten voor militaire luchtvaartuigen][ref1], behalve
      op vrijdagen, zaterdagen, zondagen en nationale feestdagen;


      [ref1]: https://wetten.overheid.nl/BWBR0007141#Artikel5
    url: https://wetten.overheid.nl/BWBR0020593/2006-12-07#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007141
        artikel: '5'
  - number: 4.e
    text: |-
      binnen een afstand van 10 km van de grens van een luchtvaartterrein als bedoeld in
      [artikel 1.1 van de Wet luchtvaart][ref1] waarboven geen plaatselijk luchtverkeersleidingsgebied als bedoeld
      in [artikel 1 van het Luchtverkeersreglement][ref2] is ingesteld, tenzij de havenmeester als bedoeld in
      [artikel 134 van de Regeling Toezicht Luchtvaart][ref3], respectievelijk de beheerder van het terrein tenminste 24
      uur van tevoren, maar niet langer dan 48 uur van tevoren, is geïnformeerd over:


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005775#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0002309#Artikel134
    url: https://wetten.overheid.nl/BWBR0020593/2006-12-07#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0005775
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0002309
        artikel: '134'
  - number: 4.e.1°
    text: |-
      naam, adres en telefoonnummer van het lid van de betreffende vereniging, bedoeld in [artikel 2, eerste lid][ref1],
      dat als coördinator van de lancering optreedt;


      [ref1]: https://wetten.overheid.nl/BWBR0020593#Artikel2
    url: https://wetten.overheid.nl/BWBR0020593/2006-12-07#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020593
        artikel: '2'
  - number: 4.e.2°
    text: lanceerplaats;
    url: https://wetten.overheid.nl/BWBR0020593/2006-12-07#Artikel4
  - number: 4.e.3°
    text: de periode waarbinnen de modelraket worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0020593/2006-12-07#Artikel4
  - number: 4.e.4°
    text: een indicatie van het aantal te lanceren modelraketten;
    url: https://wetten.overheid.nl/BWBR0020593/2006-12-07#Artikel4
  - number: 4.e.5°
    text: de afmeting en de massa van de modelraket, en
    url: https://wetten.overheid.nl/BWBR0020593/2006-12-07#Artikel4
  - number: 4.e.6°
    text: de berekende maximale hoogte en afstand die de modelraket kan bereiken;
    url: https://wetten.overheid.nl/BWBR0020593/2006-12-07#Artikel4
  - number: 4.f
    text: |-
      in een plaatselijk luchtverkeersleidingsgebied als bedoeld in [artikel 1 van het Luchtverkeersreglement][ref1] en
      binnen een afstand van 10 km van de grens van een dergelijk gebied, niet zijnde de Schiphol CTR, tenzij na overleg
      van een lid van een vereniging als bedoeld in [artikel 2, eerste lid][ref2], met de instantie die de plaatselijke
      luchtverkeersleiding verzorgt is gebleken dat voldoende separatie van het overige luchtverkeer is gewaarborgd.
      Het overleg vindt plaats tenminste één week vóór het beoogde gebruik van de modelraket ten behoeve waarvan de
      informatie bedoeld in onderdeel e is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020593#Artikel2
    url: https://wetten.overheid.nl/BWBR0020593/2006-12-07#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005775
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0020593
        artikel: '2'
  - number: '5'
    text: |-
      Een grote modelraket wordt alleen gebruikt in het luchtruim na overleg van een lid van een vereniging als
      bedoeld in [artikel 2, eerste lid][ref1], met de Minister van Verkeer en Waterstaat dan wel met de Minister
      van Defensie waarin is gebleken dat voldoende separatie van het overige luchtverkeer is gewaarborgd. De
      [tweede zin van artikel 4, onderdeel f][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020593#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020593#Artikel4
    url: https://wetten.overheid.nl/BWBR0020593/2006-12-07#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020593
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0020593
        artikel: '4'
  - number: '6'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0020593/2006-12-07#Artikel6
  - number: '7'
    text: 'Deze regeling wordt aangehaald als: Regeling modelraketten.'
    url: https://wetten.overheid.nl/BWBR0020593/2006-12-07#Artikel7
