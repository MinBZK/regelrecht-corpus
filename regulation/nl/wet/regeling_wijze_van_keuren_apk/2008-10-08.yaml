articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a
            bedrijfstemperatuur:

              de temperatuur van een motor na ongeveer vijftien minuten functioneren onder normale
      bedrijfsomstandigheden;



            b
            boekwerk ‘APK-milieukeuringseisen’:

              de editie van het door de Minister vastgestelde boekwerk ‘APK-milieukeuringseisen’, die geldig is op het
      moment van de keuring;



            c
            stationair toerental:

              het toerental van de draaiende motor, waarbij:
              de koudstartinrichting of het handgas niet is ingeschakeld,
      het gaspedaal en het koppelingspedaal in ruststand zijn,
      de keuzehendel van de versnellingsbak in de neutrale stand staat bij een niet- of halfautomatische versnellingsbak
      dan wel in de parkeerstand of in de neutrale stand bij een volautomatische versnellingsbak, en waarbij
      lampen en andere stroomverbruikers niet zijn ingeschakeld, met uitzondering van lampen die bij het starten
      automatisch gaan branden.



            d
            controleapparaat:

              controleapparaat als bedoeld in Bijlage I of Bijlage IB van [verordening (EEG) nr. 3821/85](31985R3821) van
      de Raad van 20 december 1985 betreffende het controleapparaat in het wegvervoer (PbEG L 370).
    url: https://wetten.overheid.nl/BWBR0007016/2008-10-08#Artikel1
  - number: '2'
    text: |-
      Deze regeling is van toepassing op:

      a. personenauto's,

      b. bedrijfsauto's,

      c. driewielige motorrijtuigen met een massa van het ledig voertuig van meer dan 400 kg, alsmede

      d. aanhangwagens met een toegestane maximum massa van meer dan 3500 kg.
    url: https://wetten.overheid.nl/BWBR0007016/2008-10-08#Artikel2
  - number: '3'
    text: |-
      Voor de periodieke keuring van personenauto's is [bijlage I][ref1] van toepassing, waarbij in de linkerkolom zijn
      weergegeven de keuringseisen van [hoofdstuk 5 van het Voertuigreglement][ref2] en in de rechterkolom de daarbij
      behorende wijzen van keuren.


      [ref1]: https://wetten.overheid.nl/BWBR0007016
      [ref2]: https://wetten.overheid.nl/BWBR0006746#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0007016/2008-10-08#Artikel3
