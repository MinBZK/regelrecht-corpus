  - number: '7'
    text: |-
      1 De keuring wordt uitgevoerd zonder demontage, tenzij uitdrukkelijk anders is bepaald.

      2 De keuring wordt uitgevoerd zonder rijproef, tenzij uitdrukkelijk anders is bepaald.

      3 De keuring van voertuigen met variabele afmetingen wordt uitgevoerd in de stand waarin het voertuig ter keuring
      wordt aangeboden.
    url: https://wetten.overheid.nl/BWBR0007016/2008-10-08#Artikel7
  - number: '8'
    text: |-
      1 Indien een visuele controle wordt voorgeschreven en deze controle onvoldoende uitsluitsel biedt, wordt het
      desbetreffende onderdeel aanvullend op één van de volgende wijzen gecontroleerd:

      a. door gebruik te maken van hulpmiddelen zoals een spiegel, hamertje, bandijzer, staalborstel of schuurpapier;

      b. door het uitoefenen van een kracht, al dan niet met behulp van gereedschap.

      2 Teneinde een goede controle te waarborgen, worden de hierna genoemde onderdelen verwijderd in de daarachter
      beschreven gevallen:









                  a.


                  wieldoppen,


                  voor zover deze de wielbevestigingsbouten afdekken;




                  b.


                  onderbeplating ten behoeve van stroomlijning of geluidsisolatie,


                  voor zover deze een visuele controle onmogelijk maakt van direct voor de verkeersveiligheid van belang
      zijnde aspecten, zoals de bevestiging van het stuurhuis of de wielophanging;




                  c.


                  kunststofbeplating in of over de wielkasten,


                  alleen indien duidelijke twijfel bestaat over de conditie van het afgedekte onderdeel en geen andere
      controle mogelijk is;




                  d.


                  tapijt of vloerbedekking,


                  alleen indien duidelijke twijfel bestaat over de conditie van het afgedekte onderdeel en geen andere
      controle mogelijk is;




                  e.


                  zijskirts, waaronder kunststofspoilers aan dorpels,


                  alleen indien duidelijke twijfel bestaat over de conditie van het afgedekte onderdeel en verwijdering
      kan geschieden zonder lakbeschadiging (bijvoorbeeld bevestigd met parkers).
                  Zijskirts bevestigd door middel van popnagels of andere permanente bevestigingsmiddelen mogen niet
      worden verwijderd;




                  f.


                  beschermkappen om stuurkoppelingen,


                  voor zover deze een visuele controle van de koppeling onmogelijk maken;




                  g.


                  beschermkappen om reminrichtingen,


                  voor zover deze een visuele controle van remschijven onmogelijk maken.






      3 De verwijdering van onderdelen mag alleen geschieden indien er geen gevaar voor beschadiging van het voertuig of
      het onderdeel bestaat. Na eventuele verwijdering moeten de desbetreffende onderdelen wederom worden gemonteerd.

      4 In het geval dat, ondanks twijfel omtrent de conditie van het afgedekte onderdeel, niet tot verwijdering is
      overgegaan vanwege het gevaar voor beschadiging, moet op de achterzijde van het keuringsrapport worden vermeld dat
      het afgedekte onderdeel niet is beoordeeld.

      5 Voor het meten van voertuigafmetingen, wielbasis en spoorbreedte wordt een stalen meetband met voldoende bereik
      gebruikt.

      6 Voor de beoordeling van de werking van de reminrichting mag uitsluitend tot demontage van wielen en remtrommels
      worden overgegaan indien twijfel bestaat omtrent:

      a. een goede bevestiging van de remvoering; of

      b. of de drager of het bevestigingsmiddel van de remvoering, de remtrommel of remschijf raken.
    url: https://wetten.overheid.nl/BWBR0007016/2008-10-08#Artikel8
