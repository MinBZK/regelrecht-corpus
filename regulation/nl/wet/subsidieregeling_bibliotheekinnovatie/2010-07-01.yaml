preamble:
  text: |-
    Gelet op de artikelen 5, 5a, 7, zesde lid, 32, eerste lid en 43 van het Bekostigingsbesluit cultuuruitingen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0026156/2010-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *minister:* Minister van Onderwijs, Cultuur en Wetenschap
        - *Regeling:* [Regeling op het specifiek cultuurbeleid][ref1];
        - *regiegroep:* Regiegroep Bibliotheekinnovatie als bedoeld in
      [artikel 2 van het Instellingsbesluit Regiegroep en Projectgroep Bibliotheekinnovatie 2009][ref2]


      [ref1]: https://wetten.overheid.nl/BWBR0027597
      [ref2]: https://wetten.overheid.nl/BWBR0025596#Artikel2
    url: https://wetten.overheid.nl/BWBR0026156/2010-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0027597
      - id: ref2
        bwb_id: BWBR0025596
        artikel: '2'
  - number: 1a
    text: |-
      Deze regeling berust op [artikel 4 van het Besluit op het specifiek cultuurbeleid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027600#Artikel4
    url: https://wetten.overheid.nl/BWBR0026156/2010-07-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0027600
        artikel: '4'
  - number: '2'
    text: |-
      1 De minister kan op aanvraag aan een instelling subsidie verlenen voor activiteiten die de innovatie en
      digitalisering van openbare bibliotheken bevorderen.

      2 Subsidie als bedoeld in het eerste lid kan worden verstrekt voor innovatieve projecten rond de volgende thema’s:

      a. digitale infrastructuur;

      b. digitale diensten en producten; en

      c. collectiebeleid.
    url: https://wetten.overheid.nl/BWBR0026156/2010-07-01#Artikel2
  - number: '3'
    text: |-
      Subsidie kan worden aangevraagd door een instelling die aantoonbare relevante kennis en kunde heeft op het gebied
      van bibliotheekwerk en bibliotheekinnovatie.
    url: https://wetten.overheid.nl/BWBR0026156/2010-07-01#Artikel3
  - number: '4'
    text: |-
      De subsidiabele kosten omvatten uitsluitend de volgende rechtstreeks aan de uitvoering van de activiteiten toe te
      rekenen kosten:

      a. loonkosten;

      b. overheadkosten;

      c. kosten van ingehuurde derden; en

      d. kosten van materialen.
    url: https://wetten.overheid.nl/BWBR0026156/2010-07-01#Artikel4
  - number: '5'
    text: |-
      Een project komt slechts in aanmerking voor subsidie als het project in 2009 aanvangt en uiterlijk is afgerond
      in 2010.
    url: https://wetten.overheid.nl/BWBR0026156/2010-07-01#Artikel5
  - number: '6'
    text: |-
      1 Voor subsidieverlening is een bedrag van € 7.558.000 beschikbaar.

      2 Voor de thema’s, bedoeld in [artikel 2, tweede lid][ref1], gelden de volgende subsidieplafonds:

      a. digitale infrastructuur: € 410.000;

      b. digitale diensten en producten: € 4.298.000; en

      c. collectiebeleid: € 2.850.000.

      3 Indien het bedrag, bedoeld in het tweede lid, onder a, b of c, niet geheel wordt verleend, kan de minister het
      bedrag dat niet verleend is toevoegen aan een van de andere bedragen, bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0026156#Artikel2
    url: https://wetten.overheid.nl/BWBR0026156/2010-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0026156
        artikel: '2'
        hoofdstuk: '1'
  - number: '7'
    text: |-
      1 Een aanvraag voor subsidie gaat in ieder geval vergezeld van:

      a. een activiteitenplan; en

      b. een begroting.

      2 Een aanvraag wordt ingediend bij de minister, Directie Media, Letteren en Bibliotheken (MLB), Postbus 16375,
      2500 BJ Den Haag.
    url: https://wetten.overheid.nl/BWBR0026156/2010-07-01#Artikel7
  - number: '8'
    text: Een aanvraag voor subsidie wordt ingediend voor 15 september 2009.
    url: https://wetten.overheid.nl/BWBR0026156/2010-07-01#Artikel8
  - number: '9'
    text: |-
      1 Indien een aanvraag voldoet aan de voorgaande artikelen, verzoekt de minister de regiegroep over de aanvraag
      te adviseren.

      2 De minister zendt een aanvraag als bedoeld in het eerste lid uiterlijk een week na de datum, bedoeld in
      [artikel 8][ref1], aan de regiegroep.

      3 De regiegroep adviseert over alle van de minister ontvangen aanvragen tegelijk.

      4 De regiegroep adviseert binnen vijf weken na de datum, bedoeld in [artikel 8][ref2].

      5 Indien een aanvraag niet wordt voorgelegd aan de regiegroep wijst de minister de aanvraag af.


      [ref1]: https://wetten.overheid.nl/BWBR0026156#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0026156#Artikel8
    url: https://wetten.overheid.nl/BWBR0026156/2010-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0026156
        artikel: '8'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0026156
        artikel: '8'
        hoofdstuk: '2'
  - number: '10'
    text: |-
      1 De regiegroep adviseert welke aanvragen in aanmerking moeten komen voor de verschillende categorieën van
      subsidie.

      2 Bij de advisering toetst de projectgroep in ieder geval aan de volgende criteria:

      a. innovatief karakter;

      b. bijdrage aan de verdere ontwikkeling van de digitale bibliotheek;

      c. realiseerbaarheid naar inhoud en tijd; en

      d. de kosteneffectiviteit; de mate waarin de gevraagde subsidie redelijk is ten opzichte van het te verwachten
      effect van de activiteiten.
    url: https://wetten.overheid.nl/BWBR0026156/2010-07-01#Artikel10
  - number: '11'
    text: |-
      1 De minister voorziet in een gelijktijdige beslissing op aanvragen waarover de regiegroep heeft geadviseerd, op
      basis van een vergelijking van hun geschiktheid om bij te dragen aan de doelstellingen van de subsidie.

      2 De minister beslist op de aanvragen mede op basis van de adviezen van de regiegroep.

      3 De minister beslist voor 1 december 2009 op de aanvragen.
    url: https://wetten.overheid.nl/BWBR0026156/2010-07-01#Artikel11
  - number: '12'
    text: De minister kan voorschotten verlenen van ten hoogste 80 procent van het verleende subsidiebedrag.
    url: https://wetten.overheid.nl/BWBR0026156/2010-07-01#Artikel12
  - number: '13'
    text: |-
      Indien de subsidieontvanger bij het verrichten van de gesubsidieerde activiteiten intellectuele eigendomsrechten
      vestigt, draagt de subsidieontvanger deze intellectuele eigendomsrechten, voor zover deze rechten wettelijk
      overdraagbaar zijn, na afronding van de activiteiten over aan de Staat der Nederlanden. De subsidieontvanger werkt
      mee aan overdracht van de rechten bij akte.
    url: https://wetten.overheid.nl/BWBR0026156/2010-07-01#Artikel13
  - number: 13a
    text: |-
      [Artikel 5.7][ref1] en [5.8 van de Regeling][ref2] zijn van overeenkomstige toepassing op de ontvanger van een
      subsidie op grond van deze regeling met dien verstande dat de artikelen ook van toepassing zijn op subsidies die
      minder bedragen dan € 25.000.


      [ref1]: https://wetten.overheid.nl/BWBR0027597#Artikel5.7
      [ref2]: https://wetten.overheid.nl/BWBR0027597#Artikel5.8
    url: https://wetten.overheid.nl/BWBR0026156/2010-07-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0027597
        artikel: '5.7'
      - id: ref2
        bwb_id: BWBR0027597
        artikel: '5.8'
  - number: '14'
    text: |-
      1 Binnen vier maanden na afloop van de activiteiten waarvoor subsidie is verleend, dient de subsidieontvanger de
      volgende bescheiden in:

      a. een activiteitenverslag; en

      b. een jaarrekening of financieel verslag.

      2 [Artikel 5.11, derde en vijfde lid][ref1], en [artikel 5.12, eerste lid, van de Regeling][ref2] zijn van
      overeenkomstige toepassing.

      3 Indien het verleende subsidiebedrag € 125.000 of meer bedraagt is [artikel 2.27 van de Regeling][ref3] van
      overeenkomstige toepassing op de jaarrekening en het financieel verslag.


      [ref1]: https://wetten.overheid.nl/BWBR0027597#Artikel5.11
      [ref2]: https://wetten.overheid.nl/BWBR0027597#Artikel5.12
      [ref3]: https://wetten.overheid.nl/BWBR0027597#Artikel2.27
    url: https://wetten.overheid.nl/BWBR0026156/2010-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0027597
        artikel: '5.11'
      - id: ref2
        bwb_id: BWBR0027597
        artikel: '5.12'
      - id: ref3
        bwb_id: BWBR0027597
        artikel: '2.27'
  - number: '15'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0026156/2010-07-01#Artikel15
  - number: '16'
    text: Deze regeling wordt aangehaald als Subsidieregeling bibliotheekinnovatie.
    url: https://wetten.overheid.nl/BWBR0026156/2010-07-01#Artikel16
