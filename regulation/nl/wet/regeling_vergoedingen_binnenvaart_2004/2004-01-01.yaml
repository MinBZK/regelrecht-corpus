preamble:
  text: |-
    Gelet op artikel 56 van de Wet vervoer binnenvaart;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0016068/2004-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      De aanvrager is een vergoeding verschuldigd van:

      a. € 314 voor de behandeling van een aanvraag om een vergunning als bedoeld in
      [artikel 11, eerste lid, van de Wet vervoer binnenvaart][ref1];

      b. € 95 voor de behandeling van een aanvraag om wijziging van een vergunning als bedoeld in
      [artikel 11, eerste lid, van de Wet vervoer binnenvaart][ref2];

      c. € 95 voor de behandeling van een aanvraag om een vergunning als bedoeld in
      [artikel 17, eerste lid, van de Wet vervoer binnenvaart][ref3];

      d. € 95 voor de behandeling van een aanvraag om wijziging van een vergunning als bedoeld in
      [artikel 17, eerste lid, van de Wet vervoer binnenvaart][ref4];

      e. € 95 voor de behandeling van een aanvraag om een vergunning als bedoeld in
      [artikel 18, eerste lid, van de Wet vervoer binnenvaart][ref5];

      f. € 95 voor de behandeling van een aanvraag om wijziging van een vergunning als bedoeld in
      [artikel 18, eerste lid, van de Wet vervoer binnenvaart][ref6];

      g. € 95 voor de behandeling van een aanvraag om ontheffing van de eis van vakbekwaamheid als bedoeld in
      [artikel 16, eerste lid, van het Besluit vervoer binnenvaart][ref7];

      h. € 95 voor de behandeling van een aanvraag om een vergunningbewijs als bedoeld in
      [artikel 22 van de Wet vervoer binnenvaart][ref8];

      i. € 314 voor de behandeling van een aanvraag om een inschrijving eigen vervoer als bedoeld in
      [artikel 41, eerste lid, van de Wet vervoer binnenvaart][ref9];

      j. € 314 voor de behandeling van een aanvraag om een inschrijving eigen vervoer als bedoeld in
      [artikel 45, eerste lid, van de Wet vervoer binnenvaart][ref10];

      k. € 95 voor de behandeling van een aanvraag om een inschrijvingsbewijs als bedoeld in
      [artikel 46, eerste lid, van de Wet vervoer binnenvaart][ref11];

      l. € 23 voor de behandeling van een aanvraag om een gewaarmerkt afschrift van de documenten, bedoeld in de
      onderdelen a, c, e, h, i, j en k.


