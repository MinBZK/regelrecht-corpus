        artikel: 4a
        paragraaf: '2'
  - number: '3'
    text: |-
      De minister kan de eigenaar op aanvraag een subsidie verlenen voor de kosten van de werkzaamheden in bossen of
      natuurterreinen, welke er op zijn gericht de effecten van verzuring en vermesting, en de effecten van verdroging in
      bestaande bossen of natuurterreinen te verminderen of ongedaan te maken.
    url: https://wetten.overheid.nl/BWBR0007715/2002-11-22#Artikel3
  - number: '4'
    text: |-
      1 Subsidies als bedoeld in [artikel 3][ref1] kunnen worden verleend voor de volgende werkzaamheden:

      a. in natuurterreinen of bos:

      1°. maaien;

      2°. geschikt maken voor begrazing;

      3°. chopperen;

      4°. plaggen;

      5°. baggeren;

      6°. toevoegen van basische stoffen teneinde de mineralenbalans of zuurgraad te herstellen;

      7°. aanleggen van depots ten behoeve van tijdelijke opslag van gemaaid, geplagd of gebaggerd materiaal;

      8°. verbeteren van de hydrologische situatie;

      9°. werkzaamheden ten behoeve van het meten en registreren van ontwikkelingen, voorafgaande aan en volgend op
      maatregelen als bedoeld onder 1° tot en met 8°, of

      10°. werkzaamheden ter zake van planvorming en directievoering;

      b. in bos:

      1°. het bepalen van voedingsstoffenhuishouding,

      2°. het toedienen van nutriënten, of

      3°. aanpassing van de bosvegetatie door het aanwijzen van toekomstbomen, structuurdunning of noodverjonging ter
      verbetering van de vitaliteit van het bos dan wel de aanpassing van het bos aan de groeiplaats.

      2 Onder het bepalen van de voedingsstoffenhuishouding, bedoeld in het eerste lid, onderdeel b, onder 1°, wordt
      verstaan het volgens de methoden van de in bijlage 2 opgenomen ’Richtlijnen voor de mineralentoediening en
      bekalking als effectgerichte maatregelen in bossen’ door de eigenaar:

      a. nemen van een grondmonster, al dan niet in combinatie met een naald- of bladmonster, en

      b. uitvoeren of laten uitvoeren van chemisch onderzoek en het opstellen van een advies tot herstel van de nu-
      triëntenbalans.

      3 Onder het toedienen van nutriënten bedoeld in het eerste lid, onderdeel b, onder 2°, wordt verstaan de op
      basis van het advies tot herstel van de nu-triëntenbalans noodzakelijk gebleken toediening van meststoffen zoals
      aangegeven in de in bijlage 2 opgenomen ’Richtlijnen voor mineralentoediening en bekalking als effectgerichte
      maatregelen in bossen’.


      [ref1]: https://wetten.overheid.nl/BWBR0007715#Artikel3
    url: https://wetten.overheid.nl/BWBR0007715/2002-11-22#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007715
        artikel: '3'
        paragraaf: '2'
  - number: 4a
    text: |-
      Teneinde de effectiviteit van werkzaamheden te toetsen kan de minister ook voor andere werkzaamheden dan bedoeld
      in artikel 4 aan de Vereniging tot Behoud van Natuurmonumenten in Nederland, of door tussenkomst van de Unie
      van Landschappen aan de provinciale landschappen, danwel door tussenkomst van de Unie van Bosgroepen, aan andere
      eigenaren een subsidie verlenen.
    url: https://wetten.overheid.nl/BWBR0007715/2002-11-22#Artikel4a
  - number: '5'
    text: |-
      1 De subsidie bedraagt 95% van de werkelijke kosten.

      2 Indien voor het verrichten van werkzaamheden waarvoor de subsidie wordt verleend, eveneens andere subsidies of
      bijdragen van derden worden ontvangen en hierdoor het totaal van de subsidies meer dan 95% van de werkelijke kosten
      bedraagt of het totaal van de subsidies en bijdragen van derden meer dan 100% van de werkelijke kosten bedraagt,
      bedraagt het subsidiebedrag dat op grond van deze regeling wordt verstrekt zoveel minder dan 95% dat het totaal van
      de subsidies niet meer dan 95% of het totaal van de subsidies en bijdragen van derden niet meer dan 100% bedraagt
      van de werkelijke kosten.

      3 Opbrengsten voortvloeiend uit de werkzaamheden, worden in mindering gebracht op de werkelijke kosten.
    url: https://wetten.overheid.nl/BWBR0007715/2002-11-22#Artikel5
  - number: 5a
    text: |-
      Bij de berekening van de hoogte van de subsdie worden uitsluitend kosten in aanmerking genomen die gemaakt zijn ten
      behoeve van de in artikelen 4 en 4a bedoelde werkzaamheden.

      Als kosten waarvoor een subsidie kan worden verleend worden voorts uitsluitend in aanmerking genomen de volgende
      door de aanvrager aantoonbaar gemaakte en betaalde kosten die rechtstreeks zijn toe te rekenen aan de werkzaamheden
      als bedoeld in de artikelen 4 en 4a:

      a. kosten die gemaakt moeten worden teneinde de uitgangssituatie van het terrein vast te leggen;

      b. kosten van een wetenschappelijk advies;

      c. kosten van planvoorbereiding;

      d. kosten van directie en toezicht;

      e. kosten van uitvoering en aanleg;

      f. kosten van monitoring en effectmeting van de maatregel;

      g. kosten van terreingebonden voorlichting voor zover de voorlichting betrekking heeft op de maatregel;

      h. legeskosten voor vergunningen;

      i. aan- en afvoerkosten van materieel;

      j. kosten van terreinvoorbereiding ten behoeve van de uit te voeren maatregel;

      3 De kosten worden in aanmerking genomen met inbegrip van de verschuldigde omzetbelasting, indien de aanvrager
      omzetbelasting niet kan verrekenen met de door hem af te dragen omzetbelasting.
    url: https://wetten.overheid.nl/BWBR0007715/2002-11-22#Artikel5a
  - number: '6'
    text: |-
      De subsidieverlening wordt geweigerd indien:

      a. reeds een aanvang is gemaakt met de werkzaamheden voordat LASER de ontvangst van de aanvraag tot
      subsidieverlening heeft bevestigd;

      b. reeds uit anderen hoofde een subsidie uit 's Rijks kas is verstrekt of wordt verstrekt voor de uitvoering van de
      werkzaamheden als bedoeld in de [artikelen 4][ref1] en [4a][ref2];

      c. de voorgenomen maatregelen in onvoldoende mate bijdragen aan het verminderen of ongedaan maken van effecten van
      verzuring, vermesting of verdroging in bossen en natuurterreinen;

      d. de voorgenomen maatregelen onevenredig schade toebrengen aan aanwezige natuurwaarden;

      e. de subsidie minder zou bedragen dan € 4.537,80.


      [ref1]: https://wetten.overheid.nl/BWBR0007715#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007715#Artikel4a
    url: https://wetten.overheid.nl/BWBR0007715/2002-11-22#Artikel6
    references:
