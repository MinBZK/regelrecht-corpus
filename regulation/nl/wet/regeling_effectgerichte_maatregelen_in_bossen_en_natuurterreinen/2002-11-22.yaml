  - number: '8'
    text: |-
      1 Aanvragen tot subsidieverlening als bedoeld in artikel 3 kunnen worden ingediend in de periode van 1 november
      voorafgaand aan het jaar waarvoor de subsidie wordt verstrekt tot 1 maart.

      2 De minister kan besluiten dat aanvragen tot subsidieverlening ook na de periode, genoemd in het eerste lid,
      kunnen worden ingediend. Hij geeft kennis van dit besluit in de Staatscourant.

      3 De minister kan de mogelijkheid tot het indienen van aanvragen tot subsidieverlening als bedoeld in het eerste,
      onderscheidenlijk het tweede lid, voor verschillende ecosystemen of maatregelen afzonderlijk vaststellen.
    url: https://wetten.overheid.nl/BWBR0007715/2002-11-22#Artikel8
  - number: '9'
    text: |-
      1 Aanvragen tot subsidieverlening als bedoeld in de [artikelen 4][ref1] en [4a][ref2] worden door de eigenaar
      gericht aan de minister op een daartoe door de minister vastgesteld formulier en vergezeld van een topografische
      kaart met schaal 1:10.000 waarop het terrein en de plaats waar de verschillende werkzaamheden waarvoor subsidie
      wordt gevraagd zijn aangegeven. De aanvraag tot subsidieverlening wordt ingediend bij LASER.

      2 De aanvraag tot subsidieverlening voor maatregelen als bedoeld in [artikel 4, eerste lid][ref3], gaat vergezeld
      van:

      a. een plan dat inzicht biedt in de aard van de werkzaamheden, de doelstelling, de effectiviteit en de kansrijkdom
      van de maatregelen;

      b. een begroting van de met de werkzaamheden gemoeide kosten en opbrengsten;

      c. een overzicht van de bijdragen van derden en eventuele andere subsidies voor de betrokken werkzaamheden.

      3 Een aanvraag tot subsidieverlening voor maatregelen als bedoeld in artikel 4, eerste lid, onderdeel b, onder 1o,
      gaat tevens vergezeld van:

      a. een opgave van het aantal monsterpunten;

      b. een opgave van de aard van de bemonsteringen.

      4 De aanvraag tot subsidieverlening voor maatregelen als bedoeld in artikel 4, eerste lid, onderdeel b, onder 2o,
      gaat tevens vergezeld van:

      a. een opgave per meststof van de oppervlakte bos waarop de toediening van de meststof betrekking heeft;

      b. een bemestingsadvies van ten hoogste vijf jaar oud.


      [ref1]: https://wetten.overheid.nl/BWBR0007715#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007715#Artikel4a
      [ref3]: https://wetten.overheid.nl/BWBR0007715#Artikel4
    url: https://wetten.overheid.nl/BWBR0007715/2002-11-22#Artikel9
    references:
