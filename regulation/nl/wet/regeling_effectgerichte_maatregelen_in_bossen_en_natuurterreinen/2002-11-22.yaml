        artikel: '6'
  - number: '20'
    text: De minister kan in bijzondere gevallen van het bepaalde in deze regeling afwijken.
    url: https://wetten.overheid.nl/BWBR0007715/2002-11-22#Artikel20
  - number: 21a
    text: |-
      Subsidies op grond van deze regeling worden verleend onder het voorbehoud dat de Commissie van de Europese
      Gemeenschappen de vereiste goedkeuring voor deze regeling verleent.
    url: https://wetten.overheid.nl/BWBR0007715/2002-11-22#Artikel21a
  - number: 21b
    text: |-
      Deze regeling berust op [artikel 2 van de Kaderwet LNV-subsidies][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009194#Artikel2
    url: https://wetten.overheid.nl/BWBR0007715/2002-11-22#Artikel21b
    references:
