        artikel: '4'
        paragraaf: '2'
  - number: '10'
    text: |-
      De minister geeft een beschikking tot subsidieverlening. De beschikking tot subsidieverlening vermeldt de termijn
      waarbinnen het project moet zijn afgerond en de termijn waarbinnen de aanvraag tot subsidieverlening moet worden
      ingediend.
    url: https://wetten.overheid.nl/BWBR0007715/2002-11-22#Artikel10
  - number: '12'
    text: |-
      Afhankelijk van de stand van uitvoering van de werkzaamheden kan op aanvraag een voorschot worden verleend van
      ten hoogste 80% van het subsidiebedrag of van het bedrag waarop de subsidie overeenkomstig de beschikking tot
      subsidieverlening ten hoogste kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007715/2002-11-22#Artikel12
  - number: '13'
    text: |-
      1 De subsidieontvanger aan wie een subsidie voor maatregelen als bedoeld in
      [artikel 4, eerste lid, onderdeel b][ref1], is verleend, is verplicht er voor zorg te dragen dat aan de Algemene
      Inspectiedienst van het Ministerie van Landbouw, Natuurbeheer en Visserij schriftelijk mededeling wordt gedaan van
      de datum waarop de werkzaamheden zullen worden uitgevoerd.

      2 De mededeling, bedoeld in het eerste lid, dient uiterlijk de tweede dag vóór de dag van uitvoering van de
      werkzaamheden te zijn ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0007715#Artikel4
    url: https://wetten.overheid.nl/BWBR0007715/2002-11-22#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0007715
        artikel: '4'
        paragraaf: '2'
  - number: '14'
    text: |-
      1 De subsidieontvanger dient voor de afloop van de in de beschikking tot subsidieverlening aangegeven termijn,
      bedoeld in [artikel 10][ref1], een aanvraag tot subsidievaststelling in bij LASER.

      2 De door de subsidieontvanger af te leggen rekening en verantwoording omtrent de aan de activiteiten
      verbonden uitgaven en inkomsten, gaat vergezeld van een verklaring van een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007715#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0007715/2002-11-22#Artikel14
    references:
