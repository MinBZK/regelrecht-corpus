preamble:
  text: |-
    Mede gelet op artikel 11 Boswet;

    Gezien het advies van het Bosschap;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0007715/2002-11-22#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze regeling wordt verstaan onder:

      a. minister: Minister van Landbouw, Natuurbeheer en Visserij;

      b. eigenaar: natuurlijke persoon of rechtspersoon, die krachtens eigendom of enig ander zakelijk recht, dan wel
      krachtens persoonlijk recht het genot heeft van de grond;

      c. bos: aaneengesloten terrein, waarop de meldings- en herplantplicht, bedoeld in de artikelen 2 en 3 van de
      Boswet, van toepassing is;

      d. natuurterrein: aaneengesloten, in Nederland gelegen terrein, voorzover geen bos, bestaande uit hoogveen,
      zandverstuiving, droge heide of droog schraal grasland, natte heide of nat schraal grasland, vennen, plassen of
      andere wateren;

      e. publiekrechtelijk lichaam: gemeente, provincie, waterschap of rechtspersoonlijkheid bezittend lichaam als
      bedoeld in de Wet gemeenschappelijke regelingen;

      f. LASER: Regiokantoor Zuidoost van de dienst Landelijke Service bij Regelingen van het Ministerie van Landbouw,
      Natuurbeheer en Visserij.

      2 Onder aaneengesloten terrein wordt mede verstaan een terrein niet gescheiden door een spoordijk, kanaal, rivier,
      rijksweg of op andere wijze onderbroken over meer dan 100 meter.
    url: https://wetten.overheid.nl/BWBR0007715/2002-11-22#Artikel1
  - number: '2'
    text: |-
      1 De minister stelt ieder begrotingsjaar een subsidieplafond vast voor de de verlening van subsidies als bedoeld
      in [artikel 3][ref1] en [artikel 4a][ref2]. Hij kan daarbij voor verschillende categorieën aanvragers afzonderlijke
      bedragen vaststellen.

      2 De minister verdeelt het beschikbare bedrag in de volgorde van ontvangst van de aanvragen.

      3 Indien het subsidieplafond wordt overschreden, kan de minister besluiten dat geen aanvragen tot subsidieverlening
      meer kunnen worden ingediend. De minister geeft van dit besluit kennis in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0007715#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007715#Artikel4a
    url: https://wetten.overheid.nl/BWBR0007715/2002-11-22#Artikel2
    references:
      - id: ref1
