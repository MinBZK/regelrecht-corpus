        artikel: '2'
  - number: '22'
    text: Deze regeling wordt binnen drie jaar na inwerkingtreding geëvalueerd.
    url: https://wetten.overheid.nl/BWBR0007715/2002-11-22#Artikel22
  - number: '23'
    text: |-
      De Regeling effectgerichte maatregelen bos en de Regeling effectgerichte maatregelen in natuurterreinen worden
      ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007715/2002-11-22#Artikel23
  - number: '24'
    text: Deze regeling treedt in werking met ingang van 1 januari 1996.
    url: https://wetten.overheid.nl/BWBR0007715/2002-11-22#Artikel24
  - number: '25'
    text: 'Deze regeling wordt aangehaald als: Regeling effectgerichte maatregelen in bossen en natuurterreinen.'
