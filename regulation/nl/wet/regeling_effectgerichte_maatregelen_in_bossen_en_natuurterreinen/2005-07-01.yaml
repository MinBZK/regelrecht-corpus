---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_effectgerichte_maatregelen_in_bossen_en_natuurterreinen
regulatory_layer: WET
publication_date: '1999-12-29'
valid_from: '2005-07-01'
bwb_id: BWBR0007715
url: https://wetten.overheid.nl/BWBR0007715/2005-07-01
preamble:
  text: |-
    Mede gelet op artikel 11 Boswet;

    Gezien het advies van het Bosschap;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel1
  - number: 1.1.a
    text: 'minister: Minister van Landbouw, Natuur en Voedselkwaliteit;'
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel1
  - number: 1.1.b
    text: |-
      eigenaar: natuurlijke persoon, privaatrechtelijke rechtspersoon, of gemeente, provincie of waterschap of een
      rechtspersoonlijkheid bezittend lichaam als bedoeld in de [wet gemeenschappelijke regelingen][ref1] die krachtens
      eigendom of enig ander zakelijk recht het genot heeft van de grond;


      [ref1]: https://wetten.overheid.nl/BWBR0003740
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003740
  - number: 1.1.c
    text: |-
      bos: aaneengesloten terrein, waarop de meldings- en herplantplicht, bedoeld in de [artikelen 2][ref1] en
      [3 van de Boswet][ref2], van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0002357#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002357#Artikel3
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002357
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0002357
        artikel: '3'
  - number: 1.1.d
    text: |-
      natuurterrein: aaneengesloten, in Nederland gelegen terrein, voorzover geen bos, bestaande uit hoogveen,
      zandverstuiving, droge heide of droog schraal grasland, natte heide of nat schraal grasland, vennen, plassen of
      andere wateren;
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel1
  - number: 1.1.e
    text: 'Dienst Regelingen: Dienst Regelingen van het Ministerie van Landbouw, Natuur en Voedselkwaliteit.'
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel1
  - number: '1.2'
    text: |-
      Onder aaneengesloten terrein wordt mede verstaan een terrein niet gescheiden door een spoordijk, kanaal, rivier,
      rijksweg of op andere wijze onderbroken over meer dan 100 meter.
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel1
  - number: '2.1'
    text: |-
      De minister stelt ieder begrotingsjaar een subsidieplafond vast voor de de verlening van subsidies als bedoeld in
      [artikel 3][ref1] en [artikel 4a][ref2]. Hij kan daarbij voor verschillende categorieën aanvragers afzonderlijke
      bedragen vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0007715#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007715#Artikel4a
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007715
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007715
        artikel: 4a
        paragraaf: '2'
  - number: '2.2'
    text: |-
      De minister verdeelt het beschikbare bedrag in de volgorde van ontvangst van de subsidie-aanvragen waarbij als
      datum van ontvangst wordt aangemerkt de datum waarop de volledige aanvraag is ontvangen.
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel2
  - number: '2.3'
    text: |-
      Indien het subsidieplafond wordt overschreden, kan de minister besluiten dat geen aanvragen tot subsidieverlening
      meer kunnen worden ingediend. De minister geeft van dit besluit kennis in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel2
  - number: '3.1'
    text: |-
      De minister kan aan eigenaren, aan de Unie van Bosgroepen of aan De Landschappen op aanvraag een subsidie verlenen
      voor de kosten van de werkzaamheden in bossen of natuurterreinen, welke er op gericht zijn de effecten van
      verzuring en vermesting, en de effecten van verdroging in bestaande bossen of natuurterreinen te verminderen of
      ongedaan te maken.
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel3
  - number: '3.2'
    text: 'Geen subsidie wordt verleend:'
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel3
  - number: 3.2.a
    text: aan Staatsbosbeheer of met betrekking tot terreinen in eigendom van Staatsbosbeheer;
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel3
  - number: 3.2.b
    text: |-
      met betrekking tot terreinen die eigendom zijn van andere publiekrechtelijke lichamen dan bedoeld in
      [artikel 1, eerste lid, onderdeel b][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0007715#Artikel1
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007715
        artikel: '1'
        paragraaf: '1'
  - number: 3.2.c
    text: |-
      indien de aanvrager krachtens erfpacht het genot heeft van de grond en de duur van de erfpachtovereenkomst minder
      dan 25 jaar bedraagt.
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel3
  - number: '4.1'
    text: |-
      Subsidies als bedoeld in [artikel 3][ref1] kunnen worden verleend voor de volgende werkzaamheden:


      [ref1]: https://wetten.overheid.nl/BWBR0007715#Artikel3
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007715
        artikel: '3'
        paragraaf: '2'
  - number: 4.1.a
    text: 'in natuurterreinen of bos:'
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel4
  - number: 4.1.a.1°
    text: maaien;
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel4
  - number: 4.1.a.2°
    text: geschikt maken voor begrazing;
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel4
  - number: 4.1.a.3°
    text: chopperen;
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel4
  - number: 4.1.a.4°
    text: plaggen;
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel4
  - number: 4.1.a.5°
    text: baggeren;
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel4
  - number: 4.1.a.6°
    text: toevoegen van basische stoffen teneinde de mineralenbalans of zuurgraad te herstellen;
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel4
  - number: 4.1.a.7°
    text: aanleggen van depots ten behoeve van tijdelijke opslag van gemaaid, geplagd of gebaggerd materiaal;
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel4
  - number: 4.1.a.8°
    text: verbeteren van de hydrologische situatie;
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel4
  - number: 4.1.a.9°
    text: |-
      werkzaamheden ten behoeve van het meten en registreren van ontwikkelingen, voorafgaande aan en volgend op
      maatregelen als bedoeld onder 1° tot en met 8°;
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel4
  - number: 4.1.a.10°
    text: werkzaamheden ter zake van planvorming en directievoering;
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel4
  - number: 4.1.a.11°
    text: aanpassen van de morfologie;
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel4
  - number: 4.1.a.12°
    text: toevoer van diasporen en faunamateriaal;
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel4
  - number: 4.1.a.13°
    text: beheer van de voedselketen, of
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel4
  - number: 4.1.a.14°
    text: het verwijderen van bosopslag.
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel4
  - number: 4.1.b
    text: 'in bos:'
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel4
  - number: 4.1.b.1°
    text: het bepalen van de voedingsstoffenhuishouding,
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel4
  - number: 4.1.b.2°
    text: het toedienen van nutriënten, of
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel4
  - number: 4.1.b.3°
    text: |-
      aanpassing van de bosvegetatie door het aanwijzen van toekomstbomen, structuurdunning of noodverjonging ter
      verbetering van de vitaliteit van het bos dan wel de aanpassing van het bos aan de groeiplaats.
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel4
  - number: '4.2'
    text: |-
      Onder het bepalen van de voedingsstoffenhuishouding, bedoeld in het eerste lid, onderdeel b, onder 1°, wordt
      verstaan het volgens de methoden van de in [bijlage 2][ref1] opgenomen ’Richtlijnen voor de mineralentoediening en
      bekalking als effectgerichte maatregelen in bossen’ door de eigenaar:


      [ref1]: https://wetten.overheid.nl/BWBR0007715
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007715
  - number: 4.2.a
    text: nemen van een grondmonster, al dan niet in combinatie met een naald- of bladmonster, en
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel4
  - number: 4.2.b
    text: |-
      uitvoeren of laten uitvoeren van chemisch onderzoek en het opstellen van een advies tot herstel van de nu-
      triëntenbalans.
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel4
  - number: '4.3'
    text: |-
      Onder het toedienen van nutriënten bedoeld in het eerste lid, onderdeel b, onder 2°, wordt verstaan de op basis van
      het advies tot herstel van de nu-triëntenbalans noodzakelijk gebleken toediening van meststoffen zoals aangegeven
      in de in [bijlage 2][ref1] opgenomen ’Richtlijnen voor mineralentoediening en bekalking als effectgerichte
      maatregelen in bossen’.


      [ref1]: https://wetten.overheid.nl/BWBR0007715
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007715
  - number: 4a
    text: |-
      Teneinde de effectiviteit van werkzaamheden te toetsen kan de minister ook voor andere werkzaamheden dan bedoeld
      in [artikel 4][ref1] aan de Vereniging tot Behoud van Natuurmonumenten in Nederland, of door tussenkomst van
      De Landschappen aan de provinciale landschappen, danwel door tussenkomst van de Unie van Bosgroepen, aan andere
      eigenaren een subsidie verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0007715#Artikel4
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0007715
        artikel: '4'
        paragraaf: '2'
  - number: '5.1'
    text: De subsidie bedraagt 95% van de werkelijk gemaakte noodzakelijke subsidiabele kosten.
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel5
  - number: '5.2'
    text: |-
      Indien voor het verrichten van werkzaamheden waarvoor subsidie wordt verleend, eveneens andere subsidies worden
      verstrekt door de minister of andere overheidsorganen en hierdoor het totaal van de overheidsbijdragen meer
      bedraagt dan 95% van de werkelijk gemaakte noodzakelijke subsidiabele kosten, wordt de subsidie op grond van
      deze regeling zoveel lager vastgesteld dat het totaal van de overheidsbijdragen niet meer bedraagt dan 95% van de
      werkelijk gemaakte noodzakelijke subsidiabele kosten.
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel5
  - number: '5.3'
    text: Opbrengsten voortvloeiend uit de werkzaamheden, worden in mindering gebracht op de werkelijke kosten.
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel5
  - number: 5a.1
    text: |-
      Bij de berekening van de hoogte van de subsdie worden uitsluitend kosten in aanmerking genomen die gemaakt zijn ten
      behoeve van de in artikelen 4 en 4a bedoelde werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel5a
  - number: 5a.2
    text: |-
      Als kosten waarvoor een subsidie kan worden verleend worden voorts uitsluitend in aanmerking genomen de volgende
      door de aanvrager aantoonbaar gemaakte en betaalde kosten die rechtstreeks zijn toe te rekenen aan de werkzaamheden
      als bedoeld in de artikelen 4 en 4a:
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel5a
  - number: 5a.2.a
    text: kosten die gemaakt moeten worden teneinde de uitgangssituatie van het terrein vast te leggen;
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel5a
  - number: 5a.2.b
    text: kosten van een wetenschappelijk advies;
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel5a
  - number: 5a.2.c
    text: kosten van planvoorbereiding;
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel5a
  - number: 5a.2.d
    text: kosten van directie en toezicht;
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel5a
  - number: 5a.2.e
    text: kosten van uitvoering en aanleg;
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel5a
  - number: 5a.2.f
    text: kosten van monitoring en effectmeting van de maatregel;
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel5a
  - number: 5a.2.g
    text: kosten van terreingebonden voorlichting voor zover de voorlichting betrekking heeft op de maatregel;
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel5a
  - number: 5a.2.h
    text: legeskosten voor vergunningen;
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel5a
  - number: 5a.2.i
    text: aan- en afvoerkosten van materieel;
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel5a
  - number: 5a.2.j
    text: kosten van terreinvoorbereiding ten behoeve van de uit te voeren maatregel;
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel5a
  - number: 5a.3
    text: |-
      De kosten worden in aanmerking genomen met inbegrip van de verschuldigde omzetbelasting, indien de aanvrager
      omzetbelasting niet kan verrekenen met de door hem af te dragen omzetbelasting.
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel5a
  - number: '6'
    text: 'De subsidieverlening wordt geweigerd indien:'
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel6
  - number: 6.a
    text: |-
      reeds een aanvang is gemaakt met de werkzaamheden voordat Dienst Regelingen de ontvangst van de aanvraag tot
      subsidieverlening heeft bevestigd;
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel6
  - number: 6.b
    text: |-
      de voorgenomen maatregelen in onvoldoende mate bijdragen aan het verminderen of ongedaan maken van effecten van
      verzuring, vermesting of verdroging in bossen en natuurterreinen;
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel6
  - number: 6.c
    text: de voorgenomen maatregelen onevenredig schade toebrengen aan aanwezige natuurwaarden;
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel6
  - number: 6.d
    text: de subsidie minder zou bedragen dan € 5.000,00.
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel6
  - number: '8.1'
    text: |-
      De minister stelt jaarlijks een periode vast waarin aanvragen tot subsidieverlening kunnen worden ingediend en
      geeft van dit besluit kennis in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel8
  - number: '8.2'
    text: De minister kan voor de verschillende natuurdoeltypen of maatregelen afzonderlijke aanvraagperioden vaststellen.
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel8
  - number: '9.1'
    text: |-
      Aanvragen tot subsidieverlening als bedoeld in de [artikelen 4][ref1] en [4a][ref2] worden door de eigenaar gericht
      aan de minister op een daartoe door de minister vastgesteld formulier en vergezeld van een topografische kaart
      met schaal 1:10.000 waarop het terrein en de plaats waar de verschillende werkzaamheden waarvoor subsidie wordt
      gevraagd zijn aangegeven. De aanvraag tot subsidieverlening wordt ingediend bij Dienst Regelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0007715#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007715#Artikel4a
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007715
        artikel: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007715
        artikel: 4a
        paragraaf: '2'
  - number: '9.2'
    text: |-
      De aanvraag tot subsidieverlening voor maatregelen als bedoeld in [artikel 4, eerste lid][ref1], gaat vergezeld
      van:


      [ref1]: https://wetten.overheid.nl/BWBR0007715#Artikel4
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007715
        artikel: '4'
        paragraaf: '2'
  - number: 9.2.a
    text: |-
      een plan dat inzicht biedt in de aard van de werkzaamheden, de doelstelling, de effectiviteit en de kansrijkdom van
      de maatregelen;
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel9
  - number: 9.2.b
    text: een begroting van de met de werkzaamheden gemoeide kosten en opbrengsten;
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel9
  - number: 9.2.c
    text: een overzicht van de bijdragen van derden en eventuele andere subsidies voor de betrokken werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel9
  - number: '9.3'
    text: |-
      Een aanvraag tot subsidieverlening voor maatregelen als bedoeld in
      [artikel 4, eerste lid, onderdeel b, onder 1°][ref1], gaat tevens vergezeld van:


      [ref1]: https://wetten.overheid.nl/BWBR0007715#Artikel4
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007715
        artikel: '4'
        paragraaf: '2'
  - number: 9.3.a
    text: een opgave van het aantal monsterpunten;
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel9
  - number: 9.3.b
    text: een opgave van de aard van de bemonsteringen.
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel9
  - number: '9.4'
    text: |-
      De aanvraag tot subsidieverlening voor maatregelen als bedoeld in
      [artikel 4, eerste lid, onderdeel b, onder 2°][ref1], gaat tevens vergezeld van:


      [ref1]: https://wetten.overheid.nl/BWBR0007715#Artikel4
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007715
        artikel: '4'
        paragraaf: '2'
  - number: 9.4.a
    text: een opgave per meststof van de oppervlakte bos waarop de toediening van de meststof betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel9
  - number: 9.4.b
    text: een bemestingsadvies van ten hoogste vijf jaar oud.
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel9
  - number: '10'
    text: |-
      De minister geeft een beschikking tot subsidieverlening. De beschikking tot subsidieverlening vermeldt de termijn
      waarbinnen het project moet zijn afgerond en de termijn waarbinnen de aanvraag tot subsidieverlening moet worden
      ingediend.
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel10
  - number: 10a
    text: |-
      Aan een beschikking als bedoeld in [artikel 10][ref1], kunnen door de minister verplichtingen worden verbonden
      omtrent de wijze waarop de werkzaamheden dienen te worden uitgevoerd. Deze verplichtingen kunnen werkzaamheden
      betreffen die al dan niet strekken tot verwezenlijking van het doel van de subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0007715#Artikel10
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0007715
        artikel: '10'
        paragraaf: '4'
  - number: '12'
    text: |-
      Afhankelijk van de stand van uitvoering van de werkzaamheden kan op aanvraag een voorschot worden verleend van
      ten hoogste 80% van het subsidiebedrag of van het bedrag waarop de subsidie overeenkomstig de beschikking tot
      subsidieverlening ten hoogste kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel12
  - number: '13.1'
    text: |-
      De subsidieontvanger aan wie een subsidie voor maatregelen als bedoeld in
      __REF000___________________________________________________________________________________________________________
      _, is verleend, meldt schriftelijk aan de Algemene Inspectiedienst van het Ministerie van Landbouw, Natuur en
      Voedselkwaliteit de datum waarop de werkzaamheden zullen worden uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0007715#Artikel4
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0007715
        artikel: '4'
        paragraaf: '2'
  - number: '13.2'
    text: |-
      De mededeling, bedoeld in het eerste lid, dient uiterlijk de tweede dag vóór de dag van uitvoering van de
      werkzaamheden te zijn ontvangen.
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel13
  - number: '14.1'
    text: |-
      De subsidieontvanger dient voor de afloop van de in de beschikking tot subsidieverlening aangegeven termijn,
      bedoeld in [artikel 10][ref1], een aanvraag tot subsidievaststelling in bij Dienst Regelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0007715#Artikel10
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0007715
        artikel: '10'
        paragraaf: '4'
  - number: '14.2'
    text: |-
      De door de subsidieontvanger af te leggen rekening en verantwoording omtrent de aan de activiteiten
      verbonden uitgaven en inkomsten, gaat vergezeld van een verklaring van een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '15'
    text: De minister geeft een beschikking tot subsidievaststelling.
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel15
  - number: '19'
    text: |-
      Indien toepassing wordt gegeven aan [artikel 4.57 van de Algemene Wet Bestuursrecht][ref1] of
      [artikel 6 van de Kaderwet LNV-subsidies][ref2], worden terug te vorderen bedragen vermeerderd met de wettelijke
      rente vanaf het tijdstip van terugvordering tot aan het tijdstip van algehele voldoening.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0009194#Artikel6
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0009194
        artikel: '6'
  - number: '20'
    text: De minister kan in bijzondere gevallen van het bepaalde in deze regeling afwijken.
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel20
  - number: 20a
    text: |-
      Op een aanvraag tot subsidieverlening die is ingediend voor 1 juli 2005 is deze regeling van toepassing zoals
      deze luidt tot de inwerkingtreding van de Regeling van de Minister van Landbouw, Natuur en Voedselkwaliteit van
      3 februari 2005, nr. TRCJZ/2005/69, houdende wijziging van de Regeling effectgerichte maatregelen in bossen en
      natuurterreinen, wijziging van het Besluit instandhouding schaapskuddes en wijziging van de Regeling diverse
      subsidieplafonds en aanvraagperioden LNV (Stcrt. 30).
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel20a
  - number: 21a
    text: |-
      Subsidies op grond van deze regeling worden verleend onder het voorbehoud dat de Commissie van de Europese
      Gemeenschappen de vereiste goedkeuring voor deze regeling verleent.
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel21a
  - number: 21b
    text: |-
      Deze regeling berust op [artikel 2 van de Kaderwet LNV-subsidies][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009194#Artikel2
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel21b
    references:
      - id: ref1
        bwb_id: BWBR0009194
        artikel: '2'
  - number: '22'
    text: Deze regeling wordt binnen drie jaar na inwerkingtreding geëvalueerd.
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel22
  - number: '23'
    text: |-
      De Regeling effectgerichte maatregelen bos en de Regeling effectgerichte maatregelen in natuurterreinen worden
      ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel23
  - number: '24'
    text: Deze regeling treedt in werking met ingang van 1 januari 1996.
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel24
  - number: '25'
    text: 'Deze regeling wordt aangehaald als: Regeling effectgerichte maatregelen in bossen en natuurterreinen.'
    url: https://wetten.overheid.nl/BWBR0007715/2005-07-01#Artikel25
