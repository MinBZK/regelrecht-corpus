        artikel: '12'
        hoofdstuk: '4'
  - number: '2'
    text: |-
      Doel van de regeling is te bevorderen dat gemeenten duale trajecten aanbieden aan oudkomers die in een
      maatschappelijke achterstandssituatie verkeren en behoren tot de groep werklozen, opvoeders of geestelijke
      bedienaren.
    url: https://wetten.overheid.nl/BWBR0014009/2004-12-05#Artikel2
  - number: '3.1'
    text: |-
      De minister verleent het gemeentebestuur een bijdrage voor het tot en met juni 2005 aanbieden van duale trajecten
      aan oudkomers indien het gemeentebestuur bij de minister een aanvraag indient en de minister deze aanvraag
      goedkeurt.
    url: https://wetten.overheid.nl/BWBR0014009/2004-12-05#Artikel3
  - number: '3.2'
    text: |-
      Indien het gemeentebestuur uiterlijk 25 oktober 2002 een aanvraag als bedoeld in het eerste lid indient, verleent
      de minister het gemeentebestuur uiterlijk 15 december 2002 een bijdrage als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0014009/2004-12-05#Artikel3
  - number: '3.3'
    text: Een aanvraag als bedoeld in het eerste lid bevat in ieder geval de prognose.
    url: https://wetten.overheid.nl/BWBR0014009/2004-12-05#Artikel3
  - number: '3.4'
    text: |-
      De bijdrage, bedoeld in het eerste lid, bestaat uit een bijdrage voor de vaste kosten en een bijdrage voor de
      variabele kosten.
    url: https://wetten.overheid.nl/BWBR0014009/2004-12-05#Artikel3
  - number: 3a
    text: |-
      Indien het gemeentebestuur dat niet op grond van artikel 3, tweede lid, een aanvraag heeft ingediend, uiterlijk 7
      november 2003 een aanvraag als bedoeld in artikel 3, eerste lid, indient, verleent de minister het gemeentebestuur
      uiterlijk 15 december 2003 een bijdrage als bedoeld in artikel 3, eerste lid.
    url: https://wetten.overheid.nl/BWBR0014009/2004-12-05#Artikel3a
  - number: 3b.1
    text: |-
      Voor een gemeentebestuur dat een aanvraag op grond van artikel 3a heeft ingediend komt artikel 1, onderdeel f, te
      luiden: 'f. prognose: het aantal oudkomers dat naar de verwachting van het gemeentebestuur een duaal traject zal'
      worden aangeboden in de periode van de datum waarop de bijdrage wordt verleend tot en met december 2005.
    url: https://wetten.overheid.nl/BWBR0014009/2004-12-05#Artikel3b
  - number: 3b.2
    text: |-
      Voor een gemeentebestuur dat een aanvraag op grond van artikel 3a heeft ingediend komt artikel 3, eerste lid, te
      luiden: 1. De minister verleent het gemeentebestuur een bijdrage voor het tot en met december 2005 aanbieden van
      duale trajecten aan oudkomers indien het gemeentebestuur bij de minister een aanvraag indient en de minister deze
      aanvraag goedkeurt.
    url: https://wetten.overheid.nl/BWBR0014009/2004-12-05#Artikel3b
  - number: 3b.3
    text: |-
      Voor een gemeentebestuur dat een aanvraag op grond van artikel 3a heeft ingediend komt artikel 10, eerste lid, te
      luiden: 1. Indien het gemeentebestuur een voorschot is verleend op grond van een aanvraag als bedoel in artikel
      3, tweede lid, verstrekt het gemeentebestuur de minister de informatie en bescheiden over de gegevens die in de
      monitor worden gevraagd, uiterlijk 1 oktober 2004 over de periode januari 2004 tot en met juni 2004, uiterlijk 1
      april 2005 over de periode juli 2004 tot en met december 2004, uiterlijk 1 oktober 2005 over de periode januari
      2005 tot en met juni 2005 en uiterlijk 1 april 2006 over de periode juli 2005 tot en met december 2005.
    url: https://wetten.overheid.nl/BWBR0014009/2004-12-05#Artikel3b
  - number: 3b.4
    text: |-
      Voor een gemeentebestuur dat een aanvraag op grond van artikel 3a heeft ingediend komt artikel 11, eerste lid, te
      luiden: 1. Onverminderd artikel 7, wijzigt de minister uiterlijk 1 mei 2004 de verlening van het voorschot indien
      het gemeentebestuur de minister uiterlijk 1 april 2004 schriftelijk meedeelt dat het de prognose wijzigt.
    url: https://wetten.overheid.nl/BWBR0014009/2004-12-05#Artikel3b
  - number: 3b.5
    text: |-
      Voor een gemeentebestuur dat een aanvraag op grond van artikel 3a heeft ingediend komt artikel 12, eerste lid,
      te luiden: 1. De minister stelt voor 1 juli 2006 de bijdrage vast aan de hand van de op grond van artikel 10
      verstrekte informatie en bescheiden.
    url: https://wetten.overheid.nl/BWBR0014009/2004-12-05#Artikel3b
  - number: '4.1'
    text: De minister verleent het gemeentebestuur de bijdrage als bedoeld in het eerste lid bij wijze van een voorschot.
    url: https://wetten.overheid.nl/BWBR0014009/2004-12-05#Artikel4
  - number: '4.2'
    text: De hoogte van het voorschot is afhankelijk van de prognose.
    url: https://wetten.overheid.nl/BWBR0014009/2004-12-05#Artikel4
  - number: '5.1'
    text: De hoogte van het voorschot voor de bijdrage voor de vaste kosten bedraagt € 1.200 vermenigvuldigd met de prognose.
    url: https://wetten.overheid.nl/BWBR0014009/2004-12-05#Artikel5
  - number: '5.2'
    text: De hoogte van het voorschot, bedoeld in het eerste lid, bedraagt ten hoogste € 48.000.
    url: https://wetten.overheid.nl/BWBR0014009/2004-12-05#Artikel5
  - number: '5.3'
    text: De hoogte van het voorschot, bedoeld in het eerste lid, bedraagt ten minste € 12.000.
    url: https://wetten.overheid.nl/BWBR0014009/2004-12-05#Artikel5
  - number: '5.4'
    text: |-
      De hoogte van het voorschot voor de bijdrage voor de variabele kosten bedraagt € 4.600 vermenigvuldigd met de
      prognose.
    url: https://wetten.overheid.nl/BWBR0014009/2004-12-05#Artikel5
  - number: '6'
    text: |-
      Bij het verlenen van het voorschot bepaalt de minister op welke wijze en op welk moment het voorschot wordt
      betaald.
    url: https://wetten.overheid.nl/BWBR0014009/2004-12-05#Artikel6
  - number: '7.1'
    text: Het voorschot wordt verleend onder de voorwaarde dat het budget toereikend is.
    url: https://wetten.overheid.nl/BWBR0014009/2004-12-05#Artikel7
  - number: '7.2'
    text: |-
      In het geval het budget niet toereikend is, baseert de minister het voorschot op het aandeel van de prognose in het
      totaal van de prognoses.
    url: https://wetten.overheid.nl/BWBR0014009/2004-12-05#Artikel7
  - number: '7.3'
    text: |-
      Indien zich de situatie, bedoeld in het tweede lid, voordoet, wijzigt de minister de prognose bij het verlenen van
      het voorschot.
    url: https://wetten.overheid.nl/BWBR0014009/2004-12-05#Artikel7
  - number: '8'
    text: |-
      Het gemeentebestuur aan wie een voorschot als bedoeld in [artikel 4][ref1] is verleend, sluit een overeenkomst met
      de oudkomer die start met een duaal traject. In deze overeenkomst zijn in ieder geval opgenomen:


      [ref1]: https://wetten.overheid.nl/BWBR0014009#Artikel4
    url: https://wetten.overheid.nl/BWBR0014009/2004-12-05#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0014009
        artikel: '4'
        hoofdstuk: '2'
  - number: 8.a
    text: de onderdelen van het duale traject;
    url: https://wetten.overheid.nl/BWBR0014009/2004-12-05#Artikel8
  - number: 8.b
    text: het aantal contacturen van het duale traject;
    url: https://wetten.overheid.nl/BWBR0014009/2004-12-05#Artikel8
  - number: 8.c
    text: de verplichtingen van het gemeentebestuur;
    url: https://wetten.overheid.nl/BWBR0014009/2004-12-05#Artikel8
  - number: 8.d
    text: de verplichtingen van de oudkomer;
    url: https://wetten.overheid.nl/BWBR0014009/2004-12-05#Artikel8
  - number: 8.e
    text: |-
      de informatieoverdracht tussen het gemeentebestuur, de instellingen betrokken bij het aanbieden van het duale
      traject en de oudkomer over de voortgang van die oudkomer in het duale traject;
    url: https://wetten.overheid.nl/BWBR0014009/2004-12-05#Artikel8
  - number: 8.f
    text: de gevolgen van het niet nakomen van de overeenkomst door de oudkomer.
    url: https://wetten.overheid.nl/BWBR0014009/2004-12-05#Artikel8
  - number: '9.1'
    text: |-
      Het gemeentebestuur aan wie een voorschot als bedoeld in [artikel 4][ref1] is verleend, draagt zorg dat de oudkomer
      met wie een overeenkomst als bedoeld in [artikel 8][ref2] is gesloten, een begintoets en een eindtoets wordt
      afgenomen op grond waarvan het niveau Nederlands als tweede taal van de oudkomer wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0014009#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0014009#Artikel8
    url: https://wetten.overheid.nl/BWBR0014009/2004-12-05#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0014009
        artikel: '4'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0014009
        artikel: '8'
        hoofdstuk: '3'
  - number: '9.2'
    text: |-
      Voor de begintoets en de eindtoets, bedoeld in het eerste lid, wordt uitsluitend gebruik gemaakt van de hierna
      volgende combinaties van toetsen:
    url: https://wetten.overheid.nl/BWBR0014009/2004-12-05#Artikel9
  - number: 9.2.a
    text: de Intaketoets NT2 als begintoets met de NT2-Profieltoets, NT2-Cat of Itemdito als eindtoets; of
    url: https://wetten.overheid.nl/BWBR0014009/2004-12-05#Artikel9
  - number: 9.2.b
    text: de Intaketoets Alfabetisering NT2 als begintoets met de NT2-Profieltoets Alfabetisering als eindtoets.
    url: https://wetten.overheid.nl/BWBR0014009/2004-12-05#Artikel9
  - number: '9.3'
    text: |-
      De minister kan bepalen dat van andere toetsen dan de toetsen, genoemd in het tweede lid, uitsluitend gebruik wordt
      gemaakt.
    url: https://wetten.overheid.nl/BWBR0014009/2004-12-05#Artikel9
  - number: '10.1'
    text: |-
      Indien het gemeentebestuur een voorschot is verleend op grond van een aanvraag als bedoel in
      [artikel 3, tweede lid][ref1], verstrekt het gemeentebestuur de minister de informatie en bescheiden over de
      gegevens die in de monitor worden gevraagd, uiterlijk 1 oktober 2003 over de periode van de datum waarop het
      voorschot is verleend tot en met juni 2003, uiterlijk 1 april 2004 over de periode juli 2003 tot en met december
      2003, uiterlijk 1 april 2005 over de periode januari 2004 tot en met december 2004 en uiterlijk 1 april 2006 over
      de periode januari 2005 tot en met december 2005.


      [ref1]: https://wetten.overheid.nl/BWBR0014009#Artikel3
    url: https://wetten.overheid.nl/BWBR0014009/2004-12-05#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0014009
        artikel: '3'
        hoofdstuk: '2'
  - number: '10.2'
    text: |-
      Indien het gemeentebestuur een voorschot is verleend op grond van een aanvraag als bedoeld in
      [artikel 3, derde lid][ref1], bepaalt de minister bij het verlenen van het voorschot wanneer en over welke periode
      het gemeentebestuur de minister de informatie en bescheiden verstrekt over de gegevens die in de monitor worden
      gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0014009#Artikel3
    url: https://wetten.overheid.nl/BWBR0014009/2004-12-05#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0014009
        artikel: '3'
        hoofdstuk: '2'
  - number: '10.3'
    text: |-
      De op grond van het eerste en tweede lid verstrekte informatie en bescheiden zijn voorzien van een
      accountantsverklaring.
    url: https://wetten.overheid.nl/BWBR0014009/2004-12-05#Artikel10
  - number: '10.4'
    text: 'In de monitor worden in ieder geval de volgende prestatiegegevens gevraagd:'
    url: https://wetten.overheid.nl/BWBR0014009/2004-12-05#Artikel10
  - number: 10.4.a
    text: |-
      het aantal oudkomers met wie een overeenkomst als bedoeld in [artikel 8][ref1], is gesloten;


      [ref1]: https://wetten.overheid.nl/BWBR0014009#Artikel8
    url: https://wetten.overheid.nl/BWBR0014009/2004-12-05#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0014009
        artikel: '8'
        hoofdstuk: '3'
  - number: 10.4.b
    text: het aantal oudkomers dat een duaal traject heeft afgerond;
    url: https://wetten.overheid.nl/BWBR0014009/2004-12-05#Artikel10
  - number: 10.4.c
    text: het aantal oudkomers dat een duaal traject voortijdig heeft beëindigd;
    url: https://wetten.overheid.nl/BWBR0014009/2004-12-05#Artikel10
  - number: 10.4.d
    text: |-
      het niveau Nederlands als tweede taal van de oudkomers, bedoeld onder b, bij afronding van het duale traject ten
      opzichte van het niveau Nederlands als tweede taal bij de start van het duale traject.
    url: https://wetten.overheid.nl/BWBR0014009/2004-12-05#Artikel10
  - number: '10.5'
    text: |-
      De op grond van het eerste en tweede lid verstrekte informatie en bescheiden hebben alleen betrekking op duale
      trajecten die geheel of gedeeltelijk zijn bekostigd door een bijdrage als bedoeld in [artikel 3, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014009#Artikel3
    url: https://wetten.overheid.nl/BWBR0014009/2004-12-05#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0014009
        artikel: '3'
        hoofdstuk: '2'
  - number: '11.1'
    text: |-
      Onverminderd [artikel 7][ref1], wijzigt de minister uiterlijk 1 mei 2003 of 1 mei 2004 de verlening van het
      voorschot indien het gemeentebestuur de minister uiterlijk 1 april voorafgaand aan genoemde data schriftelijk
      meedeelt dat het de prognose wijzigt.


      [ref1]: https://wetten.overheid.nl/BWBR0014009#Artikel7
    url: https://wetten.overheid.nl/BWBR0014009/2004-12-05#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0014009
        artikel: '7'
        hoofdstuk: '2'
  - number: '11.2'
    text: |-
      Onverminderd het eerste lid, kan de minister bepalen dat hij de verlening van het voorschot zal wijzigen indien het
      gemeentebestuur hem uiterlijk op een door de minister te bepalen datum schriftelijk meedeelt dat het de prognose
      wijzigt.
    url: https://wetten.overheid.nl/BWBR0014009/2004-12-05#Artikel11
  - number: '11.3'
    text: |-
      Bij het wijzigen van de verlening van het voorschot als bedoeld in het eerste en tweede lid, bepaalt de minister
      op welke wijze en op welk moment het gewijzigde voorschot wordt betaald dan wel het betaalde voorschot geheel of
      gedeeltelijk wordt teruggevorderd.
    url: https://wetten.overheid.nl/BWBR0014009/2004-12-05#Artikel11
  - number: '12.1'
    text: |-
      De minister stelt voor 1 januari 2006 de bijdrage vast aan de hand van de op grond van [artikel 10][ref1]
      verstrekte informatie en bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0014009#Artikel10
    url: https://wetten.overheid.nl/BWBR0014009/2004-12-05#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0014009
        artikel: '10'
        hoofdstuk: '3'
  - number: '12.2'
    text: |-
      De hoogte van de bijdrage voor de vaste kosten wordt vastgesteld overeenkomstig de hoogte van het voorschot voor de
      bijdrage voor de vaste kosten.
    url: https://wetten.overheid.nl/BWBR0014009/2004-12-05#Artikel12
  - number: '12.3'
    text: 'De hoogte van de bijdrage voor de variabele kosten wordt als volgt vastgesteld:'
    url: https://wetten.overheid.nl/BWBR0014009/2004-12-05#Artikel12
  - number: 12.3.a
    text: |-
      € 5.500 voor iedere oudkomer die aan alle verplichtingen, genoemd in de overeenkomst, bedoeld in [artikel 8][ref1],
      heeft voldaan en die een begintoets en een eindtoets als bedoeld in [artikel 9][ref2] is afgenomen;


      [ref1]: https://wetten.overheid.nl/BWBR0014009#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0014009#Artikel9
    url: https://wetten.overheid.nl/BWBR0014009/2004-12-05#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0014009
        artikel: '8'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0014009
        artikel: '9'
        hoofdstuk: '3'
  - number: 12.3.b
    text: |-
      € 275 voor ieder niveau waarmee de lees-, schrijf-, spreek- of luistervaardigheid door een oudkomer, bedoeld onder
      a, is verbeterd;
    url: https://wetten.overheid.nl/BWBR0014009/2004-12-05#Artikel12
  - number: 12.3.c
    text: |-
      € 1.375 voor iedere oudkomer met wie een overeenkomst als bedoeld in [artikel 8][ref1] is gesloten maar die
      niet heeft voldaan aan alle verplichtingen, genoemd in die overeenkomst of die geen begintoets en eindtoets is
      afgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0014009#Artikel8
    url: https://wetten.overheid.nl/BWBR0014009/2004-12-05#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0014009
        artikel: '8'
        hoofdstuk: '3'
  - number: '12.4'
    text: |-
      Het aantal oudkomers dat de minister bij het vaststellen van de bijdrage voor de variabele kosten betrekt, kan de
      prognose niet overtreffen.
    url: https://wetten.overheid.nl/BWBR0014009/2004-12-05#Artikel12
  - number: '12.5'
    text: |-
      In het geval het aantal oudkomers waarmee een overeenkomst als bedoeld in [artikel 8][ref1] is gesloten, de
      prognose overtreft, betrekt de minister bij het vaststellen van de bijdrage, met inachtneming van het vierde lid,
      de oudkomers die het gemeentebestuur recht geven op een zo hoog mogelijke bijdrage.


      [ref1]: https://wetten.overheid.nl/BWBR0014009#Artikel8
    url: https://wetten.overheid.nl/BWBR0014009/2004-12-05#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0014009
        artikel: '8'
        hoofdstuk: '3'
  - number: '13.1'
    text: |-
      Twee of meer gemeentebesturen kunnen in het kader van de gemeentelijke uitvoering van deze regeling samenwerken in
      een samenwerkingsverband.
    url: https://wetten.overheid.nl/BWBR0014009/2004-12-05#Artikel13
  - number: '13.2'
    text: 'Indien zich de situatie, bedoeld in het eerste lid, voordoet:'
    url: https://wetten.overheid.nl/BWBR0014009/2004-12-05#Artikel13
  - number: 13.2.a
    text: |-
