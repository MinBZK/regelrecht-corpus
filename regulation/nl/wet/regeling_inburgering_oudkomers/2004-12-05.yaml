articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

            a

              *minister:*


              de minister voor Vreemdelingenzaken en Integratie;



            b

              *gemeentebestuur:*


              het college van burgemeesters en wethouders van een gemeente waaraan geen bijdrage krachtens de
      [Bijdrageregeling sociale integratie en veiligheid G25][ref1], de [Bijdrageregeling inburgering oudkomers][ref2] of
      de [Bijdrageregeling inburgering oudkomers 12 gemeenten][ref3] is verstrekt;



            c

              *samenwerkingsverband:*


              een samenwerkingsverband als bedoeld in [artikel 8 van de Wet gemeenschappelijke regelingen][ref4], waaraan
      gemeentebesturen de bevoegdheden en verplichtingen die hen op grond van deze regeling toekomen hebben overgedragen;



            d

              *oudkomers:*


              leden van etnische minderheidsgroepen van 18 jaar of ouder, die buiten Nederland zijn geboren, al voor
      langere tijd legaal in Nederland verblijven anders dan voor een tijdelijk doel en niet verplicht zijn om op grond
      van de [Wet inburgering nieuwkomers][ref5] een inburgeringsprogramma te volgen;



            e

              *duaal traject:*


              een inburgeringsprogramma dat in het teken staat van het doel dat de oudkomer wenst te bereiken en waarbij
      het onderdeel Nederlands als tweede taal wordt gekoppeld aan onderdelen voor het bereiken van werk, toegang tot
      beroepsonderwijs, opvoedingsondersteuning of sociale activering;



            f

              *prognose:*


              het aantal oudkomers dat naar de verwachting van het gemeentebestuur een duaal traject zal worden
      aangeboden in de periode van de datum waarop de bijdrage wordt verleend tot en met juni 2005;



            g

              *monitor:*


              het door de minister vastgestelde model-document aan de hand waarvan het gemeentebestuur de minister
      informatie verschaft over het gemeentelijk beleid ter verbetering van de inburgering van oudkomers en aan de hand
      waarvan de hoogte van de bijdrage wordt vastgesteld als bedoeld in [artikel 12][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0010613
      [ref2]: https://wetten.overheid.nl/BWBR0010879
      [ref3]: https://wetten.overheid.nl/BWBR0012253
      [ref4]: https://wetten.overheid.nl/BWBR0003740#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0009544
      [ref6]: https://wetten.overheid.nl/BWBR0014009#Artikel12
    url: https://wetten.overheid.nl/BWBR0014009/2004-12-05#Artikel1
    references:
