  - number: '11'
    text: |-
      1 Onverminderd [artikel 7][ref1], wijzigt de minister uiterlijk 1 mei 2003 of 1 mei 2004 de verlening van het
      voorschot indien het gemeentebestuur de minister uiterlijk 1 april voorafgaand aan genoemde data schriftelijk
      meedeelt dat het de prognose wijzigt.

      2 Onverminderd het eerste lid, kan de minister bepalen dat hij de verlening van het voorschot zal wijzigen indien
      het gemeentebestuur hem uiterlijk op een door de minister te bepalen datum schriftelijk meedeelt dat het de
      prognose wijzigt.

      3 Bij het wijzigen van de verlening van het voorschot als bedoeld in het eerste en tweede lid, bepaalt de minister
      op welke wijze en op welk moment het gewijzigde voorschot wordt betaald dan wel het betaalde voorschot geheel of
      gedeeltelijk wordt teruggevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0014009#Artikel7
    url: https://wetten.overheid.nl/BWBR0014009/2005-02-23#Artikel11
