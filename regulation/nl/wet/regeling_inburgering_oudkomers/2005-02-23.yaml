  - number: '12'
    text: |-
      1 De minister stelt voor 1 januari 2006 de bijdrage vast aan de hand van de op grond van [artikel 10][ref1]
      verstrekte informatie en bescheiden.

      2 De hoogte van de bijdrage voor de vaste kosten wordt vastgesteld overeenkomstig de hoogte van het voorschot voor
      de bijdrage voor de vaste kosten.

      3 De hoogte van de bijdrage voor de variabele kosten wordt als volgt vastgesteld:

      a. € 5.500 voor iedere oudkomer die aan alle verplichtingen, genoemd in de overeenkomst, bedoeld in
      [artikel 8][ref2], heeft voldaan en die een begintoets en een eindtoets als bedoeld in [artikel 9][ref3] is
      afgenomen;

      b. € 275 voor ieder niveau waarmee de lees-, schrijf-, spreek- of luistervaardigheid door een oudkomer, bedoeld
      onder a, is verbeterd;

      c. € 1.375 voor iedere oudkomer met wie een overeenkomst als bedoeld in [artikel 8][ref4] is gesloten maar die
      niet heeft voldaan aan alle verplichtingen, genoemd in die overeenkomst of die geen begintoets en eindtoets is
      afgenomen.

      4 Het aantal oudkomers dat de minister bij het vaststellen van de bijdrage voor de variabele kosten betrekt, kan de
      prognose niet overtreffen.

      5 In het geval het aantal oudkomers waarmee een overeenkomst als bedoeld in [artikel 8][ref5] is gesloten, de
      prognose overtreft, betrekt de minister bij het vaststellen van de bijdrage, met inachtneming van het vierde lid,
      de oudkomers die het gemeentebestuur recht geven op een zo hoog mogelijke bijdrage.


