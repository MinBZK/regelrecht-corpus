  - number: '10'
    text: |-
      1 Indien het gemeentebestuur een voorschot is verleend op grond van een aanvraag als bedoel in
      [artikel 3, tweede lid][ref1], verstrekt het gemeentebestuur de minister de informatie en bescheiden over de
      gegevens die in de monitor worden gevraagd, uiterlijk 1 oktober 2003 over de periode van de datum waarop het
      voorschot is verleend tot en met juni 2003, uiterlijk 1 april 2004 over de periode juli 2003 tot en met december
      2003, uiterlijk 1 april 2005 over de periode januari 2004 tot en met december 2004 en uiterlijk 1 oktober 2005 over
      de periode januari 2005 tot en met juni 2005.

      2 Indien het gemeentebestuur een voorschot is verleend op grond van een aanvraag als bedoeld in
      [artikel 3, derde lid][ref2], bepaalt de minister bij het verlenen van het voorschot wanneer en over welke periode
      het gemeentebestuur de minister de informatie en bescheiden verstrekt over de gegevens die in de monitor worden
      gevraagd.

      3 De op grond van het eerste lid en tweede lid verstrekte informatie en bescheiden over de gegevens, die
      in de monitor over de periode januari 2005 tot en met juni 2005 worden gevraagd, zijn voorzien van een
      accountantsverklaring.

      4 In de monitor worden in ieder geval de volgende prestatiegegevens gevraagd:

      a. het aantal oudkomers met wie een overeenkomst als bedoeld in [artikel 8][ref3], is gesloten;

      b. het aantal oudkomers dat een duaal traject heeft afgerond;

      c. het aantal oudkomers dat een duaal traject voortijdig heeft beëindigd;

      d. het niveau Nederlands als tweede taal van de oudkomers, bedoeld onder b, bij afronding van het duale traject ten
      opzichte van het niveau Nederlands als tweede taal bij de start van het duale traject.

      5 De op grond van het eerste en tweede lid verstrekte informatie en bescheiden hebben alleen betrekking op duale
      trajecten die geheel of gedeeltelijk zijn bekostigd door een bijdrage als bedoeld in [artikel 3, eerste lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0014009#Artikel3
