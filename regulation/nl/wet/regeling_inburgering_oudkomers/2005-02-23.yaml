  - number: '2'
    text: |-
      Doel van de regeling is te bevorderen dat gemeenten duale trajecten aanbieden aan oudkomers die in een
      maatschappelijke achterstandssituatie verkeren en behoren tot de groep werklozen, opvoeders of geestelijke
      bedienaren.
    url: https://wetten.overheid.nl/BWBR0014009/2005-02-23#Artikel2
  - number: '3'
    text: |-
      1 De minister verleent het gemeentebestuur een bijdrage voor het tot en met juni 2005 aanbieden van duale trajecten
      aan oudkomers indien het gemeentebestuur bij de minister een aanvraag indient en de minister deze aanvraag
      goedkeurt.

      2 Indien het gemeentebestuur uiterlijk 25 oktober 2002 een aanvraag als bedoeld in het eerste lid indient, verleent
      de minister het gemeentebestuur uiterlijk 15 december 2002 een bijdrage als bedoeld in het eerste lid.

      3 Een aanvraag als bedoeld in het eerste lid bevat in ieder geval de prognose.

      4 De bijdrage, bedoeld in het eerste lid, bestaat uit een bijdrage voor de vaste kosten en een bijdrage voor de
      variabele kosten.
    url: https://wetten.overheid.nl/BWBR0014009/2005-02-23#Artikel3
  - number: 3a
    text: |-
      Indien het gemeentebestuur dat niet op grond van artikel 3, tweede lid, een aanvraag heeft ingediend, uiterlijk 7
      november 2003 een aanvraag als bedoeld in artikel 3, eerste lid, indient, verleent de minister het gemeentebestuur
      uiterlijk 15 december 2003 een bijdrage als bedoeld in artikel 3, eerste lid.
    url: https://wetten.overheid.nl/BWBR0014009/2005-02-23#Artikel3a
  - number: 3b
    text: |-
      1 Voor een gemeentebestuur dat een aanvraag op grond van [artikel 3a][ref1] heeft ingediend komt
      [artikel 1, onderdeel f][ref2], te luiden:

      f. prognose: het aantal oudkomers dat naar de verwachting van het gemeentebestuur een duaal traject zal worden
      aangeboden in de periode van de datum waarop de bijdrage wordt verleend tot en met december 2005.

      2 Voor een gemeentebestuur dat een aanvraag op grond van [artikel 3a][ref3] heeft ingediend komt
      [artikel 3, eerste lid][ref4], te luiden:

      1. De minister verleent het gemeentebestuur een bijdrage voor het tot en met december 2005 aanbieden van duale
      trajecten aan oudkomers indien het gemeentebestuur bij de minister een aanvraag indient en de minister deze
      aanvraag goedkeurt.

      3 Voor een gemeentebestuur dat een aanvraag op grond van [artikel 3a][ref5] heeft ingediend komt
      [artikel 10, eerste lid][ref6], te luiden:

      1. Indien het gemeentebestuur een voorschot is verleend op grond van een aanvraag als bedoel in
      [artikel 3, tweede lid][ref7], verstrekt het gemeentebestuur de minister de informatie en bescheiden over de
      gegevens die in de monitor worden gevraagd, uiterlijk 1 april 2005 over de periode januari 2004 tot en met december
      2004 en uiterlijk 1 april 2006 over de periode januari 2005 tot en met december 2005.

      4 Voor een gemeentebestuur dat een aanvraag op grond van [artikel 3a][ref8] heeft ingediend komt
      [artikel 11, eerste lid][ref9], te luiden:

      1. Onverminderd [artikel 7][ref10], wijzigt de minister uiterlijk 1 mei 2004 de verlening van het voorschot indien
      het gemeentebestuur de minister uiterlijk 1 april 2004 schriftelijk meedeelt dat het de prognose wijzigt.

      5 Voor een gemeentebestuur dat een aanvraag op grond van [artikel 3a][ref11] heeft ingediend komt
      [artikel 12, eerste lid][ref12], te luiden:

      1. De minister stelt voor 1 juli 2006 de bijdrage vast aan de hand van de op grond van [artikel 10][ref13]
      verstrekte informatie en bescheiden.

      6 De op grond van het derde lid verstrekte informatie en bescheiden over de gegevens, die in de monitor over de
      periode januari 2005 tot en met december 2005 worden gevraagd, zijn voorzien van een accountantsverklaring.


