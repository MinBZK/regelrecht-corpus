  - number: '13'
    text: |-
      1 Twee of meer gemeentebesturen kunnen in het kader van de gemeentelijke uitvoering van deze regeling samenwerken
      in een samenwerkingsverband.

      2 Indien zich de situatie, bedoeld in het eerste lid, voordoet:

      a. wordt in [artikel 1, onderdeel g][ref1], [artikel 3, eerste, tweede en derde lid][ref2],
      [artikel 4, eerste lid][ref3], [artikel 8][ref4], [artikel 9, eerste lid][ref5],
      [artikel 10, eerste en tweede lid][ref6] en [artikel 11, eerste en tweede lid][ref7],
      [artikel 12, vijfde lid][ref8], voor `gemeentebestuur' gelezen: samenwerkingsverband;

      b. wordt in [artikel 3, vierde lid][ref9], voor `de prognose' gelezen: de prognoses van de gemeentebesturen van
      het samenwerkingsverband;

      c. wordt in [artikel 4, tweede lid][ref10], voor `de prognose' gelezen: de prognoses van de gemeentebesturen van
      het samenwerkingsverband;

      d. is de hoogte van het voorschot gelijk aan de optelsom van de voorschotten waarop de gemeentebesturen op grond
      van [artikel 5][ref11] aanspraak zouden hebben indien zij niet hadden samengewerkt in het samenwerkingsverband;

      e. verstrekt het samenwerkingsverband de informatie en bescheiden, bedoeld in
      [artikel 10, eerste en tweede lid][ref12], per gemeente van het samenwerkingsverband;

      f. wordt in [artikel 11, eerste en tweede lid][ref13], voor `dat het de prognose wijzigt' gelezen: dat het de
      prognose van een of meerdere gemeentebesturen van het samenwerkingsverband wijzigt;

      g. wordt in [artikel 12, vierde lid en vijfde lid][ref14], voor `prognose' gelezen: het totaal van de prognoses van
      de gemeentebesturen van het samenwerkingsverband;

      h. wordt bij het vaststellen van de bijdrage voor de variabele kosten het totaal van de resultaten van de
      gemeentebesturen van het samenwerkingsverband betrokken.


