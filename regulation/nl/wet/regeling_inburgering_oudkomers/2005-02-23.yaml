  - number: '4'
    text: |-
      1 De minister verleent het gemeentebestuur de bijdrage als bedoeld in [artikel 3, eerste lid][ref1], bij wijze van
      een voorschot.

      2 De hoogte van het voorschot is afhankelijk van de prognose.


      [ref1]: https://wetten.overheid.nl/BWBR0014009#Artikel3
    url: https://wetten.overheid.nl/BWBR0014009/2005-02-23#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0014009
        artikel: '3'
        hoofdstuk: '2'
  - number: '5'
    text: |-
      1 De hoogte van het voorschot voor de bijdrage voor de vaste kosten bedraagt € 1.200 vermenigvuldigd met de
      prognose.

      2 De hoogte van het voorschot, bedoeld in het eerste lid, bedraagt ten hoogste € 48.000.

      3 De hoogte van het voorschot, bedoeld in het eerste lid, bedraagt ten minste € 12.000.

      4 De hoogte van het voorschot voor de bijdrage voor de variabele kosten bedraagt € 4.600 vermenigvuldigd met de
      prognose.
    url: https://wetten.overheid.nl/BWBR0014009/2005-02-23#Artikel5
  - number: '6'
    text: |-
      Bij het verlenen van het voorschot bepaalt de minister op welke wijze en op welk moment het voorschot wordt
      betaald.
    url: https://wetten.overheid.nl/BWBR0014009/2005-02-23#Artikel6
  - number: '7'
    text: |-
      1 Het voorschot wordt verleend onder de voorwaarde dat het budget toereikend is.

      2 In het geval het budget niet toereikend is, baseert de minister het voorschot op het aandeel van de prognose in
      het totaal van de prognoses.

      3 Indien zich de situatie, bedoeld in het tweede lid, voordoet, wijzigt de minister de prognose bij het verlenen
      van het voorschot.
    url: https://wetten.overheid.nl/BWBR0014009/2005-02-23#Artikel7
  - number: '8'
    text: |-
      Het gemeentebestuur aan wie een voorschot als bedoeld in [artikel 4][ref1] is verleend, sluit een overeenkomst met
      de oudkomer die start met een duaal traject. In deze overeenkomst zijn in ieder geval opgenomen:

      a. de onderdelen van het duale traject;

      b. het aantal contacturen van het duale traject;

      c. de verplichtingen van het gemeentebestuur;

      d. de verplichtingen van de oudkomer;

      e. de informatieoverdracht tussen het gemeentebestuur, de instellingen betrokken bij het aanbieden van het duale
      traject en de oudkomer over de voortgang van die oudkomer in het duale traject;

      f. de gevolgen van het niet nakomen van de overeenkomst door de oudkomer.


      [ref1]: https://wetten.overheid.nl/BWBR0014009#Artikel4
    url: https://wetten.overheid.nl/BWBR0014009/2005-02-23#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0014009
        artikel: '4'
        hoofdstuk: '2'
  - number: '9'
    text: |-
      1 Het gemeentebestuur aan wie een voorschot als bedoeld in [artikel 4][ref1] is verleend, draagt zorg dat de
      oudkomer met wie een overeenkomst als bedoeld in [artikel 8][ref2] is gesloten, een begintoets en een eindtoets
      wordt afgenomen op grond waarvan het niveau Nederlands als tweede taal van de oudkomer wordt vastgesteld.

      2 Voor de begintoets en de eindtoets, bedoeld in het eerste lid, wordt uitsluitend gebruik gemaakt van de hierna
      volgende combinaties van toetsen:

      a. de Intaketoets NT2 als begintoets met de NT2-Profieltoets, NT2-Cat of Itemdito als eindtoets; of

      b. de Intaketoets Alfabetisering NT2 als begintoets met de NT2-Profieltoets Alfabetisering als eindtoets.

      3 De minister kan bepalen dat van andere toetsen dan de toetsen, genoemd in het tweede lid, uitsluitend gebruik
      wordt gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0014009#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0014009#Artikel8
    url: https://wetten.overheid.nl/BWBR0014009/2005-02-23#Artikel9
