preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is het stelsel van stichtings- en opheffingsnormen in
    de Wet op het basisonderwijs te wijzigen teneinde een evenwichtiger verdeling van middelen in een goed gespreid
    basisonderwijs te bereiken en de beheersbaarheid van het huisvestingsstelsel in de Wet op het basisonderwijs en de
    Interimwet op het speciaal onderwijs en het voortgezet speciaal onderwijs te verbeteren;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006321/2013-07-04#ArtikelAanhef
articles:
  - number: XXV
    text: |-
      1 Behoudens het gestelde in het tweede en derde lid treedt deze wet in werking met ingang van 1 januari 1994 of,
      indien het *Staatsblad* waarin deze wet wordt geplaatst, wordt uitgegeven na 31 december 1993, met ingang van de
      dag na de datum van uitgifte van dat *Staatsblad*.

      2 Indien de Wet van 4 juni 1992, houdende aanpassing van een aantal wetten aan de eerste tranche van de Algemene
      wet bestuursrecht later in werking treedt dan deze wet, treden [artikel I, onderdeel E, vijfde lid][ref1],
      [artikel I, onderdeel S, derde lid][ref2], [artikel I, onderdeel W, vijfde lid][ref3],
      [artikel III, onderdeel C, derde lid][ref4], en [artikel III, onderdeel F, tweede lid][ref5], onmiddellijk na de
      inwerkingtreding van eerstgenoemde wet in werking.

      3 Indien [artikel I, onderdeel I][ref6], [artikel I, onderdeel][ref7] WW, en artikel II, onderdeel ZZ, van de wet
      van 12 mei 1993 tot wijziging van de Wet op het basisonderwijs, van de Interimwet op het speciaal onderwijs en
      het voortgezet speciaal onderwijs en van de Overgangswet ISOVSO, in verband met deregulering, autonomievergroting
      en vermindering van beleidslasten en van de Wet algemene regels herindeling in verband met technische
      aanpassingen, later in werking treden dan deze wet, treden [artikel IV, vierde lid][ref8], onderscheidenlijk
      [artikel I, onderdeel][ref9] YY, en [artikel III, onderdeel G][ref10], onmiddellijk na die onderdelen van die wet
      in werking.


