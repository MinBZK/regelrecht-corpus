---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_dienstreizen_defensie
regulatory_layer: WET
publication_date: '2026-03-17'
valid_from: '2026-03-18'
bwb_id: BWBR0039787
url: https://wetten.overheid.nl/BWBR0039787/2026-03-18
preamble:
  text: |-
    Gelet op:

    – het Besluit dienstreizen defensie

    Besluit:
  url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder: - *de minister:* de Minister van Defensie;
        - *het BDD:* het [Besluit dienstreizen defensie][ref1];
        - *het IBBAD:* het [Inkomstenbesluit burgerlijke ambtenaren defensie][ref2];
        - *binnenlandse dienstreis:* dienstreis in Nederland;
        - *buitenlandse dienstreis:* 1. een dienstreis van een plaats in Nederland naar een plaats buiten Nederland; 2.
      een dienstreis van een plaats in het land van plaatsing buiten Nederland naar een plaats in Nederland; 3. een
      dienstreis van een plaats in het land van plaatsing buiten Nederland naar een plaats buiten het land van plaatsing;
      4. een dienstreis binnen het land van plaatsing buiten Nederland;
        - *DIDO:* Defensie Intranettoepassing Dienstreis Opdrachten.


      [ref1]: https://wetten.overheid.nl/BWBR0007956
      [ref2]: https://wetten.overheid.nl/BWBR0018191
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007956
      - id: ref2
        bwb_id: BWBR0018191
  - number: '1.2'
    text: |-
      Onder commandant, bedoeld in deze regeling wordt verstaan de commandant als bedoeld in de Regeling aanwijzing
      commandanten defensie.
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel1
  - number: '2'
    text: |-
      De groepen, bedoeld in [artikel 3 tweede lid, onderdeel d, van het BDD][ref1] zijn degenen die op individuele
      basis of in groepsverband zijn ingezet in het kader van een door de minister als zodanig aangemerkte vredes- en
      humanitaire operatie of andere vorm van daadwerkelijke inzet buiten Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0007956#Artikel3
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007956
        artikel: '3'
  - number: '3.1'
    text: |-
      Wegens reiskosten met openbaar vervoer worden vergoed de kosten die blijkens overgelegde bewijsstukken in verband
      met de dienstreis zijn gemaakt in het vervoermiddel dat voor de dienstreis in aanmerking komt.
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel3
  - number: '3.2'
    text: |-
      Niet voor vergoeding komen in aanmerking de kosten wegens reizen met lokaal openbaar vervoer in een gebied buiten
      Nederland.
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel3
  - number: '4.1'
    text: 'De dienstreizigers zijn ingedeeld in vier groepen:'
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel4
  - number: 4.1.a)
    text: |-
      groep 1: de secretaris-generaal, de directeuren-generaal alsmede zij die een functie vervullen waaraan is verbonden
      schaal 17 of een hogere schaal van het [BBRA][ref1] dan wel de rang van schout-bij-nacht, generaal-majoor of een
      hogere rang;


      [ref1]: https://wetten.overheid.nl/BWBR0003630
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003630
  - number: 4.1.b)
    text: |-
      groep 2: zij die een functie vervullen waaraan is verbonden schaal 14 of een hogere schaal van het [BBRA][ref1] dan
      wel de rang van kapitein ter zee, kolonel of een hogere rang, voor zover zij niet behoren tot groep 1;


      [ref1]: https://wetten.overheid.nl/BWBR0003630
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003630
  - number: 4.1.c)
    text: |-
      groep 3: zij die een functie vervullen waaraan is verbonden schaal 9 of een hogere schaal van het [IBBAD][ref1] dan
      wel een hogere rang dan adjudant-onderofficier/vaandrig, voor zover zij niet behoren tot de groepen 1 en 2; en


      [ref1]: https://wetten.overheid.nl/BWBR0018191
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0018191
  - number: 4.1.d)
    text: |-
      groep 4: zij die een functie vervullen waaraan is verbonden schaal 8 of een lagere schaal van het [IBBAD][ref1],
      dan wel zij die een functie vervullen waaraan is verbonden de rang van adjudantonderofficier/vaandrig of een lagere
      rang of stand.


      [ref1]: https://wetten.overheid.nl/BWBR0018191
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0018191
  - number: '4.2'
    text: |-
      Ingeval van een dienstreiziger met een titulaire rang of een rang verbonden aan de fase van een bepaalde opleiding,
      wordt deze door de commandant ingedeeld in de met deze rang overeenkomende groep.
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel4
  - number: '5.1'
    text: |-
      De indeling in reisklassen, bedoeld in [artikel 7, tweede lid, van het BDD][ref1], geschiedt volgens
      [bijlage A][ref2], Klasse-indeling bij dienstreizen Defensie.


      [ref1]: https://wetten.overheid.nl/BWBR0007956#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0039787
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007956
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0039787
  - number: '5.2'
    text: |-
      Indien bij een dienstreis met het vliegtuig een in [bijlage A][ref1] genoemde vliegtuigklasse niet voorkomt,
      bepaalt de commandant de klasse die met de betrokken klasse overeenkomt.


      [ref1]: https://wetten.overheid.nl/BWBR0039787
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0039787
  - number: '5.3'
    text: |-
      De commandant kan, in voorkomend geval, het reizen met het vliegtuig in een hogere klasse toestaan, indien in de
      voor de dienstreiziger geldende klasse door plaatsgebrek geen passage kan worden besproken en de reis niet kan
      worden uitgesteld.
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel5
  - number: '5.4'
    text: |-
      Een dienstreiziger is gehouden te reizen in een lagere dan de voor hem geldende klasse, indien het dienstbelang dit
      vereist, of dit met het oog op de regeling van de dienstreis nodig wordt geacht.
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel5
  - number: '5.5'
    text: |-
      De commandant kan de persoonsbeveiliger die ter uitvoering van zijn opdracht een dienstreis onderneemt met een of
      meer dienstreizigers die in een hogere klasse mogen reizen, toestaan in diezelfde klasse te reizen.
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel5
  - number: '6.1'
    text: |-
      Ter bepaling van het omslagpunt, bedoeld in [artikel 7, derde lid, van het BDD][ref1], worden de door de
      dienstreiziger gemaakte reiskosten gesaldeerd met de door de dienstreiziger ontvangen reiskostentegemoetkomingen.


      [ref1]: https://wetten.overheid.nl/BWBR0007956#Artikel7
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007956
        artikel: '7'
  - number: '6.2'
    text: 'De door de dienstreiziger gemaakte reiskosten zijn het totaal van:'
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel6
  - number: 6.2.a)
    text: |-
      de eigen kosten van het abonnement, bedoeld in [artikel 7, derde lid, van het BDD][ref1], met inachtneming van de
      eigen bijdrage; en


      [ref1]: https://wetten.overheid.nl/BWBR0007956#Artikel7
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007956
        artikel: '7'
  - number: 6.2.b)
    text: de werkelijk gemaakte reiskosten voor de dienstreizen.
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel6
  - number: '6.3'
    text: 'De door de dienstreiziger ontvangen reiskostentegemoetkomingen zijn het totaal van:'
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel6
  - number: 6.3.a)
    text: de over de looptijd van het abonnement ontvangen reiskostenvergoedingen voor de gemaakte dienstreizen; en
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel6
  - number: 6.3.b)
    text: |-
      de eventueel over de looptijd van dit abonnement (te) ontvangen tegemoetkomingen in de kosten van het reizen tussen
      de woning en de plaats van tewerkstelling.
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel6
  - number: '6.4'
    text: |-
      De eigen bijdrage bedraagt € 48,29 per maand indien een door Defensie verstrekt openbaar vervoerabonnement of een
      tegemoetkoming voor het dagelijks reizen per openbaar vervoer op basis van een jaar(traject)kaart wordt ontvangen.
      De eigen bijdrage bedraagt € 59,95 per maand indien een tegemoetkoming voor het dagelijks reizen per openbaar
      vervoer wordt ontvangen op basis van een maand(traject)kaart.
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel6
  - number: '7'
    text: |-
      De vergoeding, bedoeld in [artikel 9, eerste en tweede lid, van het BDD][ref1], per afgelegde kilometer inclusief
      eventueel meereizende dienstreizigers wordt gevonden door toepassing van bijlage B, tabel 1.


      [ref1]: https://wetten.overheid.nl/BWBR0007956#Artikel9
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007956
        artikel: '9'
  - number: '8.1'
    text: |-
      Het aantal kilometers, bedoeld in [artikel 9, derde lid, van het BDD][ref1], bedraagt 10.000.


      [ref1]: https://wetten.overheid.nl/BWBR0007956#Artikel9
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0007956
        artikel: '9'
  - number: '8.2'
    text: |-
      De andere kosten, bedoeld in [artikel 9, derde lid, van het BDD][ref1] zijn die voor:


      [ref1]: https://wetten.overheid.nl/BWBR0007956#Artikel9
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0007956
        artikel: '9'
  - number: 8.2.a)
    text: stalling, garage en parkeren;
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel8
  - number: 8.2.b)
    text: parkeerbelasting;
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel8
  - number: 8.2.c)
    text: het gebruik van een veer of een brug; en
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel8
  - number: 8.2.d)
    text: betaalde tol in Nederland.
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel8
  - number: '8.3'
    text: De betaalde tol in het buitenland wordt vergoed.
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel8
  - number: '9'
    text: Vervallen
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel9
  - number: '10'
    text: Vervallen
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel10
  - number: '11.1'
    text: |-
      De vergoeding, bedoeld in [artikel 9, eerste lid, van het BDD][ref1], per afgelegde kilometer met de eigen fiets,
      wordt gevonden door toepassing van bijlage B, tabel 2.


      [ref1]: https://wetten.overheid.nl/BWBR0007956#Artikel9
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0007956
        artikel: '9'
  - number: '11.2'
    text: |-
      De noodzakelijke kosten voor stalling van een voor de dienstreis gebruikte fiets en de noodzakelijk gemaakte andere
      kosten van het gebruik voor de dienstreis van een fiets worden vergoed.
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel11
  - number: '12.1'
    text: |-
      De vergoeding van de verblijfkosten, bedoeld in [artikel 12, eerste lid, van het BDD][ref1], bestaat uit:


      [ref1]: https://wetten.overheid.nl/BWBR0007956#Artikel12
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0007956
        artikel: '12'
  - number: 12.1.a
    text: 'de vergoeding van maaltijden (de maaltijdcomponenten), te weten:'
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel12
  - number: 12.1.a.1
    text: de lunchcomponent,
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel12
  - number: 12.1.a.2
    text: de dinercomponent,
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel12
  - number: 12.1.a.3
    text: de ontbijtcomponent;
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel12
  - number: 12.1.b
    text: de vergoeding van logies (de logiescomponent); en
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel12
  - number: 12.1.c
    text: de vergoeding van kleine uitgaven.
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel12
  - number: '12.2'
    text: 'De vergoeding van kleine uitgaven bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel12
  - number: 12.2.a
    text: 'indien het betreft een binnenlandse dienstreis:'
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel12
  - number: 12.2.a.1°
    text: de kleine component, en
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel12
  - number: 12.2.a.2°
    text: de grote component;
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel12
  - number: 12.2.b
    text: 'indien het betreft een buitenlandse dienstreis: de uur component.'
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel12
  - number: '12.3'
    text: 'Ten aanzien van de maaltijdcomponenten geldt dat slechts aanspraak bestaat op:'
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel12
  - number: 12.3.a
    text: |-
      de lunchcomponent, indien mede voldaan is aan de voorwaarde dat de tijd tussen 12.00 uur en 14.00 uur geheel in de
      dienstreis valt;
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel12
  - number: 12.3.b
    text: |-
      de dinercomponent, indien mede voldaan is aan de voorwaarde dat de tijd tussen 17.30 uur en 20.30 uur geheel in de
      dienstreis valt; en
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel12
  - number: 12.3.c
    text: de ontbijtcomponent, indien het ontbijt aansluit op een binnen de dienstreis vallend logies; en
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel12
  - number: 12.3.d
    text: |-
      de omgekeerde lunchcomponent, indien mede is voldaan aan de voorwaarden dat de tijd tussen 00.00 uur en 03.00 uur
      geheel in de dienstreis valt en gedurende die tijd geen logies wordt genoten.
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel12
  - number: '12.4'
    text: |-
      De bedragen van de maaltijdcomponenten worden, indien de dienstreiziger de kosten in een horecabedrijf heeft
      gemaakt, gevonden door toepassing van [bijlage C][ref1], kolom Horeca. De bedragen van de kleine en grote component
      en de uur component worden gevonden door toepassing van bijlage C, de desbetreffende kolom.


      [ref1]: https://wetten.overheid.nl/BWBR0039787
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0039787
  - number: '12.5'
    text: |-
      Indien de dienstreiziger bij een dienstreis kosten heeft gemaakt voor een maaltijd van overheidswege, bestaat geen
      aanspraak op enige maaltijdcomponent. De commandant bepaalt op welke plaatsen sprake is van maaltijden of logies
      van overheidswege.
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel12
  - number: '12.6'
    text: |-
      Indien de dienstreiziger kosten heeft gemaakt voor logies worden de daadwerkelijk gemaakte kosten vergoed tot ten
      hoogste het bedrag van de logiescomponent, gevonden door toepassing van [bijlage C][ref1], kolom ‘logies’.


      [ref1]: https://wetten.overheid.nl/BWBR0039787
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0039787
  - number: '12.7'
    text: |-
      Indien bij een buitenlandse dienstreis een bewijsstuk van de kosten voor logies en ontbijt wordt overgelegd waaruit
      niet blijkt welk deel van de kosten voor logies en welk deel van de kosten voor ontbijt zijn gemaakt, worden de op
      het bewijsstuk vermelde kosten vergoed tot ten hoogste het bedrag van de som van de ontbijt- en logiescomponent.
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel12
  - number: '12.8'
    text: |-
      Onverminderd het eerste tot en met achtste lid, geldt voor de vergoeding van kleine uitgaven dat aanspraak bestaat
      op:
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel12
  - number: 12.8.a
    text: |-
      de kleine component voor ieder vol etmaal dat de binnenlandse dienstreis duurt, alsmede voor een resterend
      gedeelte van een etmaal dan wel voor een dienstreis van kortere duur dan een etmaal, indien mede voldaan is aan de
      voorwaarde dat tenminste vier uren in het resterende gedeelte of in de dienstreis vallen;
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel12
  - number: 12.8.b
    text: |-
      tweemaal de kleine component voor iedere avond tijdens een binnenlandse dienstreis, indien op de plaats van
      bestemming van de dienstreis doelmatig gebruik kan worden gemaakt van maaltijden vanwege het ministerie en
      aansluitend op die avond op die bestemming logies wordt genoten;
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel12
  - number: 12.8.c
    text: |-
      de grote component, indien aansluitend op de avond tijdens de binnenlandse dienstreis logies bij een horecabedrijf
      wordt genoten;
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel12
  - number: 12.8.d
    text: |-
      de uur component voor ieder uur of gedeelte van een uur dat de dienstreis buiten het land van plaatsing, dan wel
      binnen het land van plaatsing buiten Nederland duurt.
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel12
  - number: '12.9'
    text: |-
      Indien bij reizen door verschillende gebieden buiten Nederland tijdens één of meer reisgedeelten geen uitgaven
      voor maaltijden of logies hoeven te worden gedaan, worden deze reisgedeelten gevoegd bij een volgend of voorafgaand
      reisgedeelte buiten Nederland in welk geval aanspraak bestaat op de in dat geval van toepassing zijnde uur
      component.
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel12
  - number: '13.1'
    text: |-
      Andere kosten, bedoeld in [artikel 12, tweede lid, van het BDD][ref1], die bij een buitenlandse dienstreis worden
      vergoed zijn de naar het oordeel van de commandant noodzakelijk gemaakte kosten ter zake van:


      [ref1]: https://wetten.overheid.nl/BWBR0007956#Artikel12
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0007956
        artikel: '12'
  - number: 13.1.a
    text: aan- en verkoop van buitenlandse betaalmiddelen;
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel13
  - number: 13.1.b
    text: vaccinatie;
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel13
  - number: 13.1.c
    text: geleden koersverlies na aftrek van eventueel gemaakte koerswinst;
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel13
  - number: 13.1.d
    text: uitrusting; en
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel13
  - number: 13.1.e
    text: |-
      een reisverzekering met dezelfde of nagenoeg dezelfde dekking als die welke geldt indien de reis vanuit Nederland
      door de commandant bij de hem daarvoor aangewezen reisorganisatie zou zijn geboekt, doch alleen indien de kosten
      daarvan niet in de prijs van het reisbiljet zijn begrepen en voor die gevallen waarin bedoelde boeking wegens
      bijzondere omstandigheden niet kon plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel13
  - number: '13.2'
    text: |-
      De dienstreiziger die een dienstreis maakt van langere duur dan 7 dagen naar een in [bijlage D][ref1] vermeld
      gebied, waar tijdens de dienstreis sprake is van tropische hitte of polaire koude, wordt op zijn verzoek een
      tegemoetkoming in de werkelijk gemaakte kosten voor aanschaf van deze kleding verstrekt tot ten hoogste een bedrag
      van € 291,15.


      [ref1]: https://wetten.overheid.nl/BWBR0039787
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0039787
  - number: '13.3'
    text: |-
      Indien een gebied niet staat vermeld in [bijlage D][ref1], kan de commandant deze bijlage voor zijn dienstonderdeel
      voor de duur van de desbetreffende dienstreis met dit gebied uitbreiden, indien tijdens de dienstreis sprake is
      van de in het tweede lid bedoelde klimatologische omstandigheden en dit gebied niet is gelegen binnen Europa. Deze
      tijdelijke uitbreiding kan eveneens geschieden voor een gebied binnen Europa in een land dat voorkomt in bijlage D.


      [ref1]: https://wetten.overheid.nl/BWBR0039787
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0039787
  - number: '13.4'
    text: 'De tegemoetkoming, bedoeld in het tweede lid, wordt niet verstrekt indien:'
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel13
  - number: 13.4.a
    text: |-
      de dienstreiziger tijdens de dienstreis de beschikking kan hebben over geschikte militaire kleding, tenzij dit door
      de commandant als ondoelmatig in verband met de aard van de dienstreis wordt geoordeeld; of
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel13
  - number: 13.4.b
    text: |-
      de dienstreis plaatsvindt binnen 5 jaar nadat een tegemoetkoming, bedoeld in het tweede lid, voor kleding voor
      hetzelfde klimaat is verstrekt.
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel13
  - number: '14'
    text: |-
      De op grond van [artikel 13, eerste lid, onderdeel d, van het BDD][ref1], aan te wijzen activiteiten zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0007956#Artikel13
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0007956
        artikel: '13'
  - number: 14.a
    text: |-
      een sollicitatiereis, indien de uitnodiging daartoe uitgaat van een tot aanstellen bevoegd gezag binnen het
      ministerie;
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel14
  - number: 14.b
    text: |-
      een bezoek aan de bedrijfsarts, de militair geneeskundige dienst of de door of vanwege deze dienst aangewezen
      persoon of instantie, of de bedrijfsmaatschappelijk werker;
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel14
  - number: 14.c
    text: 'door de commandant aangewezen representatieve verplichtingen, waaronder in ieder geval het bezoek ten gevolge van:'
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel14
  - number: 14.c.1
    text: de ziekte of het ongeval van een collega;
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel14
  - number: 14.c.2
    text: het bijwonen van het huwelijk van een collega;
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel14
  - number: 14.c.3
    text: het bijwonen van de uitreiking van een koninklijke onderscheiding aan een collega;
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel14
  - number: 14.c.4
    text: het bijwonen van de receptie ter zake van een diensttijdjubileum van een collega;
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel14
  - number: 14.c.5
    text: het bijwonen van de afscheidsreceptie van een collega; of
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel14
  - number: 14.c.6
    text: het bijwonen van de begrafenis of de crematie van een gewezen collega.
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel14
  - number: 14.d
    text: |-
      een door de commandant aangewezen deelname aan een sportwedstrijd, centrale training of in groepsverband aan een
      wandelmars of -tocht.
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel14
  - number: '15.1'
    text: 'In geval van een detachering heeft de dienstreiziger die de status heeft van:'
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel15
  - number: 15.1.a
    text: |-
      militair: aanspraak op vergoeding van reiskosten bij of krachtens het [Verplaatsingskostenbesluit militairen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005137
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005137
  - number: 15.1.b
    text: 'burgerlijk ambtenaar defensie:'
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel15
  - number: 15.1.b.1
    text: |-
      indien het betreft een detachering in Nederland: aanspraak op vergoeding van reiskosten bij of krachtens het
      [Verplaatsingskostenbesluit burgerlijke ambtenaren defensie][ref1], met dien verstande dat de tegemoetkoming
      geldende met ingang van de dag van detachering in de plaats treedt van de tegemoetkoming, geldende vóór de dag van
      ingang van de detachering,


      [ref1]: https://wetten.overheid.nl/BWBR0006039
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006039
  - number: 15.1.b.2
    text: |-
      indien het betreft een detachering in een gebied buiten Nederland: aanspraak op vergoeding van reiskosten op de
      voet van het [Verplaatsingskostenbesluit militairen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005137
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005137
  - number: '15.2'
    text: |-
      Onder onvermijdbaar doorlopende kosten, bedoeld in [artikel 14, eerste lid, van het BDD][ref1] worden verstaan
      de kosten:


      [ref1]: https://wetten.overheid.nl/BWBR0007956#Artikel14
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0007956
        artikel: '14'
  - number: 15.2.a
    text: |-
      van een niet van overheidswege verstrekte maandtrajectkaart over het voor de detachering geldende traject, die
      doorloopt na de datum van detachering;
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel15
  - number: 15.2.b
    text: |-
      van een ander niet van overheidswege verstrekt abonnement voor het reizen met het openbaar vervoer, dat doorloopt
      na de datum van detachering, voor de duur van de periode dat dit abonnement niet kosteloos kan worden beëindigd.
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel15
  - number: '15.3'
    text: |-
      Voor de toepassing van het eerste lid, wordt in de daar genoemde algemeen verbindende voorschriften verstaan onder:
        - *‘commandant’:* de commandant, bedoeld in [artikel 1, tweede lid][ref1], van de Regeling dienstreizen Defensie;
        - *‘datum van verplaatsing, de detachering of van de indiensttreding’:* de datum van de detachering, bedoeld in
      [artikel 14, van het BDD][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0039787#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007956#Artikel14
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0039787
        artikel: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007956
        artikel: '14'
  - number: '15.4'
    text: 'Voor de aanspraak op:'
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel15
  - number: 15.4.a
    text: |-
      vergoeding van reiskosten als bedoeld in het eerste lid, onderdeel a, wordt de militair, indien dagelijks reizen
      niet mogelijk is, gelijk gesteld aan de militair met verplichte huisvesting van rijkswege;
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel15
  - number: 15.4.b
    text: |-
      vergoeding van reiskosten als bedoeld in het eerste lid, onderdeel b, wordt de ambtenaar gelijk gesteld aan de
      verhuis plichtige ambtenaar.
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel15
  - number: '15.5'
    text: |-
      Indien eerst achteraf blijkt dat een dienstreis een detachering wordt, is dit artikel, met uitzondering van het
      tweede lid, niet van toepassing op de reeds verstreken dagen.
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel15
  - number: '16.1'
    text: |-
      De eigen bijdrage, bedoeld in [artikel 14, tweede lid, van het BDD][ref1], wordt voor de dienstreiziger met de
      status van militair bij een detachering binnen Nederland, gesteld op:


      [ref1]: https://wetten.overheid.nl/BWBR0007956#Artikel14
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0007956
        artikel: '14'
  - number: 16.1.a
    text: |-
      bij het voorzien in verblijf door het ministerie: hetgeen hij is verschuldigd op grond van de
      [Regeling huisvesting en voeding militairen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0039895
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0039895
  - number: 16.1.b
    text: |-
      bij het voorzien in verblijf vanwege het ministerie: hetgeen hij is verschuldigd op grond van de
      [Regeling huisvesting en voeding militairen][ref1], met dien verstande dat in afwijking van die regeling de eigen
      bijdrage voor voeding voor de militair voor wie geen vrijstelling geldt, wordt gesteld op € 249,02.


      [ref1]: https://wetten.overheid.nl/BWBR0039895
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0039895
  - number: '16.2'
    text: |-
      De eigen bijdrage, bedoeld in [artikel 14, tweede lid, van het BDD][ref1], bedraagt voor de dienstreiziger met de
      status van burgerlijk ambtenaar defensie bij een detachering binnen Nederland:


      [ref1]: https://wetten.overheid.nl/BWBR0007956#Artikel14
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0007956
        artikel: '14'
  - number: 16.2.a
    text: |-
      voor huisvesting: bij het voorzien in verblijf door of vanwege het ministerie: een maandelijkse eigen
      bijdrage van 3,6 procent van het voor hem geldende salaris, met inachtneming van het maximumbedrag,
      genoemd in [artikel 7, tweede lid, van de Regeling huisvesting en voeding militairen][ref1],
      voor de ambtenaar die geen eigen huishouding voert als bedoeld in
      [artikel 2, eerste lid, onderdeel h, van het Verplaatsingskostenbesluit burgerlijke ambtenaren defensie][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0039895#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0006039#Artikel2
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0039895
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0006039
        artikel: '2'
  - number: 16.2.b
    text: 'voor voeding:'
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel16
  - number: 16.2.b.1°
    text: 'bij het voorzien in verblijf door het ministerie: de aldaar verschuldigde maaltijdprijzen,'
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel16
  - number: 16.2.b.2°
    text: 'bij het voorzien in verblijf vanwege het ministerie: € 249,02.'
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel16
  - number: '16.3'
    text: |-
      De bijdrage, bedoeld in het eerste lid, onderdeel b, en het tweede lid wordt voor een periode korter dan een maand
      naar tijdsgelang berekend, waarbij een maand wordt gesteld op dertig dagen.
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel16
  - number: '16.4'
    text: |-
      Het gestelde in [artikel 15, vijfde lid][ref1], is bij een detachering in Nederland van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0039787#Artikel15
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0039787
        artikel: '15'
        paragraaf: '4'
  - number: '16.5'
    text: |-
      Bij een detachering als bedoeld in [artikel 14, tweede lid, juncto vierde lid, onderdeel b, van het BDD][ref1],
      bestaat aanspraak op een verblijfkostenvergoeding overeenkomstig [paragraaf 3][ref2], met dien verstande dat met
      ingang van de eenenzestigste dag, of zoveel eerder als daartoe naar het oordeel van de commandant aanleiding is,
      de bedragen van de maaltijdcomponenten en de uur component, bedoeld in [artikel 12, vierde lid][ref3], worden
      gehalveerd.


      [ref1]: https://wetten.overheid.nl/BWBR0007956#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0039787#Paragraaf3
      [ref3]: https://wetten.overheid.nl/BWBR0039787#Artikel12
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0007956
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0039787
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0039787
        artikel: '12'
        paragraaf: '3'
  - number: 16a
    text: |-
      Voor de militair van de Koninklijke Marechaussee die in opdracht van de Commandant Koninklijke Marechaussee in
      het kader van de uitoefening van taken op grond van de [Politiewet 2012][ref1] of de [Vreemdelingenwet 2000][ref2]
      deze taken verricht op een andere locatie dan de standplaats voor een langere duur dan vier weken en als
      gevolg hiervan niet dagelijks reist tussen de woning en de plaats van tewerkstelling en voor zijn huisvesting
      gebruik dient te maken van hotelvoorzieningen, geldt de gehele periode van tewerkstelling als een dienstreis,
      waarbij huisvesting en voeding door en voor rekening van Defensie worden verstrekt. De vergoedingen vinden
      plaats op grond van [artikelen 3 tot en met 11][ref3] en [12, tweede lid, onderdeel a][ref4], van deze
      regeling. Gedurende de periode van tewerkstelling bestaat geen aanspraak op vergoedingen op basis van het
      [Verplaatsingskostenbesluit militairen][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0031788
      [ref2]: https://wetten.overheid.nl/BWBR0011823
      [ref3]: https://wetten.overheid.nl/BWBR0039787#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0039787#Artikel12
      [ref5]: https://wetten.overheid.nl/BWBR0005137
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0031788
      - id: ref2
        bwb_id: BWBR0011823
      - id: ref3
        bwb_id: BWBR0039787
        artikel: '3'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0039787
        artikel: '12'
        paragraaf: '3'
      - id: ref5
        bwb_id: BWBR0005137
  - number: '17'
    text: De commandant kan voor de in deze regeling bedoelde vergoedingen een voorschot verstrekken.
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel17
  - number: '18.1'
    text: |-
      De reisdeclaratie wordt voldaan tot het bedrag, waarop volgens de door de dienstreiziger vermelde gegevens op grond
      van het [BDD][ref1] en de Regeling dienstreizen defensie aanspraak kan worden gemaakt of wordt gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0007956
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0007956
  - number: '18.2'
    text: |-
      Voor het indienen van de reisdeclaratie wordt gebruik gemaakt van DIDO. Bij het indienen worden de procedures en
      instructies als vermeld in DIDO gevolgd.
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel18
  - number: '18.3'
    text: |-
      De commandant bepaalt welke bewijsstukken bij de reisdeclaratie worden gevoegd. Het betreft in ieder geval de
      betalingsbewijzen inzake de gemaakte kosten:
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel18
  - number: 18.3.a
    text: van het reizen per trein;
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel18
  - number: 18.3.b
    text: verband houdende met het reizen met dienstvervoer;
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel18
  - number: 18.3.c
    text: van (trein)taxigebruik of het gebruik van een gehuurd motorrijtuig;
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel18
  - number: 18.3.d
    text: van logies in een gebied buiten Nederland; en
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel18
  - number: 18.3.e
    text: |-
      bedoeld in [artikel 13][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0039787#Artikel13
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0039787
        artikel: '13'
        paragraaf: '3'
  - number: '19'
    text: |-
      Indien het bedrag van een component behorend bij een binnen de dienstreis vallend gebied buiten Nederland niet in
      [bijlage C][ref1] staat vermeld, bepaalt de Hoofddirecteur Personeel van het Ministerie van Defensie. dit bedrag
      aan de hand van de geldende rekenregels.


      [ref1]: https://wetten.overheid.nl/BWBR0039787
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0039787
  - number: '20'
    text: Vervallen
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel20
  - number: '21'
    text: |-
      Deze regeling treedt in werking op de dag waarop het [Besluit dienstreizen defensie][ref1] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0007956
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0007956
  - number: '22'
    text: Deze regeling wordt aangehaald als Regeling dienstreizen defensie.
    url: https://wetten.overheid.nl/BWBR0039787/2026-03-18#Artikel22
