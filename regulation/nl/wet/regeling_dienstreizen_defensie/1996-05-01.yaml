  - number: 16a
    text: |-
      Voor de militair van de Koninklijke Marechaussee die in opdracht van de Commandant Koninklijke Marechaussee in
      het kader van de uitoefening van taken op grond van de [Politiewet 2012][ref1] of de [Vreemdelingenwet 2000][ref2]
      deze taken verricht op een andere locatie dan de standplaats voor een langere duur dan vier weken en als
      gevolg hiervan niet dagelijks reist tussen de woning en de plaats van tewerkstelling en voor zijn huisvesting
      gebruik dient te maken van hotelvoorzieningen, geldt de gehele periode van tewerkstelling als een dienstreis,
      waarbij huisvesting en voeding door en voor rekening van Defensie worden verstrekt. De vergoedingen vinden
      plaats op grond van [artikelen 3 tot en met 11][ref3] en [12, tweede lid, onderdeel a][ref4], van deze
      regeling. Gedurende de periode van tewerkstelling bestaat geen aanspraak op vergoedingen op basis van het
      [Verplaatsingskostenbesluit militairen][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0031788
      [ref2]: https://wetten.overheid.nl/BWBR0011823
