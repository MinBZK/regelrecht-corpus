  - number: '16'
    text: |-
      1. De eigen bijdrage, bedoeld in [artikel 14, tweede lid, van het BDD][ref1], wordt voor de dienstreiziger met de
      status van militair bij een detachering binnen Nederland, gesteld op:

      a. bij het voorzien in verblijf door het ministerie: hetgeen hij is verschuldigd op grond van de Regeling
      huisvesting en voeding militairen;

      b. bij het voorzien in verblijf vanwege het ministerie: hetgeen hij is verschuldigd op grond van de Regeling
      huisvesting en voeding militairen, met dien verstande dat in afwijking van die regeling de eigen bijdrage voor
      voeding voor de militair voor wie geen vrijstelling geldt, wordt gesteld op € 185,62.

      2. De eigen bijdrage, bedoeld in [artikel 14, tweede lid, van het BDD][ref2], bedraagt voor de dienstreiziger met
      de status van burgerlijk ambtenaar defensie bij een detachering binnen Nederland:

      a. voor huisvesting: bij het voorzien in verblijf door of vanwege het ministerie: een
      maandelijkse eigen bijdrage van 3,6 procent van het voor hem geldende salaris, met inachtneming
      van het maximumbedrag, genoemd in artikel 7, tweede lid, van de Regeling huisvesting en
      voeding militairen, voor de ambtenaar die geen eigen huishouding voert als bedoeld in
      [artikel 2, eerste lid, onderdeel h, van het Verplaatsingskostenbesluit burgerlijke ambtenaren defensie][ref3],

      b. voor voeding:

      1°. bij het voorzien in verblijf door het ministerie: de aldaar verschuldigde maaltijdprijzen,

      2°. bij het voorzien in verblijf vanwege het ministerie: € 186,54

      3. De bijdrage, bedoeld in het eerste lid, onderdeel b, en het tweede lid wordt voor een periode korter dan een
      maand naar tijdsgelang berekend, waarbij een maand wordt gesteld op dertig dagen.

      4. Het gestelde in [artikel 15, vijfde lid][ref4], is bij een detachering in Nederland van overeenkomstige
      toepassing.

      5. Bij een detachering als bedoeld in [artikel 14, tweede lid, juncto vierde lid, onderdeel b, van het BDD][ref5],
      bestaat aanspraak op een verblijfkostenvergoeding overeenkomstig [paragraaf 3][ref6], met dien verstande dat met
      ingang van de eenenzestigste dag, of zoveel eerder als daartoe naar het oordeel van de commandant aanleiding is,
      de bedragen van de maaltijdcomponenten en de uur component, bedoeld in [artikel 12, vierde lid][ref7], worden
      gehalveerd.


      [ref1]: https://wetten.overheid.nl/BWBR0007956#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0007956#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0006039#Artikel2
