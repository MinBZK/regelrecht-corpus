  - number: '15'
    text: |-
      1. In geval van een detachering heeft de dienstreiziger die de status heeft van:

      a. militair: aanspraak op vergoeding van reiskosten bij of krachtens het
      [Verplaatsingskostenbesluit militairen][ref1];

      b. burgerlijk ambtenaar defensie:

      1. indien het betreft een detachering in Nederland: aanspraak op vergoeding van reiskosten bij of krachtens het
      [Verplaatsingskostenbesluit burgerlijke ambtenaren defensie][ref2], met dien verstande dat de tegemoetkoming
      geldende met ingang van de dag van detachering in de plaats treedt van de tegemoetkoming, geldende vóór de dag van
      ingang van de detachering,

      2. indien het betreft een detachering in een gebied buiten Nederland: aanspraak op vergoeding van reiskosten op de
      voet van het [Verplaatsingskostenbesluit militairen][ref3].

      2. Onder onvermijdbaar doorlopende kosten, bedoeld in [artikel 14, eerste lid, van het BDD][ref4] worden verstaan
      de kosten:

      a. van een niet van overheidswege verstrekte maandtrajectkaart over het voor de detachering geldende traject, die
      doorloopt na de datum van detachering;

      b. van een ander niet van overheidswege verstrekt abonnement voor het reizen met het openbaar vervoer, dat
      doorloopt na de datum van detachering, voor de duur van de periode dat dit abonnement niet kosteloos kan worden
      beëindigd.

      3. Voor de toepassing van het eerste lid, wordt in de daar genoemde algemeen verbindende voorschriften verstaan
      onder:

        - *‘commandant’:* de commandant, bedoeld in [artikel 1, tweede lid][ref5], van de Regeling dienstreizen Defensie;
        - *‘datum van verplaatsing, de detachering of van de indiensttreding’:* de datum van de detachering, bedoeld in
      [artikel 14, van het BDD][ref6].

      4. Voor de aanspraak op:

      a. vergoeding van reiskosten als bedoeld in het eerste lid, onderdeel a, wordt de militair, indien dagelijks reizen
      niet mogelijk is, gelijk gesteld aan de militair met verplichte huisvesting van rijkswege;

      b. vergoeding van reiskosten als bedoeld in het eerste lid, onderdeel b, wordt de ambtenaar gelijk gesteld aan de
      verhuis plichtige ambtenaar.

      5. Indien eerst achteraf blijkt dat een dienstreis een detachering wordt, is dit artikel, met uitzondering van het
      tweede lid, niet van toepassing op de reeds verstreken dagen.


