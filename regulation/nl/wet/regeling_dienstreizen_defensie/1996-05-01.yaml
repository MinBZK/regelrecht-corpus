    text: |-
      De groepen, bedoeld in [artikel 3 tweede lid, onderdeel d, van het BDD][ref1] zijn degenen die op individuele
      basis of in groepsverband zijn ingezet in het kader van een door de minister als zodanig aangemerkte vredes- en
      humanitaire operatie of andere vorm van daadwerkelijke inzet buiten Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0007956#Artikel3
