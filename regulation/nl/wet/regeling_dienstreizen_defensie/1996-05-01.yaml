articles:
  - number: '1'
    text: |-
      1. In deze regeling wordt verstaan onder:

        - *de minister:* de Minister van Defensie;
        - *het BDD:* het [Besluit dienstreizen defensie][ref1];
        - *het IBBAD:* het [Inkomstenbesluit burgerlijke ambtenaren defensie][ref2];
        - *binnenlandse dienstreis:* dienstreis in Nederland;
        - *buitenlandse dienstreis:* dienstreis in, naar of uit een gebied buiten Nederland;
        - *DIDO:* Defensie Intranettoepassing Dienstreis Opdrachten.

      2. Onder commandant, bedoeld in deze regeling wordt verstaan de commandant als bedoeld in de Regeling aanwijzing
      commandanten defensie.


      [ref1]: https://wetten.overheid.nl/BWBR0007956
      [ref2]: https://wetten.overheid.nl/BWBR0018191
