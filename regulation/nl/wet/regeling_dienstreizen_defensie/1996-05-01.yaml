      1. Ter bepaling van het omslagpunt, bedoeld in [artikel 7, derde lid, van het BDD][ref1], worden de door de
      dienstreiziger gemaakte reiskosten gesaldeerd met de door de dienstreiziger ontvangen reiskostentegemoetkomingen.

      2. De door de dienstreiziger gemaakte reiskosten zijn het totaal van:

      a) de eigen kosten van het abonnement, bedoeld in [artikel 7, derde lid, van het BDD][ref2], met inachtneming van
      de eigen bijdrage; en

      b) de werkelijk gemaakte reiskosten voor de dienstreizen.

      3. De door de dienstreiziger ontvangen reiskostentegemoetkomingen zijn het totaal van:

      a) de over de looptijd van het abonnement ontvangen reiskostenvergoedingen voor de gemaakte dienstreizen; en

      b) de eventueel over de looptijd van dit abonnement (te) ontvangen tegemoetkomingen in de kosten van het reizen
      tussen de woning en de plaats van tewerkstelling.

      4. De eigen bijdrage bedraagt € 48,29 per maand indien een door Defensie verstrekt openbaar vervoerabonnement
      of een tegemoetkoming voor het dagelijks reizen per openbaar vervoer op basis van een jaar(traject)kaart wordt
      ontvangen. De eigen bijdrage bedraagt € 59,95 per maand indien een tegemoetkoming voor het dagelijks reizen per
      openbaar vervoer wordt ontvangen op basis van een maand(traject)kaart.


      [ref1]: https://wetten.overheid.nl/BWBR0007956#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007956#Artikel7
