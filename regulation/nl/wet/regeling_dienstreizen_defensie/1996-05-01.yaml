  - number: '14'
    text: |-
      De op grond van [artikel 13, eerste lid, onderdeel d, van het BDD][ref1], aan te wijzen activiteiten zijn:

      a. een sollicitatiereis, indien de uitnodiging daartoe uitgaat van een tot aanstellen bevoegd gezag binnen het
      ministerie;

      b. een bezoek aan de bedrijfsarts, de militair geneeskundige dienst of de door of vanwege deze dienst aangewezen
      persoon of instantie, of de bedrijfsmaatschappelijk werker;

      c. door de commandant aangewezen representatieve verplichtingen, waaronder in ieder geval het bezoek ten gevolge
      van:

      1. de ziekte of het ongeval van een collega;

      2. het bijwonen van het huwelijk van een collega;

      3. het bijwonen van de uitreiking van een koninklijke onderscheiding aan een collega;

      4. het bijwonen van de receptie ter zake van een diensttijdjubileum van een collega;

      5. het bijwonen van de afscheidsreceptie van een collega; of

      6. het bijwonen van de begrafenis of de crematie van een gewezen collega.

      d. een door de commandant aangewezen deelname aan een sportwedstrijd, centrale training of in groepsverband aan een
      wandelmars of -tocht.


      [ref1]: https://wetten.overheid.nl/BWBR0007956#Artikel13
