      1. Het aantal kilometers, bedoeld in [artikel 9, derde lid, van het BDD][ref1], bedraagt 10.000.

      2. De andere kosten, bedoeld in [artikel 9, derde lid, van het BDD][ref2] zijn die voor:

      a) stalling, garage en parkeren;

      b) parkeerbelasting;

      c) het gebruik van een veer of een brug; en

      d) betaalde tol in Nederland.

      3. De betaalde tol in het buitenland wordt vergoed.


