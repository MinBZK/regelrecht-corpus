  - number: '12'
    text: |-
      1. De vergoeding van de verblijfkosten, bedoeld in [artikel 12, eerste lid, van het BDD][ref1], bestaat uit:

      a. de vergoeding van maaltijden (de maaltijdcomponenten), te weten:

      1. de lunchcomponent,

      2. de dinercomponent,

      3. de ontbijtcomponent;

      b. de vergoeding van logies (de logiescomponent); en

      c. de vergoeding van kleine uitgaven.

      2. De vergoeding van kleine uitgaven bestaat uit:

      a. indien het betreft een binnenlandse dienstreis:

      1°. de kleine component, en

      2°. de grote component;

      b. indien het betreft een buitenlandse dienstreis: de uur component.

      3. Ten aanzien van de maaltijdcomponenten geldt dat slechts aanspraak bestaat op:

      a. de lunchcomponent, indien mede voldaan is aan de voorwaarde dat de tijd tussen 12.00 uur en 14.00 uur geheel in
      de dienstreis valt;

      b. de dinercomponent, indien mede voldaan is aan de voorwaarde dat de tijd tussen 17.30 uur en 20.30 uur geheel in
      de dienstreis valt; en

      c. de ontbijtcomponent, indien het ontbijt aansluit op een binnen de dienstreis vallend logies; en

      d. de omgekeerde lunchcomponent, indien mede is voldaan aan de voorwaarden dat de tijd tussen 00.00 uur en 03.00
      uur geheel in de dienstreis valt en gedurende die tijd geen logies wordt genoten.

      4. De bedragen van de maaltijdcomponenten worden, indien de dienstreiziger de kosten in een horecabedrijf heeft
      gemaakt, gevonden door toepassing van [bijlage C][ref2], kolom Horeca. De bedragen van de kleine en grote component
      en de uur component worden gevonden door toepassing van bijlage C, de desbetreffende kolom.

      5. Indien de dienstreiziger bij een dienstreis kosten heeft gemaakt voor een maaltijd van overheidswege, bestaat
      geen aanspraak op enige maaltijdcomponent. De commandant bepaalt op welke plaatsen sprake is van maaltijden of
      logies van overheidswege.

      6. Indien de dienstreiziger kosten heeft gemaakt voor logies worden:

      a. voor de binnenlandse dienstreis de kosten gemaakt in de horeca vergoed door toekenning van de logiescomponent,
      gevonden door toepassing van [bijlage C][ref3], kolom Logiescomponent.

      b. voor de buitenlandse dienstreis de werkelijk gemaakte kosten vergoed tot ten hoogste het bedrag van de
      logiescomponent, gevonden door toepassing van [bijlage C][ref4], kolom Maximumvergoeding logieskosten.

      7. Indien bij een buitenlandse dienstreis een bewijsstuk van de kosten voor logies en ontbijt wordt overgelegd
      waaruit niet blijkt welk deel van de kosten voor logies en welk deel van de kosten voor ontbijt zijn gemaakt,
      worden de op het bewijsstuk vermelde kosten vergoed tot ten hoogste het bedrag van de som van de ontbijt- en
      logiescomponent.

      8. Onverminderd het eerste tot en met achtste lid, geldt voor de vergoeding van kleine uitgaven dat aanspraak
      bestaat op:

      a. de kleine component voor ieder vol etmaal dat de binnenlandse dienstreis duurt, alsmede voor een resterend
      gedeelte van een etmaal dan wel voor een dienstreis van kortere duur dan een etmaal, indien mede voldaan is aan de
      voorwaarde dat tenminste vier uren in het resterende gedeelte of in de dienstreis vallen;

      b. tweemaal de kleine component voor iedere avond tijdens een binnenlandse dienstreis, indien op de plaats
      van bestemming van de dienstreis doelmatig gebruik kan worden gemaakt van maaltijden vanwege het ministerie en
      aansluitend op die avond op die bestemming logies wordt genoten;

      c. de grote component, indien aansluitend op de avond tijdens de binnenlandse dienstreis logies bij een
      horecabedrijf wordt genoten;

      d. de uur component voor ieder uur of gedeelte van een uur dat de buitenlandse dienstreis buiten Nederland duurt;

      e. de kleine of grote component voor een binnen Nederland verlopend gedeelte van de buitenlandse dienstreis,
      waarbij de onderdelen a en b van overeenkomstige toepassing zijn.

      9. Indien bij reizen door verschillende gebieden buiten Nederland tijdens één of meer reisgedeelten geen uitgaven
      voor maaltijden of logies hoeven te worden gedaan, worden deze reisgedeelten gevoegd bij een volgend of voorafgaand
      reisgedeelte buiten Nederland in welk geval aanspraak bestaat op de in dat geval van toepassing zijnde uur
      component.


