  - number: '17'
    text: De commandant kan voor de in deze regeling bedoelde vergoedingen een voorschot verstrekken.
    url: https://wetten.overheid.nl/BWBR0039787/1996-05-01#Artikel17
  - number: '18'
    text: |-
      1. De reisdeclaratie wordt voldaan tot het bedrag, waarop volgens de door de dienstreiziger vermelde gegevens op
      grond van het [BDD][ref1] en de Regeling dienstreizen defensie aanspraak kan worden gemaakt of wordt gemaakt.

      2. Voor het indienen van de reisdeclaratie wordt gebruik gemaakt van DIDO. Bij het indienen worden de procedures en
      instructies als vermeld in DIDO gevolgd.

      3. De commandant bepaalt welke bewijsstukken bij de reisdeclaratie worden gevoegd. Het betreft in ieder geval de
      betalingsbewijzen inzake de gemaakte kosten:

      a. van het reizen per trein;

      b. verband houdende met het reizen met dienstvervoer;

      c. van (trein)taxigebruik of het gebruik van een gehuurd motorrijtuig;

      d. van logies in een gebied buiten Nederland; en

      e. bedoeld in [artikel 13][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007956
      [ref2]: https://wetten.overheid.nl/BWBR0039787#Artikel13
    url: https://wetten.overheid.nl/BWBR0039787/1996-05-01#Artikel18
