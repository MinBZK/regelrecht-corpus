      1. De vergoeding, bedoeld in [artikel 9, eerste lid, van het BDD][ref1], per afgelegde kilometer met de eigen
      fiets, wordt gevonden door toepassing van [bijlage B][ref2], tabel 2.

      2. De noodzakelijke kosten voor stalling van een voor de dienstreis gebruikte fiets en de noodzakelijk gemaakte
      andere kosten van het gebruik voor de dienstreis van een fiets worden vergoed.


