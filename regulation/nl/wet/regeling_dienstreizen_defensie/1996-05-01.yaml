  - number: '13'
    text: |-
      1. Andere kosten, bedoeld in [artikel 12, tweede lid, van het BDD][ref1], die bij een buitenlandse dienstreis
      worden vergoed zijn de naar het oordeel van de commandant noodzakelijk gemaakte kosten ter zake van:

      a. aan- en verkoop van buitenlandse betaalmiddelen;

      b. vaccinatie;

      c. geleden koersverlies na aftrek van eventueel gemaakte koerswinst;

      d. uitrusting; en

      e. een reisverzekering met dezelfde of nagenoeg dezelfde dekking als die welke geldt indien de reis vanuit
      Nederland door de commandant bij de hem daarvoor aangewezen reisorganisatie zou zijn geboekt, doch alleen indien
      de kosten daarvan niet in de prijs van het reisbiljet zijn begrepen en voor die gevallen waarin bedoelde boeking
      wegens bijzondere omstandigheden niet kon plaatsvinden.

      2. De dienstreiziger die een dienstreis maakt van langere duur dan 7 dagen naar een in [bijlage D][ref2] vermeld
      gebied, waar tijdens de dienstreis sprake is van tropische hitte of polaire koude, wordt op zijn verzoek een
      tegemoetkoming in de werkelijk gemaakte kosten voor aanschaf van deze kleding verstrekt tot ten hoogste een bedrag
      van € 258,68.

      3. Indien een gebied niet staat vermeld in [bijlage D][ref3], kan de commandant deze bijlage voor zijn
      dienstonderdeel voor de duur van de desbetreffende dienstreis met dit gebied uitbreiden, indien tijdens de
      dienstreis sprake is van de in het tweede lid bedoelde klimatologische omstandigheden en dit gebied niet is gelegen
      binnen Europa. Deze tijdelijke uitbreiding kan eveneens geschieden voor een gebied binnen Europa in een land dat
      voorkomt in bijlage D.

      4. De tegemoetkoming, bedoeld in het tweede lid, wordt niet verstrekt indien:

      a. de dienstreiziger tijdens de dienstreis de beschikking kan hebben over geschikte militaire kleding, tenzij dit
      door de commandant als ondoelmatig in verband met de aard van de dienstreis wordt geoordeeld; of

      b. de dienstreis plaatsvindt binnen 5 jaar nadat een tegemoetkoming, bedoeld in het tweede lid, voor kleding voor
      hetzelfde klimaat is verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0007956#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0039787
      [ref3]: https://wetten.overheid.nl/BWBR0039787
