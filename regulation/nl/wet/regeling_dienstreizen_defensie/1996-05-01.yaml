        artikel: '3'
  - number: '3'
    text: |-
      1. Wegens reiskosten met openbaar vervoer worden vergoed de kosten die blijkens overgelegde bewijsstukken in
      verband met de dienstreis zijn gemaakt in het vervoermiddel dat voor de dienstreis in aanmerking komt.

      2. Niet voor vergoeding komen in aanmerking de kosten wegens reizen met lokaal openbaar vervoer in een gebied
      buiten Nederland.
    url: https://wetten.overheid.nl/BWBR0039787/1996-05-01#Artikel3
  - number: '4'
    text: |-
      1. De dienstreizigers zijn ingedeeld in vier groepen:

      a) groep 1: de secretaris-generaal, de directeuren-generaal alsmede zij die een functie vervullen waaraan is
      verbonden schaal 17 of een hogere schaal van het [BBRA][ref1] dan wel de rang van schout-bij-nacht, generaal-majoor
      of een hogere rang;

      b) groep 2: zij die een functie vervullen waaraan is verbonden schaal 14 of een hogere schaal van het [BBRA][ref2]
      dan wel de rang van kapitein ter zee, kolonel of een hogere rang, voor zover zij niet behoren tot groep 1;

      c) groep 3: zij die een functie vervullen waaraan is verbonden schaal 9 of een hogere schaal van het [IBBAD][ref3]
      dan wel een hogere rang dan adjudant-onderofficier/vaandrig, voor zover zij niet behoren tot de groepen 1 en 2; en

      d) groep 4: zij die een functie vervullen waaraan is verbonden schaal 8 of een lagere schaal van het [IBBAD][ref4],
      dan wel zij die een functie vervullen waaraan is verbonden de rang van adjudantonderofficier/vaandrig of een lagere
      rang of stand.

      2. Ingeval van een dienstreiziger met een titulaire rang of een rang verbonden aan de fase van een bepaalde
      opleiding, wordt deze door de commandant ingedeeld in de met deze rang overeenkomende groep.


      [ref1]: https://wetten.overheid.nl/BWBR0003630
      [ref2]: https://wetten.overheid.nl/BWBR0003630
