      1. De indeling in reisklassen, bedoeld in [artikel 7, tweede lid, van het BDD][ref1], geschiedt volgens
      [bijlage A][ref2], Klasse-indeling bij dienstreizen Defensie.

      2. Indien bij een dienstreis met het vliegtuig een in [bijlage A][ref3] genoemde vliegtuigklasse niet voorkomt,
      bepaalt de commandant de klasse die met de betrokken klasse overeenkomt.

      3. De commandant kan, in voorkomend geval, het reizen met het vliegtuig in een hogere klasse toestaan, indien in
      de voor de dienstreiziger geldende klasse door plaatsgebrek geen passage kan worden besproken en de reis niet kan
      worden uitgesteld.

      4. Een dienstreiziger is gehouden te reizen in een lagere dan de voor hem geldende klasse, indien het dienstbelang
      dit vereist, of dit met het oog op de regeling van de dienstreis nodig wordt geacht.

      5. De commandant kan de persoonsbeveiliger die ter uitvoering van zijn opdracht een dienstreis onderneemt met een
      of meer dienstreizigers die in een hogere klasse mogen reizen, toestaan in diezelfde klasse te reizen.


      [ref1]: https://wetten.overheid.nl/BWBR0007956#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0039787
