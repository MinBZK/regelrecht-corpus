---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_bewijzen_van_bekwaamheid_owvo
regulatory_layer: WET
publication_date: '2004-07-20'
valid_from: '2002-06-29'
bwb_id: BWBR0003768
url: https://wetten.overheid.nl/BWBR0003768/2002-06-29
preamble:
  text: |-
    Handelende in overeenstemming met de Minister van Landbouw en Visserij;

    Gelet op de artikelen 108 tot en met 114 van de Overgangswet W.V.O.(Stb. 1967, 386);

    Gezien de adviezen van de Academische Raad (advies van 22 april 1982, nr. AR-750) en van de HBO-Raad (advies van 24
    november 1981, nr. 20.4200/81.1583 MT);

    Gehoord de Onderwijsraad (advies van 1 maart 1982, nr. OR/176 W.V.O.);

    Besluit:
  url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Aan de bewijzen van bekwaamheid genoemd in [bijlage I][ref1] bij deze regeling is de bevoegdheid verbonden tot het
      geven van voortgezet onderwijs aan de scholen en in de vakken in die bijlage aangegeven, onder de in die bijlage
      genoemde voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0003768
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003768
  - number: '2.1'
    text: |-
      De scholen, afdelingen en leerjaren waarvoor de bevoegdheid geldt, worden aangegeven door een der coderingen 1, 2
      of 2a, die de volgende betekenis hebben:
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel2
  - number: 2.1.1
    text: |-
      alle scholen, afdelingen en leerjaren van vwo, havo, mavo, vbo, praktijkonderwijs, orthopedagogisch-didactisch
      centrum als bedoeld in [artikel 10h, derde lid, van de Wet op het voortgezet onderwijs][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10h
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10h
  - number: 2.1.2
    text: |-
      vwo (alleen de eerste drie leerjaren), havo (alleen de eerste drie leerjaren),
      mavo, vbo, praktijkonderwijs, orthopedagogisch-didactisch centrum als bedoeld in
      [artikel 10h, derde lid, van de Wet op het voortgezet onderwijs][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10h
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10h
  - number: 2.1.2a
    text: |-
      mavo, vbo, praktijkonderwijs, orthopedagogisch-didactisch centrum als bedoeld in
      [artikel 10h, derde lid, van de Wet op het voortgezet onderwijs][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10h
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10h
  - number: '2.2'
    text: Tenzij anders is of wordt bepaald worden onder scholen mede verstaan cursussen.
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel2
  - number: '3'
    text: |-
      Hij die bevoegd is onderwijs te geven in een leerjaar van een school voor voortgezet onderwijs, is bovendien
      bevoegd onderwijs te geven in een gemeenschappelijk leerjaar van een scholengemeenschap waarvan dat leerjaar deel
      uitmaakt.
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel3
  - number: 3a
    text: |-
      Hij die bevoegd is onderwijs te geven aan een soort van onderwijs vallend onder de codering 2a, is bovendien
      bevoegd onderwijs te geven aan de andere soorten van onderwijs vallend onder de codering 2a die van de
      scholengemeenschap deel uitmaken.
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel3a
  - number: 3b
    text: |-
      Hij die bevoegd is onderwijs te geven aan één of meer afdelingen van een school voor voorbereidend
      beroepsonderwijs, is bovendien bevoegd onderwijs te geven aan de andere afdelingen die van de school deel uitmaken.
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel3b
  - number: 3c
    text: |-
      Hij die bevoegd is onderwijs te geven in een of meer vakken waaruit een afdelingsvak, bedoeld in
      [artikel 26h][ref1] en [artikel 26i, eerste lid, van het Inrichtingsbesluit WVO,][ref2] is samengesteld, is
      bovendien bevoegd onderwijs te geven in het desbetreffende afdelingsvak.


      [ref1]: https://wetten.overheid.nl/BWBR0005946#Artikel26h
      [ref2]: https://wetten.overheid.nl/BWBR0005946#Artikel26i
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel3c
    references:
      - id: ref1
        bwb_id: BWBR0005946
        artikel: 26h
      - id: ref2
        bwb_id: BWBR0005946
        artikel: 26i
  - number: 3d.1
    text: |-
      Hij die bevoegd is onderwijs te geven in de afdelingsvakken metaaltechniek en elektrotechniek, als bedoeld in
      artikel 26h en artikel 26i, eerste lid, van het Inrichtingsbesluit WVO, is bovendien bevoegd onderwijs te geven in
      het intrasectoraal programma metalektro.
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel3d
  - number: 3d.2
    text: |-
      Hij die bevoegd is onderwijs te geven in het afdelingsvak bouwtechniek, als bedoeld in artikel 26h en artikel 26i,
      eerste lid, van het Inrichtingsbesluit WVO, is bovendien bevoegd onderwijs te geven in het intrasectoraal programma
      bouw-breed.
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel3d
  - number: 3d.3
    text: |-
      Hij die bevoegd is onderwijs te geven in de afdelingsvakken elektrotechniek en installatietechniek, als bedoeld in
      artikel 26h en artikel 26i, eerste lid, van het Inrichtingsbesluit WVO, is bovendien bevoegd onderwijs te geven in
      het intrasectoraal programma instalektro.
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel3d
  - number: 3d.4
    text: |-
      Hij die bevoegd is onderwijs te geven in het afdelingsvak verzorging, als bedoeld in artikel 26h en artikel 26i,
      eerste lid, van het Inrichtingsbesluit WVO, is bovendien bevoegd onderwijs te geven in het intrasectoraal programma
      zorg en welzijn.
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel3d
  - number: 3d.5
    text: |-
      Hij die bevoegd is onderwijs te geven in de afdelingsvakken administratie of handel en verkoop, als bedoeld in
      artikel 26h en artikel 26i, eerste lid, van het Inrichtingsbesluit WVO, is bovendien bevoegd onderwijs te geven in
      het intrasectoraal programma handel en administratie.
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel3d
  - number: 3d.6
    text: |-
      Hij die bevoegd is onderwijs te geven in het afdelingsvak consumptief, als bedoeld in artikel 26h en artikel 26i,
      eerste lid, van het Inrichtingsbesluit WVO, is bovendien bevoegd onderwijs te geven in het intrasectoraal programma
      consumptief-breed.
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel3d
  - number: 3d.7
    text: |-
      Hij die bevoegd is onderwijs te geven in het afdelingsvak landbouw en natuurlijke omgeving, als bedoeld in artikel
      26h en artikel 26i, eerste lid, van het Inrichtingsbesluit WVO, is bovendien bevoegd onderwijs te geven in het
      intrasectoraal programma landbouw-breed.
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel3d
  - number: '4.1'
    text: |-
      Tenzij uitdrukkelijk anders wordt bepaald, wordt in deze regeling en de bijbehorende bijlagen onder het
      getuigschrift van een met goed gevolg afgelegd doctoraalexamen verstaan het desbetreffende getuigschrift bedoeld
      in het Academisch Statuut (Stb. 1963, 380) of het inhoudelijk daarmee overeenkomende getuigschrift bedoeld in het
      Academisch Statuut (Stb. 1921, 800).
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel4
  - number: '4.2'
    text: |-
      Onder het bewijs van voldoende pedagogische en didactische voorbereiding, dat in de bijlagen bij deze regeling
      wordt aangegeven met “bewijs van p.d.v.”, wordt verstaan de verklaring bedoeld in dan wel overeenkomstig die
      bedoeld in artikel 217 van het Academisch Statuut (Stb. 1963, 380), dat het bewijs is geleverd van voldoende
      pedagogisch-didactische scholing bedoeld in dan wel overeenkomstig die bedoeld in artikel 215 van dat Statuut,
      of de overeenkomstige verklaring op grond van het Academisch Statuut (Stb. 1921, 800) of het Technische-
      Hogeschoolstatuut (Stb. 1958, 594).
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel4
  - number: '4.3'
    text: |-
      In afwijking van het in het tweede lid bepaalde wordt, indien het betreft een getuigschrift of diploma van de
      Landbouwhogeschool, onder het bewijs van voldoende pedagogische en didactische voorbereiding verstaan de verklaring
      bedoeld in dan wel overeenkomstig die bedoeld in artikel 22f van het Landbouwhogeschoolstatuut, dat het bewijs
      is geleverd van voldoende pedagogisch-didactische scholing bedoeld in dan wel overeenkomstig die bedoeld in dat
      artikel.
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel4
  - number: '5.1'
    text: |-
      Tenzij uitdrukkelijk anders wordt bepaald, wordt in deze regeling en de bijbehorende bijlagen onder het diploma
      van een school voor hoger beroepsonderwijs of kunstonderwijs verstaan het desbetreffende diploma bedoeld in
      [artikel 29 van de Wet op het voortgezet onderwijs][ref1], dan wel het getuigschrift of diploma van een school of
      cursus die volgens de bepalingen van [titel IV van de Overgangswet W.V.O.][ref2] is omgezet in de desbetreffende
      school voor hoger beroepsonderwijs of kunstonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0002595
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0002595
  - number: '5.2'
    text: |-
      Waar in de omschrijving van een bewijs van bekwaamheid, bedoeld in kolom II van de Lijst van bewijzen van
      bekwaamheid O.W.V.O. "opleiding tot leraar voortgezet onderwijs" is vermeld, wordt daaronder ook verstaan:
      studierichting leraar voortgezet onderwijs.
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel5
  - number: '6.1'
    text: |-
      Onder het pedagogisch diploma, dat in de bijlagen bij deze regeling wordt aangegeven met “p.d.” wordt verstaan: het
      pedagogisch diploma afgegeven door een van de avondscholen van het Nederlands Genootschap tot Opleiding van Leraren
      voor het Beroepsonderwijs of het pedagogisch getuigschrift voor het nijverheidsonderwijs verkregen ingevolge het
      Besluit Pedagogisch Getuigschrift NO.
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel6
  - number: '6.2'
    text: |-
      Onder “Q” wordt verstaan: het bewijs van met goed gevolg afgelegd examen in de theorie van onderwijs en opvoeding
      verkregen ingevolge de desbetreffende bepalingen krachtens de Middelbaar-onderwijswet.
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel6
  - number: '7.1'
    text: |-
      Onder de vakken waarvoor de bevoegdheid geldt worden, tenzij anders wordt bepaald, mede verstaan de onder een
      andere benaming aan de scholen onderwezen vakken of onderdelen van vakken, die gezien hun inhoud tot de in de
      bijlagen bij deze regeling genoemde vakken gerekend kunnen worden.
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel7
  - number: '7.2'
    text: Zonodig worden over de toepassing van het in het eerste lid bepaalde nadere voorschriften gegeven.
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel7
  - number: '8.1'
    text: |-
      Het vak statistiek wordt, zoals aangegeven in bijlage I bij deze regeling, begrepen onder de vakken algemene
      economie, bedrijfseconomie, wiskunde en methoden en technieken van onderzoek.
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel8
  - number: '8.2'
    text: |-
      Het vak economie wordt voor zover het betreft het voorbereidend beroepsonderwijs en het middelbaar algemeen
      voortgezet onderwijs begrepen onder het vak algemene economie en het vak bedrijfseconomie.
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel8
  - number: '8.3'
    text: |-
      Zonder daardoor afbreuk te doen aan het in het eerste en tweede lid bepaalde en aan de voorwaarden in
      [bijlage I][ref1] gesteld, worden onder algemene economie in elk geval mede verstaan de vakken economische
      wetenschappen I en recht (voorbereidend wetenschappelijk onderwijs) en economie (hoger algemeen voortgezet
      onderwijs).


      [ref1]: https://wetten.overheid.nl/BWBR0003768
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003768
  - number: '8.4'
    text: |-
      Zonder daardoor afbreuk te doen aan het in het eerste, tweede en derde lid bepaalde worden onder bedrijfseconomie
      in elk geval mede verstaan de vakken economische wetenschappen II en recht (voorbereidend wetenschappelijk
      onderwijs) en handelswetenschappen en recht (hoger algemeen voortgezet onderwijs).
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel8
  - number: '8.5'
    text: |-
      Zonder daardoor afbreuk te doen aan het in het eerste, tweede, derde en vierde lid bepaalde worden onder agrarische
      economie mede verstaan de economische vakken in het landbouwonderwijs, waaronder het vak handelskennis in het lager
      landbouwonderwijs.
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel8
  - number: '8.6'
    text: |-
      Het vak management en organisatie (voorbereidend wetenschappelijk onderwijs en hoger algemeen voortgezet onderwijs)
      wordt begrepen onder het vak bedrijfseconomie.
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel8
  - number: '9.1'
    text: |-
      Onder de theoretisch-technische vakken (van een bepaald vakgebied) worden mede verstaan de vakken vaktekenen en
      technisch schetsen (met betrekking tot dat vakgebied).
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel9
  - number: '9.2'
    text: |-
      De toevoeging "algemene" bij de technische vakgebieden duidt aan: - de vakken die onderdeel zijn van het betrokken
      technische vakgebied voor zover zij worden onderwezen in de eerste drie leerjaren van scholen voor voorbereidend
      beroepsonderwijs;
        - het betrokken technische vakgebied voor zover dat met inachtneming van de wettelijke voorschriften als
      geïntegreerd vakgebied, onder de desbetreffende benaming van dat vakgebied wordt onderwezen.
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel9
  - number: '9.3'
    text: |-
      Onder bouwtechniek/bouwkunde worden in elk geval mede verstaan timmeren, metselen, schilderen en meubelmaken/
      fijnhoutbewerken/machinaal houtbewerken; schilderen als vakgebied binnen scholen voor middelbaar technisch
      onderwijs wordt echter niet gerekend tot bouwtechniek/bouwkunde.
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel9
  - number: '9.4'
    text: |-
      Voor vakleer in cursussen in het kader van het leerlingwezen is bevoegd de leraar die bevoegd is voor de praktische
      of theoretisch-technische vakken of voor beide, in de desbetreffende vakrichting, tenzij anders is of wordt
      bepaald.
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel9
  - number: 9a
    text: Onder het vak techniek wordt mede verstaan het vak algemene technieken (techniek).
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel9a
  - number: 9b.1
    text: |-
      Voor de combinatie van de vakken natuur- en scheikunde, biologie tot één vak gedurende de periode van basisvorming
      is bevoegd de leraar die bevoegd is voor een of meer van de vakken natuurkunde, scheikunde en biologie.
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel9b
  - number: 9b.2
    text: |-
      Voor de combinatie van twee of drie van de vakken geschiedenis en staatsinrichting, aardrijkskunde, economie tot
      één vak gedurende de periode van basisvorming is bevoegd: - de leraar die bevoegd is voor een of meer van de te
      combineren vakken;
        - de leraar die volgens de bijlage I bij deze regeling bevoegd is voor het onderwijs in het vak maatschappijleer.
        - de leraar die krachtens een verklaring op grond van [artikel 114 van de Overgangswet W.V.O.][ref1] bevoegd is
      voor het vak maatschappijleer en die tussen 1 augustus 1990 en 1 augustus 1993 in een al dan niet aaneengesloten
      periode van ten minste veertig schoolweken aan een school voor voortgezet onderwijs in dat vak onderwijs heeft
      gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002595#Artikel114
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0002595
        artikel: '114'
  - number: 9b.3
    text: |-
      Voor de combinatie van twee of meer van de vakken tekenen, handvaardigheid/handenarbeid, handvaardigheid/textiele
      werkvormen, fotografie, film en audiovisuele vorming tot één vak gedurende de periode van basisvorming is bevoegd
      de leraar die bevoegd is voor een of meer van de te combineren vakken.
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel9b
  - number: 9b.4
    text: |-
      Voor de combinatie van het vak informatiekunde en één van de vakken Nederlandse taal, economie, wiskunde, natuur-
      en scheikunde, techniek tot één vak gedurende de periode van basisvorming is bevoegd de leraar die bevoegd is voor
      het vak dat met het vak informatiekunde is gecombineerd.
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel9b
  - number: '10.1'
    text: |-
      Voor het vak kennis der natuur is bevoegd de leraar die bevoegd is voor een of meer der vakken natuurkunde,
      scheikunde en biologie.
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel10
  - number: '10.2'
    text: |-
      Zonder daardoor afbreuk te doen aan het voor het overige in deze regeling en de daarbij behorende bijlagen
      bepaalde, worden onder biologie in elk geval mede verstaan de vakken anatomie en fysiologie, echter met dien
      verstande, dat voor deze beide vakken - voor die scholen waar ze als zelfstandig vak worden onderwezen - niet
      bevoegd zijn de bezitters van een bewijs van bekwaamheid, waaraan onderwijsbevoegdheid voor biologie is verbonden,
      dat is opgenomen in een der [onderdelen 3, 4, 5 en 13 van bijlage I][ref1] bij deze regeling, een en ander zoals
      aangegeven in die [bijlage][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003768
      [ref2]: https://wetten.overheid.nl/BWBR0003768
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003768
      - id: ref2
        bwb_id: BWBR0003768
  - number: '10.3'
    text: |-
      Voor het vak "natuur- en scheikunde" is bevoegd de leraar die bevoegd is voor het vak natuurkunde of het vak
      scheikunde, of voor beide vakken.
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel10
  - number: '10.4'
    text: |-
      Voor het onderwijs in de vakken natuur- en scheikunde I en natuur- en scheikunde II is bevoegd de leraar die
      bevoegd is voor het vak natuurkunde of het vak scheikunde, of voor beide vakken.
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel10
  - number: '11.1'
    text: Onder geschiedenis wordt in elk geval mede verstaan het vak “geschiedenis en staatsinrichting”.
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel11
  - number: '11.2'
    text: |-
      Voor het vak “geschiedenis en aardrijkskunde” is bevoegd de leraar die bevoegd is voor het vak geschiedenis of het
      vak aardrijkskunde, of voor beide vakken.
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel11
  - number: 11a.1
    text: |-
      Zonder daardoor afbreuk te doen aan het bepaalde onder nummer 16.16 in bijlage I van deze regeling is bovendien
      bevoegd voor het vak culturele en kunstzinnige vorming 1 hij die bevoegd is voor één van de vakken tekenen,
      handvaardigheid (handenarbeid) of handvaardigheid (textiele werkvormen), muziek, dans, drama, Nederlands,
      kunstgeschiedenis, Latijn en Grieks, moderne vreemde talen en Fries, voor de soorten van onderwijs vallend onder de
      codering 1.
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel11a
  - number: 11a.2
    text: |-
      De in het eerste lid bedoelde bevoegdheid is beperkt tot onderdelen van het vak culturele en kunstzinnige vorming 1
      die aansluiten bij het desbetreffende bewijs van bekwaamheid.
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel11a
  - number: 11b
    text: |-
      Voor het vak klassieke culturele vorming (voorbereidend wetenschappelijk onderwijs) is bevoegd hij die bevoegd is
      voor de vakken Latijn en Grieks.
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel11b
  - number: '12.1'
    text: |-
      Voor de regeling van de bevoegdheid tot het geven van voortgezet onderwijs worden binnen het vak handvaardigheid
      onderscheiden de onderdelen handvaardigheid (handenarbeid) en handvaardigheid (textiele werkvormen), zoals
      aangegeven in [bijlage I][ref1] bij deze regeling. Indien aan een school deze beide onderdelen als geïntegreerd vak
      worden onderwezen, is voor dit vak bevoegd de leraar die bevoegd is voor het vak handvaardigheid (handenarbeid) of
      het vak handvaardigheid (textiele werkvormen), of voor beide vakken.


      [ref1]: https://wetten.overheid.nl/BWBR0003768
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003768
  - number: '12.2'
    text: |-
      Onder drama worden in elk geval mede verstaan de vakken voordrachtskunst, toneelkunst, mime, expressie door woord
      en gebaar, dramatische expressie.
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel12
  - number: '13.1'
    text: Onder huishoudkunde worden in elk geval mede verstaan de vakken zorg voor de woning, de voeding en de kleding.
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel13
  - number: '13.2'
    text: |-
      Zonder daardoor afbreuk te doen aan het voor het overige in deze regeling en de daarbij behorende bijlagen
      bepaalde, worden onder gezondheidskunde mede verstaan de vakken gezondheidszorg en gezondheidsleer. Het vak
      gezondheidsleer wordt, zoals aangegeven in bijlage I bij deze regeling, ook begrepen onder de beroepsgerichte
      vakken op het gebied van de geneeskunde en de diergeneeskunde.
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel13
  - number: '14.1'
    text: Onder maatschappijleer wordt in elk geval mede verstaan het vak maatschappelijke begeleiding.
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel14
  - number: '14.2'
    text: |-
      Zonder daardoor afbreuk te doen aan de bevoegdheid die bezitters van een verklaring afgegeven op grond
      van [artikel 114 van de Overgangswet W.V.O.][ref1] voor dit vak bezitten, is de bevoegdheid voor het vak
      maatschappijleer slechts verbonden aan de desbetreffende in [bijlage I][ref2] genoemde getuigschriften van met
      goed gevolg afgelegd doctoraalexamen indien de bezitter van dat getuigschrift tevens in het bezit is van een
      afzonderlijke verklaring, afgegeven door of namens de subfaculteit der sociaal-culturele wetenschappen of daarmee
      overeenkomende subfaculteit of faculteit, of door of namens de faculteit der landbouwwetenschappen, waaruit blijkt,
      dat voldaan is aan de door deze gestelde vakinhoudelijke vereisten en aan de vereisten van pedagogisch-didactische
      scholing voor dit vak, deze laatste als bedoeld in [artikel 4][ref3]. Aan deze vakinhoudelijke en pedagogisch-
      didactische vereisten kan worden voldaan voor of na het behalen van het getuigschrift van met goed gevolg afgelegd
      doctoraalexamen.


      [ref1]: https://wetten.overheid.nl/BWBR0002595#Artikel114
      [ref2]: https://wetten.overheid.nl/BWBR0003768
      [ref3]: https://wetten.overheid.nl/BWBR0003768#Artikel4
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002595
        artikel: '114'
      - id: ref2
        bwb_id: BWBR0003768
      - id: ref3
        bwb_id: BWBR0003768
        artikel: '4'
  - number: '15'
    text: |-
      Zonder daardoor afbreuk te doen aan de bevoegdheid verbonden aan de specifieke voor dit vak in
      [bijlage I onder nummer 4.4.][ref1] genoemde bewijzen van bekwaamheid is voor het geven van voortgezet onderwijs
      in het vak maatschappelijke- en beroepsvorming bevoegd de leraar die in het bezit is van een bewijs van bekwaamheid
      dat bevoegdheid geeft voor het voorbereidend beroepsonderwijs en aan wie door het bevoegd gezag - met diens
      instemming - lessen in dit vak worden opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0003768
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003768
  - number: 15a.1
    text: |-
      Aan de bewijzen van bekwaamheid, genoemd onder [3.2, 3.3, 3.4, 3.21, 14.1, 14.10, 17.2 en 17.4, in Bijlage I][ref1]
      bij deze regeling, is tevens de bevoegdheid verbonden tot het geven van onderwijs in de vakken Nederlands,
      geschiedenis, aardrijkskunde, maatschappijleer, rekenen en wiskunde, muziek, tekenen, handvaardigheid, lichamelijke
      opvoeding, techniek en verzorging, aan de soorten van onderwijs, vallend onder de codering 2a, indien wordt voldaan
      aan de in het tweede lid genoemde voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0003768
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0003768
  - number: 15a.2
    text: |-
      De bevoegdheid, bedoeld in het eerste lid, geldt voor die vakken waarin in de afgelopen vijf jaren direct
      voorafgaand aan de samenvoeging van de school of afdeling voor svo met een school voor voortgezet onderwijs dan
      wel omzetting van die school of afdeling in een school of afdeling voor praktijkonderwijs of een orthopedagogisch-
      orthodidactisch centrum tenminste vijfhonderd lesuren is lesgegeven. Voor de vakken techniek en verzorging geldt
      bovendien dat de leraar in het bezit is van een individuele bevoegdheidsverklaring voor het vak algemene technieken
      of algemene technieken (techniek), respectievelijk algemene technieken of algemene technieken (verzorging), als
      bedoeld in artikel 3, zesde lid, van de Interimwet voor het speciaal onderwijs en voortgezet speciaal onderwijs. De
      bevoegdheid geldt voor de leerjaren 1 en 2 en voor leerjaar 3 voorzover het betreft vakken van de basisvorming. De
      bevoegdheid geldt voor alle leerjaren indien de vijfhonderd lesuren in het svo zijn gegeven aan leerlingen die zich
      voorbereiden op het eindexamen.
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel15a
  - number: 15a.3
    text: |-
      De leraar, bedoeld in het tweede lid, kan in overeenstemming met het bevoegd gezag van de school of het bestuur
      van het orthopedagogisch-didactisch centrum, afstand doen van de onderwijsbevoegdheid verkregen op grond van dat
      lid. De overeenstemming wordt bereikt voor het tijdstipvan de samenvoeging dan wel omzetting en wordt schriftelijk
      vastgelegd.
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel15a
  - number: 15a.4
    text: |-
      Het tweede en derde lid zijn van overeenkomstige toepassing, indien het betreft een leraar aan een daar bedoelde
      school of afdeling wiens betrekking wordt opgeheven en er geen of nog geen samenvoeging of omzetting heeft
      plaatsgevonden. In dat geval werkt de periode van vijf jaar terug vanaf het moment van opheffing van de betrekking
      en wordt de overeenstemming over het afstand doen bereikt voor het tijdstip van indiensttreding.
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel15a
  - number: 15a.5
    text: |-
      Het tweede en derde lid zijn van overeenkomstige toepassing op gewezen personeel dat op het moment van samenvoeging
      of omzetting niet meer in dienst is van het betreffende bevoegd gezag en in het genot is van een uitkering op grond
      van het Besluit werkloosheid onderwijs- of onderzoekspersoneel of wegens arbeidsongeschiktheid.
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel15a
  - number: 15a.6
    text: |-
      Indien de leraar die in het bezit is van een bewijs van bekwaamheid bedoeld in het eerste lid, in een of meer van
      de vakken biologie, Engels, handvaardigheid (textiele werkvormen) en verzorging heeft lesgegeven zonder in het
      bezit te zijn van de daarvoor vereiste bevoegdheid, kan in overeenstemming tussen de belanghebbende en het bevoegd
      gezag van de school of het bestuur van het orthopedagogischdidactisch centrum hiervoor een onderwijsbevoegdheid
      worden vastgesteld. Het tweede lid en de tweede volzin van het derde lid zijn hierbij van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel15a
  - number: 15a.7
    text: |-
      Indien op grond van de voorgaande leden voor een gewezen directeur of adjunct-directeur geen bevoegdheid voor
      ten minste drie vakken kan worden vastgesteld, kan deze vaststelling plaatsvinden in overeenstemming tussen de
      belanghebbende en het bevoegd gezag van de school of het bestuur van het orthopedagogisch-didactisch centrum.
      Hierbij wordt ook vastgesteld of de bevoegdheid geldt voor het eerste en het tweede leerjaar, en het derde leerjaar
      voor zover het de basisvorming betreft, dan wel voor alle leerjaren.
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel15a
  - number: 15a.8
    text: |-
      Voor de toepassing van dit artikel wordt gebruik gemaakt van de modelverklaring zoals vastgesteld in de bijlage bij
      deze regeling en die door de minister beschikbaar wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel15a
  - number: 15b.1
    text: |-
      Aan de bewijzen van bekwaamheid genoemd onder [3.2, 3.3, 3.4, 3.21, 14.1, 14.10, 17.2 en 17.4 in Bijlage I][ref1]
      bij deze regeling, is de bevoegdheid verbonden tot het geven van onderwijs in de vakken Nederlands, Engels,
      wiskunde, geschiedenis, aardrijkskunde, biologie (incl. kennis der natuur), verzorging, muziek, handvaardigheid
      (textiele werkvormen) en tekenen, in de soorten van onderwijs vallend onder de codering 2a, voor zover dit
      onderwijs wordt gegeven aan groepen van uitsluitend geïndiceerde leerlingen in het leerwegondersteunend onderwijs
      en het praktijkonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0003768
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel15b
    references:
      - id: ref1
        bwb_id: BWBR0003768
  - number: 15b.2
    text: |-
      Aan de bewijzen van bekwaamheid genoemd in het eerste lid is tevens de bevoegdheid verbonden tot het geven van
      onderwijs in de praktijk orië nterende vakken van het praktijkonderwijs.
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel15b
  - number: 15b.3
    text: |-
      Het eerste en tweede lid is van overeenkomstige toepassing op de akten van bekwaamheid genoemd onder 7.1 en 7.2,
      en de getuigschriften hoger beroepsonderwijs van met goed gevolg afgelegd examen in de ten minste vierjarige
      studierichting opleiding tot leraar voortgezet onderwijs van de tweede graad genoemd onder 2.41, 7.3, 7.4 en 8.7,
      indien de bezitter in de afgelopen vijf jaren direct voorafgaand aan de samenvoeging van een school of afdeling
      voor svo met een school voor voortgezet onderwijs dan wel omzetting van die school of afdeling in een school of
      afdeling voor praktijkonderwijs of een orthopedagogisch-didactisch centrum aan de school of afdeling voor svo
      verbonden is geweest.
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel15b
  - number: '16'
    text: |-
      Aan de bewijzen van bekwaamheid genoemd in bijlage IIA bij deze regeling is de bevoegdheid verbonden tot het geven
      van onderwijs aan scholen voor middelbaar dienstverlenings- en gezondheidszorgonderwijs in het vak theorie en
      methoden (van enig werkveld), onder de in die bijlage genoemde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel16
  - number: '17'
    text: |-
      Voor het vak esthetische vorming is bevoegd de leraar die bevoegd is voor een of meer der volgende vakken: tekenen,
      handvaardigheid (handenarbeid), handvaardigheid (textiele werkvormen), textiele werkvormen, muziek, drama, dans,
      kunstgeschiedenis, reclametekenen, etaleren.
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel17
  - number: '18.1'
    text: |-
      De bevoegdheid tot het geven van voortgezet onderwijs geldt, voor in kolom V van [bijlage I][ref1] als zodanig
      aangegeven gevallen, indien de bezitter van het desbetreffende bewijs van bekwaamheid voldoet aan een van de
      volgende voorwaarden: - de bezitter is tussen 1 april 1980 en 1 april 1985 als rector, directeur, conrector,
      adjunct-directeur of leraar verbonden geweest aan een school voor voortgezet onderwijs;
        - de bezitter is tussen 1 april 1975 en 1 april 1980 met recht op enige wettelijke uitkering, ontslagen uit een
      betrekking als rector, directeur, conrector, adjunct-directeur of leraar bij een school voor voortgezet onderwijs;
        - de bezitter is tussen 1 april 1975 en 1 april 1980, zonder recht op enige wettelijke uitkering, ontslagen uit een
      betrekking als rector, directeur, conrector, adjunct-directeur of leraar bij een school voor voortgezet onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0003768
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003768
  - number: '18.2'
    text: |-
      De bevoegdheid heeft, indien het betreft de in het eerste lid onder a. en b. genoemde gevallen, betrekking op alle
      vakken waarvoor het desbetreffende bewijs van bekwaamheid, onder de in kolom V opgenomen voorwaarde, bevoegdheid
      verleent. Indien het betreft het geval in het eerste lid onder c. genoemd, geldt de bevoegdheid slechts indien
      de bezitter van het bewijs van bekwaamheid tussen 1 april 1975 en 1 april 1980 onderwijs heeft gegeven in het
      desbetreffende vak.
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel18
  - number: '18.3'
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing voor de bewijzen van bekwaamheid
      die in [bijlage I][ref1] niet zijn opgenomen, maar waaraan op 31 maart 1985 bij of krachtens de
      [Overgangswet W.V.O.][ref2] bevoegdheid tot het geven van onderwijs was verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0003768
      [ref2]: https://wetten.overheid.nl/BWBR0002595
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003768
      - id: ref2
        bwb_id: BWBR0002595
  - number: '19.1'
    text: |-
      De eerdere beschikkingen krachtens [artikel 108][ref1] en [artikel 110, eerste lid][ref2], en
      [artikel 111, tweede lid, van de Overgangswet W.V.O.][ref3] met de bijbehorende bijlagen worden ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0002595#Artikel108
      [ref2]: https://wetten.overheid.nl/BWBR0002595#Artikel110
      [ref3]: https://wetten.overheid.nl/BWBR0002595#Artikel111
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002595
        artikel: '108'
      - id: ref2
        bwb_id: BWBR0002595
        artikel: '110'
      - id: ref3
        bwb_id: BWBR0002595
        artikel: '111'
  - number: '19.2'
    text: |-
      In afwijking van het in het eerste lid bepaalde blijven van kracht: - de beschikking van 26 april 1973, kenmerk DGO
      1233 (Stcrt. 1973, 110), zoals gewijzigd bij beschikking van 24 maart 1975, kenmerk DGO 1253 (Stcrt. 1975, 64);
        - artikel 1, tweede lid, van de beschikking van 12 oktober 1981, kenmerk DGO 1289 (Stcrt. 1981, 208);
        - de artikelen 2, 4, tweede lid, 5, 6, 7 van de beschikking van 16 april 1984, kenmerk CO 1308 (Stcrt. 1984, 133).
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel19
  - number: '20'
    text: |-
      Deze regeling, die in de Nederlandse Staatscourant zal worden geplaatst, treedt in werking met ingang van 1 april
      1985.
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel20
  - number: '21'
    text: Deze regeling met de bijbehorende bijlagen kan worden aangehaald als “Regeling bewijzen van bekwaamheid O.W.V.O.”.
    url: https://wetten.overheid.nl/BWBR0003768/2002-06-29#Artikel21
