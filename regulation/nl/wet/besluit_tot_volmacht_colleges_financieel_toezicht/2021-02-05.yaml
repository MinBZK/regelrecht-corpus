preamble:
  text: |-
    Gelet op de artikelen 10:3, 10:9 en 10:12 van de Algemene wet bestuursrecht en artikel 4.6, eerste lid, van de
    Comptabiliteitswet 2016;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0044780/2021-02-05#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. *het College:* het College financieel toezicht Curaçao en Sint Maarten, bedoeld in
      [artikel 2, eerste lid, van de Rijkswet financieel toezicht Curaçao en Sint Maarten][ref1] onderscheidenlijk
      het College Aruba financieel toezicht, bedoeld in artikel 2, eerste lid van de Landsverordening Aruba
      Financieel Toezicht en het College financieel toezicht Bonaire, Sint Eustatius en Saba, bedoeld in
      [artikel 2, eerste lid, van de Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba][ref2];

      b. *voorzitter:* voorzitter van het College;

      c. *secretaris:* secretaris van het College.


      [ref1]: https://wetten.overheid.nl/BWBR0028132#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0028151#Artikel2
    url: https://wetten.overheid.nl/BWBR0044780/2021-02-05#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0028132
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0028151
        artikel: '2'
  - number: '2'
    text: |-
      Voor de toepassing van dit besluit en de daarop berustende bepalingen wordt met de verlening van volmacht
      gelijkgesteld de verlening van machtiging.
    url: https://wetten.overheid.nl/BWBR0044780/2021-02-05#Artikel2
  - number: '3'
    text: |-
      1 Aan de voorzitter wordt volmacht verleend voor aangelegenheden op organisatorisch, personeel, financieel en
      materieel gebied.

      2 De volmacht heeft geen betrekking op het aangaan en beëindigen van arbeidsovereenkomsten dan wel het aangaan
      en beëindigen van detacheringsovereenkomsten ten aanzien van medewerkers die aan de secretaris worden toegevoegd
      en het nemen van besluiten met rechtspositionele gevolgen voor medewerkers met salarisschaal 15 of hoger zoals
      neergelegd in de CAO Rijk. De volmacht voor deze aangelegenheden is voorbehouden aan de directeur-generaal
      Koninkrijksrelaties.

      3 De voorzitter is bevoegd ondervolmacht te verlenen aan de secretaris.
    url: https://wetten.overheid.nl/BWBR0044780/2021-02-05#Artikel3
  - number: '4'
    text: |-
      1 Dit besluit treedt in werking met ingang van de dag na datum van uitgifte van de Staatscourant waarin het wordt
      geplaatst.

      2 Besluiten, privaatrechtelijke rechtshandelingen of andere handelingen van de voorzitter onderscheidenlijk de
      secretaris die zijn genomen of verricht in de periode van 1 januari 2018 tot de datum van inwerkingtreding van dit
      besluit, zijn genomen of verricht namens de Minister van Binnenlandse Zaken en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0044780/2021-02-05#Artikel4
  - number: '5'
    text: 'Dit besluit wordt aangehaald als: Besluit tot volmacht Colleges financieel toezicht.'
    url: https://wetten.overheid.nl/BWBR0044780/2021-02-05#Artikel5
