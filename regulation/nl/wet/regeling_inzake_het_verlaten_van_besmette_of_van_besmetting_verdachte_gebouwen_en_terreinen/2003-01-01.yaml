    Gelet op Richtlijn nr. 80/217/EEG van de Raad van de Europese Gemeenschappen van 22 januari 1980 tot vaststelling
    van gemeenschappelijke maatregelen ter bestrijding van klassieke varkenspest (PbEG L 47), Richtlijn nr. 85/511/
    EEG van de Raad van de Europese Gemeenschappen van 18 november 1985 tot vaststelling van gemeenschappelijke
    maatregelen ter bestrijding van mond- en klauwzeer (PbEG L 315), Richtlijn nr. 92/40/EEG van de Raad van de
    Europese Gemeenschappen van 19 mei 1992 tot vaststelling van communautaire maatregelen voor de bestrijding van
    aviaire influenza (PbEG L 167), Richtlijn nr. 92/66/EEG van de Raad van de Europese Gemeenschappen van 14 juli
    1992 tot vaststelling van communautaire maatregelen voor de bestrijding van de ziekte van Newcastle (PbEG L
    260), Richtlijn 92/119/EEG van de Raad van de Europese Gemeenschappen van 17 december 1992 tot vaststelling van
    algemene communautaire maatregelen voor de bestrijding van bepaalde dierziekten en van specifieke maatregelen ten
    aanzien van vesiculaire varkensziekte (PbEG 1993, L 62) en Richtlijn nr. 93/53/EEG van de Raad van de Europese
    Gemeenschappen van 24 juni 1993 tot vaststelling van minimale communautaire maatregelen voor de bestrijding van
    bepaalde visziekten (PbEG L 175);

    Gelet op artikel 26, eerste lid, van de Gezondheids- en welzijnswet voor dieren;

    Gezien het advies van de Raad voor dierenaangelegenheden, het Landbouwschap, het Produktschap Vee en Vlees,
    het Produktschap voor Pluimvee en Eieren, het Produktschap voor Vis en Visprodukten, het Bedrijfschap voor de
    Pluimveehandel en- industrie en het Bedrijfschap voor de Handel in Vee;

