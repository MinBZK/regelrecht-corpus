    text: |-
      In deze regeling wordt verstaan onder wet: [Gezondheids- en welzijnswet voor dieren][ref1].




              *Wet:*


              [Gezondheids- en welzijnswet voor dieren][ref2];




              *ambtenaar:*


              ambtenaar als bedoeld in [artikel 114, tweede lid, van de wet][ref3].


