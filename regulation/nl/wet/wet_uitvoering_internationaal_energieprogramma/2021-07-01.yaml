        paragraaf: '3'
  - number: '8'
    text: |-
      Ingeval een op Nederland rustende verplichting als bedoeld in [artikel 3, eerste lid][ref1], wordt ingetrokken
      of vervalt, dan wel hoofdstuk III van de Overeenkomst buiten werking is gesteld, blijven de krachtens
      [artikel 3, eerste lid][ref2], gegeven opdrachten, alsmede de daarmede in verband staande bevoegdheden en
      verplichtingen ingevolge deze wet van kracht, behoudens voor zover Onze Minister, al dan niet op verzoek van
      degene, tot wie een opdracht is gericht, anders bepaalt.


      [ref1]: https://wetten.overheid.nl/BWBR0003235#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003235#Artikel3
