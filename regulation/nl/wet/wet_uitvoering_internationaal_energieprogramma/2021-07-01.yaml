        artikel: '3'
        paragraaf: '3'
  - number: '10'
    text: |-
      1 Natuurlijke personen en rechtspersonen, behorende tot de krachtens het tweede lid aangewezen categorieën, zijn
      verplicht, met inachtneming van de door Onze Minister te stellen regels, Onze Minister schriftelijk gegevens te
      verstrekken of stukken over te leggen betreffende de krachtens het derde lid aangewezen onderwerpen.

      2 Onze Minister wijst een of meer van de hierna volgende categorieën natuurlijke personen of rechtspersonen aan,
      waarvoor de verplichting, bedoeld in het eerste lid, geldt. Het betreft natuurlijke personen of rechtspersonen, die
      in de uitoefening van een bedrijf:

      a. aardolieprodukten op de binnenlandse markt verhandelen,

      b. aardolieprodukten in Nederland be- of verwerken, dan wel doen be- of verwerken,

      c. aardolieprodukten invoeren,

      d. aardolieprodukten uitvoeren,

      e. aardolieprodukten binnen Nederland brengen zonder deze onmiddellijk in te voeren,

      f. niet uit het vrije verkeer afkomstige aardolieprodukten buiten Nederland brengen,

      g. aardolieprodukten in Nederland voor zichzelf of voor derden in opslag hebben, dan wel

      h. een in Nederland gelegen buisleiding voor het vervoeren van aardolieprodukten exploiteren.

      3 Onze Minister wijst een of meer van de hierna volgende gegevens en stukken aan, waarop de verplichting, bedoeld
      in het eerste lid, betrekking heeft. Het betreft gegevens en stukken inzake:

      a. de in het tweede lid, onder *a*-*g*, bedoelde handelingen, zomede het vervoeren van aardolieprodukten door een
      buisleiding;

      b. de winning van ruwe aardolie zowel binnen als buiten Nederland;

      c. de toebedeling en de voorwaarden van toebedeling van aardolieprodukten aan afnemers;

      d. de voorwaarden van verwerving van aardolieprodukten;

      e. de kostprijs en de bestanddelen daarvan van aardolieprodukten;

      f. de structuur van de onderneming en van de groep van ondernemingen waartoe deze behoort;

      g. de financiële structuur, met inbegrip van balansen, verlies- en winstrekeningen en betaalde belastingen van
      de onderneming;

      h. de gedane alsmede de voorgenomen investeringen;

      i. onderwerpen vastgesteld krachtens artikel 27, eerste lid, onder *j*, of artikel 33, onder *f*, van de
      Overeenkomst, alsmede onderwerpen, de beschikbaarheid en voorwaarden van beschikbaarheid van aardolieprodukten
      betreffende, ten aanzien waarvan voor Nederland op grond van een internationale overeenkomst of een besluit van een
      volkenrechtelijke organisatie een verplichting bestaat gegevens te verstrekken.

      4 De ingevolge het eerste lid te stellen regels hebben in ieder geval betrekking op:

      a. de aard van de te verstrekken gegevens en van de over te leggen stukken;

      b. de tijdvakken of de tijdstippen waarop de gegevens of de stukken betrekking dienen te hebben;

      c. de termijn waarbinnen aan de verplichting moet worden voldaan.
    url: https://wetten.overheid.nl/BWBR0003235/2021-07-01#Artikel10
