  - number: '5'
    text: |-
      1 Indien in een opdracht als bedoeld in [artikel 3, eerste lid][ref1], een natuurlijke persoon of een rechtspersoon
      is aangewezen, aan wie geleverd moet worden, is de Staat mede aansprakelijk voor de nakoming van de financiële
      verplichtingen, die voor de aangewezen natuurlijke persoon of rechtspersoon tegenover degene, tot wie de opdracht
      is gericht, voortvloeien uit de opgedragen levering.

      2 In de overige gevallen kan Onze Minister op met redenen omkleed verzoek van degene, tot wie een opdracht is
      gericht, verklaren, dat de Staat medeaansprakelijk is voor de nakoming van de financiële verplichtingen, die voor
      degene, aan wie de verzoeker zal leveren, tegenover deze voortvloeien uit de opgedragen levering, indien naar zijn
      oordeel onvoldoende zekerheid bestaat, dat deze verplichtingen zullen worden nagekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003235#Artikel3
    url: https://wetten.overheid.nl/BWBR0003235/2021-07-01#Artikel5
    references:
