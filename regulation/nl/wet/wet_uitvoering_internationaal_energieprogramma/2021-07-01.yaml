        artikel: '3'
        paragraaf: '3'
  - number: '6'
    text: |-
      1 Onze Minister kan in een geval als bedoeld in [artikel 3, eerste lid][ref1], indien zulks naar zijn oordeel
      ter verwezenlijking van een van de in dat artikellid vermelde doeleinden is vereist, het eigendomsrecht op
      aardolieprodukten vorderen.

      2 De vordering geschiedt ten behoeve van de Staat, dan wel een andere rechtspersoon of een natuurlijke persoon.

      3 In vorderingsbeschikkingen kan aan daarbij aangewezen personen de verplichting worden opgelegd, om, voor zover
      hun dat feitelijk en rechtens mogelijk is, op de daarbij aangegeven plaats en tijd aan degene, te wiens behoeve de
      vordering geschiedt, de feitelijke mogelijkheid tot uitoefening van het gevorderde recht te verschaffen.

      4 De [artikelen 4][ref2], [5, tweede lid][ref3], [8][ref4], [9, eerste, tweede en derde lid][ref5],
      [10][ref6], [11][ref7], [13][ref8], [15, eerste en derde lid][ref9], [16][ref10] en
      [31, eerste lid, van de Vorderingswet][ref11] zijn van overeenkomstige toepassing.

      5 De schadeloosstelling wordt vastgesteld met toepassing van hetgeen bij of ter uitvoering van de Overeenkomst is
      bepaald met betrekking tot de prijs voor toebedeelde aardolieprodukten.

      6 De vaststelling van het bedrag van de schadeloosstelling, te betalen aan rechthebbenden met wie daarover geen
      overeenstemming is bereikt of die niet aan het overleg hebben deelgenomen, geschiedt door de rechtbank Rotterdam.

      7 [Artikel 18 van de Vorderingswet][ref12] is van overeenkomstige toepassing.


