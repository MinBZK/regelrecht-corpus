  - number: '22'
    text: |-
      Buiten de gevallen, bedoeld in [artikel 12][ref1], wordt informatie, verkregen op grond van deze wet, voor zover
      deze betrekking heeft op afzonderlijke natuurlijke personen of rechtspersonen, dan wel daaruit gevolgtrekkingen ten
      aanzien van zodanige personen kunnen worden gemaakt, zonder toestemming van die personen niet verstrekt aan anderen
      dan degenen, die belast zijn met de uitvoering van een of meer bepalingen van deze wet.


