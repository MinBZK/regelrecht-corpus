preamble:
  text: |-
    Wij Juliana, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regelen te stellen ten einde te kunnen voldoen aan
    de verplichtingen, welke voor Nederland voortvloeien uit de op 18 november 1974 te Parijs tot stand gekomen
    Overeenkomst inzake een Internationaal Energieprogramma (Trb. 1975, 47), en enige verdere voorzieningen te treffen
    met name inzake het verwerven van gegevens betreffende de oliemarkt;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003235/2021-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      *Overeenkomst:* de op 18 november 1974 te Parijs tot stand gekomen Overeenkomst inzake een Internationaal
      Energieprogramma (*Trb.* 1975, 47);

      *aardolieprodukten:* de produkten bedoeld in artikel 9, eerste lid, van de Overeenkomst;

      *invoeren:* het brengen in het vrije verkeer;

      *uitvoeren:* het brengen buiten het vrije verkeer;

      *Onze Minister:* Onze Minister van Economische Zaken en Klimaat.
    url: https://wetten.overheid.nl/BWBR0003235/2021-07-01#Artikel1
  - number: '2'
    text: |-
      1 Ingeval overeenkomstig hoofdstuk IV van de Overeenkomst maatregelen in werking worden gesteld, kan door Ons
      met toepassing van het bepaalde in [artikel 24, tweede, zesde en zevende lid, van de Distributiewet][ref1] worden
      bepaald, dat de in het tweede lid van dat artikel bedoelde artikelen van die wet in werking treden ten aanzien
      van aardolieprodukten.

      2 [Artikel 24, derde lid, van de Distributiewet][ref2] is niet van toepassing ten aanzien van een besluit, genomen
      overeenkomstig het eerste lid.

      3 Indien overeenkomstig het bepaalde in het eerste lid de in [artikel 24, tweede lid, van de Distributiewet][ref3]
      bedoelde artikelen in werking zijn getreden, kunnen met gebruikmaking van de bij die wet verleende bevoegdheden de
      maatregelen ter beperking van de vraag naar aardolieprodukten, bedoeld in hoofdstuk IV van de Overeenkomst, worden
      genomen.

      4 Het in de voorgaande leden bepaalde is van overeenkomstige toepassing ingeval een verplichting tot beperking
      van de vraag naar aardolieprodukten voor Nederland voortvloeit uit een besluit van een orgaan van de Europese
      Gemeenschappen of een besluit van een ingevolge de Overeenkomst ingesteld orgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001997#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0001997#Artikel24
