    text: |-
      1 Onze Minister kan van het krachtens [artikel 10][ref1] bepaalde op daartoe strekkend verzoek ontheffing verlenen.

      2 Een ontheffing kan onder beperkingen worden verleend. Aan een ontheffing kunnen voorschriften worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0003235#Artikel10
