  - number: '9'
    text: |-
      Het in de [artikelen 3-8][ref1] bepaalde is van overeenkomstige toepassing ingeval een verplichting tot toebedeling
      van aardolieprodukten aan één of meer andere Lid-Staten van de Europese Gemeenschappen voor Nederland voortvloeit
      uit een besluit van een orgaan van de Europese Gemeenschappen of een besluit van een ingevolge de Overeenkomst
      ingesteld orgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003235#Artikel3
    url: https://wetten.overheid.nl/BWBR0003235/2021-07-01#Artikel9
