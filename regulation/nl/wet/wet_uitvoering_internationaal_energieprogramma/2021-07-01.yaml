  - number: '3'
    text: |-
      1 Ingeval overeenkomstig hoofdstuk IV van de Overeenkomst hoofdstuk III van de Overeenkomst in werking is gesteld,
      kan Onze Minister met het oog op de nakoming van een op Nederland rustende verplichting tot toebedeling van
      aardolieprodukten als bedoeld in hoofdstuk III van de Overeenkomst, dan wel in het belang van een evenwichtige
      verdeling van aardolieprodukten over de in Nederland werkzame producenten van en handelaren in die produkten aan
      een zodanige producent of handelaar opdragen een door hem vastgestelde hoeveelheid aardolieprodukten van een door
      hem aangegeven soort aan een of meer anderen te leveren.

      2 Een opdracht als bedoeld in het eerste lid kan inhouden:

      a. het land of de plaats waar de levering dient te geschieden;

      b. de natuurlijke persoon of de rechtspersoon, aan wie geleverd moet worden;

      c. de verplichting om Onze Minister binnen een daarbij te stellen termijn mededeling te doen van de maatregelen die
      zijn genomen en zullen worden genomen ter voldoening aan de opdracht;

      d. de termijn, waarbinnen de levering dient te geschieden;

      e. bepalingen omtrent de leveringsvoorwaarden.

      3 Bij de vaststelling op grond van het tweede lid, onder *e*, van een prijs, waartegen geleverd moet worden is
      van toepassing hetgeen bij of ter uitvoering van de Overeenkomst is bepaald met betrekking tot de prijs voor
      toebedeelde aardolieprodukten.

      4 Degene, tot wie een opdracht als bedoeld in het eerste lid is gericht, wordt geacht daaraan te hebben voldaan,
      indien hij aantoont, dat hij de nodige aanbiedingen heeft gedaan en ook overigens al het redelijkerwijs mogelijke
      heeft verricht ten einde aan de opdracht te voldoen en dat het niet uitvoeren van de opdracht niet aan hem te
      wijten is.
    url: https://wetten.overheid.nl/BWBR0003235/2021-07-01#Artikel3
  - number: '4'
    text: |-
      Onze Minister kan een opdracht als bedoeld in [artikel 3, eerste lid][ref1], al dan niet op verzoek van degene tot
      wie die opdracht is gericht, wijzigen of intrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0003235#Artikel3
    url: https://wetten.overheid.nl/BWBR0003235/2021-07-01#Artikel4
