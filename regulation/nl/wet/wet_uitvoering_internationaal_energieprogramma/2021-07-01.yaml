  - number: '7'
    text: |-
      Terstond nadat de Staat het eigendomsrecht op aardolieprodukten, welke met het oog op de nakoming van een op
      Nederland rustende verplichting als bedoeld in [artikel 3, eerste lid][ref1], zijn gevorderd, heeft verkregen,
      neemt Onze Minister de nodige maatregelen ten einde aan die verplichting te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0003235#Artikel3
    url: https://wetten.overheid.nl/BWBR0003235/2021-07-01#Artikel7
