  - number: '12'
    text: |-
      1 Onze Minister is bevoegd de gegevens en stukken, die door hem op grond van [artikel 10][ref1] of enige andere
      wettelijke regeling zijn verkregen, ter beschikking te stellen van het Secretariaat bedoeld in artikel 59 van de
      Overeenkomst, voor zover zulks ter voldoening aan artikel 27, 32 of 33 van de Overeenkomst is vereist.

      2 Onze Minister is voorts bevoegd de gegevens of stukken, de beschikbaarheid of voorwaarden van beschikbaarheid
      van aardolieprodukten betreffende, die door hem op grond van [artikel 10][ref2] of enige andere wettelijke regeling
      zijn verkregen, ter beschikking te stellen van enig ander volkenrechtelijk orgaan, voor zover zulks ter voldoening
      aan een op Nederland rustende verplichting ingevolge een andere internationale overeenkomst of een besluit van een
      volkenrechtelijke organisatie is vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0003235#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003235#Artikel10
