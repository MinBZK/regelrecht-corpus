  - number: '16'
    text: |-
      1 Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de
      bij besluit van Onze Minister aangewezen ambtenaren. De [artikelen 5:13][ref1] tot en met
      [5:20, eerste en tweede lid, van de Algemene wet bestuursrecht][ref2] zijn van overeenkomstige toepassing
      ten aanzien van de bij besluit van Onze Minister aangewezen ambtenaren die zijn belast met de uitvoering van
      [paragraaf 3][ref3] van deze wet.

      2 Onze Minister is bevoegd tot overeenkomstige toepassing van
      [artikel 5:20, derde lid, van de Algemene wet bestuursrecht][ref4] ten aanzien van de in het eerste lid bedoelde
      aangewezen ambtenaren die zijn belast met de uitvoering van [paragraaf 3][ref5] van deze wet.

      3 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de *Staatscourant*.


