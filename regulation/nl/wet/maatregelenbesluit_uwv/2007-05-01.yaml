  - number: '12'
    text: |-
      1 Een tijdelijk gedeeltelijke weigering als maatregel, bedoeld in de [artikelen 3 tot en met 7][ref1], wordt:

      a. bij de [ZW][ref2] gerealiseerd door het uitkeringspercentage van 70, bedoeld in [artikel 29, zesde lid][ref3]
      en [29b, tweede lid, van de ZW][ref4], te korten met het aantal procentpunten van de maatregel, en de
      uitkering, bedoeld in de artikelen [29, zevende lid][ref5], [29a][ref6], en [29b, derde lid, van de ZW][ref7]
      met het percentage van de maatregel, met dien verstande dat, indien de uitkering met toepassing van
      [artikel 31 van de ZW][ref8] gedeeltelijk niet tot uitbetaling komt, de korting wordt vermenigvuldigd met een
      breuk, waarvan de teller wordt gevormd door het bedrag dat van de uitkering wordt betaald, en de noemer door het
      bedrag van de uitkering;

      b. bij de [WW][ref9] gerealiseerd door de uitkeringspercentages, bedoeld in het eerste lid van
      de[ artikelen 47][ref10], [51][ref11], [52][ref12] en [52i van de WW][ref13], te korten met het aantal
      procentpunten van de maatregel en de uitkering, bedoeld in [artikel 64 van de WW][ref14], met het percentage van
      de maatregel;

      c. bij de [WAO][ref15], de [WAZ][ref16] en de [Wajong][ref17] gerealiseerd door het percentage van de maatregel te
      vermenigvuldigen met de factor: uitkeringspercentage, bedoeld in de [artikelen 21, tweede lid van de WAO][ref18],
      [9, eerste lid][ref19] en [24, derde lid, van de WAZ][ref20] en [8, eerste lid, van de Wajong][ref21],
      of het uitkeringspercentage, zoals vastgesteld na toepassing van de [artikelen 44 van de WAO][ref22],
      [58 van de WAZ][ref23] en [50 van de Wajong][ref24], gedeeld door 70. Het hiervoor bedoelde
      uitkeringspercentage wordt verminderd met het berekende percentage. De verhoging van de uitkering, bedoeld in de
      [artikelen 22, eerste lid, van de WAO][ref25], [10 van de WAZ][ref26] en [9 van de Wajong][ref27], blijft bij de
      realisering van de maatregel buiten beschouwing;

      d. bij de [TW][ref28] gerealiseerd door het bedrag aan toeslag, waarop ingevolge de [artikelen 8][ref29] en
      [10 van de TW][ref30] recht bestaat, te korten met het percentage van de maatregel;

      e. bij de [Wet WIA ][ref31]gerealiseerd door het uitkeringsbedrag te korten met het percentage van de maatregel,
      waarbij een verhoging als bedoeld in de [artikelen 53][ref32] en [63 van de Wet WIA][ref33] buiten beschouwing
      blijft.

      2 Indien in het dagloon waarnaar de uitkering is berekend de waarde van een vakantiebon of daarmee overeenkomende
      aanspraken, bestemd voor vakantie-, feest- en/of snipperdagen, is opgenomen, wordt voordat toepassing wordt gegeven
      aan het eerste lid het dagloon verminderd met de waarde van de vakantiebon of de daarmee overeenkomende aanspraken
      en vermeerderd met het voor de verzekerde geldende vakantiebijslagpercentage.


