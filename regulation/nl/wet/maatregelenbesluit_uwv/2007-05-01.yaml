  - number: '10'
    text: |-
      1 Indien als gevolg van de samenvoeging, genoemd in [artikel 8, eerste lid][ref1] of van de verhoging, genoemd in
      [artikel 9, eerste lid][ref2], de maatregel meer dan 30% bedraagt, wordt de hoogte van de maatregel gesteld op 30%
      en de duur ervan verlengd met een zodanige periode dat daarmee de volledige samenvoeging dan wel de verhoging wordt
      gerealiseerd.

      2 Indien op grond van [artikel 27, eerste lid, van de WW][ref3], het uitkeringspercentage wordt verlaagd naar 35
      én de verzekerde een maatregel op grond van dit besluit wordt opgelegd, wordt eerst de eerstgenoemde maatregel
      gerealiseerd en aansluitend de maatregel op grond van dit besluit.

      3 In afwijking van het tweede lid, wordt eerst de maatregel op grond van dit besluit gerealiseerd indien deze
      maatregel een tijdelijk gehele of blijvend gehele weigering van de uitkering betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0017084#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0017084#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel27
