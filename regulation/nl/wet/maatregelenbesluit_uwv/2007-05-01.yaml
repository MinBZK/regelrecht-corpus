  - number: '7'
    text: |-
      1 De hoogte en de duur van de maatregel bedragen bij het niet of niet behoorlijk nakomen van de verplichting
      opgenomen in:

      a. de vijfde categorie, ten 1° van de [ZW][ref1], de [Wet WIA][ref2], de [WAZ][ref3], de [Wajong][ref4] en de
      [WAO][ref5] alsmede de vijfde categorie, ten 6° van de [WW][ref6], voor zover deze laatste verplichting betrekking
      heeft op de verplichting genoemd in de vijfde categorie, ten 1°, van de [ZW][ref7] blijvend gehele weigering van
      de uitkering;

      b. de vijfde categorie, ten 2° van de [ZW][ref8] en ten 1° van de [WW][ref9] alsmede de vijfde categorie, ten 6°
      van de [WW][ref10], voor zover deze laatste verplichting betrekking heeft op de verplichting genoemd in de vijfde
      categorie, ten 2°, van de [ZW][ref11], de gehele uitkering voor de duur dat de verzekerde aanspraak op loon zou
      hebben kunnen doen gelden, dan wel de dienstbetrekking zou hebben kunnen voortduren;

      c. de vijfde categorie, ten 2°, 3° en 4° van de [WW][ref12]: dat deel van de uitkering dat niet tot uitbetaling zou
      komen, indien de verzekerde de bedoelde benadelingshandeling had nagelaten;

      d. de vijfde categorie, ten 3° van de [ZW][ref13] en ten 5° van de [WW][ref14] alsmede de vijfde categorie, ten 6°
      van de [WW][ref15], voor zover deze laatste verplichting betrekking heeft op de verplichting genoemd in de vijfde
      categorie, ten 3°, van de [ZW][ref16], afhankelijk van de ernst van de gedraging of nalatigheid van de verzekerde:

      1° 20% gedurende 16 weken,

      2° 30% gedurende 26 weken,

      3° de gehele uitkering over de volledige of resterende uitkeringsduur;

      e. de vijfde categorie, ten 2°, van de [Wet WIA][ref17]: de gehele uitkering voor de duur dat de
      dienstbetrekking zou hebben kunnen voortduren, doch ten hoogste voor de duur van het tijdvak, bedoeld in
      [artikel 25, negende lid, van de Wet WIA][ref18];

      f. de vijfde categorie, ten 3° en ten 4°, van de [Wet WIA][ref19]: dat deel van de uitkering dat niet tot
      uitbetaling zou komen indien de verzekerde de bedoelde verplichting wel zou zijn nagekomen.

      2 Indien de mate van verwijtbaarheid van de gedraging of nalatigheid van de verzekerde daartoe aanleiding geeft,
      bedragen de hoogte en de duur van de maatregel:

      a. bedoeld in het eerste lid, onder a: 30% gedurende 26 weken;

      b. bedoeld in het eerste lid, onder b: 30% gedurende de daar bedoelde termijn;

      c. bedoeld in het eerste lid, onder c: 30% van het daar bedoelde deel van de uitkering;

      d. bedoeld in het eerste lid, onder d, ten 1°: 10% gedurende 16 weken;

      e. bedoeld in het eerste lid, onder d, ten 2°: 20% gedurende 16 weken;

      f. bedoeld in het eerste lid, onder d, ten 3°: 30% gedurende 26 weken;

      g. bedoeld in het eerste lid, onder e: 30% gedurende de daar bedoelde termijn;

      h. bedoeld in het eerste lid, onder f: 30% van het daar bedoelde deel van de uitkering.


