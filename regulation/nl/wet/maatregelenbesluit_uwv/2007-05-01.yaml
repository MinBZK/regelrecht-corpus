preamble:
  text: |-
    Gelet op de artikelen 45, zesde lid, van de Ziektewet, 47, vijfde lid, van de Wet arbeidsongeschiktheidsverzekering
    zelfstandigen, 39, vijfde lid, van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten, 29, vijfde lid,
    van de Wet op de arbeidsongeschiktheidsverzekering, 27, , negende lid, van de Werkloosheidswet, 14, zesde lid, van
    de Toeslagenwet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0017084/2007-05-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. UWV: Uitvoeringsinstituut werknemersverzekeringen;

      b. CWI: Centrale organisatie werk en inkomen;

      c. ZW: [Ziektewet][ref1];

      d. WAZ: [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref2];

      e. Wajong: [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref3];

      f. WAO: [Wet op de arbeidsongeschiktheidsverzekering][ref4];

      g. WW: [Werkloosheidswet][ref5];

      h. TW: [Toeslagenwet][ref6];

      i. Wazo: [Wet arbeid en zorg][ref7];

      j. Wet SUWI: [Wet structuur uitvoeringsorganisatie werk en inkomen][ref8];

      k. Wet WIA: [Wet werk en inkomen naar arbeidsvermogen][ref9];

      l. WGA-uitkering: werkhervattingsuitkering gedeeltelijk arbeidsgeschikten, bedoeld in
      [hoofdstuk 7 van de Wet WIA][ref10];

      m. plan van aanpak: het plan van aanpak, bedoeld in [artikel 26, eerste lid van de Wet WIA][ref11];

      n. reïntegratievisie: de reïntegratievisie, bedoeld in [artikel 30a, eerste lid, van de Wet SUWI][ref12];

      o. reïntegratieplan: het reïntegratieplan, bedoeld in [artikel 30a, derde lid, van de Wet SUWI][ref13];

      p. maatregel: weigering van de uitkering als bedoeld in de [artikelen 45, eerste lid, van de ZW][ref14],
      [88 van de Wet WIA][ref15], [45][ref16] en [46 van de WAZ][ref17], [37][ref18] en [38 van de Wajong][ref19],
      [25][ref20] en [28 van de WAO][ref21], [27, derde en vierde lid van de WW][ref22] en een weigering van de toeslag
      als bedoeld in [artikel 14, eerste lid, van de TW][ref23];

      q. verzekerde: de persoon bedoeld in de [artikelen 3 tot en met 8a][ref24] en [64 van de ZW][ref25],
      [7][ref26], [10][ref27] en[ 18 van de Wet WIA][ref28], [3 van de WAZ][ref29], [3 van de Wajong][ref30],
      [3 tot en met 7b][ref31] juncto [23, eerste lid][ref32], en [81 van de WAO][ref33], de werknemer bedoeld in de
      [artikelen 3 tot en met 8][ref34] en [53 van de WW][ref35], degene die aanspraak maakt op toeslag ingevolge de
      [TW][ref36], zijn echtgenoot of zijn wettelijke vertegenwoordiger, de werknemer en de gelijkgestelde bedoeld
      in [artikel 3:6 van de Wazo][ref37] en de zelfstandige en beroepsbeoefenaar op arbeidsovereenkomst bedoeld in
      [artikel 3:17 van de Wazo][ref38].


