  - number: '8'
    text: |-
      1 Indien de verzekerde per wet twee of meer verplichtingen niet of niet behoorlijk nakomt en indien het niet
      nakomen van deze verplichtingen niet voortkomt uit één oorzaak worden de bij deze verplichtingen na toepassing van
      dit besluit vastgestelde maatregelen samengevoegd en zoveel mogelijk gelijktijdig gerealiseerd.

      2 Indien de verzekerde per wet twee of meer verplichtingen niet of niet behoorlijk nakomt en indien het niet
      nakomen van deze verplichtingen voortkomt uit één oorzaak wordt één maatregel toegepast overeenkomend met de
      zwaarste van de bij deze verplichtingen na toepassing van dit besluit vastgestelde maatregelen.

      3 Indien de verzekerde ter zake van zijn ingetreden werkloosheid meer dan één verplichting opgenomen in de eerste
      categorie, ten 1°, 2° en 3° van de [WW][ref1], niet of niet behoorlijk is nagekomen en tussen de nakoming van deze
      verplichtingen niet meer dan zeven kalenderdagen zijn gelegen, wordt aan de overtreding van genoemde verplichtingen
      één oorzaak ten grondslag gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0017084/2007-05-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '9'
    text: |-
      1 Indien aan de verzekerde schriftelijk is bekendgemaakt dat hem wegens het niet of niet behoorlijk nakomen van
      een verplichting een maatregel is opgelegd, en hij binnen twee jaren na de dag van deze bekendmaking opnieuw
      dezelfde verplichting niet of niet behoorlijk is nagekomen, wordt het percentage van de maatregel, bedoeld in de
      [artikelen 3 tot en met 7][ref1], met de helft daarvan verhoogd.

      2 Indien na de schriftelijke bekendmaking dat een maatregel is opgelegd ter zake van het niet of niet behoorlijk
      nakomen van de verplichting, opgenomen in de vierde categorie, ten 1°, van de [WW][ref2], dezelfde verplichting
      binnen 12 maanden voor de derde maal niet is nagekomen, wordt de gehele uitkering over de resterende duur
      geweigerd.

      3 Voor de toepassing van het bepaalde in het eerste lid worden de verplichtingen op grond van
      [artikel 27, vierde lid, van de WW][ref3] geacht dezelfde verplichtingen te zijn als de dienovereenkomstige
      verplichtingen op grond van [artikel 45 ZW][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0017084#Artikel3
