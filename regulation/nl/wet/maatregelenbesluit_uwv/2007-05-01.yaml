  - number: '6'
    text: |-
      1 De hoogte en de duur van de maatregel bedragen bij het niet of niet behoorlijk nakomen van een verplichting
      opgenomen in de vierde categorie van de [ZW][ref1], de [Wet WIA][ref2], de [WAZ][ref3], de [Wajong][ref4], de
      [WAO][ref5] en de [WW][ref6]: 20% gedurende 16 weken.

      2 Indien de mate van verwijtbaarheid van de gedraging of nalatigheid van de verzekerde daartoe aanleiding geeft,
      bedraagt de hoogte van de maatregel, bedoeld in het eerste lid: 10%.

      3 In afwijking van het eerste respectievelijk tweede lid, bedragen de hoogte en de duur van de maatregel bij het
      niet of niet behoorlijk nakomen van de verplichting opgenomen in de vierde categorie, ten 3°, van de [WW][ref7]:

      a. 10% gedurende 16 weken, respectievelijk 5% gedurende 16 weken, indien de verzekerde onvoldoende meewerkt aan het
      bereiken van een gunstig scholingsresultaat, zodat vertraging in de opleiding of scholing is ontstaan;

      b. 30% gedurende 16 weken, respectievelijk 10% gedurende 16 weken, indien het een opleiding of scholing betreft die
      baanzekerheid geeft en de verzekerde deze opleiding of scholing niet aanvangt of heeft afgebroken;

      c. gehele weigering van de uitkering over de volledige of resterende duur indien het een opleiding of scholing
      betreft die baanzekerheid geeft en de verzekerde volhardt in het niet of niet behoorlijk nakomen van deze
      verplichting;

      d. gehele weigering van de uitkering over de volledige of resterende duur indien de verzekerde volhardt in
      het niet of niet behoorlijk nakomen van de verplichting beschikbaar te zijn voor de voorzieningen, bedoeld in
      [artikel 7, eerste lid, onderdeel a, van de Wet werk en bijstand][ref8] en mee te werken aan het verkrijgen van
      die voorzieningen.

      4 In afwijking van het eerste respectievelijk tweede lid, bedragen de hoogte en de duur van de maatregel
      bij het niet of niet behoorlijk nakomen van de verplichting opgenomen in de vierde categorie, ten 4°, van de
      [WAO][ref9], [WAZ][ref10] en [Wajong][ref11], de verplichting opgenomen in de vierde categorie, ten 5°, van de
      [Ziektewet][ref12] en de verplichting opgenomen in de vierde categorie, ten 6° van de [WW][ref13], voor zover
      deze laatste verplichting betrekking heeft op de verplichting genoemd in de vierde categorie, ten 5°, van de
      [Ziektewet][ref14]:

      a. 10% gedurende 16 weken, respectievelijk 5% gedurende 16 weken, indien de verzekerde onvoldoende meewerkt aan
      het bereiken van een gunstig scholingsresultaat, zodat vertraging in de opleiding of scholing die wenselijk wordt
      geacht voor zijn inschakeling in de arbeid, is ontstaan;

      b. 30% gedurende 16 weken, respectievelijk 10% gedurende 16 weken, indien het een opleiding of scholing betreft die
      baanzekerheid geeft en de verzekerde deze opleiding of scholing die wenselijk wordt geacht voor zijn inschakeling
      in de arbeid, niet aanvangt of heeft afgebroken;

      c. gehele weigering van de uitkering over de volledige of resterende duur indien het een opleiding of scholing
      betreft die baanzekerheid geeft en de verzekerde volhardt in het niet of niet behoorlijk nakomen van deze
      verplichting.

      5 Onder baanzekerheid als bedoeld in het derde en vierde lid wordt verstaan een baangarantie of een zodanige kans
      op een baan, na afronding van de opleiding of scholing, dat deze gelijk te stellen is met een baangarantie.

      6 In afwijking van het eerste respectievelijk tweede lid, bedragen de hoogte en de duur van de maatregel een
      blijvend gehele weigering van de uitkering indien de verzekerde volhardt in het niet of niet behoorlijk nakomen
      van de verplichting opgenomen in de vierde categorie, ten 1°, van de [WAO][ref15], de [WAZ][ref16] en de
      [Wajong][ref17].


