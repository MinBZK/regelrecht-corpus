  - number: '2'
    text: |-
      Per wet wordt een maatregel opgelegd met inachtneming van dit besluit. De verplichtingen, waarop een maatregel van
      toepassing is, zijn per wet ingedeeld in categorieën en opgenomen in de bijlage bij dit besluit.
    url: https://wetten.overheid.nl/BWBR0017084/2007-05-01#Artikel2
  - number: '3'
    text: |-
      1 Tenzij volstaan wordt met een waarschuwing, bedragen de hoogte en de duur van de maatregel bij het niet of niet
      behoorlijk nakomen van een verplichting opgenomen in de eerste categorie van de [ZW][ref1], respectievelijk de
      [Wet WIA][ref2], de [WAZ][ref3], de [Wajong][ref4], de [WAO][ref5], de [WW][ref6] en de [TW][ref7]:

      a. 5% over de te late termijn, indien het gestelde tijdstip met niet meer dan 7, respectievelijk 56 kalenderdagen
      wordt overschreden;

      b. 10% over de te late termijn, indien het gestelde tijdstip met meer dan 7, respectievelijk 56 kalenderdagen, doch
      niet meer dan 28, respectievelijk 112 kalenderdagen wordt overschreden;

      c. 20% over de te late termijn met een maximum van 52 weken, indien het gestelde tijdstip met meer dan 28,
      respectievelijk 112 kalenderdagen wordt overschreden.

      2 Indien de mate van verwijtbaarheid van de gedraging of nalatigheid van de verzekerde daartoe aanleiding geeft,
      bedraagt de hoogte van de maatregel, bedoeld in het eerste lid: 2%, 5%, 10% in plaats van 5%, 10%, 20%.

      3 Voor de vaststelling van het aantal kalenderdagen, bedoeld in het eerste lid, blijven ten aanzien van de
      verplichting, opgenomen in:

      a. de eerste categorie, ten 1°, 2°, 4° tot en met 8° en 11° van de [WW][ref8] en de eerste categorie van de
      [ZW][ref9], de [Wet WIA][ref10], de [WAZ][ref11], de [Wajong][ref12], de [WAO][ref13] en de [TW][ref14], buiten
      toepassing dagen, niet zijnde zaterdagen of zondagen, waarop kantoren van het UWV zijn gesloten;

      b. de eerste categorie, ten 3°, van de [WW][ref15], buiten toepassing dagen, niet zijnde zaterdagen of zondagen,
      waarop kantoren van de CWI zijn gesloten;

      c. de eerste categorie van de [WW][ref16], buiten toepassing dagen, waarop ingevolge die wet geen recht bestaat op
      een uitkering.


