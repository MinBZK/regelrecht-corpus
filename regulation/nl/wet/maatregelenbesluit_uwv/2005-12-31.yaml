  - number: 12.1.d
    text: |-
      bij de [TW][ref1] gerealiseerd door het bedrag aan toeslag, waarop ingevolge de [artikelen 8][ref2] en
      [10 van de TW][ref3] recht bestaat, te korten met het percentage van de maatregel;


