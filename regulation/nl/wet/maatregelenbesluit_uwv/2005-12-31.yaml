  - number: '12.2'
    text: |-
      Indien in het dagloon waarnaar de uitkering is berekend de waarde van een vakantiebon of daarmee overeenkomende
      aanspraken, bestemd voor vakantie-, feest- en/of snipperdagen, is opgenomen, wordt voordat toepassing wordt gegeven
      aan het eerste lid het dagloon verminderd met de waarde van de vakantiebon of de daarmee overeenkomende aanspraken
      en vermeerderd met het voor de verzekerde geldende vakantiebijslagpercentage.
    url: https://wetten.overheid.nl/BWBR0017084/2005-12-31#Artikel12
  - number: '13.1'
    text: |-
      In de perioden waarin de verzekerde, met inachtneming van de voorschriften, als bedoeld in
      [artikel 101, tweede lid, onderdeel b][ref1], juncto [artikel 26, eerste lid, onderdeel j, van de WW][ref2],
      vakantie geniet, ontbreekt de verwijtbaarheid ten aanzien van overtredingen als bedoeld in
      [artikel 24, eerste lid onderdeel b ten eerste en ten vierde][ref3], of [artikel 26 van de WW][ref4], voorzover
      de perioden waarin de verzekerde vakantie geniet, in enig kalenderjaar gezamenlijk een periode van 20 dagen niet
      overschrijden.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel101
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel24
      [ref4]: https://wetten.overheid.nl/BWBR0004045#Artikel26
    url: https://wetten.overheid.nl/BWBR0017084/2005-12-31#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '101'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '26'
      - id: ref3
        bwb_id: BWBR0004045
        artikel: '24'
      - id: ref4
        bwb_id: BWBR0004045
        artikel: '26'
  - number: '13.2'
    text: 'In afwijking van het bepaalde in het eerste lid, geldt voor:'
    url: https://wetten.overheid.nl/BWBR0017084/2005-12-31#Artikel13
  - number: 13.2.a
    text: de buitenlandse verzekerde, die vakantie geniet in het land van herkomst een periode van 40 dagen;
    url: https://wetten.overheid.nl/BWBR0017084/2005-12-31#Artikel13
  - number: 13.2.b
    text: |-
      de verzekerde, bedoeld in [artikel 1, tweede lid, van de Regeling vrijstelling verplichtingen WW][ref1], een
      periode van 65 dagen.


      [ref1]: https://wetten.overheid.nl/BWBR0015999#Artikel1
    url: https://wetten.overheid.nl/BWBR0017084/2005-12-31#Artikel13
    references:
