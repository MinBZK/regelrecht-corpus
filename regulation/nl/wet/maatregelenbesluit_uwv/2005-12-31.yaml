  - number: 12.1.e
    text: |-
      bij de [Wet WIA ][ref1]gerealiseerd door het uitkeringsbedrag te korten met het percentage van de maatregel,
      waarbij een verhoging als bedoeld in de [artikelen 53][ref2] en [63 van de Wet WIA][ref3] buiten beschouwing
      blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0019057
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel53
      [ref3]: https://wetten.overheid.nl/BWBR0019057#Artikel63
