        artikel: '1'
  - number: '15'
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na dagtekening van de Staatscourant waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0017084/2005-12-31#Artikel15
  - number: '16'
    text: 'Dit besluit wordt aangehaald als: ''Maatregelenbesluit UWV''.'
    url: https://wetten.overheid.nl/BWBR0017084/2005-12-31#Artikel16
