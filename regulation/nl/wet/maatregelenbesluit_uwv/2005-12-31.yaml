  - number: '2'
    text: |-
      Per wet wordt een maatregel opgelegd met inachtneming van dit besluit. De verplichtingen, waarop een maatregel van
      toepassing is, zijn per wet ingedeeld in categorieën en opgenomen in de bijlage bij dit besluit.
    url: https://wetten.overheid.nl/BWBR0017084/2005-12-31#Artikel2
  - number: '3.1'
    text: |-
      Tenzij volstaan wordt met een waarschuwing, bedragen de hoogte en de duur van de maatregel bij het niet of niet
      behoorlijk nakomen van een verplichting opgenomen in de eerste categorie van de [ZW][ref1], respectievelijk de
      [Wet WIA][ref2], de [WAZ][ref3], de [Wajong][ref4], de [WAO][ref5], de [WW][ref6] en de [TW][ref7]:


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0019057
      [ref3]: https://wetten.overheid.nl/BWBR0008656
      [ref4]: https://wetten.overheid.nl/BWBR0008657
      [ref5]: https://wetten.overheid.nl/BWBR0002524
      [ref6]: https://wetten.overheid.nl/BWBR0004045
      [ref7]: https://wetten.overheid.nl/BWBR0006299
    url: https://wetten.overheid.nl/BWBR0017084/2005-12-31#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0019057
      - id: ref3
        bwb_id: BWBR0008656
      - id: ref4
        bwb_id: BWBR0008657
      - id: ref5
        bwb_id: BWBR0002524
      - id: ref6
        bwb_id: BWBR0004045
      - id: ref7
        bwb_id: BWBR0006299
  - number: 3.1.a
    text: |-
      5% over de te late termijn, indien het gestelde tijdstip met niet meer dan 7, respectievelijk 56 kalenderdagen
      wordt overschreden;
    url: https://wetten.overheid.nl/BWBR0017084/2005-12-31#Artikel3
  - number: 3.1.b
    text: |-
      10% over de te late termijn, indien het gestelde tijdstip met meer dan 7, respectievelijk 56 kalenderdagen, doch
      niet meer dan 28, respectievelijk 112 kalenderdagen wordt overschreden;
    url: https://wetten.overheid.nl/BWBR0017084/2005-12-31#Artikel3
  - number: 3.1.c
    text: |-
      20% over de te late termijn met een maximum van 52 weken, indien het gestelde tijdstip met meer dan 28,
      respectievelijk 112 kalenderdagen wordt overschreden.
    url: https://wetten.overheid.nl/BWBR0017084/2005-12-31#Artikel3
  - number: '3.2'
    text: |-
      Indien de mate van verwijtbaarheid van de gedraging of nalatigheid van de verzekerde daartoe aanleiding geeft,
      bedraagt de hoogte van de maatregel, bedoeld in het eerste lid: 2%, 5%, 10% in plaats van 5%, 10%, 20%.
    url: https://wetten.overheid.nl/BWBR0017084/2005-12-31#Artikel3
  - number: '3.3'
    text: |-
      Voor de vaststelling van het aantal kalenderdagen, bedoeld in het eerste lid, blijven ten aanzien van de
      verplichting, opgenomen in:
    url: https://wetten.overheid.nl/BWBR0017084/2005-12-31#Artikel3
  - number: 3.3.a
    text: |-
      de eerste categorie, ten 1°, 2° en 4° tot en met 8° van de [WW][ref1] en de eerste categorie van de [ZW][ref2], de
      [Wet WIA][ref3], de [WAZ][ref4], de [Wajong][ref5], de [WAO][ref6] en de [TW][ref7], buiten toepassing dagen, niet
      zijnde zaterdagen of zondagen, waarop kantoren van het UWV zijn gesloten;


