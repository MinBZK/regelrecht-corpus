  - number: 6.3.a
    text: |-
      10% gedurende 16 weken, respectievelijk 5% gedurende 16 weken, indien de verzekerde onvoldoende meewerkt aan het
      bereiken van een gunstig scholingsresultaat, zodat vertraging in de opleiding of scholing is ontstaan;
    url: https://wetten.overheid.nl/BWBR0017084/2005-12-31#Artikel6
  - number: 6.3.b
    text: |-
      30% gedurende 16 weken, respectievelijk 10% gedurende 16 weken, indien het een opleiding of scholing betreft die
      baanzekerheid geeft en de verzekerde deze opleiding of scholing niet aanvangt of heeft afgebroken;
    url: https://wetten.overheid.nl/BWBR0017084/2005-12-31#Artikel6
  - number: 6.3.c
    text: |-
      gehele weigering van de uitkering over de volledige of resterende duur indien het een opleiding of scholing betreft
      die baanzekerheid geeft en de verzekerde volhardt in het niet of niet behoorlijk nakomen van deze verplichting;
    url: https://wetten.overheid.nl/BWBR0017084/2005-12-31#Artikel6
  - number: 6.3.d
    text: |-
      gehele weigering van de uitkering over de volledige of resterende duur indien de verzekerde volhardt in het
      niet of niet behoorlijk nakomen van de verplichting beschikbaar te zijn voor de voorzieningen, bedoeld in
      [artikel 7, eerste lid, onderdeel a, van de Wet werk en bijstand][ref1] en mee te werken aan het verkrijgen van
      die voorzieningen.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel7
    url: https://wetten.overheid.nl/BWBR0017084/2005-12-31#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '7'
  - number: '6.4'
    text: |-
      In afwijking van het eerste respectievelijk tweede lid, bedragen de hoogte en de duur van de maatregel bij
      het niet of niet behoorlijk nakomen van de verplichting opgenomen in de vierde categorie, ten 4°, van de
      [WAO][ref1], [WAZ][ref2] en [Wajong][ref3] en de verplichting opgenomen in de vierde categorie, ten 5°, van de
      [Ziektewet][ref4]:


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0008656
      [ref3]: https://wetten.overheid.nl/BWBR0008657
      [ref4]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0017084/2005-12-31#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0008656
      - id: ref3
        bwb_id: BWBR0008657
      - id: ref4
        bwb_id: BWBR0001888
  - number: 6.4.a
    text: |-
      10% gedurende 16 weken, respectievelijk 5% gedurende 16 weken, indien de verzekerde onvoldoende meewerkt aan het
      bereiken van een gunstig scholingsresultaat, zodat vertraging in de opleiding of scholing die wenselijk wordt
      geacht voor zijn inschakeling in de arbeid, is ontstaan;
    url: https://wetten.overheid.nl/BWBR0017084/2005-12-31#Artikel6
  - number: 6.4.b
    text: |-
      30% gedurende 16 weken, respectievelijk 10% gedurende 16 weken, indien het een opleiding of scholing betreft die
      baanzekerheid geeft en de verzekerde deze opleiding of scholing die wenselijk wordt geacht voor zijn inschakeling
      in de arbeid, niet aanvangt of heeft afgebroken;
    url: https://wetten.overheid.nl/BWBR0017084/2005-12-31#Artikel6
  - number: 6.4.c
    text: |-
      gehele weigering van de uitkering over de volledige of resterende duur indien het een opleiding of scholing betreft
      die baanzekerheid geeft en de verzekerde volhardt in het niet of niet behoorlijk nakomen van deze verplichting.
    url: https://wetten.overheid.nl/BWBR0017084/2005-12-31#Artikel6
  - number: '6.5'
    text: |-
      Onder baanzekerheid als bedoeld in het derde en vierde lid wordt verstaan een baangarantie of een zodanige kans op
      een baan, na afronding van de opleiding of scholing, dat deze gelijk te stellen is met een baangarantie.
    url: https://wetten.overheid.nl/BWBR0017084/2005-12-31#Artikel6
  - number: '6.6'
    text: |-
      In afwijking van het eerste respectievelijk tweede lid, bedragen de hoogte en de duur van de maatregel een blijvend
      gehele weigering van de uitkering indien de verzekerde volhardt in het niet of niet behoorlijk nakomen van de
      verplichting opgenomen in de vierde categorie, ten 1°, van de [WAO][ref1], de [WAZ][ref2] en de [Wajong][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0008656
      [ref3]: https://wetten.overheid.nl/BWBR0008657
    url: https://wetten.overheid.nl/BWBR0017084/2005-12-31#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0008656
      - id: ref3
        bwb_id: BWBR0008657
  - number: '7.1'
    text: |-
      De hoogte en de duur van de maatregel bedragen bij het niet of niet behoorlijk nakomen van de verplichting
      opgenomen in:
    url: https://wetten.overheid.nl/BWBR0017084/2005-12-31#Artikel7
  - number: 7.1.a
    text: |-
      de vijfde categorie, ten 1° van de [ZW][ref1], de [Wet WIA][ref2], de [WAZ][ref3], de [Wajong][ref4] en de
      [WAO][ref5]: blijvend gehele weigering van de uitkering;


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0019057
      [ref3]: https://wetten.overheid.nl/BWBR0008656
      [ref4]: https://wetten.overheid.nl/BWBR0008657
      [ref5]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0017084/2005-12-31#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0019057
      - id: ref3
        bwb_id: BWBR0008656
      - id: ref4
        bwb_id: BWBR0008657
      - id: ref5
        bwb_id: BWBR0002524
  - number: 7.1.b
    text: |-
      de vijfde categorie, ten 2° van de [ZW][ref1] en ten 1° van de [WW][ref2], de gehele uitkering voor de duur dat
      de verzekerde aanspraak op loon zou hebben kunnen doen gelden, dan wel de dienstbetrekking zou hebben kunnen
      voortduren;


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0017084/2005-12-31#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0004045
  - number: 7.1.c
    text: |-
      de vijfde categorie, ten 2°, 3° en 4° van de [WW][ref1]: dat deel van de uitkering dat niet tot uitbetaling zou
      komen, indien de verzekerde de bedoelde benadelingshandeling had nagelaten;


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0017084/2005-12-31#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: 7.1.d
    text: |-
      de vijfde categorie, ten 3° van de [ZW][ref1] en ten 5° van de [WW][ref2], afhankelijk van de ernst van de
      gedraging of nalatigheid van de verzekerde:


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0017084/2005-12-31#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0004045
  - number: 7.1.d.1
    text: 20% gedurende 16 weken,
    url: https://wetten.overheid.nl/BWBR0017084/2005-12-31#Artikel7
  - number: 7.1.d.2
    text: 30% gedurende 26 weken,
    url: https://wetten.overheid.nl/BWBR0017084/2005-12-31#Artikel7
  - number: 7.1.d.3
    text: de gehele uitkering over de volledige of resterende uitkeringsduur;
    url: https://wetten.overheid.nl/BWBR0017084/2005-12-31#Artikel7
  - number: 7.1.e
    text: |-
      de vijfde categorie, ten 2°, van de [Wet WIA][ref1]: de gehele uitkering voor de duur dat de
      dienstbetrekking zou hebben kunnen voortduren, doch ten hoogste voor de duur van het tijdvak, bedoeld in
      [artikel 25, negende lid, van de Wet WIA][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0019057
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel25
    url: https://wetten.overheid.nl/BWBR0017084/2005-12-31#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0019057
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '25'
  - number: 7.1.f
    text: |-
      de vijfde categorie, ten 3° en ten 4°, van de [Wet WIA][ref1]: dat deel van de uitkering dat niet tot uitbetaling
      zou komen indien de verzekerde de bedoelde verplichting wel zou zijn nagekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0017084/2005-12-31#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0019057
  - number: '7.2'
    text: |-
      Indien de mate van verwijtbaarheid van de gedraging of nalatigheid van de verzekerde daartoe aanleiding geeft,
      bedragen de hoogte en de duur van de maatregel:
    url: https://wetten.overheid.nl/BWBR0017084/2005-12-31#Artikel7
  - number: 7.2.a
    text: 'bedoeld in het eerste lid, onder a: 30% gedurende 26 weken;'
    url: https://wetten.overheid.nl/BWBR0017084/2005-12-31#Artikel7
  - number: 7.2.b
    text: 'bedoeld in het eerste lid, onder b: 30% gedurende de daar bedoelde termijn;'
    url: https://wetten.overheid.nl/BWBR0017084/2005-12-31#Artikel7
  - number: 7.2.c
    text: 'bedoeld in het eerste lid, onder c: 30% van het daar bedoelde deel van de uitkering;'
    url: https://wetten.overheid.nl/BWBR0017084/2005-12-31#Artikel7
  - number: 7.2.d
    text: 'bedoeld in het eerste lid, onder d, ten 1°: 10% gedurende 16 weken;'
    url: https://wetten.overheid.nl/BWBR0017084/2005-12-31#Artikel7
  - number: 7.2.e
    text: 'bedoeld in het eerste lid, onder d, ten 2°: 20% gedurende 16 weken;'
    url: https://wetten.overheid.nl/BWBR0017084/2005-12-31#Artikel7
  - number: 7.2.f
    text: 'bedoeld in het eerste lid, onder d, ten 3°: 30% gedurende 26 weken;'
    url: https://wetten.overheid.nl/BWBR0017084/2005-12-31#Artikel7
  - number: 7.2.g
    text: 'bedoeld in het eerste lid, onder e: 30% gedurende de daar bedoelde termijn;'
    url: https://wetten.overheid.nl/BWBR0017084/2005-12-31#Artikel7
  - number: 7.2.h
    text: 'bedoeld in het eerste lid, onder f: 30% van het daar bedoelde deel van de uitkering.'
    url: https://wetten.overheid.nl/BWBR0017084/2005-12-31#Artikel7
  - number: '8.1'
    text: |-
      Indien de verzekerde per wet twee of meer verplichtingen niet of niet behoorlijk nakomt en indien het niet nakomen
      van deze verplichtingen niet voortkomt uit één oorzaak worden de bij deze verplichtingen na toepassing van dit
      besluit vastgestelde maatregelen samengevoegd en zoveel mogelijk gelijktijdig gerealiseerd.
    url: https://wetten.overheid.nl/BWBR0017084/2005-12-31#Artikel8
  - number: '8.2'
    text: |-
      Indien de verzekerde per wet twee of meer verplichtingen niet of niet behoorlijk nakomt en indien het niet nakomen
      van deze verplichtingen voortkomt uit één oorzaak wordt één maatregel toegepast overeenkomend met de zwaarste van
      de bij deze verplichtingen na toepassing van dit besluit vastgestelde maatregelen.
    url: https://wetten.overheid.nl/BWBR0017084/2005-12-31#Artikel8
  - number: '8.3'
    text: |-
      Indien de verzekerde ter zake van zijn ingetreden werkloosheid meer dan één verplichting opgenomen in de eerste
      categorie, ten 1°, 2° en 3° van de [WW][ref1], niet of niet behoorlijk is nagekomen en tussen de nakoming van deze
      verplichtingen niet meer dan zeven kalenderdagen zijn gelegen, wordt aan de overtreding van genoemde verplichtingen
      één oorzaak ten grondslag gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0017084/2005-12-31#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '9.1'
    text: |-
      Indien aan de verzekerde schriftelijk is bekendgemaakt dat hem wegens het niet of niet behoorlijk nakomen van
      een verplichting een maatregel is opgelegd, en hij binnen twee jaren na de dag van deze bekendmaking opnieuw
      dezelfde verplichting niet of niet behoorlijk is nagekomen, wordt het percentage van de maatregel, bedoeld in de
      [artikelen 3 tot en met 7][ref1], met de helft daarvan verhoogd.


      [ref1]: https://wetten.overheid.nl/BWBR0017084#Artikel3
    url: https://wetten.overheid.nl/BWBR0017084/2005-12-31#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0017084
        artikel: '3'
  - number: '9.2'
    text: |-
      Indien na de schriftelijke bekendmaking dat een maatregel is opgelegd ter zake van het niet of niet behoorlijk
      nakomen van de verplichting, opgenomen in de vierde categorie, ten 1°, van de [WW][ref1], dezelfde verplichting
      binnen 12 maanden voor de derde maal niet is nagekomen, wordt de gehele uitkering over de resterende duur
      geweigerd.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0017084/2005-12-31#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '10.1'
    text: |-
      Indien als gevolg van de samenvoeging, genoemd in [artikel 8, eerste lid][ref1] of van de verhoging, genoemd in
      [artikel 9, eerste lid][ref2], de maatregel meer dan 30% bedraagt, wordt de hoogte van de maatregel gesteld op 30%
      en de duur ervan verlengd met een zodanige periode dat daarmee de volledige samenvoeging dan wel de verhoging wordt
      gerealiseerd.


      [ref1]: https://wetten.overheid.nl/BWBR0017084#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0017084#Artikel9
    url: https://wetten.overheid.nl/BWBR0017084/2005-12-31#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0017084
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0017084
        artikel: '9'
  - number: '10.2'
    text: |-
      Indien op grond van [artikel 27, eerste lid, van de WW][ref1], de maatregel wordt opgelegd van 35% gedurende 26
      weken én de verzekerde een maatregel op grond van dit besluit wordt opgelegd, wordt eerst de maatregel van 35%
      gedurende 26 weken gerealiseerd en aansluitend de maatregel op grond van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel27
    url: https://wetten.overheid.nl/BWBR0017084/2005-12-31#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '27'
  - number: '10.3'
    text: |-
      In afwijking van het tweede lid, wordt eerst de maatregel op grond van dit besluit gerealiseerd indien deze
      maatregel een tijdelijk gehele of blijvend gehele weigering van de uitkering betreft.
    url: https://wetten.overheid.nl/BWBR0017084/2005-12-31#Artikel10
  - number: '12.1'
    text: |-
      Een tijdelijk gedeeltelijke weigering als maatregel, bedoeld in de [artikelen 3 tot en met 7][ref1], wordt:


      [ref1]: https://wetten.overheid.nl/BWBR0017084#Artikel3
    url: https://wetten.overheid.nl/BWBR0017084/2005-12-31#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0017084
        artikel: '3'
  - number: 12.1.a
    text: |-
      bij de [ZW][ref1] gerealiseerd door het uitkeringspercentage van 70, bedoeld in [artikel 29, zesde lid][ref2]
      en [29b, tweede lid, van de ZW][ref3], te korten met het aantal procentpunten van de maatregel, en de
      uitkering, bedoeld in de artikelen [29, zevende lid][ref4], [29a][ref5], en [29b, derde lid, van de ZW][ref6]
      met het percentage van de maatregel, met dien verstande dat, indien de uitkering met toepassing van
      [artikel 31 van de ZW][ref7] gedeeltelijk niet tot uitbetaling komt, de korting wordt vermenigvuldigd met een
      breuk, waarvan de teller wordt gevormd door het bedrag dat van de uitkering wordt betaald, en de noemer door het
      bedrag van de uitkering;


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel29b
      [ref4]: https://wetten.overheid.nl/BWBR0001888#Artikel29
      [ref5]: https://wetten.overheid.nl/BWBR0001888#Artikel29a
      [ref6]: https://wetten.overheid.nl/BWBR0001888#Artikel29b
      [ref7]: https://wetten.overheid.nl/BWBR0001888#Artikel31
    url: https://wetten.overheid.nl/BWBR0017084/2005-12-31#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '29'
      - id: ref3
        bwb_id: BWBR0001888
        artikel: 29b
      - id: ref4
        bwb_id: BWBR0001888
        artikel: '29'
      - id: ref5
        bwb_id: BWBR0001888
        artikel: 29a
      - id: ref6
        bwb_id: BWBR0001888
        artikel: 29b
      - id: ref7
        bwb_id: BWBR0001888
        artikel: '31'
  - number: 12.1.b
    text: |-
      bij de [WW][ref1] gerealiseerd door het uitkeringspercentage van 70, bedoeld in de [artikelen 47][ref2],
      [51][ref3], [52][ref4] en [52i van de WW][ref5], te korten met het aantal procentpunten van de maatregel en de
      uitkering, bedoeld in [artikel 64 van de WW][ref6], met het percentage van de maatregel;


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel47
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel51
      [ref4]: https://wetten.overheid.nl/BWBR0004045#Artikel52
      [ref5]: https://wetten.overheid.nl/BWBR0004045#Artikel52i
      [ref6]: https://wetten.overheid.nl/BWBR0004045#Artikel64
    url: https://wetten.overheid.nl/BWBR0017084/2005-12-31#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '47'
      - id: ref3
        bwb_id: BWBR0004045
        artikel: '51'
      - id: ref4
        bwb_id: BWBR0004045
        artikel: '52'
      - id: ref5
        bwb_id: BWBR0004045
        artikel: 52i
      - id: ref6
        bwb_id: BWBR0004045
        artikel: '64'
  - number: 12.1.c
    text: |-
      bij de [WAO][ref1], de [WAZ][ref2] en de [Wajong][ref3] gerealiseerd door het percentage van de maatregel te
      vermenigvuldigen met de factor: uitkeringspercentage, bedoeld in de [artikelen 21, tweede lid van de WAO][ref4],
      [9, eerste lid][ref5] en [24, derde lid, van de WAZ][ref6] en [8, eerste lid, van de Wajong][ref7], of het
      uitkeringspercentage, zoals vastgesteld na toepassing van de [artikelen 44 van de WAO][ref8], [58 van de WAZ][ref9]
      en [50 van de Wajong][ref10], gedeeld door 70. Het hiervoor bedoelde uitkeringspercentage wordt verminderd met het
      berekende percentage. De verhoging van de uitkering, bedoeld in de [artikelen 22, eerste lid, van de WAO][ref11],
      [10 van de WAZ][ref12] en [9 van de Wajong][ref13], blijft bij de realisering van de maatregel buiten beschouwing;


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0008656
      [ref3]: https://wetten.overheid.nl/BWBR0008657
      [ref4]: https://wetten.overheid.nl/BWBR0002524#Artikel21
      [ref5]: https://wetten.overheid.nl/BWBR0008656#Artikel9
      [ref6]: https://wetten.overheid.nl/BWBR0008656#Artikel24
      [ref7]: https://wetten.overheid.nl/BWBR0008657#Artikel8
      [ref8]: https://wetten.overheid.nl/BWBR0002524#Artikel44
      [ref9]: https://wetten.overheid.nl/BWBR0008656#Artikel58
      [ref10]: https://wetten.overheid.nl/BWBR0008657#Artikel50
      [ref11]: https://wetten.overheid.nl/BWBR0002524#Artikel22
      [ref12]: https://wetten.overheid.nl/BWBR0008656#Artikel10
      [ref13]: https://wetten.overheid.nl/BWBR0008657#Artikel9
    url: https://wetten.overheid.nl/BWBR0017084/2005-12-31#Artikel12
    references:
      - id: ref1
