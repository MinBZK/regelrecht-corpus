  - number: '204'
    text: |-
      Indien de klacht krachtens [artikel 66, eerste lid, van het Wetboek van Strafrecht BES][ref1] door de wettige
      vertegenwoordiger van een minderjarige, die twaalf jaren of ouder is of van een onder curatele gestelde is
      geschied, gaat de officier van justitie niet tot vervolging over dan na de vertegenwoordigde persoon, zo deze in
      het land verblijft, in de gelegenheid te hebben gesteld zijn mening omtrent de wenselijkheid van vervolging kenbaar
      te maken, althans na deze daartoe behoorlijk te hebben opgeroepen, tenzij dit in verband met de lichamelijke of
      geestelijke toestand van de minderjarige of de onder curatele gestelde niet mogelijk of niet wenselijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel66
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel204
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '66'
  - number: '205'
    text: |-
      De intrekking van de klacht geschiedt bij de ambtenaren, op de wijze en in de vorm voor het doen van de klacht bij
      de [artikelen 201][ref1], [202][ref2] en [203][ref3] bepaald. [Artikel 193][ref4] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel201
