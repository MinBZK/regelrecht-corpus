    text: |-
      De tenuitvoerlegging van een op grond van [artikel 591][ref1] opgelegde straf of maatregel geschiedt met
      inachtneming van het bij of krachtens dit Wetboek, het [Wetboek van Strafrecht BES][ref2] of enige bijzondere
      strafwet betreffende de tenuitvoerlegging van rechterlijke beslissingen bepaalde.


