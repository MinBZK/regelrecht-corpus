  - number: '599'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de procedure volgens welke een
      verklaring van of namens een zich in de openbare lichamen Bonaire, Sint Eustatius en Saba bevindende veroordeelde,
      houdende instemming met de overdracht van de tenuitvoerlegging van een hem opgelegde tot vrijheidsontneming
      strekkende sanctie, dient te worden afgelegd.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel599
  - number: '600'
    text: |-
      1 Overdracht van de tenuitvoerlegging van rechterlijke beslissingen ingevolge deze afdeling geschiedt slechts onder
      het algemene beding, dat de door de rechter in de openbare lichamen Bonaire, Sint Eustatius en Saba opgelegde straf
      of maatregel niet ten nadele van de veroordeelde worden gewijzigd en dat daarbij met het reeds hier te lande ten
      uitvoer gelegde gedeelte van die straf of maatregel rekening wordt gehouden.

      2 Een veroordeelde die in de openbare lichamen Bonaire, Sint Eustatius en Saba een tot vrijheidsontneming
      strekkende sanctie ondergaat of nog zal moeten ondergaan, wordt, wanneer met een vreemde staat overeenstemming
      is bereikt omtrent de verdere tenuitvoerlegging van deze sanctie, zo spoedig mogelijk ter beschikking gesteld van
      de autoriteiten van die staat op een door de procureur-generaal, na overleg met die autoriteiten, te bepalen tijd
      en plaats.

      3 De overbrenging van een veroordeelde die niet heeft verklaard met de overdracht van de tenuitvoerlegging in
      te stemmen, geschiedt niet dan onder het algemene beding, dat hij alleen met uitdrukkelijke toestemming van Onze
      Minister:

      a. zal worden vervolgd, gestraft of op enige wijze in zijn persoonlijke vrijheid beperkt ter zake van feiten, die
      voor het tijdstip van zijn overbrenging zijn begaan en ter zake waarvan de tenuitvoerlegging niet is overgedragen;
      en

      b. ter beschikking zal worden gesteld van de autoriteiten van een derde staat ter zake van feiten, die voor
      het tijdstip van zijn overbrenging zijn begaan, tenzij de veroordeelde nadien de gelegenheid heeft gehad het
      grondgebied van de staat naar welke hij is overgebracht te verlaten.

      4 Op het moment dat een veroordeelde ter beschikking van de in het tweede lid bedoelde autoriteiten wordt gesteld,
      wordt de tenuitvoerlegging in de openbare lichamen Bonaire, Sint Eustatius en Saba van de hem opgelegde sanctie van
      rechtswege geschorst.

      5 In geval van hervatting van het recht tot tenuitvoerlegging van de sanctie wordt het in het buitenland reeds ten
      uitvoer gelegde gedeelte daarop in mindering gebracht.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel600
  - number: '601'
    text: |-
      Op de krachtens deze titel gegeven bevelen tot voorlopige vrijheidsontneming of tot verlenging of beëindiging
      daarvan zijn de bepalingen van dit Wetboek betreffende de inverzekeringstelling, onderscheidenlijk de voorlopige
      hechtenis van overeenkomstige toepassing, tenzij enige bepaling in deze titel anders voorschrijft.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel601
  - number: '602'
    text: |-
      1 Het bij en krachtens [artikel 62][ref1] bepaalde is van overeenkomstige toepassing ten aanzien van de
      veroordeelde wie op grond van [artikel 576, derde lid][ref2], voorlopig zijn vrijheid is ontnomen.

      2 Het bij en krachtens de [artikelen 63][ref3] en [65 tot en met 69][ref4] bepaalde, alsmede het in dit Wetboek
      bepaalde betreffende het optreden van de raadsman en de kennisneming van processtukken is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel576
