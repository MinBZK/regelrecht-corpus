  - number: '121'
    text: |-
      1 Opsporingsambtenaren kunnen te allen tijde voor inbeslagneming vatbare voorwerpen in beslag nemen en daartoe, in
      geval van ontdekking op heterdaad, zonodig elke plaats betreden.

      2 In geval van ontdekking op heterdaad zijn zij ter inbeslagneming tevens bevoegd in voer-, vaar- en
      luchtvaartuigen gericht en stelselmatig onderzoek te doen.

      3 De [artikelen 155 tot en met 164][ref1] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel155
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel121
