  - number: '2'
    text: |-
      1 Waar van misdrijf in het algemeen of van een misdrijf in het bijzonder gesproken wordt, wordt daaronder mede
      begrepen medeplichtigheid aan en poging tot misdrijf.

      2 Waar in bijzondere bepalingen met betrekking tot de inbeslagneming alleen over voorwerpen wordt gesproken, worden
      vorderingen daaronder mede begrepen.

      3 Onder eed wordt steeds mede begrepen de belofte.

      4 Onder staande houden wordt mede verstaan het doen halt houden van voertuigen en vaartuigen.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel2
  - number: '3'
    text: |-
      1 Een in dit wetboek vastgestelde termijn, binnen welke tegen enige beslissing beroep kan worden aangetekend,
      eindigende op een zaterdag, zondag of algemeen erkende feestdag, wordt verlengd tot en met de eerstvolgende dag die
      niet een zaterdag, zondag of algemeen erkende feestdag is. De [Algemene termijnenwet][ref1] is van overeenkomstige
      toepassing.

      2 Een termijn van drie dagen wordt, zo nodig, zoveel verlengd, dat daarin ten minste twee dagen voorkomen die niet
      een zaterdag, zondag of algemeen erkende feestdag zijn.

      3 Onder maand wordt verstaan de tijd van dertig dagen, onder een dag de tijd van vierentwintig uren.


      [ref1]: https://wetten.overheid.nl/BWBR0002448
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002448
  - number: '4'
    text: |-
      1 Tot de processtukken in de zin van dit wetboek worden gerekend de gegevens, die in verband met een verdenking
      tegen een bepaalde persoon ten behoeve van de politie en de justitie zijn verzameld, voor zover zij op die persoon
      betrekking hebben en voor zover zij in het verband van diens strafvervolging worden gebruikt.

      2 Onder de bevoegdheid tot kennisneming van processtukken wordt mede begrepen die tot het maken van aantekeningen
      daaruit. Het openbaar ministerie kan in het belang van een goede procesorde bij algemene regeling bepalen in welke
      gevallen en op welke wijze afschriften zullen worden verstrekt. Ook overigens regelt het openbaar ministerie,
      tenzij anders is bepaald, de wijze waarop kennisneming van processtukken wordt toegestaan, alsmede, zo nodig, de
      plaats waar en de wijze waarop bij die kennisneming toezicht zal worden uitgeoefend.

      3 Nadat de zaak ter terechtzitting aanhangig is gemaakt, worden de in het tweede lid bedoelde beslissingen gegeven
      door de rechter, die over de zaak oordeelt of het laatst heeft geoordeeld.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel4
  - number: '5'
    text: |-
      1 Het verhoren van personen ten behoeve van de strafvordering is gericht op het aan de dag brengen van de waarheid.
      Wanneer zij in verband met een beslissing in de gelegenheid worden gesteld opmerkingen te maken, worden zij
      gehoord.

      2 Wanneer is voorgeschreven, dat de verdachte wordt gehoord, gaat daaraan een behoorlijke oproeping vooraf. Van het
      horen kan slechts worden afgezien, indien de verdachte daarvan uitdrukkelijk afstand heeft gedaan, of indien hij,
      ondanks een behoorlijke oproeping, niet is verschenen.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel5
  - number: 5a
    text: |-
      1 Waar in dit wetboek de bevoegdheid wordt gegeven tot het horen, verhoren of ondervragen van personen, wordt
      daaronder, met uitzondering van bij algemene maatregel van bestuur te bepalen gevallen, mede begrepen horen,
      verhoren of ondervragen per videoconferentie, waarbij een directe beeld- of geluidsverbinding tot stand komt tussen
      de betrokken personen.

      2 De voorzitter van het college, de rechter, de rechter-commissaris of de ambtenaar die met de leiding over het
      horen, verhoren of ondervragen is belast, beslist of van videoconferentie gebruik gemaakt wordt, waarbij het belang
      van het onderzoek in aanmerking wordt genomen. Alvorens te beslissen wordt de te horen persoon of diens raadsman
      en in voorkomende gevallen de officier van justitie, in de gelegenheid gesteld hun mening kenbaar te maken over de
      toepassing van videoconferentie. Bij algemene maatregel van bestuur kunnen hierover nadere regels worden gesteld.

      3 Tegen de beslissing om van videoconferentie gebruik te maken staat geen afzonderlijk rechtsmiddel open.

      4 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent:

      a. de eisen waaraan de techniek van videoconferentie dient te voldoen, onder meer met het oog op de
      onschendbaarheid van vastgelegde waarneming;

      b. de controle op de naleving van de eisen, bedoeld onder a.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel5a
  - number: '6'
    text: |-
      Ontdekking op heterdaad heeft plaats, wanneer het strafbare feit ontdekt wordt, terwijl het begaan wordt of
      terstond nadat het begaan is. De heterdaad wordt niet langer aanwezig geacht dan kort na de ontdekking.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel6
  - number: '7'
    text: |-
      Bij de beantwoording van de vraag of een zaak al dan niet is geëindigd, wordt het rechtsgevolg, bij
      [artikel 282][ref1] aan het bekend worden van nieuwe bezwaren verbonden, buiten beschouwing gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel282
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '282'
  - number: '8'
    text: Het in deze titel bepaalde geldt niet, wanneer uit enige bepaling van dit wetboek een andere betekenis blijkt.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel8
  - number: '9'
    text: Strafvordering heeft alleen plaats in de gevallen en op de wijze bij wet voorzien.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel9
  - number: '10'
    text: |-
      Het openbaar ministerie vervolgt de strafbare feiten bij de rechter die tot de kennisneming daarvan krachtens de
      wet bevoegd is.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel10
  - number: '11'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel11
  - number: '12'
    text: |-
      Strafbare feiten buiten het rechtsgebied van Bonaire, Sint Eustatius en Saba aan boord van een Nederlands vaartuig
      of luchtvaartuig begaan, worden ter bepaling van de bevoegdheid van de rechter geacht te zijn begaan binnen het
      rechtsgebied van Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel12
  - number: '13'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel13
  - number: '14'
    text: |-
      De procureur-generaal houdt toezicht op een behoorlijke vervolging van strafbare feiten, en kan daartoe aan de
      officier van justitie de nodige bevelen geven.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel14
  - number: '15'
    text: |-
      1 Wordt een strafbaar feit niet vervolgd of de vervolging niet voortgezet, dan kan de rechtstreeks belanghebbende
      daarover bij het Hof van Justitie schriftelijk beklag doen.

      2 Onder rechtstreeks belanghebbende wordt mede verstaan een rechtspersoon, die krachtens zijn doelstelling
      en blijkens zijn feitelijke werkzaamheden een belang behartigt, dat door de beslissing tot niet vervolging
      rechtstreeks wordt getroffen.

      3 Wanneer op het gebied van de opsporing en de vervolging activiteiten niet of niet binnen een redelijke termijn
      hebben plaatsgevonden, wordt deze omstandigheid voor de toepassing van deze titel met een beslissing tot niet
      vervolging gelijkgesteld.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel15
  - number: '16'
    text: |-
      1 De griffier van het Hof geeft de klager spoedig schriftelijk bericht van de ontvangst.

      2 Na ontvangst van het klaagschrift draagt het Hof de procureur-generaal op ten aanzien van de beslissing tot niet
      of niet verdere vervolging schriftelijk verslag te doen en de daartoe betrekkelijke stukken over te leggen.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel16
  - number: '17'
    text: |-
      Is de klager kennelijk niet ontvankelijk of het beklag kennelijk ongegrond, dan kan het Hof zonder nader onderzoek
      de klager niet ontvankelijk of het beklag ongegrond verklaren.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel17
  - number: '18'
    text: |-
      1 Het Hof beslist niet alvorens de klager te hebben gehoord, althans behoorlijk daartoe te hebben opgeroepen,
      behoudens in het geval van [artikel 17][ref1].

      2 Het oproepen van de klager kan ook achterwege blijven, wanneer door hem ter zake van hetzelfde feit reeds
      eerder beklag is gedaan, tenzij door de klager nieuwe omstandigheden zijn aangevoerd die, waren zij het Hof bekend
      geweest, tot een andere beslissing op dat eerdere beklag hadden kunnen leiden.

      3 Indien beklag is gedaan door meer dan twee personen, kan het Hof volstaan met het oproepen van de twee personen,
      wier namen en adressen als eerste in het klaagschrift zijn vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel17
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '17'
  - number: '19'
    text: |-
      1 Het Hof kan de persoon wiens vervolging wordt verlangd oproepen ten einde hem in de gelegenheid te stellen
      opmerkingen te maken over het in het beklag gedane verzoek en de gronden waarop dat berust. De oproeping gaat
      vergezeld van een afschrift van het klaagschrift of bevat een aanduiding van het feit waarop het beklag betrekking
      heeft.

      2 Een bevel, als bedoeld in [artikel 25, eerste lid][ref1], wordt niet gegeven dan nadat de persoon wiens
      vervolging wordt verlangd door het Hof is gehoord, althans behoorlijk daartoe is opgeroepen.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel25
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '25'
  - number: '20'
    text: |-
      1 De klager en de persoon wiens vervolging wordt verlangd kunnen zich in raadkamer doen bijstaan door een advocaat.
      Zij kunnen zich doen vertegenwoordigen door een advocaat, indien deze verklaart daartoe bepaaldelijk gevolmachtigd
      te zijn, of door een daartoe bij bijzondere volmacht schriftelijk gemachtigde.Van deze bevoegdheid, alsmede van de
      mogelijkheid om toevoeging van een advocaat te verzoeken, wordt hun in de oproeping mededeling gedaan.

      2 De voorzitter van het Hof staat, behoudens in het geval van [artikel 17][ref1], de klager en de persoon wiens
      vervolging wordt verlangd, alsmede hun advocaten of gemachtigden toe van de op de zaak betrekking hebbende stukken
      kennis te nemen, indien daarom wordt verzocht. Kennisneming geschiedt op de wijze door de voorzitter te bepalen.
      De voorzitter kan, ambtshalve of op de vordering van de procureur-generaal, bepaalde stukken van kennisneming
      uitzonderen in het belang van de bescherming van de persoonlijke levenssfeer, de opsporing of vervolging van
      strafbare feiten of op zwaarwichtige gronden aan het algemeen belang ontleend.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel17
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '17'
  - number: '21'
    text: |-
      De persoon wiens vervolging wordt verlangd is niet verplicht op de vragen, hem in raadkamer gesteld, te antwoorden.
      Hiervan wordt hem, voordat hij wordt gehoord, mededeling gedaan. De mededeling wordt in het proces-verbaal
      opgenomen.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel21
  - number: '22'
    text: |-
      Wanneer de klager of de persoon wiens vervolging wordt verlangd in raadkamer wordt gehoord, nodigt het Hof de
      procureur-generaal uit daarbij tegenwoordig te zijn.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel22
  - number: '23'
    text: |-
      Het horen van de klager en de persoon wiens vervolging wordt verlangd kan ook aan een van de leden van het Hof
      worden opgedragen.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel23
  - number: '24'
    text: |-
      De [artikelen 38 tot en met 42][ref1] met betrekking tot de behandeling in raadkamer zijn op deze titel van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel38
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '38'
  - number: '25'
    text: |-
      1 Indien de klager ontvankelijk is en het Hof van oordeel is dat vervolging of verdere vervolging had moeten
      plaatshebben, beveelt het Hof dat de vervolging zal worden ingesteld of voortgezet ter zake van het feit waarop het
      beklag betrekking heeft of van het feit zoals het Hof dat in zijn bevel heeft omschreven.

      2 Het Hof kan het geven van zodanig bevel ook weigeren op gronden aan het algemeen belang ontleend.

      3 In alle andere gevallen wijst het Hof het beklag af.

      4 Alvorens te beslissen kan het Hof, indien het nader onderzoek wenselijk oordeelt, de stukken in handen van de
      rechter-commissaris stellen onder aanduiding van het onderwerp en de omvang van het onderzoek en, zo nodig, van de
      wijze waarop dit zal zijn in te stellen. [Artikel 359, tweede lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel359
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '359'
        afdeling: Tweede
  - number: '26'
    text: |-
      1 Het Hof beslist zo spoedig mogelijk en bij een met redenen omklede beschikking.

      2 Van elke beschikking zendt de griffier onverwijld een afschrift aan de procureur-generaal, de klager, alsmede,
      indien de [artikelen 19, eerste lid][ref1], en [25, eerste lid][ref2], toepassing hebben gevonden, aan de persoon
      wiens vervolging wordt verlangd.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel25
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '25'
  - number: '27'
    text: |-
      De leden van het Hof die over het beklag hebben geoordeeld, nemen noch in eerste aanleg, noch in hoger beroep, deel
      aan de berechting.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel27
  - number: '28'
    text: |-
      Bij toepassing van [artikel 76 van het Wetboek van Strafrecht BES][ref1] is beklag niet toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel76
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '76'
  - number: '29'
    text: |-
      Wanneer het Hof ambtshalve van oordeel is, dat de vervolging van strafbare feiten behoort ingesteld of voortgezet
      te worden, vinden de bepalingen van deze titel zoveel mogelijk overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel29
  - number: '30'
    text: |-
      1 Indien de waardering van het tenlastegelegde feit afhangt van de beoordeling van een geschilpunt van burgerlijk
      recht, kan de rechter, in welke stand van de vervolging ook, de vervolging voor een bepaalde tijd schorsen ten
      einde de uitspraak van de burgerlijke rechter over het geschilpunt af te wachten.

      2 De schorsing kan telkens voor een bepaalde tijd worden verlengd en te allen tijde worden opgeheven.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel30
  - number: '31'
    text: |-
      1 In zaken betreffende minderjarige verdachten kan de vervolging worden geschorst, indien, gelijktijdig met de
      vervolging, aanhangig is:

      a. ten aanzien van beide of een van de ouders een verzoek of vordering tot ontheffing of tot ontzetting van de
      ouderlijke macht of van de voogdij;

      b. ten aanzien van de voogd een verzoek tot ontzetting van de voogdij;

      c. over de verdachte een verzoek of een vordering tot ondertoezichtstelling.

      De schorsing duurt voort totdat de beslissing daarop onherroepelijk zal zijn geworden.

      2 In zodanig geval wordt de schorsing geacht plaats te vinden wegens het bestaan van een geschilpunt van burgerlijk
      recht.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel31
  - number: '32'
    text: |-
      Na het uitbrengen van de dagvaarding ter terechtzitting kan de verdachte de schorsing wegens het bestaan van een
      geschilpunt van burgerlijk recht enkel verzoeken, hetzij bij het bezwaarschrift dat tegen die dagvaarding kan
      worden ingediend, hetzij op de terechtzitting.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel32
  - number: '33'
    text: |-
      1 Indien de verdachte na het begaan van het strafbare feit in een toestand is komen te verkeren dat hij niet meer
      in staat is de strekking van de tegen hem ingestelde vervolging te begrijpen, schorst de rechter, in welke stand
      van de vervolging ook, de vervolging.

      2 Zodra van het herstel van de verdachte is gebleken, wordt de schorsing opgeheven.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel33
  - number: '34'
    text: |-
      1 Bij schorsing van de vervolging kan de rechter, ambtshalve of op de vordering van het openbaar ministerie,
      niettemin spoedeisende maatregelen bevelen.

      2 Hij kan gelasten dat de schorsing zich niet zal uitstrekken tot hetgeen de voorlopige hechtenis betreft.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel34
  - number: '35'
    text: Alvorens omtrent de schorsing te beslissen, kan de rechter getuigen en deskundigen horen.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel35
  - number: '36'
    text: |-
      De beslissingen omtrent de schorsing worden genomen hetzij ambtshalve, hetzij op de vordering van het openbaar
      ministerie, hetzij op het verzoek van de verdachte of zijn raadsman, door de rechter voor wie de zaak wordt
      vervolgd of zal worden vervolgd, of voor wie de zaak het laatst is vervolgd.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel36
  - number: '37'
    text: |-
      Tegen beslissingen omtrent de schorsing staat het openbaar ministerie binnen drie dagen daarna en de verdachte
      binnen drie dagen na de betekening hoger beroep open bij het Hof van Justitie.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel37
  - number: '38'
    text: |-
      1 In alle gevallen waarin niet de beslissing door de rechter op de terechtzitting is voorgeschreven of aldaar
      ambtshalve wordt genomen, geschieden onderzoek en beslissing door de raadkamer. Echter geschieden op de
      terechtzitting onderzoek en beslissing omtrent alle vorderingen, verzoeken of voordrachten aldaar gedaan.

      2 De raadkamer bij het Hof van Justitie is op straffe van nietigheid samengesteld uit drie leden. In eerste aanleg
      treedt de raadkamer enkelvoudig op. In dat geval vinden de bepalingen van deze titel overeenkomstig toepassing.

      3 Indien door de raadkamer een beslissing moet worden gegeven na de aanvang van het onderzoek op de terechtzitting,
      is zij zoveel mogelijk samengesteld uit de leden die op de terechtzitting over de zaak hebben gezeten.

      4 De rechter die als rechter-commissaris in de zaak enig onderzoek heeft verricht of enige beslissing heeft
      genomen, neemt aan onderzoek en beslissing door de raadkamer geen deel.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel38
  - number: '39'
    text: |-
      1 De beschikking vermeldt de namen van de rechters door wie, en de dag waarop zij is gegeven, en wordt ondertekend
      door ieder van hen en de griffier die bij de beraadslaging tegenwoordig was. Indien de aard van de zaak daartoe
      aanleiding geeft, kan de beschikking, mits daarvan eenvoudige aantekening wordt gedaan, mondeling worden gegeven.

      2 Indien een van hen tot die ondertekening buiten staat is, wordt hiervan aan het slot van de beschikking melding
      gemaakt.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel39
  - number: '40'
    text: |-
      1 De raadkamer is bevoegd de nodige bevelen te geven, opdat het onderzoek dat aan haar beslissing vooraf moet gaan,
      overeenkomstig de bepalingen van dit wetboek zal plaatsvinden.

      2 De raadkamer zal, alvorens te beslissen, het openbaar ministerie horen en kan zich door de rechter-commissaris,
      die in de zaak betrokken is geweest, schriftelijk of mondeling doen inlichten.

      3 Zij is bevoegd de overlegging van processtukken en stukken van overtuiging te bevelen.

      4 Het horen kan ook aan een van de leden of plaatsvervangende leden van het Hof van Justitie of aan
      rechtersplaatsvervanger in eerste aanleg van het gebied waar de te horen persoon zich bevindt, worden opgedragen.
      In dat geval is [artikel 42][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel42
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '42'
  - number: '41'
    text: |-
      1 De verdachte is bevoegd zich door zijn raadsman te doen bijstaan, wanneer hij wordt gehoord.

      2 Elke andere persoon dan de verdachte die ingevolge enige bepaling van dit wetboek wordt gehoord, kan zich door
      een advocaat doen bijstaan. Deze wordt daarbij in de gelegenheid gesteld de nodige opmerkingen te maken.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel41
  - number: '42'
    text: |-
      1 Van het onderzoek van de raadkamer wordt door de griffier een proces-verbaal opgemaakt, behelzende de zakelijke
      inhoud van de afgelegde verklaringen en van hetgeen bij dat onderzoek is voorgevallen.

      2 Indien een verdachte, getuige of deskundige of de raadsman of de advocaat verlangt dat enige opgave in de eigen
      woorden zal worden opgenomen, geschiedt dat voor zover de opgave redelijke grenzen niet overschrijdt, zoveel
      mogelijk.

      3 Het proces-verbaal wordt door de voorzitter of door een van de andere leden van de raadkamer en de griffier
      vastgesteld en zo spoedig mogelijk na afloop van het onderzoek ondertekend. Voor zover de rechter of de griffier
      tot een en ander buiten staat is, geschiedt dit zonder zijn medewerking en wordt van zijn verhindering aan het slot
      van het proces-verbaal melding gemaakt.

      4 Het wordt met de beschikking en de verdere tijdens het onderzoek in raadkamer in het geding gebrachte stukken bij
      de processtukken gevoegd.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel42
  - number: '43'
    text: |-
      1 In alle gevallen, waarin het belang van een goede strafrechtsbedeling een voorziening dringend noodzakelijk maakt
      en het wetboek zelf daaromtrent geen regeling bevat, kan een verzoek om zodanige voorziening worden gedaan door de
      verdachte of degene die daarbij een rechtstreeks hem bepaaldelijk aangaand belang heeft.

      2 Op gelijke wijze komt het openbaar ministerie de bevoegdheid toe een zodanige voorziening te vorderen.

      3 Op het verzoek of de vordering, op straffe van niet-ontvankelijkheid met redenen te omkleden, wordt tijdens het
      voorbereidend onderzoek beslist door de rechter-commissaris en, na de aanvang of de beëindiging van het onderzoek
      ter terechtzitting, door de rechter die over de zaak oordeelt of het laatst heeft geoordeeld. Is de zaak bij het
      Hof aanhangig of aanhangig geweest, dan is het college of een door dit college aangewezen lid bevoegd.

      4 Is de rechter aanstonds van oordeel, dat degene die het verzoek of de vordering heeft gedaan, niet-ontvankelijk
      is of dat elke redelijke grond aan het verzoek of de vordering ontbreekt, dan wijst hij zonder nader onderzoek en
      met eenvoudige redengeving de gevraagde voorziening af.

      5 De voorziening kan zowel een gebod als een verbod bevatten, ook met betrekking tot gedragingen in de toekomst.

      6 De beschikking wordt zo spoedig mogelijk gegeven als door het belang van de zaak wordt gevorderd.

      7 Voor zover de beschikking een veroordeling inhoudt, kan worden bepaald dat, indien, zo lang of zo dikwijls de
      veroordeelde aan die veroordeling niet voldoet, door hem zal zijn verbeurd een bij de beschikking vast te stellen
      geldsom, dwangsom genaamd. De dwangsom, eenmaal verbeurd, komt ten volle toe aan degene die de veroordeling heeft
      verkregen. Deze kan de dwangsom tenuitvoerleggen krachtens de titel waarbij zij is vastgesteld. Wordt de dwangsom
      niet voldaan, dan kan de rechter op de vordering van het openbaar ministerie de gijzeling van de veroordeelde
      bevelen gedurende een door hem te bepalen termijn.

      8 De rechter is bevoegd om tenuitvoerlegging van zijn beschikking te bevelen bij voorraad, niettegenstaande hoger
      beroep.

      9 Tegen de beschikking van de rechter in eerste aanleg staat binnen drie dagen hoger beroep open bij het Hof van
      Justitie, indien daartoe, gelet op het belang van de gevraagde voorziening, door het Hof of een door dit college
      aangewezen lid verlof is verleend.

      10 De [artikelen 38 tot en met 42][ref1] vinden zoveel mogelijk overeenkomstige toepassing. Ten aanzien van de
      rechtstreeks belanghebbende vindt [artikel 44][ref2] overeenkomstig toepassing.

      11 Tijdens de behandeling van het verzoek of de vordering kunnen aan de hierboven bedoelde procedure niet meer
      rechten worden ontleend dan de stand van de strafvorderlijke procedure toelaat.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel44
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel43
