        artikel: '38'
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '44'
  - number: '44'
    text: |-
      Alle rechterlijke beslissingen op grond van dit wetboek worden, tenzij daarvoor een bijzondere regeling geldt,
      binnen een zo kort mogelijke termijn genomen, zijn met redenen omkleed, en worden ten spoedigste ter kennis
      gebracht van het openbaar ministerie, dat onverwijld voor betekening aan de verdachte zorgdraagt. Op de dag dat de
      beslissing schriftelijk ter kennis is gebracht, respectievelijk betekend is vangt de termijn aan waarbinnen enig
      rechtsmiddel is opengesteld.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel44
  - number: '45'
    text: |-
      Een ieder, die betrokken is bij de uitvoering van dit wetboek en daarbij de beschikking krijgt over gegevens,
      waarvan hij het vertrouwelijke karakter kent of redelijkerwijze moet vermoeden, en voor wie niet reeds uit hoofde
      van ambt, beroep of wettelijk voorschrift ter zake van die gegevens een geheimhoudingsplicht geldt, is verplicht
      tot geheimhouding daarvan, behoudens voor zover enig wettelijk voorschrift hem tot bekendmaking verplicht of uit
      zijn taak bij de uitvoering van dit wetboek de noodzaak tot bekendmaking voortvloeit.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel45
  - number: '46'
    text: |-
      1 Hij, die ingevolge de bepalingen van dit wetboek mondeling een eed of belofte moet afleggen, zal:

      a. indien hij een eed aflegt, onder het opsteken van de twee voorste vingers van zijn rechterhand, uitspreken de
      woorden: «Zo waarlijk helpe mij God Almachtig»;

      b. indien hij een belofte aflegt, uitspreken de woorden: «Dat beloof ik».

      2 Degene, in wiens handen de eed wordt afgelegd, houdt de betrokkene de volgende bij diens hoedanigheid passende
      verklaring voor:

      a. ten aanzien van de getuige: dat hij de waarheid en niets dan de waarheid zal verklaren;

      b. ten aanzien van de deskundige en de tolk: dat hij zijn taak naar geweten zal vervullen.

      3 Hij, die aan zijn godsdienstige gezindheid de plicht ontleent de eed op andere wijze af te leggen, kan dat op die
      wijze doen. De eed kan ook worden afgelegd in de taal, die de betrokkene gewoon is te spreken.

      4 Hij, die tengevolge van een lichaams- of spraakgebrek de eed niet op de bij het eerste en derde lid bepaalde
      wijze kan afleggen, zal de eed afleggen op een wijze, zoveel mogelijk in overeenstemming met het in die
      artikelleden voorgeschrevene, te bepalen door degene in wiens handen de eed wordt afgelegd.

      In plaats van de eed kan ter keuze van de betrokkene de belofte worden afgelegd.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel46
  - number: '47'
    text: |-
      1 Als verdachte wordt aangemerkt degene te wiens aanzien uit feiten of omstandigheden een redelijk vermoeden van
      schuld aan enig strafbaar feit voortvloeit.

      2 Gedurende de vervolging wordt als verdachte aangemerkt degene tegen wie de vervolging is gericht.

      3 De aan de verdachte toekomende rechten komen tevens toe aan de veroordeelde tegen wie een strafrechtelijk
      financieel onderzoek is ingesteld of te wiens aanzien op een vordering van het openbaar ministerie als bedoeld in
      [artikel 38e van het Wetboek van Strafrecht BES][ref1] niet onherroepelijk is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel38e
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: 38e
  - number: '48'
    text: |-
      1 De verdachte heeft het recht zich, overeenkomstig de bepalingen van dit wetboek, door een of meer door hem
      gekozen of ingevolge de [artikelen 61 tot en met 68][ref1] toegevoegde raadslieden te doen bijstaan.

      2 Hem wordt daartoe, wanneer hij dit verzoekt en hem rechtens de vrijheid is ontnomen, zoveel mogelijk met
      inachtneming van de huishoudelijke reglementen van de inrichting waarin hij verblijft, de gelegenheid gegeven zich
      met zijn raadsman of raadslieden in verbinding te stellen.

      3 Wanneer de verdachte om bijstand van een raadsman verzoekt voordat hij door een opsporingsambtenaar wordt
      verhoord, kan het verhoor slechts dan een aanvang nemen, nadat de raadsman die bijstand heeft verleend, tenzij het
      onderzoek geen uitstel gedoogt, of de komst van de raadsman in redelijkheid niet kan worden afgewacht.

      4 De raadsman is niet bevoegd bij de verhoren door een opsporingsambtenaar aanwezig te zijn. Als het verhoor door
      een opsporingsambtenaar plaatsvindt, nadat de verdachte in dezelfde zaak door de rechter-commissaris is verhoord,
      komen de raadsman ten aanzien van het verhoor door de opsporingsambtenaar dezelfde bevoegdheden toe als hem bij het
      verhoor door de rechter-commissaris zijn toegekend.

      5 In de gevallen waarin de raadsman tot bijwoning van het verhoor is toegelaten, onthoudt hij zich van alles wat de
      strekking heeft het verhoor te beïnvloeden.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel61
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '61'
        paragraaf: '1'
        afdeling: Derde
  - number: '49'
    text: |-
      In alle gevallen waarin de verdachte overeenkomstig de bepalingen van dit wetboek wordt gehoord, is hij bevoegd
      zich door een raadsman te doen bijstaan. Deze wordt in de gelegenheid gesteld de nodige opmerkingen te maken.
      Gelijke bevoegdheid komt hem toe, wanneer de verdachte niet in staat is in persoon te worden gehoord.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel49
  - number: '50'
    text: |-
      1 De verdachte heeft het recht zich van antwoorden te onthouden.Voor een verhoor wordt de verdachte meegedeeld dat
      hij niet verplicht is tot antwoorden.

      2 In alle gevallen waarin iemand als verdachte wordt verhoord, onthoudt de verhorende rechter of ambtenaar zich
      van alles wat de strekking heeft een verklaring te verkrijgen, waarvan niet gezegd kan worden dat zij in vrijheid
      is afgelegd.

      3 De verklaringen van de verdachte, bepaaldelijk die welke een bekentenis van schuld inhouden, worden in het
      proces-verbaal van het verhoor zoveel mogelijk in zijn eigen woorden opgenomen.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel50
  - number: 50a
    text: |-
      1 De verdachte kan de officier van justitie dan wel, indien een gerechtelijk vooronderzoek is geopend, de rechter-
      commissaris schriftelijk en gemotiveerd verzoeken de door hem aangeduide processen-verbaal of andere voorwerpen bij
      de processtukken te voegen. Op een dergelijk verzoek wordt zo spoedig mogelijk beslist.

      2 Afwijzing van een verzoek als bedoeld in het eerste lid geschiedt schriftelijk en onder opgave van redenen. Van
      deze beslissing kan de verdachte binnen drie dagen in beroep komen bij de rechter-commissaris dan wel, indien de
      afwijzing door de rechter-commissaris is geschied, bij het Hof van Justitie.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel50a
  - number: '51'
    text: |-
      1 De verdachte heeft het recht om desgevraagd van de op zijn zaak betrekking hebbende processtukken kennis te
      nemen.

      2 Niettemin kan tijdens het voorbereidend onderzoek de officier van justitie, indien het belang van het onderzoek
      dit bepaaldelijk vordert, de verdachte de kennisneming van bepaalde processtukken onthouden. Daartoe bestaat
      slechts dan grond, voor zover het belang dat de verdachte bij kennisneming heeft, niet opweegt tegen het belang op
      grond waarvan de kennisneming wordt onthouden.

      3 Wanneer enig onderzoek niet tot een vervolging heeft geleid of zal leiden, kan de verdachte of de gewezen
      verdachte de kennisneming van de processtukken niet meer worden onthouden, tenzij dwingende aan het algemene belang
      van de strafvordering te ontlenen gronden zich daartegen verzetten.

      4 Ingeval de verdachte de kennisneming van bepaalde processtukken wordt onthouden, wordt hem onder opgave van
      redenen schriftelijk meegedeeld dat de hem ter inzage gegeven stukken niet volledig zijn. Van deze beslissing kan
      hij binnen drie dagen in beroep komen bij de rechter-commissaris.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel51
  - number: '52'
    text: |-
      Tijdens het voorbereidend onderzoek mag aan de verdachte niet worden onthouden de kennisneming van:

      a. de processen-verbaal van zijn verhoren;

      b. de processen-verbaal betreffende verhoren of handelingen van onderzoek, waarbij hij of zijn raadsman de
      bevoegdheid heeft gehad tegenwoordig te zijn, tenzij en voor zover uit het proces-verbaal blijkt van enige
      omstandigheid waarvan hij in het belang van het onderzoek tijdelijk onkundig moet blijven, en in verband daarmee
      een bevel als bedoeld in [artikel 70, tweede of derde lid][ref1], is gegeven;

      c. de overige processen-verbaal van verhoren, waarvan de inhoud hem mondeling volledig mededeling is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel70
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '70'
        afdeling: Vierde
  - number: '53'
    text: |-
      De kennisneming van geen enkel processtuk in het oorspronkelijke of in afschrift mag de verdachte worden onthouden,
      zodra het gerechtelijk vooronderzoek is gesloten, of, indien een gerechtelijk vooronderzoek niet heeft plaatsgehad,
      zodra de dagvaarding ter terechtzitting in eerste aanleg is betekend.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel53
  - number: '54'
    text: |-
      1 Kennisneming van processtukken, die zijn opgemaakt met betrekking tot de persoonlijkheid of de zielstoestand
      van de verdachte, kan hem alleen dan geheel of gedeeltelijk worden onthouden, indien de rapporteur verklaart,
      dat kennisneming bepaaldelijk niet in het belang van de verdachte moet worden aangemerkt en voorts dat er geen
      mogelijkheden aanwezig worden geacht de kennisneming onder begeleiding van een deskundige te doen plaatsvinden.
      Daaromtrent beslist het gerecht waarvoor de zaak wordt vervolgd of het laatst werd vervolgd dan wel, indien geen
      vervolging heeft plaatsgehad of deze nog niet is ingesteld, de rechter-commissaris.

      2 Ingeval de verdachte kennisneming op de voet van het bepaalde in het eerste lid geheel of gedeeltelijk niet wordt
      toegestaan, kan de kennisneming nochtans wel aan de raadsman worden toegestaan.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel54
  - number: '55'
    text: |-
      1 De verdachte heeft recht op behandeling van zijn zaak binnen een redelijke termijn.

      2 De termijn vangt aan op het moment dat de verdachte had verwacht en redelijkerwijze had kunnen verwachten, dat
      zijn zaak strafrechtelijk zou worden vervolgd.

      3 Een termijn, waardoor de verdachte langer dan in het algemeen wenselijk is onder de dreiging van een
      strafvervolging of van de voortzetting daarvan heeft moeten leven, wordt als onredelijk aangemerkt, tenzij
      bijzondere omstandigheden het tijdsverloop kunnen rechtvaardigen.

      4 Indien de verdachte de bevoegdheid, hem bij [artikel 56][ref1] toegekend, onbenut heeft gelaten, kan hij zich
      later niet meer op de onredelijkheid van een termijn beroepen, tenzij door het tijdsverloop de kwaliteit van de
      strafrechtspleging zodanig is aangetast, dat de rechter ook ambtshalve gronden aanwezig acht om het tijdsverloop te
      beoordelen en daaraan gevolgen te verbinden.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel56
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '56'
        afdeling: Vijfde
  - number: '56'
    text: |-
      1 De rechter-commissaris waakt tegen nodeloze vertraging van het voorbereidend onderzoek. Wanneer de verdachte zich
      in voorlopige hechtenis bevindt, draagt hij in het bijzonder ervoor zorg, dat de zaak met de meest mogelijke spoed
      wordt voortgezet.

      2 Wanneer het onderzoek ter terechtzitting is aangevangen, wordt het toezicht op nodeloze vertraging uitgeoefend
      door de rechter, die over de zaak ter terechtzitting oordeelt, of door het Hof van Justitie, nadat hoger beroep
      is ingesteld.

      3 De bevoegde rechter kan, op de vordering van het openbaar ministerie of op het verzoek van de verdachte of diens
      raadsman, bevelen dat het onderzoek binnen een uiterste termijn wordt voortgezet dan wel wordt beëindigd. Hij kan
      zich daartoe de nodige processtukken doen overleggen. Nadat het onderzoek ter terechtzitting is aangevangen, komen
      deze bevoegdheden de rechter ook ambtshalve toe.

      4 Indien een eenmaal aangevangen vervolging niet wordt voortgezet, kan de rechter tevens verklaren dat de zaak
      geëindigd is.

      5 De verdachte wordt gehoord.

      6 Een beslissing als bedoeld in het derde of vierde lid, kan tot een uiterste termijn worden aangehouden,
      indien het openbaar ministerie aannemelijk maakt, dat het onderzoek alsnog zal worden voortgezet dan wel verdere
      vervolging zal plaatsvinden.

      7 Wanneer de zaak ter terechtzitting in hoger beroep aanhangig is gemaakt, vindt ten aanzien van het Hof van
      Justitie [artikel 38, derde lid][ref1], geen toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel38
