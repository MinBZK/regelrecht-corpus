  - number: '341'
    text: |-
      1 Nadat alle deskundigen en getuigen zijn verhoord, wordt de verdachte ondervraagd. Hij wordt echter, indien dat
      door de voorzitter nodig wordt geoordeeld, eerder ondervraagd.

      2 Is er meer dan een verdachte, dan geschiedt de ondervraging in de volgorde, door de voorzitter te bepalen, na de
      procureur-generaal en de raadslieden te hebben gehoord.

      3 De verdachte wordt eerst door de voorzitter ondervraagd. Daarna kunnen de andere rechters en vervolgens de
      raadsman en de procureur-generaal vragen stellen.

      4 Wanneer de voorzitter daartoe aanleiding ziet, kan hij de procureur-generaal in de gelegenheid stellen de
      verdachte het eerst te ondervragen. In dat geval krijgt de raadsman daarna de gelegenheid de verdachte vragen te
      stellen.

      5 In ieder geval geeft de voorzitter aan de raadsman en aan de procureur-generaal de gelegenheid om naar aanleiding
      van de verklaring van de verdachte opmerkingen te maken.

      6 De voorzitter bepaalt welke vragen als ontoelaatbaar zijn aan te merken. Hij kan, ambtshalve of op het verzet
      van de raadsman of van de procureur-generaal, beletten dat aan enige vraag, aan de verdachte gesteld, gevolg wordt
      gegeven. Op het antwoord, dat op zodanige vraag mocht zijn gegeven, wordt geen acht geslagen.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel341
  - number: '342'
    text: |-
      Gedurende de verdere loop van het onderzoek kunnen de verdachte door de voorzitter, de rechters, de procureur-
      generaal, de raadsman en de medeverdachte vragen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel342
  - number: '343'
    text: Bij het verhoor van de verdachte wordt zoveel mogelijk onderzocht, of zijn verklaring op eigen wetenschap steunt.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel343
  - number: '344'
    text: |-
      Noch de voorzitter, noch een van de rechters geeft op de terechtzitting blijk van enige overtuiging omtrent schuld
      of onschuld van de verdachte.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel344
  - number: '345'
    text: |-
      Indien de verdachte de stilte of de orde op de terechtzitting verstoort en vruchteloos door de voorzitter is
      gewaarschuwd, kan deze zijn verwijdering uit de rechtszaal bevelen en, zo nodig, bepalen, dat hij gedurende het
      geheel of een gedeelte van de zitting elders zal worden opgehouden. De behandeling van de zaak wordt voortgezet en
      de uitspraak geschiedt als ware de verdachte tegenwoordig. In dat geval blijft de raadsman van de verdachte met de
      verdediging belast.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel345
  - number: '346'
    text: |-
      1 De voorzitter kan, hetzij ambtshalve, hetzij op de vordering van de procureur-generaal of op het verzoek van
      de verdachte, bepalen dat vragen betreffende de persoonlijke of de levensomstandigheden van de verdachte buiten
      diens tegenwoordigheid zullen worden gesteld en behandeld, dat de procureur-generaal of de raadsman buiten
      tegenwoordigheid van de verdachte betreffende diens geestvermogens het woord zal voeren.

      2 De voorzitter kan dienovereenkomstig bepalen, dat de verdachte buiten tegenwoordigheid van een of meer
      medeverdachten zal worden verhoord.

      3 Het tweede lid van [artikel 332][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel332
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel346
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '332'
        afdeling: Tweede
  - number: '347'
    text: |-
      Na de ondervraging van de verdachte kunnen, op de voet van [artikel 326][ref1], aan de getuigen opnieuw vragen
      worden gesteld of stukken worden voorgelezen.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel326
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel347
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '326'
        afdeling: Tweede
  - number: '348'
    text: |-
      1 Indien een verdachte of getuige de rechtstaal niet verstaat heeft het onderzoek niet plaats zonder bijstand van
      een tolk.

      2 Indien een verdachte of getuige niet of slechts zeer gebrekkig horen of spreken kan, geschieden de vragen of de
      antwoorden schriftelijk.

      3 Kan de in het tweede lid bedoelde verdachte of getuige niet of slechts zeer gebrekkig lezen of schrijven, dan
      wordt de bijstand van een daartoe geschikt persoon als tolk gevorderd.

      4 De tolk wordt, zo nodig, vanwege de procureur-generaal gedagvaard.

      5 Indien op de terechtzitting de bijstand van een tolk blijkt nodig te zijn, kan het Hof de dagvaarding van een
      tolk bevelen.

      6 Bij niet-verschijning van een tolk is [artikel 321][ref1] van overeenkomstige toepassing.

      7 De verdachte kan op bepaald aangegeven gronden de tolk wraken. Het Hof doet daarover terstond uitspraak.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel321
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel348
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '321'
        afdeling: Tweede
  - number: '349'
    text: |-
      1 De tolk wordt, alvorens met zijn werkzaamheden aan te vangen, beëdigd.[Artikel 250, tweede lid][ref1],
      betreffende vervanging van de beëdiging door een aanmaning is, van overeenkomstige toepassing.

      2 Van degene, die op de vordering van het openbaar ministerie door het Hof van Justitie als vaste gerechtelijke
      tolk is beëdigd, wordt geen nadere eed gevorderd.

      3 Geen van de getuigen, medeverdachten, leden van het openbaar ministerie of rechters wordt als tolk toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel250
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel349
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '250'
        afdeling: Vierde
  - number: '350'
    text: |-
      In de gevallen, waarin de bijstand van een tolk wordt gevorderd, wordt ten bezware van de verdachte geen acht
      geslagen op hetgeen ter terechtzitting is gesproken of voorgelezen zonder voor hem vertolkt te zijn.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel350
  - number: '351'
    text: |-
      1 De voorzitter toont zo nodig de verdachte en de getuigen de voorwerpen, die als stukken van overtuiging dienen en
      verhoort hen daaromtrent.

      2 De verdachte is bevoegd zodanige voorwerpen ter terechtzitting mee te nemen en over te leggen.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel351
  - number: '352'
    text: |-
      Het Hof heeft gelijke bevoegdheid als in [artikel 197][ref1] aan het openbaar ministerie is toegekend. Het oefent
      die uit hetzij ambtshalve, hetzij op de vordering van de procureur-generaal, of op het verzoek van de verdachte.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel197
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel352
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '197'
        afdeling: Eerste
  - number: '353'
    text: |-
      1 Nadat, behoudens het bepaalde bij [artikel 347][ref1], de ondervraging van de verdachte heeft plaatsgehad,
      kan de procureur-generaal het woord voeren en legt hij zijn vordering, na voorlezing, aan het Hof over. De
      vordering omschrijft de straf of de maatregel, indien oplegging daarvan wordt geëist, en vermeldt in dat
      geval tevens, welk bepaald strafbaar feit zou zijn begaan. De procureur-generaal maakt, voor zover zulks
      aan de verdachte niet reeds eerder was gebleken, kenbaar of hij voornemens is een vordering als bedoeld in
      [artikel 38e van het Wetboek van Strafrecht BES][ref2] aanhangig te maken, alsmede of daartoe een strafrechtelijk
      financieel onderzoek, als bedoeld in [artikel 177a][ref3], is ingesteld. Van deze mededeling van de procureur-
      generaal wordt in het proces-verbaal van de terechtzitting aantekening gedaan.

      2 De verdachte kan hierop antwoorden.

      3 De procureur-generaal kan daarna andermaal het woord voeren.

      4 Daarna kan de verdachte nog eenmaal opmerkingen maken.

      5 Aan de verdachte wordt echter, op straffe van nietigheid, het recht gelaten om het laatst te spreken.

      6 Ook daarna is [artikel 347][ref4] van toepassing en kan ook de verdachte nader worden ondervraagd. In dat geval
      kunnen de procureur-generaal en de verdachte nogmaals, op de hiervoor vermelde voet, het woord voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel347
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel38e
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel177a
      [ref4]: https://wetten.overheid.nl/BWBR0028681#Artikel347
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel353
