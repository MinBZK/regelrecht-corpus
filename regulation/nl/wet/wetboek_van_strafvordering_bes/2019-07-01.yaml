  - number: '202'
    text: |-
      1 Bij strafbare feiten alleen op klacht vervolgbaar, geschiedt deze klacht mondeling of schriftelijk bij de
      bevoegde ambtenaar, hetzij door de tot de klacht gerechtigde in persoon, hetzij door een ander, daartoe door hem
      van een bijzondere schriftelijke volmacht voorzien. De klacht bestaat in een aangifte met verzoek tot vervolging.

      2 Het tweede en derde lid van [artikel 201][ref1] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel201
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel202
