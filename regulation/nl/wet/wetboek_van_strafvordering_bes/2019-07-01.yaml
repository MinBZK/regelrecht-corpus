  - number: '197'
    text: |-
      1 Het openbaar ministerie kan in het belang van het onderzoek in strafzaken de medewerking inroepen van personen en
      lichamen, die op het gebied van de reclassering werkzaam zijn en aan deze, ingeval zij zich daartoe bereid hebben
      verklaard, opdrachten geven tot het verzamelen van gegevens betreffende de persoonlijkheid, de levensomstandigheden
      of de reclassering van een verdachte. Het verslag betreffende de uitvoering van de opdracht wordt schriftelijk of
      mondeling gegeven naar gelang het openbaar ministerie dat verzoekt.

      2 Indien het openbaar ministerie aan personen of lichamen, als bedoeld in het eerste lid, verzoekt om tot het
      bekomen van opdrachten of het uitbrengen van verslag betreffende de uitvoering van opdrachten ter terechtzitting
      of bij enig ander onderzoek in een strafzaak tegenwoordig te zijn of zich te laten vertegenwoordigen, geven zij
      daaraan zoveel mogelijk gevolg.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel197
  - number: '198'
    text: |-
      1 Ieder, die kennis draagt van een van de misdrijven omschreven in de
      [artikelen 97 tot en met 117 van het Wetboek van Strafrecht BES][ref1], in
      [Titel VII van het Tweede Boek van dat wetboek][ref2], voor zover daardoor levensgevaar is veroorzaakt, of in de
      [artikelen 300 tot en met 312 van dat wetboek][ref3], van mensenroof of van verkrachting, dan wel van het voornemen
      tot een van deze misdrijven, is verplicht daarvan onverwijld aangifte te doen bij een opsporingsambtenaar.

      2 De bepaling van het eerste lid is niet van toepassing op hem, die door de aangifte gevaar zou doen ontstaan voor
      een vervolging van zichzelf of van iemand bij wiens vervolging hij zich van het afleggen van getuigenis zou kunnen
      verschonen.

      3 Evenzo is ieder, die kennis draagt dat iemand gevangen gehouden wordt op een plaats die niet wettig daarvoor
      bestemd is, verplicht daarvan onverwijld aangifte te doen bij een opsporingsambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel97
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel163
      [ref3]: https://wetten.overheid.nl/BWBR0028570#Artikel300
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel198
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '97'
      - id: ref2
        bwb_id: BWBR0028570
        artikel: '163'
      - id: ref3
        bwb_id: BWBR0028570
        artikel: '300'
  - number: '199'
    text: |-
      Ieder, die kennis draagt van een begaan strafbaar feit, is bevoegd daarvan aangifte te doen. Tot het doen van
      klacht is de belanghebbende bevoegd.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel199
  - number: '200'
    text: |-
      1 Openbare colleges of ambtenaren, die in de uitoefening van hun bediening kennis krijgen van een misdrijf met de
      opsporing waarvan zij niet zijn belast, zijn verplicht daarvan onverwijld aangifte te doen, met afgifte van de tot
      de zaak betrekkelijke stukken, aan de officier van justitie of een hulpofficier van justitie,

      a. indien het misdrijf is een ambtsmisdrijf, als bedoeld in
      [Titel XXVIII van het Tweede Boek van het Wetboek van Strafrecht BES][ref1], dan wel

      b. indien het misdrijf is begaan door een ambtenaar, die daarbij een bijzondere ambtsplicht heeft geschonden of
      daarbij gebruik heeft gemaakt van macht, gelegenheid of middel hem door zijn ambt geschonken, dan wel

      c. indien door het misdrijf inbreuk op of onrechtmatig gebruik wordt gemaakt van een regeling waarvan de uitvoering
      of de zorg voor de naleving aan hen is opgedragen.

      2 Zij verschaffen de officier van justitie of de hulpofficier desgevraagd alle inlichtingen omtrent strafbare
      feiten met de opsporing waarvan zij niet zijn belast en die in de uitoefening van hun bediening te hunner kennis
      zijn gekomen.

      3 De bepalingen van het eerste en tweede lid zijn niet van toepassing op de ambtenaar, die door het doen van
      aangifte of het verschaffen van inlichtingen gevaar zou doen ontstaan voor een vervolging van zichzelf of van
      iemand bij wiens vervolging hij zich van het afleggen van getuigenis zou kunnen verschonen.

      4 Gelijke verplichtingen rusten op rechtspersonen of organen van rechtspersonen wier taken en bevoegdheden zijn
      omschreven bij of krachtens de wet, voor zover daartoe bij algemene maatregel van bestuur aangewezen.

      5 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld in het belang van een goede
      uitvoering van dit artikel.

      6 De aangifteplicht met betrekking tot misdrijven als bedoeld in het eerste lid, onderdeel c, kan in overleg met de
      officier van justitie en met inachtneming van de regels gesteld krachtens het vijfde lid, nader worden beperkt.


      [ref1]: https://wetten.overheid.nl/BWBR0028570
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel200
    references:
      - id: ref1
        bwb_id: BWBR0028570
  - number: '201'
    text: |-
      1 De aangifte van een strafbaar feit geschiedt mondeling of schriftelijk bij de bevoegde ambtenaar, hetzij door de
      aangever in persoon, hetzij door een ander, daartoe door hem van een bijzondere schriftelijke volmacht voorzien.

      2 De mondelinge aangifte wordt door de ambtenaar die haar ontvangt, op schrift gesteld en na voorlezing door hem
      met de aangever of diens gemachtigde ondertekend. Indien deze niet kan tekenen, wordt de reden van het beletsel
      vermeld.

      3 De schriftelijke aangifte wordt door de aangever of diens gemachtigde ondertekend. De schriftelijke volmacht, of,
      zo zij voor een notaris in minuut is verleden, een authentiek afschrift daarvan, wordt aan de akte gehecht.

      4 Tot het ontvangen van de aangiften, bedoeld in de [artikelen 198][ref1] en [199][ref2], zijn de
      opsporingsambtenaren, en tot het ontvangen van de aangiften, bedoeld in [artikel 200][ref3], de daarbij genoemde
      ambtenaren, verplicht. [Artikel 194][ref4] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel198
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel199
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel200
      [ref4]: https://wetten.overheid.nl/BWBR0028681#Artikel194
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel201
