  - number: '270'
    text: |-
      Ingeval hetzij de wijze waarop het onderzoek door de deskundigen is geschied, hetzij het verschil van de
      deskundigen omtrent de feiten, hetzij het verschil in oordeelvelling, daartoe aanleiding geeft, kan de rechter-
      commissaris, hetzij op de vordering van de officier van justitie, hetzij op het verzoek van de verdachte, het
      onderzoek aan andere deskundigen opdragen. De voorgaande artikelen van deze afdeling en [artikel 271][ref1] zijn
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel271
