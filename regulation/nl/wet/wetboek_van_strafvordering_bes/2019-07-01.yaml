      1 De officier van justitie kan, indien het belang van het onderzoek dit vordert, bij of terstond na de toepassing
      van [artikel 177r, eerste lid][ref1], [artikel 177s, eerste lid][ref2], of [177t, eerste lid][ref3], degene van
      wie redelijkerwijs kan worden vermoed dat hij kennis draagt van de wijze van versleuteling van de in deze artikelen
