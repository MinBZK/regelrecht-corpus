  - number: 79b
    text: |-
      1 De verdachte kan, indien geen verzoek als bedoeld in [artikel 79, eerste lid][ref1], is gedaan, binnen veertien
      dagen nadat hem de uitslag van het onderzoek als bedoeld in artikel 79, eerste lid, schriftelijk is kennisgegeven,
      de rechter-commissaris verzoeken een andere door de verdachte aangewezen deskundige, verbonden aan een van de bij
      of krachtens algemene maatregel van bestuur aan te wijzen laboratoria, te benoemen met de opdracht een onderzoek
      te verrichten dat gebaseerd is op een vergelijking tussen kenmerken van celmateriaal. Indien daartoe voldoende
      celmateriaal beschikbaar is, willigt de rechter-commissaris het verzoek in. De deskundige brengt aan de rechter-
      commissaris een met redenen omkleed verslag uit. Artikel 79, tweede lid, eerste volzin, derde en vierde lid, is van
      overeenkomstige toepassing.

      2 In geval van toepassing van het eerste lid wordt de verdachte een bij of krachtens algemene maatregel van bestuur
      te bepalen gedeelte van de kosten van het onderzoek in rekening gebracht, indien dit onderzoek het in opdracht van
      de rechter-commissaris verrichte onderzoek bevestigt.

      3 Indien onvoldoende materiaal voor tegenonderzoek als bedoeld in het eerste lid beschikbaar is, stelt de rechter-
      commissaris de verdachte, indien slechts één verdachte bekend is, in de gelegenheid een deskundige als bedoeld in
      [artikel 267][ref2] aan te wijzen. De deskundige dient verbonden te zijn aan een van de bij of krachtens algemene
      maatregel van bestuur aan te wijzen laboratoria. Het eerste lid is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel79
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel267
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel79b
