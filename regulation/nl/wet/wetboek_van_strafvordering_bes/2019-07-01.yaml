  - number: 177q
    text: |-
      1 De officier van justitie kan indien het onderzoek dit dringend vordert, na door de rechter-commissaris verleende
      machtiging, bevelen dat een opsporingsambtenaar met een technisch hulpmiddel vertrouwelijke communicatie opneemt in
      geval van:

      a. verdenking van een misdrijf waarvoor voorlopige hechtenis is toegelaten, en dat, gezien zijn aard of de
      samenhang met andere vermoedelijk door de verdachte begane misdrijven een ernstige inbreuk op de rechtsorde
      oplevert;

      b. aanwijzingen van een terroristisch misdrijf.

      2 De officier van justitie kan in het belang van het onderzoek bepalen dat ter uitvoering van het bevel een
      besloten plaats, niet zijnde een woning, wordt betreden zonder toestemming van de rechthebbende. Hij kan, na
      door de rechter-commissaris daartoe verleende machtiging, bepalen dat ter uitvoering van het bevel een woning
      zonder toestemming van de rechthebbende wordt betreden, indien het onderzoek dit dringend vordert. In het geval
      bedoeld in het eerste lid, onderdeel a, betreft het een misdrijf waarop naar de wettelijke omschrijving een
      gevangenisstraf van acht jaren of meer is gesteld. De [artikelen 155 tot en met 163][ref1], met uitzondering van
      [artikel 162][ref2], zijn van overeenkomstige toepassing.

      3 Het bevel vermeldt, behalve de gegevens bedoeld in [artikel 177h][ref3], tevens:

      a. ten minste de naam van één van de personen die aan de communicatie deelnemen en, indien het bevel communicatie
      betreft op een besloten plaats of in een vervoermiddel, bovendien een zo nauwkeurig mogelijke omschrijving van die
      plaats of dat vervoermiddel;

      b. bij toepassing van het tweede lid, de plaats die kan worden betreden.

      4 In een geval als bedoeld in het eerste lid, onderdeel a, kan het bevel ten opzichte van een persoon, die zich op
      grond van [artikel 252][ref4] kan verschonen van het geven van een getuigenis, uitsluitend worden gegeven, indien
      deze zelf als verdachte wordt aangemerkt.

      5 Het bevel wordt gegeven voor een periode van ten hoogste vier weken. De geldigheidsduur kan telkens voor een
      termijn van ten hoogste vier weken worden verlengd.

      6 Van het opnemen wordt binnen drie dagen proces-verbaal opgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel155
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel162
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel177h
      [ref4]: https://wetten.overheid.nl/BWBR0028681#Artikel252
