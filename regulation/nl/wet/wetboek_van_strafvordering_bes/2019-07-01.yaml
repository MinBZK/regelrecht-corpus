    text: |-
      1 De officier van justitie kan in het belang van het onderzoek bevelen dat een opsporingsambtenaar zonder dat
      kenbaar is dat hij optreedt als opsporingsambtenaar, stelselmatig informatie inwint over een persoon in geval dat:

      a. die persoon verdacht wordt van een misdrijf waarvoor voorlopige hechtenis is toegelaten;

      b. er aanwijzingen zijn van een terroristisch misdrijf.

      2 Het bevel wordt gegeven voor een periode van ten hoogste zes weken. De geldigheidsduur kan telkens voor een
      periode van zes weken worden verlengd.
