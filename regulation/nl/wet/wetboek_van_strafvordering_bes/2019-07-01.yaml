  - number: '603'
    text: |-
      In gevallen waarin onherroepelijk is vastgesteld dat tenuitvoerlegging van een buitenlandse rechterlijke beslissing
      in de openbare lichamen Bonaire, Sint Eustatius en Saba niet behoort plaats te vinden, kan het Hof op verzoek
      van de veroordeelde hem een vergoeding ten laste van de Staat toekennen voor de schade die hij heeft geleden
      en kosten die hij heeft gemaakt ten gevolge van voorlopige vrijheidsontneming, bevolen krachtens deze titel.
      [Titel XVI van het Derde Boek][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel603
    references:
      - id: ref1
        bwb_id: BWBR0028681
  - number: '604'
    text: |-
      Onze Minister beslist op verzoeken om doorvoer over het grondgebied van de openbare lichamen Bonaire, Sint
      Eustatius en Saba van vreemdelingen die ten behoeve van de tenuitvoerlegging van een rechterlijke beslissing door
      de autoriteiten van een vreemde staat ter beschikking van de autoriteiten van een andere staat worden gesteld.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel604
  - number: '605'
    text: De tenuitvoerlegging van rechterlijke beslissingen geschiedt op last van het openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel605
  - number: '606'
    text: |-
      1 De benadeelde partij, die zich in het geding over de strafzaak gevoegd heeft, doet zelf het vonnis, voor zover
      haar vordering aangaat, tenuitvoerleggen, op de wijze bepaald voor vonnissen in burgerlijke zaken. Indien het een
      mondeling vonnis geldt, geschiedt de tenuitvoerlegging uit kracht van een mededeling van de griffier, houdende
      afschrift van de aantekening van het vonnis, vermeldende de benadeelde partij, degene tegen wie en de rechter door
      wie het vonnis is gewezen, en dragende aan het hoofd de woorden: «In naam van de Koning».

      2 Allen die ter zake van hetzelfde strafbare feit bij hetzelfde vonnis veroordeeld zijn tot schadevergoeding aan de
      benadeelde partij, zijn hoofdelijk daarvoor aansprakelijk.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel606
  - number: '607'
    text: |-
      Indien bij dit wetboek enige betekening, dagvaarding, oproeping, kennisgeving, aanzegging of andere mededeling is
      voorgeschreven, geschiedt deze, indien niet anders is bepaald, op last van het openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel607
  - number: '608'
    text: |-
      Het openbaar ministerie kan voor de tenuitvoerlegging van rechterlijke of eigen beslissingen de nodige bijzondere
      of algemene last geven aan de deurwaarders en aan de ambtenaren van politie, alsmede voor de tenuitvoerlegging aan
      boord van een Nederlands schip dan wel op een bij landsbesluit aangewezen installatie ter zee aan de schipper, een
      en ander voor zover het volkenrecht en het interregionale recht dit toelaten. Voor de tenuitvoerlegging van bevelen
      tot inbeslagneming en teruggave van onroerende goederen wordt de bijzondere last tot de deurwaarder gericht.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel608
  - number: '609'
    text: |-
      1 Voor zover niet anders is bepaald, mag geen beslissing worden tenuitvoergelegd, zolang daartegen nog enig gewoon
      rechtsmiddel openstaat en, zo dit is aangewend, totdat het is ingetrokken of daarop is beslist.

      2 Is een mededeling als bedoeld in [artikel 411][ref1] voorgeschreven, dan kan de tenuitvoerlegging van het vonnis
      geschieden na de betekening van die mededeling. Bij vonnissen bij verstek gewezen, waarbij zodanige mededeling niet
      behoeft te geschieden, kan de tenuitvoerlegging geschieden na de uitspraak. Door verzet, hoger beroep of beroep in
      cassatie wordt de tenuitvoerlegging geschorst of opgeschort.

      3 De laatste volzin van het tweede lid geldt niet:

      a. voor bevelen bij het vonnis verleend, die dadelijk uitvoerbaar zijn;

      b. indien naar het oordeel van het openbaar ministerie vaststaat dat het rechtsmiddel na het verstrijken van
      de daarvoor gestelde termijn is aangewend, tenzij op verzoek van degene die het middel aanwendde, en na te zijn
      gehoord, indien hij dit bij het verzoek heeft gevraagd, de voorzitter van het Hof of de rechter in eerste aanleg
      anders bepaalt.

      4 Een uitspraak op de vordering van het openbaar ministerie, als bedoeld in
      [artikel 38e van het Wetboek van Strafrecht BES][ref2], kan eerst worden tenuitvoergelegd, nadat de veroordeling,
      als bedoeld in artikel 38e, eerste onderscheidenlijk derde lid, van het Wetboek van Strafrecht BES, in kracht van
      gewijsde is gegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel411
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel38e
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel609
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '411'
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0028570
        artikel: 38e
  - number: '610'
    text: |-
      De tenuitvoerlegging of ingang van straffen wordt opgeschort gedurende acht dagen volgende op de dag waarop het
      vonnis, waarbij zij zijn opgelegd, in kracht van gewijsde is gegaan.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel610
  - number: '611'
    text: |-
      1 Een verzoekschrift om gratie, dat is ingediend binnen de in [artikel 610][ref1] bedoelde termijn ter griffie van
      het Hof, schort de tenuitvoerlegging of ingang van de straf waarvan gratie wordt verzocht op, totdat op het verzoek
      is beschikt.

      2 De griffier maakt onverwijld het openbaar ministerie bekend met de indiening van een ter griffie ontvangen
      verzoekschrift. Hij tekent de dag van indiening op het verzoekschrift aan. Het verzoekschrift wordt vervolgens,
      voorzien van het advies van de rechter naar Onze Minister van Justitie opgezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel610
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel611
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '610'
        afdeling: Tweede
  - number: '612'
    text: |-
      1 De [artikelen 610][ref1] en [611][ref2], eerste lid, blijven buiten toepassing:

      a. indien de veroordeelde te kennen geeft de opschorting van de tenuitvoerlegging of ingang van de straf niet te
      wensen;

      b. indien, voor zover het betreft vrijheidsstraffen, op het tijdstip dat het vonnis in kracht van gewijsde gaat,
      de veroordeelde zich ter zake van het feit waarvoor hij bij dat vonnis is veroordeeld, in voorlopige hechtenis
      bevindt.

      2 De in het eerste lid, onderdeel a, bedoelde kennisgeving wordt, hetzij in persoon hetzij door iemand die daartoe
      bepaaldelijk door de veroordeelde is gemachtigd, gedaan aan de griffier van het gerecht dat het vonnis heeft
      uitgesproken. [Artikel 447][ref3] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel610
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel611
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel447
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel612
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '610'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '611'
        afdeling: Tweede
