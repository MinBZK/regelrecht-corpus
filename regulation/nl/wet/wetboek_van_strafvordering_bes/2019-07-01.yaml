  - number: 177p
    text: |-
      1 De officier van justitie kan in het belang van het onderzoek bevelen dat een opsporingsambtenaar zonder
      toestemming van de rechthebbende een besloten plaats, niet zijnde een woning, betreedt, dan wel een technisch
      hulpmiddel aanwendt, teneinde die plaats op te nemen, aldaar sporen veilig te stellen of aldaar een technisch
      hulpmiddel te plaatsen teneinde de aanwezigheid of verplaatsing van een goed vast te kunnen stellen, in geval van:

      a. verdenking van een misdrijf waarvoor voorlopige hechtenis is toegelaten;

      b. aanwijzingen van een terroristisch misdrijf.

      2 Het bevel, bedoeld in het eerste lid vermeldt, behalve de gegevens, bedoeld in [artikel 177h][ref1], tevens de
      plaats waarop het bevel betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel177h
