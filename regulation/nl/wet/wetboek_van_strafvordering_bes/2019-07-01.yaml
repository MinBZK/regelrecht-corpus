        afdeling: Eerste
  - number: '193'
    text: |-
      De hulpofficieren van justitie doen de processen-verbaal, bij hen ingekomen of door hen opgemaakt, alsmede de
      opgave als benadeelde partij en de inbeslaggenomen voorwerpen onverwijld toekomen aan de officier van justitie.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel193
  - number: '194'
    text: |-
      1 De opsporingsambtenaren, die geen hulpofficier van justitie zijn, doen hun processen-verbaal, de aangiften
      of berichten ter zake van strafbare feiten, als ook de opgave als benadeelde partij, met de inbeslaggenomen
      voorwerpen, onverwijld toekomen aan de hulpofficier van justitie, onder wiens rechtstreeks bevel of toezicht zij
      staan.

      2 De officier van justitie kan in bijzondere gevallen gelasten, dat een en ander hem, in afwijking van het eerste
      lid, rechtstreeks zal worden toegezonden.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel194
  - number: '195'
    text: |-
      Onverminderd het bepaalde in bijzondere wettelijke regelingen doen de personen, bedoeld in [artikel 185][ref1],
      hun processen-verbaal, de aangiften of berichten ter zake van strafbare feiten, alsmede de opgave als benadeelde
      partij, met de inbeslaggenomen voorwerpen, onverwijld toekomen aan de officier van justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel185
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel195
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '185'
        afdeling: Eerste
  - number: '196'
    text: |-
      Na overeenkomstig de [artikelen 192 tot en met 195][ref1] te hebben gehandeld, wachten de hulpofficieren van
      justitie en de overige opsporingsambtenaren de nadere bevelen van de officier van justitie af; gedoogt het belang
      van het onderzoek zodanig afwachten niet, dan zetten zij het onderzoek inmiddels voort en winnen zij nadere
      inlichtingen in, die de zaak tot meer klaarheid kunnen brengen. Van dit onderzoek en de ingewonnen inlichtingen
      doen zij blijken bij proces-verbaal, waarmee zij handelen overeenkomstig de [artikelen 193][ref2], [194][ref3]
      of [195][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel192
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel193
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel194
      [ref4]: https://wetten.overheid.nl/BWBR0028681#Artikel195
