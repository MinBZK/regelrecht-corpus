  - number: '579'
    text: |-
      Van elke beslissing naar aanleiding van een verzoek van een autoriteit van een vreemde staat, genomen krachtens een
      van de [artikelen 575 tot en met 578][ref1], wordt onverwijld door of door tussenkomst van de procureur-generaal
      kennis gegeven aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel575
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel579
