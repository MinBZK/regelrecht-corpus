      1 Indien de verdachte in het geding in eerste aanleg bij het uitspreken van het vonnis tegenwoordig is, geeft
      de rechter hem daarbij mondeling kennis van het rechtsmiddel, dat tegen het vonnis openstaat, en van de termijn
      waarbinnen dat rechtsmiddel kan worden aangewend.

      2 In hoger beroep geeft de voorzitter de verdachte op gelijke wijze kennis van diens bevoegdheid cassatie in te
      stellen bij de Hoge Raad der Nederlanden.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel409
  - number: '410'
    text: |-
      1 Het vonnis wordt binnen tweemaal vierentwintig uren na de uitspraak ondertekend door de rechter of rechters die
      over de zaak hebben geoordeeld, en door de griffier die bij de uitspraak tegenwoordig is geweest.

      2 Zo een of meer van hun daartoe buiten staat zijn, wordt hiervan aan het slot van het vonnis melding gemaakt.

      3 Zodra het vonnis is getekend en in ieder geval na afloop van de termijn waarbinnen enig rechtsmiddel openstaat,
      kan de verdachte of zijn raadsman daarvan en van het proces-verbaal van de terechtzitting kennisnemen.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel410
  - number: '411'
    text: |-
      1 Indien de verdachte bij het vonnis bij verstek gewezen, niet van de gehele tenlastelegging is
      vrijgesproken, wordt een mededeling van de beslissing door het Hof overeenkomstig de [artikelen 393][ref1],
      [395, eerste lid][ref2], of [396, tweede lid][ref3], gegeven, vanwege de procureur-generaal zo spoedig mogelijk
      aan de verdachte betekend. Deze bepaling geldt niet ten aanzien van de verdachte aan wie voor zover betreft het
      rechtsgeding bij verstek, de dagvaarding om ter terechtzitting te verschijnen in persoon is betekend. De mededeling
      vermeldt de rechters die het vonnis hebben gewezen, de dagtekening van het vonnis, de in het vonnis voorkomende
      rechtskundige benaming van het strafbare feit met vermelding omstreeks welke tijd en waar ter plaatse dat feit
      begaan zou zijn, en, voor zover in het vonnis vermeld, naam en voornamen, leeftijd, geboorteplaats, beroep en woon-
      of verblijfplaats van de verdachte.

      2 De mededeling wordt in alle gevallen waarin de procureur-generaal dit bepaalt, en overigens zoveel mogelijk, aan
      de verdachte in persoon betekend.

      3 Is ten aanzien van de verdachte [artikel 17a van het Wetboek van Strafrecht BES][ref4] toegepast, dan vermeldt
      de mededeling bovendien alle beslissingen die betrekking hebben op het in dat artikel bedoelde bevel, alsmede het
      tijdstip waarop ingevolge [artikel 17b, tweede lid, van het Wetboek van Strafrecht BES][ref5] de proeftijd zal
      ingaan, terwijl de betekening niet anders geschiedt dan aan de verdachte in persoon.

      4 De mededeling vindt eveneens plaats, indien de dagvaarding om ter terechtzitting te verschijnen de verdachte
      in persoon is betekend of de verdachte ter terechtzitting is verschenen, maar nadien het onderzoek op de
      terechtzitting voor onbepaalde tijd is geschorst en de oproeping om op de nadere terechtzitting te verschijnen
      niet aan de verdachte in persoon is betekend en hij evenmin op de nadere zitting is verschenen. Het derde lid is
      van toepassing.


