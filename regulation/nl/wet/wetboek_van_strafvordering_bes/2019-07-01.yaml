  - number: 177ke
    text: |-
      Degene tot wie een vordering als bedoeld in de [artikelen 177r, derde lid][ref1], [177s][ref2] en [177t][ref3] of
      een bevel als bedoeld in [artikel 177v][ref4] is gericht neemt in belang van het onderzoek geheimhouding in acht
      omtrent al hetgeen hem terzake van de vordering bekend is.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel177r
