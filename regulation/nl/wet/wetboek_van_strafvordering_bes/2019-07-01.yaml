      - id: ref7
        bwb_id: BWBR0028681
        artikel: '440'
  - number: '466'
    text: |-
      De beslissingen van het Hof, genoemd in de [artikelen 456][ref1], [457][ref2], [461][ref3] en [465][ref4],
      worden zodra mogelijk vanwege de procureur-generaal aan de belanghebbende schriftelijk meegedeeld en in afschrift
      toegezonden aan de ambtenaar belast met de tenuitvoerlegging van het gewijsde waarvan de herziening is gevraagd, of
      van het vernietigde vonnis.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel456
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel457
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel461
      [ref4]: https://wetten.overheid.nl/BWBR0028681#Artikel465
