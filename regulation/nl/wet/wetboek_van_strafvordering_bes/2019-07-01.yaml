  - number: '630'
    text: |-
      1 Op voorwerpen en vorderingen van de veroordeelde die niet op grond van [artikel 119a][ref1] in beslag zijn
      genomen geschiedt verhaal krachtens een dwangbevel medebrengende het recht om die goederen zonder vonnis aan te
      tasten.

      2 Het dwangbevel wordt in naam van de Koning uitgevaardigd door het openbaar ministerie. Het wordt ten uitvoer
      gelegd als een vonnis van de burgerlijke rechter.

      3 De tenuitvoerlegging van het dwangbevel kan niet worden geschorst dan door een verzet, dat evenwel nimmer
      gericht zal kunnen zijn tegen het vonnis waarbij de geldboete werd opgelegd. Verzet wordt gedaan bij een met
      redenen omkleed bezwaarschrift, dat voor de verkoop en uiterlijk binnen zeven dagen te rekenen van de dag van
      de inbeslagneming, wordt ingediend bij het gerecht waartoe de rechter behoort, die de straf heeft opgelegd.
      Het gerecht geeft binnen zeven dagen, na zo nodig de veroordeelde en de ambtenaar die het dwangbevel heeft
      uitgevaardigd, te hebben gehoord, althans daartoe behoorlijk te hebben opgeroepen om te verschijnen, zijn met
      redenen omklede beschikking, die onverwijld aan de veroordeelde wordt betekend.

      4 Ten aanzien van derden, die bij een inbeslagneming van goederen daarop geheel of gedeeltelijk recht menen te
      hebben, zijn de bepalingen van het [Wetboek van Burgerlijke Rechtsvordering BES][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel119a
      [ref2]: https://wetten.overheid.nl/BWBR0028496
