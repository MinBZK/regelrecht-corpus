        artikel: 503b
  - number: '151'
    text: |-
      1 De belanghebbenden, andere dan de veroordeelde, kunnen zich schriftelijk beklagen over de verbeurdverklaring
      van hun toebehorende voorwerpen of over de onttrekking van zodanige voorwerpen aan het verkeer. Geen beklag staat
      open, indien het bedrag, waarop de verbeurdverklaarde voorwerpen bij de uitspraak zijn geschat, is betaald of
      ingevorderd, dan wel vervangende vrijheidsstraf is toegepast.

      2 Het klaagschrift wordt, binnen drie maanden nadat de beslissing uitvoerbaar is geworden, ingediend ter griffie
      van het gerecht dat in hoogste feitelijke aanleg de beslissing heeft genomen.

      3 Het gerecht behandelt het klaagschrift in het openbaar.

      4 Tijdens de behandeling van het klaagschrift worden de klager en het openbaar ministerie in de gelegenheid gesteld
      te worden gehoord. De beschikking van het gerecht is met redenen omkleed en wordt in het openbaar uitgesproken. Aan
      de klager wordt door de griffier tijdig te voren schriftelijk mededeling gedaan van de dag der uitspraak.

      5 Acht het gerecht het beklag gegrond, dan herroept het de verbeurdverklaring of de onttrekking aan het verkeer en
      geeft een last, als bedoeld in [artikel 397][ref1].

      6 Bij de herroeping van een verbeurdverklaring kan het gerecht de voorwerpen aan het verkeer
      onttrokken verklaren, indien zij daarvoor vatbaar zijn. De [artikelen 35a][ref2], [35b][ref3] en
      [37, laatste zinsnede, van het Wetboek van Strafrecht BES][ref4] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel397
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel35a
      [ref3]: https://wetten.overheid.nl/BWBR0028570#Artikel35b
      [ref4]: https://wetten.overheid.nl/BWBR0028570#Artikel37
