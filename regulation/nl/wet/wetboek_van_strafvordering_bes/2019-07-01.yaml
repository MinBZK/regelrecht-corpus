  - number: '282'
    text: |-
      1 De verdachte kan na de hem betekende kennisgeving van niet verdere vervolging, na zijn buitenvervolgingstelling
      of na de hem betekende beschikking houdende de verklaring dat de zaak geëindigd is, ter zake van hetzelfde feit
      niet weer in rechte worden betrokken, tenzij nieuwe bezwaren zijn bekend geworden.

      2 Als nieuwe bezwaren kunnen enkel worden aangemerkt verklaringen van getuigen of van de verdachte en stukken,
      bescheiden en processen-verbaal, die later zijn bekend geworden of niet zijn onderzocht.

      3 In dat geval kan de verdachte niet ter terechtzitting van de rechter in eerste aanleg worden gedagvaard, dan na
      een ter zake van die nieuwe bezwaren ingesteld gerechtelijk vooronderzoek.

      4 Bij verzuim van een termijn, als bedoeld in de [artikelen 272 tot en met 278][ref1], kan de verdachte ter zake
      van hetzelfde feit niet weer in rechte worden betrokken dan onder de voorwaarden, in eerste tot en met derde lid
      bepaald. Echter kan het gerecht, voor hetwelk de zaak het laatst werd vervolgd, op de vordering van de officier
      van justitie, deze alsnog eenmaal een nieuwe termijn stellen, indien het algemeen belang dat dringend eist. De
      verdachte wordt op de vordering gehoord. [Artikel 277, tweede lid][ref2], is van toepassing.

      5 Verzuim van een termijn voor verdere vervolging of kennisgeving van niet verdere vervolging wordt niet aanwezig
      geacht, indien een tijdig uitgebrachte dagvaarding om ter terechtzitting te verschijnen, vervalt of wordt
      ingetrokken of nietig verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel272
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel277
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel282
