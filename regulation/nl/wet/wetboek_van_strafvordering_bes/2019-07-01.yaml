    text: |-
      1 Ingeval een straf of maatregel wordt opgelegd kan de rechter ter bepaling daarvan als bijzondere reden een in de
      processtukken aangeduid, doch niet tenlastegelegd strafbaar feit in aanmerking nemen, indien:

      a. ervan mag worden uitgegaan, dat tegen de verdachte ter zake van dat feit geen vervolging meer zal worden
      ingesteld, en

      b. op grond van de, in enig wettig bewijsmiddel vastgelegde dan wel ter terechtzitting gedane, erkenning van de
      verdachte te dier zake aannemelijk is geworden, dat hij dat feit heeft begaan.

      2 Het is de rechter niet toegestaan om de in het eerste lid bedoelde feiten in aanmerking te nemen, indien:

      a. die feiten wat betreft hun aard zodanig verschillen van het tenlastegelegde feit, dat daarin voor de bestraffing
      wezenlijk nieuwe gezichtspunten naar voren komen, dan wel door de ernst daarvan of door hun aantal de straf of
      maatregel in verregaande mate zouden beïnvloeden;

      b. bij het onderzoek ter terechtzitting blijkt, dat de verdachte zijn aanvankelijke erkenning niet langer
      handhaaft, dan wel daarop terug wenst te komen;

      c. de zaak bij verstek wordt behandeld en door het openbaar ministerie is verzuimd tijdig voor de aanvang van de
      terechtzitting aan de verdachte mee te delen, dat hij het voornemen heeft bedoelde feiten aan de rechter voor te
      leggen, opdat deze daarmee bij de strafbepaling rekening kan houden.

      3 Indien ter zake van een niet tenlastegelegd feit, als bedoeld in het eerste lid, inverzekeringstelling of
      voorlopige hechtenis is toegepast en dit feit op de voet van de voorgaande artikelen door de rechter bij de
      strafbepaling in aanmerking is genomen,

      a. vindt het bepaalde in [artikel 31 van het Wetboek van Strafrecht BES][ref1] overeenkomstige toepassing;

      b. dient de rechter op de voet van [artikel 35 van het Wetboek van Strafrecht BES][ref2] een beslissing te geven
      met betrekking tot de terzake inbeslaggenomen voorwerpen.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel35
