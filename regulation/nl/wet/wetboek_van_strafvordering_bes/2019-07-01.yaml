        afdeling: Zesde
  - number: '191'
    text: |-
      1 Ter plaatse waar en binnen de grenzen binnen welke zij bevoegd zijn tot opsporing, zijn hulpofficieren van
      justitie:

      a. [vervallen]

      b. alle ambtenaren van politie in de rang van inspekteur en de daarboven gelegen rangen;

      c. de ambtenaren van de recherche;

      d. de door Onze Minister van Justitie aan te wijzen hoofdagenten van politie, met uitzondering van het personeel
      van de politie, dat is aangesteld om uitsluitend werkzaamheden te verrichten ten behoeve van de inlichtingen- en
      veiligheidsdiensten; hun bevoegdheden als hulpofficier kunnen door de officier van justitie, hoofd van het parket,
      tot bepaalde taken worden beperkt;

      e. de officieren van de Koninklijke marechaussee;

      f. andere door Onze Minister van Justitie aangewezen personen.

      2 De hulpofficieren van justitie zijn gehouden alle inlichtingen te verstrekken en onderzoek te bewerkstelligen als
      door de officier van justitie wordt gevorderd.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel191
  - number: '192'
    text: |-
      Kan het optreden van de officier van justitie niet worden afgewacht, dan hebben ook de hulpofficieren de
      bevoegdheden bij de [artikelen 188][ref1] en [189][ref2] beschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel188
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel189
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel192
