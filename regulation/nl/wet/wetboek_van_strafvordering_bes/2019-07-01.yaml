  - number: '402'
    text: |-
      1 Het vonnis bevat het tenlastegelegde alsmede de vordering van de procureur-generaal.

      2 De beslissingen vermeld in de [artikelen 393][ref1] en [401, tweede en derde lid][ref2], zijn met redenen
      omkleed. Het vonnis geeft, indien de beslissing afwijkt van door de verdachte dan wel door de procureur-generaal
      uitdrukkelijk onderbouwde standpunten, in het bijzonder de redenen op die daartoe hebben geleid.

      3 De beslissing dat het feit door de verdachte is begaan, moet steunen op de inhoud van in het vonnis opgenomen
      bewijsmiddelen, houdende daartoe redengevende feiten of omstandigheden.

      4 Het vonnis geeft in het bijzonder de redenen op, die de straf hebben bepaald of tot de maatregel hebben geleid.

      5 Bij de oplegging van een straf of maatregel die vrijheidsontneming meebrengt, geeft het vonnis in het bijzonder
      de redenen op die tot de keuze van deze strafsoort, dan wel tot deze soort maatregel hebben geleid. Het vonnis
      geeft voorts zoveel mogelijk de omstandigheden aan, waarop bij de vaststelling van de duur van de straf is gelet.

      6 Indien een zwaardere straf wordt opgelegd dan de procureur-generaal heeft gevorderd, dan wel een straf
      onvoorwaardelijk wordt opgelegd die vrijheidsontneming van langere duur meebrengt dan de procureur-generaal heeft
      gevorderd, geeft het vonnis steeds in het bijzonder de redenen op die daartoe hebben geleid. Hetzelfde geldt
      ingeval het Hof een zwaardere straf of maatregel oplegt dan de rechter in eerste aanleg heeft opgelegd.

      7 Het vonnis wordt binnen vier maanden na de einduitspraak aangevuld met de in het derde lid bedoelde
      bewijsmiddelen indien de verdachte een rechtsmiddel heeft ingesteld dan wel indien de verdachte of diens raadsman
      daarom verzoekt of de procureur-generaal dit vordert.

      8 Behoudens het gestelde in het derde lid geschiedt alles op straffe van nietigheid.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel393
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel401
