  - number: '584'
    text: |-
      1 Zo spoedig mogelijk na ontvangst van de in [artikel 583][ref1] bedoelde vordering bepaalt de voorzitter van het
      Hof het tijdstip waarop het Hof een aanvang zal maken met de behandeling van de vordering. Tussen de dag waarop de
      mededeling om ter terechtzitting te verschijnen aan de veroordeelde is betekend en die van de terechtzitting moet
      een termijn van ten minste tien dagen verlopen.

      2 Met toestemming van de veroordeelde kan deze termijn worden verkort, mits van deze toestemming uit een
      schriftelijke verklaring blijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel583
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel584
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '583'
        paragraaf: '3'
        afdeling: Derde
  - number: '585'
    text: |-
      De griffier van het Hof doet onverwijld aan de procureur-generaal en aan de veroordeelde mededeling van het
      tijdstip dat voor de behandeling van de vordering is bepaald. Daarbij wordt de veroordeelde, van wie niet blijkt
      dat hij reeds een advocaat heeft, opmerkzaam gemaakt op zijn bevoegdheid een of meer advocaten te kiezen en op de
      mogelijkheden tot toevoeging van een advocaat, alsmede op zijn recht op kennisneming van de processtukken.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel585
  - number: '586'
    text: |-
      1 De procureur-generaal en de veroordeelde zijn bevoegd ten behoeve van het onderzoek dat het Hof ingevolge deze
      titel heeft te verrichten en de beslissingen die het heeft te nemen, getuigen en deskundigen te doen dagvaarden.

      2 De procureur-generaal kan bij met redenen omklede beslissing weigeren getuigen of deskundigen te dagvaarden,
      indien redelijkerwijze moet worden aangenomen dat deze door de veroordeelde zijn opgegeven ten einde ter
      terechtzitting verklaringen af te leggen ter betwisting van feiten als bedoeld in [artikel 588, derde lid][ref1].
      De beslissing wordt onverwijld schriftelijk ter kennis van de veroordeelde gebracht. Hij wordt daarbij opmerkzaam
      gemaakt op het bepaalde in artikel 588, zesde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel588
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel586
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '588'
        paragraaf: '3'
        afdeling: Derde
  - number: '587'
    text: |-
      1 De behandeling van de vordering heeft plaats in tegenwoordigheid van de procureur-generaal. De veroordeelde wordt
      in de gelegenheid gesteld daarbij aanwezig te zijn en kan zich door zijn advocaat doen bijstaan.

      2 De behandeling van de vordering geschiedt in het openbaar, tenzij het Hof op het verzoek van de veroordeelde of
      om gewichtige, in het proces-verbaal van de zitting te vermelden, redenen sluiting van de deuren beveelt.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel587
  - number: '588'
    text: |-
      1 Het Hof onderzoekt de identiteit van de veroordeelde, de ontvankelijkheid van de procureur-generaal, alsmede de
      mogelijkheid van tenuitvoerlegging in de openbare lichamen Bonaire, Sint Eustatius en Saba van de in het buitenland
      gewezen rechterlijke beslissing en de feiten en omstandigheden die voor zijn beslissing van belang zijn.

      2 De procureur-generaal en de veroordeelde en diens advocaat worden in de gelegenheid gesteld ter terechtzitting
      van het Hof te worden gehoord.

      3 Het Hof is gebonden aan de vaststelling van de feiten die de buitenlandse rechter kennelijk aan zijn beslissing
      ten grondslag heeft gelegd. Het treedt niet in een nieuw onderzoek naar deze feiten.

      4 Op punten die niet in deze titel zijn geregeld, vindt het bepaalde in de
      [Tweede Afdeling van Titel IV van het Vijfde Boek][ref1] overeenkomstige toepassing, behoudens het bepaalde omtrent
      het verhoor van getuigen en het houden van een schouw.

      5 Indien getuigen zijn gedagvaard ter verkrijging van inlichtingen omtrent de persoonlijkheid van de
      veroordeelde of indien het Hof het noodzakelijk acht feiten te onderzoeken ter beoordeling van het
      bestaan van gronden die naar het recht van Bonaire, Sint Eustatius en Saba, doch niet naar dat van de
      vreemde staat, de strafbaarheid van het feit of de dader uitsluiten, vindt voorts het bepaalde in de
      [Tweede Afdeling van Titel IV van het Vijfde Boek][ref2] omtrent het verhoor van getuigen overeenkomstige
      toepassing.

      6 Indien de procureur-generaal overeenkomstig [artikel 586, tweede lid][ref3], heeft geweigerd een getuige te
      dagvaarden, kan de veroordeelde het Hof verzoeken alsnog de dagvaarding van de getuige te bevelen. Het Hof gaat
      hiertoe over, indien het van oordeel is dat de procureur-generaal in redelijkheid niet tot zijn beslissing heeft
      kunnen komen.

      7 De procureur-generaal legt, na voorlezing, een conclusie aan het Hof over. Indien de conclusie strekt tot
      bewilliging in de tenuitvoerlegging, omschrijft zij de straf of maatregel die naar het oordeel van de procureur-
      generaal in plaats van de buitenlandse sanctie behoort te worden opgelegd. Tevens vermeldt de procureur-generaal in
      dat geval met welk strafbaar feit naar het recht van Bonaire, Sint Eustatius en Saba het feit op grond waarvan de
      veroordeelde aan een buitenlandse sanctie is onderworpen, overeenkomt.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#AfdelingTweede
      [ref2]: https://wetten.overheid.nl/BWBR0028681#AfdelingTweede
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel586
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel588
