        artikel: '162'
  - number: '164'
    text: |-
      In de gevallen waarin het binnentreden van plaatsen krachtens dit wetboek is toegelaten, geschiedt dit, buiten het
      geval van ontdekking op heterdaad, niet:

      a. in de vergaderruimten van een van de eilandsraden, gedurende de vergadering;

      b. in de ruimten bestemd voor godsdienstoefeningen of bezinningssamenkomsten van levensbeschouwelijke aard,
      gedurende de godsdienstoefening of bezinningssamenkomst;

      c. in de ruimten waarin terechtzittingen worden gehouden, gedurende de terechtzitting.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel164
  - number: '165'
    text: |-
      1 Voor de handhaving van de orde ter gelegenheid van ambtsverrichtingen draagt zorg de voorzitter van het college,
      of de rechter of ambtenaar, die met de leiding van die verrichtingen is belast.

      2 Deze is bevoegd de maatregelen te nemen die in het belang van het onderzoek of in het belang van de veiligheid
      van personen geboden zijn.

      3 Indien daarbij iemand de orde verstoort of op enigerlei wijze hinderlijk is, kan de betrokken voorzitter, rechter
      of ambtenaar, na hem zo nodig te hebben gewaarschuwd, bevelen dat hij zal vertrekken en, in geval van weigering,
      hem doen verwijderen en tot de afloop van de ambtsverrichtingen doen ophouden.

      4 Van een en ander wordt een proces-verbaal opgemaakt, dat bij de processtukken wordt gevoegd.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel165
  - number: '166'
    text: |-
      1 In geval van een schouw of huiszoeking kan de daarmee belaste rechter of ambtenaar de nodige maatregelen tot
      bewaking of afsluiting nemen en bevelen dat niemand zich, zonder zijn uitdrukkelijke bewilliging, van de plaats van
      de schouw of van de huiszoeking zal verwijderen, zolang het onderzoek aldaar niet is afgelopen.

      2 [Artikel 165, derde en vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel165
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel166
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '165'
  - number: '175'
    text: |-
      Indien het noodzakelijk is, dat een onderzoek naar de geestvermogens van een verdachte tegen wie voorlopige
      hechtenis is bevolen, zal worden ingesteld en dit niet voldoende op een andere wijze kan plaatsvinden, kan de
      rechter-commissaris, hetzij op de vordering van de officier van justitie, hetzij op het verzoek van de verdachte
      of diens raadsman, bevelen, dat de verdachte ter waarneming zal worden overgebracht naar een in het bevel aan te
      duiden inrichting tot verpleging of genezing bestemd.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel175
  - number: '176'
    text: |-
      1 Het bevel, bedoeld in [artikel 175][ref1], is met redenen omkleed en wordt niet gegeven, dan nadat het oordeel
      van een of meer deskundigen is ingewonnen en de verdachte en zijn raadsman terzake zijn gehoord. De rechter-
      commissaris nodigt de officier van justitie uit bij het horen tegenwoordig te zijn.

      2 Het bevel, houdende last tot overbrenging, en dat waarbij een daartoe strekkend verzoek van de verdachte is
      afgewezen, worden deze onverwijld betekend.

      3 De verdachte kan van die bevelen binnen drie dagen na de betekening in hoger beroep komen bij het Hof van
      Justitie.

      4 Het Hof kan, ook in geval van hoger beroep van de officier van justitie, alvorens te beslissen, door de rechter-
      commissaris een nader onderzoek doen instellen en zich daartoe de betrekkelijke stukken doen overleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel175
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel176
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '175'
  - number: '177'
    text: |-
      1 Het verblijf in de inrichting geldt als voorlopige hechtenis, mag de termijn van acht weken niet te boven gaan en
      eindigt, zodra de verdachte in vrijheid moet worden gesteld.

      2 De rechter-commissaris kan, hetzij ambtshalve, hetzij op de vordering van de officier van justitie of op het
      verzoek van de verdachte of diens raadsman, te allen tijde bevelen, dat het verblijf in de inrichting een einde
      zal nemen.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel177
  - number: 177a
    text: |-
      1 In geval van verdenking van een misdrijf, waarop naar de wettelijke omschrijving gevangenisstraf van ten
      hoogste vier of meer jaren is gesteld, of een misdrijf, waardoor op geld waardeerbaar voordeel van enig belang kan
      worden verkregen, kan overeenkomstig de bepalingen van deze Titel een strafrechtelijk financieel onderzoek worden
      ingesteld.

      2 Een strafrechtelijk financieel onderzoek is gericht op de bepaling van het door de
      verdachte wederrechtelijk verkregen voordeel, met het oog op de ontneming daarvan op grond van
      [artikel 38e van het Wetboek van Strafrecht BES][ref1].

      3 Het strafrechtelijk financieel onderzoek wordt ingesteld krachtens een met redenen omklede machtiging van de
      rechter-commissaris, op vordering van de officier van justitie die met de opsporing van het misdrijf is belast,
      verleend.

      4 De vordering van de officier van justitie is met redenen omkleed. Bij de vordering wordt een lijst van voorwerpen
      overgelegd die reeds op grond van [artikel 119a, tweede lid][ref2], in beslag zijn genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel38e
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel119a
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel177a
