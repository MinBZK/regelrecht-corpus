  - number: 177l
    text: |-
      1 De officier van justitie kan in het belang van het onderzoek bevelen dat een opsporingsambtenaar een persoon
      planmatig observeert in geval van:

      a. verdenking van een misdrijf waarvoor voorlopige hechtenis is toegelaten;

      b. aanwijzingen van een terroristisch misdrijf.

      2 De officier van justitie kan in het belang van het onderzoek, indien het een misdrijf betreft als bedoeld
      in het eerste lid, onderdeel a, dat gezien zijn aard of de samenhang met andere vermoedelijk door de verdachte
      begane misdrijven een ernstige inbreuk op de rechtsorde oplevert en indien het een misdrijf betreft als bedoeld
      in onderdeel b, bepalen dat ter uitvoering van het bevel een besloten plaats, niet zijnde een woning, kan worden
      betreden zonder toestemming van de rechthebbende.

      3 De officier van justitie kan in het belang van het onderzoek bepalen dat ter uitvoering van het bevel een
      technisch hulpmiddel kan worden aangewend, voor zover daarmee geen vertrouwelijke communicatie wordt opgenomen. Een
      technisch hulpmiddel wordt niet op een persoon bevestigd, tenzij met diens toestemming.

      4 Het bevel wordt gegeven voor een periode van ten hoogste zes weken. De geldigheidsduur kan telkens voor een
      periode van zes weken worden verlengd.

      5 Het bevel tot planmatige observatie vermeldt, behalve de gegevens bedoeld in [artikel 177h][ref1], tevens:

      a. de naam of een zo nauwkeurig mogelijke aanduiding van de in het eerste lid bedoelde persoon;

      b. bij toepassing van het tweede lid, de feiten of omstandigheden waaruit blijkt dat de voorwaarden, bedoeld in dat
      lid, zijn vervuld, alsmede de plaats die zal worden betreden.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel177h
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel177l
