  - number: '639'
    text: |-
      Indien de rechter de identiteit niet aanneemt, gelast hij de invrijheidstelling. In het andere geval wordt de
      tenuitvoerlegging geacht te zijn aangevangen op het ogenblik van de vrijheidsontneming.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel639
  - number: '640'
    text: |-
      1 De vonnissen houdende beslissingen omtrent de identiteit, zijn vatbaar voor zodanig beroep als tegen de vonnissen
      waarbij over het strafbare feit uitspraak werd gedaan, openstond.

      2 Het beroep wordt naar de gewone regelen ingesteld en behandeld. Het onderzoek en de beslissing geschieden
      overeenkomstig de [Vierde Titel van het Vijfde Boek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028681
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel640
    references:
      - id: ref1
        bwb_id: BWBR0028681
  - number: '641'
    text: |-
      Ten aanzien van personen die tot het ondergaan van enige maatregel zijn aangehouden, vindt deze afdeling
      overeenkomstig toepassing, met dien verstande, dat, indien de identiteit wordt aangenomen, tot toepassing van de
      maatregel wordt overgegaan.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel641
  - number: '642'
    text: |-
      De kennisgeving van gerechtelijke mededelingen aan natuurlijke personen, als in dit wetboek en het
      [Wetboek van Strafrecht BES][ref1] voorzien, geschiedt, tenzij bij wettelijke regeling anders is bepaald of
      toegelaten, door toezending van een gewone of aangetekende brief over de post.


      [ref1]: https://wetten.overheid.nl/BWBR0028570
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel642
    references:
      - id: ref1
        bwb_id: BWBR0028570
  - number: '643'
    text: |-
      1 Betekening van gerechtelijke mededelingen vindt alleen plaats in de gevallen bij wettelijke regeling bepaald.

      2 Dagvaardingen en aanzeggingen die aan het openbaar ministerie zijn opgedragen, worden steeds betekend.

      3 In alle gevallen waarin een gerechtelijke mededeling moet worden betekend, geschiedt de betekening door
      uitreiking van een gerechtelijk schrijven.

      4 De uitreiking van het gerechtelijk schrijven, als bedoeld in het derde lid, wordt door het openbaar ministerie
      opgedragen aan een deurwaarder of ambtenaar van politie.

      5 Ingeval de met de betekening belaste ambtenaar noch de verdachte, noch een van diens huisgenoten aan zijn woon-
      of verblijfplaats aantreft, zal hij een afschrift van het gerechtelijk schrijven terstond terhandstellen aan de
      officier van justitie bij het gerecht in eerste aanleg waar de rechter waarvoor gedagvaard wordt, zitting houdt.
      De officier van justitie zal het oorspronkelijk schrijven voor gezien tekenen en het afschrift zo mogelijk aan de
      verdachte doen toekomen, zonder dat van ontvangst door deze in rechte zal behoeven te blijken.

      6 Indien de verdachte geen bekende woon- of verblijfplaats in de openbare lichamen Bonaire, Sint Eustatius en Saba
      heeft, geschiedt de betekening van het gerechtelijk schrijven door middel van aanplakking van het afschrift aan het
      gebouw, waar de rechter waarvoor gedagvaard wordt, zitting houdt.

      7 Bij bekende verblijfplaats van de verdachte in het buitenland wordt het gerechtelijk schrijven door tussenkomst
      van de procureur-generaal aan zijn ambtgenoot in het andere land ter betekening verzonden.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel643
  - number: '644'
    text: |-
      De uitreiking geschiedt:

      a. aan hen die in de openbare lichamen Bonaire, Sint Eustatius en Saba in verband met de strafzaak waarop het uit
      te reiken stuk betrekking heeft, rechtens hun vrijheid is ontnomen: in persoon;

      b. aan alle anderen: in persoon of, indien betekening in persoon niet is vereist en het stuk wordt aangeboden
      in de openbare lichamen Bonaire, Sint Eustatius en Saba aan hun woon- of verblijfplaats en zij daar niet worden
      aangetroffen, aan degene die zich in het huis bevindt en die zich bereid verklaart om het stuk onverwijld aan hem
      voor wie het bestemd is te doen toekomen. Onder woon- of verblijfplaats wordt mede begrepen het adres waarop de
      persoon voor wie het schrijven bestemd is op de dag van aanbieding stond ingeschreven in het bevolkingsregister.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel644
  - number: '645'
    text: |-
      In het belang van een goede uitvoering van de [artikelen 642][ref1], [643][ref2] en [644][ref3] kunnen bij of
      krachtens algemene maatregel van bestuur nadere voorschriften worden gegeven.


