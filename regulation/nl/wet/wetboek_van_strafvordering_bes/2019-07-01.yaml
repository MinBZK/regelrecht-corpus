      Indien het openbaar ministerie overeenkomstig [artikel 76 van het Wetboek van Strafrecht BES][ref1] voorwaarden
      stelt ter voorkoming van de strafvervolging, bepaalt het daarbij de termijn waarbinnen aan die voorwaarden moet
      zijn voldaan, en zo nodig tevens de plaats waar dat moet geschieden. De gestelde termijn kan worden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel76
