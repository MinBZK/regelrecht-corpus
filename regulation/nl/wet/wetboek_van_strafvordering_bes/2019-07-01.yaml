      1 Indien het bewijs mede wordt aangenomen op de verklaring van één getuige als bedoeld bij
      [artikel 250, tweede lid][ref1], of van een getuige, die is verhoord op de voet van het bepaalde in
      [artikel 261][ref2], geeft het vonnis daarvan in het bijzonder reden.

      2 Indien na schorsing van de vervolging wegens een geschilpunt van burgerlijk recht van de uitspraak van de
      burgerlijke rechter wordt afgeweken, geeft het vonnis ook daarvan in het bijzonder reden.

      3 Alles op straffe van nietigheid.


