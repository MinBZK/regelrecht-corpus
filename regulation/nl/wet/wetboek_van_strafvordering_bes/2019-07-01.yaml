  - number: '591'
    text: |-
      1 Indien het Hof, de tenuitvoerlegging toelaatbaar acht, verleent het verlof tot tenuitvoerlegging van de
      buitenlandse rechterlijke beslissing en legt, met inachtneming van het daaromtrent in het toepasselijke verdrag
      voorgeschrevene, de straf of maatregel op, die op het overeenkomstige feit naar het recht van Bonaire, Sint
      Eustatius en Saba is gesteld. De uitspraak van het Hof wordt met redenen omkleed. De uitspraak geeft voorts
      de bijzondere redenen op, die de straf hebben bepaald of tot de maatregel hebben geleid en voorts zoveel
      mogelijk de omstandigheden, waarop bij de vaststelling van de duur of de hoogte van de straf is gelet. De
      [artikelen 388][ref1], [390][ref2], [391][ref3], [400][ref4], [407, tweede en derde lid][ref5], en [410][ref6] zijn
      van toepassing.

      2 Bij het opleggen van tijdelijke gevangenisstraf of hechtenis beveelt het Hof, dat de tijd gedurende welke
      aan de veroordeelde in de vreemde staat ter uitvoering van de hem aldaar opgelegde sanctie, met het oog op zijn
      overbrenging naar Bonaire, Sint Eustatius en Saba en uit hoofde van deze titel zijn vrijheid ontnomen is geweest,
      bij de uitvoering van de straf geheel in mindering zal worden gebracht.

      3 Het Hof zendt aan Onze Minister van Justitie onverwijld een gewaarmerkt afschrift van zijn uitspraak toe.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel388
