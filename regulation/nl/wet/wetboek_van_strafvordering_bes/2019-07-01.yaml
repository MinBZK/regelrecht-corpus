  - number: 579b
    text: |-
      1 Voor zover een verdrag daarin voorziet kunnen op verzoek van een vreemde staat voorwerpen in beslag worden
      genomen:

      a. ten aanzien waarvan naar het recht van de vreemde staat een tot verbeurdverklaring strekkende sanctie kan worden
      opgelegd;

      b. tot bewaring van het recht tot verhaal voor een tot ontneming van wederrechtelijk verkregen voordeel strekkende
      verplichting tot betaling van een geldbedrag welke naar het recht van de vreemde staat kan worden opgelegd; of

      c. die kunnen dienen om wederrechtelijk verkregen voordeel aan te tonen.

      2 Inbeslagneming, als bedoeld in het eerste lid, onderdelen a en b, kan slechts plaatsvinden, indien blijkens de
      door de vreemde staat bij zijn verzoek verstrekte inlichtingen, door de bevoegde autoriteiten van die staat een
      bevel tot inbeslagneming is gegeven of zou zijn gegeven, indien de desbetreffende voorwerpen zich binnen zijn
      grondgebied zouden bevinden, en inbeslagneming naar het recht van Bonaire, Sint Eustatius en Saba is toegestaan.

      3 Voor de toepassing van het tweede lid is inbeslagneming naar het recht van Bonaire, Sint Eustatius en Saba
      toegestaan, indien zulks ook mogelijk zou zijn geweest wanneer het feit of de feiten naar aanleiding waarvan de
      inbeslagneming door de vreemde staat wordt verzocht in de openbare lichamen Bonaire, Sint Eustatius en Saba zou of
      zouden zijn begaan.

      4 Inbeslagneming van voorwerpen, als bedoeld in het eerste lid, onderdelen a en b, kan voorts slechts plaatsvinden,
      indien gegronde redenen bestaan voor de verwachting dat ten aanzien van die voorwerpen vanwege de verzoekende
      vreemde staat een verzoek tot tenuitvoerlegging van een verbeurdverklaring of van een tot ontneming van
      wederrechtelijk verkregen voordeel strekkende sanctie zal worden gedaan.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel579b
  - number: 579c
    text: |-
      1 Voor zover een verdrag daarin voorziet kunnen voorwerpen, ten aanzien waarvan door een rechter van een vreemde
      staat een bevel is gegeven van vergelijkbare strekking als verbeurdverklaring of ontneming als wederrechtelijk
      verkregen voordeel, op verzoek van de vreemde staat in beslag worden genomen.

      2 Inbeslagneming overeenkomstig het eerste lid kan slechts plaatsvinden in gevallen, waarin gegronde redenen
      bestaan voor de verwachting dat het in dat lid bedoelde bevel op korte termijn in de openbare lichamen Bonaire,
      Sint Eustatius en Saba zal worden tenuitvoergelegd.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel579c
  - number: 579d
    text: |-
      1 Tot inbeslagneming als bedoeld in de [artikelen 579b][ref1] en [579c][ref2] zijn bevoegd de rechter-commissaris
      en, voor zover die bevoegdheden niet aan de rechter-commissaris is voorbehouden, de procureur-generaal. Op
      vordering van de procureur-generaal kan de rechter-commissaris de bevoegdheden uitoefenen, die hem uit hoofde van
      een gerechtelijk vooronderzoek toekomen.

      2 Ten aanzien van het eerste lid zijn de [artikelen 119b tot en met 119d][ref3], [122][ref4],
      [125 tot en met 145][ref5], [150][ref6], [152][ref7], [153][ref8], [154a][ref9] en [608][ref10]* van
      overeenkomstige toepassing.


