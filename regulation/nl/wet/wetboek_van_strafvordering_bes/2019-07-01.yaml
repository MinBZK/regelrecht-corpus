  - number: '365'
    text: |-
      1 Onverminderd het bepaalde bij [artikel 366][ref1], wordt in alle gevallen waarin schorsing van het onderzoek
      plaatsheeft, de zaak op de nadere terechtzitting hervat in de stand waarin zij zich op het tijdstip van de
      schorsing bevond. Het Hof is bevoegd te bevelen dat het onderzoek op de terechtzitting opnieuw wordt aangevangen.

      2 In het geval dat het onderzoek opnieuw wordt aangevangen, wordt de verklaring van een getuige die bij het
      voorgaand onderzoek is verhoord, mits op de nadere terechtzitting voorgelezen, als aldaar afgelegd aangemerkt:

      a. indien die getuige overleden is of naar het oordeel van het Hof niet op de nadere terechtzitting heeft kunnen
      verschijnen,

      b. indien die getuige op de nadere terechtzitting is verschenen, doch weigert getuigenis te geven, of

      c. indien met toestemming van de procureur-generaal en de verdachte van zijn verhoor wordt afgezien.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel366
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel365
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '366'
        afdeling: Tweede
  - number: '366'
    text: |-
      1 Indien bij de hervatting van het onderzoek de verdachte tegen wie voor de schorsing verstek is verleend, op de
      terechtzitting voor de nadere behandeling bepaald, verschijnt, of zich in de gevallen, bij wettelijke regeling,
      toegelaten, door een gemachtigde laat vertegenwoordigen, wordt het verleend verstek vervallen verklaard.

      2 Het Hof kan gelasten dat bepaalde handelingen van onderzoek opnieuw zullen plaatsvinden.

      3 Het tweede lid van [artikel 365][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel365
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel366
