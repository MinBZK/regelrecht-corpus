  - number: 579f
    text: |-
      1 Tot het in behandeling nemen van verzoeken als bedoeld in de [artikelen 579a tot en met 579c][ref1], is bevoegd
      de procureur-generaal.

      Verzoeken als bedoeld in het eerste lid worden, zo zij niet tot de procureur-generaal zijn gericht, door de
      geadresseerde onverwijld aan hem doorgezonden.

      Klaagschriften als bedoeld in [artikel 150][ref2], alsmede rechtsgedingen als bedoeld in [artikel 154a][ref3],
      dienen in eerste en laatste instantie te worden aanhangig gemaakt bij Hof.


