  - number: '567'
    text: |-
      1 In gevallen waarin grond bestaat voor het vermoeden, dat de handeling van een inzittende van een luchtvaartuig,
      naar aanleiding waarvan deze na de landing van het luchtvaartuig op Bonaire, Sint Eustatius of Saba ingevolge
      artikel 9, eerste lid, van het Verdrag is overgedragen, een overtreding vormt van een strafbepaling die op
      discriminatie naar ras of godsdienst berust, wordt geen onderzoek ingesteld.

      2 In gevallen waarin grond bestaat voor het vermoeden, dat de in het vorige lid bedoelde handeling een overtreding
      vormt van een strafbepaling van politieke aard, wordt geen onderzoek ingesteld dan krachtens een machtiging van
      Onze Minister van Justitie en slechts na overleg met Onze Minister van Buitenlandse Zaken.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel567
  - number: '568'
    text: |-
      In deze titel wordt verstaan onder:

        - *Onze Minister:* Onze Minister van Justitie;
        - *rechterlijke beslissing:* een bij vonnis of arrest gewezen rechterlijke beslissing naar aanleiding van een
      strafbaar feit;
        - *sanctie:* een bij rechterlijke beslissing opgelegde vrijheidsstraf, met inbegrip van een naast of in plaats van
      een zodanige straf opgelegde vrijheidsbenemende maatregel;
        - *veroordeelde:* degene aan wie een sanctie is opgelegd.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel568
  - number: '569'
    text: |-
      Tenuitvoerlegging in de openbare lichamen Bonaire, Sint Eustatius en Saba van buitenlandse rechterlijke
      beslissingen geschiedt niet dan krachtens een verdrag.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel569
  - number: '570'
    text: |-
      1 Een in een vreemde staat opgelegde sanctie kan in de openbare lichamen Bonaire, Sint Eustatius en Saba slechts
      worden tenuitvoergelegd voor zover:

      a. de rechterlijke beslissing in die staat voor tenuitvoerlegging vatbaar is;

      b. de rechterlijke beslissing is gewezen ter zake van een feit dat naar het recht van Bonaire, Sint Eustatius en
      Saba eveneens strafbaar is;

      c. in geval van veroordeling, de dader naar het recht van Bonaire, Sint Eustatius en Saba eveneens strafbaar zou
      zijn geweest.

      2 Voor de toepassing van het eerste lid is er tevens sprake van een feit dat naar het recht van Bonaire, Sint
      Eustatius en Saba strafbaar is, indien krachtens de wet eenzelfde inbreuk op de rechtsorde van Bonaire, Sint
      Eustatius en Saba, als blijkens de in de vreemde staat gewezen rechterlijke beslissing op de rechtsorde van die
      staat is gemaakt, strafbaar is.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel570
  - number: '571'
    text: |-
      Een in een vreemde staat opgelegde sanctie kan in de openbare lichamen Bonaire, Sint Eustatius en Saba niet worden
      ten uitvoer gelegd, indien deze betrekking heeft op een vreemdeling die geen vaste woon- of verblijfplaats in de
      openbare lichamen Bonaire, Sint Eustatius en Saba heeft, of op een rechtspersoon waarvan het bestuur geen zitting
      of kantoor houdt in de openbare lichamen Bonaire, Sint Eustatius en Saba, of waarvan het hoofd van het bestuur
      geen vaste woonplaats in de openbare lichamen Bonaire, Sint Eustatius en Saba heeft. Deze voorwaarde is niet van
      toepassing voor zover de in de vreemde staat opgelegde sanctie strekt tot de betaling van een geldboete of tot een
      verbeurdverklaring of vermogensontneming van vergelijkbare strekking.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel571
  - number: '572'
    text: |-
      Een in een vreemde staat opgelegde sanctie kan in de openbare lichamen Bonaire, Sint Eustatius en Saba niet worden
      ten uitvoer gelegd, indien naar het oordeel van Onze Minister een gegrond vermoeden bestaat dat de beslissing
      tot vervolging of de oplegging van de sanctie is ingegeven door overwegingen van ras, godsdienst, nationaliteit
      of politieke overtuiging van de veroordeelde of deswege ongunstig is beïnvloed. Onze Minister doet zijn oordeel
      kenbaar maken aan de autoriteiten van die vreemde staat.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel572
  - number: '573'
    text: |-
      1 Een in een vreemde staat opgelegde sanctie kan in de openbare lichamen Bonaire, Sint Eustatius en Saba niet
      worden ten uitvoer gelegd, indien het recht tot uitvoering van de sanctie naar het recht van Bonaire, Sint
      Eustatius en Saba zou zijn verjaard.

      2 Een in een vreemde staat opgelegde sanctie kan in de openbare lichamen Bonaire, Sint Eustatius en Saba niet
      worden ten uitvoer gelegd, indien de veroordeelde ten tijde van het feit waarvoor de sanctie werd opgelegd, de
      leeftijd van twaalf jaren nog niet had bereikt.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel573
  - number: '574'
    text: |-
      1 Een in een vreemde staat opgelegde sanctie kan in de openbare lichamen Bonaire, Sint Eustatius en Saba niet
      worden ten uitvoer gelegd, voor zover de veroordeelde ter zake van hetzelfde feit in de openbare lichamen Bonaire,
      Sint Eustatius en Saba wordt vervolgd.

      2 Een in een vreemde staat opgelegde sanctie kan in de openbare lichamen Bonaire, Sint Eustatius en Saba
      evenmin worden ten uitvoer gelegd, voor zover een vervolging in de openbare lichamen Bonaire, Sint Eustatius
      en Saba onverenigbaar zou zijn met het aan [artikel 70 van het Wetboek van Strafrecht BES][ref1] en
      [artikel 282, eerste lid, van dit Wetboek][ref2] ten grondslag liggende beginsel.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel70
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel282
