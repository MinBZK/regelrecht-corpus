        afdeling: Tweede
      - id: ref3
        bwb_id: BWBR0028681
        artikel: '586'
        paragraaf: '3'
        afdeling: Derde
  - number: '589'
    text: |-
      1 Op vordering van de procureur-generaal kan het Hof ter zitting de gevangenneming van de veroordeelde bevelen op
      de grond genoemd in [artikel 575][ref1]

      2 Voordat het onderzoek ter zitting wordt gesloten, beslist het Hof ambtshalve over de gevangenhouding van de
      veroordeelde wie krachtens deze titel voorlopig zijn vrijheid is ontnomen.

      3 Een krachtens het eerste of tweede lid bevolen vrijheidsontneming blijft van kracht, totdat de uitspraak van het
      Hof voor tenuitvoerlegging vatbaar is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel575
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel589
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '575'
        paragraaf: A
        afdeling: Tweede
  - number: '590'
    text: |-
      1 Bevindt het Hof:

      a. dat de overgelegde stukken niet voldoen aan het door het toepasselijke verdrag gestelde eisen;

      b. dat de veroordeelde zich met vrucht op een grond, die naar het recht van Bonaire, Sint Eustatius en Saba wel,
      doch naar het recht van de vreemde staat niet de strafbaarheid van het feit of de dader uitsluit, had kunnen
      beroepen, en dat hij geen gedwongen psychiatrische verpleging behoeft;

      c. dat de tenuitvoerlegging in de openbare lichamen Bonaire, Sint Eustatius en Saba op grond van het in een van de
      [artikelen 569][ref1], [570][ref2], [571][ref3], [573][ref4] of [574][ref5] bepaalde niet kan plaatshebben; of

      d. dat bij afweging van alle betrokken belangen een beslissing tot tenuitvoerlegging in de openbare lichamen
      Bonaire, Sint Eustatius en Saba in redelijkheid niet kan worden genomen;dan verklaart het de tenuitvoerlegging
      ontoelaatbaar.

      2 De procureur-generaal kan, zolang het onderzoek ter terechtzitting niet is gesloten, zijn vordering intrekken.
      Hij stelt de veroordeelde van het intrekken van de vordering terstond in kennis.

      3 In andere dan de in het eerste en tweede lid voorziene gevallen, verklaart het Hof de tenuitvoerlegging
      toelaatbaar, met vermelding van de toepasselijke wets- en verdragsbepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel569
