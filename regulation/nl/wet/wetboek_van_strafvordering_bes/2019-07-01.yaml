  - number: 177m
    text: |-
      1 In geval van verdenking van een misdrijf waarvoor voorlopige hechtenis is toegelaten, en dat, gezien zijn
      aard of de samenhang met andere vermoedelijk door de verdachte begane misdrijven een ernstige inbreuk op de
      rechtsorde oplevert, kan de officier van justitie, indien het onderzoek dit dringend vordert, bevelen dat een
      opsporingsambtenaar deelneemt of medewerking verleent aan een groep van personen waarbinnen naar redelijkerwijs kan
      worden vermoed misdrijven worden beraamd of gepleegd.

      2 In geval van aanwijzingen van een terroristisch misdrijf kan de officier van justitie, indien het onderzoek dit
      dringend vordert, bevelen dat een opsporingsambtenaar deelneemt of medewerking verleent aan een groep van personen
      ten aanzien waarvan aanwijzingen bestaan dat daarbinnen een terroristisch misdrijf wordt beraamd of gepleegd.

      3 De opsporingsambtenaar brengt bij de uitoefening van het bevel een ander niet tot strafbare feiten dan waarop
      diens opzet reeds tevoren was gericht.

      4 Het bevel tot infiltratie vermeldt, behalve de gegevens, bedoeld in [artikel 177h][ref1], tevens:

      a. een omschrijving van de groep van personen;

      b. de wijze waarop aan het bevel uitvoering moet worden gegeven, daaronder begrepen strafbaar gesteld handelen,
      voor zover bij het geven van het bevel te voorzien.

      5 Toepassing van het eerste en tweede lid vindt alleen plaats na voorafgaande schriftelijke toestemming van de
      procureur-generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel177h
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel177m
