  - number: '413'
    text: |-
      1 Indien normen, daaronder begrepen zowel wettelijk omschreven voorschriften als regels van ongeschreven recht,
      tijdens het voorbereidend onderzoek of het onderzoek ter terechtzitting, ook ingeval de behandeling van de zaak
      door de raadkamer plaatsvindt, zijn geschonden, kan de rechter, hetzij ambtshalve, hetzij op de vordering van het
      openbaar ministerie of het verzoek van de verdachte of diens raadsman, de normschending herstellen, overeenkomstig
      de aard en de strekking van de geschonden norm, dan wel bevelen, dat dit zal geschieden. Hij kan daartoe de nodige
      aanwijzingen geven.

      2 Herstel blijft achterwege, indien de normschending niet meer kan worden hersteld en de rechtsgevolgen daarvan
      reeds uit enige wettelijke regeling voortvloeien.

      3 Indien een termijn die de duur van de vrijheidsbeneming betreft, wordt overschreden, kan zij niet worden
      verlengd, tenzij de rechtsorde door de invrijheidstelling van de verdachte zodanig ernstig zou worden geschokt, dat
      het algemene belang voortzetting van de vrijheidsbeneming bepaaldelijk vordert. Alsdan kan de rechter, uiterlijk
      binnen vierentwintig uren nadat de termijnoverschrijding is vastgesteld, doch niet later dan zeven dagen na het
      verstrijken van de termijn, op de vordering van het openbaar ministerie een nieuwe termijn stellen, doch alleen
      voor zover dit wetboek in een nieuwe termijn voorziet en ook overigens aan de wettelijke vereisten is voldaan.
      Gedurende deze vierentwintig uren blijft het bevel tot vrijheidsbeneming waarvan de termijn is verstreken, van
      kracht.

      4 Kan herstel als bedoeld in het eerste en tweede lid niet plaatsvinden, dan blijft de normschending, behoudens in
      geval van het vijfde lid, zonder gevolgen.

      5 De rechter kan in zijn eindvonnis, hetzij ambtshalve, hetzij op de vordering van het openbaar ministerie of op
      het verzoek van de verdachte of diens raadsman, bij schending van voor de procesvoering wezenlijke normen, na een
      redelijke afweging van alle in het geding zijnde belangen, beslissen, voor zover een bijzondere wettelijke bepaling
      niet reeds in de gevolgen van de normschending voorziet:

      a. dat de hoogte van de straf, in verhouding tot de ernst van de normschending, zal worden verlaagd, indien het
      door de schending veroorzaakte nadeel langs die weg redelijkerwijze kan worden gecompenseerd;

      b. dat de resultaten van het onderzoek, voor zover zij rechtstreeks door middel van de normschending zijn
      verkregen, niet tot het bewijs van het strafbare feit worden toegelaten, indien redelijkerwijze aannemelijk is, dat
      de verdachte door het gebruik van de onderzoeksresultaten ernstig in zijn verdediging is geschaad;

      c. dat het openbaar ministerie niet-ontvankelijk wordt verklaard, indien door toedoen van de normschending er geen
      sprake kan zijn van een behandeling van de zaak, die aan de eisen van een eerlijk proces voldoet.

      6 Indien de rechter van oordeel is, dat er gronden van redelijkheid en billijkheid zijn voor toekenning van
      schadevergoeding, kan hij daartoe, hetzij ambtshalve, hetzij op de vordering van het openbaar ministerie of op het
      verzoek van de verdachte of diens raadsman, bij afzonderlijke beschikking besluiten. Deze bevoegdheid komt toe aan
      de rechter die de zaak ter terechtzitting behandelt, of, als de zaak is geëindigd, voor wie deze het laatst heeft
      gediend. Schadevergoeding kan zowel naast als in de plaats van de in het vijfde lid genoemde beslissingen worden
      toegekend. De [artikelen 181][ref1] en [182][ref2] zijn van overeenkomstige toepassing.

      7 Bij de beoordeling van de normschending en de daaraan te verbinden gevolgen, alsmede bij de afweging van de
      in het geding zijnde belangen houdt de rechter in het bijzonder rekening met het karakter, het gewicht en de
      strekking van de norm, de ernst van de normschending, het nadeel dat daardoor werd veroorzaakt, en de mate van
      verwijtbaarheid van degene die de norm schond.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel181
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel182
