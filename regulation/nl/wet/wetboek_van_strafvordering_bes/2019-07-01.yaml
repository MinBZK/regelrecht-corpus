  - number: '60'
    text: |-
      1 De gekozen raadsman geeft, zolang het opsporingsonderzoek duurt, van zijn optreden als zodanig schriftelijk
      kennis aan de officier van justitie en aan de in de zaak betrokken hulpofficier. Gelijke kennisgeving geschiedt als
      de raadsman niet meer voor een bepaalde verdachte optreedt.

      2 Indien hij een gekozen of toegevoegde raadsman vervangt, geeft hij ook daarvan overeenkomstig het eerste lid
      kennis aan de daar bedoelde personen en aan de vervangen raadsman. Door deze mededeling neemt de werkzaamheid van
      de vervangen toegevoegde of vroeger gekozen raadsman een einde.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel60
  - number: '61'
    text: |-
      1 Tenzij in dit wetboek anders is bepaald, geschiedt toevoeging van een raadsman door een bij algemene maatregel
      van bestuur aangewezen instantie. Bij of krachtens deze maatregel worden regels gesteld omtrent de taakuitoefening
      van deze instantie.

      2 De toevoeging geschiedt zoveel mogelijk in overeenstemming met de voorkeur van de verdachte.

      3 De toevoeging heeft plaats zonder kosten voor de verdachte, behoudens het in de tweede volzin van dit artikellid
      bepaalde.Wanneer zich in de omstandigheden van de verdachte zodanige wijzigingen mochten voordoen dat op grond
      daarvan, naar het oordeel van de instantie die met de toevoeging is belast, aannemelijk kan worden geacht dat de
      verdachte in staat is de kosten van een raadsman zelf te dragen, wordt de kosteloze toevoeging beëindigd.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel61
  - number: '62'
    text: |-
      1 Aan iedere verdachte, die in verzekering is gesteld, wordt een raadsman toegevoegd, zodra tegen hem het bevel tot
      inverzekeringstelling wordt verleend, tenzij hij uitdrukkelijk heeft verklaard van het recht op toevoeging afstand
      te doen. De officier van justitie of de hulpofficier van justitie die het bevel heeft verleend, licht onverwijld de
      instantie die met de toevoeging is belast, omtrent de inverzekeringstelling in.

      2 Een toevoeging ingevolge het eerste lid blijft tijdens de voorlopige hechtenis van kracht, tenzij de verdachte
      niet on- of minvermogend is in de zin van de [Wet kosteloze rechtskundige bijstand BES][ref1].

      3 Bij of krachtens algemene maatregel van bestuur worden zoveel mogelijk in overeenstemming met de situatie op de
      eilanden nadere regels gesteld omtrent de toevoeging aan in verzekering gestelde verdachten.


