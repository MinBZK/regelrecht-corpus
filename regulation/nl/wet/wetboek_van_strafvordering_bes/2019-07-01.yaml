  - number: '638'
    text: |-
      Het onderzoek en de beslissing geschieden overeenkomstig de bepalingen van de
      [Vierde Titel van het Vijfde Boek][ref1]. [Artikel 424][ref2] vindt overeenkomstig toepassing.


