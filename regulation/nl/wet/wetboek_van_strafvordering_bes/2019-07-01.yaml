  - number: 177b
    text: |-
      1 Krachtens de ingevolge [artikel 177a][ref1] gegeven machtiging is een met het strafrechtelijk financieel
      onderzoek belaste opsporingsambtenaar op vertoon van een afschrift van de machtiging bevoegd, ten einde inzicht te
      verkrijgen in de vermogenspositie van degenen tegen wie het onderzoek is gericht, aan een ieder te bevelen hem op
      de eerste vordering:

      a. opgave te doen of inzage of afschrift te geven van bescheiden of gegevens;

      b. op te geven of, en zo ja welke, vermogensbestanddelen hij onder zich heeft of heeft gehad, die toebehoren of
      hebben toebehoord aan degene tegen wie het onderzoek is gericht, en aldus verstrekte schriftelijke bescheiden in
      beslag te nemen.

      2 Het bevel wordt niet gericht aan degene tegen wie het onderzoek is gericht.

      3 [Artikel 132, tweede lid][ref2], is van overeenkomstige toepassing.

      4 Ter gelegenheid van het eerste verhoor van degene tegen wie het onderzoek is gericht, wordt hem door de
      verhorende rechter of ambtenaar een afschrift van de in [artikel 177a][ref3] bedoelde vordering en machtiging ter
      hand gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel177a
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel132
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel177a
