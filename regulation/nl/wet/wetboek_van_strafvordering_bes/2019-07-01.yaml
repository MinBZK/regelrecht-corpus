      1 Hij die de verdachte aanhoudt of staande houdt, kan voor inbeslagneming vatbare voorwerpen, door deze met zich
      gevoerd, in beslag nemen.

      2 Met betrekking tot het onderzoek aan het lichaam of de kleding van de aangehouden verdachte gelden de bepalingen
      van [artikel 78][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel78
