  - number: 177i
    text: |-
      1 Een machtiging van de rechter-commissaris als bedoeld in [titel XVIII][ref1] wordt schriftelijk gegeven. Aan een
      schriftelijke machtiging staat gelijk een mondelinge machtiging die, op straffe van nietigheid, binnen drie dagen
      op schrift wordt gesteld.

      2 De machtiging wordt gegeven op schriftelijke vordering van de officier van justitie. Aan een schriftelijke
      vordering staat gelijk een mondelinge vordering die binnen drie dagen op schrift wordt gesteld.

      3 De vordering geeft het voorgenomen bevel kort weer en bevat een uiteenzetting omtrent de redenen welke tot de
      vordering aanleiding hebben gegeven.

      4 De machtiging betreft alle onderdelen van het bevel. Indien ter uitvoering van het bevel een woning mag worden
      betreden, wordt dat uitdrukkelijk in de machtiging vermeld.

      5 Indien voor een bevel van de officier van justitie een machtiging van de rechter-commissaris is vereist, is ook
      voor een wijziging, aanvulling of verlenging van dat bevel een machtiging vereist.

      6 Onverminderd [artikel 53][ref2] worden de in het eerste, tweede en vijfde lid bedoelde documenten bij de
      processtukken gevoegd zodra het onderzoek dit toelaat.


      [ref1]: https://wetten.overheid.nl/BWBR0028681
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel53
