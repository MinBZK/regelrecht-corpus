  - number: '107'
    text: |-
      Indien het Hof van Justitie tot het geven van enige beslissing is geroepen voordat beroep van de einduitspraak is
      aangetekend, wordt daarbij de opheffing van het bevel tot voorlopige hechtenis gelast, indien dit uit de beslissing
      voortvloeit.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel107
  - number: '108'
    text: |-
      1 Na de aantekening van beroep van de einduitspraak worden de in de [artikelen 96 tot en met 103][ref1] bedoelde
      bevelen met overeenkomstige toepassing van die artikelen gegeven door het Hof van Justitie, behoudens de volgende
      afwijkingen.

      2 Onverminderd het in [artikel 97][ref2] bepaalde, kan het Hof ook bij de einduitspraak, niettegenstaande
      een eerder beëindigde voorlopige hechtenis en onverminderd het in de [artikelen 100][ref3] en
      [101, eerste en tweede lid, onderdelen a en b][ref4], bepaalde, de gevangenneming van de verdachte bevelen.

      3 Een bevel tot gevangenneming of gevangenhouding is, na de einduitspraak in eerste aanleg, voor een termijn van
      ten hoogste vijf maanden van kracht. Echter toetst het Hof binnen een termijn van dertig dagen, nadat hoger beroep
      is aangetekend, of de gevallen en de gronden, bedoeld in de [artikelen 100][ref5] en [101][ref6], nog aanwezig
      zijn. Het Hof hoort de verdachte, indien het daartoe gronden aanwezig acht. De termijn van vijf maanden kan, indien
      er gegronde redenen zijn, waarom het onderzoek op de terechtzitting niet binnen deze termijn een aanvang kan nemen,
      door het Hof eenmaal met ten hoogste dertig dagen worden verlengd.

      4 Een bevel tot gevangenneming of gevangenhouding, dat voor het verstrijken van de in het derde lid bedoelde
      termijn door het onderzoek op de terechtzitting is gevolgd, is, evenals een tijdens of na dat onderzoek verleend
      bevel, geldig voor onbepaalde tijd, behoudens invrijheidstelling ingevolge de [artikelen 103][ref7], [105][ref8],
      [107][ref9] en [108, vijfde lid][ref10], totdat de uitspraak in kracht van gewijsde is gegaan, ook ingeval
      tegen de einduitspraak beroep in cassatie is aangetekend of de Hoge Raad de zaak overeenkomstig artikel 14 van
      de Cassatieregeling van Aruba, Curaçao, Sint Maarten en van Bonaire, Sint Eustatius en Saba naar het Hof heeft
      verwezen.

      5 Buiten de gevallen voorzien in [artikel 105][ref11] heft het Hof van Justitie het bevel op met ingang van het
      tijdstip waarop de duur van de ondergane voorlopige hechtenis gelijk wordt aan de duur van de onvoorwaardelijk
      opgelegde vrijheidsstraf, tenzij een maatregel die vrijheidsontneming meebrengt of kan meebrengen onvoorwaardelijk
      is opgelegd.

      6 Voor de toepassing van dit artikel wordt onder de in voorlopige hechtenis doorgebrachte tijd begrepen de tijd
      gedurende welke de verdachte in verzekering was gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel96
