    text: |-
      Degene die schade heeft geleden ten gevolge van de toepassing van een strafvorderlijk dwangmiddel, kan alleen
      krachtens de bepalingen van deze titel, met uitsluiting van enige vordering uit burgerlijk recht, om toekenning van
      schadevergoeding verzoeken.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel182
  - number: '183'
    text: |-
      1 De officier van justitie houdt toezicht op de opsporing van strafbare feiten en kan daartoe aan de personen, die
      met de opsporing van strafbare feiten zijn belast of daartoe bevoegd zijn, de nodige bevelen geven.

      2 Hij heeft de leiding van het gehele voorbereidend onderzoek, onverminderd het in dit wetboek bepaalde omtrent de
      tussenkomst van de rechter-commissaris.

      3 In hoger beroep kan de procureur-generaal rechtstreeks opdracht tot nader onderzoek geven.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel183
  - number: '184'
    text: |-
      1 Tenzij bij of krachtens de wet anders is bepaald, zijn met de opsporing van strafbare feiten belast:

      a. de ambtenaren van politie, bedoeld in
      __REF000___________________________________________________________________________________________________________
      _______________________;

      b. de ambtenaren van de recherche, zoals daarin bij wettelijke regeling is voorzien;

      c. de buitengewone agenten van politie aan wie door Onze Minister van Justitie een akte van opsporingsbevoegdheid
      is verleend dan wel die behoren tot een door deze aangewezen categorieën of eenheden;

      d. de door Onze Minister van Justitie in overeenstemming met Onze Minister van Defensie aangewezen militairen van
      de Koninklijke marechaussee.

      2 Tot de opsporing van strafbare feiten zijn de procureur-generaal en de officieren van justitie bevoegd.

      3 De in het tweede lid genoemde ambtenaren hebben het recht om, in de uitoefening van hun ambtsverrichtingen, de
      openbare burgerlijke macht onmiddellijk in te roepen.

      4 De burgerlijke macht is verplicht aan de vordering onmiddellijk te voldoen.

      5 De opsporingsbevoegdheid strekt zich uit tot de in de akte of aanwijzing aangeduide strafbare feiten: de akte of
      aanwijzing kan bepalen dat de opsporingsbevoegdheid alle strafbare feiten omvat.

      6 Bij of krachtens algemene maatregel van bestuur worden regels gegeven omtrent de verlening van de akte van
      opsporingsbevoegdheid en het doen van de aanwijzing, de reikwijdte van de opsporingsbevoegdheid, het grondgebied
      waarvoor de opsporingsbevoegdheid geldt, de beëdiging en de instructie van de buitengewone agenten van politie,
      het toezicht waaraan zij zijn onderworpen en de wijze waarop Onze Minister van Justitie de opsporingsbevoegdheid
      van afzonderlijke personen kan beëindigen. Voorts kunnen regels worden gegeven over de eisen van bekwaamheid en
      betrouwbaarheid waaraan zij moeten voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0028079#Artikel3
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel184
    references:
      - id: ref1
        bwb_id: BWBR0028079
        artikel: '3'
  - number: '185'
    text: |-
      Met de opsporing van strafbare feiten zijn ook belast zij, aan wier waakzaamheid bij of krachtens bijzondere
      wettelijke regelingen de handhaving of de zorg voor de naleving daarvan of de opsporing van de daarin bedoelde
      strafbare feiten is toevertrouwd, een en ander voor zover het die feiten betreft en, voor zover dat in die regeling
      is bepaald.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel185
  - number: '186'
    text: |-
      1 De opsporingsambtenaren, bedoeld in de [artikelen 184, eerste lid][ref1], en [185][ref2], maken ten spoedigste
      proces-verbaal op van het door hen opgespoorde strafbare feit of van hetgeen door hen tot opsporing is verricht of
      bevonden. Het proces-verbaal wordt door hen opgemaakt op hun ambtseed of -belofte. Voor zover zij die niet hebben
      afgelegd, worden zij binnen tweemaal vier en twintig uren beëdigd dan wel wordt hun binnen die termijn de belofte
      afgenomen voor een hulpofficier van justitie, die daarvan een verklaring op het proces-verbaal stelt.

      2 De processen-verbaal worden door de opsporingsambtenaren persoonlijk opgemaakt, gedagtekend en ondertekend.
      Daarbij moeten tevens zoveel mogelijk uitdrukkelijk worden opgegeven de redenen van wetenschap.

      3 Wanneer de opsporing door een officier van justitie persoonlijk geschiedt, doet hij van zijn bevindingen blijken
      bij proces-verbaal opgemaakt op zijn ambtseed of -belofte. Daarbij moeten tevens zoveel mogelijk uitdrukkelijk
      worden opgegeven de redenen van wetenschap.

      4 Indien de procureur-generaal zijn bevoegdheid tot opsporing uitoefent, vindt hetgeen ten aanzien van de officier
      van justitie is bepaald zo veel mogelijk overeenkomstig toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel184
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel185
