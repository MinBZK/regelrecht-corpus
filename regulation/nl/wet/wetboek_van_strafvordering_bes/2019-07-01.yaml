  - number: 177kd
    text: |-
      Bij algemene maatregel van bestuur, kunnen voorschriften worden gegeven omtrent de wijze waarop de processen-
      verbaal en andere voorwerpen, die zijn verkregen door toepassing van een bevoegdheid als bedoeld in
      [titel XVIII][ref1] en [XIX][ref2], worden bewaard en vernietigd en omtrent de wijze waarop de mededeling, bedoeld
      in [artikel 177ka][ref3], wordt gedaan.


