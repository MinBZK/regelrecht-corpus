  - number: '122'
    text: |-
      1 In geval van ontdekking op heterdaad of van een misdrijf waarvoor voorlopige hechtenis is toegelaten, kan de
      officier van justitie bij dringende noodzakelijkheid en indien het optreden van de rechter-commissaris niet kan
      worden afgewacht:

      a. ter inbeslagneming huiszoeking doen en de daarvoor vatbare voorwerpen in beslag nemen;

      b. ter gelegenheid van een schouw elders, voor inbeslagneming vatbare voorwerpen, voor zover deze voor de hand
      worden aangetroffen, in beslag nemen.

      2 Kan het optreden van de officier van justitie niet worden afgewacht, dan komt de bevoegdheid toe aan een
      hulpofficier van justitie, onder verplichting om van de ondernomen handeling onverwijld kennis te geven aan de
      officier van justitie.

      3 In geval van toepassing van het eerste en tweede lid is de officier van justitie of de hulpofficier van justitie
      bevoegd elke plaats te betreden. De [artikelen 155 tot en met 164][ref1] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel155
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel122
