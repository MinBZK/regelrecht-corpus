  - number: '77'
    text: |-
      1 In geval van ontdekking op heterdaad van een strafbaar feit of in geval van verdenking van een misdrijf waarvoor
      voorlopige hechtenis is toegelaten, kan de officier van justitie ter aanhouding van de verdachte elke plaats
      doorzoeken.

      2 Bij dringende noodzakelijkheid en indien het optreden van de officier van justitie niet kan worden afgewacht, kan
      een hulpofficier van justitie deze bevoegdheid uitoefenen. Hij behoeft daartoe verlof van de officier van justitie.
      Dit verlof is met redenen omkleed.

      3 Het doorzoeken van plaatsen geschiedt onder leiding van de officier van justitie of, in geval van toepassing van
      het tweede lid, onder leiding van de hulpofficier van justitie.

      4 De [artikelen 155 tot en met 164][ref1] zijn van toepassing.


