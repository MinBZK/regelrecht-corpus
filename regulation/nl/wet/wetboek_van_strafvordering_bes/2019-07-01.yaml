  - number: 177x
    text: |-
      1 In geval van verdenking van een misdrijf waarvoor voorlopige hechtenis is toegelaten, en dat, gezien zijn
      aard of de samenhang met andere vermoedelijk door de verdachte begane misdrijven een ernstige inbreuk op de
      rechtsorde oplevert, kan de officier van justitie, indien het onderzoek dit dringend vordert, met een persoon die
      geen opsporingsambtenaar is, overeenkomen dat deze bijstand verleent aan de opsporing door deel te nemen aan of
      medewerking te verlenen aan een groep waarbinnen naar redelijkerwijs kan worden vermoed misdrijven worden beraamd
      of gepleegd.

      2 In geval van aanwijzingen van een terroristisch misdrijf kan de officier van justitie, indien het belang van het
      onderzoek dit dringend vordert, met een persoon die geen opsporingsambtenaar is, overeenkomen dat deze bijstand
      verleent aan de opsporing door deel te nemen aan of medewerking te verlenen aan een groep van personen ten aanzien
      waarvan aanwijzingen bestaan dat daarbinnen een terroristisch misdrijf wordt beraamd of gepleegd.

      3 Toepassing van het eerste lid vindt alleen plaats indien de officier van justitie van oordeel is dat geen bevel
      als bedoeld in [artikel 177m, eerste lid][ref1], kan worden gegeven.

      4 De persoon die op grond van het eerste lid bijstand verleent aan de opsporing brengt bij de uitvoering daarvan
      een ander niet tot strafbare feiten dan waarop diens opzet reeds tevoren was gericht.

      5 Bij de toepassing van het eerste lid legt de officier van justitie schriftelijk vast:

      a. het misdrijf en indien bekend de naam of anders een zo nauwkeurig mogelijke omschrijving van de verdachte;

      b. een omschrijving van de groep van personen;

      c. de feiten of omstandigheden waaruit blijkt dat de voorwaarden, bedoeld in het eerste en tweede lid, zijn
      vervuld.

      6 De overeenkomst tot infiltratie is schriftelijk en vermeldt:

      a. de rechten en plichten van de persoon die op grond van het eerste lid bijstand verleent aan de opsporing,
      alsmede de wijze waarop aan de overeenkomst uitvoering wordt gegeven, en

      b. de geldigheidsduur van de overeenkomst.

      7 De persoon die op grond van het eerste lid bijstand verleent aan de opsporing, verricht bij de uitvoering daarvan
      geen strafbare handelingen, tenzij vooraf schriftelijk toestemming door de officier van justitie is gegeven om
      dergelijke handelingen te verrichten. Bij dringende noodzaak kan de toestemming mondeling worden gegeven. De
      officier van justitie stelt in dat geval de toestemming, op straffe van nietigheid, binnen drie dagen op schrift.

      8 De overeenkomst kan schriftelijk worden gewijzigd, aangevuld, verlengd of beëindigd. De officier van justitie
      legt de redenen daarvan uiterlijk binnen drie dagen schriftelijk vast.

      9 Toepassing van het eerste en tweede lid vindt alleen plaats na voorafgaande schriftelijke toestemming van de
      procureur-generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel177m
