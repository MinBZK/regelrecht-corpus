  - number: '406'
    text: |-
      1 In het geding in hoger beroep bevat het vonnis van het Hof, in de gevallen van [artikel 393][ref1], de daarbij
      vermelde beslissingen.

      2 In de andere gevallen bevestigt het Hof het vonnis van de rechter in eerste aanleg met gehele of gedeeltelijke
      overneming, dan wel met verbetering van de gronden, of doet, met gehele of gedeeltelijke vernietiging van dat
      vonnis, wat de rechter in eerste aanleg had behoren te doen.

      3 Indien echter de hoofdzaak niet door de rechter in eerste aanleg is beslist en het onderzoek daarvan gevolg
      moet zijn van de vernietiging van het vonnis, verwijst het Hof daartoe de zaak naar de rechter in eerste aanleg
      van hetzelfde rechtsgebied, tenzij door de procureur-generaal en de verdachte de beslissing van de hoofdzaak door
      het Hof is verlangd. In geval van verwijzing doet de rechter in eerste aanleg recht met inachtneming van ’s Hofs
      vonnis.

      4 In geval van vernietiging van het vonnis van de rechter in eerste aanleg is het Hof niettemin bevoegd gedeelten
      daarvan, door daarnaar te verwijzen, in zijn vonnis over te nemen, voor zover zij niet aan nietigheid lijden.
      Indien het proces-verbaal van de terechtzitting in eerste aanleg aan nietigheid lijdt, kan niettemin het vonnis,
      voor zover dit niet aan nietigheid lijdt, worden bevestigd.

      5 Indien de wettelijke voorschriften, waarop de oplegging van straf of maatregel is gegrond, niet in het vonnis
      zijn vermeld, kan het Hof er mee volstaan het vonnis alleen te dien aanzien te vernietigen en te doen wat de
      rechter in eerste aanleg had behoren te doen.

      6 Indien bij samenloop van meerdere feiten een hoofdstraf is uitgesproken en het hoger beroep slechts is ingesteld
      ten aanzien van een of meer van de feiten, wordt in geval van vernietiging ten aanzien van de straf, bij het vonnis
      de straf voor het andere feit of de andere feiten bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel393
