  - number: '560'
    text: |-
      1 Aan verzoeken ten behoeve van een onderzoek naar strafbare feiten van politieke aard, of daarmee verband
      houdende feiten, wordt niet voldaan dan krachtens een machtiging van Onze Minister van Justitie. Die machtiging kan
      alleen worden gegeven voor verzoeken die op een verdrag zijn gegrond en slechts na overleg met Onze Minister van
      Buitenlandse Zaken. De beslissing op het verzoek wordt langs diplomatieke weg ter kennis van de autoriteiten van de
      verzoekende staat gebracht.

      2 Aan verzoeken, die zijn gedaan ten behoeve van onderzoek naar strafbare feiten met betrekking tot retributies,
      belastingen, douane, deviezen, of daarmee verband houdende feiten, en waarvan de inwilliging van belang kan
      zijn voor ’s Rijks belastingdienst, dan wel aan verzoeken betrekking hebbende op gegevens welke onder ’s Rijks
      belastingdienst berusten of aan ambtenaren van deze dienst in de uitoefening van hun bediening bekend zijn
      geworden, wordt niet voldaan dan krachtens machtiging van Onze Minister van Justitie. Die machtiging kan alleen
      worden gegeven voor verzoeken die op een verdrag zijn gegrond en slechts na overleg met Onze Minister van
      Financiën.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel560
  - number: '561'
    text: |-
      1 De officier van justitie stelt een voor inwilliging vatbaar en op een verdrag gegrond verzoek van een
      buitenlandse rechterlijke autoriteit in handen van de rechter-commissaris:

      a. indien het strekt tot het horen of verhoren van personen die niet bereid zijn vrijwillig te verschijnen en de
      gevraagde verklaring af te leggen;

      b. indien uitdrukkelijk is gevraagd om een beëdigde verklaring, of om een verklaring afgelegd ten overstaan van
      een rechter;

      c. indien het met het oog op het verlangde gevolg nodig is, dat andere dan openbare plaatsen zonder de
      uitdrukkelijke toestemming van de rechthebbende worden betreden, of dat stukken van overtuiging in beslag worden
      genomen.

      2 In andere dan de in het eerste lid voorziene gevallen kan de officier van justitie het verzoek van een
      buitenlandse rechterlijke autoriteit in handen van de rechter-commissaris stellen.

      3 De overlegging van het verzoek geschiedt bij een schriftelijke vordering, waarin wordt omschreven welke
      verrichtingen van de rechter-commissaris worden verlangd.

      4 De in het derde lid bedoelde vordering kan te allen tijde worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel561
  - number: '562'
    text: |-
      1 Voor zover de in [artikel 561, derde lid][ref1], bedoelde vordering is gedaan met het oog op de voldoening aan
      een voor inwilliging vatbaar en op een verdrag gegrond verzoek van een buitenlandse rechterlijke autoriteit, heeft
      zij dezelfde rechtsgevolgen als een vordering tot het instellen van een gerechtelijk vooronderzoek, wat betreft:

      a. de bevoegdheden van de rechter-commissaris ten aanzien van de door hem te verhoren verdachten, getuigen en
      deskundigen, alsmede die tot het betreden van plaatsen, het verrichten van huiszoeking en het in beslag nemen van
      stukken van overtuiging ;

      b. de bevoegdheden van de officier van justitie;

      c. de rechten en verplichtingen van de door de rechter-commissaris te horen of te verhoren personen;

      d. bijstand van een raadsman;

      e. de verrichtingen van de griffier.

      2 Vatbaar voor inbeslagneming, overeenkomstig het eerste lid, zijn stukken van overtuiging die daarvoor vatbaar
      zouden zijn, indien het feit in verband waarmee de rechtshulp is gevraagd, in de openbare lichamen Bonaire, Sint
      Eustatius en Saba was begaan en dat feit aanleiding kan geven tot uitlevering aan de verzoekende staat.

      3 [vervallen]

      4 Tenzij een verdrag anders bepaalt, kan ter voldoening aan een verzoek om rechtshulp, anders dan overeenkomstig
      het eerste en tweede lid, geen gebruik van dwangmiddelen worden gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel561
