        artikel: '365'
        afdeling: Tweede
  - number: '369'
    text: |-
      1 De griffier houdt het proces-verbaal van de terechtzitting, waarin achtereenvolgens aantekening geschiedt van de
      in acht genomen vormen en van al hetgeen met betrekking tot de zaak op de terechtzitting voorvalt.

      2 Het behelst tevens de zakelijke inhoud van de verklaringen van de getuigen, deskundigen en verdachten. Indien
      de procureur-generaal vordert of de verdachte verzoekt dat enige verklaring woordelijk zal worden opgenomen, wordt
      daaraan, voor zover de verklaring redelijke grenzen niet overschrijdt, op last van het Hof zoveel mogelijk voldaan
      en daarvan voorlezing gedaan Acht de procureur-generaal of de verdachte de verklaring niet voldoende weergegeven,
      dan beslist het Hof.

      3 De voorzitter kan gelasten dat in het proces-verbaal van enige bepaalde omstandigheid, verklaring of opgave
      aantekening zal worden gedaan.

      4 Gelijke aantekening geschiedt, wanneer een van de rechters het verlangt, of op de vordering van de procureur-
      generaal of op het verzoek van de verdachte.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel369
  - number: '370'
    text: |-
      Het proces-verbaal wordt door de voorzitter of door een van de rechters, die over de zaak heeft geoordeeld, en de
      griffier vastgesteld en zo spoedig mogelijk na elke sluiting van de terechtzitting en in ieder geval binnen de in
      het eerste lid van [artikel 410][ref1] vermelde termijn ondertekend. Voor zover de griffier tot een en ander buiten
      staat is, geschiedt dit zonder zijn medewerking en wordt van zijn verhindering aan het slot van het proces-verbaal
      melding gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel410
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel370
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '410'
        afdeling: Vijfde
  - number: '371'
    text: |-
      Tot het nemen van elke rechterlijke beslissing op grond van de bepalingen van deze titel kan door de procureur-
      generaal een vordering en door de verdachte een verzoek tot het Hof worden gedaan, tenzij uit enige bepaling het
      tegendeel volgt.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel371
  - number: '372'
    text: |-
      Alvorens te beslissen op enig verzoek of verzet van de verdachte, hoort het Hof de procureur-generaal. Alvorens te
      beslissen op enige vordering of op enig verzet van de procureur- generaal, hoort het Hof de verdachte, indien deze
      tegenwoordig is, of diens raadsman.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel372
  - number: '373'
    text: |-
      1 Elke bevoegdheid, aan de verdachte bij deze titel toegekend, komt ook toe aan diens raadsman.

      2 In alle gevallen waarin bij deze titel de toestemming of het horen van de verdachte of diens raadsman wordt
      gevorderd, geldt dit alleen ten aanzien van de op de terechtzitting aanwezige verdachte of raadsman.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel373
  - number: '374'
    text: |-
      1 De benadeelde partij kan zich ter zake van haar vordering tot schadevergoeding, indien deze wordt beperkt tot ten
      hoogste USD 27.933 en zij niet aan het oordeel van de burgerlijke rechter is onderworpen, voegen in het geding over
      de strafzaak in eerste aanleg. De vordering dient naar het oordeel van de rechter van zodanige aard te zijn, dat
      zij zich leent voor een beslissing in de strafzaak.

      2 Tot deze voeging kan zij voorts door de rechter worden toegelaten ingeval een niet tenlastegelegd strafbaar feit,
      als bedoeld in [artikel 412][ref1], bij het onderzoek ter terechtzitting ter sprake komt en dit feit in beginsel
      bij de strafbepaling in aanmerking kan worden genomen.

      3 De voeging geschiedt op de terechtzitting door een opgave van de inhoud van de vordering, uiterlijk voordat de
      officier van justitie zijn vordering ingevolge [artikel 353][ref2] overlegt.

      4 De benadeelde partij die zich niet in het geding in eerste aanleg heeft gevoegd, is daartoe onbevoegd in het
      geding in hoger beroep.

      5 Heeft de voeging in eerste aanleg plaatsgehad, dan duurt zij, voor zover de vordering is toegewezen, van
      rechtswege voort in hoger beroep, ook al is de benadeelde partij in hoger beroep niet verschenen.

      6 Is de vordering niet of slechts ten dele toegewezen, dan kan de benadeelde partij zich binnen de grenzen van haar
      eerste vordering in het geding in hoger beroep voegen. Het derde lid is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel412
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel353
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel374
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '412'
        afdeling: Zesde
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '353'
        afdeling: Tweede
  - number: '375'
    text: |-
      Zij, die om in een burgerlijk geding in rechte te verschijnen, bijstand behoeven of vertegenwoordigd moeten worden,
      hebben, om zich in het strafgeding te voegen, die bijstand of die vertegenwoordiging nodig. Ten aanzien van de
      verdachte zijn de bepalingen betreffende de bijstand of de vertegenwoordiging, nodig in burgerlijke zaken, niet
      van toepassing.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel375
  - number: '376'
    text: |-
      1 De benadeelde partij kan zich doen bijstaan door een advocaat. Zij kan zich doen vertegenwoordigen door een
      advocaat of door een daartoe bij bijzondere volmacht schriftelijk gemachtigde.

      2 Nadat de zaak ter terechtzitting is aanhangig gemaakt, kan zowel de benadeelde partij als haar advocaat ter
      griffie inzage nemen van de processtukken, zonder de voortzetting van de zaak op te houden.

      3 De benadeelde partij kan van deze stukken met toestemming van de voorzitter, afschriften doen nemen.

      4 Ten aanzien van de bevoegdheid van de benadeelde partij en haar advocaat tot de kennisneming van processtukken en
      het bekomen van afschrift daarvan vinden de [artikelen 51 tot en met 54][ref1] overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel51
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel376
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '51'
        afdeling: Vierde
  - number: '377'
    text: |-
      1 De benadeelde partij of haar advocaat kan tot bewijs van de geleden schade of van het bedrag daarvan stukken
      overleggen.

      2 De voorzitter kan aan de benadeelde partij toestemming geven om getuigen of deskundigen aan te brengen.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel377
  - number: '378'
    text: |-
      1 De benadeelde partij of haar advocaat kan aan elke getuige en deskundige vragen doen, doch alleen betreffende de
      geleden schade of het bedrag daarvan.

      2 De ondervraging van getuigen en deskundigen door de benadeelde partij of haar advocaat geschiedt door tussenkomst
      van de voorzitter, tenzij het Hof toestaat dat zij zonder die tussenkomst zal geschieden. De toestemming kan steeds
      worden ingetrokken.

      3 Het Hof kan beletten dat aan enige vraag, door of namens de benadeelde partij gesteld, gevolg wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel378
  - number: '379'
    text: |-
      De benadeelde partij kan haar eis toelichten of doen toelichten, nadat de officier van justitie zijn vordering
      ingevolge [artikel 353][ref1] heeft overgelegd. Zij heeft andermaal het woord, nadat de officier van justitie in de
      gelegenheid is gesteld ten tweede male het woord te voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel353
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel379
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '353'
        afdeling: Tweede
  - number: '380'
    text: |-
      1 Het Hof doet over de vordering van de benadeelde partij gelijktijdig met de strafzaak uitspraak.

      2 De vordering zal alleen ontvankelijk zijn, indien de verdachte enige straf of maatregel wordt opgelegd, of wordt
      schuldig verklaard zonder oplegging van enige straf of maatregel.

      3 Bij toewijzing van de vordering veroordeelt het Hof de verdachte geheel of ten dele in de kosten door de
      benadeelde partij gemaakt en ten behoeve van de tenuitvoerlegging nog te maken.

      4 Hieronder zijn niet begrepen de kosten die het Hof verklaart nodeloos te zijn gemaakt.

      5 Bij gehele of gedeeltelijke ontzegging veroordeelt het Hof de benadeelde partij geheel of ten dele in de kosten
      door de verdachte te zijner verdediging tegen de vordering gemaakt, met uitzondering van die kosten die het Hof
      verklaart nodeloos te zijn gemaakt.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel380
  - number: '381'
    text: |-
      Het bewijs dat de verdachte het tenlastegelegde feit heeft begaan, kan door de rechter slechts worden aangenomen,
      indien hij daarvan uit het onderzoek op de terechtzitting door de inhoud van wettige bewijsmiddelen de overtuiging
      heeft bekomen.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel381
  - number: '382'
    text: |-
      1 Als wettige bewijsmiddelen worden alleen erkend:

      a. eigen waarneming van de rechter;

      b. verklaringen van de verdachte;

      c. verklaringen van een getuige;

      d. verklaringen van een deskundige;

      e. schriftelijke bescheiden.

      2 Feiten of omstandigheden van algemene bekendheid behoeven geen bewijs.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel382
  - number: '383'
    text: |-
      Onder eigen waarneming van de rechter wordt verstaan die welke bij het onderzoek op de terechtzitting door hem
      persoonlijk is geschied.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel383
  - number: '384'
    text: |-
      1 Onder verklaring van de verdachte wordt verstaan, zijn bij het onderzoek op de terechtzitting gedane opgave van
      feiten of omstandigheden, hem uit eigen wetenschap bekend.

      2 Zodanige opgave, elders dan ter terechtzitting gedaan, kan tot het bewijs, dat de verdachte het tenlastegelegde
      feit begaan heeft, meewerken, indien daarvan uit enig wettig bewijsmiddel blijkt.

      3 Zijn opgaven kunnen alleen te zijnen aanzien gelden.

      4 Het bewijs dat de verdachte het tenlastegelegde feit heeft begaan, kan door de rechter niet uitsluitend worden
      aangenomen op grond van diens eigen verklaringen.

      5 Houden de opgaven van de verdachte een gerechtelijke bekentenis van schuld in, dan worden zij door een herroeping
      van de bekentenis niet krachteloos gemaakt, tenzij die herroeping op aannemelijke gronden berust.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel384
  - number: '385'
    text: |-
      1 Onder verklaring van een getuige wordt verstaan, zijn bij het onderzoek op de terechtzitting gedane mededeling
      van feiten of omstandigheden, die hij zelf waargenomen of ondervonden heeft.

      2 De verklaring van een getuige wiens identiteit niet blijkt, kan niet meewerken tot het bewijs dat de verdachte
      het tenlastegelegde feit heeft begaan, behoudens ingeval de getuige met toepassing van het vierde lid van
      [artikel 261][ref1] is verhoord.

      3 Het bewijs dat de verdachte het tenlastegelegde feit heeft begaan, kan door de rechter niet uitsluitend worden
      aangenomen op de verklaring van slechts één getuige.

      4 Verklaringen van getuigen, die overeenkomstig het bepaalde in [artikel 261][ref2] zijn verhoord, mogen alleen
      dan als bewijsmateriaal worden gebezigd, indien belangrijke steun aan ander gebezigd bewijsmateriaal kan worden
      ontleend.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel261
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel261
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel385
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '261'
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '261'
        afdeling: Vijfde
  - number: '386'
    text: |-
      Onder verklaring van een deskundige wordt verstaan, zijn bij het onderzoek op de terechtzitting meegedeeld gevoelen
      betreffende hetgeen zijn wetenschap hem leert omtrent datgene wat aan zijn oordeel onderworpen is.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel386
  - number: '387'
    text: |-
      1 Onder schriftelijke bescheiden worden verstaan:

      a. beslissingen in de wettelijke vorm opgemaakt door colleges of personen met rechtspraak belast;

      b. processen-verbaal en andere geschriften, in de wettelijke vorm opgemaakt door colleges en personen, die daartoe
      bevoegd zijn, en behelzende hun mededeling van feiten of omstandigheden, door hen zelf waargenomen of ondervonden;

      c. geschriften opgemaakt door openbare colleges of ambtenaren, betreffende onderwerpen behorende tot de onder hun
      beheer gestelde dienst, en bestemd om tot bewijs van enig feit of van enige omstandigheid te dienen;

      d. verslagen van deskundigen behelzende hun gevoelen betreffende hetgeen hun wetenschap hen leert omtrent datgene
      wat aan hun oordeel onderworpen is;

      e. alle andere geschriften, doch deze kunnen alleen gelden in verband met de inhoud van andere bewijsmiddelen.

      2 Het bewijs dat de verdachte het tenlastegelegde feit heeft gepleegd, kan door de rechter worden aangenomen op het
      proces-verbaal van een opsporingsambtenaar.

      3 Schriftelijke bescheiden, houdende de verklaring van een persoon wiens identiteit niet blijkt, kunnen slechts als
      bewijsmiddel worden erkend, indien deze persoon met de toestemming van of door de rechter-commissaris op de voet
      van het bepaalde in [artikel 261][ref1] is verhoord, mits belangrijke steun aan ander gebezigd bewijsmateriaal kan
      worden ontleend.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel261
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel387
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '261'
        afdeling: Vijfde
  - number: '388'
    text: |-
      1 Na afloop van het onderzoek wordt dit door de voorzitter gesloten verklaard en wordt hetzij aanstonds de
      uitspraak gedaan, hetzij door de voorzitter mondeling meegedeeld, wanneer zij volgens de bepaling van het Hof zal
      plaatsvinden.

      2 De uitspraak kan op de bepaalde dag mondeling tot een nadere dag worden uitgesteld. De uitspraak kan, op straffe
      van nietigheid, niet vervroegd worden, tenzij zij gedaan wordt in tegenwoordigheid van de verdachte.

      3 In geen geval mag de uitspraak later plaatsvinden dan op de eenentwintigste dag na de sluiting van het onderzoek.

      4 Heeft de uitspraak alsdan niet plaatsgehad, dan wordt de zaak op de bestaande tenlastelegging door hetzelfde
      college opnieuw onderzocht.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel388
  - number: '389'
    text: |-
      De [artikelen 414 tot en met 428][ref1] kunnen in eerste aanleg ook bij de berechting van misdrijven toepassing
      vinden, indien naar het oordeel van de rechter de zaak van eenvoudige aard is, bepaaldelijk ook ten aanzien van het
      bewijs en de toepassing van de wettelijke regeling en daarin geen zwaardere hoofdstraf dan gevangenisstraf van ten
      hoogste zes maanden dient te worden opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel414
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel389
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '414'
  - number: '390'
    text: |-
      1 Ingeval bij de beraadslaging blijkt dat het onderzoek niet volledig is geweest, kan het Hof op de terechtzitting
      bevelen dat op een door het Hof te bepalen terechtzitting het onderzoek wordt hervat.

      2 Bij het bevel worden tevens aangewezen de getuigen, deskundigen en tolken, wier verhoor of tegenwoordigheid nodig
      wordt geacht, of de bescheiden of stukken van overtuiging waarvan het Hof inzage of bezichtiging wenst.

      3 In dit geval wordt gehandeld als ware het onderzoek voor onbepaalde tijd geschorst, met dien verstande dat de
      verplichte oproeping alleen betreft de verdachte en dat alleen de in het bevel aangewezen getuigen, deskundigen, en
      tolken, opnieuw worden gedagvaard.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel390
  - number: '391'
    text: |-
      1 Ook kan, in het geval bij het eerste lid van [artikel 390][ref1] bedoeld, het Hof overeenkomstig de bepalingen
      van [artikel 359][ref2] een onderzoek door de rechter-commissaris doen plaatsvinden.

      2 In dit geval wordt gehandeld als ware het onderzoek voor onbepaalde tijd geschorst.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel390
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel359
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel391
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '390'
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '359'
        afdeling: Tweede
  - number: '392'
    text: |-
      1 Het Hof onderzoekt op de grondslag van de telastelegging en naar aanleiding van het onderzoek op de
      terechtzitting de geldigheid van de dagvaarding, de bevoegdheid van het Hof tot kennisneming van het
      tenlastegelegde feit en de ontvankelijkheid van de procureur-generaal en of er redenen zijn voor schorsing van
      de vervolging.

      2 In het geding in hoger beroep geschiedt dat onderzoek mede naar aanleiding van het onderzoek op de terechtzitting
      in eerste aanleg, zoals dit volgens het daarvan opgemaakte proces-verbaal heeft plaatsgehad, en onderzoekt het
      Hof de ontvankelijkheid van het hoger beroep alvorens tot het onderzoek van de geldigheid van de dagvaarding over
      te gaan.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel392
  - number: '393'
    text: |-
      Indien het onderzoek in [artikel 392][ref1] bedoeld, daartoe aanleiding geeft, spreekt het Hof uit de niet-
      ontvankelijkheid van het ingestelde hoger beroep, de nietigheid van de dagvaarding, de onbevoegdheid van het Hof,
      de niet-ontvankelijkheid van de procureur-generaal of de schorsing van de vervolging.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel392
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel393
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '392'
        afdeling: Vijfde
  - number: '394'
    text: |-
      1 Indien het onderzoek in [artikel 392][ref1] bedoeld niet leidt tot toepassing van [artikel 393][ref2],
      beraadslaagt het Hof op de grondslag van de tenlastelegging en naar aanleiding van het onderzoek op de
      terechtzitting over de vraag of bewezen is dat het feit door de verdachte is begaan, en, zo ja, welk strafbaar
      feit het bewezenverklaarde volgens wettelijke regeling oplevert; indien wordt aangenomen dat het feit bewezen en
      strafbaar is, dan beraadslaagt het Hof over de strafbaarheid van de verdachte en over de oplegging van straf of
      maatregel, bij wettelijke regeling bepaald.

      2 In het geding in hoger beroep geschiedt de beraadslaging mede naar aanleiding van het onderzoek op de
      terechtzitting in eerste aanleg, zoals dit volgens het daarvan opgemaakte proces-verbaal heeft plaatsgehad.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel392
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel393
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel394
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '392'
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '393'
        afdeling: Vijfde
  - number: '395'
    text: |-
      1 Acht het Hof het tenlastegelegde feit bewezen en het feit en de verdachte strafbaar, dan legt het op de straf of
      de maatregel, op het feit gesteld.

      2 In het geding in hoger beroep kan slechts met eenparigheid van stemmen worden bewezenverklaard datgene waarvan de
      verdachte in eerste aanleg is vrijgesproken. Die eenparigheid is echter niet vereist, indien bij een alternatieve
      telastelegging in eerste aanleg is beslist, dat door de verdachte een van de hem tenlastegelegde feiten is begaan.

      3 Indien alleen de verdachte in hoger beroep is gekomen, kan hij ter zake van hetgeen in eerste aanleg te zijnen
      laste bewezen is verklaard, slechts met eenparigheid van stemmen tot een zwaardere straf worden veroordeeld, dan
      hem bij het vonnis is opgelegd.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel395
  - number: '396'
    text: |-
      1 Acht het Hof niet bewezen dat de verdachte het hem tenlastegelegde feit heeft begaan, dan spreekt het hem vrij.
      Indien de vrijspraak voortvloeit uit de toepassing van [artikel 413][ref1], dan wordt daarvan in het bijzonder
      reden gegeven.

      2 Acht het Hof het feit bewezen, en het feit of de verdachte niet strafbaar, dan ontslaat het hem van alle
      rechtsvervolging te dier zake. In het geval bedoeld bij artikel 39, eerste lid, van het Wetboek van Strafrecht BES,
      wordt zonodig de last, bedoeld in het tweede lid van dat artikel, gegeven. In het geval bedoeld in artikel 41 van
      het Wetboek van Strafrecht BES, wordt zo nodig de maatregel van ter beschikkingstelling van de regering, zonder
      toepassing van enige straf opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel413
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel396
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '413'
        afdeling: Zevende
  - number: '397'
    text: |-
      1 In het geval van oplegging van straf of maatregel, van vrijspraak of ontslag van alle rechtsvervolging gelast
      het Hof, tenzij het verklaart tot het geven van zodanige last niet in staat te zijn, dat inbeslaggenomen, nog niet
      teruggegeven voorwerpen zullen worden teruggegeven aan een met name genoemde persoon, voor zover zij niet worden
      verbeurdverklaard of onttrokken aan het verkeer. De beslissing van het Hof laat ieders rechten op het voorwerp
      onverlet. [Artikel 144][ref1] vindt zoveel mogelijk toepassing.

      2 Het Hof kan gelasten dat een voorwerp, waarover een geding bij de burgerlijke rechter aanhangig is, hangende dit
      geding op een bepaalde wijze zal worden bewaard, op kosten van ongelijk.

      3 Op een last, ingevolge het eerste en tweede lid gegeven, is [artikel 145][ref2] van overeenkomstige toepassing.

      4 Het Hof kan de teruggave van inbeslaggenomen voorwerpen onder zekerheidstelling gelasten. [Artikel 145a][ref3] is
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel144
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel145
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel145a
