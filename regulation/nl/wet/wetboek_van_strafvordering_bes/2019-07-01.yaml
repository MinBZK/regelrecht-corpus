  - number: 503f
    text: |-
      1 Tegen de uitspraak van het gerecht kan hoger beroep worden ingesteld.

      2 [Titel III][ref1] en [Titel IV][ref2] (met uitzondering van de [Eerste Afdeling][ref3]) van het vijfde Boek en
      [Titel II van het zesde Boek][ref4] zijn van overeenkomstige toepassing, met dien verstande dat:

      a. de zaak in hoger beroep aanhangig wordt gemaakt door een oproeping van de procureur-generaal aan de verdachte of
      de veroordeelde betekend;

      b. de behandeling van de vordering waarvan beroep is ingesteld voorafgegaan kan worden door een schriftelijke
      voorbereiding op de wijze, door het Hof te bepalen;

      c. de [artikelen 503c, tweede en derde lid][ref5], en [503d, derde lid][ref6], van overeenkomstige toepassing zijn.
      In deze gevallen wordt het financieel onderzoek gevoerd door de officier van justitie bij het gerecht dat in eerste
      aanleg uitspraak heeft gedaan. Na afloop van het bevolen onderzoek zendt de officier van justitie de stukken toe
      aan de procureur-generaal;

      d. [artikel 503d, eerste lid, onder b][ref7], van overeenkomstige toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0028681
      [ref2]: https://wetten.overheid.nl/BWBR0028681
