        afdeling: Tweede
  - number: '203'
    text: |-
      1 Tot het ontvangen van de klacht is elke officier van justitie en elke hulpofficier van justitie verplicht.

      2 [Artikel 193][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel193
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel203
