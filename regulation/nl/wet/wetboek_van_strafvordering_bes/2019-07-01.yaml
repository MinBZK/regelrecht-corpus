  - number: 119d
    text: |-
      1 Tot bewaring van het recht tot verhaal kan de officier van justitie namens de staat de bevoegdheid
      uitoefenen, welke in artikel 1358 van het Burgerlijk Wetboek BES is toegekend aan een schuldeiser die in zijn
      verhaalsmogelijkheden is benadeeld als gevolg van een onverplicht door de schuldenaar verrichte rechtshandeling. De
      [artikelen 39][ref1] en [41 van Faillissementswet BES][ref2] zijn van overeenkomstige toepassing.

      2 Voor de toepassing van de [artikelen 39][ref3] en [41 van de Faillissementswet BES][ref4] geldt het in die
      artikelen bedoelde vermoeden van wetenschap voor rechtshandelingen welke door de verdachte of veroordeelde zijn
      verricht binnen een jaar voor het tijdstip waarop de vervolging tegen hem is aangevangen.

      3 De officier van justitie heeft voorts tot bewaring van het recht tot verhaal de bevoegdheid namens de Staat
      als schuldeiser in het faillissement van de verdachte of de veroordeelde op te komen. Zolang het bedrag van de
      boete of van het te ontnemen wederrechtelijk verkregen voordeel nog niet vaststaat, wordt hij geacht voor een
      voorwaardelijke vordering op te komen.

      4 De officier van justitie behoudt de bevoegdheden, bedoeld in het eerste en het tweede lid, ondanks faillissement,
      voor zover de voorwerpen waarop de onverplichte rechtshandelingen betrekking hebben, niet door de curator op grond
      van de [artikelen 38 tot en met 47 van de Faillissementswet BES][ref5] worden opgevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel39
