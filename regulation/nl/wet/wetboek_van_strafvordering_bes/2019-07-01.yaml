  - number: '155'
    text: |-
      1 Voor het binnentreden in een woning zonder de uitdrukkelijke toestemming van de bewoner is een bijzondere
      schriftelijke machtiging vereist, onverminderd het bepaalde in het vierde lid. Van het vereiste van een machtiging
      is vrijgesteld de rechter of de rechter-commissaris, die bevoegd is tot binnentreden zonder toestemming van de
      bewoner.

      2 Het model van de machtiging wordt vastgesteld bij algemene maatregel van bestuur.

      3 De machtiging wordt, zo mogelijk voorafgaande aan het binnentreden of anders bij de eerste gelegenheid daarna,
      aan de bewoner getoond. De machtiging wordt de bewoner in afschrift uitgereikt of voor hem achtergelaten.

      4 Een machtiging als bedoeld in het eerste lid, is voor de officier van justitie of de hulpofficier van justitie
      met het oog op de opsporing van misdrijven, huiszoeking ter inbeslagneming van voorwerpen of het doorzoeken van
      een woning ter aanhouding van een verdachte niet vereist in de gevallen waarin met het binnentreden niet kan worden
      gewacht, totdat hij over een machtiging beschikt.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel155
  - number: '156'
    text: |-
      1 Tot het geven van een bijzondere schriftelijke machtiging zijn alleen de procureur-generaal, de officier van
      justitie en de hulpofficier van justitie bevoegd. Ingeval de officier van justitie of de hulpofficier van justitie
      zelf een machtiging nodig heeft, dan wordt die door de naast hogere autoriteit gegeven.

      2 De machtiging kan uitsluitend worden gegeven aan hen, die bij of krachtens dit wetboek bevoegd zijn verklaard
      zonder de uitdrukkelijke toestemming van de bewoner in een woning binnen te treden.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel156
  - number: '157'
    text: |-
      1 De machtiging wordt gegeven voor het binnentreden in een bepaalde in de machtiging aan te duiden woning.

      2 Ten behoeve van de opsporing van misdrijven waarvoor voorlopige hechtenis is toegelaten kan een machtiging worden
      gegeven, die betrekking heeft op een groter aantal woningen die niet bepaald in de machtiging worden aangeduid. In
      dat geval wordt in de machtiging nauwkeurig vermeld, in verband met welke misdrijven wordt binnengetreden, en voor
      welke tijdsduur de machtiging geldt.

      3 Ten behoeve van de aanhouding, de medebrenging of de gevangenneming van een in de machtiging aan te duiden
      persoon kan een machtiging worden gegeven die geldt voor iedere woning, waarin die persoon zich bevindt of
      redelijkerwijze verondersteld wordt zich te bevinden.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel157
  - number: '158'
    text: |-
      1 De machtiging omschrijft het doel van het binnentreden en zoveel mogelijk de grond van de verdenking.

      2 De machtiging is gedagtekend en ondertekend. Zij blijft van kracht tot en met de derde dag na die waarop zij
      is gegeven.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel158
  - number: '159'
    text: |-
      1 Tussen middernacht en zes uur ’s morgens kan slechts zonder de uitdrukkelijke toestemming van de bewoner worden
      binnengetreden, voor zover dit dringend noodzakelijk is en, indien krachtens een machtiging wordt binnengetreden,
      de machtiging dit uitdrukkelijk bepaalt.

      2 Bij afwezigheid van de bewoner kan slechts worden binnengetreden, voor zover dit dringend noodzakelijk is en,
      indien krachtens een machtiging wordt binnengetreden, de machtiging dit uitdrukkelijk bepaalt.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel159
  - number: '160'
    text: |-
      1 De procureur-generaal of de officier van justitie, die de machtiging heeft gegeven, kan degene die bevoegd is
      binnen te treden, vergezellen.

      2 Degene die bevoegd is zonder de uitdrukkelijke toestemming van de bewoner binnen te treden, kan zich door anderen
      doen vergezellen, voor zover dit voor het doel van het binnentreden redelijkerwijze is vereist en, indien krachtens
      een machtiging wordt binnengetreden, de machtiging dit uitdrukkelijk bepaalt.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel160
  - number: '161'
    text: |-
      Degene die bevoegd is zonder de uitdrukkelijke toestemming van de bewoner binnen te treden, kan zich de toegang tot
      of de doorgang in de woning verschaffen, voor zover het doel van het binnentreden dit redelijkerwijze vereist. Hij
      kan daartoe zo nodig de hulp van de sterke arm inroepen.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel161
  - number: '162'
    text: |-
      1 Onverminderd hetgeen in deze titel ten aanzien van de machtiging is bepaald, is degene die in een woning
      binnentreedt, verplicht zich voorafgaand tegenover de bewoner te legitimeren en mededeling te doen van het doel
      van het binnentreden. Indien twee of meer personen voor hetzelfde doel in een woning binnentreden, rusten deze
      verplichtingen slechts op degene die bij het binnentreden de leiding heeft.

      2 Indien de naleving van de in het eerste lid bedoelde verplichtingen naar redelijke verwachting ernstig en
      onmiddellijk gevaar oplevert voor de veiligheid van personen of goederen, feitelijk onmogelijk is dan wel naar
      redelijke verwachting de strafvordering schaadt ten aanzien van misdrijven waarvoor voorlopige hechtenis is
      toegestaan, gelden deze verplichtingen slechts voor zover de naleving daarvan in die omstandigheden kan worden
      gevergd.

      3 Degene die zich ingevolge het eerste lid legitimeert, toont een legitimatiebewijs dat is uitgegeven door of
      vanwege Onze Minister van Justitie. Het legitimatiebewijs bevat een foto van de houder en vermeldt diens naam en
      hoedanigheid. Indien de veiligheid van de houder van het legitimatiebewijs vordert dat zijn identiteit verborgen
      blijft, kan in plaats van zijn naam zijn nummer worden vermeld.

      4 De persoon, bedoeld in het eerste lid, die met toestemming van de bewoner wenst binnen te treden, vraagt
      voorafgaand aan het binnentreden diens toestemming. De toestemming moet blijken aan degene die wenst binnen te
      treden en wordt schriftelijk vastgelegd in het proces-verbaal dat naar aanleiding van het binnentreden wordt
      opgemaakt.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel162
  - number: '163'
    text: |-
      1 Degene die zonder de uitdrukkelijke toestemming van de bewoner in een woning is binnengetreden, maakt op zijn
      ambtseed of -belofte een schriftelijk verslag op omtrent het binnentreden.

      2 In het verslag vermeldt hij:

      a. zijn naam en hoedanigheid;

      b. de dagtekening van de machtiging en de naam en hoedanigheid van degene die de machtiging tot binnentreden heeft
      gegeven;

      c. de wettelijke bepalingen waarop het binnentreden berust en het doel waartoe is binnengetreden;

      d. de plaats van de woning en de naam van de bewoner;

      e. de wijze van binnentreden en het tijdstip waarop in de woning is binnengetreden en waarop deze is verlaten;

      f. hetgeen in de woning is verricht of overigens is voorgevallen, het aantal en de hoedanigheid van degenen die hem
      hebben vergezeld, de namen van de personen aan wie in de woning hun vrijheid is ontnomen en de voorwerpen die in de
      woning in beslag zijn genomen.

      g. voor zover van toepassing: de redenen waarom en de wijze waarop het bepaalde in [artikel 155, vierde lid][ref1],
      dan wel [artikel 162, tweede lid][ref2], toepassing heeft gevonden.

      3 Het verslag wordt binnen tweemaal vierentwintig uren nadat in de woning is binnengetreden, toegezonden aan de
      officier van justitie. Een afschrift van het verslag wordt binnen diezelfde termijn aan de bewoner uitgereikt of
      toegezonden. Indien het niet mogelijk is dit afschrift uit te reiken of toe te zenden, houdt degene aan wie het
      verslag is toegezonden dan wel degene die zijn bevoegdheid zonder machtiging binnen te treden heeft uitgeoefend,
      het afschrift gedurende zes maanden voor de bewoner beschikbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel155
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel162
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel163
