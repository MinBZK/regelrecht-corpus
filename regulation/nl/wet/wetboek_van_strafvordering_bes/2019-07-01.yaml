        artikel: '155'
  - number: '78'
    text: |-
      1 De officier van justitie of de hulpofficier, voor wie de verdachte wordt geleid of die zelf de verdachte heeft
      aangehouden, kan bij het bestaan van ernstige bezwaren tegen deze bepalen, dat hij aan zijn lichaam of aan zijn
      kleding zal worden onderzocht.

      2 De overige opsporingsambtenaren zijn bevoegd de aangehoudene, tegen wie ernstige bezwaren bestaan, aan zijn
      kleding te onderzoeken.

      3 Wanneer er in geval van het eerste lid bijzondere aanwijzingen zijn dat voorwerpen of stoffen in of langs de weg
      van de natuurlijke openingen van het lichaam verborgen worden gehouden, kan het onderzoek aan het lichaam zich ook
      daartoe uitstrekken, doch slechts indien:

      a. het onderzoek plaatsvindt door een medisch deskundige, wanneer het betreft een onderzoek van de maag, een
      rectaal of vaginaal onderzoek, en een meer dan oppervlakkig onderzoek van andere lichaamsholten, en

      b. het onderzoek geschiedt op een daartoe geschikte plaats en, indien het niet door een medisch deskundige
      wordt verricht, door een ambtenaar van hetzelfde geslacht als dat van de verdachte die aan het onderzoek wordt
      onderworpen.

      4 Indien bij het onderzoek, bedoeld in het derde lid, instrumenten of kunstmatige middelen worden aangewend met het
      doel de verwijdering van voorwerpen en stoffen uit het lichaam te bewerkstelligen, dient voor het gebruik daarvan
      door de rechter-commissaris machtiging te worden verleend. In die machtiging kunnen voorschriften worden gegeven
      met betrekking tot de wijze van uitvoering.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel78
  - number: '79'
    text: |-
      1 De rechter-commissaris kan op de vordering van de officier van justitie of op het verzoek van de verdachte of
      diens raadsman een deskundige, verbonden aan een van de bij of krachtens algemene maatregel van bestuur aan te
      wijzen laboratoria, benoemen met de opdracht een onderzoek te verrichten dat gebaseerd is op een vergelijking
      tussen kenmerken van celmateriaal. De deskundige brengt aan de rechter-commissaris een met redenen omkleed verslag
      uit.

      2 De rechter-commissaris geeft de verdachte, indien deze bekend is, steeds en zo spoedig mogelijk schriftelijk
      kennis van de aan de deskundige verleende opdracht, van de tijd waarop en van het laboratorium alwaar het onderzoek
      plaatsvindt of heeft plaatsgevonden en van de uitslag daarvan. Hij wijst de verdachte op [artikel 79b][ref1].

      3 De rechter-commissaris doet het celmateriaal vernietigen overeenkomstig de daartoe bij algemene maatregel van
      bestuur gestelde regels. Van de vernietiging wordt onverwijld proces-verbaal opgemaakt.

      4 Kenmerken van celmateriaal kunnen worden opgenomen in een register. Bij algemene maatregel van bestuur worden
      regels gesteld omtrent de inrichting en raadpleging van het register, alsmede omtrent de gevallen waarin de opname
      van gegevens in dit register is toegestaan en de wijze waarop daartegen bij het Hof beroep kan worden ingesteld.

      5 Het register, bedoeld in het vierde lid, kan, volgens bij algemene maatregel van bestuur te stellen regels,
      worden geraadpleegd ten behoeve van opsporingsonderzoek waarop het onderzoek, bedoeld in het eerste lid, geen
      betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel79b
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: 79b
  - number: 79a
    text: |-
      1 De rechter-commissaris kan op de vordering van de officier van justitie bevelen dat van de verdachte van een
      misdrijf waarvoor voorlopige hechtenis is toegelaten, bloed zal worden afgenomen ten behoeve van een onderzoek als
      bedoeld in [artikel 79, eerste lid][ref1].

      2 Het bevel kan slechts worden gegeven, indien uit feiten of omstandigheden blijkt van ernstige bezwaren tegen de
      verdachte en indien het onderzoek redelijkerwijze nodig is voor het aan de dag brengen van de waarheid. Het bevel
      is met redenen omkleed en wordt betekend aan de verdachte.

      3 De rechter-commissaris geeft het bevel niet, dan nadat de verdachte is gehoord en vruchteloos is uitgenodigd
      vrijwillig bloed ten behoeve van het onderzoek af te staan. De verdachte is bevoegd zich door een raadsman te doen
      bijstaan.

      4 Het bevel tot afname van bloed wordt niet ten uitvoer gelegd, indien aannemelijk is dat afname van bloed om
      bijzondere geneeskundige redenen onwenselijk is.

      5 De verdachte ten aanzien van wie een bevel als bedoeld in het eerste lid, is gegeven, wordt door een arts zoveel
      bloed afgenomen als voor het onderzoek en een tegenonderzoek noodzakelijk is.

      6 Bij toepassing van het vierde lid of indien de deskundige als bedoeld in [artikel 79, eerste lid][ref2], oordeelt
      dat het bloed van de verdachte geen geschikt materiaal voor het daar bedoelde onderzoek zal opleveren, kan de
      rechter-commissaris bevelen dat van de verdachte wangslijmvlies, haarwortels of ander bij algemene maatregel van
      bestuur aan te wijzen celmateriaal wordt afgenomen ten behoeve van een onderzoek als bedoeld in artikel 79, eerste
      lid. De laatste volzin van het tweede lid en het derde en vijfde lid zijn van overeenkomstige toepassing.

      7 De verdachte kan tegen het krachtens het eerste of zesde lid gegeven bevel binnen zeven dagen na betekening in
      hoger beroep komen bij het Hof van Justitie, dat zo spoedig mogelijk beslist. De verdachte wordt gehoord. Het bevel
      wordt in afwachting van de beslissing van het Hof niet ten uitvoer gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel79
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel79
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel79a
