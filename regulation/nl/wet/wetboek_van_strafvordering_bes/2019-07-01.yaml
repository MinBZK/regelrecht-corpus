  - number: '469'
    text: |-
      1 Het onderzoek en de beraadslaging, bedoeld in de [artikelen 392][ref1] en [394][ref2], geschieden zowel naar
      aanleiding van het onderzoek op de terechtzitting in herziening als van het onderzoek in vorige terechtzittingen,
      zoals dat volgens daarvan opgemaakt proces-verbaal heeft plaatsgehad.

      2 Ten aanzien van de bij de verwijzing vernietigde uitspraken doet het Hof opnieuw recht; ten aanzien van de bij
      de verwijzing niet vernietigde uitspraak handhaaft het Hof deze met gehele of gedeeltelijke overneming, aanvulling
      of verbetering van de gronden of doet, met gehele of gedeeltelijke vernietiging van de uitspraak, opnieuw recht met
      inachtneming van [artikel 461, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel392
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel394
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel461
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel469
