  - number: '262'
    text: |-
      1 De rechter-commissaris kan, op de vordering van de officier van justitie of op het verzoek van de verdachte, een
      of meer deskundigen benoemen, ten einde hem voor te lichten of bij te staan en, zo nodig, met opdracht het door hem
      gevorderde onderzoek in te stellen en hem een met redenen omkleed verslag uit te brengen. Hij kan hun dagvaarding
      bevelen.

      2 De verdachte is bevoegd te verzoeken dat een of meer door hem aanbevolen personen als deskundigen zullen worden
      benoemd. Indien het belang van het onderzoek dit niet verbiedt, kiest de rechter-commissaris een of meer van de
      deskundigen uit de door de verdachte aanbevolen personen.

      3 Ten aanzien van de deskundigen en hun verhoor vinden de [artikelen 243][ref1], en [245 tot en met 247][ref2]
      alsmede de [artikelen 251 tot en met 254][ref3] overeenkomstige toepassing.

      4 Ieder die tot deskundige is benoemd, is verplicht de door de rechter-commissaris gevorderde diensten te bewijzen.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel243
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel245
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel251
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel262
