        artikel: '45'
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '327'
        afdeling: Tweede
  - number: '337'
    text: |-
      1 Processen-verbaal, verslagen van deskundigen of andere stukken worden door de voorzitter, wanneer deze of een van
      de rechters of wel de procureur-generaal dit verlangt, voorgelezen, voor zover daarbij naar zijn oordeel redelijke
      grenzen niet worden overschreden.

      2 Gelijke voorlezing heeft plaats op verzoek van de verdachte, tenzij het Hof ambtshalve of op het verzet van de
      procureur-generaal anders beveelt.

      3 In alle gevallen waarin de verdachte verzoekt dat een getuigenverklaring op de terechtzitting zal worden
      voorgelezen, ten einde als aldaar afgelegd te worden aangemerkt, zal die voorlezing moeten geschieden.

      4 De voorlezing van stukken kan, tenzij de procureur-generaal of de verdachte zich daartegen verzet, worden
      vervangen door een mondelinge mededeling van de korte inhoud door de voorzitter.

      5 Ten bezware van de verdachte wordt, op straffe van nietigheid, op geen stukken acht geslagen, dan voor zover zij
      zijn voorgelezen, of hun korte inhoud overeenkomstig het vierde lid is meegedeeld.

      6 Stukken, die op de terechtzitting in eerste aanleg zijn voorgelezen, mogen voor de behandeling in hoger beroep
      als voorgelezen worden aangemerkt. Indien echter de verdachte verzoekt, dat bepaalde stukken opnieuw zullen worden
      voorgelezen, wordt aan dat verzoek gevolg gegeven, voor zover door die voorlezing naar het oordeel van het Hof
      redelijke grenzen niet worden overschreden.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel337
  - number: '338'
    text: |-
      1 Wanneer de verdachte zich ertegen verzet, dat een getuige op de voet van het bepaalde in het vierde lid van
      [artikel 261][ref1] anoniem is verhoord, kan het Hof die getuige horen zonder dat diens identiteit wordt onthuld.
      Het kan daartoe de nodige maatregelen nemen. Noch de procureur-generaal noch de verdachte of diens raadsman zijn
      bij het horen aanwezig. De [artikelen 38 tot en met 42][ref2] zijn van toepassing, doch alleen voor zover de
      inachtneming van die artikelen geen gevaar oplevert voor onthulling van de identiteit van de getuige. Alvorens de
      getuige te horen, stelt het Hof de procureur-generaal in de gelegenheid opmerkingen te maken.

      2 Is het Hof van oordeel, dat ernstige bedreiging in de zin van [artikel 261, eerste lid][ref3], niet kan worden
      aangenomen, dan beslist het, dat de getuige geen aanspraak maakt op anonimiteit en dat hij alleen dan opnieuw
      kan worden verhoord, indien het vierde lid van artikel 261 geen toepassing vindt. Een zodanig verhoor vindt niet
      plaats dan met toestemming van de procureur-generaal. Het Hof kan ook beslissen dat het proces-verbaal, houdende
      de verklaring die door de getuige ten overstaan van de rechter-commissaris anoniem is afgelegd, niet tot het bewijs
      van het strafbare feit is toegelaten.

      3 Indien naar het oordeel van het Hof ernstige bedreiging wel kan worden aangenomen, wordt het verweer van de
      verdachte verworpen en blijft het proces-verbaal van verhoor deel van de processtukken uitmaken. Indien een nader
      verhoor wenselijk wordt geoordeeld, kan het Hof beslissen dat de getuige door de rechter-commissaris met toepassing
      van het vierde lid van [artikel 261][ref4] nader zal worden verhoord, eventueel met vermelding van de vragen die
      het Hof gesteld wenst te zien.

      4 Nader verhoor door de rechter-commissaris kan ook worden opgedragen, indien bij een eerder verhoor bepaalde
      vormen zijn verzuimd.

      5 De bevoegdheid, bedoeld in het eerste lid, komt het Hof ook ambtshalve toe.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel261
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel261
      [ref4]: https://wetten.overheid.nl/BWBR0028681#Artikel261
