  - number: 503b
    text: |-
      De officier van justitie kan, zolang het onderzoek op de terechtzitting niet is gesloten, met de verdachte of
      veroordeelde een schriftelijke schikking aangaan tot betaling van een geldbedrag aan de Staat of tot overdracht
      van voorwerpen ten gehele of gedeeltelijke ontneming van het geschatte voordeel – met inbegrip van besparing van
      kosten – door de betrokkene door middel van of uit de baten van het feit waarvoor hij is vervolgd of soortgelijke
      feiten verkregen.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel503b
  - number: 503c
    text: |-
      1 Op de behandeling van de vordering van de officier van justitie is de
      [Tweede Afdeling van Titel IV van het vijfde Boek][ref1] van overeenkomstige toepassing. De behandeling van de
      vordering ter terechtzitting kan worden voorafgegaan door een schriftelijke voorbereiding op de wijze als door het
      gerecht te bepalen.

      2 Indien enig nader strafrechtelijk financieel onderzoek noodzakelijk blijkt, stelt het gerecht met schorsing der
      zaak onder aanduiding van het onderwerp van onderzoek en zo nodig de wijze waarop dit zal zijn in te stellen, de
      stukken in handen van de officier van justitie.

      3 Het onderzoek geldt als een met rechterlijke machtiging ingestelde strafrechtelijk financieel onderzoek
      dat wordt gevoerd overeenkomstig de bepalingen van [Titel XVI van het derde Boek][ref2], met uitzondering van
      [artikel 177g, vierde en vijfde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0028681#AfdelingTweede
      [ref2]: https://wetten.overheid.nl/BWBR0028681
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel177g
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel503c
