  - number: 177c
    text: |-
      1 Tijdens het strafrechtelijk financieel onderzoek is de officier van justitie bevoegd zonder verder rechterlijke
      machtiging te gelasten dat voorwerpen op grond van [artikel 119a][ref1] in beslag worden genomen.

      2 Indien de officier van justitie zulks in het belang van het strafrechtelijk financieel onderzoek noodzakelijk
      acht, vordert hij dat de rechter-commissaris ter inbeslagneming huiszoeking doet of andere hem krachtens het derde
      lid toekomende bevoegdheden uitoefent.

      3 De rechter-commissaris beschikt tijdens het strafrechtelijk financieel onderzoek over alle bevoegdheden die hem
      krachtens dit wetboek toekomen, met dien verstande dat:

      a. hij ook bevoegd is huiszoeking te doen ter inbeslagneming van alle voorwerpen die kunnen dienen om door degene
      tegen wie het onderzoek is gericht, verkregen wederrechtelijk voordeel aan te tonen, of de uitlevering daarvan
      te bevelen;

      b. hij niet gehouden is degene tegen wie het onderzoek is gericht of diens raadsman, buiten het geval van de in
      onderdeel a bedoelde huiszoeking, tot bijwoning van enige door hem te verrichten onderzoekshandeling toe te laten.

      4 De rechter-commissaris kan de uitoefening van ambtsverrichtingen in een ander eilandgebied overdragen aan zijn
      ambtgenoot aldaar.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel119a
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel177c
