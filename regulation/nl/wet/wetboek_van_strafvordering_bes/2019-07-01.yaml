  - number: 503g
    text: |-
      Een uitspraak op de vordering van het openbaar ministerie als bedoeld in
      [artikel 38e van het Wetboek van Strafrecht BES][ref1] vervalt van rechtswege, doordat de uitspraak als gevolg
      waarvan de veroordeling van de verdachte, bedoeld in artikel 38e eerste onderscheidenlijk derde lid van het Wetboek
      van Strafrecht BES, achterwege blijft, in kracht van gewijsde gaat.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel38e
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel503g
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: 38e
  - number: '504'
    text: |-
      Een rechter wordt op zijn verlangen van elke bemoeiing in een zaak verschoond, indien er te zijnen aanzien feiten
      of omstandigheden bestaan, waardoor in het algemeen de rechterlijke onpartijdigheid schade zou kunnen lijden.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel504
  - number: '505'
    text: |-
      1 De redenen van verschoning worden alle tegelijk voorgedragen.

      2 Een nieuwe verschoning kan door dezelfde rechter slechts worden voorgedragen om redenen die na de eerste
      voordracht zijn ontstaan of bekend geworden.

      3 Tijdens het onderzoek ter terechtzitting kan een verschoning niet meer worden voorgedragen na de voordracht van
      de zaak door het openbaar ministerie, bedoeld bij [artikel 318][ref1], tenzij om redenen die eerst in de loop van
      dat onderzoek zijn ontstaan of bekend geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel318
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel505
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '318'
        afdeling: Tweede
  - number: '506'
    text: |-
      1 Een verschoning wordt voorgedragen aan het Hof, dat daarover ten spoedigste beslist.

      2 Het Hof zal, alvorens te beslissen, de rechter kunnen uitnodigen, de voorgedragen verschoning schriftelijk dan
      wel mondeling toe te lichten. Deze geeft aan de uitnodiging gevolg.

      3 Bij de beslissing kan tevens worden bepaald dat bepaalde handelingen of beslissingen van de rechter wiens
      verschoning is aangenomen, van onwaarde zullen zijn.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel506
  - number: '507'
    text: |-
      1 De rechter die zijn verschoning heeft voorgedragen, is, in afwachting van de beslissing daaromtrent, in de zaak
      uitgesloten van alle bemoeiingen die uitstel gedogen of door andere rechters kunnen worden verricht.

      2 Wordt de verschoning eerst tijdens het onderzoek ter terechtzitting voorgedragen, dan wordt dat onderzoek
      geschorst. Wordt de verschoning aangenomen, dan wordt het onderzoek ter terechtzitting opnieuw aangevangen, hetzij
      onmiddellijk, hetzij op een latere terechtzitting. De beslissing wordt op de terechtzitting waarin het onderzoek
      van de zaak wordt hervat of opnieuw aangevangen, uitgesproken.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel507
  - number: '508'
    text: |-
      Ingeval er ten aanzien van een rechter feiten of omstandigheden bestaan, waardoor in het algemeen de rechterlijke
      onpartijdigheid ernstig schade zou kunnen lijden, kan diens wraking schriftelijk of, ter terechtzitting, mondeling
      worden voorgedragen door het openbaar ministerie en door de verdachte of diens raadsman.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel508
  - number: '509'
    text: |-
      1 Zo redenen van wraking ten aanzien van meer dan een rechter bestaan, kan een verdere wraking niet worden
      voorgedragen, dan nadat over de vroegere is beslist.

      2 De redenen van wraking worden alle tegelijk voorgedragen.

      3 Een nieuwe wraking kan ten aanzien van dezelfde rechter slechts worden voorgedragen om redenen die na de eerste
      voordracht zijn ontstaan of bekend geworden.

      4 Tijdens het onderzoek op de terechtzitting kan een wraking niet meer worden voorgedragen na de voordracht van de
      zaak door het openbaar ministerie, bedoeld bij [artikel 318][ref1], tenzij om redenen die eerst in de loop van dat
      onderzoek zijn ontstaan of bekend geworden.

      5 Wordt de wraking op de terechtzitting voorgedragen, dan kan de rechter, ingeval van klaarblijkelijk misbruik,
      bepalen dat volgende voordrachten tot wraking niet ontvankelijk zullen zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel318
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel509
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '318'
        afdeling: Tweede
  - number: '510'
    text: |-
      Ingeval de rechter alleen rechtspreekt of als enig rechter bemoeiing in de zaak verricht, worden de redenen van
      wraking aan hemzelf voorgedragen, waarna het Hof van Justitie daarover ten spoedigste beslist. De verdachte wordt
      gehoord.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel510
  - number: '511'
    text: |-
      1 Het Hof zal, alvorens te beslissen, de rechter kunnen uitnodigen, zich omtrent de voorgedragen redenen van
      wraking schriftelijk of mondeling te verklaren. Deze geeft aan de uitnodiging gevolg.

      2 Bij de beslissing kan tevens worden bepaald dat bepaalde handelingen of beslissingen van de rechter wiens wraking
      is aangenomen, van onwaarde zullen zijn.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel511
  - number: '512'
    text: |-
      1 De rechter die gewraakt wordt, is, in afwachting van de beslissing daaromtrent, in de zaak uitgesloten van alle
      bemoeiingen die uitstel gedogen of door andere rechters kunnen worden verricht.

      2 Wordt de wraking eerst tijdens het onderzoek op de terechtzitting voorgedragen, dan wordt dat onderzoek
      geschorst. Wordt zij aangenomen, dan wordt het onderzoek op een latere terechtzitting opnieuw aangevangen.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel512
  - number: '513'
    text: |-
      1 Rechters die verklaard hebben zich te willen verschonen of wier wraking wordt voorgedragen, onthouden zich, op
      straffe van nietigheid, van deelneming aan de beslissing van het Hof over de verschoning of wraking.

      2 Ingeval de verschoning of wraking eerst tijdens het onderzoek op de terechtzitting van het Hof wordt
      voorgedragen, wordt ter vervanging van elk lid dat verlangt verschoond te worden of wiens wraking voorgedragen
      wordt, door de president van het Hof een rechter aangewezen om met de overige leden over de verschoning of wraking
      te beslissen.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel513
  - number: '514'
    text: |-
      De beslissingen over de wraking, worden de verdachte voorgelezen of, indien deze niet bij de beslissing aanwezig
      is, hem betekend.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel514
  - number: '515'
    text: |-
      Onder rechters worden in deze titel begrepen de leden en plaatsvervangende leden van het Hof en de
      rechtersplaatsvervanger in eerste aanleg.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel515
  - number: '516'
    text: |-
      1 Indien een strafvervolging wordt ingesteld tegen een rechtspersoon of doelvermogen, wordt deze rechtspersoon of
      dit doelvermogen tijdens de vervolging vertegenwoordigd door de bestuurder of, indien er meer bestuurders zijn,
      door een van hen. De vertegenwoordiger kan bij gemachtigde verschijnen.

      2 Indien de strafvervolging wordt ingesteld tegen een maatschap of vennootschap zonder rechtspersoonlijkheid,
      wordt deze tijdens de vervolging vertegenwoordigd door de aansprakelijke vennoot of, indien er meer aansprakelijke
      vennoten zijn, door een van hen. De vertegenwoordiger kan bij gemachtigde verschijnen.

      3 De rechter kan de persoonlijke verschijning van een bepaalde bestuurder of vennoot bevelen; hij kan bij niet
      verschijnen zijn medebrenging gelasten.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel516
  - number: '517'
    text: |-
      1 Indien de strafvervolging wordt ingesteld tegen een rechtspersoon, geschiedt de kennisgeving van gerechtelijke
      mededelingen aan:

      a. de vestigingsplaats van de rechtspersoon, dan wel

      b. de plaats van het kantoor van de rechtspersoon, dan wel

      c. de woonplaats van een van de bestuurders.

      2 Betekening van een gerechtelijke mededeling geschiedt door uitreiking aan een van de bestuurders, dan wel aan
      een persoon die door de rechtspersoon is gemachtigd het stuk in ontvangst te nemen. De uitreiking geldt in deze
      gevallen als betekening in persoon.

      3 De uitreiking van een gerechtelijke mededeling, als bedoeld in het tweede lid, kan eveneens geschieden op een van
      de plaatsen omschreven in het eerste lid, aan ieder die in dienstbetrekking is van de rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel517
  - number: '518'
    text: |-
      1 Indien de strafvervolging wordt ingesteld tegen een maatschap of vennootschap zonder rechtspersoonlijkheid,
      geschiedt de kennisgeving van gerechtelijke mededelingen aan:

      a. de plaats van het kantoor van de maat- of vennootschap, dan wel

      b. de woonplaats van een van de aansprakelijke vennoten.

      2 Betekening van een gerechtelijke mededeling geschiedt door uitreiking aan een van de aansprakelijke vennoten dan
      wel aan een persoon die door een of meer van hun is gemachtigd het stuk in ontvangst te nemen. De uitreiking geldt
      in deze gevallen als betekening in persoon.

      3 De uitreiking van een gerechtelijke mededeling, als bedoeld in het tweede lid, kan eveneens geschieden op een van
      de plaatsen, omschreven in het eerste lid, aan ieder die in dienstbetrekking is van de maat- of vennootschap of van
      een aansprakelijke vennoot.

      4 De voorgaande leden zijn van overeenkomstige toepassing bij de vervolging van een doelvermogen; in dit geval
      treden de bestuurders in de plaats van de aansprakelijke vennoten.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel518
  - number: '519'
    text: |-
      Heeft de uitreiking niet overeenkomstig [artikel 517, tweede of derde lid][ref1], of
      [artikel 518, tweede of derde lid][ref2], kunnen plaatsvinden, dan wordt het schrijven teruggezonden aan de
      autoriteit van welke het is uitgegaan en vervolgens uitgereikt aan de griffier van het gerecht in eerste aanleg
      in het rechtsgebied waar de zaak zal dienen of laatstelijk heeft gediend. De griffier zendt het schrijven alsdan
      onverwijld als gewone brief over de post aan het in het schrijven vermelde adres en tekent zulks aan op de akte
      van uitreiking.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel517
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel518
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel519
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '517'
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '518'
  - number: '520'
    text: |-
      1 Op de kennisgeving van gerechtelijke mededelingen aan een rechtspersoon, maatschap of vennootschap zonder
      rechtspersoonlijkheid of een doelvermogen zijn de [artikelen 642][ref1], [643][ref2], [644][ref3] en [646][ref4]
      van overeenkomstige toepassing.

      2 De betekening is nietig, indien de uitreiking niet heeft plaatsgehad overeenkomstig het bepaalde in de
      [artikelen 517, tweede en derde lid][ref5], [518, tweede en derde lid][ref6], [519][ref7], [643, zesde lid][ref8],
      en [646][ref9]. [Artikel 647, tweede lid][ref10], is van overeenkomstige toepassing.


