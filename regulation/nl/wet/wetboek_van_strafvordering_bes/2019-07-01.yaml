  - number: 119c
    text: |-
      Op het beslag, bedoeld in [artikel 119a][ref1],
      [Boek 3, Titel 4, van het Wetboek van Burgerlijke Rechtsvordering BES ][ref2]van overeenkomstige toepassing,
      behoudens dat:

      a. voor het leggen van het beslag geen verlof van de rechter in eerste aanleg vereist is, noch vrees voor
      verduistering behoeft te bestaan;

      b. een maximum bedrag waarvoor het recht tot verhaal zal worden uitgeoefend in het proces-verbaal van
      inbeslagneming of het beslagexploit dient te worden vermeld;

      c. geen overeenkomstige toepassing toekomt aan voorschriften omtrent termijnen waarbinnen na het beslag de eis in
      de hoofdzaak dient te zijn ingesteld;

      d. voor roerende zaken die geen registergoederen zijn en rechten aan toonder of order ook volstaan kan worden met
      het door een opsporingsambtenaar opmaken van een proces-verbaal van inbeslagneming en het afgeven van een bewijs
      van ontvangst aan degene bij wie de voorwerpen in beslag zijn genomen;

      e. het niet in acht nemen van termijnen waarbinnen betekening van het beslag moet plaatsvinden, buiten de gevallen
      van [artikel 119b, onderdeel b][ref3], geen nietigheid van het beslag meebrengt;

      f. geen overeenkomstige toepassing toekomt aan
      [artikel 721 van het Wetboek van Burgerlijke Rechtsvordering BES][ref4]. De officier van justitie geeft, indien
      de hoofdzaak na het beslag ter terechtzitting aanhangig wordt gemaakt, daarvan zo spoedig mogelijk aan de derde
      schriftelijk kennis;

      g. geen overeenkomstige toepassing toekomt aan
      [artikel 722 van het Wetboek van Burgerlijke Rechtsvordering BES][ref5];

      h. op in beslag genomen roerende zaken die in bewaring worden genomen de [artikelen 141 tot en met 143][ref6] van
      toepassing zijn;

      i. de beëindiging van het beslag met inachtneming van de bepalingen van dit wetboek geschiedt.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel119a
