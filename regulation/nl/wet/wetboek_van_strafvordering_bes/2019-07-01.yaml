  - number: '71'
    text: |-
      Bij de toepassing van elk dwangmiddel gelden, behalve de overige in dit wetboek gestelde eisen, als algemene
      voorwaarden:

      a. dat de toepassing van het dwangmiddel, na afweging van de in het geding zijnde belangen, niet onredelijk is,

      b. dat de bevoegdheid een dwangmiddel toe te passen niet voor een ander doel wordt aangewend dan waarvoor zij is
      verleend,

      c. dat het doel van het dwangmiddel niet op andere, meer doelmatige en minder ingrijpende wijze kan worden bereikt,
      en

      d. dat de ernst van de door het dwangmiddel te veroorzaken inbreuk redelijkerwijze door de ernst van het strafbare
      feit wordt gerechtvaardigd.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel71
  - number: '72'
    text: |-
      1 Iedere opsporingsambtenaar is bevoegd van de verdachte een opgave van zijn naam, voornamen, geboortedatum, adres
      en woon- of verblijfplaats te vorderen en hem daartoe staande te houden. De verdachte is verplicht aan de vordering
      te voldoen.

      2 De opsporingsambtenaar is tevens bevoegd getuigen naar de in het eerste lid bedoelde gegevens te vragen.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel72
  - number: '73'
    text: |-
      1 In geval van ontdekking op heterdaad van enig strafbaar feit is ieder bevoegd de verdachte aan te houden.

      2 Geschiedt de aanhouding door een opsporingsambtenaar, dan draagt deze zorg dat de aangehoudene zonder uitstel
      naar een plaats van verhoor en terstond daarna voor een officier van justitie of een hulpofficier wordt geleid.

      3 Geschiedt de aanhouding door de officier van justitie of een hulpofficier dan geleidt deze de aangehoudene zonder
      uitstel naar een plaats van verhoor; hij kan ook de aanhouding of voorgeleiding van de verdachte bevelen.

      4 Geschiedt de aanhouding door een ander, dan levert deze de aangehoudene onverwijld aan een opsporingsambtenaar
      over, onder afgifte aan deze van mogelijk inbeslaggenomen voorwerpen, die dan handelt overeenkomstig de bepaling
      van het tweede lid. In geval van overlevering aan de officier van justitie of de hulpofficier is het derde lid
      van toepassing.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel73
  - number: '74'
    text: |-
      1 Ook buiten het geval van ontdekking op heterdaad is de officier van justitie bevoegd de verdachte van
      enig strafbaar feit waarvoor voorlopige hechtenis is toegelaten, of van het strafbare feit omschreven in
      [artikel 454, aanhef en onder ten 3e, van het Wetboek van Strafrecht BES][ref1], aan te houden en zonder uitstel
      naar een plaats van verhoor te geleiden; hij kan ook de aanhouding of voorgeleiding van de verdachte bevelen.

      2 Kan het optreden van de officier van justitie niet worden afgewacht, dan komt gelijke bevoegdheid toe aan de
      hulpofficier van justitie. De hulpofficier geeft van de aanhouding onverwijld schriftelijk of mondeling kennis aan
      de officier van justitie.

      3 Kan ook het optreden van een hulpofficier niet worden afgewacht, dan is elke opsporingsambtenaar bevoegd de
      verdachte aan te houden, onder de verplichting zorg te dragen dat hij onverwijld voor de officier van justitie of
      de hulpofficier wordt geleid. Op de hulpofficier voor wie de verdachte wordt geleid, is de tweede volzin van het
      tweede lid van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel454
