  - number: '414'
    text: |-
      Zaken, uitsluitend betreffende feiten die als overtreding strafbaar zijn gesteld, worden door of vanwege de
      officier van justitie ter terechtzitting aanhangig gemaakt:

      a. hetzij door oproeping;

      b. hetzij door dagvaarding.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel414
  - number: '415'
    text: |-
      De officier van justitie, hoofd van het parket, kan ten aanzien van het al of niet aanhangig maken door oproeping
      aan de opsporingsambtenaren de nodige algemene of bijzondere voorschriften geven.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel415
  - number: '416'
    text: |-
      1 Het aanhangig maken van de zaak door oproeping kan enkel plaats vinden in geval van ontdekking op heterdaad door
      een opsporingsambtenaar. Het aanhangig maken geschiedt doordat aan de verdachte onverwijld een oproeping wordt
      uitgereikt door een opsporingsambtenaar om te verschijnen op een in die oproeping vermelde terechtzitting van het
      gerecht in eerste aanleg. De officier van justitie, hoofd van het parket, geeft voorschriften omtrent de dag en het
      tijdstip van de terechtzitting waartegen de oproeping geschiedt.

      2 Bij de uitreiking worden desgevraagd inhoud en strekking van de oproeping aan de verdachte, zo mogelijk,
      mondeling kort toegelicht.

      3 Wordt een aangeboden oproeping niet aangenomen, dan wordt zij niettemin geacht de verdachte op het ogenblik
      van de aanbieding te zijn uitgereikt. In dat geval wordt volstaan met toezending van een oproeping over de post,
      uiterlijk op de twintigste dag na de ontdekking van het feit.

      4 Van het uitreiken van de oproeping, van het niet aannemen en de redenen daarvan en van het toezenden van de
      oproeping over de post wordt in het proces-verbaal van de opsporingsambtenaar melding gemaakt.

      5 De oproeping bevat een vermelding van de bevoegdheid, de verdachte toegekend bij
      [artikel 76, eerste lid, van het Wetboek van Strafrecht BES][ref1].

      6 Niet nakoming van het eerste, derde of vierde lid heeft nietigheid van de oproeping tot gevolg.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel76
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel416
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '76'
  - number: '417'
    text: |-
      1 Bij de oproeping wordt de gewone termijn van dagvaarding in acht genomen.

      2 Indien de verdachte overeenkomstig [artikel 74][ref1] is aangehouden, kan onverwijld een oproeping worden
      uitgereikt en kan hij worden opgeroepen om nog op de dag zelf ter terechtzitting van het gerecht in eerste
      aanleg te verschijnen. Hij kan dan voor de officier van justitie en vervolgens ter terechtzitting worden geleid.
      [Artikel 428, derde lid][ref2], blijft in dit geval buiten toepassing.

      3 De oproeping voldoet aan de eisen in [artikel 285, eerste lid][ref3], betreffende de dagvaarding gesteld. Evenwel
      kan met een korte aanduiding van het feit worden volstaan.

      4 De oproeping wordt door de opsporingsambtenaar, die het feit heeft geconstateerd, gedagtekend en ondertekend.

      5 Niet-nakoming van het eerste, derde of vierde lid van dit artikel heeft nietigheid van de oproeping tot gevolg.
      Vrijwillige verschijning dekt de nietigheid.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel74
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel428
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel285
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel417
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '74'
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '428'
      - id: ref3
        bwb_id: BWBR0028681
        artikel: '285'
  - number: '418'
    text: |-
      1 Zolang het onderzoek op de terechtzitting nog niet is aangevangen, kan de officier van justitie de intrekking van
      de oproeping, zo mogelijk schriftelijk, aan de verdachte doen meedelen.

      2 Indien de officier van justitie oordeelt, dat de zaak op een latere terechtzitting moet worden aangebracht, doet
      hij de verdachte die latere zitting aanzeggen.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel418
  - number: '419'
    text: |-
      Het formulier van de oproeping aan de verdachte om ter terechtzitting te verschijnen wordt vastgesteld bij algemene
      maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel419
  - number: '420'
    text: |-
      1 In zaken, die door oproeping op de dag zelf ter terechtzitting aanhangig zijn gemaakt, kunnen getuigen door de
      ambtenaar, die het feit heeft opgespoord, worden uitgenodigd om ter terechtzitting van het gerecht in eerste aanleg
      te verschijnen. De uitnodiging wordt door een deurwaarder of ambtenaar van politie uitgereikt aan de persoon van de
      getuige of aan een van zijn huisgenoten.

      2 Een dubbel van de uitnodiging wordt bij de processtukken gevoegd.

      3 Indien de officier van justitie de oproeping van de verdachte intrekt of oordeelt, dat de zaak op een latere
      terechtzitting moet worden aangebracht, geeft hij daarvan onverwijld, aan de ingevolge dit artikel uitgenodigde
      getuigen kennis.

      4 Het formulier van de uitnodiging aan de getuigen om ter terechtzitting van het gerecht in eerste aanleg te
      verschijnen wordt vastgesteld bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel420
  - number: '421'
    text: |-
      De officier van justitie is bevoegd getuigen, deskundigen en tolken mondeling op te roepen of door een deurwaarder
      of een ambtenaar van politie mondeling te doen oproepen om ter terechtzitting van het gerecht in eerste aanleg
      te verschijnen.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel421
  - number: '422'
    text: |-
      1 Indien de zaak aanhangig is gemaakt door oproeping, is [artikel 307][ref1] betreffende het verstek van
      toepassing.

      2 Voor de toepassing van de [artikelen 411][ref2], [429][ref3] en [437][ref4] wordt een oproeping, die aan de
      persoon van de verdachte is uitgereikt, gelijkgesteld met een dagvaarding om ter terechtzitting te verschijnen, die
      aan de persoon van de verdachte is betekend.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel307
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel411
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel429
      [ref4]: https://wetten.overheid.nl/BWBR0028681#Artikel437
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel422
