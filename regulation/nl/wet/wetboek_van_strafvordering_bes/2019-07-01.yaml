  - number: 177h
    text: |-
      1 Bevelen tot toepassing van een bevoegdheid als bedoeld in [titel XVIII][ref1] en [XIX][ref2] alsmede een
      wijziging, aanvulling, verlenging of intrekking daarvan worden schriftelijk gegeven. Aan een schriftelijk bevel
      staat gelijk een mondeling bevel dat, op straffe van nietigheid, binnen drie dagen op schrift wordt gesteld.

      2 Een schriftelijk bevel vermeldt:

      a. het misdrijf en in geval van verdenking indien bekend de naam of anders een zo nauwkeurig mogelijke aanduiding
      van de verdachte;

      b. de feiten en omstandigheden waaruit blijkt dat de wettelijke voorwaarden voor uitoefening van de bevoegdheid
      zijn vervuld;

      c. de wijze waarop aan het bevel uitvoering moet worden gegeven, en

      d. de geldigheidsduur van het bevel.

      3 Elk bevel kan worden gewijzigd, aangevuld, verlengd of ingetrokken.

      4 Onverminderd [artikel 53][ref3] worden schriftelijke bevelen, alsmede de schriftelijke wijziging, aanvulling,
      verlenging en intrekking ervan, bij de processtukken gevoegd, zodra het onderzoek dit toelaat.

      5 Zodra niet meer wordt voldaan aan de voorwaarden, die ten grondslag liggen aan de gegeven bevoegdheid, bepaalt
      de officier van justitie dat de uitvoering van het bevel, de vordering dan wel de overeenkomst tot toepassing ervan
      wordt beëindigd.

      6 Teneinde toepassing te geven aan een bevel als bedoeld in het eerste lid, kan een technisch hulpmiddel worden
      ingezet. Onder het inzetten van een technisch hulpmiddel wordt mede verstaan het plaatsen en verwijderen van een
      technisch hulpmiddel.

      7 Bij algemene maatregel van bestuur kunnen regels worden gesteld omtrent de technische eisen waaraan de
      hulpmiddelen, bedoeld in het zesde lid, voldoen, onder meer met het oog op de onschendbaarheid van de vastgelegde
      waarnemingen.


      [ref1]: https://wetten.overheid.nl/BWBR0028681
      [ref2]: https://wetten.overheid.nl/BWBR0028681
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel53
