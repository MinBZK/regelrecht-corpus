  - number: '527'
    text: |-
      De bevoegdheid, omschreven in [artikel 72][ref1], komt mede toe aan de commandant, de schipper en de gezagvoerder
      van een luchtvaartuig.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel72
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel527
