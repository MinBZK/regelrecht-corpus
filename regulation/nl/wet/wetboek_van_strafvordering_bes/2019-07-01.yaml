        artikel: '461'
  - number: '470'
    text: |-
      1 In geen geval mag een straf worden opgelegd, die de bij het vernietigde vonnis opgelegde te boven gaat.

      2 Indien bij samenloop van meerdere feiten een hoofdstraf is uitgesproken en de herziening slechts gevraagd is ten
      aanzien van een of meer van die feiten, wordt, in geval van vernietiging, bij de uitspraak in herziening de straf
      voor het andere feit of de andere feiten bepaald.

      3 Indien uit het nieuwe onderzoek blijkt dat de verdachte een ander strafbaar feit heeft gepleegd dan waarvoor hij
      veroordeeld is en dat strafbare feit hem oorspronkelijk mede was ten laste gelegd zonder dat daarover was beslist,
      doet het Hof te dier zake uitspraak en kan hem wegens dat feit veroordelen, zonder dat echter de straf zwaarder mag
      zijn dan welke bij het vernietigde vonnis is opgelegd.

      4 Bij de uitspraak wordt bepaald dat de reeds vroeger krachtens de vernietigde uitspraak voor het feit ondergane
      straf, en de krachtens [artikel 465][ref1] ondergane voorlopige hechtenis in mindering zal worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel465
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel470
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '465'
  - number: '471'
    text: |-
      Indien gedurende de behandeling van de zaak de veroordeelde overlijdt, wordt het geding voortgezet en wordt
      door het Hof een bijzondere curator benoemd. De voorgaande artikelen van deze titel zijn dan van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel471
  - number: '472'
    text: |-
      1 Indien van straf, opgelegd bij het gewijsde, door gratie kwijtschelding is verleend, of in geval van voortzetting
      van het geding tegen de benoemde bijzondere curator, kan in geen geval straf worden opgelegd.

      2 Is de straf door gratie gewijzigd of verminderd, dan wordt in geen geval een straf opgelegd, die de gewijzigde of
      verminderde te boven gaat.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel472
  - number: '473'
    text: |-
      1 De aanvrage tot herziening kan na het overlijden van de veroordeelde gedaan worden door de overlevende
      echtgenoot, dan wel de persoon met wie de overledene duurzaam feitelijk samenwoonde, elke bloedverwant in de rechte
      lijn of in de tweede graad van de zijlijn en door de procureur-generaal.

      2 De voorgaande artikelen van deze titel zijn dan van overeenkomstige toepassing.

      3 Deze aanvrage strekt alleen tot opheffing van de veroordeling tegen de overledene uitgesproken.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel473
  - number: '474'
    text: |-
      Geen rechter die op enigerlei wijze deelgenomen heeft aan het onderzoek of de berechting van de zaak waarvan
      herziening wordt gevraagd, mag aan het onderzoek of de berechting in herziening deelnemen.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel474
  - number: '475'
    text: |-
      Indien na de vernietiging van het gewijsde geen straf of maatregel of wel de maatregel, bedoeld bij
      [artikel 39, tweede lid, van het Wetboek van Strafrecht BES][ref1], wordt opgelegd, wordt, op verzoek van de
      gewezen veroordeelde of van zijn erfgenamen, ter zake van de ondergane straf een schadevergoeding toegekend. De
      toekenning heeft plaats op de voet van het bepaalde in de [artikelen 178 tot en met 181][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel178
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel475
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '39'
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '178'
  - number: '476'
    text: |-
      De leden van de Staten-Generaal, de ministers en de staatssecretarissen kunnen, ook na hun aftreden, krachtens deze
      wet niet strafrechtelijk worden vervolgd wegens ambtsmisdrijven in die betrekkingen gepleegd.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel476
  - number: '477'
    text: |-
      Niemand kan strafrechtelijk worden vervolgd wegens een feit begaan voordat hij de leeftijd van twaalf jaren heeft
      bereikt.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel477
  - number: '478'
    text: |-
      1 In gevallen, waarin uit feiten of omstandigheden een redelijk vermoeden voortvloeit, dat een
      minderjarige beneden de leeftijd van twaalf jaren een strafbaar feit heeft begaan, zijn uitsluitend de
      [artikelen 72 tot en met 79][ref1], [80][ref2], [82][ref3], [120 tot en met 129][ref4], [145][ref5], [150][ref6],
      [153][ref7] en [154][ref8] van toepassing. De artikelen [141 tot en met 143][ref9] zijn van overeenkomstige
      toepassing.

      2 Het afleggen van een verklaring als bedoeld in [artikel 144][ref10] en het doen van beklag als bedoeld
      in [artikel 150][ref11] geschiedt voor de minderjarige, in het eerste lid bedoeld, door zijn wettelijke
      vertegenwoordiger in burgerlijke zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel80
