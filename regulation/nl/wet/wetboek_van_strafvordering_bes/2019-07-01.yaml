        artikel: '374'
        afdeling: Derde
  - number: '289'
    text: |-
      1 De verdachte heeft het recht getuigen en deskundigen ter terechtzitting te doen dagvaarden.

      2 Hij geeft deze daartoe ten minste drie dagen voor de terechtzitting in persoon ten parkette van de officier van
      justitie of schriftelijk bij aangetekende, aan de officier gerichte brief op. Hij vermeldt daarbij de namen, het
      beroep en de woon- of verblijfplaats, of, bij onbekendheid van een of ander, duidt hij hen zo nauwkeurig mogelijk
      aan. Bij schriftelijke opgave geldt de dag van ontvangst van de brief, die onverwijld daarop wordt aangetekend, als
      dag van opgave.

      3 De officier van justitie doet de getuigen of deskundigen, opgegeven met inachtneming van het tweede lid,
      onverwijld dagvaarden, tenzij er naar zijn oordeel dwingende gronden bestaan om de dagvaarding te weigeren. In dit
      laatste geval maakt hij de verdachte opmerkzaam op het bepaalde in [artikel 318, derde lid][ref1].

      4 De getuigen en deskundigen, die zijn gedagvaard, worden gebracht op de in [artikel 318, tweede lid][ref2],
      bedoelde lijst.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel318
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel318
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel289
