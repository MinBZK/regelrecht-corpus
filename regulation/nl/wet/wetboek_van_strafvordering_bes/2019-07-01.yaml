  - number: 503e
    text: |-
      Het gerecht kan de schatting van het op geld waardeerbare voordeel als bedoeld in
      [artikel 38e van het Wetboek van Strafrecht BES][ref1] slechts ontlenen aan de inhoud van wettige bewijsmiddelen.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel38e
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel503e
