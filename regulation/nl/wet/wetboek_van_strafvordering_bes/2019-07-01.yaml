  - number: '220'
    text: |-
      Indien bij afwezigheid van de officier van justitie gedurende het onderzoek enig strafbaar feit wordt begaan, doet
      de rechter-commissaris daarvan een proces-verbaal opmaken en dat toekomen aan de officier van justitie.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel220
  - number: '221'
    text: |-
      1 Indien de officier van justitie overeenkomstig de bepaling van [artikel 187][ref1] ten aanzien van een strafbaar
      feit een gerechtelijk vooronderzoek nodig acht, vordert hij dat door de rechter-commissaris onverwijld daartoe zal
      worden overgegaan.

      2 In de vordering wordt het feit zo nauwkeurig mogelijk omschreven als in deze stand van de zaak mogelijk is.

      3 Die vordering of, zo de verdachte eerst later bekend wordt, een onverwijld in te dienen nadere vordering wijst de
      verdachte aan.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel187
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel221
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '187'
        afdeling: Eerste
  - number: '222'
    text: |-
      1 De officier van justitie dient ook een nadere vordering in, zodra het gerechtelijk vooronderzoek tot andere
      strafbare feiten moet worden uitgebreid, en, zodra het belang van het onderzoek de indiening toelaat, wanneer een
      meer nauwkeurige omschrijving van het feit mogelijk is geworden.

      2 Zodra de rechter-commissaris, al of niet na verzoek van de verdachte, oordeelt dat een nadere vordering nodig is,
      geeft hij daarvan schriftelijk kennis aan de officier van justitie.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel222
  - number: '223'
    text: |-
      1 De rechter-commissaris deelt de officier van justitie de inhoud van de stukken van het gerechtelijk vooronderzoek
      mee, zo dikwijls deze dit verlangt.

      2 Indien de inhoud van die stukken de officier van justitie daartoe aanleiding geeft, doet hij de vereiste
      vorderingen tot nader onderzoek.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel223
  - number: '224'
    text: |-
      1 Indien de rechter-commissaris oordeelt, dat tot het gerechtelijk vooronderzoek geen grond bestaat, verklaart hij
      dit bij een met redenen omklede beschikking.

      2 Onverminderd het bepaalde in [artikel 221][ref1] kan de rechter-commissaris, zo de verdachte zich in voorlopige
      hechtenis bevindt en aan hem nog niet een dagvaarding ter terechtzitting is betekend, op het verzoek van de
      verdachte een gerechtelijk vooronderzoek instellen ten aanzien van het feit waarvoor de voorlopige hechtenis is
      bevolen. Indien de rechter-commissaris oordeelt, dat grond tot gebruik van deze bevoegdheid bestaat, verklaart hij
      dit bij een met redenen omklede beschikking. Een afschrift daarvan zendt hij aan de officier van justitie.

      3 Zodra een overeenkomstig het tweede lid ingesteld gerechtelijk vooronderzoek moet worden uitgebreid tot andere
      strafbare feiten, dient de officier van justitie een daartoe strekkende vordering in.

      4 Wanneer een meer nauwkeurige omschrijving van het feit mogelijk is geworden, dient de officier van justitie een
      dienovereenkomstige vordering in, zodra het belang van het onderzoek de indiening toelaat.

      5 [Artikel 222, tweede lid][ref2], en [artikel 223][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel221
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel222
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel223
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel224
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '221'
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '222'
        afdeling: Eerste
      - id: ref3
        bwb_id: BWBR0028681
        artikel: '223'
        afdeling: Eerste
  - number: '225'
    text: |-
      1 Telkens ter gelegenheid van het eerste verhoor van de verdachte, nadat een vordering als vermeld in de
      [artikelen 221][ref1], [222][ref2] en [224, derde en vierde lid][ref3], is ingekomen, dan wel een beschikking
      als bedoeld in artikel 222, tweede lid, is gegeven, wordt hem door de rechter-commissaris een afschrift van die
      vordering of beschikking ter hand gesteld.

      2 De rechter-commissaris kan echter bevelen, dat de vordering of de beschikking reeds voor het verhoor aan de
      verdachte zal worden betekend.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel221
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel222
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel224
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel225
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '221'
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '222'
        afdeling: Eerste
      - id: ref3
        bwb_id: BWBR0028681
        artikel: '224'
        afdeling: Eerste
  - number: '226'
    text: |-
      1 Indien tot het instellen van het onderzoek wordt overgegaan, worden zo spoedig en zo dikwijls het belang van de
      zaak dit vordert, verdachten, getuigen en deskundigen verhoord.

      2 De officier van justitie en de raadsman zijn bevoegd de verhoren van de rechter-commissaris bij te wonen. De
      rechter-commissaris bevordert, dat zij bij de verhoren tegenwoordig kunnen zijn, zonder dat het onderzoek daardoor
      mag worden opgehouden.

      3 De officier van justitie en de raadsman kunnen, ook wanneer zij de verhoren niet bijwonen, de vragen opgeven die
      zij wensen te zien gesteld. Ten aanzien van de raadsman is [artikel 48, derde en vijfde lid][ref1], van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel48
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel226
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '48'
        afdeling: Tweede
  - number: '227'
    text: |-
      Onverminderd het bepaalde in [artikel 261][ref1], nodigt de rechter-commissaris, indien naar zijn oordeel het
      gegrond vermoeden bestaat dat de getuige of de deskundige niet ter terechtzitting zal kunnen verschijnen, de
      officier van justitie, de verdachte en de raadsman tot bijwoning van het verhoor uit, tenzij het belang van het
      onderzoek geen uitstel van het verhoor gedoogt.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel261
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel227
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '261'
        afdeling: Vijfde
  - number: '228'
    text: |-
      De rechter-commissaris neemt de nodige maatregelen om te beletten dat de voor verhoor verschenen verdachten,
      getuigen en deskundigen zich voor of tijdens hun verhoor met elkaar onderhouden.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel228
  - number: '229'
    text: |-
      1 De verdachten, getuigen en deskundigen worden ieder afzonderlijk verhoord.

      2 De rechter-commissaris kan hen echter, hetzij op de vordering van de officier van justitie, hetzij op het verzoek
      van de verdachte of diens raadsman, tegenover elkaar stellen of in elkaars tegenwoordigheid verhoren.

      3 De verdachte of diens raadsman wordt zoveel mogelijk in de gelegenheid gesteld getuigen te ondervragen.
      Wanneer naar het oordeel van de rechter-commissaris het gegronde vermoeden bestaat dat een getuige niet op de
      terechtzitting zal kunnen verschijnen, komt de verdachte of diens raadsman het recht toe hem te ondervragen. De
      ondervraging geschiedt op de wijze door de rechter-commissaris te bepalen.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel229
  - number: '230'
    text: |-
      De rechter-commissaris vraagt de verdachte, getuigen en deskundigen naar hun naam en voornamen, leeftijd, beroep en
      woon- of verblijfplaats, voorts de verdachte tevens naar zijn geboorteplaats. Indien de verdachte bekend is, vraagt
      de rechter-commissaris de getuigen en de deskundigen, of zij diens bloedverwanten of aangehuwden zijn, en zo ja, in
      welke graad.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel230
  - number: '231'
    text: |-
      1 Indien een verdachte, getuige of deskundige de taal die de rechter-commissaris bezigt, niet verstaat, benoemt
      deze een tolk, die de leeftijd van achttien jaren moet hebben bereikt. [Artikel 349, tweede lid][ref1], is van
      toepassing.

      2 Indien een verdachte of getuige niet of slechts zeer gebrekkig horen of spreken kan, bepaalt de rechter-
      commissaris dat de vragen of de antwoorden schriftelijk zullen geschieden.

      3 Kan de in het tweede lid bedoelde verdachte of getuige niet of slechts zeer gebrekkig lezen of schrijven, dan kan
      de rechter-commissaris een daartoe geschikte persoon tot tolk benoemen.

      4 De tolk wordt, zo nodig, op bevel van de rechter-commissaris gedagvaard en wordt beëdigd.
      [Artikel 250, tweede lid][ref2], betreffende de vervanging van de beëdiging door een aanmaning, is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel349
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel250
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel231
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '349'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '250'
        afdeling: Vierde
  - number: '232'
    text: |-
      1 De rechter-commissaris kan, hetzij op de vordering van de officier van justitie, hetzij op het verzoek van de
      verdachte of diens raadsman, ten einde de plaatselijke toestand of enig voorwerp te schouwen, met de personen door
      hem aangewezen, elke plaats betreden met uitzondering van een woning, tot het binnentreden waarvan de bewoner niet
      uitdrukkelijk toestemming heeft gegeven.

      2 De rechter-commissaris kan in overleg met de officier van justitie bepalen, dat de verdachte, de getuigen en
      deskundigen ter plaatse zullen worden verhoord.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel232
  - number: '233'
    text: |-
      1 De rechter-commissaris geeft tijdig schriftelijk kennis van de voorgenomen schouw aan de officier van justitie en
      aan de verdachte en diens raadsman.

      2 De officier van justitie en de raadsman kunnen bij iedere schouw tegenwoordig zijn. De verdachte wordt, voor
      zover het belang van het onderzoek dit niet verbiedt, door de rechtercommissaris toegelaten de schouw geheel of
      gedeeltelijk bij te wonen. Zij kunnen verzoeken dat zij aanwijzingen mogen doen of inlichtingen mogen geven of dat
      bepaalde opmerkingen in het proces-verbaal zullen worden vermeld.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel233
  - number: '234'
    text: |-
      Ingeval de schouw moet geschieden in een ander eilandgebied, draagt de rechter-commissaris haar over aan zijn
      ambtgenoot in dat andere eilandgebied.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel234
  - number: '235'
    text: |-
      1 De rechter-commissaris kan, op de vordering van de officier van justitie, bevelen dat de verdachte tegen wie
      ernstige bezwaren bestaan, en, in geval van dringende noodzakelijkheid, bovendien degenen ten aanzien van wie
      vermoed wordt dat zij sporen van het strafbare feit aan het lichaam of aan de kleding dragen, aan hun lichaam of
      kleding zullen worden onderzocht.

      2 [Artikel 78, derde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel78
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel235
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '78'
  - number: '236'
    text: |-
      1 De rechter-commissaris kan in overleg met de officier van justitie de verdachte, die zich in voorlopige hechtenis
      bevindt, voor zich doen verschijnen. Hij kan op de vordering van de officier van justitie de dagvaarding van de
      verdachte, die in vrijheid is, bevelen.

      2 In geen geval wordt het gerechtelijk vooronderzoek gesloten voordat de verdachte is gehoord.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel236
  - number: '237'
    text: |-
      1 Indien de verdachte zich in een ander eilandgebied bevindt, kan de rechter-commissaris het verhoor overdragen aan
      zijn ambtgenoot in dat andere eilandgebied.

      2 De overige artikelen van deze afdeling zijn van toepassing op de rechter met het verhoorbelast.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel237
  - number: '238'
    text: |-
      Het proces-verbaal van een verhoor van de verdachte, dat op verzoek van de rechter-commissaris heeft
      plaatsgevonden, wordt hem gesloten en verzegeld toegezonden.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel238
  - number: '239'
    text: |-
      1 Indien de verdachte verhinderd is te verschijnen, kan zijn verhoor geschieden op de plaats waar hij zich ophoudt.

      2 De rechter-commissaris kan daartoe met de personen door hem aangewezen, en met inachtneming van de bepalingen van
      [artikel 232][ref1] elke plaats betreden, met uitzondering van een woning, tot het betreden waarvan de bewoner niet
      uitdrukkelijk toestemming heeft gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel232
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel239
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '232'
        afdeling: Tweede
  - number: '240'
    text: |-
      Indien de verdachte in vrijheid is en niet op de dagvaarding verschijnt, kan de rechter-commissaris hem op
      de vordering van de officier van justitie andermaal doen dagvaarden. Daarbij kan worden gevoegd een bevel tot
      medebrenging, doch slechts indien de aanwezigheid van de verdachte noodzakelijk is in verband met een onderzoek
      naar zijn persoonlijkheid of zijn persoonlijke omstandigheden.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel240
  - number: '241'
    text: |-
      1 Indien dit in het belang van het onderzoek dringend noodzakelijk is, kan de rechter-commissaris bevelen, dat de
      overeenkomstig [artikel 240][ref1] meegebrachte verdachte gedurende ten hoogste vierentwintig uren in een door hem
      aan te wijzen plaats zal worden opgehouden.

      2 De redenen daarvan worden in het bevel vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel240
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel241
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '240'
        afdeling: Derde
  - number: '242'
    text: |-
      De verdachte wordt bij zijn verhoor mondeling mededeling gedaan van de verklaringen van getuigen en deskundigen,
      die buiten zijn tegenwoordigheid zijn verhoord, voor zover naar het oordeel van de rechter-commissaris het belang
      van het onderzoek dit niet verbiedt. Wordt de verdachte de wetenschap van bepaalde opgaven onthouden, dan geeft de
      rechter-commissaris hem dit mondeling te kennen.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel242
  - number: '243'
    text: |-
      1 De verdachte kan bij zijn verhoor mondeling getuigen en feiten ten onderzoek opgeven. Bij het proces-verbaal
      wordt, voor zover de opgave redelijke grenzen niet overschrijdt, van een en ander melding gemaakt, met korte
      aanduiding van hetgeen de getuigen volgens de opgave van de verdachte zouden kunnen verklaren.

      2 Indien de rechter-commissaris bezwaar heeft, hetzij tegen het vermelden van een en ander in het proces-verbaal,
      hetzij tegen het verhoren van de opgegeven getuigen, hetzij tegen het onderzoek naar de opgegeven feiten, deelt hij
      zijn weigering om tot een of ander over te gaan, bij het verhoor of het eerstvolgend verhoor aan de verdachte mee,
      en vermeldt deze onder opgave van redenen in het proces-verbaal. Wanneer de verdachte de dagvaarding van getuigen
      verzoekt, ten aanzien van wie naar het oordeel van de rechter-commissaris het gegronde vermoeden bestaat dat zij
      niet op de terechtzitting zullen kunnen verschijnen en die naar het oordeel van de verdachte voor hem ontlastende
      verklaringen zouden kunnen afleggen, mag dagvaarding niet worden geweigerd.

      3 De verdachte kan binnen drie dagen na de in het tweede lid bedoelde mededeling tegen die weigering een
      bezwaarschrift indienen bij het Hof van Justitie.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel243
  - number: '244'
    text: |-
      De rechter-commissaris verhoort de getuige, wiens verhoor door de rechter wordt bevolen, door de officier van
      justitie wordt gevorderd of door de verdachte of diens raadsman wordt verzocht. Hij kan op de vordering van de
      officier van justitie de dagvaarding van de getuige bevelen.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel244
  - number: '245'
    text: |-
      1 Het eerste lid van [artikel 237][ref1] alsmede [artikel 238][ref2] vinden ten aanzien van het verhoor van
      getuigen, die zich in een ander eilandgebied ophouden, overeenkomstige toepassing.

      2 Houdt de getuige zich op in een ander eilandgebied, dan beveelt de rechter-commissaris diens dagvaarding
      alleen, indien hij overkomst noodzakelijk of in het belang van de getuige oordeelt. Het bevel wordt gegeven,
      op de vordering van de officier van justitie of op het verzoek van de verdachte of diens raadsman. In de
      dagvaarding wordt van de noodzakelijkheid van de overkomst of van het belang van de getuige melding gemaakt.
      [Artikel 243, tweede lid, laatste volzin][ref3], blijft van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel237
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel238
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel243
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel245
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '237'
        afdeling: Derde
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '238'
        afdeling: Derde
      - id: ref3
        bwb_id: BWBR0028681
        artikel: '243'
        afdeling: Vierde
  - number: '246'
    text: |-
      1 Indien de getuige verhinderd is te verschijnen, kan zijn verhoor geschieden op de plaats waar hij zich ophoudt.

      2 De rechter-commissaris kan daartoe met de personen door hem aangewezen, en met inachtneming van de bepalingen van
      [artikel 232][ref1] elke plaats betreden, met uitzondering van een woning, tot het binnentreden waarvan de bewoner
      niet uitdrukkelijk toestemming heeft gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel232
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel246
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '232'
        afdeling: Tweede
  - number: '247'
    text: |-
      1 Ieder die als getuige is gedagvaard, is verplicht voor de rechter-commissaris te verschijnen.

      2 Indien de getuige niet op de dagvaarding verschijnt, kan de rechter-commissaris hem op de vordering van de
      officier van justitie of op het verzoek van de verdachte of diens raadsman andermaal doen dagvaarden en daarbij
      voegen een bevel tot medebrenging of zodanig bevel later uitvaardigen.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel247
  - number: '248'
    text: |-
      Indien dit in het belang van het onderzoek dringend noodzakelijk is, kan de rechter-commissaris op de vordering
      van de officier van justitie of op het verzoek van de verdachte of diens raadsman bevelen, dat de overeenkomstig
      [artikel 247][ref1] meegebrachte getuige gedurende ten hoogste vierentwintig uren in een door hem aan te wijzen
      plaats zal worden opgehouden. De redenen daarvan worden in het bevel vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel247
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel248
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '247'
        afdeling: Vierde
  - number: '249'
    text: De getuige verklaart de gehele waarheid en niets dan de waarheid te zullen zeggen.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel249
  - number: '250'
    text: |-
      1 De rechter-commissaris beëdigt de getuige, indien er naar zijn oordeel gegrond vermoeden bestaat dat deze niet
      op de terechtzitting zal kunnen verschijnen, of ingeval de overlegging van beëdigde getuigenissen nodig is om de
      uitlevering van de verdachte te verkrijgen.

      2 Indien een getuige met gebrekkige ontwikkeling of ziekelijke storing van zijn geestvermogens, naar het oordeel
      van de rechter-commissaris, de betekenis van de eed niet voldoende beseft, of indien een getuige de volle ouderdom
      van vijftien jaren nog niet heeft bereikt, wordt hij niet beëdigd doch aangemaand de gehele waarheid en niets
      anders dan de waarheid te zeggen.

      3 Van de reden van de beëdiging of aanmaning wordt in het proces-verbaal melding gemaakt.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel250
  - number: '251'
    text: |-
      Van het geven van getuigenis of van het beantwoorden van bepaalde vragen kunnen zich verschonen:

      a. de bloed- of aanverwanten in de rechte lijn van de verdachte of de medeverdachte;

      b. de bloed- of aanverwanten in de zijlijn tot de derde graad ingesloten, van de verdachte of de medeverdachte;

      c. de echtgenoot of vroegere echtgenoot van de verdachte of de medeverdachte, dan wel de persoon, met wie de
      verdachte of medeverdachte duurzaam feitelijk samenwoont of heeft samengewoond. Die samenwoning zal op genoegzame
      wijze aannemelijk moeten worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel251
  - number: '252'
    text: |-
      1 Van het geven van getuigenis of van het beantwoorden van bepaalde vragen kunnen zich ook verschonen zij, die uit
      hoofde van hun stand, hun beroep of hun ambt tot geheimhouding verplicht zijn, doch alleen omtrent hetgeen waarvan
      de wetenschap aan hen als zodanig is toevertrouwd.

      2 Het in het eerste lid bepaalde is op overeenkomstige wijze van toepassing op de rechters, de leden van het
      openbaar ministerie en andere personen, die bekend zijn met de identiteit van de getuige die op de voet van het
      bepaalde in [artikel 261][ref1] is verhoord. De bevoegdheid zich te verschonen is beperkt tot de vragen die gericht
      zijn op de onthulling van de identiteit van de getuige.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel261
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel252
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '261'
        afdeling: Vijfde
  - number: '253'
    text: |-
      De getuige kan zich verschonen van het beantwoorden van een hem gestelde vraag, indien hij daardoor of zichzelf
      of een van zijn bloed- of aanverwanten in de rechte lijn of in de zijlijn in de tweede of derde graad of zijn
      echtgenoot of vroegere echtgenoot dan wel de persoon, met wie hij duurzaam feitelijk samenwoont of samengewoond
      heeft, aan het gevaar van een strafrechtelijke veroordeling zou blootstellen. Die samenwoning zal op genoegzame
      wijze aannemelijk moeten worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel253
  - number: '254'
    text: |-
      1 De getuige legt zijn verklaring af, zonder zich van een schriftelijk opstel te mogen bedienen.

      2 De rechter-commissaris kan echter om bijzondere redenen de getuige toestaan, bij zijn verklaring zodanig gebruik
      te maken van geschriften of schriftelijke aantekeningen als hij veroorloven zal.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel254
  - number: '255'
    text: |-
      1 Indien de getuige bij zijn verhoor zonder wettige grond weigert op de gestelde vragen te antwoorden of de van hem
      gevorderde verklaring of eed af te leggen, beveelt de rechter-commissaris, zo dit in het belang van het onderzoek
      dringend noodzakelijk is, op de vordering van de officier van justitie of op het verzoek van de verdachte of diens
      raadsman, dat de getuige in gijzeling zal worden gesteld.

      2 De rechter-commissaris doet op het verzoek van de gegijzelde verslag aan het Hof van Justitie. Het Hof beveelt
      binnen tweemaal vierentwintig uren daarna, na de getuige te hebben gehoord, dat deze in gijzeling zal worden
      gehouden of daaruit zal worden ontslagen.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel255
  - number: '256'
    text: |-
      1 Het bevel van de rechter-commissaris dat de getuige in gijzeling zal worden gesteld, is voor niet langer dan
      twaalf dagen geldig.

      2 De rechter-commissaris kan echter gedurende het gerechtelijk vooronderzoek, op de vordering van de officier
      van justitie of op het verzoek van de verdachte of diens raadsman, telkens, nadat de getuige opnieuw is gehoord,
      dat bevel van twaalf tot twaalf dagen verlengen. Ten aanzien van deze verlengingen komt de gegijzelde eenmaal de
      bevoegdheid toe, bedoeld in [artikel 255, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel255
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel256
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '255'
        afdeling: Vierde
  - number: '257'
    text: |-
      1 De rechter-commissaris beveelt het ontslag van de getuige uit de gijzeling, zodra deze aan zijn verplichting
      heeft voldaan of zijn getuigenis niet meer nodig is.

      2 Hij kan te allen tijde, hetzij ambtshalve, hetzij op de vordering van de officier van justitie of op het verzoek
      van de getuige, diens ontslag uit de gijzeling bevelen. De getuige wordt gehoord, althans behoorlijk daartoe
      opgeroepen.

      3 In ieder geval gelast de officier van justitie het ontslag uit de gijzeling, zodra het gerechtelijk vooronderzoek
      is beëindigd.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel257
  - number: '258'
    text: |-
      Alle beschikkingen waarbij gijzeling wordt bevolen of verlengd, of waarbij een verzoek van de getuige tot ontslag
      uit de gijzeling wordt afgewezen, zijn met redenen omkleed en worden binnen vierentwintig uren aan de getuige
      betekend.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel258
  - number: '259'
    text: |-
      1 Gedurende de gijzeling kan de getuige zich beraden met een advocaat.

      2 Deze heeft vrije toegang tot de getuige, kan hem alleen spreken en met hem brieven wisselen zonder dat van
      de inhoud door anderen wordt kennisgenomen, een en ander onder het vereiste toezicht, met inachtneming van de
      huishoudelijke reglementen, en zonder dat het onderzoek daardoor mag worden opgehouden.

      3 De officier van justitie staat de advocaat op diens verzoek toe van de processen-verbaal betreffende de verhoren
      van de getuige kennis te nemen.

      4 Hij kan, voor zover het belang van het onderzoek dit niet verbiedt, de advocaat op diens verzoek toestaan ook van
      de overige processtukken kennis te nemen.

      5 Weigert de officier van justitie de inzage, dan staat tegen diens beslissing binnen drie dagen na de mededeling
      beroep open bij de rechter-commissaris.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel259
  - number: '260'
    text: |-
      1 Tenzij zij bij Koninklijk Besluit tot het afleggen van getuigenis zijn gemachtigd, worden niet als getuigen
      gehoord de Koning, de vermoedelijke opvolger van de Koning, hun echtgenoten, en de Regent.

      2 Een regeling van vormen welke bij het verhoor in acht te nemen, wordt bij het besluit gegeven.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel260
  - number: '261'
    text: |-
      1 Wanneer een getuige met het oog op een door hem af te leggen verklaring ernstig wordt bedreigd, kan de rechter-
      commissaris, op de vordering van de officier van justitie of op het verzoek van de getuige, bepalen dat de getuige
      op zodanige wijze wordt verhoord, dat zijn identiteit geheel verborgen blijft.

      2 Ernstige bedreiging in de zin van het eerste lid kan slechts worden aangenomen, indien:

      a. de getuige met het oog op de door hem af te leggen verklaring zich zodanig bedreigd kan achten dat, naar
      redelijkerwijze moet worden aangenomen, ernstig voor het leven, de gezondheid of het maatschappelijk functioneren
      van de getuige of van een andere persoon moet worden gevreesd,

      b. de getuige te kennen heeft gegeven vanwege die bedreiging anders geen verklaring te willen afleggen, en

      c. er een gegrond vermoeden bestaat dat de getuige deswege niet ter terechtzitting zal kunnen verschijnen.

      3 Het eerste lid blijft buiten toepassing, indien het verhoor een misdrijf betreft, waarvoor geen voorlopige
      hechtenis is toegelaten.

      4 Bij toepassing van het eerste lid ziet de rechter-commissaris erop toe, dat de getuige bij gelegenheid van het
      verhoor tegen herkenning wordt beschermd. In uitzonderlijke gevallen kan hij bepalen dat de verdachte en diens
      raadsman het verhoor van de getuige niet zullen bijwonen. In dat geval zal de officier van justitie daarbij ook
      niet tegenwoordig zijn. De rechter-commissaris stelt hun zodra mogelijk in kennis van de inhoud van de door de
      getuige afgelegde verklaringen. Zij worden in de gelegenheid gesteld zoveel mogelijk de vragen op te geven, die
      zij gesteld wensen te zien. Tenzij het belang van het onderzoek geen uitstel van het verhoor gedoogt, kunnen vragen
      reeds voor de aanvang van het verhoor worden opgegeven. Het proces-verbaal van verhoor wordt naar de vorm van
      vraag en antwoord ingericht. De persoonsgegevens van de getuige, bedoeld in [artikel 230][ref1], worden niet in het
      proces-verbaal van verhoor opgenomen.

      5 Voorafgaand aan het verhoor, bedoeld in het vierde lid, toetst de rechter-commissaris de bezwaren van de getuige
      tegen onthulling van diens identiteit. Deze bezwaren worden in het proces-verbaal vermeld. De rechter-commissaris
      verantwoordt daarin of hij de bezwaren gegrond acht.

      6 De getuige die op de voet van het vierde lid zal worden verhoord, wordt door de rechter-commissaris in verband
      met [artikel 250, eerste lid][ref2], beëdigd. Daarvan wordt in het proces-verbaal melding gemaakt. Artikel 250,
      tweede en derde lid, is van toepassing.

      7 Wanneer de rechter-commissaris van oordeel is dat ernstige bedreiging in de zin van het eerste lid niet kan
      worden aangenomen, en de getuige volhardt in zijn wens anoniem te blijven, beslist de rechter-commissaris dat de
      getuige zal worden verhoord zonder toepassing van het vierde lid, tenzij de officier van justitie zich daartegen
      verzet, in welk geval wordt afgezien van verhoor van de getuige.

      8 In bijzonder spoedeisende gevallen, waarin het verhoor door de rechter-commissaris niet kan worden afgewacht, kan
      de getuige ook door een opsporingsambtenaar worden verhoord, doch alleen op grond van verkregen toestemming door
      de rechter-commissaris. Het in het eerste tot en met zevende lid bepaalde vindt zoveel mogelijk overeenkomstige
      toepassing.

      9 Toepassing van dit artikel vindt, voor zoveel nodig, plaats in afwijking van het bepaalde omtrent het verhoor van
      de getuige en de daaraan door de verdachte of diens raadsman te ontlenen bevoegdheden.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel230
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel250
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel261
