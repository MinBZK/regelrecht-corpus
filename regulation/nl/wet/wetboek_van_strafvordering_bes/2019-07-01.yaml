    text: |-
      Voor de toepassing van deze wet en de daarop berustende nadere regelingen en uitvoeringsvoorschriften wordt
      verstaan onder:

        - *aanbieder van een communicatiedienst:* de natuurlijke persoon of rechtspersoon die in de uitoefening van een
      beroep of bedrijf aan de gebruikers van zijn dienst de mogelijkheid biedt te communiceren met behulp van een
      geautomatiseerd werk, of gegevens verwerkt of opslaat ten behoeve van een zodanige dienst of de gebruikers van
      die dienst;
        - *beschikkingen:* de niet op de terechtzitting gegeven beslissingen;
        - *commandant:* de bevelhebber van een oorlogsschip of een militair luchtvaartuig van het Koninkrijk;
        - *einduitspraken:* de uitspraken tot verklaring van onbevoegdheid, niet-ontvankelijkheid of nietigheid van de dag
      vaarding, en die welke na afloop van het gehele onderzoek op de terechtzitting over de zaak worden gedaan;
        - *gebruiker van een communicatiedienst:* de natuurlijke persoon of rechtspersoon die met de aanbieder van een
      communicatiedienst een overeenkomst is aangegaan met betrekking tot het gebruik van die dienst of die feitelijk
      gebruik maakt van een zodanige dienst;
        - *gegevens:* iedere weergave van feiten, begrippen of instructies, op een overeengekomen wijze, geschikt voor
      overdracht, interpretatie of verwerking door personen of geautomatiseerde werken;
        - *gezagvoerder van een luchtvaartuig:* elke gezagvoerder van een Nederlands burgerlijk luchtvaartuig of degene die
      deze vervangt;
        - *Hof van Justitie en Hof:* Hof van Justitie en Hof: het Gemeenschappelijk Hof, bedoeld in
      [artikel 15, eerste lid, van de Rijkswet Gemeenschappelijk Hof van Justitie][ref1];
        - *huiszoeking:* het gericht en stelselmatig onderzoeken van een plaats als bedoeld in de [artikelen 144][ref2] en
      [145 van het Wetboek van Strafrecht BES][ref3], op de aanwezigheid van voor inbeslagneming vatbare voorwerpen;
        - *hulpofficieren van justitie:* de in [artikel 191][ref4] bedoelde personen;
        - *inbeslagneming:* het onder zich nemen of gaan houden van voorwerpen of vorderingen ten behoeve van de
      strafvordering;
        - *installatie ter zee:* elke installatie buiten Bonaire, Sint Eustatius en Saba opgericht op de bodem van de
      territoriale zee of dat deel van de Caribische zee of de Atlantische Oceaan, waarvan de grenzen samenvallen met die
      van het aan genoemde eilanden toekomende gedeelte van het continentale plat;
        - *Nederlands schip:* hetgeen daaronder wordt verstaan in [artikel 88 van het Wetboek van Strafrecht BES][ref5];
        - *opsporingsambtenaren:* alle personen die overeenkomstig de [artikelen 184][ref6] en [185][ref7] met de
      opsporing van strafbare feiten zijn belast, alsmede de leden van het openbaar ministerie, indien zij van hun
      opsporingsbevoegdheid gebruik maken;
        - *opsporingsonderzoek:* het onderzoek in verband met strafbare feiten onder gezag van de officier met als doel het
      nemen van strafvorderlijke beslissingen;
        - *opvarende:* degene, niet zijnde de schipper, die zich aan boord van een Nederlands schip bevindt, ook indien hij
      buiten Bonaire, Sint Eustatius en Saba het schip gedurende de reis tijdelijk verlaat, alsmede degene, niet zijnde
      de schipper, die zich op een bij algemene maatregel van bestuur aangewezen installatie ter zee bevindt;
        - *ouders:* de ouders die de ouderlijke macht of de voogdij over de minderjarige uitoefenen;
        - *persoon:* zowel de natuurlijke als de rechtspersoon;
        - *raadsman:* de advocaat van een verdachte;
        - *rechterlijke beslissingen:* zowel de beschikkingen als de uitspraken;
        - *rechtstaal:* de gebezigde taal die in het rechtsgebied als officiële taal is toegelaten;
        - *schepeling:* ieder die zich als scheepsofficier of scheepsgezel aan boord van een Nederlands schip bevindt;
        - *schipper:* de gezagvoerder van een Nederlands schip of degene die deze vervangt, alsmede degene die de leiding
      heeft op een bij ministeriële regeling aangewezen installatie ter zee;
        - *teruggave van inbeslaggenomen voorwerpen:* het verrichten van de in verband met de beëindiging van het beslag
      vereiste formaliteiten;
        - *uitspraken:* de op de terechtzitting gegeven beslissingen;
        - *voorbereidend onderzoek:* het onderzoek dat aan de behandeling ter terechtzitting voorafgaat;
        - *voorlopige hechtenis:* de vrijheidsontneming ingevolge een bevel tot bewaring, gevangenneming of gevangenhouding
      en de bevelen tot verlenging daarvan;
        - *voorwerpen:* alle zaken en vermogensrechten.


