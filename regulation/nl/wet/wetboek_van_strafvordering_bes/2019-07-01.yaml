  - number: '83'
    text: |-
      1 De officier van justitie of de hulpofficier, voor wie de verdachte wordt geleid of die zelf de verdachte heeft
      aangehouden of verhoord, kan na het verhoor, in het belang van het onderzoek bevelen dat hij tijdens het onderzoek
      ter beschikking van de justitie zal blijven en daarvoor op een in het bevel aan te duiden plaats in verzekering zal
      worden gesteld.

      2 De verdachte wordt, door de officier van justitie of de hulpofficier voorafgaand aan het bevel, gehoord. Hem
      wordt tevens meegedeeld, dat hem vanaf het tijdstip waarop het bevel tot inverzekeringstelling wordt verleend en
      gedurende die periode, kosteloos een raadsman zal worden toegevoegd.

      3 Van het horen wordt in het proces-verbaal van verhoor melding gemaakt.

      4 De hulpofficier geeft van zijn bevel ten spoedigste, maar in ieder geval binnen vierentwintig uren schriftelijk
      of mondeling kennis aan de officier van justitie.

      5 Zodra het belang van het onderzoek dit toelaat, gelast de officier van justitie de invrijheidstelling van de
      verdachte. Binnen de eerste vierentwintig uren is daartoe ook bevoegd de hulpofficier, die het bevel heeft gegeven.

      6 Gelast de hulpofficier de invrijheidstelling niet, dan doet hij de verdachte voor de officier van justitie
      geleiden, voor zover deze niet anders beslist.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel83
  - number: '84'
    text: |-
      De officier van justitie doet de aangehouden verdachte, wiens bewaring hij noodzakelijk oordeelt, onverwijld
      geleiden voor de rechter-commissaris.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel84
  - number: '85'
    text: |-
      Wordt de verdachte noch overeenkomstig [artikel 83][ref1] in verzekering gesteld, noch overeenkomstig
      [artikel 84][ref2] voor de rechter-commissaris geleid, dan wordt hij, na te zijn verhoord, dadelijk in vrijheid
      gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel83
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel84
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel85
