  - number: '340'
    text: |-
      1 Wanneer de rechter in eerste aanleg het proces-verbaal, houdende de verklaring die door een getuige op de voet
      van het bepaalde in het vierde lid van [artikel 261][ref1] is afgelegd, niet tot het bewijs van het strafbare feit
      heeft toegelaten, vindt [artikel 339][ref2] in hoger beroep overeenkomstige toepassing.

      2 Is een niet eerder verhoorde getuige alsnog, na een daartoe strekkende beslissing van de rechter in eerste
      aanleg, door de rechter-commissaris met toepassing van het vierde lid van [artikel 261][ref3] verhoord, dan vindt
      [artikel 338][ref4] in hoger beroep overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel261
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel339
