  - number: '594'
    text: |-
      Indien de procureur-generaal het in het belang van een goede rechtsbedeling gewenst acht, dat een vreemde staat een
      door de rechter in de openbare lichamen Bonaire, Sint Eustatius en Saba opgelegde straf of maatregel ten uitvoer
      legt of verder ten uitvoer legt, geeft hij, onder overlegging van het voor tenuitvoerlegging vatbare vonnis of
      arrest en eventuele andere met het oog op de tenuitvoerlegging van belang zijnde stukken, aan Onze Minister een met
      redenen omkleed advies tot overdracht van de tenuitvoerlegging aan die staat.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel594
  - number: '595'
    text: |-
      1 Behoudens het bepaalde in het tweede lid beslist Onze Minister zo spoedig mogelijk na de ontvangst van een
      advies, als bedoeld in [artikel 594][ref1], omtrent het daaraan te geven gevolg. Daarbij neemt hij, indien het
      verzoek tot tenuitvoerlegging op een verdrag kan worden gegrond, de bepalingen van dat verdrag in acht.

      2 Indien het advies van de procureur-generaal betrekking heeft op een veroordeelde die zich in de openbare lichamen
      Bonaire, Sint Eustatius en Saba bevindt, aan wie een tot vrijheidsontneming strekkende sanctie is opgelegd en
      die niet heeft verklaard met de overdracht van de tenuitvoerlegging van die sanctie in te stemmen, dan laat Onze
      Minister, zo hij voornemens is gevolg te geven aan dit advies, alvorens een beslissing te nemen, de veroordeelde
      schriftelijk van dit advies in kennis stellen. Daarbij wordt de veroordeelde meegedeeld, dat hij binnen veertien
      dagen na ontvangst van de kennisgeving tegen het voornemen van Onze Minister een bezwaarschrift kan indienen bij
      het gerecht, dat in hoogste feitelijke instantie de tot vrijheidsontneming strekkende sanctie heeft opgelegd.

      3 Zo spoedig mogelijk na ontvangst van een tijdig ingediend bezwaarschrift onderzoekt het in het tweede lid
      bedoelde gerecht of Onze Minister bij afweging van de betrokken belangen in redelijkheid tot de voorgenomen
      beslissing kan komen. De veroordeelde wordt bij het onderzoek gehoord, althans daartoe behoorlijk opgeroepen.
      Indien niet blijkt dat de veroordeelde reeds een advocaat heeft, voegt de voorzitter van het gerecht hem ambtshalve
      een advocaat toe.

      4 Van zijn beslissing stelt het gerecht Onze Minister en de veroordeelde in kennis. Acht het gerecht het
      bezwaarschrift gegrond, dan geeft Onze Minister aan het advies van de procureur-generaal tot overdracht van de
      tenuitvoerlegging geen gevolg.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel594
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel595
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '594'
        paragraaf: '1'
        afdeling: Vierde
  - number: '596'
    text: |-
      1 Onze Minister geeft de procureur-generaal schriftelijk kennis van de beslissing die hij op diens advies heeft
      genomen alsmede van de door hem ontvangen mededelingen omtrent beslissingen van de autoriteiten van de vreemde
      staat naar aanleiding van het verzoek tot tenuitvoerlegging dat op advies van de procureur-generaal is gedaan.

      2 Een aan de autoriteiten van een vreemde staat gedaan verzoek tot tenuitvoerlegging kan uiterlijk tot de ontvangst
      van een kennisgeving omtrent de daarop in die staat genomen beslissing worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel596
  - number: '597'
    text: |-
      Tenzij Onze Minister reeds aanstonds van oordeel is, dat het verzoek van een buitenlandse autoriteit tot overdracht
      van de tenuitvoerlegging van een in de openbare lichamen Bonaire, Sint Eustatius en Saba opgelegde sanctie moet
      worden afgewezen, wint hij omtrent de vraag of het belang van een goede rechtsbedeling zich tegen inwilliging van
      het verzoek verzet, het advies in van het gerecht dat in hoogste feitelijke instantie de sanctie heeft opgelegd en
      van de procureur-generaal.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel597
  - number: '598'
    text: |-
      1 Zo spoedig mogelijk na de ontvangst van de in [artikel 597][ref1] bedoelde adviezen beslist Onze Minister
      over het gevolg, te geven aan het in dat artikel bedoelde verzoek. [Artikel 595][ref2] is van overeenkomstige
      toepassing.

      2 Van zijn beslissing geeft Onze Minister onverwijld kennis aan het in [artikel 597][ref3] bedoelde gerecht en aan
      de procureur-generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel597
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel595
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel597
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel598
