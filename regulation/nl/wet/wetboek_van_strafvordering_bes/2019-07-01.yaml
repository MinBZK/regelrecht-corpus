  - number: '101'
    text: |-
      1 Een bevel, als bedoeld in [artikel 100][ref1], kan slechts worden gegeven, indien uit feiten of omstandigheden
      blijkt van ernstige bezwaren tegen de verdachte ter zake van de in dat artikel vermelde misdrijven, en voorts:

      a. indien uit bepaalde gedragingen van de verdachte of uit bepaalde, hem persoonlijk betreffende omstandigheden
      blijkt van ernstig gevaar voor vlucht, of

      b. indien uit bepaalde omstandigheden blijkt van een gewichtige reden van maatschappelijke veiligheid, die de
      onverwijlde vrijheidsontneming vordert.

      2 Een gewichtige reden van maatschappelijke veiligheid kan voor de toepassing van het eerste lid slechts in
      aanmerking worden genomen:

      a. indien wegens het vermoedelijk begane feit levenslange gevangenisstraf, dan wel tijdelijke van zes jaren of meer
      kan worden opgelegd of de rechtsorde ernstig door dat feit is geschokt, of

      b. indien er ernstig rekening mee moet worden gehouden, dat de verdachte een misdrijf zal begaan, waarop naar
      de wettelijke omschrijving een gevangenisstraf van zes jaren of meer is gesteld, of waardoor de veiligheid van
      de staat of de gezondheid of veiligheid van personen in gevaar kan worden gebracht, dan wel algemeen gevaar voor
      goederen kan ontstaan, of

      c. indien de voorlopige hechtenis in redelijkheid noodzakelijk is voor het, anders dan door verklaringen van de
      verdachte, aan de dag brengen van de waarheid.

      3 Een bevel tot voorlopige hechtenis blijft achterwege, indien ernstig rekening moet worden gehouden met
      de mogelijkheid dat aan de verdachte in geval van veroordeling geen onvoorwaardelijke vrijheidsstraf of tot
      vrijheidsontneming strekkende maatregel zal worden opgelegd, dan wel dat hem bij tenuitvoerlegging van het bevel
      langere tijd rechtens zijn vrijheid zou worden ontnomen dan de duur van de straf of maatregel.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel100
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '100'
        afdeling: Derde
  - number: '102'
    text: |-
      1 De termijn gedurende welke een bevel tot voorlopige hechtenis van kracht is, loopt niet gedurende de tijd dat
      de verdachte zich aan de tenuitvoerlegging van het bevel heeft onttrokken of hem uit anderen hoofde rechtens zijn
      vrijheid is ontnomen. Ondergaat evenwel de verdachte op het tijdstip dat het bevel tot voorlopige hechtenis wordt
      gegeven een vrijheidsstraf, dan wordt de tenuitvoerlegging van de straf van rechtswege geschorst zolang het bevel
      van kracht is. De in voorlopige hechtenis doorgebrachte tijd wordt in dat geval zoveel mogelijk in mindering
      gebracht op die straf.

      2 Indien binnen de in de eerste volzin van het eerste lid bedoelde termijn een vordering krachtens
      [artikel 281][ref1], dan wel een bezwaarschrift tegen de dagvaarding is ingediend, blijft het bevel, onverminderd
      het bepaalde in [artikel 98, tweede lid][ref2], van kracht totdat dertig dagen zijn verstreken sedert de dag waarop
      onherroepelijk op de vordering of het bezwaarschrift is beschikt.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel281
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel98
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel102
