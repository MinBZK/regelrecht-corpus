  - number: '88'
    text: |-
      1 Het bevel tot inverzekeringstelling of tot verlenging daarvan is gedagtekend en ondertekend.

      2 Het bevat een zo nauwkeurig mogelijke aanduiding van het strafbare feit, en vermeldt zoveel mogelijk de datum en
      de plaats van het feit, de grond van de uitvaardiging en de bepaalde omstandigheden die tot het aannemen van die
      grond hebben geleid. Het vermeldt tevens het tijdstip waarop en de duur waarvoor het is verleend, alsmede de plaats
      waar de inverzekeringstelling wordt ondergaan.

      3 De verdachte wordt in het bevel met naam, voornamen en andere bekende persoonsgegevens aangeduid of, wanneer deze
      onbekend zijn, zo duidelijk mogelijk aangewezen.

      4 Een afschrift van het bevel wordt hem onverwijld uitgereikt. Aan het bureau van de reclassering wordt eveneens
      een afschrift verstrekt.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel88
  - number: '89'
    text: |-
      1 De verdachte wordt zo spoedig mogelijk, doch uiterlijk binnen vierentwintig uren nadat de tenuitvoerlegging
      van het bevel tot verlenging van de inverzekeringstelling een aanvang heeft genomen, voor de rechter-commissaris
      geleid. De raadsman is bevoegd daarbij aanwezig te zijn. Hij wordt in de gelegenheid gesteld de nodige opmerkingen
      te maken.

      2 Indien de rechter-commissaris voortzetting van de inverzekeringstelling onrechtmatig oordeelt, gelast hij
      de onmiddellijke invrijheidstelling van de verdachte. Blijft zodanig bevel achterwege, dan behoudt het door de
      officier van justitie of de hulpofficier verleende bevel zijn volledige rechtskracht.

      3 Indien de voorgeleiding overeenkomstig het eerste lid niet heeft plaatsgevonden, wordt de verdachte terstond in
      vrijheid gesteld.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel89
  - number: '90'
    text: |-
      1 De in verzekering gestelde personen worden aan geen andere beperkingen onderworpen dan die welke voor het doel
      van hun opsluiting of in het belang van de orde volstrekt noodzakelijk zijn.

      2 Tijdens de inverzekeringstelling kunnen door de officier van justitie en, in geval van het gerechtelijk
      vooronderzoek, de rechter-commissaris in het bijzonder als maatregel in het belang van het onderzoek jegens de
      verdachte worden bevolen:

      a. het maken van afbeeldingen, al dan niet in bepaalde standen;

      b. het tijdelijk doen aantrekken van bepaalde kleding, daaronder begrepen het opzetten van een bril of het dragen
      van een pruik;

      c. het vastleggen van uiterlijke lichamelijke kenmerken;

      d. een onderzoek van schrijf- en stemkenmerken;

      e. sorteer- en geurproeven;

      f. een tegenoverstelling met derden;

      g. de beperking of ontzegging van de uitreiking van kranten en lectuur;

      h. algemeen of individueel bepaalde bezoek-, contact- en correspondentieverboden;

      i. een verbod op het voeren van telefoongesprekken;

      j. afzondering;

      k. het overbrengen naar bepaalde plaatsen;

      l. het afscheren, knippen of laten groeien van baard- en hoofdhaar;

      m. de in [artikel 78][ref1] bedoelde onderzoeken en de aldaar bedoelde verwijdering van voorwerpen en stoffen;

      n. een onderzoek van het op grond van [artikel 78][ref2] verkregen materiaal.

      3 De in het tweede lid, onderdelen a tot en met c, alsmede f tot en met j, bedoelde maatregelen kunnen tevens
      worden bevolen door de hulpofficier van justitie die de inverzekeringstelling heeft gelast, indien het optreden van
      de officier van justitie niet kan worden afgewacht.

      4 De toepassing van de in het tweede lid bedoelde maatregelen wordt schriftelijk vastgelegd.

      5 Voor maatregelen als bedoeld in het tweede lid, onderdelen l, m, voor zover het de verwijdering van voorwerpen en
      stoffen uit het lichaam betreft, en n, voor zover het lichaamsmateriaal betreft, dient door de rechter-commissaris
      een machtiging te worden verleend. [Artikel 78, vierde lid, laatste volzin][ref3], is van overeenkomstige
      toepassing.

      6 De uitvoering van de in het tweede lid bedoelde maatregelen geschiedt onder verantwoordelijkheid van de officier
      van justitie.

      7 Tegen de oplegging van in het tweede lid bedoelde maatregelen kan de verdachte binnen zeven dagen een
      bezwaarschrift indienen bij het Hof.

      8 Een maatregel wordt, in afwachting van de rechterlijke beslissing op het bezwaarschrift, niet ten uitvoer gelegd,
      tenzij de rechter-commissaris of de officier van justitie de onverwijlde tenuitvoerlegging in het belang van het
      onderzoek volstrekt noodzakelijk acht.

      9 Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de toepassing van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel78
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel78
