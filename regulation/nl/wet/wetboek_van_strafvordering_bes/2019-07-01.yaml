      - id: ref1
        bwb_id: BWBR0028681
        artikel: '456'
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '457'
      - id: ref3
        bwb_id: BWBR0028681
        artikel: '461'
      - id: ref4
        bwb_id: BWBR0028681
        artikel: '465'
  - number: '467'
    text: |-
      Het Hof ingevolge verwijzing op grond van [artikel 457, eerste lid][ref1], of van artikel [461, tweede lid][ref2],
      rechtdoende, is, op straffe van nietigheid, samengesteld uit drie leden.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel457
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel461
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel467
    references:
