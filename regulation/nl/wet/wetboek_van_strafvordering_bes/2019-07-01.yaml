  - number: 591a
    text: |-
      1 Verlof tot tenuitvoerlegging van een in de vreemde staat opgelegde sanctie strekkende tot ontneming van
      wederrechtelijk verkregen voordeel kan worden beperkt tot de tenuitvoerlegging van de verplichting tot betaling van
      een geldbedrag aan de Staat, dat in omvang slechts een gedeelte van dat voordeel vertegenwoordigt.

      2 Indien de in de vreemde staat opgelegde sanctie strekt tot de ontneming van wederrechtelijk verkregen voordeel,
      spreekt het Hof, indien de vreemde staat uitdrukkelijk heeft verzocht die sanctie slechts ten uitvoer te leggen
      op voorwerpen die dat voordeel vertegenwoordigen, de verbeurdverklaring daarvan uit. In dat geval is het Hof niet
      gebonden aan beperkingen ingevolge [artikel 35, eerste lid, onder a, van het Wetboek van Strafrecht BES][ref1].

      3 Op uitspraken, houdende een verbeurdverklaring, zijn de [artikelen 151][ref2], [153][ref3] en [154][ref4] van
      overeenkomstige toepassing.

      4 Op uitspraken, houdende de oplegging van een verplichting tot betaling van een geldbedrag aan de Staat ter
      ontneming van wederrechtelijk verkregen voordeel, is [artikel 634][ref5] van overeenkomstige toepassing.

      5 [Artikel 579e][ref6] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel35
