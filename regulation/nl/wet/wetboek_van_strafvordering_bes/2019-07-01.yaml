  - number: '626'
    text: |-
      Indien de veroordeelde meer dan een straf achtereenvolgens moet ondergaan, worden zij voor de toepassing van
      [artikel 625, eerste lid, aanhef en onderdelen a, b of c][ref1], als één straf aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel625
