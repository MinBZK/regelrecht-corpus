    text: |-
      1 Degene die schade heeft geleden ten gevolge van onrechtmatige toepassing van een strafvorderlijk dwangmiddel,
      heeft recht op schadevergoeding. Bij rechtmatige toepassing van een dwangmiddel kan eveneens schadevergoeding
      worden toegekend, wanneer er gronden van redelijkheid en billijkheid aanwezig zijn, dat de geleden schade geheel of
      gedeeltelijk door de Staat wordt gedragen.

      2 De rechtmatigheid of onrechtmatigheid wordt beoordeeld naar het tijdstip, waarop het dwangmiddel werd toegepast.

      3 Onder schade is mede begrepen het nadeel dat niet in vermogensschade bestaat. Bij algemene maatregel van bestuur
      kan de hoogte van het bedrag van de schadevergoeding aan een maximum worden gebonden.

      4 Voor vergoeding komt ook de schade in aanmerking die de gewezen verdachte heeft geleden ten gevolge van
      vrijheidsontneming, die hij in het buitenland heeft ondergaan in verband met een door de Nederlandse autoriteiten
      gedaan verzoek om uitlevering.

      5 De vaststelling van de schadevergoeding geschiedt alle omstandigheden in aanmerking genomen. In het bijzonder
      kan rekening worden gehouden met de mate waarin de gelaedeerde de toepassing van het dwangmiddel aan zichzelf heeft
      te wijten. In geval van schade die niet in vermogensschade bestaat, kan bij het bepalen van het bedrag ook met de
      levensomstandigheden van de gelaedeerde rekening worden gehouden.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel178
  - number: '179'
    text: |-
      1 Het verzoek om schadevergoeding kan slechts worden ingediend binnen drie maanden na de beëindiging van de zaak
      of de beslissing dat geen of geen verdere vervolging zal worden ingesteld. De gelaedeerde wordt gehoord, althans
      daartoe behoorlijk opgeroepen. Hij kan zich door een advocaat doen bijstaan.

      2 Tot de toekenning is bevoegd het gerecht in feitelijke aanleg waarvoor de zaak tijdens de beëindiging daarvan
      werd of zou worden vervolgd. De raadkamer is zoveel mogelijk samengesteld uit de leden, die op de terechtzitting
      over de zaak hebben gezeten.

      3 Een verzoek om schadevergoeding kan ook door de erfgenamen van de gelaedeerde orden gedaan en de vergoeding
      kan ook aan hen worden toegekend. In dat geval blijft vergoeding van schade, die niet in vermogensschade bestaat,
      achterwege. Indien de gelaedeerde na het indienen van zijn verzoek of na het instellen van hoger beroep is
      overleden, geschiedt de toekenning ten behoeve van zijn erfgenamen.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel179
  - number: '180'
    text: |-
      1 Tegen de door de rechter in eerste aanleg genomen beslissing staat de officier van justitie en de gelaedeerde of
      zijn erfgenamen binnen veertien dagen hoger beroep open bij het Hof van Justitie.

      2 Ten aanzien van de gelaedeerde of zijn erfgenamen vinden de [artikelen 443 tot en met 452][ref1] overeenkomstige
      toepassing.

      3 Het Hof van Justitie beslist na de gelaedeerde of zijn erfgenamen te hebben gehoord, althans daartoe
      behoorlijk te hebben opgeroepen. De gelaedeerde of zijn erfgenamen kunnen zich door een advocaat doen bijstaan.
      [Artikel 49][ref2] vindt overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel443
