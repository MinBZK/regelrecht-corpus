        bwb_id: BWBR0028496
  - number: '631'
    text: |-
      1 Verhaal kan zonder dwangbevel worden genomen op:

      a. inkomsten in geld uit arbeid van de veroordeelde;

      b. pensioenen, wachtgelden en andere periodieke uitkeringen waarop de veroordeelde aanspraak heeft;

      c. het tegoed van een rekening bij een bank- of giro- instelling waarover de veroordeelde ten eigen bate vermag
      te beschikken.

      2 Verhaal met toepassing van het eerste lid geschiedt door middel van een schriftelijke kennisgeving van
      het openbaar ministerie. De kennisgeving bevat een voor de uitoefening van het verhaal voldoende aanduiding
      van de persoon van de veroordeelde, en vermeldt welk bedrag uit hoofde van de veroordeling nog verschuldigd
      is, bij welke rechterlijke uitspraak de geldboete is opgelegd, alsmede de plaats waar de betaling moet
      geschieden. Zij wordt betekend aan de veroordeelde en aan degene onder wie het verhaal wordt genomen. De
      [artikelen 517 tot en met 520][ref1] zijn van overeenkomstige toepassing.

      3 Door de betekening van de kennisgeving is degene onder wie het verhaal wordt genomen, verplicht tot betaling
      aan 's Rijks kas van het in de kennisgeving bedoelde bedrag voor zover de veroordeelde op hem een opeisbare
      vordering heeft of verkrijgt. Het openbaar ministerie bepaalt de termijn waarbinnen de betaling moet geschieden.
      De verplichting tot betaling vervalt, zodra het uit hoofde van de veroordeling verschuldigde bedrag is betaald of
      verhaald en uiterlijk wanneer twee jaren na de dag van betekening zijn verstreken.

      4 Degene onder wie het verhaal wordt genomen, kan zich niet ten nadele van 's Rijks kas beroepen op het tenietgaan
      of de vermindering van zijn schuld aan de veroordeelde door betaling of door verrekening met een tegenvordering,
      die na de betekening aan hem is opgekomen of opeisbaar is geworden. Voor de toepassing van de artikelen 617 en 618
      van het Wetboek van Burgerlijke Rechtsvordering BES en [artikel 29 van het Faillissementswet BES][ref2] wordt het
      verhaal met beslag onder derden gelijkgesteld.

      5 Indien verhaal is genomen op een periodieke uitkering, die ingevolge enig wettelijk voorschrift niet vatbaar is
      voor beslag, kan telkens ten hoogste een vijfde gedeelte van de uitkering tot betaling van het uit hoofde van de
      veroordeling verschuldigde bedrag worden bestemd. Overigens strekt het verhaal zich niet uit tot gelden, waarvan
      bij wettelijke regeling bepaald is dat zij niet voor inbeslagneming vatbaar zijn.

      6 Iedere belanghebbende kan zich binnen zeven dagen na de betekening van de in het tweede lid van
      dit artikel bedoelde kennisgeving bij met redenen omkleed bezwaarschrift verzetten tegen het verhaal.
      [Artikel 630, derde lid][ref3], is op dit verzet van toepassing.

      7 Een ieder, behoudens de veroordeelde, is verplicht desgevorderd aan het openbaar ministerie de inlichtingen
      te verstrekken, die naar het redelijk oordeel van het openbaar ministerie noodzakelijk zijn ten behoeve van de
      toepassing van het eerste lid van dit artikel. De [artikelen 251][ref4] en [252][ref5] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel517
      [ref2]: https://wetten.overheid.nl/BWBR0028917#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel630
      [ref4]: https://wetten.overheid.nl/BWBR0028681#Artikel251
      [ref5]: https://wetten.overheid.nl/BWBR0028681#Artikel252
