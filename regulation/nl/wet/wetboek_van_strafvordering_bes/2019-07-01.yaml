  - number: 177kc
    text: |-
      1 De officier van justitie kan schriftelijk bepalen dat gegevens die zijn verkregen door toepassing van
      een bevoegdheid als bedoeld in [titel XVIII][ref1] en [XIX][ref2], kunnen worden gebruikt voor een ander
      strafrechtelijk onderzoek dan waartoe de bevoegdheid is uitgeoefend.

      2 Indien toepassing is gegeven aan het eerste lid, behoeven de gegevens, in afwijking van
      [artikel 177kb, tweede lid][ref3], niet te worden vernietigd, totdat het andere onderzoek is geëindigd.

      3 Indien toepassing is gegeven aan het eerste lid worden alle stukken, die betrekking hebben op de uitoefening van
      de betreffende bevoegdheid bij de processtukken van de nieuwe zaak gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028681
      [ref2]: https://wetten.overheid.nl/BWBR0028681
