      1 Op een last, ingevolge deze afdeling gegeven met betrekking tot een voorwerp, is [artikel 145][ref1] van
      overeenkomstige toepassing.

      2 Aan een last tot teruggave van een voorwerp, dat verbeurd verklaard of aan het verkeer onttrokken verklaard
      was met verlening van een geldelijke tegemoetkoming, wordt niet voldaan zolang het bedrag niet in ’s Rijks kas
      is teruggestort.


