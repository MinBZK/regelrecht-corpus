  - number: '648'
    text: |-
      1 Aan de gewezen verdachte of zijn erfgenamen wordt uit 's Rijks kas een vergoeding toegekend voor de kosten,
      die ingevolge het bij en krachtens het Besluit tarief justitiekosten strafzaken bepaalde ten laste van de gewezen
      verdachte zijn gekomen, voor zover de aanwending van die kosten het belang van het onderzoek heeft gediend of door
      de intrekking van dagvaardingen of rechtsmiddelen door het openbaar ministerie nutteloos is geworden.

      2 Het bedrag van de vergoeding wordt op verzoek van de gewezen verdachte of zijn erfgenamen vastgesteld. Het
      verzoek moet worden ingediend binnen drie maanden na het eindigen van de zaak bij de president van het Hof van
      Justitie. Deze kan een van de rechters die over de zaak hebben gezeten, tot de vaststelling van de vergoeding
      aanwijzen. De rechter geeft voor het bedrag van de vergoeding een bevelschrift van tenuitvoerlegging af.

      3 Degenen, die het verzoek hebben ingediend, kunnen worden gehoord. Indien zij dit verlangen, worden zij gehoord,
      althans daartoe behoorlijk opgeroepen.

      4 Uitbetaling geschiedt door of vanwege Onze Minister van Financiën.

      5 Een en ander vindt overeenkomstige toepassing op rechtsgedingen tot herkenning van veroordeelden
      of van andere gevonniste personen en op de behandeling van klaagschriften, als bedoeld in de
      [artikelen 150 tot en met 151][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel150
