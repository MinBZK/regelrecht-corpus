        bwb_id: BWBR0028681
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0028681
      - id: ref3
        bwb_id: BWBR0028681
        artikel: 177g
  - number: 503d
    text: |-
      1 Op de beraadslaging en de uitspraak zijn de bepalingen van de
      [vijfde afdeling van Titel IV van het vijfde Boek][ref1] van overeenkomstige toepassing, met dien verstande dat:

      a. het gerecht naar aanleiding van de vordering en van het onderzoek ter terechtzitting beraadslaagt over de vraag
      of de in [artikel 38e van het Wetboek van Strafrecht BES][ref2] bedoelde maatregel moet worden opgelegd en zo ja,
      op welk bedrag de omvang van het wederrechtelijk verkregen voordeel is te schatten; en

      b. het gerecht niet gebonden is aan het voorschrift van [artikel 388][ref3] betreffende de termijn waarbinnen
      uitspraak moet worden gedaan.

      2 Indien de dag der uitspraak niet ter terechtzitting aan degene op wie de vordering betrekking heeft is
      medegedeeld, wordt hem daarvan, zodra die dag is bepaald, een kennisgeving betekend.

      3 Het gerecht kan, ingeval onder de beraadslaging blijkt dat het onderzoek ter terechtzitting niet volledig is
      geweest, overeenkomstig [artikel 503c, tweede en derde lid][ref4], een onderzoek door de officier van justitie doen
      plaatsvinden. In dit geval wordt gehandeld als ware het onderzoek voor onbepaalde tijd geschorst.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#AfdelingVijfde
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel38e
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel388
      [ref4]: https://wetten.overheid.nl/BWBR0028681#Artikel503c
