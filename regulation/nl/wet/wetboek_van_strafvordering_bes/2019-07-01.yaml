  - number: '283'
    text: |-
      Door de kennisgeving van niet verdere vervolging, de beschikking tot buitenvervolgingstelling of de beschikking
      houdende verklaring dat de zaak geëindigd is, wordt elk bevel tot voorlopige hechtenis van rechtswege opgeheven.
      Daarvan wordt in de kennisgeving of beschikking melding gemaakt.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel283
  - number: '284'
    text: |-
      1 De zaak wordt ter terechtzitting aanhangig gemaakt door een dagvaarding vanwege de officier van justitie aan de
      verdachte betekend. Het rechtsgeding neemt op het moment van de betekening een aanvang.

      2 Wanneer de verdachte zich in voorlopige hechtenis bevindt krachtens een bevel tot gevangenneming of
      gevangenhouding waarvan de geldigheidsduur reeds eenmaal of ingevolge [artikel 98, vierde lid][ref1], reeds
      tweemaal is verlengd, kan de dagvaarding geschieden, ook al is het gerechtelijk vooronderzoek nog niet gesloten.Van
      de dagvaarding geeft de officier van justitie in dat geval schriftelijk kennis aan de rechter-commissaris. Door
      deze kennisgeving eindigt het gerechtelijk vooronderzoek. De [artikelen 272][ref2] en [277][ref3] vinden alsdan
      geen toepassing.

      3 Bij de betekening van de dagvaarding, zomede in de oproeping bedoeld bij [artikel 414][ref4] wordt, de
      bevoegdheid vermeld, die de verdachte bij [artikel 76, vierde lid, van het Wetboek van Strafrecht BES][ref5] is
      verleend.

      4 De rechter bepaalt, op de voordracht van de officier van justitie, de dag van de terechtzitting.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel98
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel272
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel277
      [ref4]: https://wetten.overheid.nl/BWBR0028681#Artikel414
      [ref5]: https://wetten.overheid.nl/BWBR0028570#Artikel76
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel284
