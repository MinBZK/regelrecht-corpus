  - number: 90a
    text: |-
      Met betrekking tot de behandeling van in verzekering gestelde personen en tot de eisen waaraan de voor
      inverzekeringstelling bestemde plaatsen moeten voldoen, worden bij algemene maatregel van bestuur nadere regels
      gesteld, voor zover daarin bij wet, houdende regels voor de tenuitvoerlegging van vrijheidsontneming, niet is
      voorzien.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel90a
  - number: '91'
    text: |-
      1 Tijdens de periode van inverzekeringstelling kan de verdachte, onverminderd het bepaalde in [artikel 89][ref1],
      de rechter-commissaris schriftelijk om zijn invrijheidstelling verzoeken. De rechter-commissaris hoort de verdachte
      en de officier van justitie, indien hij daartoe gronden aanwezig acht.

      2 Op het verzoek wordt zo spoedig mogelijk beslist. Indien de rechter-commissaris de vrijheidsontneming
      onrechtmatig oordeelt, gelast hij de onmiddellijke invrijheidstelling van de verdachte.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel89
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '89'
  - number: '92'
    text: |-
      1 De rechter-commissaris kan, op de vordering van de officier van justitie, een bevel tot bewaring van de verdachte
      verlenen. De griffier geeft van de vordering onverwijld mondeling of schriftelijk kennis aan de raadsman en doet
      hem alsmede de officier van justitie en de hulpofficier tevens mededeling omtrent de plaats waar en, zo mogelijk,
      het tijdstip waarop de verdachte door de rechter-commissaris zal worden gehoord.

      2 Indien de rechter-commissaris reeds aanstonds van oordeel is, dat voor het verlenen van zodanig bevel geen grond
      bestaat, wijst hij de vordering af.

      3 In het andere geval hoort hij, alvorens te beslissen, de verdachte omtrent de vordering van de officier van
      justitie en kan hij te dien einde, zo nodig onder bijvoeging van een bevel tot medebrenging, diens dagvaarding
      gelasten. Indien het voorafgaand horen van de verdachte niet kan worden afgewacht, wordt deze bij de eerste
      gelegenheid na het bevel gehoord.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel92
  - number: '93'
    text: |-
      1 Het bevel tot bewaring is van kracht gedurende een door de rechter-commissaris te bepalen termijn van ten hoogste
      acht dagen, die ingaat op het ogenblik van de tenuitvoerlegging.

      2 Op de vordering van de officier van justitie kan de rechter-commissaris de geldigheidsduur van het bevel eenmaal
      voor een termijn van ten hoogste acht dagen verlengen.

      3 De rechter-commissaris hoort de verdachte, indien hij daartoe gronden aanwezig acht.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel93
  - number: '94'
    text: |-
      1 Ten aanzien van de bewaring zijn [artikel 90, met uitzondering van het derde en zesde lid][ref1], alsmede
      [artikel 90a][ref2] van overeenkomstige toepassing.

      2 De uitvoering van de maatregelen die krachtens het eerste lid kunnen worden bevolen, vindt in het huis van
      bewaring plaats onder de verantwoordelijkheid van het hoofd van het huis van bewaring.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel90
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel90a
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '90'
      - id: ref2
        bwb_id: BWBR0028681
        artikel: 90a
  - number: '95'
    text: |-
      De rechter-commissaris kan, op de vordering van de officier van justitie, de gevangenhouding bevelen van de
      verdachte die zich in bewaring bevindt, doch niet dan na hem in de gelegenheid te hebben gesteld om te worden
      gehoord.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel95
  - number: '96'
    text: |-
      De rechter-commissaris kan, indien dit nodig is om de uitlevering van de verdachte te verkrijgen, op de vordering
      van de officier van justitie de gevangenneming van de verdachte bevelen.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel96
  - number: '97'
    text: |-
      Na de aanvang van het onderzoek op de terechtzitting, kan de rechter in eerste aanleg ambtshalve of op de vordering
      van de officier van justitie, de gevangenneming van de verdachte bevelen. Zo nodig hoort de rechter deze vooraf;
      hij is bevoegd te dien einde zijn dagvaarding te gelasten.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel97
  - number: '98'
    text: |-
      1 Het bevel tot gevangenneming of gevangenhouding is van kracht gedurende een door de rechter te bepalen termijn
      van ten hoogste zestig dagen, die ingaat op het ogenblik van de tenuitvoerlegging.

      2 Indien het bevel is gegeven op de terechtzitting, dan wel, binnen de krachtens het eerste lid bepaalde termijn,
      het onderzoek op de terechtzitting is aangevangen, blijft het bevel voor onbepaalde tijd geldig en blijft van
      kracht totdat het is opgeheven.

      3 De termijn gedurende welke het bevel van kracht is, kan door de rechter-commissaris op de vordering van de
      officier van justitie, voor de aanvang van het onderzoek op de terechtzitting eenmaal met ten hoogste dertig dagen
      worden verlengd.

      4 Indien een gerechtelijk vooronderzoek is gevorderd en dit op grond van bijzondere, op de zaak zelf betrekking
      hebbende omstandigheden niet binnen negentig dagen nadat het bevel tot gevangenhouding van kracht is geworden, is
      voltooid, kan op de vordering van de officier van justitie de rechter-commissaris in de gevallen en op de gronden,
      vermeld in de [artikelen 100][ref1] en [101][ref2], de termijn nog eenmaal met ten hoogste dertig dagen verlengen.

      5 De verdachte wordt in de gelegenheid gesteld op elke vordering op grond van dit artikel te worden gehoord.

      6 Op bevelen tot verlenging, overeenkomstig het derde en vierde lid, zijn het eerste en tweede lid van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel100
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel101
