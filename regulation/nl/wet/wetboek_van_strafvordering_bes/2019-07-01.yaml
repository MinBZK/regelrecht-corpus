  - number: '106'
    text: |-
      Behoudens het bepaalde in [artikel 105, tweede lid][ref1], zijn bevelen tot voorlopige hechtenis en die tot
      opheffing daarvan dadelijk uitvoerbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel105
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel106
