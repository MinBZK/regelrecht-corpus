  - number: '575'
    text: |-
      Voor zover een verdrag daarin voorziet, kan de veroordeelde die zich in de openbare lichamen Bonaire, Sint
      Eustatius en Saba bevindt en aan wie een tot vrijheidsontneming strekkende sanctie is opgelegd, waarvan blijkens
      de in de vreemde staat uitgesproken rechterlijke beslissing nog ten minste zes maanden moeten worden ten uitvoer
      gelegd, voorlopig worden aangehouden, indien gegronde redenen bestaan voor de verwachting dat op korte termijn deze
      sanctie in de openbare lichamen Bonaire, Sint Eustatius en Saba zal worden ten uitvoer gelegd.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel575
  - number: '576'
    text: |-
      1 De procureur-generaal is bevoegd de voorlopige aanhouding overeenkomstig [artikel 575][ref1] te bevelen.

      2 De veroordeelde wordt na zijn voorlopige aanhouding binnen vierentwintig uur voor de procureur-generaal geleid.

      3 De procureur-generaal kan, na de veroordeelde te hebben gehoord, bevelen dat hem gedurende achtenveertig uur, te
      rekenen van het tijdstip van de voorlopige aanhouding, voorlopig verder zijn vrijheid wordt ontnomen.

      4 Deze termijn kan door de procureur-generaal eenmaal met achtenveertig uur worden verlengd.

      5 De veroordeelde kan te allen tijde door de procureur-generaal in vrijheid worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel575
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel576
