        bwb_id: BWBR0028681
        artikel: '308'
        afdeling: Tweede
  - number: '288'
    text: |-
      1 De officier van justitie doet aan ieder, die zich met betrekking tot het tenlastegelegde feit overeenkomstig
      [artikel 206][ref1] als benadeelde partij heeft opgegeven, kennisgeven van de dag, het uur en de plaats van de
      terechtzitting.

      2 De kennisgeving geschiedt zo mogelijk tenminste drie dagen voor de dag van de terechtzitting. Zij behelst een
      korte aanduiding van het tenlastegelegde feit. Bij de kennisgeving wordt de benadeelde partij tevens opmerkzaam
      gemaakt op de haar betreffende voorschriften van de [artikelen 374 tot en met 380][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel206
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel374
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel288
