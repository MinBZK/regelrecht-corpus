  - number: '354'
    text: |-
      Indien uit het onderzoek omstandigheden zijn bekend geworden die, niet in de dagvaarding vermeld, volgens
      wettelijke regeling tot verzwaring van straf grond opleveren, is de procureur-generaal bevoegd deze alsnog
      mondeling ten laste te leggen.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel354
  - number: '355'
    text: |-
      1 Indien in het geding in eerste aanleg en buiten het geval van [artikel 354][ref1] de officier van justitie
      oordeelt dat de telastelegging behoort te worden gewijzigd, legt hij de inhoud van de door hem noodzakelijk geachte
      wijzigingen schriftelijk aan de rechter over, voordat hij voor de eerste maal overeenkomstig [artikel 353][ref2]
      het woord voert, met de vordering dat die wijzigingen zullen worden toegelaten.

      2 De verdachte wordt op de vordering tot wijziging gehoord.

      3 Indien de rechter de vordering toewijst, doet hij ter terechtzitting de inhoud van de aangebrachte wijzigingen in
      het proces-verbaal opnemen. In geen geval worden wijzigingen toegelaten, als gevolg waarvan de telastelegging niet
      langer hetzelfde feit, in de zin van [artikel 70 van het Wetboek van Strafrecht BES][ref3], zou inhouden.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel354
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel353
      [ref3]: https://wetten.overheid.nl/BWBR0028570#Artikel70
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel355
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '354'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '353'
        afdeling: Tweede
      - id: ref3
        bwb_id: BWBR0028570
        artikel: '70'
  - number: '356'
    text: |-
      1 Indien de telastelegging overeenkomstig [artikel 355][ref1] is gewijzigd, wordt aan de verdachte door de griffier
      een gewaarmerkt afschrift van de wijziging op de terechtzitting zelf ter hand gesteld. Is de verdachte niet ter
      terechtzitting aanwezig, dan wordt hem de wijziging zo spoedig mogelijk betekend.

      2 De rechter schorst het onderzoek voor een bepaalde tijd; met toestemming van de verdachte kan echter het
      onderzoek aanstonds worden voortgezet.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel355
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel356
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '355'
        afdeling: Tweede
  - number: '357'
    text: |-
      1 Indien in de telastelegging voor de opgave van het feit is volstaan met een omschrijving als bedoeld in
      [artikel 285, derde lid][ref1], wordt die opgave alsnog in overeenstemming gebracht met de in het eerste en tweede
      lid van dat artikel gestelde eisen.

      2 De [artikelen 355][ref2], met uitzondering van de laatste volzin van het derde lid, en [356][ref3] vinden
      overeenkomstig toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel285
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel355
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel356
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel357
