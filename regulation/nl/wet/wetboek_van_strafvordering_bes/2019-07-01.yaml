  - number: '80'
    text: |-
      1 Als de aangehouden verdachte naar een plaats van verhoor is geleid, mag hij met het oog op het verhoor niet
      langer dan zes uren worden opgehouden, met dien verstande dat de tijd tussen 10 uur ’s avonds en 8 uur ’s morgens
      niet wordt meegerekend. De hulpofficier van justitie kan bepalen, dat het verhoor, indien het belang van de zaak
      dat bepaaldelijk vordert, aaneensluitend na 10 uur wordt voortgezet. De duur van het verhoor na 10 uur wordt op de
      zes uren in mindering gebracht.

      2 De termijn vangt aan op het tijdstip dat de verdachte op de plaats van verhoor is aangekomen.

      3 Is de verdachte niet in staat het verhoor te ondergaan, dan vangt de termijn aan op het tijdstip dat hij daartoe
      wel in staat is.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel80
  - number: '81'
    text: |-
      1 De verdachte wordt aan geen andere beperkingen onderworpen dan die welke voor het doel van de ophouding voor het
      verhoor of in het belang van de orde volstrekt noodzakelijk zijn.

      2 Tijdens de ophouding voor het verhoor kunnen onder meer de in [artikel 90, tweede lid, onderdelen a en c][ref1],
      bedoelde maatregelen in het belang van het onderzoek worden bevolen.

      3 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de maatregelen die in
      het belang van het onderzoek kunnen worden bevolen.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel90
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '90'
  - number: '82'
    text: |-
      1 Iedere verdachte, die naar een plaats van verhoor is geleid, wordt terstond daarna, in ieder geval voordat het
      verhoor een aanvang neemt, op de hoogte gebracht van:

      a. de aard en de reden van de vrijheidsontneming,

      b. het recht om zich te onthouden van antwoorden, en

      c. het recht zich door een raadsman te doen bijstaan en, bij toepasselijkheid van de [artikelen 62][ref1] of
      [63][ref2], het recht om toevoeging van een raadsman te verzoeken.

      2 Behalve de mondelinge mededeling van de rechten, bedoeld in het eerste lid, wordt aan de verdachte een formulier
      uitgereikt, waarop die rechten zijn vermeld. Het model van het formulier wordt vastgesteld bij algemene maatregel
      van bestuur. Het formulier is steeds beschikbaar in tenminste de navolgende talen: Nederlands, Papiamentu, Engels
      en Spaans.

      3 Na de mededeling van zijn rechten tekent de verdachte het formulier voor gezien. Weigert hij te tekenen, dan
      wordt daarvan in het proces-verbaal melding gemaakt. Een afschrift van het formulier wordt bij de processtukken
      gevoegd.

      4 De mededeling geschiedt in een taal die de verdachte verstaat. Bij gegronde twijfel of een verdachte de
      mededeling goed heeft begrepen, neemt het verhoor geen aanvang, voordat de bijstand van een tolk is ingeroepen.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel63
