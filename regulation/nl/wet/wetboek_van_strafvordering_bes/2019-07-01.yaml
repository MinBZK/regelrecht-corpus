  - number: '479'
    text: |-
      Ten aanzien van personen, die op het tijdstip waarop de vervolging tegen hen is aangevangen, de leeftijd van
      achttien jaren nog niet hebben bereikt, zijn de bepalingen van dit wetboek van toepassing, voor zover deze afdeling
      geen afwijkende bepalingen bevat.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel479
  - number: '480'
    text: |-
      De bepalingen van deze afdeling die op de ouders of voogd betrekking hebben, zijn alleen van toepassing, indien de
      verdachte minderjarig is.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel480
  - number: '481'
    text: |-
      Aan de verdachte, die zich in verzekering of voorlopige hechtenis bevindt, of die in het tegen hem ingestelde
      gerechtelijk vooronderzoek door de rechter-commissaris wordt verhoord, wordt op zijn verzoek een raadsman
      toegevoegd. De officier van justitie of de hulpofficier van justitie geeft aan de instantie die ingevolge
      [artikel 61, eerste lid][ref1], met de toevoeging is belast, onverwijld kennis dat toevoeging moet plaatshebben.
      Indien hem geen raadsman is toegevoegd of de toevoeging niet tijdig heeft plaatsgehad, komt het beroepsrecht van
      [artikel 67, eerste lid][ref2], ook toe aan de ouders of voogd.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel67
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel481
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '61'
        paragraaf: '1'
        afdeling: Derde
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '67'
        paragraaf: '3'
        afdeling: Derde
  - number: '482'
    text: |-
      Indien de verdachte rechtens zijn vrijheid is ontnomen, is ten aanzien van zijn ouders of voogd [artikel 70][ref1]
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel70
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel482
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '70'
        afdeling: Vierde
  - number: '483'
    text: |-
      1 De officier van justitie kan bepalen dat de tenuitvoerlegging van het bevel tot inverzekeringstelling zal worden
      geschorst, indien de verdachte zich bereid heeft verklaard tot nakoming van de aan de schorsing te verbinden
      voorwaarden.

      2 Als algemene voorwaarde waaraan de verdachte zal moeten voldoen wordt gesteld, dat hij geen strafbaar feit zal
      begaan noch zich op andere wijze zal misdragen. Bovendien kunnen bijzondere voorwaarden worden gesteld het gedrag
      van de verdachte betreffende; deze mogen zijn godsdienstige of staatkundige vrijheid niet beperken.

      3 De schorsing, bepaald krachtens het eerste lid, kan slechts worden opgeheven wegens overtreding van de gestelde
      voorwaarden. Het bevel tot opheffing is met redenen omkleed. De verdachte wordt zo mogelijk gehoord.

      4 De termijn gedurende welke een bevel tot inverzekeringstelling van kracht is, loopt niet gedurende de tijd waarin
      de tenuitvoerlegging is geschorst.

      5 Behoudens eerdere opheffing vervalt het bevel tot inverzekeringstelling waarvan de tenuitvoerlegging is
      geschorst, aan het einde van de tiende dag na die waarop het bevel is gegeven.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel483
  - number: '484'
    text: |-
      1 Indien de rechter de voorlopige hechtenis van de verdachte beveelt, gaat hij na of de tenuitvoerlegging van dit
      bevel, hetzij onmiddellijk, hetzij na een bepaald tijdsverloop, kan worden geschorst.

      2 In het bevel tot voorlopige hechtenis en tot schorsing daarvan worden zodanige bepalingen opgenomen als voor de
      juiste uitvoering daarvan nodig worden geoordeeld.

      3 Tot het ondergaan van inverzekeringstelling of voorlopige hechtenis kan elke daartoe geschikte plaats worden
      aangewezen.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel484
  - number: '485'
    text: Waar in deze afdeling wordt gesproken van schorsing wordt daaronder begrepen opschorting.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel485
  - number: '486'
    text: |-
      1 De voogdijraad wordt door de officier van justitie onverwijld in kennis gesteld van het bevel tot
      inverzekeringstelling en van het bevel tot schorsing of opheffing daarvan.

      2 Indien naar aanleiding van de in het eerste lid bedoelde kennisgeving wordt gerapporteerd, slaat de officier van
      justitie daarop acht alvorens een vordering tot bewaring te doen.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel486
  - number: '487'
    text: |-
      1 Wanneer de officier van justitie voornemens is een van misdrijf verdachte te vervolgen, stelt hij de voogdijraad
      hiervan zo spoedig mogelijk in kennis. De voogdijraad licht de officier van justitie op diens verzoek in omtrent de
      persoonlijkheid en de levensomstandigheden van de verdachte. Zodanige inlichtingen kan de voogdijraad ook uit eigen
      beweging geven.

      2 Indien de verdachte zich in voorlopige hechtenis bevindt of ingevolge [artikel 175][ref1] in een inrichting is
      opgenomen, geeft de officier van justitie hiervan terstond bericht aan de voogdijraad.

      3 De rechter-commissaris is eveneens bevoegd om bij de voogdijraad de inlichtingen, bedoeld in het eerste lid, in
      te winnen.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel175
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel487
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '175'
  - number: '488'
    text: |-
      1 Het rechtsgeding wordt in het openbaar behandeld, tenzij de verdachte of diens medeverdachten op het tijdstip
      waarop de vervolging tegen hen is aangevangen de leeftijd van zestien jaren nog niet hebben bereikt. In dat geval
      kan de rechter tot bijwoning van deze niet-openbare terechtzitting bijzondere toegang verlenen.

      2 De rechter kan om gewichtige bij het proces-verbaal van de terechtzitting te vermelden redenen bepalen, hetzij
      ambtshalve, hetzij op de vordering van het openbaar ministerie of op het verzoek van de verdachte of diens
      raadsman, dat het rechtsgeding, indien dit ingevolge het bepaalde in het eerste lid met gesloten deuren moet
      plaatsvinden, geheel of gedeeltelijk in het openbaar zal worden gehouden.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel488
  - number: '489'
    text: |-
      1 De ouders of de voogd worden tot bijwoning van de terechtzitting opgeroepen.

      2 Indien ouders of voogd op de terechtzitting zijn verschenen, worden zij, nadat de verdachte, een medeverdachte,
      een getuige of een deskundige zijn verklaring heeft afgelegd, in de gelegenheid gesteld daartegen in te brengen wat
      tot verdediging kan dienen.

      3 Niettemin kan de rechter ambtshalve, op de vordering van het openbaar ministerie of op het verzoek van de
      verdachte of diens raadsman bevelen, dat tijdens een zitting met gesloten deuren een verhoor van de verdachte, van
      een getuige of van een deskundige buiten tegenwoordigheid van ouders of voogd geschiedt. De rechter deelt in dat
      geval de zakelijke inhoud van een en ander aan de ouders of voogd mee, tenzij gewichtige redenen zich daartegen
      verzetten.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel489
  - number: '490'
    text: |-
      1 De rechter kan ambtshalve, op de vordering van het openbaar ministerie of op het verzoek van de raadsman bepalen,
      dat vragen betreffende de persoonlijkheid of de levensomstandigheden van de verdachte buiten diens tegenwoordigheid
      zullen worden gesteld en behandeld en dat het openbaar ministerie of de raadsman buiten tegenwoordigheid van de
      verdachte daarover het woord zal voeren.

      2 Het tweede lid van [artikel 332][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel332
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel490
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '332'
        afdeling: Tweede
  - number: '491'
    text: |-
      Indien de rechter het noodzakelijk oordeelt, dat alsnog een onderzoek naar de persoonlijkheid en de
      levensomstandigheden van de verdachte wordt ingesteld, kan hij nadere inlichtingen bij de voogdijraad inwinnen.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel491
  - number: '492'
    text: |-
      De [Eerste Titel][ref1] en de [Vierde Titel van het Vijfde Boek][ref2] zijn van overeenkomstige toepassing, voor
      zover in deze titel niet anders wordt bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0028681
      [ref2]: https://wetten.overheid.nl/BWBR0028681
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel492
    references:
      - id: ref1
        bwb_id: BWBR0028681
      - id: ref2
        bwb_id: BWBR0028681
  - number: '493'
    text: |-
      Indien de zaak door oproeping aanhangig is gemaakt, wordt in de oproeping van de ouders of de voogd het in de
      oproeping tenlastegelegde feit opgenomen. In het geval bedoeld in de aanhef van [artikel 420][ref1], is dat artikel
      ten aanzien van de wijze van oproeping van ouders of voogd, en zo nodig van intrekking van deze oproeping van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel420
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel493
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '420'
  - number: '494'
    text: |-
      1 Indien de verdachte, die op het tijdstip waarop de vervolging tegen hem is aangevangen, de leeftijd van zestien
      jaren nog niet heeft bereikt en een raadsman heeft, komen alle bevoegdheden hem in dit wetboek, met uitzondering
      van de [Vierde Titel van het Vijfde Boek][ref1], toegekend, eveneens toe aan zijn raadsman.

      2 Tegen het instellen, intrekken of afstand doen door de raadsman van enig rechtsmiddel kan, in het geval van
      het eerste lid, de verdachte of diens wettelijke vertegenwoordiger binnen drie dagen nadat de termijn voor het
      instellen daarvan is verstreken, een bezwaarschrift indienen bij de rechter in eerste aanleg of de voorzitter
      van het college, waarvoor de zaak wordt vervolgd of het laatst is vervolgd. De rechter in eerste aanleg of de
      voorzitter beslist ten spoedigste; de verdachte, diens wettelijke vertegenwoordiger alsmede de raadsman worden
      gehoord, althans, op de wijze door de rechter in eerste aanleg of de voorzitter te bepalen, opgeroepen. Indien het
      bezwaarschrift gegrond wordt bevonden, loopt de termijn voor het instellen of intrekken van het rechtsmiddel alsnog
      gedurende drie dagen.


      [ref1]: https://wetten.overheid.nl/BWBR0028681
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel494
    references:
      - id: ref1
        bwb_id: BWBR0028681
  - number: '495'
    text: |-
      1 De straf van berisping wordt tenuitvoergelegd door de rechter in eerste aanleg of door de voorzitter van de
      samenstelling van het Hof die de veroordeling heeft uitgesproken.

      2 De tenuitvoerlegging geschiedt in een niet openbare terechtzitting zodra mogelijk na het uitspreken van de
      veroordeling.

      3 De rechter kan daarbij de hulp inroepen van een door hem aan te wijzen ambtenaar.

      4 Bij die tenuitvoerlegging kunnen de ouders of de voogd van de veroordeelde desverlangd tegenwoordig zijn, waartoe
      zij door de griffier van het Hof of van het gerecht in eerste aanleg worden opgeroepen.

      5 Indien de verdachte bij de uitspraak van de veroordeling aanwezig is, kan de tenuitvoerlegging van de straf
      van berisping terstond plaats vinden. In dit geval geschiedt daarvan aantekening in het proces-verbaal van de
      terechtzitting en blijft de oproeping, bedoeld in het vierde lid, achterwege.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel495
  - number: '496'
    text: |-
      1 Indien wordt afgezien van verhaal of verder verhaal van het bedrag, verschuldigd wegens een opgelegde geldboete
      of verbeurdverklaring van niet in beslag genomen voorwerpen, kan het nog te betalen bedrag, op vordering van het
      openbaar ministerie, worden vervangen door berisping.

      2 Op de vordering wordt beslist door de rechter die de straf heeft opgelegd, nadat de veroordeelde in de
      gelegenheid is gesteld daarop te worden gehoord. Indien het hem raadzaam voorkomt geeft de rechter de nodige
      bevelen voor de verschijning van de veroordeelde in de raadkamer.

      3 De rechter beslist bij een met redenen omklede beschikking. Indien hij de vordering afwijst, kan hij bepalen dat
      het verschuldigde alsnog in gedeelten met inachtneming van door hem vast te stellen termijnen mag worden voldaan.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel496
  - number: '497'
    text: |-
      1 Voor zover niet anders is bepaald, worden alle dagvaardingen, oproepingen, kennisgevingen, aanzeggingen of andere
      schriftelijke mededelingen aan de minderjarige verdachte tevens ter kennis gebracht van zijn ouders of voogd,
      alsmede van zijn raadsman.

      2 De bepaling van het eerste lid geldt niet ten aanzien van de raadsman in zaken die overtredingen betreffen,
      ook niet in hoger beroep van zodanige zaken, en evenmin ten aanzien van ouders of voogd in geval van oproeping
      overeenkomstig [artikel 416][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel416
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel497
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '416'
  - number: '498'
    text: |-
      Alle betekeningen, dagvaardingen, oproepingen, kennisgevingen, aanzeggingen of andere mededelingen aan ouders of
      voogd vinden enkel plaats, indien deze een bekende verblijfplaats in de openbare lichamen Bonaire, Sint Eustatius
      en Saba hebben; aan samenwonende ouders wordt slechts een stuk uitgereikt.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel498
  - number: '499'
    text: |-
      1 In elke stand van de zaak betreffende een verdachte die de leeftijd van achttien jaren bereikt heeft of naar
      burgerlijk recht meerderjarig is, zal de rechter in eerste aanleg of het Hof, indien er vermoeden bestaat dat bij
      de verdachte tijdens het begaan van het feit gebrekkige ontwikkeling of ziekelijke storing van de geestvermogens
      bestond, en dat hij ten gevolge daarvan niet in staat is zijn belangen behoorlijk te behartigen, zulks bij
      beslissing verklaren.

      2 De beslissing wordt gegeven, hetzij ambtshalve, hetzij op de voordracht van de rechter-commissaris, op de
      vordering van het openbaar ministerie of op het daartoe strekkend verzoek van de verdachte, van zijn raadsman, van
      zijn echtgenoot, dan wel degene met wie hij duurzaam feitelijk samenwoont, van een van zijn ouders, van zijn voogd,
      van zijn curator of van een van zijn bloed- of aanverwanten tot de derde graad ingesloten.

      3 Voor zover de beslissing niet in zijn tegenwoordigheid is gegeven, wordt de inhoud daarvan de verdachte
      onverwijld vanwege het openbaar ministerie betekend.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel499
  - number: '500'
    text: |-
      1 De rechter kan, alvorens te beslissen, de rechtercommissaris, zolang deze met het gerechtelijk vooronderzoek is
      belast, of het openbaar ministerie opdragen een nader onderzoek in te stellen en aan de rechter daaromtrent verslag
      te doen.

      2 De beslissing, bij het eerste lid van [artikel 499][ref1] bedoeld, is niet aan enig rechtsmiddel onderworpen,
      doch kan door de rechter te allen tijde worden herroepen; ten aanzien van de beslissing tot herroeping vinden de
      artikelen 499 en [502][ref2] overeenkomstige toepassing en al hetgeen bij of ingevolge eerstgenoemde beslissing tot
      de herroeping toe is verricht, blijft niettemin van kracht.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel499
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel502
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel500
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '499'
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '502'
  - number: '501'
    text: |-
      Ten spoedigste na de beslissing, bij het eerste lid van [artikel 499][ref1] bedoeld, voegt de rechter in eerste
      aanleg of, indien de beslissing door het Hof is gegeven, de voorzitter de verdachte van misdrijf, indien hij nog
      geen toegevoegde raadsman heeft, een raadsman toe. Aan de verdachte van overtreding kan door de rechter in eerste
      aanleg of de voorzitter een raadsman worden toegevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel499
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel501
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '499'
  - number: '502'
    text: |-
      1 Van het ogenblik af van de beslissing, bij het eerste lid van [artikel 499][ref1] bedoeld, en,
      behoudens herroeping, totdat de zaak door een in kracht van gewijsde gegaan vonnis is beëindigd, vinden de
      [artikelen 31][ref2], [482][ref3], [484, derde lid][ref4], [489][ref5], [490][ref6], [497][ref7] en [498][ref8],
      voor zover zij niet reeds rechtstreeks van toepassing zijn, overeenkomstige toepassing, met dien verstande dat
      de bepalingen aangaande ouders of voogd slechts overeenkomstig worden toegepast, indien de verdachte een curator
      heeft, en in dit geval in dier voege dat zij uitsluitend deze betreffen. Tijdens het gerechtelijk vooronderzoek
      vindt artikel 489 tevens overeenkomstige toepassing ten aanzien van het verhoor van de verdachte door de rechter-
      commissaris.

      2 De verdachte is verplicht in persoon ter terechtzitting te verschijnen. Bij de dagvaarding wordt hem kennis
      gegeven dat, indien hij niet aan deze verplichting voldoet, de rechter zijn medebrenging kan gelasten. Bij niet-
      verschijning in persoon, kan de rechter in eerste aanleg of het Hof, hetzij ambtshalve, hetzij op de vordering
      van het openbaar ministerie of op het verzoek van de raadsman, indien de rechter of het Hof van oordeel is, dat de
      persoonlijke verschijning van de verdachte noch noodzakelijk noch gewenst is en de raadsman is verschenen en zich
      daartegen niet verzet, het geven van het bevel tot medebrenging achterwege laten. In zodanig geval wordt verstek
      verleend en het onderzoek van de zaak voortgezet; de raadsman blijft met de verdediging belast.

      3 Het rechtsgeding wordt niet in het openbaar behandeld. De rechter kan tot bijwoning van deze niet-openbare
      terechtzitting bijzondere toegang verlenen.

      4 De bevoegdheden, bij dit wetboek aan de verdachte toegekend, komen na de beslissing, bij het eerste lid van
      [artikel 499][ref9] bedoeld, steeds mede toe aan de raadsman.


