        artikel: '575'
        paragraaf: A
        afdeling: Tweede
  - number: '577'
    text: |-
      1 De rechter-commissaris kan op de vordering van de procureur-generaal bevelen, dat de voorlopige
      vrijheidsontneming van de veroordeelde wordt verlengd.

      2 Alvorens een bevel ingevolge het vorige lid te geven, hoort de rechter-commissaris zo mogelijk de veroordeelde.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel577
  - number: '578'
    text: |-
      1 De verlenging kan worden gelast voor een termijn van ten hoogste veertien dagen. De voorlopige vrijheidsontneming
      kan op de vordering van de procureur-generaal telkens met een termijn van ten hoogste dertig dagen verder worden
      verlengd, totdat het Hof ingevolge [artikel 589, tweede lid][ref1], over de gevangenhouding beslist.

      2 De veroordeelde wiens voorlopige vrijheidsontneming is gelast wordt, behoudens de mogelijkheid van
      vrijheidsontneming uit anderen hoofde, in vrijheid gesteld:

      a. zodra dit door het Hof, de rechter-commissaris of de procureur-generaal ambtshalve of op het verzoek van de
      veroordeelde of diens advocaat wordt gelast;

      b. zodra de voorlopige vrijheidsontneming veertien dagen heeft geduurd en de procureur-generaal de in de
      [artikelen 581][ref2] of [582][ref3] bedoelde stukken niet heeft ontvangen;

      c. indien de duur van de voorlopige vrijheidsontneming die van het voor tenuitvoerlegging vatbare gedeelte van de
      in de vreemde staat opgelegde sanctie zou overtreffen.

      3 De in het tweede lid, onderdeel b, genoemde termijn loopt niet gedurende de tijd dat de veroordeelde zich aan de
      verdere tenuitvoerlegging van de gelaste vrijheidsontneming heeft onttrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel589
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel581
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel582
