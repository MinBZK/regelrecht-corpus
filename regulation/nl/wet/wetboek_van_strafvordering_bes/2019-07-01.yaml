  - number: '634'
    text: |-
      1 Indien de maatregel bedoeld in [artikel 38e van het Wetboek van Strafrecht BES][ref1] is opgelegd, vinden de
      [artikelen 615, tweede en derde lid][ref2], [628 tot en met 631][ref3] overeenkomstig toepassing.

      2 Op de vordering van het openbaar ministerie, of op het schriftelijke verzoek van de veroordeelde of van
      een benadeelde derde, kan de rechter die de in het eerste lid genoemde maatregel heeft opgelegd, het daarin
      vastgestelde bedrag en de bevolen vervangende hechtenis verminderen of kwijtschelden. Is het bedrag reeds betaald
      of verhaald dan kan de rechter bevelen dat het geheel of gedeeltelijk zal worden teruggegeven of aan een door hem
      aangewezen derde uitgekeerd. Het bevel laat ieders recht op het teruggegeven of uitgekeerde bedrag onverlet.

      3 Wanneer blijkt dat een hoger bedrag is vastgesteld dan de som van het werkelijke voordeel, geeft de rechter een
      beschikking strekkende tot vermindering of teruggave, ten minste gelijk aan het verschil.

      4 Tot vermindering of kwijtschelding als bedoeld in het tweede lid kan slechts worden besloten op grond van
      omstandigheden die zich na de uitspraak hebben voorgedaan, of die ten tijde daarvan niet, of niet volledig, aan de
      rechter bekend waren.

      5 De rechter beslist, het openbaar ministerie gehoord, na verhoor of behoorlijke oproeping van de veroordeelde en,
      zo deze het verzoek heeft gedaan, de benadeelde derde.

      6 De vordering en het verzoek, bedoeld in het tweede lid, kunnen niet meer worden gedaan nadat drie jaren zijn
      verstreken sedert de dag waarop het bedrag, of het laatste gedeelte daarvan, is betaald of verhaald.

      7 De rechter kan ambtshalve bevelen dat de maatregel, hangende zijn beslissing, niet ten uitvoer zal worden gelegd.
      Het bevel wordt onverwijld ter kennis gebracht van het openbaar ministerie.

      8 De beschikking wordt aan de veroordeelde en, zo zij op verzoek van een derde is gewezen, ook aan deze betekend.
      Zij is niet aan enig gewoon rechtsmiddel onderworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel38e
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel615
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel628
