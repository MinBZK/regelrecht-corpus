  - number: '521'
    text: |-
      1 De bevoegdheden, bij enige wetsbepaling toegekend in verband met de opsporing van strafbare feiten of in verband
      met het onderzoek daarnaar, anders dan ter terechtzitting, kunnen, voor zover in deze titel niet anders is bepaald,
      buiten het rechtsgebied van Bonaire, Sint Eustatius en Saba worden uitgeoefend.

      2 De bepalingen van de eerste en tweede afdeling van deze titel zijn slechts van toepassing ten aanzien van de
      opsporing en het onderzoek buiten het rechtsgebied van Bonaire, Sint Eustatius en Saba. Voor zover zij betrekking
      hebben op een aangehouden persoon of een inbeslaggenomen voorwerp blijven zij, ook binnen het rechtsgebied van
      Bonaire, Sint Eustatius en Saba van toepassing, totdat de aangehoudene of het voorwerp is overgeleverd aan de
      officier van justitie of een hulpofficier.

      3 De bevoegdheden, in de bepalingen van deze titel toegekend, kunnen slechts worden uitgeoefend, voor zover het
      volkenrecht en het interregionale recht dit toelaten.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel521
  - number: '522'
    text: |-
      1 Anderen dan opsporingsambtenaren oefenen de bevoegdheden, in [artikel 521][ref1] of in de tweede afdeling van
      deze titel toegekend, niet uit dan op aanwijzing van de officier van justitie, tenzij zodanige aanwijzingen niet
      kunnen worden afgewacht.

      2 Ieder die een bevoegdheid als bedoeld in het eerste lid heeft uitgeoefend, stelt de officier van justitie
      onverwijld en op de snelst mogelijke wijze in kennis van:

      a. het te zijner kennis gekomen strafbare feit;

      b. elke door hem krachtens een bevoegdheid als bedoeld in het eerste lid getroffen maatregel.

      3 Bij die kennisgeving doet hij voor zover mogelijk opgave van de personalia van de verdachte en diens
      nationaliteit, alsmede van zijn eigen personalia en van andere terzake doende feiten. Hij tracht voorts ten
      spoedigste aanwijzingen van de officier van justitie te verkrijgen aangaande de wijze waarop terzake dient te
      worden gehandeld. Hij neemt de aanwijzingen van de officier van justitie in acht.

      4 Het in het tweede en derde lid bepaalde geldt ook voor degene aan wie een aangehouden verdachte of een
      inbeslaggenomen voorwerp wordt overgeleverd.

      5 Het bepaalde in het eerste tot en met vierde lid geldt niet voor leden van de rechterlijke macht ten aanzien van
      die verrichtingen waartoe zij als zodanig bevoegd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel521
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel522
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '521'
        afdeling: Eerste
  - number: '523'
    text: |-
      1 De commandant kan in geval van een strafbaar feit met inachtneming van de bepalingen van deze titel inlichtingen
      en bewijzen verzamelen, die tot opheldering van de zaak kunnen dienen, tenzij de officier van justitie anders
      beslist.

      2 Dezelfde bevoegdheid komt toe aan de schipper en aan de gezagvoerder van een luchtvaartuig aan boord van het
      vaartuig of luchtvaartuig waarover zij het gezag voeren. Onder vaartuig wordt een door Onze Minister van Justitie
      aangewezen installatie ter zee begrepen.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel523
  - number: '524'
    text: |-
      Bij algemene maatregel van bestuur kunnen alle of bepaalde commandanten worden belast met de opsporing, buiten het
      rechtsgebied van Bonaire, Sint Eustatius en Saba, van daarbij vermelde strafbare feiten.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel524
  - number: '525'
    text: |-
      1 De commandant kan een verrichting, waartoe hij op grond van een van de bepalingen van deze titel als zodanig dan
      wel na aanwijzing op grond van [artikel 524][ref1] als opsporingsambtenaar bevoegd is, opdragen aan een onder zijn
      bevelen staande officier.

      2 De schipper kan een verrichting, waartoe hij op grond van een van de bepalingen van deze titel bevoegd is,
      opdragen aan een onder zijn bevelen staande scheepsofficier.

      3 De gezagvoerder van een luchtvaartuig kan een verrichting, waartoe hij op grond van een van de bepalingen van
      deze titel bevoegd is, opdragen aan een onder zijn bevelen staand lid van de bemanning.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel524
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel525
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '524'
        afdeling: Eerste
  - number: '526'
    text: |-
      1 De commandant, de schipper of de gezagvoerder van een luchtvaartuig maakt, indien hij een van de bevoegdheden, in
      de [artikelen 521][ref1] of [523][ref2] of in de tweede afdeling van deze titel toegekend, uitoefent, persoonlijk
      ten spoedigste proces-verbaal op van zijn verrichtingen en bevindingen.

      2 De officier, de scheepsofficier of het lid van de bemanning van een luchtvaartuig handelt in geval van toepassing
      van [artikel 525][ref3] overeenkomstig het eerste lid.

      3 Wanneer de schipper of een scheepsofficier dan wel de gezagvoerder van een luchtvaartuig of een lid van de
      bemanning de verdachte of getuigen verhoort, zijn daarbij zo mogelijk twee opvarenden of inzittenden aanwezig, die
      het proces-verbaal van verhoor mede ondertekenen.

      4 Het proces-verbaal wordt gedagtekend door de verbalisant. Hij vermeldt zoveel mogelijk uitdrukkelijk zijn redenen
      van wetenschap.

      5 Het proces-verbaal van de officier, de scheepsofficier of het lid van de bemanning van een luchtvaartuig wordt
      mede ondertekend door de commandant, onderscheidenlijk de schipper en de gezagvoerder van het luchtvaartuig.

      6 Het proces-verbaal wordt door de commandant, de schipper of de gezagvoerder van het luchtvaartuig ten spoedigste
      toegezonden aan de officier van justitie, tenzij deze anders beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel521
