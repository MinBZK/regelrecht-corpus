  - number: 635a
    text: |-
      1 Indien de officier van justitie overeenkomstig [artikel 503b][ref1] een schikking met de verdachte of
      veroordeelde aangaat, bepaalt hij de termijn waarbinnen aan de termen van die schikking moet worden voldaan.Tot
      dat tijdstip is de termijn waarbinnen ingevolge [artikel 503a, eerste lid][ref2], een vordering aanhangig moet zijn
      gemaakt geschorst. Door voldoening aan die termen vervalt het recht tot indiening van de vordering of is, indien
      die vordering reeds is ingediend, de zaak van rechtswege geëindigd.

      2 Wanneer na voldoening aan die termen, bedoeld in het eerste lid, blijkt van omstandigheden die de
      toepasselijkheid van de maatregel bedoeld in [artikel 38e van het Wetboek van Strafrecht BES][ref3] zouden hebben
      uitgesloten, kan de gewezen verdachte of veroordeelde de officier van justitie verzoeken om teruggave van betaalde
      geldbedragen of overgedragen voorwerpen.

      3 Binnen veertien dagen nadat de gewezen verdachte of veroordeelde kennis heeft gekregen van de beslissing op een
      overeenkomstig het tweede lid gedaan verzoek, kan hij schriftelijk beklag doen bij het gerecht waarbij de officier
      van justitie is geplaatst.

      4 Het beklag kan ook worden gedaan wanneer dertig dagen zijn verstreken sedert de indiening van het verzoek en
      inmiddels daarop niet is beslist.

      5 Acht het gerecht het beklag gegrond, dan beveelt het de teruggave van betaalde geldbedragen of overgedragen
      voorwerpen naar maatstaven van redelijkheid en billijkheid.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel503b
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel503a
      [ref3]: https://wetten.overheid.nl/BWBR0028570#Artikel38e
