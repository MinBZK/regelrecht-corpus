  - number: 79c
    text: |-
      1 Ten aanzien van het onderzoek door deskundigen als bedoeld in de [artikelen 79][ref1] en [79b][ref2], zijn de
      bepalingen van de [zesde afdeling van de derde Titel van het Vierde Boek][ref3] van overeenkomstige toepassing,
      behoudens voor zover daarvan in artikel 79 en 79b wordt afgeweken.

      2 Bij toepassing van [artikel 267][ref4] is [artikel 79b][ref5] niet van toepassing.


