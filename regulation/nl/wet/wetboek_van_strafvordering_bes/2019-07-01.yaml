  - number: '398'
    text: |-
      1 Indien een uitspraak bij verstek is gedaan, kan, nadat deze uitvoerbaar is geworden, de beslissing van het Hof
      ten aanzien van de stukken van overtuiging worden uitgevoerd, nadat van die stukken, indien de uitspraak nog niet
      in kracht van gewijsde is gegaan, een nauwkeurige beschrijving door de griffier is opgemaakt en op de griffie
      neergelegd.

      2 Het Hof kan van de teruggave of vernietiging overeenkomstig het eerste lid uitzonderen zodanige voorwerpen, als
      het nodig vindt.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel398
  - number: '399'
    text: |-
      1 Indien het Hof valsheid in authentiek geschrift aanneemt, verklaart het bij de uitspraak het gehele stuk vals, of
      wijst het aan waarin de valsheid bestaat.

      2 Zodra het vonnis in kracht van gewijsde is gegaan, stelt de griffier een door hem ondertekende aantekening op het
      stuk, houdende dat dit geheel of gedeeltelijk is vals verklaard en vermeldende het vonnis waarbij dit is geschied.

      3 Het in het tweede lid bepaalde is niet van toepassing op akten, voorkomende in een register van de burgerlijke
      stand.

      4 Grossen, afschriften of uittreksels van het stuk worden niet uitgegeven, dan met bijvoeging van de daarop
      gestelde aantekening.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel399
  - number: '400'
    text: |-
      1 Het vonnis behelst voor zover mogelijk naam en voornamen, leeftijd, geboorteplaats, beroep en woon- of
      verblijfplaats van de verdachte.

      2 Het bevat voorts, op straffe van nietigheid, de namen van de rechters door wie het is gewezen en de dag van de
      uitspraak.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel400
  - number: '401'
    text: |-
      1 In het geding in eerste aanleg bevat het vonnis, in de gevallen van [artikel 393][ref1], de daarbij vermelde
      beslissingen.

      2 In de andere gevallen bevat het vonnis de beslissing over de punten, bij [artikel 394, eerste lid][ref2],
      vermeld.

      3 Wordt, in strijd met het te dien aanzien door de verdachte uitdrukkelijk voorgedragen verweer,
      [artikel 393][ref3] niet toegepast of aangenomen dat het bewezenverklaarde een bepaald strafbaar feit oplevert of
      dat een bepaalde strafverminderings- of strafuitsluitingsgrond niet aanwezig is, dan geeft het vonnis daaromtrent
      bepaaldelijk een beslissing.

      4 Het vonnis vermeldt verder, in geval van oplegging van straf of maatregel, de wettelijke voorschriften waarop
      deze is gegrond.

      5 Alles op straffe van nietigheid.


