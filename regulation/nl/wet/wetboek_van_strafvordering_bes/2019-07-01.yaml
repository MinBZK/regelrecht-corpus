  - number: 177t
    text: |-
      1 De officier van justitie kan, indien het belang van het onderzoek dit dringend vordert, van
      degene van wie redelijkerwijs kan worden vermoed dat hij toegang heeft tot gegevens als bedoeld in
      [artikel 177s, tweede lid, tweede volzin][ref1], deze gegevens vorderen, in geval van:

      a. verdenking van een misdrijf waarvoor voorlopige hechtenis is toegelaten, en dat, gezien zijn aard of de
      samenhang met andere vermoedelijk door de verdachte begane misdrijven een ernstige inbreuk op de rechtsorde
      oplevert;

      b. aanwijzingen van een terroristisch misdrijf.

      2 Een vordering als bedoeld in het eerste lid kan noch worden gericht tot de verdachte noch tot de persoon, bedoeld
      in de [artikelen 251][ref2], [252][ref3] of [253][ref4].

      3 Een vordering als bedoeld in het eerste lid kan slechts worden gedaan na voorafgaande machtiging, te verlenen
      door de rechter-commissaris.

      4 [Artikel 177s, derde, vijfde, zesde, en achtste lid][ref5], is van overeenkomstige toepassing.


