  - number: '103'
    text: |-
      1 Het bevel tot voorlopige hechtenis kan te allen tijde door de rechter-commissaris, dan wel nadat het onderzoek
      ter terechtzitting is aangevangen, door de rechter in eerste aanleg worden opgeheven. De rechter in eerste aanleg
      kan dit doen ambtshalve, op het verzoek van de verdachte of op de vordering van de officier van justitie.

      2 De verdachte die voor de eerste maal opheffing verzoekt, wordt, tenzij de rechter reeds aanstonds tot inwilliging
      besluit, in de gelegenheid gesteld op het verzoek te worden gehoord.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel103
  - number: '104'
    text: |-
      1 Uiterlijk drie dagen na de tenuitvoerlegging kan de verdachte van de beschikking, houdende bevel tot
      gevangenneming of gevangenhouding, bij het Hof van Justitie in hoger beroep komen.

      2 Binnen dezelfde termijn kan de verdachte in beroep komen van een bevel tot verlenging van de gevangenhouding,
      doch slechts wanneer door hem geen hoger beroep werd ingesteld tegen het bevel tot gevangenhouding en ook niet
      tegen een eerder bevel tot verlenging.

      3 Alvorens het Hof beslist wordt de verdachte in de gelegenheid gesteld te worden gehoord.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel104
  - number: '105'
    text: |-
      1 Bij alle einduitspraken wordt, behoudens het bepaalde in [artikel 34, tweede lid][ref1], het bevel tot voorlopige
      hechtenis opgeheven, indien, ter zake van het feit waarvoor dat bevel is verleend, aan de verdachte noch een
      vrijheidsstraf van langere duur dan de reeds door hem in voorlopige hechtenis doorgebrachte tijd, noch een
      maatregel die vrijheidsontneming meebrengt of kan meebrengen, onvoorwaardelijk is opgelegd.

      2 Indien de duur van de onvoorwaardelijk opgelegde vrijheidsstraf die van de reeds ondergane voorlopige hechtenis
      met minder dan vijf maanden overtreft en geen maatregel die vrijheidsontneming meebrengt of kan meebrengen
      onvoorwaardelijk is opgelegd, wordt, onverminderd het bepaalde in [artikel 103][ref2], bij de einduitspraak het
      bevel tot voorlopige hechtenis opgeheven met ingang van het tijdstip waarop de duur van deze hechtenis gelijk wordt
      aan die van de straf.

      3 Voor de toepassing van het eerste en tweede lid van dit artikel wordt onder de in voorlopige hechtenis
      doorgebrachte tijd begrepen de tijd gedurende welke de verdachte in verzekering was gesteld.

      4 Indien de einduitspraak tot invrijheidstelling van de verdachte zou moeten leiden, kan de rechter, in afwijking
      van het eerste lid en alle belangen in aanmerking genomen, bepalen, dat de voorlopige hechtenis gedurende een
      termijn van ten hoogste drie weken van kracht blijft, onverminderd het bepaalde in het vijfde en zesde lid.

      5 Indien de einduitspraak nietigverklaring van de dagvaarding inhoudt, de officier van justitie een nieuwe
      dagvaarding uitbrengt en de behandeling ter terechtzitting binnen de termijn van drie weken geen aanvang heeft
      genomen, wordt de verdachte bij het verstrijken van die termijn terstond in vrijheid gesteld.Vindt de behandeling
      ter terechtzitting wel binnen deze termijn plaats, dan duurt de voorlopige hechtenis voort, overeenkomstig
      [artikel 98, tweede lid][ref3], ook ingeval de verdachte tegen die nieuwe dagvaarding een bezwaarschrift heeft
      ingediend.

      6 Indien de einduitspraak vrijspraak van het tenlastegelegde of ontslag van rechtsvervolging inhoudt en tegen die
      beslissing hoger beroep is aangetekend, dient de behandeling ter terechtzitting in hoger beroep binnen drie weken
      na de einduitspraak te zijn aangevangen. Indien die termijn is verstreken, voordat de behandeling in hoger beroep
      een aanvang heeft genomen, of indien, voordat die termijn is verstreken, het openbaar ministerie van het hoger
      beroep heeft afgezien, wordt de verdachte terstond in vrijheid gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel103
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel98
