  - number: '627'
    text: |-
      1 Het Hof van Justitie waakt voor de nakoming van de voorschriften van de [artikelen 621 tot en met 625][ref1] en
      doet te dien einde de gevangenis en andere inrichtingen door een of meer leden op onbepaalde tijden, doch tenminste
      tweemaal ’s jaars, bezoeken.

      2 Van de bevindingen wordt telkenmale schriftelijk verslag gedaan aan Onze Minister van Justitie.

      3 De officieren van justitie zijn verplicht tot het bezoeken en het doen van verslag op de voet als in het eerste
      en tweede lid is vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel621
