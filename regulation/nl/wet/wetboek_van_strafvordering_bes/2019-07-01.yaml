  - number: 177y
    text: |-
      1 De opsporingsambtenaar is verplicht van de hem in de wet verleende inbeslagnemingsbevoegdheden gebruik te
      maken, indien hij tijdens het opsporingsonderzoek de vindplaats weet van voorwerpen waarvan het aanwezig hebben of
      voorhanden hebben ingevolge de wet verboden is vanwege hun schadelijkheid voor de gezondheid of hun gevaar voor de
      veiligheid. Uitstel van inbeslagneming wordt slechts in het belang van het onderzoek toegestaan met het oogmerk om
      op een later tijdstip daartoe over te gaan.

      2 Uitstel van inbeslagneming vindt alleen plaats na voorafgaand bevel van de officier van justitie.

      3 Het bevel is schriftelijk en vermeldt:

      a. de voorwerpen waarop het betrekking heeft;

      b. de wijze waarop aan het bevel uitvoering moet worden gegeven;

      c. het tijdstip waarop of de periode waarin het bevel geldt.

      4 De verplichting tot inbeslagneming, bedoeld in het eerste lid, geldt niet in het geval de officier van justitie
      op grond van een zwaarwegend opsporingsbelang anders beveelt.

      5 Een bevel als bedoeld in het vierde lid is schriftelijk en vermeldt:

      a. de voorwerpen waarop het betrekking heeft;

      b. het zwaarwegende opsporingsbelang;

      c. het tijdstip waarop of de periode gedurende welke de verplichting tot inbeslagneming niet geldt.

      6 Toepassing van het vierde lid vindt alleen plaats na voorafgaande schriftelijke toestemming van de procureur-
      generaal.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel177y
  - number: 177z
    text: |-
      1 Indien uit feiten of omstandigheden aanwijzingen voortvloeien dat binnen verzamelingen van personen misdrijven
      worden beraamd of gepleegd waarvoor voorlopige hechtenis is toegelaten, en die, gezien hun aard of de samenhang
      met andere vermoedelijk binnen die groep beraamde of gepleegde misdrijven een ernstige inbreuk op de rechtsorde
      opleveren, kan de officier van justitie bevelen dat opsporingsambtenaren daarnaar een onderzoek instellen met als
      doel de voorbereiding van opsporing.

      2 Indien een onderzoek als bedoeld in het eerste lid de voorbereiding van de opsporing van terroristische
      misdrijven tot doel heeft, kan de officier van justitie na voorafgaande schriftelijke machtiging, op zijn vordering
      te verlenen door de rechter-commissaris, in het belang van het onderzoek van degene die daarvoor redelijkerwijs
      in aanmerking komt en die anders dan ten behoeve van persoonlijk gebruik gegevens verwerkt, vorderen bepaalde
      opgeslagen gegevens of vastgestelde gegevens van een persoon te verstrekken, teneinde de gegevens te doen bewerken.

      3 Een vordering als bedoeld in het tweede lid kan noch worden gericht tot de personen bedoeld in het eerste lid
      noch tot de persoon, bedoeld in de [artikelen 251][ref1], [252][ref2] of [253][ref3].

      4 De bewerking als bedoeld in het tweede lid kan bestaan uit het onderling vergelijken dan wel het in combinatie
      met elkaar verwerken van de gegevens met gegevens uit de politieregisters.

      5 De bewerking wordt op een zodanige wijze uitgevoerd dat de bescherming van de persoonlijke levenssfeer van
      personen zo veel mogelijk wordt gewaarborgd.

      6 Van de verstrekking van de gegevens, bedoeld in het tweede lid, doet de officier van justitie proces-verbaal
      opmaken, waarin wordt vermeld:

      a. de verstrekte gegevens;

      b. de reden waarom de gegevens in het belang van het onderzoek worden gevorderd.

      7 De officier van justitie doet van de bewerking proces-verbaal opmaken, waarin wordt vermeld:

      a. een aanduiding van de gegevens waarop de bewerking is uitgevoerd;

      b. een beschrijving van de wijze waarop de bewerking is uitgevoerd;

      c. de feiten en omstandigheden waaruit blijkt dat de voorwaarden, bedoeld in het tweede lid, zijn vervuld.

      8 Bij algemene maatregel van bestuur worden voorschriften gegeven omtrent de wijze waarop de gegevens die
      voortvloeien uit een onderzoek als bedoeld in het eerste lid worden bewaard en vernietigd.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel251
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel252
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel253
