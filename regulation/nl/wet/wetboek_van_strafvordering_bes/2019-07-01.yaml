  - number: 592c
    text: |-
      1 Beslissingen als bedoeld in [artikel 592a][ref1] kunnen zodra zij zijn genomen worden ten uitvoer gelegd, tenzij
      het toepasselijke verdrag anders bepaalt. Door het indienen van een bezwaarschrift binnen de daarvoor gestelde
      termijn wordt de tenuitvoerlegging opgeschort.

      2 Beslissingen genomen krachtens [artikel 592a][ref2] worden ten uitvoer gelegd met inachtneming van het bij of
      krachtens dit wetboek omtrent de tenuitvoerlegging van geldboeten bepaalde, met uitzondering van het derde lid
      van [artikel 630][ref3].


