  - number: 150a
    text: |-
      1 De belanghebbenden, anderen dan de verdachte, gewezen verdachte of veroordeelde, kunnen zich schriftelijk
      beklagen over een schikking als bedoeld in [artikel 503b][ref1] op de grond dat deze betrekking heeft op hun
      toekomende voorwerpen en de officier van justitie die de voorwaarden heeft opgelegd, onderscheidenlijk de schikking
      is aangegaan, niet bereid is gebleken die voorwerpen of de waarde die zij bij verkoop redelijkerwijs hadden moeten
      opbrengen te vergoeden.

      2 Het klaagschrift wordt, niet later dan nadat de verdachte, gewezen verdachte of veroordeelde aan de gestelde
      voorwaarden of aan de termen van de schikking heeft voldaan, dan wel de klager daarmee bekend is geworden,
      ingediend ter griffie van het gerecht waarbij de in het eerste lid bedoelde officier van justitie is geplaatst.

      3 Het gerecht behandelt het klaagschrift in het openbaar.

      4 Tijdens de behandeling van het klaagschrift worden de klager en de officier van justitie in de gelegenheid
      gesteld te worden gehoord. Het gerecht doet tevens de verdachte, gewezen verdachte of veroordeelde oproepen ten
      einde hem in de gelegenheid te stellen te worden gehoord. Deze kan zich doen bijstaan door een advocaat of een
      daartoe bij bijzondere volmacht gemachtigde welke in de gelegenheid wordt gesteld de nodige opmerkingen te maken.
      De beschikking van het gerecht is met redenen omkleed en wordt in het openbaar uitgesproken. Aan de klager en de
      verdachte, gewezen verdachte of veroordeelde die voor de behandeling is verschenen wordt door de griffie tijdig te
      voren schriftelijk mededeling gedaan van de dag der uitspraak. Acht dit gerecht het beklag gegrond, dan verklaart
      het de voorwaarden, onderscheidenlijk de schikking, bedoeld in het eerste lid, vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel503b
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel150a
    references:
      - id: ref1
