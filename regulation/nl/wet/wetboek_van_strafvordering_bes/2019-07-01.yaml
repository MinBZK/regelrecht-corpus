        bwb_id: BWBR0028681
        artikel: '457'
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '461'
  - number: '468'
    text: |-
      1 Het rechtsgeding in de verwezen zaak of zaken wordt bij het Hof gevoerd met overeenkomstige toepassing van de
      [artikelen 299, eerste, tweede en vierde lid][ref1], [300][ref2], [301][ref3] en van de bepalingen betreffende
      de behandeling ter terechtzitting in hoger beroep, met dien verstande dat [artikel 354][ref4] buiten toepassing
      blijft.

      2 In de gevallen voorzien bij de [artikelen 359][ref5] en [391][ref6] wordt het onderzoek gevoerd door een daartoe
      door het Hof aangewezen rechter-commissaris, die nog geen onderzoek in de zaak heeft verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel299
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel300
