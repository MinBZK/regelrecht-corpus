  - number: '368'
    text: |-
      1 Indien buiten het geval van [artikel 308][ref1] of van [artikel 366][ref2] de verdachte tegen wie verstek is
      verleend, gedurende het onderzoek op de terechtzitting verschijnt of zich in de gevallen, bij wettelijke regeling
      toegelaten, door een gemachtigde laat vertegenwoordigen, kan het Hof het verstek vervallen verklaren. In dat geval
      wordt het onderzoek opnieuw aangevangen, hetzij dadelijk, hetzij op een nader te bepalen terechtzitting.

      2 Het tweede lid van [artikel 365][ref3] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel308
