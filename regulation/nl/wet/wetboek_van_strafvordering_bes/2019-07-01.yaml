  - number: '63'
    text: |-
      1 Indien het bevel, bedoeld in [artikel 62, eerste lid][ref1], niet is verleend, wordt een verdachte van een
      misdrijf, van wiens onvermogen voldoende is gebleken, op diens verzoek een raadsman toegevoegd, zodra de vervolging
      tegen hem is aangevangen. De verdachte kan aan het verzoek niet het recht ontlenen de zaak op te houden.

      2 Het eerste lid is tevens van toepassing in hoger beroep.

      3 Bij algemene maatregel van bestuur kunnen nadere regels worden gegeven omtrent de wijze waarop het onvermogen
      moet worden gestaafd.

      4 Omtrent zijn bevoegdheid om toevoeging van een raadsman te verzoeken wordt de verdachte van misdrijf ingelicht
      op de voet van [artikel 82][ref2]. Echter geschiedt de mededeling in geval van aantekening van hoger beroep door
      de griffier van het gerecht, dat vonnis heeft gewezen. Indien de verdachte, anders dan krachtens een bevel tot
      inverzekeringstelling, rechtens zijn vrijheid is ontnomen, wordt het verzoek onverwijld door de officier van
      justitie ter kennis gebracht van de instantie die met de toevoeging is belast.

      5 Indien het vermoeden bestaat dat bij de verdachte van misdrijf gebrekkige ontwikkeling of ziekelijke storing
      van de geestvermogens aanwezig is en dat hij ten gevolge daarvan niet in staat is zijn belangen behoorlijk te
      behartigen, wordt hem, indien hij nog geen raadsman heeft en een vervolging ter zake van het misdrijf tegen hem is
      aangevangen, tijdens het voorbereidend onderzoek door de rechter-commissaris ambtshalve een raadsman toegevoegd.

      6 De in het vierde lid bedoelde inlichtingen en kennisgevingen geschieden overeenkomstig bij of krachtens algemene
      maatregel van bestuur vast te stellen bepalingen. Daarbij worden tevens voorschriften gegeven omtrent de wijze
      waarop het verzoek om toevoeging behoort te worden gedaan.


