      1 Het vonnis wordt in eerste aanleg op straffe van nietigheid door de rechter in een openbare zitting uitgesproken
      in tegenwoordigheid van de officier van justitie en de griffier.

      2 In hoger beroep geschiedt de uitspraak op straffe van nietigheid in een openbare zitting van het Hof, zoveel
      mogelijk samengesteld uit drie leden, in tegenwoordigheid van de procureur-generaal en van de griffier.

      De uitspraak geschiedt zo mogelijk door de voorzitter of door een van de rechters die over de zaak heeft
      geoordeeld.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel407
  - number: '408'
    text: |-
      1 De verdachte die zich ter zake van het ter terechtzitting onderzochte feit in voorlopige hechtenis bevindt, is
      bij de uitspraak tegenwoordig, tenzij hij daartoe buiten staat is of hij mondeling of schriftelijk te kennen heeft
      gegeven weg te willen blijven.

      2 Is zodanige verdachte tot het bijwonen van de uitspraak buiten staat, dan wordt ten spoedigste het vonnis hem ter
      plaatse waar hij wordt gevangengehouden, door de griffier voorgelezen, met de kennisgeving in [artikel 409][ref1]
      voor de voorzitter voorgeschreven. Van een en ander wordt door de griffier op het vonnis melding gemaakt.

      3 Indien de verdachte gevangen wordt gehouden in een ander eilandgebied dan dat waar het rechtsgeding heeft
      plaatsgevonden, kan de voorlezing bedoeld in het tweede lid geschieden door de griffier in het eilandgebied waar de
      verdachte wordt gevangengehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel409
