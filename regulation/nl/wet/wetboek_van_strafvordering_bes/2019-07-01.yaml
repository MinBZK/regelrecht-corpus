        artikel: '98'
        afdeling: Tweede
  - number: '286'
    text: |-
      Strafbare feiten die op dezelfde terechtzitting worden aangebracht en waartussen verband bestaat of die door
      dezelfde persoon zijn begaan, worden gevoegd aan de kennisneming van de rechter onderworpen, indien dit in het
      belang van het onderzoek is.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel286
  - number: '287'
    text: |-
      1 De officier van justitie is bevoegd getuigen en deskundigen ter terechtzitting te doen dagvaarden.

      2 Bij de dagvaarding van de verdachte worden voor zover mogelijk opgegeven de namen, het beroep en de woon- of
      verblijfplaats, of, bij onbekendheid van een of ander, de aanduiding, zo nauwkeurig mogelijk, van de getuigen en
      deskundigen, die vanwege de officier van justitie zullen worden gedagvaard.

      3 De verdachte wordt daarbij kenbaar gemaakt dat hij het recht heeft getuigen en deskundigen te doen dagvaarden
      of op de terechtzitting mee te brengen; hij wordt daarbij tevens opmerkzaam gemaakt op de voorschriften van de
      [artikelen 289, eerste en tweede lid][ref1], [293][ref2] en [308, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel289
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel293
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel308
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel287
