      1 Een toevoeging heeft slechts plaats, indien de verdachte geen raadsman heeft.

      2 Elke toevoeging geldt zowel voor de eerste aanleg als voor het hoger beroep. Hierbij wordt het voorbereidend
      onderzoek geacht deel uit te maken van de eerste aanleg.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel64
  - number: '65'
    text: |-
      1 Bij verhindering of ontstentenis van de toegevoegde raadsman wordt de verdachte een andere raadsman toegevoegd.
      De toegevoegde raadsman geeft van zijn verhindering of ontstentenis kennis aan de instantie die met de toevoeging
      is belast.

      2 Op verzoek van de toegevoegde raadsman of van de verdachte kan een andere raadsman worden toegevoegd. Indien de
      verdachte rechtens zijn vrijheid is ontnomen, wordt diens verzoek door de officier van justitie zo spoedig mogelijk
      ter kennis gebracht van de instantie die met de toevoeging is belast.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel65
  - number: '66'
    text: |-
      De toegevoegde raadsman kan de waarneming van bepaalde verrichtingen namens hem door een andere advocaat doen
      geschieden, mits hij of die ander daarvan schriftelijk kennis geeft aan de officier van justitie en, voor zover
      nodig, aan de hulpofficier van justitie tijdens het voorbereidend onderzoek of, indien de zaak ter terechtzitting
      aanhangig is gemaakt, aan de bevoegde rechter.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel66
  - number: '67'
    text: |-
      1 De verdachte kan tijdens het voorbereidend onderzoek de rechter-commissaris of, indien de zaak ter terechtzitting
      aanhangig is gemaakt, de bevoegde rechter om toevoeging van een raadsman verzoeken:

      a. indien hij binnen vierentwintig uren na het tijdstip waarop ingevolge [artikel 62][ref1] toevoeging had moeten
      plaatshebben, nog geen raadsman heeft;

      b. indien zijn verzoek als bedoeld in de [artikelen 63, eerste en tweede lid][ref2], en [65, tweede lid][ref3],
      niet is ingewilligd;

      c. indien hem bij verhindering of ontstentenis van de toegevoegde raadsman geen andere raadsman is toegevoegd;

      d. indien de toevoeging op grond van [artikel 61, derde lid][ref4], is beëindigd.

      2 Op het verzoek, bedoeld in het eerste lid, wordt zo spoedig mogelijk beslist. De verdachte wordt, tenzij het
      verzoek aanstonds wordt ingewilligd, op het verzoek gehoord.


