  - number: 177j
    text: |-
      Bij ministeriële regeling kunnen personen in de openbare dienst van de andere landen van het Koninkrijk of van een
      vreemde staat die voldoen aan in de algemene maatregel van bestuur te stellen eisen voor de toepassing van daarin
      aan te wijzen bevoegdheden met een opsporingsambtenaar gelijk worden gesteld.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel177j
  - number: 177k
    text: |-
      1 De officier van justitie voegt de processen-verbaal en andere voorwerpen waaraan gegevens kunnen worden
      ontleend die zijn verkregen door de uitoefening van een van de bevoegdheden genoemd in de [titels XVIII][ref1] en
      [XIX][ref2], voor zover die voor het onderzoek in de zaak van enige betekenis zijn, bij de processtukken.

      2 Voor zover de processen-verbaal of andere voorwerpen mededelingen behelzen gedaan door of aan een persoon
      die zich op grond van [artikel 252][ref3] zou kunnen verschonen indien hem als getuige naar de inhoud van die
      mededelingen zou worden gevraagd, worden deze processen-verbaal en andere voorwerpen onverwijld vernietigd.

      3 Onverminderd [artikel 53][ref4], vindt de voeging bij de processtukken plaats zodra het onderzoek dat toelaat.

      4 Indien geen processen-verbaal van de uitoefening van één van de bevoegdheden, bedoeld in de [titels XVIII][ref5]
      en [XIX][ref6], bij de processtukken zijn gevoegd, wordt van het gebruik van deze bevoegdheid in de processtukken
      melding gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0028681
