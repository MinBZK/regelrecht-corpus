        artikel: '150'
        afdeling: Zevende
  - number: '649'
    text: |-
      1 Indien de zaak eindigt zonder oplegging van straf of maatregel, maar niet indien de gewezen verdachte is schuldig
      verklaard zonder oplegging van enige straf of maatregel, wordt aan de gewezen verdachte of zijn erfgenamen uit 's
      Rijks kas een vergoeding toegekend voor zijn ten behoeve van het onderzoek en de behandeling van de zaak gemaakte
      reis- en verblijfkosten, berekend op de voet van het bij en krachtens Besluit tarief justitiekosten strafzaken
      bepaalde.

      2 Indien de zaak eindigt zonder oplegging van straf of maatregel, maar niet indien de gewezen verdachte is
      schuldig verklaard zonder oplegging van enige straf of maatregel, kan aan de gewezen verdachte of zijn erfgenamen
      uit 's Rijks kas een vergoeding worden toegekend voor de schade, die hij ten gevolge van hem niet toe te rekenen
      tijdverzuim door het voorbereidend vooronderzoek en de behandeling van de zaak ter terechtzitting werkelijk
      heeft geleden, alsmede in de kosten van een raadsman. Een vergoeding voor de kosten van een raadsman gedurende
      de verzekering en de voorlopige hechtenis is hierin begrepen. Een vergoeding voor deze kosten kan voorts worden
      toegekend in het geval dat de zaak eindigt met oplegging van straf of maatregel op grond van een feit, waarvoor
      voorlopige hechtenis niet is toegelaten.

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing voor ouders van een minderjarige verdachte, die zijn
      opgeroepen ingevolge [artikel 489, eerste lid][ref1].

      4 De [artikelen 178, vijfde lid][ref2], en [648 tweede tot en met vierde lid][ref3], zijn van overeenkomstige
      toepassing.

      5 Indien de gewezen verdachte na het indienen van zijn verzoek overleden is, geschiedt de toekenning ten behoeve
      van zijn erfgenamen.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel489
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel178
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel648
