    text: |-
      Indien tot tenuitvoerlegging van vervangende hechtenis moet worden overgegaan doet de procureur-
      generaal met het oog daarop een vordering overeenkomstig [artikel 583][ref1], tenzij het Hof krachtens
      [artikel 592b, vijfde lid][ref2], de duur van de vervangende hechtenis reeds heeft bepaald.


