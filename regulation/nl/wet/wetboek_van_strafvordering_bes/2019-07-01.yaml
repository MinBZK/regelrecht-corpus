        bwb_id: BWBR0028681
        artikel: '155'
  - number: '125'
    text: |-
      1 Bij personen met bevoegdheid tot verschoning, als bedoeld bij [artikel 252][ref1], worden, tenzij met hun
      toestemming, niet in beslag genomen brieven of andere geschriften, waartoe hun plicht tot geheimhouding zich
      uitstrekt.

      2 Geschiedt bij zodanige personen huiszoeking, dan vindt zij, tenzij met hun toestemming, alleen plaats, voor
      zover zij zonder schending van het stands-, beroeps- of ambtsgeheim kan geschieden, en strekt zij zich niet uit
      tot brieven of andere geschriften die niet het voorwerp van het strafbare feit uitmaken of tot het begaan daarvan
      gediend hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel252
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '252'
        afdeling: Vierde
  - number: '126'
    text: |-
      1 Tenzij het belang van het onderzoek dit dringend vordert, wordt tot inbeslagneming in een woning niet overgegaan
      dan nadat de bewoner of, indien hij afwezig is, een van zijn aanwezige huisgenoten is gehoord en vruchteloos
      uitgenodigd de voorwerpen vrijwillig af te geven ter inbeslagneming.

      2 Voor zover het belang van het onderzoek zich daartegen niet verzet, stelt de opsporende ambtenaar de bewoner
      of, indien deze afwezig is, een van zijn aanwezige huisgenoten in de gelegenheid, zich omtrent de ter plaatse
      aangetroffen en voor inbeslagneming vatbare voorwerpen te verklaren. Hetzelfde geldt ten aanzien van de verdachte,
      indien deze tegenwoordig is.

      3 De verdachte is bevoegd zich tijdens een huiszoeking door zijn raadsman te doen bijstaan, zonder dat het
      onderzoek daardoor mag worden opgehouden.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel126
  - number: '127'
    text: |-
      1 In geval van ontdekking op heterdaad of van een misdrijf waarvoor voorlopige hechtenis is toegelaten, kan de
      officier van justitie, in afwachting van het optreden van de rechter-commissaris, bij dringende noodzakelijkheid
      ter inbeslagneming de uitlevering tegen ontvangstbewijs bevelen van de pakketten, brieven, stukken en andere
      berichten, die aan de post, de telegrafie of aan een andere instelling van vervoer zijn toevertrouwd; een en ander
      voor zover zij klaarblijkelijk voor de verdachte bestemd of van hem afkomstig zijn.

      2 Ieder die ten behoeve van dat vervoer zodanige zaken onder zich heeft of krijgt, geeft dienaangaande aan de
      officier van justitie of aan de hulpofficier op diens vordering de door deze gewenste inlichtingen.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel127
  - number: '128'
    text: |-
      1 De officier van justitie geeft inbeslaggenomen pakketten, brieven, stukken en andere berichten, die aan de post,
      de telegrafie of aan een andere instelling van vervoer waren toevertrouwd en waarvan de inbeslagneming niet wordt
      gehandhaafd, onverwijld aan de vervoerder ter verzending terug.

      2 Tot kennisneming van de inhoud van de overige zaken, voor zover deze gesloten zijn, gaat de officier van justitie
      niet over dan na daartoe door de rechter-commissaris te zijn gemachtigd.Wordt de machtiging niet verleend, dan
      geeft de officier van justitie de inbeslaggehouden zaken onverwijld aan de vervoerder ter verzending terug.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel128
  - number: '129'
    text: |-
      1 Blijken de zaken na opening van belang voor het onderzoek, dan voegt de officier van justitie deze bij de
      processtukken of de stukken van overtuiging. In het tegenovergestelde geval worden zij, na door de officier van
      justitie te zijn gesloten, door deze onverwijld naar hun bestemming verzonden.

      2 Voor zover het belang van het onderzoek dit niet verbiedt, worden zij vooraf door de hulpofficier van justitie
      gewaarmerkt.

      3 De inhoud van de door de officier van justitie geopende zaken, voor zover deze niet bij de processtukken of de
      stukken van overtuiging zijn gevoegd, wordt door hem geheim gehouden. Gelijke geheimhouding wordt door hem en door
      de hulpofficier van justitie in acht genomen ter zake van de inlichtingen, in [artikel 127, tweede lid][ref1],
      vermeld, voor zover daarvan niet uit de processtukken blijkt.

      4 Van de inbeslagneming, de teruggave, de opening en de verzending wordt door de officier van justitie proces-
      verbaal opgemaakt, dat bij de processtukken wordt gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel127
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '127'
        afdeling: Tweede
  - number: 129a
    text: |-
      1 Beslag op grond van [artikel 119a][ref1] kan slechts worden gelegd of gehandhaafd krachtens schriftelijke
      machtiging op vordering van de officier van justitie te verlenen door de rechter-commissaris.

      2 De machtiging wordt door de officier van justitie zo spoedig mogelijk aan de verdachte of de veroordeelde, en zo
      het beslag onder een derde is gelegd, ook aan deze betekend.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel119a
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel129a
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: 119a
        afdeling: Eerste
  - number: '130'
    text: |-
      1 De rechter-commissaris is tot inbeslagneming van alle daarvoor vatbare voorwerpen bevoegd.

      2 [Artikel 125, eerste lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel125
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel130
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '125'
        afdeling: Tweede
  - number: '131'
    text: |-
      1 De rechter-commissaris kan bevelen dat hij, die redelijkerwijze moet worden vermoed houder te zijn van enig
      bepaald voor inbeslagneming vatbaar voorwerp, dit ter inbeslagneming aan hem zal uitleveren of op de griffie van
      het gerecht in eerste aanleg overbrengen, een en ander binnen de termijn en op de wijze bij het bevel te bepalen.

      2 Het bevel wordt mondeling of schriftelijk gegeven. In het laatste geval wordt het betekend.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel131
  - number: '132'
    text: |-
      1 Ieder tot wie het bevel wordt gericht, is verplicht daaraan te voldoen.

      2 Niettemin bestaan geldige redenen van weigering op grond van bevoegdheid tot verschoning voor:

      a. de personen, bedoeld bij [artikel 251][ref1];

      b. de personen, bedoeld bij [artikel 252][ref2], voor zover de uitlevering of overbrenging met hun plicht tot
      geheimhouding in strijd zou zijn;

      c. de personen, bedoeld bij [artikel 253][ref3], voor zover de uitlevering of overbrenging hen of een van hun
      daarin genoemde betrekkingen aan het gevaar van een strafrechtelijke vervolging zou blootstellen.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel251
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel252
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel253
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel132
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '251'
        afdeling: Vierde
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '252'
        afdeling: Vierde
      - id: ref3
        bwb_id: BWBR0028681
        artikel: '253'
        afdeling: Vierde
  - number: '133'
    text: |-
      1 Het bevel tot uitlevering of overbrenging wordt niet gegeven aan de verdachte.

      2 Ten aanzien van brieven of andere geschriften kan het bevel alleen worden gegeven, indien deze van de verdachte
      afkomstig zijn, voor hem zijn bestemd of hem toebehoren, of wel indien zij het voorwerp van het strafbare feit
      uitmaken of tot het begaan daarvan gediend hebben.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel133
  - number: '134'
    text: |-
      1 De rechter-commissaris kan op het verzoek van de belanghebbende bevelen dat deze door de griffier kosteloos een
      gewaarmerkt afschrift van de uitgeleverde of overgebrachte brieven of geschriften zal worden gegeven.

      2 Betreft het een authentiek stuk onder bewaring van een openbare bewaarder, dan kan het afschrift in de plaats van
      het oorspronkelijke stuk strekken, zolang dit niet is terug ontvangen.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel134
  - number: '135'
    text: |-
      Indien het over te brengen stuk een gedeelte uitmaakt van een register, waarvan het niet kan worden afgescheiden,
      kan de rechter-commissaris bevelen dat het register, voor de tijd bij het bevel te bepalen, ter inzage zal worden
      overgebracht of aan hem zal worden uitgeleverd ten einde afschriften van het geheel of een gedeelte daarvan te
      doen vervaardigen.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel135
  - number: '136'
    text: |-
      1 Buiten het geval van huiszoeking, kan de officier van justitie of de rechter-commissaris op de vordering van de
      officier van justitie, ter inbeslagneming op elke plaats een onderzoek instellen.

      2 Zij kunnen zich daarbij doen vergezellen van bepaalde door hen aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel136
  - number: '137'
    text: |-
      De rechter-commissaris is na een met redenen omklede vordering van de officier van justitie bevoegd huiszoeking ter
      inbeslagneming te doen en daarbij de te onderzoeken plaatsen te betreden.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel137
  - number: '138'
    text: |-
      1 Huiszoeking geschiedt, zoveel mogelijk in tegenwoordigheid van de officier van justitie, door of onder leiding
      van de rechter-commissaris. [Artikel 136, tweede lid][ref1], is van toepassing.

      2 Ingeval de huiszoeking moet geschieden in een ander eilandgebied doet de rechter-commissaris een daartoe
      strekkend verzoek aan zijn ambtgenoot in dat andere eilandgebied.

      3 [Artikel 126][ref2] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel136
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel126
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '136'
        afdeling: Derde
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '126'
        afdeling: Tweede
  - number: '139'
    text: |-
      1 De huiszoeking kan zich, indien dat voor het onderzoek strikt noodzakelijk is, uitstrekken tot de inbeslagneming
      van alle daarvoor vatbare voorwerpen.

      2 [Artikel 125, eerste lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel125
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel139
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '125'
        afdeling: Tweede
  - number: '140'
    text: |-
      1 De [artikelen 127 tot en met 129][ref1] vinden ten aanzien van de rechter-commissaris overeenkomstige toepassing;
      de bemoeienissen van de officier van justitie, bij de artikelen 128 en 129 vermeld, worden bij het optreden van de
      rechter-commissaris door deze zo spoedig mogelijk overgenomen en voortgezet.

      2 De rechter-commissaris is bevoegd te bepalen dat van de inhoud van inbeslaggenomen gesloten pakketten,
      brieven, stukken en andere berichten, die aan de post, de telegrafie of een andere instelling van vervoer waren
      toevertrouwd, zal worden kennis genomen, voor zover zij klaarblijkelijk voor de verdachte bestemd of van hem
      afkomstig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel127
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel140
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '127'
        afdeling: Tweede
  - number: '141'
    text: |-
      1 Inbeslaggenomen voorwerpen worden zoveel mogelijk gesloten en verzegeld in een omslag waarop een mededeling van
      de dag van de inbeslagneming en een vermelding van degene bij wie zij zijn inbeslaggenomen, met een korte opgave
      van de inhoud, wordt gesteld en ondertekend. Indien de voorwerpen niet geschikt zijn om in een omslag te worden
      gesloten, wordt daaraan een strook gehecht, waarop gelijke mededeling en vermelding met een korte aanduiding van
      het voorwerp wordt gesteld en ondertekend. Kan aan een of ander niet worden voldaan, dan worden de voorwerpen
      zoveel mogelijk gewaarmerkt. Zoveel mogelijk wordt aan degene bij wie zij zijn inbeslaggenomen, een bewijs van
      ontvangst afgegeven.

      2 De inbeslaggenomen voorwerpen waarvan de bewaring noodzakelijk wordt geacht, worden, zodra het belang van het
      onderzoek het toelaat, gesteld onder de hoede van een bij algemene maatregel van bestuur aangewezen bewaarder.

      3 Inbeslaggenomen voorwerpen kunnen ook aan een andere door het openbaar ministerie aangewezen bewaarder in
      gerechtelijke bewaring worden gegeven, indien dit voor het behoud, de bestemming of de beveiliging van deze
      voorwerpen redelijkerwijs noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel141
  - number: '142'
    text: |-
      1 De voorwerpen worden niet vervreemd, vernietigd, prijsgegeven of tot een ander doel dan het onderzoek bestemd,
      tenzij na verkregen machtiging.

      2 Indien de voorwerpen niet geschikt zijn voor opslag, of dit hoogst ongewenst wordt geacht, kan de machtiging door
      het openbaar ministerie worden verleend aan de bewaarder, dan wel aan de ambtenaar die de voorwerpen in afwachting
      van hun vervoer naar de bewaarder onder zich heeft.

      3 Indien de voorwerpen niet geschikt zijn voor opslag gedurende langere tijd, of dit hoogst ongewenst wordt geacht,
      kan het gerecht in feitelijke aanleg waarvoor de zaak wordt vervolgd of anders het laatst werd vervolgd, op de
      vordering van het openbaar ministerie, de machtiging aan de bewaarder verlenen.

      4 Dit artikel blijft, voor zover teruggave van voorwerpen in de zin van [artikel 144][ref1] mogelijk is, buiten
      toepassing, behoudens in het geval dat de rechthebbende afstand heeft gedaan.

      5 Gelden en geldswaarden worden gestort in de consignatiekas dan wel op een daartoe bestemde rekening van de Staat.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel144
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel142
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '144'
        afdeling: Vijfde
  - number: '143'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld omtrent de wijze, waarop de inbeslaggenomen voorwerpen
      worden bewaard en ter beschikking van het onderzoek gehouden, dan wel, ingevolge [artikel 142][ref1], worden
      vervreemd, vernietigd, prijsgegeven of tot een ander doel dan het onderzoek bestemd.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel142
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel143
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '142'
        afdeling: Vierde
  - number: '144'
    text: |-
      1 Zodra het belang van de strafvordering zich niet meer verzet tegen de teruggave van een inbeslaggenomen
      voorwerp, doet het openbaar ministerie dit door de bewaarder teruggeven aan degene, aan wie het door het
      strafbare feit is onttrokken. Is deze niet bekend, dan wordt het voorwerp teruggegeven aan degene bij wie het is
      inbeslaggenomen, tenzij deze het voorwerp onrechtmatig in zijn bezit heeft gekregen. In het laatste geval wordt
      het voorwerp teruggegeven aan de degene aan wie teruggave van het voorwerp op het eerste gezicht redelijk en
      maatschappelijk niet onverantwoord is. Is deze niet bekend, dan wordt met het voorwerp gehandeld overeenkomstig
      [artikel 142][ref1].

      2 Een verplichting tot teruggave bestaat niet ten aanzien van voorwerpen, waarvan de rechthebbende schriftelijk
      heeft verklaard afstand te doen. Met betrekking tot deze voorwerpen kan, ook indien zij geschikt zijn voor opslag,
      een machtiging worden verleend als bedoeld in [artikel 142, tweede lid][ref2]; voor het overige wordt daarmee
      gehandeld als met verbeurdverklaarde voorwerpen.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel142
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel142
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel144
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '142'
        afdeling: Vierde
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '142'
        afdeling: Vierde
  - number: '145'
    text: |-
      1 Een last tot teruggave van een inbeslaggenomen voorwerp dat in bewaring is gegeven is gericht tot de bewaarder.

      2 Indien deze aan de last niet kan voldoen, omdat het voorwerp op wettige wijze vervreemd, vernietigd, prijsgegeven
      of tot een ander doel dan het onderzoek bestemd is, gaat hij na daartoe verkregen machtiging van het gerecht,
      bedoeld in [artikel 142, derde lid][ref1], over tot uitbetaling van de prijs, die het voorwerp bij verkoop door hem
      redelijkerwijze had moeten opbrengen.

      3 Indien de bewaarder, buiten de gevallen in het tweede lid bedoeld, niet in staat is aan de last tot teruggave
      te voldoen dan wel het geven van zodanige last niet mogelijk bleek, houdt hij het voorwerp ter beschikking van
      de rechthebbende totdat sedert de last tot teruggave zes maanden, onderscheidenlijk sedert de inbeslagneming drie
      jaren, zijn verstreken. Is teruggave alsdan nog niet mogelijk gebleken dan wordt met het voorwerp gehandeld als met
      verbeurdverklaarde voorwerpen.

      4 De bewaarder geeft het voorwerp niet terug zolang er een beslag op rust, door een derde onder hem gelegd
      ingevolge het [Wetboek van Burgerlijke Rechtsvordering BES][ref2] tenzij degene door wie de last tot teruggave is
      gegeven uitdrukkelijk anders bepaalt


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel142
      [ref2]: https://wetten.overheid.nl/BWBR0028496
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel145
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '142'
        afdeling: Vierde
      - id: ref2
        bwb_id: BWBR0028496
  - number: 145a
    text: |-
      Het openbaar ministerie kan op verzoek van de beslagene of van een andere belanghebbende een voorwerp dat op grond
      van [artikel 119a][ref1] in beslag is genomen onder zekerheidstelling doen teruggeven. De zekerheid bestaat in de
      storting van geldswaarden door de beslagene of een derde, of in de verbintenis van een derde als waarborg, voor een
      bedrag en op een wijze als door het openbaar ministerie wordt aanvaard.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel119a
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel145a
