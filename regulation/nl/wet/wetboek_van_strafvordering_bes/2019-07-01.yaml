        artikel: 177h
  - number: 177n
    text: |-
      1 De officier van justitie kan in het belang van het onderzoek bevelen dat een opsporingsambtenaar goederen afneemt
      van of gegevens, die zijn opgeslagen of worden verwerkt of overgedragen door middel van een geautomatiseerd werk,
      door tussenkomst van een aanbieder van een communicatiedienst afneemt van of diensten verleent aan een persoon in
      het geval dat:

      a. die persoon verdacht wordt van een misdrijf waarvoor voorlopige hechtenis is toegelaten;

      b. er aanwijzingen zijn van een terroristisch misdrijf.

      2 De opsporingsambtenaar brengt bij de uitoefening van het bevel een ander niet tot strafbare feiten dan waarop
      diens opzet reeds tevoren was gericht.

      3 Het bevel tot pseudo-koop of -dienstverlening vermeldt, behalve de gegevens, bedoeld in [artikel 177h][ref1],
      tevens, de aard van de goederen, gegevens of diensten.

      4 Toepassing van het eerste lid vindt alleen plaats na voorafgaande schriftelijke toestemming van de procureur-
      generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel177h
