  - number: '124'
    text: |-
      De opsporingsambtenaren hebben te allen tijde vrije toegang tot alle lokaliteiten en
      alle plaatsen, waarvan redelijkerwijze kan worden vermoed, dat zij door een goud- of
      zilversmid, kashouder, horlogemaker, rijwiel- of autohandelaar, uitdrager, opkoper of
      tagrijn worden gebruikt. [Artikel 95bis van het Wetboek van Strafrecht BES][ref1], zomede de
      [artikelen 155 tot en met 164 van dit wetboek][ref2] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel95bis
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel155
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel124
