  - number: '75'
    text: |-
      De hulpofficier voor wie de verdachte wordt geleid, geeft van de aanhouding uiterlijk binnen vierentwintig uren
      schriftelijk of mondeling kennis aan de officier van justitie.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel75
  - number: '76'
    text: |-
      1 In geval van ontdekking op heterdaad van een misdrijf kan ieder, ter aanhouding van de verdachte, elke plaats
      betreden, met uitzondering van een woning tot het binnentreden waarvan de bewoner geen uitdrukkelijke toestemming
      heeft gegeven, en van de plaatsen in [artikel 164][ref1] genoemd, op de tijden in dat artikel aangegeven.

      2 Zowel in geval van ontdekking op heterdaad als buiten dat geval kan iedere opsporingsambtenaar, ter aanhouding
      van de verdachte, elke plaats betreden. De [artikelen 155 tot en met 164][ref2] zijn van toepassing.

      3 Een opsporingsambtenaar die overeenkomstig het tweede lid een plaats heeft betreden, kan in afwachting van
      de komst van de ambtenaar die bevoegd is ter aanhouding de plaats te doorzoeken, de maatregelen nemen, die
      redelijkerwijze nodig zijn om te voorkomen, dat de verdachte zich aan zijn aanhouding onttrekt.


