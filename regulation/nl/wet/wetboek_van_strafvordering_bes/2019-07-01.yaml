  - number: 177u
    text: |-
      1 Teneinde toepassing te kunnen geven aan [artikel 177r][ref1] of [artikel 177s][ref2] kan de officier van justitie
      bevelen dat met behulp van bij ministeriële regeling omschreven apparatuur het nummer, waarmee een gebruiker van
      een communicatiedienst kan worden geïdentificeerd, wordt verkregen.

      2 Het bevel wordt gegeven aan een ambtenaar aan te wijzen door Onze Minister van Justitie.

      3 Het bevel wordt gegeven voor een periode van ten hoogste één week en vermeldt:

      a. de feiten of omstandigheden waaruit blijkt dat voldaan is aan de voorwaarden voor toepassing van
      [artikel 177r][ref3] of artikel [177s][ref4] en

      b. de naam of een zo nauwkeurig mogelijke aanduiding van de gebruiker van een communicatiedienst van wie het nummer
      moet worden verkregen.

      4 De officier van justitie doet te zijnen overstaan de processen-verbaal of andere voorwerpen, waaraan een gegeven
      kan worden ontleend dat is verkregen door toepassing van het eerste lid vernietigen indien dat gegeven niet
      gebruikt wordt voor de toepassing van [artikel 177r][ref5] of artikel [177s][ref6].


