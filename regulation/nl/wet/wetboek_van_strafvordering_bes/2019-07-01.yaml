      - id: ref1
        bwb_id: BWBR0028681
        artikel: '575'
        paragraaf: A
        afdeling: Tweede
  - number: 579a
    text: |-
      1 Naar aanleiding van een op een verdrag gegrond verzoek van een vreemde staat kan in de openbare lichamen
      Bonaire, Sint Eustatius en Saba een strafrechtelijk financieel onderzoek worden ingesteld, overeenkomstig de
      bepalingen van [Titel XVI van het derde Boek][ref1], gericht op de bepaling van hier te lande aanwezig of verworven
      wederrechtelijk verkregen voordeel door een persoon die in de verzoekende staat aan strafrechtelijk onderzoek is
      onderworpen.

      2 Het strafrechtelijk financieel onderzoek kan slechts worden ingesteld, indien zulks ook mogelijk zou zijn geweest
      wanneer het feit of de feiten ter zake waarvan de persoon in de verzoekende staat wordt verdacht in de openbare
      lichamen Bonaire, Sint Eustatius en Saba zouden zijn begaan.

      3 Tijdens het strafrechtelijk financieel onderzoek kan inbeslagneming van voorwerpen overeenkomstig
      [artikel 119, tweede lid][ref2], en [artikel 119a, tweede lid][ref3], slechts plaatsvinden, indien gegronde redenen
      bestaan voor de verwachting dat ten aanzien van die voorwerpen vanwege de verzoekende vreemde staat een verzoek
      tot tenuitvoerlegging van een verbeurdverklaring of van een tot ontneming van wederrechtelijk verkregen voordeel
      strekkende sanctie zal worden gedaan.

      4 De officier van justitie zendt van zijn beschikking tot sluiting van een strafrechtelijk financieel onderzoek
      onverwijld een afschrift door tussenkomst van de procureur-generaal aan Onze Minister. Daarbij doet hij tevens
      mededeling van alle voor de verzoekende vreemde staat dienstige inlichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0028681
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel119
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel119a
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel579a
