  - number: '429'
    text: |-
      1 Tegen een bij verstek gewezen vonnis, in eerste aanleg als einduitspraak gegeven, kan degene die daarbij niet van
      de gehele tenlastelegging is vrijgesproken, noch daaraan geheel of gedeeltelijk heeft voldaan, verzet doen:

      a. indien de dagvaarding om ter terechtzitting te verschijnen hem in persoon is betekend, gedurende veertien dagen
      na de uitspraak;

      b. in andere gevallen, uiterlijk veertien dagen nadat zich een omstandigheid heeft voorgedaan, waaruit voortvloeit
      dat het vonnis hem bekend is.

      2 Hoger beroep kan door de verdachte niet worden ingesteld tegen een vonnis, waartegen hij verzet kan doen. Hoger
      beroep, ingesteld door de officier van justitie, vervalt op het moment dat de verdachte verzet doet.

      3 Is in het geval, bedoeld in het eerste lid, onderdeel a, het onderzoek op de terechtzitting voor onbepaalde
      tijd geschorst en de oproeping om op de nadere terechtzitting te verschijnen niet aan de verdachte in persoon
      betekend, dan kan, behoudens het geval dat de verdachte alsnog op de nadere zitting is verschenen, het verzet
      worden ingesteld uiterlijk veertien dagen nadat zich een omstandigheid heeft voorgedaan, waaruit voortvloeit dat
      het vonnis de verdachte bekend is.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel429
  - number: '430'
    text: |-
      1 Indien verzet is gedaan, doet de officier van justitie de verdachte de dag voor de behandeling van de zaak
      bepaald, ten minste zeven dagen voor die dag aanzeggen. Deze termijn kan met toestemming van de verdachte worden
      verkort, mits van die toestemming blijkt op de wijze bepaald in [artikel 290, tweede lid][ref1].

      2 Bij gebreke van het een of ander wordt door de rechter de aanzegging van een nieuwe rechtsdag bevolen, tenzij de
      verdachte is verschenen. In dit laatste geval wordt, indien de verdachte in het belang van zijn verdediging uitstel
      verzoekt, het onderzoek voor een bepaalde tijd geschorst.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel290
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel430
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '290'
  - number: '431'
    text: |-
      Heeft de benadeelde partij zich in het geding gevoegd, dan doet de officier van justitie haar van de dag van de
      terechtzitting schriftelijk mededeling.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel431
  - number: '432'
    text: |-
      1 Indien degene die in verzet is gekomen, niet op de dienende dag ter terechtzitting verschijnt, wordt het verzet
      vervallen verklaard en het bij verstek gewezen vonnis ten uitvoer gelegd of verder uitgevoerd, behoudens beroep in
      cassatie van het openbaar ministerie tegen het bij verstek gewezen vonnis.

      2 De rechter kan echter, bij niet-verschijning van de verdachte, met toepassing van [artikel 313][ref1], een of
      meermalen schorsing van het onderzoek bevelen ten einde deze, indien hij verhinderd was het onderzoek bij te wonen,
      daartoe alsnog in de gelegenheid te stellen. Verschijnt de verdachte niet op de nadere terechtzitting, dan is het
      voorgaande lid van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel313
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel432
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '313'
        afdeling: Tweede
  - number: '433'
    text: |-
      1 Indien degene die in verzet is gekomen, op de dienende dag ter terechtzitting verschijnt, wordt de zaak
      overeenkomstig de [Vierde][ref1] en [Vijfde Titel van het Vijfde Boek][ref2] behandeld, als ware het rechtsgeding
      bij verstek niet voorafgegaan. [Artikel 365, tweede lid][ref3], vindt, zowel ten aanzien van getuigen als van
      deskundigen, tijdens het rechtsgeding bij verstek verhoord, overeenkomstige toepassing.

      2 De rechter bekrachtigt de bij verstek gewezen uitspraak of doet met gehele of gedeeltelijke vernietiging van die
      uitspraak opnieuw recht.


      [ref1]: https://wetten.overheid.nl/BWBR0028681
      [ref2]: https://wetten.overheid.nl/BWBR0028681
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel356
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel433
    references:
      - id: ref1
        bwb_id: BWBR0028681
      - id: ref2
        bwb_id: BWBR0028681
      - id: ref3
        bwb_id: BWBR0028681
        artikel: '356'
        afdeling: Tweede
  - number: '434'
    text: |-
      Tegen de vonnissen door de rechter in eerste aanleg als einduitspraak of in de loop van het onderzoek op de
      terechtzitting gegeven, kan hoger beroep worden ingesteld door de officier van justitie en door de verdachte die
      niet van de gehele telastelegging is vrijgesproken. Zijn in eerste aanleg strafbare feiten gevoegd aan het oordeel
      van de rechter onderworpen, dan kan de verdachte alleen hoger beroep instellen ten aanzien van die gevoegde zaken,
      waarin hij niet van de gehele tenlastelegging is vrijgesproken.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel434
  - number: '435'
    text: |-
      Tegen de vonnissen die geen einduitspraken zijn, is het hoger beroep slechts gelijktijdig met dat tegen de
      einduitspraak toegelaten.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel435
  - number: '436'
    text: |-
      1 Het hoger beroep kan slechts tegen het vonnis in zijn geheel worden ingesteld.

      2 Zijn echter in eerste aanleg strafbare feiten gevoegd aan het oordeel van de rechter onderworpen, dan kan het
      hoger beroep tot het vonnis voor zover dit een of meer van de gevoegde zaken betreft, worden beperkt.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel436
  - number: '437'
    text: |-
      1 Het hoger beroep moet worden ingesteld:

      a. indien de dagvaarding om ter terechtzitting te verschijnen de verdachte in persoon is betekend of de verdachte
      ter terechtzitting is verschenen, binnen veertien dagen na de einduitspraak;

      b. in andere gevallen, uiterlijk veertien dagen nadat zich een omstandigheid heeft voorgedaan, waaruit voortvloeit
      dat het vonnis de verdachte bekend is.

      2 Is in het geval, bedoeld in het eerste lid, onderdeel a, het onderzoek op de terechtzitting voor onbepaalde tijd
      geschorst en de oproeping om op de nadere terechtzitting te verschijnen niet aan de verdachte in persoon betekend,
      dan kan, behoudens het geval dat de verdachte alsnog op de nadere zitting is verschenen, het hoger beroep worden
      ingesteld uiterlijk veertien dagen nadat zich een omstandigheid heeft voorgedaan, waaruit voortvloeit dat het
      vonnis de verdachte bekend is.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel437
  - number: '438'
    text: |-
      1 Nadat hoger beroep is ingesteld, zendt de griffier van het gerecht in eerste aanleg de stukken van het geding zo
      spoedig mogelijk aan de griffier van het Hof.

      2 Indien hoger beroep alleen door de officier van justitie is ingesteld, geschiedt de inzending niet of wordt aan
      haar, heeft zij ten onrechte plaatsgehad, op straffe van nietigheid van de behandeling van de zaak, geen gevolg
      gegeven, dan nadat het beroep aan de verdachte in persoon is betekend of zich enige andere omstandigheid heeft
      voorgedaan, waaruit voortvloeit dat het beroep hem bekend is.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel438
  - number: '439'
    text: |-
      Binnen veertien dagen na de instelling van het hoger beroep kan de partij die in beroep is gekomen bij de
      griffie van het Hof een schriftuur indienen, houdende de middelen en gronden, waarop zij haar beroep steunt. Deze
      schriftuur wordt bij de processtukken gevoegd.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel439
  - number: '440'
    text: |-
      1 De verdachte, die zich ter zake van het feit in voorlopige hechtenis bevindt in een ander eilandgebied dan waar
      het Hof zitting houdt, wordt, nadat hij zijn verklaring heeft afgelegd, of nadat de officier van justitie hoger
      beroep heeft ingesteld en de termijn voor het instellen van hoger beroep is verstreken, ten spoedigste overgebracht
      naar het eilandgebied waar het Hof zitting houdt.

      2 Het eerste lid is niet van toepassing, indien de verdachte behoort tot hen die in een bepaalde afdeling moeten
      worden ondergebracht, en een zodanige afdeling ontbreekt in het huis van bewaring van het eilandgebied waar het Hof
      zitting houdt.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel440
  - number: '441'
    text: |-
      Tegen beschikkingen staat hoger beroep niet open en is een bezwaarschrift niet toegelaten, dan in de gevallen bij
      dit wetboek bepaald.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel441
  - number: '442'
    text: |-
      Voor zover niet bijzondere bepalingen het recht van beroep van de officier van justitie regelen, kan hij van alle
      beschikkingen van de rechter in eerste aanleg of de rechter-commissaris, waarbij een krachtens dit wetboek gedane
      vordering niet is toegewezen, binnen drie dagen bij het Hof in hoger beroep komen.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel442
  - number: '443'
    text: |-
      1 De akte van hoger beroep en het bezwaarschrift behelzen, op straffe van niet-ontvankelijkheid, de gronden waarop
      deze berusten.

      2 De beschikking blijft van kracht niettegenstaande hoger beroep.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel443
  - number: '444'
    text: |-
      1 Het Hof zal het beroep of het bezwaarschrift afwijzen, of bevelen hetgeen overeenkomstig de bepalingen van de wet
      behoort of had behoren te geschieden.

      2 Indien het hoger beroep van of het bezwaarschrift tegen een handeling of beschikking van de rechter-commissaris
      gegrond wordt geoordeeld, kan bij de beslissing van het Hof voor het instellen of voortzetten van dat onderzoek een
      andere rechter-commissaris worden aangewezen.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel444
  - number: '445'
    text: |-
      1 Verzet wordt gedaan en hoger beroep ingesteld door een verklaring, af te leggen door degene die het rechtsmiddel
      aanwendt, op de griffie van het gerecht in eerste aanleg.

      2 Bezwaarschriften worden bij dezelfde griffie ingediend.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel445
  - number: '446'
    text: |-
      Het aanwenden van de rechtsmiddelen, bedoeld in [artikel 445][ref1], kan ook geschieden door:

      a. een advocaat, indien deze verklaart daartoe door degene die het middel aanwendt, bepaaldelijk te zijn
      gemachtigd;

      b. een bij bijzondere volmacht schriftelijk gemachtigde.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel445
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel446
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '445'
  - number: '447'
    text: |-
      1 Van iedere verklaring of indiening, als bedoeld in de [artikelen 445][ref1] en [446][ref2], maakt de griffier een
      akte op, die hij met degene, die de verklaring aflegt of het bezwaarschrift inlevert, ondertekent. Indien deze niet
      kan tekenen, wordt de oorzaak van het beletsel in de akte vermeld.

      2 De schriftelijke volmacht, in [artikel 446][ref3] bedoeld, of, zo zij voor een notaris in minuut is verleden, een
      authentiek afschrift daarvan, wordt aan de akte gehecht.

      3 Van elk aangewend rechtsmiddel wordt dadelijk aantekening gedaan in een daartoe bestemd op de griffie berustend
      register, dat door de belanghebbenden kan worden ingezien.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel445
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel446
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel446
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel447
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '445'
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '446'
      - id: ref3
        bwb_id: BWBR0028681
        artikel: '446'
  - number: '448'
    text: |-
      1 Is degene die een rechtsmiddel wenst aan te wenden ingesloten in een huis van bewaring, gevangenis, of een
      andere inrichting dan kan hij de rechtsmiddelen bedoeld in [artikel 445][ref1] ook aanwenden door middel van een
      schriftelijke verklaring, die hij doet toekomen aan het hoofd van de inrichting.

      2 Het hoofd van de inrichting doet deze verklaring onverwijld inschrijven in een daarvoor bestemd register en zendt
      haar vervolgens toe aan de griffie van het gerecht door of bij hetwelk de beslissing is gegeven onder kennisgeving
      van de datum van inschrijving in het register. Als dag waarop het rechtsmiddel is aangewend, geldt de dag van
      inschrijving van de verklaring in het register.

      3 Onze Minister van Justitie bepaalt het model van het register en kan omtrent het bijhouden daarvan nadere regels
      geven. Het register kan door de belanghebbenden worden ingezien.

      4 De verklaring wordt na ontvangst op de griffie bij de processtukken gevoegd. Van het aanwenden van
      het rechtsmiddel wordt dadelijk aantekening gedaan in het op de griffie berustend register, bedoeld in
      [artikel 447, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel445
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel447
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel448
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '445'
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '447'
  - number: '449'
    text: |-
      1 [Artikel 446][ref1] is op de indiening van schrifturen van overeenkomstige toepassing.

      2 De griffier tekent dag en uur van ontvangst onverwijld op ingekomen schrifturen aan.

      3 Van de ontvangst wordt dadelijk aantekening gedaan in het op de griffie berustend register.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel446
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel449
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '446'
  - number: '450'
    text: |-
      1 Uiterlijk tot de aanvang van de behandeling van het verzet, beroep of bezwaarschrift kan degene door wie het
      rechtsmiddel is aangewend, dat intrekken. Deze intrekking brengt mee afstand van de bevoegdheid om het rechtsmiddel
      opnieuw aan te wenden.

      2 Eveneens kan afstand worden gedaan van de bevoegdheid om het rechtsmiddel, dat tegen een bepaalde beslissing of
      handeling openstaat, aan te wenden.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel450
  - number: '451'
    text: |-
      1 Intrekking en afstand geschieden door een verklaring, af te leggen op de griffie van het gerecht.

      2 Afstand van het rechtsmiddel van hoger beroep kan eveneens onmiddellijk na de uitspraak ter terechtzitting worden
      gedaan, in welk geval van de gedane afstand aantekening geschiedt in het proces-verbaal van de terechtzitting.
      Afstand kan ook ter terechtzitting in hoger beroep worden gedaan, mits de daartoe strekkende verklaring
      onmiddellijk na de voordracht van de zaak wordt afgelegd. Ook in dat geval geschiedt aantekening in het proces-
      verbaal van de terechtzitting.

      3 De [artikelen 446][ref1] en [447][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel446
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel447
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel451
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '446'
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '447'
  - number: '452'
    text: |-
      1 Voor zover mogelijk geschiedt van de intrekking door de officier van justitie gedaan, onverwijld schriftelijke
      mededeling aan de verdachte.

      2 Indien aan de benadeelde partij overeenkomstig [artikel 431][ref1] kennisgeving is gedaan, wordt haar van elke
      intrekking van het verzet of beroep vanwege de officier van justitie kennisgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel431
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel452
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '431'
  - number: '453'
    text: |-
      1 Herziening van een in kracht van gewijsde gegane einduitspraak houdende veroordeling, kan worden aangevraagd:

      a. op grond van de omstandigheid dat bij onderscheidene vonnissen, in kracht van gewijsde gegaan of bij verstek
      gewezen, bewezenverklaringen zijn uitgesproken, die niet zijn overeen te brengen;

      b. op grond van enige omstandigheid die bij het onderzoek op de terechtzitting de rechter niet was gebleken en
      die op zichzelf of in verband met de vroeger geleverde bewijzen met de uitspraak niet bestaanbaar schijnt, zodanig
      dat ernstig vermoeden ontstaat dat ware zij bekend geweest, het onderzoek van de zaak zou hebben geleid, hetzij
      tot vrijspraak van de veroordeelde, hetzij tot ontslag van rechtsvervolging op grond dat deze niet strafbaar was,
      hetzij tot niet-ontvankelijkverklaring van het openbaar ministerie, hetzij tot toepasselijkverklaring van een
      minder zware strafbepaling.

      2 Op gelijke gronden kan herziening worden aangevraagd, indien bij het gewijsde een tenlastegelegd feit als bewezen
      is aangenomen zonder dat ter zake een veroordeling is gevolgd. Onder veroordeelde wordt in deze titel begrepen hij
      tegen wie zodanig gewijsde is gegeven; de bepalingen daarvan worden te zijnen aanzien overeenkomstig toegepast, met
      dien verstande dat [artikel 475][ref1] geen toepassing vindt.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel475
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel453
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '475'
  - number: '454'
    text: |-
      1 De aanvrage tot herziening wordt bij het Hof van Justitie aangebracht door het indienen van een vordering door
      de procureur-generaal of door het indienen van een verzoekschrift door een veroordeelde te wiens aanzien het vonnis
      in kracht van gewijsde is gegaan of door zijn advocaat. De instantie die ingevolge [artikel 61, eerste lid][ref1],
      met de toevoeging is belast, kan hem met overeenkomstige toepassing van de artikelen 61, tweede en derde lid,
      [63, tweede, derde en zesde lid][ref2], [64, eerste lid][ref3], en [65 tot en met 69][ref4], een advocaat
      toevoegen.

      2 [Artikel 446][ref5] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel63
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel64
      [ref4]: https://wetten.overheid.nl/BWBR0028681#Artikel65
      [ref5]: https://wetten.overheid.nl/BWBR0028681#Artikel446
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel454
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '61'
        paragraaf: '1'
        afdeling: Derde
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '63'
        paragraaf: '1'
        afdeling: Derde
      - id: ref3
        bwb_id: BWBR0028681
        artikel: '64'
        paragraaf: '1'
        afdeling: Derde
      - id: ref4
        bwb_id: BWBR0028681
        artikel: '65'
        paragraaf: '2'
        afdeling: Derde
      - id: ref5
        bwb_id: BWBR0028681
        artikel: '446'
  - number: '455'
    text: |-
      De aanvrage vermeldt de omstandigheid waarop zij steunt, met opgave van de bewijsmiddelen waaruit van die
      omstandigheid kan blijken.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel455
  - number: '456'
    text: |-
      Indien de aanvrage niet voldoet aan de vereisten bij het voorgaande artikel gesteld, verklaart het Hof bij
      met redenen omklede beschikking haar niet-ontvankelijk. In het andere geval zijn de navolgende bepalingen van
      toepassing.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel456
  - number: '457'
    text: |-
      1 Indien de aanvrage betreft het geval vermeld in [artikel 453, eerste lid, onderdeel a][ref1], vernietigt het
      Hof, na de aanvrage gegrond te hebben bevonden, bij met redenen omklede beschikking de vonnissen, met verwijzing
      van de zaken naar de openbare terechtzitting, te houden op een door de voorzitter te bepalen dag ten einde die
      gelijktijdig opnieuw te onderzoeken en daarin bij een en dezelfde uitspraak recht te doen, zonder dat echter de
      straf zwaarder mag zijn dan die welke bij de vernietigde vonnissen is opgelegd.

      2 Indien de veroordeelde krachtens het vernietigde vonnis een vrijheidsstraf ondergaat en het Hof geen
      vrijheidsstraf oplegt, wordt hij onverwijld in vrijheid gesteld, behoudens het bepaalde bij [artikel 465][ref2].

      3 Indien het Hof de aanvrage niet gegrond acht, wijst het die bij met redenen omklede beschikking af.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel453
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel465
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel457
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '453'
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '465'
  - number: '458'
    text: |-
      Indien de aanvrage betreft het geval, vermeld in [artikel 453, eerste lid, onderdeel b][ref1], beveelt het Hof na
      zich, zo nodig, door tussenkomst van de procureur-generaal nadere berichten te hebben doen overleggen, de verdere
      behandeling op de openbare terechtzitting op een daartoe door de voorzitter te bepalen dag.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel453
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel458
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '453'
  - number: '459'
    text: |-
      De procureur-generaal doet ten minste tien dagen voor de dag van de terechtzitting aan de veroordeelde aanzegging
      van die dag.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel459
  - number: '460'
    text: |-
      1 De voorzitter geeft op de terechtzitting een overzicht van de feiten, die uit het geding en naar aanleiding van
      de aanvrage tot herziening zijn bekend geworden. Daarna wordt het woord gevoerd door de procureur-generaal, de
      veroordeelde en diens advocaat.

      2 Het Hof zal hierop de dag van de uitspraak bepalen. Het vonnis wordt op de openbare terechtzitting uitgesproken.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel460
  - number: '461'
    text: |-
      1 Acht het Hof de aanvrage niet gegrond, dan wijst het die bij met redenen omklede uitspraak af.

      2 Acht het Hof de aanvrage gegrond, dan beveelt het de opschorting of schorsing van de tenuitvoerlegging van het
      gewijsde en verwijst het de zaak op de voet van het bepaalde bij [artikel 457][ref1], ten einde hetzij het gewijsde
      te handhaven, hetzij met vernietiging daarvan de verdachte vrij te spreken of als niet-strafbaar te ontslaan
      van alle rechtsvervolging, het openbaar ministerie niet-ontvankelijk te verklaren of de verdachte opnieuw te
      veroordelen met toepassing van de minder zware strafbepaling.

      3 Ten aanzien van de veroordeelde die krachtens het gewijsde vrijheidsstraf ondergaat, is het tweede lid van
      [artikel 457][ref2] toepasselijk.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel457
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel457
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel461
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '457'
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '457'
  - number: '462'
    text: |-
      Acht het Hof alvorens een beslissing te nemen een onderzoek nodig, dan beveelt het dit en draagt dat onderzoek
      op aan een rechter-commissaris, die in de zaak nog geen onderzoek heeft verricht. [Artikel 359][ref1] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel359
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel462
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '359'
        afdeling: Tweede
  - number: '463'
    text: |-
      1 Na afloop van het onderzoek doet de rechter-commissaris de stukken toekomen aan het Hof. [Artikel 53][ref1] is
      dan van overeenkomstige toepassing.

      2 De voorzitter bepaalt een dag tot voortzetting van de openbare behandeling.

      3 De procureur-generaal doet aan de veroordeelde tijdig mededeling van de dag van de behandeling.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel53
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel463
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '53'
        afdeling: Vierde
  - number: '464'
    text: |-
      1 Acht het Hof de zaak nog niet voldoende onderzocht, dan beveelt het een nader onderzoek, zo nodig met aanwijzing
      van een andere rechter-commissaris, met inachtneming van [artikel 462][ref1] te benoemen.

      2 [Artikel 463][ref2] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel462
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel463
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel464
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '462'
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '463'
  - number: '465'
    text: |-
      1 Bij de verwijzing kan het Hof een bevel tot gevangenhouding tegen de veroordeelde uitvaardigen. Dit bevel
      is geldig voor onbepaalde termijn, doch kan door het Hof worden geschorst of opgeheven. In geen geval zal deze
      gevangenhouding langer mogen duren dan de nog niet volbrachte straftijd die bij het gewijsde was opgelegd. De
      [artikelen 90][ref1], [100][ref2], [101][ref3], [103][ref4], [106][ref5], [109 tot en met 116][ref6] en [440][ref7]
      zijn van overeenkomstige toepassing.

      2 Indien de veroordeelde, tegen wie een bevel tot gevangenhouding als bedoeld in het eerste lid is uitgevaardigd,
      geen advocaat heeft, wordt deze hem ambtshalve door de voorzitter van het Hof toegevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel90
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel100
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel101
