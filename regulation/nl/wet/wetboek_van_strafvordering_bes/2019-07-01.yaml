    text: |-
      Zodra het openbaar ministerie bemerkt, dat een inbeslaggenomen voorwerp tijdens het begaan van het strafbare feit
      toebehoorde aan een ander dan de verdachte, stelt het die persoon, indien zijn verblijfplaats bekend is, in kennis
      van de bevoegdheden die hij heeft ingevolge de [artikelen 150][ref1] en [151][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel150
