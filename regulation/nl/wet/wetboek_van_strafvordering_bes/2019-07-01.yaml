  - number: '646'
    text: |-
      1 Van iedere uitreiking, als bedoeld in [artikel 643][ref1], wordt een akte opgemaakt, waarin zijn vermeld:

      a. de autoriteit van welke het gerechtelijk schrijven uitgaat;

      b. het nummer van het schrijven;

      c. de persoon voor wie het schrijven bestemd is;

      d. de persoon aan wie het is uitgereikt;

      e. de ambtenaar die het heeft uitgereikt;

      f. de plaats van uitreiking;

      g. de dag en het uur van uitreiking;

      2 De akte wordt door hen die met de uitreiking zijn belast, ieder voor zover het zijn bevindingen en handelingen
      betreft, ter plaatse van die bevindingen en handelingen in persoon opgemaakt op de eed afgelegd bij de aanvaarding
      van hun bediening en terstond ondertekend.

      3 Het model van de akte wordt vastgesteld door het openbaar ministerie. Dit kan nadere voorschriften geven in het
      belang van een goede uitvoering van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel643
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel646
