  - number: '57'
    text: |-
      1 Als raadslieden worden slechts toegelaten advocaten, die bij het Hof van Justitie zijn ingeschreven.

      2 In bijzondere gevallen kan het Hof van Justitie op verzoek van de verdachte aan advocaten, die niet bij het Hof
      van Justitie zijn ingeschreven, toestaan als raadsman op te treden, mits deze samenwerkt met een bij het Hof van
      Justitie ingeschreven advocaat.

      3 Medeverdachten, die geen tegenstrijdige belangen hebben, kunnen door dezelfde raadsman worden bijgestaan.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel57
  - number: '58'
    text: |-
      1 Bevoegdheden die bij of krachtens dit wetboek uitdrukkelijk aan de verdachte zijn toegekend, kunnen door diens
      raadsman worden uitgeoefend, indien deze door de verdachte is gemachtigd en de aard van de bevoegdheid zich
      daartegen niet verzet.

      2 Machtiging door de verdachte zal worden aangenomen, wanneer de raadsman verklaart dat dit het geval is.

      3 Toezending van processtukken aan de verdachte geschiedt tevens aan diens raadsman, voor zover dat uitdrukkelijk
      is bepaald.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel58
  - number: '59'
    text: |-
      1 De verdachte is te allen tijde bevoegd een of meer raadslieden te kiezen.

      2 Tot de keuze van een of meer raadslieden is ook de wettige vertegenwoordiger van de verdachte bevoegd.

      3 Is de verdachte verhinderd van zijn wil te dien aanzien te doen blijken en heeft hij geen wettige
      vertegenwoordiger, dan is zijn echtgenoot of de meest gerede van zijn bloed- of aanverwanten, tot de vierde graad
      ingesloten, tot die keuze bevoegd.

      4 De ingevolge het tweede of derde lid gekozen of de ingevolge de [artikelen 61 tot en met 68][ref1] toegevoegde
      raadsman treedt af, zodra de verdachte zelf een raadsman heeft gekozen.

      5 Bij algemene maatregel van bestuur kan worden geregeld, op welke wijze van een keuze ingevolge het eerste, tweede
      of derde lid dient te blijken.


