  - number: '263'
    text: |-
      1 De deskundige wordt door de rechter-commissaris beëdigd.

      2 Van degene die, op de vordering van het openbaar ministerie, door het Hof van Justitie als vaste gerechtelijke
      deskundige is beëdigd, wordt ter zake van het uitbrengen van een schriftelijk verslag geen nadere eed gevorderd.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel263
  - number: '264'
    text: |-
      De rechter-commissaris bepaalt het tijdstip waarop het onderzoek van de deskundigen zal aanvangen, en de termijn
      waarbinnen dit zal moeten zijn afgelopen; deze termijn kan door de rechter-commissaris worden verlengd.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel264
  - number: '265'
    text: |-
      1 De rechter-commissaris geeft de officier van justitie schriftelijk of mondeling kennis van de aan de deskundigen
      verleende opdracht, van tijd en plaats van hun onderzoek en van de uitslag daarvan.

      2 Indien het belang van het onderzoek zich daartegen niet verzet, geeft de rechter-commissaris na de officier van
      justitie te hebben gehoord, de verdachte en diens raadsman schriftelijk kennis van de aan de deskundigen verleende
      opdracht en van tijd en plaats van hun onderzoek.

      3 Van de uitslag daarvan geschiedt gelijke kennisgeving, zodra het belang van het onderzoek dit toelaat.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel265
  - number: '266'
    text: |-
      1 Het onderzoek van de deskundigen geschiedt in tegenwoordigheid van de rechter-commissaris, indien deze dat nodig
      oordeelt.

      2 De rechter-commissaris kan, indien het belang van het onderzoek zich daartegen niet verzet, bepalen dat
      de verdachte aan wie van de opdracht aan deskundigen is kennis gegeven, en diens raadsman, het onderzoek van
      de deskundigen geheel of gedeeltelijk zullen kunnen bijwonen. De officier van justitie kan bij het onderzoek
      tegenwoordig zijn.

      3 De officier van justitie, de verdachte en diens raadsman, hebben, ook indien het onderzoek van de deskundigen
      buiten hun tegenwoordigheid geschiedt, de bevoegdheid met betrekking tot dat onderzoek aanwijzingen te doen en
      opmerkingen te maken. Desverlangd wordt aan de deskundigen en aan de verdachte de gelegenheid gegeven om ten
      overstaan van of, voor zover dat in het belang van het onderzoek noodzakelijk schijnt, door bemiddeling van de
      rechter-commissaris een onderhoud te hebben. Ten aanzien van de officier van justitie en de raadsman is daarbij het
      tweede lid van [artikel 233][ref1] van overeenkomstige toepassing.

      4 De rechter-commissaris stelt de deskundigen mondeling of schriftelijk in kennis van de opmerkingen en
      aanwijzingen, voor zover deze geschied zijn buiten hun tegenwoordigheid.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel233
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel266
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '233'
        afdeling: Tweede
  - number: '267'
    text: |-
      1 De verdachte aan wie van de opdracht aan de deskundigen is kennisgegeven, is bevoegd zijnerzijds een deskundige
      aan te wijzen, die het recht heeft bij het onderzoek van de door de rechter-commissaris benoemde deskundigen
      tegenwoordig te zijn, daarbij de nodige aanwijzingen te doen en opmerkingen te maken.

      2 De rechter-commissaris kan om redenen in de persoon gelegen, de toelating van een bepaalde aangewezen deskundige
      tot het onderzoek weigeren.

      3 De verdachte kan alsdan onverwijld de weigering onderwerpen aan het oordeel van het Hof, dat alsnog de toelating
      kan bevelen.

      4 In geen geval mag, tenzij de rechter-commissaris hierin bewilligt, door de aanwijzing vertraging in de aanvang of
      de loop van het onderzoek plaatshebben.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel267
  - number: '268'
    text: |-
      1 De verdachte aan wie van de uitslag van het onderzoek is kennisgegeven, is bevoegd zijnerzijds een deskundige aan
      te wijzen, die het recht heeft het verslag van de door de rechter-commissaris benoemde deskundigen te onderzoeken.
      Het tweede en derde lid van [artikel 267][ref1] zijn van overeenkomstige toepassing.

      2 In geen geval mag, tenzij de rechter-commissaris hierin bewilligt, door de aanwijzing vertraging in de loop van
      het gerechtelijk vooronderzoek plaatshebben.

      3 De rechter-commissaris verleent aan de aangewezen deskundige inzage of afschrift van het verslag, bedoeld in het
      eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel267
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel268
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '267'
        afdeling: Zesde
  - number: '269'
    text: |-
      1 Met betrekking tot de door de verdachte overeenkomstig een van de beide voorgaande artikelen
      aangewezen deskundige zijn de [artikelen 245 tot en met 247][ref1], [263 tot en met 265][ref2],
      [266, derde en vierde lid][ref3], en [267][ref4] van overeenkomstige toepassing.

      2 Die deskundige brengt aan de rechter-commissaris een met redenen omkleed verslag uit. Het verslag wordt
      schriftelijk of mondeling uitgebracht, naar gelang de rechter-commissaris dit vordert.

      3 Die deskundige ontvangt uit 's Rijks kas vergoeding op dezelfde voet als de deskundigen, die door de rechter-
      commissaris zijn benoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel245
