  - number: '563'
    text: |-
      1 De rechter-commissaris doet het verzoek, na bijvoeging van de processen-verbaal van de door hem afgenomen
      verhoren en van die van zijn verdere verrichtingen, zo spoedig mogelijk teruggaan naar de officier van justitie.

      2 De door de rechter-commissaris inbeslaggenomen stukken van overtuiging worden ter beschikking van de officier van
      justitie gesteld, voor zover het Hof, met inachtneming van het toepasselijke verdrag, daartoe verlof verleent.

      3 Tenzij aannemelijk is dat de rechthebbenden op de inbeslaggenomen stukken van overtuiging niet in de openbare
      lichamen Bonaire, Sint Eustatius en Saba verblijf houden, wordt het krachtens het tweede lid vereiste verlof
      slechts verleend onder het voorbehoud, dat bij de afgifte aan de buitenlandse autoriteiten wordt bedongen, dat de
      stukken zullen worden teruggezonden zodra daarvan het voor de strafvordering nodige gebruik is gemaakt.

      4 Het bepaalde bij en krachtens de [artikelen 141 tot en met 145][ref1], [150][ref2], en [152 tot en met 154][ref3]
      is van overeenkomstige toepassing. In de plaats van het volgens die artikelen bevoegde gerecht treedt het Hof op.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel150
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel152
