  - number: '427'
    text: |-
      1 Zowel de officier van justitie als de verdachte kunnen na de mededeling betreffende het rechtsmiddel dat tegen
      het vonnis openstaat, ter terechtzitting afstand doen van de bevoegdheid om dat rechtsmiddel aan te wenden. Op zijn
      recht daartoe wordt de verdachte opmerkzaam gemaakt.

      2 Afstand ter terechtzitting van rechtsmiddelen wordt in het proces-verbaal van die terechtzitting vermeld.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel427
  - number: '428'
    text: |-
      1 Op het rechtsgeding bij het gerecht in eerste aanleg zijn overigens de [Eerste Titel][ref1] en de
      [Vierde Titel van dit Boek][ref2] van overeenkomstige toepassing, behoudens de uitzonderingen, vermeld in het
      tweede tot en met zesde lid.

      2 De termijn van dagvaarding is ten minste drie dagen en, indien door de rechter-commissaris overeenkomstig de
      [Zevende Titel van het Zevende Boek][ref3] bevelen tot handhaving van de openbare orde zijn gegeven, ten minste
      twee dagen. De in de vorige volzin bedoelde termijn van twee dagen wordt, zo nodig, zoveel verlengd, dat daarin ten
      minste een dag voorkomt, die niet een zaterdag, zondag of algemeen erkende feestdag is.

      3 De bepalingen met betrekking tot de voordracht van de zaak door de officier van justitie, de voorlopige hechtenis
      en het bezwaarschrift tegen de dagvaarding, zijn niet van toepassing.

      4 In geval van [artikel 333][ref4] wordt geen gerechtelijk vooronderzoek gelast, doch worden de stukken toegezonden
      aan de officier van justitie.

      5 Indien tegen de verdachte verstek is verleend, zomede voor zover door de verdachte en door zijn raadsman, zo hij
      die heeft, verklaard is, dat van bepaaldelijk aangeduide stukken noch de voorlezing noch de mededeling van de korte
      inhoud wordt gewenst, kan in de plaats van de voorlezing van de tenlastelegging, verklaringen, processen-verbaal,
      verslagen van deskundigen of andere stukken, vermeld in [artikel 337][ref5], treden een op last van de rechter
      gedane aantekening in het proces-verbaal van de terechtzitting van de overlegging van die stukken; daarop mag dan
      ook ten bezware van de verdachte worden acht geslagen.

      6 In geval van [artikel 359][ref6] zijn de [artikelen 235][ref7], [237, eerste lid][ref8], en [241][ref9] niet
      van toepassing.

      7 De in [artikel 411][ref10] bedoelde mededeling behoeft niet te geschieden, tenzij:

      a. ten aanzien van de verdachte [artikel 17a van het Wetboek van Strafrecht BES][ref11] is toegepast, dan wel,

      b. een vrijheidsstraf is opgelegd, vervangende vrijheidsstraf daaronder niet begrepen, dan wel,

      c. een bijkomende straf is opgelegd, waarbij de ontzetting van bepaalde rechten of de ontzetting van bepaalde
      bevoegdheden is uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0028681
