      1 Heeft de benadeelde partij zich in het geding gevoegd, dan beraadslaagt het Hof mede over zijn bevoegdheid om
      over de vordering te oordelen, over de ontvankelijkheid van die partij, over de gegrondheid van haar vordering, en
      over de verwijzing in de kosten door die partij en de verdachte gemaakt.

      2 Het vonnis houdt alsdan, tenzij onbevoegdheid van het Hof over de vordering te oordelen of niet-ontvankelijkheid
      van de benadeelde partij wordt uitgesproken, ook in de beslissing van het Hof over de vordering en over de
      verwijzing in de kosten door die partij en de verdachte gemaakt.
