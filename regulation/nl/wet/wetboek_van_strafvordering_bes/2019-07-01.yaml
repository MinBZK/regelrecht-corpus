  - number: '271'
    text: De rechter-commissaris kan de deskundigen geheimhouding opleggen.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel271
  - number: '272'
    text: |-
      Indien de rechter-commissaris oordeelt dat het gerechtelijk vooronderzoek is voltooid of dat tot voortzetting
      daarvan geen grond bestaat, of wel indien de officier van justitie hem schriftelijk meedeelt dat van verdere
      vervolging wordt afgezien, sluit hij het onderzoek bij een beschikking waarin de reden van de sluiting is vermeld,
      en doet hij deze aan de officier van justitie toekomen en aan de verdachte betekenen. Tegen deze beschikking is
      geen voorziening toegelaten.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel272
  - number: '273'
    text: |-
      1 Indien in de zaak een bevel krachtens de [artikelen 15 tot en met 29][ref1] is gevraagd of gegeven, doet de
      officier van justitie een mededeling overeenkomstig [artikel 272][ref2] niet dan nadat daarin is bewilligd door het
      Hof van Justitie.

      2 De officier van justitie doet te dien einde de processtukken, vergezeld van een verslag houdende de gronden voor
      zodanige mededeling, toekomen aan het Hof van Justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel272
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel273
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '272'
        afdeling: Zevende
  - number: '274'
    text: |-
      1 Indien het gerechtelijk vooronderzoek is gesloten, doch het onderzoek op de terechtzitting nog niet is
      aangevangen, kan de rechter in eerste aanleg, op de vordering van de officier van justitie of op het verzoek van de
      verdachte, de rechter-commissaris het verrichten van bepaalde handelingen van nader onderzoek opdragen.

      2 De vordering van de officier van justitie en het verzoek van de verdachte bevatten, op straffe van niet-
      ontvankelijkheid met redenen omkleed, een nauwkeurige opgave van de handelingen van onderzoek die door de rechter-
      commissaris dienen te worden verricht.

      3 Indien de rechter daartoe gronden aanwezig acht, hoort hij de officier van justitie of de verdachte, tenzij hij
      de vordering of het verzoek aanstonds niet ontvankelijk of ongegrond acht.

      4 Het door de rechter-commissaris te verrichten nader onderzoek geldt als een gerechtelijk vooronderzoek en wordt
      gevoerd overeenkomstig de [artikelen 226 tot en met 272][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel226
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel274
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '226'
        afdeling: Tweede
  - number: '275'
    text: |-
      1 Indien naar aanleiding van het ingestelde voorbereidend onderzoek de officier van justitie van oordeel is dat
      verdere vervolging moet plaatshebben, gaat hij daartoe zo spoedig mogelijk over.

      2 Zolang het onderzoek op de terechtzitting nog niet is aangevangen, kan van verdere vervolging worden afgezien,
      ook op gronden aan het algemeen belang ontleend.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel275
  - number: '276'
    text: |-
      1 In geval van de mededeling genoemd in [artikel 272][ref1] doet de officier van justitie de verdachte onverwijld
      kennisgeven, dat hij hem ter zake van het feit waarop het gerechtelijk vooronderzoek betrekking had, niet verder
      zal vervolgen.

      2 Is voorlopige hechtenis toegepast en heeft de officier van justitie de mededeling genoemd in [artikel 272][ref2]
      gedaan, dan wordt daardoor elk bevel tot voorlopige hechtenis op het tijdstip van de beschikking tot sluiting van
      het gerechtelijk vooronderzoek van rechtswege opgeheven. De rechter-commissaris maakt daarvan in zijn beschikking
      melding.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel272
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel272
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel276
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '272'
        afdeling: Zevende
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '272'
        afdeling: Zevende
  - number: '277'
    text: |-
      1 Indien een gerechtelijk vooronderzoek heeft plaatsgehad, doet de officier van justitie, buiten het geval van
      [artikel 276][ref1], uiterlijk binnen een maand nadat de beschikking tot sluiting daarvan aan de verdachte betekend
      is geworden, hetzij deze kennisgeven dat hij hem ter zake van het feit waarop dat onderzoek betrekking had, niet
      verder zal vervolgen, hetzij hem dagvaarden ter terechtzitting.

      2 De termijn kan op de vordering van de officier van justitie door de rechter-commissaris eenmaal voor ten hoogste
      een maand worden verlengd. Indien de officier van justitie het Hof ingevolge [artikel 279, tweede lid][ref2], om
      bewilliging heeft verzocht, wordt de termijn van rechtswege verlengd tot en met de veertiende dag nadat het Hof op
      het verzoek heeft beslist.

      3 De officier van justitie kan, op het verzoek van de verdachte, en al dan niet onder het stellen van bepaalde
      voorwaarden, voor het doen van kennisgeving overeenkomstig het eerste lid een bepaalde langere termijn nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel276
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel279
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel277
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '276'
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '279'
  - number: '278'
    text: |-
      1 Indien een gerechtelijk vooronderzoek niet heeft plaatsgehad, doch wel voorlopige hechtenis is toegepast, doet
      de officier van justitie, zodra de zaak tot klaarheid is gebracht, hetzij de verdachte kennisgeven dat hij hem ter
      zake van het feit, waarvoor de voorlopige hechtenis is toegepast, niet verder zal vervolgen, hetzij hem dagvaarden
      ter terechtzitting.

      2 De rechter-commissaris kan, op het verzoek van de verdachte, de officier van justitie eenmaal een termijn stellen
      van ten hoogste een maand, binnen welke deze tot kennisgeving of dagvaarding overeenkomstig de bepaling van het
      eerste lid moet overgaan.

      3 De verdachte wordt op het verzoek gehoord.

      4 Het tweede en derde lid van [artikel 277][ref1] zijn van toepassing.

      5 De verplichting tot kennisgeving of dagvaarding vervalt, indien binnen de gestelde of verlengde termijn een
      gerechtelijk vooronderzoek is geopend.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel277
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel278
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '277'
  - number: '279'
    text: |-
      1 Door een kennisgeving van niet verdere vervolging eindigt de zaak.

      2 Indien in de zaak een bevel krachtens de [artikelen 15 tot en met 29][ref1], is gevraagd of gegeven,
      blijft een kennisgeving van niet verdere vervolging achterwege, tenzij daaraan een mededeling overeenkomstig
      [artikel 272][ref2] is voorafgegaan of in de kennisgeving is bewilligd door het Hof van Justitie.
      [Artikel 273, tweede lid][ref3], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel272
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel273
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel279
