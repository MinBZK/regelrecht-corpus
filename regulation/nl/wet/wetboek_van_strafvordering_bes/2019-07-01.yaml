        afdeling: Eerste
  - number: '206'
    text: |-
      1 Ieder, die door het strafbare feit van een ander schade heeft geleden, kan zich opgeven als benadeelde partij.
      Ten aanzien van die opgave is [artikel 201, eerste tot en met derde lid][ref1], van overeenkomstige toepassing. De
      opsporingsambtenaren zijn tot het ontvangen van de opgave verplicht.

      2 De benadeelde partij ontvangt een afschrift van het proces-verbaal betreffende haar opgave.

      3 Wanneer de benadeelde partij de wens kenbaar heeft gemaakt schadevergoeding te vorderen of omtrent het verloop
      van de zaak te worden ingelicht, wordt daarvan in het proces-verbaal melding gemaakt.

      4 Wanneer de benadeelde partij als gevolg van het strafbare feit hulp en steun behoeft, wordt daartoe de
      nodige bemiddeling verleend. De bemiddeling kan ook betrekking hebben op de totstandkoming van een regeling tot
      schadevergoeding tussen de verdachte, indien deze heeft bekend en vrijwillig aan die regeling meewerkt, en de
      benadeelde partij.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel201
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel206
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '201'
        afdeling: Tweede
  - number: '207'
    text: |-
      1 Indien de officier van justitie naar aanleiding van het ingestelde opsporingsonderzoek van oordeel is, dat
      vervolging moet plaatshebben, gaat hij daartoe zo spoedig mogelijk over.

      2 Van vervolging kan worden afgezien op gronden aan het algemeen belang ontleend. Aan die beslissing kunnen door de
      officier van justitie voorwaarden worden verbonden. Daarbij wordt in het bijzonder acht geslagen op de belangen van
      de benadeelde partij.

      3 [Artikel 278, tweede tot en met vijfde lid][ref1], is van overeenkomstige toepassing. De kennisgeving behelst
      alsdan de beslissing niet te vervolgen.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel278
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel207
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '278'
  - number: '208'
    text: |-
      1 Indien gronden voor vervolging aanwezig worden geacht, beziet de officier van justitie, alle omstandigheden in
      aanmerking genomen, of de zaak langs andere dan gerechtelijke weg kan worden afgedaan. Bij die beslissing kunnen
      door hem voorwaarden worden gesteld aan de verdachte, indien deze heeft bekend en zich bereid heeft verklaard de
      voorwaarden na te leven, met het oog op het zonder vergoeding verrichten van werkzaamheden ten algemene nutte.

      2 In verband met een goede uitvoering van het in het eerste lid bepaalde, worden door het openbaar ministerie
      richtlijnen vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel208
  - number: '209'
    text: |-
      1 De benadeelde partij, die de in [artikel 206, derde lid][ref1], bedoelde wens kenbaar heeft gemaakt, wordt door
      de officier van justitie ingelicht omtrent de door hem genomen beslissing omtrent al dan niet vervolgen. Indien
      de zaak wordt vervolgd, houdt hij de benadeelde partij op de hoogte van voor haar van belang zijnde momenten in
      de verdere procedure. Indien de zaak niet wordt vervolgd, wijst hij haar op de mogelijkheid om op de voet van de
      [artikelen 15 tot en met 28][ref2] bij het Hof van Justitie beklag te doen.

      2 Desgevraagd wordt degene, die door een misdrijf ernstig is benadeeld, in de gelegenheid gesteld om, in verband
      met door de officier van justitie te nemen beslissingen, zijn zienswijze kenbaar te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel206
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel15
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel209
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '206'
        afdeling: Derde
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '15'
  - number: '210'
    text: |-
      1 De president van het Hof van Justitie wijst, na de procureur-generaal te hebben gehoord, een of meer leden of
      plaatsvervangende leden van het Hof of rechtersplaatsvervanger in eerste aanleg aan als rechter-commissaris, belast
      met de behandeling van strafzaken bij het gerecht in eerste aanleg, of als diens plaatsvervanger.

      2 De aanwijzing geschiedt voor een door de president te bepalen termijn.

      3 De rechter-commissaris kan op zijn verzoek om gewichtige redenen voor de afloop van de termijn waarvoor hij is
      aangewezen, nadat de procureur-generaal is gehoord, door de president van het Hof uit zijn functie worden ontheven.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel210
  - number: '211'
    text: |-
      De rechter-commissaris zet na afloop van zijn functie de door hem aangevangen behandeling van een zaak voort en
      brengt die ten einde.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel211
  - number: '212'
    text: |-
      Bij verhindering van de rechter-commissaris of diens plaatsvervanger wordt zijn functie waargenomen door een van de
      leden of plaatsvervangende leden van het Hof van Justitie of rechters-plaatsvervanger in eerste aanleg.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel212
  - number: '213'
    text: |-
      1 De rechter-commissaris wordt bij zijn verrichtingen bijgestaan door een griffier.

      2 Bij verhindering of ontstentenis van deze kan de rechter-commissaris in dringende gevallen een persoon aanwijzen,
      ten einde voor bepaald aan te wijzen verrichtingen als griffier op te treden. Deze plaatsvervangende griffier
      wordt voor de aanvang van zijn werkzaamheden door de rechter-commissaris beëdigd, dat hij zijn taak naar behoren
      zal vervullen.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel213
  - number: '214'
    text: |-
      1 De rechter-commissaris doet door de griffier een proces-verbaal opmaken van hetgeen bij het onderzoek is
      verklaard, verricht en voorgevallen of door hem is waargenomen; daarbij moeten tevens zoveel mogelijk uitdrukkelijk
      worden opgegeven de redenen van wetenschap.

      2 Indien dit tot juist begrip van een verklaring of om andere redenen gewenst is, of indien de verdachte, getuige
      of deskundige of de raadsman dit verlangt, doet hij ook de vraag naar aanleiding waarvan de verklaring is afgelegd,
      in het proces-verbaal opnemen.

      3 Indien de verdachte, getuige of deskundige of de raadsman verlangt dat enige opgave in de eigen woorden zal
      worden opgenomen, geschiedt dat, voor zover de opgave redelijke grenzen niet overschrijdt, zoveel mogelijk.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel214
  - number: '215'
    text: |-
      Geen vragen worden gedaan die de strekking hebben verklaringen te verkrijgen, waarvan niet gezegd kan worden dat
      zij in vrijheid zijn afgelegd.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel215
  - number: '216'
    text: |-
      1 Iedere getuige, deskundige of verdachte ondertekent zijn verklaring, nadat die hem is voorgelezen of door hem is
      gelezen, en hij verklaard heeft daarbij te volharden.

      2 Bij gebreke van ondertekening wordt de weigering of de oorzaak van het beletsel vermeld.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel216
  - number: '217'
    text: |-
      1 Tussen de regels van het proces-verbaal wordt niet geschreven.

      2 Doorhalingen en verwijzingen worden ondertekend of gewaarmerkt door de rechter-commissaris en de griffier,
      en door hem op wiens verklaring de doorhaling of verwijzing betrekking heeft. Bij gebreke van ondertekening of
      waarmerking wordt de weigering of de oorzaak van het beletsel vermeld.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel217
  - number: '218'
    text: Het proces-verbaal wordt door de rechter-commissaris en de griffier ondertekend.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel218
  - number: '219'
    text: |-
      1 De rechter-commissaris kan, ambtshalve, op de vordering van de officier van justitie of op het verzoek van de
      verdachte of diens raadsman, in het belang van het onderzoek het doen van nasporingen opdragen en bevelen geven aan
      de ambtenaren genoemd in [artikel 184, eerste lid][ref1], en aan de personen genoemd in [artikel 185][ref2].

      2 De rechter-commissaris heeft gelijke bevoegdheid als in [artikel 197][ref3] aan het openbaar ministerie is
      toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel184
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel185
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel197
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel219
