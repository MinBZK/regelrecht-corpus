  - number: '628'
    text: |-
      1 De tenuitvoerlegging van vonnissen, houdende veroordeling tot geldboete, geschiedt door het openbaar ministerie.

      2 Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de plaats van betaling van
      geldboeten.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel628
  - number: '629'
    text: |-
      1 Bij gebreke van volledige betaling binnen de ingevolge [artikel 615][ref1] bepaalde termijn wordt het
      verschuldigde bedrag, na voorafgaande schriftelijke waarschuwing, op de goederen van de veroordeelde verhaald.
      In verband met het verhaal kan woonplaats worden gekozen ten parkette van het openbaar ministerie dat met de
      tenuitvoerlegging is belast.

      2 Het met de tenuitvoerlegging belaste openbaar ministerie kan van het nemen van verhaal afzien.

      3 Is volledig verhaal onmogelijk gebleken of daarvan met toepassing van het tweede lid afgezien, dan wordt, na
      voorafgaande schriftelijke waarschuwing, de vervangende vrijheidsstraf ten uitvoer gelegd.

      4 Tenzij de veroordeelde in de openbare lichamen Bonaire, Sint Eustatius en Saba geen bekende woon- of
      verblijfplaats heeft, wordt tot tenuitvoerlegging van vervangende vrijheidsstraf niet overgegaan dan nadat veertien
      dagen zijn verstreken sedert de dag waarop de in het derde lid bedoelde waarschuwing aan hem is verzonden.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel615
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel629
