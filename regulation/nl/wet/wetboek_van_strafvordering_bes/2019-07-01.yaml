  - number: 177f
    text: |-
      1 Het gerecht in eerste aanleg waakt tegen nodeloze vertraging van het strafrechtelijk financieel onderzoek.

      2 Het kan op verzoek van de onderzochte persoon zich de stukken van het onderzoek doen overleggen en de onverwijlde
      of spoedige beëindiging van het onderzoek bevelen.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel177f
  - number: 177g
    text: |-
      1 Zodra de officier van justitie oordeelt dat het strafrechtelijk financieel onderzoek is voltooid, of dat tot
      voortzetting daarvan geen grond meer bestaat, sluit hij het onderzoek bij schriftelijke gedagtekende beschikking.

      2 Indien de verdachte bij de einduitspraak ter zake van het strafbare feit of het misdrijf, bedoeld in
      [artikel 38e, eerste onderscheidenlijk derde lid, van het Wetboek van Strafrecht BES][ref1], niet wordt
      veroordeeld, sluit de officier van justitie het strafrechtelijk financieel onderzoek evenzo. In dat geval is de
      officier van justitie bevoegd van de rechter-commissaris heropening van het strafrechtelijk financieel onderzoek te
      vorderen, zodra de verdachte alsnog ter zake van het tenlastegelegde feit wordt veroordeeld.

      3 De officier van justitie zendt zijn beschikking aan de rechter-commissaris en doet een afschrift daarvan aan
      degene tegen wie het is gericht, betekenen, onder mededeling van het recht tot kennisneming van de stukken van
      het onderzoek.

      4 Onverminderd het bepaalde in het tweede lid, de [artikelen 503c, tweede en derde lid][ref2],
      [503d, derde lid][ref3], en [503f, tweede lid, onderdeel c][ref4], kan een gesloten strafrechtelijk financieel
      onderzoek slechts worden heropend krachtens een nadere machtiging van de rechter-commissaris, op vordering van de
      officier van justitie verleend. Het [vierde lid van artikel 177a][ref5] is van toepassing.

      5 Een nadere machtiging wordt zo spoedig mogelijk met de vordering waarop zij rust, aan degene tegen wie het
      onderzoek is gericht, betekend. Het eerste tot en met vierde lid is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel38e
