  - number: 177w
    text: |-
      1 Een opsporingsambtenaar kan, bij bevel daartoe van de officier van justitie, in het belang van het onderzoek met
      een persoon, die geen opsporingsambtenaar is, overeenkomen dat deze voor de duur van het bevel bijstand verleent
      aan de opsporing door goederen af te nemen van of gegevens, die zijn opgeslagen of worden verwerkt of overgedragen
      door middel van een geautomatiseerd werk, door tussenkomst van een aanbieder van een communicatiedienst af te nemen
      van of diensten te verlenen aan een persoon of stelselmatig informatie in te winnen omtrent een persoon in geval
      dat:

      a. die persoon verdacht wordt van een misdrijf waarvoor voorlopige hechtenis is toegelaten;

      b. er aanwijzingen zijn van een terroristisch misdrijf.

      2 Toepassing van het eerste lid vindt alleen plaats indien de officier van justitie van oordeel is dat geen bevel
      als bedoeld in [artikel 177n, eerste lid][ref1], en [artikel 177o, eerste lid][ref2], kan worden gegeven.

      3 De persoon die op grond van het eerste lid bijstand verleent aan de opsporing brengt bij de uitvoering daarvan
      een ander niet tot strafbare feiten dan waarop diens opzet reeds van tevoren was gericht.

      4 Het bevel vermeldt, behalve de gegevens, bedoeld in [artikel 177h][ref3], tevens de aard van de goederen,
      gegevens of diensten.

      5 De overeenkomst is schriftelijk en vermeldt de rechten en plichten van de persoon die bijstand verleent aan
      de opsporing, de wijze waarop aan de overeenkomst uitvoering wordt gegeven, alsmede de geldigheidsduur van de
      overeenkomst. De overeenkomst kan schriftelijk worden gewijzigd, aangevuld, verlengd of beëindigd.

      6 Het bevel tot uitoefening van de bevoegdheid, wordt gegeven voor een periode van ten hoogste zes weken. De
      geldigheidsduur kan telkens voor een periode van zes weken worden verlengd.

      7 Toepassing van het eerste lid vindt alleen plaats na voorafgaande schriftelijke toestemming van de procureur-
      generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel177n
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel177o
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel177h
