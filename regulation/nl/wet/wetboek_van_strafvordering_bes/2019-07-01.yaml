  - number: '650'
    text: |-
      1 De kosten van uitlevering of overbrenging van voorwerpen ingevolge een bevel van de rechter-commissaris of van
      de officier van justitie worden door de rechter-commissaris dan wel de officier van justitie begroot en aan de
      betrokken persoon uit ’s Rijks kas vergoed.

      2 De rechter-commissaris of de officier van justitie geeft daarvoor een bevelschrift van tenuitvoerlegging af.

      3 [Artikel 648, vierde lid][ref1], is van overeenkomstige toepassing.


