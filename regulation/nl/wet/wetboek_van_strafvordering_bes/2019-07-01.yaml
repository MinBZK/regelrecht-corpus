  - number: 579e
    text: |-
      1 Bij de overeenkomstige toepassing van de [artikelen 150][ref1] onderscheidenlijk [154a][ref2] treedt de rechter
      niet in een nieuw onderzoek naar de rechten van belanghebbenden, indien daaromtrent door de buitenlandse rechter
      een uitspraak is gedaan. De rechter kan echter wel in een dergelijk nieuw onderzoek treden, indien:

      a. die uitspraak betrekking heeft op rechten ter zake van in de openbare lichamen Bonaire, Sint Eustatius en Saba
      gelegen onroerende goederen of in de openbare lichamen Bonaire, Sint Eustatius en Saba te boek gestelde zeeschepen
      en luchtvaartuigen;

      b. die uitspraak betreft de geldigheid, de nietigheid of de ontbinding van in de openbare lichamen Bonaire, Sint
      Eustatius en Saba gevestigde rechtspersonen of de besluiten van hun organen;

      c. die uitspraak is gedaan, zonder dat de belanghebbende tegen wie verstek werd verleend, zo tijdig tevoren, als
      met het oog op zijn verdediging redelijkerwijs nodig was van het geding officieel in kennis was gesteld;

      d. die uitspraak onverenigbaar is met een ter zake eerder in de openbare lichamen Bonaire, Sint Eustatius en Saba
      gewezen rechterlijke beslissing;

      e. erkenning van die uitspraak onverenigbaar zou zijn met de openbare orde van Bonaire, Sint Eustatius en Saba.

      2 Zolang ter zake van de rechten van een belanghebbende een procedure voor de rechter van de verzoekende vreemde
      staat aanhangig is, is deze in zijn klaagschrift of vordering niet ontvankelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel150
