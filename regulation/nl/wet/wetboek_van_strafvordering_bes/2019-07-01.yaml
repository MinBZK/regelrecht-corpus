      Heeft de procureur-generaal tevens een vordering ingediend tot het gelasten van gehele of gedeeltelijke
      tenuitvoerlegging van een met toepassing van [artikel 17a van het Wetboek van Strafrecht BES][ref1] opgelegde
      straf, dan beraadslaagt het Hof mede over zijn bevoegdheid om over de vordering te oordelen, over de
      ontvankelijkheid van de procureur-generaal en over de gegrondheid van de vordering. Het vonnis houdt alsdan, tenzij
      onbevoegdheid van het Hof om over de vordering te oordelen of niet-ontvankelijkheid van de procureur-generaal wordt
      uitgesproken, ook de beslissing van het Hof over de vordering in.


