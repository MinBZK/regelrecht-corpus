  - number: '109'
    text: |-
      1 Tenzij de verdachte ter gelegenheid van zijn verhoor mondeling is meegedeeld dat een bevel tot voorlopige
      hechtenis tegen hem zal worden uitgevaardigd, wordt hij binnen vierentwintig uren na zijn opneming in de plaats
      waarin de voorlopige hechtenis zal worden ondergaan, gehoord.

      2 Het horen geschiedt gedurende het voorbereidend onderzoek door de rechter-commissaris; na de aanvang van het
      onderzoek op de terechtzitting in eerste aanleg door de rechter in eerste aanleg; na de aantekening van beroep van
      de einduitspraak door het Hof van Justitie dan wel een lid van dat college.

      3 Van het horen wordt met overeenkomstige toepassing van de [artikelen 213 tot en met 218][ref1] steeds proces-
      verbaal opgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel213
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '213'
        afdeling: Tweede
  - number: '110'
    text: |-
      1 Het bevel tot voorlopige hechtenis of tot verlenging van de geldigheidsduur daarvan is gedagtekend en
      ondertekend.

      2 Het omschrijft het strafbare feit op zodanige wijze, dat de verdachte daaruit redelijkerwijze kan begrijpen,
      welke verdenking ten aanzien van hem is gerezen, alsmede de feiten of omstandigheden waaruit blijkt dat de in
      [artikel 101][ref1] gestelde voorwaarden zijn vervuld.

      3 De verdachte wordt in het bevel met naam, voornamen en andere bekende

      persoonsgegevens aangeduid of, wanneer deze onbekend zijn, zo duidelijk mogelijk aangewezen.

      4 Het bevel vermeldt voorts het tijdstip waarop en de duur waarvoor het is verleend, alsmede de plaats waarin de
      voorlopige hechtenis zal worden ondergaan.

      5 Het wordt voor of bij de tenuitvoerlegging aan de verdachte betekend.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel101
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '101'
        afdeling: Vierde
  - number: '111'
    text: |-
      1 De rechter kan hetzij ambtshalve, hetzij op de vordering van het openbaar ministerie of op het verzoek van de
      verdachte of diens raadsman, bevelen, dat de voorlopige hechtenis zal worden geschorst, zodra de verdachte al of
      niet onder zekerheidstelling zich, in de vorm door de rechter te bepalen, bereid heeft verklaard tot nakoming van
      de aan de schorsing te verbinden voorwaarden.

      2 Onder de voorwaarden van de schorsing wordt steeds opgenomen:

      a. dat de verdachte, indien de opheffing van de schorsing mocht worden bevolen, zich aan de tenuitvoerlegging van
      het bevel tot voorlopige hechtenis niet zal onttrekken, en

      b. dat de verdachte, ingeval hij wegens het feit, waarvoor de voorlopige hechtenis is bevolen, tot andere dan
      vervangende vrijheidsstraf mocht worden veroordeeld, zich aan de tenuitvoerlegging daarvan niet zal onttrekken.

      3 De zekerheidstelling voor de nakoming van de voorwaarden bestaat in de storting van geldswaarden door de
      verdachte of een derde.

      4 De rechter bepaalt in zijn beslissing het bedrag waarvoor, en de wijze waarop zekerheid zal zijn te stellen.

      5 De verdachte wordt op het eerste verzoek of de eerste vordering gehoord.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel111
  - number: '112'
    text: |-
      De rechter kan ambtshalve, op de vordering van het openbaar ministerie of op het verzoek van de verdachte in de
      beslissing tot schorsing wijziging brengen. De verdachte wordt gehoord.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel112
  - number: '113'
    text: |-
      1 De rechter kan ambtshalve of op de vordering van het openbaar ministerie te allen tijde de opheffing van de
      schorsing bevelen.

      2 Alvorens daartoe over te gaan, hoort de rechter zo mogelijk de verdachte en kan hij te dien einde, zo nodig onder
      bijvoeging van een bevel tot medebrenging, diens dagvaarding gelasten.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel113
  - number: '114'
    text: |-
      De bevoegdheid tot schorsing, tot opheffing van de schorsing of tot wijziging van de aan de schorsing verbonden
      voorwaarden komt toe aan de rechter, die de voorlopige hechtenis heeft bevolen. Indien de zaak ter terechtzitting
      aanhangig is gemaakt, is de rechter die over de zaak oordeelt of het laatst heeft geoordeeld, daartoe bevoegd.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel114
  - number: 114a
    text: |-
      1 Indien de opheffing geschiedt wegens het niet nakomen van voorwaarden, kan bij de beslissing tot opheffing de
      zekerheid vervallen worden verklaard aan de Staat.

      2 De beslissing geldt als een onherroepelijke uitspraak van de burgerlijke rechter en wordt als zodanig ten uitvoer
      gelegd.

      3 Indien de verdachte zich na de opheffing van de schorsing aan de tenuitvoerlegging van het bevel tot voorlopige
      hechtenis onttrekt, wordt, indien dit nog niet is gebeurd, de zekerheid vervallen verklaard aan de Staat. De
      zekerheid wordt eveneens, ook zonder dat de opheffing van de schorsing is bevolen, vervallen verklaard aan de
      Staat, indien de verdachte de voorwaarde bedoeld in [artikel 111, tweede lid, onderdeel b][ref1], niet nakomt. De
      beslissing wordt ambtshalve of op vordering van het openbaar ministerie gegeven. Het tweede lid is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel111
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel114a
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '111'
        afdeling: Tiende
  - number: '115'
    text: |-
      1 Indien de verdachte de voorwaarden niet naleeft, of indien uit bepaalde omstandigheden blijkt van het bestaan
      van gevaar voor vlucht, kan zijn aanhouding worden bevolen door de officier van justitie of een hulpofficier van
      justitie. Deze laatste geeft van zijn bevel en van de aanhouding krachtens dat bevel onverwijld kennis aan de
      officier van justitie.

      2 Indien de officier van justitie de gedane aanhouding noodzakelijk blijft achten, dient hij onverwijld zijn
      vordering bij de rechter in, die binnen tweemaal vierentwintig uren daarna beslist.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel115
  - number: '116'
    text: |-
      De beslissingen tot schorsing, tot opheffing daarvan en die tot wijziging van de beslissing zijn dadelijk
      uitvoerbaar.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel116
  - number: '117'
    text: |-
      1 Tegen de beschikkingen van de rechter-commissaris of van de rechter in eerste aanleg tot schorsing of tot
      wijziging van een beslissing tot schorsing, staat voor de officier van justitie uiterlijk drie dagen daarna beroep
      bij het Hof van Justitie open.

      2 De verdachte, die schorsing of opheffing van de voorlopige hechtenis dan wel wijziging van een beslissing tot
      schorsing heeft verzocht, kan van een afwijzende beslissing op dat verzoek uiterlijk drie dagen na de betekening
      bij het Hof van Justitie in hoger beroep komen. De verdachte kan, ongeacht de aard van de beslissing, slechts
      eenmaal in beroep komen.

      3 Tegen de door het Hof bevolen schorsing of wijziging van een beslissing tot schorsing is geen voorziening
      toegelaten.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel117
  - number: '118'
    text: Waar in deze paragraaf wordt gesproken van schorsing, wordt daaronder begrepen opschorting.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel118
  - number: '119'
    text: |-
      1 Vatbaar voor inbeslagneming zijn alle voorwerpen en vorderingen die kunnen dienen om de
      waarheid aan de dag te brengen of om wederrechtelijk verkregen voordeel, als bedoeld in
      [artikel 38e van het Wetboek van Strafrecht BES][ref1], aan te tonen.

      2 Voorts zijn vatbaar voor inbeslagneming alle voorwerpen en vorderingen welker verbeurdverklaring of onttrekking
      aan het verkeer kan worden bevolen.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel38e
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: 38e
  - number: 119a
    text: |-
      1 In geval van verdenking van een misdrijf, waarop naar de wettelijke omschrijving gevangenisstraf van ten hoogste
      vier of meer jaren is gesteld, of een misdrijf, waardoor op geld waardeerbaar voordeel van enig belang kan worden
      verkregen, kunnen voorwerpen inbeslaggenomen worden tot bewaring van het recht tot verhaal voor een ter zake van
      dat misdrijf op te leggen geldboete.

      2 In geval van verdenking van of veroordeling wegens een misdrijf, waarop naar de wettelijke omschrijving
      gevangenisstraf van ten hoogste vier of meer jaren is gesteld, of een misdrijf, waardoor op geld waardeerbaar
      voordeel van enig belang kan worden verkregen, kunnen voorwerpen in beslag worden genomen tot bewaring
      van het recht tot verhaal voor een naar aanleiding van dat misdrijf op te leggen verplichting tot betaling
      van een geldbedrag aan de Staat ter ontneming van wederrechtelijk verkregen voordeel als bedoeld in
      [artikel 38e van het Wetboek van Strafrecht BES][ref1].

      3 Voorwerpen die toebehoren aan een ander dan degene aan wie, in het in het eerste lid bedoelde geval, de geldboete
      kan worden opgelegd of degene aan wie, in het in het tweede lid bedoelde geval, het wederrechtelijk verkregen
      voordeel kan worden ontnomen, kunnen in beslag worden genomen indien:

      a. die voorwerpen, onmiddellijk of middellijk, afkomstig zijn van het misdrijf in verband waarmee de geldboete kan
      worden opgelegd onderscheidenlijk het wederrechtelijk verkregen voordeel kan worden ontnomen, en

      b. voldoende aanwijzingen bestaan dat die voorwerpen aan die ander zijn gaan toebehoren met het doel de uitwinning
      van die voorwerpen te bemoeilijken of te verhinderen, en

      c. die ander ten tijde van dat gaan toebehoren wist of redelijkerwijs kon vermoeden dat die voorwerpen van enig
      misdrijf afkomstig waren.

      4 In het geval, bedoeld in het derde lid, kunnen tevens andere aan de betrokken persoon toebehorende voorwerpen in
      beslag worden genomen, tot ten hoogste de waarde van de in het derde lid bedoelde voorwerpen.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel38e
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel119a
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: 38e
  - number: 119b
    text: |-
      Voor de toepassing van de [artikelen 119][ref1] en [119a][ref2] geldt:

      a. dat beslag op vorderingen wordt gelegd en beëindigd door een schriftelijke kennisgeving aan de schuldenaar;

      b. dat bij het leggen en beëindigen van beslag op onroerende goederen de tussenkomst van
      de deurwaarder wordt ingeroepen en formaliteiten in acht worden genomen welke ingevolge het
      [Wetboek van Burgerlijke Rechtsvordering BES][ref3] gelden ten aanzien van de mededeling of aanzegging van de
      inbeslagneming, dan wel de betekening van het proces-verbaal van inbeslagneming, de aantekening, inschrijving of
      doorhaling in registers en de betekening daarvan aan derden;

      c. dat bij het leggen of beëindigen van beslag op schepen en luchtvaartuigen formaliteiten in acht worden genomen
      welke ingevolge het [Wetboek van Burgerlijke Rechtsvordering BES][ref4] gelden ten aanzien van de betekening van
      het proces-verbaal van inbeslagneming, en ingevolge enige regeling inzake teboekgestelde schepen onderscheidenlijk
      luchtvaartuigen ten aanzien van de inschrijving en doorhaling daarvan in registers.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel119
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel119a
      [ref3]: https://wetten.overheid.nl/BWBR0028496
      [ref4]: https://wetten.overheid.nl/BWBR0028496
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel119b
