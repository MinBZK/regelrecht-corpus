  - number: 592a
    text: |-
      1 Indien de in de vreemde staat opgelegde sanctie uitsluitend strekt tot de betaling van een geldboete, eventueel
      onder bedreiging met een vervangende tot vrijheidsontneming strekkende sanctie, wordt deze ten uitvoer gelegd
      krachtens een beslissing van de procureur-generaal.

      2 Alvorens een beslissing te nemen ingevolge het eerste lid stelt de procureur-generaal de veroordeelde in de
      gelegenheid te worden gehoord.

      3 De procureur-generaal drukt overeenkomstig het bepaalde in het toepasselijke verdrag het bedrag van de geldboete
      uit valuta van Bonaire, Sint Eustatius en Saba. Indien het verdrag daaromtrent geen voorschriften bevat bepaalt
      de procureur-generaal de hoogte van het bedrag volgens de wisselkoers die gold op het tijdstip van veroordeling in
      de vreemde staat. Als wisselkoers geldt de middenkoers zoals dagelijks vastgesteld en genoteerd door de Europese
      Centrale Bank.

      4 Voor valuta waarvan de wisselkoers niet dagelijks door de Europese Centrale Bank wordt vastgesteld en genoteerd
      geldt de wisselkoers die wordt verkregen uit de waarde in speciale trekkingsrechten van de desbetreffende valuta op
      de laatste werkdag van de maand waarin de teenuitvoer te leggen sanctie in de vreemde staat werd opgelegd.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel592a
  - number: 592b
    text: |-
      1 De ingevolge [artikel 592a][ref1] genomen beslissing en de dag waarop het daarbij vastgestelde bedrag moet worden
      voldaan, worden vanwege de procureur-generaal zo spoedig mogelijk aan de veroordeelde ter kennis gebracht.

      2 Tegen de beslissing van de procureur-generaal kan de veroordeelde binnen veertien dagen nadat zich een
      omstandigheid heeft voorgedaan, waaruit voortvloeit dat de beslissing hem bekend is, een bezwaarschrift indienen
      bij het Hof, indien de opgelegde geldboete het bedrag van USD 27,93 overschrijft.

      3 Op de wijze van indiening en intrekking van een bezwaarschrift zijn de [artikelen 445, tweede lid][ref2],
      [446 tot en met 451][ref3] van overeenkomstige toepassing.

      4 Op de behandeling van het bezwaarschrift zijn de [artikelen 38 tot en met 42][ref4], [47][ref5] en [48][ref6] van
      overeenkomstige toepassing.

      5 Verklaart het Hof het bezwaar gegrond, dan vernietigt het de beslissing van de procureur-generaal of vult deze
      aan met inachtneming van het bepaalde in [artikel 27 van het Wetboek van Strafrecht BES][ref7]. Acht het, ondanks
      vernietiging de tenuitvoerlegging wel toelaatbaar, dan doet het Hof hetgeen de procureur-generaal had behoren te
      doen. In alle gevallen dat het Hof de tenuitvoerlegging van een geldboete toelaatbaar verklaard, bepaalt het tevens
      de duur van de vervangende hechtenis.

      6 De [artikelen 591, derde lid][ref8], en [592][ref9], zijn van toepassing.


