  - number: 177d
    text: |-
      1 De officier van justitie die de in [artikel 177a][ref1] bedoelde vordering doet, kan bij dringende
      noodzakelijkheid ter inbeslagneming huiszoeking doen op elke plaats waar zich vermoedelijk bescheiden
      of gegevens als bedoeld in [artikel 177b][ref2], of vermogensbestanddelen die voordeel in de zin van
      [artikel 38e van het Wetboek van Strafrecht BES][ref3] vertegenwoordigen, bevinden.

      2 Ten aanzien van het eerste lid is [artikel 122, tweede lid][ref4], van overeenkomstige toepassing en zijn de
      [artikelen 155 tot en met 164][ref5] van toepassing.


