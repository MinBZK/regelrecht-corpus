  - number: '533'
    text: |-
      1 De verdachte op wie [artikel 531, tweede lid][ref1], onderdeel a, van toepassing is, wordt zo spoedig mogelijk
      overgeleverd aan de officier van justitie; de verdachte op wie artikel 531, tweede lid, onderdeel b, van
      toepassing is, kan worden overgeleverd aan de officier van justitie, ingeval het niet doenlijk is hem elders op
      te houden, totdat een bevel tot voorlopige hechtenis tegen hem is verleend en de tenuitvoerlegging, ook buiten het
      rechtsgebied van Bonaire, Sint Eustatius en Saba, is gelast.

      2 Van het voornemen tot overlevering over te gaan wordt onverwijld bericht gegeven aan de officier van justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel531
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel533
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '531'
        afdeling: Tweede
  - number: '534'
    text: |-
      1 Degene in wiens handen een aangehouden verdachte zich bevindt, zorgt dat de nodige maatregelen worden genomen
      om te voorkomen, dat het doel van de vrijheidsontneming wordt gemist. De verdachte mag aan geen andere beperkingen
      worden onderworpen dan die voor dit doel volstrekt noodzakelijk zijn.

      2 Aan de verdachte wordt gelegenheid gegeven zich met een raadsman in verbinding te stellen.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel534
  - number: '535'
    text: |-
      1 De officier van justitie kan bepalen, dat de aangehoudene, tegen wie ernstige bezwaren bestaan, aan zijn lichaam
      of kleding zal worden onderzocht. [Artikel 78, derde lid][ref1], is van toepassing.

      2 De bevoegdheid, vermeld in [artikel 78, tweede lid][ref2], komt, indien ter plaatse geen opsporingsambtenaar
      aanwezig is, mede toe aan de commandant, de schipper en de gezagvoerder van het luchtvaartuig.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel78
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel78
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel535
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '78'
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '78'
  - number: '536'
    text: |-
      1 Opsporingsambtenaren zijn te allen tijde bevoegd tot inbeslagneming van daarvoor vatbare voorwerpen en kunnen
      daartoe hun uitlevering vorderen. De officier van justitie kan de inbeslagneming van daarvoor vatbare voorwerpen
      bevelen.

      2 In geval van ontdekking op heterdaad komen de bevoegdheden, genoemd in de eerste volzin van het eerste lid,
      toe aan de commandant, aan de schipper en aan de gezagvoerder van het luchtvaartuig, voor zover ter plaatse geen
      opsporingsambtenaar aanwezig is.

      3 Met betrekking tot de overlevering van het inbeslaggenomen voorwerp is [artikel 532][ref1] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel532
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel536
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '532'
        afdeling: Tweede
  - number: '537'
    text: |-
      De officier van justitie kan een inbeslaggenomen voorwerp doen teruggeven, voordat het onder de hoede is gesteld
      van de bewaarder. De last tot teruggave wordt gericht tot hem die het voorwerp onder zich heeft. Deze is verplicht
      daaraan onmiddellijk te voldoen.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel537
  - number: '538'
    text: |-
      1 De opsporingsambtenaren kunnen te allen tijde inzage vorderen van de bescheiden, waarvan naar hun redelijk
      oordeel inzage nodig is voor de vervulling van hun taak.

      2 Personen die uit hoofde van hun stand, beroep of ambt tot geheimhouding verplicht zijn, kunnen de inzage weigeren
      van bescheiden of gedeelten daarvan, tot welke hun plicht tot geheimhouding zich uitstrekt.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel538
  - number: '539'
    text: |-
      1 De opsporingsambtenaren hebben te allen tijde toegang tot alle plaatsen, waarvan naar hun redelijk oordeel
      de betreding nodig is voor de vervulling van hun taak. De commandant en de schipper kunnen ter aanhouding van
      de verdachte of ter inbeslagneming alle plaatsen betreden, waarvan te dien einde de betreding naar hun redelijk
      oordeel nodig is.

      2 De artikelen [155 tot en met 160][ref1] blijven buiten toepassing. De [artikelen 162][ref2] en [163][ref3] zijn
      ten aanzien van de commandant en de schipper van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel155
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel162
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel163
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel539
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '155'
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '162'
      - id: ref3
        bwb_id: BWBR0028681
        artikel: '163'
  - number: '540'
    text: |-
      De gezagvoerder van een luchtvaartuig kan op de voet van artikel 9, eerste lid, van het Verdrag inzake strafbare
      feiten en bepaalde andere handelingen begaan aan boord van luchtvaartuigen (Trb. 1964, 115 en 164) aan de bevoegde
      autoriteiten van een vreemde staat overdragen iedere inzittende van het luchtvaartuig, van wie hij redelijkerwijze
      vermoedt, dat deze aan boord een misdrijf heeft begaan, waarop naar de wettelijke omschrijving een gevangenisstraf
      van vier jaar of meer is gesteld.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel540
  - number: '541'
    text: |-
      1 De schipper geeft onverwijld en op de snelst mogelijke wijze kennis aan de officier van justitie van elk misdrijf
      aan boord begaan, waardoor de veiligheid van het vaartuig of van de opvarenden in gevaar is gebracht of waardoor
      iemands dood of zwaar lichamelijk letsel is veroorzaakt.

      2 Voor de toepassing van het eerste lid wordt onder vaartuig begrepen een installatie ter zee en wordt onder een
      misdrijf, aan boord begaan, begrepen een misdrijf, begaan op zulk een installatie.

      3 [Artikel 522, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel522
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel541
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '522'
        afdeling: Eerste
  - number: '542'
    text: |-
      1 De schipper zorgt dat aan boord een register van strafbare feiten aanwezig is, blad voor blad genummerd en
      gewaarmerkt door een ambtenaar, te wiens overstaan de monstering geschiedt.Voor het waarmerken worden geen kosten
      in rekening gebracht.

      2 Hij zorgt dat in het register onverwijld wordt vermeld:

      a. elk te zijner kennis gekomen misdrijf als bedoeld in [artikel 541][ref1];

      b. elk strafbaar feit ten aanzien waarvan hij van een bevoegdheid als bedoeld in [artikel 522, eerste lid][ref2],
      gebruik heeft gemaakt;

      c. elk strafbaar feit, aan boord van zijn schip of door een opvarende begaan, waarvan door een opvarende vermelding
      in het register wordt verlangd of waarvan hij zelf de vermelding wenselijk acht.

      3 Bij toepassing van het tweede lid worden vermeld: de plaats waar en het tijdstip waarop het feit is begaan, de
      personalia en nationaliteit van de verdachte en van de getuigen, alsmede de maatregelen ingevolge de bepalingen van
      deze titel genomen door de schipper of op zijn aanwijzing door de scheepsofficier.

      4 De vermeldingen worden gedagtekend en door de schipper ondertekend.

      5 De schipper doet het register viseren door de daartoe bevoegde ambtenaar. Onze Minister van Justitie kan terzake
      nadere regels stellen.

      De schipper geeft het register op eerste vordering van een opsporingsambtenaar aan deze ter inzage.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel541
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel522
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel542
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '541'
        afdeling: Derde
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '522'
        afdeling: Eerste
  - number: '543'
    text: |-
      1 De schipper geeft aan de ambtenaar, die krachtens enige wettelijke bepaling toegang heeft tot zijn vaartuig, op
      diens eerste vordering gelegenheid zich aan of van boord te begeven.

      2 De ambtenaar is in de rechtmatige uitoefening van zijn bediening niet onderworpen aan het gezag van de schipper
      over de opvarenden.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel543
  - number: '544'
    text: |-
      De bepalingen van het [Derde Boek][ref1] zijn op deze titel van toepassing, voor zover daarin niet uitdrukkelijk
      anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0028681
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel544
    references:
      - id: ref1
        bwb_id: BWBR0028681
  - number: '545'
    text: |-
      In het geval van ontdekking op heterdaad van enig strafbaar feit, waardoor de openbare orde ernstig is aangerand
      en ter zake waarvan voorlopige hechtenis niet is toegelaten, kunnen de maatregelen in de navolgende bepalingen
      omschreven, worden toegepast, indien tegen de verdachte gewichtige bezwaren bestaan en er groot gevaar is voor
      herhaling of voortzetting van dat feit.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel545
  - number: '546'
    text: |-
      1 De officier van justitie is bevoegd de verdachte te doen aanhouden, en hem onverwijld te doen geleiden voor de
      rechter-commissaris.

      2 De officier van justitie is eveneens bevoegd getuigen, deskundigen en tolken te doen oproepen om te verschijnen
      voor de rechter-commissaris. De oproeping kan ook mondeling door een deurwaarder of schriftelijk door een ambtenaar
      van politie geschieden; de officier kan ook zelf mondeling oproepen.

      3 De verdachte wordt met het oog op het onderzoek op last van de officier van justitie op een door hem aan te
      wijzen plaats opgehouden, gedurende ten hoogste acht dagen.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel546
  - number: '547'
    text: |-
      1 De officier van justitie is bij het onderzoek door de rechter-commissaris tegenwoordig en doet, na de zaak te
      hebben voorgedragen, de vorderingen die hij in verband met de bepalingen van deze titel nodig oordeelt.

      2 De rechter-commissaris onderzoekt aanstonds de zaak. Het onderzoek geldt als
      een gerechtelijk vooronderzoek en wordt overeenkomstig de bepalingen van de
      [tweede tot en met de zevende afdeling van de Derde Titel van het Vierde Boek][ref1] gevoerd.

      3 De rechter-commissaris is bevoegd, zo nodig onder bijvoeging van een bevel tot medebrenging, te gelasten dat door
      de officier van justitie of de verdachte aangewezen getuigen, deskundigen en tolken voor hem zullen verschijnen. De
      oproeping geschiedt overeenkomstig het tweede lid van [artikel 546][ref2].

      4 In dat geval kan de rechter-commissaris het onderzoek voor ten hoogste vierentwintig uren schorsen.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#AfdelingTweede
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel546
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel547
    references:
      - id: ref1
        bwb_id: BWBR0028681
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '546'
  - number: '548'
    text: |-
      1 Indien de rechter-commissaris geen termen aanwezig acht tot toepassing van enige maatregel op grond van
      [artikel 545][ref1], beveelt hij de onmiddellijke invrijheidstelling van de verdachte.

      2 In het andere geval geeft de rechter-commissaris op de vordering van de officier van justitie de verdachte voor
      een bepaalde termijn de nodige bevelen ter voorkoming van herhaling of voortzetting van het feit en vordert van hem
      een bereidverklaring tot nakoming van die bevelen. De termijn eindigt van rechtswege op het tijdstip dat het ter
      zake van het strafbare feit gewezen vonnis in kracht van gewijsde is gegaan, of, indien daarbij straf of maatregel
      is opgelegd, zodra het vonnis kan worden tenuitvoergelegd.

      3 De bevelen mogen de godsdienstige of staatkundige vrijheid niet beperken.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel545
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel548
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '545'
  - number: '549'
    text: |-
      Indien de bereidverklaring wordt afgelegd, beveelt de rechter-commissaris de onmiddellijke invrijheidstelling van
      de verdachte.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel549
  - number: '550'
    text: |-
      1 Indien de bereidverklaring niet wordt afgelegd, beveelt de rechter-commissaris dat de ophouding van de verdachte
      zal voortduren.

      2 De ophouding is van kracht gedurende een in het bevel te bepalen termijn van ten hoogste vijf dagen welke ingaat
      op de dag van de tenuitvoerlegging. [Artikel 102, eerste lid][ref1], is van overeenkomstige toepassing. Het bevel
      tot ophouding is dadelijk uitvoerbaar.

      3 Op de vordering van de officier van justitie kan het bevel tot ophouding door de rechter-commissaris eenmaal
      met ten hoogste vijf dagen worden verlengd. De verdachte wordt in de gelegenheid gesteld op de vordering te worden
      gehoord.

      4 De rechter-commissaris beslist met inachtneming van het eerste lid, zomede van de [artikelen 548][ref2] en
      [549][ref3].

      5 De verdachte kan van het bevel tot ophouding binnen drie dagen na de tenuitvoerlegging in hoger beroep komen bij
      het Hof van Justitie dat beslist, na de verdachte te hebben gehoord.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel102
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel548
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel549
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel550
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '102'
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '548'
      - id: ref3
        bwb_id: BWBR0028681
        artikel: '549'
  - number: '551'
    text: |-
      1 Zodra het grote gevaar voor herhaling of voortzetting van het feit is geweken, beveelt de officier van justitie
      de onmiddellijke invrijheidstelling van de verdachte.

      2 De rechter-commissaris kan te allen tijde, hetzij ambtshalve, hetzij op de vordering van de officier van justitie
      of op het verzoek van de verdachte, de invrijheidstelling van de verdachte bevelen. [Artikel 549][ref1] is van
      toepassing.

      3 Het Hof van Justitie kan, ambtshalve of op het verzoek van de verdachte, het bevel tot ophouding opheffen.
      [Artikel 103, tweede lid][ref2], is van toepassing.

      4 Het bevel kan mede worden opgeheven bij de uitspraak van het vonnis ter zake van het in [artikel 545][ref3]
      bedoelde feit gewezen. De opheffing wordt daarbij steeds bevolen, indien straf of maatregel ter zake van dat feit
      niet wordt opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel549
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel103
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel545
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel551
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '549'
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '103'
        afdeling: Vijfde
      - id: ref3
        bwb_id: BWBR0028681
        artikel: '545'
  - number: '552'
    text: |-
      1 Indien de verdachte de hem gegeven bevelen niet nakomt, is iedere opsporingsambtenaar bevoegd hem aan te houden
      en onverwijld opnieuw te geleiden voor de officier van justitie. De opsporingsambtenaar kan, ter aanhouding van de
      verdachte, elke plaats betreden. De [artikelen 155 tot en met 164][ref1] zijn van toepassing.

      2 In dit geval of indien de verdachte niet kon worden aangehouden, vordert de officier van justitie onverwijld dat
      de rechter-commissaris ter zake een onderzoek zal instellen. Deze geeft daaraan zo spoedig mogelijk gevolg.

      3 Ten aanzien van het onderzoek en het oproepen van getuigen gelden de voorgaande bepalingen van deze titel.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel155
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel552
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '155'
  - number: '553'
    text: |-
      1 Indien de rechter-commissaris op grond van het onderzoek, bedoeld in [artikel 552][ref1], daartoe termen aanwezig
      acht, beveelt hij de onmiddellijke invrijheidstelling van de verdachte.

      2 In het andere geval beveelt de rechter-commissaris, indien de verdachte zich aan overtreding van de hem
      gegeven bevelen heeft schuldig gemaakt, dat deze op een door hem aangewezen plaats zal worden opgehouden. De
      [artikelen 550, tweede, derde en vijfde lid][ref2], en [551][ref3], met uitzondering van de tweede volzin van het
      tweede lid, zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel552
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel550
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel551
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel553
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '552'
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '550'
      - id: ref3
        bwb_id: BWBR0028681
        artikel: '551'
  - number: '554'
    text: |-
      Tegen de beslissing tot afwijzing van een door de officier van justitie krachtens de bepalingen van deze titel
      genomen vordering staat geen beroep open.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel554
  - number: '555'
    text: |-
      1 De navolgende artikelen van deze titel zijn van toepassing op verzoeken om rechtshulp door autoriteiten van een
      vreemde staat in verband met een strafzaak gedaan, en gericht tot een al dan niet met name aangeduid orgaan van
      de justitie of de politie van Bonaire, Sint Eustatius en Saba, voor zover in de afdoening niet is voorzien in het
      bepaalde bij of krachtens andere wettelijke regelingen.

      2 Als verzoeken om rechtshulp worden aangemerkt verzoeken tot het verrichten van handelingen van onderzoek of het
      verlenen van medewerking daaraan, het toezenden van documenten, dossiers of stukken van overtuiging of het geven
      van inlichtingen, dan wel het betekenen of uitreiken van stukken of het doen van aanzeggingen of mededelingen aan
      derden.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel555
  - number: '556'
    text: |-
      1 Het verzoek wordt, zo het niet tot een officier van justitie is gericht, door de geadresseerde onverwijld
      doorgezonden aan de officier van justitie.

      2 Indien uitsluitend om inlichtingen is gevraagd en voor het verkrijgen daarvan geen opsporingshandelingen nodig
      zijn, kan de doorzending achterwege blijven.

      3 Het tweede lid is niet van toepassing in de door Onze Minister van Justitie te bepalen gevallen.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel556
  - number: '557'
    text: De officier van justitie die het verzoek heeft ontvangen, beslist onverwijld omtrent het daaraan te geven gevolg.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel557
  - number: '558'
    text: |-
      1 Voor zover het verzoek is gegrond op een verdrag, wordt daaraan zoveel mogelijk het verlangde gevolg gegeven.

      2 In gevallen waarin het betreft een redelijk verzoek dat niet op een verdrag is gegrond, alsmede in gevallen
      waarin het toepasselijke verdrag niet tot inwilliging verplicht, wordt aan het verzoek voldaan, tenzij de
      inwilliging in strijd is met een wettelijk voorschrift of met een aanwijzing van Onze Minister van Justitie.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel558
  - number: '559'
    text: |-
      1 Aan het verzoek wordt geen gevolg gegeven:

      a. in gevallen waarin de verzoekende staat naar de regels van het volkenrecht rechtsmacht over de verdachte
      ontbeert;

      b. voor zover de verdachte op een met het volkenrecht strijdige wijze of anderszins onrechtmatige wijze het
      grondgebied van de verzoekende staat binnen is gebracht of gelokt, dan wel is gearresteerd en zijn vrijheid is
      ontnomen;

      c. voor zover het vermoeden bestaat dat het is gedaan ten behoeve van een onderzoek, ingesteld met het oogmerk de
      verdachte te vervolgen, te straffen of op andere wijze te treffen in verband met zijn godsdienstige of staatkundige
      overtuiging, zijn nationaliteit, zijn ras of de groep van de bevolking waartoe hij behoort;

      d. voor zover inwilliging zou strekken tot het verlenen van medewerking aan een vervolging of
      berechting die onverenigbaar is met het aan [artikel 70 van het Wetboek van Strafrecht BES][ref1] en
      [artikel 282, eerste lid, van het Wetboek van Strafvordering][ref2] ten grondslag liggende beginsel;

      e. voor zover het is gedaan ten behoeve van een onderzoek naar feiten ter zake waarvan de verdachte in de openbare
      lichamen Bonaire, Sint Eustatius en Saba wordt vervolgd.

      2 In gevallen waarin er grond bestaat om aan te nemen dat een situatie als bedoeld in onderdeel a of b van het
      eerste lid zich ter zake van het verzoek heeft voorgedaan, wordt het verzoek voorgelegd aan Onze Ministers van
      Buitenlandse Zaken en van Justitie. Een afwijzende beslissing op het verzoek wordt langs diplomatieke weg ter
      kennis van de autoriteiten van de verzoekende staat gebracht.

      3 In gevallen waarin grond bestaat voor een vermoeden als bedoeld in onderdeel c van het eerste lid wordt het
      verzoek voorgelegd aan Onze Minister van Justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel70
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel282
