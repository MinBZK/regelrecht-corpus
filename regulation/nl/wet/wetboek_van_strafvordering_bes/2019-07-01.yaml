  - number: '580'
    text: |-
      Indien de door de vreemde staat overgelegde stukken naar het oordeel van Onze Minister onvoldoende zijn om op
      een verzoek tot tenuitvoerlegging een beslissing te nemen, biedt hij de autoriteiten van de verzoekende staat de
      gelegenheid binnen een door hem te stellen redelijke termijn aanvullende stukken of inlichtingen te verschaffen.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel580
  - number: '581'
    text: |-
      1 Tenzij Onze Minister reeds aanstonds van oordeel is dat het verzoek om tenuitvoerlegging moet worden afgewezen,
      stelt hij het met de daarbij behorende stukken in handen van de procureur-generaal.

      2 Indien de procureur-generaal van oordeel is dat het verzoek niet voor inwilliging vatbaar is of dat aanleiding
      bestaat gebruik te maken van een van de in het toepasselijke verdrag omschreven gronden tot weigering van de
      tenuitvoerlegging, brengt hij dit oordeel onverwijld vergezeld van zijn advies ter kennis van Onze Minister, die
      daaromtrent beslist. De procureur-generaal deelt de veroordeelde die krachtens deze titel voorlopig zijn vrijheid
      is ontnomen, onverwijld mee op welke dag hij zijn advies aan Onze Minister heeft uitgebracht.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel581
  - number: '582'
    text: |-
      Wanneer een vreemde staat heeft bewilligd in de tenuitvoerlegging van een door deze opgelegde sanctie in de
      openbare lichamen Bonaire, Sint Eustatius en Saba, stelt Onze Minister de door de autoriteiten van die staat
      overgelegde stukken in handen van de procureur-generaal.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel582
  - number: '583'
    text: |-
      1 De procureur-generaal vordert binnen twee weken na de dag waarop hij de in [artikel 581][ref1] of [582][ref2]
      bedoelde stukken heeft ontvangen, schriftelijk, dat het Hof verlof verleent tot tenuitvoerlegging. Bij zijn
      vordering legt de procureur-generaal de stukken aan het Hof over. Een afschrift van de vordering wordt aan de
      veroordeelde betekend. Bij zijn vordering legt de procureur-generaal tevens een lijst van voorwerpen of vorderingen
      over, die ingevolge de [artikelen 579a tot en met 579e][ref3], in beslag zijn genomen.

      2 De in het eerste lid gestelde termijn wordt geschorst van het tijdstip waarop de procureur-generaal
      overeenkomstig [artikel 581, tweede lid][ref4], adviseert aan Onze Minister tot het tijdstip waarop de procureur-
      generaal van Onze Minister bericht ontvangt dat de tenuitvoerlegging dient te worden gevorderd.

      3 Indien de veroordeelde ingevolge deze titel voorlopig zijn vrijheid is ontnomen, eindigt de schorsing in ieder
      geval na veertien dagen.

      4 Het eerste tot en met het derde lid bepaalde is niet van toepassing, indien de ten uitvoer te leggen sanctie
      uitsluitend bestaat uit een geldboete.

      5 De [artikelen 197][ref5] en [486][ref6] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel581
