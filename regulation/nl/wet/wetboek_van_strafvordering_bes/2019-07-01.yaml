      - id: ref1
        bwb_id: BWBR0028681
        artikel: '365'
        afdeling: Tweede
  - number: '367'
    text: |-
      1 Niettegenstaande de schorsing is het Hof bevoegd te allen tijde het onderzoek op de terechtzitting voor bepaalde
      spoedeisende maatregelen tijdelijk te heropenen.

      2 De [artikelen 363][ref1], [364][ref2] en [365][ref3] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel363
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel364
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel365
