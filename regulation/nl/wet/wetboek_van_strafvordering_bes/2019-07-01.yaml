        artikel: '155'
  - number: '190'
    text: |-
      De officier van justitie kan ambtshalve of op het verzoek van de verdachte een of meer deskundigen
      benoemen ten einde hem voor te lichten of bij te staan en, zo nodig, met opdracht het door hem gevorderde
      onderzoek in te stellen en hem een met redenen omkleed verslag uit te brengen. De bepalingen van de
      [zesde afdeling van de Derde Titel][ref1] vinden overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#AfdelingZesde
