        artikel: '437'
  - number: '423'
    text: |-
      1 Indien de zaak aanhangig is gemaakt door oproeping, doet de officier van justitie, indien de oproeping enkel
      inhoudt een korte aanduiding van het feit, dat ten laste wordt gelegd, ter terechtzitting bij de aanvang van
      het onderzoek mondeling of, na voorlezing, schriftelijk nadere opgave van het feit, dat de verdachte ten laste
      wordt gelegd. De nadere opgave beantwoordt op straffe van nietigheid aan de korte aanduiding van het feit in de
      oproeping, behoudens verbetering of aanvulling.

      2 De oproeping, zo nodig door de officier van justitie ter terechtzitting verbeterd of aangevuld, geldt wat betreft
      de grondslag voor de verdere vervolging, als dagvaarding.

      3 Op verlangen van de rechter of van de verdachte wordt de nadere opgave hem op schrift gegeven.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel423
  - number: '424'
    text: |-
      Indien de verdachte bij zijn eerste verschijning ter terechtzitting aannemelijk maakt, dat hij in het belang van
      zijn verdediging uitstel behoeft, schorst de rechter het onderzoek voor een bepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel424
  - number: '425'
    text: |-
      1 De rechter geeft na de sluiting van het onderzoek op de terechtzitting hetzij onmiddellijk, hetzij diezelfde
      dag op een door hem bij de sluiting van het onderzoek te bepalen uur mondeling vonnis. De [artikelen 400][ref1] en
      [402, derde en vierde lid][ref2], blijven buiten toepassing.

      2 Het vonnis wordt in het proces-verbaal van de terechtzitting aangetekend.

      3 Zodra het proces-verbaal van de terechtzitting is getekend, kunnen de verdachte en zijn raadsman daarvan
      kennisnemen.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel400
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel402
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel425
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '400'
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '402'
        afdeling: Vijfde
  - number: '426'
    text: |-
      1 De rechter is bevoegd en, op de vordering van de officier van justitie of op het verzoek van de verdachte of zijn
      raadsman, verplicht schriftelijk vonnis te wijzen.

      2 De uitspraak mag alsdan in geen geval later plaatsvinden dan op de eenentwintigste dag na de sluiting van het
      onderzoek. [Artikel 388, vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel388
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel426
