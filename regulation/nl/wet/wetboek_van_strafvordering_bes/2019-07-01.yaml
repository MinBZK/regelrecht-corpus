        artikel: '356'
        afdeling: Tweede
  - number: '358'
    text: |-
      1 Indien aan het Hof de noodzakelijkheid blijkt van het verhoor van op de terechtzitting nog niet verhoorde
      getuigen of deskundigen, of van de overlegging van bescheiden of stukken van overtuiging, die niet op de
      terechtzitting aanwezig zijn, beveelt het zo nodig onder bijvoeging van een bevel tot medebrenging, tegen een door
      het Hof te bepalen tijdstip de dagvaarding van die getuigen of deskundigen of de overlegging van die bescheiden of
      die stukken van overtuiging.

      2 Het in het eerste lid bepaalde is niet van toepassing op de getuige, die overeenkomstig het bepaalde in
      [artikel 261][ref1] is verhoord.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel261
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel358
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '261'
        afdeling: Vijfde
  - number: '359'
    text: |-
      1 Indien enig onderzoek door de rechter-commissaris noodzakelijk blijkt, stelt het Hof met schorsing van de zaak
      onder aanduiding van het onderwerp van het onderzoek en, zo nodig, van de wijze waarop dit zal zijn in te stellen,
      de stukken in handen van de rechter-commissaris.

      2 Het onderzoek geldt als een gerechtelijk vooronderzoek en wordt overeenkomstig de bepalingen van de
      [artikelen 226 tot en met 271][ref1] gevoerd. Alsdan kan de rechter-commissaris de bevoegdheden die hem tijdens
      het gerechtelijk vooronderzoek en overigens tijdens het voorbereidend onderzoek na tussenkomst van de officier van
      justitie of op het verzoek van de verdachte zijn toegekend, ambtshalve uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel226
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel359
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '226'
        afdeling: Tweede
  - number: '360'
    text: |-
      1 Indien het noodzakelijk is dat een onderzoek naar de geestvermogens van de verdachte tegen wie voorlopige
      hechtenis is bevolen, wordt ingesteld en dit niet voldoende op een andere wijze kan plaatsvinden, beveelt het Hof
      bij een met redenen omklede beslissing dat de verdachte ter waarneming zal worden overgebracht naar een in het
      bevel aan te duiden inrichting tot verpleging of genezing bestemd.

      2 Het bevel wordt niet gegeven dan nadat het oordeel van een of meer deskundigen is ingewonnen en de procureur-
      generaal, de verdachte en zijn raadsman in de gelegenheid zijn gesteld om terzake te worden gehoord.

      3 [Artikel 177][ref1] is van toepassing met dien verstande dat het bevel, bedoeld bij het tweede lid van dat
      artikel, slechts door het Hof kan worden gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel177
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel360
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '177'
  - number: '361'
    text: |-
      1 Indien het Hof het houden van een schouw of het horen van getuigen of verdachten elders dan in de rechtszaal
      noodzakelijk acht, kan zij te dien einde, met schorsing van de zaak, bevelen dat de terechtzitting tijdelijk zal
      worden verplaatst.

      2 Het Hof is bevoegd daartoe met de personen door haar aangewezen elke plaats te betreden. Van het binnentreden
      in een woning zonder de uitdrukkelijke toestemming van de bewoner wordt binnen tweemaal vierentwintig uren proces-
      verbaal opgemaakt. [Artikel 163, derde lid][ref1], is van overeenkomstige toepassing.

      3 Het Hof is bevoegd, naar aanleiding van de gesteldheid van de plaats waar de tijdelijke terechtzitting zal worden
      gehouden, de nodige voorschriften te geven voor de wijze van behandeling van de zaak op die terechtzitting.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel163
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel361
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '163'
  - number: '362'
    text: |-
      1 In alle gevallen, waarin het onderzoek wordt onderbroken of voor een bepaalde tijd geschorst, wordt door de
      voorzitter aan de aanwezige verdachte en aan de aanwezige getuigen, deskundigen en tolken mondeling het tijdstip
      aangezegd, waarop zij op de terechtzitting aanwezig zullen moeten zijn, tenzij het Hof, de procureur-generaal en
      de verdachte gehoord, bepaalt dat hun tegenwoordigheid bij de nadere behandeling niet is vereist. De aanzegging
      geldt als dagvaarding. Bij niet-verschijning van getuigen, deskundigen of tolken op het aangewezen tijdstip is
      [artikel 321][ref1] van toepassing.

      2 De verdachte, getuigen, deskundigen en tolken, die bij de in het eerste lid bedoelde aanzegging niet op de
      terechtzitting aanwezig zijn, worden, in geval van schorsing, voor de nadere behandeling opnieuw opgeroepen of
      gedagvaard, tenzij het Hof, de procureur-generaal en de verdachte gehoord, bepaalt dat hun tegenwoordigheid bij de
      nadere behandeling niet is vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel321
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel362
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '321'
        afdeling: Tweede
  - number: '363'
    text: |-
      1 In alle gevallen waarin het onderzoek voor een onbepaalde tijd is geschorst, wordt, zodra de oorzaak van
      de schorsing is vervallen, de verdachte opgeroepen en worden de getuigen, deskundigen en tolken opnieuw ter
      terechtzitting voor de nadere behandeling bepaald, gedagvaard, tenzij het Hof, de procureur-generaal en de
      verdachte gehoord, bepaalt dat hun tegenwoordigheid bij de nadere behandeling niet is vereist.

      2 De verdachte, getuigen, deskundigen en tolken die, ofschoon opgeroepen of gedagvaard, niet op de terechtzitting
      zijn verschenen, worden opnieuw opgeroepen of gedagvaard, tenzij het Hof, de procureur-generaal en de verdachte
      gehoord, bepaalt dat hun tegenwoordigheid bij de nadere behandeling niet is vereist.

      3 Hetgeen bij [artikel 290][ref1] ten opzichte van de dagvaarding van de verdachte is bepaald, geldt hier ten
      aanzien van de oproeping van de verdachte.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel290
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel363
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '290'
  - number: '364'
    text: |-
      1 In alle gevallen, waarin, na schorsing, het onderzoek op een nadere terechtzitting wordt hervat, kunnen nieuw
      bij te brengen, nog niet verhoorde getuigen en deskundigen overeenkomstig de [artikelen 287, eerste lid][ref1], en
      [289][ref2] worden gedagvaard.

      2 [Artikel 287, tweede en derde lid][ref3], vindt overeenkomstig toepassing.

      3 De nieuw bijgebrachte getuigen worden op de getuigenlijst geplaatst.

      4 [Artikel 318, derde lid][ref4], is van toepassing.

      5 De bepalingen strekkende tot bescherming van de bedreigde getuige zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel287
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel289
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel287
      [ref4]: https://wetten.overheid.nl/BWBR0028681#Artikel318
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel364
