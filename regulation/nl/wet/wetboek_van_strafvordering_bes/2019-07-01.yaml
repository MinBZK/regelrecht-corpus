  - number: 629a
    text: |-
      1 Op voorwerpen en vorderingen, inbeslaggenomen op grond van [artikel 119a][ref1], geschiedt het verhaal op
      de wijze voorzien in het [Wetboek van Burgerlijke Rechtsvordering BES][ref2] krachtens de onherroepelijke
      einduitspraak waarbij de geldboete is opgelegd.

      2 De einduitspraak, bedoeld in het eerste lid, geldt als executoriale titel. Betekening van deze titel aan de
      veroordeelde en, zo het beslag onder een derde is gelegd, ook aan deze, kan plaatsvinden door betekening van een
      kennisgeving inhoudende de bij de einduitspraak opgelegde straf, voor zover voor het nemen van verhaal van belang.

      3 Ten aanzien van derden die geheel of gedeeltelijk recht menen te hebben op de inbeslaggenomen voorwerpen en
      vorderingen zijn de bepalingen van het [Wetboek van Burgerlijke Rechtsvordering BES][ref3] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel119a
      [ref2]: https://wetten.overheid.nl/BWBR0028496
