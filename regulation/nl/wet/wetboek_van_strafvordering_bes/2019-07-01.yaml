      - id: ref1
        bwb_id: BWBR0028681
        artikel: '72'
  - number: '528'
    text: |-
      1 De verdachte kan slechts worden aangehouden:

      a. in geval van ontdekking op heterdaad van een misdrijf, door een ieder;

      b. in geval van ontdekking op heterdaad van een overtreding, door een opsporingsambtenaar, een commandant, een
      schipper of een gezagvoerder van een luchtvaartuig;

      c. buiten het geval van ontdekking op heterdaad, indien het een misdrijf of het strafbare feit omschreven in
      artikel 454, onder 3e, van het Wetboek van Strafrecht BES betreft, door een opsporingsambtenaar, een commandant of
      een schipper.

      2 De officier van justitie kan in de gevallen, genoemd in het eerste lid, de aanhouding van de verdachte bevelen.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel528
  - number: '529'
    text: |-
      Een aangehouden verdachte wordt onverwijld overgeleverd:

      a. door een ieder aan de officier van justitie, indien deze ter plaatse aanwezig is;

      b. door de commandant, de schipper of de gezagvoerder van een luchtvaartuig aan een opsporingsambtenaar, indien
      deze ter plaatse aanwezig is;

      c. door een opvarende die geen opsporingsambtenaar is, aan de schipper en door een inzittende van een luchtvaartuig
      die geen opsporingsambtenaar is, aan de gezagvoerder van het luchtvaartuig;

      d. door anderen aan een opsporingsambtenaar of aan een commandant.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel529
  - number: '530'
    text: |-
      1 De officier van justitie kan bepalen dat de aangehouden verdachte zal worden verhoord. Hij kan daartoe de
      overlevering van de verdachte aan een bepaalde persoon of zijn overbrenging naar een bepaalde plaats bevelen.

      2 Tenzij de officier van justitie anders bepaalt, is de opsporingsambtenaar bevoegd de aangehouden verdachte
      te verhoren. Bij afwezigheid van een opsporingsambtenaar komt gelijke bevoegdheid toe aan de commandant, aan de
      schipper en aan de gezagvoerder van het luchtvaartuig.

      3 Degene die bevoegd is tot verhoor van de verdachte is ook bevoegd hem naar een plaats van verhoor te geleiden.

      4 In geval van verhoor door de schipper of een scheepsofficier dan wel door de gezagvoerder van een luchtvaartuig
      of een lid van de bemanning, is [artikel 50][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel50
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel530
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '50'
        afdeling: Derde
  - number: '531'
    text: |-
      1 De aangehouden verdachte wordt, na te zijn verhoord, dadelijk in vrijheid gesteld. Hij mag niet langer dan zes
      uren voor het verhoor worden opgehouden, met dien verstande dat de tijd tussen tien uur ’s avonds en acht uur ’s
      morgens niet wordt meegerekend.

      2 Niettemin kan de verdachte langer dan zes uren worden opgehouden:

      a. wanneer een bevel tot voorlopige hechtenis tegen hem is verleend en de tenuitvoerlegging daarvan, ook buiten het
      rechtsgebied van Bonaire, Sint Eustatius en Saba, is gelast;

      b. wanneer hij wordt verdacht van een misdrijf, waarop naar de wettelijke omschrijving een gevangenisstraf van vier
      jaren of meer is gesteld, en ter zake daarvan een bevel tot voorlopige hechtenis tegen hem kan worden verleend.

      3 Een besluit de verdachte in het in het tweede lid, onderdeel b, bedoelde geval langer dan zes uren op te
      houden, wordt genomen door de officier van justitie. Kan diens optreden niet worden afgewacht, dan kan ook de
      opsporingsambtenaar, de commandant, de schipper of de gezagvoerder van het luchtvaartuig in wiens handen de
      verdachte zich bevindt, daartoe besluiten.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel531
  - number: '532'
    text: |-
      1 Zodra de officier van justitie een besluit als bedoeld in [artikel 531, derde lid][ref1], heeft genomen, stelt
      hij een vordering tot bewaring in bij de rechter-commissaris.

      2 Zodra de officier van justitie verneemt dat een opsporingsambtenaar, een commandant, een schipper of een
      gezagvoerder van een luchtvaartuig een besluit als bedoeld in [artikel 531, derde lid][ref2], heeft genomen, stelt
      hij een vordering tot bewaring in bij de rechter-commissaris of gelast hij de onmiddellijke invrijheidstelling van
      de verdachte.

      3 Heeft het in [artikel 531, derde lid][ref3], bedoelde besluit betrekking op een verdachte die aan boord van een
      luchtvaartuig is aangehouden, dan gelden de volgende bepalingen:

      a. in het geval, bedoeld in het eerste lid, stelt de officier van justitie een vordering tot bewaring bij de
      rechter-commissaris in of beveelt hij de gezagvoerder, indien deze bevoegd is de verdachte over te dragen aan de
      autoriteiten van de staat waar het luchtvaartuig zal landen, van deze bevoegdheid gebruik te maken;

      b. in het geval, bedoeld in het tweede lid, neemt hij een van de in onderdeel a genoemde maatregelen of gelast hij
      de onmiddellijke invrijheidstelling van de verdachte.

      4 De verdachte kan zich bij het horen, bedoeld in de [artikelen 92, derde lid][ref4], en [97][ref5], doen
      vertegenwoordigen door een raadsman.

      5 Indien de vordering tot bewaring wordt afgewezen, gelast de officier van justitie de onmiddellijke
      invrijheidstelling van de verdachte. Hij gelast die invrijheidstelling tevens, zodra geen titel tot
      vrijheidsontneming meer aanwezig is of de grond tot vrijheidsontneming is vervallen.

      6 Zolang degene in wiens handen de verdachte zich bevindt, geen bericht van de officier van justitie heeft
      ontvangen, is hij verplicht de verdachte eigener beweging in vrijheid te stellen, zodra hij meent dat de grond tot
      vrijheidsontneming is vervallen; in ieder geval stelt hij de verdachte in vrijheid, indien hij niet binnen achttien
      dagen na de aanhouding bericht heeft ontvangen, dat een bevel tot voorlopige hechtenis is verleend, waarvan de
      tenuitvoerlegging, ook buiten het rechtsgebied van Bonaire, Sint Eustatius en Saba, is gelast.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel531
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel531
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel531
