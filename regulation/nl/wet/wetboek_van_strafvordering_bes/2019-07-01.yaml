  - number: 177ka
    text: |-
      1 De officier van justitie doet aan de betrokkene schriftelijk mededeling van de uitoefening van de bevoegdheden,
      genoemd in de [titels XVIII][ref1] en [XIX][ref2], zodra het belang van het onderzoek dat toelaat. De mededeling
      blijft achterwege, indien uitreiking van de mededeling redelijkerwijs niet mogelijk is.

      2 Als betrokkenen in de zin van het eerste lid worden aangemerkt:

      a. de persoon ten aanzien van wie een van de bevoegdheden van [Titel XVIII][ref3] of [XIX][ref4] is uitgeoefend;

      b. de gebruiker van een communicatiedienst als bedoeld in [artikel 177r, eerste lid][ref5];

      c. de rechthebbenden, bedoeld in de [artikelen 177l, tweede lid][ref6], [177p, eerste lid][ref7] en
      [177q, tweede lid][ref8].

      3 Indien de betrokkene de verdachte is, kan mededeling achterwege blijven, indien hij op grond van de processtukken
      met de bevoegdheidstoepassing op de hoogte kan komen.


