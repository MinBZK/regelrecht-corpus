  - number: '285'
    text: |-
      1 De dagvaarding bevat een zodanige opgave van het feit dat ten laste wordt gelegd, met vermelding omstreeks welke
      tijd en waar ter plaatse het begaan zou zijn, dat de verdachte daaruit redelijkerwijze kan begrijpen, ter zake
      waarvan hij wordt verdacht.

      2 Zij behelst tevens de vermelding van de omstandigheden waaronder het feit zou zijn begaan.

      3 Indien de verdachte zich in voorlopige hechtenis bevindt krachtens een bevel tot gevangenneming of
      gevangenhouding, waarvan de geldigheidsduur reeds eenmaal of, ingevolge [artikel 98, vierde lid][ref1], reeds
      tweemaal is verlengd, kan voor de opgave van het feit worden volstaan met de omschrijving die in dat bevel is
      gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel98
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel285
    references:
      - id: ref1
