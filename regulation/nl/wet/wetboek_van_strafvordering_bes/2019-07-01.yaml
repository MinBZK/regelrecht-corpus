        artikel: '616'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '616'
        afdeling: Tweede
  - number: '618'
    text: |-
      1 De last tot tenuitvoerlegging van een bevel tot vrijheidsontneming of veroordelend vonnis behelst een zo
      nauwkeurig mogelijke aanduiding van de te vatten persoon, een opgave van de beslissing of het bevel waarop de
      aanduiding steunt, en een vermelding van de plaats waarheen de aangehoudene moet worden overgebracht, of van de
      rechter of ambtenaar voor wie hij moet worden geleid.

      2 Indien de last dit uitdrukkelijk bepaalt, kan de te vatten persoon, voor zover het volkenrecht en het
      interregionale recht dit toelaten, buiten het rechtsgebied van Bonaire, Sint Eustatius en Saba worden aangehouden.

      3 Het bepaalde in het tweede lid geldt niet, wanneer de last betrekking heeft op een bevel tot medebrenging van een
      verdachte, getuige, deskundige of tolk.

      4 Hij die overeenkomstig de last een persoon heeft aangehouden, geleidt deze onverwijld naar de plaats of voor de
      rechter of ambtenaar, in de last vermeld.

      5 Geschiedt de aanhouding buiten het rechtsgebied van Bonaire, Sint Eustatius en Saba, dan zijn de
      [artikelen 522][ref1], [534][ref2] en [535][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel522
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel534
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel535
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel618
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '522'
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '534'
        afdeling: Tweede
      - id: ref3
        bwb_id: BWBR0028681
        artikel: '535'
        afdeling: Tweede
  - number: '619'
    text: |-
      1 Indien de aangehoudene beweert niet te zijn de persoon tegen wie de last is gericht, zal hij, indien hij
      krachtens [artikel 618][ref1] naar een andere plaats moet worden overgebracht, tevoren in de gelegenheid worden
      gesteld om te worden gehoord door de rechter in eerste aanleg.

      2 Is hij aangehouden buiten het rechtsgebied van Bonaire, Sint Eustatius en Saba, dan geeft hij, die de aanhouding
      heeft verricht, onverwijld en op de snelst mogelijke wijze van die bewering van de aangehoudene kennis aan het
      openbaar ministerie.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel618
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel619
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '618'
        afdeling: Derde
  - number: '620'
    text: |-
      De met de tenuitvoerlegging belaste ambtenaar kan ter aanhouding van de te vatten persoon elke plaats betreden. De
      [artikelen 155 tot en met 164][ref1] zijn van toepassing. Geschiedt de aanhouding echter buiten het rechtsgebied
      van Bonaire, Sint Eustatius en Saba, dan is [artikel 539][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel155
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel539
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel620
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '155'
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '539'
        afdeling: Tweede
  - number: '621'
    text: |-
      1 De opneming van een persoon tegen wie een bevel tot vrijheidsontneming of veroordelend vonnis wordt ten uitvoer
      gelegd, in de daartoe bestemde gevangenis of andere inrichting, geschiedt hetzij op vertoon van het bevel tot
      voorlopige hechtenis of inverzekeringstelling, of wel van het veroordelend vonnis of een uittreksel daarvan, hetzij
      op vertoon van de last tot tenuitvoerlegging van het openbaar ministerie.

      2 In het laatste geval doet de ambtenaar, die de last heeft gegeven, het bevel tot voorlopige hechtenis of
      inverzekeringstelling of, in geval van tenuitvoerlegging van vrijheidsstraf, het veroordelend vonnis of een
      uittreksel daarvan ten spoedigste toekomen aan het hoofd van de inrichting.

      3 In geval van tenuitvoerlegging van een vrijheidsstraf, opgelegd bij een mondeling vonnis, geschiedt de in het
      eerste lid bedoelde opneming op vertoon van:

      a. hetzij het proces-verbaal van de terechtzitting, dan wel een afschrift daarvan of uittreksel daaruit;

      b. hetzij de last tot tenuitvoerlegging van het openbaar ministerie, dan wel een afschrift daarvan.

      4 In het geval, bedoeld in het derde lid, onderdeel b, doet de ambtenaar die de last heeft gegeven, het proces-
      verbaal van de terechtzitting, dan wel een afschrift daarvan of uittreksel daaruit, houdende aantekening van het
      mondelinge vonnis, ten spoedigste toekomen aan het hoofd van de inrichting.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel621
  - number: '622'
    text: |-
      Het hoofd van de gevangenis of andere inrichting, waarin de straf van vrijheidsontneming wordt ten uitvoer gelegd,
      is verplicht een register te houden volgens een door Onze Minister van Justitie vast te stellen model.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel622
  - number: '623'
    text: |-
      1 In het register worden bij de opneming van een persoon tegen wie een bevel tot vrijheidsontneming of
      een veroordelend vonnis wordt ten uitvoer gelegd, diens naam, voornaam, beroep, geboorteplaats en woon- of
      verblijfplaats ingeschreven. Indien het een of ander onbekend is, wordt daarvan melding gemaakt.

      2 De inschrijving wijst verder aan:

        - de rechter of de ambtenaar, wiens beslissing wordt ten uitvoer gelegd;
        - de dagtekening van die beslissing; de dag en het uur, waarop de opneming geschiedt, en zo mogelijk het ogenblik
      waarop de vrijheidsontneming is aangevangen;
        - bij veroordeling, de duur van de straf.

      3 De inschrijving wordt mede ondertekend door de ambtenaar, die het bevel of vonnis ten uitvoer legt. Deze ontvangt
      van het hoofd van de inrichting de schriftelijke verklaring dat de opneming heeft plaatsgehad, welke verklaring hij
      overlegt aan de ambtenaar op wiens last de tenuitvoerlegging is geschied.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel623
  - number: '624'
    text: |-
      1 In het bovengemeld register wordt ter zijde van de inschrijving aangetekend de dag en het uur waarop het verblijf
      van de gevangene of verpleegde in de inrichting ophoudt, met vermelding van de beslissing krachtens welke, of van
      enige andere oorzaak ten gevolge waarvan dit plaatsheeft.

      2 Het hoofd van de inrichting ondertekent de inschrijving alsmede de aantekeningen in dit artikel bedoeld.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel624
  - number: '625'
    text: |-
      1 De invrijheidstelling geschiedt door het hoofd van de inrichting:

      a. op de laatste dag van de straftijd, indien de duur van de straf niet meer is dan drie dagen;

      b. op de laatste dag van de straftijd die geen zondag of algemeen erkende feestdag is, indien de duur van de straf
      meer dan drie dagen en minder dan twee maanden is;

      c. in andere gevallen van tenuitvoerlegging van een vrijheidsstraf, op de laatste dag van de straftijd die geen
      zaterdag, zondag of algemeen erkende feestdag is;

      d. zodra de geldigheid van het bevel tot vrijheidsontneming ophoudt;

      e. zodra het bevoegd gezag de last tot invrijheidstelling aan het hoofd van de inrichting heeft verstrekt.

      2 De invrijheidstelling vindt in geen geval plaats na het ogenblik waarop de straftijd verstrijkt.

      3 Indien de invrijheidstelling ingevolge het eerste lid, aanhef en onderdelen a, b of c, geschiedt alvorens de
      straftijd geheel is verstreken, vervalt het recht van tenuitvoerlegging voor het nog resterende gedeelte van de
      straf.

      4 Voor de toepassing van het eerste tot en met derde lid wordt, in gevallen waarin ten aanzien van een gedeelte
      van de straf een bevel als bedoeld in [artikel 17a van het Wetboek van Strafrecht BES][ref1] is gegeven, met dat
      gedeelte alleen rekening gehouden, voor zover de tenuitvoerlegging daarvan door de rechter is gelast.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel17a
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel625
