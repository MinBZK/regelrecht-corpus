  - number: 177s
    text: |-
      1 De officier van justitie kan in het belang van het onderzoek van degene die daarvoor redelijkerwijs in aanmerking
      komt en die anders dan ten behoeve van persoonlijk gebruik gegevens verwerkt, vorderen bepaalde opgeslagen gegevens
      of vastgelegde gegevens van een persoon te verstrekken. De vordering kan betrekking hebben op gegevens die ten
      tijde van de vordering zijn verwerkt, dan wel na het tijdstip van de vordering worden verwerkt, in geval van:

      a. verdenking van een misdrijf waarvoor voorlopige hechtenis is toegelaten;

      b. aanwijzingen van een terroristisch misdrijf.

      2 Een vordering als bedoeld in het eerste lid kan noch worden gericht tot de verdachte noch tot de persoon,
      bedoeld in de [artikelen 251][ref1], [252][ref2] of [253][ref3]. De vordering kan geen betrekking hebben op
      persoonsgegevens betreffende iemands godsdienst of levensovertuiging, ras, politieke gezindheid, gezondheid,
      seksuele leven of lidmaatschap van een vakvereniging.

      3 Een vordering als bedoeld in het eerste lid is schriftelijk en vermeldt:

      a. indien bekend, de naam of anders een zo nauwkeurig mogelijke aanduiding van de persoon of de personen over wie
      gegevens worden gevorderd;

      b. een zo nauwkeurig mogelijke aanduiding van de gegevens die worden gevorderd en de termijn waarbinnen, alsmede de
      wijze waarop deze dienen te worden verstrekt;

      c. de grondslag van de vordering.

      4 Indien de vordering van gegevens betrekking heeft op gegevens die na het tijdstip van de vordering worden
      verwerkt, wordt de vordering gedaan voor een periode van ten hoogste vier weken en kan telkens met maximaal vier
      weken worden verlengd. De officier van justitie vermeldt deze periode in de vordering.

      5 Bij dringende noodzaak kan de vordering mondeling worden gegeven. De officier van justitie stelt de vordering in
      dat geval achteraf op schrift en verstrekt deze, op straffe van nietigheid, binnen drie dagen nadat de vordering is
      gedaan aan degene tot wie de vordering is gericht.

      6 De officier van justitie doet van de verstrekking van gegevens proces-verbaal opmaken, waarin worden vermeld:

      a. de gegevens, bedoeld in het derde lid;

      b. de verstrekte gegevens;

      c. het misdrijf en indien bekend de naam of anders een zo nauwkeurig mogelijke aanduiding van de verdachte;

      d. de feiten of omstandigheden waaruit blijkt dat de voorwaarden, bedoeld in het eerste lid, zijn vervuld;

      e. de reden waarom de gegevens in het belang van het onderzoek worden gevorderd.

      7 In geval van verdenking van een ander strafbaar feit dan bedoeld in het eerste lid, onderdeel a, kan de officier
      van justitie in het belang van het onderzoek een vordering als bedoeld in dat lid slechts doen na door de rechter-
      commissaris verleende machtiging. Het tweede tot en met zesde lid zijn van overeenkomstige toepassing.

      8 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de wijze waarop de
      gegevens worden gevorderd en verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel251
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel252
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel253
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel177s
