  - number: '123'
    text: |-
      1 In geval van een strafbaar feit als omschreven in de [artikelen 97 tot en met 102][ref1],
      [103a tot en met 104c][ref2], [245][ref3], [246][ref4], [256][ref5], [258][ref6], [259][ref7], [260][ref8],
      [265][ref9] of [447 van het Wetboek van Strafrecht BES][ref10], zijn de opsporingsambtenaren te allen tijde bevoegd
      ter inbeslagneming de uitlevering te vorderen van alle voor inbeslagneming vatbare voorwerpen.

      2 Zij hebben te allen tijde vrije toegang tot alle plaatsen, waar redelijkerwijze vermoed kan worden, dat een
      zodanig strafbaar feit wordt begaan. De [artikelen 155 tot en met 164][ref11] zijn van toepassing.


