  - number: '150'
    text: |-
      1 De belanghebbenden kunnen zich schriftelijk beklagen over inbeslagneming, over het gebruik van inbeslaggenomen
      voorwerpen, over het uitblijven van een last tot teruggave, over de teruggave aan een bepaald persoon, over de
      kennisneming of het gebruik van gegevens, als bedoeld in de [artikelen 127][ref1], [128][ref2] en [140][ref3].

      2 Het klaagschrift wordt zo spoedig mogelijk na de inbeslagneming van de voorwerpen of de kennisneming van de
      gegevens ingediend ter griffie van het gerecht in feitelijke aanleg, waarvoor de zaak wordt vervolgd of het laatst
      werd vervolgd. Het klaagschrift is niet ontvankelijk, indien het is ingediend op het tijdstip waarop drie maanden
      zijn verstreken sedert de vervolgde zaak tot een einde is gekomen.

      3 Indien een vervolging niet of nog niet is ingesteld wordt het klaagschrift zo spoedig mogelijk, doch uiterlijk
      binnen drie jaren na de inbeslagneming of kennisneming ingediend ter griffie van het gerecht in eerste aanleg,
      binnen het rechtsgebied waarvan de inbeslagneming of kennisneming is geschied. Het gerecht is bevoegd tot afdoening
      tenzij de vervolging mocht zijn aangevangen voordat met de behandeling van het klaagschrift een aanvang kon worden
      gemaakt. In dat geval zendt de griffier het klaagschrift ter afdoening aan het gerecht, bedoeld in het tweede lid.

      4 Het gerecht geeft een met redenen omklede beschikking, nadat de klager in de gelegenheid is gesteld te worden
      gehoord. Op last van het gerecht stelt de griffier tevens andere belanghebbenden van het klaagschrift in kennis,
      hun de gelegenheid biedende hetzij zelf binnen een in de kennisgeving te vermelden termijn een klaagschrift in
      te dienen, betrekking hebbend op hetzelfde voorwerp, hetzij tijdens de behandeling van het klaagschrift te worden
      gehoord. In het laatste geval geldt de kennisgeving als oproeping.

      5 Indien een belanghebbende zich beklaagt over het uitblijven van een last tot teruggave aan hem, dan wordt de
      beslagene in de gelegenheid gesteld te worden gehoord.

      6 Acht het gerecht het beklag gegrond, dan geeft het de daarmee overeenkomende last.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel127
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel128
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel140
