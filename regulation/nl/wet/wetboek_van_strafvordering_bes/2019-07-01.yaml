  - number: '280'
    text: |-
      Indien de zaak niet verder wordt vervolgd op grond van:

      a. onbevoegdheid van de rechter tot kennisneming van het feit,

      b. niet-ontvankelijkheid van de officier van justitie,

      c. niet-strafbaarheid van het feit of van de verdachte,

      d. onvoldoende aanwijzing van schuld,

      wordt daarvan in de kennisgeving melding gemaakt.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel280
  - number: '281'
    text: |-
      Indien de officier van justitie van oordeel is, dat
      [artikel 39, eerste lid, van het Wetboek van Strafrecht BES][ref1] van toepassing is, doch dat tevens de last,
      bedoeld in het tweede lid van dat artikel, moet worden gegeven, is hij bevoegd een behandeling door de raadkamer te
      vorderen. De verdachte wordt bij het onderzoek gehoord. De [artikelen 294, tweede lid][ref2], en [295][ref3] zijn
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel294
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel295
