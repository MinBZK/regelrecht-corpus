  - number: '100'
    text: |-
      1 Een bevel tot voorlopige hechtenis kan worden gegeven in geval van verdenking van:

      a. een misdrijf, waarop naar de wettelijke omschrijving gevangenisstraf van vier jaren of meer is gesteld, of

      b. een van de misdrijven omschreven in de [artikelen 204, eerste en tweede lid][ref1], [236][ref2],
      [245, derde lid][ref3], 265c, 265d, [259][ref4], [266][ref5], [298, eerste lid][ref6], [321a][ref7], [334][ref8],
      [339][ref9], [339a][ref10], [366, eerste lid][ref11], [368][ref12], [404][ref13], [405][ref14], [410][ref15] en
      [431 van het Wetboek van Strafrecht BES][ref16].

      2 Het bevel kan voorts worden gegeven, indien de verdachte geen vaste woon- of verblijfplaats in de openbare
      lichamen Bonaire, Sint Eustatius en Saba heeft, en hij verdacht wordt van een misdrijf, waarop naar de wettelijke
      omschrijving gevangenisstraf is gesteld.


