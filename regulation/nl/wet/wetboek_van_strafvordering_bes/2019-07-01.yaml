        bwb_id: BWBR0028681
        artikel: '447'
  - number: '613'
    text: |-
      Wanneer een verzoekschrift om gratie van een vrijheidsstraf is ingediend, zonder dat een wettelijke regeling
      daaraan de opschorting van de tenuitvoerlegging verbindt, kan Onze Minister van Justitie niettemin bepalen dat de
      tenuitvoerlegging wordt of blijft opgeschort of wel dat zij wordt of blijft geschorst zolang op het verzoek niet
      is beschikt.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel613
  - number: '614'
    text: |-
      Een verzoekschrift om gratie dat van een derde afkomstig is, wordt buiten verdere behandeling gelaten indien blijkt
      dat de veroordeelde niet met het verzoek instemt. Het verliest alsdan de opschortende werking die de wettelijke
      regeling daaraan verbindt.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel614
  - number: '615'
    text: |-
      1 Voor zover de tenuitvoerlegging is toegelaten, wordt het vonnis zodra mogelijk ten uitvoer gelegd.

      2 Bestaat de straf uit geldboete, dan bepaalt het openbaar ministerie de dag waarop de betaling uiterlijk moet
      geschieden. Het ziet erop toe dat de veroordeelde hierover tijdig wordt ingelicht.

      3 Het openbaar ministerie kan uitstel van betaling verlenen of betaling in termijnen toestaan.

      4 Bij toepassing van het derde lid moet het totale bedrag in ieder geval worden voldaan binnen twee jaar na de dag
      waarop het vonnis voor tenuitvoerlegging vatbaar is geworden.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel615
  - number: '616'
    text: |-
      1 Indien voor de tenuitvoerlegging van een in kracht van gewijsde gegaan vonnis, houdende veroordeling tot
      vrijheidsstraf of tot de straf van berisping, de veroordeelde krankzinnig is geworden, beveelt het gerecht dat het
      vonnis heeft uitgesproken, de opschorting van de tenuitvoerlegging.

      2 De opschorting wordt bevolen, hetzij op de vordering van het openbaar ministerie, hetzij op het
      verzoekschrift van de advocaat van de veroordeelde.Ten aanzien van de advocaat gelden de bepalingen van de
      [Tweede Titel van het Tweede Boek][ref1].

      3 Na het herstel wordt het bevel tot opschorting door hetzelfde gerecht, op vordering van het openbaar ministerie,
      ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0028681
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel616
    references:
      - id: ref1
        bwb_id: BWBR0028681
  - number: '617'
    text: |-
      1 Indien, ondanks de krankzinnigheid van de veroordeelde, de tenuitvoerlegging van andere dan bij
      [artikel 616][ref1] bedoelde straffen mogelijk is, wordt de curator op de gewone wijze tot voldoening aan het
      vonnis uitgenodigd. Zo de veroordeelde nog geen curator heeft, wordt deze zo nodig te dien einde op de vordering
      van het openbaar ministerie benoemd.

      2 Ten aanzien van de vervangende straf is [artikel 616][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel616
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel616
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel617
