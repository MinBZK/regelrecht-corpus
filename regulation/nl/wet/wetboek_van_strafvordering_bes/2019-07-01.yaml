  - number: '339'
    text: |-
      1 Wanneer een getuige in verband met het bepaalde in het zevende lid van [artikel 261][ref1] niet door de rechter-
      commissaris is verhoord, kan het Hof op de vordering van de procureur-generaal een onderzoek instellen naar de
      gegrondheid van de bezwaren tegen onthulling van de identiteit van die getuige. Het Hof kan daartoe de getuige
      overeenkomstig het eerste lid van [artikel 338][ref2] horen. Alvorens de getuige te horen, stelt het Hof de
      verdachte of diens raadsman in de gelegenheid opmerkingen te maken.

      2 Is het Hof van oordeel, dat ernstige bedreiging in de zin van [artikel 261, eerste lid][ref3], niet kan worden
      aangenomen, dan beslist het, dat de getuige geen aanspraak maakt op anonimiteit en dat hij alleen dan kan worden
      verhoord, indien het vierde lid van artikel 261 geen toepassing vindt. Een zodanig verhoor vindt niet plaats dan
      met toestemming van de procureur-generaal.

      3 Indien naar het oordeel van het Hof ernstige bedreiging wel kan worden aangenomen, beslist het dat de getuige
      door de rechter-commissaris met toepassing van het vierde lid van [artikel 261][ref4] kan worden verhoord,
      eventueel met vermelding van de vragen die het Hof gesteld wenst te zien.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel261
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel338
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel261
      [ref4]: https://wetten.overheid.nl/BWBR0028681#Artikel261
