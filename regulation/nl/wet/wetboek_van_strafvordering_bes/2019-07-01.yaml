  - number: '647'
    text: |-
      1 De betekening is nietig, indien de uitreiking niet heeft plaatsgehad overeenkomstig het bepaalde in de
      [artikelen 643][ref1], [644][ref2] en [646][ref3].

      2 De nietigheid wordt gedekt door vrijwillige verschijning ter zitting van degene voor wie het schrijven bestemd
      was.


