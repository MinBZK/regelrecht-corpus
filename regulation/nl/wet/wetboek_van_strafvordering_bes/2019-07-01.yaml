  - number: '187'
    text: |-
      Wanneer de officier van justitie kennis heeft gekregen van een strafbaar feit, doet hij het nodige
      opsporingsonderzoek instellen en vordert, zo daartoe termen zijn, dat tot het instellen van een gerechtelijk
      vooronderzoek wordt overgegaan.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel187
  - number: '188'
    text: |-
      De officier van justitie is te allen tijde bevoegd ten einde enige plaatselijke toestand of enig voorwerp te
      schouwen, met de personen door hem aangewezen, elke plaats te betreden met uitzondering van een woning, tot het
      binnentreden waarvan de bewoner niet uitdrukkelijk toestemming heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel188
  - number: '189'
    text: |-
      In geval van ontdekking op heterdaad of van een misdrijf waarvoor voorlopige hechtenis is toegelaten, kan de
      officier van justitie, bij dringende noodzakelijkheid ten einde een plaatselijke toestand of een voorwerp te
      schouwen, elke plaats betreden waar de daad begaan is of sporen heeft achtergelaten, onverminderd het bepaalde in
      de [artikelen 155 tot en met 164][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel155
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel189
