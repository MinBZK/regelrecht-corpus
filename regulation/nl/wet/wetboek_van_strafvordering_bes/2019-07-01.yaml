  - number: '68'
    text: |-
      Van elke toevoeging en van elke wijziging daarin wordt onverwijld, op de wijze bij algemene maatregel van bestuur
      te bepalen, kennis gegeven aan de officier van justitie, de raadsman, de verdachte en bovendien, in geval van een
      gerechtelijk vooronderzoek, aan de rechter-commissaris, alsmede, indien de verdachte in het huis van bewaring of de
      gevangenis verblijft, aan de directeur van die inrichting.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel68
  - number: '69'
    text: |-
      Voor de beloning van de bijstand door toegevoegde raadslieden alsmede voor de vergoeding van door hen noodzakelijk
      gemaakte onkosten worden uit 's Rijks kas middelen beschikbaar gesteld naar regelen te stellen bij algemene
      maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel69
  - number: '70'
    text: |-
      1 De raadsman heeft vrije toegang tot de verdachte wie rechtens zijn vrijheid is ontnomen, kan hem buiten
      aanwezigheid van anderen spreken en met hem brieven wisselen zonder dat van de inhoud door anderen wordt
      kennisgenomen, een en ander onder het vereiste toezicht, met inachtneming van de huishoudelijke reglementen, zulks
      onverminderd hetgeen door de wettelijke bepalingen wordt gevorderd, en zonder dat het onderzoek daardoor mag worden
      opgehouden.

      2 Indien uit bepaalde omstandigheden een ernstig vermoeden voortvloeit dat het vrije verkeer tussen raadsman en
      verdachte hetzij zal strekken om de verdachte bekend te maken met enige omstandigheid, waarvan hij in het belang
      van het onderzoek tijdelijk onkundig moet blijven, hetzij wordt misbruikt voor pogingen om de waarheidsvinding
      te belemmeren, kan tijdens het gerechtelijk vooronderzoek de rechter-commissaris en overigens tijdens het
      voorbereidend onderzoek de officier van justitie telkens aan de bevoegde autoriteiten bevelen, dat de raadsman geen
      toegang tot de verdachte zal hebben of deze niet alleen zal mogen spreken en dat brieven of andere stukken, tussen
      raadsman en verdachte gewisseld, niet zullen worden uitgereikt. Het bevel omschrijft de bepaalde omstandigheden in
      de voorgaande volzin bedoeld; het beperkt de vrijheid van verkeer tussen raadsman en verdachte niet meer en wordt
      voor niet langer gegeven dan door die omstandigheden wordt gevorderd, en is in elk geval slechts gedurende ten
      hoogste acht dagen van kracht. Van het bevel geschiedt onverwijld schriftelijke mededeling aan de raadsman en aan
      de verdachte.

      3 De raadsman kan tegen het bevel binnen drie dagen na die mededeling een bezwaarschrift indienen bij het Hof van
      Justitie. Deze wordt gehoord, althans behoorlijk daartoe opgeroepen. Het Hof kan bij zijn beslissing het bevel
      opheffen, wijzigen of aanvullen.

      4 Wanneer het betreft een persoon die verdacht wordt van een van de in de
      [artikelen 97 tot en met 113 van het Wetboek van Strafrecht BES][ref1] omschreven misdrijven tegen de veiligheid
      van de Staat, kan tijdens het gerechtelijk vooronderzoek de rechter-commissaris en overigens tijdens het
      voorbereidend onderzoek de officier van justitie telkens voor het tijdvak van ten hoogste veertien dagen bevelen,
      dat er geen vrij verkeer tussen de verdachte en zijn raadsman zal plaatsvinden, indien hij van oordeel is, dat
      het belang van het onderzoek zich daartegen bepaaldelijk verzet. Van het bevel geschiedt onverwijld schriftelijke
      mededeling aan de raadsman en aan de verdachte. Het derde lid is van toepassing.

      5 Alle belemmeringen van het vrije verkeer tussen raadsman en verdachte, die ingevolge een van de vier voorgaande
      leden bevolen zijn, nemen een einde zodra het gerechtelijk vooronderzoek is beëindigd of, ingeval een gerechtelijk
      vooronderzoek niet heeft plaatsgehad, zodra de dagvaarding ter terechtzitting in eerste aanleg is betekend.


