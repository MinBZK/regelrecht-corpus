  - number: '503'
    text: |-
      1 De bepalingen van deze titel zijn niet van toepassing op een gerechtelijk vooronderzoek inzake overtredingen.

      2 Ingeval wordt vermoed, dat bij een verdachte, wiens zaak ter terechtzitting van de rechter in eerste aanleg
      aanhangig wordt gemaakt, tijdens het begaan van de overtreding gebrekkige ontwikkeling of ziekelijke storing van
      de geestvermogens bestond, en dat hij ten gevolge daarvan niet in staat is zijn belangen behoorlijk te behartigen,
      worden in de regel zijn curator, zo hij die heeft, en evenzo een of meer deskundigen ten verzoeke van het openbaar
      ministerie ter terechtzitting gedagvaard om te worden gehoord omtrent de persoonlijkheid van de verdachte.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel503
  - number: 503a
    text: |-
      1 Een vordering van het openbaar ministerie als bedoeld in [artikel 38e van het Wetboek van Strafrecht BES][ref1]
      wordt zo spoedig mogelijk doch uiterlijk twee jaren na de uitspraak van het gerecht in eerste aanleg
      aanhangig gemaakt. Indien het strafrechtelijk financieel onderzoek overeenkomstig het bepaalde in
      [artikel 177g, tweede lid][ref2], is gesloten en heropend, wordt de periode van twee jaren verlengd met de tijd
      verlopen tussen deze sluiting en heropening.

      2 De officier van justitie doet bij zijn vordering de stukken waarop zij berust aan het gerecht toekomen.
      [Artikel 284, vierde lid][ref3], is van overeenkomstige toepassing.

      3 De vordering wordt aan degene op wie zij betrekking heeft betekend, onder mededeling van het recht op
      kennisneming van de stukken. Indien ook een strafrechtelijk financieel onderzoek is ingesteld wordt de vordering
      gelijktijdig met de sluiting van het strafrechtelijk financieel onderzoek aan degene tegen wie het is gericht
      betekend.

      4 De vordering behelst mede oproeping om op het daarin vermelde tijdstip ter terechtzitting te verschijnen. De
      [artikelen 287][ref4], [289 tot en met 292][ref5] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel38e
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel177g
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel184
      [ref4]: https://wetten.overheid.nl/BWBR0028681#Artikel287
      [ref5]: https://wetten.overheid.nl/BWBR0028681#Artikel289
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel503a
