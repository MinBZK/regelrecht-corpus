    text: |-
      Degenen die op het moment van inwerkingtreding van deze wet bevoegd zijn tot de opsporing van strafbare feiten,
      behouden deze bevoegdheid voor de duur van maximaal vijf jaar na inwerkingtreding van deze wet.
