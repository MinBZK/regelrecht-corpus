  - number: '593'
    text: |-
      1 Voor zover een verdrag daarin uitdrukkelijk voorziet kan, op aanwijzing van Onze Minister, de tenuitvoerlegging
      of verdere tenuitvoerlegging van een in een vreemde staat opgelegde tot vrijheidsontneming strekkende sanctie in de
      openbare lichamen Bonaire, Sint Eustatius en Saba plaatsvinden buiten toepassing van paragraaf 3 van deze afdeling.

      2 De in het eerste lid bedoelde aanwijzing kan slechts worden gegeven, indien uit een door de veroordeelde
      ondertekende verklaring blijkt dat hij met zijn instemming naar Bonaire, Sint Eustatius en Saba is overgebracht met
      het oog op de tenuitvoerlegging van de hem opgelegde sanctie.

      3 De in het eerste lid bedoelde aanwijzing kan slechts worden gegeven, nadat advies is ingewonnen van het Hof.

      4 Hangende de beslissing tot het geven van een aanwijzing kan de veroordeelde met toepassing van de
      [artikelen 575 tot en met 579][ref1] voorlopig zijn vrijheid worden ontnomen.

      5 Indien op advies van het Hof het geven van een aanwijzing achterwege blijft, nemen leden van het Hof die terzake
      hebben geadviseerd, niet aan de behandeling van de door de procureur-generaal overeenkomstig [artikel 583][ref2]
      ingediende vordering deel.

      6 De tenuitvoerlegging van de in het eerste lid bedoelde sanctie geschiedt op last van de procureur-generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel575
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel583
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel593
