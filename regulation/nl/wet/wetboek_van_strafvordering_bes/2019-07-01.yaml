        artikel: '84'
  - number: '86'
    text: |-
      Het bevel tot inverzekeringstelling wordt slechts verleend in geval van een strafbaar feit waarvoor voorlopige
      hechtenis is toegelaten. Indien het onderzoek van de zaak op de terechtzitting in eerste aanleg is aangevangen, kan
      zodanig bevel voor hetzelfde feit niet meer worden verleend.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel86
  - number: '87'
    text: |-
      1 Het bevel tot inverzekeringstelling is gedurende ten hoogste twee dagen van kracht.

      2 Bij dringende noodzakelijkheid in het belang van het onderzoek kan de inverzekeringstelling door de officier
      van justitie eenmaal worden verlengd en wel met ten hoogste acht dagen. De verdachte wordt door de officier van
      justitie gehoord voordat hij overeenkomstig [artikel 89][ref1] voor de rechter-commissaris wordt geleid.

      3 De termijnen gaan in op het ogenblik van de tenuitvoerlegging. Zij lopen niet gedurende de tijd dat de verdachte
      zich aan de tenuitvoerlegging van het bevel heeft onttrokken.

      4 [Artikel 83,vijfde en zesde lid][ref2], en [artikel 86][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel89
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel83
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel86
