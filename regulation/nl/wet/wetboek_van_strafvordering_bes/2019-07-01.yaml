  - number: '636'
    text: |-
      Indien iemand die tot het ondergaan van straf is aangehouden, blijft ontkennen de veroordeelde te zijn, of indien
      daaromtrent niettegenstaande erkentenis twijfel blijft bestaan, beslist de rechter die in eerste aanleg van het
      strafbare feit heeft kennisgenomen, of hij al dan niet de veroordeelde is.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel636
  - number: '637'
    text: |-
      1 Tot het onderzoek wordt, op de vordering van het openbaar ministerie, in een door de rechter te bepalen
      terechtzitting met de meeste spoed overgegaan.

      2 Het openbaar ministerie doet de aangehoudene, de getuigen die van zijnentwege zullen worden verhoord en die
      waarop de aangehoudene zich beroept, dagvaarden. Het tweede lid van [artikel 287][ref1] vindt met betrekking tot al
      deze getuigen overeenkomstig toepassing.

      3 Indien het openbaar ministerie weigert een getuige te dagvaarden, kan de rechter op het verzoek van de
      aangehoudene, de dagvaarding bevelen. Het tweede tot en met vijfde lid van [artikel 289][ref2] vinden in het
      laatste geval overeenkomstig toepassing.

      4 Indien de zaak bij de rechter in eerste aanleg is aangebracht, wordt de aangehoudene door de rechter een raadsman
      toegevoegd. Ten aanzien van de raadsman gelden de bepalingen van de [Tweede Titel van het Tweede Boek][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel287
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel289
      [ref3]: https://wetten.overheid.nl/BWBR0028681
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel637
    references:
