  - number: 563a
    text: |-
      1 De rechter-commissaris kan, op vordering van de officier van justitie uitvoering geven aan een verzoek tot
      verhoor per videoconferentie door bevoegde buitenlandse autoriteiten, onder zijn leiding, van een getuige of
      deskundige. Indien een toepasselijk verdrag daarin voorziet kan tevens uitvoering worden gegeven aan een verzoek
      om, in het kader van de opsporing en vervolging van strafbare feiten, een verdachte per videoconferentie te
      verhoren.

      2 Tenzij een toepasselijk verdrag anders bepaalt, zijn de bepalingen in dit wetboek inzake een verzoek tot
      verhoor van een verdachte, getuige of deskundige door de rechter-commissaris van overeenkomstige toepassing op de
      uitvoering van het verzoek tot verhoor per videoconferentie.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel563a
  - number: '564'
    text: |-
      Indien bij de inwilliging van een verzoek om rechtshulp de medewerking van buitenlandse ambtenaren van justitie
      en politie op het eigen grondgebied wordt toegestaan, geschiedt hun optreden onder de feitelijke leiding en de
      verantwoordelijkheid van de daartoe bevoegde autoriteiten. Het stellen van vragen aan de verdachte of een getuige
      door buitenlandse ambtenaren geschiedt in aanwezigheid van de rechter-commissaris en op de wijze, door hem te
      bepalen.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel564
  - number: '565'
    text: |-
      1 Het betekenen en uitreiken van stukken aan derden, ter voldoening aan een verzoek om rechtshulp, geschiedt met
      overeenkomstige toepassing van de wettelijke voorschriften betreffende het betekenen en uitreiken van stukken van
      vergelijkbare strekking in de openbare lichamen Bonaire, Sint Eustatius en Saba.

      2 Is bij een voor inwilliging vatbaar verzoek uitdrukkelijk de voorkeur gegeven aan betekening of uitreiking aan de
      geadresseerde in persoon, dan wordt zoveel mogelijk dienovereenkomstig gehandeld.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel565
  - number: '566'
    text: |-
      1 Wanneer het onderzoek, dat na de landing van een vreemd luchtvaartuig op Bonaire, Sint Eustatius en Saba
      ingevolge artikel 13, vierde lid, van het Verdrag inzake strafbare feiten en bepaalde andere handelingen begaan
      aan boord van luchtvaartuigen (Trb. 1964, 115 en 164) moet worden ingesteld naar hetgeen aan boord van het
      luchtvaartuig is voorgevallen, betrekking heeft op een feit ten aanzien waarvan de strafwet van Bonaire, Sint
      Eustatius en Saba niet toepasselijk is, wordt het ingesteld overeenkomstig de bepalingen die gelden voor een
      opsporingsonderzoek met betrekking tot een strafbaar feit waarvoor geen voorlopige hechtenis is toegelaten.Voor
      de toepassing van [artikel 11, eerste lid][ref1], wordt het feit geacht te zijn begaan ter plaatse waar het
      luchtvaartuig is geland.

      2 De opsporingsambtenaren die het onderzoek verrichten, kunnen behalve de in [artikel 119][ref2] bedoelde
      voorwerpen in beslag nemen de voorwerpen, die de gezagvoerder van het vreemde luchtvaartuig ingevolge artikel 9,
      derde lid, van het Verdrag na de landing overlevert.

      3 Het bepaalde bij en krachtens de [artikelen 141 tot en met 145][ref3], [150][ref4], en [152 tot en met 154][ref5]
      is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel11
