  - number: '290'
    text: |-
      1 Op straffe van nietigheid moet tussen de dag waarop de dagvaarding aan de verdachte is betekend, en die van de
      terechtzitting, een termijn van ten minste zeven dagen, of, ingeval door de rechter-commissaris overeenkomstig de
      [Zevende Titel van het Zevende Boek][ref1] bevelen tot handhaving van de openbare orde zijn gegeven, van ten minste
      vier dagen verlopen. Wanneer de verdachte in een ander eilandgebied wordt gedagvaard dan waar de rechter zitting
      houdt, wordt de termijn van dagvaarding met zeven dagen verlengd. De termijn bedraagt ten minste zes weken, indien
      de verdachte in het buitenland woonachtig is.

      2 Met toestemming van de verdachte kan deze termijn worden verkort, mits van deze toestemming blijkt door
      een verklaring, af te leggen op de griffie van het gerecht in eerste aanleg waarvoor gedagvaard wordt; de
      [artikelen 446][ref2] en [447][ref3] zijn van overeenkomstige toepassing. Geschiedt de betekening van de
      dagvaarding door een deurwaarder of ambtenaar van politie, dan kan de verdachte de verklaring ook doen opnemen
      in de akte van uitreiking; hij moet de verklaring tekenen; indien hij niet kan tekenen, wordt de oorzaak van het
      beletsel in de akte vermeld.

      3 Vrijwillige verschijning van de verdachte op een dagvaarding, betekend in strijd met de voorschriften van dit
      artikel, dekt de nietigheid.

      4 In dat geval kan de rechter op het verzoek van de verdachte en in het belang van diens verdediging schorsing van
      het onderzoek tot een bepaalde dag bevelen.


      [ref1]: https://wetten.overheid.nl/BWBR0028681
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel446
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel447
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel290
    references:
      - id: ref1
        bwb_id: BWBR0028681
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '446'
      - id: ref3
        bwb_id: BWBR0028681
        artikel: '447'
  - number: '291'
    text: |-
      1 Zolang het onderzoek op de terechtzitting nog niet is aangevangen, kan de officier van justitie de dagvaarding
      intrekken. Hij doet daarvan schriftelijk mededeling aan de verdachte.

      2 De officier van justitie draagt zorg dat de gedagvaarde getuigen en deskundigen tijdig met de intrekking worden
      bekendgemaakt.

      3 Wordt bij of na de intrekking van de dagvaarding van verdere vervolging afgezien, dan doet de officier van
      justitie de verdachte onverwijld kennisgeven, dat hij hem ter zake van het feit waarop de dagvaarding betrekking
      had, niet verder zal vervolgen. De [artikelen 279][ref1] en [280][ref2] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel279
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel280
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel291
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '279'
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '280'
  - number: '292'
    text: |-
      1 Indien de dagvaarding is ingetrokken, zonder dat de verdachte een kennisgeving van niet verdere vervolging is
      betekend, stelt de rechter op het verzoek van de verdachte, de officier van justitie een termijn waarbinnen hetzij
      tot dagvaarding, hetzij tot kennisgeving van niet verdere vervolging moet worden overgegaan. De verdachte wordt op
      het verzoek gehoord. [Artikel 282, vierde en vijfde lid][ref1], is van toepassing.

      2 De termijn kan op de vordering van de officier van justitie door de rechter telkens voor een bepaalde tijd worden
      verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel282
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel292
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '282'
  - number: '293'
    text: |-
      1 Tegen de dagvaarding kan de verdachte binnen vijf dagen na de betekening een bezwaarschrift indienen bij het Hof
      van Justitie. Het bezwaarschrift is op straffe van niet-ontvankelijkheid met redenen omkleed.

      2 Indien niet voor het tijdstip waartegen de verdachte is gedagvaard, op het gehele bezwaarschrift onherroepelijk
      is beslist, wordt de behandeling ter terechtzitting voor bepaalde of onbepaalde tijd uitgesteld. De
      [artikelen 362][ref1] en [363][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel362
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel363
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel293
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '362'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '363'
        afdeling: Tweede
  - number: '294'
    text: |-
      1 Naar de gegrondheid van het bezwaarschrift stelt het Hof een onderzoek in. De verdachte en de procureur-generaal
      worden gehoord.

      2 Het Hof kan, alvorens te beslissen, door de rechter-commissaris een onderzoek doen instellen en zich de
      daartoe betrekkelijke stukken doen overleggen. Dit onderzoek geldt als een gerechtelijk vooronderzoek en wordt
      overeenkomstig de [artikelen 226 tot en met 271][ref1] gevoerd. Alsdan kan de rechter-commissaris de bevoegdheden,
      die hem tijdens het gerechtelijk vooronderzoek en overigens tijdens het voorbereidend onderzoek na tussenkomst van
      de officier van justitie of op het verzoek van de verdachte zijn toegekend, ambtshalve uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel226
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel294
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '226'
        afdeling: Tweede
  - number: '295'
    text: |-
      1 Indien het feit niet tot de kennisneming van het Hof behoort, verklaart het zich onbevoegd.

      2 Is de officier van justitie niet ontvankelijk, het feit waarop de dagvaarding betrekking had, of de verdachte
      niet strafbaar, of onvoldoende aanwijzing van schuld aanwezig, dan stelt het Hof de verdachte ten aanzien van de
      gehele telastelegging of voor een bij de beschikking nader aan te duiden gedeelte van de telastelegging buiten
      vervolging. In het geval, bedoeld in [artikel 39, eerste lid, van het Wetboek van Strafrecht BES][ref1], kan tevens
      gegeven worden de last, bedoeld in het tweede lid van dat artikel.

      3 In alle andere gevallen verklaart het Hof het bezwaarschrift niet ontvankelijk of ongegrond.

      4 De beschikking van het Hof wordt onverwijld aan de verdachte ter kennis gebracht. Indien de verdachte in
      raadkamer verschijnt, kan de beslissing hem worden meegedeeld.

      5 Wanneer de beschikking waarbij de verdachte ten aanzien van de gehele telastelegging buiten vervolging wordt
      gesteld, onherroepelijk is geworden, vervalt een reeds uitgebrachte dagvaarding. Wanneer de beschikking waarbij
      de verdachte voor een gedeelte buiten vervolging wordt gesteld, onherroepelijk is geworden, brengt de officier van
      justitie de dagvaarding in overeenstemming met die beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel39
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel295
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '39'
  - number: '296'
    text: |-
      Tegen de dagvaarding, die is uitgebracht na een bevel krachtens [artikel 25, eerste lid][ref1], is een
      bezwaarschrift niet toegelaten, tenzij nieuwe feiten of omstandigheden bekend zijn geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel25
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel296
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '25'
  - number: '297'
    text: |-
      Is bij de beschikking tot buitenvervolgingstelling tevens gegeven de last, bedoeld in het
      [tweede lid van artikel 39 van het Wetboek van Strafrecht BES][ref1], dan kan de verdachte of diens raadsman
      daartegen bezwaar maken door middel van een verklaring ter griffie van het Hof, af te leggen uiterlijk binnen zes
      dagen nadat de beschikking in kracht van gewijsde is gegaan. Alsdan vervalt de beschikking en beveelt het Hof,
      dat de verdachte ter zake van het feit waarop de dagvaarding betrekking had, binnen een bepaalde termijn opnieuw
      zal worden gedagvaard. Deze termijn kan op de vordering van de officier van justitie door het Hof eenmaal voor een
      bepaalde tijd worden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel39
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel297
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '39'
  - number: '298'
    text: |-
      In geval van buitenvervolgingstelling zijn de [artikelen 282][ref1] en [283][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel282
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel283
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel298
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '282'
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '283'
  - number: '299'
    text: |-
      1 De zaak wordt in hoger beroep ter terechtzitting aanhangig gemaakt door een dagvaarding, vanwege de procureur-
      generaal aan de verdachte betekend. Het rechtsgeding in hoger beroep neemt op het moment van de betekening een
      aanvang.

      2 Ten aanzien van die dagvaarding is [artikel 287][ref1] van toepassing, behoudens dat daarbij de verdachte,
      in plaats van op de voorschriften van [artikel 289, eerste lid][ref2], opmerkzaam wordt gemaakt op die van
      [artikel 301][ref3].

      3 Op de gronden, in [artikel 286][ref4] vermeld, kunnen verschillende zaken gevoegd aanhangig worden gemaakt.

      4 De voorzitter bepaalt, op de voordracht van de procureur-generaal, de dag van de terechtzitting.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel287
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel289
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel301
      [ref4]: https://wetten.overheid.nl/BWBR0028681#Artikel286
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel299
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '287'
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '289'
      - id: ref3
        bwb_id: BWBR0028681
        artikel: '301'
      - id: ref4
        bwb_id: BWBR0028681
        artikel: '286'
  - number: '300'
    text: |-
      1 Op straffe van nietigheid moet tussen de dag waarop de dagvaarding aan de verdachte is betekend, en die
      van de terechtzitting een termijn van ten minste zeven dagen verlopen. Wanneer de verdachte in een ander
      eilandgebied wordt gedagvaard dan waar de rechter zitting houdt, wordt de termijn van dagvaarding met zeven
      dagen verlengd. De termijn bedraagt ten minste zes weken, indien de verdachte in het buitenland woonachtig is.
      [Artikel 290, tweede, derde en vierde lid][ref1], is van toepassing.

      2 [Artikel 288][ref2] is van overeenkomstige toepassing, met dien verstande dat bij kennisgeving de benadeelde
      partij tevens opmerkzaam wordt gemaakt op de voorschriften van [artikel 374][ref3], en dat de kennisgeving steeds
      geschiedt aan de benadeelde partij die zich in eerste aanleg in het geding heeft gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel290
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel288
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel374
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel300
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '290'
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '288'
      - id: ref3
        bwb_id: BWBR0028681
        artikel: '374'
        afdeling: Derde
  - number: '301'
    text: |-
      1 De procureur-generaal en de verdachte kunnen zowel ter terechtzitting in eerste aanleg gehoorde, als nieuwe
      getuigen en deskundigen doen dagvaarden. Zij kunnen ook nieuwe bescheiden en stukken van overtuiging overleggen.

      2 [Artikel 289, tweede tot en met vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel289
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel301
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '289'
  - number: '302'
    text: |-
      De bepalingen in de volgende afdelingen van deze titel zijn toepasselijk op de behandeling ter terechtzitting in
      eerste aanleg en in hoger beroep, met dien verstande dat, waar gesproken wordt van het Hof en van de voorzitter,
      daaronder voor de terechtzitting in eerste aanleg de rechter in eerste aanleg wordt verstaan en waar gesproken
      wordt van de procureur-generaal, daaronder voor de terechtzitting in eerste aanleg de officier van justitie wordt
      verstaan, een en ander voor zover niet uit enige van de bepalingen anders blijkt en onverminderd het bepaalde in
      [Titel IV van dit Boek][ref1] en in de [Titels I][ref2] en [II van het Zevende Boek][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0028681
      [ref2]: https://wetten.overheid.nl/BWBR0028681
      [ref3]: https://wetten.overheid.nl/BWBR0028681
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel302
    references:
      - id: ref1
        bwb_id: BWBR0028681
      - id: ref2
        bwb_id: BWBR0028681
      - id: ref3
        bwb_id: BWBR0028681
  - number: '303'
    text: |-
      Het onderzoek van de zaak op de terechtzitting neemt een aanvang, nadat de voorzitter de zaak door de deurwaarder
      heeft doen uitroepen.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel303
  - number: '304'
    text: |-
      De rechter die als rechter-commissaris enig onderzoek in de zaak heeft verricht of enige beslissing heeft genomen,
      neemt aan het onderzoek op de terechtzitting geen deel.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel304
  - number: '305'
    text: |-
      1 Tot bijwoning van een openbare terechtzitting worden, tenzij in bijzondere gevallen ter beoordeling van de
      voorzitter, als toehoorder niet toegelaten minderjarige personen die de leeftijd van zestien jaren nog niet hebben
      bereikt.

      2 In geval van twijfel omtrent de leeftijd moet ten genoegen van de voorzitter aannemelijk worden gemaakt dat de
      persoon die toelating verlangt, de leeftijd van zestien jaren heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel305
  - number: '306'
    text: |-
      In zaken betreffende strafbare feiten waarop geen gevangenisstraf is gesteld, kan de verdachte zich doen
      vertegenwoordigen door een advocaat, bepaaldelijk daartoe door hem gemachtigd of, indien hem uitsluitend als
      overtreding strafbaar gestelde feiten zijn ten laste gelegd, ook door een daartoe bij bijzondere volmacht
      schriftelijk gemachtigde, tenzij het Hof vertegenwoordiging niet mocht toelaten; in het laatste geval schorst het
      Hof het onderzoek voor een bepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel306
  - number: '307'
    text: |-
      Tegen de verdachte die niet op de aan hem gedane dagvaarding op de terechtzitting verschijnt of zich, in de
      gevallen bij wettelijke regeling voorzien, niet door een gemachtigde laat vertegenwoordigen, wordt verstek
      verleend.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel307
  - number: '308'
    text: |-
      1 Indien de verdachte niet op de terechtzitting tegenwoordig is, kan het Hof zowel bij de aanvang als gedurende
      de loop van het onderzoek bevelen dat, zo er gronden zijn om aan te nemen, dat hij bij een herhaalde dagvaarding
      wederom niet zal verschijnen, hij op een door het Hof te bepalen tijdstip ter terechtzitting aanwezig zal zijn; het
      Hof kan daartoe tevens zijn medebrenging gelasten.

      2 Indien de verdachte op het bepaalde tijdstip niet op de terechtzitting is verschenen, verleent het Hof, tenzij
      het de medebrenging tegen een nader tijdstip gelast, verstek, indien dit nog niet had plaatsgehad; het onderzoek
      wordt daarna voortgezet.

      3 Indien de verdachte op het bepaalde tijdstip op de terechtzitting is verschenen, wordt het verstek dat tegen hem
      verleend mocht zijn, vervallen verklaard en het onderzoek op de terechtzitting opnieuw aangevangen.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel308
  - number: '309'
    text: |-
      1 De terechtzitting is openbaar, tenzij het Hof ambtshalve, dan wel op de vordering van de procureur-generaal of
      op het verzoek van de verdachte, in het belang van de openbare orde of de zedelijkheid beveelt, dat de behandeling
      ter terechtzitting geheel of ten dele met gesloten deuren zal plaatsvinden. Het bevel kan ook worden gegeven op
      het verzoek van een getuige op grond dat het in het openbaar afleggen van zijn verklaring voor hemzelf, voor een
      of meer van zijn bloed- of aanverwanten in de rechte lijn of in de zijlijn in de tweede of de derde graad of voor
      zijn echtgenote of vroegere echtgenote, dan wel de persoon met wie hij duurzaam feitelijk samenwoont of heeft
      samengewoond, een ernstige krenking van eer of goede naam ten gevolge zou hebben.

      2 De redenen worden in het proces-verbaal van de terechtzitting vermeld.

      3 Het Hof geeft het bevel niet dan na de verzoeker en in ieder geval de procureur-generaal en de verdachte, zo
      nodig met gesloten deuren, te hebben gehoord.

      4 Indien de in het eerste lid bedoelde beslissing in eerste aanleg is gegeven, staat daartegen geen beroep open.

      5 Tot bijwoning van de niet openbare zitting kan de voorzitter, de procureur-generaal en de verdachte gehoord,
      bijzondere toegang verlenen.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel309
  - number: '310'
    text: |-
      1 De voorzitter heeft de leiding van het onderzoek op de terechtzitting en geeft daartoe de nodige bevelen. Hij kan
      een door hem aangewezen lid van het college in zijn plaats belasten met de ondervraging. Dit lid oefent alsdan bij
      de ondervraging de bevoegdheden uit die bij deze titel aan de voorzitter zijn toegekend.

      2 Hij draagt zorg dat geen vragen worden gesteld die de strekking hebben verklaringen te verkrijgen, waarvan niet
      gezegd kan worden dat zij in vrijheid zijn afgelegd.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel310
  - number: '311'
    text: Behalve de rechters en de griffier neemt aan de tafel van het Hof niemand plaats.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel311
  - number: '312'
    text: |-
      1 Worden strafbare feiten waarvan de voeging had behoren te geschieden, op dezelfde terechtzitting afzonderlijk
      aangebracht, dan beveelt het Hof dat de voeging alsnog zal plaatsvinden.

      2 Indien strafbare feiten waartussen verband bestaat of die door dezelfde persoon zijn begaan op verschillende
      terechtzittingen zijn aangebracht, maar de behandeling op dezelfde terechtzitting wordt hervat of aangevangen,
      beveelt het Hof eveneens de voeging, indien dit in het belang van het onderzoek is.

      3 Het Hof beveelt de splitsing van gevoegde zaken, indien het geen verband tussen die zaken aanwezig acht of de
      voeging niet in het belang van het onderzoek oordeelt.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel312
  - number: '313'
    text: |-
      1 Het onderzoek wordt onafgebroken voortgezet.

      2 Het Hof kan echter het onderzoek wegens de uitgebreidheid of de duur daarvan, of voor het nemen van rust,
      onderbreken.

      3 Het Hof is voorts bevoegd, indien dit door het belang van het onderzoek wordt gevorderd, met of zonder
      tijdsbepaling, de schorsing van het onderzoek te gelasten.

      4 De schorsing met tijdsbepaling kan zo nodig telkens voor een bepaalde tijd worden verlengd.

      5 De reden van de onderbreking of schorsing wordt in het proces-verbaal vermeld.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel313
  - number: '314'
    text: |-
      Bevindt de verdachte zich in voorlopige hechtenis, dan schorst het Hof het onderzoek op de terechtzitting alleen
      voor bepaalde tijd. De termijn van de schorsing wordt in de regel op niet meer dan twee maanden gesteld. Om
      klemmende, in het proces-verbaal te vermelden redenen, kan het Hof een langere termijn stellen, doch in geen geval
      van meer dan vier maanden.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel314
  - number: '315'
    text: |-
      1 Na de aanvang van het onderzoek vraagt de voorzitter de verdachte, of, zo er meer verdachten zijn, ieder van
      hen in de volgorde waarin zij zijn gedagvaard, naar naam en voornamen, leeftijd, geboorteplaats, beroep en woon-
      of verblijfplaats.

      2 Hij vermaant hem oplettend te zijn op hetgeen hij zal horen.

      3 Daarna doet hij de verdachte, mededeling van diens recht om zich te onthouden van antwoorden en, indien de
      verdachte geen raadsman heeft, van diens recht om zich door een raadsman te doen bijstaan.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel315
  - number: '316'
    text: |-
      1 In de gevallen waarin van nietigheid van de dagvaarding, niet-ontvankelijkheid van de procureur-generaal of
      onbevoegdheid van het Hof zonder onderzoek van de zaak zelf kan blijken, is de verdachte bevoegd die verwering
      reeds dadelijk na de ondervraging in [artikel 315][ref1] vermeld, voor te dragen en toe te lichten.

      2 De procureur-generaal kan daarop antwoorden.

      3 De verdachte kan andermaal en, zo de procureur-generaal daarna weer het woord voert, nogmaals het woord voeren.

      4 Het Hof gaat tot beraadslaging over en doet uitspraak.

      5 Wordt de verwering ontijdig of ongegrond bevonden, dan wordt het onderzoek van de zaak zelf onmiddellijk
      voortgezet.

      6 Ook ambtshalve kan het Hof zonder onderzoek van de zaak de nietigheid van de dagvaarding, de niet-
      ontvankelijkheid van de procureur-generaal of de onbevoegdheid van het Hof, dan wel in het geding in hoger beroep
      de niet-ontvankelijkheid van het beroep, ingesteld door het openbaar ministerie of de verdachte, uitspreken, na de
      procureur-generaal en de verdachte te hebben gehoord.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel315
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel316
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '315'
        afdeling: Tweede
  - number: '317'
    text: |-
      Indien in het geding in eerste aanleg de officier van justitie, hetzij naar aanleiding van een verwering
      als bedoeld in het eerste lid van [artikel 316][ref1], hetzij naar aanleiding van het horen door de rechter,
      ingevolge het zesde lid van dat artikel, van oordeel is dat de dagvaarding behoort te worden gewijzigd, zijn de
      [artikelen 355][ref2] en [356][ref3] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel316
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel355
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel356
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel317
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '316'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '355'
        afdeling: Tweede
      - id: ref3
        bwb_id: BWBR0028681
        artikel: '356'
        afdeling: Tweede
  - number: '318'
    text: |-
      1 De procureur-generaal draagt de zaak voor en legt een lijst van de inbeslaggenomen, niet teruggegeven voorwerpen
      over.

      2 Hij legt ook een lijst van de getuigen over, welke de voorzitter doet voorlezen door de griffier.

      3 Onmiddellijk nadat de lijst is overgelegd en voorgelezen kan de verdachte, indien de dagvaarding van een door hem
      opgegeven getuige door de procureur-generaal is verzuimd of geweigerd, het Hof verzoeken alsnog de dagvaarding van
      die getuige te bevelen.

      4 Het Hof beveelt dat de overeenkomstig [artikel 289, tweede lid][ref1], opgegeven getuige, wiens dagvaarding is
      verzuimd of geweigerd, tegen een door het Hof te bepalen tijdstip ter terechtzitting zal worden gedagvaard, tenzij
      de dagvaarding als nodeloos moet worden aangemerkt en het achterwege blijven van de dagvaarding redelijkerwijze
      niet in strijd komt met het recht van de verdachte om de ondervraging van getuigen à décharge te doen geschieden op
      dezelfde voorwaarden als het geval is met de getuigen à charge.

      5 De getuige, wiens dagvaarding door het Hof is bevolen of wiens plaatsing op de lijst door de procureur-generaal
      is verzuimd of geweigerd, wordt door de griffier op de lijst gebracht. Hetzelfde geldt ten aanzien van de getuige
      die gedurende de loop van het onderzoek op de terechtzitting is verschenen en niet bij het voorafgaande onderzoek
      tegenwoordig is geweest.

      6 Op de vordering van de procureur-generaal of op het verzoek van de verdachte worden getuigen, die niet op de
      lijst voorkomen doch op de terechtzitting tegenwoordig zijn, op bevel van de voorzitter alsnog door de griffier
      op de lijst gebracht, tenzij de ondervraging van de getuige als nodeloos moet worden aangemerkt en het achterwege
      blijven daarvan redelijkerwijze niet in strijd komt met het recht van de verdachte om de ondervraging van getuige à
      décharge te doen geschieden op dezelfde voorwaarden als het geval is met de getuigen à charge.

      7 Alle op de lijst gebrachte getuigen worden verhoord, tenzij het Hof met toestemming van de procureur-generaal en
      de verdachte van hun verhoor afziet.

      8 [Artikel 260][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel289
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel260
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel318
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '289'
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '260'
        afdeling: Vierde
  - number: '319'
    text: |-
      Wanneer de verdachte zich in voorlopige hechtenis bevindt krachtens een bevel tot gevangenneming of gevangenhouding
      waarvan de geldigheidsduur reeds eenmaal of ingevolge [artikel 98, vierde lid][ref1], tweemaal is verlengd, kan
      de officier van justitie, in het geding in eerste aanleg, onmiddellijk nadat hij de zaak heeft voorgedragen,
      schorsing van het onderzoek op de terechtzitting vorderen, mits hij het voornemen daartoe tijdig aan de verdachte
      schriftelijk kenbaar heeft gemaakt. In dat geval kan het overleggen van de lijsten, bedoeld in het eerste en tweede
      lid van [artikel 318][ref2], worden aangehouden tot de hervatting van het onderzoek op de terechtzitting.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel98
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel318
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel319
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '98'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '318'
        afdeling: Tweede
  - number: '320'
    text: |-
      De voorzitter kan, met toestemming van de procureur-generaal en van de verdachte, de getuige vergunnen zich vóór
      het afleggen van zijn verklaring tot een bepaald tijdstip te verwijderen.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel320
  - number: '321'
    text: |-
      Indien een op de lijst voorkomende getuige niet is verschenen, beveelt het Hof, tenzij overeenkomstig het bepaalde
      in [artikel 318, zevende lid][ref1], van zijn verhoor wordt afgezien, dat hij tegen een door het Hof te bepalen
      tijdstip ter terechtzitting zal worden gedagvaard en kan het daarbij tevens zijn medebrenging gelasten.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel318
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel321
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '318'
        afdeling: Tweede
  - number: '322'
    text: |-
      1 De voorzitter bepaalt de volgorde waarin de getuigen worden voorgeroepen, nadat hij de procureur-generaal en de
      verdachte heeft gehoord.

      2 Hij beveelt dat de getuigen zich zullen begeven naar het voor hen bestemde vertrek, met uitzondering van de
      eerste die hij voor het Hof doet verschijnen.

      3 Hij neemt, zo nodig, maatregelen om de getuigen te beletten dat zij zich vóór het afleggen van hun getuigenis met
      elkaar onderhouden.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel322
  - number: '323'
    text: |-
      1 De voorzitter vraagt de getuige naar naam en voornamen, leeftijd, beroep en woon- en verblijfplaats; of hij
      bloed- of aanverwant is van de verdachte, en, zo ja, in welke graad.

      2 De voorzitter beëdigt daarna de getuige. [Artikel 250, tweede lid][ref1], betreffende de vervanging van de
      beëdiging door een aanmaning, is van overeenkomstige toepassing.

      3 Met betrekking tot het verhoren van de getuige en diens recht van verschoning vinden de
      [artikelen 251 tot en met 254][ref2] toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel250
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel251
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel323
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '250'
        afdeling: Vierde
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '251'
        afdeling: Vierde
  - number: '324'
    text: |-
      De rechter kan bevelen, hetzij ambtshalve, hetzij op de vordering van de officier van justitie of op het verzoek
      van de verdachte, dat niet anders dan buiten ede worden gehoord, zij, die wegens meineed tot welke straf ook of uit
      anderen hoofde tot gevangenisstraf van drie jaren of langer zijn veroordeeld, of tegen wie ter zake van misdrijf,
      waartegen een gevangenisstraf van vier jaren of meer is bedreigd, een vervolging is ingesteld.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel324
  - number: '325'
    text: |-
      1 De getuige wordt het eerst ondervraagd door degene, die hem heeft gedagvaard of op wiens verzoek hij is
      gedagvaard. Daarna geschiedt de ondervraging door de verdachte of diens raadsman of door de procureur-generaal in
      de volgorde en op de wijze door de voorzitter te bepalen.

      2 De voorzitter en de andere rechters kunnen te allen tijde, doch bij voorkeur na de ondervraging bedoeld in het
      eerste lid, vragen stellen. De voorzitter kan, indien het belang van een goede procesorde dat nodig maakt, de
      ondervraging op de voet van het eerste lid beëindigen en zelf de getuige ondervragen.

      3 In ieder geval geeft de voorzitter aan de verdachte en diens raadsman de gelegenheid om tegen de getuige en
      diens verklaring in te brengen wat tot verdediging kan dienen en aan de procureur-generaal die tot het maken van
      opmerkingen.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel325
  - number: '326'
    text: |-
      Gedurende de verdere loop van het onderzoek kunnen de getuige door de voorzitter, de rechters, de procureur-
      generaal en de verdachte nog vragen worden gesteld. [Artikel 325, derde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel325
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel326
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '325'
        afdeling: Tweede
  - number: '327'
    text: De getuige moet bij zijn verklaring zoveel mogelijk uitdrukkelijk opgeven zijn redenen van wetenschap.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel327
  - number: '328'
    text: |-
      De voorzitter bepaalt welke vragen als ontoelaatbaar zijn aan te merken. Hij kan, ambtshalve of op het verzet van
      de procureur-generaal of van de verdachte beletten dat aan enige vraag, door de verdachte of diens raadsman of door
      de procureur-generaal gesteld, door de getuige gevolg wordt gegeven. Op het antwoord, dat op zodanige vraag mocht
      zijn gegeven, wordt geen acht geslagen.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel328
  - number: '329'
    text: |-
      1 Indien de getuige bij zijn verhoor zonder wettige grond weigert op de hem gestelde vragen te antwoorden of wel de
      eed die van hem gevorderd wordt, af te leggen, beveelt het Hof indien dit in het belang van het onderzoek dringend
      noodzakelijk is, dat hij in gijzeling zal worden gesteld en op een bepaald tijdstip weer voor het Hof zal worden
      gebracht.

      2 Het bevel wordt niet gegeven dan nadat de getuige in zijn verdediging, door hem of zijn advocaat voorgedragen, is
      gehoord. Het is voor niet langer dan dertig dagen geldig.Tegen dit bevel is geen rechtsmiddel toegelaten.

      3 Het Hof gelast het ontslag van de getuige uit de gijzeling, zodra hij aan zijn verplichtingen heeft voldaan of
      het onderzoek op de terechtzitting gesloten is. Het is echter bevoegd dat ontslag in elke stand van het onderzoek
      te bevelen, ook op verzoek van de getuige.

      4 De [artikelen 258][ref1] en [259][ref2] zijn van toepassing.

      5 Tegen de beslissing, in het geding in eerste aanleg gegeven tot afwijzing van een verzoek van de getuige om
      ontslag, staat aan deze binnen drie dagen na de betekening hoger beroep open op het Hof. De getuige wordt gehoord,
      althans daartoe behoorlijk opgeroepen.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel258
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel259
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel329
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '258'
        afdeling: Vierde
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '259'
        afdeling: Vierde
  - number: '330'
    text: |-
      Na het afleggen van zijn verklaring blijft de getuige in de rechtszaal, tenzij het Hof, met toestemming van de
      procureur-generaal en van de verdachte, hem vergunt zich te verwijderen, zo nodig met bevel om op een te bepalen
      tijd weer in de rechtszaal aanwezig te zijn.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel330
  - number: '331'
    text: |-
      1 De voorzitter kan, hetzij ambtshalve, hetzij op de vordering van de procureur-generaal of op het verzoek van de
      verdachte, getuigen tegenover elkaar stellen.

      2 Op gelijke wijze kan hij bevelen dat, na afgelegde getuigenis, een of meer getuigen de rechtszaal zullen verlaten
      en dat een of meer van hun opnieuw zullen worden binnengelaten, ten einde hetzij afzonderlijk, hetzij in elkaars
      bijzijn, nogmaals te worden verhoord.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel331
  - number: '332'
    text: |-
      1 Op gelijke wijze als bij [artikel 331][ref1] bedoeld, kan de voorzitter bevelen dat een of meer verdachten de
      rechtszaal zullen verlaten, opdat een getuige buiten hun tegenwoordigheid zal worden ondervraagd.

      2 In dat geval wordt de verdachte onmiddellijk op de hoogte gesteld van hetgeen in zijn afwezigheid is voorgevallen
      en eerst daarna met het onderzoek voortgegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel331
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel332
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '331'
        afdeling: Tweede
  - number: '333'
    text: |-
      1 Indien een getuige verdacht wordt zich op de terechtzitting aan het misdrijf van meineed te hebben schuldig
      gemaakt, kan het Hof ambtshalve, op de vordering van de procureur-generaal of op het verzoek van de verdachte
      dienaangaande onderzoek bevelen, zonodig met schorsing van het onderzoek op de terechtzitting.

      2 In dat geval wordt door de griffier dadelijk een proces-verbaal opgemaakt en dit door de voorzitter, de rechters,
      en hemzelf ondertekend. Het proces-verbaal bevat de afgelegde verklaring van de getuige.

      3 De verklaring van de getuige wordt hem voorgelezen; daarna wordt hem gevraagd, of hij bij zijn verklaring blijft
      volharden, in welk geval deze door hem wordt ondertekend. Bij gebreke van ondertekening vermeldt het proces-verbaal
      de weigering of de reden van verhindering.

      4 Het Hof kan daarop het instellen van een gerechtelijk vooronderzoek bevelen, in te stellen door de rechter-
      commissaris belast met de behandeling van strafzaken. Het kan in dat geval tevens, indien daartoe de voorwaarden en
      de gronden aanwezig zijn, de gevangenneming bevelen.

      5 Het proces-verbaal wordt door het Hof in handen gesteld van de officier van justitie.
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel333
  - number: '334'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel334
  - number: '335'
    text: |-
      Indien een getuige, tijdens het gerechtelijk vooronderzoek beëdigd of overeenkomstig
      [artikel 250, tweede lid][ref1], aangemaand, overleden is of, naar het oordeel van het Hof, niet
      op de terechtzitting heeft kunnen verschijnen, of van wiens verhoor overeenkomstig het bepaalde in
      [artikel 318, zevende lid][ref2], is afgezien, zal zijn vroegere verklaring, mits ter terechtzitting voorgelezen,
      als aldaar afgelegd worden aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel250
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel318
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel335
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '250'
        afdeling: Vierde
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '318'
        afdeling: Tweede
  - number: '336'
    text: |-
      1 Alle bepalingen in deze titel ten aanzien van getuigen en hun verklaringen, zijn ook van toepassing ten aanzien
      van deskundigen en hun verklaringen, behoudens:

      a. dat de deskundige wordt beëdigd op de wijze als in [artikel 45][ref1] voor deskundigen is voorgeschreven;

      b. dat [artikel 327][ref2] niet van toepassing is;

      c. dat gijzeling niet is toegelaten.

      2 De verklaringen en verslagen van deskundigen zijn met redenen omkleed.

      3 De deskundigen zijn verplicht de door het Hof gevorderde diensten te bewijzen.

      4 Van degene die, op de vordering van het openbaar ministerie, door het Hof van Justitie als vaste gerechtelijke
      deskundige is beëdigd, wordt ter zake van het uitbrengen van een verslag geen nadere eed gevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel327
    url: https://wetten.overheid.nl/BWBR0028681/2019-07-01#Artikel336
