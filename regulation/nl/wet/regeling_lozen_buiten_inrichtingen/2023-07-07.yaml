  - number: '2.1'
    text: |-
      Een zuiveringsvoorziening als bedoeld in [artikel 3.6, zesde lid, van het besluit][ref1] voldoet aan de
      [artikelen 2.2][ref2] en [2.3][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0029789#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0029887#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0029887#Artikel2
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0029789
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0029887
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref3
        bwb_id: BWBR0029887
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '2.2'
    text: 'Een zuiveringsvoorziening bestaat uit een septic tank:'
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.2
  - number: 2.2.a
    text: die een nominale inhoud heeft van ten minste 6 kubieke meter,
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.2
  - number: 2.2.b
    text: die voldoet aan NEN-EN 12566-1, en
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.2
  - number: 2.2.c
    text: die een hydraulisch rendement heeft van ten hoogste 10 gram, bepaald overeenkomstig annex B van NEN-EN 12566-1.
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.2
  - number: '2.3'
    text: 'Een zuiveringsvoorziening:'
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.3
  - number: 2.3.a
    text: is goed toegankelijk, en
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.3
  - number: 2.3.b
    text: wordt zo vaak als voor de goede werking daarvan nodig is onderhouden.
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.3
  - number: '2.4'
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.4
  - number: 2.4.a
    text: |-
      *hulpconstructie:* constructie waarop of waarin reinigings- of conserveringswerkzaamheden aan een vast object
      plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.4
  - number: 2.4.b
    text: '*stofdichte wand:* afdichting gericht op het voorkomen van emissie van stofdelen uit de hulpconstructie;'
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.4
  - number: 2.4.c
    text: |-
      *vloeistofdichte wand:* afdichting gericht op het voorkomen van emissie van vloeistof of nevel uit de
      hulpconstructie;
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.4
  - number: 2.4.d
    text: |-
      *winddichte wand:* afdichting gericht op het voorkomen van invloed van wind op de emissie van stofdelen, vloeistof
      of nevel uit de hulpconstructie;
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.4
  - number: 2.4.e
    text: |-
      *stoffen:* afvalstoffen, verontreinigende of schadelijke stoffen, die bij reinigings- of conserveringswerkzaamheden
      worden gebruikt dan wel van het vast object vrijkomen.
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.4
  - number: 2.5.1
    text: |-
      Als reinigingswerkzaamheden als bedoeld in [artikel 3.10, tweede lid, van het besluit][ref1] worden aangewezen:


