    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0010252
  - number: '4.3'
    text: |-
      Deze regeling treedt in werking op het tijdstip waarop het [Besluit lozen buiten inrichtingen][ref1] van 16 maart
      2011 (Stb. 153) in werking treedt.


