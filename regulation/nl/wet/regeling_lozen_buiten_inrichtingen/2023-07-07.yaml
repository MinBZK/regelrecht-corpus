    references:
      - id: ref1
        bwb_id: BWBR0029789
        artikel: '3'
  - number: 2.6.1.a
    text: C1-technieken;
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.6
  - number: 2.6.1.b
    text: C2-technieken;
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.6
  - number: 2.6.1.c
    text: C3-technieken.
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.6
  - number: 2.6.2
    text: 'Als C1-technieken worden aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.6
  - number: 2.6.2.a
    text: aanbrengen van verflagen of conserveringslagen met behulp van kwast, spaan of roller;
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.6
  - number: 2.6.2.b
    text: HVLP-spuiten;
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.6
  - number: 2.6.2.c
    text: elektrostatisch spuiten;
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.6
  - number: 2.6.2.d
    text: hot elektrostatisch spuiten.
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.6
  - number: 2.6.3
    text: 'Als C2-technieken worden aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.6
  - number: 2.6.3.a
    text: aanbrengen van verflagen of conserveringslagen met behulp van een kneedmortelpomp;
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.6
  - number: 2.6.3.b
    text: spuiten van kleine oppervlakten;
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.6
  - number: 2.6.4
    text: 'Als C3-technieken worden aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.6
  - number: 2.6.4.a
    text: airless spuiten;
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.6
  - number: 2.6.4.b
    text: airmix spuiten;
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.6
  - number: 2.6.4.c
    text: pneumatisch spuiten;
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.6
  - number: 2.6.4.d
    text: twee componenten spuiten.
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.6
  - number: 2.7.1
    text: |-
      Als stoffen als bedoeld in [artikel 3.10, tweede lid, van het besluit][ref1] worden aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0029789#Artikel3
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0029789
        artikel: '3'
  - number: 2.7.1.a
    text: stoffen uit categorie A;
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.7
  - number: 2.7.1.b
    text: stoffen uit categorie B;
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.7
  - number: 2.7.1.c
    text: stoffen uit categorie C.
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.7
  - number: 2.7.2
    text: 'Als stoffen uit categorie A worden aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.7
  - number: 2.7.2.a
    text: basalt;
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.7
  - number: 2.7.2.b
    text: beton en betonmortel;
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.7
  - number: 2.7.2.c
    text: schoonmetselwerk;
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.7
  - number: 2.7.2.d
    text: cementgebonden deklagen;
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.7
  - number: 2.7.2.e
    text: niet verduurzaamd hout;
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.7
  - number: 2.7.2.f
    text: steenachtige ondergronden;
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.7
  - number: 2.7.2.g
    text: metallische ondergronden met uitzondering van zink, tin, koper of legeringen van die metalen.
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.7
  - number: 2.7.3
    text: 'Als stoffen uit categorie C worden aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.7
  - number: 2.7.3.a
    text: koolteer of koolteerderivaten;
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.7
  - number: 2.7.3.b
    text: lood- of chromaathoudende pigmenten;
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.7
  - number: 2.7.3.c
    text: antifoulings;
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.7
  - number: 2.7.3.d
    text: andere verven op basis van cadmium, tin of kwik dan genoemd in de onderdelen a tot en met c van dit lid.
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.7
  - number: 2.7.4
    text: Als stoffen uit categorie B worden aangemerkt stoffen die niet zijn aangemerkt als stoffen uit categorie A of C.
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.7
  - number: 2.8.1
    text: |-
      Indien reinigingswerkzaamheden worden uitgevoerd met behulp van een R1-techniek dan wel conserveringswerkzaamheden
      worden uitgevoerd waarbij geen stoffen uit categorie B of C worden gebruikt, behoeft, onverminderd
      [artikel 2.1][ref1], een eventueel aanwezige hulpconstructie geen voorzieningen te bevatten ter voorkoming van het
      lozen in een oppervlaktewaterlichaam.


      [ref1]: https://wetten.overheid.nl/BWBR0029887#Artikel2
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.8
    references:
      - id: ref1
        bwb_id: BWBR0029887
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.8.2
    text: |-
      Indien reinigingswerkzaamheden worden uitgevoerd met behulp van een R1-, R2- of R3-techniek dan wel
      conserveringswerkzaamheden worden uitgevoerd waarbij geen stoffen uit categorie B of C worden gebruikt, en de
      afstand van het te behandelen deel van het oppervlak tot het wateroppervlak minder dan 50 centimeter bedraagt,
      behoeft, onverminderd [artikel 2.1][ref1], een eventueel aanwezige hulpconstructie geen voorzieningen te bevatten
      ter voorkoming van het lozen in een oppervlaktewaterlichaam.


      [ref1]: https://wetten.overheid.nl/BWBR0029887#Artikel2
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.8
    references:
      - id: ref1
        bwb_id: BWBR0029887
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.9.1
    text: |-
      Indien reinigingswerkzaamheden worden uitgevoerd met behulp van een R2-techniek dan wel conserveringswerkzaamheden
      worden uitgevoerd met behulp van een C1-techniek waarbij een stof uit categorie B wordt gebruikt, worden die
      werkzaamheden uitgevoerd boven een hulpconstructie waarvan de vloer stofdicht is, is voorzien van opstaande
      randen met een hoogte van ten minste 20 centimeter en voor zover mogelijk aan alle zijden uitsteekt buiten het te
      behandelen object.
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.9
  - number: 2.9.2
    text: |-
      Indien conserveringswerkzaamheden worden uitgevoerd met behulp van een C1-techniek waarbij een stof uit categorie
      C wordt gebruikt en bij een windsnelheid hoger dan 8 meter per seconde, wordt de hulpconstructie als bedoeld
      in het eerste lid ten minste uitgebreid met zijwanden van gaasnetten met een maaswijdte van ten hoogste 0,4 bij
      0,4 millimeter of zeilen, die aansluiten op de vloer en minimaal 1 meter boven het te behandelen deel van het
      object uitsteken.
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.9
  - number: 2.10.1
    text: |-
      Indien reinigingswerkzaamheden worden uitgevoerd met behulp van een R3-techniek, waarbij een stof uit categorie A
      vrijkomt, wordt in aanvulling op de maatregelen bedoeld in [artikel 2.10, tweede lid][ref1], de hulpconstructie ook
      aan de bovenzijde afgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0029887#Artikel2
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0029887
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 2.10.2
    text: |-
      Indien reinigingswerkzaamheden worden uitgevoerd met behulp van een R3-techniek, waarbij een metallisch
      straalmiddel wordt gebruikt en een stof uit categorie B vrijkomt, worden de zijwanden en bovenafsluiting van de
      hulpconstructie als bedoeld in het eerste lid winddicht uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.10
  - number: 2.10.3
    text: |-
      Indien reinigingswerkzaamheden worden uitgevoerd met behulp van een R3-techniek waarbij smeltslakgrit of een
      mineraal straalmiddel wordt gebruikt en een stof uit categorie B vrijkomt dan wel waarbij metallisch straalmiddel
      wordt gebruikt en een stof uit categorie C vrijkomt, wordt in aanvulling op het tweede lid tijdens de werkzaamheden
      gezorgd voor een permanente onderdruk in de hulpconstructie. In de daarbij geëmitteerde lucht mag het stofgehalte
      niet meer bedragen dan 10 mg/Nm3, bepaald volgens NEN/ISO 9096.
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.10
  - number: 2.10.4
    text: |-
      Indien reinigingswerkzaamheden worden uitgevoerd met behulp van een R3-techniek, waarbij smeltslakgrit of een
      mineraal straalmiddel wordt gebruikt en een stof uit categorie C vrijkomt dan wel conserveringswerkzaamheden
      die worden uitgevoerd met behulp van een C3-techniek, waarbij een stof uit categorie C wordt gebruikt, worden
      in aanvulling op het derde lid, de zijwanden en bovenzijde van de hulpconstructie als bedoeld in het derde lid,
      stofdicht uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.10
  - number: 2.11.1
    text: |-
      Indien reinigingswerkzaamheden worden uitgevoerd met behulp van een R4-techniek wordt de vloer van de
      hulpconstructie als bedoeld in [artikel 2.9, eerste lid][ref1] vloeistofdicht uitgevoerd en wordt de
      hulpconstructie uitgebreid met zijwanden van gaasnetten met een maaswijdte van ten hoogste 0,4 bij 0,4 millimeter,
      die aansluiten op de vloer en minimaal 1 meter boven het te behandelen deel van het object uitsteken.


      [ref1]: https://wetten.overheid.nl/BWBR0029887#Artikel2
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.11
    references:
      - id: ref1
        bwb_id: BWBR0029887
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 2.11.2
    text: |-
      Bij het lozen van de in de hulpconstructie opgevangen vloeistof bedraagt het gehalte aan onopgeloste bestanddelen
      niet meer dan 50 milligram per liter.
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.11
  - number: 2.12.1
    text: |-
      Indien reinigingswerkzaamheden worden uitgevoerd met behulp van een R5-techniek waarbij een stof uit categorie A
      vrijkomt, is [artikel 2.11][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0029887#Artikel2
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0029887
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 2.12.2
    text: |-
      Indien reinigingswerkzaamheden worden uitgevoerd met behulp van een R5-techniek waarbij smeltslakgrit of mineraal
      straalmiddel wordt gebruikt, wordt de hulpconstructie als bedoeld in [artikel 2.11][ref1] ook aan de bovenzijde
      afgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0029887#Artikel2
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0029887
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 2.12.3
    text: |-
      Indien reinigingswerkzaamheden worden uitgevoerd met behulp van een R5-techniek, waarbij een stof uit categorie
      B vrijkomt of conserveringswerkzaamheden worden uitgevoerd met behulp van een C2-techniek waarbij een stof uit
      categorie B wordt gebruikt, worden de zijwanden en de bovenzijde als bedoeld in het tweede lid, vloeistofdicht
      uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.12
  - number: 2.12.4
    text: |-
      Indien reinigingswerkzaamheden worden uitgevoerd met behulp van een R5-techniek waarbij een stof uit categorie
      C vrijkomt of conserveringswerkzaamheden worden uitgevoerd met behulp van een C2-techniek waarbij een stof uit
      categorie C wordt gebruikt of conserveringswerkzaamheden worden uitgevoerd met behulp van een C3-techniek waarbij
      een stof uit categorie B wordt gebruikt, wordt in aanvulling op het derde lid tijdens de werkzaamheden gezorgd voor
      een permanente onderdruk in de hulpconstructie. In de daarbij geëmitteerde lucht bedraagt het stofgehalte niet meer
      dan 10 mg/Nm3, bepaald volgens NEN/ISO 9096.
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.12
  - number: '2.13'
    text: |-
      Indien reinigingswerkzaamheden of conserveringswerkzaamheden worden uitgevoerd aan spoorbruggen, bevat de
      hulpconstructie in afwijking van de [artikelen 2.9 tot en met 2.12][ref1] aan de bovenzijde geen hulpconstructie
      en aan de in- en uitrijrichting geen zijwand en lopen de zijwanden maximaal twee meter boven het te behandelen deel
      van het object door.


      [ref1]: https://wetten.overheid.nl/BWBR0029887#Artikel2
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0029887
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '2.14'
    text: |-
      Indien reinigingswerkzaamheden of conserveringswerkzaamheden worden uitgevoerd aan vaste objecten die
      direct in contact staan met een oppervlaktewaterlichaam, omsluit de hulpconstructie in afwijking van de
      [artikelen 2.9 tot en met 2.12][ref1] de ruimte waarin wordt gewerkt zoveel mogelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0029887#Artikel2
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.14
    references:
      - id: ref1
        bwb_id: BWBR0029887
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '2.15'
    text: |-
      Indien reinigingswerkzaamheden of conserveringswerkzaamheden worden uitgevoerd aan een vast object dat door
      het aanbrengen van een hulpconstructie beperkt stabiel wordt, omsluit de hulpconstructie in afwijking van de
      [artikelen 2.9 tot en met 2.12][ref1] de ruimte waarin wordt gewerkt zoveel mogelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0029887#Artikel2
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.15
    references:
      - id: ref1
        bwb_id: BWBR0029887
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '2.16'
    text: |-
      Voor de toepassing van [artikel 3.13, tweede lid van het besluit][ref1] worden in ieder geval de volgende goederen
      als inerte goederen beschouwd, voor zover deze niet verontreinigd zijn met bodembedreigende stoffen:


      [ref1]: https://wetten.overheid.nl/BWBR0029789#Artikel3
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.16
    references:
      - id: ref1
        bwb_id: BWBR0029789
        artikel: '3'
  - number: 2.16.a
    text: schoon, onbehandeld hout;
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.16
  - number: 2.16.b
    text: snoeihout;
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.16
  - number: 2.16.c
    text: banden van voertuigen;
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.16
  - number: 2.16.d
    text: straatmeubilair;
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.16
  - number: 2.16.e
    text: tuinmeubilair;
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.16
  - number: 2.16.f
    text: aluminium, ijzer, roestvrij staal;
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.16
  - number: 2.16.g
    text: papier en karton;
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.16
  - number: 2.16.h
    text: textiel en tapijt, en
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.16
  - number: 2.16.i
    text: vlakglas.
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.16
  - number: '2.17'
    text: |-
      Aan [artikel 3.13, vierde lid, onder c, van het besluit][ref1] wordt bij het opslaan van goederen in de buitenlucht
      in ieder geval voldaan indien:


      [ref1]: https://wetten.overheid.nl/BWBR0029789#Artikel3
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.17
    references:
      - id: ref1
        bwb_id: BWBR0029789
        artikel: '3'
  - number: 2.17.a
    text: op de laad- en loskade tot 2 meter uit de kaderand of oever geen opslag van goederen plaatsvindt, of
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.17
  - number: 2.17.b
    text: er een deugdelijke keerwand aanwezig is en er geen product tussen de keerwand en de kade of oever ligt.
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.17
  - number: 2.18.1
    text: |-
      Aan [artikel 3.13, vierde lid, onder c, van het besluit][ref1] wordt bij het laden en lossen van schepen met inerte
      goederen in ieder geval voldaan indien:


      [ref1]: https://wetten.overheid.nl/BWBR0029789#Artikel3
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.18
    references:
      - id: ref1
        bwb_id: BWBR0029789
        artikel: '3'
  - number: 2.18.1.a
    text: |-
      bij het laden en lossen van inerte goederen de afstand tussen wal en schip zo klein mogelijk is, en in ieder geval
      niet groter is dan 5 meter, of
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.18
  - number: 2.18.1.b
    text: het schip, waarin of waaruit wordt overgeslagen, met de wal wordt verbonden door een ponton of een morsklep.
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.18
  - number: 2.18.2
    text: |-
      Bij het laden en lossen van schepen met inerte goederen wordt het schoonmaken van grijpers wordt zo uitgevoerd dat
      overslagresten of spoelwater niet in een oppervlaktewaterlichaam geraken.
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.18
  - number: '2.19'
    text: |-
      Andere goederen, niet zijnde inerte goederen, die boven een oppervlaktewaterlichaam bovendeks aanwezig zijn, staan
      opgesteld:
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.19
  - number: 2.19.a
    text: |-
      boven een voorziening die zich rondom of onder de opgeslagen goederen bevindt en de gelekte vloeistoffen opvangt en
      zodanig is uitgevoerd dat er geen hemelwater op of in terecht kan komen, of
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.19
  - number: 2.19.b
    text: |-
      boven een doelmatige fysieke voorziening die vrijgekomen stoffen keert zolang als nodig is om met daarop afgestemde
      maatregelen te voorkomen dat deze stoffen in een oppervlaktewaterlichaam kunnen geraken.
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.19
  - number: '2.20'
    text: |-
      Aan [artikel 3.13, vierde lid, onder a en b, van het besluit][ref1] wordt bij het opslaan van goederen in de
      buitenlucht behorend tot de stuifklasse S2 van [bijlage 3 bij het Activiteitenbesluit milieubeheer][ref2] in ieder
      geval voldaan indien de stoffen door besproeiing vochtig worden gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0029789#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022762
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.20
    references:
      - id: ref1
        bwb_id: BWBR0029789
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0022762
  - number: '2.21'
    text: |-
      Aan [artikel 3.13, vierde lid, onder a en b, van het besluit][ref1] wordt bij het mengen van goederen behorend tot
      de stuifklasse S2 en S4 van [bijlage 3 bij het Activiteitenbesluit milieubeheer][ref2] in de buitenlucht in ieder
      geval voldaan indien bij het opbouwen en afgraven van een menghoop deze goederen worden bevochtigd.


      [ref1]: https://wetten.overheid.nl/BWBR0029789#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022762
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.21
    references:
      - id: ref1
        bwb_id: BWBR0029789
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0022762
  - number: '2.22'
    text: |-
      Aan [artikel 3.13, vierde lid 4, onder a en b, van het besluit][ref1] wordt bij overslag van stuifgevoelige
      goederen in ieder geval voldaan indien:


      [ref1]: https://wetten.overheid.nl/BWBR0029789#Artikel3
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.22
    references:
      - id: ref1
        bwb_id: BWBR0029789
        artikel: '3'
  - number: 2.22.a
    text: bij het laden en lossen in de open lucht de storthoogte wordt beperkt tot minder dan één meter, of
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.22
  - number: 2.22.b
    text: |-
      goederen uit de stuifklasse S2 en S4 van [bijlage 3 bij het Activiteitenbesluit milieubeheer][ref1] afdoende worden
      bevochtigd, zo mogelijk vooraf, of


      [ref1]: https://wetten.overheid.nl/BWBR0022762
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.22
    references:
      - id: ref1
        bwb_id: BWBR0022762
  - number: 2.22.c
    text: |-
      de stofemissie van goederen uit de stuifklasse S2 en S4 van
      [bijlage 3 bij het Activiteitenbesluit milieubeheer][ref1] tijdens het laden en lossen met een nevelgordijn wordt
      tegengegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0022762
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.22
    references:
      - id: ref1
        bwb_id: BWBR0022762
  - number: '2.23'
    text: |-
      Onverminderd [artikel 2.22][ref1] wordt aan [artikelen 3.13, vierde lid onder a en b, van het besluit][ref2] bij
      het verladen van goederen behorend tot:


      [ref1]: https://wetten.overheid.nl/BWBR0029887#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0029789#Artikel3
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.23
    references:
      - id: ref1
        bwb_id: BWBR0029887
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0029789
        artikel: '3'
  - number: 2.23.a
    text: |-
      stuifklasse S2 van [bijlage 3 bij het Activiteitenbesluit milieubeheer][ref1] door middel van storttrechters
      in ieder geval voldaan indien de goederen worden bevochtigd met behulp van een doelmatig werkende watersproei-
      installatie;


      [ref1]: https://wetten.overheid.nl/BWBR0022762
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.23
    references:
      - id: ref1
        bwb_id: BWBR0022762
  - number: 2.23.b
    text: |-
      stuifklasse S3 van [bijlage 3 bij het Activiteitenbesluit milieubeheer][ref1] door middel van storttrechters in
      ieder geval voldaan indien de trechters zijn voorzien van doelmatige windreductieschermen;


      [ref1]: https://wetten.overheid.nl/BWBR0022762
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.23
    references:
      - id: ref1
        bwb_id: BWBR0022762
  - number: 2.23.c
    text: |-
      stuifklasse S4 van [bijlage 3 bij het Activiteitenbesluit milieubeheer][ref1] door middel van storttrechters
      in ieder geval voldaan indien de goederen worden bevochtigd met behulp van een doelmatig werkende watersproei-
      installatie, of indien de trechters zijn voorzien van doelmatige windreductieschermen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.23
    references:
      - id: ref1
        bwb_id: BWBR0022762
  - number: '2.24'
    text: |-
      Onverminderd [artikel 2.22][ref1] wordt aan [artikel 3.13, vierde lid, onder a en b, van het besluit][ref2]
      bij het laden en lossen van goederen behorend tot stuifklasse S1, S2 en S3 van
      [bijlage 3 bij het Activiteitenbesluit milieubeheer][ref3] met behulp van grijpers in ieder geval voldaan indien
      het laden en lossen plaatsvindt met deugdelijke en van de bovenkant afgesloten grijpers.


      [ref1]: https://wetten.overheid.nl/BWBR0029887#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0029789#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0022762
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.24
    references:
      - id: ref1
        bwb_id: BWBR0029887
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0029789
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0022762
  - number: '2.25'
    text: |-
      Onverminderd [artikel 2.22][ref1] wordt aan [artikel 3.13, vierde lid, onder a en b, van het besluit][ref2]
      bij het beladen en lossen van lichters met goederen behorend tot de stuifklasse S1, S2, S3 en S4 van
      [bijlage 3 bij het Activiteitenbesluit milieubeheer][ref3] in ieder geval voldaan indien de lichterbelader is
      uitgerust met een stortkoker die nagenoeg tot op de bodem van het ruim of tot op het reeds gestorte materiaal
      reikt.


      [ref1]: https://wetten.overheid.nl/BWBR0029887#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0029789#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0022762
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.25
    references:
      - id: ref1
        bwb_id: BWBR0029887
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0029789
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0022762
  - number: '2.26'
    text: |-
      Als interventiewaarde als bedoeld in [artikel 3.17, tweede lid, van het besluit][ref1] gelden
      de waarden die met betrekking tot de in die tabel genoemde stoffen zijn opgenomen in tabel 2 van
      [bijlage B, behorende bij de Regeling bodemkwaliteit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0029789#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.26
    references:
      - id: ref1
        bwb_id: BWBR0029789
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0023085
  - number: '2.27'
    text: |-
      In deze paragraaf wordt verstaan onder: - *fabrikant:* degene die verantwoordelijk is de conformiteit van de
      productie;
        - *technische dienst:* onderneming of dienst die testen als bedoeld in de bijlage bij deze regeling kan verrichten;
        - *typegoedkeuring:* goedkeuring van een tot een bepaald type horende voorziening;
        - *zuiveringsvoorziening:* zuiveringsvoorziening als bedoeld in [artikel 3.9, tweede lid, van het besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029789#Artikel3
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.27
    references:
      - id: ref1
        bwb_id: BWBR0029789
        artikel: '3'
  - number: 2.28.1
    text: |-
      Een zuiveringsvoorziening heeft een zodanige werking dat het te lozen toiletwater, na door de zuiveringsvoorziening
      te zijn geleid:
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.28
  - number: 2.28.1.a
    text: |-
      van de parameter *Intestinale enterokokken* maximaal 330 kolonievormende eenheden per 100 ml bevat, gebaseerd op
      een beoordeling van het 90-percentiel en geanalyseerd overeenkomstig NEN-EN-ISO 7899-1 of NEN-EN-ISO 7899-2;
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.28
  - number: 2.28.1.b
    text: |-
      van de parameter *Escherichia coli* maximaal 900 kolonievormende eenheden per 100 ml bevat, gebaseerd op een
      beoordeling van het 90-percentiel en geanalyseerd overeenkomstig NEN-EN-ISO 9308-3 of NEN-EN-ISO 9308-1.
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.28
  - number: 2.28.2
    text: |-
      Uitgaande van een beoordeling van de normale waarschijnlijkheidsverdeling van logvan de microbiologische gegevens
      van het gezuiverde toiletwater wordt de in het eerste lid, onder a of b, bedoelde percentielwaarde als volgt
      afgeleid:
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.28
  - number: 2.28.2.a
    text: |-
      neem de log-waarde van alle bacterietellingen in de te beoordelen gegevensreeks. Indien het resultaat een nulwaarde
      is, neem dan de log-waarde van de minimum detectielimiet van de gebruikte analytische methode;
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.28
  - number: 2.28.2.b
    text: bepaal het rekenkundig gemiddelde van de log-waarden (μ);
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.28
  - number: 2.28.2.c
    text: bepaal de standaardafwijking van de log-waarden (σ);
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.28
  - number: 2.28.3
    text: |-
      Geborgd is dat via de zuiveringsvoorziening geen onbehandeld toiletwater kan worden geloosd als deze uitgeschakeld
      is of niet in bedrijf is.
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.28
  - number: 2.29.1
    text: |-
      Met een certificaat van typegoedkeuring, afgegeven door een erkende instantie, wordt aangetoond dat een
      zuiveringsvoorziening volgens één van de in de bijlage bij deze regeling opgenomen testen voldoet aan de eisen,
      bedoeld in [artikel 2.28][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029887#Artikel2
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.29
    references:
      - id: ref1
        bwb_id: BWBR0029887
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 2.29.2
    text: |-
      Bij een zuiveringsvoorziening is een kopie van het certificaat van typegoedkeuring aanwezig die kan worden getoond
      aan de toezichthouder.
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.29
  - number: 2.29.3
    text: 'Een certificaat van typegoedkeuring kan door de instantie worden ingetrokken als:'
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.29
  - number: 2.29.3.a
    text: |-
      na afgifte blijkt dat het certificaat is afgegeven op grond van onjuiste aangeleverde gegevens en het niet zou zijn
      afgegeven als de juiste gegevens ten tijde van de afgifte bekend zouden zijn geweest;
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.29
  - number: 2.29.3.b
    text: het certificaat, anders dan de reden genoemd onder a, ten onrechte is verleend;
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.29
  - number: 2.29.3.c
    text: in het certificaat onbevoegd wijzigingen zijn aangebracht; of
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.29
  - number: 2.29.3.d
    text: |-
      na afgifte blijkt dat er significante risico’s zijn aan het gebruik van de zuiveringsvoorziening ten aanzien van de
      gezondheid, de veiligheid of het milieu.
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.29
  - number: 2.30.1
    text: |-
      De instantie, bedoelt in [artikel 2.29, eerste lid][ref1], verleent een certificaat van typegoedkeuring als de
      zuiveringsvoorziening:


      [ref1]: https://wetten.overheid.nl/BWBR0029887#Artikel2
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.30
    references:
      - id: ref1
        bwb_id: BWBR0029887
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 2.30.1.a
    text: overeenstemt met de aangeleverde gegevens;
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.30
  - number: 2.30.1.b
    text: |-
      na demonstratie van het prototype zuiveringsvoorziening door de fabrikant volgens één van de in de bijlage
      opgenomen testen voldoet aan de eisen bedoeld in [artikel 2.28][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0029887#Artikel2
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.30
    references:
      - id: ref1
        bwb_id: BWBR0029887
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 2.30.1.c
    text: |-
      als tijdens het testen niet gebleken is dat aan het gebruik van de zuiveringsvoorziening significante risico’s zijn
      ten aanzien van de gezondheid, de veiligheid of het milieu.
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.30
  - number: 2.30.2
    text: |-
      Ten behoeve van het verlenen van het certificaat van typegoedkeuring stelt de instantie een aanvraagprocedure
      vast waarmee in ieder geval wordt gevraagd om gegevens met betrekking tot ontwerp, kenmerken en prestaties
      van de zuiveringsvoorziening, de onderdelen en afstellingen die van invloed zijn op het niveau van de
      toiletwaterzuivering, evenals de wijzigingen daarvan.
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.30
  - number: 2.30.3
    text: |-
      De instantie neemt in het certificaat eventuele beperkende voorwaarden aan het functioneren van de
      zuiveringsvoorziening op die vervuld moeten zijn voordat een zuiveringsvoorziening voldoet aan de eisen bedoeld
      in [artikel 2.28][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029887#Artikel2
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.30
    references:
      - id: ref1
        bwb_id: BWBR0029887
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 2.31.1
    text: |-
      De instantie, bedoeld in [artikel 2.29, eerste lid][ref1], is erkend door Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0029887#Artikel2
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.31
    references:
      - id: ref1
        bwb_id: BWBR0029887
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 2.31.2
    text: 'Een instantie wordt erkend als naar het oordeel van Onze Minister is voldaan aan de volgende voorwaarden:'
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.31
  - number: 2.31.2.a
    text: de instantie is geaccrediteerd volgens NEN-EN-ISO/IEC 17065; en
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.31
  - number: 2.31.2.b
    text: |-
      de instantie is in staat een deskundig en onafhankelijk oordeel te vellen of de zuiveringsvoorziening aan de eisen,
      bedoeld in [artikel 2.28][ref1] voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0029887#Artikel2
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.31
    references:
      - id: ref1
        bwb_id: BWBR0029887
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 2.31.3
    text: Een instantie kan een aanvraag tot erkenning indienen bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.31
  - number: 2.31.4
    text: Onze Minister houdt een lijst bij van erkende instanties en stelt deze beschikbaar.
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.31
  - number: '2.32'
    text: |-
      Op een zuiveringsvoorziening zijn, op een voor de toezichthouder goed zichtbare plaats, de volgende gegevens
      aanwezig:
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.32
  - number: 2.32.a
    text: handelsmerk of handelsnaam van de fabrikant;
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.32
  - number: 2.32.b
    text: naam en serienummer van de zuiveringsvoorziening;
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.32
  - number: 2.32.c
    text: bouwjaar van de zuiveringsvoorziening; en
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.32
  - number: 2.32.d
    text: |-
      naam van de instantie, bedoeld in [artikel 2.29, eerste lid][ref1], en het nummer van het verleende certificaat.


      [ref1]: https://wetten.overheid.nl/BWBR0029887#Artikel2
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.32
    references:
      - id: ref1
        bwb_id: BWBR0029887
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 2.33.1
    text: |-
      De zuiveringsvoorziening wordt overeenkomstig de instructies van de fabrikant geïnstalleerd, gebruikt en
      onderhouden om zeker te stellen dat de zuiveringsvoorziening overeenkomstig de daaraan gestelde eisen functioneert.
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.33
  - number: 2.33.2
    text: De in het tweede bedoelde instructies van de fabrikant moeten getoond kunnen worden aan de toezichthouder.
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.33
  - number: 2.34.1
    text: |-
      De instantie, bedoeld in [artikel 2.29, eerste lid][ref1], kan een technische dienst machtigen voor het verrichten
      van een test als bedoeld in de bijlage bij deze regeling, mits deze technische dienst:


      [ref1]: https://wetten.overheid.nl/BWBR0029887#Artikel2
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.34
    references:
      - id: ref1
        bwb_id: BWBR0029887
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 2.34.1.a
    text: voldoet aan NEN-EN-ISO/IEC 17025; en
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.34
  - number: 2.34.1.b
    text: niet ook fabrikant is van zuiveringsvoorzieningen.
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.34
  - number: '2.35'
    text: |-
      In afwijking van [paragraaf 2.5][ref1] gelden er geen eisen aan een zuiveringsvoorziening als bedoeld in
      [artikel 2.27][ref2] als uitsluitend urine wordt geloosd.


      [ref1]: https://wetten.overheid.nl/BWBR0029887#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0029887#Artikel2
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.35
    references:
      - id: ref1
        bwb_id: BWBR0029887
        hoofdstuk: '2'
        paragraaf: '2.5'
      - id: ref2
        bwb_id: BWBR0029887
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 2a.1.1
    text: |-
      Voor het bijhouden van een registratie met betrekking tot het in werking hebben van een gesloten
      bodemenergiesysteem overeenkomstig [artikel 3a.8, eerste lid, onder a, van het besluit][ref1] worden tijdens de
      bedrijfsvoering van het systeem momentane metingen uitgevoerd met een nauwkeurigheid van ten minste 0,3°C en een
      frequentie van ten minste eenmaal per 15 minuten.


      [ref1]: https://wetten.overheid.nl/BWBR0029789#Artikel3a
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2a.1
    references:
      - id: ref1
        bwb_id: BWBR0029789
        artikel: 3a
  - number: 2a.1.2
    text: |-
      Voor het bijhouden en registreren van gegevens met betrekking tot een gesloten bodemenergiesysteem overeenkomstig
      [artikel 3a.8, eerste lid, onder b, van het besluit][ref1] worden tijdens de bedrijfsvoering van het systeem
      momentane metingen uitgevoerd met een nauwkeurigheid van ten minste 5 % en een frequentie van ten minste eenmaal
      per 15 minuten.


      [ref1]: https://wetten.overheid.nl/BWBR0029789#Artikel3a
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2a.1
    references:
      - id: ref1
        bwb_id: BWBR0029789
        artikel: 3a
  - number: 2a.2
    text: |-
      Het energierendement dat een gesloten bodemenergiesysteem behaalt bij de levering van warmte of koude
      aan een bouwwerk, wordt bepaald overeenkomstig de volgende formule: waarbij wordt verstaan onder: *Q*: de
      door het bodemenergiesysteem aan het bouwwerk geleverde hoeveelheid warmte per jaar in MWh; *Q*: de door
      het bodemenergiesysteem aan het bouwwerk geleverde hoeveelheid koude per jaar in MWh; *E*: de door het
      bodemenergiesysteem verbruikte hoeveelheid elektriciteit per jaar in MWh; *G*: de door het bodemenergiesysteem
      verbruikte hoeveelheid gas per jaar in MWh.
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2a.2
  - number: 4.1.1
    text: |-
      [Artikel 2.3][ref1] is niet van toepassing op een zuiveringsvoorziening die is geplaatst voor 1 juli 2012, indien
      die zuiveringsvoorziening bestaat uit een septic tank, die een nominale inhoud heeft van ten minste 6 kubieke
      meter, en waarbij:


      [ref1]: https://wetten.overheid.nl/BWBR0029887#Artikel2
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0029887
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 4.1.1.a
    text: de septic tank uit drie compartimenten bestaat;
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel4.1
  - number: 4.1.1.b
    text: |-
      de nominale inhoud, in de stroomrichting, over de compartimenten is verdeeld in de verhouding twee staat tot één
      staat tot één;
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel4.1
  - number: 4.1.1.c
    text: |-
      de scheidingswanden tussen de compartimenten van de septic tank ten minste 20 centimeter boven het waterniveau
      uitsteken;
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel4.1
  - number: 4.1.1.d
    text: |-
      de instroomopening in het eerste compartiment van de septic tank zich ten minste 10 centimeter boven het
      waterniveau bevindt;
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel4.1
  - number: 4.1.1.e
    text: de toevoerpijp ten minste 5 centimeter en ten hoogste 10 centimeter uit de binnenwand steekt;
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel4.1
  - number: 4.1.1.f
    text: |-
      de doorstroomopeningen in scheidingswanden tussen de compartimenten van de septic tank zodanig zijn uitgevoerd,
      dat:
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel4.1
  - number: 4.1.1.f.1°
    text: doorvoer van bodemslib en drijflagen wordt voorkomen;
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel4.1
  - number: 4.1.1.f.2°
    text: |-
      de gezamenlijke oppervlakte van de doorstroomopeningen per scheidingswand ten minste 100 vierkante centimeter en
      ten hoogste 400 vierkante centimeter bedraagt;
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel4.1
  - number: 4.1.1.f.3°
    text: de bovenkant van de doorstroomopeningen ten minste 30 centimeter onder het waterniveau ligt; en
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel4.1
  - number: 4.1.1.f.4°
    text: |-
      de onderkant van de doorstroomopeningen hoger ligt dan de helft van de waterhoogte gemeten vanaf de bodem van de
      septic tank;
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel4.1
  - number: 4.1.1.g
    text: |-
      de afvoeropening van een septic tank voorzien is van een duikschot of een T-stuk zodat afvoer van bodemslib of
      drijflagen wordt voorkomen; en
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel4.1
  - number: 4.1.1.h
    text: 'de waterhoogte in een septic tank ten minste 1,2 meter bedraagt en ten hoogste bedraagt:'
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel4.1
  - number: 4.1.1.h.1°
    text: 2,2 meter bij een inhoud van ten hoogste 10 kubieke meter;
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel4.1
  - number: 4.1.1.h.2°
    text: 2,5 meter bij een inhoud van meer dan 10 kubieke meter.
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel4.1
  - number: 4.1.2
    text: |-
      Indien afzonderlijke septic tanks als bedoeld in het eerste lid parallel zijn geschakeld, bedraagt de gezamenlijke
      nominale inhoud ten minste 6 kubieke meter en voldoet iedere tank afzonderlijk aan de voorschriften genoemd in het
      eerste lid, onderdelen a tot en met h.
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel4.1
  - number: 4.1.3
    text: |-
      Opdeling van de septic tank als bedoeld in het eerste lid in afzonderlijke in serie geschakelde tanks is
      toegestaan, mits de nominale inhoud van één compartiment niet over verschillende tanks is verdeeld. De
      afzonderlijke septic tanks gelden tezamen als één septic tank.
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel4.1
  - number: '4.2'
    text: |-
      De [Regeling meldingen Lozingenbesluit Wvo vaste objecten][ref1] wordt ingetrokken.


