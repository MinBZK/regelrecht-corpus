    text: R5-technieken.
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.5
  - number: 2.5.2
    text: 'Als R1-technieken worden aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.5
  - number: 2.5.2.a
    text: afwassen met water;
    url: https://wetten.overheid.nl/BWBR0029887/2023-07-07#Artikel2.5
