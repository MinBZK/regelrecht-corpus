articles:
  - number: '1'
    text: >-
      De bij dit besluit gevoegde ‘[selectielijst voor de neerslag van de handelingen van de Minister van Economische
      Zaken en de onder hem ressorterende actoren op het beleidsterrein regulering van en het toezicht op de centrale
      bank, het kredietwezen, het effectenverkeer, het giroverkeer (en de Rijkspostspaarbank), het voorkomen van het
      witwassen van uit criminele activiteiten verkregen gelden en het financiële verkeer in buitengewone omstandigheden
      over de periode vanaf 1940](onbekend)’ en de daarbij behorende toelichting worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0022901/2007-11-28#Artikel1
  - number: '2'
    text: >-
      Dit besluit treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0022901/2007-11-28#Artikel2
