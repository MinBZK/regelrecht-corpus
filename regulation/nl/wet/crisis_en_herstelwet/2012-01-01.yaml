  - number: '2.1'
    text: |-
      In deze afdeling en de daarop berustende bepalingen wordt verstaan onder:

      a. *milieugebruiksruimte:* binnen een ontwikkelingsgebied aanwezige marge tussen de bestaande milieukwaliteit en de
      voor dat gebied geldende milieukwaliteitsnormen, die kan worden benut voor milieubelastende activiteiten;

      b. *milieukwaliteitsnorm:* bij wettelijk voorschrift gestelde norm ten aanzien van de kwaliteit van een onderdeel
      van het milieu.
    url: https://wetten.overheid.nl/BWBR0027431/2012-01-01#Artikel2.1
  - number: '2.2'
    text: |-
      1 Bij algemene maatregel van bestuur op de voordracht van Onze Minister-President, Minister van Algemene Zaken,
      in overeenstemming met Onze Minister of Onze Ministers wie het mede aangaat, kan bij wijze van experiment een
      gebied, zijnde bestaand stedelijk gebied of bestaand bedrijventerrein, voor de duur van ten hoogste tien jaar
      worden aangewezen als ontwikkelingsgebied, indien dat met het oog op het versterken van de duurzame ruimtelijke en
      economische ontwikkeling van dat gebied bijzonder aangewezen is.

      2 Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer zendt uiterlijk drie maanden na de
      beëindiging van een experiment een verslag over de doeltreffendheid en de effecten ervan, alsmede een standpunt
      inzake de voortzetting ervan anders dan als experiment, aan de beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0027431/2012-01-01#Artikel2.2
  - number: '2.3'
    text: |-
      1 Voor een ontwikkelingsgebied stelt de gemeenteraad een gebiedsontwikkelingsplan vast dat deel uitmaakt van het
      bestemmingsplan. Het bestemmingsplan en het exploitatieplan worden overeenkomstig met het gebiedontwikkelingsplan
      gewijzigd en worden tegelijkertijd met het gebiedsontwikkelingsplan vastgesteld. Het gebiedsontwikkelingsplan
      is gericht op een optimalisering van de milieugebruiksruimte met het oog op het versterken van een duurzame
      ruimtelijke en economische ontwikkeling van dat gebied in samenhang met het totstandbrengen van een goede
      milieukwaliteit. Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld, zo nodig per
      aangewezen gebied als bedoeld in [artikel 2.2. eerste lid][ref1], over de wijze waarop de optimalisering van de
      milieugebruiksruimte plaats kan vinden.

      2 Een gebiedsontwikkelingsplan bevat:

      a. de vanwege het optimaliseren van de milieugebruiksruimte door de gemeenteraad voorgenomen projecten in het
      ontwikkelingsgebied;

      b. de voorgenomen maatregelen en werken in het gebied ten behoeve van een goede milieukwaliteit;

      c. de in het gebied noodzakelijke maatregelen en werken ter compensatie van het beslag op milieugebruiksruimte door
      de in het gebiedsontwikkelingsplan voorziene ruimtelijke ontwikkelingen;

      d. zo nodig een fasering en koppeling bij de tenuitvoerlegging van de in de onderdelen a, b en c bedoelde
      projecten, maatregelen en werken;

      e. een raming van de kosten van uitvoering van het gebiedsontwikkelingsplan, een beschrijving van de wijze
      waarop daarin zal worden voorzien, en een beschrijving van de wijze waarop het bereiken van de met het
      gebiedsontwikkelingsplan beoogde resultaten zal worden nagestreefd;

      f. een overzicht van de tijdstippen waarop aan de gemeenteraad een rapportage zal worden uitgebracht over de
      voortgang en de uitvoering van de in de onderdelen a, b en c bedoelde projecten, maatregelen en werken, die op
      verzoek tevens wordt verstrekt aan Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer.

      3 [Afdeling 3.4 van de Algemene wet bestuursrecht][ref2] is van toepassing.

      4 Tegen een gebiedsontwikkelingsplan kan beroep worden ingesteld bij de Afdeling bestuursrechtspraak van de Raad
      van State. Het bestemmingsplan, het exploitatieplan en het gebiedsontwikkelingsplan worden voor de behandeling en
      uitspraak op het beroep aangemerkt als één besluit.

      5 Indien voor de uitvoering van maatregelen of werken als bedoeld in het tweede lid, onderdelen b en c, enig
      besluit is vereist, kunnen burgemeester en wethouders, met inachtneming van desbetreffende bindende besluiten
      van de Raad van de Europese Unie, van het Europees Parlement en de Raad gezamenlijk of van de Europese Commissie,
      dat besluit nemen, mits het gebiedsontwikkelingsplan waarin de maatregel of werken zijn opgenomen onherroepelijk
      is geworden en voor zover nodig in afwijking van bij algemene maatregel van bestuur aangegeven bepalingen bij of
      krachtens:

      a. de [Flora- en faunawet][ref3];

      b. de [Natuurbeschermingswet 1998][ref4];

      c. de [Ontgrondingenwet][ref5];

      d. de [Wet algemene bepalingen omgevingsrecht][ref6], voor zover het betreft een omgevingsvergunning voor een
      activiteit met betrekking tot een inrichting als bedoeld in [artikel 2.1, eerste lid, onder e, van die wet][ref7];

      e. de [Wet ammoniak en veehouderij][ref8]

      f. de [Wet bodembescherming][ref9];

      g. de [Wet geluidhinder][ref10], met dien verstande dat die afwijking niet leidt tot een geluidsbelasting binnen
      een woning met gesloten ramen, die hoger is dan 33 dB;

      h. de [Wet geurhinder en veehouderij][ref11];

      i. de [Wet inzake de luchtverontreiniging][ref12];

      j. de [Wet milieubeheer][ref13] met uitzondering van [artikel 5.2b][ref14] en [titel 5.2][ref15],

      met dien verstande dat na vaststelling van het plan uiterlijk na tien jaar alsnog wordt voldaan aan de bij
      of krachtens de wet gestelde milieukwaliteitsnormen. Indien er na deze periode niet wordt voldaan aan een
      milieukwaliteitsnorm geven burgemeester en wethouders aan op welke wijze alsnog aan die norm zal worden
      voldaan. Bij algemene maatregel van bestuur kunnen regels worden gesteld over de maximale afwijking van
      milieukwaliteitsnormen.

      6 Burgemeester en wethouders nemen in bij algemene maatregel van bestuur aangegeven categorieën van gevallen geen
      besluit als bedoeld in het vijfde lid dan nadat het bestuursorgaan dat krachtens de betrokken wet bevoegd zou zijn
      te beslissen, heeft verklaard dat het daartegen geen bedenkingen heeft.

      7 De verklaring, bedoeld in het zesde lid, kan slechts worden geweigerd met het oog op het belang dat de betrokken
      wet beoogt te beschermen.

      8 Het bestuursorgaan zendt het ontwerp van de verklaring binnen acht weken aan burgemeester en wethouders. In een
      geval als bedoeld in [artikel 3:18, tweede lid, van de Algemene wet bestuursrecht][ref16] kunnen burgemeester en
      wethouders deze termijn met een bij hun besluit te bepalen redelijke termijn verlengen.

      9 De [artikelen 2.27, tweede, vierde en vijfde lid][ref17], en
      [3.11, eerste, tweede, vijfde en zesde lid, van de Wet algemene bepalingen omgevingsrecht][ref18] zijn van
      overeenkomstige toepassing met dien verstande dat voor «omgevingsvergunning» telkens wordt gelezen «een besluit
      als bedoeld in artikel 2.3, vijfde lid, van de Crisis- en herstelwet» en voor «verklaring» telkens wordt gelezen:
      verklaring als bedoeld in artikel 2.3, zesde lid, van de Crisis- en herstelwet.

      10 De gemeente draagt zorg voor het uitvoeren van de maatregelen of werken, bedoeld in het tweede lid, onderdelen b
      en c, binnen een in het plan te noemen termijn.

      11 Werken opgenomen in het gebiedsontwikkelingsplan worden aangemerkt als openbare werken van algemeen nut in de
      zin van de [Belemmeringenwet Privaatrecht][ref19].

      12 Indien voor de uitvoering van werken als bedoeld in het tweede lid, onderdelen b en c toepassing van de
      [Belemmeringenwet Privaatrecht][ref20] noodzakelijk is, geldt in plaats van [artikel 4 van die wet][ref21] dat:

      a. tegen een besluit als bedoeld in [artikel 2, vijfde lid][ref22], of [artikel 3, tweede lid, van die wet][ref23]
      een belanghebbende beroep kan instellen bij de Afdeling bestuursrechtspraak van de Raad van State;

      b. [artikel 7:1 van de Algemene wet bestuursrecht][ref24] niet van toepassing is, en

      c. de werking van een besluit als bedoeld in [artikel 2, vijfde lid][ref25], of
      [artikel 3, tweede lid, van de Belemmeringenwet Privaatrecht][ref26] opgeschort wordt totdat de beroepstermijn
      is verstreken.

      13 Voor zover een besluit als bedoeld in het vijfde lid zijn grondslag vindt in een gebiedsontwikkelingsplan,
      kunnen de gronden in beroep daarop geen betrekking hebben.


