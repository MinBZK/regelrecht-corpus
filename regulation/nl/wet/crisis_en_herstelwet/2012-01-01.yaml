    text: |-
      1 Op de aanvraag om een vergunning als bedoeld in de wettelijke voorschriften, genoemd in [bijlage III][ref1] bij
      deze wet, is [paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref2] van toepassing.

      2 Indien [afdeling 3.4 van de Algemene wet bestuursrecht][ref3] van toepassing is op de
      voorbereiding van een besluit omtrent verlening van een vergunning, is op de aanvraag ervan
      [paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref4] niet van toepassing.

      3 In afwijking van [artikel 4:20b, derde lid, van de Algemene wet bestuursrecht][ref5] is
      [artikel 3.16, vierde lid, van de Wet ruimtelijke ordening][ref6] van toepassing indien een aanlegvergunning van
      rechtswege is verleend.

      4 Een bevoegde instantie bevestigt de ontvangst van een aanvraag om een vergunning als bedoeld in de wettelijke
      voorschriften, bedoeld in [bijlage III][ref7], zo snel mogelijk. De ontvangstbevestiging bevat de volgende
      informatie:

      a. de bij wettelijk voorschrift met betrekking tot die vergunning bepaalde termijn waarbinnen de beschikking wordt
      gegeven;

      b. de beschikbare rechtsmiddelen om tegen de beschikking op te komen.

      5 Indien [paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref8] op een aanvraag van toepassing is, vermeldt
      de ontvangstbevestiging tevens dat de gevraagde beschikking van rechtswege is gegeven, indien niet tijdig op de
      aanvraag is beslist.


