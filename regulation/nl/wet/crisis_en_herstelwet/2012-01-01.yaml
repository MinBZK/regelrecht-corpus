  - number: '2.6'
    text: |-
      1 Een bestemmingsplan dat betrekking heeft op gronden gelegen in een radarverstoringsgebied voor een radarstation
      bevat geen bestemmingen of regels omtrent het gebruik van de grond die het oprichten van bouwwerken mogelijk maken
      die door hun hoogte onaanvaardbare gevolgen kunnen hebben voor het beeld van de radar op het radarstation.

      2 Bij ministeriële regeling van Onze Minister van Defensie, in overeenstemming met Onze Minister van
      Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, worden:

      a. de radarstations aangewezen;

      b. de begrenzingen van het radarverstoringsgebied voor een radarstation aangewezen;

      c. de maximale hoogte van bouwwerken binnen het radarverstoringsgebied vastgesteld.

      3 Bij de voorbereiding van een besluit tot vaststelling van een bestemmingsplan dat betrekking heeft op gronden
      als bedoeld in het tweede lid, onderdeel a, waarbij wordt overwogen bestemmingen aan te wijzen of regels te geven
      omtrent het gebruik van de grond die het oprichten van bouwwerken mogelijk maken die de maximale hoogte, bedoeld in
      het tweede lid, onderdeel b, overschrijden, wordt een beoordeling gemaakt van gevolgen van die bouwwerken voor het
      zenden of ontvangen van radiogolven door het radarstation. Onze Minister van Defensie kan bij ministeriële regeling
      regels stellen met betrekking tot de wijze waarop de gevolgen, bedoeld in het eerste lid, bij die beoordeling
      worden bepaald en beschreven. Die regels kunnen mede betreffen de wijze van de totstandkoming van de beoordeling.

      4 De toelichting bij het bestemmingsplan bevat de uitkomsten van de beoordeling, bedoeld in het derde lid, alsmede
      het oordeel van Onze Minister van Defensie over de toereikendheid van de beoordeling en over de aanvaardbaarheid
      van de in de beoordeling beschreven gevolgen.

      5 Het derde en vierde lid zijn van overeenkomstige toepassing bij de voorbereiding van
      een besluit tot het verlenen van een omgevingsvergunning waarbij van het bestemmingsplan,
      het inpassingsplan of de beheersverordening wordt afgeweken met toepassing van
      __REF000___________________________________________________________________________________________________________
      _______________________ ter zake van het oprichten van bouwwerken die de maximale hoogte, bedoeld in het tweede
      lid, onderdeel b, overschrijden.

      6 Op een besluit als bedoeld in het tweede lid is het krachtens
      [artikel 3.37, eerste lid, van de Wet ruimtelijke ordening][ref2] bepaalde omtrent de voorbereiding, vormgeving,
      inrichting en beschikbaarstelling van bestemmingsplannen van overeenkomstige toepassing. Op de ministeriële
      regeling, bedoeld in het derde lid, zijn de krachtens [artikel 4.3, eerste lid][ref3], in samenhang met
      [artikel 4.1, vierde lid, van de Wet ruimtelijke ordening][ref4] gestelde regels van overeenkomstige toepassing.

      7 De regels, bedoeld in het tweede lid, onderdeel c, zijn niet van toepassing op bouwwerken:

      a. die op het tijdstip van inwerkingtreding van deze wet reeds in het radarverstoringsgebied, bedoeld in het tweede
      lid, onderdeel b, aanwezig waren;

      b. waarvoor de bouwvergunning vóór dat tijdstip is verleend, of

      c. waarvan de bouw in het op dat tijdstip geldende bestemmingsplan is toegestaan.


