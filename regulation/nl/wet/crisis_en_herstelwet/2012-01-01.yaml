  - number: '2.5'
    text: |-
      In deze afdeling wordt:

        - *verstaan onder bestemmingsplan:* bestemmingsplan als bedoeld in
      [artikel 3.1 van de Wet ruimtelijke ordening][ref1] alsmede een wijzigings- of uitwerkingsplan
      als bedoeld in [artikel 3.6, eerste lid, onderdeel a of b, van die wet][ref2], een inpassingplan
      als bedoeld in de [artikelen 3.26][ref3] en [3.28 van die wet][ref4], een beheersverordening
      als bedoeld in [artikel 3.38 van die wet][ref5] en een rijksbestemmingsplan als bedoeld in
      [artikel 10.3 van die wet][ref6] alsmede een omgevingsvergunning waarbij met toepassing van
      [artikel 2.12, eerste lid, onder a, onder 3°, van de Wet algemene bepalingen omgevingsrecht][ref7] van het
      bestemmingsplan, het inpassingsplan of de beheersverordening is afgeweken;
        - *onder toelichting bij een bestemmingsplan mede verstaan* de onderbouwing bij een omgevingsvergunning waarbij met
      toepassing van [artikel 2.12, eerste lid, onder a, onder 3°, van de Wet algemene bepalingen omgevingsrecht][ref8]
      van het bestemmingsplan, het inpassingsplan of de beheersverordening is afgeweken;
        - *verstaan onder radarstation:* voor de beveiliging van het nationaal luchtruim en de veilige afhandeling van het
      militair en burgerluchtverkeer essentieel radarstation, en
        - *verstaan onder radarverstoringsgebied voor een radarstation:* gebied waar beperkingen gelden ten aanzien van
      bestemmingsplannen ten behoeve van een goede werking van de radar op het radarstation.


