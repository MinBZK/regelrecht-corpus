    text: |-
      Tegen toevoeging als bedoeld in [artikel 1.2][ref1] van categorieën van ruimtelijke en infrastructurele projecten
      aan [bijlage I][ref2], van ruimtelijke en infrastructurele projecten aan [bijlage II][ref3] of van wettelijke
      voorschriften aan [bijlage III][ref4] bij deze wet alsmede tegen de aanwijzing van een ontwikkelingsgebied als
      bedoeld in [artikel 2.2][ref5], een verklaring als bedoeld in [artikel 2.3, zesde lid][ref6], of een aanwijzing van
      een project op grond van [artikel 2.18][ref7] staat geen beroep open.


