  - number: 5.2a
    text: |-
      De voordracht voor een krachtens de [artikelen 1.2][ref1], [2.2][ref2], [2.4][ref3], [2.9][ref4], [2.18][ref5]
      of [5.1][ref6] vast te stellen algemene maatregel van bestuur wordt niet eerder gedaan dan vier weken nadat het
      ontwerp in de Staatscourant is bekendgemaakt en aan een ieder de gelegenheid is geboden om binnen vier weken na
      de dag waarop de bekendmaking is geschied, wensen en bedenkingen ter kennis van Onze Minister-President, Minister
      van Algemene Zaken, en Onze Minister of Onze Ministers wie het mede aangaat, te brengen. Gelijktijdig met de
      bekendmaking wordt het ontwerp aan de beide kamers der Staten-Generaal overgelegd.


