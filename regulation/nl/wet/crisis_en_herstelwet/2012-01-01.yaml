  - number: '1.7'
    text: |-
      1 [Artikel 1.6, vierde lid][ref1], is niet van toepassing, indien
      [artikel 8:51a van de Algemene wet bestuursrecht][ref2], dan wel [artikel 36, zesde lid][ref3], of
      [artikel 39, zesde lid, van de Wet op de Raad van State][ref4] of [artikel 19, zesde lid][ref5], of
      [artikel 22, zesde lid, van de Wet bestuursrechtspraak bedrijfsorganisatie][ref6] wordt toegepast.

      2 In dat geval doet de administratieve rechter:

      a. binnen zes maanden na afloop van de beroepstermijn een tussenuitspraak, en

      b. binnen zes maanden na de verzending van de tussenuitspraak een einduitspraak.


