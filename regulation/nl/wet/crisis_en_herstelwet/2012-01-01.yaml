  - number: '1.8'
    text: |-
      1 [Artikel 1.6, vierde lid][ref1], is niet van toepassing, indien de administratieve rechter met toepassing van
      artikel 234 van het Verdrag tot oprichting van de Europese Gemeenschap prejudiciële vragen stelt.

      2 In dat geval worden de vragen binnen zes maanden na afloop van de beroepstermijn bij tussenuitspraak gesteld.

      3 In de tussenuitspraak beslist de rechter zoveel mogelijk ook op de beroepsgronden die niet door de vragen worden
      geraakt.

      4 Tegen een tussenuitspraak van de rechtbank kan hoger beroep worden ingesteld tegelijk met het hoger beroep tegen
      de einduitspraak.


      [ref1]: https://wetten.overheid.nl/BWBR0027431#Artikel1.6
