  - number: '2.15'
    text: |-
      Van de [Wet ruimtelijke ordening][ref1] zijn van overeenkomstige toepassing:

      a. [artikel 3.8, zesde lid][ref2];

      b. [afdeling 6.1][ref3];

      c. [afdeling 6.4][ref4], met dien verstande dat voor aanvang van de bouw van bouwplannen als bedoeld in
      [artikel 6.12, eerste lid, van die wet][ref5] een melding aan burgemeester en wethouders wordt gedaan en dat
      burgemeester en wethouders een beschikking met de inhoud van [artikel 6.17 van die wet][ref6] geven bij de start
      van de bouw, gericht aan een eigenaar van gronden waarop gebouwd wordt.


