  - number: '5.10'
    text: |-
      1 Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip en vervalt met ingang van 1 januari
      2014. De [artikelen 3.6][ref1] en [3.25][ref2] werken terug tot en met 1 juli 2008 respectievelijk tot en met
      15 juni 2009.

      2 Indien het eerste besluit ter uitvoering van een project waarop deze wet van toepassing was, is genomen voor
      1 januari 2014 blijft deze wet na 31 december 2013 van toepassing op latere besluiten of handelingen ter uitvoering
      van datzelfde project.

      3 Deze wet blijft na 31 december 2013 van toepassing op:

      a. ontwikkelingsgebieden ten aanzien waarvan voor 1 januari 2014 een gebiedsontwikkelingsplan als bedoeld in
      [artikel 2.3][ref3] is vastgesteld;

      b. experimenten als bedoeld in [artikel 2.4][ref4] die voor 1 januari 2014 zijn aangewezen overeenkomstig dat
      artikel;

      c. de uitvoering van projecten als bedoeld in [artikel 2.9, eerste lid][ref5], indien ten aanzien van dat project
      voor 1 januari 2014 een besluit als bedoeld in [artikel 2.10, eerste lid][ref6], is genomen, en

      d. de uitvoering van krachtens [artikel 2.18][ref7] aangewezen projecten, indien ten aanzien van die
      projecten voor 1 januari 2014 aan de structuurvisie, bedoeld in [artikel 2.19, eerste lid][ref8], de in
      [artikel 2.20, tweede lid][ref9], bedoelde verklaringen zijn gehecht.


