preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is bijzondere wettelijke voorzieningen te treffen voor een
    versnelde ontwikkeling en verwezenlijking van ruimtelijke en infrastructurele projecten, teneinde bij te dragen aan
    de bestrijding van de economische crisis alsmede met dat doel diverse wettelijke bepalingen te wijzigen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0027431/2012-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      1 [Afdeling 2][ref1] is van toepassing op:

      a. alle besluiten die krachtens enig wettelijk voorschrift zijn vereist voor de ontwikkeling of verwezenlijking van
      de in [bijlage I][ref2] bij deze wet bedoelde categorieën ruimtelijke en infrastructurele projecten dan wel voor de
      in [bijlage II][ref3] bij deze wet bedoelde ruimtelijke en infrastructurele projecten;

      b. gebiedsontwikkelingsplannen als bedoeld in [artikel 2.3, eerste lid][ref4], alsmede de voor de uitvoering van de
      projecten waarop die gebiedsontwikkelingsplannen betrekking hebben vereiste besluiten en de voor de uitvoering van
      maatregelen of werken als bedoeld in artikel 2.3, tweede lid, onderdelen b en c, vereiste besluiten, en

      c. projectuitvoeringsbesluiten als bedoeld in [artikel 2.10, eerste lid][ref5].

      2 [Afdeling 3][ref6] is van toepassing op de in [bijlage II][ref7] bij deze wet bedoelde ruimtelijke en
      infrastructurele projecten en op krachtens [artikel 2.18][ref8] aangewezen projecten.


