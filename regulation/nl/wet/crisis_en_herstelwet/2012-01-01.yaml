        artikel: 8:1
  - number: '1.5'
    text: |-
      1 Een besluit waartegen bezwaar is gemaakt of beroep is ingesteld, kan ondanks schending van een geschreven of
      ongeschreven rechtsregel of algemeen rechtsbeginsel, door het orgaan dat op het bezwaar of beroep beslist, in stand
      worden gelaten indien aannemelijk is dat de belanghebbenden daardoor niet zijn benadeeld.

      2 [Artikel 6:22 van de Algemene wet bestuursrecht][ref1] blijft buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel622
