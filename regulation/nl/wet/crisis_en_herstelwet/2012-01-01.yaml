      tegen een besluit dat is bekendgemaakt voor het tijdstip van inwerkingtreding van deze wet, dan wel hoger beroep
      wordt ingesteld tegen een uitspraak die voor dat tijdstip is bekendgemaakt.

      2 De [artikelen 1.4][ref3] en [1.9][ref4] zijn voorts niet van toepassing, indien hoger beroep wordt ingesteld
      tegen een uitspraak omtrent een besluit dat is bekendgemaakt voor het tijdstip van inwerkingtreding van deze wet.


