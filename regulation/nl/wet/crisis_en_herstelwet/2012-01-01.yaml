  - number: 2.19a
    text: |-
      1 Ten aanzien van een krachtens [artikel 2.18][ref1] aangewezen (boven)regionaal project
      met nationale betekenis stellen provinciale staten een structuurvisie als bedoeld in
      [artikel 2.2, eerste of derde lid, van de Wet ruimtelijke ordening][ref2] vast.

      2 Op projecten als bedoeld in het eerste lid is deze afdeling van overeenkomstige toepassing, met dien verstande
      dat:

      a. in de [artikelen 2.19, tweede lid, onder b, onder 5°][ref3], en [2.21][ref4] in plaats van «de gemeentelijke
      coördinatieregeling, bedoeld in [paragraaf 3.6.1 van de Wet ruimtelijke ordening][ref5]» wordt gelezen: de
      provinciale coördinatieregeling, bedoeld in [paragraaf 3.6.2 van de Wet ruimtelijke ordening][ref6];

      b. in [artikel 2.20, eerste lid][ref7], in plaats van «die diensten van provincie en Rijk» wordt gelezen: die
      diensten van Rijk;

      c. in [artikel 2.20, derde lid][ref8], in plaats van «de eerstverantwoordelijke gemeente» wordt gelezen: de
      eerstverantwoordelijke provincie;

      d. in [artikel 2.21][ref9] in plaats van «In afwijking van
      [artikel 3.30, eerste lid, van de Wet ruimtelijke ordening][ref10]» wordt gelezen: In afwijking van
      [artikel 3.33, eerste lid, van de Wet ruimtelijke ordening][ref11];

      e. in [artikel 2.22][ref12] in plaats van «een gemeentelijke verordening» wordt gelezen: een provinciale of
      gemeentelijke verordening;

      f. in [artikel 2.23, eerste lid][ref13], in plaats van «[artikel 3.10][ref14]» wordt gelezen
      «[artikel 3.27][ref15]», in plaats van «kan de gemeenteraad» wordt gelezen «kunnen provinciale staten» en in plaats
      van «gemeentebestuur» wordt gelezen: provinciebestuur.


