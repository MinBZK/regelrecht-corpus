  - number: '2.20'
    text: |-
      1 Bij de voorbereiding van een structuurvisie als bedoeld in [artikel 2.19, eerste lid][ref1], plegen burgemeester
      en wethouders overleg met de besturen van de betrokken gemeenten en waterschappen en met die diensten van provincie
      en Rijk die betrokken zijn bij de zorg voor de ruimtelijke ordening of belast zijn met de behartiging van belangen
      die in de structuurvisie in het geding zijn.

      2 In afwijking van [hoofdstuk 2 van de Wet ruimtelijke ordening][ref2], worden, voor zover het overleg, bedoeld
      in het eerste lid, leidt tot vaststelling van een structuurvisie waarmee de bestuursorganen van de betrokken
      gemeenten, waterschappen, provincie en Rijk instemmen, aan die structuurvisie verklaringen gehecht houdende
      instemming van die bestuursorganen met de in de structuurvisie voorgestelde wijze van verwezenlijking van de
      voorgenomen ontwikkeling.

      3 Ter uitvoering van de in de structuurvisie voorgestelde wijze van verwezenlijking van de voorgenomen ontwikkeling
      wordt ten behoeve van een goede begeleiding en tijdige afronding van het project een projectcommissie ingesteld.
      In de commissie zijn de betrokken bestuursorganen, bedoeld in het tweede lid, vertegenwoordigd. De commissie staat
      onder voorzitterschap van een bestuurder van de eerstverantwoordelijke gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0027431#Artikel2.19
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0027431/2012-01-01#Artikel2.20
