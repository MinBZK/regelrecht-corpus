  - number: '5.4'
    text: |-
      1 Het recht zoals dat gold voor het tijdstip van inwerkingtreding van deze wet blijft van toepassing op een
      onteigeningsbesluit, waarvan het ontwerp ter inzage is gelegd voor dat tijdstip.

      2 Een koninklijk besluit tot goedkeuring van een onteigeningsbesluit als bedoeld in
      [artikel 79 van de onteigeningswet][ref1], zoals dat luidde voor de inwerkingtreding van deze wet, wordt
      gelijkgesteld met een onteigeningsbesluit als bedoeld in [artikel 78 van de onteigeningswet][ref2].


