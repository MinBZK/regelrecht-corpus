  - number: '2.10'
    text: |-
      1 Op verzoek of ambtshalve kan de gemeenteraad ten aanzien van een project als bedoeld in
      [artikel 2.9, eerste lid][ref1], een projectuitvoeringsbesluit vaststellen, waaronder begrepen de vaststelling
      dat deze afdeling op het project van toepassing is. De gemeenteraad kan de bevoegdheid, bedoeld in dit artikel,
      delegeren aan burgemeester en wethouders.

      2 Op de ontwikkeling en verwezenlijking van een project als bedoeld in [artikel 2.9, eerste lid][ref2], ten
      aanzien waarvan een projectuitvoeringsbesluit is vastgesteld, zijn de wettelijke voorschriften krachtens welke
      daarvoor een vergunning, ontheffing, vrijstelling of enig ander besluit is vereist, niet van toepassing, met
      uitzondering van de [Flora- en faunawet][ref3], [hoofdstuk V, paragraaf 3, van de Monumentenwet 1988][ref4] en
      [artikel 6.5, onderdeel c, van de Waterwet][ref5].

      3 Het projectuitvoeringsbesluit strekt ter vervanging van de besluiten die vereist zouden zijn geweest krachtens de
      in het tweede lid bedoelde wettelijke voorschriften.

      4 Uit het projectuitvoeringsbesluit en de daarbij behorende toelichting blijkt welke gevolgen aan de uitvoering
      zijn verbonden en op welke wijze rekening is gehouden met de daarbij betrokken belangen, waaronder in elk geval
      de belangen ter bescherming waarvan de wettelijke voorschriften strekken die ingevolge het tweede lid niet van
      toepassing zijn en, voor zover van toepassing, [hoofdstuk V, paragraaf 1, van de Monumentenwet 1988][ref6].

      5 Bij een projectuitvoeringsbesluit worden de bij of krachtens wet of verordening vastgestelde toetsingskaders
      toegepast en normen in acht genomen. Voor zover de wet of verordening afwijking van die toetsingskaders of normen
      toestaat, kan het projectuitvoeringsbesluit daarin voorzien.

      6 Aan het projectuitvoeringsbesluit kunnen ter bescherming van de in het vierde lid bedoelde belangen voorschriften
      worden verbonden.

      7 Indien een projectuitvoeringsbesluit er toe strekt een vergunning
      als bedoeld in [artikel 11 van de Monumentenwet 1988][ref7] of
      [artikel 2.1, eerste lid, onderdeel f, van de Wet algemene bepalingen omgevingsrecht][ref8] te vervangen:

      a. legt de gemeenteraad, indien het een archeologisch monument betreft als bedoeld in
      [artikel 1, onderdeel c, van de Monumentenwet 1988][ref9] en in de gevallen waarin Onze Minister van Onderwijs,
      Cultuur en Wetenschap op grond van de [Wet algemene bepalingen omgevingsrecht][ref10] adviseert, het voornemen tot
      een projectuitvoeringsbesluit voor advies voor aan Onze Minister van Onderwijs, Cultuur en Wetenschap die binnen
      vier weken na ontvangst van de gegevens, bedoeld in [artikel 3:7 van de Algemene wet bestuursrecht][ref11], advies
      uitbrengt, en

      b. zendt de gemeenteraad aan Onze Minister van Onderwijs, Cultuur en Wetenschap en, voorzover het monument gelegen
      is buiten de bebouwde kom, aan gedeputeerde staten:

      1°. het ontwerpbesluit, en

      2°. onmiddellijk na de vaststelling een afschrift van het projectuitvoeringsbesluit.

      8 Indien een projectuitvoeringsbesluit betrekking heeft op een beschermd stads- of dorpsgezicht als bedoeld in
      [artikel 1, onderdeel g, van de Monumentenwet 1988][ref12] zendt de gemeenteraad onmiddellijk na de vaststelling
      hiervan een afschrift aan Onze Minister van Onderwijs, Cultuur en Wetenschap.

      9 Het tweede lid en het vijfde lid, tweede volzin, zijn niet van toepassing op de wettelijke voorschriften
      die zijn gesteld bij of krachtens de [Wet luchtvaart][ref13], de [Luchtvaartwet][ref14] en de
      __REF002___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      ________________________________________________________________________________ (Stb. 561)
      omtrent ruimtelijke beperkingen in de omgeving van luchthavens in verband met geluidbelasting,
      externe veiligheid en vliegveiligheid. Voor de toepassing van de [Wet luchtvaart][ref16] wordt
      het projectuitvoeringsbesluit gelijkgesteld aan een omgevingsvergunning waarbij met toepassing van
      [artikel 2.12, eerste lid, onder a, onder 3°, van de Wet algemene bepalingen omgevingsrecht][ref17] van het
      bestemmingsplan wordt afgeweken.


