  - number: 2.3a
    text: |-
      1 Indien voor een ontwikkelingsgebied een provinciaal inpassingsplan wordt vastgesteld, stellen, in afwijking van
      [artikel 2.3, eerste lid][ref1], voor dat gebied provinciale staten een gebiedsontwikkelingsplan vast.

      2 [Artikel 2.3][ref2] is van overeenkomstige toepassing op een ingevolge het eerste lid vastgesteld
      gebiedsontwikkelingsplan, met dien verstande dat:

      a. in het eerste en tweede lid in plaats van «de gemeenteraad» wordt gelezen: provinciale staten;

      b. in het eerste en vierde lid in plaats van «bestemmingsplan» telkens wordt gelezen: inpassingsplan;

      c. in het vijfde en achtste lid in plaats van «burgemeester en wethouders» telkens wordt gelezen: gedeputeerde
      staten;

      d. in het zesde lid in plaats van «Burgemeester en wethouders» wordt gelezen: Gedeputeerde staten;

      e. in het tiende lid in plaats van «gemeente» wordt gelezen: provincie.


