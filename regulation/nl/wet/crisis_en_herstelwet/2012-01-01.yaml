  - number: '2.23'
    text: |-
      1 Indien voor de verwezenlijking van een krachtens [artikel 2.18][ref1]
      aangewezen project een omgevingsvergunning waarbij met toepassing van
      [artikel 2.12, eerste lid, onder a, onder 3°, van de Wet algemene bepalingen omgevingsrecht][ref2] van het
      bestemmingsplan, het inpassingsplan of de beheersverordening wordt afgeweken, wordt verleend, kan de gemeenteraad
      met het oog op de invordering van rechten terzake van door of vanwege het gemeentebestuur verstrekte diensten die
      verband houden met die omgevingsvergunning aan die omgevingsvergunning voorschriften verbinden, die de verplichting
      inhouden dat financiële zekerheid wordt gesteld voor het nakomen van de ingevolge die vergunning verschuldigde
      rechten.

      2 Indien toepassing wordt gegeven aan het eerste lid, wordt in ieder geval het bedrag aangegeven waarvoor de
      zekerheid in stand moet worden gehouden.

      3 Bij de vergunning kunnen voorschriften worden gesteld voor gevallen waarin aan de verplichting uitvoering wordt
      gegeven door het sluiten en in stand houden van een verzekering. Daarbij wordt rekening gehouden met hetgeen
      redelijkerwijs door verzekering kan worden gedekt.


      [ref1]: https://wetten.overheid.nl/BWBR0027431#Artikel2.18
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2.12
