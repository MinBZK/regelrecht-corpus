  - number: '1.6'
    text: |-
      1 De administratieve rechter behandelt het beroep met toepassing van
      [afdeling 8.2.3 van de Algemene wet bestuursrecht][ref1].

      2 In afwijking van [artikel 6:6 van de Algemene wet bestuursrecht][ref2] is het beroep niet-ontvankelijk indien
      niet is voldaan aan [artikel 6:5, eerste lid, onderdeel d, van die wet][ref3].

      3 Indien de administratieve rechter het advies van de Stichting advisering bestuursrechtspraak inwint, brengt de
      Stichting binnen twee maanden na het verzoek advies uit.

      4 De administratieve rechter doet uitspraak binnen zes maanden na afloop van de beroepstermijn.


