  - number: '2.4'
    text: |-
      1 Bij algemene maatregel van bestuur op de voordracht van Onze Minister van Infrastructuur en Milieu, in
      overeenstemming met Onze Minister of Onze Ministers wie het mede aangaat, kan, met inachtneming van bindende
      besluiten van de Raad van de Europese Unie, van het Europees Parlement en de Raad gezamenlijk of van de Europese
      Commissie, bij wege van experiment worden afgeweken van het bepaalde bij of krachtens:

      a. de [Elektriciteitswet 1998][ref1] voor zover dat geen gevolgen heeft voor de opbrengst van de energiebelasting,
      bedoeld in de [Wet belastingen op milieugrondslag][ref2];

      b. de Warmtewet;

      c. de [Waterwet][ref3], met uitzondering van [hoofdstuk 5][ref4], [artikel 6.5, aanhef en onder c][ref5], juncto
      [paragraaf 2 van hoofdstuk 6][ref6];

      d. de [Wet algemene bepalingen omgevingsrecht][ref7];

      e. de [Wet ammoniak en veehouderij][ref8];

      f. de [Wet bodembescherming][ref9];

      g. de [Wet geluidhinder][ref10];

      h. de [Wet geurhinder en veehouderij][ref11];

      i. de [Wet inzake de luchtverontreiniging][ref12];

      j. de [Wet milieubeheer][ref13] met uitzondering van [artikel 5.2b][ref14] en [titel 5.2][ref15];

      k. de [Wet ruimtelijke ordening][ref16];

      l. de [Woningwet][ref17].

      2 Er kan uitsluitend toepassing worden gegeven aan het eerste lid indien het experiment bijdraagt aan innovatieve
      ontwikkelingen en voldoende aannemelijk is dat uitvoering ervan bijdraagt aan het bestrijden van de economische
      crisis en aan de duurzaamheid.

      3 Bij de algemene maatregel van bestuur, bedoeld in het eerste lid, wordt bepaald:

      a. welke afwijking of afwijkingen van de betrokken in het eerste lid genoemde wet of wetten is of zijn toegestaan;

      b. de ten hoogste toegestane tijdsduur van die afwijking of afwijkingen, en

      c. de wijze waarop wordt vastgesteld of een afwijking aan haar doel beantwoordt, en of de tijdsduur daarvan
      aanpassing behoeft.


