  - number: '2.1'
    text: |-
      1 In deze afdeling en de daarop berustende bepalingen wordt verstaan onder:

      a. *milieugebruiksruimte:* binnen een ontwikkelingsgebied aanwezige marge tussen de bestaande milieukwaliteit en de
      voor dat gebied geldende milieukwaliteitsnormen, die kan worden benut voor milieubelastende activiteiten;

      b. *milieukwaliteitsnorm:* bij wettelijk voorschrift gestelde norm ten aanzien van de kwaliteit van een onderdeel
      van het milieu.

      2 In deze afdeling en de daarop berustende bepalingen wordt onder bestemmingsplan mede verstaan: de bij het
      bestemmingsplan behorende toelichting dan wel het exploitatieplan.
    url: https://wetten.overheid.nl/BWBR0027431/2015-03-18#Artikel2.1
  - number: '2.2'
    text: |-
      Bij algemene maatregel van bestuur op de voordracht van Onze Minister van Infrastructuur en Milieu, in
      overeenstemming met Onze Minister of Onze Ministers wie het mede aangaat, kan bij wijze van experiment een gebied,
      zijnde bestaand stedelijk gebied, bestaand bedrijventerrein of gebied ter uitbreiding van de haven van Rotterdam,
      voor de duur van ten hoogste tien jaar worden aangewezen als ontwikkelingsgebied, indien dat met het oog op het
      versterken van de duurzame ruimtelijke en economische ontwikkeling van dat gebied bijzonder aangewezen is.
    url: https://wetten.overheid.nl/BWBR0027431/2015-03-18#Artikel2.2
  - number: '2.3'
    text: |-
      1 Een bestemmingsplan dat betrekking heeft op gronden die gelegen zijn binnen een aangewezen ontwikkelingsgebied
      als bedoeld in [artikel 2.2][ref1], is gericht op de optimalisering van de milieugebruiksruimte met het oog op het
      versterken van een duurzame ruimtelijke en economische ontwikkeling van dat gebied in samenhang met het tot stand
      brengen van een goede milieukwaliteit.

      2 Tenzij bij algemene maatregel van bestuur anders is bepaald, bevat een bestemmingsplan als bedoeld in het eerste
      lid:

      a. de voorgenomen maatregelen, projecten en werken ten behoeve van de optimalisering van de milieugebruiksruimte
      binnen het ontwikkelingsgebied;

      b. de noodzakelijke maatregelen, projecten en werken ter compensatie van het beslag op de milieugebruiksruimte door
      de in het bestemmingsplan voorziene ruimtelijke ontwikkelingen;

      c. zo nodig een fasering en koppeling bij de tenuitvoerlegging van de in de onderdelen a en b bedoelde maatregelen,
      projecten en werken;

      d. een raming van de kosten van uitvoering van het bestemmingsplan, een beschrijving van de wijze waarop daarin zal
      worden voorzien, alsmede een beschrijving van de wijze waarop het bereiken van de met het bestemmingsplan beoogde
      resultaten zal worden nagestreefd;

      e. een overzicht van de tijdstippen waarop burgemeester en wethouders aan de gemeenteraad een rapportage uitbrengen
      over de voortgang en de uitvoering van de in de onderdelen a en b bedoelde maatregelen, projecten en werken, die op
      verzoek tevens wordt verstrekt aan Onze Minister van Infrastructuur en Milieu.

      3 Ten aanzien van een activiteit met betrekking tot een inrichting als bedoeld in
      [artikel 2.1, eerste lid, onder e, van de Wet algemene bepalingen omgevingsrecht][ref2], die plaatsvindt binnen
      het ontwikkelingsgebied, kan of kunnen in het belang van de optimalisering van de milieugebruiksruimte binnen het
      ontwikkelingsgebied:

      a. in het geval dat burgemeester en wethouders ingevolge
      [artikel 2.4, eerste lid, van de Wet algemene bepalingen omgevingsrecht][ref3] het bevoegd gezag zijn:

      1°. onverminderd [artikel 2.22, tweede lid, eerste volzin, van die wet][ref4] voorschriften worden verbonden aan de
      omgevingsvergunning voor die activiteit;

      2°. in afwijking van [artikel 2.31, tweede lid, onderdeel b][ref5], en met toepassing van
      [paragraaf 3.4 van die wet][ref6] voorschriften van de omgevingsvergunning voor die activiteit worden gewijzigd,
      waarbij de [artikelen 2.31a][ref7] en [4.2 van die wet][ref8] van overeenkomstige toepassing zijn;

      b. in het geval dat ingevolge
      [artikel 2.4, tweede, derde of vierde lid, van de Wet algemene bepalingen omgevingsrecht][ref9] een ander
      bestuurorgaan het bevoegde gezag is:

      1°. een omgevingsvergunning voor die activiteit niet worden verleend dan nadat burgemeester en wethouders hebben
      verklaard dat zij daartegen geen bedenkingen hebben, waarbij geldt dat:

      aa. de verklaring slechts kan worden geweigerd in het belang van de optimalisering van de milieugebruiksruimte
      binnen het ontwikkelingsgebied;

      bb. de [artikelen 2.27, tweede, vierde en vijfde lid][ref10], [3.11][ref11] en [4.2 van die wet][ref12] van
      overeenkomstige toepassing zijn.

      2°. burgemeester en wethouders het bevoegd gezag verzoeken voorschriften van de omgevingsvergunning voor die
      activiteit te wijzigen, waarbij de [artikelen 2.29, derde lid][ref13], [2.31, eerste lid, onderdeel a][ref14], en
      [2.31a][ref15] en [paragraaf 3.4 van die wet][ref16] van overeenkomstige toepassing zijn.

      4 Voor zover ten aanzien van een activiteit met betrekking tot een inrichting die
      plaatsvindt binnen het ontwikkelingsgebied geen omgevingsvergunning als bedoeld in
      [artikel 2.1, eerste lid, aanhef en onder e, van de Wet algemene bepalingen omgevingsrecht][ref17] is vereist,
      kunnen burgemeester en wethouders ambtshalve in het belang van de optimalisering van de milieugebruiksruimte
      binnen het ontwikkelingsgebied voorschriften stellen, die afwijken van de voor die activiteit bij of krachtens
      [artikel 8.40 van de Wet milieubeheer][ref18] gestelde regels.

      5 Met de bevoegdheden, bedoeld in het derde en vierde lid, kunnen rechten, die worden ontleend aan voorschriften
      in een omgevingsvergunning of aan regels gesteld krachtens [artikel 8.40 van de Wet milieubeheer][ref19], worden
      gewijzigd ter optimalisering van de milieugebruiksruimte, voor zover van die rechten bij het in werking hebben van
      een inrichting:

      a. gedurende een periode van drie jaar onder normale bedrijfsomstandigheden geen gebruik is gemaakt of

      b. naar redelijke verwachting, rekeninghoudend met de binnen afzienbare tijd te verwachten wijzigingen of
      uitbreidingen van de inrichting of van de in de inrichting gebezigde werkwijzen, geen gebruik zal worden gemaakt.

      6 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld, zo nodig per aangewezen
      ontwikkelingsgebied, over de wijze waarop de optimalisering van de milieugebruiksruimte kan plaatsvinden.

      7 Met inachtneming van desbetreffende bindende besluiten van de Raad van de Europese Unie, van het Europees
      Parlement en de Raad gezamenlijk of van de Commissie van de Europese Gemeenschappen, kan het bestemmingsplan
      bestemmingen aanwijzen, regels stellen of maatregelen en werken toestaan in afwijking van bij algemene maatregel
      van bestuur aangegeven bepalingen bij of krachtens:

      a. de [Flora- en faunawet][ref20];

      b. de [Natuurbeschermingswet 1998][ref21];

      c. de [Ontgrondingenwet][ref22];

      d. de [Wet algemene bepalingen omgevingsrecht][ref23], voor zover het betreft een omgevingsvergunning voor een
      activiteit met betrekking tot een inrichting als bedoeld in [artikel 2.1, eerste lid, onder e, van die wet][ref24];

      e. de [Wet ammoniak en veehouderij][ref25];

      f. de [Wet bodembescherming][ref26];

      g. de [Wet geluidhinder][ref27], met dien verstande dat die afwijking niet leidt tot een geluidsbelasting binnen
      een woning met gesloten ramen, die hoger is dan 33 dB;

      h. de [Wet geurhinder en veehouderij][ref28];

      i. de [Wet inzake de luchtverontreiniging][ref29];

      j. de [Wet milieubeheer][ref30] met uitzondering van [artikel 5.2b][ref31] en [titel 5.2][ref32],

      met dien verstande dat uiterlijk tien jaar nadat het bestemmingsplan onherroepelijk is geworden alsnog wordt
      voldaan aan de bij of krachtens de wet gestelde milieukwaliteitsnormen. Indien er na deze periode niet wordt
      voldaan aan een milieukwaliteitsnorm geven burgemeester en wethouders aan op welke wijze alsnog aan die norm zal
      worden voldaan. Bij algemene maatregel van bestuur kunnen regels worden gesteld over de maximale afwijking van
      milieukwaliteitsnormen.

      8 Het zevende lid is van overeenkomstige toepassing op besluiten die strekken ter uitvoering van het
      bestemmingsplan.

      9 Burgemeester en wethouders nemen in bij algemene maatregel van bestuur aangegeven categorieën
      van gevallen geen besluit als bedoeld in het achtste lid dan nadat het bestuursorgaan dat
      krachtens de betrokken wet bevoegd zou zijn te beslissen, heeft verklaard dat het daartegen
      geen bedenkingen heeft. De [artikelen 2.27, tweede tot en met vijfde lid][ref33], en
      [3.11 van de Wet algemene bepalingen omgevingsrecht][ref34] zijn van overeenkomstige toepassing.

      10 Burgemeester en wethouders dragen zorg voor het uitvoeren van de maatregelen of werken, bedoeld in het tweede
      lid, onderdelen a en b, binnen een in het bestemmingsplan te noemen termijn.

      11 Werken opgenomen in het bestemmingsplan worden aangemerkt als openbare werken van algemeen nut in de zin van de
      [Belemmeringenwet Privaatrecht][ref35].

      12 Indien voor de uitvoering van werken als bedoeld in het tweede lid, onderdelen a en b,
      toepassing van de [Belemmeringenwet Privaatrecht][ref36] noodzakelijk is, geldt in plaats van
      [artikel 4 van die wet][ref37] dat de werking van een besluit als bedoeld in [artikel 2, vijfde lid][ref38], of
      [artikel 3, tweede lid, van die wet][ref39] wordt opgeschort totdat de beroepstermijn is verstreken.

      13 Voor zover een besluit als bedoeld in het achtste lid zijn grondslag vindt in een bestemmingsplan, kunnen de
      gronden in beroep daarop geen betrekking hebben.


