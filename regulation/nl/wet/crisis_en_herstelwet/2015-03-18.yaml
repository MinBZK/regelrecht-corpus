  - number: '2.16'
    text: Het is verboden in strijd te handelen met een projectuitvoeringsbesluit of een daaraan verbonden voorschrift.
    url: https://wetten.overheid.nl/BWBR0027431/2015-03-18#Artikel2.16
  - number: '2.17'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze afdeling zijn belast de bij besluit van
      burgemeester en wethouders aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0027431/2015-03-18#Artikel2.17
  - number: '2.18'
    text: |-
      Deze afdeling is van toepassing op bij algemene maatregel van bestuur op de voordracht van Onze Minister van
      Infrastructuur en Milieu, in overeenstemming met Onze Minister of Onze Ministers wie het mede aangaat, aangewezen
      lokale en (boven)regionale projecten met nationale betekenis.
    url: https://wetten.overheid.nl/BWBR0027431/2015-03-18#Artikel2.18
  - number: '2.19'
    text: |-
      1 Ten aanzien van een krachtens [artikel 2.18][ref1] aangewezen lokaal project
      met nationale betekenis stelt de gemeenteraad een structuurvisie als bedoeld in
      [artikel 2.1, eerste of derde lid, van de Wet ruimtelijke ordening][ref2] vast.

      2 De structuurvisie, bedoeld in het eerste lid, bevat onverminderd het elders omtrent de inhoud van een
      structuurvisie bepaalde, tevens:

      a. een concretisering van de hoofdlijnen van de voorgenomen ontwikkeling van het betrokken gebied;

      b. een beschrijving van de voorgestelde wijze van verwezenlijking van de voorgenomen ontwikkeling, bestaande uit in
      ieder geval de volgende onderdelen:

      1°. een voorlopig overzicht van de voor de uitvoering van het project benodigde besluiten, alsmede het daarbij
      voorgenomen tijdpad;

      2°. een financiële onderbouwing en een voorlopige opzet van de grondexploitatie;

      3°. een analyse van de risico’s ten aanzien van verplichtingen tot het toekennen van een tegemoetkoming in schade
      als bedoeld in [afdeling 6.1 van de Wet ruimtelijke ordening][ref3];

      4°. eventuele voornemens inzake verwerving van gronden;

      5°. de vermelding dat ten aanzien van de voor de verwezenlijking van het project noodzakelijke besluiten
      ingevolge [artikel 2.21][ref4] toepassing zal worden gegeven aan de gemeentelijke coördinatieregeling, bedoeld in
      [paragraaf 3.6.1 van de Wet ruimtelijke ordening][ref5];

      c. een samenvatting van de uitkomsten van het overeenkomstig [artikel 2.20, eerste lid][ref6], gevoerde bestuurlijk
      overleg.

      3 Indien reeds een structuurvisie is vastgesteld, is het eerste lid niet van toepassing en wordt die
      structuurvisie voor zover nodig aangevuld met de in het tweede lid genoemde onderdelen. [Artikel 2.20][ref7] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0027431#Artikel2.18
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel2.1
