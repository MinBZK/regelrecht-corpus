  - number: 2.10a
    text: |-
      Indien sprake is van provinciale belangen, kunnen provinciale staten ten behoeve van de verwezenlijking van een
      project als bedoeld in [artikel 2.9, eerste lid][ref1], of van een onderdeel daarvan, een projectuitvoeringsbesluit
      vaststellen. Indien toepassing is gegeven aan de eerste volzin, is deze afdeling van overeenkomstige toepassing,
      met dien verstande dat burgemeester en wethouders uitvoering geven aan het bepaalde in [artikel 2.17][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0027431#Artikel2.9
      [ref2]: https://wetten.overheid.nl/BWBR0027431#Artikel2.17
    url: https://wetten.overheid.nl/BWBR0027431/2015-03-18#Artikel2.10a
    references:
      - id: ref1
        bwb_id: BWBR0027431
        artikel: '2.9'
        hoofdstuk: '2'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0027431
        artikel: '2.17'
        hoofdstuk: '2'
        afdeling: '6'
  - number: '2.11'
    text: |-
      Op de voorbereiding van de beslissing tot vaststelling van het projectuitvoeringsbesluit is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing, met dien verstande dat de kennisgeving,
      bedoeld in [artikel 3.12 van die wet][ref2], tevens in de Staatscourant wordt geplaatst en voorts langs
      elektronische weg geschiedt en het ontwerpprojectuitvoeringsbesluit met de daarbij behorende stukken tevens langs
      elektronische weg beschikbaar worden gesteld. Zienswijzen kunnen naar voren worden gebracht door een ieder.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel312
    url: https://wetten.overheid.nl/BWBR0027431/2015-03-18#Artikel2.11
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 3:12
  - number: '2.12'
    text: |-
      Voor zover het projectuitvoeringsbesluit niet in overeenstemming is met het bestemmingsplan of een
      beheersverordening, geldt het projectuitvoeringsbesluit als een omgevingsvergunning waarbij met toepassing van
      [artikel 2.12, eerste lid, onder a, onder 3°, van de Wet algemene bepalingen omgevingsrecht][ref1] van het
      bestemmingsplan, het inpassingsplan of de beheersverordening wordt afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2.12
    url: https://wetten.overheid.nl/BWBR0027431/2015-03-18#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2.12'
  - number: '2.14'
    text: |-
      Een besluit als bedoeld in [artikel 2.10, eerste lid][ref1], treedt in werking daags na afloop van de
      beroepstermijn. Indien gedurende die termijn beroep wordt ingesteld, wordt de inwerkingtreding opgeschort totdat de
      Afdeling bestuursrechtspraak van de Raad van State op het beroep heeft beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0027431#Artikel2.10
    url: https://wetten.overheid.nl/BWBR0027431/2015-03-18#Artikel2.14
    references:
