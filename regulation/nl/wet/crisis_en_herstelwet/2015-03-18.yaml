  - number: '1.11'
    text: |-
      1 Indien op grond van [artikel 7.2 van de Wet milieubeheer][ref1] een milieueffectrapport wordt opgesteld ten
      behoeve van een besluit, is:

      a. [artikel 7.23 van die wet][ref2] voor zover dat regels stelt over alternatieven voor de voorgenomen activiteit,
      niet van toepassing;

      b. [artikel 7.32, vijfde lid, van die wet][ref3] niet van toepassing.

      2 Indien door degene die de betreffende activiteit wil ondernemen, ten behoeve van de voorbereiding van het besluit
      waarvoor op grond van [artikel 7.2 van de Wet milieubeheer][ref4] een milieueffectrapport wordt gemaakt, onderzoek
      is verricht naar de gevolgen voor het milieu die alternatieven van de voorgenomen activiteit kunnen hebben,
      bevat dat milieueffectrapport een schets van de voornaamste alternatieven die zijn onderzocht en van de mogelijke
      gevolgen voor het milieu daarvan, met een motivering van de keuze voor de in beschouwing genomen alternatieven.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7.2
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel7.23
