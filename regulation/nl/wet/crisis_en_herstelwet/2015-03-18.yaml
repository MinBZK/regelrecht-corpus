  - number: '1.4'
    text: |-
      In afwijking van [artikel 8:1 van de Algemene wet bestuursrecht][ref1] kan een niet tot de centrale overheid
      behorende rechtspersoon die krachtens publiekrecht is ingesteld of een niet tot de centrale overheid behorend
      bestuursorgaan geen beroep instellen tegen een besluit van een tot de centrale overheid behorend bestuursorgaan,
      indien dat besluit niet is gericht tot die rechtspersoon of tot een orgaan van die rechtspersoon, onderscheidenlijk
      tot dat bestuursorgaan of tot de rechtspersoon waartoe dat bestuursorgaan behoort.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel81
    url: https://wetten.overheid.nl/BWBR0027431/2015-03-18#Artikel1.4
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 8:1
  - number: '1.6'
    text: |-
      1 De bestuursrechter behandelt het beroep met toepassing van
      [afdeling 8.2.3 van de Algemene wet bestuursrecht][ref1].

      2 In afwijking van [artikel 6:6 van de Algemene wet bestuursrecht][ref2] is het beroep niet-ontvankelijk indien
      niet is voldaan aan [artikel 6:5, eerste lid, onderdeel d, van die wet][ref3].

      3 Indien de bestuursrechter het advies van de Stichting advisering bestuursrechtspraak inwint, brengt de Stichting
      binnen twee maanden na het verzoek advies uit.

      4 De bestuursrechter doet uitspraak binnen zes maanden na afloop van de beroepstermijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling8.2.3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel66
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel65
