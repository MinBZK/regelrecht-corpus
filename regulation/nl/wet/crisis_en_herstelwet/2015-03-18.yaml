  - number: 1.6a
    text: Na afloop van de termijn voor het instellen van beroep kunnen geen beroepsgronden meer worden aangevoerd.
    url: https://wetten.overheid.nl/BWBR0027431/2015-03-18#Artikel1.6a
  - number: '1.7'
    text: |-
      1 [Artikel 1.6, vierde lid][ref1], is niet van toepassing, indien [artikel 8:51a][ref2] of
      [8:51d van de Algemene wet bestuursrecht][ref3] wordt toegepast.

      2 In dat geval doet de bestuursrechter:

      a. binnen zes maanden na afloop van de beroepstermijn een tussenuitspraak, en

      b. binnen zes maanden na de verzending van de tussenuitspraak een einduitspraak.


      [ref1]: https://wetten.overheid.nl/BWBR0027431#Artikel1.6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel851a
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel851d
