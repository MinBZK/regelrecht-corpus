  - number: '1.10'
    text: |-
      1 Indien een bestuursorgaan na vernietiging van een besluit door de bestuursrechter een nieuw besluit moet
      nemen, kan het dat besluit baseren op de feiten waarop het vernietigde besluit berustte, behoudens voor zover de
      onjuistheid of het onvoldoende vast staan van deze feiten een grond voor de vernietiging was.

      2 Het eerste lid is van overeenkomstige toepassing indien een nieuw besluit wordt genomen ter uitvoering van een
      tussenuitspraak als bedoeld in [artikel 8:80a van de Algemene wet bestuursrecht][ref1].


