  - number: '5.10'
    text: |-
      1 Deze wet vervalt op een bij koninklijk besluit te bepalen tijdstip.

      2 Indien het eerste besluit ter uitvoering van een project waarop deze wet van toepassing was, is genomen voor
      het in het eerste lid bedoelde tijdstip blijft deze wet vanaf dat tijdstip van toepassing op latere besluiten of
      handelingen ter uitvoering van datzelfde project.

      3 Deze wet blijft vanaf het in het eerste lid bedoelde tijdstip van toepassing op:

      a. ontwikkelingsgebieden ten aanzien waarvan voor het in het eerste lid bedoelde tijdstip een
      gebiedsontwikkelingsplan dan wel bestemmingsplan als bedoeld in [artikel 2.3][ref1] is vastgesteld;

      b. experimenten als bedoeld in [artikel 2.4][ref2] die voor het in het eerste lid bedoelde tijdstip zijn aangewezen
      overeenkomstig dat artikel;

      c. de uitvoering van projecten als bedoeld in [artikel 2.9, eerste lid][ref3], indien ten aanzien van dat project
      voor het in het eerste lid bedoelde tijdstip een besluit als bedoeld in [artikel 2.10, eerste lid][ref4], is
      genomen, en

      d. de uitvoering van krachtens [artikel 2.18][ref5] aangewezen projecten, indien ten aanzien van die projecten voor
      het in het eerste lid bedoelde tijdstip aan de structuurvisie, bedoeld in [artikel 2.19, eerste lid][ref6], de in
      [artikel 2.20, tweede lid][ref7], bedoelde verklaringen zijn gehecht.


