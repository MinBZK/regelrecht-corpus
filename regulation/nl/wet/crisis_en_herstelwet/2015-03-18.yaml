  - number: '5.1'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur op de voordracht van Onze Minister van Infrastructuur en Milieu,
      in overeenstemming met Onze Minister of Onze Ministers wie het mede aangaat, kunnen regels worden gegeven gericht
      op:

      a. een versnelling van de ontwikkeling en verwezenlijking van ruimtelijke en infrastructurele projecten, en

      b. een goede uitvoering van deze wet.

      2 Het bij of krachtens de algemene maatregel van bestuur, bedoeld in het eerste lid, bepaalde is slechts van
      toepassing op:

      a. de projecten en categorieën van projecten, genoemd in de [bijlagen I][ref1] en [II][ref2] bij deze wet;

      b. de projecten waar deze wet bij een algemene maatregel van bestuur krachtens [artikel 1.2][ref3] op van
      toepassing is verklaard;

      c. bestemmingsplannen als bedoeld in [artikel 2.3, eerste lid][ref4], alsmede de voor de uitvoering van de
      projecten waarop die bestemmingsplannen betrekking hebben vereiste besluiten en de voor de uitvoering van
      maatregelen of werken als bedoeld in artikel 2.3, tweede lid, onderdelen b en c, vereiste besluiten, en

      d. projectuitvoeringsbesluiten als bedoeld in [artikel 2.10, eerste lid][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0027431
      [ref2]: https://wetten.overheid.nl/BWBR0027431
      [ref3]: https://wetten.overheid.nl/BWBR0027431#Artikel1.2
      [ref4]: https://wetten.overheid.nl/BWBR0027431#Artikel2.3
      [ref5]: https://wetten.overheid.nl/BWBR0027431#Artikel2.10
    url: https://wetten.overheid.nl/BWBR0027431/2015-03-18#Artikel5.1
