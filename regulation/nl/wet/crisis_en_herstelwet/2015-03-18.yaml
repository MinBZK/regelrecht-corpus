  - number: '5.2'
    text: |-
      Tegen toevoeging als bedoeld in [artikel 1.2][ref1] van categorieën van ruimtelijke en infrastructurele projecten
      aan bijlage I of van ruimtelijke en infrastructurele projecten aan [bijlage II][ref2] bij deze wet alsmede tegen
      de aanwijzing van een ontwikkelingsgebied als bedoeld in [artikel 2.2][ref3], een verklaring als bedoeld in
      [artikel 2.3, negende lid][ref4], of een aanwijzing van een project op grond van [artikel 2.18][ref5] staat geen
      beroep open.


