  - number: 2.3a
    text: |-
      [Artikel 2.3][ref1] is van overeenkomstige toepassing op een provinciaal inpassingsplan dat betrekking heeft op
      gronden die gelegen zijn binnen een ontwikkelingsgebied als bedoeld in [artikel 2.2][ref2] met dien verstande dat:

      a. in plaats van «bestemmingsplan» telkens wordt gelezen: inpassingsplan;

      b. in plaats van «burgemeester en wethouders» telkens wordt gelezen: gedeputeerde staten;

      c. in het tweede lid in plaats van «de gemeenteraad» wordt gelezen: provinciale staten;

      d. in het zesde lid in plaats van «Burgemeester en wethouders» wordt gelezen: Gedeputeerde staten;

      e. in het tiende lid in plaats van «gemeente» wordt gelezen: provincie.


      [ref1]: https://wetten.overheid.nl/BWBR0027431#Artikel2.3
      [ref2]: https://wetten.overheid.nl/BWBR0027431#Artikel2.2
    url: https://wetten.overheid.nl/BWBR0027431/2015-03-18#Artikel2.3a
