  - number: '2.9'
    text: |-
      1 Deze afdeling is van toepassing op de uitvoering van:

      a. projecten die geheel of hoofdzakelijk voorzien in de bouw van ten minste 12 en ten hoogste:

      1°. in geval van twee ontsluitingswegen met een gelijkmatige verkeersverdeling: 2 000 nieuwe woningen, dan wel

      2°. in geval van één ontsluitingsweg: 1 500 nieuwe woningen, alsmede

      b. bij algemene maatregel van bestuur op de voordracht van Onze Minister van Infrastructuur en Milieu, in
      overeenstemming met Onze Minister of Onze Ministers wie het mede aangaat, aangewezen categorieën andere projecten
      van maatschappelijke betekenis.

      2 Projecten als bedoeld in het eerste lid, onderdeel a, die in elkaars nabijheid liggen of zullen zijn gelegen,
      vallen uitsluitend onder het toepassingsbereik van deze afdeling, indien de aantallen woningen in die projecten
      gezamenlijk onder het toepasselijke maximum aantal woningen als bedoeld in dat onderdeel blijven.

      3 Deze afdeling is niet van toepassing:

      a. indien voor de uitvoering van een project als bedoeld in het eerste lid een vergunning op grond van
      [artikel 19d, eerste lid, van de Natuurbeschermingswet 1998][ref1] is vereist;

      b. op projecten als bedoeld in het eerste lid, die zijn aangewezen krachtens [artikel 2.18][ref2];

      c. indien het project ziet op de bouw van woningen op minder dan 100 meter van een hoofdweg als
      bedoeld in [artikel 1, eerste lid, van de Tracéwet][ref3], gemeten vanaf de as van die weg, of van
      een weg die overeenkomstig een daartoe krachtens de [Wegenverkeerswet 1994][ref4] aangewezen model is
      aangeduid als route voor het vervoer van gevaarlijke stoffen dat niet is toegestaan door de krachtens
      [artikel 3 van de Wet vervoer gevaarlijke stoffen][ref5] aangewezen tunnels, gemeten vanaf de as van die weg;

      d. indien het project ziet op de bouw van woningen binnen 30 meter van een krachtens
      [artikel 2 van de Spoorwegwet][ref6] aangewezen hoofdspoorweg, gemeten vanaf het hart van het buitenste spoor;

      e. indien het project ziet op de bouw van woningen in of op rijkswateren of regionale wateren waaraan krachtens
      de [artikelen 4.1][ref7] of [4.4 van de Waterwet][ref8] de functie vaarweg is toegekend en die geschikt zijn voor
      gebruik door schepen met een laadvermogen van ten minste 400 ton.


