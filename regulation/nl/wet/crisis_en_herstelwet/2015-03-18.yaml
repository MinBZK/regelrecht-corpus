  - number: '1.2'
    text: |-
      Bij algemene maatregel van bestuur op de voordracht van Onze Minister van Infrastructuur en Milieu, in
      overeenstemming met Onze Minister of Onze Ministers wie het mede aangaat, kunnen categorieën van ruimtelijke
      en infrastructurele projecten worden toegevoegd aan [bijlage I][ref1] bij deze wet en kunnen ruimtelijke en
      infrastructurele projecten worden toegevoegd aan [bijlage II][ref2] bij deze wet.


