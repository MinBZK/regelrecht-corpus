  - number: 2.4.1.h
    text: |-
      de [Wet milieubeheer][ref1] met uitzondering van [artikel 5.2b][ref2] en [titel 5.2][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0003245
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel2.4
