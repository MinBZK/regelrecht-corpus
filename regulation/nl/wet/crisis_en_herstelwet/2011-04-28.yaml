      de [Wet inzake de luchtverontreiniging][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002731
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel2.4
    references:
      - id: ref1
