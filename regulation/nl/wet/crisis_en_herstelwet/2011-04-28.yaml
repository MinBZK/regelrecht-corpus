  - number: '1.2'
    text: |-
      Bij algemene maatregel van bestuur op de voordracht van Onze Minister-President, Minister van Algemene Zaken,
      en Onze Minister of Onze Ministers wie het mede aangaat, kunnen categorieën van ruimtelijke en infrastructurele
      projecten worden toegevoegd aan [bijlage I][ref1] bij deze wet, kunnen ruimtelijke en infrastructurele projecten
      worden toegevoegd aan [bijlage II][ref2] bij deze wet en kunnen wettelijke voorschriften worden toegevoegd aan
      [bijlage III][ref3] bij deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0027431
      [ref2]: https://wetten.overheid.nl/BWBR0027431
      [ref3]: https://wetten.overheid.nl/BWBR0027431
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel1.2
    references:
      - id: ref1
        bwb_id: BWBR0027431
      - id: ref2
        bwb_id: BWBR0027431
      - id: ref3
        bwb_id: BWBR0027431
  - number: '1.3'
    text: |-
      [Artikel 3:9 van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing op onderzoeken die aan een
      besluit ten grondslag zijn gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel1.3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '1.4'
    text: |-
      In afwijking van [artikel 8:1, eerste lid, van de Algemene wet bestuursrecht][ref1] kan een niet tot de centrale
      overheid behorende rechtspersoon die krachtens publiekrecht is ingesteld of een niet tot de centrale overheid
      behorend bestuursorgaan geen beroep instellen tegen een besluit, indien dat besluit niet is gericht tot die
      rechtspersoon of tot een orgaan van die rechtspersoon, onderscheidenlijk tot dat bestuursorgaan of tot de
      rechtspersoon waartoe dat bestuursorgaan behoort.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel1.4
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 1.5.1
    text: |-
      Een besluit waartegen bezwaar is gemaakt of beroep is ingesteld, kan ondanks schending van een geschreven of
      ongeschreven rechtsregel of algemeen rechtsbeginsel, door het orgaan dat op het bezwaar of beroep beslist, in stand
      worden gelaten indien aannemelijk is dat de belanghebbenden daardoor niet zijn benadeeld.
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel1.5
  - number: 1.5.2
    text: |-
      [Artikel 6:22 van de Algemene wet bestuursrecht][ref1] blijft buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel1.5
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
  - number: 1.6.1
    text: |-
      De administratieve rechter behandelt het beroep met toepassing van
      [afdeling 8.2.3 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling8.2.3
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel1.6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 8.2.3
  - number: 1.6.2
    text: |-
      In afwijking van [artikel 6:6 van de Algemene wet bestuursrecht][ref1] is het beroep niet-ontvankelijk indien niet
      is voldaan aan [artikel 6:5, eerste lid, onderdeel d, van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel1.6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '6'
  - number: 1.6.3
    text: |-
      Indien de administratieve rechter het advies van de Stichting advisering bestuursrechtspraak inwint, brengt de
      Stichting binnen twee maanden na het verzoek advies uit.
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel1.6
  - number: 1.6.4
    text: De administratieve rechter doet uitspraak binnen zes maanden na afloop van de beroepstermijn.
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel1.6
  - number: 1.6a
    text: Na afloop van de termijn voor het instellen van beroep kunnen geen beroepsgronden meer worden aangevoerd.
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel1.6a
  - number: 1.7.1
    text: |-
      [Artikel 1.6, vierde lid][ref1], is niet van toepassing, indien
      [artikel 8:51a van de Algemene wet bestuursrecht][ref2], dan wel [artikel 36, zesde lid][ref3], of
      [artikel 39, zesde lid, van de Wet op de Raad van State][ref4] of [artikel 19, zesde lid][ref5], of
      [artikel 22, zesde lid, van de Wet bestuursrechtspraak bedrijfsorganisatie][ref6] wordt toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0027431#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0002367#Artikel36
      [ref4]: https://wetten.overheid.nl/BWBR0002367#Artikel39
      [ref5]: https://wetten.overheid.nl/BWBR0002144#Artikel19
      [ref6]: https://wetten.overheid.nl/BWBR0002144#Artikel22
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel1.7
    references:
      - id: ref1
        bwb_id: BWBR0027431
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2.4'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0002367
        artikel: '36'
      - id: ref4
        bwb_id: BWBR0002367
        artikel: '39'
      - id: ref5
        bwb_id: BWBR0002144
        artikel: '19'
      - id: ref6
        bwb_id: BWBR0002144
        artikel: '22'
  - number: 1.7.2
    text: 'In dat geval doet de administratieve rechter:'
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel1.7
  - number: 1.7.2.a
    text: binnen zes maanden na afloop van de beroepstermijn een tussenuitspraak, en
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel1.7
  - number: 1.7.2.b
    text: binnen zes maanden na de verzending van de tussenuitspraak een einduitspraak.
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel1.7
  - number: 1.8.1
    text: |-
      [Artikel 1.6, vierde lid][ref1], is niet van toepassing, indien de administratieve rechter met toepassing van
      artikel 234 van het Verdrag tot oprichting van de Europese Gemeenschap prejudiciële vragen stelt.


      [ref1]: https://wetten.overheid.nl/BWBR0027431#Artikel1
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel1.8
    references:
      - id: ref1
        bwb_id: BWBR0027431
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2.4'
        afdeling: '2'
  - number: 1.8.2
    text: In dat geval worden de vragen binnen zes maanden na afloop van de beroepstermijn bij tussenuitspraak gesteld.
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel1.8
  - number: 1.8.3
    text: |-
      In de tussenuitspraak beslist de rechter zoveel mogelijk ook op de beroepsgronden die niet door de vragen worden
      geraakt.
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel1.8
  - number: 1.8.4
    text: |-
      Tegen een tussenuitspraak van de rechtbank kan hoger beroep worden ingesteld tegelijk met het hoger beroep tegen
      de einduitspraak.
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel1.8
  - number: '1.9'
    text: |-
      De administratieve rechter vernietigt een besluit niet op de grond, dat het in strijd is met een geschreven of
      ongeschreven rechtsregel of een algemeen rechtsbeginsel, indien deze regel of dit beginsel kennelijk niet strekt
      tot bescherming van de belangen van degene die zich daarop beroept.
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel1.9
  - number: 1.9a
    text: |-
      De [artikelen 1.5 tot en met 1.9][ref1] zijn van overeenkomstige toepassing in hoger beroep.


      [ref1]: https://wetten.overheid.nl/BWBR0027431#Artikel1
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel1.9a
    references:
      - id: ref1
        bwb_id: BWBR0027431
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2.3'
        afdeling: '2'
  - number: 1.10.1
    text: |-
      Indien een bestuursorgaan na vernietiging van een besluit door de administratieve rechter een nieuw besluit moet
      nemen, kan het dat besluit baseren op de feiten waarop het vernietigde besluit berustte, behoudens voor zover de
      onjuistheid of het onvoldoende vast staan van deze feiten een grond voor de vernietiging was.
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel1.10
  - number: 1.10.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing indien een nieuw besluit wordt genomen ter uitvoering van een
      tussenuitspraak als bedoeld in [artikel 8:80a van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel1.10
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '1.11'
    text: |-
      Indien op grond van [artikel 7.2 van de Wet milieubeheer][ref1] een milieueffectrapport wordt opgesteld ten behoeve
      van een besluit, is:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel1.11
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
  - number: 1.11.a
    text: |-
      [artikel 7.23 van die wet][ref1] voor zover dat regels stelt over alternatieven voor de voorgenomen activiteit,
      niet van toepassing;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel1.11
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
  - number: 1.11.b
    text: |-
      [artikel 7.32, vijfde lid, van die wet][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel1.11
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
  - number: 1.12.1
    text: |-
      Op de aanvraag om een vergunning als bedoeld in de wettelijke voorschriften, genoemd in [bijlage III][ref1] bij
      deze wet, is [paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0027431
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel1.12
    references:
      - id: ref1
        bwb_id: BWBR0027431
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: 1.12.2
    text: |-
      Indien [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing is op de
      voorbereiding van een besluit omtrent verlening van een vergunning, is op de aanvraag ervan
      [paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel1.12
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: 1.12.3
    text: |-
      In afwijking van [artikel 4:20b, derde lid, van de Algemene wet bestuursrecht][ref1] is
      [artikel 3.16, vierde lid, van de Wet ruimtelijke ordening][ref2] van toepassing indien een aanlegvergunning van
      rechtswege is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel1.12
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 1.12.4
    text: |-
      Een bevoegde instantie bevestigt de ontvangst van een aanvraag om een vergunning als bedoeld in de wettelijke
      voorschriften, bedoeld in [bijlage III][ref1], zo snel mogelijk. De ontvangstbevestiging bevat de volgende
      informatie:


      [ref1]: https://wetten.overheid.nl/BWBR0027431
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel1.12
    references:
      - id: ref1
        bwb_id: BWBR0027431
  - number: 1.12.4.a
    text: |-
      de bij wettelijk voorschrift met betrekking tot die vergunning bepaalde termijn waarbinnen de beschikking wordt
      gegeven;
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel1.12
  - number: 1.12.4.b
    text: de beschikbare rechtsmiddelen om tegen de beschikking op te komen.
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel1.12
  - number: 1.12.5
    text: |-
      Indien [paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref1] op een aanvraag van toepassing is, vermeldt
      de ontvangstbevestiging tevens dat de gevraagde beschikking van rechtswege is gegeven, indien niet tijdig op de
      aanvraag is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel1.12
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '2.1'
    text: 'In deze afdeling en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel2.1
  - number: 2.1.a
    text: |-
      *milieugebruiksruimte:* binnen een ontwikkelingsgebied aanwezige marge tussen de bestaande milieukwaliteit en de
      voor dat gebied geldende milieukwaliteitsnormen, die kan worden benut voor milieubelastende activiteiten;
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel2.1
  - number: 2.1.b
    text: |-
      *milieukwaliteitsnorm:* bij wettelijk voorschrift gestelde norm ten aanzien van de kwaliteit van een onderdeel van
      het milieu.
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel2.1
  - number: 2.2.1
    text: |-
      Bij algemene maatregel van bestuur op de voordracht van Onze Minister-President, Minister van Algemene Zaken,
      in overeenstemming met Onze Minister of Onze Ministers wie het mede aangaat, kan bij wijze van experiment een
      gebied, zijnde bestaand stedelijk gebied of bestaand bedrijventerrein, voor de duur van ten hoogste tien jaar
      worden aangewezen als ontwikkelingsgebied, indien dat met het oog op het versterken van de duurzame ruimtelijke en
      economische ontwikkeling van dat gebied bijzonder aangewezen is.
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel2.2
  - number: 2.2.2
    text: |-
      Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer zendt uiterlijk drie maanden na de
      beëindiging van een experiment een verslag over de doeltreffendheid en de effecten ervan, alsmede een standpunt
      inzake de voortzetting ervan anders dan als experiment, aan de beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel2.2
  - number: 2.3.1
    text: |-
      Voor een ontwikkelingsgebied stelt de gemeenteraad een gebiedsontwikkelingsplan vast dat deel uitmaakt van het
      bestemmingsplan. Het bestemmingsplan en het exploitatieplan worden overeenkomstig met het gebiedontwikkelingsplan
      gewijzigd en worden tegelijkertijd met het gebiedsontwikkelingsplan vastgesteld. Het gebiedsontwikkelingsplan
      is gericht op een optimalisering van de milieugebruiksruimte met het oog op het versterken van een duurzame
      ruimtelijke en economische ontwikkeling van dat gebied in samenhang met het totstandbrengen van een goede
      milieukwaliteit. Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld, zo nodig per
      aangewezen gebied als bedoeld in [artikel 2.2. eerste lid][ref1], over de wijze waarop de optimalisering van de
      milieugebruiksruimte plaats kan vinden.


      [ref1]: https://wetten.overheid.nl/BWBR0027431#Artikel2
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0027431
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '1'
  - number: 2.3.2
    text: 'Een gebiedsontwikkelingsplan bevat:'
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel2.3
  - number: 2.3.2.a
    text: |-
      de vanwege het optimaliseren van de milieugebruiksruimte door de gemeenteraad voorgenomen projecten in het
      ontwikkelingsgebied;
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel2.3
  - number: 2.3.2.b
    text: de voorgenomen maatregelen en werken in het gebied ten behoeve van een goede milieukwaliteit;
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel2.3
  - number: 2.3.2.c
    text: |-
      de in het gebied noodzakelijke maatregelen en werken ter compensatie van het beslag op milieugebruiksruimte door de
      in het gebiedsontwikkelingsplan voorziene ruimtelijke ontwikkelingen;
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel2.3
  - number: 2.3.2.d
    text: |-
      zo nodig een fasering en koppeling bij de tenuitvoerlegging van de in de onderdelen a, b en c bedoelde projecten,
      maatregelen en werken;
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel2.3
  - number: 2.3.2.e
    text: |-
      een raming van de kosten van uitvoering van het gebiedsontwikkelingsplan, een beschrijving van de wijze
      waarop daarin zal worden voorzien, en een beschrijving van de wijze waarop het bereiken van de met het
      gebiedsontwikkelingsplan beoogde resultaten zal worden nagestreefd;
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel2.3
  - number: 2.3.2.f
    text: |-
      een overzicht van de tijdstippen waarop aan de gemeenteraad een rapportage zal worden uitgebracht over de voortgang
      en de uitvoering van de in de onderdelen a, b en c bedoelde projecten, maatregelen en werken, die op verzoek tevens
      wordt verstrekt aan Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer.
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel2.3
  - number: 2.3.3
    text: |-
      [Afdeling 3.4 van de Algemene wet bestuursrecht][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 2.3.4
    text: |-
      Tegen een gebiedsontwikkelingsplan kan beroep worden ingesteld bij de Afdeling bestuursrechtspraak van de Raad
      van State. Het bestemmingsplan, het exploitatieplan en het gebiedsontwikkelingsplan worden voor de behandeling en
      uitspraak op het beroep aangemerkt als één besluit.
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel2.3
  - number: 2.3.5
    text: |-
      Indien voor de uitvoering van maatregelen of werken als bedoeld in het tweede lid, onderdelen b en c, enig besluit
      is vereist, kunnen burgemeester en wethouders, met inachtneming van desbetreffende bindende besluiten van de
      Raad van de Europese Unie, van het Europees Parlement en de Raad gezamenlijk of van de Commissie van de Europese
      Gemeenschappen, dat besluit nemen, mits het gebiedsontwikkelingsplan waarin de maatregel of werken zijn opgenomen
      onherroepelijk is geworden en voor zover nodig in afwijking van bij algemene maatregel van bestuur aangegeven
      bepalingen bij of krachtens:
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel2.3
  - number: 2.3.5.a
    text: |-
      de [Flora- en faunawet][ref1];

      [ref1]: https://wetten.overheid.nl/BWBR0009640
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0009640
  - number: 2.3.5.b
    text: |-
      de [Natuurbeschermingswet 1998][ref1];


