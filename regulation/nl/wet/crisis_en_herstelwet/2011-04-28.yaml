      - id: ref2
        bwb_id: BWBR0019466
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0019466
        artikel: '3'
  - number: 5.5a
    text: |-
      [Artikel 9, vierde, vijfde en zesde lid, van de Spoedwet wegverbreding][ref1] is niet van toepassing op een
      wegaanpassingsbesluit dat is vastgesteld voor de inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0015158#Artikel9
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel5.5a
    references:
      - id: ref1
        bwb_id: BWBR0015158
        artikel: '9'
  - number: 5.5b
    text: |-
      [Artikel 15, tiende, elfde en twaalfde lid, van de Tracéwet][ref1] is niet van toepassing op een tracébesluit dat
      is vastgesteld voor de inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel15
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel5.5b
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '15'
  - number: '5.8'
    text: |-
      [Afdeling 3 van hoofdstuk 2][ref1] vervalt op het tijdstip van inwerkingtreding van de krachtens
      [artikel 4.3, eerste lid, van de Wet ruimtelijke ordening][ref2] gegeven bepalingen met betrekking tot
      radarstations als bedoeld in die afdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0027431#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel4
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel5.8
    references:
