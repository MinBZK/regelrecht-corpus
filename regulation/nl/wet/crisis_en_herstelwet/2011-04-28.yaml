  - number: 2.3.6
    text: |-
      Burgemeester en wethouders nemen in bij algemene maatregel van bestuur aangegeven categorieën van gevallen geen
      besluit als bedoeld in het vijfde lid dan nadat het bestuursorgaan dat krachtens de betrokken wet bevoegd zou zijn
      te beslissen, heeft verklaard dat het daartegen geen bedenkingen heeft.
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel2.3
  - number: 2.3.7
    text: |-
      De verklaring, bedoeld in het zesde lid, kan slechts worden geweigerd met het oog op het belang dat de betrokken
      wet beoogt te beschermen.
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel2.3
  - number: 2.3.8
    text: |-
      Het bestuursorgaan zendt het ontwerp van de verklaring binnen acht weken aan burgemeester en wethouders. In een
      geval als bedoeld in [artikel 3:18, tweede lid, van de Algemene wet bestuursrecht][ref1] kunnen burgemeester en
      wethouders deze termijn met een bij hun besluit te bepalen redelijke termijn verlengen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 2.3.9
    text: |-
      De [artikelen 2.27, tweede, vierde en vijfde lid][ref1], en
      [3.11, eerste, tweede, vijfde en zesde lid, van de Wet algemene bepalingen omgevingsrecht][ref2] zijn van
      overeenkomstige toepassing met dien verstande dat voor «omgevingsvergunning» telkens wordt gelezen «een besluit
      als bedoeld in artikel 2.3, vijfde lid, van de Crisis- en herstelwet» en voor «verklaring» telkens wordt gelezen:
      verklaring als bedoeld in artikel 2.3, zesde lid, van de Crisis- en herstelwet.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel3
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '3'
  - number: 2.3.10
    text: |-
      De gemeente draagt zorg voor het uitvoeren van de maatregelen of werken, bedoeld in het tweede lid, onderdelen b en
      c, binnen een in het plan te noemen termijn.
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel2.3
  - number: 2.3.11
    text: |-
      Werken opgenomen in het gebiedsontwikkelingsplan worden aangemerkt als openbare werken van algemeen nut in de zin
      van de [Belemmeringenwet Privaatrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001936
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0001936
  - number: 2.3.12
    text: |-
      Indien voor de uitvoering van werken als bedoeld in het tweede lid, onderdelen b en c toepassing van de
      [Belemmeringenwet Privaatrecht][ref1] noodzakelijk is, geldt in plaats van [artikel 4 van die wet][ref2] dat:


      [ref1]: https://wetten.overheid.nl/BWBR0001936
      [ref2]: https://wetten.overheid.nl/BWBR0001936#Artikel4
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0001936
      - id: ref2
        bwb_id: BWBR0001936
        artikel: '4'
  - number: 2.3.12.a
    text: |-
      tegen een besluit als bedoeld in [artikel 2, vijfde lid][ref1], of [artikel 3, tweede lid, van die wet][ref2] een
      belanghebbende beroep kan instellen bij de Afdeling bestuursrechtspraak van de Raad van State;


      [ref1]: https://wetten.overheid.nl/BWBR0001936#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001936#Artikel3
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0001936
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001936
        artikel: '3'
  - number: 2.3.12.b
    text: |-
      [artikel 7:1 van de Algemene wet bestuursrecht][ref1] niet van toepassing is, en


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 2.3.12.c
    text: |-
      de werking van een besluit als bedoeld in [artikel 2, vijfde lid][ref1], of
      [artikel 3, tweede lid, van de Belemmeringenwet Privaatrecht][ref2] opgeschort wordt totdat de beroepstermijn is
      verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0001936#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001936#Artikel3
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0001936
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001936
        artikel: '3'
  - number: 2.3.13
    text: |-
      Voor zover een besluit als bedoeld in het vijfde lid zijn grondslag vindt in een gebiedsontwikkelingsplan, kunnen
      de gronden in beroep daarop geen betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel2.3
  - number: 2.3a.1
    text: |-
      Indien voor een ontwikkelingsgebied een provinciaal inpassingsplan wordt vastgesteld, stellen, in afwijking van
      [artikel 2.3, eerste lid][ref1], voor dat gebied provinciale staten een gebiedsontwikkelingsplan vast.


      [ref1]: https://wetten.overheid.nl/BWBR0027431#Artikel2
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel2.3a
    references:
      - id: ref1
        bwb_id: BWBR0027431
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '1'
  - number: 2.3a.2
    text: |-
      [Artikel 2.3][ref1] is van overeenkomstige toepassing op een ingevolge het eerste lid vastgesteld
      gebiedsontwikkelingsplan, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0027431#Artikel2
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel2.3a
    references:
      - id: ref1
        bwb_id: BWBR0027431
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '1'
  - number: 2.3a.2.a
    text: 'in het eerste en tweede lid in plaats van «de gemeenteraad» wordt gelezen: provinciale staten;'
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel2.3a
  - number: 2.3a.2.b
    text: 'in het eerste en vierde lid in plaats van «bestemmingsplan» telkens wordt gelezen: inpassingsplan;'
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel2.3a
  - number: 2.3a.2.c
    text: 'in het vijfde en achtste lid in plaats van «burgemeester en wethouders» telkens wordt gelezen: gedeputeerde staten;'
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel2.3a
  - number: 2.3a.2.d
    text: 'in het zesde lid in plaats van «Burgemeester en wethouders» wordt gelezen: Gedeputeerde staten;'
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel2.3a
  - number: 2.3a.2.e
    text: 'in het tiende lid in plaats van «gemeente» wordt gelezen: provincie.'
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel2.3a
  - number: 2.4.1
    text: |-
      Bij algemene maatregel van bestuur op de voordracht van Onze Minister-President, Minister van Algemene Zaken,
      in overeenstemming met Onze Minister of Onze Ministers wie het mede aangaat, kan, met inachtneming van bindende
      besluiten van de Raad van de Europese Unie, van het Europees Parlement en de Raad gezamenlijk of van de Commissie
      van de Europese Gemeenschappen, bij wege van experiment worden afgeweken van het bepaalde bij of krachtens:
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel2.4
  - number: 2.4.1.a
    text: |-
      de [Elektriciteitswet 1998][ref1];


