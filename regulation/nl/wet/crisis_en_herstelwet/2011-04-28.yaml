        bwb_id: BWBR0027431
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2.2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0027431
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2.4'
        afdeling: '2'
  - number: 5.4.1
    text: |-
      Het recht zoals dat gold voor het tijdstip van inwerkingtreding van deze wet blijft van toepassing op een
      onteigeningsbesluit, waarvan het ontwerp ter inzage is gelegd voor dat tijdstip.
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel5.4
  - number: 5.4.2
    text: |-
      Een koninklijk besluit tot goedkeuring van een onteigeningsbesluit als bedoeld in
      [artikel 79 van de onteigeningswet][ref1], zoals dat luidde voor de inwerkingtreding van deze wet, wordt
      gelijkgesteld met een onteigeningsbesluit als bedoeld in [artikel 78 van de onteigeningswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel79
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel78
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel5.4
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '79'
      - id: ref2
        bwb_id: BWBR0001842
        artikel: '78'
  - number: '5.5'
    text: |-
      De [Interimwet stad-en-milieubenadering][ref1], zoals die laatstelijk luidde voor de datum van inwerkingtreding van
      deze wet, blijft van toepassing op een voor die datum ingesteld beroep tegen een besluit omtrent goedkeuring van
      een besluit als bedoeld in de [artikelen 2][ref2] en [3 van die wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0019466
      [ref2]: https://wetten.overheid.nl/BWBR0019466#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0019466#Artikel3
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel5.5
    references:
