preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is bijzondere wettelijke voorzieningen te treffen voor een
    versnelde ontwikkeling en verwezenlijking van ruimtelijke en infrastructurele projecten, teneinde bij te dragen aan
    de bestrijding van de economische crisis alsmede met dat doel diverse wettelijke bepalingen te wijzigen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#ArtikelAanhef
articles:
