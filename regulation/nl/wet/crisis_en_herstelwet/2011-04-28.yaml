        artikel: '3'
        hoofdstuk: '3'
  - number: 5.10.2
    text: |-
      Indien het eerste besluit ter uitvoering van een project waarop deze wet van toepassing was, is genomen voor
      1 januari 2014 blijft deze wet na 31 december 2013 van toepassing op latere besluiten of handelingen ter uitvoering
      van datzelfde project.
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel5.10
  - number: 5.10.3
    text: 'Deze wet blijft na 31 december 2013 van toepassing op:'
