        bwb_id: BWBR0027431
        hoofdstuk: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '4'
  - number: 5.9a
    text: |-
      Onze Minister van Justitie zendt, in overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening
      en Milieubeheer binnen twee jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een evaluatie van de
      effecten van de in [Hoofdstuk 1][ref1] van deze wet opgenomen instrumenten op versnelling en op verbetering van de
      projecten waarop deze van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0027431#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel5.9a
    references:
      - id: ref1
        bwb_id: BWBR0027431
        hoofdstuk: '1'
  - number: 5.10.1
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip en vervalt met ingang van 1 januari
      2014. De [artikelen 3.6][ref1] en [3.25][ref2] werken terug tot en met 1 juli 2008 respectievelijk tot en met
      15 juni 2009.


      [ref1]: https://wetten.overheid.nl/BWBR0027431#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0027431#Artikel3
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel5.10
