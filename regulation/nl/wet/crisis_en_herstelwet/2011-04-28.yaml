      - id: ref2
        bwb_id: BWBR0003245
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0003245
  - number: 2.4.1.i
    text: |-
      de [Wet ruimtelijke ordening][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0020449
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0020449
  - number: 2.4.1.j
    text: |-
      de [Woningwet][ref1].

      [ref1]: https://wetten.overheid.nl/BWBR0005181
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0005181
  - number: 2.4.2
    text: |-
      Er kan uitsluitend toepassing worden gegeven aan het eerste lid indien het experiment bijdraagt aan innovatieve
      ontwikkelingen en voldoende aannemelijk is dat uitvoering ervan bijdraagt aan het bestrijden van de economische
      crisis en aan de duurzaamheid.
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel2.4
  - number: 2.4.3
    text: 'Bij de algemene maatregel van bestuur, bedoeld in het eerste lid, wordt bepaald:'
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel2.4
  - number: 2.4.3.a
    text: welke afwijking of afwijkingen van de betrokken in het eerste lid genoemde wet of wetten is of zijn toegestaan;
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel2.4
  - number: 2.4.3.b
    text: de ten hoogste toegestane tijdsduur van die afwijking of afwijkingen, en
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel2.4
  - number: 2.4.3.c
    text: |-
      de wijze waarop wordt vastgesteld of een afwijking aan haar doel beantwoordt, en of de tijdsduur daarvan aanpassing
      behoeft.
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel2.4
  - number: 2.4.4
    text: |-
      Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer of Onze Minister voor Wonen, Wijken en
      Integratie zendt uiterlijk drie maanden na de beëindiging van een experiment een verslag over de doeltreffendheid
      en de effecten ervan, alsmede een standpunt inzake de voortzetting ervan anders dan als experiment, aan de beide
      kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel2.4
  - number: '2.5'
    text: |-
      In deze afdeling wordt: - *verstaan onder bestemmingsplan:* bestemmingsplan als bedoeld in
      [artikel 3.1 van de Wet ruimtelijke ordening][ref1] alsmede een wijzigings- of uitwerkingsplan
      als bedoeld in [artikel 3.6, eerste lid, onderdeel a of b, van die wet][ref2], een inpassingplan
      als bedoeld in de [artikelen 3.26][ref3] en [3.28 van die wet][ref4], een beheersverordening
      als bedoeld in [artikel 3.38 van die wet][ref5] en een rijksbestemmingsplan als bedoeld in
      [artikel 10.3 van die wet][ref6] alsmede een omgevingsvergunning waarbij met toepassing van
      [artikel 2.12, eerste lid, onder a, onder 3°, van de Wet algemene bepalingen omgevingsrecht][ref7] van het
      bestemmingsplan, het inpassingsplan of de beheersverordening is afgeweken;
        - *onder toelichting bij een bestemmingsplan mede verstaan* de onderbouwing bij een omgevingsvergunning waarbij met
      toepassing van [artikel 2.12, eerste lid, onder a, onder 3°, van de Wet algemene bepalingen omgevingsrecht][ref8]
      van het bestemmingsplan, het inpassingsplan of de beheersverordening is afgeweken;
        - *verstaan onder radarstation:* voor de beveiliging van het nationaal luchtruim en de veilige afhandeling van het
      militair en burgerluchtverkeer essentieel radarstation, en
        - *verstaan onder radarverstoringsgebied voor een radarstation:* gebied waar beperkingen gelden ten aanzien van
      bestemmingsplannen ten behoeve van een goede werking van de radar op het radarstation.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref6]: https://wetten.overheid.nl/BWBR0020449#Artikel10
      [ref7]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref8]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel2.5
