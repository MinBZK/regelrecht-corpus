  - number: 5.3.1
    text: |-
      De [artikelen 1.4][ref1] en [1.6 tot en met 1.9][ref2] zijn niet van toepassing indien beroep wordt ingesteld tegen
      een besluit dat is bekendgemaakt voor het tijdstip van inwerkingtreding van deze wet, dan wel hoger beroep wordt
      ingesteld tegen een uitspraak die voor dat tijdstip is bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0027431#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0027431#Artikel1
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0027431
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2.2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0027431
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2.4'
        afdeling: '2'
  - number: 5.3.2
    text: |-
      De [artikelen 1.4][ref1] en [1.9][ref2] zijn voorts niet van toepassing, indien hoger beroep wordt ingesteld tegen
      een uitspraak omtrent een besluit dat is bekendgemaakt voor het tijdstip van inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0027431#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0027431#Artikel1
    url: https://wetten.overheid.nl/BWBR0027431/2011-04-28#Artikel5.3
    references:
