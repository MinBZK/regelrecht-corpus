        paragraaf: '2.4'
        afdeling: '2'
  - number: 5.3.2
    text: |-
      De [artikelen 1.4][ref1] en [1.9][ref2] zijn voorts niet van toepassing, indien hoger beroep wordt ingesteld tegen
      een uitspraak omtrent een besluit dat is bekendgemaakt voor het tijdstip van inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0027431#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0027431#Artikel1
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel5.3
