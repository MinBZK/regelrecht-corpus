  - number: 2.4.2
    text: |-
      Er kan uitsluitend toepassing worden gegeven aan het eerste lid indien het experiment bijdraagt aan duurzame
      ontwikkeling en
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.4
  - number: 2.4.2.a
    text: het experiment bijdraagt aan innovatieve ontwikkelingen; of
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.4
  - number: 2.4.2.b
    text: uitvoering van het experiment bijdraagt aan het versterken van de economische structuur.
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.4
  - number: 2.4.3
    text: 'Bij de algemene maatregel van bestuur, bedoeld in het eerste lid, wordt bepaald:'
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.4
  - number: 2.4.3.a
    text: welke afwijking of afwijkingen van de betrokken in het eerste lid genoemde wet of wetten is of zijn toegestaan;
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.4
  - number: 2.4.3.b
    text: de ten hoogste toegestane tijdsduur van die afwijking of afwijkingen, en
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.4
  - number: 2.4.3.c
    text: |-
      de wijze waarop wordt vastgesteld of een afwijking aan haar doel beantwoordt, en of de tijdsduur daarvan aanpassing
      behoeft.
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.4
  - number: 2.4.4
    text: 'Bij algemene maatregel van bestuur, bedoeld in het eerste lid, kan worden bepaald:'
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.4
  - number: 2.4.4.a
    text: aan welke eisen een verzoek voor een afwijking van de in het eerste lid genoemde wetten voldoet;
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.4
  - number: 2.4.4.b
    text: in welke situaties afwijkingen van de in het eerste lid genoemde wetten zijn toegestaan.
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.4
  - number: 2.4.5
    text: |-
      Bij regeling van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, in overeenstemming met Onze Minister
      of Onze Ministers wie het mede aangaat, kan het toepassingsbereik van in de algemene maatregel van bestuur
      geregelde experimenten worden uitgebreid door daarvoor nieuwe gebieden en projecten aan te wijzen. Daarbij wordt de
      ten hoogste toegestane tijdsduur van de afwijking of afwijkingen aangegeven.
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.4
  - number: '2.7'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.7
  - number: 2.9.1
    text: 'Deze afdeling is van toepassing op de uitvoering van:'
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.9
  - number: 2.9.1.a
    text: 'projecten die geheel of hoofdzakelijk voorzien in de bouw van ten minste 5 en ten hoogste:'
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.9
  - number: 2.9.1.a.1°
    text: 'in geval van twee ontsluitingswegen met een gelijkmatige verkeersverdeling: 2 000 nieuwe woningen, dan wel'
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.9
  - number: 2.9.1.a.2°
    text: 'in geval van één ontsluitingsweg: 1 500 nieuwe woningen, alsmede'
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.9
  - number: 2.9.1.b
    text: |-
      bij algemene maatregel van bestuur op de voordracht van Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties, in overeenstemming met Onze Minister of Onze Ministers wie het mede aangaat, aangewezen
      categorieën andere projecten van maatschappelijke betekenis.
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.9
  - number: 2.9.2
    text: |-
      Projecten als bedoeld in het eerste lid, onderdeel a, die in elkaars nabijheid liggen of zullen zijn gelegen,
      vallen uitsluitend onder het toepassingsbereik van deze afdeling, indien de aantallen woningen in die projecten
      gezamenlijk onder het toepasselijke maximum aantal woningen als bedoeld in dat onderdeel blijven.
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.9
  - number: 2.9.3
    text: 'Deze afdeling is niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.9
  - number: 2.9.3.a
    text: |-
      op projecten als bedoeld in het eerste lid, die zijn aangewezen krachtens [artikel 2.18][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0027431#Artikel2
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0027431
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '7'
  - number: 2.9.3.b
    text: |-
      indien het project ziet op de bouw van woningen op minder dan 100 meter van een hoofdweg als bedoeld
      in [artikel 1, eerste lid, van de Tracéwet][ref1], gemeten vanaf de as van die weg, of van een weg
      die overeenkomstig een daartoe krachtens de [Wegenverkeerswet 1994](onbekend) aangewezen model is
      aangeduid als route voor het vervoer van gevaarlijke stoffen dat niet is toegestaan door de krachtens
      [artikel 3 van de Wet vervoer gevaarlijke stoffen][ref2] aangewezen tunnels, gemeten vanaf de as van die weg;


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007606#Artikel3
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0007606
        artikel: '3'
  - number: 2.9.3.c
    text: |-
      indien het project ziet op de bouw van woningen binnen 30 meter van een krachtens
      [artikel 2 van de Spoorwegwet][ref1] aangewezen hoofdspoorweg, gemeten vanaf het hart van het buitenste spoor;


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel2
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '2'
  - number: 2.9.3.d
    text: |-
      indien het project ziet op de bouw van woningen in of op rijkswateren of regionale wateren waaraan krachtens de
      [artikelen 4.1][ref1] of [4.4 van de Waterwet][ref2] de functie vaarweg is toegekend en die geschikt zijn voor
      gebruik door schepen met een laadvermogen van ten minste 400 ton.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel4
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0025458
        artikel: '4'
  - number: 2.10.1
    text: |-
      Op verzoek of ambtshalve kunnen burgemeester en wethouders ten aanzien van een project als bedoeld in
      [artikel 2.9, eerste lid][ref1], een projectuitvoeringsbesluit vaststellen, waaronder begrepen de vaststelling dat
      deze afdeling op het project van toepassing is. Burgemeester en wethouders kunnen het projectuitvoeringsbesluit
      ten aanzien van een project als bedoeld in artikel 2.9, eerste lid, onderdeel a, alleen vaststellen indien de
      gemeenteraad in een structuurvisie als bedoeld in [artikel 2.1 van de Wet ruimtelijke ordening][ref2] of een
      bestemmingsplan als bedoeld in [artikel 3.1 van die wet][ref3] de gronden waarop het projectuitvoeringsbesluit
      betrekking heeft voor woningbouw heeft aangewezen. Indien de gronden in de structuurvisie of in het bestemmingsplan
      niet voor woningbouw zijn aangewezen, is de gemeenteraad bevoegd tot het nemen van het projectuitvoeringsbesluit
      voor een project als bedoeld in artikel 2.9, eerste lid, onderdeel a.


      [ref1]: https://wetten.overheid.nl/BWBR0027431#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0027431
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 2.10.2
    text: |-
      Op de ontwikkeling en verwezenlijking van een project als bedoeld in [artikel 2.9, eerste lid][ref1], ten
      aanzien waarvan een projectuitvoeringsbesluit is vastgesteld, zijn de wettelijke voorschriften krachtens welke
      daarvoor een vergunning, ontheffing, vrijstelling of enig ander besluit is vereist, niet van toepassing, met
      uitzondering van [paragraaf 5.1 van de Erfgoedwet][ref2], [artikel 6.5, onderdeel c, van de Waterwet][ref3]
      en de [artikelen 4.1a][ref4] en [4.3a van de Wet ruimtelijke ordening][ref5]. Indien een besluit op grond van
      [artikel 2.7][ref6] of [hoofdstuk 3 van de Wet natuurbescherming][ref7] is vereist, zijn de [artikelen 2.27][ref8]
      en [2.28 van de Wet algemene bepalingen omgevingsrecht][ref9] van overeenkomstige toepassing, in die zin dat de
      verklaring van geen bedenkingen door gedeputeerde staten wordt verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0027431#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037521#Paragraaf5.1
      [ref3]: https://wetten.overheid.nl/BWBR0025458#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0020449#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0020449#Artikel4
      [ref6]: https://wetten.overheid.nl/BWBR0037552#Artikel2
      [ref7]: https://wetten.overheid.nl/BWBR0037552#Hoofdstuk3
      [ref8]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref9]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0027431
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0037521
        paragraaf: '5.1'
      - id: ref3
        bwb_id: BWBR0025458
        artikel: '6'
      - id: ref4
        bwb_id: BWBR0020449
        artikel: '4'
      - id: ref5
        bwb_id: BWBR0020449
        artikel: '4'
      - id: ref6
