        artikel: '4'
  - number: 5.9a
    text: |-
      Onze Minister van Justitie en Veiligheid zendt, in overeenstemming met Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties binnen twee jaar na de inwerkingtreding van deze wet, en vervolgens na twee jaar, aan de
      Staten-Generaal een evaluatie van de effecten van de in [Hoofdstuk 1][ref1] van deze wet opgenomen instrumenten op
      versnelling en op verbetering van de projecten waarop deze van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0027431#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel5.9a
