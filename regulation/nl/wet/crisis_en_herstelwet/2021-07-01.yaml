  - number: '5.8'
    text: |-
      [Afdeling 3 van hoofdstuk 2][ref1] vervalt op het tijdstip van inwerkingtreding van de krachtens
      [artikel 4.3, eerste lid, van de Wet ruimtelijke ordening][ref2] gegeven bepalingen met betrekking tot
      radarstations als bedoeld in die afdeling.


