        bwb_id: BWBR0024779
        artikel: '4'
  - number: 2.3.3.b.2°
    text: |-
      burgemeester en wethouders het bevoegd gezag verzoeken voorschriften van de omgevingsvergunning voor die activiteit
      te wijzigen, waarbij de [artikelen 2.29, derde lid][ref1], [2.31, eerste lid, onderdeel a][ref2], en [2.31a][ref3]
      en [paragraaf 3.4 van die wet][ref4] van overeenkomstige toepassing zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0024779#Paragraaf3.4
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.3
