        artikel: '2'
      - id: ref3
        bwb_id: BWBR0019466
        artikel: '3'
  - number: 5.5a
    text: |-
      [Artikel 9, vierde, vijfde en zesde lid, van de Spoedwet wegverbreding][ref1] is niet van toepassing op een
      wegaanpassingsbesluit dat is vastgesteld voor de inwerkingtreding van deze wet.


