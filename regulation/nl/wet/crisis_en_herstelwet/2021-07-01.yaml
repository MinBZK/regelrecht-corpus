  - number: 2.3.8
    text: Het zevende lid is van overeenkomstige toepassing op besluiten die strekken ter uitvoering van het bestemmingsplan.
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.3
  - number: 2.3.9
    text: |-
      Burgemeester en wethouders nemen in bij algemene maatregel van bestuur aangegeven categorieën van
      gevallen geen besluit als bedoeld in het achtste lid dan nadat het bestuursorgaan dat krachtens de
      betrokken wet bevoegd zou zijn te beslissen, heeft verklaard dat het daartegen geen bedenkingen heeft. De
      [artikelen 2.27, tweede tot en met vijfde lid][ref1], en [3.11 van de Wet algemene bepalingen omgevingsrecht][ref2]
      zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel3
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '3'
  - number: 2.3.10
    text: |-
      Burgemeester en wethouders dragen zorg voor het uitvoeren van de maatregelen of werken, bedoeld in het tweede lid,
      onderdelen a en b, binnen een in het bestemmingsplan te noemen termijn.
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.3
  - number: 2.3.11
    text: |-
      Werken opgenomen in het bestemmingsplan worden aangemerkt als openbare werken van algemeen nut in de zin van de
      [Belemmeringenwet Privaatrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001936
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0001936
  - number: 2.3.12
    text: |-
      Indien voor de uitvoering van werken als bedoeld in het tweede lid, onderdelen a en b, toepassing van de
      [Belemmeringenwet Privaatrecht][ref1] noodzakelijk is, geldt in plaats van [artikel 4 van die wet][ref2] dat de
      werking van een besluit als bedoeld in [artikel 2, vijfde lid][ref3], of [artikel 3, tweede lid, van die wet][ref4]
      wordt opgeschort totdat de beroepstermijn is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0001936
      [ref2]: https://wetten.overheid.nl/BWBR0001936#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0001936#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0001936#Artikel3
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0001936
      - id: ref2
        bwb_id: BWBR0001936
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0001936
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0001936
        artikel: '3'
  - number: 2.3.13
    text: |-
      Voor zover een besluit als bedoeld in het achtste lid zijn grondslag vindt in een bestemmingsplan, kunnen de
      gronden in beroep daarop geen betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.3
  - number: 2.3a
    text: |-
      [Artikel 2.3][ref1] is van overeenkomstige toepassing op een provinciaal inpassingsplan dat betrekking heeft op
      gronden die gelegen zijn binnen een ontwikkelingsgebied als bedoeld in [artikel 2.2][ref2] met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0027431#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0027431#Artikel2
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.3a
