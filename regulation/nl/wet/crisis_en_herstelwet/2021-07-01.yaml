        artikel: '2'
        hoofdstuk: '2'
        afdeling: '1'
  - number: 2.3a.a
    text: 'in plaats van «bestemmingsplan» telkens wordt gelezen: inpassingsplan;'
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.3a
  - number: 2.3a.b
    text: 'in plaats van «burgemeester en wethouders» telkens wordt gelezen: gedeputeerde staten;'
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.3a
  - number: 2.3a.c
    text: 'in het tweede lid in plaats van «de gemeenteraad» wordt gelezen: provinciale staten;'
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.3a
  - number: 2.3a.d
    text: 'in het zesde lid in plaats van «Burgemeester en wethouders» wordt gelezen: Gedeputeerde staten;'
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.3a
  - number: 2.3a.e
    text: 'in het tiende lid in plaats van «gemeente» wordt gelezen: provincie.'
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.3a
