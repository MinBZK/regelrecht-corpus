        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0024779
        paragraaf: '3.4'
  - number: 2.3.3.c
    text: |-
      burgemeester en wethouders categorieën van gevallen aanwijzen waarin geen verklaring van geen bedenkingen als
      bedoeld in onderdeel b, onder 1°, is vereist.
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.3
  - number: 2.3.4
    text: |-
      Voor zover ten aanzien van een activiteit met betrekking tot een inrichting die
      plaatsvindt binnen het ontwikkelingsgebied geen omgevingsvergunning als bedoeld in
      [artikel 2.1, eerste lid, aanhef en onder e, van de Wet algemene bepalingen omgevingsrecht][ref1] is vereist,
      kunnen burgemeester en wethouders ambtshalve in het belang van de optimalisering van de milieugebruiksruimte
      binnen het ontwikkelingsgebied voorschriften stellen, die afwijken van de voor die activiteit bij of krachtens
      [artikel 8.40 van de Wet milieubeheer][ref2] gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
  - number: 2.3.5
    text: |-
      Met de bevoegdheden, bedoeld in het derde en vierde lid, kunnen rechten, die worden ontleend aan voorschriften
      in een omgevingsvergunning of aan regels gesteld krachtens [artikel 8.40 van de Wet milieubeheer][ref1], worden
      gewijzigd ter optimalisering van de milieugebruiksruimte, voor zover van die rechten bij het in werking hebben van
      een inrichting:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
  - number: 2.3.5.a
    text: gedurende een periode van drie jaar onder normale bedrijfsomstandigheden geen gebruik is gemaakt of
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.3
  - number: 2.3.5.b
    text: |-
      naar redelijke verwachting, rekeninghoudend met de binnen afzienbare tijd te verwachten wijzigingen of
      uitbreidingen van de inrichting of van de in de inrichting gebezigde werkwijzen, geen gebruik zal worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.3
  - number: 2.3.6
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld, zo nodig per aangewezen
      ontwikkelingsgebied, over de wijze waarop de optimalisering van de milieugebruiksruimte kan plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.3
  - number: 2.3.7
    text: |-
      Met inachtneming van desbetreffende bindende besluiten van de Raad van de Europese Unie, van het Europees Parlement
      en de Raad gezamenlijk of van de Commissie van de Europese Gemeenschappen, kan het bestemmingsplan bestemmingen
      aanwijzen, regels stellen of maatregelen en werken toestaan in afwijking van bij algemene maatregel van bestuur
      aangegeven bepalingen bij of krachtens:
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.3
  - number: 2.3.7.a
    text: |-
      de [Wet natuurbescherming][ref1];


