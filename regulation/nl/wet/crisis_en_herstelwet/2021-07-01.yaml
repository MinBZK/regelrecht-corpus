preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is bijzondere wettelijke voorzieningen te treffen voor een
    versnelde ontwikkeling en verwezenlijking van ruimtelijke en infrastructurele projecten, teneinde bij te dragen aan
    de bestrijding van de economische crisis alsmede met dat doel diverse wettelijke bepalingen te wijzigen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#ArtikelAanhef
articles:
  - number: 1.1.1
    text: |-
      [Afdeling 2][ref1] is van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0027431#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0027431
        hoofdstuk: '1'
        afdeling: '2'
  - number: 1.1.1.a
    text: |-
      alle besluiten die krachtens enig wettelijk voorschrift zijn vereist voor de ontwikkeling of verwezenlijking van de
      in [bijlage I][ref1] bij deze wet bedoelde categorieën ruimtelijke en infrastructurele projecten dan wel voor de in
      [bijlage II][ref2] bij deze wet bedoelde ruimtelijke en infrastructurele projecten;


      [ref1]: https://wetten.overheid.nl/BWBR0027431
      [ref2]: https://wetten.overheid.nl/BWBR0027431
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0027431
      - id: ref2
        bwb_id: BWBR0027431
  - number: 1.1.1.b
    text: |-
      bestemmingsplannen als bedoeld in [artikel 2.3, eerste lid][ref1], alsmede de voor de uitvoering van de projecten
      waarop die bestemmingsplannen betrekking hebben vereiste besluiten en de voor de uitvoering van maatregelen of
      werken als bedoeld in artikel 2.3, tweede lid, onderdelen b en c, vereiste besluiten, en


      [ref1]: https://wetten.overheid.nl/BWBR0027431#Artikel2
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0027431
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '1'
  - number: 1.1.1.c
    text: |-
      projectuitvoeringsbesluiten als bedoeld in [artikel 2.10, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027431#Artikel2
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0027431
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '6'
  - number: 1.1.2
    text: |-
      [Afdeling 3][ref1] is van toepassing op de in [bijlage II][ref2] bij deze wet bedoelde ruimtelijke en
      infrastructurele projecten en op krachtens [artikel 2.18][ref3] aangewezen projecten.


      [ref1]: https://wetten.overheid.nl/BWBR0027431#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0027431
      [ref3]: https://wetten.overheid.nl/BWBR0027431#Artikel2
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0027431
        hoofdstuk: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0027431
      - id: ref3
        bwb_id: BWBR0027431
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '7'
  - number: '1.2'
    text: |-
      Bij algemene maatregel van bestuur op de voordracht van Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties, in overeenstemming met Onze Minister of Onze Ministers wie het mede aangaat, kunnen
      categorieën van ruimtelijke en infrastructurele projecten worden toegevoegd aan [bijlage I][ref1] bij deze wet en
      kunnen ruimtelijke en infrastructurele projecten worden toegevoegd aan [bijlage II][ref2] bij deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0027431
      [ref2]: https://wetten.overheid.nl/BWBR0027431
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel1.2
    references:
      - id: ref1
        bwb_id: BWBR0027431
      - id: ref2
        bwb_id: BWBR0027431
  - number: '1.3'
    text: |-
      [Artikel 3:9 van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing op onderzoeken die aan een
      besluit ten grondslag zijn gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel1.3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '1.4'
    text: |-
      In afwijking van [artikel 8:1 van de Algemene wet bestuursrecht][ref1] kan een niet tot de centrale overheid
      behorende rechtspersoon die krachtens publiekrecht is ingesteld of een niet tot de centrale overheid behorend
      bestuursorgaan geen beroep instellen tegen een besluit van een tot de centrale overheid behorend bestuursorgaan,
      indien dat besluit niet is gericht tot die rechtspersoon of tot een orgaan van die rechtspersoon, onderscheidenlijk
      tot dat bestuursorgaan of tot de rechtspersoon waartoe dat bestuursorgaan behoort.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel1.4
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 1.6.1
    text: |-
      De bestuursrechter behandelt het beroep met toepassing van [afdeling 8.2.3 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling8.2.3
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel1.6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 8.2.3
  - number: 1.6.2
    text: |-
      In afwijking van [artikel 6:6 van de Algemene wet bestuursrecht][ref1] is het beroep niet-ontvankelijk indien niet
      is voldaan aan [artikel 6:5, eerste lid, onderdeel d, van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel1.6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '6'
  - number: 1.6.3
    text: |-
      Indien de bestuursrechter het advies van de Stichting advisering bestuursrechtspraak inwint, brengt de Stichting
      binnen twee maanden na het verzoek advies uit.
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel1.6
  - number: 1.6.4
    text: De bestuursrechter doet uitspraak binnen zes maanden na afloop van de beroepstermijn.
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel1.6
  - number: 1.6a
    text: Na afloop van de termijn voor het instellen van beroep kunnen geen beroepsgronden meer worden aangevoerd.
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel1.6a
  - number: 1.7.1
    text: |-
      [Artikel 1.6, vierde lid][ref1], is niet van toepassing, indien [artikel 8:51a][ref2] of
      [8:51d van de Algemene wet bestuursrecht][ref3] wordt toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0027431#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel1.7
    references:
      - id: ref1
        bwb_id: BWBR0027431
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2.4'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 1.7.2
    text: 'In dat geval doet de bestuursrechter:'
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel1.7
  - number: 1.7.2.a
    text: binnen zes maanden na afloop van de beroepstermijn een tussenuitspraak, en
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel1.7
  - number: 1.7.2.b
    text: binnen zes maanden na de verzending van de tussenuitspraak een einduitspraak.
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel1.7
  - number: 1.8.1
    text: |-
      [Artikel 1.6, vierde lid][ref1], is niet van toepassing, indien de bestuursrechter met toepassing van artikel 234
      van het Verdrag tot oprichting van de Europese Gemeenschap prejudiciële vragen stelt.


      [ref1]: https://wetten.overheid.nl/BWBR0027431#Artikel1
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel1.8
    references:
      - id: ref1
        bwb_id: BWBR0027431
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2.4'
        afdeling: '2'
  - number: 1.8.2
    text: In dat geval worden de vragen binnen zes maanden na afloop van de beroepstermijn bij tussenuitspraak gesteld.
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel1.8
  - number: 1.8.3
    text: |-
      In de tussenuitspraak beslist de rechter zoveel mogelijk ook op de beroepsgronden die niet door de vragen worden
      geraakt.
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel1.8
  - number: 1.8.4
    text: |-
      Tegen een tussenuitspraak van de rechtbank kan hoger beroep worden ingesteld tegelijk met het hoger beroep tegen
      de einduitspraak.
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel1.8
  - number: 1.9a
    text: |-
      De [artikelen 1.6 tot en met 1.8][ref1] zijn van overeenkomstige toepassing in hoger beroep.


      [ref1]: https://wetten.overheid.nl/BWBR0027431#Artikel1
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel1.9a
    references:
      - id: ref1
        bwb_id: BWBR0027431
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2.4'
        afdeling: '2'
  - number: 1.10.1
    text: |-
      Indien een bestuursorgaan na vernietiging van een besluit door de bestuursrechter een nieuw besluit moet nemen, kan
      het dat besluit baseren op de feiten waarop het vernietigde besluit berustte, behoudens voor zover de onjuistheid
      of het onvoldoende vast staan van deze feiten een grond voor de vernietiging was.
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel1.10
  - number: 1.10.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing indien een nieuw besluit wordt genomen ter uitvoering van een
      tussenuitspraak als bedoeld in [artikel 8:80a van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel1.10
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 1.11.1
    text: |-
      Indien op grond van [artikel 7.2 van de Wet milieubeheer][ref1] een milieueffectrapport wordt opgesteld ten behoeve
      van een besluit, is [artikel 7.23, eerste lid, aanhef en onder d, van die wet][ref2] niet van toepassing voor zover
      het de locatie of het tracé van de activiteit betreft als er aan dat besluit een plan als bedoeld in artikel 7.2,
      tweede lid, van de Wet milieubeheer ten grondslag ligt waarin een locatie of een tracé is aangewezen en voor dat
      plan een milieueffectrapport is gemaakt waarin alternatieven voor die locatie of dat tracé zijn onderzocht.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel1.11
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '7'
  - number: 1.11.2
    text: |-
      In afwijking van [artikel 7.32, vijfde lid, van de Wet milieubeheer][ref1] kan het bevoegd gezag de Commissie voor
      de milieueffectrapportage, bedoeld in [artikel 2.17 van die wet][ref2], in de gelegenheid stellen advies uit te
      brengen over het milieueffectrapport.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel2
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel1.11
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '2'
  - number: 2.1.1
    text: 'In deze afdeling en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.1
  - number: 2.1.1.a
    text: |-
      *milieugebruiksruimte:* binnen een ontwikkelingsgebied aanwezige marge tussen de bestaande milieukwaliteit en de
      voor dat gebied geldende milieukwaliteitsnormen, die kan worden benut voor milieubelastende activiteiten;
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.1
  - number: 2.1.1.b
    text: |-
      *milieukwaliteitsnorm:* bij wettelijk voorschrift gestelde norm ten aanzien van de kwaliteit van een onderdeel van
      het milieu.
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.1
  - number: 2.1.2
    text: |-
      In deze afdeling en de daarop berustende bepalingen wordt onder bestemmingsplan mede verstaan: de bij het
      bestemmingsplan behorende toelichting dan wel het exploitatieplan.
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.1
  - number: '2.2'
    text: |-
      Bij regeling van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, in overeenstemming met Onze Minister
      of Onze Ministers wie het mede aangaat, kan bij wijze van experiment een gebied, zijnde bestaand stedelijk gebied,
      bestaand bedrijventerrein of gebied ter uitbreiding van de haven van Rotterdam, voor de duur van ten hoogste
      tien jaar worden aangewezen als ontwikkelingsgebied, indien dat met het oog op het versterken van de duurzame
      ruimtelijke en economische ontwikkeling van dat gebied bijzonder aangewezen is.
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.2
  - number: 2.3.1
    text: |-
      Een bestemmingsplan dat betrekking heeft op gronden die gelegen zijn binnen een aangewezen ontwikkelingsgebied
      als bedoeld in [artikel 2.2][ref1], is gericht op de optimalisering van de milieugebruiksruimte met het oog op het
      versterken van een duurzame ruimtelijke en economische ontwikkeling van dat gebied in samenhang met het tot stand
      brengen van een goede milieukwaliteit.


      [ref1]: https://wetten.overheid.nl/BWBR0027431#Artikel2
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0027431
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '1'
  - number: 2.3.2
    text: |-
      Tenzij bij algemene maatregel van bestuur anders is bepaald, bevat een bestemmingsplan als bedoeld in het eerste
      lid:
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.3
  - number: 2.3.2.a
    text: |-
      de voorgenomen maatregelen, projecten en werken ten behoeve van de optimalisering van de milieugebruiksruimte
      binnen het ontwikkelingsgebied;
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.3
  - number: 2.3.2.b
    text: |-
      de noodzakelijke maatregelen, projecten en werken ter compensatie van het beslag op de milieugebruiksruimte door de
      in het bestemmingsplan voorziene ruimtelijke ontwikkelingen;
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.3
  - number: 2.3.2.c
    text: |-
      zo nodig een fasering en koppeling bij de tenuitvoerlegging van de in de onderdelen a en b bedoelde maatregelen,
      projecten en werken;
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.3
  - number: 2.3.2.d
    text: |-
      een raming van de kosten van uitvoering van het bestemmingsplan, een beschrijving van de wijze waarop daarin zal
      worden voorzien, alsmede een beschrijving van de wijze waarop het bereiken van de met het bestemmingsplan beoogde
      resultaten zal worden nagestreefd;
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.3
  - number: 2.3.2.e
    text: |-
      een overzicht van de tijdstippen waarop burgemeester en wethouders aan de gemeenteraad een rapportage uitbrengen
      over de voortgang en de uitvoering van de in de onderdelen a en b bedoelde maatregelen, projecten en werken, die op
      verzoek tevens wordt verstrekt aan Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.3
  - number: 2.3.3
    text: |-
      Ten aanzien van een activiteit met betrekking tot een inrichting als bedoeld in
      [artikel 2.1, eerste lid, onder e, van de Wet algemene bepalingen omgevingsrecht][ref1], die plaatsvindt binnen
      het ontwikkelingsgebied, kan of kunnen in het belang van de optimalisering van de milieugebruiksruimte binnen het
      ontwikkelingsgebied:


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 2.3.3.a
    text: |-
      in het geval dat burgemeester en wethouders ingevolge
      [artikel 2.4, eerste lid, van de Wet algemene bepalingen omgevingsrecht][ref1] het bevoegd gezag zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 2.3.3.a.1°
    text: |-
      onverminderd [artikel 2.22, tweede lid, eerste volzin, van die wet][ref1] voorschriften worden verbonden aan de
      omgevingsvergunning voor die activiteit;


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 2.3.3.a.2°
    text: |-
      in afwijking van [artikel 2.31, tweede lid, onderdeel b][ref1], en met toepassing van
      [paragraaf 3.4 van die wet][ref2] voorschriften van de omgevingsvergunning voor die activiteit worden gewijzigd,
      waarbij de [artikelen 2.31a][ref3] en [4.2 van die wet][ref4] van overeenkomstige toepassing zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Paragraaf3.4
      [ref3]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0024779#Artikel4
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0024779
        paragraaf: '3.4'
      - id: ref3
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0024779
        artikel: '4'
  - number: 2.3.3.b
    text: |-
      in het geval dat ingevolge
      [artikel 2.4, tweede, derde of vierde lid, van de Wet algemene bepalingen omgevingsrecht][ref1] een ander
      bestuursorgaan het bevoegde gezag is:


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 2.3.3.b.1°
    text: |-
      een omgevingsvergunning voor die activiteit niet worden verleend dan nadat burgemeester en wethouders hebben
      verklaard dat zij daartegen geen bedenkingen hebben, waarbij geldt dat:
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.3
  - number: 2.3.3.b.1°.aa
    text: |-
      de verklaring slechts kan worden geweigerd in het belang van de optimalisering van de milieugebruiksruimte binnen
      het ontwikkelingsgebied;
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.3
  - number: 2.3.3.b.1°.bb
    text: |-
      de [artikelen 2.27, tweede, vierde en vijfde lid][ref1], [3.11][ref2] en [4.2 van die wet][ref3] van
      overeenkomstige toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0024779#Artikel4
