  - number: 5.3.1
    text: |-
      De [artikelen 1.4][ref1] en [1.6 tot en met 1.9][ref2] zijn niet van toepassing indien beroep wordt ingesteld tegen
      een besluit dat is bekendgemaakt voor het tijdstip van inwerkingtreding van deze wet, dan wel hoger beroep wordt
      ingesteld tegen een uitspraak die voor dat tijdstip is bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0027431#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0027431#Artikel1
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel5.3
    references:
