        artikel: '2'
      - id: ref9
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 2.10.3
    text: |-
      Het projectuitvoeringsbesluit strekt ter gehele of gedeeltelijke vervanging van de besluiten die vereist zouden
      zijn geweest krachtens de in het tweede lid bedoelde wettelijke voorschriften.
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.10
  - number: 2.10.4
    text: |-
      Uit het projectuitvoeringsbesluit en de daarbij behorende toelichting blijkt welke gevolgen aan de uitvoering
      zijn verbonden en op welke wijze rekening is gehouden met de daarbij betrokken belangen, waaronder in elk geval
      de belangen ter bescherming waarvan de wettelijke voorschriften strekken die ingevolge het tweede lid niet van
      toepassing zijn en, voor zover van toepassing, [hoofdstuk V, paragraaf 1, van de Monumentenwet 1988][ref1] zoals
      van toepassing op grond van [artikel 9.1, eerste lid, van de Erfgoedwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Paragraaf1
      [ref2]: https://wetten.overheid.nl/BWBR0037521#Artikel9
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0004471
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0037521
        artikel: '9'
  - number: 2.10.5
    text: |-
      Bij een projectuitvoeringsbesluit worden de bij of krachtens wet of verordening vastgestelde toetsingskaders
      toegepast en normen in acht genomen. Voor zover de wet of verordening afwijking van die toetsingskaders of normen
      toestaat, kan het projectuitvoeringsbesluit daarin voorzien.
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.10
  - number: 2.10.6
    text: |-
      Aan het projectuitvoeringsbesluit kunnen ter bescherming van de in het vierde lid bedoelde belangen voorschriften
      worden verbonden.
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.10
  - number: 2.10.7
    text: |-
      Indien een projectuitvoeringsbesluit er toe strekt een vergunning als
      bedoeld in [artikel 11 van de Monumentenwet 1988][ref1] zoals van toepassing
      op grond van [artikel 9.1, eerste lid, van de Erfgoedwet][ref2] of
      [artikel 2.1, eerste lid, onderdeel f, van de Wet algemene bepalingen omgevingsrecht][ref3] te vervangen:


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0037521#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0037521
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 2.10.7.a
    text: |-
      leggen burgemeester en wethouders, indien het een archeologisch monument betreft als bedoeld in de
      [Erfgoedwet][ref1] en in de gevallen waarin Onze Minister van Onderwijs, Cultuur en Wetenschap op grond van de
      [Wet algemene bepalingen omgevingsrecht][ref2] adviseert, het voornemen tot een projectuitvoeringsbesluit voor
      advies voor aan Onze Minister van Onderwijs, Cultuur en Wetenschap die binnen vier weken na ontvangst van de
      gegevens, bedoeld in [artikel 3:7 van de Algemene wet bestuursrecht][ref3], advies uitbrengt, en


      [ref1]: https://wetten.overheid.nl/BWBR0037521
      [ref2]: https://wetten.overheid.nl/BWBR0024779
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0037521
      - id: ref2
        bwb_id: BWBR0024779
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 2.10.7.b
    text: |-
      zenden burgemeester en wethouders aan Onze Minister van Onderwijs, Cultuur en Wetenschap en, voorzover het monument
      gelegen is buiten de bebouwde kom, aan gedeputeerde staten:
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.10
  - number: 2.10.7.b.1°
    text: het ontwerpbesluit, en
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.10
  - number: 2.10.7.b.2°
    text: onmiddellijk na de vaststelling een afschrift van het projectuitvoeringsbesluit.
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.10
  - number: 2.10.8
    text: |-
      Indien een projectuitvoeringsbesluit betrekking heeft op een beschermd stads- of dorpsgezicht als bedoeld in
      [artikel 1, onderdeel g, van de Monumentenwet 1988][ref1] zoals die wet luidde voor inwerkingtreding van de
      [Erfgoedwet][ref2] zenden burgemeester en wethouders onmiddellijk na de vaststelling hiervan een afschrift aan Onze
      Minister van Onderwijs, Cultuur en Wetenschap.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0037521
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0037521
  - number: 2.10.9
    text: |-
      Het tweede lid en het vijfde lid, tweede volzin, zijn niet van toepassing op de wettelijke voorschriften
      die zijn gesteld bij of krachtens de [Wet luchtvaart][ref1], de [Luchtvaartwet][ref2] en de
      __REF002___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      _______________________________________________________________________________ (Stb. 561)
      omtrent ruimtelijke beperkingen in de omgeving van luchthavens in verband met geluidbelasting,
      externe veiligheid en vliegveiligheid. Voor de toepassing van de [Wet luchtvaart][ref4] wordt het
      projectuitvoeringsbesluit gelijkgesteld aan een omgevingsvergunning waarbij met toepassing van
      [artikel 2.12, eerste lid, onder a, onder 3°, van de Wet algemene bepalingen omgevingsrecht][ref5] van het
      bestemmingsplan wordt afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0005555
      [ref2]: https://wetten.overheid.nl/BWBR0002267
      [ref3]: https://wetten.overheid.nl/BWBR0024928
      [ref4]: https://wetten.overheid.nl/BWBR0005555
      [ref5]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0005555
      - id: ref2
        bwb_id: BWBR0002267
      - id: ref3
        bwb_id: BWBR0024928
      - id: ref4
        bwb_id: BWBR0005555
      - id: ref5
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 2.10a
    text: |-
      Indien sprake is van provinciale belangen, kunnen provinciale staten ten behoeve van de verwezenlijking van een
      project als bedoeld in [artikel 2.9, eerste lid][ref1], of van een onderdeel daarvan, een projectuitvoeringsbesluit
      vaststellen. Indien toepassing is gegeven aan de eerste volzin, is deze afdeling van overeenkomstige toepassing,
      met dien verstande dat burgemeester en wethouders uitvoering geven aan het bepaalde in [artikel 2.17][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0027431#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0027431#Artikel2
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.10a
    references:
      - id: ref1
        bwb_id: BWBR0027431
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0027431
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '6'
  - number: '2.11'
    text: |-
      Op de voorbereiding van de beslissing tot vaststelling van het projectuitvoeringsbesluit, is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing. Zienswijzen kunnen naar voren worden
      gebracht door een ieder.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.11
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '2.12'
    text: |-
      Voor zover het projectuitvoeringsbesluit niet in overeenstemming is met het bestemmingsplan of een
      beheersverordening, geldt het projectuitvoeringsbesluit als een omgevingsvergunning waarbij met toepassing van
      [artikel 2.12, eerste lid, onder a, onder 3°, van de Wet algemene bepalingen omgevingsrecht][ref1] van het
      bestemmingsplan, het inpassingsplan of de beheersverordening wordt afgeweken. Deze vergunning kan pas worden
      verleend als de gemeenteraad heeft verklaard daartegen geen bedenkingen te hebben. De [artikelen 2.27][ref2] en
      [2.28 van de Wet algemene bepalingen omgevingsrecht][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0024779
        artikel: '2'
  - number: '2.14'
    text: |-
      Een besluit als bedoeld in [artikel 2.10, eerste lid][ref1], treedt in werking daags na afloop van de
      beroepstermijn. Indien gedurende die termijn beroep wordt ingesteld, wordt de inwerkingtreding opgeschort totdat de
      Afdeling bestuursrechtspraak van de Raad van State op het beroep heeft beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0027431#Artikel2
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.14
    references:
      - id: ref1
        bwb_id: BWBR0027431
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '6'
  - number: '2.15'
    text: |-
      Van de [Wet ruimtelijke ordening][ref1] zijn van overeenkomstige toepassing:


      [ref1]: https://wetten.overheid.nl/BWBR0020449
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.15
    references:
      - id: ref1
        bwb_id: BWBR0020449
  - number: 2.15.a
    text: |-
      [artikel 3.8, zesde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.15
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 2.15.b
    text: |-
      [afdeling 6.1][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Afdeling6.1
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.15
    references:
      - id: ref1
        bwb_id: BWBR0020449
        afdeling: '6.1'
  - number: 2.15.c
    text: |-
      [afdeling 6.4][ref1], met dien verstande dat voor aanvang van de bouw van bouwplannen als bedoeld in
      [artikel 6.12, eerste lid, van die wet][ref2] een melding aan burgemeester en wethouders wordt gedaan en dat
      burgemeester en wethouders een beschikking met de inhoud van [artikel 6.17 van die wet][ref3] geven bij de start
      van de bouw, gericht aan een eigenaar van gronden waarop gebouwd wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Afdeling6.4
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel6
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.15
    references:
      - id: ref1
        bwb_id: BWBR0020449
        afdeling: '6.4'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0020449
        artikel: '6'
  - number: '2.16'
    text: Het is verboden in strijd te handelen met een projectuitvoeringsbesluit of een daaraan verbonden voorschrift.
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.16
  - number: '2.17'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze afdeling zijn belast de bij besluit van
      burgemeester en wethouders aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.17
  - number: '2.18'
    text: |-
      Deze afdeling is van toepassing op bij regeling van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties,
      in overeenstemming met Onze Minister of Onze Ministers wie het mede aangaat, aangewezen lokale en (boven)regionale
      projecten met nationale betekenis.
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.18
  - number: 2.19.1
    text: |-
      Ten aanzien van een krachtens [artikel 2.18][ref1] aangewezen lokaal project
      met nationale betekenis stelt de gemeenteraad een structuurvisie als bedoeld in
      [artikel 2.1, eerste of derde lid, van de Wet ruimtelijke ordening][ref2] vast.


      [ref1]: https://wetten.overheid.nl/BWBR0027431#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel2
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.19
    references:
      - id: ref1
        bwb_id: BWBR0027431
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '7'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '2'
  - number: 2.19.2
    text: |-
      De structuurvisie, bedoeld in het eerste lid, bevat onverminderd het elders omtrent de inhoud van een
      structuurvisie bepaalde, tevens:
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.19
  - number: 2.19.2.a
    text: een concretisering van de hoofdlijnen van de voorgenomen ontwikkeling van het betrokken gebied;
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.19
  - number: 2.19.2.b
    text: |-
      een beschrijving van de voorgestelde wijze van verwezenlijking van de voorgenomen ontwikkeling, bestaande uit in
      ieder geval de volgende onderdelen:
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.19
  - number: 2.19.2.b.1°
    text: |-
      een voorlopig overzicht van de voor de uitvoering van het project benodigde besluiten, alsmede het daarbij
      voorgenomen tijdpad;
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.19
  - number: 2.19.2.b.2°
    text: een financiële onderbouwing en een voorlopige opzet van de grondexploitatie;
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.19
  - number: 2.19.2.b.3°
    text: |-
      een analyse van de risico’s ten aanzien van verplichtingen tot het toekennen van een tegemoetkoming in schade als
      bedoeld in [afdeling 6.1 van de Wet ruimtelijke ordening][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Afdeling6.1
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.19
    references:
      - id: ref1
        bwb_id: BWBR0020449
        afdeling: '6.1'
  - number: 2.19.2.b.4°
    text: eventuele voornemens inzake verwerving van gronden;
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.19
  - number: 2.19.2.b.5°
    text: |-
      de vermelding dat ten aanzien van de voor de verwezenlijking van het project noodzakelijke besluiten ingevolge
      [artikel 2.21][ref1] toepassing zal worden gegeven aan de gemeentelijke coördinatieregeling, bedoeld in
      [paragraaf 3.6.1 van de Wet ruimtelijke ordening][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0027431#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Paragraaf3.6.1
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.19
    references:
      - id: ref1
        bwb_id: BWBR0027431
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '7'
      - id: ref2
        bwb_id: BWBR0020449
        paragraaf: 3.6.1
  - number: 2.19.2.c
    text: |-
      een samenvatting van de uitkomsten van het overeenkomstig [artikel 2.20, eerste lid][ref1], gevoerde bestuurlijk
      overleg.


      [ref1]: https://wetten.overheid.nl/BWBR0027431#Artikel2
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.19
    references:
      - id: ref1
        bwb_id: BWBR0027431
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '7'
  - number: 2.19.3
    text: |-
      Indien reeds een structuurvisie is vastgesteld, is het eerste lid niet van toepassing en wordt die structuurvisie
      voor zover nodig aangevuld met de in het tweede lid genoemde onderdelen. [Artikel 2.20][ref1] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0027431#Artikel2
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.19
    references:
      - id: ref1
        bwb_id: BWBR0027431
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '7'
  - number: 2.19a.1
    text: |-
      Ten aanzien van een krachtens [artikel 2.18][ref1] aangewezen (boven)regionaal project
      met nationale betekenis stellen provinciale staten een structuurvisie als bedoeld in
      [artikel 2.2, eerste of derde lid, van de Wet ruimtelijke ordening][ref2] vast.


      [ref1]: https://wetten.overheid.nl/BWBR0027431#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel2
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.19a
    references:
      - id: ref1
        bwb_id: BWBR0027431
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '7'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '2'
  - number: 2.19a.2
    text: 'Op projecten als bedoeld in het eerste lid is deze afdeling van overeenkomstige toepassing, met dien verstande dat:'
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.19a
  - number: 2.19a.2.a
    text: |-
      in de [artikelen 2.19, tweede lid, onder b, onder 5°][ref1], en [2.21][ref2] in plaats van «de gemeentelijke
      coördinatieregeling, bedoeld in [paragraaf 3.6.1 van de Wet ruimtelijke ordening][ref3]» wordt gelezen: de
      provinciale coördinatieregeling, bedoeld in [paragraaf 3.6.2 van de Wet ruimtelijke ordening][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0027431#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0027431#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Paragraaf3.6.1
      [ref4]: https://wetten.overheid.nl/BWBR0020449#Paragraaf3.6.2
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.19a
    references:
      - id: ref1
        bwb_id: BWBR0027431
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '7'
      - id: ref2
        bwb_id: BWBR0027431
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '7'
      - id: ref3
        bwb_id: BWBR0020449
        paragraaf: 3.6.1
      - id: ref4
        bwb_id: BWBR0020449
        paragraaf: 3.6.2
  - number: 2.19a.2.b
    text: |-
      in [artikel 2.20, eerste lid][ref1], in plaats van «die diensten van provincie en Rijk» wordt gelezen: die diensten
      van Rijk;


      [ref1]: https://wetten.overheid.nl/BWBR0027431#Artikel2
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.19a
    references:
      - id: ref1
        bwb_id: BWBR0027431
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '7'
  - number: 2.19a.2.c
    text: |-
      in [artikel 2.20, derde lid][ref1], in plaats van «de eerstverantwoordelijke gemeente» wordt gelezen: de
      eerstverantwoordelijke provincie;


      [ref1]: https://wetten.overheid.nl/BWBR0027431#Artikel2
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.19a
    references:
      - id: ref1
        bwb_id: BWBR0027431
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '7'
  - number: 2.19a.2.d
    text: |-
      in [artikel 2.21][ref1] in plaats van «In afwijking van
      [artikel 3.30, eerste lid, van de Wet ruimtelijke ordening][ref2]» wordt gelezen: In afwijking van
      [artikel 3.33, eerste lid, van de Wet ruimtelijke ordening][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0027431#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.19a
    references:
      - id: ref1
        bwb_id: BWBR0027431
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '7'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 2.19a.2.e
    text: |-
      in [artikel 2.22][ref1] in plaats van «een gemeentelijke verordening» wordt gelezen: een provinciale of
      gemeentelijke verordening;


      [ref1]: https://wetten.overheid.nl/BWBR0027431#Artikel2
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.19a
    references:
      - id: ref1
        bwb_id: BWBR0027431
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '7'
  - number: 2.19a.2.f
    text: |-
      in [artikel 2.23, eerste lid][ref1], in plaats van «[artikel 3.10][ref2]» wordt gelezen «[artikel 3.27][ref3]», in
      plaats van «kan de gemeenteraad» wordt gelezen «kunnen provinciale staten» en in plaats van «gemeentebestuur» wordt
      gelezen: provinciebestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0027431#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.19a
    references:
      - id: ref1
        bwb_id: BWBR0027431
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '7'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 2.20.1
    text: |-
      Bij de voorbereiding van een structuurvisie als bedoeld in [artikel 2.19, eerste lid][ref1], plegen burgemeester en
      wethouders overleg met de besturen van de betrokken gemeenten en waterschappen en met die diensten van provincie en
      Rijk die betrokken zijn bij de zorg voor de ruimtelijke ordening of belast zijn met de behartiging van belangen die
      in de structuurvisie in het geding zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0027431#Artikel2
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.20
    references:
      - id: ref1
        bwb_id: BWBR0027431
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '7'
  - number: 2.20.2
    text: |-
      In afwijking van [hoofdstuk 2 van de Wet ruimtelijke ordening][ref1], worden, voor zover het overleg, bedoeld
      in het eerste lid, leidt tot vaststelling van een structuurvisie waarmee de bestuursorganen van de betrokken
      gemeenten, waterschappen, provincie en Rijk instemmen, aan die structuurvisie verklaringen gehecht houdende
      instemming van die bestuursorganen met de in de structuurvisie voorgestelde wijze van verwezenlijking van de
      voorgenomen ontwikkeling.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.20
    references:
      - id: ref1
        bwb_id: BWBR0020449
        hoofdstuk: '2'
  - number: 2.20.3
    text: |-
      Ter uitvoering van de in de structuurvisie voorgestelde wijze van verwezenlijking van de voorgenomen ontwikkeling
      wordt ten behoeve van een goede begeleiding en tijdige afronding van het project een projectcommissie ingesteld.
      In de commissie zijn de betrokken bestuursorganen, bedoeld in het tweede lid, vertegenwoordigd. De commissie staat
      onder voorzitterschap van een bestuurder van de eerstverantwoordelijke gemeente.
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.20
  - number: '2.21'
    text: |-
      In afwijking van [artikel 3.30, eerste lid, van de Wet ruimtelijke ordening][ref1] wordt ten aanzien van op
      aanvraag of ambtshalve te nemen besluiten die noodzakelijk zijn voor de verwezenlijking van een krachtens
      [artikel 2.18][ref2] aangewezen project, toepassing gegeven aan de gemeentelijke coördinatieregeling, bedoeld in
      [paragraaf 3.6.1 van de Wet ruimtelijke ordening][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0027431#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Paragraaf3.6.1
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.21
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0027431
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '7'
      - id: ref3
        bwb_id: BWBR0020449
        paragraaf: 3.6.1
  - number: '2.22'
    text: |-
      Voor zover de verwezenlijking van een krachtens [artikel 2.18][ref1] aangewezen project onevenredig wordt belemmerd
      door bepalingen die, al dan niet krachtens de wet, bij of krachtens een gemeentelijke verordening zijn vastgesteld,
      kunnen die bepalingen bij het nemen en uitvoeren van de besluiten, bedoeld in [artikel 2.21][ref2], om dringende
      redenen buiten toepassing worden gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0027431#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0027431#Artikel2
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.22
    references:
      - id: ref1
        bwb_id: BWBR0027431
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '7'
      - id: ref2
        bwb_id: BWBR0027431
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '7'
  - number: 2.23.1
    text: |-
      Indien voor de verwezenlijking van een krachtens [artikel 2.18][ref1]
      aangewezen project een omgevingsvergunning waarbij met toepassing van
      [artikel 2.12, eerste lid, onder a, onder 3°, van de Wet algemene bepalingen omgevingsrecht][ref2] van het
      bestemmingsplan, het inpassingsplan of de beheersverordening wordt afgeweken, wordt verleend, kan de gemeenteraad
      met het oog op de invordering van rechten terzake van door of vanwege het gemeentebestuur verstrekte diensten die
      verband houden met die omgevingsvergunning aan die omgevingsvergunning voorschriften verbinden, die de verplichting
      inhouden dat financiële zekerheid wordt gesteld voor het nakomen van de ingevolge die vergunning verschuldigde
      rechten.


      [ref1]: https://wetten.overheid.nl/BWBR0027431#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.23
    references:
      - id: ref1
        bwb_id: BWBR0027431
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '7'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 2.23.2
    text: |-
      Indien toepassing wordt gegeven aan het eerste lid, wordt in ieder geval het bedrag aangegeven waarvoor de
      zekerheid in stand moet worden gehouden.
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.23
  - number: 2.23.3
    text: |-
      Bij de vergunning kunnen voorschriften worden gesteld voor gevallen waarin aan de verplichting uitvoering wordt
      gegeven door het sluiten en in stand houden van een verzekering. Daarbij wordt rekening gehouden met hetgeen
      redelijkerwijs door verzekering kan worden gedekt.
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel2.23
  - number: 5.1.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur op de voordracht van Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties, in overeenstemming met Onze Minister of Onze Ministers wie het mede aangaat, kunnen regels
      worden gegeven gericht op:
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel5.1
  - number: 5.1.1.a
    text: een versnelling van de ontwikkeling en verwezenlijking van ruimtelijke en infrastructurele projecten, en
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel5.1
  - number: 5.1.1.b
    text: een goede uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel5.1
  - number: 5.1.2
    text: |-
      Het bij of krachtens de algemene maatregel van bestuur, bedoeld in het eerste lid, bepaalde is slechts van
      toepassing op:
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel5.1
  - number: 5.1.2.a
    text: |-
      de projecten en categorieën van projecten, genoemd in de [bijlagen I][ref1] en [II][ref2] bij deze wet;


      [ref1]: https://wetten.overheid.nl/BWBR0027431
      [ref2]: https://wetten.overheid.nl/BWBR0027431
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0027431
      - id: ref2
        bwb_id: BWBR0027431
  - number: 5.1.2.b
    text: |-
