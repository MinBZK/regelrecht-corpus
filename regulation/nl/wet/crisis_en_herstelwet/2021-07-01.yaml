  - number: 5.10.1
    text: Deze wet vervalt op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel5.10
  - number: 5.10.2
    text: |-
      Indien het eerste besluit ter uitvoering van een project waarop deze wet van toepassing was, is genomen voor
      het in het eerste lid bedoelde tijdstip blijft deze wet vanaf dat tijdstip van toepassing op latere besluiten of
      handelingen ter uitvoering van datzelfde project.
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel5.10
  - number: 5.10.3
    text: 'Deze wet blijft vanaf het in het eerste lid bedoelde tijdstip van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0027431/2021-07-01#Artikel5.10
  - number: 5.10.3.a
