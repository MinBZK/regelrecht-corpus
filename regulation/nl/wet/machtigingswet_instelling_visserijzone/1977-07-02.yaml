$id: machtigingswet_instelling_visserijzone
regulatory_layer: WET
publication_date: '2013-12-18'
valid_from: '1977-07-02'
bwb_id: BWBR0003110
url: https://wetten.overheid.nl/BWBR0003110/1977-07-02
preamble:
  text: |-
    Wij Juliana, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het gezien de internationale ontwikkeling wenselijk is dat het
    Koninkrijk een visserijzone van maximaal twee honderd zeemijlen kan instellen;

    Zo is het, dat Wij, de Raad van State van het Koninkrijk gehoord, en met gemeen overleg der Staten-Generaal, de
    bepalingen van het Statuut voor het Koninkrijk in acht genomen zijnde, hebben goedgevonden en verstaan, gelijk Wij
    goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003110/1977-07-02#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Wij behouden Ons de bevoegdheid voor een visserijzone in te stellen in overeenstemming met het bepaalde in de
      [artikelen 2][ref1] en [3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003110#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003110#Artikel3
    url: https://wetten.overheid.nl/BWBR0003110/1977-07-02#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003110
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003110
        artikel: '3'
  - number: '2'
    text: |-
      Het Koninkrijk oefent de uitsluitende rechtsbevoegdheid ten aanzien van visserij-aangelegenheden uit in een zone
      ter breedte van ten hoogste 200 zeemijlen, gemeten van de basislijn van de territoriale zee van het Koninkrijk.
    url: https://wetten.overheid.nl/BWBR0003110/1977-07-02#Artikel2
  - number: '3'
    text: |-
      De buitengrens van de visserijzone zal worden bepaald in overeenstemming met die andere Staten van wie een
      overeenkomstige zone grenst aan die van het Koninkrijk.
    url: https://wetten.overheid.nl/BWBR0003110/1977-07-02#Artikel3
  - number: '4'
    text: |-
      1 Deze Rijkswet treedt in werking met ingang van de tweede dag na de datum van uitgifte van het *Staatsblad* waarin
      zij wordt geplaatst.

      2 Zij kan worden aangehaald als "Machtigingswet instelling visserijzone".
    url: https://wetten.overheid.nl/BWBR0003110/1977-07-02#Artikel4
