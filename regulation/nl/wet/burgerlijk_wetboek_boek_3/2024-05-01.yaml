  - number: '79'
    text: |-
      Buiten het vermogensrecht vinden de bepalingen van deze titel overeenkomstige toepassing, voor zover de aard van de
      rechtshandeling of van de rechtsbetrekking zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel79
  - number: '80.1'
    text: Men kan goederen onder algemene en onder bijzondere titel verkrijgen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel80
  - number: '80.2'
    text: |-
      Men verkrijgt goederen onder algemene titel door erfopvolging, door boedelmenging, door fusie als bedoeld
      in [artikel 309 van Boek 2][ref1], door splitsing als bedoeld in [artikel 334a van Boek 2][ref2], door
      een besluit tot overgang als bedoeld in [artikel 3A:21, eerste lid, onderdeel b][ref3], en door
      toepassing van een afwikkelingsinstrument als bedoeld in de [artikelen 3A:1, onderdelen a, b en c][ref4],
      en [3A:77, onderdelen b, c en d, van de Wet op het financieel toezicht][ref5] of artikel 27,
      eerste lid, van de verordening herstel en afwikkeling centrale tegenpartijen als bedoeld in
      [artikel 1:1 van de Wet op het financieel toezicht][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel309
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel334a
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3a
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel3a
      [ref5]: https://wetten.overheid.nl/BWBR0020368#Artikel3a
      [ref6]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '309'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: 334a
      - id: ref3
        bwb_id: BWBR0020368
        artikel: 3a
      - id: ref4
        bwb_id: BWBR0020368
        artikel: 3a
      - id: ref5
        bwb_id: BWBR0020368
        artikel: 3a
      - id: ref6
        bwb_id: BWBR0020368
        artikel: '1'
  - number: '80.3'
    text: |-
      Men verkrijgt goederen onder bijzondere titel door overdracht, door verjaring en door onteigening, en voorts op de
      overige in de wet voor iedere soort aangegeven wijzen van rechtsverkrijging.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel80
  - number: '80.4'
    text: Men verliest goederen op de voor iedere soort in de wet aangegeven wijzen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel80
  - number: '81.1'
    text: |-
      Hij aan wie een zelfstandig en overdraagbaar recht toekomt, kan binnen de grenzen van dat recht de in de wet
      genoemde beperkte rechten vestigen. Hij kan ook zijn recht onder voorbehoud van een zodanig beperkt recht
      overdragen, mits hij de voorschriften zowel voor overdracht van een zodanig goed, als voor vestiging van een
      zodanig beperkt recht in acht neemt.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel81
  - number: '81.2'
    text: 'Beperkte rechten gaan teniet door:'
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel81
  - number: 81.2.a
    text: het tenietgaan van het recht waaruit het beperkte recht is afgeleid;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel81
  - number: 81.2.b
    text: |-
      verloop van de tijd waarvoor, of de vervulling van de ontbindende voorwaarde waaronder het beperkte recht is
      gevestigd;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel81
  - number: 81.2.c
    text: afstand;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel81
  - number: 81.2.d
    text: |-
      opzegging, indien de bevoegdheid daartoe bij de wet of bij de vestiging van het recht aan de hoofdgerechtigde, aan
      de beperkt gerechtigde of aan beiden is toegekend;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel81
  - number: 81.2.e
    text: vermenging;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel81
  - number: '81.3'
    text: |-
      Afstand en vermenging werken niet ten nadele van hen die op het tenietgaande beperkte recht op hun beurt een
      beperkt recht hebben. Vermenging werkt evenmin ten voordele van hen die op het bezwaarde goed een beperkt recht
      hebben en het tenietgaande recht moesten eerbiedigen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel81
  - number: '82'
    text: Afhankelijke rechten volgen het recht waaraan zij verbonden zijn.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel82
  - number: '83.1'
    text: |-
      Eigendom, beperkte rechten en vorderingsrechten zijn overdraagbaar, tenzij de wet of de aard van het recht zich
      tegen een overdracht verzet.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel83
  - number: '83.2'
    text: |-
      De overdraagbaarheid van vorderingsrechten kan ook door een beding tussen schuldeiser en schuldenaar worden
      uitgesloten.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel83
  - number: '83.3'
    text: Alle andere rechten zijn slechts overdraagbaar, wanneer de wet dit bepaalt.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel83
  - number: '84.1'
    text: |-
      Voor overdracht van een goed wordt vereist een levering krachtens geldige titel, verricht door hem die bevoegd is
      over het goed te beschikken.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel84
  - number: '84.2'
    text: Bij de titel moet het goed met voldoende bepaaldheid omschreven zijn.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel84
  - number: '84.3'
    text: |-
      Een rechtshandeling die ten doel heeft een goed over te dragen tot zekerheid of die de strekking mist het goed na
      de overdracht in het vermogen van de verkrijger te doen vallen, is geen geldige titel van overdracht van dat goed.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel84
  - number: '84.4'
    text: |-
      Wordt ter uitvoering van een voorwaardelijke verbintenis geleverd, dan wordt slechts een recht verkregen, dat aan
      dezelfde voorwaarde als die verbintenis is onderworpen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel84
  - number: '85.1'
    text: |-
      Een verbintenis strekkende tot overdracht van een goed voor een bepaalde tijd, wordt aangemerkt als een verbintenis
      tot vestiging van een vruchtgebruik op het goed voor de gestelde tijd.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel85
  - number: '85.2'
    text: |-
      Een verbintenis strekkende tot overdracht van een goed onder opschortende tijdsbepaling, wordt aangemerkt als een
      verbintenis tot onmiddellijke overdracht van het goed met gelijktijdige vestiging van een vruchtgebruik van de
      vervreemder op het goed voor de gestelde tijd.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel85
  - number: '86.1'
    text: |-
      Ondanks onbevoegdheid van de vervreemder is een overdracht overeenkomstig [artikel 90][ref1], [91][ref2] of
      [93][ref3] van een roerende zaak, niet-registergoed, of een recht aan toonder of order geldig, indien de overdracht
      anders dan om niet geschiedt en de verkrijger te goeder trouw is.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel90
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel91
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Artikel93
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '90'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '91'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005291
        artikel: '93'
        afdeling: '2'
  - number: '86.2'
    text: |-
      Rust op een in het vorige lid genoemd goed dat overeenkomstig [artikel 90][ref1], [91][ref2] of [93][ref3] anders
      dan om niet wordt overgedragen, een beperkt recht dat de verkrijger op dit tijdstip kent noch behoort te kennen,
      dan vervalt dit recht, in het geval van overdracht overeenkomstig [artikel 91 onder][ref4] dezelfde opschortende
      voorwaarde als waaronder geleverd is.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel90
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel91
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Artikel93
      [ref4]: https://wetten.overheid.nl/BWBR0005291#Artikel91
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '90'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '91'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005291
        artikel: '93'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0005291
        artikel: '91'
        afdeling: '2'
  - number: '86.3'
    text: |-
      Niettemin kan de eigenaar van een roerende zaak, die het bezit daarvan door diefstal heeft verloren, deze gedurende
      drie jaren, te rekenen van de dag van de diefstal af, als zijn eigendom opeisen, tenzij:
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel86
  - number: 86.3.a
    text: |-
      de zaak door een natuurlijke persoon die niet in de uitoefening van een beroep of bedrijf handelde, is verkregen
      van een vervreemder die van het verhandelen aan het publiek van soortgelijke zaken anders dan als veilinghouder
      zijn bedrijf maakt in een daartoe bestemde bedrijfsruimte, zijnde een gebouwde onroerende zaak of een gedeelte
      daarvan met de bij het een en ander behorende grond, en in de normale uitoefening van dat bedrijf handelde; of
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel86
  - number: 86.3.b
    text: het geld dan wel toonder- of orderpapier betreft.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel86
  - number: '86.4'
    text: |-
      Op de in het vorige lid bedoelde termijn zijn de [artikelen 316][ref1], [318][ref2] en [319][ref3] betreffende de
      stuiting van de verjaring van een rechtsvordering van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel316
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel318
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Artikel319
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '316'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '318'
      - id: ref3
        bwb_id: BWBR0005291
        artikel: '319'
  - number: 86a.1
    text: |-
      [Artikel 86][ref1] kan niet worden tegengeworpen aan een lid-staat van de Europese Unie of aan een andere staat
      die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte die een roerende zaak opeist, die
      krachtens de nationale wetgeving van die staat een cultuurgoed is in de zin van artikel 2, onder 1, van Richtlijn
      2014/60/EU van het Europees Parlement en de Raad van 15 mei 2014 betreffende de teruggave van cultuurgoederen die
      op onrechtmatige wijze buiten het grondgebied van een lidstaat zijn gebracht en houdende wijziging van Verordening
      (EU) nr. 1024/2012 (PbEU 2014, L 159), mits die zaak in de zin van die richtlijn op onrechtmatige wijze buiten het
      grondgebied van die staat is gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel86
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel86a
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '86'
        afdeling: '2'
  - number: 86a.2
    text: |-
      [Artikel 86][ref1] kan evenmin worden tegengeworpen aan degene die als eigenaar een roerende zaak opeist, die op
      het tijdstip waarop hij het bezit daarvan verloor, krachtens de [Erfgoedwet][ref2] als beschermd cultuurgoed was
      aangewezen of waarvan het buiten Nederland brengen op grond van [artikel 4.22 van die wet][ref3] verboden is.
      Degene die toen in het register, bedoeld in [artikel 3.11 van die wet][ref4] of op een inventarislijst, bedoeld in
      artikel 4.22, tweede lid, van die wet, als eigenaar werd vermeld, wordt vermoed toen eigenaar van de zaak geweest
      te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel86
      [ref2]: https://wetten.overheid.nl/BWBR0037521
      [ref3]: https://wetten.overheid.nl/BWBR0037521#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0037521#Artikel3
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel86a
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '86'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0037521
      - id: ref3
        bwb_id: BWBR0037521
        artikel: '4'
      - id: ref4
        bwb_id: BWBR0037521
        artikel: '3'
  - number: 86a.3
    text: |-
      De rechter die een vordering als bedoeld in lid 1 toewijst, kent aan de bezitter een naar gelang van de
      omstandigheden vast te stellen billijke vergoeding toe, indien deze bij de verkrijging van de zaak de nodige
      zorgvuldigheid heeft betracht. Hetzelfde geldt indien de rechter een vordering als bedoeld in lid 2 toewijst,
      tenzij opeising zonder vergoeding bij toepasselijkheid van [artikel 86 lid 3][ref1] mogelijk zou zijn geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel86
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel86a
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '86'
        afdeling: '2'
  - number: 86a.4
    text: |-
      De vergoeding omvat in elk geval hetgeen aan de bezitter verschuldigd is krachtens de [artikelen 120][ref1] en
      [121][ref2]. Zij wordt bij afgifte van de zaak uitgekeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel120
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel121
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel86a
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '120'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '121'
  - number: 86b.1
    text: |-
      [Artikel 86][ref1] kan niet worden tegengeworpen aan een verdragsstaat van de op 14 november 1970
      te Parijs tot stand gekomen Overeenkomst inzake de middelen om de onrechtmatige invoer, uitvoer of
      eigendomsoverdracht van culturele goederen te verbieden en te verhinderen, noch aan de rechthebbende,
      indien zij op grond van [artikel 6.7 van de Erfgoedwet][ref2] een rechtsvordering als bedoeld in
      [artikel 1011a van het Wetboek van Burgerlijke Rechtsvordering][ref3] tot teruggave van een roerende zaak als
      bedoeld in [dat artikel][ref4] instellen.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel86
      [ref2]: https://wetten.overheid.nl/BWBR0037521#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel1011a
      [ref4]: https://wetten.overheid.nl/BWBR0001827#Artikel1011a
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel86b
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '86'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0037521
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0001827
        artikel: 1011a
      - id: ref4
        bwb_id: BWBR0001827
        artikel: 1011a
  - number: 86b.2
    text: |-
      De rechter die een vordering als bedoeld in het voorgaande lid toewijst, kent aan de bezitter een naar gelang van
      de omstandigheden vast te stellen billijke vergoeding toe, indien deze bij de verkrijging van de zaak de nodige
      zorgvuldigheid heeft betracht, tenzij opeising zonder vergoeding bij toepasselijkheid van [artikel 86 lid 3][ref1]
      mogelijk zou zijn geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel86
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel86b
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '86'
        afdeling: '2'
  - number: 86b.3
    text: |-
      De vergoeding omvat in elk geval hetgeen aan de bezitter verschuldigd is krachtens de [artikelen 120][ref1] en
      [121][ref2]. Zij wordt bij afgifte van de zaak uitgekeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel120
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel121
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel86b
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '120'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '121'
  - number: '87.1'
    text: |-
      Een verkrijger die binnen drie jaren na zijn verkrijging gevraagd wordt wie het goed aan hem vervreemdde, dient
      onverwijld de gegevens te verschaffen, die nodig zijn om deze terug te vinden of die hij ten tijde van zijn
      verkrijging daartoe voldoende mocht achten. Indien hij niet aan deze verplichting voldoet, kan hij de bescherming
      die de [artikelen 86][ref1], [86a][ref2] en [86b][ref3] aan een verkrijger te goeder trouw bieden, niet inroepen.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel86
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel86a
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Artikel86b
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '86'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: 86a
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005291
        artikel: 86b
        afdeling: '2'
  - number: '87.2'
    text: Het vorige lid is niet van toepassing ten aanzien van geld.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel87
  - number: 87a.1
    text: |-
      Om vast te stellen of de bezitter bij de verkrijging van een cultuurgoed als bedoeld in [artikel 86a lid 1][ref1]
      of in [artikel 6.1, onder c, van de Erfgoedwet][ref2] de nodige zorgvuldigheid heeft betracht, wordt rekening
      gehouden met alle omstandigheden van de verwerving, in het bijzonder


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel86a
      [ref2]: https://wetten.overheid.nl/BWBR0037521#Artikel6
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel87a
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: 86a
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0037521
        artikel: '6'
  - number: 87a.1.a
    text: de documentatie over de herkomst van het goed;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel87a
  - number: 87a.1.b
    text: |-
      de volgens het recht van de verzoekende lidstaat dan wel het recht van de verdragsstaat waaruit het goed afkomstig
      is, vereiste vergunningen om het goed buiten het grondgebied van die lidstaat of die verdragsstaat te brengen;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel87a
  - number: 87a.1.c
    text: de hoedanigheid van de partijen;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel87a
  - number: 87a.1.d
    text: de betaalde prijs;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel87a
  - number: 87a.1.e
    text: |-
      het feit of de bezitter elk redelijkerwijs toegankelijk register met betrekking tot gestolen cultuurgoederen
      en elke andere relevante informatie en documentatie die hij redelijkerwijs zou kunnen hebben verkregen, heeft
      geraadpleegd, en het feit of de bezitter toegankelijke instanties heeft geraadpleegd;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel87a
  - number: 87a.1.f
    text: |-
      het feit of de bezitter alle andere stappen heeft genomen die een redelijk handelende persoon in die omstandigheden
      zou hebben genomen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel87a
  - number: 87a.2
    text: |-
      Een handelaar als bedoeld in [artikel 437 van het Wetboek van Strafrecht][ref1] heeft niet de volgens
      [artikel 86b lid 2][ref2] bij de verkrijging van een cultuurgoed nodige zorgvuldigheid betracht, indien hij heeft
      nagelaten


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel437
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel86b
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel87a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '437'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: 86b
        afdeling: '2'
  - number: 87a.2.a
    text: zich te vergewissen van de identiteit van de verkoper
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel87a
  - number: 87a.2.b
    text: van de verkoper een schriftelijke verklaring te verlangen dat hij bevoegd is over de zaak te beschikken;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel87a
  - number: 87a.2.c
    text: |-
      in het door hem bij te houden register de oorsprong van het cultuurgoed, de namen en het adres van de verkoper, de
      aan de verkoper betaalde koopprijs en een beschrijving van het cultuurgoed op te nemen;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel87a
  - number: 87a.2.d
    text: |-
      de registers met betrekking tot gestolen cultuurgoederen te raadplegen die in de gegeven omstandigheden in verband
      met de aard van de cultuurgoederen voor raadpleging in aanmerking komen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel87a
  - number: 87a.3
    text: |-
      Een veilinghouder die bij het aannemen van een cultuurgoed ter openbare verkoop niet aan de in de leden 1 en 2
      bedoelde zorgvuldigheidseisen voldoet dan wel dit cultuurgoed aan degene die het ter openbare verkoop aanbood,
      teruggeeft zonder aan deze zorgvuldigheidseisen te hebben voldaan, handelt onrechtmatig jegens degenen die een
      vordering tot teruggave als bedoeld in [artikel 86b][ref1] kunnen instellen.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel86b
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel87a
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: 86b
        afdeling: '2'
  - number: '88.1'
    text: |-
      Ondanks onbevoegdheid van de vervreemder is een overdracht van een registergoed, van een recht op naam, of van
      een ander goed waarop [artikel 86][ref1] niet van toepassing is, geldig, indien de verkrijger te goeder trouw
      is en de onbevoegdheid voortvloeit uit de ongeldigheid van een vroegere overdracht, die niet het gevolg was van
      onbevoegdheid van de toenmalige vervreemder.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel86
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '86'
        afdeling: '2'
  - number: '88.2'
    text: |-
      Lid 1 kan niet worden tegengeworpen aan vorderingen als bedoeld in de [artikelen 86a leden 1 en 2][ref1] en
      [86b lid 1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel86a
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel86b
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: 86a
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: 86b
        afdeling: '2'
  - number: '89.1'
    text: |-
      De voor overdracht van onroerende zaken vereiste levering geschiedt door een daartoe bestemde, tussen partijen
      opgemaakte notariële akte, gevolgd door de inschrijving daarvan in de daartoe bestemde openbare registers. Zowel de
      verkrijger als de vervreemder kan de akte doen inschrijven.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel89
  - number: '89.2'
    text: |-
      De tot levering bestemde akte moet nauwkeurig de titel van overdracht vermelden; bijkomstige bedingen die niet de
      overdracht betreffen, kunnen in de akte worden weggelaten.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel89
  - number: '89.3'
    text: |-
      Treedt bij een akte van levering iemand als gevolmachtigde van een der partijen op, dan moet in de akte de volmacht
      nauwkeurig worden vermeld.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel89
  - number: '89.4'
    text: |-
      Het in dit artikel bepaalde vindt overeenkomstige toepassing op de levering, vereist voor de overdracht van andere
      registergoederen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel89
  - number: '90.1'
    text: |-
      De levering vereist voor de overdracht van roerende zaken, niet-registergoederen, die in de macht van de
      vervreemder zijn, geschiedt door aan de verkrijger het bezit der zaak te verschaffen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel90
  - number: '90.2'
    text: |-
      Blijft de zaak na de levering in handen van de vervreemder, dan werkt de levering tegenover een derde die een ouder
      recht op de zaak heeft, eerst vanaf het tijdstip dat de zaak in handen van de verkrijger is gekomen, tenzij de
      oudere gerechtigde met vervreemding heeft ingestemd.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel90
  - number: '91'
    text: |-
      De levering van in het vorige artikel bedoelde zaken ter uitvoering van een verbintenis tot overdracht onder
      opschortende voorwaarde, geschiedt door aan de verkrijger de macht over de zaak te verschaffen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel91
  - number: '92.1'
    text: |-
      Heeft een overeenkomst de strekking dat de een zich de eigendom van een zaak die in de macht van de ander wordt
      gebracht, voorbehoudt totdat een door de ander verschuldigde prestatie is voldaan, dan wordt hij vermoed zich te
      verbinden tot overdracht van de zaak aan de ander onder opschortende voorwaarde van voldoening van die prestatie.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel92
  - number: '92.2'
    text: |-
      Een eigendomsvoorbehoud kan slechts geldig worden bedongen ter zake van vorderingen betreffende de tegenprestatie
      voor door de vervreemder aan de verkrijger krachtens overeenkomst geleverde of te leveren zaken of krachtens een
      zodanige overeenkomst tevens ten behoeve van de verkrijger verrichte of te verrichten werkzaamheden, alsmede ter
      zake van de vorderingen wegens tekortschieten in de nakoming van zodanige overeenkomsten. Voor zover een voorwaarde
      op deze grond nietig is, wordt zij voor ongeschreven gehouden.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel92
  - number: '92.3'
    text: |-
      Een voorwaarde als in lid 1 bedoeld wordt voor vervuld gehouden, wanneer de vervreemder op enige andere wijze
      dan door voldoening van de tegenprestatie wordt bevredigd, wanneer de verkrijger van zijn verplichting daartoe
      wordt bevrijd uit hoofde van [artikel 60 van Boek 6][ref1], of wanneer de verjaring van de rechtsvordering ter
      zake van de tegenprestatie is voltooid. Behoudens afwijkend beding, geldt hetzelfde bij afstand van het recht op
      de tegenprestatie.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel60
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '60'
  - number: '93'
    text: |-
      De levering, vereist voor de overdracht van een recht aan toonder waarvan het toonderpapier in de macht van de
      vervreemder is, geschiedt door de levering van dit papier op de wijze en met de gevolgen als aangegeven in de
      [artikelen 90][ref1], [91][ref2] en [92][ref3]. Voor overdracht van een recht aan order, waarvan het orderpapier in
      de macht van de vervreemder is, geldt hetzelfde, met dien verstande dat voor de levering tevens endossement vereist
      is.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel90
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel91
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Artikel92
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '90'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '91'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005291
        artikel: '92'
        afdeling: '2'
  - number: '94.1'
    text: |-
      Buiten de in het vorige artikel geregelde gevallen worden tegen een of meer bepaalde personen uit te oefenen
      rechten geleverd door een daartoe bestemde akte, en mededeling daarvan aan die personen door de vervreemder of
      verkrijger.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel94
  - number: '94.2'
    text: |-
      De levering van een tegen een bepaalde, doch op de dag waarop de akte wordt opgemaakt onbekende persoon uit te
      oefenen recht dat op die dag aan de vervreemder toebehoort, werkt terug tot die dag, indien de mededeling met
      bekwame spoed wordt gedaan, nadat die persoon bekend is geworden.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel94
  - number: '94.3'
    text: |-
      Deze rechten kunnen ook worden geleverd door een daartoe bestemde authentieke of geregistreerde onderhandse akte,
      zonder mededeling daarvan aan de personen tegen wie die rechten moeten worden uitgeoefend, mits deze rechten op
      het tijdstip van de levering reeds bestaan of rechtstreeks zullen worden verkregen uit een dan reeds bestaande
      rechtsverhouding. De levering kan niet worden tegengeworpen aan de personen tegen wie deze rechten moeten worden
      uitgeoefend dan na mededeling daarvan aan die personen door de vervreemder of de verkrijger. Voor de verkrijger
      van een recht dat overeenkomstig de eerste zin is geleverd, geldt [artikel 88 lid 1][ref1] slechts, indien hij te
      goeder trouw is op het tijdstip van de in tweede zin bedoelde mededeling.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel88
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '88'
        afdeling: '2'
  - number: '94.4'
    text: |-
      De personen tegen wie het recht moet worden uitgeoefend, kunnen verlangen dat hun een door de vervreemder
      gewaarmerkt uittreksel van de akte en haar titel wordt ter hand gesteld. Bedingen die voor deze personen van
      geen belang zijn, behoeven daarin niet te worden opgenomen. Is van een titel geen akte opgemaakt, dan moet hun de
      inhoud, voor zover voor hen van belang, schriftelijk worden medegedeeld.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel94
  - number: '95'
    text: |-
      Buiten de in de [artikelen 89-94][ref1] geregelde gevallen en behoudens het in de [artikelen 96][ref2] en
      [98][ref3] bepaalde, worden goederen geleverd door een daartoe bestemde akte.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel89
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel96
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Artikel98
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '89'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '96'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005291
        artikel: '98'
        afdeling: '2'
  - number: '96'
    text: |-
      De levering van een aandeel in een goed geschiedt op overeenkomstige wijze en met overeenkomstige gevolgen als is
      bepaald met betrekking tot levering van dat goed.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel96
  - number: '97.1'
    text: |-
      Toekomstige goederen kunnen bij voorbaat worden geleverd, tenzij het verboden is deze tot onderwerp van een
      overeenkomst te maken of het registergoederen zijn.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel97
  - number: '97.2'
    text: |-
      Een levering bij voorbaat van een toekomstig goed werkt niet tegen iemand die het goed ingevolge een eerdere
      levering bij voorbaat heeft verkregen. Betreft het een roerende zaak, dan werkt zij jegens deze vanaf het tijdstip
      dat de zaak in handen van de verkrijger is gekomen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel97
  - number: '98'
    text: |-
      Tenzij de wet anders bepaalt, vindt al hetgeen in deze afdeling omtrent de overdracht van een goed is bepaald,
      overeenkomstige toepassing op de vestiging, de overdracht en de afstand van een beperkt recht op een zodanig goed.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel98
  - number: '99.1'
    text: |-
      Rechten op roerende zaken die niet-registergoederen zijn, en rechten aan toonder of order worden door een bezitter
      te goeder trouw verkregen door een onafgebroken bezit van drie jaren, andere goederen door een onafgebroken bezit
      van tien jaren.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel99
  - number: '99.2'
    text: |-
      Lid 1 geldt niet voor roerende zaken die krachtens de [Erfgoedwet][ref1] als beschermd cultuurgoed
      zijn aangewezen of deel uitmaken van een openbare collectie of van een inventarislijst als bedoeld in
      [artikel 4.22, tweede lid, van die wet][ref2], mits het bezit na die aanwijzing of gedurende dit deel uitmaken
      is begonnen.


      [ref1]: https://wetten.overheid.nl/BWBR0037521
      [ref2]: https://wetten.overheid.nl/BWBR0037521#Artikel4
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0037521
      - id: ref2
        bwb_id: BWBR0037521
        artikel: '4'
  - number: '99.3'
    text: |-
      Lid 1 kan niet worden tegengeworpen aan vorderingen als bedoeld in de [artikelen 86a lid 1][ref1] en
      [86b lid 1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel86a
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel86b
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: 86a
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: 86b
        afdeling: '2'
  - number: '100'
    text: |-
      Hij die een nalatenschap in bezit heeft genomen, kan die nalatenschap en de daartoe behorende goederen niet eerder
      door verjaring ten nadele van de rechthebbende verkrijgen dan nadat diens rechtsvordering tot opeising van die
      nalatenschap is verjaard.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel100
  - number: '101'
    text: Een verjaring begint te lopen met de aanvang van de dag na het begin van het bezit.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel101
  - number: '102.1'
    text: Hij die een ander onder algemene titel in het bezit opvolgt, zet een lopende verjaring voort.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel102
  - number: '102.2'
    text: |-
      Hetzelfde doet de bezitter te goeder trouw die het bezit van een ander anders dan onder algemene titel heeft
      verkregen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel102
  - number: '103'
    text: |-
      Onvrijwillig bezitsverlies onderbreekt de loop der verjaring niet, mits het bezit binnen het jaar wordt
      terugverkregen of een binnen het jaar ingestelde rechtsvordering tot terugverkrijging van het bezit leidt.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel103
  - number: '104.1'
    text: |-
      Wanneer de verjaring van de rechtsvordering strekkende tot beëindiging van het bezit wordt gestuit of verlengd,
      wordt daarmede de verkrijgende verjaring dienovereenkomstig gestuit of verlengd.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel104
  - number: '104.2'
    text: |-
      In dit en de beide volgende artikelen wordt onder verjaring van een rechtsvordering de verjaring van de bevoegdheid
      tot tenuitvoerlegging van de uitspraak waarbij de eis is toegewezen, begrepen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel104
  - number: '105.1'
    text: |-
      Hij die een goed bezit op het tijdstip waarop de verjaring van de rechtsvordering strekkende tot beëindiging van
      het bezit wordt voltooid, verkrijgt dat goed, ook al was zijn bezit niet te goeder trouw.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel105
  - number: '105.2'
    text: |-
      Heeft iemand vóór dat tijdstip het bezit onvrijwillig verloren, maar het na dat tijdstip, mits binnen het jaar na
      het bezitsverlies of uit hoofde van een binnen dat jaar ingestelde rechtsvordering, terugverkregen, dan wordt hij
      als de bezitter op het in het vorige lid aangegeven tijdstip aangemerkt.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel105
  - number: '106'
    text: |-
      Wanneer de verjaring van de rechtsvordering van een beperkt gerechtigde tegen de hoofdgerechtigde tot opheffing
      van een met het beperkte recht strijdige toestand wordt voltooid, gaat het beperkte recht teniet, voor zover de
      uitoefening daarvan door die toestand is belet.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel106
  - number: '107.1'
    text: Bezit is het houden van een goed voor zichzelf.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel107
  - number: '107.2'
    text: Bezit is onmiddellijk, wanneer iemand bezit zonder dat een ander het goed voor hem houdt.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel107
  - number: '107.3'
    text: Bezit is middellijk, wanneer iemand bezit door middel van een ander die het goed voor hem houdt.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel107
  - number: '107.4'
    text: Houderschap is op overeenkomstige wijze onmiddellijk of middellijk.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel107
  - number: '108'
    text: |-
      Of iemand een goed houdt en of hij dit voor zichzelf of voor een ander doet, wordt naar verkeersopvatting
      beoordeeld, met inachtneming van de navolgende regels en overigens op grond van uiterlijke feiten.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel108
  - number: '109'
    text: Wie een goed houdt, wordt vermoed dit voor zichzelf te houden.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel109
  - number: '110'
    text: |-
      Bestaat tussen twee personen een rechtsverhouding die de strekking heeft dat hetgeen de ene op bepaalde
      wijze zal verkrijgen, door hem voor de ander zal worden gehouden, dan houdt de ene het ter uitvoering van die
      rechtsverhouding door hem verkregene voor de ander.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel110
  - number: '111'
    text: |-
      Wanneer men heeft aangevangen krachtens een rechtsverhouding voor een ander te houden, gaat men daarmede onder
      dezelfde titel voort, zolang niet blijkt dat hierin verandering is gebracht, hetzij ten gevolge van een handeling
      van hem voor wie men houdt, hetzij ten gevolge van een tegenspraak van diens recht.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel111
  - number: '112'
    text: Bezit wordt verkregen door inbezitneming, door overdracht of door opvolging onder algemene titel.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel112
  - number: '113.1'
    text: Men neemt een goed in bezit door zich daarover de feitelijke macht te verschaffen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel113
  - number: '113.2'
    text: |-
      Wanneer een goed in het bezit van een ander is, zijn enkele op zichzelf staande machtsuitoefeningen voor een
      inbezitneming onvoldoende.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel113
  - number: '114'
    text: |-
      Een bezitter draagt zijn bezit over door de verkrijger in staat te stellen die macht uit te oefenen, die hij zelf
      over het goed kon uitoefenen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel114
  - number: '115'
    text: 'Voor de overdracht van het bezit is een tweezijdige verklaring zonder feitelijke handeling voldoende:'
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel115
  - number: 115.a
    text: |-
      wanneer de vervreemder de zaak bezit en hij haar krachtens een bij de levering gemaakt beding voortaan voor de
      verkrijger houdt;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel115
  - number: 115.b
    text: wanneer de verkrijger houder van de zaak voor de vervreemder was;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel115
  - number: 115.c
    text: |-
      wanneer een derde voor de vervreemder de zaak hield, en haar na de overdracht voor de ontvanger houdt. In dit geval
      gaat het bezit niet over voordat de derde de overdracht heeft erkend, dan wel de vervreemder of de verkrijger de
      overdracht aan hem heeft medegedeeld.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel115
  - number: '116'
    text: |-
      Hij die onder een algemene titel een ander opvolgt, volgt daarmede die ander op in diens bezit en houderschap, met
      alle hoedanigheden en gebreken daarvan.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel116
  - number: '117.1'
    text: |-
      Een bezitter van een goed verliest het bezit, wanneer hij het goed kennelijk prijsgeeft, of wanneer een ander het
      bezit van het goed verkrijgt.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel117
  - number: '117.2'
    text: |-
      Zolang niet een der in het vorige lid genoemde gronden van bezitsverlies zich heeft voorgedaan, duurt een
      aangevangen bezit voort.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel117
  - number: '118.1'
    text: |-
      Een bezitter is te goeder trouw, wanneer hij zich als rechthebbende beschouwt en zich ook redelijkerwijze als
      zodanig mocht beschouwen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel118
  - number: '118.2'
    text: Is een bezitter eenmaal te goeder trouw, dan wordt hij geacht dit te blijven.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel118
  - number: '118.3'
    text: Goede trouw wordt vermoed aanwezig te zijn; het ontbreken van goede trouw moet worden bewezen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel118
  - number: '119.1'
    text: De bezitter van een goed wordt vermoed rechthebbende te zijn.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel119
  - number: '119.2'
    text: |-
      Ten aanzien van registergoederen wijkt dit vermoeden, wanneer komt vast te staan dat de wederpartij of diens
      rechtsvoorganger te eniger tijd rechthebbende was en dat de bezitter zich niet kan beroepen op verkrijging nadien
      onder bijzondere titel waarvoor inschrijving in de registers vereist is.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel119
  - number: '120.1'
    text: |-
      Aan een bezitter te goeder trouw behoren de afgescheiden natuurlijke en de opeisbaar geworden burgerlijke vruchten
      toe.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel120
  - number: '120.2'
    text: |-
      De rechthebbende op een goed, die dit opeist van een bezitter te goeder trouw of die het van deze heeft
      terugontvangen, is verplicht de ten behoeve van het goed gemaakte kosten alsmede de schade waarvoor de bezitter op
      grond van het in [titel 3 van Boek 6][ref1] bepaalde uit hoofde van zijn bezit jegens derden aansprakelijk mocht
      zijn, aan deze te vergoeden, voor zover de bezitter niet door de vruchten van het goed en de overige voordelen
      die hij ter zake heeft genoten, voor het een en ander is schadeloos gesteld. De rechter kan de verschuldigde
      vergoeding beperken, indien volledige vergoeding zou leiden tot onbillijke bevoordeling van de bezitter jegens
      de rechthebbende.


      [ref1]: https://wetten.overheid.nl/BWBR0005289
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0005289
  - number: '120.3'
    text: |-
      Zolang een bezitter te goeder trouw de hem verschuldigde vergoeding niet heeft ontvangen, is hij bevoegd de afgifte
      van het goed op te schorten.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel120
  - number: '120.4'
    text: |-
      Het in dit artikel bepaalde is ook van toepassing op hem die meent en mocht menen dat hij het bezit rechtmatig
      heeft verkregen, ook al weet hij dat de handelingen die voor de levering van het recht nodig zijn, niet hebben
      plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel120
  - number: '121.1'
    text: |-
      Een bezitter die niet te goeder trouw is, is jegens de rechthebbende behalve tot afgifte van het goed ook verplicht
      tot het afgeven van de afgescheiden natuurlijke en de opeisbaar geworden burgerlijke vruchten, onverminderd zijn
      aansprakelijkheid op grond van het in [titel 3 van Boek 6][ref1] bepaalde voor door de rechthebbende geleden
      schade.


      [ref1]: https://wetten.overheid.nl/BWBR0005289
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0005289
  - number: '121.2'
    text: |-
      Hij heeft tegen de rechthebbende alleen een vordering tot vergoeding van de kosten die hij ten behoeve van het goed
      of tot winning van de vruchten heeft gemaakt, voor zover hij deze vergoeding van de rechthebbende kan vorderen op
      grond van het bepaalde omtrent ongerechtvaardigde verrijking.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel121
  - number: '121.3'
    text: |-
      Het in dit artikel bepaalde is ook op de bezitter te goeder trouw van toepassing vanaf het tijdstip waarop de
      rechthebbende zijn recht tegen hem heeft ingeroepen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel121
  - number: '122'
    text: |-
      Indien de rechthebbende ter bevrijding van de door hem ingevolge de beide vorige artikelen verschuldigde
      vergoedingen op zijn kosten het goed aan de bezitter wil overdragen, is de bezitter gehouden hieraan mede te
      werken.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel122
  - number: '123'
    text: |-
      Heeft de bezitter van een zaak daaraan veranderingen of toevoegingen aangebracht, dan is hij bevoegd om, in plaats
      van de hem op grond van de [artikelen 120][ref1] en [121][ref2] daarvoor toekomende vergoeding te vorderen, deze
      veranderingen of toevoegingen weg te nemen, mits hij de zaak in de oude toestand terugbrengt.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel120
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel121
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '120'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '121'
  - number: '124'
    text: |-
      Wanneer iemand een goed voor een ander houdt en dit door een derde als rechthebbende van hem wordt opgeëist,
      vindt hetgeen in de voorgaande vier artikelen omtrent de bezitter is bepaald, te zijnen aanzien toepassing met
      inachtneming van de rechtsverhouding waarin hij tot die ander stond.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel124
  - number: '125.1'
    text: |-
      Hij die het bezit van een goed heeft verkregen, kan op grond van een daarna ingetreden bezitsverlies of
      bezitsstoornis tegen derden dezelfde rechtsvorderingen instellen tot terugverkrijging van het goed en tot opheffing
      van de stoornis, die de rechthebbende op het goed toekomen. Nochtans moeten deze rechtsvorderingen binnen het jaar
      na het verlies of de stoornis worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel125
  - number: '125.2'
    text: |-
      De vordering wordt afgewezen, indien de verweerder een beter recht dan de eiser heeft tot het houden van het
      goed of de storende handelingen krachtens een beter recht heeft verricht, tenzij de verweerder met geweld of op
      heimelijke wijze aan de eiser het bezit heeft ontnomen of diens bezit heeft gestoord.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel125
  - number: '125.3'
    text: |-
      Het in dit artikel bepaalde laat voor de bezitter, ook nadat het in het eerste lid bedoelde jaar is verstreken, en
      voor de houder onverlet de mogelijkheid een vordering op grond van onrechtmatige daad in te stellen, indien daartoe
      gronden zijn.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel125
  - number: '166.1'
    text: Gemeenschap is aanwezig, wanneer een of meer goederen toebehoren aan twee of meer deelgenoten gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel166
  - number: '166.2'
    text: De aandelen van de deelgenoten zijn gelijk, tenzij uit hun rechtsverhouding anders voortvloeit.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel166
  - number: '166.3'
    text: |-
      Op de rechtsbetrekkingen tussen de deelgenoten is [artikel 2 van Boek 6][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel2
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel166
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '2'
  - number: '167'
    text: Goederen die geacht moeten worden in de plaats van een gemeenschappelijk goed te treden behoren tot de gemeenschap.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel167
  - number: '168.1'
    text: |-
      De deelgenoten kunnen het genot, het gebruik en het beheer van gemeenschappelijke goederen bij overeenkomst
      regelen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel168
  - number: '168.2'
    text: |-
      Voor zover een overeenkomst ontbreekt, kan de kantonrechter op verzoek van de meest gerede partij een zodanige
      regeling treffen, zo nodig met onderbewindstelling van de goederen. Hij houdt daarbij naar billijkheid rekening
      zowel met de belangen van partijen als met het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel168
  - number: '168.3'
    text: |-
      Een bestaande regeling kan op verzoek van de meest gerede partij door de kantonrechter wegens onvoorziene
      omstandigheden gewijzigd of buiten werking gesteld worden.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel168
  - number: '168.4'
    text: Een regeling is ook bindend voor de rechtverkrijgenden van een deelgenoot.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel168
  - number: '168.5'
    text: |-
      Op een overeenkomstig lid 2 ingesteld bewind zijn, voor zover de kantonrechter niet anders heeft bepaald, de
      [artikelen 154][ref1], [157 tot en met 166][ref2], [168][ref3], [172][ref4], [173][ref5] en [174 van Boek 4][ref6],
      van overeenkomstige toepassing, met dien verstande dat de kantonrechter de in [artikel 159 van Boek 4][ref7]
      bedoelde beloning ook op grond van bijzondere omstandigheden anders kan regelen, alsmede dat hij de in
      [artikel 160 van Boek 4][ref8] bedoelde zekerheidstelling te allen tijde kan bevelen. Het kan door een gezamenlijk
      besluit van de deelgenoten of op verzoek van een hunner door de kantonrechter worden opgeheven.


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel154
      [ref2]: https://wetten.overheid.nl/BWBR0002761#Artikel157
      [ref3]: https://wetten.overheid.nl/BWBR0002761#Artikel168
      [ref4]: https://wetten.overheid.nl/BWBR0002761#Artikel172
      [ref5]: https://wetten.overheid.nl/BWBR0002761#Artikel173
      [ref6]: https://wetten.overheid.nl/BWBR0002761#Artikel174
      [ref7]: https://wetten.overheid.nl/BWBR0002761#Artikel159
      [ref8]: https://wetten.overheid.nl/BWBR0002761#Artikel160
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel168
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '154'
      - id: ref2
        bwb_id: BWBR0002761
        artikel: '157'
      - id: ref3
        bwb_id: BWBR0002761
        artikel: '168'
      - id: ref4
        bwb_id: BWBR0002761
        artikel: '172'
      - id: ref5
        bwb_id: BWBR0002761
        artikel: '173'
      - id: ref6
        bwb_id: BWBR0002761
        artikel: '174'
      - id: ref7
        bwb_id: BWBR0002761
        artikel: '159'
      - id: ref8
        bwb_id: BWBR0002761
        artikel: '160'
  - number: '169'
    text: |-
      Tenzij een regeling anders bepaalt, is iedere deelgenoot bevoegd tot het gebruik van een gemeenschappelijk goed,
      mits dit gebruik met het recht van de overige deelgenoten te verenigen is.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel169
  - number: '170.1'
    text: |-
      Handelingen dienende tot gewoon onderhoud of tot behoud van een gemeenschappelijk goed, en in het algemeen
      handelingen die geen uitstel kunnen lijden, kunnen door ieder der deelgenoten zo nodig zelfstandig worden verricht.
      Ieder van hen is bevoegd ten behoeve van de gemeenschap verjaring te stuiten.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel170
  - number: '170.2'
    text: |-
      Voor het overige geschiedt het beheer door de deelgenoten tezamen, tenzij een regeling anders bepaalt. Onder
      beheer zijn begrepen alle handelingen die voor de normale exploitatie van het goed dienstig kunnen zijn, alsook het
      aannemen van aan de gemeenschap verschuldigde prestaties.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel170
  - number: '170.3'
    text: |-
      Tot andere handelingen betreffende een gemeenschappelijk goed dan in de vorige leden vermeld, zijn uitsluitend de
      deelgenoten tezamen bevoegd.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel170
  - number: '171'
    text: |-
      Tenzij een regeling anders bepaalt, is iedere deelgenoot bevoegd tot het instellen van rechtsvorderingen en het
      indienen van verzoeken ter verkrijging van een rechterlijke uitspraak ten behoeve van de gemeenschap. Een regeling
      die het beheer toekent aan een of meer der deelgenoten, sluit, tenzij zij anders bepaalt, deze bevoegdheid voor de
      anderen uit.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel171
  - number: '172'
    text: |-
      Tenzij een regeling anders bepaalt, delen de deelgenoten naar evenredigheid van hun aandelen in de vruchten en
      andere voordelen die het gemeenschappelijke goed oplevert, en moeten zij in dezelfde evenredigheid bijdragen tot de
      uitgaven die voortvloeien uit handelingen welke bevoegdelijk ten behoeve van de gemeenschap zijn verricht.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel172
  - number: '173'
    text: |-
      Ieder der deelgenoten kan van degene onder hen die voor de overigen beheer heeft gevoerd, jaarlijks en in ieder
      geval bij het einde van het beheer rekening en verantwoording vorderen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel173
  - number: '174.1'
    text: |-
      De rechter die ter zake van een vordering tot verdeling bevoegd zou zijn of voor wie een zodanige vordering
      reeds aanhangig is kan een deelgenoot op diens verzoek ten behoeve van de voldoening van een voor rekening
      van de gemeenschap komende schuld of om andere gewichtige redenen machtigen tot het te gelde maken van een
      gemeenschappelijk goed. Indien een deelgenoot voor wie een te verkopen goed een bijzondere waarde heeft, bereid is
      het goed tegen vergoeding van de geschatte waarde over te nemen, kan de voormelde rechter deze overneming bevelen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel174
  - number: '174.2'
    text: |-
      De in lid 1 bedoelde rechter kan een deelgenoot op diens verzoek machtigen een gemeenschappelijk goed te bezwaren
      met een recht van pand of hypotheek tot zekerheid voor de voldoening van een voor rekening van de gemeenschap
      komende schuld die reeds bestaat of waarvan het aangaan geboden is voor het behoud van een goed der gemeenschap.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel174
  - number: '175.1'
    text: |-
      Tenzij uit de rechtsverhouding tussen de deelgenoten anders voortvloeit, kan ieder van hen over zijn aandeel in een
      gemeenschappelijk goed beschikken.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel175
  - number: '175.2'
    text: |-
      Indien uit de rechtsverhouding tussen de deelgenoten voortvloeit dat zij niet, tenzij met aller toestemming,
      bevoegd zijn over hun aandeel te beschikken, zijn de [leden 3 en 4 van artikel 168][ref1] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel168
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel175
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '168'
        afdeling: '1'
  - number: '175.3'
    text: |-
      De schuldeisers van een deelgenoot kunnen zijn aandeel in een gemeenschappelijk goed uitwinnen. Na de uitwinning
      van een aandeel kunnen beperkingen van de bevoegdheid om over de aandelen te beschikken niet worden ingeroepen
      tussen de verkrijger van dat aandeel en de overige deelgenoten.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel175
  - number: '176.1'
    text: |-
      De verkrijger van een aandeel of een beperkt recht daarop moet van de verkrijger onverwijld mededeling doen aan de
      overige deelgenoten of aan degene die door de deelgenoten of de rechter met het beheer over het goed is belast.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel176
  - number: '176.2'
    text: |-
      Een overgedragen aandeel wordt verkregen onder de last aan de gemeenschap te vergoeden hetgeen de vervreemder haar
      schuldig was. Vervreemder en verkrijger zijn hoofdelijk voor deze vergoeding aansprakelijk. De verkrijger kan zich
      aan deze verplichting onttrekken door zijn aandeel op zijn kosten aan de overige deelgenoten over te dragen; dezen
      zijn verplicht aan een zodanige overdracht mede te werken.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel176
  - number: '176.3'
    text: De vorige leden zijn niet van toepassing bij uitwinning van de gezamenlijke aandelen in een gemeenschappelijk goed.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel176
  - number: '177.1'
    text: |-
      Wordt een gemeenschappelijk goed verdeeld of overgedragen, terwijl op het aandeel van een deelgenoot een beperkt
      recht rust, dan komt dat recht te rusten op het goed voor zover dit door die deelgenoot wordt verkregen, en wordt
      het goed voor het overige van dat recht bevrijd, onverminderd hetgeen de beperkt gerechtigde of de deelgenoot
      op wiens aandeel zijn recht rust, krachtens hun onderlinge verhouding van de onder wegens een door deze aldus
      ontvangen overwaarde heeft te vorderen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel177
  - number: '177.2'
    text: |-
      Een verdeling, alsmede een overdracht waartoe de deelgenoten zich na bezwaring met het beperkte recht hebben
      verplicht, behoeft de medewerking van de beperkt gerechtigde.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel177
  - number: '177.3'
    text: |-
      Een bij toedeling van het goed aan de in het eerste lid genoemde deelgenoot bedongen recht van pand of hypotheek
      tot waarborg van hetgeen hij aan een of meer der deelgenoten ten gevolge van de verdeling schuldig is of mocht
      worden, heeft, mits het gelijktijdig met de levering van het hem toegedeelde daarop wordt gevestigd, voorrang boven
      een beperkt recht dat een deelgenoot tevoren op zijn aandeel had gevestigd.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel177
  - number: '178.1'
    text: |-
      Ieder der deelgenoten, alsmede hij die een beperkt recht op een aandeel heeft, kan te allen tijde verdeling van
      een gemeenschappelijk goed vorderen, tenzij uit de aard van de gemeenschap of uit het in de volgende leden bepaalde
      anders voortvloeit.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel178
  - number: '178.2'
    text: |-
      Op verlangen van een deelgenoot kan de rechter voor wie een vordering tot verdeling aanhangig is, bepalen dat alle
      of sommige opeisbare schulden die voor rekening van de gemeenschap komen, moeten worden voldaan alvorens tot de
      verdeling wordt overgegaan.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel178
  - number: '178.3'
    text: |-
      Indien de door een onmiddellijke verdeling getroffen belangen van een of meer deelgenoten aanmerkelijk groter zijn
      dan de belangen die door de verdeling worden gediend, kan de rechter voor wie een vordering tot verdeling aanhangig
      is, op verlangen van een deelgenoot een of meermalen, telkens voor ten hoogste drie jaren, een vordering tot
      verdeling uitsluiten.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel178
  - number: '178.4'
    text: |-
      Indien geen vordering tot verdeling aanhangig is, kan een beslissing als bedoeld in de leden 2 en 3 op verzoek
      van ieder van de deelgenoten worden gegeven door de rechter die ter zake van de vordering tot verdeling bevoegd
      zou zijn.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel178
  - number: '178.5'
    text: |-
      Zij die bevoegd zijn verdeling te vorderen, kunnen hun bevoegdheid daartoe een of meer malen bij overeenkomst,
      telkens voor ten hoogste vijf jaren, uitsluiten. De [leden 3 en 4 van artikel 168][ref1] zijn op een zodanige
      overeenkomst van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel168
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel178
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '168'
        afdeling: '1'
  - number: '179.1'
    text: |-
      Indien verdeling van een gemeenschappelijk goed wordt gevorderd, kan ieder der deelgenoten verlangen dat alle tot
      de gemeenschap behorende goederen en de voor rekening van de gemeenschap komende schulden in de verdeling worden
      begrepen, tenzij er gewichtige redenen zijn voor een gedeeltelijke verdeling. Van de verdeling worden die goederen
      uitgezonderd, die wegens een der in [artikel 178][ref1] genoemde gronden onverdeeld moeten blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel178
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel179
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '178'
        afdeling: '1'
  - number: '179.2'
    text: |-
      De omstandigheid dat bij een verdeling een of meer goederen zijn overgeslagen, heeft alleen ten gevolge dat daarvan
      een nadere verdeling kan worden gevorderd.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel179
  - number: '179.3'
    text: |-
      Op de toedeling van een schuld is [afdeling 3 van titel 2 van Boek 6][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Afdeling3
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel179
    references:
      - id: ref1
        bwb_id: BWBR0005289
        afdeling: '3'
  - number: '180.1'
    text: |-
      Een schuldeiser die een opeisbare vordering op een deelgenoot heeft, kan verdeling van de gemeenschap vorderen,
      doch niet verder dan nodig is voor het verhaal van zijn vordering. [Artikel 178 lid 3][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel178
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel180
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '178'
        afdeling: '1'
  - number: '180.2'
    text: |-
      Heeft een schuldeiser een bevel tot verdeling van de gemeenschap verkregen dan behoeft de verdeling zijn
      medewerking.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel180
  - number: '181.1'
    text: |-
      Voor het geval dat deelgenoten of zij wier medewerking vereist is, niet medewerken tot een verdeling nadat deze
      bij rechterlijke uitspraak is bevolen, benoemt de rechter die in eerste aanleg van de vordering tot verdeling
      heeft kennis genomen, indien deze benoeming niet reeds bij die uitspraak heeft plaatsgehad, op verzoek van de meest
      gerede partij een onzijdig persoon die hen bij de verdeling vertegenwoordigt en daarbij hun belangen naar eigen
      beste inzicht behartigt. Hebben degenen die niet medewerken tegenstrijdige belangen, dan wordt voor ieder van hen
      een onzijdig persoon benoemd.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel181
  - number: '181.2'
    text: |-
      Een onzijdig persoon is verplicht hetgeen aan de door hem vertegenwoordigde persoon ingevolge de verdeling
      toekomt, voor deze in ontvangst te nemen en daarover tot de afgifte aan de rechthebbende op de voet van
      [artikel 410 van Boek 1][ref1] het bewind te voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel410
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel181
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '410'
  - number: '181.3'
    text: |-
      De beloning die de onzijdige persoon ten laste van de rechthebbende toekomt, wordt op zijn verzoek vastgesteld door
      de rechter die hem benoemde.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel181
  - number: '182'
    text: |-
      Als een verdeling wordt aangemerkt iedere rechtshandeling waartoe alle deelgenoten, hetzij in persoon, hetzij
      vertegenwoordigd, medewerken en krachtens welke een of meer van hen een of meer goederen der gemeenschap met
      uitsluiting van de overige deelgenoten verkrijgen. De handeling is niet een verdeling, indien zij strekt tot
      nakoming van een voor rekening van de gemeenschap komende schuld aan een of meer deelgenoten, die niet voortspruit
      uit een rechtshandeling als bedoeld in de vorige zin.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel182
  - number: '183.1'
    text: |-
      De verdeling kan geschieden op de wijze en in de vorm die partijen goeddunkt, mits de deelgenoten en zij wier
      medewerking vereist is, allen het vrije beheer over hun goederen hebben en in persoon of bij een door hen
      aangewezen vertegenwoordiger medewerken, dan wel in geval van bewind over hun recht, worden vertegenwoordigd door
      de bewindvoerder, voorzien van de daartoe vereiste toestemming of machtiging.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel183
  - number: '183.2'
    text: |-
      In andere gevallen moet, tenzij de rechter anders bepaalt, de verdeling geschieden bij notariële akte en worden
      goedgekeurd door de kantonrechter die bevoegd is de wettelijke vertegenwoordiger van degene die het vrije beheer
      over zijn goederen mist, tot beschikkingshandelingen te machtigen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel183
  - number: '184.1'
    text: |-
      Ieder der deelgenoten kan bij een verdeling verlangen dat op het aandeel van een andere deelgenoot wordt
      toegerekend hetgeen deze aan de gemeenschap schuldig is. De toerekening geschiedt ongeacht de gegoedheid van de
      schuldenaar. Is het een schuld onder tijdsbepaling, dan wordt zij voor haar contante waarde op het tijdstip der
      verdeling toegerekend.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel184
  - number: '184.2'
    text: Het vorige lid is niet van toepassing op schulden onder een opschortende voorwaarde die nog niet vervuld is.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel184
  - number: '185.1'
    text: |-
      Voor zover de deelgenoten en zij wier medewerking vereist is, over een verdeling niet tot overeenstemming kunnen
      komen, gelast op vordering van de meest gerede partij de rechter de wijze van verdeling of stelt hij zelf de
      verdeling vast, rekening houdende naar billijkheid zowel met de belangen van partijen als met het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel185
  - number: '185.2'
    text: 'Als wijzen van verdeling komen daarbij in aanmerking:'
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel185
  - number: 185.2.a
    text: toedeling van een gedeelte van het goed aan ieder der deelgenoten;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel185
  - number: 185.2.b
    text: overbedeling van een of meer deelgenoten tegen vergoeding van de overwaarde;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel185
  - number: 185.2.c
    text: |-
      verdeling van de netto-opbrengst van het goed of een gedeelte daarvan, nadat dit op een door de rechter bepaalde
      wijze zal zijn verkocht.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel185
  - number: '185.3'
    text: |-
      Zo nodig kan de rechter bepalen dat degene die overbedeeld wordt, de overwaarde geheel of ten dele in termijnen mag
      voldoen. Hij kan daaraan de voorwaarde verbinden dat zekerheid tot een door hem bepaald bedrag en van een door hem
      bepaalde aard wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel185
  - number: '186.1'
    text: |-
      Voor de overgang van het aan ieder der deelgenoten toegedeelde is een levering vereist op dezelfde wijze als voor
      overdracht is voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel186
  - number: '186.2'
    text: |-
      Hetgeen een deelgenoot verkrijgt, houdt hij onder dezelfde titel als waaronder de deelgenoten dit tezamen vóór de
      verdeling hielden.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel186
  - number: '187.1'
    text: |-
      De papieren en bewijzen van eigendom, tot de toegedeelde goederen behorende, worden overgegeven aan hem, aan wie de
      goederen zijn toegedeeld.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel187
  - number: '187.2'
    text: |-
      Algemene boedelpapieren en stukken als bedoeld in lid 1, die betrekking hebben op aan meer deelgenoten toegedeelde
      goederen, verblijven bij hem die de meerderheid der betrokken deelgenoten daartoe heeft benoemd, onder verplichting
      aan de overige deelgenoten inzage, en zo iemand dit verlangt, afschriften of uittreksels op diens kosten af te
      geven.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel187
  - number: '187.3'
    text: |-
      Bij gebreke van een meerderheid als bedoeld in het vorige lid geschiedt de daar bedoelde benoeming op verlangen van
      een deelgenoot door de rechter die de verdeling vaststelt, of in andere gevallen op verzoek van een deelgenoot door
      de kantonrechter. Tegen een beslissing krachtens dit lid is geen hogere voorziening toegelaten.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel187
  - number: '188.1'
    text: |-
      Tenzij anders is overeengekomen, zijn deelgenoten verplicht in evenredigheid van hun aandelen elkander de schade
      te vergoeden die het gevolg is van een uitwinning of stoornis, voortgekomen uit een vóór de verdeling ontstane
      oorzaak, alsmede, wanneer een vordering voor het volle bedrag is toegedeeld, de schade die voortvloeit uit
      onvoldoende gegoedheid van de schuldenaar op het ogenblik van de verdeling.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel188
  - number: '188.2'
    text: |-
      Wordt een deelgenoot door zijn eigen schuld uitgewonnen of gestoord, dan zijn de overige deelgenoten niet verplicht
      tot vergoeding van zijn schade.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel188
  - number: '188.3'
    text: |-
      Een verplichting tot vergoeding van schade die voortvloeit uit onvoldoende gegoedheid van de schuldenaar vervalt
      door verloop van drie jaren na de verdeling en na het opeisbaar worden van de toegedeelde vordering.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel188
  - number: '188.4'
    text: |-
      Indien verhaal op een deelgenoot voor zijn aandeel in een krachtens het eerste lid verschuldigde schadevergoeding
      onmogelijk blijkt, wordt het aandeel van ieder der andere deelgenoten naar evenredigheid verhoogd.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel188
  - number: '189.1'
    text: |-
      De bepalingen van deze titel gelden niet voor een huwelijksgemeenschap, gemeenschap van een geregistreerd
      partnerschap, maatschap, vennootschap of rederij, zolang zij niet ontbonden zijn, noch voor de gemeenschap van een
      in appartementsrechten gesplitst gebouw, zolang de splitsing niet is opgeheven.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel189
  - number: '189.2'
    text: |-
      Voor de gemeenschap van een nalatenschap, voor een ontbonden huwelijksgemeenschap, ontbonden gemeenschap van een
      geregistreerd partnerschap, maatschap, vennootschap of rederij en voor de gemeenschap van een gebouw waarvan de
      splitsing in appartementsrechten is opgeheven, gelden de volgende bepalingen van deze afdeling, alsmede die van de
      eerste afdeling, voor zover daarvan in deze afdeling niet wordt afgeweken.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel189
  - number: '190.1'
    text: |-
      Een deelgenoot kan niet beschikken over zijn aandeel in een tot de gemeenschap behorend goed afzonderlijk, en zijn
      schuldeisers kunnen een zodanig aandeel niet uitwinnen, zonder toestemming van de overige deelgenoten.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel190
  - number: '190.2'
    text: |-
      Nochtans kan een deelgenoot op een zodanig aandeel ook zonder toestemming van de andere deelgenoten een recht van
      pand of hypotheek vestigen. Zolang het goed tot de gemeenschap behoort, kan de pand- of hypotheekhouder niet tot
      verkoop overgaan, tenzij de overige deelgenoten hierin toestemmen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel190
  - number: '191.1'
    text: |-
      Tenzij uit de rechtsverhouding tussen de deelgenoten anders voortvloeit, kan ieder der deelgenoten over zijn
      aandeel in de gehele gemeenschap beschikken en kunnen zijn schuldeisers een zodanig aandeel uitwinnen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel191
  - number: '191.2'
    text: |-
      Indien uit de rechtsverhouding tussen de deelgenoten voortvloeit dat zij niet, tenzij met aller toestemming bevoegd
      zijn over hun aandeel te beschikken, zijn de [leden 3 en 4 van artikel 168][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel168
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel191
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '168'
        afdeling: '1'
  - number: '192'
    text: Tot de gemeenschap behorende schulden kunnen op de goederen van de gemeenschap worden verhaald.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel192
  - number: '193.1'
    text: |-
      Een schuldeiser wiens vordering op de goederen der gemeenschap kan worden verhaald, kan de rechter verzoeken
      een vereffenaar te benoemen wanneer tot verdeling van de gemeenschap wordt overgegaan voordat de opeisbare
      schulden daarvan zijn voldaan of wanneer voor hem het gevaar bestaat dat hij niet ten volle of niet binnen een
      redelijke tijd zal worden voldaan, hetzij omdat de gemeenschap niet toereikend is of niet behoorlijk beheerd
      of afgewikkeld wordt, hetzij omdat een schuldeiser zich op de goederen van de gemeenschap gaat verhalen.
      [Afdeling 3 van titel 6 van Boek 4][ref1] betreffende de vereffening van een nalatenschap is van toepassing of
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Afdeling3
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel193
    references:
      - id: ref1
        bwb_id: BWBR0002761
        afdeling: '3'
  - number: '193.2'
    text: |-
      Ook een schuldeiser van een deelgenoot kan de rechter verzoeken een vereffenaar te benoemen, wanneer zijn belangen
      door een gedraging van de deelgenoten ernstig worden geschaad.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel193
  - number: '193.3'
    text: |-
      Voor de ontbonden gemeenschap van een maatschap of vennootschap zijn de leden 1 en 2 niet van toepassing en gelden
      de volgende zinnen. Een schuldeiser wiens vordering op de goederen van de gemeenschap kan worden verhaald, is
      bevoegd zich tegen verdeling van de gemeenschap te verzetten. Een verdeling die na dit verzet is tot stand gekomen,
      is vernietigbaar met dien verstande dat de vernietigingsgrond slechts kan worden ingeroepen door de schuldeiser
      die zich verzette en dat hij de verdeling slechts te zijnen behoeve kan vernietigen en niet verder dan nodig is tot
      opheffing van de door hem ondervonden benadeling.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel193
  - number: '194.1'
    text: Ieder der deelgenoten kan vorderen dat een verdeling aanvangt met een boedelbeschrijving.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel194
  - number: '194.2'
    text: |-
      Een deelgenoot die opzettelijk tot de gemeenschap behorende goederen verzwijgt, zoek maakt of verborgen houdt,
      verbeurt zijn aandeel in die goederen aan de andere deelgenoten.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel194
  - number: '195.1'
    text: |-
      Een verdeling waaraan niet alle deelgenoten en alle andere personen wier medewerking vereist was, hebben
      deelgenomen, is nietig, tenzij zij is geschied bij een notariële akte, in welk geval zij slechts kan worden
      vernietigd op vordering van degene die niet aan de verdeling heeft deelgenomen. Deze rechtsvordering verjaart door
      verloop van één jaar nadat de verdeling te zijner kennis gekomen is.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel195
  - number: '195.2'
    text: |-
      Heeft aan een verdeling iemand deelgenomen die niet tot de gemeenschap gerechtigd was, of is een deelgenoot bij de
      verdeling opgekomen voor een groter aandeel dan hem toekwam, dan kan het ten onrechte uitgekeerde ten behoeve van
      de gemeenschap worden teruggevorderd; voor het overige blijft de verdeling van kracht.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel195
  - number: '196.1'
    text: |-
      Behalve op de algemene voor vernietiging van rechtshandelingen geldende gronden is een verdeling ook vernietigbaar,
      wanneer een deelgenoot omtrent de waarde van een of meer der te verdelen goederen en schulden heeft gedwaald en
      daardoor voor meer dan een vierde gedeelte is benadeeld.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel196
  - number: '196.2'
    text: |-
      Wanneer een benadeling voor meer dan een vierde is bewezen, wordt de benadeelde vermoed omtrent de waarde van een
      of meer der te verdelen goederen en schulden te hebben gedwaald.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel196
  - number: '196.3'
    text: |-
      Om te beoordelen of benadeling heeft plaatsgehad, worden de goederen en schulden der gemeenschap geschat naar hun
      waarde op het tijdstip van de verdeling. Goederen en schulden die onverdeeld zijn gelaten worden niet meegerekend.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel196
  - number: '196.4'
    text: |-
      Een verdeling is niet op grond van dwaling omtrent de waarde van een of meer der te verdelen goederen en schulden
      vernietigbaar, indien de benadeelde de toedeling te zijnen bate of schade heeft aanvaard.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel196
  - number: '197'
    text: |-
      De bevoegdheid tot vernietiging van een verdeling uit hoofde van benadeling vervalt, wanneer de andere deelgenoten
      aan de benadeelde hetzij in geld, hetzij in natura opleggen hetgeen aan diens aandeel ontbrak.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel197
  - number: '198'
    text: |-
      Wordt een beroep in rechte op vernietigbaarheid van een verdeling gedaan, dan kan de rechter, onverminderd het in
      de [artikelen 53][ref1] en [54][ref2] bepaalde, op verlangen van een der partijen de verdeling wijzigen, in plaats
      van de vernietiging uit te spreken.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel54
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel198
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '53'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '54'
  - number: '199'
    text: |-
      Op een verdeling zijn de [artikelen 228-230 van Boek 6][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel228
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel199
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '228'
  - number: '200'
    text: Een rechtsvordering tot vernietiging van een verdeling vervalt door verloop van drie jaren na de verdeling.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel200
  - number: '201'
    text: |-
      Vruchtgebruik geeft het recht om goederen die aan een ander toebehoren, te gebruiken en daarvan de vruchten te
      genieten.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel201
  - number: '202'
    text: Vruchtgebruik ontstaat door vestiging of door verjaring.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel202
  - number: '203.1'
    text: |-
      Vruchtgebruik kan worden gevestigd ten behoeve van één persoon, ofwel ten behoeve van twee of meer personen hetzij
      gezamenlijk hetzij bij opvolging. In het laatste geval moeten ook de later geroepenen op het ogenblik van de
      vestiging bestaan.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel203
  - number: '203.2'
    text: |-
      Vruchtgebruik kan niet worden gevestigd voor langer dan het leven van de vruchtgebruiker. Vruchtgebruik ten behoeve
      van twee of meer personen wast bij het einde van het recht van een hunner bij dat van de anderen aan, bij ieder
      in evenredigheid van zijn aandeel, en eindigt eerst door het tenietgaan van het recht van de laatst overgeblevene,
      tenzij anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel203
  - number: '203.3'
    text: |-
      Is de vruchtgebruiker een rechtspersoon, dan eindigt het vruchtgebruik door ontbinding van de rechtspersoon, en in
      ieder geval na verloop van dertig jaren na de dag van vestiging.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel203
  - number: '205.1'
    text: |-
      Tenzij een bewind reeds tot een voldoende boedelbeschrijving heeft geleid of daartoe verplicht, moet de
      vruchtgebruiker in tegenwoordigheid of na behoorlijke oproeping van de hoofdgerechtigde een notariële beschrijving
      van de goederen opmaken. De beschrijving kan ondershands worden opgemaakt, indien de hoofdgerechtigde tegenwoordig
      is en hoofdgerechtigde en vruchtgebruiker een regeling hebben getroffen omtrent haar bewaring.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel205
  - number: '205.2'
    text: |-
      Zowel de vruchtgebruiker als de hoofdgerechtigde hebben het recht om in de beschrijving alle bijzonderheden te
      doen opnemen, die dienstig zijn om de toestand waarin de aan het vruchtgebruik onderworpen zaken zich bevinden, te
      doen kennen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel205
  - number: '205.3'
    text: |-
      De hoofdgerechtigde is bevoegd de levering en afgifte van de aan het vruchtgebruik onderworpen goederen op te
      schorten, indien de vruchtgebruiker niet terzelfder tijd zijn verplichting tot beschrijving nakomt.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel205
  - number: '205.4'
    text: |-
      De vruchtgebruiker moet jaarlijks aan de hoofdgerechtigde een ondertekende nauwkeurige opgave zenden van de
      goederen die niet meer aanwezig zijn, van de goederen die daarvoor in de plaats zijn gekomen, en van de voordelen
      die de goederen hebben opgeleverd en die geen vruchten zijn.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel205
  - number: '205.5'
    text: |-
      De vruchtgebruiker kan van de verplichtingen die ingevolge de voorgaande leden op hem rusten, niet worden
      vrijgesteld.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel205
  - number: '205.6'
    text: |-
      Tenzij anders is bepaald, komen de kosten van de beschrijving en van de in lid 4, bedoelde jaarlijkse opgave ten
      laste van de vruchtgebruiker.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel205
  - number: '206.1'
    text: |-
      De vruchtgebruiker moet voor de nakoming van zijn verplichtingen jegens de hoofdgerechtigde zekerheid stellen,
      tenzij hij hiervan is vrijgesteld of de belangen van de hoofdgerechtigde reeds voldoende zijn beveiligd door de
      instelling van een bewind.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel206
  - number: '206.2'
    text: |-
      Is de vruchtgebruiker van het stellen van zekerheid vrijgesteld, dan kan de hoofdgerechtigde jaarlijks verlangen
      dat hem de aan het vruchtgebruik onderworpen zaken worden getoond. Ten aanzien van waardepapieren en gelden kan,
      behoudens bijzondere omstandigheden, met overlegging van een verklaring van een geregistreerde krediet-instelling
      worden volstaan.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel206
  - number: '207.1'
    text: |-
      Een vruchtgebruiker mag de aan het vruchtgebruik onderworpen goederen gebruiken of verbruiken overeenkomstig de
      bij de vestiging van het vruchtgebruik gestelde regels of, bij gebreke van zodanige regels, met inachtneming van de
      aard van de goederen en de ten aanzien van het gebruik of verbruik bestaande plaatselijke gewoonten.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel207
  - number: '207.2'
    text: |-
      Een vruchtgebruiker is voorts bevoegd tot alle handelingen die tot een goed beheer van de aan het vruchtgebruik
      onderworpen goederen dienstig kunnen zijn. Tot alle overige handelingen ten aanzien van die goederen zijn de
      hoofdgerechtigde en de vruchtgebruiker slechts tezamen bevoegd.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel207
  - number: '207.3'
    text: |-
      Jegens de hoofdgerechtigde is de vruchtgebruiker verplicht ten aanzien van de aan het vruchtgebruik onderworpen
      goederen en het beheer daarover de zorg van een goed vruchtgebruiker in acht te nemen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel207
  - number: '208.1'
    text: |-
      Van zaken die aan het vruchtgebruik zijn onderworpen, mag de vruchtgebruiker de bestemming die deze bij de aanvang
      van het vruchtgebruik hadden, niet veranderen zonder toestemming van de hoofdgerechtigde of machtiging van de
      kantonrechter.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel208
  - number: '208.2'
    text: |-
      Tenzij in de akte van vestiging anders is bepaald, is de vruchtgebruiker van een zaak, zowel tijdens de duur van
      zijn recht als bij het einde daarvan, bevoegd om aan de zaak aangebrachte veranderingen en toevoegingen weg te
      nemen, mits hij de zaak in de oude toestand terugbrengt.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel208
  - number: '209.1'
    text: |-
      De vruchtgebruiker is verplicht het voorwerp van zijn vruchtgebruik ten behoeve van de hoofdgerechtigde te
      verzekeren tegen die gevaren, waartegen het gebruikelijk is een verzekering te sluiten. In ieder geval is de
      vruchtgebruiker, indien een gebouw aan zijn vruchtgebruik is onderworpen, verplicht dit tegen brand te verzekeren.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel209
  - number: '209.2'
    text: |-
      Voor zover de vruchtgebruiker aan de in het eerste lid omschreven verplichtingen niet voldoet, is de
      hoofdgerechtigde bevoegd zelf een verzekering te nemen en is de vruchtgebruiker verplicht hem de kosten daarvan
      te vergoeden.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel209
  - number: '210.1'
    text: |-
      Tenzij bij de vestiging anders is bepaald, is de vruchtgebruiker bevoegd in en buiten rechte nakoming te eisen van
      aan het vruchtgebruik onderworpen vorderingen en tot het in ontvangst nemen van betalingen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel210
  - number: '210.2'
    text: |-
      Tenzij bij de vestiging anders is bepaald, is hij tot ontbinding en opzegging van overeenkomsten slechts bevoegd,
      wanneer dit tot een goed beheer dienstig kan zijn.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel210
  - number: '210.3'
    text: |-
      De hoofdgerechtigde is slechts bevoegd de in de vorige leden genoemde bevoegdheden uit te oefenen, indien hij
      daartoe toestemming van de vruchtgebruiker of machtiging van de kantonrechter heeft gekregen. Tegen de machtiging
      van de kantonrechter krachtens dit lid is geen hogere voorziening toegelaten.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel210
  - number: '211.1'
    text: |-
      Ook wanneer bij de beschrijving of in een jaarlijkse opgave een of meer goederen die aan het vruchtgebruik
      onderworpen zijn, slechts naar hun soort zijn aangeduid, behoudt de hoofdgerechtigde daarop zijn recht.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel211
  - number: '211.2'
    text: De vruchtgebruiker is verplicht zodanige goederen afgescheiden van zijn overig vermogen te houden.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel211
  - number: '212.1'
    text: |-
      Voor zover de aan een vruchtgebruik onderworpen goederen bestemd zijn om vervreemd te worden, is de vruchtgebruiker
      tot vervreemding overeenkomstig hun bestemming bevoegd.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel212
  - number: '212.2'
    text: |-
      Bij de vestiging van het vruchtgebruik kan aan de vruchtgebruiker de bevoegdheid worden gegeven ook over
      andere dan de in het vorige lid genoemde goederen te beschikken. Ten aanzien van deze goederen vinden de
      [artikelen 208][ref1], [210 lid 2][ref2] en [217 lid 2, en 3, tweede zin, en lid 4][ref3], geen toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel208
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel210
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Artikel217
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel212
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '208'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '210'
      - id: ref3
        bwb_id: BWBR0005291
        artikel: '217'
  - number: '212.3'
    text: |-
      In andere gevallen mag een vruchtgebruiker slechts vervreemden of bezwaren met toestemming van de hoofdgerechtigde
      of machtiging van de kantonrechter. De machtiging wordt alleen gegeven, wanneer het belang van de vruchtgebruiker
      of de hoofdgerechtigde door de vervreemding of bezwaring wordt gediend en het belang van de ander daardoor niet
      wordt geschaad.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel212
  - number: '213.1'
    text: |-
      Hetgeen in de plaats van aan vruchtgebruik onderworpen goederen treedt doordat daarover bevoegdelijk wordt
      beschikt, behoort aan de hoofdgerechtigde toe en is eveneens aan het vruchtgebruik onderworpen. Hetzelfde is het
      geval met hetgeen door inning van aan vruchtgebruik onderworpen vorderingen wordt ontvangen, en met vorderingen tot
      vergoeding die in de plaats van aan vruchtgebruik onderworpen goederen treden, waaronder begrepen vorderingen ter
      zake van waardevermindering van die goederen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel213
  - number: '213.2'
    text: |-
      Ook zijn aan het vruchtgebruik onderworpen de voordelen die een goed tijdens het vruchtgebruik oplevert en die geen
      vruchten zijn.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel213
  - number: '214.1'
    text: |-
      Tenzij bij de vestiging anders is bepaald, moeten gelden die tot het vruchtgebruik behoren, in overleg met de
      hoofdgerechtigde vruchtdragend belegd of in het belang van de overige aan het vruchtgebruik onderworpen goederen
      besteed worden.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel214
  - number: '214.2'
    text: |-
      In geval van geschil omtrent hetgeen ten aanzien van de in het eerste lid bedoelde gelden dient te geschieden,
      beslist daaromtrent de persoon die bij de vestiging van het vruchtgebruik daartoe is aangewezen, of bij gebreke
      van een zodanige aanwijzing, de kantonrechter. Tegen een beschikking van de kantonrechter krachtens dit lid is geen
      hogere voorziening toegelaten.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel214
  - number: '215.1'
    text: |-
      Is bij de vestiging van een vruchtgebruik of daarna aan de vruchtgebruiker de bevoegdheid gegeven tot gehele of
      gedeeltelijke vervreemding en vertering van aan het vruchtgebruik onderworpen goederen, dan kan de hoofdgerechtigde
      bij het einde van het vruchtgebruik afgifte vorderen van de in vruchtgebruik gegeven goederen of hetgeen daarvoor
      in de plaats getreden is, voor zover de vruchtgebruiker of zijn rechtverkrijgenden niet bewijzen dat die goederen
      verteerd of door toeval tenietgegaan zijn.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel215
  - number: '215.2'
    text: |-
      Bij verlening van de bevoegdheid tot vervreemding en vertering kunnen een of meer personen worden aangewezen, wier
      toestemming voor de vervreemding en voor de vertering nodig is. Staat het vruchtgebruik onder bewind, dan zijn de
      vervreemding en de vertering van de medewerking van de bewindvoerder afhankelijk.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel215
  - number: '215.3'
    text: |-
      Is aan de vruchtgebruiker de bevoegdheid tot vervreemding en vertering verleend, dan mag hij de goederen ook voor
      gebruikelijke kleine geschenken bestemmen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel215
  - number: '216'
    text: |-
      De vruchtgebruiker komen alle vruchten toe, die tijdens het vruchtgebruik afgescheiden of opeisbaar worden. Bij de
      vestiging van het vruchtgebruik kan nader worden bepaald wat met betrekking tot het vruchtgebruik als vrucht moet
      worden beschouwd.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel216
  - number: '217.1'
    text: |-
      De vruchtgebruiker is bevoegd de aan het vruchtgebruik onderworpen zaken te verhuren of te verpachten, voor zover
      bij de vestiging van het vruchtgebruik niet anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel217
  - number: '217.2'
    text: |-
      Indien bij de vestiging van het vruchtgebruik een onroerende zaak niet verhuurd of verpacht was, kan de
      vruchtgebruiker niet verhuren of verpachten zonder toestemming van de hoofdgerechtigde of machtiging van de
      kantonrechter, tenzij de bevoegdheid daartoe hem bij de vestiging van het vruchtgebruik is toegekend.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel217
  - number: '217.3'
    text: |-
      Na het einde van het vruchtgebruik is de hoofdgerechtigde verplicht een bevoegdelijk aangegane huur of verpachting
      gestand te doen. Hij kan nochtans gestanddoening weigeren, voor zover zonder zijn toestemming hetzij de
      overeengekomen tijdsduur van de huur langer is dan met het plaatselijk gebruik overeenstemt of bedrijfsruimte in de
      zin van de [zesde afdeling van titel 4 van Boek 7][ref1] is verhuurd voor een langere tijd dan vijf jaren, hetzij
      de verpachting is geschied voor een langere duur dan twaalf jaren voor hoeven en zes jaren voor los land, hetzij de
      verhuring of verpachting is geschied op ongewone, voor hem bezwarende voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Afdeling6
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel217
    references:
      - id: ref1
        bwb_id: BWBR0005290
        afdeling: '6'
  - number: '217.4'
    text: |-
      De hoofdgerechtigde verliest de bevoegdheid gestanddoening te weigeren, wanneer de huurder of pachter hem een
      redelijke termijn heeft gesteld om zich omtrent de gestanddoening te verklaren en hij zich niet binnen deze termijn
      heeft uitgesproken.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel217
  - number: '217.5'
    text: |-
      Indien de hoofdgerechtigde volgens de vorige leden niet verplicht is tot gestanddoening van een door de
      vruchtgebruiker aangegane verhuring van woonruimte waarin de huurder bij het eindigen van het vruchtgebruik zijn
      hoofdverblijf heeft en waarop de [artikelen 271 tot en met 277 van Boek 7][ref1] van toepassing zijn, moet hij de
      huurovereenkomst niettemin met de huurder voortzetten met dien verstande dat [artikel 269 lid 2 van Boek 7][ref2],
      van overeenkomstige toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel271
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel269
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel217
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '271'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '269'
  - number: '218'
    text: |-
      Tot het instellen van rechtsvorderingen en het indienen van verzoeken ter verkrijging van een rechterlijke
      uitspraak die zowel het recht van de vruchtgebruiker als dat van de hoofdgerechtigde betreft, is ieder van hen
      bevoegd, mits hij zorg draagt dat de ander tijdig in het geding wordt geroepen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel218
  - number: '219'
    text: |-
      Buiten de gevallen, geregeld in de [artikelen 88][ref1] en [197 van Boek 2][ref2] en
      [artikel 123 van Boek 5][ref3], blijft de uitoefening van stemrecht, verbonden aan een goed dat aan vruchtgebruik
      is onderworpen, de hoofdgerechtigde toekomen, tenzij bij de vestiging van het vruchtgebruik anders is bepaald. Bij
      een vruchtgebruik als bedoeld in de [artikelen 19][ref4] en [21 van Boek 4][ref5] komt het stemrecht eveneens aan
      de vruchtgebruiker toe, tenzij bij de vestiging van het vruchtgebruik door partijen of door de kantonrechter op de
      voet van [artikel 23 lid 4 van Boek 4][ref6] anders wordt bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel88
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel197
      [ref3]: https://wetten.overheid.nl/BWBR0005288#Artikel123
      [ref4]: https://wetten.overheid.nl/BWBR0002761#Artikel19
      [ref5]: https://wetten.overheid.nl/BWBR0002761#Artikel21
      [ref6]: https://wetten.overheid.nl/BWBR0002761#Artikel23
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel219
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '88'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '197'
      - id: ref3
        bwb_id: BWBR0005288
        artikel: '123'
      - id: ref4
        bwb_id: BWBR0002761
        artikel: '19'
      - id: ref5
        bwb_id: BWBR0002761
        artikel: '21'
      - id: ref6
        bwb_id: BWBR0002761
        artikel: '23'
  - number: '220.1'
    text: |-
      Gewone lasten en herstellingen worden door de vruchtgebruiker gedragen en verricht. De vruchtgebruiker is
      verplicht, wanneer buitengewone herstellingen nodig zijn, aan de hoofdgerechtigde van deze noodzakelijkheid kennis
      te geven en hem gelegenheid te verschaffen tot het doen van deze herstellingen. De hoofdgerechtigde is niet tot het
      doen van enige herstelling verplicht.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel220
  - number: '220.2'
    text: |-
      Nochtans is een hoofdgerechtigde, aan wie tengevolge van een beperking in het genot van de vruchtgebruiker een
      deel van de vruchten toekomt, verplicht naar evenredigheid bij te dragen in de lasten en kosten, die volgens het
      voorgaande lid ten laste van de vruchtgebruiker komen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel220
  - number: '221.1'
    text: |-
      Indien de vruchtgebruiker in ernstige mate tekortschiet in de nakoming van zijn verplichtingen, kan de rechtbank op
      vordering van de hoofdgerechtigde aan deze het beheer toekennen of het vruchtgebruik onder bewind stellen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel221
  - number: '221.2'
    text: De rechtbank kan hangende het geding het vruchtgebruik bij voorraad onder bewind stellen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel221
  - number: '221.3'
    text: |-
      De rechtbank kan voor het bewind of beheer zodanige voorschriften geven als zij dienstig acht. Op het bewind zijn
      voor het overige de [artikelen 154][ref1], [157 tot en met 166][ref2], [168][ref3], [170][ref4], [172][ref5],
      [173][ref6], [174][ref7] en [177 lid 1 van Boek 4][ref8] van overeenkomstige toepassing, met dien verstande dat
      de kantonrechter de in [artikel 159 van Boek 4][ref9] bedoelde beloning ook op grond van bijzondere omstandigheden
      anders kan regelen, alsmede dat hij de in [artikel 160 van Boek 4][ref10] bedoelde zekerheidstelling te allen
      tijde kan bevelen. Het bewind kan door een gezamenlijk besluit van de vruchtgebruiker en de hoofdgerechtigde of op
      verzoek van een hunner door de rechtbank worden opgeheven.


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel154
      [ref2]: https://wetten.overheid.nl/BWBR0002761#Artikel157
      [ref3]: https://wetten.overheid.nl/BWBR0002761#Artikel168
      [ref4]: https://wetten.overheid.nl/BWBR0002761#Artikel170
      [ref5]: https://wetten.overheid.nl/BWBR0002761#Artikel172
      [ref6]: https://wetten.overheid.nl/BWBR0002761#Artikel173
      [ref7]: https://wetten.overheid.nl/BWBR0002761#Artikel174
      [ref8]: https://wetten.overheid.nl/BWBR0002761#Artikel177
      [ref9]: https://wetten.overheid.nl/BWBR0002761#Artikel159
      [ref10]: https://wetten.overheid.nl/BWBR0002761#Artikel160
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel221
