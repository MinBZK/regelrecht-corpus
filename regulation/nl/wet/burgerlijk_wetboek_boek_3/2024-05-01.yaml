        bwb_id: BWBR0002761
        artikel: '160'
  - number: '222.1'
    text: |-
      Wanneer een nalatenschap, onderneming of soortgelijke algemeenheid in vruchtgebruik is gegeven, kan de
      hoofdgerechtigde van de vruchtgebruiker verlangen dat de tot die algemeenheid behorende schulden uit de tot het
      vruchtgebruik behorende goederen worden voldaan of, voor zover de hoofdgerechtigde deze schulden uit eigen middelen
      heeft voldaan, dat hem het betaalde, vermeerderd met rente van de dag der betaling af, uit het vruchtgebruik wordt
      teruggegeven. Voldoet de vruchtgebruiker een schuld uit eigen vermogen, dan behoeft de hoofdgerechtigde hem het
      voorgeschotene eerst bij het einde van het vruchtgebruik terug te geven.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel222
  - number: '222.2'
    text: |-
      Het in het voorgaande lid bepaalde vindt overeenkomstige toepassing, wanneer het vruchtgebruik is gevestigd op
      bepaalde goederen en daarop buitengewone lasten drukken.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel222
  - number: '223'
    text: |-
      Een vruchtgebruiker kan zijn recht overdragen of bezwaren zonder dat daardoor de duur van het recht gewijzigd
      wordt. Naast de verkrijger is de oorspronkelijke vruchtgebruiker hoofdelijk voor alle uit het vruchtgebruik
      voortspruitende verplichtingen jegens de hoofdgerechtigde aansprakelijk. Is aan de oorspronkelijke vruchtgebruiker
      bij de vestiging van het vruchtgebruik een grotere bevoegdheid tot vervreemding, verbruik of vertering gegeven
      dan de wet aan de vruchtgebruiker toekent, dan komt die ruimere bevoegdheid niet aan de latere verkrijgers van het
      vruchtgebruik toe.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel223
  - number: '224'
    text: |-
      Indien een vruchtgebruiker uit hoofde van de aan het vruchtgebruik verbonden lasten en verplichtingen op zijn
      kosten afstand van zijn recht wil doen, is de hoofdgerechtigde gehouden hieraan mede te werken.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel224
  - number: '225'
    text: |-
      Na het eindigen van het vruchtgebruik rust op de vruchtgebruiker of zijn rechtverkrijgenden de verplichting de
      goederen ter beschikking van de hoofdgerechtigde te stellen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel225
  - number: '226.1'
    text: |-
      Op een recht van gebruik en een recht van bewoning vinden de regels betreffende vruchtgebruik overeenkomstige
      toepassing, behoudens de navolgende bepalingen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel226
  - number: '226.2'
    text: |-
      Indien enkel het recht van gebruik is verleend, heeft de rechthebbende de bevoegdheid de aan zijn recht onderworpen
      zaken te gebruiken en er de vruchten van te genieten, die hij voor zich en zijn gezin behoeft.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel226
  - number: '226.3'
    text: |-
      Indien enkel het recht van bewoning is verleend, heeft de rechthebbende de bevoegdheid de aan zijn recht
      onderworpen woning met zijn gezin te bewonen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel226
  - number: '226.4'
    text: |-
      Hij die een der in dit artikel omschreven rechten heeft, kan zijn recht niet vervreemden of bezwaren, noch de zaak
      door een ander laten gebruiken of de woning door een ander laten bewonen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel226
  - number: '227.1'
    text: |-
      Het recht van pand en het recht van hypotheek zijn beperkte rechten, strekkende om op de daaraan onderworpen
      goederen een vordering tot voldoening van een geldsom bij voorrang boven andere schuldeisers te verhalen. Is het
      recht op een registergoed gevestigd, dan is het een recht van hypotheek; is het recht op een ander goed gevestigd,
      dan is het een recht van pand.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel227
  - number: '227.2'
    text: Een recht van pand of hypotheek op een zaak strekt zich uit over al hetgeen de eigendom van de zaak omvat.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel227
  - number: '228'
    text: Op alle goederen die voor overdracht vatbaar zijn, kan een recht van pand hetzij van hypotheek worden gevestigd.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel228
  - number: '229.1'
    text: |-
      Het recht van pand of hypotheek brengt van rechtswege mee een recht van pand op alle vorderingen tot vergoeding
      die in de plaats van het verbonden goed treden, waaronder begrepen vorderingen ter zake van waardevermindering van
      het goed.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel229
  - number: '229.2'
    text: Dit pandrecht gaat boven ieder op de vordering gevestigd ander pandrecht.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel229
  - number: '230'
    text: |-
      Een recht van pand of hypotheek is ondeelbaar, zelfs dan wanneer de verbintenis waarvoor het recht is gevestigd,
      twee of meer schuldeisers of schuldenaars heeft en de verbintenis tussen hen wordt verdeeld.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel230
  - number: '231.1'
    text: |-
      Een recht van pand of hypotheek kan zowel voor een bestaande als voor een toekomstige vordering worden
      gevestigd. De vordering kan op naam, aan order of aan toonder luiden. Zij kan zowel een vordering op de pand- of
      hypotheekgever zelf als een vordering op een ander zijn.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel231
  - number: '231.2'
    text: De vordering waarvoor pand of hypotheek wordt gegeven, moet voldoende bepaalbaar zijn.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel231
  - number: '233.1'
    text: |-
      De pand- of hypotheekgever die niet tevens de schuldenaar is, is aansprakelijk voor waardevermindering van het
      goed, voor zover de waarborg van de schuldeiser daardoor in gevaar wordt gebracht en daarvan aan de pand- of
      hypotheekgever of aan een persoon waarvoor deze aansprakelijk is, een verwijt kan worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel233
  - number: '233.2'
    text: |-
      Door hem ten behoeve van het goed anders dan tot onderhoud daarvan gemaakte kosten kan hij van de pand- of
      hypotheekhouder terugvorderen, doch slechts indien deze zich op het goed heeft verhaald en voor zover genoemde
      kosten tot een hogere opbrengst van het goed te diens bate hebben geleid.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel233
  - number: '234.1'
    text: |-
      Indien voor een zelfde vordering zowel goederen van de schuldenaar als van een derde zijn verpand of
      verhypothekeerd, kan de derde, wanneer de schuldeiser tot executie overgaat, verlangen dat die van de schuldenaar
      mede in de verkoop worden begrepen en het eerst worden verkocht.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel234
  - number: '234.2'
    text: |-
      Zijn voor een zelfde vordering twee of meer goederen verpand of verhypothekeerd en rust op een daarvan een
      beperkt recht dat de schuldeiser bij de executie niet behoeft te eerbiedigen, dan heeft de beperkt gerechtigde een
      overeenkomstige bevoegdheid als in het eerste lid is vermeld.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel234
  - number: '234.3'
    text: |-
      Indien de schuldeiser weigert aan een op lid 1 of lid 2 gegrond verlangen te voldoen, kan de voorzieningenrechter
      van de rechtbank op verzoek van de meest gerede partij of, in geval van een hypotheek, van de notaris ten overstaan
      van wie de verkoop zal geschieden, op deze weigering beslissen. Het verzoek schorst de executie. Tegen een
      beschikking krachtens dit lid is geen hogere voorziening toegelaten.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel234
  - number: '235'
    text: |-
      Elk beding waarbij de pand- of hypotheekhouder de bevoegdheid wordt gegeven zich het verbonden goed toe te eigenen,
      is nietig.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel235
  - number: '236.1'
    text: |-
      Pandrecht op een roerende zaak, op een recht aan toonder of order, of op het vruchtgebruik van een zodanige zaak of
      recht, wordt gevestigd door de zaak of het toonder- of orderpapier te brengen in de macht van de pandhouder of van
      een derde omtrent wie partijen zijn overeengekomen. De vestiging van een pandrecht op een recht aan order of op het
      vruchtgebruik daarvan vereist tevens endossement.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel236
  - number: '236.2'
    text: |-
      Op andere goederen wordt pandrecht gevestigd op overeenkomstige wijze als voor de levering van het te verpanden
      goed is bepaald.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel236
  - number: '237.1'
    text: |-
      Pandrecht op een roerende zaak, op een recht aan toonder, of op het vruchtgebruik van een zodanige zaak of
      recht, kan ook worden gevestigd bij authentieke of geregistreerde onderhandse akte, zonder dat de zaak of het
      toonderpapier wordt gebracht in de macht van de pandhouder of van een derde.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel237
  - number: '237.2'
    text: |-
      De pandgever is verplicht in de akte te verklaren dat hij tot het verpanden van het goed bevoegd is alsmede hetzij
      dat op het goed geen beperkte rechten rusten, hetzij welke rechten daarop rusten.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel237
  - number: '237.3'
    text: |-
      Wanneer de pandgever of de schuldenaar in zijn verplichtingen jegens de pandhouder tekortschiet of hem goede grond
      geeft te vrezen dat in die verplichtingen zal worden tekortgeschoten, is deze bevoegd te vorderen dat de zaak of
      het toonderpapier in zijn macht of in die van een derde wordt gebracht. Rusten op het goed meer pandrechten, dan
      kan iedere pandhouder jegens wie de pandgever of de schuldenaar tekortschiet, deze bevoegdheid uitoefenen, met dien
      verstande dat een andere dan de hoogst gerangschikte slechts afgifte kan vorderen aan een tussen de gezamenlijke
      pandhouders overeengekomen of door de rechter aan te wijzen pandhouder of derde.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel237
  - number: '237.4'
    text: |-
      Wanneer de pandgever of de schuldenaar in zijn verplichtingen jegens de pandhouder die een bij voorbaat gevestigd
      pandrecht op te velde staande vruchten of beplantingen heeft, tekortschiet, kan de kantonrechter de pandhouder op
      diens verzoek machtigen zelf de te velde staande vruchten of beplantingen in te oogsten. Is de pandgever eigenaar
      van de grond of ontleent hij zijn recht op de vruchten of beplantingen aan een beperkt recht op de grond, dan kan
      de beschikking waarbij het verzoek wordt toegewezen, worden ingeschreven in de openbare registers.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel237
  - number: '237.5'
    text: Tegen een beschikking krachtens het vorige lid is geen hogere voorziening toegelaten.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel237
  - number: '238.1'
    text: |-
      Ondanks onbevoegdheid van de pandgever is de vestiging van een pandrecht op een roerende zaak, op een recht aan
      toonder of order of op het vruchtgebruik van een zodanige zaak of recht geldig, indien de pandhouder te goeder
      trouw is op het tijdstip waarop de zaak of het toonder- of geëndosseerde orderpapier in zijn macht of in die van
      een derde is gebracht.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel238
  - number: '238.2'
    text: |-
      Rust op een in lid 1 genoemd goed een beperkt recht dat de pandhouder op het in dat lid bedoelde tijdstip kent noch
      behoort te kennen, dan gaat het pandrecht in rang boven dit beperkte recht.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel238
  - number: '238.3'
    text: |-
      Wordt het pandrecht gevestigd op een roerende zaak waarvan de eigenaar het bezit door diefstal heeft verloren, of
      op een vruchtgebruik op een zodanige zaak, dan zijn [lid 3, aanhef en onder ][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel86
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel238
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '86'
        afdeling: '2'
  - number: '238.4'
    text: |-
      Dit artikel kan niet worden tegengeworpen aan degene die de zaak opeist, indien volgens
      [artikel 86a, leden 1 en 2][ref1] of [artikel 86b lid 1][ref2], of volgens [artikel 6.15 van de Erfgoedwet][ref3]
      ook [artikel 86][ref4] niet aan hem tegengeworpen zou kunnen worden.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel86a
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel86b
      [ref3]: https://wetten.overheid.nl/BWBR0037521#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0005291#Artikel86
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel238
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: 86a
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: 86b
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0037521
        artikel: '6'
      - id: ref4
        bwb_id: BWBR0005291
        artikel: '86'
        afdeling: '2'
  - number: '239.1'
    text: |-
      Pandrecht op een tegen een of meer bepaalde personen uit te oefenen recht dat niet aan toonder of order luidt, of
      op het vruchtgebruik van een zodanig recht kan ook worden gevestigd bij authentieke of geregistreerde onderhandse
      akte, zonder mededeling daarvan aan die personen, mits dit recht op het tijdstip van de vestiging van het pandrecht
      reeds bestaat of rechtstreeks zal worden verkregen uit een dan reeds bestaande rechtsverhouding.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel239
  - number: '239.2'
    text: |-
      Het[ tweede lid van artikel 237][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel237
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel239
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '237'
        afdeling: '2'
  - number: '239.3'
    text: |-
      Wanneer de pandgever of de schuldenaar in zijn verplichtingen jegens de pandhouder tekortschiet of hem goede
      grond geeft te vrezen dat in die verplichtingen zal worden tekortgeschoten, is deze bevoegd van de verpanding
      mededeling te doen aan de in het eerste lid genoemde personen. Pandhouder en pandgever kunnen overeenkomen dat deze
      bevoegdheid op een ander tijdstip ingaat.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel239
  - number: '239.4'
    text: |-
      [Artikel 88][ref1] geldt slechts voor de pandhouder wiens recht overeenkomstig lid 1 is gevestigd, indien hij te
      goeder trouw is op het tijdstip van de in lid 3 bedoelde mededeling.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel88
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel239
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '88'
        afdeling: '2'
  - number: '240'
    text: |-
      Pandrecht op een aandeel in een goed wordt gevestigd op overeenkomstige wijze en met overeenkomstige gevolgen als
      voorgeschreven ten aanzien van de vestiging van pandrecht op dat goed.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel240
  - number: '241'
    text: |-
      De pandhouder is verplicht desgevorderd aan de pandgever een schriftelijke verklaring af te geven van de aard en,
      voor zover mogelijk, het bedrag van de vordering waarvoor het verpande tot zekerheid strekt.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel241
  - number: '242'
    text: |-
      Een pandhouder is niet bevoegd het goed dat hij in pand heeft, te herverpanden, tenzij deze bevoegdheid hem
      ondubbelzinnig is toegekend.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel242
  - number: '243.1'
    text: |-
      Hij die uit hoofde van een pandrecht een zaak onder zich heeft, moet als een goed pandhouder voor de zaak
      zorgdragen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel243
  - number: '243.2'
    text: |-
      Door een pandhouder betaalde kosten tot behoud en tot onderhoud, met inbegrip van door hem betaalde aan het
      goed verbonden lasten, moeten hem door de pandgever worden terugbetaald; het pandrecht strekt mede tot zekerheid
      daarvoor. Andere door hem ten behoeve van het pand gemaakte kosten kan hij van de pandgever slechts terugvorderen,
      indien hij ze met diens toestemming heeft gemaakt, onverminderd diens aansprakelijkheid uit zaakwaarneming of
      ongerechtvaardigde verrijking.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel243
  - number: '244'
    text: |-
      Tenzij anders is bedongen, strekt een pandrecht tot zekerheid van een of meer bepaalde vorderingen tevens tot
      zekerheid voor drie jaren rente die over deze vorderingen krachtens overeenkomst of wet verschuldigd is.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel244
  - number: '245'
    text: |-
      Tot het instellen van rechtsvorderingen tegen derden ter bescherming van het verpande goed is zowel de pandhouder
      als de pandgever bevoegd, mits hij zorg draagt dat de ander tijdig in het geding wordt geroepen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel245
  - number: '246.1'
    text: |-
      Rust het pandrecht op een vordering, dan is de pandhouder bevoegd in en buiten rechte nakoming daarvan te eisen
      en betalingen in ontvangst te nemen. Deze bevoegdheden blijven bij de pandgever, zolang het pandrecht niet aan de
      schuldenaar van de vordering is medegedeeld.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel246
  - number: '246.2'
    text: |-
      Degene aan wie de in lid 1 bedoelde bevoegdheden toekomen, is tevens bevoegd tot opzegging, wanneer de vordering
      niet opeisbaar is, maar door opzegging opeisbaar gemaakt kan worden. Hij is jegens de ander gehouden niet nodeloos
      van deze bevoegdheid gebruik te maken.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel246
  - number: '246.3'
    text: |-
      Rust op de vordering meer dan één pandrecht, dan komen de in de vorige leden aan de pandhouder toegekende
      bevoegdheden alleen aan de hoogst gerangschikte pandhouder toe.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel246
  - number: '246.4'
    text: |-
      Na mededeling van de verpanding aan de schuldenaar kan de pandgever deze bevoegdheden slechts uitoefenen, indien
      hij daartoe toestemming van de pandhouder of machtiging van de kantonrechter heeft verkregen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel246
  - number: '246.5'
    text: |-
      Bij inning van een verpande vordering door de pandhouder of met machtiging van de kantonrechter door de pandgever
      komen de pandrechten waarmee de vordering bezwaard was, op het geïnde te rusten.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel246
  - number: '247'
    text: |-
      Buiten de gevallen, geregeld in de [artikelen 89][ref1] en [198 van Boek 2][ref2], blijft de uitoefening van
      stemrecht, verbonden aan een goed waarop een pandrecht rust, de pandgever toekomen, tenzij anders is bedongen.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel89
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel198
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel247
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '89'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '198'
  - number: '248.1'
    text: |-
      Wanneer de schuldenaar in verzuim is met de voldoening van hetgeen waarvoor het pand tot waarborg strekt, is de
      pandhouder bevoegd het verpande goed te verkopen en het hem verschuldigde op de opbrengst te verhalen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel248
  - number: '248.2'
    text: |-
      Partijen kunnen bedingen dat eerst tot verkoop kan worden overgegaan, nadat de rechter op vordering van de
      pandhouder heeft vastgesteld dat de schuldenaar in verzuim is.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel248
  - number: '248.3'
    text: |-
      Een lager gerangschikte pandhouder of beslaglegger kan het verpande goed slechts verkopen met handhaving van de
      hoger gerangschikte pandrechten.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel248
  - number: '249.1'
    text: |-
      Tenzij anders is bedongen, is een pandhouder die tot verkoop wil overgaan verplicht, voor zover hem dit
      redelijkerwijze mogelijk is, ten minste drie dagen tevoren de voorgenomen verkoop met vermelding van plaats en tijd
      op bij algemene maatregel van bestuur te bepalen wijze mede te delen aan de schuldenaar en de pandgever, alsmede
      aan hen die op het goed een beperkt recht hebben of daarop beslag hebben gelegd.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel249
  - number: '249.2'
    text: |-
      De aanzegging moet zo nauwkeurig mogelijk de som aangeven, waarvoor het pand kan worden gelost. Lossing kan tot op
      het tijdstip van de verkoop plaatsvinden, mits ook de reeds gemaakte kosten van executie worden voldaan.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel249
  - number: '250.1'
    text: De verkoop geschiedt in het openbaar naar de plaatselijke gewoonten en op de gebruikelijke voorwaarden.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel250
  - number: '250.2'
    text: |-
      Bestaat het pand uit goederen die op een markt of beurs verhandelbaar zijn, dan kan de verkoop geschieden op een
      markt door tussenkomst van een tussenpersoon in het vak of ter beurze door die van een bevoegde tussenpersoon
      overeenkomstig de regels en gebruiken die aldaar voor een gewone verkoop gelden.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel250
  - number: '250.3'
    text: De pandhouder is bevoegd mede te bieden.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel250
  - number: '251.1'
    text: |-
      Tenzij anders is bedongen, kan de voorzieningenrechter van de rechtbank op verzoek van de pandhouder of de
      pandgever bepalen dat het pand zal worden verkocht op een van het vorige artikel afwijkende wijze, of op verzoek
      van de pandhouder bepalen dat het pand voor een door de voorzieningenrechter van de rechtbank vast te stellen
      bedrag aan de pandhouder als koper zal verblijven.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel251
  - number: '251.2'
    text: |-
      Nadat de pandhouder bevoegd is geworden tot verkoop over te gaan, kunnen pandhouder en pandgever een van het vorige
      artikel afwijkende wijze van verkoop overeenkomen. Rust op het verpande goed een beperkt recht of een beslag, dan
      is daartoe tevens de medewerking van de beperkt gerechtigde of de beslaglegger vereist.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel251
  - number: '252'
    text: |-
      Tenzij anders is bedongen, is de pandhouder verplicht, voor zover hem dit redelijkerwijze mogelijk is, uiterlijk
      op de dag volgende op die van de verkoop daarvan op bij algemene maatregel van bestuur te bepalen wijze kennis te
      geven aan de schuldenaar en de pandgever, alsmede aan hen die op het goed een beperkt recht hebben of daarop beslag
      hebben gelegd.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel252
  - number: '253.1'
    text: |-
      De pandhouder houdt, na voldoening van de kosten van executie, van de netto-opbrengst af het aan hem verschuldigde
      bedrag waarvoor hij pandrecht heeft. Het overschot wordt aan de pandgever uitgekeerd. Zijn er pandhouders of andere
      beperkt gerechtigden, wier recht op het goed door de executie is vervallen, of hebben schuldeisers op het goed of
      op de opbrengst beslag gelegd, dan handelt de pandhouder overeenkomstig het bepaalde in [artikel 490][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel490b
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel253
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 490b
  - number: '253.2'
    text: |-
      De pandhouder kan de door hem aan de voormelde belanghebbenden uit te keren bedragen niet voldoen door
      verrekening, tenzij het een uitkering aan de pandgever betreft en deze uitkering niet plaats vindt gedurende diens
      faillissement, surséance, de toepassing ten aanzien van hem van de schuldsaneringsregeling natuurlijke personen
      of de vereffening van zijn nalatenschap. Is ten aanzien van de pandgever de schuldsaneringsregeling natuurlijke
      personen van toepassing, dan kan niettemin een uitkering aan de pandgever door verrekening worden voldaan indien
      het pandrecht is gevestigd na de uitspraak tot de toepassing van de schuldsaneringsregeling en zowel de vordering
      als de schuld na die uitspraak zijn ontstaan.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel253
  - number: '254.1'
    text: |-
      Wanneer op roerende zaken die volgens verkeersopvatting bestemd zijn om een bepaalde onroerende zaak duurzaam
      te dienen en door hun vorm als zodanig zijn te herkennen, of op machinerieën of werktuigen die bestemd zijn om
      daarmede een bedrijf in een bepaalde hiertoe ingerichte fabriek of werkplaats uit te oefenen, overeenkomstig
      [artikel 237][ref1] een pandrecht is gevestigd voor een vordering waarvoor ook hypotheek gevestigd is op die
      onroerende zaak, fabriek of werkplaats of op een daarop rustend beperkt recht, kan worden bedongen, dat de
      schuldeiser bevoegd is de verpande en verhypothekeerde goederen tezamen volgens de voor hypotheek geldende regels
      te executeren.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel237
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel254
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '237'
        afdeling: '2'
  - number: '254.2'
    text: |-
      Executeert de schuldeiser overeenkomstig het beding, dan zijn de artikelen 268-273 op het pandrecht van
      overeenkomstige toepassing en is de toepasselijkheid van de [artikelen 248-253][ref1] uitgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel248
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel254
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '248'
        afdeling: '2'
  - number: '254.3'
    text: |-
      Het beding kan, onder vermelding van de pandrechten waarop het betrekking heeft, worden ingeschreven in de
      registers waarin de hypotheek is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel254
  - number: '255.1'
    text: |-
      Bestaat het pand uit geld dan is de pandhouder, zodra zijn vordering opeisbaar is geworden, zonder voorafgaande
      aanzegging bevoegd zich uit het pand te voldoen overeenkomstig [artikel 253][ref1]. Hij is daartoe verplicht,
      indien de pandgever zulks vordert en deze bevoegd is de vordering in de verpande valuta te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel253
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel255
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '253'
        afdeling: '2'
  - number: '255.2'
    text: |-
      [Artikel 252][ref1] vindt overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel252
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel255
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '252'
        afdeling: '2'
  - number: '256'
    text: |-
      Wanneer een pandrecht is tenietgegaan, is de pandhouder verplicht te verrichten hetgeen zijnerzijds nodig is
      opdat de pandgever de hem toekomende feitelijke macht over het goed herkrijgt, en desverlangd aan de pandgever
      een schriftelijk bewijs te verstrekken dat het pandrecht geëindigd is. Is de vordering waarvoor het pandrecht
      tot zekerheid strekte met een beperkt recht bezwaard, dan rust een overeenkomstige verplichting op de beperkt
      gerechtigde.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel256
  - number: '257'
    text: |-
      Indien degene die uit hoofde van een pandrecht een zaak onder zich heeft, in ernstige mate in de zorg voor de zaak
      tekortschiet, kan de rechtbank op vordering van de pandgever of een pandhouder bevelen dat de zaak aan een van hen
      wordt afgegeven of in gerechtelijke bewaring van een derde wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel257
  - number: '258.1'
    text: |-
      Wanneer een in pand gegeven goed als bedoeld in [artikel 236 lid 1][ref1] in de macht van de pandgever komt,
      eindigt het pandrecht, tenzij het met toepassing van [artikel 237 lid 1][ref2] werd gevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel236
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel237
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel258
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '236'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '237'
        afdeling: '2'
  - number: '258.2'
    text: |-
      Afstand van een pandrecht kan geschieden bij enkele overeenkomst, mits van de toestemming van de pandhouder uit
      een schriftelijke of elektronische verklaring blijkt. Indien van de toestemming uit een elektronische verklaring
      blijkt, is [artikel 227a lid 1 van Boek 6][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel227a
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel258
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: 227a
  - number: '259.1'
    text: |-
      Wanneer iemand door het uitgeven van certificaten derden doet delen in de opbrengst van door hem op eigen naam
      verkregen aandelen of schuldvorderingen, hebben de certificaathouders een vordering tot uitkering van het hun
      toegezegde tegen de uitgever van de certificaten.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel259
  - number: '259.2'
    text: |-
      Zijn de oorspronkelijke aandelen of schuldvorderingen op naam gesteld en de certificaten uitgegeven met medewerking
      van de uitgever van de oorspronkelijke aandelen of schuldvorderingen of is er bij de statuten vergaderrecht
      verbonden aan de certificaten van aandelen, dan verkrijgen de certificaathouders tevens gezamenlijk een pandrecht
      op die aandelen of schuldvorderingen. Zijn de certificaten uitgegeven voor schuldvorderingen op naam zonder
      medewerking van de schuldenaar, dan verkrijgen de certificaathouders een zodanig pandrecht door mededeling van de
      uitgifte aan de schuldenaar. Zijn de certificaten uitgegeven voor aandelen of schuldvorderingen aan toonder, dan
      verkrijgen de certificaathouders een zodanig pandrecht, zonder dat het papier in de macht van de certificaathouders
      of een derde behoeft te worden gebracht.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel259
  - number: '259.3'
    text: |-
      Dit pandrecht geeft aan de certificaathouders alleen de bevoegdheid in geval van niet-uitbetaling van het
      hun verschuldigde met inachtneming van de volgende regels het pand geheel of gedeeltelijk te doen verkopen
      en zich uit de opbrengst te voldoen. Een certificaathouder die hiertoe wenst over te gaan, wendt zich tot de
      voorzieningenrechter van de rechtbank van het arrondissement waarin de woonplaats van degene die de certificaten
      heeft uitgegeven, is gelegen met verzoek een bewindvoerder over het pand te benoemen, die voor de verkoop en de
      verdeling van de opbrengst zorg draagt. Indien niet alle certificaathouders met de verkoop instemmen, wordt slechts
      een deel van het pand dat overeenkomt met het recht van de andere certificaathouders verkocht; de rechten van deze
      laatsten gaan door de verdeling van de opbrengst onder hen teniet. De voorzieningenrechter kan op verlangen van
      elke certificaathouder of ambtshalve maatregelen bevelen in het belang van de certificaathouders die niet met de
      verkoop hebben ingestemd, en bepalen dat de verkoop door hem moet worden goedgekeurd, wil zij geldig zijn.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel259
  - number: '260.1'
    text: |-
      Hypotheek wordt gevestigd door een tussen partijen opgemaakte notariële akte waarbij de hypotheekgever aan de
      hypotheekhouder hypotheek op een registergoed verleent, gevolgd door haar inschrijving in de daartoe bestemde
      openbare registers. De akte moet een aanduiding bevatten van de vordering waarvoor de hypotheek tot zekerheid
      strekt, of van de feiten aan de hand waarvan die vordering zal kunnen worden bepaald. Tevens moet het bedrag worden
      vermeld waarvoor de hypotheek wordt verleend of, wanneer dit bedrag nog niet vaststaat, het maximumbedrag dat uit
      hoofde van de hypotheek op het goed kan worden verhaald. De hypotheekhouder moet in de akte woonplaats kiezen in
      Nederland.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel260
  - number: '260.2'
    text: Tenzij anders is bedongen, komen de kosten van verlening en vestiging ten laste van de schuldenaar.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel260
  - number: '260.3'
    text: |-
      Bij de in het eerste lid bedoelde akte kan iemand slechts krachtens een bij authentieke akte verleende volmacht als
      gevolmachtigde voor de hypotheekgever optreden.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel260
  - number: '260.4'
    text: |-
      Voor het overige vinden de algemene voorschriften die voor vestiging van beperkte rechten op registergoederen
      gegeven zijn, ook op de vestiging van een hypotheek toepassing.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel260
  - number: '261.1'
    text: |-
      Is bij een koopovereenkomst hypotheek op het verkochte goed tot waarborg van onbetaalde kooppenningen bedongen
      en is dit beding in de leveringsakte vermeld, dan heeft deze hypotheek, mits de akte waarbij zij werd verleend
      tegelijk met de leveringsakte wordt ingeschreven, voorrang boven alle andere aan de koper ontleende rechten, ten
      aanzien waarvan tegelijk een inschrijving plaatsvond.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel261
  - number: '261.2'
    text: |-
      Lid 1 vindt overeenkomstig toepassing op een bij een verdeling bedongen hypotheek op een toegedeeld goed tot
      waarborg van hetgeen hij aan wie het goed is toegedeeld, aan de andere deelgenoten ten gevolge van de verdeling
      schuldig is of mocht worden.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel261
  - number: '262.1'
    text: |-
      Bij een notariële akte die in de registers wordt ingeschreven, kan worden bepaald dat een hypotheek ten aanzien van
      een of meer hypotheken op hetzelfde goed een hogere rang heeft dan haar volgens het tijdstip van haar inschrijving
      toekomt, mits uit de akte blijkt dat de gerechtigden tot die andere hypotheek of hypotheken daarin toestemmen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel262
  - number: '262.2'
    text: |-
      Met overeenkomstige toepassing van het eerste lid kan ook worden bepaald dat een hypotheek en een ander beperkt
      recht ten aanzien van elkaar worden geacht in andere volgorde te zijn ontstaan dan is geschied.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel262
  - number: '263.1'
    text: |-
      Tenzij in de hypotheekakte anders is bepaald, strekt een hypotheek tot zekerheid van een of meer bepaalde
      vorderingen tevens tot zekerheid voor drie jaren rente die daarover krachtens de wet verschuldigd is.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel263
  - number: '263.2'
    text: |-
      Een beding dat een hypotheek tot zekerheid van een of meer bepaalde vorderingen tevens strekt tot zekerheid van
      rente over een langer tijdvak dan drie jaren zonder vermelding van een maximumbedrag, is nietig.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel263
  - number: '264.1'
    text: |-
      Indien de hypotheekakte een uitdrukkelijk beding bevat waarbij de hypotheekgever in zijn bevoegdheid is beperkt,
      hetzij om het bezwaarde goed buiten toestemming van de hypotheekhouder te verhuren of te verpachten, hetzij ten
      aanzien van de wijze waarop of van de tijd gedurende welke het goed zal kunnen worden verhuurd of verpacht, hetzij
      ten aanzien van de vooruitbetaling van huur- of pachtpenningen, hetzij om het recht op de huur- of pachtpenningen
      te vervreemden of te verpanden, kan dit beding niet alleen tegen latere verkrijgers van het bezwaarde goed, maar
      ook tegen de huurder of pachter en tegen degene aan wie het recht op de huur- of pachtpenningen werd vervreemd
      of verpand, worden ingeroepen, zulks zowel door de hypotheekhouder, als na de uitwinning van het bezwaarde goed
      door de koper, dit laatste echter alleen voor zover deze bevoegdheid op het tijdstip van de verkoop nog aan de
      hypotheekhouder toekwam en deze de uitoefening daarvan blijkens de verkoopvoorwaarden aan de koper overlaat.
      De hypotheekhouder roept het huurbeding in voorafgaand aan de openbare verkoop van een tot bewoning bestemde
      onroerende zaak, een aandeel daarin of een beperkt recht daarop, tenzij er gegronde redenen zijn om aan te nemen
      dat:
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel264
  - number: 264.1.a
    text: de instandhouding van de huurovereenkomst in het belang is van de opbrengst bij de openbare verkoop; of
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel264
  - number: 264.1.b
    text: |-
      ook met instandhouding van de huurovereenkomst kennelijk een voldoende opbrengst zal worden verkregen om alle
      hypotheekhouders die het beding hebben gemaakt en dit jegens de huurder kunnen inroepen, te voldoen; of
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel264
  - number: 264.1.c
    text: |-
      er geen personen krachtens huurovereenkomst gebruik kunnen maken van het bezwaarde
      goed op het moment van bekendmaking van de executoriale verkoop, bedoeld in
      [artikel 516 van het Wetboek van Burgerlijke Rechtsvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel516
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel264
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '516'
  - number: '264.2'
    text: |-
      De inroeping kan niet geschieden, voordat het in [artikel 544 van het Wetboek van Burgerlijke Rechtsvordering][ref1]
      bedoelde exploit van aanzegging of overneming is uitgebracht. De bepalingen betreffende vernietigbaarheid zijn van
      toepassing met dien verstande dat de termijn van [artikel 52 lid 1][ref2] loopt vanaf de voormelde aanzegging of
      overneming en dat een in strijd met het beding gekomen rechtshandeling slechts wordt vernietigd ten behoeve van
      degene die het inroept, en niet verder dan met diens recht in overeenstemming is.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel544
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel52
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel264
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '544'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '52'
  - number: '264.3'
    text: |-
      Indien het beding is gemaakt met betrekking tot hoeven of los land, heeft het slechts werking voor zover het niet
      in strijd is met enig dwingend wettelijk voorschrift omtrent pacht. Zodanig beding heeft geen werking, voor zover
      de grondkamer bindend aan de pachtovereenkomst een daarmee strijdige inhoud heeft gegeven, dan wel het beding
      niet kon worden nageleefd, omdat de grondkamer een wijzigingsovereenkomst die aan het beding beantwoordde, heeft
      vernietigd. Een beding dat de hypotheekgever verplicht is hoeven voor kortere tijd dan twaalf jaren en los land
      voor kortere tijd dan zes jaren te verpachten, is nietig.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel264
  - number: '264.4'
    text: |-
      Indien het beding is gemaakt met betrekking tot huur van woonruimte of huur van bedrijfsruimte, heeft het slechts
      werking, voor zover het niet in strijd is met enig dwingend wettelijk voorschrift omtrent zodanige huur. Het
      beding dat de verhuur van woonruimte of bedrijfsruimte uitsluit, kan niet tegen de huurder worden ingeroepen, voor
      zover de woonruimte of bedrijfsruimte ten tijde van de vestiging van de hypotheek reeds was verhuurd en de nieuwe
      verhuring niet op ongewone, voor de hypotheekhouder meer bezwarende voorwaarden heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel264
  - number: '264.5'
    text: |-
      Voor zover een beroep op een beding tot gevolg zal hebben dat de huurder van woonruimte, waarop de
      [artikelen 271 tot en met 277 van Boek 7][ref1] van toepassing zijn, moet ontruimen, kan het beding slechts
      worden ingeroepen nadat de voorzieningenrechter van de rechtbank daartoe op verzoek van de hypotheekhouder
      verlof heeft verleend. Het verlof is niet vereist ten aanzien van een huurovereenkomst met vernietiging
      waarvan de huurder schriftelijk heeft ingestemd of die is tot stand gekomen na de bekendmaking, bedoeld in
      [artikel 516 van het Wetboek van Burgerlijke Rechtsvordering][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel271
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel516
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel264
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '271'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '516'
  - number: '264.6'
    text: |-
      De voorzieningenrechter verleent het verlof, tenzij ook met instandhouding van de huurovereenkomst kennelijk een
      voldoende opbrengst zal worden verkregen om alle hypotheekhouders die het beding hebben gemaakt en dit jegens de
      huurder kunnen inroepen, te voldoen. Zo hij het verlof verleent, veroordeelt hij tevens de opgeroepen of verschenen
      huurders en onderhuurders tot ontruiming en stelt hij een termijn vast van ten hoogste zes maanden na de betekening
      aan de huurder of onderhuurder van zijn beschikking, waarbinnen geen ontruiming mag plaatsvinden. Tegen een
      beschikking waarbij het verlof wordt verleend, staan geen hogere voorzieningen open.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel264
  - number: '264.7'
    text: |-
      Indien het recht van de huurder of pachter door vernietiging krachtens lid 2 verloren gaat, wordt aan hem uit de
      bij de executie verkregen netto-opbrengst van het goed met voorrang onmiddellijk na hen tegen wie hij zijn recht
      niet kon inroepen, een vergoeding uitgekeerd ten bedrage van de schade die hij als gevolg van de vernietiging
      lijdt. Is de koper bevoegd het beding in te roepen, dan wordt van hetgeen aan de schuldeisers met een lagere rang
      toekomt, een met de te verwachten schade overeenkomend bedrag gereserveerd, totdat vaststaat dat de koper van zijn
      bevoegdheid geen gebruik maakt.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel264
  - number: '264.8'
    text: |-
      Onder de huurder in de zin van dit artikel wordt begrepen degene die ingevolge [artikel 266 lid 1][ref1] of
      [artikel 267 lid 1 van Boek 7][ref2] medehuurder is.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel266
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel267
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel264
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '266'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '267'
  - number: '265'
    text: |-
      Indien de hypotheekakte een uitdrukkelijk beding bevat, volgens hetwelk de hypotheekgever de inrichting of gedaante
      van het bezwaarde goed niet of niet zonder toestemming van de hypotheekhouder mag veranderen, kan op dit beding
      geen beroep worden gedaan, wanneer tot de verandering machtiging is verleend aan de huurder door de kantonrechter
      op grond van de bepalingen betreffende huur of aan de pachter of verpachter door de grondkamer op grond van de
      bepalingen betreffende pacht.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel265
  - number: '266'
    text: |-
      Is een zaak aan hypotheek onderworpen en heeft de hypotheekgever hieraan na de vestiging van de hypotheek
      veranderingen of toevoegingen aangebracht zonder dat hij verplicht was deze mede tot onderpand voor de vordering
      te doen strekken, dan is hij bevoegd deze veranderingen en toevoegingen weg te nemen, mits hij de zaak in de oude
      toestand terugbrengt en desverlangd voor de tijd dat dit nog niet is geschied, ter zake van de waardevermindering
      zekerheid stelt. Degene die gerechtigd is tot te velde staande vruchten of beplantingen, is bevoegd deze in te
      oogsten; kon dit voor de executie niet geschieden dan zijn hij en de koper verplicht zich jegens elkaar te gedragen
      overeenkomstig de verplichtingen die afgaande en opkomende pachters op grond van de bepalingen betreffende pacht
      jegens elkaar hebben.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel266
  - number: '267.1'
    text: |-
      In de hypotheekakte kan worden bedongen dat de hypotheekhouder bevoegd is om het verhypothekeerde goed in beheer
      te nemen, indien de hypotheekgever in zijn verplichtingen jegens hem in ernstige mate te kort schiet en de
      voorzieningenrechter van de rechtbank hem machtiging verleent.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel267
  - number: '267.2'
    text: |-
      Eveneens kan in de hypotheekakte worden bedongen dat de hypotheekhouder bevoegd is de aan de hypotheek onderworpen
      zaak onder zich te nemen, indien zulks met het oog op de executie vereist is en de voorzieningenrechter hem
      machtiging verleent.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel267
  - number: '267.3'
    text: |-
      Zo de voorzieningenrechter de machtiging tot onder zich nemen verleent, veroordeelt hij tevens de hypotheekgever en
      de zijnen tot ontruiming.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel267
  - number: '267.4'
    text: |-
      De bevoegdheden kunnen tegen eenieder die zich in de zaak bevindt, met uitzondering van de huurder bedoeld in
      [artikel 264 leden 4 en 8][ref1], worden ingeroepen.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel264
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel267
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '264'
        afdeling: '4'
  - number: '267.5'
    text: Zonder uitdrukkelijke bedingen mist de hypotheekhouder de in de vorige leden genoemde bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel267
  - number: '267.6'
    text: De machtiging, bedoeld in de vorige leden, kan behalve door een advocaat ook door een notaris worden verzocht.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel267
  - number: 267a.1
    text: |-
      De hypotheekgever, alsmede eenieder die een tot bewoning bestemde onroerende zaak gebruikt, is verplicht te dulden
      dat aan de zaak de gebruikelijke kennisgevingen van het te koop zijn worden aangebracht, en aan belangstellenden
      gelegenheid te geven tot bezichtiging.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel267a
  - number: 267a.2
    text: |-
      De in lid 1 bedoelde verplichtingen gelden vanaf het moment van aanzegging van de executie, als bedoeld in
      [artikel 544 van het Wetboek van Burgerlijke Rechtsvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel544
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel267a
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '544'
  - number: 267a.3
    text: |-
      De hypotheekhouder kan in geval van weigering de bezichtiging doen plaatsvinden met toepassing van
      [artikel 550 van het Wetboek van Burgerlijke Rechtsvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel550
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel267a
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '550'
  - number: '268.1'
    text: |-
      Indien de schuldenaar in verzuim is met de voldoening van hetgeen waarvoor de hypotheek tot waarborg strekt, is de
      hypotheekhouder bevoegd het verbonden goed in het openbaar ten overstaan van een bevoegde notaris te doen verkopen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel268
  - number: '268.2'
    text: |-
      Op verzoek van de hypotheekhouder de hypotheekgever of degene die executoriaal beslag heeft gelegd kan de
      voorzieningenrechter van de rechtbank bepalen dat de verkoop ondershands zal geschieden bij een overeenkomst die
      hem bij het verzoek ter goedkeuring wordt voorgelegd. Indien door de hypotheekgever of door een hypotheekhouder,
      beslaglegger of beperkt gerechtigde, die bij een hogere opbrengst van het goed belang heeft, voor de afloop van
      de behandeling van het verzoek aan de voorzieningenrechter een gunstiger aanbod wordt voorgelegd, kan deze bepalen
      dat de verkoop overeenkomstig dit aanbod zal geschieden. Desverzocht veroordeelt de voorzieningenrechter bij de
      goedkeuring van een verzoek tot onderhandse verkoop tevens de hypotheekgever en de zijnen tot ontruiming van het
      verhypothekeerde goed tegen een bepaald tijdstip. De ontruiming vindt niet plaats voor het moment van inschrijving,
      bedoeld in [artikel 89 van Boek 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel89
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel268
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '89'
        afdeling: '2'
  - number: '268.3'
    text: |-
      Het in lid 2 bedoelde verzoek wordt ingediend door een advocaat of een notaris binnen de in het
      [Wetboek van Burgerlijke Rechtsvordering][ref1] daarvoor bepaalde termijn. Tegen een beschikking krachtens lid 2 is
      geen hogere voorziening toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel268
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '268.4'
    text: |-
      Een executie als in de vorige leden bedoeld geschiedt met inachtneming van de daarvoor in het
      [Wetboek van Burgerlijke Rechtsvordering][ref1] voorgeschreven formaliteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel268
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '268.5'
    text: |-
      De hypotheekhouder kan niet op andere wijze zijn verhaal op het verbonden goed uitoefenen. Een daartoe strekkend
      beding is nietig.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel268
  - number: '269'
    text: |-
      Tot op het tijdstip van de toewijzing ter veiling of van de goedkeuring door de voorzieningenrechter van de
      onderhandse verkoop kan de verkoop worden voorkomen door voldoening van hetgeen waarvoor de hypotheek tot waarborg
      strekt, alsmede van de reeds gemaakte kosten van executie.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel269
  - number: '270.1'
    text: |-
      De koper is gehouden de koopprijs te voldoen in handen van de notaris, te wiens overstaan de openbare verkoop heeft
      plaatsgevonden of door wie de akte van overdracht ingevolge de onderhandse verkoop is verleden. De kosten van de
      executie worden uit de koopprijs voldaan.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel270
  - number: '270.2'
    text: |-
      Wanneer geen hypotheken van een ander dan de verkoper zijn ingeschreven en geen schuldeiser op het goed of op de
      koopprijs beslag heeft gelegd of zijn vordering ontleent aan [artikel 264 lid 7][ref1], en evenmin door de executie
      een beperkt recht op het goed vervalt of een recht van een huurder of pachter verloren gaat, draagt de notaris
      aan de verkoper uit de netto-opbrengst van het goed af hetgeen aan deze blijkens een door hem aan de notaris te
      verstrekken verklaring krachtens zijn door hypotheek verzekerde vordering of vorderingen toekomt; het overschot
      keert de notaris uit aan hem wiens goed is verkocht.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel264
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel270
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '264'
        afdeling: '4'
  - number: '270.3'
    text: |-
      Zijn er meer hypotheekhouders of zijn er schuldeisers of beperkt gerechtigden als in het vorige lid bedoeld,
      dan stort de notaris de netto-opbrengst onverwijld bij een door hem aangewezen bewaarder die aan de eisen van
      [artikel 445 van het Wetboek van Burgerlijke Rechtsvordering][ref1] voldoet. Wanneer het goed door de eerste
      hypotheekhouder is verkocht en deze vóór of op de betaaldag aan de notaris een verklaring heeft overgelegd
      van hetgeen hem van de opbrengst toekomt krachtens de door de eerste hypotheek verzekerde vordering of andere
      vorderingen die eveneens door hypotheek zijn verzekerd en in rang onmiddellijk bij de eerste aansluiten, met
      vermelding van schuldeisers wier vordering boven de zijne rang neemt, blijft de storting nochtans achterwege voor
      hetgeen aan de verkoper blijkens deze verklaring toekomt, en keert de notaris dit aan deze uit. Deze verklaring
      moet zijn voorzien van een aantekening van de voorzieningenrechter van de rechtbank binnen welker rechtsgebied het
      verbonden goed zich geheel of grotendeels bevindt, inhoudende dat hij de verklaring heeft goedgekeurd, nadat hem
      summierlijk van de juistheid ervan is gebleken. De verklaring kan behalve door een advocaat ook door een notaris
      worden ingediend. Tegen de goedkeuring is geen hogere voorziening toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel445
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel270
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '445'
  - number: '270.4'
    text: |-
      Ingeval de notaris ernstige redenen heeft om te vermoeden dat de hem ingevolge de leden 2 of 3 verstrekte
      verklaring onjuist is, kan hij de uitkering aan de hypotheekhouder opschorten tot de in lid 3 aangewezen
      voorzieningenrechter op vordering van de meest gerede partij of op verlangen van de notaris omtrent de uitkering
      heeft beslist.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel270
  - number: '270.5'
    text: |-
      Wanneer de hypotheekhouders, de schuldeisers die op het goed of op de koopprijs beslag hebben gelegd of hun
      vorderingen ontlenen aan [artikel 264 lid 7][ref1], de beperkt gerechtigden wier recht door de executie vervalt,
      alsmede degene wiens goed is verkocht het vóór de betaaldag omtrent de verdeling van de te storten som eens zijn
      geworden, blijft de storting achterwege en keert de notaris aan ieder het hem toekomende uit.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel264
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel270
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '264'
        afdeling: '4'
  - number: '270.6'
    text: |-
      Voor zover de verplichtingen welke ingevolge dit artikel op de notaris rusten, niet worden nagekomen, is de Staat
      jegens belanghebbenden voor de daaruit voor hen voortvloeiende schade met de notaris hoofdelijk aansprakelijk.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel270
  - number: '270.7'
    text: Van het in dit artikel bepaalde kan in de verkoopvoorwaarden niet worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel270
  - number: '271.1'
    text: |-
      Na de betaling van de koopprijs zijn alle in het vijfde lid van het vorige artikel genoemde belanghebbenden
      bevoegd een gerechtelijke rangregeling te verzoeken om tot verdeling van de opbrengst te komen overeenkomstig de
      formaliteiten die in het [Wetboek van Burgerlijke Rechtsvordering][ref1] zijn voorgeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel271
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '271.2'
    text: |-
      Indien deze belanghebbenden met betrekking tot de verdeling alsnog tot overeenstemming komen en daarvan door een
      authentieke akte doen blijken aan de bewaarder bij wie de opbrengst is gestort, dan keert deze aan ieder het hem
      volgens deze akte toekomende uit.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel271
  - number: '272.1'
    text: |-
      Een verkoper die van de notaris betaling heeft ontvangen, is verplicht desverlangd aan hem wiens goed is verkocht,
      en aan de schuldenaar binnen één maand na de betaling rekening en verantwoording te doen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel272
  - number: '272.2'
    text: |-
      Een hypotheekhouder, een schuldeiser of een beperkt gerechtigde, die in de rangregeling is begrepen, kan binnen één
      maand na de sluiting daarvan gelijke rekening en verantwoording vragen, indien hij daarbij een rechtstreeks belang
      heeft.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel272
  - number: '273.1'
    text: |-
      Door de levering ingevolge een executoriale verkoop en de voldoening van de koopprijs gaan alle op het verkochte
      goed rustende hypotheken teniet en vervallen de ingeschreven beslagen, alsook de beperkte rechten die niet tegen de
      verkoper ingeroepen kunnen worden.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel273
  - number: '273.2'
    text: |-
      Wanneer de koper aan de voorzieningenrechter binnen welker rechtsgebied het verbonden goed zich geheel of
      grotendeels bevindt, de bewijsstukken overlegt, dat de verkoop met inachtneming van de wettelijke voorschriften
      heeft plaatsgehad en dat de koopprijs in handen van de notaris is gestort, wordt hem van het tenietgaan en
      vervallen van de in het vorige lid bedoelde hypotheken, beperkte rechten en beslagen een verklaring verstrekt.
      De verklaring kan ook namens de koper door een notaris worden verzocht. Tegen de beschikking die een zodanige
      verklaring inhoudt, is geen hogere voorziening toegelaten.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel273
  - number: '273.3'
    text: |-
      De verklaring kan bij of na de levering in de registers worden ingeschreven. Zij machtigt dan de bewaarder der
      registers tot doorhaling van de inschrijvingen betreffende hypotheken en beslagen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel273
  - number: '274.1'
    text: |-
      Wanneer een hypotheek is tenietgegaan, is de schuldeiser verplicht aan de rechthebbende op het bezwaarde goed op
      diens verzoek en op diens kosten bij authentieke akte een verklaring af te geven, dat de hypotheek is vervallen.
      Is de vordering waarvoor de hypotheek tot zekerheid strekte met een beperkt recht bezwaard, dan rust een
      overeenkomstige verplichting op de beperkt gerechtigde.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel274
  - number: '274.2'
    text: |-
      Deze verklaringen kunnen in de registers worden ingeschreven. Zij machtigen dan tezamen de bewaarder tot
      doorhaling.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel274
  - number: '274.3'
    text: |-
      Worden de vereiste verklaringen niet afgegeven, dan is [artikel 29][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel29
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel274
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '29'
        afdeling: '2'
  - number: '274.4'
    text: |-
      Is de hypotheek door vermenging tenietgegaan, dan wordt de bewaarder tot doorhaling gemachtigd door een daartoe
      strekkende verklaring, afgelegd bij authentieke akte door hem aan wie het goed toebehoort, tenzij op de vordering
      een beperkt recht rust.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel274
  - number: '275'
    text: Een volmacht tot het afleggen van een verklaring als bedoeld in het vorige artikel moet schriftelijk zijn verleend.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel275
  - number: '276'
    text: |-
      Tenzij de wet of een overeenkomst anders bepaalt, kan een schuldeiser zijn vordering op alle goederen van zijn
      schuldenaar verhalen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel276
  - number: '277.1'
    text: |-
      Schuldeisers hebben onderling een gelijk recht om, na voldoening van de kosten van executie, uit de netto-opbrengst
      van de goederen van hun schuldenaar te worden voldaan naar evenredigheid van ieders vordering, behoudens de door de
      wet erkende redenen van voorrang.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel277
  - number: '277.2'
    text: |-
      Bij overeenkomst van een schuldeiser met de schuldenaar kan worden bepaald dat zijn vordering jegens alle of
      bepaalde andere schuldeisers een lagere rang neemt dan de wet hem toekent.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel277
  - number: '278.1'
    text: Voorrang vloeit voort uit pand, hypotheek en voorrecht en uit de andere in de wet aangegeven gronden.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel278
  - number: '278.2'
    text: |-
      Voorrechten ontstaan alleen uit de wet. Zij rusten of op bepaalde goederen of op alle tot een vermogen behorende
      goederen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel278
  - number: '279'
    text: Pand en hypotheek gaan boven voorrecht, tenzij de wet anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel279
  - number: '280'
    text: |-
      Voorrechten op bepaalde goederen hebben voorrang boven die welke op alle tot een vermogen behorende goederen
      rusten, tenzij de wet anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel280
  - number: '281.1'
    text: Onderscheiden voorrechten die op hetzelfde bepaalde goed rusten, hebben gelijke rang, tenzij de wet anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel281
  - number: '281.2'
    text: De voorrechten op alle goederen worden uitgeoefend in de volgorde waarin de wet hen plaatst.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel281
  - number: '282.1'
    text: |-
      Indien door een executie een ander beperkt recht dan pand of hypotheek vervalt, omdat het niet kan worden
      ingeroepen tegen een pand- of hypotheekhouder of een beslaglegger op het goed, wordt aan de beperkt gerechtigde uit
      de netto-opbrengst van het goed, met voorrang onmiddellijk na de vorderingen van degenen tegen wie hij zijn recht
      niet kan inroepen, terzake van zijn schade een vergoeding uitgekeerd. De vergoeding wordt gesteld op het bedrag van
      de waarde die het vervallen recht, zo het bij de executie in stand zou zijn gebleven, ten tijde van de executie zou
      hebben gehad.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel282
  - number: '282.2'
    text: |-
      Indien in geval van executie een huurkoper van een onroerende zaak of een bestanddeel daarvan of een recht op die
      zaak niet kan inroepen tegen een hypotheekhouder of beslaglegger, wordt aan de huurkoper uit de netto-opbrengst van
      het goed, met voorrang onmiddellijk na de vorderingen van degenen tegen wie hij zijn recht niet kan inroepen, een
      vergoeding uitgekeerd ten bedrage van de schade die hij door de executie lijdt.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel282
  - number: '283'
    text: |-
      Een voorrecht op een bepaald goed strekt zich mede uit over vorderingen tot vergoedingen die in de plaats van dat
      goed zijn getreden, waaronder begrepen vorderingen ter zake van waardevermindering van het goed.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel283
  - number: '284.1'
    text: |-
      Een vordering tot voldoening van kosten, tot behoud van een goed gemaakt, is bevoorrecht op het goed dat aldus
      is behouden.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel284
  - number: '284.2'
    text: |-
      De schuldeiser kan de vordering op het goed verhalen, zonder dat hem rechten van derden op dit goed kunnen worden
      tegengeworpen, tenzij deze rechten na het maken van de kosten tot behoud zijn verkregen. Een na het maken van die
      kosten overeenkomstig [artikel 237][ref1] gevestigd pandrecht kan slechts aan de schuldeiser worden tegengeworpen,
      indien de zaak of het toonderpapier in de macht van de pandhouder of een derde is gebracht. Een na het maken van
      die kosten overeenkomstig [artikel 90][ref2] verkregen recht kan slechts aan de schuldeiser worden tegengeworpen,
      indien tevens aan de eisen van lid 2 van dat artikel is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel237
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel90
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel284
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '237'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '90'
        afdeling: '2'
  - number: '284.3'
    text: |-
      Het voorrecht heeft voorrang boven alle andere voorrechten, tenzij de vorderingen waaraan deze andere voorrechten
      zijn verbonden, na het maken van de kosten tot behoud zijn ontstaan.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel284
  - number: '285.1'
    text: |-
      Hij die uit hoofde van een overeenkomst tot aanneming van werk een vordering wegens bearbeiding van een zaak
      heeft, is deswege op die zaak bevoorrecht, mits hij persoonlijk aan de uitvoering van in de uitoefening van zijn
      bedrijf aangenomen werk pleegt deel te nemen dan wel een vennootschap of een rechtspersoon is, waarvan een of meer
      beherende vennoten of bestuurders dit plegen te doen. Het voorrecht vervalt na verloop van twee jaren sedert het
      ontstaan van de vordering.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel285
  - number: '285.2'
    text: |-
      Het voorrecht heeft voorrang boven een overeenkomstig [artikel 237][ref1] op de zaak gevestigd pandrecht, tenzij
      dit recht eerst na het ontstaan van de bevoorrechte vordering is gevestigd en de zaak in de macht van de pandhouder
      of een derde is gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel237
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel285
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '237'
        afdeling: '2'
  - number: '286.1'
    text: |-
      De door een appartementseigenaar of een vruchtgebruiker van een appartementsrecht aan de gezamenlijke
      appartementseigenaars of de vereniging van eigenaars verschuldigde, in het lopende of het voorafgaande kalenderjaar
      opeisbaar geworden bijdragen zijn bevoorrecht op het appartementsrecht.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel286
  - number: '286.2'
    text: |-
      In geval van bearbeiding van een gebouw dat in appartementen is verdeeld, rust het voorrecht van
      [artikel 285][ref1] op ieder appartement voor het bedrag, waarvoor de eigenaar van dat appartement aansprakelijk
      is.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel285
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel286
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '285'
        afdeling: '2'
  - number: '286.3'
    text: |-
      Bij samenloop van het voorrecht van het eerste lid en dat van [artikel 285][ref1] heeft het laatstgenoemde
      voorrang.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel285
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel286
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '285'
        afdeling: '2'
  - number: '287.1'
    text: |-
      De vordering tot vergoeding van schade is bevoorrecht op de vordering die de schuldenaar uit hoofde van verzekering
      van zijn aansprakelijkheid op de verzekeraar mocht hebben, voor zover deze vordering de verplichting tot vergoeding
      van deze schade betreft.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel287
  - number: '287.2'
    text: |-
      De schuldeiser kan zijn vordering verhalen op de vordering waarop het voorrecht rust, zonder dat hem andere rechten
      van derden op deze laatste vordering dan het ingevolge [artikel 936 lid 2 van Boek 7][ref1] aan de tussenpersoon
      toekomende recht op afdracht, kunnen worden tegengeworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel936
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel287
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '936'
  - number: '288'
    text: 'De bevoorrechte vorderingen op alle goederen zijn de vorderingen ter zake van:'
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel288
  - number: 288.a
    text: |-
      de kosten van de aanvraag tot faillietverklaring, doch alleen ter zake van het faillissement dat op de aanvraag
      is uitgesproken, alsmede van de kosten, door een schuldeiser gemaakt, ter verkrijging van vereffening buiten
      faillissement;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel288
  - number: 288.b
    text: de kosten van lijkbezorging, voor zover zij in overeenstemming zijn met de omstandigheden van de overledene;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel288
  - number: 288.c
    text: |-
      hetgeen een werknemer, een gewezen werknemer en hun nabestaanden ter zake van reeds vervallen termijnen van
      pensioen van de werkgever te vorderen hebben, voor zover de vordering niet ouder is dan een jaar;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel288
  - number: 288.d
    text: |-
      hetgeen waarop een werknemer, niet zijnde een bestuurder van de rechtspersoon bij wie hij in dienst is, een gewezen
      werknemer en hun nabestaanden ter zake van in de toekomst tot uitkering komende termijnen van pensioen jegens de
      werkgever recht hebben;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel288
  - number: 288.e
    text: |-
      al hetgeen een werknemer over het lopende en het voorafgaande kalenderjaar in geld op grond van de
      arbeidsovereenkomst van zijn werkgever te vorderen heeft, alsmede de bedragen door de werkgever aan de werknemer in
      verband met de beëindiging van de arbeidsovereenkomst verschuldigd uit hoofde van de bepalingen van het Burgerlijk
      Wetboek betreffende de arbeidsovereenkomst.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel288
  - number: '289.1'
    text: |-
      Eveneens bevoorrecht op alle goederen zijn de vorderingen die zijn ontstaan uit de oplegging van de in de artikelen
      49 en 50 van het Verdrag tot oprichting van de Europese Gemeenschap voor Kolen en Staal van 18 april 1951, (*Trb.*
      1951, 82) bedoelde heffingen en verhogingen wegens vertraging in de betaling van deze vorderingen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel289
  - number: '289.2'
    text: Dit voorrecht heeft dezelfde rang als het voorrecht terzake van de vordering wegens omzetbelasting.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel289
  - number: '290'
    text: |-
      Retentierecht is de bevoegdheid die in de bij de wet aangegeven gevallen aan een schuldeiser toekomt, om de
      nakoming van een verplichting tot afgifte van een zaak aan zijn schuldenaar op te schorten totdat de vordering
      wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel290
  - number: '291.1'
    text: |-
      De schuldeiser kan het retentierecht mede inroepen tegen derden die een recht op de zaak hebben verkregen, nadat
      zijn vordering was ontstaan en de zaak in zijn macht was gekomen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel291
  - number: '291.2'
    text: |-
      Hij kan het retentierecht ook inroepen tegen derden met een ouder recht, indien zijn vordering voortspruit uit een
      overeenkomst die de schuldenaar bevoegd was met betrekking tot de zaak aan te gaan, of hij geen reden had om aan de
      bevoegdheid van de schuldenaar te twijfelen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel291
  - number: '291.3'
    text: |-
      De schuldeiser kan het retentierecht niet inroepen tegen de minister van Onderwijs, Cultuur en Wetenschap die op
      grond van [artikel 6.15 van de Erfgoedwet][ref1] een rechtsvordering instelt.


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel6
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel291
    references:
      - id: ref1
        bwb_id: BWBR0037521
        artikel: '6'
  - number: '292'
    text: |-
      De schuldeiser kan zijn vordering op de zaak verhalen met voorrang boven allen tegen wie het retentierecht kan
      worden ingeroepen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel292
  - number: '293'
    text: |-
      Het retentierecht kan mede worden uitgeoefend voor de kosten die de schuldeiser heeft moeten maken ter zake van de
      zorg die hij krachtens de wet ten aanzien van de zaak in acht moet nemen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel293
  - number: '294'
    text: |-
      Het retentierecht eindigt doordat de zaak in de macht komt van de schuldenaar of de rechthebbende, tenzij de
      schuldeiser haar weer uit hoofde van dezelfde rechtsverhouding onder zich krijgt.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel294
  - number: '295'
    text: |-
      Raakt de zaak uit de macht van de schuldeiser, dan kan hij haar opeisen onder dezelfde voorwaarden als een
      eigenaar.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel295
  - number: '296.1'
    text: |-
      Tenzij uit de wet, uit de aard der verplichting of uit een rechtshandeling anders volgt, wordt hij die jegens een
      ander verplicht is iets te geven, te doen of na te laten, daartoe door de rechter, op vordering van de gerechtigde,
      veroordeeld.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel296
  - number: '296.2'
    text: |-
      Hij die onder een voorwaarde of een tijdsbepaling tot iets is gehouden, kan onder die voorwaarde of tijdsbepaling
      worden veroordeeld.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel296
  - number: '297'
    text: |-
      Indien een prestatie door tenuitvoerlegging van een executoriale titel wordt afgedwongen, heeft dit dezelfde
      rechtsgevolgen als die van een vrijwillige nakoming van de uit die titel blijkende verplichting tot die prestatie.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel297
  - number: '298'
    text: |-
      Vervolgen twee of meer schuldeisers ten aanzien van één goed met elkaar botsende rechten op levering, dan gaat in
      hun onderlinge verhouding het oudste recht op levering voor, tenzij uit de wet, uit de aard van hun rechten, of uit
      de eisen van redelijkheid en billijkheid anders voortvloeit.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel298
  - number: '299.1'
    text: |-
      Wanneer iemand niet verricht waartoe hij is gehouden, kan de rechter hem jegens wie de verplichting bestaat, op
      diens vordering machtigen om zelf datgene te bewerken waartoe nakoming zou hebben geleid.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel299
  - number: '299.2'
    text: |-
      Op gelijke wijze kan hij jegens wie een ander tot een nalaten is gehouden, worden gemachtigd om hetgeen in strijd
      met die verplichting is verricht, teniet te doen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel299
  - number: '299.3'
    text: |-
      De kosten die noodzakelijk zijn voor de uitvoering der machtiging, komen ten laste van hem die zijn verplichting
      niet is nagekomen. De uitspraak waarbij de machtiging wordt verleend, kan tevens de voldoening van deze kosten op
      vertoon van de daartoe nodige, in de uitspraak te vermelden bescheiden gelasten.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel299
  - number: '300.1'
    text: |-
      Is iemand jegens een ander gehouden een rechtshandeling te verrichten, dan kan, tenzij de aard van de
      rechtshandeling zich hiertegen verzet, de rechter op vordering van de gerechtigde bepalen dat zijn uitspraak
      dezelfde kracht heeft als een in wettige vorm opgemaakte akte van degene die tot de rechtshandeling gehouden
      is, of dat een door hem aan te wijzen vertegenwoordiger de handeling zal verrichten. Wijst de rechter een
      vertegenwoordiger aan, dan kan hij bepalen dat de door deze te verrichten handeling zijn goedkeuring behoeft.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel300
  - number: '300.2'
    text: |-
      Is de verweerder gehouden om tezamen met de eiser een akte op te maken, dan kan de rechter bepalen dat zijn
      uitspraak in de plaats van de akte of een deel daarvan zal treden.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel300
  - number: '301.1'
    text: |-
      Een uitspraak waarvan de rechter heeft bepaald dat zij in de plaats treedt van een tot levering van een
      registergoed bestemde akte of van een deel van een zodanige akte, kan slechts in de openbare registers worden
      ingeschreven, indien zij is betekend aan degene die tot de levering werd veroordeeld, en
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel301
  - number: 301.1.a
    text: in kracht van gewijsde is gegaan, of
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel301
  - number: 301.1.b
    text: |-
      uitvoerbaar bij voorraad is en een termijn van veertien dagen of zoveel korter of langer als in de uitspraak is
      bepaald, sedert de betekening van de uitspraak is verstreken.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel301
  - number: '301.2'
    text: |-
      Verzet, hoger beroep en cassatie moeten op straffe van niet-ontvankelijkheid binnen acht
      dagen na het instellen van het rechtsmiddel worden ingeschreven in de registers, bedoeld
      in [artikel 433 van het Wetboek van Burgerlijke Rechtsvordering][ref1]. In afwijking van
      [artikel 143 van dat wetboek][ref2] begint de verzettermijn te lopen vanaf de betekening van het vonnis aan de
      veroordeelde, ook als de betekening niet aan hem in persoon geschiedt.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel433
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel143
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel301
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '433'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '143'
  - number: '301.3'
    text: |-
      Indien de werking van een uitspraak als bedoeld in lid 1 door de rechter aan een voorwaarde is gebonden, weigert
      de bewaarder de inschrijving van die uitspraak, indien niet tevens een notariële verklaring of een authentiek
      afschrift daarvan wordt overgelegd, waaruit van de vervulling van de voorwaarde blijkt.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel301
  - number: '302'
    text: |-
      Op vordering van een bij een rechtsverhouding onmiddellijk betrokken persoon spreekt de rechter omtrent die
      rechtsverhouding een verklaring van recht uit.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel302
  - number: '303'
    text: Zonder voldoende belang komt niemand een rechtsvordering toe.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel303
  - number: '304'
    text: Een rechtsvordering kan niet van het recht tot welks bescherming zij dient, worden gescheiden.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel304
  - number: '305'
    text: |-
      De in de voorgaande artikelen van deze titel aan de rechter toegekende bevoegdheden komen mede aan scheidsmannen
      toe, tenzij partijen anders zijn overeengekomen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel305
  - number: 305a.1
    text: |-
      Een stichting of vereniging met volledige rechtsbevoegdheid kan een rechtsvordering instellen die strekt tot
      bescherming van gelijksoortige belangen van andere personen, voor zover zij deze belangen ingevolge haar statuten
      behartigt en deze belangen voldoende zijn gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel305a
  - number: 305a.2
    text: |-
      De belangen van de personen tot bescherming van wier belangen de rechtsvordering strekt, zijn voldoende
      gewaarborgd, wanneer de rechtspersoon als bedoeld in lid 1, voldoende representatief is, gelet op de achterban en
      de omvang van de vertegenwoordigde vorderingen en beschikt over:
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel305a
  - number: 305a.2.a
    text: |-
      een toezichthoudend orgaan, tenzij uitvoering is gegeven aan [artikel 44a lid 1][ref1] of
      [artikel 291a lid 1 van Boek 2 van het Burgerlijk Wetboek][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel44a
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel291a
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel305a
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 44a
      - id: ref2
        bwb_id: BWBR0003045
        artikel: 291a
  - number: 305a.2.b
    text: |-
      passende en doeltreffende mechanismen voor de deelname aan of vertegenwoordiging bij de besluitvorming van de
      personen tot bescherming van wier belangen de rechtsvordering strekt;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel305a
  - number: 305a.2.c
    text: |-
      voldoende middelen om de kosten voor het instellen van een rechtsvordering te dragen, waarbij de zeggenschap over
      de rechtsvordering in voldoende mate bij de rechtspersoon ligt;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel305a
  - number: 305a.2.d
    text: 'een algemeen toegankelijke internetpagina, waarop de volgende informatie beschikbaar is:'
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel305a
  - number: 305a.2.d.1°
    text: de statuten van de rechtspersoon;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel305a
  - number: 305a.2.d.2°
    text: de bestuursstructuur van de rechtspersoon;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel305a
  - number: 305a.2.d.3°
    text: |-
      de laatst vastgestelde jaarlijkse verantwoording op hoofdlijnen van het toezichthoudend orgaan over het door haar
      uitgevoerde toezicht;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel305a
  - number: 305a.2.d.4°
    text: het laatst vastgestelde bestuursverslag;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel305a
  - number: 305a.2.d.5°
    text: de bezoldiging van bestuurders en de leden van het toezichthoudend orgaan;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel305a
  - number: 305a.2.d.6°
    text: de doelstellingen en werkwijzen van de rechtspersoon;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel305a
  - number: 305a.2.d.7°
    text: een overzicht van de stand van zaken in lopende procedures en de resultaten daarvan;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel305a
  - number: 305a.2.d.8°
    text: |-
      indien een bijdrage wordt gevraagd van de personen tot bescherming van wier belangen de rechtsvordering strekt:
      inzicht in de berekening van deze bijdrage;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel305a
  - number: 305a.2.d.9°
    text: |-
      een overzicht van de wijze waarop personen tot bescherming van wier belangen de rechtsvordering strekt zich kunnen
      aansluiten bij de rechtspersoon en de wijze waarop zij deze aansluiting kunnen beëindigen;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel305a
  - number: 305a.2.e
    text: voldoende ervaring en deskundigheid ten aanzien van het instellen en voeren van de rechtsvordering;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel305a
  - number: 305a.2.f
    text: |-
      een financiering van de rechtsvordering die niet afkomstig is van een financier die een concurrent is van
      degene tegen wie de rechtsvordering zich richt of van een financier die afhankelijk is van degene tegen wie de
      rechtsvordering zich richt, indien het gaat om een rechtsvordering ter bescherming van een belang als bedoeld
      in artikel 2, eerste lid, van [Richtlijn (EU) 2020/1828](32020L1828) van het Europees Parlement en de Raad
      van 25 november 2020 betreffende representatieve vorderingen ter bescherming van de collectieve belangen van
      consumenten en tot intrekking van [Richtlijn 2009/22/EG](32009L0022) (PbEU 2020, L 409).
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel305a
  - number: 305a.3
    text: 'Een rechtspersoon als bedoeld in lid 1 is slechts ontvankelijk indien:'
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel305a
  - number: 305a.3.a
    text: |-
      de bestuurders betrokken bij de oprichting van de rechtspersoon, en hun opvolgers, geen rechtstreeks of middellijk
      winstoogmerk hebben, dat via de rechtspersoon wordt gerealiseerd;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel305a
  - number: 305a.3.b
    text: |-
      de rechtsvordering een voldoende nauwe band met de Nederlandse rechtssfeer heeft. Van een voldoende nauwe band met
      de Nederlandse rechtssfeer is sprake, wanneer:
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel305a
  - number: 305a.3.b.1°
    text: |-
      de rechtspersoon genoegzaam aannemelijk maakt dat het merendeel van de personen tot bescherming van wier belangen
      de rechtsvordering strekt, zijn gewone verblijfplaats in Nederland heeft; of
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel305a
  - number: 305a.3.b.2°
    text: |-
      degene tegen wie de rechtsvordering zich richt, woonplaats in Nederland heeft en bijkomende omstandigheden wijzen
      op voldoende verbondenheid met de Nederlandse rechtssfeer; of
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel305a
  - number: 305a.3.b.3°
    text: |-
      de gebeurtenis of de gebeurtenissen waarop de rechtsvordering betrekking heeft, in Nederland heeft of hebben
      plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel305a
  - number: 305a.3.c
    text: |-
      de rechtspersoon in de gegeven omstandigheden voldoende heeft getracht het gevorderde door het voeren van overleg
      met de verweerder te bereiken. Een termijn van twee weken na de ontvangst door de verweerder van een verzoek tot
      overleg onder vermelding van het gevorderde, is daarvoor in elk geval voldoende.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel305a
  - number: 305a.4
    text: |-
      Een rechtsvordering als bedoeld in lid 1 kan strekken tot veroordeling van de verweerder tot het openbaar maken of
      laten openbaar maken van de uitspraak, zulks op een door de rechter te bepalen wijze en op kosten van de door de
      rechter aan te geven partij of partijen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel305a
  - number: 305a.5
    text: |-
      Een rechtspersoon als bedoeld in lid 1 stelt een bestuursverslag en een jaarrekening op overeenkomstig
      het bepaalde voor verenigingen en stichtingen in respectievelijk de [artikelen 49][ref1] en
      [300 en in Titel 9 van Boek 2][ref2]. Onverminderd het in [titel 9][ref3] bepaalde, wordt het bestuursverslag
      binnen acht dagen na vaststelling op de algemene toegankelijke internetpagina van de rechtspersoon gepubliceerd.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel300
      [ref3]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel305a
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '49'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '300'
      - id: ref3
        bwb_id: BWBR0003045
  - number: 305a.6
    text: |-
      De rechter kan een rechtspersoon als bedoeld in lid 1, ontvankelijk verklaren, zonder dat aan de vereisten van
      lid 2, onderdelen a tot en met e, en lid 5 behoeft te zijn voldaan, wanneer de rechtsvordering wordt ingesteld met
      een ideëel doel en een zeer beperkt financieel belang of wanneer de aard van de vordering van de rechtspersoon als
      bedoeld in lid 1 of van de personen tot bescherming van wier belangen de rechtsvordering strekt, daartoe aanleiding
      geeft. Bij toepassing van dit lid kan de rechtsvordering niet strekken tot schadevergoeding in geld. Voor de
      toepassing van dit lid op een rechtsvordering ter bescherming van een belang als bedoeld in artikel 2, eerste lid,
      van [Richtlijn (EU) 2020/1828](32020L1828) van het Europees Parlement en de Raad van 25 november 2020 betreffende
      representatieve vorderingen ter bescherming van de collectieve belangen van consumenten en tot intrekking van
      [Richtlijn 2009/22/EG](32009L0022) (PbEU 2020, L 409), moet wel zijn voldaan aan de vereisten van lid 2, onderdelen
      c en d, aanhef en onder 7° en 8°.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel305a
  - number: 305a.7
    text: |-
      Er is een centraal register voor collectieve vorderingen als bedoeld in dit artikel. Dit register wordt gehouden
      door een bij algemene maatregel van bestuur aan te wijzen instantie.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel305a
  - number: 305b.1
    text: |-
      Een rechtspersoon als bedoeld in [artikel 1 van Boek 2][ref1] kan een rechtsvordering instellen die strekt tot
      bescherming van gelijksoortige belangen van andere personen, voor zover hem de behartiging van deze belangen is
      toevertrouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel1
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel305b
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '1'
  - number: 305b.2
    text: |-
      De [leden 3, aanhef en onderdeel c, en 4 van artikel 305a][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel305a
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel305b
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: 305a
  - number: 305c.1
    text: |-
      Een organisatie of openbaar lichaam met zetel buiten Nederland welke geplaatst is op de lijst, bedoeld in artikel
      5, eerste lid, van [Richtlijn (EU) 2020/1828](32020L1828) van het Europees Parlement en de Raad van 25 november
      2020 betreffende representatieve vorderingen ter bescherming van de collectieve belangen van consumenten en
      tot intrekking van [Richtlijn 2009/22/EG](32009L0022) (PbEU 2020, L 409), kan een rechtsvordering instellen die
      strekt tot bescherming van de gelijksoortige belangen van andere personen, voorzover de organisatie deze belangen
      ingevolge haar doelstelling behartigt of aan het openbaar lichaam de behartiging van deze belangen is toevertrouwd.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel305c
  - number: 305c.2
    text: |-
      __REF000___________________________________________________________________________________________________________
      _, is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel305a
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel305c
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: 305a
  - number: 305d.1
    text: |-
      Het gerechtshof Den Haag kan op verzoek van een stichting of vereniging met volledige rechtsbevoegdheid, die
      krachtens haar statuten tot taak heeft de bescherming van gelijksoortige belangen van andere personen:
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel305d
  - number: 305d.1.a
    text: |-
      bevelen dat degene die een overtreding pleegt van de wettelijke bepalingen, bedoeld in onderdeel a van de [bijlage
      bij de Wet handhaving consumentenbescherming](onbekend), die overtreding staakt;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel305d
  - number: 305d.1.b
    text: |-
      bevelen dat een gedragscode die een handelen in strijd met de [artikelen 193a tot en met 193i van Boek 6][ref1]
      bevordert door de houder van die gedragscode, bedoeld in [artikel 193a, onder i, van Boek 6][ref2], wordt
      aangepast;


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel193a
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel193a
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel305d
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: 193a
      - id: ref2
        bwb_id: BWBR0005289
        artikel: 193a
  - number: 305d.1.c
    text: |-
      de houder van de gedragscode die het handelen in strijd met de [artikelen 193a tot en met 193i van Boek 6][ref1]
      bevordert, veroordelen tot het openbaar maken of openbaar laten maken van de beschikking, bedoeld
      in de onderdelen a en b. Indien er sprake is van een misleidende handelspraktijk als bedoeld in de
      [artikelen 193c tot en met 193g van Boek 6][ref2], kan het gerechtshof op verzoek van de handelaar tevens
      veroordelen tot rectificatie van de informatie. De openbaarmaking of rectificatie geschiedt op een door het
      gerechtshof te bepalen wijze en op kosten van de door het gerechtshof aan te geven partij of partijen.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel193a
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel193c
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel305d
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: 193a
      - id: ref2
        bwb_id: BWBR0005289
        artikel: 193c
  - number: 305d.2
    text: |-
      [Artikel 305a lid 3, onderdeel (c)][ref1], is van overeenkomstige toepassing op een verzoek als bedoeld in het
      eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel305a
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel305d
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: 305a
  - number: 305d.3
    text: Het gerechtshof behandelt het verzoek onverwijld.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel305d
  - number: 305d.4
    text: |-
      Geschillen ter zake van de tenuitvoerlegging van de in lid 1 bedoelde veroordelingen, alsmede van de veroordeling
      tot betaling van een dwangsom, zo deze is opgelegd, worden bij uitsluiting door het gerechtshof Den Haag beslist.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel305d
  - number: 305e.1
    text: |-
      Onze Minister voor Rechtsbescherming wijst op aanvraag van een stichting of vereniging met volledige
      rechtsbevoegdheid met zetel in Nederland deze stichting of vereniging aan als bevoegde instantie als bedoeld
      in artikel 4, derde lid, van [Richtlijn (EU) 2020/1828](32020L1828) van het Europees Parlement en de Raad
      van 25 november 2020 betreffende representatieve vorderingen ter bescherming van de collectieve belangen van
      consumenten en tot intrekking van [Richtlijn 2009/22/EG](32009L0022) (PbEU 2020, L 409) voor het instellen van een
      rechtsvordering in een andere lidstaat van de Europese Unie of een andere staat die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte. De aanwijzing eindigt van rechtswege na vijf jaar.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel305e
  - number: 305e.2
    text: |-
      Onze Minister voor Rechtsbescherming wijst een stichting of vereniging aan als
      bedoeld in lid 1 indien de rechtspersoon voldoet aan de voorwaarden, genoemd in
      [artikel 305a, lid 2, onderdelen a, b en d, lid 3, onderdeel a, en lid 5][ref1] en uit de informatie op haar
      internetpagina blijkt:


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel305a
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel305e
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: 305a
  - number: 305e.2.a
    text: |-
      dat de rechtspersoon de in bijlage I van de richtlijn bedoelde belangen van natuurlijke personen die handelen voor
      doeleinden die geen verband houden met de handels-, bedrijfs-, ambachts- of beroepsactiviteit van die personen
      ingevolge haar statuten behartigt en deze belangen ook voor haar verzoek twaalf maanden daadwerkelijk openbaar
      heeft behartigd;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel305e
  - number: 305e.2.b
    text: wat de algemene financieringsbronnen van de rechtspersoon zijn;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel305e
  - number: 305e.2.c
    text: |-
      dat de rechtspersoon niet failliet is verklaard en geen verzoek tot faillietverklaring aanhangig is, aan de
      rechtspersoon geen surseance van betaling is verleend en de rechtspersoon niet probeert een akkoord te bereiken via
      de openbare akkoordprocedure als bedoeld in artikel 369, zesde lid, van de Faillissementswet.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel305e
  - number: 305e.3
    text: |-
      Bij de aanwijzing plaatst Onze Minister voor Rechtsbescherming de rechtspersoon op de lijst, bedoeld in artikel
      5, eerste lid, van de richtlijn. Onze Minister deelt de Europese Commissie de lijst met inbegrip van de naam en de
      doelstelling van de rechtspersoon mee.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel305e
  - number: 305e.4
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld voor het aanwijzen als bevoegde instantie en worden
      regels gesteld voor het intrekken en de duur van de aanwijzing. Bij ministeriële regeling worden regels gesteld
      over de kosten van de aanwijzing.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel305e
  - number: '306'
    text: Indien de wet niet anders bepaalt, verjaart een rechtsvordering door verloop van twintig jaren.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel306
  - number: '307.1'
    text: |-
      Een rechtsvordering tot nakoming van een verbintenis uit overeenkomst tot een geven of een doen verjaart door
      verloop van vijf jaren na de aanvang van de dag, volgende op die waarop de vordering opeisbaar is geworden.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel307
  - number: '307.2'
    text: |-
      In geval van een verbintenis tot nakoming na onbepaalde tijd loopt de in lid 1 bedoelde termijn pas van de aanvang
      van de dag, volgende op die waartegen de schuldeiser heeft medegedeeld tot opeising over te gaan, en verjaart de
      in lid 1 bedoelde rechtsvordering in elk geval door verloop van twintig jaren na de aanvang van de dag, volgende op
      die waartegen de opeising, zonodig na opzegging door de schuldeiser, op zijn vroegst mogelijk was.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel307
  - number: '308'
    text: |-
      Rechtsvorderingen tot betaling van renten van geldsommen, lijfrenten, dividenden, huren, pachten en voorts alles
      wat bij het jaar of een kortere termijn moet worden betaald, verjaren door verloop van vijf jaren na de aanvang van
      de dag, volgende op die waarop de vordering opeisbaar is geworden.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel308
  - number: '309'
    text: |-
      Een rechtsvordering uit onverschuldigde betaling verjaart door verloop van vijf jaren na de aanvang van de dag,
      volgende op die waarop de schuldeiser zowel met het bestaan van zijn vordering als met de persoon van de ontvanger
      is bekend geworden en in ieder geval twintig jaren nadat de vordering is ontstaan.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel309
  - number: '310.1'
    text: |-
      Een rechtsvordering tot vergoeding van schade of tot betaling van een bedongen boete verjaart door verloop van vijf
      jaren na de aanvang van de dag, volgende op die waarop de benadeelde zowel met de schade of de opeisbaarheid van
      de boete als met de daarvoor aansprakelijke persoon bekend is geworden, en in ieder geval door verloop van twintig
      jaren na de gebeurtenis waardoor de schade is veroorzaakt of de boete opeisbaar is geworden.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel310
  - number: '310.2'
    text: |-
      Is de schade een gevolg van verontreiniging van lucht, water of bodem, van de verwezenlijking van een
      gevaar als bedoeld in [artikel 175 van Boek 6][ref1] dan wel van beweging van de bodem als bedoeld in
      [artikel 177, eerste lid, onder b, van Boek 6][ref2], dan verjaart de rechtsvordering tot vergoeding van schade, in
      afwijking van het aan het slot van lid 1 bepaalde, in ieder geval door verloop van dertig jaren na de gebeurtenis
      waardoor de schade is veroorzaakt, met dien verstande dat deze termijn voor verjaring van de schade door beweging
      van de bodem als gevolg van de aanleg of exploitatie van een mijnbouwwerk ten behoeve van het winnen van gas uit
      het Groningenveld aanvangt na de laatste daardoor veroorzaakte bodembeweging.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel175
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel177
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel310
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '175'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '177'
  - number: '310.3'
    text: |-
      Voor de toepassing van lid 2 wordt onder gebeurtenis verstaan een plotseling optredend feit, een voortdurend feit
      of een opeenvolging van feiten met dezelfde oorzaak. Bestaat de gebeurtenis uit een voortdurend feit, dan begint de
      termijn van dertig jaren bedoeld in lid 2 te lopen nadat dit feit is opgehouden te bestaan. Bestaat de gebeurtenis
      uit een opeenvolging van feiten met dezelfde oorzaak, dan begint deze termijn te lopen na dit laatste feit.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel310
  - number: '310.4'
    text: |-
      Indien de gebeurtenis waardoor de schade is veroorzaakt, een strafbaar feit oplevert waarop de Nederlandse strafwet
      toepasselijk is, verjaart de rechtsvordering tot vergoeding van schade tegen de persoon die het strafbaar feit
      heeft begaan niet zolang het recht tot strafvordering niet door verjaring of door de dood van de aansprakelijke
      persoon is vervallen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel310
  - number: '310.5'
    text: |-
      In afwijking van de leden 1 en 2 verjaart een rechtsvordering tot vergoeding van schade door letsel of overlijden
      slechts door verloop van vijf jaren na de aanvang van de dag volgende op die waarop de benadeelde zowel met de
      schade als met de daarvoor aansprakelijke persoon bekend is geworden. Indien de benadeelde minderjarig was op
      de dag waarop de schade en de daarvoor aansprakelijke persoon bekend zijn geworden, verjaart de rechtsvordering
      slechts door verloop van vijf jaren na de aanvang van de dag volgende op die waarop de benadeelde meerderjarig
      is geworden.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel310
  - number: 310a.1
    text: |-
      Een rechtsvordering tot opeising van een roerende zaak die krachtens de nationale wetgeving van een lid-staat van
      de Europese Unie of van een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische
      Ruimte een cultuurgoed is in de zin van artikel 2, onder 1, van de richtlijn, bedoeld in [artikel 86a][ref1], en
      waarvan die staat teruggave vordert op de grond dat zij op onrechtmatige wijze buiten zijn grondgebied is gebracht,
      verjaart door verloop van drie jaren na de aanvang van de dag, volgende op die waarop de plaats waar de zaak zich
      bevindt en de identiteit van de bezitter of de houder aan de centrale autoriteit van die staat als bedoeld in
      artikel 4 van de richtlijn zijn bekend geworden, en in elk geval door verloop van dertig jaren na de aanvang van de
      dag volgende op die waarop de zaak buiten het grondgebied van die staat is gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel86a
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel310a
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: 86a
        afdeling: '2'
  - number: 310a.2
    text: |-
      De laatste termijn bedraagt vijfenzeventig jaren in het geval van zaken die deel uitmaken van openbare collecties
      in de zin van artikel 2, onder 8, van de richtlijn en van kerkelijke goederen als bedoeld in de richtlijn in de
      lid-staten van de Europese Unie of in de andere staten die partij zijn bij de Overeenkomst betreffende de Europese
      Economische Ruimte, waar deze zijn onderworpen aan speciale beschermende maatregelen krachtens nationaal recht.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel310a
  - number: 310b.1
    text: |-
      Een rechtsvordering tot opeising van een roerende zaak die krachtens de [Erfgoedwet][ref1] als beschermd
      cultuurgoed is aangewezen of deel uitmaakt van een openbare collectie of van een inventarislijst als bedoeld in
      [artikel 4.22, tweede lid, van die wet][ref2] en die na die aanwijzing of gedurende dit deel uitmaken uit het bezit
      van de eigenaar is geraakt, verjaart door verloop van vijf jaren na de aanvang van de dag waarop de plaats waar de
      zaak zich bevindt en de identiteit van de bezitter of de houder zijn bekend geworden, en in elk geval door verloop
      van dertig jaren na de aanvang van de dag waarop een niet-rechthebbende bezitter van de zaak is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0037521
      [ref2]: https://wetten.overheid.nl/BWBR0037521#Artikel4
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel310b
    references:
      - id: ref1
        bwb_id: BWBR0037521
      - id: ref2
        bwb_id: BWBR0037521
        artikel: '4'
  - number: 310b.2
    text: |-
      De verjaring krachtens lid 1 treedt in elk geval niet in voordat de rechtsvordering tot teruggave van de zaak is
      verjaard, die de Staat voor de rechter van een andere lid-staat van de Europese Unie of van een andere staat die
      partij is bij de Overeenkomst betreffende de Europese Economische Ruimte kan instellen op grond dat de zaak op
      onrechtmatige wijze buiten het grondgebied van Nederland is gebracht.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel310b
  - number: 310c.1
    text: |-
      Een rechtsvordering tot teruggave van een roerende zaak op grond van [artikel 6.7 van de Erfgoedwet][ref1] verjaart
      door verloop van vijf jaren na de aanvang van de dag volgende op die waarop de plaats waar de zaak zich bevindt
      en de identiteit van de bezitter of de houder zijn bekend geworden, en in elk geval door verloop van dertig jaren
      na de aanvang van de dag volgende op die waarop de zaak buiten het grondgebied is gebracht van de verdragsstaat
      waaruit de zaak afkomstig is.


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel6
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel310c
    references:
      - id: ref1
        bwb_id: BWBR0037521
        artikel: '6'
  - number: 310c.2
    text: |-
      De laatste termijn bedraagt vijfenzeventig jaren in geval van zaken die deel uitmaken van openbare collecties, die
      vermeld staan in de inventarissen van musea, archieven en vaste collecties van bibliotheken of van de inventaris
      van een kerkelijke instelling. Onder openbare collecties wordt in dit lid verstaan een collectie die eigendom is
      van een verdragsstaat, een lokale of regionale overheid van een verdragsstaat of een instelling op het grondgebied
      van een verdragsstaat die overeenkomstig de wetgeving van die verdragsstaat als openbaar wordt aangemerkt en die
      eigendom is van of in grote mate wordt gefinancierd door die verdragsstaat of een lokale of regionale overheid van
      die staat.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel310c
  - number: 310d
    text: |-
      Een rechtsvordering tot bescherming van een bedrijfsgeheim als bedoeld in [artikel 5][ref1], [6][ref2] en
      [9 van de Wet bescherming bedrijfsgeheimen][ref3] verjaart door verloop van vijf jaren na de aanvang van de dag,
      volgende op die waarop de houder van het bedrijfsgeheim bekend is geworden met de inbreuk op het bedrijfsgeheim, en
      in ieder geval door verloop van twintig jaren na de aanvang van de dag dat de inbreuk is begonnen.


      [ref1]: https://wetten.overheid.nl/BWBR0041459#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0041459#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0041459#Artikel9
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel310d
    references:
      - id: ref1
        bwb_id: BWBR0041459
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0041459
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0041459
        artikel: '9'
  - number: '311.1'
    text: |-
      Een rechtsvordering tot ontbinding van een overeenkomst op grond van een tekortkoming in de nakoming daarvan of
      tot herstel van een tekortkoming verjaart door verloop van vijf jaren na de aanvang van de dag, volgende op die
      waarop de schuldeiser met de tekortkoming bekend is geworden en in ieder geval twintig jaren nadat de tekortkoming
      is ontstaan.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel311
  - number: '311.2'
    text: |-
      Een rechtsvordering tot ongedaanmaking als bedoeld in [artikel 271 van Boek 6][ref1] verjaart door verloop van vijf
      jaren na de aanvang van de dag, volgende op die waarop de overeenkomst is ontbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel271
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel311
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '271'
  - number: '312'
    text: |-
      Rechtsvorderingen terzake van een tekortkoming in de nakoming, alsmede die tot betaling van wettelijke of
      bedongen rente en die tot afgifte van vruchten, verjaren, behoudens stuiting of verlenging, niet later dan
      de rechtsvordering tot nakoming van de hoofdverplichting of, zo de tekortkoming vatbaar is voor herstel, de
      rechtsvordering tot herstel van de tekortkoming.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel312
  - number: '313'
    text: |-
      Indien de wet niet anders bepaalt, begint de termijn van verjaring van een rechtsvordering tot nakoming van een
      verplichting om te geven of te doen met de aanvang van de dag, volgende op die waarop de onmiddellijke nakoming kan
      worden gevorderd.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel313
  - number: '314.1'
    text: |-
      De termijn van verjaring van een rechtsvordering tot opheffing van een onrechtmatige toestand begint met de aanvang
      van de dag, volgende op die waarop de onmiddellijke opheffing van die toestand gevorderd kan worden.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel314
  - number: '314.2'
    text: |-
      De termijn van verjaring van een rechtsvordering strekkende tot beëindiging van het bezit van een niet-
      rechthebbende begint met de aanvang van de dag, volgende op die waarop een niet-rechthebbende bezitter is geworden
      of de onmiddellijke opheffing gevorderd kon worden van de toestand waarvan diens bezit de voortzetting vormt.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel314
  - number: '315'
    text: |-
      De termijn van verjaring van een rechtsvordering tot opeising van een nalatenschap begint met de aanvang van de
      dag, volgende op die van het overlijden van de erflater.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel315
  - number: '316.1'
    text: |-
      De verjaring van een rechtsvordering wordt gestuit door het instellen van een eis, alsmede door iedere andere daad
      van rechtsvervolging van de zijde van de gerechtigde, die in de vereiste vorm geschiedt.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel316
  - number: '316.2'
    text: |-
      Leidt een ingestelde eis niet tot toewijzing, dan is de verjaring slechts gestuit, indien binnen zes maanden, nadat
      het geding door het in kracht van gewijsde gaan van een uitspraak of op andere wijze is geëindigd, een nieuwe eis
      wordt ingesteld en deze alsnog tot toewijzing leidt. Wordt een daad van rechtsvervolging ingetrokken, dan stuit zij
      de verjaring niet.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel316
  - number: '316.3'
    text: |-
      De verjaring van een rechtsvordering wordt ook gestuit door een handeling, strekkende tot verkrijging van een
      bindend advies, mits van die handeling met bekwame spoed mededeling wordt gedaan aan de wederpartij en zij tot
      verkrijging van een bindend advies leidt. Is dit laatste niet het geval, dan is het vorige lid van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel316
  - number: '316.4'
    text: |-
      De verjaring van een rechtsvordering wordt ook gestuit door een ingestelde eis die niet tot toewijzing leidt,
      indien:
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel316
  - number: 316.4.a)
    text: |-
      het scheidsgerecht zich onbevoegd heeft verklaard op grond van
      [artikel 1052, vijfde lid, van het Wetboek van Burgerlijke Rechtsvordering][ref1] en die uitspraak in kracht van
      gewijsde is gegaan; of


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel1052
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel316
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '1052'
  - number: 316.4.b)
    text: |-
      de rechter zich onbevoegd heeft verklaard op grond van [artikel 1022, eerste lid][ref1], [1067][ref2] of
      [1074d van het Wetboek van Burgerlijke Rechtsvordering][ref3] en die uitspraak in kracht van gewijsde is gegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel1022
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel1067
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel1074d
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel316
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '1022'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '1067'
      - id: ref3
        bwb_id: BWBR0001827
        artikel: 1074d
  - number: '317.1'
    text: |-
      De verjaring van een rechtsvordering tot nakoming van een verbintenis wordt gestuit door een schriftelijke
      aanmaning of door een schriftelijke mededeling waarin de schuldeiser zich ondubbelzinnig zijn recht op nakoming
      voorbehoudt.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel317
  - number: '317.2'
    text: |-
      De verjaring van andere rechtsvorderingen wordt gestuit door een schriftelijke aanmaning, indien deze binnen zes
      maanden wordt gevolgd door een stuitingshandeling als in het vorige artikel omschreven.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel317
  - number: '318'
    text: |-
      Erkenning van het recht tot welks bescherming een rechtsvordering dient, stuit de verjaring van de rechtsvordering
      tegen hem die het recht erkent.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel318
  - number: '319.1'
    text: |-
      Door stuiting van de verjaring van een rechtsvordering, anders dan door het instellen van een eis die door
      toewijzing wordt gevolgd, begint een nieuwe verjaringstermijn te lopen met de aanvang van de volgende dag. Is een
      bindend advies gevraagd en verkregen, dan begint de nieuwe verjaringstermijn te lopen met de aanvang van de dag,
      volgende op die waarop het bindend advies is uitgebracht.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel319
  - number: '319.2'
    text: |-
      De nieuwe verjaringstermijn is gelijk aan de oorspronkelijke, doch niet langer dan vijf jaren. Niettemin treedt
      de verjaring in geen geval op een eerder tijdstip in dan waarop ook de oorspronkelijke termijn zonder stuiting zou
      zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel319
  - number: '319.3'
    text: |-
      Door stuiting van de verjaring van een rechtsvordering op grond van [artikel 316, lid 4][ref1], begint een nieuwe
      verjaringstermijn te lopen met aanvang van de dag volgende op de dag van de uitspraak die in kracht van gewijsde
      is gegaan. De nieuwe verjaringstermijn is gelijk aan de oorspronkelijke verjaringstermijn, doch niet langer dan
      vijf jaren. Niettemin treedt de verjaring in geen geval op een eerder tijdstip in dan waarop ook de oorspronkelijke
      termijn zonder stuiting zou zijn verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel316
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel319
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '316'
  - number: '320'
    text: |-
      Wanneer een verjaringstermijn zou aflopen tijdens het bestaan van een verlengingsgrond of binnen zes maanden na
      het verdwijnen van een zodanige grond, loopt de termijn voort totdat zes maanden na het verdwijnen van die grond
      zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel320
  - number: '321.1'
    text: 'Een grond voor verlenging van de verjaring bestaat:'
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel321
  - number: 321.1.a
    text: tussen niet van tafel en bed gescheiden echtgenoten;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel321
  - number: 321.1.b
    text: tussen een wettelijke vertegenwoordiger en de onbekwame die hij vertegenwoordigt;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel321
  - number: 321.1.c
    text: |-
      tussen een bewindvoerder en de rechtshebbende voor wie hij het bewind voert, ter zake van vorderingen die dit
      bewind betreffen;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel321
  - number: 321.1.d
    text: tussen rechtspersonen en haar bestuurders;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel321
  - number: 321.1.e
    text: tussen een beneficiair aanvaarde nalatenschap en een erfgenaam;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel321
  - number: 321.1.f
    text: |-
      tussen de schuldeiser en zijn schuldenaar die opzettelijk het bestaan van de schuld of de opeisbaarheid daarvan
      verborgen houdt;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel321
  - number: 321.1.g
    text: tussen geregistreerde partners.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel321
  - number: '321.2'
    text: |-
      De onder *b* en *c* genoemde gronden voor verlenging duren voort totdat de eindrekening van de wettelijke
      vertegenwoordiger of de bewindvoerder is gesloten.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel321
  - number: '322.1'
    text: De rechter mag niet ambtshalve het middel van verjaring toepassen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel322
  - number: '322.2'
    text: Afstand van verjaring geschiedt door een verklaring van hem die de verjaring kan inroepen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel322
  - number: '322.3'
    text: Voordat de verjaring voltooid is, kan geen afstand van verjaring worden gedaan.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel322
  - number: '323.1'
    text: |-
      Door voltooiing van de verjaring van de rechtsvordering tot nakoming van een verbintenis gaan de pand- of
      hypotheekrechten die tot zekerheid daarvan strekken, teniet.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel323
  - number: '323.2'
    text: |-
      Nochtans verhindert de verjaring niet dat het pandrecht op het verbonden goed wordt uitgeoefend, indien dit bestaat
      in een roerende zaak of een recht aan toonder of order en deze zaak of het toonder- of orderpapier in de macht van
      de pandhouder of een derde is gebracht.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel323
  - number: '323.3'
    text: |-
      De rechtsvordering tot nakoming van een verbintenis tot zekerheid waarvan een hypotheek strekt, verjaart
      niet voordat twintig jaren zijn verstreken na de aanvang van de dag volgend op die waarop de hypotheek aan de
      verbintenis is verbonden.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel323
  - number: '324.1'
    text: |-
      De bevoegdheid tot tenuitvoerlegging van een rechterlijke of arbitrale uitspraak verjaart door verloop van twintig
      jaren na de aanvang van de dag, volgende op die van de uitspraak, of, indien voor tenuitvoerlegging daarvan
      vereisten zijn gesteld waarvan de vervulling niet afhankelijk is van de wil van degene die de uitspraak heeft
      verkregen, na de aanvang van de dag, volgende op die waarop deze vereisten zijn vervuld.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel324
  - number: '324.2'
    text: |-
      Wordt vóórdat de verjaring is voltooid, door een der partijen ter aantasting van de ten uitvoer te leggen
      veroordeling een rechtsmiddel of een eis ingesteld, dan begint de termijn eerst met de aanvang van de dag, volgende
      op die waarop het geding daarover is geëindigd.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel324
  - number: '324.3'
    text: |-
      De verjaringstermijn bedraagt vijf jaren voor wat betreft hetgeen ingevolge de uitspraak bij het jaar of kortere
      termijn moet worden betaald.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel324
  - number: '324.4'
    text: |-
      Voor wat betreft renten, boeten, dwangsommen en andere bijkomende veroordelingen, treedt de verjaring,
      behoudens stuiting of verlenging, niet later in dan de verjaring van de bevoegdheid tot tenuitvoerlegging van de
      hoofdveroordeling.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel324
  - number: '325.1'
    text: |-
      Op de verjaring van het vorige artikel zijn de [ artikelen 319-323][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel319
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel325
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '319'
  - number: '325.2'
    text: 'De verjaring van het vorige artikel wordt gestuit door:'
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel325
  - number: 325.2.a
    text: betekening van de uitspraak of schriftelijke aanmaning;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel325
  - number: 325.2.b
    text: erkenning van de in de uitspraak vastgestelde verplichting;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel325
  - number: 325.2.c
    text: |-
      iedere daad van tenuitvoerlegging, mits daarvan binnen de door de wet voorgeschreven tijd of, bij gebreke van
      zodanig voorschrift, met bekwame spoed mededeling aan de wederpartij wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel325
  - number: '326'
    text: |-
      Buiten het vermogensrecht vinden de bepalingen van deze titel overeenkomstige toepassing, voor zover de aard van de
      betrokken rechtsverhouding zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel326
