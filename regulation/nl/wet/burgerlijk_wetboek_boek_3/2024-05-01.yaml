bwb_id: BWBR0005291
url: https://wetten.overheid.nl/BWBR0005291/2024-05-01
articles:
  - number: '1'
    text: Goederen zijn alle zaken en alle vermogensrechten.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel1
  - number: '2'
    text: Zaken zijn de voor menselijke beheersing vatbare stoffelijke objecten.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel2
  - number: 2a.1
    text: Dieren zijn geen zaken.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel2a
  - number: 2a.2
    text: |-
      Bepalingen met betrekking tot zaken zijn op dieren van toepassing, met in achtneming van de op wettelijke
      voorschriften en regels van ongeschreven recht gegronde beperkingen, verplichtingen en rechtsbeginselen, alsmede de
      openbare orde en de goede zeden.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel2a
  - number: '3.1'
    text: |-
      Onroerend zijn de grond, de nog niet gewonnen delfstoffen, de met de grond verenigde beplantingen, alsmede de
      gebouwen en werken die duurzaam met de grond zijn verenigd, hetzij rechtstreeks, hetzij door vereniging met andere
      gebouwen of werken.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel3
  - number: '3.2'
    text: Roerend zijn alle zaken die niet onroerend zijn.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel3
  - number: '4.1'
    text: Al hetgeen volgens verkeersopvatting onderdeel van een zaak uitmaakt, is bestanddeel van die zaak.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel4
  - number: '4.2'
    text: |-
      Een zaak die met een hoofdzaak zodanig verbonden wordt dat zij daarvan niet kan worden afgescheiden zonder dat
      beschadiging van betekenis wordt toegebracht aan een der zaken, wordt bestanddeel van de hoofdzaak.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel4
  - number: '5'
    text: |-
      Inboedel is het geheel van tot huisraad en tot stoffering en meubilering van een woning dienende roerende zaken,
      met uitzondering van boekerijen en verzamelingen van voorwerpen van kunst, wetenschap of geschiedkundige aard.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel5
  - number: '6'
    text: |-
      Rechten die, hetzij afzonderlijk hetzij tezamen met een ander recht, overdraagbaar zijn, of er toe strekken
      de rechthebbende stoffelijk voordeel te verschaffen, ofwel verkregen zijn in ruil voor verstrekt of in het
      vooruitzicht gesteld stoffelijk voordeel, zijn vermogensrechten.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel6
  - number: '7'
    text: |-
      Een afhankelijk recht is een recht dat aan een ander recht zodanig verbonden is, dat het niet zonder dat andere
      recht kan bestaan.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel7
  - number: '8'
    text: |-
      Een beperkt recht is een recht dat is afgeleid uit een meer omvattend recht, hetwelk met het beperkte recht is
      bezwaard.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel8
  - number: '9.1'
    text: Natuurlijke vruchten zijn zaken die volgens verkeersopvatting als vruchten van andere zaken worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel9
  - number: '9.2'
    text: Burgerlijke vruchten zijn rechten die volgens verkeersopvatting als vruchten van goederen worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel9
  - number: '9.3'
    text: De afzonderlijke termijnen van een lijfrente gelden als vruchten van het recht op de lijfrente.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel9
  - number: '9.4'
    text: |-
      Een natuurlijke vrucht wordt een zelfstandige zaak door haar afscheiding, een burgerlijke vrucht een zelfstandig
      recht door haar opeisbaar worden.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel9
  - number: '10'
    text: |-
      Registergoederen zijn goederen voor welker overdracht of vestiging inschrijving in daartoe bestemde openbare
      registers noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel10
  - number: '11'
    text: |-
      Goede trouw van een persoon, vereist voor enig rechtsgevolg, ontbreekt niet alleen, indien hij de feiten of het
      recht, waarop zijn goede trouw betrekking moet hebben, kende, maar ook indien hij ze in de gegeven omstandigheden
      behoorde te kennen. Onmogelijkheid van onderzoek belet niet dat degene die goede reden tot twijfel had, aangemerkt
      wordt als iemand die de feiten of het recht behoorde te kennen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel11
  - number: '12'
    text: |-
      Bij de vaststelling van wat redelijkheid en billijkheid eisen, moet rekening worden gehouden met algemeen erkende
      rechtsbeginselen, met de in Nederland levende rechtsovertuigingen en met de maatschappelijke en persoonlijke
      belangen, die bij het gegeven geval zijn betrokken.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel12
  - number: '13.1'
    text: Degene aan wie een bevoegdheid toekomt, kan haar niet inroepen, voor zover hij haar misbruikt.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel13
  - number: '13.2'
    text: |-
      Een bevoegdheid kan onder meer worden misbruikt door haar uit te oefenen met geen ander doel dan een ander
      te schaden of met een ander doel dan waarvoor zij is verleend of in geval men, in aanmerking nemende de
      onevenredigheid tussen het belang bij de uitoefening en het belang dat daardoor wordt geschaad, naar redelijkheid
      niet tot die uitoefening had kunnen komen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel13
  - number: '13.3'
    text: Uit de aard van een bevoegdheid kan voortvloeien dat zij niet kan worden misbruikt.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel13
  - number: '14'
    text: |-
      Een bevoegdheid die iemand krachtens het burgerlijk recht toekomt, mag niet worden uitgeoefend in strijd met
      geschreven of ongeschreven regels van publiekrecht.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel14
  - number: '15'
    text: |-
      De [artikelen 11-14][ref1] vinden buiten het vermogensrecht toepassing, voor zover de aard van de rechtsbetrekking
      zich daartegen niet verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel11
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '11'
        afdeling: '1'
  - number: 15a
    text: |-
      Evenals een elektronische gekwalificeerde handtekening als bedoeld in artikel 3, onderdeel 12, van verordening
      (EU) nr. 910/2014 van het Europees parlement en de Raad van 23 juli 2014 betreffende elektronische identificatie
      en vertrouwensdiensten voor elektronisch transacties in de interne markt en tot intrekking van richtlijn 1999/93/
      EG (PbEU 2014, L 257) hebben een geavanceerde elektronische handtekening als bedoeld in onderdeel 11, en een andere
      elektronische handtekening als bedoeld in onderdeel 10, van artikel 3 van deze verordening dezelfde rechtsgevolgen
      als een handgeschreven handtekening, indien voor deze beide elektronische handtekeningen de methode voor
      ondertekening die gebruikt is voldoende betrouwbaar is, gelet op het doel waarvoor de elektronische handtekening is
      gebruikt en op alle overige omstandigheden van het geval.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel15a
  - number: 15c
    text: |-
      Buiten het vermogensrecht vindt [artikel 15a][ref1] overeenkomstige toepassing, voor zover de aard van de
      rechtshandeling of van de rechtsbetrekking zich daartegen niet verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel15a
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel15c
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: 15a
        afdeling: 1A
  - number: 15d.1
    text: |-
      Degene die een dienst van de informatiemaatschappij verleent, maakt de volgende gegevens gemakkelijk, rechtstreeks
      en permanent toegankelijk voor degenen die gebruik maken van deze dienst, in het bijzonder om informatie te
      verkrijgen of toegankelijk te maken:
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel15d
  - number: 15d.1.a
    text: zijn identiteit en adres van vestiging;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel15d
  - number: 15d.1.b
    text: |-
      gegevens die een snel contact en een rechtstreekse en effectieve communicatie met hem mogelijk maken, met inbegrip
      van zijn elektronische postadres;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel15d
  - number: 15d.1.c
    text: |-
      voor zover hij in een handelsregister of een vergelijkbaar openbaar register is ingeschreven: het register waar hij
      is ingeschreven en zijn inschrijvingsnummer, of een vergelijkbaar middel ter identificatie in dat register;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel15d
  - number: 15d.1.d
    text: |-
      voor zover een activiteit aan een vergunningsstelsel is onderworpen: de gegevens over de bevoegde toezichthoudende
      autoriteit;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel15d
  - number: 15d.1.e
    text: |-
      voor zover hij een gereglementeerd beroep uitoefent: - de beroepsvereniging of -organisatie waarbij hij is
      ingeschreven,
        - de beroepstitel en de lidstaat van de Europese Unie of andere staat die partij is bij de Overeenkomst betreffende
      de Europese Economische Ruimte waar die is toegekend,
        - een verwijzing naar de beroepsregels die in Nederland van toepassing zijn en de wijze van toegang daartoe;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel15d
  - number: 15d.1.f
    text: |-
      voor zover hij een aan de BTW onderworpen activiteit uitoefent: het btw-identificatienummer zoals bedoeld in
      [artikel 2a, eerste lid, onder g, van de Wet op de Omzetbelasting 1968][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel2a
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel15d
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 2a
  - number: 15d.2
    text: |-
      De dienstverlener geeft aanduidingen van prijzen in een dienst van de informatiemaatschappij duidelijk en
      ondubbelzinnig aan, met de uitdrukkelijke vermelding of, en zo mogelijk welke, belasting en leveringskosten daarbij
      inbegrepen zijn.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel15d
  - number: 15d.3
    text: |-
      Onder dienst van de informatiemaatschappij wordt verstaan elke dienst die gewoonlijk tegen vergoeding, langs
      elektronische weg, op afstand en op individueel verzoek van de afnemer van de dienst wordt verricht zonder
      dat partijen gelijktijdig op dezelfde plaats aanwezig zijn. Een dienst wordt langs elektronische weg verricht
      indien deze geheel per draad, per radio, of door middel van optische of andere elektromagnetische middelen wordt
      verzonden, doorgeleid en ontvangen met behulp van elektronische apparatuur voor de verwerking, met inbegrip van
      digitale compressie, en de opslag van gegevens.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel15d
  - number: 15e.1
    text: |-
      Indien commerciële communicatie deel uitmaakt van een dienst van de informatiemaatschappij of een dergelijke dienst
      vormt, zorgt degene in wiens opdracht de commerciële communicatie geschiedt dat:
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel15e
  - number: 15e.1.a
    text: de commerciële communicatie duidelijk als zodanig herkenbaar is;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel15e
  - number: 15e.1.b
    text: de commerciële communicatie zijn identiteit vermeldt;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel15e
  - number: 15e.1.c
    text: |-
      de commerciële communicatie, indien deze verkoopbevorderende aanbiedingen, wedstrijden of spelen omvat, een
      duidelijke en ondubbelzinnige vermelding bevat van de aard en de voorwaarden van de aanbieding of de deelneming;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel15e
  - number: 15e.1.d
    text: |-
      ongevraagde commerciële communicatie door middel van elektronische post reeds bij de ontvangst duidelijk en
      ondubbelzinnig als zodanig herkenbaar is.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel15e
  - number: 15e.3
    text: |-
      Onder commerciële communicatie als bedoeld in dit artikel wordt verstaan elke vorm van communicatie bestemd
      voor het aanprijzen van de goederen, diensten of het imago van een onderneming, instelling of persoon die een
      commerciële, industriële of ambachtelijke activiteit of een gereglementeerd beroep uitoefent, met uitzondering
      van informatie die rechtstreeks toegang geeft tot de activiteit van de onderneming, instelling of persoon, in het
      bijzonder een domeinnaam of een elektronisch postadres. Mededelingen over goederen of diensten of het imago van een
      onderneming, instelling of persoon die onafhankelijk van deze en in het bijzonder zonder financiële tegenprestatie
      zijn samengesteld, zijn geen commerciële communicatie.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel15e
  - number: 15f.1
    text: |-
      Degenen die diensten van de informatiemaatschappij verlenen of gebruiken kunnen zich richten tot een door Onze
      Minister van Justitie in overeenstemming met Onze Minister van Economische Zaken aan te wijzen rechtspersoon
      teneinde:
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel15f
  - number: 15f.1.a
    text: |-
      algemene informatie te verkrijgen over hun contractuele rechten en plichten alsmede over klachtenprocedures en
      rechtsmiddelen in het geval van een geschil;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel15f
  - number: 15f.1.b
    text: |-
      nadere gegevens te verkrijgen over de autoriteiten of organisaties waar zij nadere informatie of praktische
      bijstand kunnen krijgen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel15f
  - number: 15f.2
    text: |-
      De rechtspersoon, bedoeld in lid 1, werkt bij de uitoefening van zijn taken samen met de overeenkomstige
      organisaties in andere lidstaten van de Europese Unie en de overige staten die partij zijn bij de Overeenkomst
      betreffende de Europese Economische Ruimte.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel15f
  - number: 15f.3
    text: |-
      De controleurs van de Belastingdienst/Fiscale Inlichtingen- en Opsporingsdienst – Economische Controle Dienst
      (Belastingdienst/FIOD-ECD) worden aangewezen als ambtenaren, belast met de opsporing van overtredingen van de
      voorschriften gesteld bij de [artikelen 15d][ref1] en [15e lid 1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel15d
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel15e
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel15f
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: 15d
        afdeling: 1A
      - id: ref2
        bwb_id: BWBR0005291
        artikel: 15e
        afdeling: 1A
  - number: 15i.1
    text: |-
      Een ieder die een bedrijf of zelfstandig een beroep uitoefent, is verplicht van zijn vermogenstoestand en van alles
      betreffende zijn bedrijf of beroep, naar de eisen van dat bedrijf of beroep, op zodanige wijze een administratie
      te voeren en de daartoe behorende boeken, bescheiden en andere gegevensdragers op zodanige wijze te bewaren, dat te
      allen tijde zijn rechten en verplichtingen kunnen worden gekend.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel15i
  - number: 15i.2
    text: |-
      De [leden 2 tot en met 4 van artikel 10 van Boek 2][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel10
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel15i
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '10'
  - number: 15j
    text: |-
      Openlegging van tot een administratie behorende boeken, bescheiden en andere gegevensdragers kunnen, voorzover zij
      daarbij een rechtstreeks en voldoende belang hebben, vorderen:
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel15j
  - number: 15j.a
    text: erfgenamen, ten aanzien van de boekhouding van de erflater;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel15j
  - number: 15j.b
    text: deelgenoten in een gemeenschap, ten aanzien van de boekhouding betreffende de gemeenschap;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel15j
  - number: 15j.c
    text: vennoten, ten aanzien van de boekhouding van de vennootschap;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel15j
  - number: 15j.d
    text: |-
      schuldeisers in het geval van faillissement of toepassing van de schuldsaneringsregeling natuurlijke personen, ten
      aanzien van de boekhouding van de failliet onderscheidenlijk degene ten aanzien van wie de schuldsaneringsregeling
      van toepassing is.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel15j
  - number: '16.1'
    text: |-
      Er worden openbare registers gehouden, waarin feiten die voor de rechtstoestand van registergoederen van belang
      zijn, worden ingeschreven.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel16
  - number: '16.2'
    text: |-
      Welke deze openbare registers zijn, waar en op welke wijze een inschrijving in de registers kan worden verkregen,
      welke stukken daartoe aan de bewaarder moeten worden aangeboden, wat deze stukken moeten inhouden, hoe de registers
      worden ingericht, hoe de inschrijvingen daarin geschieden, en hoe de registers kunnen worden geraadpleegd, wordt
      geregeld bij de wet.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel16
  - number: '17.1'
    text: |-
      Behalve die feiten waarvan inschrijving krachtens andere wetsbepalingen mogelijk is, kunnen in deze registers de
      volgende feiten worden ingeschreven:
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel17
  - number: 17.1.a
    text: |-
      rechtshandelingen die een verandering in de rechtstoestand van registergoederen brengen of in enig ander opzicht
      voor die rechtstoestand van belang zijn;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel17
  - number: 17.1.b
    text: |-
      erfopvolgingen die registergoederen betreffen, daaronder begrepen de opvolging door de Staat krachtens de
      [artikelen 189][ref1] en [226 lid 4 van Boek 4][ref2], en de afgifte van registergoederen aan de Staat krachtens
      [artikel 226 leden 1 en 2 van Boek 4][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel189
      [ref2]: https://wetten.overheid.nl/BWBR0002761#Artikel226
      [ref3]: https://wetten.overheid.nl/BWBR0002761#Artikel226
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '189'
      - id: ref2
        bwb_id: BWBR0002761
        artikel: '226'
      - id: ref3
        bwb_id: BWBR0002761
        artikel: '226'
  - number: 17.1.c
    text: |-
      vervulling van de voorwaarde, gesteld in een ingeschreven voorwaardelijke rechtshandeling, en de verschijning van
      een onzeker tijdstip, aangeduid in de aan een ingeschreven rechtshandeling verbonden tijdsbepaling, alsmede de dood
      van een vruchtgebruiker van een registergoed;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel17
  - number: 17.1.d
    text: reglementen en andere regelingen die tussen medegerechtigden in registergoederen zijn vastgesteld;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel17
  - number: 17.1.e
    text: |-
      rechterlijke uitspraken die de rechtstoestand van registergoederen of de bevoegdheid daarover te beschikken
      betreffen, mits zij uitvoerbaar bij voorraad zijn of een verklaring van de griffier wordt overgelegd, dat daartegen
      geen gewoon rechtsmiddel meer openstaat of dat hem drie maanden na de uitspraak niet van het instellen van een
      gewoon rechtsmiddel is gebleken, benevens de tegen de bovenbedoelde uitspraken ingestelde rechtsmiddelen;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel17
  - number: 17.1.f
    text: |-
      instelling van rechtsvorderingen en indiening van verzoeken ter verkrijging van een rechterlijke uitspraak die de
      rechtstoestand van een registergoed betreft;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel17
  - number: 17.1.g
    text: executoriale en conservatoire beslagen op registergoederen;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel17
  - number: 17.1.h
    text: naamsveranderingen die tot registergoederen gerechtigde personen betreffen;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel17
  - number: 17.1.i
    text: |-
      verjaring die leidt tot verkrijging van een registergoed of tenietgaan van een beperkt recht dat een registergoed
      is;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel17
  - number: 17.1.j
    text: |-
      beschikkingen en uitspraken, waarbij een krachtens een bijzondere wetsbepaling ingeschreven beschikking wordt
      vernietigd, ingetrokken of gewijzigd;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel17
  - number: 17.1.k
    text: |-
      de aanleg en verwijdering van een net, bestaande uit een of meer kabels of leidingen, bestemd voor transport van
      vaste, vloeibare of gasvormige stoffen, van energie of van informatie.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel17
  - number: '17.2'
    text: |-
      Huur- en pachtovereenkomsten en andere feiten die alleen persoonlijke rechten geven of opheffen, kunnen slechts
      worden ingeschreven, indien een bijzondere wetsbepaling dit toestaat.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel17
  - number: '18'
    text: |-
      Worden de bewaarder der registers stukken ter inschrijving aangeboden, dan verstrekt hij de aanbieder een bewijs
      van ontvangst, vermeldende de aard dier stukken alsmede dag, uur en minuut van de aanbieding.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel18
  - number: '19.1'
    text: |-
      Indien de voor een inschrijving nodige stukken worden aangeboden, de aangeboden stukken aan de wettelijke eisen
      voldoen en andere wettelijke vereisten voor inschrijving zijn vervuld, dan geschiedt de inschrijving terstond na
      de aanbieding.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel19
  - number: '19.2'
    text: Als tijdstip van inschrijving geldt het tijdstip van aanbieding van de voor de inschrijving vereiste stukken.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel19
  - number: '19.3'
    text: |-
      Op verlangen van de aanbieder tekent de bewaarder de verrichte inschrijving op het ontvangstbewijs aan of doet hij
      in de gevallen en op een wijze bij of krachtens de wet, bedoeld in [artikel 16, tweede lid][ref1], vast te stellen,
      daarvan mededeling aan de aanbieder.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel16
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '16'
        afdeling: '2'
  - number: '19.4'
    text: |-
      Indien de bewaarder vermoedt dat de in de aangeboden stukken vermelde kenmerken niet overeenstemmen met die welke
      met betrekking tot het registergoed behoren te worden vermeld, of dat de in te schrijven rechtshandeling door een
      onbevoegde is verricht of onverenigbaar is met een andere rechtshandeling, ter inschrijving waarvan hem de nodige
      stukken zijn aangeboden, is hij bevoegd de aanbieder en andere belanghebbenden daarop opmerkzaam te maken.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel19
  - number: '20.1'
    text: |-
      De bewaarder der registers weigert een inschrijving te doen, indien niet is voldaan aan de eisen, bedoeld in
      [artikel 19, eerste lid][ref1]. Hij boekt de aanbieding in het register van voorlopige aantekeningen met vermelding
      van de gerezen bedenkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel19
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '19'
        afdeling: '2'
  - number: '20.2'
    text: |-
      Wanneer de weigering ten onrechte is geschied, beveelt de voorzieningenrechter van de rechtbank, rechtdoende
      in kort geding, op vordering van de belanghebbende de bewaarder de inschrijving alsnog te verrichten, zulks
      onverminderd de bevoegdheid van de gewone rechter. De voorzieningenrechter kan de oproeping van door hem aan te
      wijzen andere belanghebbenden gelasten. Het bevel van de voorzieningenrechter is van rechtswege uitvoerbaar bij
      voorraad.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel20
  - number: '20.3'
    text: |-
      Wordt de geweigerde inschrijving alsnog bevolen, dan verricht de bewaarder haar terstond nadat de eiser haar
      opnieuw heeft verzocht.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel20
  - number: '20.4'
    text: |-
      Indien de belanghebbende binnen twee weken na de oorspronkelijke aanbieding aan de bewaarder een dagvaarding in
      kort geding ter verkrijging van het in lid 2 bedoelde bevel heeft doen uitbrengen en de aanvankelijk geweigerde
      inschrijving alsnog is verricht op een hernieuwde aanbieding van dezelfde stukken, gedaan binnen een week na
      een in eerste aanleg gegeven bevel, wordt de inschrijving geacht te zijn geschied op het tijdstip waarop de
      oorspronkelijke aanbieding plaatsvond. Hetzelfde geldt, indien de bewaarder op een hernieuwde aanbieding alsnog
      overgaat tot inschrijving binnen twee weken hetzij na de oorspronkelijke aanbieding, hetzij na een hem tijdig
      uitgebrachte dagvaarding hangende het geding in eerste aanleg.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel20
  - number: '20.5'
    text: |-
      Een feit waarvan slechts blijkt uit een overeenkomstig lid 1, tweede zin, geboekt stuk wordt geacht niet door
      raadpleging van de registers kenbaar te zijn, tenzij het krachtens het vorige lid geacht moet worden reeds ten
      tijde van de raadpleging ingeschreven te zijn geweest.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel20
  - number: '20.6'
    text: |-
      Een voorlopige aantekening wordt door de bewaarder doorgehaald, zodra hem is gebleken dat de voorwaarden voor
      toepassing van het vierde lid niet meer kunnen worden vervuld, of de inschrijving met inachtneming van het tijdstip
      van oorspronkelijke aanbieding alsnog heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel20
  - number: '21.1'
    text: |-
      De rangorde van inschrijvingen die op een zelfde registergoed betrekking hebben, wordt bepaald door de volgorde der
      tijdstippen van inschrijving, tenzij uit de wet een andere rangorde voortvloeit.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel21
  - number: '21.2'
    text: |-
      Vinden twee inschrijvingen op één zelfde tijdstip plaats en zouden deze leiden tot onderling onverenigbare rechten
      van verschillende personen op dat goed, dan wordt de rangorde bepaald:
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel21
  - number: 21.2.a
    text: 'ingeval de ter inschrijving aangeboden akten op verschillende dagen zijn opgemaakt: door de volgorde van die dagen;'
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel21
  - number: 21.2.b
    text: |-
      ingeval beide akten op dezelfde dag zijn opgemaakt en het notariële akten, daaronder begrepen notariële
      verklaringen, betreft: door de volgorde van de tijdstippen waarop ieder van die akten of verklaringen is opgemaakt.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel21
  - number: '22'
    text: |-
      Wanneer een feit in de registers is ingeschreven, kan daarna de geldigheid van de inschrijving niet meer worden
      betwist op grond dat de formaliteiten die voor de inschrijving worden vereist, niet zijn in acht genomen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel22
  - number: '23'
    text: |-
      Het beroep van een verkrijger van een registergoed op goede trouw wordt niet aanvaard, wanneer dit beroep insluit
      een beroep op onbekendheid met feiten die door raadpleging van de registers zouden zijn gekend.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel23
  - number: '24.1'
    text: |-
      Indien op het tijdstip waarop een rechtshandeling tot verkrijging van een recht op een registergoed onder
      bijzondere titel in de registers wordt ingeschreven, een eveneens voor inschrijving in de registers vatbaar
      feit niet met betrekking tot dat registergoed ingeschreven was, kan dit feit aan de verkrijger niet worden
      tegengeworpen, tenzij hij het kende.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel24
  - number: '24.2'
    text: 'Het eerste lid is niet van toepassing ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel24
  - number: 24.2.a
    text: |-
      feiten die naar hun aard vatbaar zijn voor inschrijving in een register van de burgerlijke stand, een
      huwelijksgoederenregister of een boedelregister, ook indien het feit in een gegeven geval daarin niet kan worden
      ingeschreven, omdat daarop de Nederlandse wet niet van toepassing is;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel24
  - number: 24.2.b
    text: in het curatele- en bewindregister ingeschreven ondercuratelestelling en opheffing van curatele;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel24
  - number: 24.2.c
    text: |-
      in het faillissementsregister, het surséanceregister en het register schuldsaneringsregeling natuurlijke personen
      ingeschreven rechterlijke uitspraken;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel24
  - number: 24.2.d
    text: aanvaarding en verwerping van een nalatenschap;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel24
  - number: 24.2.e
    text: verjaring.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel24
  - number: '24.3'
    text: |-
      Het eerste lid is evenmin van toepassing ten aanzien van erfopvolgingen en uiterste wilsbeschikkingen die op het
      tijdstip van de inschrijving van de rechtshandeling nog niet ingeschreven waren, doch daarna, mits binnen drie
      maanden na de dood van de erflater, alsnog in de registers zijn ingeschreven.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel24
  - number: '25'
    text: |-
      Indien op het tijdstip waarop een rechtshandeling ter verkrijging van een recht op een registergoed onder
      bijzondere titel wordt ingeschreven, een feit met betrekking tot dat registergoed in de registers was ingeschreven
      krachtens een authentieke akte waarin het feit door een ambtenaar met kracht van authenticiteit werd vastgesteld,
      kan de onjuistheid van dit feit aan de verkrijger niet worden tegengeworpen, tenzij hij deze onjuistheid kende of
      door raadpleging van de registers de mogelijkheid daarvan had kunnen kennen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel25
  - number: '26'
    text: |-
      Indien op het tijdstip waarop een rechtshandeling ter verkrijging van een recht op een registergoed onder
      bijzondere titel wordt ingeschreven, met betrekking tot dat registergoed een onjuist feit in de registers
      ingeschreven was, kan de onjuistheid van dit feit door hem die redelijkerwijze voor overeenstemming van de
      registers met de werkelijkheid had kunnen zorgdragen, aan de verkrijger niet worden tegengeworpen, tenzij deze de
      onjuistheid kende of door raadpleging van de registers de mogelijkheid daarvan had kunnen kennen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel26
  - number: '27.1'
    text: |-
      Hij die beweert enig recht op een registergoed te hebben, kan alle belanghebbenden bij openbare oproeping, en
      daarnaast hen die als rechthebbende of beslaglegger op dat goed ingeschreven staan, ieder bij name dagvaarden
      om te horen verklaren dat hem het recht waarop hij aanspraak maakt, toekomt. Alvorens een zodanige eis toe te
      wijzen, kan de rechter de maatregelen bevelen en de bewijsopdrachten doen, welke hij in het belang van mogelijke
      niet-verschenen rechthebbenden nuttig oordeelt. Een krachtens dit artikel verkregen verklaring wordt niet in de
      registers ingeschreven, voordat het vonnis in kracht van gewijsde is gegaan.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel27
  - number: '27.2'
    text: |-
      Tegen het vonnis is geen verzet toegelaten. Hoger beroep en cassatie staan volgens de gewone regels open,
      behoudens de volgende uitzonderingen. [Artikel 335 van het Wetboek van Burgerlijke Rechtsvordering][ref1]
      is niet van toepassing. De dagvaarding waarbij het rechtsmiddel wordt ingesteld, moet op straffe
      van niet-ontvankelijkheid binnen acht dagen worden ingeschreven in het register, bedoeld in
      [artikel 433 van het Wetboek van Burgerlijke Rechtsvordering][ref2]. De termijn voor hoger beroep begint voor
      niet-verschenen belanghebbenden te lopen vanaf de betekening van de uitspraak aan hen bij name, voor zover zij
      ingeschreven waren, of bij openbaar exploit, zo zij niet ingeschreven waren. Cassatie staat alleen open voor
      verschenen belanghebbenden.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel335
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel433
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '335'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '433'
  - number: '27.3'
    text: |-
      De krachtens lid 1 ingeschreven verklaring wordt ten aanzien van niet-verschenen belanghebbenden die niet bij name
      zijn gedagvaard, vermoed juist te zijn, zolang het tegendeel niet bewezen is. Op de onjuistheid kan echter geen
      beroep worden gedaan ten nadele van hen die, daarmee onbekend, de verkrijger van het vonnis onder bijzondere titel
      zijn opgevolgd.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel27
  - number: '27.4'
    text: |-
      Een openbare oproeping als bedoeld in lid 1 geschiedt overeenkomstig
      [artikel 54, tweede en derde lid van het Wetboek van Burgerlijke Rechtsvordering][ref1]. Een openbaar exploot als
      bedoeld in lid 2 geschiedt op dezelfde wijze, tenzij de rechter nadere maatregelen voorschrijft als bedoeld in lid
      1. De in lid 1 bedoelde maatregelen kunnen bestaan in het voorschrijven van al of niet herhaalde aankondigingen van
      een door de rechter vast te stellen inhoud in één of meer binnen- of buitenlandse dagbladen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel54
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '54'
  - number: '28.1'
    text: |-
      Is een inschrijving waardeloos, dan zijn degenen te wier behoeve zij anders zou hebben gestrekt, verplicht van deze
      waardeloosheid aan hem die daarbij een onmiddellijk belang heeft, op diens verzoek een schriftelijke verklaring af
      te geven. De verklaringen vermelden de feiten waarop de waardeloosheid berust, tenzij de inschrijving een hypotheek
      of een beslag betreft.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel28
  - number: '28.2'
    text: |-
      Verklaringen als in lid 1 bedoeld kunnen in de registers worden ingeschreven. Indien de inschrijving een hypotheek
      of een beslag betreft, machtigen deze verklaringen na inschrijving gezamenlijk de bewaarder tot doorhaling daarvan.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel28
  - number: '29.1'
    text: |-
      Worden de vereiste verklaringen niet afgegeven, dan verklaart de rechtbank de inschrijving waardeloos op
      vordering van de onmiddellijk belanghebbende. Wordt ter verkrijging van dit bevel iemand die in de registers
      staat ingeschreven gedagvaard, dan worden daarmee tevens gedagvaard al zijn rechtverkrijgenden die geen nieuwe
      inschrijving hebben genomen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel29
  - number: '29.2'
    text: |-
      Alvorens een zodanige verklaring uit te spreken kan de rechter de maatregelen bevelen en de bewijsopdrachten doen,
      welke hij in het belang van mogelijk niet-verschenen rechthebbenden nuttig oordeelt.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel29
  - number: '29.3'
    text: |-
      Verzet, hoger beroep en cassatie moeten op straffe van niet- ontvankelijkheid binnen acht
      dagen na het instellen van het rechtsmiddel worden ingeschreven in de registers, bedoeld in
      [artikel 433 van het Wetboek van Burgerlijke Rechtsvordering][ref1]. Zo voor een ingeschreven verweerder geen
      verzet, maar hoger beroep openstaat, geldt hetzelfde voor zijn rechtverkrijgenden die geen nieuwe inschrijving
      hebben genomen. In afwijking van [artikel 143 van dat wetboek][ref2] begint de termijn van verzet in elk geval
      te lopen vanaf de betekening van het vonnis aan de ingeschreven verweerder, ook als de betekening niet aan hem in
      persoon geschiedt, zulks mede ten opzichte van zijn rechtverkrijgenden die geen nieuwe inschrijving hebben genomen,
      tenzij de rechter hiertoe nadere maatregelen heeft bevolen en aan dat bevel niet is voldaan. Cassatie staat alleen
      open voor verschenen belanghebbenden.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel433
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel143
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '433'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '143'
  - number: '29.4'
    text: |-
      Het vonnis dat de verklaring bevat, kan niet worden ingeschreven, voordat het in kracht van gewijsde is gegaan.
      Indien de waardeloze inschrijving een hypotheek of beslag betreft, machtigt het vonnis na inschrijving de bewaarder
      tot doorhaling daarvan.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel29
  - number: '30'
    text: |-
      Onverminderd de aansprakelijkheden van de Dienst voor het kadaster en de openbare registers, bedoeld in
      [artikel 117, eerste en tweede lid, van de Kadasterwet][ref1], is de Staat aansprakelijk, wanneer iemand ten
      gevolge van omstandigheden die naar redelijkheid en billijkheid niet voor zijn rekening komen, door toepassing van
      een der [artikelen 24][ref2], [25][ref3] of [27][ref4] zijn recht verliest.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel117
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Artikel25
      [ref4]: https://wetten.overheid.nl/BWBR0005291#Artikel27
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '117'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '24'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005291
        artikel: '25'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0005291
        artikel: '27'
        afdeling: '2'
  - number: '31'
    text: |-
      Waar een wetsbepaling die betrekking heeft op registergoederen, een notariële akte of een notariële verklaring
      voorschrijft, is een akte of verklaring van een Nederlandse notaris vereist.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel31
  - number: '32.1'
    text: |-
      Iedere natuurlijke persoon is bekwaam tot het verrichten van rechtshandelingen, voor zover de wet niet anders
      bepaalt.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel32
  - number: '32.2'
    text: |-
      Een rechtshandeling van een onbekwame is vernietigbaar. Een eenzijdige rechtshandeling van een onbekwame, die niet
      tot een of meer bepaalde personen gericht was, is echter nietig.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel32
  - number: '33'
    text: Een rechtshandeling vereist een op een rechtsgevolg gerichte wil die zich door een verklaring heeft geopenbaard.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel33
  - number: '34.1'
    text: |-
      Heeft iemand wiens geestvermogens blijvend of tijdelijk zijn gestoord, iets verklaard, dan wordt een met de
      verklaring overeenstemmende wil geacht te ontbreken, indien de stoornis een redelijke waardering der bij de
      handeling betrokken belangen belette, of indien de verklaring onder invloed van die stoornis is gedaan. Een
      verklaring wordt vermoed onder invloed van de stoornis te zijn gedaan, indien de rechtshandeling voor de geestelijk
      gestoorde nadelig was, tenzij het nadeel op het tijdstip van de rechtshandeling redelijkerwijze niet was te
      voorzien.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel34
  - number: '34.2'
    text: |-
      Een zodanig ontbreken van wil maakt een rechtshandeling vernietigbaar. Een eenzijdige rechtshandeling die niet tot
      een of meer bepaalde personen gericht was, wordt door het ontbreken van wil echter nietig.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel34
  - number: '35'
    text: |-
      Tegen hem die eens anders verklaring of gedraging, overeenkomstig de zin die hij daaraan onder de gegeven
      omstandigheden redelijkerwijze mocht toekennen, heeft opgevat als een door die ander tot hem gerichte verklaring
      van een bepaalde strekking, kan geen beroep worden gedaan op het ontbreken van een met deze verklaring
      overeenstemmende wil.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel35
  - number: '36'
    text: |-
      Tegen hem die als derde op grond van een verklaring of gedraging, overeenkomstig de zin die hij daaraan onder
      de gegeven omstandigheden redelijkerwijze mocht toekennen, het ontstaan, bestaan of tenietgaan van een bepaalde
      rechtsbetrekking heeft aangenomen en in redelijk vertrouwen op de juistheid van die veronderstelling heeft
      gehandeld, kan door degene om wiens verklaring of gedraging het gaat, met betrekking tot deze handeling op de
      onjuistheid van die veronderstelling geen beroep worden gedaan.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel36
  - number: '37.1'
    text: |-
      Tenzij anders is bepaald, kunnen verklaringen, met inbegrip van mededelingen, in iedere vorm geschieden, en kunnen
      zij in een of meer gedragingen besloten liggen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel37
  - number: '37.2'
    text: |-
      Indien bepaald is dat een verklaring schriftelijk moet worden gedaan, kan zij, voor zover uit de strekking van die
      bepaling niet anders volgt, ook bij exploit geschieden.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel37
  - number: '37.3'
    text: |-
      Een tot een bepaalde persoon gerichte verklaring moet, om haar werking te hebben, die persoon hebben bereikt.
      Nochtans heeft ook een verklaring die hem tot wie zij was gericht, niet of niet tijdig heeft bereikt, haar werking,
      indien dit niet of niet tijdig bereiken het gevolg is van zijn eigen handeling, van de handeling van personen voor
      wie hij aansprakelijk is, of van andere omstandigheden die zijn persoon betreffen en rechtvaardigen dat hij het
      nadeel draagt.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel37
  - number: '37.4'
    text: |-
      Wanneer een door de afzender daartoe aangewezen persoon of middel een tot een ander gerichte verklaring onjuist
      heeft overgebracht, geldt het ter kennis van de ontvanger gekomene als de verklaring van de afzender, tenzij de
      gevolgde wijze van overbrenging door de ontvanger was bepaald.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel37
  - number: '37.5'
    text: |-
      Intrekking van een tot een bepaalde persoon gerichte verklaring moet, om haar werking te hebben, die persoon eerder
      dan of gelijktijdig met de ingetrokken verklaring bereiken.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel37
  - number: '38.1'
    text: |-
      Tenzij uit de wet of uit de aard van de rechtshandeling anders voortvloeit, kan een rechtshandeling onder een
      tijdsbepaling of een voorwaarde worden verricht.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel38
  - number: '38.2'
    text: De vervulling van een voorwaarde heeft geen terugwerkende kracht.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel38
  - number: '39'
    text: |-
      Tenzij uit de wet anders voortvloeit, zijn rechtshandelingen die niet in de voorgeschreven vorm zijn verricht,
      nietig.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel39
  - number: '40.1'
    text: Een rechtshandeling die door inhoud of strekking in strijd is met de goede zeden of de openbare orde, is nietig.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel40
  - number: '40.2'
    text: |-
      Strijd met een dwingende wetsbepaling leidt tot nietigheid van de rechtshandeling, doch, indien de bepaling
      uitsluitend strekt ter bescherming van één der partijen bij een meerzijdige rechtshandeling, slechts tot
      vernietigbaarheid, een en ander voor zover niet uit de strekking van de bepaling anders voortvloeit.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel40
  - number: '40.3'
    text: |-
      Het vorige lid heeft geen betrekking op wetsbepalingen die niet de strekking hebben de geldigheid van daarmede
      strijdige rechtshandelingen aan te tasten.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel40
  - number: '41'
    text: |-
      Betreft een grond van nietigheid slechts een deel van een rechtshandeling, dan blijft deze voor het overige in
      stand, voor zover dit, gelet op inhoud en strekking van de handeling, niet in onverbrekelijk verband met het
      nietige deel staat.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel41
  - number: '42'
    text: |-
      Beantwoordt de strekking van een nietige rechtshandeling in een zodanige mate aan die van een andere, als geldig
      aan te merken rechtshandeling, dat aangenomen moet worden dat die andere rechtshandeling zou zijn verricht, indien
      van de eerstgenoemde wegens haar ongeldigheid was afgezien, dan komt haar de werking van die andere rechtshandeling
      toe, tenzij dit onredelijk zou zijn jegens een belanghebbende die niet tot de rechtshandeling als partij heeft
      medegewerkt.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel42
  - number: '43.1'
    text: 'Rechtshandelingen die, hetzij rechtstreeks, hetzij door tussenkomende personen, strekken tot verkrijging door:'
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel43
  - number: 43.1.a
    text: |-
      rechters, leden van het openbaar ministerie, gerechtsauditeurs, griffiers, advocaten, deurwaarders en notarissen
      van goederen waarover een geding aanhangig is voor het gerecht, onder welks rechtsgebied zij hun bediening
      uitoefenen;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel43
  - number: 43.1.b
    text: ambtenaren, van goederen die door hen of te hunnen overstaan worden verkocht, of
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel43
  - number: 43.1.c
    text: |-
      personen met openbaar gezag bekleed, van goederen die toebehoren aan het Rijk, provincies, gemeenten of andere
      openbare instellingen en aan hun beheer zijn toevertrouwd,
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel43
  - number: '43.2'
    text: |-
      Lid 1 onder *a* heeft geen betrekking op uiterste wilsbeschikkingen, door een erflater ten voordele van zijn
      wettelijke erfgenamen gemaakt, noch op rechtshandelingen krachtens welke deze erfgenamen goederen der nalatenschap
      verkrijgen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel43
  - number: '43.3'
    text: |-
      In het geval bedoeld in het eerste lid onder *c* is de rechtshandeling geldig, indien zij met Onze goedkeuring
      is geschied of het een verkoop in het openbaar betreft. Indien de rechtshandeling strekt tot verkrijging door
      een lid van de gemeenteraad of een wethouder, onderscheidenlijk de burgemeester komt de in de vorige zin bedoelde
      bevoegdheid tot goedkeuring toe aan gedeputeerde staten, onderscheidenlijk de Commissaris van de Koning.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel43
  - number: '44.1'
    text: |-
      Een rechtshandeling is vernietigbaar, wanneer zij door bedreiging, door bedrog of door misbruik van omstandigheden
      is tot stand gekomen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel44
  - number: '44.2'
    text: |-
      Bedreiging is aanwezig, wanneer iemand een ander tot het verrichten van een bepaalde rechtshandeling beweegt door
      onrechtmatig deze of een derde met enig nadeel in persoon of goed te bedreigen. De bedreiging moet zodanig zijn,
      dat een redelijk oordelend mens daardoor kan worden beïnvloed.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel44
  - number: '44.3'
    text: |-
      Bedrog is aanwezig, wanneer iemand een ander tot het verrichten van een bepaalde rechtshandeling beweegt door
      enige opzettelijk daartoe gedane onjuiste mededeling, door het opzettelijk daartoe verzwijgen van enig feit dat de
      verzwijger verplicht was mede te delen, of door een andere kunstgreep. Aanprijzingen in algemene bewoordingen, ook
      al zijn ze onwaar, leveren op zichzelf geen bedrog op.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel44
  - number: '44.4'
    text: |-
      Misbruik van omstandigheden is aanwezig, wanneer iemand die weet of moet begrijpen dat een ander door bijzondere
      omstandigheden, zoals noodtoestand, afhankelijkheid, lichtzinnigheid, abnormale geestestoestand of onervarenheid,
      bewogen wordt tot het verrichten van een rechtshandeling, het tot stand komen van die rechtshandeling bevordert,
      ofschoon hetgeen hij weet of moet begrijpen hem daarvan zou behoren te weerhouden.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel44
  - number: '44.5'
    text: |-
      Indien een verklaring is tot stand gekomen door bedreiging, bedrog of misbruik van omstandigheden van de zijde
      van iemand die geen partij bij de rechtshandeling is, kan op dit gebrek geen beroep worden gedaan jegens een
      wederpartij die geen reden had het bestaan ervan te veronderstellen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel44
  - number: '45.1'
    text: |-
      Indien een schuldenaar bij het verrichten van een onverplichte rechtshandeling wist of behoorde te weten
      dat daarvan benadeling van een of meer schuldeisers in hun verhaalsmogelijkheden het gevolg zou zijn, is de
      rechtshandeling vernietigbaar en kan de vernietigingsgrond worden ingeroepen door iedere door de rechtshandeling
      in zijn verhaalsmogelijkheden benadeelde schuldeiser, onverschillig of zijn vordering vóór of na de handeling is
      ontstaan.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel45
  - number: '45.2'
    text: |-
      Een rechtshandeling anders dan om niet, die hetzij meerzijdig is, hetzij eenzijdig en tot een of meer bepaalde
      personen gericht, kan wegens benadeling slechts worden vernietigd, indien ook degenen met of jegens wie de
      schuldenaar de rechtshandeling verrichtte, wisten of behoorden te weten dat daarvan benadeling van een of meer
      schuldeisers het gevolg zou zijn.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel45
  - number: '45.3'
    text: |-
      Wordt een rechtshandeling om niet wegens benadeling vernietigd, dan heeft de vernietiging ten aanzien van de
      bevoordeelde die wist noch behoorde te weten dat van de rechtshandeling benadeling van een of meer schuldeisers het
      gevolg zou zijn, geen werking, voor zover hij aantoont dat hij ten tijde van de verklaring of het instellen van de
      vordering tot vernietiging niet ten gevolge van de rechtshandeling gebaat was.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel45
  - number: '45.4'
    text: |-
      Een schuldeiser die wegens benadeling tegen een rechtshandeling opkomt, vernietigt deze slechts te zijnen behoeve
      en niet verder dan nodig is ter opheffing van de door hem ondervonden benadeling.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel45
  - number: '45.5'
    text: |-
      Rechten, door derden te goeder trouw anders dan om niet verkregen op goederen die het voorwerp waren van de
      vernietigde rechtshandeling, worden geëerbiedigd. Ten aanzien van de derde te goeder trouw die om niet heeft
      verkregen, heeft de vernietiging geen werking voor zover hij aantoont dat hij op het ogenblik dat het goed van hem
      wordt opgeëist, niet ten gevolge van de rechtshandeling gebaat is.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel45
  - number: '46.1'
    text: |-
      Indien de rechtshandeling waardoor een of meer schuldeisers zijn benadeeld, is verricht binnen één jaar voor
      het inroepen van de vernietigingsgrond en de schuldenaar zich niet reeds voor de aanvang van die termijn tot die
      rechtshandeling had verplicht, wordt vermoed dat men aan beide zijden wist of behoorde te weten dat een zodanige
      benadeling het gevolg van de rechtshandeling zou zijn:
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel46
  - number: 46.1.1°
    text: |-
      bij overeenkomsten, waarbij de waarde der verbintenis aan de zijde van de schuldenaar aanmerkelijk die der
      verbintenis aan de andere zijde overtreft;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel46
  - number: 46.1.2°
    text: bij rechtshandelingen ter voldoening van of zekerheidstelling voor een niet opeisbare schuld;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel46
  - number: 46.1.3°
    text: 'bij rechtshandelingen, door de schuldenaar die een natuurlijk persoon is, verricht met of jegens:'
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel46
  - number: 46.1.3°.a
    text: zijn echtgenoot, zijn pleegkind of een bloed- of aanverwant tot in de derde graad;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel46
  - number: 46.1.3°.b
    text: |-
      een rechtspersoon waarin hij, zijn echtgenoot, zijn pleegkind of een bloed- of aanverwant tot in de derde graad
      bestuurder of commissaris is, dan wel waarin deze personen, afzonderlijk of tezamen, als aandeelhouder rechtstreeks
      of middellijk voor ten minste de helft van het geplaatste kapitaal deelnemen;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel46
  - number: 46.1.4°
    text: 'bij rechtshandelingen, door de schuldenaar die rechtspersoon is, verricht met of jegens een natuurlijk persoon:'
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel46
  - number: 46.1.4°.a
    text: |-
      die bestuurder of commissaris van de rechtspersoon is, dan wel met of jegens diens echtgenoot, pleegkind of bloed-
      of aanverwant tot in de derde graad;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel46
  - number: 46.1.4°.b
    text: |-
      die al dan niet tezamen met zijn echtgenoot, zijn pleegkinderen en zijn bloed- of aanverwanten tot in de derde
      graad, als aandeelhouder rechtstreeks of middellijk voor ten minste de helft van het geplaatste kapitaal deelneemt;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel46
  - number: 46.1.4°.c
    text: |-
      wiens echtgenoot, pleegkinderen of bloed- of aanverwanten tot in de derde graad, afzonderlijk of tezamen, als
      aandeelhouder rechtstreeks of middellijk voor tenminste de helft van het geplaatste kapitaal deelnemen;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel46
  - number: 46.1.5°
    text: |-
      bij rechtshandelingen, door de schuldenaar die rechtspersoon is, verricht met of jegens een andere rechtspersoon,
      indien
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel46
  - number: 46.1.5°.a
    text: een van deze rechtspersonen bestuurder is van de andere;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel46
  - number: 46.1.5°.b
    text: |-
      een bestuurder, natuurlijk persoon, van een van deze rechtspersonen, of diens echtgenoot, pleegkind of bloed- of
      aanverwant tot in de derde graad, bestuurder is van de andere;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel46
  - number: 46.1.5°.c
    text: |-
      een bestuurder, natuurlijk persoon, of een commissaris van een van deze rechtspersonen, of diens echtgenoot,
      pleegkind of bloed- of aanverwant tot in de derde graad, afzonderlijk of tezamen, als aandeelhouder rechtstreeks of
      middellijk voor ten minste de helft van het geplaatste kapitaal deelneemt in de andere;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel46
  - number: 46.1.5°.d
    text: |-
      in beide rechtspersonen voor ten minste de helft van het geplaatste kapitaal rechtstreeks of middellijk wordt
      deelgenomen door dezelfde rechtspersoon, dan wel dezelfde natuurlijke persoon, al dan niet tezamen met zijn
      echtgenoot, zijn pleegkinderen en zijn bloed- of aanverwanten tot in de derde graad;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel46
  - number: 46.1.6°
    text: bij rechtshandelingen, door de schuldenaar die rechtspersoon is, verricht met of jegens een groepsmaatschappij.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel46
  - number: '46.2'
    text: Met een echtgenoot wordt een geregistreerde partner of een andere levensgezel gelijkgesteld.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel46
  - number: '46.3'
    text: Onder pleegkind wordt verstaan hij die duurzaam als eigen kind is verzorgd en opgevoed.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel46
  - number: '46.4'
    text: |-
      Onder bestuurder, commissaris of aandeelhouder wordt mede verstaan hij die minder dan een jaar vóór de
      rechtshandeling bestuurder, commissaris of aandeelhouder is geweest.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel46
  - number: '46.5'
    text: |-
      Indien de bestuurder van een rechtspersoon-bestuurder zelf een rechtspersoon is, wordt deze rechtspersoon met de
      rechtspersoon-bestuurder gelijkgesteld.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel46
  - number: '47'
    text: |-
      In geval van benadeling door een rechtshandeling om niet, die de schuldenaar heeft verricht binnen één jaar vóór
      het inroepen van de vernietigingsgrond, wordt vermoed dat hij wist of behoorde te weten dat benadeling van een of
      meer schuldeisers het gevolg van de rechtshandeling zou zijn.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel47
  - number: '48'
    text: |-
      Onder schuldenaar in de zin van de drie vorige artikelen is begrepen hij op wiens goed voor de schuld van een ander
      verhaal kan worden genomen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel48
  - number: '49'
    text: |-
      Een vernietigbare rechtshandeling wordt vernietigd hetzij door een buitengerechtelijke verklaring, hetzij door een
      rechterlijke uitspraak.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel49
  - number: '50.1'
    text: |-
      Een buitengerechtelijke verklaring die een rechtshandeling vernietigt, wordt door hem in wiens belang de
      vernietigingsgrond bestaat, gericht tot hen die partij bij de rechtshandeling zijn.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel50
  - number: '50.2'
    text: |-
      Een buitengerechtelijke verklaring kan een rechtshandeling met betrekking tot een registergoed die heeft geleid
      tot een inschrijving in de openbare registers of tot een tot levering van een registergoed, bestemde akte, slechts
      vernietigen indien alle partijen in de vernietiging berusten.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel50
  - number: '51.1'
    text: |-
      Een rechterlijke uitspraak vernietigt een rechtshandeling, doordat zij een beroep in rechte op een
      vernietigingsgrond aanvaardt.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel51
  - number: '51.2'
    text: |-
      Een rechtsvordering tot vernietiging van een rechtshandeling wordt ingesteld tegen hen die partij bij de
      rechtshandeling zijn.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel51
  - number: '51.3'
    text: |-
      Een beroep in rechte op een vernietigingsgrond kan te allen tijde worden gedaan ter afwering van een op de
      rechtshandeling steunende vordering of andere rechtsmaatregel. Hij die dit beroep doet, is verplicht om zo spoedig
      mogelijk daarvan mededeling te doen aan de partijen bij de rechtshandeling die niet in het geding zijn verschenen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel51
  - number: '52.1'
    text: 'Rechtsvorderingen tot vernietiging van een rechtshandeling verjaren:'
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel52
  - number: 52.1.a
    text: |-
      in geval van onbekwaamheid: drie jaren nadat de onbekwaamheid is geëindigd, of, indien de onbekwame een wettelijke
      vertegenwoordiger heeft, drie jaren nadat de handeling ter kennis van de wettelijke vertegenwoordiger is gekomen;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel52
  - number: 52.1.b
    text: 'in geval van bedreiging of misbruik van omstandigheden: drie jaren nadat deze invloed heeft opgehouden te werken;'
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel52
  - number: 52.1.c
    text: 'in geval van bedrog, dwaling of benadeling: drie jaren nadat het bedrog, de dwaling of de benadeling is ontdekt;'
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel52
  - number: 52.1.d
    text: |-
      in geval van een andere vernietigingsgrond: drie jaren nadat de bevoegdheid om deze vernietigingsgrond in te
      roepen, aan degene aan wie deze bevoegdheid toekomt, ten dienste is komen te staan.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel52
  - number: '52.2'
    text: |-
      Na de verjaring van de rechtsvordering tot vernietiging van de rechtshandeling kan deze niet meer op dezelfde
      vernietigingsgrond door een buitengerechtelijke verklaring worden vernietigd.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel52
  - number: '53.1'
    text: De vernietiging werkt terug tot het tijdstip waarop de rechtshandeling is verricht.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel53
  - number: '53.2'
    text: |-
      Indien de reeds ingetreden gevolgen van een rechtshandeling bezwaarlijk ongedaan gemaakt kunnen worden, kan
      de rechter desgevraagd aan een vernietiging geheel of ten dele haar werking ontzeggen. Hij kan aan een partij
      die daardoor onbillijk wordt bevoordeeld, de verplichting opleggen tot een uitkering in geld aan de partij die
      benadeeld wordt.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel53
  - number: '54.1'
    text: |-
      De bevoegdheid om ter vernietiging van een meerzijdige rechtshandeling een beroep te doen op misbruik van
      omstandigheden vervalt, wanneer de wederpartij tijdig een wijziging van de gevolgen van de rechtshandeling
      voorstelt, die het nadeel op afdoende wijze opheft.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel54
  - number: '54.2'
    text: |-
      Bovendien kan de rechter op verlangen van een der partijen, in plaats van een vernietiging wegens misbruik van
      omstandigheden uit te spreken, ter opheffing van dit nadeel de gevolgen van de rechtshandeling wijzigen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel54
  - number: '55.1'
    text: |-
      De bevoegdheid om ter vernietiging van een rechtshandeling een beroep op een vernietigingsgrond te doen vervalt,
      wanneer hij aan wie deze bevoegdheid toekomt, de rechtshandeling heeft bevestigd, nadat de verjaringstermijn ter
      zake van de rechtsvordering tot vernietiging op die grond een aanvang heeft genomen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel55
  - number: '55.2'
    text: |-
      Eveneens vervalt de bevoegdheid om een beroep op een vernietigingsgrond te doen, wanneer een onmiddellijk
      belanghebbende na de aanvang van de verjaringstermijn aan hem aan wie deze bevoegdheid toekomt een redelijke
      termijn heeft gesteld om te kiezen tussen bevestiging en vernietiging en deze binnen deze termijn geen keuze heeft
      gedaan.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel55
  - number: '56'
    text: |-
      Voor de toepassing van de [artikelen 50-55][ref1] gelden mede als partij:


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel50
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '50'
  - number: 56.a
    text: 'in geval van eenzijdige tot een of meer bepaalde personen gerichte rechtshandeling: die personen;'
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel56
  - number: 56.b
    text: |-
      in geval van andere eenzijdige rechtshandelingen: zij die onmiddellijk belanghebbenden zijn bij de instandhouding
      van die handeling.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel56
  - number: '57'
    text: |-
      Behoeft een rechtshandeling om het beoogde gevolg te hebben goedkeuring, machtiging, vergunning of enige andere
      vorm van toestemming van een overheidsorgaan of van een andere persoon, die geen partij bij de rechtshandeling is,
      dan kan iedere onmiddellijk belanghebbende aan hen die partij bij de rechtshandeling zijn geweest, aanzeggen dat,
      indien niet binnen een redelijke, bij die aanzegging gestelde termijn die toestemming wordt verkregen, de handeling
      te zijnen aanzien zonder gevolg zal blijven.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel57
  - number: '58.1'
    text: |-
      Wanneer eerst na het verrichten van een rechtshandeling een voor haar geldigheid gesteld wettelijk vereiste wordt
      vervuld, maar alle onmiddellijk belanghebbenden die zich op dit gebrek hadden kunnen beroepen, in de tussen de
      handeling en de vervulling van het vereiste liggende tijdsruimte de handeling als geldig hebben aangemerkt, is
      daarmede de rechtshandeling bekrachtigd.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel58
  - number: '58.2'
    text: |-
      Het vorige lid is niet van toepassing op het geval dat een rechtshandeling nietig is als gevolg van
      handelingsonbekwaamheid van degene die haar heeft verricht en deze vervolgens handelingsbekwaam wordt.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel58
  - number: '58.3'
    text: |-
      Inmiddels verkregen rechten van derden behoeven aan bekrachtiging niet in de weg te staan, mits zij worden
      geëerbiedigd.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel58
  - number: '59'
    text: |-
      Buiten het vermogensrecht vinden de bepalingen van deze titel overeenkomstige toepassing, voor zover de aard van de
      rechtshandeling of van de rechtsbetrekking zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel59
  - number: '60.1'
    text: |-
      Volmacht is de bevoegdheid die een volmachtgever verleent aan een ander, de gevolmachtigde, om in zijn naam
      rechtshandelingen te verrichten.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel60
  - number: '60.2'
    text: |-
      Waar in deze titel van rechtshandeling wordt gesproken, is daaronder het in ontvangst nemen van een verklaring
      begrepen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel60
  - number: '61.1'
    text: Een volmacht kan uitdrukkelijk of stilzwijgend worden verleend.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel61
  - number: '61.2'
    text: |-
      Is een rechtshandeling in naam van een ander verricht, dan kan tegen de wederpartij, indien zij op grond van een
      verklaring of gedraging van die ander heeft aangenomen en onder de gegeven omstandigheden redelijkerwijze mocht
      aannemen dat een toereikende volmacht was verleend, op de onjuistheid van deze veronderstelling geen beroep worden
      gedaan.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel61
  - number: '61.3'
    text: |-
      Indien een volgens wet of gebruik openbaar gemaakte volmacht beperkingen bevat, die zo ongebruikelijk zijn dat de
      wederpartij ze daarin niet behoefde te verwachten, kunnen deze haar niet worden tegengeworpen, tenzij zij ze kende.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel61
  - number: '62.1'
    text: |-
      Een algemene volmacht strekt zich slechts uit tot daden van beschikking, indien schriftelijk en ondubbelzinnig is
      bepaald dat zij zich ook tot die daden uitstrekt. Onder algemene volmacht wordt verstaan de volmacht die alle zaken
      van de volmachtgever en alle rechtshandelingen omvat, met uitzondering van hetgeen ondubbelzinnig is uitgesloten.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel62
  - number: '62.2'
    text: |-
      Een bijzondere volmacht die in algemene bewoordingen is verleend, strekt zich slechts uit tot daden van beschikking
      indien dit ondubbelzinnig is bepaald. Niettemin strekt een volmacht die voor een bepaald doel is verleend, zich uit
      tot alle daden van beheer en van beschikking die dienstig kunnen zijn tot het bereiken van dit doel.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel62
  - number: '63.1'
    text: |-
      De omstandigheid dat iemand onbekwaam is tot het verrichten van rechtshandelingen voor zichzelf, maakt hem niet
      onbekwaam tot het optreden als gevolmachtigde.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel63
  - number: '63.2'
    text: |-
      Wanneer een volmacht door een onbekwaam persoon is verleend, is een krachtens die volmacht door de gevolmachtigde
      verrichte rechtshandeling op gelijke wijze geldig, nietig of vernietigbaar, als wanneer zij door de onbekwame zelf
      zou zijn verricht.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel63
  - number: '64'
    text: |-
      Tenzij anders is bepaald, is een gevolmachtigde slechts in de navolgende gevallen bevoegd de hem verleende volmacht
      aan een ander te verlenen:
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel64
  - number: 64.a
    text: |-
      voor zover de bevoegdheid hiertoe uit de aard der te verrichten rechtshandelingen noodzakelijk voortvloeit of in
      overeenstemming is met het gebruik;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel64
  - number: 64.b
    text: |-
      voor zover de verlening van de volmacht aan een andere persoon in het belang van de volmachtgever noodzakelijk is
      en deze zelf niet in staat is een voorziening te treffen;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel64
  - number: 64.c
    text: |-
      voor zover de volmacht goederen betreft, die gelegen zijn buiten het land waarin de gevolmachtigde zijn woonplaats
      heeft.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel64
  - number: '65'
    text: |-
      Is een volmacht aan twee of meer personen tezamen verleend, dan is ieder van hen bevoegd zelfstandig te handelen,
      tenzij anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel65
  - number: '66.1'
    text: |-
      Een door de gevolmachtigde binnen de grenzen van zijn bevoegdheid in naam van de volmachtgever verrichte
      rechtshandeling treft in haar gevolgen de volmachtgever.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel66
  - number: '66.2'
    text: |-
      Voor zover het al of niet aanwezig zijn van een wil of van wilsgebreken, alsmede bekendheid of onbekendheid met
      feiten van belang zijn voor de geldigheid of de gevolgen van een rechtshandeling, komen ter beoordeling daarvan
      de volmachtgever of de gevolmachtigde of beiden in aanmerking, al naar gelang het aandeel dat ieder van hen heeft
      gehad in de totstandkoming van de rechtshandeling en in de bepaling van haar inhoud.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel66
  - number: '67.1'
    text: |-
      Hij die een overeenkomst aangaat in naam van een nader te noemen volmachtgever, moet diens naam noemen binnen de
      door de wet, de overeenkomst of het gebruik bepaalde termijn of, bij gebreke hiervan, binnen een redelijke termijn.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel67
  - number: '67.2'
    text: |-
      Wanneer hij de naam van de volmachtgever niet tijdig noemt, wordt hij geacht de overeenkomst voor zichzelf te
      hebben aangegaan, tenzij uit de overeenkomst anders voortvloeit.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel67
  - number: '68'
    text: |-
      Tenzij anders is bepaald, kan een gevolmachtigde slechts dan als wederpartij van de volmachtgever optreden,
      wanneer de inhoud van de te verrichten rechtshandeling zo nauwkeurig vaststaat, dat strijd tussen beider belangen
      uitgesloten is.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel68
  - number: '69.1'
    text: |-
      Wanneer iemand zonder daartoe bevoegd te zijn als gevolmachtigde in naam van een ander heeft gehandeld, kan
      laatstgenoemde de rechtshandeling bekrachtigen en haar daardoor hetzelfde gevolg verschaffen, als zou zijn
      ingetreden wanneer zij krachtens een volmacht was verricht.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel69
  - number: '69.2'
    text: |-
      Is voor het verlenen van een volmacht tot de rechtshandeling een bepaalde vorm vereist, dan geldt voor de
      bekrachtiging hetzelfde vereiste.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel69
  - number: '69.3'
    text: |-
      Een bekrachtiging heeft geen gevolg, indien op het tijdstip waarop zij geschiedt, de wederpartij reeds heeft
      te kennen gegeven dat zij de handeling wegens het ontbreken van een volmacht als ongeldig beschouwt, tenzij de
      wederpartij op het tijdstip dat zij handelde heeft begrepen of onder de gegeven omstandigheden redelijkerwijs heeft
      moeten begrijpen dat geen toereikende volmacht was verleend.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel69
  - number: '69.4'
    text: |-
      Een onmiddellijk belanghebbende kan degene in wiens naam gehandeld is, een redelijke termijn voor de bekrachtiging
      stellen. Hij behoeft niet met een gedeeltelijke of voorwaardelijke bekrachtiging genoegen te nemen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel69
  - number: '69.5'
    text: Rechten door de volmachtgever vóór de bekrachtiging aan derden verleend, blijven gehandhaafd.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel69
  - number: '70'
    text: |-
      Hij die als gevolmachtigde handelt, staat jegens de wederpartij in voor het bestaan en de omvang van de volmacht,
      tenzij de wederpartij weet of behoort te begrijpen dat een toereikende volmacht ontbreekt of de gevolmachtigde de
      inhoud van de volmacht volledig aan de wederpartij heeft medegedeeld.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel70
  - number: '71.1'
    text: |-
      Verklaringen, door een gevolmachtigde afgelegd, kunnen door de wederpartij als ongeldig van de hand worden gewezen,
      indien zij de gevolmachtigde terstond om bewijs van de volmacht heeft gevraagd en haar niet onverwijld hetzij een
      geschrift waaruit de volmacht volgt is overgelegd, hetzij de volmacht door de volmachtgever is bevestigd.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel71
  - number: '71.2'
    text: |-
      Bewijs van volmacht kan niet worden verlangd, indien de volmacht door de volmachtgever ter kennis van de
      wederpartij was gebracht, indien zij op een door wet of gebruik bepaalde wijze was bekendgemaakt, of indien zij
      voortvloeit uit een aanstelling waarmede de wederpartij bekend is.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel71
  - number: '72'
    text: 'Een volmacht eindigt:'
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel72
  - number: 72.a
    text: |-
      door de dood, de ondercuratelestelling, het faillissement van de volmachtgever of het ten aanzien van hem van
      toepassing verklaren van de schuldsaneringsregeling natuurlijke personen;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel72
  - number: 72.b
    text: |-
      door de dood, de ondercuratelestelling, het faillissement van de gevolmachtigde of het ten aanzien van hem van
      toepassing verklaren van de schuldsaneringsregeling natuurlijke personen, tenzij anders is bepaald;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel72
  - number: 72.c
    text: door herroeping door de volmachtgever;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel72
  - number: 72.d
    text: door opzegging door de gevolmachtigde.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel72
  - number: '73.1'
    text: |-
      Niettegenstaande de dood of de ondercuratelestelling van de volmachtgever blijft de gevolmachtigde bevoegd de
      rechtshandelingen te verrichten, die nodig zijn voor het beheer van een onderneming.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel73
  - number: '73.2'
    text: |-
      Niettegenstaande de dood of de ondercuratelestelling van de volmachtgever blijft de gevolmachtigde bevoegd
      rechtshandelingen te verrichten, die niet zonder nadeel kunnen worden uitgesteld. Hetzelfde geldt indien de
      gevolmachtigde de volmacht heeft opgezegd.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel73
  - number: '73.3'
    text: |-
      De in de vorige leden vermelde bevoegdheid eindigt een jaar na het overlijden, de ondercuratelestelling of de
      opzegging.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel73
  - number: '74.1'
    text: |-
      Voor zover een volmacht strekt tot het verrichten van een rechtshandeling in het belang van de gevolmachtigde
      of van een derde, kan worden bepaald dat zij onherroepelijk is, of dat zij niet eindigt door de dood of
      ondercuratelestelling van de volmachtgever. Eerstgenoemde bepaling sluit, tenzij anders blijkt, de tweede in.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel74
  - number: '74.2'
    text: |-
      Bevat de volmacht een bepaling als in het vorige lid bedoeld, dan mag de wederpartij aannemen dat het aldaar voor
      de geldigheid van die bepaling gestelde vereiste vervuld is, tenzij het tegendeel voor haar duidelijk kenbaar is.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel74
  - number: '74.3'
    text: |-
      Tenzij anders is bepaald, kan de gevolmachtigde een overeenkomstig het eerste lid onherroepelijk verleende volmacht
      ook buiten de in [artikel 64][ref1] genoemde gevallen aan een ander verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel64
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '64'
  - number: '74.4'
    text: |-
      De rechtbank kan op verzoek van de volmachtgever, of van een erfgenaam of de curator van de volmachtgever, een
      bepaling als in het eerste lid bedoeld wegens gewichtige redenen wijzigen of buiten werking stellen.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel74
  - number: '75.1'
    text: |-
      Na het einde van de volmacht moet de gevolmachtigde desgevorderd geschriften waaruit de volmacht blijkt, teruggeven
      of toestaan dat de volmachtgever daarop aantekent dat de volmacht is geëindigd. In geval van een bij notariële akte
      verleende volmacht tekent de notaris die de minuut onder zijn berusting heeft, op verzoek van de volmachtgever het
      einde van de volmacht daarop aan.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel75
  - number: '75.2'
    text: |-
      Wanneer te vrezen is dat een gevolmachtigde van een volmacht ondanks haar einde gebruik zal maken, kan de
      volmachtgever zich wenden tot de voorzieningenrechter van de rechtbank met verzoek de wijze van bekendmaking van
      het einde van de volmacht te bepalen, die ten gevolge zal hebben dat het tegen een ieder kan worden ingeroepen.
      Tegen een toewijzende beschikking krachtens dit lid is geen hogere voorziening toegelaten.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel75
  - number: '76.1'
    text: |-
      Een oorzaak die de volmacht heeft doen eindigen, kan tegenover een wederpartij die noch van het einde van de
      volmacht, noch van die oorzaak kennis droeg, slechts worden ingeroepen:
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel76
  - number: 76.1.a
    text: |-
      indien het einde van de volmacht of de oorzaak die haar heeft doen eindigen aan de wederpartij was medegedeeld of
      was bekend gemaakt op een wijze die krachtens wet of verkeersopvattingen meebrengt dat de volmachtgever het einde
      van de volmacht aan de wederpartij kan tegenwerpen;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel76
  - number: 76.1.b
    text: indien de dood van de volmachtgever van algemene bekendheid was;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel76
  - number: 76.1.c
    text: |-
      indien de aanstelling of tewerkstelling, waaruit de volmacht voortvloeide, op een voor derden kenbare wijze was
      beëindigd;
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel76
  - number: 76.1.d
    text: |-
      indien de wederpartij van de volmacht op geen andere wijze had kennis gekregen dan door een verklaring van de
      gevolmachtigde.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel76
  - number: '76.2'
    text: |-
      In de gevallen van het vorige lid is de gevolmachtigde die voortgaat op naam van de volmachtgever te handelen, tot
      schadevergoeding gehouden jegens de wederpartij die van het einde van de volmacht geen kennis droeg. Hij is niet
      aansprakelijk indien hij wist noch behoorde te weten dat de volmacht was geëindigd.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel76
  - number: '77'
    text: |-
      Wordt ondanks de dood van de volmachtgever krachtens de volmacht een geldige rechtshandeling verricht, dan worden
      de erfgenamen van de volmachtgever en de wederpartij gebonden alsof de handeling bij het leven van de volmachtgever
      was verricht.
    url: https://wetten.overheid.nl/BWBR0005291/2024-05-01#Artikel77
  - number: '78'
    text: |-
      Wanneer iemand optreedt als vertegenwoordiger uit anderen hoofde dan volmacht, zijn de [artikelen 63, lid 1][ref1],
      [66, lid 1][ref2], [67][ref3], [69][ref4], [70][ref5], [71][ref6] en [75 lid 2][ref7] van overeenkomstige
      toepassing, voor zover uit de wet niet anders voortvloeit.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel63
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel66
