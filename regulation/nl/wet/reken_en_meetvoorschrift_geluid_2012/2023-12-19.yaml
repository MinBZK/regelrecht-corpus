articles:
  - number: 1.1.1
    text: |-
      In deze regeling wordt verstaan onder: - *geluidplafondkaart:* geluidplafondkaart als bedoeld in de
      [artikelen 11.17][ref1] en [11.18 van de Wet milieubeheer][ref2];
        - *geluidregister:* geluidregister als bedoeld in [artikel 11.25 van de Wet milieubeheer][ref3];
        - *gevel:* gevel als bedoeld in [artikel 1 van de Wet geluidhinder][ref4] en
      [artikel 1 van het Besluit geluid milieubeheer][ref5];
        - *Minister:* Minister van Infrastructuur en Milieu;
        - *motorvoertuigen:* a. lichte motorvoertuigen (lv): motorvoertuigen op drie of meer wielen, met uitzondering
      van de in categorie mv en categorie zv bedoelde motorvoertuigen; b. middelzware motorvoertuigen (mv): gelede en
      ongelede autobussen, alsmede andere motorvoertuigen die ongeleed zijn en voorzien van een enkele achteras waarop
      vier banden zijn gemonteerd; c. zware motorvoertuigen (zv): gelede motorvoertuigen, alsmede motorvoertuigen die
      zijn voorzien van een dubbele achteras, met uitzondering van autobussen;
        - *plafondcorrectiewaarde:* getal waarmee de geluidemissie wordt vermeerderd met betrekking tot een daarbij
      aangegeven gedeelte van een weg of spoorweg ten behoeve van het bepalen van de geluidproductie dan wel de
      geluidsbelasting.


