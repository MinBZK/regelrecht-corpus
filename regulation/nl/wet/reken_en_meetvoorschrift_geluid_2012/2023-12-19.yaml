    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel6.5
  - number: 6.5.2
    text: |-
      In afwijking van het eerste lid wordt bij spoorwegverkeersgeluid het in het eerste lid gegeven spectrum voor
      wegverkeersgeluid toegepast, indien in het maatgevende jaar op een spoorweg meer dan 30% spoorvoertuigen passeren
      behorende tot de spoorvoertuigcategorieën 4, 5 of 11, bedoeld in hoofdstuk 1 van [bijlage IV][ref1] bij deze
      regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0031722
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel6.5
    references:
      - id: ref1
        bwb_id: BWBR0031722
  - number: '7'
    text: |-
      Dit hoofdstuk en de daarbij behorende [bijlage VII][ref1] zijn van toepassing bij het opstellen van
      geluidsbelastingkaarten.


      [ref1]: https://wetten.overheid.nl/BWBR0031722
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0031722
  - number: '8.1'
    text: |-
      De volgende regelingen worden ingetrokken: - [Reken- en meetvoorschrift geluidhinder 2006][ref1];
        - [Reken- en Meetvoorschrift Railverkeerlawaai][ref2];
        - [Reken- en meetvoorschrift wegverkeerslawaai 2002][ref3];
        - [Meet- en rekenvoorschrift industrielawaai][ref4];
        - [Meet- en rekenvoorschrift geluidsbelasting binnen gebouwen][ref5];
        - [Meet- en rekenvoorschrift hoofdstuk V Wet geluidhinder][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0020773
      [ref2]: https://wetten.overheid.nl/BWBR0004171
      [ref3]: https://wetten.overheid.nl/BWBR0013548
      [ref4]: https://wetten.overheid.nl/BWBR0012527
      [ref5]: https://wetten.overheid.nl/BWBR0003529
      [ref6]: https://wetten.overheid.nl/BWBR0003513
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel8.1
