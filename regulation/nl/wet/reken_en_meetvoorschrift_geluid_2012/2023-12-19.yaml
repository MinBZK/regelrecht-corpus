    text: ontwerpbestemmingsplan dat reeds ter inzage is gelegd;
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel2.3
  - number: 2.3.2.f
    text: |-
      ontwerpbesluit voor een omgevingsvergunning waarbij met toepassing van
      [artikel 2.12, eerste lid, onder a, onder 3°, van de Wet algemene bepalingen omgevingsrecht][ref1] van het
      bestemmingsplan wordt afgeweken dat reeds ter inzage is gelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 2.3.2.g
    text: |-
      ontwerpbesluit voor een omgevingsvergunning op grond van
      [artikel 2.1, eerste lid, aanhef en onder e, van de Wet algemene bepalingen omgevingsrecht][ref1] dat reeds ter
      inzage is gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 2.3.3
    text: |-
      Indien meer bestuursorganen bevoegd zijn tot het vaststellen van een hogere waarde
      met betrekking tot de geluidsbelasting vanwege een industrieterrein op grond van
      [artikel 110a van de Wet geluidhinder][ref1] of tot het verlenen van een omgevingsvergunning op grond van
      [artikel 2.1, eerste lid, aanhef en onder e, van de Wet algemene bepalingen omgevingsrecht][ref2] voor op dat
      industrieterrein gelegen inrichtingen, kan de aftrek, bedoeld in het tweede lid, slechts worden toegepast na
      overleg met die bestuursorganen.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel110a
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 110a
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 2.3.4
    text: |-
      Direct dan wel zo spoedig mogelijk na de bekendmaking van een besluit waarin bij de bepaling van het equivalent
      geluidsniveau vanwege een industrieterrein of een gedeelte daarvan, een aftrek bedoeld in het tweede lid is
      toegepast, wordt van dat besluit mededeling gedaan aan de bestuursorganen, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel2.3
  - number: '2.4'
    text: |-
      Van de in [artikel 2.3, eerste lid][ref1], bedoelde methoden kan geheel of gedeeltelijk worden afgeweken indien
      aannemelijk wordt gemaakt dat de vervangende werkwijze:


      [ref1]: https://wetten.overheid.nl/BWBR0031722#Artikel2
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0031722
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.4.a
    text: |-
      een belangrijke tijdsbesparing of kostenbesparing oplevert en in de betreffende situatie nagenoeg even nauwkeurig
      is als een van de bedoelde methoden,
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel2.4
  - number: 2.4.b
    text: in de betreffende situatie belangrijk nauwkeuriger is dan een van de bedoelde methoden, of
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel2.4
  - number: 2.4.c
    text: |-
      voldoende nauwkeurig is en geen van de bedoelde methoden in de betreffende situatie leidt tot een voldoende
      representatief equivalent geluidsniveau.
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel2.4
  - number: '3.1'
    text: 'Dit hoofdstuk is van toepassing op de bepaling van de equivalente geluidsniveaus en van de geluidsbelasting bij:'
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel3.1
  - number: 3.1.a
    text: de aanleg en reconstructie van wegen die niet zijn aangegeven op de geluidplafondkaart;
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel3.1
  - number: 3.1.b
    text: |-
      de sanering van de op grond van [artikel 88, eerste lid, van de Wet geluidhinder][ref1], zoals dat luidde voor
      1 januari 2007, aan Onze Minister gemelde aanwezige woningen, andere geluidsgevoelige gebouwen en geluidsgevoelige
      terreinen, voor zover die zijn gemeld vanwege de ondervonden geluidsbelasting van wegen die niet zijn aangegeven op
      de geluidplafondkaart;


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel88
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '88'
  - number: 3.1.c
    text: |-
      de projectie van woningen, andere geluidsgevoelige gebouwen en geluidsgevoelige terreinen binnen de zones van
      wegen, bedoeld in [artikel 74 van de Wet geluidhinder][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel74
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '74'
  - number: 3.2.1
    text: |-
      Het equivalent geluidsniveau wordt bepaald volgens de in hoofdstuk 2 van [bijlage III][ref1] bij deze regeling
      beschreven Standaardrekenmethode 2.


      [ref1]: https://wetten.overheid.nl/BWBR0031722
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0031722
  - number: 3.2.2
    text: |-
      In afwijking van het eerste lid kan het equivalent geluidsniveau worden bepaald volgens de in hoofdstuk 1 van
      [bijlage III][ref1] bij deze regeling beschreven Standaardrekenmethode 1, indien de desbetreffende situatie valt
      binnen het toepassingsgebied van die Standaardrekenmethode 1.


      [ref1]: https://wetten.overheid.nl/BWBR0031722
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0031722
  - number: 3.2.3
    text: |-
      In afwijking van het eerste en tweede lid kan het equivalent geluidsniveau tevens worden bepaald volgens de
      Standaardmeetmethode, bedoeld in hoofdstuk 3 van [bijlage III][ref1] bij deze regeling, indien de desbetreffende
      situatie valt binnen het toepassingsgebied van die Standaardmeetmethode.


      [ref1]: https://wetten.overheid.nl/BWBR0031722
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0031722
  - number: '3.3'
    text: 'Indien een spoorweg onderdeel is van een weg:'
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel3.3
  - number: 3.3.a
    text: |-
      kan voor de bepaling van het equivalent geluidsniveau vanwege deze spoorweg gebruik worden gemaakt van
      [hoofdstuk 4][ref1], van de emissiegetallen voor trams uit [bijlage III][ref2], of van op metingen gebaseerde
      emissiegetallen, en


      [ref1]: https://wetten.overheid.nl/BWBR0031722#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0031722
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0031722
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0031722
  - number: 3.3.b
    text: |-
      is het equivalent geluidsniveau vanwege de weg gelijk aan de som van het onder a bepaalde equivalent geluidsniveau
      en het met toepassing van dit hoofdstuk bepaalde equivalent geluidsniveau als gevolg van het wegverkeer op die weg.
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel3.3
  - number: 3.4.1
    text: |-
      De ingevolge [artikel 110g van de Wet geluidhinder][ref1] toe te passen aftrek op de geluidsbelasting vanwege
      een weg, van de gevel van woningen of van andere geluidsgevoelige gebouwen of aan de grens van geluidsgevoelige
      terreinen bedraagt:


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel110g
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 110g
  - number: 3.4.1.a
    text: |-
      3 dB voor wegen waarvoor de representatief te achten snelheid van lichte motorvoertuigen 70 km/uur of meer bedraagt
      en de geluidsbelasting vanwege de weg zonder toepassing van [artikel 110g van de Wet geluidhinder][ref1] 56 dB is;


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel110g
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 110g
  - number: 3.4.1.b
    text: |-
      4 dB voor wegen waarvoor de representatief te achten snelheid van lichte motorvoertuigen 70 km/uur of meer bedraagt
      en de geluidsbelasting vanwege de weg zonder toepassing van [artikel 110g van de Wet geluidhinder][ref1] 57 dB is;


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel110g
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 110g
  - number: 3.4.1.c
    text: |-
      2 dB voor wegen waarvoor de representatief te achten snelheid van lichte motorvoertuigen 70 km/uur of meer bedraagt
      en de geluidsbelasting afwijkt van de onder a en b genoemde waarden;
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel3.4
  - number: 3.4.1.d
    text: 5 dB voor de overige wegen;
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel3.4
  - number: 3.4.1.e
    text: |-
      0 dB bij toepassing van de [artikelen 3.2][ref1] en [3.3 van het Bouwbesluit 2012][ref2] en bij toepassing van de
      [artikelen 111b, tweede en derde lid][ref3], [112][ref4] en [113 van de Wet geluidhinder][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0030461#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel111b
      [ref4]: https://wetten.overheid.nl/BWBR0003227#Artikel112
      [ref5]: https://wetten.overheid.nl/BWBR0003227#Artikel113
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0030461
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0003227
        artikel: 111b
      - id: ref4
        bwb_id: BWBR0003227
        artikel: '112'
      - id: ref5
        bwb_id: BWBR0003227
        artikel: '113'
  - number: 3.4.2
    text: |-
      In afwijking van het eerste lid wordt bij de vaststelling van een verschil tussen twee geluidsbelastingen,
      uitgegaan van:
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel3.4
  - number: 3.4.2.a
    text: |-
      de bij de vastgestelde waarde gehanteerde waarde voor de toe te passen aftrek ingevolge
      [artikel 110g van de Wet geluidhinder][ref1] indien één van de geluidsbelastingen betrekking heeft op een
      vastgestelde ten hoogste toelaatbare waarde waarbij de in het eerste lid, onder a of b, genoemde waarde is
      gehanteerd en de berekening van de andere geluidsbelasting betrekking heeft op een situatie met een representatief
      te achten snelheid voor lichte motorvoertuigen van 70 km/uur of meer;


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel110g
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 110g
  - number: 3.4.2.b
    text: |-
      de in het eerste lid onder c, d of e genoemde waarden voor de toe te passen aftrek ingevolge
      [artikel 110g van de Wet geluidhinder][ref1] in de overige gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel110g
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 110g
  - number: 3.5.1
    text: |-
      Bij de berekening van het equivalent geluidsniveau vanwege een weg wordt voor wegen waarvoor de representatief te
      achten snelheid van lichte motorvoertuigen 70 kilometer per uur of meer bedraagt, 2 dB in mindering gebracht op de
      wegdekcorrectie bepaald overeenkomstig [bijlage III][ref1] bij deze regeling of als het wegdek bestaat uit dicht
      asfaltbeton, in afwijking van het gestelde in paragraaf 1.5 en 2.4.2 van bijlage III een wegdekcorrectie van 2 dB
      in rekening gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0031722
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0031722
  - number: 3.5.2
    text: |-
      In afwijking van het eerste lid wordt 1 dB in mindering gebracht voor wegen waarvoor de representatief te
      achten snelheid van lichte motorvoertuigen 70 kilometer per uur of meer bedraagt en het wegdek bestaat uit een
      elementenverharding of een van de volgende wegdektypen:
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel3.5
  - number: 3.5.2.a
    text: Zeer Open Asfalt Beton;
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel3.5
  - number: 3.5.2.b
    text: tweelaags Zeer Open Asfalt Beton, met uitzondering van tweelaags Zeer Open Asfalt Beton fijn;
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel3.5
  - number: 3.5.2.c
    text: uitgeborsteld beton;
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel3.5
  - number: 3.5.2.d
    text: geoptimaliseerd uitgeborsteld beton;
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel3.5
  - number: 3.5.2.e
    text: oppervlakbewerking.
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel3.5
  - number: '3.6'
    text: |-
      In afwijking van [artikel 1.3][ref1] wordt voor de berekening van het akoestisch effect van een wijziging op of aan
      een weg:


      [ref1]: https://wetten.overheid.nl/BWBR0031722#Artikel1
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0031722
        artikel: '1'
        hoofdstuk: '1'
  - number: 3.6.a
    text: |-
      indien een hogere waarde voor de ten hoogste toelaatbare geluidsbelasting is vastgesteld in dB, gerekend met het
      afgeronde getal van de hogere waarde, zoals deze is vastgesteld;
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel3.6
  - number: 3.6.b
    text: |-
      indien een hogere waarde voor de ten hoogste toelaatbare geluidsbelasting is vastgesteld in dB(A), gerekend met de
      op grond van [artikel 3.7][ref1] bepaalde onafgeronde waarde in dB;


      [ref1]: https://wetten.overheid.nl/BWBR0031722#Artikel3
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0031722
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.6.c
    text: |-
      voor de heersende waarde van de geluidsbelasting gerekend met het onafgeronde getal, waarbij uitvoering is gegeven
      aan de [artikelen 3.4][ref1] en [3.5][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0031722#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0031722#Artikel3
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0031722
        artikel: '3'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0031722
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.6.d
    text: |-
      voor de geluidsbelasting in het toekomstige maatgevende jaar gerekend met het onafgeronde getal, waarbij uitvoering
      is gegeven aan de [artikelen 3.4][ref1] en [3.5][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0031722#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0031722#Artikel3
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0031722
        artikel: '3'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0031722
        artikel: '3'
        hoofdstuk: '3'
  - number: '3.7'
    text: |-
      Indien een ten hoogste toelaatbare geluidsbelasting vanwege een weg in dB(A) is vastgesteld, wordt die waarde
      omgerekend tot de waarde van de geluidsbelasting in dB door de getalswaarde van de vastgestelde waarde te
      verminderen met het onafgeronde verschil tussen de onafgeronde heersende geluidsbelasting in dB(A) en de
      onafgeronde heersende geluidsbelasting in dB.
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel3.7
  - number: 3.8.1
    text: |-
      De geluidsbelasting van woningen, andere geluidsgevoelige gebouwen en geluidsgevoelige terreinen, vanwege een weg,
      een weggedeelte of een combinatie van weggedeelten, aangegeven op de geluidplafondkaart, is de geluidsbelasting
      vanwege alle op die kaart aangegeven delen van wegen.
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel3.8
  - number: 3.8.2
    text: |-
      De equivalente geluidsniveaus voor de berekening van de geluidsbelasting, bedoeld in het eerste lid, worden bepaald
      op basis van de in het geluidregister opgenomen brongegevens, waarbij de plafondcorrectiewaarde wordt opgeteld bij
      het emissiegetal (E), berekend volgens formule 1.3 uit paragraaf 1.5 van [bijlage III][ref1] bij deze regeling, dan
      wel bij de emissietermen (LE), berekend volgens formule 2.3 uit paragraaf 2.4 van bijlage III bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0031722
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0031722
  - number: 3.8.3
    text: |-
      Bij de bepaling van de equivalente geluidsniveaus voor de berekening van de geluidsbelasting, bedoeld in het eerste
      lid, worden, in aanvulling op het tweede lid, tevens betrokken alle overige kenmerken van de bron en de omgeving,
      voor zover relevant voor het berekenen van de geluidsbelasting.
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel3.8
  - number: '4.1'
    text: 'Dit hoofdstuk is van toepassing op de bepaling van de equivalente geluidsniveaus en van de geluidsbelasting bij:'
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel4.1
  - number: 4.1.a
    text: |-
      de aanleg en wijziging van spoorwegen die daartoe zijn aangegeven op de kaart, bedoeld in
      [artikel 106 van de Wet geluidhinder][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel106
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '106'
  - number: 4.1.b
    text: |-
      de sanering van bij het Besluit geluidhinder aangegeven woningen, andere geluidsgevoelige gebouwen en
      geluidsgevoelige terreinen vanwege de ondervonden geluidsbelasting van spoorwegen die zijn aangegeven op de kaart,
      bedoeld in onderdeel a;
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel4.1
  - number: 4.1.c
    text: |-
      de projectie van woningen, andere geluidsgevoelige gebouwen en geluidsgevoelige terreinen binnen de zones van
      spoorwegen die zijn aangegeven op de kaart, bedoeld in onderdeel a, of op de geluidplafondkaart.
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel4.1
  - number: 4.2.1
    text: |-
      In dit hoofdstuk wordt verstaan onder: - *emissiegetal:* getal dat de sterkte aangeeft van het geëmitteerde geluid
      ten gevolge van het gezamenlijk spoorvoertuigverkeer op een bepaald spoorweggedeelte, zo nodig gespecificeerd per
      oktaafband en per onderscheiden bronhoogte;
        - *emissietraject:* gedeelte van een spoorweg waarop de geluidemissie constant kan worden verondersteld;
        - *spoorvoertuigcategorie:* verzameling van spoorvoertuigtypen die dezelfde geluidemissiekenmerken hebben;
        - *spoorvoertuigtype:* verzameling spoorvoertuigen die technisch en uiterlijk dezelfde kenmerken hebben.
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel4.2
  - number: 4.2.2
    text: |-
      Elk spoorvoertuig dat van een bepaald traject van de spoorweg gebruik maakt, wordt voor de toepassing van deze
      regeling toegedeeld aan een spoorvoertuigtype en een spoorvoertuigcategorie als bedoeld in hoofdstuk 1 van
      [bijlage IV][ref1] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0031722
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0031722
  - number: '4.3'
    text: |-
      De beheerder van een spoorweg als bedoeld in [artikel 4.1, onder a][ref1], draagt zorg voor de samenstelling en
      het beheer van een emissieregister, waarin de gegevens, genoemd in hoofdstuk 7 van [bijlage IV][ref2] bij deze
      regeling, worden vastgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0031722#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0031722
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0031722
        artikel: '4'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0031722
  - number: 4.4.1
    text: |-
      De berekening van het emissiegetal van een bepaald emissietraject wordt uitgevoerd volgens de in hoofdstuk 2 en 3
      van [bijlage IV][ref1] bij deze regeling beschreven methode.


      [ref1]: https://wetten.overheid.nl/BWBR0031722
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0031722
  - number: 4.4.2
    text: |-
      In gevallen waarin de in het eerste lid genoemde methode leidt tot een voor de betreffende situatie onvoldoende
      representatief emissiegetal, wordt het emissiegetal bepaald volgens de in hoofdstuk 6 van [bijlage IV][ref1] bij
      deze regeling beschreven methode.


      [ref1]: https://wetten.overheid.nl/BWBR0031722
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0031722
  - number: 4.5.1
    text: |-
      Bij de bepaling van het equivalent geluidsniveau vanwege een spoorweg, als bedoeld in
      [artikel 4.1, onderdeel a][ref1], wordt rekening gehouden met de emissiegegevens zoals vastgelegd in het
      emissieregister, bedoeld in [artikel 4.3][ref2], of, indien het een berekening betreft voor het toekomstig
      maatgevende jaar, met de emissiegetallen van de relevante emissietrajecten bepaald overeenkomstig
      [artikel 4.4][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0031722#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0031722#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0031722#Artikel4
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0031722
        artikel: '4'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0031722
        artikel: '4'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0031722
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.5.2
    text: |-
      De Minister kan, na overleg met de instanties die op de desbetreffende locatie de spoorweginfrastructuur en het
      gebruik daarvan beheren, afwijking toestaan van het eerste lid, indien de daar bedoelde gegevens onvoldoende
      representatief zijn.
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel4.5
  - number: 4.6.1
    text: |-
      Het equivalent geluidsniveau wordt berekend volgens de in hoofdstuk 5 van [bijlage IV][ref1] bij deze regeling
      beschreven Standaardrekenmethode 2.


      [ref1]: https://wetten.overheid.nl/BWBR0031722
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0031722
  - number: 4.6.2
    text: |-
      In afwijking van het eerste lid kan het equivalent geluidsniveau worden bepaald volgens de in hoofdstuk 4 van
      [bijlage IV][ref1] bij deze regeling beschreven Standaardrekenmethode 1, indien de desbetreffende situatie valt
      binnen het toepassingsgebied van Standaardrekenmethode 1.


      [ref1]: https://wetten.overheid.nl/BWBR0031722
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0031722
  - number: 4.6.3
    text: |-
      In afwijking van het eerste en tweede lid kan het equivalent geluidsniveau tevens worden bepaald volgens de
      Standaardmeetmethode, bedoeld in hoofdstuk 6 van [bijlage IV][ref1] bij deze regeling, indien de desbetreffende
      situatie valt binnen het toepassingsgebied van die Standaardmeetmethode.


      [ref1]: https://wetten.overheid.nl/BWBR0031722
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0031722
  - number: 4.7.1
    text: |-
      Een gemiddelde emissie als bedoeld in [artikel 1.1, tweede lid, onderdeel a, van het Besluit geluidhinder][ref1]
      wordt berekend volgens: E = 10 log ∑10Ei/10 waarin gemiddeld wordt over de emissies Ei (voor i = 1 tot n), ∑ de som
      is over i = 1 tot i = n en E de gemiddelde emissie is.


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel1
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0020445
        artikel: '1'
  - number: 4.7.2
    text: |-
      In afwijking van [artikel 1.3, tweede lid][ref1], wordt het in
      [artikel 1.1, tweede lid, onderdeel a, van het Besluit geluidhinder][ref2] bedoelde verschil afgerond op één
      decimaal.


      [ref1]: https://wetten.overheid.nl/BWBR0031722#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020445#Artikel1
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0031722
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0020445
        artikel: '1'
  - number: '4.8'
    text: |-
      Indien een ten hoogste toelaatbare geluidsbelasting vanwege een spoorweg in dB(A) is vastgesteld, wordt die waarde
      omgerekend tot de waarde voor de geluidsbelasting in dB door de getalswaarde te verminderen met 2.
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel4.8
  - number: 4.9.1
    text: |-
      De geluidsbelasting van woningen, andere geluidsgevoelige gebouwen en geluidsgevoelige terreinen, vanwege een
      spoorweg, een gedeelte van een spoorweg of een combinatie van spoorwegen, aangegeven op de geluidplafondkaart, is
      de geluidsbelasting vanwege alle op die kaart aangegeven delen van spoorwegen.
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel4.9
  - number: 4.9.2
    text: |-
      De equivalente geluidsniveaus voor de berekening van de geluidsbelasting, bedoeld in het eerste lid, worden bepaald
      op basis van de in het geluidregister opgenomen brongegevens, waarbij de plafondcorrectiewaarde wordt opgeteld bij
      het emissiegetal (E), berekend volgens formule 2.1 uit paragraaf 2.1.1 van [bijlage IV][ref1] bij deze regeling,
      dan wel bij de emissiegetallen (LE), berekend volgens de formules 3.1a tot en met 3.1e uit paragraaf 3.4 van
      bijlage IV bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0031722
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel4.9
    references:
      - id: ref1
        bwb_id: BWBR0031722
  - number: 4.9.3
    text: |-
      Bij de bepaling van de equivalente geluidsniveaus voor de berekening van de geluidsbelasting, bedoeld in het eerste
      lid, worden, in aanvulling op het tweede lid, tevens betrokken alle overige kenmerken van de bron en de omgeving,
      voor zover relevant voor het berekenen van de geluidsbelasting.
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel4.9
  - number: '5.1'
    text: |-
      Dit hoofdstuk is van toepassing op de bepaling van de geluidproductie van, de equivalente geluidsniveaus en de
      geluidsbelasting vanwege wegen en spoorwegen die zijn aangegeven op de geluidplafondkaart, ten behoeve van de
      vaststelling, wijziging en naleving van geluidproductieplafonds en het opstellen van saneringsplannen.
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel5.1
  - number: '5.2'
    text: |-
      In dit hoofdstuk wordt verstaan onder: - *afschermend object:* ter verbetering van de kwaliteit van het milieu
      direct langs een weg of spoorweg geplaatste wallen en schermen;
        - *bronregisterlijn:* lijn die betrekking heeft op een gedeelte van een weg of spoorweg en die gebruikt wordt als
      rijlijn in de zin van [bijlage III][ref1] bij deze regeling of bronlijn in de zin van [bijlage IV][ref2] bij deze
      regeling bij bepaling van het equivalent geluidsniveau ten behoeve van de geluidproductie volgens de in bijlage V
      bij deze regeling gegeven regels;
        - *equivalent geluidsniveau:* gemiddelde geluidsniveau over lange termijn ten behoeve van de berekening van L, L en
      L als bedoeld in bijlage I van [richtlijn nr. 2002/49/EG](32002L0049) van het Europees Parlement en de Raad van de
      Europese Unie van 25 juni 2002 inzake de evaluatie en de beheersing van omgevingslawaai (PbEG L 189);
        - *referentiepunt:* referentiepunt als bedoeld in [artikel 11.19 van de Wet milieubeheer][ref3];
        - *saneringsplan:* saneringsplan als bedoeld in [artikel 11.56 van de Wet milieubeheer][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0031722
      [ref2]: https://wetten.overheid.nl/BWBR0031722
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0031722
      - id: ref2
        bwb_id: BWBR0031722
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '11'
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '11'
  - number: 5.3.1
    text: |-
      De equivalente geluidsniveaus ten behoeve van de berekening van de geluidproductie worden berekend volgens
      Standaardrekenmethode 2, bedoeld in hoofdstuk 2 van [bijlage III][ref1] bij deze regeling en in hoofdstuk 5 van
      [bijlage IV][ref2] bij deze regeling, waarbij geldt dat, indien en voor zover van toepassing, tevens hoofdstuk 1
      van [bijlage V][ref3] bij deze regeling wordt toegepast en waarbij:


      [ref1]: https://wetten.overheid.nl/BWBR0031722
      [ref2]: https://wetten.overheid.nl/BWBR0031722
      [ref3]: https://wetten.overheid.nl/BWBR0031722
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0031722
      - id: ref2
        bwb_id: BWBR0031722
      - id: ref3
        bwb_id: BWBR0031722
  - number: 5.3.1.a
    text: |-
      als het een weg betreft: alle op de geluidplafondkaart aangegeven delen van wegen in de berekening worden
      meegenomen;
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel5.3
  - number: 5.3.1.b
    text: |-
      als het een spoorweg betreft: alle op de geluidplafondkaart aangegeven delen van spoorwegen in de berekening worden
      meegenomen.
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel5.3
  - number: 5.3.2
    text: |-
      Onverminderd het eerste lid is op de berekening van de equivalente geluidsniveaus ten behoeve van de berekening van
      de geluidproductie, bedoeld in [artikel 11.45, eerste en tweede lid, van de Wet milieubeheer][ref1], indien en voor
      zover van toepassing, tevens hoofdstuk 2 van [bijlage V][ref2] bij deze regeling van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0031722
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0031722
  - number: 5.3.3
    text: |-
      Onverminderd het eerste lid is op de berekening van de equivalente geluidsniveaus ten behoeve van de berekening van
      de geluidproductie, bedoeld in [artikel 11.22, vierde lid, van de Wet milieubeheer][ref1], indien en voor zover van
      toepassing, tevens hoofdstuk 3 van [bijlage V][ref2] bij deze regeling van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0031722
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0031722
  - number: 5.3.4
    text: |-
      Bij de berekening van de equivalente geluidsniveaus ten behoeve van de berekening van de geluidproductie voor de
      vaststelling of wijziging van geluidproductieplafonds, wordt de plafondcorrectiewaarde opgeteld bij:
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel5.3
  - number: 5.3.4.a
    text: |-
      als het een weg betreft: het emissiegetal (E), berekend volgens formule 1.3 uit paragraaf 1.5 van
      [bijlage III][ref1] bij deze regeling, dan wel de emissietermen (LE), bepaald volgens formule 2.3 uit paragraaf 2.4
      van bijlage III bij deze regeling;


      [ref1]: https://wetten.overheid.nl/BWBR0031722
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0031722
  - number: 5.3.4.b
    text: |-
      als het een spoorweg betreft: het emissiegetal (E), berekend volgens formule 2.1 uit paragraaf 2.1.1 van
      [bijlage IV][ref1] bij deze regeling, dan wel de emissiegetallen (LE), bepaald volgens de formules 3.1a tot en met
      3.1e uit paragraaf 3.4 van bijlage IV bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0031722
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0031722
  - number: 5.3.5
    text: De waarde van de geluidproductie wordt afgerond op één decimaal.
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel5.3
  - number: 5.3.6
    text: De geluidproductie heeft betrekking op een kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel5.3
  - number: '5.4'
    text: |-
      De geluidsbelasting van een geluidsgevoelig object vanwege de betrokken weg of spoorweg is de geluidsbelasting van
      de hoogst belaste gevel van dat object, de hoogste geluidsbelasting op 1,5 meter boven lokaal maaiveld op de grens
      van een standplaats als bedoeld in [artikel 1, onderdeel j, van de Wet op de huurtoeslag][ref1] dan wel de hoogste
      geluidsbelasting op de grens van een ligplaats in het water, bestemd om door een woonschip te worden ingenomen, op
      een hoogte van 1 meter boven lokaal maaiveld direct grenzend aan de ligplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel1
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel5.4
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '1'
  - number: '5.5'
    text: |-
      Bij een verzoek tot wijziging van een geluidproductieplafond op grond van
      [artikel 11.63 van de Wet milieubeheer][ref1] wordt de hoogte van het geluidproductieplafond berekend op basis van:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel5.5
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
  - number: 5.5.a
    text: |-
      de brongegevens behorende bij het geldende geluidproductieplafond of, voor zover van toepassing, de gewijzigde
      brongegevens, bedoeld in paragraaf 1.4 van [bijlage VI][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0031722
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel5.5
    references:
      - id: ref1
        bwb_id: BWBR0031722
  - number: 5.5.b
    text: de in het saneringsplan opgenomen saneringsmaatregelen.
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel5.5
  - number: 5.6.1
    text: |-
      De equivalente geluidsniveaus ten behoeve van de berekening van de
      geluidproductie voor de vaststelling van een geluidproductieplafond als bedoeld in
      [artikel XI, derde en vierde lid, van de Invoeringswet geluidproductieplafonds][ref1] worden bepaald met
      overeenkomstige toepassing van [artikel 5.3][ref2], waarbij de brongegevens worden afgeleid uit het betreffende
      besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0031679#ArtikelXI
      [ref2]: https://wetten.overheid.nl/BWBR0031722#Artikel5
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel5.6
    references:
      - id: ref1
        bwb_id: BWBR0031679
        artikel: XI
      - id: ref2
        bwb_id: BWBR0031722
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.6.2
    text: |-
      De equivalente geluidsniveaus ten behoeve van de berekening van de geluidproductie voor de verlaging van een
      geluidproductieplafond als bedoeld in [artikel XI, vijfde lid, van de Invoeringswet geluidproductieplafonds][ref1]
      worden bepaald met overeenkomstige toepassing van [artikel 5.5][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0031679#ArtikelXI
      [ref2]: https://wetten.overheid.nl/BWBR0031722#Artikel5
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel5.6
    references:
      - id: ref1
        bwb_id: BWBR0031679
        artikel: XI
      - id: ref2
        bwb_id: BWBR0031722
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.7.1
    text: |-
      De geluidsbelasting van geluidsgevoelige objecten vanwege een weg, een weggedeelte of een combinatie van
      weggedeelten is de geluidsbelasting vanwege alle op de geluidplafondkaart aangegeven delen van wegen.
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel5.7
  - number: 5.7.2
    text: |-
      De equivalente geluidsniveaus ten behoeve van de berekening van de geluidsbelasting, bedoeld in het eerste lid,
      worden bepaald:
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel5.7
  - number: 5.7.2.a
    text: |-
      met overeenkomstige toepassing van [artikel 3.2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0031722#Artikel3
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel5.7
    references:
      - id: ref1
        bwb_id: BWBR0031722
        artikel: '3'
        hoofdstuk: '3'
  - number: 5.7.2.b
    text: |-
      op basis van de in het geluidregister opgenomen brongegevens, waarbij de plafondcorrectiewaarde wordt opgeteld bij
      het emissiegetal (E), berekend volgens formule 1.3 uit paragraaf 1.5 van [bijlage III][ref1] bij deze regeling, dan
      wel bij de emissietermen (LE), bepaald volgens formule 2.3 uit paragraaf 2.4 van bijlage III bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0031722
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel5.7
    references:
      - id: ref1
        bwb_id: BWBR0031722
  - number: 5.7.3
    text: |-
      Indien het tweede lid wordt toegepast in het kader van [artikel 11.30, eerste en tweede lid][ref1], [11.42][ref2]
      of [11.63 van de Wet milieubeheer][ref3], worden daarbij tevens de brongegevens betrokken behorende bij een verzoek
      tot vaststelling of wijziging van geluidproductieplafonds of behorende bij een voorgenomen ambtshalve besluit tot
      vaststelling of wijziging van geluidproductieplafonds.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel5.7
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '11'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '11'
  - number: 5.7.4
    text: |-
      Indien het tweede lid wordt toegepast ten behoeve van het opstellen van saneringsplannen, is daarbij tevens
      [bijlage VI][ref1] bij deze regeling van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0031722
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel5.7
    references:
      - id: ref1
        bwb_id: BWBR0031722
  - number: 5.7.5
    text: |-
      Bij de bepaling van de equivalente geluidsniveaus voor de berekening van de geluidsbelasting, bedoeld in het eerste
      lid, worden, in aanvulling op het tweede lid, tevens betrokken alle overige kenmerken van de bron en de omgeving,
      voor zover relevant voor het berekenen van de geluidsbelasting.
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel5.7
  - number: 5.8.1
    text: |-
      De geluidsbelasting van geluidsgevoelige objecten vanwege een spoorweg, een gedeelte van een spoorweg of een
      combinatie van spoorwegen, is de geluidsbelasting vanwege alle op de geluidplafondkaart aangegeven delen van
      spoorwegen.
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel5.8
  - number: 5.8.2
    text: |-
      De equivalente geluidsniveaus ten behoeve van de berekening van de geluidsbelasting, bedoeld in het eerste lid,
      worden bepaald:
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel5.8
  - number: 5.8.2.a
    text: |-
      met overeenkomstige toepassing van [artikel 4.6][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0031722#Artikel4
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel5.8
    references:
      - id: ref1
        bwb_id: BWBR0031722
        artikel: '4'
        hoofdstuk: '4'
  - number: 5.8.2.b
    text: |-
      op basis van de in het geluidregister opgenomen brongegevens, waarbij de plafondcorrectiewaarde wordt opgeteld
      bij het emissiegetal (E), berekend volgens formule 2.1 uit paragraaf 2.1.1 van [bijlage IV][ref1], dan wel bij de
      emissiegetallen (LE), berekend volgens de formules 3.1a tot en met 3.1e uit paragraaf 3.4 van bijlage IV bij deze
      regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0031722
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel5.8
    references:
      - id: ref1
        bwb_id: BWBR0031722
  - number: 5.8.3
    text: |-
      Indien het tweede lid wordt toegepast in het kader van [artikel 11.30, eerste en tweede lid][ref1], [11.42][ref2]
      of [11.63 van de Wet milieubeheer][ref3], worden daarbij tevens de brongegevens betrokken behorende bij een verzoek
      tot vaststelling of wijziging van geluidproductieplafonds of behorende bij een voorgenomen ambtshalve besluit tot
      vaststelling of wijziging van geluidproductieplafonds.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel5.8
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '11'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '11'
  - number: 5.8.4
    text: |-
      Indien het tweede lid wordt toegepast ten behoeve van het opstellen van saneringsplannen, is daarbij tevens
      [bijlage VI][ref1] bij deze regeling van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0031722
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel5.8
    references:
      - id: ref1
        bwb_id: BWBR0031722
  - number: 5.8.5
    text: |-
      Bij de bepaling van de equivalente geluidsniveaus voor de berekening van de geluidsbelasting, bedoeld in het eerste
      lid, worden, in aanvulling op het tweede lid, tevens betrokken alle overige kenmerken van de bron en de omgeving,
      voor zover relevant voor het berekenen van de geluidsbelasting.
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel5.8
  - number: 5.9.1
    text: |-
      De [artikelen 5.7, met uitzondering van het eerste lid][ref1], en [5.8, met uitzondering van het eerste lid][ref2],
      zijn van overeenkomstige toepassing bij het bepalen van de hoogst belaste gevel, dan
      wel de positie van de hoogste belasting op de grens van de standplaats als bedoeld in
      [artikel 1, onderdeel j, van de Wet op de huurtoeslag][ref3] of ligplaats in het water, bestemd om door een
      woonschip te worden ingenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0031722#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0031722#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0008659#Artikel1
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel5.9
    references:
      - id: ref1
        bwb_id: BWBR0031722
        artikel: '5'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0031722
        artikel: '5'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0008659
        artikel: '1'
  - number: 5.9.2
    text: |-
      Indien bij de procedures ten behoeve van de bouw van een object gebruik is gemaakt van
      [artikel 1b, vijfde lid, van de Wet geluidhinder][ref1], zoals dat luidde voor inwerkingtreding van de
      [Invoeringswet geluidproductieplafonds][ref2], dan wel van artikel 1b, vierde lid, van de Wet geluidhinder, wordt
      bij toepassing van het eerste lid voor dat object alleen rekening gehouden met de gevels van het object die bij
      deze procedures als gevels in de zin van de [Wet geluidhinder][ref3] zijn behandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel1b
      [ref2]: https://wetten.overheid.nl/BWBR0031679
      [ref3]: https://wetten.overheid.nl/BWBR0003227
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel5.9
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 1b
      - id: ref2
        bwb_id: BWBR0031679
      - id: ref3
        bwb_id: BWBR0003227
  - number: 5.9.3
    text: |-
      Bij toepassing van het eerste lid wordt geen rekening gehouden met een bouwkundige constructie als bedoeld in
      [artikel 1b, vierde lid, van de Wet geluidhinder][ref1] die is vastgelegd in de gebruiksregels of bouwregels van
      een bestemmingsplan.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel1b
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel5.9
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 1b
  - number: 5.10.1
    text: |-
      Het akoestisch onderzoek, bedoeld in [artikel 11.33 van de Wet milieubeheer][ref1], heeft betrekking op ten minste
      de volgende referentiepunten:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel5.10
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
  - number: 5.10.1.a
    text: |-
      de referentiepunten die in het register worden opgenomen of waarvan de positie wijzigt door een aan te leggen of te
      wijzigen weg of spoorweg;
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel5.10
  - number: 5.10.1.b
    text: |-
      de referentiepunten waarop de geluidproductie, berekend op basis van de brongegevens behorende bij de
      geluidproductieplafonds zoals die zouden gelden na vaststelling of wijziging van het geluidproductieplafond
      exclusief het effect van de geluidbeperkende maatregelen die geen onderdeel zijn van de geldende brongegevens,
      hoger is dan de geldende geluidproductieplafonds in de betreffende referentiepunten, en
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel5.10
  - number: 5.10.1.c
    text: |-
      de referentiepunten waarop de geluidproductie, berekend op basis van de brongegevens behorende bij de
      geluidproductieplafonds zoals die zouden gelden na vaststelling of wijziging van het geluidproductieplafond
      afwijken van de geldende geluidproductieplafonds in de betreffende referentiepunten, voor zover deze niet vallen
      onder onderdeel b.
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel5.10
  - number: 5.10.2
    text: |-
      Het akoestisch onderzoek voor vaststelling of wijziging van een geluidproductieplafond heeft betrekking op alle
      geluidsgevoelige objecten die liggen binnen het gebied:
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel5.10
  - number: 5.10.2.a
    text: waarin het betreffende referentiepunt ligt, en
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel5.10
  - number: 5.10.2.b
    text: |-
      dat begrensd wordt door de landsgrenzen, de as van de weg of spoorweg en twee lijnen loodrecht op de as van de
      weg of spoorweg en op de halve afstand tot de in de lengterichting van de weg of spoorweg gezien naastliggende
      referentiepunten.
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel5.10
  - number: 5.10.3
    text: |-
      In afwijking van het tweede lid, onderdeel b, is er in het geval de weg of spoorweg van de betreffende beheerder
      eindigt slechts een naastliggend referentiepunt en strekt het akoestisch onderzoek zich aan de andere zijde uit tot
      alle geluidsgevoelige objecten.
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel5.10
  - number: 5.10.4
    text: |-
      In afwijking van het tweede en derde lid heeft het akoestisch onderzoek geen betrekking op geluidsgevoelige
      objecten die naar redelijke verwachting bij volledige benutting van het geluidproductieplafond zoals dat zou
      gelden na vaststelling of wijziging van het geluidproductieplafond, in de situatie dat er geen geluidbeperkende
      maatregelen zouden zijn getroffen, een geluidsbelasting ondervinden die lager is dan de voorkeurswaarde.
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel5.10
  - number: 5.10.5
    text: Het tweede lid is niet van toepassing op de referentiepunten genoemd in het eerste lid, onderdeel c.
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel5.10
  - number: 5.11.1
    text: |-
      Bij berekening van de geluidproductie en van de geluidsbelasting vanwege een weg wordt voor wegen waarvoor de
      representatief te achten snelheid van lichte motorvoertuigen 70 kilometer per uur of meer bedraagt, 2 dB in
      mindering gebracht op de wegdekcorrectie bepaald overeenkomstig [bijlage III][ref1] bij deze regeling of als het
      wegdek bestaat uit dicht asfaltbeton, in afwijking van het gestelde in paragraaf 1.5 en 2.4.2 van bijlage III een
      wegdekcorrectie van 2 dB in rekening gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0031722
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel5.11
    references:
      - id: ref1
        bwb_id: BWBR0031722
  - number: 5.11.2
    text: |-
      In afwijking van het eerste lid wordt 1 dB in mindering gebracht voor wegen waarvoor de representatief te
      achten snelheid van lichte motorvoertuigen 70 kilometer per uur of meer bedraagt en het wegdek bestaat uit een
      elementenverharding of een van de volgende wegdektypen:
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel5.11
  - number: 5.11.2.a
    text: Zeer Open Asfalt Beton;
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel5.11
  - number: 5.11.2.b
    text: tweelaags Zeer Open Asfalt Beton, met uitzondering van tweelaags Zeer Open Asfalt Beton fijn;
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel5.11
  - number: 5.11.2.c
    text: uitgeborsteld beton;
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel5.11
  - number: 5.11.2.d
    text: geoptimaliseerd uitgeborsteld beton;
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel5.11
  - number: 5.11.2.e
    text: oppervlakbewerking.
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel5.11
  - number: '6.1'
    text: |-
      In afwijking van [artikel 1.1][ref1] wordt in dit hoofdstuk verstaan onder gevel: uitwendige scheidingsconstructie
      als bedoeld in [artikel 1.1 van het Bouwbesluit 2012][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0031722#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0030461#Artikel1
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0031722
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0030461
        artikel: '1'
  - number: 6.2.1
    text: |-
      Het equivalent geluidsniveau binnen een gebouw ten behoeve van de vaststelling van de geluidsbelasting
      ter plaatse wordt bepaald door het equivalent geluidsniveau buiten het gebouw, bepaald overeenkomstig de
      [hoofdstukken 2][ref1], [3][ref2], [4][ref3] of [5][ref4], te verminderen met de geluidwering van de gevel.


      [ref1]: https://wetten.overheid.nl/BWBR0031722#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0031722#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0031722#Hoofdstuk4
      [ref4]: https://wetten.overheid.nl/BWBR0031722#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0031722
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0031722
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0031722
        hoofdstuk: '4'
      - id: ref4
        bwb_id: BWBR0031722
        hoofdstuk: '5'
  - number: 6.2.2
    text: De geluidwering van een gevel kan worden bepaald door middel van meting of berekening.
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel6.2
  - number: 6.3.1
    text: |-
      De meting van de geluidwering van een gevel wordt uitgevoerd volgens de in hoofdstuk 4 van NEN 5077:2006 beschreven
      meetmethode.
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel6.3
  - number: 6.3.2
    text: |-
      De berekening van de geluidwering van een gevel wordt uitgevoerd volgens de in NEN-EN 12354-3 beschreven
      rekenmethode, inclusief de informatieve annexen uit die norm, toegepast op de wijze, beschreven in NPR 5272:2003.
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel6.3
  - number: 6.3.3
    text: |-
      Bij de berekening van de geluidwering van de gevel wordt uitgegaan van de situatie zoals die voor een bepaling door
      metingen van de geluidwering volgens NEN 5077:2006 van toepassing zou zijn.
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel6.3
  - number: 6.4.1
    text: 'Bij de bepaling van de geluidwering van de gevel wordt rekening gehouden met:'
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel6.4
  - number: 6.4.1.a
    text: het geluidspectrum, behorend bij het equivalent geluidsniveau buiten het gebouw;
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel6.4
  - number: 6.4.1.b
    text: de structuur van de gevel;
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel6.4
  - number: 6.4.1.c
    text: |-
      de verschillen in het equivalent geluidsniveau buiten het gebouw door de positie van de geluidsbron, de
      bijbehorende afscherming door gevelvlakken en bijbehorende reflecties via gevelvlakken;
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel6.4
  - number: 6.4.1.d
    text: |-
      de geluidwerende kwaliteit en de afmetingen van de elementen waaruit de gevel is opgebouwd, waarbij in ieder geval
      onderscheid wordt gemaakt in: materialen, kieren, naden en voorzieningen voor luchtverversing;
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel6.4
  - number: 6.4.1.e
    text: de geluidabsorptie van het betreffend vertrek.
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel6.4
  - number: 6.4.2
    text: |-
      De geluidwering van een gevel waarbij ventilatie kan plaatsvinden anders dan door het openen van ramen, wordt
      bepaald met gesloten en afgedichte ventilatieopeningen.
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel6.4
  - number: 6.4.3
    text: |-
      Bij toepassing van het tweede lid wordt gerekend met een opening in de gevel waarvan de akoestische prestatie
      bedraagt: een element-genormeerd niveauverschil van D = 40 – 10 lg q.dB in elke beschouwde octaafband,
      waarbij de luchthoeveelheid q in dm3/s de helft bedraagt van de op grond van de [artikelen 3.28][ref1] en
      [3.29 van het Bouwbesluit 2012][ref2] voor nieuwe woongebouwen geëiste hoeveelheid.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0030461#Artikel3
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel6.4
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0030461
        artikel: '3'
  - number: 6.4.4
    text: |-
      In afwijking van het tweede lid wordt de geluidwering van een gevel waarin ventilatievoorzieningen zijn aangebracht
      met een hogere akoestische prestatie dan genoemd in het derde lid, bepaald met geopende dan wel geopend geachte
      ventilatievoorzieningen.
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel6.4
  - number: 6.5.1
    text: |-
      Bij de bepaling van de geluidwering van de gevel wordt uitgegaan van het geluidspectrum behorend bij het equivalent
      geluidsniveau buiten het gebouw, waarbij voor wegverkeer en spoorwegverkeer wordt uitgegaan van de geluidspectra
      die worden gegeven met de herleidingswaarden K in tabel 6.5, tenzij anders wordt vermeld en gemotiveerd.
