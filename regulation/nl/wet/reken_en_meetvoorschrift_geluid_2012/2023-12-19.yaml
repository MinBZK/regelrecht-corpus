  - number: 1.3.1
    text: |-
      De door berekening of meting bepaalde waarde van de geluidsbelasting wordt afgerond naar het dichtstbijzijnde
      gehele getal, waarbij een halve eenheid wordt afgerond naar het even getal.
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel1.3
  - number: 1.3.2
    text: |-
      In afwijking van het eerste lid wordt bij toepassing van de [hoofdstukken V][ref1], [VI][ref2] en
      [VII van de Wet geluidhinder][ref3], bij de vaststelling van een verschil tussen twee geluidsbelastingen, de
      afronding slechts toegepast op het resultaat van de berekening van het verschil.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#HoofdstukV
      [ref2]: https://wetten.overheid.nl/BWBR0003227#HoofdstukVI
      [ref3]: https://wetten.overheid.nl/BWBR0003227#HoofdstukVII
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel1.3
    references:
      - id: ref1
        bwb_id: BWBR0003227
        hoofdstuk: V
      - id: ref2
