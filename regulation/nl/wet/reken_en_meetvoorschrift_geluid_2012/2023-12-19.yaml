  - number: '1.2'
    text: |-
      De resultaten van een akoestisch onderzoek worden vastgelegd in een overeenkomstig hoofdstuk 1 van
      [bijlage I][ref1] bij deze regeling ingericht akoestisch rapport.


      [ref1]: https://wetten.overheid.nl/BWBR0031722
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel1.2
