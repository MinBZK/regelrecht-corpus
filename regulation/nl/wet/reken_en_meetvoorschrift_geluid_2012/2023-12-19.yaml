        hoofdstuk: VI
      - id: ref3
        bwb_id: BWBR0003227
        hoofdstuk: VII
  - number: '1.4'
    text: |-
      Het effect van de samenloop van de verschillende geluidsbronnen,
      bedoeld in [artikel 110f, eerste lid, van de Wet geluidhinder][ref1] en
      [artikel 11.33, zevende lid, onderdeel c, van de Wet milieubeheer][ref2], wordt bepaald overeenkomstig de in
      hoofdstuk 2 van [bijlage I][ref3] bij deze regeling beschreven rekenmethode.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel110f
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0031722
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel1.4
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 110f
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '11'
      - id: ref3
        bwb_id: BWBR0031722
  - number: '1.5'
    text: |-
      Indien de geluidsbelasting wordt bepaald ter plaatse van een gevel, wordt slechts rekening gehouden met het
      invallende geluid.
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel1.5
  - number: '1.6'
    text: |-
      Met rekenmethoden en meetmethoden als bedoeld in deze regeling worden gelijkgesteld rekenmethoden en meetmethoden
      die zijn vastgesteld in een andere lidstaat van de Europese Unie dan wel in een staat, niet zijnde een lidstaat van
      de Europese Unie, die partij is bij een daartoe strekkend of mede daartoe strekkend verdrag dat Nederland bindt,
      en een nauwkeurigheid bieden die ten minste gelijkwaardig is aan het niveau dat met de in deze regeling genoemde
      meetmethoden wordt nagestreefd.
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel1.6
  - number: '2.1'
    text: |-
      In dit hoofdstuk wordt verstaan onder: - *geluidsbron:* geluidafstralend toestel, apparaat, gebouw of activiteit,
      dan wel een combinatie hiervan, binnen een inrichting of industrieterrein;
        - *immissiepunt:* plaats waarop het equivalent geluidsniveau wordt bepaald;
        - *immissierelevante bronsterkte:* geluidsvermogensniveau van een denkbeeldige bron, gelegen in het centrum van
      de werkelijke geluidsbron, die in de richting van het immissiepunt dezelfde geluiddrukniveaus veroorzaakt als de
      werkelijke geluidsbron;
        - *representatieve bedrijfssituatie:* toestand waarbij de voor de geluidproductie van de inrichting relevante
      omstandigheden kenmerkend zijn voor een bedrijfsvoering bij volledige capaciteit in het te beschouwen gedeelte van
      het etmaal.
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel2.1
  - number: 2.2.1
    text: |-
      Indien de vaststelling van de geluidsbelasting in dB(A) vanwege een industrieterrein plaatsvindt ten behoeve van
      de vaststelling of wijziging van een geluidszone rond dat terrein, bevindt het immissiepunt zich op een hoogte van
      vijf meter boven het maaiveld.
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel2.2
  - number: 2.2.2
    text: |-
      Indien de vaststelling van de geluidsbelasting in dB(A) vanwege een industrieterrein plaatsvindt ten behoeve van
      de vaststelling van de geluidsbelasting van de gevel van woningen, of andere geluidsgevoelige gebouwen, bevindt het
      immissiepunt zich op het punt van de gevel, waar de hoogste geluidsbelasting optreedt.
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel2.2
  - number: 2.3.1
    text: |-
      De bepaling van het equivalent geluidsniveau vanwege een industrieterrein vindt plaats volgens een van de methoden
      van de Handleiding meten en rekenen industrielawaai 1999, onder de in genoemde handleiding bepaalde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel2.3
  - number: 2.3.2
    text: |-
      Op het overeenkomstig het eerste lid bepaalde equivalent geluidsniveau vanwege een industrieterrein kan het bevoegd
      gezag een aftrek toepassen als bedoeld in [bijlage II][ref1] bij deze regeling, onder de in die bijlage genoemde
      voorwaarden en voor zover het toepassen van de aftrek niet in strijd is met de gewenste optimale akoestische en
      ruimtelijke indeling op en rond het industrieterrein, zoals onder meer kan blijken uit een:


      [ref1]: https://wetten.overheid.nl/BWBR0031722
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0031722
  - number: 2.3.2.a
    text: |-
      zonebeheerplan als bedoeld in [artikel 164 van de Wet geluidhinder][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel164
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '164'
  - number: 2.3.2.b
    text: gemeentelijke nota industrielawaai als bedoeld in de Handreiking industrielawaai en vergunningverlening;
    url: https://wetten.overheid.nl/BWBR0031722/2023-12-19#Artikel2.3
  - number: 2.3.2.c
    text: |-
      gemeentelijk milieubeleidsplan als bedoeld in [artikel 4.16 van de Wet milieubeheer][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel4
