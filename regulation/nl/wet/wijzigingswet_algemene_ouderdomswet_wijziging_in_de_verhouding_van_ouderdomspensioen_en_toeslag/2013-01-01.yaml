preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is in de Algemene Ouderdomswet een andere verhouding
    tussen ouderdomspensioen en toeslag vast te stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006200/2013-01-01#ArtikelAanhef
articles:
  - number: II
    text: |-
      1 De bepalingen van de [Algemene Ouderdomswet][ref1], zoals die wet luidde vóór de datum van
      inwerkingtreding van deze wet, blijven ook op en na die datum van toepassing op de pensioengerechtigde
      die vóór die datum recht heeft op ouderdomspensioen voor een gehuwde pensioengerechtigde van wie de
      echtgenoot jonger is dan 65 jaar, zolang deze echtgenoot de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref2], nog niet heeft bereikt.

      2 Het eerste lid vindt geen toepassing meer indien op een datum op of na de inwerkingtreding van deze wet, het
      huwelijk van de pensioengerechtigde met de in het eerste lid bedoelde echtgenoot geëindigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
