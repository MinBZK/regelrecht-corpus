$id: wijzigingswet_algemene_ouderdomswet_wijziging_in_de_verhouding_van_ouderdomspensioen_en_toeslag
regulatory_layer: WET
publication_date: '2012-08-08'
valid_from: '1994-02-01'
bwb_id: BWBR0006200
url: https://wetten.overheid.nl/BWBR0006200/1994-02-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is in de Algemene Ouderdomswet een andere verhouding
    tussen ouderdomspensioen en toeslag vast te stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006200/1994-02-01#ArtikelAanhef
articles:
  - number: II.1
    text: |-
      De bepalingen van de [Algemene Ouderdomswet][ref1], zoals die wet luidde vóór de datum van inwerkingtreding van
      deze wet, blijven ook op en na die datum van toepassing op de pensioengerechtigde die vóór die datum recht heeft
      op ouderdomspensioen voor een gehuwde pensioengerechtigde van wie de echtgenoot jonger is dan 65 jaar, zolang deze
      echtgenoot de 65-jarige leeftijd nog niet heeft bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0006200/1994-02-01#ArtikelII
    references:
      - id: ref1
        bwb_id: BWBR0002221
  - number: II.2
    text: |-
      Het eerste lid vindt geen toepassing meer indien op een datum op of na de inwerkingtreding van deze wet, het
      huwelijk van de pensioengerechtigde met de in het eerste lid bedoelde echtgenoot geëindigd is.
    url: https://wetten.overheid.nl/BWBR0006200/1994-02-01#ArtikelII
  - number: III
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0006200/1994-02-01#ArtikelIII
