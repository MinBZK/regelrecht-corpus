  - number: 94l
    text: |-
      1 Wanneer uit het onderzoek, bedoeld in [artikel 94e, eerste lid][ref1], blijkt dat de betreffende waarde, genoemd
      in [bijlage 16][ref2], onderdeel 2, bij een koppel vleeskuikens niet wordt behaald, maakt de houder van de dieren
      in overleg met een dierenarts een analyse van de mogelijke oorzaken van het niet behalen van de waarde en een plan
      van aanpak.

      2 Het plan van aanpak wordt uitgevoerd bij de eerstvolgende twee koppels vleeskuikens die op het bedrijf worden
      gevaccineerd.

      3 Wanneer uit het onderzoek, bedoeld in [artikel 94e, eerste lid][ref3], blijkt dat de betreffende waarde, genoemd
      in [bijlage 16][ref4], onderdeel 2, bij het tweede koppel, bedoeld in het tweede lid, niet wordt behaald, herziet
      de houder het plan van aanpak in overleg met de Gezondheidsdienst voor dieren.

      4 Het herziene plan van aanpak wordt uitgevoerd bij ten minste de eerstvolgende zes koppels vleeskuikens die op het
      bedrijf worden gevaccineerd.

      5 Het plan van aanpak bevat in ieder geval:

      a. maatregelen die erop zijn gericht om de betreffende waarde, genoemd in [bijlage 16][ref5], onderdeel 2, bij de
      volgende koppels te behalen;

      b. de naam en handtekening van de houder;

      c. een door de minister toegekend registratienummer als bedoeld in
      [artikel 3 van de Regeling identificatie en registratie van dieren][ref6];

      d. de datum van opstellen van het plan van aanpak.

      6 De houder stuurt een kopie van het plan van aanpak of het herziene plan van aanpak aan de Gezondheidsdienst voor
      dieren.


