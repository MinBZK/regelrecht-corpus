    text: |-
      1 Het is exploitanten van een levensmiddelenbedrijf dat actief is in het stadium van de productie van
      landbouwhuisdieren verboden in strijd te handelen met artikel 18 van [verordening (EG) nr. 178/2002](32002R0178).

      2 Het eerste lid is alleen van toepassing ten aanzien van voedselproducerende dieren.
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel113a
