      1 Een aanvraag om een erkenning als bedoeld in [artikel 21, eerste en vierde lid][ref1], wordt ingediend bij de
      NVWA.

      2 De aanvraag gaat vergezeld van een protocol als bedoeld in [artikel 21, zesde lid][ref2].

      3 Indien een runderverzamelcentrum bestaat uit meer epidemiologische eenheden, wordt op de aanvraag het aantal
      eenheden vermeld.


