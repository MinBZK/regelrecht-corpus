      1 De rechtspersoon, bedoeld in [artikel 59, eerste lid][ref1], voorziet in een doeltreffend systeem van oplegging
      van sancties bij niet-naleving van de eisen, bedoeld in [artikel 63][ref2].

      2 De rechtspersoon, bedoeld in [artikel 59][ref3], voorziet er in elk geval in dat de mogelijkheid bestaat om bij
      niet-naleving de volgende sancties op te leggen:

      a. oplegging van een boete;

      b. schorsing of uitsluiting van deelname het kwaliteitssysteem.

      3 Gedurende de schorsing, bedoeld in het tweede lid, onderdeel b, zijn de afwijkende voorschriften, bedoeld in
      [artikel 33, derde lid][ref4], [44, tweede lid][ref5], [45, vierde lid][ref6], [artikel 46, tweede lid][ref7], en
      [47, tweede lid][ref8], niet van toepassing op de desbetreffende deelnemer.


