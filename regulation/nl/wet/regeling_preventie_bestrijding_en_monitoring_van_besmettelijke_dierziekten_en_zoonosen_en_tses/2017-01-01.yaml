  - number: '57'
    text: |-
      1 De erkenning van een kwaliteitssysteem geschiedt op aanvraag van de in [artikel 59, eerste lid][ref1], bedoelde
      rechtspersoon.

      2 De aanvraag wordt schriftelijk bij de NVWA ingediend.

      3 Op de aanvraag wordt binnen 90 dagen na ontvangst van de aanvraag een besluit genomen.

      4 Bij de aanvraag worden in elk geval de volgende gegevens verstrekt:

      a. de naam en het adres van de rechtspersoon;

      b. de naam en het adres van de in [artikel 60, vierde lid][ref2], bedoelde instanties;

      c. een opgave van de namen en adressen van de deelnemende personen, rechtspersonen en samenwerkingsverbanden;

      d. een overzicht van:

      1. de wijze waarop de controles, bedoeld in [artikel 60, eerste lid][ref3], worden uitgevoerd;

      2. de wijze waarop en welke sancties, bedoeld in [artikel 61, eerste lid][ref4], worden opgelegd;

      3. de wijze waarop de geïnde boetes, bedoeld in [artikel 61, tweede lid, onderdeel a][ref5], zullen worden besteed;

      4. de wijze waarop wordt voldaan aan de eisen, bedoeld in [artikel 63][ref6].


