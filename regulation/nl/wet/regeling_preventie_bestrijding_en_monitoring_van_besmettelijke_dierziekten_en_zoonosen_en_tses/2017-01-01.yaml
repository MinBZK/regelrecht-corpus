        artikel: '18'
        hoofdstuk: '1'
  - number: '32'
    text: |-
      1 De vervoerder van een vervoermiddel waarmee evenhoevigen worden vervoerd, houdt een register bij met daarin de
      volgende gegevens:

      a. een aantekening van de datum en het tijdstip van elke reiniging en ontsmetting die heeft plaatsgevonden
      ingevolge de [artikelen 31][ref1], [34][ref2] of [35][ref3];

      b. voor zover de reiniging en ontsmetting heeft plaatsgevonden op een erkende reinigings- en ontsmettingsplaats
      als bedoeld in [artikel 26][ref4], is de aantekening, bedoeld in onderdeel a, voorzien van het stempel van de
      eigenaar of exploitant van de plaats, alsmede van een de handtekening van de eigenaar of exploitant of zijn
      vertegenwoordiger;

      c. in het geval het vervoer van runderen of varkens betreft, de gegevens, bedoeld in artikel 12, tweede lid, van
      richtlijn nr. 64/432/EEG;

      d. in het geval het vervoer van schapen of geiten betreft de gegevens, bedoeld in artikel 8 quater, tweede lid, van
      richtlijn nr. 91/68/EEG.

      2 Uit het register, bedoeld in het eerste lid, blijkt op welk vervoermiddel het register betrekking heeft.

      3 De vervoerder draagt er zorg voor dat de gegevens met betrekking tot de reiniging en ontsmetting die laatstelijk
      heeft plaatsgevonden op het desbetreffende vervoermiddel aanwezig zijn.

      4 De vervoerder bewaart de gegevens die zijn opgenomen in het register, bedoeld in het eerste lid, gedurende drie
      jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0018397#Artikel35
      [ref4]: https://wetten.overheid.nl/BWBR0018397#Artikel26
