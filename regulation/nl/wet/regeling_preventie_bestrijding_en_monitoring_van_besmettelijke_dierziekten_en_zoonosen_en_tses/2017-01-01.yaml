  - number: '46'
    text: |-
      1 Weiderunderen worden van een ingevolge [artikel 21][ref1] erkend runderverzamelcentrum rechtstreeks afgevoerd
      naar een al dan niet in Nederland gelegen slachthuis.

      2 In afwijking van het eerste lid, mogen weiderunderen van een ingevolge [artikel 21][ref2] erkend
      runderverzamelcentrum, worden afgevoerd naar een in Nederland gelegen vetweiderijbedrijf dat uitsluitend runderen
      rechtstreeks afvoert naar een al dan niet in Nederland gelegen slachthuis indien de betrokken vervoerder, de
      eigenaar of exploitant van het verzamelcentrum en de eigenaar of exploitant van het vetweiderijbedrijf deelnemen
      aan een ingevolge [artikel 56][ref3] erkend kwaliteitssysteem.

      3 Weiderunderen worden van een vetweiderijbedrijf rechtstreeks afgevoerd naar een al dan niet in Nederland gelegen
      slachthuis.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel21
