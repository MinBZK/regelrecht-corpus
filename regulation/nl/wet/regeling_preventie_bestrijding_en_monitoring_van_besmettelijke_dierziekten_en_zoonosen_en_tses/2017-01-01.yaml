  - number: '55'
    text: |-
      1 Onverminderd de [artikelen 53][ref1] en [54][ref2] is het tijdelijk op één plaats bijeenbrengen van pluimvee,
      loopvogels of postduiven afkomstig van verschillende plaatsen toegestaan, indien is voldaan aan het tweede of derde
      lid.

      2 Degene, die voornemens is pluimvee, loopvogels of postduiven afkomstig van verschillende plaatsen tijdelijk op
      één plaats te bijeen te brengen, is gehouden:

      a. van dit voornemen ten minste acht dagen van tevoren kennis te gegeven aan de NVWA;

      b. de dieren, alvorens deze toe te laten, bij de plaats van aanvoer op zijn kosten te laten onderzoeken door één of
      meer dierenartsen.

      3 In afwijking van het tweede lid is degene die voornemens is postduiven voor een wedvlucht bijeen te brengen
      gehouden van dit voornemen jaarlijks een overzicht aan de NVWA te doen toekomen. De minister kan besluiten de
      postduiven, alvorens deze bij de wedvlucht worden toegelaten, bij de plaats van aanvoer te laten onderzoeken door
      één of meer dierenartsen, op kosten van degene die de postduiven voor de wedvlucht heeft bijeengebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel54
