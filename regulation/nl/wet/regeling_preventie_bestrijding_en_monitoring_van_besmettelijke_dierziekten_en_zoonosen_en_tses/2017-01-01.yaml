    text: |-
      Een kwaliteitssysteem kan door de minister worden erkend indien door een rechtspersoon als bedoeld in
      [artikel 59, eerste lid][ref1], wordt aangetoond dat:

      a. het beheer en de inrichting in handen is van een rechtspersoon die voldoet aan de voorschriften, bedoeld in de
      [artikelen 59][ref2] en [62][ref3];

      b. voldaan wordt aan de voorschriften, bedoeld in de [artikelen 60][ref4] en [61][ref5];

      c. voldaan wordt aan de eisen, bedoeld in [artikel 63][ref6].


