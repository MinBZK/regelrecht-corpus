      2 De houder, bedoeld in [artikel 94y, eerste lid][ref2], laat per stal aan het begin van de productieperiode,
      voordat broedeieren worden afgeleverd, bloed afnemen bij 1% van het aantal dieren, maar bij ten minste 30 dieren en
      ten hoogste 60 dieren.


