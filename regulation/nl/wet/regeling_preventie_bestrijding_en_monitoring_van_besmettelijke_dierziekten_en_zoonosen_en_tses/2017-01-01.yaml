  - number: 40l
    text: |-
      1 De minister kan op aanvraag van een varkenshouder toestemming verlenen voor het afvoeren van varkens van zijn
      varkenshouderijbedrijf.

      2 Een aanvraag als bedoeld in het eerste lid wordt ingediend bij een databank die op
      grond van [artikel 38hh van de Regeling identificatie en registratie van dieren][ref1]
      door de minister is aangewezen als databank voor de melding van de gegevens, bedoeld in
      [artikel 32, tweede lid, van de Regeling identificatie en registratie van dieren][ref2].

      3 Indien de minister geen databank heeft aangewezen, dient de houder de aanvraag, bedoeld in het eerste lid, in bij
      de minister met gebruikmaking van een middel dat daartoe door de minister beschikbaar is gesteld.

      4 De toestemming wordt voorafgaand aan het voorgenomen transport aangevraagd en is geldig tot en met zeven dagen na
      het verlenen van de toestemming.

      5 De toestemming wordt door de varkenshouder die de aanvraag heeft gedaan, bewaard tot drie jaren na de datum
      waarop de varkens van het varkenshouderijbedrijf zijn afgevoerd.

      6 In geval van een uitbraak van een in [artikel 2][ref3] van deze regeling aangewezen besmettelijke ziekte kan de
      minister overgaan tot intrekken van de op dat moment reeds uitgegeven toestemmingen.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel38hh
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0018397#Artikel2
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel40l
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 38hh
      - id: ref2
