  - number: '33'
    text: |-
      1 Een vervoermiddel waarmee een of meer evenhoevigen worden vervoerd, wordt na aankomst op de plaats van bestemming
      geheel gelost.

      2 Indien een vervoermiddel bestaat uit twee of meer vervoerseenheden, mogen de vervoerseenheden in afwijking
      van het eerste lid op verschillende plaatsen worden gelost, mits iedere vervoerseenheid in één keer geheel wordt
      gelost.

      3 In afwijking van het eerste en tweede lid, mag een vervoersmiddel, onderscheidenlijk een vervoerseenheid op twee
      verschillende plaatsen worden gelost, indien de vervoerder deelneemt aan een ingevolge [artikel 56][ref1] erkend
      kwaliteitssysteem.

      4 Het tweede lid is niet van toepassing op varkens, voor zover het gaat om het lossen op een
      varkenshouderijbedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel56
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel33
