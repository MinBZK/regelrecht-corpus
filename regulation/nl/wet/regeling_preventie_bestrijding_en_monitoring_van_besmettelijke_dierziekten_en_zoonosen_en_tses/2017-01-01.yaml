  - number: '19'
    text: |-
      De eigenaar of exploitant, dan wel diens vertegenwoordiger, van een plaats of een bedrijf waar evenhoevigen worden
      aangevoerd, verleent alle medewerking aan de reiniging en ontsmetting van het vervoermiddel waarmee de evenhoevigen
      naar zijn plaats of bedrijf zijn vervoerd.
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel19
  - number: '20'
    text: |-
      1 Een plaats of bedrijf waar tien of meer evenhoevigen worden gehouden dient te beschikken over een eenvoudige
      reinigings- en ontsmettingsplaats die voldoet aan de eisen, bedoeld in [bijlage 9][ref1].

      2 Het eerste lid is niet van toepassing op een plaats of bedrijf waar vanaf 1 januari 2010 geen evenhoevigen, niet
      zijnde varkens, zijn aangevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0018397
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0018397
  - number: '21'
    text: |-
      1 Een varkensverzamelcentrum of een runderverzamelcentrum kan door de minister worden erkend indien:

      a. het verzamelcentrum voldoet aan de eisen, genoemd in artikel 11, eerste lid, onderdeel d, van richtlijn nr.
      64/432/EEG;

      b. het verzamelcentrum zodanig is gelegen, ontworpen en geconstrueerd en op zodanige wijze wordt geëxploiteerd dat
      de bioveiligheid groot genoeg is om te voorkomen dat er ernstige besmettelijke dierziekten naar andere bedrijven of
      tussen opeenvolgende partijen dieren die het verzamelcentrum passeren, verspreid worden;

      c. op het verzamelcentrum een of meer reinigings- en ontsmettingsplaatsen die allen voldoen aan de eisen, genoemd
      in [artikel 26][ref1], aanwezig zijn om vervoermiddelen te reinigen en ontsmetten.

      2 Indien een runderverzamelcentrum bestaat uit meer epidemiologische eenheden, voldoen al deze eenheden aan
      [artikel 1, onderdeel u][ref2], en wordt het aantal eenheden vermeld in de erkenning.

      3 Indien het varkensverzamelcentrum subsidie heeft ontvangen op grond van de
      [Subsidieregeling sanering verzamelcentra varkens][ref3] wordt het verzamelcentrum niet erkend.

      4 Een schapen- en geitenverzamelcentrum wordt door de minister erkend indien:

      a. het verzamelcentrum voldoet aan de eisen, genoemd in artikel 8bis, eerste lid, onderdeel d, van richtlijn nr.
      91/68/EEG;

      b. het verzamelcentrum zodanig is gelegen, ontworpen en geconstrueerd en op zodanige wijze wordt geëxploiteerd dat
      de bioveiligheid groot genoeg is om te voorkomen dat er ernstige besmettelijke dierziekten naar andere bedrijven of
      tussen opeenvolgende partijen dieren die het verzamelcentrum passeren, verspreid worden;

      c. op het verzamelcentrum een of meer reinigings- en ontsmettingsplaatsen die allen voldoen aan de eisen, genoemd
      in [artikel 26][ref4], aanwezig zijn om vervoermiddelen te reinigen en ontsmetten.

      5 Bij de verlening van de erkenning, bedoeld in het eerste en vierde lid, kan door de minister rekening gehouden
      worden met de antecedenten van de eigenaar of exploitant van het verzamelcentrum met betrekking de voorschriften,
      genoemd in [artikel 23][ref5] of [24][ref6].

      6 De wijze waarop een verzamelcentrum wordt geëxploiteerd, bedoeld in het eerste lid, onderdeel b, en vierde lid,
      onderdeel b, en de wijze van reiniging en ontsmetting worden vastgelegd in een protocol dat door de minister wordt
      goedgekeurd.


