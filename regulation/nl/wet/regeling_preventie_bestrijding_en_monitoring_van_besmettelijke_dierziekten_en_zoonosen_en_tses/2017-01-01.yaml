  - number: '104'
    text: |-
      1 De kentekenen of waarschuwingsborden worden aan de ingang van de besmette of van besmetting verdachte gebouwen en
      terreinen, aan de bijenwoning of rondom het krachtens [artikel 30 van de wet][ref1] aangewezen gebied aangebracht,
      gehecht of geplaatst en wel zodanig dat zij duidelijk van de openbare weg af zichtbaar zijn.

      2 Waarschuwingsborden kunnen langs de openbare weg vooraangekondigd worden.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel30
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '30'
  - number: '105'
    text: |-
      Het onschadelijk maken, bedoeld in [artikel 22, eerste lid, onderdeel g, van de wet][ref1], en het vernietigen,
      bedoeld in [artikel 22, tweede lid, onderdelen f en g, van de wet][ref2], geschiedt:

      a. overeenkomstig verordening (EG) nr. 1069/2009;

      b. indien verordening (EG) nr. 1069/2009 niet van toepassing is:

      1°. door verbranden, onderploegen, broeien, vermenging met een ontsmettingsmiddel als bedoeld in
      [artikel 108][ref3] of bij mest door verwerken in een mestverwerkingsinrichting, onverminderd de bepalingen van het
      Besluit gebruik dierlijke meststoffen op grond waarvan de mest tijdelijk wordt opgeslagen;

      2°. door droge sterilisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0018397#Artikel108
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0005662
        artikel: '22'
      - id: ref3
        bwb_id: BWBR0018397
        artikel: '108'
        hoofdstuk: '1'
        paragraaf: '3'
  - number: 105a
    text: |-
      Op een tegemoetkoming in de schade voor dieren, producten of voorwerpen die zijn gedood of onschadelijk gemaakt
      als bedoeld in [artikel 86, eerste lid, van de wet][ref1] wordt de eventuele opbrengst van die dieren, producten of
      voorwerpen in mindering gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel86
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel105a
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '86'
  - number: '106'
    text: |-
      1 Aan ontsmetting gaat reiniging vooraf, behoudens die gevallen waarbij, ter beoordeling van de minister, wegens
      besmettingsgevaar voor de personen die met de reiniging zijn belast, voor de reiniging en ontsmetting eerst een
      voorlopige ontsmetting plaatsvindt. De reiniging vindt plaats binnen de door de minister aangegeven termijn.

      2 Het reinigen van dieren, gebouwen, terreinen, bewaarplaatsen van mest, voorwerpen en producten geschiedt
      overeenkomstig [bijlage 23][ref1].

      3 Onverminderd het tweede lid geschiedt reiniging en ontsmetting overeenkomstig de voor de desbetreffende
      dierziekte geldende communautaire bestrijdingsrichtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0018397
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0018397
  - number: '107'
    text: |-
      Het ontsmetten van gebouwen, terreinen, bewaarplaatsen van mest, bijenwoning en dieren, voorwerpen en producten
      is gericht op het effectief en efficiënt onschadelijk maken van smetstof, waarbij elk geval op zichzelf wordt
      beoordeeld en geschiedt op de in de [bijlage 23][ref1] beschreven wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0018397
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0018397
  - number: '108'
    text: |-
      Het ontsmetten geschiedt met een van de volgende middelen:

      a. hitte in de vorm van:

      1. vuur;

      2. hete lucht;

      3. stoom;

      4. kokend water;

      b. ontsmettingsmiddelen die voor dat doel zijn toegelaten op grond van de
      [Wet gewasbeschermingsmiddelen en biociden][ref1];

      c. andere door de minister vast te stellen ontsmettingsmiddelen.


      [ref1]: https://wetten.overheid.nl/BWBR0021670
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0021670
  - number: '109'
    text: |-
      De minister beslist in elk bijzonder geval op welke wijze het onschadelijk maken, het vernietigen en het reinigen
      en ontsmetten geschiedt en welke reinigings- en ontsmettingsmiddelen daarbij worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel109
  - number: '110'
    text: |-
      1 Na afloop van de reiniging vindt controle plaats door de ambtenaar, bedoeld in
      [artikel 114, tweede lid, van de wet][ref1].

      2 Het onschadelijk maken, het vernietigen en de ontsmetting geschieden onder leiding en toezicht van de in eerste
      lid bedoelde persoon.

      3 De reiniging en ontsmetting wordt door de ambtenaar geregistreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel114
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '114'
  - number: 110a
    text: |-
      1 Zodra een gebouw of terrein door het plaatsen van een kenteken, ingevolge
      [artikel 22, eerste lid, van de wet][ref1], besmet of van besmetting verdacht is verklaard met klassieke
      varkenspest, mond- en klauwzeer, aviaire influenza, ziekte van Newcastle, Afrikaanse paardepest, of de in bijlage
      I van richtlijn nr. 92/119/EEG genoemde dierziekten, legt de houder van de zieke of verdachte dieren per voor de
      ziekte vatbare diersoort schriftelijk vast:

      a. het aantal dieren;

      b. het aantal gestorven dieren, en

      c. het aantal dieren dat verschijnselen van een besmettelijke dierziekte vertoont.

      2 De gegevens van de telling dienen, totdat het kenteken is verwijderd, na een mutatie in de gegevens, bedoeld in
      het eerste lid, zo spoedig mogelijk te worden bijgewerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel22
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel110a
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '22'
  - number: 110b
    text: |-
      1 Indien de houder van een dier vermoedt dat het dier door aviaire influenza, de ziekte van Newcastle, Afrikaanse
      paardepest, of de in bijlage I van richtlijn nr. 92/119/EEG genoemde dierziekten is aangetast:

      a. treft hij, tot de minister de nodig geachte maatregelen neemt, dienstige maatregelen als bedoeld in
      [artikel 22, eerste lid, onderdelen a, b en i van de wet][ref1];

      b. draagt hij ervoor zorg dat het dier zijn verblijfplaats niet verlaat;

      2 Op de houder, bedoeld in het eerste lid, zijn de [artikelen 25, eerste lid][ref2], en
      [26, eerste lid, van de wet][ref3] en [artikel 110a][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0005662#Artikel26
