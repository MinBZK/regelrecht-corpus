  - number: 15f
    text: |-
      1 De minister kan de aanwijzing, bedoeld in [artikel 15b][ref1] intrekken, indien deze niet voldoet aan de
      voorwaarden, bedoeld in de artikelen 15b, vijfde en zesde lid, [15c][ref2] of [15e][ref3].

      2 Indien de aanwijzing van een databank wordt ingetrokken of beëindigd:

      a. verstrekt de beheerder van de databank de geregistreerde gegevens aan de minister of geeft de minister de
      opdracht aan de beheerder van een databank de gegevens te vernietigen, en

      b. verleent de beheerder van de databank alle medewerking aan de minister of de beheerder van een andere op grond
      van [artikel 15b, eerste lid][ref4], aangewezen databank ter zake van de overdracht van de werkzaamheden inzake de
      verwerking van de gegevens.


