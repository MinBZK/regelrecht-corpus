  - number: 15c
    text: |-
      Een aanwijzing als bedoeld in [artikel 15b, eerste lid][ref1], vindt plaats, indien:

      a. de beheerder van de databank een onderneming heeft als bedoeld in
      [artikel 5 van de Handelsregisterwet 2007][ref2] of een rechtspersoon is in de zin van artikel 54 van het
      Verdrag betreffende de Werking van de Europese Unie, die in een lidstaat van de Europese Unie of van de Europese
      Economische Ruimte is gevestigd;

      b. de databank schriftelijk of elektronisch voldoende bereikbaar is voor houders;

      c. de beheerder van de databank de geregistreerde gegevens elektronisch en tijdig kan uitwisselen met de minister;

      d. de beheerder van de databank passende technische en organisatorische maatregelen neemt om de geregistreerde
      gegevens afdoende te beveiligen teneinde verlies en onrechtmatige of onnodige verwerking hiervan te voorkomen;

      e. de beheerder van de databank de geregistreerde gegevens overeenkomstig dit hoofdstuk verwerkt, en slechts
      voor andere doelen gebruikt dan verwerking overeenkomstig deze paragraaf nadat toestemming is verkregen van de
      betrokkene;

      f. de beheerder van de databank zorg draagt voor de kwaliteit van de gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel15b
      [ref2]: https://wetten.overheid.nl/BWBR0021777#Artikel6
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel15c
