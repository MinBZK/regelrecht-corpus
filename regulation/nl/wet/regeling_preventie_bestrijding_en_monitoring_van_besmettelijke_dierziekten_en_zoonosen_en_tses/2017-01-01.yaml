        bwb_id: BWBR0018397
        artikel: '56'
        hoofdstuk: '6'
  - number: '45'
    text: |-
      1 Runderen, jonger dan 12 maanden, worden van een ingevolge [artikel 21][ref1] erkend verzamelcentrum rechtstreeks
      afgevoerd naar:

      a. één of meer niet in Nederland gelegen bedrijven;

      b. een in Nederland gelegen mesterij.

      2 Indien runderen, bedoeld in het eerste lid, niet binnen de blokperiode kunnen worden afgevoerd naar een
      bestemming genoemd in het eerste lid, onderdelen a of b, worden de runderen rechtstreeks afgevoerd naar een al dan
      niet in Nederland gelegen slachthuis.

      3 In afwijking van het eerste lid, onderdeel b, is het toegestaan runderen af te voeren van een ingevolge
      [artikel 21][ref2] erkend verzamelcentrum naar een in Nederland gelegen mesterij en onderweg eenmalig runderen bij
      te laden op een ander ingevolge artikel 21 erkend verzamelcentrum, indien dat verzamelcentrum beschikt over een
      bijlaadvoorziening aan de openbare weg, die voldoet aan de volgende voorwaarden:

      a. de voorziening is zodanig geconstrueerd dat de laadwerkzaamheden ongehinderd kunnen plaatsvinden en

      b. de laadplaats is voorzien van een gesloten dakbedekking, windkerende wanden en een klimaatregelingssysteem,
      zodanig dat de laadplaats onder alle klimatologische omstandigheden deugdelijk en efficiënt gereinigd en ontsmet
      kan worden.

      4 In afwijking van het eerste lid is het toegestaan om runderen, jonger dan 12 weken, alvorens deze
      worden afgevoerd naar de bestemmingen, bedoeld in het eerste lid, onderdelen a en b, te vervoeren van een
      ingevolge [artikel 21][ref3] erkend runderverzamelcentrum naar een ander ingevolge [artikel 21][ref4] erkend
      runderverzamelcentrum indien de betrokken vervoerder alsmede de betrokken eigenaar of exploitant van het
      runderverzamelcentrum deelnemen aan een ingevolge [artikel 56][ref5] erkend kwaliteitssysteem.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel21
