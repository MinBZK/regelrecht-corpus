  - number: '97'
    text: |-
      Het is verboden te handelen in strijd met:

      a. de artikelen 7, vijfde lid, 9, eerste lid, 10, vierde lid, en 12, en bijlage II, onderdelen B, C en D, van
      verordening (EG) nr. 2160/2003;

      b. artikel 2 van verordening (EG) nr. 1177/2006;

      c. de bijlage bij verordening (EG) nr. 1190/2012;

      d. de bijlage bij verordening (EG) nr. 200/2012;

      e. de bijlage bij verordening (EG) nr. 517/2011;

      f. de bijlage bij verordening (EG) nr. 200/2010.
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel97
  - number: '98'
    text: |-
      De bemonstering, bedoeld in:

      a. punt 2.1, onderdeel a, onder ii, tweede gedachtestreepje, van de bijlage bij verordening (EU) nr. 1190/2012,
      vindt plaats op het bedrijf, bedoeld in dat gedachtestreepje;

      b. punt 2.1.1 van de bijlage bij verordening (EU) nr. 200/2010, vindt ten minste driewekelijks plaats op het
      bedrijf, bedoeld in onderdeel b van dat punt.
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel98
  - number: 98a
    text: |-
      Deze paragraaf is niet van toepassing, indien de minister op het moment van bemonstering, bedoeld in deze
      paragraaf, monsters heeft laten nemen en onderzoeken op de aanwezigheid van de relevante serotypen salmonella.
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel98a
  - number: 98b
    text: |-
      1 De houder van kippen die worden opgefokt tot vermeerderingsdier laat die dieren overeenkomstig
      [artikel 98e][ref1] bemonsteren:

      a. in de eerste 3 levensdagen;

      b. op een leeftijd van 4 weken, en

      c. 2 weken voor de overgang naar de legfase of verplaatsing naar een bedrijf waar ze als vermeerderingsdier worden
      gehouden.

      2 De houder laat de monsters, bedoeld in het eerste lid, onderzoeken op de aanwezigheid van:

      a. Salmonella enteritidis;

      b. Salmonella typhimurium;

      c. Salmonella hadar;

      d. Salmonella infantis, en

      e. Salmonella virchow.

      3 Onverminderd het tweede lid laat de houder de monsters, bedoeld in het eerste lid, van kippen die worden opgefokt
      tot vermeerderingsdier voor de productie van vleeskuikens onderzoeken op de aanwezigheid van Salmonella java.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel98e
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel98b
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 98e
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 98c
    text: |-
      1 De houder van kippen die worden opgefokt tot leghen laat die dieren overeenkomstig [artikel 98e][ref1]
      bemonsteren:

      a. in de eerste 3 levensdagen, en

      b. 2 weken voor de overgang naar de legfase of verplaatsing naar een bedrijf waar ze als leghen worden gehouden.

      2 De houder, bedoeld in het eerste lid, laat de monsters onderzoeken op de aanwezigheid van Salmonella enteritidis
      of Salmonella typhimurium.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel98e
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel98c
