  - number: 99a
    text: |-
      Het certificatiesysteem, bedoeld in bijlage VII, hoofdstuk C, deel 1, punt 3, bij verordening (EG) nr. 999/2001,
      bevat naast de gegevens, bedoeld in hoofdstuk C, deel 1, punt 2, van die bijlage:

      a. de datum van certificering als bedoeld in hoofdstuk C, deel 1, punt 3, van die bijlage;

      b. het laboratorium dat de genotypering, bedoeld in hoofdstuk C, deel 1, punt 5, van die bijlage heeft verricht,
      indien van toepassing.
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel99a
  - number: 99b
    text: |-
      1 Aan houders van schapen die deelnemen aan een fokprogramma als bedoeld in artikel 6 bis van verordening (EG) nr.
      999/2001 verleent de minister op aanvraag een erkenning als bedoeld in bijlage VII, hoofdstuk C, deel 4, punt 1,
      onderdeel a of b, bij die verordening, indien is voldaan aan de criteria van dat fokprogramma.

      2 Bij een aanvraag als bedoeld in het eerste lid worden in ieder geval gegevens vermeld waaruit blijkt dat:

      a. alle schapen in de kudde het ARR/ARR genotype hebben, indien een erkenning als bedoeld in hoofdstuk C, deel 4,
      punt 1, onderdeel a, van de bijlage, bedoeld in het eerste lid, wordt aangevraagd;

      b. alle nakomelingen in het jaar voorafgaande aan de aanvraag zijn verwekt door vaderdieren met het ARR/ARR
      genotype, indien een erkenning als bedoeld in hoofdstuk C, deel 4, punt 1, onderdeel b, van de bijlage, bedoeld in
      het eerste lid, wordt aangevraagd.
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel99b
