    text: |-
      In deze paragraaf wordt verstaan onder:

      a. *databank:* geautomatiseerde gegevensbank;

      b. *persoonsgegevens, verwerking van persoonsgegevens, verantwoordelijke, betrokkene onderscheidenlijk bewerker:*
      hetgeen daaronder wordt verstaan in [artikel 1 van de Wet bescherming persoonsgegevens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel1
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel15a
