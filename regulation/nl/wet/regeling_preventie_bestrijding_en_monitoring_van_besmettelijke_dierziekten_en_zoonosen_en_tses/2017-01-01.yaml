      - id: ref1
        bwb_id: BWBR0011468
        artikel: '1'
  - number: 15b
    text: |-
      1 De minister kan databanken aanwijzen waarin de registratie van gegevens, bedoeld in
      [artikel 98h, eerste lid][ref1], plaatsvindt.

      2 De gegevens worden verwerkt met als doel het ten behoeve van de bescherming van de dier- en volksgezondheid
      verkrijgen van inzicht in de gezondheidsstatus van dieren waarop de registratieverplichting van toepassing is en
      een effectief systeem van toezicht op en handhaving van de op deze dieren en de houders daarvan van toepassing
      zijnde regelgeving door de minister te bevorderen.

      3 De minister is verantwoordelijk voor de verwerking van persoonsgegevens in de databank.

      4 Een beheerder van een databank is bewerker van de persoonsgegevens.

      5 De minister en de beheerder van een databank verstrekken elkaar over en weer alle benodigde informatie teneinde
      een goede naleving van de Wet bescherming persoonsgegevens en andere privacywetgeving mogelijk te maken. Op verzoek
      van de minister toont de beheerder aan dat de noodzakelijke maatregelen zijn genomen.

      6 De beheerder van de databank stelt de minister te allen tijde kosteloos in de gelegenheid alle benodigde
      controles, gericht op de uitvoering van dit hoofdstuk en de naleving van privacywetgeving zoals de
      [Wet bescherming persoonsgegevens][ref2], uit te voeren of uit te doen voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel98h
      [ref2]: https://wetten.overheid.nl/BWBR0011468
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel15b
