    text: |-
      Als besmettelijke dierziekten, bedoeld in [artikel 15 van de wet][ref1], bij gevoelige soorten van
      aquacultuurdieren worden aangewezen:

      a. de exotische ziekten vermeld in bijlage IV, deel II van richtlijn nr. 2006/88/EG voor de bijbehorende, in
      dezelfde bijlage vermelde gevoelige soorten,

      b. de niet-exotische ziekten vermeld in bijlage IV, deel II van richtlijn nr. 2006/88/EG voor de bijbehorende, in
      dezelfde bijlage vermelde gevoelige soorten;

      c. OsHV-1 µvar als bedoeld in verordening (EG) nr. 175/2010.


