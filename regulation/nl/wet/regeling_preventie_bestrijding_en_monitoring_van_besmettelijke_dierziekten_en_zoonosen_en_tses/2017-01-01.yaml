  - number: '84'
    text: |-
      1 De ondernemer meldt onverwijld aan het landelijk telefoonnummer voor dierziekten elke verhoogde sterfte:

      a. van leghennen, vermeerderingsdieren of vleeskuikens, die ouder zijn dan 10 dagen op twee opeenvolgende dagen van
      0,5% of meer per koppel per dag;

      b. van vleeskalkoenen op twee opeenvolgende dagen van 1% of meer per koppel per dag, en

      c. van AI-gevoelige dieren van meer dan 3% per week.

      2 De ondernemer consulteert een dierenarts indien bij AI-gevoelige dieren:

      a. een klinisch probleem zichtbaar is;

      b. er op twee opeenvolgende dagen een reductie van voer- of drinkwateropname is van meer dan 5% per dag, en

      c. voor zover het leghennen of vermeerderingsdieren betreft, er op twee opeenvolgende dagen een reductie van de
      eiproductie is van 5% of meer per dag.

      3 Indien er geen sprake is van aviaire influenza of Newcastle disease doet de dierenarts binnen acht uur melding
      van het klinische probleem van de desbetreffende dieren of van de omstandigheden, bedoeld in het tweede lid,
      onderdelen b en c, en van de naam- en adresgegevens van het bedrijf aan de Gezondheidsdienst voor Dieren.
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel84
  - number: '85'
    text: |-
      1 Deze paragraaf is van toepassing op een houder die bedrijfsmatig vleeskuikens, vleeseenden, vleeskalkoenen,
      ganzen, kwartels, parelhoenders, loopvogels, vermeerderingsdieren van de soort kip, kalkoen of eend of leghennen
      van de soort kip houdt, die worden opgefokt of gehouden voor de fokkerij, voor de productie van vlees of eieren.

      2 Deze paragraaf is van toepassing op vermeerderingsdieren van de soort kip, kalkoen of eend en leghennen van de
      soort kip.
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel85
  - number: '86'
    text: |-
      1 De houder, bedoeld in [artikel 85, eerste lid][ref1], laat overeenkomstig de
      [artikelen 87 tot en met 92][ref2] bloed afnemen bij de dieren, bedoeld in artikel 85, eerste
      lid, en laat dit onderzoeken op de aanwezigheid van antistoffen tegen aviaire influenza, subtype
      H5 of H7, bedoeld in Richtlijn 2005/94/EG in een laboratorium dat daartoe is aangewezen in
      [artikel 20, tweede lid, van de Regeling erkenning en aanwijzing veterinaire laboratoria][ref3].

      2 De houder laat het bloed afnemen door een dierenarts of een dierenartsassistent paraveterinair.

      3 De hoeveelheid bloed die overeenkomstig het eerste lid per dier wordt afgenomen en onderzocht bedraagt ten minste
      1 milliliter.

      4 Het bloed wordt de uiterlijk werkdag na de dag dat het bloed is afgenomen aangeleverd bij het laboratorium,
      bedoeld in het eerste lid.

      5 Bij aanlevering van het bloed worden in ieder geval de volgende gegevens aangeleverd:

      a. gegevens ter identificatie van de houder van de dieren;

      b. gegevens ter identificatie van de dierenarts die het bloed heeft afgenomen;

      c. gegevens ter identificatie van de dieren waarbij het bloed is afgenomen;

      d. gegevens omtrent de bloedmonsters;

      e. de dagtekening;

      f. de handtekening van de inzender van de bloedmonsters.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel85
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel87
      [ref3]: https://wetten.overheid.nl/BWBR0019575#Artikel20
