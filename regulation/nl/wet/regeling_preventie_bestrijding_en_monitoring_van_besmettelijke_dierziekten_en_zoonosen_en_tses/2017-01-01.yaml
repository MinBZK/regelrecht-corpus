  - number: '23'
    text: |-
      1 Een verzamelcentrum dat is erkend ingevolge [artikel 21, eerste lid][ref1]:

      a. voldoet aan de eisen, genoemd in artikel 11, eerste lid, onderdelen c en e, van richtlijn nr. 64/432/EEG;

      b. voldoet aan de artikelen 9 en 17 van verordening (EG) nr. 1/2005, de
      [artikelen 2.1, eerste, tweede en zesde lid][ref2] en [2.2, achtste lid, van de Wet dieren][ref3] en de
      [artikelen 1.6, eerste en derde lid][ref4], [2.3][ref5] en [2.4 Besluit houders van dieren][ref6];

      c. wordt geëxploiteerd conform het door de minister goedgekeurde protocol;

      d. verleent de toezichthouder de medewerking die nodig is voor de uitoefening van zijn taken;

      e. voldoet aan:

        - de [artikelen 36][ref7], [37][ref8], [38][ref9], [41][ref10] en [42][ref11], voor zover het een
      varkensverzamelcentrum betreft;
        - de [artikelen 36][ref12], [37][ref13], [38][ref14], [41][ref15] en [43 tot en met 46][ref16], voor zover het een
      runderverzamelcentrum betreft;
        - de [artikelen 30, eerste lid][ref17], [31][ref18], [32][ref19] en
      [39 van de Regeling identificatie en registratie van dieren][ref20], voor zover het een varkensverzamelcentrum
      betreft;
        - de [artikelen 19][ref21] en [20, eerste lid][ref22], [21][ref23] en
      [39 van de Regeling identificatie en registratie van dieren][ref24], voor zover het een runderverzamelcentrum
      betreft.

      2 De eigenaar of exploitant van een verzamelcentrum dat is erkend ingevolge [artikel 21][ref25], houdt een voor de
      toezichthouder toegankelijk register bij met daarin de gegevens, bedoeld in artikel 11, tweede lid, van richtlijn
      nr. 64/432/EEG, en de gegevens, bedoeld in [artikel 28, tweede lid][ref26].

      3 Het register, bedoeld in het tweede lid, wordt minimaal drie jaren bewaard.


