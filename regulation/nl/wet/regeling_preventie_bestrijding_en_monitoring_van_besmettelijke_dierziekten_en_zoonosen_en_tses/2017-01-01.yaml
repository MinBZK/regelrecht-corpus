  - number: '87'
    text: |-
      1 Bij vleeskuikens, parelhoenders, loopvogels of kwartels wordt jaarlijks bloed afgenomen van ten minste 30 dieren
      met een leeftijd van ten minste vier weken.

      2 Bij vleeseenden of ganzen wordt jaarlijks bloed afgenomen van ten minste 40 dieren met een leeftijd van ten
      minste vier weken.
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel87
  - number: '88'
    text: |-
      1 Bij vleeskalkoenen wordt bij elke ronde bloed afgenomen van ten minste 30 hanen met een leeftijd van 18 weken.

      2 In afwijking van het eerste lid wordt, indien de houder geen andere vleeskalkoenen dan hennen houdt, bloed
      afgenomen van ten minste 30 hennen met een leeftijd van ten minste 13 weken.
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel88
  - number: '89'
    text: |-
      1 Bij vermeerderingsdieren wordt jaarlijks bloed afgenomen van ten minste 30 dieren met een leeftijd van ten minste
      45 weken.

      2 Bij dieren die worden opgefokt tot vermeerderingsdier wordt per koppel bloed afgenomen van ten minste 30 dieren
      met een leeftijd van ten minste 15 weken.
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel89
  - number: '90'
    text: |-
      1 Bij leghennen wordt jaarlijks bloed afgenomen van ten minste 30 dieren met een leeftijd van ten minste 45 weken.

      2 Bij dieren die worden opgefokt tot leghen wordt per koppel bloed afgenomen van ten minste 30 dieren met een
      leeftijd van ten minste acht weken.
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel90
  - number: '91'
    text: |-
      In afwijking van de [artikelen 87 tot en met 90][ref1] wordt bij dieren als bedoeld in
      [artikel 85, eerste lid][ref2], die gehouden worden op een bedrijf waar onder meer dieren worden gehouden in een
      houderijsysteem met vrije uitloop als bedoeld in bijlage II, onderdeel 1 van Verordening (EG) nr. 589/2008, ieder
      kwartaal bloed afgenomen, bij ten minste 30 dieren, ongeacht de leeftijd van de dieren.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel87
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel85
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel91
