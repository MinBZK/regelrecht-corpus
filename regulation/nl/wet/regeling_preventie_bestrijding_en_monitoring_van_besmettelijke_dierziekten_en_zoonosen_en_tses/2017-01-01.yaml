  - number: 29k
    text: |-
      a. De minister kan de aanwijzing als RE-bedrijf intrekken, indien de varkenshouder van de betreffende locatie
      niet voldoet aan de voorwaarden voor de aanwijzing, bedoeld in [artikel 29g][ref1], nadat de varkenshouder in de
      gelegenheid is gesteld binnen een termijn van ten hoogste zes weken alsnog aan de voorwaarden te voldoen en deze
      termijn inmiddels is verstreken.

      b. De intrekking als bedoeld in het eerste lid heeft een minimale duur van twaalf maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel29g
