  - number: '47'
    text: |-
      1 Slachtschapen of slachtgeiten worden van een ingevolge [artikel 21][ref1] erkend schapen- en
      geitenverzamelcentrum afgevoerd naar een al dan niet in Nederland gelegen slachthuis.

      2 In afwijking van het eerst lid is het toegestaan om slachtschapen en slachtgeiten, alvorens deze worden afgevoerd
      naar het slachthuis, te vervoeren van een ingevolge [artikel 21][ref2] erkend schapen- en geitenverzamelcentrum
      naar een ander erkend schapen- en geitenverzamelcentrum, indien de betrokken vervoerder alsmede de betrokken
      eigenaren of exploitanten van de schapen- en geitenverzamelcentra deelnemen aan een ingevolge [artikel 56][ref3]
      erkend kwaliteitssysteem.

      3 In geval van afvoer als bedoeld in het tweede lid, wordt voldaan aan artikel 4 quater, derde lid, onderdeel a,
      van richtlijn nr. 91/68/EEG.

      4 Indien op het schapen- en geitenverzamelcentrum, bedoeld in het tweede lid, schapen of geiten afkomstig van meer
      verzamelcentra of andere plaatsen tegelijkertijd in een blokperiode worden bijeen gebracht, worden alle in die
      blokperiode bijeengebrachte schapen en geiten afgevoerd overeenkomstig de voorwaarden genoemd in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel21
