        artikel: 40a
        hoofdstuk: '4'
        paragraaf: 4.3.1
  - number: 40h
    text: |-
      In afwijking van [artikel 40a][ref1] is het vervoer van één of meer varkens vanaf een C-bedrijf toegestaan, voor
      zover:

      a. varkens worden afgevoerd naar één of meerdere A-bedrijven;

      b. in een periode van twaalf maanden slechts varkens worden afgevoerd naar ten hoogste 40 B-bedrijven en D-
      bedrijven gezamenlijk;

      c. indien het C-bedrijf deel uitmaakt van een cluster van twee of drie C-bedrijven, in een periode van twaalf
      maanden door het cluster slechts varkens worden afgevoerd naar ten hoogste 30 B-bedrijven en D-bedrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel40a
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel40h
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 40a
        hoofdstuk: '4'
        paragraaf: 4.3.1
  - number: 40i
    text: |-
      1 In afwijking van [artikel 40a][ref1] is het vervoer van één of meer varkens naar een D-bedrijf toegestaan,
      voor zover in een periode van zestien weken slechts varkens worden aangevoerd, afkomstig van ten hoogste zes A-
      bedrijven, B-bedrijven, C-bedrijven, E-bedrijven of F-bedrijven of varkenshouderijbedrijven buiten Nederland, al
      dan niet via een verzamelcentrum.

      2 In afwijking van het eerste lid is het toegestaan één of meer varkens aan te voeren van ten hoogste twaalf A-
      bedrijven, B-bedrijven, C-bedrijven, E-bedrijven of F-bedrijven of varkenshouderijbedrijven buiten Nederland, al
      dan niet via een verzamelcentrum indien op het D-bedrijf:

      a. in een periode van drie weken voorafgaand aan de dag van aanvoer geen varkens aanwezig waren en de stallen zijn
      gereinigd en ontsmet.

      b. in een periode van acht weken voorafgaand aan de dag van aanvoer geen varkens op het D-bedrijf zijn aangevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel40a
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel40i
    references:
