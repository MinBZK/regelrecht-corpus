  - number: '49'
    text: |-
      In dit hoofdstuk wordt verstaan onder:

      a. organisator: organisator van een tentoonstelling of keuring;

      b. plaats: plaats waar tentoonstelling of keuring wordt gehouden.
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel49
  - number: '50'
    text: |-
      1 De organisator stelt ten minste 30 dagen voorafgaand aan de datum waarop de tentoonstelling of keuring
      zal plaatsvinden de NVWA schriftelijk in kennis van naam, adres en telefoonnummer van de organisator van de
      tentoonstelling of keuring, de datum en plaats, alsmede het UBN van de plaats, en het aantal runderen, schapen of
      geiten dat wordt tentoongesteld of gekeurd.

      2 De houder of eigenaar van de tentoon te stellen of te keuren runderen, schapen of geiten laat deze binnen vijf
      dagen voorafgaand aan de tentoonstelling of keuring door een dierenarts klinisch onderzoeken.

      3 Van het onderzoek, bedoeld in het tweede lid, wordt door de dierenarts en de houder of eigenaar van de runderen,
      schapen of geiten een verklaring opgesteld volgens het model in [bijlage 8][ref1].

      4 De organisator laat runderen, schapen of geiten toe tot de plaats indien zij vergezeld gaan van de door de
      dierenarts en de houder of eigenaar ondertekende verklaring, bedoeld in het derde lid.

      5 De tentoon te stellen of te keuren runderen, schapen of geiten worden uitsluitend op de plaats aangevoerd en van
      de plaats afgevoerd met vervoermiddelen waarvoor krachtens de [Wegenverkeerswet 1994][ref2] een kentekenbewijs of
      registratiebewijs is afgegeven.

      6 Runderen, schapen of geiten worden zo spoedig mogelijk na afloop van de tentoonstelling of keuring rechtstreeks
      vervoerd naar:

      a. een in Nederland gelegen slachthuis, of

      b. het bedrijf van herkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0018397
      [ref2]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0018397
      - id: ref2
        bwb_id: BWBR0006622
  - number: 50a
    text: |-
      In zoverre in afwijking van [artikel 50, leden 2, 3 en 4][ref1], worden geiten of schapen toegelaten tot een
      tentoonstelling of keuring als de houder of eigenaar van de ten toon te stellen of te keuren geiten of schapen de
      dieren klinisch heeft laten onderzoeken door een dierenarts op het terrein van de tentoonstelling of keuring en de
      resultaten van het onderzoek geen belemmering vormen voor de tentoonstelling of keuring van de betrokken dieren.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel50
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel50a
