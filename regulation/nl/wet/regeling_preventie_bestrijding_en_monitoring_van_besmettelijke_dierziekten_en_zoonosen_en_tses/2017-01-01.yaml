  - number: '17'
    text: |-
      1 Degene die ingevolge deze titel gegevens moet bijhouden of vermelden op daartoe bestemde bescheiden, doet dit
      volledig, juist en naar waarheid.

      2 Het bijhouden of vermelden van de in het eerste lid bedoelde gegevens geschiedt onverwijld nadat de gegevens
      bekend zijn bij degene die zij ingevolge deze regeling moet bijhouden of vermelden.
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel17
  - number: '18'
    text: |-
      1 Indien een of meer evenhoevigen worden aangevoerd op een verzamelcentrum dient het verzamelcentrum te zijn erkend
      ingevolge [artikel 21, eerste of vierde lid][ref1].

      2 Indien een of meer evenhoevigen worden aangevoerd op een slachthuis dient deze te beschikken over een reinigings-
      en ontsmettingsplaats voor vervoermiddelen die is erkend ingevolge [artikel 26, eerste lid][ref2].

      3 In afwijking van het tweede lid mogen een of meer evenhoevigen worden aangevoerd op een slachthuis met geringe
      capaciteit indien deze beschikt over een voorziening met voldoende capaciteit in relatie tot de werkzaamheden
      van het slachthuis, die zodanig is ingericht dat een deugdelijke en efficiënte reiniging en ontsmetting
      van vervoermiddelen kan plaatsvinden ongeacht het type vervoermiddel en voldoet aan de eisen, bedoeld in
      [bijlage 9][ref3]. De reiniging en ontsmetting wordt overeenkomstig een door de minister goedgekeurd protocol op
      zodanige wijze uitgevoerd dat de bioveiligheid niet in gevaar komt.

      4 De eigenaar of exploitant van een slachthuis met geringe capaciteit als bedoeld in het derde lid, houdt een
      register bij met daarin de gegevens, bedoeld in [artikel 28, tweede lid][ref4] en bewaart dit overeenkomstig
      [artikel 28, derde lid][ref5].

      5 De eigenaar of exploitant van een slachthuis met geringe capaciteit als bedoeld in
      [artikel 59, tweede lid][ref6], van de Regeling preventie, bestrijding en monitoring van besmettelijke dierziekten
      en zoönosen en TSE’s zoals deze luidde op het moment van inwerkingtreding van deze regeling, dient uiterlijk binnen
      drie maanden het protocol, bedoeld in het derde lid, ter goedkeuring in bij de NVWA en werkt uiterlijk zes maanden
      na inwerkingtreding van deze regeling overeenkomstig het door de minister goedgekeurde protocol.

      6 In afwijking van het tweede lid mogen een of meer evenhoevigen worden aangevoerd op een slachthuis met geringe
      capaciteit die bij inwerkingtreding van deze regeling over een vergunning beschikt die is afgegeven op grond van
      [artikel 59, vijfde lid][ref7], van de Regeling preventie, bestrijding en monitoring van besmettelijke dierziekten
      en zoönosen en TSE’s deze zoals deze luidde op het moment van inwerkingtreding van deze regeling.


