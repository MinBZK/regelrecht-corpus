  - number: 94u
    text: |-
      1 De monsters, bedoeld in [artikel 94t, eerste en tweede lid][ref1], worden afgenomen bij kippen of kalkoenen die
      zich verspreid over de stal of de stallen bevinden, waarbij ook kippen of kalkoenen worden meegenomen die vanwege
      ziekte zijn afgezonderd.

      2 De houder van kippen of kalkoenen die worden gehouden als vermeerderingsdier of die daartoe worden opgefokt laat
      per stal waarin die dieren worden gehouden monsters afnemen bij 1% van het aantal dieren, maar bij ten minste 30
      dieren en ten hoogste 60 dieren:

      a. kippen: op een leeftijd van 15 of 16 weken, 20 tot en met 22 weken, 30 weken en vervolgens iedere 12 weken;

      b. kalkoenen: op een leeftijd van 10 weken, 18 weken, 26 weken en vervolgens iedere 12 weken.

      3 In afwijking van het tweede lid, onderdeel a, wordt bij kippen die worden gehouden als grootouderdier of die
      daartoe worden opgefokt monsters afgenomen op een leeftijd van 15 of 16 weken, 20 weken en vervolgens iedere
      8 weken.

      4 Onverminderd het tweede lid laat de houder van kippen of kalkoenen die worden gehouden als vermeerderingsdier of
      die daartoe worden opgefokt, met uitzondering van eendagskuikens, monsters afnemen overeenkomstig de aanhef van het
      tweede lid in de twee weken voorafgaand aan het vervoer naar een ander bedrijf waar kippen of kalkoenen aanwezig
      zijn.

      5 De houder die kippen opfokt die bestemd zijn om te worden gehouden als legkip laat in de drie weken voorafgaand
      aan de verplaatsing van een koppel kippen naar een ander legkippenbedrijf per stal bij ten minste 24 van die dieren
      monsters afnemen.

      6 De houder van een koppel legkippen laat in de 9 weken voorafgaand aan het moment waarop de dieren worden geslacht
      per stal bij ten minste tien van die dieren bloed afnemen en bij tegen Mycoplasma synoviae gevaccineerde dieren ook
      ten minste twaalf tracheaswabmonsters.

      7 De houder van kalkoenen, laat in de drie weken voorafgaand aan het moment waarop de dieren worden geslacht bij
      ten minste 24 van die dieren monsters afnemen.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel94t
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel94u
