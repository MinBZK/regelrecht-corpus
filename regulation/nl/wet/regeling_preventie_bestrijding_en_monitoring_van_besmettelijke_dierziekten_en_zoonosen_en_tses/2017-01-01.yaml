      Als besmettelijke dierziekten als bedoeld in [artikel 15 van de wet][ref1] bij nertsen worden aangewezen:

      a. rabies;

      b. ziekte van Aujeszky;

      c. overdraagbare spongiforme encefalopathieën (TSE’s);

      d. brucellose;

      e. tuberculose ten gevolge van Mycobacterium tuberculosis complex;

      f. miltvuur;


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel15
