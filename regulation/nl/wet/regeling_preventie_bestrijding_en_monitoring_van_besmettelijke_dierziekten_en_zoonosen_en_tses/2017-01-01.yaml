  - number: '94'
    text: |-
      Een houder bewaart de uitslag van het onderzoek, bedoeld in artikel 86, eerste lid, gedurende een periode van twee
      jaar.
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel94
  - number: 94a
    text: |-
      1 Deze paragraaf is van toepassing op een houder die bedrijfsmatig vermeerderingsdieren van de soort kip of
      kalkoen, leghennen van de soort kip, vleeskuikens of vleeskalkoenen houdt, die worden opgefokt of gehouden voor de
      fokkerij, voor de productie van vlees of eieren.

      2 Deze paragraaf is van toepassing op vermeerderingsdieren van de soort kip of kalkoen en leghennen van de soort
      kip.
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel94a
  - number: 94b
    text: |-
      1 De houder, bedoeld in [artikel 94a, eerste lid][ref1], draagt er zorg voor dat de dieren, bedoeld in artikel 94a,
      eerste lid, tegen Newcastle disease worden gevaccineerd overeenkomstig de [artikelen 94c][ref2] en [94d][ref3].

      2 Het eerste lid is niet van toepassing op dieren die voorafgaand aan de aanvoer op het bedrijf van de houder
      overeenkomstig het eerste lid zijn gevaccineerd, mits de houder aan kan tonen dat uit het onderzoek, bedoeld in
      [artikel 94e][ref4], is gebleken dat de betreffende waarde, genoemd in [bijlage 16][ref5] is behaald.

      3 Onmiddellijk na vaccinatie vult de houder een vaccinatieverklaring met gebruikmaking van een middel dat hiertoe
      door de minister beschikbaar is gesteld en waarop in ieder geval de volgende gegevens zijn opgenomen:

      a. gegevens ter identificatie van de houder van de dieren;

      b. gegevens ter identificatie van de dierenarts die de dieren heeft gevaccineerd of hiertoe een diergeneesmiddel
      heeft afgeleverd;

      c. gegevens ter identificatie van de dieren die gevaccineerd zijn;

      d. gegevens omtrent de aard van de vaccinatie;

      e. gegevens omtrent het vaccin;

      f. de dagtekening;

      g. de handtekening van de houder en de dierenarts.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel94a
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel94c
      [ref3]: https://wetten.overheid.nl/BWBR0018397#Artikel94d
      [ref4]: https://wetten.overheid.nl/BWBR0018397#Artikel94e
