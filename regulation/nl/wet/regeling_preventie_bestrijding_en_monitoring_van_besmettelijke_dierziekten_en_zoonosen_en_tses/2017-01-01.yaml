        paragraaf: '1'
  - number: 40m
    text: |-
      Een varkenshouder weigert de ontvangst van varkens op zijn varkenshouderijbedrijf indien bij de aanvoer de
      toestemming met betrekking tot deze aanvoer ontbreekt.
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel40m
  - number: 40n
    text: |-
      1 Het bijladen van varkens op één vervoermiddel is verboden.

      2 Het in het eerste lid bedoelde verbod geldt niet ingeval het betrekking heeft op

      het bijladen op één vervoermiddel van varkens voor het vervoer naar een slachthuis, rechtstreeks of via een
      blokperiode voor slachtvarkens op een verzamelcentrum.

      3 Voor het bijladen geldt dat:

      a. het vervoermiddel waarop de varkens worden bijgeladen, niet op het bedrijf wordt gebracht waarop de bij te laden
      varkens zich bevinden;

      b. in het betrokken vervoermiddel door middel van een toegankelijk overzicht vanaf het moment van bijladen per
      vervoerseenheid wordt bijgehouden van welke bedrijven de varkens afkomstig zijn, welk overzicht gedurende zes
      maanden na de dag waarop het bijladen heeft plaatsgevonden, op het bedrijf of de onderneming van de vervoerder
      wordt bewaard.

      4 Op een vervoerseenheid bevinden zich per rit naar een slachthuis, onderscheidenlijk verzamelcentrum varkens van
      ten hoogste twee verschillende bedrijven, niet zijnde verzamelcentra.

      5 Op een vervoerseenheid bevinden zich per rit naar een slachthuis, onderscheidenlijk verzamelcentrum zeugen van
      ten hoogste drie verschillende bedrijven, niet zijnde verzamelcentra.
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel40n
  - number: 40o
    text: |-
      Voor iedere toestemming die wordt aangevraagd, is de varkenshouder van het varkenshouderijbedrijf een retributie
      verschuldigd aan de minister van maximaal € 2,50.
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel40o
  - number: 40p
    text: |-
      1 Een aanwijzing, schorsing of intrekking van een aanwijzing, of ontheffing verleend door de voorzitter van het
      Productschap voor Vee en Vlees wordt geacht te zijn verleend door de minister en blijft van toepassing, totdat de
      minister een ander besluit neemt.

      2 Een door het meldingsbureau van het Productschap voor Vee en Vlees afgegeven transportdocument wordt geacht een
      toestemming van de minister te zijn.
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel40p
  - number: '41'
    text: |-
      De aanbieder meldt de aanvang en het einde van een blokperiode uiterlijk om 8.00 uur op de werkdag voorafgaande aan
      de blokperiode aan de NVWA.
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel41
  - number: '42'
    text: |-
      Varkens worden van een ingevolge [artikel 21][ref1] erkend varkensverzamelcentrum rechtstreeks afgevoerd naar:

      a. een in Nederland gelegen slachthuis;

      b. naar een of meer bestemmingen buiten Nederland onder de volgende voorwaarden,

      ingeval de varkens afkomstig zijn:

        - uit Nederland gaan deze vergezeld van een of meer bewijsstukken als bedoeld in
      [artikel 77, tweede lid, van de wet][ref2];
        - uit een lidstaat gaan deze vergezeld van de gezondheidscertificaten, bedoeld in artikel 5, eerste en vijfde lid,
      van richtlijn nr. 64/432/EEG.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel77
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0005662
        artikel: '77'
  - number: '43'
    text: |-
      1 Fokrunderen worden van een ingevolge [artikel 21][ref1] erkend runderverzamelcentrum rechtstreeks afgevoerd naar
      één of meer niet in Nederland gelegen bedrijven.

      2 In afwijking van het eerste lid, worden de runderen, indien aan het einde van een blokperiode de fokrunderen niet
      zijn afgevoerd, na voorafgaande kennisgeving aan de NVWA met gebruikmaking van een daartoe ter beschikking gesteld
      formulier:

      a. door de aanbieder rechtstreeks afgevoerd naar een slachthuis;

      b. op het verzamelcentrum voor een periode van 21 dagen in een epidemiologische eenheid gescheiden gehouden
      van andere fokrunderen als zij nog niet ten minste 21 dagen in afzondering hebben gestaan waarna de fokrunderen
      rechtstreeks worden vervoerd naar een in Nederland gelegen bedrijf.

      3 De periode, bedoeld in het tweede lid, onderdeel b, vangt aan nadat het laatste fokrund aan de epidemiologische
      eenheid is toegevoegd.

      4 In afwijking van het eerste lid, worden de runderen, indien aan het einde van een blokperiode de fokrunderen niet
      zijn afgevoerd, op het verzamelcentrum gescheiden gehouden van andere fokrunderen voor ten hoogste de periode die
      benodigd is voor het verkrijgen van de resultaten van testen op besmettelijke dierziekten die bij de desbetreffende
      fokrunderen binnen de blokperiode zijn uitgevoerd, waarna de fokrunderen rechtstreeks worden vervoerd naar één of
      meer niet in Nederland gelegen bedrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel21
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '44'
    text: |-
      1 Slachtrunderen worden van een ingevolge [artikel 21][ref1] erkend runderverzamelcentrum rechtstreeks afgevoerd
      naar een, al dan niet in Nederland gelegen slachthuis.

      2 In afwijking van het eerste lid is het toegestaan om slachtrunderen, alvorens deze worden afgevoerd naar het
      slachthuis, te vervoeren van een ingevolge [artikel 21][ref2] erkend runderverzamelcentrum naar een ander ingevolge
      [artikel 21][ref3] erkend runderverzamelcentrum, indien de betrokken vervoerder alsmede de betrokken eigenaren of
      exploitanten van de runderverzamelcentra deelnemen aan een ingevolge [artikel 56][ref4] erkend kwaliteitssysteem.

      3 Indien op het andere runderverzamelcentrum, bedoeld in het tweede lid, slachtrunderen afkomstig van meer
      verzamelcentra of andere plaatsen tegelijkertijd in een blokperiode worden bijeen gebracht, worden alle in die
      blokperiode bijeengebrachte slachtrunderen afgevoerd naar een slachthuis.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0018397#Artikel21
      [ref4]: https://wetten.overheid.nl/BWBR0018397#Artikel56
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel44
