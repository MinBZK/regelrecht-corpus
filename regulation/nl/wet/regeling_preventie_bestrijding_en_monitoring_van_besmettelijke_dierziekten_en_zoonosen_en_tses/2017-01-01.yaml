  - number: 115b
    text: |-
      1 Een varkensverzamelcentrum, runderverzamelcentrum, schapenverzamelcentrum of geitenverzamelcentrum dat op het
      moment van inwerkingtreding van deze regeling, zoals die luidde onmiddellijk voor inwerkingtreding van de regeling
      van de Minister van Landbouw, Natuur en Voedselkwaliteit houdende wijziging van de Regeling preventie, bestrijding
      en monitoring van besmettelijke dierziekten en zoönosen en TSE’s in verband met de herziening van preventieregels
      voor evenhoevigen (TRCJZ/2008/2676), is erkend:

      a. wordt geacht te zijn erkend ingevolge [artikel 21][ref1], waarbij een verzamelcentrum met een erkenning voor een
      bepaalde categorie runderen wordt geacht te zijn erkend als runderverzamelcentrum, en een schapenverzamelcentrum of
      een geitenverzamelcentrum wordt geacht te zijn erkend als schapen- en geitenverzamelcentrum;

      b. dient uiterlijk binnen drie maanden na inwerkingtreding van deze regeling het protocol, bedoeld in
      [artikel 21, zesde lid][ref2], in bij de NVWA ter goedkeuring en werkt uiterlijk binnen zes maanden na
      inwerkingtreding van deze regeling overeenkomstig het door de minister goedgekeurde protocol.

      2 Een reinigings- en ontsmettingsplaats die op het moment van inwerkingtreding van deze regeling, zoals die
      luidde onmiddellijk voor inwerkingtreding van de regeling van de Minister van Landbouw, Natuur en Voedselkwaliteit
      houdende wijziging van de Regeling preventie, bestrijding en monitoring van besmettelijke dierziekten en zoönosen
      en TSE’s in verband met de herziening van preventieregels voor evenhoevigen (TRCJZ/2008/2676), is geregistreerd:

      a. wordt geacht te zijn erkend ingevolge [artikel 26][ref3];

      b. dient uiterlijk binnen drie maanden na inwerkingtreding van deze regeling het protocol, bedoeld in
      [artikel 26, tweede lid][ref4], in bij de NVWA ter goedkeuring en werkt uiterlijk binnen zes maanden na
      inwerkingtreding van deze regeling overeenkomstig het door de minister goedgekeurde protocol.


