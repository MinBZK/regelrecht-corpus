      1 Als modellen van kentekenen als bedoeld in [artikel 22, eerste lid, onderdeel d, van de wet][ref1], die
      worden geplaatst bij een gebouw of terrein dat besmet is of van besmetting is verdacht worden vastgesteld de in
      [bijlage 22, onder a][ref2], opgenomen modellen.

      2 Als model van het kenteken, bedoeld in [artikel 22, tweede lid, onderdeel c, van de wet][ref3], dat wordt gehecht
      aan een bijenwoning, wordt vastgesteld het in [bijlage 22, onder b][ref4], opgenomen model.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0018397
      [ref3]: https://wetten.overheid.nl/BWBR0005662#Artikel22
      [ref4]: https://wetten.overheid.nl/BWBR0018397
