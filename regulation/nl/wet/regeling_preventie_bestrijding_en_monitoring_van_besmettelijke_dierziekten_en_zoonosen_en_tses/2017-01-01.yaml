  - number: 98f
    text: |-
      1 De houder, bedoeld in deze paragraaf, laat de monsters onderzoeken in een laboratorium als bedoeld in
      [artikel 2 van de Regeling erkenning en aanwijzing veterinaire laboratoria][ref1].

      2 De monsters worden uiterlijk op de werkdag na de dag dat ze zijn genomen verzonden aan het laboratorium, bedoeld
      in het eerste lid.

      3 Bij aanlevering van de monsters worden in ieder geval de volgende gegevens aangeleverd:

      a. gegevens ter identificatie van de houder van de dieren, als naam, adres, en
      UBN, dan wel een door de minister toegekend registratienummer als bedoeld in
      [artikel 3 van de Regeling identificatie en registratie van dieren][ref2];

      b. gegevens ter identificatie van degene die het monster heeft genomen en ter identificatie van de dieren die zijn
      bemonsterd;

      b. gegevens omtrent de monsters;

      c. de dagtekening;

      d. de naam en handtekening van de inzender van de monsters.


      [ref1]: https://wetten.overheid.nl/BWBR0019575#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel3
