  - number: 29a
    text: |-
      In deze paragraaf en [paragraaf 4.3.1][ref1] wordt verstaan onder:

      a. *varkenshouderijbedrijf:* locatie van een landbouwbedrijf, niet zijnde een erkend varkensspermawincentrum
      als bedoeld in [artikel 3 van het Besluit eisen dierlijk sperma en spermawincentrum][ref2], waar slechts één
      varkenshouder actief is en waar, anders dan voor educatieve doeleinden, vijf of meer varkens worden gehouden dan
      wel een locatie die daarvoor bestemd is;

      b. *cluster:* combinatie van ten hoogste drie C-bedrijven als bedoeld in [artikel 29d][ref3], die uitsluitend
      van één en hetzelfde A-bedrijf als bedoeld in [artikel 29b][ref4] of E-bedrijf als bedoeld in [artikel 29e][ref5]
      varkens ontvangt;

      c. *toevoegstal:* stal, die is afgescheiden van de rest van het varkenshouderijbedrijf en waarvan inrichting en
      gebruik voldoen aan de in bijlage I opgenomen voorschriften;

      d. *big:* pasgeboren varken, niet zijnde speenbig;

      e. *speenbig:* varken van ten minste drie en ten hoogste twaalf weken oud dat niet meer wordt gezoogd door zijn
      moeder.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0010619#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0018397#Artikel29d
      [ref4]: https://wetten.overheid.nl/BWBR0018397#Artikel29b
      [ref5]: https://wetten.overheid.nl/BWBR0018397#Artikel29e
