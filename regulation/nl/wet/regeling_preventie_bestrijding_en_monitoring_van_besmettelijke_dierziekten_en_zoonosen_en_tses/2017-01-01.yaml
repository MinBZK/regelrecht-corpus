  - number: 98i
    text: |-
      Het is de exploitant van een levensmiddelenbedrijf, bedoeld in de bijlage, punt 2.1, bij verordening (EU) nr.
      517/2011, verboden om leghennen aan te voeren op een bedrijf waar de aanwezigheid van Salmonella enteritidis is
      vastgesteld, tenzij die dieren zijn gevaccineerd tegen Salmonella enteritidis.
