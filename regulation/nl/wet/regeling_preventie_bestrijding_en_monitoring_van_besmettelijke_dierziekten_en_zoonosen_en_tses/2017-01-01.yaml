  - number: 94s
    text: Deze paragraaf is van toepassing op bedrijfsmatig gehouden kippen en kalkoenen.
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel94s
  - number: 94t
    text: |-
      1 De houder van kippen of kalkoenen laat door een dierenarts of een dierenartsassistent paraveterinair bij die
      dieren ten minste 1 milliliter bloed afnemen overeenkomstig [artikel 94u][ref1].

      2 In het geval van tegen Mycoplasma synoviae gevaccineerde kippen en kalkoenen of kippen en kalkoenen afkomstig van
      een bedrijf waar tegen Mycoplasma synoviae is gevaccineerd, laat de houder van kippen of kalkoenen in aanvulling op
      het eerste lid door een dierenarts of een dierenartsassistent paraveterinair per stal 24 tracheaswabmonsters nemen.

      3 De houder laat, in een laboratorium als bedoeld in
      [artikel 2 van de Regeling erkenning en aanwijzing veterinaire laboratoria][ref2], de op grond van het eerste en
      tweede lid afgenomen monsters:

      a. van kippen of kalkoenen onderzoeken op de aanwezigheid van antistoffen tegen Mycoplasma gallisepticum en
      Mycoplasma synoviae en de tracheaswabmonsters, bedoeld in het tweede lid, op de aanwezigheid van Mycoplasma
      synoviae;

      b. van kalkoenen die worden gehouden als vermeerderingsdier, uitgezonderd de bloedmonsters, bedoeld in
      [artikel 94u, vierde lid][ref3], onderzoeken op de aanwezigheid van antistoffen tegen Mycoplasma meleagridis.

      4 Een op grond van het eerste of tweede lid afgenomen monster wordt uiterlijk op de werkdag na de dag dat het
      monster is genomen aangeleverd bij het laboratorium, bedoeld in het derde lid.

      5 Bij aanlevering van een monster worden in ieder geval de volgende gegevens aangeleverd:

      a. gegevens ter identificatie van de houder van de dieren, de dierenarts of een dierenartsassistent paraveterinair
      die het monster heeft genomen en de dieren waarbij het monster is genomen;

      b. gegevens omtrent de monsters;

      c. de dagtekening;

      d. de naam en handtekening van de inzender van de monsters.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel94u
      [ref2]: https://wetten.overheid.nl/BWBR0019575#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0018397#Artikel94u
