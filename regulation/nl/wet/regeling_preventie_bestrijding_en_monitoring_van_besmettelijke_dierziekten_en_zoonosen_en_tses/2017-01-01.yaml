    text: |-
      Als besmettelijke dierziekten als bedoeld in [artikel 15 van de wet][ref1] bij bijen worden aangewezen:

      a. Amerikaans vuilbroed;

      b. kleine bijenkastkever (Aethina tumida);

      c. Tropilaelapsmijt (Tropilaelaps spp).


