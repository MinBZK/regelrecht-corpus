      Als andere besmettelijke dierziekten als bedoeld in [artikel 100 van de wet][ref1] worden aangewezen:

      a. salmonellose;

      b. campylobacteriose;

      c. listeriose;

      d. toxoplasmose;

      e. echinococcose;

      f. yersiniose;

      g. leptospirose ten gevolge van Leptospira hardjo;

      h. zwoegerziekte.


