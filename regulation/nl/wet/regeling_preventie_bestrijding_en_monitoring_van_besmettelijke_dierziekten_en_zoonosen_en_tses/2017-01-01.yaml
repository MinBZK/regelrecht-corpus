  - number: '36'
    text: |-
      1 Het is verboden evenhoevigen afkomstig van verschillende plaatsen bijeen te brengen.

      2 Het verbod, bedoeld in het eerste lid, is niet van toepassing indien het bijeenbrengen betreft van diersoorten en
      diercategorieën genoemd in de [artikelen 37][ref1] tot en met [52][ref2] en deze dieren worden aangevoerd, vervoerd
      en afgevoerd overeenkomstig die artikelen en wordt voldaan aan de verplichtingen opgenomen in die artikelen.

      3 Het is verboden evenhoevigen aan te voeren die in strijd met de in dit hoofdstuk opgenomen bepalingen zijn
      bijeengebracht, afgevoerd of vervoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel52
