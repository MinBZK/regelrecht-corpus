  - number: '82'
    text: |-
      1 Het is verboden:

      a. een of meer varkens te ontvangen op een varkenshouderijbedrijf;

      b. een of meer varkens op een varkenshouderijbedrijf te houden, of

      c. een of meer varkens die zich op een varkenshouderijbedrijf bevinden, af te voeren.

      2 Het verbod, bedoeld in het eerste lid, is niet van toepassing indien:

      a. de eigenaar of exploitant van het bedrijf, dan wel diens vertegenwoordiger, dan wel degene die op dat bedrijf
      een of meer varkens houdt, varkens die verschijnselen van een besmettelijke dierziekte vertonen, behandelt of laat
      behandelen en binnen 24 uur nadat die behandeling is ingesteld, bloed is afgenomen en is ingestuurd ten behoeve van
      onderzoek op de aanwezigheid van een besmettelijke dierziekte;

      b. de eigenaar of exploitant van het bedrijf, dan wel diens vertegenwoordiger, dan wel degene die op dat bedrijf
      een of meer varkens houdt, voor zover op dat bedrijf varkens mogelijk ten gevolge van een besmettelijke dierziekte
      zijn gestorven, een representatief aantal van die dieren ter sectie heeft ingestuurd ten behoeve van onderzoek op
      de aanwezigheid van klassieke varkenspest.
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel82
  - number: 82a
    text: |-
      1 Een houder van varkens laat iedere viermaandelijkse periode die loopt van januari tot en met april, van mei tot
      en met augustus en van september tot en met december, ten minste 8 milliliter bloed afnemen bij drie varkens die:

      a. ten minste 25 kg zwaar zijn, of

      b. de zwaarste dieren zijn.

      2 Het is toegestaan om het bloed, bedoeld in het eerste lid, af te laten nemen nadat de dieren zijn gedood.

      3 Het eerste lid is niet van toepassing, indien het aantal gehouden varkens, uitgezonderd zogende biggen, gedurende
      de periode, bedoeld in het eerste lid, minder dan 31 bedraagt.
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel82a
  - number: 82b
    text: |-
      1 De houder van varkens laat het bloed, bedoeld in [artikel 82a, eerste lid][ref1], in een laboratorium als bedoeld
      in [artikel 2 van de Regeling erkenning en aanwijzing veterinaire laboratoria][ref2] onderzoeken op de aanwezigheid
      van antistoffen tegen het Aujeszky-virus of het Aujeszky-vaccin.

      2 De monsters worden uiterlijk op de werkdag na de dag dat ze zijn genomen aangeleverd bij het laboratorium,
      bedoeld in het eerste lid.

      3 Bij aanlevering van de monsters worden in ieder geval de volgende gegevens aangegeven:

      a. gegevens ter identificatie van de houder van de dieren, van degene die het monster heeft genomen en van de
      dieren die zijn bemonsterd;

      b. gegevens omtrent de monsters;

      c. de dagtekening;

      d. de handtekening van de inzender van de monsters.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel82a
      [ref2]: https://wetten.overheid.nl/BWBR0019575#Artikel2
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel82b
