  - number: 15d
    text: |-
      1 Een aanvraag tot aanwijzing als bedoeld in [artikel 15b, eerste lid][ref1], wordt ingediend bij de minister.

      2 Een aanvraag tot aanwijzing lid gaat vergezeld van:

      a. bewijsstukken dat voldaan wordt aan de [artikelen 15c][ref2] en [15e][ref3], en

      b. een verklaring dat een bewerkersovereenkomst en een gegevensleveringsovereenkomst met de minister worden
      gesloten, indien de databank wordt aangewezen.

      3 Met toepassing van artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet is
      [paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref4] niet van toepassing op een aanvraag als bedoeld in
      [artikel 15b, eerste lid][ref5].

      4 Op een aanvraag tot aanwijzing wordt binnen zes weken na de datum van ontvangst van de aanvraag beslist.

      5 De minister kan de termijn, bedoeld in het vierde lid, eenmaal met zes weken verlengen.


