  - number: '34'
    text: |-
      1 Een vervoermiddel waarmee een of meer evenhoevigen in Nederland worden gebracht, afkomstig uit een
      lidstaat of een derde land, en dat wordt gelost op een plaats die niet beschikt over een ingevolge
      [artikel 26, eerste lid][ref1], erkende reinigings- en ontsmettingsplaats, wordt na reiniging en ontsmetting als
      bedoeld in [artikel 31, eerste lid][ref2], onmiddellijk vervoerd naar een ingevolge [artikel 26, eerste lid][ref3],
      erkende reinigings- en ontsmettingsplaats, om aldaar te worden gereinigd en ontsmet.

      2 Indien het vervoermiddel, bedoeld in het eerste lid, afkomstig is vanuit een lidstaat waar een uitbraak van
      een besmettelijke dierziekte als bedoeld in [artikel 2, onderdeel a, b, c, d, l, s, t, u, v, x, y, z][ref4], is
      bevestigd, overlegt de vervoerder binnen 24 uur na binnenkomst in Nederland aan de NVWA een bewijs van de reiniging
      en ontsmetting waaruit in ieder geval blijkt welk lokaal referentienummer en voor zover van toepassing welk
      referentienummer van het certificaat, bedoeld in verordening (EG) nr. 599/2004, het meest recentelijk voor het
      desbetreffende vervoermiddel is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel26
