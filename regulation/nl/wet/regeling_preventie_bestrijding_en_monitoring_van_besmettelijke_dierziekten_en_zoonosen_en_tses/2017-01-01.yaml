  - number: 29hb
    text: |-
      1 Indien sprake is van een vaste relatie tussen een A-bedrijf en een E-bedrijf of tussen een B-bedrijf en een F-
      bedrijf, wordt dit aan de minister gemeld met gebruikmaking van een middel dat daartoe door de minister beschikbaar
      is gesteld.

      2 Een vaste relatie als bedoeld in het eerste lid kan eenmaal per twaalf maanden wijzigen. Een wijziging wordt
      voorafgaand aan de toepassing van de wijziging aan de minister gemeld met gebruikmaking van een middel, dat daartoe
      door de minister beschikbaar is gesteld.
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel29hb
  - number: 29i
    text: |-
      1 De minister kan de aanwijzing als A-bedrijf, B-bedrijf, C-bedrijf, E-bedrijf of F-bedrijf met onmiddellijke
      ingang schorsen voor een termijn van ten hoogste 12 weken, indien het varkenshouderijbedrijf:

      a. niet voldoet aan de voorwaarden voor de aanwijzing, bedoeld in de [artikelen 29b][ref1], [29c][ref2],
      [29d][ref3], [29e][ref4], onderscheidenlijk [29f][ref5], of

      b. in een periode van twaalf maanden meer dan eenmaal varkens heeft vervoerd of ontvangen in strijd met de
      onderscheiden [artikelen 40c tot en met 40h][ref6], [40j][ref7] en [40k][ref8].

      2 In geval van schorsing van de aanwijzing, bedoeld in het eerste lid, mogen geen varkens meer worden aangevoerd of
      afgevoerd anders dan naar een slachthuis of naar een varkensbedrijf buiten Nederland, hetzij rechtstreeks, hetzij
      via een verzamelcentrum.


