  - number: '30'
    text: |-
      1 Het is verboden om een ongeladen vervoermiddel waarmee een of meer evenhoevigen zijn vervoerd, op de openbare
      weg te brengen, dan wel op een plaats of bedrijf waar evenhoevigen worden gehouden, op een slachthuis of op een
      verzamelcentrum voor evenhoevigen.

      2 Het eerste lid is niet van toepassing indien het vervoermiddel is gereinigd en ontsmet overeenkomstig de
      [artikelen 31][ref1], [34][ref2] of [35][ref3].

      3 Het verbod, bedoeld in het eerste lid, is niet van toepassing op het vervoer, bedoeld in
      [artikel 31, tweede tot en met vierde lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel34
