  - number: 29j
    text: |-
      De minister kan de aanwijzing als A-bedrijf, B-bedrijf, C-bedrijf, E-bedrijf of F-bedrijf intrekken, indien het
      varkenshouderijbedrijf:

      a. niet voldoet aan de voorwaarden voor de aanwijzing, bedoeld in de [artikelen 29b][ref1], [29c][ref2],
      [29d][ref3], [29e][ref4], onderscheidenlijk [29f][ref5], nadat de varkenshouder in de gelegenheid is gesteld binnen
      een termijn van ten hoogste zes weken alsnog aan de voorwaarden te voldoen en deze termijn inmiddels is verstreken,

      b. na afloop van de schorsing, bedoeld in [artikel 29i, aanhef en onderdeel a][ref6], nog steeds niet voldoet aan
      de gestelde eisen, of

      c. in een periode van twaalf maanden na de schorsing, bedoeld in [artikel 29i, aanhef en onderdeel b][ref7],
      opnieuw varkens van het varkenshouderijbedrijf afvoert of op het bedrijf ontvangt in strijd met de onderscheiden
      [artikelen 40c tot en met 40h][ref8], [40j][ref9] en [40k][ref10].

      d. ligt in een vaccinatiegebied dat is ingesteld na een uitbraak van de ziekte van Aujeszky. De minister kan
      voorwaarden stellen voor de aan- en afvoer van varkens.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel29b
