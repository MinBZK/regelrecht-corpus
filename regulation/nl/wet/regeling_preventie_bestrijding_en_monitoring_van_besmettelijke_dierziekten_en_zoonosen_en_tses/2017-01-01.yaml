  - number: 40a
    text: Aan- of afvoer van één of meer varkens vanaf of naar een varkenshouderijbedrijf is verboden.
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel40a
  - number: 40b
    text: |-
      Het verbod, bedoeld in [artikel 40a][ref1], is niet van toepassing op het vervoer van:

      a. één of meer varkens van of naar een A-bedrijf, B-bedrijf, C-bedrijf, E-bedrijf of F-bedrijf of naar een D-
      bedrijf met een toestemming als bedoeld in [artikel 40l][ref2];

      b. één of meer varkens van een varkenshouderijbedrijf naar een slachthuis, hetzij
      rechtstreeks, hetzij via een verzamelcentrum en uit het vervoersdocument, bedoeld in
      [artikel 30, eerste lid, van de Regeling identificatie en registratie van dieren][ref3] blijkt dat sprake is van
      vervoer van slachtvarkens;

      c. één of meer mannelijke varkens van een varkenshouderijbedrijf naar een quarantaineruimte in een
      varkensspermawincentrum;

      d. één of meer varkens van een varkenshouderijbedrijf naar een onderzoeksinstituut dat in het bezit is van een
      vergunning op basis van [artikel 2 van de Wet op de dierproeven][ref4];

      e. ten hoogste vier varkens per levering van een varkenshouderijbedrijf naar een RE-bedrijf;

      f. één of meer varkens van een varkenshouderijbedrijf naar een varkenshouderijbedrijf buiten Nederland, hetzij
      rechtstreeks, hetzij via een verzamelcentrum;

      g. één of meer varkens afkomstig van een varkenshouderijbedrijf of verzamelcentrum buiten Nederland die op een
      varkenshouderijbedrijf worden ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel40a
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel40l
      [ref3]: https://wetten.overheid.nl/BWBR0014538#Artikel30
      [ref4]: https://wetten.overheid.nl/BWBR0003081#Artikel2
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel40b
    references:
      - id: ref1
