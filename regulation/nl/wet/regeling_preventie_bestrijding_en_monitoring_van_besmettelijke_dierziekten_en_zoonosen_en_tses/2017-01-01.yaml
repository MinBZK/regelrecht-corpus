  - number: 37a
    text: |-
      1 Het overladen van evenhoevigen van een vervoerseenheid naar een andere vervoerseenheid is verboden.

      2 Het verbod, bedoeld in het eerste lid, is niet van toepassing op het overladen van een voorwagen op een lege
      aanhangwagen, beide behorend tot hetzelfde vervoermiddel, dat geschiedt op een reinigings- en ontsmettingsplaats
      als bedoeld in [artikel 20, eerste lid][ref1], of [artikel 26, eerste lid][ref2], indien:

      a. na het overladen de voorwagen van het vervoermiddel onmiddellijk gereinigd en ontsmet wordt op de reinigings- en
      ontsmettingsplaats waar het overladen heeft plaatsgevonden, en

      b. voldaan wordt aan de [artikelen 19][ref3], [28][ref4], [31, eerste lid][ref5], en [32, eerste lid][ref6].


