    text: |-
      1 Indien een kwaliteitssysteem niet meer aan de eisen, bedoeld in [artikel 56][ref1], voldoet kan de minister:

      a. nadere voorwaarden verbinden aan de erkenning;

      b. de erkenning met onmiddellijke ingang schorsen of intrekken.

      2 De minister kan de nadere voorwaarden opheffen of een schorsing beëindigen indien ten genoegen van de minister is
      aangetoond dat het kwaliteitssysteem weer volledig aan alle eisen voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel56
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel58
