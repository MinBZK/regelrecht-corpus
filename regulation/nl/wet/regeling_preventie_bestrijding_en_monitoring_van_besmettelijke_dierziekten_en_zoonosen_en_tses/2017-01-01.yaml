  - number: 94c
    text: |-
      1 De vaccinatie, bedoeld in [artikel 94b, eerste lid][ref1], vindt plaats:

      a. in de periode van 3 tot en met 18 dagen nadat de dieren zijn uitgekomen, of

      b. voor zover gebruik wordt gemaakt van een niet-spreidend vaccin, voordat de dieren 3 dagen oud zijn.

      2 In afwijking van het eerste lid worden dieren die afkomstig zijn van vermeerderingsdieren die niet zijn
      gevaccineerd tegen Newcastle disease onmiddellijk na plaatsing op het bedrijf gevaccineerd.

      3 Dieren die ouder zijn dan 18 dagen en niet gevaccineerd zijn overeenkomstig het eerste lid, omdat zij uit een
      ander land dan Nederland afkomstig zijn, worden onmiddellijk na plaatsing op het bedrijf gevaccineerd.

      4 In aanvulling op het eerste tot en met het derde lid, worden leghennen en vermeerderingsdieren:

      a. voor zover het dieren, anders dan kalkoenen betreft, binnen 22 weken na het uitkomen;

      b. voor zover het kalkoenen betreft, binnen 30 weken na het uitkomen;

      door middel van een injectie gevaccineerd met een geïnactiveerd vaccin.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel94b
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel94c
    references:
