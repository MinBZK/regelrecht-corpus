    text: |-
      1 De verplichting tot kennisgeving, bedoeld in [artikel 100 van de wet][ref1], van verschijnselen van BSE geldt in
      elk geval met betrekking tot runderen ouder dan twintig maanden, die gedragsstoornissen of neurologische symptomen
      vertonen en waarbij de ziekte op grond van een reactie op een behandeling of op grond van een laboratoriumonderzoek
      niet kan worden uitgesloten.

      2 De verplichting tot kennisgeving, bedoeld in [artikel 100 van de wet][ref2], van verschijnselen van scrapie
      geldt in elk geval met betrekking tot schapen en geiten ouder dan twaalf maanden, die gedragsstoornissen of
      neurologische symptomen vertonen en waarbij de ziekte op grond van een reactie op een behandeling of op grond van
      een laboratorium-onderzoek niet kan worden uitgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel100
