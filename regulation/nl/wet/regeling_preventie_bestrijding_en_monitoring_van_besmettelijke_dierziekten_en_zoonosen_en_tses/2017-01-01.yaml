  - number: 94o
    text: |-
      1 Van een koppel van de dieren, bedoeld in [artikel 94a, eerste lid][ref1], dat binnen 28 dagen na het uitkomen
      wordt verplaatst, zijn de dieren ten minste zeven dagen voor verplaatsing gevaccineerd door middel van een spray
      of aërosol.

      2 Van een koppel van de dieren, bedoeld in [artikel 94a, eerste lid][ref2], dat wordt verplaatst in de periode van
      28 tot 70 dagen na het uitkomen:

      a. kan worden aangetoond dat de dieren overeenkomstig [artikel 94e, eerste lid][ref3] zijn onderzocht en dat de
      waarde, bedoeld in [bijlage 16][ref4], onderdeel 1, onder a of onderdeel 2, onder a, is behaald, en

      b. zijn de dieren in de periode van 42 tot 7 dagen voor verplaatsing gevaccineerd door middel van een spray of
      aërosol.

      3 Het eerste lid is niet van toepassing op dieren die binnen 8 dagen na het uitkomen worden verplaatst, indien kan
      worden aangetoond dat de dieren afkomstig zijn van ouderdieren die overeenkomstig deze paragraaf gevaccineerd zijn.


