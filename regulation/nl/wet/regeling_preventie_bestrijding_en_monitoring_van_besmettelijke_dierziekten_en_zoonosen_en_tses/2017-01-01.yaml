  - number: 94m
    text: |-
      1 Wanneer uit het onderzoek, bedoeld in [artikel 94e, eerste lid][ref1], blijkt dat de betreffende waarde,
      genoemd in [bijlage 16][ref2], onderdeel 2, bij een koppel vleeskalkoenen niet wordt behaald, laat de houder de
      eerstvolgende twee koppels vleeskalkoenen die op het bedrijf worden gevaccineerd door een dierenarts vaccineren.

      2 Wanneer uit het onderzoek, bedoeld in [artikel 94e, eerste lid][ref3], blijkt dat de betreffende waarde, genoemd
      in [bijlage 16][ref4], onderdeel 2, bij een koppel vleeskalkoenen dat overeenkomstig het eerst lid gevaccineerd
      is, niet wordt behaald, laat de houder de eerstvolgende drie koppels vleeskalkoenen die op het bedrijf worden
      gevaccineerd door een dierenarts vaccineren:

      a. in de periode van 10 tot 15 dagen na het uitkomen;

      b. in de periode van 28 tot 35 dagen na het uitkomen;

      c. in de periode van 8 tot 10 weken na het uitkomen;

      d. indien het mannelijke dieren betreft, 16 weken na het uitkomen.

      3 De houder stuurt uiterlijk twee weken na de vaccinatie een kopie van de vaccinatieverklaring, bedoeld in
      [artikel 94b, derde lid][ref5], aan de Gezondheidsdienst voor dieren.


