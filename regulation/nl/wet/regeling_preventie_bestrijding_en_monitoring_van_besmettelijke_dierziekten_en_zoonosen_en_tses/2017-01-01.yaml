  - number: '59'
    text: |-
      1 Een kwaliteitssysteem wordt opgesteld en beheerd door een rechtspersoon als bedoeld in
      [artikel 2:3 van het Burgerlijk Wetboek][ref1].

      2 De wijze van de inrichting en het beheer en alle overige werkprocessen van de in het eerste lid bedoelde
      rechtspersoon zijn overzichtelijk, duidelijk en volledig beschreven in één of meer schriftelijke stukken.

      3 De inrichting en het beheer van het kwaliteitssysteem voldoen aan de criteria van ISO 9001 zoals die zijn
      gedeponeerd bij het Nederlands Normalisatie-instituut te Delft.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel3
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '3'
  - number: '60'
    text: |-
      1 De rechtspersoon, bedoeld in [artikel 59, eerste lid][ref1], verplicht de deelnemers om de eisen, bedoeld in
      [artikel 63][ref2], en de daarop gebaseerde inhoudelijke normen, na te leven.

      2 De rechtspersoon, bedoeld in [artikel 59, eerste lid][ref3], voorziet in een doeltreffend systeem van controle op
      de naleving van de in het kwaliteitssysteem vastgelegde verplichtingen.

      3 Het controlesysteem zal in elk geval bestaan uit adequate controles op de eisen, bedoeld in [artikel 63][ref4],
      en de daarop gebaseerde inhoudelijke normen van het kwaliteitssysteem.

      4 De controles worden uitgevoerd door één of meer onafhankelijke, deskundige instanties.

      5 Een instantie als bedoeld in het vierde lid, is geaccrediteerd door de Nederlandse Raad voor Accreditatie of door
      een gelijkwaardige buitenlandse instantie is verklaard dat de instantie voldoet aan de relevante criteria van ISO
      17021 zoals die zijn gedeponeerd bij het Nederlands Normalisatie-instituut te Delft.


