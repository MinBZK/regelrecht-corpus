preamble:
  text: |-
    Handelende in overeenstemming met de Minister van Volksgezondheid, Welzijn en Sport (titel 4, hoofdstuk 1,
    paragraaf 1);

    Gelet op:

    – verordening (EG) nr. 2160/2003 van het Europees Parlement en de Raad van de Europese Unie van 17 november 2003
    inzake de bestrijding van salmonella en andere specifieke door voedsel overgedragen zoönoseverwekkers (PbEG L 325);

    – verordening (EG) nr. 999/2001 van het Europees Parlement en de Raad van de Europese Unie van 22 mei 2001 houdende
    vaststelling van voorschriften inzake preventie, bestrijding en uitroeiing van bepaalde overdraagbare spongiforme
    encefalopatieën (PbEG L 147);

    – richtlijn nr. 2003/99/EG van het Europees Parlement en de Raad van de Europese Unie van 17 november 2003 inzake
    de bewaking van zoönoses en zoönoseverwekkers en houdende wijziging van beschikking nr. 90/424/EEG van de Raad van
    de Europese Unie en intrekking van richtlijn nr. 92/117/EEG van de Raad van de Europese Unie (PbEG L 325);

    – richtlijn nr. 2003/85/EG van de Raad van de Europese Unie van 29 september 2003 tot vaststelling van
    communautaire maatregelen voor de bestrijding van mond- en klauwzeer, tot intrekking van richtlijn nr. 85/511/
    EEG en van de beschikkingen nr. 89/531/EEG en nr. 91/665/EEG, en tot wijziging van richtlijn nr. 92/46/EEG (PbEG
    L 306);

    – richtlijn nr. 2001/89/EG van de Raad van de Europese Unie van 23 oktober 2001 betreffende maatregelen van de
    Gemeenschap ter bestrijding van klassieke varkenspest (PbEG L 316);

    – richtlijn nr. 95/70/EG van de Raad van de Europese Unie van 22 december 1995 tot vaststelling van minimale
    communautaire maatregelen ter bestrijding van bepaalde ziekten van tweekleppige weekdieren (PbEG L 332);

    – richtlijn nr. 93/53/EEG van de Raad van de Europese Gemeenschappen van 24 juni 1993 tot vaststelling van minimale
    communautaire maatregelen voor de bestrijding van bepaalde visziekten (PbEG L 175);

    – richtlijn nr. 92/35/EEG van de Raad van de Europese Gemeenschappen van 29 april 1992 tot vaststelling van
    controlevoorschriften en van maatregelen ter bestrijding van paardepest (PbEG L 157);

    – richtlijn nr. 92/40/EEG van de Raad van de Europese Gemeenschappen van 19 mei 1992 tot vaststelling van
    communautaire maatregelen voor de bestrijding van aviaire influenza (PbEG L 167);

    – richtlijn nr. 92/66/EEG van de Raad van de Europese Gemeenschappen van 14 juli 1992 tot vaststelling van
    communautaire maatregelen voor de bestrijding van de ziekte van Newcastle (PbEG L 260);

    – richtlijn nr. 92/119/EEG van de Raad van de Europese Gemeenschappen van 17 december 1992 tot vaststelling van
    algemene communautaire maatregelen voor de bestrijding van bepaalde dierziekten en van specifieke maatregelen ten
    aanzien van vesiculaire varkensziekte (PbEG 1993 L 62);

    – richtlijn nr. 91/68/EEG van de Raad van de Europese Gemeenschappen van 28 januari 1991 inzake
    veterinairrechtelijke voorschriften voor het intracommunautaire handelsverkeer in schapen en geiten (PbEG L 46);

    – richtlijn nr. 90/425/EEG van de Raad van de Europese Gemeenschappen van 26 juni 1990 inzake veterinaire en
    zoötechnische controles in het intracommunautaire handelsverkeer in bepaalde levende dieren en produkten in het
    vooruitzicht van de totstandbrenging van de interne markt (PbEG L 224);

    – richtlijn nr. 90/426/EEG van de Raad van de Europese Gemeenschappen van 26 juni 1990 tot vaststelling van
    veterinairrechtelijke voorschriften voor het verkeer van paardachtigen en de invoer van paardachtigen uit derde
    landen (PbEG L 224);

    – richtlijn nr. 90/539/EEG van de Raad van de Europese Gemeenschappen van 15 oktober 1990 tot vaststelling van
    veterinairrechtelijke voorschriften voor het intracommunautaire handelsverkeer en de invoer uit derde landen van
    pluimvee en broedeieren (PbEG L 303);

    – richtlijn nr. 82/894/EEG van de Raad van de Europese Gemeenschappen van 21 december 1982 inzake de melding van
    dierziekten in de Gemeenschap (PbEG L 378);

    – richtlijn nr. 78/52/EEG van de Raad van de Europese Gemeenschappen van 13 december 1977 tot vaststelling van de
    communautaire criteria voor de nationale programma’s voor de versnelde uitroeiing van brucellose, tuberculose en
    endemische leukose bij runderen (PbEG 1978 L 15);

    – richtlijn nr. 64/432/EEG van inzake veterinairrechtelijke vraagstukken op het gebied van het intracommunautaire
    handelsverkeer in runderen en varkens, zoals gewijzigd bij richtlijn nr. 97/12/EG van de Raad van de Europese Unie
    van 17 maart 1997 (PbEG L 109);

    – beschikking nr. 90/424/EEG van de Raad van de Europese Gemeenschappen van 26 juni 1990 betreffende bepaalde
    uitgaven op veterinair gebied (PbEG L 224);

    – beschikking nr. 2003/100/EG van de Commissie van de Europese Gemeenschappen van 13 februari 2003 tot
    vaststelling van minimumeisen voor fokprogramma’s ter verkrijging van resistentie tegen overdraagbare spongiforme
    encefalopathieën bij schapen (PbEG L 041);

    Gelet op de artikelen 10, eerste en tweede lid, onderdelen b en c, 11, eerste lid, 15, 17, 18, 23, 25, tweede
    lid, 26, 30, 31, 77, 81, 94, 100 en 107, 108 en 108a van de Gezondheids- en welzijnswet voor dieren, artikel 10a
    van de Veewet, artikel 19 van de Landbouwwet, artikel 7, tweede en derde lid van de wet op de uitoefening van de
    diergeneeskunde 1990, de artikelen 3 en 5 van het Besluit verdachte dieren, de artikelen 3 en 3a van het Besluit
    bescherming tegen bepaalde zoönosen en besmettelijke dierziekten, de artikelen 2 en 3 van het Besluit gebruik sera
    en entstoffen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze regeling wordt verstaan onder:

      a. wet: [Gezondheids- en welzijnswet voor dieren][ref1];

      b. minister: Minister van Economische Zaken;

      c. NVWA: Nederlandse Voedsel- en Warenautoriteit;

      d. evenhoevigen: varkens, runderen, schapen, geiten of herten;

      e.

      f.

      g. vetweiderijbedrijf: bedrijf waar uitsluitend runderen worden gehouden die zijn bestemd om rechtstreeks te worden
      afgevoerd naar een slachthuis;

      h. weiderunderen: vrouwelijke runderen, ouder dan 12 maanden, die kennelijk zijn bestemd om te worden afgevoerd
      naar een vetweiderijbedrijf;

      i.

      j.

      k. lidstaat: lidstaat van de Europese Unie, niet zijnde Nederland;

      l. derde land: land, niet zijnde Nederland en niet zijnde een lidstaat;

      m.

      n. vervoermiddel: voertuig, waaronder mede begrepen een combinatie van een voertuig met één of meer door dat
      voertuig voortbewogen aanhangwagens, opleggers of containers;

      o. vervoerseenheid: voertuig dat of aanhangwagen, oplegger of container die deel uitmaakt of kan uitmaken van een
      combinatie als bedoeld in onderdeel n;

      p. vervoeren van een vervoermiddel: het voortbewegen of doen voortbewegen van een vervoermiddel;

      q. varkensverzamelcentrum: plaats in Nederland ten behoeve van de verzameling van varkens;

      r. runderverzamelcentrum: plaats in Nederland ten behoeve van de verzameling van runderen;

      s. schapenverzamelcentrum: plaats in Nederland ten behoeve van de verzameling van schapen;

      t. geitenverzamelcentrum: plaats in Nederland ten behoeve van de verzameling van geiten;

      u. epidemiologische eenheid: fysiek volledig afgescheiden stalruimte op een runderverzamelcentrum voor de
      huisvesting van een afzonderlijk beslag zodat geen contact met de overige op het verzamelcentrum aanwezige beslagen
      mogelijk is en die alleen via een eigen hygiënesluis te betreden is. Ingeval er meerdere epidemiologische eenheden
      op een runderverzamelcentrum zijn ondergebracht is elke epidemiologische eenheid ook fysiek volledig van de overige
      epidemiologische eenheden afgescheiden;

      v. beslag: op een bedrijf als een afzonderlijke epidemiologische eenheid gehouden varkens of groep varkens
      onderscheidenlijk rund of groep runderen met eenzelfde gezondheidsstatus;

      w. eerste verzameling: eerste aanvoer van varkens, runderen, schapen, of geiten op onderscheidenlijk een
      varkensverzamelcentrum, een runderverzamelcentrum, een schapenverzamelcentrum of een geitenverzamelcentrum, nadat
      dit is ontvolkt, gereinigd en ontsmet. Ingeval op een runderverzamelcentrum met meer dan een epidemiologische
      eenheden fokrunderen worden aangevoerd: eerste aanvoer van fokrunderen op een epidemiologische eenheid nadat deze
      is ontvolkt, gereinigd en ontsmet;

      x. fokrunderen: runderen, ouder dan 2 maanden en jonger dan 50 maanden, die kennelijk zijn bestemd voor de fokkerij
      in een land, niet zijnde Nederland;

      y. blokperiode: tijdseenheid, die begint vanaf het tijdstip van eerste verzameling, van:

      1. ten hoogste 120 uur op een schapen- en geitenverzamelcentrum;

      2. ten hoogste 144 uur op een runderverzamelcentrum, ingeval de runderen die worden verzameld fokrunderen zijn die
      zijn bestemd voor de afvoer naar een lidstaat;

      3. ten hoogste 30 dagen op een runderverzamelcentrum, in geval de runderen die worden verzameld fokrunderen zijn
      die zijn bestemd voor de afvoer naar een derde land;

      4. ten hoogste 48 uur op een varkensverzamelcentrum, in geval de varkens die worden verzameld slachtvarkens zijn;

      5. ten hoogste 24 uur op een:

        - varkensverzamelcentrum, in geval de varkens die worden verzameld geen slachtvarkens zijn,
        - runderverzamelcentrum, ingeval de runderen die worden verzameld geen fokrunderen zijn.

      z. slachtvarkens: varkens die kennelijk zijn bestemd voor de slacht;

      aa. slachtrunderen: runderen die kennelijk zijn bestemd voor de slacht;

      ab. slachtschapen: schapen die kennelijk zijn bestemd voor de slacht;

      ac. slachtgeiten: geiten die kennelijk zijn bestemd voor de slacht;

      ad.

      ae.

      af.

      ag.

      ah.

      ai.

      aj.

      ak. mesterij: bedrijf of onderdeel van een bedrijf waar runderen, jonger dan 12 maanden, worden gehouden die zijn
      bestemd om te worden afgevoerd naar een slachthuis;

      al.

      am. reinigings- en ontsmettingsplaats voor vervoermiddelen: geheel aan installaties en voorzieningen nodig voor het
      reinigen en ontsmetten van vervoermiddelen;

      an. geringe capaciteit: het aantal behandelde grootvee-eenheden bedraagt per week ten hoogste 30 en per jaar ten
      hoogste 1.500, waarbij het aantal grootvee-eenheden als volgt wordt berekend:

      1°. runderen en gedomesticeerde wilde soortgenoten:

        - volwassen runderen: 1;
        - andere runderen alsmede gedomesticeerde edelherten: 0,5;

      2°. andere diersoorten en gedomesticeerde soortgenoten:

        - een schaap, een geit of een gedomesticeerd damhert: 0,10;
        - een lam, een jonge geit, een big, van minder dan 15 kg levend gewicht: 0,05;

      ao. geaccrediteerde keuringsinstantie: keuringsinstantie, ten aanzien waarvan:

      1°. door de Nederlandse Raad voor Accreditatie of een gelijkwaardige buitenlandse instantie is verklaard
      dat de keuringsinstantie voldoet aan de criteria van EN 45004 en ISO 17020 en de relevante criteria
      van ISO 9001/9002, voorzover deze verklaring betrekking heeft op het bedrijfsrapport, bedoeld in
      [artikel 79, tweede lid, onderdeel m][ref2].

      2°. door de Nederlandse Raad voor Accreditatie of een gelijkwaardige buitenlandse instantie is verklaard dat de
      keuringsinstantie voldoet aan de criteria van EN 45004 en ISO 17020 en de relevante criteria van ISO 9001/9002,
      voorzover deze verklaring betrekking heeft op verrichtingen in de veehouderij, en de keuringsinstantie aan de
      Nederlandse Raad voor Accreditatie of een gelijkwaardige buitenlandse instantie heeft verzocht te verklaren
      dat de keuringsinstantie aan genoemde criteria voldoet met betrekking tot het bedrijfsrapport, bedoeld in
      [artikel 79, tweede lid, onderdeel m][ref3].

      ap. UBN: UBN als bedoeld in de [Regeling identificatie en registratie van dieren][ref4];

      aq. AI-gevoelige dieren: gehouden dieren van een soort behorende tot de orde van de hoenderachtigen
      (*Galliformes*), tot de familie van de eenden, ganzen en zwanen (*Anatidae*), tot de families van de struisvogels
      (*Struthionidae*), emoes (*Dromaiidae*) en nandoes (*Rheidae*) en voor consumptie gehouden duiven (*Columba
      Livia*);

      ar. pluimveebedrijf: inrichting die wordt gebruikt voor het anders dan voor recreatieve of educatieve doeleinden
      fokken, opfokken of houden van fokdieren, vleesdieren of legdieren;

      as. koppel: groep dieren met dezelfde gezondheids- en immuniteitsstatus en van dezelfde leeftijd, die in eenzelfde
      lokaal of een zelfde uitloopruimte wordt opgefokt of gehouden en die een epizoötiologische eenheid vormen;

      at. eendagskuikens: dieren die nog geen 72 uur oud zijn en die nog niet zijn gevoerd;

      au. vleeskuikens: kippen van 72 uur en ouder die worden opgefokt of worden gehouden voor de productie van vlees;

      av. vleeskalkoenen: kalkoenen van 72 uur en ouder die worden opgefokt of worden gehouden voor de productie van
      vlees;

      aw. leghennen: dieren bestemd voor productie van consumptie-eieren;

      ax. vermeerderingsdieren: vogels bestemd voor productie van broedeieren;

      ay. keuringsdierenarts: bevoegde, door de NVWA met werkzaamheden belaste dierenarts;

      az. assistent: door de NVWA met werkzaamheden belaste persoon, niet zijnde een dierenarts;

      ba. [verordening (EG) nr. 2160/2003](32003R2160): [verordening (EG) nr. 2160/2003](32003R2160) van het Europees
      Parlement en de Raad van de Europese Unie van 17 november 2003 inzake de bestrijding van salmonella en andere
      specifieke door voedsel overgedragen zoönoseverwekkers (PbEG L 325);

      bb. [verordening (EG) nr. 178/2002](32002R0178): [verordening (EG) nr. 178/2002](32002R0178) van het Europees
      Parlement en de Raad van de Europese Unie van 28 januari 2002 tot vaststelling van de algemene beginselen en
      voorschriften van de levensmiddelenwetgeving, tot oprichting van een Europese Autoriteit voor voedselveiligheid en
      tot vaststelling van procedures voor voedselveiligheidsaangelegenheden (PbEG L 31);

      bc. *verordening (EG) nr. 1069/2009:* verordening (EG) nr. 1069/2009 van het Europese Parlement en de Raad van
      21 oktober 2009 tot vaststelling van gezondheidsvoorschriften inzake niet voor menselijke consumptie bestemde
      dierlijke bijproducten en afgeleide producten en tot intrekking van Verordening (EG) nr. 1774/2002 (PbEU L 300);

      bd. [verordening nr. (EG) 1760/2000](32000R1760): [verordening (EG) nr. 1760/2000](32000R1760) van het
      Europees Parlement en de Raad van de Europese Unie van 17 juli 2000 tot vaststelling van een identificatie- en
      registratieregeling voor runderen en inzake de etikettering van rundvlees en rundvleesproducten en tot intrekking
      van [Verordening (EG) nr. 820/97](31997R0820) van de Raad van de Europese Unie (PbEG L 204);

      be. [richtlijn nr. 2003/99/EG](32003L0099): [richtlijn nr. 2003/99/EG](32003L0099) van het Europees Parlement en
      de Raad van de Europese Unie van 17 november 2003 inzake de bewaking van zoönoses en zoönoseverwekkers en houdende
      wijziging van Beschikking 90/424/EEG van de Raad van de Europese Unie en intrekking van [richtlijn nr. 92/117/EEG]
      (31992L0117) van de Raad van de Europese Unie (PbEG L 325);

      bf. [richtlijn nr. 92/65/EEG](31992L0065): [richtlijn nr. 92/65/EEG](31992L0065) van de Raad van de Europese
      Gemeenschappen van 13 juli 1992 tot vaststelling van de veterinairrechtelijke voorschriften voor het
      handelsverkeer en de invoer in de Gemeenschap van dieren, sperma, eicellen en embryo’s waarvoor ten aanzien van de
      veterinairrechtelijke voorschriften geen specifieke communautaire regelgeving als bedoeld in bijlage A, onder I,
      van [richtlijn nr. 90/425/EEG](31990L0425) geldt (PbEG L 268);

      bg. [richtlijn nr. 92/66/EEG](31992L0066): [richtlijn nr. 92/66/EEG](31992L0066) van de Raad van de Europese
      Gemeenschappen van 14 juli 1992 tot vaststelling van communautaire maatregelen voor de bestrijding van de ziekte
      van Newcastle (PbEG L 260);

      bh. verordening (EG) nr. 599/2004: verordening (EG) nr. 599/2004 van de Commissie van de Europese Gemeenschappen
      van 30 maart 2004 tot vaststelling van een geharmoniseerd model voor een certificaat en inspectieverslag voor het
      intracommunautaire handelsverkeer in dieren en producten van dierlijke oorsprong (Pb L EU 94);

      bi. [richtlijn nr. 92/117/EEG](31992L0117): [richtlijn nr. 92/117/EEG](31992L0117) van de Raad van de Europese
      Gemeenschappen van 17 december 1992 inzake maatregelen voor de bescherming tegen bepaalde zoönoses en bepaalde
      zoönoseverwekkers bij dieren en in producten van dierlijke oorsprong teneinde door voedsel overgedragen infecties
      en vergiftigingen te voorkomen (PbEG 1993 L 62);

      bj. [verordening (EG) nr. 854/2004](32004R0854): [Verordening (EG) nr. 854/2004](32004R0854) van het Europees
      Parlement en de Raad van 29 april 2004 houdende vaststelling van specifieke voorschriften voor de organisatie van
      de officiële controles van voor menselijke consumptie bestemde producten van dierlijke oorsprong;

      bk. [richtlijn nr. 91/68/EEG](31991L0068): [richtlijn nr. 91/68/EEG](31991L0068) van de Raad van de Europese
      Gemeenschappen van 28 januari 1991 inzake veterinairrechtelijke voorschriften voor het intracommunautaire
      handelsverkeer in schapen en geiten (PbEG L 46);

      bl.

      bm. [richtlijn nr. 64/432/EEG](31964L0432): [richtlijn nr. 64/432/EEG](31964L0432) van de Raad van de Europese
      Gemeenschappen van 26 juni 1964 inzake veterinairrechtelijke vraagstukken op het gebied van het intracommunautaire
      handelsverkeer in runderen en varkens (PbEG L 121);

      bn. verordening (EG) nr. 999/2001: verordening (EG) nr. 999/2001 van het Europees Parlement en de Raad van de
      Europese Unie van 22 mei 2001 houdende vaststelling van voorschriften inzake preventie, bestrijding en uitroeiing
      van bepaalde overdraagbare spongiforme encefalopathieën (PbEU L 147);

      bo. verordening (EG) nr. 1/2005: verordening (EG) nr. 1/2005 van de Raad van de Europese Unie van 22 december 2004
      inzake de bescherming van dieren tijdens het vervoer en daarmee samenhangende activiteiten en tot wijziging van de
      Richtlijnen 64/432/EEG en 93/119/EG en van Verordening (EG) nr. 1255/97 (PbEU L 3);

      bp. richtlijn nr. 2006/88/EG: richtlijn nr. 2006/88/EG van de Raad van de Europese Gemeenschappen van 24 oktober
      2006, betreffende veterinairrechtelijke voorschriften voor aquacultuurdieren en de producten daarvan en betreffende
      de preventie en bestrijding van bepaalde ziekten bij waterdieren (PbEG L 328);

      bq. waterdier: waterdier als bedoeld in artikel 3, eerste lid, onderdeel e, van richtlijn nr. 2006/88/EG, met
      uitzondering van de waterdieren, bedoeld in artikel 2, eerste lid, van richtlijn nr. 2006/88/EG;

      br. kwekerij: kwekerij als bedoeld in artikel 3, eerste lid, onderdeel h, van richtlijn nr. 2006/88/EG;

      bs. kweekgebied van weekdieren: kweekgebied van weekdieren als bedoeld in artikel 3, eerste lid, onderdeel j, van
      richtlijn nr. 2006/88/EG;

      bt. waterdier voor sierdoeleinden: waterdier voor sierdoeleinden als bedoeld in artikel 3, eerste lid, onderdeel k,
      van richtlijn nr. 2006/88/EG;

      bu. compartiment: compartiment als bedoeld in bijlage I, onderdeel a, van richtlijn nr. 2006/88/EG;

      bv. gevoelige soort: gevoelige soort als bedoeld in bijlage I, onderdeel n, van richtlijn nr. 2006/88/EG;

      bw. gebied: gebied als bedoeld in bijlage I, onderdeel p, van richtlijn nr. 2006/88/EG;

      bx. verordening (EG) nr. 616/2009: verordening (EG) nr. 616/2009 van de Commissie van de Europese Gemeenschappen
      van 13 juli 2009 houdende uitvoeringsbepalingen van Richtlijn 2005/94/EG wat betreft de goedkeuring van
      compartimenten voor pluimvee en compartimenten voor andere in gevangenschap levende vogels ten aanzien van aviaire
      influenza en aanvullende voorzorgsmaatregelen op het gebied van de bioveiligheid in dergelijke compartimenten (PbEU
      L 181);

      by. *verordening (EG) nr. 175/2010:* verordening (EG) nr. 175/2010 van de Commissie van de Europese Gemeenschappen
      van 2 maart 2010 ter uitvoering van Richtlijn 2006/88/EG van de Raad wat betreft maatregelen ter bestrijding van
      de verhoogde mortaliteit bij oesters van de soort Crassostrea gigas in samenhang met de detectie van het Ostreid
      herpesvirus 1 µvar (OsHV-1 µvar);

      bz. Verordening (EU) nr. 576/2013: Verordening (EU) nr. 576/2013 van het Europees Parlement en de Raad van 12 juni
      2013 betreffende het niet-commerciële verkeer van gezelschapsdieren en tot intrekking van Verordening (EG) nr.
      998/2003 (PbEU L 178);

      ca. richtlijn 2005/94/EG: richtlijn 2005/94/EG van de Raad van 20 december 2005 betreffende communautaire
      maatregelen ter bestrijding van aviaire influenza en tot intrekking van Richtlijn 92/40/EG, bijlage I (PbEU 2006,
      L10);

      cb. verordening (EG) nr. 589/2008: verordening (EG) nr. 589/2008 van de Commissie van 23 juni 2008 tot vaststelling
      van bepalingen ter uitvoering van Verordening (EG) nr. 1234/2007 van de Raad, wat betreft de handelsnormen voor
      eieren (PbEU 2008, L 163);

      cc. beschikking 93/152/EEG: beschikking 93/152/EEG van de Commissie van 8 februari 1993 houdende vaststelling van
      de eisen waaraan in het kader van de programma's inzake routinevaccinatie tegen Newcastle disease te gebruiken
      vaccins moeten voldoen (PbEG 1993, L 59);

      cd. ronde: periode waarbinnen vogels vanaf het uitkomen of aanvoeren op een bedrijf worden opgefokt of gehouden tot
      het moment waarop zij slachtrijp zijn;

      ce. vleeseenden: eenden van 72 uur en ouder die worden opgefokt of gehouden voor de productie van vlees;

      cf. kippen: dieren van de soort Gallus gallus;

      cg. kalkoenen: dieren van de soort Meleagris gallopavo;

      ch. eenden: dieren van de soort Anas platyrhynchos;

      ci. ganzen: dieren van de familie anseridae;

      cj. kwartels: dieren van het geslacht Cortunix;

      ck. parelhoenders: dieren van het geslacht Numididae;

      cl. loopvogels: dieren van de orde Struthioniformes;

      cm. dierenarts: dierenarts als bedoeld in [artikel 1.1, eerste lid, van de Wet dieren][ref5];

      cn. dierenartsassistent paraveterinair: dierenartsassistent paraveterinair als bedoeld in
      [artikel 3.1, eerste lid, van het Besluit diergeneeskundigen][ref6];

      co. grootouderdier: vermeerderingsdier dat wordt gehouden voor de productie van andere vermeerderingsdieren;

      cp. richtlijn 92/119/EEG: richtlijn nr. 92/119/EEG van de Raad van de Europese Gemeenschappen van 17 december
      1992 tot vaststelling van algemene communautaire maatregelen voor de bestrijding van bepaalde dierziekten en van
      specifieke maatregelen ten aanzien van de vesculaire varkensziekte (PbEG 1993, L 62);

      cq. hygiënesluis: ruimte die zodanig gesitueerd is dat zij gepasseerd moet worden voordat een epidemioligische
      eenheid op een runderverzamelcentrum betreden kan worden.

      2 Voor de toepassing van [artikel 13][ref7] wordt onder abortus verstaan: het spontaan meer dan 21 dagen eerder
      dan de gemiddelde draagtijd van het desbetreffende runderras ter wereld brengen van een vrucht of vruchten door een
      rund, ingeval de dracht meer dan 100 dagen heeft geduurd.

      3 Voor de toepassing van titel 2, hoofdstuk 1, paragraaf 7, wordt verstaan onder werkzaamheden: controle als
      bedoeld in [artikel 18, tweede lid, van de wet][ref8].


