    text: |-
      1 De houder bewaart de uitslag van het onderzoek, bedoeld in [artikel 82b, eerste lid][ref1], en de gegevens,
      bedoeld in het derde lid van dat artikel, gedurende twee jaar.

      2 De houder registreert de uitslag, bedoeld in het eerste lid, bij de minister.


