  - number: '26'
    text: |-
      1 Erkenning van een reinigings- en ontsmettingsplaats door de minister vindt plaats, indien:

      a. de plaats zodanig is ingericht en wordt geëxploiteerd dat een deugdelijke en efficiënte reiniging en ontsmetting
      van vervoermiddelen kan plaatsvinden ongeacht het type vervoermiddel en onder alle klimatologische omstandigheden.
      De reiniging en ontsmetting wordt zodanig uitgevoerd dat de bioveiligheid niet in gevaar komt.

      2 De wijze van exploitatie en van reiniging en ontsmetting wordt vastgelegd in een protocol dat moet worden
      goedgekeurd door de minister.

      3 Een reinigings- en ontsmettingsplaats die onderdeel uitmaakt van een ingevolge
      [artikel 21, eerste of vierde lid][ref1], erkende verzamelplaats, wordt beschouwd als een ingevolge het eerste lid
      erkende reinigings- en ontsmettingsplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel21
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel26
    references:
      - id: ref1
