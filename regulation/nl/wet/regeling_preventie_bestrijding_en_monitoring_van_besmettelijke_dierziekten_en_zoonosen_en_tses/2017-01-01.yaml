  - number: 40c
    text: |-
      1 In afwijking van artikel 40a is het vervoer naar een A-bedrijf toegestaan van vrouwelijke varkens afkomstig
      van ten hoogste één ander A-bedrijf, C-bedrijf, E-bedrijf, of één varkenshouderijbedrijf buiten Nederland en van
      mannelijke varkens afkomstig van ten hoogste één ander A-bedrijf, C-bedrijf, E-bedrijf, varkensspermawincentrum of
      één varkenshouderijbedrijf buiten Nederland en van biggen afkomstig van het E-bedrijf waaraan het betreffende A-
      bedrijf heeft geleverd, voor zover:

      a. ten minste vijf weken voorafgaand aan de week van aanvoer geen varkens op het betreffende A-bedrijf zijn
      aangevoerd;

      b. varkens na aanvoer in een toevoegstal van het betreffende A-bedrijf zijn gehouden totdat uit het serologisch
      onderzoek van monsters, die overeenkomstig de procedure van bijlage II door een dierenarts zijn genomen, blijkt dat
      in het bloed van de aangevoerde varkens geen antilichamen tegen klassieke varkenspest en gB-antilichamen tegen de
      ziekte van Aujeszky zijn aangetroffen, of

      c. binnen zes weken na aanvoer geen varkens worden afgevoerd anders dan rechtstreeks naar een slachthuis dan wel
      via een verzamelcentrum indien er geen toevoegstal op het betreffende A-bedrijf aanwezig is of als geen gebruik is
      gemaakt van de toevoegstal van het betreffende A-bedrijf

      2 Een A-bedrijf kan eenmaal per twaalf maanden wijzigen van bedrijf als leverancier voor zowel zijn vrouwelijke
      als mannelijke varkens als bedoeld in het eerste lid. Een wijziging wordt voorafgaand aan de toepassing van de
      wijziging aan de minister gemeld met gebruikmaking van een middel dat daartoe door de minister beschikbaar is
      gesteld.
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel40c
  - number: 40d
    text: |-
      In afwijking van [artikel 40a][ref1] is het vervoer van één of meer varkens vanaf een A-bedrijf toegestaan naar:

      a. één of meer A-bedrijven, B-bedrijven of D-bedrijven;

      b. één C-bedrijf of cluster of

      c. één E-bedrijf, waarbij het A-bedrijf niet meer naar een bedrijf als bedoeld in onderdeel a of b mag afvoeren.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel40a
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel40d
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 40a
        hoofdstuk: '4'
        paragraaf: 4.3.1
  - number: 40e
    text: |-
      1 In afwijking van [artikel 40a][ref1] is het vervoer naar een B-bedrijf toegestaan van vrouwelijke varkens
      afkomstig van ten hoogste één A-bedrijf, C-bedrijf, E-bedrijf of één varkenshouderijbedrijf buiten Nederland en
      van mannelijke varkens afkomstig van ten hoogste één A-bedrijf, C-bedrijf, E-bedrijf, varkensspermawincentrum of
      één varkenshouderijbedrijf buiten Nederland en van biggen afkomstig van het F-bedrijf waaraan het betreffende B-
      bedrijf heeft geleverd, voor zover ten minste vijf weken voorafgaand aan de week van aanvoer geen varkens op het
      betreffende B-bedrijf zijn aangevoerd.

      2 Een B-bedrijf kan eenmaal per twaalf maanden wijzigen van bedrijf als leverancier voor zowel zijn vrouwelijke
      als mannelijke varkens als bedoeld in het eerste lid. Een wijziging wordt voorafgaand aan de toepassing van de
      wijziging aan de minister gemeld met gebruikmaking van een middel dat daartoe door de minister beschikbaar is
      gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel40a
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel40e
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 40a
        hoofdstuk: '4'
        paragraaf: 4.3.1
  - number: 40f
    text: |-
      In afwijking van [artikel 40a][ref1] is het vervoer van één of meer varkens vanaf een B-bedrijf toegestaan naar:

      a. een D-bedrijf, voor zover in een periode van zes weken slechts varkens worden afgevoerd naar ten hoogste zes D-
      bedrijven en in een periode van zestien weken slechts varkens worden afgevoerd naar ten hoogste twaalf D-bedrijven;

      b. één F-bedrijf, waarbij niet meer naar een ander varkenshouderijbedrijf binnen Nederland kan worden afgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel40a
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel40f
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 40a
        hoofdstuk: '4'
        paragraaf: 4.3.1
  - number: 40g
    text: |-
      In afwijking van [artikel 40a][ref1] is het vervoer van één of meer varkens naar een C-bedrijf toegestaan, voor
      zover afkomstig van ten hoogste één A-bedrijf, E-bedrijf of varkenshouderijbedrijf buiten Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel40a
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel40g
    references:
      - id: ref1
