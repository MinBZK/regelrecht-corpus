  - number: '28'
    text: |-
      1 De eigenaar of exploitant van een ingevolge [artikel 26][ref1] erkende reinigings- en ontsmettingsplaats:

      a. draagt er zorg voor dat de exploitatie en de reiniging en ontsmetting van de vervoermiddelen geschiedt
      overeenkomstig het door de minister goedgekeurde protocol;

      b. draagt er zorg voor dat elke reiniging en ontsmetting plaatsvindt onder zijn toezicht of onder toezicht van een
      vertegenwoordiger van de eigenaar of exploitant;

      c. voorziet het register van de vervoerder, bedoeld in [artikel 32][ref2], van een stempel en handtekening. Indien
      de reiniging en ontsmetting onder toezicht van een vertegenwoordiger wordt uitgevoerd als bedoeld in onderdeel b,
      voorziet deze het register van een stempel en een handtekening.

      2 De eigenaar of exploitant van een reinigings- en ontsmettingsplaats die is erkend ingevolge
      [artikel 26, eerste lid][ref3], houdt een register bij waarin ten aanzien van elke reiniging en ontsmetting van een
      vervoermiddel wordt vermeld:

      a. de datum en het tijdstip waarop de reiniging en ontsmetting heeft plaatsgevonden;

      b. het kenteken van het desbetreffende vervoermiddel en bij gebreke daarvan de naam, het adres en de woonplaats van
      de vervoerder.

      3 De eigenaar of exploitant van een reinigings- en ontsmettingsplaats bewaart de gegevens die zijn opgenomen in het
      register, bedoeld in het tweede lid, gedurende drie jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0018397#Artikel26
