    text: |-
      1 De beheerder van een aangewezen databank:

      a. verwerkt de gegevens, bedoeld in [artikel 98h, eerste en tweede lid][ref1];

      b. verstrekt de houder, bedoeld in dat artikel, digitaal of schriftelijk bewijs van de registratie of de wijziging
      daarvan, en

      c. verstrekt de minister dagelijks een overzicht van de gegevens, bedoeld in
      [artikel 98h, eerste, tweede en derde lid][ref2], die in de databank zijn geregistreerd.

      2 De beheerder bewaart de gegevens, bedoeld in het eerste lid, onderdeel a, drie jaar, te rekenen vanaf de dag na
      de datum waarop de gegevens zijn geregistreerd.

      3 Op verzoek van de houder verstrekt de beheerder informatie aan de houder om hem zijn rechten
      te kunnen laten uitoefenen en de plichten na te leven als bedoeld in [hoofdstuk 5][ref3] en
      [6 van de Wet bescherming persoonsgegevens][ref4], waaronder in elk geval wordt verstaan dat hij de houder inzage
      geeft in de gegevens die met betrekking tot die houder en door hem gehouden dieren geregistreerd zijn.

      4 Indien de beheerder meent dat de gegevens van een houder correct zijn vastgelegd, maar de houder van een dier dit
      standpunt bestrijdt, registreert de beheerder dat de houder zijn gegevens als niet correct beschouwt.

      5 De beheerder van een databank die vanwege een onvoorziene situatie niet kan voldoen aan dit artikel of
      [artikel 15c][ref5] stelt de minister daarvan onverwijld op de hoogte.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel98h
