  - number: '38'
    text: |-
      1 Op een verzamelcentrum worden niet tegelijkertijd verschillende diersoorten, diercategorieën of evenhoevigen met
      een verschillende gezondheidsstatus bijeen gebracht.

      2 Het eerste lid is niet van toepassing op slachtschapen en slachtgeiten met dezelfde gezondheidsstatus.

      3 Het eerste lid is niet van toepassing op het tegelijkertijd bijeenbrengen op een runderverzamelcentrum van
      fokrunderen met een verschillende gezondheidsstatus, mits de fokrunderen met een verschillende gezondheidsstatus in
      afzonderlijke epidemiologische eenheden afgescheiden van elkaar worden gehouden.

      4 Het eerste lid is niet van toepassing op het tegelijkertijd bijeenbrengen op een runderverzamelcentrum van
      fokrunderen met een verschillende gezondheidsstatus en runderen, jonger dan 12 weken, mits de fokrunderen met
      een verschillende gezondheidsstatus en de runderen, jonger dan 12 weken, in afzonderlijke epidemiologische
      eenheden afgescheiden van elkaar worden gehouden en er gedurende de blokperiode van de laatstgenoemde dieren geen
      fokrunderen worden aan- of afgevoerd.

      5 Het eerste lid is niet van toepassing op het tegelijkertijd bijeenbrengen van runderen, schapen en geiten op een
      tentoonstelling of een keuring, mits deze zodanig is ingericht dat de verschillende diersoorten niet met elkaar in
      contact kunnen komen.
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel38
  - number: '39'
    text: |-
      1 Indien evenhoevigen bijeen worden gebracht op een slachthuis, worden de evenhoevigen niet van het slachthuis
      afgevoerd.

      2 Het eerste lid is niet van toepassing indien een besluit is genomen als bedoeld in bijlage I, sectie II,
      Hoofdstuk III, onderdeel 8, van verordening (EG) nr. 854/2004.
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel39
  - number: '40'
    text: |-
      1 Indien evenhoevigen, met uitzondering van varkens, bijeen worden gebracht op een bedrijf of plaats als bedoeld
      in [artikel 37, eerste lid, onder c][ref1], of daar worden gelost vanaf een vervoerseenheid of een vervoermiddel,
      bedoeld in artikel 37, eerste lid, onderdeel a, verblijven die evenhoevigen ten minste 21 dagen op dat bedrijf of
      die plaats alvorens zij worden afgevoerd.

      2 Het eerste lid is niet van toepassing op evenhoevigen die na afloop van een tentoonstelling of keuring worden
      aangevoerd op een bedrijf of plaats en weer van dat bedrijf of die plaats worden afgevoerd ten behoeve van een
      tentoonstelling of keuring.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel37
