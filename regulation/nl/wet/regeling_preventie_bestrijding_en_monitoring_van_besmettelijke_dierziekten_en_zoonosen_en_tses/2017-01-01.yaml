    text: |-
      Als besmettelijke dierziekten als bedoeld in [artikel 15 van de wet][ref1] bij andere vogels dan pluimvee worden
      aangewezen:

      a. psittacose;

      b. pseudo-vogelpest (Newcastle Disease);

      c. vogelpest (Aviaire Influenza).


