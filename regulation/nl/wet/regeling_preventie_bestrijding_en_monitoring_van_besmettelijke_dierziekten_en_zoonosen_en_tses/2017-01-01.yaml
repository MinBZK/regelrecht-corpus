  - number: '111'
    text: In gevallen waarin dit hoofdstuk niet voorziet, beslist de minister.
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel111
  - number: '112'
    text: |-
      Als personen of groepen van personen die toegang hebben tot gebouwen, terreinen of gedeelten van gebouwen of
      terreinen waar een kenteken als bedoeld in [artikel 22, eerste lid, van de wet][ref1] is geplaatst, worden
      aangewezen:

      a. de houder van de dieren die zich in de gebouwen, op de terreinen dan wel de gedeelten van gebouwen of terreinen
      bevinden;

      b. de ambtenaren van de NVWA;

      c. de dierenarts die de dieren behandelt;

      d. de medewerkers van de Gezondheidsdienst voor dieren.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel22
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '22'
  - number: '113'
    text: |-
      1 Personen die gebouwen of terreinen verlaten waar een kenteken als bedoeld in
      [artikel 22, eerste lid, van de wet][ref1] is geplaatst:

      a. reinigen hun handen en, voorzover de ambtenaar aangeeft dit noodzakelijk te achten, hun overige lichaamsdelen
      met warm water en zeep;

      b. laten hun bedrijfskleding en schoeisel achter en reinigen of vernietigen deze en

      c. ontsmetten hun handen, bedrijfskleding en schoeisel met het door de ambtenaar ter beschikking gestelde
      ontsmettingsmiddel.

      2 Indien de in het eerste lid bedoelde personen dieren met zich voeren, reinigen ze de hoeven, de klauwen en de
      huid van deze dieren zorgvuldig door borstelen en wassen. Voorzover de ambtenaar aangeeft dit noodzakelijk te
      achten worden de dieren vervolgens ontsmet met het door de ambtenaar ter beschikking gesteld ontsmettingsmiddel.

      3 Indien de in het eerste lid bedoelde personen voertuigen, producten of andere voorwerpen met zich voeren,
      reinigen zij deze zorgvuldig en ontsmetten zij deze vervolgens met het door de ambtenaar ter beschikking gestelde
      ontsmettingsmiddel.

      4 De in het eerste lid bedoelde personen nemen steeds de aanwijzingen van de ambtenaar in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel22
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel113
    references:
      - id: ref1
