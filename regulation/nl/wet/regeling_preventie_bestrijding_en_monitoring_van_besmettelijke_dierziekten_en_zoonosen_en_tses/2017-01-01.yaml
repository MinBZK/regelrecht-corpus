  - number: '95'
    text: |-
      1 In dit hoofdstuk wordt verstaan onder:

      a. *Verordening (EG) nr. 1190/2012:* verordening (EU) nr. 1190/2012 van de Commissie van 12 december 2012 tot
      vaststelling van een doelstelling van de Unie voor het terugdringen van Salmonella enteritidis en Salmonella
      typhimurium bij koppels kalkoenen, als vastgesteld in Verordening (EG) nr. 2160/2003 van het Europees Parlement en
      de Raad (PbEU 2012, L 340);

      b. *Verordening (EG) nr. 200/2012:* verordening (EU) nr. 200/2012 van de Commissie van 8 maart 2012 tot
      vaststelling van een doelstelling van de Unie voor het terugdringen van Salmonella enteritidis en Salmonella
      typhimurium bij koppels slachtkuikens, als vastgesteld in Verordening (EG) nr. 2160/2003 van het Europees Parlement
      en de Raad (PbEU 2012, L 71);

      c. *Verordening (EG) nr. 517/2011:* verordening (EU) nr. 517/2011 van de Commissie van 25 mei 2011 ter uitvoering
      van Verordening (EG) nr. 2160/2003 van het Europees Parlement en de Raad wat betreft een doelstelling van de Unie
      voor het verminderen van de prevalentie van bepaalde serotypes van salmonella bij legkippen van Gallus gallus en
      tot wijziging van Verordening (EG) nr. 2160/2003 en Verordening (EU) nr. 200/2010 van de Commissie (PbEU 2011,
      L 138);

      d. *Verordening (EG) nr. 200/2010:* verordening (EU) nr. 200/2010 van de Commissie van 10 maart 2010 ter uitvoering
      van Verordening (EG) nr. 2160/2003 van het Europees Parlement en de Raad wat betreft een doelstelling van de Unie
      voor het verminderen van de prevalentie van serotypen salmonella bij volwassen vermeerderingskoppels van Gallus
      gallus (PbEU 2010, L 61);

      e. *Verordening (EG) nr. 1177/2006:* verordening (EG) nr. 1177/2006 van de Commissie van 1 augustus 2006 ter
      uitvoering van Verordening (EG) nr. 2160/2003 van het Europees Parlement en de Raad wat betreft voorschriften voor
      het gebruik van specifieke bestrijdingsmethoden in het kader van de nationale programma’s voor de bestrijding van
      salmonella bij pluimvee (PbEU 2006, L 212).

      2 In dit hoofdstuk wordt onder Salmonella typhimurium mede verstaan: monofasische Salmonella typhimurium met de
      antigene formule 1, 4, [5], 12:i:-.
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel95
