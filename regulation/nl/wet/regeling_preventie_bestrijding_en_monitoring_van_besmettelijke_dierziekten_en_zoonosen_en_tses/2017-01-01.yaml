  - number: '53'
    text: |-
      1 Markten waarop pluimvee, loopvogels of postduiven worden verhandeld zijn verboden.

      2 Het tijdelijk verzamelen op één plaats van pluimvee, loopvogels of postduiven die afkomstig zijn van
      verschillende plaatsen en vervolgens naar verschillende plaatsen, niet zijnde slachterijen, worden afgevoerd, is
      verboden.

      3 Het organiseren van wedvluchten met postduiven is verboden.
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel53
  - number: '54'
    text: |-
      1 De verboden, bedoeld in [artikel 53, tweede en derde lid][ref1], zijn niet van toepassing op een keuring of
      tentoonstelling van sierpluimvee, loopvogels of postduiven of op een wedvlucht van postduiven indien wordt voldaan
      aan het tweede of derde lid.

      2 Op de tentoonstelling of keuring worden slechts pluimvee, loopvogels of postduiven toegelaten en tot de wedvlucht
      worden slechts postduiven toegelaten, die vergezeld gaan van een op hen betrekking hebbende, volledig ingevulde en
      ondertekende verklaring van enting tegen Newcastle Disease.

      3 Uit de in het tweede lid bedoelde verklaring, waarvan het model als [bijlage 6][ref2] en [bijlage 7][ref3] bij
      deze regeling is gevoegd, blijkt dat:

      a. de hoenderachtigen en loopvogels van de desbetreffende houder, voorzover de dieren ouder zijn dan 30 dagen,
      ten minste twee weken en ten hoogste vijf maanden voor het begin van de tentoonstelling of de keuring op de in
      [bijlage 6][ref4] omschreven wijze zijn geënt tegen Newcastle Disease;

      b. de postduiven van de betreffende houder ten minste twee weken voor het begin van de tentoonstelling, keuring of
      wedvlucht op de in [bijlage 7][ref5] omschreven wijze zijn geënt tegen Newcastle Disease overeenkomstig de bij de
      registratie van de entstof gegeven voorschriften betreffende het entschema en de dosering.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0018397
      [ref3]: https://wetten.overheid.nl/BWBR0018397
      [ref4]: https://wetten.overheid.nl/BWBR0018397
      [ref5]: https://wetten.overheid.nl/BWBR0018397
