    text: |-
      De houder bewaart de resultaten van het onderzoek, bedoeld in [artikel 94y, tweede lid][ref1], gedurende een
      periode van twee jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel94y
