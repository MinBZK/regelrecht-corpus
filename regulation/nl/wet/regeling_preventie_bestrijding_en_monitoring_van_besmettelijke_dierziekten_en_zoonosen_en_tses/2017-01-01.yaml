  - number: '25'
    text: |-
      1 Indien een verzamelcentrum niet of niet meer aan de eisen, bedoeld in
      [artikel 21, eerste tot en met vierde en zesde lid][ref1], voldoet, of niet aan de verplichtingen opgenomen in
      [artikel 23][ref2], respectievelijk [24][ref3] voldoet, kan de minister:

      a. nadere voorschriften verbinden aan de erkenning;

      b. de erkenning met onmiddellijke ingang schorsen of intrekken.

      2 De minister kan de nadere voorschriften intrekken of een schorsing beëindigen indien ten genoegen van de minister
      is aangetoond dat het verzamelcentrum volledig aan alle eisen voldoet.

      3 De minister kan bepalen dat aan een verzamelcentrum voor een bepaalde periode volgend op de intrekking van een
      erkenning, geen nieuwe erkenning wordt verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel21
