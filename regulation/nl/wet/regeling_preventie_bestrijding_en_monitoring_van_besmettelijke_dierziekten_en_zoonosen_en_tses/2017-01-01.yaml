  - number: '13'
    text: |-
      1 Aan de houder van een rund wordt ingeval een rund abortus ondergaat vrijstelling verleend van de verplichting tot
      kennisgeving van dit verschijnsel van brucellose, bedoeld in [artikel 19 van de wet][ref1], indien wordt voldaan
      aan het tweede en derde lid.

      2 De houder stuurt binnen 7 dagen na de abortus een door een dierenarts bij
      dat rund genomen bloedmonster aan een erkend laboratorium als bedoeld in
      [artikel 3 van de Regeling erkenning en aanwijzing veterinaire laboratoria][ref2], ten behoeve van overeenkomstig
      bijlage C bij [richtlijn nr. 64/432/EEG](31964L0432) uit te voeren serologisch onderzoek.

      3 Zodra de houder ervan op de hoogte is gesteld dat de abortus blijkens het in het tweede lid bedoelde onderzoek
      vermoedelijk aan brucellose te wijten is, geeft de houder terstond kennis van dit vermoeden aan de ambtenaar,
      bedoeld in [artikel 114, tweede lid, van de wet][ref3].

      4 Het eerste tot en met het derde lid zijn van overeenkomstige toepassing op de verplichting tot kennisgeving door
      de dierenarts, bedoeld in [artikel 100 van de wet][ref4], van brucellose bij een rund.


