    text: |-
      1 De instantie, bedoeld in [artikel 60, vierde lid][ref1], verstrekt maandelijks een overzicht van de uitgevoerde
      controles als bedoeld in [artikel 60, eerste lid][ref2], voor zover deze betrekking hebben op de eisen, bedoeld in
      [artikel 63][ref3], aan de minister.

      2 De rechtspersoon, bedoeld in [artikel 59, eerste lid][ref4], verstrekt maandelijks een overzicht van de opgelegde
      sancties, bedoeld in [artikel 61, eerste lid][ref5], voor zover deze betrekking hebben op de eisen, bedoeld in
      [artikel 63][ref6], waaronder de aanleiding en aard van de sanctie, aan de minister.

      3 Indien als gevolg van een beëindiging van de deelname aan een kwaliteitssysteem met wederzijds goedvinden
      een deelnemer niet langer deelneemt aan dat kwaliteitssysteem, maakt de rechtspersoon, bedoeld in
      [artikel 59, eerste lid][ref7], daarvan onverwijld melding aan de minister.

      4 Indien als gevolg van een sanctie als bedoeld in [artikel 61, eerste lid][ref8], een deelnemer is
      geschorst of uitgesloten van deelname aan een kwaliteitssysteem, maakt de rechtspersoon, bedoeld in
      [artikel 59, eerste lid][ref9], daarvan onverwijld melding aan de minister.

      5 Het kwaliteitssysteem dient te beschikken over een geautomatiseerd systeem waarmee de minister op ieder moment
      inzage kan hebben in de deelnemers aan de kwaliteitssysteem.

      6 De rechtspersoon, bedoeld in [artikel 59, eerste lid][ref10], geeft wijzigingen van de gegevens, bedoeld in
      [artikel 57, vierde lid][ref11], onverwijld door aan de minister.


