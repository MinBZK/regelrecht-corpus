  - number: 98k
    text: |-
      1 De producent van mengvoeders voor pluimvee bemonstert voedermiddelen bij de aanvoer per productielocatie, indien
      de jaarproductie van die locatie:

      a. ten hoogste 4.000 ton bedraagt: ten minste eenmaal per kwartaal;

      b. ten hoogste 8.000 ton bedraagt: ten minste tweemaal per kwartaal;

      c. ten hoogste 10.000 ton bedraagt: ten minste driemaal per kwartaal;

      d. ten hoogste 20.000 ton bedraagt: ten minste vijfmaal per kwartaal;

      e. ten hoogste 30.000 ton bedraagt: ten minste achtmaal per kwartaal;

      f. ten hoogste 40.000 ton bedraagt: ten minste tienmaal per kwartaal;

      g. meer dan 40.000 ton bedraagt: ten minste 13 maal per kwartaal.

      2 Een monster als bedoeld in het eerste lid weegt ten minste 60 gram.
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel98k
  - number: 98l
    text: |-
      1 De producent van mengvoeders voor pluimvee bemonstert van de af te leveren partijen mengvoer van 24 ton die
      bestemd zijn voor:

      a. vermeerderingsdieren die worden gehouden als grootouderdier of overgrootouderdier: ten minste 50%;

      b. kippen of kalkoenen die worden opgefokt tot andere vermeerderingsdieren dan bedoeld in onderdeel a: ten minste
      20%;

      c. kippen of kalkoenen die worden gehouden als vermeerderingsdier: ten minste 10%;

      d. vleeskuikens, leghennen en dieren die worden opgefokt tot leghen: ten minste 5%;

      e. vleeskalkoenen: ten minste 1 op de 30.

      2 De leverancier van voedermiddelen die aan pluimveehouderijen worden geleverd, bemonstert van de af te leveren
      partijen voedermiddelen van 24 ton ten minste 1 op de 30 partijen.

      3 De monsters, bedoeld in het eerste en tweede lid, worden genomen uit de productstroom.

      4 Onverminderd het eerste en tweede lid bemonstert de producent van mengvoeders en de leverancier van
      voedermiddelen voor pluimvee ten minste elke zes maanden op kritische punten in het productieproces of het
      logistieke proces, bedoeld in artikel 6 van verordening (EG) nr. 183/2005 van het Europees Parlement en de Raad van
      12 januari 2005 tot vaststelling van voorschriften voor diervoederhygiëne (PbEU 2005, L 35).

      5 Een monster als bedoeld in het eerste tot en met vierde lid weegt ten minste 60 gram.
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel98l
  - number: 98m
    text: |-
      1 De producent van mengvoeders die bestemd zijn voor ander vee dan pluimvee neemt uit de productstroom per
      productielocatie waarvan de jaarproductie:

      a. ten hoogste 4.000 ton bedraagt: ten minste twee monsters per kwartaal;

      b. ten hoogste 6.000 ton bedraagt: ten minste drie monsters per kwartaal;

      c. ten hoogste 8.000 ton bedraagt: ten minste vier monsters per kwartaal;

      d. ten hoogste 10.000 ton bedraagt: ten minste vijf monsters per kwartaal;

      e. ten hoogste 20.000 ton bedraagt: ten minste tien monsters per kwartaal;

      f. ten hoogste 30.000 ton bedraagt: ten minste 15 monsters per kwartaal;

      g. ten hoogste 40.000 ton bedraagt: ten minste 20 monsters per kwartaal;

      h. meer dan 40.000 ton bedraagt: ten minste 25 monsters per kwartaal.

      2 Ten minste 50% van de monsters, bedoeld in het eerste lid, worden genomen van mengvoeders.

      3 Een monster, bedoeld in het eerste lid, weegt ten minste 60 gram.
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel98m
  - number: 98n
    text: |-
      1 De producent en de leverancier van voedermiddelen die bestemd zijn voor ander vee dan pluimvee nemen per product
      per toeleverancier een monster van ten minste 60 gram per kwartaal.

      2 De producent en de leverancier kunnen ten aanzien van een partij voedermiddelen schriftelijk overeenkomen dat de
      bemonstering, bedoeld in het eerste lid, door de producent of de leverancier plaatsvindt.

      3 Bij seizoensgebonden of incidentele producten start de bemonstering, bedoeld in het eerste lid, bij de eerste
      lading.

      4 Het eerste lid is niet van toepassing, indien:

      a. de zuurtegraad van de voedermiddelen ten hoogste 4,5 pH bedraagt bij spontane melkzuurfermentatie;

      b. de zuurtegraad van de voedermiddelen ten hoogste 4 pH bedraagt, indien organische zuren zijn toegevoegd;

      c. de zuurtegraad van de voedermiddelen ten hoogste 3,5 pH bedraagt, indien anorganische zuren zijn toegevoegd, of

      d. de producent of de leverancier aantoont dat de zuurtegraad voldoende is om salmonella in de voedermiddelen te
      inactiveren.
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel98n
  - number: 98o
    text: |-
      1 De producent en de leverancier, bedoeld in deze paragraaf, laten de monsters onderzoeken in een laboratorium.

      2 De producent en de leverancier laten monsters waarbij, na onderzoek als bedoeld in het eerste lid, de
      aanwezigheid van Salmonella is geconstateerd nader onderzoeken op de volgende serotypes:

      a. Salmonella enteritidis;

      b. Salmonella typhimurium;

      c. Salmonella hadar;

      d. Salmonella infantis;

      e. Salmonella virchow, en

      f. Salmonella java.

      3 De serotypering van de monsters, bedoeld in het tweede lid, vindt plaats in een laboratorium als bedoeld in
      [artikel 2 van de Regeling erkenning en aanwijzing veterinaire laboratoria][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019575#Artikel2
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel98o
