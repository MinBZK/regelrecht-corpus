  - number: 94f
    text: |-
      Bij vermeerderingsdieren of dieren die worden opgefokt tot vermeerderingsdier wordt bloed afgenomen van ten minste
      30 dieren per stal op de volgende momenten:

      a. 70 dagen na het uitkomen, tenzij het koppel sinds het uitkomen met tussenpozen van ten hoogste zes weken door
      een dierenarts is gevaccineerd met een levende entstof en die vaccinaties door middel van een spray of aërosol
      zijn uitgevoerd;

      b. binnen zes weken nadat de vaccinatie, bedoeld in [artikel 94c, vierde lid][ref1], is uitgevoerd;

      c. in de periode van 40 tot 48 weken na het uitkomen, voor zover het dieren, anders dan kalkoenen betreft;

      d. in de periode van 50 tot 58 weken na het uitkomen, voor zover het kalkoenen betreft;

      e. in de periode van 70 tot 75 weken na het uitkomen;

      f. binnen 20 dagen voorafgaand aan een verplaatsing van een koppel naar een ander bedrijf waar bedrijfsmatig vogels
      worden gehouden, voor zover het koppel op de dag van verplaatsing 28 dagen of ouder is.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel94c
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel94f
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 94c
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 94g
    text: |-
      Bij leghennen of dieren die worden opgefokt tot leghen wordt bloed afgenomen van ten minste 30 dieren per stal op
      de volgende momenten:

      a. 70 dagen na het uitkomen, tenzij het koppel sinds het uitkomen met tussenpozen van ten hoogste zes weken door
      een dierenarts is gevaccineerd met een levende entstof en die vaccinaties door middel van een spray of aërosol
      zijn uitgevoerd;

      b. binnen zes weken nadat de vaccinatie, bedoeld in [artikel 94c, vierde lid][ref1], is uitgevoerd;

      c. in de periode van 90 tot 95 weken na het uitkomen;

      d. binnen 9 weken voordat het koppel wordt geslacht;

      e. binnen 20 dagen voorafgaand aan een verplaatsing van een koppel naar een ander bedrijf waar bedrijfsmatig vogels
      worden gehouden, voor zover het koppel op de dag van verplaatsing 28 dagen of ouder is.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel94c
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel94g
    references:
