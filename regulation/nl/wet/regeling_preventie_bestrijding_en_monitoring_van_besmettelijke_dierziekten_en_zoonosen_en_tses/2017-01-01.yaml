    text: |-
      1 Een verzamelcentrum dat is erkend ingevolge [artikel 21, vierde lid][ref1]:

      a. voldoet aan de eisen genoemd in artikel 8bis, eerste lid, onderdeel c en e, van richtlijn nr. 91/68/EEG;

      b. voldoet aan de artikelen 9 en 17 van verordening (EG) nr. 1/2005, de
      [artikelen 2.1, eerste, tweede en zesde lid][ref2] en [2.2, achtste lid, van de Wet dieren][ref3] en de
      [artikelen 1.6, eerste en derde lid][ref4], [2.3][ref5] en[ 2.4 van het Besluit houders van dieren][ref6];

      c. wordt geëxploiteerd conform het door de minister goedgekeurde protocol;

      d. verleent de toezichthouder de medewerking die nodig is voor de uitoefening van zijn taken;

      e. voldoet aan:

        - de [artikelen 36][ref7], [37][ref8], [38][ref9], [41][ref10] en [47][ref11];
        - de [artikelen 38b][ref12], [38d][ref13], [39][ref14] en
      [44c, vijfde lid, van de Regeling identificatie en registratie van dieren][ref15].

      2 De eigenaar of exploitant van een verzamelcentrum dat is erkend ingevolge [artikel 21, vierde lid][ref16], houdt
      een voor de toezichthouder toegankelijk register bij met daarin de gegevens, bedoeld in artikel 8bis, tweede lid,
      van richtlijn nr. 91/68/EEG, en de gegevens, bedoeld in [artikel 28, tweede lid][ref17].

      3 Het register, bedoeld in het tweede lid, wordt minimaal drie jaren bewaard.


