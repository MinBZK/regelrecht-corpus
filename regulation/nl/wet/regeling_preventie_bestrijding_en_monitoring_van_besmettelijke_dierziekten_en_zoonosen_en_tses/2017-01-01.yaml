  - number: 82d
    text: |-
      In deze paragraaf wordt verstaan onder:

        - *rund:* een rund ouder dan 24 maanden.
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel82d
  - number: 82e
    text: |-
      1 De eigenaar of exploitant van een slachthuis laat steekproefsgewijs aan de slachtlijn bloedmonsters nemen en
      staat deze af ten behoeve van de monitoring van endemische leukose bij runderen.

      2 Bloedmonsters worden van individuele runderen, ouder dan twee jaar, van niet-melk leverende bedrijven, genomen.

      3 Er worden geen monsters samengevoegd van verschillende runderen of bedrijven.

      4 Bloedmonsters worden onderzocht in een laboratorium dat daartoe is aangewezen in
      [artikel 20, tweede lid van de Regeling erkenning en aanwijzing veterinaire laboratoria][ref1].

      5 De eigenaar of exploitant van een slachthuis houdt een administratie bij van de bemonstering.


      [ref1]: https://wetten.overheid.nl/BWBR0019575#Artikel20
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel82e
    references:
      - id: ref1
        bwb_id: BWBR0019575
        artikel: '20'
  - number: 82f
    text: |-
      De houder van runderen staat toe dat steekproefsgewijs een monster van de tankmelk door een daartoe aangewezen
      laboratorium wordt onderzocht ten behoeve van de monitoring van endemische leukose bij runderen.
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel82f
