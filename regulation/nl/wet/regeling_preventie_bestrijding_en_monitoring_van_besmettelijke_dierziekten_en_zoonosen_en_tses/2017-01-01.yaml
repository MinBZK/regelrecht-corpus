  - number: '31'
    text: |-
      1 De vervoerder is verplicht een vervoermiddel of vervoerseenheid, met inbegrip van de daarbij behorende
      voorwerpen, waarmee een of meer evenhoevigen zijn vervoerd terstond na de lossing, in ieder geval voordat de
      vervoerseenheid of het vervoermiddel op de openbare weg wordt gebracht, op de plaats van lossing te reinigen en te
      ontsmetten met een toegelaten ontsmettingsmiddel op zodanige wijze dat de bioveiligheid niet in gevaar komt.

      2 Het eerste lid is niet van toepassing op het vervoer van evenhoevigen, niet zijnde varkens, die rechtstreeks van
      de stal of de weide naar een andere weide van hetzelfde bedrijf worden vervoerd met een vervoermiddel, voor zover
      het vervoermiddel zo spoedig mogelijk na dit vervoer wordt gereinigd en ontsmet.

      3 Het eerste lid is niet van toepassing op het vervoer van evenhoevigen, niet zijnde varkens, die rechtstreeks van
      een bedrijf naar een weide van ander bedrijf worden vervoerd met een vervoermiddel, voor zover het vervoermiddel zo
      spoedig mogelijk na dit vervoer wordt gereinigd en ontsmet.

      4 Het eerste lid is niet van toepassing op het vervoer van een vervoermiddel over de openbare weg vanaf een
      slachtplaats met geringe capaciteit, waarvan de eigenaar of exploitant beschikt over een vergunning als bedoeld in
      [artikel 18, zesde lid][ref1], indien het vervoermiddel direct na lossing op de slachtplaats rechtstreeks, langs
      de kortste weg naar de in de vergunning aangewezen reinings- en ontsmettingsplaats rijdt om aldaar gereinigd en
      ontsmet te worden.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel18
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel31
    references:
      - id: ref1
