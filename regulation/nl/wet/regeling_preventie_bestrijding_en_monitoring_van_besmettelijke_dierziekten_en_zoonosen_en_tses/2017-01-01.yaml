  - number: 29b
    text: |-
      1 De minister wijst op aanvraag een varkenshouderijbedrijf aan als een A-bedrijf, indien het bedrijf ten genoegen
      van de minister aantoont te voldoen aan de in het tweede lid gestelde voorwaarden.

      2 Een A-bedrijf voldoet aan de volgende voorwaarden:

      a. vrouwelijke varkens worden gehouden voor het produceren van biggen;

      b. indien het bedrijf beschikt over een toevoegstal, voldoen inrichting en gebruik aan de in [bijlage 24][ref1]
      opgenomen eisen;

      c. een dierenarts neemt eenmaal per maand monsters van de aanwezige varkens overeenkomstig de procedure
      van [bijlage 25][ref2] ten behoeve van serologisch onderzoek door een erkend laboratorium als bedoeld in
      [artikel 3 van de Regeling erkenning en aanwijzing veterinaire laboratoria][ref3] als het gaat om de ziekte van
      Aujeszky en door Wageningen Bioveterinary Research als het gaat om klassieke varkenspest;

      d. op het bedrijf is een douche aanwezig, die is gelegen in de onmiddellijke nabijheid van de ingang van het
      varkenshouderijbedrijf, waarvan bezoekers van het varkenshouderijbedrijf voorafgaand aan het betreden van de
      stallen gebruik maken;

      e. het bedrijf is voorzien van een erfafscheiding waardoor het betreden van het varkenshouderijbedrijf zonder de
      medewerking van de varkenshouder niet mogelijk is;

      f. op het bedrijf is een voorziening voor reiniging en ontsmetting van vervoermiddelen aanwezig.

      3 De varkenshouder stelt de uitslag van het serologisch onderzoek beschikbaar aan de minister waaruit moet blijken
      dat geen varkens zijn aangetroffen waarvan het bloed antilichamen tegen klassieke varkenspest of gB-antilichamen
      tegen de ziekte van Aujeszky bevat.


      [ref1]: https://wetten.overheid.nl/BWBR0018397
      [ref2]: https://wetten.overheid.nl/BWBR0018397
      [ref3]: https://wetten.overheid.nl/BWBR0019575#Artikel3
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel29b
    references:
      - id: ref1
        bwb_id: BWBR0018397
      - id: ref2
        bwb_id: BWBR0018397
      - id: ref3
        bwb_id: BWBR0019575
        artikel: '3'
  - number: 29c
    text: |-
      De minister wijst op aanvraag een varkenshouderijbedrijf aan als een B-bedrijf, indien op het
      varkenshouderijbedrijf vrouwelijke varkens worden gehouden voor het produceren van biggen.
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel29c
  - number: 29d
    text: |-
      De minister wijst op aanvraag een varkenshouderijbedrijf aan als een C-bedrijf, indien het bedrijf
      biggen opfokt tot geslachtsrijpe varkens en ten genoegen van de minister aantoont te voldoen aan de in
      [artikel 29b, tweede lid, onderdelen c tot en met f en derde lid][ref1], gestelde voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel29b
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel29d
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 29b
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 29e
    text: |-
      De minister wijst op aanvraag een varkenshouderijbedrijf aan als een E-bedrijf, indien het bedrijf speenbiggen
      houdt, uitsluitend afkomstig van één A-bedrijf waarmee een vaste relatie is aangegaan en het bedrijf ten genoegen
      aantoont te voldoen aan de in [artikel 29b, tweede lid, onderdelen c tot en met f en derde lid][ref1], gestelde
      voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel29b
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel29e
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 29b
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 29f
    text: |-
      De minister wijst op aanvraag een varkenshouderijbedrijf aan als een F-bedrijf, indien het bedrijf speenbiggen
      houdt, uitsluitend afkomstig van één B-bedrijf waarmee een vaste relatie is aangegaan.
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel29f
  - number: 29g
    text: |-
      De minister wijst op aanvraag een locatie waar varkens worden gehouden aan als een RE-bedrijf, indien op die
      locatie minder dan 5 varkens met hun biggen worden gehouden.
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel29g
  - number: 29h
    text: |-
      Een varkenshouderijbedrijf of een locatie waar minder dan 5 varkens worden gehouden waarvoor geen aanvraag voor een
      status bij de minister is ingediend, heeft de status D-bedrijf.
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel29h
  - number: 29ha
    text: |-
      1 Indien sprake is van een cluster wordt dit bij de aanvraag, bedoeld in [artikel 29b, eerste lid][ref1], of
      [artikel 29e][ref2], gemeld met gebruikmaking van een middel dat daartoe door de minister beschikbaar is gesteld,
      waarbij wordt opgegeven de samenstelling van het cluster en de verdeling van het aantal afvoeradressen onder de
      C-bedrijven.

      2 De samenstelling van een cluster en de verdeling van het aantal afvoeradressen kunnen in een periode van twaalf
      maanden eenmaal worden gewijzigd. Een wijziging van de samenstelling van het cluster en de verdeling van het aantal
      afvoeradressen wordt voorafgaand aan de toepassing van de wijziging aan de minister gemeld met gebruikmaking van
      een middel, dat daartoe door de minister beschikbaar is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel29b
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel29e
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel29ha
