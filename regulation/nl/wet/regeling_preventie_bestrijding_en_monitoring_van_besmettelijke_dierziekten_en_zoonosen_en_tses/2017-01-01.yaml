  - number: '63'
    text: |-
      1 Het doel van een kwaliteitssysteem is:

      a. de preventie van insleep en verspreiding van besmettelijke dierziekten;

      b. het waarborgen van de gezondheid van te vervoeren evenhoevigen;

      c. het waarborgen van het welzijn van de evenhoevigen.

      2 Om het doel, bedoeld in het eerste lid, te bereiken dient het kwaliteitssysteem tenminste de volgende aspecten
      te omvatten:

      a. de belading van vervoermiddelen;

      b. de reiniging en ontsmetting van vervoermiddelen;

      c. het bijhouden van registers van aantallen evenhoevigen en de identificatiegegevens van deze evenhoevigen;

      d. welke maatregelen worden genomen indien het vermoeden bestaat van ziekte van te vervoeren evenhoevigen;

      e. op welke wijze er wordt voldaan aan de voorschriften van Verordening (EG) nr. 1/2005;

      3 Voor zover het kwaliteitssysteem betrekking heeft op [artikel 33, derde lid][ref1], dienen er minimaal 100
      vervoerders deel te nemen.

      4 Voor zover het kwaliteitssysteem betrekking heeft op de [artikelen 44, tweede lid][ref2], [45, vierde lid][ref3],
      [artikel 46, tweede lid][ref4], of [47, tweede lid][ref5], dienen er minimaal 10 personen, rechtspersonen of
      samenwerkingsverbanden bestaande uit vervoerders en eigenaren of exploitanten van verzamelcentra, deel te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel33
