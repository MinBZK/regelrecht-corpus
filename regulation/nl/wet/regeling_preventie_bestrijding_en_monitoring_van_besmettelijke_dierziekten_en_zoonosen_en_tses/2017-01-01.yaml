        paragraaf: '2.1'
  - number: '27'
    text: |-
      1 De aanvraag om een erkenning als bedoeld in [artikel 26, eerste lid][ref1], wordt schriftelijk ingediend bij
      de NVWA.

      2 De aanvraag gaat vergezeld van het protocol, bedoeld in [artikel 26, tweede lid][ref2].

      3 De minister houdt een register bij van erkende reinigings- en ontsmettingsplaatsen dat ter inzage ligt bij de
      NVWA.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel26
