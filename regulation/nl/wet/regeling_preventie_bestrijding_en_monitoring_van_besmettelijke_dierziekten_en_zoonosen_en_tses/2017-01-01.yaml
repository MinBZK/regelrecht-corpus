  - number: 11b
    text: |-
      1 De personen, bedoeld in het tweede lid, doen onmiddellijk melding aan een ambtenaar als bedoeld in
      [artikel 114, tweede lid, van de wet][ref1] van de volgende situaties:

      a. een waterdier vertoont verschijnselen van een ziekte, bedoeld in [artikel 8][ref2];

      b. er kan redelijkerwijs worden aangenomen dat een waterdier in de gelegenheid is geweest om te worden besmet met
      een ziekte, bedoeld in onderdeel a;

      c. besmetting van een waterdier met een ziekte, bedoeld in onderdeel a, en

      d. een verhoogde sterfte onder aquacultuurdieren.

      2 De personen, bedoeld in het eerste lid, zijn:

      a. de eigenaar van het dier;

      b. personen die het dier verzorgen;

      c. personen die het dier tijdens vervoer begeleiden;

      d. dierenartsen en andere bij diensten voor de gezondheid van waterdieren werkzame personen;

      e. officiële dierenartsen;

      f. leidinggevend personeel van veterinaire of andere officiële of particuliere laboratoria, en

      g. andere personen die beroepshalve betrokken zijn bij waterdieren van gevoelige soorten of de producten van
      dergelijke dieren.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel114
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel8
