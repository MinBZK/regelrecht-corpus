    text: |-
      1 Besluiten tot vrijstelling of ontheffing, niet inhoudende een algemeen verbindend voorschrift, genomen
      krachtens [artikel 7, eerste lid van de Verordening monitoring aviaire influenza (PPE) 2005][ref1]
      of [artikel 12, eerste lid van de Verordening vaccinatie Newcastle disease (PPE) 2006][ref2],
      die golden onmiddellijk voorafgaand aan het tijdstip van inwerkingtreding van dit
      artikel, worden met ingang van 1 juli 2014 geacht te zijn genomen op grond van
      [artikel 107, eerste in samenhang met derde lid, van de Gezondheids- en welzijnswet voor dieren][ref3], onder
      dezelfde voorschriften, beperkingen en voorwaarden.

      2 De op het tijdstip van inwerkingtreding van dit artikel aanhangige aanvragen tot het nemen
      van een besluit als bedoeld in het eerste lid, worden met ingang van 1 juli 2014 overeenkomstig
      [artikel 107 van de Gezondheids- en welzijnswet voor dieren][ref4] door de minister behandeld met inachtneming van
      de termijn die op dat tijdstip is verstreken sinds het tijdstip van indiening van de aanvraag.

      3 Een onderzoek als bedoeld in
