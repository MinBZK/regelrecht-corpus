  - number: 94x
    text: |-
      Deze paragraaf is van toepassing op bedrijfsmatig gehouden kippen, kalkoenen, parelhoenders, kwartels, fazanten,
      patrijzen en eenden, die worden gehouden als vermeerderingsdier.
    url: https://wetten.overheid.nl/BWBR0018397/2017-01-01#Artikel94x
  - number: 94y
    text: |-
      1 De houder van dieren die behoren tot diersoorten als bedoeld in [artikel 94x][ref1] laat door een dierenarts
      of een dierenartsassistent paraveterinair bij die dieren ten minste 1 milliliter bloed afnemen overeenkomstig
      [artikel 94z][ref2].

      2 De houder laat, in een laboratorium als bedoeld in
      [artikel 2 van de Regeling erkenning en aanwijzing veterinaire laboratoria][ref3], de bloedmonsters:

      a. van kalkoenen onderzoeken op de aanwezigheid van Salmonella arizonae;

      b. van kippen, kalkoenen, parelhoenders, kwartels, fazanten, patrijzen en eenden onderzoeken op de aanwezigheid van
      antistoffen tegen Salmonella Gallinarum en Salmonella Pullorum.

      3 Het bloed wordt uiterlijk op de werkdag na de dag dat het bloed is afgenomen aangeleverd bij het laboratorium,
      bedoeld in het tweede lid.

      4 Bij aanlevering van het bloed worden in ieder geval de volgende gegevens aangeleverd:

      a. gegevens ter identificatie van de houder van de dieren, de dierenarts of een dierenartsassistent paraveterinair
      die het bloed heeft afgenomen en de dieren waarbij het bloed is afgenomen;

      b. gegevens omtrent de bloedmonsters;

      c. de dagtekening;

      d. de naam en handtekening van de inzender van de bloedmonsters.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel94x
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel94z
      [ref3]: https://wetten.overheid.nl/BWBR0019575#Artikel2
