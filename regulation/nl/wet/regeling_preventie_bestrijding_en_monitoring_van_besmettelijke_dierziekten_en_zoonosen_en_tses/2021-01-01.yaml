  - number: '11.1'
    text: |-
      De verplichting tot kennisgeving, bedoeld in [artikel 100 van de wet][ref1], van verschijnselen van BSE geldt in
      elk geval met betrekking tot runderen ouder dan twintig maanden, die gedragsstoornissen of neurologische symptomen
      vertonen en waarbij de ziekte op grond van een reactie op een behandeling of op grond van een laboratoriumonderzoek
      niet kan worden uitgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel100
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '100'
  - number: '11.2'
    text: |-
      De verplichting tot kennisgeving, bedoeld in [artikel 100 van de wet][ref1], van verschijnselen van scrapie
      geldt in elk geval met betrekking tot schapen en geiten ouder dan twaalf maanden, die gedragsstoornissen of
      neurologische symptomen vertonen en waarbij de ziekte op grond van een reactie op een behandeling of op grond van
      een laboratorium-onderzoek niet kan worden uitgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel100
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '100'
  - number: 11a
    text: |-
      De verplichting tot kennisgeving, bedoeld in de [artikelen 19][ref1] en [100 van de wet][ref2], geldt in elk geval
      indien uit het onderzoek, bedoeld in [artikel 5.1.4 van de Regeling tijdelijke maatregelen dierziekten][ref3],
      de aanwezigheid van de bacterie Coxiella burnetii, die Q-koorts veroorzaakt, is aangetoond in de schapen- of
      geitenmelk die wordt bewaard in een melkkoeltank.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel100
      [ref3]: https://wetten.overheid.nl/BWBR0022975#Artikel5
