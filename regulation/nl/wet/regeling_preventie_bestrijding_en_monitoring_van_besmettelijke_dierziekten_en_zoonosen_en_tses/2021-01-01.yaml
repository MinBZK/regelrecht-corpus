      verordening (EG) nr. 2160/2003;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel97
  - number: 97.b
    text: artikel 2 van verordening (EG) nr. 1177/2006;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel97
