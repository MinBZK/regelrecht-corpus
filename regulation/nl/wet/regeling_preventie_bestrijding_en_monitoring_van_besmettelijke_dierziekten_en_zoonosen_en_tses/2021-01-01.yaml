    text: |-
      De houder van kippen als bedoeld in de [artikelen 98b, eerste lid, onderdelen b en c][ref1], neemt per koppel
      verspreid over de stal:


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel98b
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98e
