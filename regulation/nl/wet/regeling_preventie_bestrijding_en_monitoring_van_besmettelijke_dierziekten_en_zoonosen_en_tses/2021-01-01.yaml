      [98c, eerste lid, onderdeel a][ref2], en [98d, eerste lid][ref3], worden per vrachtwagen of aanhanger 40
      mestmonsters genomen, waarbij de monsters verspreid over die vrachtwagen of aanhanger worden genomen uit de
      onderste kratten, containers of dozen.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel98b
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel98c
      [ref3]: https://wetten.overheid.nl/BWBR0018397#Artikel98d
