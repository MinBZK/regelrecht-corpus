    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel11b
  - number: 11b.2.c
    text: personen die het dier tijdens vervoer begeleiden;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel11b
  - number: 11b.2.d
    text: dierenartsen en andere bij diensten voor de gezondheid van waterdieren werkzame personen;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel11b
  - number: 11b.2.e
    text: officiële dierenartsen;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel11b
  - number: 11b.2.f
    text: leidinggevend personeel van veterinaire of andere officiële of particuliere laboratoria, en
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel11b
  - number: 11b.2.g
    text: |-
      andere personen die beroepshalve betrokken zijn bij waterdieren van gevoelige soorten of de producten van
      dergelijke dieren.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel11b
  - number: '13.1'
    text: |-
      Aan de houder van een rund wordt ingeval een rund abortus ondergaat vrijstelling verleend van de verplichting tot
      kennisgeving van dit verschijnsel van brucellose, bedoeld in [artikel 19 van de wet][ref1], indien wordt voldaan
      aan het tweede en derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel19
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '19'
  - number: '13.2'
    text: |-
      De houder stuurt binnen 7 dagen na de abortus een door een dierenarts bij
      dat rund genomen bloedmonster aan een erkend laboratorium als bedoeld in
      [artikel 2 van de Regeling erkenning en aanwijzing veterinaire laboratoria][ref1], ten behoeve van overeenkomstig
      bijlage C bij [richtlijn nr. 64/432/EEG](31964L0432) uit te voeren serologisch onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0019575#Artikel2
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0019575
        artikel: '2'
  - number: '13.3'
    text: |-
      Zodra de houder ervan op de hoogte is gesteld dat de abortus blijkens het in het tweede lid bedoelde onderzoek
      vermoedelijk aan brucellose te wijten is, geeft de houder terstond kennis van dit vermoeden aan de ambtenaar,
      bedoeld in [artikel 114, tweede lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel114
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '114'
  - number: '13.4'
    text: |-
      Het eerste tot en met het derde lid zijn van overeenkomstige toepassing op de verplichting tot kennisgeving door de
      dierenarts, bedoeld in [artikel 100 van de wet][ref1], van brucellose bij een rund.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel100
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '100'
  - number: 13a.1
    text: |-
      Vrijstelling van de verplichting tot kennisgeving, bedoeld in [artikel 19 van de wet][ref1], van verschijnselen van
      Q-koorts, wordt verleend aan:


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel19
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '19'
  - number: 13a.1.a
    text: de houder van een rund;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel13a
  - number: 13a.1.b
    text: de houder van een eenhoevige, en
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel13a
  - number: 13a.1.c
    text: de houder van een varken.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel13a
  - number: 13a.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing op de verplichting tot kennisgeving, bedoeld in
      [artikel 100 van de wet][ref1], van verschijnselen van Q-koorts door de dierenarts.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel100
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '100'
  - number: '14'
    text: |-
      De termijn, bedoeld in [artikel 3, onderdeel hh, van het Besluit verdachte dieren][ref1] is bij TSE’s bij schapen
      en geiten 7 jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0006829#Artikel3
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0006829
        artikel: '3'
  - number: '15'
    text: |-
      De termijn, bedoeld in [artikel 5, eerste lid, onderdeel ff, van het Besluit verdachte dieren][ref1] is bij TSE’s
      bij schapen en geiten 2 jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0006829#Artikel5
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006829
        artikel: '5'
  - number: 15a
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel15a
  - number: 15a.a
    text: '*databank:* geautomatiseerde gegevensbank;'
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel15a
  - number: 15a.b
    text: |-
      *persoonsgegevens, verwerking, verwerkingsverantwoordelijke, betrokkene onderscheidenlijk verwerker:* hetgeen
      daaronder wordt verstaan in artikel 4 van de Algemene verordening gegevensbescherming.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel15a
  - number: 15b.1
    text: |-
      De minister kan databanken aanwijzen waarin de registratie van gegevens, bedoeld in
      [artikel 98h, eerste lid][ref1], plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel98h
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel15b
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 98h
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 15b.2
    text: |-
      De gegevens worden verwerkt met als doel het ten behoeve van de bescherming van de dier- en volksgezondheid
      verkrijgen van inzicht in de gezondheidsstatus van dieren waarop de registratieverplichting van toepassing is en
      een effectief systeem van toezicht op en handhaving van de op deze dieren en de houders daarvan van toepassing
      zijnde regelgeving door de minister te bevorderen.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel15b
  - number: 15b.3
    text: De minister is verwerkingsverantwoordelijke voor de verwerking van persoonsgegevens in de databank.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel15b
  - number: 15b.4
    text: Een beheerder van een databank is verwerker van de persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel15b
  - number: 15b.5
    text: |-
      De minister en de beheerder van een databank verstrekken elkaar over en weer alle benodigde informatie teneinde
      een goede naleving van de Algemene verordening gegevensbescherming en andere privacywetgeving mogelijk te maken. Op
      verzoek van de minister toont de beheerder aan dat de noodzakelijke maatregelen zijn genomen.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel15b
  - number: 15b.6
    text: |-
      De beheerder van de databank stelt de minister te allen tijde kosteloos in de gelegenheid alle benodigde controles,
      gericht op de uitvoering van dit hoofdstuk en de naleving van privacywetgeving zoals de Algemene verordening
      gegevensbescherming, uit te voeren of uit te doen voeren.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel15b
  - number: 15c
    text: |-
      Een aanwijzing als bedoeld in [artikel 15b, eerste lid][ref1], vindt plaats, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel15b
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel15c
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 15b
        hoofdstuk: '3'
  - number: 15c.a
    text: |-
      de beheerder van de databank een onderneming heeft als bedoeld in [artikel 5 van de Handelsregisterwet 2007][ref1]
      of een rechtspersoon is in de zin van artikel 54 van het Verdrag betreffende de Werking van de Europese Unie, die
      in een lidstaat van de Europese Unie of van de Europese Economische Ruimte is gevestigd;


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel6
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel15c
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '6'
  - number: 15c.b
    text: de databank schriftelijk of elektronisch voldoende bereikbaar is voor houders;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel15c
  - number: 15c.c
    text: de beheerder van de databank de geregistreerde gegevens elektronisch en tijdig kan uitwisselen met de minister;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel15c
  - number: 15c.d
    text: |-
      de beheerder van de databank passende technische en organisatorische maatregelen neemt om de geregistreerde
      gegevens afdoende te beveiligen teneinde verlies en onrechtmatige of onnodige verwerking hiervan te voorkomen;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel15c
  - number: 15c.e
    text: |-
      de beheerder van de databank de geregistreerde gegevens overeenkomstig dit hoofdstuk verwerkt, en slechts
      voor andere doelen gebruikt dan verwerking overeenkomstig deze paragraaf nadat toestemming is verkregen van de
      betrokkene;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel15c
  - number: 15c.f
    text: de beheerder van de databank zorg draagt voor de kwaliteit van de gegevens.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel15c
  - number: 15d.1
    text: |-
      Een aanvraag tot aanwijzing als bedoeld in [artikel 15b, eerste lid][ref1], wordt ingediend bij de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel15b
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel15d
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 15b
        hoofdstuk: '3'
  - number: 15d.2
    text: 'Een aanvraag tot aanwijzing lid gaat vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel15d
  - number: 15d.2.a
    text: |-
      bewijsstukken dat voldaan wordt aan de [artikelen 15c][ref1] en [15e][ref2], en


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel15c
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel15e
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel15d
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 15c
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0018397
        artikel: 15e
        hoofdstuk: '3'
  - number: 15d.2.b
    text: |-
      een verklaring dat een bewerkersovereenkomst en een gegevensleveringsovereenkomst met de minister worden gesloten,
      indien de databank wordt aangewezen.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel15d
  - number: 15d.3
    text: |-
      Met toepassing van artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet is
      [paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref1] niet van toepassing op een aanvraag als bedoeld in
      [artikel 15b, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel15b
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel15d
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
      - id: ref2
        bwb_id: BWBR0018397
        artikel: 15b
        hoofdstuk: '3'
  - number: 15d.4
    text: Op een aanvraag tot aanwijzing wordt binnen zes weken na de datum van ontvangst van de aanvraag beslist.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel15d
  - number: 15d.5
    text: De minister kan de termijn, bedoeld in het vierde lid, eenmaal met zes weken verlengen.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel15d
  - number: 15e.1
    text: 'De beheerder van een aangewezen databank:'
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel15e
  - number: 15e.1.a
    text: |-
      verwerkt de gegevens, bedoeld in [artikel 98h, eerste en tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel98h
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel15e
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 98h
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 15e.1.b
    text: |-
      verstrekt de houder, bedoeld in dat artikel, digitaal of schriftelijk bewijs van de registratie of de wijziging
      daarvan, en
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel15e
  - number: 15e.1.c
    text: |-
      verstrekt de minister dagelijks een overzicht van de gegevens, bedoeld in
      [artikel 98h, eerste, tweede en derde lid][ref1], die in de databank zijn geregistreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel98h
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel15e
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 98h
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 15e.2
    text: |-
      De beheerder bewaart de gegevens, bedoeld in het eerste lid, onderdeel a, drie jaar, te rekenen vanaf de dag na de
      datum waarop de gegevens zijn geregistreerd.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel15e
  - number: 15e.3
    text: |-
      Op verzoek van de houder verstrekt de beheerder informatie aan de houder om hem zijn rechten te kunnen laten
      uitoefenen en de plichten na te leven als bedoeld in hoofdstuk III van de Algemene verordening gegevensbescherming,
      waaronder in elk geval wordt verstaan dat hij de houder inzage geeft in de gegevens die met betrekking tot die
      houder en door hem gehouden dieren geregistreerd zijn.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel15e
  - number: 15e.4
    text: |-
      Indien de beheerder meent dat de gegevens van een houder correct zijn vastgelegd, maar de houder van een dier dit
      standpunt bestrijdt, registreert de beheerder dat de houder zijn gegevens als niet correct beschouwt.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel15e
  - number: 15e.5
    text: |-
      De beheerder van een databank die vanwege een onvoorziene situatie niet kan voldoen aan dit artikel of
      [artikel 15c][ref1] stelt de minister daarvan onverwijld op de hoogte.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel15c
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel15e
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 15c
        hoofdstuk: '3'
  - number: 15f.1
    text: |-
      De minister kan de aanwijzing, bedoeld in [artikel 15b][ref1] intrekken, indien deze niet voldoet aan de
      voorwaarden, bedoeld in de artikelen 15b, vijfde en zesde lid, [15c][ref2] of [15e][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel15b
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel15c
      [ref3]: https://wetten.overheid.nl/BWBR0018397#Artikel15e
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel15f
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 15b
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0018397
        artikel: 15c
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0018397
        artikel: 15e
        hoofdstuk: '3'
  - number: 15f.2
    text: 'Indien de aanwijzing van een databank wordt ingetrokken of beëindigd:'
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel15f
  - number: 15f.2.a
    text: |-
      verstrekt de beheerder van de databank de geregistreerde gegevens aan de minister of geeft de minister de opdracht
      aan de beheerder van een databank de gegevens te vernietigen, en
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel15f
  - number: 15f.2.b
    text: |-
      verleent de beheerder van de databank alle medewerking aan de minister of de beheerder van een andere op grond
      van [artikel 15b, eerste lid][ref1], aangewezen databank ter zake van de overdracht van de werkzaamheden inzake de
      verwerking van de gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel15b
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel15f
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 15b
        hoofdstuk: '3'
  - number: 15g.1
    text: |-
      Tarieven voor een vergoeding die de beheerder van een databank in rekening brengt voor het verwerken van een
      regsitratie als bedoeld in [artikel 15b][ref1] behoeven de goedkeuring van de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel15b
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel15g
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 15b
        hoofdstuk: '3'
  - number: 15g.2
    text: |-
      De goedkeuring, bedoeld in het eerste lid, wordt onthouden indien de tarieven hoger zijn dan noodzakelijk,
      uitgaande van een redelijke toerekening van de totale kosten en opbrengsten, waarbij de vergoeding van de
      werkzaamheden, bedoeld in het eerste lid, niet meer bedraagt dan de kosten die de beheerder maakt bij de uitvoering
      van die werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel15g
  - number: 15g.3
    text: De tarieven worden per kalenderjaar goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel15g
  - number: 15g.4
    text: |-
      Ten behoeve van de goedkeuring verschaft de beheerder van een register alle noodzakelijke informatie,
      welke informatie vergezeld gaat van een controleverklaring, opgesteld door een accountant als bedoeld in
      [artikel 393, eerste lid van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel15g
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 15g.5
    text: Van een besluit tot goedkeuring van tarieven wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel15g
  - number: '16'
    text: Het is verboden om in strijd te handelen met de bepalingen van deze titel.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel16
  - number: '17.1'
    text: |-
      Degene die ingevolge deze titel gegevens moet bijhouden of vermelden op daartoe bestemde bescheiden, doet dit
      volledig, juist en naar waarheid.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel17
  - number: '17.2'
    text: |-
      Het bijhouden of vermelden van de in het eerste lid bedoelde gegevens geschiedt onverwijld nadat de gegevens bekend
      zijn bij degene die zij ingevolge deze regeling moet bijhouden of vermelden.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel17
  - number: '18.1'
    text: |-
      Indien een of meer evenhoevigen worden aangevoerd op een verzamelcentrum dient het verzamelcentrum te zijn erkend
      ingevolge [artikel 21, eerste of vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel21
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '18.2'
    text: |-
      Indien een of meer evenhoevigen worden aangevoerd op een slachthuis dient deze te beschikken over een reinigings-
      en ontsmettingsplaats voor vervoermiddelen die is erkend ingevolge [artikel 26, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel26
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '26'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '18.3'
    text: |-
      In afwijking van het tweede lid mogen een of meer evenhoevigen worden aangevoerd op een slachthuis met geringe
      capaciteit indien deze beschikt over een voorziening met voldoende capaciteit in relatie tot de werkzaamheden
      van het slachthuis, die zodanig is ingericht dat een deugdelijke en efficiënte reiniging en ontsmetting
      van vervoermiddelen kan plaatsvinden ongeacht het type vervoermiddel en voldoet aan de eisen, bedoeld in
      [bijlage 9][ref1]. De reiniging en ontsmetting wordt overeenkomstig een door de minister goedgekeurd protocol op
      zodanige wijze uitgevoerd dat de bioveiligheid niet in gevaar komt.


      [ref1]: https://wetten.overheid.nl/BWBR0018397
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0018397
  - number: '18.4'
    text: |-
      De eigenaar of exploitant van een slachthuis met geringe capaciteit als bedoeld in het derde lid, houdt een
      register bij met daarin de gegevens, bedoeld in [artikel 28, tweede lid][ref1] en bewaart dit overeenkomstig
      [artikel 28, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel28
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '28'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0018397
        artikel: '28'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '18.5'
    text: |-
      De eigenaar of exploitant van een slachthuis met geringe capaciteit als bedoeld in [artikel 59, tweede lid][ref1],
      van de Regeling preventie, bestrijding en monitoring van besmettelijke dierziekten en zoönosen en TSE’s zoals deze
      luidde op het moment van inwerkingtreding van deze regeling, dient uiterlijk binnen drie maanden het protocol,
      bedoeld in het derde lid, ter goedkeuring in bij de minister en werkt uiterlijk zes maanden na inwerkingtreding van
      deze regeling overeenkomstig het door de minister goedgekeurde protocol.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel59
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '59'
        hoofdstuk: '6'
  - number: '18.6'
    text: |-
      In afwijking van het tweede lid mogen een of meer evenhoevigen worden aangevoerd op een slachthuis met geringe
      capaciteit die bij inwerkingtreding van deze regeling over een vergunning beschikt die is afgegeven op grond van
      [artikel 59, vijfde lid][ref1], van de Regeling preventie, bestrijding en monitoring van besmettelijke dierziekten
      en zoönosen en TSE’s deze zoals deze luidde op het moment van inwerkingtreding van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel59
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '59'
        hoofdstuk: '6'
  - number: '19'
    text: |-
      De eigenaar of exploitant, dan wel diens vertegenwoordiger, van een plaats of een bedrijf waar evenhoevigen worden
      aangevoerd, verleent alle medewerking aan de reiniging en ontsmetting van het vervoermiddel waarmee de evenhoevigen
      naar zijn plaats of bedrijf zijn vervoerd.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel19
  - number: '20.1'
    text: |-
      Een plaats of bedrijf waar tien of meer evenhoevigen worden gehouden dient te beschikken over een eenvoudige
      reinigings- en ontsmettingsplaats die voldoet aan de eisen, bedoeld in [bijlage 9][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018397
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0018397
  - number: '20.2'
    text: |-
      Het eerste lid is niet van toepassing op een plaats of bedrijf waar vanaf 1 januari 2010 geen evenhoevigen, niet
      zijnde varkens, zijn aangevoerd.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel20
  - number: '21.1'
    text: 'Een varkensverzamelcentrum of een runderverzamelcentrum kan door de minister worden erkend indien:'
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel21
  - number: 21.1.a
    text: |-
      het verzamelcentrum voldoet aan de eisen, genoemd in artikel 11, eerste lid, onderdeel d, van richtlijn nr. 64/432/
      EEG;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel21
  - number: 21.1.b
    text: |-
      het verzamelcentrum zodanig is gelegen, ontworpen en geconstrueerd en op zodanige wijze wordt geëxploiteerd dat de
      bioveiligheid groot genoeg is om te voorkomen dat er ernstige besmettelijke dierziekten naar andere bedrijven of
      tussen opeenvolgende partijen dieren die het verzamelcentrum passeren, verspreid worden;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel21
  - number: 21.1.c
    text: |-
      op het verzamelcentrum een of meer reinigings- en ontsmettingsplaatsen die allen voldoen aan de eisen, genoemd in
      [artikel 26][ref1], aanwezig zijn om vervoermiddelen te reinigen en ontsmetten.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel26
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '26'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '21.2'
    text: 'Een paardenverzamelcentrum wordt door de minister erkend indien:'
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel21
  - number: 21.2.a
    text: |-
      het verzamelcentrum voldoet aan de eisen genoemd in artikel 11, eerste lid, onderdeel d, van [richtlijn 64/432]
      (31964L0432);
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel21
  - number: 21.2.b
    text: |-
      het verzamelcentrum zodanig is gelegen, ontworpen en op zodanige wijze wordt geëxploiteerd dat de bioveiligheid
      groot genoeg is om te voorkomen dat er ernstige besmettelijke dierziekten naar andere bedrijven of tussen
      opeenvolgende partijen paardachtigen die op het verzamelcentrum passeren, verspreid worden;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel21
  - number: 21.2.c
    text: |-
      op het verzamelcentrum één of meer reinigings- en ontsmettingsplaatsen aanwezig zijn die allen voldoen aan de
      eisen, bedoeld in [bijlage 9][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018397
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0018397
  - number: '21.3'
    text: |-
      Indien een runderverzamelcentrum of paardenverzamelcentrum bestaat uit meer epidemiologische eenheden, voldoen al
      deze eenheden aan [artikel 1, onderdeel u][ref1], en wordt het aantal eenheden vermeld in de erkenning.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel1
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '21.4'
    text: |-
      Indien het varkensverzamelcentrum subsidie heeft ontvangen op grond van de
      [Subsidieregeling sanering verzamelcentra varkens][ref1] wordt het verzamelcentrum niet erkend.


      [ref1]: https://wetten.overheid.nl/BWBR0009818
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0009818
  - number: '21.5'
    text: 'Een schapen- en geitenverzamelcentrum wordt door de minister erkend indien:'
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel21
  - number: 21.5.a
    text: |-
      het verzamelcentrum voldoet aan de eisen, genoemd in artikel 8bis, eerste lid, onderdeel d, van richtlijn nr.
      91/68/EEG;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel21
  - number: 21.5.b
    text: |-
      het verzamelcentrum zodanig is gelegen, ontworpen en geconstrueerd en op zodanige wijze wordt geëxploiteerd dat de
      bioveiligheid groot genoeg is om te voorkomen dat er ernstige besmettelijke dierziekten naar andere bedrijven of
      tussen opeenvolgende partijen dieren die het verzamelcentrum passeren, verspreid worden;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel21
  - number: 21.5.c
    text: |-
      op het verzamelcentrum een of meer reinigings- en ontsmettingsplaatsen die allen voldoen aan de eisen, genoemd in
      [artikel 26][ref1], aanwezig zijn om vervoermiddelen te reinigen en ontsmetten.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel26
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '26'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '21.6'
    text: |-
      Bij de verlening van de erkenning, bedoeld in het eerste, tweede en vijfde lid, kan door de minister rekening
      gehouden worden met de antecedenten van de eigenaar of exploitant van het verzamelcentrum met betrekking de
      voorschriften, genoemd in [artikel 23][ref1] of [24][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel24
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '23'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0018397
        artikel: '24'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '21.7'
    text: |-
      De wijze waarop een verzamelcentrum wordt geëxploiteerd, bedoeld in het eerste lid, onderdeel b, tweede lid,
      onderdeel b, en vijfde lid, onderdeel b, en de wijze van reiniging en ontsmetting worden vastgelegd in een protocol
      dat door de minister wordt goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel21
  - number: '22.1'
    text: |-
      Een aanvraag om een erkenning als bedoeld in [artikel 21, eerste, tweede of vijfde lid][ref1], wordt ingediend bij
      de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel21
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '22.2'
    text: |-
      De aanvraag gaat vergezeld van een protocol als bedoeld in [artikel 21, zevende lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel21
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '22.3'
    text: |-
      Indien een runderverzamelcentrum of erkend paardenverzamelcentrum bestaat uit meer epidemiologische eenheden, wordt
      op de aanvraag het aantal eenheden vermeld.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel22
  - number: '23.1'
    text: |-
      Een verzamelcentrum dat is erkend ingevolge [artikel 21, eerste lid][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel21
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 23.1.a
    text: voldoet aan de eisen, genoemd in artikel 11, eerste lid, onderdelen c en e, van richtlijn nr. 64/432/EEG;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel23
  - number: 23.1.b
    text: |-
      voldoet aan de artikelen 9 en 17 van verordening (EG) nr. 1/2005, de
      [artikelen 2.1, eerste, tweede en zesde lid][ref1] en [2.2, achtste lid, van de Wet dieren][ref2] en de
      [artikelen 1.6, eerste en derde lid][ref3], [2.3][ref4] en [2.4 Besluit houders van dieren][ref5];


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0035217#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0035217#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0030250
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0035217
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0035217
        artikel: '2'
      - id: ref5
        bwb_id: BWBR0035217
        artikel: '2'
  - number: 23.1.c
    text: wordt geëxploiteerd conform het door de minister goedgekeurde protocol;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel23
  - number: 23.1.d
    text: verleent de toezichthouder de medewerking die nodig is voor de uitoefening van zijn taken;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel23
  - number: 23.1.e
    text: |-
      voldoet aan: - de [artikelen 36][ref1], [37][ref2], [38][ref3], [41][ref4] en [42][ref5], voor zover het een
      varkensverzamelcentrum betreft;
        - de [artikelen 36][ref6], [37][ref7], [38][ref8], [41][ref9] en [43 tot en met 46][ref10], voor zover het een
      runderverzamelcentrum betreft;
        - de [artikelen 30, eerste lid][ref11], [31][ref12], [32][ref13] en
      [39 van de Regeling identificatie en registratie van dieren][ref14], voor zover het een varkensverzamelcentrum
      betreft;
        - de [artikelen 19][ref15] en [20, eerste lid][ref16], [21][ref17] en
      [39 van de Regeling identificatie en registratie van dieren][ref18], voor zover het een runderverzamelcentrum
      betreft.


