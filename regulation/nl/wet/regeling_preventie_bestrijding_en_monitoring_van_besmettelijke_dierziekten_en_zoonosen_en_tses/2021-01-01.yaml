        artikel: '2'
  - number: 24.1.c
    text: wordt geëxploiteerd conform het door de minister goedgekeurde protocol;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel24
  - number: 24.1.d
    text: verleent de toezichthouder de medewerking die nodig is voor de uitoefening van zijn taken;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel24
  - number: 24.1.e
    text: |-
      voldoet aan: - de [artikelen 36][ref1], [37][ref2], [38][ref3], [41][ref4] en [47][ref5];
        - de [artikelen 38b][ref6], [38d][ref7], [39][ref8] en
      [44c, vijfde lid, van de Regeling identificatie en registratie van dieren][ref9].


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0018397#Artikel38
