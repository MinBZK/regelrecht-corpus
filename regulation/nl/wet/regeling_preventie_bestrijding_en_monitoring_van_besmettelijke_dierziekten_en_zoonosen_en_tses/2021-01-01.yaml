preamble:
  text: |-
    Handelende in overeenstemming met de Minister van Volksgezondheid, Welzijn en Sport (titel 4, hoofdstuk 1,
    paragraaf 1);

    Gelet op:

    – verordening (EG) nr. 2160/2003 van het Europees Parlement en de Raad van de Europese Unie van 17 november 2003
    inzake de bestrijding van salmonella en andere specifieke door voedsel overgedragen zoönoseverwekkers (PbEG L 325);

    – verordening (EG) nr. 999/2001 van het Europees Parlement en de Raad van de Europese Unie van 22 mei 2001 houdende
    vaststelling van voorschriften inzake preventie, bestrijding en uitroeiing van bepaalde overdraagbare spongiforme
    encefalopatieën (PbEG L 147);

    – richtlijn nr. 2003/99/EG van het Europees Parlement en de Raad van de Europese Unie van 17 november 2003 inzake
    de bewaking van zoönoses en zoönoseverwekkers en houdende wijziging van beschikking nr. 90/424/EEG van de Raad van
    de Europese Unie en intrekking van richtlijn nr. 92/117/EEG van de Raad van de Europese Unie (PbEG L 325);

    – richtlijn nr. 2003/85/EG van de Raad van de Europese Unie van 29 september 2003 tot vaststelling van
    communautaire maatregelen voor de bestrijding van mond- en klauwzeer, tot intrekking van richtlijn nr. 85/511/
    EEG en van de beschikkingen nr. 89/531/EEG en nr. 91/665/EEG, en tot wijziging van richtlijn nr. 92/46/EEG (PbEG
    L 306);

    – richtlijn nr. 2001/89/EG van de Raad van de Europese Unie van 23 oktober 2001 betreffende maatregelen van de
    Gemeenschap ter bestrijding van klassieke varkenspest (PbEG L 316);

    – richtlijn nr. 95/70/EG van de Raad van de Europese Unie van 22 december 1995 tot vaststelling van minimale
    communautaire maatregelen ter bestrijding van bepaalde ziekten van tweekleppige weekdieren (PbEG L 332);

    – richtlijn nr. 93/53/EEG van de Raad van de Europese Gemeenschappen van 24 juni 1993 tot vaststelling van minimale
    communautaire maatregelen voor de bestrijding van bepaalde visziekten (PbEG L 175);

    – richtlijn nr. 92/35/EEG van de Raad van de Europese Gemeenschappen van 29 april 1992 tot vaststelling van
    controlevoorschriften en van maatregelen ter bestrijding van paardepest (PbEG L 157);

    – richtlijn nr. 92/40/EEG van de Raad van de Europese Gemeenschappen van 19 mei 1992 tot vaststelling van
    communautaire maatregelen voor de bestrijding van aviaire influenza (PbEG L 167);

    – richtlijn nr. 92/66/EEG van de Raad van de Europese Gemeenschappen van 14 juli 1992 tot vaststelling van
    communautaire maatregelen voor de bestrijding van de ziekte van Newcastle (PbEG L 260);

    – richtlijn nr. 92/119/EEG van de Raad van de Europese Gemeenschappen van 17 december 1992 tot vaststelling van
    algemene communautaire maatregelen voor de bestrijding van bepaalde dierziekten en van specifieke maatregelen ten
    aanzien van vesiculaire varkensziekte (PbEG 1993 L 62);

    – richtlijn nr. 91/68/EEG van de Raad van de Europese Gemeenschappen van 28 januari 1991 inzake
    veterinairrechtelijke voorschriften voor het intracommunautaire handelsverkeer in schapen en geiten (PbEG L 46);

    – richtlijn nr. 90/425/EEG van de Raad van de Europese Gemeenschappen van 26 juni 1990 inzake veterinaire en
    zoötechnische controles in het intracommunautaire handelsverkeer in bepaalde levende dieren en produkten in het
    vooruitzicht van de totstandbrenging van de interne markt (PbEG L 224);

    – richtlijn nr. 90/426/EEG van de Raad van de Europese Gemeenschappen van 26 juni 1990 tot vaststelling van
    veterinairrechtelijke voorschriften voor het verkeer van paardachtigen en de invoer van paardachtigen uit derde
    landen (PbEG L 224);

    – richtlijn nr. 90/539/EEG van de Raad van de Europese Gemeenschappen van 15 oktober 1990 tot vaststelling van
    veterinairrechtelijke voorschriften voor het intracommunautaire handelsverkeer en de invoer uit derde landen van
    pluimvee en broedeieren (PbEG L 303);

    – richtlijn nr. 82/894/EEG van de Raad van de Europese Gemeenschappen van 21 december 1982 inzake de melding van
    dierziekten in de Gemeenschap (PbEG L 378);

    – richtlijn nr. 78/52/EEG van de Raad van de Europese Gemeenschappen van 13 december 1977 tot vaststelling van de
    communautaire criteria voor de nationale programma’s voor de versnelde uitroeiing van brucellose, tuberculose en
    endemische leukose bij runderen (PbEG 1978 L 15);

    – richtlijn nr. 64/432/EEG van inzake veterinairrechtelijke vraagstukken op het gebied van het intracommunautaire
    handelsverkeer in runderen en varkens, zoals gewijzigd bij richtlijn nr. 97/12/EG van de Raad van de Europese Unie
    van 17 maart 1997 (PbEG L 109);

    – beschikking nr. 90/424/EEG van de Raad van de Europese Gemeenschappen van 26 juni 1990 betreffende bepaalde
    uitgaven op veterinair gebied (PbEG L 224);

    – beschikking nr. 2003/100/EG van de Commissie van de Europese Gemeenschappen van 13 februari 2003 tot
    vaststelling van minimumeisen voor fokprogramma’s ter verkrijging van resistentie tegen overdraagbare spongiforme
    encefalopathieën bij schapen (PbEG L 041);

    Gelet op de artikelen 10, eerste en tweede lid, onderdelen b en c, 11, eerste lid, 15, 17, 18, 23, 25, tweede
    lid, 26, 30, 31, 77, 81, 94, 100 en 107, 108 en 108a van de Gezondheids- en welzijnswet voor dieren, artikel 10a
    van de Veewet, artikel 19 van de Landbouwwet, artikel 7, tweede en derde lid van de wet op de uitoefening van de
    diergeneeskunde 1990, de artikelen 3 en 5 van het Besluit verdachte dieren, de artikelen 3 en 3a van het Besluit
    bescherming tegen bepaalde zoönosen en besmettelijke dierziekten, de artikelen 2 en 3 van het Besluit gebruik sera
    en entstoffen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder: - AI-gevoelige dieren: gehouden dieren van een soort behorende tot de
      orde van de hoenderachtigen (*Galliformes*), tot de familie van de eenden, ganzen en zwanen (*Anatidae*), tot de
      families van de struisvogels (*Struthionidae*), emoes (*Dromaiidae*) en nandoes (*Rheidae*) en voor consumptie
      gehouden duiven (*Columba Livia*);
        - assistent: door de NVWA met werkzaamheden belaste persoon, niet zijnde een dierenarts;
        - beschikking 93/152/EEG: beschikking 93/152/EEG van de Commissie van 8 februari 1993 houdende vaststelling van de
      eisen waaraan in het kader van de programma's inzake routinevaccinatie tegen Newcastle disease te gebruiken vaccins
      moeten voldoen (PbEG 1993, L 59);
        - beslag: op een verzamelcentrum in een afzonderlijke epidemiologische eenheid gehouden varkens of groep varkens,
      onderscheidenlijk rund of groep runderen, onderscheidenlijk paardachtige of groep paardachtigen met eenzelfde
      gezondheidsstatus;
        - blokperiode: 'tijdseenheid, die begint vanaf het tijdstip van eerste verzameling, van: 1. ten hoogste 120 uur op'
      een schapen- en geitenverzamelcentrum; 2. ten hoogste 144 uur op een runderverzamelcentrum, ingeval de runderen die
      worden verzameld fokrunderen zijn die zijn bestemd voor de afvoer naar een lidstaat; 3. ten hoogste 35 dagen op een
      runderverzamelcentrum, in geval de runderen die worden verzameld fokrunderen zijn die zijn bestemd voor de afvoer
      naar een derde land; 3a. ten hoogste 30 uur op een runderverzamelcentrum, in geval de runderen die worden verzameld
      jonger dan 12 weken zijn; 4. ten hoogste 48 uur op een varkensverzamelcentrum, in geval de varkens die worden
      verzameld slachtvarkens zijn; 5. ten hoogste 24 uur op een: – varkensverzamelcentrum, in geval de varkens die
      worden verzameld geen slachtvarkens zijn, – runderverzamelcentrum, ingeval de runderen die worden verzameld geen
      fokrunderen of runderen, jonger dan twaalf weken zijn; 6. ten hoogste 72 uur op een erkend paardenverzamelcentrum,
      ingeval de paardachtigen die worden verzameld bestemd zijn voor een in Nederland of in een andere lidstaat gelegen
      bestemming; 7. ten hoogste 35 dagen op een erkend paardenverzamelcentrum, ingeval de paardachtigen die worden
      verzameld bestemd zijn voor een in een derde land gelegen bestemming.
        - compartiment: compartiment als bedoeld in bijlage I, onderdeel a, van richtlijn nr. 2006/88/EG;
        - derde land: land, niet zijnde Nederland en niet zijnde een lidstaat;
        - dierenarts: dierenarts als bedoeld in [artikel 1.1, eerste lid, van de Wet dieren][ref1];
        - dierenartsassistent paraveterinair: dierenartsassistent paraveterinair als bedoeld in
      [artikel 3.1, eerste lid, van het Besluit diergeneeskundigen][ref2];
        - eendagskuikens: dieren die nog geen 72 uur oud zijn en die nog niet zijn gevoerd;
        - eenden: dieren van de soort Anas platyrhynchos;
        - eerste verzameling: eerste aanvoer van varkens, runderen, schapen, of geiten op onderscheidenlijk een
      varkensverzamelcentrum, een runderverzamelcentrum, een schapenverzamelcentrum of een geitenverzamelcentrum, nadat
      dit is ontvolkt, gereinigd en ontsmet. Ingeval op een runderverzamelcentrum met meer dan een epidemiologische
      eenheden fokrunderen worden aangevoerd: eerste aanvoer van fokrunderen op een epidemiologische eenheid nadat deze
      is ontvolkt, gereinigd en ontsmet;
        - epidemiologische eenheid: fysiek volledig afgescheiden stalruimte op een runderverzamelcentrum of erkend
      paardenverzamelcentrum voor de huisvesting van een afzonderlijk beslag zodat geen contact met de overige op het
      verzamelcentrum aanwezige beslagen mogelijk is en die alleen via een eigen hygiënesluis te betreden is. Ingeval er
      meerdere epidemiologische eenheden op een runderverzamelcentrum of erkend paardenverzamelcentrum zijn ondergebracht
      is elke epidemiologische eenheid ook fysiek volledig van de overige epidemiologische eenheden afgescheiden;
        - evenhoevigen: varkens, runderen, schapen, geiten of herten;
        - fokgeiten: geiten die zijn bestemd voor fok- en gebruiksdoeleinden;
        - fokrunderen: runderen, ouder dan 2 maanden, die kennelijk bestemd zijn voor de fokkerij in een lidstaat of een
      derde land;
        - fokschapen: schapen die zijn bestemd voor fok- en gebruiksdoeleinden;
        - ganzen: dieren van de familie anseridae;
        - geaccrediteerde keuringsinstantie: keuringsinstantie, ten aanzien waarvan: 1°. door de Nederlandse Raad voor
      Accreditatie of een gelijkwaardige buitenlandse instantie is verklaard dat de keuringsinstantie voldoet aan de
      criteria van EN 45004 en ISO 17020 en de relevante criteria van ISO 9001/9002, voorzover deze verklaring betrekking
      heeft op het bedrijfsrapport, bedoeld in [artikel 79, tweede lid, onderdeel m][ref3]. 2°. door de Nederlandse Raad
      voor Accreditatie of een gelijkwaardige buitenlandse instantie is verklaard dat de keuringsinstantie voldoet aan de
      criteria van EN 45004 en ISO 17020 en de relevante criteria van ISO 9001/9002, voorzover deze verklaring betrekking
      heeft op verrichtingen in de veehouderij, en de keuringsinstantie aan de Nederlandse Raad voor Accreditatie of een
      gelijkwaardige buitenlandse instantie heeft verzocht te verklaren dat de keuringsinstantie aan genoemde criteria
      voldoet met betrekking tot het bedrijfsrapport, bedoeld in [artikel 79, tweede lid, onderdeel m][ref4].
        - gebied: gebied als bedoeld in bijlage I, onderdeel p, van richtlijn nr. 2006/88/EG;
        - geitenverzamelcentrum: plaats in Nederland ten behoeve van de verzameling van geiten;
        - geringe capaciteit: het aantal behandelde grootvee-eenheden bedraagt per week ten hoogste 30 en per jaar ten
      hoogste 1.500, waarbij het aantal grootvee-eenheden als volgt wordt berekend: 1°. runderen en gedomesticeerde
      wilde soortgenoten: – volwassen runderen: 1; – andere runderen alsmede gedomesticeerde edelherten: 0,5; 2°. andere
      diersoorten en gedomesticeerde soortgenoten: – een schaap, een geit of een gedomesticeerd damhert: 0,10; – een lam,
      een jonge geit, een big, van minder dan 15 kg levend gewicht: 0,05;
        - gevoelige soort: gevoelige soort als bedoeld in bijlage I, onderdeel n, van richtlijn nr. 2006/88/EG;
        - grootouderdier: vermeerderingsdier dat wordt gehouden voor de productie van andere vermeerderingsdieren;
        - hygiënesluis: ruimte die zodanig gesitueerd is dat zij gepasseerd moet worden voordat een epidemiologische
      eenheid op een runderverzamelcentrum of erkend paardenverzamelcentrum betreden kan worden;
        - kalkoenen: dieren van de soort Meleagris gallopavo;
        - keuringsdierenarts: bevoegde, door de NVWA met werkzaamheden belaste dierenarts;
        - kippen: dieren van de soort Gallus gallus;
        - koppel: groep dieren met dezelfde gezondheids- en immuniteitsstatus en van dezelfde leeftijd, die in eenzelfde
      lokaal of een zelfde uitloopruimte wordt opgefokt of gehouden en die een epizoötiologische eenheid vormen;
        - kwartels: dieren van het geslacht Cortunix;
        - kweekgebied van weekdieren: kweekgebied van weekdieren als bedoeld in artikel 3, eerste lid, onderdeel j, van
      richtlijn nr. 2006/88/EG;
        - kwekerij: kwekerij als bedoeld in artikel 3, eerste lid, onderdeel h, van richtlijn nr. 2006/88/EG;
        - leghennen: dieren bestemd voor productie van consumptie-eieren;
        - lidstaat: lidstaat van de Europese Unie, niet zijnde Nederland;
        - loopvogels: dieren van de orde Struthioniformes;
        - mesterij: bedrijf of onderdeel van een bedrijf waar uitsluitend runderen, schapen of geiten worden gehouden
      die zijn bestemd om rechtstreeks of via een erkend verzamelcentrum te worden afgevoerd naar een al dan niet in
      Nederland gelegen slachthuis of naar een niet in Nederland gelegen bestemming;
        - mestgeiten: geiten die zijn bestemd om te worden afgevoerd naar een mesterij of een niet in Nederland gelegen
      bedrijf om te worden gemest voor de slacht;
        - mestrunderen: runderen die zijn bestemd om te worden afgevoerd naar een mesterij of een niet in Nederland gelegen
      bedrijf om te worden gemest voor de slacht;
        - mestschapen: schapen die zijn bestemd om te worden afgevoerd naar een mesterij of een niet in Nederland gelegen
      bedrijf om te worden gemest voor de slacht;
        - minister: Minister van Landbouw, Natuur en Voedselkwaliteit;
        - NVWA: Nederlandse Voedsel- en Warenautoriteit;
        - paardachtigen: als huisdier gehouden of in het wild levende paarden, zebra’s, ezels of kruisingen daarvan;
        - paardenverzamelcentrum: plaats in Nederland ten behoeve van de verzameling van paardachtigen die kennelijk zijn
      bestemd om te worden verhandeld;
        - parelhoenders: dieren van het geslacht Numididae;
        - pluimveebedrijf: inrichting die wordt gebruikt voor het anders dan voor recreatieve of educatieve doeleinden
      fokken, opfokken of houden van fokdieren, vleesdieren of legdieren;
        - reinigings- en ontsmettingsplaats voor vervoermiddelen: geheel aan installaties en voorzieningen nodig voor het
      reinigen en ontsmetten van vervoermiddelen;
        - richtlijn 2005/94/EG: richtlijn 2005/94/EG van de Raad van 20 december 2005 betreffende communautaire maatregelen
      ter bestrijding van aviaire influenza en tot intrekking van Richtlijn 92/40/EG, bijlage I (PbEU 2006, L10);
        - richtlijn 92/119/EEG: richtlijn nr. 92/119/EEG van de Raad van de Europese Gemeenschappen van 17 december
      1992 tot vaststelling van algemene communautaire maatregelen voor de bestrijding van bepaalde dierziekten en van
      specifieke maatregelen ten aanzien van de vesculaire varkensziekte (PbEG 1993, L 62);
        - [richtlijn nr. 2003/99/EG](32003L0099): [richtlijn nr. 2003/99/EG](32003L0099) van het Europees Parlement en de
      Raad van de Europese Unie van 17 november 2003 inzake de bewaking van zoönoses en zoönoseverwekkers en houdende
      wijziging van Beschikking 90/424/EEG van de Raad van de Europese Unie en intrekking van [richtlijn nr. 92/117/EEG]
      (31992L0117) van de Raad van de Europese Unie (PbEG L 325);
        - richtlijn nr. 2006/88/EG: richtlijn nr. 2006/88/EG van de Raad van de Europese Gemeenschappen van 24 oktober
      2006, betreffende veterinairrechtelijke voorschriften voor aquacultuurdieren en de producten daarvan en betreffende
      de preventie en bestrijding van bepaalde ziekten bij waterdieren (PbEG L 328);
        - [richtlijn nr. 64/432/EEG](31964L0432): [richtlijn nr. 64/432/EEG](31964L0432) van de Raad van de Europese
      Gemeenschappen van 26 juni 1964 inzake veterinairrechtelijke vraagstukken op het gebied van het intracommunautaire
      handelsverkeer in runderen en varkens (PbEG L 121);
        - [richtlijn nr. 91/68/EEG](31991L0068): [richtlijn nr. 91/68/EEG](31991L0068) van de Raad van de Europese
      Gemeenschappen van 28 januari 1991 inzake veterinairrechtelijke voorschriften voor het intracommunautaire
      handelsverkeer in schapen en geiten (PbEG L 46);
        - [richtlijn nr. 92/117/EEG](31992L0117): [richtlijn nr. 92/117/EEG](31992L0117) van de Raad van de Europese
      Gemeenschappen van 17 december 1992 inzake maatregelen voor de bescherming tegen bepaalde zoönoses en bepaalde
      zoönoseverwekkers bij dieren en in producten van dierlijke oorsprong teneinde door voedsel overgedragen infecties
      en vergiftigingen te voorkomen (PbEG 1993 L 62);
        - [richtlijn nr. 92/65/EEG](31992L0065): [richtlijn nr. 92/65/EEG](31992L0065) van de Raad van de Europese
      Gemeenschappen van 13 juli 1992 tot vaststelling van de veterinairrechtelijke voorschriften voor het
      handelsverkeer en de invoer in de Gemeenschap van dieren, sperma, eicellen en embryo’s waarvoor ten aanzien van de
      veterinairrechtelijke voorschriften geen specifieke communautaire regelgeving als bedoeld in bijlage A, onder I,
      van [richtlijn nr. 90/425/EEG](31990L0425) geldt (PbEG L 268);
        - [richtlijn nr. 92/66/EEG](31992L0066): [richtlijn nr. 92/66/EEG](31992L0066) van de Raad van de Europese
      Gemeenschappen van 14 juli 1992 tot vaststelling van communautaire maatregelen voor de bestrijding van de ziekte
      van Newcastle (PbEG L 260);
        - ronde: periode waarbinnen vogels vanaf het uitkomen of aanvoeren op een bedrijf worden opgefokt of gehouden tot
      het moment waarop zij slachtrijp zijn;
        - runderverzamelcentrum: plaats in Nederland ten behoeve van de verzameling van runderen;
        - schapenverzamelcentrum: plaats in Nederland ten behoeve van de verzameling van schapen;
        - slachtgeiten: geiten die kennelijk zijn bestemd voor de slacht;
        - slachtrunderen: runderen die kennelijk zijn bestemd voor de slacht;
        - slachtschapen: schapen die kennelijk zijn bestemd voor de slacht;
        - slachtvarkens: varkens die kennelijk zijn bestemd voor de slacht;
        - UBN: UBN als bedoeld in de [Regeling identificatie en registratie van dieren][ref5];
        - varkensverzamelcentrum: plaats in Nederland ten behoeve van de verzameling van varkens;
        - vermeerderingsdieren: vogels bestemd voor productie van broedeieren;
        - verordening (EG) nr. 1/2005: verordening (EG) nr. 1/2005 van de Raad van de Europese Unie van 22 december 2004
      inzake de bescherming van dieren tijdens het vervoer en daarmee samenhangende activiteiten en tot wijziging van de
      Richtlijnen 64/432/EEG en 93/119/EG en van Verordening (EG) nr. 1255/97 (PbEU L 3);
        - verordening (EG) nr. 1069/2009: verordening (EG) nr. 1069/2009 van het Europese Parlement en de Raad van
      21 oktober 2009 tot vaststelling van gezondheidsvoorschriften inzake niet voor menselijke consumptie bestemde
      dierlijke bijproducten en afgeleide producten en tot intrekking van Verordening (EG) nr. 1774/2002 (PbEU L 300);
        - verordening (EG) nr. 175/2010: verordening (EG) nr. 175/2010 van de Commissie van de Europese Gemeenschappen
      van 2 maart 2010 ter uitvoering van Richtlijn 2006/88/EG van de Raad wat betreft maatregelen ter bestrijding van
      de verhoogde mortaliteit bij oesters van de soort Crassostrea gigas in samenhang met de detectie van het Ostreid
      herpesvirus 1 µvar (OsHV-1 µvar);
        - [verordening (EG) nr. 178/2002](32002R0178): [verordening (EG) nr. 178/2002](32002R0178) van het Europees
      Parlement en de Raad van de Europese Unie van 28 januari 2002 tot vaststelling van de algemene beginselen en
      voorschriften van de levensmiddelenwetgeving, tot oprichting van een Europese Autoriteit voor voedselveiligheid en
      tot vaststelling van procedures voor voedselveiligheidsaangelegenheden (PbEG L 31);
        - [verordening (EG) nr. 2160/2003](32003R2160): [verordening (EG) nr. 2160/2003](32003R2160) van het Europees
      Parlement en de Raad van de Europese Unie van 17 november 2003 inzake de bestrijding van salmonella en andere
      specifieke door voedsel overgedragen zoönoseverwekkers (PbEG L 325);
        - verordening (EG) nr. 589/2008: verordening (EG) nr. 589/2008 van de Commissie van 23 juni 2008 tot vaststelling
      van bepalingen ter uitvoering van Verordening (EG) nr. 1234/2007 van de Raad, wat betreft de handelsnormen voor
      eieren (PbEU 2008, L 163);
        - verordening (EG) nr. 599/2004: verordening (EG) nr. 599/2004 van de Commissie van de Europese Gemeenschappen
      van 30 maart 2004 tot vaststelling van een geharmoniseerd model voor een certificaat en inspectieverslag voor het
      intracommunautaire handelsverkeer in dieren en producten van dierlijke oorsprong (Pb L EU 94);
        - verordening (EG) nr. 616/2009: verordening (EG) nr. 616/2009 van de Commissie van de Europese Gemeenschappen van
      13 juli 2009 houdende uitvoeringsbepalingen van Richtlijn 2005/94/EG wat betreft de goedkeuring van compartimenten
      voor pluimvee en compartimenten voor andere in gevangenschap levende vogels ten aanzien van aviaire influenza en
      aanvullende voorzorgsmaatregelen op het gebied van de bioveiligheid in dergelijke compartimenten (PbEU L 181);
        - verordening (EG) nr. 999/2001: verordening (EG) nr. 999/2001 van het Europees Parlement en de Raad van de
      Europese Unie van 22 mei 2001 houdende vaststelling van voorschriften inzake preventie, bestrijding en uitroeiing
      van bepaalde overdraagbare spongiforme encefalopathieën (PbEU L 147);
        - Verordening (EU) nr. 576/2013: Verordening (EU) nr. 576/2013 van het Europees Parlement en de Raad van 12 juni
      2013 betreffende het niet-commerciële verkeer van gezelschapsdieren en tot intrekking van Verordening (EG) nr.
      998/2003 (PbEU L 178);
        - [verordening nr. (EG) 1760/2000](32000R1760): [verordening (EG) nr. 1760/2000](32000R1760) van het Europees
      Parlement en de Raad van de Europese Unie van 17 juli 2000 tot vaststelling van een identificatie- en
      registratieregeling voor runderen en inzake de etikettering van rundvlees en rundvleesproducten en tot intrekking
      van [Verordening (EG) nr. 820/97](31997R0820) van de Raad van de Europese Unie (PbEG L 204);
        - *verordening (EU) 2019/627:* uitvoeringsverordening (EU) 2019/627 van de commissie van 15 maart 2019 tot
      vaststelling van eenvormige praktische regelingen voor de uitvoering van officiële controles van voor menselijke
      consumptie bestemde producten van dierlijke oorsprong overeenkomstig Verordening (EU) 2017/625 van het Europees
      Parlement en de Raad en tot wijziging van [Verordening (EG) nr. 2074/2005](32005R2074) van de Commissie wat
      officiële controles betreft (PbEU L 131).
        - vervoeren van een vervoermiddel: het voortbewegen of doen voortbewegen van een vervoermiddel;
        - vervoermiddel: voertuig, waaronder mede begrepen een combinatie van een voertuig met één of meer door dat
      voertuig voortbewogen aanhangwagens, opleggers of containers;
        - vervoerseenheid: voertuig dat of aanhangwagen, oplegger of container die deel uitmaakt of kan uitmaken van een
      combinatie als bedoeld in onderdeel n;
        - vleeseenden: eenden van 72 uur en ouder die worden opgefokt of gehouden voor de productie van vlees;
        - vleeskalkoenen: kalkoenen van 72 uur en ouder die worden opgefokt of worden gehouden voor de productie van vlees;
        - vleeskuikens: kippen van 72 uur en ouder die worden opgefokt of worden gehouden voor de productie van vlees;
        - waterdier: waterdier als bedoeld in artikel 3, eerste lid, onderdeel e, van richtlijn nr. 2006/88/EG, met
      uitzondering van de waterdieren, bedoeld in artikel 2, eerste lid, van richtlijn nr. 2006/88/EG;
        - waterdier voor sierdoeleinden: waterdier voor sierdoeleinden als bedoeld in artikel 3, eerste lid, onderdeel k,
      van richtlijn nr. 2006/88/EG;
        - wet: [Gezondheids- en welzijnswet voor dieren](onbekend).


