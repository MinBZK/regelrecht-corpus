    text: de bijlage bij verordening (EG) nr. 200/2012;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel97
  - number: 97.e
    text: de bijlage bij verordening (EG) nr. 517/2011;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel97
  - number: 97.f
    text: de bijlage bij verordening (EG) nr. 200/2010.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel97
  - number: '98'
    text: 'De bemonstering, bedoeld in:'
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98
  - number: 98.a
    text: |-
      punt 2.1, onderdeel a, onder ii, tweede gedachtestreepje, van de bijlage bij verordening (EU) nr. 1190/2012, vindt
      plaats op het bedrijf, bedoeld in dat gedachtestreepje;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98
  - number: 98.b
    text: |-
      punt 2.1.1 van de bijlage bij verordening (EU) nr. 200/2010, vindt ten minste driewekelijks plaats op het bedrijf,
      bedoeld in onderdeel b van dat punt.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98
  - number: 98a
    text: |-
      Deze paragraaf is niet van toepassing, indien de minister op het moment van bemonstering, bedoeld in deze
      paragraaf, monsters heeft laten nemen en onderzoeken op de aanwezigheid van de relevante serotypen salmonella.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98a
  - number: 98b.1
    text: |-
      De houder van kippen die worden opgefokt tot vermeerderingsdier laat die dieren overeenkomstig [artikel 98e][ref1]
      bemonsteren:


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel98e
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98b
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 98e
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 98b.1.a
    text: in de eerste 3 levensdagen;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98b
  - number: 98b.1.b
    text: op een leeftijd van 4 weken, en
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98b
  - number: 98b.1.c
    text: |-
      2 weken voor de overgang naar de legfase of verplaatsing naar een bedrijf waar ze als vermeerderingsdier worden
      gehouden.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98b
  - number: 98b.2
    text: 'De houder laat de monsters, bedoeld in het eerste lid, onderzoeken op de aanwezigheid van:'
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98b
  - number: 98b.2.a
    text: Salmonella enteritidis;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98b
  - number: 98b.2.b
    text: Salmonella typhimurium;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98b
  - number: 98b.2.c
    text: Salmonella hadar;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98b
  - number: 98b.2.d
    text: Salmonella infantis, en
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98b
  - number: 98b.2.e
    text: Salmonella virchow.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98b
  - number: 98b.3
    text: |-
      Onverminderd het tweede lid laat de houder de monsters, bedoeld in het eerste lid, van kippen die worden opgefokt
      tot vermeerderingsdier voor de productie van vleeskuikens onderzoeken op de aanwezigheid van Salmonella java.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98b
  - number: 98c.1
    text: |-
      De houder van kippen die worden opgefokt tot leghen laat die dieren overeenkomstig [artikel 98e][ref1] bemonsteren:


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel98e
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98c
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 98e
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 98c.1.a
    text: in de eerste 3 levensdagen, en
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98c
  - number: 98c.1.b
    text: 2 weken voor de overgang naar de legfase of verplaatsing naar een bedrijf waar ze als leghen worden gehouden.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98c
  - number: 98c.2
    text: |-
      De houder, bedoeld in het eerste lid, laat de monsters onderzoeken op de aanwezigheid van Salmonella enteritidis of
      Salmonella typhimurium.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98c
  - number: 98d.1
    text: |-
      Onverminderd punt 2.1, onderdeel a, van de bijlage bij verordening (EU) nr. 200/2012 laat de exploitant van een
      levensmiddelenbedrijf, bedoeld in die verordening, eendagskuikens overeenkomstig [artikel 98e][ref1] bemonsteren
      bij de plaatsing van die dieren op het bedrijf en onderzoeken overeenkomstig de bijlage bij verordening (EU)
      nr. 200/2012.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel98e
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98d
    references:
