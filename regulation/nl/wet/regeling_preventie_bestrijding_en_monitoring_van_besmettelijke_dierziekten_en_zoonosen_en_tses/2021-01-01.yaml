      een besluit als bedoeld in het eerste lid, worden met ingang van 1 juli 2014 overeenkomstig
      [artikel 107 van de Gezondheids- en welzijnswet voor dieren][ref1] door de minister behandeld met inachtneming van
      de termijn die op dat tijdstip is verstreken sinds het tijdstip van indiening van de aanvraag.


