        artikel: '28'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '23.3'
    text: Het register, bedoeld in het tweede lid, wordt minimaal drie jaren bewaard.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel23
  - number: 23a.1
    text: |-
      Een paardenverzamelcentrum dat is erkend ingevolge [artikel 21, tweede lid][ref1]:


