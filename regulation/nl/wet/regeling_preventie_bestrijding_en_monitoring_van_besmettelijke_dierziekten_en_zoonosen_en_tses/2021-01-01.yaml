    text: de dagtekening;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98f
  - number: 98f.3.d
    text: de naam en handtekening van de inzender van de monsters.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98f
  - number: 98g.1
    text: 'De exploitant van een levensmiddelenbedrijf, bedoeld in:'
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98g
  - number: 98g.1.a
    text: |-
      de bijlage, punt 2.1, onder a, bij verordening (EU) nr. 200/2012, laat de bemonstering, bedoeld in punt 2 van die
      bijlage uitvoeren door een dierenarts of een dierenartsassistent paraveterinair;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98g
  - number: 98g.1.b
    text: |-
      [artikel 98d, tweede lid][ref1], laat de bemonstering, bedoeld in dat artikellid, uitvoeren door een dierenarts of
      een dierenartsassistent paraveterinair.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel98d
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98g
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 98d
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 98g.2
    text: |-
      De exploitant van een levensmiddelenbedrijf als bedoeld in het eerste lid, onder a., laat de monsters, bedoeld in
      het eerste lid, onder a., onderzoeken op de aanwezigheid van:
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98g
  - number: 98g.2.a
    text: Salmonella enteritidis;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98g
  - number: 98g.2.b
    text: Salmonella typhimurium;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98g
  - number: 98g.2.c
    text: Salmonella hadar;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98g
  - number: 98g.2.d
    text: Salmonella infantis;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98g
  - number: 98g.2.e
    text: Salmonella virchow, en
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98g
  - number: 98g.2.f
    text: Salmonella java.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98g
  - number: 98h.1
    text: |-
      De houder bewaart de uitslag van het onderzoek dat krachtens verordening (EG) nr. 2160/2003 of op grond van deze
      paragraaf namens de houder is uitgevoerd gedurende twee jaar en registreert die uitslag:
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98h
  - number: 98h.1.a
    text: |-
      in een databank die op grond van [artikel 15b, eerste lid][ref1], door de minister is aangewezen als databank voor
      de registratie van die gegevens, of


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel15b
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98h
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 15b
        hoofdstuk: '3'
  - number: 98h.1.b
    text: |-
      bij de minister, voor zover voor de registratie van die gegevens geen aanwijzing als bedoeld in
      [artikel 15b, eerste lid][ref1], heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel15b
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98h
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 15b
        hoofdstuk: '3'
  - number: 98h.2
    text: 'De houder verstrekt bij de registratie, bedoeld in het eerste lid, in ieder geval de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98h
  - number: 98h.2.a
    text: |-
      naam, adres en UBN dan wel een door de minister toegekend registratienummer als bedoeld in
      [artikel 3 van de Regeling identificatie en registratie van dieren][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel3
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98h
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '3'
  - number: 98h.2.b
    text: laboratoriumcode, datum, tijdstip en aanduiding van de uitslag;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98h
  - number: 98h.2.c
    text: |-
      bedrijfstype, soort monster, datum monstername, gegevens ter identificatie van de monsternemer, stalnummer waar het
      monster is genomen, geboortedatum en nummer van het betreffende koppel;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98h
  - number: 98h.2.d
    text: |-
      datum ontvangst bij het laboratorium van het genomen monster, aanvangsdatum laboratoriumonderzoek, soort onderzoek
      en uitslag van het onderzoek;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98h
  - number: 98h.2.e
    text: 'indien van toepassing: serotype en gegevens over afwijking in het monster.'
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98h
  - number: 98h.3
    text: |-
      Indien blijkt dat gegevens als bedoeld in het eerste en tweede lid, niet juist of volledig zijn verstrekt de houder
      de gecorrigeerde gegevens.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98h
  - number: 98h.4
    text: |-
      Geconstateerde aanwezigheid van de serotypes enteritidis, typhimurium, hadar, infantis, virchow en java wordt
      onverwijld door de houder aan de betrokken afnemer doorgegeven.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98h
  - number: 98i
    text: |-
      Het is de exploitant van een levensmiddelenbedrijf, bedoeld in de bijlage, punt 2.1, bij verordening (EU)
      nr. 517/2011, verboden om leghennen aan te voeren op een bedrijf waar de aanwezigheid van Salmonella enteritidis is
      vastgesteld, tenzij die dieren zijn gevaccineerd tegen Salmonella enteritidis.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98i
  - number: 98j
    text: |-
      In deze paragraaf wordt verstaan onder:

            basismonster:

              basismonster als bedoeld in bijlage I, onderdeel 2, bij verordening (EG) nr. 152/2009;



            eindmonster:

              eindmonster als bedoeld in bijlage I, onderdeel 2, bij verordening (EG) nr. 152/2009;



            verzamelmonster:

              verzamelmonster als bedoeld in bijlage I, onderdeel 2, bij verordening (EG) nr. 152/2009.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98j
  - number: 98k.1
    text: |-
      De producent van mengvoeders voor pluimvee bemonstert voedermiddelen bij de aanvoer per productielocatie, indien de
      jaarproductie van die locatie:
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98k
  - number: 98k.1.a
    text: 'ten hoogste 4.000 ton bedraagt: ten minste eenmaal per kwartaal;'
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98k
  - number: 98k.1.b
    text: 'ten hoogste 8.000 ton bedraagt: ten minste tweemaal per kwartaal;'
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98k
  - number: 98k.1.c
    text: 'ten hoogste 10.000 ton bedraagt: ten minste driemaal per kwartaal;'
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98k
  - number: 98k.1.d
    text: 'ten hoogste 20.000 ton bedraagt: ten minste vijfmaal per kwartaal;'
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98k
  - number: 98k.1.e
    text: 'ten hoogste 30.000 ton bedraagt: ten minste achtmaal per kwartaal;'
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98k
  - number: 98k.1.f
    text: 'ten hoogste 40.000 ton bedraagt: ten minste tienmaal per kwartaal;'
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98k
  - number: 98k.1.g
    text: 'meer dan 40.000 ton bedraagt: ten minste 13 maal per kwartaal.'
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98k
  - number: 98k.2
    text: Een monster als bedoeld in het eerste lid weegt ten minste 60 gram.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98k
  - number: 98l.1
    text: |-
      De producent van mengvoeders voor pluimvee bemonstert van de af te leveren partijen mengvoer van 24 ton die bestemd
      zijn voor:
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98l
  - number: 98l.1.a
    text: 'vermeerderingsdieren die worden gehouden als grootouderdier of overgrootouderdier: ten minste 50%;'
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98l
  - number: 98l.1.b
    text: 'kippen of kalkoenen die worden opgefokt tot andere vermeerderingsdieren dan bedoeld in onderdeel a: ten minste 20%;'
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98l
  - number: 98l.1.c
    text: 'kippen of kalkoenen die worden gehouden als vermeerderingsdier: ten minste 10%;'
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98l
  - number: 98l.1.d
    text: 'vleeskuikens, leghennen en dieren die worden opgefokt tot leghen: ten minste 5%;'
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98l
  - number: 98l.1.e
    text: 'vleeskalkoenen: ten minste 1 op de 30.'
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98l
  - number: 98l.2
    text: |-
      De leverancier van voedermiddelen die aan pluimveehouderijen worden geleverd, bemonstert van de af te leveren
      partijen voedermiddelen van 24 ton ten minste 1 op de 30 partijen.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98l
  - number: 98l.3
    text: De monsters, bedoeld in het eerste en tweede lid, worden genomen uit de productstroom.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98l
  - number: 98l.4
    text: |-
      Onverminderd het eerste en tweede lid bemonstert de producent van mengvoeders en de leverancier van voedermiddelen
      voor pluimvee ten minste elke zes maanden op kritische punten in het productieproces of het logistieke proces,
      bedoeld in artikel 6 van verordening (EG) nr. 183/2005 van het Europees Parlement en de Raad van 12 januari 2005
      tot vaststelling van voorschriften voor diervoederhygiëne (PbEU 2005, L 35).
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98l
  - number: 98l.5
    text: Een monster als bedoeld in het eerste tot en met vierde lid weegt ten minste 60 gram.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98l
  - number: 98m.1
    text: |-
      De producent van mengvoeders die bestemd zijn voor ander vee dan pluimvee neemt uit de productstroom per
      productielocatie waarvan de jaarproductie:
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98m
  - number: 98m.1.a
    text: 'ten hoogste 4.000 ton bedraagt: ten minste twee monsters per kwartaal;'
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98m
  - number: 98m.1.b
    text: 'ten hoogste 6.000 ton bedraagt: ten minste drie monsters per kwartaal;'
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98m
  - number: 98m.1.c
    text: 'ten hoogste 8.000 ton bedraagt: ten minste vier monsters per kwartaal;'
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98m
  - number: 98m.1.d
    text: 'ten hoogste 10.000 ton bedraagt: ten minste vijf monsters per kwartaal;'
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98m
  - number: 98m.1.e
    text: 'ten hoogste 20.000 ton bedraagt: ten minste tien monsters per kwartaal;'
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98m
  - number: 98m.1.f
    text: 'ten hoogste 30.000 ton bedraagt: ten minste 15 monsters per kwartaal;'
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98m
  - number: 98m.1.g
    text: 'ten hoogste 40.000 ton bedraagt: ten minste 20 monsters per kwartaal;'
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98m
  - number: 98m.1.h
    text: 'meer dan 40.000 ton bedraagt: ten minste 25 monsters per kwartaal.'
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98m
  - number: 98m.2
    text: Ten minste 50% van de monsters, bedoeld in het eerste lid, worden genomen van mengvoeders.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98m
  - number: 98m.3
    text: Een monster, bedoeld in het eerste lid, weegt ten minste 60 gram.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98m
  - number: 98n.1
    text: |-
      De producent en de leverancier van voedermiddelen die bestemd zijn voor ander vee dan pluimvee nemen per product
      per toeleverancier een monster van ten minste 60 gram per kwartaal.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98n
  - number: 98n.2
    text: |-
      De producent en de leverancier kunnen ten aanzien van een partij voedermiddelen schriftelijk overeenkomen dat de
      bemonstering, bedoeld in het eerste lid, door de producent of de leverancier plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98n
  - number: 98n.3
    text: |-
      Bij seizoensgebonden of incidentele producten start de bemonstering, bedoeld in het eerste lid, bij de eerste
      lading.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98n
  - number: 98n.4
    text: 'Het eerste lid is niet van toepassing, indien:'
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98n
  - number: 98n.4.a
    text: de zuurtegraad van de voedermiddelen ten hoogste 4,5 pH bedraagt bij spontane melkzuurfermentatie;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98n
  - number: 98n.4.b
    text: de zuurtegraad van de voedermiddelen ten hoogste 4 pH bedraagt, indien organische zuren zijn toegevoegd;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98n
  - number: 98n.4.c
    text: de zuurtegraad van de voedermiddelen ten hoogste 3,5 pH bedraagt, indien anorganische zuren zijn toegevoegd, of
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98n
  - number: 98n.4.d
    text: |-
      de producent of de leverancier aantoont dat de zuurtegraad voldoende is om salmonella in de voedermiddelen te
      inactiveren.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98n
  - number: 98o.1
    text: De producent en de leverancier, bedoeld in deze paragraaf, laten de monsters onderzoeken in een laboratorium.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98o
  - number: 98o.2
    text: |-
      De producent en de leverancier laten monsters waarbij, na onderzoek als bedoeld in het eerste lid, de aanwezigheid
      van Salmonella is geconstateerd nader onderzoeken op de volgende serotypes:
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98o
  - number: 98o.2.a
    text: Salmonella enteritidis;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98o
  - number: 98o.2.b
    text: Salmonella typhimurium;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98o
  - number: 98o.2.c
    text: Salmonella hadar;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98o
  - number: 98o.2.d
    text: Salmonella infantis;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98o
  - number: 98o.2.e
    text: Salmonella virchow, en
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98o
  - number: 98o.2.f
    text: Salmonella java.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98o
  - number: 98o.3
    text: |-
      De serotypering van de monsters, bedoeld in het tweede lid, vindt plaats in een laboratorium als bedoeld in
      [artikel 2 van de Regeling erkenning en aanwijzing veterinaire laboratoria][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019575#Artikel2
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98o
    references:
      - id: ref1
        bwb_id: BWBR0019575
        artikel: '2'
  - number: 98p.1
    text: |-
      De producent en de leverancier bewaren de uitslag van het onderzoek, bedoeld in [artikel 98o][ref1], gedurende een
      periode van twee jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel98o
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98p
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 98o
        hoofdstuk: '1'
        paragraaf: '3'
  - number: 98p.2
    text: |-
      Geconstateerde aanwezigheid van de serotypes als bedoeld in [artikel 98o, tweede lid][ref1], wordt onverwijld door
      de producent of de leverancier aan de NVWA en de betrokken pluimveehouder doorgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel98o
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel98p
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 98o
        hoofdstuk: '1'
        paragraaf: '3'
  - number: '99.1'
    text: |-
      Als fokprogramma als bedoeld in artikel 6 bis van verordening (EG) nr. 999/2001 worden aangewezen de erkende
      fokprogramma’s van:
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel99
  - number: 99.1.a
    text: |-
      een ingevolge artikel 4, derde lid, van verordening (EU) 2016/1012 van het Europees Parlement en de Raad van
      8 juni 2016 betreffende de zoötechnische en genealogische voorwaarden voor het fokken van, de handel in en de
      binnenkomst in de Unie van raszuivere fokdieren, hybride fokvarkens en levende producten daarvan en tot wijziging
      van Verordening (EU) nr. 652/2014, de [Richtlijnen 89/608/EEG](31989L0608) en [90/425/EEG](31990L0425) van de Raad
      en tot intrekking van bepaalde handelingen op het gebied van dierfokkerij (‘Fokkerijverordening’) (PbEU 2016, L
      171) erkende stamboekvereniging; of
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel99
  - number: 99.1.b
    text: |-
      een groep houders van schapen, verenigd in een organisatie met rechtspersoonlijkheid, die zich in ieder geval ten
      doel stelt het fokken gericht op het terugdringen van de TSE-gevoeligheid bij schapen en die niet is aangesloten
      bij een stamboekvereniging als bedoeld in onderdeel a.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel99
  - number: '99.2'
    text: |-
      De minister verleent op aanvraag een erkenning als bedoeld in de aanhef van het eerste lid, indien het fokprogramma
      voldoet aan bijlage VII, hoofdstuk C, delen 1 en 2, van verordening (EG) nr. 999/2001 en aan [artikel 99a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel99a
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 99a
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '99.3'
    text: |-
      Een aanvraag als bedoeld in het tweede lid wordt voor 1 juni van het betreffende jaar ingediend, waarbij in ieder
      geval de volgende gegevens worden vermeld:
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel99
  - number: 99.3.a
    text: |-
      de naam van de stamboekvereniging of de organisatie, bedoeld in [artikel 99, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel99
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '99'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 99.3.b
    text: |-
      het aantal schapen dat bij het stamboek is geregistreerd of bij de organisatie is ingeschreven, onderscheiden naar
      geslacht en ras;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel99
  - number: 99.3.c
    text: het betreffende fokprogramma.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel99
  - number: 99a
    text: |-
      Het certificatiesysteem, bedoeld in bijlage VII, hoofdstuk C, deel 1, punt 3, bij verordening (EG) nr. 999/2001,
      bevat naast de gegevens, bedoeld in hoofdstuk C, deel 1, punt 2, van die bijlage:
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel99a
  - number: 99a.a
    text: de datum van certificering als bedoeld in hoofdstuk C, deel 1, punt 3, van die bijlage;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel99a
  - number: 99a.b
    text: |-
      het laboratorium dat de genotypering, bedoeld in hoofdstuk C, deel 1, punt 5, van die bijlage heeft verricht,
      indien van toepassing.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel99a
  - number: 99b.1
    text: |-
      Aan houders van schapen die deelnemen aan een fokprogramma als bedoeld in artikel 6 bis van verordening (EG)
      nr. 999/2001 verleent de minister op aanvraag een erkenning als bedoeld in bijlage VII, hoofdstuk C, deel 4, punt
      1, onderdeel a of b, bij die verordening, indien is voldaan aan de criteria van dat fokprogramma.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel99b
  - number: 99b.2
    text: 'Bij een aanvraag als bedoeld in het eerste lid worden in ieder geval gegevens vermeld waaruit blijkt dat:'
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel99b
  - number: 99b.2.a
    text: |-
      alle schapen in de kudde het ARR/ARR genotype hebben, indien een erkenning als bedoeld in hoofdstuk C, deel 4, punt
      1, onderdeel a, van de bijlage, bedoeld in het eerste lid, wordt aangevraagd;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel99b
  - number: 99b.2.b
    text: |-
      alle nakomelingen in het jaar voorafgaande aan de aanvraag zijn verwekt door vaderdieren met het ARR/ARR genotype,
      indien een erkenning als bedoeld in hoofdstuk C, deel 4, punt 1, onderdeel b, van de bijlage, bedoeld in het eerste
      lid, wordt aangevraagd.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel99b
  - number: 99c
    text: |-
      Indien niet langer wordt voldaan aan de voorwaarden, bedoeld in [artikel 99, tweede lid][ref1] respectievelijk
      [artikel 99b, eerste lid][ref2], trekt de minister een erkenning als bedoeld in die artikelen in.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel99
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel99b
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel99c
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '99'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0018397
        artikel: 99b
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 99d
    text: |-
      Een stamboekvereniging en een groep houders van schapen als bedoeld in [artikel 99, eerste lid][ref1], rapporteren
      jaarlijks voor 1 februari aan de minister over:


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel99
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel99d
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '99'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 99d.a
    text: |-
      de resultaten van de genotyperingen, waarbij onderscheid wordt gemaakt tussen rammen en ooien, en tussen dieren die
      de leeftijd van 1 jaar nog niet hebben bereikt en dieren die 1 jaar of ouder zijn;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel99d
  - number: 99d.b
    text: |-
      de resultaten van de steekproeven, bedoeld in bijlage VII, hoofdstuk C, deel 4, punt 2, van verordening (EG)
      nr. 999/2001;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel99d
  - number: 99d.c
    text: het aantal houders dat aan het fokprogramma deelneemt.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel99d
  - number: 99e.1
    text: |-
      Erkenningen die zijn verleend op grond van de
      [Verordening fokken op terugdringing TSE gevoeligheid bij schapen (PVV) 2008][ref1] worden beschouwd als
      erkenningen als bedoeld in [artikel 99, tweede lid][ref2], en [artikel 99b, eerste lid][ref3], van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0024314
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel99
      [ref3]: https://wetten.overheid.nl/BWBR0018397#Artikel99b
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel99e
    references:
      - id: ref1
        bwb_id: BWBR0024314
      - id: ref2
        bwb_id: BWBR0018397
        artikel: '99'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0018397
        artikel: 99b
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 99e.2
    text: |-
      De op het tijdstip van inwerkingtreding van dit artikel aanhangige aanvragen worden vanaf dat tijdstip
      overeenkomstig deze regeling behandeld door de minister, met inachtneming van de termijn die op dat tijdstip is
      verstreken sinds het tijdstip van indiening van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel99e
  - number: '100'
    text: Het is verboden in strijd te handelen met artikel 9, eerste lid, tweede lid, van verordening (EG) nr. 999/2001.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel100
  - number: '102'
    text: |-
      Als modellen van waarschuwingsborden als bedoeld in [artikel 22, eerste lid, onderdeel c, van de wet][ref1],
      die worden geplaatst ter aanduiding van een gebied waar ingevolge [artikel 30 van de wet][ref2] een verbod tot
      vervoeren van kracht is, worden vastgesteld de in [bijlage 21][ref3] opgenomen modellen.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0018397
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0005662
        artikel: '30'
      - id: ref3
        bwb_id: BWBR0018397
  - number: '103.1'
    text: |-
      Als modellen van kentekenen als bedoeld in [artikel 22, eerste lid, onderdeel d, van de wet][ref1], die worden
      geplaatst bij een gebouw of terrein dat besmet is of van besmetting is verdacht worden vastgesteld de in
      [bijlage 22, onder a][ref2], opgenomen modellen.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0018397
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0018397
  - number: '103.2'
    text: |-
      Als model van het kenteken, bedoeld in [artikel 22, tweede lid, onderdeel c, van de wet][ref1], dat wordt gehecht
      aan een bijenwoning, wordt vastgesteld het in [bijlage 22, onder b][ref2], opgenomen model.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0018397
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0018397
  - number: '104.1'
    text: |-
      De kentekenen of waarschuwingsborden worden aan de ingang van de besmette of van besmetting verdachte gebouwen en
      terreinen, aan de bijenwoning of rondom het krachtens [artikel 30 van de wet][ref1] aangewezen gebied aangebracht,
      gehecht of geplaatst en wel zodanig dat zij duidelijk van de openbare weg af zichtbaar zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel30
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '30'
  - number: '104.2'
    text: Waarschuwingsborden kunnen langs de openbare weg vooraangekondigd worden.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel104
  - number: '105'
    text: |-
      Het onschadelijk maken, bedoeld in [artikel 22, eerste lid, onderdeel g, van de wet][ref1], en het vernietigen,
      bedoeld in [artikel 22, tweede lid, onderdelen f en g, van de wet][ref2], geschiedt:


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel22
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0005662
        artikel: '22'
  - number: 105.a
    text: overeenkomstig verordening (EG) nr. 1069/2009;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel105
  - number: 105.b
    text: 'indien verordening (EG) nr. 1069/2009 niet van toepassing is:'
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel105
  - number: 105.b.1°
    text: |-
      door verbranden, onderploegen, broeien, vermenging met een ontsmettingsmiddel als bedoeld in [artikel 108][ref1]
      of bij mest door verwerken in een mestverwerkingsinrichting, onverminderd de bepalingen van het Besluit gebruik
      dierlijke meststoffen op grond waarvan de mest tijdelijk wordt opgeslagen;


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel108
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '108'
        hoofdstuk: '1'
        paragraaf: '3'
  - number: 105.b.2°
    text: door droge sterilisatie.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel105
  - number: 105a
    text: |-
      Op een tegemoetkoming in de schade voor dieren, producten of voorwerpen die zijn gedood of onschadelijk gemaakt
      als bedoeld in [artikel 86, eerste lid, van de wet][ref1] wordt de eventuele opbrengst van die dieren, producten of
      voorwerpen in mindering gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel86
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel105a
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '86'
  - number: '106.1'
    text: |-
      Aan ontsmetting gaat reiniging vooraf, behoudens die gevallen waarbij, ter beoordeling van de minister, wegens
      besmettingsgevaar voor de personen die met de reiniging zijn belast, voor de reiniging en ontsmetting eerst een
      voorlopige ontsmetting plaatsvindt. De reiniging vindt plaats binnen de door de minister aangegeven termijn.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel106
  - number: '106.2'
    text: |-
      Het reinigen van dieren, gebouwen, terreinen, bewaarplaatsen van mest, voorwerpen en producten geschiedt
      overeenkomstig [bijlage 23][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018397
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0018397
  - number: '106.3'
    text: |-
      Onverminderd het tweede lid geschiedt reiniging en ontsmetting overeenkomstig de voor de desbetreffende dierziekte
      geldende communautaire bestrijdingsrichtlijn.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel106
  - number: '107'
    text: |-
      Het ontsmetten van gebouwen, terreinen, bewaarplaatsen van mest, bijenwoning en dieren, voorwerpen en producten
      is gericht op het effectief en efficiënt onschadelijk maken van smetstof, waarbij elk geval op zichzelf wordt
      beoordeeld en geschiedt op de in de [bijlage 23][ref1] beschreven wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0018397
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0018397
  - number: '108'
    text: 'Het ontsmetten geschiedt met een van de volgende middelen:'
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel108
  - number: 108.a
    text: 'hitte in de vorm van:'
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel108
  - number: 108.a.1
    text: vuur;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel108
  - number: 108.a.2
    text: hete lucht;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel108
  - number: 108.a.3
    text: stoom;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel108
  - number: 108.a.4
    text: kokend water;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel108
  - number: 108.b
    text: |-
      ontsmettingsmiddelen die voor dat doel zijn toegelaten op grond van de
      [Wet gewasbeschermingsmiddelen en biociden][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0021670
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0021670
  - number: 108.c
    text: andere door de minister vast te stellen ontsmettingsmiddelen.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel108
  - number: '109'
    text: |-
      De minister beslist in elk bijzonder geval op welke wijze het onschadelijk maken, het vernietigen en het reinigen
      en ontsmetten geschiedt en welke reinigings- en ontsmettingsmiddelen daarbij worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel109
  - number: '110.1'
    text: |-
      Na afloop van de reiniging vindt controle plaats door de ambtenaar, bedoeld in
      [artikel 114, tweede lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel114
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '114'
  - number: '110.2'
    text: |-
      Het onschadelijk maken, het vernietigen en de ontsmetting geschieden onder leiding en toezicht van de in eerste lid
      bedoelde persoon.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel110
  - number: '110.3'
    text: De reiniging en ontsmetting wordt door de ambtenaar geregistreerd.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel110
  - number: 110a.1
    text: |-
      Zodra een gebouw of terrein door het plaatsen van een kenteken, ingevolge
      [artikel 22, eerste lid, van de wet][ref1], besmet of van besmetting verdacht is verklaard met klassieke
      varkenspest, mond- en klauwzeer, aviaire influenza, ziekte van Newcastle, Afrikaanse paardepest, of de in bijlage
      I van richtlijn nr. 92/119/EEG genoemde dierziekten, legt de houder van de zieke of verdachte dieren per voor de
      ziekte vatbare diersoort schriftelijk vast:


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel22
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel110a
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '22'
  - number: 110a.1.a
    text: het aantal dieren;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel110a
  - number: 110a.1.b
    text: het aantal gestorven dieren, en
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel110a
  - number: 110a.1.c
    text: het aantal dieren dat verschijnselen van een besmettelijke dierziekte vertoont.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel110a
  - number: 110a.2
    text: |-
      De gegevens van de telling dienen, totdat het kenteken is verwijderd, na een mutatie in de gegevens, bedoeld in het
      eerste lid, zo spoedig mogelijk te worden bijgewerkt.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel110a
  - number: 110b.1
    text: |-
      Indien de houder van een dier vermoedt dat het dier door aviaire influenza, de ziekte van Newcastle, Afrikaanse
      paardepest, of de in bijlage I van richtlijn nr. 92/119/EEG genoemde dierziekten is aangetast:
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel110b
  - number: 110b.1.a
    text: |-
      treft hij, tot de minister de nodig geachte maatregelen neemt, dienstige maatregelen als bedoeld in
      [artikel 22, eerste lid, onderdelen a, b en i van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel22
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel110b
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '22'
  - number: 110b.1.b
    text: draagt hij ervoor zorg dat het dier zijn verblijfplaats niet verlaat;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel110b
  - number: 110b.2
    text: |-
      Op de houder, bedoeld in het eerste lid, zijn de [artikelen 25, eerste lid][ref1], en
      [26, eerste lid, van de wet][ref2] en [artikel 110a][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0018397#Artikel110a
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel110b
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0005662
        artikel: '26'
      - id: ref3
        bwb_id: BWBR0018397
        artikel: 110a
        hoofdstuk: '1'
        paragraaf: '4'
  - number: '111'
    text: In gevallen waarin dit hoofdstuk niet voorziet, beslist de minister.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel111
  - number: '112'
    text: |-
      Als personen of groepen van personen die toegang hebben tot gebouwen, terreinen of gedeelten van gebouwen of
      terreinen waar een kenteken als bedoeld in [artikel 22, eerste lid, van de wet][ref1] is geplaatst, worden
      aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel22
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '22'
  - number: 112.a
    text: |-
      de houder van de dieren die zich in de gebouwen, op de terreinen dan wel de gedeelten van gebouwen of terreinen
      bevinden;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel112
  - number: 112.b
    text: de ambtenaren van de NVWA;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel112
  - number: 112.c
    text: de dierenarts die de dieren behandelt;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel112
  - number: 112.d
    text: de medewerkers van de Gezondheidsdienst voor dieren.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel112
  - number: '113.1'
    text: |-
      Personen die gebouwen of terreinen verlaten waar een kenteken als bedoeld in
      [artikel 22, eerste lid, van de wet][ref1] is geplaatst:


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel22
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '22'
  - number: 113.1.a
    text: |-
      reinigen hun handen en, voorzover de ambtenaar aangeeft dit noodzakelijk te achten, hun overige lichaamsdelen met
      warm water en zeep;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel113
  - number: 113.1.b
    text: laten hun bedrijfskleding en schoeisel achter en reinigen of vernietigen deze en
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel113
  - number: 113.1.c
    text: |-
      ontsmetten hun handen, bedrijfskleding en schoeisel met het door de ambtenaar ter beschikking gestelde
      ontsmettingsmiddel.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel113
  - number: '113.2'
    text: |-
      Indien de in het eerste lid bedoelde personen dieren met zich voeren, reinigen ze de hoeven, de klauwen en de huid
      van deze dieren zorgvuldig door borstelen en wassen. Voorzover de ambtenaar aangeeft dit noodzakelijk te achten
      worden de dieren vervolgens ontsmet met het door de ambtenaar ter beschikking gesteld ontsmettingsmiddel.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel113
  - number: '113.3'
    text: |-
      Indien de in het eerste lid bedoelde personen voertuigen, producten of andere voorwerpen met zich voeren,
      reinigen zij deze zorgvuldig en ontsmetten zij deze vervolgens met het door de ambtenaar ter beschikking gestelde
      ontsmettingsmiddel.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel113
  - number: '113.4'
    text: De in het eerste lid bedoelde personen nemen steeds de aanwijzingen van de ambtenaar in acht.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel113
  - number: 113a.1
    text: |-
      Het is exploitanten van een levensmiddelenbedrijf dat actief is in het stadium van de productie van
      landbouwhuisdieren verboden in strijd te handelen met artikel 18 van [verordening (EG) nr. 178/2002](32002R0178).
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel113a
  - number: 113a.2
    text: Het eerste lid is alleen van toepassing ten aanzien van voedselproducerende dieren.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel113a
  - number: 113b.1
    text: |-
      De minister is de bevoegde autoriteit, bedoeld in de artikelen 3, 4, 5, 6, 7 en 8 van verordening (EG) nr.
      616/2009.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel113b
  - number: 113b.2
    text: Het is verboden in strijd te handelen met de artikelen 5 en 7, eerste lid, van verordening (EG) nr. 616/2009.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel113b
  - number: 113c
    text: |-
      Ingevolge [artikel 2, vierde lid, van het Besluit gebruik sera en entstoffen][ref1] wordt ter behandeling tegen
      rabiës een recombinant vaccin als bedoeld in bijlage III, onderdeel 1, onder a, onder ii, van Verordening (EU) nr.
      576/2013 aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0009198#Artikel2
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel113c
    references:
