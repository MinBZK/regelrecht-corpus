  - number: 23a.1.d
    text: verleent de toezichthouder de medewerking die nodig is voor de uitoefening van zijn taken;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel23a
  - number: 23a.1.e
    text: |-
      voldoet aan [hoofdstuk 4a][ref1] en


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Hoofdstuk4a
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0018397
        hoofdstuk: 4a
  - number: 23a.1.f
    text: |-
      is alleen toegankelijk voor paardachtigen ten aanzien waarvan door de exploitant van het erkende
      paardenverzamelcentrum is gecontroleerd dat zij voldoen aan de in Uitvoeringsverordening (EU) 262/2015 van de
      Commissie van 17 februari 2015 tot vaststelling van voorschriften overeenkomstig de [Richtlijnen 90/427/EEG]
      (31990L0427) en [2009/156/EG](32009L0156) van de Raad met betrekking tot de methoden voor de identificatie van
      paardachtigen (verordening paardenpaspoort) (PbEU L 59) en in paragraaf 7b van de Regeling identificatie en
      registratie van dieren.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel23a
  - number: 23a.2
    text: |-
      De eigenaar of exploitant van het paardenverzamelcentrum, bedoeld in het eerste lid houdt een voor de
      toezichthouder toegankelijk register bij met daarin dezelfde gegevens over paardachtigen die op grond van artikel
      11, tweede lid, van [richtlijn 64/432/EEG](31964L0432) voor runderen zijn vereist.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel23a
  - number: 23a.3
    text: Het register, bedoeld in het tweede lid, wordt minimaal drie jaren bewaard.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel23a
  - number: '24.1'
    text: |-
      Een verzamelcentrum dat is erkend ingevolge [artikel 21, vijfde lid][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel21
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel24
    references:
      - id: ref1
