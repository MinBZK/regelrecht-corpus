        artikel: '3'
  - number: 115b.1
    text: |-
      Een varkensverzamelcentrum, runderverzamelcentrum, schapenverzamelcentrum of geitenverzamelcentrum dat op het
      moment van inwerkingtreding van deze regeling, zoals die luidde onmiddellijk voor inwerkingtreding van de regeling
      van de Minister van Landbouw, Natuur en Voedselkwaliteit houdende wijziging van de Regeling preventie, bestrijding
      en monitoring van besmettelijke dierziekten en zoönosen en TSE’s in verband met de herziening van preventieregels
      voor evenhoevigen (TRCJZ/2008/2676), is erkend:
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel115b
  - number: 115b.1.a
    text: |-
      wordt geacht te zijn erkend ingevolge [artikel 21][ref1], waarbij een verzamelcentrum met een erkenning voor een
      bepaalde categorie runderen wordt geacht te zijn erkend als runderverzamelcentrum, en een schapenverzamelcentrum of
      een geitenverzamelcentrum wordt geacht te zijn erkend als schapen- en geitenverzamelcentrum;


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel21
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel115b
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 115b.1.b
    text: |-
      dient uiterlijk binnen drie maanden na inwerkingtreding van deze regeling het protocol, bedoeld in
      [artikel 21, zesde lid][ref1], in bij de NVWA ter goedkeuring en werkt uiterlijk binnen zes maanden na
      inwerkingtreding van deze regeling overeenkomstig het door de minister goedgekeurde protocol.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel21
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel115b
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 115b.2
    text: |-
      Een reinigings- en ontsmettingsplaats die op het moment van inwerkingtreding van deze regeling, zoals die luidde
      onmiddellijk voor inwerkingtreding van de regeling van de Minister van Landbouw, Natuur en Voedselkwaliteit
      houdende wijziging van de Regeling preventie, bestrijding en monitoring van besmettelijke dierziekten en zoönosen
      en TSE’s in verband met de herziening van preventieregels voor evenhoevigen (TRCJZ/2008/2676), is geregistreerd:
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel115b
  - number: 115b.2.a
    text: |-
      wordt geacht te zijn erkend ingevolge [artikel 26][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel26
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel115b
    references:
