        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 115c.1
    text: |-
      Besluiten tot vrijstelling of ontheffing, niet inhoudende een algemeen verbindend voorschrift, genomen
      krachtens [artikel 7, eerste lid van de Verordening monitoring aviaire influenza (PPE) 2005][ref1]
      of [artikel 12, eerste lid van de Verordening vaccinatie Newcastle disease (PPE) 2006][ref2],
      die golden onmiddellijk voorafgaand aan het tijdstip van inwerkingtreding van dit
      artikel, worden met ingang van 1 juli 2014 geacht te zijn genomen op grond van
      [artikel 107, eerste in samenhang met derde lid, van de Gezondheids- en welzijnswet voor dieren][ref3], onder
      dezelfde voorschriften, beperkingen en voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0018201#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0019971#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0005662#Artikel107
