  - number: '23.2'
    text: |-
      De eigenaar of exploitant van een verzamelcentrum dat is erkend ingevolge [artikel 21][ref1], houdt een voor de
      toezichthouder toegankelijk register bij met daarin de gegevens, bedoeld in artikel 11, tweede lid, van richtlijn
      nr. 64/432/EEG, en de gegevens, bedoeld in [artikel 28, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel28
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel23
