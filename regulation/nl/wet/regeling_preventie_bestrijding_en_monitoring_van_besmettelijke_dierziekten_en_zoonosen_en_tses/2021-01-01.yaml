        artikel: 29f
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 29j.b
    text: |-
      na afloop van de schorsing, bedoeld in [artikel 29i, aanhef en onderdeel a][ref1], nog steeds niet voldoet aan de
      gestelde eisen, of


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel29i
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel29j
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 29i
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 29j.c
    text: |-
      in een periode van twaalf maanden na de schorsing, bedoeld in [artikel 29i, aanhef en onderdeel b][ref1],
      opnieuw varkens van het varkenshouderijbedrijf afvoert of op het bedrijf ontvangt in strijd met de onderscheiden
      [artikelen 40c tot en met 40h][ref2], [40j][ref3] en [40k][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel29i
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel40c
      [ref3]: https://wetten.overheid.nl/BWBR0018397#Artikel40j
      [ref4]: https://wetten.overheid.nl/BWBR0018397#Artikel40k
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel29j
    references:
