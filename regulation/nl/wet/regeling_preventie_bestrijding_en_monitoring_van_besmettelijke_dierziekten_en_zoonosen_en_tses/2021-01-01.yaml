  - number: '24.2'
    text: |-
      De eigenaar of exploitant van een verzamelcentrum dat is erkend ingevolge [artikel 21, vijfde lid][ref1], houdt een
      voor de toezichthouder toegankelijk register bij met daarin de gegevens, bedoeld in artikel 8bis, tweede lid, van
      richtlijn nr. 91/68/EEG, en de gegevens, bedoeld in [artikel 28, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel28
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0018397
        artikel: '28'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '24.3'
    text: Het register, bedoeld in het tweede lid, wordt minimaal drie jaren bewaard.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel24
  - number: '25.1'
    text: |-
      Indien een verzamelcentrum niet of niet meer aan de eisen, bedoeld in
      [artikel 21, eerste tot en met vijfde lid en zevende lid][ref1], voldoet, of niet aan de verplichtingen opgenomen
      in [artikel 23][ref2], respectievelijk [23a][ref3] en [24][ref4] voldoet, kan de minister:


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0018397#Artikel23a
      [ref4]: https://wetten.overheid.nl/BWBR0018397#Artikel24
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0018397
        artikel: '23'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref3
        bwb_id: BWBR0018397
        artikel: 23a
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref4
        bwb_id: BWBR0018397
        artikel: '24'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 25.1.a
    text: nadere voorschriften verbinden aan de erkenning;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel25
  - number: 25.1.b
    text: de erkenning met onmiddellijke ingang schorsen of intrekken.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel25
  - number: '25.2'
    text: |-
      De minister kan de nadere voorschriften intrekken of een schorsing beëindigen indien ten genoegen van de minister
      is aangetoond dat het verzamelcentrum volledig aan alle eisen voldoet.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel25
  - number: '25.3'
    text: |-
      De minister kan bepalen dat aan een verzamelcentrum voor een bepaalde periode volgend op de intrekking van een
      erkenning, geen nieuwe erkenning wordt verleend.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel25
  - number: '26.1'
    text: |-
      Erkenning van een reinigings- en ontsmettingsplaats door de minister vindt plaats, indien: a. de plaats zodanig
      is ingericht en wordt geëxploiteerd dat een deugdelijke en efficiënte reiniging en ontsmetting van vervoermiddelen
      kan plaatsvinden ongeacht het type vervoermiddel en onder alle klimatologische omstandigheden. De reiniging en
      ontsmetting wordt zodanig uitgevoerd dat de bioveiligheid niet in gevaar komt.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel26
  - number: '26.2'
    text: |-
      De wijze van exploitatie en van reiniging en ontsmetting wordt vastgelegd in een protocol dat moet worden
      goedgekeurd door de minister.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel26
  - number: '26.3'
    text: |-
      Een reinigings- en ontsmettingsplaats die onderdeel uitmaakt van een ingevolge
      [artikel 21, eerste of vijfde lid][ref1], erkende verzamelplaats, wordt beschouwd als een ingevolge het eerste lid
      erkende reinigings- en ontsmettingsplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel21
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '27.1'
    text: |-
      De aanvraag om een erkenning als bedoeld in [artikel 26, eerste lid][ref1], wordt schriftelijk ingediend bij de
      minister.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel26
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '26'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '27.2'
    text: |-
      De aanvraag gaat vergezeld van het protocol, bedoeld in [artikel 26, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel26
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '26'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '27.3'
    text: De minister houdt een register bij van erkende reinigings- en ontsmettingsplaatsen dat ter inzage ligt bij de NVWA.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel27
  - number: '28.1'
    text: |-
      De eigenaar of exploitant van een ingevolge [artikel 26][ref1] erkende reinigings- en ontsmettingsplaats:


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel26
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '26'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 28.1.a
    text: |-
      draagt er zorg voor dat de exploitatie en de reiniging en ontsmetting van de vervoermiddelen geschiedt
      overeenkomstig het door de minister goedgekeurde protocol;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel28
  - number: 28.1.b
    text: |-
      draagt er zorg voor dat elke reiniging en ontsmetting plaatsvindt onder zijn toezicht of onder toezicht van een
      vertegenwoordiger van de eigenaar of exploitant;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel28
  - number: 28.1.c
    text: |-
      voorziet het register van de vervoerder, bedoeld in [artikel 32][ref1], van een stempel en handtekening. Indien
      de reiniging en ontsmetting onder toezicht van een vertegenwoordiger wordt uitgevoerd als bedoeld in onderdeel b,
      voorziet deze het register van een stempel en een handtekening.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel32
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '32'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '28.2'
    text: |-
      De eigenaar of exploitant van een reinigings- en ontsmettingsplaats die is erkend ingevolge
      [artikel 26, eerste lid][ref1], houdt een register bij waarin ten aanzien van elke reiniging en ontsmetting van een
      vervoermiddel wordt vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel26
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '26'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 28.2.a
    text: de datum en het tijdstip waarop de reiniging en ontsmetting heeft plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel28
  - number: 28.2.b
    text: |-
      het kenteken van het desbetreffende vervoermiddel en bij gebreke daarvan de naam, het adres en de woonplaats van
      de vervoerder.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel28
  - number: '28.3'
    text: |-
      De eigenaar of exploitant van een reinigings- en ontsmettingsplaats bewaart de gegevens die zijn opgenomen in het
      register, bedoeld in het tweede lid, gedurende drie jaren.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel28
  - number: '29.1'
    text: |-
      Indien een reinigings- en ontsmettingsplaats niet of niet meer aan de eisen, bedoeld in
      [artikel 26, eerste lid][ref1], voldoet, of niet aan de verplichtingen opgenomen in [artikel 28][ref2] voldoet, kan
      de minister de erkenning met onmiddellijke ingang schorsen of intrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel28
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '26'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0018397
        artikel: '28'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '29.2'
    text: |-
      De minister kan een schorsing beëindigen indien ten genoegen van de minister is aangetoond dat de reinigings- en
      ontsmettingsplaats volledig aan alle eisen voldoet.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel29
  - number: 29a
    text: |-
      In deze paragraaf en [paragraaf 4.3.1][ref1] wordt verstaan onder:


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0018397
        hoofdstuk: '4'
        paragraaf: 4.3.1
  - number: 29a.a
    text: |-
      *varkenshouderijbedrijf:* locatie van een landbouwbedrijf, niet zijnde een erkend varkensspermawincentrum
      als bedoeld in [artikel 3 van het Besluit eisen dierlijk sperma en spermawincentrum][ref1], waar slechts één
      varkenshouder actief is en waar, anders dan voor educatieve doeleinden, vijf of meer varkens worden gehouden dan
      wel een locatie die daarvoor bestemd is;


      [ref1]: https://wetten.overheid.nl/BWBR0010619#Artikel3
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0010619
        artikel: '3'
  - number: 29a.b
    text: |-
      *cluster:* combinatie van ten hoogste drie C-bedrijven als bedoeld in [artikel 29d][ref1], die uitsluitend van één
      en hetzelfde A-bedrijf als bedoeld in [artikel 29b][ref2] of E-bedrijf als bedoeld in [artikel 29e][ref3] varkens
      ontvangt;


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel29d
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel29b
      [ref3]: https://wetten.overheid.nl/BWBR0018397#Artikel29e
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 29d
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0018397
        artikel: 29b
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref3
        bwb_id: BWBR0018397
        artikel: 29e
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 29a.c
    text: |-
      *toevoegstal:* stal, die is afgescheiden van de rest van het varkenshouderijbedrijf en waarvan inrichting en
      gebruik voldoen aan de in bijlage I opgenomen voorschriften;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel29a
  - number: 29a.d
    text: '*big:* pasgeboren varken, niet zijnde speenbig;'
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel29a
  - number: 29a.e
    text: |-
      *speenbig:* varken van ten minste drie en ten hoogste twaalf weken oud dat niet meer wordt gezoogd door zijn
      moeder.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel29a
  - number: 29b.1
    text: |-
      De minister wijst op aanvraag een varkenshouderijbedrijf aan als een A-bedrijf, indien het bedrijf ten genoegen van
      de minister aantoont te voldoen aan de in het tweede lid gestelde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel29b
  - number: 29b.2
    text: 'Een A-bedrijf voldoet aan de volgende voorwaarden:'
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel29b
  - number: 29b.2.a
    text: vrouwelijke varkens worden gehouden voor het produceren van biggen;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel29b
  - number: 29b.2.b
    text: |-
      indien het bedrijf beschikt over een toevoegstal, voldoen inrichting en gebruik aan de in [bijlage 24][ref1]
      opgenomen eisen;


      [ref1]: https://wetten.overheid.nl/BWBR0018397
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel29b
    references:
      - id: ref1
        bwb_id: BWBR0018397
  - number: 29b.2.c
    text: |-
      een dierenarts neemt eenmaal per maand monsters van de aanwezige varkens overeenkomstig de procedure
      van [bijlage 25][ref1] ten behoeve van serologisch onderzoek door een erkend laboratorium als bedoeld in
      [artikel 2 van de Regeling erkenning en aanwijzing veterinaire laboratoria][ref2] als het gaat om de ziekte van
      Aujeszky en door Wageningen Bioveterinary Research als het gaat om klassieke varkenspest;


      [ref1]: https://wetten.overheid.nl/BWBR0018397
      [ref2]: https://wetten.overheid.nl/BWBR0019575#Artikel2
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel29b
    references:
      - id: ref1
        bwb_id: BWBR0018397
      - id: ref2
        bwb_id: BWBR0019575
        artikel: '2'
  - number: 29b.2.d
    text: |-
      op het bedrijf is een douche aanwezig, die is gelegen in de onmiddellijke nabijheid van de ingang van het
      varkenshouderijbedrijf, waarvan bezoekers van het varkenshouderijbedrijf voorafgaand aan het betreden van de
      stallen gebruik maken;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel29b
  - number: 29b.2.e
    text: |-
      het bedrijf is voorzien van een erfafscheiding waardoor het betreden van het varkenshouderijbedrijf zonder de
      medewerking van de varkenshouder niet mogelijk is;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel29b
  - number: 29b.2.f
    text: op het bedrijf is een voorziening voor reiniging en ontsmetting van vervoermiddelen aanwezig.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel29b
  - number: 29b.3
    text: |-
      De varkenshouder stelt de uitslag van het serologisch onderzoek beschikbaar aan de minister waaruit moet blijken
      dat geen varkens zijn aangetroffen waarvan het bloed antilichamen tegen klassieke varkenspest of gB-antilichamen
      tegen de ziekte van Aujeszky bevat.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel29b
  - number: 29c
    text: |-
      De minister wijst op aanvraag een varkenshouderijbedrijf aan als een B-bedrijf, indien op het
      varkenshouderijbedrijf vrouwelijke varkens worden gehouden voor het produceren van biggen.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel29c
  - number: 29d
    text: |-
      De minister wijst op aanvraag een varkenshouderijbedrijf aan als een C-bedrijf, indien het bedrijf
      biggen opfokt tot geslachtsrijpe varkens en ten genoegen van de minister aantoont te voldoen aan de in
      [artikel 29b, tweede lid, onderdelen c tot en met f en derde lid][ref1], gestelde voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel29b
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel29d
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 29b
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 29e
    text: |-
      De minister wijst op aanvraag een varkenshouderijbedrijf aan als een E-bedrijf, indien het bedrijf speenbiggen
      houdt, uitsluitend afkomstig van één A-bedrijf waarmee een vaste relatie is aangegaan en het bedrijf ten genoegen
      aantoont te voldoen aan de in [artikel 29b, tweede lid, onderdelen c tot en met f en derde lid][ref1], gestelde
      voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel29b
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel29e
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 29b
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 29f
    text: |-
      De minister wijst op aanvraag een varkenshouderijbedrijf aan als een F-bedrijf, indien het bedrijf speenbiggen
      houdt, uitsluitend afkomstig van één B-bedrijf waarmee een vaste relatie is aangegaan.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel29f
  - number: 29g
    text: |-
      De minister wijst op aanvraag een locatie waar varkens worden gehouden aan als een RE-bedrijf, indien op die
      locatie minder dan 5 varkens met hun biggen worden gehouden.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel29g
  - number: 29h
    text: |-
      Een varkenshouderijbedrijf of een locatie waar 5 of meer varkens worden gehouden waarvoor geen aanvraag voor een
      status bij de minister is ingediend, heeft de status D-bedrijf.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel29h
  - number: 29ha.1
    text: |-
      Indien sprake is van een cluster wordt dit bij de aanvraag, bedoeld in [artikel 29b, eerste lid][ref1], of
      [artikel 29e][ref2], gemeld met gebruikmaking van een middel dat daartoe door de minister beschikbaar is gesteld,
      waarbij wordt opgegeven de samenstelling van het cluster en de verdeling van het aantal afvoeradressen onder de
      C-bedrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel29b
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel29e
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel29ha
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 29b
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0018397
        artikel: 29e
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 29ha.2
    text: |-
      De samenstelling van een cluster en de verdeling van het aantal afvoeradressen kunnen in een periode van twaalf
      maanden eenmaal worden gewijzigd. Een wijziging van de samenstelling van het cluster en de verdeling van het aantal
      afvoeradressen wordt voorafgaand aan de toepassing van de wijziging aan de minister gemeld met gebruikmaking van
      een middel, dat daartoe door de minister beschikbaar is gesteld.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel29ha
  - number: 29hb.1
    text: |-
      Indien sprake is van een vaste relatie tussen een A-bedrijf en een E-bedrijf of tussen een B-bedrijf en een F-
      bedrijf, wordt dit aan de minister gemeld met gebruikmaking van een middel dat daartoe door de minister beschikbaar
      is gesteld.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel29hb
  - number: 29hb.2
    text: |-
      Een vaste relatie als bedoeld in het eerste lid kan eenmaal per twaalf maanden wijzigen. Een wijziging wordt
      voorafgaand aan de toepassing van de wijziging aan de minister gemeld met gebruikmaking van een middel, dat daartoe
      door de minister beschikbaar is gesteld.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel29hb
  - number: 29i.1
    text: |-
      De minister kan de aanwijzing als A-bedrijf, B-bedrijf, C-bedrijf, E-bedrijf of F-bedrijf met onmiddellijke ingang
      schorsen voor een termijn van ten hoogste 12 weken, indien het varkenshouderijbedrijf:
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel29i
  - number: 29i.1.a
    text: |-
      niet voldoet aan de voorwaarden voor de aanwijzing, bedoeld in de [artikelen 29b][ref1], [29c][ref2], [29d][ref3],
      [29e][ref4], onderscheidenlijk [29f][ref5], of


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel29b
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel29c
      [ref3]: https://wetten.overheid.nl/BWBR0018397#Artikel29d
      [ref4]: https://wetten.overheid.nl/BWBR0018397#Artikel29e
      [ref5]: https://wetten.overheid.nl/BWBR0018397#Artikel29f
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel29i
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 29b
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0018397
        artikel: 29c
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref3
        bwb_id: BWBR0018397
        artikel: 29d
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref4
        bwb_id: BWBR0018397
        artikel: 29e
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref5
        bwb_id: BWBR0018397
        artikel: 29f
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 29i.1.b
    text: |-
      in een periode van twaalf maanden meer dan eenmaal varkens heeft vervoerd of ontvangen in strijd met de
      onderscheiden [artikelen 40c tot en met 40h][ref1], [40j][ref2] en [40k][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel40c
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel40j
      [ref3]: https://wetten.overheid.nl/BWBR0018397#Artikel40k
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel29i
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 40c
        hoofdstuk: '4'
        paragraaf: 4.3.1
      - id: ref2
        bwb_id: BWBR0018397
        artikel: 40j
        hoofdstuk: '4'
        paragraaf: 4.3.1
      - id: ref3
        bwb_id: BWBR0018397
        artikel: 40k
        hoofdstuk: '4'
        paragraaf: 4.3.1
  - number: 29i.2
    text: |-
      In geval van schorsing van de aanwijzing, bedoeld in het eerste lid, mogen geen varkens meer worden aangevoerd of
      afgevoerd anders dan naar een slachthuis of naar een varkensbedrijf buiten Nederland, hetzij rechtstreeks, hetzij
      via een verzamelcentrum.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel29i
  - number: 29j
    text: |-
      De minister kan de aanwijzing als A-bedrijf, B-bedrijf, C-bedrijf, E-bedrijf of F-bedrijf intrekken, indien het
      varkenshouderijbedrijf:
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel29j
  - number: 29j.a
    text: |-
      niet voldoet aan de voorwaarden voor de aanwijzing, bedoeld in de [artikelen 29b][ref1], [29c][ref2], [29d][ref3],
      [29e][ref4], onderscheidenlijk [29f][ref5], nadat de varkenshouder in de gelegenheid is gesteld binnen een termijn
      van ten hoogste zes weken alsnog aan de voorwaarden te voldoen en deze termijn inmiddels is verstreken,


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel29b
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel29c
      [ref3]: https://wetten.overheid.nl/BWBR0018397#Artikel29d
      [ref4]: https://wetten.overheid.nl/BWBR0018397#Artikel29e
      [ref5]: https://wetten.overheid.nl/BWBR0018397#Artikel29f
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel29j
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 29b
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0018397
        artikel: 29c
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref3
        bwb_id: BWBR0018397
        artikel: 29d
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref4
        bwb_id: BWBR0018397
        artikel: 29e
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref5
