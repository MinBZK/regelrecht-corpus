        artikel: 29i
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0018397
        artikel: 40c
        hoofdstuk: '4'
        paragraaf: 4.3.1
      - id: ref3
        bwb_id: BWBR0018397
        artikel: 40j
        hoofdstuk: '4'
        paragraaf: 4.3.1
      - id: ref4
        bwb_id: BWBR0018397
        artikel: 40k
        hoofdstuk: '4'
        paragraaf: 4.3.1
  - number: 29j.d
    text: |-
      ligt in een vaccinatiegebied dat is ingesteld na een uitbraak van de ziekte van Aujeszky. De minister kan
      voorwaarden stellen voor de aan- en afvoer van varkens.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel29j
  - number: 29k.a
    text: |-
      De minister kan de aanwijzing als RE-bedrijf intrekken, indien de varkenshouder van de betreffende locatie niet
      voldoet aan de voorwaarden voor de aanwijzing, bedoeld in [artikel 29g][ref1], nadat de varkenshouder in de
      gelegenheid is gesteld binnen een termijn van ten hoogste zes weken alsnog aan de voorwaarden te voldoen en deze
      termijn inmiddels is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel29g
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel29k
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 29g
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 29k.b
    text: De intrekking als bedoeld in het eerste lid heeft een minimale duur van twaalf maanden.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel29k
  - number: '30.1'
    text: |-
      Het is verboden om een ongeladen vervoermiddel waarmee een of meer evenhoevigen zijn vervoerd, op de openbare
      weg te brengen, dan wel op een plaats of bedrijf waar evenhoevigen worden gehouden, op een slachthuis of op een
      verzamelcentrum voor evenhoevigen.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel30
  - number: '30.2'
    text: |-
      Het eerste lid is niet van toepassing indien het vervoermiddel is gereinigd en ontsmet overeenkomstig de
      [artikelen 31][ref1], [34][ref2] of [35][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0018397#Artikel35
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0018397
        artikel: '34'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref3
        bwb_id: BWBR0018397
        artikel: '35'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '30.3'
    text: |-
      Het verbod, bedoeld in het eerste lid, is niet van toepassing op het vervoer, bedoeld in
      [artikel 31, tweede tot en met vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel31
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '31.1'
    text: |-
      De vervoerder is verplicht een vervoermiddel of vervoerseenheid, met inbegrip van de daarbij behorende voorwerpen,
      waarmee een of meer evenhoevigen zijn vervoerd terstond na de lossing, in ieder geval voordat de vervoerseenheid of
      het vervoermiddel op de openbare weg wordt gebracht, op de plaats van lossing te reinigen en te ontsmetten met een
      toegelaten ontsmettingsmiddel op zodanige wijze dat de bioveiligheid niet in gevaar komt.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel31
  - number: '31.2'
    text: |-
      Het eerste lid is niet van toepassing op het vervoer van evenhoevigen, niet zijnde varkens, die rechtstreeks van de
      stal of de weide naar een andere weide van hetzelfde bedrijf worden vervoerd met een vervoermiddel, voor zover het
      vervoermiddel zo spoedig mogelijk na dit vervoer wordt gereinigd en ontsmet.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel31
  - number: '31.3'
    text: |-
      Het eerste lid is niet van toepassing op het vervoer van evenhoevigen, niet zijnde varkens, die rechtstreeks van
      een bedrijf naar een weide van ander bedrijf worden vervoerd met een vervoermiddel, voor zover het vervoermiddel zo
      spoedig mogelijk na dit vervoer wordt gereinigd en ontsmet.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel31
  - number: '31.4'
    text: |-
      Het eerste lid is niet van toepassing op het vervoer van een vervoermiddel over de openbare weg vanaf een
      slachtplaats met geringe capaciteit, waarvan de eigenaar of exploitant beschikt over een vergunning als bedoeld in
      [artikel 18, zesde lid][ref1], indien het vervoermiddel direct na lossing op de slachtplaats rechtstreeks, langs
      de kortste weg naar de in de vergunning aangewezen reinings- en ontsmettingsplaats rijdt om aldaar gereinigd en
      ontsmet te worden.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel18
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '18'
        hoofdstuk: '1'
  - number: '32.1'
    text: |-
      De vervoerder van een vervoermiddel waarmee evenhoevigen worden vervoerd, houdt een register bij met daarin de
      volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel32
  - number: 32.1.a
    text: |-
      een aantekening van de datum en het tijdstip van elke reiniging en ontsmetting die heeft plaatsgevonden ingevolge
      de [artikelen 31][ref1], [34][ref2] of [35][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0018397#Artikel35
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0018397
        artikel: '34'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref3
        bwb_id: BWBR0018397
        artikel: '35'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 32.1.b
    text: |-
      voor zover de reiniging en ontsmetting heeft plaatsgevonden op een erkende reinigings- en ontsmettingsplaats
      als bedoeld in [artikel 26][ref1], is de aantekening, bedoeld in onderdeel a, voorzien van het stempel van de
      eigenaar of exploitant van de plaats, alsmede van een de handtekening van de eigenaar of exploitant of zijn
      vertegenwoordiger;


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel26
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '26'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 32.1.c
    text: |-
      in het geval het vervoer van runderen of varkens betreft, de gegevens, bedoeld in artikel 12, tweede lid, van
      richtlijn nr. 64/432/EEG;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel32
  - number: 32.1.d
    text: |-
      in het geval het vervoer van schapen of geiten betreft de gegevens, bedoeld in artikel 8 quater, tweede lid, van
      richtlijn nr. 91/68/EEG.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel32
  - number: '32.2'
    text: Uit het register, bedoeld in het eerste lid, blijkt op welk vervoermiddel het register betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel32
  - number: '32.3'
    text: |-
      De vervoerder draagt er zorg voor dat de gegevens met betrekking tot de reiniging en ontsmetting die laatstelijk
      heeft plaatsgevonden op het desbetreffende vervoermiddel aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel32
  - number: '32.4'
    text: |-
      De vervoerder bewaart de gegevens die zijn opgenomen in het register, bedoeld in het eerste lid, gedurende drie
      jaren.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel32
  - number: '33.1'
    text: |-
      Een vervoermiddel waarmee een of meer evenhoevigen worden vervoerd, wordt na aankomst op de plaats van bestemming
      geheel gelost.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel33
  - number: '33.2'
    text: |-
      Indien een vervoermiddel bestaat uit twee of meer vervoerseenheden, mogen de vervoerseenheden in afwijking van het
      eerste lid op verschillende plaatsen worden gelost, mits iedere vervoerseenheid in één keer geheel wordt gelost.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel33
  - number: '33.3'
    text: |-
      In afwijking van het eerste en tweede lid, mag een vervoersmiddel, onderscheidenlijk een vervoerseenheid op twee
      verschillende plaatsen worden gelost, indien de vervoerder deelneemt aan een ingevolge [artikel 56][ref1] erkend
      kwaliteitssysteem.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel56
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '56'
        hoofdstuk: '6'
  - number: '33.4'
    text: Het tweede lid is niet van toepassing op varkens, voor zover het gaat om het lossen op een varkenshouderijbedrijf.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel33
  - number: '34.1'
    text: |-
      Een vervoermiddel waarmee een of meer evenhoevigen in Nederland worden gebracht, afkomstig uit een
      lidstaat of een derde land, en dat wordt gelost op een plaats die niet beschikt over een ingevolge
      [artikel 26, eerste lid][ref1], erkende reinigings- en ontsmettingsplaats, wordt na reiniging en ontsmetting als
      bedoeld in [artikel 31, eerste lid][ref2], onmiddellijk vervoerd naar een ingevolge [artikel 26, eerste lid][ref3],
      erkende reinigings- en ontsmettingsplaats, om aldaar te worden gereinigd en ontsmet.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0018397#Artikel26
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '26'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0018397
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref3
        bwb_id: BWBR0018397
        artikel: '26'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '34.2'
    text: |-
      Indien het vervoermiddel, bedoeld in het eerste lid, afkomstig is vanuit een lidstaat waar een uitbraak van
      een besmettelijke dierziekte als bedoeld in [artikel 2, onderdeel a, b, c, d, l, s, t, u, v, x, y, z][ref1], is
      bevestigd, overlegt de vervoerder binnen 24 uur na binnenkomst in Nederland bij de minister een bewijs van de
      reiniging en ontsmetting waaruit in ieder geval blijkt welk lokaal referentienummer en voor zover van toepassing
      welk referentienummer van het certificaat, bedoeld in verordening (EG) nr. 599/2004, het meest recentelijk voor het
      desbetreffende vervoermiddel is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel2
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '35.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op een vervoermiddel dat kennelijk is gebruikt voor het vervoeren
      van evenhoevigen in Litouwen, Polen of Estland en vanuit daar anders dan in doorvoer leeg in Nederland wordt
      gebracht.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel35
  - number: '36.1'
    text: Het is verboden evenhoevigen afkomstig van verschillende plaatsen bijeen te brengen.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel36
  - number: '36.2'
    text: |-
      Het verbod, bedoeld in het eerste lid, is niet van toepassing indien het bijeenbrengen betreft van diersoorten en
      diercategorieën genoemd in de [artikelen 37][ref1] tot en met [52][ref2] en deze dieren worden aangevoerd, vervoerd
      en afgevoerd overeenkomstig die artikelen en wordt voldaan aan de verplichtingen opgenomen in die artikelen.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel52
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '37'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0018397
        artikel: '52'
        hoofdstuk: '4'
        paragraaf: '4.5'
  - number: '36.3'
    text: |-
      Het is verboden evenhoevigen aan te voeren die in strijd met de in dit hoofdstuk opgenomen bepalingen zijn
      bijeengebracht, afgevoerd of vervoerd.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel36
  - number: '37.1'
    text: 'Evenhoevigen afkomstig van verschillende plaatsen mogen bijeen worden gebracht op:'
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel37
  - number: 37.1.a
    text: een vervoerseenheid of vervoermiddel;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel37
  - number: 37.1.b
    text: een slachthuis;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel37
  - number: 37.1.c
    text: een bedrijf of elke andere plaats, niet zijnde een plaats als bedoeld in de onderdelen b, d of e;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel37
  - number: 37.1.d
    text: |-
      een ingevolge [artikel 21][ref1] voor de desbetreffende diersoort erkend verzamelcentrum, of


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel21
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 37.1.e
    text: een tentoonstelling of een keuring.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel37
  - number: '37.2'
    text: Het eerste lid, onderdeel a, is niet van toepassing op varkens, niet zijnde slachtvarkens.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel37
  - number: '37.3'
    text: |-
      Het eerste lid, onderdeel d, is niet van toepassing op runderen, niet zijnde fokrunderen, slachtrunderen,
      mestrunderen of runderen jonger dan 12 maanden.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel37
  - number: '37.4'
    text: Het eerste lid, onderdeel c, is niet van toepassing op varkens, niet zijnde slachtvarkens.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel37
  - number: '37.5'
    text: Het eerste lid, onderdeel e, is niet van toepassing op varkens.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel37
  - number: 37a.1
    text: Het overladen van evenhoevigen van een vervoerseenheid naar een andere vervoerseenheid is verboden.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel37a
  - number: 37a.2
    text: |-
      Het verbod, bedoeld in het eerste lid, is niet van toepassing op het overladen van een voorwagen op een lege
      aanhangwagen, beide behorend tot hetzelfde vervoermiddel, dat geschiedt op een reinigings- en ontsmettingsplaats
      als bedoeld in [artikel 20, eerste lid][ref1], of [artikel 26, eerste lid][ref2], indien:


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel26
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '20'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0018397
        artikel: '26'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 37a.2.a
    text: |-
      na het overladen de voorwagen van het vervoermiddel onmiddellijk gereinigd en ontsmet wordt op de reinigings- en
      ontsmettingsplaats waar het overladen heeft plaatsgevonden, en
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel37a
  - number: 37a.2.b
    text: |-
      voldaan wordt aan de [artikelen 19][ref1], [28][ref2], [31, eerste lid][ref3], en [32, eerste lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0018397#Artikel31
      [ref4]: https://wetten.overheid.nl/BWBR0018397#Artikel32
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '19'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0018397
        artikel: '28'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref3
        bwb_id: BWBR0018397
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref4
        bwb_id: BWBR0018397
        artikel: '32'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '38.1'
    text: |-
      Op een verzamelcentrum worden niet tegelijkertijd verschillende diersoorten, diercategorieën of evenhoevigen met
      een verschillende gezondheidsstatus bijeen gebracht.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel38
  - number: '38.2'
    text: |-
      Het eerste lid is niet van toepassing op het tegelijkertijd bijeenbrengen op een schapen- en geitenverzamelcentrum
      van:
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel38
  - number: 38.2.a
    text: slachtschapen en slachtgeiten met dezelfde gezondheidsstatus;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel38
  - number: 38.2.b
    text: fokschapen en fokgeiten met dezelfde gezondheidsstatus, en
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel38
  - number: 38.2.c
    text: mestschapen en mestgeiten met dezelfde gezondheidsstatus.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel38
  - number: '38.3'
    text: |-
      Het eerste lid is niet van toepassing op het tegelijkertijd bijeenbrengen op een runderverzamelcentrum van
      fokrunderen met een verschillende gezondheidsstatus, mits de fokrunderen met een verschillende gezondheidsstatus in
      afzonderlijke epidemiologische eenheden afgescheiden van elkaar worden gehouden.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel38
  - number: '38.4'
    text: |-
      Het eerste lid is niet van toepassing op het tegelijkertijd bijeenbrengen op een runderverzamelcentrum van
      fokrunderen met een verschillende gezondheidsstatus en runderen, jonger dan 12 weken, mits de fokrunderen met
      een verschillende gezondheidsstatus en de runderen, jonger dan 12 weken, in afzonderlijke epidemiologische
      eenheden afgescheiden van elkaar worden gehouden en er gedurende de blokperiode van de laatstgenoemde dieren geen
      fokrunderen worden aan- of afgevoerd.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel38
  - number: '38.5'
    text: |-
      Het eerste lid is niet van toepassing op het tegelijkertijd bijeenbrengen op een runderverzamelcentrum van
      fokrunderen met een verschillende gezondheidsstatus en slachtrunderen, mits de fokrunderen en de slachtrunderen in
      afzonderlijke epidemiologische eenheden afgescheiden van elkaar worden gehouden en er gedurende de blokperiode van
      de slachtrunderen geen fokrunderen worden aan- of afgevoerd.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel38
  - number: '38.6'
    text: |-
      Het eerste lid is niet van toepassing op het tegelijkertijd bijeenbrengen van runderen, schapen en geiten op een
      tentoonstelling of een keuring, mits deze zodanig is ingericht dat de verschillende diersoorten niet met elkaar in
      contact kunnen komen.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel38
  - number: 38a.1
    text: |-
      In afwijking van [artikel 37, eerste lid][ref1], worden mestrunderen van een mesterij hetzij rechtstreeks, hetzij
      via een erkend verzamelcentrum, afgevoerd naar en bijeengebracht op:


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel37
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel38a
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '37'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 38a.1.a
    text: een al dan niet in Nederland gelegen slachthuis;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel38a
  - number: 38a.1.b
    text: één of meer niet in Nederland gelegen bedrijven.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel38a
  - number: 38a.2
    text: |-
      In afwijking van het eerste lid mogen mestrunderen jonger dan 16 weken en die zijn geboren op een mesterij, hetzij
      rechtstreeks, hetzij via een erkend verzamelcentrum, worden afgevoerd naar een andere mesterij indien er in de
      laatste 21 dagen voor de afvoer geen evenhoevigen meer zijn aangevoerd op de mesterij van herkomst.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel38a
  - number: 38a.3
    text: |-
      In afwijking van het eerste lid mogen mestrunderen ouder dan 6 weken en jonger dan 12 maanden eenmalig, hetzij
      rechtstreeks, hetzij via een erkend verzamelcentrum, worden afgevoerd naar een andere mesterij in Nederland.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel38a
  - number: 38b.1
    text: |-
      De eigenaar of exploitant van een mesterij als bedoeld in [artikel 38a][ref1] meldt de mesterij aan bij de
      minister.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel38a
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel38b
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 38a
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 38b.2
    text: |-
      De eigenaar of exploitant kan de mesterij afmelden bij de minister indien zich op de mesterij geen mestrunderen
      meer bevinden en er gedurende 21 dagen vóór de afmelding overeenkomstig de [artikelen 38a][ref1] of [46][ref2] geen
      evenhoevigen op de mesterij zijn aangevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel38a
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel46
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel38b
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 38a
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0018397
        artikel: '46'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: 38b.3
    text: |-
      Het tweede lid is niet van toepassing op de eigenaar of exploitant van een mesterij die bedrijfsmatig mestrunderen
      jonger dan 12 maanden houdt.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel38b
  - number: 38b.4
    text: |-
      Voor de aan- en afmelding, bedoeld in het eerste en tweede lid, is de eigenaar of exploitant een retributie
      verschuldigd van 25 euro per melding.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel38b
  - number: '39.1'
    text: |-
      Indien evenhoevigen bijeen worden gebracht op een slachthuis, worden de evenhoevigen niet van het slachthuis
      afgevoerd.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel39
  - number: '39.2'
    text: |-
      Het eerste lid is niet van toepassing indien een besluit is genomen als bedoeld in artikel 43, zesde lid, tweede
      alinea, van verordening (EU) 2019/627.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel39
  - number: '40.1'
    text: |-
      Indien evenhoevigen, met uitzondering van varkens, bijeen worden gebracht op een bedrijf of plaats als bedoeld
      in [artikel 37, eerste lid, onder c][ref1], of daar worden gelost vanaf een vervoerseenheid of een vervoermiddel,
      bedoeld in artikel 37, eerste lid, onderdeel a, verblijven die evenhoevigen ten minste 21 dagen op dat bedrijf of
      die plaats alvorens zij worden afgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel37
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '37'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '40.2'
    text: |-
      Het eerste lid is niet van toepassing op evenhoevigen die na afloop van een tentoonstelling of keuring worden
      aangevoerd op een bedrijf of plaats en weer van dat bedrijf of die plaats worden afgevoerd ten behoeve van een
      tentoonstelling of keuring.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel40
  - number: 40a
    text: Aan- of afvoer van één of meer varkens vanaf of naar een varkenshouderijbedrijf is verboden.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel40a
  - number: 40b
    text: |-
      Het verbod, bedoeld in [artikel 40a][ref1], is niet van toepassing op het vervoer van:


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel40a
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel40b
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 40a
        hoofdstuk: '4'
        paragraaf: 4.3.1
  - number: 40b.a
    text: |-
      één of meer varkens van of naar een A-bedrijf, B-bedrijf, C-bedrijf, E-bedrijf of F-bedrijf of naar een D-bedrijf
      met een toestemming als bedoeld in [artikel 40l][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel40l
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel40b
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 40l
        hoofdstuk: '4'
        paragraaf: 4.3.1
  - number: 40b.b
    text: |-
      één of meer varkens van een varkenshouderijbedrijf naar een slachthuis, hetzij
      rechtstreeks, hetzij via een verzamelcentrum en uit het vervoersdocument, bedoeld in
      [artikel 30, eerste lid, van de Regeling identificatie en registratie van dieren][ref1] blijkt dat sprake is van
      vervoer van slachtvarkens;


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel30
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel40b
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '30'
  - number: 40b.c
    text: |-
      één of meer mannelijke varkens van een varkenshouderijbedrijf naar een quarantaineruimte in een
      varkensspermawincentrum;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel40b
  - number: 40b.d
    text: |-
      één of meer varkens van een varkenshouderijbedrijf naar een onderzoeksinstituut dat in het bezit is van een
      vergunning op basis van [artikel 2 van de Wet op de dierproeven][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel2
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel40b
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: '2'
  - number: 40b.e
    text: ten hoogste vier varkens per levering van een varkenshouderijbedrijf naar een RE-bedrijf;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel40b
  - number: 40b.f
    text: |-
      één of meer varkens van een varkenshouderijbedrijf naar een varkenshouderijbedrijf buiten Nederland, hetzij
      rechtstreeks, hetzij via een verzamelcentrum;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel40b
  - number: 40b.g
    text: |-
      één of meer varkens afkomstig van een varkenshouderijbedrijf of verzamelcentrum buiten Nederland die op een
      varkenshouderijbedrijf worden ontvangen.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel40b
  - number: 40c.1
    text: |-
      In afwijking van artikel 40a is het vervoer naar een A-bedrijf toegestaan van vrouwelijke varkens afkomstig van ten
      hoogste één ander A-bedrijf, C-bedrijf, E-bedrijf, of één varkenshouderijbedrijf buiten Nederland en van mannelijke
      varkens afkomstig van ten hoogste één ander A-bedrijf, C-bedrijf, E-bedrijf, varkensspermawincentrum of één
      varkenshouderijbedrijf buiten Nederland en van biggen afkomstig van het E-bedrijf waaraan het betreffende A-bedrijf
      heeft geleverd, voor zover:
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel40c
  - number: 40c.1.a
    text: |-
      ten minste vijf weken voorafgaand aan de week van aanvoer geen varkens op het betreffende A-bedrijf zijn
      aangevoerd;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel40c
  - number: 40c.1.b
    text: |-
      varkens na aanvoer in een toevoegstal van het betreffende A-bedrijf zijn gehouden totdat uit het serologisch
      onderzoek van monsters, die overeenkomstig de procedure van bijlage II door een dierenarts zijn genomen, blijkt dat
      in het bloed van de aangevoerde varkens geen antilichamen tegen klassieke varkenspest en gB-antilichamen tegen de
      ziekte van Aujeszky zijn aangetroffen, of
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel40c
  - number: 40c.1.c
    text: |-
      binnen zes weken na aanvoer geen varkens worden afgevoerd anders dan rechtstreeks naar een slachthuis dan wel via
      een verzamelcentrum indien er geen toevoegstal op het betreffende A-bedrijf aanwezig is of als geen gebruik is
      gemaakt van de toevoegstal van het betreffende A-bedrijf
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel40c
  - number: 40c.2
    text: |-
      Een A-bedrijf kan eenmaal per twaalf maanden wijzigen van bedrijf als leverancier voor zowel zijn vrouwelijke
      als mannelijke varkens als bedoeld in het eerste lid. Een wijziging wordt voorafgaand aan de toepassing van de
      wijziging aan de minister gemeld met gebruikmaking van een middel dat daartoe door de minister beschikbaar is
      gesteld.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel40c
  - number: 40d
    text: |-
      In afwijking van [artikel 40a][ref1] is het vervoer van één of meer varkens vanaf een A-bedrijf toegestaan naar:


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel40a
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel40d
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 40a
        hoofdstuk: '4'
        paragraaf: 4.3.1
  - number: 40d.a
    text: één of meer A-bedrijven, B-bedrijven of D-bedrijven;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel40d
  - number: 40d.b
    text: één C-bedrijf of cluster of
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel40d
  - number: 40d.c
    text: één E-bedrijf, waarbij het A-bedrijf niet meer naar een bedrijf als bedoeld in onderdeel a of b mag afvoeren.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel40d
  - number: 40e.1
    text: |-
      In afwijking van [artikel 40a][ref1] is het vervoer naar een B-bedrijf toegestaan van vrouwelijke varkens
      afkomstig van ten hoogste één A-bedrijf, C-bedrijf, E-bedrijf of één varkenshouderijbedrijf buiten Nederland en
      van mannelijke varkens afkomstig van ten hoogste één A-bedrijf, C-bedrijf, E-bedrijf, varkensspermawincentrum of
      één varkenshouderijbedrijf buiten Nederland en van biggen afkomstig van het F-bedrijf waaraan het betreffende B-
      bedrijf heeft geleverd, voor zover ten minste vijf weken voorafgaand aan de week van aanvoer geen varkens op het
      betreffende B-bedrijf zijn aangevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel40a
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel40e
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 40a
        hoofdstuk: '4'
        paragraaf: 4.3.1
  - number: 40e.2
    text: |-
      Een B-bedrijf kan eenmaal per twaalf maanden wijzigen van bedrijf als leverancier voor zowel zijn vrouwelijke
      als mannelijke varkens als bedoeld in het eerste lid. Een wijziging wordt voorafgaand aan de toepassing van de
      wijziging aan de minister gemeld met gebruikmaking van een middel dat daartoe door de minister beschikbaar is
      gesteld.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel40e
  - number: 40f
    text: |-
      In afwijking van [artikel 40a][ref1] is het vervoer van één of meer varkens vanaf een B-bedrijf toegestaan naar:


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel40a
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel40f
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 40a
        hoofdstuk: '4'
        paragraaf: 4.3.1
  - number: 40f.a
    text: |-
      een D-bedrijf, voor zover in een periode van zes weken slechts varkens worden afgevoerd naar ten hoogste zes D-
      bedrijven en in een periode van zestien weken slechts varkens worden afgevoerd naar ten hoogste twaalf D-bedrijven;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel40f
  - number: 40f.b
    text: één F-bedrijf, waarbij niet meer naar een ander varkenshouderijbedrijf binnen Nederland kan worden afgevoerd.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel40f
  - number: 40g
    text: |-
      In afwijking van [artikel 40a][ref1] is het vervoer van één of meer varkens naar een C-bedrijf toegestaan, voor
      zover afkomstig van ten hoogste één A-bedrijf, E-bedrijf of varkenshouderijbedrijf buiten Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel40a
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel40g
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 40a
        hoofdstuk: '4'
        paragraaf: 4.3.1
  - number: 40h
    text: |-
      In afwijking van [artikel 40a][ref1] is het vervoer van één of meer varkens vanaf een C-bedrijf toegestaan, voor
      zover:


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel40a
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel40h
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 40a
        hoofdstuk: '4'
        paragraaf: 4.3.1
  - number: 40h.a
    text: varkens worden afgevoerd naar één of meerdere A-bedrijven;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel40h
  - number: 40h.b
    text: |-
      in een periode van twaalf maanden slechts varkens worden afgevoerd naar ten hoogste 40 B-bedrijven en D-bedrijven
      gezamenlijk;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel40h
  - number: 40h.c
    text: |-
      indien het C-bedrijf deel uitmaakt van een cluster van twee of drie C-bedrijven, in een periode van twaalf maanden
      door het cluster slechts varkens worden afgevoerd naar ten hoogste 30 B-bedrijven en D-bedrijven.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel40h
  - number: 40i.1
    text: |-
      In afwijking van [artikel 40a][ref1] is het vervoer van één of meer varkens naar een D-bedrijf toegestaan,
      voor zover in een periode van zestien weken slechts varkens worden aangevoerd, afkomstig van ten hoogste zes A-
      bedrijven, B-bedrijven, C-bedrijven, E-bedrijven of F-bedrijven of varkenshouderijbedrijven buiten Nederland, al
      dan niet via een verzamelcentrum.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel40a
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel40i
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 40a
        hoofdstuk: '4'
        paragraaf: 4.3.1
  - number: 40i.2
    text: |-
      In afwijking van het eerste lid is het toegestaan één of meer varkens aan te voeren van ten hoogste twaalf A-
      bedrijven, B-bedrijven, C-bedrijven, E-bedrijven of F-bedrijven of varkenshouderijbedrijven buiten Nederland, al
      dan niet via een verzamelcentrum indien op het D-bedrijf:
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel40i
  - number: 40i.2.a
    text: |-
      in een periode van drie weken voorafgaand aan de dag van aanvoer geen varkens aanwezig waren en de stallen zijn
      gereinigd en ontsmet.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel40i
  - number: 40i.2.b
    text: in een periode van acht weken voorafgaand aan de dag van aanvoer geen varkens op het D-bedrijf zijn aangevoerd.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel40i
  - number: 40j
    text: |-
      In afwijking van [artikel 40a][ref1] is het vervoer van één of meer varkens vanaf een E-bedrijf toegestaan naar de
      in [artikel 40d, onder a en b][ref2], bedoelde bedrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel40a
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel40d
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel40j
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 40a
        hoofdstuk: '4'
        paragraaf: 4.3.1
      - id: ref2
        bwb_id: BWBR0018397
        artikel: 40d
        hoofdstuk: '4'
        paragraaf: 4.3.1
  - number: 40k
    text: |-
      In afwijking van [artikel 40a][ref1] is het vervoer van één of meer varkens vanaf een F-bedrijf toegestaan naar de
      in [artikel 40f, onder a][ref2] bedoelde bedrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel40a
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel40f
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel40k
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 40a
        hoofdstuk: '4'
        paragraaf: 4.3.1
      - id: ref2
        bwb_id: BWBR0018397
        artikel: 40f
        hoofdstuk: '4'
        paragraaf: 4.3.1
  - number: 40l.1
    text: |-
      De minister kan op aanvraag van een varkenshouder toestemming verlenen voor het afvoeren van varkens van zijn
      varkenshouderijbedrijf.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel40l
  - number: 40l.2
    text: |-
      Een aanvraag als bedoeld in het eerste lid wordt ingediend via een elektronisch portaal dat
      op grond van [artikel 38hh van de Regeling identificatie en registratie van dieren][ref1] door
      de minister is aangewezen als elektronisch portaal voor de melding van de gegevens, bedoeld in
      [artikel 32, tweede lid, van de Regeling identificatie en registratie van dieren][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel38hh
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel32
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel40l
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 38hh
      - id: ref2
        bwb_id: BWBR0014538
        artikel: '32'
  - number: 40l.3
    text: |-
      Indien de minister geen databank heeft aangewezen, dient de houder de aanvraag, bedoeld in het eerste lid, in bij
      de minister met gebruikmaking van een middel dat daartoe door de minister beschikbaar is gesteld.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel40l
  - number: 40l.4
    text: |-
      De toestemming wordt voorafgaand aan het voorgenomen transport aangevraagd en is geldig tot en met zeven dagen na
      het verlenen van de toestemming.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel40l
  - number: 40l.5
    text: |-
      De toestemming wordt door de varkenshouder die de aanvraag heeft gedaan, bewaard tot drie jaren na de datum waarop
      de varkens van het varkenshouderijbedrijf zijn afgevoerd.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel40l
  - number: 40l.6
    text: |-
      In geval van een uitbraak van een in [artikel 2][ref1] van deze regeling aangewezen besmettelijke ziekte kan de
      minister overgaan tot intrekken van de op dat moment reeds uitgegeven toestemmingen.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel2
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel40l
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 40m
    text: |-
      Een varkenshouder weigert de ontvangst van varkens op zijn varkenshouderijbedrijf indien bij de aanvoer de
      toestemming met betrekking tot deze aanvoer ontbreekt.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel40m
  - number: 40n.1
    text: Het bijladen van varkens op één vervoermiddel is verboden.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel40n
  - number: 40n.2
    text: |-
      Het in het eerste lid bedoelde verbod geldt niet ingeval het betrekking heeft op het bijladen op één vervoermiddel
      van varkens voor het vervoer naar een slachthuis, rechtstreeks of via een blokperiode voor slachtvarkens op een
      verzamelcentrum.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel40n
  - number: 40n.3
    text: 'Voor het bijladen geldt dat:'
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel40n
  - number: 40n.3.a
    text: |-
      het vervoermiddel waarop de varkens worden bijgeladen, niet op het bedrijf wordt gebracht waarop de bij te laden
      varkens zich bevinden;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel40n
  - number: 40n.3.b
    text: |-
      in het betrokken vervoermiddel door middel van een toegankelijk overzicht vanaf het moment van bijladen per
      vervoerseenheid wordt bijgehouden van welke bedrijven de varkens afkomstig zijn, welk overzicht gedurende zes
      maanden na de dag waarop het bijladen heeft plaatsgevonden, op het bedrijf of de onderneming van de vervoerder
      wordt bewaard.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel40n
  - number: 40n.4
    text: |-
      Op een vervoerseenheid bevinden zich per rit naar een slachthuis, onderscheidenlijk verzamelcentrum varkens van ten
      hoogste twee verschillende bedrijven, niet zijnde verzamelcentra.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel40n
  - number: 40n.5
    text: |-
      Op een vervoerseenheid bevinden zich per rit naar een slachthuis, onderscheidenlijk verzamelcentrum zeugen of
      speenbiggen van ten hoogste drie verschillende bedrijven, niet zijnde verzamelcentra.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel40n
  - number: 40o
    text: |-
      Voor iedere toestemming die wordt aangevraagd, is de varkenshouder van het varkenshouderijbedrijf een retributie
      verschuldigd aan de minister van maximaal € 2,50.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel40o
  - number: 40p.1
    text: |-
      Een aanwijzing, schorsing of intrekking van een aanwijzing, of ontheffing verleend door de voorzitter van het
      Productschap voor Vee en Vlees wordt geacht te zijn verleend door de minister en blijft van toepassing, totdat de
      minister een ander besluit neemt.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel40p
  - number: 40p.2
    text: |-
      Een door het meldingsbureau van het Productschap voor Vee en Vlees afgegeven transportdocument wordt geacht een
      toestemming van de minister te zijn.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel40p
  - number: '41'
    text: |-
      De aanbieder meldt de aanvang en het einde van een blokperiode uiterlijk om 8.00 uur op de werkdag voorafgaande aan
      de blokperiode bij de minister.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel41
  - number: '42'
    text: |-
      Varkens worden van een ingevolge [artikel 21][ref1] erkend varkensverzamelcentrum rechtstreeks afgevoerd naar:


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel21
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 42.a
    text: een in Nederland gelegen slachthuis;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel42
  - number: 42.b
    text: |-
      naar een of meer bestemmingen buiten Nederland onder de volgende voorwaarden, ingeval de varkens
      afkomstig zijn: - uit Nederland gaan deze vergezeld van een of meer bewijsstukken als bedoeld in
      [artikel 77, tweede lid, van de wet][ref1];
        - uit een lidstaat gaan deze vergezeld van de gezondheidscertificaten, bedoeld in artikel 5, eerste en vijfde lid,
      van richtlijn nr. 64/432/EEG.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel77
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '77'
  - number: '43.1'
    text: |-
      Fokrunderen worden van een ingevolge [artikel 21][ref1] erkend runderverzamelcentrum rechtstreeks afgevoerd naar
      één of meer niet in Nederland gelegen bedrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel21
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '43.2'
    text: |-
      In afwijking van het eerste lid, worden de runderen, indien aan het einde van een blokperiode de fokrunderen niet
      zijn afgevoerd, na voorafgaande kennisgeving bij de minister met gebruikmaking van een daartoe ter beschikking
      gesteld formulier:
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel43
  - number: 43.2.a
    text: door de aanbieder rechtstreeks afgevoerd naar een slachthuis;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel43
  - number: 43.2.b
    text: |-
      op het verzamelcentrum voor een periode van 21 dagen in een epidemiologische eenheid gescheiden gehouden van andere
      fokrunderen als zij nog niet ten minste 21 dagen in afzondering hebben gestaan waarna de fokrunderen rechtstreeks
      worden vervoerd naar een in Nederland gelegen bedrijf.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel43
  - number: '43.3'
    text: |-
      De periode, bedoeld in het tweede lid, onderdeel b, vangt aan nadat het laatste fokrund aan de epidemiologische
      eenheid is toegevoegd.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel43
  - number: '43.4'
    text: |-
      In afwijking van het eerste lid, worden de runderen, indien aan het einde van een blokperiode de fokrunderen niet
      zijn afgevoerd, op het verzamelcentrum gescheiden gehouden van andere fokrunderen voor ten hoogste de periode die
      benodigd is voor het verkrijgen van de resultaten van testen op besmettelijke dierziekten die bij de desbetreffende
      fokrunderen binnen de blokperiode zijn uitgevoerd, waarna de fokrunderen rechtstreeks worden vervoerd naar één of
      meer niet in Nederland gelegen bedrijven.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel43
  - number: '44'
    text: |-
      Slachtrunderen worden van een ingevolge [artikel 21][ref1] erkend runderverzamelcentrum rechtstreeks afgevoerd naar
      een al dan niet in Nederland gelegen slachthuis.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel21
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '45.1'
    text: |-
      Runderen, jonger dan 12 maanden, worden van een ingevolge [artikel 21][ref1] erkend verzamelcentrum rechtstreeks
      afgevoerd naar:


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel21
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 45.1.a
    text: één of meer niet in Nederland gelegen bedrijven;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel45
  - number: 45.1.b
    text: een in Nederland gelegen mesterij;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel45
  - number: 45.1.c
    text: een al dan niet in Nederland gelegen slachthuis.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel45
  - number: '45.2'
    text: |-
      In afwijking van het eerste lid, onderdeel b, is het toegestaan runderen af te voeren van een ingevolge
      [artikel 21][ref1] erkend verzamelcentrum naar een in Nederland gelegen mesterij en onderweg eenmalig runderen bij
      te laden op een ander ingevolge artikel 21 erkend verzamelcentrum, indien dat verzamelcentrum beschikt over een
      bijlaadvoorziening aan de openbare weg, die voldoet aan de volgende voorwaarden:


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel21
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 45.2.a
    text: de voorziening is zodanig geconstrueerd dat de laadwerkzaamheden ongehinderd kunnen plaatsvinden en
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel45
  - number: 45.2.b
    text: |-
      de laadplaats is voorzien van een gesloten dakbedekking, windkerende wanden en een klimaatregelingssysteem,
      zodanig dat de laadplaats onder alle klimatologische omstandigheden deugdelijk en efficiënt gereinigd en ontsmet
      kan worden.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel45
  - number: '45.3'
    text: |-
      In afwijking van het eerste lid kunnen runderen, jonger dan 12 weken, eenmaal van het in het eerste lid bedoelde
      runderverzamelcentrum worden afgevoerd naar een ander ingevolge [artikel 21][ref1] erkend runderverzamelcentrum.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel21
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '45.4'
    text: |-
      Indien op het andere runderverzamelcentrum, bedoeld in het derde lid, de aangevoerde runderen afkomstig zijn van
      verschillende verzamelcentra of andere plaatsen in een blokperiode tegelijkertijd bijeen worden gebracht, worden
      alle in die blokperiode bijeengebrachte runderen rechtstreeks afgevoerd naar een in Nederland gelegen bedrijf.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel45
  - number: 45a.1
    text: |-
      De eigenaar of exploitant van een ingevolge [artikel 21][ref1] erkend runderverzamelcentrum waarvandaan of waarop
      runderen onder toepassing van [artikel 45, derde lid][ref2], respectievelijk worden afgevoerd en aangevoerd, meldt
      het runderverzamelcentrum bij de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel45
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel45a
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0018397
        artikel: '45'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: 45a.2
    text: |-
      Het verzamelen op een runderverzamelcentrum als bedoeld in [artikel 45, derde lid][ref1], geschiedt, in aanvulling
      op [artikel 23, eerste lid, onder c][ref2], overeenkomstig een door de minister goedgekeurd drenkprotocol.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel23
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel45a
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '45'
        hoofdstuk: '4'
        paragraaf: '4.4'
      - id: ref2
        bwb_id: BWBR0018397
        artikel: '23'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 45a.3
    text: |-
      Op een runderverzamelcentrum als bedoeld in het eerste lid geschiedt de kennisgeving, bedoeld in
      [artikel 20, eerste lid, van de Regeling identificatie en registratie van dieren][ref1], in afwijking van dat
      artikel onmiddellijk na respectievelijk voor iedere aan- en afvoer van runderen.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel20
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel45a
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '20'
  - number: '46.1'
    text: |-
      Mestrunderen worden van een ingevolge [artikel 21][ref1] erkend runderverzamelcentrum rechtstreeks afgevoerd naar:


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel21
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 46.1.a
    text: een al dan niet in Nederland gelegen slachthuis;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel46
  - number: 46.1.b
    text: |-
      een mesterij als bedoeld in [artikel 38b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel38b
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 38b
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 46.1.c
    text: één of meer niet in Nederland gelegen bedrijven.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel46
  - number: '46.2'
    text: |-
      Het eerste lid, aanhef en onder b, is alleen van toepassing op mestrunderen jonger dan 16 weken, die zijn geboren
      op een mesterij, indien die mestrunderen van een ingevolge [artikel 21][ref1] erkend runderverzamelcentrum worden
      afgevoerd naar een mesterij indien er in de laatste 21 dagen voor de afvoer geen runderen meer zijn aangevoerd op
      de mesterij van herkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel21
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '46.3'
    text: |-
      Het eerste lid, aanhef en onder b, is alleen van toepassing op mestrunderen ouder dan 6 weken en jonger dan 12
      maanden, indien die mestrunderen eenmalig, van een ingevolge [artikel 21][ref1] erkend runderverzamelcentrum worden
      afgevoerd naar een andere mesterij in Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel21
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '47.1'
    text: |-
      Slachtschapen en slachtgeiten worden van een ingevolge [artikel 21][ref1] erkend schapen- en geitenverzamelcentrum
      rechtstreeks afgevoerd naar een al dan niet in Nederland gelegen slachthuis.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel21
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '47.2'
    text: |-
      In afwijking van het eerste lid kunnen slachtschapen en slachtgeiten eenmaal worden afgevoerd naar een schapen-
      en geitenverzamelcentrum als bedoeld in [artikel 48c, eerste lid][ref1], indien de schapen- en geiten daarna
      rechtstreeks worden afgevoerd naar een al dan niet in Nederland gelegen slachthuis.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel48c
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 48c
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: '47.3'
    text: |-
      In geval van afvoer als bedoeld in het tweede lid wordt voldaan aan artikel 4 quater, derde lid, onderdeel a, van
      [richtlijn nr. 91/68/EEG](31991L0068).
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel47
  - number: '48.1'
    text: |-
      Mestschapen en mestgeiten worden van een ingevolge [artikel 21][ref1] erkend schapen- en geitenverzamelcentrum
      rechtstreeks afgevoerd naar:


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel21
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 48.1.a
    text: |-
      een in Nederland gelegen mesterij als bedoeld in [artikel 48a, eerste lid][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel48a
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 48a
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: 48.1.b
    text: een niet in Nederland gelegen bestemming.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel48
  - number: '48.2'
    text: |-
      In afwijking van het eerste lid kunnen mestschapen en mestgeiten eenmaal worden afgevoerd naar een
      schapen- en geitenverzamelcentrum als bedoeld in [artikel 48c, eerste lid][ref1], indien de schapen-
      en geiten daarna rechtstreeks worden afgevoerd naar een in Nederland gelegen mesterij als bedoeld in
      [artikel 48a, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel48c
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel48a
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 48c
        hoofdstuk: '4'
        paragraaf: '4.4'
      - id: ref2
        bwb_id: BWBR0018397
        artikel: 48a
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: '48.3'
    text: |-
      Het eerste lid, onderdeel b, en het tweede lid zijn niet van toepassing op mestschapen en mestgeiten die
      overeenkomstig [artikel 47, tweede lid][ref1], als slachtschapen of slachtgeiten zijn afgevoerd naar een schapen-
      en geitenverzamelcentrum als bedoeld in [artikel 48c, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel48c
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '47'
        hoofdstuk: '4'
        paragraaf: '4.4'
      - id: ref2
        bwb_id: BWBR0018397
        artikel: 48c
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: '48.4'
    text: |-
      In het geval van afvoer als bedoeld in het tweede lid is artikel 4 quater, derde lid, onderdeel a, van richtlijn
      nr. 91/68/EG, van overeenkomstige toepassing, met dien verstande dat in artikel 4 quater, derde lid, onderdeel a,
      onder iii, van richtlijn nr. 91/68/EG, voor ‘naar een slachthuis in de lidstaat van bestemming’ wordt gelezen ‘naar
      een in Nederland gelegen mesterij’.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel48
  - number: 48a.1
    text: |-
      De eigenaar of exploitant van een mesterij als bedoeld in [artikel 48, eerste en tweede lid][ref1], meldt de
      mesterij aan bij de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel48
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel48a
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '48'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: 48a.2
    text: |-
      De eigenaar of exploitant van een mesterij, bedoeld in het eerste lid, kan de mesterij bij de minister afmelden,
      indien zich op de mesterij geen schapen of geiten bevinden die gedurende 30 dagen vóór de afmelding overeenkomstig
      [artikel 48, eerste of tweede lid][ref1], van een verzamelcentrum zijn afgevoerd naar de mesterij.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel48
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel48a
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '48'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: 48a.3
    text: |-
      Voor de meldingen, bedoeld in het eerste en tweede lid, is de eigenaar of exploitant aan de minister een bedrag
      verschuldigd van 25 euro per melding.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel48a
  - number: 48a.4
    text: |-
      Schapen en geiten worden van een mesterij als bedoeld in het eerste lid uitsluitend rechtstreeks of via een erkend
      verzamelcentrum afgevoerd naar een al dan niet in Nederland gelegen slachthuis of naar een niet in Nederland
      gelegen bestemming.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel48a
  - number: 48b
    text: |-
      Fokschapen en fokgeiten worden van een ingevolge [artikel 21][ref1] erkend schapen- en geitenverzamelcentrum
      rechtstreeks afgevoerd naar een niet in Nederland gelegen bestemming.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel21
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel48b
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 48c.1
    text: |-
      De eigenaar of exploitant van een ingevolge [artikel 21][ref1] erkend schapen- en geitenverzamelcentrum waarvandaan
      of waarop schapen of geiten met toepassing van de [artikelen 47, tweede lid][ref2], of [48, tweede lid][ref3],
      respectievelijk worden afgevoerd en aangevoerd, meldt het schapen- en geitenverzamelcentrum aan bij de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel47
      [ref3]: https://wetten.overheid.nl/BWBR0018397#Artikel48
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel48c
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0018397
        artikel: '47'
        hoofdstuk: '4'
        paragraaf: '4.4'
      - id: ref3
        bwb_id: BWBR0018397
        artikel: '48'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: 48c.2
    text: |-
      Op een schapen- en geitenverzamelcentrum als bedoeld in het eerste lid geschiedt de kennisgeving, bedoeld
      in [artikel 38d, derde en zevende lid, van de Regeling identificatie en registratie van dieren][ref1], in
      afwijking van artikel 38d, achtste lid, van de Regeling identificatie en registratie van dieren, onmiddellijk na
      respectievelijk voor iedere aan- en afvoer van schapen en geiten.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel38d
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel48c
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 38d
  - number: 48c.3
    text: |-
      Indien op het schapen- en geitenverzamelcentrum, bedoeld in het eerste lid, schapen of geiten afkomstig van
      meer verzamelcentra of andere plaatsen tegelijkertijd in een blokperiode worden bijeengebracht, worden alle in
      die blokperiode bijeengebrachte schapen en geiten afgevoerd overeenkomstig [artikel 47, derde lid][ref1], of
      [48, vierde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel48
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel48c
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '47'
        hoofdstuk: '4'
        paragraaf: '4.4'
      - id: ref2
        bwb_id: BWBR0018397
        artikel: '48'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: '49'
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel49
  - number: 49.a
    text: 'organisator: organisator van een tentoonstelling of keuring;'
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel49
  - number: 49.b
    text: 'plaats: plaats waar tentoonstelling of keuring wordt gehouden.'
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel49
  - number: '50.1'
    text: |-
      De organisator stelt ten minste 30 dagen voorafgaand aan de datum waarop de tentoonstelling of keuring zal
      plaatsvinden de NVWA schriftelijk in kennis van naam, adres en telefoonnummer van de organisator van de
      tentoonstelling of keuring, de datum en plaats, alsmede het UBN van de plaats, en het aantal runderen, schapen of
      geiten dat wordt tentoongesteld of gekeurd.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel50
  - number: '50.2'
    text: |-
      De houder of eigenaar van de tentoon te stellen of te keuren runderen, schapen of geiten laat deze binnen vijf
      dagen voorafgaand aan de tentoonstelling of keuring door een dierenarts klinisch onderzoeken.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel50
  - number: '50.3'
    text: |-
      Van het onderzoek, bedoeld in het tweede lid, wordt door de dierenarts en de houder of eigenaar van de runderen,
      schapen of geiten een verklaring opgesteld volgens het model in [bijlage 8][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018397
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0018397
  - number: '50.4'
    text: |-
      De organisator laat runderen, schapen of geiten toe tot de plaats indien zij vergezeld gaan van de door de
      dierenarts en de houder of eigenaar ondertekende verklaring, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel50
  - number: '50.5'
    text: |-
      De tentoon te stellen of te keuren runderen, schapen of geiten worden uitsluitend op de plaats aangevoerd en van de
      plaats afgevoerd met vervoermiddelen waarvoor krachtens de [Wegenverkeerswet 1994](onbekend) een kentekenbewijs of
      registratiebewijs is afgegeven.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel50
  - number: '50.6'
    text: |-
      Runderen, schapen of geiten worden zo spoedig mogelijk na afloop van de tentoonstelling of keuring rechtstreeks
      vervoerd naar:
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel50
  - number: 50.6.a
    text: een in Nederland gelegen slachthuis, of
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel50
  - number: 50.6.b
    text: het bedrijf van herkomst.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel50
  - number: 50a
    text: |-
      In zoverre in afwijking van [artikel 50, leden 2, 3 en 4][ref1], worden geiten of schapen toegelaten tot een
      tentoonstelling of keuring als de houder of eigenaar van de ten toon te stellen of te keuren geiten of schapen de
      dieren klinisch heeft laten onderzoeken door een dierenarts op het terrein van de tentoonstelling of keuring en de
      resultaten van het onderzoek geen belemmering vormen voor de tentoonstelling of keuring van de betrokken dieren.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel50
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel50a
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '50'
        hoofdstuk: '4'
        paragraaf: '4.5'
  - number: '51.1'
    text: |-
      Eenieder, die het deel van de plaats, waar runderen, schapen of geiten verblijven, betreedt of verlaat, ontsmet
      zijn schoeisel door middel van voorzieningen, die duidelijk zichtbaar aanwezig zijn bij elke in- en uitgang van
      voornoemd deel van de plaats.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel51
  - number: '51.2'
    text: |-
      Op de plaats zijn voor de reiniging en ontsmetting van vervoermiddelen, waarmee evenhoevigen worden vervoerd, één
      of meer installaties aanwezig die water leveren van voldoende druk voor een deugdelijke en efficiënte reiniging
      en ontsmetting.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel51
  - number: '51.3'
    text: |-
      [Artikel 31, eerste lid][ref1], is niet van toepassing bij het uitladen van evenhoevigen op een plaats, onder de
      voorwaarde dat het vervoermiddel na het uitladen op de plaats aanwezig blijft en met dezelfde evenhoevigen wordt
      geladen.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel31
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '51.4'
    text: |-
      Voordat een vervoermiddel, dat geladen is met runderen, schapen of geiten, de plaats verlaat, reinigt en ontsmet
      de bestuurder de wielen en wielkasten van dat vervoermiddel met een toegelaten ontsmettingsmiddel op zodanige wijze
      dat de bioveiligheid niet in gevaar komt.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel51
  - number: '52.1'
    text: |-
      De organisator houdt een administratie bij overeenkomstig de [artikelen 19][ref1], [38b][ref2] en
      [38d, derde, zesde en zevende lid van de Regeling identificatie en registratie van dieren][ref3] en van de
      originele gezondheidsverklaringen, bedoeld in [artikel 50, derde lid][ref4], en de kentekens van de vervoermiddelen
      waarmee runderen zijn aan- en afgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel38b
      [ref3]: https://wetten.overheid.nl/BWBR0014538#Artikel38d
      [ref4]: https://wetten.overheid.nl/BWBR0018397#Artikel50
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0014538
        artikel: 38b
      - id: ref3
        bwb_id: BWBR0014538
        artikel: 38d
      - id: ref4
        bwb_id: BWBR0018397
        artikel: '50'
        hoofdstuk: '4'
        paragraaf: '4.5'
  - number: '52.2'
    text: |-
      De organisator bewaart de administratie, bedoeld in het eerste lid, tot ten minste drie maanden na afloop van de
      tentoonstelling of keuring.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel52
  - number: '52.3'
    text: |-
      De organisator houdt de administratie zodanig bij dat de ambtenaren als bedoeld in [artikel 114 van de wet][ref1]
      op basis hiervan alle aan- en afgevoerde dieren en de gebruikte vervoermiddelen eenvoudig kunnen traceren.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel114
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '114'
  - number: 52a.1
    text: |-
      Op een erkend paardenverzamelcentrum worden niet tegelijkertijd verschillende paardachtigen met een verschillende
      gezondheidsstatus bijeen gebracht.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel52a
  - number: 52a.2
    text: |-
      Het eerste lid is niet van toepassing indien paardachtigen met een verschillende gezondheidsstatus in afzonderlijke
      epidemiologische eenheden afgescheiden van elkaar worden gehouden.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel52a
  - number: 52b
    text: |-
      De aanbieder meldt de aanvang en het einde van een blokperiode uiterlijk om 8:00 uur op de werkdag voorafgaand aan
      de blokperiode aan de minister.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel52b
  - number: 52c
    text: |-
      Vanaf een erkend paardenverzamelcentrum worden paardachtigen voor het einde van een blokperiode rechtstreeks
      afgevoerd naar één of meer in Nederland of in het buitenland gelegen bestemmingen.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel52c
  - number: '53.1'
    text: Markten waarop pluimvee, loopvogels of postduiven worden verhandeld zijn verboden.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel53
  - number: '53.2'
    text: |-
      Het tijdelijk verzamelen op één plaats van pluimvee, loopvogels of postduiven die afkomstig zijn van verschillende
      plaatsen en vervolgens naar verschillende plaatsen, niet zijnde slachterijen, worden afgevoerd, is verboden.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel53
  - number: '53.3'
    text: Het organiseren van wedvluchten met postduiven is verboden.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel53
  - number: '54.1'
    text: |-
      De verboden, bedoeld in [artikel 53, tweede en derde lid][ref1], zijn niet van toepassing op een keuring of
      tentoonstelling van sierpluimvee, loopvogels of postduiven of op een wedvlucht van postduiven indien wordt voldaan
      aan het tweede of derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel53
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '53'
        hoofdstuk: '5'
  - number: '54.2'
    text: |-
      Op de tentoonstelling of keuring worden slechts pluimvee, loopvogels of postduiven toegelaten en tot de wedvlucht
      worden slechts postduiven toegelaten, die vergezeld gaan van een op hen betrekking hebbende, volledig ingevulde en
      ondertekende verklaring van enting tegen Newcastle Disease.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel54
  - number: '54.3'
    text: |-
      Uit de in het tweede lid bedoelde verklaring, waarvan het model als [bijlage 6][ref1] en [bijlage 7][ref2] bij deze
      regeling is gevoegd, blijkt dat:


      [ref1]: https://wetten.overheid.nl/BWBR0018397
      [ref2]: https://wetten.overheid.nl/BWBR0018397
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0018397
      - id: ref2
        bwb_id: BWBR0018397
  - number: 54.3.a
    text: |-
      de hoenderachtigen en loopvogels van de desbetreffende houder, voorzover de dieren ouder zijn dan 30 dagen,
      ten minste twee weken en ten hoogste vijf maanden voor het begin van de tentoonstelling of de keuring op de in
      [bijlage 6][ref1] omschreven wijze zijn geënt tegen Newcastle Disease;


      [ref1]: https://wetten.overheid.nl/BWBR0018397
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0018397
  - number: 54.3.b
    text: |-
      de postduiven van de betreffende houder ten minste twee weken voor het begin van de tentoonstelling, keuring of
      wedvlucht op de in [bijlage 7][ref1] omschreven wijze zijn geënt tegen Newcastle Disease overeenkomstig de bij de
      registratie van de entstof gegeven voorschriften betreffende het entschema en de dosering.


      [ref1]: https://wetten.overheid.nl/BWBR0018397
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0018397
  - number: '55.1'
    text: |-
      Onverminderd de [artikelen 53][ref1] en [54][ref2] is het tijdelijk op één plaats bijeenbrengen van pluimvee,
      loopvogels of postduiven afkomstig van verschillende plaatsen toegestaan, indien is voldaan aan het tweede of derde
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel54
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '53'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0018397
        artikel: '54'
        hoofdstuk: '5'
  - number: '55.2'
    text: |-
      Degene, die voornemens is pluimvee, loopvogels of postduiven afkomstig van verschillende plaatsen tijdelijk op één
      plaats te bijeen te brengen, is gehouden:
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel55
  - number: 55.2.a
    text: van dit voornemen ten minste acht dagen van tevoren kennis te gegeven aan de minister;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel55
  - number: 55.2.b
    text: |-
      de dieren, alvorens deze toe te laten, bij de plaats van aanvoer op zijn kosten te laten onderzoeken door één of
      meer dierenartsen.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel55
  - number: '55.3'
    text: |-
      In afwijking van het tweede lid is degene die voornemens is postduiven voor een wedvlucht bijeen te brengen
      gehouden van dit voornemen jaarlijks een overzicht aan de minister te doen toekomen. De minister kan besluiten de
      postduiven, alvorens deze bij de wedvlucht worden toegelaten, bij de plaats van aanvoer te laten onderzoeken door
      één of meer dierenartsen, op kosten van degene die de postduiven voor de wedvlucht heeft bijeengebracht.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel55
  - number: '56'
    text: |-
      Een kwaliteitssysteem kan door de minister worden erkend indien door een rechtspersoon als bedoeld in
      [artikel 59, eerste lid][ref1], wordt aangetoond dat:


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel59
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '59'
        hoofdstuk: '6'
  - number: 56.a
    text: |-
      het beheer en de inrichting in handen is van een rechtspersoon die voldoet aan de voorschriften, bedoeld in de
      [artikelen 59][ref1] en [62][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel59
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel62
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '59'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0018397
        artikel: '62'
        hoofdstuk: '6'
  - number: 56.b
    text: |-
      voldaan wordt aan de voorschriften, bedoeld in de [artikelen 60][ref1] en [61][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel61
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '60'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0018397
        artikel: '61'
        hoofdstuk: '6'
  - number: 56.c
    text: |-
      voldaan wordt aan de eisen, bedoeld in [artikel 63][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel63
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '63'
        hoofdstuk: '6'
  - number: '57.1'
    text: |-
      De erkenning van een kwaliteitssysteem geschiedt op aanvraag van de in [artikel 59, eerste lid][ref1], bedoelde
      rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel59
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '59'
        hoofdstuk: '6'
  - number: '57.2'
    text: De aanvraag wordt schriftelijk bij de minister ingediend.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel57
  - number: '57.3'
    text: Op de aanvraag wordt binnen 90 dagen na ontvangst van de aanvraag een besluit genomen.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel57
  - number: '57.4'
    text: 'Bij de aanvraag worden in elk geval de volgende gegevens verstrekt:'
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel57
  - number: 57.4.a
    text: de naam en het adres van de rechtspersoon;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel57
  - number: 57.4.b
    text: |-
      de naam en het adres van de in [artikel 60, vierde lid][ref1], bedoelde instanties;


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel60
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '60'
        hoofdstuk: '6'
  - number: 57.4.c
    text: een opgave van de namen en adressen van de deelnemende personen, rechtspersonen en samenwerkingsverbanden;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel57
  - number: 57.4.d
    text: 'een overzicht van:'
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel57
  - number: 57.4.d.1
    text: |-
      de wijze waarop de controles, bedoeld in [artikel 60, eerste lid][ref1], worden uitgevoerd;


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel60
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '60'
        hoofdstuk: '6'
  - number: 57.4.d.2
    text: |-
      de wijze waarop en welke sancties, bedoeld in [artikel 61, eerste lid][ref1], worden opgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel61
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '61'
        hoofdstuk: '6'
  - number: 57.4.d.3
    text: |-
      de wijze waarop de geïnde boetes, bedoeld in [artikel 61, tweede lid, onderdeel a][ref1], zullen worden besteed;


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel61
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '61'
        hoofdstuk: '6'
  - number: 57.4.d.4
    text: |-
      de wijze waarop wordt voldaan aan de eisen, bedoeld in [artikel 63][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel63
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '63'
        hoofdstuk: '6'
  - number: '58.1'
    text: |-
      Indien een kwaliteitssysteem niet meer aan de eisen, bedoeld in [artikel 56][ref1], voldoet kan de minister:


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel56
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '56'
        hoofdstuk: '6'
  - number: 58.1.a
    text: nadere voorwaarden verbinden aan de erkenning;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel58
  - number: 58.1.b
    text: de erkenning met onmiddellijke ingang schorsen of intrekken.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel58
  - number: '58.2'
    text: |-
      De minister kan de nadere voorwaarden opheffen of een schorsing beëindigen indien ten genoegen van de minister is
      aangetoond dat het kwaliteitssysteem weer volledig aan alle eisen voldoet.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel58
  - number: '59.1'
    text: |-
      Een kwaliteitssysteem wordt opgesteld en beheerd door een rechtspersoon als bedoeld in
      [artikel 2:3 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel3
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '3'
  - number: '59.2'
    text: |-
      De wijze van de inrichting en het beheer en alle overige werkprocessen van de in het eerste lid bedoelde
      rechtspersoon zijn overzichtelijk, duidelijk en volledig beschreven in één of meer schriftelijke stukken.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel59
  - number: '59.3'
    text: |-
      De inrichting en het beheer van het kwaliteitssysteem voldoen aan de criteria van ISO 9001 zoals die zijn
      gedeponeerd bij het Nederlands Normalisatie-instituut te Delft.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel59
  - number: '60.1'
    text: |-
      De rechtspersoon, bedoeld in [artikel 59, eerste lid][ref1], verplicht de deelnemers om de eisen, bedoeld in
      [artikel 63][ref2], en de daarop gebaseerde inhoudelijke normen, na te leven.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel59
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel63
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '59'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0018397
        artikel: '63'
        hoofdstuk: '6'
  - number: '60.2'
    text: |-
      De rechtspersoon, bedoeld in [artikel 59, eerste lid][ref1], voorziet in een doeltreffend systeem van controle op
      de naleving van de in het kwaliteitssysteem vastgelegde verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel59
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '59'
        hoofdstuk: '6'
  - number: '60.3'
    text: |-
      Het controlesysteem zal in elk geval bestaan uit adequate controles op de eisen, bedoeld in [artikel 63][ref1], en
      de daarop gebaseerde inhoudelijke normen van het kwaliteitssysteem.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel63
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '63'
        hoofdstuk: '6'
  - number: '60.4'
    text: De controles worden uitgevoerd door één of meer onafhankelijke, deskundige instanties.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel60
  - number: '60.5'
    text: |-
      Een instantie als bedoeld in het vierde lid, is geaccrediteerd door de Nederlandse Raad voor Accreditatie of door
      een gelijkwaardige buitenlandse instantie is verklaard dat de instantie voldoet aan de relevante criteria van ISO
      17021 zoals die zijn gedeponeerd bij het Nederlands Normalisatie-instituut te Delft.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel60
  - number: '61.1'
    text: |-
      De rechtspersoon, bedoeld in [artikel 59, eerste lid][ref1], voorziet in een doeltreffend systeem van oplegging van
      sancties bij niet-naleving van de eisen, bedoeld in [artikel 63][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel59
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel63
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '59'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0018397
        artikel: '63'
        hoofdstuk: '6'
  - number: '61.2'
    text: |-
      De rechtspersoon, bedoeld in [artikel 59][ref1], voorziet er in elk geval in dat de mogelijkheid bestaat om bij
      niet-naleving de volgende sancties op te leggen:


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel59
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '59'
        hoofdstuk: '6'
  - number: 61.2.a
    text: oplegging van een boete;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel61
  - number: 61.2.b
    text: schorsing of uitsluiting van deelname het kwaliteitssysteem.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel61
  - number: '61.3'
    text: |-
      Gedurende de schorsing, bedoeld in het tweede lid, onderdeel b, zijn de afwijkende voorschriften, bedoeld in
      [artikel 33, derde lid][ref1], [44, tweede lid][ref2], [45, vierde lid][ref3], en [46, tweede lid][ref4], niet van
      toepassing op de desbetreffende deelnemer.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel44
      [ref3]: https://wetten.overheid.nl/BWBR0018397#Artikel45
      [ref4]: https://wetten.overheid.nl/BWBR0018397#Artikel46
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0018397
        artikel: '44'
        hoofdstuk: '4'
        paragraaf: '4.4'
      - id: ref3
        bwb_id: BWBR0018397
        artikel: '45'
        hoofdstuk: '4'
        paragraaf: '4.4'
      - id: ref4
        bwb_id: BWBR0018397
        artikel: '46'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: '62.1'
    text: |-
      De instantie, bedoeld in [artikel 60, vierde lid][ref1], verstrekt maandelijks een overzicht van de uitgevoerde
      controles als bedoeld in [artikel 60, eerste lid][ref2], voor zover deze betrekking hebben op de eisen, bedoeld in
      [artikel 63][ref3], aan de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel60
      [ref3]: https://wetten.overheid.nl/BWBR0018397#Artikel63
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '60'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0018397
        artikel: '60'
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0018397
        artikel: '63'
        hoofdstuk: '6'
  - number: '62.2'
    text: |-
      De rechtspersoon, bedoeld in [artikel 59, eerste lid][ref1], verstrekt maandelijks een overzicht van de opgelegde
      sancties, bedoeld in [artikel 61, eerste lid][ref2], voor zover deze betrekking hebben op de eisen, bedoeld in
      [artikel 63][ref3], waaronder de aanleiding en aard van de sanctie, aan de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel59
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel61
      [ref3]: https://wetten.overheid.nl/BWBR0018397#Artikel63
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '59'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0018397
        artikel: '61'
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0018397
        artikel: '63'
        hoofdstuk: '6'
  - number: '62.3'
    text: |-
      Indien als gevolg van een beëindiging van de deelname aan een kwaliteitssysteem met wederzijds goedvinden
      een deelnemer niet langer deelneemt aan dat kwaliteitssysteem, maakt de rechtspersoon, bedoeld in
      [artikel 59, eerste lid][ref1], daarvan onverwijld melding aan de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel59
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '59'
        hoofdstuk: '6'
  - number: '62.4'
    text: |-
      Indien als gevolg van een sanctie als bedoeld in [artikel 61, eerste lid][ref1], een deelnemer is
      geschorst of uitgesloten van deelname aan een kwaliteitssysteem, maakt de rechtspersoon, bedoeld in
      [artikel 59, eerste lid][ref2], daarvan onverwijld melding aan de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel59
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '61'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0018397
        artikel: '59'
        hoofdstuk: '6'
  - number: '62.5'
    text: |-
      Het kwaliteitssysteem dient te beschikken over een geautomatiseerd systeem waarmee de minister op ieder moment
      inzage kan hebben in de deelnemers aan de kwaliteitssysteem.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel62
  - number: '62.6'
    text: |-
      De rechtspersoon, bedoeld in [artikel 59, eerste lid][ref1], geeft wijzigingen van de gegevens, bedoeld in
      [artikel 57, vierde lid][ref2], onverwijld door aan de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel59
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel57
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '59'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0018397
        artikel: '57'
        hoofdstuk: '6'
  - number: '63.1'
    text: 'Het doel van een kwaliteitssysteem is:'
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel63
  - number: 63.1.a
    text: de preventie van insleep en verspreiding van besmettelijke dierziekten;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel63
  - number: 63.1.b
    text: het waarborgen van de gezondheid van te vervoeren evenhoevigen;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel63
  - number: 63.1.c
    text: het waarborgen van het welzijn van de evenhoevigen.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel63
  - number: '63.2'
    text: |-
      Om het doel, bedoeld in het eerste lid, te bereiken dient het kwaliteitssysteem tenminste de volgende aspecten
      te omvatten:
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel63
  - number: 63.2.a
    text: de belading van vervoermiddelen;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel63
  - number: 63.2.b
    text: de reiniging en ontsmetting van vervoermiddelen;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel63
  - number: 63.2.c
    text: het bijhouden van registers van aantallen evenhoevigen en de identificatiegegevens van deze evenhoevigen;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel63
  - number: 63.2.d
    text: welke maatregelen worden genomen indien het vermoeden bestaat van ziekte van te vervoeren evenhoevigen;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel63
  - number: 63.2.e
    text: op welke wijze er wordt voldaan aan de voorschriften van Verordening (EG) nr. 1/2005;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel63
  - number: '63.3'
    text: |-
      Voor zover het kwaliteitssysteem betrekking heeft op [artikel 33, derde lid][ref1], dienen er minimaal 100
      vervoerders deel te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel33
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '63.4'
    text: |-
      Voor zover het kwaliteitssysteem betrekking heeft op de [artikelen 44, tweede lid][ref1], [45, vierde lid][ref2],
      of [46, tweede lid][ref3], dienen er minimaal 10 personen, rechtspersonen of samenwerkingsverbanden bestaande uit
      vervoerders en eigenaren of exploitanten van verzamelcentra, deel te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel45
      [ref3]: https://wetten.overheid.nl/BWBR0018397#Artikel46
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '44'
        hoofdstuk: '4'
        paragraaf: '4.4'
      - id: ref2
        bwb_id: BWBR0018397
        artikel: '45'
        hoofdstuk: '4'
        paragraaf: '4.4'
      - id: ref3
        bwb_id: BWBR0018397
        artikel: '46'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: '82.1'
    text: 'Het is verboden:'
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel82
  - number: 82.1.a
    text: een of meer varkens te ontvangen op een varkenshouderijbedrijf;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel82
  - number: 82.1.b
    text: een of meer varkens op een varkenshouderijbedrijf te houden, of
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel82
  - number: 82.1.c
    text: een of meer varkens die zich op een varkenshouderijbedrijf bevinden, af te voeren.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel82
  - number: '82.2'
    text: 'Het verbod, bedoeld in het eerste lid, is niet van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel82
  - number: 82.2.a
    text: |-
      de eigenaar of exploitant van het bedrijf, dan wel diens vertegenwoordiger, dan wel degene die op dat bedrijf een
      of meer varkens houdt, varkens die verschijnselen van een besmettelijke dierziekte vertonen, behandelt of laat
      behandelen en binnen 24 uur nadat die behandeling is ingesteld, bloed is afgenomen en is ingestuurd ten behoeve van
      onderzoek op de aanwezigheid van een besmettelijke dierziekte;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel82
  - number: 82.2.b
    text: |-
      de eigenaar of exploitant van het bedrijf, dan wel diens vertegenwoordiger, dan wel degene die op dat bedrijf een
      of meer varkens houdt, voor zover op dat bedrijf varkens mogelijk ten gevolge van een besmettelijke dierziekte zijn
      gestorven, een representatief aantal van die dieren ter sectie heeft ingestuurd ten behoeve van onderzoek op de
      aanwezigheid van klassieke varkenspest.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel82
  - number: 82a.1
    text: |-
      Een houder van varkens laat iedere viermaandelijkse periode die loopt van januari tot en met april, van mei tot en
      met augustus en van september tot en met december, ten minste 8 milliliter bloed afnemen bij drie varkens die:
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel82a
  - number: 82a.1.a
    text: ten minste 25 kg zwaar zijn, of
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel82a
  - number: 82a.1.b
    text: de zwaarste dieren zijn.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel82a
  - number: 82a.2
    text: Het is toegestaan om het bloed, bedoeld in het eerste lid, af te laten nemen nadat de dieren zijn gedood.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel82a
  - number: 82a.3
    text: |-
      Het eerste lid is niet van toepassing, indien het aantal gehouden varkens, uitgezonderd zogende biggen, gedurende
      de periode, bedoeld in het eerste lid, minder dan 31 bedraagt.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel82a
  - number: 82b.1
    text: |-
      De houder van varkens laat het bloed, bedoeld in [artikel 82a, eerste lid][ref1], in een laboratorium als bedoeld
      in [artikel 2 van de Regeling erkenning en aanwijzing veterinaire laboratoria][ref2] onderzoeken op de aanwezigheid
      van antistoffen tegen het Aujeszky-virus of het Aujeszky-vaccin.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel82a
      [ref2]: https://wetten.overheid.nl/BWBR0019575#Artikel2
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel82b
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 82a
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0019575
        artikel: '2'
  - number: 82b.2
    text: |-
      De monsters worden uiterlijk op de werkdag na de dag dat ze zijn genomen aangeleverd bij het laboratorium, bedoeld
      in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel82b
  - number: 82b.3
    text: 'Bij aanlevering van de monsters worden in ieder geval de volgende gegevens aangegeven:'
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel82b
  - number: 82b.3.a
    text: |-
      gegevens ter identificatie van de houder van de dieren, van degene die het monster heeft genomen en van de dieren
      die zijn bemonsterd;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel82b
  - number: 82b.3.b
    text: gegevens omtrent de monsters;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel82b
  - number: 82b.3.c
    text: de dagtekening;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel82b
  - number: 82b.3.d
    text: de handtekening van de inzender van de monsters.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel82b
  - number: 82c.1
    text: |-
      De houder bewaart de uitslag van het onderzoek, bedoeld in [artikel 82b, eerste lid][ref1], en de gegevens, bedoeld
      in het derde lid van dat artikel, gedurende twee jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel82b
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel82c
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 82b
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 82c.2
    text: De houder registreert de uitslag, bedoeld in het eerste lid, bij de minister.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel82c
  - number: 82d
    text: 'In deze paragraaf wordt verstaan onder: - *rund:* een rund ouder dan 24 maanden.'
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel82d
  - number: 82e.1
    text: |-
      De eigenaar of exploitant van een slachthuis laat steekproefsgewijs aan de slachtlijn bloedmonsters nemen en staat
      deze af ten behoeve van de monitoring van endemische leukose bij runderen.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel82e
  - number: 82e.2
    text: Bloedmonsters worden van individuele runderen, ouder dan twee jaar, van niet-melk leverende bedrijven, genomen.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel82e
  - number: 82e.3
    text: Er worden geen monsters samengevoegd van verschillende runderen of bedrijven.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel82e
  - number: 82e.4
    text: |-
      Bloedmonsters worden onderzocht in een laboratorium dat daartoe is aangewezen in
      [artikel 20 van de Regeling erkenning en aanwijzing veterinaire laboratoria][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019575#Artikel20
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel82e
    references:
      - id: ref1
        bwb_id: BWBR0019575
        artikel: '20'
  - number: 82e.5
    text: De eigenaar of exploitant van een slachthuis houdt een administratie bij van de bemonstering.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel82e
  - number: 82f
    text: |-
      De houder van runderen staat toe dat steekproefsgewijs een monster van de tankmelk door een daartoe aangewezen
      laboratorium wordt onderzocht ten behoeve van de monitoring van endemische leukose bij runderen.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel82f
  - number: '83.1'
    text: |-
      Het is verboden, onverminderd de [artikelen 19][ref1] en [100 van de wet][ref2], AI-gevoelige dieren op een bedrijf
      te houden.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel100
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0005662
        artikel: '100'
  - number: '83.2'
    text: |-
      Het in het eerste lid bedoelde verbod geldt niet indien wordt voldaan aan [artikel 84][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel84
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '84'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '84.1'
    text: 'De ondernemer meldt onverwijld aan het landelijk telefoonnummer voor dierziekten elke verhoogde sterfte:'
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel84
  - number: 84.1.a
    text: |-
      van leghennen, vermeerderingsdieren of vleeskuikens, die ouder zijn dan 10 dagen op twee opeenvolgende dagen van
      0,5% of meer per koppel per dag;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel84
  - number: 84.1.b
    text: van vleeskalkoenen op twee opeenvolgende dagen van 1% of meer per koppel per dag, en
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel84
  - number: 84.1.c
    text: van AI-gevoelige dieren van meer dan 3% per week.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel84
  - number: '84.2'
    text: 'De ondernemer consulteert een dierenarts indien bij AI-gevoelige dieren:'
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel84
  - number: 84.2.a
    text: een klinisch probleem zichtbaar is;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel84
  - number: 84.2.b
    text: er op twee opeenvolgende dagen een reductie van voer- of drinkwateropname is van meer dan 5% per dag, en
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel84
  - number: 84.2.c
    text: |-
      voor zover het leghennen of vermeerderingsdieren betreft, er op twee opeenvolgende dagen een reductie van de
      eiproductie is van 5% of meer per dag.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel84
  - number: '84.3'
    text: |-
      Indien er geen sprake is van aviaire influenza of Newcastle disease doet de dierenarts binnen acht uur melding van
      het klinische probleem van de desbetreffende dieren of van de omstandigheden, bedoeld in het tweede lid, onderdelen
      b en c, en van de naam- en adresgegevens van het bedrijf aan de Gezondheidsdienst voor Dieren.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel84
  - number: '85.1'
    text: |-
      Deze paragraaf is van toepassing op een houder die bedrijfsmatig vleeskuikens, vleeseenden, vleeskalkoenen, ganzen,
      kwartels, parelhoenders, loopvogels, vermeerderingsdieren van de soort kip, kalkoen of eend of leghennen van de
      soort kip houdt, die worden opgefokt of gehouden voor de fokkerij, voor de productie van vlees of eieren.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel85
  - number: '85.2'
    text: |-
      Deze paragraaf is van toepassing op vermeerderingsdieren van de soort kip, kalkoen of eend en leghennen van de
      soort kip.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel85
  - number: '86.1'
    text: |-
      De houder, bedoeld in [artikel 85, eerste lid][ref1], laat overeenkomstig de [artikelen 87 tot en met 92][ref2]
      bloed afnemen bij de dieren, bedoeld in artikel 85, eerste lid, en laat dit onderzoeken op de aanwezigheid van
      antistoffen tegen aviaire influenza, subtype H5 of H7, bedoeld in Richtlijn 2005/94/EG in een laboratorium dat
      daartoe is aangewezen in [artikel 20, van de Regeling erkenning en aanwijzing veterinaire laboratoria][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel85
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel87
      [ref3]: https://wetten.overheid.nl/BWBR0019575#Artikel20
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '85'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0018397
        artikel: '87'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0019575
        artikel: '20'
  - number: '86.2'
    text: De houder laat het bloed afnemen door een dierenarts of een dierenartsassistent paraveterinair.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel86
  - number: '86.3'
    text: |-
      De hoeveelheid bloed die overeenkomstig het eerste lid per dier wordt afgenomen en onderzocht bedraagt ten minste
      1 milliliter.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel86
  - number: '86.4'
    text: |-
      Het bloed wordt de uiterlijk werkdag na de dag dat het bloed is afgenomen aangeleverd bij het laboratorium, bedoeld
      in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel86
  - number: '86.5'
    text: 'Bij aanlevering van het bloed worden in ieder geval de volgende gegevens aangeleverd:'
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel86
  - number: 86.5.a
    text: gegevens ter identificatie van de houder van de dieren;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel86
  - number: 86.5.b
    text: gegevens ter identificatie van de dierenarts die het bloed heeft afgenomen;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel86
  - number: 86.5.c
    text: gegevens ter identificatie van de dieren waarbij het bloed is afgenomen;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel86
  - number: 86.5.d
    text: gegevens omtrent de bloedmonsters;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel86
  - number: 86.5.e
    text: de dagtekening;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel86
  - number: 86.5.f
    text: de handtekening van de inzender van de bloedmonsters.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel86
  - number: '87.1'
    text: |-
      Bij vleeskuikens, parelhoenders, loopvogels of kwartels wordt jaarlijks bloed afgenomen van ten minste 30 dieren
      met een leeftijd van ten minste vier weken.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel87
  - number: '87.2'
    text: |-
      Bij vleeseenden of ganzen wordt jaarlijks bloed afgenomen van ten minste 40 dieren met een leeftijd van ten minste
      vier weken.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel87
  - number: '88.1'
    text: Bij vleeskalkoenen wordt bij elke ronde bloed afgenomen van ten minste 30 hanen met een leeftijd van 18 weken.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel88
  - number: '88.2'
    text: |-
      In afwijking van het eerste lid wordt, indien de houder geen andere vleeskalkoenen dan hennen houdt, bloed
      afgenomen van ten minste 30 hennen met een leeftijd van ten minste 13 weken.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel88
  - number: '89.1'
    text: |-
      Bij vermeerderingsdieren wordt jaarlijks bloed afgenomen van ten minste 30 dieren met een leeftijd van ten minste
      45 weken.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel89
  - number: '89.2'
    text: |-
      Bij dieren die worden opgefokt tot vermeerderingsdier wordt per koppel bloed afgenomen van ten minste 30 dieren met
      een leeftijd van ten minste 15 weken.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel89
  - number: '90.1'
    text: Bij leghennen wordt jaarlijks bloed afgenomen van ten minste 30 dieren met een leeftijd van ten minste 45 weken.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel90
  - number: '90.2'
    text: |-
      Bij dieren die worden opgefokt tot leghen wordt per koppel bloed afgenomen van ten minste 30 dieren met een
      leeftijd van ten minste acht weken.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel90
  - number: '91'
    text: |-
      In afwijking van de [artikelen 87 tot en met 90][ref1] wordt bij dieren als bedoeld in
      [artikel 85, eerste lid][ref2], die gehouden worden op een bedrijf waar onder meer dieren worden gehouden in een
      houderijsysteem met vrije uitloop als bedoeld in bijlage II, onderdeel 1 van Verordening (EG) nr. 589/2008, ieder
      kwartaal bloed afgenomen, bij ten minste 30 dieren, ongeacht de leeftijd van de dieren.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel87
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel85
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '87'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0018397
        artikel: '85'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '92'
    text: |-
      Indien de dieren, bedoeld in de [artikelen 87 tot en met 91][ref1], gehouden worden in meerdere stallen, wordt bij
      dieren uit elke stal bloed afgenomen naar evenredigheid van het aantal dieren dat in de stallen wordt gehouden, met
      een minimum van 5 dieren per stal.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel87
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '87'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '93'
    text: |-
      Een koppel van de dieren, bedoeld in [artikel 85, eerste lid][ref1], wordt alleen verplaatst naar een ander bedrijf
      waar dieren als bedoeld in artikel 85, eerste lid, worden gehouden, indien kan worden aangetoond dat bloed van de
      dieren overeenkomstig [artikel 86, eerste lid][ref2], is onderzocht en de uitslag van dit onderzoek bekend is.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel85
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel86
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '85'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0018397
        artikel: '86'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '94'
    text: |-
      Een houder bewaart de uitslag van het onderzoek, bedoeld in artikel 86, eerste lid, gedurende een periode van twee
      jaar.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94
  - number: 94a.1
    text: |-
      Deze paragraaf is van toepassing op een houder die bedrijfsmatig vermeerderingsdieren van de soort kip of kalkoen,
      leghennen van de soort kip, vleeskuikens of vleeskalkoenen houdt, die worden opgefokt of gehouden voor de fokkerij,
      voor de productie van vlees of eieren.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94a
  - number: 94a.2
    text: Deze paragraaf is van toepassing op vermeerderingsdieren van de soort kip of kalkoen en leghennen van de soort kip.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94a
  - number: 94b.1
    text: |-
      De houder, bedoeld in [artikel 94a, eerste lid][ref1], draagt er zorg voor dat de dieren, bedoeld in artikel 94a,
      eerste lid, tegen Newcastle disease worden gevaccineerd overeenkomstig de [artikelen 94c][ref2] en [94d][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel94a
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel94c
      [ref3]: https://wetten.overheid.nl/BWBR0018397#Artikel94d
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94b
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 94a
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0018397
        artikel: 94c
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0018397
        artikel: 94d
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 94b.2
    text: |-
      Het eerste lid is niet van toepassing op dieren die voorafgaand aan de aanvoer op het bedrijf van de houder
      overeenkomstig het eerste lid zijn gevaccineerd, mits de houder aan kan tonen dat uit het onderzoek, bedoeld in
      [artikel 94e][ref1], is gebleken dat de betreffende waarde, genoemd in [bijlage 16][ref2] is behaald.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel94e
      [ref2]: https://wetten.overheid.nl/BWBR0018397
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94b
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 94e
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0018397
  - number: 94b.3
    text: |-
      Onmiddellijk na vaccinatie vult de houder een vaccinatieverklaring met gebruikmaking van een middel dat hiertoe
      door de minister beschikbaar is gesteld en waarop in ieder geval de volgende gegevens zijn opgenomen:
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94b
  - number: 94b.3.a
    text: gegevens ter identificatie van de houder van de dieren;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94b
  - number: 94b.3.b
    text: |-
      gegevens ter identificatie van de dierenarts die de dieren heeft gevaccineerd of hiertoe een diergeneesmiddel heeft
      afgeleverd;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94b
  - number: 94b.3.c
    text: gegevens ter identificatie van de dieren die gevaccineerd zijn;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94b
  - number: 94b.3.d
    text: gegevens omtrent de aard van de vaccinatie;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94b
  - number: 94b.3.e
    text: gegevens omtrent het vaccin;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94b
  - number: 94b.3.f
    text: de dagtekening;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94b
  - number: 94b.3.g
    text: de handtekening van de houder en de dierenarts.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94b
  - number: 94c.1
    text: |-
      De vaccinatie, bedoeld in [artikel 94b, eerste lid][ref1], vindt plaats:


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel94b
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94c
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 94b
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 94c.1.a
    text: in de periode van 3 tot en met 18 dagen nadat de dieren zijn uitgekomen, of
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94c
  - number: 94c.1.b
    text: voor zover gebruik wordt gemaakt van een niet-spreidend vaccin, voordat de dieren 3 dagen oud zijn.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94c
  - number: 94c.2
    text: |-
      In afwijking van het eerste lid worden dieren die afkomstig zijn van vermeerderingsdieren die niet zijn
      gevaccineerd tegen Newcastle disease onmiddellijk na plaatsing op het bedrijf gevaccineerd.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94c
  - number: 94c.3
    text: |-
      Dieren die ouder zijn dan 18 dagen en niet gevaccineerd zijn overeenkomstig het eerste lid, omdat zij uit een ander
      land dan Nederland afkomstig zijn, worden onmiddellijk na plaatsing op het bedrijf gevaccineerd.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94c
  - number: 94c.4
    text: 'In aanvulling op het eerste tot en met het derde lid, worden leghennen en vermeerderingsdieren:'
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94c
  - number: 94c.4.a
    text: voor zover het dieren, anders dan kalkoenen betreft, binnen 22 weken na het uitkomen;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94c
  - number: 94c.4.b
    text: voor zover het kalkoenen betreft, binnen 30 weken na het uitkomen;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94c
  - number: 94d.1
    text: |-
      Voor de vaccinatie wordt gebruik gemaakt van een vaccin dat voldoet aan de eisen, gesteld in Beschikking 93/152/
      EEG.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94d
  - number: 94d.2
    text: |-
      Van het verbod, bedoeld in de [artikelen 2, vierde lid][ref1] en
      [3 van het Besluit gebruik sera en entstoffen][ref2], wordt vrijstelling verleend voor het overeenkomstig deze
      paragraaf vaccineren van dieren.


      [ref1]: https://wetten.overheid.nl/BWBR0009198#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009198#Artikel3
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94d
    references:
      - id: ref1
        bwb_id: BWBR0009198
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0009198
        artikel: '3'
  - number: 94e.1
    text: |-
      De houder, bedoeld in [artikel 94a, eerste lid][ref1], laat overeenkomstig de [artikelen 94f tot en met 94j][ref2],
      bloed afnemen bij de dieren, bedoeld in artikel 94a, eerste lid, en laat dit onderzoeken op de werking
      van de vaccinatie, bedoeld in artikel 94b, eerste lid, in een laboratorium dat daartoe is aangewezen in
      [artikel 20, van de Regeling erkenning en aanwijzing veterinaire laboratoria][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel94a
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel94f
      [ref3]: https://wetten.overheid.nl/BWBR0019575#Artikel20
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94e
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 94a
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0018397
        artikel: 94f
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0019575
        artikel: '20'
  - number: 94e.2
    text: De houder laat het bloed afnemen door een dierenarts of een dierenartsassistent paraveterinair.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94e
  - number: 94e.3
    text: |-
      De hoeveelheid bloed die overeenkomstig het eerste lid per dier wordt afgenomen en onderzocht bedraagt ten minste
      1 milliliter.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94e
  - number: 94e.4
    text: |-
      Het bloed wordt uiterlijk de werkdag na de dag dat het bloed is afgenomen aangeleverd bij het laboratorium, bedoeld
      in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94e
  - number: 94e.5
    text: 'Bij aanlevering van het bloed worden in ieder geval de volgende gegevens aangeleverd:'
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94e
  - number: 94e.5.a
    text: gegevens ter identificatie van de houder van de dieren;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94e
  - number: 94e.5.b
    text: gegevens ter identificatie van de dierenarts die het bloed heeft afgenomen;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94e
  - number: 94e.5.c
    text: gegevens ter identificatie van de dieren waarbij het bloed is afgenomen;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94e
  - number: 94e.5.d
    text: gegevens omtrent de bloedmonsters;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94e
  - number: 94e.5.e
    text: de dagtekening;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94e
  - number: 94e.5.f
    text: de handtekening van de inzender van de bloedmonsters.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94e
  - number: 94f
    text: |-
      Bij vermeerderingsdieren of dieren die worden opgefokt tot vermeerderingsdier wordt bloed afgenomen van ten minste
      30 dieren per stal op de volgende momenten:
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94f
  - number: 94f.a
    text: |-
      70 dagen na het uitkomen, tenzij het koppel sinds het uitkomen met tussenpozen van ten hoogste zes weken door een
      dierenarts is gevaccineerd met een levende entstof en die vaccinaties door middel van een spray of aërosol zijn
      uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94f
  - number: 94f.b
    text: |-
      binnen zes weken nadat de vaccinatie, bedoeld in [artikel 94c, vierde lid][ref1], is uitgevoerd;


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel94c
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94f
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 94c
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 94f.c
    text: in de periode van 40 tot 48 weken na het uitkomen, voor zover het dieren, anders dan kalkoenen betreft;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94f
  - number: 94f.d
    text: in de periode van 50 tot 58 weken na het uitkomen, voor zover het kalkoenen betreft;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94f
  - number: 94f.e
    text: in de periode van 70 tot 75 weken na het uitkomen;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94f
  - number: 94f.f
    text: |-
      binnen 20 dagen voorafgaand aan een verplaatsing van een koppel naar een ander bedrijf waar bedrijfsmatig vogels
      worden gehouden, voor zover het koppel op de dag van verplaatsing 28 dagen of ouder is.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94f
  - number: 94g
    text: |-
      Bij leghennen of dieren die worden opgefokt tot leghen wordt bloed afgenomen van ten minste 30 dieren per stal op
      de volgende momenten:
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94g
  - number: 94g.a
    text: |-
      70 dagen na het uitkomen, tenzij het koppel sinds het uitkomen met tussenpozen van ten hoogste zes weken door een
      dierenarts is gevaccineerd met een levende entstof en die vaccinaties door middel van een spray of aërosol zijn
      uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94g
  - number: 94g.b
    text: |-
      binnen zes weken nadat de vaccinatie, bedoeld in [artikel 94c, vierde lid][ref1], is uitgevoerd;


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel94c
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94g
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 94c
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 94g.c
    text: in de periode van 90 tot 95 weken na het uitkomen;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94g
  - number: 94g.d
    text: binnen 9 weken voordat het koppel wordt geslacht;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94g
  - number: 94g.e
    text: |-
      binnen 20 dagen voorafgaand aan een verplaatsing van een koppel naar een ander bedrijf waar bedrijfsmatig vogels
      worden gehouden, voor zover het koppel op de dag van verplaatsing 28 dagen of ouder is.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94g
  - number: 94h
    text: |-
      Bij vleeskuikens wordt bloed afgenomen van ten minste 30 dieren per koppel, waaronder ten minste 5 dieren per stal
      op de volgende momenten:
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94h
  - number: 94h.a
    text: in de periode van 4 tot 6 weken na het uitkomen;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94h
  - number: 94h.b
    text: |-
      70 dagen na het uitkomen, tenzij het koppel sinds het uitkomen met tussenpozen van ten hoogste zes weken door een
      dierenarts is gevaccineerd met een levende entstof en die vaccinaties door middel van een spray of aërosol zijn
      uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94h
  - number: 94i
    text: |-
      Bij vleeskalkoenen wordt bloed afgenomen van ten minste 30 dieren per koppel, waaronder ten minste 5 dieren per
      stal op de volgende momenten:
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94i
  - number: 94i.a
    text: vanaf dertien weken na het uitkomen;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94i
  - number: 94i.b
    text: |-
      binnen 20 dagen voorafgaand aan een verplaatsing van een koppel naar een ander bedrijf waar bedrijfsmatig vogels
      worden gehouden, voor zover het koppel op de dag van verplaatsing 28 dagen of ouder is en het onderzoek, bedoeld in
      onderdeel a, nog niet heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94i
  - number: 94j
    text: |-
      Indien het dieren, bedoeld in [artikel 94c, derde lid][ref1], betreft, is de aanhef van de [artikelen 94f][ref2],
      [94g][ref3], [94h][ref4] of [94i][ref5], van overeenkomstige toepassing en wordt bloed afgenomen in de periode van
      3 tot 4 weken na de datum waarop de dieren zijn gevaccineerd.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel94c
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel94f
      [ref3]: https://wetten.overheid.nl/BWBR0018397#Artikel94g
      [ref4]: https://wetten.overheid.nl/BWBR0018397#Artikel94h
      [ref5]: https://wetten.overheid.nl/BWBR0018397#Artikel94j
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94j
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 94c
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0018397
        artikel: 94f
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0018397
        artikel: 94g
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0018397
        artikel: 94h
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref5
        bwb_id: BWBR0018397
        artikel: 94j
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 94k.1
    text: |-
      Wanneer uit het onderzoek, bedoeld in [artikel 94e, eerste lid][ref1], blijkt dat de betreffende waarde, genoemd
      in [bijlage 16][ref2], onderdeel 1, bij een koppel vermeerderingdieren, leghennen of dieren die worden opgefokt
      tot vermeerderingsdier of leghen niet wordt behaald, laat de houder de dieren terstond door een dierenarts
      vaccineren en worden de dieren binnen vier weken na vaccinatie overeenkomstig artikel 94e in samenhang met
      [artikel 94f, aanhef][ref3] of [94g, aanhef][ref4], onderzocht.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel94e
      [ref2]: https://wetten.overheid.nl/BWBR0018397
      [ref3]: https://wetten.overheid.nl/BWBR0018397#Artikel94f
      [ref4]: https://wetten.overheid.nl/BWBR0018397#Artikel94g
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94k
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 94e
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0018397
      - id: ref3
        bwb_id: BWBR0018397
        artikel: 94f
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0018397
        artikel: 94g
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 94k.2
    text: |-
      Indien een koppel leghennen of dieren die worden opgefokt tot leghen niet overeenkomstig het eerste lid
      gevaccineerd is, dan wel zijn, laat de houder bij het eerstvolgende koppel in aanvulling op [artikel 94g][ref1] en
      binnen 40 tot 42 weken na het uitkomen overeenkomstig artikel 94e bloed afnemen en onderzoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel94g
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94k
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 94g
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 94k.3
    text: |-
      De houder stuurt uiterlijk twee weken na de vaccinatie een kopie van de vaccinatieverklaring, bedoeld in
      [artikel 94b, derde lid][ref1], aan de Gezondheidsdienst voor dieren.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel94b
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94k
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 94b
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 94l.1
    text: |-
      Wanneer uit het onderzoek, bedoeld in [artikel 94e, eerste lid][ref1], blijkt dat de betreffende waarde, genoemd
      in [bijlage 16][ref2], onderdeel 2, bij een koppel vleeskuikens niet wordt behaald, maakt de houder van de dieren
      in overleg met een dierenarts een analyse van de mogelijke oorzaken van het niet behalen van de waarde en een plan
      van aanpak.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel94e
      [ref2]: https://wetten.overheid.nl/BWBR0018397
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94l
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 94e
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0018397
  - number: 94l.2
    text: |-
      Het plan van aanpak wordt uitgevoerd bij de eerstvolgende twee koppels vleeskuikens die op het bedrijf worden
      gevaccineerd.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94l
  - number: 94l.3
    text: |-
      Wanneer uit het onderzoek, bedoeld in [artikel 94e, eerste lid][ref1], blijkt dat de betreffende waarde, genoemd in
      [bijlage 16][ref2], onderdeel 2, bij het tweede koppel, bedoeld in het tweede lid, niet wordt behaald, herziet de
      houder het plan van aanpak in overleg met de Gezondheidsdienst voor dieren.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel94e
      [ref2]: https://wetten.overheid.nl/BWBR0018397
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94l
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 94e
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0018397
  - number: 94l.4
    text: |-
      Het herziene plan van aanpak wordt uitgevoerd bij ten minste de eerstvolgende zes koppels vleeskuikens die op het
      bedrijf worden gevaccineerd.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94l
  - number: 94l.5
    text: 'Het plan van aanpak bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94l
  - number: 94l.5.a
    text: |-
      maatregelen die erop zijn gericht om de betreffende waarde, genoemd in [bijlage 16][ref1], onderdeel 2, bij de
      volgende koppels te behalen;


      [ref1]: https://wetten.overheid.nl/BWBR0018397
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94l
    references:
      - id: ref1
        bwb_id: BWBR0018397
  - number: 94l.5.b
    text: de naam en handtekening van de houder;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94l
  - number: 94l.5.c
    text: |-
      een door de minister toegekend registratienummer als bedoeld in
      [artikel 3 van de Regeling identificatie en registratie van dieren][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel3
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94l
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '3'
  - number: 94l.5.d
    text: de datum van opstellen van het plan van aanpak.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94l
  - number: 94l.6
    text: |-
      De houder stuurt een kopie van het plan van aanpak of het herziene plan van aanpak aan de Gezondheidsdienst voor
      dieren.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94l
  - number: 94m.1
    text: |-
      Wanneer uit het onderzoek, bedoeld in [artikel 94e, eerste lid][ref1], blijkt dat de betreffende waarde, genoemd in
      [bijlage 16][ref2], onderdeel 2, bij een koppel vleeskalkoenen niet wordt behaald, laat de houder de eerstvolgende
      twee koppels vleeskalkoenen die op het bedrijf worden gevaccineerd door een dierenarts vaccineren.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel94e
      [ref2]: https://wetten.overheid.nl/BWBR0018397
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94m
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 94e
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0018397
  - number: 94m.2
    text: |-
      Wanneer uit het onderzoek, bedoeld in [artikel 94e, eerste lid][ref1], blijkt dat de betreffende waarde, genoemd
      in [bijlage 16][ref2], onderdeel 2, bij een koppel vleeskalkoenen dat overeenkomstig het eerst lid gevaccineerd
      is, niet wordt behaald, laat de houder de eerstvolgende drie koppels vleeskalkoenen die op het bedrijf worden
      gevaccineerd door een dierenarts vaccineren:


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel94e
      [ref2]: https://wetten.overheid.nl/BWBR0018397
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94m
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 94e
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0018397
  - number: 94m.2.a
    text: in de periode van 10 tot 15 dagen na het uitkomen;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94m
  - number: 94m.2.b
    text: in de periode van 28 tot 35 dagen na het uitkomen;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94m
  - number: 94m.2.c
    text: in de periode van 8 tot 10 weken na het uitkomen;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94m
  - number: 94m.2.d
    text: indien het mannelijke dieren betreft, 16 weken na het uitkomen.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94m
  - number: 94m.3
    text: |-
      De houder stuurt uiterlijk twee weken na de vaccinatie een kopie van de vaccinatieverklaring, bedoeld in
      [artikel 94b, derde lid][ref1], aan de Gezondheidsdienst voor dieren.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel94b
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94m
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 94b
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 94n
    text: |-
      Een koppel van de dieren, bedoeld in [artikel 94a, eerste lid][ref1], wordt alleen verplaatst van een
      bedrijf naar een ander bedrijf waar deze dieren worden gehouden of naar een andere locatie van hetzelfde
      bedrijf, waarbij de dieren over de openbare weg worden vervoerd, indien is voldaan aan het bepaalde in de
      [artikelen 94o tot en met 94q][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel94a
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel94o
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94n
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 94a
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0018397
        artikel: 94o
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 94o.1
    text: |-
      Van een koppel van de dieren, bedoeld in [artikel 94a, eerste lid][ref1], dat binnen 28 dagen na het uitkomen
      wordt verplaatst, zijn de dieren ten minste zeven dagen voor verplaatsing gevaccineerd door middel van een spray
      of aërosol.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel94a
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94o
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 94a
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 94o.2
    text: |-
      Van een koppel van de dieren, bedoeld in [artikel 94a, eerste lid][ref1], dat wordt verplaatst in de periode van 28
      tot 70 dagen na het uitkomen:


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel94a
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94o
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 94a
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 94o.2.a
    text: |-
      kan worden aangetoond dat de dieren overeenkomstig [artikel 94e, eerste lid][ref1] zijn onderzocht en dat de
      waarde, bedoeld in [bijlage 16][ref2], onderdeel 1, onder a of onderdeel 2, onder a, is behaald, en


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel94e
      [ref2]: https://wetten.overheid.nl/BWBR0018397
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94o
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 94e
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0018397
  - number: 94o.2.b
    text: |-
      zijn de dieren in de periode van 42 tot 7 dagen voor verplaatsing gevaccineerd door middel van een spray of
      aërosol.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94o
  - number: 94o.3
    text: |-
      Het eerste lid is niet van toepassing op dieren die binnen 8 dagen na het uitkomen worden verplaatst, indien kan
      worden aangetoond dat de dieren afkomstig zijn van ouderdieren die overeenkomstig deze paragraaf gevaccineerd zijn.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94o
  - number: 94p.1
    text: |-
      Van een koppel vermeerderingdieren, leghennen of dieren die worden opgefokt tot vermeerderingsdier of
      leghen dat wordt verplaatst na 70 dagen na het uitkomen, kan worden aangetoond dat de dieren overeenkomstig
      [artikel 94e, eerste lid][ref1], zijn onderzocht en dat de waarde, bedoeld in [bijlage 16][ref2], onderdeel 1,
      onder b, c of d, is behaald.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel94e
      [ref2]: https://wetten.overheid.nl/BWBR0018397
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94p
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 94e
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0018397
  - number: 94p.2
    text: |-
      Van een koppel vermeerderingdieren, leghennen of dieren die worden opgefokt tot vermeerderingsdier of leghen dat
      wordt verplaatst na 70 dagen na het uitkomen, waarbij de waarde, bedoeld in [bijlage 16][ref1], onderdeel 1, onder
      b, c of d niet is behaald, zijn de dieren sinds het uitkomen met tussenpozen van ten hoogste zes weken door middel
      van een spray of aërosol gevaccineerd, waarbij de laatste vaccinatie ten minste zeven dagen voor de verplaatsing
      is uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0018397
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94p
    references:
      - id: ref1
        bwb_id: BWBR0018397
  - number: 94q
    text: |-
      Van een koppel vleeskuikens of vleeskalkoenen dat wordt verplaatst na 70 dagen na het uitkomen, kan worden
      aangetoond dat het koppel overeenkomstig [artikel 94e, eerste lid][ref1], is onderzocht en dat de waarde, bedoeld
      in [bijlage 16][ref2], onderdeel 2, onder b, is behaald.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel94e
      [ref2]: https://wetten.overheid.nl/BWBR0018397
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94q
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 94e
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0018397
  - number: 94r.1
    text: |-
      Een houder bewaart de vaccinatieverklaring, bedoeld in [artikel 94b, derde lid][ref1], en de resultaten van het
      onderzoek, bedoeld in [artikel 94e, eerste lid][ref2], gedurende een periode van twee jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel94b
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel94e
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94r
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 94b
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0018397
        artikel: 94e
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 94r.2
    text: |-
      Een houder die vermeerderingdieren, leghennen of dieren die worden opgefokt tot vermeerderingsdier of leghen houdt,
      en deze dieren aan een andere houder overdraagt, doet deze houder een kopie van de vaccinatieverklaringen, bedoeld
      in [artikel 94b, derde lid][ref1], en resultaten van het onderzoek, bedoeld in [artikel 94e, eerste lid][ref2],
      toekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel94b
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel94e
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94r
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 94b
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0018397
        artikel: 94e
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 94r.3
    text: |-
      Een houder bewaart het plan van aanpak, bedoeld in [artikel 94l, tweede lid][ref1], en het herziene plan van
      aanpak, bedoeld in artikel 94l, vierde lid, gedurende de periode dat er op grond van deze paragraaf verplichtingen
      tot vaccinatie gelden met betrekking tot de dieren waarop het plan van aanpak, dan wel het herziene plan van aanpak
      van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel94l
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94r
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 94l
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 94s
    text: Deze paragraaf is van toepassing op bedrijfsmatig gehouden kippen en kalkoenen.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94s
  - number: 94t.1
    text: |-
      Een houder van kippen of kalkoenen laat die dieren overeenkomstig dit artikel onderzoeken, waarbij een bloedmonster
      van:
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94t
  - number: 94t.1.a
    text: kippen of kalkoenen wordt onderzocht op de aanwezigheid van antistoffen tegen Mycoplasma gallisepticum, en
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94t
  - number: 94t.1.b
    text: |-
      kalkoenen als bedoeld het tweede lid, onderdeel b, en, voor zover de monsters afkomstig zijn van kalkoenen die
      worden gehouden als vermeerderingsdier, zesde lid, onderzoeken op de aanwezigheid van antistoffen tegen Mycoplasma
      meleagridis.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94t
  - number: 94t.2
    text: |-
      Een houder van kippen of kalkoenen die worden gehouden als vermeerderingsdier of die daartoe worden opgefokt laat
      per stal bij 1% van het aantal dieren, maar bij ten minste 30 en ten hoogste 60 dieren ten minste 1 milliliter
      bloed afnemen:
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94t
  - number: 94t.2.a
    text: |-
      in geval van kippen: op een leeftijd van 15 of 16 weken, 20 tot en met 22 weken, 30 weken, en vervolgens iedere
      12 weken;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94t
  - number: 94t.2.b
    text: 'in geval van kalkoenen: op een leeftijd van 10 weken, 18 weken, 26 weken en vervolgens iedere 12 weken;'
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94t
  - number: 94t.2.c
    text: |-
      in de twee weken voorafgaand aan het vervoer naar een ander bedrijf waar kippen of kalkoenen gehouden worden,
      behalve bij eendagskuikens.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94t
  - number: 94t.3
    text: |-
      In afwijking van het tweede lid, onderdeel a, gebeurt de monstername bij kippen die worden gehouden als
      grootouderdier of die daartoe worden opgefokt op een leeftijd van 15 of 16 weken, 20 weken en vervolgens iedere
      8 weken.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94t
  - number: 94t.4
    text: |-
      Een houder die kippen opfokt die bestemd zijn om te worden gehouden als legkip laat in de drie weken voorafgaand
      aan de verplaatsing van een koppel kippen naar een ander legkippenbedrijf per stal bij ten minste 24 van die dieren
      1 milliliter bloed afnemen.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94t
  - number: 94t.5
    text: |-
      Een houder van een koppel legkippen laat in de negen weken voorafgaand aan het moment waarop die dieren worden
      geslacht per stal bij ten minste tien van die dieren 1 milliliter bloed afnemen.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94t
  - number: 94t.6
    text: |-
      Onverminderd het tweede lid, onderdelen b en c, laat een houder van kalkoenen in de drie weken voorafgaand aan het
      moment waarop de dieren worden geslacht bij ten minste 24 van die dieren 1 milliliter bloed afnemen.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94t
  - number: 94u.1
    text: |-
      Een houder laat een monster als bedoeld in [artikel 94t][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel94t
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94u
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 94t
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 94u.1.a
    text: |-
      afnemen door een dierenarts of een dierenartsassistent paraveterinair, bij dieren die zich verspreid over de stal
      of de stallen bevinden, waaronder dieren die vanwege ziekte zijn afgezonderd, en
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94u
  - number: 94u.1.b
    text: |-
      onderzoeken in een laboratorium als bedoeld in
      [artikel 2 van de Regeling erkenning en aanwijzing veterinaire laboratoria][ref1], waar het monster uiterlijk op de
      werkdag na de dag dat het is afgenomen wordt aangeleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0019575#Artikel2
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94u
    references:
      - id: ref1
        bwb_id: BWBR0019575
        artikel: '2'
  - number: 94u.2
    text: 'Bij aanlevering van een monster worden in ieder geval de volgende gegevens aangeleverd:'
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94u
  - number: 94u.2.a
    text: |-
      gegevens ter identificatie van de houder van de dieren, de dierenarts of een dierenartsassistent paraveterinair die
      het monster heeft genomen en de dieren waarbij het monster is genomen;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94u
  - number: 94u.2.b
    text: gegevens omtrent het monster;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94u
  - number: 94u.2.c
    text: de dagtekening;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94u
  - number: 94u.2.d
    text: de naam en handtekening van de inzender van het monster.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94u
  - number: 94v
    text: |-
      Het is verboden legkippen of dieren die daartoe worden opgefokt, die niet tegen Mycoplasma gallisepticum zijn
      gevaccineerd, af te voeren van een bedrijf en aan te voeren op een bedrijf, indien er op dat bedrijf nog legkippen
      aanwezig zijn die gelijktijdig zijn gehouden met al geslachte legkippen waarbij de aanwezigheid van antistoffen
      tegen Mycoplasma gallisepticum was vastgesteld.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94v
  - number: 94w
    text: |-
      De houder bewaart de resultaten van het onderzoek, bedoeld in [artikel 94t, eerste lid][ref1], gedurende een
      periode van twee jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel94t
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94w
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 94t
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 94x
    text: |-
      Deze paragraaf is van toepassing op bedrijfsmatig gehouden kippen, kalkoenen, parelhoenders, kwartels, fazanten,
      patrijzen en eenden, die worden gehouden als vermeerderingsdier.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94x
  - number: 94y.1
    text: |-
      De houder van dieren die behoren tot diersoorten als bedoeld in [artikel 94x][ref1] laat door een dierenarts
      of een dierenartsassistent paraveterinair bij die dieren ten minste 1 milliliter bloed afnemen overeenkomstig
      [artikel 94z][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel94x
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel94z
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94y
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 94x
        hoofdstuk: '2'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0018397
        artikel: 94z
        hoofdstuk: '2'
        paragraaf: '5'
  - number: 94y.2
    text: |-
      De houder laat, in een laboratorium als bedoeld in
      [artikel 2 van de Regeling erkenning en aanwijzing veterinaire laboratoria][ref1], de bloedmonsters:


      [ref1]: https://wetten.overheid.nl/BWBR0019575#Artikel2
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94y
    references:
      - id: ref1
        bwb_id: BWBR0019575
        artikel: '2'
  - number: 94y.2.a
    text: van kalkoenen onderzoeken op de aanwezigheid van Salmonella arizonae;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94y
  - number: 94y.2.b
    text: |-
      van kippen, kalkoenen, parelhoenders, kwartels, fazanten, patrijzen en eenden onderzoeken op de aanwezigheid van
      antistoffen tegen Salmonella Gallinarum en Salmonella Pullorum.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94y
  - number: 94y.3
    text: |-
      Het bloed wordt uiterlijk op de werkdag na de dag dat het bloed is afgenomen aangeleverd bij het laboratorium,
      bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94y
  - number: 94y.4
    text: 'Bij aanlevering van het bloed worden in ieder geval de volgende gegevens aangeleverd:'
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94y
  - number: 94y.4.a
    text: |-
      gegevens ter identificatie van de houder van de dieren, de dierenarts of een dierenartsassistent paraveterinair die
      het bloed heeft afgenomen en de dieren waarbij het bloed is afgenomen;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94y
  - number: 94y.4.b
    text: gegevens omtrent de bloedmonsters;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94y
  - number: 94y.4.c
    text: de dagtekening;
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94y
  - number: 94y.4.d
    text: de naam en handtekening van de inzender van de bloedmonsters.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94y
  - number: 94z.1
    text: |-
      Het bloed, bedoeld in [artikel 94y, eerste lid][ref1], wordt afgenomen bij dieren die zich verspreid over de stal
      bevinden, waarbij ook dieren worden meegenomen die vanwege ziekte zijn afgezonderd.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel94y
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94z
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 94y
        hoofdstuk: '2'
        paragraaf: '5'
  - number: 94z.2
    text: |-
      De houder, bedoeld in [artikel 94y, eerste lid][ref1], laat per stal aan het begin van de productieperiode, voordat
      broedeieren worden afgeleverd, bloed afnemen bij 1% van het aantal dieren, maar bij ten minste 30 dieren en ten
      hoogste 60 dieren.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel94y
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94z
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 94y
        hoofdstuk: '2'
        paragraaf: '5'
  - number: 94aa
    text: |-
      Het is verboden kalkoenen af te voeren van een bedrijf en aan te voeren op een bedrijf waar de aanwezigheid van
      Salmonella arizonae is vastgesteld indien er nog kalkoenen aanwezig zijn die op het moment dat deze besmetting is
      vastgesteld op dat bedrijf aanwezig waren.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94aa
  - number: 94ab
    text: |-
      De houder bewaart de resultaten van het onderzoek, bedoeld in [artikel 94y, tweede lid][ref1], gedurende een
      periode van twee jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel94y
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel94ab
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: 94y
        hoofdstuk: '2'
        paragraaf: '5'
  - number: '95.1'
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel95
  - number: 95.1.a
    text: |-
      *Verordening (EG) nr. 1190/2012:* verordening (EU) nr. 1190/2012 van de Commissie van 12 december 2012 tot
      vaststelling van een doelstelling van de Unie voor het terugdringen van Salmonella enteritidis en Salmonella
      typhimurium bij koppels kalkoenen, als vastgesteld in Verordening (EG) nr. 2160/2003 van het Europees Parlement en
      de Raad (PbEU 2012, L 340);
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel95
  - number: 95.1.b
    text: |-
      *Verordening (EG) nr. 200/2012:* verordening (EU) nr. 200/2012 van de Commissie van 8 maart 2012 tot vaststelling
      van een doelstelling van de Unie voor het terugdringen van Salmonella enteritidis en Salmonella typhimurium bij
      koppels slachtkuikens, als vastgesteld in Verordening (EG) nr. 2160/2003 van het Europees Parlement en de Raad
      (PbEU 2012, L 71);
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel95
  - number: 95.1.c
    text: |-
      *Verordening (EG) nr. 517/2011:* verordening (EU) nr. 517/2011 van de Commissie van 25 mei 2011 ter uitvoering van
      Verordening (EG) nr. 2160/2003 van het Europees Parlement en de Raad wat betreft een doelstelling van de Unie voor
      het verminderen van de prevalentie van bepaalde serotypes van salmonella bij legkippen van Gallus gallus en tot
      wijziging van Verordening (EG) nr. 2160/2003 en Verordening (EU) nr. 200/2010 van de Commissie (PbEU 2011, L 138);
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel95
  - number: 95.1.d
    text: |-
      *Verordening (EG) nr. 200/2010:* verordening (EU) nr. 200/2010 van de Commissie van 10 maart 2010 ter uitvoering
      van Verordening (EG) nr. 2160/2003 van het Europees Parlement en de Raad wat betreft een doelstelling van de Unie
      voor het verminderen van de prevalentie van serotypen salmonella bij volwassen vermeerderingskoppels van Gallus
      gallus (PbEU 2010, L 61);
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel95
  - number: 95.1.e
    text: |-
      *Verordening (EG) nr. 1177/2006:* verordening (EG) nr. 1177/2006 van de Commissie van 1 augustus 2006 ter
      uitvoering van Verordening (EG) nr. 2160/2003 van het Europees Parlement en de Raad wat betreft voorschriften voor
      het gebruik van specifieke bestrijdingsmethoden in het kader van de nationale programma’s voor de bestrijding van
      salmonella bij pluimvee (PbEU 2006, L 212).
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel95
  - number: '95.2'
    text: |-
      In dit hoofdstuk wordt onder Salmonella typhimurium mede verstaan: monofasische Salmonella typhimurium met de
      antigene formule 1, 4, [5], 12:i:-.
    url: https://wetten.overheid.nl/BWBR0018397/2021-01-01#Artikel95
  - number: '96'
