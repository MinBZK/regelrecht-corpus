$id: regeling_subsidie_nationale_en_grensoverschrijdende_parken
regulatory_layer: WET
publication_date: '2007-02-15'
valid_from: '2007-01-01'
valid_to: '2007-03-31'
bwb_id: BWBR0009250
url: https://wetten.overheid.nl/BWBR0009250/2007-01-01
preamble:
  text: |-
    Gelet op de artikelen 2, onderdeel c, en 4 van de Kaderwet LNV-subsidies;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0009250/2007-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a)
            nationaal park:

              bij besluit van de minister aangewezen nationaal park dan wel nationaal park in oprichting;



            b)
            grensoverschrijdend park:

              door de Nederlandse autoriteiten gezamenlijk met België of de Bondsrepubliek Duitsland als zodanig
      aangewezen of aan te wijzen gebied, waarvoor afspraken gelden met betrekking tot het beheer en de inrichting
      daarvan;



            c)
             meerjarenprogramma:

              door het overlegorgaan van een nationaal park jaarlijks opgesteld voortschrijdend begrotingsoverzicht over
      een periode van ten minste drie jaar van de activiteiten met betrekking tot het park gericht op beheer, inrichting,
      educatie, voorlichting en onderzoek;



            d)
             bestedingsplan:

              door het overlegorgaan van een nationaal park jaarlijks op basis van het meerjarenprogramma opgesteld
      overzicht van bestedingen in het eerstvolgende kalenderjaar;



            e)
             beheers- en inrichtingsplan:

              door het overlegorgaan van een nationaal park opgesteld plan met een looptijd van ten minste vijf jaar en
      ten hoogste tien jaar, waarin de uitgangspunten worden neergelegd met betrekking tot beheer, inrichting, educatie,
      voorlichting en onderzoek van een nationaal park;



            f)
            directeur Natuurbeheer:

              directeur Natuurbeheer van het Ministerie van Landbouw, Natuurbeheer en Visserij;



            g)
            Groenfonds:

              Stichting Groenfonds, gevestigd te 's-Gravenhage.
    url: https://wetten.overheid.nl/BWBR0009250/2007-01-01#Artikel1
  - number: '2'
    text: |-
      De minister kan met in achtneming van deze regeling op aanvraag een subsidie verlenen voor projecten gericht op
      beheer, inrichting, educatie, voorlichting en onderzoek van nationale parken alsmede grensoverschrijdende parken.
    url: https://wetten.overheid.nl/BWBR0009250/2007-01-01#Artikel2
  - number: 2a
    text: |-
      Subsidie kan worden verstrekt aan de IVN Vereniging voor natuur- en milieueducatie en de Stichting
      Samenwerkingsverband Nationale Parken.
    url: https://wetten.overheid.nl/BWBR0009250/2007-01-01#Artikel2a
  - number: '3'
    text: |-
      De Minister stelt voor ieder kalenderjaar een subsidieplafond vast voor de op grond van deze regeling te
      verstrekken subsidies. Hij geeft hiervan kennis aan de organisaties, genoemd in [artikel 2a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009250#Artikel2a
    url: https://wetten.overheid.nl/BWBR0009250/2007-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009250
        artikel: 2a
  - number: '6'
    text: |-
      Niet subsidiabel zijn kosten die reeds uit anderen hoofde door het rijk, een provincie, een gemeente of een derde
      worden gefinancierd.
    url: https://wetten.overheid.nl/BWBR0009250/2007-01-01#Artikel6
  - number: '7'
    text: |-
      1 Aanvragen voor een subsidie worden voor 1 december voorafgaand aan het kalenderjaar, waarin met de uitvoering van
      de projecten wordt gestart, ingediend bij de directeur Natuurbeheer.

      2 De aanvraag gaat in elk geval vergezeld van:

      a) een projectplan, inhoudende de omschrijving van de doelstellingen en achtergronden van het project, een
      tijdsplanning van de activiteiten, een beschrijving van de activiteiten en de wijze van uitvoering daarvan;

      b) een begroting van de kosten en financieringswijze van het project.
    url: https://wetten.overheid.nl/BWBR0009250/2007-01-01#Artikel7
  - number: '8'
    text: |-
      1 De minister geeft voor 15 februari van het jaar waarvoor de subsidie wordt toegekend een beschikking tot
      subsidieverlening.

      2 De minister kan voorschotten ten behoeve van IVN Vereniging voor natuur- en milieueducatie ter beschikking via
      het Groenfonds verlenen.

      3 De minister stelt toegekende subsidies en voorschotten ten behoeve van IVN Vereniging voor natuur- en
      milieueducatie ter beschikking via het Groenfonds ter beschikking door tussenkomst van het Groenfonds.
    url: https://wetten.overheid.nl/BWBR0009250/2007-01-01#Artikel8
  - number: '9'
    text: |-
      1 De aanvraag tot vaststelling van de subsidie wordt voor 31 december van het kalenderjaar volgend op het jaar
      waarvoor de subsidie is verleend ingediend bij de directeur Natuurbeheer door tussenkomst van het Groenfonds.

      2 De aanvraag gaat in elk geval vergezeld van een financiële verantwoording van het project, bestaande uit een
      rekening alsmede een goedkeurende verklaring van een accountant of een accountant-administratieconsulent als
      bedoeld in artikel 2:393, eerste lid, van het Burgerlijk Wetboek, waaruit blijkt dat is voldaan aan de bij of
      krachtens deze regeling gestelde voorwaarden en verplichtingen.
    url: https://wetten.overheid.nl/BWBR0009250/2007-01-01#Artikel9
  - number: '11'
    text: Deze regeling treedt in werking met ingang van 1 januari 1998.
    url: https://wetten.overheid.nl/BWBR0009250/2007-01-01#Artikel11
  - number: '12'
    text: 'Deze regeling wordt aangehaald als: Regeling subsidie nationale en grensoverschrijdende parken.'
    url: https://wetten.overheid.nl/BWBR0009250/2007-01-01#Artikel12
