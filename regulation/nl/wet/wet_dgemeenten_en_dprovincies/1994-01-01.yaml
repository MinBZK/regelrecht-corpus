  - number: '13'
    text: |-
      1 Zodra de [onderdelen B en D van artikel 4][ref1] ophouden te gelden, is op besluiten die ingevolge die onderdelen
      aan de goedkeuring van gedeputeerde staten waren onderworpen, doch nog niet door gedeputeerde staten zijn
      goedgekeurd, [artikel 218 van de Gemeentewet][ref2] van toepassing.

      2 Zodra [onderdeel C van artikel 4][ref3] ophoudt te gelden, blijft dat onderdeel van toepassing op besluiten die
      ingevolge dat onderdeel aan goedkeuring bij koninklijk besluit waren onderworpen en reeds aan Onze Minister waren
      gezonden.


