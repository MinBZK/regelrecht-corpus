  - number: '12'
    text: |-
      1 Op besluiten die ingevolge [artikel 271](onbekend) of [271](onbekend) aan de goedkeuring van gedeputeerde staten
      zijn onderworpen, doch waaromtrent gedeputeerde staten voor de inwerkingtreding van deze wet reeds overeenkomstig
      [artikel 271, eerste lid, van de gemeentewet][ref1] hun gevoelen ter kennis van Onze Minister van Binnenlandse
      Zaken hebben gebracht, blijft [artikel 271][ref2] van toepassing.

      2 Besluiten die ingevolge [artikel 271](onbekend) aan Onze goedkeuring zijn onderworpen, doch voor de
      inwerkingtreding van deze wet overeenkomstig [artikel 271, eerste lid, van de gemeentewet][ref3] aan gedeputeerde
      staten zijn toegezonden, worden, indien gedeputeerde staten hun gevoelen omtrent deze besluiten nog niet aan Onze
      Minister van Binnenlandse Zaken ter kennis hebben gebracht, door hen onverwijld aan Onze Minister van Binnenlandse
      Zaken doorgezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel271
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel271
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel271
