preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is ten behoeve van gemeenten en provincies experimenten
    mogelijk te maken gericht op de vereenvoudiging van regelgeving en de vergroting van gemeentelijke en provinciale
    beleidsvrijheid;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0005182/1994-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daaruit voortvloeiende bepalingen wordt verstaan onder:

      a. D'gemeente: een gemeente aangewezen krachtens [artikel 2][ref1], waarvoor experimentele bepalingen gelden;

      b. D'provincie: een provincie aangewezen krachtens [artikel 2][ref2], waarvoor experimentele bepalingen gelden;

      c. experimentele bepalingen: aangepaste regels gesteld ter vereenvoudiging van regelgeving of vergroting van
      gemeentelijke of provinciale beleidsvrijheid;

      d. Onze Minister: Onze Minister van Binnenlandse Zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0005182#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005182#Artikel2
    url: https://wetten.overheid.nl/BWBR0005182/1994-01-01#Artikel1
    references:
