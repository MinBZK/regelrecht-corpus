        artikel: '2'
        hoofdstuk: '1'
  - number: '2'
    text: |-
      1 Het aantal D'gemeenten bedraagt ten hoogste vijftien, het aantal D'provincies ten hoogste drie.

      2 Onze Minister wijst, in overeenstemming met de besturen van de betrokken gemeenten en provincies, D'gemeenten en
      D'provincies aan, onder vermelding van de voor hun geldende experimentele bepalingen.

      3 De aanwijzingen, bedoeld in het tweede lid, worden gepubliceerd in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0005182/1994-01-01#Artikel2
  - number: '3'
    text: |-
      1 De experimentele bepalingen gelden gedurende twee jaren en zes maanden na de inwerkingtreding van deze wet.

      2 Uiterlijk zes maanden voor het verstrijken van de in het eerste lid genoemde periode zenden de D'gemeenten en de
      D'provincies een rapport aan Onze Minister en aan Onze Minister wie het mede aangaat waarin zij verslag doen van
      hun bevindingen.

      3 Uiterlijk bij het verstrijken van de in het eerste lid genoemde periode dient een regeringsstandpunt openbaar
      gemaakt te worden omtrent de bevindingen bedoeld in het tweede lid.

      4 Indien een regeringsstandpunt inhoudt dat aanpassing van wettelijke voorschriften zal worden bevorderd, besluiten
      Onze Minister en Onze Minister wie het mede aangaat tegelijk met de openbaarmaking van het regeringsstandpunt tot
      verlenging van de in het eerste lid genoemde periode tot de inwerkingtreding van de desbetreffende aanpassing van
      wettelijke voorschriften. Indien de omstandigheden zulks vorderen, kunnen Onze Minister en Onze Minister wie het
      mede aangaat de verlenging op een eerder tijdstip beëindigen.

      5 Een besluit als bedoeld in het vierde lid wordt te zamen met een regeringsstandpunt bedoeld in het derde lid door
      Onze Minister in de *Staatscourant* gepubliceerd.
    url: https://wetten.overheid.nl/BWBR0005182/1994-01-01#Artikel3
  - number: '4'
    text: |-
      De [gemeentewet][ref1] (*Stb.* 1931, 89) wordt als volgt gewijzigd:

      A.

      B. 1. In afwijking van de [artikelen 217][ref2] en [218 van de Gemeentewet][ref3] (*Stb.* 1992, 96) gelden de
      volgende bepalingen voor de krachtens [artikel 2][ref4] aangewezen D'provincies en de daarin gelegen gemeenten,
      niet zijnde D'gemeenten, gedurende de in [artikel 3, eerste lid][ref5], genoemde periode.

      2. Bij ministeriële regeling worden met betrekking tot gemeentelijke belastingen standaardverordeningen vastgesteld
      die in besluiten als bedoeld in [artikel 216 van de Gemeentewet][ref6] van toepassing kunnen worden verklaard, en
      wordt tevens bepaald hetgeen in deze besluiten overigens wordt of kan worden geregeld.

      3. Indien een besluit als bedoeld in [artikel 216 van de Gemeentewet][ref7] is ingericht overeenkomstig de
      ministeriële regeling, bedoeld in het tweede lid, behoeft het de goedkeuring van gedeputeerde staten.

      4. Gedeputeerde staten zenden hun besluit tot goedkeuring dan wel tot onthouding van goedkeuring ter kennisneming
      aan Onze Minister, vergezeld van een afschrift van het desbetreffende raadsbesluit.

      5. Indien de raad geen termijn heeft gesteld waarvoor zijn besluit zal gelden, kunnen gedeputeerde staten bij hun
      besluit een zodanige termijn stellen.

      6. Een beslissing als bedoeld in het vijfde lid wordt niet genomen dan nadat het betrokken gemeentebestuur door
      gedeputeerde staten in de gelegenheid is gesteld daarover overleg te plegen.

      7. [Artikel 263, derde lid, van de Gemeentewet][ref8] is niet van toepassing op de goedkeuring van besluiten als
      bedoeld in het derde lid.

      C. 1. In afwijking van [artikel 218 van de Gemeentewet][ref9] geldt de volgende bepaling voor de krachtens
      [artikel 2][ref10] aangewezen D'gemeenten gedurende de in [artikel 3, eerste lid][ref11], genoemde periode.

      2. Op een besluit als bedoeld in [artikel 216 van de Gemeentewet][ref12] zijn van
      [artikel 218 van de Gemeentewet][ref13] alleen het eerste, het derde en het vierde lid van toepassing.

      D. 1. In afwijking van [artikel 218 van de Gemeentewet][ref14] gelden de volgende bepalingen voor de krachtens
      [artikel 2][ref15] aangewezen D'provincies en de daarin gelegen gemeenten, niet zijnde D'gemeenten, gedurende de in
      [artikel 3, eerste lid][ref16], genoemde periode.

      2. Een besluit als bedoeld in [artikel 216 van de Gemeentewet][ref17] behoeft de goedkeuring van gedeputeerde
      staten. Gedeputeerde staten zenden hun besluit tot goedkeuring dan wel tot onthouding van goedkeuring ter
      kennisneming aan Onze Minister, vergezeld van een afschrift van het desbetreffende raadsbesluit.

      3. Indien de raad geen termijn heeft gesteld waarvoor zijn besluit zal gelden, kunnen gedeputeerde staten bij hun
      beslissing een zodanige termijn bepalen.

      4. Een beslissing als bedoeld in het derde lid wordt niet genomen dan nadat het betrokken gemeentebestuur door
      gedeputeerde staten in de gelegenheid is gesteld daarover overleg te voeren.

      5. [Artikel 263, derde lid, van de Gemeentewet][ref18] is niet van toepassing op de goedkeuring van besluiten als
      bedoeld in het tweede lid.


