preamble:
  text: |-
    Handelende in overeenstemming met de Minister van Verkeer en Waterstaat;

    Na overleg met het Produktschap voor Vis en Visprodukten, het Visserijschap en het Bedrijfschap voor de Groothandel
    in Vis en Aanverwante Bedrijven;

    Gelet op artikel 3, eerste lid, aanhef en onderdeel a, van het Reglement zee- en kustvisserij 1977 (Stb.
    666)1Laatstelijk gewijzigd bij besluit van 19 april 1988 (Stb. 238);

    Besluit:
  url: https://wetten.overheid.nl/BWBR0005006/2004-12-23#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            Verordening:

              [Verordening (EEG) nr. 1381/87](31987R1381) van de Commissie van de Europese Gemeenschap van 20 mei 1987,
      inzake uitvoeringsbepalingen met betrekking tot kentekens voor vissersvaartuigen en met betrekking tot documenten
      aan boord van die vaartuigen (Pb. EG L 132/9):



            Vissersvaartuig:

              vaartuig dat gebruikt wordt voor de bedrijfsmatige uitoefening van de visserij:



             Divisie Scheepvaart:

              divisie Scheepvaart van de Inspectie Verkeer en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0005006/2004-12-23#Artikel1
  - number: '2'
    text: |-
      Het is verboden te vissen met een vissersvaartuig van meer dan 17 meter lengte in andere wateren dan als bedoeld in
      [artikel 1, vierde lid, onderdeel d, van de Visserijwet 1963][ref1], zonder een document als bedoeld in artikel 3,
      tweede lid, van de verordening aan boord te hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel1
    url: https://wetten.overheid.nl/BWBR0005006/2004-12-23#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: '1'
  - number: '3'
    text: |-
      De bevoegde instantie tot waarmerking van de documenten als bedoeld in artikel 3, tweede lid, van de verordening is
      de divisie Scheepvaart.
    url: https://wetten.overheid.nl/BWBR0005006/2004-12-23#Artikel3
  - number: '4'
    text: |-
      1 Deze regeling kan worden aangehaald als: Regeling documenten visruimen en tanks voor gekoeld zeewater.

      2 Zij treedt in werking met ingang van de dag na die van haar bekendmaking in de Staatscourant, met uitzondering
      van [artikel 2][ref1], dat in werking treedt met ingang van 1 juli 1992.


      [ref1]: https://wetten.overheid.nl/BWBR0005006#Artikel2
    url: https://wetten.overheid.nl/BWBR0005006/2004-12-23#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005006
        artikel: '2'
