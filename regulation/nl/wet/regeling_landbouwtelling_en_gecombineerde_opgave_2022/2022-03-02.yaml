  - number: '4'
    text: |-
      1 Een opgaveplichtige verstrekt:

      a. informatie over de toestand van de veestapel zoals die is op 1 april 2022;

      b. informatie over de toestand van de beteelde percelen zoals die is of wordt verwacht op 15 mei 2022; en

      c. de naam van het gewas waarmee een perceel zal worden beteeld, als dat niet is beteeld op 15 mei 2022.

      2 Een opgaveplichtige verstrekt, voor zover van toepassing:

      a. informatie over bedrijfshoofd en werknemers in de periode april 2021 tot en met maart 2022;

      b. informatie over de geteelde gewassen onder glas op 15 mei 2022;

      c. in afwijking van onderdeel b, informatie over bollenbroei in het seizoen 2021/2022;

      d. informatie over het lidmaatschap van een producentenorganisatie op 1 januari 2022;

      e. informatie over emissie van verwarmde kassen in het kalenderjaar 2021;

      f. informatie over beweiding door graasdieren in de kalenderjaren 2021 en 2022;

      g. informatie over mestbehandeling en -verwerking in het kalenderjaar 2021;

      h. informatie over de volgens de biologische productiemethode beteelde percelen zoals die is of wordt verwacht op
      15 mei 2022.

      Voor het overige betreft de informatie de toestand op zijn onderneming op het moment van ondertekening van het
      formulier.
    url: https://wetten.overheid.nl/BWBR0046363/2022-03-02#Artikel4
  - number: '5'
    text: |-
      1 Betalingen uit het Diergezondheidsfonds voor maatregelen en voorzieningen die verband houden met de preventie
      en de bestrijding van besmettelijke dierziekten worden verricht met inachtneming van Deel I en Deel II,
      onderdeel 1.2.1.3, van de staatssteunrichtsnoeren.

      2 Om aanspraak te kunnen maken op betalingen die verband houden met preventie van besmettelijke dierziekten als
      bedoeld in het eerste lid, in de periode die loopt van 15 mei 2022 tot 15 mei 2023, dient door de houder uiterlijk
      op 15 mei 2022 bij de minister een daartoe strekkende opgave te zijn ingediend door middel van het formulier.

      3 De houder kan geen aanspraak maken op betalingen als bedoeld in het eerste lid, indien;

      a. de onderneming die de houder drijft, een onderneming in moeilijkheden is als bedoeld in punt 35, onderdeel 15,
      van de staatssteun richtsnoeren, of

      b. ten aanzien van de onderneming die de houder drijft, een bevel tot terugvordering uitstaat als bedoeld in
      punt 27 van de staatssteunrichtsnoeren.
    url: https://wetten.overheid.nl/BWBR0046363/2022-03-02#Artikel5
  - number: '6'
    text: |-
      Het formulier wordt door de opgaveplichtige, respectievelijk de houder, langs elektronische weg ingevuld,
      ondertekend en ingediend op het internetadres mijn.rvo.nl.
    url: https://wetten.overheid.nl/BWBR0046363/2022-03-02#Artikel6
  - number: '7'
    text: |-
      1 Een opgaveplichtige of de houder kan op de volgende wijzen elektronisch toegang krijgen tot het formulier:

      a. in geval er sprake is van een verplichting tot registratie bij de Kamer van Koophandel op grond van
      [artikel 5 van de Handelsregisterwet 2007][ref1], aan de hand van een eHerkenningsmiddel;

      b. voor natuurlijke personen die niet vallen onder de verplichting tot registratie bij de Kamer van Koophandel op
      grond van [artikel 5 van de Handelsregisterwet 2007][ref2], aan de hand van DigiD, of

      c. aan de hand van een toegangscode die door de minister is verstrekt aan een opgaveplichtige of een houder in
      het buitenland.

      2 De minister verstrekt aan een opgaveplichtige, een houder of de gemachtigde van een opgaveplichtige of aan een
      houder een TAN-code ter ondertekening van het elektronisch formulier. In geval er sprake is van een verplichting
      tot registratie bij de Kamer van Koophandel op grond van [artikel 5 van de Handelsregisterwet 2007][ref3], kan een
      eHerkenningsmiddel ook worden gebruikt voor de ondertekening van het elektronisch formulier.

      3 De minister kan besluiten geen TAN-code te verstrekken of al verstrekte TAN-codes in te trekken indien de
      ondertekenaar, een met de ondertekenaar geassocieerd bedrijf, of een met de ondertekenaar geassocieerde organisatie
      in het verleden een TAN-code heeft gebruikt in strijd met deze regeling of op andere wijze de integriteit van een
      verstrekte handtekening heeft geschonden.


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0021777#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0021777#Artikel5
