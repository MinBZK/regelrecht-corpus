  - number: '3'
    text: |-
      1 Het tijdvak waarin een landbouwtelling als bedoeld in [artikel 25, eerste lid, van de Landbouwwet][ref1] wordt
      gehouden is 1 april 2022 tot en met 15 mei 2022.

      2 Degene aan wie de minister een beschrijvingsbiljet langs schriftelijke of elektronische weg heeft toegezonden
      dient dit uiterlijk op 15 mei 2022 ingevuld en ondertekend bij de minister in.

      3 In afwijking van het tweede lid kan het onderdeel van het beschrijvingsbiljet dat betrekking heeft op de
      gegevens, bedoeld in [artikel 2, tweede lid, aanhef en onderdeel b][ref2], uiterlijk op 1 juli 2022 ingevuld en
      ondertekend bij de minister worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0002252#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0046363#Artikel2
