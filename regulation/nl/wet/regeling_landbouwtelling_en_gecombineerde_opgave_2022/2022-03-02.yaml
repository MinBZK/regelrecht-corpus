    text: |-
      1 Het formulier is een beschrijvingsbiljet als bedoeld in [artikel 24, eerste lid, van de Landbouwwet][ref1].

      2 Een landbouwer verstrekt door middel van het formulier gegevens en statistische informatie als bedoeld in:

      a. [artikel 26, eerste lid, van het Uitvoeringsbesluit Meststoffenwet][ref2];

      b. [artikel 3 van de Regeling kostenverevening reductie C0][ref3];

      c. [artikel 15, eerste lid, van de Plantgezondheidswet][ref4];

      3 Ter uitvoering van de artikelen 28 en 36, eerste lid, onderdeel a, van Verordening (EU) nr. 1305/2013, artikel 72
      van Verordening (EU) nr. 1306/2013 en de artikelen 12, 24, 30, 32 en 33 van Verordening (EU) nr. 1307/2013 dient
      het formulier voor:

      a. het doen van de aanvragen, bedoeld in de [artikelen 4.2, eerste lid][ref5], en
      [4.4, eerste lid, van de Uitvoeringsregeling rechtstreekse betalingen GLB][ref6];

      b. het doen van de aanvraag, bedoeld in
      [artikel 4.1.2, tweede lid, van de Regeling Europese EZK- en LNV-subsidies][ref7].

      4 Ter uitvoering van artikel 4, eerste en derde lid, van Verordening (EU) nr. 2017/625, artikel 39, eerste lid,
      van Verordening (EU) nr. 2018/848 en [artikel 15 van het Landbouwkwaliteitsbesluit 2007][ref8] dient het formulier
      voor het meedelen van het per perceel gespecificeerde productieschema voor biologische plantaardige producten ten
      behoeve van de Stichting Skal.


