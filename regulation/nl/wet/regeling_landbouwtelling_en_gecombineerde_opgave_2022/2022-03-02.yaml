  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *besmettelijke dierziekten:* op grond van [artikel 5.3, tweede lid, van de Wet dieren][ref1]
      aangewezen besmettelijke dierziekten en zoönosen als bedoeld in de [artikelen 2.1][ref2] en
      [2.2 van de Regeling diergezondheid][ref3];
        - *Diergezondheidsfonds:* fonds als bedoeld in [artikel 9.2 van de Wet dieren][ref4];
        - *formulier:* formulier als bedoeld in de bijlage bij deze regeling;
        - *houder:* houder als bedoeld in [artikel 1.1, eerste lid, van de Wet dieren][ref5];
        - *minister:* Minister van Landbouw, Natuur en Voedselkwaliteit;
        - *opgaveplichtige:* degene aan wie de minister het formulier langs schriftelijke of elektronische weg heeft
      toegezonden;
        - *staatssteunrichtsnoeren:* richtsnoeren van de Europese Unie voor staatssteun in de landbouw- en de bosbouwsector
      en in plattelandsgebieden 2014–2020 (PbEU 2014, C 204);
        - *Verordening (EU) nr. 1305/2013:* [Verordening (EU) nr. 1305/2013](32013R1305) van het Europees Parlement
      en de Raad van 17 december 2013 inzake steun voor plattelandsontwikkeling uit het Europees Landbouwfonds voor
      plattelandsontwikkeling (ELFPO) en tot intrekking van Verordening (EG) nr. 1698/2005 van de Raad (PbEU 2013,
      L 347);
        - *Verordening (EU) nr. 1306/2013:* [Verordening (EU) nr. 1306/2013](32013R1306) van het Europees Parlement
      en de Raad van 17 december 2013 inzake de financiering, het beheer en de monitoring van het gemeenschappelijk
      landbouwbeleid en tot intrekking van Verordeningen (EEG) nr. 352/78, (EG) nr. 165/94 (EG), nr. 2799/98, (EG)
      nr. 814/2000, (EG) nr. 1290/2005 en (EG) nr. 485/2008 van de Raad (PbEU 2013 L 347);
        - *Verordening (EU) nr. 1307/2013:* [Verordening (EU) nr. 1307/2013](32013R1307) van het Europees Parlement en
      de Raad van 17 december 2013 tot vaststelling van voorschriften voor rechtstreekse betalingen aan landbouwers in
      het kader van de steunregelingen van het gemeenschappelijk landbouwbeleid en tot intrekking van Verordening (EG)
      nr. 637/2008 van de Raad en Verordening (EG) nr. 73/2009 van de Raad (PbEU 2013, L 347);
        - *Verordening (EU) 2017/625:* [Verordening (EU) nr. 2017/625](32525R2017) van het Europees Parlement en de
      Raad van 15 maart 2017 betreffende officiële controles en andere officiële activiteiten die worden uitgevoerd
      om de toepassing van de levensmiddelen- en diervoederwetgeving en van de voorschriften inzake diergezondheid,
      dierenwelzijn, plantgezondheid en gewasbeschermingsmiddelen te waarborgen, tot wijziging van de Verordeningen (EG)
      nr. 999/2001, (EG) nr. 396/2005, (EG) nr. 1069/2009, (EG) nr. 1107/2009, (EU) nr. 1151/2012, (EU) nr. 652/2014,
      (EU) 2016/429 en (EU) 2016/2031 van het Europees Parlement en de Raad, de Verordeningen (EG) nr. 1/2005 en
      (EG) nr. 1099/2009 van de Raad en de [Richtlijnen 98/58/EG](31998L0058), [1999/74/EG](31999L0074), [2007/43/
      EG](32007L0043), [2008/119/EG](32008L0119) en [2008/120/EG](32008L0120) van de Raad, en tot intrekking van de
      Verordeningen (EG) nr. [854/2004](32754L2004) en (EG) nr. [882/2004](32782L2004) van het Europees Parlement en
      de Raad, de Richtlijnen [89/608/EEG](31989L0608), [89/662/EEG](31989L0662), [90/425/EEG](31990L0425), [91/496/
      EEG](31991L0496), [96/23/EG](31996L0023), [96/93/EG](31996L0093) en [97/78/EG](31997L0078) van de Raad en Besluit
      [92/438/EEG](31992L0438) van de Raad (verordening officiële controles) (Voor de EER relevante tekst)Voor de EER
      relevante tekst (PbEU 2017, L95);
        - *Verordening (EU) nr. 2018/848:* [Verordening (EU) nr. 2018/848](32748R2018) van het Europees Parlement en de
      Raad van 30 mei 2018 inzake de biologische productie en de etikettering van biologische producten en tot intrekking
      van Verordening (EG) nr. 834/2007 van de Raad (PbEU 2018, L 150).


