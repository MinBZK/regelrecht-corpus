regulatory_layer: WET
publication_date: '2020-12-03'
valid_from: '1991-08-01'
bwb_id: BWBR0005077
url: https://wetten.overheid.nl/BWBR0005077/1991-08-01
preamble:
  text: |-
    Gelet op artikel 11, lid 2 van het Uitvoeringsbesluit verontreiniging rijkswateren;

    Gezien het verzoek van Burgemeester en Wethouders van de Gemeente Hasselt d.d. 28 november 1990, betreffende het
    jaar 1991;

    Overwegende, dat het hiervoor vermelde openbaar lichaam met behulp van een werk, afvalstoffen, verontreinigende of
    schadelijke stoffen in rijkswateren brengt, zonder voorafgaande zuivering zijnerzijds;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0005077/1991-08-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Degenen die afvalstoffen, verontreinigende of schadelijke stoffen afkomstig van bedrijfsruimten lozen op een werk
      van het hiervoor genoemde openbaar lichaam worden aan de [verontreinigingsheffing rijkswateren][ref1] onderworpen,
      zolang en voorzover dit openbaar lichaam deze stoffen zonder voorafgaande zuivering zijnerzijds in rijkswateren
      brengt.


      [ref1]: https://wetten.overheid.nl/BWBR0002791
    url: https://wetten.overheid.nl/BWBR0005077/1991-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002791
  - number: '2'
    text: Deze beschikking zal worden geplaatst in de Nederlandse Staatscourant.
    url: https://wetten.overheid.nl/BWBR0005077/1991-08-01#Artikel2
