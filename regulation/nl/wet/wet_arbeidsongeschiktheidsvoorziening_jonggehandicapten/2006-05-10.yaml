        artikel: '3'
      - id: ref10
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '19.3'
    text: 'Dit artikel vindt geen toepassing:'
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel19
  - number: 19.3.a
    text: |-
      indien op grond van [artikel 20][ref1] aanspraak bestaat op heropening van de arbeidsongeschiktheidsuitkering; of


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel20
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '20'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '1'
  - number: 19.3.b
    text: |-
      indien [artikel 29b van de Ziektewet][ref1] toepassing kan vinden, tenzij de toe te kennen
      arbeidsongeschiktheidsuitkering het ziekengeld overtreft.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel29b
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: 29b
  - number: '19.4'
    text: |-
      [Artikel 6b][ref1] en de daarop berustende bepalingen zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel6b
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: 6b
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '1'
  - number: '20.1'
    text: |-
      De jonggehandicapte, wiens arbeidsongeschiktheidsuitkering, berekend naar een arbeidsongeschiktheid van ten minste
      45%, in verband met artikel 17, eerste lid, onderdeel *b*, is ingetrokken, heeft, indien hij binnen vier weken na
      de dag, met ingang waarvan de uitkering is ingetrokken, weer arbeidsongeschikt wordt, aanspraak op heropening van
      de arbeidsongeschiktheidsuitkering.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel20
  - number: '20.2'
    text: |-
      Het eerste lid is mede van toepassing ten aanzien van de jonggehandicapte, wiens arbeidsongeschiktheidsuitkering,
      berekend naar een arbeidsongeschiktheid van minder dan 45% in verband met artikel 17, eerste lid, onderdeel
      *b*, is ingetrokken, indien hij weer arbeidsongeschikt wordt binnen vier weken na de dag, met ingang waarvan die
      uitkering, die voordien was berekend naar een arbeidsongeschiktheid van ten minste 45%, wegens afneming van de
      arbeidsongeschiktheid is herzien naar een arbeidsongeschiktheid van minder dan 45%.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel20
  - number: '20.3'
    text: |-
      De jonggehandicapte, wiens arbeidsongeschiktheidsuitkering, berekend naar een arbeidsongeschiktheid van minder dan
      45%, in verband met artikel 17, eerste lid, onderdeel *b*, is ingetrokken met ingang van een dag, gelegen binnen
      vier weken na de dag, met ingang waarvan die uitkering werd toegekend of wegens toegenomen arbeidsongeschiktheid
      werd herzien, heeft, indien hij binnen die vier weken weer arbeidsongeschikt wordt, aanspraak op heropening van de
      arbeidsongeschiktheidsuitkering. Artikel 14, tweede lid, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel20
  - number: '20.4'
    text: |-
      De jonggehandicapte, wiens arbeidsongeschiktheidsuitkering, berekend naar een arbeidsongeschiktheid van minder
      dan 45%, in verband met artikel 17, eerste lid, onderdeel *b*, is ingetrokken, heeft, onverminderd het tweede
      en het derde lid, indien hij binnen vier weken na de dag, met ingang waarvan de uitkering is ingetrokken,
      weer arbeidsongeschikt wordt, niet kennelijk uit een andere oorzaak dan die, waaruit de arbeidsongeschiktheid,
      ter zake waarvan de ingetrokken uitkering werd genoten, is voortgekomen, aanspraak op heropening van de
      arbeidsongeschiktheidsuitkering.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel20
  - number: '20.5'
    text: De heropening vindt plaats naar de mate van arbeidsongeschiktheid op de dag, waarop de heropening ingaat.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel20
  - number: '20.6'
    text: |-
      Voor de toepassing van het eerste tot en met vijfde lid wordt niet als arbeidsongeschikt beschouwd degene die
      minder dan 25% arbeidsongeschikt is.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel20
  - number: '20.7'
    text: Artikel 6b en de daarop berustende bepalingen zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel20
  - number: 20a.1
    text: |-
      De jonggehandicapte, wiens arbeidsongeschiktheidsuitkering in verband met [artikel 17, vijfde lid][ref1], is
      geëindigd, heeft vanaf de dag dat hij in vrijheid wordt gesteld met inachtneming van de bepalingen van deze
      wet recht op heropening van de arbeidsongeschiktheidsuitkering, indien hij op die dag arbeidsongeschikt is.
      [Artikel 6, vijfde lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0008657#Artikel6
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0008657
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '1'
  - number: 20a.2
    text: |-
      Aanspraak op heropening van de arbeidsongeschiktheidsuitkering heeft eveneens de jonggehandicapte, bedoeld in het
      eerste lid, die op de in dat lid bedoelde dag niet arbeidsongeschikt is, doch ten aanzien van wie dit wel het geval
      is binnen vier weken na afloop van dat tijdvak.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel20a
  - number: 20a.3
    text: |-
      De [artikelen 6, vijfde lid][ref1], [29][ref2] en [30][ref3] zijn van overeenkomstige toepassing met betrekking tot
      de aanspraak op heropening van de arbeidsongeschiktheidsuitkering, bedoeld in dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0008657#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0008657#Artikel30
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0008657
        artikel: '29'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0008657
        artikel: '30'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
  - number: 20a.4
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op bij algemene maatregel van bestuur aan te wijzen
      categorieën personen waarbij tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende maatregel buiten een
      justitiële inrichting plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel20a
  - number: '21'
    text: |-
      De jonggehandicapte die over een maand recht heeft op arbeidsongeschiktheidsuitkering, heeft over die maand recht
      op vakantie-uitkering.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel21
  - number: '22.1'
    text: |-
      De vakantie-uitkering bedraagt acht procent van het bedrag aan arbeidsongeschiktheidsuitkering, waarop recht
      bestond in het tijdvak van twaalf maanden, voorafgaande aan de maand mei.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel22
  - number: '22.2'
    text: |-
      Indien [artikel 50][ref1], [51][ref2] of [51a][ref3] is toegepast, wordt onder het bedrag
      aan arbeidsongeschiktheidsuitkering, bedoeld in het eerste lid, verstaan het bedrag van de
      arbeidsongeschiktheidsuitkering, nadat dat artikel toepassing heeft gevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0008657#Artikel51
      [ref3]: https://wetten.overheid.nl/BWBR0008657#Artikel51a
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '50'
        hoofdstuk: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0008657
        artikel: '51'
        hoofdstuk: '2'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0008657
        artikel: 51a
        hoofdstuk: '2'
        afdeling: '3'
  - number: '22.3'
    text: |-
      Indien het percentage van de vakantiebijslag, bedoeld in
      [artikel 15, eerste lid, van de Wet minimumloon en minimumvakantiebijslag][ref1], wordt gewijzigd, treedt dit
      gewijzigde percentage in de plaats van het in het eerste lid genoemde percentage. Het gewijzigde percentage wordt
      in aanmerking genomen over de uitkering waarop recht bestaat over het tijdvak aanvangende met de dag waarop de
      wijziging ingaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel15
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '15'
  - number: '22.4'
    text: |-
      Op de ambtshalve toekenning van een vakantie-uitkering zijn de [artikelen 3:41][ref1] en
      [3:45 van de Algemene wet bestuursrecht][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '23'
    text: |-
      De artikelen 21 en 22, eerste tot en met derde lid, zijn van overeenkomstige toepassing op de overlijdensuitkering,
      bedoeld in artikel 53.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel23
  - number: '27.1'
    text: |-
      Ten einde een recht op arbeidsongeschiktheidsuitkering geldend te kunnen maken meldt de jonggehandicapte
      zijn arbeidsongeschiktheid binnen dertien weken na de dag waarop hij 17 jaar is geworden dan wel binnen
      dertien weken na de in [artikel 5, eerste lid, onderdeel b][ref1], bedoelde dag aan het Uitvoeringsinstituut
      werknemersverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel5
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '5'
        hoofdstuk: '1'
  - number: '27.2'
    text: |-
      Voor het bepalen van het tijdvak van dertien weken, bedoeld in het eerste lid, worden perioden van
      arbeidsongeschiktheid samengeteld, indien zij elkaar met een onderbreking van minder dan vier weken
      opvolgen of indien zij direct voorafgaan aan en aansluiten op een periode waarin uitkering in verband met
      zwangerschap of bevalling op grond van [artikel 3:7, eerste lid][ref1], [3:8][ref2], [3:10, eerste lid][ref3],
      [3:18][ref4] of [3:30, eerste lid, van de Wet arbeid en zorg][ref5] wordt genoten, tenzij de ongeschiktheid
      redelijkerwijs niet geacht kan worden voort te vloeien uit dezelfde oorzaak. Bij de vaststelling van het
      tijdvak van dertien weken blijven perioden, waarin uitkering in verband met zwangerschap of bevalling
      op grond van [artikel 3:7, eerste lid][ref6], [3:8][ref7], [3:10, eerste lid][ref8], [3:18][ref9]
      of [3:30, eerste lid, van de Wet arbeid en zorg][ref10] wordt genoten, buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref6]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref7]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref8]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref9]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref10]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref2
