        artikel: '3'
      - id: ref5
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref6
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref7
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref8
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref9
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref10
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '12.5'
    text: |-
      Perioden van wonen buiten Nederland waarin de arbeidsongeschiktheid is toegenomen worden mede in aanmerking genomen
      voor het bepalen van het tijdvak van 52 weken, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel12
  - number: '13.1'
    text: |-
      Ter zake van toeneming van de arbeidsongeschiktheid vindt herziening van een arbeidsongeschiktheidsuitkering,
      berekend naar een arbeidsongeschiktheid van ten minste 45%, onverminderd artikel 14, plaats zodra de toegenomen
      arbeidsongeschiktheid onafgebroken vier weken heeft geduurd.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel13
  - number: '13.2'
    text: |-
      Indien de arbeidsongeschiktheidsuitkering, berekend naar een arbeidsongeschiktheid van ten minste 45%, doch minder
      dan 80%, wegens afneming van de arbeidsongeschiktheid is herzien naar een arbeidsongeschiktheid van minder dan
      45%, doch binnen vier weken na de dag, met ingang waarvan die uitkering is herzien, de arbeidsongeschiktheid weer
      toeneemt, is het eerste lid van toepassing, onder afwijking van artikel 12.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel13
  - number: '13.3'
    text: |-
      Voor het bepalen van het tijdvak van vier weken, bedoeld in het eerste en tweede lid, worden perioden van
      toegenomen arbeidsongeschiktheid samengeteld, indien zij elkaar met een onderbreking van minder dan vier weken
      opvolgen of indien zij direct voorafgaan aan en aansluiten op een periode waarin uitkering in verband met
      zwangerschap of bevalling op grond van [artikel 3:7, eerste lid][ref1], [3:8][ref2], [3:10, eerste lid][ref3],
      [3:18][ref4] of [3:30, eerste lid, van de Wet arbeid en zorg][ref5] wordt genoten, tenzij de ongeschiktheid
      redelijkerwijs niet geacht kan worden voort te vloeien uit dezelfde oorzaak. Bij de vaststelling van de
      eerstgenoemde periode van vier weken blijven perioden, waarin uitkering in verband met zwangerschap of
      bevalling op grond van [artikel 3:7, eerste lid][ref6], [3:8][ref7], [3:10, eerste lid][ref8], [3:18][ref9]
      of [3:30, eerste lid, van de Wet arbeid en zorg][ref10] wordt genoten, buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0013008#Artikel3
