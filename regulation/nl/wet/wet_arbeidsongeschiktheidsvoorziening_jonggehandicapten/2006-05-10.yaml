  - number: 76c.1
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen verstrekt tot en met
      het jaar 2008 jaarlijks ten laste van het Reïntegratiefonds, genoemd in
      [artikel 2.8 van de Wet Invoering en financiering Wet werk en inkomen naar arbeidsvermogen][ref1], aan door Onze
      Minister aan te wijzen scholingsinstituten die ten doel hebben de arbeidsintegratie van arbeidsgehandicapten te
      bevorderen, een subsidie ter hoogte van een bij ministeriële regeling te bepalen bedrag waarbij regels kunnen
      worden gesteld omtrent de wijze van berekening van dat bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0019058#Artikel2
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel76c
    references:
      - id: ref1
        bwb_id: BWBR0019058
        artikel: '2'
  - number: 76c.2
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan bij de subsidieverlening, bedoeld in het eerste lid, aan
      de subsidie-ontvanger verplichtingen opleggen omtrent vermogensvorming, het hanteren van een registratiesysteem
      waaruit blijkt of het doel van de subsidie is bereikt en de vergoeding van met subsidie behaald vermogensvoordeel.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel76c
  - number: '77'
    text: |-
      De [Algemene termijnenwet][ref1] is niet van toepassing op de tijdvakken van vier weken, genoemd in de artikelen 6,
      tweede en derde lid, 12, derde lid, 13, 14, eerste lid, 15, 19 en 20.


      [ref1]: https://wetten.overheid.nl/BWBR0002448
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0002448
  - number: '78'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel78
  - number: '79'
    text: 'Deze wet wordt aangehaald als: Wet arbeidsongeschiktheidsvoorziening jonggehandicapten.'
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel79
