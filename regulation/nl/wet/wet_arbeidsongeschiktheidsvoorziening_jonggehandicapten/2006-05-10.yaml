  - number: '28.1'
    text: De arbeidsongeschiktheidsuitkering wordt op aanvraag toegekend.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel28
  - number: '28.2'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen stelt de jonggehandicapte schriftelijk in kennis
      van de mogelijkheid van het doen van een aanvraag uiterlijk vier maanden voor de datum waarop het in
      [artikel 6, eerste lid][ref1], genoemde tijdvak van 52 weken eindigt.


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel6
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '1'
  - number: '28.3'
    text: |-
      Het tweede lid is niet van toepassing, indien de jonggehandicapte de melding, bedoeld in
      [artikel 27, eerste lid][ref1], niet of niet tijdig heeft gedaan. Indien de jonggehandicapte deze melding
      niet tijdig heeft gedaan, geldt de in het tweede lid bedoelde verplichting voor het Uitvoeringsinstituut
      werknemersverzekeringen uiterlijk drie maanden nadat de jonggehandicapte de melding heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel27
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '27'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '2'
  - number: '28.4'
    text: |-
      De jonggehandicapte die in aanmerking wenst te komen voor toekenning van de uitkering, doet zijn aanvraag binnen
      negen maanden na aanvang van zijn arbeidsongeschiktheid.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel28
  - number: '28.5'
    text: |-
      Onverminderd hetgeen in deze wet terzake van herziening of intrekking van de arbeidsongeschiktheidsuitkering
      is bepaald wordt ten aanzien van personen die na 1 juli 1954 zijn geboren, op een bij of krachtens algemene
      maatregel van bestuur bepaald tijdstip door het Uitvoeringsinstituut werknemersverzekeringen bezien of er in
      verband met wijziging van de mate van arbeidsongeschiktheid gronden zijn voor herziening of intrekking van de
      arbeidsongeschiktheidsuitkering. Het tijdstip kan voor verschillende groepen van personen verschillend worden
      vastgesteld. Bij algemene maatregel van bestuur kan worden bepaald dat de eerste zin niet van toepassing is op
      bepaalde groepen van personen.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel28
  - number: '28.6'
    text: |-
      Een aanvraag is tijdig ingediend, indien het Uitvoeringsinstituut werknemersverzekeringen de kennisgeving, bedoeld
      in het tweede lid, niet heeft gedaan dan wel indien bij een latere kennisgeving dan bedoeld in het tweede lid de
      aanvraag wordt ingediend binnen vier weken nadat deze kennisgeving is ontvangen.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel28
  - number: '28.7'
    text: |-
      Indien de toepassing van het vierde lid zou leiden tot kennelijke hardheid, is het Uitvoeringsinstituut
      werknemersverzekeringen bevoegd de uitkering ambtshalve toe te kennen.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel28
  - number: '29.1'
    text: |-
      De arbeidsongeschiktheidsuitkering gaat in op de dag, met ingang waarvan de jonggehandicapte aan de vereisten voor
      het recht op toekenning van die uitkering voldoet.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel29
  - number: '29.2'
    text: |-
      In afwijking van het eerste lid kan de uitkering niet vroeger ingaan dan een jaar voor de dag, waarop
      de aanvraag om toekenning dan wel voortzetting van de uitkering werd ingediend. Het Uitvoeringsinstituut
      werknemersverzekeringen kan voor bijzondere gevallen van de eerste zin afwijken.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel29
  - number: '29.3'
    text: |-
      Toekenning van arbeidsongeschiktheidsuitkering vindt niet plaats, indien deze zou ingaan op of na de in artikel 17,
      eerste lid, onderdeel *a*, bedoelde dag.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel29
  - number: '30'
    text: |-
      Herziening, heropening dan wel herleving van de arbeidsongeschiktheidsuitkering vindt op aanvraag of ambtshalve
      plaats.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel30
  - number: '31.1'
    text: |-
      De herziening van de arbeidsongeschiktheidsuitkering gaat in op de dag, waarop de jonggehandicapte op grond van
      deze wet voor een hogere of lagere uitkering in aanmerking komt.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel31
  - number: '31.2'
    text: |-
      Met betrekking tot de herziening van de arbeidsongeschiktheidsuitkering, die een verhoging van die uitkering tot
      gevolg heeft, alsmede met betrekking tot de heropening of herleving van de uitkering is artikel 29, tweede lid, van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel31
  - number: '31.3'
    text: |-
      De herziening van een arbeidsongeschiktheidsuitkering ter zake van afneming van de arbeidsongeschiktheid gaat in op
      de dag, aangegeven in de daartoe strekkende beschikking van het Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel31
  - number: '31.4'
    text: |-
      Indien de herziening van de arbeidsongeschiktheidsuitkering verband houdt met een voltooide scholing of
      opleiding, gaat deze herziening niet eerder in dan een jaar na voltooiing van die scholing of opleiding. Indien de
      jonggehandicapte eerder inkomsten uit arbeid verwerft, is artikel 50, eerste lid, tot uiterlijk het einde van dat
      jaar van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel31
  - number: '31.5'
    text: |-
      De herleving van de uitkering, bedoeld in artikel 18, gaat in op de eerste dag van de maand volgend op die waarin
      hij weer in Nederland is gaan wonen.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel31
  - number: '31.6'
    text: |-
      De heropening van de uitkering, bedoeld in artikel 20, gaat in op de dag, met ingang waarvan de jonggehandicapte
      weer arbeidsongeschikt is geworden.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel31
  - number: '31.7'
    text: |-
      Heropening of herleving van de arbeidsongeschiktheidsuitkering vindt niet plaats, indien deze zou ingaan op of na
      de in artikel 17, eerste lid, onderdeel *a*, bedoelde dag.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel31
  - number: '32'
    text: |-
      De vakantie-uitkering wordt ambtshalve of, ingeval artikel 52, eerste lid, tweede zin, toepassing vindt, op
      aanvraag door het Uitvoeringsinstituut werknemersverzekeringen toegekend.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel32
  - number: '33.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan, telkens wanneer het dat nodig oordeelt, oproepen of doen
      oproepen en op een door of namens hem te bepalen plaats ondervragen of doen ondervragen:
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel33
  - number: 33.1.a
    text: |-
      de jonggehandicapte, die de wachttijd van 52 weken, bedoeld in [artikel 6, eerste lid][ref1], doormaakt;


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel6
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '1'
  - number: 33.1.b
    text: de jonggehandicapte, die aanspraak maakt op of recht heeft op een arbeidsongeschiktheidsuitkering;
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel33
  - number: 33.1.c
    text: |-
      de jonggehandicapte ten aanzien van wie of ten behoeve van wie een reïntegratie-instrument als bedoeld in
      [artikel 59a][ref1] of [59b][ref2] is toegekend of waarvan toekenning wordt overwogen;


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel59a
      [ref2]: https://wetten.overheid.nl/BWBR0008657#Artikel59b
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: 59a
        hoofdstuk: 2A
      - id: ref2
        bwb_id: BWBR0008657
        artikel: 59b
        hoofdstuk: 2A
  - number: 33.1.d
    text: |-
      de ingezetene die de leeftijd van 17 jaar nog niet heeft bereikt en ten aanzien van wie of ten behoeve van wie een
      reïntegratie-instrument als bedoeld in [artikel 59a][ref1] of [59b][ref2] is toegekend of waarvan toekenning wordt
      overwogen.


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel59a
      [ref2]: https://wetten.overheid.nl/BWBR0008657#Artikel59b
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: 59a
        hoofdstuk: 2A
      - id: ref2
        bwb_id: BWBR0008657
        artikel: 59b
        hoofdstuk: 2A
  - number: '33.2'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan de in het eerste lid bedoelde personen op een door of namens
      hem te bepalen plaats door een of meer daartoe door hem aangewezen deskundigen doen onderzoeken.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel33
  - number: '33.3'
    text: |-
      De daartoe door het Uitvoeringsinstituut werknemersverzekeringen aangewezen deskundige kan, ook zonder opdracht
      van het Uitvoeringsinstituut werknemersverzekeringen, de in het eerste lid bedoelde personen oproepen, ondervragen,
      onderzoeken, doen oproepen, doen ondervragen en doen onderzoeken door een of meer door hem daartoe aangewezen
      deskundigen.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel33
  - number: '34'
    text: |-
      Opgeroepenen en, indien hun toestand geleide nodig maakt, mede hun geleiders, worden reiskosten, verblijfkosten
      en tijdverlies vergoed in de gevallen en volgens regels die door het Uitvoeringsinstituut werknemersverzekeringen
      worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel34
  - number: '35.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen en de door hem daartoe aangewezen deskundige kunnen de personen,
      bedoeld in [artikel 33, eerste lid][ref1], voorschriften geven in het belang van een behandeling of van genezing of
      tot behoud, herstel en bevordering van de mogelijkheid tot het verrichten van arbeid.


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel33
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '33'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
  - number: '35.2'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan voorschrijven dat personen, bedoeld in
      [artikel 33, eerste lid][ref1], zich laten registreren als werkzoekende bij de Centrale organisatie werk en
      inkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel33
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '33'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
  - number: '36'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan controlevoorschriften vaststellen. Deze voorschriften mogen
      niet verder gaan dan strikt noodzakelijk is voor een juiste uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel36
  - number: '37.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen weigert de uitkering tijdelijk of blijvend, geheel of
      gedeeltelijk, indien een persoon als bedoeld in artikel 33, eerste lid, na tijdig te zijn opgeroepen niet is
      verschenen of heeft geweigerd:
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel37
  - number: 37.1.a
    text: |-
      vragen te beantwoorden die zijn gesteld door het Uitvoeringsinstituut werknemersverzekeringen of de door hem
      daartoe aangewezen deskundige;
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel37
  - number: 37.1.b
    text: |-
      zich te laten onderzoeken door de door het Uitvoeringsinstituut werknemersverzekeringen daartoe aangewezen
      deskundige; of
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel37
  - number: 37.1.c
    text: |-
      te voldoen aan het voorschrift, gegeven door het Uitvoeringsinstituut werknemersverzekeringen of de door
      hem daartoe aangewezen deskundige, om zich ter observatie te doen opnemen of te verblijven in een aangewezen
      inrichting.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel37
  - number: '37.2'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen handelt overeenkomstig het eerste lid bij toeneming van
      de arbeidsongeschiktheid, voor zover deze toeneming kennelijk is voortgekomen uit dezelfde oorzaak als de
      arbeidsongeschiktheid, ter zake waarvan het niet voldoen aan de oproeping of de weigering plaatsvond.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel37
  - number: '38'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen handelt overeenkomstig [artikel 37][ref1], indien de
      jonggehandicapte:


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel37
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '37'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
  - number: 38.a
    text: |-
      de door het Uitvoeringsinstituut werknemersverzekeringen of de door hem daartoe aangewezen deskundige krachtens
      [artikel 35][ref1] in het belang van een behandeling of genezing of tot behoud, herstel of bevordering van de
      mogelijkheid tot het verrichten van arbeid en tot registratie als werkzoekende bij de Centrale organisatie werk en
      inkomen gegeven voorschriften zonder deugdelijke grond niet opvolgt;


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel35
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '35'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
  - number: 38.b
    text: |-
      zich niet, zolang als het Uitvoeringsinstituut werknemersverzekeringen of de door hem daartoe aangewezen deskundige
      te kennen heeft gegeven dit noodzakelijk te achten, onder geneeskundige behandeling stelt of indien hij de
      voorschriften van de behandelende arts niet opvolgt;
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel38
  - number: 38.c
    text: |-
      zich schuldig maakt aan gedragingen, waardoor zijn genezing wordt belemmerd of nalaat voldoende mee te werken om
      aanpassing aan zijn ziekte of gebrek te verkrijgen;
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel38
  - number: 38.d
    text: |-
      de controlevoorschriften, bedoeld in [artikel 36][ref1], of de verplichting, bedoeld in
      [artikel 55, tweede lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2], niet of niet
      behoorlijk is nagekomen dan wel de verplichting, bedoeld in [artikel 62][ref3], niet binnen de door het
      Uitvoeringsinstituut werknemersverzekeringen daarvoor vastgestelde termijn is nagekomen;


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel55
      [ref3]: https://wetten.overheid.nl/BWBR0008657#Artikel62
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '36'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '55'
      - id: ref3
        bwb_id: BWBR0008657
        artikel: '62'
        hoofdstuk: '4'
  - number: 38.e
    text: zijn arbeidsongeschiktheid opzettelijk heeft veroorzaakt;
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel38
  - number: 38.f
    text: |-
      zich niet houdt aan het voorschrift, bedoeld in [artikel 28, vierde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel28
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '28'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
  - number: 38.g
    text: |-
      zonder redelijke gronden niet meewerkt aan een scholing of opleiding die wenselijk wordt geacht voor zijn
      inschakeling in de arbeid;
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel38
  - number: 38.h
    text: |-
      indien de belanghebbende zonder redelijke gronden niet meewerkt aan het opstellen van de reïntegratievisie,
      bedoeld in [artikel 30a, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1] of het
      reïntegratieplan, bedoeld in [artikel 30a, derde lid, van die wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel30a
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '30'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: 30a
  - number: 38.i
    text: |-
      indien de belanghebbende de verplichtingen die zijn opgenomen in de reïntegratievisie bedoeld in
      [artikel 30a, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1] of in het
      reïntegratieplan, bedoeld in [artikel 30a, derde lid, van die wet][ref2] niet of niet behoorlijk is nagekomen;


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30a
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel30a
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 30a
      - id: ref2
        bwb_id: BWBR0013060
        artikel: 30a
  - number: 38.j
    text: |-
      indien de belanghebbende die bij deelname aan een reïntegratietraject zijn reïntegratieverplichtingen niet naleeft,
      de reden daarvan niet onmiddellijk aan het reïntegratiebedrijf heeft medegedeeld.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel38
  - number: '39.1'
    text: |-
      Een maatregel als bedoeld in [artikel 37][ref1] of [38][ref2] wordt afgestemd op de ernst van de gedraging en de
      mate waarin de jonggehandicapte de gedraging kan worden verweten. Van het opleggen van een maatregel wordt in elk
      geval afgezien, indien elke vorm van verwijtbaarheid ontbreekt.


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0008657#Artikel38
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '37'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0008657
        artikel: '38'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
  - number: '39.2'
    text: |-
      Indien het niet tijdig nakomen van de verplichting, bedoeld in [artikel 62][ref1], niet heeft geleid tot het
      ten onrechte of tot een te hoog bedrag verlenen van een uitkering als genoemd in dat artikel, of indien de
      jonggehandicapte zich niet houdt aan de voorschriften, bedoeld in [artikel 28, vierde lid][ref2], kan het
      Uitvoeringsinstituut werknemersverzekeringen afzien van het opleggen van een maatregel en volstaan met het geven
      van een schriftelijke waarschuwing ter zake van het niet tijdig nakomen van de verplichting, of het zich niet
      houden aan de voorschriften, tenzij het niet tijdig nakomen van de verplichting, of het zich niet houden aan
      de voorschriften, plaatsvindt binnen een periode van twee jaar te rekenen vanaf de datum waarop eerder aan de
      jonggehandicapte een zodanige waarschuwing is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0008657#Artikel28
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '62'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0008657
        artikel: '28'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
  - number: '39.3'
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kan het Uitvoeringsinstituut werknemersverzekeringen besluiten van
      het opleggen van een maatregel af te zien.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel39
  - number: '39.4'
    text: |-
      Het opleggen van een maatregel blijft achterwege, indien voor dezelfde gedraging een boete als bedoeld in
      [artikel 40][ref1] wordt opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel40
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '40'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
  - number: '39.5'
    text: Het Uitvoeringsinstituut werknemersverzekeringen stelt nadere regels met betrekking tot het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel39
  - number: '40.1'
    text: |-
      Indien de jonggehandicapte of zijn wettelijke vertegenwoordiger of de werkgever de verplichting, bedoeld in
      [artikel 62][ref1], niet of niet behoorlijk is nagekomen, legt het Uitvoeringsinstituut werknemersverzekeringen hem
      een boete op van ten hoogste € 2 269.


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel62
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '62'
        hoofdstuk: '4'
  - number: '40.2'
    text: |-
      De hoogte van de boete wordt afgestemd op de ernst van de gedraging, de mate waarin de jonggehandicapte of zijn
      wettelijke vertegenwoordiger de gedraging verweten kan worden en de omstandigheden waarin hij verkeert. Van het
      opleggen van een boete wordt in elk geval afgezien, indien elke vorm van verwijtbaarheid ontbreekt.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel40
  - number: '40.3'
    text: |-
      Indien het niet of niet behoorlijk nakomen van de verplichting, bedoeld in [artikel 62][ref1], niet heeft geleid
      tot het ten onrechte of tot een te hoog bedrag verlenen van een uitkering als genoemd in dat artikel, kan het
      Uitvoeringsinstituut werknemersverzekeringen afzien van het opleggen van een boete als bedoeld in het eerste lid
      en volstaan met het geven van een schriftelijke waarschuwing ter zake van het niet of niet behoorlijk nakomen van
      de verplichting, tenzij het niet of niet behoorlijk nakomen van de verplichting plaatsvindt binnen een periode van
      twee jaar te rekenen vanaf de datum waarop eerder aan de jonggehandicapte of zijn wettelijke vertegenwoordiger een
      zodanige waarschuwing is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel62
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '62'
        hoofdstuk: '4'
  - number: '40.4'
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kan het Uitvoeringsinstituut werknemersverzekeringen besluiten van
      het opleggen van een boete af te zien.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel40
  - number: '40.5'
    text: |-
      De persoon aan wie een boete is opgelegd is verplicht desgevraagd aan het Uitvoeringsinstituut
      werknemersverzekeringen de inlichtingen te verstrekken die voor de tenuitvoerlegging van de boete van belang zijn.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel40
  - number: '40.6'
    text: Voorzover de boete nog niet is geïnd, vervalt zij door het overlijden van degene aan wie zij is opgelegd.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel40
  - number: '40.7'
    text: Bij algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel40
  - number: '41.1'
    text: |-
      Indien het Uitvoeringsinstituut werknemersverzekeringen jegens de jonggehandicapte of zijn wettelijke
      vertegenwoordiger een handeling verricht waaraan deze in redelijkheid de gevolgtrekking kan verbinden dat
      hem wegens een bepaalde gedraging een boete zal worden opgelegd, is de jonggehandicapte of zijn wettelijke
      vertegenwoordiger niet langer verplicht ter zake van die gedragingen enige verklaring af te leggen, voor zover
      het de boete-oplegging betreft. De jonggehandicapte of zijn wettelijke vertegenwoordiger wordt hiervan in kennis
      gesteld alvorens hem mondeling om informatie wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel41
  - number: '41.2'
    text: |-
      Indien het Uitvoeringsinstituut werknemersverzekeringen voornemens is aan de jonggehandicapte of zijn wettelijke
      vertegenwoordiger een boete op te leggen, wordt hiervan kennis gegeven aan de jonggehandicapte of zijn wettelijke
      vertegenwoordiger onder vermelding van de gronden waarop het voornemen berust. De kennisgeving is een handeling als
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel41
  - number: '41.3'
    text: |-
      Op verzoek van de jonggehandicapte of zijn wettelijke vertegenwoordiger die de kennisgeving, bedoeld in het tweede
      lid, wegens zijn gebrekkige kennis van de Nederlandse taal onvoldoende begrijpt, draagt het Uitvoeringsinstituut
      werknemersverzekeringen er zoveel mogelijk zorg voor dat de in die kennisgeving vermelde gronden aan de
      jonggehandicapte of zijn wettelijke vertegenwoordiger worden meegedeeld in een voor hem begrijpelijke taal.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel41
  - number: '41.4'
    text: |-
      In afwijking van [afdeling 4.1.2 van de Algemene wet bestuursrecht][ref1] stelt het Uitvoeringsinstituut
      werknemersverzekeringen de jonggehandicapte of zijn wettelijke vertegenwoordiger in de gelegenheid om naar keuze
      schriftelijk of mondeling zijn zienswijze naar voren te brengen voordat de boete wordt opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.2
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.1.2
  - number: '41.5'
    text: |-
      Indien de jonggehandicapte of zijn wettelijke vertegenwoordiger zijn zienswijze mondeling naar voren brengt,
      draagt het Uitvoeringsinstituut werknemersverzekeringen er op verzoek van de jonggehandicapte of zijn wettelijke
      vertegenwoordiger die de Nederlandse taal onvoldoende begrijpt, zorg voor dat een tolk wordt benoemd die hem kan
      bijstaan, tenzij redelijkerwijs kan worden aangenomen dat daaraan geen behoefte bestaat.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel41
  - number: '42.1'
    text: |-
      Het besluit waarbij de boete wordt opgelegd vermeldt de termijn of de termijnen waarbinnen deze moet worden
      betaald, alsmede de wijze waarop het besluit bij gebreke van tijdige betaling, overeenkomstig artikel 46 zal worden
      tenuitvoergelegd.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel42
  - number: '42.2'
    text: |-
      Op verzoek van de jonggehandicapte of zijn wettelijke vertegenwoordiger die het in het eerste lid bedoelde besluit
      wegens zijn gebrekkige kennis van de Nederlandse taal onvoldoende begrijpt, draagt het Uitvoeringsinstituut
      werknemersverzekeringen er zoveel mogelijk zorg voor dat de in dat besluit vermelde informatie aan de
      jonggehandicapte of zijn wettelijke vertegenwoordiger wordt meegedeeld in een voor hem begrijpelijke taal.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel42
  - number: '42.3'
    text: Bij ministeriële regeling worden nadere regels gesteld met betrekking tot het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel42
  - number: '43.1'
    text: Een boete wordt niet opgelegd zolang de gedraging wordt onderzocht door het openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel43
  - number: '43.2'
    text: |-
      De oplegging van een boete blijft definitief achterwege indien ter zake van de gedragingen tegen de
      jonggehandicapte of zijn wettelijke vertegenwoordiger een strafvervolging is ingesteld en het onderzoek ter
      terechtzitting een aanvang heeft genomen, dan wel het recht tot strafvordering is vervallen op grond van
      [artikel 74 van het Wetboek van Strafrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel74
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '74'
  - number: '43.3'
    text: |-
      Het openbaar ministerie doet van een omstandigheid als bedoeld in het eerste en het tweede lid mededeling aan het
      Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel43
  - number: '44.1'
    text: |-
      Een boete wordt opgelegd binnen een jaar nadat het Uitvoeringsinstituut werknemersverzekeringen de jonggehandicapte
      of zijn wettelijke vertegenwoordiger overeenkomstig artikel 41, vierde lid, in de gelegenheid heeft gesteld zijn
      zienswijze naar voren te brengen. Indien ter zake aangifte is gedaan of proces-verbaal is opgemaakt en ingezonden
      vangt het tijdvak van een jaar aan op de dag na die waarop het openbaar ministerie aan het Uitvoeringsinstituut
      werknemersverzekeringen heeft meegedeeld dat geen strafvervolging wordt ingesteld.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel44
  - number: '44.2'
    text: |-
      Een boete wordt in elk geval niet opgelegd na verloop van vijf jaren nadat de desbetreffende gedraging heeft
      plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel44
  - number: '45'
    text: |-
      In afwijking van [artikel 8:69 van de Algemene wet bestuursrecht][ref1] kan de rechter in beroep of hoger
      beroep het bedrag waarop de boete is vastgesteld ook ten nadele van de jonggehandicapte of zijn wettelijke
      vertegenwoordiger wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '46.1'
    text: |-
      Het besluit waarbij een boete is opgelegd levert een executoriale titel op in de zin van het
      [Tweede Boek van het Wetboek van Burgerlijke Rechtsvordering][ref1]. De titel heeft mede betrekking op de rente en
      kosten, bedoeld in het zesde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '46.2'
    text: |-
      Indien de persoon aan wie een boete is opgelegd een uitkering ontvangt op grond van deze wet, de
      [Werkloosheidswet][ref1], de [Ziektewet][ref2], de [Wet werk en inkomen naar arbeidsvermogen][ref3], de
      [Wet op de arbeidsongeschiktheidsverzekering][ref4], de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref5],
      de [Wet arbeidsongeschiktheidsvoorziening militairen][ref6]of de [Wet arbeid en zorg][ref7] of een toeslag op grond
      van de [Toeslagenwet][ref8], wordt het besluit waarbij de boete is opgelegd tenuitvoergelegd door verrekening met
      die uitkering of toeslag.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0001888
      [ref3]: https://wetten.overheid.nl/BWBR0019057
      [ref4]: https://wetten.overheid.nl/BWBR0002524
      [ref5]: https://wetten.overheid.nl/BWBR0008656
      [ref6]: https://wetten.overheid.nl/BWBR0002822
      [ref7]: https://wetten.overheid.nl/BWBR0013008
      [ref8]: https://wetten.overheid.nl/BWBR0004043
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0001888
      - id: ref3
        bwb_id: BWBR0019057
      - id: ref4
        bwb_id: BWBR0002524
      - id: ref5
        bwb_id: BWBR0008656
      - id: ref6
        bwb_id: BWBR0002822
      - id: ref7
        bwb_id: BWBR0013008
      - id: ref8
        bwb_id: BWBR0004043
  - number: '46.3'
    text: |-
      Indien de persoon aan wie een boete is opgelegd een uitkering ontvangt op grond van de
      [Algemene Ouderdomswet][ref1], de [Algemene nabestaandenwet][ref2], de [Wet werk en bijstand][ref3],
      de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref4], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref5] of de
      [Wet werk en inkomen kunstenaars][ref6], betaalt de Sociale verzekeringsbank, onderscheidenlijk de betrokken
      gemeente het bedrag van die boete, zonder dat daarvoor een machtiging nodig is van hem, op zijn verzoek aan het
      Uitvoeringsinstituut werknemersverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
      [ref2]: https://wetten.overheid.nl/BWBR0007795
      [ref3]: https://wetten.overheid.nl/BWBR0015703
      [ref4]: https://wetten.overheid.nl/BWBR0004044
      [ref5]: https://wetten.overheid.nl/BWBR0004163
      [ref6]: https://wetten.overheid.nl/BWBR0017837
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0002221
      - id: ref2
        bwb_id: BWBR0007795
      - id: ref3
        bwb_id: BWBR0015703
      - id: ref4
        bwb_id: BWBR0004044
      - id: ref5
        bwb_id: BWBR0004163
      - id: ref6
        bwb_id: BWBR0017837
  - number: '46.4'
    text: |-
      Indien de persoon aan wie een boete is opgelegd geen uitkering of toeslag als bedoeld in het tweede of derde lid
      ontvangt, of meer ontvangt, dan wel ten aanzien van zodanige uitkering of toeslag toepassing van het tweede of
      derde lid niet mogelijk is, wordt het besluit waarbij de boete is opgelegd bij gebreke van tijdige betaling met
      toepassing van het [Wetboek van Burgerlijke Rechtsvordering][ref1] op zijn kosten betekend en tenuitvoergelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '46.5'
    text: |-
      De tenuitvoerlegging van een besluit waarbij een boete is opgelegd vindt plaats met toepassing van het tweede of
      derde lid, dan wel van het vierde lid, dan wel van het tweede of derde lid in combinatie met het vierde lid.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel46
  - number: '46.6'
    text: |-
      Bij gebreke van tijdige betaling wordt de verschuldigde boete verhoogd met de wettelijke rente en de op de
      invordering betrekking hebbende kosten.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel46
  - number: '46.7'
    text: |-
      Op het executoriaal beslag op grond van dit artikel door het Uitvoeringsinstituut werknemersverzekeringen
      op loon, sociale uitkeringen of andere periodieke betalingen, die derden verschuldigd zijn of worden
      aan degene aan wie een boete is opgelegd, zijn de [artikelen 479b tot en met 479g][ref1] , behoudens
      [artikel 479e, tweede lid, van het Wetboek van Burgerlijke Rechtsvordering][ref2] van overeenkomstige toepassing.
      De in [artikel 479g][ref3] aan het Landelijk Bureau Inning Onderhoudsbijdragen toegekende bevoegdheid komt
      gelijkelijk toe aan het Uitvoeringsinstituut werknemersverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel479b
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel479e
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel479g
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 479b
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 479e
      - id: ref3
        bwb_id: BWBR0001827
        artikel: 479g
  - number: '46.8'
    text: |-
      De tenuitvoerlegging van een besluit met toepassing van dit artikel geschiedt zodanig dat de jonggehandicapte of
      zijn wettelijke vertegenwoordiger blijft beschikken over een inkomen gelijk aan de beslagvrije voet, bedoeld in de
      [artikelen 475c ][ref1] en [475d van het Wetboek van Burgerlijke Rechtsvordering][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel475d
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475c
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 475d
  - number: '46.9'
    text: |-
      Het achtste lid geldt niet, zolang de jonggehandicapte of zijn wettelijke vertegenwoordiger zijn verplichting,
      bedoeld in [artikel 40, vijfde lid][ref1], niet of niet behoorlijk nakomt.


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel40
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '40'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
  - number: 46a
    text: |-
      Indien het Uitvoeringsinstituut werknemersverzekeringen de verzekerde de uitkering tijdelijk of blijvend,
      geheel of gedeeltelijk heeft geweigerd dan wel hem een boete heeft opgelegd, stelt het Uitvoeringsinstituut
      werknemersverzekeringen het reïntegratiebedrijf dat ten behoeve van die verzekerde werkzaamheden gericht
      op vergroting van de mogelijkheden tot het verrichten van arbeid of op inschakeling in arbeid verricht, van
      die beschikking in kennis voorzover dat noodzakelijk is voor de uitvoering van de werkzaamheden door het
      reïntegratiebedrijf.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel46a
  - number: '47.1'
    text: |-
      De arbeidsongeschiktheidsuitkering wordt betaalbaar gesteld door het Uitvoeringsinstituut werknemersverzekeringen.
      De betaling geschiedt als regel in tijdvakken van een maand.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel47
  - number: '47.2'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan een uitkering als bedoeld in het eerste lid, over een door
      hem te bepalen tijdvak bij wege van voorschot betaalbaar stellen, indien onzekerheid bestaat over het recht op
      of de hoogte van de uitkering of de hoogte van het te betalen bedrag aan uitkering. Een verleend voorschot wordt
      verrekend met het definitief vastgestelde bedrag aan uitkering dat over het desbetreffende tijdvak wordt betaald.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel47
  - number: '47.3'
    text: |-
      Onverminderd het tweede lid, schort het Uitvoeringsinstituut werknemersverzekeringen de betaling van de
      arbeidsongeschiktheidsuitkering op of schorst het de betaling, indien het op grond van duidelijke aanwijzingen van
      oordeel is of het gegronde vermoeden heeft dat:
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel47
  - number: 47.3.a
    text: het recht op uitkering niet of niet meer bestaat;
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel47
  - number: 47.3.b
    text: recht op een lagere uitkering bestaat;
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel47
  - number: 47.3.c
    text: |-
      de jonggehandicapte of zijn wettelijke vertegenwoordiger een verplichting als bedoeld in [artikel 37][ref1],
      [38][ref2] of [62][ref3] niet of niet behoorlijk is nagekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0008657#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0008657#Artikel62
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '37'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0008657
        artikel: '38'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0008657
        artikel: '62'
        hoofdstuk: '4'
  - number: '47.4'
    text: |-
      Ingeval de arbeidsongeschiktheidsuitkering in het buitenland wordt betaald worden de daaraan verbonden kosten van
      overmaking op de uitkering in mindering gebracht.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel47
  - number: '47.5'
    text: |-
      Wanneer de jonggehandicapte, aan wie een arbeidsongeschiktheidsuitkering is toegekend, een ander machtigt om de
      uitkering in ontvangst te nemen, onderscheidenlijk een verleende machtiging intrekt, wordt daaraan gevolg gegeven
      met ingang van een betalingstijdvak, aanvangende na de dag waarop de machtiging wordt ingediend, onderscheidenlijk
      waarop van haar intrekking mededeling wordt gedaan, doch niet later dan de eerste dag van de tweede maand na de dag
      van indiening onderscheidenlijk de mededeling.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel47
  - number: '47.6'
    text: |-
      Indien een reïntegratiebedrijf aan het Uitvoeringsinstituut werknemersverzekeringen heeft gemeld dat het
      gegronde vermoeden bestaat dat een persoon aan wie een uitkering is toegekend onvoldoende medewerking verleent
      aan de op hem betrekking hebbende werkzaamheden van het reïntegratiebedrijf, neemt het Uitvoeringsinstituut
      werknemersverzekeringen een besluit omtrent de gehele of gedeeltelijke opschorting of schorsing van de betaling van
      de uitkering aan die persoon voor de duur van ten hoogste acht weken.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel47
  - number: '47.7'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen stelt het reïntegratiebedrijf in kennis van een besluit tot
      opschorting of schorsing als bedoeld in het zesde lid.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel47
  - number: '48'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen houdt op de arbeidsongeschiktheidsuitkering,
      op de vakantie-uitkering en op de toeslag op de uitkering op grond van de [Toeslagenwet][ref1]
      een bedrag in, dat gelijk is aan het bedrag van de premie die een werkgever op grond van
      [afdeling 2 van hoofdstuk 3 van de Wet financiering sociale verzekeringen][ref2] op het overeenkomstige loon van
      een werknemer, die verzekerd is op grond van de [Werkloosheidswet][ref3], inhoudt.


      [ref1]: https://wetten.overheid.nl/BWBR0004043
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Afdeling2
      [ref3]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0004043
      - id: ref2
        bwb_id: BWBR0017745
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0004045
  - number: '49.1'
    text: |-
      Indien de jonggehandicapte aan wie een arbeidsongeschiktheidsuitkering is toegekend, aanspraak heeft
      op verstrekking of vergoeding van zorg als bedoeld in de [Algemene Wet Bijzondere Ziektekosten][ref1]
      en op grond van [die wet][ref2] een bijdrage voor die zorg verschuldigd is, is het Uitvoeringsinstituut
      werknemersverzekeringen bevoegd de uitkering tot het bedrag van die bijdrage in plaats van aan de
      jonggehandicapte zonder diens machtiging uit te betalen aan het College voor zorgverzekeringen, genoemd in
      [artikel 58, eerste lid, van de Zorgverzekeringswet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002614
      [ref2]: https://wetten.overheid.nl/BWBR0002614
      [ref3]: https://wetten.overheid.nl/BWBR0018450#Artikel58
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0002614
      - id: ref2
        bwb_id: BWBR0002614
      - id: ref3
        bwb_id: BWBR0018450
        artikel: '58'
  - number: '49.2'
    text: |-
      Indien de jonggehandicapte, aan wie een arbeidsongeschiktheidsuitkering is toegekend, in een inrichting ter
      verpleging van geesteszieken of van zwakzinnigen is opgenomen en het Uitvoeringsinstituut werknemersverzekeringen
      van de desbetreffende inrichting of van het college van burgemeester en wethouders van de gemeente die de
      opnamekosten betaalt, het verzoek ontvangt om de arbeidsongeschiktheidsuitkering aan die inrichting of die gemeente
      uit te betalen, kan het Uitvoeringsinstituut werknemersverzekeringen dat verzoek zonder het stellen van andere
      voorwaarden inwilligen.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel49
  - number: '49.3'
    text: |-
      Indien het eerste lid toepassing vindt, heeft de in het tweede lid bedoelde bevoegdheid betrekking op het gedeelte
      van de arbeidsongeschiktheidsuitkering, dat niet aan het College voor zorgverzekeringen wordt betaald.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel49
  - number: '49.4'
    text: |-
      Op de herziening van een beschikking op grond van het eerste lid als gevolg van een wijziging van de verschuldigde
      bijdrage zijn de [artikelen 3:41][ref1] en [3:45 van de Algemene wet bestuursrecht][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '50.1'
    text: |-
      Indien de jonggehandicapte die recht heeft op een arbeidsongeschiktheidsuitkering inkomsten uit arbeid geniet,
      wordt die arbeid gedurende een aaneengesloten tijdvak van vijf jaar, vanaf de eerste dag waarover de inkomsten
      uit arbeid worden genoten, niet aangemerkt als arbeid, bedoeld in [artikel 2, vijfde lid][ref1], en wordt de
      arbeidsongeschiktheidsuitkering niet ingetrokken of herzien, doch wordt de uitkering:


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel2
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '2'
        hoofdstuk: '1'
  - number: 50.1.a
    text: |-
      niet betaald, indien de inkomsten uit arbeid zodanig zijn, dat als die arbeid wel arbeid als bedoeld in
      [artikel 2, vijfde lid][ref1], zou zijn, niet langer sprake zou zijn van arbeidsongeschiktheid van ten minste 25%;
      of


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel2
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '2'
        hoofdstuk: '1'
  - number: 50.1.b
    text: |-
      indien onderdeel a niet van toepassing is, betaald tot een bedrag ter grootte van de
      arbeidsongeschiktheidsuitkering, zoals deze zou zijn vastgesteld, indien die arbeid wel arbeid als bedoeld in
      [artikel 2, vijfde lid][ref1], zou zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel2
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '2'
        hoofdstuk: '1'
  - number: '50.2'
    text: 'Het in het eerste lid genoemde tijdvak van vijf jaar:'
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel50
  - number: 50.2.a
    text: |-
      wordt niet onderbroken indien gedurende perioden van korter dan vier weken geen inkomsten uit arbeid worden
      genoten;
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel50
  - number: 50.2.b
    text: |-
      wordt, indien gedurende perioden van vier weken of langer geen inkomsten uit arbeid worden genoten, onderbroken,
      met dien verstande dat het van de vijf jaar resterende tijdvak aanvangt vanaf het moment waarop opnieuw inkomsten
      uit arbeid worden genoten.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel50
  - number: '50.3'
    text: |-
      Indien de jonggehandicapte die recht heeft op een arbeidsongeschiktheidsuitkering, inkomsten
      uit arbeid geniet ingevolge een arbeidsovereenkomst als bedoeld in de [hoofdstukken 2][ref1] en
      [3 van de Wet sociale werkvoorziening][ref2], is het eerste lid voor onbeperkte duur van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0008903#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0008903
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0008903
        hoofdstuk: '3'
  - number: '50.4'
    text: |-
      Maandelijks wordt, wat betreft onderdeel b in afwijking van [paragraaf 5.3 van de Zorgverzekeringswet][ref1], aan
      ’s Rijks Kas afgedragen het geraamde bedrag aan arbeidsongeschiktheidsuitkeringen die op grond van het derde lid
      niet worden uitbetaald wegens het genieten van dat loon, alsmede van de dientengevolge niet uitbetaalde vakantie-
      uitkeringen, vermeerderd met:


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Paragraaf5.3
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0018450
        paragraaf: '5.3'
  - number: 50.4.a
    text: |-
      het bedrag aan premies dat het Uitvoeringsinstituut werknemersverzekeringen bij uitbetaling op grond van enige wet
      over dat bedrag verschuldigd zou zijn en dat niet op de uitkeringen in mindering kan worden gebracht, en
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel50
  - number: 50.4.b
    text: |-
      de op grond van [artikel 46 van de Zorgverzekeringswet][ref1] vergoede inkomensafhankelijke bijdrage, bedoeld in
      [artikel 41 van die wet][ref2], over dat bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel41
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '46'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '41'
  - number: '50.5'
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot het eerste lid. Deze regels hebben in elk geval
      betrekking op:
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel50
  - number: 50.5.a
    text: de gelijkstelling van inkomsten in verband met arbeid met inkomsten als bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel50
  - number: 50.5.b
    text: de gevallen waarin het eerste lid buiten toepassing blijft.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel50
  - number: '50.6'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat het tweede lid geen toepassing vindt ten aanzien van andere vormen
      van arbeid die de jonggehandicapte gaat verrichten.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel50
  - number: 50a.1
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot door het UWV te verstrekken subsidie
      aan een rechtspersoon die in het kader van de uitoefening van beroep of bedrijf door scholing de inschakeling van
      jonggehandicapten met ernstige scholingsbelemmeringen in de arbeid bevordert.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel50a
  - number: 50a.2
    text: |-
      Bij de subsidieverlening, bedoeld in het eerste lid, kunnen aan de subsidie-ontvanger verplichtingen worden
      opgelegd omtrent het hanteren van een registratiesysteem waaruit blijkt of het doel van de subsidie is bereikt.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel50a
  - number: '51.1'
    text: |-
      Indien zowel recht bestaat op een arbeidsongeschiktheidsuitkering als op een uitkering op grond van de
      [Wet werk en inkomen naar arbeidsvermogen][ref1], wordt de arbeidsongeschiktheidsuitkering slechts uitbetaald,
      voorzover deze de uitkering op grond van de [Wet werk en inkomen naar arbeidsvermogen][ref2] overtreft.


      [ref1]: https://wetten.overheid.nl/BWBR0019057
      [ref2]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0019057
      - id: ref2
        bwb_id: BWBR0019057
  - number: '51.2'
    text: |-
      Het eerste lid is niet van toepassing, indien ter zake van arbeidsongeschiktheid recht ontstaat op een uitkering
      op grond van de [Wet werk en inkomen naar arbeidsvermogen][ref1] en in verband daarmee geen herziening op grond van
      [artikel 12][ref2] plaatsvindt van de voordien toegekende arbeidsongeschiktheidsuitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0019057
      [ref2]: https://wetten.overheid.nl/BWBR0008657#Artikel12
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0019057
      - id: ref2
        bwb_id: BWBR0008657
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '1'
  - number: '51.3'
    text: |-
      Indien ter zake van arbeidsongeschiktheid zowel recht ontstaat op herziening van de arbeidsongeschiktheidsuitkering
      in verband met de [artikelen 11 tot en met 16][ref1] als op een uitkering op grond van de
      [Wet werk en inkomen naar arbeidsvermogen][ref2], wordt de arbeidsongeschiktheidsuitkering slechts uitbetaald
      voorzover deze de uitkering op grond van de [Wet werk en inkomen naar arbeidsvermogen][ref3] overtreft, doch in elk
      geval uitbetaald tot de hoogte van het bedrag onmiddellijk voorafgaande aan de herziening.


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0019057
      [ref3]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0019057
      - id: ref3
        bwb_id: BWBR0019057
  - number: '51.4'
    text: |-
      Indien na toepassing van het derde lid zowel de arbeidsongeschiktheidsuitkering als gevolg van
      toe- of afneming van de arbeidsongeschiktheid wordt herzien als de uitkering op grond van de
      [Wet werk en inkomen naar arbeidsvermogen][ref1] wijzigt, wordt de arbeidsongeschiktheidsuitkering in
      afwijking van het eerste lid, uitbetaald voorzover deze het bedrag van de uitkering op grond van de
      [Wet werk en inkomen naar arbeidsvermogen][ref2] overtreft, doch in elk geval uitbetaald tot de hoogte van het
      bedrag onmiddellijk voorafgaande aan de herziening als bedoeld in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0019057
      [ref2]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0019057
      - id: ref2
        bwb_id: BWBR0019057
  - number: '51.5'
    text: |-
      Indien terzake van arbeidsongeschiktheid zowel recht bestaat op wijziging van de uitkering op grond van de
      [Wet werk en inkomen naar arbeidsvermogen][ref1] als op toekenning van een arbeidsongeschiktheidsuitkering,
      wordt de arbeidsongeschiktheidsuitkering uitbetaald voorzover deze de gewijzigde uitkering op grond van de
      [Wet werk en inkomen naar arbeidsvermogen][ref2] overtreft.


      [ref1]: https://wetten.overheid.nl/BWBR0019057
      [ref2]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0019057
      - id: ref2
        bwb_id: BWBR0019057
  - number: '51.6'
    text: |-
      Voor de toepassing van het eerste tot en met vijfde lid wordt onder arbeidsongeschiktheidsuitkering en uitkering
      op grond van de [Wet werk en inkomen naar arbeidsvermogen][ref1] tevens verstaan de vakantie-uitkering waarop uit
      hoofde van die uitkering recht bestaat, voorzover die vakantie-uitkering over dezelfde periode is berekend.


      [ref1]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0019057
  - number: '51.7'
    text: |-
      Het eerste tot en met zesde lid zijn niet van toepassing op de persoon die
      een uitkering ontvangt op grond van de vrijwillige verzekering als bedoeld in
      [hoofdstuk 2, paragraaf 2, van de Wet werk en inkomen naar arbeidsvermogen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Paragraaf2.2
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0019057
        paragraaf: '2.2'
  - number: '51.8'
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen nadere en zo nodig afwijkende regels worden gesteld:'
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel51
  - number: 51.8.a
    text: met betrekking tot het eerste lid;
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel51
  - number: 51.8.b
    text: |-
      ter voorkoming van beperking of samenloop van arbeidsongeschiktheidsuitkering met arbeidsongeschiktheidsuitkering
      op grond van andere wetten.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel51
  - number: '51.9'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld ter voorkoming of beperking van samenloop van
      arbeidsongeschiktheidsuitkering op grond van de sociale wetgeving van de Nederlandse Antillen, Aruba of een andere
      Mogendheid.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel51
  - number: 51a.1
    text: |-
      Indien zowel recht bestaat op een arbeidsongeschiktheidsuitkering als op een
      arbeidsongeschiktheidsuitkering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref1]
      of op grond van de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref2], wordt de
      arbeidsongeschiktheidsuitkering slechts uitbetaald, voor zover deze de arbeidsongeschiktheidsuitkering
      op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref3] of op grond van de
      [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref4] overtreft.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0008656
      [ref3]: https://wetten.overheid.nl/BWBR0002524
      [ref4]: https://wetten.overheid.nl/BWBR0008656
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel51a
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0008656
      - id: ref3
        bwb_id: BWBR0002524
      - id: ref4
        bwb_id: BWBR0008656
  - number: 51a.2
    text: |-
      Het eerste lid is niet van toepassing, indien ter zake van arbeidsongeschiktheid recht ontstaat op
      een uitkering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref1] of op grond van de
      [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref2] en in verband daarmee geen herziening op grond van
      [artikel 12][ref3] plaatsvindt van de voordien toegekende arbeidsongeschiktheidsuitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0008656
      [ref3]: https://wetten.overheid.nl/BWBR0008657#Artikel12
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel51a
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0008656
      - id: ref3
        bwb_id: BWBR0008657
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '1'
  - number: 51a.3
    text: |-
      Indien ter zake van arbeidsongeschiktheid zowel recht bestaat op herziening van de
      arbeidsongeschiktheidsuitkering in verband met de [artikelen 11 tot en met 16][ref1] als op toekenning van
      een arbeidsongeschiktheidsuitkering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref2]
      of de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref3], wordt de
      arbeidsongeschiktheidsuitkering slechts uitbetaald voor zover deze de arbeidsongeschiktheidsuitkering
      op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref4] of de
      [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref5] overtreft, doch in ieder geval uitbetaald tot de hoogte
      van het bedrag onmiddellijk voorafgaande aan de herziening.


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002524
      [ref3]: https://wetten.overheid.nl/BWBR0008656
      [ref4]: https://wetten.overheid.nl/BWBR0002524
      [ref5]: https://wetten.overheid.nl/BWBR0008656
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel51a
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002524
      - id: ref3
        bwb_id: BWBR0008656
      - id: ref4
        bwb_id: BWBR0002524
      - id: ref5
        bwb_id: BWBR0008656
  - number: 51a.4
    text: |-
      Indien na toepassing van het derde lid zowel de arbeidsongeschiktheidsuitkering als de
      arbeidsongeschiktheidsuitkering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref1]
      of de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref2] als gevolg van toe- of
      afneming van de arbeidsongeschiktheid wordt herzien, wordt de arbeidsongeschiktheidsuitkering,
      in afwijking van het eerste lid, uitbetaald voor zover deze het bedrag van de
      arbeidsongeschiktheidsuitkering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref3] of de
      [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref4] overtreft, doch in elk geval uitbetaald tot de hoogte
      van het bedrag onmiddellijk voorafgaande aan de herziening als bedoeld in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0008656
      [ref3]: https://wetten.overheid.nl/BWBR0002524
      [ref4]: https://wetten.overheid.nl/BWBR0008656
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel51a
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0008656
      - id: ref3
        bwb_id: BWBR0002524
      - id: ref4
        bwb_id: BWBR0008656
  - number: 51a.5
    text: |-
      Indien ter zake van arbeidsongeschiktheid zowel recht bestaat op herziening van de
      arbeidsongeschiktheidsuitkering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref1]
      in verband met de [artikelen 36 tot en met 40 van die wet][ref2] of op herziening op
      grond van de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref3] in verband met de
      [artikelen 12 tot en met 16 van die wet][ref4] als op toekenning van een arbeidsongeschiktheidsuitkering,
      wordt de arbeidsongeschiktheidsuitkering uitbetaald voor zover deze de herziene
      arbeidsongeschiktheidsuitkering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref5] of de
      [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref6] overtreft.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0008656
      [ref4]: https://wetten.overheid.nl/BWBR0008656#Artikel12
      [ref5]: https://wetten.overheid.nl/BWBR0002524
      [ref6]: https://wetten.overheid.nl/BWBR0008656
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel51a
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '36'
      - id: ref3
        bwb_id: BWBR0008656
      - id: ref4
        bwb_id: BWBR0008656
        artikel: '12'
      - id: ref5
        bwb_id: BWBR0002524
      - id: ref6
        bwb_id: BWBR0008656
  - number: 51a.6
    text: |-
      Voor de toepassing van het eerste tot en met het vijfde lid wordt onder arbeidsongeschiktheidsuitkering en
      arbeidsongeschiktheidsuitkering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref1] en de
      [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref2] tevens verstaan de vakantie-uitkering waarop uit hoofde
      van die arbeidsongeschiktheidsuitkeringen recht bestaat, voor zover die vakantie-uitkeringen over dezelfde periode
      zijn berekend.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0008656
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel51a
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0008656
  - number: 51a.7
    text: |-
      Het eerste tot en met het zesde lid zijn niet van toepassing op degene die een
      arbeidsongeschiktheidsuitkering ontvangt op grond van de vrijwillige verzekering als bedoeld in
      [hoofdstuk VI van de Wet op de arbeidsongeschiktheidsverzekering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#HoofdstukVI
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel51a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        hoofdstuk: VI
  - number: 51a.8
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere en zo nodig afwijkende regels worden gesteld: met
      betrekking tot het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel51a
  - number: '52.1'
    text: |-
      De betaling van de vakantie-uitkering vindt eenmaal per jaar plaats in de maand mei over de aan die maand
      voorafgaande 12 maanden, of, indien het recht op uitkering eerder dan in de maand mei eindigt, in de desbetreffende
      maand. Het Uitvoeringsinstituut werknemersverzekeringen kan de vakantie-uitkering op een ander tijdstip betalen,
      mits die betaling plaatsvindt over een of meer voorliggende maanden waarover reeds recht op vakantie-uitkering
      bestaat.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel52
  - number: '52.2'
    text: |-
      De artikelen 47, 49 en 53 zijn van overeenkomstige toepassing ten aanzien van de vakantie-uitkering, voor zover bij
      of krachtens deze wet niet anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel52
  - number: 52a
    text: |-
      De [artikelen 32][ref1], [47][ref2], [49][ref3], [55][ref4], [56][ref5] en [57][ref6] zijn van overeenkomstige
      toepassing ten aanzien van de betaling van de tegemoetkoming, bedoeld in [artikel 9a][ref7], voor zover bij of
      krachtens deze wet niet anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0008657#Artikel47
      [ref3]: https://wetten.overheid.nl/BWBR0008657#Artikel49
      [ref4]: https://wetten.overheid.nl/BWBR0008657#Artikel55
      [ref5]: https://wetten.overheid.nl/BWBR0008657#Artikel56
      [ref6]: https://wetten.overheid.nl/BWBR0008657#Artikel57
      [ref7]: https://wetten.overheid.nl/BWBR0008657#Artikel9a
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel52a
    references:
      - id: ref1
