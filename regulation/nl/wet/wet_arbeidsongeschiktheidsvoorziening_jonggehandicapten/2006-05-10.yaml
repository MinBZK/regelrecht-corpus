  - number: '53.1'
    text: |-
      Na het overlijden van de jonggehandicapte, aan wie een arbeidsongeschiktheidsuitkering is toegekend, wordt met
      ingang van de dag na het overlijden, de uitkering in de vorm van een overlijdensuitkering betaald:
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel53
  - number: 53.1.a
    text: aan de langstlevende van de echtgenoten;
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel53
  - number: 53.1.b
    text: |-
      bij ontstentenis van de in onderdeel *a* bedoelde persoon, aan de minderjarige kinderen tot wie de overledene in
      familierechtelijke betrekking stond;
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel53
  - number: 53.1.c
    text: |-
      bij ontstentenis van de in de onderdelen *a* en *b* bedoelde personen aan degenen ten aanzien van wie de overledene
      grotendeels in de kosten van bestaan voorzag en met wie hij in gezinsverband leefde.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel53
  - number: '53.2'
    text: |-
      Met de jonggehandicapte aan wie een arbeidsongeschiktheidsuitkering is toegekend, wordt voor de toepassing van dit
      artikel gelijkgesteld, de jonggehandicapte wiens overlijden heeft plaatsgevonden in de maand waarin hij de leeftijd
      van 65 jaar zou hebben bereikt, doch voor het bereiken van deze leeftijd is overleden, en die uitsluitend op grond
      van artikel 17, eerste lid, onderdeel *a*, over de dag van zijn overlijden geen recht op uitkering had.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel53
  - number: '53.3'
    text: |-
      De overlijdensuitkering is gelijk aan het bedrag van de uitkering over één maand, doch niet over de zaterdagen
      en de zondagen, berekend naar de hoogte van die uitkering op de dag of laatstelijk voor de dag van overlijden van
      de jonggehandicapte.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel53
  - number: '53.4'
    text: |-
      In verband met het overlijden van de jonggehandicapte aan wie een uitkering is toegekend, is artikel 17, eerste
      lid, onderdeel *a*, niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel53
  - number: '53.5'
    text: |-
      De overlijdensuitkering wordt op aanvraag aan de rechthebbende of rechthebbenden, bedoeld in het eerste lid, door
      het Uitvoeringsinstituut werknemersverzekeringen betaald.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel53
  - number: '53.6'
    text: De overlijdensuitkering wordt in een bedrag ineens betaald.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel53
  - number: '53.7'
    text: |-
      Het bedrag van de overlijdensuitkering wordt verminderd met het bedrag aan arbeidsongeschiktheidsuitkering dat over
      na het overlijden gelegen dagen reeds is betaald.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel53
  - number: '54'
    text: |-
      Uitkeringen op grond van deze wet die niet in ontvangst zijn genomen of zijn ingevorderd binnen twee jaren na de
      dag van betaalbaarstelling, worden niet meer betaald.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel54
  - number: '55.1'
    text: |-
      De uitkering de loonsuppletie, bedoeld in [artikel 59f][ref1], de inkomenssuppletie, bedoeld in [artikel 59g][ref2]
      en de voorziening of de kosten van de voorziening, bedoeld in [artikel 59b][ref3], die als gevolg van een besluit
      als bedoeld in [artikel 16][ref4] onverschuldigd is verstrekt, alsmede hetgeen anderszins onverschuldigd is
      betaald, wordt door het Uitvoeringsinstituut werknemersverzekeringen teruggevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel59f
      [ref2]: https://wetten.overheid.nl/BWBR0008657#Artikel59g
      [ref3]: https://wetten.overheid.nl/BWBR0008657#Artikel59b
      [ref4]: https://wetten.overheid.nl/BWBR0008657#Artikel16
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: 59f
        hoofdstuk: 2A
      - id: ref2
        bwb_id: BWBR0008657
        artikel: 59g
        hoofdstuk: 2A
      - id: ref3
        bwb_id: BWBR0008657
        artikel: 59b
        hoofdstuk: 2A
      - id: ref4
        bwb_id: BWBR0008657
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '1'
  - number: '55.2'
    text: |-
      In afwijking van het eerste lid kan het Uitvoeringsinstituut werknemersverzekeringen besluiten van terugvordering
      of van verdere terugvordering af te zien, indien degene van wie wordt teruggevorderd:
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel55
  - number: 55.2.a
    text: gedurende vijf jaar volledig aan zijn betalingsverplichtingen heeft voldaan;
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel55
  - number: 55.2.b
    text: |-
      gedurende vijf jaar niet volledig aan zijn betalingsverplichtingen heeft voldaan, maar het achterstallige bedrag
      over die periode, vermeerderd met de daarover verschuldigde wettelijke rente en de op de invordering betrekking
      hebbende kosten, alsnog heeft betaald;
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel55
  - number: 55.2.c
    text: |-
      gedurende vijf jaar geen betalingen heeft verricht en niet aannemelijk is dat hij deze op enig moment zal gaan
      verrichten; of
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel55
  - number: 55.2.d
    text: een bedrag, overeenkomend met ten minste 50% van de restsom in één keer aflost.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel55
  - number: '55.3'
    text: 'De in het tweede lid, onder a en b, genoemde termijn is drie jaar indien:'
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel55
  - number: 55.3.a
    text: |-
      het gemiddeld inkomen van de belanghebbende in die periode de beslagvrije voet bedoeld in de [artikelen 475c][ref1]
      en [475d van het Wetboek van Burgerlijke Rechtsvordering][ref2] niet te boven is gegaan; en


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel475d
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475c
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 475d
  - number: 55.3.b
    text: |-
      de terugvordering niet het gevolg is van het niet of niet behoorlijk nakomen van de verplichting, bedoeld in
      [artikel 62][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel62
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '62'
        hoofdstuk: '4'
  - number: '55.4'
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kan het Uitvoeringsinstituut werknemersverzekeringen besluiten
      geheel of gedeeltelijk van terugvordering af te zien.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel55
  - number: '55.5'
    text: |-
      Het besluit tot terugvordering vermeldt hetgeen wordt teruggevorderd, de termijn of termijnen waarbinnen moet
      worden betaald, alsmede dat het besluit bij gebreke van tijdige betaling zal worden tenuitvoergelegd op de wijze
      als omschreven in [artikel 56][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel56
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '56'
        hoofdstuk: '2'
        afdeling: '3'
  - number: '55.6'
    text: |-
      De persoon van wie of de instelling waarvan wordt teruggevorderd is verplicht desgevraagd aan het
      Uitvoeringsinstituut werknemersverzekeringen de inlichtingen te verstrekken die voor de terugvordering van belang
      zijn.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel55
  - number: '55.7'
    text: |-
      In afwijking van het eerste lid kan het Uitvoeringsinstituut werknemersverzekeringen, onder voorwaarden die Onze
      Minister kan stellen, besluiten van terugvordering af te zien indien het terug te vorderen bedrag een door Onze
      Minister vast te stellen bedrag niet te boven gaat.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel55
  - number: '56.1'
    text: |-
      Het besluit tot terugvordering levert een executoriale titel op in de zin van het [Tweede Boek van het Wetboek van
      Burgerlijke Rechtsvordering](onbekend).
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel56
  - number: '56.2'
    text: |-
      Artikel 46 is van overeenkomstige toepassing, met dien verstande dat indien het gemiddeld inkomen
      van de belanghebbende gedurende drie jaar de beslagvrije voet bedoeld in de [artikelen 475c][ref1] en
      [475d van het Wetboek van Burgerlijke Rechtsvordering][ref2] niet te boven is gegaan, het Uitvoeringsinstituut
      werknemersverzekeringen de aflossingsbedragen lager vaststelt.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel475d
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475c
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 475d
  - number: '57'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de
      [artikelen 55, eerste, tweede, derde, vierde, vijfde en zesde lid][ref1], en [56][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0008657#Artikel56
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '55'
        hoofdstuk: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0008657
        artikel: '56'
        hoofdstuk: '2'
        afdeling: '3'
  - number: '58.1'
    text: 'Onvervreemdbaar en niet vatbaar voor verpanding en belening zijn:'
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel58
  - number: 58.1.a
    text: de arbeidsongeschiktheidsuitkering;
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel58
  - number: 58.1.b
    text: |-
      de verhoging van de arbeidsongeschiktheidsuitkering, bedoeld in [artikel 9][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel9
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '1'
  - number: 58.1.c
    text: de vakantie-uitkering;
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel58
  - number: 58.1.d
    text: |-
      de loonsuppletie, bedoeld in [artikel 59f][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel59f
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: 59f
        hoofdstuk: 2A
  - number: 58.1.e
    text: |-
      de inkomenssuppletie, bedoeld in [artikel 59g][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel59g
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: 59g
        hoofdstuk: 2A
  - number: 58.1.f
    text: |-
      de voorzieningen, bedoeld in [artikel 59b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel59b
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: 59b
        hoofdstuk: 2A
  - number: 58.1.g
    text: |-
      de tegemoetkoming, bedoeld in [artikel 9a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel9a
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: 9a
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '1'
  - number: '58.2'
    text: Volmacht tot ontvangst van een uitkering onder welke vorm of welke benaming ook verleend, is steeds herroepelijk.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel58
  - number: '58.3'
    text: Elk beding, strijdig met dit artikel, is nietig.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel58
  - number: '59'
    text: 'Niet vatbaar voor beslag zijn:'
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel59
  - number: 59.a
    text: |-
      de verhoging, bedoeld in [artikel 9][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel9
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '1'
  - number: 59.b
    text: |-
      de overlijdensuitkering, bedoeld in [artikel 53][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel53
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '53'
        hoofdstuk: '2'
        afdeling: '3'
  - number: 59.c
    text: |-
      de voorzieningen, bedoeld in [artikel 59b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel59b
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: 59b
        hoofdstuk: 2A
  - number: 59a.1
    text: 'Indien de arbeidsprestatie van een werknemer die:'
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel59a
  - number: 59a.1.a
    text: recht heeft op een arbeidsongeschiktheidsuitkering; of
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel59a
  - number: 59a.1.b
    text: de leeftijd van achttien jaar nog niet heeft bereikt,
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel59a
  - number: 59a.2
    text: |-
      Elk beding waarbij een geldelijke beloning voor de verrichte arbeid wordt overeengekomen die lager is dan de
      beloning, vastgesteld op grond van het eerste lid is nietig.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel59a
  - number: 59a.3
    text: |-
      Vanaf de dag waarop de werknemer, bedoeld in het eerste lid, onderdeel b, de leeftijd van achttien jaar bereikt en
      recht heeft op een arbeidsongeschiktheidsuitkering, wordt de op grond van onderdeel b verstrekte vermindering van
      de hoogte van de aanspraak op een geldelijke beloning, geacht te zijn gebaseerd op het eerste lid, onderdeel a,
      tenzij de werknemer niet aan de overige voorwaarden van het eerste lid voldoet.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel59a
  - number: 59b
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere en zo nodig afwijkende regels worden gesteld op
      grond waarvan het Uitvoeringsinstituut werknemersverzekeringen op aanvraag van de jonggehandicapte die de leeftijd
      van 18 jaar nog niet heeft bereikt en de jonggehandicapte die recht heeft op een arbeidsongeschiktheidsuitkering,
      in het kader van de bevordering en ondersteuning bij de inschakeling in de arbeid als zelfstandige aan die
      jonggehandicapte voorzieningen kan verstrekken.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel59b
  - number: 59c.1
    text: |-
      Bij algemene maatregel van bestuur kan bij wijze van experiment, met het oog op het onderzoeken van
      mogelijkheden om deze wet met betrekking tot de inschakeling in de arbeid van jonggehandicapten die recht op een
      arbeidsongeschiktheidsuitkering hebben, doeltreffender uit te voeren, worden afgeweken van het bepaalde bij of
      krachtens de artikelen van deze wet. Bij toepassing van de eerste zin wordt bij algemene maatregel van bestuur
      geregeld op welke wijze van welke artikelen wordt afgeweken.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel59c
  - number: 59c.2
    text: |-
      Een experiment als bedoeld in het eerste lid duurt ten hoogste vier jaar. Indien, voor een experiment is afgelopen,
      een voorstel van wet is ingediend bij de Staten-Generaal om het experiment om te zetten in een structurele
      wettelijke regeling, kan het experiment worden verlengd tot het tijdstip waarop het voorstel van wet in werking
      treedt. Het eerste lid, tweede zin, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel59c
  - number: 59c.3
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de uitvoering van een experiment en
      voorzieningen worden getroffen voor zich gedurende een experiment voordoende onvoorziene gevallen.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel59c
  - number: 59c.4
    text: |-
      Onze Minister meldt aan de Staten-Generaal hoe het experiment in de praktijk is verlopen, alsmede zijn standpunt
      inzake de voortzetting ervan anders dan als experiment.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel59c
  - number: 59c.5
    text: |-
      De voordracht voor krachtens dit artikel vast te stellen algemene maatregelen van bestuur wordt niet eerder gedaan
      dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel59c
  - number: 59d
    text: |-
      De jonggehandicapte die recht heeft op een arbeidsongeschiktheidsuitkering heeft recht op ondersteuning bij
      arbeidsinschakeling en, met inachtneming van de daarvoor geldende wettelijke bepalingen, op de naar het oordeel van
      het Uitvoeringsinstituut werknemersverzekeringen noodzakelijk geachte voorziening gericht op arbeidsinschakeling.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel59d
  - number: 59f.1
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan aan de jonggehandicapte die de leeftijd van 18 jaar nog
      niet heeft bereikt en de jonggehandicapte die recht heeft op een arbeidsongeschiktheidsuitkering en die arbeid
      in dienstbetrekking aanvaardt of verricht op aanvraag loonsuppletie toekennen, indien het loon lager is dan zijn
      resterende verdiencapaciteit.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel59f
  - number: 59f.2
    text: |-
      De loonsuppletie wordt verstrekt over perioden waarin loon uit dienstbetrekking wordt ontvangen, doch ten hoogste
      over een periode van vier jaar te rekenen vanaf de dag met ingang waarvan voor de eerste maal loonsuppletie is
      toegekend.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel59f
  - number: 59f.3
    text: |-
      Als perioden waarin loon uit dienstbetrekking wordt ontvangen als bedoeld in het tweede lid worden
      eveneens aangemerkt, perioden waarin een uitkering op grond van de [Ziektewet][ref1] of op grond van
      [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref2] wordt ontvangen, tenzij de dienstbetrekking
      is geëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Paragraaf1
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel59f
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0013008
        paragraaf: '1'
  - number: 59f.4
    text: |-
      De loonsuppletie wordt voor de toepassing van de wettelijke bepalingen inzake premieheffing aangemerkt als een
      uitkering op grond van deze wet.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel59f
  - number: 59f.5
    text: Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de hoogte van de loonsuppletie.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel59f
  - number: 59g.1
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan aan de jonggehandicapte die de leeftijd van 18 jaar nog
      niet heeft bereikt en de jonggehandicapte die recht heeft op een arbeidsongeschiktheidsuitkering, die arbeid als
      zelfstandige verricht of gaat verrichten op aanvraag inkomenssuppletie toekennen, indien zijn inkomen uit het
      bedrijf of beroep lager is dan zijn resterende verdiencapaciteit.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel59g
  - number: 59g.2
    text: |-
      De inkomenssuppletie wordt verstrekt over perioden waarin het bedrijf of beroep wordt uitgeoefend, doch ten hoogste
      over een periode van vier jaar te rekenen vanaf de dag met ingang waarvan voor de eerste maal inkomenssuppletie
      is toegekend.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel59g
  - number: 59g.3
    text: |-
      De inkomenssuppletie wordt voor de toepassing van de wettelijke bepalingen inzake premieheffing aangemerkt als een
      uitkering op grond van de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008656
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel59g
    references:
      - id: ref1
        bwb_id: BWBR0008656
  - number: 59g.4
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de hoogte van de
      inkomenssuppletie.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel59g
  - number: 59h.1
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan, in het kader van de bevordering van de inschakeling in de
      arbeid, toestemming verlenen aan de jonggehandicapte, die recht heeft op een arbeidsongeschiktheidsuitkering om op
      een proefplaats bij een werkgever gedurende maximaal drie maanden onbeloonde werkzaamheden te verrichten.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel59h
  - number: 59h.2
    text: |-
      Tijdens het verrichten van werkzaamheden op een proefplaats als bedoeld in het eerste lid wordt de
      arbeidsongeschiktheidsuitkering niet ingetrokken of herzien.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel59h
  - number: 59h.3
    text: 'De onbeloonde werkzaamheden op een proefplaats als bedoeld in het eerste lid zijn:'
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel59h
  - number: 59h.3.a
    text: |-
      werkzaamheden, waartoe de jonggehandicapte, bedoeld in het eerste lid, met zijn krachten en bekwaamheden in staat
      is;
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel59h
  - number: 59h.3.b
    text: |-
      werkzaamheden, waarbij de werkgever, bij wie de proefplaatsing geschiedt, een aansprakelijkheids- en
      ongevallenverzekering ten behoeve van de jonggehandicapte, bedoeld in het eerste lid, heeft afgesloten;
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel59h
  - number: 59h.3.c
    text: |-
      werkzaamheden, die de jonggehandicapte, bedoeld in het eerste lid, niet reeds eerder onbeloond op een proefplaats
      bij die werkgever of diens rechtsvoorganger heeft verricht; en
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel59h
  - number: 59h.3.d
    text: |-
      werkzaamheden, waarbij er, naar het oordeel van het Uitvoeringsinstituut werknemersverzekeringen, een reëel
      uitzicht is op een op de onbeloonde werkzaamheden aansluitende dienstbetrekking van dezelfde of grotere omvang voor
      ten minste 6 maanden.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel59h
  - number: 59h.4
    text: |-
      De jonggehandicapte, bedoeld in het eerste lid, die werkzaamheden verricht als bedoeld in het eerste lid, doet
      daarvan onverwijld mededeling aan het Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel59h
  - number: 59h.5
    text: |-
      Indien de werkzaamheden, bedoeld in het eerste lid, wegens ziekte worden onderbroken, wordt de periode waarin een
      uitkering bij ziekte wordt ontvangen, voor de toepassing van dat lid buiten beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel59h
  - number: 59h.6
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel59h
  - number: 59i
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de aanvraag van loonsuppletie,
      bedoeld in [artikel 59f][ref1], van inkomenssuppletie, bedoeld in [artikel 59g][ref2], van voorzieningen, bedoeld
      in [artikel 59b][ref3] en van toestemming als bedoeld in [artikel 59h][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel59f
      [ref2]: https://wetten.overheid.nl/BWBR0008657#Artikel59g
      [ref3]: https://wetten.overheid.nl/BWBR0008657#Artikel59b
      [ref4]: https://wetten.overheid.nl/BWBR0008657#Artikel59h
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel59i
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: 59f
        hoofdstuk: 2A
      - id: ref2
        bwb_id: BWBR0008657
        artikel: 59g
        hoofdstuk: 2A
      - id: ref3
        bwb_id: BWBR0008657
        artikel: 59b
        hoofdstuk: 2A
      - id: ref4
        bwb_id: BWBR0008657
        artikel: 59h
        hoofdstuk: 2A
  - number: '60'
    text: |-
      Bij de vaststelling van de schadevergoeding, waarop de jonggehandicapte naar burgerlijk recht aanspraak kan maken
      ter zake van zijn arbeidsongeschiktheid, houdt de rechter rekening met de aanspraken, die hij op grond van deze
      wet heeft.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel60
  - number: '61.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen heeft voor de op grond van deze wet gemaakte kosten verhaal op
      degene, die in verband met het veroorzaken van arbeidsongeschiktheid jegens de jonggehandicapte naar burgerlijk
      recht tot schadevergoeding is verplicht, doch ten hoogste tot het bedrag, waarvoor deze bij het ontbreken van
      de aanspraken krachtens deze wet naar burgerlijk recht aansprakelijk zou zijn, verminderd met een bedrag, gelijk
      aan dat van de schadevergoeding tot betaling waarvan de aansprakelijke persoon jegens de jonggehandicapte naar
      burgerlijk recht is gehouden.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel61
  - number: '61.2'
    text: |-
      Overeenkomstig door Onze Minister te stellen regels kan het Uitvoeringsinstituut werknemersverzekeringen in plaats
      van het bedrag van de periodieke verstrekkingen de contante waarde daarvan vorderen.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel61
  - number: '62.1'
    text: |-
      De jonggehandicapte, diens wettelijke vertegenwoordiger alsmede de instelling bedoeld in [artikel 49][ref1],
      waaraan arbeidsongeschiktheidsuitkering wordt betaald, zijn verplicht aan het Uitvoeringsinstituut
      werknemersverzekeringen, op zijn verzoek of onverwijld uit eigen beweging mededeling te doen van alle feiten of
      omstandigheden, waarvan het hun redelijkerwijs duidelijk moet zijn dat zij van invloed kunnen zijn op het recht
      op uitkering, de hoogte van de uitkering, het geldend maken van het recht op uitkering of op het bedrag van de
      uitkering, dat wordt betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel49
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '49'
        hoofdstuk: '2'
        afdeling: '3'
  - number: '62.2'
    text: |-
      Op de jonggehandicapte die aanspraak maakt op of recht heeft op een vakantie-uitkering dan wel een tegemoetkoming
      als bedoeld in [artikel 9a][ref1], en diens wettelijke vertegenwoordiger rusten overeenkomstige verplichtingen als
      omschreven in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel9a
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: 9a
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '1'
  - number: '62.3'
    text: |-
      De jonggehandicapte aan wie een reïntegratie-instrument als bedoeld in [hoofdstuk 2A][ref1] is verstrekt
      of toegekend, of aan wie verstrekking of toekenning daarvan wordt overwogen, alsmede diens wettelijk
      vertegenwoordiger, en de werkgever ten behoeve van wie het Uitvoeringsinstituut werknemersverzekeringen de
      aanspraak op een geldelijke beloning voor de verrichte arbeid, op grond van [artikel 59a][ref2], heeft verminderd,
      zijn verplicht aan het Uitvoeringsinstituut werknemersverzekeringen op zijn verzoek of onverwijld uit eigen
      beweging mededeling te doen van alle feiten en omstandigheden, waarvan hun redelijkerwijs duidelijk moet zijn
      dat zij van invloed kunnen zijn op de verstrekking of toekenning of op de duur of de hoogte van het reïntegratie-
      instrument.


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Hoofdstuk2A
      [ref2]: https://wetten.overheid.nl/BWBR0008657#Artikel59a
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0008657
        hoofdstuk: 2A
      - id: ref2
        bwb_id: BWBR0008657
        artikel: 59a
        hoofdstuk: 2A
  - number: '63'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen beheert en administreert afzonderlijk de in artikel
      64 bedoelde middelen tot dekking van de uitgaven en de uitgaven, bedoeld in artikel 65, in de vorm
      van een Arbeidsongeschiktheidsfonds jonggehandicapten dat deel uitmaakt van het Uitvoeringsinstituut
      werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel63
  - number: '64'
    text: |-
      In de middelen tot dekking van de uitgaven ten laste van het Arbeidsongeschiktheidsfonds jonggehandicapten wordt
      voorzien door:
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel64
  - number: 64.a
    text: het Rijk;
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel64
  - number: 64.b
    text: de bedragen, bedoeld in artikel 48;
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel64
  - number: 64.c
    text: de boeten, bedoeld in artikel 40;
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel64
  - number: 64.d
    text: |-
      de bedragen die het Uitvoeringsinstituut werknemersverzekeringen ontvangt met toepassing van verhaal als bedoeld in
      artikel 61.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel64
  - number: '65.1'
    text: 'Ten laste van het Arbeidsongeschiktheidsfonds jonggehandicapten komen:'
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel65
  - number: 65.1.a
    text: de op grond van deze wet te betalen uitkeringen;
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel65
  - number: 65.1.b
    text: |-
      de op grond van enige wet over de uitkeringen op grond van deze wet door het
      Uitvoeringsinstituut werknemersverzekeringen verschuldigde premies of vergoedingen als bedoeld in
      [artikel 46 van de Zorgverzekeringswet][ref1] die niet op deze uitkeringen in mindering kunnen worden gebracht;


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel46
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '46'
  - number: 65.1.c
    text: |-
      het op grond van [artikel 50, vierde lid][ref1], aan 's Rijks kas af te dragen bedrag;


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel50
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '50'
        hoofdstuk: '2'
        afdeling: '3'
  - number: 65.1.d
    text: |-
      het op grond van [artikel 2.8 van de Invoeringswet Wet werk en inkomen naar arbeidsvermogen][ref1] aan het
      Reïntegratiefonds af te dragen bedrag;


      [ref1]: https://wetten.overheid.nl/BWBR0019058#Artikel2
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0019058
        artikel: '2'
  - number: 65.1.e
    text: de aan de uitvoering van deze wet verbonden kosten;
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel65
  - number: 65.1.f
    text: |-
      de subsidies, bedoeld in [artikel 50a][ref1], en de kosten in verband met de uitvoering van [dat artikel][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel50a
      [ref2]: https://wetten.overheid.nl/BWBR0008657#Artikel50a
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: 50a
        hoofdstuk: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0008657
        artikel: 50a
        hoofdstuk: '2'
        afdeling: '3'
  - number: 65.1.g
    text: de reïntegratie-instrumenten op grond van deze wet;
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel65
  - number: 65.1.h
    text: |-
      de kosten verband houdende met de uitvoering van
      [artikel 30, eerste lid, onderdeel b, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1]
      ten aanzien van een betrokkene, indien deze ten tijde van het aanvangen van de werkzaamheden van het
      reïntegratiebedrijf, bedoeld in het [zesde lid van dat artikel][ref2], een uitkering ontvangt ten laste van het
      Arbeidsongeschiktheidsfonds jonggehandicapten;


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel30
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '30'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '30'
  - number: 65.1.i
    text: |-
      de tegemoetkomingen, bedoeld in [artikel 9a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel9a
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: 9a
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '1'
  - number: '65.2'
    text: Het Uitvoeringsinstituut werknemersverzekeringen kan nadere regels stellen omtrent het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel65
  - number: '66'
    text: |-
      [Artikel 120 van de Wet financiering sociale verzekeringen][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel120
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '120'
  - number: '68'
    text: |-
      Bij een besluit op grond van deze wet dat betrekking heeft op het al dan niet bestaan of voortbestaan dan wel de
      mate van arbeidsongeschiktheid is belanghebbende degene op wiens aanspraken het besluit betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel68
  - number: '69.1'
    text: |-
      Beschikkingen op grond van deze wet en de daarop berustende bepalingen worden gegeven binnen een redelijke termijn
      na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel69
  - number: '69.2'
    text: |-
      De redelijke termijn is in ieder geval verstreken wanneer binnen acht weken na ontvangst van de aanvraag geen
      beschikking is gegeven, noch een kennisgeving als bedoeld in het derde of vierde lid is gedaan.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel69
  - number: '69.3'
    text: |-
      Indien een beschikking niet binnen de termijn van acht weken kan worden gegeven, wordt die termijn met een
      redelijke termijn verlengd en wordt de aanvrager daarvan schriftelijk in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel69
  - number: '69.4'
    text: |-
      Indien in verband met het geven van een beschikking als bedoeld in het eerste lid informatie is gevraagd aan een
      persoon of instantie buiten Nederland en om die reden de beschikking niet binnen acht weken gegeven kan worden,
      wordt die termijn verlengd met ten hoogste zes maanden en wordt de aanvrager van deze verlenging schriftelijk in
      kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel69
  - number: 69b
    text: |-
      In afwijking van [artikel 7:3 van de Algemene wet bestuursrecht][ref1] kan van het horen van een belanghebbende
      worden afgezien indien de belanghebbende niet binnen een door het Uitvoeringsinstituut werknemersverzekeringen
      gestelde redelijke termijn, verklaart dat hij gebruik wil maken van het recht te worden gehoord.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel69b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '70.1'
    text: |-
      In afwijking van [artikel 7:10, eerste lid, van de Algemene wet bestuursrecht][ref1] beslist het
      Uitvoeringsinstituut werknemersverzekeringen binnen dertien weken na ontvangst van het bezwaarschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '70.2'
    text: |-
      Indien bezwaar wordt gemaakt tegen een besluit waaraan een medische of arbeidskundige beoordeling ten grondslag
      ligt, beslist het Uitvoeringsinstituut werknemersverzekeringen binnen zeventien weken of, indien het advies vraagt
      aan een deskundige die niet onder zijn verantwoordelijkheid werkzaam is binnen een en twintig weken, na ontvangst
      van het bezwaarschrift.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel70
  - number: '71'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van de behandeling van bezwaarschriften
      tegen besluiten, waaraan een medische of arbeidskundige beoordeling ten grondslag ligt.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel71
  - number: '72.1'
    text: |-
      Tegen uitspraken van de Centrale Raad van Beroep kan ieder der partijen beroep in cassatie instellen ter zake van
      schending of verkeerde toepassing van de artikelen 1, derde tot en met zevende lid, en 3 en de op die artikelen
      berustende bepalingen.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel72
  - number: '72.2'
    text: |-
      Op dit beroep zijn de voorschriften betreffende het beroep in cassatie tegen uitspraken van de gerechtshoven inzake
      beroepen in belastingzaken van overeenkomstige toepassing, waarbij de Centrale Raad van Beroep de plaats inneemt
      van een gerechtshof.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel72
  - number: 72a
    text: |-
      [Titel 4.2 van de Algemene wet bestuursrecht][ref1] is niet van toepassing op aanspraken op grond van
      [artikel 59b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0008657#Artikel59b
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel72a
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0008657
        artikel: 59b
        hoofdstuk: 2A
  - number: '73'
    text: |-
      Overtreding van bepalingen van een krachtens deze wet uitgevaardigde algemene maatregel van bestuur voor zover
      uitdrukkelijk als strafbaar feit in de zin van dit artikel aangeduid, wordt gestraft met een hechtenis van ten
      hoogste een maand of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel73
  - number: '74'
    text: |-
      Het recht tot strafvordering vervalt indien het Uitvoeringsinstituut werknemersverzekeringen aan de
      jonggehandicapte of zijn wettelijke vertegenwoordiger ter zake van hetzelfde feit reeds een boete heeft opgelegd.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel74
  - number: '75'
    text: |-
      De in [artikel 73][ref1] bedoelde strafbare feiten worden als overtredingen beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel73
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '73'
        hoofdstuk: '8'
  - number: 76a
    text: |-
      Arbeidsongeschiktheidsuitkeringen die zijn toegekend voor de inwerkingtreding van de Wet wijziging systematiek
      herbeoordelingen arbeidsongeschiktheidswetten worden geacht te zijn toegekend voor onbepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel76a
  - number: 76b.1
    text: |-
      Een beschikking tot vermindering van de aanspraak op een geldelijke beloning voor de verrichte
      arbeid op grond van [artikel 7 van de Wet op de (re)integratie arbeidsgehandicapten][ref1], aan
      de jonggehandicapte die op de dag voorafgaand aan de dag waarop [dat artikel][ref2] op grond van
      [artikel 2.10 van de Wet Invoering en financiering Wet werk en inkomen naar arbeidsvermogen][ref3], vervalt,
      de leeftijd van 18 jaar nog niet had bereikt dan wel recht had op een arbeidsongeschiktheidsuitkering
      op grond van deze wet wordt voor de duur van het tijdvak waarvoor die aanspraak op grond van de
      [Wet op de (re)integratie arbeidsgehandicapten][ref4] is verminderd aangemerkt als een beschikking tot vermindering
      van de aanspraak op een geldelijke beloning voor de verrichte arbeid als bedoeld in [artikel 59a][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0019058#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0009565
      [ref5]: https://wetten.overheid.nl/BWBR0008657#Artikel59a
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel76b
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0009565
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0019058
        artikel: '2'
      - id: ref4
