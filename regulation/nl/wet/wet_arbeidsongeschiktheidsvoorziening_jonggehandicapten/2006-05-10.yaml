  - number: '15.3'
    text: |-
      Dit artikel vindt geen toepassing, indien recht bestaat op herziening van de arbeidsongeschiktheidsuitkering op
      grond van artikel 13 of 14, eerste lid, onderdelen *a* tot en met *c*.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel15
  - number: '15.4'
    text: |-
      Perioden van wonen buiten Nederland, waarin de arbeidsongeschiktheid is toegenomen worden mede in aanmerking
      genomen voor het bepalen van het tijdvak van vier weken, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel15
  - number: '16.1'
    text: |-
      Onverminderd hetgeen overigens in deze wet is bepaald ter zake van herziening of intrekking van een beschikking
      tot toekenning van arbeidsongeschiktheidsuitkering, alsook ter zake van een weigering van een zodanige uitkering,
      herziet het Uitvoeringsinstituut werknemersverzekeringen een dergelijke beschikking of trekt het deze in:
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel16
  - number: 16.1.a
    text: |-
      ter uitvoering van een beslissing als bedoeld in [artikel 10][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel10
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '1'
  - number: 16.1.b
    text: |-
      indien het niet of niet behoorlijk nakomen van een verplichting op grond van [artikel 37][ref1], [38][ref2] of
      [62][ref3] heeft geleid tot het ten onrechte of tot een te hoog bedrag verlenen van een uitkering;


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0008657#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0008657#Artikel62
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '37'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0008657
        artikel: '38'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0008657
        artikel: '62'
        hoofdstuk: '4'
  - number: 16.1.c
    text: indien anderszins de uitkering ten onrechte of tot een te hoog bedrag is verleend;
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel16
  - number: 16.1.d
    text: |-
      indien het niet of niet behoorlijk nakomen van een verplichting op grond van [artikel 37][ref1], [38][ref2] of
      [62][ref3] ertoe leidt dat niet kan worden vastgesteld of nog recht op uitkering bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0008657#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0008657#Artikel62
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '37'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0008657
        artikel: '38'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0008657
        artikel: '62'
        hoofdstuk: '4'
  - number: '16.2'
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kan het Uitvoeringsinstituut werknemersverzekeringen besluiten
      geheel of gedeeltelijk van herziening of intrekking als bedoeld in het eerste lid af te zien.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel16
  - number: '16.3'
    text: |-
      Een besluit tot toekenning van een voorziening als bedoeld in [artikel 59b][ref1], een besluit tot toekenning van
      loonsuppletie als bedoeld in [artikel 59f][ref2] en van inkomenssuppletie als bedoeld in [artikel 59g][ref3] wordt
      ingetrokken of herzien indien die voorzieningen ten onrechte of tot een te hoog bedrag zijn vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel59b
      [ref2]: https://wetten.overheid.nl/BWBR0008657#Artikel59f
      [ref3]: https://wetten.overheid.nl/BWBR0008657#Artikel59g
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: 59b
        hoofdstuk: 2A
      - id: ref2
        bwb_id: BWBR0008657
        artikel: 59f
        hoofdstuk: 2A
      - id: ref3
        bwb_id: BWBR0008657
        artikel: 59g
        hoofdstuk: 2A
  - number: '17.1'
    text: 'Het recht op arbeidsongeschiktheidsuitkering eindigt:'
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel17
  - number: 17.1.a
    text: met ingang van de eerste dag van de maand, waarin de jonggehandicapte de leeftijd van 65 jaar bereikt;
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel17
  - number: 17.1.b
    text: |-
      wanneer de arbeidsongeschiktheid is geëindigd, of beneden 25% is gedaald, met ingang van de dag, aangegeven in de
      daartoe strekkende beschikking van het Uitvoeringsinstituut werknemersverzekeringen;
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel17
  - number: 17.1.c
    text: met ingang van de eerste dag van de maand volgend op die waarin de jonggehandicapte buiten Nederland is gaan wonen.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel17
  - number: '17.2'
    text: |-
      De arbeidsongeschiktheidsuitkering van de jonggehandicapte die deelneemt aan een voor hem gewenste opleiding of
      scholing, wordt gedurende deze opleiding of scholing niet ingetrokken in verband met een daaruit voortvloeiende
      afneming van de arbeidsongeschiktheid. Indien de jonggehandicapte tijdens de opleiding of scholing inkomsten uit
      arbeid verwerft, is [artikel 50, eerste lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel50
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '50'
        hoofdstuk: '2'
        afdeling: '3'
  - number: '17.3'
    text: |-
      Indien de intrekking van de arbeidsongeschiktheidsuitkering verband houdt met een voltooide scholing of
      opleiding, gaat deze intrekking niet eerder in dan een jaar na voltooiing van die scholing of opleiding. Indien de
      jonggehandicapte eerder inkomsten uit arbeid verwerft, is [artikel 50, eerste lid][ref1], tot uiterlijk het einde
      van dat jaar van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel50
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '50'
        hoofdstuk: '2'
        afdeling: '3'
  - number: '17.4'
    text: |-
      Het eerste lid, onderdeel c, is tevens van toepassing op de jonggehandicapte die buiten Nederland is gaan wonen en
      op wie [artikel 3, derde lid][ref1], van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel3
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '3'
        hoofdstuk: '1'
  - number: '17.5'
    text: |-
      Het recht op arbeidsongeschiktheidsuitkering eindigt, indien de jonggehandicapte rechtens zijn vrijheid is
      ontnomen, vanaf de dag dat deze vrijheidsontneming één maand heeft geduurd.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel17
  - number: '17.6'
    text: |-
      Voor de toepassing van het vierde lid worden perioden van vrijheidsontneming samengeteld, indien zij elkaar met een
      onderbreking van minder dan vier weken opvolgen.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel17
  - number: '17.7'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan het eerste lid, onderdeel c, buiten toepassing
      laten of daarvan afwijken voorzover toepassing, gelet op het belang van het eindigen van het recht op
      arbeidsongeschiktheidsuitkering indien de jonggehandicapte buiten Nederland gaat wonen, zal leiden tot een
      onbillijkheid van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel17
  - number: '18'
    text: |-
      Indien het recht op uitkering op grond van artikel 17, eerste lid, onderdeel c, is geëindigd en de jonggehandicapte
      vervolgens weer in Nederland woont, herleeft het recht op uitkering met ingang van de eerste dag van de maand
      volgend op die waarin hij weer in Nederland is gaan wonen.
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel18
  - number: '19.1'
    text: 'Indien de jonggehandicapte:'
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel19
  - number: 19.1.a
    text: |-
      wiens arbeidsongeschiktheidsuitkering wegens afneming van arbeidsongeschiktheid op grond van
      [artikel 17, eerste lid, onderdeel b][ref1], is ingetrokken; of


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel17
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '1'
  - number: 19.1.b
    text: |-
      die aan het einde van de wachttijd, bedoeld in [artikel 6, eerste lid][ref1], ongeschikt is tot het verrichten
      van zijn arbeid wegens ziekte, gebreken, zwangerschap of bevalling, maar geen recht had op toekenning van
      arbeidsongeschiktheidsuitkering omdat hij niet arbeidsongeschikt was; binnen vijf jaar na de datum van
      die intrekking dan wel binnen vijf jaar na het bereiken van die wachttijd arbeidsongeschikt wordt en deze
      arbeidsongeschiktheid voortkomt uit dezelfde oorzaak als die waaruit de arbeidsongeschiktheid ter zake
      waarvan de ingetrokken uitkering werd genoten dan wel als die op grond waarvan hij ongeschikt was tot het
      verrichten van zijn arbeid wegens ziekte, gebreken, zwangerschap of bevalling voortkomt, vindt toekenning van
      arbeidsongeschiktheidsuitkering steeds plaats, zodra die arbeidsongeschiktheid onafgebroken vier weken heeft
      geduurd.


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel6
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '1'
  - number: '19.2'
    text: |-
      Voor het bepalen van het tijdvak van vier weken, bedoeld in het eerste lid, worden perioden van
      arbeidsongeschiktheid samengeteld, indien zij elkaar met een onderbreking van minder dan vier weken
      opvolgen of indien zij direct voorafgaan aan en aansluiten op een periode waarin uitkering in verband met
      zwangerschap of bevalling op grond van [artikel 3:7, eerste lid][ref1], [3:8][ref2], [3:10, eerste lid][ref3],
      [3:18][ref4] of [3:30, eerste lid, van de Wet arbeid en zorg][ref5] wordt genoten, tenzij de ongeschiktheid
      redelijkerwijs niet geacht kan worden voort te vloeien uit dezelfde oorzaak. Bij de vaststelling van de
      eerstgenoemde periode van vier weken blijven perioden, waarin uitkering in verband met zwangerschap of
      bevalling op grond van [artikel 3:7, eerste lid][ref6], [3:8][ref7], [3:10, eerste lid][ref8], [3:18][ref9]
      of [3:30, eerste lid, van de Wet arbeid en zorg][ref10] wordt genoten, buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref6]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref7]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref8]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref9]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref10]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0008657/2006-05-10#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref2
