preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is in verband met de intrekking van de Algemene
    Arbeidsongeschiktheidswet een regeling te treffen met betrekking tot een arbeidsongeschiktheidsvoorziening voor
    jonggehandicapten;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel1
  - number: 1.1.a
    text: 'Onze Minister: de Minister van Sociale Zaken en Werkgelegenheid;'
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel1
  - number: 1.1.b
    text: |-
      Uitvoeringsinstituut werknemersverzekeringen: het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '5'
  - number: 1.1.c
    text: |-
      Arbeidsongeschiktheidsfonds jonggehandicapten: het arbeidsongeschiktheidsfonds jonggehandicapten, bedoeld in
      artikel 63;
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel1
  - number: 1.1.d
    text: 'jonggehandicapte: de natuurlijke persoon, bedoeld in artikel 5;'
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel1
  - number: 1.1.e
    text: 'arbeidsongeschiktheidsuitkering: een arbeidsongeschiktheidsuitkering op grond van deze wet;'
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel1
  - number: 1.1.f
    text: |-
      vreemdeling: hetgeen daaronder wordt verstaan in de [Vreemdelingenwet 2000][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011823
  - number: 1.1.g
    text: |-
      rechtens zijn vrijheid is ontnomen: rechtens zijn vrijheid is ontnomen, behoudens de
      gevallen, bedoeld in de [Wet bijzondere opnemingen in psychiatrische ziekenhuizen][ref1] en in
      [artikel 37, eerste lid, van het Wetboek van Strafrecht][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005700
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel37
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005700
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '37'
  - number: 1.1.h
    text: |-
      justitiële inrichting: een penitentiaire inrichting, een inrichting voor verpleging van ter beschikking
      gestelden, of een inrichting voor justitiële jeugdbescherming zijnde een landelijke voorziening als bedoeld in
      [artikel 65 van de Wet op de jeugdhulpverlening][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel65
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: '65'
  - number: '1.2'
    text: 'In deze wet en de daarop berustende bepalingen wordt gelijkgesteld met:'
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel1
  - number: 1.2.a
    text: 'echtgenoot: geregistreerde partner;'
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel1
  - number: 1.2.b
    text: 'echtgenoten: geregistreerde partners;'
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel1
  - number: 1.2.c
    text: 'gehuwd: als partner geregistreerd.'
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel1
  - number: '1.3'
    text: 'In deze wet en de daarop berustende bepalingen wordt:'
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel1
  - number: 1.3.a
    text: |-
      als gehuwd of als echtgenoot mede aangemerkt de ongehuwde meerderjarige die met een andere ongehuwde meerderjarige
      een gezamenlijke huishouding voert, tenzij het betreft een bloedverwant in de eerste graad;
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel1
  - number: 1.3.b
    text: als ongehuwd mede aangemerkt degene die duurzaam gescheiden leeft van de persoon met wie hij gehuwd is.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel1
  - number: '1.4'
    text: |-
      Van een gezamenlijke huishouding is sprake indien twee personen hun hoofdverblijf in dezelfde woning hebben en zij
      blijk geven zorg te dragen voor elkaar door middel van het leveren van een bijdrage in de kosten van de huishouding
      dan wel anderszins.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel1
  - number: '1.5'
    text: |-
      Een gezamenlijke huishouding wordt in ieder geval aanwezig geacht indien de betrokkenen hun hoofdverblijf hebben in
      dezelfde woning en:
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel1
  - number: 1.5.a
    text: zij met elkaar gehuwd zijn geweest of eerder voor de toepassing van deze wet daarmee gelijk zijn gesteld;
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel1
  - number: 1.5.b
    text: uit hun relatie een kind is geboren of erkenning heeft plaatsgevonden van een kind van de een door de ander;
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel1
  - number: 1.5.c
    text: |-
      zij zich wederzijds verplicht hebben tot een bijdrage aan de huishouding krachtens een geldend
      samenlevingscontract; of
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel1
  - number: 1.5.d
    text: |-
      zij op grond van een registratie worden aangemerkt als een gezamenlijke huishouding die naar aard en strekking
      overeenkomt met de gezamenlijke huishouding, bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel1
  - number: '1.6'
    text: |-
      Bij algemene maatregel van bestuur wordt vastgesteld welke registraties, en gedurende welk tijdvak, in aanmerking
      worden genomen voor de toepassing van het vijfde lid, onderdeel d.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel1
  - number: '1.7'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van hetgeen wordt verstaan onder het
      blijk geven zorg te dragen voor een ander, zoals bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel1
  - number: '2.1'
    text: |-
      Arbeidsongeschikt, geheel of gedeeltelijk, is de persoon die als rechtstreeks en objectief medisch vast te stellen
      gevolg van ziekte, gebreken, zwangerschap of bevalling geheel of gedeeltelijk niet in staat is om met arbeid te
      verdienen, hetgeen gezonde personen, met soortgelijke opleiding en ervaring, ter plaatse waar hij woont of in de
      omgeving daarvan met arbeid gewoonlijk verdienen.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel2
  - number: '2.2'
    text: |-
      De persoon die op de dag dat hij ingezetene wordt gedeeltelijk arbeidsongeschikt is in de zin van het eerste lid,
      wordt voor wat de door hem aan deze wet te ontlenen aanspraken betreft als geheel of gedeeltelijk arbeidsongeschikt
      aangemerkt, indien hij als rechtstreeks en objectief medisch vast te stellen gevolg van ziekte, gebreken,
      zwangerschap of bevalling geheel of gedeeltelijk niet in staat is om met arbeid te verdienen, hetgeen soortgelijke
      personen, die in dezelfde mate arbeidsongeschikt zijn in de zin van het eerste lid, ter plaatse waar hij woont of
      in de omgeving daarvan, met arbeid gewoonlijk verdienen.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel2
  - number: '2.3'
    text: |-
      Indien de op de in het tweede lid bedoelde dag aanwezige arbeidsongeschiktheid in de zin van het eerste lid
      naderhand is afgenomen vindt het tweede lid vervolgens overeenkomstige toepassing, met dien verstande dat voor de
      dag waarop de betrokkene ingezetene wordt in de plaats treedt het tijdstip waarop de arbeidsongeschiktheid in de
      zin van het eerste lid is afgenomen.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel2
  - number: '2.4'
    text: |-
      Het tweede en derde lid vinden geen toepassing indien de betrokkene op het moment dat hij ingezetene werd jonger
      was dan 17 jaar en hij gedurende de zes jaren onmiddellijk voorafgaande aan de dag waarop hij 17 jaar wordt
      ingezetene is geweest.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel2
  - number: '2.5'
    text: |-
      Onder de in het eerste en tweede lid eerstgenoemde arbeid wordt verstaan alle algemeen geaccepteerde arbeid waartoe
      de betrokkene met zijn krachten en bekwaamheden in staat is.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel2
  - number: '2.6'
    text: |-
      Bij de vaststelling van de mate van arbeidsongeschiktheid wordt buiten beschouwing gelaten of de betrokkene de
      arbeid feitelijk kan verkrijgen.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel2
  - number: '2.7'
    text: |-
      Bij de toepassing van dit artikel wordt buiten beschouwing gelaten, hetgeen wordt of kan worden ontvangen voor
      arbeid verricht bij wijze van sociale werkvoorziening.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel2
  - number: '2.8'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen met betrekking tot het eerste tot en met zevende lid nadere
      en zonodig afwijkende regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel2
  - number: '2.9'
    text: 'Van een ontwerp van een besluit tot vaststelling, wijziging of intrekking van:'
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel2
  - number: 2.9.a
    text: een algemene maatregel van bestuur als bedoeld in het achtste lid;
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel2
  - number: 2.9.b
    text: |-
      een krachtens de in onderdeel a bedoelde algemene maatregel van bestuur getroffen ministeriële regeling, wordt
      mededeling gedaan in de Staatscourant. Een voordracht tot vaststelling, wijziging of intrekking van een algemene
      maatregel van bestuur als bedoeld in onderdeel a, wordt niet gedaan en de vaststelling, wijziging of intrekking
      van een regeling als bedoeld in onderdeel b, geschiedt niet eerder dan nadat acht weken na die mededeling zijn
      verstreken.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel2
  - number: '2.10'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent een afwijkende
      wijze van vaststelling van de mate van arbeidsongeschiktheid in gevallen waarin recht bestaat op een
      arbeidsongeschiktheidsuitkering en een arbeidsongeschiktheidsuitkering op grond van een andere wettelijke regeling
      ter verzekering tegen geldelijke gevolgen van langdurige arbeidsongeschiktheid.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel2
  - number: '3.1'
    text: |-
      Ingezetene in de zin van deze wet en de daarop berustende bepalingen is de natuurlijke persoon, die in Nederland
      woont.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel3
  - number: '3.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan, in afwijking van het eerste lid, uitbreiding dan wel beperking
      worden gegeven aan het begrip «ingezetene».
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel3
  - number: '3.3'
    text: |-
      Voor de persoon die op grond van het tweede lid als ingezetene wordt aangemerkt, doch buiten Nederland woont,
      gelden de bepalingen van deze wet, met inachtneming van de specifieke regels die in deze wet ten aanzien van deze
      persoon zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel3
  - number: '4.1'
    text: Waar een natuurlijk persoon woont wordt naar de omstandigheden beoordeeld.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel4
  - number: '4.2'
    text: |-
      De persoon die Nederland metterwoon heeft verlaten en binnen een jaar nadien metterwoon terugkeert zonder inmiddels
      in de Nederlandse Antillen, Aruba of op het grondgebied van een andere Mogendheid te hebben gewoond, wordt ook voor
      de duur van zijn afwezigheid geacht in Nederland te hebben gewoond.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel4
  - number: '5.1'
    text: 'Jonggehandicapte is de ingezetene die:'
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel5
  - number: 5.1.a
    text: op de dag waarop hij 17 jaar wordt, arbeidsongeschikt is;
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel5
  - number: 5.1.b
    text: |-
      na de in onderdeel *a* bedoelde dag arbeidsongeschikt wordt en in het jaar, onmiddellijk voorafgaande aan de dag,
      waarop de arbeidsongeschiktheid is ingetreden, gedurende ten minste zes maanden studerende was.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel5
  - number: '5.2'
    text: 'Als studerende wordt aangemerkt de persoon:'
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel5
  - number: 5.2.a
    text: |-
      die studiefinanciering ontvangt op grond van de [Wet studiefinanciering 2000][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011453
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011453
  - number: 5.2.b
    text: |-
      die een financiële voorziening ontvangt als bedoeld in
      [artikel 7.51, eerste lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 5.2.c
    text: |-
      die een tegemoetkoming in de onderwijsbijdrage en de schoolkosten ontvangt op grond van
      [hoofdstuk 4 van de Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0012438
        hoofdstuk: '4'
  - number: 5.2.d
    text: |-
      voor wie de verzekerde in de zin van de [Algemene Kinderbijslagwet][ref1] kinderbijslag ontvangt op grond van
      artikel 7, tweede lid, onderdeel *a*, van die wet;


      [ref1]: https://wetten.overheid.nl/BWBR0002368
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002368
  - number: 5.2.e
    text: |-
      die, hoewel hij niet op grond van de onderdelen *a* tot en met *d* als studerende wordt aangemerkt, niettemin in
      verband met onderwijs of een beroepsopleiding lessen of stages volgt gedurende gemiddeld ten minste 213 klokuren
      per kwartaal, voor zolang hij de leeftijd van 30 jaar nog niet heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel5
  - number: '5.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen ook andere dan de in het tweede lid bedoelde personen als studerende
      worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel5
  - number: '5.4'
    text: |-
      Bij ministeriële regeling kunnen nadere en zonodig afwijkende regels worden gesteld met betrekking tot het tweede
      lid, onderdeel *e*.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel5
  - number: '6.1'
    text: |-
      De jonggehandicapte heeft recht op toekenning van arbeidsongeschiktheidsuitkering zodra hij onafgebroken 52 weken,
      onmiddellijk volgend op de in artikel 5, eerste lid, onderdeel *a* of *b* bedoelde dag, arbeidsongeschikt is
      geweest, indien hij na afloop van dat tijdvak nog arbeidsongeschikt is.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel6
  - number: '6.2'
    text: |-
      Voor het bepalen van het tijdvak van 52 weken, bedoeld in het eerste lid, worden perioden van arbeidsongeschiktheid
      samengeteld, indien zij elkaar met een onderbreking van minder dan vier weken opvolgen. Bij de vaststelling
      van de periode van vier weken blijven perioden, waarin uitkering in verband met zwangerschap of bevalling op
      grond van [artikel 3:7, eerste lid][ref1], [3:8][ref2], [3:10, eerste lid][ref3], [3:18, eerste lid][ref4],
      of [3:19 van de Wet arbeid en zorg][ref5] wordt genoten, buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '6.3'
    text: |-
      Recht op toekenning van arbeidsongeschiktheidsuitkering heeft eveneens de jonggehandicapte die na afloop van het in
      het eerste lid bedoelde tijdvak van 52 weken niet arbeidsongeschikt is, doch ten aanzien van wie dit wel het geval
      is binnen vier weken na afloop van dat tijdvak.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel6
  - number: '6.4'
    text: |-
      Voor het bepalen van het tijdvak van 52 weken, bedoeld in het eerste lid, worden steeds in aanmerking
      genomen tijdvakken, gedurende welke de jonggehandicapte recht zou hebben gehad op ziekengeld op grond van de
      [Ziektewet][ref1], indien hij op grond van die wet zou zijn verzekerd.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: '6.5'
    text: |-
      Voor de toepassing van het eerste tot en met derde lid wordt niet als arbeidsongeschikt beschouwd degene die minder
      dan 25% arbeidsongeschikt is alsmede de verzekerde die een uitkering geniet als bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel6
  - number: '6.6'
    text: |-
      Toekenning van arbeidsongeschiktheidsuitkering vindt niet plaats met ingang van een dag, gelegen vóór die, waarop
      betrokkene de leeftijd van 18 jaar bereikt.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel6
  - number: '6.7'
    text: |-
      Toekenning ten aanzien van de in artikel 3, derde lid, bedoelde persoon, vindt niet eerder plaats dan met ingang
      van de dag dat hij in Nederland woont.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel6
  - number: 6a.1
    text: |-
      Geen recht op arbeidsongeschiktheidsuitkering heeft de vreemdeling die niet rechtmatig verblijf houdt in de zin van
      [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 6a.2
    text: |-
      Bij algemene maatregel van bestuur kan worden afgeweken van het eerste lid ten
      aanzien van vreemdelingen die, na rechtmatig verblijf te hebben gehouden in de zin van
      [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref1], rechtmatig in Nederland verblijf hebben
      als bedoeld in [artikel 8, onder g of h, van de Vreemdelingenwet 2000][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 6b.1
    text: |-
      De jonggehandicapte, bedoeld in artikel 6, heeft geen recht op arbeidsongeschiktheidsuitkering indien de dag waarop
      het recht op arbeidsongeschiktheidsuitkering zou ingaan, is gelegen in een periode dat hem rechtens zijn vrijheid
      is ontnomen.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel6b
  - number: 6b.2
    text: |-
      De jonggehandicapte, die op grond van het eerste lid geen recht op arbeidsongeschiktheidsuitkering heeft,
      heeft vanaf de dag dat hij in vrijheid wordt gesteld met inachtneming van de bepalingen van deze wet recht
      op arbeidsongeschiktheidsuitkering, indien hij op die dag arbeidsongeschikt is. Artikel 6, vijfde lid, is van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel6b
  - number: 6b.3
    text: |-
      Voor de toepassing van het eerste lid worden perioden van vrijheidsontneming samengeteld, indien zij elkaar met een
      onderbreking van minder dan vier weken opvolgen.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel6b
  - number: 6b.4
    text: |-
      Met inachtneming van de bepalingen van deze wet heeft eveneens recht op arbeidsongeschiktheidsuitkering de
      jonggehandicapte, bedoeld in het tweede lid, die op de in dat lid bedoelde dag niet arbeidsongeschikt is, doch ten
      aanzien van wie dit wel het geval is binnen vier weken na die dag. Artikel 6, vijfde lid, is van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel6b
  - number: 6b.5
    text: |-
      Het eerste lid is niet van toepassing en het tweede lid en vierde lid zijn van overeenkomstige toepassing op bij
      algemene maatregel van bestuur aan te wijzen categorieën personen waarbij tenuitvoerlegging van een vrijheidsstraf
      of vrijheidsbenemende maatregel buiten een justitiële inrichting plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel6b
  - number: '7.1'
    text: De arbeidsongeschiktheidsuitkering wordt berekend naar de grondslag van het minimumloon.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel7
  - number: '7.2'
    text: |-
      Onder het in het eerste lid bedoelde minimumloon wordt verstaan het minimumloon per maand, bedoeld in
      [artikel 8, eerste lid, onderdeel ][ref1], gedeeld door 21,75, of, indien het een persoon jonger dan 23 jaar
      betreft, het minimumloon per maand dat voor zijn leeftijd geldt op grond van artikel 7, derde lid, en artikel 8,
      derde lid, van genoemde wet, gedeeld door 21,75.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
  - number: '7.3'
    text: |-
      Op een beschikking als gevolg van een herziening van de grondslag op grond van dit artikel zijn de
      [artikelen 3:41][ref1] en [3:45 van de Algemene wet bestuursrecht][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '8.1'
    text: |-
      De arbeidsongeschiktheidsuitkering bedraagt per dag, de zaterdagen en zondagen niet meegerekend, bij een
      arbeidsongeschiktheid van:






                    25-35%:


                    21% van de grondslag;




                    35-45%:


                    28% van de grondslag;




                    45-55%:


                    35% van de grondslag;




                    55-65%:


                    42% van de grondslag;




                    65-80%:


                    50,75% van de grondslag;




                    80% of meer:


                    70% van de grondslag.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel8
  - number: '8.2'
    text: |-
      Bij de vaststelling van de mate van arbeidsongeschiktheid wordt, zoveel doenlijk, rekening gehouden met verkregen
      nieuwe bekwaamheden.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel8
  - number: '9'
    text: |-
      Een arbeidsongeschiktheidsuitkering, berekend naar een arbeidsongeschiktheid van 80% of meer, wordt, indien de
      jonggehandicapte verkeert in een althans voorlopig blijvende toestand van hulpbehoevendheid, die geregeld oppassing
      en verzorging nodig maakt, voor de duur van die hulpbehoevendheid tot ten hoogste zijn grondslag verhoogd. De
      eerste zin vindt geen toepassing, indien de jonggehandicapte in een inrichting is opgenomen en de kosten van
      verblijf ten laste van een verzekering inzake ziektekosten komen.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel9
  - number: '10.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan met betrekking tot uit deze wet voortvloeiende aanspraken
      geheel of ten dele, tijdelijk of blijvend, buiten aanmerking laten:
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel10
  - number: 10.1.a
    text: gehele arbeidsongeschiktheid die bestond op de dag dat een persoon ingezetene werd;
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel10
  - number: 10.1.b
    text: |-
      arbeidsongeschiktheid, die is ingetreden binnen een half jaar na het tijdstip waarop een persoon ingezetene werd,
      terwijl de gezondheidstoestand van die persoon op dat tijdstip het intreden van de arbeidsongeschiktheid binnen een
      half jaar kennelijk moest doen verwachten;
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel10
  - number: 10.1.c
    text: |-
      arbeidsongeschiktheid die bestond op de eerste dag dat een persoon studerende was als bedoeld in artikel 5, tweede
      lid;
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel10
  - number: 10.1.d
    text: |-
      arbeidsongeschiktheid, die is ingetreden binnen een half jaar na het tijdstip waarop een persoon studerende werd,
      terwijl de gezondheidstoestand van die persoon op dat tijdstip het intreden van de arbeidsongeschiktheid binnen een
      half jaar kennelijk moest doen verwachten.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel10
  - number: '10.2'
    text: |-
      De in het eerste lid, onderdeel b en d, bedoelde bevoegdheid strekt zich mede uit tot de toeneming van
      de arbeidsongeschiktheid, voorzover deze toeneming kennelijk is voortgekomen uit dezelfde oorzaak als de
      arbeidsongeschiktheid die binnen een half jaar na aanvang van het ingezetenschap danwel na aanvang van de studie
      is ingetreden.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel10
  - number: '10.3'
    text: |-
      Het eerste en tweede lid blijven buiten toepassing ten aanzien van de jonggehandicapte indien hij op de dag dat hij
      ingezetene werd jonger was dan 17 jaar en hij gedurende de zes jaren onmiddellijk voorafgaande aan de dag waarop
      hij 17 jaar wordt ingezetene is geweest.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel10
  - number: '10.4'
    text: |-
      Zolang het Uitvoeringsinstituut werknemersverzekeringen op grond van het eerste of tweede lid arbeidsongeschiktheid
      buiten aanmerking laat, vindt artikel 2, tweede lid, overeenkomstige toepassing met betrekking tot de
      door de jonggehandicapte aan deze wet nog te ontlenen aanspraken, met dien verstande, dat voor de in het
      eerste lid bedoelde dag of tijdstip in de plaats treedt de dag met ingang waarvan het Uitvoeringsinstituut
      werknemersverzekeringen arbeidsongeschiktheid buiten aanmerking laat.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel10
  - number: '11.1'
    text: |-
      De arbeidsongeschiktheidsuitkering wordt herzien wanneer de jonggehandicapte, aan wie zij is toegekend, op grond
      van deze wet voor een hogere of lagere uitkering in aanmerking komt.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel11
  - number: '11.2'
    text: |-
      Onverminderd hetgeen overigens in deze wet is bepaald ter zake van herziening of intrekking van de
      arbeidsongeschiktheidsuitkering, beziet het Uitvoeringsinstituut werknemersverzekeringen binnen een jaar na ingang
      van de arbeidsongeschiktheidsuitkering, niet zijnde een voortzetting als bedoeld in [artikel 28, vierde lid][ref1],
      of er gronden aanwezig zijn voor herziening of intrekking van de arbeidsongeschiktheidsuitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel28
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '28'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
  - number: '11.3'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan, onder goedkeuring van Onze Minister, ten aanzien van bepaalde
      groepen arbeidsongeschikten bepalen dat geen tijdvak geldt dan wel een tijdvak zal gelden, dat afwijkt van het in
      het tweede lid genoemde tijdvak.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel11
  - number: '11.4'
    text: |-
      Ter zake van toeneming van de arbeidsongeschiktheid vindt herziening van de arbeidsongeschiktheidsuitkering plaats
      met inachtneming van de [artikelen 12 tot en met 15][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel12
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '1'
  - number: '11.5'
    text: |-
      De arbeidsongeschiktheidsuitkering van de jonggehandicapte die deelneemt aan een voor hem gewenste opleiding
      of scholing, wordt gedurende deze opleiding of scholing niet herzien in verband met een daaruit voortvloeiende
      afneming van de arbeidsongeschiktheid. Indien de jonggehandicapte tijdens de opleiding of scholing inkomsten uit
      arbeid verwerft, is [artikel 50, eerste lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel50
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '50'
        hoofdstuk: '2'
        afdeling: '3'
  - number: '12.1'
    text: |-
      Ter zake van toeneming van de arbeidsongeschiktheid vindt herziening van een arbeidsongeschiktheidsuitkering,
      berekend naar een arbeidsongeschiktheid van minder dan 45%, onverminderd de artikelen 14 en 15, plaats zodra de
      toegenomen arbeidsongeschiktheid onafgebroken 52 weken heeft geduurd.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel12
  - number: '12.2'
    text: |-
      De in het eerste lid bedoelde herziening vindt niet plaats, indien de toeneming kennelijk is voortgekomen uit een
      andere oorzaak dan die waaruit de ongeschiktheid ter zake waarvan uitkering wordt genoten, is voortgekomen.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel12
  - number: '12.3'
    text: |-
      Het tweede lid is niet van toepassing op de persoon die in het jaar onmiddellijk voorafgaande aan de dag van het
      intreden van de toeneming van de arbeidsongeschiktheid zes of meer maanden studerende was als bedoeld in artikel 5,
      eerste lid, onderdeel b.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel12
  - number: '12.4'
    text: |-
      Voor het bepalen van het tijdvak van 52 weken, bedoeld in het eerste lid, worden perioden van arbeidsongeschiktheid
      samengeteld, indien zij elkaar met een onderbreking van minder dan vier weken opvolgen. Bij de vaststelling van
      zowel het tijdvak van 52 weken als de periode van vier weken blijven perioden, waarin uitkering in verband met
      zwangerschap of bevalling op grond van [artikel 3:7, eerste lid][ref1], [3:8][ref2], [3:10, eerste lid][ref3],
      [3:18, eerste lid][ref4], of [3:19 van de Wet arbeid en zorg][ref5] wordt genoten, buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '12.5'
    text: |-
      Perioden van wonen buiten Nederland waarin de arbeidsongeschiktheid is toegenomen worden mede in aanmerking genomen
      voor het bepalen van het tijdvak van 52 weken, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel12
  - number: '13.1'
    text: |-
      Ter zake van toeneming van de arbeidsongeschiktheid vindt herziening van een arbeidsongeschiktheidsuitkering,
      berekend naar een arbeidsongeschiktheid van ten minste 45%, onverminderd artikel 14, plaats zodra de toegenomen
      arbeidsongeschiktheid onafgebroken vier weken heeft geduurd.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel13
  - number: '13.2'
    text: |-
      Indien de arbeidsongeschiktheidsuitkering, berekend naar een arbeidsongeschiktheid van ten minste 45%, doch minder
      dan 80%, wegens afneming van de arbeidsongeschiktheid is herzien naar een arbeidsongeschiktheid van minder dan
      45%, doch binnen vier weken na de dag, met ingang waarvan die uitkering is herzien, de arbeidsongeschiktheid weer
      toeneemt, is het eerste lid van toepassing, onder afwijking van artikel 12.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel13
  - number: '13.3'
    text: |-
      Voor het bepalen van het tijdvak van vier weken, bedoeld in het eerste en tweede lid, worden perioden van
      toegenomen arbeidsongeschiktheid samengeteld, indien zij elkaar met een onderbreking van minder dan vier weken
      opvolgen. Bij de vaststelling van zowel de eerstgenoemde als de laatstgenoemde periode van vier weken blijven
      perioden, waarin uitkering in verband met zwangerschap of bevalling op grond van [artikel 3:7, eerste lid][ref1],
      [3:8][ref2], [3:10, eerste lid][ref3], [3:18, eerste lid][ref4], of [3:19 van de Wet arbeid en zorg][ref5] wordt
      genoten, buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '13.4'
    text: |-
      Perioden van wonen buiten Nederland waarin de arbeidsongeschiktheid is toegenomen worden mede in aanmerking genomen
      voor het bepalen van het tijdvak van vier weken, bedoeld in het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel13
  - number: '14.1'
    text: |-
      Ter zake van toeneming van de arbeidsongeschiktheid vindt herziening van een arbeidsongeschiktheidsuitkering steeds
      plaats zodra de toeneming van de arbeidsongeschiktheid optreedt, indien deze intreedt:
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel14
  - number: 14.1.a
    text: binnen vier weken na de dag, met ingang waarvan de arbeidsongeschiktheidsuitkering werd toegekend;
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel14
  - number: 14.1.b
    text: |-
      binnen vier weken na de dag, met ingang waarvan de arbeidsongeschiktheidsuitkering wegens toegenomen
      arbeidsongeschiktheid werd herzien;
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel14
  - number: 14.1.c
    text: |-
      binnen vier weken na de dag, met ingang waarvan de arbeidsongeschiktheidsuitkering, die voordien was berekend
      naar een arbeidsongeschiktheid van 80% of meer, wegens afneming van de arbeidsongeschiktheid is herzien naar een
      arbeidsongeschiktheid van minder dan 80%;
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel14
  - number: 14.1.d
    text: binnen een bij ministeriële regeling aan te geven tijdvak in daarbij aan te wijzen gevallen.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel14
  - number: '14.2'
    text: |-
      Indien de arbeidsongeschiktheidsuitkering werd toegekend, onderscheidenlijk wegens toegenomen arbeidsongeschiktheid
      werd herzien dan wel is herleefd, met toepassing van artikel 29, tweede lid, onderscheidenlijk artikel 31,
      tweede lid, geldt voor de toepassing van het eerste lid, onderdeel a en b, als dag met ingang waarvan de
      arbeidsongeschiktheidsuitkering werd toegekend, onderscheidenlijk werd herzien dan wel is herleefd, de dag, met
      ingang waarvan die uitkering zou zijn toegekend, onderscheidenlijk zou zijn herzien dan wel zou zijn herleefd,
      indien artikel 29, tweede lid, onderscheidenlijk artikel 31, tweede lid, geen toepassing zou hebben gevonden.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel14
  - number: '14.3'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld voor gevallen waarbij direct herziening van de
      arbeidsongeschiktheidsuitkering plaatsvindt. Op grond van deze regels kan bedoelde herziening slechts plaatsvinden
      ten behoeve van de jonggehandicapte die bij hervatting van de arbeid in het bedrijfs- of beroepsleven inkomsten
      geniet, die minder bedragen dan evenredig is aan zijn nog bestaande arbeidsgeschiktheid.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel14
  - number: '14.4'
    text: |-
      Voor de toepassing van het eerste lid worden perioden van wonen buiten Nederland waarin de arbeidsongeschiktheid is
      toegenomen mede in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel14
  - number: '15.1'
    text: |-
      Ter zake van toeneming van de arbeidsongeschiktheid die intreedt binnen vijf jaar na de datum van toekenning
      of herziening van de arbeidsongeschiktheidsuitkering en die voortkomt uit dezelfde oorzaak als die waaruit
      de arbeidsongeschiktheid ter zake waarvan uitkering wordt genoten, is voortgekomen, vindt herziening van de
      arbeidsongeschiktheidsuitkering steeds plaats, zodra de toegenomen arbeidsongeschiktheid onafgebroken vier weken
      heeft geduurd.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel15
  - number: '15.2'
    text: |-
      Voor het bepalen van het tijdvak van vier weken, bedoeld in het eerste lid, worden perioden van toegenomen
      arbeidsongeschiktheid samengeteld, indien zij elkaar met een onderbreking van minder dan vier weken opvolgen. Bij
      de vaststelling van zowel de eerstgenoemde als de laatstgenoemde periode van vier weken blijven perioden, waarin
      uitkering in verband met zwangerschap of bevalling op grond van [artikel 3:7, eerste lid][ref1], [3:8][ref2],
      [3:10, eerste lid][ref3], [3:18, eerste lid][ref4], of [3:19 van de Wet arbeid en zorg][ref5] wordt genoten, buiten
      beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref3
