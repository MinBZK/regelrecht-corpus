        artikel: '3'
      - id: ref4
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '15.3'
    text: |-
      Dit artikel vindt geen toepassing, indien recht bestaat op herziening van de arbeidsongeschiktheidsuitkering op
      grond van artikel 13 of 14, eerste lid, onderdelen *a* tot en met *c*.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel15
  - number: '15.4'
    text: |-
      Perioden van wonen buiten Nederland, waarin de arbeidsongeschiktheid is toegenomen worden mede in aanmerking
      genomen voor het bepalen van het tijdvak van vier weken, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel15
  - number: '16.1'
    text: |-
      Onverminderd hetgeen overigens in deze wet is bepaald ter zake van herziening of intrekking van een beschikking
      tot toekenning van arbeidsongeschiktheidsuitkering, alsook ter zake van een weigering van een zodanige uitkering,
      herziet het Uitvoeringsinstituut werknemersverzekeringen een dergelijke beschikking of trekt het deze in:
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel16
  - number: 16.1.a
    text: ter uitvoering van een beslissing als bedoeld in artikel 10;
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel16
  - number: 16.1.b
    text: |-
      indien het niet of niet behoorlijk nakomen van een verplichting op grond van artikel 37, 38 of 62 heeft geleid tot
      het ten onrechte of tot een te hoog bedrag verlenen van een uitkering;
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel16
  - number: 16.1.c
    text: indien anderszins de uitkering ten onrechte of tot een te hoog bedrag is verleend;
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel16
  - number: 16.1.d
    text: |-
      indien het niet of niet behoorlijk nakomen van een verplichting op grond van artikel 37, 38 of 62 ertoe leidt dat
      niet kan worden vastgesteld of nog recht op uitkering bestaat.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel16
  - number: '16.2'
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kan het Uitvoeringsinstituut werknemersverzekeringen besluiten
      geheel of gedeeltelijk van herziening of intrekking af te zien.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel16
  - number: '17.1'
    text: 'Het recht op arbeidsongeschiktheidsuitkering eindigt:'
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel17
  - number: 17.1.a
    text: met ingang van de eerste dag van de maand, waarin de jonggehandicapte de leeftijd van 65 jaar bereikt;
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel17
  - number: 17.1.b
    text: |-
      wanneer de arbeidsongeschiktheid is geëindigd, of beneden 25% is gedaald, met ingang van de dag, aangegeven in de
      daartoe strekkende beschikking van het Uitvoeringsinstituut werknemersverzekeringen;
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel17
  - number: 17.1.c
    text: met ingang van de eerste dag van de maand volgend op die waarin de jonggehandicapte buiten Nederland is gaan wonen.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel17
  - number: '17.2'
    text: |-
      De arbeidsongeschiktheidsuitkering van de jonggehandicapte die deelneemt aan een voor hem gewenste opleiding of
      scholing, wordt gedurende deze opleiding of scholing niet ingetrokken in verband met een daaruit voortvloeiende
      afneming van de arbeidsongeschiktheid. Indien de jonggehandicapte tijdens de opleiding of scholing inkomsten uit
      arbeid verwerft, is [artikel 50, eerste lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel50
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '50'
        hoofdstuk: '2'
        afdeling: '3'
  - number: '17.3'
    text: |-
      Indien de intrekking van de arbeidsongeschiktheidsuitkering verband houdt met een voltooide scholing of
      opleiding, gaat deze intrekking niet eerder in dan een jaar na voltooiing van die scholing of opleiding. Indien de
      jonggehandicapte eerder inkomsten uit arbeid verwerft, is [artikel 50, eerste lid][ref1], tot uiterlijk het einde
      van dat jaar van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel50
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '50'
        hoofdstuk: '2'
        afdeling: '3'
  - number: '17.4'
    text: |-
      Het eerste lid, onderdeel c, is tevens van toepassing op de jonggehandicapte die buiten Nederland is gaan wonen en
      op wie [artikel 3, derde lid][ref1], van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel3
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '3'
        hoofdstuk: '1'
  - number: '17.5'
    text: |-
      Het recht op arbeidsongeschiktheidsuitkering eindigt, indien de jonggehandicapte rechtens zijn vrijheid is
      ontnomen, vanaf de dag dat deze vrijheidsontneming één maand heeft geduurd.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel17
  - number: '17.6'
    text: |-
      Voor de toepassing van het vierde lid worden perioden van vrijheidsontneming samengeteld, indien zij elkaar met een
      onderbreking van minder dan vier weken opvolgen.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel17
  - number: '17.7'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan het eerste lid, onderdeel c, buiten toepassing
      laten of daarvan afwijken voorzover toepassing, gelet op het belang van het eindigen van het recht op
      arbeidsongeschiktheidsuitkering indien de jonggehandicapte buiten Nederland gaat wonen, zal leiden tot een
      onbillijkheid van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel17
  - number: '18'
    text: |-
      Indien het recht op uitkering op grond van artikel 17, eerste lid, onderdeel c, is geëindigd en de jonggehandicapte
      vervolgens weer in Nederland woont, herleeft het recht op uitkering met ingang van de eerste dag van de maand
      volgend op die waarin hij weer in Nederland is gaan wonen.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel18
  - number: '19.1'
    text: 'Indien de jonggehandicapte:'
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel19
  - number: 19.1.a
    text: |-
      wiens arbeidsongeschiktheidsuitkering wegens afneming van arbeidsongeschiktheid op grond van artikel 17, eerste
      lid, onderdeel *b*, is ingetrokken; of
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel19
  - number: 19.1.b
    text: |-
      die aan het einde van de wachttijd, bedoeld in artikel 6, eerste lid, ongeschikt is tot het verrichten
      van zijn arbeid wegens ziekte, gebreken, zwangerschap of bevalling, maar geen recht had op toekenning van
      arbeidsongeschiktheidsuitkering omdat hij niet arbeidsongeschikt was; binnen vijf jaar na de datum van
      die intrekking dan wel binnen vijf jaar na het bereiken van die wachttijd arbeidsongeschikt wordt en deze
      arbeidsongeschiktheid voortkomt uit dezelfde oorzaak als die waaruit de arbeidsongeschiktheid ter zake
      waarvan de ingetrokken uitkering werd genoten dan wel als die op grond waarvan hij ongeschikt was tot het
      verrichten van zijn arbeid wegens ziekte, gebreken, zwangerschap of bevalling voortkomt, vindt toekenning van
      arbeidsongeschiktheidsuitkering steeds plaats, zodra die arbeidsongeschiktheid onafgebroken vier weken heeft
      geduurd.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel19
  - number: '19.2'
    text: |-
      Voor het bepalen van het tijdvak van vier weken, bedoeld in het eerste lid, worden perioden van
      arbeidsongeschiktheid samengeteld, indien zij elkaar met een onderbreking van minder dan vier weken opvolgen. Bij
      de vaststelling van zowel de eerstgenoemde als de laatstgenoemde periode van vier weken blijven perioden, waarin
      uitkering in verband met zwangerschap of bevalling op grond van [artikel 3:7, eerste lid][ref1], [3:8][ref2],
      [3:10, eerste lid][ref3], [3:18, eerste lid][ref4], of [3:19 van de Wet arbeid en zorg][ref5] wordt genoten, buiten
      beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '19.3'
    text: 'Dit artikel vindt geen toepassing:'
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel19
  - number: 19.3.a
    text: indien op grond van artikel 20 aanspraak bestaat op heropening van de arbeidsongeschiktheidsuitkering; of
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel19
  - number: 19.3.b
    text: |-
      indien [artikel 29b van de Ziektewet][ref1] toepassing kan vinden, tenzij de toe te kennen
      arbeidsongeschiktheidsuitkering het ziekengeld overtreft.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel29b
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: 29b
  - number: '19.4'
    text: Artikel 6b en de daarop berustende bepalingen zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel19
  - number: '20.1'
    text: |-
      De jonggehandicapte, wiens arbeidsongeschiktheidsuitkering, berekend naar een arbeidsongeschiktheid van ten minste
      45%, in verband met artikel 17, eerste lid, onderdeel *b*, is ingetrokken, heeft, indien hij binnen vier weken na
      de dag, met ingang waarvan de uitkering is ingetrokken, weer arbeidsongeschikt wordt, aanspraak op heropening van
      de arbeidsongeschiktheidsuitkering.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel20
  - number: '20.2'
    text: |-
      Het eerste lid is mede van toepassing ten aanzien van de jonggehandicapte, wiens arbeidsongeschiktheidsuitkering,
      berekend naar een arbeidsongeschiktheid van minder dan 45% in verband met artikel 17, eerste lid, onderdeel
      *b*, is ingetrokken, indien hij weer arbeidsongeschikt wordt binnen vier weken na de dag, met ingang waarvan die
      uitkering, die voordien was berekend naar een arbeidsongeschiktheid van ten minste 45%, wegens afneming van de
      arbeidsongeschiktheid is herzien naar een arbeidsongeschiktheid van minder dan 45%.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel20
  - number: '20.3'
    text: |-
      De jonggehandicapte, wiens arbeidsongeschiktheidsuitkering, berekend naar een arbeidsongeschiktheid van minder dan
      45%, in verband met artikel 17, eerste lid, onderdeel *b*, is ingetrokken met ingang van een dag, gelegen binnen
      vier weken na de dag, met ingang waarvan die uitkering werd toegekend of wegens toegenomen arbeidsongeschiktheid
      werd herzien, heeft, indien hij binnen die vier weken weer arbeidsongeschikt wordt, aanspraak op heropening van de
      arbeidsongeschiktheidsuitkering. Artikel 14, tweede lid, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel20
  - number: '20.4'
    text: |-
      De jonggehandicapte, wiens arbeidsongeschiktheidsuitkering, berekend naar een arbeidsongeschiktheid van minder
      dan 45%, in verband met artikel 17, eerste lid, onderdeel *b*, is ingetrokken, heeft, onverminderd het tweede
      en het derde lid, indien hij binnen vier weken na de dag, met ingang waarvan de uitkering is ingetrokken,
      weer arbeidsongeschikt wordt, niet kennelijk uit een andere oorzaak dan die, waaruit de arbeidsongeschiktheid,
      ter zake waarvan de ingetrokken uitkering werd genoten, is voortgekomen, aanspraak op heropening van de
      arbeidsongeschiktheidsuitkering.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel20
  - number: '20.5'
    text: De heropening vindt plaats naar de mate van arbeidsongeschiktheid op de dag, waarop de heropening ingaat.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel20
  - number: '20.6'
    text: |-
      Voor de toepassing van het eerste tot en met vijfde lid wordt niet als arbeidsongeschikt beschouwd degene die
      minder dan 25% arbeidsongeschikt is.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel20
  - number: '20.7'
    text: Artikel 6b en de daarop berustende bepalingen zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel20
  - number: 20a.1
    text: |-
      De jonggehandicapte, wiens arbeidsongeschiktheidsuitkering in verband met artikel 17, vijfde lid, is geëindigd,
      heeft vanaf de dag dat hij in vrijheid wordt gesteld met inachtneming van de bepalingen van deze wet recht op
      heropening van de arbeidsongeschiktheidsuitkering, indien hij op die dag arbeidsongeschikt is. Artikel 6, vijfde
      lid, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel20a
  - number: 20a.2
    text: |-
      Aanspraak op heropening van de arbeidsongeschiktheidsuitkering heeft eveneens de jonggehandicapte, bedoeld in het
      eerste lid, die op de in dat lid bedoelde dag niet arbeidsongeschikt is, doch ten aanzien van wie dit wel het geval
      is binnen vier weken na afloop van dat tijdvak.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel20a
  - number: 20a.3
    text: |-
      De artikelen 6, vijfde lid, 29 en 30, eerste lid, zijn van overeenkomstige toepassing met betrekking tot de
      aanspraak op heropening van de arbeidsongeschiktheidsuitkering, bedoeld in dit artikel.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel20a
  - number: 20a.4
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op bij algemene maatregel van bestuur aan te wijzen
      categorieën personen waarbij tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende maatregel buiten een
      justitiële inrichting plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel20a
  - number: '21'
    text: |-
      De jonggehandicapte die over een maand recht heeft op arbeidsongeschiktheidsuitkering, heeft over die maand recht
      op vakantie-uitkering.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel21
  - number: '22.1'
    text: |-
      De vakantie-uitkering bedraagt acht procent van het bedrag aan arbeidsongeschiktheidsuitkering, waarop recht
      bestond in het tijdvak van twaalf maanden, voorafgaande aan de maand mei.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel22
  - number: '22.2'
    text: |-
      Indien artikel 50 of 51 is toegepast, wordt onder het bedrag aan arbeidsongeschiktheidsuitkering, bedoeld in
      het eerste lid, verstaan het bedrag van de arbeidsongeschiktheidsuitkering, nadat dat artikel toepassing heeft
      gevonden.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel22
  - number: '22.3'
    text: |-
      Indien het percentage van de vakantiebijslag, bedoeld in
      [artikel 15, eerste lid, van de Wet minimumloon en minimumvakantiebijslag][ref1], wordt gewijzigd, treedt dit
      gewijzigde percentage in de plaats van het in het eerste lid genoemde percentage. Het gewijzigde percentage wordt
      in aanmerking genomen over de uitkering waarop recht bestaat over het tijdvak aanvangende met de dag waarop de
      wijziging ingaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel15
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '15'
  - number: '22.4'
    text: |-
      Op de ambtshalve toekenning van een vakantie-uitkering zijn de [artikelen 3:41][ref1] en
      [3:45 van de Algemene wet bestuursrecht][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '23'
    text: |-
      De artikelen 21 en 22, eerste tot en met derde lid, zijn van overeenkomstige toepassing op de overlijdensuitkering,
      bedoeld in artikel 53.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel23
  - number: '27.1'
    text: |-
      Ten einde een recht op arbeidsongeschiktheidsuitkering geldend te kunnen maken meldt de jonggehandicapte zijn
      arbeidsongeschiktheid binnen dertien weken na de dag waarop hij 17 jaar is geworden dan wel binnen dertien weken na
      de in artikel 5, eerste lid, onderdeel *b*, bedoelde dag aan het Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel27
  - number: '27.2'
    text: |-
      Voor het bepalen van het tijdvak van dertien weken, bedoeld in het eerste lid, worden perioden van
      arbeidsongeschiktheid samengeteld, indien zij elkaar met een onderbreking van minder dan vier weken opvolgen. Bij
      de vaststelling van zowel het tijdvak van dertien weken als de periode van vier weken blijven perioden, waarin
      uitkering in verband met zwangerschap of bevalling op grond van [artikel 3:7, eerste lid][ref1], [3:8][ref2],
      [3:10, eerste lid][ref3], [3:18, eerste lid][ref4], of [3:19 van de Wet arbeid en zorg][ref5] wordt genoten, buiten
      beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '28.1'
    text: |-
      Onverminderd hetgeen in deze wet ter zake van herziening of intrekking van de arbeidsongeschiktheidsuitkering is
      bepaald, wordt de arbeidsongeschiktheidsuitkering op aanvraag toegekend over tijdvakken van drie jaar.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel28
  - number: '28.2'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen stelt de jonggehandicapte schriftelijk in kennis van de
      mogelijkheid van het doen van een aanvraag uiterlijk vier maanden voor de datum waarop:
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel28
  - number: 28.2.a
    text: het in artikel 6, eerste lid, genoemde tijdvak van 52 weken eindigt;
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel28
  - number: 28.2.b
    text: een tijdvak van drie jaar als bedoeld in het eerste lid verstrijkt.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel28
  - number: '28.3'
    text: |-
      Het tweede lid, onderdeel *a*, is niet van toepassing, indien de jonggehandicapte de melding, bedoeld in artikel
      27, eerste lid, niet of niet tijdig heeft gedaan. Indien de jonggehandicapte deze melding niet tijdig heeft gedaan,
      geldt de in het tweede lid bedoelde verplichting voor het Uitvoeringsinstituut werknemersverzekeringen uiterlijk
      drie maanden nadat de jonggehandicapte de melding heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel28
  - number: '28.4'
    text: |-
      De jonggehandicapte die in aanmerking wenst te komen voor toekenning dan wel voortzetting van de uitkering, doet
      zijn aanvraag binnen negen maanden na aanvang van zijn arbeidsongeschiktheid, onderscheidenlijk uiterlijk drie
      maanden voor het verstrijken van een tijdvak als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel28
  - number: '28.5'
    text: |-
      Indien niet binnen de termijn ingevolge artikel 69a, eerste lid, een beschikking is gegeven op een tijdig
      ingediende aanvraag tot voortzetting van de arbeidsongeschiktheidsuitkering wordt de uitkering voortgezet tot het
      tijdstip waarop de beschikking op de aanvraag is bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel28
  - number: '28.6'
    text: |-
      Een aanvraag is tijdig ingediend, indien het Uitvoeringsinstituut werknemersverzekeringen de kennisgeving, bedoeld
      in het tweede lid, niet heeft gedaan dan wel indien bij een latere kennisgeving dan bedoeld in het tweede lid de
      aanvraag wordt ingediend binnen vier weken nadat deze kennisgeving is ontvangen.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel28
  - number: '28.7'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan, onder goedkeuring van Onze Minister, ten aanzien van bepaalde
      groepen arbeidsongeschikten bepalen dat geen tijdvak geldt dan wel een tijdvak zal gelden dat afwijkt van het in
      het eerste lid genoemde tijdvak.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel28
  - number: '28.8'
    text: |-
      Indien de toepassing van het vierde lid zou leiden tot kennelijke hardheid, is het Uitvoeringsinstituut
      werknemersverzekeringen bevoegd de uitkering ambtshalve toe te kennen of voort te zetten.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel28
  - number: '29.1'
    text: |-
      De arbeidsongeschiktheidsuitkering gaat in op de dag, met ingang waarvan de jonggehandicapte aan de vereisten voor
      het recht op toekenning van die uitkering voldoet.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel29
  - number: '29.2'
    text: |-
      In afwijking van het eerste lid kan de uitkering niet vroeger ingaan dan een jaar voor de dag, waarop
      de aanvraag om toekenning dan wel voortzetting van de uitkering werd ingediend. Het Uitvoeringsinstituut
      werknemersverzekeringen kan voor bijzondere gevallen van de eerste zin afwijken.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel29
  - number: '29.3'
    text: |-
      Toekenning van arbeidsongeschiktheidsuitkering vindt niet plaats, indien deze zou ingaan op of na de in artikel 17,
      eerste lid, onderdeel *a*, bedoelde dag.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel29
  - number: '30.1'
    text: |-
      Herziening, heropening dan wel herleving van de arbeidsongeschiktheidsuitkering vindt op aanvraag of ambtshalve
      plaats.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel30
  - number: '30.2'
    text: |-
      Herziening van de arbeidsongeschiktheidsuitkering vindt in elk geval ambtshalve plaats in geval van een beslissing
      op grond van artikel 11, tweede lid.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel30
  - number: '31.1'
    text: |-
      De herziening van de arbeidsongeschiktheidsuitkering gaat in op de dag, waarop de jonggehandicapte op grond van
      deze wet voor een hogere of lagere uitkering in aanmerking komt.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel31
  - number: '31.2'
    text: |-
      Met betrekking tot de herziening van de arbeidsongeschiktheidsuitkering, die een verhoging van die uitkering tot
      gevolg heeft, alsmede met betrekking tot de heropening of herleving van de uitkering is artikel 29, tweede lid, van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel31
  - number: '31.3'
    text: |-
      De herziening van een arbeidsongeschiktheidsuitkering ter zake van afneming van de arbeidsongeschiktheid gaat in op
      de dag, aangegeven in de daartoe strekkende beschikking van het Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel31
  - number: '31.4'
    text: |-
      Indien de herziening van de arbeidsongeschiktheidsuitkering verband houdt met een voltooide scholing of
      opleiding, gaat deze herziening niet eerder in dan een jaar na voltooiing van die scholing of opleiding. Indien de
      jonggehandicapte eerder inkomsten uit arbeid verwerft, is artikel 50, eerste lid, tot uiterlijk het einde van dat
      jaar van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel31
  - number: '31.5'
    text: |-
      De herleving van de uitkering, bedoeld in artikel 18, gaat in op de eerste dag van de maand volgend op die waarin
      hij weer in Nederland is gaan wonen.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel31
  - number: '31.6'
    text: |-
      De heropening van de uitkering, bedoeld in artikel 20, gaat in op de dag, met ingang waarvan de jonggehandicapte
      weer arbeidsongeschikt is geworden.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel31
  - number: '31.7'
    text: |-
      Heropening of herleving van de arbeidsongeschiktheidsuitkering vindt niet plaats, indien deze zou ingaan op of na
      de in artikel 17, eerste lid, onderdeel *a*, bedoelde dag.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel31
  - number: '32'
    text: |-
      De vakantie-uitkering wordt ambtshalve of, ingeval artikel 52, eerste lid, tweede zin, toepassing vindt, op
      aanvraag door het Uitvoeringsinstituut werknemersverzekeringen toegekend.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel32
  - number: '33.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan, telkens wanneer het dat nodig oordeelt, oproepen of doen
      oproepen en op een door of namens hem te bepalen plaats ondervragen of doen ondervragen:
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel33
  - number: 33.1.a
    text: de jonggehandicapte, die de wachttijd van 52 weken, bedoeld in artikel 6, eerste lid, doormaakt;
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel33
  - number: 33.1.b
    text: de jonggehandicapte, die aanspraak maakt op of recht heeft op een arbeidsongeschiktheidsuitkering;
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel33
  - number: 33.1.c
    text: |-
      de jonggehandicapte ten aanzien van wie of ten behoeve van wie reïntegratie-instrumenten als bedoeld in
      [hoofdstuk 3][ref1] of [hoofdstuk 4 van de Wet op de (re)integratie arbeidsgehandicapten][ref2] zijn toegekend of
      waarvan toekenning wordt overwogen;


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0009565
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0009565
        hoofdstuk: '4'
  - number: 33.1.d
    text: |-
      de ingezetene die de leeftijd van 17 jaar nog niet heeft bereikt en ten aanzien van wie
      of ten behoeve van wie reïntegratie-instrumenten als bedoeld in [hoofdstuk 3][ref1] of
      [hoofdstuk 4 van de Wet op de (re)integratie arbeidsgehandicapten][ref2] zijn toegekend of waarvan toekenning wordt
      overwogen.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0009565
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0009565
        hoofdstuk: '4'
  - number: '33.2'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan de in het eerste lid bedoelde personen op een door of namens
      hem te bepalen plaats door een of meer daartoe door hem aangewezen deskundigen doen onderzoeken.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel33
  - number: '33.3'
    text: |-
      De daartoe door het Uitvoeringsinstituut werknemersverzekeringen aangewezen deskundige kan, ook zonder opdracht
      van het Uitvoeringsinstituut werknemersverzekeringen, de in het eerste lid bedoelde personen oproepen, ondervragen,
      onderzoeken, doen oproepen, doen ondervragen en doen onderzoeken door een of meer door hem daartoe aangewezen
      deskundigen.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel33
  - number: '34'
    text: |-
      Opgeroepenen en, indien hun toestand geleide nodig maakt, mede hun geleiders, worden reiskosten, verblijfkosten
      en tijdverlies vergoed in de gevallen en volgens regels die door het Uitvoeringsinstituut werknemersverzekeringen
      worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel34
  - number: '35.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen en de door hem daartoe aangewezen deskundige kunnen de personen,
      bedoeld in [artikel 33, eerste lid][ref1], voorschriften geven in het belang van een behandeling of van genezing of
      tot behoud, herstel en bevordering van de mogelijkheid tot het verrichten van arbeid.


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel33
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '33'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
  - number: '35.2'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan voorschrijven dat personen, bedoeld in
      [artikel 33, eerste lid][ref1], zich laten registreren als werkzoekende bij de Centrale organisatie werk en
      inkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel33
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '33'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
  - number: '36'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan controlevoorschriften vaststellen. Deze voorschriften mogen
      niet verder gaan dan strikt noodzakelijk is voor een juiste uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel36
  - number: '37.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen weigert de uitkering tijdelijk of blijvend, geheel of
      gedeeltelijk, indien een persoon als bedoeld in artikel 33, eerste lid, na tijdig te zijn opgeroepen niet is
      verschenen of heeft geweigerd:
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel37
  - number: 37.1.a
    text: |-
      vragen te beantwoorden die zijn gesteld door het Uitvoeringsinstituut werknemersverzekeringen of de door hem
      daartoe aangewezen deskundige;
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel37
  - number: 37.1.b
    text: |-
      zich te laten onderzoeken door de door het Uitvoeringsinstituut werknemersverzekeringen daartoe aangewezen
      deskundige; of
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel37
  - number: 37.1.c
    text: |-
      te voldoen aan het voorschrift, gegeven door het Uitvoeringsinstituut werknemersverzekeringen of de door
      hem daartoe aangewezen deskundige, om zich ter observatie te doen opnemen of te verblijven in een aangewezen
      inrichting.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel37
  - number: '37.2'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen handelt overeenkomstig het eerste lid bij toeneming van
      de arbeidsongeschiktheid, voor zover deze toeneming kennelijk is voortgekomen uit dezelfde oorzaak als de
      arbeidsongeschiktheid, ter zake waarvan het niet voldoen aan de oproeping of de weigering plaatsvond.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel37
  - number: '38'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen handelt overeenkomstig [artikel 37][ref1], indien de
      jonggehandicapte:


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel37
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '37'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
  - number: 38.a
    text: |-
      de door het Uitvoeringsinstituut werknemersverzekeringen of de door hem daartoe aangewezen deskundige krachtens
      [artikel 35][ref1] in het belang van een behandeling of genezing of tot behoud, herstel of bevordering van de
      mogelijkheid tot het verrichten van arbeid en tot registratie als werkzoekende bij de Centrale organisatie werk en
      inkomen gegeven voorschriften zonder deugdelijke grond niet opvolgt;


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel35
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '35'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
  - number: 38.b
    text: |-
      zich niet, zolang als het Uitvoeringsinstituut werknemersverzekeringen of de door hem daartoe aangewezen deskundige
      te kennen heeft gegeven dit noodzakelijk te achten, onder geneeskundige behandeling stelt of indien hij de
      voorschriften van de behandelende arts niet opvolgt;
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel38
  - number: 38.c
    text: |-
      zich schuldig maakt aan gedragingen, waardoor zijn genezing wordt belemmerd of nalaat voldoende mee te werken om
      aanpassing aan zijn ziekte of gebrek te verkrijgen;
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel38
  - number: 38.d
    text: |-
      de controlevoorschriften, bedoeld in [artikel 36][ref1], of de verplichting, bedoeld in
      [artikel 55, tweede lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2], niet of niet
      behoorlijk is nagekomen dan wel de verplichting, bedoeld in [artikel 62][ref3], niet binnen de door het
      Uitvoeringsinstituut werknemersverzekeringen daarvoor vastgestelde termijn is nagekomen;


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel55
      [ref3]: https://wetten.overheid.nl/BWBR0008657#Artikel62
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '36'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '55'
      - id: ref3
        bwb_id: BWBR0008657
        artikel: '62'
        hoofdstuk: '4'
  - number: 38.e
    text: zijn arbeidsongeschiktheid opzettelijk heeft veroorzaakt;
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel38
  - number: 38.f
    text: |-
      zich niet houdt aan het voorschrift, bedoeld in [artikel 28, vierde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel28
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '28'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
  - number: 38.g
    text: |-
      zonder redelijke gronden niet meewerkt aan een scholing of opleiding die wenselijk wordt geacht voor zijn
      inschakeling in de arbeid.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel38
  - number: '39.1'
    text: |-
      Een maatregel als bedoeld in [artikel 37][ref1] of [38][ref2] wordt afgestemd op de ernst van de gedraging en de
      mate waarin de jonggehandicapte de gedraging kan worden verweten. Van het opleggen van een maatregel wordt in elk
      geval afgezien, indien elke vorm van verwijtbaarheid ontbreekt.


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0008657#Artikel38
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '37'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0008657
        artikel: '38'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
  - number: '39.2'
    text: |-
      Indien het niet tijdig nakomen van de verplichting, bedoeld in [artikel 62][ref1], niet heeft geleid tot het
      ten onrechte of tot een te hoog bedrag verlenen van een uitkering als genoemd in dat artikel, of indien de
      jonggehandicapte zich niet houdt aan de voorschriften, bedoeld in [artikel 28, vierde lid][ref2], kan het
      Uitvoeringsinstituut werknemersverzekeringen afzien van het opleggen van een maatregel en volstaan met het geven
      van een schriftelijke waarschuwing ter zake van het niet tijdig nakomen van de verplichting, of het zich niet
      houden aan de voorschriften, tenzij het niet tijdig nakomen van de verplichting, of het zich niet houden aan
      de voorschriften, plaatsvindt binnen een periode van twee jaar te rekenen vanaf de datum waarop eerder aan de
      jonggehandicapte een zodanige waarschuwing is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0008657#Artikel28
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '62'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0008657
        artikel: '28'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
  - number: '39.3'
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kan het Uitvoeringsinstituut werknemersverzekeringen besluiten van
      het opleggen van een maatregel af te zien.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel39
  - number: '39.4'
    text: |-
      Het opleggen van een maatregel blijft achterwege, indien voor dezelfde gedraging een boete als bedoeld in
      [artikel 40][ref1] wordt opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel40
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '40'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
  - number: '39.5'
    text: Het Uitvoeringsinstituut werknemersverzekeringen stelt nadere regels met betrekking tot het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel39
  - number: '40.1'
    text: |-
      Indien de jonggehandicapte of zijn wettelijke vertegenwoordiger de verplichting, bedoeld in artikel 62, niet
      of niet behoorlijk is nagekomen, legt het Uitvoeringsinstituut werknemersverzekeringen hem een boete op van ten
      hoogste € 2 269.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel40
  - number: '40.2'
    text: |-
      De hoogte van de boete wordt afgestemd op de ernst van de gedraging, de mate waarin de jonggehandicapte of zijn
      wettelijke vertegenwoordiger de gedraging verweten kan worden en de omstandigheden waarin hij verkeert. Van het
      opleggen van een boete wordt in elk geval afgezien, indien elke vorm van verwijtbaarheid ontbreekt.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel40
  - number: '40.3'
    text: |-
      Indien het niet of niet behoorlijk nakomen van de verplichting, bedoeld in artikel 62, niet heeft geleid tot
      het ten onrechte of tot een te hoog bedrag verlenen van een uitkering als genoemd in dat artikel, kan het
      Uitvoeringsinstituut werknemersverzekeringen afzien van het opleggen van een boete als bedoeld in het eerste lid
      en volstaan met het geven van een schriftelijke waarschuwing ter zake van het niet of niet behoorlijk nakomen van
      de verplichting, tenzij het niet of niet behoorlijk nakomen van de verplichting plaatsvindt binnen een periode van
      twee jaar te rekenen vanaf de datum waarop eerder aan de jonggehandicapte of zijn wettelijke vertegenwoordiger een
      zodanige waarschuwing is gegeven.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel40
  - number: '40.4'
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kan het Uitvoeringsinstituut werknemersverzekeringen besluiten van
      het opleggen van een boete af te zien.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel40
  - number: '40.5'
    text: |-
      De persoon aan wie een boete is opgelegd is verplicht desgevraagd aan het Uitvoeringsinstituut
      werknemersverzekeringen de inlichtingen te verstrekken die voor de tenuitvoerlegging van de boete van belang zijn.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel40
  - number: '40.6'
    text: Voor zover de boete nog niet is geïnd vervalt zij door het overlijden van de persoon aan wie zij is opgelegd.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel40
  - number: '40.7'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot het eerste en het
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel40
  - number: '41.1'
    text: |-
      Indien het Uitvoeringsinstituut werknemersverzekeringen jegens de jonggehandicapte of zijn wettelijke
      vertegenwoordiger een handeling verricht waaraan deze in redelijkheid de gevolgtrekking kan verbinden dat
      hem wegens een bepaalde gedraging een boete zal worden opgelegd, is de jonggehandicapte of zijn wettelijke
      vertegenwoordiger niet langer verplicht ter zake van die gedragingen enige verklaring af te leggen, voor zover
      het de boete-oplegging betreft. De jonggehandicapte of zijn wettelijke vertegenwoordiger wordt hiervan in kennis
      gesteld alvorens hem mondeling om informatie wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel41
  - number: '41.2'
    text: |-
      Indien het Uitvoeringsinstituut werknemersverzekeringen voornemens is aan de jonggehandicapte of zijn wettelijke
      vertegenwoordiger een boete op te leggen, wordt hiervan kennis gegeven aan de jonggehandicapte of zijn wettelijke
      vertegenwoordiger onder vermelding van de gronden waarop het voornemen berust. De kennisgeving is een handeling als
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel41
  - number: '41.3'
    text: |-
      Op verzoek van de jonggehandicapte of zijn wettelijke vertegenwoordiger die de kennisgeving, bedoeld in het tweede
      lid, wegens zijn gebrekkige kennis van de Nederlandse taal onvoldoende begrijpt, draagt het Uitvoeringsinstituut
      werknemersverzekeringen er zoveel mogelijk zorg voor dat de in die kennisgeving vermelde gronden aan de
      jonggehandicapte of zijn wettelijke vertegenwoordiger worden meegedeeld in een voor hem begrijpelijke taal.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel41
  - number: '41.4'
    text: |-
      In afwijking van [afdeling 4.1.2 van de Algemene wet bestuursrecht][ref1] stelt het Uitvoeringsinstituut
      werknemersverzekeringen de jonggehandicapte of zijn wettelijke vertegenwoordiger in de gelegenheid om naar keuze
      schriftelijk of mondeling zijn zienswijze naar voren te brengen voordat de boete wordt opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.2
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.1.2
  - number: '41.5'
    text: |-
      Indien de jonggehandicapte of zijn wettelijke vertegenwoordiger zijn zienswijze mondeling naar voren brengt,
      draagt het Uitvoeringsinstituut werknemersverzekeringen er op verzoek van de jonggehandicapte of zijn wettelijke
      vertegenwoordiger die de Nederlandse taal onvoldoende begrijpt, zorg voor dat een tolk wordt benoemd die hem kan
      bijstaan, tenzij redelijkerwijs kan worden aangenomen dat daaraan geen behoefte bestaat.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel41
  - number: '42.1'
    text: |-
      Het besluit waarbij de boete wordt opgelegd vermeldt de termijn of de termijnen waarbinnen deze moet worden
      betaald, alsmede de wijze waarop het besluit bij gebreke van tijdige betaling, overeenkomstig artikel 46 zal worden
      tenuitvoergelegd.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel42
  - number: '42.2'
    text: |-
      Op verzoek van de jonggehandicapte of zijn wettelijke vertegenwoordiger die het in het eerste lid bedoelde besluit
      wegens zijn gebrekkige kennis van de Nederlandse taal onvoldoende begrijpt, draagt het Uitvoeringsinstituut
      werknemersverzekeringen er zoveel mogelijk zorg voor dat de in dat besluit vermelde informatie aan de
      jonggehandicapte of zijn wettelijke vertegenwoordiger wordt meegedeeld in een voor hem begrijpelijke taal.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel42
  - number: '42.3'
    text: Bij ministeriële regeling worden nadere regels gesteld met betrekking tot het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel42
  - number: '43.1'
    text: Een boete wordt niet opgelegd zolang de gedraging wordt onderzocht door het openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel43
  - number: '43.2'
    text: |-
      De oplegging van een boete blijft definitief achterwege indien ter zake van de gedragingen tegen de
      jonggehandicapte of zijn wettelijke vertegenwoordiger een strafvervolging is ingesteld en het onderzoek ter
      terechtzitting een aanvang heeft genomen, dan wel het recht tot strafvordering is vervallen op grond van
      [artikel 74 van het Wetboek van Strafrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel74
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '74'
  - number: '43.3'
    text: |-
      Het openbaar ministerie doet van een omstandigheid als bedoeld in het eerste en het tweede lid mededeling aan het
      Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel43
  - number: '44.1'
    text: |-
      Een boete wordt opgelegd binnen een jaar nadat het Uitvoeringsinstituut werknemersverzekeringen de jonggehandicapte
      of zijn wettelijke vertegenwoordiger overeenkomstig artikel 41, vierde lid, in de gelegenheid heeft gesteld zijn
      zienswijze naar voren te brengen. Indien ter zake aangifte is gedaan of proces-verbaal is opgemaakt en ingezonden
      vangt het tijdvak van een jaar aan op de dag na die waarop het openbaar ministerie aan het Uitvoeringsinstituut
      werknemersverzekeringen heeft meegedeeld dat geen strafvervolging wordt ingesteld.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel44
  - number: '44.2'
    text: |-
      Een boete wordt in elk geval niet opgelegd na verloop van vijf jaren nadat de desbetreffende gedraging heeft
      plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel44
  - number: '45'
    text: |-
      In afwijking van [artikel 8:69 van de Algemene wet bestuursrecht][ref1] kan de rechter in beroep of hoger
      beroep het bedrag waarop de boete is vastgesteld ook ten nadele van de jonggehandicapte of zijn wettelijke
      vertegenwoordiger wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '46.1'
    text: |-
      Het besluit waarbij een boete is opgelegd levert een executoriale titel op in de zin van het
      [Tweede Boek van het Wetboek van Burgerlijke Rechtsvordering][ref1]. De titel heeft mede betrekking op de rente en
      kosten, bedoeld in het zesde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '46.2'
    text: |-
      Indien de persoon aan wie een boete is opgelegd een uitkering ontvangt op grond van deze wet, de
      [Werkloosheidswet][ref1], de [Ziektewet][ref2], de [Wet op de arbeidsongeschiktheidsverzekering][ref3],
      de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref4], de
      [Wet arbeidsongeschiktheidsvoorziening militairen][ref5]of de [Wet arbeid en zorg][ref6] of een toeslag op grond
      van de [Toeslagenwet][ref7], wordt het besluit waarbij de boete is opgelegd tenuitvoergelegd door verrekening met
      die uitkering of toeslag.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0001888
      [ref3]: https://wetten.overheid.nl/BWBR0002524
      [ref4]: https://wetten.overheid.nl/BWBR0008656
      [ref5]: https://wetten.overheid.nl/BWBR0002822
      [ref6]: https://wetten.overheid.nl/BWBR0013008
      [ref7]: https://wetten.overheid.nl/BWBR0004043
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0001888
      - id: ref3
        bwb_id: BWBR0002524
      - id: ref4
        bwb_id: BWBR0008656
      - id: ref5
        bwb_id: BWBR0002822
      - id: ref6
        bwb_id: BWBR0013008
      - id: ref7
        bwb_id: BWBR0004043
  - number: '46.3'
    text: |-
      Indien de persoon aan wie een boete is opgelegd een uitkering ontvangt op grond van de
      [Algemene Ouderdomswet][ref1], de [Algemene nabestaandenwet][ref2], de [Wet werk en bijstand][ref3],
      de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref4], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref5] of de
      [Wet inkomensvoorziening kunstenaars][ref6], betaalt de Sociale verzekeringsbank, onderscheidenlijk de betrokken
      gemeente het bedrag van die boete, zonder dat daarvoor een machtiging nodig is van hem, op zijn verzoek aan het
      Uitvoeringsinstituut werknemersverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
      [ref2]: https://wetten.overheid.nl/BWBR0007795
      [ref3]: https://wetten.overheid.nl/BWBR0015703
      [ref4]: https://wetten.overheid.nl/BWBR0004044
      [ref5]: https://wetten.overheid.nl/BWBR0004163
      [ref6]: https://wetten.overheid.nl/BWBR0009344
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0002221
      - id: ref2
        bwb_id: BWBR0007795
      - id: ref3
        bwb_id: BWBR0015703
      - id: ref4
        bwb_id: BWBR0004044
      - id: ref5
        bwb_id: BWBR0004163
      - id: ref6
        bwb_id: BWBR0009344
  - number: '46.4'
    text: |-
      Indien de persoon aan wie een boete is opgelegd geen uitkering of toeslag als bedoeld in het tweede of derde lid
      ontvangt, of meer ontvangt, dan wel ten aanzien van zodanige uitkering of toeslag toepassing van het tweede of
      derde lid niet mogelijk is, wordt het besluit waarbij de boete is opgelegd bij gebreke van tijdige betaling met
      toepassing van het [Wetboek van Burgerlijke Rechtsvordering][ref1] op zijn kosten betekend en tenuitvoergelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '46.5'
    text: |-
      De tenuitvoerlegging van een besluit waarbij een boete is opgelegd vindt plaats met toepassing van het tweede of
      derde lid, dan wel van het vierde lid, dan wel van het tweede of derde lid in combinatie met het vierde lid.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel46
  - number: '46.6'
    text: |-
      Bij gebreke van tijdige betaling wordt de verschuldigde boete verhoogd met de wettelijke rente en de op de
      invordering betrekking hebbende kosten.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel46
  - number: '46.7'
    text: |-
      Op het executoriaal beslag op grond van dit artikel door het Uitvoeringsinstituut werknemersverzekeringen op loon,
      sociale uitkeringen of andere periodieke betalingen, die derden verschuldigd zijn of worden aan degene aan wie
      een boete is opgelegd, zijn de [artikelen 479][ref1] tot en met [479][ref2], behoudens [artikel 479][ref3] van
      overeenkomstige toepassing. De in artikel 479*g* aan het Landelijk Bureau Inning Onderhoudsbijdragen toegekende
      bevoegdheid komt gelijkelijk toe aan het Uitvoeringsinstituut werknemersverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel479b
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel479g
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel479e
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 479b
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 479g
      - id: ref3
        bwb_id: BWBR0001827
        artikel: 479e
  - number: '46.8'
    text: |-
      De tenuitvoerlegging van een besluit met toepassing van dit artikel geschiedt zodanig dat de jonggehandicapte of
      zijn wettelijke vertegenwoordiger blijft beschikken over een inkomen gelijk aan de beslagvrije voet, bedoeld in de
      [artikelen 475][ref1] en [475][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel475d
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475c
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 475d
  - number: '46.9'
    text: |-
      Het achtste lid geldt niet, zolang de jonggehandicapte of zijn wettelijke vertegenwoordiger zijn verplichting,
      bedoeld in artikel 40, vijfde lid, niet of niet behoorlijk nakomt.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel46
  - number: '47.1'
    text: |-
      De arbeidsongeschiktheidsuitkering wordt betaalbaar gesteld door het Uitvoeringsinstituut werknemersverzekeringen.
      De betaling geschiedt als regel in tijdvakken van een maand.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel47
  - number: '47.2'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan een uitkering als bedoeld in het eerste lid, over een door
      hem te bepalen tijdvak bij wege van voorschot betaalbaar stellen, indien onzekerheid bestaat over het recht op
      of de hoogte van de uitkering of de hoogte van het te betalen bedrag aan uitkering. Een verleend voorschot wordt
      verrekend met het definitief vastgestelde bedrag aan uitkering dat over het desbetreffende tijdvak wordt betaald.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel47
  - number: '47.3'
    text: |-
      Onverminderd het tweede lid, schort het Uitvoeringsinstituut werknemersverzekeringen de betaling van de
      arbeidsongeschiktheidsuitkering op of schorst het de betaling, indien het op grond van duidelijke aanwijzingen van
      oordeel is of het gegronde vermoeden heeft dat:
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel47
  - number: 47.3.a
    text: het recht op uitkering niet of niet meer bestaat;
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel47
  - number: 47.3.b
    text: recht op een lagere uitkering bestaat;
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel47
  - number: 47.3.c
    text: |-
      de jonggehandicapte of zijn wettelijke vertegenwoordiger een verplichting als bedoeld in artikel 37, 38 of 62 niet
      of niet behoorlijk is nagekomen.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel47
  - number: '47.4'
    text: |-
      Ingeval de arbeidsongeschiktheidsuitkering in het buitenland wordt betaald worden de daaraan verbonden kosten van
      overmaking op de uitkering in mindering gebracht.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel47
  - number: '47.5'
    text: |-
      Wanneer de jonggehandicapte, aan wie een arbeidsongeschiktheidsuitkering is toegekend, een ander machtigt om de
      uitkering in ontvangst te nemen, onderscheidenlijk een verleende machtiging intrekt, wordt daaraan gevolg gegeven
      met ingang van een betalingstijdvak, aanvangende na de dag waarop de machtiging wordt ingediend, onderscheidenlijk
      waarop van haar intrekking mededeling wordt gedaan, doch niet later dan de eerste dag van de tweede maand na de dag
      van indiening onderscheidenlijk de mededeling.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel47
  - number: '48'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen houdt op de arbeidsongeschiktheidsuitkering, op de vakantie-
      uitkering en op de toeslag op de uitkering op grond van de [Toeslagenwet][ref1] een bedrag in, dat gelijk is aan
      het bedrag van de premie die een werkgever op grond van de [Werkloosheidswet][ref2] op het overeenkomstige loon van
      een werknemer, die verzekerd is op grond van die wet, inhoudt.


      [ref1]: https://wetten.overheid.nl/BWBR0004043
      [ref2]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0004043
      - id: ref2
        bwb_id: BWBR0004045
  - number: '49.1'
    text: |-
      Indien de jonggehandicapte, aan wie een arbeidsongeschiktheidsuitkering is toegekend, op grond van
      [artikel 6, derde lid, van de Algemene Wet Bijzondere Ziektekosten][ref1] een bijdrage verschuldigd is in de kosten
      van een verstrekking als bedoeld in de artikelen 6 en 11 van die wet of een vergoeding als bedoeld in de artikelen
      11 en 12 van die wet, kan het Uitvoeringsinstituut werknemersverzekeringen de arbeidsongeschiktheidsuitkering tot
      het bedrag van die bijdrage in plaats van aan de jonggehandicapte zonder diens machtiging betalen aan het College
      voor zorgverzekeringen, genoemd in [artikel 1a van de Ziekenfondswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel1a
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0002460
        artikel: 1a
  - number: '49.2'
    text: |-
      Indien de jonggehandicapte, aan wie een arbeidsongeschiktheidsuitkering is toegekend, in een inrichting ter
      verpleging van geesteszieken of van zwakzinnigen is opgenomen en het Uitvoeringsinstituut werknemersverzekeringen
      van de desbetreffende inrichting of van de gemeente die de opnamekosten betaalt, het verzoek ontvangt om de
      arbeidsongeschiktheidsuitkering aan die inrichting of die gemeente uit te betalen, kan het Uitvoeringsinstituut
      werknemersverzekeringen dat verzoek zonder het stellen van andere voorwaarden inwilligen.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel49
  - number: '49.3'
    text: |-
      Indien het eerste lid toepassing vindt, heeft de in het tweede lid bedoelde bevoegdheid betrekking op het
      gedeelte van de arbeidsongeschiktheidsuitkering, dat niet aan het College voor zorgverzekeringen, genoemd in
      [artikel 1a van de Ziekenfondswet][ref1] wordt betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel1a
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 1a
  - number: '49.4'
    text: |-
      Op de herziening van een beschikking op grond van het eerste lid als gevolg van een wijziging van de verschuldigde
      bijdrage zijn de [artikelen 3:41][ref1] en [3:45 van de Algemene wet bestuursrecht][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '50.1'
    text: |-
      Indien de jonggehandicapte die recht heeft op een arbeidsongeschiktheidsuitkering inkomsten uit arbeid geniet,
      wordt, zolang niet vaststaat of deze arbeid als arbeid, bedoeld in artikel 2, vijfde lid, kan worden aangemerkt, de
      arbeidsongeschiktheidsuitkering niet ingetrokken of herzien, doch wordt de uitkering:
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel50
  - number: 50.1.a
    text: |-
      niet betaald, indien de inkomsten uit arbeid zodanig zijn, dat als die arbeid wel arbeid als bedoeld in artikel 2,
      vijfde lid, zou zijn, niet langer sprake zou zijn van arbeidsongeschiktheid van ten minste 25%; of
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel50
  - number: 50.1.b
    text: |-
      indien onderdeel *a* niet van toepassing is, betaald tot een bedrag ter grootte van de
      arbeidsongeschiktheidsuitkering, zoals deze zou zijn vastgesteld, indien die arbeid wel arbeid als bedoeld in
      artikel 2, vijfde lid, zou zijn.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel50
  - number: '50.2'
    text: |-
      Toepassing van het eerste lid kan ten hoogste plaatsvinden over een aaneengesloten tijdvak van drie jaar, vanaf
      de eerste dag waarover de inkomsten uit arbeid worden genoten. Dit tijdvak wordt niet onderbroken indien gedurende
      perioden van korter dan vier weken geen inkomsten uit arbeid worden genoten. Na afloop van het in de eerste zin
      genoemde tijdvak wordt de in het eerste lid bedoelde arbeid aangemerkt als arbeid, bedoeld in artikel 2, vijfde
      lid.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel50
  - number: '50.3'
    text: |-
      Indien de jonggehandicapte die recht heeft op een arbeidsongeschiktheidsuitkering, inkomsten uit arbeid geniet
      ingevolge een arbeidsovereenkomst als bedoeld in de [hoofdstukken 2 en 3 van de Wet sociale werkvoorziening][ref1],
      vindt het tweede lid geen toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0008903
        hoofdstuk: '2'
  - number: '50.4'
    text: |-
      Maandelijks wordt het geraamde bedrag aan arbeidsongeschiktheidsuitkeringen, die op grond van het derde lid niet
      worden uitbetaald wegens het genieten van dat loon, alsmede van de dientengevolge niet uitbetaalde vakantie-
      uitkeringen, vermeerderd met het bedrag aan premies dat het Uitvoeringsinstituut werknemersverzekeringen bij
      uitbetaling daarover op grond van enige wet verschuldigd zou zijn en dat niet op de uitkeringen in mindering
      kan worden gebracht, aan ’s Rijks kas afgedragen door middel van gelijktijdige verrekening met het aan het
      Uitvoeringsinstituut werknemersverzekeringen toegekende voorschot ten behoeve van uitkeringen, sociale lasten en
      uitkeringskosten voor hetzelfde tijdvak.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel50
  - number: '50.5'
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot het eerste lid. Deze regels hebben in elk geval
      betrekking op:
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel50
  - number: 50.5.a
    text: de gelijkstelling van inkomsten in verband met arbeid met inkomsten als bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel50
  - number: 50.5.b
    text: de gevallen waarin het eerste lid buiten toepassing blijft.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel50
  - number: '50.6'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat het tweede lid geen toepassing vindt ten aanzien van andere vormen
      van arbeid die de jonggehandicapte gaat verrichten.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel50
  - number: '51.1'
    text: |-
      Indien zowel recht bestaat op een arbeidsongeschiktheidsuitkering als op een
      arbeidsongeschiktheidsuitkering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref1]
      of op grond van de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref2], wordt de
      arbeidsongeschiktheidsuitkering slechts uitbetaald, voor zover deze de arbeidsongeschiktheidsuitkering
      op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref3] of op grond van de
      [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref4] overtreft.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0008656
      [ref3]: https://wetten.overheid.nl/BWBR0002524
      [ref4]: https://wetten.overheid.nl/BWBR0008656
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0008656
      - id: ref3
        bwb_id: BWBR0002524
      - id: ref4
        bwb_id: BWBR0008656
  - number: '51.2'
    text: |-
      Het eerste lid is niet van toepassing, indien ter zake van arbeidsongeschiktheid recht ontstaat op
      een uitkering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref1] of op grond van de
      [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref2] en in verband daarmee geen herziening op grond van
      artikel 12 plaatsvindt van de voordien toegekende arbeidsongeschiktheidsuitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0008656
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0008656
  - number: '51.3'
    text: |-
      Indien ter zake van arbeidsongeschiktheid met ingang van dezelfde dag zowel recht bestaat op herziening
      van de arbeidsongeschiktheidsuitkering in verband met de artikelen 11 tot en met 16 als op toekenning van
      een arbeidsongeschiktheidsuitkering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref1]
      of de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref2], wordt de
      arbeidsongeschiktheidsuitkering slechts uitbetaald voor zover deze de arbeidsongeschiktheidsuitkering
      op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref3] of de
      [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref4] overtreft, doch in ieder geval uitbetaald tot de hoogte
      van het bedrag onmiddellijk voorafgaande aan de herziening.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0008656
      [ref3]: https://wetten.overheid.nl/BWBR0002524
      [ref4]: https://wetten.overheid.nl/BWBR0008656
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0008656
      - id: ref3
        bwb_id: BWBR0002524
      - id: ref4
        bwb_id: BWBR0008656
  - number: '51.4'
    text: |-
      Indien na toepassing van het derde lid zowel de arbeidsongeschiktheidsuitkering als de
      arbeidsongeschiktheidsuitkering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref1]
      of de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref2] als gevolg van toe- of
      afneming van de arbeidsongeschiktheid wordt herzien, wordt de arbeidsongeschiktheidsuitkering,
      in afwijking van het eerste lid, uitbetaald voor zover deze het bedrag van de
      arbeidsongeschiktheidsuitkering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref3] of de
      [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref4] overtreft, doch in elk geval uitbetaald tot de hoogte
      van het bedrag onmiddellijk voorafgaande aan de herziening als bedoeld in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0008656
      [ref3]: https://wetten.overheid.nl/BWBR0002524
      [ref4]: https://wetten.overheid.nl/BWBR0008656
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0008656
      - id: ref3
        bwb_id: BWBR0002524
      - id: ref4
        bwb_id: BWBR0008656
  - number: '51.5'
    text: |-
      Indien ter zake van arbeidsongeschiktheid zowel recht bestaat op herziening van de arbeidsongeschiktheidsuitkering
      op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref1] in verband met de artikelen 36 tot en met
      40 van die wet of op herziening op grond van de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref2]
      in verband met de artikelen 12 tot en met 16 van die wet als op toekenning van een
      arbeidsongeschiktheidsuitkering, wordt de arbeidsongeschiktheidsuitkering uitbetaald voor zover deze de herziene
      arbeidsongeschiktheidsuitkering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref3] of de
      [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref4] overtreft.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0008656
      [ref3]: https://wetten.overheid.nl/BWBR0002524
      [ref4]: https://wetten.overheid.nl/BWBR0008656
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0008656
      - id: ref3
        bwb_id: BWBR0002524
      - id: ref4
        bwb_id: BWBR0008656
  - number: '51.6'
    text: |-
      Voor de toepassing van het eerste tot en met het vijfde lid wordt onder arbeidsongeschiktheidsuitkering en
      arbeidsongeschiktheidsuitkering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref1] en de
      [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref2] tevens verstaan de vakantie-uitkering waarop uit hoofde
      van die arbeidsongeschiktheidsuitkeringen recht bestaat, voor zover die vakantie-uitkeringen over dezelfde periode
      zijn berekend.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0008656
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0008656
  - number: '51.7'
    text: |-
      Het eerste tot en met het zesde lid zijn niet van toepassing op degene die een
      arbeidsongeschiktheidsuitkering ontvangt op grond van de vrijwillige verzekering als bedoeld in
      [hoofdstuk VI van de Wet op de arbeidsongeschiktheidsverzekering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#HoofdstukVI
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0002524
        hoofdstuk: VI
  - number: '51.8'
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen nadere en zo nodig afwijkende regels worden gesteld:'
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel51
  - number: 51.8.a
    text: met betrekking tot het eerste lid;
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel51
  - number: 51.8.b
    text: |-
      ter voorkoming of beperking van samenloop van arbeidsongeschiktheidsuitkering met arbeidsongeschiktheidsuitkering
      op grond van andere wetten.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel51
  - number: '51.9'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld ter voorkoming of beperking van samenloop van
      arbeidsongeschiktheidsuitkering met uitkering ingevolge de sociale wetgeving van de Nederlandse Antillen, Aruba of
      van een andere Mogendheid.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel51
  - number: '52.1'
    text: |-
      De betaling van de vakantie-uitkering vindt eenmaal per jaar plaats in de maand mei over de aan die maand
      voorafgaande 12 maanden, of, indien het recht op uitkering eerder dan in de maand mei eindigt, in de desbetreffende
      maand. Het Uitvoeringsinstituut werknemersverzekeringen kan de vakantie-uitkering op een ander tijdstip betalen,
      mits die betaling plaatsvindt over een of meer voorliggende maanden waarover reeds recht op vakantie-uitkering
      bestaat.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel52
  - number: '52.2'
    text: |-
      De artikelen 47, 49 en 53 zijn van overeenkomstige toepassing ten aanzien van de vakantie-uitkering, voor zover bij
      of krachtens deze wet niet anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel52
  - number: '53.1'
    text: |-
      Na het overlijden van de jonggehandicapte, aan wie een arbeidsongeschiktheidsuitkering is toegekend, wordt met
      ingang van de dag na het overlijden, de uitkering in de vorm van een overlijdensuitkering betaald:
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel53
  - number: 53.1.a
    text: aan de langstlevende van de echtgenoten;
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel53
  - number: 53.1.b
    text: |-
      bij ontstentenis van de in onderdeel *a* bedoelde persoon, aan de minderjarige kinderen tot wie de overledene in
      familierechtelijke betrekking stond;
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel53
  - number: 53.1.c
    text: |-
      bij ontstentenis van de in de onderdelen *a* en *b* bedoelde personen aan degenen ten aanzien van wie de overledene
      grotendeels in de kosten van bestaan voorzag en met wie hij in gezinsverband leefde.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel53
  - number: '53.2'
    text: |-
      Met de jonggehandicapte aan wie een arbeidsongeschiktheidsuitkering is toegekend, wordt voor de toepassing van dit
      artikel gelijkgesteld, de jonggehandicapte wiens overlijden heeft plaatsgevonden in de maand waarin hij de leeftijd
      van 65 jaar zou hebben bereikt, doch voor het bereiken van deze leeftijd is overleden, en die uitsluitend op grond
      van artikel 17, eerste lid, onderdeel *a*, over de dag van zijn overlijden geen recht op uitkering had.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel53
  - number: '53.3'
    text: |-
      De overlijdensuitkering is gelijk aan het bedrag van de uitkering over één maand, doch niet over de zaterdagen
      en de zondagen, berekend naar de hoogte van die uitkering op de dag of laatstelijk voor de dag van overlijden van
      de jonggehandicapte.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel53
  - number: '53.4'
    text: |-
      In verband met het overlijden van de jonggehandicapte aan wie een uitkering is toegekend, is artikel 17, eerste
      lid, onderdeel *a*, niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel53
  - number: '53.5'
    text: |-
      De overlijdensuitkering wordt op aanvraag aan de rechthebbende of rechthebbenden, bedoeld in het eerste lid, door
      het Uitvoeringsinstituut werknemersverzekeringen betaald.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel53
  - number: '53.6'
    text: De overlijdensuitkering wordt in een bedrag ineens betaald.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel53
  - number: '53.7'
    text: |-
      Het bedrag van de overlijdensuitkering wordt verminderd met het bedrag aan arbeidsongeschiktheidsuitkering dat over
      na het overlijden gelegen dagen reeds is betaald.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel53
  - number: '54'
    text: |-
      Uitkeringen op grond van deze wet die niet in ontvangst zijn genomen of zijn ingevorderd binnen twee jaren na de
      dag van betaalbaarstelling, worden niet meer betaald.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel54
  - number: '55.1'
    text: |-
      De uitkering die als gevolg van een besluit als bedoeld in artikel 16 onverschuldigd is verstrekt, alsmede
      hetgeen anderszins onverschuldigd is betaald, wordt door het Uitvoeringsinstituut werknemersverzekeringen van de
      belanghebbende teruggevorderd.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel55
  - number: '55.2'
    text: |-
      In afwijking van het eerste lid kan het Uitvoeringsinstituut werknemersverzekeringen besluiten van terugvordering
      of van verdere terugvordering af te zien, indien de belanghebbende:
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel55
  - number: 55.2.a
    text: gedurende vijf jaar volledig aan zijn betalingsverplichtingen heeft voldaan;
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel55
  - number: 55.2.b
    text: |-
      gedurende vijf jaar niet volledig aan zijn betalingsverplichtingen heeft voldaan, maar het achterstallige bedrag
      over die periode, vermeerderd met de daarover verschuldigde wettelijke rente en de op de invordering betrekking
      hebbende kosten, alsnog heeft betaald;
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel55
  - number: 55.2.c
    text: |-
      gedurende vijf jaar geen betalingen heeft verricht en niet aannemelijk is dat hij deze op enig moment zal gaan
      verrichten; of
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel55
  - number: 55.2.d
    text: een bedrag, overeenkomend met ten minste 50% van de restsom in één keer aflost.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel55
  - number: '55.3'
    text: 'De in het tweede lid, onder a en b, genoemde termijn is drie jaar indien:'
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel55
  - number: 55.3.a
    text: |-
      het gemiddeld inkomen van de belanghebbende in die periode de beslagvrije voet bedoeld in de [artikelen 475c][ref1]
      en [475d van het Wetboek van Burgerlijke Rechtsvordering][ref2] niet te boven is gegaan; en


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel475d
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475c
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 475d
  - number: 55.3.b
    text: |-
      de terugvordering niet het gevolg is van het niet of niet behoorlijk nakomen van de verplichting, bedoeld in
      artikel 62.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel55
  - number: '55.4'
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kan het Uitvoeringsinstituut werknemersverzekeringen besluiten
      geheel of gedeeltelijk van terugvordering af te zien.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel55
  - number: '55.5'
    text: |-
      Het besluit tot terugvordering vermeldt hetgeen wordt teruggevorderd, de termijn of termijnen waarbinnen moet
      worden betaald, alsmede dat het besluit bij gebreke van tijdige betaling zal worden tenuitvoergelegd op de wijze
      als omschreven in artikel 56.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel55
  - number: '55.6'
    text: |-
      De persoon van wie of de instelling waarvan wordt teruggevorderd is verplicht desgevraagd aan het
      Uitvoeringsinstituut werknemersverzekeringen de inlichtingen te verstrekken die voor de terugvordering van belang
      zijn.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel55
  - number: '55.7'
    text: |-
      In afwijking van het eerste lid kan het Uitvoeringsinstituut werknemersverzekeringen, onder voorwaarden die Onze
      Minister kan stellen, besluiten van terugvordering af te zien indien het terug te vorderen bedrag een door Onze
      Minister vast te stellen bedrag niet te boven gaat.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel55
  - number: '56.1'
    text: |-
      Het besluit tot terugvordering levert een executoriale titel op in de zin van het [Tweede Boek van het Wetboek van
      Burgerlijke Rechtsvordering](onbekend).
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel56
  - number: '56.2'
    text: |-
      Artikel 46 is van overeenkomstige toepassing, met dien verstande dat indien het gemiddeld inkomen
      van de belanghebbende gedurende drie jaar de beslagvrije voet bedoeld in de [artikelen 475c][ref1] en
      [475d van het Wetboek van Burgerlijke Rechtsvordering][ref2] niet te boven is gegaan, het Uitvoeringsinstituut
      werknemersverzekeringen de aflossingsbedragen lager vaststelt.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel475d
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475c
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 475d
  - number: '57'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de
      [artikelen 55, eerste, tweede, derde, vierde, vijfde en zesde lid][ref1], en [56][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0008657#Artikel56
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '55'
        hoofdstuk: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0008657
        artikel: '56'
        hoofdstuk: '2'
        afdeling: '3'
  - number: '58.1'
    text: |-
      De arbeidsongeschiktheidsuitkering, de verhoging van de arbeidsongeschiktheidsuitkering, bedoeld in artikel 9 en de
      vakantie-uitkering, zijn:
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel58
  - number: 58.1.a
    text: onvervreemdbaar;
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel58
  - number: 58.1.b
    text: niet vatbaar voor verpanding of belening.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel58
  - number: '58.2'
    text: Volmacht tot ontvangst van een uitkering onder welke vorm of welke benaming ook verleend, is steeds herroepelijk.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel58
  - number: '58.3'
    text: Elk beding, strijdig met dit artikel, is nietig.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel58
  - number: '59'
    text: 'Niet vatbaar voor beslag zijn:'
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel59
  - number: 59.a
    text: de verhoging, bedoeld in artikel 9;
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel59
  - number: 59.b
    text: de overlijdensuitkering, bedoeld in artikel 53.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel59
  - number: '60'
    text: |-
      Bij de vaststelling van de schadevergoeding, waarop de jonggehandicapte naar burgerlijk recht aanspraak kan maken
      ter zake van zijn arbeidsongeschiktheid, houdt de rechter rekening met de aanspraken, die hij op grond van deze
      wet heeft.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel60
  - number: '61.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen heeft voor de op grond van deze wet gemaakte kosten verhaal op
      degene, die in verband met het veroorzaken van arbeidsongeschiktheid jegens de jonggehandicapte naar burgerlijk
      recht tot schadevergoeding is verplicht, doch ten hoogste tot het bedrag, waarvoor deze bij het ontbreken van
      de aanspraken krachtens deze wet naar burgerlijk recht aansprakelijk zou zijn, verminderd met een bedrag, gelijk
      aan dat van de schadevergoeding tot betaling waarvan de aansprakelijke persoon jegens de jonggehandicapte naar
      burgerlijk recht is gehouden.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel61
  - number: '61.2'
    text: |-
      Overeenkomstig door Onze Minister te stellen regels kan het Uitvoeringsinstituut werknemersverzekeringen in plaats
      van het bedrag van de periodieke verstrekkingen de contante waarde daarvan vorderen.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel61
  - number: '62.1'
    text: |-
      De jonggehandicapte, diens wettelijke vertegenwoordiger alsmede de instelling bedoeld in artikel 49, waaraan
      arbeidsongeschiktheidsuitkering wordt betaald, zijn verplicht aan het Uitvoeringsinstituut werknemersverzekeringen,
      op zijn verzoek of onverwijld uit eigen beweging mededeling te doen van alle feiten of omstandigheden, waarvan het
      hun redelijkerwijs duidelijk moet zijn dat zij van invloed kunnen zijn op het recht op uitkering, de hoogte van de
      uitkering, het geldend maken van het recht op uitkering of op het bedrag van de uitkering, dat wordt betaald.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel62
  - number: '62.2'
    text: |-
      Op de jonggehandicapte die aanspraak maakt op of recht heeft op vakantie-uitkering alsmede op diens wettelijke
      vertegenwoordiger, rusten overeenkomstige verplichtingen als omschreven in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel62
  - number: '63'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen beheert en administreert afzonderlijk de in artikel
      64 bedoelde middelen tot dekking van de uitgaven en de uitgaven, bedoeld in artikel 65, in de vorm
      van een Arbeidsongeschiktheidsfonds jonggehandicapten dat deel uitmaakt van het Uitvoeringsinstituut
      werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel63
  - number: '64'
    text: |-
      In de middelen tot dekking van de uitgaven ten laste van het Arbeidsongeschiktheidsfonds jonggehandicapten wordt
      voorzien door:
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel64
  - number: 64.a
    text: het Rijk;
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel64
  - number: 64.b
    text: de bedragen, bedoeld in artikel 48;
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel64
  - number: 64.c
    text: de boeten, bedoeld in artikel 40;
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel64
  - number: 64.d
    text: |-
      de bedragen die het Uitvoeringsinstituut werknemersverzekeringen ontvangt met toepassing van verhaal als bedoeld in
      artikel 61.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel64
  - number: '65.1'
    text: 'Ten laste van het Arbeidsongeschiktheidsfonds jonggehandicapten komen:'
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel65
  - number: 65.1.a
    text: de op grond van deze wet te betalen uitkeringen;
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel65
  - number: 65.1.b
    text: |-
      de op grond van enige wet over de uitkeringen op grond van deze wet door het Uitvoeringsinstituut
      werknemersverzekeringen verschuldigde premies die niet op deze uitkeringen in mindering kunnen worden gebracht;
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel65
  - number: 65.1.c
    text: het op grond van artikel 50, vierde lid, aan 's Rijks kas af te dragen bedrag;
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel65
  - number: 65.1.d
    text: |-
      het op grond van [artikel 42 van de Wet op de (re)integratie arbeidsgehandicapten][ref1] aan het Reïntegratiefonds
      af te dragen bedrag;


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel42
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '42'
  - number: 65.1.e
    text: de aan de uitvoering van deze wet verbonden kosten.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel65
  - number: '65.2'
    text: Het Uitvoeringsinstituut werknemersverzekeringen kan nadere regels stellen omtrent het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel65
  - number: '68'
    text: |-
      Bij een besluit op grond van deze wet dat betrekking heeft op het al dan niet bestaan of voortbestaan dan wel de
      mate van arbeidsongeschiktheid is belanghebbende degene op wiens aanspraken het besluit betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel68
  - number: '69.1'
    text: |-
      Onverminderd artikel 69a, worden de beschikkingen op grond van deze wet en de daarop berustende bepalingen gegeven
      binnen een redelijke termijn na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel69
  - number: '69.2'
    text: |-
      De redelijke termijn is in ieder geval verstreken wanneer binnen acht weken na ontvangst van de aanvraag geen
      beschikking is gegeven, noch een kennisgeving als bedoeld in het derde of vierde lid is gedaan.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel69
  - number: '69.3'
    text: |-
      Indien een beschikking niet binnen de termijn van acht weken kan worden gegeven, wordt die termijn met een
      redelijke termijn verlengd en wordt de aanvrager daarvan schriftelijk in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel69
  - number: '69.4'
    text: |-
      Indien in verband met het geven van een beschikking als bedoeld in het eerste lid informatie is gevraagd aan een
      persoon of instantie buiten Nederland en om die reden de beschikking niet binnen acht weken gegeven kan worden,
      wordt die termijn verlengd met ten hoogste zes maanden en wordt de aanvrager van deze verlenging schriftelijk in
      kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel69
  - number: 69a.1
    text: |-
      Een beschikking over de toekenning van een arbeidsongeschiktheidsuitkering, over voortzetting van een
      arbeidsongeschiktheidsuitkering als bedoeld in artikel 28, vierde lid, dan wel over herziening, intrekking of
      heropening van een arbeidsongeschiktheidsuitkering wordt gegeven binnen dertien weken na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel69a
  - number: 69a.2
    text: |-
      Indien in verband met het geven van een beschikking als bedoeld in het eerste lid advies is gevraagd aan een
      deskundige die niet onder verantwoordelijkheid van het Uitvoeringsinstituut werknemersverzekeringen werkzaam is
      en om die reden de beschikking niet binnen dertien weken gegeven kan worden, wordt die termijn verlengd met ten
      hoogste vier weken en wordt de aanvrager van deze verlenging schriftelijk in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel69a
  - number: 69a.3
    text: |-
      Indien in verband met het geven van een beschikking als bedoeld in het eerste lid informatie is gevraagd aan een
      persoon of instantie buiten Nederland en om die reden de beschikking niet binnen dertien weken gegeven kan worden,
      wordt die termijn verlengd met ten hoogste zes maanden en wordt de aanvrager van deze verlenging schriftelijk in
      kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel69a
  - number: 69a.4
    text: |-
      Indien een beschikking als bedoeld in het eerste lid om andere dan de in het tweede en derde lid bedoelde redenen
      niet binnen dertien weken kan worden gegeven, wordt de aanvrager daarvan schriftelijk in kennis gesteld onder
      vermelding van een zo kort mogelijke termijn waarbinnen de beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel69a
  - number: '70.1'
    text: |-
      In afwijking van [artikel 7:10, eerste lid, van de Algemene wet bestuursrecht][ref1] beslist het
      Uitvoeringsinstituut werknemersverzekeringen binnen dertien weken na ontvangst van het bezwaarschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '70.2'
    text: |-
      Indien bezwaar wordt gemaakt tegen een besluit waaraan een medische of arbeidskundige beoordeling ten grondslag
      ligt, beslist het Uitvoeringsinstituut werknemersverzekeringen binnen zeventien weken of, indien het advies vraagt
      aan een deskundige die niet onder zijn verantwoordelijkheid werkzaam is binnen een en twintig weken, na ontvangst
      van het bezwaarschrift.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel70
  - number: '71'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van de behandeling van bezwaarschriften
      tegen besluiten, waaraan een medische of arbeidskundige beoordeling ten grondslag ligt.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel71
  - number: '72.1'
    text: |-
      Tegen uitspraken van de Centrale Raad van Beroep kan ieder der partijen beroep in cassatie instellen ter zake van
      schending of verkeerde toepassing van de artikelen 1, derde tot en met zevende lid, en 3 en de op die artikelen
      berustende bepalingen.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel72
  - number: '72.2'
    text: |-
      Op dit beroep zijn de voorschriften betreffende het beroep in cassatie tegen uitspraken van de gerechtshoven inzake
      beroepen in belastingzaken van overeenkomstige toepassing, waarbij de Centrale Raad van Beroep de plaats inneemt
      van een gerechtshof.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel72
  - number: '73'
    text: |-
      Overtreding van bepalingen van een krachtens deze wet uitgevaardigde algemene maatregel van bestuur voor zover
      uitdrukkelijk als strafbaar feit in de zin van dit artikel aangeduid, wordt gestraft met een hechtenis van ten
      hoogste een maand of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel73
  - number: '74'
    text: |-
      Het recht tot strafvordering vervalt indien het Uitvoeringsinstituut werknemersverzekeringen aan de
      jonggehandicapte of zijn wettelijke vertegenwoordiger ter zake van hetzelfde feit reeds een boete heeft opgelegd.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel74
  - number: '75'
    text: |-
      De in [artikel 73][ref1] bedoelde strafbare feiten worden als overtredingen beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel73
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '73'
        hoofdstuk: '8'
  - number: '76'
    text: |-
      Zolang op grond van artikel XII, onderdeel *a*, van de wet van 21 december 1995, *Stb.* 691, tot nadere
      wijziging van een aantal sociale zekerheidswetten (technische verbeteringen in verband met de wetten TAV,
      TBA en TZ, alsmede enige andere wijzigingen) voor een kind recht bestaat op kinderbijslag ingevolge de
      [Algemene Kinderbijslagwet][ref1], wordt dat kind aangemerkt als studerende in de zin van artikel 5, tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002368
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0002368
  - number: '77'
    text: |-
      De [Algemene termijnenwet][ref1] is niet van toepassing op de tijdvakken van vier weken, genoemd in de artikelen 6,
      tweede en derde lid, 12, derde lid, 13, 14, eerste lid, 15, 19 en 20.


      [ref1]: https://wetten.overheid.nl/BWBR0002448
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0002448
  - number: '78'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel78
  - number: '79'
    text: 'Deze wet wordt aangehaald als: Wet arbeidsongeschiktheidsvoorziening jonggehandicapten.'
    url: https://wetten.overheid.nl/BWBR0008657/2004-01-01#Artikel79
