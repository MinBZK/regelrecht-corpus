preamble:
  text: |-
    Gelet op richtlijn nr. 94/67/EG van de Raad van de Europese Gemeenschappen van 16 december 1994 (PbEG L
    365/34) betreffende de verbranding van gevaarlijke afvalstoffen, op richtlijn nr. 80/68/EEG van de Raad van de
    Europese Gemeenschappen van 17 december 1979 (PbEG L 20/43) betreffende de bescherming van het grondwater tegen
    verontreiniging veroorzaakt door lozing van bepaalde gevaarlijke afvalstoffen, op de artikelen 8.44, 8.45 en
    21.6, zesde lid, van de Wet milieubeheer en, voor zover het betreft artikel 8, op de artikelen 2a en 2d van de Wet
    verontreiniging oppervlaktewateren;

    Besluiten:
  url: https://wetten.overheid.nl/BWBR0009549/2002-12-28#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a

              *vergunning:*


              vergunning als bedoeld in [artikel 8.1 van de Wet milieubeheer][ref1];



            b

              *vergunning voor het lozen van afvalwater:*


              vergunning als bedoeld in [artikel 1 van de Wet verontreiniging oppervlaktewateren][ref2];



            c

              *bevoegd gezag:*


              bestuursorgaan dat bevoegd is een vergunning voor een inrichting te verlenen;



            d

              *bevoegd gezag voor het verlenen van een vergunning voor het lozen van afvalwater:*


              het bestuursorgaan dat op grond van [artikel 3][ref3] of
      [artikel 6, eerste lid, van de Wet verontreiniging oppervlaktewateren][ref4] bevoegd is tot het verlenen van een
      vergunning voor het lozen van afvalwater;



            e

              *infectieus ziekenhuisafval:*


              gevaarlijke afvalstoffen die in de afvalstoffenlijst, bedoeld in
      [artikel 1 van de Regeling Europese afvalstoffenlijst][ref5], worden aangeduid met de afvalstoffencodes 18.01.03*
      of 18.02.02*;



            f

              *C*


              gas- en dampvormige organische stoffen, uitgedrukt als totaal organische koolstof;



            g

              *zware metalen:*


              de scheikundige elementen Sb, As, Pb, Cr, Co, Cu, Mn, Ni, V en Sn, alsmede hun verbindingen, berekend als
      de onderscheidene elementen;



            h

              *cadmium:*


              het scheikundige element Cd, alsmede de Cd-verbindingen, berekend als Cd;



            i

              *kwik:*


              het scheikundige element Hg, alsmede de Hg-verbindingen berekend als Hg;



            j

              *thallium:*


              het scheikundige element Tl, alsmede de Tl-verbindingen berekend als Tl;



            k

              *installatie:*


              elke technische installatie die binnen een inrichting voor de verbranding door oxidatie van gevaarlijke
      afvalstoffen wordt gebruikt; daarbij worden ook installaties voor de voorbehandeling, pyrolyse of andere thermische
      behandelingsprocessen inbegrepen voor zover de producten daarvan vervolgens worden verbrand.



            l

              *bijlage I, II, III:*


              de bij deze regeling behorende [bijlage I][ref6], II onderscheidenlijk III.


