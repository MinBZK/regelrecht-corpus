  - number: '2'
    text: |-
      Deze regeling is van toepassing op:

      a. installaties waar gevaarlijke afvalstoffen worden verbrand die van buiten de inrichting afkomstig zijn, al
      dan niet in combinatie met gevaarlijke afvalstoffen die binnen de inrichting zijn ontstaan, en waarvan de op enig
      moment vrijkomende warmte door de verbranding van gevaarlijke afvalstoffen in de installatie gelijk is aan, dan wel
      meer dan 40% bedraagt van de totale warmte die op dat tijdstip vrijkomt;

      b. installaties waar gevaarlijke afvalstoffen worden verbrand die van buiten de inrichting afkomstig zijn, al
      dan niet in combinatie met gevaarlijke afvalstoffen die binnen de inrichting zijn ontstaan, en waarvan de op enig
      moment vrijkomende warmte door de verbranding van gevaarlijke afvalstoffen in de installatie niet meer dan 40%
      bedraagt van de totale warmte die op dat tijdstip vrijkomt;

      c. installaties waar gevaarlijke afvalstoffen worden verbrand die uitsluitend binnen de inrichting zijn ontstaan,
      en waarvan de op enig moment vrijkomende warmte door de verbranding van gevaarlijke afvalstoffen in de installatie
      gelijk is aan, dan wel meer dan 40% bedraagt van de totale warmte die op dat tijdstip vrijkomt;

      d. installaties waar gevaarlijke afvalstoffen worden verbrand die uitsluitend binnen de inrichting zijn ontstaan,
      en waarvan de op enig moment vrijkomende warmte door de verbranding van gevaarlijke afvalstoffen in de installatie
      niet meer bedraagt dan 40% van de totale warmte die op dat tijdstip vrijkomt.
    url: https://wetten.overheid.nl/BWBR0009549/2002-12-28#Artikel2
  - number: '3'
    text: |-
      1 Deze regeling is niet van toepassing op installaties:

      a. voor het uitsluitend verbranden van kadavers of dierlijke resten;

      b. voor het uitsluitend verbranden van infectieus ziekenhuisafval.

      2 De regeling is voorts niet van toepassing op:

      a. het verbranden van brandbare vloeibare afvalstoffen, waaronder afgewerkte olie, voor zover:

      1º het vloeipunt beneden 30° C ligt,

      2º de calorische waarde meer dan 30 MJ/kg bedraagt,

      3º de concentratie aan extraheerbare organische halogeenverbindingen en polychloorbifenylen de samenstellingsgrens
      uit het Besluit organisch halogeengehalte brandstoffen niet overschrijdt,

      4º deze uitsluitend op grond van het gehalte aan alifatische en naftenische koolwaterstoffen, polycyclische
      aromaten of (alk(en)yl)benzenen worden aangemerkt als gevaarlijke afvalstof,

      5º het zwavelgehalte gelijk is aan dat van gasolie zoals bepaald in het [Besluit zwavelgehalte brandstoffen][ref1],

      6º het asgehalte lager is dan 0,01 gewichtsprocent;

      b. het verbranden van klein chemisch afval, voor zover dat afkomstig is van huishoudens;

      c. het verbranden van gasvormige gevaarlijke afvalstoffen;

      3 Deze regeling is niet van toepassing, indien degene die de inrichting drijft, voor 1 september 1998 het bevoegd
      gezag heeft medegedeeld dat de inrichting binnen vier jaar vanaf het tijdstip van die mededeling buiten bedrijf zal
      worden gesteld en dat zij gedurende die periode niet langer in werking zal zijn dan 16.000 uur.


      [ref1]: https://wetten.overheid.nl/BWBR0002939
    url: https://wetten.overheid.nl/BWBR0009549/2002-12-28#Artikel3
