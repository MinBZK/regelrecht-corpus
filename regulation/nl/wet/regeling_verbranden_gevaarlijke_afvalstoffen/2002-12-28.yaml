  - number: '12'
    text: |-
      1 Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.

      2 Voor inrichtingen waarvoor op de in het vorige lid bedoelde datum of eerder een vergunning is verleend, treedt
      deze regeling, in afwijking van het bepaalde in het eerste lid, in werking met ingang van 1 juli 2000.

      Voor inrichtingen waarvoor op de in het eerste lid bedoelde datum of eerder een vergunning voor het lozen van
      afvalwater is verleend, treedt deze regeling, in afwijking van het bepaalde in het eerste lid, in werking met
      ingang van 1 juli 2000.
    url: https://wetten.overheid.nl/BWBR0009549/2002-12-28#Artikel12
  - number: '13'
    text: 'Deze regeling wordt aangehaald als: Regeling verbranden gevaarlijke afvalstoffen.'
    url: https://wetten.overheid.nl/BWBR0009549/2002-12-28#Artikel13
