  - number: '9'
    text: |-
      Het bevoegd gezag kan in de vergunning voor een inrichting, waarbinnen zich een installatie bevindt als bedoeld in
      [artikel 2][ref1], nadere eisen stellen met betrekking tot voorschriften die in [bijlagen I][ref2], [II][ref3] en
      [III][ref4] zijn opgenomen, voor zover dit uitdrukkelijk in deze bijlagen is vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0009549#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009549
      [ref3]: https://wetten.overheid.nl/BWBR0009549
      [ref4]: https://wetten.overheid.nl/BWBR0009549
    url: https://wetten.overheid.nl/BWBR0009549/2002-12-28#Artikel9
