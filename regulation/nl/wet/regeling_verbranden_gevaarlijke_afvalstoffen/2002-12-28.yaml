  - number: '11'
    text: |-
      1 Voor zover het inrichtingen betreft waarvoor op de in [artikel 12, eerste lid][ref1], bedoelde datum of
      eerder een vergunning is verleend, verbindt het bevoegd gezag de voorschriften die ingevolge dit besluit aan een
      vergunning dienen te worden verbonden, uiterlijk met ingang van 1 juli 2000 aan de vergunning.

      2 Voor zover het inrichtingen betreft waarvoor op de in [artikel 12, eerste lid][ref2], bedoelde datum of eerder
      een vergunning voor het lozen van afvalwater is verleend, verbindt het bevoegd gezag voor het verlenen van een
      vergunning voor het lozen van afvalwater de voorschriften die ingevolge dit besluit aan een vergunning dienen te
      worden verbonden, uiterlijk met ingang van 1 juli 2000 aan de vergunning voor het lozen van afvalwater.


      [ref1]: https://wetten.overheid.nl/BWBR0009549#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0009549#Artikel12
    url: https://wetten.overheid.nl/BWBR0009549/2002-12-28#Artikel11
