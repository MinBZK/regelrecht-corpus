  - number: '7'
    text: |-
      Het bevoegd gezag verbindt aan de vergunning voor een inrichting, waarbinnen zich een installatie bevindt als
      bedoeld in [artikel 2, onder a en c][ref1], voorschriften, inhoudende dat:

      a. terreinen, installaties en gebouwen, waar opslag, overslag, transport of verwerking van gevaarlijke afvalstoffen
      en reststoffen plaatsvindt, een bodembeschermende constructie hebben, die zodanig is ontworpen en uitgevoerd dat
      verontreinigende stoffen als bedoeld in [bijlage III van het Lozingenbesluit bodembescherming][ref2], niet in de
      bodem binnendringen ten gevolge van het in werking hebben van de inrichting;

      b. de goede werking van een bodembeschermende constructie door middel van een monitor-systeem wordt bewaakt;

      c. de kwaliteit van de bodem ter plaatse, voorafgaand aan de onder a genoemde handelingen en onmiddellijk
      na het definitief staken daarvan, wordt vastgelegd door middel van een verkennend bodemonderzoek uitgevoerd
      overeenkomstig het protocol bodemonderzoek milieuvergunning en BSB (SDU 1993), dan wel in een door de Minister
      van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer aangewezen ander protocol of norm van het Nederlands
      Normalisatie-instituut met betrekking tot dat onderwerp;

      d. verspreiding van stoffen die de bodem kunnen verontreinigen, wordt voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0009549#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009092
    url: https://wetten.overheid.nl/BWBR0009549/2002-12-28#Artikel7
