  - number: '4'
    text: |-
      1 Degene die een inrichting drijft, waarbinnen zich een installatie bevindt als bedoeld in
      [artikel 2, onder a][ref1], voldoet aan de voor die installatie geldende voorschriften die zijn opgenomen in
      [bijlagen I][ref2] en [III][ref3].

      2 Degene die een inrichting drijft, waarbinnen zich een installatie bevindt als bedoeld in
      [artikel 2, onder b][ref4], voldoet aan de voor die installatie geldende voorschriften die zijn opgenomen in
      [bijlagen II][ref5] en [III][ref6].

      3 Degene die een inrichting drijft, waarbinnen zich een installatie bevindt als bedoeld in
      [artikel 2, onder c][ref7], voldoet aan de voor die installatie geldende voorschriften die zijn opgenomen in
      [bijlagen I][ref8] en [III][ref9], met uitzondering van [onderdeel 1][ref10] van [bijlage I][ref11].

      4 Degene die een inrichting drijft, waarbinnen zich een installatie bevindt als bedoeld in
      [artikel 2, onder d][ref12], voldoet aan de voor die installatie geldende voorschriften die zijn opgenomen in
      [bijlagen II][ref13] en [III][ref14], met uitzondering van [onderdeel 1][ref15] van [bijlage II][ref16].


