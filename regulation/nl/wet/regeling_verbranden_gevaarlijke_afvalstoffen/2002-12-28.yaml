  - number: '5'
    text: |-
      In een aanvraag om een vergunning voor het oprichten, veranderen of veranderen van de werking of voor het in
      werking hebben van een inrichting waarbinnen zich een installatie bevindt, als bedoeld in [artikel 2][ref1],
      vermeldt de aanvrager:

      a. de maatregelen die worden getroffen om te voldoen aan de voorschriften die zijn opgenomen in [bijlagen I][ref2]
      of [II][ref3] en die van toepassing zijn op die inrichting, en

      b. de meetmethode die wordt gehanteerd om aan de voorschriften voor afzonderlijke metingen die zijn opgenomen in
      [bijlage III][ref4], te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0009549#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009549
      [ref3]: https://wetten.overheid.nl/BWBR0009549
      [ref4]: https://wetten.overheid.nl/BWBR0009549
