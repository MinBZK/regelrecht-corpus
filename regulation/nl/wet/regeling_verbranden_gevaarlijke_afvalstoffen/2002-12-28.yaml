  - number: '6'
    text: |-
      1 Het bevoegd gezag geeft in de vergunning voor een inrichting, waarbinnen zich een installatie bevindt als bedoeld
      in [artikel 2, onder a, b, c, of d][ref1], aan:

      a. de aard, de samenstelling en de hoeveelheid van de gevaarlijke afvalstoffen die als toevoeging in de installatie
      mogen worden verbrand;

      b. de totale capaciteit van de installatie.

      2 Het bevoegd gezag geeft in de vergunning voor een inrichting, waarbinnen zich een installatie bevindt als bedoeld
      in [artikel 2, onder b, of d][ref2], aan:

      a. de minimale en de maximale hoeveelheid gevaarlijke afvalstoffen die als toevoeging in de installatie mogen
      worden verbrand;

      b. de laagste en de hoogste calorische waarde van de gevaarlijke afvalstoffen die als toevoeging in de installatie
      mogen worden verbrand;

      c. de maximale concentratiewaarde van verontreinigende stoffen in de gevaarlijke afvalstoffen die als toevoeging in
      de installatie mogen worden verbrand.


      [ref1]: https://wetten.overheid.nl/BWBR0009549#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009549#Artikel2
    url: https://wetten.overheid.nl/BWBR0009549/2002-12-28#Artikel6
