  - number: '10'
    text: |-
      1 Het bevoegd gezag kan bij zijn beslissing omtrent een vergunning afwijken van voorschriften in de
      [bijlagen I][ref1], [II][ref2] en [III][ref3], voor zover dit uitdrukkelijk in deze bijlagen is vermeld.

      2 Het bevoegd gezag meldt de in het eerste lid bedoelde afwijkingen aan de Minister van Volkshuisvesting,
      Ruimtelijke Ordening en Milieubeheer.


      [ref1]: https://wetten.overheid.nl/BWBR0009549
