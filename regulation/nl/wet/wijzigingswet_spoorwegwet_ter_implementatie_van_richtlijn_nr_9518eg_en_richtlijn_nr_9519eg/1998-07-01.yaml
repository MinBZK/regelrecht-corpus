preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is de Spoorwegwet in overeenstemming te brengen met
    richtlijn nr. 95/18/EG van de Raad van de Europese Unie van 19 juni 1995 betreffende de verlening van vergunningen
    aan spoorwegondernemingen (Pb L 143) en met richtlijn nr. 95/19/EG van de Raad van de Europese Unie van 19
    juni 1995 inzake de toewijzing van spoorweginfrastructuurcapaciteit en de heffing van gebruiksrechten voor de
    infrastructuur (Pb L 143);

    Zo is het, dat Wij , de Raad van State gehoord, en met gemeen overleg der Staten Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0009683/1998-07-01#ArtikelAanhef
articles:
  - number: IV.1
    text: |-
      Ten aanzien van spoorwegondernemingen die op 27 juni 1997 spoorwegvervoerdiensten verrichten, gelden de vereisten
      voor de vergunning op grond van [artikel 29a, eerste lid, van de Spoorwegwet][ref1], vermeld in de onderdelen d en
      e van dat artikellid, eerst met ingang van 27 juni 1998.


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel29a
    url: https://wetten.overheid.nl/BWBR0009683/1998-07-01#ArtikelIV
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: 29a
  - number: IV.2
    text: |-
      Nadere regels vastgesteld bij of krachtens [artikel 31, tweede lid][ref1], dan wel
      [artikel 32 van de Spoorwegwet][ref2] zoals deze luidde voor inwerkingtreding van deze wet
      gelden als nadere regels vastgesteld op grond van [artikel 31, tweede lid][ref3], respectievelijk
      [artikel 32, eerste lid, van de Spoorwegwet][ref4] zoals deze bij inwerkingtreding van deze wet komt te luiden.


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel31
