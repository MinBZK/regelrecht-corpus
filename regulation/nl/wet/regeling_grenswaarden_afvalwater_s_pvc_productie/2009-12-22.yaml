---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_grenswaarden_afvalwater_s_pvc_productie
regulatory_layer: WET
publication_date: '2020-12-03'
valid_from: '2009-12-22'
bwb_id: BWBR0011475
url: https://wetten.overheid.nl/BWBR0011475/2009-12-22
preamble:
  text: |-
    Gelet op OSPAR-Besluit 98/5 inzake de grenswaarden voor emissie en lozing voor de vinylchloridesector bij de
    productie van suspensie-PVC (s-PVC) uit vinylchloride-monomeer (VCM) (OSPAR 98/14/1 para B-8.2 en annex 40) en
    artikel 1a, derde lid, van de Wet verontreiniging oppervlaktewateren;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0011475/2009-12-22#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0011475/2009-12-22#Artikel1
  - number: 1.a
    text: 's-PVC: suspensie-vinylchloride polymeer;'
    url: https://wetten.overheid.nl/BWBR0011475/2009-12-22#Artikel1
  - number: 1.b
    text: 'VCM: vinylchloride-monomeer;'
    url: https://wetten.overheid.nl/BWBR0011475/2009-12-22#Artikel1
  - number: 1.c
    text: 'chloroform: de chemische verbinding CHCl (c.a.s. nr. 67-66-3);'
    url: https://wetten.overheid.nl/BWBR0011475/2009-12-22#Artikel1
  - number: 1.d
    text: 'productie van s-PVC: elk industrieel proces waarbij s-PVC uit VCM wordt geproduceerd;'
    url: https://wetten.overheid.nl/BWBR0011475/2009-12-22#Artikel1
  - number: 1.e
    text: |-
      enkelvoudig bedrijf: bedrijf waar naast de productie van s-PVC uit VCM op dezelfde locatie geen andere chemische
      processen plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0011475/2009-12-22#Artikel1
  - number: 1.f
    text: |-
      samengesteld bedrijf: bedrijf waar naast de productie van s-PVC uit VCM op dezelfde locatie ook andere chemische
      processen plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0011475/2009-12-22#Artikel1
  - number: 1.g
    text: 'bijlage : bij deze regeling behorende bijlage;'
    url: https://wetten.overheid.nl/BWBR0011475/2009-12-22#Artikel1
  - number: 1.h
    text: '*lozen:* brengen van:'
    url: https://wetten.overheid.nl/BWBR0011475/2009-12-22#Artikel1
  - number: 1.h.1°
    text: stoffen in een oppervlaktewaterlichaam;
    url: https://wetten.overheid.nl/BWBR0011475/2009-12-22#Artikel1
  - number: 1.h.2°
    text: |-
      afvalwater of andere afvalstoffen in een openbaar hemelwaterstelsel, een openbaar ontwateringstelsel, een openbaar
      vuilwaterriool of een andere voorziening voor de inzameling en het transport van afvalwater, of
    url: https://wetten.overheid.nl/BWBR0011475/2009-12-22#Artikel1
  - number: 1.h.3°
    text: |-
      stoffen op een zuiveringtechnisch werk met behulp van een werk niet zijnde een voorziening voor de inzameling en
      het transport van afvalwater.
    url: https://wetten.overheid.nl/BWBR0011475/2009-12-22#Artikel1
  - number: 1a
    text: |-
      Deze regeling berust op [artikel 6.3 van het Waterbesluit][ref1] en [artikel 8.40, eerste lid][ref2], in samenhang
      met [artikel 21.6, zesde lid, van de Wet milieubeheer][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0026872#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel21
    url: https://wetten.overheid.nl/BWBR0011475/2009-12-22#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0026872
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '21'
  - number: '2.1'
    text: |-
      Voor een bedrijf dat s-PVC uit VCM produceert, gelden als de hoogst toelaatbare gewichtshoeveelheid en concentratie
      van stoffen voorkomend in afvalwater dat wordt geloosd, de grenswaarden die overeenkomen met de waarden die het
      resultaat zijn van toepassing van de beste bestaande technieken, met dien verstande dat die gewichtshoeveelheid en
      concentratie in ieder geval niet hoger zijn dan de in bijlage I opgenomen grenswaarden.
    url: https://wetten.overheid.nl/BWBR0011475/2009-12-22#Artikel2
  - number: '2.2'
    text: |-
      Een bedrijf dat s-PVC uit VCM produceert kan niet door middel van verdunning van gezuiverd of ongezuiverd
      afvalwater aan de in het eerste lid bedoelde grenswaarden voldoen.
    url: https://wetten.overheid.nl/BWBR0011475/2009-12-22#Artikel2
  - number: '3.1'
    text: |-
      Bij het bemonsteren, meten en analyseren van de concentraties en vrachten voor de stoffen waarvoor in bijlage I
      grenswaarden zijn vastgesteld, wordt ten minste voldaan aan de in bijlage II gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0011475/2009-12-22#Artikel3
  - number: '3.2'
    text: Bij het analyseren wordt gebruikgemaakt van de in bijlage III aangegeven methoden.
    url: https://wetten.overheid.nl/BWBR0011475/2009-12-22#Artikel3
  - number: '4.1'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de datum van uitgifte van het Staatsblad waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0011475/2009-12-22#Artikel4
  - number: '4.2'
    text: |-
      Deze regeling blijft tot 1 januari 2003 buiten toepassing voor een bedrijf dat s-PVC uit VCM produceert en op de
      datum van inwerkingtreding van deze regeling in werking is, tenzij na die datum naar het oordeel van het bevoegd
      gezag de capaciteit voor het produceren van s-PVC uit VCM aanzienlijk is uitgebreid of aanzienlijke technische
      wijzigingen van het productieproces hebben plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0011475/2009-12-22#Artikel4
  - number: '5'
    text: 'Deze regeling wordt aangehaald als: Regeling grenswaarden afvalwater s-PVC-productie.'
    url: https://wetten.overheid.nl/BWBR0011475/2009-12-22#Artikel5
