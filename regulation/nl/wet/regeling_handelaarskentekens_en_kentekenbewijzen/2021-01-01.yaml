---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_handelaarskentekens_en_kentekenbewijzen
regulatory_layer: WET
publication_date: '2025-10-28'
valid_from: '2021-01-01'
bwb_id: BWBR0007073
url: https://wetten.overheid.nl/BWBR0007073/2021-01-01
preamble:
  text: |-
    Gelet op artikel 37, vierde en zevende lid, van de Wegenverkeerswet 1994 en artikel 24, tweede, derde en vierde
    lid, van het Reglement kentekenregistratie;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0007073/2021-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      De aanvrager van een handelaarskentekenbewijs dient te beschikken over een erkenning bedrijfsvoorraad als bedoeld
      in [artikel 62, eerste lid, van de Wegenverkeerswet 1994][ref1] dan wel exploitant te zijn van een onderneming
      waarin in een overdekte en behoorlijk af te sluiten ruimte onder alle weersomstandigheden reparaties en andere
      bewerkingen aan voertuigen kunnen worden uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel62
    url: https://wetten.overheid.nl/BWBR0007073/2021-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '62'
  - number: '1.2'
    text: |-
      Ingeval de aanvraag wordt ingediend door een exploitant als bedoeld in het eerste lid, legt de aanvrager bij de
      aanvraag een uittreksel uit het handelsregister, bedoeld in [artikel 22 van de Handelsregisterwet 2007][ref1], over
      waaruit blijkt dat een onderneming wordt uitgeoefend als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel22
    url: https://wetten.overheid.nl/BWBR0007073/2021-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '22'
  - number: '2.1'
    text: |-
      Het is degene aan wie een handelaarskenteken is opgegeven niet toegestaan meer dan vijf kentekenplaten waarop dat
      kenteken is aangebracht ter beschikking te hebben, met dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0007073/2021-01-01#Artikel2
  - number: 2.1.a
    text: |-
      indien het kenteken is aangebracht op kentekenplaten volgens de [modellen 27.11 tot en met 27.14, van de bijlage
      bij de Regeling kentekens en kentekenplaten](onbekend), beschikt mag worden over ten hoogste twee kentekenplaten
      per model wat betreft de modellen 27.11, 27.12 en 27.14 en over ten hoogste één kentekenplaat van het [model 27.13
      van de bijlage bij de Regeling kentekens en kentekenplaten](onbekend);
    url: https://wetten.overheid.nl/BWBR0007073/2021-01-01#Artikel2
  - number: 2.1.b
    text: |-
      indien een kenteken is aangebracht bevattende de lettercombinatie OA, beschikt mag worden over ten hoogste twee
      kentekenplaten met deze combinatie en wel één volgens model 27.11 en één volgens model 27.12, van de [bijlage bij
      de Regeling kentekens en kentekenplaten](onbekend);
    url: https://wetten.overheid.nl/BWBR0007073/2021-01-01#Artikel2
  - number: 2.1.c
    text: |-
      indien een kenteken is aangebracht bevattende de lettercombinatie HC, beschikt mag worden over ten hoogste twee
      kentekenplaten met deze combinatie, en wel één volgens model 30.5 en één volgens model 30.6, van de [bijlage bij de
      Regeling kentekens en kentekenplaten](onbekend).
    url: https://wetten.overheid.nl/BWBR0007073/2021-01-01#Artikel2
  - number: '2.2'
    text: |-
      Degene aan wie een handelaarskenteken is opgegeven vernietigt de handelaarskentekenplaten terstond nadat het
      bijbehorende kentekenbewijs ongeldig is verklaard dan wel is verloren of teniet gegaan.
    url: https://wetten.overheid.nl/BWBR0007073/2021-01-01#Artikel2
  - number: '2.3'
    text: |-
      Bij een motorrijtuig of een aanhangwagen voorzien van een handelaarskentekenplaat, dient het bijbehorende
      kentekenbewijs aanwezig te zijn.
    url: https://wetten.overheid.nl/BWBR0007073/2021-01-01#Artikel2
  - number: '3'
    text: |-
      Wanneer gebruik wordt gemaakt van het handelaarskenteken, is het niet toegestaan om goederen te vervoeren, tenzij
      dit aantoonbaar gebeurt in het kader van beproeving van aan het voertuig verrichte of te verrichten werkzaamheden.
      In dat geval moeten de goederen op het adres, waar deze zijn ingeladen, ook worden uitgeladen.
    url: https://wetten.overheid.nl/BWBR0007073/2021-01-01#Artikel3
  - number: '4'
    text: |-
      Wanneer geen gebruik wordt gemaakt van het handelaarskentekenbewijs, dient dit bewijs alsmede de kentekenplaten
      waarop het handelaarskenteken is aangebracht, te worden bewaard in een goed afsluitbare voorziening.
    url: https://wetten.overheid.nl/BWBR0007073/2021-01-01#Artikel4
  - number: '5'
    text: |-
      Degene aan wie het handelaarskenteken is opgegeven dient de in het kader van het gebruik van dat kenteken van
      belang zijnde wijzigingen in de bedrijfsactiviteit of de bedrijfsgegevens onverwijld schriftelijk te melden aan de
      Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0007073/2021-01-01#Artikel5
  - number: '6.1'
    text: |-
      Het toezicht als bedoeld in [artikel 37, vierde lid, van de Wegenverkeerswet 1994][ref1], bestaat uit het
      uitvoeren van periodieke controles. Deze controles hebben in ieder geval betrekking op de omstandigheid of
      nog wordt voldaan aan het bepaalde in [artikel 1][ref2], op het voldoen aan de overige voorschriften van deze
      regeling alsmede op het voldoen aan de voorschriften inzake het gebruik van handelaarskentekens als bedoeld in
      [artikel 44 van het Kentekenreglement][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0007073#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0006951#Artikel44
    url: https://wetten.overheid.nl/BWBR0007073/2021-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '37'
      - id: ref2
        bwb_id: BWBR0007073
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0006951
        artikel: '44'
  - number: '6.2'
    text: |-
      De in het eerste lid bedoelde controles kunnen frequenter plaatsvinden indien het vermoeden bestaat dat degene aan
      wie het handelaarskenteken is opgegeven, niet voldoet aan de in het eerste lid bedoelde voorschriften.
    url: https://wetten.overheid.nl/BWBR0007073/2021-01-01#Artikel6
  - number: '6.3'
    text: |-
      Vanaf de buitenkant van het bedrijf is op een door de Dienst Wegverkeer vastgestelde en in de Staatscourant
      bekendgemaakte wijze zichtbaar dat een handelaarskenteken is opgegeven.
    url: https://wetten.overheid.nl/BWBR0007073/2021-01-01#Artikel6
  - number: '7'
    text: |-
      Handelaarskentekenbewijzen die vóór 1 januari 1995 zijn afgegeven ter zake van de opgave van handelaarskentekens,
      bevattende de lettergroep FH of HF, verliezen op deze datum hun geldigheid.
    url: https://wetten.overheid.nl/BWBR0007073/2021-01-01#Artikel7
  - number: '8.1'
    text: |-
      Voor 1 januari 1995 afgegeven bijzondere registratiebewijzen blijven geldig tot een bij ministeriële regeling
      vastgesteld tijdstip.
    url: https://wetten.overheid.nl/BWBR0007073/2021-01-01#Artikel8
  - number: '8.2'
    text: |-
      Voor wat betreft de afgifte en het gebruik van bijzondere registratiebewijzen is het bepaalde ten
      aanzien van de afgifte en het gebruik van handelaarskentekenbewijzen in de [artikelen 43][ref1],
      [44, eerste, derde en vierde lid][ref2], en [45 van het Kentekenreglement][ref3] alsmede in de onderhavige regeling
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel44
      [ref3]: https://wetten.overheid.nl/BWBR0006951#Artikel45
    url: https://wetten.overheid.nl/BWBR0007073/2021-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '43'
      - id: ref2
        bwb_id: BWBR0006951
        artikel: '44'
      - id: ref3
        bwb_id: BWBR0006951
        artikel: '45'
  - number: '9'
    text: 'Ingetrokken worden:'
    url: https://wetten.overheid.nl/BWBR0007073/2021-01-01#Artikel9
  - number: 9.a
    text: |-
      de regeling van de Minister van Verkeer en Waterstaat van 24 april 1992, nr. RV 121204, Hoofddirectie van de
      Waterstaat, houdende vaststelling van voorschriften inzake de aanvraag en afgifte van handelaarskentekenbewijzen
      (Stcrt. 83);
    url: https://wetten.overheid.nl/BWBR0007073/2021-01-01#Artikel9
  - number: 9.b
    text: |-
      de regeling van de directeur van de Rijksdienst voor het Wegverkeer van 23 maart 1992, nr. F10220004/JZ, houdende
      vaststelling van regels voor het gebruik van handelaarskentekenbewijzen (Stcrt. 83);
    url: https://wetten.overheid.nl/BWBR0007073/2021-01-01#Artikel9
  - number: 9.c
    text: |-
      de regeling van de Minister van Verkeer en Waterstaat van 24 april 1992, nr. RV 121206, Hoofddirectie
      van de Waterstaat, houdende vaststelling van voorschriften inzake de aanvraag en afgifte van formulieren
      handelaarsvrijwaringsbewijzen (Stcrt. 83);
    url: https://wetten.overheid.nl/BWBR0007073/2021-01-01#Artikel9
  - number: 9.d
    text: |-
      de regeling van de directeur van de Rijksdienst voor het Wegverkeer van 23 maart 1992, nr. F07220012/JZ, houdende
      vaststelling van regels voor het gebruik van handelaarsvrijwaringsbewijzen (Stcrt. 83).
    url: https://wetten.overheid.nl/BWBR0007073/2021-01-01#Artikel9
  - number: '10'
    text: Deze regeling treedt in werking met ingang van 1 januari 1995.
    url: https://wetten.overheid.nl/BWBR0007073/2021-01-01#Artikel10
  - number: '11'
    text: |-
      Deze regeling wordt aangehaald als: Regeling handelaarskentekens en -kentekenbewijzen. Deze regeling zal met de
      toelichting in de Staatscourant worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0007073/2021-01-01#Artikel11
