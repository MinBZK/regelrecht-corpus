preamble:
  text: |-
    Gelet op artikel 37, vierde en zevende lid, van de Wegenverkeerswet 1994 en artikel 24, tweede, derde en vierde
    lid, van het Reglement kentekenregistratie;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0007073/2021-01-05#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 De aanvrager van een handelaarskentekenbewijs dient te beschikken over een erkenning bedrijfsvoorraad als bedoeld
      in [artikel 62, eerste lid, van de Wegenverkeerswet 1994][ref1] dan wel exploitant te zijn van een onderneming
      waarin in een overdekte en behoorlijk af te sluiten ruimte onder alle weersomstandigheden reparaties en andere
      bewerkingen aan voertuigen kunnen worden uitgevoerd.

      2 Ingeval de aanvraag wordt ingediend door een exploitant als bedoeld in het eerste lid, legt de aanvrager bij de
      aanvraag een uittreksel uit het handelsregister, bedoeld in [artikel 22 van de Handelsregisterwet 2007][ref2], over
      waaruit blijkt dat een onderneming wordt uitgeoefend als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0021777#Artikel22
    url: https://wetten.overheid.nl/BWBR0007073/2021-01-05#Artikel1
    references:
