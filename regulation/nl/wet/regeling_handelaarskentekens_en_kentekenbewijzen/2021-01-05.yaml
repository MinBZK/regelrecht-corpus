        artikel: '22'
  - number: 1a
    text: |-
      Handelaarskentekens bestaan uit de lettercombinatie, genoemd in [artikel 3 van het Kentekenreglement][ref1], en
      twee groepen van twee cijfers of één cijfer en één groep van drie cijfers.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel3
    url: https://wetten.overheid.nl/BWBR0007073/2021-01-05#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '3'
  - number: '2'
    text: |-
      1 Het is degene aan wie een handelaarskenteken is opgegeven niet toegestaan meer dan vijf kentekenplaten waarop dat
      kenteken is aangebracht ter beschikking te hebben, met dien verstande dat:

      a. indien het kenteken is aangebracht op kentekenplaten volgens de [modellen 27.11 tot en met 27.14, van de bijlage
      bij de Regeling kentekens en kentekenplaten](onbekend), beschikt mag worden over ten hoogste twee kentekenplaten
      per model wat betreft de modellen 27.11, 27.12 en 27.14 en over ten hoogste één kentekenplaat van het [model 27.13
      van de bijlage bij de Regeling kentekens en kentekenplaten](onbekend);

      b. indien een kenteken is aangebracht bevattende de lettercombinatie OA of LH, beschikt mag worden over ten hoogste
      drie kentekenplaten met deze combinatie en wel één volgens model 27.11, één volgens model 27.12 en één volgens
      model 27.13 van de [bijlage bij de Regeling kentekens en kentekenplaten](onbekend);

      c. indien een kenteken is aangebracht bevattende de lettercombinatie HC, beschikt mag worden over ten hoogste twee
      kentekenplaten met deze combinatie, en wel één volgens model 30.5 en één volgens model 30.6, van de [bijlage bij de
      Regeling kentekens en kentekenplaten](onbekend).

      2 Degene aan wie een handelaarskenteken is opgegeven vernietigt de handelaarskentekenplaten terstond nadat het
      bijbehorende kentekenbewijs ongeldig is verklaard dan wel is verloren of teniet gegaan.

      3 Bij een motorrijtuig of een aanhangwagen voorzien van een handelaarskentekenplaat, dient het bijbehorende
      kentekenbewijs aanwezig te zijn.
    url: https://wetten.overheid.nl/BWBR0007073/2021-01-05#Artikel2
  - number: '3'
    text: |-
      Wanneer gebruik wordt gemaakt van het handelaarskenteken, is het niet toegestaan om goederen te vervoeren, tenzij
      dit aantoonbaar gebeurt in het kader van beproeving van aan het voertuig verrichte of te verrichten werkzaamheden.
      In dat geval moeten de goederen op het adres, waar deze zijn ingeladen, ook worden uitgeladen.
    url: https://wetten.overheid.nl/BWBR0007073/2021-01-05#Artikel3
  - number: '4'
    text: |-
      Wanneer geen gebruik wordt gemaakt van het handelaarskentekenbewijs, dient dit bewijs alsmede de kentekenplaten
      waarop het handelaarskenteken is aangebracht, te worden bewaard in een goed afsluitbare voorziening.
    url: https://wetten.overheid.nl/BWBR0007073/2021-01-05#Artikel4
  - number: '5'
    text: |-
      Degene aan wie het handelaarskenteken is opgegeven dient de in het kader van het gebruik van dat kenteken van
      belang zijnde wijzigingen in de bedrijfsactiviteit of de bedrijfsgegevens onverwijld schriftelijk te melden aan de
      Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0007073/2021-01-05#Artikel5
  - number: '6'
    text: |-
      1 Het toezicht als bedoeld in [artikel 37, vierde lid, van de Wegenverkeerswet 1994][ref1], bestaat uit het
      uitvoeren van periodieke controles. Deze controles hebben in ieder geval betrekking op de omstandigheid of
      nog wordt voldaan aan het bepaalde in [artikel 1][ref2], op het voldoen aan de overige voorschriften van deze
      regeling alsmede op het voldoen aan de voorschriften inzake het gebruik van handelaarskentekens als bedoeld in
      [artikel 44 van het Kentekenreglement][ref3].

      2 De in het eerste lid bedoelde controles kunnen frequenter plaatsvinden indien het vermoeden bestaat dat degene
      aan wie het handelaarskenteken is opgegeven, niet voldoet aan de in het eerste lid bedoelde voorschriften.

      3 Vanaf de buitenkant van het bedrijf is op een door de Dienst Wegverkeer vastgestelde en in de Staatscourant
      bekendgemaakte wijze zichtbaar dat een handelaarskenteken is opgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel37
