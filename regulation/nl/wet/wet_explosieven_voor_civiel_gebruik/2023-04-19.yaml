  - number: 35a
    text: |-
      1 Explosieven die voldoen aan de wet zoals deze vóór de inwerkingtreding van de wet tot wijziging van de Wet
      explosieven voor civiel gebruik ter implementatie van richtlijn nr. 2014/28/EU van het Europees Parlement en de
      Raad van 26 februari 2014 betreffende de harmonisatie van de wetgevingen van de lidstaten inzake het op de markt
      aanbieden van en de controle op explosieven voor civiel gebruik (herschikking) (PbEU 2014, L 96) (Stb. 2016,
      nr. 374) luidde en die vóór dat tijdstip in de handel zijn gebracht, mogen ook na dat tijdstip op de markt worden
      aangeboden.

      2 Conformiteitsverklaringen, verstrekt uit hoofde van richtlijn 93/15/EEG van de Raad van de Europese
      Gemeenschappen van 5 april 1993 betreffende de harmonisatie van de bepalingen inzake het in de handel brengen van
      en controle op explosieven voor civiel gebruik (PbEG 1993, L 121), blijven hun geldigheid behouden.
    url: https://wetten.overheid.nl/BWBR0006803/2023-04-19#Artikel35a
  - number: '36'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0006803/2023-04-19#Artikel36
  - number: '37'
    text: 'Deze wet wordt aangehaald als: Wet explosieven voor civiel gebruik.'
