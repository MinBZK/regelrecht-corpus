        artikel: 5:12
  - number: '25'
    text: |-
      1 Ter uitvoering van [verordening 2019/1020](32920R2019) kan Onze Minister, indien er geen andere doeltreffende
      middelen voorhanden zijn om een ernstig risico als bedoeld in artikel 3, onderdeel 20, van [verordening 2019/1020]
      (32920R2019), gevormd door een explosief of een bijzonder explosief, weg te nemen, een zelfstandige last opleggen
      aan degene die daartoe in staat is, om inhoud te verwijderen van of de toegang te beperken tot een online
      interface als bedoeld in artikel 3, onderdeel 15, van [verordening 2019/1020](32920R2019) of opdracht te geven
      tot de duidelijke weergave van een waarschuwing voor eindgebruikers als bedoeld in artikel 3, onderdeel 21, van
      [verordening 2019/1020](32920R2019), wanneer zij zich toegang verschaffen tot een online interface.

      2 Indien niet binnen de daarvoor gestelde termijn aan een last als bedoeld in het eerste lid is voldaan, kan Onze
      Minister, een zelfstandige last opleggen aan een aanbieder van diensten van de informatiemaatschappij, om alle
      maatregelen te treffen die redelijkerwijs van hem kunnen worden gevergd om de toegang tot een online interface
      te beperken, onder meer door een daarvoor in aanmerking komende derde te verzoeken dergelijke maatregelen uit te
      voeren.

      3 Degene tot wie een zelfstandige last als bedoeld in het eerste of tweede lid is gericht, handelt overeenkomstig
      die last.

      4 Op grond van het eerste of tweede lid kan geen zelfstandige last worden opgelegd die leidt tot het blokkeren of
      filteren van internetverkeer.

      5 Voor een zelfstandige last als bedoeld in het eerste of tweede lid is voorafgaande machtiging vereist van de
      rechter-commissaris. In het verzoek om afgifte van een machtiging worden de proportionaliteit en subsidiariteit
      van het verzoek gemotiveerd. De rechter-commissaris kan het openbaar ministerie horen alvorens te beslissen.
      [Artikel 171 van het Wetboek van Strafvordering][ref1] is van overeenkomstige toepassing.

      6 Tegen de beslissing van de rechter-commissaris, bedoeld in het vijfde lid, staat voor zover het verzoek om een
      machtiging niet is toegewezen, voor Onze Minister, binnen veertien dagen beroep open bij de rechtbank, sector
      strafrecht.

      7 Onze Minister maakt de machtiging van de rechter-commissaris gelijktijdig met de zelfstandige last, bedoeld in
      het eerste of tweede lid, bekend.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel171
