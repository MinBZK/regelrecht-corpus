  - number: 33c
    text: |-
      Bij veroordeling wegens een der misdrijven omschreven in [artikel 33b][ref1] kan ontzetting van het in
      [artikel 28, eerste lid, onder 3°, van het Wetboek van Strafrecht][ref2] vermelde recht worden uitgesproken.


