  - number: '24'
    text: |-
      1 De ingevolge [artikel 22, eerste lid][ref1], aangewezen toezichthoudende ambtenaren zijn bevoegd om, ter
      uitvoering van [verordening 2019/1020](32920R2019) onder verstrekking van onjuiste of onvolledige gegevens met
      betrekking tot hun identiteit en hoedanigheid, explosieven en bijzondere explosieven te verkrijgen ten behoeve van
      het controleren van de kenmerken van een explosief of een bijzonder explosief en de verificatie van de documenten
      en de hieraan gerelateerde handelingen te verrichten voor zover dat voor de vervulling van hun taak noodzakelijk
      is. [Artikel 5:12, tweede lid, van de Algemene wet bestuursrecht][ref2] is niet van toepassing.

      2 De ambtenaar die gebruik heeft gemaakt van de bevoegdheid bedoeld in het eerste lid, maakt daarvan een
      schriftelijk verslag op waarin hij vermeldt:

      a. zijn naam of nummer en hoedanigheid;

      b. de motivering van de noodzaak tot uitoefening van de bevoegdheid;

      c. de voorschriften op de naleving waarvan wordt toegezien;

      d. het adres, waaronder indien van toepassing, het elektronische adres waar het explosief of het bijzondere
      explosief, is verkregen en voor zover bekend, de omschrijving van de betrokken marktdeelnemer;

      e. de onjuiste of onvolledige gegevens die zijn verstrekt bij de verkrijging van het explosief of het bijzondere
      explosief;

      f. de wijze waarop en het tijdvak waarin de handelingen hebben plaatsgevonden;

      g. wat de uitkomst is van het onderzoek van het verkregen explosief of bijzondere explosief.


      [ref1]: https://wetten.overheid.nl/BWBR0006803#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel512
    url: https://wetten.overheid.nl/BWBR0006803/2023-04-19#Artikel24
