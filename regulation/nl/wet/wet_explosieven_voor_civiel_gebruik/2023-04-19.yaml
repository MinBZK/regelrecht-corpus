  - number: '13'
    text: |-
      1 In afwijking van [artikel 11, eerste lid][ref1], dient een vergunning als bedoeld in
      [artikel 10, eerste lid, onder a][ref2], voor het overbrengen van explosieven ten behoeve van de mijnbouw waarop de
      [Mijnbouwwet][ref3] van toepassing is, te worden aangevraagd bij Onze Minister van Economische Zaken, Landbouw en
      Innovatie. De aanvrager voegt bij zijn aanvrage de in artikel 11, vijfde lid, eerste alinea, van richtlijn 2014/28/
      EU bedoelde gegevens.

      2 De [artikelen 11, tweede en derde lid][ref4], en [12][ref5] zijn van toepassing, met dien verstande dat Onze
      Minister van Economische Zaken in de plaats treedt van burgemeester en wethouders.


