  - number: '12'
    text: |-
      Indien naar het oordeel van burgemeester en wethouders met betrekking tot overbrenging bijzondere beveiligingseisen
      gelden of nodig zijn:

      a. bevat een vergunning als bedoeld in [artikel 10, eerste lid, onderdeel a][ref1], de in artikel 11, vijfde lid,
      eerste alinea, van richtlijn 2014/28/EU bedoelde gegevens; en

      b. dient voordat wordt aangevangen met een overbrenging waarvoor vergunning is verleend, aan burgemeester en
      wethouders van die overbrenging kennisgeving te worden gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006803#Artikel10
