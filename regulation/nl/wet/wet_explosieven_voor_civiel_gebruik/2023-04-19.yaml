  - number: '14'
    text: |-
      De houder van een in Nederland afgegeven vergunning of van een in een andere lid-staat van de Europese Unie of een
      andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte afgegeven vergunning voor
      het overbrengen alsmede de houder van een afgegeven toestemming voor de overbrenging van explosieven die eindigt in
      een andere staat, zijn verplicht deze explosieven tot aan de plaats waar de overbrenging eindigt, onderscheidenlijk
      het verlaten van het grondgebied van Nederland, te doen vergezellen van de vergunning, onderscheidenlijk het bewijs
      van toestemming.
    url: https://wetten.overheid.nl/BWBR0006803/2023-04-19#Artikel14
  - number: '15'
    text: |-
      1 De toestemming, bedoeld in [artikel 10, eerste lid, onder b, en tweede lid][ref1], dient te worden aangevraagd
      door de voor de overbrenging verantwoordelijke persoon. Deze voegt bij zijn aanvraag de in artikel 11, vijfde lid,
      eerste alinea, van richtlijn 2014/28/EU bedoelde gegevens. De toestemming wordt verleend door Onze Minister.

      2 De gegevens, genoemd in artikel 11, vijfde lid, onderdeel a, van richtlijn 2014/28/EU zijn voldoende
      gedetailleerd om het voor Onze Minister mogelijk te maken om:

      a. met de betrokken marktdeelnemers contact op te nemen; en

      b. de bevestiging te krijgen dat de betrokken marktdeelnemers gemachtigd zijn om de zending in ontvangst te nemen.

      3 Voor de overbrenging van explosieven binnen Nederland wordt, indien die overbrenging in een andere lidstaat
      van de Europese Unie eindigt, het als bijlage bij beschikking nr. 2004/388/EG van de Commissie van de Europese
      Gemeenschappen van 15 april 2004 (PbEU L 120) opgenomen document als model gehanteerd voor de toestemming.

      4 Onze Minister kan regels stellen met betrekking tot het melden van de overbrenging van explosieven.

      5 De [artikelen 11, tweede lid, onder a, en derde lid][ref2], en [12][ref3] zijn van overeenkomstige toepassing.

      6 Op een wijziging van de in het tweede lid genoemde beschikking is [artikel 11, vijfde lid][ref4], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006803#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0006803#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0006803#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0006803#Artikel11
