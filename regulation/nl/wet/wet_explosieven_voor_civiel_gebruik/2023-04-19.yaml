  - number: '2'
    text: |-
      1 Deze wet is niet van toepassing op:

      a. explosieven die bestemd zijn om te worden gebruikt door de krijgsmacht of de politie;

      b. pyrotechnische artikelen, die onder het toepassingsgebied van Richtlijn 2013/29/EU van het Europees Parlement
      en de Raad van 12 juni 2013 betreffende de harmonisatie van de wetgevingen van de lidstaten inzake het op de markt
      aanbieden van pyrotechnische artikelen (herschikking) (PbEU 2013, L 178) vallen; en

      c. munitie als bedoeld in [artikel 1, eerste lid, onder 4°, van de Wet wapens en munitie][ref1];

      2 De [artikelen 3, eerste lid, onderdeel d, en derde lid][ref2], en
      [21, tweede lid, onderdeel a tot en met f, derde en vierde lid][ref3], zijn niet van toepassing op bijzondere
      explosieven.

      3 Een wijziging van de in het eerste lid genoemde richtlijn met gevolgen voor de daarbij als zodanig aangewezen
      pyrotechnische artikelen gaat voor de toepassing van deze wet en de daarop berustende bepalingen gelden met ingang
      van de dag waarop aan de desbetreffende wijzigingsrichtlijn uitvoering moet zijn gegeven, tenzij bij ministerieel
      besluit, dat in de Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006803#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0006803#Artikel21
    url: https://wetten.overheid.nl/BWBR0006803/2023-04-19#Artikel2
    references:
      - id: ref1
