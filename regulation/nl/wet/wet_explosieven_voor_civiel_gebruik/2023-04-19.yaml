  - number: '9'
    text: |-
      Onze Minister neemt eveneens maatregelen als bedoeld in [artikel 8][ref1] met betrekking tot explosieven waarop de
      CE-markering is aangebracht en die overeenkomstig hun bestemming worden gebruikt, indien deze explosieven naar zijn
      oordeel de veiligheid in gevaar kunnen brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0006803#Artikel8
    url: https://wetten.overheid.nl/BWBR0006803/2023-04-19#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006803
        artikel: '8'
        hoofdstuk: II
        paragraaf: '4'
  - number: '10'
    text: |-
      1 Het is verboden explosieven over te brengen, indien de desbetreffende overbrenging in Nederland eindigt zonder
      dat:

      a. aan de verkrijger van deze explosieven daartoe vergunning is verleend, en

      b. voor zover de explosieven afkomstig zijn uit een andere lidstaat van de Europese Unie, voor het deel van die
      overbrenging dat binnen Nederland plaatsvindt toestemming is verleend.

      2 Het is verboden explosieven over te brengen, indien de desbetreffende overbrenging in een ander land dan
      Nederland eindigt, zonder dat voor het deel van die overbrenging dat binnen Nederland plaatsvindt toestemming is
      verleend.
    url: https://wetten.overheid.nl/BWBR0006803/2023-04-19#Artikel10
  - number: '11'
    text: |-
      1 Een vergunning als bedoeld in [artikel 10, eerste lid, onder a][ref1] dient te worden aangevraagd door de
      verkrijger van de over te brengen explosieven bij burgemeester en wethouders van de gemeente waarin de overbrenging
      eindigt. De aanvrager voegt bij zijn aanvrage de in artikel 11, vijfde lid, eerste alinea, van richtlijn 2014/28/EU
      bedoelde gegevens.

      2 Burgemeester en wethouders gaan aan de hand van de in het eerste lid bedoelde gegevens na of:

      a. voor overbrengingen waarvoor vergunning wordt aangevraagd specifieke beveiligingseisen gelden of nodig zijn en

      b. degene voor wie de explosieven bestemd zijn houder is van een erkenning als bedoeld in [artikel 17][ref2].

      3 Indien naar het oordeel van burgemeester en wethouders geen specifieke beveiligingseisen gelden:

      a. wordt in de vergunning uitsluitend melding gemaakt van het besluit dat zij hebben genomen na de controle op de
      voorgenomen overbrengingen;

      b. kan zonder voorafgaande kennisgeving aan hen met de onder *a* bedoelde overbrengingen worden aangevangen en

      c. wordt de vergunning verleend voor een door hen daarbij te stellen termijn.

      4 Voor de overbrenging van explosieven die afkomstig zijn uit een andere lidstaat van de Europese Unie wordt,
      indien die overbrenging in Nederland eindigt, het als bijlage bij beschikking nr. 2004/388/EG van de Commissie van
      de Europese Gemeenschappen van 15 april 2004 (PbEU L 120) opgenomen document als model gehanteerd voor zowel de
      vergunning als de toestemming.

      5 Een wijziging van de in het vierde lid genoemde beschikking met gevolgen voor het daarbij als bijlage opgenomen
      document gaat voor de toepassing van het vierde lid gelden met ingang van de dag waarop aan de betrokken
      beschikking uitvoering moet zijn gegeven, tenzij bij ministerieel besluit, dat in de Staatscourant wordt
      bekendgemaakt, een ander tijdstip wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006803#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0006803#Artikel17
    url: https://wetten.overheid.nl/BWBR0006803/2023-04-19#Artikel11
