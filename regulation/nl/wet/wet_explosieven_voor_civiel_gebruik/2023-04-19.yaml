  - number: '16'
    text: |-
      Degenen voor wie de explosieven bestemd zijn of ondernemingen uit de sector explosieven zenden op verzoek van
      burgemeester en wethouders van gemeenten waarin overbrengingen van explosieven eindigen onderscheidenlijk, indien
      het een overbrenging als bedoeld in [artikel 13][ref1] betreft, op verzoek van Onze Minister van Economische
      Zaken, Landbouw en Innovatie, de bevoegde autoriteit van de lid-staat van de Europese Unie of de andere staat
      die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte waar de overbrengingen aanvangen
      onderscheidenlijk de bevoegde autoriteit van de lid-staat over welk grondgebied de overbrenging plaatsvindt de te
      hunner beschikking staande relevante gegevens toe over de overbrengingen.


      [ref1]: https://wetten.overheid.nl/BWBR0006803#Artikel13
    url: https://wetten.overheid.nl/BWBR0006803/2023-04-19#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0006803
        artikel: '13'
        hoofdstuk: III
        paragraaf: '1'
  - number: '17'
    text: |-
      1 Het is verboden zonder erkenning explosieven te vervaardigen, op te slaan, te gebruiken, over te brengen of te
      verhandelen.

      2 De erkenning heeft een geldigheidsduur van ten hoogste vijf jaren en kan telkens met ten hoogste eenzelfde duur
      worden verlengd.

      3 De erkenning heeft uitsluitend betrekking op de daarbij genoemde explosieven of soorten van explosieven en een of
      meer op die explosieven betrekking hebbende handelingen, genoemd in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006803/2023-04-19#Artikel17
  - number: '18'
    text: |-
      1 Een erkenning als bedoeld in [artikel 17][ref1] dient te worden aangevraagd bij de korpschef.

      2 De korpschef is bevoegd tot het verlenen en intrekken van een erkenning, alsmede tot het verlengen van de
      geldigheidsduur daarvan.

      3 Met betrekking tot het eerste en tweede lid treedt Onze Minister van Economische Zaken in de plaats van de
      korpschef voor zover het een erkenning betreft in het kader van activiteiten waarop de [Mijnbouwwet][ref2] van
      toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0006803#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0014168
    url: https://wetten.overheid.nl/BWBR0006803/2023-04-19#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0006803
        artikel: '17'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0014168
  - number: '19'
    text: |-
      1 Een erkenning als bedoeld in [artikel 17][ref1] wordt verleend, indien:

      a. de aanvrager de door Onze Minister vastgestelde gegevens heeft overgelegd;

      b. de aanvrager of, indien deze een rechtspersoon is, degene die onmiddellijk leiding geeft aan het bedrijf,
      voldoet aan de door Onze Minister vastgestelde eisen met betrekking tot zedelijk gedrag;

      c. er geen reden is om te vermoeden dat van de erkenning dan wel van explosieven misbruik zal worden gemaakt en

      d. er geen reden is om te vermoeden dat aan de aanvrager of, indien deze een rechtspersoon is, degene die
      onmiddellijk leiding geeft aan het bedrijf, het onder zich hebben van explosieven niet kan worden toevertrouwd.

      2 Met het oog op de beveiliging kan Onze Minister, in overeenstemming met Onze Ministers wie het mede aangaat,
      nadere regels stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0006803#Artikel17
    url: https://wetten.overheid.nl/BWBR0006803/2023-04-19#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006803
        artikel: '17'
        hoofdstuk: III
        paragraaf: '3'
  - number: '20'
    text: |-
      Een erkenning kan worden ingetrokken, indien:

      a. niet wordt voldaan aan [artikel 21][ref1];

      b. blijkt dat aan de houder van een erkenning of, indien deze een rechtspersoon is, degene die onmiddellijk leiding
      geeft aan het bedrijf, het onder zich hebben van explosieven niet langer kan worden toevertrouwd, of

      c. de houder van de erkenning gedurende ten minste een jaar de handelingen waarop de erkenning betrekking heeft,
      niet langer heeft verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0006803#Artikel21
    url: https://wetten.overheid.nl/BWBR0006803/2023-04-19#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0006803
        artikel: '21'
        hoofdstuk: III
        paragraaf: '4'
  - number: '21'
    text: |-
      1 Ondernemingen uit de sector explosieven houden een doorlopend register van hun transacties in explosieven bij,
      onverlet de bij of krachtens andere wettelijk regelingen gestelde voorschriften.

      2 De registratie dient zodanig te zijn opgezet dat ondernemingen uit de sector explosieven de in
      [artikel 22, eerste lid][ref1], bedoelde personen te allen tijde ten minste de volgende gegevens kunnen
      verstrekken:

      a. de unieke identificatie van de explosieven;

      b. het type explosieven;

      c. de naam en de vestigingsplaats van de onderneming of de woonplaats van de persoon die de explosieven houdt of in
      bewaring heeft;

      d. de locatie van de explosieven;

      e. de contactgegevens van degene die namens de onderneming buiten kantooruren gegevens kan verstrekken, en

      f. indien van toepassing, de naam en de vestigingsplaats van de onderneming of de woonplaats van de persoon aan
      welke de explosieven zijn overgedragen.

      3 De in het eerste lid bedoelde ondernemingen of hun rechtsopvolgers bewaren de documenten die betrekking hebben op
      de in dat lid bedoelde geregistreerde transacties gedurende een periode van tien jaar na de levering of, voor zover
      bekend, na het einde van de levenscyclus van de explosieven, ongeacht of zij tijdens die periode hun activiteiten
      hebben beëindigd.

      4 Ondernemingen uit de sector explosieven houden gedurende de in het derde lid vermelde termijn de verzamelde
      gegevens bij, beschermen die gegevens tegen beschadiging of vernietiging en testen het registratiesysteem jaarlijks
      om de effectiviteit ervan en de kwaliteit van de opgeslagen gegevens te controleren.

      5 Onze Minister kan, in overeenstemming met Onze Minister wie het mede aangaat, bij ministeriële regeling nadere
      regels stellen met betrekking tot de opzet van de registratie en de te registreren gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0006803#Artikel22
    url: https://wetten.overheid.nl/BWBR0006803/2023-04-19#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0006803
        artikel: '22'
        hoofdstuk: IV
  - number: 21a
    text: |-
      1 Het tweede, derde en vierde lid zijn uitsluitend van toepassing op bijzondere explosieven.

      2 Op verzoek van Onze Minister deelt een marktdeelnemer het volgende mee:

      a. welke marktdeelnemer een explosief aan hem heeft geleverd; en

      b. aan welke marktdeelnemer hij een explosief heeft geleverd.

      3 De informatie, bedoeld in het tweede lid, onderdelen a en b, blijft tien jaar beschikbaar nadat het explosief aan
      de marktdeelnemer is geleverd, dan wel nadat de marktdeelnemer het explosief heeft geleverd.

      4 Onze Minister kan, in overeenstemming met Onze Minister wie het mede aangaat, bij ministeriële regeling nadere
      regels stellen met betrekking tot de opzet van de registratie en de te registreren gegevens.
    url: https://wetten.overheid.nl/BWBR0006803/2023-04-19#Artikel21a
  - number: '22'
    text: |-
      1. Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast:

      a. de bij of krachtens [artikel 141 van het Wetboek van Strafvordering][ref1] aangewezen ambtenaren;

      b. de bij besluit van Onze Minister aangewezen ambtenaren.

      2. Van een besluit als bedoeld in het eerste lid, onder b, wordt mededeling gedaan door plaatsing in de
      *Staatscourant*.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0006803/2023-04-19#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '23'
    text: |-
      1 De ingevolge [artikel 22, eerste lid][ref1], aangewezen toezichthoudende ambtenaren, zijn in afwijking van
      [artikel 5:15, eerste lid, van de Algemene wet bestuursrecht][ref2], bevoegd met medeneming van de benodigde
      apparatuur een woning te betreden zonder toestemming van de bewoner ten behoeve van de uitoefening van de
      bevoegdheden, bedoeld in artikel 14, vierde lid, onderdelen a, d en e, van [verordening 2019/1020](32920R2019).

      2 Voor het uitoefenen van de bevoegdheid, bedoeld in het eerste lid, is een voorafgaande machtiging vereist van
      de rechter-commissaris. In het verzoek om afgifte van een machtiging worden de proportionaliteit en subsidiariteit
      van het verzoek gemotiveerd. De rechter-commissaris kan het openbaar ministerie horen alvorens te beslissen.
      [Artikel 171 van het Wetboek van Strafvordering][ref3] is van overeenkomstige toepassing.

      3 Tegen de beslissing van de rechter-commissaris, bedoeld in het tweede lid, staat voor zover het verzoek om
      een machtiging niet is toegewezen, voor Onze Minister binnen veertien dagen beroep open bij de rechtbank, sector
      strafrecht.

      4 De [artikelen 2][ref4] en [3 van de Algemene wet op het binnentreden][ref5] zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006803#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel515
