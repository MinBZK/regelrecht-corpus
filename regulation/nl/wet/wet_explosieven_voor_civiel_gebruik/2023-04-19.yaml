preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is uitvoering te geven aan richtlijn nr. 93/15/EEG van
    de Raad van de Europese Gemeenschappen van 5 april 1993 betreffende de harmonisatie van de bepalingen inzake het in
    de handel brengen van en de controle op explosieven voor civiel gebruik (PbEG L 121);

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006803/2023-04-19#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *aanbieder van diensten van de informatiemaatschappij:* aanbieder van diensten van de informatiemaatschappij als
      bedoeld in artikel 3, onderdeel 14, van [verordening 2019/1020](32920R2019);
        - *accreditatie:* accreditatie zoals gedefinieerd in artikel 2, tiende lid, van verordening (EG) nr. 765/2008;
        - *beveiliging:* voorkoming van het illegale gebruik van explosieven;
        - *bijzondere explosieven:* explosieven die onverpakt of in pompwagens worden vervoerd en geleverd om rechtstreeks
      in het schietgat te worden gelost en explosieven die worden vervaardigd op de plaats waar zij tot ontploffing
      worden gebracht en die, nadat zij geproduceerd zijn, onmiddellijk worden geladen;
        - *CE-markering:* markering waarmee de fabrikant aangeeft dat het desbetreffende explosief in overeenstemming
      is met alle toepasselijke eisen van de harmonisatiewetgeving van de Europese Unie die in het aanbrengen ervan
      voorziet;
        - *distributeur:* natuurlijk of rechtspersoon in de toeleveringsketen, anders dan de fabrikant of importeur, die
      een explosief op de markt aanbiedt;
        - *essentiële veiligheidseisen:* essentiële veiligheidseisen als bedoeld in bijlage II bij richtlijn 2014/28/EU;
        - *EU-conformiteitsverklaring:* verklaring als bedoeld in artikel 21 van richtlijn 2014/28/EU, waaruit blijkt dat
      een explosief voldoet aan de eisen van die richtlijn;
        - *explosieven:* alle stoffen en voorwerpen die in de «United Nations Recommendations on the transport of dangerous
      goods» – dat wil zeggen: de door de Commissie van Deskundigen inzake het Vervoer van Gevaarlijke Stoffen van de
      Verenigde Naties vastgestelde aanbevelingen – als dusdanig kunnen worden omschreven en aldaar zijn ingedeeld in
      klasse 1;
        - *fabrikant:* natuurlijk of rechtspersoon die een explosief vervaardigt of laat ontwerpen of vervaardigen en
      desbetreffend explosief onder zijn naam of handelsmerk verhandelt of gebruikt voor eigen doeleinden;
        - *geharmoniseerde norm:* geharmoniseerde norm als bedoeld in artikel 2, eerste lid, onderdeel c, van Verordening
      (EU) nr. 1025/2012 van het Europees Parlement en de Raad van 25 oktober 2012 betreffende Europese normalisatie, tot
      wijziging van de Richtlijnen 89/686/EEG en 93/15/EEG van de Raad alsmede de Richtlijnen 94/9/EG, 94/25/EG, 95/16/
      EG 97/23/EG, 98/34/EG, 2004/22/EG, 2007/23/EG, 2009/23/EG en 2009/105/EG van het Europees Parlement en de Raad en
      tot intrekking van Beschikking 87/95/EEG van de Raad en Besluit 1673/2006/EG van het Europees Parlement en de Raad
      (PbEU 2012, L 316);
        - *harmonisatiewetgeving van de Europese Unie:* alle wetgeving van de Europese Unie die de voorwaarden voor het
      verhandelen van producten harmoniseert;
        - *importeur:* in de Europese Unie gevestigde natuurlijk of rechtspersoon die een explosief uit een derde land in
      de Europese Unie in de handel brengt;
        - *in de handel brengen:* het voor het eerst in de Europese Unie of een andere staat die partij is bij de
      Overeenkomst betreffende de Europese Economische Ruimte op de markt aanbieden van een explosief;
        - *korpschef:* korpschef als bedoeld in [artikel 27 van de Politiewet 2012][ref1];
        - *keuring:* het proces waarmee wordt aangetoond of voldaan is aan de essentiële veiligheidseisen;
        - *keuringsinstelling:* instelling die keuringsactiviteiten op de explosieven verricht zoals het ijken, testen,
      certificeren en inspecteren;
        - *keuringsprocedure:* het proces als bedoeld in bijlage III bij richtlijn 2014/28/EU waarmee wordt beoordeeld of
      voldaan is aan de essentiële veiligheidseisen;
        - *marktdeelnemer:* fabrikant, vertegenwoordiger, importeur, distributeur en elke natuurlijk of rechtspersoon die
      de explosieven opslaat, gebruikt, overbrengt, invoert, uitvoert of verhandelt;
        - *nationale accreditatie-instantie:* nationale accreditatie-instantie zoals gedefinieerd in artikel 2, elfde lid,
      van verordening (EG) nr. 765/2008;
        - *ontstekingsmiddelen:* middelen als bedoeld om explosieven tot ontsteking te brengen;
        - *Onze Minister:* Onze Minister van Infrastructuur en Milieu;
        - *op de markt aanbieden:* het in het kader van een handelsactiviteit, al dan niet tegen betaling, verstrekken van
      een explosief met het oog op distributie of gebruik op de markt van de Europese Unie;
        - *overbrenging:* materiële verplaatsing van explosieven binnen de gebieden waarop het Verdrag betreffende de
      Europese Unie van toepassing is of andere gebieden waarop de Overeenkomst betreffende de Europese Economische
      Ruimte van toepassing is, met uitzondering van verplaatsingen die binnen dezelfde inrichting worden uitgevoerd;
        - *richtlijn 2014/28/EU:* Richtlijn 2014/28/EU van het Europees Parlement en de Raad van 26 februari 2014
      betreffende de harmonisatie van wetgevingen van de lidstaten inzake het op de markt aanbieden van en de controle op
      explosieven voor civiel gebruik (herschikking) (PbEU 2014, L 96);
        - *technische specificatie:* document dat de technische eisen voorschrijft waaraan een explosief moet voldoen;
        - *terugroepen:* maatregel waarmee wordt beoogd een explosief te doen terugkeren dat al aan de eindgebruiker ter
      beschikking is gesteld;
        - *uit de handel nemen:* maatregel waarmee wordt beoogd te voorkomen dat een explosief dat zich in de
      toeleveringsketen bevindt, op de markt wordt aangeboden;
        - *veiligheid:* voorkoming van ongevallen of, indien zulks onmogelijk is, beperken van de gevolgen daarvan;
        - *verordening 2019/1020:* [Verordening (EU) nr. 2019/1020](32920R2019) van het Europees Parlement en de Raad
      van 20 juni 2019 betreffende markttoezicht en conformiteit van producten en tot wijziging van [Richtlijn 2004/42/
      EG](32004L0042) en [Verordeningen (EG) nr. 765/2008](32008R0765) en (EU) [nr. 305/2011](32011R0305) (PbEU 2019,
      L 169);
        - *verordening (EG) nr. 765/2008:* Verordening (EG) nr. 765/2008 van het Europees Parlement en de Raad van 9 juli
      2008 tot vaststelling van de eisen inzake accreditatie en markttoezicht betreffende het verhandelen van producten
      en tot intrekking van Verordening (EEG) nr. 339/9 (PbEG 2008, L 218);
        - *vertegenwoordiger* in de Europese Unie gevestigde natuurlijk of rechtspersoon die bij schriftelijke overeenkomst
      door een fabrikant is aangesteld om namens hem specifieke taken als bedoeld in [artikel 2h, derde lid][ref2], te
      vervullen.

      2 Voor de toepassing van deze wet wordt, voor zover dat voor de toepassing van [verordening 2019/1020](32920R2019)
      noodzakelijk is, onder «marktdeelnemer» verstaan, hetgeen daaronder in artikel 3, onder 13, van die verordening
      wordt verstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0006803#Artikel2h
