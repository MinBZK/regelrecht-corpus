  - number: '26'
    text: |-
      [Titel 5.2 van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing voor zover de
      ingevolge [artikel 22, eerste lid][ref2], aangewezen toezichthoudende ambtenaren bijstand verlenen aan een
      markttoezichtautoriteit als bedoeld in artikel 3, onderdeel 4, van [verordening 2019/1020](32920R2019), uit een
      andere lidstaat van de Europese Unie op grond van artikel 22 of artikel 23 van die verordening.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0006803#Artikel22
