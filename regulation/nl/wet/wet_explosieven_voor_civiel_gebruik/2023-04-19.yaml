        artikel: '21'
        hoofdstuk: III
        paragraaf: '4'
  - number: 2a
    text: |-
      De fabrikant waarborgt dat explosieven ontworpen en vervaardigd worden overeenkomstig de essentiële
      veiligheidseisen indien hij deze in de handel brengt of gebruikt voor eigen doeleinden.
    url: https://wetten.overheid.nl/BWBR0006803/2023-04-19#Artikel2a
  - number: 2b
    text: |-
      1 De fabrikant stelt de technische documentatie, genoemd in bijlage III bij richtlijn 2014/28/EU op en laat de
      toepasselijke keuringsprocedure, bedoeld in [artikel 7][ref1], uitvoeren.

      2 Wanneer met de keuringsprocedure is aangetoond dat het explosief aan de toepasselijke essentiële veiligheidseisen
      voldoet, stelt de fabrikant een EU-conformiteitsverklaring op en brengt hij de CE-markering aan.

      3 De fabrikant bewaart de technische documentatie en de EU-conformiteitsverklaring gedurende tien jaar nadat het
      explosief in de handel is gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0006803#Artikel7
    url: https://wetten.overheid.nl/BWBR0006803/2023-04-19#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0006803
        artikel: '7'
        hoofdstuk: II
        paragraaf: '3'
  - number: 2c
    text: |-
      De fabrikant zorgt ervoor dat hij beschikt over procedures om de conformiteit van zijn serieproductie met richtlijn
      2014/28/EU blijvend te waarborgen. Er wordt in die procedures terdege rekening gehouden met veranderingen in het
      ontwerp of in de kenmerken van het explosief en met veranderingen in de geharmoniseerde normen of andere technische
      specificaties waarnaar in de EU-conformiteitsverklaring van het explosief wordt verwezen.
    url: https://wetten.overheid.nl/BWBR0006803/2023-04-19#Artikel2c
  - number: 2d
    text: |-
      1 De fabrikant zorgt ervoor dat op explosieven die hij in de handel heeft gebracht een unieke identificatie
      is aangebracht overeenkomstig de bij of krachtens deze wet gestelde eisen ten aanzien van de identificatie en
      traceerbaarheid van explosieven.

      2 Voor bijzondere explosieven die de fabrikant in de handel brengt:

      a. zorgt hij ervoor dat op de bijzondere explosieven een type-, partij- of serienummer, dan wel een ander
      identificatiemiddel is aangebracht of, wanneer dit vanwege de geringe omvang, vorm of het ontwerp van het explosief
      niet mogelijk is, dat de vereiste informatie op de verpakking of in een bij het explosief gevoegd document is
      vermeld; en

      b. vermeldt hij op de bijzondere explosieven of, wanneer dit niet mogelijk is, op de verpakking of in een bij de
      explosieven gevoegd document, zijn naam, geregistreerde handelsnaam of geregistreerd handelsmerk en het postadres
      waarop contact met hem kan worden opgenomen. Deze contactgegevens worden gesteld in de Nederlandse of Engelse taal.
    url: https://wetten.overheid.nl/BWBR0006803/2023-04-19#Artikel2d
  - number: 2e
    text: |-
      De fabrikant ziet erop toe dat explosieven die hij op de markt brengt, vergezeld gaan van duidelijke en
      begrijpelijke instructies, gesteld in de Nederlandse of Engelse taal.
    url: https://wetten.overheid.nl/BWBR0006803/2023-04-19#Artikel2e
  - number: 2f
    text: |-
      De fabrikant die van mening is of redenen heeft om aan te nemen dat een door hem in de handel gebracht explosief
      niet in overeenstemming is met de eisen gesteld bij of krachtens deze wet:

      a. neemt onmiddellijk de corrigerende maatregelen die nodig zijn om het explosief in overeenstemming te brengen met
      deze eisen of zo nodig uit de handel te nemen of terug te roepen; en

      b. brengt, indien het explosief een risico vormt, de bevoegde autoriteiten van de lidstaten waar hij de explosieven
      op de markt heeft aangeboden hiervan onmiddellijk op de hoogte. Indien de fabrikant het explosief in Nederland op
      de markt heeft aangeboden, brengt hij Onze Minister hiervan onmiddellijk op de hoogte. Bij het op de hoogte brengen
      van Onze Minister beschrijft de fabrikant uitvoerig de non-conformiteit en alle genomen corrigerende maatregelen.
    url: https://wetten.overheid.nl/BWBR0006803/2023-04-19#Artikel2f
  - number: 2g
    text: |-
      1 Op een met redenen omkleed verzoek van Onze Minister of de bevoegde autoriteiten van andere lidstaten van de
      Europese Unie:

      a. verstrekt de fabrikant aan Onze Minister of de bevoegde autoriteiten van andere lidstaten van de Europese
      Unie alle benodigde informatie en documentatie om de conformiteit van het explosief met de eisen gesteld bij of
      krachtens deze wet aan te tonen; en

      b. verleent de fabrikant medewerking aan alle genomen maatregelen om de risico’s van de door hem in de handel
      gebrachte explosieven uit te sluiten.

      2 De informatie en documentatie, bedoeld in het eerste lid, onderdeel a, worden gesteld in de Nederlandse of
      Engelse taal en worden op papier of elektronisch aan Onze Minister of de bevoegde autoriteiten van andere lidstaten
      van de Europese Unie ter beschikking gesteld.
    url: https://wetten.overheid.nl/BWBR0006803/2023-04-19#Artikel2g
  - number: 2h
    text: |-
      1 De fabrikant kan bij schriftelijke overeenkomst een vertegenwoordiger aanstellen.

      2 De verplichting, genoemd in [artikel 2a][ref1] en de verplichting betreffende het opstellen van technische
      documentatie, genoemd in [artikel 2b, eerste lid][ref2], maken geen deel uit van de overeenkomst, bedoeld in het
      eerste lid.

      3 De vertegenwoordiger voert de taken uit zoals die gespecificeerd zijn in de overeenkomst, bedoeld in het eerste
      lid.

      4 Bij het uitvoeren van de in het derde lid bedoelde taken:

      a. houdt de vertegenwoordiger de EU-conformiteitsverklaring en de technische documentatie gedurende tien jaar nadat
      het explosief in de handel is gebracht ter beschikking van Onze Minister;

      b. verstrekt de vertegenwoordiger, op een met redenen omkleed verzoek van Onze Minister, alle benodigde informatie
      en documentatie om de conformiteit van een explosief aan te tonen; en

      c. verleent de vertegenwoordiger, op verzoek van Onze Minister, medewerking aan eventueel genomen maatregelen om de
      risico’s van explosieven die onder de overeenkomst, bedoeld in het eerste lid, uit te sluiten.


      [ref1]: https://wetten.overheid.nl/BWBR0006803#Artikel2a
      [ref2]: https://wetten.overheid.nl/BWBR0006803#Artikel2b
    url: https://wetten.overheid.nl/BWBR0006803/2023-04-19#Artikel2h
    references:
      - id: ref1
        bwb_id: BWBR0006803
        artikel: 2a
        hoofdstuk: Ia
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006803
        artikel: 2b
        hoofdstuk: Ia
        paragraaf: '1'
  - number: 2i
    text: |-
      Indien een importeur of distributeur explosieven onder zijn eigen naam of merknaam in de handel brengt, of reeds in
      de handel gebrachte explosieven zodanig wijzigt dat de conformiteit met de essentiële veiligheidseisen in gedrang
      komt, wordt hij als fabrikant beschouwd en voldoet hij aan de [artikelen 2a tot en met 2g][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006803#Artikel2a
    url: https://wetten.overheid.nl/BWBR0006803/2023-04-19#Artikel2i
    references:
      - id: ref1
        bwb_id: BWBR0006803
        artikel: 2a
        hoofdstuk: Ia
        paragraaf: '1'
  - number: 2j
    text: De importeur brengt alleen explosieven in de handel die aan de essentiële veiligheidseisen voldoen.
    url: https://wetten.overheid.nl/BWBR0006803/2023-04-19#Artikel2j
  - number: 2k
    text: |-
      Alvorens een explosief in de handel wordt gebracht:

      a. vergewist de importeur zich ervan dat de fabrikant de juiste keuringsprocedure heeft uitgevoerd;

      b. zorgt de importeur ervoor dat de fabrikant de technische documentatie heeft opgesteld;

      c. zorgt de importeur ervoor dat het explosief voorzien is van een CE-markering en vergezeld gaat van de
      voorgeschreven documenten; en

      d. zorgt de importeur ervoor dat de fabrikant aan de eisen, bedoeld in [artikel 2d][ref1], heeft voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006803#Artikel2d
    url: https://wetten.overheid.nl/BWBR0006803/2023-04-19#Artikel2k
    references:
      - id: ref1
        bwb_id: BWBR0006803
        artikel: 2d
        hoofdstuk: Ia
        paragraaf: '1'
  - number: 2l
    text: |-
      De importeur die van mening is of redenen heeft om aan te nemen dat het explosief niet in overeenstemming is met de
      essentiële veiligheidseisen:

      a. brengt het explosief niet in de handel alvorens het in overeenstemming is gebracht met de essentiële
      veiligheidseisen; en

      b. brengt, indien het explosief een risico vormt, de fabrikant en Onze Minister hiervan op de hoogte.
    url: https://wetten.overheid.nl/BWBR0006803/2023-04-19#Artikel2l
  - number: 2m
    text: |-
      De importeur vermeldt op het explosief of, indien dit niet mogelijk is, op de verpakking of in een bij het
      explosief gevoegd document, zijn naam, geregistreerde handelsnaam of geregistreerd handelsmerk en het postadres
      waarop contact met hem kan worden opgenomen. De contactgegevens worden gesteld in de Nederlandse of Engelse taal.
    url: https://wetten.overheid.nl/BWBR0006803/2023-04-19#Artikel2m
  - number: 2n
    text: |-
      De importeur ziet erop toe dat het explosief vergezeld gaat van duidelijke en begrijpelijke instructies en
      informatie aangaande de veiligheid, gesteld in de Nederlandse of Engelse taal.
    url: https://wetten.overheid.nl/BWBR0006803/2023-04-19#Artikel2n
  - number: 2o
    text: |-
      De importeur zorgt gedurende de periode dat hij voor het explosief verantwoordelijk is voor zodanige opslag- en
      vervoersomstandigheden dat de conformiteit van het explosief met de essentiële veiligheidseisen niet in gedrang
      komt.
    url: https://wetten.overheid.nl/BWBR0006803/2023-04-19#Artikel2o
  - number: 2p
    text: |-
      De importeur die van mening is of redenen heeft aan te nemen dat een door hem in de handel gebracht explosief niet
      in overeenstemming is met de eisen gesteld bij of krachtens deze wet:

      a. neemt onmiddellijk de corrigerende maatregelen die nodig zijn om het explosief in overeenstemming te brengen met
      deze eisen of zo nodig uit de handel te nemen of terug te roepen; en

      b. brengt, indien het explosief een risico vormt, de bevoegde autoriteiten van de lidstaten waar hij het explosief
      op de markt heeft aangeboden hiervan onmiddellijk op de hoogte. Indien de importeur het explosief in Nederland op
      de markt heeft aangeboden, brengt hij Onze Minister hiervan onmiddellijk op de hoogte. Bij het op de hoogte brengen
      van de bevoegde autoriteiten van de lidstaten waar hij het explosief op de markt heeft aangeboden of Onze Minister
      beschrijft de importeur uitvoerig de non-conformiteit en alle genomen corrigerende maatregelen.
    url: https://wetten.overheid.nl/BWBR0006803/2023-04-19#Artikel2p
  - number: 2q
    text: |-
      De importeur houdt gedurende tien jaar nadat het explosief in de handel is gebracht een kopie van de EU-
      conformiteitsverklaring ter beschikking van Onze Minister. Hij zorgt ervoor dat, op verzoek, de technische
      documentatie aan Onze Minister kan worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0006803/2023-04-19#Artikel2q
  - number: 2r
    text: |-
      1 Op een met redenen omkleed verzoek van Onze Minister of de bevoegde autoriteiten van andere lidstaten van de
      Europese Unie:

      a. verstrekt de importeur aan Onze Minister of de bevoegde autoriteiten van andere lidstaten van de Europese Unie
      alle benodigde informatie en documentatie om de conformiteit van het explosief met de bij of krachtens deze wet
      gestelde eisen aan te tonen; en

      b. verleent de importeur medewerking aan alle genomen maatregelen om de risico’s van de door hem in de handel
      gebrachte explosieven uit te sluiten.

      2 De informatie en documentatie, bedoeld in het eerste lid, onderdeel a, worden gesteld in de Nederlandse of
      Engelse taal en worden op papier of elektronisch aan Onze Minister of de bevoegde autoriteiten van andere lidstaten
      van de Europese Unie ter beschikking gesteld.
    url: https://wetten.overheid.nl/BWBR0006803/2023-04-19#Artikel2r
  - number: 2s
    text: |-
      De distributeur die een explosief op de markt aanbiedt, neemt de nodige zorgvuldigheid in acht ten aanzien van de
      eisen gesteld bij of krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0006803/2023-04-19#Artikel2s
  - number: 2t
    text: |-
      Alvorens een explosief op de markt aan te bieden, controleert de distributeur:

      a. of het explosief is voorzien van een CE-markering;

      b. of het explosief vergezeld gaat van de voorgeschreven documenten, alsmede van instructies en informatie
      aangaande de veiligheid, gesteld in de Nederlandse of Engelse taal; en

      c. of de fabrikant en de importeur aan de verplichtingen ingevolge de [artikelen 2d][ref1] en [2m][ref2] hebben
      voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006803#Artikel2d
      [ref2]: https://wetten.overheid.nl/BWBR0006803#Artikel2m
    url: https://wetten.overheid.nl/BWBR0006803/2023-04-19#Artikel2t
    references:
      - id: ref1
        bwb_id: BWBR0006803
        artikel: 2d
        hoofdstuk: Ia
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006803
        artikel: 2m
        hoofdstuk: Ia
        paragraaf: '2'
  - number: 2u
    text: |-
      De distributeur die van mening is of redenen heeft aan te nemen dat een explosief niet in overeenstemming is met de
      essentiële veiligheidseisen;

      a. biedt het explosief niet op de markt aan alvorens het in overeenstemming is gebracht met de essentiële
      veiligheidseisen; en

      b. brengt, indien het explosief een risico vormt, de fabrikant, de importeur en Onze Minister hiervan op de hoogte.
    url: https://wetten.overheid.nl/BWBR0006803/2023-04-19#Artikel2u
  - number: 2v
    text: |-
      De distributeur zorgt gedurende de periode dat hij voor het explosief verantwoordelijk is voor zodanige opslag-
      en vervoersomstandigheden dat de conformiteit van het explosief met de essentiële veiligheidseisen niet in gedrang
      komt.
    url: https://wetten.overheid.nl/BWBR0006803/2023-04-19#Artikel2v
  - number: 2w
    text: |-
      De distributeur die van mening is of redenen heeft om aan te nemen dat een door hem op de markt aangeboden
      explosief niet in overeenstemming is met de eisen gesteld bij of krachtens deze wet:

      a. ziet erop toe dat de corrigerende maatregelen worden genomen die nodig zijn om het explosief in overeenstemming
      te brengen met deze eisen of zo nodig uit de handel te nemen of terug te roepen; en

      b. brengt, indien het explosief een risico vormt, de bevoegde autoriteiten van de lidstaten waar hij het explosief
      op de markt heeft aangeboden hiervan onmiddellijk op de hoogte. Indien de distributeur het explosief in Nederland
      op de markt heeft aangeboden, brengt hij Onze Minister hiervan onmiddellijk op de hoogte. Bij het op de hoogte
      brengen van Onze Minister beschrijft de distributeur uitvoerig de non-conformiteit en alle genomen corrigerende
      maatregelen.
    url: https://wetten.overheid.nl/BWBR0006803/2023-04-19#Artikel2w
  - number: 2x
    text: |-
      1 Op een met redenen omkleed verzoek van Onze Minister:

      a. verstrekt de distributeur aan Onze Minister alle benodigde informatie en documentatie om de conformiteit van het
      explosief met de bij of krachtens deze wet gestelde eisen aan te tonen; en

      b. verleent de distributeur medewerking aan alle genomen maatregelen om de risico’s van de door hem op de markt
      aangeboden explosieven uit te sluiten.

      2 De informatie en documentatie, bedoeld in het eerste lid, onderdeel a, worden op papier of elektronisch aan Onze
      Minister ter beschikking gesteld.
    url: https://wetten.overheid.nl/BWBR0006803/2023-04-19#Artikel2x
  - number: 2y
    text: |-
      1 Het is een marktdeelnemer verboden in strijd te handelen met artikel 7, eerste lid, van [verordening 2019/1020]
      (32920R2019).

      2 Het is een aanbieder van diensten van de informatiemaatschappij verboden in strijd te handelen met artikel 7,
      tweede lid, van [verordening 2019/1020](32920R2019).
    url: https://wetten.overheid.nl/BWBR0006803/2023-04-19#Artikel2y
  - number: '3'
    text: |-
      1 Het is verboden explosieven in de handel te brengen en, voor de onder d bedoelde markering, in strijd te handelen
      met het derde lid, een en ander voor wat betreft explosieven:

      a. die niet voldoen aan de in bijlage I bij richtlijn 2014/28/EU gestelde fundamentele veiligheidseisen;

      b. die niet zijn voorzien van de CE-markering;

      c. die niet overeenkomstig de procedures, bedoeld in [artikel 7, eerste lid][ref1], op hun conformiteit zijn
      beoordeeld, en

      d. die niet zijn gemarkeerd met een unieke identificatie als bedoeld in de bijlage van richtlijn 2008/43/EG van
      de Commissie van 4 april 2008 tot instelling van een systeem voor de identificatie en de traceerbaarheid van
      explosieven voor civiel gebruik overeenkomstig richtlijn 93/15/EEG van de Raad (PbEG L 94).

      2 Het is verboden op explosieven een andere aanduiding dan de CE-markering aan te brengen, die verwarring zou
      kunnen stichten met betrekking tot de betekenis en de grafische vormgeving van de CE-markering.

      3 Ondernemingen uit de sector explosieven die explosieven produceren, invoeren of ontstekers monteren en
      distributeurs die explosieven opnieuw verpakken, bevestigen of brengen de unieke identificatie op duurzame
      wijze en duidelijk leesbaar aan op de explosieven, onderdelen en elke kleinste verpakkingseenheid daarvan, en
      ontstekingsmiddelen.

      4 Onze Minister stelt, in overeenstemming met Onze Minister wie het mede aangaat, nadere regels over de wijze
      waarop de unieke identificatie wordt aangebracht of bevestigd.

      5 Onze Minister stelt, in overeenstemming met Onze Minister wie het mede aangaat, regels over het toewijzen van een
      productlocatiecode als element van de unieke identificatie en bepaalt in welke gevallen van het eerste lid, onder
      d, en derde lid kan worden afgeweken, mits de explosieven traceerbaar blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0006803#Artikel7
    url: https://wetten.overheid.nl/BWBR0006803/2023-04-19#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006803
        artikel: '7'
        hoofdstuk: II
        paragraaf: '3'
  - number: '4'
    text: |-
      Explosieven die in overeenstemming zijn met geharmoniseerde normen of delen daarvan en waarvan de referentienummers
      in het *Publicatieblad van de Europese Unie* zijn bekendgemaakt, worden geacht in overeenstemming te zijn met de
      essentiële veiligheidseisen die door die normen of delen daarvan worden bestreken.
    url: https://wetten.overheid.nl/BWBR0006803/2023-04-19#Artikel4
  - number: '5'
    text: |-
      1 Onze Minister kan een of meer keuringsinstellingen aanwijzen die bevoegd zijn tot het verrichten van
      keuringsprocedures. Onze Minister meldt de aangewezen keuringsinstelling aan overeenkomstig artikel 24 van
      richtlijn 2014/28/EU.

      2 Alvorens te worden aangewezen voldoet een keuringsinstelling aan de [artikelen 5b tot en met 5j][ref1].

      3 Aan een aanwijzing kunnen voorschriften worden verbonden ter uitvoering van de
      [artikelen 5b tot en met 5j][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006803#Artikel5b
      [ref2]: https://wetten.overheid.nl/BWBR0006803#Artikel5b
    url: https://wetten.overheid.nl/BWBR0006803/2023-04-19#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006803
        artikel: 5b
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006803
        artikel: 5b
        hoofdstuk: II
        paragraaf: '2'
  - number: 5a
    text: |-
      1 Een keuringsinstelling die wenst te worden aangewezen in de zin van [artikel 5, eerste lid][ref1], dient een
      verzoek tot aanwijzing in bij Onze Minister.

      2 Het verzoek tot aanwijzing gaat vergezeld van:

      a. een beschrijving van de keuringsactiviteiten en de keuringsmodules, genoemd in bijlage III bij richtlijn
      2014/28/EU;

      b. een beschrijving van de explosieven waarvoor de keuringsinstelling verklaart bekwaam te zijn; en

      c. het accreditatiecertificaat dat is afgegeven door een nationale accreditatie-instantie als bedoeld in richtlijn
      2014/28/EU, waarin wordt verklaard dat de keuringsinstelling voldoet aan de [artikelen 5b tot en met 5j][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006803#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006803#Artikel5b
    url: https://wetten.overheid.nl/BWBR0006803/2023-04-19#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0006803
        artikel: '5'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006803
        artikel: 5b
        hoofdstuk: II
        paragraaf: '2'
  - number: 5b
    text: |-
      Een keuringsinstelling kan uitsluitend worden aangewezen in de zin van [artikel 5, eerste lid][ref1], indien zij
      beschikt over rechtspersoonlijkheid.


      [ref1]: https://wetten.overheid.nl/BWBR0006803#Artikel5
    url: https://wetten.overheid.nl/BWBR0006803/2023-04-19#Artikel5b
    references:
      - id: ref1
        bwb_id: BWBR0006803
        artikel: '5'
        hoofdstuk: II
        paragraaf: '2'
  - number: 5c
    text: |-
      1 De keuringsinstelling is onafhankelijk van de door haar beoordeelde organisaties of de door haar beoordeelde
      explosieven.

      2 De keuringsinstelling, haar hoogste leidinggevenden en het personeel dat de keuringstaken verricht, zijn geen
      ontwerper, fabrikant, leverancier, installateur, koper, eigenaar, gebruiker of onderhouder van de desbetreffende
      explosieven, noch vertegenwoordigen zij een van die partijen. Dit belet echter niet het gebruik van explosieven
      die nodig zijn voor de activiteiten van de keuringsinstelling of het gebruik van dergelijke explosieven voor
      persoonlijke doeleinden.

      3 De keuringsinstelling, haar hoogste leidinggevenden en het personeel dat de keuringsstaken verricht, zijn
      niet rechtstreeks betrokken bij het ontwerpen, vervaardigen of bouwen, verhandelen, installeren, gebruiken of
      onderhouden van explosieven, noch vertegenwoordigen zij een partij die betrokken is bij deze activiteiten. Zij
      oefenen geen activiteiten, zoals adviesdiensten, uit waardoor hun onafhankelijke oordeel of integriteit met
      betrekking tot keuringsactiviteiten waarvoor zij zijn aangewezen in gedrang kan komen.

      4 De keuringsinstelling waarborgt dat activiteiten van haar dochterondernemingen of onderaannemers geen
      afbreuk doen aan de vertrouwelijkheid, objectiviteit of onpartijdigheid van de keuringsactiviteiten die de
      keuringsinstelling verricht.
    url: https://wetten.overheid.nl/BWBR0006803/2023-04-19#Artikel5c
  - number: 5d
    text: |-
      1 De keuringsinstelling en haar personeel voeren de keuringsactiviteiten uit met de grootste mate van
      beroepsintegriteit en met de vereiste technische bekwaamheid op het specifieke gebied.

      2 De keuringsinstelling en haar personeel zijn vrij van elke druk en beïnvloeding, met name van financiële aard,
      die hun oordeel of de resultaten van hun keuringsactiviteiten kunnen beïnvloeden, met name van personen of groepen
      van personen die belang hebben bij de resultaten van deze activiteiten.
    url: https://wetten.overheid.nl/BWBR0006803/2023-04-19#Artikel5d
  - number: 5e
    text: |-
      1 De keuringsinstelling is in staat alle keuringstaken te verrichten die in bijlage III bij richtlijn 2014/28/EU
      aan haar zijn toegewezen en waarvoor zij is aangewezen, ongeacht of deze taken door de keuringsinstelling zelf of
      namens haar en onder haar verantwoordelijkheid worden verricht.

      2 De keuringsinstelling beschikt te allen tijde, voor elke keuringsprocedure en voor elk soort en elke categorie
      explosieven waarvoor zij is aangemeld over:

      a. het benodigde personeel met technische kennis en voldoende passende ervaring om de keuringstaken te verrichten;

      b. de beschrijvingen van de procedures voor de uitvoering van de keuring, waarbij de transparantie en de
      mogelijkheid tot reproductie van deze procedure worden gewaarborgd;

      c. gepast beleid en geschikte procedures om een onderscheid te maken tussen taken die zij als keuringinstelling
      verricht en andere activiteiten; en

      d. procedures voor de uitoefening van haar activiteiten die naar behoren rekening houden met de omvang van
      een onderneming, de sector waarin zij actief is, de structuur van de sector, de relatieve complexiteit van de
      producttechnologie in kwestie en het massa- of seriële karakter van het productieproces.

      3 De keuringsinstelling beschikt over de noodzakelijke middelen om de technische en administratieve taken die
      verband houden met de beoordelingsactiviteiten op passende wijze uit te voeren en heeft toegang tot alle vereiste
      apparatuur en faciliteiten.
    url: https://wetten.overheid.nl/BWBR0006803/2023-04-19#Artikel5e
  - number: 5f
    text: |-
      Het personeel van de keuringsinstelling dat verantwoordelijk is voor de keuringstaken beschikt over:

      a. een gedegen technische en beroepsopleiding die alle relevante keuringsactiviteiten omvat waarvoor de
      keuringsinstelling is aangewezen;

      b. voldoende kennis van de eisen inzake de beoordelingen die de keuringsinstelling verricht en voldoende
      bevoegdheden om deze beoordelingen uit te voeren;

      c. voldoende kennis van en inzicht in de essentiële veiligheidseisen, de toepasselijke geharmoniseerde normen en
      de relevante bepalingen van de harmonisatiewetgeving van de Europese Unie en van het bij of krachtens deze wet
      bepaalde; en

      d. de bekwaamheid om certificaten, dossiers en rapporten op te stellen die aantonen dat de beoordelingen zijn
      verricht.
    url: https://wetten.overheid.nl/BWBR0006803/2023-04-19#Artikel5f
  - number: 5g
    text: |-
      1 De keuringsinstelling waarborgt haar onpartijdigheid en die van haar leidinggevenden en haar personeel dat de
      keuringstaken verricht.

      2 De beloning van de leidinggevenden en het personeel van de keuringsinstelling hangt niet af van het aantal
      uitgevoerde beoordelingen of van de resultaten daarvan.
    url: https://wetten.overheid.nl/BWBR0006803/2023-04-19#Artikel5g
  - number: 5h
    text: De keuringsinstelling heeft een geldige aansprakelijkheidsverzekering.
    url: https://wetten.overheid.nl/BWBR0006803/2023-04-19#Artikel5h
  - number: 5i
    text: |-
      1 Het personeel van een aangewezen keuringsinstelling is gebonden aan het beroepsgeheim ten aanzien van alle
      informatie waarvan het kennisneemt bij de uitoefening van de taken van de keuringsinstelling uit hoofde van
      bijlage III bij de richtlijn 2014/28/EU of de regels gesteld bij of krachtens deze wet. De eigendomsrechten worden
      beschermd.

      2 Het beroepsgeheim, genoemd in het eerste lid, geldt niet ten opzichte van Onze Minister of bevoegde autoriteiten
      van andere lidstaten van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0006803/2023-04-19#Artikel5i
  - number: 5j
    text: |-
      1 De keuringsinstelling neemt deel aan of zorgt ervoor dat haar personeel dat de keuringstaken verricht op de
      hoogte is van:

      a. de relevante normalisatieactiviteiten; en

      b. de activiteiten van de coördinatiegroep van aangemelde instanties die is opgericht uit hoofde van de
      desbetreffende harmonisatiewetgeving van de Europese Unie.

      2 De keuringsinstelling hanteert de administratieve beslissingen en geproduceerde documenten van de
      coördinatiegroep, genoemd in het eerste lid, onderdeel b, als algemene richtsnoeren.
    url: https://wetten.overheid.nl/BWBR0006803/2023-04-19#Artikel5j
  - number: 5k
    text: |-
      1 De keuringsinstelling neemt deel aan de werkzaamheden van de coördinatiegroep van aangemelde instanties, genoemd
      in [artikel 5j, eerste lid, onderdeel b][ref1].

      2 Indien de keuringsinstelling niet rechtstreeks deelneemt aan de werkzaamheden, bedoeld in het eerste lid, laat
      zij zich daarbij vertegenwoordigen door een door haar aangestelde partij.


      [ref1]: https://wetten.overheid.nl/BWBR0006803#Artikel5j
    url: https://wetten.overheid.nl/BWBR0006803/2023-04-19#Artikel5k
    references:
      - id: ref1
        bwb_id: BWBR0006803
        artikel: 5j
        hoofdstuk: II
        paragraaf: '2'
  - number: 5l
    text: |-
      Een keuringsinstelling die aantoont dat zij voldoet aan de criteria in de ter zake doende geharmoniseerde normen
      of delen ervan en waarvan de referentienummers in het Publicatieblad van de Europese Unie zijn bekendgemaakt,
      wordt geacht aan de eisen, genoemd in [artikel 5b tot en met 5j][ref1] te voldoen, voor zover deze daarmee
      corresponderen.


      [ref1]: https://wetten.overheid.nl/BWBR0006803#Artikel5b
    url: https://wetten.overheid.nl/BWBR0006803/2023-04-19#Artikel5l
    references:
      - id: ref1
        bwb_id: BWBR0006803
        artikel: 5b
        hoofdstuk: II
        paragraaf: '2'
  - number: 5m
    text: |-
      1 Indien de keuringsinstelling specifieke keuringstaken uitbesteedt of door een dochteronderneming laat uitvoeren:

      a. waarborgt zij dat de onderaannemer of dochteronderneming voldoet aan de eisen, genoemd in de
      [artikelen 5b tot en met 5j][ref1];

      b. brengt zij Onze Minister hiervan op de hoogte;

      c. neemt zij de volledige verantwoordelijkheid op zich voor de taken die onderaannemers of dochterondernemingen
      verrichten, ongeacht waar deze gevestigd zijn; en

      d. houdt zij de relevante documenten over de beoordeling van de kwalificaties van de onderaannemer of
      dochteronderneming en over de door de onderaannemer of dochteronderneming uit hoofde van bijlage III bij richtlijn
      2014/28/EU uitgevoerde werkzaamheden ter beschikking van Onze Minister.

      2 Activiteiten van de keuringsinstelling mogen uitsluitend met instemming van de klant worden uitbesteed of door
      een dochteronderneming worden uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0006803#Artikel5b
    url: https://wetten.overheid.nl/BWBR0006803/2023-04-19#Artikel5m
    references:
      - id: ref1
        bwb_id: BWBR0006803
        artikel: 5b
        hoofdstuk: II
        paragraaf: '2'
  - number: 5n
    text: |-
      1 De keuringsinstelling voert keuringen uit volgens de keuringsprocedures en eisen, genoemd in bijlage III bij
      richtlijn 2014/28/EU.

      2 De keuringsinstelling voert de keuringen op evenredige wijze uit, waarbij zij voorkomt dat de marktdeelnemers
      onnodig worden belast. De keuringsinstelling houdt hierbij naar behoren rekening met de omvang van de onderneming,
      de sector waarin zij actief is, haar structuur, de relatieve technologische complexiteit van de producten en
      het massa- of seriële karakter van het productieproces, waarbij de keuringsinstelling de striktheid en het
      beschermingsniveau, die nodig zijn opdat de explosieven voldoen aan de essentiële veiligheidseisen, eerbiedigt.

      3 Indien de keuringsinstelling vaststelt dat een fabrikant niet heeft voldaan aan de essentiële veiligheidseisen
      of aan de overeenkomstige geharmoniseerde normen of andere technische specificaties verleent zij geen EU-
      conformiteitsverklaring en verlangt zij dat de fabrikant onmiddellijk passende corrigerende maatregelen neemt.

      4 Indien de keuringsinstelling bij het toezicht op de conformiteit na verlening van een certificaat vaststelt
      dat explosieven niet meer in overeenstemming zijn met de essentiële veiligheidseisen, de overeenkomstige
      geharmoniseerde normen of andere technische specificaties verlangt zij dat de fabrikant onmiddellijk passende
      corrigerende maatregelen neemt. Zo nodig schorst zij het certificaat of trekt zij dit in.

      5 Indien de fabrikant geen corrigerende maatregelen neemt of de genomen maatregelen niet het vereiste effect
      hebben, worden de certificaten naargelang het geval door de keuringsinstelling beperkt, geschorst, of ingetrokken.
    url: https://wetten.overheid.nl/BWBR0006803/2023-04-19#Artikel5n
  - number: 5o
    text: |-
      1 Indien is gebleken dat de keuringsinstelling niet langer voldoet aan de eisen, genoemd in de
      [artikelen 5b tot en met 5j][ref1], of haar verplichtingen niet nakomt, kan Onze Minister, afhankelijk van de ernst
      van het niet-voldoen aan die eisen of het niet-nakomen van die verplichtingen, de aanwijzing beperken, schorsen
      of intrekken.

      2 Onze Minister stelt de Europese Commissie en de andere lidstaten van de Europese Unie onmiddellijk op de hoogte
      van de genomen maatregelen, genoemd in het eerste lid.

      3 Wanneer de aanwijzing wordt beperkt, geschorst, of ingetrokken, of de keuringsinstelling haar activiteiten heeft
      gestaakt:

      a. stelt de keuringsinstelling, ook nadat de aanwijzing is beperkt, geschorst of ingetrokken, de dossiers op zijn
      verzoek ter beschikking aan Onze Minister; of

      b. draagt de keuringsinstelling de dossiers over aan een andere keuringsinstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0006803#Artikel5b
    url: https://wetten.overheid.nl/BWBR0006803/2023-04-19#Artikel5o
    references:
      - id: ref1
        bwb_id: BWBR0006803
        artikel: 5b
        hoofdstuk: II
        paragraaf: '2'
  - number: 5p
    text: |-
      1 De keuringsinstelling brengt Onze Minister onverwijld op de hoogte van:

      a. elke weigering, beperking, schorsing of intrekking van certificaten;

      b. omstandigheden die van invloed zijn op de werkingssfeer van of de voorwaarden voor de aanwijzing van de
      keuringsinstelling; en

      c. informatieverzoeken over keuringsactiviteiten die zij van markttoezichtsautoriteiten ontvangen.

      2 Op verzoek van Onze Minister brengt de keuringsinstelling hem op de hoogte van de binnen haar werkingssfeer
      verrichte keuringsactiviteiten en andere activiteiten, waaronder grensoverschrijdende activiteiten en
      uitbestedingen.

      3 De keuringsinstelling verstrekt de andere keuringsinstellingen die bij de Europese Commissie zijn aangemeld en
      die soortgelijke keuringsactiviteiten voor dezelfde explosieven verrichten, relevante informatie over negatieve
      keuringsresultaten en op verzoek informatie over positieve keuringsresultaten.
    url: https://wetten.overheid.nl/BWBR0006803/2023-04-19#Artikel5p
  - number: '6'
    text: |-
      Als instellingen die bevoegd zijn tot het verrichten van onderzoek, controles en beoordelingen, zoals omschreven
      in de in [artikel 7, eerste lid][ref1], bedoelde procedures, worden mede aangemerkt instellingen die in het kader
      van richtlijn 2014/28/EU door andere lid-staten van de Europese Unie of andere staten die partij zijn bij de
      Overeenkomst betreffende de Europese Economische Ruimte zijn aangemeld en waarvan de namen door de Commissie van de
      Europese Unie zijn bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0006803#Artikel7
    url: https://wetten.overheid.nl/BWBR0006803/2023-04-19#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006803
        artikel: '7'
        hoofdstuk: II
        paragraaf: '3'
  - number: '7'
    text: |-
      De fabrikant kiest een van de navolgende keuringsprocedures uit bijlage III bij richtlijn 2014/28/EU, volgens welke
      de door hem gekozen keuringsinstelling de keuring uitvoert:

      a. EU-typeonderzoek (module B) en naar keuze van de fabrikant een van de volgende procedures:

      1° conformiteit met het type op basis van interne productiecontrole plus productcontroles onder toezicht met
      willekeurige tussenpozen (module C2);

      2° conformiteit met het type op basis van de kwaliteitsborging van het productieproces (module D);

      3°. conformiteit met het type op basis van productkwaliteitsborging (module E); of

      4°. conformiteit met het type of basis van productkeuring (module F); of

      b. conformiteit op basis van eenheidskeuring (module G).
    url: https://wetten.overheid.nl/BWBR0006803/2023-04-19#Artikel7
  - number: 7a
    text: |-
      1 In de EU-conformiteitsverklaring wordt vermeld dat aangetoond is dat aan de essentiële veiligheidseisen is
      voldaan.

      2 De EU-conformiteitsverklaring:

      a. komt ten aanzien van de structuur overeen met het model van bijlage IV van richtlijn 2014/28/EU;

      b. bevat de in de desbetreffende modules van bijlage III bij richtlijn 2014/28/EU vermelde elementen;

      c. wordt voortdurend bijgewerkt; en

      d. wordt vertaald in de taal of talen zoals gevraagd door de lidstaat waar het explosief in de handel wordt
      gebracht of op de markt wordt aangeboden.

      3 De EU-conformiteitsverklaring die betrekking heeft op een explosief dat binnen het grondgebied van Nederland in
      de handel wordt gebracht of op de markt wordt aangeboden, is gesteld in de Nederlandse of Engelse taal.

      4 Indien voor een explosief uit hoofde van meer dan één handeling van de Europese Unie een EU-
      conformiteitsverklaring vereist is, wordt één EU-conformiteitsverklaring met betrekking tot al die handelingen van
      de Europese Unie opgesteld. In die EU-conformiteitsverklaring moet duidelijk worden aangegeven om welke handelingen
      van de Europese Unie het gaat, met vermelding van de publicatiereferenties ervan.

      5 Door de EU-conformiteitsverklaring op te stellen, neemt de fabrikant de verantwoordelijkheid voor de conformiteit
      van het explosief met de eisen van richtlijn 2014/28/EU op zich.
    url: https://wetten.overheid.nl/BWBR0006803/2023-04-19#Artikel7a
  - number: 7b
    text: |-
      1 De CE-markering wordt, alvorens het explosief in de handel wordt gebracht, zichtbaar, gemakkelijk leesbaar
      en onuitwisbaar op het explosief aangebracht. Indien dit gezien de aard van het explosief niet mogelijk of niet
      gerechtvaardigd is, wordt de CE-markering aangebracht op de verpakking en in de begeleidende documenten.

      2 Indien de keuringsinstelling betrokken is geweest bij de productiecontrolefase, dan wordt de CE-markering gevolgd
      door het identificatienummer van die keuringsinstelling.

      3 Het identificatienummer, genoemd in het tweede lid, wordt aangebracht door de aangemelde keuringsinstelling zelf,
      dan wel overeenkomstig haar instructies door de fabrikant of diens vertegenwoordiger.

      4 De CE-markering en, indien van toepassing, het identificatienummer van de aangemelde keuringsinstelling, kunnen
      worden gevolgd door een ander teken dat een bijzonder risico of gebruik aanduidt.

      5 Bij de volgende categorieën van explosieven wordt de CE-markering op de begeleidende documenten aangebracht:

      a. voor eigen gebruik vervaardigde explosieven;

      b. bijzondere explosieven.
    url: https://wetten.overheid.nl/BWBR0006803/2023-04-19#Artikel7b
  - number: '8'
    text: |-
      1 Onverminderd [artikel 31][ref1], is Onze Minister bevoegd tot oplegging van een last onder bestuursdwang ter
      handhaving van de voorschriften, bedoeld in de [artikelen 7][ref2] en [7a][ref3], jegens de fabrikant, diens
      in de gebieden waarop het Verdrag betreffende de Europese Unie van toepassing is of andere gebieden waarop de
      Overeenkomst betreffende de Europese Economische Ruimte van toepassing is gevestigde gemachtigde dan wel de persoon
      die verantwoordelijk is voor het in de handel brengen van de desbetreffende explosieven.

      2 Tot de bevoegdheid tot toepassing van bestuursdwang behoort:

      a. het geheel of gedeeltelijk stopzetten van het vervaardigen, in Nederland in de handel brengen of aan een ander
      ter beschikking stellen van de explosieven;

      b. het vernietigen van de explosieven;

      c. het in beslag nemen van de explosieven.


      [ref1]: https://wetten.overheid.nl/BWBR0006803#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0006803#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0006803#Artikel7a
    url: https://wetten.overheid.nl/BWBR0006803/2023-04-19#Artikel8
