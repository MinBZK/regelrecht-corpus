  - number: '31'
    text: |-
      In gevallen waarin geen ander bestuursorgaan bevoegd is, is Onze Minister bevoegd tot oplegging van een last onder
      bestuursdwang ter handhaving van de bij of krachtens deze wet gestelde verplichtingen.
    url: https://wetten.overheid.nl/BWBR0006803/2023-04-19#Artikel31
  - number: '32'
    text: |-
      De afgifte van een goedkeuring, vergunning of erkenning kan afhankelijk worden gesteld van de betaling van
      een onkostenvergoeding overeenkomstig de door Onze Minister te stellen regels. De vergoeding komt toe aan
      onderscheidenlijk het Rijk, de betrokken gemeente en de betrokken regio, indien het in de eerste volzin bedoelde
      document door Onze Minister, burgemeester en wethouders of de korpschef wordt afgegeven.
    url: https://wetten.overheid.nl/BWBR0006803/2023-04-19#Artikel32
  - number: '33'
    text: |-
      Voor zover bij of krachtens deze wet wordt verwezen naar richtlijn 2014/28/EU, naar een bijlage daarvan of naar
      de bijlage van richtlijn nr. 2008/43/EG, treedt voor de toepassing van de desbetreffende bepaling een wijziging
      van richtlijn 2014/28/EU of van een bijlage daarvan of van de bijlage van richtlijn nr. 2008/43/EG in werking met
      ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uiterlijk uitvoering moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0006803/2023-04-19#Artikel33
  - number: 33a
    text: |-
      1 Met het toezicht op de uitvoering en de handhaving van het bij of krachtens deze wet bepaalde zijn belast de bij
      besluit van Onze Minister aangewezen ambtenaren.

      2 De [artikelen 5:13][ref1], [5:15][ref2], [5:16][ref3], [5:17][ref4] en
      [5:20, eerste en tweede lid, van de Algemene wet bestuursrecht][ref5] zijn van overeenkomstige toepassing.

      3 Onze Minister kan bij ministeriële regeling bepalen dat bestuursorganen die met de uitvoering of de handhaving
      van het bij of krachtens deze wet bepaalde zijn belast, daarbij aan te geven gegevens verstrekken aan de krachtens
      het eerste lid aangewezen ambtenaren. Bij de regeling kunnen regels worden gesteld met betrekking tot het tijdstip
      waarop, de frequentie waarmee en de vorm waarin de gegevens worden verstrekt. Tevens kan bij de regeling worden
      bepaald dat daarbij gestelde regels slechts gelden in daarbij aangegeven gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel513
