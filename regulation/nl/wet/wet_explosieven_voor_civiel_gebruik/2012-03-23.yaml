---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_explosieven_voor_civiel_gebruik
regulatory_layer: WET
publication_date: '2023-03-01'
valid_from: '2012-03-23'
bwb_id: BWBR0006803
url: https://wetten.overheid.nl/BWBR0006803/2012-03-23
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is uitvoering te geven aan richtlijn nr. 93/15/EEG van
    de Raad van de Europese Gemeenschappen van 5 april 1993 betreffende de harmonisatie van de bepalingen inzake het in
    de handel brengen van en de controle op explosieven voor civiel gebruik (PbEG L 121);

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;'
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel1
  - number: 1.b
    text: |-
      korpschef: korpschef als bedoeld in [artikel 24 van de Politiewet 1993][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel24
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '24'
  - number: 1.c
    text: |-
      [richtlijn nr. 93/15/EEG](31993L0015): [richtlijn nr. 93/15/EEG](31993L0015) van de Raad van de Europese
      Gemeenschappen van 5 april 1993 betreffende de harmonisatie van de bepalingen inzake het in de handel brengen van
      en de controle op explosieven voor civiel gebruik (*PbEG* L 121);
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel1
  - number: 1.d
    text: |-
      explosieven: alle stoffen en voorwerpen die in de "United Nations Recommendations on the transport of dangerous
      goods" - dat wil zeggen de door de Commissie van Deskundigen inzake het Vervoer van Gevaarlijke Stoffen van de
      Verenigde Naties vastgestelde aanbevelingen, zoals die door die organisatie zijn gepubliceerd en zoals die op de
      datum van aanneming van [richtlijn nr. 93/15/EEG](31993L0015) zijn gewijzigd (ST/SG/AC.10/1/REV.7; United Nations,
      New York, 1991) - als dusdanig worden omschreven en aldaar zijn ingedeeld in klasse 1;
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel1
  - number: 1.e
    text: |-
      in de handel brengen: voor de eerste keer, al dan niet tegen betaling, beschikbaar stellen van explosieven met
      het oogmerk om deze in een lid-staat van de Europese Unie of een andere staat die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte op de markt te distribueren of te gebruiken;
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel1
  - number: 1.f
    text: 'veiligheid: voorkoming van ongevallen of, indien zulks onmogelijk is, beperken van de gevolgen daarvan;'
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel1
  - number: 1.g
    text: 'beveiliging: voorkoming van het illegale gebruik van explosieven;'
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel1
  - number: 1.h
    text: |-
      overbrenging: materiële verplaatsing van explosieven binnen de gebieden waarop het Verdrag betreffende de Europese
      Unie van toepassing is of andere gebieden waarop de Overeenkomst betreffende de Europese Economische Ruimte van
      toepassing is, met uitzondering van verplaatsingen die binnen dezelfde inrichting worden uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel1
  - number: 1.i
    text: |-
      onderneming uit de sector explosieven: elke natuurlijke of rechtspersoon die houder is van een erkenning als
      bedoeld in [artikel 17][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006803#Artikel17
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006803
        artikel: '17'
        hoofdstuk: III
        paragraaf: '3'
  - number: 1.j
    text: 'CE-markering: aanduiding, weergegeven in bijlage IV bij [richtlijn nr. 93/15/EEG](31993L0015).'
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel1
  - number: '2.1'
    text: 'Deze wet is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel2
  - number: 2.1.a
    text: explosieven die bestemd zijn om te worden gebruikt door de krijgsmacht of de politie;
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel2
  - number: 2.1.b
    text: 'pyrotechnische artikelen, die zijn aangewezen:'
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel2
  - number: 2.1.b.1°
    text: |-
      in bijlage I bij [richtlijn nr. 2004/57/EG](32004L0057) van de Commissie van de Europese Gemeenschappen van 23
      april 2004 betreffende het identificeren van pyrotechnische voorwerpen en bepaalde munitie voor de doeleinden van
      [richtlijn nr. 93/15/EEG](31993L0015) van de Raad betreffende de harmonisatie van de bepalingen inzake het in de
      handel brengen van en de controle op explosieven voor civiel gebruik (PbEU L 127);
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel2
  - number: 2.1.b.2°
    text: bij regeling van Onze Minister ingevolge bijlage II bij [richtlijn nr. 2004/57/EG](32004L0057);
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel2
  - number: 2.1.b.3°
    text: |-
      bij regeling van Onze Minister voor zover die artikelen zonder die aanwijzing als binnen het werkingsgebied van
      deze wet vallend zouden kunnen worden beschouwd, en.
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel2
  - number: 2.1.c
    text: |-
      munitie als bedoeld in [artikel 1, eerste lid, onder 4°, van de Wet wapens en munitie][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel1
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '1'
  - number: '2.2'
    text: |-
      Een wijziging van de in het eerste lid genoemde richtlijn met gevolgen voor de daarbij als zodanig aangewezen
      pyrotechnische artikelen gaat voor de toepassing van deze wet en de daarop berustende bepalingen gelden met ingang
      van de dag waarop aan de desbetreffende wijzigingsrichtlijn uitvoering moet zijn gegeven, tenzij bij ministerieel
      besluit, dat in de Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel2
  - number: '3.1'
    text: 'Het is verboden explosieven in de handel te brengen:'
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel3
  - number: 3.1.a
    text: |-
      die niet voldoen aan de in bijlage I bij [richtlijn nr. 93/15/EEG](31993L0015) gestelde fundamentele
      veiligheidseisen;
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel3
  - number: 3.1.b
    text: die niet zijn voorzien van de CE-markering en
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel3
  - number: 3.1.c
    text: |-
      die niet overeenkomstig de procedures, bedoeld in [artikel 7, eerste lid][ref1], op hun conformiteit zijn
      beoordeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0006803#Artikel7
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006803
        artikel: '7'
        hoofdstuk: II
        paragraaf: '3'
  - number: '3.2'
    text: |-
      Het is verboden op explosieven een andere aanduiding dan de CE-markering aan te brengen, die verwarring zou kunnen
      stichten met betrekking tot de betekenis en de grafische vormgeving van de CE-markering.
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel3
  - number: '4'
    text: |-
      Explosieven worden in elk geval vermoed aan de in [artikel 3, eerste lid, onder a][ref1], bedoelde fundamentele
      veiligheidseisen te voldoen, indien zij in overeenstemming zijn met:


      [ref1]: https://wetten.overheid.nl/BWBR0006803#Artikel3
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006803
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
  - number: 4.a
    text: |-
      de ter uitvoering van artikel 4, eerste lid, van [richtlijn nr. 93/15/EEG](31993L0015) opgestelde geharmoniseerde
      normen, waarvan de referentienummers in het *Publicatieblad van de Europese Gemeenschappen* zijn bekendgemaakt;
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel4
  - number: 4.b
    text: |-
      de normen die overeenkomstig de onder *a* bedoelde geharmoniseerde normen in Nederland zijn vastgesteld en waarvan
      de referentienummers door Onze Minister in de *Staatscourant* zijn bekendgemaakt, of
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel4
  - number: 4.c
    text: |-
      de normen die overeenkomstig de onder *a* bedoelde geharmoniseerde normen in een andere lid-staat van de Europese
      Unie of een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte zijn
      vastgesteld en waarvan de referentienummers in die lid-staat zijn bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel4
  - number: '5.1'
    text: |-
      Onze Minister kan een of meer instellingen aanwijzen die bevoegd zijn tot het verrichten van onderzoek, controles
      en beoordelingen zoals omschreven in de in [artikel 7, eerste lid][ref1], bedoelde procedures. Aan zodanige
      aanwijzing kunnen voorschriften worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0006803#Artikel7
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006803
        artikel: '7'
        hoofdstuk: II
        paragraaf: '3'
  - number: '5.2'
    text: |-
      Voor een aanwijzing als bedoeld in het eerste lid komen in aanmerking instellingen die tenminste voldoen aan de
      voorwaarden, genoemd in bijlage III bij [richtlijn nr. 93/15/EEG](31993L0015).
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel5
  - number: '5.3'
    text: 'Onze Minister trekt een aanwijzing als bedoeld in het eerste lid in elk geval in, indien de instelling:'
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel5
  - number: 5.3.a
    text: niet langer voldoet aan de in het tweede lid bedoelde voorwaarden, of
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel5
  - number: 5.3.b
    text: |-
      niet voldoet aan de in het kader van de in [artikel 7, eerste lid][ref1], bedoelde procedures op haar rustende
      verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0006803#Artikel7
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006803
        artikel: '7'
        hoofdstuk: II
        paragraaf: '3'
  - number: '6'
    text: |-
      Als instellingen die bevoegd zijn tot het verrichten van onderzoek, controles en beoordelingen, zoals omschreven in
      de in [artikel 7, eerste lid][ref1], bedoelde procedures, worden mede aangemerkt instellingen die in het kader van
      [richtlijn nr. 93/15/EEG](31993L0015) door andere lid-staten van de Europese Unie of andere staten die partij zijn
      bij de Overeenkomst betreffende de Europese Economische Ruimte zijn aangemeld en waarvan de namen door de Commissie
      van de Europese Gemeenschappen zijn gepubliceerd in het *Publicatieblad van de Europese Gemeenschappen*.


      [ref1]: https://wetten.overheid.nl/BWBR0006803#Artikel7
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006803
        artikel: '7'
        hoofdstuk: II
        paragraaf: '3'
  - number: '7.1'
    text: 'De CE-markering mag uitsluitend op explosieven worden aangebracht, onderscheidenlijk:'
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel7
  - number: 7.1.a.1°
    text: |-
      indien het desbetreffende type blijkens een verklaring van EG-typeonderzoek overeenkomstig de in bijlage II, module
      B, bij [richtlijn nr. 93/15/EEG](31993L0015) beschreven procedure is goedgekeurd;
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel7
  - number: 7.1.a.2°
    text: |-
      zolang de vervaardiging van de desbetreffende explosieven geschiedt met inachtneming van, naar keuze van de
      fabrikant, een van de vier in bijlage II bij [richtlijn nr. 93/15/EEG](31993L0015) beschreven procedures onder de
      modules C tot en met F, en
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel7
  - number: 7.1.a.3°
    text: |-
      zolang wordt voldaan aan de in het kader van de onder *a* en *b* bedoelde procedures op de fabrikant, diens
      in de gebieden waarop het Verdrag betreffende de Europese Unie van toepassing is of andere gebieden waarop de
      Overeenkomst betreffende de Europese Economische Ruimte van toepassing is gevestigde gemachtigde dan wel de persoon
      die verantwoordelijk is voor het in de handel brengen van de desbetreffende explosieven, rustende verplichtingen;
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel7
  - number: 7.1.b.1°
    text: |-
      indien de betrokken explosieven blijkens een verklaring van overeenstemming overeenkomstig de in bijlage II, module
      G, bij [richtlijn nr. 93/15/EEG](31993L0015) beschreven procedure zijn goedgekeurd en zijn voorzien van het onder
      bijlage II, module G, punt 2, bedoelde identificatiesymbool;
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel7
  - number: 7.1.b.2°
    text: |-
      zolang de vervaardiging van deze explosieven geschiedt met inachtneming van de onder module G beschreven procedure
      en
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel7
  - number: 7.1.b.3°
    text: zolang door de fabrikant wordt voldaan aan de in het kader van module G op hem rustende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel7
  - number: '7.2'
    text: |-
      De CE-markering is zichtbaar, gemakkelijk leesbaar en onuitwisbaar op de explosieven aangebracht of, indien
      markering hierop niet mogelijk is, op overeenkomstige wijze op een op de explosieven bevestigde plaat, op een
      zodanige wijze dat deze plaat slechts eenmalig te gebruiken is. In geval geen van de in de eerste volzin bedoelde
      methoden bruikbaar is, dient de CE-markering op de wijze als bedoeld in de eerste volzin op de verpakking van de
      explosieven te worden aangebracht.
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel7
  - number: '7.3'
    text: 'Indien de in het eerste lid, onder *a*, 2°, bedoelde keuze is gemaakt voor:'
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel7
  - number: 7.3.a
    text: |-
      module C, dient het onder bijlage II, module C, punt 1, bedoelde identificatiesymbool tijdens het fabricageproces
      te worden aangebracht;
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel7
  - number: 7.3.b
    text: |-
      module D of E, dient de CE-markering vergezeld te gaan van het onder bijlage II, module D, punt 1,
      onderscheidenlijk bijlage II, module E, punt 1, bedoelde identificatiesymbool, of
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel7
  - number: 7.3.c
    text: module F, wordt het onder bijlage II, module F, punt 4.2, bedoelde identificatiesymbool aangebracht.
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel7
  - number: '7.4'
    text: |-
      De CE-markering geeft tevens aan dat explosieven, die onder de reikwijdte van [richtlijn nr. 93/15/EEG](31993L0015)
      vallen, vermoed worden te voldoen aan andere mede van toepassing zijnde richtlijnen en de Nederlandse regelingen
      ter implementatie daarvan die ook voorzien in het aanbrengen van dit teken.
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel7
  - number: '8.1'
    text: |-
      Onverminderd [artikel 31][ref1], is Onze Minister bevoegd tot oplegging van een last onder bestuursdwang
      ter handhaving van de voorschriften, bedoeld in [artikel 7, eerste lid][ref2], jegens de fabrikant, diens in
      de gebieden waarop het Verdrag betreffende de Europese Unie van toepassing is of andere gebieden waarop de
      Overeenkomst betreffende de Europese Economische Ruimte van toepassing is gevestigde gemachtigde dan wel de
      persoon die verantwoordelijk is voor het in de handel brengen van de desbetreffende explosieven, bedoeld in
      [artikel 7, eerste lid, onder a, 3°][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0006803#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0006803#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0006803#Artikel7
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006803
        artikel: '31'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0006803
        artikel: '7'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0006803
        artikel: '7'
        hoofdstuk: II
        paragraaf: '3'
  - number: '8.2'
    text: 'Tot de bevoegdheid tot toepassing van bestuursdwang behoort:'
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel8
  - number: 8.2.a
    text: |-
      het geheel of gedeeltelijk stopzetten van het vervaardigen, in Nederland in de handel brengen of aan een ander ter
      beschikking stellen van de explosieven;
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel8
  - number: 8.2.b
    text: het vernietigen van de explosieven;
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel8
  - number: 8.2.c
    text: het in beslag nemen van de explosieven.
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel8
  - number: '9'
    text: |-
      Onze Minister neemt eveneens maatregelen als bedoeld in [artikel 8][ref1] met betrekking tot explosieven waarop de
      CE-markering is aangebracht en die overeenkomstig hun bestemming worden gebruikt, indien deze explosieven naar zijn
      oordeel de veiligheid in gevaar kunnen brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0006803#Artikel8
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006803
        artikel: '8'
        hoofdstuk: II
        paragraaf: '4'
  - number: '10.1'
    text: 'Het is verboden explosieven over te brengen, indien de desbetreffende overbrenging in Nederland eindigt zonder dat:'
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel10
  - number: 10.1.a
    text: aan de verkrijger van deze explosieven daartoe vergunning is verleend, en
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel10
  - number: 10.1.b
    text: |-
      voor zover de explosieven afkomstig zijn uit een andere lidstaat van de Europese Unie, voor het deel van die
      overbrenging dat binnen Nederland plaatsvindt toestemming is verleend.
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel10
  - number: '10.2'
    text: |-
      Het is verboden explosieven over te brengen, indien de desbetreffende overbrenging in een ander land dan Nederland
      eindigt, zonder dat voor het deel van die overbrenging dat binnen Nederland plaatsvindt toestemming is verleend.
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel10
  - number: '11.1'
    text: |-
      Een vergunning als bedoeld in [artikel 10, eerste lid, onder a][ref1] dient te worden aangevraagd door de
      verkrijger van de over te brengen explosieven bij burgemeester en wethouders van de gemeente waarin de overbrenging
      eindigt. De aanvrager voegt bij zijn aanvrage de in artikel 9, zevende lid, eerste alinea, van [richtlijn nr.
      93/15/EEG](31993L0015) bedoelde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0006803#Artikel10
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006803
        artikel: '10'
        hoofdstuk: III
        paragraaf: '1'
  - number: '11.2'
    text: 'Burgemeester en wethouders gaan aan de hand van de in het eerste lid bedoelde gegevens na of:'
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel11
  - number: 11.2.a
    text: voor overbrengingen waarvoor vergunning wordt aangevraagd specifieke beveiligingseisen gelden of nodig zijn en
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel11
  - number: 11.2.b
    text: |-
      degene voor wie de explosieven bestemd zijn houder is van een erkenning als bedoeld in [artikel 17][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006803#Artikel17
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006803
        artikel: '17'
        hoofdstuk: III
        paragraaf: '3'
  - number: '11.3'
    text: 'Indien naar het oordeel van burgemeester en wethouders geen specifieke beveiligingseisen gelden:'
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel11
  - number: 11.3.a
    text: |-
      wordt in de vergunning uitsluitend melding gemaakt van het besluit dat zij hebben genomen na de controle op de
      voorgenomen overbrengingen;
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel11
  - number: 11.3.b
    text: kan zonder voorafgaande kennisgeving aan hen met de onder *a* bedoelde overbrengingen worden aangevangen en
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel11
  - number: 11.3.c
    text: wordt de vergunning verleend voor een door hen daarbij te stellen termijn.
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel11
  - number: '11.4'
    text: |-
      Voor de overbrenging van explosieven die afkomstig zijn uit een andere lidstaat van de Europese Unie wordt, indien
      die overbrenging in Nederland eindigt, het als bijlage bij beschikking nr. 2004/388/EG van de Commissie van de
      Europese Gemeenschappen van 15 april 2004 (PbEU L 120) opgenomen document als model gehanteerd voor zowel de
      vergunning als de toestemming.
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel11
  - number: '11.5'
    text: |-
      Een wijziging van de in het vierde lid genoemde beschikking met gevolgen voor het daarbij als bijlage opgenomen
      document gaat voor de toepassing van het vierde lid gelden met ingang van de dag waarop aan de betrokken
      beschikking uitvoering moet zijn gegeven, tenzij bij ministerieel besluit, dat in de Staatscourant wordt
      bekendgemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel11
  - number: '12'
    text: |-
      Indien naar het oordeel van burgemeester en wethouders met betrekking tot overbrenging bijzondere beveiligingseisen
      gelden of nodig zijn:
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel12
  - number: 12.a
    text: |-
      bevat een vergunning als bedoeld in [artikel 10, eerste lid, onder a][ref1], de in artikel 9, zevende lid, eerste
      alinea, van [richtlijn nr. 93/15/EEG](31993L0015) bedoelde gegevens en.


      [ref1]: https://wetten.overheid.nl/BWBR0006803#Artikel10
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006803
        artikel: '10'
        hoofdstuk: III
        paragraaf: '1'
  - number: 12.b
    text: |-
      dient voordat wordt aangevangen met een overbrenging waarvoor vergunning is verleend, aan burgemeester en
      wethouders van die overbrenging kennisgeving te worden gedaan.
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel12
  - number: '13.1'
    text: |-
      In afwijking van [artikel 11, eerste lid][ref1], dient een vergunning als bedoeld in
      [artikel 10, eerste lid, onder a][ref2], voor het overbrengen van explosieven ten behoeve van de mijnbouw waarop de
      [Mijnbouwwet][ref3] van toepassing is, te worden aangevraagd bij Onze Minister van Economische Zaken. De aanvrager
      voegt bij zijn aanvrage de in artikel 9, zevende lid, eerste alinea, van [richtlijn nr. 93/15/EEG](31993L0015)
      bedoelde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0006803#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0006803#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0014168
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006803
        artikel: '11'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006803
        artikel: '10'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0014168
  - number: '13.2'
    text: |-
      De [artikelen 11, tweede en derde lid][ref1], en [12][ref2] zijn van toepassing, met dien verstande dat Onze
      Minister van Economische Zaken in de plaats treedt van burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0006803#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0006803#Artikel12
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006803
        artikel: '11'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006803
        artikel: '12'
        hoofdstuk: III
        paragraaf: '1'
  - number: '14'
    text: |-
      De houder van een in Nederland afgegeven vergunning of van een in een andere lid-staat van de Europese Unie of een
      andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte afgegeven vergunning voor
      het overbrengen alsmede de houder van een afgegeven toestemming voor de overbrenging van explosieven die eindigt in
      een andere staat, zijn verplicht deze explosieven tot aan de plaats waar de overbrenging eindigt, onderscheidenlijk
      het verlaten van het grondgebied van Nederland, te doen vergezellen van de vergunning, onderscheidenlijk het bewijs
      van toestemming.
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel14
  - number: '15.1'
    text: |-
      De toestemming, bedoeld in [artikel 10, eerste lid, onder b, en tweede lid][ref1], dient te worden aangevraagd
      door de voor de overbrenging verantwoordelijke persoon. Deze voegt bij zijn aanvraag de in artikel 9, zevende lid,
      eerste alinea, van [richtlijn nr. 93/15/EEG](31993L0015) bedoelde gegevens. De toestemming wordt verleend door
      Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0006803#Artikel10
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006803
        artikel: '10'
        hoofdstuk: III
        paragraaf: '1'
  - number: '15.2'
    text: |-
      Voor de overbrenging van explosieven binnen Nederland wordt, indien die overbrenging in een andere lidstaat
      van de Europese Unie eindigt, het als bijlage bij beschikking nr. 2004/388/EG van de Commissie van de Europese
      Gemeenschappen van 15 april 2004 (PbEU L 120) opgenomen document als model gehanteerd voor de toestemming.
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel15
  - number: '15.3'
    text: Onze Minister kan regels stellen met betrekking tot het melden van de overbrenging van explosieven.
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel15
  - number: '15.4'
    text: |-
      De [artikelen 11, tweede lid, onder ][ref1], en [12][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006803#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0006803#Artikel12
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006803
        artikel: '11'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006803
        artikel: '12'
        hoofdstuk: III
        paragraaf: '1'
  - number: '15.5'
    text: |-
      Op een wijziging van de in het tweede lid genoemde beschikking is [artikel 11, vijfde lid][ref1], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006803#Artikel11
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006803
        artikel: '11'
        hoofdstuk: III
        paragraaf: '1'
  - number: '16'
    text: |-
      Degenen voor wie de explosieven bestemd zijn of ondernemingen uit de sector explosieven zenden op verzoek van
      burgemeester en wethouders van gemeenten waarin overbrengingen van explosieven eindigen onderscheidenlijk, indien
      het een overbrenging als bedoeld in [artikel 13][ref1] betreft, op verzoek van Onze Minister van Economische Zaken,
      de bevoegde autoriteit van de lid-staat van de Europese Unie of de andere staat die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte waar de overbrengingen aanvangen onderscheidenlijk de bevoegde
      autoriteit van de lid-staat over welk grondgebied de overbrenging plaatsvindt de te hunner beschikking staande
      relevante gegevens toe over de overbrengingen.


      [ref1]: https://wetten.overheid.nl/BWBR0006803#Artikel13
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0006803
        artikel: '13'
        hoofdstuk: III
        paragraaf: '1'
  - number: '17.1'
    text: |-
      Het is verboden zonder erkenning explosieven te vervaardigen, op te slaan, te gebruiken, over te brengen of te
      verhandelen.
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel17
  - number: '17.2'
    text: |-
      De erkenning heeft een geldigheidsduur van ten hoogste vijf jaren en kan telkens met ten hoogste eenzelfde duur
      worden verlengd.
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel17
  - number: '17.3'
    text: |-
      De erkenning heeft uitsluitend betrekking op de daarbij genoemde explosieven of soorten van explosieven en een of
      meer op die explosieven betrekking hebbende handelingen, genoemd in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel17
  - number: '18.1'
    text: |-
      Een erkenning als bedoeld in [artikel 17][ref1] dient te worden aangevraagd bij de korpschef in de plaats waarde
      aanvrager is gevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0006803#Artikel17
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0006803
        artikel: '17'
        hoofdstuk: III
        paragraaf: '3'
  - number: '18.2'
    text: |-
      De korpschef is bevoegd tot het verlenen en intrekken van een erkenning, alsmede tot het verlengen van de
      geldigheidsduur daarvan.
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel18
  - number: '18.3'
    text: |-
      Met betrekking tot het eerste en tweede lid treedt Onze Minister van Economische Zaken in de plaats van de
      korpschef voor zover het een erkenning betreft in het kader van activiteiten waarop de [Mijnbouwwet][ref1] van
      toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0014168
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0014168
  - number: '19.1'
    text: |-
      Een erkenning als bedoeld in [artikel 17][ref1] wordt verleend, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0006803#Artikel17
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006803
        artikel: '17'
        hoofdstuk: III
        paragraaf: '3'
  - number: 19.1.a
    text: de aanvrager de door Onze Minister vastgestelde gegevens heeft overgelegd;
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel19
  - number: 19.1.b
    text: |-
      de aanvrager of, indien deze een rechtspersoon is, degene die onmiddellijk leiding geeft aan het bedrijf, voldoet
      aan de door Onze Minister vastgestelde eisen met betrekking tot zedelijk gedrag;
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel19
  - number: 19.1.c
    text: er geen reden is om te vermoeden dat van de erkenning dan wel van explosieven misbruik zal worden gemaakt en
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel19
  - number: 19.1.d
    text: |-
      er geen reden is om te vermoeden dat aan de aanvrager of, indien deze een rechtspersoon is, degene die onmiddellijk
      leiding geeft aan het bedrijf, het onder zich hebben van explosieven niet kan worden toevertrouwd.
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel19
  - number: '19.2'
    text: |-
      Met het oog op de beveiliging kan Onze Minister, in overeenstemming met Onze Ministers wie het mede aangaat, nadere
      regels stellen.
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel19
  - number: '20'
    text: 'Een erkenning kan worden ingetrokken, indien:'
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel20
  - number: 20.a
    text: |-
      niet wordt voldaan aan [artikel 21][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006803#Artikel21
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0006803
        artikel: '21'
        hoofdstuk: III
        paragraaf: '4'
  - number: 20.b
    text: |-
      blijkt dat aan de houder van een erkenning of, indien deze een rechtspersoon is, degene die onmiddellijk leiding
      geeft aan het bedrijf, het onder zich hebben van explosieven niet langer kan worden toevertrouwd, of
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel20
  - number: 20.c
    text: |-
      de houder van de erkenning gedurende ten minste een jaar de handelingen waarop de erkenning betrekking heeft, niet
      langer heeft verricht.
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel20
  - number: '21.1'
    text: |-
      Ondernemingen uit de sector explosieven houden een doorlopend register van hun transacties in explosieven bij,
      onverlet de bij of krachtens andere wettelijk regelingen gestelde voorschriften.
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel21
  - number: '21.2'
    text: 'De registratie dient zodanig te zijn opgezet dat aan de hand daarvan te allen tijde:'
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel21
  - number: 21.2.a
    text: de personen aan wie explosieven zijn overgedragen kunnen worden geïdentificeerd en
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel21
  - number: 21.2.b
    text: kan worden bepaald welke explosieven aan de onder *a* bedoelde personen zijn overgedragen.
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel21
  - number: '21.3'
    text: |-
      De in het eerste lid bedoelde ondernemingen of hun rechtsopvolgers bewaren de documenten die betrekking hebben op
      de in dat lid bedoelde geregistreerde transacties gedurende een periode van ten minste drie jaar, te rekenen vanaf
      het einde van het kalenderjaar waarin de desbetreffende transactie heeft plaatsgevonden, ongeacht of zij tijdens
      die periode hun activiteiten hebben beëindigd.
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel21
  - number: '21.4'
    text: |-
      De registratie dient voorts te voldoen aan de toepassingsvoorwaarden, bedoeld in artikel 14, tweede alinea, van
      [richtlijn nr. 93/15/EEG](31993L0015).
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel21
  - number: '21.5'
    text: |-
      Onze Minister kan, in overeenstemming met Onze Minister wie het mede aangaat, bij ministeriële regeling nadere
      regels stellen met betrekking tot de opzet van de registratie en de te registreren gegevens.
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel21
  - number: '22.1'
    text: 'Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast:'
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel22
  - number: 22.1.a
    text: |-
      de bij of krachtens [artikel 141 van het Wetboek van Strafvordering][ref1] aangewezen ambtenaren;


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: 22.1.b
    text: de bij besluit van Onze Minister aangewezen ambtenaren;
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel22
  - number: 22.1.c
    text: |-
      de bij besluit van Onze Minister, in overeenstemming met Onze Minister van Verkeer en Waterstaat, aangewezen
      ambtenaren van het Ministerie van Verkeer en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel22
  - number: '22.2'
    text: |-
      Van een besluit als bedoeld in het eerste lid, onder b en c, wordt mededeling gedaan door plaatsing in de
      *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel22
  - number: '31'
    text: |-
      In gevallen waarin geen ander bestuursorgaan bevoegd is, is Onze Minister bevoegd tot oplegging van een last onder
      bestuursdwang ter handhaving van de bij of krachtens deze wet gestelde verplichtingen.
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel31
  - number: '32'
    text: |-
      De afgifte van een goedkeuring, vergunning of erkenning kan afhankelijk worden gesteld van de betaling van
      een onkostenvergoeding overeenkomstig de door Onze Minister te stellen regels. De vergoeding komt toe aan
      onderscheidenlijk het Rijk, de betrokken gemeente en de betrokken regio, indien het in de eerste volzin bedoelde
      document door Onze Minister, burgemeester en wethouders of de korpschef wordt afgegeven.
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel32
  - number: '33'
    text: |-
      Voor zover bij of krachtens deze wet wordt verwezen naar [richtlijn nr. 93/15/EEG](31993L0015) of naar een
      bijlage daarvan, treedt voor de toepassing van de desbetreffende bepaling een wijziging van [richtlijn nr.
      93/15/EEG](31993L0015) of van een bijlage daarvan in werking met ingang van de dag waarop aan de betrokken
      wijzigingsrichtlijn uiterlijk uitvoering moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel33
  - number: 33a.1
    text: |-
      Met het toezicht op de uitvoering en de handhaving van het bij of krachtens deze wet bepaalde zijn belast de bij
      besluit van Onze Minister aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel33a
  - number: 33a.2
    text: |-
      De [artikelen 5:13][ref1], [5:15][ref2], [5:16][ref3], [5:17][ref4] en
      [5:20 van de Algemene wet bestuursrecht][ref5] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel33a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 33a.3
    text: |-
      Onze Minister kan bij ministeriële regeling bepalen dat bestuursorganen die met de uitvoering of de handhaving
      van het bij of krachtens deze wet bepaalde zijn belast, daarbij aan te geven gegevens verstrekken aan de krachtens
      het eerste lid aangewezen ambtenaren. Bij de regeling kunnen regels worden gesteld met betrekking tot het tijdstip
      waarop, de frequentie waarmee en de vorm waarin de gegevens worden verstrekt. Tevens kan bij de regeling worden
      bepaald dat daarbij gestelde regels slechts gelden in daarbij aangegeven gevallen.
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel33a
  - number: 33b.1
    text: |-
      Het vervaardigen, opslaan, gebruiken, overbrengen, verkrijgen, ter beschikking stellen, voorhanden hebben
      of verhandelen van explosieven of andere ontplofbare stoffen met een terroristisch oogmerk als bedoeld in
      [artikel 83a van het Wetboek van Strafrecht][ref1] dan wel met het oogmerk om een terroristisch misdrijf als
      bedoeld in [artikel 83 van dat wetboek][ref2] voor te bereiden of gemakkelijk te maken, wordt gestraft met
      gevangenisstraf van ten hoogste acht jaren of geldboete van de vijfde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel83a
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel83
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel33b
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 83a
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '83'
  - number: 33b.2
    text: Het in het eerste lid strafbaar gestelde feit is een misdrijf.
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel33b
  - number: '36'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel36
  - number: '37'
    text: 'Deze wet wordt aangehaald als: Wet explosieven voor civiel gebruik.'
    url: https://wetten.overheid.nl/BWBR0006803/2012-03-23#Artikel37
