        artikel: '2'
  - number: '2'
    text: |-
      Het Productschap Vee en Vlees kan in de Verordening identificatie en registratie van paardachtigen (PVV) 2009
      bepalen dat bij overtreding van de artikelen 6, derde en vierde lid, 7, eerste en tweede lid, 9, tweede lid, 10, 12
      en 13 van die verordening tuchtrechtelijke maatregelen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0016030/2009-07-01#Artikel2
  - number: '3'
    text: |-
      Deze regeling wordt aangehaald als: Regeling medebewind vergoeding en tuchtrechtelijke maatregelen identificatie en
      registratie eenhoevige dieren.
    url: https://wetten.overheid.nl/BWBR0016030/2009-07-01#Artikel3
  - number: '4'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0016030/2009-07-01#Artikel4
