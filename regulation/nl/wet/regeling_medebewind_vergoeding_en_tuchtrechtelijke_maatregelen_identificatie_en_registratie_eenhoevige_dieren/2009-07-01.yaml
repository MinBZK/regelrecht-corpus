preamble:
  text: |-
    Gelet op de artikelen 94, 108 en 108a van de Gezondheids- en welzijnswet voor dieren en de artikelen 2 en 3 van het
    Besluit identificatie en registratie voor dieren;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0016030/2009-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Ter uitvoering van
      [artikel 94, eerste lid, onderdeel h, en tweede lid, van de Gezondheids- en welzijnwet voor dieren][ref1] wordt
      medewerking gevorderd van het bestuur van het Productschap Vee en Vlees.

      2 De in het eerste lid bedoelde medewerking bestaat uit het verrichten van werkzaamheden en het bij verordening
      stellen van nadere regels, die noodzakelijk zijn voor het heffen van een vergoeding van kosten inzake het krachtens
      [artikel 2, tweede lid, onderdeel d, van het Besluit identificatie en registratie van dieren][ref2] uitgegeven
      identificatiedocument voor eenhoevige dieren, alsmede uit het vaststellen van een tarief ter zake van deze
      vergoeding.

      3 Onverminderd het tweede lid bestaat de gevorderde medewerking uit het verrichten van werkzaamheden en het bij
      verordening stellen van nadere regels met betrekking tot de betaling van de in het tweede lid bedoelde vergoeding.

      4 Bij verordening als bedoeld in het tweede en derde lid, kan de bevoegdheid tot het vaststellen van de hoogte
      van de in het tweede lid bedoelde vergoeding worden overgedragen aan een ander orgaan van het Productschap Vee
      en Vlees.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel94
      [ref2]: https://wetten.overheid.nl/BWBR0009019#Artikel2
