        bwb_id: BWBR0004482
        artikel: '2'
  - number: '3.3'
    text: |-
      In afwijking van het eerste en tweede lid zijn de groene tabellen mede van toepassing
      op uitkeringen ingevolge de Ziektewet voor zover die uitkeringen niet ingevolge
      [artikel 22a, derde lid, aanhef en onderdeel c, van de Wet op de loonbelasting 1964][ref1] met loon uit
      tegenwoordige arbeid worden gelijkgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel22a
    url: https://wetten.overheid.nl/BWBR0004482/2026-01-01#Artikel3
    references:
