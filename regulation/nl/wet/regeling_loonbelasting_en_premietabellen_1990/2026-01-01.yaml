        artikel: 22a
  - number: '5.1'
    text: |-
      Aan het eind van het kalenderjaar herrekent de inhoudingsplichtige die loon heeft verstrekt waarop de tabel
      bedoeld in [artikel 2, onderdeel e][ref1], van toepassing is, niet zijnde een uitkering op grond van het
      [Besluit bijstandverlening zelfstandigen 2004][ref2], de per werknemer over dat kalenderjaar verschuldigde
      loonbelasting en premie voor de volksverzekeringen met inachtneming van de volgende bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0004482#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0015711
    url: https://wetten.overheid.nl/BWBR0004482/2026-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004482
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0015711
  - number: '5.2'
    text: |-
      Bij de in het eerste lid bedoelde herrekening wordt ten aanzien van de werknemer die de pensioengerechtigde
      leeftijd, bedoeld in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], nog niet heeft bereikt
      rekening gehouden met de algemene heffingskorting. Bij die herrekening wordt ten aanzien van de werknemer die die
      pensioengerechtigde leeftijd heeft bereikt rekening gehouden met de algemene heffingskorting en de ouderenkorting
      en, als deze werknemer een uitkering ingevolge de [Participatiewet][ref2] geniet volgens de normen voor een
      alleenstaande of een alleenstaande ouder, bovendien met de alleenstaande ouderenkorting. De heffingskortingen
      worden in aanmerking genomen naar rato van de periode waarover in het kalenderjaar loon van de inhoudingsplichtige
      is genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0015703
    url: https://wetten.overheid.nl/BWBR0004482/2026-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
      - id: ref2
        bwb_id: BWBR0015703
  - number: '5.3'
    text: |-
      Het op de voet van het tweede lid bepaalde bedrag wordt verminderd met het bedrag van de in dat lid bedoelde
      heffingskortingen voor zover daarmee rekening is gehouden bij de inhouding van loonbelasting en premie voor
      de volksverzekeringen op ander loon over perioden in het kalenderjaar waarover een uitkering ingevolge de
      [Participatiewet][ref1] is genoten. Voor de toepassing van de vorige volzin wordt met betrekking tot beloningen
      die niet kunnen worden toegerekend aan een loontijdvak waarover geen bijstandsuitkering is genoten en waarop
      met toepassing van de in [artikel 26 van de wet][ref2] bedoelde tabel geen inhouding van loonbelasting en
      premie voor de volksverzekeringen plaatsvindt, geacht bij de bepaling van de loonbelasting en premie voor de
      volksverzekeringen rekening te zijn gehouden met een bedrag aan heffingskorting. De Belastingdienst verstrekt
      aan de inhoudingsplichtige een rekenvoorschrift aan de hand waarvan hij het in dit lid bedoelde bedrag aan
      heffingskorting kan bepalen.


      [ref1]: https://wetten.overheid.nl/BWBR0015703
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel26
    url: https://wetten.overheid.nl/BWBR0004482/2026-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0015703
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '26'
  - number: '5.4'
    text: |-
      De loonbelasting en premie voor de volksverzekeringen over loon waarover inkomensafhankelijke bijdrage als
      bedoeld in [artikel 43 van de Zorgverzekeringswet][ref1] is verschuldigd, wordt berekend over het loon in
      geld, nadat dit is verminderd met de door de inhoudingsplichtige voor zijn rekening genomen loonbelasting
      en premie voor de volksverzekeringen en inkomensafhankelijke bijdrage als bedoeld in artikel 43 van de
      Zorgverzekeringswet, en bedraagt: (L - H) × P - H, waarbij L voorstelt: het loon waarover de loonbelasting
      en premie voor de volksverzekeringen wordt berekend; H voorstelt: het bedrag aan heffingskorting bepaald
      op de voet van het tweede lid, verminderd met het bedrag van de heffingskorting bepaald op de voet van
      het derde lid, en P bedraagt: 60,19% voor werknemers die de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref2], nog niet hebben bereikt en 23,09% voor werknemers die
      die pensioengerechtigde leeftijd hebben bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0004482/2026-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '43'
      - id: ref2
        bwb_id: BWBR0002221
        artikel: 7a
  - number: '5.5'
    text: |-
      De loonbelasting en premie voor de volksverzekeringen over loon waarover inkomensafhankelijke bijdrage als bedoeld
      in [artikel 42 van de Zorgverzekeringswet][ref1] is verschuldigd, wordt berekend over het loon in geld, nadat
      dit is verminderd met de door de inhoudingsplichtige voor zijn rekening genomen loonbelasting en premie voor de
      volksverzekeringen en bedraagt: L x Q, waarbij L voorstelt: het loon waarover de loonbelasting en premie voor de
      volksverzekeringen wordt berekend; Q bedraagt: 55,64% voor werknemers die de pensioengerechtigde leeftijd, bedoeld
      in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref2], nog niet hebben bereikt en 21,73% voor werknemers
      die die pensioengerechtigde leeftijd hebben bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0004482/2026-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '42'
      - id: ref2
        bwb_id: BWBR0002221
        artikel: 7a
  - number: '5.6'
    text: |-
      Voor de toepassing van het tweede, vierde en vijfde lid wordt de werknemer die in het kalenderjaar de
      pensioengerechtigde leeftijd, bedoeld in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], heeft
      bereikt, geacht die leeftijd te hebben bereikt op de eerste dag van de kalendermaand waarin hij die leeftijd
      werkelijk heeft bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0004482/2026-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: '5.7'
    text: |-
      De op de voet van de vorige leden herrekende loonbelasting en premie voor de volksverzekeringen wordt verminderd
      met de over de in het kalenderjaar verstreken loontijdvakken reeds ingehouden loonbelasting en premie.
    url: https://wetten.overheid.nl/BWBR0004482/2026-01-01#Artikel5
  - number: '5.8'
    text: |-
      De op de voet van het zevende lid bepaalde belasting en premie is verschuldigd over de maand december van het
      kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0004482/2026-01-01#Artikel5
  - number: '6.1'
    text: 'Als loonbelasting- en premietabellen voor de eindheffing worden vastgesteld:'
    url: https://wetten.overheid.nl/BWBR0004482/2026-01-01#Artikel6
  - number: 6.1.a
    text: |-
      de eindheffingstabellen voor werknemers die de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], nog niet hebben bereikt;


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0004482/2026-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: 6.1.b
    text: |-
      de eindheffingstabellen voor werknemers die de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], hebben bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0004482/2026-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: '6.2'
    text: |-
      Voor de toepassing van de tabellen eindheffing geldt als jaarloon het jaarloon in de zin van
      [artikel 26 van de Wet op de loonbelasting 1964][ref1], met dien verstande dat voor eindheffingsbestanddelen als
      bedoeld in [artikel 31, eerste lid, onderdeel a, van de Wet op de loonbelasting 1964][ref2] als jaarloon geldt: het
      loon over het jaar, onderscheidenlijk de jaren waarop de op te leggen naheffingsaanslag betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel31
    url: https://wetten.overheid.nl/BWBR0004482/2026-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '26'
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '31'
  - number: '6.3'
    text: |-
      Bij het opleggen van een naheffingsaanslag wordt, voor zover de
      naheffing betrekking heeft op eindheffingsbestanddelen als bedoeld in
      [artikel 31, tweede lid, onderdeel c, van de Wet op de loonbelasting 1964][ref1], in afwijking van het
      [tweede lid, onderdeel a, onder 1°, van dat artikel][ref2], in zoverre de verschuldigde belasting bepaald aan de
      hand van de in die onderdelen voor die eindheffingsbestanddelen bedoelde tarieven.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel31
    url: https://wetten.overheid.nl/BWBR0004482/2026-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '31'
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '31'
  - number: '7'
    text: De tabellen, bedoeld in deze regeling, worden gepubliceerd op www.belastingdienst.nl/tabellen.
    url: https://wetten.overheid.nl/BWBR0004482/2026-01-01#Artikel7
  - number: '8.1'
    text: Deze regeling treedt in werking met ingang van 1 januari 1990.
    url: https://wetten.overheid.nl/BWBR0004482/2026-01-01#Artikel8
  - number: '8.2'
    text: 'Deze regeling kan worden aangehaald als: Regeling loonbelasting- en premietabellen 1990.'
    url: https://wetten.overheid.nl/BWBR0004482/2026-01-01#Artikel8
