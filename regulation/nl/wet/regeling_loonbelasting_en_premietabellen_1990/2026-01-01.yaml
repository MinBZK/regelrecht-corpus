  - number: '3.2'
    text: |-
      De groene tabellen zijn van toepassing op loon uit vroegere arbeid met uitzondering van loon als bedoeld in
      [artikel 2, onderdeel g][ref1], en in het eerste lid, onderdelen b en c.


      [ref1]: https://wetten.overheid.nl/BWBR0004482#Artikel2
    url: https://wetten.overheid.nl/BWBR0004482/2026-01-01#Artikel3
    references:
