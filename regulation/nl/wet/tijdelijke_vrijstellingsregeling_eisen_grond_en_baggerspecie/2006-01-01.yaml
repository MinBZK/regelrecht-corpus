  - number: '2'
    text: |-
      1 Deze regeling is van toepassing op het gebruiken van grond op of in de bodem overeenkomstig
      [hoofdstuk 2 van het Besluit][ref1].

      2 Deze regeling is niet van toepassing op het gebruiken van grond op of in de bodem in:

      a. gebieden die krachtens de [artikelen 7][ref2] of [21 van de Natuurbeschermingswet][ref3] zijn aangewezen als
      beschermd natuurmonument onderscheidenlijk zijn aangewezen als staatsnatuurmonument,

      b. gebieden die krachtens [richtlijn nr. 79/409/EEG](31979L0409) van de Raad van de Europese Gemeenschappen van 2
      april 1979 inzake het behoud van de vogelstand (PbEG L 103) zijn aangewezen als speciale beschermingszone,

      c. gebieden die krachtens [richtlijn nr. 92/43/EEG](31992L0043) van de Raad van de Europese Gemeenschappen van 21
      mei 1992 inzake de instandhouding van natuurlijke habitats en de wilde flora en fauna (PbEG L 206) zijn aangewezen
      als speciale beschermingszone, en

      d. gebieden die bij de provinciale milieuverordening als bedoeld in [artikel 1.2 van de Wet milieubeheer][ref4]
      zijn aangewezen voor de waterwinning.


      [ref1]: https://wetten.overheid.nl/BWBR0007667#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0002611#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0002611#Artikel21
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel1.2
