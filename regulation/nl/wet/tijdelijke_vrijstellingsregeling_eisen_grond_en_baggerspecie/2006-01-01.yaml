  - number: '3'
    text: |-
      Voor het gebruiken van grond op of in de bodem wordt vrijstelling verleend van de immissiewaarden voor bromide,
      fluoride en sulfaat, zoals aangegeven in [bijlage 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007667
    url: https://wetten.overheid.nl/BWBR0016439/2006-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007667
  - number: '4'
    text: |-
      1 Voor het gebruiken van grond op of in de bodem wordt vrijstelling verleend van de immissiewaarden voor antimoon,
      molybdeen, seleen en vanadium, zoals aangegeven in [bijlage 2][ref1], mits de concentratie van die stoffen in de
      betreffende grond de waarde, zoals aangegeven in [bijlage A bij deze regeling][ref2], niet overschrijdt.

      2 De bepaling van de concentratie, bedoeld in het eerste lid, vindt plaats overeenkomstig de volgende methoden:

      a. de monstervoorbehandeling en de ontsluiting van het monster overeenkomstig het Accreditatie-programma
      Bouwstoffenbesluit (AP 04);

      b. de analyse van het destruaat van het monster overeenkomstig de normvoorschriften, zoals aangegeven in
      [bijlage B bij deze regeling][ref3].

      3 De bepaling, bedoeld in het tweede lid, vindt plaats door een laboratorium dat is geaccrediteerd
      door de Raad voor Accreditatie op grond van NEN-EN-ISO / IEC 17025, uitgave 2000 voor een van de in
      [bijlage B bij deze regeling][ref4] opgenomen NEN-normen voor de matrix bodem.

      4 Met de methoden, bedoeld in het tweede lid, worden gelijkgesteld methoden die worden gesteld in een andere
      lidstaat van de Europese Unie dan wel in een staat, niet zijnde een lidstaat van de Europese Unie, die partij is
      bij de overeenkomst inzake de Europese Economische Ruimte, en die een kwaliteitsniveau waarborgen dat ten minste
      gelijkwaardig is aan het niveau dat met de nationale eisen wordt nagestreefd.

      5 Met het laboratorium, bedoeld in het derde lid, wordt gelijkgesteld een laboratorium dat is geaccrediteerd door
      een bevoegde accreditatie-instelling in een andere lidstaat van de Europese Unie dan wel in een staat, niet zijnde
      een lidstaat van de Europese Unie, die partij is bij de overeenkomst inzake de Europese Economische Ruimte, en
      dat een kwaliteitsniveau waarborgt dat ten minste gelijkwaardig is aan het niveau dat met de nationale eisen wordt
      nagestreefd.


      [ref1]: https://wetten.overheid.nl/BWBR0007667
      [ref2]: https://wetten.overheid.nl/BWBR0016439
      [ref3]: https://wetten.overheid.nl/BWBR0016439
      [ref4]: https://wetten.overheid.nl/BWBR0016439
    url: https://wetten.overheid.nl/BWBR0016439/2006-01-01#Artikel4
