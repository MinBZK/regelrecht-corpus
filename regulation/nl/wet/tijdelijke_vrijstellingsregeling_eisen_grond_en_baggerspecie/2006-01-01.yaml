articles:
  - number: '1'
    text: |-
      1 Op deze regeling zijn de begripsbepalingen van
      [artikel 1 van het Bouwstoffenbesluit bodem- en oppervlaktewaterenbescherming][ref1] van toepassing.

      2 In deze regeling wordt verstaan onder:

      a. Besluit: [Bouwstoffenbesluit bodem- en oppervlaktewaterenbescherming][ref2];

      b. bijlage 2: de [bij het Besluit behorende bijlage 2][ref3];

      c. baggerspecie: grond die uit de bodem is vrijgekomen via het oppervlaktewater of de voor dat water bestemde
      ruimte, daaronder begrepen sediment.


      [ref1]: https://wetten.overheid.nl/BWBR0007667#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007667
      [ref3]: https://wetten.overheid.nl/BWBR0007667
    url: https://wetten.overheid.nl/BWBR0016439/2006-01-01#Artikel1
