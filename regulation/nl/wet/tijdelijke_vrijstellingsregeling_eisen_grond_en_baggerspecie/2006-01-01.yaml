  - number: '7'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst en vervalt vijf jaar na het tijdstip van inwerkingtreding.
    url: https://wetten.overheid.nl/BWBR0016439/2006-01-01#Artikel7
