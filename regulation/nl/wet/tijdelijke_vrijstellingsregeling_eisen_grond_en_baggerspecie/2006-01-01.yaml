  - number: '5'
    text: |-
      Het op of in de bodem gebruiken van grond waarvan de samenstellingswaarde, zoals aangegeven in [bijlage 2][ref1],
      voor EOCl (totaal) wordt overschreden, is toegestaan, mits de in EOCl (totaal) aanwezige halogeenverbindingen de
      samenstellingswaarden voor elk van die verbindingen, zoals aangegeven in [bijlage 2][ref2], niet overschrijden
      en de betreffende grond voldoet aan de overige samenstellings- en immissiewaarden, zoals aangegeven in
      [bijlage 2][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007667
      [ref2]: https://wetten.overheid.nl/BWBR0007667
      [ref3]: https://wetten.overheid.nl/BWBR0007667
    url: https://wetten.overheid.nl/BWBR0016439/2006-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007667
      - id: ref2
        bwb_id: BWBR0007667
      - id: ref3
        bwb_id: BWBR0007667
  - number: '6'
    text: |-
      Voor het gebruiken van baggerspecie op of in de bodem, wordt de samenstellingswaarde, zoals aangegeven in
      [bijlage 2][ref1], voor minerale olie verhoogd tot 2000 mg/kg droge stof, mits degene die voornemens is die
      baggerspecie te gebruiken, bij de melding, bedoeld in [artikel 11, eerste lid, van het Besluit][ref2], behoudens
      de gegevens genoemd in [bijlage 3, behorende bij artikel 11, zevende lid, van het Besluit][ref3], gegevens over de
      herkomst van de baggerspecie verstrekt met behulp waarvan kan worden vastgesteld of er sprake is van uitsluitend
      baggerspecie.


      [ref1]: https://wetten.overheid.nl/BWBR0007667
      [ref2]: https://wetten.overheid.nl/BWBR0007667#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0007667
    url: https://wetten.overheid.nl/BWBR0016439/2006-01-01#Artikel6
