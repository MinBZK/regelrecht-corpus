  - number: '4'
    text: De standplaats van de inspecteur en van de ontvanger van het Bureau Heffingen is Assen.
    url: https://wetten.overheid.nl/BWBR0009814/1999-10-28#Artikel4
  - number: '5'
    text: |-
      De verplichtingen die ingevolge de [artikelen 47][ref1], [47b][ref2], [48][ref3], [49][ref4], [50][ref5],
      [53][ref6] en [55 van de Algemene wet inzake rijksbelastingen][ref7] bestaan jegens de inspecteur van het Bureau
      Heffingen, gelden mede jegens de door die inspecteur aangewezen ambtenaren van het Bureau Heffingen en jegens de
      ambtenaren van de Algemene Inspectiedienst van het Ministerie van Landbouw, Natuurbeheer en Visserij.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel47
