        artikel: 91e
  - number: '10'
    text: |-
      1 De heffingplichtige houdt een administratie bij van het aantal door hem gehouden varkens, onderscheiden naar
      de in de bijlage, behorende bij [artikel 91b, eerste lid, van de Gezondheids- en welzijnswet voor dieren][ref1],
      opgenomen diercategorieën binnen die diersoort. Indien een heffingplichtige op meer dan één bedrijf varkens houdt,
      houdt hij voor elk bedrijf afzonderlijk een administratie bij.

      2 De administratie bevat de gegevens en wordt opgemaakt overeenkomstig artikel 2 van de Regeling administratieve
      verplichtingen Meststoffenwet.

      3 De administratie bevat de gegevens en wordt opgemaakt overeenkomstig artikel 3 van de Regeling administratieve
      verplichtingen Meststoffenwet, indien op het bedrijf [artikel 38, eerste lid, van de Meststoffenwet][ref2] van
      toepassing is.

      4 De administratie heeft betrekking op een jaar en wordt afgesloten vóór de eerste februari volgend op het jaar
      waarop deze betrekking heeft.

      5 Het eerste lid is niet van toepassing op de heffingplichtige die een bedrijf voert waarvan het gemiddeld in
      een jaar op het bedrijf gehouden aantal dieren van de in [bijlage A bij de Meststoffenwet][ref3] onderscheiden
      diercategorieën, omgerekend in grootvee-eenheden overeenkomstig de in die bijlage daarvoor opgenomen normen, drie
      of minder bedraagt, en de gemiddeld in het desbetreffende jaar tot het bedrijf behorende oppervlakte landbouw-grond
      drie hectare of minder bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel91b
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0009814/1999-10-28#Artikel10
    references:
      - id: ref1
