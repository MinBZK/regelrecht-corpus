        hoofdstuk: III
  - number: '16'
    text: |-
      1 Deze regeling treedt in werking met ingang van 1 september 1998.

      2 Deze regeling wordt aangehaald als: Uitvoeringsregeling varkensheffing.

      Deze regeling zal met de toelichting in de Staatscourant worden geplaatst met uitzondering van de bijlage, die ter
      inzage wordt gelegd bij de bibliotheek van het Ministerie van Landbouw, Natuurbeheer en Visserij alsmede bij de
      Dienst Landelijke service bij regelingen (LASER) van het Ministerie van Landbouw, Natuurbeheer en Visserij.
    url: https://wetten.overheid.nl/BWBR0009814/1999-10-28#Artikel16
