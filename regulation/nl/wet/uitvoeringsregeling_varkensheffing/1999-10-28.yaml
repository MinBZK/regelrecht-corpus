  - number: '6'
    text: |-
      1 De heffingplichtige die niet binnen zes maanden na afloop van het tijdvak waarover de varkensheffing wordt
      geheven, is uitgenodigd tot het doen van aangifte, verzoekt de inspecteur om uitnodiging tot het doen van aangifte.

      2 Het in het eerste lid bedoelde verzoek wordt ingediend binnen twee weken na het verstrijken van de in het eerste
      lid bedoelde termijn van zes maanden.

      3 Het eerste lid is niet van toepassing indien over het tijdvak waarover de varkensheffing verschuldigd is reeds
      een aanslag is opgelegd.

      4 De verplichting, bedoeld in het eerste lid, geldt mede voor de in de [artikelen 43][ref1] en
      [44, eerste lid, van de Algemene wet inzake rijksbelastingen][ref2] bedoelde personen.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel44
    url: https://wetten.overheid.nl/BWBR0009814/1999-10-28#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '43'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '44'
  - number: '7'
    text: Het uitnodigen tot het doen van aangifte wordt gedaan door het uitreiken of toezenden van een aangiftebiljet.
    url: https://wetten.overheid.nl/BWBR0009814/1999-10-28#Artikel7
  - number: '8'
    text: |-
      Aangifte wordt gedaan door het inleveren of toezenden van het uitgereikte of toegezonden aangiftebiljet, dat is
      ingevuld en ondertekend op de bij het biljet aangegeven wijze, met de bij het biljet gevraagde bescheiden.
    url: https://wetten.overheid.nl/BWBR0009814/1999-10-28#Artikel8
  - number: '9'
    text: |-
      1 De heffingplichtige doet jaarlijks voor 1 februari opgave van het aantal en de ligging van de vestigingen,
      bedoeld in [artikel 1, derde lid, van de Gezondheids- en welzijnswet voor dieren][ref1], waaruit zijn bedrijf
      bestaat.

      2 Voor de toepassing van het [eerste lid][ref2] en
      [artikel 91e van de Gezondheids- en welzijnswet voor dieren][ref3] worden de tot een vestiging behorende percelen
      grond, gebouwen of af-gescheiden gedeelten daarvan als aangrenzend beschouwd, indien zij onderling voor al het,
      voor het houden van varkens noodzakelijke, verkeer rechtstreeks bereikbaar zijn, anders dan via een openbare weg.

      3 De opgave, bedoeld in het eerste lid, geschiedt door het inleveren of toezenden van een overeenkomstig de daarbij
      aangegeven wijze volledig en naar waarheid ingevuld en ondertekend formulier, zoals opgenomen in bijlage 1 bij deze
      regeling, met de daarbij gevraagde bescheiden.

      4 In afwijking van het eerste lid is de heffingplichtige in 1998 verplicht de in het eerste lid bedoelde opgave te
      doen voor 14 oktober en in 1999 voor 15 april van het desbetreffende jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005662
      [ref3]: https://wetten.overheid.nl/BWBR0005662#Artikel91e
    url: https://wetten.overheid.nl/BWBR0009814/1999-10-28#Artikel9
    references:
      - id: ref1
