preamble:
  text: |-
    Gelet op de artikelen 1, vierde lid, 91b, tweede lid, 91g, 93, derde lid, en 93a, eerste, derde, vierde en zesde
    lid, van de Gezondheids- en welzijnswet voor dieren;

    Gelet op de artikelen 3, eerste lid, 6, eerste en derde lid, 8, eerste lid, 13, eerste lid, 56 en 62 van de
    Algemene wet inzake rijksbelastingen;

    Gelet op de artikelen 5 en 31 van de Invorderingswet 1990;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0009814/1999-10-28#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Deze regeling heeft betrekking op de in [hoofdstuk VIII van de Gezondheids- en welzijnswet voor dieren][ref1]
      geregelde varkensheffing.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#HoofdstukVIII
    url: https://wetten.overheid.nl/BWBR0009814/1999-10-28#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005662
        hoofdstuk: VIII
  - number: '2'
    text: |-
      In deze regeling wordt onder Bureau Heffingen verstaan: Bureau Heffingen van het Ministerie van Landbouw,
      Natuurbeheer en Visserij te Assen.
    url: https://wetten.overheid.nl/BWBR0009814/1999-10-28#Artikel2
  - number: '3'
    text: |-
      1 Met betrekking tot de varkensheffing gelden de bevoegdheden en verplichtingen van de hierna
      vermelde, in de [Algemene wet inzake rijksbelastingen][ref1], de [Invorderingswet 1990][ref2] en de
      [Kostenwet invordering rijksbelastingen][ref3] genoemde, functionarissen, voor de daarachter genoemde
      functionarissen:



              a
              de directeur:

                de directeur Financieel-Economische Zaken van het Ministerie van Landbouw, Natuurbeheer en Visserij;



              b
              de inspecteur:

                de inspecteur van het Bureau Heffingen;



              c
              de ontvanger:

                de ontvanger van het Bureau Heffingen;



              d
               de ambtenaren van de rijksbelastingdienst:

                de ambtenaren van het Bureau Heffingen en de ambtenaren van de Algemene Inspectiedienst van het
      Ministerie van Landbouw, Natuurbeheer en Visserij.




      2 De functionaris, bedoeld in
      [artikel 93a, eerste, vierde en zesde lid, van de Gezondheids- en welzijnswet voor dieren][ref4] is de ontvanger
      van het Bureau Heffingen.

      3 Als inspecteur van het Bureau Heffingen en als ontvanger van het Bureau Heffingen wordt aangewezen de Directeur
      Bureau Heffingen.


      [ref1]: https://wetten.overheid.nl/BWBR0004770
      [ref2]: https://wetten.overheid.nl/BWBR0004770
      [ref3]: https://wetten.overheid.nl/BWBR0002645
      [ref4]: https://wetten.overheid.nl/BWBR0005662#Artikel93a
    url: https://wetten.overheid.nl/BWBR0009814/1999-10-28#Artikel3
