        artikel: '38'
  - number: '12'
    text: |-
      1 De heffingplichtige doet jaarlijks voor 1 september van het jaar volgend op het desbetreffende jaar
      opgave van het in het desbetreffende jaar gemiddeld op het bedrijf gehouden aantal varkens, bedoeld in
      [artikel 91b, tweede lid, van de Gezondheids- en welzijnswet voor dieren][ref1], door gebruik te maken van het in
      artikel 14, tweede lid, van de Regeling administratieve verplichtingen Meststoffenwet bedoelde formulier.

      2 Over het jaar 1998 verstrekt de varkenshouder gegevens over het gemiddeld in dat jaar op het bedrijf gehouden
      aantal varkens door gebruik te maken van een daartoe door de Minister van Landbouw, Natuurbeheer en Visserij
      vastgesteld formulier, dat overeen-komstig de op het formulier aangegeven wijze volledig en naar waarheid is
      ingevuld en ondertekend.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel91b
    url: https://wetten.overheid.nl/BWBR0009814/1999-10-28#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: 91b
  - number: '13'
    text: |-
      1 Het gemiddeld in een jaar op een bedrijf gehouden aantal varkens wordt bepaald door:

      a. ingeval de administratie van het aantal op het bedrijf gehouden varkens de gegevens bevat en wordt opgemaakt
      overeenkomstig artikel 2 van de Regeling administratieve verplichtingen Meststoffenwet, de som van de aantallen
      dagelijks op het bedrijf gehouden varkens gedeeld door het aantal dagen waaruit het desbetreffende jaar bestaat,
      dan wel

      b. ingeval de administratie van het aantal op het bedrijf gehouden varkens de gegevens bevat en wordt opgemaakt
      overeenkomstig artikel 3 van de Regeling administratieve verplichtingen Meststoffenwet, de som van de aantallen op
      de eerste dag van elke maand op het bedrijf gehouden varkens gedeeld door 12.

      2 Het in 1998 gemiddeld op het bedrijf gehouden aantal varkens wordt bepaald voor het tijdvak dat bestaat uit het
      vanaf 1 september 1998 nog niet verstreken deel van het jaar door respectievelijk:

      a. de som van de aantallen dagelijks op het bedrijf gehouden varkens, gedeeld door
      het aantal dagen waaruit dat tijdvak bestaat, indien de administratie van het aantal
      op het bedrijf gehouden varkens de gegevens bevat en wordt opgemaakt overeen-komstig
      [artikel 3, eerste lid, van de Regeling administratieve verplichtingen Wet herstructurering varkenshouderij][ref1],
      dan wel

      b. de som van de aantallen op de eerste dag van elke maand op het bedrijf gehouden varkens, gedeeld door het
      aantal kalendermaanden waaruit dat tijdvak bestaat, indien de administratie van het aantal op het bedrijf gehouden
      varkens de gegevens bevat en wordt opgemaakt overeenkomstig artikel 3, tweede lid, van de Regeling admini-stratieve
      verplichtingen [Wet herstructurering varkenshouderij][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009813#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009542
    url: https://wetten.overheid.nl/BWBR0009814/1999-10-28#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009813
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0009542
  - number: '14'
    text: |-
      1 De inspecteur legt een voorlopige aanslag op, indien het bedrag waarop de aanslag vermoedelijk zal worden
      vastgesteld, na verrekening van reeds opgelegde voorlopige aanslagen, zulks naar zijn mening rechtvaardigt.

      2 De bepaling van het bedrag van een voorlopige aanslag die wordt vastgesteld in het tijdvak waarover de
      varkensheffing wordt geheven, geschiedt op basis van de ten aanzien van het bedrijf van de heffingplichtige
      geregistreerde gegevens betreffende het varkensrecht, bedoeld in artikel 1, onderdeel h, van de Wet
      herstructurering varkens-houderij, geldend op de dag voorafgaand aan het opleggen van de voorlopige aanslag.
    url: https://wetten.overheid.nl/BWBR0009814/1999-10-28#Artikel14
  - number: '15'
    text: |-
      Bij de berekening van het bedrag van de invorderingsrente, bedoeld in [artikel 28 van de Invorderingswet 1990][ref1],
      is [hoofdstuk III van de Uitvoeringsregeling Invorderingswet 1990][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0004766#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0009814/1999-10-28#Artikel15
