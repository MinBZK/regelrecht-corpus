        bwb_id: BWBR0004054
  - number: '11'
    text: |-
      1 In afwijking van [artikel 10][ref1] houdt de heffingplichtige in 1998 een administratie
      bij van het aantal gehouden varkens, onderscheiden naar de in de bijlage, behorende bij
      [artikel 91b, eerste lid, van de Gezondheids- en welzijnswet voor dieren][ref2], opgenomen diercategorieën binnen
      die diersoort, in het nog niet verstreken deel van het jaar.

      2 De administratie bevat de gegevens en wordt opgemaakt overeenkomstig
      [artikel 3, eerste lid, van de Regeling administratieve verplichtingen Wet herstructurering varkenshouderij][ref3].

      3 De administratie bevat de gegevens en wordt opgemaakt overeenkomstig
      [artikel 3, tweede lid, van de Regeling administratieve verplichtingen Wet herstructurering varkenshouderij][ref4],
      indien op het bedrijf [artikel 38, eerste lid, van de Meststoffenwet][ref5] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0009814#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel91b
      [ref3]: https://wetten.overheid.nl/BWBR0009813#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0009813#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0004054#Artikel38
    url: https://wetten.overheid.nl/BWBR0009814/1999-10-28#Artikel11
