  - number: '4'
    text: Het subsidieplafond van deze regeling bedraagt f 200.000.000,-.
    url: https://wetten.overheid.nl/BWBR0010147/2002-01-01#Artikel4
  - number: '5'
    text: |-
      1 Een aanvraag tot subsidieverlening, bedoeld in [artikel 2][ref1], kan worden ingediend door de belanghebbende met
      ingang van 1 januari 1999 tot uiterlijk 30 november 1999 om 13.00 uur.

      2 De minister kan besluiten dat vanaf een door hem te bepalen tijdstip, voor bepaalde of voor onbepaalde tijd, geen
      aanvragen kunnen worden ingediend voor bepaalde categorieën van bedrijven of voor bedrijven die gelegen zijn in
      bepaalde gebieden en doet daarvan mededeling in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0010147#Artikel2
    url: https://wetten.overheid.nl/BWBR0010147/2002-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0010147
        artikel: '2'
        paragraaf: '2'
  - number: '6'
    text: |-
      1 Onder het voorbehoud dat de subsidie wordt verleend doet de belanghebbende gelijktijdig met zijn aanvraag aan het
      Bureau Heffingen een kennisgeving van het vervallen van het varkensrecht.

      2 De aanvraag wordt mede-ondertekend door de hypotheekhouder die een aanmelding als bedoeld in artikel 5, eerste
      lid, van de Regeling leges en blokkade Wet herstructurering varkenshouderij heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0010147/2002-01-01#Artikel6
  - number: '7'
    text: |-
      1 De aanvraag wordt ingediend bij het Bureau Heffingen met gebruikmaking van een daartoe door het Bureau Heffingen
      ter beschikking gesteld formulier.

      2 Een ingediende aanvraag wordt niet herroepen of gewijzigd.

      3 De aanvrager verschaft op verzoek van het Bureau Heffingen aanvullende gegevens, of legt bescheiden over op
      verzoek van het Bureau Heffingen, binnen een door het Bureau Heffingen te stellen termijn.
    url: https://wetten.overheid.nl/BWBR0010147/2002-01-01#Artikel7
  - number: '8'
    text: |-
      Door het indienen van het aanvraagformulier verplicht de aanvrager zich tot nakoming van de in deze regeling
      gestelde voorwaarden en verplichtingen.
    url: https://wetten.overheid.nl/BWBR0010147/2002-01-01#Artikel8
  - number: '9'
    text: De minister beslist op de aanvragen in volgorde van ontvangst.
    url: https://wetten.overheid.nl/BWBR0010147/2002-01-01#Artikel9
  - number: '10'
    text: |-
      Geen subsidie wordt verleend indien uit anderen hoofde een subsidie ter zake van de beëindiging op dat bedrijf van
      de varkenshouderij is verleend.
    url: https://wetten.overheid.nl/BWBR0010147/2002-01-01#Artikel10
  - number: '11'
    text: |-
      1 De subsidie wordt verleend onder de voorwaarde dat de Commissie van de Europese Gemeenschappen ingevolge de
      artikelen 92 en 93 van het EG-Verdrag verklaart geen bezwaar te maken tegen de toepassing van deze regeling.

      2 Van de in het eerste lid bedoelde verklaring wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0010147/2002-01-01#Artikel11
  - number: 11a
    text: |-
      In de beschikking tot subsidieverlening kan worden afgezien van de vermelding van het bedrag waarop de subsidie ten
      hoogste kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0010147/2002-01-01#Artikel11a
  - number: '12'
    text: |-
      Indien de subsidie is verleend doet de aanvrager met gebruikmaking van een daartoe door het Bureau Heffingen ter
      beschikking gesteld formulier, aan het Bureau Heffingen een kennisgeving of op zijn bedrijf op dat tijdstip varkens
      worden gehouden.
    url: https://wetten.overheid.nl/BWBR0010147/2002-01-01#Artikel12
  - number: '13'
    text: |-
      1 De varkens worden uiterlijk vijf maanden nadat de subsidie is verleend van het bedrijf afgevoerd, of, indien dit
      later is, vijf maanden nadat de Commissie van de Europese Gemeenschappen ingevolge de artikelen 92 en 93 van het
      EG-Verdrag heeft verklaard geen bezwaar te maken tegen de toepassing van deze regeling.

      2 Onmiddellijk nadat de varkens van het bedrijf zijn afgevoerd geeft de aanvrager daarvan kennis aan het Bureau
      Heffingen met gebruikmaking van een daartoe door het Bureau Heffingen ter beschikking gesteld formulier en stelt
      het Bureau Heffingen de subsidie vast.
    url: https://wetten.overheid.nl/BWBR0010147/2002-01-01#Artikel13
  - number: '14'
    text: |-
      Onmiddellijk nadat de subsidie is vastgesteld, doch uiterlijk vijf maanden nadat de subsidie is verleend,
      registreert het Bureau Heffingen de kennisgeving van het vervallen van het varkensrecht.
    url: https://wetten.overheid.nl/BWBR0010147/2002-01-01#Artikel14
  - number: '15'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0010147/2002-01-01#Artikel15
  - number: '16'
    text: 'Deze regeling wordt aangehaald als: Opkoopregeling varkensrechten.'
    url: https://wetten.overheid.nl/BWBR0010147/2002-01-01#Artikel16
