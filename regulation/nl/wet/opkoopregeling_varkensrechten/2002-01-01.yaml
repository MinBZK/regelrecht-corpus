        paragraaf: '3'
  - number: '2'
    text: |-
      1 De minister kan aan een bedrijf subsidie verlenen ter zake van de beëindiging op dat bedrijf van de
      varkenshouderij.

      2 Onder beëindiging van de varkenshouderij wordt verstaan de in [artikel 30 van de wet][ref1] bedoelde registratie
      van de kennisgeving van het vervallen van het varkensrecht van het bedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel30
    url: https://wetten.overheid.nl/BWBR0010147/2002-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '30'
  - number: '3'
    text: |-
      1 De subsidie bedraagt de som van:

      a. 100% van het grondgebonden deel van het varkensrecht vermenigvuldigd met de representatieve marktwaarde per
      varkenseenheid;

      b. 75% van het niet-grondgebonden deel van het varkensrecht, vermenigvuldigd met de representatieve marktwaarde
      per varkenseenheid.

      2 De Minister stelt wekelijks de representatieve marktwaarde per varkenseenheid, bedoeld in het eerste lid,
      vast en doet daarvan mededeling in de Staatscourant. De representatieve marktwaarde van een varkenseenheid kan
      voor het fokzeugenrecht en het varkensrecht, niet zijnde fokzeugenrecht, voor het concentratiegebied Oost en het
      concentratiegebied Zuid verschillend worden vastgesteld.

      3 Zolang nog geen mededeling als bedoeld in het tweede lid is gedaan bedraagt de representatieve marktwaarde per
      varkenseenheid voor een bedrijf gelegen in het:

      a. concentratiegebied Zuid: € 317,65 voor het varkensrecht, niet zijnde fokzeugenrecht en € 347,60 voor het
      fokzeugenrecht;

      b. concentratiegebied Oost: € 260,92 voor het varkensrecht, niet zijnde fokzeugenrecht, en € 314,47 voor het
      fokzeugenrecht;

      c. niet-concentratiegebied: € 260,92 voor het varkensrecht, niet zijnde fokzeugenrecht en € 298,13 voor het
      fokzeugenrecht.

      4 Voor de bepaling van de ligging van een bedrijf is [artikel 17, vierde lid, van de wet][ref1] van overeenkomstige
      toepassing.

      5 Voor de bepaling van de hoogte van de subsidie is van toepassing de op grond van het tweede lid vóór de datum
      van de aanvraag tot subsidieverlening laatstelijk in de Staatscourant bekendgemaakte representatieve marktwaarde,
      of indien nog geen mededeling als bedoeld in het tweede lid is gedaan de in het derde lid genoemde representatieve
      marktwaarde.

      6 Voor de bepaling van de hoogte van de subsidie wordt het varkensrecht niet in aanmerking genomen, voorzover de
      hoogte daarvan mede wordt bepaald overeenkomstig [artikel 2, eerste lid][ref2], juncto [paragraaf 3][ref3], 4 of
      5 van [hoofdstuk 2 van het Besluit hardheidsgevallen herstructurering varkenshouderij][ref4] en op de datum van
      de aanvraag tot subsidieverlening niet is voldaan aan artikel 9, eerste lid en tweede lid, onderdelen b en c, van
      dat besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0010147#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0010147#Paragraaf3
      [ref4]: https://wetten.overheid.nl/BWBR0009705#Hoofdstuk2
