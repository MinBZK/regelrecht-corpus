articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder bedrijf, Bureau Heffingen, varkensrecht, fokzeugenrecht, concentratiegebied
      Zuid, concentratiegebied Oost en grondgebonden deel van het varkensrecht, hetgeen daaronder wordt verstaan
      in [artikel 1 van de Wet herstructurering varkenshouderij][ref1], wordt verstaan onder belanghebbende hetgeen
      daaronder wordt verstaan in [artikel 5, eerste lid, onderdeel j, van de Wet herstructurering varkenshouderij][ref2]
      en wordt verstaan onder:



            a
            wet:

              [Wet herstructurering varkenshouderij][ref3];



            b
            minister:

              Minister van Landbouw, Natuurbeheer en Visserij;



            c
            aanvrager:

              degene die overeenkomstig [paragraaf 3][ref4] een aanvraag tot subsidieverlening indient;



            d
            niet-concentratiegebied:

              gebied in Nederland gelegen buiten het concentratiegebied Zuid en het concentratiegebied Oost;



            e
            niet-grondgebonden deel van het varkensrecht:

              varkensrecht verminderd met het grondgebonden deel van het varkensrecht.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009542#Artikel5
