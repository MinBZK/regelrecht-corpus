  - number: '6'
    text: |-
      1 De subsidiabele kosten komen ten hoogste overeen met het bedrag van een lening die met het oog op de financiering
      van de in het tweede lid bedoelde kosten is aangegaan, en bedragen nooit meer dan € 100.000,00.

      2 Als subsidiabele kosten worden uitsluitend de kosten, exclusief BTW, voor investeringen in bedrijfsmiddelen in
      aanmerking genomen betreffende:

      a. de bouw, verwerving, verbetering of inrichting van onroerende goederen, niet zijnde grond;

      b. de verwerving of verbetering van grond, of

      c. de aanschaf van nieuwe machines en apparatuur, waarvan de subsidieaanvrager eerste gebruiker is,

      telkens voor zover deze investeringen leiden tot verwezenlijking van een of meer van de in [artikel 2][ref1]
      bedoelde doelen.

      3 De investeringen die betrekking hebben op de verwerving van grond, bedoeld in het tweede lid, onderdeel b:

      a. maken voor ten hoogste 10% deel uit van de totale subsidiabele kosten, bedoeld in het eerste lid, en

      b. hebben een rechtstreeks verband met een of meer van de in [artikel 2][ref2] genoemde doelen.

      4 De kosten voor de verwerving van onroerende goederen, bedoeld in het tweede lid, onderdelen a en b, zijn de
      kosten met inbegrip van de daaraan verbonden kosten van overdrachtsbelasting, notariële kosten en de kosten van
      inschrijving bij het kadaster.


      [ref1]: https://wetten.overheid.nl/BWBR0018190#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018190#Artikel2
    url: https://wetten.overheid.nl/BWBR0018190/2006-04-15#Artikel6
