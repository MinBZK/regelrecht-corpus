  - number: '8'
    text: |-
      1 De aanvraag tot subsidieverlening wordt bij de Dienst Regelingen ingediend, op een daartoe door de Dienst
      Regelingen ter beschikking gesteld formulier.

      2 De aanvraag gaat in elk geval vergezeld van:

      a. een verklaring van een kredietinstelling dat het landbouwbedrijf economisch levensvatbaar is, en

      b. bewijsstukken waaruit blijkt op welke datum de aanvrager in de zin van
      [artikel 4, eerste lid, onderdeel b][ref1], is gevestigd op het landbouwbedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0018190#Artikel4
    url: https://wetten.overheid.nl/BWBR0018190/2006-04-15#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0018190
        artikel: '4'
        paragraaf: '2'
  - number: '9'
    text: |-
      1 Indien bij verlening van alle aanvragen het subsidieplafond, bedoeld in [artikel 3][ref1], zou worden
      overschreden, geschiedt de verlening volgens een rangschikking van de aanvragen, waarbij telkenmale de hoogst
      gerangschikte aanvraag het eerste voor verlening in aanmerking komt. De rangschikking vindt plaats volgens loting,
      die geschiedt door een notaris.

      2 Na verlening van de aanvragen overeenkomstig het eerste lid, geschiedt toewijzing van de aanvragen waarvan het
      landbouwbedrijf van de aanvrager zijn hoofdvestiging heeft in de provincies, die een additioneel subsidieplafond
      ter beschikking hebben gesteld, tot ten hoogste het voor de desbetreffende provincie op grond van het in het
      openstellingsbesluit vastgestelde additionele subsidieplafond. Verlening van de aanvragen geschiedt volgens een
      rangschikking van deze aanvragen, waarbij telkenmale de hoogst gerangschikte aanvraag het eerst voor toewijzing in
      aanmerking komt. De rangschikking wordt bepaald door de op grond van het eerste lid uitgevoerde loting.


      [ref1]: https://wetten.overheid.nl/BWBR0018190#Artikel3
    url: https://wetten.overheid.nl/BWBR0018190/2006-04-15#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0018190
        artikel: '3'
        paragraaf: '2'
  - number: '10'
    text: |-
      Geen subsidie wordt verstrekt:

      a. indien de te verstrekken subsidie niet ten minste € 5.000 bedraagt;

      b. indien de aanvrager meer dan één aanvraag tot subsidieverlening heeft ingediend;

      c. voor investeringen waarmee een begin van uitvoering is gemaakt – waaronder in elk geval wordt verstaan het
      aangaan van verplichtingen – alvorens de ontvangst van een aanvraag tot subsidieverlening schriftelijk aan de
      aanvrager is bevestigd;

      d. indien de lening, bedoeld in [artikel 6, eerste lid][ref1], is aangegaan alvorens de ontvangst van een aanvraag
      tot subsidieverlening schriftelijk aan de aanvrager is bevestigd;

      e. indien op grond van deze regeling eerder aan de aanvrager subsidie is uitbetaald of terzake van een eerdere
      aanvraag op grond van deze regeling nog een beslissing genomen moet worden tot vaststelling van de subsidie;

      f. indien voor de investeringen waarvoor de aanvrager subsidie heeft aangevraagd eerder door een bestuursorgaan een
      subsidie is verstrekt;

      g. indien het eigen vermogen van de aanvrager meer dan 60% bedraagt van de fiscale balanswaarde van het
      desbetreffende landbouwbedrijf;

      h. voor de verwerving van onroerende goederen, niet zijnde grond, als bedoeld in
      [artikel 6, tweede lid, onderdeel a][ref2], ten behoeve waarvan in de periode 10 jaar voorafgaand aan de datum van
      de subsidieaanvraag subsidie door een bestuursorgaan is verleend, en

      i. voor investeringen die gericht zijn op een productieverhoging waarvoor op de markt geen normale
      afzetmogelijkheden kunnen worden gevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0018190#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0018190#Artikel6
    url: https://wetten.overheid.nl/BWBR0018190/2006-04-15#Artikel10
