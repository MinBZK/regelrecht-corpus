  - number: '7'
    text: |-
      1 De subsidie bedraagt 20% van de subsidiabele kosten, bedoeld in [artikel 6][ref1].

      2 De subsidie bedraagt ten hoogste € 20.000,00.


      [ref1]: https://wetten.overheid.nl/BWBR0018190#Artikel6
