  - number: '2'
    text: |-
      De minister kan ter stimulering van de duurzame ontwikkeling van de agrarische sector op grond van de volgende
      bepalingen op aanvraag subsidie verlenen aan agrarische ondernemers voor investeringen in landbouwbedrijven die
      leiden tot:

      a. de verlaging van de productiekosten;

      b. de verbetering en omschakeling van de productie;

      c. de verhoging van kwaliteit;

      d. de instandhouding en verbetering van het natuurlijke milieu, de hygiënische omstandigheden en de normen op het
      gebied van dierenwelzijn, of

      e. bevordering van de diversificatie van landbouwactiviteiten.
    url: https://wetten.overheid.nl/BWBR0018190/2006-04-15#Artikel2
  - number: '3'
    text: |-
      1 De minister kan per kalenderjaar één of meer aanvraagperioden vaststellen voor subsidieaanvragen op grond van
      deze regeling.

      2 De minister stelt voor iedere aanvraagperiode een subsidieplafond vast voor op grond van deze regeling te
      verlenen subsidies.

      3 De minister maakt besluiten als bedoeld in het eerste en tweede lid bekend in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0018190/2006-04-15#Artikel3
  - number: '4'
    text: |-
      De subsidie wordt uitsluitend verstrekt aan een natuurlijke persoon die op de datum van de aanvraag, bedoeld in
      [artikel 3][ref1]:

      a. jonger is dan 40 jaar;

      b. op een landbouwbedrijf is gevestigd, en waarbij sinds de eerste vestiging niet meer dan drie jaren zijn
      verstreken, en

      c. beschikt over voldoende agrarische vakbekwaamheid, blijkend uit een getuigschrift van een erkende
      landbouwkundige opleiding of van een opleiding van een hiermee gelijkwaardig niveau of werkervaring van ten minste
      drie jaren op een landbouwbedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0018190#Artikel3
    url: https://wetten.overheid.nl/BWBR0018190/2006-04-15#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0018190
        artikel: '3'
        paragraaf: '2'
  - number: '5'
    text: |-
      Het landbouwbedrijf waarop de natuurlijke persoon, bedoeld in het [artikel 4][ref1], is gevestigd, is op de datum
      van de aanvraag, bedoeld in [artikel 3][ref2]:

      a. economisch levensvatbaar, en

      b. de exploitatie ervan voldoet aan de geldende nationale en Europese minimumnormen op het gebied
      van milieu, hygiëne en dierenwelzijn, hetgeen in ieder geval betekent dat op het tijdstip van het
      indienen van de aanvraag tot subsidieverlening het bedrijf wordt uitgeoefend met inachtneming van de
      bij of krachtens de [Wet milieubeheer][ref3], de [Wet verontreiniging oppervlaktewateren][ref4], de
      [Meststoffenwet][ref5], de [Wet bodembescherming][ref6], de [Bestrijdingsmiddelenwet 1962][ref7], de
      [Gezondheids- en welzijnswet voor dieren][ref8], [Diergeneesmiddelenwet][ref9], de [Plantenziektewet][ref10], de
      Arbeidsomstandighedenwet 1996, de [Warenwet][ref11] en de [Woningwet][ref12] geldende normen.


