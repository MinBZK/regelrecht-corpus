preamble:
  text: |-
    Gelet op titel II, hoofdstuk I, van verordening (EG) nr. 1257/1999 van de Raad van de Europese Unie van 17 mei 1999
    inzake steun voor plattelandsontwikkeling uit het Europees Oriëntatie- en Garantiefonds voor de Landbouw (EOGFL) en
    tot wijziging en instelling van een aantal verordeningen (PbEG L160);

    Gelet op verordening (EG) nr. 817/2004 van de Commissie van de Europese Gemeenschappen van 29 april 2004
    tot vaststelling van uitvoeringsbepalingen van Verordening (EG) nr. 1257/1999 van de Raad inzake steun voor
    plattelandsontwikkeling uit het Europees Oriëntatie- en Garantiefonds voor de Landbouw (EOGFL) (PB L 153);

    Gelet op het programmeringsdocument voor plattelandsontwikkeling voor Nederland met betrekking tot de
    programmaperiode 2000–2006, zoals goedgekeurd door de Commissie van de Europese Gemeenschappen bij beschikking
    nr. C (2000) 2751 def. van 28 september 2000, inclusief de door de Commissie van de Europese Gemeenschappen
    goedgekeurde wijzigingen van dit programmeringsdocument;

    Gelet op de artikelen 2 en 4 van de Kaderwet LNV-subsidies;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0018190/2006-04-15#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. minister: Minister van Landbouw, Natuur en Voedselkwaliteit;

      b. landbouw: akkerbouw, weidebouw, veehouderij, pluimveehouderij, tuinbouw – daaronder begrepen fruitteelt en het
      kweken van bomen, bloemen en bloembollen – teelt van griendhout en elke andere vorm van bodemcultuur hier te lande
      met uitzondering van bosbouw;

      c. landbouwbedrijf: geheel van productie-eenheden in Nederland bestaande uit een of meer gebouwen of gedeelten
      daarvan en daarbijbehorende cultuurgrond, uitsluitend of onder meer dienende tot de uitoefening van de landbouw;

      d. economische levensvatbaarheid: de omstandigheid dat een onderneming solvabel, liquide en niet
      structureel verliesgevend is onderscheidenlijk zal zijn, hetgeen blijkt uit de verklaring, bedoeld in
      [artikel 8, tweede lid, onderdeel a][ref1];

      e. kredietinstelling: kredietinstelling als bedoeld in
      [artikel 1, eerste lid, onderdeel a, onder 1° van de Wet toezicht kredietwezen 1992][ref2] die ingevolge
      [artikel 52, tweede lid, onderdelen a tot en met d van die wet][ref3] is geregistreerd;

      f. lening: schriftelijke overeenkomst van geldlening tussen de subsidieaanvrager en een kredietinstelling, met een
      looptijd van tenminste 3 jaar;

      g. Dienst Regelingen: Dienst Regelingen van het Ministerie van Landbouw, Natuur en Voedselkwaliteit;

      h. [verordening 1257/1999](31999R1257): [verordening (EG) nr. 1257/1999](31999R1257) van de Raad van de Europese
      Unie van 17 mei 1999 inzake steun voor plattelandsontwikkeling uit het Europees Oriëntatie- en Garantiefonds voor
      de Landbouw (EOGFL) en tot wijziging en instelling van een aantal verordeningen (PbEG L 160);

      i. vestiging: stichten van een nieuw landbouwbedrijf of het overnemen van een bestaand landbouwbedrijf, waarbij een
      natuurlijke persoon, die niet eerder een landbouwbedrijf volledig in eigendom, pacht of erfpacht heeft gehad voor
      eigen rekening en risico het landbouwbedrijf gaat uitoefenen en:

        - het betreffende landbouwbedrijf in eigendom, pacht of erfpacht verwerft, of
        - met een andere natuurlijke persoon, die niet eerder een landbouwbedrijf volledig in eigendom, pacht of erfpacht
      heeft gehad, gezamenlijk het betreffende landbouwbedrijf in eigendom, pacht of erfpacht verwerft.


      [ref1]: https://wetten.overheid.nl/BWBR0018190#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0005792#Artikel52
