  - number: '15'
    text: |-
      1 Onverminderd het bepaalde in de [Algemene wet bestuursrecht][ref1], besluit de minister in ieder geval tot
      weigering of intrekking van de beschikking tot subsidieverlening of de beschikking tot subsidievaststelling, indien
      de aanvrager door ernstige nalatigheid of opzet een onjuiste aanvraag tot subsidieverlening of -vaststelling heeft
      ingediend.

      2 De minister besluit tot weigering of intrekking van de subsidieverlening of de subsidievaststelling, indien de
      aanvrager naast de aanvraag tot subsidieverlening of subsidievaststelling op grond van deze regeling:

      a. in hetzelfde jaar een andere aanvraag tot subsidieverlening of subsidievaststelling bij een Nederlands
      bestuursorgaan heeft ingediend waarop titel II, hoofdstuk I, van [verordening 1257/1999](31999R1257) van toepassing
      is en deze andere aanvraag door ernstige nalatigheid of opzet onjuist is, of

      b. in het voorafgaande jaar een andere aanvraag tot subsidieverlening of subsidievaststelling bij een Nederlands
      bestuursorgaan heeft ingediend waarop titel II, hoofdstuk I, van [verordening 1257/1999](31999R1257) van toepassing
      is en deze andere aanvraag door opzet onjuist is.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0018190/2006-04-15#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: '16'
    text: |-
      De subsidieontvanger is verplicht een overzichtelijke en deugdelijke administratie te voeren ten aanzien van de
      investeringen waarop de beschikking tot subsidieverlening betrekking heeft en deze te bewaren gedurende tenminste
      vijf jaren na datum van de beschikking tot subsidievaststelling.
    url: https://wetten.overheid.nl/BWBR0018190/2006-04-15#Artikel16
  - number: '17'
    text: |-
      1 Een subsidie als bedoeld in [artikel 2][ref1] wordt verleend onder voorbehoud van goedkeuring door de Commissie
      van de Europese Gemeenschappen van het op 16 december 2004 door de Regering van het Koninkrijk der Nederlanden
      ingediende wijzigingsverzoek Plattelandsontwikkelingsplan Nederland 2004.

      2 De beslissing tot verlening van een subsidie kan worden ingetrokken of gewijzigd indien dit noodzakelijk is ter
      verkrijging van de in het eerste lid bedoelde goedkeuring van de Commissie van de Europese Gemeenschappen of wegens
      het uitblijven ervan.


      [ref1]: https://wetten.overheid.nl/BWBR0018190#Artikel2
    url: https://wetten.overheid.nl/BWBR0018190/2006-04-15#Artikel17
