  - number: '12'
    text: |-
      1 De subsidieaanvrager voert de investeringen uit overeenkomstig de beschikking tot subsidieverlening en de
      aanvraag tot subsidieverlening waarop deze beschikking betrekking heeft.

      2 De aanvrager wiens subsidie in 2005 is verleend, verricht de investeringen voor 1 juli 2006.

      3 De aanvrager wiens subsidie in 2006 is verleend, verricht de investeringen voor 25 september 2008.
    url: https://wetten.overheid.nl/BWBR0018190/2006-04-15#Artikel12
  - number: '13'
    text: |-
      De subsidieaanvrager is verplicht:

      a. de investering ten minste gedurende de fiscale afschrijvingstermijn ervan, met een maximum van 5 jaar, te
      rekenen vanaf de datum van de investering:

        - te gebruiken voor het doel waarvoor de investering blijkens de aanvraag tot subsidieverlening is verricht, en
        - niet te vervreemden, zonder dat een vervangingsinvestering met vergelijkbare functionaliteit wordt verricht.

      b. voor de op grond van deze regeling gesubsidieerde investeringen niet uit hoofde van enige andere voorziening
      subsidie te ontvangen.
    url: https://wetten.overheid.nl/BWBR0018190/2006-04-15#Artikel13
  - number: '14'
    text: |-
      1 De aanvraag tot subsidievaststelling wordt uiterlijk op 25 september 2008 ingediend bij de Dienst Regelingen op
      een daartoe door de Dienst Regelingen ter beschikking gesteld formulier.

      2 De aanvraag tot subsidievaststelling gaat vergezeld van:

      a. een afschrift van facturen en andere schriftelijke bewijsstukken waaruit kan worden opgemaakt op welk tijdstip
      verplichtingen met het oog op de investering zijn aangegaan en waaruit blijkt dat de investering is verricht;

      b. bankafschriften waaruit de betaling van de in onderdeel a bedoelde facturen blijkt;

      c. de lening, bedoeld in [artikel 6, eerste lid][ref1];

      d. voor zover de investering de aankoop van grond of gebouwen betreft: een door een beëdigd taxateur opgesteld
      taxatierapport, dat op de datum van de investering niet ouder is dan 6 maanden, waaruit blijkt dat voldaan wordt
      aan [artikel 11, onderdelen b en c][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018190#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0018190#Artikel11
    url: https://wetten.overheid.nl/BWBR0018190/2006-04-15#Artikel14
