  - number: '11'
    text: |-
      De subsidie wordt verleend onder de voorwaarde dat:

      a. de aanvrager ten minste ten bedrage van de investeringen een lening afsluit;

      b. voor zover de subsidie de verwerving van onroerende goederen, bedoeld in
      [artikel 6, tweede lid, onderdelen a en b][ref1], betreft: de kosten voor de verwerving van de onroerende goederen,
      exclusief de daaraan verbonden kosten van overdrachtsbelasting, notariële kosten en de kosten van inschrijving bij
      het kadaster, ten hoogste overeenkomen met een door een beëdigd taxateur vastgestelde vrije verkoopwaarde van de
      desbetreffende grond en gebouwen, en

      c. voor zover de subsidie de verwerving van onroerende goederen, niet zijnde grond, betreft, bedoeld in
      [artikel 6, tweede lid, onderdeel a][ref2]: een beëdigd taxateur heeft vastgesteld dat deze gebouwen voldoen
      aan de nationale voorschriften, hetgeen in ieder geval betekent dat voldaan wordt aan de bij of krachtens de
      [Wet milieubeheer][ref3], de [Wet op de ruimtelijke ordening][ref4] en de [Woningwet][ref5] geldende normen.


      [ref1]: https://wetten.overheid.nl/BWBR0018190#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0018190#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0003245
      [ref4]: https://wetten.overheid.nl/BWBR0002375
      [ref5]: https://wetten.overheid.nl/BWBR0005181
