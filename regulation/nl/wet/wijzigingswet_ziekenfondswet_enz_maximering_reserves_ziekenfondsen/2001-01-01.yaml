    text: |-
      1 De [artikelen I, onderdelen A, B, C, D, E, F][ref1], voor zover het betreft de wijzigingen van artikel
      43b, eerste en tweede lid, G, voor zover het betreft artikel 43c, III, IV, V, VI, VII, VIII en IX treden in
      werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin deze wet wordt geplaatst. De
      [artikelen IV][ref2], [V][ref3], [VII][ref4] en [VIII, met uitzondering van onderdeel C][ref5], werken terug tot
      en met 1 juli 1999.

      2 [Artikel I, onderdeel F][ref6], voor zover het betreft artikel 43b, derde, vierde en vijfde lid, en onderdeel
