preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Ziekenfondswet te wijzigen teneinde de mogelijkheid
    te scheppen de hoogte van reserves van ziekenfondsen aan een maximum te binden en enige daarmee verband houdende
    andere wijzigingen in de regels inzake financiering van ziekenfondsen aan te brengen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0011111/2001-01-01#ArtikelAanhef
articles:
  - number: II
    text: |-
      De ziekenfondsen brengen de reserves, gevormd op grond van het bepaalde krachtens
      [artikel 19 van de Ziekenfondswet][ref1], zoals die bepaling luidde onmiddellijk voor het tijdstip van
      inwerkingtreding van deze wet, ten gunste of ten laste van de reserve [Ziekenfondswet][ref2], bedoeld in
      [artikel 43b, derde lid, van de Ziekenfondswet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0002460
      [ref3]: https://wetten.overheid.nl/BWBR0002460#Artikel43b
    url: https://wetten.overheid.nl/BWBR0011111/2001-01-01#ArtikelII
    references:
      - id: ref1
