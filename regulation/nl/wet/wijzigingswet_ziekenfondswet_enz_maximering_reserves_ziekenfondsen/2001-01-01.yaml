        bwb_id: BWBR0002460
        artikel: 43b
  - number: III
    text: |-
      Voor de financiering van de kosten ingevolge de [Ziekenfondswet][ref1] over kalenderjaren, aangevangen voor de
      inwerkingtreding van deze wet, blijft het bepaalde krachtens [artikel 19 van de Ziekenfondswet][ref2], zoals die
      bepaling luidde onmiddellijk voor het tijdstip van inwerkingtreding van deze wet, van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002460
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel19
    url: https://wetten.overheid.nl/BWBR0011111/2001-01-01#ArtikelIII
    references:
      - id: ref1
        bwb_id: BWBR0002460
      - id: ref2
        bwb_id: BWBR0002460
        artikel: '19'
  - number: IX
    text: |-
      Onze Minister van Volksgezondheid, Welzijn en Sport zendt voor 1 januari 2004 aan de beide kamers der Staten-
      Generaal een verslag over de toepassing van [artikel 43b, derde en vierde lid, van de Ziekenfondswet][ref1].
      Daarbij wordt tevens aangegeven op welke wijze alsmede op welk tijdstip een voorstel van wet zal worden ingediend
      dat ertoe strekt de hoogte van de reserve bij wet te bepalen.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel43b
    url: https://wetten.overheid.nl/BWBR0011111/2001-01-01#ArtikelIX
    references:
