  - number: '91.1'
    text: |-
      De inspecteur beslist op het verzoek, bedoeld in de [artikelen 20, eerste lid][ref1], [27, tweede lid][ref2],
      [30, eerste lid][ref3], [45, eerste en tweede lid][ref4], [54, derde lid][ref5], [66, eerste lid][ref6],
      [67, eerste lid][ref7], [68, eerste en tweede lid][ref8], [69, eerste tot en met derde lid][ref9],
