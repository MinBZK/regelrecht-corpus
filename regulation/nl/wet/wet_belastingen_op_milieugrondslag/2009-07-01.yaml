---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht-mvp/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_belastingen_op_milieugrondslag
regulatory_layer: WET
publication_date: '2023-12-27'
valid_from: '2009-07-01'
bwb_id: BWBR0007168
url: https://wetten.overheid.nl/BWBR0007168/2009-07-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is belastingen op grondwater, afvalstoffen en uranium-
    235 in te stellen en deze te zamen met de in de Wet milieubeheer opgenomen verbruiksbelastingen van brandstoffen te
    vervatten in één wet belastingen op milieugrondslag;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'Krachtens deze wet worden de volgende belastingen geheven:'
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel1
  - number: 1.a
    text: een belasting op grondwater;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel1
  - number: 1.b
    text: een belasting op leidingwater;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel1
  - number: 1.c
    text: een belasting op afvalstoffen;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel1
  - number: 1.d
    text: een belasting op kolen;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel1
  - number: 1.e
    text: een energiebelasting;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel1
  - number: 1.f
    text: een vliegbelasting;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel1
  - number: 1.g
    text: een verpakkingenbelasting.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel1
  - number: '2.1'
    text: 'Voor de toepassing van deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel2
  - number: 2.1.a
    text: 'Onze Minister: Onze Minister van Financiën;'
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel2
  - number: 2.1.b
    text: |-
      Onze Ministers: Onze Minister van Financiën en Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en
      Milieubeheer;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel2
  - number: 2.1.c
    text: |-
      GN-code: een code als bedoeld in [verordening (EEG) nr. 2658/87](31987R2658) van de Raad van de Europese
      Gemeenschappen van 23 juli 1987 met betrekking tot de tarief- en statistieknomenclatuur en het gemeenschappelijk
      douanetarief (PbEG L 256), zoals deze luidt op 1 januari 2002.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel2
  - number: '2.2'
    text: |-
      Bij regeling van Onze Minister kunnen de GN-codes, genoemd in [artikel 32, onderdeel a][ref1], en
      [artikel 47, eerste lid, onderdelen m en n][ref2], worden aangepast indien de overeenkomstige GN-codes zoals
      opgenomen in de [richtlijn nr. 2003/96/EG](32003L0096) van de Raad van de Europese Unie van 27 oktober 2003 tot
      herstructurering van de communautaire regeling voor de belasting van energieproducten en elektriciteit (PbEU L
      283), in overeenstemming met artikel 2, lid vijf, van die richtlijn zijn aangepast. In dat geval kan bij regeling
      van Onze Minister eveneens de datum in het eerste lid, onderdeel c, worden vervangen door de datum van de versie
      van de in dat onderdeel bedoelde verordening die aan de wijziging van de GN-codes ten grondslag heeft gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel47
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '32'
        hoofdstuk: V
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0007168
        artikel: '47'
        hoofdstuk: VI
        afdeling: '1'
  - number: '3.1'
    text: 'Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel3
  - number: 3.1.a
    text: 'grondwater: zoet grondwater;'
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel3
  - number: 3.1.b
    text: 'zoet grondwater: grondwater dat minder dan 300 milligram chloride per liter bevat;'
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel3
  - number: 3.1.c
    text: |-
      een inrichting: een inrichting als bedoeld in de [Grondwaterwet][ref1], bestemd tot het onttrekken van grondwater;


      [ref1]: https://wetten.overheid.nl/BWBR0003406
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003406
  - number: 3.1.d
    text: 'onttrekken van grondwater: het onttrekken van grondwater aan de bodem door middel van een inrichting;'
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel3
  - number: 3.1.e
    text: |-
      infiltreren van water: water in de bodem brengen ter aanvulling van het grondwater met het oog op het onttrekken
      van grondwater;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel3
  - number: 3.1.f
    text: 'pompcapaciteit: het maximum wateropbrengend vermogen van een inrichting in kubieke meter per uur;'
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel3
  - number: 3.1.g
    text: |-
      een waterleidingbedrijf: een waterleidingbedrijf in de zin van de [Waterleidingwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002246
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002246
  - number: 3.1.h
    text: |-
      OEDI: een door Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer aangewezen gecombineerde
      inrichting voor grondwaterwinning met voorschakeling van oeverfiltratie en diepinfiltratie.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel3
  - number: '3.2'
    text: 'Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen worden als één inrichting aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel3
  - number: 3.2.a
    text: inrichtingen die een samenhangend geheel vormen;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel3
  - number: 3.2.b
    text: |-
      inrichtingen van dezelfde houder die op minder dan een kilometer afstand van elkaar gelegen zijn en die worden
      gebruikt voor overeenkomstige doeleinden.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel3
  - number: '3.3'
    text: |-
      Als waterleidingbedrijf wordt mede aangemerkt de persoon die of het lichaam dat op zichzelf niet een
      waterleidingbedrijf is in de zin van de [Waterleidingwet][ref1], doch met een dergelijk bedrijf in financieel,
      organisatorisch en economisch opzicht zodanig is verweven dat die persoon of dat lichaam met dat bedrijf een
      eenheid vormt.


      [ref1]: https://wetten.overheid.nl/BWBR0002246
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002246
  - number: '3.4'
    text: 'Dit hoofdstuk is niet van toepassing op het onttrekken van grondwater:'
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel3
  - number: 3.4.a
    text: bij de ontwatering of afwatering van gronden;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel3
  - number: 3.4.b
    text: |-
      bij of ten behoeve van het ontginnen van mijnen, voor zover het onttrekken een uitvloeisel daarvan is en op een
      diepte van niet minder dan 500 meter - N.A.P. plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel3
  - number: '4'
    text: Onder de naam grondwaterbelasting wordt een belasting geheven ter zake van het onttrekken van grondwater.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel4
  - number: '5'
    text: De belasting wordt geheven van de houder van een inrichting.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel5
  - number: '6.1'
    text: De belasting wordt berekend over de onttrokken hoeveelheid grondwater, gemeten in kubieke meter.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel6
  - number: '6.2'
    text: |-
      Op de belasting wordt een vermindering toegepast, berekend over het aantal kubieke meter geïnfiltreerd water,
      indien het infiltreren van water geschiedt in overeenstemming met de voorwaarden welke daartoe zijn gesteld in de
      vergunning die voor het onttrekken of voor het infiltreren van water is verleend ingevolge de [Grondwaterwet][ref1]
      en voor zover het infiltreren van water geschiedt in rechtstreeks verband met een belaste onttrekking van
      grondwater.


      [ref1]: https://wetten.overheid.nl/BWBR0003406
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003406
  - number: '6.3'
    text: |-
      Bij op voordracht van Onze Ministers vast te stellen algemene maatregel van bestuur worden regels gesteld omtrent
      de wijze waarop het aantal kubieke meter van de onttrekking onderscheidenlijk de infiltratie van water wordt
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel6
  - number: '6.4'
    text: Bij regeling van Onze Minister worden nadere regels gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel6
  - number: '7'
    text: De belasting wordt verschuldigd op het tijdstip van onttrekking.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel7
  - number: '8.1'
    text: Het tarief bedraagt per kubieke meter onttrokken grondwater € 0,1915.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel8
  - number: '8.2'
    text: |-
      In afwijking van het eerste lid bedraagt het tarief nihil voor onttrekkingen door middel van een inrichting
      waarbij grondwater wordt onttrokken en vervolgens in een gesloten systeem weer volledig wordt teruggevoerd
      in hetzelfde watervoerende pakket als waaraan het is onttrokken, in overeenstemming met de voorwaarden welke
      daartoe zijn gesteld in de vergunning die voor het onttrekken en terugvoeren van water is verleend ingevolge de
      [Grondwaterwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003406
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003406
  - number: '8.3'
    text: |-
      In afwijking van het eerste lid bedraagt het tarief voor onttrekkingen met behulp van een OEDI per kubieke
      meter onttrokken grondwater € 0,0619 voor zover de in een jaar onttrokken hoeveelheid grondwater de in dat jaar
      geïnfiltreerde hoeveelheid water niet overschrijdt, met dien verstande dat in dat geval de onttrekking door middel
      van een oevergrondwaterwinning en de infiltratie niet in aanmerking worden genomen.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel8
  - number: '9'
    text: |-
      De in [artikel 6, tweede lid][ref1], bedoelde vermindering bedraagt per kubieke meter geïnfiltreerd water € 0,1604.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel6
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '6'
        hoofdstuk: II
        afdeling: '3'
  - number: '10.1'
    text: 'Vrijgesteld zijn de volgende onttrekkingen van grondwater:'
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel10
  - number: 10.1.a
    text: |-
      onttrekking door middel van een inrichting met een pompcapaciteit die niet meer bedraagt dan tien kubieke meter
      per uur;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel10
  - number: 10.1.b
    text: |-
      onttrekking door middel van een inrichting die uitsluitend wordt gebruikt voor het drooghouden van een bouwput ten
      behoeve van bouw- en waterbouwkundige werken, indien de te onttrekken hoeveelheid grondwater niet meer bedraagt dan
      50 000 kubieke meter per maand en de onttrekking niet langer duurt dan vier aaneengesloten maanden;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel10
  - number: 10.1.c
    text: |-
      onttrekking door middel van een inrichting die bij wijze van proef grondwater aan de bodem onttrekt, indien de
      te onttrekken hoeveelheid grondwater niet meer bedraagt dan 50 000 kubieke meter per maand en de onttrekking niet
      langer duurt dan vier aaneengesloten maanden;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel10
  - number: 10.1.d
    text: |-
      onttrekking door middel van een inrichting ten behoeve van noodvoorzieningen, waaronder mede wordt verstaan
      brandputten, koeling van noodstroomaggregaten, sprinklerinstallaties en dergelijke, indien deze uitsluitend worden
      gebruikt in buitengewone omstandigheden;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel10
  - number: 10.1.e
    text: |-
      onttrekking door middel van een inrichting die uitsluitend of nagenoeg uitsluitend wordt gebruikt voor beregenings-
      of bevloeiingsdoeleinden, dan wel voor beide doeleinden;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel10
  - number: 10.1.f
    text: onttrekkingen in het kader van een bodem- of grondwatersaneringsproject;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel10
  - number: 10.1.g
    text: |-
      onttrekkingen ten behoeve van koude- en warmteopslag door middel van een inrichting waarbij grondwater wordt
      onttrokken en vervolgens in een gesloten systeem weer volledig wordt teruggevoerd in hetzelfde watervoerende pakket
      als waaraan het is onttrokken, in overeenstemming met de voorwaarden welke daartoe zijn gesteld in de vergunning
      die voor het onttrekken en terugvoeren van water is verleend ingevolge de [Grondwaterwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003406
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003406
  - number: 10.1.h
    text: onttrekkingen ten behoeve van landijsbanen.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel10
  - number: '10.2'
    text: Een vrijstelling als bedoeld in het eerste lid, onderdelen b en c, wordt slechts één maal per inrichting verleend.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel10
  - number: '10.3'
    text: |-
      Indien zich in de in het eerste lid, onderdelen b en c, bedoelde periode van vier aaneengesloten maanden ten
      gevolge van aantoonbare overmacht een onderbreking in de werkzaamheden voordoet, wordt die periode verlengd met een
      periode die gelijk is aan de duur van de overmachtsituatie.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel10
  - number: '11.1'
    text: |-
      De belastingplichtige voert een administratie waaruit de hoeveelheden van de onttrekkingen en van de infiltraties
      van water duidelijk blijken.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel11
  - number: '11.2'
    text: |-
      Geen administratie behoeft te worden gevoerd ter zake van een onttrekking als bedoeld in
      [artikel 10, eerste lid, onderdelen a, d, e, f, g en h][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel10
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '10'
        hoofdstuk: II
        afdeling: '5'
  - number: '11.3'
    text: |-
      Geen administratie behoeft te worden gevoerd ter zake van een onttrekking als bedoeld in
      [artikel 10, eerste lid, onderdelen b en c][ref1], indien vaststaat dat de onttrekking niet langer dan twee
      aaneengesloten maanden zal duren en de pompcapaciteit van de inrichting minder dan zestig kubieke meter per uur
      bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel10
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '10'
        hoofdstuk: II
        afdeling: '5'
  - number: '11.4'
    text: |-
      Bij regeling van Onze Minister worden nadere regels gesteld met betrekking tot de wijze waarop aan de in het eerste
      lid bedoelde verplichting wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel11
  - number: '12'
    text: 'Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel12
  - number: 12.a
    text: |-
      leidingwater: water dat door een waterleidingbedrijf of een afzonderlijke watervoorziening aan derden ter
      beschikking wordt gesteld, al dan niet van drinkwaterkwaliteit;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel12
  - number: 12.b
    text: |-
      waterleidingbedrijf: een waterleidingbedrijf als bedoeld in de [Waterleidingwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002246
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002246
  - number: 12.c
    text: |-
      afzonderlijke watervoorziening: landgebonden voorziening, niet zijnde een waterleidingbedrijf, voor de winning
      of behandeling van water, dat met behulp van een leiding of distributienet als leidingwater ter beschikking wordt
      gesteld;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel12
  - number: 12.d
    text: |-
      aansluiting: een aansluiting van een in Nederland gelegen onroerende zaak als bedoeld in
      [artikel 16, onderdelen a tot en met e, van de Wet waardering onroerende zaken][ref1], op het distributienet van
      een waterleidingbedrijf of van een afzonderlijke watervoorziening, waaruit leidingwater aan de verbruiker wordt
      geleverd; een aansluiting kan bestaan uit een of meer leveringspunten;


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel16
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '16'
  - number: 12.e
    text: |-
      particuliere installatie voor centrale watervoorziening: installatie voor
      de levering van water aan meer dan een onroerende zaak als bedoeld in
      [artikel 16, onderdelen a tot en met e, van de Wet waardering onroerende zaken][ref1], welke installatie permanent
      is aangesloten op het distributienet van een waterleidingbedrijf of van een afzonderlijke watervoorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel16
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '16'
  - number: '13'
    text: Onder de naam belasting op leidingwater wordt een belasting geheven op leidingwater.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel13
  - number: '14.1'
    text: |-
      De belasting wordt geheven ter zake van de levering van leidingwater via een aansluiting aan de verbruiker,
      met dien verstande dat de belasting wordt geheven over een hoeveelheid van maximaal 300 kubieke meter per
      verbruiksperiode van twaalf maanden per aansluiting.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel14
  - number: '14.2'
    text: |-
      Bij een verbruiksperiode korter dan wel langer dan twaalf maanden wordt de in het eerste lid genoemde
      hoeveelheidsgrens naar evenredigheid verlaagd, onderscheidenlijk verhoogd.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel14
  - number: '14.3'
    text: |-
      Bij de levering van leidingwater aan een particuliere installatie voor centrale watervoorziening wordt, in
      afwijking in zoverre van het eerste lid, de belasting geheven over de totale hoeveelheid geleverd water, met
      dien verstande dat, indien de exploitant van de installatie aan degene die het leidingwater heeft geleverd
      een verklaring heeft overgelegd waarin opgaaf wordt gedaan van het aantal onroerende zaken, bedoeld in
      [artikel 16, onderdelen a tot en met e, van de Wet waardering onroerende zaken][ref1] dat door de installatie van
      water wordt voorzien, ten hoogste wordt geheven over een hoeveelheid van 300 kubieke meter vermenigvuldigd met
      dat aantal.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel16
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '16'
  - number: '14.4'
    text: Bij regeling van Onze Minister worden nadere regels gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel14
  - number: '15'
    text: De belasting wordt geheven van degene die de levering verricht.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel15
  - number: '16.1'
    text: De belasting wordt geheven per eenheid leidingwater, gemeten in kubieke meter.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel16
  - number: '16.2'
    text: |-
      Ingeval de hoeveelheid geleverd leidingwater niet in kubieke meter bekend is, wordt de belasting geheven over een
      hoeveelheid die wordt berekend door het bedrag dat ter zake van de levering van water in rekening wordt gebracht,
      te verminderen met het vastrecht dat door de leverancier aan huishoudelijke verbruikers in rekening wordt gebracht
      indien wel een meter aanwezig is, en de uitkomst te delen door de prijs per kubieke meter die de leverancier in
      rekening brengt aan die verbruikers.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel16
  - number: '17.1'
    text: 'De belasting wordt verschuldigd:'
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel17
  - number: 17.1.a
    text: |-
      in gevallen waarin een voorschotnota wordt uitgereikt of, indien geen voorschotnota wordt uitgereikt, een
      voorschotbedrag wordt ontvangen:
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel17
  - number: 17.1.a.1°
    text: |-
      op het tijdstip waarop een voorschotnota wordt uitgereikt onderscheidenlijk een voorschotbedrag wordt ontvangen;
      alsmede
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel17
  - number: 17.1.a.2°
    text: op het tijdstip van de uitreiking van de eindfactuur over een verbruiksperiode;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel17
  - number: 17.1.b
    text: |-
      in gevallen waarin geen voorschotnota wordt uitgereikt en geen voorschotbedrag wordt ontvangen, op het tijdstip van
      de uitreiking van de factuur;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel17
  - number: 17.1.c
    text: in overige gevallen op het tijdstip waarop de levering plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel17
  - number: '17.2'
    text: |-
      Voor de toepassing van het eerste lid, onderdeel a, onder 1°, in samenhang met [artikel 14, eerste lid][ref1],
      wordt de hoeveelheid leidingwater, waarop de voorschotnota dan wel het voorschotbedrag is gebaseerd, aangemerkt als
      geleverde hoeveelheid.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel14
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '14'
        hoofdstuk: III
        afdeling: '2'
  - number: '17.3'
    text: |-
      In gevallen waarin per verbruiksperiode van twaalf maanden meer dan 300 kubieke meter leidingwater via een
      aansluiting aan een verbruiker wordt geleverd en ter zake van die levering voorschotnota’s worden uitgereikt
      of voorschotbedragen worden ontvangen, wordt bij de berekening van de op de verbruiksperiode betrekking
      hebbende voorschotbedragen naar evenredigheid rekening gehouden met de belasting die overeenkomstig
      [artikel 14, eerste lid][ref1], ter zake van de hoeveelheid van 300 kubieke meter verschuldigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel14
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '14'
        hoofdstuk: III
        afdeling: '2'
  - number: '17.4'
    text: |-
      Onder de in het eerste lid, onderdeel a, onder 2°, bedoelde eindfactuur wordt verstaan de factuur die wordt
      opgemaakt na afloop van een verbruiksperiode en waarin verrekening plaatsvindt met de op deze verbruiksperiode
      betrekking hebbende voorschotbedragen.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel17
  - number: '17.5'
    text: |-
      Indien de in het vierde lid bedoelde verrekening leidt tot een lager bedrag dan over de verbruiksperiode
      aan belasting is voldaan, wordt het verschil in mindering gebracht op de aangifte over het tijdvak waarin de
      eindfactuur is uitgereikt.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel17
  - number: '18'
    text: Het tarief bedraagt € 0,154 per kubieke meter leidingwater.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel18
  - number: '19'
    text: |-
      Vrijstelling van de belasting wordt verleend ter zake van de levering van leidingwater door middel van
      noodvoorzieningen, waaronder worden verstaan brandkranen, sprinklerinstallaties en dergelijke, indien deze
      uitsluitend worden gebruikt in buitengewone omstandigheden.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel19
  - number: '20.1'
    text: |-
      Op verzoek wordt teruggaaf van de belasting verleend voor zover de belasting over de hoeveelheden leidingwater die
      door een verbruiker in een verbruiksperiode van twaalf maanden van verschillende leveranciers zijn betrokken, hoger
      is dan de belasting die zou zijn verschuldigd indien sprake was van één leverancier.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel20
  - number: '20.2'
    text: De teruggaaf, bedoeld in het eerste lid, wordt verleend aan de verbruiker.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel20
  - number: '20.3'
    text: |-
      Bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur worden regels gesteld met
      betrekking tot de indiening van het verzoek en de wijze waarop kan worden aangetoond dat aan de voorwaarden voor
      teruggaaf wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel20
  - number: '20.4'
    text: Bij regeling van Onze Minister worden nadere regels gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel20
  - number: '21.1'
    text: |-
      De in [artikel 15][ref1] bedoelde belastingplichtige voert een administratie waaruit duidelijk alle gegevens
      blijken die voor de heffing van de belasting van belang kunnen zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel15
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '15'
        hoofdstuk: III
        afdeling: '2'
  - number: '21.2'
    text: |-
      Bij regeling van Onze Minister worden nadere regels gesteld omtrent de wijze waarop aan de in het eerste lid
      bedoelde verplichting wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel21
  - number: '22.1'
    text: 'Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel22
  - number: 22.1.a
    text: |-
      afvalstoffen: afvalstoffen als bedoeld in de [Wet milieubeheer][ref1], en zeer laag radioactief afval;


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: 22.1.aa
    text: |-
      zeer laag radioactief afval: radioactieve afvalstoffen van natuurlijke bronnen van ioniserende
      straling, waarin de activiteit van de betrokken natuurlijke bronnen op enig moment gelijk is aan of
      hoger is dan de in [bijlage 1, tabel 1, van het Besluit stralingsbescherming][ref1] vermelde waarde,
      en de activiteitsconcentratie van de betrokken natuurlijke bronnen gelijk is aan of hoger is dan de in
      [bijlage 1, tabel 1, van het Besluit stralingsbescherming][ref2] vermelde waarde en lager is dan tien maal die
      waarde;


      [ref1]: https://wetten.overheid.nl/BWBR0012702
      [ref2]: https://wetten.overheid.nl/BWBR0012702
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0012702
      - id: ref2
        bwb_id: BWBR0012702
  - number: 22.1.b
    text: |-
      verwijdering: storten of verbranden van afvalstoffen, met uitzondering van verbranden met een hoofdgebruik als
      brandstof of een hoofdgebruik voor een andere wijze van energieopwekking;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel22
  - number: 22.1.ba
    text: |-
      nuttige toepassing: nuttige toepassing als bedoeld in de [Wet milieubeheer][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: 22.1.bb
    text: |-
      storten: storten als bedoeld in de [Wet milieubeheer][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: 22.1.c
    text: |-
      inrichting: een inrichting als bedoeld in de [Wet milieubeheer][ref1], werken daaronder niet begrepen, waarin
      afvalstoffen worden verwijderd;


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: 22.1.d
    text: |-
      baggerspecie: grond die uit de bodem is vrijgekomen via het oppervlaktewater of de voor dat water bestemde ruimte,
      daaronder begrepen sediment en het residu van de reiniging van baggerspecie;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel22
  - number: 22.1.e
    text: |-
      stoffen: chemische elementen en hun verbindingen, zoals deze voorkomen in de natuur dan wel door menselijk toedoen
      worden voortgebracht;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel22
  - number: 22.1.f
    text: 'preparaten: mengsels of oplossingen van stoffen;'
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel22
  - number: 22.1.g
    text: 'volumieke massa: gewicht per volume-eenheid uitgedrukt in kilogram per kubieke meter;'
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel22
  - number: 22.1.h
    text: 'percolaat: vloeistof die uit gestorte afvalstoffen komt of daarmee in contact is geweest;'
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel22
  - number: 22.1.i
    text: 'stortgas: gas dat uit gestorte afvalstoffen vrijkomt als gevolg van biologische afbraakreacties.'
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel22
  - number: '22.2'
    text: |-
      Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen worden niet tot afvalstoffen gerekend die
      stoffen, preparaten en andere producten, die voldoen aan de voorwaarden van bij algemene maatregel van bestuur
      opgesomde besluiten en regelingen volgens welke deze stoffen, preparaten en andere producten buiten inrichtingen
      met een stortplaats milieuhygiënisch verantwoord zijn toe te passen, dan wel bestemd zijn te worden gebruikt voor
      bij algemene maatregel van bestuur aan te wijzen toepassingen die hetzij verband houden met de bedrijfsvoering
      van de inrichting, hetzij deel uitmaken van het bedrijfsproces dat leidt tot de nuttige toepassing of verwijdering
      van afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel22
  - number: '23.1'
    text: 'Onder de naam afvalstoffenbelasting wordt een belasting geheven ter zake van:'
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel23
  - number: 23.1.a
    text: de afgifte ter verwijdering van afvalstoffen aan een inrichting;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel23
  - number: 23.1.b
    text: de verwijdering van afvalstoffen binnen de inrichting waarin deze zijn ontstaan.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel23
  - number: '23.2'
    text: De aan een inrichting afgegeven afvalstoffen worden geacht alle te zijn afgegeven ter verwijdering.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel23
  - number: '24'
    text: De belasting wordt geheven van de houder van een inrichting.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel24
  - number: '25.1'
    text: De belasting wordt berekend over het gewicht van de afvalstoffen, gemeten in kilogrammen.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel25
  - number: '25.2'
    text: |-
      Bij regeling van Onze Ministers kunnen regels worden gesteld omtrent de wijze waarop het gewicht van de
      afvalstoffen wordt bepaald.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel25
  - number: '26'
    text: 'De belasting wordt verschuldigd op het tijdstip waarop:'
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel26
  - number: 26.a
    text: de afvalstoffen ter verwijdering worden afgegeven;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel26
  - number: 26.b
    text: de afvalstoffen binnen de inrichting waarin deze stoffen zijn ontstaan, worden verwijderd.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel26
  - number: '27.1'
    text: |-
      Op de verschuldigde belasting wordt in mindering gebracht de belasting ter zake van stoffen, preparaten of
      andere producten die de inrichting, al dan niet na nuttige toepassing, hebben verlaten, met dien verstande dat de
      vermindering niet wordt toegepast ter zake van percolaat of stortgas.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel27
  - number: '27.2'
    text: |-
      Indien bij de afgifte van een afzonderlijke, duidelijk herkenbare afvalstoffenstroom aan een inrichting bekend is
      dat deze niet uitsluitend bestaat uit voor verwijdering bestemde afvalstoffen, kan de inspecteur op schriftelijk
      verzoek van de belastingplichtige toestaan dat voor de berekening van de verschuldigde belasting met betrekking tot
      die afvalstroom de totale hoeveelheid afgegeven afvalstoffen door toepassing van een verhoudingsgetal wordt herleid
      tot de hoeveelheid voor verwijdering afgegeven afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel27
  - number: '27.3'
    text: |-
      Het in het tweede lid bedoelde verhoudingsgetal wordt gebaseerd op de gegevens uit het voorafgaande tijdvak. Na
      afloop van het kalenderjaar vindt herrekening plaats op de voet van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel27
  - number: '27.4'
    text: |-
      Bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur kunnen voorwaarden en
      beperkingen worden gesteld waaronder de in het eerste lid bedoelde vermindering van belasting en het in het tweede
      lid bedoelde verhoudingsgetal worden toegepast.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel27
  - number: '27.5'
    text: Bij regeling van Onze Minister kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel27
  - number: '28.1'
    text: 'Het tarief bedraagt in geval van:'
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel28
  - number: 28.1.a
    text: 'het storten van afvalstoffen: € 89,71 per 1000 kilogram;'
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel28
  - number: 28.1.b
    text: 'het verbranden van afvalstoffen: nihil.'
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel28
  - number: '28.2'
    text: 'In afwijking van het eerste lid, onderdeel a, bedraagt het tarief € 14,81 per 1000 kilogram voor:'
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel28
  - number: 28.2.a
    text: |-
      afvalstoffen die uitsluitend bestaan uit de categorie van afvalstoffen, genoemd in
      [artikel 1, eerste lid, onder 21, van het Besluit stortplaatsen en stortverboden afvalstoffen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009094#Artikel1
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0009094
        artikel: '1'
  - number: 28.2.b
    text: |-
      gevaarlijke afvalstoffen als bedoeld in [artikel 1.1, eerste lid, van de Wet milieubeheer][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
  - number: 28.2.c
    text: afvalstoffen met een volumieke massa van meer dan 1100 kilogram per kubieke meter;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel28
  - number: 28.2.d
    text: |-
      bij regeling van Onze Ministers aan te wijzen afvalstoffen die niet verbrandbaar en niet herbruikbaar zijn, die
      onvermengd zijn met andere afvalstoffen en die rechtstreeks door de producent worden aangeboden.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel28
  - number: '28.3'
    text: |-
      Bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur kunnen voorwaarden worden
      gesteld met betrekking tot de toepassing van het tweede lid.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel28
  - number: '28.4'
    text: |-
      Bij regeling van Onze Ministers kunnen regels worden gesteld omtrent de wijze waarop de in het tweede lid bedoelde
      afvalstoffen moeten worden aangeboden.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel28
  - number: '29.1'
    text: Vrijgesteld is de verwijdering van baggerspecie.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel29
  - number: '29.2'
    text: |-
      Indien baggerspecie ter verwijdering wordt afgegeven aan inrichtingen waar op grond van de voor die inrichting
      geldende vergunning, bedoeld in de [Wet milieubeheer][ref1], ook andere afvalstoffen dan baggerspecie mogen worden
      gestort, wordt door de aanbieder van de baggerspecie aan de houder van de inrichting een verklaring overgelegd
      waaruit blijkt dat sprake is van baggerspecie.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: '29.3'
    text: |-
      De in het tweede lid bedoelde verklaring wordt verstrekt door Onze Minister van Volkshuisvesting, Ruimtelijke
      Ordening en Milieubeheer.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel29
  - number: '30.1'
    text: |-
      Op verzoek wordt teruggaaf verleend van belasting ter zake van afvalstoffen die afkomstig zijn van een overtreder
      jegens wie krachtens [artikel 18.2 van de Wet milieubeheer][ref1] bestuursdwang is toegepast, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel18
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '18'
  - number: 30.1.a
    text: |-
      de afvalstoffen ter verwijdering aan een inrichting zijn afgegeven door of vanwege het bevoegd gezag van een
      provincie of van een gemeente;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel30
  - number: 30.1.b
    text: de afvalstoffenbelasting door de houder van de inrichting bij de provincie of de gemeente in rekening is gebracht;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel30
  - number: 30.1.c
    text: de afvalstoffen gescheiden van andere afvalstoffen zijn afgegeven aan de inrichting; en
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel30
  - number: 30.1.d
    text: |-
      de kosten die verband houden met de toepassing van bestuursdwang, hieronder begrepen de stortkosten, de
      verschuldigde afvalstoffenbelasting en de overige kosten die direct met de verwijdering van de afvalstoffen verband
      houden, niet of niet geheel verhaald kunnen worden op de overtreder.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel30
  - number: '30.2'
    text: De teruggaaf wordt verleend aan de provincie of de gemeente, die de afvalstoffen ter verwijdering heeft afgegeven.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel30
  - number: '30.3'
    text: |-
      De teruggaaf bedraagt maximaal de betaalde afvalstoffenbelasting die naar evenredigheid is toe te rekenen aan het
      deel van de totale kosten van de toepassing van bestuursdwang dat niet verhaald kan worden op de overtreder.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel30
  - number: '31.1'
    text: |-
      De belastingplichtige is gehouden een administratie te voeren zodanig dat daaruit te allen tijde duidelijk blijken
      de aard, de hoeveelheid en de herkomst van de afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel31
  - number: '31.2'
    text: |-
      De belastingplichtige is gehouden de administratie zodanig in te richten dat daarin op overzichtelijke wijze is
      opgenomen welke stoffen, preparaten of andere producten als bedoeld in [artikel 22, tweede lid][ref1], in welke
      hoeveelheden en op welk tijdstip de inrichting zijn binnengebracht dan wel hebben verlaten.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel22
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '22'
        hoofdstuk: IV
        afdeling: '1'
  - number: '32'
    text: 'Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel32
  - number: 32.a
    text: 'kolen: producten van de GN-codes 2701, 2702 en 2704;'
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel32
  - number: 32.b
    text: |-
      brandstof: stof – met inbegrip van alle daaraan toegevoegde stoffen – dienende voor de verbranding met het doel de
      daarbij ontstane energie te benutten;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel32
  - number: 32.c
    text: |-
      duaal gebruik: aanwenden van kolen zowel als verwarmingsbrandstof als voor andere doeleinden dan als motor- of
      verwarmingsbrandstof;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel32
  - number: 32.d
    text: 'vervaardigen van kolen: elk handelen waarbij of waardoor kolen ontstaan;'
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel32
  - number: 32.e
    text: |-
      inrichting: iedere plaats waar op grond van de bepalingen van dit hoofdstuk kolen onder schorsing van belasting
      mogen worden vervaardigd, mogen worden verwerkt, voorhanden mogen zijn, mogen worden ontvangen en mogen worden
      verzonden;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel32
  - number: 32.f
    text: |-
      plaats voor tijdelijke opslag: plaats die als zodanig is goedgekeurd krachtens artikel 51, eerste lid, van het
      Communautair douanewetboek;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel32
  - number: 32.g
    text: 'lidstaat: lidstaat van de Europese Unie;'
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel32
  - number: 32.h
    text: |-
      derde land: elk ander grondgebied dan het grondgebied van de lidstaten zoals dat is omschreven in artikel 2 van
      richtlijn nr. 92/12/EEG van de Raad van de Europese Gemeenschappen van 25 februari 1992 betreffende de algemene
      regeling voor accijnsproducten, het voorhanden hebben en het verkeer daarvan en de controles daarop (PbEG L 76);
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel32
  - number: 32.i
    text: |-
      communautaire douaneregeling: communautaire douaneregeling als bedoeld in
      [artikel 1a, eerste lid, onderdeel I, van de Wet op de accijns][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel1a
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 1a
  - number: 32.j
    text: |-
      schorsing van belasting: stelsel waarin van kolen die worden vervaardigd, worden verwerkt, voorhanden zijn of
      worden vervoerd, op grond van de bepalingen van deze wet de belasting nog niet is geheven;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel32
  - number: 32.k
    text: |-
      ondernemer: ondernemer in de zin van [artikel 7 van de Wet op de omzetbelasting 1968][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel7
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '7'
  - number: 32.l
    text: 'uitslag: brengen van kolen buiten een plaats die voor kolen als inrichting is aangewezen;'
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel32
  - number: 32.m
    text: 'invoer: vanuit een derde land brengen van kolen in Nederland.'
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel32
  - number: '33.1'
    text: Als uitslag wordt mede aangemerkt het gebruik van kolen als brandstof binnen een inrichting.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel33
  - number: '33.2'
    text: 'Als uitslag wordt mede aangemerkt het voorhanden hebben van kolen waarvan de belasting niet is geheven, door:'
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel33
  - number: 33.2.a
    text: een ondernemer in het kader van zijn onderneming, anders dan in een inrichting;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel33
  - number: 33.2.b
    text: een publiekrechtelijk lichaam, anders dan als ondernemer;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel33
  - number: 33.2.c
    text: een natuurlijk persoon voor andere doeleinden dan voor persoonlijk gebruik.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel33
  - number: '33.3'
    text: |-
      Het tweede lid is, onder bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur te
      stellen voorwaarden, niet van toepassing met betrekking tot kolen die worden vervoerd naar:
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel33
  - number: 33.3.a
    text: een inrichting;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel33
  - number: 33.3.b
    text: een andere lidstaat via Nederland;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel33
  - number: 33.3.c
    text: een derde land.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel33
  - number: '33.4'
    text: |-
      Bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur worden nadere regels gesteld met
      betrekking tot de verplichtingen waaraan de in het tweede lid bedoelde personen of lichamen voor de toepassing van
      dit hoofdstuk moeten voldoen.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel33
  - number: '33.5'
    text: Bij regeling van Onze Minister kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel33
  - number: '34.1'
    text: 'Als uitslag wordt niet aangemerkt het brengen van kolen vanuit een inrichting naar:'
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel34
  - number: 34.1.a
    text: een andere inrichting;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel34
  - number: 34.1.b
    text: een ondernemer dan wel een publiekrechtelijk lichaam, anders dan als ondernemer, in een andere lidstaat;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel34
  - number: 34.1.c
    text: een derde land.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel34
  - number: '34.2'
    text: |-
      Als uitslag wordt niet aangemerkt het gebruik van kolen voor het vervaardigen van kolen, aardgas als bedoeld in
      [artikel 47, eerste lid, onderdeel m][ref1], producten die op grond van [artikel 48, tweede lid][ref2], als aardgas
      worden aangemerkt, of minerale oliën als bedoeld in [artikel 25 van de Wet op de accijns][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel48
      [ref3]: https://wetten.overheid.nl/BWBR0005251#Artikel25
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '47'
        hoofdstuk: VI
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0007168
        artikel: '48'
        hoofdstuk: VI
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005251
        artikel: '25'
  - number: '34.3'
    text: |-
      Bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur kunnen voorwaarden worden
      gesteld waaronder het eerste en tweede lid toepassing vinden.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel34
  - number: '34.4'
    text: Bij regeling van Onze Minister kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel34
  - number: '35.1'
    text: 'Als invoer wordt mede aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel35
  - number: 35.1.a
    text: |-
      het in Nederland beëindigen van een communautaire douaneregeling waaronder kolen zijn geplaatst, anders dan door
      plaatsing onder een andere communautaire douaneregeling;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel35
  - number: 35.1.b
    text: het in Nederland onttrekken van kolen aan een communautaire douaneregeling;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel35
  - number: 35.1.c
    text: |-
      het eigen gebruik als brandstof in Nederland van kolen die onder een communautaire douaneregeling zijn geplaatst of
      binnen een plaats voor tijdelijke opslag.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel35
  - number: '35.2'
    text: |-
      Als invoer wordt niet aangemerkt het, met inachtneming van bij op voordracht van Onze Minister vast te stellen
      algemene maatregel van bestuur te stellen voorwaarden:
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel35
  - number: 35.2.a
    text: brengen van kolen vanuit een derde land naar een inrichting of naar een plaats voor tijdelijke opslag;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel35
  - number: 35.2.b
    text: in Nederland plaatsen onder een communautaire douaneregeling van vanuit een derde land binnengebrachte kolen;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel35
  - number: 35.2.c
    text: brengen van kolen die zijn geplaatst onder een communautaire douaneregeling naar een inrichting;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel35
  - number: 35.2.d
    text: brengen van kolen vanuit een plaats voor tijdelijke opslag naar een inrichting;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel35
  - number: 35.2.e
    text: onder ambtelijk toezicht vernietigen van kolen die onder een communautaire douaneregeling zijn geplaatst.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel35
  - number: '35.3'
    text: Bij regeling van Onze Minister kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel35
  - number: '36'
    text: Onder de naam kolenbelasting wordt een belasting geheven ter zake van de uitslag en de invoer van kolen.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel36
  - number: '37.1'
    text: Ter zake van uitslag wordt de belasting geheven van de vergunninghouder van de inrichting.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel37
  - number: '37.2'
    text: |-
      In afwijking van het eerste lid wordt de belasting bij toepassing van [artikel 33, tweede lid][ref1], geheven van
      degene die de kolen voorhanden heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel33
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '33'
        hoofdstuk: V
        afdeling: '1'
  - number: '38.1'
    text: Een plaats kan alleen als inrichting worden gebruikt indien daartoe een vergunning is verstrekt door de inspecteur.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel38
  - number: '38.2'
    text: 'Als inrichting kan worden aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel38
  - number: 38.2.a
    text: een plaats waar kolen worden vervaardigd;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel38
  - number: 38.2.b
    text: |-
      een plaats waar geen kolen worden vervaardigd maar die dient voor de opslag van kolen, indien de hoeveelheid kolen
      die gemiddeld over een jaar voorhanden is meer bedraagt dan een bij regeling van Onze Minister vast te stellen
      hoeveelheid.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel38
  - number: '39.1'
    text: Degene die een vergunning voor een inrichting wil verkrijgen, dient daartoe een verzoek in bij de inspecteur.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel39
  - number: '39.2'
    text: |-
      Bij regeling van Onze Minister worden nadere regels gesteld met betrekking tot de gegevens die het verzoek dient
      te bevatten.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel39
  - number: '39.3'
    text: |-
      In afwijking van [artikel 38, tweede lid][ref1], kan, indien degene die een vergunning voor een inrichting wil
      verkrijgen niet beschikt over een plaats waar kolen worden vervaardigd dan wel opgeslagen, een verzoek om een
      vergunning voor een inrichting door de inspecteur worden toegewezen, indien deze persoon in Nederland is gevestigd
      en in de uitoefening van zijn onderneming optreedt als:


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel38
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '38'
        hoofdstuk: V
        afdeling: '2'
  - number: 39.3.a
    text: handelaar in kolen, maar de door hem gekochte kolen niet zelf in opslag neemt, of
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel39
  - number: 39.3.b
    text: tussenpersoon die de kolen niet zelf in opslag neemt.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel39
  - number: '39.4'
    text: |-
      De [artikelen 43 tot en met 50 van de Wet op de accijns][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel43
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '43'
  - number: '40.1'
    text: Ter zake van uitslag wordt de belasting verschuldigd op het tijdstip van de uitslag.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel40
  - number: '40.2'
    text: |-
      In afwijking van het eerste lid wordt de belasting bij toepassing van [artikel 33, tweede lid][ref1], verschuldigd
      op het tijdstip van de aanvang van het voorhanden hebben van de kolen.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel33
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '33'
        hoofdstuk: V
        afdeling: '1'
  - number: '41'
    text: |-
      Ter zake van de belasting bij invoer zijn de wettelijke bepalingen, bedoeld in
      [artikel 1:1, eerste en tweede lid, van de Algemene Douanewet][ref1], met uitzondering van artikel 868 van de
      toepassingsverordening Communautair douanewetboek, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '1'
  - number: '42'
    text: De belasting wordt berekend over het gewicht van de kolen, uitgedrukt in kilogram.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel42
  - number: '43'
    text: Het tarief bedraagt per 1000 kilogram kolen € 13,17.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel43
  - number: '44.1'
    text: |-
      Vrijstelling van de belasting wordt verleend ter zake van de uitslag en de invoer van kolen die worden gebruikt
      anders dan als brandstof.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel44
  - number: '44.2'
    text: |-
      Vrijstelling van de belasting wordt verleend ter zake van de uitslag en de invoer van kolen die worden gebruikt
      als brandstof voor het opwekken van elektriciteit in een installatie met een elektrisch rendement van minimaal 30
      percent. Als installatie met een elektrisch rendement van minimaal 30 percent wordt aangemerkt een installatie met
      een gemiddeld verbruik van maximaal 12 megajoule per opgewekt kWh.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel44
  - number: '44.3'
    text: |-
      Vrijstelling van de belasting wordt verleend ter zake van de uitslag en de invoer van kolen die duaal worden
      gebruikt.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel44
  - number: '44.4'
    text: |-
      Bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur worden voorwaarden en
      beperkingen gesteld waaronder de vrijstellingen, bedoeld in het eerste tot en met derde lid, worden verleend.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel44
  - number: '44.5'
    text: Bij regeling van Onze Minister worden nadere regels gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel44
  - number: '45.1'
    text: |-
      Op verzoek wordt teruggaaf van de belasting verleend met betrekking tot kolen die worden gebruikt op een in
      [artikel 44, eerste tot en met derde lid][ref1], bedoelde wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel44
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '44'
        hoofdstuk: V
        afdeling: '5'
  - number: '45.2'
    text: |-
      Op verzoek wordt teruggaaf van de belasting verleend met betrekking tot kolen die – anders dan vanuit een
      inrichting – zijn gebracht naar een andere lidstaat dan wel een derde land.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel45
  - number: '45.3'
    text: |-
      Bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur worden nadere regels gesteld met
      betrekking tot de indiening van het verzoek en de wijze waarop kan worden aangetoond dat aan de voorwaarden voor
      teruggaaf wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel45
  - number: '45.4'
    text: Bij regeling van Onze Minister kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel45
  - number: 45a
    text: |-
      De [artikelen 83][ref1] en [88, eerste, derde en vierde lid, van de Wet op de accijns][ref2] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel83
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel88
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel45a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '83'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: '88'
  - number: '46.1'
    text: |-
      De belastingplichtige voert een administratie waaruit, voor zover dat voor de heffing van belang kan zijn, de
      gegevens betreffende het vervaardigen, invoeren, uitslaan en gebruik van kolen duidelijk blijken.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel46
  - number: '46.2'
    text: |-
      Bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur kunnen, ter verzekering van de
      heffing van de belasting, regels worden gesteld met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel46
  - number: 46.2.a
    text: het vervoer van kolen;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel46
  - number: 46.2.b
    text: het leveren van kolen;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel46
  - number: 46.2.c
    text: het voorhanden hebben van kolen buiten een inrichting.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel46
  - number: '46.3'
    text: Het tweede lid is niet van toepassing op kolen die zijn geplaatst onder een communautaire douaneregeling.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel46
  - number: '46.4'
    text: Bij regeling van Onze Minister kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel46
  - number: '47.1'
    text: 'Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel47
  - number: 47.1.a
    text: |-
      halfzware olie, gasolie en vloeibaar gemaakt petroleumgas: hetgeen ingevolge de [artikelen 26][ref1] en
      [28 van de Wet op de accijns][ref2] onder deze begrippen wordt verstaan;


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel28
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '26'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: '28'
  - number: 47.1.b
    text: 'L: een liter bij een temperatuur van 15 graden Celsius;'
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel47
  - number: 47.1.c
    text: |-
      weg, motorrijtuig en pleziervaartuig: hetgeen ingevolge [artikel 27, vijfde lid, van de Wet op de accijns][ref1]
      onder deze begrippen wordt verstaan;


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel27
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '27'
  - number: 47.1.d
    text: |-
      invoer: invoer in de zin van de [Wet op de accijns][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005251
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0005251
  - number: 47.1.e
    text: |-
      uitslag: uitslag in de zin van de [Wet op de accijns][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005251
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0005251
  - number: 47.1.f
    text: |-
      aansluiting: een aansluiting van een in Nederland gelegen onroerende zaak als bedoeld in
      [artikel 16, onderdelen a tot en met e, van de Wet waardering onroerende zaken][ref1] op een Nederlands
      distributienet waaruit elektriciteit of aardgas aan de verbruiker wordt geleverd; een aansluiting kan bestaan uit
      een of meer leveringspunten;


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel16
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '16'
  - number: 47.1.g
    text: |-
      installatie voor warmtekrachtkoppeling: een installatie waarin aardgas wordt verstookt voor de gecombineerde
      opwekking van warmte en kracht met een totaal energetisch rendement van minimaal 60%, gebaseerd op de calorische
      onderwaarde van het gas. Onder het totaal energetisch rendement wordt verstaan de som van het rendement van de
      elektriciteitsopwekking en tweederde deel van het rendement van de productie van nuttig aan te wenden warmte,
      berekend op de onderste verbrandingswaarde van aardgas;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel47
  - number: 47.1.h
    text: |-
      installatie voor blokverwarming: een gemeenschappelijke voorziening voor de verwarming van meer dan een onroerende
      zaak als bedoeld in [artikel 16, onderdelen a tot en met e, van de Wet waardering onroerende zaken][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel16
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '16'
  - number: 47.1.i
    text: |-
      hernieuwbare energiebronnen: wind, zonne-energie, aardwarmte, golfenergie, getijdenenergie, waterkracht, biomassa,
      stortgas, rioolwaterzuiveringsgas en biogas;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel47
  - number: 47.1.j
    text: |-
      biomassa: de biologisch afbreekbare fractie van producten, afvalstoffen en residuen van de landbouw, met inbegrip
      van plantaardige en dierlijke stoffen, de bosbouw en aanverwante bedrijfstakken, alsmede de biologisch afbreekbare
      fractie van industrieel en huishoudelijk afval;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel47
  - number: 47.1.k
    text: |-
      zuivere biomassa: producten, afvalstoffen en residuen van de landbouw, met inbegrip van plantaardige en dierlijke
      stoffen, de bosbouw en aanverwante bedrijfstakken die geheel biologisch afbreekbaar zijn, alsmede industrieel en
      huishoudelijk afval dat geheel biologisch afbreekbaar is;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel47
  - number: 47.1.l
    text: 'Nm3: een normaalkubiekemeter;'
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel47
  - number: 47.1.m
    text: 'aardgas: producten van de GN-codes 2711 11 00 en 2711 21 00;'
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel47
  - number: 47.1.n
    text: 'elektriciteit: elektrische energie van de GN-code 2716;'
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel47
  - number: 47.1.o
    text: |-
      brandstof: stof – met inbegrip van alle daaraan toegevoegde stoffen – dienende voor verbranding met het doel de
      daarbij ontstane energie te benutten;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel47
  - number: 47.1.p
    text: |-
      energie-intensief bedrijf: een zakelijke eenheid als bedoeld in onderdeel t, waar de kosten van de aankoop van
      energieproducten en elektriciteit ten minste 3,0% van de productiewaarde uitmaken, of waar de verschuldigde
      energiebelasting en accijns op minerale oliën ten minste 0,5% van de toegevoegde waarde bedraagt;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel47
  - number: 47.1.q
    text: |-
      kosten van de aankoop van energieproducten en elektriciteit, productiewaarde en toegevoegde waarde: hetgeen
      ingevolge artikel 17, eerste lid, onderdeel a, van richtlijn nr. 2003/96/EG van de Raad van de Europese Unie
      van 27 oktober 2003 tot herstructurering van de communautaire regeling voor de belasting van energieproducten en
      elektriciteit (PbEU L 283) onder deze begrippen wordt verstaan;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel47
  - number: 47.1.r
    text: 'CNG: aardgas dat na compressie geschikt is voor de aanwending in motorrijtuigen;'
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel47
  - number: 47.1.s
    text: |-
      CNG-vulstation: een rechtstreeks op het distributienet van aardgas aangesloten inrichting waar uitsluitend aardgas
      wordt samengeperst tot CNG, dat wordt afgeleverd aan motorrijtuigen;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel47
  - number: 47.1.t
    text: |-
      zakelijk verbruik: verbruik door een zakelijke eenheid die zelfstandig, op ongeacht welke plaats, leveringen van
      goederen en diensten verricht, ongeacht het oogmerk of het resultaat van die economische activiteiten. Economische
      activiteiten omvatten alle werkzaamheden van een fabrikant, handelaar of verrichter van diensten, met inbegrip van
      de winning van delfstoffen, de landbouw en de uitoefening van vrije of daarmee gelijkgestelde beroepen. Rijks-,
      regionale en lokale overheden, alsmede andere publiekrechtelijke lichamen worden als zakelijke eenheid aangemerkt
      voor zover zij werkzaamheden of transacties verrichten die bij een behandeling als niet-zakelijke eenheid tot
      concurrentieverstoring van enige betekenis zouden leiden;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel47
  - number: 47.1.u
    text: 'niet-zakelijk verbruik: verbruik anders dan het zakelijk verbruik, bedoeld in onderdeel t;'
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel47
  - number: 47.1.v
    text: |-
      elektriciteitsbeurs: beurs als bedoeld in [artikel 86e van de Elektriciteitswet 1998][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel86e
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 86e
  - number: 47.1.w
    text: |-
      gasbeurs: beurs als bedoeld in [artikel 66b van de Gaswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel66b
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 66b
  - number: 47.1.x
    text: 'verbruiksperiode:'
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel47
  - number: 47.1.x.1°
    text: |-
      in gevallen waarin een voorschotnota wordt uitgereikt of, indien geen voorschotnota wordt uitgereikt, een
      voorschotbedrag wordt ontvangen: tijdvak waarop de eindfactuur betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel47
  - number: 47.1.x.2°
    text: 'in overige gevallen: kalenderjaar;'
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel47
  - number: 47.1.y
    text: |-
      eindfactuur: definitieve factuur waarin verrekening plaatsvindt met de voorschotnota’s of voorschotbedragen die
      betrekking hebben op het tijdvak waarop de factuur ziet.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel47
  - number: '47.2'
    text: |-
      Bij regeling van Onze Minister worden regels gesteld met betrekking tot de herleiding van feitelijke hoeveelheden
      van halfzware olie en gasolie tot hoeveelheden bij een temperatuur van 15 graden Celsius.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel47
  - number: '47.3'
    text: |-
      Bij regeling van Onze Minister in overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en
      Milieubeheer worden nadere regels gesteld met betrekking tot de inhoud van het begrip zuivere biomassa.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel47
  - number: '47.4'
    text: |-
      Met betrekking tot elektriciteit wordt onder distributienet verstaan een net als bedoeld in
      [artikel 1, eerste lid, onderdeel i, van de Elektriciteitswet 1998][ref1], met uitzondering van een net als bedoeld
      in [artikel 15, eerste lid, van de Elektriciteitswet 1998][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel15
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '15'
  - number: '47.5'
    text: |-
      Bij regeling van Onze Minister kunnen nadere regels worden gesteld met betrekking tot de toepassing van het eerste
      lid, onderdeel p.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel47
  - number: '47.6'
    text: |-
      Met betrekking tot aardgas wordt onder distributienet verstaan een gastransportnet als bedoeld in
      [artikel 1, eerste lid, onderdeel d, van de Gaswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel1
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '1'
  - number: '47.7'
    text: |-
      Indien in een tijdvak van 18 maanden een of meerdere voorschotnota’s worden uitgereikt dan wel een of meerdere
      voorschotbedragen worden ontvangen en uiterlijk binnen 13 weken na afloop van dat tijdvak geen eindfactuur wordt
      uitgereikt, wordt dat tijdvak van 18 maanden aangemerkt als verbruiksperiode.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel47
  - number: '48.1'
    text: 'Onder de naam energiebelasting wordt een belasting geheven op de volgende producten:'
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel48
  - number: 48.1.a
    text: halfzware olie;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel48
  - number: 48.1.b
    text: gasolie;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel48
  - number: 48.1.c
    text: vloeibaar gemaakt petroleumgas;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel48
  - number: 48.1.d
    text: aardgas; en
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel48
  - number: 48.1.e
    text: elektriciteit.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel48
  - number: '48.2'
    text: |-
      Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen wordt als één van de onder het eerste lid,
      onderdelen a tot en met d, bedoelde producten, niet zijnde één van deze producten, mede aangemerkt elk product
      dat direct of indirect is bestemd voor gebruik, wordt aangeboden voor verkoop of wordt gebruikt als één van deze
      producten.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel48
  - number: '49'
    text: |-
      Met betrekking tot halfzware olie, gasolie en vloeibaar gemaakt petroleumgas, wordt de belasting geheven ter zake
      van de uitslag en van de invoer, als was de belasting een accijns.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel49
  - number: '50.1'
    text: |-
      Met betrekking tot aardgas en elektriciteit wordt de belasting geheven ter zake van de levering via een aansluiting
      aan de verbruiker, alsmede ter zake van de levering van aardgas via een aansluiting aan een CNG-vulstation.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel50
  - number: '50.2'
    text: |-
      Indien de verbruiker, bedoeld in het eerste lid, via een aansluiting elektriciteit op het
      distributienet heeft ingevoed ter zake waarvan [artikel 31c, tweede lid][ref1], dan wel
      [artikel 95c, derde lid, van de Elektriciteitswet 1998][ref2] wordt toegepast, is het eerste lid van toepassing
      op het positieve saldo van de via de aansluiting geleverde elektriciteit minus de via de aansluiting ingevoede
      elektriciteit.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel31c
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel95c
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 31c
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 95c
  - number: '50.3'
    text: |-
      Indien een levering van aardgas of elektriciteit via een aansluiting wordt verricht aan een organisatorische
      eenheid die zich bezighoudt met het leveren van aardgas of elektriciteit dan wel aan een verbruiker die op
      zijn beurt het geleverde product geheel of gedeeltelijk via een aansluiting levert aan een verbruiker, wordt
      eerstgenoemde levering niet aangemerkt als een levering als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel50
  - number: '50.4'
    text: |-
      Als een levering als bedoeld in het eerste lid wordt mede aangemerkt het verbruik van aardgas en elektriciteit,
      indien:
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel50
  - number: 50.4.a
    text: deze producten op andere wijze zijn verkregen dan door een levering als bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel50
  - number: 50.4.b
    text: deze producten zijn verkregen door tussenkomst van een gasbeurs of een elektriciteitsbeurs;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel50
  - number: 50.4.c
    text: het verbruik betreft door degene die leveringen via een aansluiting aan de verbruiker verricht.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel50
  - number: '50.5'
    text: 'Het vierde lid is niet van toepassing met betrekking tot de verbruiker die:'
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel50
  - number: 50.5.a
    text: |-
      elektriciteit heeft opgewekt door middel van hernieuwbare energiebronnen, met uitzondering van elektriciteit uit
      biomassa die niet als zuivere biomassa wordt aangemerkt;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel50
  - number: 50.5.b
    text: |-
      elektriciteit heeft opgewekt door middel van een noodinstallatie in geval van storingen bij de levering via het
      distributienet;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel50
  - number: 50.5.c
    text: stortgas, rioolwaterzuiveringsgas of biogas heeft gewonnen;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel50
  - number: 50.5.d
    text: elektriciteit heeft opgewekt door middel van een installatie voor warmtekrachtkoppeling.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel50
  - number: '50.6'
    text: Bij regeling van Onze Minister worden nadere regels gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel50
  - number: '51'
    text: |-
      Als levering wordt niet aangemerkt het verbruik van aardgas voor de vervaardiging van producten
      als bedoeld in [artikel 48, eerste lid, onderdelen a tot en met d][ref1], alsmede lichte olie als
      bedoeld in [artikel 26, tweede lid, van de Wet op de accijns][ref2] en zware stookolie als bedoeld in
      [artikel 26, vijfde lid, van de Wet op de accijns][ref3] in dezelfde inrichting waarin dat aardgas is ontstaan,
      mits dat verbruik blijkt uit de administratie.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0005251#Artikel26
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '48'
        hoofdstuk: VI
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: '26'
      - id: ref3
        bwb_id: BWBR0005251
        artikel: '26'
  - number: '52'
    text: |-
      Als uitslag wordt mede aangemerkt het gebruik van halfzware olie, gasolie en vloeibaar gemaakt petroleumgas
      bestemd voor het aandrijven van motorrijtuigen op de weg of van pleziervaartuigen dan wel voor de voortstuwing
      van luchtvaartuigen, voor andere doeleinden dan voor het aandrijven van motorrijtuigen op de weg of van
      pleziervaartuigen dan wel voor de voortstuwing van luchtvaartuigen.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel52
  - number: '53.1'
    text: |-
      Met betrekking tot halfzware olie, gasolie en vloeibaar gemaakt petroleumgas, wordt de belasting geheven van degene
      die ter zake accijns verschuldigd is of zou zijn, indien van die brandstoffen accijns zou worden geheven.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel53
  - number: '53.2'
    text: |-
      In afwijking van het eerste lid wordt de belasting bij toepassing van [artikel 52][ref1] geheven van degene die de
      halfzware olie, de gasolie of het vloeibaar gemaakt petroleumgas gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel52
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '52'
        hoofdstuk: VI
        afdeling: '2'
  - number: '53.3'
    text: Met betrekking tot aardgas en elektriciteit wordt de belasting geheven van degene die de levering verricht.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel53
  - number: '53.4'
    text: |-
      In afwijking van het derde lid wordt bij toepassing van [artikel 50, vierde lid][ref1], de belasting geheven van
      degene van wie het verbruik op grond van [artikel 50, vierde lid][ref2], is aangemerkt als een levering als bedoeld
      in [artikel 50, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel50
      [ref3]: https://wetten.overheid.nl/BWBR0007168#Artikel50
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '50'
        hoofdstuk: VI
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0007168
        artikel: '50'
        hoofdstuk: VI
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0007168
        artikel: '50'
        hoofdstuk: VI
        afdeling: '2'
  - number: '54.1'
    text: |-
      Voor de toepassing van [artikel 53, derde lid][ref1], stelt degene die de levering aan de verbruiker verricht,
      indien hij niet in Nederland is gevestigd en aldaar geen vaste inrichting heeft, een fiscaal vertegenwoordiger
      aan. De fiscaal vertegenwoordiger treedt namens hem op en treedt in zijn plaats met betrekking tot alle rechten en
      verplichtingen die hij heeft inzake de belasting.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel53
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '53'
        hoofdstuk: VI
        afdeling: '2'
  - number: '54.2'
    text: De fiscaal vertegenwoordiger is in het bezit van een daartoe door de inspecteur verstrekte vergunning.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel54
  - number: '54.3'
    text: |-
      Degene die een vergunning als fiscaal vertegenwoordiger wil verkrijgen, dient daartoe een verzoek in bij de
      inspecteur.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel54
  - number: '54.4'
    text: |-
      Bij het verzoek, bedoeld in het derde lid, wordt een verklaring overgelegd van degene die de levering aan de
      verbruiker verricht waaruit blijkt dat deze degene die het verzoek indient, machtigt op te treden als zijn fiscaal
      vertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel54
  - number: '54.5'
    text: |-
      Bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur worden nadere regels gesteld
      met betrekking tot de gegevens die het verzoek, bedoeld in het derde lid, moet bevatten alsmede met betrekking tot
      voorwaarden waaronder de vergunning wordt verleend, gewijzigd en ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel54
  - number: '54.6'
    text: Bij regeling van Onze Minister worden nadere regels gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel54
  - number: '55'
    text: |-
      De belasting wordt voor halfzware olie, gasolie, vloeibaar gemaakt petroleumgas en aardgas berekend per eenheid
      brandstof, uitgedrukt in L, kilogram of kubieke meter, en voor elektriciteit per eenheid energie-inhoud, uitgedrukt
      in kWh.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel55
  - number: '56.1'
    text: |-
      De belasting met betrekking tot halfzware olie, gasolie en vloeibaar gemaakt petroleumgas wordt verschuldigd
      op het tijdstip waarop de accijns ter zake van die brandstoffen verschuldigd wordt of zou worden indien van die
      brandstoffen accijns zou worden geheven.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel56
  - number: '56.2'
    text: |-
      In afwijking van het eerste lid wordt de belasting bij toepassing van [artikel 52][ref1] verschuldigd op het
      tijdstip waarop het gebruik plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel52
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '52'
        hoofdstuk: VI
        afdeling: '2'
  - number: '56.3'
    text: 'De belasting met betrekking tot de levering van aardgas en de levering van elektriciteit wordt verschuldigd:'
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel56
  - number: 56.3.a
    text: |-
      in gevallen waarin een voorschotnota wordt uitgereikt of, indien geen voorschotnota wordt uitgereikt, een
      voorschotbedrag wordt ontvangen:
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel56
  - number: 56.3.a.1°
    text: |-
      op het tijdstip waarop een voorschotnota wordt uitgereikt onderscheidenlijk een voorschotbedrag wordt ontvangen;
      alsmede
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel56
  - number: 56.3.a.2°
    text: |-
      op het tijdstip van de uitreiking van de eindfactuur over een verbruiksperiode, dan wel, bij toepassing van
      [artikel 47, zevende lid][ref1], op de laatste dag van het aldaar bedoelde tijdvak van 18 maanden;


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel47
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '47'
        hoofdstuk: VI
        afdeling: '1'
  - number: 56.3.b
    text: in andere gevallen op het tijdstip van de uitreiking van de factuur.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel56
  - number: '56.4'
    text: |-
      Voor de toepassing van het derde lid, onderdeel a, onder 1°, worden de hoeveelheden aardgas en elektriciteit,
      waarop de voorschotnota dan wel het voorschotbedrag is gebaseerd, aangemerkt als geleverde hoeveelheden.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel56
  - number: '56.5'
    text: |-
      In afwijking van het derde lid wordt de belasting bij toepassing van [artikel 50, vierde lid][ref1], verschuldigd
      op het tijdstip waarop het verbruik plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel50
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '50'
        hoofdstuk: VI
        afdeling: '2'
  - number: '56.6'
    text: |-
      Indien de verrekening, bedoeld in [artikel 47, eerste lid, onderdeel y][ref1], leidt tot een lager bedrag dan over
      de verbruiksperiode aan belasting is voldaan, wordt het verschil in mindering gebracht op de aangifte over het
      tijdvak waarin de eindfactuur is uitgereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel47
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '47'
        hoofdstuk: VI
        afdeling: '1'
  - number: '57'
    text: |-
      Indien in een verbruiksperiode ten aanzien van degene van wie op grond van [artikel 53, vierde lid][ref1], de
      belasting wordt geheven zowel sprake is van door hem op grond van [artikel 53, vierde lid][ref2], verschuldigde
      belasting als van aan hem in rekening gebrachte belasting ter zake van aan hem geleverde hoeveelheden aardgas of
      elektriciteit, wordt in totaal niet meer belasting geheven dan de belasting die zou zijn verschuldigd indien de
      totale hoeveelheid aardgas of elektriciteit was betrokken van één leverancier, met dien verstande dat de belasting
      primair wordt geheven van degene, bedoeld in [artikel 53, derde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel53
      [ref3]: https://wetten.overheid.nl/BWBR0007168#Artikel53
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '53'
        hoofdstuk: VI
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0007168
        artikel: '53'
        hoofdstuk: VI
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0007168
        artikel: '53'
        hoofdstuk: VI
        afdeling: '2'
  - number: '58.1'
    text: 'Het tarief bedraagt voor:'
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel58
  - number: 58.1.a
    text: halfzware olie, per 1000 L € 169,03;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel58
  - number: 58.1.b
    text: gasolie, per 1000 L € 170,43;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel58
  - number: 58.1.c
    text: vloeibaar gemaakt petroleumgas, per 1000 kilogram € 201,78.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel58
  - number: '58.2'
    text: |-
      In afwijking van het eerste lid bedraagt het tarief nihil voor halfzware olie, gasolie en vloeibaar gemaakt
      petroleumgas bestemd voor het aandrijven van motorrijtuigen op de weg of van pleziervaartuigen dan wel voor de
      voortstuwing van luchtvaartuigen.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel58
  - number: '58.3'
    text: |-
      In afwijking van het eerste lid bedraagt het tarief voor halfzware olie, gasolie en vloeibaar gemaakt
      petroleumgas voor verwarming ter bevordering van het groeiproces van tuinbouwproducten als bedoeld in
      [post a 32 van de bij de Wet op de omzetbelasting 1968 behorende Tabel I][ref1] onderscheidenlijk € 18,1465, €
      18,2815 en € 21,8069, indien geen aansluiting aanwezig is voor aardgas.


      [ref1]: https://wetten.overheid.nl/BWBR0002629
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0002629
  - number: '58.4'
    text: Bij regeling van Onze Minister kunnen regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel58
  - number: '59.1'
    text: 'Het tarief bedraagt voor:'
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel59
  - number: 59.1.a
    text: |-
      aardgas, met uitzondering van aardgas als bedoeld in onderdeel b, met een bovenste verbrandingswaarde van 35,17
      megajoule per Nm3 voor dat gedeelte van de geleverde hoeveelheid per verbruiksperiode van twaalf maanden per
      aansluiting dat: - niet hoger is dan 5000 kubieke meter, per kubieke meter € 0,1580;
        - hoger is dan 5000 kubieke meter, maar niet hoger dan 170 000 kubieke meter, per kubieke meter € 0,1385;
        - hoger is dan 170 000 kubieke meter, maar niet hoger dan 1 000 000 kubieke meter, per kubieke meter € 0,0384;
        - hoger is dan 1 000 000 kubieke meter, maar niet hoger dan 10 000 000 kubieke meter, per kubieke meter € 0,0122;
        - hoger is dan 10 000 000 kubieke meter, per kubieke meter € 0,0114 voor niet-zakelijk verbruik en per kubieke
      meter € 0,0080 voor zakelijk verbruik;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel59
  - number: 59.1.b
    text: |-
      aardgas, met een bovenste verbrandingswaarde van 35,17 megajoule per Nm3, dat wordt geleverd aan een CNG-vulstation
      € 0,0310 per kubieke meter;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel59
  - number: 59.1.c
    text: |-
      elektriciteit voor dat gedeelte van de geleverde hoeveelheid per verbruiksperiode van twaalf maanden per
      aansluiting dat: - niet hoger is dan 10 000 kWh, per kWh € 0,1085;
        - hoger is dan 10 000 kWh, maar niet hoger dan 50 000 kWh, per kWh € 0,0398;
        - hoger is dan 50 000 kWh, maar niet hoger dan 10 000 000 kWh, per kWh € 0,0106;
        - hoger is dan 10 000 000 kWh, per kWh € 0,0010 voor niet-zakelijk verbruik en per kWh € 0,0005 voor zakelijk
      verbruik.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel59
  - number: '59.2'
    text: |-
      Bij aardgas met een bovenste verbrandingswaarde die lager of hoger is dan 35,17 megajoule per Nm3, worden de in het
      eerste lid, onderdelen a en b, genoemde tarieven naar evenredigheid verlaagd, onderscheidenlijk verhoogd alsmede de
      hoeveelheidsgrenzen naar evenredigheid verhoogd onderscheidenlijk verlaagd.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel59
  - number: '59.3'
    text: |-
      In afwijking van het eerste lid, onderdeel a, bedraagt het tarief voor aardgas € 0,1580 per kubieke meter voor
      de totale hoeveelheid aardgas die wordt geleverd aan een verbruiker die dat aardgas gebruikt voor een installatie
      voor blokverwarming niet zijnde een installatie voor stadsverwarming waarbij grotendeels gebruik wordt gemaakt
      van restwarmte.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel59
  - number: '59.4'
    text: |-
      In afwijking van het eerste lid, onderdeel a, bedragen de tarieven nihil voor in [artikel 48, tweede lid][ref1],
      als aardgas aangemerkte producten voor zover deze als brandstof worden gebruikt in de inrichting waarin zij zijn
      ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel48
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '48'
        hoofdstuk: VI
        afdeling: '2'
  - number: '59.5'
    text: |-
      Indien bij een aansluiting sprake is van zowel zakelijk verbruik als niet-zakelijk verbruik, worden de tarieven,
      genoemd in het eerste lid, voor verbruik boven 10 000 000 kubieke meter respectievelijk 10 000 000 kWh toegepast
      naar evenredigheid van elk type verbruik. Indien het verbruik nagenoeg geheel bestaat uit zakelijk verbruik of
      niet-zakelijk verbruik, wordt het volledige verbruik als zodanig aangemerkt.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel59
  - number: '59.6'
    text: |-
      Bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur worden voorwaarden en
      beperkingen gesteld waaronder de tarieven, bedoeld in het eerste lid, worden toegepast.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel59
  - number: '59.7'
    text: |-
      Bij regeling van Onze Minister kunnen nadere regels worden gesteld ten behoeve van de toepassing van het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel59
  - number: '60.1'
    text: |-
      In afwijking van [artikel 59, eerste lid, onderdeel a][ref1], bedraagt het tarief voor aardgas
      voor verwarming ter bevordering van het groeiproces van tuinbouwproducten als bedoeld in
      [post a 32 van de bij de Wet op de omzetbelasting 1968 behorende Tabel I][ref2] voor aardgas met een bovenste
      verbrandingswaarde van 35,17 megajoule per Nm3, voor dat gedeelte van de geleverde hoeveelheid per verbruiksperiode
      van twaalf maanden per aansluiting dat: - niet hoger is dan 5000 kubieke meter, per kubieke meter € 0,01457
        - hoger is dan 5000 kubieke meter, maar niet hoger dan 170 000 kubieke meter, per kubieke meter € 0,02318;
        - hoger is dan 170 000 kubieke meter, maar niet hoger dan 1 000 000 kubieke meter, per kubieke meter € 0,01940;
        - hoger is dan 1 000 000 kubieke meter, maar niet hoger dan 10 000 000 kubieke meter, per kubieke meter € 0,0122;
        - hoger is dan 10 000 000 kubieke meter, per kubieke meter € 0,0080.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel59
      [ref2]: https://wetten.overheid.nl/BWBR0002629
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '59'
        hoofdstuk: VI
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0002629
  - number: '60.2'
    text: |-
      Indien behalve voor het in het eerste lid vermelde doel mede aardgas wordt toegepast in één of meerdere woonhuizen,
      wordt per verbruiksperiode van twaalf maanden per woonhuis een geleverde hoeveelheid van 5000 kubieke meter in
      de heffing betrokken naar het tarief, bedoeld in [artikel 59, eerste lid, onderdeel a][ref1], tenzij de geleverde
      hoeveelheden voor de verschillende toepassingen en de verschillende woonhuizen afzonderlijk worden gemeten.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel59
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '59'
        hoofdstuk: VI
        afdeling: '4'
  - number: '60.3'
    text: |-
      Bij aardgas met een bovenste verbrandingswaarde die lager of hoger is dan 35,17 megajoule per Nm3, worden de in het
      eerste lid genoemde tarieven naar evenredigheid verlaagd, onderscheidenlijk verhoogd alsmede de hoeveelheidsgrenzen
      naar evenredigheid verhoogd onderscheidenlijk verlaagd.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel60
  - number: '60.4'
    text: Bij regeling van Onze Minister kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel60
  - number: '61'
    text: |-
      Bij een verbruiksperiode korter dan wel langer dan twaalf maanden worden de hoeveelheidsgrenzen,
      genoemd in [artikel 59, eerste lid][ref1], [60, eerste en tweede lid][ref2], [67, eerste lid][ref3], en
      [68, tweede lid][ref4], naar evenredigheid verlaagd, onderscheidenlijk verhoogd.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel59
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel60
      [ref3]: https://wetten.overheid.nl/BWBR0007168#Artikel67
      [ref4]: https://wetten.overheid.nl/BWBR0007168#Artikel68
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '59'
        hoofdstuk: VI
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0007168
        artikel: '60'
        hoofdstuk: VI
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0007168
        artikel: '67'
        hoofdstuk: VI
        afdeling: '6'
      - id: ref4
        bwb_id: BWBR0007168
        artikel: '68'
        hoofdstuk: VI
        afdeling: '6'
  - number: '62'
    text: |-
      Indien op basis van een contract tussen de belastingplichtige en de verbruiker de geleverde hoeveelheid
      aardgas gemeten wordt in Nm3, worden de tarieven toegepast, zoals die met betrekking tot aardgas in
      [artikel 59, eerste lid, onderdeel a, en derde lid][ref1], en [artikel 60, eerste lid][ref2], worden toegepast per
      kubieke meter.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel59
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel60
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '59'
        hoofdstuk: VI
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0007168
        artikel: '60'
        hoofdstuk: VI
        afdeling: '4'
  - number: '63.1'
    text: |-
      Op de ter zake van de levering van elektriciteit, bedoeld in [artikel 50, eerste lid][ref1], verschuldigde
      belasting wordt een vermindering toegepast. De vermindering bedraagt € 318,62 per verbruiksperiode van twaalf
      maanden per elektriciteitsaansluiting. Indien het bedrag van de over deze verbruiksperiode verschuldigde belasting
      lager is dan het bedrag van de vermindering, wordt het verschil aan de verbruiker terugbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel50
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '50'
        hoofdstuk: VI
        afdeling: '2'
  - number: '63.2'
    text: |-
      In de gevallen waarin een voorschotnota wordt uitgereikt of, indien geen voorschotnota wordt uitgereikt, een
      voorschotbedrag wordt ontvangen, wordt bij de berekening van het voorschotbedrag naar evenredigheid rekening
      gehouden met de belastingvermindering, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel63
  - number: '63.3'
    text: |-
      Bij een verbruiksperiode korter dan wel langer dan twaalf maanden wordt het in het eerste lid genoemde bedrag naar
      evenredigheid verlaagd, onderscheidenlijk verhoogd.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel63
  - number: '63.4'
    text: |-
      Bij toepassing van [artikel 50, vierde lid][ref1], zijn het eerste en het derde lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel50
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '50'
        hoofdstuk: VI
        afdeling: '2'
  - number: '63.5'
    text: |-
      De in het eerste lid bedoelde vermindering van belasting is niet van toepassing met betrekking tot zaken, al dan
      niet als onroerende zaak aangemerkt, die niet op zichzelf als gebouwde eigendommen zijn aan te merken welke kunnen
      dienen als woning of ten behoeve van de uitoefening van een bedrijf of beroep of anderszins een verblijfsfunctie
      hebben.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel63
  - number: '63.6'
    text: Bij regeling van Onze Minister worden nadere regels gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel63
  - number: '64.1'
    text: |-
      Vrijstelling van de belasting wordt verleend ter zake van de levering van aardgas en elektriciteit die worden
      gebruikt voor het opwekken van elektriciteit in een installatie met een elektrisch rendement van minimaal 30
      percent dan wel in een installatie met behulp waarvan elektriciteit wordt opgewekt uitsluitend door middel van
      hernieuwbare energiebronnen en elektriciteit.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel64
  - number: '64.2'
    text: |-
      Als installatie met een elektrisch rendement van minimaal 30 percent wordt aangemerkt een installatie met een
      gemiddeld gebruik van maximaal 0,38 Nm3 aardgas per opgewekt kWh.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel64
  - number: '64.3'
    text: |-
      Vrijstelling van belasting wordt verleend ter zake van de levering van elektriciteit die wordt gebruikt voor
      chemische reductie en elektrolytische en metallurgische procédés.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel64
  - number: '64.4'
    text: |-
      Vrijstelling van belasting wordt verleend ter zake van de levering van aardgas dat wordt gebruikt anders dan als
      brandstof dan wel aardgas dat wordt gebruikt als additief of als vulstof in producten die direct of indirect zijn
      bestemd voor verbruik, worden aangeboden voor verkoop of worden verbruikt als aardgas.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel64
  - number: '64.5'
    text: |-
      Bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur worden voorwaarden en
      beperkingen gesteld waaronder de vrijstellingen, bedoeld in het eerste, derde en vierde lid, worden verleend.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel64
  - number: '64.6'
    text: Bij regeling van Onze Minister worden nadere regels gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel64
  - number: '65.1'
    text: |-
      Bij op voordracht van Onze Minister, mede namens Onze Minister van Economische Zaken, Onze Minister van
      Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, Onze Minister van Landbouw, Natuur en Voedselkwaliteit
      en Onze Minister van Verkeer en Waterstaat, vast te stellen algemene maatregel van bestuur wordt voorzien
      in een regeling op grond waarvan, onder daarbij te stellen voorwaarden, vrijstelling van de belasting
      wordt verleend ter zake van de levering van elektriciteit ten behoeve van zakelijk verbruik voor zover het
      zakelijk verbruik, na aftrek van het gedeelte van het zakelijk verbruik dat reeds is vrijgesteld op grond van
      [artikel 64, eerste of derde lid][ref1], hoger is dan 10 000 000 kWh per verbruiksperiode van twaalf maanden per
      aansluiting. De vrijstelling wordt verleend indien de verbruiker in het kader van met Onze Minister van Economische
      Zaken, Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, Onze Minister van Landbouw, Natuur
      en Voedselkwaliteit of Onze Minister van Verkeer en Waterstaat gemaakte afspraken verplichtingen op zich heeft
      genomen ter verbetering van de energie-efficiëntie en hij als energie-intensief bedrijf wordt aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel64
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '64'
        hoofdstuk: VI
        afdeling: '5'
  - number: '65.2'
    text: |-
      Bij een verbruiksperiode korter dan wel langer dan twaalf maanden wordt de in het eerste lid genoemde
      hoeveelheidsgrens naar evenredigheid verlaagd, onderscheidenlijk verhoogd.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel65
  - number: '65.3'
    text: Bij regeling van Onze Minister kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel65
  - number: '67.1'
    text: |-
      Op verzoek wordt teruggaaf van de belasting verleend voor aardgas dat is belast naar het
      tarief, bedoeld in [artikel 59, eerste lid, onderdeel a][ref1], voor het verbruik niet hoger
      dan 5000 kubieke meter, voor zover het verbruik van warmte in een onroerende zaak als bedoeld in
      [artikel 16, onderdeel a tot en met e, van de Wet waardering onroerende zaken][ref2] die door een installatie voor
      blokverwarming wordt verwarmd, hoger is dan 158 000 megajoule per verbruiksperiode van twaalf maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel59
      [ref2]: https://wetten.overheid.nl/BWBR0007119#Artikel16
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '59'
        hoofdstuk: VI
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0007119
        artikel: '16'
  - number: '67.2'
    text: |-
      De teruggaaf, bedoeld in het eerste lid, wordt verleend aan de gebruiker van de in het eerste lid bedoelde
      onroerende zaak. De teruggaaf bedraagt het verschil tussen het bedrag van de belasting dat volgt uit toepassing van
      het tarief, bedoeld in [artikel 59, eerste lid, onderdeel a][ref1], voor het verbruik niet hoger dan 5000 kubieke
      meter en het bedrag van de belasting dat volgt uit toepassing van [artikel 59, eerste lid, onderdeel a][ref2], als
      aan de gebruiker een hoeveelheid aardgas geleverd zou zijn die correspondeert met de verbruikte warmte.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel59
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel59
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '59'
        hoofdstuk: VI
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0007168
        artikel: '59'
        hoofdstuk: VI
        afdeling: '4'
  - number: '67.3'
    text: |-
      Bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur worden voorwaarden en
      beperkingen gesteld waaronder de teruggaaf, bedoeld in het eerste lid, wordt verleend.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel67
  - number: '67.4'
    text: Bij regeling van Onze Minister kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel67
  - number: '68.1'
    text: |-
      Op verzoek wordt aan de verbruiker teruggaaf van de belasting verleend met betrekking tot aardgas en elektriciteit,
      voor zover de belasting over de hoeveelheden aardgas en elektriciteit die door de verbruiker in een kalenderjaar
      van verschillende leveranciers zijn betrokken, hoger is dan de belasting die zou zijn verschuldigd indien sprake
      was van één leverancier.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel68
  - number: '68.2'
    text: |-
      Op verzoek wordt aan de verbruiker teruggaaf van de belasting verleend voor zover met betrekking tot
      zakelijk verbruik van aardgas boven de 10 000 000 kubieke meter of elektriciteit boven de 10 000 000 kWh per
      verbruiksperiode van twaalf maanden per aansluiting het tarief voor niet-zakelijk verbruik in rekening is gebracht.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel68
  - number: '68.3'
    text: |-
      Bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur worden voorwaarden en
      beperkingen gesteld waaronder de teruggaven, bedoeld in het eerste en tweede lid, worden verleend.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel68
  - number: '68.4'
    text: Bij regeling van Onze Minister kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel68
  - number: '69.1'
    text: |-
      Op verzoek wordt teruggaaf van de belasting verleend met betrekking tot aardgas en elektriciteit, verbruikt
      in een onroerende zaak die in hoofdzaak is bestemd voor de openbare eredienst of voor het houden van openbare
      bezinningsbijeenkomsten van levensbeschouwelijke aard.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel69
  - number: '69.2'
    text: |-
      Op verzoek wordt teruggaaf van de belasting verleend met betrekking tot aardgas en elektriciteit, verbruikt in
      een onroerende zaak die hoofdzakelijk in gebruik is bij een charitatieve, culturele, wetenschappelijke of het
      algemeen nut beogende instelling dan wel een instelling die een sociaal belang behartigt, mits: a. de instelling
      beschikt over notarieel verleden statuten waaruit de charitatieve, culturele, wetenschappelijke, het algemeen
      nut beogende of sociaal belang behartigende doelstelling blijkt; b. de feitelijke werkzaamheden van de instelling
      overeenkomen met de doelstelling; c. de instelling niet of slechts in beperkte mate werkzaam is op het gebied
      van sport, gezondheidszorg of onderwijs; d. de instelling niet aan vennootschapsbelasting is onderworpen dan wel
      daarvan is vrijgesteld; e. de instelling beschikt over een eigen aansluiting; alsmede, indien het een instelling
      betreft die een sociaal belang behartigt: f. de werkzaamheden van de instelling nagenoeg geheel worden verricht
      door natuurlijke personen om niet of naar een loon dat in belangrijke mate lager is dan hetgeen in het economische
      verkeer gebruikelijk is.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel69
  - number: '69.3'
    text: |-
      Op verzoek wordt teruggaaf van de belasting verleend met betrekking tot aardgas en elektriciteit, verbruikt
      in een onroerende zaak die hoofdzakelijk in gebruik is bij meer dan één instelling die charitatief, cultureel,
      wetenschappelijk of het algemeen nut beogend is dan wel een sociaal belang behartigt, mits:
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel69
  - number: 69.3.a
    text: |-
      de instellingen die de onroerende zaak gebruiken, beschikken over notarieel verleden statuten
      waaruit de charitatieve, culturele, wetenschappelijke, het algemeen nut beogende of een sociaal
      belang behartigende doelstelling blijkt, dan wel, voor zover het gaat om verenigingen als bedoeld in
      [artikel 26 van Boek 2 van het Burgerlijk Wetboek][ref1] die niet beschikken over notarieel verleden statuten, over
      door die verenigingen verstrekte verklaringen waaruit de charitatieve, culturele, wetenschappelijke, het algemeen
      nut beogende of een sociaal belang behartigende doelstelling blijkt;


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel26
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '26'
  - number: 69.3.b
    text: |-
      de instelling die de desbetreffende onroerende zaak beheert en exploiteert, beschikt over notarieel verleden
      statuten waaruit blijkt dat de instelling zich ten doel stelt de onroerende zaak te beheren en exploiteren ten
      nutte van instellingen als bedoeld in onderdeel a;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel69
  - number: 69.3.c
    text: de feitelijke werkzaamheden van de instellingen, bedoeld in de onderdelen a en b, overeenkomen met de doelstelling;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel69
  - number: 69.3.d
    text: |-
      de instellingen, bedoeld in onderdeel a, niet of slechts in beperkte mate werkzaam zijn op het gebied van sport,
      gezondheidszorg of onderwijs;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel69
  - number: 69.3.e
    text: |-
      de instellingen, bedoeld in de onderdelen a en b, niet aan vennootschapsbelasting zijn onderworpen dan wel daarvan
      zijn vrijgesteld;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel69
  - number: 69.3.f
    text: de instelling, bedoeld in onderdeel b, beschikt over een eigen aansluiting.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel69
  - number: '69.4'
    text: |-
      Voor de toepassing van dit artikel en de op dit artikel berustende bepalingen wordt een statuut als bedoeld in
      [artikel 2, tweede lid, van Boek 2 van het Burgerlijk Wetboek][ref1] gelijkgesteld met notarieel verleden statuten
      indien dit statuut schriftelijk is vastgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel2
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '2'
  - number: '69.5'
    text: |-
      De teruggaven, bedoeld in het eerste en tweede lid, worden verleend aan de gebruiker van de desbetreffende
      onroerende zaak en bedragen 50 percent van de aan hem in rekening gebrachte belasting.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel69
  - number: '69.6'
    text: |-
      De teruggaaf, bedoeld in het derde lid, wordt verleend aan de instelling die de desbetreffende onroerende zaak
      beheert en exploiteert en bedraagt 50 percent van de aan haar in rekening gebrachte belasting.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel69
  - number: '69.7'
    text: |-
      De teruggaven, bedoeld in het eerste, tweede en derde lid, zijn van overeenkomstige toepassing met betrekking tot
      halfzware olie, gasolie en vloeibaar gemaakt petroleumgas, indien geen aansluiting aanwezig is voor aardgas.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel69
  - number: '69.8'
    text: |-
      Bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur worden voorwaarden en
      beperkingen gesteld waaronder de teruggaven, bedoeld in dit artikel, worden verleend.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel69
  - number: '69.9'
    text: Bij regeling van Onze Minister kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel69
  - number: '70.1'
    text: |-
      Op verzoek wordt aan de verbruiker teruggaaf van de belasting verleend met betrekking tot aardgas en elektriciteit
      die worden gebruikt op een in [artikel 64, eerste lid][ref1], bedoelde wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel64
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '64'
        hoofdstuk: VI
        afdeling: '5'
  - number: '70.2'
    text: |-
      Op verzoek wordt aan de verbruiker teruggaaf van de belasting verleend met betrekking tot elektriciteit die wordt
      gebruikt op een in [artikel 64, derde lid][ref1], bedoelde wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel64
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '64'
        hoofdstuk: VI
        afdeling: '5'
  - number: '70.3'
    text: |-
      Op verzoek wordt aan de verbruiker teruggaaf van de belasting verleend met betrekking tot aardgas dat wordt
      gebruikt op een in [artikel 64, vierde lid][ref1], bedoelde wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel64
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '64'
        hoofdstuk: VI
        afdeling: '5'
  - number: '70.4'
    text: |-
      Bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur worden voorwaarden en
      beperkingen gesteld waaronder de teruggaven, bedoeld in het eerste tot en met derde lid, worden verleend.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel70
  - number: '70.5'
    text: Bij regeling van Onze Minister kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel70
  - number: '71.1'
    text: |-
      De belastingplichtigen, bedoeld in [artikel 53, derde en vierde lid][ref1], voeren een administratie waaruit
      duidelijk alle gegevens blijken die voor de heffing van de belasting van belang kunnen zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel53
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '53'
        hoofdstuk: VI
        afdeling: '2'
  - number: '71.2'
    text: |-
      Bij regeling van Onze Minister worden regels gesteld omtrent de wijze waarop aan de in het eerste lid bedoelde
      verplichting wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel71
  - number: '71.3'
    text: |-
      Bij regeling van Onze Minister worden voorwaarden gesteld aan de administratie van een installatie waarin
      zuivere biomassa zodanig wordt verwerkt dat daaruit elektriciteit wordt opgewekt of waarin stortgas,
      rioolwaterzuiveringsgas of biogas wordt gewonnen.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel71
  - number: '72'
    text: 'Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel72
  - number: 72.a
    text: |-
      luchthaven: terrein geheel of gedeeltelijk bestemd voor het opstijgen en het landen van vliegtuigen, welk terrein
      is voorzien van een start- en landingsbaan van meer dan 1800 meter, voor zover dat terrein als burgerluchthaven of,
      indien het een militaire luchthaven betreft, mede door andere dan militaire luchtvaart wordt gebruikt;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel72
  - number: 72.b
    text: 'vliegtuig: gemotoriseerd vliegtuig met een maximaal toegelaten startgewicht van 8 616 kilogram of meer;'
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel72
  - number: 72.c
    text: |-
      luchtvaartmaatschappij: rechtspersoon of natuurlijk persoon, die als eigenaar of exploitant van een vliegtuig met
      dat vliegtuig een of meer passagiers vervoert;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel72
  - number: 72.d
    text: |-
      passagier: natuurlijk persoon van 2 jaar of ouder die anders dan als boordpersoneel wordt vervoerd met een
      vliegtuig;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel72
  - number: 72.e
    text: |-
      boordpersoneel: ieder die aan boord van een vliegtuig tijdens de vlucht hetzij werkzaamheden verricht welke van
      direct belang zijn voor de bediening van het vliegtuig hetzij werkzaamheden verricht of heeft te verrichten ten
      behoeve van de inzittenden of de lading, alsmede ieder die uitsluitend wordt vervoerd in het kader van het tijdens
      de vlucht door hem verrichten van dergelijke werkzaamheden aan boord van een ander vliegtuig;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel72
  - number: 72.f
    text: |-
      bestemming: luchthaven gelegen op de grootste afstand van de luchthaven van vertrek, waar naartoe een passagier
      ingevolge de vervoersovereenkomst met de luchtvaartmaatschappij wordt vervoerd.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel72
  - number: '73.1'
    text: |-
      Onder de naam vliegbelasting wordt een belasting geheven ter zake van het vertrek van een passagier met een
      vliegtuig vanaf een in Nederland gelegen luchthaven.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel73
  - number: '73.2'
    text: |-
      Als vertrek wordt niet aangemerkt het vertrek vanaf een luchthaven indien dat vertrek als onderdeel van één
      vervoersovereenkomst plaatsvindt aansluitend op het moment van aankomst van de passagier met een vliegtuig op
      die luchthaven, die aansluiting de belangrijkste reden is voor het gebruik van de luchthaven en het gebied van de
      luchthaven dat een vertrekkende passagier alleen mag betreden met een geldig vervoersbewijs, tussen het moment van
      aankomst en het moment van vertrek niet langer dan 24 uur is verlaten.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel73
  - number: '74'
    text: De belasting wordt geheven van de exploitant van de luchthaven.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel74
  - number: '75'
    text: De belasting wordt berekend over het aantal passagiers.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel75
  - number: '76'
    text: De belasting wordt verschuldigd op het tijdstip waarop de passagier met een vliegtuig vertrekt.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel76
  - number: '77.1'
    text: 'Het tarief per passagier bedraagt:'
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel77
  - number: 77.1.a
    text: |-
      € 11,25 indien de bestemming is gelegen op een vliegafstand van ten hoogste 2500 kilometer van de luchthaven van
      vertrek;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel77
  - number: 77.1.b
    text: € 45 in andere gevallen.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel77
  - number: '77.2'
    text: |-
      In afwijking van het eerste lid, onderdeel b, bedraagt het tarief € 11,25 indien de bestemming is gelegen op een
      vliegafstand van ten hoogste 3500 kilometer van de luchthaven van vertrek, en die bestemming is gelegen:
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel77
  - number: 77.2.a
    text: in een lidstaat van de Europese Unie; of
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel77
  - number: 77.2.b
    text: |-
      in een land waarin ook ten minste één luchthaven is gelegen op een vliegafstand van ten hoogste 2500 kilometer van
      de luchthaven van vertrek.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel77
  - number: '78.1'
    text: |-
      Op verzoek wordt teruggaaf verleend van de belasting voor zover de door de belastingplichtige op grond van artikel
      36rg, derde lid, te ontvangen bedragen niet zijn en niet zullen worden ontvangen.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel78
  - number: '78.2'
    text: |-
      Bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur worden nadere regels gesteld met
      betrekking tot de indiening van het verzoek en de wijze waarop kan worden aangetoond dat aan de voorwaarden voor
      teruggaaf wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel78
  - number: '78.3'
    text: Bij regeling van Onze Minister kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel78
  - number: '79.1'
    text: |-
      Bij regeling van onze Minister kunnen nadere regels worden gesteld omtrent de wijze waarop de belastingplichtige
      een administratie moet voeren voor de toepassing van de vliegbelasting.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel79
  - number: '79.2'
    text: |-
      De luchtvaartmaatschappij verstrekt aan de luchthaven de gegevens die nodig zijn voor een juiste toepassing van dit
      hoofdstuk. De verstrekking van deze gegevens vindt plaats gelijktijdig met de verstrekking van de gegevens die de
      luchtvaartmaatschappij als gebruiker van de luchthaven verplicht is aan de luchthaven te verstrekken.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel79
  - number: '79.3'
    text: |-
      De luchtvaartmaatschappij is gehouden tot betaling van de vliegbelasting die de exploitant van de luchthaven bij
      haar in rekening brengt, voor zover deze belasting door de exploitant van de luchthaven is verschuldigd ter zake
      van de door die luchtvaartmaatschappij vervoerde passagiers.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel79
  - number: '80'
    text: 'Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel80
  - number: 80.a
    text: |-
      verpakkingen: alle producten, vervaardigd van materiaal van welke aard ook, die kunnen worden gebruikt voor het
      insluiten, beschermen, verladen, afleveren en aanbieden van andere producten, van grondstoffen tot afgewerkte
      producten, over het gehele traject van producent tot gebruiker of consument, wegwerpartikelen die voor dit doel
      worden gebruikt daaronder begrepen, waarbij verpakkingen uitsluitend omvatten verkoop- of primaire verpakkingen,
      verzamel- of secundaire verpakkingen en verzend- of tertiaire verpakkingen en:
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel80
  - number: 80.a.1°
    text: |-
      waarbij producten als verpakking worden beschouwd indien zij aan het vorenstaande voldoen, ongeacht andere functies
      die de verpakking ook kan vervullen, tenzij het product integraal deel uitmaakt van een ander product en het nodig
      is om dat product tijdens zijn levensduur te bevatten, te ondersteunen of te bewaren en alle elementen bedoeld zijn
      om samen gebruikt, verbruikt of verwijderd te worden;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel80
  - number: 80.a.2°
    text: |-
      waarbij producten die ontworpen en bedoeld zijn om op het verkooppunt te worden gevuld alsmede wegwerpartikelen
      die in gevulde toestand worden verkocht of die ontworpen en bedoeld zijn om op het verkooppunt te worden gevuld,
      slechts als verpakking worden beschouwd indien zij een verpakkingsfunctie hebben;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel80
  - number: 80.a.3°
    text: |-
      waarbij de componenten van een verpakking en de bijbehorende in de verpakking verwerkte elementen worden beschouwd
      als deel van de verpakking waarin ze verwerkt zijn en waarbij de bijbehorende elementen die aan een verpakt
      product hangen of bevestigd zijn en die een verpakkingsfunctie hebben, als verpakking worden beschouwd, tenzij zij
      integraal deel uitmaken van dit product en alle elementen bedoeld zijn om samen verbruikt of verwijderd te worden;
      en
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel80
  - number: 80.a.4°
    text: |-
      met uitzondering van bij ministeriële regeling aan te wijzen logistieke hulpmiddelen en producten die wel voldoen
      aan de definitie van verpakking, maar die naar hun aard hoofdzakelijk een andere functie dan een verpakkingsfunctie
      hebben, en mitsdien niet als verpakking worden beschouwd. De aanwijzing kan zowel individuele producten als groepen
      van producten betreffen. Ter zake kunnen eisen worden gesteld aan afmetingen dan wel inhoud;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel80
  - number: 80.b
    text: |-
      verkoop- of primaire verpakking: verpakking die zo is ontworpen dat zij voor de eindgebruiker of consument op het
      verkooppunt een verkoopeenheid vormt;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel80
  - number: 80.c
    text: |-
      verzamel- of secundaire verpakking: verpakking die zo is ontworpen dat zij op het verkooppunt een verzameling van
      een aantal verkoopeenheden vormt, ongeacht of deze als dusdanig aan de eindgebruiker of consument wordt verkocht,
      dan wel alleen dient om de rekken op het verkooppunt bij te vullen en die van het product kan worden verwijderd
      zonder dat dit de kenmerken ervan beïnvloedt;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel80
  - number: 80.d
    text: |-
      verzend- of tertiaire verpakking: verpakking die zo is ontworpen dat het verladen en het vervoer van
      verkoopeenheden of verzamelverpakkingen wordt vergemakkelijkt om fysieke schade door verlading of transport te
      voorkomen, weg-, spoor-, scheeps- of vliegcontainers niet daaronder begrepen;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel80
  - number: 80.e
    text: 'producent: de ondernemer die in de uitoefening van zijn bedrijf of beroep:'
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel80
  - number: 80.e.1°
    text: producten in een verpakking aan een ander ter beschikking stelt; of
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel80
  - number: 80.e.2°
    text: producten tezamen met verpakkingen aan een ander ter beschikking stelt;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel80
  - number: 80.f
    text: 'importeur: de ondernemer voor wie bestemd zijn de verpakte producten:'
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel80
  - number: 80.f.1°
    text: |-
      die worden ingevoerd in de zin van [artikel 18 van de Wet op de omzetbelasting 1968][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel18
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '18'
  - number: 80.f.2°
    text: die vanuit een andere lidstaat van de Europese Unie in Nederland worden gebracht,
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel80
  - number: 80.g
    text: |-
      concern: de fiscale eenheid, bedoeld in [artikel 7, vierde lid, van de Wet op de omzetbelasting 1968][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel7
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '7'
  - number: 80.h
    text: |-
      ondernemer: ondernemer in de zin van [artikel 7, eerste en tweede lid, van de Wet op de omzetbelasting 1968][ref1]
      die in Nederland is gevestigd dan wel aldaar een vaste inrichting heeft;


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel7
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '7'
  - number: 80.i
    text: |-
      biokunststof: kunststof die is gecertificeerd volgens de Europese norm EN 13 432 voor terugwinbaarheid door
      compostering en biodegradatie;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel80
  - number: 80.j
    text: |-
      logistieke hulpmiddelen: verpakkingen waarvan de transportfunctie de voornaamste functie is en die overigens veelal
      een zelfstandige functie hebben;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel80
  - number: 80.k
    text: |-
      loonverpakker: de ondernemer die in opdracht van een ander bedrijf producten herpakt, verpakt of ontpakt, die hij
      niet zelf heeft vervaardigd en waarvan hij niet de eigendom verkrijgt;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel80
  - number: 80.l
    text: 'drank: vloeistof bestemd voor menselijke consumptie en primair bedoeld om te worden gedronken.'
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel80
  - number: '81'
    text: Onder de naam verpakkingenbelasting wordt een belasting geheven op verpakkingen.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel81
  - number: '82.1'
    text: 'De belasting wordt geheven ter zake van:'
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel82
  - number: 82.1.a
    text: |-
      de verpakking van ter beschikking gestelde producten, voor zover die verpakte producten voor het eerst door een
      producent in Nederland ter beschikking worden gesteld aan een ander;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel82
  - number: 82.1.b
    text: de verpakking van producten, ingeval de importeur van de verpakte producten zich van die verpakking ontdoet;
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel82
  - number: 82.1.c
    text: |-
      de verpakking die tezamen met een product dan wel producten ter beschikking wordt gesteld, voor zover deze voor het
      eerst door een producent in Nederland ter beschikking worden gesteld aan een ander.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel82
  - number: '82.2'
    text: |-
      Het eerste lid, onderdelen a en c, is niet van toepassing indien het verpakte product onderscheidenlijk de
      verpakkingen:
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel82
  - number: 82.2.a
    text: zich nog niet in het vrije verkeer van de Europese Gemeenschap bevinden; of
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel82
  - number: 82.2.b
    text: bij de terbeschikkingstelling buiten Nederland worden gebracht.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel82
  - number: '83.1'
    text: 'De belasting wordt geheven:'
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel83
  - number: 83.1.a
    text: |-
      indien [artikel 82, eerste lid, onderdeel a of c][ref1], toepassing vindt: van de producent;


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel82
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '82'
        hoofdstuk: VIII
        afdeling: '2'
  - number: 83.1.b
    text: |-
      indien [artikel 82, eerste lid, onderdeel b][ref1], toepassing vindt: van de importeur; of


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel82
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '82'
        hoofdstuk: VIII
        afdeling: '2'
  - number: 83.1.c
    text: 'indien zowel onderdeel a als onderdeel b toepassing vindt: van de producent/importeur.'
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel83
  - number: '83.2'
    text: |-
      Ingeval een in het eerste lid, onderdeel a, b of c, bedoelde producent, importeur onderscheidenlijk producent/
      importeur, deel uitmaakt van een concern, wordt de belasting, in afwijking van het eerste lid, geheven van het
      concern.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel83
  - number: '83.3'
    text: |-
      Ingeval een producent als bedoeld in het eerste lid, onderdeel a, een loonverpakker is, wordt de belasting
      geheven van degene in wiens opdracht hij de producten herpakt, verpakt of ontpakt, tenzij de opdrachtgever in het
      buitenland is gevestigd. In dat laatste geval wordt de belasting geheven van de afnemer van de opdrachtgever die
      wel in Nederland is gevestigd.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel83
  - number: '84.1'
    text: |-
      De belasting wordt berekend over het gewicht van de in de verpakking verwerkte materiaalsoorten, gemeten in
      kilogrammen.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel84
  - number: '84.2'
    text: |-
      De componenten van een verpakking en de bijbehorende in de verpakking verwerkte elementen, bedoeld in
      [artikel 80, onderdeel a, onder 3°][ref1], hoeven niet afzonderlijk in de heffing te worden betrokken, maar mogen
      worden meegewogen met de materiaalsoort van de verpakking waarin ze zijn verwerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel80
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '80'
        hoofdstuk: VIII
        afdeling: '1'
  - number: 84a.1
    text: |-
      De producent kan voor de verpakkingen van de verpakte producten die hij voor het eerst in Nederland ter
      beschikking stelt aan een ander en die hij niet zelf heeft toegevoegd, de inspecteur verzoeken een aan de omzet, de
      inkoopkosten of andere bedrijfsgegevens gerelateerd verhoudingsgetal in kilogrammen verpakking per materiaalsoort
      (forfait) vast te stellen. Het forfait benadert de werkelijkheid. Indien een uitsplitsing naar materiaalsoorten
      niet anders dan met buitengewoon bezwaar mogelijk is, wordt het forfait voor het totaal aantal kilogrammen
      verpakking vastgesteld. Het forfait kan alleen worden vastgesteld voor in de toekomst liggende kalenderjaren.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel84a
  - number: 84a.2
    text: |-
      De beschikking waarin het forfait wordt vastgesteld, werkt voor een in de beschikking aan te geven periode van
      maximaal vijf aaneengesloten kalenderjaren.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel84a
  - number: 84a.3
    text: |-
      Voor de producent, bedoeld in het eerste lid, die voor de eerste keer een aanvraag als bedoeld in het eerste lid
      indient, kan het forfait ook worden vastgesteld over het kalenderjaar waarin hij de aanvraag doet.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel84a
  - number: 84a.4
    text: |-
      De producent, bedoeld in het eerste lid, aan wie een beschikking is gegeven waarbij het forfait, bedoeld in het
      eerste lid, is vastgesteld, dient, zo hij de vaststelling van het forfait via de weg van de voor bezwaar vatbare
      beschikking wil continueren, een nieuw verzoek in te dienen, uiterlijk 31 maart van het laatste kalenderjaar
      waarvoor de eerdere beschikking van toepassing is. Ingeval de producent een nieuw verzoek als bedoeld in de eerste
      volzin op een later tijdstip doet dan is aangegeven in de eerste volzin, kan het forfait slechts betrekking hebben
      op de kalenderjaren die liggen na het kalenderjaar waarin de dagtekening ligt van de beschikking waarin het forfait
      wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel84a
  - number: 84a.5
    text: |-
      Indien de omstandigheden die uitgangspunt waren bij de vaststelling van het forfait zijn gewijzigd, waardoor het
      forfait niet meer de werkelijkheid benadert, meldt de producent, bedoeld in het eerste lid, dit aan de inspecteur.
      De inspecteur wijzigt de beschikking, bedoeld in het eerste lid, bij voor bezwaar vatbare beschikking. De wijziging
      kan alleen worden toegepast voor in de toekomst liggende kalenderjaren. Het tweede lid is van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel84a
  - number: 84a.6
    text: |-
      Indien de omstandigheden die uitgangspunt waren bij de vaststelling van het forfait zijn gewijzigd, waardoor het
      forfait niet meer de werkelijkheid benadert, en de producent de melding, bedoeld in het vijfde lid, niet doet, kan
      de inspecteur de beschikking, bedoeld in het eerste lid, ambtshalve wijzigen met terugwerkende kracht tot en met
      het eerste kalenderjaar volgend op het kalenderjaar waarin de omstandigheden zijn gewijzigd. De inspecteur wijzigt
      de eerdere beschikking bij voor bezwaar vatbare beschikking. Het tweede lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel84a
  - number: 84a.7
    text: |-
      De inspecteur kan de beschikking, bedoeld in het eerste lid, voorts ambtshalve wijzigen met terugwerkende kracht
      tot en met het eerste kalenderjaar waarvoor het forfait is vastgesteld indien de producent onjuiste of onvolledige
      informatie heeft verstrekt bij het vaststellen van het forfait. De inspecteur wijzigt de eerdere beschikking bij
      voor bezwaar vatbare beschikking. Het tweede lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel84a
  - number: '85'
    text: 'De belasting wordt verschuldigd:'
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel85
  - number: 85.a
    text: |-
      indien [artikel 82, eerste lid, onderdeel a][ref1], toepassing vindt: op het tijdstip waarop het verpakte product
      ter beschikking wordt gesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel82
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '82'
        hoofdstuk: VIII
        afdeling: '2'
  - number: 85.b
    text: |-
      indien [artikel 82, eerste lid, onderdeel b][ref1], toepassing vindt: op het tijdstip waarop de importeur zich van
      de verpakking ontdoet;


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel82
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '82'
        hoofdstuk: VIII
        afdeling: '2'
  - number: 85.c
    text: |-
      indien [artikel 82, eerste lid, onderdeel c][ref1], toepassing vindt: op het tijdstip waarop de verpakking ter
      beschikking wordt gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel82
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '82'
        hoofdstuk: VIII
        afdeling: '2'
  - number: '86.1'
    text: |-
      Het tarief per kilogram bedraagt voor in een verpakking verwerkte materiaalsoorten van:






                    a. aluminium en legeringen van aluminium:


                    € 0,8766




                    b. kunststof:


                    € 0,4339




                    c. overige metalen:


                    € 0,1461




                    d. biokunststof:


                    € 0,0733




                    e. papier en karton:


                    € 0,0733




                    f. glas:


                    € 0,0662




                    g. hout:


                    € 0,0194




                    h. een andere materiaalsoort:


                    € 0,1619
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel86
  - number: '86.2'
    text: |-
      Indien een verpakking een fles voor drank betreft waarvoor op grond van een publiekrechtelijk voorschrift een op
      de consument gerichte statiegeldregeling geldt, bedraagt, in afwijking in zoverre van het eerste lid, voor een
      dergelijke verpakking het tarief per kilogram, een bij ministeriële regeling vastgesteld percentage van het tarief,
      genoemd in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel86
  - number: '86.3'
    text: |-
      Indien een uitsplitsing naar materiaalsoorten niet anders dan met buitengewoon bezwaar mogelijk is, bedraagt het
      tarief per kilogram verpakking: € 0,50 (algemeen tarief).
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel86
  - number: '86.4'
    text: |-
      Indien het algemeen tarief van toepassing is, en de belastingplichtige, de materiaalsoorten op volgorde van
      tariefhoogte, bedoeld in het eerste lid, in aanmerking nemend, aannemelijk maakt dat de materiaalsoort «aluminium
      en legeringen van aluminium» en eventuele volgende materiaalsoorten niet in de verpakkingen zijn verwerkt, geldt
      het tarief, genoemd in het eerste lid, dat hoort bij de eerstvolgende materiaalsoort dat wel in de verpakkingen
      is verwerkt.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel86
  - number: '86.5'
    text: |-
      De belastingplichtige die in aanmerking wil komen voor toepassing van het algemeen tarief, al dan niet verlaagd op
      grond van het vierde lid, dient hiertoe een verzoek in bij de inspecteur.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel86
  - number: '87.1'
    text: |-
      Op het bedrag van de belasting die in een tijdvak verschuldigd is geworden door een belastingplichtige als bedoeld
      in [artikel 83, eerste lid, onderdeel a, b of c, dan wel tweede lid][ref1], wordt een vermindering toegepast tot
      ten hoogste het bedrag van die verschuldigde belasting.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel83
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '83'
        hoofdstuk: VIII
        afdeling: '2'
  - number: '87.2'
    text: |-
      In geval de verschuldigde belasting betrekking heeft op één materiaalsoort als bedoeld in [artikel 86][ref1], is
      het bedrag van de vermindering: 15 000 vermenigvuldigd met het voor die materiaalsoort geldende tarief, bedoeld in
      [artikel 86, eerste, tweede, derde of vierde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel86
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel86
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '86'
        hoofdstuk: VIII
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0007168
        artikel: '86'
        hoofdstuk: VIII
        afdeling: '4'
  - number: '87.3'
    text: |-
      In geval de verschuldigde belasting betrekking heeft op twee of meer van de materiaalsoorten, bedoeld in
      [artikel 86][ref1], is het bedrag van de vermindering de optelsom van de verminderingen per materiaalsoort, waarbij
      de vermindering per materiaalsoort bedraagt: 15 000 vermenigvuldigd met het gewichtsaandeel van die materiaalsoort
      in het totaalgewicht van al die materiaalsoorten samen, vermenigvuldigd met het voor de betreffende materiaalsoort
      geldende tarief, bedoeld in [artikel 86, eerste, tweede, derde of vierde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel86
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel86
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '86'
        hoofdstuk: VIII
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0007168
        artikel: '86'
        hoofdstuk: VIII
        afdeling: '4'
  - number: '87.4'
    text: 'Voor de toepassing van dit artikel:'
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel87
  - number: 87.4.a
    text: |-
      worden de materiaalsoorten waarvoor in [artikel 86, eerste en tweede lid][ref1], een tarief is bepaald als
      afzonderlijke materiaalsoorten aangemerkt;


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel86
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '86'
        hoofdstuk: VIII
        afdeling: '4'
  - number: 87.4.b
    text: |-
      worden, indien [artikel 86, derde of vierde lid][ref1], is toegepast, de ongesplitste materiaalsoorten als één
      materiaalsoort aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel86
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '86'
        hoofdstuk: VIII
        afdeling: '4'
  - number: 87a.1
    text: |-
      Een belastingplichtige als bedoeld in [artikel 83][ref1] mag op het bedrag van de belasting die in een tijdvak
      verschuldigd is geworden na toepassing van [artikel 87][ref2] een bedrag in mindering brengen voor de verpakking
      van de producten die hij als zodanig verpakt ter beschikking gesteld heeft gekregen van een producent en voor zover
      hij die op zijn beurt in dat tijdvak ter beschikking stelt en bij deze terbeschikkingstelling de producten voor het
      eerst buiten Nederland worden gebracht (exportvermindering). De exportvermindering geldt niet voor de verpakking
      waarvan de belastingplichtige weet of redelijkerwijs kan weten dat er geen verpakkingenbelasting over is betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel83
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel87
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel87a
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '83'
        hoofdstuk: VIII
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0007168
        artikel: '87'
        hoofdstuk: VIII
        afdeling: '5'
  - number: 87a.2
    text: |-
      De hoogte van het bedrag van de exportvermindering wordt berekend door het gewicht van de in de verpakking, bedoeld
      in het eerste lid, verwerkte materiaalsoorten, gemeten in kilogrammen, te vermenigvuldigen met de tarieven per
      materiaalsoort, genoemd in [artikel 86][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel86
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel87a
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '86'
        hoofdstuk: VIII
        afdeling: '4'
  - number: 87a.3
    text: |-
      Op het bedrag van de exportvermindering wordt een vermindering toegepast tot ten hoogste het bedrag van de
      exportvermindering.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel87a
  - number: 87a.4
    text: |-
      Ingeval de exportvermindering betrekking heeft op één materiaalsoort als bedoeld in [artikel 86][ref1], is het
      bedrag van de vermindering, bedoeld in het derde lid: 15 000 vermenigvuldigd met het voor die materiaalsoort
      geldende tarief, bedoeld in [artikel 86, eerste, tweede, derde of vierde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel86
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel86
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel87a
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '86'
        hoofdstuk: VIII
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0007168
        artikel: '86'
        hoofdstuk: VIII
        afdeling: '4'
  - number: 87a.5
    text: |-
      Ingeval de exportvermindering betrekking heeft op twee of meer van de materiaalsoorten, bedoeld
      in [artikel 86][ref1], is het bedrag van de vermindering, bedoeld in het derde lid, de optelsom
      van de verminderingen per materiaalsoort, waarbij de vermindering per materiaalsoort bedraagt: 15
      000 vermenigvuldigd met het gewichtsaandeel van die materiaalsoort in het totaalgewicht van al die
      materiaalsoorten samen, vermenigvuldigd met het voor de betreffende materiaalsoort geldende tarief, bedoeld in
      [artikel 86, eerste, tweede, derde of vierde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel86
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel86
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel87a
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '86'
        hoofdstuk: VIII
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0007168
        artikel: '86'
        hoofdstuk: VIII
        afdeling: '4'
  - number: 87a.6
    text: |-
      Voor de toepassing van dit artikel worden de materiaalsoorten waarvoor in [artikel 86, eerste en tweede lid][ref1],
      een tarief is bepaald als afzonderlijke materiaalsoorten aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel86
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel87a
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '86'
        hoofdstuk: VIII
        afdeling: '4'
  - number: 87b.1
    text: |-
      Ingeval na toepassing van [artikel 87a][ref1] een negatief bedrag resteert, wordt dit bedrag op verzoek van de
      belastingplichtige uitbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel87a
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel87b
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: 87a
        hoofdstuk: VIII
        afdeling: 5a
  - number: 87b.2
    text: |-
      Het verzoek om uitbetaling, bedoeld in het eerste lid, geschiedt bij de aangifte over het betreffende tijdvak. In
      gevallen waarin geen aangifte moet worden ingediend, geschiedt het verzoek door het doen van aangifte.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel87b
  - number: 87c
    text: |-
      Voor de ondernemer die geen belastingplichtige is in de zin van [artikel 83][ref1], maar die wel verpakte producten
      die hij verpakt ter beschikking gesteld heeft gekregen van een producent die hij op zijn beurt in een tijdvak ter
      beschikking stelt en bij deze terbeschikkingstelling buiten Nederland brengt, zijn de [artikelen 87a][ref2] en
      [87b][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel83
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel87a
      [ref3]: https://wetten.overheid.nl/BWBR0007168#Artikel87b
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel87c
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '83'
        hoofdstuk: VIII
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0007168
        artikel: 87a
        hoofdstuk: VIII
        afdeling: 5a
      - id: ref3
        bwb_id: BWBR0007168
        artikel: 87b
        hoofdstuk: VIII
        afdeling: 5a
  - number: 87d.1
    text: |-
      De ondernemer, bedoeld in [artikel 87c][ref1], is gehouden een administratie te voeren en de daartoe behorende
      boeken, bescheiden en andere gegevensdragers op zodanige wijze te bewaren, dat te allen tijde zijn rechten ter zake
      van de verpakkingenbelasting hieruit duidelijk blijken.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel87c
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel87d
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: 87c
        hoofdstuk: VIII
        afdeling: 5a
  - number: 87d.2
    text: |-
      Bij regeling van Onze Minister kunnen nadere regels worden gesteld omtrent de wijze waarop de ondernemer, bedoeld
      in [artikel 87c][ref1], een administratie moet voeren voor de toepassing van de verpakkingenbelasting.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel87c
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel87d
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: 87c
        hoofdstuk: VIII
        afdeling: 5a
  - number: '88'
    text: |-
      Bij regeling van Onze Minister kunnen nadere regels worden gesteld omtrent de wijze waarop de belastingplichtige
      een administratie moet voeren voor de toepassing van de verpakkingenbelasting.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel88
  - number: 88a
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de heffing van de
      verpakkingenbelasting. Hierbij kunnen regels worden gesteld inzake het verleggen van de belastingplicht, het al dan
      niet van toepassing zijn van de vermindering bij indirecte export, bedoeld in [afdeling 5a][ref1], en het bij de
      belastingplicht direct verdisconteren van deze exportvermindering, resulterende in een lager aantal aan te geven
      kilogrammen verpakking.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#HoofdstukVIII
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel88a
    references:
      - id: ref1
        bwb_id: BWBR0007168
        hoofdstuk: VIII
        afdeling: 5a
  - number: '89.1'
    text: De in een tijdvak verschuldigd geworden belasting moet op aangifte worden voldaan.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel89
  - number: '89.2'
    text: |-
      Bij toepassing van [artikel 40, tweede lid][ref1], dan wel [artikel 56, tweede lid][ref2], dient in afwijking in
      zoverre van [artikel 19, derde lid, van de Algemene wet inzake rijksbelastingen][ref3], de belasting uiterlijk
      op de dag na het in [artikel 40, tweede lid][ref4], dan wel [artikel 56, tweede lid][ref5], bedoelde tijdstip op
      aangifte te worden voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel56
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel19
      [ref4]: https://wetten.overheid.nl/BWBR0007168#Artikel40
      [ref5]: https://wetten.overheid.nl/BWBR0007168#Artikel56
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '40'
        hoofdstuk: V
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0007168
        artikel: '56'
        hoofdstuk: VI
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0002320
        artikel: '19'
      - id: ref4
        bwb_id: BWBR0007168
        artikel: '40'
        hoofdstuk: V
        afdeling: '2'
      - id: ref5
        bwb_id: BWBR0007168
        artikel: '56'
        hoofdstuk: VI
        afdeling: '3'
  - number: '89.3'
    text: |-
      In afwijking van het tweede lid kan de inspecteur, bij toepassing van [artikel 33, tweede lid, onderdeel a][ref1],
      op verzoek toestemming verlenen om de in een week op de voet van [artikel 40, tweede lid][ref2], verschuldigd
      geworden belasting uiterlijk op de vrijdag van de week daaropvolgend op aangifte te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel40
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '33'
        hoofdstuk: V
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0007168
        artikel: '40'
        hoofdstuk: V
        afdeling: '2'
  - number: '89.4'
    text: |-
      Bij toepassing van hoofdstuk VIII dient in afwijking in zoverre van
      [artikel 19, eerste lid, van de Algemene wet inzake rijksbelastingen][ref1], de belasting binnen één kwartaal na
      het einde van het tijdvak op aangifte te worden voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel19
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '19'
  - number: '89.5'
    text: |-
      In afwijking van het vierde lid dient bij toepassing van [artikel 84a][ref1] de belasting op aangifte te worden
      voldaan binnen één kwartaal volgend op het kwartaal waarbinnen de dagtekening ligt van de beschikking waarbij
      het forfait wordt vastgesteld, tenzij deze beschikking is gegeven in een kalenderjaar voorafgaande aan of in een
      kalenderjaar waarop het forfait mede betrekking heeft. In dat laatste geval geldt het vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel84a
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: 84a
        hoofdstuk: VIII
        afdeling: '3'
  - number: '89.6'
    text: |-
      Bij toepassing van [artikel 84a][ref1] zijn de [artikelen 20][ref2], [67c][ref3] en
      [67f van de Algemene wet inzake rijksbelastingen][ref4], van overeenkomstige toepassing, indien de
      belastingplichtige niet heeft voldaan aan de meldingsplicht, bedoeld in [artikel 84a, vijfde lid][ref5], of
      onjuiste of onvolledige informatie heeft verstrekt bij de vaststelling van het forfait.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel84a
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel67c
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel67f
      [ref5]: https://wetten.overheid.nl/BWBR0007168#Artikel84a
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: 84a
        hoofdstuk: VIII
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '20'
      - id: ref3
        bwb_id: BWBR0002320
        artikel: 67c
      - id: ref4
        bwb_id: BWBR0002320
        artikel: 67f
      - id: ref5
        bwb_id: BWBR0007168
        artikel: 84a
        hoofdstuk: VIII
        afdeling: '3'
  - number: '89.7'
    text: |-
      Indien de berekening van de verschuldigde belasting leidt tot een negatief bedrag verleent de inspecteur op verzoek
      van de belastingplichtige teruggaaf van dit bedrag.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel89
  - number: '90'
    text: |-
      De [artikelen 10.1][ref1] en [10.2 van de Wet inkomstenbelasting 2001][ref2] zijn van overeenkomstige
      toepassing op de in de [artikelen 8, eerste en derde lid][ref3], [9][ref4], [18][ref5],
      [28, eerste lid, onderdeel a, en tweede lid][ref6], [43][ref7], [58, eerste en derde lid][ref8],
      [59, eerste en derde lid][ref9], [60, eerste lid][ref10], [66, eerste lid][ref11], en [86][ref12], vermelde
      bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0007168#Artikel8
