  - number: '91.2'
    text: |-
      Binnen acht weken na ontvangst van het verzoek geeft de inspecteur een beschikking op dat verzoek, dan wel zendt
      hij de in het derde lid bedoelde kennisgeving. In afwijking van de eerste volzin bedraagt de beslistermijn voor
      het verzoek, bedoeld in [artikel 84a, eerste en vierde lid][ref1], een jaar na ontvangst van het verzoek. In geval
      tevens een verzoek als bedoeld in [artikel 86, vijfde lid][ref2], wordt gedaan, wordt de beslissing op dit laatste
      verzoek, in afwijking van de eerste volzin, tegelijk genomen met de beslissing op het verzoek, bedoeld in de tweede
      volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel84a
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel86
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: 84a
        hoofdstuk: VIII
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0007168
        artikel: '86'
        hoofdstuk: VIII
        afdeling: '4'
  - number: '91.3'
    text: |-
      Indien de inspecteur de beschikking niet binnen de in het tweede lid genoemde termijn kan geven, stelt hij de
      belanghebbende daarvan onder opgaaf van redenen in kennis en noemt hij de termijn waarop de beschikking wel zal
      worden gegeven.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel91
  - number: '92.1'
    text: |-
      Op verzoek wordt teruggaaf verleend van belasting op leidingwater, afvalstoffenbelasting en energiebelasting, voor
      zover de door de belastingplichtige ter zake te ontvangen bedragen niet zijn en niet zullen worden ontvangen.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel92
  - number: '92.2'
    text: Bij regeling van Onze Minister kunnen regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel92
  - number: '93.1'
    text: |-
      Bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur kunnen ter verzekering van een
      juiste toepassing van de wet regels worden gesteld ter aanvulling van de in deze wet geregelde onderwerpen.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel93
  - number: '93.2'
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld ten behoeve van de uitvoering van de in het eerste lid
      bedoelde algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel93
  - number: '94'
    text: De inwerkingtreding van deze wet wordt bij wet geregeld.
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel94
  - number: '95'
    text: 'Deze wet wordt aangehaald als: Wet belastingen op milieugrondslag.'
    url: https://wetten.overheid.nl/BWBR0007168/2009-07-01#Artikel95
