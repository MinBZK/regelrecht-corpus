  - number: '60'
    text: |-
      1 In afwijking van [artikel 59, eerste lid, onderdeel a][ref1], bedraagt het tarief voor
      aardgas voor verwarming ter bevordering van het groeiproces van tuinbouwproducten als bedoeld in
      [post a 32 van de bij de Wet op de omzetbelasting 1968 behorende Tabel I][ref2] voor aardgas met een bovenste
      verbrandingswaarde van 35,17 megajoule per Nm3, voor dat gedeelte van de geleverde hoeveelheid per verbruiksperiode
      van twaalf maanden per aansluiting dat:

        - niet hoger is dan 5000 kubieke meter, per kubieke meter € 0,01519
        - hoger is dan 5000 kubieke meter, maar niet hoger dan 170 000 kubieke meter, per kubieke meter € 0,02416;
        - hoger is dan 170 000 kubieke meter, maar niet hoger dan 1 000 000 kubieke meter, per kubieke meter € 0,02023;
        - hoger is dan 1 000 000 kubieke meter, maar niet hoger dan 10 000 000 kubieke meter, per kubieke meter € 0,0127;
        - hoger is dan 10 000 000 kubieke meter, per kubieke meter € 0,0083.

      2 Indien behalve voor het in het eerste lid vermelde doel mede aardgas wordt toegepast in één of meerdere
      woonhuizen, wordt per verbruiksperiode van twaalf maanden per woonhuis een geleverde hoeveelheid van 5000 kubieke
      meter in de heffing betrokken naar het tarief, bedoeld in [artikel 59, eerste lid, onderdeel a][ref3], tenzij
      de geleverde hoeveelheden voor de verschillende toepassingen en de verschillende woonhuizen afzonderlijk worden
      gemeten.

      3 Bij aardgas met een bovenste verbrandingswaarde die lager of hoger is dan 35,17 megajoule per Nm3, worden
      de in het eerste lid genoemde tarieven naar evenredigheid verlaagd, onderscheidenlijk verhoogd alsmede de
      hoeveelheidsgrenzen naar evenredigheid verhoogd onderscheidenlijk verlaagd.

      4 Bij regeling van Onze Minister kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.


