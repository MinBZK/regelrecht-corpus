  - number: '89'
    text: |-
      1 De in een tijdvak verschuldigd geworden belasting moet op aangifte worden voldaan.

      2 Bij toepassing van [artikel 40, tweede lid][ref1], dient in afwijking in zoverre van
      [artikel 19, derde lid, van de Algemene wet inzake rijksbelastingen][ref2], de belasting uiterlijk op de dag na het
      in artikel 40, tweede lid, bedoelde tijdstip op aangifte te worden voldaan.

      3 In afwijking van het tweede lid kan de inspecteur, bij toepassing van [artikel 33, tweede lid][ref3], op verzoek
      toestemming verlenen om de verschuldigd geworden belasting in een door hem te bepalen tijdvak uiterlijk binnen
      één maand na het einde van dat tijdvak op aangifte te voldoen. Het door de inspecteur te bepalen tijdvak bedraagt
      maximaal één kwartaal.

      4 Bij toepassing van hoofdstuk VIII dient in afwijking in zoverre van
      [artikel 19, eerste lid, van de Algemene wet inzake rijksbelastingen][ref4], de belasting binnen één kwartaal na
      het einde van het tijdvak op aangifte te worden voldaan.

      5 In afwijking van het vierde lid dient bij toepassing van [artikel 84a][ref5] de belasting op aangifte te worden
      voldaan binnen één kwartaal volgend op het kwartaal waarbinnen de dagtekening ligt van de beschikking waarbij
      het forfait wordt vastgesteld, tenzij deze beschikking is gegeven in een kalenderjaar voorafgaande aan of in een
      kalenderjaar waarop het forfait mede betrekking heeft. In dat laatste geval geldt het vierde lid.

      6 Bij toepassing van [artikel 84a][ref6] zijn de [artikelen 20][ref7], [67c][ref8] en
      [67f van de Algemene wet inzake rijksbelastingen][ref9], van overeenkomstige toepassing, indien de
      belastingplichtige niet heeft voldaan aan de meldingsplicht, bedoeld in artikel 84a, vijfde lid, of onjuiste of
      onvolledige informatie heeft verstrekt bij de vaststelling van het forfait.

      7 Indien de berekening van de verschuldigde belasting leidt tot een negatief bedrag verleent de inspecteur op
      verzoek van de belastingplichtige teruggaaf van dit bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel19
