  - number: '91'
    text: |-
      1 De inspecteur beslist op het verzoek, bedoeld in de [artikelen 20, eerste lid][ref1],
      [45, eerste en tweede lid][ref2], [54, derde lid][ref3], [67, eerste lid][ref4], [68, eerste en tweede lid][ref5],
      [69, eerste tot en met derde lid][ref6], [70, eerste tot en met derde lid][ref7],
      [84a, eerste en vierde lid][ref8], [86, vijfde lid][ref9], [87b, eerste lid][ref10],
      [89, derde en zevende lid][ref11], en [92, eerste lid][ref12], bij een voor bezwaar vatbare beschikking.

      2 Binnen acht weken na ontvangst van het verzoek geeft de inspecteur een beschikking op dat verzoek, dan wel zendt
      hij de in het derde lid bedoelde kennisgeving. In afwijking van de eerste volzin bedraagt de beslistermijn voor
      het verzoek, bedoeld in [artikel 84a, eerste en vierde lid][ref13], een jaar na ontvangst van het verzoek. In geval
      tevens een verzoek als bedoeld in [artikel 86, vijfde lid][ref14], wordt gedaan, wordt de beslissing op dit laatste
      verzoek, in afwijking van de eerste volzin, tegelijk genomen met de beslissing op het verzoek, bedoeld in de tweede
      volzin.

      3 Indien de inspecteur de beschikking niet binnen de in het tweede lid genoemde termijn kan geven, stelt hij de
      belanghebbende daarvan onder opgaaf van redenen in kennis en noemt hij de termijn waarop de beschikking wel zal
      worden gegeven.

      4 [Paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref15] is van toepassing op:

      a. verzoeken aan de inspecteur tot aanwijzing van een teruggaaftijdvak op grond van bepalingen krachtens
      [artikel 45, derde lid][ref16];

      b. verzoeken aan de inspecteur tot aanwijzing van een teruggaaftijdvak op grond van bepalingen krachtens
      [artikel 70, vierde lid][ref17].


