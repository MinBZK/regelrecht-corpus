      1 Op verzoek wordt aan de verbruiker teruggaaf van de belasting verleend met betrekking tot aardgas en
      elektriciteit, voor zover de belasting over de hoeveelheden aardgas en elektriciteit die door de verbruiker in een
      kalenderjaar van verschillende leveranciers zijn betrokken, hoger is dan de belasting die zou zijn verschuldigd
      indien sprake was van één leverancier.

      2 Op verzoek wordt aan de verbruiker teruggaaf van de belasting verleend voor zover met betrekking tot
      zakelijk verbruik van aardgas boven de 10 000 000 kubieke meter of elektriciteit boven de 10 000 000 kWh per
      verbruiksperiode van twaalf maanden per aansluiting het tarief voor niet-zakelijk verbruik in rekening is gebracht.

      3 Bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur worden voorwaarden en
      beperkingen gesteld waaronder de teruggaven, bedoeld in het eerste en tweede lid, worden verleend.

      4 Bij regeling van Onze Minister kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
