    text: |-
      1 Met betrekking tot aardgas en elektriciteit wordt de belasting geheven van degene die de levering verricht.

      2 In afwijking van het eerste lid wordt bij toepassing van [artikel 50, vierde lid][ref1], de belasting geheven
      van degene van wie het verbruik op grond van artikel 50, vierde lid, is aangemerkt als een levering als bedoeld in
      artikel 50, eerste lid.

      3 Hetgeen is bepaald in het tweede lid is niet van toepassing indien het aardgas betreft dat op andere wijze dan
      via een aansluiting aan een CNG-vulstation als CNG wordt afgeleverd.


