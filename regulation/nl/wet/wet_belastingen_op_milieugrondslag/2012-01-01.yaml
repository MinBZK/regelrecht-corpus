      De belasting wordt voor aardgas berekend per eenheid brandstof, uitgedrukt in kubieke meter, en voor elektriciteit
      per eenheid energie-inhoud, uitgedrukt in kWh.
    url: https://wetten.overheid.nl/BWBR0007168/2012-01-01#Artikel55
  - number: '56'
    text: |-
      1 De belasting met betrekking tot de levering van aardgas en de levering van elektriciteit wordt verschuldigd:

      a. in gevallen waarin een voorschotnota wordt uitgereikt of, indien geen voorschotnota wordt uitgereikt, een
      voorschotbedrag wordt ontvangen:

      1°. op het tijdstip waarop een voorschotnota wordt uitgereikt onderscheidenlijk een voorschotbedrag wordt
      ontvangen; alsmede

      2°. op het tijdstip van de uitreiking van de eindfactuur over een verbruiksperiode, dan wel, bij toepassing van
      [artikel 47, zesde lid][ref1], op de laatste dag van het aldaar bedoelde tijdvak van 18 maanden;

      b. in andere gevallen op het tijdstip van de uitreiking van de factuur.

      2 Voor de toepassing van het eerste lid, onderdeel a, onder 1°, worden de hoeveelheden aardgas en elektriciteit,
      waarop de voorschotnota dan wel het voorschotbedrag is gebaseerd, aangemerkt als geleverde hoeveelheden.

      3 In afwijking van het eerste lid wordt de belasting bij toepassing van [artikel 50, vierde lid][ref2],
      verschuldigd op het tijdstip waarop het verbruik plaatsvindt.

      4 Indien de verrekening, bedoeld in [artikel 47, eerste lid, onderdeel e][ref3], leidt tot een lager bedrag dan
      over de verbruiksperiode aan belasting is voldaan, wordt het verschil in mindering gebracht op de aangifte over het
      tijdvak waarin de eindfactuur is uitgereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel47
