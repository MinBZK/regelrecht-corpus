  - number: 87a
    text: |-
      1 Een belastingplichtige als bedoeld in [artikel 83][ref1] mag op het bedrag van de belasting die in een tijdvak
      verschuldigd is geworden na toepassing van [artikel 87][ref2] een bedrag in mindering brengen voor de verpakking
      van de producten die hij als zodanig verpakt ter beschikking gesteld heeft gekregen van een producent en voor zover
      hij die op zijn beurt in dat tijdvak ter beschikking stelt en bij deze terbeschikkingstelling de producten voor het
      eerst buiten Nederland worden gebracht (exportvermindering). De exportvermindering geldt niet voor de verpakking
      waarvan de belastingplichtige weet of redelijkerwijs kan weten dat er geen verpakkingenbelasting over is betaald.

      2 De hoogte van het bedrag van de exportvermindering wordt berekend door het gewicht van de in de verpakking,
      bedoeld in het eerste lid, verwerkte materiaalsoorten, gemeten in kilogrammen, te vermenigvuldigen met de tarieven
      per materiaalsoort, genoemd in [artikel 86, eerste of tweede lid][ref3].

      3 Op het bedrag van de exportvermindering wordt een vermindering toegepast tot ten hoogste het bedrag van de
      exportvermindering.

      4 Ingeval de exportvermindering betrekking heeft op één materiaalsoort als bedoeld in [artikel 86][ref4], is
      het bedrag van de vermindering, bedoeld in het derde lid: 50 000 vermenigvuldigd met het voor die materiaalsoort
      geldende tarief, bedoeld in artikel 86, eerste of tweede lid.

      5 Ingeval de exportvermindering betrekking heeft op twee of meer van de materiaalsoorten, bedoeld in
      [artikel 86][ref5], is het bedrag van de vermindering, bedoeld in het derde lid, de optelsom van de verminderingen
      per materiaalsoort, waarbij de vermindering per materiaalsoort bedraagt: 50 000 vermenigvuldigd met het
      gewichtsaandeel van die materiaalsoort in het totaalgewicht van al die materiaalsoorten samen, vermenigvuldigd met
      het voor de betreffende materiaalsoort geldende tarief, bedoeld in artikel 86, eerste of tweede lid.

      6 Voor de toepassing van dit artikel worden de materiaalsoorten waarvoor in
      [artikel 86, eerste en tweede lid][ref6], een tarief is bepaald als afzonderlijke materiaalsoorten aangemerkt.


