  - number: '13'
    text: Onder de naam belasting op leidingwater wordt een belasting geheven op leidingwater.
    url: https://wetten.overheid.nl/BWBR0007168/2012-01-01#Artikel13
  - number: '14'
    text: |-
      1 De belasting wordt geheven ter zake van de levering van leidingwater via een aansluiting aan de verbruiker,
      met dien verstande dat de belasting wordt geheven over een hoeveelheid van maximaal 300 kubieke meter per
      verbruiksperiode van twaalf maanden per aansluiting.

      2 Bij een verbruiksperiode korter dan wel langer dan twaalf maanden wordt de in het eerste lid genoemde
      hoeveelheidsgrens naar evenredigheid verlaagd, onderscheidenlijk verhoogd.

      3 Bij de levering van leidingwater aan een particuliere installatie voor centrale watervoorziening wordt, in
      afwijking in zoverre van het eerste lid, de belasting geheven over de totale hoeveelheid geleverd water, met
      dien verstande dat, indien de exploitant van de installatie aan degene die het leidingwater heeft geleverd
      een verklaring heeft overgelegd waarin opgaaf wordt gedaan van het aantal onroerende zaken, bedoeld in
      [artikel 16, onderdelen a tot en met e, van de Wet waardering onroerende zaken][ref1] dat door de installatie van
      water wordt voorzien, ten hoogste wordt geheven over een hoeveelheid van 300 kubieke meter vermenigvuldigd met
      dat aantal.

      4 Bij regeling van Onze Minister worden nadere regels gesteld ten behoeve van de uitvoering van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel16
    url: https://wetten.overheid.nl/BWBR0007168/2012-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '16'
  - number: '15'
    text: De belasting wordt geheven van degene die de levering verricht.
    url: https://wetten.overheid.nl/BWBR0007168/2012-01-01#Artikel15
  - number: '16'
    text: |-
      1 De belasting wordt geheven per eenheid leidingwater, gemeten in kubieke meter.

      2 Ingeval de hoeveelheid geleverd leidingwater niet in kubieke meter bekend is, wordt de belasting geheven over een
      hoeveelheid die wordt berekend door het bedrag dat ter zake van de levering van water in rekening wordt gebracht,
      te verminderen met het vastrecht dat door de leverancier aan huishoudelijke verbruikers in rekening wordt gebracht
      indien wel een meter aanwezig is, en de uitkomst te delen door de prijs per kubieke meter die de leverancier in
      rekening brengt aan die verbruikers.
    url: https://wetten.overheid.nl/BWBR0007168/2012-01-01#Artikel16
  - number: '17'
    text: |-
      1 De belasting wordt verschuldigd:

      a. in gevallen waarin een voorschotnota wordt uitgereikt of, indien geen voorschotnota wordt uitgereikt, een
      voorschotbedrag wordt ontvangen:

      1°. op het tijdstip waarop een voorschotnota wordt uitgereikt onderscheidenlijk een voorschotbedrag wordt
      ontvangen; alsmede

      2°. op het tijdstip van de uitreiking van de eindfactuur over een verbruiksperiode;

      b. in gevallen waarin geen voorschotnota wordt uitgereikt en geen voorschotbedrag wordt ontvangen, op het tijdstip
      van de uitreiking van de factuur;

      c. in overige gevallen op het tijdstip waarop de levering plaatsvindt.

      2 Voor de toepassing van het eerste lid, onderdeel a, onder 1°, in samenhang met [artikel 14, eerste lid][ref1],
      wordt de hoeveelheid leidingwater, waarop de voorschotnota dan wel het voorschotbedrag is gebaseerd, aangemerkt als
      geleverde hoeveelheid.

      3 In gevallen waarin per verbruiksperiode van twaalf maanden meer dan 300 kubieke meter leidingwater via
      een aansluiting aan een verbruiker wordt geleverd en ter zake van die levering voorschotnota’s worden
      uitgereikt of voorschotbedragen worden ontvangen, wordt bij de berekening van de op de verbruiksperiode
      betrekking hebbende voorschotbedragen naar evenredigheid rekening gehouden met de belasting die overeenkomstig
      [artikel 14, eerste lid][ref2], ter zake van de hoeveelheid van 300 kubieke meter verschuldigd is.

      4 Onder de in het eerste lid, onderdeel a, onder 2°, bedoelde eindfactuur wordt verstaan de factuur die wordt
      opgemaakt na afloop van een verbruiksperiode en waarin verrekening plaatsvindt met de op deze verbruiksperiode
      betrekking hebbende voorschotbedragen.

      5 Indien de in het vierde lid bedoelde verrekening leidt tot een lager bedrag dan over de verbruiksperiode
      aan belasting is voldaan, wordt het verschil in mindering gebracht op de aangifte over het tijdvak waarin de
      eindfactuur is uitgereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel14
    url: https://wetten.overheid.nl/BWBR0007168/2012-01-01#Artikel17
