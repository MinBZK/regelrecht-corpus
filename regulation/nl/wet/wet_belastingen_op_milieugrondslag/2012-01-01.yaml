  - number: '18'
    text: Het tarief bedraagt € 0,161 per kubieke meter leidingwater.
    url: https://wetten.overheid.nl/BWBR0007168/2012-01-01#Artikel18
  - number: '19'
    text: |-
      Vrijstelling van de belasting wordt verleend ter zake van de levering van leidingwater door middel van
      noodvoorzieningen, waaronder worden verstaan brandkranen, sprinklerinstallaties en dergelijke, indien deze
      uitsluitend worden gebruikt in buitengewone omstandigheden.
    url: https://wetten.overheid.nl/BWBR0007168/2012-01-01#Artikel19
  - number: '20'
    text: |-
      1 Op verzoek wordt teruggaaf van de belasting verleend voor zover de belasting over de hoeveelheden leidingwater
      die door een verbruiker in een verbruiksperiode van twaalf maanden van verschillende leveranciers zijn betrokken,
      hoger is dan de belasting die zou zijn verschuldigd indien sprake was van één leverancier.

      2 De teruggaaf, bedoeld in het eerste lid, wordt verleend aan de verbruiker.

      3 Bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur worden regels gesteld met
      betrekking tot de indiening van het verzoek en de wijze waarop kan worden aangetoond dat aan de voorwaarden voor
      teruggaaf wordt voldaan.

      4 Bij regeling van Onze Minister worden nadere regels gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2012-01-01#Artikel20
  - number: '21'
    text: |-
      1 De in [artikel 15][ref1] bedoelde belastingplichtige voert een administratie waaruit duidelijk alle gegevens
      blijken die voor de heffing van de belasting van belang kunnen zijn.

      2 Bij regeling van Onze Minister worden nadere regels gesteld omtrent de wijze waarop aan de in het eerste lid
      bedoelde verplichting wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel15
