  - number: 87c
    text: |-
      1 Voor de ondernemer die geen belastingplichtige is in de zin van [artikel 83][ref1], maar die wel verpakte
      producten die hij verpakt ter beschikking gesteld heeft gekregen van een producent die hij op zijn beurt
      in een tijdvak ter beschikking stelt en bij deze terbeschikkingstelling buiten Nederland brengt, zijn de
      [artikelen 87a][ref2] en [87b][ref3] van overeenkomstige toepassing.

      2 Het eerste lid is van overeenkomstige toepassing voor de buitenlandse ondernemer.


