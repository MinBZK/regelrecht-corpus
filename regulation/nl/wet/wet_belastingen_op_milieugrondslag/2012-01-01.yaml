  - number: '64'
    text: |-
      1 Vrijstelling van de belasting wordt verleend ter zake van de levering van aardgas en elektriciteit die worden
      gebruikt voor het opwekken van elektriciteit in een installatie met een elektrisch rendement van minimaal 30
      percent dan wel in een installatie met behulp waarvan elektriciteit wordt opgewekt uitsluitend door middel van
      hernieuwbare energiebronnen en elektriciteit.

      2 Als installatie met een elektrisch rendement van minimaal 30 percent wordt aangemerkt een installatie met een
      gemiddeld gebruik van maximaal 0,38 Nm3 aardgas per opgewekt kWh.

      3 Vrijstelling van belasting wordt verleend ter zake van de levering van elektriciteit die wordt gebruikt voor
      chemische reductie en elektrolytische en metallurgische procedés.

      Als metallurgische procedés worden aangemerkt:

      a. de vervaardiging van metalen in primaire vorm;

      b. smeden, persen, stampen en profielwalsen van metaal;

      c. oppervlaktebehandeling bestaande uit harden of warmtebehandeling van metalen.

      De vrijstelling voor metallurgische procedés geldt alleen voor bedrijven die volgens de Standaard Bedrijfsindeling
      van 21 juli 2008 van het Centraal Bureau voor de Statistiek behoren tot code 24 of 25.

      4 Vrijstelling van belasting wordt verleend ter zake van de levering van aardgas dat wordt gebruikt anders dan als
      brandstof dan wel aardgas dat wordt gebruikt als additief of als vulstof in producten die direct of indirect zijn
      bestemd voor verbruik, worden aangeboden voor verkoop of worden verbruikt als aardgas.

      5 Bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur worden voorwaarden en
      beperkingen gesteld waaronder de vrijstellingen, bedoeld in het eerste, derde en vierde lid, worden verleend.

      6 Bij regeling van Onze Minister worden nadere regels gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2012-01-01#Artikel64
  - number: '65'
    text: |-
      1 Bij op voordracht van Onze Minister, mede namens Onze Minister van Economische Zaken, Landbouw en Innovatie
      en Onze Minister van Infrastructuur en Milieu, vast te stellen algemene maatregel van bestuur wordt voorzien
      in een regeling op grond waarvan, onder daarbij te stellen voorwaarden, vrijstelling van de belasting
      wordt verleend ter zake van de levering van elektriciteit ten behoeve van zakelijk verbruik voor zover het
      zakelijk verbruik, na aftrek van het gedeelte van het zakelijk verbruik dat reeds is vrijgesteld op grond van
      [artikel 64, eerste of derde lid][ref1], hoger is dan 10 000 000 kWh per verbruiksperiode van twaalf maanden per
      aansluiting. De vrijstelling wordt verleend indien de verbruiker in het kader van met Onze Minister van Economische
      Zaken, Landbouw en Innovatie of Onze Minister van Infrastructuur en Milieu gemaakte afspraken verplichtingen
      op zich heeft genomen ter verbetering van de energie-efficiëntie en hij als energie-intensief bedrijf wordt
      aangemerkt.

      2 Bij een verbruiksperiode korter dan wel langer dan twaalf maanden wordt de in het eerste lid genoemde
      hoeveelheidsgrens naar evenredigheid verlaagd, onderscheidenlijk verhoogd.

      3 Bij regeling van Onze Minister kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.


