    text: |-
      1 Op verzoek wordt teruggaaf verleend van belasting op leidingwater en energiebelasting, voor zover de door de
      belastingplichtige ter zake te ontvangen bedragen niet zijn en niet zullen worden ontvangen.

      2 Bij regeling van Onze Minister kunnen regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2012-01-01#Artikel92
  - number: '93'
    text: |-
      1 Bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur kunnen ter verzekering van een
      juiste toepassing van de wet regels worden gesteld ter aanvulling van de in deze wet geregelde onderwerpen.

      2 Bij regeling van Onze Minister kunnen regels worden gesteld ten behoeve van de uitvoering van de in het eerste
      lid bedoelde algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0007168/2012-01-01#Artikel93
