  - number: '80'
    text: |-
      Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:

      a. verpakkingen: alle producten, vervaardigd van materiaal van welke aard ook, die kunnen worden gebruikt voor
      het insluiten, beschermen, verladen, afleveren en aanbieden van andere producten, van grondstoffen tot afgewerkte
      producten, over het gehele traject van producent tot gebruiker of consument, wegwerpartikelen die voor dit doel
      worden gebruikt daaronder begrepen, waarbij verpakkingen uitsluitend omvatten verkoop- of primaire verpakkingen,
      verzamel- of secundaire verpakkingen en verzend- of tertiaire verpakkingen en:

      1°. waarbij producten als verpakking worden beschouwd indien zij aan het vorenstaande voldoen, ongeacht andere
      functies die de verpakking ook kan vervullen, tenzij het product integraal deel uitmaakt van een ander product en
      het nodig is om dat product tijdens zijn levensduur te bevatten, te ondersteunen of te bewaren en alle elementen
      bedoeld zijn om samen gebruikt, verbruikt of verwijderd te worden;

      2°. waarbij producten die ontworpen en bedoeld zijn om op het verkooppunt te worden gevuld alsmede wegwerpartikelen
      die in gevulde toestand worden verkocht of die ontworpen en bedoeld zijn om op het verkooppunt te worden gevuld,
      slechts als verpakking worden beschouwd indien zij een verpakkingsfunctie hebben;

      3°. waarbij de componenten van een verpakking en de bijbehorende in de verpakking verwerkte elementen worden
      beschouwd als deel van de verpakking waarin ze verwerkt zijn en waarbij de bijbehorende elementen die aan een
      verpakt product hangen of bevestigd zijn en die een verpakkingsfunctie hebben, als verpakking worden beschouwd,
      tenzij zij integraal deel uitmaken van dit product en alle elementen bedoeld zijn om samen verbruikt of verwijderd
      te worden; en

      4°. met uitzondering van bij ministeriële regeling aan te wijzen logistieke hulpmiddelen en producten die
      wel voldoen aan de definitie van verpakking, maar die naar hun aard hoofdzakelijk een andere functie dan een
      verpakkingsfunctie hebben, en mitsdien niet als verpakking worden beschouwd. De aanwijzing kan zowel individuele
      producten als groepen van producten betreffen. Ter zake kunnen eisen worden gesteld aan afmetingen dan wel inhoud;

      b. verkoop- of primaire verpakking: verpakking die zo is ontworpen dat zij voor de eindgebruiker of consument op
      het verkooppunt een verkoopeenheid vormt;

      c. verzamel- of secundaire verpakking: verpakking die zo is ontworpen dat zij op het verkooppunt een verzameling
      van een aantal verkoopeenheden vormt, ongeacht of deze als dusdanig aan de eindgebruiker of consument wordt
      verkocht, dan wel alleen dient om de rekken op het verkooppunt bij te vullen en die van het product kan worden
      verwijderd zonder dat dit de kenmerken ervan beïnvloedt;

      d. verzend- of tertiaire verpakking: verpakking die zo is ontworpen dat het verladen en het vervoer van
      verkoopeenheden of verzamelverpakkingen wordt vergemakkelijkt om fysieke schade door verlading of transport te
      voorkomen, weg-, spoor-, scheeps- of vliegcontainers niet daaronder begrepen;

      e. producent: de ondernemer die in de uitoefening van zijn bedrijf of beroep:

      1°. producten in een verpakking aan een ander ter beschikking stelt; of

      2°. producten tezamen met verpakkingen aan een ander ter beschikking stelt;

      f. importeur: de ondernemer voor wie bestemd zijn de verpakte producten:

      1°. die worden ingevoerd in de zin van [artikel 18 van de Wet op de omzetbelasting 1968][ref1];

      2°. die vanuit een andere lidstaat van de Europese Unie in Nederland worden gebracht,

      en die over deze verpakte producten in het kader van de uitoefening van zijn bedrijf of beroep de beschikking
      verkrijgt;

      g. concern: de fiscale eenheid, bedoeld in [artikel 7, vierde lid, van de Wet op de omzetbelasting 1968][ref2];

      h. ondernemer: ondernemer in de zin van [artikel 7, eerste en tweede lid, van de Wet op de omzetbelasting 1968][ref3]
      die in Nederland is gevestigd dan wel aldaar een vaste inrichting heeft;

      i. biokunststof: kunststof die is gecertificeerd volgens de Europese norm EN 13 432 voor terugwinbaarheid door
      compostering en biodegradatie;

      j. logistieke hulpmiddelen: verpakkingen waarvan de transportfunctie de voornaamste functie is en die overigens
      veelal een zelfstandige functie hebben;

      k. loonverpakker: de ondernemer die in opdracht van een ander bedrijf producten herpakt, verpakt of ontpakt, die
      hij niet zelf heeft vervaardigd en waarvan hij niet de eigendom verkrijgt;

      l. drank: vloeistof bestemd voor menselijke consumptie en primair bedoeld om te worden gedronken;

      m. buitenlandse ondernemer: ondernemer in de zin van
      [artikel 7, eerste en tweede lid, van de Wet op de omzetbelasting 1968][ref4] die niet in Nederland is gevestigd en
      aldaar ook niet een vaste inrichting heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0002629#Artikel7
