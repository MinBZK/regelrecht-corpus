  - number: '12'
    text: |-
      Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:

      a. leidingwater: water dat door een drinkwaterbedrijf of een afzonderlijke watervoorziening aan derden ter
      beschikking wordt gesteld, al dan niet van drinkwaterkwaliteit;

      b. drinkwaterbedrijf: drinkwaterbedrijf als bedoeld in [artikel 1, eerste lid, van de Drinkwaterwet][ref1];

      c. afzonderlijke watervoorziening: landgebonden voorziening, niet zijnde een drinkwaterbedrijf, voor de winning
      of behandeling van water, dat met behulp van een leiding of distributienet als leidingwater ter beschikking wordt
      gesteld;

      d. aansluiting: een aansluiting van een in Nederland gelegen onroerende zaak als bedoeld in
      [artikel 16, onderdelen a tot en met e, van de Wet waardering onroerende zaken][ref2], op het distributienet van
      een drinkwaterbedrijf of van een afzonderlijke watervoorziening, waaruit leidingwater aan de verbruiker wordt
      geleverd; een aansluiting kan bestaan uit een of meer leveringspunten;

      e. particuliere installatie voor centrale watervoorziening: installatie
      voor de levering van water aan meer dan een onroerende zaak als bedoeld in
      [artikel 16, onderdelen a tot en met e, van de Wet waardering onroerende zaken][ref3], welke installatie permanent
      is aangesloten op het distributienet van een drinkwaterbedrijf of van een afzonderlijke watervoorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007119#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0007119#Artikel16
