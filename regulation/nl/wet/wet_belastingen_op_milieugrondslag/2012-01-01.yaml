    text: |-
      1 Het tarief bedraagt voor:

      a. aardgas, met uitzondering van aardgas als bedoeld in onderdeel b, met een bovenste verbrandingswaarde van
      35,17 megajoule per Nm3 voor dat gedeelte van de geleverde hoeveelheid per verbruiksperiode van twaalf maanden per
      aansluiting dat:

        - niet hoger is dan 5000 kubieke meter, per kubieke meter € 0,1667;
        - hoger is dan 5000 kubieke meter, maar niet hoger dan 170 000 kubieke meter, per kubieke meter € 0,1443;
        - hoger is dan 170 000 kubieke meter, maar niet hoger dan 1 000 000 kubieke meter, per kubieke meter € 0,0400;
        - hoger is dan 1 000 000 kubieke meter, maar niet hoger dan 10 000 000 kubieke meter, per kubieke meter € 0,0127;
        - hoger is dan 10 000 000 kubieke meter, per kubieke meter € 0,0119 voor niet-zakelijk verbruik en per kubieke
      meter € 0,0083 voor zakelijk verbruik;

      b. aardgas, met een bovenste verbrandingswaarde van 35,17 megajoule per Nm3, dat wordt geleverd aan een CNG-
      vulstation € 0,0639 per kubieke meter;

      c. elektriciteit voor dat gedeelte van de geleverde hoeveelheid per verbruiksperiode van twaalf maanden per
      aansluiting dat:

        - niet hoger is dan 10 000 kWh, per kWh € 0,1140;
        - hoger is dan 10 000 kWh, maar niet hoger dan 50 000 kWh, per kWh € 0,0415;
        - hoger is dan 50 000 kWh, maar niet hoger dan 10 000 000 kWh, per kWh € 0,0111;
        - hoger is dan 10 000 000 kWh, per kWh € 0,0010 voor niet-zakelijk verbruik en per kWh € 0,0005 voor zakelijk
      verbruik.

      2 Bij aardgas met een bovenste verbrandingswaarde die lager of hoger is dan 35,17 megajoule per Nm3, worden de
      in het eerste lid, onderdelen a en b, genoemde tarieven naar evenredigheid verlaagd, onderscheidenlijk verhoogd
      alsmede de hoeveelheidsgrenzen naar evenredigheid verhoogd onderscheidenlijk verlaagd.

      3 In afwijking van het eerste lid, onderdeel a, bedraagt het tarief voor aardgas € 0,1667 per kubieke meter voor
      de totale hoeveelheid aardgas die wordt geleverd aan een verbruiker die dat aardgas gebruikt voor een installatie
      voor blokverwarming niet zijnde een installatie voor stadsverwarming waarbij grotendeels gebruik wordt gemaakt
      van restwarmte.

      4 In afwijking van het eerste lid, onderdeel a, bedragen de tarieven nihil voor in [artikel 48, tweede lid][ref1],
      als aardgas aangemerkte producten voor zover deze als brandstof worden gebruikt in de inrichting waarin zij zijn
      ontstaan.

      5 Indien bij een aansluiting sprake is van zowel zakelijk verbruik als niet-zakelijk verbruik, worden de tarieven,
      genoemd in het eerste lid, voor verbruik boven 10 000 000 kubieke meter respectievelijk 10 000 000 kWh toegepast
      naar evenredigheid van elk type verbruik. Indien het verbruik nagenoeg geheel bestaat uit zakelijk verbruik of
      niet-zakelijk verbruik, wordt het volledige verbruik als zodanig aangemerkt.

      6 Bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur worden nadere regels gesteld
      ten behoeve van de toepassing van het eerste en derde lid.

      7 Bij regeling van Onze Minister kunnen nadere regels worden gesteld ten behoeve van de toepassing van het eerste
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel48
