preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is belastingen op grondwater, afvalstoffen en uranium-
    235 in te stellen en deze te zamen met de in de Wet milieubeheer opgenomen verbruiksbelastingen van brandstoffen te
    vervatten in één wet belastingen op milieugrondslag;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007168/2012-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Krachtens deze wet worden de volgende belastingen geheven:

      a. een belasting op leidingwater;

      b. een belasting op kolen;

      c. een energiebelasting;

      d. een verpakkingenbelasting.
    url: https://wetten.overheid.nl/BWBR0007168/2012-01-01#Artikel1
  - number: '2'
    text: |-
      1 Voor de toepassing van deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Financiën;

      b.

      c. GN-code: een code als bedoeld in [verordening (EEG) nr. 2658/87](31987R2658) van de Raad van de Europese
      Gemeenschappen van 23 juli 1987 met betrekking tot de tarief- en statistieknomenclatuur en het gemeenschappelijk
      douanetarief (PbEG L 256), zoals deze luidt op 1 januari 2002.

      2 Bij regeling van Onze Minister kunnen de GN-codes, genoemd in [artikel 32, onderdeel a][ref1], en
      [artikel 47, eerste lid, onderdelen m en n][ref2], worden aangepast indien de overeenkomstige GN-codes zoals
      opgenomen in de [richtlijn nr. 2003/96/EG](32003L0096) van de Raad van de Europese Unie van 27 oktober 2003 tot
      herstructurering van de communautaire regeling voor de belasting van energieproducten en elektriciteit (PbEU L
      283), in overeenstemming met artikel 2, lid vijf, van die richtlijn zijn aangepast. In dat geval kan bij regeling
      van Onze Minister eveneens de datum in het eerste lid, onderdeel c, worden vervangen door de datum van de versie
      van de in dat onderdeel bedoelde verordening die aan de wijziging van de GN-codes ten grondslag heeft gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel47
