  - number: '81'
    text: Onder de naam verpakkingenbelasting wordt een belasting geheven op verpakkingen.
    url: https://wetten.overheid.nl/BWBR0007168/2012-01-01#Artikel81
  - number: '82'
    text: |-
      1 De belasting wordt geheven ter zake van:

      a. de verpakking van ter beschikking gestelde producten, voor zover die verpakte producten voor het eerst door een
      producent in Nederland ter beschikking worden gesteld aan een ander;

      b. de verpakking van producten, ingeval de importeur van de verpakte producten zich van die verpakking ontdoet of
      laat ontdoen;

      c. de verpakking die tezamen met een product dan wel producten ter beschikking wordt gesteld, voor zover deze voor
      het eerst door een producent in Nederland ter beschikking worden gesteld aan een ander.

      2 Het eerste lid, onderdelen a en c, is niet van toepassing indien het verpakte product onderscheidenlijk de
      verpakkingen:

      a. zich nog niet in het vrije verkeer van de Europese Gemeenschap bevinden; of

      b. bij de terbeschikkingstelling buiten Nederland worden gebracht.
    url: https://wetten.overheid.nl/BWBR0007168/2012-01-01#Artikel82
  - number: '83'
    text: |-
      1 De belasting wordt geheven:

      a. indien [artikel 82, eerste lid, onderdeel a of c][ref1], toepassing vindt: van de producent;

      b. indien [artikel 82, eerste lid, onderdeel b][ref2], toepassing vindt: van de importeur; of

      c. indien zowel onderdeel a als onderdeel b toepassing vindt: van de producent/importeur.

      2 Ingeval een in het eerste lid, onderdeel a, b of c, bedoelde producent, importeur onderscheidenlijk producent/
      importeur, deel uitmaakt van een concern, wordt de belasting, in afwijking van het eerste lid, geheven van het
      concern.

      3 Ingeval een producent als bedoeld in het eerste lid, onderdeel a, een loonverpakker is, wordt de belasting
      geheven van degene in wiens opdracht hij de producten herpakt, verpakt of ontpakt, tenzij de opdrachtgever in het
      buitenland is gevestigd. In dat laatste geval wordt de belasting geheven van de afnemer van de opdrachtgever die
      wel in Nederland is gevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel82
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel82
