  - number: 87b
    text: |-
      1 Ingeval na toepassing van [artikel 87a][ref1] een negatief bedrag resteert, wordt dit bedrag op verzoek van de
      belastingplichtige uitbetaald.

      2 Het verzoek om uitbetaling, bedoeld in het eerste lid, geschiedt bij de aangifte over het betreffende tijdvak. In
      gevallen waarin geen aangifte moet worden ingediend, geschiedt het verzoek door het doen van aangifte.


