  - number: '88'
    text: |-
      Bij regeling van Onze Minister kunnen nadere regels worden gesteld omtrent de wijze waarop de belastingplichtige
      een administratie moet voeren voor de toepassing van de verpakkingenbelasting.
    url: https://wetten.overheid.nl/BWBR0007168/2012-01-01#Artikel88
  - number: 88a
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de heffing van de
      verpakkingenbelasting. Hierbij kunnen regels worden gesteld inzake het verleggen van de belastingplicht, het al dan
      niet van toepassing zijn van de vermindering bij indirecte export, bedoeld in [afdeling 5a][ref1], en het bij de
      belastingplicht direct verdisconteren van deze exportvermindering, resulterende in een lager aantal aan te geven
      kilogrammen verpakking.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#HoofdstukVIII
    url: https://wetten.overheid.nl/BWBR0007168/2012-01-01#Artikel88a
    references:
      - id: ref1
        bwb_id: BWBR0007168
        hoofdstuk: VIII
        afdeling: 5a
  - number: 88b
    text: |-
      1 In afwijking van de [artikelen 82][ref1], [83][ref2], [87][ref3] en [87a][ref4] kunnen bij of krachtens
      algemene maatregel van bestuur nadere regels worden gesteld met betrekking tot de heffing van de belasting van een
      vertegenwoordiger van een groep belastingplichtigen.

      2 Bij toepassing van het voorgaande lid kan worden afgeweken van [artikel 82, tweede lid, onderdeel b][ref5].


