    text: |-
      1 Onder de naam energiebelasting wordt een belasting geheven op aardgas en elektriciteit.

      2 Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen wordt als aardgas mede aangemerkt
      elk product dat direct of indirect is bestemd voor gebruik, wordt aangeboden voor verkoop of wordt gebruikt als
      aardgas.
    url: https://wetten.overheid.nl/BWBR0007168/2012-01-01#Artikel48
  - number: '50'
    text: |-
      1 Met betrekking tot aardgas en elektriciteit wordt de belasting geheven ter zake van de levering via een
      aansluiting aan de verbruiker, alsmede ter zake van de levering van aardgas via een aansluiting aan een CNG-
      vulstation.

      2 Indien de verbruiker, bedoeld in het eerste lid, via een aansluiting elektriciteit op het distributienet heeft
      ingevoed ter zake waarvan [artikel 31c][ref1] dan wel [artikel 95c, derde lid, van de Elektriciteitswet 1998][ref2]
      wordt toegepast, is het eerste lid van toepassing op het positieve saldo van de via de aansluiting geleverde
      elektriciteit minus de via de aansluiting ingevoede elektriciteit.

      3 Indien een levering van aardgas of elektriciteit via een aansluiting wordt verricht aan een organisatorische
      eenheid die zich bezighoudt met het leveren van aardgas of elektriciteit dan wel aan een verbruiker die op
      zijn beurt het geleverde product geheel of gedeeltelijk via een aansluiting levert aan een verbruiker, wordt
      eerstgenoemde levering niet aangemerkt als een levering als bedoeld in het eerste lid.

      4 Als een levering als bedoeld in het eerste lid wordt mede aangemerkt het verbruik van aardgas en elektriciteit,
      indien:

      a. deze producten op andere wijze zijn verkregen dan door een levering als bedoeld in het eerste lid;

      b. deze producten zijn verkregen door tussenkomst van een gasbeurs of een elektriciteitsbeurs;

      c. het verbruik betreft door degene die leveringen via een aansluiting aan de verbruiker verricht.

      5 Het vierde lid is niet van toepassing met betrekking tot de verbruiker die:

      a. elektriciteit heeft opgewekt door middel van hernieuwbare energiebronnen, met uitzondering van elektriciteit uit
      biomassa die niet als zuivere biomassa wordt aangemerkt;

      b. elektriciteit heeft opgewekt door middel van een noodinstallatie in geval van storingen bij de levering via
      het distributienet;

      c. stortgas, rioolwaterzuiveringsgas of biogas heeft gewonnen;

      d. elektriciteit heeft opgewekt door middel van een installatie voor warmtekrachtkoppeling.

      6 Bij regeling van Onze Minister worden nadere regels gesteld ten behoeve van de uitvoering van dit artikel.


