  - number: 87d
    text: |-
      1 De ondernemer, bedoeld in [artikel 87c][ref1], is gehouden een administratie te voeren en de daartoe behorende
      boeken, bescheiden en andere gegevensdragers op zodanige wijze te bewaren, dat te allen tijde zijn rechten ter zake
      van de verpakkingenbelasting hieruit duidelijk blijken.

      2 Het eerste lid is van overeenkomstige toepassing op de buitenlandse ondernemer.

      3 Bij regeling van Onze Minister kunnen nadere regels worden gesteld omtrent de wijze waarop de ondernemer en de
      buitenlandse ondernemer, bedoeld in [artikel 87c][ref2], een administratie moeten voeren voor de toepassing van
      de verpakkingenbelasting.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel87c
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel87c
    url: https://wetten.overheid.nl/BWBR0007168/2012-01-01#Artikel87d
