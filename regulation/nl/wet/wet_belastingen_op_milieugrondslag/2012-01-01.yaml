  - number: '86'
    text: |-
      1 Het tarief per kilogram bedraagt voor in een verpakking verwerkte materiaalsoorten van:










                    a. aluminium en legeringen van aluminium:


                    € 0,9726





                    b. kunststof:


                    € 0,4813





                    c. overige metalen:


                    € 0,1622





                    d. biokunststof:


                    € 0,0814





                    e. papier en karton:


                    € 0,0814





                    f. glas:


                    € 0,0734





                    g. hout:


                    € 0,0215





                    h. een andere materiaalsoort:


                    € 0,1796






      2 Indien een verpakking een fles voor drank betreft waarvoor op grond van een publiekrechtelijk voorschrift een
      op de consument gerichte statiegeldregeling geldt, bedraagt, in afwijking in zoverre van het eerste lid, voor een
      dergelijke verpakking het tarief per kilogram, een bij ministeriële regeling vastgesteld percentage van het tarief,
      genoemd in het eerste lid.

      3 Indien een uitsplitsing naar materiaalsoorten niet anders dan met buitengewoon bezwaar mogelijk is, bedraagt het
      tarief per kilogram verpakking: € 0,52 (algemeen tarief).

      4 Indien het algemeen tarief van toepassing is, en de belastingplichtige, de materiaalsoorten op volgorde van
      tariefhoogte, bedoeld in het eerste lid, in aanmerking nemend, aannemelijk maakt dat de materiaalsoort «aluminium
      en legeringen van aluminium» en eventuele volgende materiaalsoorten niet in de verpakkingen zijn verwerkt, geldt
      het tarief, genoemd in het eerste lid, dat hoort bij de eerstvolgende materiaalsoort dat wel in de verpakkingen
      is verwerkt.

      5 De belastingplichtige die in aanmerking wil komen voor toepassing van het algemeen tarief, al dan niet verlaagd
      op grond van het vierde lid, dient hiertoe een verzoek in bij de inspecteur.
    url: https://wetten.overheid.nl/BWBR0007168/2012-01-01#Artikel86
  - number: '87'
    text: |-
      1 Op het bedrag van de belasting die in een tijdvak verschuldigd is geworden door een belastingplichtige als
      bedoeld in [artikel 83, eerste lid, onderdeel a, b of c, dan wel tweede lid][ref1], wordt een vermindering
      toegepast tot ten hoogste het bedrag van die verschuldigde belasting.

      2 In geval de verschuldigde belasting betrekking heeft op één materiaalsoort als bedoeld in [artikel 86][ref2], is
      het bedrag van de vermindering: 50 000 vermenigvuldigd met het voor die materiaalsoort geldende tarief, bedoeld in
      [artikel 86, eerste, tweede, derde of vierde lid][ref3].

      3 In geval de verschuldigde belasting betrekking heeft op twee of meer van de materiaalsoorten, bedoeld in
      [artikel 86][ref4], is het bedrag van de vermindering de optelsom van de verminderingen per materiaalsoort, waarbij
      de vermindering per materiaalsoort bedraagt: 50 000 vermenigvuldigd met het gewichtsaandeel van die materiaalsoort
      in het totaalgewicht van al die materiaalsoorten samen, vermenigvuldigd met het voor de betreffende materiaalsoort
      geldende tarief, bedoeld in [artikel 86, eerste, tweede, derde of vierde lid][ref5].

      4 Voor de toepassing van dit artikel:

      a. worden de materiaalsoorten waarvoor in [artikel 86, eerste en tweede lid][ref6], een tarief is bepaald als
      afzonderlijke materiaalsoorten aangemerkt;

      b. worden, indien [artikel 86, derde of vierde lid][ref7], is toegepast, de ongesplitste materiaalsoorten als één
      materiaalsoort aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel83
