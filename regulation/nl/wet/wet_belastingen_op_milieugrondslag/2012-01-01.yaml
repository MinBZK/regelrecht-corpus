      Indien in een verbruiksperiode ten aanzien van degene van wie op grond van [artikel 53, tweede lid][ref1],
      de belasting wordt geheven zowel sprake is van door hem op grond van artikel 53, tweede lid, verschuldigde
      belasting als van aan hem in rekening gebrachte belasting ter zake van aan hem geleverde hoeveelheden aardgas of
      elektriciteit, wordt in totaal niet meer belasting geheven dan de belasting die zou zijn verschuldigd indien de
      totale hoeveelheid aardgas of elektriciteit was betrokken van één leverancier, met dien verstande dat de belasting
      primair wordt geheven van degene, bedoeld in artikel 53, eerste lid.


