  - number: '46'
    text: |-
      1 De belastingplichtige voert een administratie waaruit, voor zover dat voor de heffing van belang kan zijn, de
      gegevens betreffende het vervaardigen, invoeren, uitslaan en gebruik van kolen duidelijk blijken.

      2 Bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur kunnen, ter verzekering van de
      heffing van de belasting, regels worden gesteld met betrekking tot:

      a. het vervoer van kolen;

      b. het leveren van kolen;

      c. het voorhanden hebben van kolen buiten een inrichting.

      3 Het tweede lid is niet van toepassing op kolen die zijn geplaatst onder een communautaire douaneregeling.

      4 Bij regeling van Onze Minister kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
