  - number: '47'
    text: |-
      1 Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:

      a. motorrijtuig: hetgeen ingevolge [artikel 27, vijfde lid, van de Wet op de accijns][ref1] onder dit begrip wordt
      verstaan;

      b. elektriciteitsbeurs: beurs als bedoeld in [artikel 86e van de Elektriciteitswet 1998][ref2];

      c. gasbeurs: beurs als bedoeld in [artikel 66b van de Gaswet][ref3];

      d. verbruiksperiode:

      1°. in gevallen waarin een voorschotnota wordt uitgereikt of, indien geen voorschotnota wordt uitgereikt, een
      voorschotbedrag wordt ontvangen: tijdvak waarop de eindfactuur betrekking heeft;

      2°. in overige gevallen: kalenderjaar;

      e. eindfactuur: definitieve factuur waarin verrekening plaatsvindt met de voorschotnota’s of voorschotbedragen die
      betrekking hebben op het tijdvak waarop de factuur ziet;

      f. aansluiting: een aansluiting van een in Nederland gelegen onroerende zaak als bedoeld in
      [artikel 16, onderdelen a tot en met e, van de Wet waardering onroerende zaken][ref4] op een Nederlands
      distributienet waaruit elektriciteit of aardgas aan de verbruiker wordt geleverd; een aansluiting kan bestaan uit
      een of meer leveringspunten;

      g. installatie voor warmtekrachtkoppeling: een installatie waarin aardgas wordt verstookt voor de gecombineerde
      opwekking van warmte en kracht met een totaal energetisch rendement van minimaal 60%, gebaseerd op de calorische
      onderwaarde van het gas. Onder het totaal energetisch rendement wordt verstaan de som van het rendement van de
      elektriciteitsopwekking en tweederde deel van het rendement van de productie van nuttig aan te wenden warmte,
      berekend op de onderste verbrandingswaarde van aardgas;

      h. installatie voor blokverwarming: een gemeenschappelijke voorziening voor de verwarming van meer dan een onroerende
      zaak als bedoeld in [artikel 16, onderdelen a tot en met e, van de Wet waardering onroerende zaken][ref5];

      i. hernieuwbare energiebronnen: wind, zonne-energie, aardwarmte, golfenergie, getijdenenergie, waterkracht,
      biomassa, stortgas, rioolwaterzuiveringsgas en biogas;

      j. biomassa: de biologisch afbreekbare fractie van producten, afvalstoffen en residuen van de landbouw, met
      inbegrip van plantaardige en dierlijke stoffen, de bosbouw en aanverwante bedrijfstakken, alsmede de biologisch
      afbreekbare fractie van industrieel en huishoudelijk afval;

      k. zuivere biomassa: producten, afvalstoffen en residuen van de landbouw, met inbegrip van plantaardige en
      dierlijke stoffen, de bosbouw en aanverwante bedrijfstakken die geheel biologisch afbreekbaar zijn, alsmede
      industrieel en huishoudelijk afval dat geheel biologisch afbreekbaar is;

      l. Nm3: een normaalkubiekemeter;

      m. aardgas: producten van de GN-codes 2711 11 00 en 2711 21 00;

      n. elektriciteit: elektrische energie van de GN-code 2716;

      o. brandstof: stof – met inbegrip van alle daaraan toegevoegde stoffen – dienende voor verbranding met het doel de
      daarbij ontstane energie te benutten;

      p. energie-intensief bedrijf: een zakelijke eenheid als bedoeld in onderdeel t, waar de kosten van de aankoop
      van energieproducten en elektriciteit ten minste 3,0% van de productiewaarde uitmaken, of waar de verschuldigde
      energiebelasting en accijns op minerale oliën ten minste 0,5% van de toegevoegde waarde bedraagt;

      q. kosten van de aankoop van energieproducten en elektriciteit, productiewaarde en toegevoegde waarde: hetgeen
      ingevolge artikel 17, eerste lid, onderdeel a, van richtlijn nr. 2003/96/EG van de Raad van de Europese Unie
      van 27 oktober 2003 tot herstructurering van de communautaire regeling voor de belasting van energieproducten en
      elektriciteit (PbEU L 283) onder deze begrippen wordt verstaan;

      r. CNG: aardgas dat na compressie geschikt is voor de aanwending in motorrijtuigen;

      s. CNG-vulstation: een rechtstreeks op het distributienet van aardgas aangesloten inrichting waar uitsluitend
      aardgas wordt samengeperst tot CNG, dat wordt afgeleverd aan motorrijtuigen;

      t. zakelijk verbruik: verbruik door een zakelijke eenheid die zelfstandig, op ongeacht welke plaats, leveringen van
      goederen en diensten verricht, ongeacht het oogmerk of het resultaat van die economische activiteiten. Economische
      activiteiten omvatten alle werkzaamheden van een fabrikant, handelaar of verrichter van diensten, met inbegrip van
      de winning van delfstoffen, de landbouw en de uitoefening van vrije of daarmee gelijkgestelde beroepen. Rijks-,
      regionale en lokale overheden, alsmede andere publiekrechtelijke lichamen worden als zakelijke eenheid aangemerkt
      voor zover zij werkzaamheden of transacties verrichten die bij een behandeling als niet-zakelijke eenheid tot
      concurrentieverstoring van enige betekenis zouden leiden;

      u. niet-zakelijk verbruik: verbruik anders dan het zakelijk verbruik, bedoeld in onderdeel t.

      2 Bij regeling van Onze Minister in overeenstemming met Onze Minister van Infrastructuur en Milieu worden nadere
      regels gesteld met betrekking tot de inhoud van het begrip zuivere biomassa.

      3 Met betrekking tot elektriciteit wordt onder distributienet verstaan een net als bedoeld in
      [artikel 1, eerste lid, onderdeel i, van de Elektriciteitswet 1998][ref6], met uitzondering van een net als bedoeld
      in [artikel 15, eerste lid, van de Elektriciteitswet 1998][ref7].

      4 Bij regeling van Onze Minister kunnen nadere regels worden gesteld met betrekking tot de toepassing van het
      eerste lid, onderdeel p.

      5 Met betrekking tot aardgas wordt onder distributienet verstaan een gastransportnet als bedoeld in
      [artikel 1, eerste lid, onderdeel d, van de Gaswet][ref8].

      6 Indien in een tijdvak van 18 maanden een of meerdere voorschotnota’s worden uitgereikt dan wel een of meerdere
      voorschotbedragen worden ontvangen en uiterlijk binnen 13 weken na afloop van dat tijdvak geen eindfactuur wordt
      uitgereikt, wordt dat tijdvak van 18 maanden aangemerkt als verbruiksperiode.


