  - number: '92.1'
    text: |-
      Bij de toepassing van [artikel 89][ref1] wordt voor de belasting op leidingwater, de afvalstoffenbelasting , de
      energiebelasting en de vliegbelasting een vermindering op de verschuldigde belasting toegepast, voor zover komt
      vast te staan dat een door de belastingplichtige ter zake te ontvangen bedrag niet is en niet zal worden ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel89
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '89'
        hoofdstuk: IX
        afdeling: '1'
  - number: '92.2'
    text: |-
      De aanspraak op de vermindering van belasting ontstaat op het tijdstip waarop komt vast te staan dat het bedrag,
      bedoeld in het eerste lid, niet is en niet zal worden ontvangen, met dien verstande dat deze aanspraak uiterlijk
      ontstaat één jaar na het tijdstip waarop het geheel of gedeeltelijk niet ontvangen bedrag opeisbaar is geworden.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel92
  - number: '92.3'
    text: |-
      Voor zover een bedrag ter zake waarvan de aanspraak op de vermindering van belasting is ontstaan, alsnog
      geheel of gedeeltelijk wordt ontvangen, wordt de belasting opnieuw verschuldigd op het tijdstip van ontvangst.
      [Artikel 89][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel89
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '89'
        hoofdstuk: IX
        afdeling: '1'
  - number: '92.4'
    text: |-
      Ingeval de belastingplichtige zijn vordering ter zake van een bedrag als bedoeld in het
      eerste lid geheel of gedeeltelijk overdraagt aan een andere ondernemer als bedoeld in
      [artikel 7 van de Wet op de omzetbelasting 1968][ref1], treedt deze andere ondernemer met betrekking tot die
      vordering of het overgedragen gedeelte daarvan voor de toepassing van dit artikel op het tijdstip van die
      overdracht in de plaats van de belastingplichtige.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel7
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '7'
  - number: '92.5'
    text: |-
      Bij algemene maatregel van bestuur kunnen aan de vermindering, bedoeld in het eerste lid, voorwaarden en
      beperkingen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel92
  - number: '92.6'
    text: Bij regeling van Onze Minister kunnen regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel92
  - number: '93.1'
    text: |-
      Bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur kunnen ter verzekering van een
      juiste toepassing van de wet regels worden gesteld ter aanvulling van de in deze wet geregelde onderwerpen.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel93
  - number: '93.2'
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld ten behoeve van de uitvoering van de in het eerste lid
      bedoelde algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel93
  - number: '94'
    text: De inwerkingtreding van deze wet wordt bij wet geregeld.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel94
  - number: '95'
    text: 'Deze wet wordt aangehaald als: Wet belastingen op milieugrondslag.'
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel95
