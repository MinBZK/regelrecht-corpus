$id: wet_belastingen_op_milieugrondslag
regulatory_layer: WET
publication_date: '2023-12-27'
valid_from: '2021-10-01'
bwb_id: BWBR0007168
url: https://wetten.overheid.nl/BWBR0007168/2021-10-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is belastingen op grondwater, afvalstoffen en uranium-
    235 in te stellen en deze te zamen met de in de Wet milieubeheer opgenomen verbruiksbelastingen van brandstoffen te
    vervatten in één wet belastingen op milieugrondslag;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'Krachtens deze wet worden de volgende belastingen geheven:'
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel1
  - number: 1.a
    text: een belasting op leidingwater;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel1
  - number: 1.b
    text: een afvalstoffenbelasting;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel1
  - number: 1.c
    text: een belasting op kolen;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel1
  - number: 1.d
    text: een energiebelasting;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel1
  - number: 1.e
    text: een vliegbelasting;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel1
  - number: 1.f
    text: een CO-heffing industrie.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel1
  - number: '2.1'
    text: |-
      Voor de toepassing van deze wet en de daarop berustende bepalingen wordt verstaan onder: - *Onze Minister:* Onze
      Minister van Financiën;
        - *Onze Ministers:* Onze Minister van Financiën en Onze Minister van Infrastructuur en Waterstaat;
        - *GN-code:* de code, bedoeld in Verordening (EEG) nr. 2658/87 van de Raad van 23 juli 1987 met betrekking tot de
      tarief- en statistieknomenclatuur en het gemeenschappelijk douanetarief (PbEG 1987, L 256), zoals deze luidde op
      1 januari 2018.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel2
  - number: '2.2'
    text: |-
      Bij regeling van Onze Minister kunnen de GN-codes, genoemd in deze wet en de daarop berustende bepalingen worden
      aangepast indien de overeenkomstige GN-codes zoals opgenomen in Richtlijn 2003/96/EG van de Raad van 27 oktober
      2003 tot herstructurering van de communautaire regeling voor de belasting van energieproducten en elektriciteit
      (PbEU 2003, L 283), in overeenstemming met artikel 2, vijfde lid, van die richtlijn zijn aangepast. In dat
      geval kan bij regeling van Onze Minister eveneens de laatstgenoemde datum in het eerste lid, onderdeel c, worden
      vervangen door de datum van de versie van de in dat onderdeel bedoelde verordening die aan de wijziging van de GN-
      codes ten grondslag heeft gelegen.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel2
  - number: '12.1'
    text: 'Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel12
  - number: 12.1.a
    text: |-
      leidingwater: water dat door een drinkwaterbedrijf of een afzonderlijke watervoorziening aan derden ter beschikking
      wordt gesteld, al dan niet van drinkwaterkwaliteit;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel12
  - number: 12.1.b
    text: |-
      drinkwaterbedrijf: drinkwaterbedrijf als bedoeld in [artikel 1, eerste lid, van de Drinkwaterwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel1
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0026338
        artikel: '1'
  - number: 12.1.c
    text: |-
      afzonderlijke watervoorziening: landgebonden voorziening, niet zijnde een drinkwaterbedrijf, voor de winning of
      behandeling van water dat met behulp van een distributienet als leidingwater ter beschikking wordt gesteld;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel12
  - number: 12.1.d
    text: |-
      aansluiting: een aansluiting van een in Nederland gelegen onroerende zaak als bedoeld in
      [artikel 16, onderdelen a tot en met e, van de Wet waardering onroerende zaken][ref1], op het distributienet van
      een drinkwaterbedrijf of van een afzonderlijke watervoorziening, waaruit leidingwater aan de verbruiker wordt
      geleverd; een aansluiting kan bestaan uit een of meer leveringspunten;


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel16
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '16'
  - number: 12.1.e
    text: |-
      particuliere installatie voor centrale watervoorziening: installatie voor
      de levering van water aan meer dan een onroerende zaak als bedoeld in
      [artikel 16, onderdelen a tot en met e, van de Wet waardering onroerende zaken][ref1], welke installatie permanent
      is aangesloten op het distributienet van een drinkwaterbedrijf of van een afzonderlijke watervoorziening;


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel16
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '16'
  - number: 12.1.f
    text: 'verbruiksperiode:'
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel12
  - number: 12.1.f.1°
    text: |-
      in gevallen waarin een voorschotnota wordt uitgereikt of, indien geen voorschotnota wordt uitgereikt, een
      voorschotbedrag wordt ontvangen: tijdvak waarop de eindfactuur betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel12
  - number: 12.1.f.2°
    text: 'in overige gevallen: kalenderjaar;'
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel12
  - number: 12.1.g
    text: |-
      eindfactuur: definitieve factuur waarin verrekening plaatsvindt met de voorschotnota’s of voorschotbedragen die
      betrekking hebben op het tijdvak waarop de factuur ziet;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel12
  - number: 12.1.h
    text: |-
      verbruiker: degene die, anders dan in de hoedanigheid van drinkwaterbedrijf of afzonderlijke watervoorziening,
      leidingwater verkrijgt van een drinkwaterbedrijf of afzonderlijke watervoorziening.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel12
  - number: '12.2'
    text: 'In afwijking van het eerste lid, onderdeel f, onder 2°, is de verbruiksperiode in de aldaar bedoelde gevallen:'
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel12
  - number: 12.2.a
    text: |-
      ingeval de overeenkomst tot levering in de loop van het kalenderjaar aanvangt: het gedeelte van het kalenderjaar
      vanaf het tijdstip waarop de overeenkomst tot levering aanvangt;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel12
  - number: 12.2.b
    text: |-
      ingeval de overeenkomst tot levering in de loop van het kalenderjaar wordt beëindigd: het gedeelte van het
      kalenderjaar tot het tijdstip waarop de overeenkomst tot levering eindigt.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel12
  - number: '13'
    text: Onder de naam belasting op leidingwater wordt een belasting geheven op leidingwater.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel13
  - number: '14.1'
    text: |-
      De belasting wordt geheven ter zake van de levering van leidingwater via een aansluiting aan de verbruiker,
      met dien verstande dat de belasting wordt geheven over een hoeveelheid van maximaal 300 kubieke meter per
      verbruiksperiode van twaalf maanden per aansluiting. Bij een verbruiksperiode korter dan wel langer dan twaalf
      maanden wordt de hoeveelheidsgrens, genoemd in de eerste volzin, naar evenredigheid verlaagd, onderscheidenlijk
      verhoogd.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel14
  - number: '14.2'
    text: |-
      Als een levering als bedoeld in het eerste lid wordt niet aangemerkt de levering van leidingwater via een
      aansluiting op het distributienet van een afzonderlijke watervoorziening, tenzij degene die de levering verricht
      leidingwater levert via in totaal ten minste 1000 aansluitingen. Bij ministeriële regeling worden nadere regels
      gesteld voor vaststelling van het aantal aansluitingen dat bij toepassing van de eerste volzin in aanmerking wordt
      genomen, in het geval dat het water wordt geleverd aan een particuliere installatie voor centrale watervoorziening.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel14
  - number: '14.3'
    text: |-
      Bij de levering van leidingwater aan een particuliere installatie voor centrale watervoorziening wordt, in
      afwijking in zoverre van het eerste lid, de belasting geheven over de totale hoeveelheid geleverd water, met
      dien verstande dat, indien de exploitant van de installatie aan degene die het leidingwater heeft geleverd
      een verklaring heeft overgelegd waarin opgaaf wordt gedaan van het aantal onroerende zaken als bedoeld in
      [artikel 16, onderdelen a tot en met e, van de Wet waardering onroerende zaken][ref1] dat door de installatie van
      water wordt voorzien, ten hoogste wordt geheven over een hoeveelheid van 300 kubieke meter vermenigvuldigd met
      dat aantal.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel16
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '16'
  - number: '14.4'
    text: Bij regeling van Onze Minister worden nadere regels gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel14
  - number: '15'
    text: De belasting wordt geheven van degene die de levering verricht.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel15
  - number: '16.1'
    text: De belasting wordt geheven per eenheid leidingwater, gemeten in kubieke meter.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel16
  - number: '16.2'
    text: |-
      Ingeval de hoeveelheid geleverd leidingwater niet in kubieke meter bekend is, wordt de belasting geheven over een
      hoeveelheid die wordt berekend door het bedrag dat ter zake van de levering van water in rekening wordt gebracht,
      te verminderen met het vastrecht dat door de leverancier aan huishoudelijke verbruikers in rekening wordt gebracht
      indien wel een meter aanwezig is, en de uitkomst te delen door de prijs per kubieke meter die de leverancier in
      rekening brengt aan die verbruikers.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel16
  - number: '17.1'
    text: 'De belasting wordt verschuldigd:'
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel17
  - number: 17.1.a
    text: |-
      in gevallen waarin een voorschotnota wordt uitgereikt of, indien geen voorschotnota wordt uitgereikt, een
      voorschotbedrag wordt ontvangen:
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel17
  - number: 17.1.a.1°
    text: |-
      op het tijdstip waarop een voorschotnota wordt uitgereikt onderscheidenlijk een voorschotbedrag wordt ontvangen;
      alsmede
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel17
  - number: 17.1.a.2°
    text: op het tijdstip van de uitreiking van de eindfactuur over een verbruiksperiode;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel17
  - number: 17.1.b
    text: |-
      in gevallen waarin geen voorschotnota wordt uitgereikt en geen voorschotbedrag wordt ontvangen, op het tijdstip van
      de uitreiking van de factuur;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel17
  - number: 17.1.c
    text: in overige gevallen op het tijdstip waarop de levering plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel17
  - number: '17.2'
    text: |-
      Voor de toepassing van het eerste lid, onderdeel a, onder 1°, in samenhang met [artikel 14, eerste lid][ref1],
      wordt de hoeveelheid leidingwater, waarop de voorschotnota dan wel het voorschotbedrag is gebaseerd, aangemerkt als
      geleverde hoeveelheid.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel14
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '14'
        hoofdstuk: III
        afdeling: '2'
  - number: '17.3'
    text: |-
      In gevallen waarin per verbruiksperiode van twaalf maanden meer dan 300 kubieke meter leidingwater via een
      aansluiting aan een verbruiker wordt geleverd en ter zake van die levering voorschotnota’s worden uitgereikt
      of voorschotbedragen worden ontvangen, wordt bij de berekening van de op de verbruiksperiode betrekking
      hebbende voorschotbedragen naar evenredigheid rekening gehouden met de belasting die overeenkomstig
      [artikel 14, eerste lid][ref1], ter zake van de hoeveelheid van 300 kubieke meter is verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel14
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '14'
        hoofdstuk: III
        afdeling: '2'
  - number: '17.4'
    text: |-
      Indien de verrekening, bedoeld in [artikel 12, eerste lid, onderdeel g][ref1], leidt tot een lager bedrag dan over
      de verbruiksperiode aan belasting is voldaan, wordt het verschil in mindering gebracht op de aangifte over het
      tijdvak waarin de eindfactuur is uitgereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel12
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '12'
        hoofdstuk: III
        afdeling: '1'
  - number: '18'
    text: Het tarief bedraagt € 0,354 per kubieke meter leidingwater.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel18
  - number: 18a
    text: |-
      In de gevallen, bedoeld in [artikel 12, tweede lid, onderdeel b][ref1], wordt de belasting ter zake van
      de leveringen die vanaf het begin van het kalenderjaar zijn verricht, herrekend met inachtneming van
      [artikel 14, eerste lid, tweede volzin][ref2]. Indien deze herrekening leidt tot een hoger of lager belastingbedrag
      dan de belasting die zonder de herrekening over de gehele verbruiksperiode verschuldigd zou zijn, wordt
      de belasting die moet worden voldaan over het tijdvak waarin de overeenkomst tot levering wordt beëindigd
      dienovereenkomstig verhoogd onderscheidenlijk verlaagd. Bij de bepaling van de belasting die op de laatste factuur
      aan de verbruiker wordt vermeld, wordt de verhoging of verlaging, bedoeld in de tweede volzin, in aanmerking
      genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel14
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '12'
        hoofdstuk: III
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0007168
        artikel: '14'
        hoofdstuk: III
        afdeling: '2'
  - number: '19'
    text: |-
      Vrijstelling van de belasting wordt verleend ter zake van de levering van leidingwater door middel van
      noodvoorzieningen, waaronder worden verstaan brandkranen, sprinklerinstallaties en dergelijke, indien deze
      uitsluitend worden gebruikt in buitengewone omstandigheden.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel19
  - number: '20.1'
    text: |-
      Op verzoek wordt teruggaaf van de belasting verleend voor zover de belasting over de hoeveelheden leidingwater
      die door een verbruiker gedurende dezelfde periode binnen een kalenderjaar van verschillende leveranciers zijn
      betrokken, hoger is dan de belasting die zou zijn verschuldigd indien sprake was van één leverancier.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel20
  - number: '20.2'
    text: De teruggaaf, bedoeld in het eerste lid, wordt verleend aan de verbruiker.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel20
  - number: '20.3'
    text: |-
      Bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur worden regels gesteld met
      betrekking tot de indiening van het verzoek en de wijze waarop kan worden aangetoond dat aan de voorwaarden voor
      teruggaaf wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel20
  - number: '20.4'
    text: Bij regeling van Onze Minister worden nadere regels gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel20
  - number: '21.1'
    text: |-
      De in [artikel 15][ref1] bedoelde belastingplichtige voert een administratie waaruit duidelijk alle gegevens
      blijken die voor de heffing van de belasting van belang kunnen zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel15
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '15'
        hoofdstuk: III
        afdeling: '2'
  - number: '21.2'
    text: |-
      Bij regeling van Onze Minister worden nadere regels gesteld omtrent de wijze waarop aan de in het eerste lid
      bedoelde verplichting wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel21
  - number: '22.1'
    text: |-
      Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder: - *afvalstoffen:*
      afvalstoffen als bedoeld in de [Wet milieubeheer][ref1], en zeer laag radioactief afval;
        - *zeer laag radioactief afval:* radioactieve afvalstoffen van natuurlijke bronnen van ioniserende straling,
      waarin de activiteit van de betrokken natuurlijke bronnen op enig moment gelijk is aan of hoger is dan de in
      [bijlage 1, tabel 1, van het Besluit stralingsbescherming][ref2] vermelde waarde, en de activiteitsconcentratie
      van de betrokken natuurlijke bronnen gelijk is aan of hoger is dan de in bijlage 1, tabel 1, van het Besluit
      stralingsbescherming vermelde waarde en lager is dan tien maal die waarde;
        - *verwijderen:* storten of verbranden van afvalstoffen;
        - *nuttige toepassing:* nuttige toepassing als bedoeld in de [Wet milieubeheer][ref3];
        - *storten:* storten als bedoeld in de [Wet milieubeheer][ref4];
        - *inrichting:* 1°. inrichting als bedoeld in de [Wet milieubeheer][ref5], werken daaronder niet begrepen, waarin
      afvalstoffen worden gestort; 2°. inrichting als bedoeld in de [Wet milieubeheer][ref6] waarin blijkens een op grond
      van de [Wet algemene bepalingen omgevingsrecht][ref7] afgegeven omgevingsvergunning huishoudelijke afvalstoffen,
      gemengde bedrijfsafvalstoffen of gemengd sorteerresidu mogen, onderscheidenlijk mag, worden verbrand;
        - *baggerspecie:* 1°. materiaal dat is vrijgekomen uit de bodem of oever van een oppervlaktewaterlichaam en dat
      bestaat uit minerale delen met een maximale korrelgrootte van 2 millimeter en organische stof in een verhouding en
      met een structuur zoals deze in de bodem van nature worden aangetroffen, alsmede van nature in de bodem voorkomende
      schelpen en grind met een korrelgrootte van 2 tot 63 millimeter; 2°. sediment en het residu van de reiniging van
      baggerspecie;
        - *stoffen:* stoffen als bedoeld in de [Wet milieubeheer][ref8];
        - *preparaat:* een mengsel als bedoeld in [artikel 1.1 van de Wet milieubeheer][ref9];
        - *percolaat:* vloeistof die uit gestorte afvalstoffen komt of daarmee in contact is geweest;
        - *stortgas:* gas dat uit gestorte afvalstoffen vrijkomt als gevolg van biologische afbraakreacties;
        - *EVOA:* Verordening (EG) nr. 1013/2006 van het Europees parlement en de Raad van 14 juni 2006 betreffende de
      overbrenging van afvalstoffen (PbEU 2006, L 190);
        - *overbrenging:* overbrenging in de zin van de EVOA;
        - *zuiveringsslib:* bezinksel dat overblijft na het biologisch zuiveren van afvalwater van huishoudens en bedrijven
      in een rioolwaterzuiveringsinstallatie.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
      [ref2]: https://wetten.overheid.nl/BWBR0012702
      [ref3]: https://wetten.overheid.nl/BWBR0003245
      [ref4]: https://wetten.overheid.nl/BWBR0003245
      [ref5]: https://wetten.overheid.nl/BWBR0003245
      [ref6]: https://wetten.overheid.nl/BWBR0003245
      [ref7]: https://wetten.overheid.nl/BWBR0024779
      [ref8]: https://wetten.overheid.nl/BWBR0003245
      [ref9]: https://wetten.overheid.nl/BWBR0003245#Artikel1
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003245
      - id: ref2
        bwb_id: BWBR0012702
      - id: ref3
        bwb_id: BWBR0003245
      - id: ref4
        bwb_id: BWBR0003245
      - id: ref5
        bwb_id: BWBR0003245
      - id: ref6
        bwb_id: BWBR0003245
      - id: ref7
        bwb_id: BWBR0024779
      - id: ref8
        bwb_id: BWBR0003245
      - id: ref9
        bwb_id: BWBR0003245
        artikel: '1'
  - number: '22.2'
    text: |-
      Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen worden niet tot afvalstoffen gerekend
      die stoffen, preparaten en voorwerpen, die voldoen aan de voorwaarden van bij algemene maatregel van bestuur
      opgesomde besluiten en regelingen volgens welke deze stoffen, preparaten en voorwerpen buiten inrichtingen met
      een stortplaats milieuhygiënisch verantwoord zijn toe te passen, dan wel bestemd zijn te worden gebruikt voor bij
      algemene maatregel van bestuur aan te wijzen toepassingen die hetzij verband houden met de bedrijfsvoering van de
      inrichting, hetzij deel uitmaken van het bedrijfsproces dat leidt tot de nuttige toepassing of verwijdering van
      afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel22
  - number: '23.1'
    text: 'Onder de naam afvalstoffenbelasting wordt een belasting geheven ter zake van:'
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel23
  - number: 23.1.a
    text: de afgifte ter verwijdering van afvalstoffen aan een inrichting;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel23
  - number: 23.1.b
    text: de verwijdering van afvalstoffen binnen de inrichting waarin deze zijn ontstaan;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel23
  - number: 23.1.c
    text: |-
      de overbrenging van afvalstoffen uit Nederland om deze buiten Nederland te verwijderen of te laten verwijderen
      met toepassing van een ingevolge de EVOA bij beschikking verleende toestemming tot overbrenging, met uitzondering
      van afvalstoffen waarvan uit boeken en bescheiden blijkt dat zij naar Nederland zijn overgebracht in de zin van
      de EVOA.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel23
  - number: '23.2'
    text: |-
      De aan een inrichting afgegeven afvalstoffen en de uit Nederland overgebrachte afvalstoffen worden geacht alle ter
      verwijdering te zijn afgegeven, onderscheidenlijk overgebracht.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel23
  - number: '23.3'
    text: |-
      De uitzondering voor afvalstoffen die naar Nederland zijn overgebracht, bedoeld in het eerste lid, onderdeel c,
      geldt niet voor afvalstoffen die in Nederland zijn ontstaan of zijn vermengd met afvalstoffen die in Nederland
      zijn ontstaan.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel23
  - number: '23.4'
    text: |-
      Het eerste lid, onderdeel b, is niet van toepassing op de verwijdering van verbrandingsresten binnen de inrichting
      waarin deze zijn ontstaan, voor zover die verbrandingsresten zijn ontstaan door het verbranden van aan die
      inrichting ter verwijdering afgegeven afvalstoffen ter zake waarvan afvalstoffenbelasting is geheven.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel23
  - number: '23.5'
    text: Bij regeling van Onze Minister kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel23
  - number: '24'
    text: 'De belasting wordt geheven:'
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel24
  - number: 24.a
    text: |-
      bij toepassing van [artikel 23, eerste lid, onderdelen a en b][ref1]: van de houder van de inrichting;


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel23
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '23'
        hoofdstuk: IV
        afdeling: '2'
  - number: 24.b
    text: |-
      bij toepassing van [artikel 23, eerste lid, onderdeel c][ref1]: van de kennisgever, bedoeld in artikel 2,
      vijftiende lid, van de EVOA, aan wie de toestemming is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel23
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '23'
        hoofdstuk: IV
        afdeling: '2'
  - number: '25.1'
    text: 'De belasting wordt berekend:'
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel25
  - number: 25.1.a
    text: |-
      bij toepassing van [artikel 23, eerste lid, onderdelen a en b][ref1]: over het gewicht van de afvalstoffen die ter
      verwijdering worden afgegeven, onderscheidenlijk worden verwijderd binnen de inrichting waarin deze zijn ontstaan,
      gemeten in kilogrammen;


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel23
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '23'
        hoofdstuk: IV
        afdeling: '2'
  - number: 25.1.b
    text: |-
      bij toepassing van [artikel 23, eerste lid, onderdeel c][ref1]: over het gewicht van de afvalstoffen die uit
      Nederland worden overgebracht ter verwijdering buiten Nederland, gemeten in kilogrammen.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel23
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '23'
        hoofdstuk: IV
        afdeling: '2'
  - number: '25.2'
    text: |-
      Wanneer de afvalstoffen, bedoeld in het eerste lid, onderdeel b, in het buitenland op een zodanige wijze zijn
      gestort of verbrand dat bij een vergelijkbare verwerking in Nederland een lager belastingbedrag verschuldigd
      zou zijn, wordt ook voor de heffing ten aanzien van de uit Nederland overgebrachte afvalstoffen dit lagere
      belastingbedrag in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel25
  - number: '25.3'
    text: |-
      Het gewicht van de uit Nederland overgebrachte afvalstoffen, bedoeld in het eerste lid, onderdeel b,
      alsmede, indien van toepassing, de wijze van verwerking in het buitenland, bedoeld in het tweede lid, blijkt
      uit een beschikking van Onze Minister van Infrastructuur en Waterstaat. [Artikel 1, derde lid][ref1], en
      [hoofdstuk V van de Algemene wet inzake rijksbelastingen][ref2] zijn niet van toepassing met betrekking tot deze
      beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002320#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002320
        hoofdstuk: V
  - number: '25.4'
    text: |-
      Bij regeling van Onze Ministers kunnen regels worden gesteld omtrent de wijze waarop het gewicht van de
      afvalstoffen wordt bepaald.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel25
  - number: 25a.1
    text: |-
      De kennisgever, bedoeld in [artikel 24, onderdeel b][ref1], dient de aanvraag tot het geven van de beschikking,
      bedoeld in [artikel 25, derde lid][ref2], in bij Onze Minister van Infrastructuur en Waterstaat. Zodra de
      kennisgever constateert dat gegevens in de aanvraag onjuist of onvolledig zijn meldt hij dit onverwijld aan Onze
      Minister van Infrastructuur en Waterstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel25
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '24'
        hoofdstuk: IV
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0007168
        artikel: '25'
        hoofdstuk: IV
        afdeling: '3'
  - number: 25a.2
    text: |-
      De kennisgever dient de aanvraag in binnen vier weken nadat de verklaring, bedoeld in artikel 16, onderdeel e,
      EVOA, is ontvangen, dan wel ontvangen had moeten zijn, voor alle afvalstoffen die zijn overgebracht uit Nederland
      met toepassing van de toestemming, bedoeld in [artikel 23, eerste lid, onderdeel c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel23
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '23'
        hoofdstuk: IV
        afdeling: '2'
  - number: 25a.3
    text: |-
      Onze Minister van Infrastructuur en Waterstaat trekt de beschikking, bedoeld in [artikel 25, derde lid][ref1],
      in indien na afgifte van de beschikking blijkt dat de in de aanvraag of de beschikking vermelde gegevens zodanig
      onjuist of onvolledig zijn, dat het gewicht, bedoeld in artikel 25, eerste lid, onderdeel b of de wijze van
      verwerking in het buitenland, bedoeld in artikel 25, tweede lid, niet juist kan worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel25
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '25'
        hoofdstuk: IV
        afdeling: '3'
  - number: 25a.4
    text: |-
      Onze Minister van Infrastructuur en Waterstaat geeft de beschikking, bedoeld in [artikel 25, derde lid][ref1],
      ambtshalve af indien:


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel25
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '25'
        hoofdstuk: IV
        afdeling: '3'
  - number: 25a.4.a
    text: de aanvraag niet binnen de termijn, genoemd in het tweede lid, is ontvangen; dan wel
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel25a
  - number: 25a.4.b
    text: de beschikking op grond van het derde lid is ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel25a
  - number: 25a.5
    text: |-
      Onze Minister van Infrastructuur en Waterstaat verstrekt de gegevens van de beschikking, bedoeld in
      [artikel 25, derde lid][ref1], aan de inspecteur ten behoeve van de belastingheffing.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel25
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '25'
        hoofdstuk: IV
        afdeling: '3'
  - number: 25a.6
    text: |-
      Bij of krachtens op voordracht van Onze Ministers vast te stellen algemene maatregel van bestuur worden regels
      gesteld omtrent:
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel25a
  - number: 25a.6.a
    text: |-
      de wijze van indiening van de aanvraag, bedoeld in het eerste lid, waarbij in afwijking van de
      [artikelen 2:14, eerste lid][ref1], en [2:15 van de Algemene wet bestuursrecht][ref2] kan worden bepaald dat de
      aanvraag geheel of gedeeltelijk elektronisch wordt ingediend of in ontvangst wordt genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel2
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '2'
  - number: 25a.6.b
    text: de gegevens die de kennisgever verstrekt bij de aanvraag, bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel25a
  - number: 25a.6.c
    text: de wijze waarop de kennisgever gehouden is zijn administratie te voeren;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel25a
  - number: 25a.6.d
    text: |-
      de inhoud en het afgeven van de beschikking, bedoeld in [artikel 25, derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel25
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '25'
        hoofdstuk: IV
        afdeling: '3'
  - number: 25a.6.e
    text: de wijze waarop de melding, genoemd in het eerste lid, tweede zin, wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel25a
  - number: 25a.7
    text: |-
      Met het toezicht op de naleving van de bij of krachtens het zesde lid, onderdeel c, gestelde regels zijn belast de
      bij besluit van Onze Minister van Infrastructuur en Waterstaat aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel25a
  - number: 25a.8
    text: Van een besluit als bedoeld in het zevende lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel25a
  - number: 25a.9
    text: |-
      In geval van overtreding van de bij of krachtens het zesde lid, onderdeel c, gestelde regels kan Onze Minister van
      Infrastructuur en Waterstaat een last onder dwangsom opleggen.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel25a
  - number: 25a.10
    text: Bij regeling van Onze Ministers kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel25a
  - number: '26'
    text: 'De belasting wordt verschuldigd op het tijdstip waarop:'
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel26
  - number: 26.a
    text: de afvalstoffen ter verwijdering worden afgegeven; dan wel
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel26
  - number: 26.b
    text: de afvalstoffen binnen de inrichting waarin deze afvalstoffen zijn ontstaan, worden verwijderd; dan wel
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel26
  - number: 26.c
    text: |-
      de geldigheidsduur van de beschikking, houdende toestemming tot overbrenging, is verlopen, en zes kalendermaanden
      zijn verstreken sinds de maand waarin de verklaring, bedoeld in artikel 16, onderdeel e, van de EVOA, is ontvangen,
      dan wel ontvangen had moeten zijn, voor alle afvalstoffen die met toepassing van de toestemming zijn overgebracht
      uit Nederland.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel26
  - number: '27.1'
    text: |-
      Op de ingevolge [artikel 23, eerste lid, onderdeel a of b][ref1], verschuldigde belasting wordt in mindering
      gebracht de belasting ter zake van stoffen, preparaten of voorwerpen die de inrichting, al dan niet na nuttige
      toepassing, hebben verlaten, met dien verstande dat de vermindering niet wordt toegepast ter zake van percolaat
      of stortgas.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel23
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '23'
        hoofdstuk: IV
        afdeling: '2'
  - number: '27.2'
    text: 'Het eerste lid is slechts van toepassing voor zover uit boeken en bescheiden blijkt:'
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel27
  - number: 27.2.a
    text: |-
      dat de stoffen, preparaten en voorwerpen niet op enig moment in het voor stort bestemde gedeelte van de inrichting
      op of in de bodem zijn gebracht en zich niet langer dan drie jaar binnen de inrichting hebben bevonden;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel27
  - number: 27.2.b
    text: hoeveel belasting ter zake van de stoffen, preparaten en voorwerpen geheven is.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel27
  - number: '27.3'
    text: |-
      Indien bij de afgifte van een afzonderlijke, duidelijk herkenbare afvalstoffenstroom aan een inrichting bekend is
      dat deze niet uitsluitend bestaat uit voor verwijdering bestemde afvalstoffen, kan de inspecteur op schriftelijk
      verzoek van de belastingplichtige toestaan dat voor de berekening van de verschuldigde belasting met betrekking tot
      die afvalstroom de totale hoeveelheid afgegeven afvalstoffen door toepassing van een verhoudingsgetal wordt herleid
      tot de hoeveelheid voor verwijdering afgegeven afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel27
  - number: '27.4'
    text: |-
      Het in het derde lid bedoelde verhoudingsgetal wordt gebaseerd op de gegevens uit het voorafgaande tijdvak. Na
      afloop van het kalenderjaar vindt herrekening plaats op de voet van het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel27
  - number: '27.5'
    text: |-
      Bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur kunnen voorwaarden en
      beperkingen worden gesteld waaronder de in het eerste lid bedoelde vermindering van belasting en het in het derde
      lid bedoelde verhoudingsgetal worden toegepast.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel27
  - number: '27.6'
    text: Bij regeling van Onze Minister kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel27
  - number: 27a.1
    text: |-
      Op de ingevolge [artikel 23, eerste lid, onderdeel a of b][ref1], verschuldigde belasting wordt in mindering
      gebracht de belasting ter zake van stoffen, preparaten of voorwerpen die in de inrichting in een zodanige staat
      zijn gebracht, dat deze op grond van [artikel 22, tweede lid][ref2], niet langer tot afvalstoffen worden gerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel2
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '23'
        hoofdstuk: IV
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0007168
        artikel: '2'
        hoofdstuk: I
  - number: 27a.2
    text: |-
      Het eerste lid is slechts van toepassing voor zover uit boeken en bescheiden blijkt dat ten aanzien van de
      stoffen, preparaten en voorwerpen wordt voldaan aan de voorwaarden en beperkingen, gesteld bij of krachtens
      [artikel 22, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel2
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '2'
        hoofdstuk: I
  - number: 27a.3
    text: |-
      [Artikel 27, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel2
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '2'
        hoofdstuk: I
  - number: 27a.4
    text: |-
      Bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur kunnen voorwaarden en
      beperkingen worden gesteld waaronder de in het eerste lid bedoelde vermindering wordt toegepast.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel27a
  - number: 27a.5
    text: Bij regeling van Onze Minister kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel27a
  - number: '28.1'
    text: 'Het tarief bedraagt in geval van:'
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel28
  - number: 28.1.a
    text: 'het storten van afvalstoffen: € 33,15 per 1.000 kilogram;'
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel28
  - number: 28.1.b
    text: 'het verbranden van afvalstoffen in andere gevallen dan als bedoeld onder c: € 33,15 per 1.000 kilogram;'
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel28
  - number: 28.1.c
    text: |-
      het verbranden van afvalstoffen in een installatie waarin op grond van bij of krachtens de [Wet milieubeheer][ref1]
      of de [Wet algemene bepalingen omgevingsrecht][ref2] gestelde voorschriften, dan wel een op grond van
      laatstgenoemde wet afgegeven omgevingsvergunning, geen huishoudelijke afvalstoffen, gemengde bedrijfsafvalstoffen
      en gemengd sorteerresidu mogen worden verbrand: nihil;


      [ref1]: https://wetten.overheid.nl/BWBR0003245
      [ref2]: https://wetten.overheid.nl/BWBR0024779
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0003245
      - id: ref2
        bwb_id: BWBR0024779
  - number: 28.1.d
    text: 'de overbrenging van afvalstoffen: € 33,15 per 1.000 kilogram.'
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel28
  - number: '28.2'
    text: |-
      Bij toepassing van [artikel 23, eerste lid, onderdeel c][ref1], wordt voor de gehele periode van overbrenging het
      laagste tarief toegepast dat gedurende deze periode op enig moment geldt ingevolge het eerste lid, onderdeel d. De
      periode van overbrenging vangt aan op het tijdstip van aanvang van de eerste fysieke overbrenging met toepassing
      van de toestemming, bedoeld in artikel 23, eerste lid, onderdeel c, en eindigt op het tijdstip van de aanvang van
      de laatste fysieke overbrenging met toepassing van die toestemming.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel23
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '23'
        hoofdstuk: IV
        afdeling: '2'
  - number: '28.3'
    text: |-
      Bij regeling van Onze Ministers kunnen nadere regels worden gesteld ten behoeve van de uitvoering van het bepaalde
      bij het tweede lid.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel28
  - number: '28.4'
    text: |-
      Bij regeling van Onze Minister kan worden bepaald dat het tarief voor het storten van afvalstoffen die ter
      verwijdering worden afgegeven in partijen die uitsluitend of nagenoeg uitsluitend bestaan uit door bij die regeling
      vast te stellen categorieën van gevaarlijke afvalstoffen, wordt vastgesteld tot een verlaagd percentage van het
      tarief, bedoeld in het eerste lid, onderdeel a, dan wel tot nihil.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel28
  - number: '29.1'
    text: Vrijgesteld is de afgifte ter verwijdering of overbrenging ter verwijdering van baggerspecie.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel29
  - number: '29.2'
    text: |-
      Indien baggerspecie ter verwijdering wordt afgegeven aan inrichtingen waar op grond van de voor die inrichting
      geldende omgevingsvergunning voor een inrichting als bedoeld in de [Wet milieubeheer][ref1], ook andere
      afvalstoffen dan baggerspecie mogen worden gestort, wordt door de aanbieder van de baggerspecie aan de houder van
      de inrichting een verklaring overgelegd waaruit blijkt dat sprake is van baggerspecie.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: '29.3'
    text: De in het tweede lid bedoelde verklaring wordt verstrekt door Onze Minister van Infrastructuur en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel29
  - number: 29a
    text: |-
      Onder bij of krachtens op de voordracht van Onze Minister bij algemene maatregel van bestuur te stellen voorwaarden
      en beperkingen is vrijgesteld de afgifte ter verwijdering aan een inrichting van zuiveringsslib dat is bestemd om
      binnen die inrichting te worden verbrand.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel29a
  - number: 29b.1
    text: |-
      Vrijgesteld is de afgifte ter verwijdering of overbrenging ter verwijdering van afzonderlijk aangeboden asbest en
      asbesthoudende producten die toegepast zijn geweest als dakbedekking.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel29b
  - number: 29b.2
    text: |-
      Bij of krachtens op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur worden voorwaarden
      en beperkingen gesteld waaronder de vrijstelling, bedoeld in het eerste lid, wordt verleend.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel29b
  - number: '30.1'
    text: |-
      Op verzoek wordt teruggaaf verleend van belasting ter zake van afvalstoffen die afkomstig
      zijn van een overtreder jegens wie krachtens [artikel 18.2 van de Wet milieubeheer][ref1] of
      [artikel 5.2 van de Wet algemene bepalingen omgevingsrecht][ref2] bestuursdwang is toegepast, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel5
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '5'
  - number: 30.1.a
    text: |-
      de afvalstoffen ter verwijdering aan een inrichting zijn afgegeven door of vanwege het bevoegd gezag van een
      provincie of van een gemeente;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel30
  - number: 30.1.b
    text: de afvalstoffenbelasting door de houder van de inrichting bij de provincie of de gemeente in rekening is gebracht;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel30
  - number: 30.1.c
    text: de afvalstoffen gescheiden van andere afvalstoffen zijn afgegeven aan de inrichting; en
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel30
  - number: 30.1.d
    text: |-
      de kosten die verband houden met de toepassing van bestuursdwang, hieronder begrepen de stortkosten, de
      verschuldigde afvalstoffenbelasting en de overige kosten die direct met de verwijdering van de afvalstoffen verband
      houden, niet of niet geheel verhaald kunnen worden op de overtreder.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel30
  - number: '30.2'
    text: De teruggaaf wordt verleend aan de provincie of de gemeente, die de afvalstoffen ter verwijdering heeft afgegeven.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel30
  - number: '30.3'
    text: |-
      De teruggaaf bedraagt maximaal de betaalde afvalstoffenbelasting die naar evenredigheid is toe te rekenen aan het
      deel van de totale kosten van de toepassing van bestuursdwang dat niet verhaald kan worden op de overtreder.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel30
  - number: '31.1'
    text: |-
      De belastingplichtige is gehouden een administratie te voeren zodanig dat daaruit te allen tijde duidelijk blijken
      de aard, de hoeveelheid en de herkomst van de afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel31
  - number: '31.2'
    text: |-
      De belastingplichtige, bedoeld in [artikel 24, onderdeel a][ref1], is gehouden de administratie zodanig in te
      richten dat daarin op overzichtelijke wijze is opgenomen welke stoffen, preparaten of voorwerpen als bedoeld in
      [artikel 22, tweede lid][ref2], in welke hoeveelheden en op welk tijdstip de inrichting zijn binnengebracht dan wel
      hebben verlaten.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel22
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '24'
        hoofdstuk: IV
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0007168
        artikel: '22'
        hoofdstuk: IV
        afdeling: '1'
  - number: '31.3'
    text: |-
      De belastingplichtige, bedoeld in [artikel 24, onderdeel b][ref1], is gehouden de administratie zodanig in te
      richten dat daarin per overbrenging op overzichtelijke wijze is opgenomen:


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel24
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '24'
        hoofdstuk: IV
        afdeling: '2'
  - number: 31.3.a
    text: |-
      op basis van welke beschikking, houdende toestemming tot overbrenging, de afvalstoffen zijn overgebracht uit
      Nederland;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel31
  - number: 31.3.b
    text: |-
      welke stoffen, preparaten en voorwerpen in welke hoeveelheden uit Nederland zijn overgebracht en op welk tijdstip
      het vervoer van de afvalstoffen in het kader van de overbrenging is aangevangen.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel31
  - number: 31a
    text: |-
      Met betrekking tot een toestemming tot overbrenging als bedoeld in [artikel 23, eerste lid, onderdeel c][ref1],
      die is verleend vóór 1 januari 2019, wordt de periode van overbrenging, bedoeld in [artikel 28, tweede lid][ref2],
      in afwijking van dat lid geacht aan te vangen op het tijdstip van de aanvang van de eerste fysieke overbrenging na
      31 december 2018 met toepassing van die toestemming.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel28
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel31a
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '23'
        hoofdstuk: IV
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0007168
        artikel: '28'
        hoofdstuk: IV
        afdeling: '4'
  - number: '32'
    text: 'Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel32
  - number: 32.a
    text: 'kolen: producten van de GN-codes 2701, 2702 en 2704;'
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel32
  - number: 32.b
    text: |-
      brandstof: stof – met inbegrip van alle daaraan toegevoegde stoffen – dienende voor de verbranding met het doel de
      daarbij ontstane energie te benutten;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel32
  - number: 32.c
    text: |-
      duaal gebruik: aanwenden van kolen zowel als verwarmingsbrandstof als voor andere doeleinden dan als motor- of
      verwarmingsbrandstof;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel32
  - number: 32.d
    text: 'vervaardigen van kolen: elk handelen waarbij of waardoor kolen ontstaan;'
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel32
  - number: 32.e
    text: |-
      inrichting: iedere plaats waar op grond van de bepalingen van dit hoofdstuk kolen onder schorsing van belasting
      mogen worden vervaardigd, mogen worden verwerkt, voorhanden mogen zijn, mogen worden ontvangen en mogen worden
      verzonden;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel32
  - number: 32.f
    text: |-
      een plaats voor tijdelijke opslag: een ruimte voor tijdelijke opslag of een andere plaats die is aangewezen of
      goedgekeurd voor de opslag van goederen in tijdelijke opslag als bedoeld in artikel 147, eerste lid, van het
      Douanewetboek van de Unie;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel32
  - number: 32.g
    text: 'lidstaat: lidstaat van de Europese Unie;'
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel32
  - number: 32.h
    text: |-
      derde land: elke staat of elk grondgebied waarop het Verdrag betreffende de werking van de Europese Unie niet van
      toepassing is;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel32
  - number: 32.i
    text: |-
      EU-douaneregeling: de bijzondere regelingen douanevervoer, douane-entrepot, tijdelijke invoer en actieve
      veredeling, bedoeld in artikel 210 van het Douanewetboek van de Unie, uitvoer als bedoeld in artikel 269 van dat
      wetboek en wederuitvoer als bedoeld in artikel 270 van dat wetboek;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel32
  - number: 32.j
    text: |-
      schorsing van belasting: stelsel waarin van kolen die worden vervaardigd, worden verwerkt, voorhanden zijn of
      worden vervoerd, op grond van de bepalingen van deze wet de belasting nog niet is geheven;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel32
  - number: 32.k
    text: |-
      ondernemer: ondernemer in de zin van [artikel 7 van de Wet op de omzetbelasting 1968][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel7
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '7'
  - number: 32.l
    text: 'uitslag: brengen van kolen buiten een plaats die voor kolen als inrichting is aangewezen;'
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel32
  - number: 32.m
    text: 'invoer: vanuit een derde land brengen van kolen in Nederland.'
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel32
  - number: '33.1'
    text: Als uitslag wordt mede aangemerkt het gebruik van kolen als brandstof binnen een inrichting.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel33
  - number: '33.2'
    text: 'Als uitslag wordt mede aangemerkt het voorhanden hebben van kolen waarvan de belasting niet is geheven, door:'
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel33
  - number: 33.2.a
    text: een ondernemer in het kader van zijn onderneming, anders dan in een inrichting;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel33
  - number: 33.2.b
    text: een publiekrechtelijk lichaam, anders dan als ondernemer;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel33
  - number: 33.2.c
    text: een natuurlijk persoon voor andere doeleinden dan voor persoonlijk gebruik.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel33
  - number: '33.3'
    text: |-
      Het tweede lid is, onder bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur te
      stellen voorwaarden, niet van toepassing met betrekking tot kolen die worden vervoerd naar:
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel33
  - number: 33.3.a
    text: een inrichting;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel33
  - number: 33.3.b
    text: een andere lidstaat via Nederland;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel33
  - number: 33.3.c
    text: een derde land.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel33
  - number: '33.4'
    text: |-
      Bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur worden nadere regels gesteld met
      betrekking tot de verplichtingen waaraan de in het tweede lid bedoelde personen of lichamen voor de toepassing van
      dit hoofdstuk moeten voldoen.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel33
  - number: '33.5'
    text: Bij regeling van Onze Minister kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel33
  - number: '34.1'
    text: 'Als uitslag wordt niet aangemerkt het brengen van kolen vanuit een inrichting naar:'
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel34
  - number: 34.1.a
    text: een andere inrichting;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel34
  - number: 34.1.b
    text: een ondernemer dan wel een publiekrechtelijk lichaam, anders dan als ondernemer, in een andere lidstaat;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel34
  - number: 34.1.c
    text: een derde land.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel34
  - number: '34.2'
    text: |-
      Als uitslag wordt niet aangemerkt het gebruik van kolen voor het vervaardigen van kolen, aardgas als bedoeld in
      [artikel 47, eerste lid, onderdeel m][ref1], producten die op grond van [artikel 48, tweede lid][ref2], als aardgas
      worden aangemerkt, of minerale oliën als bedoeld in [artikel 25 van de Wet op de accijns][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel48
      [ref3]: https://wetten.overheid.nl/BWBR0005251#Artikel25
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '47'
        hoofdstuk: VI
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0007168
        artikel: '48'
        hoofdstuk: VI
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005251
        artikel: '25'
  - number: '34.3'
    text: |-
      Bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur kunnen voorwaarden worden
      gesteld waaronder het eerste en tweede lid toepassing vinden.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel34
  - number: '34.4'
    text: Bij regeling van Onze Minister kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel34
  - number: '35.1'
    text: 'Als invoer wordt mede aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel35
  - number: 35.1.a
    text: |-
      het in Nederland beëindigen van een EU-douaneregeling waaronder kolen zijn geplaatst, anders dan door plaatsing
      onder een andere EU-douaneregeling;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel35
  - number: 35.1.b
    text: het in Nederland onttrekken van kolen aan een EU-douaneregeling;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel35
  - number: 35.1.c
    text: |-
      het eigen gebruik als brandstof in Nederland van kolen die onder een EU-douaneregeling zijn geplaatst of binnen een
      plaats voor tijdelijke opslag.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel35
  - number: '35.2'
    text: |-
      Als invoer wordt niet aangemerkt het, met inachtneming van bij op voordracht van Onze Minister vast te stellen
      algemene maatregel van bestuur te stellen voorwaarden:
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel35
  - number: 35.2.a
    text: brengen van kolen vanuit een derde land naar een inrichting of naar een plaats voor tijdelijke opslag;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel35
  - number: 35.2.b
    text: in Nederland plaatsen onder een EU-douaneregeling van vanuit een derde land binnengebrachte kolen;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel35
  - number: 35.2.c
    text: brengen van kolen die zijn geplaatst onder een EU-douaneregeling naar een inrichting;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel35
  - number: 35.2.d
    text: brengen van kolen vanuit een plaats voor tijdelijke opslag naar een inrichting;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel35
  - number: 35.2.e
    text: onder ambtelijk toezicht vernietigen van kolen die onder een EU-douaneregeling zijn geplaatst.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel35
  - number: '35.3'
    text: Bij regeling van Onze Minister kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel35
  - number: '36'
    text: Onder de naam kolenbelasting wordt een belasting geheven ter zake van de uitslag en de invoer van kolen.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel36
  - number: '37.1'
    text: Ter zake van uitslag wordt de belasting geheven van de vergunninghouder van de inrichting.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel37
  - number: '37.2'
    text: |-
      In afwijking van het eerste lid wordt de belasting bij toepassing van [artikel 33, tweede lid][ref1], geheven van
      degene die de kolen voorhanden heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel33
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '33'
        hoofdstuk: V
        afdeling: '1'
  - number: '38.1'
    text: Een plaats kan alleen als inrichting worden gebruikt indien daartoe een vergunning is verstrekt door de inspecteur.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel38
  - number: '38.2'
    text: 'Als inrichting kan worden aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel38
  - number: 38.2.a
    text: een plaats waar kolen worden vervaardigd;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel38
  - number: 38.2.b
    text: |-
      een plaats waar geen kolen worden vervaardigd maar die dient voor de opslag van kolen, indien de hoeveelheid kolen
      die gemiddeld over een jaar voorhanden is meer bedraagt dan een bij regeling van Onze Minister vast te stellen
      hoeveelheid.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel38
  - number: '39.1'
    text: Degene die een vergunning voor een inrichting wil verkrijgen, dient daartoe een verzoek in bij de inspecteur.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel39
  - number: '39.2'
    text: |-
      Bij regeling van Onze Minister worden nadere regels gesteld met betrekking tot de gegevens die het verzoek dient
      te bevatten.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel39
  - number: '39.3'
    text: |-
      In afwijking van [artikel 38, tweede lid][ref1], kan, indien degene die een vergunning voor een inrichting wil
      verkrijgen niet beschikt over een plaats waar kolen worden vervaardigd dan wel opgeslagen, een verzoek om een
      vergunning voor een inrichting door de inspecteur worden toegewezen, indien deze persoon in Nederland is gevestigd
      en in de uitoefening van zijn onderneming optreedt als:


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel38
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '38'
        hoofdstuk: V
        afdeling: '2'
  - number: 39.3.a
    text: handelaar in kolen, maar de door hem gekochte kolen niet zelf in opslag neemt, of
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel39
  - number: 39.3.b
    text: tussenpersoon die de kolen niet zelf in opslag neemt.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel39
  - number: '39.4'
    text: |-
      De [artikelen 43 tot en met 50 van de Wet op de accijns][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel43
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '43'
  - number: '40.1'
    text: Ter zake van uitslag wordt de belasting verschuldigd op het tijdstip van de uitslag.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel40
  - number: '40.2'
    text: |-
      In afwijking van het eerste lid wordt de belasting bij toepassing van [artikel 33, tweede lid][ref1], verschuldigd
      op het tijdstip van de aanvang van het voorhanden hebben van de kolen.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel33
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '33'
        hoofdstuk: V
        afdeling: '1'
  - number: '41'
    text: |-
      Ter zake van de belasting bij invoer zijn de wettelijke bepalingen, bedoeld in
      [artikel 1:1, eerste en tweede lid, van de Algemene douanewet][ref1], met uitzondering van artikel 88 van de
      Gedelegeerde Verordening Douanewetboek van de Unie, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '1'
  - number: '42'
    text: De belasting wordt berekend over het gewicht van de kolen, uitgedrukt in kilogram.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel42
  - number: '43'
    text: Het tarief bedraagt per 1000 kilogram kolen € 15,29.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel43
  - number: '44.1'
    text: |-
      Vrijstelling van de belasting wordt verleend ter zake van de uitslag en de invoer van kolen die worden gebruikt
      anders dan als brandstof.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel44
  - number: '44.2'
    text: |-
      Vrijstelling van de belasting wordt verleend ter zake van de uitslag en de invoer van kolen die worden gebruikt als
      brandstof voor het opwekken van elektriciteit.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel44
  - number: '44.3'
    text: |-
      Vrijstelling van de belasting wordt verleend ter zake van de uitslag en de invoer van kolen die duaal worden
      gebruikt.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel44
  - number: '44.4'
    text: |-
      Bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur worden voorwaarden en
      beperkingen gesteld waaronder de vrijstellingen, bedoeld in het eerste tot en met derde lid, worden verleend.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel44
  - number: '44.5'
    text: Bij regeling van Onze Minister worden nadere regels gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel44
  - number: '45.1'
    text: |-
      Op verzoek wordt teruggaaf van de belasting verleend met betrekking tot kolen die worden gebruikt op een in
      [artikel 44, eerste tot en met derde lid][ref1], bedoelde wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel44
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '44'
        hoofdstuk: V
        afdeling: '5'
  - number: '45.2'
    text: |-
      Op verzoek wordt teruggaaf van de belasting verleend met betrekking tot kolen die – anders dan vanuit een
      inrichting – zijn gebracht naar een andere lidstaat dan wel een derde land.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel45
  - number: '45.3'
    text: |-
      Bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur worden nadere regels gesteld met
      betrekking tot de indiening van het verzoek en de wijze waarop kan worden aangetoond dat aan de voorwaarden voor
      teruggaaf wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel45
  - number: '45.4'
    text: Bij regeling van Onze Minister kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel45
  - number: 45a
    text: |-
      De [artikelen 2, vijfde, zesde, zevende en tiende lid][ref1], en [83 van de Wet op de accijns][ref2] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel83
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel45a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: '83'
  - number: '46.1'
    text: |-
      De belastingplichtige voert een administratie waaruit, voor zover dat voor de heffing van belang kan zijn, de
      gegevens betreffende het vervaardigen, invoeren, uitslaan en gebruik van kolen duidelijk blijken.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel46
  - number: '46.2'
    text: |-
      Bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur kunnen, ter verzekering van de
      heffing van de belasting, regels worden gesteld met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel46
  - number: 46.2.a
    text: het vervoer van kolen;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel46
  - number: 46.2.b
    text: het leveren van kolen;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel46
  - number: 46.2.c
    text: het voorhanden hebben van kolen buiten een inrichting.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel46
  - number: '46.3'
    text: Het tweede lid is niet van toepassing op kolen die zijn geplaatst onder een EU-douaneregeling.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel46
  - number: '46.4'
    text: Bij regeling van Onze Minister kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel46
  - number: '47.1'
    text: 'Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel47
  - number: 47.1.a
    text: |-
      motorrijtuig: hetgeen ingevolge [artikel 1a, eerste lid, onderdeel p, van de Wet op de accijns][ref1] onder dit
      begrip wordt verstaan;


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel1a
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 1a
  - number: 47.1.b
    text: |-
      elektriciteitsbeurs: beurs als bedoeld in [artikel 86e van de Elektriciteitswet 1998][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel86e
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 86e
  - number: 47.1.c
    text: |-
      gasbeurs: beurs als bedoeld in [artikel 66b van de Gaswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel66b
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 66b
  - number: 47.1.d
    text: 'verbruiksperiode:'
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel47
  - number: 47.1.d.1°
    text: |-
      in gevallen waarin een voorschotnota wordt uitgereikt of, indien geen voorschotnota wordt uitgereikt, een
      voorschotbedrag wordt ontvangen: tijdvak waarop de eindfactuur betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel47
  - number: 47.1.d.2°
    text: 'in overige gevallen: kalenderjaar;'
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel47
  - number: 47.1.e
    text: |-
      eindfactuur: definitieve factuur waarin verrekening plaatsvindt met de voorschotnota’s of voorschotbedragen die
      betrekking hebben op het tijdvak waarop de factuur ziet;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel47
  - number: 47.1.f
    text: |-
      aansluiting: een aansluiting van een in Nederland gelegen onroerende zaak als bedoeld in
      [artikel 16, onderdelen a tot en met e, van de Wet waardering onroerende zaken][ref1] op een Nederlands
      distributienet waaruit elektriciteit of aardgas aan de verbruiker wordt geleverd; een aansluiting kan bestaan uit
      een of meer leveringspunten;


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel16
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '16'
  - number: 47.1.g
    text: |-
      installatie voor warmtekrachtkoppeling: een installatie waarin aardgas wordt verstookt voor de gecombineerde
      opwekking van warmte en kracht met een totaal energetisch rendement van minimaal 60%, gebaseerd op de calorische
      onderwaarde van het gas. Onder het totaal energetisch rendement wordt verstaan de som van het rendement van de
      elektriciteitsopwekking en tweederde deel van het rendement van de productie van nuttig aan te wenden warmte,
      berekend op de onderste verbrandingswaarde van aardgas;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel47
  - number: 47.1.h
    text: |-
      installatie voor blokverwarming: een gemeenschappelijke voorziening voor de verwarming van meer dan een onroerende
      zaak als bedoeld in [artikel 16, onderdelen a tot en met e, van de Wet waardering onroerende zaken][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel16
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '16'
  - number: 47.1.i
    text: |-
      hernieuwbare energiebronnen: wind, zonne-energie, aardwarmte, golfenergie, getijdenenergie, waterkracht, biomassa,
      stortgas, rioolwaterzuiveringsgas en biogas;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel47
  - number: 47.1.j
    text: |-
      biomassa: de biologisch afbreekbare fractie van producten, afvalstoffen en residuen van de landbouw, met inbegrip
      van plantaardige en dierlijke stoffen, de bosbouw en aanverwante bedrijfstakken, alsmede de biologisch afbreekbare
      fractie van industrieel en huishoudelijk afval;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel47
  - number: 47.1.k
    text: |-
      zuivere biomassa: producten, afvalstoffen en residuen van de landbouw, met inbegrip van plantaardige en dierlijke
      stoffen, de bosbouw en aanverwante bedrijfstakken die geheel biologisch afbreekbaar zijn, alsmede industrieel en
      huishoudelijk afval dat geheel biologisch afbreekbaar is;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel47
  - number: 47.1.l
    text: 'Nm3: een normaalkubiekemeter;'
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel47
  - number: 47.1.m
    text: 'aardgas: producten van de GN-codes 2711 11 00 en 2711 21 00;'
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel47
  - number: 47.1.n
    text: 'elektriciteit: elektrische energie van de GN-code 2716;'
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel47
  - number: 47.1.o
    text: |-
      brandstof: stof – met inbegrip van alle daaraan toegevoegde stoffen – dienende voor verbranding met het doel de
      daarbij ontstane energie te benutten;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel47
  - number: 47.1.p
    text: |-
      energie-intensief bedrijf: een zakelijke eenheid als bedoeld in onderdeel t, waar de kosten van de aankoop van
      energieproducten en elektriciteit ten minste 3,0% van de productiewaarde uitmaken, of waar de verschuldigde
      energiebelasting en accijns op minerale oliën ten minste 0,5% van de toegevoegde waarde bedraagt;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel47
  - number: 47.1.q
    text: |-
      kosten van de aankoop van energieproducten en elektriciteit, productiewaarde en toegevoegde waarde: hetgeen
      ingevolge artikel 17, eerste lid, onderdeel a, van Richtlijn 2003/96/EG van de Raad van 27 oktober 2003 tot
      herstructurering van de communautaire regeling voor de belasting van energieproducten en elektriciteit (PbEU 2003,
      L 283) onder deze begrippen wordt verstaan;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel47
  - number: 47.1.r
    text: 'CNG: aardgas dat na compressie geschikt is voor de aanwending in motorrijtuigen;'
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel47
  - number: 47.1.s
    text: |-
      CNG-vulstation: een rechtstreeks op het distributienet van aardgas aangesloten inrichting waar uitsluitend aardgas
      wordt samengeperst tot CNG, dat wordt afgeleverd aan motorrijtuigen;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel47
  - number: 47.1.t
    text: |-
      zakelijk verbruik: verbruik door een zakelijke eenheid die zelfstandig, op ongeacht welke plaats, leveringen van
      goederen en diensten verricht, ongeacht het oogmerk of het resultaat van die economische activiteiten. Economische
      activiteiten omvatten alle werkzaamheden van een fabrikant, handelaar of verrichter van diensten, met inbegrip van
      de winning van delfstoffen, de landbouw en de uitoefening van vrije of daarmee gelijkgestelde beroepen. Rijks-,
      regionale en lokale overheden, alsmede andere publiekrechtelijke lichamen worden als zakelijke eenheid aangemerkt
      voor zover zij werkzaamheden of transacties verrichten die bij een behandeling als niet-zakelijke eenheid tot
      concurrentieverstoring van enige betekenis zouden leiden;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel47
  - number: 47.1.u
    text: 'niet-zakelijk verbruik: verbruik anders dan het zakelijk verbruik, bedoeld in onderdeel t;'
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel47
  - number: 47.1.v
    text: |-
      productie-installatie: een productie-installatie als bedoeld in
      [artikel 1, eerste lid, onderdeel ah, van de Elektriciteitswet 1998][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel1
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '1'
  - number: 47.1.w
    text: |-
      walstroominstallatie: een installatie aan land met een zelfstandige aansluiting die het mogelijk maakt om schepen
      die zijn afgemeerd te voorzien van elektriciteit die afkomstig is van een distributienet.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel47
  - number: '47.2'
    text: |-
      Bij regeling van Onze Minister in overeenstemming met Onze Minister van Infrastructuur en Waterstaat worden nadere
      regels gesteld met betrekking tot de inhoud van het begrip zuivere biomassa.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel47
  - number: '47.3'
    text: |-
      Onder levering van aardgas, onderscheidenlijk elektriciteit, wordt voor de toepassing van dit
      hoofdstuk en de daarop berustende bepalingen verstaan hetgeen daaronder wordt verstaan ingevolge de
      [Wet op de omzetbelasting 1968][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002629
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0002629
  - number: '47.4'
    text: |-
      Met betrekking tot elektriciteit wordt onder distributienet verstaan een net als bedoeld in
      [artikel 1, eerste lid, onderdeel i, van de Elektriciteitswet 1998][ref1], met uitzondering van een net met
      een spanningsniveau van ten hoogste 0,4 kV en een verbruik van ten hoogste 0,1 GWh per jaar, indien een ander
      dan een leverancier als bedoeld in [artikel 1, eerste lid, onderdeel f, van de Elektriciteitswet 1998][ref2] of
      een netbeheerder als bedoeld in artikel 1, eerste lid, onderdeel k, van de Elektriciteitswet 1998, een recht van
      gebruik heeft van dat net.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel1
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '1'
  - number: '47.5'
    text: |-
      Bij regeling van Onze Minister kunnen nadere regels worden gesteld met betrekking tot de toepassing van het eerste
      lid, onderdeel p.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel47
  - number: '47.6'
    text: |-
      Met betrekking tot aardgas wordt onder distributienet verstaan een gastransportnet als bedoeld in
      [artikel 1, eerste lid, onderdeel d, van de Gaswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel1
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '1'
  - number: '47.7'
    text: |-
      Indien in een tijdvak van 18 maanden een of meerdere voorschotnota’s worden uitgereikt dan wel een of meerdere
      voorschotbedragen worden ontvangen en uiterlijk binnen 13 weken na afloop van dat tijdvak geen eindfactuur wordt
      uitgereikt, wordt dat tijdvak van 18 maanden aangemerkt als verbruiksperiode.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel47
  - number: '47.8'
    text: 'In afwijking van het eerste lid, onderdeel d, onder 2°, is de verbruiksperiode in de aldaar bedoelde gevallen:'
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel47
  - number: 47.8.a
    text: |-
      ingeval de overeenkomst tot levering in de loop van het kalenderjaar aanvangt: het gedeelte van het kalenderjaar
      vanaf het tijdstip waarop de overeenkomst tot levering aanvangt;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel47
  - number: 47.8.b
    text: |-
      ingeval de overeenkomst tot levering in de loop van het kalenderjaar wordt beëindigd: het gedeelte van het
      kalenderjaar tot het tijdstip waarop de overeenkomst tot levering eindigt.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel47
  - number: '48.1'
    text: Onder de naam energiebelasting wordt een belasting geheven op aardgas en elektriciteit.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel48
  - number: '48.2'
    text: |-
      Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen wordt als aardgas mede aangemerkt elk
      product dat direct of indirect is bestemd voor gebruik, wordt aangeboden voor verkoop of wordt gebruikt als
      aardgas.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel48
  - number: '50.1'
    text: |-
      De belasting wordt geheven ter zake van de levering van aardgas of elektriciteit via een aansluiting aan de
      verbruiker, alsmede ter zake van de levering van aardgas via een aansluiting aan een CNG-vulstation.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel50
  - number: '50.2'
    text: |-
      Indien de verbruiker, bedoeld in het eerste lid, via een aansluiting elektriciteit op het distributienet heeft
      ingevoed ter zake waarvan [artikel 31c, eerste en tweede lid, van de Elektriciteitswet 1998][ref1] wordt toegepast,
      is het eerste lid van toepassing op het positieve saldo van de via de aansluiting geleverde elektriciteit minus de
      via de aansluiting ingevoede elektriciteit.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel31c
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 31c
  - number: '50.3'
    text: 'De belasting wordt voorts geheven ter zake van:'
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel50
  - number: 50.3.a
    text: |-
      de levering, anders dan via een aansluiting, van aardgas of elektriciteit aan de verbruiker, of van aardgas aan een
      CNG-vulstation;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel50
  - number: 50.3.b
    text: |-
      het verbruik van aardgas of elektriciteit, indien dit product is verkregen door tussenkomst van een gasbeurs of
      elektriciteitsbeurs;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel50
  - number: 50.3.c
    text: het verbruik van aardgas of elektriciteit door degene die leveringen aan de verbruiker verricht;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel50
  - number: 50.3.d
    text: |-
      het verbruik van aardgas of elektriciteit, indien het aardgas of de elektriciteit is verkregen op andere wijze dan
      door een levering.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel50
  - number: '50.4'
    text: |-
      Indien een levering van aardgas of elektriciteit wordt verricht aan een organisatorische eenheid die zich
      bezighoudt met het leveren van aardgas of elektriciteit dan wel aan een verbruiker die op zijn beurt het geleverde
      aardgas of de geleverde elektriciteit levert aan een verbruiker, wordt eerstgenoemde levering niet aangemerkt als
      een levering als bedoeld in het eerste lid of het derde lid, onderdeel a.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel50
  - number: '50.5'
    text: |-
      Het derde lid, onderdeel a, is niet van toepassing met betrekking tot de levering van elektriciteit aan een
      huurder van een woning, voor zover die elektriciteit door de verhuurder van die woning is opgewekt door middel van
      hernieuwbare energiebronnen, waarbij de productie-installatie is aangebracht op of aan het gebouw met toebehoren
      waarvan de woning onderdeel uitmaakt, dan wel op of aan de bij dat gebouw behorende grond met toebehoren.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel50
  - number: '50.6'
    text: 'Het derde lid, onderdelen c en d, is niet van toepassing met betrekking tot het verbruik van:'
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel50
  - number: 50.6.a
    text: |-
      elektriciteit die de verbruiker heeft opgewekt door middel van hernieuwbare energiebronnen, met uitzondering van
      elektriciteit uit biomassa die niet als zuivere biomassa wordt aangemerkt;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel50
  - number: 50.6.b
    text: |-
      elektriciteit die de verbruiker heeft opgewekt door middel van een noodinstallatie in geval van storingen bij de
      levering via het distributienet;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel50
  - number: 50.6.c
    text: stortgas, rioolwaterzuiveringsgas of biogas dat de verbruiker heeft gewonnen;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel50
  - number: 50.6.d
    text: elektriciteit die de verbruiker heeft opgewekt door middel van een installatie voor warmtekrachtkoppeling.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel50
  - number: '50.7'
    text: Bij regeling van Onze Minister worden nadere regels gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel50
  - number: '51.1'
    text: |-
      Onder bij algemene maatregel van bestuur te stellen voorwaarden en beperkingen wordt als verbruik in de zin van
      [artikel 50, derde lid, onderdeel d][ref1], niet aangemerkt het verbruik van aardgas voor de vervaardiging van
      aardgas en minerale oliën als bedoeld in [artikel 25, eerste lid, van de Wet op de accijns][ref2], in dezelfde
      inrichting waarin dat aardgas is ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel25
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '50'
        hoofdstuk: VI
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: '25'
  - number: '51.2'
    text: Bij regeling van Onze Minister kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel51
  - number: '53.1'
    text: De belasting wordt geheven van degene die de levering verricht.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel53
  - number: '53.2'
    text: |-
      In afwijking van het eerste lid wordt bij toepassing van [artikel 50, derde lid, onderdelen b, c en d][ref1], de
      belasting geheven van de verbruiker.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel50
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '50'
        hoofdstuk: VI
        afdeling: '2'
  - number: '54.1'
    text: |-
      Voor de toepassing van [artikel 53, eerste lid][ref1], stelt degene die de levering aan de verbruiker verricht,
      indien hij niet in Nederland is gevestigd en aldaar geen vaste inrichting heeft, een fiscaal vertegenwoordiger
      aan. De fiscaal vertegenwoordiger treedt namens hem op en treedt in zijn plaats met betrekking tot alle rechten en
      verplichtingen die hij heeft inzake de belasting.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel53
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '53'
        hoofdstuk: VI
        afdeling: '2'
  - number: '54.2'
    text: De fiscaal vertegenwoordiger is in het bezit van een daartoe door de inspecteur verstrekte vergunning.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel54
  - number: '54.3'
    text: |-
      Degene die een vergunning als fiscaal vertegenwoordiger wil verkrijgen, dient daartoe een verzoek in bij de
      inspecteur.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel54
  - number: '54.4'
    text: |-
      Bij het verzoek, bedoeld in het derde lid, wordt een verklaring overgelegd van degene die de levering aan de
      verbruiker verricht waaruit blijkt dat deze degene die het verzoek indient, machtigt op te treden als zijn fiscaal
      vertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel54
  - number: '54.5'
    text: |-
      Bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur worden nadere regels gesteld
      met betrekking tot de gegevens die het verzoek, bedoeld in het derde lid, moet bevatten alsmede met betrekking tot
      voorwaarden waaronder de vergunning wordt verleend, gewijzigd en ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel54
  - number: '54.6'
    text: Bij regeling van Onze Minister worden nadere regels gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel54
  - number: '55'
    text: 'De belasting wordt berekend:'
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel55
  - number: 55.a
    text: |-
      voor aardgas: per eenheid brandstof, uitgedrukt in kubieke meter, met inachtneming van de krachtens de
      [Gaswet][ref1] gestelde regels ter bepaling van de geleverde hoeveelheid;


      [ref1]: https://wetten.overheid.nl/BWBR0011440
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0011440
  - number: 55.b
    text: 'voor elektriciteit: per eenheid energie-inhoud, uitgedrukt in kWh.'
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel55
  - number: '56.1'
    text: 'De belasting met betrekking tot de levering van aardgas en de levering van elektriciteit wordt verschuldigd:'
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel56
  - number: 56.1.a
    text: |-
      in gevallen waarin een voorschotnota wordt uitgereikt of, indien geen voorschotnota wordt uitgereikt, een
      voorschotbedrag wordt ontvangen:
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel56
  - number: 56.1.a.1°
    text: |-
      op het tijdstip waarop een voorschotnota wordt uitgereikt onderscheidenlijk een voorschotbedrag wordt ontvangen;
      alsmede
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel56
  - number: 56.1.a.2°
    text: |-
      op het tijdstip van de uitreiking van de eindfactuur over een verbruiksperiode, dan wel, bij toepassing van
      [artikel 47, zevende lid][ref1], op de laatste dag van het aldaar bedoelde tijdvak van 18 maanden;


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel47
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '47'
        hoofdstuk: VI
        afdeling: '1'
  - number: 56.1.b
    text: |-
      in gevallen waarin geen voorschotnota wordt uitgereikt of voorschotbedrag wordt ontvangen, maar wel een factuur
      wordt uitgereikt: op het tijdstip van de uitreiking van de factuur;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel56
  - number: 56.1.c
    text: 'in overige gevallen: op het tijdstip waarop de levering plaatsvindt.'
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel56
  - number: '56.2'
    text: |-
      Voor de toepassing van het eerste lid, onderdeel a, onder 1°, worden de hoeveelheden aardgas en elektriciteit,
      waarop de voorschotnota dan wel het voorschotbedrag is gebaseerd, aangemerkt als geleverde hoeveelheden.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel56
  - number: '56.3'
    text: |-
      In afwijking van het eerste lid wordt de belasting bij toepassing van
      [artikel 50, derde lid, onderdelen b, c en d][ref1], verschuldigd op het tijdstip waarop het verbruik plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel50
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '50'
        hoofdstuk: VI
        afdeling: '2'
  - number: '56.4'
    text: |-
      Indien de verrekening, bedoeld in [artikel 47, eerste lid, onderdeel e][ref1], leidt tot een lager bedrag dan over
      de verbruiksperiode aan belasting is voldaan, wordt het verschil in mindering gebracht op de aangifte over het
      tijdvak waarin de eindfactuur is uitgereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel47
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '47'
        hoofdstuk: VI
        afdeling: '1'
  - number: '57'
    text: |-
      Indien in een verbruiksperiode ten aanzien van degene van wie op grond van [artikel 53, tweede lid][ref1],
      de belasting wordt geheven zowel sprake is van door hem op grond van artikel 53, tweede lid, verschuldigde
      belasting als van aan hem in rekening gebrachte belasting ter zake van aan hem geleverde hoeveelheden aardgas of
      elektriciteit, wordt in totaal niet meer belasting geheven dan de belasting die zou zijn verschuldigd indien de
      totale hoeveelheid aardgas of elektriciteit was betrokken van één leverancier, met dien verstande dat de belasting
      primair wordt geheven van degene, bedoeld in artikel 53, eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel53
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '53'
        hoofdstuk: VI
        afdeling: '2'
  - number: '59.1'
    text: 'Het tarief bedraagt voor:'
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel59
  - number: 59.1.a
    text: |-
      aardgas, met uitzondering van aardgas als bedoeld in onderdeel b, met een bovenste verbrandingswaarde van 35,17
      megajoule per Nm3 voor dat gedeelte van de geleverde dan wel verbruikte hoeveelheid per verbruiksperiode van twaalf
      maanden per aansluiting dat: - niet hoger is dan 170 000 kubieke meter, per kubieke meter € 0,34856‬;
        - hoger is dan 170 000 kubieke meter, maar niet hoger dan 1 000 000 kubieke meter, per kubieke meter € 0,06547;
        - hoger is dan 1 000 000 kubieke meter, maar niet hoger dan 10 000 000 kubieke meter, per kubieke meter € 0,02386;
        - hoger is dan 10 000 000 kubieke meter, per kubieke meter € 0,01281;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel59
  - number: 59.1.b
    text: |-
      aardgas, met een bovenste verbrandingswaarde van 35,17 megajoule per Nm3, dat wordt geleverd aan een CNG-vulstation
      € 0,16982 per kubieke meter;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel59
  - number: 59.1.c
    text: |-
      elektriciteit voor dat gedeelte van de geleverde dan wel verbruikte hoeveelheid per verbruiksperiode van twaalf
      maanden per aansluiting dat: - niet hoger is dan 10 000 kWh, per kWh € 0,09428;
        - hoger is dan 10 000 kWh, maar niet hoger dan 50 000 kWh, per kWh € 0,05164;
        - hoger is dan 50 000 kWh, maar niet hoger dan 10 000 000 kWh, per kWh € 0,01375;
        - hoger is dan 10 000 000 kWh, per kWh € 0,00113 voor niet-zakelijk verbruik en per kWh € 0,00056 voor zakelijk
      verbruik.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel59
  - number: '59.2'
    text: |-
      Bij aardgas met een bovenste verbrandingswaarde die lager of hoger is dan 35,17 megajoule per Nm3, worden de in het
      eerste lid, onderdelen a en b, genoemde tarieven naar evenredigheid verlaagd, onderscheidenlijk verhoogd alsmede de
      hoeveelheidsgrenzen naar evenredigheid verhoogd onderscheidenlijk verlaagd.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel59
  - number: '59.3'
    text: |-
      In afwijking van het eerste lid, onderdeel a, bedraagt het tarief voor aardgas € 0,34856 per kubieke meter voor
      de totale hoeveelheid aardgas die wordt geleverd aan een verbruiker die dat aardgas gebruikt voor een installatie
      voor blokverwarming niet zijnde een installatie voor stadsverwarming waarbij grotendeels gebruik wordt gemaakt van
      restwarmte, aardwarmte of warmte opgewekt met vaste of vloeibare biomassa.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel59
  - number: '59.4'
    text: |-
      In afwijking van het eerste lid, onderdeel a, bedragen de tarieven nihil voor in [artikel 48, tweede lid][ref1],
      als aardgas aangemerkte producten voor zover deze als brandstof worden gebruikt in de inrichting waarin zij zijn
      ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel48
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '48'
        hoofdstuk: VI
        afdeling: '2'
  - number: '59.5'
    text: |-
      Indien bij een aansluiting sprake is van zowel zakelijk verbruik als niet-zakelijk verbruik, worden de tarieven,
      genoemd in het eerste lid, voor verbruik boven 10 000 000 kWh toegepast naar evenredigheid van elk type verbruik.
      Indien het verbruik nagenoeg geheel bestaat uit zakelijk verbruik of niet-zakelijk verbruik, wordt het volledige
      verbruik als zodanig aangemerkt.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel59
  - number: '59.6'
    text: |-
      Bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur worden nadere regels gesteld ten
      behoeve van de toepassing van het eerste en derde lid.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel59
  - number: '59.7'
    text: |-
      Bij regeling van Onze Minister kunnen nadere regels worden gesteld ten behoeve van de toepassing van het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel59
  - number: 59c
    text: |-
      Indien de verlaging van het tarief, bedoeld in [artikel 59a, eerste lid][ref1],
      wordt verminderd of komt te vervallen, blijven de bepalingen gesteld bij of krachtens
      [artikel 47, eerste lid, onderdelen v tot en met z][ref2], artikel 59a en [artikel 59b][ref3], zoals deze luidden
      op de dag voorafgaand aan de dag met ingang waarvan de verlaging van het tarief wordt verminderd of komt te
      vervallen, gedurende 15 jaren na het tijdstip waarop de coöperatie is aangewezen als bedoeld in artikel 59a, eerste
      lid, van toepassing ten aanzien van de levering van elektriciteit aan personen ten aanzien van wie op de eerst
      genoemde dag artikel 59a en, indien het een vereniging van eigenaars betreft, artikel 59b, van toepassing waren.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel59a
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel47
      [ref3]: https://wetten.overheid.nl/BWBR0007168#Artikel59b
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel59c
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: 59a
        hoofdstuk: VI
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0007168
        artikel: '47'
        hoofdstuk: VI
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0007168
        artikel: 59b
        hoofdstuk: VI
        afdeling: '4'
  - number: '60.1'
    text: |-
      In afwijking van [artikel 59, eerste lid, onderdeel a][ref1], bedraagt het tarief voor aardgas voor verwarming
      ter bevordering van het groeiproces van tuinbouwproducten voor aardgas met een bovenste verbrandingswaarde van
      35,17 megajoule per Nm3, voor dat gedeelte van de geleverde dan wel verbruikte hoeveelheid per verbruiksperiode van
      twaalf maanden per aansluiting dat: - niet hoger is dan 170 000 kubieke meter, per kubieke meter € 0,05597;
        - hoger is dan 170 000 kubieke meter, maar niet hoger dan 1 000 000 kubieke meter, per kubieke meter € 0,02471;
        - hoger is dan 1 000 000 kubieke meter, maar niet hoger dan 10 000 000 kubieke meter, per kubieke meter € 0,02386;
        - hoger is dan 10 000 000 kubieke meter, per kubieke meter € 0,01281.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel59
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '59'
        hoofdstuk: VI
        afdeling: '4'
  - number: '60.2'
    text: |-
      De tarieven, genoemd in het eerste lid, zijn niet van toepassing als de verbruiker een onderneming in moeilijkheden
      is. Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld ter vaststelling wanneer de
      verbruiker moet worden aangemerkt als een onderneming in moeilijkheden.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel60
  - number: '60.3'
    text: |-
      Indien behalve voor het in het eerste lid vermelde doel mede aardgas wordt toegepast in één of meerdere woonhuizen,
      wordt per verbruiksperiode van twaalf maanden per woonhuis een geleverde hoeveelheid van 5000 kubieke meter in
      de heffing betrokken naar het tarief, bedoeld in [artikel 59, eerste lid, onderdeel a][ref1], tenzij de geleverde
      hoeveelheden voor de verschillende toepassingen en de verschillende woonhuizen afzonderlijk worden gemeten.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel59
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '59'
        hoofdstuk: VI
        afdeling: '4'
  - number: '60.4'
    text: |-
      Bij aardgas met een bovenste verbrandingswaarde die lager of hoger is dan 35,17 megajoule per Nm3, worden de in het
      eerste lid genoemde tarieven naar evenredigheid verlaagd, onderscheidenlijk verhoogd alsmede de hoeveelheidsgrenzen
      naar evenredigheid verhoogd onderscheidenlijk verlaagd.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel60
  - number: '60.5'
    text: Bij regeling van Onze Minister kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel60
  - number: 60a.1
    text: |-
      In afwijking van [artikel 59, eerste lid, onderdeel c, eerste aandachtstreepje][ref1], is het tarief voor
      elektriciteit die wordt geleverd aan een oplaadinstallatie voor elektrische voertuigen die beschikt over een
      zelfstandige aansluiting, voor dat gedeelte van de geleverde hoeveelheid per verbruiksperiode van twaalf maanden
      per aansluiting dat niet hoger is dan 10.000 kWh, gelijk aan het in artikel 59, eerste lid, onderdeel c, tweede
      aandachtsstreepje, opgenomen tarief.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel59
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel60a
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '59'
        hoofdstuk: VI
        afdeling: '4'
  - number: 60a.2
    text: |-
      Het tarief, genoemd in het eerste lid, is niet van toepassing als de verbruiker een onderneming in moeilijkheden
      is.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel60a
  - number: 60a.3
    text: |-
      Bij of krachtens op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur kunnen voorwaarden
      en beperkingen worden gesteld waaronder het tarief, bedoeld in het eerste lid, wordt toegepast en worden nadere
      regels gesteld ter vaststelling wanneer de verbruiker moet worden aangemerkt als een onderneming in moeilijkheden.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel60a
  - number: 60a.4
    text: Bij regeling van Onze Minister kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel60a
  - number: 60b.1
    text: |-
      In afwijking van [artikel 59, eerste lid, onderdeel c][ref1], bedraagt het tarief voor elektriciteit die
      wordt geleverd aan een walstroominstallatie die geheel of nagenoeg geheel bestemd is voor schepen niet zijnde
      particuliere pleziervaartuigen als bedoeld in [artikel 70a, derde lid][ref2], per kWh € 0,0005.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel59
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel70a
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel60b
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '59'
        hoofdstuk: VI
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0007168
        artikel: 70a
        hoofdstuk: VI
        afdeling: '6'
  - number: 60b.2
    text: |-
      Het tarief, genoemd in het eerste lid, is niet van toepassing als de verbruiker een onderneming in moeilijkheden
      is.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel60b
  - number: 60b.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voorwaarden en beperkingen worden gesteld waaronder het
      tarief, genoemd in het eerste lid, wordt toegepast en worden nadere regels gesteld ter vaststelling wanneer de
      verbruiker moet worden aangemerkt als een onderneming in moeilijkheden.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel60b
  - number: 60b.4
    text: Bij regeling van Onze Minister kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel60b
  - number: '61'
    text: |-
      Bij een verbruiksperiode korter dan wel langer dan twaalf maanden worden de hoeveelheidsgrenzen, genoemd
      in [artikel 59, eerste lid][ref1], [artikel 60, eerste en derde lid][ref2], [67, eerste lid][ref3], en
      [68, tweede lid][ref4], naar evenredigheid verlaagd, onderscheidenlijk verhoogd.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel59
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel60
      [ref3]: https://wetten.overheid.nl/BWBR0007168#Artikel67
      [ref4]: https://wetten.overheid.nl/BWBR0007168#Artikel68
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '59'
        hoofdstuk: VI
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0007168
        artikel: '60'
        hoofdstuk: VI
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0007168
        artikel: '67'
        hoofdstuk: VI
        afdeling: '6'
      - id: ref4
        bwb_id: BWBR0007168
        artikel: '68'
        hoofdstuk: VI
        afdeling: '6'
  - number: 61a
    text: |-
      In de gevallen, bedoeld in [artikel 47, achtste lid, onderdeel b][ref1], wordt de belasting ter zake
      van de leveringen die vanaf het begin van het kalenderjaar zijn verricht, herrekend met inachtneming van
      [artikel 61][ref2]. Indien deze herrekening leidt tot een hoger of lager belastingbedrag dan de belasting
      die zonder de herrekening over de gehele verbruiksperiode verschuldigd zou zijn, wordt de belasting die moet
      worden voldaan over het tijdvak waarin de overeenkomst tot levering wordt beëindigd dienovereenkomstig verhoogd
      onderscheidenlijk verlaagd. Bij de bepaling van de belasting die op de laatste factuur aan de verbruiker wordt
      vermeld, wordt de verhoging of verlaging, bedoeld in de tweede volzin, in aanmerking genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel61
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel61a
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '47'
        hoofdstuk: VI
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0007168
        artikel: '61'
        hoofdstuk: VI
        afdeling: '4'
  - number: '62'
    text: |-
      Indien op basis van een contract tussen de belastingplichtige en de verbruiker de geleverde hoeveelheid
      aardgas gemeten wordt in Nm3, worden de tarieven toegepast, zoals die met betrekking tot aardgas in
      [artikel 59, eerste lid, onderdeel a, en derde lid][ref1], en [artikel 60, eerste lid][ref2], worden toegepast per
      kubieke meter.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel59
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel60
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '59'
        hoofdstuk: VI
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0007168
        artikel: '60'
        hoofdstuk: VI
        afdeling: '4'
  - number: '63.1'
    text: |-
      Op de ter zake van de levering van elektriciteit, bedoeld in [artikel 50, eerste lid][ref1], verschuldigde
      belasting wordt een vermindering toegepast met betrekking tot onroerende zaken die op zich als gebouwde eigendommen
      zijn aan te merken en die kunnen dienen als woning of ten behoeve van de uitoefening van een bedrijf of beroep of
      anderszins een verblijfsfunctie hebben. De vermindering bedraagt € 461,62 per verbruiksperiode van twaalf maanden
      per aansluiting.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel50
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '50'
        hoofdstuk: VI
        afdeling: '2'
  - number: '63.2'
    text: |-
      Indien het bedrag van de over de verbruiksperiode verschuldigde belasting lager is dan het bedrag van de
      vermindering, bedoeld in het eerste lid, wordt het verschil aan de verbruiker terugbetaald.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel63
  - number: '63.3'
    text: |-
      In de gevallen waarin een voorschotnota wordt uitgereikt of, indien geen voorschotnota wordt uitgereikt, een
      voorschotbedrag wordt ontvangen, wordt bij de berekening van het voorschotbedrag naar evenredigheid rekening
      gehouden met de belastingvermindering, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel63
  - number: '63.4'
    text: |-
      Bij een verbruiksperiode korter dan wel langer dan twaalf maanden worden de in het eerste lid genoemde bedragen
      naar evenredigheid verlaagd, onderscheidenlijk verhoogd.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel63
  - number: '63.5'
    text: |-
      Bij toepassing van [artikel 50, derde lid][ref1], zijn het eerste en vierde lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel50
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '50'
        hoofdstuk: VI
        afdeling: '2'
  - number: '63.6'
    text: |-
      Bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur kunnen voorwaarden en
      beperkingen worden gesteld waaronder de belastingvermindering, bedoeld in het eerste lid, wordt verleend.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel63
  - number: '63.7'
    text: Bij regeling van Onze Minister worden nadere regels gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel63
  - number: '64.1'
    text: |-
      Vrijstelling van de belasting wordt verleend ter zake van de levering of het verbruik van aardgas en elektriciteit
      die worden gebruikt voor het opwekken van elektriciteit in een installatie met een elektrisch rendement van
      minimaal 30 percent dan wel in een installatie met behulp waarvan elektriciteit wordt opgewekt uitsluitend door
      middel van hernieuwbare energiebronnen en elektriciteit.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel64
  - number: '64.2'
    text: |-
      Als installatie met een elektrisch rendement van minimaal 30 percent wordt aangemerkt een installatie met een
      gemiddeld gebruik van aardgas met een bovenste verbrandingswaarde van 35,17 megajoule per Nm3, van maximaal
      0,38 Nm3 aardgas per opgewekte kWh. Bij aardgas met een bovenste verbrandingswaarde die lager of hoger is dan
      35,17 megajoule per Nm3, wordt de in de eerste volzin genoemde maximale hoeveelheid naar evenredigheid verhoogd,
      onderscheidenlijk verlaagd.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel64
  - number: '64.3'
    text: |-
      Vrijstelling van belasting wordt verleend ter zake van de levering of het verbruik van: Als metallurgische procedés
      worden aangemerkt:
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel64
  - number: 64.3.a
    text: de vervaardiging van metalen in primaire vorm;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel64
  - number: 64.3.b
    text: smeden, persen, stampen en profielwalsen van metaal;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel64
  - number: 64.3.c
    text: oppervlaktebehandeling bestaande uit harden of warmtebehandeling van metalen.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel64
  - number: '64.4'
    text: |-
      Vrijstelling van de belasting wordt verleend ter zake van de levering of het verbruik van aardgas dat wordt
      gebruikt voor mineralogische procedés. Als mineralogische procedés worden aangemerkt de vervaardiging van glas en
      glaswerk, de vervaardiging van keramische producten, de vervaardiging van cement, kalk of gips, de vervaardiging
      van kalkzandsteen of cellenbeton en de vervaardiging van steenwol. De vrijstelling voor mineralogische procedés
      geldt alleen voor de bedrijven die volgens de Standaard Bedrijfsindeling van 21 juli 2008 van het Centraal Bureau
      voor de Statistiek behoren tot code 23.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel64
  - number: '64.5'
    text: |-
      Vrijstelling van belasting wordt verleend ter zake van de levering of het verbruik van aardgas dat wordt gebruikt
      anders dan als brandstof dan wel aardgas dat wordt gebruikt als additief of als vulstof in producten die direct of
      indirect zijn bestemd voor verbruik, worden aangeboden voor verkoop of worden verbruikt als aardgas.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel64
  - number: '64.6'
    text: |-
      Bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur worden voorwaarden en
      beperkingen gesteld waaronder de vrijstellingen, bedoeld in het eerste, derde, vierde en vijfde lid, worden
      verleend.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel64
  - number: '64.7'
    text: Bij regeling van Onze Minister worden nadere regels gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel64
  - number: '66.1'
    text: |-
      Op verzoek wordt aan de verbruiker teruggaaf van de belasting verleend met betrekking tot elektriciteit die
      geleverd is ten behoeve van zakelijk verbruik voor zover het zakelijk verbruik, na aftrek van het gedeelte van het
      zakelijk verbruik dat reeds is vrijgesteld op grond van [artikel 64, eerste of derde lid][ref1], hoger is dan 10
      000 000 kWh per verbruiksperiode van twaalf maanden per aansluiting. De teruggaaf wordt slechts verleend indien
      de verbruiker in het kader van met Onze Minister, Onze Minister van Economische Zaken en Klimaat en Onze Minister
      van Infrastructuur en Waterstaat gemaakte afspraken verplichtingen op zich heeft genomen ter verbetering van de
      energie-efficiëntie en hij als energie-intensief bedrijf wordt aangemerkt, met dien verstande dat voor verbruikers
      die deelnemer zijn in de Meerjarenafspraak Energie-efficiëntie ETS-ondernemingen die afspraak van toepassing is
      zoals die luidde op 2 oktober 2009.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel64
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '64'
        hoofdstuk: VI
        afdeling: '5'
  - number: '66.2'
    text: |-
      De teruggaaf, bedoeld in het eerste lid, heeft betrekking op een kalenderjaar en bedraagt het positieve verschil
      tussen:
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel66
  - number: 66.2.a
    text: |-
      de belasting die ter zake van de in het kalenderjaar ten behoeve van zakelijk verbruik geleverde elektriciteit
      verschuldigd is en aan de verbruiker in rekening is gebracht; en
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel66
  - number: 66.2.b
    text: |-
      de belasting die op de voet van [artikel 59, eerste lid, onderdeel c][ref1], verschuldigd is over een geleverde
      hoeveelheid van 10 000 000 kWh, dan wel, indien dat meer is, de belasting die verschuldigd zou zijn als het
      gehele zakelijk verbruik, na aftrek van het gedeelte van het zakelijk verbruik dat is vrijgesteld op grond van
      [artikel 64, eerste of derde lid][ref2], belast zou zijn naar een tarief gelijk aan het minimumbelastingniveau
      per kWh, bedoeld in artikel 10, eerste lid, van Richtlijn 2003/96/EG van de Raad van 27 oktober 2003 tot
      herstructurering van de communautaire regeling voor de belasting van energieproducten en elektriciteit (PbEU 2003,
      L 283).


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel59
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel64
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '59'
        hoofdstuk: VI
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0007168
        artikel: '64'
        hoofdstuk: VI
        afdeling: '5'
  - number: '66.3'
    text: |-
      De teruggaaf, bedoeld in het eerste lid, valt binnen de bepalingen van Verordening (EU) nr. 651/2014 van de
      Commissie van 17 juni 2014 waarbij bepaalde categorieën steun op grond van de artikelen 107 en 108 van het Verdrag
      met de interne markt verenigbaar worden verklaard (PbEU 2014, L 187). De teruggaaf wordt slechts verleend als de
      verbruiker blijkens een door hem verstrekte verklaring niet in moeilijkheden verkeert.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel66
  - number: '66.4'
    text: |-
      De teruggaaf, bedoeld in het eerste lid, wordt slechts verleend indien de verbruiker met het verzoek om teruggaaf
      de volgende verklaringen aan de inspecteur overlegt:
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel66
  - number: 66.4.a
    text: |-
      de verklaring dat hij deelnemer in een convenant is doordat hij afspraken als bedoeld in het eerste lid heeft
      gemaakt;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel66
  - number: 66.4.b
    text: |-
      de verklaring dat het verbruik van de elektriciteit waarvoor hij om de teruggaaf verzoekt, zakelijk verbruik
      betreft als bedoeld in [artikel 47, eerste lid, onderdeel t][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel47
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '47'
        hoofdstuk: VI
        afdeling: '1'
  - number: 66.4.c
    text: |-
      de verklaring dat hij een energie-intensief bedrijf is als bedoeld in [artikel 47, eerste lid, onderdeel p][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel47
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '47'
        hoofdstuk: VI
        afdeling: '1'
  - number: '66.5'
    text: |-
      Indien de verbruiker niet binnen zes maanden na afloop van het kalenderjaar waarover hij een teruggaaf van
      energiebelasting heeft gekregen, een voortgangsverklaring als bedoeld in het zesde lid met betrekking tot dat
      kalenderjaar heeft overgelegd aan de inspecteur, wordt hij geacht in dat kalenderjaar geen deelnemer in een
      convenant te zijn geweest, tenzij het tegendeel aannemelijk wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel66
  - number: '66.6'
    text: |-
      Een voortgangsverklaring is een verklaring van een onafhankelijke instantie waaruit blijkt dat de verbruiker in het
      voorafgaande kalenderjaar de gemaakte afspraken, bedoeld in het eerste lid, in voldoende mate heeft nageleefd. Een
      onafhankelijke instantie als bedoeld in de eerste volzin is een door Onze Minister van Economische Zaken en Klimaat
      en Onze Minister van Infrastructuur en Waterstaat aangewezen instantie die de resultaten van de afspraken, bedoeld
      in het eerste lid, verifieert. De voortgangsverklaring wordt jaarlijks door de onafhankelijke instantie aan de
      verbruiker verstrekt.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel66
  - number: '66.7'
    text: |-
      Bij een verbruiksperiode korter dan wel langer dan twaalf maanden wordt de hoeveelheidsgrens, bedoeld in het eerste
      en tweede lid, naar evenredigheid verlaagd, onderscheidenlijk verhoogd.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel66
  - number: '66.8'
    text: Bij regeling van Onze Minister kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel66
  - number: '66.9'
    text: |-
      Voor de toepassing van dit artikel wordt elektriciteit waarvoor de belasting wordt geheven ingevolge
      [artikel 50, derde lid, onderdeel b, c of d][ref1], mede aangemerkt als elektriciteit die aan de verbruiker
      is geleverd, en wordt de op aangifte ter zake van het verbruik van die elektriciteit voldane belasting mede in
      aanmerking genomen als belasting die aan de verbruiker in rekening is gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel50
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '50'
        hoofdstuk: VI
        afdeling: '2'
  - number: '67.1'
    text: |-
      Op verzoek wordt teruggaaf van de belasting verleend voor aardgas dat is belast naar het
      tarief, bedoeld in [artikel 59, eerste lid, onderdeel a][ref1], voor het verbruik niet hoger dan
      170 000 kubieke meter, voor zover het verbruik van warmte in een onroerende zaak als bedoeld in
      [artikel 16, onderdeel a tot en met e, van de Wet waardering onroerende zaken][ref2] die door een installatie voor
      blokverwarming wordt verwarmd, hoger is dan 5 372 000 megajoule per verbruiksperiode van twaalf maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel59
      [ref2]: https://wetten.overheid.nl/BWBR0007119#Artikel16
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '59'
        hoofdstuk: VI
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0007119
        artikel: '16'
  - number: '67.2'
    text: |-
      De teruggaaf, bedoeld in het eerste lid, wordt verleend aan de gebruiker van de in het eerste lid bedoelde
      onroerende zaak. De teruggaaf bedraagt het verschil tussen het bedrag van de belasting dat volgt uit toepassing
      van het tarief, bedoeld in [artikel 59, eerste lid, onderdeel a][ref1], voor het verbruik niet hoger dan 170 000
      kubieke meter en het bedrag van de belasting dat volgt uit toepassing van artikel 59, eerste lid, onderdeel a, als
      aan de gebruiker een hoeveelheid aardgas geleverd zou zijn die correspondeert met de verbruikte warmte.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel59
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '59'
        hoofdstuk: VI
        afdeling: '4'
  - number: '67.3'
    text: |-
      Bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur worden voorwaarden en
      beperkingen gesteld waaronder de teruggaaf, bedoeld in het eerste lid, wordt verleend.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel67
  - number: '67.4'
    text: Bij regeling van Onze Minister kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel67
  - number: '68.1'
    text: |-
      Op verzoek wordt aan de verbruiker teruggaaf van de belasting verleend met betrekking tot aardgas en elektriciteit,
      voor zover de belasting over de hoeveelheden aardgas en elektriciteit die door een verbruiker gedurende dezelfde
      periode binnen een kalenderjaar van verschillende leveranciers zijn betrokken, hoger is dan de belasting die zou
      zijn verschuldigd indien sprake was van één leverancier.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel68
  - number: '68.2'
    text: |-
      Op verzoek wordt aan de verbruiker teruggaaf van de belasting verleend voor zover met betrekking tot zakelijk
      verbruik van elektriciteit boven de 10 000 000 kWh per verbruiksperiode van twaalf maanden per aansluiting het
      tarief voor niet-zakelijk verbruik in rekening is gebracht.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel68
  - number: '68.3'
    text: |-
      Bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur worden voorwaarden en
      beperkingen gesteld waaronder de teruggaven, bedoeld in het eerste en tweede lid, worden verleend.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel68
  - number: '68.4'
    text: Bij regeling van Onze Minister kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel68
  - number: '69.1'
    text: |-
      Op verzoek wordt teruggaaf van de belasting verleend met betrekking tot aardgas en elektriciteit, verbruikt
      in een onroerende zaak die in hoofdzaak is bestemd voor de openbare eredienst of voor het houden van openbare
      bezinningsbijeenkomsten van levensbeschouwelijke aard.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel69
  - number: '69.2'
    text: |-
      Op verzoek wordt teruggaaf verleend met betrekking tot aardgas en elektriciteit, verbruikt in een onroerende zaak
      die hoofdzakelijk in gebruik is bij een algemeen nut beogende instelling of bij een instelling die voldoet aan de
      voorwaarden, bedoeld in [artikel 5c, onderdelen a en b, van de Algemene wet inzake rijksbelastingen][ref1], mits:


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel5c
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 5c
  - number: 69.2.a
    text: |-
      de in de aanhef bedoelde instellingen niet of slechts in beperkte mate werkzaam zijn op het gebied van sport,
      gezondheidszorg of onderwijs;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel69
  - number: 69.2.b
    text: de in de aanhef bedoelde instellingen geen publiekrechtelijk lichaam zijn;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel69
  - number: 69.2.c
    text: de in de aanhef bedoelde instellingen beschikken over een eigen aansluiting;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel69
  - number: 69.2.d
    text: |-
      de in de aanhef bedoelde algemeen nut beogende instelling niet aan vennootschapsbelasting is onderworpen dan wel
      daarvan is vrijgesteld;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel69
  - number: 69.2.e
    text: |-
      de werkzaamheden van de in de aanhef bedoelde instelling die voldoet aan de voorwaarden, bedoeld in
      [artikel 5c, onderdelen a en b, van de Algemene wet inzake rijksbelastingen][ref1], geheel of nagenoeg geheel
      worden verricht door natuurlijke personen om niet of naar een loon dat in belangrijke mate lager is dan hetgeen in
      het economische verkeer gebruikelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel5c
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 5c
  - number: '69.3'
    text: |-
      Op verzoek wordt teruggaaf verleend met betrekking tot aardgas en elektriciteit, verbruikt in
      een onroerende zaak die hoofdzakelijk in gebruik is bij meer dan één instelling die een algemeen
      nut beogende instelling is of die een instelling is die voldoet aan de voorwaarden, bedoeld in
      [artikel 5c, onderdelen a en b, van de Algemene wet inzake rijksbelastingen][ref1], en het tweede lid, onderdeel
      e, mits:


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel5c
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 5c
  - number: 69.3.a
    text: |-
      de in de aanhef bedoelde instellingen niet of slechts in beperkte mate werkzaam zijn op het gebied van sport,
      gezondheidszorg of onderwijs;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel69
  - number: 69.3.b
    text: |-
      de in de aanhef bedoelde instelling die voldoet aan de voorwaarden, bedoeld in
      [artikel 5c, onderdelen a en b, van de Algemene wet inzake rijksbelastingen][ref1], beschikt over notarieel
      verleden statuten waaruit de een sociaal belang behartigende doelstelling blijkt, dan wel, voor zover het gaat
      om verenigingen als bedoeld in [artikel 26 van Boek 2 van het Burgerlijk Wetboek][ref2] die niet beschikken over
      notarieel verleden statuten, over door die verenigingen verstrekte verklaringen waaruit de een sociaal belang
      behartigende doelstelling blijkt;


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel5c
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel26
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 5c
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '26'
  - number: 69.3.c
    text: |-
      de instelling die de desbetreffende onroerende zaak beheert en exploiteert, beschikt over notarieel verleden
      statuten waaruit blijkt dat de instelling zich ten doel stelt de onroerende zaak te beheren en exploiteren ten
      nutte van instellingen als bedoeld in de aanhef;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel69
  - number: 69.3.d
    text: de feitelijke werkzaamheden van de instelling, bedoeld in onderdeel c, overeenkomen met de doelstelling;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel69
  - number: 69.3.e
    text: |-
      de in de aanhef bedoelde algemeen nut beogende instelling en de instelling, bedoeld in onderdeel c, niet aan
      vennootschapsbelasting zijn onderworpen dan wel daarvan zijn vrijgesteld;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel69
  - number: 69.3.f
    text: |-
      de in de aanhef bedoelde instellingen en de instelling, bedoeld in onderdeel c, geen publiekrechtelijk lichaam
      zijn, en
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel69
  - number: 69.3.g
    text: de instelling, bedoeld in onderdeel c, beschikt over een eigen aansluiting.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel69
  - number: '69.4'
    text: |-
      Voor de toepassing van dit artikel en de op dit artikel berustende bepalingen wordt een statuut als bedoeld in
      [artikel 2, tweede lid, van Boek 2 van het Burgerlijk Wetboek][ref1] gelijkgesteld met notarieel verleden statuten
      indien dit statuut schriftelijk is vastgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel2
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '2'
  - number: '69.5'
    text: |-
      De teruggaven, bedoeld in het eerste en tweede lid, worden verleend aan de gebruiker van de desbetreffende
      onroerende zaak en bedragen 50 percent van de aan hem in rekening gebrachte belasting.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel69
  - number: '69.6'
    text: |-
      De teruggaaf, bedoeld in het derde lid, wordt verleend aan de instelling die de desbetreffende onroerende zaak
      beheert en exploiteert en bedraagt 50 percent van de aan haar in rekening gebrachte belasting.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel69
  - number: '69.7'
    text: |-
      Bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur worden voorwaarden en
      beperkingen gesteld waaronder de teruggaven, bedoeld in dit artikel, worden verleend.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel69
  - number: '69.8'
    text: Bij regeling van Onze Minister kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel69
  - number: '70.1'
    text: |-
      Op verzoek wordt aan de verbruiker teruggaaf van de belasting verleend met betrekking tot aardgas en elektriciteit
      die worden gebruikt op een in [artikel 64, eerste lid][ref1], bedoelde wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel64
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '64'
        hoofdstuk: VI
        afdeling: '5'
  - number: '70.2'
    text: |-
      Op verzoek wordt aan de verbruiker teruggaaf van de belasting verleend met betrekking tot elektriciteit die wordt
      gebruikt op een in [artikel 64, derde lid, eerste volzin, eerste aandachtsstreepje][ref1], bedoelde wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel64
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '64'
        hoofdstuk: VI
        afdeling: '5'
  - number: '70.3'
    text: |-
      Op verzoek wordt aan de verbruiker teruggaaf van de belasting verleend met betrekking tot aardgas dat wordt
      gebruikt op een in [artikel 64, derde lid, eerste volzin, tweede aandachtsstreepje, vierde en vijfde lid][ref1],
      bedoelde wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel64
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '64'
        hoofdstuk: VI
        afdeling: '5'
  - number: '70.4'
    text: |-
      Bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur worden voorwaarden en
      beperkingen gesteld waaronder de teruggaven, bedoeld in het eerste tot en met derde lid, worden verleend.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel70
  - number: '70.5'
    text: Bij regeling van Onze Minister kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel70
  - number: 70a.1
    text: |-
      Onder bij algemene maatregel van bestuur te stellen voorwaarden en beperkingen wordt op verzoek teruggaaf van
      belasting verleend voor aardgas dat wordt gebruikt als brandstof voor vaartuigen op communautaire wateren, met
      inbegrip van de visserij.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel70a
  - number: 70a.2
    text: |-
      De teruggaaf, bedoeld in het eerste lid, wordt niet verleend voor aardgas dat wordt gebruikt als brandstof voor
      particuliere pleziervaartuigen.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel70a
  - number: 70a.3
    text: |-
      Voor de toepassing van deze wet en de daarop berustende bepalingen wordt onder een particulier pleziervaartuig
      verstaan een vaartuig dat wordt gebruikt door de eigenaar daarvan of door de natuurlijke of rechtspersoon die het
      gebruik daarvan geniet door huur of anderszins, voor andere dan commerciële doeleinden en met name voor andere
      doeleinden dan voor het vervoer van personen of goederen of voor het verrichten van diensten onder bezwarende
      titel, dan wel ten behoeve van overheidsinstanties.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel70a
  - number: 70a.4
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel70a
  - number: '71.1'
    text: |-
      De belastingplichtigen, bedoeld in [artikel 53, eerste en tweede lid][ref1], voeren een administratie waaruit
      duidelijk alle gegevens blijken die voor de heffing van de belasting van belang kunnen zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel53
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '53'
        hoofdstuk: VI
        afdeling: '2'
  - number: '71.2'
    text: |-
      Bij regeling van Onze Minister worden regels gesteld omtrent de wijze waarop aan de in het eerste lid bedoelde
      verplichting wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel71
  - number: '71.3'
    text: |-
      Bij regeling van Onze Minister worden voorwaarden gesteld aan de administratie van een installatie waarin
      zuivere biomassa zodanig wordt verwerkt dat daaruit elektriciteit wordt opgewekt of waarin stortgas,
      rioolwaterzuiveringsgas of biogas wordt gewonnen.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel71
  - number: 71h
    text: |-
      Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder: -
      *afvalverbrandingsinstallatie:* afvalverbrandingsinstallatie of afvalmeeverbrandingsinstallatie als bedoeld
      in artikel 3, veertigste, onderscheidenlijk eenenveertigste, lid, van [Richtlijn 2010/75](32010L0075)/
      EU van het Europees Parlement en de Raad van 24 november 2010 inzake industriële emissies (geïntegreerde
      preventie en bestrijding van verontreiniging) (PbEU 2010, L 334) waarin blijkens een op grond van de
      [Wet algemene bepalingen omgevingsrecht][ref1] afgegeven omgevingsvergunning huishoudelijke afvalstoffen, gemengde
      bedrijfsafvalstoffen of gemengd sorteerresidu mogen worden verbrand, en die geen broeikasinstallatie is;
        - *broeikasgas:* broeikasgas als bedoeld in [artikel 1.1, eerste lid, van de Wet milieubeheer][ref2];
        - *broeikasgasinstallatie:* broeikasgasinstallatie als bedoeld in de [artikelen 16.1, tweede lid][ref3], en
      [16.3 van de Wet milieubeheer][ref4];
        - *dispensatierecht:* overdraagbaar recht om gedurende het kalenderjaar een emissie van één ton kooldioxide-
      equivalent in de lucht te veroorzaken in het kalenderjaar waarin die uitstoot plaatsvindt zonder dat de CO-heffing
      industrie daarover wordt geheven;
        - *één ton kooldioxide-equivalent:* één ton kooldioxide-equivalent als bedoeld in
      [artikel 1.1, eerste lid, van de Wet milieubeheer][ref5];
        - *industrieel emissieverslag:* industrieel emissieverslag als bedoeld in
      [artikel 16b.1, eerste lid, van de Wet milieubeheer][ref6];
        - *industriële installatie:* broeikasgasinstallatie, afvalverbrandingsinstallatie of lachgasinstallatie;
        - *industriële jaarvracht:* aantal ton kooldioxide-equivalent van een industriële installatie in een kalenderjaar
      dat in de lucht is veroorzaakt en ter zake waarvan de CO-heffing industrie wordt geheven;
        - *lachgasinstallatie:* installatie die blijkens een op grond van de [Wet algemene bepalingen omgevingsrecht][ref7]
      afgegeven omgevingsvergunning bestemd is voor de productie van acrylonitril of caprolactam en die geen
      broeikasgasinstallatie is;
        - *meetbare warmte:* meetbare warmte als bedoeld in artikel 2, zevende lid, van de Gedelegeerde Verordening
      (EU) 2019/331 van de Commissie van 19 december 2018 tot vaststelling van een voor de hele Unie geldende
      overgangsregeling voor de geharmoniseerde kosteloze toewijzing van emissierechten overeenkomstig artikel 10 bis van
      [Richtlijn 2003/87/EG](32003L0087) van het Europees Parlement en de Raad (PbEU 2019, L 59);
        - *Restgassen*: afgas als bedoeld in artikel 2, elfde lid, van de Verordening kosteloze toewijzing van
      emissierechten;
        - *stadsverwarming:* stadsverwarming als bedoeld in artikel 2, vierde lid, van de Gedelegeerde Verordening
      (EU) nr. 2019/331 van de Commissie van 19 december 2018 tot vaststelling van een voor de hele Unie geldende
      overgangsregeling voor de geharmoniseerde kosteloze toewijzing van emissierechten overeenkomstig artikel 10 bis van
      [Richtlijn 2003/87/EG](32003L0087) van het Europees Parlement en de Raad (PbEU 2019, L 59).


      [ref1]: https://wetten.overheid.nl/BWBR0024779
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref5]: https://wetten.overheid.nl/BWBR0003245#Artikel1
      [ref6]: https://wetten.overheid.nl/BWBR0003245#Artikel16b
      [ref7]: https://wetten.overheid.nl/BWBR0024779
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel71h
    references:
      - id: ref1
        bwb_id: BWBR0024779
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '16'
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '16'
      - id: ref5
        bwb_id: BWBR0003245
        artikel: '1'
      - id: ref6
        bwb_id: BWBR0003245
        artikel: 16b
      - id: ref7
        bwb_id: BWBR0024779
  - number: 71i
    text: |-
      Dit hoofdstuk is van toepassing op industriële installaties met uitzondering van broeikasgasinstallaties die direct
      of indirect uitsluitend worden geëxploiteerd voor:
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel71i
  - number: 71i.a
    text: het in een kas telen van gewassen;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel71i
  - number: 71i.b
    text: stadsverwarming;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel71i
  - number: 71i.c
    text: |-
      het verwarmen of koelen van ruimten van gebouwen of locaties, daaronder begrepen het nagenoeg uitsluitend verwarmen
      of koelen van ruimten van gebouwen of locaties, en de meetbare warmte niet wordt gebruikt voor de productie van
      producten en daarmee verband houdende activiteiten; of
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel71i
  - number: 71i.d
    text: het opwekken van elektriciteit zonder het gebruik van restgassen als brandstof.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel71i
  - number: 71j.1
    text: 'Onder de naam *CO-heffing industrie* wordt een belasting geheven ter zake van:'
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel71j
  - number: 71j.1.a
    text: de emissie van broeikasgas door een broeikasgasinstallatie;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel71j
  - number: 71j.1.b
    text: de emissie van kooldioxide door een afvalverbrandingsinstallatie; of
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel71j
  - number: 71j.1.c
    text: de emissie van kooldioxide en distikstofoxide door een lachgasinstallatie.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel71j
  - number: 71j.2
    text: 'Van de heffing zijn uitgezonderd de emissies door broeikasgasinstallaties:'
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel71j
  - number: 71j.2.a
    text: als gevolg van het opwekken van elektriciteit zonder het gebruik van restgassen als brandstof; of
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel71j
  - number: 71j.2.b
    text: |-
      als gevolg van het opwekken van meetbare warmte die wordt uitgevoerd ten behoeve van stadsverwarming indien de
      broeikasgasinstallatie in het belastingtijdvak meer dan driekwart van zijn totaal geproduceerde meetbare warmte in
      dat belastingtijdvak heeft uitgevoerd ten behoeve van stadsverwarming.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel71j
  - number: 71j.3
    text: |-
      Van de heffing is uitgezonderd de emissie van kooldioxide door broeikasgasinstallaties en
      afvalverbrandingsinstallaties die worden overgedragen voor geologische opslag en waarbij wordt voldaan aan bij
      ministeriële regeling te stellen voorwaarden.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel71j
  - number: 71k.1
    text: De CO-heffing industrie wordt geheven van degene die een industriële installatie exploiteert.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel71k
  - number: 71k.2
    text: |-
      De exploitant van een broeikasgasinstallatie is de exploitant, bedoeld in
      [artikel 16.11, eerste lid, tweede zin, van de Wet milieubeheer][ref1]. De exploitant
      van een afvalverbrandingsinstallatie is degene aan wie de omgevingsvergunning, bedoeld in
      [artikel 71h, onderdeel a][ref2], is verleend. De exploitant van een lachgasinstallatie is degene aan wie de
      omgevingsvergunning, bedoeld in artikel 71h, onderdeel i, is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel71h
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel71k
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0007168
        artikel: 71h
        hoofdstuk: VIB
        afdeling: '1'
  - number: 71k.3
    text: |-
      Indien de werking van een industriële installatie is beëindigd, wordt de belasting geheven van degene die als
      laatste de industriële installatie heeft geëxploiteerd.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel71k
  - number: 71l.1
    text: |-
      De belasting wordt berekend over de industriële jaarvracht van een industriële installatie in het belastingtijdvak
      verminderd met het aantal dispensatierechten voor die industriële installatie in hetzelfde belastingtijdvak.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel71l
  - number: 71l.2
    text: De grondslag is niet lager dan nihil.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel71l
  - number: 71m.1
    text: De industriële jaarvracht is overeenkomstig hetgeen is vermeld in het industrieel emissieverslag.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel71m
  - number: 71m.2
    text: |-
      Indien het bestuur van de Nederlandse emissieautoriteit de industriële jaarvracht ambtshalve heeft vastgesteld
      als bedoeld in [artikel 16b.6, vierde lid, van de Wet milieubeheer][ref1] en die vaststelling is onherroepelijk
      geworden, is de industriële jaarvracht overeenkomstig die vaststelling.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16b
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel71m
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: 16b
  - number: 71n.1
    text: |-
      Het aantal dispensatierechten is het aantal dispensatierechten dat de exploitant voor een industriële
      installatie op 1 september van het jaar na afloop van het belastingtijdvak op zijn rekening heeft als bedoeld in
      [artikel 16b.16, eerste lid, van de Wet milieubeheer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16b
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel71n
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: 16b
  - number: 71n.2
    text: |-
      Indien het bestuur van de Nederlandse emissieautoriteit op of na de datum, genoemd in het eerste lid, op de rekening
      dispensatierechten stort of afboekt als bedoeld in [artikel 16b.16, vierde lid, van de Wet milieubeheer][ref1], is
      het aantal dispensatierechten het aantal dispensatierechten dat na die storting of afboeking op de rekening staat.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16b
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel71n
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: 16b
  - number: 71o
    text: De belasting wordt verschuldigd op het tijdstip waarop de emissie van broeikasgas plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel71o
  - number: 71p.1
    text: Het tarief bedraagt per ton kooldioxide-equivalent € 30,48.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel71p
  - number: 71p.2
    text: |-
      Bij aanvang van ieder kalenderjaar na het kalenderjaar 2021 tot en met kalenderjaar 2030 wordt, alvorens
      [artikel 90][ref1] wordt toegepast, het tarief verhoogd met € 10,73.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel90
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel71p
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '90'
        hoofdstuk: IX
        afdeling: '2'
  - number: 71p.3
    text: |-
      Voor een broeikasgasinstallatie wordt het tarief verminderd met de termijnkoers van het broeikasgasemissierecht.
      Het tarief is niet lager dan nihil. De termijnkoers van het broeikasgasemissierecht, bedoeld in het tweede
      lid, is voor een kalenderjaar het gewone gemiddelde, in euro, van de dagelijkse éénjaarstermijnkoersen van
      broeikasgasemissierechten (slotverkoopkoersen) voor levering in december van het jaar waarvoor het tarief wordt
      vastgesteld overeenkomstig het tweede lid, zoals waargenomen van 1 september tot en met 31 oktober voorafgaand aan
      dat jaar op de koolstofbeurs in de Europese Unie met het hoogste handelsvolume van broeikasgasemissierechten in
      die maanden.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel71p
  - number: 71p.4
    text: |-
      Het derde lid is niet van toepassing voor zover de grondslag hoger is door de overdracht van dispensatierechten,
      bedoeld in [afdeling 16b.3.3, van de Wet milieubeheer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Afdeling16b.3.3
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel71p
    references:
      - id: ref1
        bwb_id: BWBR0003245
        afdeling: 16b.3.3
  - number: 71q.1
    text: |-
      Indien voor een industriële installatie het aantal dispensatierechten van een belastingtijdvak de industriële
      jaarvracht van dat belastingtijdvak overtreft, gebruikt de exploitant dat overschot aan dispensatierechten voor
      een herberekening van de belasting die is betaald voor die industriële installatie over de vijf belastingtijdvakken
      voorafgaand aan het eerstgenoemde belastingtijdvak.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel71q
  - number: 71q.2
    text: |-
      Het belastingtijdvak dat wordt herberekend, ligt in de periode 2021 tot en met 2029. De herberekening geschiedt in
      de volgorde beginnend met het oudste belastingtijdvak voorafgaand aan het meest recente belastingtijdvak.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel71q
  - number: 71q.3
    text: |-
      Voor de herberekening wordt het tarief gebruikt dat van toepassing was op het belastingtijdvak dat wordt
      herberekend.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel71q
  - number: 71q.4
    text: |-
      Indien uit de herberekening blijkt dat over een bepaald belastingtijdvak een teveel aan belasting is betaald,
      wordt dat bedrag aan teveel betaalde belasting in mindering gebracht op de belasting verschuldigd over het
      belastingtijdvak waarover aangifte wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel71q
  - number: 71r.1
    text: |-
      Voor de heffing en invordering van de belasting wordt voor de toepassing van de
      [Algemene wet inzake rijksbelastingen][ref1], de [Invorderingswet 1990][ref2] en de op die wetten berustende
      bepalingen onder rijksbelastingdienst verstaan de Dienst Nederlandse Emissieautoriteit. Hierbij staat deze dienst
      onder het gezag van de Minister van Financiën.


      [ref1]: https://wetten.overheid.nl/BWBR0002320
      [ref2]: https://wetten.overheid.nl/BWBR0004770
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel71r
    references:
      - id: ref1
        bwb_id: BWBR0002320
      - id: ref2
        bwb_id: BWBR0004770
  - number: 71r.2
    text: |-
      Indien het bestuur van de Nederlandse emissieautoriteit ambtshalve de industriële jaarvracht heeft vastgesteld
      als bedoeld in [artikel 16b.6, vierde lid, van de Wet milieubeheer][ref1] of ambtshalve het aantal
      dispensatierechten heeft vastgesteld als bedoeld in [artikel 16b.24, vierde lid, van de Wet milieubeheer][ref2],
      en die vaststelling is onherroepelijk geworden op een tijdstip na vier jaren en tien maanden
      na het tijdvak waarin de belasting verschuldigd is geworden, vervalt, in afwijking van
      [artikel 20, derde lid, van de Algemene wet inzake rijksbelastingen][ref3], de bevoegdheid tot
      het opleggen van een naheffingsaanslag, en vervalt, in afwijking van de [artikelen 67c][ref4] en
      [67f van die laatstgenoemde wet][ref5], de bevoegdheid tot het opleggen van de boeten twee maanden na het hiervoor
      bedoelde tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16b
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel16b
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel20
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel67c
      [ref5]: https://wetten.overheid.nl/BWBR0002320#Artikel67f
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel71r
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: 16b
      - id: ref2
        bwb_id: BWBR0003245
        artikel: 16b
      - id: ref3
        bwb_id: BWBR0002320
        artikel: '20'
      - id: ref4
        bwb_id: BWBR0002320
        artikel: 67c
      - id: ref5
        bwb_id: BWBR0002320
        artikel: 67f
  - number: 71r.3
    text: |-
      In afwijking van de [artikelen 10, tweede lid][ref1], en
      [19, eerste lid, van de Algemene wet inzake rijksbelastingen][ref2] worden de in een tijdvak verschuldigd geworden
      belasting voldaan en de daarop betrekking hebbende aangifte gedaan uiterlijk 1 oktober van het jaar volgend op
      dat tijdvak.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel19
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel71r
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '19'
  - number: 71r.4
    text: |-
      Bestaande geheimhoudingsbepalingen staan er niet aan in de weg dat de ambtenaren van de Dienst Nederlandse
      Emissieautoriteit gegevens of informatie verkregen op grond van deze afdeling gebruiken voor de taken, bedoeld in
      [hoofdstuk 16b van de Wet milieubeheer][ref1], dan wel gegevens of informatie verkregen op grond van de taken,
      bedoeld in hoofdstuk 16b van de Wet milieubeheer, gebruiken voor de taak, bedoeld in deze afdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk16b
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel71r
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: 16b
  - number: 71s
    text: |-
      Het bestuur van de Nederlandse emissieautoriteit verstrekt de inspecteur en de ontvanger de gegevens die
      noodzakelijk zijn voor de uitvoering van de CO-heffing industrie.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel71s
  - number: '72'
    text: |-
      Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder: - *luchthaven:*
      luchthaven als bedoeld in [artikel 1.1, eerste lid, van de Wet luchtvaart][ref1] voorzien van een start- en
      landingsbaan van ten minste 2.100 meter, voor zover die luchthaven als burgerluchthaven dan wel, indien het een
      militaire luchthaven betreft, mede door andere dan militaire luchtvaart wordt gebruikt;
        - *exploitant van de luchthaven:* rechtspersoon of natuurlijke persoon die de luchthaven
      als onderneming drijft; hieronder wordt mede begrepen de burgerexploitant, bedoeld in
      [artikel 1.1, eerste lid, van de Wet luchtvaart][ref2];
        - *vliegtuig:* gemotoriseerd vliegtuig met een maximaal toegelaten startgewicht van meer dan 8.616 kilogram, met
      uitzondering van vliegtuigen in gebruik bij de Nederlandse of een bondgenootschappelijke krijgsmacht;
        - *luchtvaartmaatschappij:* luchtvaartmaatschappij als bedoeld in
      [artikel 1.1, eerste lid, van de Wet luchtvaart][ref3], alsmede ieder ander op wiens naam een vliegtuig is
      ingeschreven in het register, bedoeld in [artikel 3.3, tweede lid, van de Wet luchtvaart][ref4], dan wel is
      ingeschreven in een buitenlands register van luchtvaartuigen;
        - *passagier:* natuurlijk persoon van 2 jaar of ouder die anders dan als lid van het boordpersoneel wordt vervoerd
      met een vliegtuig;
        - *lid van het boordpersoneel:* lid van het boordpersoneel als bedoeld in
      [artikel 1.1, eerste lid, van de Wet luchtvaart][ref5], alsmede ieder die uitsluitend wordt vervoerd om aan boord
      van een ander vliegtuig tijdens een vlucht van dat andere vliegtuig werkzaamheden als lid van het boordpersoneel
      te verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0005555#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0005555#Artikel1
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0005555
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0005555
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0005555
        artikel: '1'
  - number: '73.1'
    text: |-
      Onder de naam vliegbelasting wordt een belasting geheven ter zake van het vertrek van een passagier met een
      vliegtuig vanaf een in Nederland gelegen luchthaven.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel73
  - number: '73.2'
    text: 'Als vertrek van een passagier wordt niet aangemerkt het vertrek vanaf een luchthaven indien:'
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel73
  - number: 73.2.a
    text: |-
      dat vertrek als onderdeel van één vervoersovereenkomst plaatsvindt aansluitend op het moment van aankomst van de
      passagier met een vliegtuig op die luchthaven;
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel73
  - number: 73.2.b
    text: de aansluiting de belangrijkste reden is voor het gebruik van de luchthaven; en
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel73
  - number: 73.2.c
    text: |-
      de passagier het gebied van de luchthaven, dat een vertrekkende passagier alleen mag betreden met een geldig
      vervoersbewijs, tussen het moment van aankomst en het moment van vertrek niet langer dan 24 uur heeft verlaten.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel73
  - number: '74'
    text: De belasting wordt geheven van de exploitant van de luchthaven.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel74
  - number: '75'
    text: De vliegbelasting wordt berekend over het aantal passagiers dat met een vliegtuig vertrekt van de luchthaven.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel75
  - number: '76'
    text: |-
      De vliegbelasting wordt verschuldigd op het tijdstip waarop de passagier met een vliegtuig vertrekt van de
      luchthaven.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel76
  - number: '77'
    text: Het tarief bedraagt € 7,845 per passagier.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel77
  - number: '78'
    text: |-
      Bij regeling van Onze Minister kunnen nadere regels worden gesteld omtrent de wijze waarop de belastingplichtige
      een administratie moet voeren voor de toepassing van de vliegbelasting.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel78
  - number: '79.1'
    text: |-
      De luchtvaartmaatschappij verstrekt aan de exploitant van de luchthaven de gegevens die nodig zijn voor een juiste
      toepassing van dit hoofdstuk. De verstrekking van deze gegevens vindt plaats gelijktijdig met de verstrekking van
      de gegevens die de luchtvaartmaatschappij als gebruiker van de luchthaven verplicht is aan de exploitant van de
      luchthaven te verstrekken.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel79
  - number: '79.2'
    text: |-
      De luchtvaartmaatschappij is gehouden tot betaling van de vliegbelasting die de exploitant van de luchthaven bij
      haar in rekening brengt, voor zover deze belasting door de exploitant van de luchthaven is verschuldigd ter zake
      van het vertrek van passagiers met een vliegtuig van die luchtvaartmaatschappij.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel79
  - number: '89.1'
    text: De in een tijdvak verschuldigd geworden belasting moet op aangifte worden voldaan.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel89
  - number: '89.2'
    text: |-
      Indien de berekening van de verschuldigde belasting leidt tot een negatief bedrag verleent de inspecteur op verzoek
      van de belastingplichtige teruggaaf van dit bedrag. Het verzoek om teruggaaf geschiedt bij de aangifte over het
      tijdvak waarover de belasting berekend is.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel89
  - number: '90'
    text: |-
      De [artikelen 10.1][ref1] en [10.2 van de Wet inkomstenbelasting 2001][ref2] zijn van overeenkomstige toepassing
      op de in de [artikelen 18][ref3], [28][ref4], [43][ref5], [59, eerste en derde lid][ref6], [60, eerste lid][ref7],
      [71p, eerste en tweede lid][ref8], en [77][ref9] vermelde bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0007168#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0007168#Artikel28
      [ref5]: https://wetten.overheid.nl/BWBR0007168#Artikel43
      [ref6]: https://wetten.overheid.nl/BWBR0007168#Artikel59
      [ref7]: https://wetten.overheid.nl/BWBR0007168#Artikel60
      [ref8]: https://wetten.overheid.nl/BWBR0007168#Artikel71p
      [ref9]: https://wetten.overheid.nl/BWBR0007168#Artikel77
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '10'
