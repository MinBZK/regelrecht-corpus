  - number: '91.2'
    text: |-
      Binnen acht weken na ontvangst van het verzoek geeft de inspecteur een beschikking op dat verzoek, dan wel zendt
      hij de in het derde lid bedoelde kennisgeving.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel91
  - number: '91.3'
    text: |-
      Indien de inspecteur de beschikking niet binnen de in het tweede lid genoemde termijn kan geven, stelt hij de
      belanghebbende daarvan onder opgaaf van redenen in kennis en noemt hij de termijn waarop de beschikking wel zal
      worden gegeven.
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel91
  - number: '91.4'
    text: |-
      [Paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref1] is van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0007168/2021-10-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: 91.4.a
    text: |-
      verzoeken aan de inspecteur tot aanwijzing van een teruggaaftijdvak op grond van bepalingen krachtens
      [artikel 45, derde lid][ref1];


