  - number: '38.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen ter verzekering van een juiste toepassing van de wet nadere regels worden
      gesteld ter aanvulling van de in deze wet geregelde onderwerpen.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel38
  - number: '38.2'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van de in het eerste
      lid bedoelde algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel38
  - number: 38a
    text: |-
      Onze Ministers zenden binnen twee en een half jaar na de inwerkingtreding van de bepalingen inzake de
      grondwaterbelasting en de afvalstoffenbelasting aan de Staten-Generaal een verslag over de uitvoerbaarheid van deze
      bepalingen alsmede over de mogelijk in de praktijk gebleken negatieve milieu-effecten en economische problemen.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel38a
  - number: 38b
    text: |-
      Onze Minister zendt in overeenstemming met Onze Minister van Economische Zaken en Onze Minister van
      Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer uiterlijk 1 juli 2002 aan de Staten-Generaal een verslag
      over de uitvoering en de werking van [artikel 36p][ref1] alsmede over de wenselijkheid van handhaving van de
      desbetreffende regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel36p
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel38b
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: 36p
        hoofdstuk: VA
        afdeling: '9'
  - number: '39'
    text: De inwerkingtreding van deze wet wordt bij wet geregeld.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel39
  - number: '40'
    text: 'Deze wet wordt aangehaald als: Wet belastingen op milieugrondslag.'
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel40
