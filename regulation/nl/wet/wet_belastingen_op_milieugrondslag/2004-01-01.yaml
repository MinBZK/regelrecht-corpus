        artikel: '27'
        hoofdstuk: IV
        afdeling: '6'
  - number: 37a
    text: |-
      De [artikelen 10.1][ref1] en [10.2 van de Wet inkomstenbelasting 2001][ref2] zijn van
      overeenkomstige toepassing op de in de [artikelen 9, eerste lid en derde lid][ref3], [10][ref4],
      [11g][ref5], [18, eerste lid, onderdeel a, en tweede lid][ref6], [25, eerste en vierde lid][ref7],
      [36i, eerste, derde, vierde, zesde, zevende en achtste lid][ref8], en [36l, eerste lid, onderdelen a en b][ref9],
      vermelde bedragen.


