---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_belastingen_op_milieugrondslag
regulatory_layer: WET
publication_date: '2023-12-27'
valid_from: '2004-01-01'
bwb_id: BWBR0007168
url: https://wetten.overheid.nl/BWBR0007168/2004-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is belastingen op grondwater, afvalstoffen en uranium-
    235 in te stellen en deze te zamen met de in de Wet milieubeheer opgenomen verbruiksbelastingen van brandstoffen te
    vervatten in één wet belastingen op milieugrondslag;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'Krachtens deze wet worden de volgende belastingen geheven:'
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel1
  - number: 1.a
    text: een belasting op grondwater;
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel1
  - number: 1.b
    text: een belasting op leidingwater;
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel1
  - number: 1.c
    text: een belasting op afvalstoffen;
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel1
  - number: 1.d
    text: een belasting op brandstoffen;
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel1
  - number: 1.e
    text: een energiebelasting.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel1
  - number: '2.1'
    text: 'Voor de toepassing van deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel2
  - number: 2.1.a
    text: 'Onze Minister: Onze Minister van Financiën;'
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel2
  - number: 2.1.b
    text: |-
      Onze Ministers: Onze Minister van Financiën en Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en
      Milieubeheer;
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel2
  - number: 2.1.c
    text: |-
      GN-code: een code als bedoeld in [verordening (EEG) nr. 2658/87](31987R2658) van de Raad van de Europese
      Gemeenschappen van 23 juli 1987 met betrekking tot de tarief- en statistieknomenclatuur en het gemeenschappelijk
      douanetarief (PbEG L 256), zoals deze luidt op 1 januari 2002.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel2
  - number: '2.2'
    text: |-
      Bij regeling van Onze Minister kunnen de GN-codes, genoemd in [artikel 20, eerste lid, onderdeel a][ref1], en
      [artikel 36a, eerste lid, onderdelen m, n en o][ref2], worden aangepast indien de overeenkomstige GN-codes zoals
      opgenomen in de [richtlijn nr. 2003/96/EG](32003L0096) van de Raad van de Europese Unie van 27 oktober 2003 tot
      herstructurering van de communautaire regeling voor de belasting van energieproducten en elektriciteit (PbEG
      L 283), in overeenstemming met artikel 2, lid vijf, van die richtlijn zijn aangepast. In dat geval kan bij regeling
      van Onze Minister eveneens de datum in het eerste lid, onderdeel c, worden vervangen door de datum van de versie
      van de in dat onderdeel bedoelde verordening die aan de wijziging van de GN-codes ten grondslag heeft gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel36a
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '20'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0007168
        artikel: 36a
        hoofdstuk: VA
        afdeling: '1'
  - number: '3.1'
    text: 'Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel3
  - number: 3.1.a
    text: 'grondwater: zoet grondwater;'
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel3
  - number: 3.1.b
    text: 'zoet grondwater: grondwater dat minder dan 300 milligram chloride per liter bevat;'
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel3
  - number: 3.1.c
    text: |-
      een inrichting: een inrichting als bedoeld in de [Grondwaterwet][ref1], bestemd tot het onttrekken van grondwater;


      [ref1]: https://wetten.overheid.nl/BWBR0003406
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003406
  - number: 3.1.d
    text: 'onttrekken van grondwater: het onttrekken van grondwater aan de bodem door middel van een inrichting;'
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel3
  - number: 3.1.e
    text: |-
      infiltreren van water: water in de bodem brengen ter aanvulling van het grondwater met het oog op het onttrekken
      van grondwater;
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel3
  - number: 3.1.f
    text: 'pompcapaciteit: het maximum wateropbrengend vermogen van een inrichting in kubieke meters per uur;'
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel3
  - number: 3.1.g
    text: |-
      een waterleidingbedrijf: een waterleidingbedrijf in de zin van de [Waterleidingwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002246
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002246
  - number: 3.1.h
    text: |-
      OEDI: een door Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer aangewezen gecombineerde
      inrichting voor grondwaterwinning met voorschakeling van oeverfiltratie en diepinfiltratie.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel3
  - number: '3.2'
    text: |-
      Inrichtingen tot het onttrekken van grondwater die een samenhangend geheel vormen, worden als één inrichting
      aangemerkt.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel3
  - number: '3.3'
    text: |-
      Als waterleidingbedrijf wordt mede aangemerkt de persoon die of het lichaam dat op zichzelf niet een
      waterleidingbedrijf is in de zin van de [Waterleidingwet][ref1], doch met een dergelijk bedrijf in financieel,
      organisatorisch en economisch opzicht zodanig is verweven dat die persoon of dat lichaam met dat bedrijf een
      eenheid vormt.


      [ref1]: https://wetten.overheid.nl/BWBR0002246
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002246
  - number: '3.4'
    text: |-
      Onze Minister kan bij ministeriële regeling regels stellen omtrent de wijze waarop de pompcapaciteit van een
      inrichting bepaald wordt.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel3
  - number: '3.5'
    text: 'Dit hoofdstuk is niet van toepassing op het onttrekken van grondwater:'
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel3
  - number: 3.5.a
    text: bij de ontwatering of afwatering van gronden;
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel3
  - number: 3.5.b
    text: |-
      bij of ten behoeve van het ontginnen van mijnen, voor zover het onttrekken een uitvloeisel daarvan is en op een
      diepte van niet minder dan 500 meter - N.A.P. plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel3
  - number: '4'
    text: Onder de naam grondwaterbelasting wordt een belasting geheven ter zake van het onttrekken van grondwater.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel4
  - number: '5'
    text: De belasting wordt geheven van de houder van een inrichting.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel5
  - number: '6.1'
    text: De belasting wordt berekend over de onttrokken hoeveelheid grondwater, gemeten in kubieke meters.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel6
  - number: '6.2'
    text: |-
      Op de belasting wordt een vermindering toegepast, berekend over het aantal kubieke meters geïnfiltreerd water,
      indien het infiltreren van water geschiedt in overeenstemming met de voorwaarden welke daartoe zijn gesteld in de
      vergunning die voor het onttrekken of voor het infiltreren van water is verleend ingevolge de [Grondwaterwet][ref1]
      en voor zover het infiltreren van water geschiedt in rechtstreeks verband met een belaste onttrekking van
      grondwater.


      [ref1]: https://wetten.overheid.nl/BWBR0003406
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003406
  - number: '6.3'
    text: |-
      Op voordracht van Onze Ministers kunnen bij algemene maatregel van bestuur regels worden gesteld omtrent de wijze
      waarop het aantal kubieke meters van de onttrekking onderscheidenlijk de infiltratie van water wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel6
  - number: '6.4'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel6
  - number: '7'
    text: De belasting wordt verschuldigd op het tijdstip van onttrekking.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel7
  - number: '8'
    text: 'Vrijgesteld zijn de volgende onttrekkingen van grondwater:'
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel8
  - number: 8.a
    text: |-
      onttrekking door middel van een inrichting met een pompcapaciteit die niet meer bedraagt dan 10 kubieke meters
      per uur;
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel8
  - number: 8.b
    text: |-
      onttrekking door middel van een inrichting die uitsluitend wordt gebruikt voor het drooghouden van een bouwput ten
      behoeve van bouw- en waterbouwkundige werken, indien de te onttrekken hoeveelheid grondwater niet meer bedraagt dan
      50 000 kubieke meters per maand en de onttrekking niet langer duurt dan 4 achtereenvolgende maanden;
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel8
  - number: 8.c
    text: |-
      onttrekking door middel van een inrichting die bij wijze van proef grondwater aan de bodem onttrekt, indien de te
      onttrekken hoeveelheid grondwater niet meer bedraagt dan 50 000 kubieke meters per maand en de onttrekking niet
      langer duurt dan 4 achtereenvolgende maanden;
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel8
  - number: 8.d
    text: |-
      onttrekking door middel van een inrichting ten behoeve van noodvoorzieningen, waaronder mede worden verstaan
      brandputten, koeling van noodstroomaggregaten, sprinklerinstallaties en dergelijke, indien deze uitsluitend worden
      gebruikt voor buitengewone omstandigheden;
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel8
  - number: 8.e
    text: |-
      onttrekking door middel van een inrichting die uitsluitend of nagenoeg uitsluitend wordt gebruikt voor beregenings-
      of bevloeiingsdoeleinden, dan wel voor beide doeleinden, indien de te onttrekken hoeveelheid grondwater niet meer
      bedraagt dan 40 000 kubieke meters per jaar;
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel8
  - number: 8.f
    text: onttrekkingen ten behoeve van de sanering van het grondwater;
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel8
  - number: 8.g
    text: |-
      onttrekkingen ten behoeve van koude- en warmte-opslag door middel van een inrichting waarbij grondwater wordt
      onttrokken en vervolgens in een gesloten systeem weer volledig wordt teruggevoerd in hetzelfde watervoerende pakket
      als waaraan het is onttrokken, in overeenstemming met de voorwaarden welke daartoe zijn gesteld in de vergunning
      die voor het onttrekken en terugvoeren van water is verleend ingevolge de [Grondwaterwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003406
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003406
  - number: 8.h
    text: onttrekkingen ten behoeve van het gebruik als spoelwater voor meermaals te gebruiken produktverpakkingen;
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel8
  - number: 8.i
    text: onttrekkingen ten behoeve van landijsbanen.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel8
  - number: '9.1'
    text: Het tarief bedraagt per kubieke meter onttrokken grondwater € 0,1785.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel9
  - number: '9.2'
    text: |-
      In afwijking van het eerste lid bedraagt het tarief nihil voor onttrekkingen door middel van een inrichting
      waarbij grondwater wordt onttrokken en vervolgens in een gesloten systeem weer volledig wordt teruggevoerd
      in hetzelfde watervoerende pakket als waaraan het is onttrokken, in overeenstemming met de voorwaarden welke
      daartoe zijn gesteld in de vergunning die voor het onttrekken en terugvoeren van water is verleend ingevolge de
      [Grondwaterwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003406
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003406
  - number: '9.3'
    text: |-
      In afwijking van het eerste lid bedraagt het tarief voor onttrekkingen met behulp van een OEDI per kubieke
      meter onttrokken grondwater € 0,0578 voor zover de in een jaar onttrokken hoeveelheid grondwater de in dat jaar
      geïnfiltreerde hoeveelheid water niet overschrijdt, met dien verstande dat in dat geval de onttrekking door middel
      van een oevergrondwaterwinning en de infiltratie niet in aanmerking worden genomen.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel9
  - number: '10'
    text: |-
      De in [artikel 6, tweede lid][ref1], bedoelde vermindering bedraagt per kubieke meter geïnfiltreerd water € 0,1495.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel6
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '6'
        hoofdstuk: II
        afdeling: '3'
  - number: 10a.1
    text: |-
      Aan degene die van een waterleidingbedrijf betrokken water gebruikt als spoelwater voor meermaals te gebruiken
      produktverpakkingen wordt op zijn verzoek door de inspecteur een teruggaaf verleend van de belasting op de
      betrokken hoeveelheid spoelwater.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel10a
  - number: 10a.2
    text: De inspecteur beslist op het verzoek, bedoeld in het eerste lid, bij een voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel10a
  - number: 10a.3
    text: |-
      Binnen acht weken na ontvangst van het verzoek geeft de inspecteur een beschikking op dat verzoek, dan wel zendt
      hij de in het vierde lid bedoelde kennisgeving.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel10a
  - number: 10a.4
    text: |-
      Indien de inspecteur de beschikking niet binnen de in het derde lid genoemde termijn kan geven, stelt hij
      belanghebbende daarvan onder opgaaf van redenen in kennis en noemt hij de termijn waarop de beschikking wel zal
      worden gegeven.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel10a
  - number: 10a.5
    text: |-
      Bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur worden voorwaarden en
      beperkingen gesteld waaronder de teruggaaf, bedoeld in het eerste lid, wordt verleend.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel10a
  - number: 10a.6
    text: Onze Minister kan bij ministeriële regeling nadere regels stellen ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel10a
  - number: '11.1'
    text: |-
      De belastingplichtige is gehouden een administratie te voeren zodanig dat daaruit de hoeveelheden van de
      onttrekkingen en van de infiltraties van water te allen tijde duidelijk blijken.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel11
  - number: '11.2'
    text: |-
      Bij ministeriële regeling kunnen door Onze Minister nadere regels worden gesteld omtrent de wijze waarop aan de in
      het eerste lid bedoelde verplichting moet worden voldaan.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel11
  - number: 11a
    text: 'Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel11a
  - number: 11a.a
    text: |-
      leidingwater: water dat door een waterleidingbedrijf of een afzonderlijke watervoorziening aan derden ter
      beschikking wordt gesteld, al dan niet van drinkwaterkwaliteit;
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel11a
  - number: 11a.b
    text: |-
      waterleidingbedrijf: een waterleidingbedrijf als bedoeld in de [Waterleidingwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002246
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0002246
  - number: 11a.c
    text: |-
      afzonderlijke watervoorziening: landgebonden voorziening, niet zijnde een waterleidingbedrijf, voor de winning
      of behandeling van water, dat met behulp van een leiding of distributienet als leidingwater ter beschikking wordt
      gesteld;
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel11a
  - number: 11a.d
    text: |-
      aansluiting: een aansluiting van een in Nederland gelegen onroerende zaak als bedoeld in
      [artikel 16, onderdelen a tot en met d, van de Wet waardering onroerende zaken][ref1], op het distributienet van
      een waterleidingbedrijf of van een afzonderlijke watervoorziening, waaruit leidingwater aan de verbruiker wordt
      geleverd; een aansluiting kan bestaan uit een of meer leveringspunten;


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel16
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '16'
  - number: 11a.e
    text: |-
      particuliere installatie voor centrale watervoorziening: een voorziening voor de levering van water aan meer dan
      een onroerende zaak als bedoeld in [artikel 16, onderdeel c, van de Wet waardering onroerende zaken][ref1], welke
      installatie permanent is aangesloten op het distributienet van een waterleidingbedrijf of van een afzonderlijke
      watervoorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel16
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '16'
  - number: 11b
    text: Onder de naam belasting op leidingwater wordt een belasting geheven op leidingwater.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel11b
  - number: 11c.1
    text: |-
      De belasting wordt geheven ter zake van de levering van leidingwater via een aansluiting aan de verbruiker,
      met dien verstande dat de belasting wordt geheven over een hoeveelheid van maximaal 300 kubieke meter per
      verbruiksperiode van 12 maanden per aansluiting.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel11c
  - number: 11c.2
    text: |-
      Bij een verbruiksperiode korter dan wel langer dan 12 maanden wordt de in het eerste lid genoemde hoeveelheidsgrens
      naar evenredigheid verlaagd, onderscheidenlijk verhoogd.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel11c
  - number: 11c.3
    text: |-
      Bij de levering van leidingwater aan een particuliere installatie voor centrale watervoorziening wordt, in
      afwijking in zoverre van het eerste lid, de belasting geheven over de totale hoeveelheid geleverd water, met
      dien verstande dat, indien de exploitant van de installatie aan degene die het leidingwater heeft geleverd
      een verklaring heeft overgelegd waarin opgaaf wordt gedaan van het aantal onroerende zaken, bedoeld in
      [artikel 16, onderdeel c, van de Wet waardering onroerende zaken][ref1] dat door de installatie van water wordt
      voorzien, ten hoogste wordt geheven over een hoeveelheid van 300 kubieke meter vermenigvuldigd met dat aantal.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel16
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel11c
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '16'
  - number: 11c.4
    text: Bij regeling van Onze Minister kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel11c
  - number: 11d
    text: De belasting wordt geheven van degene die de levering verricht.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel11d
  - number: 11e.1
    text: De belasting wordt geheven per eenheid leidingwater, gemeten in kubieke meters.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel11e
  - number: 11e.2
    text: |-
      Ingeval de hoeveelheid geleverd leidingwater niet in kubieke meters bekend is, wordt de belasting geheven over een
      hoeveelheid die wordt berekend door het bedrag dat ter zake van de levering van water in rekening wordt gebracht,
      te verminderen met het vastrecht dat door de leverancier aan huishoudelijke verbruikers in rekening wordt gebracht
      indien wel een meter aanwezig is, en de uitkomst te delen door de prijs per kubieke meter die de leverancier in
      rekening brengt aan die verbruikers.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel11e
  - number: 11f.1
    text: 'De belasting wordt verschuldigd:'
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel11f
  - number: 11f.1.a
    text: |-
      in gevallen waarin een voorschotnota wordt uitgereikt of, indien geen voorschotnota wordt uitgereikt, een
      voorschotbedrag wordt ontvangen:
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel11f
  - number: 11f.1.a.1°
    text: |-
      op het tijdstip waarop een voorschotnota wordt uitgereikt onderscheidenlijk een voorschotbedrag wordt ontvangen;
      alsmede
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel11f
  - number: 11f.1.a.2°
    text: op het tijdstip van de uitreiking van de eindfactuur over een verbruiksperiode;
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel11f
  - number: 11f.1.b
    text: in andere gevallen op het tijdstip van de uitreiking van de factuur.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel11f
  - number: 11f.2
    text: |-
      Voor de toepassing van het eerste lid, onderdeel a, onder 1°, in samenhang met [artikel 11c, eerste lid][ref1],
      wordt de hoeveelheid water, waarop de voorschotnota dan wel het voorschotbedrag is gebaseerd, aangemerkt als
      geleverde hoeveelheid.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel11c
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel11f
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: 11c
        hoofdstuk: IIA
        afdeling: '2'
  - number: 11f.3
    text: |-
      Onder de in het eerste lid, onderdeel a, onder 2°, bedoelde eindfactuur wordt verstaan de factuur die wordt
      opgemaakt na afloop van een verbruiksperiode en waarin verrekening plaatsvindt met de op deze verbruiksperiode
      betrekking hebbende voorschotten.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel11f
  - number: 11f.4
    text: Bij regeling van Onze Minister kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel11f
  - number: 11g
    text: Het tarief bedraagt € 0,144 per kubieke meter.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel11g
  - number: 11h.1
    text: |-
      Vrijstelling van de belasting wordt verleend ter zake van de levering van leidingwater door middel van
      noodvoorzieningen, waaronder worden verstaan brandkranen, sprinklerinstallaties en dergelijke, indien deze
      uitsluitend worden gebruikt in buitengewone omstandigheden.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel11h
  - number: 11h.2
    text: |-
      Bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur kunnen regels worden gesteld
      ter effectuering van de toepassing van het eerste lid. Daarbij worden tevens regels gesteld inzake administratieve
      verplichtingen.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel11h
  - number: 11i.1
    text: |-
      Op verzoek wordt teruggaaf verleend van de belasting ter zake van de levering van leidingwater, voor zover de door
      de belastingplichtige, bedoeld in [artikel 11d][ref1], ter zake te ontvangen bedragen niet zijn en niet zullen
      worden ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel11d
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel11i
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: 11d
        hoofdstuk: IIA
        afdeling: '2'
  - number: 11i.2
    text: De inspecteur beslist op het verzoek, bedoeld in het eerste lid, bij een voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel11i
  - number: 11i.3
    text: |-
      Binnen acht weken na ontvangst van het verzoek geeft de inspecteur een beschikking op dat verzoek, dan wel zendt
      hij de in het vierde lid bedoelde kennisgeving.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel11i
  - number: 11i.4
    text: |-
      Indien de inspecteur de beschikking niet binnen de in het derde lid genoemde termijn kan geven, stelt hij
      belanghebbende daarvan onder opgaaf van redenen in kennis en noemt hij de termijn waarop de beschikking wel zal
      worden gegeven.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel11i
  - number: 11i.5
    text: |-
      Bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur worden nadere regels gesteld met
      betrekking tot de indiening van het verzoek en de wijze waarop kan worden aangetoond dat aan de voorwaarden voor
      teruggaaf wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel11i
  - number: 11i.6
    text: Bij regeling van Onze Minister kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel11i
  - number: 11j.1
    text: |-
      Op verzoek wordt teruggaaf van de belasting verleend voor zover de belasting over de hoeveelheden leidingwater die
      door een verbruiker in een verbruiksperiode van 12 maanden van verschillende leveranciers zijn betrokken, hoger is
      dan de belasting die zou zijn verschuldigd indien sprake was van één leverancier.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel11j
  - number: 11j.2
    text: De teruggaaf, bedoeld in het eerste lid, wordt verleend aan de verbruiker.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel11j
  - number: 11j.3
    text: |-
      [Artikel 11i, tweede tot en met zesde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel11i
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel11j
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: 11i
        hoofdstuk: IIA
        afdeling: '6'
  - number: 11k.1
    text: |-
      De belastingplichtige, bedoeld in [artikel 11d][ref1], is gehouden een administratie te voeren zodanig dat – voor
      zover dat voor de heffing van de belasting van belang kan zijn daaruit te allen tijde duidelijk blijken:


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel11d
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel11k
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: 11d
        hoofdstuk: IIA
        afdeling: '2'
  - number: 11k.1.a
    text: de gegevens betreffende de door hem verrichte leveringen;
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel11k
  - number: 11k.1.b
    text: |-
      de gegevens betreffende de toepassing van de in [artikel 11c, eerste lid][ref1], bedoelde hoeveelheidsgrens.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel11c
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel11k
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: 11c
        hoofdstuk: IIA
        afdeling: '2'
  - number: 11k.2
    text: |-
      Bij regeling van Onze Minister kunnen nadere regels worden gesteld omtrent de wijze waarop aan de in het eerste lid
      bedoelde verplichtingen moet worden voldaan.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel11k
  - number: '12.1'
    text: 'Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel12
  - number: 12.1.a
    text: |-
      afvalstoffen: afvalstoffen als bedoeld in de [Wet milieubeheer][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: 12.1.b
    text: |-
      verwijdering: storten of verbranden van afvalstoffen, met uitzondering van verbranden met een hoofdgebruik als
      brandstof of een hoofdgebruik voor een andere wijze van energieopwekking;
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel12
  - number: 12.1.ba
    text: |-
      nuttige toepassing: nuttige toepassing als bedoeld in de [Wet milieubeheer][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: 12.1.bb
    text: |-
      storten: storten als bedoeld in de [Wet milieubeheer][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: 12.1.c
    text: |-
      inrichting: een inrichting als bedoeld in de [Wet milieubeheer][ref1], werken daaronder niet begrepen, waarin
      afvalstoffen worden verwijderd;


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: 12.1.d
    text: |-
      niet-reinigbare verontreinigde baggerspecie: verontreinigde baggerspecie waarvan door middel van een verklaring
      van een door Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer aan te wijzen instelling is
      aangetoond dat deze niet reinigbaar is tot een nuttig toepasbaar product;
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel12
  - number: 12.1.e
    text: |-
      niet-reinigbare verontreinigde grond: verontreinigde grond waarvan door middel van een verklaring van een door Onze
      Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer aan te wijzen instelling is aangetoond dat deze
      niet reinigbaar is tot een nuttig toepasbaar product;
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel12
  - number: 12.1.f
    text: |-
      ontinktingsresidu: de afvalstof die bij papier- en kartonfabrieken die oud papier als grondstof inzetten, ontstaat
      tijdens het proces waarbij het oud papier wordt ontinkt door middel van een flotatie- of wasproces;
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel12
  - number: 12.1.g
    text: |-
      stoffen: chemische elementen en hun verbindingen, zoals deze voorkomen in de natuur dan wel door menselijk toedoen
      worden voortgebracht;
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel12
  - number: 12.1.h
    text: 'preparaten: mengsels of oplossingen van stoffen;'
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel12
  - number: 12.1.i
    text: 'volumieke massa: gewicht per volume-eenheid uitgedrukt in kilogram per kubieke meter;'
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel12
  - number: 12.1.j
    text: 'percolaat: vloeistof die uit gestorte afvalstoffen komt of daarmee in contact is geweest;'
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel12
  - number: 12.1.k
    text: 'stortgas: gas dat uit gestorte afvalstoffen vrijkomt als gevolg van biologische afbraakreacties.'
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel12
  - number: '12.2'
    text: |-
      Tot afvalstoffen worden niet gerekend die stoffen, preparaten en andere producten, die bestemd zijn te worden
      gebruikt voor bij algemene maatregel van bestuur aan te wijzen toepassingen die hetzij verband houden met de
      bedrijfsvoering van de inrichting, hetzij deel uitmaken van het bedrijfsproces dat leidt tot de nuttige toepassing
      of verwijdering van afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel12
  - number: '12.3'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld omtrent de bij de aanvraag van de verklaring, bedoeld in het
      eerste lid, onderdelen d en e, te verstrekken gegevens.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel12
  - number: '13.1'
    text: 'Onder de naam afvalstoffenbelasting wordt een belasting geheven ter zake van:'
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel13
  - number: 13.1.a
    text: de afgifte ter verwijdering van afvalstoffen aan een inrichting;
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel13
  - number: 13.1.b
    text: de verwijdering van afvalstoffen binnen de inrichting waarin deze zijn ontstaan.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel13
  - number: '13.2'
    text: De aan een inrichting afgegeven afvalstoffen worden geacht alle te zijn afgegeven ter verwijdering.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel13
  - number: '13.3'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel13
  - number: '14'
    text: De belasting wordt geheven van de houder van een inrichting.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel14
  - number: '15.1'
    text: De belasting wordt berekend over het gewicht van de afvalstoffen, gemeten in kilogrammen.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel15
  - number: '15.2'
    text: |-
      Door Onze Ministers kunnen bij ministeriële regeling regels worden gesteld omtrent de wijze waarop het gewicht van
      de afvalstoffen wordt bepaald.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel15
  - number: '16'
    text: 'De belasting wordt verschuldigd op het tijdstip waarop:'
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel16
  - number: 16.a
    text: |-
      de afvalstoffen, bedoeld in [artikel 13, eerste lid, onderdeel a][ref1], ter verwijdering worden afgegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel13
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '13'
        hoofdstuk: III
        afdeling: '2'
  - number: 16.b
    text: |-
      de afvalstoffen, bedoeld in [artikel 13, eerste lid, onderdeel b][ref1], binnen de inrichting waarin deze stoffen
      zijn ontstaan, worden verwijderd.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel13
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '13'
        hoofdstuk: III
        afdeling: '2'
  - number: '17.1'
    text: 'Vrijgesteld is de definitieve verwijdering van:'
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel17
  - number: 17.1.a
    text: |-
      baggerspecie voor zover de definitieve verwijdering geschiedt in een inrichting in de territoriale zee van
      Nederland;
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel17
  - number: 17.1.b
    text: baggerspecie door het storten ervan in oppervlaktewater dat in open verbinding staat met ander oppervlaktewater;
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel17
  - number: 17.1.c
    text: |-
      baggerspecie voor zover de definitieve verwijdering geschiedt in het kader van een door de minister van
      Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer aangewezen project inzake rivierverruiming, de baggerspecie
      afkomstig is uit het aangewezen projectgebied, en de baggerspecie wordt geborgen in dat projectgebied;
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel17
  - number: 17.1.d
    text: niet-reinigbare verontreinigde baggerspecie;
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel17
  - number: 17.1.e
    text: niet-reinigbare verontreinigde grond.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel17
  - number: '17.2'
    text: |-
      Bij regeling van Onze Minister worden voorwaarden en beperkingen gesteld waaronder de vrijstelling, bedoeld in het
      eerste lid, onderdelen a en b, wordt verleend.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel17
  - number: '18.1'
    text: 'Het tarief bedraagt in geval van:'
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel18
  - number: 18.1.a
    text: 'Het storten van afvalstoffen:  € 83,61 per 1000 kilogram;'
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel18
  - number: 18.1.b
    text: 'het verbranden van afvalstoffen: nihil.'
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel18
  - number: '18.2'
    text: 'In afwijking van het eerste lid, onderdeel a, bedraagt het tarief € 13,79 per 1000 kilogram voor:'
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel18
  - number: 18.2.a
    text: |-
      afvalstoffen die uitsluitend bestaan uit de categorieën van afvalstoffen, genoemd in
      [artikel 1, eerste lid, onder 17 en 21 van het Besluit stortplaatsen en stortverboden afvalstoffen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009094#Artikel1
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0009094
        artikel: '1'
  - number: 18.2.b
    text: |-
      gevaarlijke afvalstoffen als bedoeld in [artikel 1, eerste lid, van de Wet milieubeheer][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
  - number: 18.2.c
    text: afvalstoffen met een volumieke massa van meer dan 1100;
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel18
  - number: 18.2.d
    text: baggerspecie;
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel18
  - number: 18.2.e
    text: |-
      bij regeling van Onze Ministers aan te wijzen afvalstoffen die niet verbrandbaar en niet herbruikbaar zijn, die
      onvermengd zijn met andere afvalstoffen en die rechtstreeks door de producent worden aangeboden.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel18
  - number: '18.3'
    text: |-
      Bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur kunnen voorwaarden worden
      gesteld met betrekking tot de toepassing van het tweede lid.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel18
  - number: '18.4'
    text: |-
      Bij ministeriële regeling kunnen door Onze Ministers regels worden gesteld omtrent de wijze waarop de in het tweede
      lid bedoelde afvalstoffen moeten worden aangeboden.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel18
  - number: 18b.1
    text: |-
      Op verzoek wordt teruggaaf van belasting verleend met betrekking tot stoffen, preparaten of andere producten die de
      inrichting, al dan niet na nuttige toepassing, verlaten, met dien verstande dat geen teruggaaf wordt verleend voor
      percolaat of stortgas.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel18b
  - number: 18b.2
    text: |-
      Bij ministeriële regeling kunnen met betrekking tot de in het eerste lid bedoelde stoffen, preparaten of andere
      producten die nuttig zijn toegepast, nadere regels worden gesteld ter berekening van het terug te geven bedrag
      aan belasting.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel18b
  - number: 18b.3
    text: |-
      Indien bij de afgifte van een afzonderlijke, duidelijk herkenbare afvalstoffenstroom aan een inrichting bekend is
      dat deze niet uitsluitend bestaat uit voor verwijdering bestemde afvalstoffen, kan de inspecteur op schriftelijk
      verzoek van de belastingplichtige toestaan dat met betrekking tot die afvalstroom de totale hoeveelheid afgegeven
      afvalstoffen door toepassing van een verhoudingsgetal wordt herleid tot de hoeveelheid voor verwijdering afgegeven
      afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel18b
  - number: 18b.4
    text: |-
      Het verhoudingsgetal, bedoeld in het derde lid, wordt gebaseerd op de in het voorafgaande tijdvak gerealiseerde
      cijfers. Na afloop van het kalenderjaar vindt herrekening plaats op de voet van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel18b
  - number: 18b.5
    text: |-
      [Artikel 10a, tweede tot en met zesde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel10a
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel18b
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: 10a
        hoofdstuk: II
        afdeling: 4a
  - number: 18c.1
    text: |-
      Op verzoek wordt teruggaaf verleend van de belasting ter zake van de afgifte ter verwijdering van afvalstoffen,
      voor zover de door de belastingplichtige, bedoeld in [artikel 14][ref1], ter zake te ontvangen bedragen niet zijn
      en niet zullen worden ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel14
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel18c
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '14'
        hoofdstuk: III
        afdeling: '2'
  - number: 18c.2
    text: |-
      [Artikel 10a, tweede tot en met zesde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel10a
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel18c
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: 10a
        hoofdstuk: II
        afdeling: 4a
  - number: '19.1'
    text: |-
      De belastingplichtige is gehouden een administratie te voeren zodanig dat daaruit te allen tijde duidelijk blijken
      de aard, de hoeveelheid en de herkomst van de afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel19
  - number: '19.2'
    text: |-
      Bij ministeriële regeling kunnen door Onze Minister regels worden gesteld omtrent de wijze waarop de in het eerste
      lid bedoelde verplichting moet worden nagekomen.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel19
  - number: '19.3'
    text: |-
      De belastingplichtige is gehouden de administratie zodanig in te richten dat daarin op overzichtelijke wijze is
      opgenomen welke stoffen, preparaten of andere producten als bedoeld in [artikel 12, tweede lid][ref1], in welke
      hoeveelheden en op welk tijdstip de inrichting zijn binnengebracht dan wel hebben verlaten.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel12
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '12'
        hoofdstuk: III
        afdeling: '1'
  - number: '20'
    text: 'Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel20
  - number: 20.a
    text: 'kolen: producten van de GN-codes 2701, 2702 en 2704;'
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel20
  - number: 20.b
    text: |-
      brandstof: een stof – met inbegrip van alle daaraan toegevoegde stoffen – dienende voor verbranding met het doel
      de daarbij ontstane energie te benutten, bij welke verbranding verontreinigende stoffen in de buitenlucht kunnen
      geraken;
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel20
  - number: 20.c
    text: |-
      afleveren: het aan de voorraad onttrekken door een leverancier in verband met de afgifte aan of verzending naar
      een afnemer;
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel20
  - number: 20.d
    text: 'gebruiken: het aanwenden als brandstof.'
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel20
  - number: '21.1'
    text: Onder de naam brandstoffenbelasting wordt een belasting geheven op kolen.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel21
  - number: '21.2'
    text: De belasting wordt geheven ter zake van de aflevering of het gebruik van kolen.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel21
  - number: '21.3'
    text: |-
      De belasting wordt slechts geheven voorzover de kolen door degene die deze aflevert of gebruikt, zijn gewonnen,
      vervaardigd of binnen Nederland zijn gebracht.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel21
  - number: '21.4'
    text: De belasting wordt geheven ongeacht de bewerking die op de kolen is toegepast.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel21
  - number: '21.5'
    text: |-
      Als aflevering of gebruik wordt niet aangemerkt het gebruik van kolen voor het vervaardigen van kolen,
      energieproducten als bedoeld in [artikel 36b, eerste lid, onderdelen d en e][ref1], of minerale oliën als bedoeld
      in de [Wet op de accijns][ref2] indien het gebruik van de kolen plaats vindt binnen de inrichting waarin zij zijn
      ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel36b
      [ref2]: https://wetten.overheid.nl/BWBR0005251
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: 36b
        hoofdstuk: VA
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005251
  - number: '21.6'
    text: |-
      Bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur kunnen voorwaarden en
      beperkingen worden gesteld waaronder het vijfde lid toepassing vindt.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel21
  - number: '22'
    text: De belasting wordt geheven van degene die de kolen aflevert of gebruikt.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel22
  - number: '23'
    text: De belasting wordt geheven per eenheid brandstof, uitgedrukt in kilogram.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel23
  - number: '24'
    text: De belasting wordt verschuldigd op het tijdstip waarop de aflevering of het gebruik van de kolen plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel24
  - number: '25.1'
    text: Het tarief bedraagt per 1000 kilogram kolen € 12,28.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel25
  - number: '25.2'
    text: |-
      In afwijking van het eerste lid bedraagt het tarief nihil voor kolen die worden afgeleverd met een buiten Nederland
      gelegen bestemming, mits kan worden aangetoond dat de desbetreffende brandstoffen in verband met de aflevering
      buiten Nederland zijn gebracht.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel25
  - number: '25.3'
    text: |-
      Op verzoek van de belastingplichtige wordt de belasting in afwijking van [artikel 23][ref1] en van het eerste lid
      geheven per eenheid brandstof, uitgedrukt in zowel energie-inhoud als CO-emissie bij verbranding van de kolen. In
      dat geval zijn de in het vierde lid genoemde tarieven van toepassing. Bij inwilliging van het verzoek geldt zulks
      tot wederopzegging door belanghebbende doch ten minste voor vijf jaren. Een hernieuwd verzoek kan pas vijf jaren na
      die wederopzegging worden ingewilligd. De inspecteur beslist op het verzoek bij voor bezwaar vatbare beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel23
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '23'
        hoofdstuk: IV
        afdeling: '3'
  - number: '25.4'
    text: De in het derde lid bedoelde tarieven bedragen € 0,2100 per gigajoule en € 2,5984 per 1000 kilogram CO.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel25
  - number: '25.5'
    text: |-
      Bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur worden voorwaarden en
      beperkingen gesteld waaronder de regeling bedoeld in het derde lid wordt toegepast.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel25
  - number: '26.1'
    text: |-
      Vrijstelling van de belasting wordt verleend ter zake van de aflevering of het gebruik van kolen die worden
      gebruikt als brandstof voor het opwekken van elektriciteit in een installatie met een elektrisch rendement van
      minimaal 30%.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel26
  - number: '26.2'
    text: |-
      Als installatie met een elektrisch rendement van minimaal 30% wordt aangemerkt een installatie met een gemiddeld
      gebruik van maximaal 12 megajoule per opgewekt kWh.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel26
  - number: '26.3'
    text: |-
      Bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur worden voorwaarden en
      beperkingen gesteld waaronder de vrijstelling, bedoeld in het eerste lid wordt verleend.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel26
  - number: '26.4'
    text: Bij regeling van Onze Minister kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel26
  - number: '27.1'
    text: |-
      Aan degene die door derden aan hem afgeleverde kolen heeft aangewend anders dan als brandstof, wordt op zijn
      verzoek door de inspecteur een teruggaaf verleend van de belasting.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel27
  - number: '27.2'
    text: |-
      Aan degene die kolen aflevert met een buiten Nederland gelegen bestemming, dan wel buiten Nederland brengt teneinde
      daar door hem te worden afgeleverd of gebruikt, wordt op verzoek door de inspecteur een teruggaaf verleend van de
      belasting op de desbetreffende kolen.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel27
  - number: '27.3'
    text: De inspecteur beslist op het verzoek, bedoeld in het eerste en tweede lid, bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel27
  - number: '27.4'
    text: |-
      Binnen acht weken na ontvangst van het verzoek geeft de inspecteur een beschikking op dat verzoek, dan wel zendt
      hij de in het vijfde lid bedoelde kennisgeving.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel27
  - number: '27.5'
    text: |-
      Indien de inspecteur de beschikking niet binnen de in het vierde lid genoemde termijn kan geven, stelt hij
      belanghebbende daarvan onder opgaaf van redenen in kennis en noemt hij de termijn waarop de beschikking wel zal
      worden gegeven.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel27
  - number: '27.6'
    text: |-
      Bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur worden nadere regels gesteld met
      betrekking tot de indiening van het verzoek en de wijze waarop kan worden aangetoond dat aan de voorwaarden voor
      teruggaaf wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel27
  - number: '27.7'
    text: Onze Minister kan bij ministeriële regeling nadere regels stellen ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel27
  - number: '28.1'
    text: |-
      Op verzoek wordt teruggaaf van de belasting verleend met betrekking tot kolen die worden gebruikt als brandstof
      voor het opwekken van elektriciteit in een installatie met een elektrisch rendement van minimaal 30% als bedoeld
      in [artikel 26][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel26
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '26'
        hoofdstuk: IV
        afdeling: '5'
  - number: '28.2'
    text: De in het eerste lid bedoelde teruggaaf wordt verleend aan de verbruiker.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel28
  - number: '28.3'
    text: |-
      Bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur worden voorwaarden en
      beperkingen gesteld waaronder de in het eerste lid bedoelde teruggaaf wordt verleend.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel28
  - number: '28.4'
    text: |-
      [Artikel 27, derde tot en met vijfde en zevende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel27
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '27'
        hoofdstuk: IV
        afdeling: '6'
  - number: '29.1'
    text: |-
      De belastingplichtige is gehouden een administratie te voeren zodanig dat, voorzover dat voor de heffing van
      belang kan zijn, daaruit te allen tijde duidelijk blijken de gegevens betreffende het winnen, vervaardigen, binnen
      Nederland brengen, afleveren en gebruiken van kolen.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel29
  - number: '29.2'
    text: |-
      Bij ministeriële regeling kunnen door Onze Minister nadere regels worden gesteld omtrent de wijze waarop aan de in
      het eerste lid bedoelde verplichting moet worden voldaan.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel29
  - number: 36a.1
    text: 'Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36a
  - number: 36a.1.a
    text: |-
      halfzware olie, gasolie en vloeibaar gemaakt petroleumgas: hetgeen ingevolge de [artikelen 26][ref1] en
      [28 van de Wet op de accijns][ref2] onder deze begrippen wordt verstaan;


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel28
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '26'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: '28'
  - number: 36a.1.b
    text: 'L: een liter bij een temperatuur van 15°C;'
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36a
  - number: 36a.1.c
    text: |-
      weg, motorrijtuig en pleziervaartuig: hetgeen ingevolge [artikel 27, vijfde lid, van de Wet op de accijns][ref1]
      onder deze begrippen wordt verstaan;


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel27
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '27'
  - number: 36a.1.d
    text: |-
      invoer: invoer in de zin van de [Wet op de accijns][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005251
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0005251
  - number: 36a.1.e
    text: |-
      uitslag: uitslag in de zin van de [Wet op de accijns][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005251
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0005251
  - number: 36a.1.f
    text: |-
      aansluiting: een aansluiting van een in Nederland gelegen onroerende zaak als bedoeld in
      [artikel 16, onderdelen ][ref1] op een Nederlands distributienet waaruit elektriciteit of aardgas aan de verbruiker
      wordt geleverd; een aansluiting kan bestaan uit een of meer leveringspunten;


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel16
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '16'
  - number: 36a.1.g
    text: |-
      installatie voor warmtekrachtkoppeling: een installatie waarin aardgas wordt verstookt voor de gecombineerde
      opwekking van warmte en kracht met een totaal energetisch rendement van minimaal 60%, gebaseerd op de calorische
      onderwaarde van het gas. Onder het totaal energetisch rendement wordt verstaan de som van het rendement van de
      elektriciteitsopwekking en tweederde deel van het rendement van de productie van nuttig aan te wenden warmte,
      berekend op de onderste verbrandingswaarde van aardgas;
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36a
  - number: 36a.1.h
    text: |-
      installatie voor blokverwarming: een gemeenschappelijke voorziening, niet zijnde een installatie voor
      warmtekrachtkoppeling als bedoeld in onderdeel *g*, voor de verwarming van meer dan een onroerende zaak als bedoeld
      in [artikel 16, onderdeel ][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel16
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '16'
  - number: 36a.1.i
    text: |-
      hernieuwbare energiebronnen: wind, zonne-energie, aardwarmte, golfenergie, getijdenenergie, waterkracht, biomassa,
      stortgas, rioolwaterzuiveringsgas en biogas;
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36a
  - number: 36a.1.j
    text: |-
      biomassa: de biologisch afbreekbare fractie van producten, afvalstoffen en residuen van de landbouw, met inbegrip
      van plantaardige en dierlijke stoffen, de bosbouw en aanverwante bedrijfstakken, alsmede de biologisch afbreekbare
      fractie van industrieel en huishoudelijk afval;
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36a
  - number: 36a.1.k
    text: |-
      zuivere biomassa: producten, afvalstoffen en residuen van de landbouw, met inbegrip van plantaardige en dierlijke
      stoffen, de bosbouw en aanverwante bedrijfstakken die geheel biologisch afbreekbaar zijn, alsmede industrieel en
      huishoudelijk afval dat geheel biologisch afbreekbaar is;
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36a
  - number: 36a.1.l
    text: 'Nm3: een normaalkubiekemeter;'
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36a
  - number: 36a.1.m
    text: 'aardgas: producten van de GN-codes 2711 11 00 en 2711 21 00;'
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36a
  - number: 36a.1.n
    text: 'overige gassen: hoogovengas, cokesovengas, kolengas, raffinaderijgas en KV-gas als bedoeld in de GN-code 2705;'
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36a
  - number: 36a.1.o
    text: 'elektriciteit: elektrische energie van de GN-code 2716;'
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36a
  - number: 36a.1.p
    text: |-
      brandstof: een stof – met inbegrip van alle daaraan toegevoegde stoffen – dienende voor verbranding met het doel
      de daarbij ontstane energie te benutten, bij welke verbranding verontreinigende stoffen in de buitenlucht kunnen
      geraken.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36a
  - number: 36a.2
    text: |-
      Bij regeling van Onze Minister worden regels gesteld met betrekking tot de herleiding van feitelijke hoeveelheden
      van halfzware olie en gasolie tot hoeveelheden bij een temperatuur van 15°C.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36a
  - number: 36a.3
    text: |-
      Bij regeling van Onze Minister in overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en
      Milieubeheer kunnen nadere regels worden gesteld met betrekking tot de inhoud van het begrip zuivere biomassa.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36a
  - number: 36a.4
    text: |-
      Met betrekking tot elektriciteit wordt onder distributienet verstaan een net als bedoeld in
      [artikel 1, eerste lid, onderdeel i, van de Elektriciteitswet 1998][ref1], met uitzondering van een net als bedoeld
      in [artikel 15, eerste lid, van de Elektriciteitswet 1998][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel15
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '15'
  - number: 36b.1
    text: 'Onder de naam energiebelasting wordt een belasting geheven op de volgende producten:'
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36b
  - number: 36b.1.a
    text: halfzware olie;
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36b
  - number: 36b.1.b
    text: gasolie;
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36b
  - number: 36b.1.c
    text: vloeibaar gemaakt petroleumgas;
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36b
  - number: 36b.1.d
    text: aardgas;
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36b
  - number: 36b.1.e
    text: overige gassen; en
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36b
  - number: 36b.1.f
    text: elektriciteit.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36b
  - number: 36b.2
    text: |-
      Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen wordt als één van de onder het eerste lid,
      onderdelen a tot en met e, bedoelde producten, niet zijnde één van deze producten, mede aangemerkt elk product
      dat direct of indirect is bestemd voor gebruik, wordt aangeboden voor verkoop of wordt gebruikt als één van deze
      producten.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36b
  - number: 36c.1
    text: |-
      Met betrekking tot halfzware olie, gasolie en vloeibaar gemaakt petroleumgas, wordt de belasting geheven ter zake
      van de uitslag en van de invoer, als was de belasting een accijns.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36c
  - number: 36c.2
    text: |-
      Met betrekking tot aardgas wordt de belasting geheven ter zake van de levering via een aansluiting aan de
      verbruiker en met betrekking tot overige gassen wordt de belasting geheven ter zake van de levering aan de
      verbruiker.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36c
  - number: 36c.3
    text: |-
      Met betrekking tot elektriciteit wordt de belasting geheven ter zake van de levering via een aansluiting aan de
      verbruiker, met uitzondering van de levering van elektriciteit aan degene die op zijn beurt leveringen via een
      aansluiting aan de verbruiker verricht.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36c
  - number: 36c.4
    text: |-
      Als een levering als bedoeld in het tweede en derde lid, wordt mede aangemerkt het verbruik van aardgas, overige
      gassen en elektriciteit, indien deze op andere wijze zijn verkregen dan door een levering als bedoeld in het tweede
      en derde lid. Als een levering als bedoeld in het derde lid wordt mede aangemerkt het verbruik van elektriciteit,
      indien de elektriciteit is verkregen door tussenkomst van de Amsterdam Power Exchange, alsmede het verbruik van
      elektriciteit door degene die leveringen via een aansluiting aan de verbruiker verricht.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36c
  - number: 36c.5
    text: 'Het vierde lid is niet van toepassing met betrekking tot de verbruiker die:'
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36c
  - number: 36c.5.a
    text: |-
      elektriciteit heeft opgewekt door middel van hernieuwbare energiebronnen, met uitzondering van elektriciteit uit
      biomassa die niet als zuivere biomassa wordt aangemerkt;
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36c
  - number: 36c.5.b
    text: |-
      elektriciteit heeft opgewekt door middel van een noodinstallatie in geval van storingen bij de levering via het
      net;
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36c
  - number: 36c.5.c
    text: stortgas, rioolwaterzuiveringsgas of biogas heeft gewonnen;
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36c
  - number: 36c.5.d
    text: elektriciteit heeft opgewekt door middel van een installatie voor warmtekrachtkoppeling.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36c
  - number: 36c.6
    text: |-
      Als levering wordt niet aangemerkt het verbruik van een van de producten genoemd in
      [artikel 36b, eerste lid, onderdelen d en e][ref1], indien die producten worden verbruikt voor de vervaardiging
      van producten als bedoeld in [artikel 36b, eerste lid, onderdelen a tot en met e][ref2], alsmede lichte olie
      als bedoeld in [artikel 26, tweede lid, van de Wet op de accijns][ref3] en zware stookolie als bedoeld in
      [artikel 26, vijfde lid, van de Wet op de accijns][ref4], in dezelfde inrichting waarin zij zijn ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel36b
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel36b
      [ref3]: https://wetten.overheid.nl/BWBR0005251#Artikel26
      [ref4]: https://wetten.overheid.nl/BWBR0005251#Artikel26
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36c
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: 36b
        hoofdstuk: VA
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0007168
        artikel: 36b
        hoofdstuk: VA
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005251
        artikel: '26'
      - id: ref4
        bwb_id: BWBR0005251
        artikel: '26'
  - number: 36c.7
    text: |-
      Bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur worden voorwaarden en
      beperkingen gesteld waaronder het zesde lid toepassing vindt.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36c
  - number: 36c.8
    text: Bij regeling van Onze Minister kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36c
  - number: 36d
    text: |-
      Als uitslag wordt mede aangemerkt het gebruik van halfzware olie, gasolie en vloeibaar gemaakt petroleumgas bestemd
      voor het aandrijven van motorrijtuigen op de weg of van pleziervaartuigen, voor andere doeleinden dan voor het
      aandrijven van motorrijtuigen op de weg of van pleziervaartuigen.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36d
  - number: 36e.1
    text: |-
      Met betrekking tot halfzware olie, gasolie en vloeibaar gemaakt petroleumgas, wordt de belasting geheven van degene
      die ter zake accijns verschuldigd is of zou zijn, indien van die brandstoffen accijns zou worden geheven.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36e
  - number: 36e.2
    text: |-
      Met betrekking tot aardgas, overige gassen en elektriciteit wordt de belasting geheven van degene die de levering
      verricht.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36e
  - number: 36e.3
    text: |-
      In afwijking van het tweede lid wordt bij toepassing van [artikel 36][ref1], de belasting geheven van de
      verbruiker.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel36c
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36e
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: 36c
        hoofdstuk: VA
        afdeling: '2'
  - number: 36e.4
    text: |-
      Voor de toepassing van het tweede lid dient, indien degene die de levering aan de verbruiker verricht, niet in
      Nederland is gevestigd en aldaar geen vaste inrichting heeft van waaruit de levering wordt verricht, degene die de
      levering verricht in Nederland ter zake van deze levering een fiscaal vertegenwoordiger aan te stellen. De fiscaal
      vertegenwoordiger treedt op namens degene die levert aan de verbruiker en treedt in zijn plaats met betrekking
      tot alle rechten en verplichtingen die hij heeft inzake de aangifte en de betaling van de belasting, alsmede de
      verplichtingen, bedoeld in [artikel 36n][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel36n
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36e
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: 36n
        hoofdstuk: VA
        afdeling: '7'
  - number: 36e.5
    text: De fiscaal vertegenwoordiger dient in het bezit te zijn van een daartoe verstrekte vergunning van de inspecteur.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36e
  - number: 36e.6
    text: |-
      Degene die een vergunning als fiscaal vertegenwoordiger wil verkrijgen, dient daartoe een verzoek in bij de
      inspecteur. Bij of krachtens op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur worden
      regels gesteld met betrekking tot de gegevens die het verzoek moet bevatten.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36e
  - number: 36e.7
    text: |-
      Bij het verzoek wordt een verklaring overgelegd van degene die de levering aan de verbruiker verricht waaruit
      blijkt dat deze degene die het verzoek indient, machtigt op te treden als zijn fiscaal vertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36e
  - number: 36e.8
    text: |-
      Bij of krachtens op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur kunnen, ter
      verzekering van de heffing en de invordering, regels worden gesteld met betrekking tot de voorwaarden waaronder de
      vergunning wordt verleend, gewijzigd en ingetrokken. Het verlenen, het weigeren, het wijzigen en het intrekken van
      de vergunning geschiedt bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36e
  - number: 36e.9
    text: |-
      In afwijking van het tweede lid wordt de belasting geheven van de verbruiker indien degene die de levering aan de
      verbruiker verricht en geen fiscaal vertegenwoordiger heeft, niet in Nederland is gevestigd en aldaar geen vaste
      inrichting heeft van waaruit de levering wordt verricht.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36e
  - number: 36e.10
    text: |-
      Indien in een verbruiksperiode van 12 maanden ten aanzien van de verbruiker, bedoeld in het derde en negende lid,
      zowel sprake is van door hem op grond van het derde onderscheidenlijk negende lid verschuldigde belasting als
      van aan hem in rekening gebrachte belasting ter zake van aan hem geleverde hoeveelheden aardgas of elektriciteit,
      wordt in totaal niet meer belasting geheven dan de belasting die zou zijn verschuldigd indien de totale hoeveelheid
      aardgas of elektriciteit was betrokken van één leverancier, met dien verstande dat de belasting primair is
      verschuldigd op grond van het tweede lid.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36e
  - number: 36f
    text: |-
      In afwijking van [artikel 36][ref1], wordt de belasting bij toepassing van [artikel 36][ref2] geheven van degene
      die de halfzware olie, de gasolie of het vloeibaar gemaakt petroleumgas gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel36e
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel36d
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36f
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: 36e
        hoofdstuk: VA
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0007168
        artikel: 36d
        hoofdstuk: VA
        afdeling: '2'
  - number: 36g
    text: |-
      De belasting wordt voor halfzware olie, gasolie, vloeibaar gemaakt petroleumgas en aardgas geheven per eenheid
      brandstof, uitgedrukt in L, kilogram of m3, en voor elektriciteit en overige gassen per eenheid energie-inhoud,
      uitgedrukt in kWh onderscheidenlijk gigajoule.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36g
  - number: 36h.1
    text: |-
      De belasting met betrekking tot halfzware olie, gasolie en vloeibaar gemaakt petroleumgas wordt verschuldigd
      op het tijdstip waarop de accijns ter zake van die brandstoffen verschuldigd wordt of zou worden indien van die
      brandstoffen accijns zou worden geheven.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36h
  - number: 36h.2
    text: |-
      In afwijking van het eerste lid wordt de belasting bij toepassing van [artikel 36][ref1] verschuldigd op het
      tijdstip waarop het gebruik plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel36d
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36h
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: 36d
        hoofdstuk: VA
        afdeling: '2'
  - number: 36h.3
    text: |-
      De belasting met betrekking tot de levering van aardgas, overige gassen en de levering van elektriciteit wordt
      verschuldigd:
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36h
  - number: 36h.3.a
    text: |-
      in gevallen waarin een voorschotnota wordt uitgereikt of, indien geen voorschotnota wordt uitgereikt, een
      voorschotbedrag wordt ontvangen:
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36h
  - number: 36h.3.a.1°
    text: |-
      op het tijdstip waarop een voorschotnota wordt uitgereikt onderscheidenlijk een voorschotbedrag wordt ontvangen;
      alsmede
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36h
  - number: 36h.3.a.2°
    text: op het tijdstip van de uitreiking van de eindfactuur over een verbruiksperiode;
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36h
  - number: 36h.3.b
    text: in andere gevallen op het tijdstip van de uitreiking van de factuur.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36h
  - number: 36h.4
    text: |-
      Voor de toepassing van het derde lid, onderdeel *a*, onder 1°, worden de hoeveelheden aardgas en elektriciteit,
      waarop de voorschotnota dan wel het voorschotbedrag is gebaseerd, aangemerkt als geleverde hoeveelheden.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36h
  - number: 36h.5
    text: |-
      Onder de in het derde lid, onderdeel *a*, onder 2°, bedoelde eindfactuur wordt verstaan de factuur die wordt
      opgemaakt na afloop van een verbruiksperiode en waarin verrekening plaatsvindt met de op deze verbruiksperiode
      betrekking hebbende voorschotten.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36h
  - number: 36h.6
    text: |-
      In afwijking van het derde lid wordt de belasting bij toepassing van [artikel 36c, vierde lid][ref1], verschuldigd
      op het tijdstip waarop het verbruik plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel36c
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36h
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: 36c
        hoofdstuk: VA
        afdeling: '2'
  - number: 36h.7
    text: Bij regeling van Onze Minister kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36h
  - number: 36i.1
    text: 'Het tarief bedraagt voor:'
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36i
  - number: 36i.1.a
    text: halfzware olie, per 1000 L € 152,77;
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36i
  - number: 36i.1.b
    text: gasolie, per 1000 L € 154,04;
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36i
  - number: 36i.1.c
    text: vloeibaar gemaakt petroleumgas, per 1000 kilogram € 182,38;
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36i
  - number: 36i.1.d
    text: |-
      aardgas, met een bovenste verbrandingswaarde van 35,17 megajoule, voor dat gedeelte van de geleverde hoeveelheid
      per verbruiksperiode van 12 maanden per aansluiting dat: - niet hoger is dan 5000 m3, per m3 € 0,1429;
        - hoger is dan 5000 m3, maar niet hoger dan 170 000 m3, per m3 € 0,0727;
        - hoger is dan 170 000 m3, maar niet hoger dan 1 000 000 m3, per m3 € 0,0227;
        - hoger is dan 1 000 000 m3, maar niet hoger dan 10 000 000 m3, per m3 € 0,0113;
        - hoger is dan 10 000 000 m3, per m3 € 0,0106 voor niet-zakelijk verbruik en per m3 € 0,0075 voor zakelijk
      verbruik;
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36i
  - number: 36i.1.e
    text: hoogovengas, cokesovengas, kolengas en raffinaderijgas, per 1000 gigajoule € 124,24;
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36i
  - number: 36i.1.f
    text: KV-gas, per 1000 gigajoule € 490,64;
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36i
  - number: 36i.1.g
    text: |-
      elektriciteit voor dat gedeelte van de geleverde hoeveelheid per verbruiksperiode van 12 maanden per aansluiting
      dat: '- niet hoger is dan 10 000 kWh, per kWh € 0,0654;'
        - hoger is dan 10 000 kWh, maar niet hoger dan 50 000 kWh, per kWh € 0,0212;
        - hoger is dan 50 000 kWh, maar niet hoger dan 10 000 000 kWh, per kWh € 0,0065;
        - hoger is dan 10 000 000 kWh, per kWh € 0,0010 voor niet-zakelijk verbruik en per kWh € 0,0005 voor zakelijk
      verbruik.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36i
  - number: 36i.2
    text: |-
      In afwijking van het eerste lid, onderdelen *a, b* en *c*, bedraagt het tarief voor halfzware olie, gasolie en
      vloeibaar gemaakt petroleumgas bestemd voor het aandrijven van motorrijtuigen op de weg of van pleziervaartuigen
      nihil.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36i
  - number: 36i.3
    text: |-
      In afwijking van het eerste lid, onderdelen a, b en c, bedraagt het tarief voor
      halfzware olie, gasolie en vloeibaar gemaakt petroleumgas als bedoeld in post a 32 van de
      [bij de Wet op de omzetbelasting 1968 behorende Tabel I][ref1], onderscheidenlijk € 16,1629, € 16,2775 en
      € 19,4171, indien geen aansluiting aanwezig is voor aardgas.


      [ref1]: https://wetten.overheid.nl/BWBR0002629
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36i
    references:
      - id: ref1
        bwb_id: BWBR0002629
  - number: 36i.4
    text: |-
      In afwijking van het eerste lid, onderdeel d, bedraagt het tarief voor aardgas als bedoeld in
      [post a 32 van de bij de Wet op de omzetbelasting 1968 behorende Tabel I][ref1], voor aardgas met een bovenste
      verbrandingswaarde van 35,17 megajoule, voor dat gedeelte van de geleverde hoeveelheid per verbruiksperiode van 12
      maanden per aansluiting dat: - niet hoger is dan 5000 m3, per m3 € 0,01295;
        - hoger is dan 5000 m3, maar niet hoger dan 170 000 m3, per m3 € 0,01207;
        - hoger is dan 170 000 m3, maar niet hoger dan 1 000 000 m3, per m3 € 0,01144;
        - hoger is dan 1 000 000 m3, maar niet hoger dan 10 000 000 m3, per m3 € 0,0113;
        - hoger is dan 10 000 000 m3, per m3 € 0,0075.


      [ref1]: https://wetten.overheid.nl/BWBR0002629
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36i
    references:
      - id: ref1
        bwb_id: BWBR0002629
  - number: 36i.5
    text: |-
      Bij aardgas met een bovenste verbrandingswaarde lager of hoger dan 35,17 megajoule per m3 worden de in het eerste
      lid, onderdeel d, vierde en zevende lid genoemde tarieven naar evenredigheid verlaagd, onderscheidenlijk verhoogd.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36i
  - number: 36i.6
    text: |-
      Voorzover de belastingplichtige met betrekking tot de levering van elektriciteit een specifiek contract heeft
      gesloten met de verbruiker en beschikt over een met die levering overeenkomende hoeveelheid garanties van oorsprong
      als bedoeld in [artikel 1, eerste lid, onderdeel x, van de Elektriciteitswet 1998][ref1], bedraagt het tarief, in
      afwijking van het eerste lid, onderdeel e, voor dat gedeelte van de geleverde hoeveelheid per verbruiksperiode van
      12 maanden per aansluiting dat: - niet hoger is dan 10 000 kWh, per kWh  € 0,0357;
        - hoger is dan 10 000 kWh nihil. De eerste volzin is niet van toepassing met betrekking tot garanties van oorsprong
      die zijn geboekt ter zake van elektriciteit die is opgewekt door middel van waterkracht dan wel van elektriciteit
      uit biomassa die niet als zuivere biomassa kan worden aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel1
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36i
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '1'
  - number: 36i.7
    text: |-
      Voorzover de belastingplichtige met betrekking tot de levering van stortgas, rioolwaterzuiveringsgas of biogas
      een specifiek contract heeft gesloten met de verbruiker, bedraagt het tarief, in afwijking van het eerste lid,
      onderdeel d, voor dat gedeelte van de geleverde hoeveelheid per verbruiksperiode van 12 maanden per aansluiting
      dat: '- niet hoger is dan 5000 m3, per m3 € 0,0577;'
        - hoger is dan 5000 m3, maar niet hoger dan 10 000 000 m3, per m3 € 0,0113;
        - hoger is dan 10 000 000 m3, per m3 € 0,0075.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36i
  - number: 36i.8
    text: |-
      In afwijking van het eerste lid, onderdeel d, bedraagt het tarief voor aardgas € 0,1429 per m3 voor de totale
      hoeveelheid aardgas die wordt geleverd aan een verbruiker die dat aardgas gebruikt voor een installatie voor
      blokverwarming.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36i
  - number: 36i.9
    text: |-
      Zakelijk verbruik is verbruik door een zakelijke eenheid die zelfstandig, op ongeacht welke plaats, leveringen van
      goederen en diensten verricht, ongeacht het oogmerk of het resultaat van die economische activiteiten. Economische
      activiteiten omvatten alle werkzaamheden van een fabrikant, handelaar of verrichter van diensten, met inbegrip van
      de winning van delfstoffen, de landbouw en de uitoefening van vrije of daarmee gelijkgestelde beroepen. Rijks-,
      regionale en lokale overheden, alsmede andere publiekrechtelijke lichamen worden als zakelijke eenheid aangemerkt
      voorzover zij werkzaamheden of transacties verrichten die bij een behandeling als niet-zakelijke eenheid tot
      concurrentieverstoring van enige betekenis zouden leiden.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36i
  - number: 36i.10
    text: Niet-zakelijk verbruik is het verbruik anders dan het zakelijk verbruik, bedoeld in het negende lid.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36i
  - number: 36i.11
    text: |-
      Indien bij een aansluiting sprake is van zowel zakelijk als niet-zakelijk verbruik worden de tarieven genoemd in
      het eerste lid, onderdelen d en g, voor verbruik boven 10 000 000 m3 respectievelijk 10 000 000 kWh toegepast naar
      evenredigheid van elk type verbruik. Indien het verbruik nagenoeg geheel bestaat uit zakelijk verbruik of niet-
      zakelijk verbruik, wordt het volledige verbruik als zodanig aangemerkt.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36i
  - number: 36i.12
    text: |-
      Bij een verbruiksperiode korter dan wel langer dan 12 maanden worden de in het eerste lid, onderdelen d en g,
      vierde, zesde en zevende lid, genoemde hoeveelheidsgrenzen naar evenredigheid verlaagd, onderscheidenlijk verhoogd.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36i
  - number: 36i.13
    text: |-
      Bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur worden voorwaarden en
      beperkingen gesteld waaronder de tarieven, bedoeld in het eerste lid, onderdelen d en g, zesde en zevende lid,
      worden toegepast.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36i
  - number: 36i.14
    text: |-
      Bij regeling van Onze Minister kunnen nadere regels worden gesteld ten behoeve van de toepassing van derde, vierde,
      zesde, zevende en elfde lid.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36i
  - number: 36i.15
    text: |-
      In afwijking van het eerste lid, onderdeel d, en het vierde lid, bedragen de tarieven nihil voor in
      [artikel 36b, tweede lid][ref1], als aardgas aangemerkte producten voorzover deze als brandstof worden gebruikt in
      de inrichting waarin zij zijn ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel36b
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36i
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: 36b
        hoofdstuk: VA
        afdeling: '2'
  - number: 36i.16
    text: |-
      In afwijking van het eerste lid, onderdeel e, bedraagt het tarief nihil voor hoogovengas, cokesovengas, kolengas en
      raffinaderijgas, voorzover deze als brandstof worden gebruikt in de inrichting waarin zij zijn ontstaan.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36i
  - number: 36i.17
    text: |-
      In afwijking van het eerste lid, onderdeel d, het vierde, zevende en achtste lid, wordt, indien op basis van een
      contract tussen de belastingplichtige en de verbruiker de levering van aardgas gemeten wordt in Nm3, de belasting
      verschuldigd over Nm3. Daarbij worden de tarieven, zoals die met betrekking tot aardgas in het eerste lid,
      onderdeel d, het vierde, het zevende en het achtste lid, zijn vastgesteld per m3, toegepast.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36i
  - number: 36j.1
    text: |-
      Op de ter zake van de levering van aardgas en elektriciteit, bedoeld in [artikel 36c, tweede en derde lid][ref1],
      verschuldigde belasting wordt een vermindering toegepast. De vermindering bedraagt € 181 per verbruiksperiode
      van 12 maanden per elektriciteitsaansluiting. Indien het bedrag van de over deze verbruiksperiode verschuldigde
      belasting lager is dan het bedrag van de vermindering, wordt het verschil aan de verbruiker terugbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel36c
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36j
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: 36c
        hoofdstuk: VA
        afdeling: '2'
  - number: 36j.2
    text: |-
      Bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur kunnen regels worden gesteld
      ter effectuering van de toepassing van het eerste lid. Daarbij worden tevens regels gesteld inzake administratieve
      verplichtingen alsmede strafbaarstelling van overtreding van het bij die regels gestelde.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36j
  - number: 36j.3
    text: |-
      Bij een verbruiksperiode korter dan wel langer dan 12 maanden wordt het in het eerste lid genoemde bedrag naar
      evenredigheid verlaagd, onderscheidenlijk verhoogd.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36j
  - number: 36j.4
    text: |-
      Bij toepassing van [artikel 36][ref1], zijn het eerste en het derde lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel36c
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36j
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: 36c
        hoofdstuk: VA
        afdeling: '2'
  - number: 36j.5
    text: |-
      De in het eerste lid bedoelde vermindering van belasting is niet van toepassing met betrekking tot zaken, al dan
      niet als onroerende zaak aangemerkt, die niet op zichzelf als gebouwde eigendommen zijn aan te merken welke kunnen
      dienen als woning of ten behoeve van de uitoefening van een bedrijf of beroep of anderszins een verblijfsfunctie
      hebben.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36j
  - number: 36j.6
    text: |-
      Bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur worden voorwaarden en
      beperkingen gesteld waaronder de vermindering, bedoeld in het eerste lid, wordt verleend.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36j
  - number: 36j.7
    text: Bij regeling van Onze Minister kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36j
  - number: 36k.1
    text: |-
      Vrijstelling van de belasting wordt verleend ter zake van de levering van producten als bedoeld in
      [artikel 36b, eerste lid, onderdelen d tot en met f][ref1], die worden gebruikt voor het opwekken van elektriciteit
      in een installatie met een elektrisch rendement van minimaal 30%.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel36b
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36k
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: 36b
        hoofdstuk: VA
        afdeling: '2'
  - number: 36k.2
    text: 'Als installatie met een elektrisch rendement van minimaal 30% wordt aangemerkt een installatie met:'
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36k
  - number: 36k.2.a
    text: een gemiddeld gebruik van maximaal 0,38 Nm3 aardgas per opgewekt kWh;
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36k
  - number: 36k.2.b
    text: een gemiddeld gebruik van maximaal 12 megajoule per opgewekt kWh in geval van een andere brandstof.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36k
  - number: 36k.3
    text: |-
      Vrijstelling van belasting wordt verleend ter zake van de levering van elektriciteit die wordt gebruikt voor
      chemische reductie en elektrolytische en metallurgische procédés.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36k
  - number: 36k.4
    text: |-
      Vrijstelling van belasting wordt verleend ter zake van de levering van aardgas en overige gassen die worden
      gebruikt anders dan als brandstof dan wel aardgas dat wordt gebruikt als additief of als vulstof in producten die
      direct of indirect zijn bestemd voor verbruik, worden aangeboden voor verkoop of worden verbruikt als aardgas.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36k
  - number: 36k.5
    text: |-
      Bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur worden voorwaarden en
      beperkingen gesteld waaronder de vrijstellingen, bedoeld in het eerste, derde en vierde lid, worden verleend.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36k
  - number: 36k.6
    text: Bij regeling van Onze Minister kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36k
  - number: 36l.1
    text: |-
      Op verzoek wordt teruggaaf van de belasting verleend met betrekking tot halfzware olie, gasolie en vloeibaar
      gemaakt petroleumgas, voor zover de hoeveelheid die door een verbruiker is betrokken hoger is dan 159 000
      L halfzware olie, 153 000 L gasolie onderscheidenlijk 119 000 kilogram vloeibaar gemaakt petroleumgas per
      kalenderjaar. De teruggaaf bedraagt:
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36l
  - number: 36l.1.a
    text: |-
      indien voornoemde producten zijn belast naar het tarief, bedoeld in artikel 36i, eerste lid, onderdelen a, b en c:
        - voor halfzware olie, per 1000 L € 138,34;
        - voor gasolie, per 1000 L € 139,51; en
        - voor vloeibaar gemaakt petroleumgas, per 1000 kilogram € 165,03;
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36l
  - number: 36l.1.b
    text: |-
      indien voornoemde producten zijn belast naar het tarief, bedoeld in artikel 36i, derde lid: - voor halfzware olie,
      per 1000 L € 1,7329;
        - voor gasolie, per 1000 L € 1,7475; en
        - voor vloeibaar gemaakt petroleumgas, per 1000 kilogram € 2,0671.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36l
  - number: 36l.2
    text: |-
      De teruggaaf, bedoeld in het eerste lid, wordt verleend aan degene die de brandstoffen voor eigen verbruik heeft
      betrokken.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36l
  - number: 36l.3
    text: |-
      Op verzoek wordt teruggaaf van de belasting verleend voor aardgas dat is belast naar het tarief als bedoeld in
      [artikel 36i, eerste lid, onderdeel d][ref1], voor het verbruik niet hoger dan 5000 m3, voorzover het verbruik van
      warmte in een onroerende zaak die door een installatie voor blokverwarming wordt verwarmd, hoger is dan 158 000 MJ
      per verbruiksperiode van 12 maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel36i
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36l
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: 36i
        hoofdstuk: VA
        afdeling: '4'
  - number: 36l.4
    text: |-
      De teruggaaf, bedoeld in het derde lid, wordt verleend aan de gebruiker van de in het derde
      lid bedoelde onroerende zaak. De teruggaaf bedraagt het verschil tussen het tarief, bedoeld in
      [artikel 36i, eerste lid, onderdeel d][ref1], voor het verbruik niet hoger dan 5000 m3 en het tarief voor het
      verbruik gelegen tussen 5000 m3 en 170 000 m3.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel36i
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36l
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: 36i
        hoofdstuk: VA
        afdeling: '4'
  - number: 36l.5
    text: |-
      Op verzoek wordt teruggaaf van de belasting verleend met betrekking tot aardgas en elektriciteit, voor zover de
      belasting over de hoeveelheden aardgas en elektriciteit die door een verbruiker in een verbruiksperiode van 12
      maanden van verschillende leveranciers zijn betrokken, hoger is dan de belasting die zou zijn verschuldigd indien
      sprake was van één leverancier.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36l
  - number: 36l.6
    text: De teruggaaf, bedoeld in het vijfde lid, wordt verleend aan de verbruiker.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36l
  - number: 36l.7
    text: |-
      Op verzoek wordt teruggaaf van de belasting verleend met betrekking tot aardgas en elektriciteit, gebruikt
      in onroerende zaken die in hoofdzaak zijn bestemd voor de openbare eredienst of voor het houden van openbare
      bezinningsbijeenkomsten van levensbeschouwelijke aard.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36l
  - number: 36l.8
    text: |-
      De teruggaaf, bedoeld in het zevende lid, wordt verleend aan de gebruiker van de in het zevende lid bedoelde
      onroerende zaken. De teruggaaf bedraagt 50 percent van de aan hem in rekening gebrachte belasting.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36l
  - number: 36l.9
    text: |-
      Bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur worden voorwaarden en
      beperkingen gesteld waaronder de teruggaaf, bedoeld in het eerste, derde, vijfde, zevende, twaalfde, dertiende,
      veertiende en vijftiende lid, wordt verleend.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36l
  - number: 36l.10
    text: |-
      [Artikel 27, derde tot en met vijfde en zevende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel27
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36l
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '27'
        hoofdstuk: IV
        afdeling: '6'
  - number: 36l.11
    text: |-
      De teruggaafregeling, bedoeld in het zevende lid, is onder bij regeling van Onze Minister te stellen nadere
      voorwaarden en beperkingen, eveneens van toepassing met betrekking tot aardgas en elektriciteit, gebruikt in
      onroerende zaken die hoofdzakelijk in gebruik zijn bij een charitatieve, culturele, wetenschappelijke of het
      algemeen nut beogende instelling, mits:
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36l
  - number: 36l.11.a
    text: |-
      de instelling beschikt over notarieel verleden statuten waaruit de charitatieve, culturele, wetenschappelijke of
      het algemeen nut beogende doelstelling blijkt;
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36l
  - number: 36l.11.b
    text: de feitelijke werkzaamheden van de instelling overeenkomen met de doelstelling;
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36l
  - number: 36l.11.c
    text: de instelling niet of slechts in beperkte mate werkzaam is op het gebied van sport, gezondheidszorg of onderwijs;
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36l
  - number: 36l.11.d
    text: de instelling niet aan vennootschapsbelasting is onderworpen dan wel daarvan is vrijgesteld;
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36l
  - number: 36l.11.e
    text: de instelling beschikt over een eigen aansluiting.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36l
  - number: 36l.12
    text: |-
      Op verzoek wordt teruggaaf van de belasting verleend met betrekking tot producten als bedoeld in
      [artikel 36b, eerste lid, onderdelen d tot en met f][ref1], die worden gebruikt op een in artikel
      [36k, eerste lid][ref2], bedoelde wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel36b
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel36k
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36l
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: 36b
        hoofdstuk: VA
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0007168
        artikel: 36k
        hoofdstuk: VA
        afdeling: '5'
  - number: 36l.13
    text: |-
      Op verzoek wordt teruggaaf van de belasting verleend met betrekking tot elektriciteit die wordt gebruikt op een in
      [artikel 36k, derde lid][ref1], bedoelde wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel36k
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36l
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: 36k
        hoofdstuk: VA
        afdeling: '5'
  - number: 36l.14
    text: |-
      Op verzoek wordt teruggaaf van de belasting verleend met betrekking tot aardgas en overige gassen die worden
      gebruikt op een in [artikel 36k, vierde lid][ref1], bedoelde wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel36k
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36l
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: 36k
        hoofdstuk: VA
        afdeling: '5'
  - number: 36l.15
    text: |-
      Op verzoek wordt teruggaaf van de belasting verleend voorzover met betrekking tot zakelijk verbruik van aardgas
      boven de 10 000 000 m3 of elektriciteit boven de 10 000 000 kWh per verbruiksperiode van twaalf maanden per
      aansluiting het tarief voor niet-zakelijk verbruik in rekening is gebracht.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36l
  - number: 36m.1
    text: |-
      Op verzoek wordt teruggaaf verleend van de belasting ter zake van leveringen van aardgas en elektriciteit, voor
      zover de door de belastingplichtige, bedoeld in [artikel 36][ref1], ter zake te ontvangen bedragen niet zijn en
      niet zullen worden ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel36e
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36m
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: 36e
        hoofdstuk: VA
        afdeling: '2'
  - number: 36m.2
    text: |-
      [artikel 27, derde tot en met zevende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel27
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36m
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '27'
        hoofdstuk: IV
        afdeling: '6'
  - number: 36n.1
    text: |-
      De belastingplichtige, bedoeld in [artikel 36][ref1], is gehouden een administratie te voeren zodanig dat - voor
      zover dat voor de heffing van de belasting van belang kan zijn - daaruit te allen tijde duidelijk blijken:


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel36e
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36n
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: 36e
        hoofdstuk: VA
        afdeling: '2'
  - number: 36n.1.a
    text: de gegevens betreffende de door hem verrichte leveringen;
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36n
  - number: 36n.1.b
    text: |-
      de gegevens betreffende de toepassing van de in artikel [36i, eerste lid, onderdelen d en g][ref1], bedoelde
      hoeveelheidgrenzen.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel36i
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36n
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: 36i
        hoofdstuk: VA
        afdeling: '4'
  - number: 36n.2
    text: |-
      Bij toepassing van [artikel 36e, derde en negende lid][ref1], is het eerste lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel36e
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36n
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: 36e
        hoofdstuk: VA
        afdeling: '2'
  - number: 36n.3
    text: |-
      Bij regeling van Onze Minister kunnen nadere regels worden gesteld omtrent de wijze waarop aan de in het eerste lid
      bedoelde verplichtingen moet worden voldaan.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36n
  - number: 36q
    text: |-
      Bij of krachtens op voordracht van Onze Minister, mede namens Onze Minister van Economische Zaken, Onze
      Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer en Onze Minister van Landbouw, Natuur en
      Voedselkwaliteit, vast te stellen algemene maatregel van bestuur wordt voorzien in een regeling op grond waarvan,
      onder daarbij te stellen voorwaarden, vrijstelling van de belasting wordt verleend ter zake van de levering van
      zakelijk verbruikte elektriciteit bij een verbruik boven de 10 000 000 kWh per verbruiksperiode van 12 maanden per
      aansluiting, voor het gedeelte van de geleverde hoeveelheid per verbruiksperiode van 12 maanden per aansluiting
      dat hoger is dan 10 000 000 kWh, indien de verbruiker in het kader van met Onze Minister van Economische Zaken,
      Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer of Onze Minister van Landbouw, Natuur
      en Voedselkwaliteit gemaakte afspraken verplichtingen op zich heeft genomen ter verbetering van de energie-
      efficiëntie.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel36q
  - number: '37.1'
    text: De in een tijdvak verschuldigd geworden belasting moet op aangifte worden voldaan.
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel37
  - number: '37.2'
    text: |-
      Bij toepassing van [artikel 36][ref1], dient in afwijking in zoverre van het tweede lid en van
      [artikel 19, derde lid, van de Algemene wet inzake rijksbelastingen][ref2], de belasting uiterlijk op de dag na het
      in [artikel 36][ref3], bedoelde tijdstip op aangifte te worden voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel36h
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0007168#Artikel36h
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: 36h
        hoofdstuk: VA
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '19'
      - id: ref3
        bwb_id: BWBR0007168
        artikel: 36h
        hoofdstuk: VA
        afdeling: '3'
  - number: '37.3'
    text: |-
      Indien de berekening van de verschuldigde belasting leidt tot een negatief bedrag verleent de inspecteur op
      verzoek van de belastingplichtige teruggaaf van dit bedrag. [Artikel 27, derde tot en met zesde lid][ref1], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel27
    url: https://wetten.overheid.nl/BWBR0007168/2004-01-01#Artikel37
    references:
      - id: ref1
