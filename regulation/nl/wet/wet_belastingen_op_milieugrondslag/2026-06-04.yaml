  - number: 71e
    text: De belasting wordt verschuldigd op het tijdstip waarop de emissie van broeikasgas plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0007168/2026-06-04#Artikel71e
  - number: 71f
    text: |-
      1 Het tarief bedraagt per ton kooldioxide-equivalent: € 0.

      2 Aan het begin van elk kalenderjaar wordt het tarief, genoemd in het eerste lid, bij regeling van Onze Minister
      vervangen door een ander tarief. Dit tarief wordt berekend als volgt. Als uitgangspunt wordt genomen het bedrag
      voor dat kalenderjaar, genoemd in het vierde lid. Vervolgens wordt dat bedrag verminderd met de termijnkoers van
      het broeikasgasemissierecht. Het tarief is niet lager dan nihil.

      3 De termijnkoers van het broeikasgasemissierecht, bedoeld in het tweede lid, is voor een kalenderjaar het gewone
      gemiddelde, in euro, van de dagelijkse éénjaarstermijnkoersen van broeikasgasemissierechten (slotverkoopkoersen)
      voor levering in december van het jaar waarvoor het tarief wordt vastgesteld overeenkomstig het tweede lid, zoals
      waargenomen van 1 september tot en met 31 oktober voorafgaand aan dat jaar op de koolstofbeurs in de Europese Unie
      met het hoogste handelsvolume van broeikasgasemissierechten in die maanden.

      4 Het bedrag, bedoeld in het tweede lid, derde zin, bedraagt voor:

        - het kalenderjaar 2020: € 12,30;
        - het kalenderjaar 2021: € 13,50;
        - het kalenderjaar 2022: € 14,90;
        - het kalenderjaar 2023: € 16,40;
        - het kalenderjaar 2024: € 18,00;
        - het kalenderjaar 2025: € 19,80;
        - het kalenderjaar 2026: € 21,80;
        - het kalenderjaar 2027: € 24,00;
        - het kalenderjaar 2028: € 26,40;
        - het kalenderjaar 2029: € 29,00;
        - de kalenderjaren vanaf 2030: € 31,90.
    url: https://wetten.overheid.nl/BWBR0007168/2026-06-04#Artikel71f
  - number: 71g
    text: |-
      1 Voor de heffing en invordering van de belasting wordt voor de toepassing van de Algemene wet inzake
      rijksbelastingen, de [Invorderingswet 1990][ref1] en de op die wetten berustende bepalingen onder
      rijksbelastingdienst verstaan de Dienst Nederlandse Emissieautoriteit. Hierbij staat deze dienst onder het gezag
      van de Minister van Financiën.

      2 Indien het bestuur van de Nederlandse emissieautoriteit de elektriciteitsjaarvracht, bedoeld in
      [artikel 16a.1, eerste lid, van de Wet milieubeheer][ref2], ambtshalve vaststelt en deze vaststelling
      onherroepelijk is geworden op een tijdstip na vier jaren en tien maanden na het tijdvak waarin de belasting
      verschuldigd is geworden, vervalt de bevoegdheid tot het opleggen van een naheffingsaanslag, bedoeld in
      [artikel 20 van de Algemene wet inzake rijksbelastingen][ref3] en de bevoegdheid tot het opleggen van de boeten,
      bedoeld in de [artikelen 67c][ref4] en [67f van de Algemene wet inzake rijksbelastingen][ref5] twee maanden na het
      hiervoor bedoelde tijdstip.

      3 In afwijking van de [artikelen 10, tweede lid][ref6], en
      [19, eerste lid, van de Algemene wet inzake rijksbelasting][ref7] worden de in een tijdvak verschuldigd
      geworden belasting voldaan en de daarop betrekking hebbende aangifte gedaan uiterlijk op het tijdstip waarop het
      elektriciteitsemissieverslag moet worden ingediend.

      4 Bestaande geheimhoudingsbepalingen staan er niet aan in de weg dat de ambtenaren van de dienst Nederlandse
      emissieautoriteit gegevens of informatie verkregen op grond van deze afdeling gebruiken voor de taak, bedoeld
      in [hoofdstuk 16a van de Wet milieubeheer][ref8], dan wel gegevens of informatie verkregen op grond van de taak,
      bedoeld in hoofdstuk 16a van de Wet milieubeheer, gebruiken voor de taak, bedoeld in deze afdeling.


