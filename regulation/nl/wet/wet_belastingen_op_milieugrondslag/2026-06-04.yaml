  - number: 70a
    text: |-
      1 Onder bij algemene maatregel van bestuur te stellen voorwaarden en beperkingen wordt op verzoek teruggaaf van
      belasting verleend voor aardgas dat wordt gebruikt als brandstof voor vaartuigen op communautaire wateren, met
      inbegrip van de visserij.

      2 De teruggaaf, bedoeld in het eerste lid, wordt niet verleend voor aardgas dat wordt gebruikt als brandstof voor
      particuliere pleziervaartuigen.

      3 Voor de toepassing van deze wet en de daarop berustende bepalingen wordt onder een particulier pleziervaartuig
      verstaan een vaartuig dat wordt gebruikt door de eigenaar daarvan of door de natuurlijke of rechtspersoon die het
      gebruik daarvan geniet door huur of anderszins, voor andere dan commerciële doeleinden en met name voor andere
      doeleinden dan voor het vervoer van personen of goederen of voor het verrichten van diensten onder bezwarende
      titel, dan wel ten behoeve van overheidsinstanties.

      4 Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2026-06-04#Artikel70a
  - number: '71'
    text: |-
      1 De belastingplichtigen, bedoeld in [artikel 53, eerste en tweede lid][ref1], voeren een administratie waaruit
      duidelijk alle gegevens blijken die voor de heffing van de belasting van belang kunnen zijn.

      2 Bij regeling van Onze Minister worden regels gesteld omtrent de wijze waarop aan de in het eerste lid bedoelde
      verplichting wordt voldaan.

      3 Bij regeling van Onze Minister worden voorwaarden gesteld aan de administratie van een installatie
      waarin zuivere biomassa zodanig wordt verwerkt dat daaruit elektriciteit wordt opgewekt of waarin stortgas,
      rioolwaterzuiveringsgas of biogas wordt gewonnen.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel53
