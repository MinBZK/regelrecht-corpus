        artikel: '25'
  - number: '35'
    text: |-
      1 Als invoer wordt mede aangemerkt:

      a. het in Nederland beëindigen van een EU-douaneregeling waaronder kolen zijn geplaatst, anders dan door plaatsing
      onder een andere EU-douaneregeling;

      b. het in Nederland onttrekken van kolen aan een EU-douaneregeling;

      c. het eigen gebruik als brandstof in Nederland van kolen die onder een EU-douaneregeling zijn geplaatst of binnen
      een plaats voor tijdelijke opslag.

      2 Als invoer wordt niet aangemerkt het, met inachtneming van bij op voordracht van Onze Minister vast te stellen
      algemene maatregel van bestuur te stellen voorwaarden:

      a. brengen van kolen vanuit een derde land naar een inrichting of naar een plaats voor tijdelijke opslag;

      b. in Nederland plaatsen onder een EU-douaneregeling van vanuit een derde land binnengebrachte kolen;

      c. brengen van kolen die zijn geplaatst onder een EU-douaneregeling naar een inrichting;

      d. brengen van kolen vanuit een plaats voor tijdelijke opslag naar een inrichting;

      e. onder ambtelijk toezicht vernietigen van kolen die onder een EU-douaneregeling zijn geplaatst.

      3 Bij regeling van Onze Minister kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2026-06-04#Artikel35
  - number: '36'
    text: Onder de naam kolenbelasting wordt een belasting geheven ter zake van de uitslag en de invoer van kolen.
    url: https://wetten.overheid.nl/BWBR0007168/2026-06-04#Artikel36
  - number: '37'
    text: |-
      1 Ter zake van uitslag wordt de belasting geheven van de vergunninghouder van de inrichting.

      2 In afwijking van het eerste lid wordt de belasting bij toepassing van [artikel 33, tweede lid][ref1], geheven van
      degene die de kolen voorhanden heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel33
    url: https://wetten.overheid.nl/BWBR0007168/2026-06-04#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '33'
        hoofdstuk: V
        afdeling: '1'
  - number: '38'
    text: |-
      1 Een plaats kan alleen als inrichting worden gebruikt indien daartoe een vergunning is verstrekt door de
      inspecteur.

      2 Als inrichting kan worden aangemerkt:

      a. een plaats waar kolen worden vervaardigd;

      b. een plaats waar geen kolen worden vervaardigd maar die dient voor de opslag van kolen, indien de hoeveelheid
      kolen die gemiddeld over een jaar voorhanden is meer bedraagt dan een bij regeling van Onze Minister vast te
      stellen hoeveelheid.
    url: https://wetten.overheid.nl/BWBR0007168/2026-06-04#Artikel38
  - number: '39'
    text: |-
      1 Degene die een vergunning voor een inrichting wil verkrijgen, dient daartoe een verzoek in bij de inspecteur.

      2 Bij regeling van Onze Minister worden nadere regels gesteld met betrekking tot de gegevens die het verzoek dient
      te bevatten.

      3 In afwijking van [artikel 38, tweede lid][ref1], kan, indien degene die een vergunning voor een inrichting wil
      verkrijgen niet beschikt over een plaats waar kolen worden vervaardigd dan wel opgeslagen, een verzoek om een
      vergunning voor een inrichting door de inspecteur worden toegewezen, indien deze persoon in Nederland is gevestigd
      en in de uitoefening van zijn onderneming optreedt als:

      a. handelaar in kolen, maar de door hem gekochte kolen niet zelf in opslag neemt, of

      b. tussenpersoon die de kolen niet zelf in opslag neemt.

      4 De [artikelen 43 tot en met 50 van de Wet op de accijns][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel43
    url: https://wetten.overheid.nl/BWBR0007168/2026-06-04#Artikel39
    references:
