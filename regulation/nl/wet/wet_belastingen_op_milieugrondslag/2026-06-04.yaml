  - number: '60'
    text: |-
      1 In afwijking van [artikel 59, eerste lid, onderdeel a][ref1], bedraagt het tarief voor aardgas voor verwarming
      ter bevordering van het groeiproces van tuinbouwproducten voor aardgas met een bovenste verbrandingswaarde van
      35,17 megajoule per Nm3, voor dat gedeelte van de geleverde dan wel verbruikte hoeveelheid per verbruiksperiode van
      twaalf maanden per aansluiting dat:

        - niet hoger is dan 170 000 kubieke meter, per kubieke meter 30% van het tarief, genoemd in
      [artikel 59, eerste lid, onderdeel a, tweede aandachtsstreepje][ref2];
        - hoger is dan 170 000 kubieke meter, maar niet hoger dan 1 000 000 kubieke meter, per kubieke meter 48% van het
      tarief, genoemd in [artikel 59, eerste lid, onderdeel a, derde aandachtsstreepje][ref3];
        - hoger is dan 1 000 000 kubieke meter, maar niet hoger dan 10 000 000 kubieke meter, per kubieke meter 100% van
      het tarief, genoemd in [artikel 59, eerste lid, onderdeel a, vierde aandachtsstreepje][ref4];
        - hoger is dan 10 000 000 kubieke meter, per kubieke meter 100% van het tarief, genoemd in
      [artikel 59, eerste lid, onderdeel a, vijfde aandachtsstreepje][ref5].

      2 De tarieven, genoemd in het eerste lid, zijn niet van toepassing als de verbruiker een onderneming in
      moeilijkheden is. Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld ter vaststelling
      wanneer de verbruiker moet worden aangemerkt als een onderneming in moeilijkheden.

      3 Indien behalve voor het in het eerste lid vermelde doel mede aardgas wordt toegepast in één of meerdere
      woonhuizen, wordt per verbruiksperiode van twaalf maanden per woonhuis een geleverde hoeveelheid van 5000 kubieke
      meter in de heffing betrokken naar de tarieven, bedoeld in [artikel 59, eerste lid, onderdeel a][ref6], tenzij
      de geleverde hoeveelheden voor de verschillende toepassingen en de verschillende woonhuizen afzonderlijk worden
      gemeten.

      4 Bij aardgas met een bovenste verbrandingswaarde die lager of hoger is dan 35,17 megajoule per Nm3, worden
      de in het eerste lid genoemde tarieven naar evenredigheid verlaagd, onderscheidenlijk verhoogd alsmede de
      hoeveelheidsgrenzen naar evenredigheid verhoogd onderscheidenlijk verlaagd.

      5 Bij regeling van Onze Minister kunnen nadere regels worden gesteld ten behoeve van de uitvoering van het eerste
      tot en met vierde lid.

      6 Indien een begunstigde staatssteun ontvangt als gevolg van de toepassing van dit artikel verstrekt de
      belastingplichtige:

      a. aan Onze Minister van Landbouw, Natuur en Voedselkwaliteit jaarlijks vóór een bij of krachtens algemene
      maatregel van bestuur te bepalen datum en op een bij of krachtens algemene maatregel van bestuur te bepalen
      wijze ten aanzien van die begunstigde de volgende gegevens en inlichtingen die worden gebruikt in verband met
      de verplichtingen die voortvloeien uit paragraaf 3.2.1.4, punt 58, onder (b), van de Richtsnoeren 2022/C 80/01
      staatssteun ten behoeve van milieubescherming en energie 2022 met betrekking tot transparantievereisten:

      1°. de naam en het adres van de begunstigde en de provincie waarin deze is gevestigd;

      2°. het nummer, bedoeld in [artikel 9, onderdeel a, van de Handelsregisterwet 2007][ref7];

      3°. de datum waarop de steun voor het eerst is verleend;

      4°. per EAN-code het bedrag van de staatssteun in het betreffende kalenderjaar;

      b. aan Onze Minister op diens verzoek gegevens en inlichtingen die noodzakelijk zijn in het kader van artikel 108,
      eerste lid, van het Verdrag betreffende de werking van de Europese Unie.

      7 Een begunstigde die staatssteun ontvangt als gevolg van de toepassing van dit artikel verstrekt:

      a. aan Onze Minister van Landbouw, Natuur en Voedselkwaliteit op diens verzoek gegevens en inlichtingen waaruit
      blijkt of de begunstigde een kmo is, indien op basis van gegevens en inlichtingen als bedoeld in het zesde
      lid, onderdeel a, blijkt dat de begunstigde in een kalenderjaar meer staatssteun heeft ontvangen als gevolg van
      de toepassing van dit artikel dan het drempelbedrag, bedoeld in paragraaf 3.2.1.4, punt 58, onder (b), van de
      Richtsnoeren 2022/C 80/01 staatssteun ten behoeve van milieubescherming en energie 2022, en Onze Minister van
      Landbouw, Natuur en Voedselkwaliteit de op grond van dit onderdeel te verstrekken gegevens en inlichtingen nodig
      heeft om te bepalen of de begunstigde een kmo is;

      b. aan Onze Minister op diens verzoek gegevens en inlichtingen die noodzakelijk zijn in het kader van artikel 108,
      eerste lid, van het Verdrag betreffende de werking van de Europese Unie voor zover de belastingplichtige niet over
      de noodzakelijke gegevens en inlichtingen beschikt.

      8 Onze Minister van Landbouw, Natuur en Voedselkwaliteit kan een last onder dwangsom opleggen ter handhaving van
      het bepaalde bij of krachtens het zesde lid, onderdeel a, of zevende lid, onderdeel a.

      9 Ten behoeve van het toezicht op de naleving van het bepaalde bij of krachtens het zesde lid, onderdeel a,
      verstrekt de inspecteur indien hij hierover beschikt aan Onze Minister van Landbouw, Natuur en Voedselkwaliteit:

      a. de naam van de belastingplichtige die het eerste lid toepast;

      b. het nummer, bedoeld in [artikel 9, onderdeel a, van de Handelsregisterwet 2007][ref8], het adres,
      telefoonnummer en e-mailadres van die belastingplichtige.


