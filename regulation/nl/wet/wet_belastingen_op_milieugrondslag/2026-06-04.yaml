  - number: '46'
    text: |-
      1 De belastingplichtige voert een administratie waaruit, voor zover dat voor de heffing van belang kan zijn, de
      gegevens betreffende het vervaardigen, invoeren, uitslaan en gebruik van kolen duidelijk blijken.

      2 Bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur kunnen, ter verzekering van de
      heffing van de belasting, regels worden gesteld met betrekking tot:

      a. het vervoer van kolen;

      b. het leveren van kolen;

      c. het voorhanden hebben van kolen buiten een inrichting.

      3 Het tweede lid is niet van toepassing op kolen die zijn geplaatst onder een EU-douaneregeling.

      4 Bij regeling van Onze Minister kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2026-06-04#Artikel46
  - number: '47'
    text: |-
      1 Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:

      a. motorrijtuig: hetgeen ingevolge [artikel 1a, eerste lid, van de Wet op de accijns][ref1] onder dit begrip wordt
      verstaan;

      b.

      c.

      d. verbruiksperiode:

      1°. in gevallen waarin periodiek voorschotnota’s worden uitgereikt of, indien geen voorschotnota’s worden
      uitgereikt, periodiek voorschotbedragen worden ontvangen, gevolgd door een jaarlijkse eindfactuur: het tijdvak
      waarop de eindfactuur betrekking heeft;

      2°. in overige gevallen: kalenderjaar;

      e. eindfactuur: definitieve jaarlijkse factuur waarin verrekening plaatsvindt met de voorschotnota’s of
      voorschotbedragen die betrekking hebben op de verbruiksperiode waarop de jaarlijkse factuur ziet;

      f. aansluiting: een aansluiting van een in Nederland gelegen onroerende zaak als bedoeld in
      [artikel 16, onderdelen a tot en met e, van de Wet waardering onroerende zaken][ref2] op een Nederlands
      distributienet waaruit elektriciteit of aardgas aan de verbruiker wordt geleverd; een aansluiting kan bestaan uit
      een of meer leveringspunten;

      g. installatie voor elektriciteitsopwekking: een zelfstandige installatie waarin elektriciteit wordt opgewekt door
      middel van aardgas of elektriciteit, waarbij tot de installatie behoren onderdelen die rechtstreeks worden ingezet
      voor het opwekken van elektriciteit, daarmee in technisch verband staan en gevolgen kunnen hebben voor het opwekken
      van elektriciteit, alsmede onderdelen die zijn aangebracht uit het oogpunt van milieuverbetering, veiligheid of
      efficiëntie;

      h. installatie voor blokverwarming: een gemeenschappelijke voorziening voor de verwarming van meer dan een onroerende
      zaak als bedoeld in [artikel 16, onderdelen a tot en met e, van de Wet waardering onroerende zaken][ref3];

      i. hernieuwbare energiebronnen: wind, zonne-energie, aardwarmte, golfenergie, getijdenenergie, waterkracht,
      biomassa, stortgas, rioolwaterzuiveringsgas en biogas;

      j. biomassa: de biologisch afbreekbare fractie van producten, afvalstoffen en residuen van de landbouw, met
      inbegrip van plantaardige en dierlijke stoffen, de bosbouw en aanverwante bedrijfstakken, alsmede de biologisch
      afbreekbare fractie van industrieel en huishoudelijk afval;

      k. zuivere biomassa: producten, afvalstoffen en residuen van de landbouw, met inbegrip van plantaardige en
      dierlijke stoffen, de bosbouw en aanverwante bedrijfstakken die geheel biologisch afbreekbaar zijn, alsmede
      industrieel en huishoudelijk afval dat geheel biologisch afbreekbaar is;

      l. Nm3: een normaalkubiekemeter;

      m. aardgas: producten van de GN-codes 2711 11 00 en 2711 21 00;

      n. elektriciteit: elektrische energie van de GN-code 2716;

      o. brandstof: stof – met inbegrip van alle daaraan toegevoegde stoffen – dienende voor verbranding met het doel de
      daarbij ontstane energie te benutten;

      p. kosten van de aankoop van energieproducten en elektriciteit, productiewaarde en toegevoegde waarde: hetgeen
      ingevolge artikel 17, eerste lid, onderdeel a, van Richtlijn 2003/96/EG van de Raad van 27 oktober 2003 tot
      herstructurering van de communautaire regeling voor de belasting van energieproducten en elektriciteit (PbEU 2003,
      L 283) onder deze begrippen wordt verstaan;

      q. CNG: aardgas dat na compressie geschikt is voor de aanwending in motorrijtuigen;

      r. CNG-vulstation: een rechtstreeks op het distributienet van aardgas aangesloten inrichting waar uitsluitend
      aardgas wordt samengeperst tot CNG, dat wordt afgeleverd aan motorrijtuigen;

      s. zakelijk verbruik: verbruik door een zakelijke eenheid die zelfstandig, op ongeacht welke plaats, leveringen van
      goederen en diensten verricht, ongeacht het oogmerk of het resultaat van die economische activiteiten. Economische
      activiteiten omvatten alle werkzaamheden van een fabrikant, handelaar of verrichter van diensten, met inbegrip van
      de winning van delfstoffen, de landbouw en de uitoefening van vrije of daarmee gelijkgestelde beroepen. Rijks-,
      regionale en lokale overheden, alsmede andere publiekrechtelijke lichamen worden als zakelijke eenheid aangemerkt
      voor zover zij werkzaamheden of transacties verrichten die bij een behandeling als niet-zakelijke eenheid tot
      concurrentieverstoring van enige betekenis zouden leiden;

      t. niet-zakelijk verbruik: verbruik anders dan het zakelijk verbruik, bedoeld in onderdeel t;

      u. productie-installatie: installatie als bedoeld in [artikel 1.1 van de Energiewet][ref4], die bestemd is voor de
      productie van elektriciteit;

      v. walstroominstallatie: een installatie aan land die het mogelijk maakt om schepen die zijn afgemeerd te
      voorzien van elektriciteit en die beschikt over een zelfstandige aansluiting of die is voorzien van een comptabele
      meetinrichting die voldoet aan bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur
      te stellen voorwaarden;

      w. energieopslag: het omzetten van elektrische energie in een vorm van energie die kan worden opgeslagen, het
      opslaan van dergelijke energie, en de daaropvolgend omzetting van dergelijke energie in elektrische energie;

      x. energieopslagfaciliteit: een installatie waar energieopslag plaatsvindt;

      y. eindafrekening: de laatste factuur aan de verbruiker die wordt opgemaakt bij het beëindigen van het contract;

      z. begunstigde: een onderneming als bedoeld in artikel 107, eerste lid, van het Verdrag betreffende de werking van
      de Europese Unie die staatssteun ontvangt als gevolg van een steunmaatregel;

      aa. kmo: een kleine, middelgrote onderneming of micro-onderneming als bedoeld in bijlage I van [Verordening (EU)
      nr. 651/2014](32014R0651) van de Commissie van 17 juni 2014 waarbij bepaalde categorieën steun op grond van de
      artikelen 107 en 108 van het Verdrag met de interne markt verenigbaar worden verklaard (PbEU 2014, L 187);

      ab. EAN-code: uniek identificatienummer conform de Europese Artikel Nummering betreffende de aansluiting;

      ac. waterstof: producten van de GN-code 2804 1000.

      2 Bij regeling van Onze Minister in overeenstemming met Onze Minister van Infrastructuur en Waterstaat worden
      nadere regels gesteld met betrekking tot de inhoud van het begrip zuivere biomassa.

      3 Onder levering van aardgas, onderscheidenlijk elektriciteit, wordt voor de toepassing van dit
      hoofdstuk en de daarop berustende bepalingen verstaan hetgeen daaronder wordt verstaan ingevolge de
      [Wet op de omzetbelasting 1968][ref5].

      4 Met betrekking tot elektriciteit wordt onder distributienet verstaan een transmissie- of distributiesysteem voor
      elektriciteit als bedoeld in [artikel 1.1 van de Energiewet][ref6], met uitzondering van een distributiesysteem
      voor elektriciteit met een spanningsniveau van ten hoogste 0,4 kilovolt en een verbruik van ten hoogste 0,1 GWh
      per jaar, indien een ander dan een distributiesysteembeheerder voor elektriciteit als bedoeld in artikel 1.1 van de
      Energiewet een recht van gebruik heeft van dat systeem.

      5 Met betrekking tot aardgas wordt onder distributienet verstaan een transmissie- of distributiesysteem voor gas
      als bedoeld in [artikel 1.1 van de Energiewet][ref7].

      6 Indien in een tijdvak van 18 maanden een of meerdere voorschotnota’s worden uitgereikt dan wel een of meerdere
      voorschotbedragen worden ontvangen en uiterlijk binnen 13 weken na afloop van dat tijdvak geen eindfactuur wordt
      uitgereikt, wordt dat tijdvak van 18 maanden aangemerkt als verbruiksperiode.

      7 In afwijking van het eerste lid, onderdeel d, onder 2°, is de verbruiksperiode in de aldaar bedoelde gevallen:

      a. ingeval de overeenkomst tot levering in de loop van het kalenderjaar aanvangt en niet voorafgegaan is door een
      overeenkomst tot levering bij dezelfde leverancier: het gedeelte van het kalenderjaar vanaf het tijdstip waarop de
      overeenkomst tot levering aanvangt;

      b. ingeval de overeenkomst tot levering in de loop van het kalenderjaar wordt beëindigd en niet wordt opgevolgd
      door een overeenkomst tot levering bij dezelfde leverancier en ter zake van deze beëindiging een eindafrekening
      wordt opgemaakt: het gedeelte van het kalenderjaar tot het tijdstip waarop de overeenkomst tot levering eindigt.


