    text: |-
      1 Onder de naam energiebelasting wordt een belasting geheven op aardgas en elektriciteit.

      2 Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen wordt als aardgas mede aangemerkt
      elk product dat direct of indirect is bestemd voor gebruik, wordt aangeboden voor verkoop of wordt gebruikt als
      aardgas.

      3 In afwijking van het tweede lid wordt voor de toepassing van de [artikelen 47, zesde lid][ref1], [55][ref2],
      [59 tot en met 62][ref3] en [64, derde lid][ref4], en de op die artikelen berustende bepalingen waterstof niet als
      aardgas aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel55
      [ref3]: https://wetten.overheid.nl/BWBR0007168#Artikel59
