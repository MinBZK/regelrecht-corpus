  - number: '53'
    text: |-
      1 De belasting wordt geheven van degene die de levering verricht.

      2 In afwijking van het eerste lid wordt bij toepassing van [artikel 50, derde lid, onderdelen b, c en d][ref1], de
      belasting geheven van de verbruiker.

      3 In afwijking van het eerste lid, wordt bij een levering van elektriciteit waarbij sprake is van peer-to-peer
      handel als bedoeld in [artikel 1.1 van de Energiewet][ref2], de belasting geheven van de marktdeelnemer die de
      automatische uitvoering en afwikkeling van de levering realiseert.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Artikel1.1
