  - number: '25'
    text: |-
      1 De belasting wordt berekend:

      a. bij toepassing van [artikel 23, eerste lid, onderdelen a en b][ref1]: over het gewicht van de afvalstoffen
      die ter verwijdering worden afgegeven, onderscheidenlijk worden verwijderd binnen de inrichting waarin deze zijn
      ontstaan, gemeten in kilogrammen;

      b. bij toepassing van [artikel 23, eerste lid, onderdeel c][ref2]: over het gewicht van de afvalstoffen die uit
      Nederland worden overgebracht ter verwijdering buiten Nederland, gemeten in kilogrammen.

      2 Wanneer de afvalstoffen, bedoeld in het eerste lid, onderdeel b, in het buitenland op een zodanige wijze zijn
      gestort of verbrand dat bij een vergelijkbare verwerking in Nederland een lager belastingbedrag verschuldigd
      zou zijn, wordt ook voor de heffing ten aanzien van de uit Nederland overgebrachte afvalstoffen dit lagere
      belastingbedrag in aanmerking genomen.

      3 Het gewicht van de uit Nederland overgebrachte afvalstoffen, bedoeld in het eerste lid, onderdeel b,
      alsmede, indien van toepassing, de wijze van verwerking in het buitenland, bedoeld in het tweede lid, blijkt
      uit een beschikking van Onze Minister van Infrastructuur en Waterstaat. [Artikel 1, derde lid][ref3], en
      [hoofdstuk V van de Algemene wet inzake rijksbelastingen][ref4] zijn niet van toepassing met betrekking tot deze
      beschikking.

      4 Bij regeling van Onze Ministers kunnen regels worden gesteld omtrent de wijze waarop het gewicht van de
      afvalstoffen wordt bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0002320#HoofdstukV
