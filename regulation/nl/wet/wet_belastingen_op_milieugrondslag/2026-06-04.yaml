  - number: 24a
    text: |-
      1 Voor de toepassing van [artikel 24, onderdeel b][ref1], stelt de kennisgever, indien hij niet in Nederland is
      gevestigd en aldaar geen vaste inrichting heeft, een fiscaal vertegenwoordiger aan. De fiscaal vertegenwoordiger
      treedt namens hem op en treedt in zijn plaats met betrekking tot alle rechten en verplichtingen die hij heeft
      inzake de belasting.

      2 De fiscaal vertegenwoordiger is in het bezit van een daartoe door de inspecteur verstrekte vergunning.

      3 Degene die een vergunning als fiscaal vertegenwoordiger wil verkrijgen, dient daartoe een verzoek in bij de
      inspecteur.

      4 Bij het verzoek, bedoeld in het derde lid, wordt een verklaring overgelegd van degene aan wie de toestemming,
      bedoeld in [artikel 23, eerste lid, onderdeel c][ref2], is verleend, waaruit blijkt dat deze degene die het verzoek
      indient, machtigt op te treden als zijn fiscaal vertegenwoordiger.

      5 Bij algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de gegevens die het verzoek,
      bedoeld in het derde lid, moet bevatten alsmede met betrekking tot voorwaarden waaronder de vergunning wordt
      verleend, gewijzigd en ingetrokken.

      6 Bij ministeriële regeling worden nadere regels gesteld ten behoeve van de uitvoering van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel23
