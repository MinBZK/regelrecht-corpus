  - number: 25a
    text: |-
      1 De kennisgever, bedoeld in [artikel 24, onderdeel b][ref1], dient de aanvraag tot het geven van de beschikking,
      bedoeld in [artikel 25, derde lid][ref2], in bij Onze Minister van Infrastructuur en Waterstaat. Zodra de
      kennisgever constateert dat gegevens in de aanvraag onjuist of onvolledig zijn meldt hij dit onverwijld aan Onze
      Minister van Infrastructuur en Waterstaat.

      2 De kennisgever dient de aanvraag in binnen vier weken nadat de verklaring, bedoeld in artikel 16, onderdeel e,
      EVOA, is ontvangen, dan wel ontvangen had moeten zijn, voor alle afvalstoffen die zijn overgebracht uit Nederland
      met toepassing van de toestemming, bedoeld in [artikel 23, eerste lid, onderdeel c][ref3].

      3 Onze Minister van Infrastructuur en Waterstaat trekt de beschikking, bedoeld in [artikel 25, derde lid][ref4],
      in indien na afgifte van de beschikking blijkt dat de in de aanvraag of de beschikking vermelde gegevens zodanig
      onjuist of onvolledig zijn, dat het gewicht, bedoeld in artikel 25, eerste lid, onderdeel b of de wijze van
      verwerking in het buitenland, bedoeld in artikel 25, tweede lid, niet juist kan worden vastgesteld.

      4 Onze Minister van Infrastructuur en Waterstaat geeft de beschikking, bedoeld in [artikel 25, derde lid][ref5],
      ambtshalve af indien:

      a. de aanvraag niet binnen de termijn, genoemd in het tweede lid, is ontvangen; dan wel

      b. de beschikking op grond van het derde lid is ingetrokken.

      Een ambtshalve afgegeven beschikking als bedoeld onder b vervangt voor de toepassing van
      [artikel 25, derde lid][ref6], de op grond van het derde lid ingetrokken beschikking met ingang van het tijdstip
      waarop de belasting verschuldigd wordt ingevolge [artikel 26, aanhef en onderdeel c][ref7].

      5 Onze Minister van Infrastructuur en Waterstaat verstrekt de gegevens van de beschikking, bedoeld in
      [artikel 25, derde lid][ref8], aan de inspecteur ten behoeve van de belastingheffing.

      6 Bij of krachtens op voordracht van Onze Ministers vast te stellen algemene maatregel van bestuur worden regels
      gesteld omtrent:

      a. de wijze van indiening van de aanvraag, bedoeld in het eerste lid, waarbij in afwijking van de
      [artikelen 2:7, tweede lid][ref9], en [2:8 van de Algemene wet bestuursrecht][ref10] kan worden bepaald dat de
      aanvraag geheel of gedeeltelijk elektronisch wordt ingediend of in ontvangst wordt genomen;

      b. de gegevens die de kennisgever verstrekt bij de aanvraag, bedoeld in het eerste lid;

      c. de wijze waarop de kennisgever gehouden is zijn administratie te voeren;

      d. de inhoud en het afgeven van de beschikking, bedoeld in [artikel 25, derde lid][ref11];

      e. de wijze waarop de melding, genoemd in het eerste lid, tweede zin, wordt gedaan.

      7 Met het toezicht op de naleving van de bij of krachtens het zesde lid, onderdeel c, gestelde regels zijn belast
      de bij besluit van Onze Minister van Infrastructuur en Waterstaat aangewezen ambtenaren.

      8 Van een besluit als bedoeld in het zevende lid wordt mededeling gedaan door plaatsing in de Staatscourant.

      9 In geval van overtreding van de bij of krachtens het zesde lid, onderdeel c, gestelde regels kan Onze Minister
      van Infrastructuur en Waterstaat een last onder dwangsom opleggen.

      10 Bij regeling van Onze Ministers kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit
      artikel.


