  - number: '42'
    text: De belasting wordt berekend over het gewicht van de kolen, uitgedrukt in kilogram.
    url: https://wetten.overheid.nl/BWBR0007168/2026-06-04#Artikel42
  - number: '43'
    text: Het tarief bedraagt per 1000 kilogram kolen € 18,85.
    url: https://wetten.overheid.nl/BWBR0007168/2026-06-04#Artikel43
  - number: '44'
    text: |-
      1 Vrijstelling van de belasting wordt verleend ter zake van de uitslag en de invoer van kolen die worden gebruikt
      anders dan als brandstof.

      2 Vrijstelling van de belasting wordt verleend ter zake van de uitslag en de invoer van kolen die worden gebruikt
      als brandstof voor het opwekken van elektriciteit.

      3 Vrijstelling van de belasting wordt verleend ter zake van de uitslag en de invoer van kolen die duaal worden
      gebruikt.

      4 Bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur worden voorwaarden en
      beperkingen gesteld waaronder de vrijstellingen, bedoeld in het eerste tot en met derde lid, worden verleend.

      5 Bij regeling van Onze Minister worden nadere regels gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2026-06-04#Artikel44
  - number: '45'
    text: |-
      1 Op verzoek wordt teruggaaf van de belasting verleend met betrekking tot kolen die worden gebruikt op een in
      [artikel 44, eerste tot en met derde lid][ref1], bedoelde wijze.

      2 Op verzoek wordt teruggaaf van de belasting verleend met betrekking tot kolen die – anders dan vanuit een
      inrichting – zijn gebracht naar een andere lidstaat dan wel een derde land.

      3 Bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur worden nadere regels gesteld
      met betrekking tot de indiening van het verzoek en de wijze waarop kan worden aangetoond dat aan de voorwaarden
      voor teruggaaf wordt voldaan.

      4 Bij regeling van Onze Minister kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel44
    url: https://wetten.overheid.nl/BWBR0007168/2026-06-04#Artikel45
