  - number: '41'
    text: |-
      Ter zake van de belasting bij invoer zijn de wettelijke bepalingen, bedoeld in
      [artikel 1:1, eerste en tweede lid, van de Algemene douanewet][ref1], met uitzondering van artikel 88 van de
      Gedelegeerde Verordening Douanewetboek van de Unie, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel11
    url: https://wetten.overheid.nl/BWBR0007168/2026-06-04#Artikel41
