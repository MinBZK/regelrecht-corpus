  - number: 71s
    text: |-
      Het bestuur van de Nederlandse emissieautoriteit verstrekt de inspecteur en de ontvanger de gegevens die
      noodzakelijk zijn voor de uitvoering van de CO-heffing industrie.
    url: https://wetten.overheid.nl/BWBR0007168/2026-06-04#Artikel71s
  - number: 71t
    text: |-
      1 Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:

        - *aardgas:* producten van de GN-codes 2711 11 00 en 2711 21 00;
        - *broeikasgasinstallatie:* broeikasgasinstallatie als bedoeld in de [artikelen 16.1, tweede lid][ref1], en
      [16.3 van de Wet milieubeheer][ref2];
        - *standaard CO-emissiefactor voor aardgas:* standaard CO-emissiefactor voor aardgas in kilogram CO/GJ aardgas die
      bij of krachtens [artikel 16.12 van de Wet milieubeheer][ref3] jaarlijks door Onze Minister van Economische Zaken
      en Klimaat wordt gepubliceerd;
        - *glastuinbouwbedrijf:* bedrijf voor het telen van gewassen in een of meer kassen;
        - *energiebedrijf voor glastuinbouw:* bedrijf waarvandaan warmte direct of indirect wordt getransporteerd naar een
      of meer glastuinbouwbedrijven en dat zelf geen glastuinbouwbedrijf is;
        - *restwarmte:* thermische energie die als onvermijdelijk bijproduct in industriële of bedrijfsmatige processen
      overblijft en die zonder transport naar een gebruiker ongebruikt terecht zou komen in lucht of water.

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot een glastuinbouwbedrijf of
      energiebedrijf voor de glastuinbouw.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16.1
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel16.3
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel16.12
    url: https://wetten.overheid.nl/BWBR0007168/2026-06-04#Artikel71t
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16.1'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '16.3'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '16.12'
  - number: 71ta
    text: |-
      1 Dit hoofdstuk is niet van toepassing op een glastuinbouwbedrijf dat in het gehele tijdvak:

      a. een totale oppervlakte in de kassen heeft van minder dan 2.500 m2; of

      b. gewassen in kassen teelt uitsluitend vanwege het uitoefenen van beroep of bedrijf aan huis, voor educatieve
      doeleinden, bij onderzoeksinstellingen of bij volkstuinen.

      2 Dit hoofdstuk is niet van toepassing op een energiebedrijf voor glastuinbouw:

      a. dat in het gehele tijdvak geen aardgas verstookt;

      b. waarvandaan in het gehele tijdvak minder dan 75% van de met aardgas opgewekte warmte direct of indirect is
      getransporteerd naar een of meer glastuinbouwbedrijven en dat, indien de inspecteur daarom verzoekt, dat aantoont;
      of

      c. waarvandaan in het gehele tijdvak uitsluitend restwarmte is getransporteerd naar een of meer
      glastuinbouwbedrijven.

      3 Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2026-06-04#Artikel71ta
  - number: 71u
    text: Onder de naam CO-heffing glastuinbouw wordt een belasting geheven ter zake van de emissie van kooldioxide.
    url: https://wetten.overheid.nl/BWBR0007168/2026-06-04#Artikel71u
  - number: 71v
    text: |-
      1 De CO-heffing glastuinbouw wordt geheven van de exploitant van het glastuinbouwbedrijf, dan wel de exploitant van
      het energiebedrijf voor glastuinbouw.

      2 De exploitant is de rechtspersoon of natuurlijke persoon die het glastuinbouwbedrijf dan wel het energiebedrijf
      voor glastuinbouw als onderneming drijft.
    url: https://wetten.overheid.nl/BWBR0007168/2026-06-04#Artikel71v
  - number: 71w
    text: |-
      1 De belasting wordt berekend over het aantal ton kooldioxide dat is veroorzaakt op basis van het aantal
      normaalkubiekemeters aardgas dat door het glastuinbouwbedrijf of het energiebedrijf voor glastuinbouw is verstookt.

      2 Het aantal ton kooldioxide wordt berekend met de formule: An x 31,65 x standaard CO-emissiefactor voor aardgas /
      1.000.000. Hierbij staat An voor de verstookte hoeveelheid aardgas in normaal kubieke meters.

      3 De belastingplichtige monitort de hoeveelheid aardgas die is verstookt overeenkomstig bij ministeriële regeling
      te stellen regels.
    url: https://wetten.overheid.nl/BWBR0007168/2026-06-04#Artikel71w
  - number: 71x
    text: De belasting wordt verschuldigd op het tijdstip waarop de emissie van kooldioxide plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0007168/2026-06-04#Artikel71x
  - number: 71y
    text: |-
      1 Het tarief bedraagt per ton kooldioxide voor:

        - het kalenderjaar 2025: € 9,61;
        - het kalenderjaar 2026: € 11,60;
        - het kalenderjaar 2027: € 13,31;
        - het kalenderjaar 2028: € 15,02;
        - het kalenderjaar 2029: € 16,72;
        - de kalenderjaren vanaf 2030: € 18,43.

      2 Voor zover er aardgas is verstookt in een broeikasgasinstallatie wordt het tarief, genoemd in het eerste
      lid, verminderd met de termijnkoers van het broeikasgasemissierecht. Het tarief is niet lager dan nihil. De
      termijnkoers is voor een kalenderjaar het gewone gemiddelde, in euro, van de dagelijkse éénjaarstermijnkoersen
      van broeikasgasemissierechten (slotverkoopkoersen) voor levering in december van dat jaar, zoals waargenomen van
      1 september tot en met 31 oktober voorafgaand aan datzelfde jaar op de koolstofbeurs in de Europese Unie met het
      hoogste handelsvolume van die éénjaarstermijncontracten in die maanden.
    url: https://wetten.overheid.nl/BWBR0007168/2026-06-04#Artikel71y
  - number: 71z
    text: |-
      1 In afwijking van de [artikelen 10, tweede lid][ref1], en
      [19, eerste lid, van de Algemene wet inzake rijksbelastingen][ref2] worden de in een tijdvak verschuldigd geworden
      belasting voldaan en de daarop betrekking hebbende aangifte gedaan binnen een door de inspecteur gestelde termijn
      van ten minste drie maanden na het einde van het tijdvak.

      2 Bij ministeriële regeling als bedoeld in
      [artikel 19, tweede lid onderdeel a, van de algemene wet inzake rijksbelastingen][ref3] wordt bepaald dat voor
      de CO-heffing glastuinbouw het eerste tijdvak dat aanvangt op 1 januari 2025 de kalenderjaren 2025 en 2026
      beslaat. Voor dat tijdvak wordt in artikel 30h, eerste, tweede, vierde en vijfde lid, van de algemene wet inzake
      rijksbelastingen in plaats van «kalenderjaar of boekjaar» telkens gelezen «tijdvak».


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel19
    url: https://wetten.overheid.nl/BWBR0007168/2026-06-04#Artikel71z
