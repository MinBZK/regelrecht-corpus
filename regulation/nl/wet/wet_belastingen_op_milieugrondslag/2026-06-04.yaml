  - number: 71a
    text: |-
      Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:

        - *broeikasgas:* broeikasgas als bedoeld in [artikel 1.1, eerste lid, van de Wet milieubeheer][ref1];
        - *broeikasgasemissierecht:* broeikasgasemissierecht als bedoeld in
      [artikel 1.1, eerste lid, van de Wet milieubeheer][ref2];
        - *broeikasgasinstallatie:* broeikasgasinstallatie als bedoeld in
      [artikel 16a.2, eerste lid, van de Wet milieubeheer][ref3];
        - *één ton kooldioxide-equivalent:* één ton kooldioxide-equivalent als bedoeld in
      [artikel 1.1, eerste lid, van de Wet milieubeheer][ref4];
        - *elektriciteitsemissieverslag:* elektriciteitsemissieverslag als bedoeld in
      [artikel 16a.1, eerste lid, van de Wet milieubeheer][ref5].


