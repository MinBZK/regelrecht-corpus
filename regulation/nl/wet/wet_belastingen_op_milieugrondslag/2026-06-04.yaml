    text: |-
      1 Onder bij algemene maatregel van bestuur te stellen voorwaarden en beperkingen wordt als verbruik in de zin van
      [artikel 50, derde lid, onderdeel d][ref1], niet aangemerkt het verbruik van aardgas voor de vervaardiging van
      aardgas en minerale oliën als bedoeld in [artikel 25, eerste lid, van de Wet op de accijns][ref2], in dezelfde
      inrichting waarin dat aardgas is ontstaan.

      2 Bij regeling van Onze Minister kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.


