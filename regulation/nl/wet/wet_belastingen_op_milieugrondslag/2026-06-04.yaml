        artikel: '44'
        hoofdstuk: V
        afdeling: '5'
  - number: 45a
    text: |-
      De [artikelen 2, vijfde, zesde, zevende en elfde lid][ref1], en [83 van de Wet op de accijns][ref2] zijn van
      overeenkomstige toepassing.


