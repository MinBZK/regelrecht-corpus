  - number: '28'
    text: |-
      1 Het tarief bedraagt in geval van:

      a. het storten van afvalstoffen: € 40,85 per 1.000 kilogram;

      b. het verbranden van afvalstoffen in andere gevallen dan als bedoeld onder c: € 40,85 per 1.000 kilogram;

      c. het verbranden van afvalstoffen in een installatie waarin op grond van bij of krachtens de
      [Wet milieubeheer][ref1] of de [Omgevingswet][ref2] gestelde voorschriften, dan wel een op grond van laatstgenoemde
      wet afgegeven omgevingsvergunning, geen huishoudelijke afvalstoffen, gemengde bedrijfsafvalstoffen en gemengd
      sorteerresidu mogen worden verbrand: nihil;

      d. de overbrenging van afvalstoffen: € 40,85 per 1.000 kilogram.

      2 Bij toepassing van [artikel 23, eerste lid, onderdeel c][ref3], wordt voor de gehele periode van overbrenging het
      laagste tarief toegepast dat gedurende deze periode op enig moment geldt ingevolge het eerste lid, onderdeel d. De
      periode van overbrenging vangt aan op het tijdstip van aanvang van de eerste fysieke overbrenging met toepassing
      van de toestemming, bedoeld in artikel 23, eerste lid, onderdeel c, en eindigt op het tijdstip van de aanvang van
      de laatste fysieke overbrenging met toepassing van die toestemming.

      3 Bij regeling van Onze Ministers kunnen nadere regels worden gesteld ten behoeve van de uitvoering van het
      bepaalde bij het tweede lid.

      4 Bij regeling van Onze Minister kan worden bepaald dat het tarief voor het storten van afvalstoffen die ter
      verwijdering worden afgegeven in partijen die uitsluitend of nagenoeg uitsluitend bestaan uit door bij die regeling
      vast te stellen categorieën van gevaarlijke afvalstoffen, wordt vastgesteld tot een verlaagd percentage van het
      tarief, bedoeld in het eerste lid, onderdeel a, dan wel tot nihil.


