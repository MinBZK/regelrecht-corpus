  - number: '64'
    text: |-
      1 Vrijstelling van de belasting wordt verleend ter zake van de levering of het verbruik van:

      a. aardgas dat wordt gebruikt in een installatie voor elektriciteitsopwekking tot een volume dat correspondeert met
      0,2635 Nm3 per opgewekte kWh elektriciteit;

      b. aardgas dat wordt gebruikt in een installatie voor elektriciteitsopwekking met behulp waarvan elektriciteit
      wordt opgewekt uitsluitend door middel van hernieuwbare energiebronnen en elektriciteit;

      c. elektriciteit die wordt gebruikt in een installatie voor elektriciteitsopwekking; en

      d. elektriciteit en aardgas die worden gebruikt voor de instandhouding van het vermogen elektriciteit te
      produceren.

      2 In afwijking van het eerste lid, onderdeel a, wordt bij een installatie voor elektriciteitsopwekking met een
      totaal opgesteld elektrisch vermogen van niet meer dan 20 megawatt vrijstelling van de belasting verleend ter
      zake van de levering of het verbruik van aardgas dat wordt gebruikt voor het opwekken van elektriciteit tot een
      hoeveelheid die correspondeert met 0,2635 Nm3 per kWh elektriciteit die de exploitant van de installatie invoedt
      op een distributienet alsmede 0,1498 Nm3 per kWh elektriciteit die de exploitant van de installatie niet invoedt op
      een distributienet. De hoeveelheid opgewekte elektriciteit die wordt betrokken bij de berekening van de hoeveelheid
      aardgas waarvoor de per verbruiksperiode te berekenen vrijstelling wordt verleend is maximaal de hoeveelheid
      elektriciteit die de exploitant heeft opgewekt met de installatie.

      3 Indien het aardgas, bedoeld in het eerste lid, onderdeel a, en in het tweede lid, een bovenste verbrandingswaarde
      heeft die lager of hoger is dan 35,17 megajoule per Nm3, wordt het volume, bedoeld in het eerste lid, onderdeel a,
      naar evenredigheid verhoogd, onderscheidenlijk verlaagd.

      4 Vrijstelling van belasting wordt verleend ter zake van de levering of het verbruik van:

        - elektriciteit die wordt gebruikt voor chemische reductie en elektrolytische en metallurgische procedés; en
        - aardgas dat wordt gebruikt voor metallurgische procedés.

      Als levering of verbruik van elektriciteit voor elektrolytische procedés wordt in ieder geval aangemerkt
      de levering of het verbruik van elektriciteit voor de productie van waterstof, waaronder wordt verstaan de
      demineralisatie of elektrolyse van water alsmede de purificatie en compressie van de uit dit water ontstane
      waterstof.

      Als metallurgische procedés worden aangemerkt:

      a. de vervaardiging van metalen in primaire vorm;

      b. smeden, persen, stampen en profielwalsen van metaal;

      c. oppervlaktebehandeling bestaande uit harden of warmtebehandeling van metalen.

      De vrijstelling voor metallurgische procedés geldt alleen voor bedrijven die volgens de Standaard Bedrijfsindeling
      van 6 september 2025 van het Centraal Bureau voor de Statistiek behoren tot code 24 of 25.

      5 Vrijstelling van de belasting wordt verleend ter zake van de levering of het verbruik van aardgas dat wordt
      gebruikt voor mineralogische procedés.

      Als mineralogische procedés worden aangemerkt de vervaardiging van glas en glaswerk, de vervaardiging van
      keramische producten, de vervaardiging van cement, kalk of gips, de vervaardiging van kalkzandsteen of cellenbeton
      en de vervaardiging van steenwol.

      De vrijstelling voor mineralogische procedés geldt alleen voor de bedrijven die volgens de Standaard
      Bedrijfsindeling van 6 september 2025 van het Centraal Bureau voor de Statistiek behoren tot code 23.

      6 Vrijstelling van belasting wordt verleend ter zake van de levering of het verbruik van aardgas dat wordt
      gebruikt anders dan als brandstof dan wel aardgas dat wordt gebruikt als additief of als vulstof in producten die
      direct of indirect zijn bestemd voor verbruik, worden aangeboden voor verkoop of worden verbruikt als aardgas. De
      vrijstelling is niet van toepassing indien het gebruik van die producten:

      a. niet als verbruik wordt aangemerkt ingevolge [artikel 51, eerste lid][ref1]; of

      b. is onderworpen aan het tarief van nihil, bedoeld in [artikel 59, vierde lid][ref2].

      7 Bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur worden voorwaarden en
      beperkingen gesteld waaronder de vrijstellingen, bedoeld in het eerste, tweede, vierde, vijfde en zesde lid, worden
      verleend.

      8 Bij regeling van Onze Minister worden nadere regels gesteld ten behoeve van de uitvoering van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel59
