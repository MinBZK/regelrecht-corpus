      1 Vrijgesteld is de afgifte ter verwijdering of overbrenging ter verwijdering van baggerspecie.

      2 Indien baggerspecie ter verwijdering wordt afgegeven aan inrichtingen waar op grond van de voor die inrichting
      geldende omgevingsvergunning ook andere afvalstoffen dan baggerspecie mogen worden gestort, wordt door de aanbieder
      van de baggerspecie aan de houder van de inrichting een verklaring overgelegd waaruit blijkt dat sprake is van
      baggerspecie.

      3 De in het tweede lid bedoelde verklaring wordt verstrekt door Onze Minister van Infrastructuur en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0007168/2026-06-04#Artikel29
  - number: 29a
    text: |-
      Onder bij of krachtens op de voordracht van Onze Minister bij algemene maatregel van bestuur te stellen voorwaarden
      en beperkingen is vrijgesteld de afgifte ter verwijdering aan een inrichting van zuiveringsslib dat is bestemd om
      binnen die inrichting te worden verbrand.
    url: https://wetten.overheid.nl/BWBR0007168/2026-06-04#Artikel29a
  - number: 29b
    text: |-
      1 Vrijgesteld is de afgifte ter verwijdering of overbrenging ter verwijdering van afzonderlijk aangeboden asbest en
      asbesthoudende producten die toegepast zijn geweest als dakbedekking.

      2 Bij of krachtens op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur worden
      voorwaarden en beperkingen gesteld waaronder de vrijstelling, bedoeld in het eerste lid, wordt verleend.
    url: https://wetten.overheid.nl/BWBR0007168/2026-06-04#Artikel29b
  - number: '30'
    text: |-
      1 Op verzoek wordt teruggaaf verleend van belasting ter zake van afvalstoffen die afkomstig
      zijn van een overtreder jegens wie krachtens [artikel 18.2 van de Wet milieubeheer][ref1] of
      [artikel 18.1, aanhef en onder c, van de Omgevingswet][ref2] bestuursdwang is toegepast, indien:

      a. de afvalstoffen ter verwijdering aan een inrichting zijn afgegeven door of vanwege het bevoegd gezag van een
      provincie of van een gemeente;

      b. de afvalstoffenbelasting door de houder van de inrichting bij de provincie of de gemeente in rekening is
      gebracht;

      c. de afvalstoffen gescheiden van andere afvalstoffen zijn afgegeven aan de inrichting; en

      d. de kosten die verband houden met de toepassing van bestuursdwang, hieronder begrepen de stortkosten, de
      verschuldigde afvalstoffenbelasting en de overige kosten die direct met de verwijdering van de afvalstoffen verband
      houden, niet of niet geheel verhaald kunnen worden op de overtreder.

      2 De teruggaaf wordt verleend aan de provincie of de gemeente, die de afvalstoffen ter verwijdering heeft
      afgegeven.

      3 De teruggaaf bedraagt maximaal de betaalde afvalstoffenbelasting die naar evenredigheid is toe te rekenen aan het
      deel van de totale kosten van de toepassing van bestuursdwang dat niet verhaald kan worden op de overtreder.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel18.2
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel18.1
