  - number: '22'
    text: |-
      1 Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:

        - *afvalstoffen:* afvalstoffen als bedoeld in de [Wet milieubeheer][ref1], en zeer laag radioactief afval;
        - *zeer laag radioactief afval:* radioactieve afvalstoffen van natuurlijke bronnen van ioniserende straling,
      waarin de activiteit van de betrokken natuurlijke bronnen op enig moment gelijk is aan of hoger is dan de in
      [bijlage 3, onderdeel B, tabel A, deel 1, van het Besluit basisveiligheidsnormen stralingsbescherming][ref2]
      vermelde waarde, en de activiteitsconcentratie van de betrokken natuurlijke bronnen gelijk is aan of hoger is dan
      de in bijlage 3, onderdeel B, tabel A, deel 1, van het Besluit basisveiligheidsnormen stralingsbescherming vermelde
      waarde en lager is dan tien maal die waarde;
        - *verwijderen van afvalstoffen:* 1°. het storten van afvalstoffen op een stortplaats als bedoeld in de [bijlage
      bij de Omgevingswet](onbekend), waar op grond van een omgevingsvergunning voor een milieubelastende activiteit als
      bedoeld in [artikel 5.1, tweede lid, aanhef en onder b, van die wet][ref3] afvalstoffen mogen worden gestort, of
      het storten van afvalstoffen op een vergelijkbare stortplaats buiten Nederland; 2°. het verbranden van afvalstoffen
      in een afvalverbrandingsinstallatie of afvalmeeverbrandingsinstallatie als bedoeld in artikel 3, veertigste lid,
      onderscheidenlijk eenenveertigste lid, van [Richtlijn 2010/75](32010L0075)/EU van het Europees Parlement en de
      Raad van 24 november 2010 inzake industriële emissies (geïntegreerde preventie en bestrijding van verontreiniging)
      (PbEU 2010, L 334), waarin op grond van een omgevingsvergunning voor een milieubelastende activiteit als bedoeld
      in [artikel 5.1, tweede lid, aanhef en onder b, van de Omgevingswet][ref4] huishoudelijke afvalstoffen, gemengde
      bedrijfsafvalstoffen of gemengd sorteerresidu mogen worden verbrand, of het verbranden van afvalstoffen in een
      vergelijkbare installatie buiten Nederland;
        - *nuttige toepassing:* nuttige toepassing als bedoeld in de [Wet milieubeheer][ref5];
        - *storten:* storten als bedoeld in de [Wet milieubeheer][ref6];
        - *inrichting:* een terrein, dan wel een geheel van functioneel of organisatorisch samenhangende terreinen op
      dezelfde locatie, in Nederland, waar op grond van een of meer omgevingsvergunningen voor een milieubelastende
      activiteit als bedoeld in [artikel 5.1, tweede lid, aanhef en onder b, van de Omgevingswet][ref7], afvalstoffen
      mogen worden verwijderd;
        - *houder van de inrichting:* de houder van een of meer omgevingsvergunningen als bedoeld in onderdeel c, op grond
      waarvan binnen de inrichting afvalstoffen mogen worden verwijderd;
        - *baggerspecie:* 1°. materiaal dat is vrijgekomen uit de bodem of oever van een oppervlaktewaterlichaam en dat
      bestaat uit minerale delen met een maximale korrelgrootte van 2 millimeter en organische stof in een verhouding en
      met een structuur zoals deze in de bodem van nature worden aangetroffen, alsmede van nature in de bodem voorkomende
      schelpen en grind met een korrelgrootte van 2 tot 63 millimeter; 2°. sediment en het residu van de reiniging van
      baggerspecie;
        - *stoffen:* stoffen als bedoeld in de [Wet milieubeheer][ref8];
        - *preparaat:* een mengsel als bedoeld in [artikel 1.1 van de Wet milieubeheer][ref9];
        - *percolaat:* vloeistof die uit gestorte afvalstoffen komt of daarmee in contact is geweest;
        - *stortgas:* gas dat uit gestorte afvalstoffen vrijkomt als gevolg van biologische afbraakreacties;
        - *EVOA:* Verordening (EG) nr. 1013/2006 van het Europees parlement en de Raad van 14 juni 2006 betreffende de
      overbrenging van afvalstoffen (PbEU 2006, L 190);
        - *overbrenging:* overbrenging in de zin van de EVOA;
        - *zuiveringsslib:* bezinksel dat overblijft na het biologisch zuiveren van afvalwater van huishoudens en bedrijven
      in een rioolwaterzuiveringsinstallatie.

      2 Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen worden niet tot afvalstoffen gerekend
      die stoffen, preparaten en voorwerpen, die voldoen aan de voorwaarden van bij algemene maatregel van bestuur
      opgesomde besluiten en regelingen volgens welke deze stoffen, preparaten en voorwerpen buiten inrichtingen met
      een stortplaats milieuhygiënisch verantwoord zijn toe te passen, dan wel bestemd zijn te worden gebruikt voor bij
      algemene maatregel van bestuur aan te wijzen toepassingen die hetzij verband houden met de bedrijfsvoering van de
      inrichting, hetzij deel uitmaken van het bedrijfsproces dat leidt tot de nuttige toepassing of verwijdering van
      afvalstoffen.


