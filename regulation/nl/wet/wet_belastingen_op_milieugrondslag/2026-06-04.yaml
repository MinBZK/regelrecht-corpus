  - number: 71ha
    text: |-
      Indien een afvalverbrandingsinstallatie tevens een broeikasgasinstallatie is, zijn de bepalingen van dit hoofdstuk
      met betrekking tot afvalverbrandingsinstallaties van toepassing.
    url: https://wetten.overheid.nl/BWBR0007168/2026-06-04#Artikel71ha
  - number: 71i
    text: |-
      Dit hoofdstuk is van toepassing op industriële installaties met uitzondering van broeikasgasinstallaties
      van een glastuinbouwbedrijf of energiebedrijf voor glastuinbouw waarop hoofdstuk VIC van toepassing is en
      broeikasgasinstallaties die direct of indirect uitsluitend worden geëxploiteerd voor:

      a. stadsverwarming;

      b. het verwarmen of koelen van ruimten van gebouwen of locaties, daaronder begrepen het nagenoeg uitsluitend
      verwarmen of koelen van ruimten van gebouwen of locaties, en de meetbare warmte niet wordt gebruikt voor de
      productie van producten en daarmee verband houdende activiteiten; of

      c. het opwekken van elektriciteit zonder het gebruik van restgassen als brandstof.
    url: https://wetten.overheid.nl/BWBR0007168/2026-06-04#Artikel71i
  - number: 71j
    text: |-
      1 Onder de naam *CO-heffing industrie* wordt een belasting geheven ter zake van:

      a. de emissie van broeikasgas door een broeikasgasinstallatie;

      b. de emissie van kooldioxide door een afvalverbrandingsinstallatie; of

      c. de emissie van kooldioxide en distikstofoxide door een lachgasinstallatie.

      2 Van de heffing zijn uitgezonderd de emissies door broeikasgasinstallaties:

      a. als gevolg van het opwekken van elektriciteit zonder het gebruik van restgassen als brandstof; of

      b. als gevolg van het opwekken van meetbare warmte die wordt uitgevoerd ten behoeve van stadsverwarming indien de
      broeikasgasinstallatie in het belastingtijdvak meer dan driekwart van zijn totaal geproduceerde meetbare warmte in
      dat belastingtijdvak heeft uitgevoerd ten behoeve van stadsverwarming.

      3 Van de heffing is uitgezonderd de emissie van kooldioxide door broeikasgasinstallaties en
      afvalverbrandingsinstallaties die worden overgedragen voor geologische opslag en waarbij wordt voldaan aan bij
      ministeriële regeling te stellen voorwaarden.
    url: https://wetten.overheid.nl/BWBR0007168/2026-06-04#Artikel71j
  - number: 71k
    text: |-
      1 De CO-heffing industrie wordt geheven van degene die een industriële installatie exploiteert.

      2 De exploitant van een broeikasgasinstallatie is de exploitant, bedoeld in
      [artikel 16.11, eerste lid, tweede zin, van de Wet milieubeheer][ref1]. De exploitant
      van een afvalverbrandingsinstallatie is degene aan wie de omgevingsvergunning, bedoeld in
      [artikel 71h, onderdeel a][ref2], is verleend. De exploitant van een lachgasinstallatie is degene aan wie de
      omgevingsvergunning, bedoeld in artikel 71h, onderdeel i, is verleend.

      3 Indien de werking van een industriële installatie is beëindigd, wordt de belasting geheven van degene die als
      laatste de industriële installatie heeft geëxploiteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16.11
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel71h
    url: https://wetten.overheid.nl/BWBR0007168/2026-06-04#Artikel71k
