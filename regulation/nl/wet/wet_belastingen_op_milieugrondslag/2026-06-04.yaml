        artikel: '38'
        hoofdstuk: V
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: '43'
  - number: '40'
    text: |-
      1 Ter zake van uitslag wordt de belasting verschuldigd op het tijdstip van de uitslag.

      2 In afwijking van het eerste lid wordt de belasting bij toepassing van [artikel 33, tweede lid][ref1],
      verschuldigd op het tijdstip van de aanvang van het voorhanden hebben van de kolen.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel33
