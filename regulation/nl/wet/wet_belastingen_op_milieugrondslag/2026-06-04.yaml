  - number: 71q
    text: |-
      1 Indien voor een industriële installatie het aantal dispensatierechten van een belastingtijdvak de industriële
      jaarvracht van dat belastingtijdvak overtreft, gebruikt de exploitant dat overschot aan dispensatierechten voor
      een herberekening van de belasting die is betaald voor die industriële installatie over de vijf belastingtijdvakken
      voorafgaand aan het eerstgenoemde belastingtijdvak.

      2 De herberekening geschiedt in de aflopende volgorde die is gebaseerd op de hoogte van het tarief beginnend met
      het belastingtijdvak met het hoogste tarief.

      3 Voor de herberekening worden de tarieven gebruikt die van toepassing waren op het belastingtijdvak dat wordt
      herberekend.

      4 Indien uit de herberekening blijkt dat over een bepaald belastingtijdvak een teveel aan belasting is betaald,
      wordt dat bedrag aan teveel betaalde belasting in mindering gebracht op de belasting verschuldigd over het
      belastingtijdvak waarover aangifte wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0007168/2026-06-04#Artikel71q
  - number: 71r
    text: |-
      1 Voor de heffing en invordering van de belasting wordt voor de toepassing van de
      [Algemene wet inzake rijksbelastingen][ref1], de [Invorderingswet 1990][ref2] en de op die wetten berustende
      bepalingen onder rijksbelastingdienst verstaan de Dienst Nederlandse Emissieautoriteit. Hierbij staat deze dienst
      onder het gezag van de Minister van Financiën.

      2 Indien het bestuur van de Nederlandse emissieautoriteit ambtshalve de industriële jaarvracht heeft
      vastgesteld als bedoeld in [artikel 16b.6, vierde lid, van de Wet milieubeheer][ref3] of ambtshalve het aantal
      dispensatierechten heeft vastgesteld als bedoeld in [artikel 16b.24, vierde lid, van de Wet milieubeheer][ref4],
      en die vaststelling is onherroepelijk geworden op een tijdstip na vier jaren en tien maanden
      na het tijdvak waarin de belasting verschuldigd is geworden, vervalt, in afwijking van
      [artikel 20, derde lid, van de Algemene wet inzake rijksbelastingen][ref5], de bevoegdheid tot
      het opleggen van een naheffingsaanslag, en vervalt, in afwijking van de [artikelen 67c][ref6] en
      [67f van die laatstgenoemde wet][ref7], de bevoegdheid tot het opleggen van de boeten twee maanden na het hiervoor
      bedoelde tijdstip.

      3 In afwijking van de [artikelen 10, tweede lid][ref8], en
      [19, eerste lid, van de Algemene wet inzake rijksbelastingen][ref9] worden de in een tijdvak verschuldigd geworden
      belasting voldaan en de daarop betrekking hebbende aangifte gedaan uiterlijk 1 oktober van het jaar volgend op
      dat tijdvak.

      4 Bestaande geheimhoudingsbepalingen staan er niet aan in de weg dat de ambtenaren van de Dienst Nederlandse
      Emissieautoriteit gegevens of informatie verkregen op grond van deze afdeling gebruiken voor de taken, bedoeld in
      [hoofdstuk 16b van de Wet milieubeheer][ref10], dan wel gegevens of informatie verkregen op grond van de taken,
      bedoeld in hoofdstuk 16b van de Wet milieubeheer, gebruiken voor de taak, bedoeld in deze afdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0002320
