  - number: 71b
    text: |-
      Onder de naam *minimum CO-prijs elektriciteitsopwekking* wordt een belasting geheven ter zake van de emissie van
      broeikasgas als gevolg van de opwekking van elektriciteit.
    url: https://wetten.overheid.nl/BWBR0007168/2026-06-04#Artikel71b
  - number: 71c
    text: |-
      1 De belasting wordt geheven van degene die een broeikasgasinstallatie exploiteert.
      De exploitant van een broeikasgasinstallatie is de exploitant, bedoeld in
      [artikel 16.11, eerste lid, tweede zin, van de Wet milieubeheer][ref1].

      2 Indien de werking van een broeikasgasinstallatie is beëindigd, wordt de belasting geheven van degene die als
      laatste de broeikasgasinstallatie heeft geëxploiteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16.11
    url: https://wetten.overheid.nl/BWBR0007168/2026-06-04#Artikel71c
