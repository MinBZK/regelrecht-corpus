  - number: 71h
    text: |-
      Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:

        - *afvalverbrandingsinstallatie:* afvalverbrandingsinstallatie of afvalmeeverbrandingsinstallatie als bedoeld
      in artikel 3, veertigste, onderscheidenlijk eenenveertigste, lid, van [Richtlijn 2010/75](32010L0075)/EU van
      het Europees Parlement en de Raad van 24 november 2010 inzake industriële emissies (geïntegreerde preventie
      en bestrijding van verontreiniging) (PbEU 2010, L 334) waarin blijkens een omgevingsvergunning voor een
      milieubelastende activiteit als bedoeld in [artikel 5.1, tweede lid, van de Omgevingswet][ref1] huishoudelijke
      afvalstoffen, gemengde bedrijfsafvalstoffen of gemengd sorteerresidu mogen worden verbrand;
        - *broeikasgas:* broeikasgas als bedoeld in [artikel 1.1, eerste lid, van de Wet milieubeheer][ref2];
        - *broeikasgasinstallatie:* broeikasgasinstallatie als bedoeld in de [artikelen 16.1, tweede lid][ref3], en
      [16.3 van de Wet milieubeheer][ref4];
        - *dispensatierecht:* overdraagbaar recht om gedurende het kalenderjaar een emissie van één ton kooldioxide-
      equivalent in de lucht te veroorzaken in het kalenderjaar waarin die uitstoot plaatsvindt zonder toepassing van het
      tarief, genoemd in [artikel 71p, eerste lid, onderdeel a][ref5];
        - *één ton kooldioxide-equivalent:* één ton kooldioxide-equivalent als bedoeld in
      [artikel 1.1, eerste lid, van de Wet milieubeheer][ref6];
        - *industrieel emissieverslag:* industrieel emissieverslag als bedoeld in
      [artikel 16b.1, eerste lid, van de Wet milieubeheer][ref7];
        - *industriële installatie:* broeikasgasinstallatie, afvalverbrandingsinstallatie of lachgasinstallatie;
        - *industriële jaarvracht:* aantal ton kooldioxide-equivalent van een industriële installatie in een kalenderjaar
      dat in de lucht is veroorzaakt en ter zake waarvan de CO-heffing industrie wordt geheven;
        - *lachgasinstallatie:* installatie die blijkens een op grond van de [Omgevingswet][ref8] afgegeven
      omgevingsvergunning bestemd is voor de productie van acrylonitril of caprolactam en die geen broeikasgasinstallatie
      is;
        - *meetbare warmte:* meetbare warmte als bedoeld in artikel 2, zevende lid, van de Gedelegeerde Verordening
      (EU) 2019/331 van de Commissie van 19 december 2018 tot vaststelling van een voor de hele Unie geldende
      overgangsregeling voor de geharmoniseerde kosteloze toewijzing van emissierechten overeenkomstig artikel 10 bis van
      [Richtlijn 2003/87/EG](32003L0087) van het Europees Parlement en de Raad (PbEU 2019, L 59);
        - *Restgassen*: afgas als bedoeld in artikel 2, elfde lid, van de Verordening kosteloze toewijzing van
      emissierechten;
        - *stadsverwarming:* stadsverwarming als bedoeld in artikel 2, vierde lid, van de Gedelegeerde Verordening
      (EU) nr. 2019/331 van de Commissie van 19 december 2018 tot vaststelling van een voor de hele Unie geldende
      overgangsregeling voor de geharmoniseerde kosteloze toewijzing van emissierechten overeenkomstig artikel 10 bis van
      [Richtlijn 2003/87/EG](32003L0087) van het Europees Parlement en de Raad (PbEU 2019, L 59).


