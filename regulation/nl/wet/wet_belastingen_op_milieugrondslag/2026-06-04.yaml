  - number: 60b
    text: |-
      1 In afwijking van [artikel 59, eerste lid, onderdeel c][ref1], bedraagt het tarief voor elektriciteit die
      wordt geleverd aan een walstroominstallatie die geheel of nagenoeg geheel bestemd is voor schepen niet zijnde
      particuliere pleziervaartuigen als bedoeld in [artikel 70a, derde lid][ref2], per kWh 30% van het tarief, genoemd
      in artikel 59, eerste lid, onderdeel c, vierde aandachtstreepje.

      2 Het tarief, genoemd in het eerste lid, is niet van toepassing als de verbruiker een onderneming in moeilijkheden
      is.

      3 Bij of krachtens algemene maatregel van bestuur kunnen voorwaarden en beperkingen worden gesteld waaronder het
      tarief, genoemd in het eerste lid, wordt toegepast en worden nadere regels gesteld ter vaststelling wanneer de
      verbruiker moet worden aangemerkt als een onderneming in moeilijkheden.

      4 Bij regeling van Onze Minister kunnen nadere regels worden gesteld ten behoeve van de uitvoering van het eerste
      tot en met derde lid.

      5 Indien een begunstigde staatssteun ontvangt als gevolg van de toepassing van dit artikel verstrekt de
      belastingplichtige:

      a. aan Onze Minister van Infrastructuur en Waterstaat jaarlijks vóór een bij of krachtens algemene maatregel van
      bestuur te bepalen datum en op een bij of krachtens algemene maatregel van bestuur te bepalen wijze ten aanzien
      van die begunstigde de volgende gegevens en inlichtingen die worden gebruikt in verband met de verplichtingen die
      voortvloeien uit de Algemene Groepsvrijstellingsverordening met betrekking tot transparantievereisten:

      1°. de naam en het adres van de begunstigde en de provincie waarin deze is gevestigd;

      2°. het nummer, bedoeld in [artikel 9, onderdeel a, van de Handelsregisterwet 2007][ref3];

      3°. de datum waarop de steun voor het eerst is verleend;

      4°. per EAN-code het bedrag van de staatssteun in het betreffende kalenderjaar;

      b. aan Onze Minister op diens verzoek gegevens en inlichtingen die noodzakelijk zijn in het kader van artikel 108,
      eerste lid, van het Verdrag betreffende de werking van de Europese Unie.

      6 Een begunstigde die staatssteun ontvangt als gevolg van de toepassing van dit artikel verstrekt:

      a. aan Onze Minister van Infrastructuur en Waterstaat op diens verzoek gegevens en inlichtingen waaruit blijkt of
      de begunstigde een kmo is, indien op basis van gegevens en inlichtingen als bedoeld in het vijfde lid, onderdeel a,
      blijkt dat de begunstigde in een kalenderjaar meer staatssteun heeft ontvangen als gevolg van de toepassing van dit
      artikel dan het drempelbedrag, bedoeld in artikel Bijlage I van de Algemene Groepsvrijstellingsverordening, en Onze
      Minister van Infrastructuur en Waterstaat de op grond van dit onderdeel te verstrekken gegevens en inlichtingen
      nodig heeft om te bepalen of de begunstigde een kmo is;

      b. aan Onze Minister op diens verzoek gegevens en inlichtingen die noodzakelijk zijn in het kader van artikel 108,
      eerste lid, van het Verdrag betreffende de werking van de Europese Unie voor zover de belastingplichtige niet over
      de gegevens en inlichtingen beschikt.

      7 Onze Minister van Infrastructuur en Waterstaat kan een last onder dwangsom opleggen ter handhaving van het
      bepaalde bij of krachtens het vijfde lid, onderdeel a, of zesde lid, onderdeel a.

      8 Ten behoeve van het toezicht op de naleving van het bepaalde bij of krachtens het vijfde lid, onderdeel a,
      verstrekt de inspecteur indien beschikbaar aan Onze Minister van Infrastructuur en Waterstaat:

      a. de naam van de belastingplichtige die het eerste lid toepast;

      b. het nummer bedoeld in [artikel 9, onderdeel a, van de Handelsregisterwet 2007][ref4], het adres, telefoonnummer
      en e-mailadres van die belastingplichtige.


