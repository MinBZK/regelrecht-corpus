  - number: '50'
    text: |-
      1 De belasting wordt geheven ter zake van de levering van aardgas of elektriciteit via een aansluiting aan de
      verbruiker, alsmede ter zake van de levering van aardgas via een aansluiting aan een CNG-vulstation.

      2 Indien de verbruiker, bedoeld in het eerste lid, via een aansluiting elektriciteit op het distributienet heeft
      ingevoed ter zake waarvan [artikel 2.31 van de Energiewet][ref1] wordt toegepast, is het eerste lid van toepassing
      op het positieve saldo van de via de aansluiting geleverde elektriciteit minus de via de aansluiting ingevoede
      elektriciteit.

      3 De belasting wordt voorts geheven ter zake van:

      a. de levering, anders dan via een aansluiting, van aardgas of elektriciteit aan de verbruiker, of van aardgas aan
      een CNG-vulstation;

      b. het verbruik van aardgas of elektriciteit, indien dit product is verkregen door tussenkomst van een
      energiehandelsmarkt als bedoeld in [artikel 1.1 Energiewet][ref2] of een waterstofbeurs en geen sprake is van een
      levering via een aansluiting;

      c. het verbruik van aardgas of elektriciteit door degene die leveringen aan de verbruiker verricht of het verbruik
      van elektriciteit door een organisatorische eenheid die een energieopslagfaciliteit exploiteert;

      d. het verbruik van aardgas of elektriciteit, indien het aardgas of de elektriciteit is verkregen op andere wijze
      dan door een levering.

      4 Indien een levering van aardgas of elektriciteit wordt verricht aan een organisatorische eenheid die zich
      bezighoudt met het leveren van aardgas of elektriciteit of die een energieopslagfaciliteit exploiteert dan wel aan
      een verbruiker die op zijn beurt het geleverde aardgas of de geleverde elektriciteit levert aan een verbruiker,
      wordt eerstgenoemde levering niet aangemerkt als een levering als bedoeld in het eerste lid of het derde lid,
      onderdeel a.

      5 Het derde lid, onderdeel a, is niet van toepassing met betrekking tot de levering van elektriciteit aan een
      huurder van een woning, voor zover die elektriciteit door de verhuurder van die woning is opgewekt door middel van
      hernieuwbare energiebronnen, waarbij de productie-installatie is aangebracht op of aan het gebouw met toebehoren
      waarvan de woning onderdeel uitmaakt, dan wel op of aan de bij dat gebouw behorende grond met toebehoren.

      6 Het derde lid, onderdelen c en d, is niet van toepassing met betrekking tot het verbruik van:

      a. elektriciteit die de verbruiker heeft opgewekt door middel van hernieuwbare energiebronnen, met uitzondering van
      elektriciteit uit biomassa die niet als zuivere biomassa wordt aangemerkt;

      b. elektriciteit die de verbruiker heeft opgewekt door middel van een noodinstallatie in geval van storingen bij de
      levering via het distributienet;

      c. stortgas, rioolwaterzuiveringsgas of biogas dat de verbruiker heeft gewonnen;

      d. elektriciteit die de verbruiker heeft opgewekt door middel van een installatie voor elektriciteitsopwekking met
      een totaal opgesteld elektrisch vermogen van niet meer dan 20 megawatt.

      7 Bij of krachtens op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur worden
      voorwaarden en beperkingen gesteld waaraan een organisatorische eenheid die een energieopslagfaciliteit exploiteert
      moet voldoen.

      8 Bij regeling van Onze Minister worden nadere regels gesteld ten behoeve van de uitvoering van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2.31
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Artikel1.1
