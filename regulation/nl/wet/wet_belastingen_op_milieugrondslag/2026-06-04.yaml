  - number: '92'
    text: |-
      1 Bij de toepassing van [artikel 89][ref1] wordt voor de belasting op leidingwater, de afvalstoffenbelasting , de
      energiebelasting en de vliegbelasting een vermindering op de verschuldigde belasting toegepast, voor zover komt
      vast te staan dat een door de belastingplichtige ter zake te ontvangen bedrag niet is en niet zal worden ontvangen.

      2 De aanspraak op de vermindering van belasting ontstaat op het tijdstip waarop komt vast te staan dat het bedrag,
      bedoeld in het eerste lid, niet is en niet zal worden ontvangen, met dien verstande dat deze aanspraak uiterlijk
      ontstaat één jaar na het tijdstip waarop het geheel of gedeeltelijk niet ontvangen bedrag opeisbaar is geworden.

      3 Voor zover een bedrag ter zake waarvan de aanspraak op de vermindering van belasting is ontstaan, alsnog
      geheel of gedeeltelijk wordt ontvangen, wordt de belasting opnieuw verschuldigd op het tijdstip van ontvangst.
      [Artikel 89][ref2] is van toepassing.

      4 Ingeval de belastingplichtige zijn vordering ter zake van een bedrag als bedoeld in
      het eerste lid geheel of gedeeltelijk overdraagt aan een andere ondernemer als bedoeld in
      [artikel 7 van de Wet op de omzetbelasting 1968][ref3], treedt deze andere ondernemer met betrekking tot die
      vordering of het overgedragen gedeelte daarvan voor de toepassing van dit artikel op het tijdstip van die
      overdracht in de plaats van de belastingplichtige.

      5 Bij algemene maatregel van bestuur kunnen aan de vermindering, bedoeld in het eerste lid, voorwaarden en
      beperkingen worden gesteld.

      6 Bij regeling van Onze Minister kunnen regels worden gesteld ten behoeve van de uitvoering van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel89
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel89
