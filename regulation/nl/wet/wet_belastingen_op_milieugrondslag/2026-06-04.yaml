  - number: '63'
    text: |-
      1 Op de ter zake van de levering van elektriciteit, bedoeld in [artikel 50, eerste lid][ref1], verschuldigde
      belasting wordt een vermindering toegepast met betrekking tot onroerende zaken die op zich als gebouwde eigendommen
      zijn aan te merken en die kunnen dienen als woning of ten behoeve van de uitoefening van een bedrijf of beroep of
      anderszins een verblijfsfunctie hebben. De vermindering bedraagt € 519,80 per verbruiksperiode van twaalf maanden
      per aansluiting.

      2 Indien het bedrag van de over de verbruiksperiode verschuldigde belasting lager is dan het bedrag van de
      vermindering, bedoeld in het eerste lid, wordt het verschil aan de verbruiker terugbetaald.

      3 In de gevallen waarin een voorschotnota wordt uitgereikt of, indien geen voorschotnota wordt uitgereikt, een
      voorschotbedrag wordt ontvangen, wordt bij de berekening van het voorschotbedrag naar evenredigheid rekening
      gehouden met de belastingvermindering, bedoeld in het eerste lid.

      4 Bij een verbruiksperiode korter dan wel langer dan twaalf maanden worden de in het eerste lid genoemde bedragen
      naar evenredigheid verlaagd, onderscheidenlijk verhoogd.

      5 Bij toepassing van [artikel 50, derde lid][ref2], zijn het eerste en vierde lid van overeenkomstige toepassing.

      6 Bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur kunnen voorwaarden en
      beperkingen worden gesteld waaronder de belastingvermindering, bedoeld in het eerste lid, wordt verleend.

      7 Bij regeling van Onze Minister worden nadere regels gesteld ten behoeve van de uitvoering van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel50
