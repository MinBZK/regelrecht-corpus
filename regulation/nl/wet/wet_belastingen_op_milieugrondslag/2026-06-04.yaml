  - number: '55'
    text: |-
      De belasting wordt berekend:

      a. voor aardgas: per eenheid brandstof, uitgedrukt in kubieke meter, met inachtneming van de bij of krachtens de
      [Energiewet][ref1] gestelde regels ter bepaling van de geleverde hoeveelheid;

      b. voor elektriciteit en waterstof: per eenheid energie-inhoud, uitgedrukt in kWh.


      [ref1]: https://wetten.overheid.nl/BWBR0050714
