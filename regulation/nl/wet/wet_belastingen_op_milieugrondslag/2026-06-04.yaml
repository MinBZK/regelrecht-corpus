  - number: 71o
    text: De belasting wordt verschuldigd op het tijdstip waarop de emissie van broeikasgas plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0007168/2026-06-04#Artikel71o
  - number: 71p
    text: |-
      1 Het tarief bedraagt:

      a. in het geval van [artikel 71l, eerste lid, onderdeel a][ref1], per ton kooldioxide-equivalent voor een
      broeikasgasinstallatie of lachgasinstallatie € 78,67 en voor een afvalverbrandingsinstallatie € 103,66;

      b. in het geval van [artikel 71l, eerste lid, onderdeel b][ref2], per ton kooldioxide-equivalent het tarief,
      genoemd in [artikel 71f, eerste lid][ref3].

      2 Het tarief voor een afvalverbrandingsinstallatie, genoemd in het eerste lid, onderdeel a, wordt bij aanvang van
      de volgende kalenderjaren, alvorens [artikel 90][ref4] wordt toegepast, telkens verhoogd. Deze verhoging is voor:

        - het kalenderjaar 2027: € 49,66;
        - het kalenderjaar 2028: € 50,42;
        - het kalenderjaar 2029: € 50,42; en
        - het kalenderjaar 2030: € 49,39.

      [Artikel 90][ref5] vindt geen toepassing op een bedrag in dit lid nadat daarmee het tarief is verhoogd.

      3 Voor een broeikasgasinstallatie wordt het tarief, genoemd in het eerste lid, onderdeel a, verminderd
      met de termijnkoers van het broeikasgasemissierecht. Het tarief is niet lager dan nihil. De termijnkoers
      van het broeikasgasemissierecht is voor een kalenderjaar het gewone gemiddelde, in euro, van de dagelijkse
      éénjaarstermijnkoersen van broeikasgasemissierechten (slotverkoopkoersen) voor levering in december van dat jaar,
      zoals waargenomen van 1 september tot en met 31 oktober voorafgaand aan datzelfde jaar op de koolstofbeurs in de
      Europese Unie met het hoogste handelsvolume van die éénjaarstermijncontracten in die maanden.

      4 Het derde lid is niet van toepassing voor zover de grondslag, bedoeld in
      [artikel 71l, eerste lid, onderdeel a][ref6], hoger is door de overdracht van dispensatierechten, bedoeld in
      [afdeling 16b.3.3, van de Wet milieubeheer][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel71l
