  - number: 61a
    text: |-
      In de gevallen, bedoeld in [artikel 47, zevende lid, onderdeel b][ref1], wordt de belasting ter zake
      van de leveringen die vanaf het begin van het kalenderjaar zijn verricht, herrekend met inachtneming van
      [artikel 61][ref2]. Indien deze herrekening leidt tot een hoger of lager belastingbedrag dan de belasting
      die zonder de herrekening over de gehele verbruiksperiode verschuldigd zou zijn, wordt de belasting die moet
      worden voldaan over het tijdvak waarin de overeenkomst tot levering wordt beëindigd dienovereenkomstig verhoogd
      onderscheidenlijk verlaagd. Bij de bepaling van de belasting die op de eindafrekening aan de verbruiker wordt
      vermeld, wordt de verhoging of verlaging, bedoeld in de tweede volzin, in aanmerking genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel61
