  - number: 71l
    text: |-
      1 De belasting wordt berekend over:

      a. de industriële jaarvracht van een industriële installatie in het belastingtijdvak verminderd met het aantal
      dispensatierechten voor die industriële installatie in hetzelfde belastingtijdvak; en

      b. de industriële jaarvracht van een industriële installatie in het belastingtijdvak die niet onder onderdeel
      a valt.

      2 De grondslag is niet lager dan nihil.
    url: https://wetten.overheid.nl/BWBR0007168/2026-06-04#Artikel71l
  - number: 71m
    text: |-
      1 De industriële jaarvracht is overeenkomstig hetgeen is vermeld in het industrieel emissieverslag.

      2 Indien het bestuur van de Nederlandse emissieautoriteit de industriële jaarvracht ambtshalve heeft vastgesteld
      als bedoeld in [artikel 16b.6, vierde lid, van de Wet milieubeheer][ref1] en die vaststelling is onherroepelijk
      geworden, is de industriële jaarvracht overeenkomstig die vaststelling.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16b.6
    url: https://wetten.overheid.nl/BWBR0007168/2026-06-04#Artikel71m
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: 16b.6
  - number: 71n
    text: |-
      1 Het aantal dispensatierechten is het aantal dispensatierechten dat de exploitant voor een industriële
      installatie op 1 september van het jaar na afloop van het belastingtijdvak op zijn rekening heeft als bedoeld in
      [artikel 16b.16, eerste lid, van de Wet milieubeheer][ref1].

      2 Indien het bestuur van de Nederlandse emissieautoriteit op of na de datum, genoemd
      in het eerste lid, op de rekening dispensatierechten stort of afboekt als bedoeld in
      [artikel 16b.16, vierde lid, van de Wet milieubeheer][ref2], is het aantal dispensatierechten het aantal
      dispensatierechten dat na die storting of afboeking op de rekening staat.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16b.16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel16b.16
    url: https://wetten.overheid.nl/BWBR0007168/2026-06-04#Artikel71n
