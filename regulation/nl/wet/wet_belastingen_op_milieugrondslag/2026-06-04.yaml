  - number: 27a
    text: |-
      1 Op de ingevolge [artikel 23, eerste lid, onderdeel a of b][ref1], verschuldigde belasting wordt in mindering
      gebracht de belasting ter zake van stoffen, preparaten of voorwerpen die in de inrichting in een zodanige staat
      zijn gebracht, dat deze op grond van [artikel 22, tweede lid][ref2], niet langer tot afvalstoffen worden gerekend.

      2 Het eerste lid is slechts van toepassing voor zover uit boeken en bescheiden blijkt dat ten aanzien van de
      stoffen, preparaten en voorwerpen wordt voldaan aan de voorwaarden en beperkingen, gesteld bij of krachtens
      [artikel 22, tweede lid][ref3].

      3 [Artikel 27, tweede lid][ref4], is van overeenkomstige toepassing.

      4 Bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur kunnen voorwaarden en
      beperkingen worden gesteld waaronder de in het eerste lid bedoelde vermindering wordt toegepast.

      5 Bij regeling van Onze Minister kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.


