  - number: '73'
    text: |-
      1 Onder de naam vliegbelasting wordt een belasting geheven ter zake van het vertrek van een passagier met een
      vliegtuig vanaf een in Nederland gelegen luchthaven.

      2 Als vertrek van een passagier wordt niet aangemerkt het vertrek vanaf een luchthaven indien:

      a. dat vertrek als onderdeel van één vervoersovereenkomst plaatsvindt aansluitend op het moment van aankomst van de
      passagier met een vliegtuig op die luchthaven;

      b. de aansluiting de belangrijkste reden is voor het gebruik van de luchthaven; en

      c. de passagier het gebied van de luchthaven, dat een vertrekkende passagier alleen mag betreden met een geldig
      vervoersbewijs, tussen het moment van aankomst en het moment van vertrek niet langer dan 24 uur heeft verlaten.
    url: https://wetten.overheid.nl/BWBR0007168/2026-06-04#Artikel73
  - number: '74'
    text: De belasting wordt geheven van de exploitant van de luchthaven.
    url: https://wetten.overheid.nl/BWBR0007168/2026-06-04#Artikel74
  - number: '75'
    text: De vliegbelasting wordt berekend over het aantal passagiers dat met een vliegtuig vertrekt van de luchthaven.
    url: https://wetten.overheid.nl/BWBR0007168/2026-06-04#Artikel75
  - number: '76'
    text: |-
      De vliegbelasting wordt verschuldigd op het tijdstip waarop de passagier met een vliegtuig vertrekt van de
      luchthaven.
    url: https://wetten.overheid.nl/BWBR0007168/2026-06-04#Artikel76
  - number: '77'
    text: Het tarief bedraagt € 30,25 per passagier.
    url: https://wetten.overheid.nl/BWBR0007168/2026-06-04#Artikel77
  - number: '78'
    text: |-
      Bij regeling van Onze Minister kunnen nadere regels worden gesteld omtrent de wijze waarop de belastingplichtige
      een administratie moet voeren voor de toepassing van de vliegbelasting.
    url: https://wetten.overheid.nl/BWBR0007168/2026-06-04#Artikel78
  - number: '79'
    text: |-
      1 De luchtvaartmaatschappij verstrekt aan de exploitant van de luchthaven de gegevens die nodig zijn voor
      een juiste toepassing van dit hoofdstuk. De verstrekking van deze gegevens vindt plaats gelijktijdig met de
      verstrekking van de gegevens die de luchtvaartmaatschappij als gebruiker van de luchthaven verplicht is aan de
      exploitant van de luchthaven te verstrekken.

      2 De luchtvaartmaatschappij is gehouden tot betaling van de vliegbelasting die de exploitant van de luchthaven bij
      haar in rekening brengt, voor zover deze belasting door de exploitant van de luchthaven is verschuldigd ter zake
      van het vertrek van passagiers met een vliegtuig van die luchtvaartmaatschappij.
    url: https://wetten.overheid.nl/BWBR0007168/2026-06-04#Artikel79
  - number: '89'
    text: |-
      1 De in een tijdvak verschuldigd geworden belasting moet op aangifte worden voldaan.

      2 Indien de berekening van de verschuldigde belasting leidt tot een negatief bedrag verleent de inspecteur op
      verzoek van de belastingplichtige teruggaaf van dit bedrag. Het verzoek om teruggaaf geschiedt bij de aangifte over
      het tijdvak waarover de belasting berekend is.
    url: https://wetten.overheid.nl/BWBR0007168/2026-06-04#Artikel89
  - number: '90'
    text: |-
      De [artikelen 10.1][ref1] en [10.2 van de Wet inkomstenbelasting 2001][ref2] zijn van overeenkomstige
      toepassing op de in de [artikelen 18][ref3], [28][ref4], [43][ref5], [59, eerste en derde lid][ref6],
      [71p, eerste en tweede lid][ref7], en [77][ref8] vermelde bedragen. Het bepaalde in de eerste zin vindt tevens
      toepassing op de bedragen voor het kalenderjaar 2025 en volgende kalenderjaren, genoemd in artikel 71y, eerste lid,
      met dien verstande dat daarbij telkens voor elk betreffend kalenderjaar de tabelcorrectiefactor wordt toegepast die
      op dat kalenderjaar ziet en voorts die tabelcorrectiefactor telkens eveneens wordt toegepast op de bedragen voor de
      kalenderjaren die op dat kalenderjaar volgen.


