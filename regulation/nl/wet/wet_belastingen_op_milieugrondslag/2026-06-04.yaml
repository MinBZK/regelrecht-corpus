  - number: '23'
    text: |-
      1 Onder de naam afvalstoffenbelasting wordt een belasting geheven ter zake van:

      a. de afgifte ter verwijdering van afvalstoffen aan een inrichting;

      b. de verwijdering van afvalstoffen binnen de inrichting waarin deze zijn ontstaan;

      c. de overbrenging van afvalstoffen uit Nederland om deze buiten Nederland te verwijderen of te laten verwijderen
      met toepassing van een ingevolge de EVOA bij beschikking verleende toestemming tot overbrenging, met uitzondering
      van afvalstoffen waarvan uit boeken en bescheiden blijkt dat zij naar Nederland zijn overgebracht in de zin van
      de EVOA.

      2 De aan een inrichting afgegeven afvalstoffen en de uit Nederland overgebrachte afvalstoffen worden geacht alle
      ter verwijdering te zijn afgegeven, onderscheidenlijk overgebracht.

      3 De uitzondering voor afvalstoffen die naar Nederland zijn overgebracht, bedoeld in het eerste lid, onderdeel c,
      geldt niet voor afvalstoffen die in Nederland zijn ontstaan of zijn vermengd met afvalstoffen die in Nederland
      zijn ontstaan.

      4 Het eerste lid, onderdeel b, is niet van toepassing op de verwijdering van verbrandingsresten binnen de
      inrichting waarin deze zijn ontstaan, voor zover die verbrandingsresten zijn ontstaan door het verbranden van aan
      die inrichting ter verwijdering afgegeven afvalstoffen ter zake waarvan afvalstoffenbelasting is geheven.

      5 Bij regeling van Onze Minister kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2026-06-04#Artikel23
  - number: '24'
    text: |-
      De belasting wordt geheven:

      a. bij toepassing van [artikel 23, eerste lid, onderdelen a en b][ref1]: van de houder van de inrichting;

      b. bij toepassing van [artikel 23, eerste lid, onderdeel c][ref2]: van de kennisgever, bedoeld in artikel 2,
      vijftiende lid, van de EVOA, aan wie de toestemming is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel23
