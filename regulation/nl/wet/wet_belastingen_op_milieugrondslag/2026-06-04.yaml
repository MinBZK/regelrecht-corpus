        bwb_id: BWBR0003245
        artikel: '16.11'
  - number: 71d
    text: |-
      1 De belasting wordt berekend over het aantal ton kooldioxide-equivalent dat in de lucht is veroorzaakt
      overeenkomstig het elektriciteitsemissieverslag van de broeikasgasinstallatie.

      2 In afwijking van het eerste lid wordt, indien de emissieautoriteit ambtshalve de elektriciteitsjaarvracht
      heeft vastgesteld als bedoeld in [artikel 16a.8, tweede lid, van de Wet milieubeheer][ref1] en die vaststelling
      is onherroepelijk geworden, de belasting berekend over het aantal ton kooldioxide-equivalent dat in de lucht is
      veroorzaakt overeenkomstig die vaststelling.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16a.8
