preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is belastingen op grondwater, afvalstoffen en uranium-
    235 in te stellen en deze te zamen met de in de Wet milieubeheer opgenomen verbruiksbelastingen van brandstoffen te
    vervatten in één wet belastingen op milieugrondslag;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007168/2026-06-04#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Krachtens deze wet worden de volgende belastingen geheven:

      a. een belasting op leidingwater;

      b. een afvalstoffenbelasting;

      c. een belasting op kolen;

      d. een energiebelasting;

      e. een minimum CO-prijs elektriciteitsopwekking;

      f. een CO-heffing industrie;

      g. een CO-heffing glastuinbouw;

      h. een vliegbelasting.
    url: https://wetten.overheid.nl/BWBR0007168/2026-06-04#Artikel1
  - number: '2'
    text: |-
      1 Voor de toepassing van deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *Onze Minister:* Onze Minister van Financiën;
        - *Onze Ministers:* Onze Minister van Financiën en Onze Minister van Infrastructuur en Waterstaat;
        - *GN-code:* de code, bedoeld in Verordening (EEG) nr. 2658/87 van de Raad van 23 juli 1987 met betrekking tot de
      tarief- en statistieknomenclatuur en het gemeenschappelijk douanetarief (PbEG 1987, L 256), zoals deze luidde op
      1 januari 2018.

      2 Bij regeling van Onze Minister kunnen de GN-codes, genoemd in deze wet en de daarop berustende bepalingen worden
      aangepast indien de overeenkomstige GN-codes zoals opgenomen in Richtlijn 2003/96/EG van de Raad van 27 oktober
      2003 tot herstructurering van de communautaire regeling voor de belasting van energieproducten en elektriciteit
      (PbEU 2003, L 283), in overeenstemming met artikel 2, vijfde lid, van die richtlijn zijn aangepast. In dat
      geval kan bij regeling van Onze Minister eveneens de laatstgenoemde datum in het eerste lid, onderdeel c, worden
      vervangen door de datum van de versie van de in dat onderdeel bedoelde verordening die aan de wijziging van de GN-
      codes ten grondslag heeft gelegen.
    url: https://wetten.overheid.nl/BWBR0007168/2026-06-04#Artikel2
  - number: '12'
    text: |-
      1 Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:

      a. leidingwater: water dat door een drinkwaterbedrijf of een afzonderlijke watervoorziening aan derden ter
      beschikking wordt gesteld, al dan niet van drinkwaterkwaliteit;

      b. drinkwaterbedrijf: drinkwaterbedrijf als bedoeld in [artikel 1, eerste lid, van de Drinkwaterwet][ref1];

      c. afzonderlijke watervoorziening: landgebonden voorziening, niet zijnde een drinkwaterbedrijf, voor de winning of
      behandeling van water dat met behulp van een distributienet als leidingwater ter beschikking wordt gesteld;

      d. aansluiting: een aansluiting van een in Nederland gelegen onroerende zaak als bedoeld in
      [artikel 16, onderdelen a tot en met e, van de Wet waardering onroerende zaken][ref2], op het distributienet van
      een drinkwaterbedrijf of van een afzonderlijke watervoorziening, waaruit leidingwater aan de verbruiker wordt
      geleverd; een aansluiting kan bestaan uit een of meer leveringspunten;

      e. particuliere installatie voor centrale watervoorziening: installatie
      voor de levering van water aan meer dan een onroerende zaak als bedoeld in
      [artikel 16, onderdelen a tot en met e, van de Wet waardering onroerende zaken][ref3], welke installatie permanent
      is aangesloten op het distributienet van een drinkwaterbedrijf of van een afzonderlijke watervoorziening;

      f. verbruiksperiode:

      1°. in gevallen waarin een voorschotnota wordt uitgereikt of, indien geen voorschotnota wordt uitgereikt, een
      voorschotbedrag wordt ontvangen: tijdvak waarop de eindfactuur betrekking heeft;

      2°. in overige gevallen: kalenderjaar;

      g. eindfactuur: definitieve factuur waarin verrekening plaatsvindt met de voorschotnota’s of voorschotbedragen die
      betrekking hebben op het tijdvak waarop de factuur ziet;

      h. verbruiker: degene die, anders dan in de hoedanigheid van drinkwaterbedrijf of afzonderlijke watervoorziening,
      leidingwater verkrijgt van een drinkwaterbedrijf of afzonderlijke watervoorziening.

      2 In afwijking van het eerste lid, onderdeel f, onder 2°, is de verbruiksperiode in de aldaar bedoelde gevallen:

      a. ingeval de overeenkomst tot levering in de loop van het kalenderjaar aanvangt: het gedeelte van het kalenderjaar
      vanaf het tijdstip waarop de overeenkomst tot levering aanvangt;

      b. ingeval de overeenkomst tot levering in de loop van het kalenderjaar wordt beëindigd: het gedeelte van het
      kalenderjaar tot het tijdstip waarop de overeenkomst tot levering eindigt.


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007119#Artikel16
