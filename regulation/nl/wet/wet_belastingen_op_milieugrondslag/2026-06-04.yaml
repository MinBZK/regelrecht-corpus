    text: |-
      1 De inspecteur beslist op het verzoek, bedoeld in de [artikelen 20, eerste lid][ref1], [27, derde lid][ref2],
      [30, eerste lid][ref3], [45, eerste en tweede lid][ref4], [54, derde lid][ref5], [67, eerste lid][ref6],
      [68, eerste en tweede lid][ref7], [69, eerste tot en met derde lid][ref8], [70, eerste tot en met derde lid][ref9],
      [70a, eerste lid][ref10], [89, tweede lid][ref11], en [92, eerste lid][ref12], bij een voor bezwaar vatbare
      beschikking.

      2 Binnen acht weken na ontvangst van het verzoek geeft de inspecteur een beschikking op dat verzoek, dan wel zendt
      hij de in het derde lid bedoelde kennisgeving.

      3 Indien de inspecteur de beschikking niet binnen de in het tweede lid genoemde termijn kan geven, stelt hij de
      belanghebbende daarvan onder opgaaf van redenen in kennis en noemt hij de termijn waarop de beschikking wel zal
      worden gegeven.

      4 [Paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref13] is van toepassing op:

      a. verzoeken aan de inspecteur tot aanwijzing van een teruggaaftijdvak op grond van bepalingen krachtens
      [artikel 45, derde lid][ref14];

      b. verzoeken aan de inspecteur tot aanwijzing van een teruggaaftijdvak op grond van bepalingen krachtens
      [artikel 70, vierde lid][ref15].


