      4 Op verzoek wordt aan de verbruiker van wie geen belasting wordt geheven als bedoeld in artikel 53 teruggaaf van
      de belasting verleend met betrekking tot aardgas dat wordt gebruikt op een in artikel 64, eerste lid, onderdeel a,
