  - number: '26'
    text: |-
      De belasting wordt verschuldigd op het tijdstip waarop:

      a. de afvalstoffen ter verwijdering worden afgegeven; dan wel

      b. de afvalstoffen binnen de inrichting waarin deze afvalstoffen zijn ontstaan, worden verwijderd; dan wel

      c. de geldigheidsduur van de beschikking, houdende toestemming tot overbrenging, is verlopen, en zes
      kalendermaanden zijn verstreken sinds de maand waarin de verklaring, bedoeld in artikel 16, onderdeel e, van de
      EVOA, is ontvangen, dan wel ontvangen had moeten zijn, voor alle afvalstoffen die met toepassing van de toestemming
      zijn overgebracht uit Nederland.
    url: https://wetten.overheid.nl/BWBR0007168/2026-06-04#Artikel26
  - number: '27'
    text: |-
      1 Op de ingevolge [artikel 23, eerste lid, onderdeel a of b][ref1], verschuldigde belasting wordt in mindering
      gebracht de belasting ter zake van stoffen, preparaten of voorwerpen die de inrichting, al dan niet na nuttige
      toepassing, hebben verlaten, met dien verstande dat de vermindering niet wordt toegepast ter zake van percolaat,
      stortgas of stoffen die na verbranding via de schoorsteen de inrichting verlaten.

      2 Het eerste lid is slechts van toepassing voor zover uit boeken en bescheiden blijkt:

      a. dat de stoffen, preparaten en voorwerpen niet op enig moment in het voor stort bestemde gedeelte van de
      inrichting op of in de bodem zijn gebracht en zich niet langer dan drie jaar binnen de inrichting hebben bevonden;

      b. hoeveel belasting ter zake van de stoffen, preparaten en voorwerpen geheven is.

      3 Indien bij de afgifte van een afzonderlijke, duidelijk herkenbare afvalstoffenstroom aan een inrichting bekend
      is dat deze niet uitsluitend bestaat uit voor verwijdering bestemde afvalstoffen, kan de inspecteur op schriftelijk
      verzoek van de belastingplichtige toestaan dat voor de berekening van de verschuldigde belasting met betrekking tot
      die afvalstroom de totale hoeveelheid afgegeven afvalstoffen door toepassing van een verhoudingsgetal wordt herleid
      tot de hoeveelheid voor verwijdering afgegeven afvalstoffen.

      4 Het in het derde lid bedoelde verhoudingsgetal wordt gebaseerd op de gegevens uit het voorafgaande tijdvak. Na
      afloop van het kalenderjaar vindt herrekening plaats op de voet van het eerste en tweede lid.

      5 Bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur kunnen voorwaarden en
      beperkingen worden gesteld waaronder de in het eerste lid bedoelde vermindering van belasting en het in het derde
      lid bedoelde verhoudingsgetal worden toegepast.

      6 Bij regeling van Onze Minister kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel23
