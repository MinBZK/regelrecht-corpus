  - number: '31'
    text: |-
      1 De belastingplichtige is gehouden een administratie te voeren zodanig dat daaruit te allen tijde duidelijk
      blijken de aard, de hoeveelheid en de herkomst van de afvalstoffen.

      2 De belastingplichtige, bedoeld in [artikel 24, onderdeel a][ref1], is gehouden de administratie zodanig in te
      richten dat daarin op overzichtelijke wijze is opgenomen welke stoffen, preparaten of voorwerpen als bedoeld in
      [artikel 22, tweede lid][ref2], in welke hoeveelheden en op welk tijdstip de inrichting zijn binnengebracht dan wel
      hebben verlaten.

      3 De belastingplichtige, bedoeld in [artikel 24, onderdeel b][ref3], is gehouden de administratie zodanig in te
      richten dat daarin per overbrenging op overzichtelijke wijze is opgenomen:

      a. op basis van welke beschikking, houdende toestemming tot overbrenging, de afvalstoffen zijn overgebracht uit
      Nederland;

      b. welke stoffen, preparaten en voorwerpen in welke hoeveelheden uit Nederland zijn overgebracht en op welk
      tijdstip het vervoer van de afvalstoffen in het kader van de overbrenging is aangevangen.


