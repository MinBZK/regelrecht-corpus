  - number: '68'
    text: |-
      1 Op verzoek wordt aan de verbruiker teruggaaf van de belasting verleend met betrekking tot aardgas en
      elektriciteit, voor zover de belasting over de hoeveelheden aardgas en elektriciteit die door een verbruiker
      gedurende dezelfde periode binnen een kalenderjaar van verschillende leveranciers zijn betrokken, hoger is dan de
      belasting die zou zijn verschuldigd indien sprake was van één leverancier.

      2 Op verzoek wordt aan de verbruiker teruggaaf van de belasting verleend voor zover met betrekking tot zakelijk
      verbruik van elektriciteit boven de 10 000 000 kWh per verbruiksperiode van twaalf maanden per aansluiting het
      tarief voor niet-zakelijk verbruik in rekening is gebracht.

      3 Bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur worden voorwaarden en
      beperkingen gesteld waaronder de teruggaven, bedoeld in het eerste en tweede lid, worden verleend.

      4 Bij regeling van Onze Minister kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2026-06-04#Artikel68
  - number: '69'
    text: |-
      1 Op verzoek wordt teruggaaf van de belasting verleend met betrekking tot aardgas en elektriciteit, verbruikt
      in een onroerende zaak die in hoofdzaak is bestemd voor de openbare eredienst of voor het houden van openbare
      bezinningsbijeenkomsten van levensbeschouwelijke aard.

      2 Op verzoek wordt teruggaaf verleend met betrekking tot aardgas en elektriciteit, verbruikt in een onroerende zaak
      die hoofdzakelijk in gebruik is bij een algemeen nut beogende instelling of bij een instelling die voldoet aan de
      voorwaarden, bedoeld in [artikel 5c, onderdelen a en b, van de Algemene wet inzake rijksbelastingen][ref1], mits:

      a. de in de aanhef bedoelde instellingen niet of slechts in beperkte mate werkzaam zijn op het gebied van sport,
      gezondheidszorg of onderwijs;

      b. de in de aanhef bedoelde instellingen geen publiekrechtelijk lichaam zijn;

      c. de in de aanhef bedoelde instellingen beschikken over een eigen aansluiting;

      d. de in de aanhef bedoelde algemeen nut beogende instelling niet aan vennootschapsbelasting is onderworpen dan wel
      daarvan is vrijgesteld;

      e. de werkzaamheden van de in de aanhef bedoelde instelling die voldoet aan de voorwaarden, bedoeld in
      [artikel 5c, onderdelen a en b, van de Algemene wet inzake rijksbelastingen][ref2], geheel of nagenoeg geheel
      worden verricht door natuurlijke personen om niet of naar een loon dat in belangrijke mate lager is dan hetgeen in
      het economische verkeer gebruikelijk is.

      3 Op verzoek wordt teruggaaf verleend met betrekking tot aardgas en elektriciteit, verbruikt in
      een onroerende zaak die hoofdzakelijk in gebruik is bij meer dan één instelling die een algemeen
      nut beogende instelling is of die een instelling is die voldoet aan de voorwaarden, bedoeld in
      [artikel 5c, onderdelen a en b, van de Algemene wet inzake rijksbelastingen][ref3], en het tweede lid, onderdeel
      e, mits:

      a. de in de aanhef bedoelde instellingen niet of slechts in beperkte mate werkzaam zijn op het gebied van sport,
      gezondheidszorg of onderwijs;

      b. de in de aanhef bedoelde instelling die voldoet aan de voorwaarden, bedoeld in
      [artikel 5c, onderdelen a en b, van de Algemene wet inzake rijksbelastingen][ref4], beschikt over notarieel
      verleden statuten waaruit de een sociaal belang behartigende doelstelling blijkt, dan wel, voor zover het gaat
      om verenigingen als bedoeld in [artikel 26 van Boek 2 van het Burgerlijk Wetboek][ref5] die niet beschikken over
      notarieel verleden statuten, over door die verenigingen verstrekte verklaringen waaruit de een sociaal belang
      behartigende doelstelling blijkt;

      c. de instelling die de desbetreffende onroerende zaak beheert en exploiteert, beschikt over notarieel verleden
      statuten waaruit blijkt dat de instelling zich ten doel stelt de onroerende zaak te beheren en exploiteren ten
      nutte van instellingen als bedoeld in de aanhef;

      d. de feitelijke werkzaamheden van de instelling, bedoeld in onderdeel c, overeenkomen met de doelstelling;

      e. de in de aanhef bedoelde algemeen nut beogende instelling en de instelling, bedoeld in onderdeel c, niet aan
      vennootschapsbelasting zijn onderworpen dan wel daarvan zijn vrijgesteld;

      f. de in de aanhef bedoelde instellingen en de instelling, bedoeld in onderdeel c, geen publiekrechtelijk lichaam
      zijn, en

      g. de instelling, bedoeld in onderdeel c, beschikt over een eigen aansluiting.

      4 Voor de toepassing van dit artikel en de op dit artikel berustende bepalingen wordt een statuut als bedoeld in
      [artikel 2, tweede lid, van Boek 2 van het Burgerlijk Wetboek][ref6] gelijkgesteld met notarieel verleden statuten
      indien dit statuut schriftelijk is vastgelegd.

      5 De teruggaven, bedoeld in het eerste en tweede lid, worden verleend aan de gebruiker van de desbetreffende
      onroerende zaak en bedragen 50 percent van de aan hem in rekening gebrachte belasting.

      6 De teruggaaf, bedoeld in het derde lid, wordt verleend aan de instelling die de desbetreffende onroerende zaak
      beheert en exploiteert en bedraagt 50 percent van de aan haar in rekening gebrachte belasting.

      7 Bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur worden voorwaarden en
      beperkingen gesteld waaronder de teruggaven, bedoeld in dit artikel, worden verleend.

      8 Bij regeling van Onze Minister kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.


