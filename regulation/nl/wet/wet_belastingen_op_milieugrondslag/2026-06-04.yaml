        artikel: '24'
        hoofdstuk: IV
        afdeling: '2'
  - number: 31a
    text: |-
      Met betrekking tot een toestemming tot overbrenging als bedoeld in [artikel 23, eerste lid, onderdeel c][ref1],
      die is verleend vóór 1 januari 2019, wordt de periode van overbrenging, bedoeld in [artikel 28, tweede lid][ref2],
      in afwijking van dat lid geacht aan te vangen op het tijdstip van de aanvang van de eerste fysieke overbrenging na
      31 december 2018 met toepassing van die toestemming.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel28
    url: https://wetten.overheid.nl/BWBR0007168/2026-06-04#Artikel31a
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '23'
        hoofdstuk: IV
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0007168
        artikel: '28'
        hoofdstuk: IV
        afdeling: '4'
  - number: '32'
    text: |-
      Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:

      a. kolen: producten van de GN-codes 2701, 2702 en 2704;

      b. brandstof: stof – met inbegrip van alle daaraan toegevoegde stoffen – dienende voor de verbranding met het doel
      de daarbij ontstane energie te benutten;

      c. duaal gebruik: aanwenden van kolen zowel als verwarmingsbrandstof als voor andere doeleinden dan als motor-
      of verwarmingsbrandstof;

      d. vervaardigen van kolen: elk handelen waarbij of waardoor kolen ontstaan;

      e. inrichting: iedere plaats waar op grond van de bepalingen van dit hoofdstuk kolen onder schorsing van belasting
      mogen worden vervaardigd, mogen worden verwerkt, voorhanden mogen zijn, mogen worden ontvangen en mogen worden
      verzonden;

      f. een plaats voor tijdelijke opslag: een ruimte voor tijdelijke opslag of een andere plaats die is aangewezen
      of goedgekeurd voor de opslag van goederen in tijdelijke opslag als bedoeld in artikel 147, eerste lid, van het
      Douanewetboek van de Unie;

      g. lidstaat: lidstaat van de Europese Unie;

      h. derde land: elke staat of elk grondgebied waarop het Verdrag betreffende de werking van de Europese Unie niet
      van toepassing is;

      i. EU-douaneregeling: de bijzondere regelingen douanevervoer, douane-entrepot, tijdelijke invoer en actieve
      veredeling, bedoeld in artikel 210 van het Douanewetboek van de Unie, uitvoer als bedoeld in artikel 269 van dat
      wetboek en wederuitvoer als bedoeld in artikel 270 van dat wetboek;

      j. schorsing van belasting: stelsel waarin van kolen die worden vervaardigd, worden verwerkt, voorhanden zijn of
      worden vervoerd, op grond van de bepalingen van deze wet de belasting nog niet is geheven;

      k. ondernemer: ondernemer in de zin van [artikel 7 van de Wet op de omzetbelasting 1968][ref1];

      l. uitslag: brengen van kolen buiten een plaats die voor kolen als inrichting is aangewezen;

      m. invoer: vanuit een derde land brengen van kolen in Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel7
    url: https://wetten.overheid.nl/BWBR0007168/2026-06-04#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '7'
  - number: '33'
    text: |-
      1 Als uitslag wordt mede aangemerkt het gebruik van kolen als brandstof binnen een inrichting.

      2 Als uitslag wordt mede aangemerkt het voorhanden hebben van kolen waarvan de belasting niet is geheven, door:

      a. een ondernemer in het kader van zijn onderneming, anders dan in een inrichting;

      b. een publiekrechtelijk lichaam, anders dan als ondernemer;

      c. een natuurlijk persoon voor andere doeleinden dan voor persoonlijk gebruik.

      3 Het tweede lid is, onder bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur te
      stellen voorwaarden, niet van toepassing met betrekking tot kolen die worden vervoerd naar:

      a. een inrichting;

      b. een andere lidstaat via Nederland;

      c. een derde land.

      4 Bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur worden nadere regels gesteld
      met betrekking tot de verplichtingen waaraan de in het tweede lid bedoelde personen of lichamen voor de toepassing
      van dit hoofdstuk moeten voldoen.

      5 Bij regeling van Onze Minister kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007168/2026-06-04#Artikel33
  - number: '34'
    text: |-
      1 Als uitslag wordt niet aangemerkt het brengen van kolen vanuit een inrichting naar:

      a. een andere inrichting;

      b. een ondernemer dan wel een publiekrechtelijk lichaam, anders dan als ondernemer, in een andere lidstaat;

      c. een derde land.

      2 Als uitslag wordt niet aangemerkt het gebruik van kolen voor het vervaardigen van kolen, aardgas als bedoeld in
      [artikel 47, eerste lid, onderdeel m][ref1], producten die op grond van [artikel 48, tweede lid][ref2], als aardgas
      worden aangemerkt, of minerale oliën als bedoeld in [artikel 25 van de Wet op de accijns][ref3].

      3 Bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur kunnen voorwaarden worden
      gesteld waaronder het eerste en tweede lid toepassing vinden.

      4 Bij regeling van Onze Minister kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel48
      [ref3]: https://wetten.overheid.nl/BWBR0005251#Artikel25
    url: https://wetten.overheid.nl/BWBR0007168/2026-06-04#Artikel34
