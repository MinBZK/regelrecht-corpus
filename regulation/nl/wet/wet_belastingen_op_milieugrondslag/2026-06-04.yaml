  - number: '67'
    text: |-
      1 Op verzoek wordt teruggaaf van de belasting verleend voor aardgas dat is belast naar het tarief, bedoeld
      in [artikel 59, derde lid][ref1], voor zover het verbruik van warmte in een onroerende zaak als bedoeld in
      [artikel 16, onderdelen a tot en met e, van de Wet waardering onroerende zaken][ref2] die door een installatie
      voor blokverwarming wordt verwarmd, hoger is dan 5 372 000 megajoule per verbruiksperiode van twaalf maanden.

      2 De teruggaaf wordt verleend aan de gebruiker van de onroerende zaak. De teruggaaf bedraagt het positieve verschil
      tussen het bedrag van de belasting dat volgt uit toepassing van het tarief, bedoeld in artikel 59, derde lid, en
      het bedrag van de belasting dat volgt uit toepassing van [artikel 59, eerste lid, onderdeel a][ref3], als aan die
      gebruiker een hoeveelheid aardgas geleverd zou zijn die correspondeert met de verbruikte warmte.

      3 Bij op voordracht van Onze Minister vast te stellen algemene maatregel van bestuur worden voorwaarden en
      beperkingen gesteld waaronder de teruggaaf, bedoeld in het eerste lid, wordt verleend.

      4 Bij regeling van Onze Minister kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel59
