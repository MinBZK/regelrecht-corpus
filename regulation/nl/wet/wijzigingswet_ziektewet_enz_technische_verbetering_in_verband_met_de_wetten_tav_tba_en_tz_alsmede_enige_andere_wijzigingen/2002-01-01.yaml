preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het, in verband met enige gebleken onvolkomenheden in de Wet
    terugdringing arbeidsongeschiktheidsvolume, de Wet terugdringing beroep op de arbeidsongeschiktheidsregelingen
    en de Wet terugdringing ziekteverzuim, wenselijk is een aantal sociale zekerheidswetten aan te passen en dat het
    wenselijk is nog enige andere wijzigingen daarin aan te brengen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007796/2002-01-01#ArtikelAanhef
articles:
  - number: XII
    text: |-
      1 In afwijking van [artikel XI, onderdeel D][ref1], vervalt [hoofdstuk IV van de Algemene Kinderbijslagwet][ref2]
      voor een verzekerde die over het vierde kwartaal van 1995 recht heeft op kinderbijslag voor een kind:

      a. als bedoeld in artikel 26, eerste lid, onderdeel *a*, of voor een kind dat op 30 september 1995 17 jaar oud is,
      eerst op het moment dat dat kind ophoudt te studeren aan de opleiding die het op de eerste dag van dat kwartaal
      volgde of aanspraak krijgt op een tegemoetkoming in de studie-kosten als bedoeld in hoofdstuk III van de Wet
      tegemoetkoming studiekosten;

      b. als bedoeld in artikel 26, eerste lid, onderdeel *b*, en in artikel 26, tweede lid, eerste op het tijdstip
      waarop de [Algemene bijstandswet][ref3] in werking treedt.

      2 Bij ministeriële regeling kunnen voor de toepassing van het eerste lid, onderdeel *a*, nadere en zo nodig
      afwijkende regels worden gesteld met betrekking tot [artikel 26, eerste lid, onderdeel ][ref4].


