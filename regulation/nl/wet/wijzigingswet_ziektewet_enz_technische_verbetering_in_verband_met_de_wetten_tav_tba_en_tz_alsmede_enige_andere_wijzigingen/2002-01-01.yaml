  - number: XLIX
    text: |-
      1 Deze wet treedt, met uitzondering van de [artikelen IV, onderdeel I, onder 1][ref1], [XI, onderdeel D][ref2],
      [XII][ref3], [XIV, onderdeel H, onder 1][ref4], XXI, de onderdelen A en B, XXXV, XXXVII tot en met XXXIX, XLIII en
      XLIV, in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin zij wordt geplaatst,
      met dien verstande, dat:

      a. [artikel IV, onderdeel A][ref5], terugwerkt tot en met 1 maart 1994;

      b. de [artikelen IV, de onderdelen C, F en G][ref6], XXVII en XXVIII terugwerken tot en met 1 maart 1995;

      c. de [artikelen VI][ref7], [XVII][ref8] en XXIV terugwerken tot en met 1 januari 1994;

      d. de [artikelen IV, onderdeel I, onder 2][ref9], [XIII][ref10],
      [XIV, de onderdelen A tot en met G, H, onder 2, I, L en N, XV][ref11], XXII, onderdeel H, XXIII, onderdeel A, XXV,
      de onderdelen D tot en met G en I, en XXVI terugwerken tot en met 1 januari 1995;

      e. [artikel XIV, onderdeel O][ref12], terugwerkt tot en met 17 mei 1995;

      f. de [artikelen XVI, de onderdelen A, C, D, E en F][ref13], en XXII, de onderdelen B, D, E en F, terugwerken tot
      en met 1 augustus 1993;

      g. de artikelen XXII, de onderdelen A, C en G, XXIII, onderdeel B, en XXV, de onderdelen A tot en met C en H,
      terugwerken tot en met 1 mei 1994.

      2 [Artikel IV, onderdeel I, onder 1][ref14], treedt in werking direct na het tijdstip waarop artikel I, onderdeel
      X, onder 1°, van de wet van 22 december 1994, *Stb.* 955, in werking treedt.

      3 De [artikelen XI, onderdeel D][ref15], [XII][ref16], [XIV, onderdeel H, onder 1][ref17], XXXV, XXXVII tot en met
      XXXIX, XLIII en XLIV treden in werking met ingang van 1 januari 1996.

      4 Artikel XXI, de onderdelen A en B, treden in werking met ingang van de eerste dag van de tweede kalendermaand na
      de datum van uitgifte van het *Staatsblad* waarin zij wordt geplaatst.


