preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het, in verband met enige gebleken onvolkomenheden in de Wet
    terugdringing arbeidsongeschiktheidsvolume, de Wet terugdringing beroep op de arbeidsongeschiktheidsregelingen
    en de Wet terugdringing ziekteverzuim, wenselijk is een aantal sociale zekerheidswetten aan te passen en dat het
    wenselijk is nog enige andere wijzigingen daarin aan te brengen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007796/2002-01-01#ArtikelAanhef
articles:
  - number: XII.1
    text: |-
      In afwijking van [artikel XI, onderdeel D][ref1], vervalt [hoofdstuk IV van de Algemene Kinderbijslagwet][ref2]
      voor een verzekerde die over het vierde kwartaal van 1995 recht heeft op kinderbijslag voor een kind:


      [ref1]: https://wetten.overheid.nl/BWBR0007796#ArtikelXI
      [ref2]: https://wetten.overheid.nl/BWBR0002368#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0007796/2002-01-01#ArtikelXII
    references:
      - id: ref1
        bwb_id: BWBR0007796
        artikel: XI
      - id: ref2
        bwb_id: BWBR0002368
        hoofdstuk: IV
  - number: XII.1.a
    text: |-
      als bedoeld in artikel 26, eerste lid, onderdeel *a*, of voor een kind dat op 30 september 1995 17 jaar oud is,
      eerst op het moment dat dat kind ophoudt te studeren aan de opleiding die het op de eerste dag van dat kwartaal
      volgde of aanspraak krijgt op een tegemoetkoming in de studie-kosten als bedoeld in hoofdstuk III van de Wet
      tegemoetkoming studiekosten;
    url: https://wetten.overheid.nl/BWBR0007796/2002-01-01#ArtikelXII
  - number: XII.1.b
    text: |-
      als bedoeld in artikel 26, eerste lid, onderdeel *b*, en in artikel 26, tweede lid, eerste op het tijdstip waarop
      de [Algemene bijstandswet][ref1] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0007333
    url: https://wetten.overheid.nl/BWBR0007796/2002-01-01#ArtikelXII
    references:
      - id: ref1
        bwb_id: BWBR0007333
  - number: XII.2
    text: |-
      Bij ministeriële regeling kunnen voor de toepassing van het eerste lid, onderdeel *a*, nadere en zo nodig
      afwijkende regels worden gesteld met betrekking tot [artikel 26, eerste lid, onderdeel ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel26
    url: https://wetten.overheid.nl/BWBR0007796/2002-01-01#ArtikelXII
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '26'
  - number: XLVIII
    text: |-
      Indien het bij koninklijke boodschap van 6 juni 1995 ingediende voorstel van Wet houdende privatisering van het
      Algemeen burgerlijk pensioenfonds ([Wet privatisering ABP][ref1]; 24 205) tot wet wordt verheven en eerder of
      gelijktijdig met artikel XXII of XXIII van deze wet in werking treedt, wordt dat artikel of worden die artikelen
      voor de toepassing van eerstbedoelde wet beschouwd in werking te zijn getreden voor die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0007791
