---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht-mvp/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_particuliere_beveiligingsorganisaties_en_recherchebureaus
regulatory_layer: WET
publication_date: '2025-05-14'
valid_from: '2013-07-04'
bwb_id: BWBR0008973
url: https://wetten.overheid.nl/BWBR0008973/2013-07-04
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is in een afzonderlijke wet regels te stellen voor
    particuliere beveiligingsorganisaties en recherchebureaus, ter vervanging van de regelgeving terzake bij of
    krachtens de Wet op de weerkorpsen en de particuliere beveiligingsorganisaties, teneinde voorwaarden te scheppen
    voor een goed functioneren van deze organisaties en bureaus;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Veiligheid en Justitie;'
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel1
  - number: 1.1.b
    text: |-
      korpschef: de korpschef, bedoeld in [artikel 27 van de Politiewet 2012][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel27
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '27'
  - number: 1.1.c
    text: |-
      beveiligingswerkzaamheden: het bewaken van de veiligheid van personen en goederen of het waken tegen verstoring van
      de orde en rust op terreinen en in gebouwen;
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel1
  - number: 1.1.d
    text: |-
      beveiligingsorganisatie: een door een of meer personen in stand gehouden particuliere organisatie die gericht is op
      het verrichten van beveiligingswerkzaamheden;
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel1
  - number: 1.1.e
    text: 'recherchewerkzaamheden: het vergaren en analyseren van gegevens;'
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel1
  - number: 1.1.f
    text: |-
      recherchebureau: een natuurlijke persoon of rechtspersoon die in de uitoefening van een beroep of bedrijf met
      winstoogmerk recherchewerkzaamheden verricht, voor zover die werkzaamheden worden verricht op verzoek van een
      derde, in verband met een eigen belang van deze derde en betrekking hebben op een of meer bepaalde natuurlijke
      personen;
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel1
  - number: 1.1.g
    text: 'alarminstallateur: een persoon die'
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel1
  - number: 1.1.g.1°
    text: alarmapparatuur, installeert of zorgdraagt voor het onderhoud van alarmapparatuur,
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel1
  - number: 1.1.g.2°
    text: een plan voor de installatie van alarmapparatuur ontwerpt of
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel1
  - number: 1.1.g.3°
    text: assistentie verleent aan een persoon als bedoeld onder 1° of 2°;
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel1
  - number: 1.1.h
    text: |-
      alarmapparatuur: apparatuur, daaronder begrepen delen daarvan, die alleen of in combinatie met andere apparatuur
      een systeem vormt, dat door middel van detectoren via telecommunicatie signalen, die duiden op de aanwezigheid
      van personen, doorgeeft aan een of meer centrale punten, waar die signalen worden ontvangen en beoordeeld en van
      waaruit assistentie kan worden gevraagd aan derden;
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel1
  - number: 1.1.i
    text: |-
      luchtvaartterrein: een luchtvaartterrein als bedoeld in
      [artikel 4, eerste lid, onder c, van de Politiewet 2012][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel4
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '4'
  - number: 1.1.j
    text: |-
      verordening: Verordening (EU) Nr. 1214/2011 van het Europees Parlement en de Raad van 16 november 2011 betreffende
      professioneel grensoverschrijdend transport van eurocontanten over de weg tussen lidstaten van de eurozone (PbEU
      2011, L 316).
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel1
  - number: '1.2'
    text: 'Geen beveiligingsorganisatie als bedoeld in het eerste lid, onder *d*, is een organisatie die:'
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel1
  - number: 1.2.a
    text: wordt aangemerkt als weerkorps in de zin van artikel 1, tweede lid, van de Wet op de weerkorpsen;
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel1
  - number: 1.2.b
    text: |-
      ter uitvoering van een haar bij wettelijk voorschrift opgedragen taak, of in de uitoefening van een beroep dat aan
      een wettelijk voorschrift is onderworpen, beveiligingswerkzaamheden verricht.
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel1
  - number: '1.3'
    text: |-
      Geen recherchebureau als bedoeld in het eerste lid, onder *f*, is een organisatie die ter uitvoering van een haar
      bij wettelijk voorschrift opgedragen taak of in de uitoefening van een beroep dat aan een wettelijk voorschrift is
      onderworpen, recherchewerkzaamheden verricht.
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel1
  - number: '1.4'
    text: |-
      Het tweede lid, aanhef en onder *b*, en het derde lid zijn niet van toepassing voor zover een organisatie ook
      andere beveiligingswerkzaamheden onderscheidenlijk recherchewerkzaamheden verricht dan de in dit onderdeel of lid
      bedoelde.
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel1
  - number: '1.5'
    text: |-
      Onder een beveiligingsorganisatie als bedoeld in het eerste lid, onder *d*, wordt mede verstaan een bestuursorgaan
      dat ten behoeve van derden beveiligingswerkzaamheden verricht waarbij in hoofdzaak gebruik wordt gemaakt van
      personen en deze personen de werkzaamheden verrichten op grond van de [Wet sociale werkvoorziening][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008903
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008903
  - number: '2.1'
    text: |-
      Het is verboden zonder vergunning van Onze Minister door de instandhouding van een beveiligingsorganisatie of
      recherchebureau beveiligingswerkzaamheden of recherchewerkzaamheden te verrichten of aan te bieden.
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel2
  - number: '2.2'
    text: |-
      Het is verboden zonder vergunning van Onze Minister grensoverschrijdend transport van eurocontanten over de weg uit
      te voeren, bedoeld in de verordening.
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel2
  - number: '2.3'
    text: |-
      Onze Minister kan beveiligingsorganisaties of recherchebureaus van dit verbod bij ministeriële regeling
      vrijstelling verlenen, indien de aard van de werkzaamheden niet noodzaakt tot de toepassing van de bij of krachtens
      de [artikelen 6 tot en met 10][ref1] gestelde regels. Aan een vrijstelling kunnen voorschriften verbonden worden.


      [ref1]: https://wetten.overheid.nl/BWBR0008973#Artikel6
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0008973
        artikel: '6'
        paragraaf: '2'
  - number: '2.4'
    text: |-
      Met een vergunning, bedoeld in het eerste lid, wordt gelijkgesteld een vergunning afgegeven in een andere lidstaat
      van de Europese Unie dan wel een staat, niet zijnde een lidstaat van de Europese Unie, die partij is bij een
      daartoe strekkend of mede daartoe strekkend Verdrag dat Nederland bindt, en die een beroepsniveau waarborgt dat ten
      minste gelijkwaardig is aan het niveau dat met de nationale vergunning wordt nagestreefd.
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel2
  - number: '3'
    text: 'Een vergunning voor een beveiligingsorganisatie kan worden verleend voor één van de volgende categorieën:'
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel3
  - number: 3.a
    text: |-
      een particulier beveiligingsbedrijf, zijnde een onderneming of een onderdeel daarvan die in de uitoefening van
      beroep of bedrijf ten behoeve van derden beveiligingswerkzaamheden verricht en daarbij in hoofdzaak gebruik maakt
      van personen;
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel3
  - number: 3.b
    text: |-
      een particuliere alarmcentrale, zijnde een onderneming die in de uitoefening van beroep of bedrijf ten behoeve van
      derden in een centraal alarmmeldpunt, de door alarmapparatuur verzonden signalen ontvangt en beoordeelt en zonodig
      assistentie vraagt aan de politie, andere overheidsinstanties of particulieren;
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel3
  - number: 3.c
    text: |-
      een particulier geld- en waardetransportbedrijf, zijnde een onderneming die in de uitoefening van beroep of bedrijf
      ten behoeve van derden geld en grote waarden met een beperkt volume vervoert;
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel3
  - number: 3.d
    text: |-
      een bedrijfsbeveiligingsdienst, zijnde een door een particuliere organisatie in stand gehouden organisatie die ten
      behoeve van de eigen organisatie beveiligingswerkzaamheden verricht;
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel3
  - number: 3.e
    text: |-
      overige beveiligingsorganisaties: particuliere organisaties die beveiligingswerkzaamheden verrichten, anders dan
      omschreven onder *a* tot en met *d*, alsmede bestuursorganen als bedoeld in [artikel 1, vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008973#Artikel1
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008973
        artikel: '1'
        paragraaf: '1'
  - number: '4.1'
    text: |-
      Een vergunning als bedoeld in [artikel 2, eerste of tweede lid][ref1], wordt verleend indien, gelet op de
      voornemens en antecedenten van de aanvrager of van de personen die het beleid van de aanvrager bepalen, naar
      redelijke verwachting zal worden voldaan aan de bij of krachtens de [artikelen 6 tot en met 10][ref2] gestelde
      regels en ook overigens zal worden gehandeld in overeenstemming met hetgeen van een goede beveiligingsorganisatie
      of een goed recherchebureau in het maatschappelijk verkeer mag worden verwacht.


      [ref1]: https://wetten.overheid.nl/BWBR0008973#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008973#Artikel6
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008973
        artikel: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0008973
        artikel: '6'
        paragraaf: '2'
  - number: '4.2'
    text: 'De aanvraag van een vergunning bevat ten minste de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel4
  - number: 4.2.a
    text: |-
      indien de aanvraag betrekking heeft op een beveiligingsorganisatie: de categorie waarop de aanvraag betrekking
      heeft;
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel4
  - number: 4.2.b
    text: 'indien de aanvrager een rechtspersoon is: de statuten van de rechtspersoon;'
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel4
  - number: 4.2.c
    text: een opgave van de werkzaamheden die de aanvrager voornemens is te gaan verrichten.
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel4
  - number: '4.3'
    text: |-
      Onze Minister kan de aanvrager daarnaast verzoeken nadere gegevens te verstrekken, die voor een goede beoordeling
      van de aanvraag van belang kunnen zijn.
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel4
  - number: '4.4'
    text: |-
      Een vergunning wordt verleend voor een periode van ten hoogste vijf jaren en kan telkens worden verlengd voor een
      periode van eveneens ten hoogste vijf jaren.
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel4
  - number: '4.5'
    text: Een vergunning kan worden beperkt tot een bepaald territoir.
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel4
  - number: '4.6'
    text: 'Aan een vergunning kunnen voorschriften worden verbonden met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel4
  - number: 4.6.a
    text: het waarborgen van een goed samenspel met overheidsinstellingen;
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel4
  - number: 4.6.b
    text: |-
      de in [artikel 6][ref1] bedoelde onderwerpen.


      [ref1]: https://wetten.overheid.nl/BWBR0008973#Artikel6
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008973
        artikel: '6'
        paragraaf: '2'
  - number: '4.7'
    text: |-
      Een vergunning wordt verleend of verlengd na de betaling van een vergoeding van kosten. Onze Minister stelt bij
      ministeriële regeling regels voor de hoogte van de vergoeding.
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel4
  - number: '4.8'
    text: Onze Minister beslist binnen dertien weken op de aanvraag van een vergunning.
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel4
  - number: '4.9'
    text: |-
      Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref2] niet van toepassing op een aanvraag om een vergunning
      als bedoeld in [artikel 2, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
      [ref3]: https://wetten.overheid.nl/BWBR0008973#Artikel2
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
      - id: ref3
        bwb_id: BWBR0008973
        artikel: '2'
        paragraaf: '1'
  - number: 4a
    text: |-
      Met de eisen inzake de betrouwbaarheid terzake van het verrichten of aanbieden van beveiligings- of
      recherchewerkzaamheden door het in stand houden van een beveiligingsorganisatie of recherchebureau, bedoeld in
      [artikel 4, eerste lid][ref1], [7, vijfde lid][ref2], en [10, eerste lid][ref3], van deze wet, worden gelijkgesteld
      eisen inzake de betrouwbaarheid die worden gesteld in een andere lidstaat van de Europese Unie dan wel een staat,
      niet zijnde een lidstaat van de Europese Unie, die partij is bij een daartoe strekkend of mede daartoe strekkend
      Verdrag dat Nederland bindt, en die een niveau van betrouwbaarheid waarborgen dat ten minste gelijkwaardig is aan
      het niveau dat met de nationale eisen wordt nagestreefd.


      [ref1]: https://wetten.overheid.nl/BWBR0008973#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008973#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0008973#Artikel10
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0008973
        artikel: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0008973
        artikel: '7'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0008973
        artikel: '10'
        paragraaf: '3'
  - number: '5.1'
    text: |-
      Bestuursorganen verrichten geen beveiligingswerkzaamheden voor derden, tenzij dit bij of krachtens de wet is
      toegestaan.
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel5
  - number: '5.2'
    text: |-
      Een ambtenaar als bedoeld in de [artikelen 141][ref1] onderscheidenlijk
      [142, eerste lid, van het Wetboek van Strafvordering][ref2] verricht geen werkzaamheden voor een
      beveiligingsorganisatie of recherchebureau en houdt, hetzij alleen, hetzij met andere personen, geen
      beveiligingsorganisatie of recherchebureau in stand.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel142
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '142'
  - number: '5.3'
    text: |-
      Het tweede lid is niet van toepassing op buitengewoon opsporingsambtenaren die behoren tot een particuliere
      beveiligingsorganisatie die, of een onderdeel daarvan dat door Onze Minister is aangewezen als een categorie of
      eenheid als bedoeld in [artikel 142, eerste lid, onder b, van het Wetboek van Strafvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel142
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '142'
  - number: '5.4'
    text: |-
      Van het verbod, bedoeld in het tweede lid, kan Onze Minister in overeenstemming met Onze Minister die het
      aangaat in bijzondere omstandigheden ontheffing verlenen. Aan een ontheffing kunnen beperkingen en voorschriften
      worden verbonden. Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref2] niet van toepassing op een aanvraag om een ontheffing.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '5.5'
    text: |-
      Onze Minister stelt bij ministeriële regeling regels met betrekking tot de kwaliteitseisen waaraan personen in
      dienst van een bestuursorgaan moeten voldoen indien zij in de uitoefening van hun functie beveiligingswerkzaamheden
      verrichten.
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel5
  - number: '5.6'
    text: |-
      Van de regels, bedoeld in het vijfde lid, kan Onze Minister in bijzondere gevallen ontheffing verlenen. Aan een
      ontheffing kunnen beperkingen en voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel5
  - number: '6.1'
    text: |-
      Onze Minister kan ter bevordering van de kwaliteit van beveiligingsorganisaties en recherchebureaus aan welke een
      vergunning is verleend bij ministeriële regeling regels stellen met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel6
  - number: 6.1.a
    text: het materieel en de uitrusting waarvan bij de uitvoering van de werkzaamheden gebruik wordt gemaakt;
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel6
  - number: 6.1.b
    text: |-
      het gebouw en de inrichting van het gebouw waarin een beveiligingsorganisatie is gevestigd, die werkzaamheden
      verricht als bedoeld in [artikel 3, onder b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008973#Artikel3
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008973
        artikel: '3'
        paragraaf: '1'
  - number: 6.1.c
    text: |-
      de overname van de ontvangst en beoordeling van signalen van een centraal alarmmeldpunt van een
      beveiligingsorganisatie die werkzaamheden verricht als bedoeld in [artikel 3, onder b][ref1], door
      een ander centraal alarmmeldpunt, indien het eerste centraal alarmmeldpunt door het wegvallen van
      telecommunicatieverbindingen niet meer functioneert;


      [ref1]: https://wetten.overheid.nl/BWBR0008973#Artikel3
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008973
        artikel: '3'
        paragraaf: '1'
  - number: 6.1.d
    text: de goedkeuring van, zoveel mogelijk eenduidige, modellen van uniformen;
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel6
  - number: 6.1.e
    text: |-
      de vaststelling van modellen van legitimatiebewijzen, de afgifte van deze bewijzen en de kostenvergoeding die voor
      de afgifte gevraagd kan worden;
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel6
  - number: 6.1.f
    text: de verslaglegging;
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel6
  - number: 6.1.g
    text: de mogelijkheden om bij de uitvoering van de werkzaamheden gebruik te maken van een hond;
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel6
  - number: 6.1.h
    text: de behandeling van klachten;
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel6
  - number: 6.1.i
    text: andere onderwerpen die de kwaliteit raken.
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel6
  - number: '6.2'
    text: |-
      Bij ministeriële regeling wordt bepaald welke op grond van artikel 13, eerste en tweede lid, van de verordening
      toegestane opties worden toegelaten op Nederlands grondgebied.
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel6
  - number: '6.3'
    text: |-
      Onze Minister kan laboratoria aanwijzen die tests uitvoeren met het oog op de goedkeuring van een intelligent
      systeem voor de neutralisatie van bankbiljetten als bedoeld in artikel 7, vierde lid, van de verordening.
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel6
  - number: 6a
    text: |-
      Onze Minister legt voor het medisch attest, bedoeld in artikel 5, eerste lid, onderdeel b, van de verordening,
      bij ministeriële regeling eisen vast op het punt van de medische geschiktheid, het doel van de keuring, de vragen
      welke ten aanzien van de gezondheid zullen worden gesteld en de medische onderzoeken die mogen worden verricht. De
      [Wet op de medische keuringen][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008819
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0008819
  - number: '7.1'
    text: |-
      Een beveiligingsorganisatie of recherchebureau aan welke een vergunning is verleend stelt geen personen te werk die
      belast zullen worden met de leiding van de organisatie of het bureau, dan nadat voor hen toestemming is verkregen
      van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel7
  - number: '7.2'
    text: |-
      Een beveiligingsorganisatie of recherchebureau als bedoeld in het eerste lid stelt geen personen te werk die belast
      zullen worden met werkzaamheden, anders dan bedoeld in het eerste lid, dan nadat voor hen toestemming is verkregen
      van de korpschef. Indien de beveiligingsorganisatie of het recherchebureau dan wel een onderdeel daarvan is
      gevestigd op een luchtvaartterrein, wordt de toestemming, bedoeld in de eerste volzin, verleend door de commandant
      van de Koninklijke marechaussee.
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel7
  - number: '7.3'
    text: |-
      Een beveiligingsorganisatie of recherchebureau, zonder vestiging in Nederland, aan welke een vergunning is
      verleend als bedoeld in [artikel 2, eerste en derde lid][ref1], laat personen als bedoeld in het tweede lid, geen
      beveiligingsonderscheidenlijk recherchewerkzaamheden in Nederland verrichten, dan nadat voor hen toestemming is
      verkregen van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0008973#Artikel2
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008973
        artikel: '2'
        paragraaf: '1'
  - number: '7.4'
    text: |-
      De toestemming, bedoeld in het eerste, tweede en derde lid, wordt onthouden indien de desbetreffende persoon
      niet beschikt over de bekwaamheid en betrouwbaarheid die nodig zijn voor het te verrichten werk. Indien de
      desbetreffende persoon een ambtenaar is als bedoeld in [artikel 5, derde lid][ref1], wordt de toestemming slechts
      onthouden indien deze persoon niet beschikt over de benodigde bekwaamheid. Voor de tewerkstelling van de overige
      opsporingsambtenaren wordt de toestemming slechts verleend na het overleggen van de ontheffing, bedoeld in artikel
      5, vierde lid, en indien de desbetreffende persoon beschikt over de benodigde bekwaamheid.


      [ref1]: https://wetten.overheid.nl/BWBR0008973#Artikel5
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008973
        artikel: '5'
        paragraaf: '1'
  - number: '7.5'
    text: |-
      De toestemming, bedoeld in het eerste, tweede en derde lid kan worden ingetrokken indien zich omstandigheden
      voordoen of feiten bekend worden op grond waarvan de toestemming niet zou zijn verleend, indien zij zich hadden
      voorgedaan of bekend waren geweest op het tijdstip waarop de toestemming werd verleend.
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel7
  - number: '7.6'
    text: |-
      De toestemming, bedoeld in het eerste, tweede en derde lid wordt verleend na de betaling van een vergoeding van
      kosten aan het Rijk of de politie. Onze Minister stelt bij ministeriële regeling regels met betrekking tot de
      kostenvergoeding.
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel7
  - number: '7.7'
    text: |-
      Met de toestemming, bedoeld in het eerste en derde lid, wordt gelijkgesteld een verklaring afgegeven in een andere
      lidstaat van de Europese Unie dan wel een staat, niet zijnde een lidstaat van de Europese Unie, die partij is bij
      een daartoe strekkend of mede daartoe strekkend Verdrag dat Nederland bindt, en die een beroepsniveau waarborgt dat
      ten minste gelijkwaardig is aan het niveau dat met de nationale toestemming wordt nagestreefd.
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel7
  - number: '7.8'
    text: |-
      Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref2] niet van toepassing op een verzoek tot toestemming als
      bedoeld in het eerste, tweede en derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: 7a.1
    text: Bij ministeriële regeling wordt de autoriteit, bedoeld in artikel 12, tweede lid, van de verordening, aangewezen.
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel7a
  - number: 7a.2
    text: |-
      Indien een lid van het bewakingspersoneel van een onderneming als bedoeld in artikel 5, eerste lid, van de
      verordening niet beschikt over de betrouwbaarheid die nodig is voor het te verrichten werk, bedoeld in artikel 5,
      eerste lid, onder a, van de verordening, wordt daarvan melding gedaan door Onze Minister aan de bevoegde autoriteit
      in de lidstaat van herkomst die is belast met de screening van het bewakingspersoneel, bedoeld in artikel 11, derde
      lid, van de verordening.
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel7a
  - number: '8.1'
    text: |-
      Onze Minister stelt bij ministeriële regeling voor bepaalde categorieën werkzaamheden, opleidingseisen vast, voor
      personen die te werk worden gesteld door een beveiligingsorganisatie of recherchebureau.
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel8
  - number: '8.2'
    text: |-
      Onze Minister stelt bij ministeriële regeling voor het bewakingspersoneel van grensoverschrijdend transport van
      eurocontanten over de weg opleidingseisen vast.
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel8
  - number: '8.3'
    text: |-
      Een beveiligingsorganisatie of recherchebureau als bedoeld in het eerste lid belast personen alleen met
      werkzaamheden, indien zij voldoen aan de daarvoor vastgestelde opleidingseisen. Onze Minister kan van dit
      voorschrift ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel8
  - number: '8.4'
    text: |-
      Onze Minister beslist op een aanvraag om ontheffing als bedoeld in het derde lid, binnen acht weken
      na ontvangst van de aanvraag. De beslissing kan eenmaal met ten hoogste acht weken worden verdaagd.
      [Afdeling 4.1.3.3. van de Algemene wet bestuursrecht][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '9.1'
    text: |-
      Een beveiligingsorganisatie aan welke een vergunning is verleend draagt er zorg voor dat de personen die zijn
      belast met beveiligingswerkzaamheden, bij de uitvoering van deze werkzaamheden een door Onze Minister goedgekeurd
      uniform dragen.
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel9
  - number: '9.2'
    text: |-
      Het eerste lid is niet van toepassing op personen die uitsluitend binnen het gebouw van een beveiligingsorganisatie
      als bedoeld in [artikel 3, onder b][ref1], werkzaam zijn. Voorts kan Onze Minister voor bepaalde
      beveiligingswerkzaamheden ontheffing verlenen van de verplichting, bedoeld in het eerste lid, indien dit gelet op
      de aard van de werkzaamheden gewenst is en zich daartegen geen zwaarwegende belangen verzetten. Onze Minister kan
      daaraan voorschriften verbinden betreffende de instructie van het betrokken personeel. Onze Minister beslist op een
      aanvraag om ontheffing binnen acht weken na ontvangst van de aanvraag. De beslissing kan eenmaal met ten hoogste
      acht weken worden verdaagd. [Afdeling 4.1.3.3 van de Algemene wet bestuursrecht][ref2] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008973#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008973
        artikel: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '9.3'
    text: |-
      Een beveiligingsorganisatie of recherchebureau aan welke een vergunning is verleend, draagt
      er zorg voor dat de personen die zijn belast met beveiligingswerkzaamheden onderscheidenlijk
      recherchewerkzaamheden, bij de uitvoering van hun werkzaamheden geen handboeien dragen, tenzij
      Onze Minister daarvoor toestemming heeft verleend. Aan de toestemming kunnen voorwaarden worden
      verbonden. Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref2] niet van toepassing op het verzoek tot toestemming om
      handboeien te dragen.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '9.4'
    text: |-
      Personen die zijn belast met beveiligingswerkzaamheden onderscheidenlijk recherchewerkzaamheden en ten behoeve
      van wie toestemming voor het dragen van handboeien is verleend, zijn, in afwachting van de komst van de politie,
      bevoegd tot het aanleggen van handboeien bij personen die zijn aangehouden ingeval van ontdekking op heterdaad,
      indien de aangehouden personen zich trachten te onttrekken aan hun aanhouding of indien zij een gevaar vormen voor
      hun leven of veiligheid of die van anderen en die onttrekking onderscheidenlijk dat gevaar niet op andere wijze kan
      worden voorkomen. Het gebruik van handboeien dient redelijk en gematigd te zijn.
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel9
  - number: '9.5'
    text: |-
      De persoon die handboeien heeft gebruikt, meldt dit gebruik aan de opsporingsambtenaar aan wie de aangehouden
      persoon wordt overgedragen. De opsporingsambtenaar vermeldt het gebruik van handboeien in het proces-verbaal van
      de aanhouding.
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel9
  - number: '9.6'
    text: |-
      Onze Minister kan de toestemming tot het dragen van handboeien intrekken, indien blijkt dat bij herhaling het
      gebruik van handboeien niet overeenkomstig het vierde en vijfde lid heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel9
  - number: '9.7'
    text: |-
      Onze Minister kan bij ministeriële regeling bepalen dat de in het tweede, derde en zesde lid bedoelde bevoegdheden,
      in de daarbij aan te wijzen gevallen worden uitgeoefend door de korpschef, dan wel door de commandant van de
      Koninklijke marechaussee, indien een beveiligingsorganisatie werkzaamheden verricht op een luchtvaartterrein.
      Hij kan ter zake nadere regels stellen. In de bij ministeriële regeling aangewezen gevallen kan Onze Minister de
      bevoegdheden, bedoeld in het tweede, derde en zesde lid, niet meer uitoefenen.
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel9
  - number: '9.8'
    text: |-
      Een beveiligingsorganisatie of recherchebureau aan welke een vergunning is verleend draagt er zorg voor dat de
      personen die zijn belast met beveiligingswerkzaamheden onderscheidenlijk recherchewerkzaamheden, bij de uitvoering
      van hun werkzaamheden een legitimatiebewijs bij zich dragen waarvan een model is vastgesteld door Onze Minister en
      dat zij dit op verzoek tonen.
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel9
  - number: '9.9'
    text: |-
      Met een legitimatiebewijs, bedoeld in het achtste lid, wordt gelijkgesteld een legitimatiebewijs afgegeven in een
      andere lidstaat van de Europese Unie dan wel een staat, niet zijnde een lidstaat van de Europese Unie, die partij
      is bij een daartoe strekkend of mede daartoe strekkend Verdrag dat Nederland bindt, en dat een beroepsniveau
      waarborgt dat ten minste gelijkwaardig is aan het niveau dat met het nationale legitimatiebewijs wordt nagestreefd.
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel9
  - number: '10.1'
    text: |-
      Een beveiligingsorganisatie aan welke een vergunning is verleend en die werkzaamheden verricht als bedoeld
      in [artikel 3, onder b][ref1], laat het plan voor de installatie, de installatie en het onderhoud van de
      alarmapparatuur die hij gebruikt, slechts opstellen dan wel uitvoeren door alarminstallateurs die voldoen aan
      de door Onze Minister bij ministeriële regeling vast te stellen eisen van vakbekwaamheid en die beschikken over
      een verklaring van betrouwbaarheid. Zij verleent uitsluitend diensten aan derden die deze werkzaamheden eveneens
      slechts laten verrichten door alarminstallateurs die aan de genoemde voorwaarden voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0008973#Artikel3
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008973
        artikel: '3'
        paragraaf: '1'
  - number: '10.2'
    text: |-
      Onze Minister kan bij ministeriële regeling voor bepaalde categorieën alarmapparatuur regels stellen met betrekking
      tot de eisen waaraan deze apparatuur dient te voldoen en de wijze waarop, alsmede de organisaties door welke, de
      apparatuur op grond van deze eisen kan worden goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel10
  - number: '10.3'
    text: |-
      Een beveiligingsorganisatie als bedoeld in het eerste lid maakt van alarmapparatuur die behoort tot een categorie
      waarvoor Onze Minister regels heeft gesteld, uitsluitend gebruik indien deze overeenkomstig die regels is
      goedgekeurd. Zij verleent alleen diensten aan derden die eveneens aan deze voorwaarde voldoen.
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel10
  - number: '10.4'
    text: |-
      Een beveiligingsorganisatie als bedoeld in het eerste lid draagt zorg dat zij over documenten beschikt betreffende
      de door haar en derden gebruikte apparatuur, waarmee aangetoond kan worden dat zij aan het eerste en derde lid
      voldoet.
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel10
  - number: '10.5'
    text: |-
      De verklaring van betrouwbaarheid, bedoeld in het eerste lid, wordt afgegeven door de korpschef, dan wel, indien de
      desbetreffende persoon niet woonachtig is in Nederland, de korpschef, de commandant van de Koninklijke marechaussee
      of Onze Minister, die ingevolge [artikel 7, tweede of derde lid][ref1], aan een beveiligingsorganisatie waarvoor de
      alarminstallateur gaat werken toestemming kan geven.


      [ref1]: https://wetten.overheid.nl/BWBR0008973#Artikel7
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008973
        artikel: '7'
        paragraaf: '2'
  - number: '10.6'
    text: |-
      De verklaring van betrouwbaarheid, bedoeld in het eerste lid, kan worden ingetrokken indien zich omstandigheden
      voordoen of feiten bekend worden op grond waarvan de verklaring niet zou zijn afgegeven, indien deze zich hadden
      voorgedaan of bekend waren geweest op het tijdstip waarop de verklaring werd afgegeven.
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel10
  - number: '10.7'
    text: |-
      Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref2] niet van toepassing op de aanvraag om een verklaring
      van betrouwbaarheid als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '11.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet, de beperkingen en voorschriften,
      gesteld krachtens [artikel 4, vierde, vijfde en zesde lid][ref1], en [9, tweede en derde lid][ref2], en de
      aanwijzingen gegeven krachtens [artikel 12, eerste lid][ref3], of van het bepaalde bij of krachtens de verordening
      zijn belast de ambtenaren, bedoeld in [artikel 141, onder b en c, van het Wetboek van Strafvordering][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0008973#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008973#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0008973#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0008973
        artikel: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0008973
        artikel: '9'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0008973
        artikel: '12'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '11.2'
    text: |-
      De ambtenaren, bedoeld in het eerste lid, zijn bevoegd inlichtingen te verlangen, voor zover dat voor de vervulling
      van hun taak redelijkerwijs nodig is. Een beveiligingsorganisatie of recherchebureau aan welke een vergunning is
      verleend verstrekt de gevraagde inlichtingen.
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel11
  - number: '11.3'
    text: |-
      De ambtenaren, bedoeld in het eerste lid, zijn bevoegd alle plaatsen met uitzondering van woningen, waar, naar
      zij redelijkerwijs vermoeden, een beveiligingsorganisatie of recherchebureau aan welke een vergunning is verleend
      gevestigd is, te betreden voor zover dit redelijkerwijs voor de vervulling van hun taak op grond van deze wet nodig
      is.
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel11
  - number: '12.1'
    text: |-
      De korpschef is bevoegd, indien dit in het belang van een goede politiezorg noodzakelijk is, aan een
      beveiligingsorganisatie of recherchebureau aanwijzingen te geven. Indien een beveiligingsorganisatie of
      recherchebureau aan welke een vergunning is verleend, werkzaamheden verricht op een luchtvaartterrein, worden
      de aanwijzingen bedoeld in de eerste volzin gegeven door de commandant van de Koninklijke marechaussee. De
      beveiligingsorganisatie of het recherchebureau aan welke een vergunning is verleend geven aan deze aanwijzingen
      gevolg.
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel12
  - number: '12.2'
    text: |-
      Voordat een beveiligingsorganisatie, of zodra een particuliere alarmcentrale als bedoeld in
      [artikel 3, onderdeel b][ref1], aan welke een vergunning is verleend in een gemeente een begin maakt met nieuwe
      beveiligingswerkzaamheden informeert zij hierover de korpschef. Indien een beveiligingsorganisatie aan welke een
      vergunning is verleend, een begin maakt met nieuwe beveiligingswerkzaamheden op een luchtvaartterrein, informeert
      zij hierover de commandant van de Koninklijke marechaussee.


      [ref1]: https://wetten.overheid.nl/BWBR0008973#Artikel3
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0008973
        artikel: '3'
        paragraaf: '1'
  - number: '12.3'
    text: |-
      Onze Minister kan aan de korpschef onderscheidenlijk de commandant van de Koninklijke
      marechaussee algemene en bijzondere aanwijzingen geven ter uitvoering van deze wet.
      [Artikel 10:22, tweede lid, van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '10'
  - number: '13.1'
    text: |-
      Een ieder die werkzaam is of werkzaam is geweest voor een beveiligingsorganisatie of recherchebureau en daarbij de
      beschikking krijgt of heeft gekregen over gegevens waarvan hij het vertrouwelijk karakter kent of redelijkerwijs
      moet vermoeden, is verplicht tot geheimhouding van die gegevens, behoudens voorzover enig wettelijk voorschrift
      hem tot bekendmaking verplicht of uit zijn werkzaamheden die in overeenstemming met de vergunning als bedoeld in
      [artikel 2, eerste lid][ref1], worden verricht, de bekendmaking voortvloeit.


      [ref1]: https://wetten.overheid.nl/BWBR0008973#Artikel2
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0008973
        artikel: '2'
        paragraaf: '1'
  - number: '13.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op alarminstallateurs die voldoen aan de door Onze Minister
      bij ministeriële regeling vast te stellen eisen van vakbekwaamheid en die beschikken over een verklaring van
      betrouwbaarheid als bedoeld in [artikel 10, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008973#Artikel10
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0008973
        artikel: '10'
        paragraaf: '3'
  - number: '13.3'
    text: |-
      Het eerste lid is niet van toepassing indien de desbetreffende gegevens betrekking hebben op een strafbaar feit en
      worden verstrekt aan de politie.
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel13
  - number: '14.1'
    text: |-
      Onze Minister kan een vergunning als bedoeld in [artikel 2, eerste, tweede en derde lid][ref1], intrekken indien:


      [ref1]: https://wetten.overheid.nl/BWBR0008973#Artikel2
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0008973
        artikel: '2'
        paragraaf: '1'
  - number: 14.1.a
    text: de aan de vergunning verbonden voorschriften niet in acht worden genomen;
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel14
  - number: 14.1.b
    text: |-
      de uit de wet of, indien een vergunning is verleend voor grensoverschrijdend transport van eurocontanten over de
      weg als bedoeld in de verordening, de uit de verordening, voortvloeiende verplichtingen niet worden nageleefd;
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel14
  - number: 14.1.c
    text: |-
      de voor de verkrijging van de vergunning verstrekte gegevens zodanig onjuist of onvolledig blijken, dat op de
      aanvraag een andere beslissing zou zijn genomen indien bij de beoordeling daarvan de juiste gegevens bekend waren
      geweest;
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel14
  - number: 14.1.d
    text: |-
      zich omstandigheden voordoen of feiten bekend worden op grond waarvan de vergunning zou zijn geweigerd, indien zij
      zich hadden voorgedaan of bekend waren geweest op het tijdstip waarop de vergunning werd verleend;
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel14
  - number: 14.1.e
    text: |-
      een beveiligingsorganisatie of recherchebureau handelt in strijd met hetgeen van een goede beveiligingsorganisatie
      of een goed recherchebureau in het maatschappelijk verkeer mag worden verwacht;
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel14
  - number: 14.1.f
    text: |-
      een beveiligingsorganisatie of recherchebureau gedurende een jaar geen beveiligingswerkzaamheden of
      recherchewerkzaamheden meer heeft verricht of aangeboden dan wel aan Onze Minister mededeelt van de vergunning geen
      gebruik meer te willen maken.
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel14
  - number: '14.2'
    text: |-
      Indien Onze Minister bij overtreding van de voorwaarden waaronder de vergunning voor grensoverschrijdend transport
      van eurocontanten over de weg is verleend overgaat tot intrekking, bedoeld in het eerste lid, kan hij tevens
      bepalen dat voor een maximumperiode van vijf jaar niet opnieuw een vergunning wordt verleend.
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel14
  - number: '14.3'
    text: |-
      Onze Minister kan de vergunning als bedoeld in [artikel 2, tweede lid][ref1], bij overtreding van de voorwaarden
      waaronder de vergunning voor grensoverschrijdend transport van eurocontanten over de weg is verleend opschorten
      voor een periode van minimaal twee weken tot maximaal twee maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0008973#Artikel2
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0008973
        artikel: '2'
        paragraaf: '1'
  - number: '15.1'
    text: |-
      Onze Minister kan aan de houder van de vergunning een bestuurlijke boete opleggen van ten hoogste € 11
      250 ter zake van overtreding van regels, gesteld bij of krachtens [artikel 4, vijfde of zesde lid][ref1],
      [6][ref2], [7, eerste, tweede of vierde lid][ref3], [8, tweede lid][ref4], [9][ref5],
      [10, eerste, derde of vierde lid][ref6], [11, tweede lid][ref7], of [12, eerste of tweede lid][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0008973#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008973#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0008973#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0008973#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0008973#Artikel9
      [ref6]: https://wetten.overheid.nl/BWBR0008973#Artikel10
      [ref7]: https://wetten.overheid.nl/BWBR0008973#Artikel11
      [ref8]: https://wetten.overheid.nl/BWBR0008973#Artikel12
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0008973
        artikel: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0008973
        artikel: '6'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0008973
        artikel: '7'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0008973
        artikel: '8'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0008973
        artikel: '9'
        paragraaf: '2'
      - id: ref6
        bwb_id: BWBR0008973
        artikel: '10'
        paragraaf: '3'
      - id: ref7
        bwb_id: BWBR0008973
        artikel: '11'
        paragraaf: '4'
      - id: ref8
        bwb_id: BWBR0008973
        artikel: '12'
        paragraaf: '4'
  - number: '15.2'
    text: |-
      Onze Minister kan eveneens aan de houder van de vergunning als bedoeld in [artikel 2, tweede lid][ref1], van de wet
      een bestuurlijke boete opleggen van ten hoogste € 11 250 ter zake van overtreding van de voorwaarden waaronder de
      vergunning voor grensoverschrijdend transport van eurocontanten over de weg. De boetebevoegdheid geldt ook indien
      vergunning op grond van de verordening is verleend door een bevoegde autoriteit in een andere lidstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0008973#Artikel2
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0008973
        artikel: '2'
        paragraaf: '1'
  - number: 15a
    text: |-
      Onze Minister kan het recht van de houder van een vergunning die op grond van de verordening is afgegeven in een
      andere lidstaat om eurocontanten te vervoeren opschorten voor een periode van minimaal twee weken tot maximaal twee
      maanden, indien de situaties, bedoeld in artikel 22, derde lid, van de verordening, aan de orde zijn.
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel15a
  - number: 15b.1
    text: |-
      Onze Minister kan de [artikelen 14][ref1] en [15][ref2] toepassen indien de vergunninghouder in een andere lidstaat
      een inbreuk heeft begaan op de verordening en hij daar met redenen omkleed van in kennis is gesteld door de
      bevoegde autoriteiten aldaar.


      [ref1]: https://wetten.overheid.nl/BWBR0008973#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0008973#Artikel15
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel15b
    references:
      - id: ref1
        bwb_id: BWBR0008973
        artikel: '14'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0008973
        artikel: '15'
        paragraaf: '4'
  - number: 15b.2
    text: |-
      Onze Minister kan, indien vast te stellen is aan wie de inbreuk te wijten is, leden van het bewakingspersoneel
      van een vergunninghouder uit een andere lidstaat verbieden grensoverschrijdend geldtransport over Nederlands
      grondgebied uit te voeren.
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel15b
  - number: '16.1'
    text: |-
      Met het onderzoek naar een overtreding als bedoeld in [artikel 15][ref1] zijn belast de in
      [artikel 11, eerste lid][ref2], bedoelde ambtenaren en de door Onze Minister aangewezen andere ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0008973#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0008973#Artikel11
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0008973
        artikel: '15'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0008973
        artikel: '11'
        paragraaf: '4'
  - number: '16.2'
    text: |-
      Ten dienste van het onderzoek beschikken zij over de in [artikel 11, tweede en derde lid][ref1], bedoelde
      bevoegdheden.


      [ref1]: https://wetten.overheid.nl/BWBR0008973#Artikel11
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0008973
        artikel: '11'
        paragraaf: '4'
  - number: '17'
    text: |-
      De werking van de beschikking waarbij een bestuurlijke boete wordt opgelegd, wordt opgeschort totdat de
      bezwaartermijn is verstreken of, indien bezwaar is gemaakt, op het bezwaar is beslist.
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel17
  - number: '22'
    text: |-
      Na het tijdstip waarop deze wet in werking treedt, worden de vergunningen die zijn verleend krachtens
      [artikel 5 van de Wet op de weerkorpsen en de particuliere beveiligingsorganisaties][ref1], beschouwd als
      vergunningen die zijn verleend krachtens [artikel 4][ref2] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0001980#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0008973#Artikel4
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0001980
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0008973
        artikel: '4'
        paragraaf: '1'
  - number: '23'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel23
  - number: '24'
    text: 'Deze wet kan worden aangehaald als: Wet particuliere beveiligingsorganisaties en recherchebureaus.'
    url: https://wetten.overheid.nl/BWBR0008973/2013-07-04#Artikel24
