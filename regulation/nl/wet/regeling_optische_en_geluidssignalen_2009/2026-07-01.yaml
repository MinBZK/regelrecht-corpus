  - number: '5'
    text: |-
      De signalen zijn als volgt uitgevoerd:

      - *blauw zwaai-, flits- of knipperlicht:* licht, bestaande uit één set blauwe signaalverlichting; de set
      voldoet aan klasse 2 van ECE reglement 65 en is overeenkomstig dat reglement gecertificeerd. Het licht is
      zodanig gemonteerd dat het signaal kan worden waargenomen rondom het voertuig vanaf een afstand van 20 m
      vanaf het voertuig, gemeten op 1,5 m boven het wegdek; ter ondersteuning van de set mag aan de voorzijde van
      het voertuig symmetrisch ten opzichte van de lengteas van het voertuig op een hoogte tussen 0,4 m en 1,2 m
      boven het wegdek een set secundaire blauwe signaalverlichting zijn aangebracht; ook deze set is gecertificeerd
      overeenkomstig ECE reglement 65; de secundaire set is alleen in werking wanneer de primaire signaalverlichting
      is ingeschakeld; de secundaire set signaalverlichting straalt naar voren, evenwijdig aan de lengteas van het
      voertuig; de secundaire set mag separaat uitschakelbaar zijn; een voertuig in gebruik bij politie, brandweer
      of diensten voor spoedeisende medische hulpverlening is slechts van deze signaalverlichting voorzien als het
      door middel van de in de [artikelen 5.2.51a][ref1], [5.3.51a][ref2], [5.3a.51a][ref3], [5.4.51a][ref4] of
      [5.5.51a van de Regeling voertuigen][ref5] bedoelde, door de Minister van Veiligheid en Justitie vastgestelde
      retroreflecterende striping, letters, cijfers of tekens als zodanig herkenbaar is voor de overige weggebruikers.
      Een voertuig van de in [artikel 1][ref6] aangewezen diensten dat gebruikt wordt voor het vervullen van een
      dringende taak, is van de blauwe signaalverlichting voorzien als het aan weerszijden door middel van een embleem
      of naam van de dienst herkenbaar is voor de overige weggebruikers. Een embleem of naam van de dienst heeft een
      oppervlak van ten minste 314 cm2. Het Team Bijzondere Bijstand van de Douane, zoals aangewezen in artikel 1, tweede
      lid, onder t, is uitgezonderd van de verplichting dat het motorvoertuig herkenbaar moet zijn als een motorvoertuig
      in gebruik bij de Douane.
      - *geel zwaai-, flits- of knipperlicht:* licht, bestaande uit één set gele signaalverlichting; de set voldoet aan
      ECE reglement 65 en is overeenkomstig dat reglement gecertificeerd; het licht is zodanig gemonteerd dat het signaal
      kan worden waargenomen rondom het voertuig vanaf een afstand van 20 m vanaf het voertuig, gemeten op 1,5 m boven
      het wegdek.
      - *groen zwaai-, flits- of knipperlicht:* een rondom schijnend groen permanent licht, zwaai-, flits- of
      knipperlicht, waarmee een voertuig dat is uitgerust met de in het eerste en tweede lid bedoelde signaalverlichting
      eveneens mag worden uitgerust; het groene licht wordt alleen gebruikt bij een stilstaand voertuig om daarmee het
      voertuig van de hoogste betrokken leidinggevende van de betrokken hulpverleningsdienst aan te geven.
      - *knipperende koplampen:* koplampen die tegelijkertijd aan en uit gaan.
      - *tweetonige hoorn:* hoorn die achtereenvolgens twee tonen aangeeft. De geluidssterkte van elke toon is bij dag
      ten minste 110 db(A) en ’s nachts ten minste 100 dB(A). De minimale geluidssterkte wordt tussen 10 en 100 ms na het
      inschakelen bereikt. De geluidssterkte is maximaal 125 dB(A). De meting van de geluidssterkte van de hoorn vindt
      plaats overeenkomstig [hoofdstuk 11 van de Regeling toelatingseisen][ref7], zoals die regeling luidde voor 1 mei
      2009, maar met een meetpositie op het wegdek. De on- en offset ligt tussen de 1 en 10 dB/ms. De wisselfrequentie
      van de tonen is eenparig en ligt tussen de 0,5 en 5 Hz. De wisselfrequentie mag middels een schakelaar zolang de
      bestuurder de hoorn bedient, worden verhoogd. Ook in dat geval is de wisselfrequentie maximaal 5 Hz. Deze verhoogde
      wisselfrequentie bedraagt een verdubbeling van de basisfrequentie. De toonhoogte van de lage toon is circa 375 Hz.
      De toonhoogte van de hoge toon is circa 500 Hz. De hoorn is alleen in werking wanneer de in het eerste lid bedoelde
      primaire blauwe signaalverlichting is ingeschakeld.
      - *extra richtingaanwijzers:* richtingaanwijzers als bedoeld in
      [artikel 30a van het Reglement verkeersregels en verkeerstekens 1990][ref8]. Deze richtingaanwijzers worden alleen
      gevoerd in combinatie met het blauwe zwaai-, knipper- of flitslicht.


