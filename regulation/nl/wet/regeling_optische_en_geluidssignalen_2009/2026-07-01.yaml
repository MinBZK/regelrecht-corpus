  - number: '4'
    text: |-
      1 De in [artikel 29, eerste lid, van het Reglement verkeersregels en verkeerstekens 1990][ref1] genoemde diensten
      en de in [artikel 1][ref2] aangewezen hulpverleningsdiensten wijzen personen of groepen van personen aan, die
      daartoe ingerichte motorvoertuigen met de inwerking zijnde optische en geluidsignalen mogen besturen.

      2 De in het eerste lid bedoelde personen worden aangewezen, nadat zij een speciale instructie hebben gekregen
      waardoor zij in staat zijn uiteen te zetten:

      a. wat de strafrechtelijke en civielrechtelijke gevolgen van het direct of indirect veroorzaken van schade of
      letsel tijdens de rit zijn;

      b. wat het gedrag en de reactie van weggebruikers kunnen zijn wanneer zij geconfronteerd worden met optische en
      geluidsignalen;

      c. wat het gewenste rijgedrag is; en

      d. wat de effecten van een hoge rijsnelheid zijn op de remweg, het reactievermogen, de letselernst en de
      responstijd.


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0025357#Artikel1
