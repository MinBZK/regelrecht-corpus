  - number: '7'
    text: |-
      De signalen op motorvoertuigen die op 1 maart 2009 waren voorzien van blauw zwaai- of knipperlicht
      en een twee- of drietonige hoorn of van geel zwaai- of knipperlicht, overeenkomstig het bepaalde in
      [artikel 3 van de Regeling optische en geluidssignalen][ref1], zoals die regeling luidde op 28 februari 2009, zijn
      in afwijking van [artikel 5, eerste, tweede en vijfde lid][ref2], als volgt uitgevoerd:

      a. het blauwe zwaai-, flits- of knipperlicht is rondom zichtbaar;

      b. het geel zwaai-, flits- of knipperlicht is rondom zichtbaar;

      c. de hoorn is tweetonig en geeft achtereenvolgens de tonen b en e aan, waarbij de geluidssterkte
      van elke toon bij dag ten minste 110 db(A) en ’s nachts ten minste 100 db(A) is, met een maximale
      geluidssterkte van 125 db(A); de meting van de geluidssterkte van de hoorn vindt plaats overeenkomstig
      [hoofdstuk 11 van de Regeling toelatingseisen][ref3], zoals die regeling luidde op 30 april 2009, waarbij de
      geluidssterkte vanaf het wegdek wordt gemeten.


