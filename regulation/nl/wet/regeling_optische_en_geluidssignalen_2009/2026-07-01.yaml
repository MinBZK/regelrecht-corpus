articles:
  - number: '1'
    text: |-
      1 Als hulpverleningsdiensten worden aangewezen die diensten die, voor zover de aan hen opgedragen taak hierin
      voorziet, voor het vervullen van een dringende taak worden ingezet.

      2 De in het eerste lid bedoelde diensten zijn de volgende:

      a. de door de directie van het Rode Kruis aangewezen onderdelen van Noodhulp Nationaal;

      b. de Stichting Sanquin voor een spoedtransport van bloed of bloedproducten;

      c. Prorail voor de inzet van hulpverleningsvoertuigen ten behoeve van ongevallen op het spoor;

      d. 1°. de veiligheidsregio’s,

      2°. de operationele onderdelen van het Instituut Fysieke Veiligheid,

      3°. Het Landelijk Operationeel Coördinatiecentrum van het Ministerie van Veiligheid en Justitie;

      e. de Stafafdeling Beveiliging, Bewaking & Vervoer van de Arrondissementale Stafdienst Amsterdam;

      f. de Milieudienst Zuid-Holland Zuid;

      g. de DCMR Milieudienst Rijnmond;

      h. de divisie Rotterdam Port Authority van Havenbedrijf Rotterdam N.V. ten behoeve van het gebruik van
      uitrukwagens;

      i. de door de Minister van Veiligheid en Justitie aangewezen functionarissen van de Landelijke Vervoersdienst
      Justitie of de Landelijke Bijzondere Bijstandsverlening van de Dienst Justitiële Inrichtingen;

      j. het door de Minister van Volksgezondheid, Welzijn en Sport aangewezen orgaancentrum, bedoeld
      in [artikel 24 van de Wet op de orgaandonatie][ref1], ten behoeve van het spoedeisende vervoer van
      transplantatieorganen en het spoedeisende vervoer van transplantatieteams;

      k. de door de Koninklijke Nederlandse Bond tot het Redden van Drenkelingen aangewezen reddingsbrigades;

      l. de Koninklijke Marechaussee, alsmede andere door de Minister van Defensie aangewezen bijstandseenheden;

      m. de militair geneeskundige dienst, bedoeld in
      [artikel 1, eerste lid, onderdeel f, van de Wet ambtenaren defensie][ref2];

      n. de Dienst Bedrijfsbeveiliging van TATA Steel IJmuiden B.V. te Velsen-Noord;

      o. 1°. de hoofdofficier van het landelijk parket van het Openbaar Ministerie,

      2°. het Nederlands Forensisch Instituut;

      p. van het Rijksinstituut voor Volksgezondheid en Milieu:

      1°. de milieuongevallendienst,

      2°. de radiologische dienst straling,

      3°. de incidentcoördinator;

      q. 1°. de explosieven opruimingsdiensten van het Ministerie van Defensie

      2°. de brandweerdiensten van het Ministerie van Defensie,

      3°. het Coördinatiecentrum Expertise Arbeidsomstandigheden en Gezondheid, ten behoeve van het verrichten van
      metingen bij stralingsincidenten,

      4°. het Advies en Assistentieteam en de Detectie, Identificatie en Monitoring groep van de Chemische, Radiologische
      en Nucleaire (CBRN) Responscapaciteit;

      r. de bedrijfsbrandweer van de luchthaven Schiphol of een luchthaven van nationale betekenis als bedoeld in
      [artikel 8.1 van de Wet luchtvaart][ref3];

      s. de weginspecteurs en officieren van dienst van Rijkswaterstaat;

      t. het Team Bijzondere Bijstand van de Douane.


