  - number: '3'
    text: |-
      1 De politie, de brandweer en de diensten voor spoedeisende medische hulpverlening stellen elk een richtlijn op met
      betrekking tot de werkzaamheden en de omstandigheden, waarin van de optische en geluidssignalen gebruik mag worden
      gemaakt.

      2 De in of krachtens de in [artikel 1, tweede lid][ref1], aangewezen hulpverleningsdiensten verklaren een van de in
      het eerste lid bedoelde richtlijnen van overeenkomstige toepassing of stellen een richtlijn op met betrekking tot
      de werkzaamheden en de omstandigheden, waarin van de optische en geluidssignalen gebruik mag worden gemaakt.

      3 De in het eerste en tweede lid bedoelde richtlijn bevat in ieder geval:

      a. de branchespecifieke criteria waaronder met de optische en geluidssignalen mag worden gereden, ter nadere
      invulling van de in [artikel 2][ref2] genoemde criteria;

      b. de prioritering van de meldingen en de rol die de meldkamer speelt bij het verlenen van toestemming om met de
      optische en geluidssignalen te mogen rijden;

      c. het branchespecifieke gedrag van de bestuurder;

      d. de vaardigheden van de bestuurder;

      e. de opleiding van de bestuurder;

      f. de manier waarop de vaardigheden van de bestuurder actueel en op peil worden gehouden.

      4 Naast de in het derde lid genoemde eisen bevat de in het eerste en tweede lid bedoelde richtlijn ten aanzien van
      de bestuurder van het voorrangsvoertuig de volgende eisen:

      a. het negeren van een rood verkeerslicht gebeurt met een snelheid van maximaal 20 km per uur;

      b. een vluchtstrook wordt bereden met een snelheid van maximaal 20 km per uur boven de snelheid van het verkeer op
      de rijbaan, met een snelheid van maximaal 80 km per uur. Wanneer de snelheid van het andere verkeer lager is dan
      30 km per uur, mag op de vluchtstrook maximaal 50 km per uur worden gereden;

      c. de rijbaan wordt bereden met een snelheid van maximaal 40 km per uur boven de ter plaatse geldende
      maximumsnelheid. De politie mag hiervan in overleg met de meldkamer in uitzonderlijke gevallen afwijken.


      [ref1]: https://wetten.overheid.nl/BWBR0025357#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0025357#Artikel2
