  - number: '2'
    text: |-
      Er is slechts sprake van een dringende taak als bedoeld in
      [artikel 29, eerste lid, van het Reglement verkeersregels en verkeerstekens 1990][ref1], en in
      [artikel 1, eerste lid][ref2], in geval van:

      a. een voor de mens levensbedreigende situatie die directe hulp van de betrokken hulpverleningsdiensten vergt;

      b. het voorkomen van een voor de mens levensbedreigende situatie of een situatie waarin ernstige schade aan
      gebouwen of goederen ontstaat;

      c. een ernstige verstoring van de openbare orde of de rechtsorde, waarvoor een directe en snelle inzet noodzakelijk
      is.


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0025357#Artikel1
