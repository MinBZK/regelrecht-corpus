  - number: '31.1'
    text: Deze verordening treedt in werking op 1 januari 2000.
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel31
  - number: '31.2'
    text: |-
      Deze verordening wordt aangehaald als: Zuivelverordening 2000, Uitbetaling van boerderijmelk naar kwaliteit,
      samenstelling en gewicht.
