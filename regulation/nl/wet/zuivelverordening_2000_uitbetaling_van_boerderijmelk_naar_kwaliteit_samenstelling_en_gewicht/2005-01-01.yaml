---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: zuivelverordening_2000_uitbetaling_van_boerderijmelk_naar_kwaliteit_samenstelling_en_gewicht
regulatory_layer: WET
publication_date: '2005-11-25'
valid_from: '2005-01-01'
bwb_id: BWBR0010719
url: https://wetten.overheid.nl/BWBR0010719/2005-01-01
preamble:
  text: |-
    Het bestuur van het Productschap Zuivel heeft, gelet op de artikelen 93, 95, 102 en 104 van de Wet op de
    bedrijfsorganisatie alsmede op artikel 5, lid 1, van de Instellingsverordening Produktschap Zuivel, in de
    vergadering van 15 september 1999 de navolgende verordening vastgesteld.
  url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze verordening wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel1
  - number: 1.a
    text: |-
      rauwe melk: het product dat wordt afgescheiden door de melkklier van één of meer koeien en dat niet verwarmd is tot
      boven 40°C en dat evenmin een behandeling met een gelijkwaardig effect heeft ondergaan;
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel1
  - number: 1.b
    text: |-
      boerderijmelk: rauwe melk die door een melkveehouder kennelijk bestemd is voor aflevering anders dan aan
      consumenten;
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel1
  - number: 1.c
    text: |-
      ontvanger van boerderijmelk: de natuurlijke of rechtspersoon die op jaarbasis 500.000 kg of meer boerderijmelk
      bedrijfsmatig ontvangt van één of meer in Nederland gevestigde melkveehouders en terzake betalingen aan de
      desbetreffende melkveehouders verricht , met uitzondering van boerderijzuivelbereiders;
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel1
  - number: 1.d
    text: |-
      melkkoeltank: een tank die voldoet aan norm NEN-ISO 5708 en die is voorzien van een installatie waarmee melk tot
      4°C of lager kan worden gekoeld, alsmede van een automatisch werkend roerapparaat;
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel1
  - number: 1.e
    text: 'tankmelk: boerderijmelk die door melkveehouders wordt bewaard in een melkkoeltank;'
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel1
  - number: 1.f
    text: |-
      leverantie van boerderijmelk: de transactie waarbij een melkveehouder boerderijmelk ter beschikking van de
      ontvanger van boerderijmelk stelt en deze de betreffende melk in ontvangst neemt met het kennelijke doel deze te
      bewerken, te verwerken of te verhandelen;
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel1
  - number: 1.g
    text: |-
      uitbetalings- dan wel bemonsteringsperiode: een kalendermaand; onder een halve bemonsteringsperiode wordt verstaan
      de periode van de eerste veertien dagen in de maand februari, dan wel de periode van de eerste vijftien dagen in
      elke andere kalendermaand, dan wel de periode van de overige dagen in elke kalendermaan;
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel1
  - number: 1.h
    text: 'rijdende melkontvangst: een mobiele installatie die wordt gebruikt voor het ophalen van boerderijmelk;'
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel1
  - number: 1.i
    text: |-
      kwaliteitsonderzoek: onderzoek naar de kwaliteit van boerderijmelk ten behoeve van de uitbetaling naar gelang van
      de kwaliteit van deze melk;
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel1
  - number: 1.j
    text: |-
      samenstellingsonderzoek: onderzoek naar het vet- en eiwitgehalte van boerderijmelk ten behoeve van de uitbetaling
      van deze melk;
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel1
  - number: 1.k
    text: 'COKZ: de Stichting Centraal Orgaan voor Kwaliteitsaangelegenheden in de Zuivel;'
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel1
  - number: 1.l
    text: |-
      melkcontrolestation: een instelling die onderzoek uitvoert met betrekking tot de kwaliteit en samenstelling van
      boerderijmelk;
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel1
  - number: 1.o
    text: 'productschap: het Productschap Zuivel;'
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel1
  - number: 1.p
    text: 'bestuur: het bestuur van het productschap;'
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel1
  - number: 1.q
    text: 'voorzitter: de voorzitter van het productschap;'
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel1
  - number: 1.r
    text: 'melkveehouder: de ondernemer die melkkoeien houdt.'
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel1
  - number: '2.1'
    text: |-
      De ontvanger van boerderijmelk betaalt aan de betrokken melkveehouders per uitbetalingsperiode de aan hem geleverde
      boerderijmelk op basis van de kwaliteit, de samenstelling en het gewicht met inachtneming van het bepaalde bij of
      krachtens deze verordening.
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel2
  - number: '2.2'
    text: De ontvanger van boerderijmelk meldt zich ter registratie aan bij het productschap.
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel2
  - number: '3'
    text: De ontvanger van boerderijmelk ontvangt alleen boerderijmelk die in een melkkoeltank is bewaard.
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel3
  - number: '4.1'
    text: |-
      De ontvanger van boerderijmelk zorgt ervoor dat van elke leverantie boerderijmelk een representatief monster wordt
      genomen met inachtneming van het bepaalde bij of krachtens deze verordening. De ontvanger van boerderijmelk stelt
      dit monster ter beschikking van een door het bestuur erkend melkcontrolestation.
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel4
  - number: '4.2'
    text: |-
      De ontvanger van boerderijmelk zorgt ervoor dat de chauffeur-monsternemer die wordt belast met de bemonstering van
      boerderijmelk ter zake kundig is.
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel4
  - number: '4.3'
    text: |-
      Indien gebruik wordt gemaakt van (semi-)automatische monsternemingsapparatuur is het betrokken apparaat
      voorzien van een type- en een installatiegoedkeuring afgegeven door het COKZ. De apparatuur voldoet voorts
      aan nader door het bestuur gestelde eisen. Het voorgaande laat onverlet het gebruik van (semi-)automatische
      monsternemingsapparatuur die is voorzien van een typegoedkeuring in een andere Lid-Staat van de Europese
      Gemeenschappen of in een Lid-Staat van de Europese Economische Ruimte, die garanties biedt die gelijkwaardig zijn
      aan vorenbedoelde eisen.
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel4
  - number: '5'
    text: De melkveehouder verleent alle medewerking aan de bemonstering van de boerderijmelk.
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel5
  - number: '6.1'
    text: |-
      De ontvanger van boerderijmelk neemt ten aanzien van het nemen, transporteren en bewaren van monsters boerderijmelk
      de nader door het bestuur vastgestelde bepalingen in acht.
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel6
  - number: '6.2'
    text: |-
      De ontvanger van boerderijmelk beschikt over een kwaliteitssysteem waarmee hij aantoonbaar het gestelde in lid
      1 realiseert, beheerst en borgt. Dit kwaliteitssysteem is vastgelegd in een door de ontvanger van boerderijmelk
      opgesteld handboek.
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel6
  - number: '6.3'
    text: |-
      De voorzitter kan, gehoord het COKZ, ontheffing verlenen van het bepaalde in lid 1. Aan deze ontheffing kunnen
      voorwaarden worden verbonden.
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel6
  - number: '8.1'
    text: 'Het kwaliteitsonderzoek bestaat uit de volgende onderdelen:'
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel8
  - number: 8.1.a
    text: 'het onderzoek naar de aanwezigheid van melkvreemde bacteriegroeiremmende stoffen (frequentie: elke leverantie);'
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel8
  - number: 8.1.b
    text: 'de bepaling van het kiemgetal (frequentie: 2 keer per bemonsteringsperiode);'
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel8
  - number: 8.1.c
    text: 'de bepaling van de verontreinigingsgraad (frequentie: 1 keer per bemonsteringsmethode);'
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel8
  - number: 8.1.d
    text: 'de bepaling van het celgetal (frequentie: 2 keer per bemonsteringsperiode);'
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel8
  - number: 8.1.e
    text: 'de bepaling van de aanwezigheid van sporen van boterzuurbacterien (frequentie: 1 keer per bemonsteringsperiode);'
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel8
  - number: 8.1.f
    text: |-
      de bepaling van de titreerbare zuurtegraad van het vet (frequentie: 1 keer in de maanden april tot en met juni en 1
      keer in de maanden september tot en met november);
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel8
  - number: 8.1.g
    text: 'de bepaling van het vriespunt (frequentie: 1 keer per halfjaar).'
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel8
  - number: '8.2'
    text: |-
      De bepalingen bedoeld in lid 1, onder b. en d. worden uitgevoerd in respectievelijk de eerste en tweede halve
      bemonsteringsperiode.
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel8
  - number: '8.3'
    text: |-
      De bepaling van de aanwezigheid van sporen van boterzuurbacterien wordt uitgevoerd in een monster uit de eerste
      halve bemonsteringsperiode. Indien in beide buizen duidelijk gasvorming is opgetreden, wordt de desbetreffende
      bepaling wederom uitgevoerd in een monster uit de tweede halve bemonsteringsperiode.
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel8
  - number: '8.4'
    text: |-
      In geval van onregelmatige leveranties worden de in lid 1 vermelde frequenties zoveel mogelijk benaderd. Tevens
      vinden de in lid 1, onder b. tot en met g. bedoelde onderzoeken op zodanige wijze plaats dat in opeenvolgende
      bemonsteringsperioden geen regelmaat in het onderzoek van het desbetreffende kwaliteitsonderdeel is te ontdekken.
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel8
  - number: '8.5'
    text: |-
      De voorzitter kan, gehoord het COKZ, in spoedeisende gevallen onderzoeken of bepalingen bedoeld in lid 1
      opschorten.
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel8
  - number: '8.6'
    text: |-
      De onderzoeken als bedoeld in lid 1 worden uitgevoerd met methoden die voldoen aan het bepaalde in de
      [Zuivelverordening 2003, Eisen methoden kwaliteitsonderzoek](onbekend).
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel8
  - number: '8.7'
    text: |-
      Het kwaliteitsonderzoek wordt verricht met inachtneming van de bepalingen van [Richtlijn 92/46/EEG](31992L0046) (PB
      EG 14 september 1992, L 268), zoals deze is of zal worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel8
  - number: '8.8'
    text: |-
      De uitslag van het kwaliteitsonderzoek wordt door of namens het bestuur van het productschap vastgesteld en aan de
      melkveehouder schriftelijk bekendgemaakt. De uitslag van het kwaliteitsonderzoek wordt tevens aan de ontvanger van
      boerderijmelk bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel8
  - number: '12'
    text: |-
      Ter bepaling van de samenstelling wordt elk monster als bedoeld in [artikel 4, lid 1][ref1], onderzocht op
      vetgehalte en eiwitgehalte conform het in dit hoofdstuk bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0010719#Artikel4
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0010719
        artikel: '4'
        hoofdstuk: II
  - number: '13.1'
    text: |-
      Het onderzoek naar het vet- en eiwitgehalte wordt uitgevoerd met methoden die voldoen aan het bepaalde in de
      [Zuivelverordening 2003, Eisen methoden kwaliteitsonderzoek](onbekend).
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel13
  - number: '13.2'
    text: |-
      Indien geen vet- of eiwitgehalte-uitslagen beschikbaar zijn wegens een geregistreerde geldige reden, wordt het vet-
      of eiwitgehalte berekend uit het gewogen gemiddelde van de twee voorgaande uitslagen.
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel13
  - number: '13.3'
    text: |-
      De uitslag van het samenstellingonderzoek wordt door of namens het bestuur van het productschap vastgesteld en
      aan de melkveehouder schriftelijk bekendgemaakt. De uitslag van het samenstellingsonderzoek wordt tevens aan de
      ontvanger van melk bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel13
  - number: '14.1'
    text: |-
      Het gewicht van de geleverde hoeveelheid boerderijmelk wordt bepaald overeenkomstig een nader door het bestuur
      vastgestelde werkwijze.
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel14
  - number: '14.2'
    text: |-
      De voorzitter kan, gehoord het COKZ, ontheffing verlenen van het bepaalde in lid 1, mits tot zijn genoegen wordt
      aangetoond dat de vaststelling van het gewicht op andere wijze nauwkeurig plaatsvindt. Aan de ontheffing kunnen
      voorwaarden worden verbonden.
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel14
  - number: '15'
    text: |-
      Per melkveehouder wordt per uitbetalingsperiode door de ontvanger van boerderijmelk op basis van de in die periode
      verkregen vetgehalten en eiwitgehalten en de daarbij behorende kilogrammen boerderijmelk het gewogen gemiddelde
      vetgehalte en eiwitgehalte berekend.
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel15
  - number: '16'
    text: |-
      De ontvanger van boerderijmelk berekent per melkveehouder en per uitbetalingsperiode het totale gewicht van de
      geleverde boerderijmelk.
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel16
  - number: '17.1'
    text: 'De ontvanger van boerderijmelk voert een administratie of laat deze voeren waaruit blijkt:'
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel17
  - number: 17.1.a
    text: het resultaat van het kwaliteitsonderzoek per uitbetalingsperiode per melkveehouder;
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel17
  - number: 17.1.b
    text: de berekening van het gewogen gemiddelde vet- en eiwitgehalte;
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel17
  - number: 17.1.c
    text: het gewicht.
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel17
  - number: '17.2'
    text: |-
      De in lid 1 bedoelde gegevens worden op overzichtelijke wijze geadministreerd en worden gedurende ten minste één
      jaar bewaard.
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel17
  - number: '18.1'
    text: |-
      Het COKZ wordt ten behoeve van het toezicht op de naleving van de bij of krachtens deze verordening gestelde
      bepalingen aangewezen.
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel18
  - number: '18.2'
    text: |-
      De werkwijze met betrekking tot het toezicht wordt opgenomen in een door het COKZ vast te stellen en door de
      voorzitter goed te keuren reglement.
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel18
  - number: '18.3'
    text: |-
      Van elk controlebezoek wordt door het COKZ een rapport opgemaakt. In het rapport worden afzonderlijke opmerkingen
      gemaakt betreffende geconstateerde afwijkingen en overige bevindingen. Deze rapporten worden gedurende een termijn
      van drie jaar bewaard.
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel18
  - number: '18.4'
    text: |-
      Per kwartaal wordt een totaal-overzicht opgesteld van de resultaten van de uitgevoerde controles. Dit overzicht
      wordt ter beschikking van het productschap gesteld en ter inzage gelegd voor de Algemene Inspectiedienst van het
      Ministerie van Landbouw, Natuurbeheer en Visserij.
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel18
  - number: '19'
    text: |-
      Aan de erkenning van een melkcontrolestation wordt de voorwaarde verbonden dat deze instelling de in de
      [artikelen 20 tot en met 23][ref1] omschreven bepalingen in acht neemt.


      [ref1]: https://wetten.overheid.nl/BWBR0010719#Artikel20
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0010719
        artikel: '20'
        hoofdstuk: IX
  - number: '20.1'
    text: |-
      Een melkcontrolestation toont ten genoegen van het bestuur aan dat het beschikt over een terzake deskundige
      leiding, over een voor het te verrichten onderzoek voldoende outillage, alsmede over een gedocumenteerd en adequaat
      functionerend kwaliteitssysteem.
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel20
  - number: '20.2'
    text: |-
      De gehanteerde methoden van onderzoek in het kader van de uitbetaling van boerderijmelk naar kwaliteit
      en samenstelling zijn binnen een melkcontrolestation vastgelegd in een als zodanig gekenmerkte bundel met
      onderzoeksvoorschriften.
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel20
  - number: '20.3'
    text: |-
      De door een melkcontrolestation gehanteerde methoden van onderzoek als bedoeld in het vorige lid zijn ter inzage
      bij het desbetreffende melkcontrolestation of worden desgewenst aan belanghebbenden toegezonden.
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel20
  - number: '21.1'
    text: |-
      Een melkcontrolestation selecteert de monsters voor het kwaliteitsonderzoek overeenkomstig het bepaalde in
      [artikel 8, lid 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010719#Artikel8
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0010719
        artikel: '8'
        hoofdstuk: III
  - number: '21.2'
    text: |-
      Een melkcontrolestation selecteert de monsters voor het sarnenstellingsonderzoek overeenkomstig het bepaalde in
      [artikel 12][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010719#Artikel12
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0010719
        artikel: '12'
        hoofdstuk: V
  - number: '21.3'
    text: |-
      Een melkcontrolestation verricht het kwaliteits- en sarnenstellingsonderzoek overeenkomstig het bepaalde in
      [artikel 8, lid 3][ref1] respectievelijk [artikel 13, lid 1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0010719#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0010719#Artikel13
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0010719
        artikel: '8'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0010719
        artikel: '13'
        hoofdstuk: V
  - number: '22'
    text: |-
      De uitslagen van het onderzoek worden vastgelegd op een voor het COKZ toegankelijke en overzichtelijke wijze. De
      uitslagen worden gedurende ten minste een jaar bewaard.
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel22
  - number: '23'
    text: (vervallen)
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel23
  - number: '24'
    text: |-
      De erkenning van het melkcontrolestation kan worden ingetrokken, indien niet aan de in de
      [artikelen 20 tot en met 23][ref1] gestelde voorwaarden wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0010719#Artikel20
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0010719
        artikel: '20'
        hoofdstuk: IX
  - number: '26'
    text: De ontvanger van boerderijmelk verleent het COKZ alle medewerking bij de uitoefening van het toezicht.
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel26
  - number: '27'
    text: |-
      Het bij of krachtens deze verordening bepaalde is bindend voor de in artikel 102, lid 1, van de wet bedoelde
      natuurlijke en rechtspersonen alsmede voor de in artikel 102, lid 2 van de wet bedoelde natuurlijke en
      rechtspersonen, voor zover deze handelingen verrichten die bedrijfsmatig plegen te worden verricht in de
      ondernemingen, bedoeld in artikel 102, lid 1, van de wet.
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel27
  - number: '28.1'
    text: Op overtreding van het bepaalde bij of krachtens deze verordening worden tuchtrechtelijke maatregelen gesteld.
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel28
  - number: '28.2'
    text: 'De tuchtrechtelijke maatregelen zijn:'
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel28
  - number: 28.2.a
    text: een berisping;
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel28
  - number: 28.2.b
    text: een geldboete van ten hoogste € 4.500;
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel28
  - number: 28.2.c
    text: openbaarmaking van de uitspraak op kosten van de betrokkene;
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel28
  - number: 28.2.d
    text: |-
      het onder verscherpte controle stellen van het bedrijf van de betrokkene op zijn kosten voor ten hoogste twee
      jaren.
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel28
  - number: '29.1'
    text: Het bestuur van het productschap kan ontheffing verlenen van het in deze verordening bepaalde.
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel29
  - number: '29.2'
    text: Het bestuur kan aan een ontheffing als bedoeld in lid 1 voorwaarden verbinden.
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel29
  - number: '30'
    text: |-
      De Landbouwkwaliteitsverordening 1994, Uitbetaling van boerderijmelk naar kwaliteit en de Zuivelverordening 1994,
      Uitbetaling van boerderijmelk naar samenstelling en gewicht worden ingetrokken, met dien verstande dat : - bijlage
      A van de Zuivelverordening 1994, Uitbetaling van boerderijmelk naar samenstelling en gewicht;
        - het Besluit nemen, transporteren en bewaren van monsters tankmelk;
        - het Besluit vaststelling frequentie en beoordeling resultaten kwaliteitsonderzoek; en
        - het Besluit goedgekeurde methoden kwaliteitsonderzoek 1996 van kracht blijven tot de datum van
      inwerkingtreding van de desbetreffende krachtens deze verordening vastgestelde uitvoeringsregelingen.
      Bovenvermelde uitvoeringsregelingen berusten na de inwerkingtreding van deze verordening op respectievelijk
      [artikel 14, lid 1][ref1], [artikel 6, lid 1][ref2], [artikel 8, lid 3][ref3] en [artikel 9, lid 1][ref4], en
      [artikel 8, lid 5][ref5], van deze verordening.


      [ref1]: https://wetten.overheid.nl/BWBR0010719#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0010719#Artikel6
