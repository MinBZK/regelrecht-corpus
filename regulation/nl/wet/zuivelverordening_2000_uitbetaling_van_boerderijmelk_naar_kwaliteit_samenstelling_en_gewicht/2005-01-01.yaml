      [ref4]: https://wetten.overheid.nl/BWBR0010719#Artikel9
      [ref5]: https://wetten.overheid.nl/BWBR0010719#Artikel8
    url: https://wetten.overheid.nl/BWBR0010719/2005-01-01#Artikel30
