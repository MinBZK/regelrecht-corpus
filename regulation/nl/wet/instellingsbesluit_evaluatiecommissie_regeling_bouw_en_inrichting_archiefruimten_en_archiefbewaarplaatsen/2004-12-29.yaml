---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: instellingsbesluit_evaluatiecommissie_regeling_bouw_en_inrichting_archiefruimten_en_archiefbewaarplaatsen
regulatory_layer: WET
publication_date: '2010-01-06'
valid_from: '2004-12-29'
bwb_id: BWBR0017772
url: https://wetten.overheid.nl/BWBR0017772/2004-12-29
preamble:
  text: 'Besluit:'
  url: https://wetten.overheid.nl/BWBR0017772/2004-12-29#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit Besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0017772/2004-12-29#Artikel1
  - number: 1.a
    text: 'de commissie: de Evaluatiecommissie Regeling Bouw en Inrichting Archiefruimten en Archiefbewaarplaatsen;'
    url: https://wetten.overheid.nl/BWBR0017772/2004-12-29#Artikel1
  - number: 1.b
    text: |-
      de regeling: de [Regeling Bouw en Inrichting Archiefruimten en Archiefbewaarplaatsen][ref1] ex
      [artikel 13 Archiefbesluit 1995][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0012803
      [ref2]: https://wetten.overheid.nl/BWBR0007376#Artikel13
    url: https://wetten.overheid.nl/BWBR0017772/2004-12-29#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0012803
      - id: ref2
        bwb_id: BWBR0007376
        artikel: '13'
  - number: 1.c
    text: 'de staatssecretaris: de Staatssecretaris van Cultuur, in dezen vertegenwoordigd door het Nationaal Archief.'
    url: https://wetten.overheid.nl/BWBR0017772/2004-12-29#Artikel1
  - number: '2'
    text: Er is een Evaluatiecommissie Regeling Bouw en Inrichting Archiefruimten en Archiefbewaarplaatsen.
    url: https://wetten.overheid.nl/BWBR0017772/2004-12-29#Artikel2
  - number: '3'
    text: 'De commissie heeft ten minste tot taak:'
    url: https://wetten.overheid.nl/BWBR0017772/2004-12-29#Artikel3
  - number: 3.a
    text: het beoordelen van de actualiteitswaarde van de regeling;
    url: https://wetten.overheid.nl/BWBR0017772/2004-12-29#Artikel3
  - number: 3.b
    text: |-
      het toetsen van de in de regeling opgenomen normen en standaarden op adequaatheid, uitvoerbaarheid, effectiviteit
      en handhaafbaarheid;
    url: https://wetten.overheid.nl/BWBR0017772/2004-12-29#Artikel3
  - number: 3.c
    text: het adviseren omtrent wijziging en aanvulling van de in de regeling opgenomen normen en standaarden.
    url: https://wetten.overheid.nl/BWBR0017772/2004-12-29#Artikel3
  - number: '4'
    text: 'Samenstelling van de commissie:'
    url: https://wetten.overheid.nl/BWBR0017772/2004-12-29#Artikel4
  - number: 4.a
    text: de commissie bestaat uit minimaal 3 en maximaal 6 leden;
    url: https://wetten.overheid.nl/BWBR0017772/2004-12-29#Artikel4
  - number: 4.b
    text: de leden van de commissie worden door de staatssecretaris benoemd voor de periode van twee jaar;
    url: https://wetten.overheid.nl/BWBR0017772/2004-12-29#Artikel4
  - number: 4.c
    text: aftredende leden kunnen ten hoogste eenmaal worden herbenoemd;
    url: https://wetten.overheid.nl/BWBR0017772/2004-12-29#Artikel4
  - number: 4.d
    text: de commissie benoemt uit haar leden een voorzitter en een plaatsvervangend voorzitter.
    url: https://wetten.overheid.nl/BWBR0017772/2004-12-29#Artikel4
  - number: '5'
    text: 'Bijeenkomen van de commissie:'
    url: https://wetten.overheid.nl/BWBR0017772/2004-12-29#Artikel5
  - number: 5.a
    text: de commissie vergadert tenminste vier maal per jaar;
    url: https://wetten.overheid.nl/BWBR0017772/2004-12-29#Artikel5
  - number: 5.b
    text: de commissie wordt door de voorzitter bijeengeroepen;
    url: https://wetten.overheid.nl/BWBR0017772/2004-12-29#Artikel5
  - number: 5.c
    text: de vergaderingen van de commissie zijn openbaar;
    url: https://wetten.overheid.nl/BWBR0017772/2004-12-29#Artikel5
  - number: 5.d
    text: |-
      in geval van belet of ontsteltenis van een vast lid neemt een plaatsvervangend lid met toestemming van de overige
      leden van de commissie aan de bijeenkomsten van genoemde commissie deel.
    url: https://wetten.overheid.nl/BWBR0017772/2004-12-29#Artikel5
  - number: '6'
    text: 'De werkwijze en het tijdstraject van de commissie zijn als volgt bepaald:'
    url: https://wetten.overheid.nl/BWBR0017772/2004-12-29#Artikel6
  - number: 6.a
    text: |-
      na het eerste jaar wordt een concept-advies uitgebracht, waarin worden opgenomen de voorlopige bevindingen en
      aanbevelingen betreffende het genoemde in [artikel 3][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0017772#Artikel3
    url: https://wetten.overheid.nl/BWBR0017772/2004-12-29#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0017772
        artikel: '3'
  - number: 6.b
    text: In het tweede jaar worden de bevindingen, zoals weergegeven in het concept-advies, nader uitgewerkt;
    url: https://wetten.overheid.nl/BWBR0017772/2004-12-29#Artikel6
  - number: 6.c
    text: Aan het einde van het tweede jaar wordt door de commissie een definitief advies uitgebracht.
    url: https://wetten.overheid.nl/BWBR0017772/2004-12-29#Artikel6
  - number: '7'
    text: 'Besluitvorming in de commissie:'
    url: https://wetten.overheid.nl/BWBR0017772/2004-12-29#Artikel7
  - number: 7.a
    text: de commissie besluit bij meerderheid van stemmen;
    url: https://wetten.overheid.nl/BWBR0017772/2004-12-29#Artikel7
  - number: 7.b
    text: besluiten worden slechts genomen, indien meer dan de helft van de leden aanwezig is;
    url: https://wetten.overheid.nl/BWBR0017772/2004-12-29#Artikel7
  - number: 7.c
    text: Indien de stemmen staken is de stem van de voorzitter bepalend.
    url: https://wetten.overheid.nl/BWBR0017772/2004-12-29#Artikel7
  - number: '8'
    text: 'Secretariaat en archiefbeheer:'
    url: https://wetten.overheid.nl/BWBR0017772/2004-12-29#Artikel8
  - number: 8.a
    text: in het secretariaat van de commissie wordt door de staatssecretaris voorzien;
    url: https://wetten.overheid.nl/BWBR0017772/2004-12-29#Artikel8
  - number: 8.b
    text: |-
      het beheer van de bescheiden betreffende de werkzaamheden van de commissie geschiedt op overeenkomstige wijze als
      bij het Nationaal Archief;
    url: https://wetten.overheid.nl/BWBR0017772/2004-12-29#Artikel8
  - number: 8.c
    text: de bescheiden worden opheffing van de commissie opgenomen in het archief van het Nationaal Archief.
    url: https://wetten.overheid.nl/BWBR0017772/2004-12-29#Artikel8
  - number: 8.d
    text: in de juridische ondersteuning zal door het Nationaal Archief worden voorzien.
    url: https://wetten.overheid.nl/BWBR0017772/2004-12-29#Artikel8
  - number: '9'
    text: |-
      Met het oog op de uitoefening van haar taak stelt de commissie, met inachtneming van het bepaalde in dit Besluit,
      ten behoeve van haar interne werkwijze een reglement in.
    url: https://wetten.overheid.nl/BWBR0017772/2004-12-29#Artikel9
  - number: '10'
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0017772/2004-12-29#Artikel10
