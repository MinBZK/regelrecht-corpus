$id: subsidieregeling_flexibel_hoger_onderwijs_voor_volwassenen
regulatory_layer: WET
publication_date: '2015-10-05'
valid_from: '2020-06-24'
bwb_id: BWBR0037055
url: https://wetten.overheid.nl/BWBR0037055/2020-06-24
preamble:
  text: |-
    Handelende in overeenstemming met de Minister van Economische Zaken;

    Gelet op de artikelen 2, eerste lid, onder a, 4 en 5 van de Wet overige OCW-subsidies;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel1
  - number: 1.a
    text: |-
      *wet:* [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: 1.b
    text: |-
      *minister:* Minister van Onderwijs, Cultuur en Wetenschap en, voor zover het betreft het onderwijs en het onderzoek
      op het gebied van landbouw en natuurlijke omgeving, de Minister van Economische Zaken;
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel1
  - number: 1.c
    text: |-
      *instelling voor hoger onderwijs:* instelling als bedoeld in [artikel 1.1, onderdeel g, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
  - number: 1.d
    text: |-
      *hoger onderwijs:* onderwijs, bedoeld in [artikel 1.1, onderdeel b, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
  - number: 1.e
    text: |-
      *deeltijds hoger onderwijs:* hoger onderwijs dat deeltijds is ingericht als bedoeld in
      [artikel 7.7, eerste lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 1.f
    text: |-
      *duaal hoger onderwijs:* hoger onderwijs dat duaal is ingericht als bedoeld in
      [artikel 7.7, tweede lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 1.g
    text: |-
      *studiepunt:* studiepunt als bedoeld in [artikel 7.4, eerste lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 1.h
    text: |-
      *leeruitkomsten:* beschrijving van inhoud en niveau van kennis, inzicht en vaardigheden van een lerende na
      afronding van een leerproces in een flexibel ingericht traject dat deel uitmaakt van de opleiding;
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel1
  - number: 1.i
    text: |-
      *leerwegonafhankelijke beoordeling:* tentaminering en examinering gericht op het beoordelen van door studenten
      gerealiseerde leeruitkomsten, waarbij de gehanteerde methoden en instrumenten voor tentaminering en examinering
      generiek zijn en niet specifiek zijn afgestemd op het specifieke, flexibele opleidingstraject van de student;
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel1
  - number: 1.j
    text: |-
      *validering:* het erkennen en waarderen van relevante leeruitkomsten die door een individuele student zijn
      gerealiseerd buiten een opleiding;
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel1
  - number: 1.k
    text: |-
      *werkend leren:* het uitvoeren van leeractiviteiten op een werkplek, leidend tot leeruitkomsten die relevant zijn
      in het kader van een opleiding;
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel1
  - number: 1.l
    text: '*online onderwijs:* onderwijs dat volledig of voor een substantieel deel online plaatsvindt.'
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel1
  - number: '2'
    text: |-
      Het doel van de subsidieverstrekking op grond van deze regeling is de flexibiliteit van het deeltijdse en duale
      hoger onderwijs te versterken met behoud van kwaliteit en het aantal deelnemers aan het deeltijdse en duale hoger
      onderwijs en het aantal gediplomeerden te verhogen.
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel2
  - number: '3.1'
    text: |-
      De minister kan subsidie verlenen aan instellingen voor hoger onderwijs voor het tijdvak januari 2016 tot en met
      december 2020 voor activiteiten op het terrein van deeltijds of duaal hoger onderwijs, die zich richten op de
      doelstellingen genoemd in [artikel 2][ref1] en ten behoeve van het op dit terrein per 2016 te starten experiment
      flexibel hoger onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0037055#Artikel2
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0037055
        artikel: '2'
  - number: '3.2'
    text: 'De activiteiten bedoeld in het eerste lid, betreffen de ontwikkeling van:'
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel3
  - number: 3.2.a
    text: eenheden van leerwegonafhankelijke leeruitkomsten, van maximaal 30 studiepunten per eenheid;
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel3
  - number: 3.2.b
    text: werkwijzen en instrumenten voor het vaststellen van flexibele, vraaggerichte opleidingstrajecten;
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel3
  - number: 3.2.c
    text: |-
      werkwijzen en instrumenten voor het vaststellen van onderwijsovereenkomsten voor het vastleggen van afspraken over
      (delen van) flexibele opleidingstrajecten gericht op het realiseren van leeruitkomsten;
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel3
  - number: 3.2.d
    text: |-
      methoden en instrumenten voor leerwegonafhankelijke beoordeling van eenheden van leeruitkomsten zoals bedoeld onder
      a;
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel3
  - number: 3.2.e
    text: procedures, methoden en instrumenten voor validering;
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel3
  - number: 3.2.f
    text: werkwijzen, methoden en instrumenten voor werkend leren in het kader van flexibele opleidingstrajecten;
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel3
  - number: 3.2.g
    text: online onderwijs ter versterking van flexibele opleidingstrajecten;
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel3
  - number: 3.2.h
    text: |-
      werkwijzen en instrumenten in het kader van de borging van de kwaliteit van flexibele opleidingstrajecten,
      aansluitend bij de onderdelen a tot en met g van dit lid; en
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel3
  - number: 3.2.i
    text: deskundigheidsbevordering in het kader van flexibilisering van de betreffende opleidingen.
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel3
  - number: '4.1'
    text: |-
      Subsidieaanvragen worden uiterlijk 15 oktober 2015 elektronisch of per post ingediend, overeenkomstig het in
      [bijlage A][ref1] bijgevoegde formulier.


      [ref1]: https://wetten.overheid.nl/BWBR0037055
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0037055
  - number: '4.2'
    text: Aanvragen die na 15 oktober 2015 worden ontvangen, worden niet in behandeling genomen.
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel4
  - number: '4.3'
    text: |-
      De aanvraag betreft het tijdvak januari 2016 tot en met december 2020 en omvat voor dat tijdvak een meerjarig
      activiteitenplan en een meerjarige begroting.
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel4
  - number: '4.4'
    text: |-
      Het meerjarige activiteitenplan bevat een beschrijving van doel(en), doelgroep(en), de beoogde kwalitatieve en
      kwantitatieve resultaten, het plan van aanpak van de activiteiten voor het tijdvak januari 2016 tot en met december
      2020, een planning en een overzicht van de projectorganisatie.
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel4
  - number: '4.5'
    text: |-
      De meerjarige begroting bevat een overzicht van de voor het tijdvak januari 2016 tot en met december 2020, geraamde
      inkomsten en uitgaven, voor zover die betrekking hebben op de activiteiten waarvoor subsidie wordt gevraagd, en is
      afgestemd op het meerjarige activiteitenplan.
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel4
  - number: '4.6'
    text: |-
      In de begroting wordt aangegeven hoe de begrote kosten die niet door de aangevraagde subsidie worden gedekt, worden
      gefinancierd.
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel4
  - number: '4.7'
    text: |-
      Indien de aanvraag in samenwerking met andere instellingen wordt gedaan, wordt de subsidie verstrekt aan en
      verantwoordt door de instelling die namens alle betrokken instellingen optreedt als penvoerder. Bij de aanvraag
      wordt in dat geval een door alle betrokken instellingen getekende verklaring gevoegd, waaruit blijkt dat de
      instelling die namens alle betrokken instellingen als penvoerder optreedt, gemachtigd is in het kader van deze
      subsidieaanvraag alle betrokken instellingen in en buiten rechte te vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel4
  - number: '4.8'
    text: |-
      In een aanvraag, als bedoeld in het zevende lid, wordt aangeven hoe de gevraagde subsidie door de penvoerder wordt
      verdeeld over de betrokken instellingen.
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel4
  - number: '4.9'
    text: |-
      De inrichting van de aanvraag is zoals aangegeven in het aanvraagformulier in [bijlage A][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037055
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0037055
  - number: '4.10'
    text: |-
      Elektronische indiening vindt plaats via het e-mailadres ‘subsidieflexibel-ho@minocw.nl’. Schriftelijk wordt de
      aanvraag ingediend bij het Ministerie van Onderwijs, Cultuur en Wetenschap, directie HO&S, postbus 16375, 2500 BJ
      Den Haag.
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel4
  - number: '5.1'
    text: |-
      De aanvragen worden beoordeeld op basis van een vergelijking van hun geschiktheid om bij te dragen aan de
      doelstellingen van de subsidie, bedoeld in [artikel 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037055#Artikel2
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0037055
        artikel: '2'
  - number: '5.2'
    text: |-
      Bij de rangschikking van tijdig ingediende en complete aanvragen wordt voorrang gegeven aan aanvragen van
      instellingen die deelnemen aan het experiment vraagfinanciering. Aanvragen van instellingen die geen opleidingen
      verzorgen waarmee zij zouden kunnen deelnemen aan het experiment vraagfinanciering, worden door de minister op
      dezelfde wijze behandeld als de aanvragen van instellingen die deelnemen aan het experiment vraagfinanciering.
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel5
  - number: '5.3'
    text: |-
      De rangschikking van de tijdig ingediende en complete aanvragen geschiedt aan de hand van de volgende maatstaven,
      zoals uitgewerkt in [bijlage B][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0037055
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0037055
  - number: 5.3.a
    text: de mate van ambitie;
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel5
  - number: 5.3.b
    text: de mate van haalbaarheid;
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel5
  - number: 5.3.c
    text: de mate waarin de doelgroep wordt bereikt;
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel5
  - number: 5.3.d
    text: de mate waarin er sprake is van een integrale aanpak van de flexibilisering;
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel5
  - number: 5.3.e
    text: de mate van vraaggerichtheid van het te ontwikkelen hoger onderwijs;
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel5
  - number: 5.3.f
    text: |-
      de mate waarin duurzame verankering van het te ontwikkelen hoger onderwijs in beleid en bedrijfsvoering kansrijk
      is; en
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel5
  - number: 5.3.g
    text: de mate waarin invulling wordt gegeven aan leerfunctie, interne en externe kennisdeling.
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel5
  - number: '6.1'
    text: De minister stelt een onafhankelijke adviescommissie in die belast is met de beoordeling van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel6
  - number: '6.2'
    text: De adviescommissie adviseert de minister uiterlijk 6 januari 2016 over de subsidieverlening.
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel6
  - number: '6.3'
    text: De minister wijkt slechts om zwaarwegende redenen af van het advies.
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel6
  - number: '7.1'
    text: |-
      Voor subsidieverlening op grond van deze regeling is in totaal 25 miljoen euro beschikbaar voor het tijdvak januari
      2016 tot en met december 2020.
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel7
  - number: '7.2'
    text: |-
      De subsidie bedraagt voor het tijdvak 1 januari 2016 tot en met 31 december 2020 maximaal 2 miljoen euro per
      instelling. Het subsidiebedrag wordt door de subsidieontvanger aangevuld met ten minste hetzelfde bedrag aan
      cofinanciering dan wel eigen middelen.
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel7
  - number: '7.3'
    text: De minister voorziet uiterlijk 14 januari 2016 in een gelijktijdige beslissing op de ingediende aanvragen.
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel7
  - number: '7.4'
    text: |-
      Onverminderd [artikel 4:35 van de Algemene wet bestuursrecht][ref1] wordt subsidie geweigerd indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 7.4.a
    text: |-
      aan de aanvrager in een zelfde jaar voor overeenkomstige activiteiten subsidie is verstrekt op grond van de
      Subsidieregeling open en online hoger onderwijs; of
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel7
  - number: 7.4.b
    text: niet aannemelijk is dat de aanvrager kan voldoen aan het vereiste bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel7
  - number: '8.1'
    text: |-
      Voor zover het een subsidie tot € 25.000 aan een bekostigde instelling betreft, wordt de subsidie vastgesteld en
      verstrekt binnen 13 weken na ontvangst van de aanvraag. De minister betaalt het subsidiebedrag ineens. Indien de
      activiteiten volledig zijn uitgevoerd en aan alle verplichtingen is voldaan, kan het niet aangewende deel van de
      subsidie worden besteed aan andere activiteiten waarvoor bekostiging wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel8
  - number: '8.2'
    text: |-
      Voor zover het een subsidie van € 25.000 tot € 125.000 aan een bekostigde instelling betreft, wordt de subsidie
      vastgesteld en verstrekt binnen 13 weken na ontvangst van de aanvraag. De minister betaalt per kwartaal een gelijk
      deel van het subsidiebedrag. Indien de activiteiten volledig zijn uitgevoerd en aan alle verplichtingen is voldaan,
      kan het niet aangewende deel van de subsidie worden besteed aan andere activiteiten waarvoor bekostiging wordt
      verstrekt.
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel8
  - number: '8.3'
    text: |-
      Voor zover het een subsidie van € 125.000 of meer aan een bekostigde instelling betreft, wordt de subsidie verleend
      binnen 13 weken na ontvangst van de aanvraag. De subsidie wordt uitsluitend besteed aan de activiteiten waarvoor
      deze wordt verleend. De minister verleent een voorschot van 100 procent en betaalt per kwartaal een gelijk deel van
      het subsidiebedrag.
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel8
  - number: '9.1'
    text: |-
      Voor zover het een subsidie tot € 25.000 aan een bekostigde instelling betreft, geschiedt de verantwoording
      van de subsidie in de jaarverslaggeving overeenkomstig de [Regeling jaarverslaggeving onderwijs][ref1]. De
      subsidieontvanger toont op verzoek van de minister aan dat de activiteiten waarvoor subsidie is verstrekt, zijn
      verricht en dat aan de aan de subsidie verbonden verplichtingen is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0023132
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0023132
  - number: '9.2'
    text: |-
      Voor zover het een subsidie van € 25.000 tot € 125.000 aan een bekostigde instelling betreft,
      geschiedt de verantwoording van de subsidie in de jaarverslaggeving overeenkomstig de
      [Regeling jaarverslaggeving onderwijs][ref1] met model G1. De subsidieontvanger toont op verzoek van de minister
      aan dat de activiteiten waarvoor subsidie is verstrekt, zijn verricht en dat aan de aan de subsidie verbonden
      verplichtingen is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0023132
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0023132
  - number: '9.3'
    text: |-
      Voor zover het een subsidie van € 125.000 of meer aan een bekostigde instelling betreft,
      geschiedt de verantwoording van de subsidie in de jaarverslaggeving overeenkomstig de
      [Regeling jaarverslaggeving onderwijs][ref1] met model G2. De vaststelling vindt plaats binnen een jaar na de
      indiening van het jaarverslag over het laatste jaar van besteding.


      [ref1]: https://wetten.overheid.nl/BWBR0023132
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0023132
  - number: '10.1'
    text: |-
      Voor zover het een subsidie tot € 25.000 aan een niet bekostigde instelling betreft, wordt de subsidie vastgesteld
      en verstrekt binnen 13 weken na ontvangst van de aanvraag. De minister betaalt het subsidiebedrag ineens.
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel10
  - number: '10.2'
    text: |-
      Voor zover het een subsidie van € 25.000 tot € 125.000 aan een niet bekostigde instelling betreft, wordt de
      subsidie verleend binnen 13 weken na ontvangst van de aanvraag. De minister verleent een voorschot van 100 procent
      en betaalt per kwartaal een gelijk deel van het subsidiebedrag.
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel10
  - number: '10.3'
    text: |-
      Voor zover het een subsidie van € 125.000 of meer aan een niet bekostigde instelling betreft, wordt de subsidie
      verleend binnen 13 weken na ontvangst van de aanvraag. De subsidie wordt uitsluitend besteed aan de activiteiten
      waarvoor deze wordt verleend. De minister verleent een voorschot van 100 procent en betaalt per kwartaal een gelijk
      deel van het subsidiebedrag
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel10
  - number: '11.1'
    text: |-
      Voor zover het een subsidie tot € 25.000 aan een niet bekostigde instelling betreft, toont subsidieontvanger op
      verzoek van de minister aan dat de activiteiten waarvoor subsidie is verstrekt, zijn verricht en dat aan de aan de
      subsidie verbonden verplichtingen is voldaan.
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel11
  - number: '11.2'
    text: |-
      Voor zover het een subsidie van € 25.000 tot € 125.000 aan een niet bekostigde instelling betreft, geschiedt de
      verantwoording van de subsidie aan de hand van een activiteitenverslag.
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel11
  - number: '11.3'
    text: |-
      Voor zover het een subsidie van € 125.000 of meer aan een niet bekostigde instelling betreft, geschiedt
      de verantwoording van de subsidie aan de hand van een activiteitenverslag, een financieel verslag en een
      controleverklaring, aan de hand waarvan de subsidie wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel11
  - number: '12'
    text: |-
      De subsidieontvanger werkt mee aan door of namens de minister ingesteld onderzoek dat erop gericht is de minister
      inlichtingen te verschaffen ten behoeve van de ontwikkeling van beleid.
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel12
  - number: 12a
    text: |-
      Indien een subsidieontvanger door de uitbraak van COVID-19 of de maatregelen ter bestrijding ervan niet in staat is
      de activiteiten waarvoor op grond deze regeling subsidie is verstrekt, uiterlijk op 31 december 2020 af te ronden,
      kan de minister het tijdvak voor uitvoering van de activiteiten verlengen.
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel12a
  - number: '13'
    text: Deze regeling treedt in werking per 5 oktober 2015 en vervalt met ingang van 1 januari 2022.
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel13
  - number: '14'
    text: 'Deze regeling wordt aangehaald als: Subsidieregeling flexibel hoger onderwijs voor volwassenen.'
    url: https://wetten.overheid.nl/BWBR0037055/2020-06-24#Artikel14
