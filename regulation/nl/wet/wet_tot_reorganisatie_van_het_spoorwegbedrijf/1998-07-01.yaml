        artikel: '3'
  - number: '5'
    text: |-
      De rente en aflossing door het Rijk verschuldigd terzake van de ingevolge [artikel 3][ref1] dezer wet uitgegeven
      schuldbewijzen komen met ingang van den dag, waarop S.S. en H.S. in liquidatie treden, ten laste van de N. V.
      Nederlandsche Spoorwegen, een en ander met uitzondering van de rente en aflossing van een gedeelte groot f 140
      millioen, welke ten laste blijven van het Rijk.

      De obligaties en schuldbekentenissen ten laste van S.S. en H.S., en aandeelen aan toonder, welke ingevolge
      [artikel 3][ref2] ter inwisseling tegen schuldbewijzen ten laste van het Rijk bij Onzen Minister van Financiën zijn
      ingeleverd, gaan met ingang van den datum, waarop S.S. en H.S. in liquidatie treden, in eigendom over aan de N. V.
      Nederlandsche Spoorwegen.

      De N. V. Nederlandsche Spoorwegen zal aan het Rijk terugbetalen de bedragen, welke het Rijk alsnog verplicht zal
      zijn te storten op de te zijnen name staande aandeelen van S.S. en H.S.


      [ref1]: https://wetten.overheid.nl/BWBR0001988#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0001988#Artikel3
    url: https://wetten.overheid.nl/BWBR0001988/1998-07-01#Artikel5
