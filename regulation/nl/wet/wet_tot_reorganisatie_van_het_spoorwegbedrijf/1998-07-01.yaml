        artikel: '3'
  - number: '2'
    text: |-
      Alle rechten en verplichtingen, welke S.S. of H.S. bij overeenkomst of krachtens vergunning hebben verkregen of
      aanvaard en welke krachtens [artikel 1 onder ][ref1] door de N. V. Nederlandsche Spoorwegen worden overgenomen,
      gaan op het tijdstip dezer overneming aan deze naamlooze vennootschap over, alsof die overeenkomsten met haar
      gesloten, en die vergunningen aan of door haar verleend waren.


      [ref1]: https://wetten.overheid.nl/BWBR0001988#Artikel1
    url: https://wetten.overheid.nl/BWBR0001988/1998-07-01#Artikel2
