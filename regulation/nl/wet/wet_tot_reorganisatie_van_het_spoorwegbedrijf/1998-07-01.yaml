        artikel: '3'
  - number: '6'
    text: |-
      Onze Minister van Waterstaat wordt gemachtigd om van Onzentwege aan de N. V. Nederlandsche Spoorwegen concessie
      voor de haar op te dragen exploitatie van spoor- en tramwegen te verleenen.

      Alle bij of krachtens de wet vastgestelde of nader vast te stellen bepalingen betreffende den dienst en het gebruik
      van spoor- en tramwegen zijn, voor zoover daarin niet door deze wet wordt voorzien, toepasselijk op de spoor- en
      tramwegdiensten, uitgeoefend door de N. V. Nederlandsche Spoorwegen.
    url: https://wetten.overheid.nl/BWBR0001988/1998-07-01#Artikel6
  - number: '7'
    text: |-
      Alle krachtens deze wet opgemaakte stukken, daaronder begrepen de akten, benoodigd voor de in [artikel 1][ref1]
      omschreven rechtshandelingen, zijn vrij van zegel en van het recht van registratie.


      [ref1]: https://wetten.overheid.nl/BWBR0001988#Artikel1
    url: https://wetten.overheid.nl/BWBR0001988/1998-07-01#Artikel7
