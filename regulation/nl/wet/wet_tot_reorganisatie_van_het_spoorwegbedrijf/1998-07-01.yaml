  - number: 7a
    text: |-
      Deze wet is met ingang van de dag waarop de Wet personenvervoer (*Stb.* 1987, 175) in werking treedt niet meer van
      toepassing op het vervoer van personen.
    url: https://wetten.overheid.nl/BWBR0001988/1998-07-01#Artikel7a
  - number: '8'
    text: Deze wet treedt in werking met ingang van den dag, volgende op dien harer afkondiging.
    url: https://wetten.overheid.nl/BWBR0001988/1998-07-01#Artikel8
