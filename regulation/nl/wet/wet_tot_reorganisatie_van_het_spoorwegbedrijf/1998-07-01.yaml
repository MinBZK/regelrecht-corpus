  - number: '3'
    text: |-
      Onze Minister van Financiën wordt gemachtigd tot uitgifte van schuldbewijzen ten laste van het Rijk tot een
      nominaal bedrag van ten hoogste f 450 millioen, ten einde deze schuldbewijzen te doen strekken ter inwisseling
      van obligaties en schuldbekentenissen afgegeven door of thans loopende ten laste van S.S. of H.S., alsmede van de
      aandeelen aan toonder dezer Maatschappijen, voor zoover niet door een van beide gehouden.

      Deze uitgifte zal geschieden op tijdstippen, welke Onze Minister van Financiën dienstig zal achten.
    url: https://wetten.overheid.nl/BWBR0001988/1998-07-01#Artikel3
  - number: '4'
    text: |-
      Bij de in [artikel 3][ref1] bedoelde uitgifte zullen de volgende bepalingen gelden: *Uitvoeringsvoorschriften.
      Rekening. Schulddelging*

      a. De voorwaarden van de uitgifte der schuldbewijzen worden door Onzen Minister van Financiën vastgesteld;

      b. Van de uitgifte der schuldbewijzen wordt na afloop een rekening afgelegd, welke na door de Algemeene Rekenkamer
      te zijn nagezien en accoord bevonden aan de Staten-Generaal wordt medegedeeld;

      c. De schuldbewijzen worden vóór de uitgifte door de Algemeene Rekenkamer geregistreerd en van een bewijs dier
      registratie voorzien;

      d. Onverminderd het bepaalde in het volgend lid zal de schuld, welke krachtens deze wet wordt gevestigd, worden
      gedelgd in ten hoogste 50 jaren te beginnen in het jaar volgende op dat, waarin de uitgifte plaats vindt;

      e. De bevoegdheid tot versterkte delging van de krachtens deze wet gevestigde schuld wordt voorbehouden; *Provisie*

      a. Aan de bankiers, de makelaars in effecten en de commissionnairs in effecten, door wier tusschenkomst obligaties
      of aandeelen aan toonder ter inwisseling worden aangeboden, kan over het nominaal bedrag der door hen ter
      inwisseling geleverde stukken een provisie worden toegekend van ten hoogste 3/8 pct. (drie achtsten ten honderd).

      b. In het geval bij het vorig lid voorzien kan mede aan de bankiers, van wier kantoren wordt gebruik gemaakt,
      voor de bemiddeling bij de inwisseling, het in ontvangst nemen van de obligaties of van de aandeelen aan toonder
      en de afgifte van de schuldbewijzen over het nominaal bedrag der door hun tusschenkomst ingeleverde stukken een
      vergoeding worden toegekend van ten hoogste 3/8 pct. (drie achtsten ten honderd). *Vrijstelling van belastingen*

      Onder de voorwaarden van de uitgifte kan worden opgenomen, dat krachtens deze wet uitgegeven schuldbewijzen met de
      daarbij behoorende rentebewijzen vrijgesteld zijn van alle Nederlandsche belastingen, welke van schuldbewijzen ten
      laste van Nederland en de daarbij behoorende rentebewijzen mochten worden geheven. *Vrijstelling van zegelrecht*

      De biljetten van inschrijving voor en de nota’s van toewijzing van de krachtens deze wet uitgegeven schuldbewijzen
      zijn vrij van zegelrecht.


      [ref1]: https://wetten.overheid.nl/BWBR0001988#Artikel3
    url: https://wetten.overheid.nl/BWBR0001988/1998-07-01#Artikel4
    references:
