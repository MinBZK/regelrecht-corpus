preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of hooren lezen, salut! doen te weten:

    Alzoo Wij in overweging genomen hebben, dat het wenschelijk is het spoorwegbedrijf te reorganiseeren;

    Zoo is het, dat Wij, den Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0001988/1998-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Onze Ministers van Waterstaat en van Financiën worden gemachtigd om voor en namens het Rijk voor zooveel noodig
      in samenwerking met de N. V. Maatschappij tot Exploitatie van Staatsspoorwegen (hierna aangeduid als S.S.) en
      met de N. V. Hollandsche IJzeren Spoorweg Maatschappij (hierna aangeduid als H.S.) en met afwijking van met deze
      Maatschappijen gesloten, door de wet bekrachtigde overeenkomsten:

      a. oprichting te bevorderen van een naamlooze vennootschap "N. V. Nederlandsche Spoorwegen" overeenkomstig de bij
      deze wet in ontwerp gevoegde statuten met een aandeelenkapitaal van f 10 000 000, waarvan bij de oprichting één
      aandeel van f 1000 zal worden gesteld ten name van S.S. en één ten name van H.S., en de overige aandeelen door het
      Rijk worden genomen;

      b. over te dragen in eigendom aan de onder *a* genoemde naamlooze vennootschap de thans ingevolge de overeenkomsten
      1890 S.S./H.S. verhuurde Staatsspoorwegen met de overhoeken, welke naar het oordeel van die vennootschap voor
      het bedrijf noodig zijn, alsmede de op anderen voet aan S.S. of H.S. verhuurde eigendommen, welke het Rijk voor
      zijn dienst niet meer behoeft, tegen betaling door die vennootschap aan het Rijk van een bedrag van f 10 000 000.
      Voor zooveel de eigendom van deze spoorwegen na 1921 door naasting is verkregen, vervallen met de overdracht de
      uit dien hoofde nog op het Rijk, S.S. of H.S. rustende verplichtingen en komen de verplichtingen tot betaling
      van naastingsprijzen en tot het dragen van uit deze betalingen voortvloeiende lasten te rusten op de N. V.
      Nederlandsche Spoorwegen;

      c. mede te werken tot liquidatie van S.S. en H.S. en tot overdracht van alle eigendommen, rechten en verplichtingen
      van elk dezer Maatschappijen aan de N. V. Nederlandsche Spoorwegen, met uitzondering van rechten en verplichtingen
      betreffende obligaties, schuldbekentenissen of aandeelen aan toonder, die ingevolge [artikel 3][ref1] kunnen worden
      ingewisseld tegen schuldbewijzen van het Rijk.


      [ref1]: https://wetten.overheid.nl/BWBR0001988#Artikel3
    url: https://wetten.overheid.nl/BWBR0001988/1998-07-01#Artikel1
    references:
