---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_kentekens_en_kentekenplaten
regulatory_layer: WET
publication_date: '2025-10-28'
valid_from: '2026-01-01'
bwb_id: BWBR0009071
url: https://wetten.overheid.nl/BWBR0009071/2026-01-01
preamble:
  text: |-
    Gelet op de artikelen 36, achtste lid en 40, derde lid, van de Wegenverkeerswet 1994, artikel 2, tweede lid, van
    het Kentekenreglement en de artikelen 5.2.1, onderdeel d, 5.3.1, onderdeel e, 5.4.1, onderdeel e, 5.5.1, onderdeel
    d, en 5.12.1, onderdeel e, van het Voertuigreglement;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'Kentekens bestaan uit een samenstel van:'
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel1
  - number: 1.1.a
    text: twee groepen van twee cijfers en één groep van twee letters;
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel1
  - number: 1.1.b
    text: twee groepen van twee letters en één groep van twee cijfers;
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel1
  - number: 1.1.c
    text: één groep van twee cijfers, één groep van drie letters en één cijfer;
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel1
  - number: 1.1.d
    text: één groep van twee letters, één groep van drie cijfers en één letter;
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel1
  - number: 1.1.e
    text: één groep van drie letters, één groep van twee cijfers en één letter, of
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel1
  - number: 1.1.f
    text: één groep van drie cijfers, één groep van twee letters en één cijfer.
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel1
  - number: '1.2'
    text: 'In afwijking van het bepaalde in het eerste lid bestaan:'
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel1
  - number: 1.2.a
    text: |-
      kentekens, bevattende de lettergroep AA of CDJ en vóór 1 januari 1991 opgegeven kentekens bevattende de lettergroep
      CD uit een samenstel van genoemde lettergroep en één groep van ten hoogste drie cijfers,
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel1
  - number: 1.2.b
    text: |-
      kentekens als bedoeld in [artikel 4, derde lid, onderdeel a, van het Kentekenreglement][ref1] uit een samenstel van
      de lettergroep ZZ of ZZZ en twee groepen van twee cijfers respectievelijk één cijfer en één groep van twee cijfers,


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel4
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '4'
  - number: 1.2.c
    text: |-
      kentekens als bedoeld in [artikel 4, derde lid, onderdeel b, van het Kentekenreglement][ref1] uit een samenstel van
      twee of drie groepen van letters en cijfers, en


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel4
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '4'
  - number: 1.2.d
    text: |-
      kentekens als bedoeld in [artikel 4, derde lid, onderdeel c, van het Kentekenreglement][ref1] uit een samenstel van
      de enkele letter A, E, H, K, L, N, P, S, T, V, W of X en twee groepen van twee cijfers of één cijfer en één groep
      van drie cijfers.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel4
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '4'
  - number: '1.3'
    text: |-
      Voor een bedrijfsauto of bus waarvan de toegestane maximum massa niet meer bedraagt dan 3500 kg wordt een kenteken
      opgegeven:
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel1
  - number: 1.3.a
    text: |-
      waarvan de eerste letter een V of een B is, voor kentekens die bestaan uit twee groepen van twee letters en één
      groep van twee cijfers, dan wel twee groepen van twee cijfers en één groep van twee letters;
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel1
  - number: 1.3.b
    text: |-
      waarvan de eerste letter een V is, voor kentekens die bestaan uit één groep van twee cijfers, één groep van drie
      letters en één cijfer, dan wel één groep van twee letters, één groep van drie cijfers en één letter;
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel1
  - number: 1.3.c
    text: |-
      waarvan de eerste letter een V is, voor kentekens die bestaan uit één groep van drie letters, één groep van twee
      cijfers en één letter, dan wel één groep van drie cijfers, één groep van twee letters en één cijfer.
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel1
  - number: '1.4'
    text: |-
      Voor een bedrijfsauto of bus waarvan de toegestane maximum massa meer bedraagt dan 3500 kg wordt een kenteken
      opgegeven waarvan de eerste letter een B is.
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel1
  - number: '1.5'
    text: |-
      Indien door een wijziging van een bedrijfsauto of bus waarvoor een kenteken is opgegeven de toegestane maximum
      massa niet meer dan 3500 kg dan wel meer dan 3500 kg is komen te bedragen, wordt voor dat voertuig, met toepassing
      van het bepaalde in het derde en vierde lid, een nieuw kenteken opgegeven.
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel1
  - number: '2.1'
    text: |-
      Het type en de afmetingen van letters, cijfers en horizontale streep alsmede de onderlinge afstand daarvan,
      moeten overeenkomen met de modellen A.1, A.2, B.1, B.2, C.1, C.2 of C.3 van de bijlage. Het Europese embleem en de
      landenindicator moeten in geel respectievelijk in wit zijn aangebracht op een blauwe retroreflecterende achtergrond
      overeenkomstig de modellen D1 of D2 van de bijlage.
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel2
  - number: '2.2'
    text: |-
      Het type en de afmetingen van de kentekenplaat moeten overeenkomen met de modellen 1.1 tot en met 27.2H, 27.10A tot
      en met 27.26E, 27.30A tot en met 27.31E en 30.1A tot en met 30.16 van de bijlage.
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel2
  - number: '2.3'
    text: Het type en de afmetingen van het hologram moeten overeenkomen met model F van de bijlage.
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel2
  - number: '3.1'
    text: |-
      Kentekens moeten zijn aangebracht op kentekenplaten in zwarte, onuitwisbare tekens op retroreflecterende
      achtergrond, volgens de modellen 27.1A tot en met 27.2H, 27.10A tot en met 27.26E, 30.1A tot en met 30.2D en 30.5
      tot en met 30.16 van de bijlage. De kleur van de achtergrond is geel voor de modellen 27.1A tot en met 27.2H,
      27.10A tot en met 27.10E en 30.1A tot en met 30.2D, lichtgroen voor de modellen 27.11 tot en met 27.14, 30.5 en
      30.6 en wit voor de modellen 27.15A tot en met 27.26E en 30.7 tot en met 30.16. De kleur van de rand in de modellen
      27.1A tot en met 27.2H, 27.10A tot en met 27.13, 27.15A tot en met 27.17E, 27.24A tot en met 27.26E, 30.1A tot en
      met 30.2D, 30.5 tot en met 30.8 en 30.13 tot en met 30.16 is zwart. De kentekenplaten volgens de modellen 27.18
      tot en met 27.20 en 30.9 tot en met 30.12 mogen zijn voorzien van een zwarte rand. De in dit lid genoemde kleuren
      moeten voldoen aan de [Regeling eisen goedkeuring kentekenplaten 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012172
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012172
  - number: '3.2'
    text: 'In afwijking van het bepaalde in het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel3
  - number: 3.2.a
    text: 'mogen kentekens zijn aangebracht op kentekenplaten in witte, onuitwisbare tekens op donkerblauwe achtergrond:'
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel3
  - number: 3.2.a.1°
    text: |-
      volgens de modellen 1.1 tot en met 10.1 van de bijlage voor voertuigen die voor 1 januari 1977 in gebruik zijn
      genomen en waarvoor, voor wat betreft de modellen 1.1, 2.1, 3.1 en 4.1 van de bijlage, geen kenteken is opgegeven
      dat bestaat uit twee groepen van twee letters en één groep van twee cijfers, dan wel één groep van twee letters,
      één groep van drie cijfers en één letter of één groep van twee cijfers, één groep van drie letters en één cijfer en
      waarvoor, voor wat betreft de modellen 8.1, 9.1 en 10.1 van de bijlage een kenteken bevattende de lettergroep AA,
      CDJ of vóór 1 februari 1991 een kenteken bevattende de lettergroep CD is opgegeven;
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel3
  - number: 3.2.a.2°
    text: |-
      volgens de modellen 11.1 tot en met 17.3 van de bijlage voor voertuigen die voor 1 januari 1978 in gebruik zijn
      genomen en waarvoor, voor wat betreft de modellen 11.1 en 12.1 van de bijlage, geen kenteken is opgegeven dat
      bestaat uit twee groepen van twee letters en één groep van twee cijfers dan wel één groep van twee letters, één
      groep van drie cijfers en één letter of één groep van twee cijfers, één groep van drie letters en één cijfer en
      waarvoor voor wat betreft de modellen 15.1 tot en met 17.3 van de bijlage een kenteken bevattende de lettergroep
      AA, CDJ of vóór 1 februari 1991 een kenteken bevattende de lettergroep CD is opgegeven;
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel3
  - number: 3.2.a.3°
    text: |-
      volgens model 18.1 van de bijlage voor voertuigen die voor 1 januari 1977 in gebruik zijn genomen en waarvoor geen
      kenteken is opgegeven dat bestaat uit twee groepen van twee letters en één groep van twee cijfers, dan wel één
      groep van twee letters, één groep van drie cijfers en één letter of één groep van twee cijfers, één groep van drie
      letters en één cijfer;
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel3
  - number: 3.2.b
    text: |-
      mogen kentekens zijn aangebracht op kentekenplaten volgens model 18.2A tot en met 18.2C van de bijlage, voor zover
      blijkens het kentekenregister voor het voeren van deze kentekenplaten toestemming is verleend. Deze kentekens
      moeten zijn aangebracht in:
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel3
  - number: 3.2.b.1º
    text: zwarte, onuitwisbare tekens op een retroreflecterende gele achtergrond dan wel
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel3
  - number: 3.2.b.2°
    text: |-
      Voor wat betreft motorrijtuigen die worden gebruikt voor taxivervoer in de zin van de
      [Wet personenvervoer 2000][ref1], in zwarte, onuitwisbare tekens op een retroreflecterende lichtblauwe achtergrond.
      Voor wat betreft voertuigen die vóór 1 januari 1978 in gebruik zijn genomen en waarvoor geen kenteken is opgegeven
      dat bestaat uit twee groepen van twee letters en één groep van twee cijfers, dan wel één groep van twee letters,
      één groep van drie cijfers en één enkele letter, of één groep van twee cijfers, één groep van drie letters en één
      enkel cijfer mogen deze kentekens in plaats van in zwarte, onuitwisbare tekens op een retrorefelecterende gele
      achtergrond, worden aangebracht in witte, onuitwisbare tekens op een donkerblauwe achtergrond. De kleuren geel,
      donkerblauw en lichtblauw moeten voldoen aan de [Regeling eisen goedkeuring kentekenplaten 2000][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0011470
      [ref2]: https://wetten.overheid.nl/BWBR0012172
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011470
      - id: ref2
        bwb_id: BWBR0012172
  - number: 3.2.c
    text: |-
      mag op een kentekenplichtige landbouw- en bosbouwtrekker die, een motorrijtuig met beperkte snelheid dat of een
      mobiele machine die in gebruik is genomen vóór 1 januari 1978 een kenteken zijn aangebracht op kentekenplaten in
      witte, onuitwisbare tekens op een donkerblauwe achtergrond volgens de modellen 1.1 tot en met 17.3 van de bijlage;
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel3
  - number: 3.2.d
    text: |-
      mag op een kentekenplichtige aanhangwagen die in gebruik is genomen voor 1 januari 1978, een kenteken zijn
      aangebracht op kentekenplaten in witte, onuitwisbare tekens op donkerblauwe achtergrond volgens de modellen
      1.1, 2.1, 8.1, 9.1, 10.1, 11.1, 12.1 en de modellen 15.1 tot en met 17.3 van de bijlage en volgens het model 4.1
      indien het betreft een kentekenplichtige aanhangwagen die wordt voortbewogen door een landbouw- of bosbouwtrekker,
      motorrijtuig met beperkte snelheid of mobiele machine;
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel3
  - number: 3.2.e
    text: |-
      dient voor zover een kentekenplaat volgens de modellen 27.1A tot en met 30.14 dient te zijn voorzien van een
      duplicaatcode deze te zijn aangebracht in zwarte onuitwisbare tekens.
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel3
  - number: '3.3'
    text: |-
      Met betrekking tot motorrijtuigen die voor 1 februari 2000 in gebruik zijn genomen
      mogen kentekens, niet zijnde handelaarskentekens of kentekens als bedoeld in
      [artikel 4, derde lid, onderdeel b, van het Kentekenreglement][ref1], in afwijking van het eerste lid zijn
      aangebracht op een gele achtergrond volgens de modellen 11.1, 12.1, 13.1, 14.1, en 18.1 van de bijlage en,
      voor zover het betreft kentekens behorende tot de lettergroep AA en CDJ alsmede vóór 1 februari 1991 opgegeven
      kentekens bevattende de lettergroep CD, volgens de modellen 15.1, 16.1, 17.1, 17.2 en 17.3 van de bijlage. Deze
      afwijkingsmogelijkheid geldt:


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel4
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '4'
  - number: 3.3.a
    text: |-
      voor APK-plichtige motorrijtuigen: tot de aanvang van de eerste periodieke keuring na 1 juni 2000, zulks
      onverminderd het zesde en zevende lid;.
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel3
  - number: 3.3.b
    text: 'voor niet APK-plichtige motorrijtuigen: tot 1 februari 2003.'
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel3
  - number: 3.4.a
    text: |-
      Op een niet-kentekenplichtige aanhangwagen en een aanhangwagen die voor 1 september 2002 in het verkeer is gebracht
      en waarvoor nog geen kenteken is opgegeven, mag tot 1 september 2003 het kenteken tevens zijn aangebracht op een
      kentekenplaat volgens een in het derde lid genoemd model.
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel3
  - number: 3.4.b
    text: |-
      Op een niet-kentekenplichtige aanhangwagen mag het kenteken slechts zijn aangebracht op een kentekenplaat in een
      kleur en volgens een model als genoemd in het tweede lid, onder a, indien het kenteken op het trekkend motorrijtuig
      op een kentekenplaat in dezelfde kleur is aangebracht.
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel3
  - number: 3.4.c
    text: |-
      Indien een niet-kentekenplichtige aanhangwagen wordt voortbewogen door een motorrijtuig dat moet worden voorzien
      van handelaarskentekenplaten, geldt deze verplichting ook voor die aanhangwagen, met dien verstande dat de
      kentekenplaat in afwijking van [artikel 7, eerste lid][ref1], aan de achterzijde van de aanhangwagen wordt
      aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0009071#Artikel7
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009071
        artikel: '7'
  - number: 3.4.d
    text: |-
      Op een aanhangwagen mag het kenteken niet zijn aangebracht op een kentekenplaat volgens het model 18.2A tot en met
      18.2E van de bijlage.
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel3
  - number: '3.5'
    text: |-
      In afwijking van het eerste en derde lid moeten kentekens die zijn opgegeven voor motorrijtuigen die op of na 1
      juli 2000 voor de eerste keer worden gebruikt voor taxivervoer in de zin van de [Wet personenvervoer 2000][ref1],
      zijn aangebracht op kentekenplaten in zwarte, onuitwisbare tekens op retroreflecterende achtergrond, volgens de
      modellen 27.30A tot en met 27.31C, onverminderd het bepaalde in het tweede lid, onderdeel b, aanhef en onder 2°.
      De kleur van de achtergrond is lichtblauw. De kleur van de rand is zwart. De in dit lid genoemde kleuren moeten
      voldoen aan de [Regeling eisen goedkeuring kentekenplaten 2000][ref2]. Dit lid geldt niet voor motorrijtuigen die
      moeten zijn voorzien van kentekenplaten volgens de modellen 27.15A tot en met 27.16E van de bijlage.


      [ref1]: https://wetten.overheid.nl/BWBR0011470
      [ref2]: https://wetten.overheid.nl/BWBR0012172
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011470
      - id: ref2
        bwb_id: BWBR0012172
  - number: '3.6'
    text: |-
      Indien het kenteken van een motorrijtuig op meer dan drie wielen is aangebracht op een kentekenplaat volgens
      het model 18.2A tot en met 18.2E of 27.15A tot en met 27.16E van de bijlage, is het motorrijtuig aan de voor- en
      achterzijde voorzien van een kentekenplaat volgens hetzelfde model dan wel, voor wat betreft de modellen 27.15A tot
      en met 27.16E, van een kentekenplaat volgens één van deze modellen.
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel3
  - number: '3.7'
    text: |-
      In afwijking van de voorgaande leden moeten kentekens welke zijn opgegeven voor bromfietsen die geconstrueerd
      zijn voor een maximumsnelheid van ten hoogste 25 km/h niet zijnde speed-pedelecs, als bedoeld in
      [artikel 1, eerste lid, van het Reglement verkeersregels en verkeerstekens 1990][ref1] zijn aangebracht op
      kentekenplaten in witte, onuitwisbare tekens op retroreflecterende achtergrond, volgens de modellen 30.3A tot en
      met 30.4D en 31.1 en 31.5 van de bijlage. De kleur van de achtergrond is lichtblauw. De kleur van de rand is wit.
      De in dit lid genoemde kleuren moeten voldoen aan de [Regeling eisen goedkeuring kentekenplaten 2000][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0012172
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004825
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0012172
  - number: '4.1'
    text: |-
      Indien het kenteken bestaat uit twee groepen van twee cijfers voorafgegaan door één letter of één groep van twee
      letters, wordt de letter of lettergroep voor of in het midden boven de cijfergroepen geplaatst.
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel4
  - number: '4.2'
    text: |-
      Indien het kenteken bestaat uit twee groepen van twee cijfers gevolgd door één letter of één groep van twee
      letters, wordt de letter of lettergroep achter of in het midden onder de cijfergroepen geplaatst.
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel4
  - number: '4.3'
    text: |-
      Indien het kenteken bestaat uit twee groepen van twee cijfers gescheiden door één letter of één groep van twee
      letters wordt de letter of lettergroep geplaatst tussen de cijfergroepen of links naast de tweede cijfergroep. In
      het laatste geval wordt de eerste cijfergroep in het midden boven de letter of lettergroep en de tweede cijfergroep
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel4
  - number: '4.4'
    text: |-
      Indien het kenteken bestaat uit twee groepen van twee letters en één groep van twee cijfers, worden de groepen
      achter elkaar geplaatst of wordt de eerste groep in het midden boven de twee andere groepen geplaatst.
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel4
  - number: '4.5'
    text: |-
      Indien het kenteken bestaat uit twee groepen van twee cijfers en één groep van twee letters of uit twee groepen van
      twee letters en één groep van twee cijfers, wordt het kenteken, indien dit wordt aangebracht op een kentekenplaat
      volgens model 18.1 van de bijlage, gesplitst in twee groepen van drie tekens, waarbij de eerste groep tekens boven
      de tweede groep tekens wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel4
  - number: '4.6'
    text: |-
      Indien het kenteken bestaat uit de lettergroepen AA of CD en één groep van ten hoogste drie cijfers, wordt de
      lettergroep voor of in het midden boven de cijfergroep geplaatst. Indien dit kenteken voor een bromfiets is
      opgegeven, wordt de lettergroep rechts boven de cijfergroep geplaatst.
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel4
  - number: '4.7'
    text: |-
      Indien het kenteken bestaat uit de lettergroep CDJ en één groep van ten hoogste drie cijfers, wordt de lettergroep
      voor of in het midden boven de cijfergroep geplaatst dan wel, indien het een kenteken betreft dat vóór 1 februari
      1991 is opgegeven, worden de letters CD voor de letter A of J en de cijfergroep of in het midden boven de letter A
      of J en de cijfergroep geplaatst. Indien dit kenteken voor een bromfiets is opgegeven wordt de lettergroep boven de
      cijfergroep geplaatst.
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel4
  - number: '4.8'
    text: |-
      Indien het kenteken bestaat uit twee groepen van drie letters en cijfers of een combinatie daarvan, wordt de eerste
      groep van drie tekens voor of boven de tweede groep van drie tekens geplaatst.
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel4
  - number: '4.9'
    text: |-
      Indien het kenteken bestaat uit één groep van twee letters, één groep van drie cijfers en één letter, dan wel één
      groep van twee cijfers, één groep van drie letters en één cijfer:
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel4
  - number: 4.9.a
    text: worden de groepen en de enkele letter of het enkele cijfer achter elkaar geplaatst;
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel4
  - number: 4.9.b
    text: |-
      wordt de eerste groep van twee letters dan wel twee cijfers in het midden boven de groep van drie cijfers en de
      enkele letter, dan wel de groep van drie letters en het enkele cijfer geplaatst;
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel4
  - number: 4.9.c
    text: |-
      wordt de eerste enkele letter dan wel het eerste enkele cijfer tezamen met de eerste letter van de groep van drie
      letters dan wel met het eerste cijfer van de groep van drie cijfers in het midden boven de overige twee letters
      uit de groep van drie letters dan wel de overige twee cijfers uit de groep van drie cijfers en de groep van twee
      letters dan wel de groep van twee cijfers geplaatst;
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel4
  - number: 4.9.d
    text: |-
      wordt op een kenteken opgegeven voor een bromfiets de eerste enkele letter dan wel het eerste enkele cijfer tezamen
      met de eerste twee cijfers van de groep van drie cijfers dan wel de eerste twee letters van de groep van drie
      letters boven de laatste letter uit de groep van drie letters dan wel het laatste cijfer uit de groep van drie
      cijfers en de groep van twee letters dan wel de groep van twee cijfers geplaatst, of
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel4
  - number: 4.9.e
    text: |-
      wordt op een kenteken opgegeven voor een bromfiets de eerste groep van twee letters dan wel twee cijfers tezamen
      met het eerste cijfer van de groep van drie cijfers dan wel de eerste letter van de groep van drie letters boven de
      laatste twee cijfers uit de groep van drie cijfers dan wel de laatste twee letters uit de groep van drie letters en
      het enkele cijfer dan wel de enkele letter geplaatst.
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel4
  - number: '4.10'
    text: |-
      Indien het kenteken bestaat uit de lettergroep BN of GN en twee groepen van twee cijfers en het kenteken voor een
      bromfiets is opgegeven, wordt de lettergroep tezamen met het eerste cijfer van de eerste groep van twee cijfers
      boven het laatste cijfer van de eerste groep van twee cijfers en de laatste groep van twee cijfers geplaatst.
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel4
  - number: '4.11'
    text: |-
      Indien het kenteken bestaat uit de lettergroep HC en twee groepen van twee cijfers wordt de lettergroep tezamen
      met het eerste cijfer van de eerste groep van twee cijfers boven het laatste cijfer van de eerste groep van twee
      cijfers en de laatste groep van twee cijfers geplaatst.
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel4
  - number: '4.12'
    text: |-
      Indien het kenteken bestaat uit de enkele letter A, E, H, K, L, N, P, S, T, V, W, X, of Z en twee groepen van twee
      cijfers en het kenteken is voor een bromfiets opgegeven, wordt de enkele letter tezamen met het eerste cijfer van
      de eerste groep van twee cijfers boven het laatste cijfer van de eerste groep van twee cijfers en laatste groep van
      twee cijfers geplaatst.
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel4
  - number: '4.13'
    text: |-
      Indien het kenteken bestaat uit één groep van drie letters, één groep van twee cijfers en één letter, dan wel één
      groep van drie cijfers, één groep van twee letters en één cijfer:
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel4
  - number: 4.13.a
    text: worden de groepen en de enkele letter dan wel het enkele cijfer achter elkaar geplaatst;
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel4
  - number: 4.13.b
    text: |-
      wordt de enkele letter dan wel het enkele cijfer na de groep van drie letters en de groep van twee cijfers dan wel
      na de groep van drie cijfers en de groep van twee letters geplaatst of wordt de enkele letter dan wel het enkele
      cijfer voor de groep van twee cijfers en drie letters dan wel voor de groep van twee letters en drie cijfers
      geplaatst;
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel4
  - number: 4.13.c
    text: |-
      wordt de eerste groep van drie letters dan wel de eerste groep van drie cijfers midden boven de groep met twee
      cijfers tezamen met de enkele letter dan wel midden boven de groep van twee letters tezamen met het enkele cijfer
      geplaatst;
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel4
  - number: 4.13.d
    text: |-
      wordt de eerste enkele letter dan wel het eerste enkele cijfer tezamen met de groep van twee cijfers dan wel met
      de groep van twee letters midden boven de groep van drie letters dan wel midden boven de groep van drie cijfers
      geplaatst;
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel4
  - number: 4.13.e
    text: |-
      wordt voor een kenteken opgeven voor een bromfiets de groep van drie letters dan wel de groep van drie cijfers
      boven de groep van twee cijfers tezamen met de enkele letter dan wel boven de groep van twee letters tezamen met
      het enkele cijfer geplaatst.
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel4
  - number: '5.1'
    text: Kentekenplaten zijn voorzien van een merk volgens model M.3 van de bijlage.
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel5
  - number: '5.2'
    text: |-
      In afwijking van het eerste lid zijn kentekenplaten voorzien van een merk overeenkomstig
      [artikel 5, eerste en tweede lid][ref1], zoals die artikelleden luidden vóór de inwerkingtreding van deze regeling,
      indien:


      [ref1]: https://wetten.overheid.nl/BWBR0009071#Artikel5
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009071
        artikel: '5'
  - number: 5.2.a
    text: zij zijn afgegeven vóór 1 februari 2000;
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel5
  - number: 5.2.b
    text: het model 18.2 betreft voor motorrijtuigen die vóór 31 augustus 2002 in gebruik zijn genomen.
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel5
  - number: '5.3'
    text: |-
      De kentekenplaten volgens de modellen 27.24A tot en met 27.26E en de modellen 30.13 en 30.14 mogen worden gebruikt
      voor motorrijtuigen die overeenkomstig [artikel 31 tot en met 33 van het Kentekenreglement][ref1] voorgoed buiten
      Nederland worden gebracht en waarvoor overeenkomstig [artikel 17, tweede lid van het Kentekenreglement][ref2] een
      kentekenbewijs deel II is uitgereikt. De kentekenplaten mogen zijn voorzien van een zwarte rand en behoeven niet te
      zijn voorzien van een Europees embleem en landenindicator en behoeven niet te behoren tot een goedgekeurde soort.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel17
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '31'
      - id: ref2
        bwb_id: BWBR0006951
        artikel: '17'
  - number: '5.4'
    text: |-
      Het door de lamineerder, bedoeld in [artikel 1 van de Regeling erkenningen wegverkeer][ref1], aan te brengen
      waarmerk is volgens model M3, met dien verstande, dat er slecht vier cijfers in zijn opgenomen, beginnend met een
      3. Het door de foliefabrikant, bedoeld in [artikel 1 van de Regeling erkenningen wegverkeer][ref2], aan te brengen
      waarmerk is volgens model M3, met dien verstande, dat er slechts vier cijfers in zijn opgenomen, beginnend met
      een 2.


      [ref1]: https://wetten.overheid.nl/BWBR0051669#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0051669#Artikel1
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0051669
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0051669
        artikel: '1'
  - number: '6.1'
    text: |-
      Op de donkerblauwe of groene achtergrond van een kentekenplaat volgens de modellen 1.1 tot en met 10.1 van de
      bijlage mag niets anders voorkomen dan het kenteken, het Rijkskeurmerk, het keurmerk van de erkende of gemachtigde
      kentekenplaatfabrikant en de waarmerken van de erkende of gemachtigde foliefabrikant en lamineerder. Voor zover het
      betreft een kentekenplaat volgens de modellen 5.1, 6.1 en 7.1 van de bijlage mogen voorts in witte cijfers op rode
      achtergrond de laatste twee cijfers van het jaartal voorkomen dat het jaar aangeeft waarin de tenaamstelling in het
      kentekenregister vervalt.
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel6
  - number: '6.2'
    text: |-
      Op de donkerblauwe, groene of gele achtergrond van een kentekenplaat volgens de modellen 11.1 tot en met
      18.2E van de bijlage mag niets anders voorkomen dan het kenteken, het keurmerk van de erkende of gemachtigde
      kentekenplaatfabrikant en de waarmerken van de erkende of gemachtigde foliefabrikant en lamineerder. Voor zover
      het betreft een kentekenplaat volgens de modellen 13.1 en 14.1 van de bijlage mogen voorts in witte dan wel
      gele retroflecterende cijfers op rode achtergrond de laatste twee cijfers van het jaartal voorkomen dat het
      jaar aangeeft waarin de tenaamstelling in het kentekenregister vervalt. Voor zover het betreft een kentekenplaat
      volgens het model 18.2A tot en met 18.2E van de bijlage met een gele dan wel lichtblauwe achtergrond is deze tevens
      voorzien van een unieke lamineercode volgens model E.
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel6
  - number: '6.3'
    text: |-
      Op de witte achtergrond van kentekenplaten volgens de modellen 11.1, 12.1, 18.1 en 19.1 tot en met 26.1 mag niets
      anders voorkomen dan het kenteken en het merk van de fabrikant. Op de achtergrond van een kentekenplaat volgens de
      modellen 27.1A tot en met 27.2H, 27.10A tot en met 27.26E, 27.30A tot en met 27.31E en 30.1 tot en met 30.16 van de
      bijlage mag niets anders voorkomen dan hetgeen is vermeld in die modellen, alsmede de waarmerken van de erkende of
      gemachtigde foliefabrikant en lamineerder. De kentekenplaten volgens de modellen 27.15A tot en met 27.17E, 30.7 en
      30.8 moeten zijn voorzien van een maandaanduiding, die uitsluitend mag bestaan uit het nummer van de lopende of de
      volgende maand.
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel6
  - number: '7.1'
    text: |-
      Bij motorrijtuigen op meer dan drie wielen, met uitzondering van bromfietsen, landbouw- en bosbouwtrekkers,
      motorrijtuigen met beperkte snelheid en mobiele machines, moeten de kentekenplaten zijn aangebracht aan de voor- en
      achterzijde van het motorrijtuig op de daartoe bestemde plaats.
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel7
  - number: '7.2'
    text: |-
      Bij motorrijtuigen op twee of drie wielen met of zonder zijspanwagen, met uitzondering van bromfietsen, moet de
      kentekenplaat zijn aangebracht aan de achterzijde van het motorrijtuig op de daartoe bestemde plaats.
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel7
  - number: '7.3'
    text: |-
      Bij aanhangwagens waarvoor een kenteken dient te zijn opgegeven moet de kentekenplaat zijn aangebracht aan de
      achterzijde van de aanhangwagen op de daartoe bestemde plaats.
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel7
  - number: '7.4'
    text: |-
      Bij bromfietsen, landbouw- en bosbouwtrekkers, motorrijtuigen met beperkte snelheid en mobiele machines moet de
      kentekenplaat zijn aangebracht aan de achterzijde van het motorrijtuig op de daartoe bestemde plaats.
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel7
  - number: '7.5'
    text: |-
      Bij aanhangwagens waarvoor het vereiste dat een kenteken dient te zijn opgegeven niet geldt, moet, indien de
      aanhangwagen is verbonden met een motorrijtuig, een kentekenplaat met het kenteken van het motorrijtuig dan
      wel, indien het een aanhangwagen als bedoeld in [artikel 37, tweede lid, onderdeel c, van de wet][ref1] betreft,
      een kenteken als bedoeld in dat onderdeel zijn aangebracht aan de achterzijde van de aanhangwagen op de daartoe
      bestemde plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel37
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '37'
  - number: '7.6'
    text: |-
      De kentekenplaat moet loodrecht op het verticale mediaanvlak van het voertuig zijn aangebracht en zich in verticale
      stand bevinden, met een tolerantie van 5%. Indien de vorm van het voertuig zulks vereist, mag de kentekenplaat
      evenwel de volgende helling ten opzichte van de verticale stand hebben:
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel7
  - number: 7.6.a
    text: |-
      indien de van het kenteken voorziene zijde van de kentekenplaat naar boven is gekeerd, een hoek van ten hoogste
      30°, mits de bovenrand van de kentekenplaat zich niet hoger dan 1.20 m boven het wegdek bevindt,
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel7
  - number: 7.6.b
    text: |-
      indien de van het kenteken voorziene zijde van de kentekenplaat naar beneden is gekeerd, een hoek van ten hoogste
      15°, mits de bovenrand van de kentekenplaat zich op een grotere hoogte dan 1.20 m boven het wegdek bevindt.
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel7
  - number: '7.7'
    text: |-
      Het kenteken dat aan de voorzijde is aangebracht moet van voren, het kenteken dat aan de achterzijde is
      aangebracht, moet van achteren zichtbaar zijn en mag niet hoger dan 4 m boven het wegdek zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel7
  - number: '7.8'
    text: 'De kentekenplaat moet zodanig op het motorrijtuig dan wel de aanhangwagen bevestigd, dat:'
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel7
  - number: 7.8.a
    text: |-
      de kentekenplaat en het kenteken aan de achterzijde van het voertuig over de volle, in de bijlage voorgeschreven,
      oppervlakte zichtbaar is voor een waarnemer, die zich op een afstand van 20 m midden achter het voertuig bevindt,
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel7
  - number: 7.8.b
    text: de karakters van het kenteken niet door de bevestigingsmiddelen zijn beschadigd, en
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel7
  - number: 7.8.c
    text: de kentekenplaat aan de achterzijde van het voertuig niet door glas of ander doorzichtig materiaal wordt bedekt.
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel7
  - number: '7.9'
    text: |-
      Aan of op het motorrijtuig, de aanhangwagen of de kentekenplaat mag geen teken of middel zijn aangebracht dat de
      herkenning, daaronder begrepen de herkenning met behulp van technische voorzieningen, van het kenteken bemoeilijkt
      of kan bemoeilijken.
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel7
  - number: '7.10'
    text: |-
      Het bepaalde in het achtste lid, onderdeel c, geldt niet voor voertuigen die voor 1 januari 1972 in gebruik zijn
      genomen, tenzij het kenteken op een retroflecterende plaat is aangebracht.
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel7
  - number: '7.11'
    text: |-
      In afwijking van het vierde lid wordt een kentekenplaat bij aangewezen bromfietsen als bedoeld in
      [artikel 20b van de wet][ref1], geplaatst op een door de Dienst Wegverkeer te bepalen plaats, indien plaatsing op
      de in het vierde lid genoemde plaats naar het oordeel van de Dienst Wegverkeer niet mogelijk is of leidt tot een
      verkeersonveilige situatie.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel20b
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 20b
  - number: '7.12'
    text: De Dienst Wegverkeer maakt aantekening in het kentekenregister van toepassing van het elfde lid.
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel7
  - number: '8'
    text: |-
      In afwijking van [artikel 3, eerste lid][ref1], mogen kentekens
      die zijn opgegeven voor het tijdstip van inwerkingtreding van de
      __REF001___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      _________ (Stb. 281), zijn aangebracht op kentekenplaten volgens model 18.2 of model 27.10 van de bijlage
      zoals deze bijlage luidde voor die datum, voor zover blijkens het kentekenregister voor het voeren van deze
      kentekenplaten toestemming is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0009071#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0018326
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0009071
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0018326
  - number: 8a
    text: |-
      In afwijking van [artikel 2, eerste lid][ref1], mogen de kentekenplaten van de modellen 27.10, 27.17, 27.20 en
      27.26 van de bijlage die zijn afgegeven voor 1 november 2011 zijn voorzien van de letter M van Model C.2 van de
      bijlage bij deze regeling zoals die luidde voor 1 november 2011.


      [ref1]: https://wetten.overheid.nl/BWBR0009071#Artikel2
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0009071
        artikel: '2'
  - number: '10'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel10
  - number: '11'
    text: 'Deze regeling wordt aangehaald als: Regeling kentekens en kentekenplaten.'
    url: https://wetten.overheid.nl/BWBR0009071/2026-01-01#Artikel11
