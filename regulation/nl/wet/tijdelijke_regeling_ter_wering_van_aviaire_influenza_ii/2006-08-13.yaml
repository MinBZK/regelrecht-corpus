  text: |-
    Gelet op artikel 17, eerste lid, van de Gezondheids- en welzijnswet voor dieren;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0018797/2006-08-13#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. pluimvee: gehouden dieren van een soort behorende tot de orde van de hoenderachtigen (Galliformes), tot de
      familie van de eenden, ganzen en zwanen (Anatidae), en de familie van de duiven (Columbidae);

      b. broedeieren: eieren van pluimvee, bestemd om te worden bebroed;

      c. vervoermiddel: voertuig, waaronder mede begrepen een combinatie van een voertuig met één of meer door dat
      voertuig voortbewogen aanhangwagens, opleggers of containers;

      d. VWA: Voedsel en Waren Autoriteit;

      e. dierentuin: dierentuin als bedoeld in artikel 2, onderdeel a, onder i, van beschikking 2005/744/EG van de
      Commissie van de Europese Gemeenschappen van 21 oktober 2005 tot vaststelling van voorschriften voor de preventie
      van hoogpathogene aviaire influenza, veroorzaakt door influenza A-virus subtype H5N1, bij gevoelige vogels in
      dierentuinen in de lidstaten (PbEU L279);

      f. beschikking 2005/734/EG: beschikking 2005/734/EG van de Commissie van de Europese Gemeenschappen van 19 oktober
      2005 tot vaststelling van bioveiligheidsmaatregelen ter beperking van het risico van overdracht van hoogpathogene
      aviaire influenza, veroorzaakt door het influenza A-virus subtype H5N1, van in het wild levende vogels naar
      pluimvee en andere in gevangenschap gehouden vogels en tot instelling van een systeem voor vroege opsporing in
      risicogebieden (PbEU L274);

      g. [richtlijn 2005/94/EG](32005L0094): [Richtlijn 2005/94/EG](32005L0094) van de Raad van 20 december 2005
      betreffende communautaire maatregelen ter bestrijding van aviaire influenza en tot intrekking van [Richtlijn 92/40]
      (31992L0040) (PbEG L10).
    url: https://wetten.overheid.nl/BWBR0018797/2006-08-13#Artikel1
  - number: '2'
    text: |-
      1 Deze regeling is niet van toepassing op het houden van fazanten.

      2 De [artikelen 4a tot en met 5c][ref1] zijn niet van toepassing op pluimvee, gehouden in dierentuinen.


      [ref1]: https://wetten.overheid.nl/BWBR0018797#Artikel5
