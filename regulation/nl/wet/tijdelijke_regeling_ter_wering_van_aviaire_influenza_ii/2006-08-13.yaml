  - number: 5a
    text: |-
      1 Een vervoermiddel dat kennelijk is gebruikt voor het vervoeren van levend pluimvee of broedeieren in derde landen,
      alsmede in lidstaten van de Europese Unie waar een uitbraak van hoogpathogene Aviaire Influenza is bevestigd, en
      vanuit deze derde landen of lidstaten, anders dan in doorvoer leeg in Nederland wordt gebracht, wordt gereinigd
      en ontsmet op een reinigings- en ontsmettingsplaats voor vervoermiddelen die is geregistreerd overeenkomstig
      __REF000___________________________________________________________________________________________________________
      __________. De vervoerder overlegt binnen 24 uur na binnenkomst in Nederland aan de VWA een bewijs van de reiniging
      en ontsmetting.

      2 Voor de werking van dit artikel wordt onder een uitbraak van hoogpathogene Aviaire Influenza in een lidstaat
      niet verstaan een uitbraak in een circus, een dierentuin, een vogelwinkel, een wildpark, een omheind terrein waar
      pluimvee voor wetenschappelijke doeleinden of met het oog op de bescherming van zeldzame pluimveerassen wordt
      gehouden, zoals bedoeld in artikel 13, eerste lid, van [richtlijn 2005/94/EG](32005L0094).

      3 Het bewijs van de reiniging en ontsmetting, bedoeld in het eerste lid, dient in ieder geval een datum, tijdstip
      van reiniging en ontsmetting en kenteken van het gereinigde vervoermiddel te bevatten en is te allen tijde in het
      vervoermiddel aanwezig.

      4 De reiniging en ontsmetting, bedoeld in het eerste lid, geschiedt overeenkomstig
      __REF000___________________________________________________________________________________________________________
      __________.

      5 In afwijking van het eerste lid, is het toegestaan vervoermiddelen te reinigen en te ontsmetten op andere
      plaatsen dan die, bedoeld in het eerste lid, indien deze plaatsen zodanig zijn ingericht en uitgerust dat de
      reiniging en ontsmetting met het oog op de wering van Aviaire Influenza op adequate wijze plaatsvinden.

      6 De plaatsen, bedoeld in het vierde lid, worden door de minister geregistreerd
      nadat is gebleken dat aan de voorwaarden, genoemd in het vierde lid, is voldaan.
      __REF000___________________________________________________________________________________________________________
      _______________________________________, is van overeenkomstige toepassing.


