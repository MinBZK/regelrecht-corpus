  - number: '3'
    text: |-
      1 Het is verboden pluimvee te houden.

      2 Het verbod, bedoeld in het eerste lid, is niet van toepassing indien wordt voldaan aan deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0018797/2006-08-13#Artikel3
  - number: 4a
    text: |-
      1 De houder van bedrijfsmatig gehouden pluimvee draagt ervoor zorg dat:

      a. voedsel en water aan het pluimvee wordt verstrekt in een ruimte die ten minste aan de bovenzijde ondoorlaatbaar
      is afgedekt, en

      b. het pluimvee geen water krijgt dat afkomstig is van oppervlaktewateren waartoe in het wild levende vogels
      toegang hebben, tenzij dat water behandeld is om eventueel aanwezig virus te inactiveren.

      2 De houder die bedrijfsmatig zowel eenden of ganzen als ander pluimvee houdt, neemt passende maatregelen om te
      voorkomen dat zijn eenden of ganzen in contact komen met het andere pluimvee.
    url: https://wetten.overheid.nl/BWBR0018797/2006-08-13#Artikel4a
  - number: 4b
    text: |-
      1 In afwijking van de
      __REF000___________________________________________________________________________________________________________
      __________________________ is het verboden pluimvee of loopvogels tijdelijk te verzamelen.

      2 Het eerste lid is niet van toepassing op het verzamelen van in Nederland gehouden postduiven ten behoeve van
      wedvluchten binnen Nederland en wedvluchten vanuit België naar Nederland.

      3 Op aanvraag van de organisator van een wedvlucht, cultureel evenement, tentoonstelling of keuring of de persoon
      die, anders dan ten behoeve van een markt waar pluimvee of loopvogels worden verhandeld, deze dieren tijdelijk
      wil verzamelen, kan de VWA, namens de Minister, met inachtneming van artikel 2bis, tweede lid, van beschikking
      2005/734/EG, ontheffing verlenen van het verbod, bedoeld in het eerste lid.

      4 De ontheffing, bedoeld in het derde lid, wordt in ieder geval niet verleend indien de aanvraag niet ten minste 8
      dagen van tevoren bij de VWA is ingediend.

      5 Aan de ontheffing, bedoeld in het derde lid, zijn in ieder geval de volgende voorwaarden verbonden:

      a. de dieren worden, alvorens deze worden toegelaten bij de plaats van aanvoer, op de kosten van de organisator of
      de persoon die tijdelijk dieren wil verzamelen, onderzocht door één of meer dierenartsen, en

      b. voor zover het een tentoonstelling of keuring betreft worden slechts pluimvee of
      loopvogels toegelaten die vergezeld gaan van een op hen betrekking hebbende, volledig
      ingevulde en ondertekende verklaring van enting tegen Newcastle Disease zoals bedoeld in
      __REF000___________________________________________________________________________________________________________
      _______________________.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel45
