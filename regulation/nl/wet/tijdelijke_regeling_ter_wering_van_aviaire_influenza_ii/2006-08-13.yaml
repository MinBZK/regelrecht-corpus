  - number: 5b
    text: |-
      1 Het is verboden een vervoermiddel als bedoeld in [artikel 5a, eerste lid][ref1], dat in een derde land is
      gebruikt om levend pluimvee of broedeieren te vervoeren, alsmede in lidstaten van de Europese Unie waar een
      uitbraak van hoogpathogene Aviaire Influenza is bevestigd, vanuit deze derde landen en lidstaten, anders dan in
      doorvoer, leeg in Nederland te brengen.

      2 Het verbod in het eerste lid is niet van toepassing indien wordt voldaan aan het bepaalde in [artikel 5a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018797#Artikel5a
