  - number: 5c
    text: |-
      1 In afwijking van [artikel 50, eerste lid, onderdelen d en e, van de Flora- en Faunawet][ref1], is het gebruik
      van eenden als lokvogels als middel tot jagen verboden in gebieden met een hoog risico op insleep van hoogpathogene
      Aviaire Influenza.

      2 Als gebieden met een hoog risico op insleep van hoogpathogene Aviaire Influenza worden aangemerkt de gebieden
      gelegen in of in de nabijheid van gebieden, bedoeld in [artikel 4, tweede lid][ref2].

      3 Het verbod, bedoeld in het eerste lid, is niet van toepassing op de kooiker die staat geregistreerd als
      deelnemer aan het programma van monitoring, bedoeld in beschikking nr. 2005/732/EG van de Commissie van de
      Europese Gemeenschappen van 17 oktober 2005 tot goedkeuring van de programma's voor het uitvoeren van onderzoek
      naar aviaire influenza bij pluimvee en bij in het wild levende vogels in 2005 in de lidstaten en tot vaststelling
      van rapporterings- en subsidiabiliteitsregels voor de financiële bijdrage van de Gemeenschap in de kosten voor de
      uitvoering van deze programma’s (PbEU L 274) indien hij gebruik maakt van een geregistreerde eendenkooi als bedoeld
      in [artikel 56 Flora- en Faunawet][ref3].


