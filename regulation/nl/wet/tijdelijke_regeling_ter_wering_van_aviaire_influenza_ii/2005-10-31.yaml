  - number: '5'
    text: |-
      De houder van pluimvee draagt ervoor zorg dat de dieren bij het verplaatsen niet in contact komen met trekvogels of
      hun uitwerpselen.
    url: https://wetten.overheid.nl/BWBR0018797/2005-10-31#Artikel5
  - number: 5a
    text: |-
      1 Een vervoermiddel dat kennelijk is gebruikt voor het vervoeren van levend pluimvee of broedeieren in derde landen,
      alsmede in lidstaten van de Europese Unie waar een uitbraak van hoogpathogene Aviaire Influenza is bevestigd, en
      vanuit deze derde landen of lidstaten, anders dan in doorvoer leeg in Nederland wordt gebracht, wordt gereinigd
      en ontsmet op een reinigings- en ontsmettingsplaats voor vervoermiddelen die is geregistreerd overeenkomstig
      __REF000___________________________________________________________________________________________________________
      __________. De vervoerder overlegt binnen 24 uur na binnenkomst in Nederland aan de VWA een bewijs van de reiniging
      en ontsmetting.

      2 Het bewijs van de reiniging en ontsmetting, bedoeld in het eerste lid, dient in ieder geval een datum, tijdstip
      van reiniging en ontsmetting en kenteken van het gereinigde vervoermiddel te bevatten en is te allen tijde in het
      vervoermiddel aanwezig.

      3 De reiniging en ontsmetting, bedoeld in het eerste lid, geschiedt overeenkomstig
      __REF000___________________________________________________________________________________________________________
      __________.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel78
      [ref2]: https://wetten.overheid.nl/BWBR0018397
