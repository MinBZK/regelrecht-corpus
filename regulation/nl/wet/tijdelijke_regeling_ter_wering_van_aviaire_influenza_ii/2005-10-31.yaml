  text: |-
    Gelet op artikel 17, eerste lid, van de Gezondheids- en welzijnswet voor dieren;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0018797/2005-10-31#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. pluimvee: gehouden dieren van een soort behorende tot de orde van de hoenderachtigen (Galliformes), tot de
      familie van de eenden, ganzen en zwanen (Anatidae), en voor consumptie gehouden duiven (Columba livia);

      b. broedeieren: eieren van pluimvee, bestemd om te worden bebroed;

      c. vervoermiddel: voertuig, waaronder mede begrepen een combinatie van een voertuig met één of meer door dat
      voertuig voortbewogen aanhangwagens, opleggers of containers;

      d. VWA: Voedsel en Warenautoriteit.
    url: https://wetten.overheid.nl/BWBR0018797/2005-10-31#Artikel1
  - number: '2'
    text: |-
      Deze regeling is niet van toepassing op het houden van:

      a. fazanten;

      b. niet-bedrijfsmatig gehouden pluimvee dat wordt gehouden binnen de bebouwde kom;

      c. pluimvee, gehouden in dierentuinen als bedoeld in het [Dierentuinenbesluit][ref1];

      d. siervogels, niet zijnde sierpluimvee.


      [ref1]: https://wetten.overheid.nl/BWBR0013625
    url: https://wetten.overheid.nl/BWBR0018797/2005-10-31#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0013625
  - number: '3'
    text: |-
      1 Het is verboden pluimvee te houden.

      2 Het verbod, bedoeld in het eerste lid, is niet van toepassing indien wordt voldaan aan deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0018797/2005-10-31#Artikel3
  - number: '4'
    text: |-
      1 De houder van pluimvee maakt een analyse van het aanwezige risico dat de door hem gehouden dieren in contact
      komen met trekvogels of hun uitwerpselen.

      2 Het risico, bedoeld in het eerste lid, is in ieder geval als hoog aan te merken als het bedrijf van de houder,
      dan wel de locatie waar de houder zijn pluimvee houdt, is gelegen in de nabijheid van foerageergebieden van
      trekvogels en watergebieden. Er is ten minste sprake van een laag risico.

      3 De houder van pluimvee neemt op basis van de analyse, bedoeld in het eerste lid, en met inachtneming van het
      tweede lid, passende maatregelen om zo veel mogelijk te voorkomen dat de door hem gehouden dieren in contact komen
      met trekvogels of hun uitwerpselen.

      4 De verplichting tot het nemen van passende maatregelen als bedoeld in het derde lid, geldt niet voor de houder
      van niet-bedrijfsmatig gehouden pluimvee dat wordt gehouden op een locatie waar het risico, bedoeld in het eerste
      lid, en met inachtneming van het tweede lid, niet als hoog wordt aangemerkt..
    url: https://wetten.overheid.nl/BWBR0018797/2005-10-31#Artikel4
  - number: 4a
    text: |-
      1 De houder die bedrijfsmatig zowel eenden of ganzen als ander pluimvee houdt, neemt passende maatregelen om te
      voorkomen dat zijn eenden of ganzen in contact komen met het andere pluimvee.

      2 De houder van bedrijfsmatig gehouden pluimvee bij wie het risico, bedoeld in [artikel 4, eerste lid][ref1], als
      hoog wordt aangemerkt draagt ervoor zorg dat:

      a. de voorziening van voedsel en water van het pluimvee plaatsvindt in een ruimte die ten minste aan de bovenzijde
      ondoorlaatbaar is afgedekt; en

      b. het pluimvee geen water krijgt dat afkomstig is van oppervlaktewateren waartoe in het wild levende vogels
      toegang hebben, tenzij dat water behandeld is om eventueel aanwezig virus te inactiveren.


      [ref1]: https://wetten.overheid.nl/BWBR0018797#Artikel4
    url: https://wetten.overheid.nl/BWBR0018797/2005-10-31#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0018797
        artikel: '4'
        paragraaf: '2'
  - number: 4b
    text: |-
      1 In afwijking van de
      __REF000___________________________________________________________________________________________________________
      __________________________ is het verboden pluimvee, loopvogels of postduiven tijdelijk te verzamelen.

      2 Op aanvraag van de organisator van een wedvlucht, cultureel evenement, tentoonstelling of keuring of de persoon
      die anders dan ten behoeve van een markt waar pluimvee, loopvogels of postduiven worden verhandeld deze dieren
      tijdelijk wil verzamelen, kan de VWA, namens de Minister, met inachtneming van artikel 2bis, tweede lid, van
      beschikking 2005/734/EG tot vaststelling van bioveiligheidsmaatregelen ter beperking van het risico van overdracht
      van hoogpathogene aviaire influenza, veroorzaakt door het Influenza virus A subtype H5N1, van in het wild levende
      vogels naar pluimvee en andere in gevangenschap gehouden vogels en tot instelling van een systeem voor vroege
      opsporing in risicogebieden (PbEU L 274), zoals gewijzigd bij beschikking 2005/734/EG (PbEU L 279), ontheffing
      verlenen van het verbod, bedoeld in het eerste lid.

      3 De ontheffing, bedoeld in het tweede lid, wordt in ieder geval niet verleend indien de aanvraag niet ten
      minste 8 dagen van tevoren bij de VWA is ingediend. Een melding gedaan voor 31 oktober 2005 op grond van
      __REF000___________________________________________________________________________________________________________
      __________ geldt als een aanvraag als bedoeld in het tweede lid.

      4 Aan de ontheffing zijn in ieder geval de volgende voorwaarden verbonden:

      a. de dieren worden, alvorens deze worden toegelaten bij de plaats van aanvoer, op de kosten van de organisator of
      de persoon die tijdelijk dieren wil verzamelen, onderzocht door één of meer dierenartsen; en

      b. voor zover het een tentoonstelling of keuring, dan wel een wedvlucht betreft worden slechts
      pluimvee, loopvogels of postduiven toegelaten die vergezeld gaan van een op hen betrekking hebbende,
      volledig ingevulde en ondertekende verklaring van enting tegen Newcastle Disease zoals bedoeld in
      __REF000___________________________________________________________________________________________________________
      _______________________.


