      1 Het is verboden om levende aquacultuurdieren die gevoelig zijn voor één of meer van de in bijlage IV, deel II,
      van [richtlijn nr. 2006/88/EG](32006L0088) vermelde niet-exotische ziekten, of de producten daarvan, op de plaats
      van verwerking op te slaan wanneer deze in de handel worden gebracht voor verdere verwerking in een lidstaat,
      respectievelijk een gebied of een compartiment:

      a. die op grond van artikel 49 van [richtlijn nr. 2006/88/EG](32006L0088), respectievelijk dat op grond van
      [artikel 3.1.1][ref1], vrij is verklaard van desbetreffende ziekte of ziekten, of

      b. waar een bewakings- of uitroeiingsprogramma als bedoeld in artikel 44 van [richtlijn nr. 2006/88/EG](32006L0088)
      geldt voor de betreffende ziekte of ziekten.

      2 Het is verboden om levende weekdieren en schaaldieren die gevoelig zijn voor één of meer van de in bijlage
      IV, deel II, van [richtlijn nr. 2006/88/EG](32006L0088) vermelde ziekten, in wateren uit te zetten of in
      verzendingscentra, zuiveringscentra of soortgelijke bedrijven binnen te brengen.

      3 De verboden, bedoeld in het eerste en tweede lid, zijn niet van toepassing indien de dieren of producten daarvan:

      a. afkomstig zijn uit een lidstaat die, of een gebied of compartiment dat, op grond van artikel 49, of artikel
      50, van [richtlijn nr. 2006/88/EG](32006L0088), respectievelijk [artikel 3.1.1][ref2], vrij is verklaard van de
      betreffende ziekte of ziekten, of

      b. tijdelijk in verzendingscentra, zuiveringscentra of soortgelijke bedrijven worden gehouden die over systemen
      voor de behandeling van effluenten beschikken waarmee de desbetreffende pathogenen geïnactiveerd worden of waar de
      effluenten andere behandelingen ondergaan, waardoor het risico van overdracht van de betreffende ziekte of ziekten
      naar de natuurlijke wateren tot een aanvaardbaar niveau wordt teruggebracht.


