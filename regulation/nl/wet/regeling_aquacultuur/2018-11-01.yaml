  - number: 7.3.9
    text: |-
      1 Indien wordt vermoed of geconstateerd dat in de partij producten van aquacultuurdieren verwekkers van ziekten,
      zoönosen of andere aandoeningen aanwezig zijn, of dat de partij afkomstig is uit een met een epidemische dierziekte
      besmet gebied, kan de Minister gelasten dat de partij, voor rekening van de verzender of diens gemachtigde, dan
      wel de afnemer, in tijdelijke afzondering wordt geplaatst, indien hij de aanwezigheid van verwekkers van ziekten,
      zoönosen of andere aandoeningen vermoedt, dan wel wordt de partij, zonder vergoeding van Staatswege en:

      a. voor rekening van de verzender of diens gemachtigde, al naar gelang de Minister daaromtrent heeft besloten en
      met inachtneming van diens aanwijzingen, vernietigd, of

      b. voor rekening van de afnemer, al naar gelang de Minister daaromtrent heeft besloten en met inachtneming van
      diens aanwijzingen, voor andere doeleinden gebruikt dan waarvoor ze is bestemd.

      2 Indien aan de hand van de op grond van deze regeling uitgevoerde controles wordt vastgesteld dat een voor
      Nederland of een lidstaat bestemd product niet voldoet aan de op grond van deze regeling voor dat product gestelde
      voorschriften of dat een onregelmatigheid is begaan, besluit de Minister in overleg met de belanghebbende bij de
      lading of zijn vertegenwoordiger:

      a. dat het product in ieder geval binnen 60 dagen nadat is geconstateerd dat niet aan de onderhavige regeling wordt
      voldaan vanuit de grensinspectiepost met hetzelfde vervoermiddel wordt teruggezonden naar een derde land indien
      veterinaire of gezondheidsredenen zich daar niet tegen verzetten;

      b. indien terugzending als bedoeld in onderdeel a, onmogelijk is of de in dat onderdeel bedoelde termijn is
      verstreken, dat de partij wordt vernietigd overeenkomstig het bepaalde in artikel 17, tweede lid, onderdeel b, van
      [richtlijn nr. 97/78/EG](31997L0078);

      c. dat de partij voor andere doeleinden dan de menselijke consumptie wordt gebruikt.

      3 Indien een partij in Nederland is gebracht zonder dat, voorzover van toepassing, die partij is onderworpen
      aan de in [artikel 7.3.2][ref1] bedoelde controles, besluit de Minister dat de partij overeenkomstig het tweede
      lid, onderdeel b, wordt vernietigd of wordt teruggezonden naar een derde land indien veterinairrechtelijke of
      gezondheidsredenen zich daar niet tegen verzetten.

      4 In afwachting van de terugzending of de vernietiging van een partij als bedoeld in het eerste, tweede en derde
      lid wordt de partij onder toezicht van de ambtenaar in tijdelijke afzondering geplaatst en opgeslagen.

      5 Alle kosten in verband die in verband met de het tweede, derde en vierde lid, bedoelde maatregelen worden
      gemaakt, komen ten laste van de belanghebbende bij de lading.


      [ref1]: https://wetten.overheid.nl/BWBR0024256#Artikel7.3.2
    url: https://wetten.overheid.nl/BWBR0024256/2018-11-01#Artikel7.3.9
