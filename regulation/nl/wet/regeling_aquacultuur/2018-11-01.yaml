  - number: 6.3.10
    text: |-
      1 Indien bij het onderzoek, bedoeld in [artikel 6.3.2, derde lid][ref1], [artikel 9.1.4, tweede lid][ref2], of
      bij een controle tijdens het vervoer in het kader van de invoer of de doorvoer, wordt vermoed of geconstateerd
      dat er verwekkers van ziekten, zoönosen of andere aandoeningen, bedoeld in artikel 8, eerste lid, van [richtlijn
      nr. 90/425/EEG](31990L0425), aanwezig zijn, kan de Minister gelasten dat de daarbij betrokken aquacultuurdieren
      in tijdelijke afzondering worden geplaatst, dan wel worden de aquacultuurdieren na een daartoe strekkend besluit
      van de Minister vernietigd. Het bepaalde in [artikel 6.2.8, tweede lid][ref3], is ten aanzien van dit besluit van
      toepassing.

      2 Indien bij een onderzoek of een controle als bedoeld in het eerste lid, wordt vermoed of geconstateerd dat niet
      is voldaan aan de overige voorwaarden, die in deze regeling dan wel in de van toepassing zijnde communautaire
      maatregelen zijn neergelegd, of dat de aquacultuurdieren afkomstig zijn uit een met een epidemische dierziekte
      besmet gebied, besluit de Minister, na overleg met de importeur, om maatregelen te nemen als bedoeld in artikel 12,
      eerste lid, onderdelen a, b of c van [richtlijn nr. 91/496/EEG](31991L0496).

      3 De kosten, die uit de in het eerste of tweede lid, bedoelde maatregelen voortvloeien, komen voor rekening van
      de importeur, met uitzondering van de kosten die voortvloeien uit de vernietiging van de partij aquacultuurdieren,
      bedoeld in het tweede lid, welke ten laste komen van de afzender, de geadresseerde of hun gemachtigde.


      [ref1]: https://wetten.overheid.nl/BWBR0024256#Artikel6.3.2
      [ref2]: https://wetten.overheid.nl/BWBR0024256#Artikel9.1.4
      [ref3]: https://wetten.overheid.nl/BWBR0024256#Artikel6.2.8
    url: https://wetten.overheid.nl/BWBR0024256/2018-11-01#Artikel6.3.10
