  - number: 6.2.4
    text: |-
      [Artikel 6.2.3, tweede lid][ref1], is van overeenkomstige toepassing op de vervoerder van de aquacultuurdieren.


      [ref1]: https://wetten.overheid.nl/BWBR0024256#Artikel6.2.3
    url: https://wetten.overheid.nl/BWBR0024256/2018-11-01#Artikel6.2.4
