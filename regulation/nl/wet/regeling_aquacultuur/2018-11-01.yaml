  - number: 8.3.1
    text: |-
      1 Indien een in Nederland verzamelde partij producten van aquacultuurdieren bestemd is om te worden vervoerd
      naar een lidstaat gaat de betreffende partij, vergezeld van het diergezondheidscertificaat, in de gevallen waarin
      [artikel 4.1.1][ref1] dit certificaat voorschrijft.

      2 Indien een in Nederland verzamelde partij producten van aquacultuurdieren bestemd is om te worden vervoerd naar
      een derde land, zijn ten aanzien van die partij [artikel 8.2.3, onderdelen a en e][ref2], van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024256#Artikel4.1.1
