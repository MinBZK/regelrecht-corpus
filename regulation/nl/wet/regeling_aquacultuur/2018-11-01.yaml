      2 Het verbod in het eerste lid is niet van toepassing indien is voldaan aan de op grond van artikel 61, derde lid,
      van richtlijn nr. 2006/88/EG vastgestelde communautaire uitvoeringsmaatregelen ten aanzien van het in de handel
