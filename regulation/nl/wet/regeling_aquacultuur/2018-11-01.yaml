        artikel: 6.2.3
        paragraaf: '6.2'
  - number: 6.2.5
    text: |-
      1 De bij de in- of doorvoer van de aquacultuuurdieren betrokken handelaar, is ingeschreven in het register, bedoeld
      in [artikel 9.1.4, eerste lid][ref1].

      2 De inschrijving in het register, bedoeld in het eerste lid, is niet getroffen door een beslissing als bedoeld in
      [artikel 9.1.4, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024256#Artikel9.1.4
      [ref2]: https://wetten.overheid.nl/BWBR0024256#Artikel9.1.4
    url: https://wetten.overheid.nl/BWBR0024256/2018-11-01#Artikel6.2.5
    references:
      - id: ref1
        bwb_id: BWBR0024256
        artikel: 9.1.4
      - id: ref2
        bwb_id: BWBR0024256
        artikel: 9.1.4
  - number: 6.2.6
    text: |-
      1 Krachtens communautaire maatregelen zijn geen maatregelen genomen:

      a. houdende de instelling van een verbod om de aquacultuurdieren uit de betrokken lidstaat uit te voeren;

      b. houdende de machtiging tot de instelling van een verbod om de betreffende dieren in Nederland in te voeren, of
      in het kader van de doorvoer op Nederlands grondgebied te brengen;

      c. op grond waarvan de lidstaat van verzending gehouden is de afgifte van documenten, bedoeld in deze regeling,
      zulks in verband met de invoer in, onderscheidenlijk de doorvoer door Nederland, op te schorten.

      2 Ingevolge de regelgeving van de lidstaat van verzending is er geen verbod om de betrokken aquacultuurdieren op
      het grondgebied van die lidstaat in de handel te brengen.
    url: https://wetten.overheid.nl/BWBR0024256/2018-11-01#Artikel6.2.6
  - number: 6.2.7
    text: |-
      Indien de aquacultuurdieren zijn verzonden vanuit een lidstaat en bestemd zijn voor een derde land:

      a. blijft het vervoer van de betreffende partij, indien zij onder douanetoezicht is geplaatst, onder dat toezicht
      tot de plaats waar het Nederlands grondgebied wordt verlaten;

      b. gaat, indien het punt van uitgang is gelegen in Nederland, de betreffende partij, vergezeld van het
      diergezondheidscertificaat, in die gevallen waar [artikel 4.1.1][ref1] dit voorschrijft;

      c. wordt de betreffende partij, indien de doorvoer vanuit Nederland rechtstreeks naar het derde land van bestemming
      plaatsvindt, doorgevoerd via het punt van uitgang dat op het in onderdeel b bedoelde document is vermeld;

      d. geldt ter zake van het in onderdeel b bedoelde document dat:

      1°. zij in ten minste één van de talen van de lidstaat van oorsprong is gesteld en in de Nederlandse taal of,
      indien de partij bestemd is om te worden doorgevoerd via een andere lidstaat, tevens in één van de talen van de
      lidstaat waar zich het punt van uitgang bevindt;

      2°. daarop het punt van uitgang als plaats van bestemming is vermeld;

      3°. daarop als ontvanger is vermeld, met naam en adres, de handelaar, bedoeld in onderdeel e, dan wel, ingeval de
      partij bestemd is om te worden doorgevoerd via een andere lidstaat, de ontvanger bij het punt van uitgang, bedoeld
      in artikel 4, tweede gedachtenstreepje, van beschikking 93/444/EEG;

      e. gaat de partij vergezeld van veterinaire documenten of certificaten die aan de veterinaire voorschriften van
      het derde land van bestemming voldoen, tenzij op het document, bedoeld in onderdeel b, de vermelding ‘Dieren of
      producten voor uitvoer naar (naam van het derde land)’ voorkomt, waarbij de naam van het derde land van bestemming
      als het gedeelte tussen haakjes is opgenomen;

      f. is [artikel 6.2.5][ref2] van overeenkomstige toepassing ten aanzien van de handelaar die in Nederland bij het
      punt van uitgang bij de doorvoer van de partij betrokken is, en

      g. vindt het vervoer van de partij, indien deze niet aan de voorschriften van [richtlijn nr. 2006/88/EG]
      (32006L0088) voldoet, slechts plaats indien de Minister daartoe vooraf toestemming heeft verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0024256#Artikel4.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0024256#Artikel6.2.5
    url: https://wetten.overheid.nl/BWBR0024256/2018-11-01#Artikel6.2.7
    references:
