preamble:
  text: |-
    Gelet op Verordening (EG) nr. 136/2004 van de Commissie van de Europese Gemeenschappen van 22 januari 2004 tot
    vaststelling van procedures voor de veterinaire controles in de grensinspectieposten van de Gemeenschap bij het
    binnenbrengen van producten uit derde landen (PbEU 21), Verordening (EG) nr. 282/2004 van de Commissie van de
    Europese Gemeenschappen van 18 februari 2004 betreffende de vaststelling van een document voor de aangifte en de
    veterinaire controle van uit derde landen afkomstige dieren die in de Gemeenschap worden binnengebracht (PbEU L
    49), Richtlijn nr. 89/662/EEG van de Raad van de Europese Gemeenschappen van 11 december 1989 inzake veterinaire
    controles in het intracommunautaire handelsverkeer in het vooruitzicht van de totstandbrenging van de interne
    markt (PbEG L 395/13), Richtlijn nr. 90/425/EEG van de Raad van de Europese Gemeenschappen van 26 juni 1990
    inzake veterinaire en zoötechnische controles in het intracommunautaire handelsverkeer in bepaalde levende dieren
    en produkten in het vooruitzicht van de totstandbrenging van de interne markt (PbEG L 224/29), Richtlijn nr.
    91/496/EEG van de Raad van de Europese Gemeenschappen van 15 juli 1991 tot vaststelling van de beginselen voor de
    organisatie van de veterinaire controles voor dieren uit derde landen die in de Gemeenschap worden binnengebracht
    en tot wijziging van de Richtlijnen nrs. 89/662/EEG, 90/425/EEG en 90/675/EEG (PbEG L 268/56), Richtlijn nr.
    96/22/EG van de Raad van de Europese Gemeenschappen van 29 april 1996 betreffende het gebruik, in de veehouderij,
    van bepaalde stoffen met thyreostatische werking, alsmede van ß-agonisten en tot intrekking van de Richtlijnen
    nrs. 81/602/EEG, 88/146/EEG en 88/299/EEG (PbEG L 125), Richtlijn nr. 97/78/EG van de Raad van de Europese Unie
    van 18 december 1997 tot vaststelling van de beginselen voor de organisatie van de veterinaire controles voor
    producten die uit derde landen in de Gemeenschap worden binnengebracht (PbEG L 24), Richtlijn nr. 2006/88/EG van
    de Raad van de Europese Gemeenschappen van 24 oktober 2006 betreffende veterinairrechtelijke voorschriften voor
    aquacultuurdieren en de producten daarvan en betreffende de preventie en bestrijding van bepaalde ziekten bij
    waterdieren (PbEG L 328);

    Gelet op artikel 2b van de Visserijwet 1963, artikel 19 van de Landbouwwet, en de artikelen 10, 11, 13, 15, 19,
    tweede lid, 25, 26, 30, 78, 100, 102, 107 en 111 van de Gezondheids- en welzijnswet voor dieren;

    Gelet op artikel 3 van het Reglement zee- en kustvisserij, de artikelen 2 en 4 van het Besluit inzake het in de
    handel brengen van dieren en producten en de toepassing van maatregelen met betrekking tot in Nederland gebrachte
    dieren en producten, artikel 3, onderdeel hh, en artikel 5, eerste lid, onderdeel ff, van het Besluit verdachte
    dieren;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0024256/2018-11-01#ArtikelAanhef
articles:
  - number: 1.1.1
    text: |-
      In deze regeling wordt verstaan onder:

      a. [richtlijn nr. 89/662/EEG](31989L0662): [Richtlijn nr. 89/662/EEG](31989L0662) van de Raad van de Europese
      Gemeenschappen van 11 december 1989 inzake veterinaire controles in het intracommunautaire handelsverkeer in het
      vooruitzicht van de totstandbrenging van de interne markt (PbEG L 395/13);

      b. *richtlijn nr. 90/425/EEG:* [Richtlijn 90/425/EEG](31990L0425) van de Raad van 26 juni 1990 inzake veterinaire
      controles in het intra-uniale handelsverkeer in bepaalde levende dieren en producten in het vooruitzicht van de
      totstandbrenging van de interne markt (PbEG 1990, L 224);

      c. [richtlijn nr. 91/496/EEG](31991L0496): [Richtlijn nr. 91/496/EEG](31991L0496) van de Raad van de Europese
      Gemeenschappen van 15 juli 1991 tot vaststelling van de beginselen voor de organisatie van de veterinaire controles
      voor dieren uit derde landen die in de Gemeenschap worden binnengebracht en tot wijziging van de [Richtlijnen
      89/662/EEG](31989L0662), [90/425/EEG](31990L0425) en [90/675/EEG](31990L0675) (PbEG L [268/56](32168L0056));

      d. [richtlijn nr. 96/22/EG](31996L0022): [Richtlijn nr. 96/22/EEG](31996L0022) van de Raad van de Europese
      Gemeenschappen van 29 april 1996 betreffende het gebruik, in de veehouderij, van bepaalde stoffen met
      thyreostatische werking, alsmede van ß-agonisten en tot intrekking van de [Richtlijnen 81/602/EEG](31981L0602),
      [88/146/EEG](31988L0146) en [88/299/EEG](31988L0299) (PbEG L 125);

      e. [richtlijn nr. 97/78/EG](31997L0078): [Richtlijn nr. 97/78/EG](31997L0078) van de Raad van de Europese Unie van
      18 december 1997 tot vaststelling van de beginselen voor de organisatie van de veterinaire controles voor producten
      die uit derde landen in de Gemeenschap worden binnengebracht (PbEG L 24);

      g. [richtlijn nr. 2006/88/EG](32006L0088): [Richtlijn nr. 2006/88/EG](32006L0088) van de Raad van de Europese
      Gemeenschappen van 24 oktober 2006, betreffende veterinairrechtelijke voorschriften voor aquacultuurdieren en de
      producten daarvan en betreffende de preventie en bestrijding van bepaalde ziekten bij waterdieren (PbEG L 328);

      h. [verordening nr. 136/2004](32004R0136): [Verordening (EG) nr. 136/2004](32004R0136) van de Commissie van de
      Europese Gemeenschappen van 22 januari 2004 tot vaststelling van procedures voor de veterinaire controles in de
      grensinspectieposten van de Gemeenschap bij het binnenbrengen van producten uit derde landen (PbEU 21);

      i. [verordening nr. 282/2004](32004R0282): [Verordening (EG) nr. 282/2004](32004R0282) van de Commissie van de
      Europese Gemeenschappen van 18 februari 2004 betreffende de vaststelling van een document voor de aangifte en
      de veterinaire controle van uit derde landen afkomstige dieren die in de Gemeenschap worden binnengebracht (PbEU
      L 49);

      j. [verordening nr. 882/2004](32004R0882): [Verordening (EG) nr. 882/2004](32004R0882) van het Europees Parlement
      en de Raad van de Europese Unie van 29 april 2004 inzake officiële controles op de naleving van de wetgeving inzake
      diervoeders en levensmiddelen en de voorschriften inzake diergezondheid en dierenwelzijn (PbEU L 165);

      k. [verordening nr. 853/2004](32004R0853): [Verordening (EG) nr. 853/2004](32004R0853) van het Europees Parlement
      en de Raad van 29 april 2004 houdende vaststelling van specifieke hygiënevoorschriften voor levensmiddelen van
      dierlijke oorsprong (Pb L 139);

      l. beschikking 93/444/EEG: Beschikking van de Commissie van de Europese Gemeenschappen van 2 juli 1993 houdende
      toepassingsbepalingen inzake het intracommunautaire handelsverkeer van bepaalde levende dieren en produkten die
      bestemd zijn voor uitvoer naar derde landen (PbEG L 208).
    url: https://wetten.overheid.nl/BWBR0024256/2018-11-01#Artikel1.1.1
  - number: 1.1.2
    text: |-
      In deze regeling wordt verstaan onder:

      a. Minister: de Minister van Landbouw, Natuur en Voedselkwaliteit;

      b. NVWA: Nederlandse Voedsel- en Warenautoriteit;

      c. ambtenaar: ambtenaar als bedoeld in
      [artikel 114, tweede lid, van de Gezondheids- en welzijnswet voor dieren][ref1];

      d. lidstaat: land, niet zijnde Nederland, dat lid is van de Europese Gemeenschappen;

      e. derde land: land, niet zijnde Nederland en niet zijnde een lidstaat;

      f. communautaire maatregel: verordening, richtlijn of beschikking als bedoeld in artikel 249 van het EG-verdrag;

      g. communautaire uitvoeringsmaatregel: verordening, richtlijn of beschikking als bedoeld in artikel 249 van het EG-
      verdrag, vastgesteld krachtens een communautaire maatregel, genoemd in [artikel 1.1.1][ref2];

      h. aquacultuurdier: aquacultuurdier als bedoeld in artikel 3, eerste lid, onderdeel b, van [richtlijn nr. 2006/88/
      EG](32006L0088);

      i. aquacultuurproductiebedrijf: aquacultuurproductiebedrijf als bedoeld in artikel 3, eerste lid, onderdeel c, van
      [richtlijn nr. 2006/88/EG](32006L0088);

      j. waterdier: waterdier als bedoeld in artikel 3, eerste lid, onderdeel e, van [richtlijn nr. 2006/88/EG]
      (32006L0088);

      k. aquacultuurverwerkingsbedrijf: levensmiddelenbedrijf dat overeenkomstig artikel 4 van [Verordening (EG) nr.
      853/2004](32004R0853) erkend is met het oog op het verwerken van aquacultuurdieren voor voedingsdoeleinden;

      l. kwekerij: kwekerij als bedoeld in artikel 3, eerste lid, onderdeel h, van [richtlijn nr. 2006/88/EG]
      (32006L0088);

      m. kweekgebied van weekdieren: kweekgebied van weekdieren als bedoeld in artikel 3, eerste lid, onderdeel j, van
      [richtlijn nr. 2006/88/EG](32006L0088);

      n. waterdier voor sierdoeleinden: waterdier voor sierdoeleinden als bedoeld in artikel 3, eerste lid, onderdeel k,
      van [richtlijn nr. 2006/88/EG](32006L0088);

      o. in de handel brengen: de verkoop, met inbegrip van het te koop aanbieden, of enige andere vorm van al dan niet
      gratis overdracht, alsmede iedere vorm van verplaatsing van aquacultuurdieren in Nederland en in een lidstaat;

      p. put-en-take-visbedrijven: put-en-take-visbedrijven als bedoeld in artikel 3, eerste lid, onderdeel n, van
      [richtlijn nr. 2006/88/EG](32006L0088);

      q. wild waterdier: wild waterdier als bedoeld in artikel 3, eerste lid, onderdeel p, van [richtlijn nr. 2006/88/
      EG](32006L0088);

      r. compartiment: compartiment als bedoeld in bijlage I, onderdeel a, van [richtlijn nr. 2006/88/EG](32006L0088);

      s. epizoötiologische eenheid: epizoötiologische eenheid als bedoeld in bijlage I, onderdeel g, van [richtlijn nr.
      2006/88/EG](32006L0088);

      t. verdere verwerking: verdere verwerking als bedoeld in bijlage I, onderdeel i, van [richtlijn nr. 2006/88/EG]
      (32006L0088);

      u. verhoogde sterfte: een onverklaarbaar aantal sterfgevallen dat aanzienlijk boven het onder gegeven
      omstandigheden voor de kwekerij of het kweekgebied van weekdieren in kwestie normale niveau ligt;

      v. quarantaine: quarantaine als bedoeld in bijlage I, onderdeel m, van [richtlijn nr. 2006/88/EG](32006L0088);

      w. gevoelige soort: gevoelige soort als bedoeld in bijlage I, onderdeel n, van [richtlijn nr. 2006/88/EG]
      (32006L0088);

      x. gebied: gebied als bedoeld in bijlage I, onderdeel p, van [richtlijn nr. 2006/88/EG](32006L0088);

      y. erkende inspectiepost: op Nederlands grondgebied gelegen inspectiepost die is aangewezen en erkend
      overeenkomstig het bepaalde in artikel 6 van [richtlijn nr. 91/496/EEG](31991L0496) voor zover het de in- of
      doorvoer van aquacultuurdieren betreft onderscheidenlijk het bepaalde in artikel 6 van [richtlijn nr. 97/78/EG]
      (31997L0078) voor zover het de in- of doorvoer van producten van aquacultuurdieren betreft;

      z. importeur: elke natuurlijke persoon of rechtspersoon die aquacultuurdieren of producten daarvan met het oog op
      de invoer of doorvoer bij een erkende inspectiepost ten onderzoek aanbiedt dan wel zijn gemachtigde;

      aa. partij aquacultuurdieren: hoeveelheid aquacultuurdieren van dezelfde soort die met een zelfde vervoermiddel
      wordt vervoerd en afkomstig is uit een zelfde land;

      bb. partij producten van aquacultuurdieren: hoeveelheid aquacultuurprodukten van dezelfde soort die met een zelfde
      vervoermiddel wordt vervoerd en afkomstig is uit een zelfde land;

      cc. doorvoer: vervoer over Nederlands grondgebied van een partij afkomstig uit een lidstaat of een derde land, naar
      een lidstaat of derde land;

      dd. punt van uitgang: douanekantoor van uitgang, of een in een andere lidstaat gelegen plaats als bedoeld in
      artikel 1, tweede lid, onderdeel a, van beschikking 93/444/EEG, van waaruit de betrokken partij aquacultuurdieren
      of producten daarvan rechtstreeks naar het derde land van bestemming worden doorgevoerd;

      ee. douane-entrepot: opslagruimte als bedoeld in Verordening (EU) nr. 952/2013 van het Europees Parlement en de
      Raad van 9 oktober 2013 tot vaststelling van het douanewetboek van de Unie (PbEU 2013, L 269);

      ff.

      gg. belanghebbende bij de lading: belanghebbende bij de lading als bedoeld in artikel 2, tweede lid, onderdeel e,
      van [richtlijn nr. 97/78/EG](31997L0078);

      hh. diergezondheidscertificaat: certificaat als bedoeld in artikel 14 van richtijn nr. 2006/88/EG.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel114
      [ref2]: https://wetten.overheid.nl/BWBR0024256#Artikel1.1.1
    url: https://wetten.overheid.nl/BWBR0024256/2018-11-01#Artikel1.1.2
    references:
