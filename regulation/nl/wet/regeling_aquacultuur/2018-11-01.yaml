        artikel: 9.1.4
  - number: 7.3.1
    text: |-
      1 Het verbod, bedoeld in [artikel 7.1.2][ref1], is niet van toepassing op de invoer van producten van
      aquacultuurdieren:

      a. die daarbij voor het eerst op het grondgebied van de Europese Gemeenschappen worden gebracht, en

      b. die zijn verzonden vanuit een derde land of een deel van een derde land;

      mits, voor zover van toepassing, is voldaan aan [verordening nr. 136/2004](32004R0136) en aan de
      [artikelen 7.3.2][ref2], [7.3.5][ref3] en [7.3.7. tot en met 7.3.9][ref4].

      2 Het verbod, bedoeld in [artikel 7.1.2][ref5], is niet van toepassing op de doorvoer van producten van
      aquacultuurdieren, bestemd voor een lidstaat die via Nederland voor het eerst op het grondgebied van de Europese
      Gemeenschappen worden gebracht, mits, voor zover van toepassing, is voldaan aan [verordening nr. 136/2004]
      (32004R0136) en de [artikelen 7.3.2][ref6], [7.3.5][ref7] en [7.3.7 tot en met 7.3.9][ref8].

      3 Het verbod, bedoeld in [artikel 7.1.2][ref9], is niet van toepassing op de doorvoer van producten van
      aquacultuurdieren bestemd voor een derde land:

      a. die via Nederland voor het eerst op het grondgebied van de Europese Gemeenschappen worden gebracht, en

      b. die zijn verzonden vanuit een derde land of een deel van een derde land;

      mits, voor zover van toepassing, voldaan wordt aan [verordening nr. 136/2004](32004R0136) en de
      [artikelen 7.3.2 tot en met 7.3.9][ref10].


