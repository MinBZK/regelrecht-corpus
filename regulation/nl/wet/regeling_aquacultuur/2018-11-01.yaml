        artikel: 6.2.5
        paragraaf: '6.2'
  - number: 6.2.8
    text: |-
      1 Indien bij het onderzoek, bedoeld in [artikel 6.2.3, tweede lid][ref1], en [artikel 9.1.4, tweede lid][ref2], of
      bij een controle tijdens het vervoer in het kader van de in- of doorvoer, wordt vermoed of geconstateerd dat:

      a. er verwekkers van ziekten, zoönosen of andere aandoeningen, bedoeld in artikel 8, eerste lid, onderdeel a, van
      [richtlijn nr. 90/425/EEG](31990L0425), aanwezig zijn;

      b. dat aquacultuurdieren afkomstig zijn uit een met een epidemische dierziekte besmet gebied,

      worden de daarbij betrokken aquacultuurdieren in afzondering geplaatst of gedood of vernietigd, al naar gelang de
      Minister daaromtrent heeft besloten.

      2 Indien bij een controle of onderzoek als bedoeld in het eerste lid, wordt vermoed of geconstateerd dat niet
      is voldaan aan de overige voorschriften van deze regeling dan wel aan de van toepassing zijnde communautaire
      maatregelen, kan de Minister gelasten dat de aquacultuurdieren in tijdelijke afzondering worden geplaatst, dan
      wel wordt één van de maatregelen, bedoeld in artikel 8, eerste lid, onderdeel b, van [richtlijn nr. 90/425/EEG]
      (31990L0425) uitgevoerd, al naar gelang de Minister daaromtrent, overeenkomstig de keuze van de afzender of diens
      gemachtigde en mits zulks mogelijk is op grond van veterinairrechtelijke voorschriften, heeft besloten.

      Deze maatregelen kunnen tevens door de Minister worden genomen in het in [artikel 6.2.7][ref3] bedoelde geval,
      indien zich tijdens het vervoer andere onregelmatigheden voordoen dan als bedoeld in de eerste volzin, of indien
      het derde land van bestemming de aquacultuurdieren weigert, mits voor Nederland de waarborgen, bedoeld in artikel
      2, tweede lid, van beschikking 93/444/EEG, gelden.

      3 Een besluit als bedoeld in het eerste of tweede lid, wordt ter kennis gebracht van de afzender of diens
      gemachtigde met vermelding van de redenen. Desgevraagd geschiedt die kennisgeving schriftelijk met vermelding van
      de datum en het uur, waarop het besluit is genomen.

      4 Een besluit als bedoeld in het eerste of het tweede lid, laat onverlet het recht van de afzender van de
      aquacultuurdieren om, overeenkomstig het bepaalde in artikel 9, tweede lid, vierde alinea, van [richtlijn nr.
      90/425/EEG](31990L0425), het advies van een veterinair deskundige in te winnen, met dien verstande dat de Minister
      te allen tijde kan beslissen om de maatregelen, bedoeld in het eerste lid, onmiddellijk uit te voeren, indien zulks
      noodzakelijk is om redenen van de bescherming van de diergezondheid.

      5 De kosten, die uit het eerste of tweede lid bedoelde maatregelen voortvloeien, komen voor rekening van de
      afzender of diens gemachtigde dan wel van degene die met de zorg voor de betrokken aquacultuurdieren is belast.


      [ref1]: https://wetten.overheid.nl/BWBR0024256#Artikel6.2.3
      [ref2]: https://wetten.overheid.nl/BWBR0024256#Artikel9.1.4
      [ref3]: https://wetten.overheid.nl/BWBR0024256#Artikel6.2.7
    url: https://wetten.overheid.nl/BWBR0024256/2018-11-01#Artikel6.2.8
    references:
