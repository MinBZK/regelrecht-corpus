  - number: 7.3.4
    text: |-
      1 Ter zake van een partij die zich aan boord bevindt van een vliegtuig of een schip dat bij vervoer tussen twee
      derde landen op Nederlands grondgebied landt of aanlegt, legt de vervoerder desgevraagd, aan de ambtenaar over, het
      in [artikel 7.3.2, vijfde lid][ref1], bedoelde document.

      2 Indien de in het eerste lid bedoelde partij van het ene vliegtuig of schip in het andere wordt overgeladen,
      stelt de vervoerder de ambtenaar hiervan in kennis en legt hij het in [artikel 7.3.2, vijfde lid][ref2], bedoelde
      document over.

      3 Indien de in het eerste lid bedoelde partij tijdelijk wordt uitgeladen en opgeslagen in een op Nederlands
      grondgebied gelegen haven of luchthaven, in afwachting van verzending naar een derde land, legt de vervoerder aan
      de ambtenaar het in [artikel 7.3.2, vijfde lid][ref3], bedoelde document over en biedt hij de partij aan hem ten
      onderzoek aan.

      4 In de in dit artikel bedoelde gevallen gaat de partij tijdens het vervoer naar een derde land vergezeld van het
      in [artikel 7.3.2, vijfde lid][ref4], bedoelde document.


