        paragraaf: '7.2'
      - id: ref3
        bwb_id: BWBR0024256
        artikel: 7.2.3
        paragraaf: '7.2'
  - number: 7.2.2
    text: |-
      1 De producten van aquacultuurdieren die zijn verzonden vanuit een lidstaat gaan in het kader van de invoer, tot
      en met de ontvangst door de handelaar, en in het kader van de doorvoer naar een lidstaat, tijdens het vervoer over
      Nederlands grondgebied, vergezeld van het diergezondheidscertificaat, in de gevallen waarin [artikel 4.1.1][ref1]
      dit certificaat voorschrijft.

      2 De producten van aquacultuurdieren die zijn verzonden vanuit een derde land en via het grondgebied van een
      lidstaat op Nederlands grondgebied worden gebracht, gaan in het kader van de invoer, tot en met de ontvangst door
      de handelaar, en in het kader van de doorvoer naar een lidstaat, tijdens het vervoer over Nederlands grondgebied
      vergezeld van een Gemeenschappelijk veterinair document van binnenkomst als bedoeld in [verordening nr. 136/2004]
      (32004R0136) en van een gewaarmerkt afschrift als bedoeld in artikel 7, vierde lid, van [richtlijn nr. 97/78/EG]
      (31997L0078).

      3 De producten van aquacultuurdieren die zijn verzonden vanuit een derde land en via het grondgebied van een
      lidstaat op Nederlands grondgebied worden gebracht, in het kader van de doorvoer naar een derde land,

      a. gaan tijdens het vervoer over Nederlands grondgebied, vergezeld van het bij de partij behorende document en van
      een Gemeenschappelijk veterinair document van binnenkomst als bedoeld in [verordening nr. 136/2004](32004R0136),
      waarin is aangegeven langs welke grensinpectiepost als bedoeld in artikel 2, tweede lid, onderdeel g, van
      [richtlijn nr. 97/78/EG](31997L0078) de aquacultuurdieren de Gemeenschap verlaten;

      b. zijn onderworpen geweest aan alle controles als bedoeld in artikel 4, eerste lid, van [richtlijn nr. 97/78EG]
      (31997L0078), en

      c. voldoen aan het bepaalde in artikel 12, eerste lid, van deze richtlijn.

      4 Op de in- en doorvoer van producten van aquacultuurdieren, bedoeld in het eerste tot en met het derde lid,
      is het bepaalde in de [artikelen 6.2.2, derde lid][ref2], [6.2.3, eerste en tweede lid][ref3], [6.2.4][ref4] en
      [6.2.6][ref5] van overeenkomstige toepassing, met dien verstande dat het woord ‘ontvanger’ telkenmale vervangen
      dient te worden door ‘handelaar’ en dat bij het in [artikel 6.2.3, tweede lid][ref6], bedoelde onderzoek, de
      documenten, bedoeld in het eerste of tweede lid, worden overgelegd.

      5 Het vervoer van de in het derde lid bedoelde producten van aquacultuurdieren geschiedt onder douanetoezicht tot
      op de plaats waar het Nederlands grondgebied wordt verlaten in verzegelde voertuigen of verzegelde containers en
      zonder splitsing of, tenzij de partij overeenkomstig het derde lid wordt opgeslagen, lossing van de partij.

      6 Op de in het vijfde lid bedoelde partij is
      [paragraaf 3.2.4 van de Regeling veterinairrechtelijke voorschriften handel dierlijke producten][ref7] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024256#Artikel4.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0024256#Artikel6.2.2
      [ref3]: https://wetten.overheid.nl/BWBR0024256#Artikel6.2.3
      [ref4]: https://wetten.overheid.nl/BWBR0024256#Artikel6.2.4
