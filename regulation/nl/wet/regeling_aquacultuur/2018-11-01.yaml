        artikel: 1.1.1
        paragraaf: '1.1'
  - number: 1.2.1
    text: |-
      1 De bevoegde autoriteit, bedoeld in een communautaire maatregel, die is genoemd in [artikel 1.1.1][ref1], en in
      een communautaire uitvoeringsmaatregel, is de Minister.

      2 In afwijking van het eerste lid, is ingeval een communautaire maatregel of een communautaire uitvoeringsmaatregel
      de bevoegde autoriteit een taak opdraagt die niet bestaat uit het nemen van een besluit, de bevoegde autoriteit
      de NVWA.

      3 De officiële dierenarts, bedoeld in een communautaire uitvoeringsmaatregel en in deze regeling, is een
      dierenarts, verbonden aan de NVWA.


      [ref1]: https://wetten.overheid.nl/BWBR0024256#Artikel1.1.1
    url: https://wetten.overheid.nl/BWBR0024256/2018-11-01#Artikel1.2.1
    references:
      - id: ref1
        bwb_id: BWBR0024256
        artikel: 1.1.1
        paragraaf: '1.1'
  - number: 1.2.2
    text: |-
      Ingeval in een bepaling van deze regeling is verwezen naar een communautaire uitvoeringsmaatregel, maar niet een
      dergelijke communautaire uitvoeringsmaatregel geldt, geldt voor de toepassing van deze regeling dat er is voldaan
      aan de desbetreffende bepaling van deze regeling.
    url: https://wetten.overheid.nl/BWBR0024256/2018-11-01#Artikel1.2.2
  - number: 1.2.3
    text: |-
      Een communautaire uitvoeringsmaatregel, of een wijziging daarvan, treedt voor de toepassing van deze regeling in
      werking met ingang van de dag waarop daaraan uiterlijk uitvoering moet zijn gegeven, of bij gebreke daarvan, de dag
      waarop de maatregel is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0024256/2018-11-01#Artikel1.2.3
  - number: 1.3.1
    text: |-
      Op het brengen in en buiten Nederland van aquacultuurdieren en de producten daarvan vanuit, onderscheidenlijk naar
      Noorwegen en IJsland zijn:

      a. de bepalingen inzake de handel met derde landen niet van toepassing;

      b. de bepalingen inzake de intracommunautaire handel van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0024256/2018-11-01#Artikel1.3.1
  - number: 1.3.2
    text: |-
      Deze regeling is niet van toepassing op:

      a. waterdieren voor sierdoeleinden gekweekt in niet-commerciële aquaria;

      b. waterdieren uit het wild verzameld of gevangen die rechtstreeks voor de voedselketen bestemd zijn, en

      c. waterdieren gevangen voor de productie van vismeel, visvoer, visolie en soortgelijke producten.
    url: https://wetten.overheid.nl/BWBR0024256/2018-11-01#Artikel1.3.2
  - number: 1.3.3
    text: |-
      [Titel 2][ref1], [3][ref2], [5][ref3], paragrafen 5.1 tot en met 5.4, en 5.6 zijn niet van toepassing wanneer
      waterdieren voor sierdoeleinden worden gehouden in dierenwinkels, tuincentra, tuinvijvers, commerciële aquaria of
      bij groothandelaren:

      a. waarvan het water niet in rechtstreeks contact staat met natuurlijke wateren, of

      b. die over een systeem voor de behandeling van effluenten beschikken waardoor het risico van de overdracht van
      ziekten naar natuurlijke wateren tot een aanvaardbaar niveau wordt teruggebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0024256
      [ref2]: https://wetten.overheid.nl/BWBR0024256
      [ref3]: https://wetten.overheid.nl/BWBR0024256
    url: https://wetten.overheid.nl/BWBR0024256/2018-11-01#Artikel1.3.3
    references:
      - id: ref1
        bwb_id: BWBR0024256
      - id: ref2
        bwb_id: BWBR0024256
      - id: ref3
        bwb_id: BWBR0024256
  - number: 1.3.4
    text: |-
      In geval van overtreding van de voorschriften uit de [titels 2 tot en met 5][ref1], kan de Minister maatregelen
      nemen als bedoeld in en overeenkomstig artikel 54 van [verordening nr. 882/2004](32004R0882).


      [ref1]: https://wetten.overheid.nl/BWBR0024256
    url: https://wetten.overheid.nl/BWBR0024256/2018-11-01#Artikel1.3.4
    references:
      - id: ref1
        bwb_id: BWBR0024256
  - number: 2.1.1
    text: |-
      1 Het is verboden om een aquacultuurproductiebedrijf, of een aquacultuurverwerkingsbedrijf dat aquacultuurdieren
      slacht met het oog op ziektebestrijding, te exploiteren zonder een door de Minister verleende vergunning.

      2 Het verbod, bedoeld in het eerste lid, is niet van toepassing op:

      a. andere voorzieningen dan aquacultuurproductiebedrijven en aquacultuurverwerkingsbedrijven, waar niet voor de
      handel bestemde waterdieren worden gehouden;

      b. put-en-take-visbedrijven, en

      c. aquacultuurproductiebedrijven die aquacultuurdieren uitsluitend voor menselijke consumptie in de handel brengen
      overeenkomstig artikel 1, derde lid, onderdeel c, van [verordening (EG) nr. 853/2004](32004R0853);

      mits deze aquacultuurproductiebedrijven zijn geregistreerd door de Minister.
    url: https://wetten.overheid.nl/BWBR0024256/2018-11-01#Artikel2.1.1
  - number: 2.1.2
    text: |-
      1 De vergunning, bedoeld in [artikel 2.1.1, eerste lid][ref1], wordt door de Minister op aanvraag verleend aan een
      aquacultuurproductiebedrijf, indien de exploitant van dit bedrijf bij de aanvraag:

      a. op afdoende wijze aantoont dat het bedrijf gedurende de exploitatie kan voldoen aan de eisen gesteld in
      [artikel 2.1.5][ref2], en

      b. de gegevens, genoemd in bijlage II, deel I, onderdeel 1, subonderdelen a en c tot en met g, van [richtlijn nr.
      2006/88/EG](32006L0088), verstrekt.

      2 Indien meerdere aquacultuurproductiebedrijven voor weekdieren zich bevinden in één kweekgebied van
      weekdieren, kan op aanvraag één collectieve vergunning worden verleend, mits door alle aanvragende
      aquacultuurproductiebedrijven aan de voorwaarden uit het eerste lid wordt voldaan.

      3 Het tweede lid is niet van toepassing op verzendingscentra, zuiveringscentra of soortgelijke bedrijven.

      4 Bij een aanvraag voor een collectieve vergunning als bedoeld in het tweede lid worden, in afwijking van het
      eerste lid, onderdeel b, de gegevens, genoemd in bijlage II, deel I, onderdeel 1, subonderdelen c tot en met g van
      [richtlijn nr. 2006/88/EG](32006L0088), voor het hele kweekgebied verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0024256#Artikel2.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0024256#Artikel2.1.5
    url: https://wetten.overheid.nl/BWBR0024256/2018-11-01#Artikel2.1.2
    references:
      - id: ref1
        bwb_id: BWBR0024256
        artikel: 2.1.1
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0024256
        artikel: 2.1.5
        paragraaf: '2.1'
  - number: 2.1.3
    text: |-
      De vergunning, bedoeld in [artikel 2.1.1, eerste lid][ref1], wordt door de Minister op aanvraag verleend aan een
      aquacultuurverwerkingsbedrijf dat aquacultuurdieren slacht met het oog op ziektebestrijding, indien dit bedrijf bij
      de aanvraag:

      a. op afdoende wijze aantoont dat het bedrijf gedurende de exploitatie kan voldoen aan de eisen gesteld in
      [artikel 2.1.6][ref2], en

      b. de gegevens, genoemd in bijlage II, deel II, onderdelen a en c tot en met e, van [richtlijn nr. 2006/88/EG]
      (32006L0088), verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0024256#Artikel2.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0024256#Artikel2.1.6
    url: https://wetten.overheid.nl/BWBR0024256/2018-11-01#Artikel2.1.3
    references:
      - id: ref1
        bwb_id: BWBR0024256
        artikel: 2.1.1
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0024256
        artikel: 2.1.6
        paragraaf: '2.1'
  - number: 2.1.4
    text: |-
      In afwijking van de [artikelen 2.1.2][ref1] en [2.1.3][ref2] wordt een vergunning niet verleend indien uit de
      vergunningaanvraag blijkt dat de activiteiten van het bedrijf leiden tot een onaanvaardbaar risico van verspreiding
      van de ziekten naar kwekerijen, kweekgebieden van weekdieren of bestanden van wilde waterdieren in de omgeving van
      kwekerijen of kweekgebieden van weekdieren.


      [ref1]: https://wetten.overheid.nl/BWBR0024256#Artikel2.1.2
      [ref2]: https://wetten.overheid.nl/BWBR0024256#Artikel2.1.3
    url: https://wetten.overheid.nl/BWBR0024256/2018-11-01#Artikel2.1.4
    references:
      - id: ref1
        bwb_id: BWBR0024256
        artikel: 2.1.2
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0024256
        artikel: 2.1.3
        paragraaf: '2.1'
  - number: 2.1.5
    text: |-
      Een vergunninghoudend aquacultuurproductiebedrijf:

      a. past goede hygiënische methoden toe om de insleep en de verspreiding van ziekten te voorkomen;

      b. past in alle tot het bedrijf behorende kwekerijen en kweekgebieden voor weekdieren een programma voor de
      bewaking van de diergezondheid als bedoeld in artikel 10, eerste lid, van [richtlijn nr. 2006/88/EG](32006L0088),
      toe;

      c. houdt een register bij met daarin de volgende gegevens:

      1°. alle verplaatsingen van aquacultuurdieren en producten daarvan, naar en van de kwekerij of het kweekgebied van
      weekdieren, op zodanige wijze dat het traceren van de plaatsen van oorsprong en bestemming kan worden gewaarborgd;

      2°. de mortaliteit in iedere epizoötiologische eenheid, al naar gelang het productietype;

      3°. de resultaten van het op het bedrijf toegepaste programma voor de bewaking van de diergezondheid, en

      d. hanteert een systeem waaruit blijkt dat aan de vereisten genoemd in de onderdelen a tot en met c is voldaan.
    url: https://wetten.overheid.nl/BWBR0024256/2018-11-01#Artikel2.1.5
  - number: 2.1.6
    text: |-
      Een vergunninghoudend aquacultuurverwerkingsbedrijf:

      a. houdt een register bij met daarin gegevens over alle verplaatsingen van aquacultuurdieren en producten daarvan,
      naar en van het bedrijf, en

      b. past goede hygiënische methoden toe om de insleep en de verspreiding van ziekten te voorkomen.
    url: https://wetten.overheid.nl/BWBR0024256/2018-11-01#Artikel2.1.6
  - number: 2.1.7
    text: |-
      1 Indien een vergunninghoudend aquacultuurproductiebedrijf of een vergunninghoudend aquacultuurverwerkingsbedrijf
      niet meer voldoet aan de eisen gesteld in [artikel 2.1.5][ref1] respectievelijk [artikel 2.1.6][ref2], kan de
      Minister de vergunning schorsen of intrekken.

      2 De schorsing kan worden beëindigd indien ten genoegen van de Minister is aangetoond dat het
      aquacultuurproductiebedrijf of het aquacultuurverwerkingsbedrijf dat aquacultuurdieren slacht met het
      oog op ziektebestrijding, weer volledig aan de eisen gesteld in [artikel 2.1.5][ref3] respectievelijk
      [artikel 2.1.6][ref4] voldoet.


