  - number: 9.1.1
    text: |-
      1 De documenten, bedoeld in de [titels 4 tot en met 8][ref1], worden, voor zover van toepassing, afgegeven door
      de Minister.

      2 Een document wordt niet afgegeven indien voor de partij de gezondheidsverklaring, vermeld op het document, niet
      kan worden gegeven dan wel indien de zending niet voldoet aan aanvullende eisen die op de plaats van bestemming
      in overeenstemming met het bepaalde in de richtlijn dan wel in andere communautaire maatregelen ter voorkoming of
      bestrijding van dierziekten, zijn gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0024256
    url: https://wetten.overheid.nl/BWBR0024256/2018-11-01#Artikel9.1.1
    references:
      - id: ref1
        bwb_id: BWBR0024256
  - number: 9.1.3
    text: |-
      Exploitanten van aquacultuurproductiebedrijven en van aquacultuurverwerkingsbedrijven, handelaren, bedoeld in de
      [artikelen 6.1.1][ref1], [7.1.1][ref2] en [8.1.1][ref3], staan toe dat een ambtenaar ten behoeve van de uitvoering
      van deze regeling, de door hem noodzakelijk geachte werkzaamheden en controles verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0024256#Artikel6.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0024256#Artikel7.1.1
      [ref3]: https://wetten.overheid.nl/BWBR0024256#Artikel8.1.1
    url: https://wetten.overheid.nl/BWBR0024256/2018-11-01#Artikel9.1.3
    references:
