  - number: 10.2.1
    text: |-
      1 De Minister kan op aanvraag een voorlopige vergunning verlenen aan aquacultuurproductiebedrijven als bedoeld in
      [artikel 2.1.1, eerste lid][ref1], die:

      a. geen aquacultuurproductiebedrijven als bedoeld in het [tweede lid van dat artikel][ref2] zijn, en

      b. die op het moment van inwerkingtreding van deze regeling in bedrijf zijn.

      2 Aan een voorlopige vergunning kunnen voorwaarden en voorschriften worden verbonden.

      3 Een voorlopige vergunning vervalt van rechtswege op 1 januari 2009.


