        artikel: 9.1.4
      - id: ref3
        bwb_id: BWBR0024256
        artikel: 9.1.4
  - number: 6.3.6
    text: |-
      Indien de aquacultuurdieren blijkens het in [artikel 6.3.2, vierde lid][ref1], bedoelde document bestemd zijn voor
      een derde land, wordt aangetoond dat het eerste derde land waarnaar zij worden vervoerd de verplichting op zich
      neemt de partij waarvan het de invoer of de doorvoer toestaat, in geen geval te weigeren of terug te zenden en,
      voor zover daarbij vervoer over het grondgebied van een of meer lidstaten zal plaatsvinden, dat door de bevoegde
      centrale autoriteit van die lidstaat of lidstaten toestemming voor dat vervoer is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0024256#Artikel6.3.2
    url: https://wetten.overheid.nl/BWBR0024256/2018-11-01#Artikel6.3.6
    references:
      - id: ref1
        bwb_id: BWBR0024256
        artikel: 6.3.2
        paragraaf: '6.3'
  - number: 6.3.7
    text: |-
      1 Noch krachtens artikel 18, eerste lid, eerste gedachtenstreepje, van [richtlijn nr. 91/496/EEG](31991L0496), noch
      krachtens andere communautaire maatregelen tot wering en bestrijding van besmettelijke dierziekten zijn maatregelen
      genomen, houdende de instelling van een verbod om de betrokken aquacultuurdieren in de Europese Gemeenschappen dan
      wel in Nederland in te voeren, onderscheidenlijk in het kader van de doorvoer op Nederlands grondgebied te brengen.

      2 Aan de aquacultuurdieren zijn geen stoffen toegediend die ingevolge artikel 3, onderdeel a, van [richtlijn nr.
      96/22/EG](31996L0022) niet aan aquacultuurdieren mogen worden toegediend, tenzij aan de voorwaarden ingevolge
      artikel 11 van genoemde richtlijn is voldaan.
    url: https://wetten.overheid.nl/BWBR0024256/2018-11-01#Artikel6.3.7
  - number: 6.3.8
    text: |-
      1 Met betrekking tot de partij aquacultuurdieren is door de Minister een Gemeenschappelijk veterinair document van
      binnenkomst als bedoeld in [verordening nr. 282/2004](32004R0282) afgegeven.

      2 Indien de partij is bestemd voor een lidstaat neemt de Minister het in [artikel 6.3.2, vierde lid][ref1],
      bedoelde originele document in en geeft een gewaarmerkt afschrift daarvan af, met dien verstande dat bij splitsing
      van de partij voor iedere aldus ontstane partij een gewaarmerkt afschrift wordt afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0024256#Artikel6.3.2
    url: https://wetten.overheid.nl/BWBR0024256/2018-11-01#Artikel6.3.8
    references:
      - id: ref1
        bwb_id: BWBR0024256
        artikel: 6.3.2
        paragraaf: '6.3'
  - number: 6.3.9
    text: |-
      1 De ingevoerde aquacultuurdieren gaan tijdens het vervoer vanaf de erkende inspectiepost, per partij, vergezeld
      van:

      a. het in [artikel 6.3.2, vierde lid][ref1], bedoelde document, en

      b. het Gemeenschappelijk veterinair document van binnenkomst, bedoeld in [verordening nr. 282/2004](32004R0282).

      2 De door te voeren aquacultuurdieren die voor een lidstaat zijn bestemd, gaan tijdens het vervoer vanaf de erkende
      inspectiepost, per partij, vergezeld van:

      a. het gewaarmerkte afschrift, bedoeld in [artikel 6.3.8, tweede lid][ref2], en

      b. het Gemeenschappelijk veterinair document van binnenkomst, bedoeld in [verordening nr. 282/2004](32004R0282).

      3 Het eerste lid is van overeenkomstige toepassing op door te voeren aquacultuurdieren die voor een derde land
      zijn bestemd.


      [ref1]: https://wetten.overheid.nl/BWBR0024256#Artikel6.3.2
      [ref2]: https://wetten.overheid.nl/BWBR0024256#Artikel6.3.8
    url: https://wetten.overheid.nl/BWBR0024256/2018-11-01#Artikel6.3.9
    references:
