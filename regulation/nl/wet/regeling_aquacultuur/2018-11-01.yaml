  - number: 7.3.3
    text: |-
      1 De belanghebbende bij de lading kan de melding van de binnenkomst van een partij, bedoeld in
      [artikel 7.3.2, tweede lid][ref1], op elektronische wijze verrichten, indien de Minister daarmee heeft ingestemd.

      2 De Minister kan aan zijn instemming, bedoeld in het eerste lid, voorwaarden stellen en nadere voorschriften
      verbinden.

      3 De Minister kan zijn instemming, bedoeld in het eerste lid in, intrekken, indien de belanghebbende bij de lading:

      a. niet meer voldoet aan de voorwaarden, bedoeld in het tweede lid, of

      b. niet voldoet aan de nadere voorschriften, bedoeld in het tweede lid.

      4 Het melden van de binnenkomst, bedoeld in het eerste lid, geschiedt via een daarvoor bestemd elektronisch systeem
      met behulp van een door de Minister beschikbaar gestelde toegang.

      5 De Minister kan een elektronische aanmelding weigeren, indien:

      a. deze niet overeenkomstig [artikel 7.3.2, tweede lid][ref2], is ingediend,

      b. de aanvaarding daarvan tot een onevenredige belasting voor de Minister zou leiden,

      c. de betrouwbaarheid of vertrouwelijkheid van het bericht waarmee de aanmelding is gedaan onvoldoende is
      gewaarborgd, gelet op de aard en de inhoud van het bericht en het doel waarvoor het wordt gebruikt.

      6 De Minister deelt een weigering op grond van het vijfde lid zo spoedig mogelijk aan de afzender mede.

      7 De Minister kan besluiten de elektronische melding niet te behandelen, indien het elektronisch bericht geheel of
      gedeeltelijk is geweigerd op grond van het vijfde lid.

      8 Op de beslissing, bedoeld in het zevende lid, is [artikel 4:5 van de Algemene wet bestuursrecht][ref3] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024256#Artikel7.3.2
      [ref2]: https://wetten.overheid.nl/BWBR0024256#Artikel7.3.2
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel45
