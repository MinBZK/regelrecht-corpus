      1 Het is verboden om aquacultuurdieren die gevoelig zijn voor één of meer van de in bijlage IV, deel II, van
      [richtlijn nr. 2006/88/EG](32006L0088) vermelde niet-exotische ziekten, of de producten daarvan, in de handel te
      brengen voor verdere verwerking met het oog op menselijke consumptie in een lidstaat, respectievelijk een gebied of
      een compartiment:

      a. die op grond van artikel 49 van [richtlijn nr. 2006/88/EG](32006L0088), respectievelijk dat op grond van
      [artikel 3.1.1][ref1], vrij is verklaard van de betreffende ziekte of ziekten, of

      b. waar een bewakings- of uitroeiingsprogramma als bedoeld in artikel 44 van [richtlijn nr. 2006/88/EG](32006L0088)
      geldt voor de betreffende ziekte of ziekten.

      2 Het verbod, bedoeld in het eerste lid, is niet van toepassing indien:

      a. de aquacultuurdieren of producten daarvan, afkomstig zijn uit een lidstaat die, of een gebied of compartiment
      dat, op grond van artikel 49, of artikel 50, van [richtlijn nr. 2006/88/EG](32006L0088), respectievelijk
      [artikel 3.1.1][ref2], vrij is verklaard van desbetreffende ziekte of ziekten;

      b. de aquacultuurdieren of producten daarvan, zijn verwerkt in een vergunninghoudend aquacultuurverwerkingsbedrijf
      onder omstandigheden die de verspreiding van ziekten voorkomen;

      c. vis voorafgaand aan verzending is gestript, of

      d. weekdieren en schaaldieren in de vorm van niet-verwerkte of van verwerkte producten zijn verzonden.


