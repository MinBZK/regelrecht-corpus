        artikel: 3.2.2.5
  - number: 7.3.7
    text: |-
      1 Noch krachtens artikel 22, eerste lid, eerste gedachtenstreepje, van [richtlijn nr. 97/78/EG](31997L0078), noch
      krachtens andere communautaire maatregelen tot wering en bestrijding van besmettelijke dierziekten zijn maatregelen
      genomen, houdende de instelling van een verbod om de betrokken producten van aquacultuurdieren in de Europese
      Gemeenschappen dan wel in Nederland in te voeren, onderscheidenlijk in het kader van de doorvoer op Nederlands
      grondgebied te brengen.

      2 De producten zijn niet verkregen van of met aquacultuurdieren waaraan stoffen zijn toegediend die ingevolge
      artikel 3, onderdeel a, van [richtlijn nr. 96/22/EG](31996L0022) niet aan aquacultuurdieren mogen worden
      toegediend, tenzij aan de voorwaarden ingevolge artikel 11 van genoemde richtlijn is voldaan.

      3 Ten aanzien van de producten van aquacultuurdieren is, in voorkomend geval, voldaan aan de op grond van artikel
      22, eerste lid, tweede en derde gedachtenstreepje, van [richtlijn nr. 97/78/EG](31997L0078) dan wel op grond van
      andere communautaire maatregelen vastgestelde bijzondere voorschriften.
    url: https://wetten.overheid.nl/BWBR0024256/2018-11-01#Artikel7.3.7
  - number: 7.3.8
    text: |-
      1 De [artikelen 7.3.2][ref1], [7.3.3 tot en met 7.3.6][ref2] zijn niet van toepassing indien het producten van
      aquacultuurdieren betreft, bedoeld in artikel 16, eerste lid, van [richtlijn nr. 97/78/EG](31997L0078), met
      inachtneming van artikel 8 van [verordening nr. 136/2004](32004R0136).

      2 De producten, bedoeld in artikel 16, eerste lid, onderdelen e en f, van [richtlijn nr. 97/78/EG](31997L0078)
      worden aangevoerd via een erkende inspectiepost.

      3 Tenzij met de Minister anders is overeengekomen, geeft de belanghebbende bij de lading van de aanvoer, bedoeld
      in het tweede lid ten minste 24 uur voor de aankomst schriftelijk kennis aan de NVWA, onder opgave van het
      vermoedelijk tijdstip van aankomst, van de hoeveelheid, van de herkomst en van de soort producten.


      [ref1]: https://wetten.overheid.nl/BWBR0024256#Artikel7.3.2
      [ref2]: https://wetten.overheid.nl/BWBR0024256#Artikel7.3.3
    url: https://wetten.overheid.nl/BWBR0024256/2018-11-01#Artikel7.3.8
