  - number: 7.3.6
    text: |-
      1 Bij het binnenbrengen van een partij producten van aquacultuurdieren die door een derde land zijn geweigerd en
      vanuit het grondgebied van de Europese Gemeenschap naar het betrokken derde land zijn verzonden, wordt voldaan aan:

      a. [artikel 7.3.2, eerste, tweede en derde lid][ref1], en

      b. artikel 15, eerste lid, onderdeel a, van [richtlijn nr. 97/78/EG](31997L0078).

      2 Op de in het eerste lid bedoelde partij producten zijn de [artikelen 3.2.2.4, tweede lid][ref2], en
      [3.2.2.5 tot en met 3.2.4.4 van de Regeling veterinairrechtelijke voorschriften handel dierlijke producten][ref3]
      van overeenkomstige toepassing.

      3 Indien de in het eerste lid bedoelde partij producten naar het derde land is verzonden vanuit een lidstaat, heeft
      de Minister vooraf toestemming verleend voor het binnenbrengen van de producten en heeft de bevoegde autoriteit
      van de lidstaat die het in artikel 15, eerste lid, onderdeel a, van [richtlijn nr. 97/78/EG](31997L0078) bedoelde
      certificaat heeft afgegeven met de terugname van de partij ingestemd.


      [ref1]: https://wetten.overheid.nl/BWBR0024256#Artikel7.3.2
      [ref2]: https://wetten.overheid.nl/BWBR0019235#Artikel3.2.2.4
      [ref3]: https://wetten.overheid.nl/BWBR0019235#Artikel3.2.2.5
    url: https://wetten.overheid.nl/BWBR0024256/2018-11-01#Artikel7.3.6
    references:
      - id: ref1
