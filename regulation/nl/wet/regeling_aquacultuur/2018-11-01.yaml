  - number: 7.2.3
    text: |-
      1 Indien bij de controle, bedoeld in [artikel 7.2.2, vierde lid][ref1] juncto [6.2.3, tweede lid][ref2], of bij
      de controle tijdens het vervoer van een partij producten van aquacultuurdieren in het kader van de invoer of de
      doorvoer van deze partij wordt vermoed of geconstateerd dat

      a. er verwekkers van ziekten, zoönosen of andere aandoeningen, bedoeld in artikel 7, eerste lid, onderdeel a, van
      [richtlijn nr. 89/662/EEG](31989L0662), aanwezig zijn, of

      b. de producten van aquacultuurdieren afkomstig zijn uit een met een epidemische dierziekte besmet gebied;

      kan de Minister gelasten dat de partij in tijdelijke afzondering wordt geplaatst, dan wel worden de maatregelen
      bedoeld in artikel 7, eerste lid, onderdeel a, eerste alinea, van die richtlijn, uitgevoerd, al naar gelang de
      Minister daaromtrent heeft besloten.

      2 Indien bij een controle als bedoeld in het eerste lid, of bij een controle tijdens het vervoer van een partij
      producten van aquacultuurdieren in het kader van de invoer of de doorvoer van deze partij wordt vermoed of
      geconstateerd dat niet wordt voldaan aan de voorschriften van de onderhavige regeling dan wel aan de van toepassing
      zijnde communautaire maatregelen, kan de Minister gelasten dat de aquacultuurdieren in tijdelijke afzondering
      worden geplaatst, dan wel wordt één van de maatregelen, bedoeld in artikel 8, eerste lid, onderdeel b, van
      [richtlijn nr. 90/425/EEG](31990L0425) uitgevoerd, waartoe de Minister overeenkomstig de keuze van de afzender of
      diens gemachtigde heeft besloten.

      3 [Artikel 6.2.8, derde, vierde, en vijfde lid][ref3] zijn van overeenkomstige toepassing op de besluiten, bedoeld
      in het eerste en tweede lid, met die verstande dat het advies, bedoeld in [artikel 6.2.8, vierde lid][ref4],
      overeenkomstig het bepaalde in artikel 8, tweede lid, vierde alinea, van [richtlijn nr. 89/662/EEG](31989L0662)
      is ingewonnen.


      [ref1]: https://wetten.overheid.nl/BWBR0024256#Artikel7.2.2
      [ref2]: https://wetten.overheid.nl/BWBR0024256#Artikel6.2.3
      [ref3]: https://wetten.overheid.nl/BWBR0024256#Artikel6.2.8
      [ref4]: https://wetten.overheid.nl/BWBR0024256#Artikel6.2.8
