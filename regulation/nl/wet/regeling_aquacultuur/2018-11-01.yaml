        artikel: 4:5
  - number: 6.3.4
    text: |-
      De importeur of de vervoerder van de in of door te voeren aquacultuurdieren volgt de instructies van de ambtenaar,
      in verband met het onderzoek of een controle op. Daarbij verleent hij alle medewerking en verstrekt hij alle
      inlichtingen die voor het onderzoek of de controle noodzakelijk worden geacht.
    url: https://wetten.overheid.nl/BWBR0024256/2018-11-01#Artikel6.3.4
  - number: 6.3.5
    text: |-
      1 Indien de aquacultuurdieren blijkens het in [artikel 6.3.2, vierde lid][ref1], bedoelde document bestemd zijn
      om naar een lidstaat te worden doorgevoerd, is de bij doorvoer betrokken handelaar ingeschreven in het register,
      bedoeld in [artikel 9.1.4][ref2].

      2 De inschrijving in het register, als bedoeld in het eerste lid, is niet getroffen door een beslissing als bedoeld
      in [artikel 9.1.4, derde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0024256#Artikel6.3.2
      [ref2]: https://wetten.overheid.nl/BWBR0024256#Artikel9.1.4
      [ref3]: https://wetten.overheid.nl/BWBR0024256#Artikel9.1.4
    url: https://wetten.overheid.nl/BWBR0024256/2018-11-01#Artikel6.3.5
    references:
      - id: ref1
        bwb_id: BWBR0024256
        artikel: 6.3.2
        paragraaf: '6.3'
      - id: ref2
