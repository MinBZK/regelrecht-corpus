      1 Het is verboden om wilde waterdieren die gevoelig zijn voor één of meer van de in bijlage IV, deel II, van
      [richtlijn nr. 2006/88/EG](32006L0088) vermelde ziekten en die zijn gevangen in een lidstaat die niet, of
      een gebied of compartiment dat niet, op grond van artikel 49, of artikel 50, van [richtlijn nr. 2006/88/EG]
      (32006L0088), respectievelijk [artikel 3.1.1][ref1], vrij is verklaard van de betreffende ziekte of ziekten,
      uit te zetten in een kwekerij of kweekgebied van weekdieren in een lidstaat, respectievelijk een gebied of een
      compartiment:

      a. die op grond van artikel 49 van [richtlijn nr. 2006/88/EG](32006L0088), respectievelijk dat op grond van
      [artikel 3.1.1][ref2], vrij is verklaard van de betreffende ziekte of ziekten, of

      b. waar een bewakings- of uitroeiingsprogramma als bedoeld in artikel 44 van [richtlijn nr. 2006/88/EG](32006L0088)
      geldt voor de betreffende ziekte of ziekten.

      2 Het verbod, bedoeld in het eerste lid, is niet van toepassing indien de wilde waterdieren voordat deze worden
      uitgezet in een kwekerij of kweekgebied als bedoeld in het eerste lid in quarantainevoorzieningen worden gehouden
      gedurende een periode die lang genoeg is om het risico van overdracht van de ziekte of ziekten tot een aanvaardbaar
      niveau terug te brengen.

      3 Ten aanzien van de quarantaine, bedoeld in het tweede lid, wordt voldaan aan de op grond van artikel 61, derde
      lid, van richtlijn nr. 2006/88/EG vastgestelde communautaire uitvoeringsmaatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0024256#Artikel3.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0024256#Artikel3.1.1
    url: https://wetten.overheid.nl/BWBR0024256/2018-11-01#Artikel4.4.1
    references:
