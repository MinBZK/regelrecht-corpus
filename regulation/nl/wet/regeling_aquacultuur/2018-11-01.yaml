  - number: 4.1.1
    text: |-
      1 Het is verboden om aquacultuurdieren die gevoelig zijn voor één of meer van de in bijlage IV, deel II, van
      [richtlijn nr. 2006/88/EG](32006L0088) vermelde ziekten in de handel te brengen voor de kweek, de uitzetting in het
      wild of de verdere verwerking met het oog op menselijke consumptie in een lidstaat, respectievelijk een gebied of
      een compartiment:

      a. die op grond van artikel 49 van [richtlijn nr. 2006/88/EG](32006L0088), respectievelijk dat op grond van
      [artikel 3.1.1][ref1], vrij is verklaard van de betreffende ziekte of ziekten, of

      b. waar een bewakings- of uitroeiingsprogramma als bedoeld in artikel 44 van [richtlijn nr. 2006/88/EG](32006L0088)
      geldt voor desbetreffende ziekte of ziekten.

      2 Het verbod, bedoeld in het eerste lid, is niet van toepassing op het in de handel brengen van aquacultuurdieren
      voor verdere verwerking met het oog op menselijke consumptie van vis indien de vis voorafgaand aan verzending is
      geslacht en gestript, en van weekdieren en schaaldieren indien deze in de vorm van niet-verwerkte of verwerkte
      producten zijn verzonden.

      3 Het verbod, bedoeld in het eerste lid, is niet van toepassing indien door de Minister ten aanzien van de dieren
      een diergezondheidscertificaat is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0024256#Artikel3.1.1
