      a. de aquacultuurdieren afkomstig zijn uit een lidstaat die, of een gebied of compartiment dat, op grond van
      artikel 49, of artikel 50, van [richtlijn nr. 2006/88/EG](32006L0088), respectievelijk [artikel 3.1.1][ref2], vrij
