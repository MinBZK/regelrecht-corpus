  - number: 6.3.1
    text: |-
      1 Het verbod, bedoeld in [artikel 6.1.2][ref1], is niet van toepassing op de invoer van aquacultuurdieren:

      a. die voor het eerst op het grondgebied van de Europese Gemeenschappen worden gebracht, en

      b. verzonden zijn vanuit een derde land of een deel van een derde land;

      mits, voor zover van toepassing, is voldaan aan de in [artikel 5.1.1][ref2] gestelde voorschriften,
      aan [verordening nr. 282/2004](32004R0282) en aan de [artikelen 6.3.2][ref3], [6.3.4][ref4] en
      [6.3.7 tot en met 6.3.10][ref5].

      2 Het verbod, bedoeld in [artikel 6.1.2][ref6], is niet van toepassing op de doorvoer van aquacultuurdieren:

      a. die zijn verzonden vanuit een derde land en via Nederland voor het eerste op het grondgebied van de Europese
      Gemeenschappen worden gebracht;

      b. waarvan de eerst volgende bestemming blijkens de bij de partij behorende documenten een derde land is;

      c. die zijn aangevoerd met een vliegtuig, onderscheidenlijk een schip en met een vliegtuig, onderscheidenlijk een
      schip het Nederlandse grondgebied rechtstreeks via dezelfde luchthaven, onderscheidenlijk haven van aanvoer weer
      verlaten, en

      d. die tussentijds niet in contact komen met andere partijen aquacultuurdieren of aquacultuurproducten en, indien
      zij tussentijds het transportmiddel verlaten, het daartoe door de Minister aangewezen terrein niet verlaten, mits
      de zodanige doorvoer tijdig bij de NVWA is gemeld en de door de Minister gegeven instructies worden opgevolgd;

      mits, voor zover van toepassing, voldaan is aan [verordening nr. 282/2004](32004R0282) en de
      [artikelen 6.3.2][ref7], [6.3.4][ref8], [6.3.7][ref9] en [6.3.10][ref10].

      3 Het verbod, bedoeld in [artikel 6.1.2][ref11], is niet van toepassing op de doorvoer van aquacultuurdieren:

      a. die via Nederland voor het eerst op het grondgebied van de Europese Gemeenschappen worden gebracht, en

      b. zijn verzonden uit een derde land of een deel van een derde land, dat is vermeld op de krachtens artikel 22
      van [richtlijn nr. 2006/88/EG](32006L0088) opgestelde lijst of die, zolang die lijst niet is vastgesteld, zijn
      verzonden uit derde landen;

      mits, voor zover van toepassing, is voldaan aan [verordening nr. 282/2004](32004R0282) en de
      [artikelen 6.3.2 tot en met 6.3.10][ref12].


      [ref1]: https://wetten.overheid.nl/BWBR0024256#Artikel6.1.2
      [ref2]: https://wetten.overheid.nl/BWBR0024256#Artikel5.1.1
