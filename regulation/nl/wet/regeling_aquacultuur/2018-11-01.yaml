  - number: 7.3.2
    text: |-
      1 Elke partij producten van aquacultuurdieren wordt het Nederlands grondgebied binnengebracht via een erkende
      inspectiepost.

      2 Elke binnenkomst, bedoeld in het eerste lid, wordt gemeld aan de NVWA overeenkomstig artikel 2 van [verordening
      nr. 136/2004](32004R0136).

      3 De partij producten wordt door de belanghebbende bij de lading bij aankomst op de erkende inspectiepost ter
      onderzoek aangeboden aan de ambtenaar.

      4 Indien de partij voor Nederland dan wel voor een lidstaat is bestemd, wordt bij de aankomst op de
      erkende inspectiepost aan de op de inspectiepost aanwezige ambtenaar, overgelegd, document als bedoeld in
      [artikel 5.1.1, onderdeel b][ref1].

      5 Indien de partij bestemd is voor een derde land, wordt bij de aankomst op de erkende inspectiepost aan de
      op de inspectiepost aanwezige ambtenaar, een bij de partij behorend document overgelegd, dat is opgesteld
      in de Nederlandse, Duitse, Franse of Engelse taal, waaruit tenminste de oorsprong van de partij, de verdere
      bestemming hiervan, alsmede, indien opslag in een van de in artikel 12 van [richtlijn nr. 97/78/EG](31997L0078)
      bedoelde opslagruimte in Nederland dan wel een lidstaat is voorzien, het feit dat voldaan is aan de op grond
      van deze regeling met betrekking tot de invoer in Nederland dan wel de doorvoer naar een lidstaat gestelde
      veterinairrechtelijke voorschriften.

      6 Ten aanzien van de in het derde en vierde lid bedoelde documenten geldt:

      a. dat zij volledig ingevuld, gedagtekend, ondertekend en origineel zijn;

      b. dat zij in overeenstemming met communautaire maatregelen zijn afgegeven;

      c. dat daaruit blijkt dat is voldaan aan nadere voorwaarden, die bij communautaire maatregelen zijn gesteld aan de
      invoer van producten van aquacultuurdieren vanuit het betrokken derde land of deel van dat derde land, en

      d. de geldigheidsduur niet is verstreken.

      7 Op de in het eerste lid bedoelde partij producten zijn de [artikelen 3.2.2.4, tweede lid][ref2], en
      [3.2.2.5 tot en met 3.2.4.4 van de Regeling veterinairrechtelijke voorschriften handel dierlijke producten][ref3]
      van overeenkomstige toepassing. Deze partij gaat vergezeld van een Gemeenschappelijk veterinair document van
      binnenkomst als bedoeld in [verordening nr. 136/2004](32004R0136). Opslag in een douane-entrepot is slechts
      toegestaan voor zover elders geen opslag heeft plaatsgevonden.

      8 Voor de toepassing van de in het zevende lid bedoelde artikelen wordt voor ‘keuringsdierenarts’ gelezen:
      ambtenaar.

      9 In geval een partij aquacultuurdieren afkomstig is uit Nieuw-Zeeland, mag deze in afwijking van het vierde
      lid, vergezeld gaan van een certificaat dat is vastgesteld bij een communautaire maatregel ter uitvoering van de
      Overeenkomst van 17 december 1996 tussen de Europese Gemeenschap en Nieuw-Zeeland inzake sanitaire maatregelen voor
      de handel in levende dieren en dierlijke producten (PbEG 1997, L 57), indien:

      a. de partij aquacultuurdieren ingevolge de vorenbedoelde overeenkomst in elk geval op het gebied van de
      diergezondheid als gelijkwaardig erkend is, en

      b. de partij aquacultuurdieren aan de ingevolge vorenbedoelde communautaire maatregel gestelde bijkomende
      voorwaarden voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0024256#Artikel5.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0019235#Artikel3.2.2.4
      [ref3]: https://wetten.overheid.nl/BWBR0019235#Artikel3.2.2.5
