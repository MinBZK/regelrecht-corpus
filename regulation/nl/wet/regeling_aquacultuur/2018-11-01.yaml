  - number: 6.3.2
    text: |-
      1 Elke partij aquacultuurdieren wordt het Nederlands grondgebied binnengebracht via een erkende inspectiepost.

      2 Elke binnenkomst, bedoeld in het eerste lid, wordt gemeld aan de NVWA overeenkomstig artikel 1, eerste tot en met
      derde lid, van [verordening nr. 282/2004](32004R0282).

      3 Elke partij aquacultuurdieren wordt bij aankomst op de erkende inspectiepost ten onderzoek aangeboden aan de
      ambtenaar op die inspectiepost.

      4 Bij het in het derde lid bedoelde onderzoek dient aan de ambtenaar te worden overgelegd een door de
      officiële dierenarts afgegeven, volledig ingevuld, gedagtekend en ondertekend origineel document als bedoeld in
      [artikel 5.1.1, onderdeel b][ref1]:

      a. dat in overeenstemming met communautaire maatregelen is afgegeven;

      b. waaruit dient te blijken dat is voldaan aan nadere voorwaarden die in de communautaire maatregelen zijn gesteld
      aan de invoer van aquacultuurdieren vanuit het betrokken derde land of deel van dat derde land, en

      c. waarvan de geldigheidsduur niet is verstreken.

      5 Ten aanzien van de partij aquacultuurdieren wordt voldaan aan de voorschriften van [richtlijn nr. 2006/88/EG]
      (32006L0088).

      6 In geval een partij aquacultuurdieren afkomstig is uit Nieuw-Zeeland, mag deze in afwijking van het vierde
      lid, vergezeld gaan van een certificaat dat is vastgesteld bij een communautaire maatregel ter uitvoering van de
      Overeenkomst van 17 december 1996 tussen de Europese Gemeenschap en Nieuw-Zeeland inzake sanitaire maatregelen voor
      de handel in levende dieren en dierlijke producten (PbEG 1997, L 57), indien:

      a. de partij aquacultuurdieren ingevolge de vorenbedoelde overeenkomst in elk geval op het gebied van de
      diergezondheid als gelijkwaardig erkend is, en

      b. de partij aquacultuurdieren aan de ingevolge vorenbedoelde communautaire maatregel gestelde bijkomende
      voorwaarden voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0024256#Artikel5.1.1
    url: https://wetten.overheid.nl/BWBR0024256/2018-11-01#Artikel6.3.2
    references:
      - id: ref1
        bwb_id: BWBR0024256
        artikel: 5.1.1
  - number: 6.3.3
    text: |-
      1 De belanghebbende bij de lading kan de melding van de binnenkomst van een partij, bedoeld in
      [artikel 6.3.2, tweede lid][ref1], op elektronische wijze verrichten, indien de Minister daarmee heeft ingestemd.

      2 De Minister kan aan zijn instemming, bedoeld in het eerste lid, voorwaarden stellen en nadere voorschriften
      verbinden.

      3 De Minister kan zijn instemming, bedoeld in het eerste lid in, intrekken, indien de belanghebbende bij de lading:

      a. niet meer voldoet aan de voorwaarden, bedoeld in het tweede lid, of

      b. niet voldoet aan de nadere voorschriften, bedoeld in het tweede lid.

      4 Het melden van de binnenkomst, bedoeld in het eerste lid, geschiedt via een daarvoor bestemd elektronisch systeem
      met behulp van een door de Minister beschikbaar gestelde toegang.

      5 De Minister kan een elektronische aanmelding weigeren, indien:

      a. deze niet overeenkomstig [artikel 6.3.2, tweede lid][ref2], is ingediend;

      b. de aanvaarding daarvan tot een onevenredige belasting voor de Minister zou leiden, en

      c. de betrouwbaarheid of vertrouwelijkheid van het bericht waarmee de aanmelding is gedaan onvoldoende is
      gewaarborgd, gelet op de aard en de inhoud van het bericht en het doel waarvoor het wordt gebruikt.

      6 De Minister deelt een weigering op grond van het vijfde lid zo spoedig mogelijk aan de afzender mede.

      7 De Minister kan besluiten de elektronische melding niet te behandelen, indien het elektronisch bericht geheel of
      gedeeltelijk is geweigerd op grond van het vijfde lid.

      8 Op de beslissing, bedoeld in het zevende lid, is [artikel 4:5 van de Algemene wet bestuursrecht][ref3] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024256#Artikel6.3.2
      [ref2]: https://wetten.overheid.nl/BWBR0024256#Artikel6.3.2
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel45
    url: https://wetten.overheid.nl/BWBR0024256/2018-11-01#Artikel6.3.3
    references:
