        bwb_id: BWBR0024256
        artikel: 6.1.1
        paragraaf: '6.1'
      - id: ref2
        bwb_id: BWBR0024256
        artikel: 7.1.1
        paragraaf: '7.1'
      - id: ref3
        bwb_id: BWBR0024256
        artikel: 8.1.1
        paragraaf: '8.1'
  - number: 9.1.4
    text: |-
      1 De Minister houdt een register van handelaren als bedoeld in de [artikelen 6.1.1][ref1], [7.1.1][ref2] en
      [8.1.1][ref3], bij, tenzij hij een door een andere instantie beheerd register als zodanig heeft aangewezen.

      2 Een handelaar als bedoeld in het eerste lid, die is ingeschreven in het in het eerste lid bedoelde register:

      a. voert een administratie waarin ten minste de leveringen dan wel afleveringen van aquacultuurdieren of producten
      daarvan, voor zover deze bestemd zijn voor invoer in Nederland dan wel voor doorvoer of uitvoer naar een lidstaat
      of een derde land, en de verdere bestemming van de partijen, zijn vermeld en waarin alle op de betrokken partijen
      betrekking hebbende bescheiden zijn opgenomen;

      b. bewaart de vorenbedoelde administratie ten minste drie jaren;

      c. draagt ervoor zorg dat elke partij aquacultuurdieren of producten daarvan vergezeld gaat van de voorgeschreven
      documenten;

      d. meldt nalatigheden en onregelmatigheden met betrekking tot een levering dan wel aflevering van aquacultuurdieren
      of producten daarvan, afkomstig uit een lidstaat en bestemd om in Nederland te worden ingevoerd dan wel naar een
      lidstaat of een derde land te worden doorgevoerd, onmiddellijk aan de NVWA en houdt deze aquacultuurdieren of
      producten daarvan in afzondering totdat door de Minister, zodanig na onderzoek, is beslist;

      e. verleent aan de ambtenaar en hen, die namens hem optreden, alle medewerking en verstrekt alle inlichtingen die
      voor de in onderdeel d bedoelde beslissing noodzakelijk wordt geacht.

      3 Indien een handelaar als bedoeld in het eerste lid, zich niet aan de in het tweede lid bedoelde voorschriften
      houdt, kan de Minister beslissen dat zijn inschrijving in het in het eerste lid bedoelde register wordt doorgehaald
      dan wel niet wordt erkend.


      [ref1]: https://wetten.overheid.nl/BWBR0024256#Artikel6.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0024256#Artikel7.1.1
      [ref3]: https://wetten.overheid.nl/BWBR0024256#Artikel8.1.1
    url: https://wetten.overheid.nl/BWBR0024256/2018-11-01#Artikel9.1.4
