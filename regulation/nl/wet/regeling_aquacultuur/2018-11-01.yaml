    text: |-
      1 De handelaar is ingeschreven in het register, bedoeld in [artikel 9.1.4][ref1].

      2 De inschrijving in het register, als bedoeld in het eerste lid, is niet getroffen door een beslissing, als
      bedoeld in [artikel 9.1.4, derde lid][ref2].


