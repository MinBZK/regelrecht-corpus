        paragraaf: '3.1'
  - number: 4.5.1
    text: |-
      1 Het is verboden om waterdieren voor sierdoeleinden in de handel te brengen.

      2 Het verbod, bedoeld in het eerste lid, is niet van toepassing indien de gezondheidsstatus van waterdieren met
      betrekking tot de in bijlage IV, deel II, vermelde ziekten, door het in de handel brengen niet in gevaar komt.
    url: https://wetten.overheid.nl/BWBR0024256/2018-11-01#Artikel4.5.1
  - number: 4.6.1
    text: |-
      De verboden, bedoeld in deze titel, zijn niet van toepassing op het in de handel brengen van aquacultuurdieren en
      de producten daarvan voor wetenschappelijke doeleinden, mits de Minister daarvoor op aanvraag toestemming heeft
      verleend.
    url: https://wetten.overheid.nl/BWBR0024256/2018-11-01#Artikel4.6.1
  - number: 5.1.1
    text: |-
      1 Het is verboden om aquacultuurdieren, of de producten daarvan, uit derde landen in Nederland te brengen.

      2 Het verbod, bedoeld in het eerste lid, is niet van toepassing indien:

      a. de aquacultuurdieren of de producten daarvan afkomstig zijn uit een derde land dat voorkomt op de lijst die is
      vastgesteld op grond van artikel 22 van richtlijn nr. 2006/88/EG;

      b. de aquacultuurdieren of de producten daarvan vergezeld gaan van een gezondheidscertificaat als bedoeld in
      artikel 24 van richtlijn 2006/88/EG, in welk certificaat in ieder geval:

      1°. wordt bevestigd dat bedoelde aquacultuurdieren voldoen aan de voorschriften van richtlijn nr. 2006/88/EG, en

      2°. wordt bevestigd dat bedoelde aquacultuurdieren voldoen aan de bijzondere invoer- en andere voorwaarden gesteld
      in de krachtens artikel 25 van richtlijn nr. 2006/88/EG vastgestelde communautaire uitvoeringsmaatregel, en

      c. ten aanzien van de aquacultuurdieren is voldaan aan de op grond van de artikelen 25 en 61, derde lid,
      van richtlijn nr. 2006/88/EG en artikel 10, derde en vierde lid, van richtlijn nr. 91/496/EEG vastgestelde
      communautaire uitvoeringsmaatregelen inzake de quarantaine van de betreffende dieren.
    url: https://wetten.overheid.nl/BWBR0024256/2018-11-01#Artikel5.1.1
  - number: 6.1.1
    text: |-
      Voor de toepassing van dit hoofdstuk wordt onder ‘handelaar’ verstaan elke natuurlijke of rechtspersoon die
      aquacultuurdieren met het oog op de verhandeling onder zich heeft.
    url: https://wetten.overheid.nl/BWBR0024256/2018-11-01#Artikel6.1.1
  - number: 6.1.2
    text: De in- en doorvoer van aquacultuurdieren is verboden.
    url: https://wetten.overheid.nl/BWBR0024256/2018-11-01#Artikel6.1.2
  - number: 6.2.1
    text: |-
      Het verbod, bedoeld in [artikel 6.1.2][ref1], is niet van toepassing op de in- en doorvoer van aquacultuurdieren
      die zijn verzonden:

      a. vanuit een lidstaat;

      b. vanuit een derde land, en via het grondgebied van een lidstaat in het kader van de in- of doorvoer op Nederlands
      grondgebied worden gebracht;

      mits, voor zover van toepassing, wordt voldaan aan de [artikelen 6.2.2 tot en met 6.2.8][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024256#Artikel6.1.2
      [ref2]: https://wetten.overheid.nl/BWBR0024256#Artikel6.2.2
    url: https://wetten.overheid.nl/BWBR0024256/2018-11-01#Artikel6.2.1
    references:
      - id: ref1
        bwb_id: BWBR0024256
        artikel: 6.1.2
        paragraaf: '6.1'
      - id: ref2
        bwb_id: BWBR0024256
        artikel: 6.2.2
        paragraaf: '6.2'
  - number: 6.2.2
    text: |-
      1 De aquacultuurdieren zijn niet afkomstig van een plaats als bedoeld in artikel 3, eerste lid, onderdeel e, van
      [richtlijn nr. 90/425/EEG](31990L0425), of een compartiment of gebied dat aan diezelfde eisen voldoet.

      2 Het eerste lid geldt niet voor aquacultuurdieren bestemd voor een lidstaat, of een compartiment of gebied in
      die lidstaat, voor zover het buiten Nederland brengen van deze dieren op grond van [richtlijn nr. 2006/88/EG]
      (32006L0088) is toegestaan.

      3 De partij aquacultuurdieren gaat in het kader van:

        - de invoer, tot en met de ontvangst door de ontvanger, genoemd in de onder a, b of c, bedoelde documenten, alsmede
        - de doorvoer, tijdens het vervoer over Nederlands grondgebied, voor zover de partij is verzonden uit een derde
      land, en via het grondgebied van een lidstaat in het kader van de in- of doorvoer op Nederlands grondgebied worden
      gebracht, vergezeld van: a. het Gemeenschappelijke veterinaire document van binnenkomst, bedoeld in [verordening
      nr. 282/2004](32004R0282); b. het document, onderscheidenlijk de documenten, bedoeld in artikel 7, eerste lid,
      eerste gedachtestreepje, van [richtlijn nr. 91/496/EEG](31991L0496), en c. het diergezondheidscertificaat, in die
      gevallen waarin [artikel 4.1.1][ref1] dit voorschrijft.

      4 De in het derde lid bedoelde documenten zijn volledig ingevuld, gedagtekend en ondertekend en voldoen, in
      voorkomend geval, aan [artikel 6.2.7 onderdelen d en e][ref2]. Voorts is de geldigheidsduur ervan niet verstreken
      en zijn zij in overeenstemming met communautaire maatregelen afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0024256#Artikel4.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0024256#Artikel6.2.7
    url: https://wetten.overheid.nl/BWBR0024256/2018-11-01#Artikel6.2.2
    references:
      - id: ref1
        bwb_id: BWBR0024256
        artikel: 4.1.1
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0024256
        artikel: 6.2.7
        paragraaf: '6.2'
  - number: 6.2.3
    text: |-
      1 De ontvanger van aquacultuurdieren, bedoeld in [artikel 6.2.2, derde lid][ref1], meldt of doet melden de aankomst
      van elke partij aquacultuurdieren bij de NVWA tussen 08.00 uur en 17.00 uur en ten laatste op de dag, niet zijnde
      een zaterdag, zondag of een algemeen erkende feestdag, voorafgaand aan de dag van aankomst op de plaats van
      bestemming. Bij die melding wordt mededeling gedaan van het vermoedelijke tijdstip van aankomst en de aard en
      omvang van de partij.

      2 De ontvanger volgt de instructies op die de ambtenaar hem of degene die namens hem is opgetreden heeft gegeven in
      verband met een controle. Op verzoek van de ambtenaar biedt de ontvanger de partij ter onderzoek aan en overlegt de
      in [artikel 6.2.2, derde lid][ref2], bedoelde documenten. Bij een zodanig onderzoek verleent hij alle medewerking
      en verstrekt hij alle inlichtingen die voor het onderzoek noodzakelijk worden geacht.

      3 De ontvanger van de aquacultuurdieren bewaart de in [artikel 6.2.2, derde lid][ref3], bedoelde documenten ten
      minste zes maanden vanaf de aanvoer van die dieren.


      [ref1]: https://wetten.overheid.nl/BWBR0024256#Artikel6.2.2
      [ref2]: https://wetten.overheid.nl/BWBR0024256#Artikel6.2.2
      [ref3]: https://wetten.overheid.nl/BWBR0024256#Artikel6.2.2
    url: https://wetten.overheid.nl/BWBR0024256/2018-11-01#Artikel6.2.3
    references:
      - id: ref1
        bwb_id: BWBR0024256
        artikel: 6.2.2
