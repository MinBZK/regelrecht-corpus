        artikel: 7.1.1
        paragraaf: '7.1'
  - number: 8.2.1
    text: |-
      Het vervoeren van een in Nederland verzamelde partij aquacultuurdieren van enige plaats in Nederland naar het
      grondgebied van en bestemd voor een lidstaat is verboden.
    url: https://wetten.overheid.nl/BWBR0024256/2020-06-06#Artikel8.2.1
  - number: 8.2.2
    text: |-
      De partij aquacultuurdieren dient, in de gevallen, bedoeld in artikel 14 van [richtlijn nr. 2006/88/EG]
      (32006L0088), vergezeld te gaan van het diergezondheidscertificaat.
    url: https://wetten.overheid.nl/BWBR0024256/2020-06-06#Artikel8.2.2
  - number: 8.2.3
    text: |-
      Indien de aquacultuurdieren zijn bestemd om via het grondgebied van een lidstaat naar een derde land te worden
      vervoerd:

      a. blijft het vervoer van de betreffende partij, indien zijn onder douanetoezicht is geplaatst, onder dat toezicht
      tot de plaats waar het Nederlands grondgebied wordt verlaten;

      b. gaat de betreffende partij, vergezeld van het diergezondheidscertificaat, in de gevallen waarin
      [artikel 4.1.1][ref1] dit certificaat voorschrijft;

      c. geldt ter zake van het in onderdeel b bedoelde document tevens dat:

      a. dit in de Nederlandse taal en in ten minste één van de talen van de lidstaat waar zich het punt van uitgang
      bevindt, zijn gesteld;

      b. daarop het punt van uitgang als plaats van bestemming is vermeld;

      c. daarop als ontvanger is vermeld, met naam en adres, de ontvanger bij het punt van uitgang;

      d. gaat de partij vergezeld van veterinaire documenten of certificaten, die aan de veterinaire voorschriften van
      het derde land van bestemming voldoen, tenzij de NVWA niet over die voorschriften beschikt, in welk geval op de
      documenten, bedoeld in onderdeel b, de vermelding ‘Dieren of producten voor uitvoer naar (naam van het derde land)’
      is opgenomen, waarbij de naam van het derde land van bestemming als het gedeelte tussen haakjes is ingevuld, en

      e. is het vervoer daarvan, indien de aquacultuurdieren niet voldoen aan de voorwaarden van [richtlijn nr. 2006/88/
      EG](32006L0088), slechts toegestaan indien de Minister daartoe vooraf toestemming heeft verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0024256#Artikel4.1.1
    url: https://wetten.overheid.nl/BWBR0024256/2020-06-06#Artikel8.2.3
    references:
      - id: ref1
        bwb_id: BWBR0024256
        artikel: 4.1.1
        paragraaf: '4.1'
  - number: 8.3.1
    text: |-
      1 Indien een in Nederland verzamelde partij producten van aquacultuurdieren bestemd is om te worden vervoerd
      naar een lidstaat gaat de betreffende partij, vergezeld van het diergezondheidscertificaat, in de gevallen waarin
      [artikel 4.1.1][ref1] dit certificaat voorschrijft.

      2 Indien een in Nederland verzamelde partij producten van aquacultuurdieren bestemd is om te worden vervoerd naar
      een derde land:

      a. blijft het vervoer van de betreffende partij, indien zijn onder douanetoezicht is geplaatst, onder dat toezicht
      tot de plaats waar het Nederlands grondgebied wordt verlaten;

      b. is het vervoer daarvan, indien de aquacultuurdieren niet voldoen aan de voorwaarden van [richtlijn nr. 2006/88/
      EG](32006L0088), slechts toegestaan indien de Minister daartoe vooraf toestemming heeft verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0024256#Artikel4.1.1
    url: https://wetten.overheid.nl/BWBR0024256/2020-06-06#Artikel8.3.1
    references:
      - id: ref1
        bwb_id: BWBR0024256
        artikel: 4.1.1
        paragraaf: '4.1'
  - number: 8a.1
    text: Dit hoofdstuk heeft betrekking op het brengen in Nederland van aquacultuurdieren en producten daarvan.
    url: https://wetten.overheid.nl/BWBR0024256/2020-06-06#Artikel8a.1
  - number: 8a.2
    text: |-
      Als voorschriften als bedoeld in
      [artikel 4 van het Besluit uitvoering verordening officiële controles diergezondheid][ref1] worden aangewezen:

      a. de artikelen 15, eerste, tweede, derde en vijfde lid, 47, vijfde lid, 50, eerste en derde lid, 56, eerste en
      vierde lid, 57, eerste lid, en 69, eerste lid, van verordening (EU) 2017/625;

      b. artikel 1, eerste lid, van uitvoeringsverordening (EU) 2019/1013;

      c. de artikelen 3, 4, onderdelen a en b, 5, eerste lid, onderdelen a, b, d en e, en tweede lid, onderdeel a en c,
      en 6, onderdelen a en b, van gedelegeerde verordening (EU) 2019/1602;

      d. de artikelen 2, tweede lid, onderdeel b en c, en 3, eerste lid, van gedelegeerde verordening (EU) 2019/1666;

      e. de artikelen 3, 5, eerste lid, 7, 8, 10, 12, 13, eerste lid, en 14, eerste lid, van gedelegeerde verordening
      (EU) 2019/625;

      f. artikel 41, eerste lid, van uitvoeringsverordening (EU) 2019/1715;

      g. de artikelen 7, eerste, tweede en derde lid, artikel 9, eerste en tweede lid, artikel 10, eerste en derde,
      vierde en vijfde lid, en artikel 11, eerste, tweede, derde en vijfde lid, van uitvoeringsverordening (EU)
      2019/1793;

      h. de artikelen 8, derde lid, onderdeel a, en 10, derde lid, van gedelegeerde verordening (EU) 2019/2122;

      i. de artikelen 3, eerste lid, 5, 6, 14, 16, eerste en derde lid, 17, tweede lid, 22, vierde lid, 24, 27, eerste
      en vierde lid, 28, 29, 31, tweede en vierde lid, 32, 35, eerste lid, 36, derde lid, 37, tweede en vijfde lid, van
      gedelegeerde verordening (EU) 2019/2124;

      j. artikel 5, tweede lid, van gedelegeerde verordening (EU) 2019/2125;

      k. de artikelen 3 tot en met 5 van uitvoeringsverordening (EU) 2019/2128.


      [ref1]: https://wetten.overheid.nl/BWBR0042383#Artikel4
    url: https://wetten.overheid.nl/BWBR0024256/2020-06-06#Artikel8a.2
