  - number: 4.5.1
    text: |-
      1 Het is verboden om waterdieren voor sierdoeleinden in de handel te brengen.

      2 Het verbod, bedoeld in het eerste lid, is niet van toepassing indien de gezondheidsstatus van waterdieren met
      betrekking tot de in bijlage IV, deel II, vermelde ziekten, door het in de handel brengen niet in gevaar komt.
    url: https://wetten.overheid.nl/BWBR0024256/2020-06-06#Artikel4.5.1
  - number: 4.6.1
    text: |-
      De verboden, bedoeld in deze titel, zijn niet van toepassing op het in de handel brengen van aquacultuurdieren en
      de producten daarvan voor wetenschappelijke doeleinden, mits de Minister daarvoor op aanvraag toestemming heeft
      verleend.
    url: https://wetten.overheid.nl/BWBR0024256/2020-06-06#Artikel4.6.1
  - number: 5.1.1
    text: |-
      1 Het is verboden om aquacultuurdieren, of de producten daarvan, uit derde landen in Nederland te brengen.

      2 Het verbod, bedoeld in het eerste lid, is niet van toepassing indien:

      a. de aquacultuurdieren of de producten daarvan afkomstig zijn uit een derde land dat voorkomt op de lijst die is
      vastgesteld op grond van artikel 22 van richtlijn nr. 2006/88/EG;

      b. de aquacultuurdieren of de producten daarvan vergezeld gaan van een gezondheidscertificaat als bedoeld in
      artikel 24 van richtlijn 2006/88/EG, in welk certificaat in ieder geval:

      1°. wordt bevestigd dat bedoelde aquacultuurdieren voldoen aan de voorschriften van richtlijn nr. 2006/88/EG, en

      2°. wordt bevestigd dat bedoelde aquacultuurdieren voldoen aan de bijzondere invoer- en andere voorwaarden gesteld
      in de krachtens artikel 25 van richtlijn nr. 2006/88/EG vastgestelde communautaire uitvoeringsmaatregel, en

      c. ten aanzien van de aquacultuurdieren is voldaan aan de op grond van de artikelen 25 en 61, derde lid, van
      richtlijn nr. 2006/88/EG vastgestelde communautaire uitvoeringsmaatregelen inzake de quarantaine van de betreffende
      dieren.
    url: https://wetten.overheid.nl/BWBR0024256/2020-06-06#Artikel5.1.1
  - number: 6.1.1
    text: |-
      Voor de toepassing van dit hoofdstuk wordt onder ‘handelaar’ verstaan elke natuurlijke of rechtspersoon die
      aquacultuurdieren met het oog op de verhandeling onder zich heeft.
    url: https://wetten.overheid.nl/BWBR0024256/2020-06-06#Artikel6.1.1
  - number: 6.1.2
    text: De in- en doorvoer van aquacultuurdieren is verboden.
    url: https://wetten.overheid.nl/BWBR0024256/2020-06-06#Artikel6.1.2
  - number: 6.2.1
    text: |-
      Het verbod, bedoeld in [artikel 6.1.2][ref1], is niet van toepassing op de in- en doorvoer van aquacultuurdieren
      die zijn verzonden:

      a. vanuit een lidstaat;

      b. vanuit een derde land, en via het grondgebied van een lidstaat in het kader van de in- of doorvoer op Nederlands
      grondgebied worden gebracht;

      mits, voor zover van toepassing, wordt voldaan aan verordening (EU) 2017/625 en de daarop gebaseerde gedelegeerde
      handelingen en uitvoeringshandelingen van de Europese Commissie, en aan [artikel 6.2.7][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024256#Artikel6.1.2
      [ref2]: https://wetten.overheid.nl/BWBR0024256#Artikel6.2.7
    url: https://wetten.overheid.nl/BWBR0024256/2020-06-06#Artikel6.2.1
    references:
      - id: ref1
        bwb_id: BWBR0024256
        artikel: 6.1.2
        paragraaf: '6.1'
      - id: ref2
        bwb_id: BWBR0024256
        artikel: 6.2.7
        paragraaf: '6.2'
  - number: 6.2.7
    text: |-
      Indien de aquacultuurdieren zijn verzonden vanuit een lidstaat en bestemd zijn voor een derde land:

      a. blijft het vervoer van de betreffende partij, indien zij onder douanetoezicht is geplaatst, onder dat toezicht
      tot de plaats waar het Nederlands grondgebied wordt verlaten;

      b. gaat, indien het punt van uitgang is gelegen in Nederland, de betreffende partij, vergezeld van het
      diergezondheidscertificaat, in die gevallen waar [artikel 4.1.1][ref1] dit voorschrijft;

      c. wordt de betreffende partij, indien de doorvoer vanuit Nederland rechtstreeks naar het derde land van bestemming
      plaatsvindt, doorgevoerd via het punt van uitgang dat op het in onderdeel b bedoelde document is vermeld;

      d. geldt ter zake van het in onderdeel b bedoelde document dat:

      1°. zij in ten minste één van de talen van de lidstaat van oorsprong is gesteld en in de Nederlandse taal of,
      indien de partij bestemd is om te worden doorgevoerd via een andere lidstaat, tevens in één van de talen van de
      lidstaat waar zich het punt van uitgang bevindt;

      2°. daarop het punt van uitgang als plaats van bestemming is vermeld;

      3°. daarop als ontvanger is vermeld, met naam en adres, de handelaar, bedoeld in onderdeel e, dan wel, ingeval de
      partij bestemd is om te worden doorgevoerd via een andere lidstaat, de ontvanger bij het punt van uitgang;

      e. gaat de partij vergezeld van veterinaire documenten of certificaten die aan de veterinaire voorschriften van
      het derde land van bestemming voldoen, tenzij op het document, bedoeld in onderdeel b, de vermelding ‘Dieren of
      producten voor uitvoer naar (naam van het derde land)’ voorkomt, waarbij de naam van het derde land van bestemming
      als het gedeelte tussen haakjes is opgenomen, en

      f. vindt het vervoer van de partij, indien deze niet aan de voorschriften van [richtlijn nr. 2006/88/EG]
      (32006L0088) voldoet, slechts plaats indien de Minister daartoe vooraf toestemming heeft verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0024256#Artikel4.1.1
    url: https://wetten.overheid.nl/BWBR0024256/2020-06-06#Artikel6.2.7
