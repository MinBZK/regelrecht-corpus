  - number: 7.1.1
    text: |-
      Voor de toepassing van dit hoofdstuk wordt onder ‘handelaar’ verstaan elke natuurlijke persoon of rechtspersoon
      zijnde de eerste ontvanger op Nederlands grondgebied van een partij producten van aquacultuurdieren.
    url: https://wetten.overheid.nl/BWBR0024256/2020-06-06#Artikel7.1.1
  - number: 7.1.2
    text: De in- en doorvoer van producten van aquacultuurdieren is verboden.
    url: https://wetten.overheid.nl/BWBR0024256/2020-06-06#Artikel7.1.2
  - number: 7.2.1
    text: |-
      Het verbod, bedoeld in [artikel 7.1.2][ref1], is niet van toepassing op de in- en doorvoer van producten van
      aquacultuurdieren die zijn verzonden:

      a. vanuit een lidstaat;

      b. vanuit een derde land, en via het grondgebied van een lidstaat in het kader van de in- of doorvoer op Nederlands
      grondgebied worden gebracht;

      mits, voor zover van toepassing, voldaan is aan verordening (EU) 2017/625 en de daarop gebaseerde gedelegeerde
      handelingen en uitvoeringshandelingen van de Europese Commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0024256#Artikel7.1.2
    url: https://wetten.overheid.nl/BWBR0024256/2020-06-06#Artikel7.2.1
    references:
      - id: ref1
        bwb_id: BWBR0024256
        artikel: 7.1.2
        paragraaf: '7.1'
  - number: 7.3.1
    text: |-
      1 Het verbod, bedoeld in [artikel 7.1.2][ref1], is niet van toepassing op de invoer van producten van
      aquacultuurdieren:

      a. die daarbij voor het eerst op het grondgebied van de Europese Gemeenschappen worden gebracht, en

      b. die zijn verzonden vanuit een derde land of een deel van een derde land;

      mits, voor zover van toepassing, is voldaan aan verordening (EU) 2017/625 en de daarop gebaseerde gedelegeerde
      handelingen en uitvoeringshandelingen van de Europese Commissie en aan [artikel 7.3.2][ref2].

      2 Het verbod, bedoeld in [artikel 7.1.2][ref3], is niet van toepassing op de doorvoer van producten van
      aquacultuurdieren, bestemd voor een lidstaat die via Nederland voor het eerst op het grondgebied van de Europese
      Gemeenschappen worden gebracht, mits, voor zover van toepassing, is voldaan aan verordening (EU) 2017/625
      en de daarop gebaseerde gedelegeerde handelingen en uitvoeringshandelingen van de Europese Commissie en aan
      [artikel 7.3.2][ref4].

      3 Het verbod, bedoeld in [artikel 7.1.2][ref5], is niet van toepassing op de doorvoer van producten van
      aquacultuurdieren bestemd voor een derde land:

      a. die via Nederland voor het eerst op het grondgebied van de Europese Gemeenschappen worden gebracht, en

      b. die zijn verzonden vanuit een derde land of een deel van een derde land;

      mits, voor zover van toepassing, voldaan wordt aan verordening (EU) 2017/625 en de daarop gebaseerde gedelegeerde
      handelingen en uitvoeringshandelingen van de Europese Commissie en aan [artikel 7.3.2][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0024256#Artikel7.1.2
      [ref2]: https://wetten.overheid.nl/BWBR0024256#Artikel7.3.2
