  - number: 2.1.8
    text: |-
      Bij een aanvraag tot registratie als bedoeld in [artikel 2.1.1, tweede lid][ref1], worden door de exploitant
      de gegevens, genoemd in bijlage II, deel I, onderdeel 1, subonderdelen a en f, van [richtlijn nr. 2006/88/EG]
      (32006L0088), verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0024256#Artikel2.1.1
