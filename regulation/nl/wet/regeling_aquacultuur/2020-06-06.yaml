  - number: 2.1.5
    text: |-
      Een vergunninghoudend aquacultuurproductiebedrijf:

      a. past goede hygiënische methoden toe om de insleep en de verspreiding van ziekten te voorkomen;

      b. past in alle tot het bedrijf behorende kwekerijen en kweekgebieden voor weekdieren een programma voor de
      bewaking van de diergezondheid als bedoeld in artikel 10, eerste lid, van [richtlijn nr. 2006/88/EG](32006L0088),
      toe;

      c. houdt een register bij met daarin de volgende gegevens:

      1°. alle verplaatsingen van aquacultuurdieren en producten daarvan, naar en van de kwekerij of het kweekgebied van
      weekdieren, op zodanige wijze dat het traceren van de plaatsen van oorsprong en bestemming kan worden gewaarborgd;

      2°. de mortaliteit in iedere epizoötiologische eenheid, al naar gelang het productietype;

      3°. de resultaten van het op het bedrijf toegepaste programma voor de bewaking van de diergezondheid, en

      d. hanteert een systeem waaruit blijkt dat aan de vereisten genoemd in de onderdelen a tot en met c is voldaan.
    url: https://wetten.overheid.nl/BWBR0024256/2020-06-06#Artikel2.1.5
  - number: 2.1.6
    text: |-
      Een vergunninghoudend aquacultuurverwerkingsbedrijf:

      a. houdt een register bij met daarin gegevens over alle verplaatsingen van aquacultuurdieren en producten daarvan,
      naar en van het bedrijf, en

      b. past goede hygiënische methoden toe om de insleep en de verspreiding van ziekten te voorkomen.
    url: https://wetten.overheid.nl/BWBR0024256/2020-06-06#Artikel2.1.6
  - number: 2.1.7
    text: |-
      1 Indien een vergunninghoudend aquacultuurproductiebedrijf of een vergunninghoudend aquacultuurverwerkingsbedrijf
      niet meer voldoet aan de eisen gesteld in [artikel 2.1.5][ref1] respectievelijk [artikel 2.1.6][ref2], kan de
      Minister de vergunning schorsen of intrekken.

      2 De schorsing kan worden beëindigd indien ten genoegen van de Minister is aangetoond dat het
      aquacultuurproductiebedrijf of het aquacultuurverwerkingsbedrijf dat aquacultuurdieren slacht met het
      oog op ziektebestrijding, weer volledig aan de eisen gesteld in [artikel 2.1.5][ref3] respectievelijk
      [artikel 2.1.6][ref4] voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0024256#Artikel2.1.5
      [ref2]: https://wetten.overheid.nl/BWBR0024256#Artikel2.1.6
      [ref3]: https://wetten.overheid.nl/BWBR0024256#Artikel2.1.5
      [ref4]: https://wetten.overheid.nl/BWBR0024256#Artikel2.1.6
    url: https://wetten.overheid.nl/BWBR0024256/2020-06-06#Artikel2.1.7
