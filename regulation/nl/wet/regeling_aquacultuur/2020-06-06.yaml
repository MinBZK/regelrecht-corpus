preamble:
  text: |-
    Gelet op Verordening (EG) nr. 136/2004 van de Commissie van de Europese Gemeenschappen van 22 januari 2004 tot
    vaststelling van procedures voor de veterinaire controles in de grensinspectieposten van de Gemeenschap bij het
    binnenbrengen van producten uit derde landen (PbEU 21), Verordening (EG) nr. 282/2004 van de Commissie van de
    Europese Gemeenschappen van 18 februari 2004 betreffende de vaststelling van een document voor de aangifte en de
    veterinaire controle van uit derde landen afkomstige dieren die in de Gemeenschap worden binnengebracht (PbEU L
    49), Richtlijn nr. 89/662/EEG van de Raad van de Europese Gemeenschappen van 11 december 1989 inzake veterinaire
    controles in het intracommunautaire handelsverkeer in het vooruitzicht van de totstandbrenging van de interne
    markt (PbEG L 395/13), Richtlijn nr. 90/425/EEG van de Raad van de Europese Gemeenschappen van 26 juni 1990
    inzake veterinaire en zoötechnische controles in het intracommunautaire handelsverkeer in bepaalde levende dieren
    en produkten in het vooruitzicht van de totstandbrenging van de interne markt (PbEG L 224/29), Richtlijn nr.
    91/496/EEG van de Raad van de Europese Gemeenschappen van 15 juli 1991 tot vaststelling van de beginselen voor de
    organisatie van de veterinaire controles voor dieren uit derde landen die in de Gemeenschap worden binnengebracht
    en tot wijziging van de Richtlijnen nrs. 89/662/EEG, 90/425/EEG en 90/675/EEG (PbEG L 268/56), Richtlijn nr.
    96/22/EG van de Raad van de Europese Gemeenschappen van 29 april 1996 betreffende het gebruik, in de veehouderij,
    van bepaalde stoffen met thyreostatische werking, alsmede van ß-agonisten en tot intrekking van de Richtlijnen
    nrs. 81/602/EEG, 88/146/EEG en 88/299/EEG (PbEG L 125), Richtlijn nr. 97/78/EG van de Raad van de Europese Unie
    van 18 december 1997 tot vaststelling van de beginselen voor de organisatie van de veterinaire controles voor
    producten die uit derde landen in de Gemeenschap worden binnengebracht (PbEG L 24), Richtlijn nr. 2006/88/EG van
    de Raad van de Europese Gemeenschappen van 24 oktober 2006 betreffende veterinairrechtelijke voorschriften voor
    aquacultuurdieren en de producten daarvan en betreffende de preventie en bestrijding van bepaalde ziekten bij
    waterdieren (PbEG L 328);

    Gelet op artikel 2b van de Visserijwet 1963, artikel 19 van de Landbouwwet, en de artikelen 10, 11, 13, 15, 19,
    tweede lid, 25, 26, 30, 78, 100, 102, 107 en 111 van de Gezondheids- en welzijnswet voor dieren;

    Gelet op artikel 3 van het Reglement zee- en kustvisserij, de artikelen 2 en 4 van het Besluit inzake het in de
    handel brengen van dieren en producten en de toepassing van maatregelen met betrekking tot in Nederland gebrachte
    dieren en producten, artikel 3, onderdeel hh, en artikel 5, eerste lid, onderdeel ff, van het Besluit verdachte
    dieren;

    Besluit:
