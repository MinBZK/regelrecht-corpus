  - number: 2.1.1
    text: |-
      1 Het is verboden om een aquacultuurproductiebedrijf, of een aquacultuurverwerkingsbedrijf dat aquacultuurdieren
      slacht met het oog op ziektebestrijding, te exploiteren zonder een door de Minister verleende vergunning.

      2 Het verbod, bedoeld in het eerste lid, is niet van toepassing op:

      a. andere voorzieningen dan aquacultuurproductiebedrijven en aquacultuurverwerkingsbedrijven, waar niet voor de
      handel bestemde waterdieren worden gehouden;

      b. put-en-take-visbedrijven, en

      c. aquacultuurproductiebedrijven die aquacultuurdieren uitsluitend voor menselijke consumptie in de handel brengen
      overeenkomstig artikel 1, derde lid, onderdeel c, van [verordening (EG) nr. 853/2004](32004R0853);

      mits deze aquacultuurproductiebedrijven zijn geregistreerd door de Minister.
    url: https://wetten.overheid.nl/BWBR0024256/2020-06-06#Artikel2.1.1
  - number: 2.1.2
    text: |-
      1 De vergunning, bedoeld in [artikel 2.1.1, eerste lid][ref1], wordt door de Minister op aanvraag verleend aan een
      aquacultuurproductiebedrijf, indien de exploitant van dit bedrijf bij de aanvraag:

      a. op afdoende wijze aantoont dat het bedrijf gedurende de exploitatie kan voldoen aan de eisen gesteld in
      [artikel 2.1.5][ref2], en

      b. de gegevens, genoemd in bijlage II, deel I, onderdeel 1, subonderdelen a en c tot en met g, van [richtlijn nr.
      2006/88/EG](32006L0088), verstrekt.

      2 Indien meerdere aquacultuurproductiebedrijven voor weekdieren zich bevinden in één kweekgebied van
      weekdieren, kan op aanvraag één collectieve vergunning worden verleend, mits door alle aanvragende
      aquacultuurproductiebedrijven aan de voorwaarden uit het eerste lid wordt voldaan.

      3 Het tweede lid is niet van toepassing op verzendingscentra, zuiveringscentra of soortgelijke bedrijven.

      4 Bij een aanvraag voor een collectieve vergunning als bedoeld in het tweede lid worden, in afwijking van het
      eerste lid, onderdeel b, de gegevens, genoemd in bijlage II, deel I, onderdeel 1, subonderdelen c tot en met g van
      [richtlijn nr. 2006/88/EG](32006L0088), voor het hele kweekgebied verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0024256#Artikel2.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0024256#Artikel2.1.5
