  - number: 6.3.2
    text: |-
      In geval een partij aquacultuurdieren of een partij producten van aquacultuurdieren afkomstig is uit Nieuw-Zeeland,
      mag deze vergezeld gaan van een certificaat dat is vastgesteld bij een communautaire maatregel ter uitvoering van
      de Overeenkomst van 17 december 1996 tussen de Europese Gemeenschap en Nieuw-Zeeland inzake sanitaire maatregelen
      voor de handel in levende dieren en dierlijke producten (PbEG 1997, L 57), indien:

      a. een partij aquacultuurdieren of een partij producten van aquacultuurdieren ingevolge de vorenbedoelde
      overeenkomst in elk geval op het gebied van de diergezondheid als gelijkwaardig erkend is, en

      b. een partij aquacultuurdieren of een partij producten van aquacultuurdieren aan de ingevolge vorenbedoelde
      communautaire maatregel gestelde bijkomende voorwaarden voldoet.
    url: https://wetten.overheid.nl/BWBR0024256/2020-06-06#Artikel6.3.2
  - number: 6.3.9
    text: |-
      De ingevoerde aquacultuurdieren die voor een derde land zijn bestemd, gaan tijdens het
      vervoer vanaf een grenscontrolepost, per partij, vergezeld van het document, bedoeld in
      [artikel 5.1.1, tweede lid, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024256#Artikel5.1.1
