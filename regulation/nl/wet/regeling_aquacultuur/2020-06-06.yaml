  - number: 8a.3
    text: |-
      1 De minister wijst grenscontroleposten aan als bedoeld in artikel 59, eerste lid, van verordening (EU) 2017/625.

      2 De minister kan andere controlepunten aanwijzen als bedoeld in artikel 53, eerste lid, van verordening (EU)
      2017/625.

      3 Aanwijzingen als bedoeld in het eerste en tweede lid kunnen worden ingetrokken of worden geschorst, ter
      uitvoering van artikel 62 en 63 van de verordening (EU) 2017/625.
    url: https://wetten.overheid.nl/BWBR0024256/2020-06-06#Artikel8a.3
  - number: 9.1.1
    text: |-
      1 De documenten, bedoeld in de de [titels 4][ref1] en [5][ref2], worden, voor zover van toepassing, afgegeven door
      de Minister.

      2 Een document wordt niet afgegeven indien voor de partij de gezondheidsverklaring, vermeld op het document, niet
      kan worden gegeven dan wel indien de zending niet voldoet aan aanvullende eisen die op de plaats van bestemming
      in overeenstemming met het bepaalde in de richtlijn dan wel in andere communautaire maatregelen ter voorkoming of
      bestrijding van dierziekten, zijn gesteld.


