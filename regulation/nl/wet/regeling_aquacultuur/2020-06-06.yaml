      1 Het is verboden om aquacultuurdieren die gevoelig zijn voor één of meer van de in bijlage IV, deel II, van
      [richtlijn nr. 2006/88/EG](32006L0088) vermelde ziekten, voor kweekdoeleinden in de handel te brengen, die:

      a. niet klinisch gezond zijn, of

      b. afkomstig zijn van een kwekerij of kweekgebied van weekdieren waar zich een onopgeloste verhoogde sterfte
      voordoet.

      2 In afwijking van het eerste lid, onderdeel b, kan de Minister toestaan dat bedoelde aquacultuurdieren in
      de handel worden gebracht indien zij afkomstig zijn uit een gedeelte van deze kwekerij of dit kweekgebied van
      weekdieren dat onafhankelijk is van de epizoötiologische eenheid waar de verhoogde sterfte zich heeft voorgedaan.
    url: https://wetten.overheid.nl/BWBR0024256/2020-06-06#Artikel4.2.1
  - number: 4.2.2
    text: |-
      Het is verboden om aquacultuurdieren die gevoelig zijn voor één of meer van de in bijlage IV, deel II, van
      [richtlijn nr. 2006/88/EG](32006L0088) vermelde ziekten, voor uitzetting in het wild of voor uitzetting in put-en-
      take-visbedrijven in de handel te brengen, die:

      a. niet klinisch gezond zijn;

      b. afkomstig zijn van een kwekerij of kweekgebied van weekdieren waar zich een onopgeloste verhoogde sterfte
      voordoet, of

      c. afkomstig zijn uit een kwekerij of kweekgebied van weekdieren met een gezondheidsstatus als bedoeld in bijlage
      III, deel A, van [richtlijn nr. 2006/88/EG](32006L0088), die lager is dan de gezondheidsstatus van de wateren
      waarin zij worden uitgezet.
    url: https://wetten.overheid.nl/BWBR0024256/2020-06-06#Artikel4.2.2
