  - number: 7.3.2
    text: |-
      In geval een partij aquacultuurdieren afkomstig is uit Nieuw-Zeeland, mag deze vergezeld gaan van een certificaat
      dat is vastgesteld bij een communautaire maatregel ter uitvoering van de Overeenkomst van 17 december 1996 tussen
      de Europese Gemeenschap en Nieuw-Zeeland inzake sanitaire maatregelen voor de handel in levende dieren en dierlijke
      producten (PbEG 1997, L 57), indien:

      a. de partij aquacultuurdieren ingevolge de vorenbedoelde overeenkomst in elk geval op het gebied van de
      diergezondheid als gelijkwaardig erkend is, en

      b. de partij aquacultuurdieren aan de ingevolge vorenbedoelde communautaire maatregel gestelde bijkomende
      voorwaarden voldoet.
    url: https://wetten.overheid.nl/BWBR0024256/2020-06-06#Artikel7.3.2
  - number: 8.1.1
    text: |-
      Voor de toepassing van dit hoofdstuk is de begripsomschrijving ‘handelaar’ zoals bepaald in [artikel 7.1.1][ref1],
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024256#Artikel7.1.1
    url: https://wetten.overheid.nl/BWBR0024256/2020-06-06#Artikel8.1.1
