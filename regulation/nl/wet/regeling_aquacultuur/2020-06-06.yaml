  - number: 2.1.4
    text: |-
      In afwijking van de [artikelen 2.1.2][ref1] en [2.1.3][ref2] wordt een vergunning niet verleend indien uit de
      vergunningaanvraag blijkt dat de activiteiten van het bedrijf leiden tot een onaanvaardbaar risico van verspreiding
      van de ziekten naar kwekerijen, kweekgebieden van weekdieren of bestanden van wilde waterdieren in de omgeving van
      kwekerijen of kweekgebieden van weekdieren.


      [ref1]: https://wetten.overheid.nl/BWBR0024256#Artikel2.1.2
      [ref2]: https://wetten.overheid.nl/BWBR0024256#Artikel2.1.3
