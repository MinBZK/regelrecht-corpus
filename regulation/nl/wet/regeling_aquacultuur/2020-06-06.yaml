  - number: 1.2.1
    text: |-
      1 De bevoegde autoriteit, bedoeld in een communautaire maatregel, die is genoemd in [artikel 1.1.1][ref1], en in
      een communautaire uitvoeringsmaatregel, is de Minister.

      2 In afwijking van het eerste lid, is ingeval een communautaire maatregel of een communautaire uitvoeringsmaatregel
      de bevoegde autoriteit een taak opdraagt die niet bestaat uit het nemen van een besluit, de bevoegde autoriteit
      de NVWA.


      [ref1]: https://wetten.overheid.nl/BWBR0024256#Artikel1.1.1
    url: https://wetten.overheid.nl/BWBR0024256/2020-06-06#Artikel1.2.1
    references:
      - id: ref1
