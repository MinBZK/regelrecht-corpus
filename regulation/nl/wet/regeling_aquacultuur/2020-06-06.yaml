  - number: 2.2.1
    text: |-
      1 De Minister houdt een openbaar register bij van aquacultuurproductiebedrijven en vergunninghoudende
      aquacultuurverwerkingsbedrijven.

      2 In het register, bedoeld in het eerste lid, worden opgenomen:

      a. voor vergunninghoudende aquacultuurproductiebedrijven, de gegevens omschreven in bijlage II, deel I, onderdeel
      I, van [richtlijn nr. 2006/88/EG](32006L0088);

      b. voor geregistreerde aquacultuurproductiebedrijven, de gegevens omschreven in bijlage II, deel I, onderdeel I,
      subonderdelen a, b en f, van [richtlijn nr. 2006/88/EG](32006L0088);

      c. voor vergunninghoudende aquacultuurverwerkingsbedrijven, de gegevens omschreven in bijlage II, deel II, van
      [richtlijn nr. 2006/88/EG](32006L0088).
    url: https://wetten.overheid.nl/BWBR0024256/2020-06-06#Artikel2.2.1
  - number: 2.3.1
    text: |-
      Vervoerders van aquacultuurdieren houden een register bij met daarin de volgende gegevens:

      a. de mortaliteit tijdens het vervoer, voor zover dit voor het soort vervoer en de vervoerde soorten in de praktijk
      mogelijk is;

      b. naam en adres van de door het vervoermiddel bezochte kwekerijen, kweekgebieden voor weekdieren en
      aquacultuurverwerkingsbedrijven, en

      c. gegevens ten aanzien van waterverversing tijdens het vervoer, met name de herkomst van nieuw water en de plaats
      van lozing van gebruikt water.
    url: https://wetten.overheid.nl/BWBR0024256/2020-06-06#Artikel2.3.1
  - number: 2.3.2
    text: |-
      1 Bij vervoer van aquacultuurdieren neemt de vervoerder zodanige beschermingsmaatregelen dat:

      a. de gezondheidsstatus van de aquacultuurdieren gedurende het vervoer van die dieren niet wijzigt;

      b. het risico van verspreiding van de in bijlage IV, deel II, vermelde ziekten afneemt, en

      c. de gezondheidsstatus van aquacultuurdieren op de plaats van bestemming of op de doorvoerplaatsen, niet in gevaar
      wordt gebracht.

      2 Het verversen van water tijdens het vervoer van aquacultuurdieren geschiedt op zodanige wijze dat de
      gezondheidsstatus van de vervoerde aquacultuurdieren, van de waterdieren op de plaats waar water wordt ververst en
      van de waterdieren op de plaats van bestemming, niet in gevaar wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0024256/2020-06-06#Artikel2.3.2
  - number: 3.1.1
    text: |-
      1 De Minister kan een gebied of compartiment vrij verklaren van één of meer van de niet-exotische ziekten, genoemd in
      __REF000___________________________________________________________________________________________________________
      _________, indien het gebied of compartiment voldoet aan de voorwaarden, bedoeld in artikel 50, eerste lid,
      onderdeel a, b of c, van [richtlijn nr. 2006/88/EG](32006L0088).

      2 De Minister geeft de verklaring, bedoeld in het eerste lid, slechts af voor een gebied of compartiment:

      a. dat 75% of minder van het Nederlands grondgebied omvat;

      b. dat niet bestaat uit een met een andere lidstaat of derde land gedeeld stroomgebied, en

      c. waar de op dat gebied of compartiment van toepassing zijnde voorschriften inzake bewaking, bemonstering en
      diagnosemethoden uit de krachtens artikel 50, vierde lid, van [richtlijn nr. 2006/88/EG](32006L0088) vastgestelde
      communautaire uitvoeringsmaatregel, zijn toegepast.

      3 De verklaring, bedoeld in het eerste lid, wordt door de Minister geschorst indien de Minister redenen heeft om
      aan te nemen dat niet wordt voldaan aan de eisen genoemd in het eerste lid.

      4 De schorsing, bedoeld in het derde lid, wordt opgeheven indien sprake is van een situatie als bedoeld in artikel
      53, tweede lid, van [richtlijn nr. 2006/88/EG](32006L0088).

      5 De verklaring, bedoeld in het eerste lid, wordt door de Minister ingetrokken indien sprake is van een situatie
      als bedoeld in artikel 53, derde lid, van [richtlijn nr. 2006/88/EG](32006L0088).

      6 Na intrekking als bedoeld in het vijfde lid, kan de Minister een gebied of compartiment opnieuw ziektevrij
      verklaren indien aan de voorwaarden van bijlage V, deel II, bij [richtlijn nr. 2006/88/EG](32006L0088) is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel8
