  - number: '8'
    text: |-
      Bij alle voertuigen met uitzondering van die in [bijlage V][ref1], vindt tot 1 januari 1996 de toetsing aan de
      eisen plaats door middel van een deskundigenonderzoek, voor zover deze eisen van toepassing zijn verklaard ten
      aanzien van de categorieën ’overig’ en ’geïmporteerd uit overige landen, geen verhuisboedel’.


      [ref1]: https://wetten.overheid.nl/BWBR0009226
    url: https://wetten.overheid.nl/BWBR0009226/2008-12-07#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0009226
  - number: '9'
    text: |-
      1 Met de in deze regeling vastgestelde technische normen of technische eisen worden gelijkgesteld daaraan
      gelijkwaardige technische normen of technische eisen, vastgesteld door of vanwege een andere lid-staat van de
      Europese Unie dan wel door of vanwege een staat die partij is bij de overeenkomst inzake de Europese Economische
      Ruimte.

      2 Met de in deze regeling geëiste onderzoeken of keuringen worden gelijkgesteld daaraan gelijkwaardige onderzoeken
      of keuringen, geëist door of vanwege een andere lid-staat van de Europese Unie dan wel door of vanwege een staat
      die partij is bij de overeenkomst inzake de Europese Economische Ruimte.
    url: https://wetten.overheid.nl/BWBR0009226/2008-12-07#Artikel9
  - number: '10'
    text: |-
      De regeling van de Minister van Verkeer en Waterstaat van 12 december 1994, nr. RV 188317, houdende eisen voor
      individuele goedkeuring (Stcrt. 248), wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0009226/2008-12-07#Artikel10
