preamble:
  text: |-
    Gelet op artikel 26, eerste en tweede lid, van de Wegenverkeerswet 1994 en artikel 2.2 van het Voertuigreglement;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0009226/2008-12-07#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt voor zover niet anders is bepaald, verstaan onder:

      a. datum eerste toelating: datum als bedoeld in de Regeling houdende vaststelling van regels omtrent de wijze
      waarop de datum van eerste toelating tot de openbare weg op het kentekenbewijs, dan wel het registratiebewijs van
      een voertuig wordt bepaald;

      b. deskundigenonderzoek: keuze van testen of delen daarvan, zodanig dat redelijkerwijs kan worden aangenomen dat
      aan alle van toepassing zijnde eisen is voldaan;

      c. verhuisboedel: een gebruikt voertuig dat in Nederland wordt ingevoerd als gevolg van de verhuizing van de
      eigenaar, die gedurende een periode van ten minste twaalf maanden direct voorafgaande aan het moment van verhuizing
      in een ander land woonachtig is geweest. Tevens moet het voertuig ten minste zes maanden direct voorafgaande aan
      het moment van verhuizing in dat andere land op naam van de eigenaar geregistreerd hebben gestaan;

      d. de Wet: de [Wegenverkeerswet 1994][ref1];

      e. zelfbalancerende bromfiets: een elektrisch aangedreven, zelfbalancerende, tweewielige, eenassige bromfiets met
      een wielbasis van 0 cm en met een door de constructie bepaalde maximumsnelheid van niet meer dan 25 km/h;

      f. zelfbouw: een voertuig dat is samengesteld uit onderdelen, waarvan minimaal de dragende constructie niet-
      bedrijfsmatig is vervaardigd.


      [ref1]: https://wetten.overheid.nl/BWBR0006622
