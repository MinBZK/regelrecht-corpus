  - number: 1a
    text: |-
      Deze regeling is niet van toepassing op voertuigen die ingevolge de [artikelen 3.2.1][ref1], [3.4.1][ref2],
      [3.5.1][ref3] en [3.6.1 van het Voertuigreglement][ref4] over een typegoedkeuring beschikken.


