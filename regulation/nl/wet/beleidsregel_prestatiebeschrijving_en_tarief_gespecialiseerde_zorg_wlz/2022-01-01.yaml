    text: |-
      Het doel van deze beleidsregel is om vast te leggen op welke wijze de NZa gebruik maakt van haar bevoegdheid om de
      prestatiebeschrijving en het tarief voor het jaar 2022 vast te stellen voor gespecialiseerde zorg in verband met
      het Syndroom van Korsakov.
    url: https://wetten.overheid.nl/BWBR0045775/2022-01-01#Artikel2
  - number: '3'
    text: |-
      Deze beleidsregel is van toepassing op de zorg of dienst als omschreven bij of krachtens de
      [Wet langdurige zorg][ref1] (Wlz) die wordt geleverd door zorgaanbieders.


      [ref1]: https://wetten.overheid.nl/BWBR0035917
    url: https://wetten.overheid.nl/BWBR0045775/2022-01-01#Artikel3
