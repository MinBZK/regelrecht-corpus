  - number: '4'
    text: |-
      Cliënten met onderstaande aandoening kunnen in aanmerking komen voor de prestatie gespecialiseerde zorg:

      − Syndroom van Korsakov.
    url: https://wetten.overheid.nl/BWBR0045775/2022-01-01#Artikel4
  - number: '5'
    text: |-
      De loon- en materiële kosten van de beleidsregelwaarde bevatten de definitieve percentages 2021 en de
      voorschotpercentages 2022.
    url: https://wetten.overheid.nl/BWBR0045775/2022-01-01#Artikel5
  - number: '6'
    text: |-
      De prestatie gespecialiseerde zorg is een prestatie voor de bekostiging van zorg die wordt geleverd aanvullend op
      de basisprestaties met verblijf met behandeling.

      De specialisatie blijkt ten minste uit de volgende kenmerken:

      − Cliënten verblijven op een afdeling met enkel cliënten uit de doelgroep;

      − Er is een in de doelgroep gespecialiseerd, multidisciplinair behandelteam aanwezig met alle relevante disciplines
      dat zowel gespecialiseerde zorg levert aan cliënten woonachtig in het expertisecentrum als ambulante zorg aan
      cliënten die niet woonachtig zijn in het expertisecentrum en elders zorg met verblijf (met of zonder behandeling)
      ontvangen;

      − De medewerkers op de woongroep/dagbesteding benaderen de cliënten doelgroepspecifiek;

      − De fysieke omgeving (gebouw/inventaris) is specifiek ingericht op de doelgroep.
    url: https://wetten.overheid.nl/BWBR0045775/2022-01-01#Artikel6
  - number: '7'
    text: |-
      1 Beleidsregelwaarde

      De NZa stelt het tarief in een tariefbeschikking vast op € 1.349,70 per dag (beleidsregelwaarde).

      Het tarief dat de NZa vaststelt op basis van deze beleidsregel is een maximumtarief. Een maximumtarief is een
      bedrag dat ten hoogste als tarief in rekening mag worden gebracht. De beleidsregelwaarde voor gespecialiseerde zorg
      [Wlz][ref1] is zodanig berekend dat de cliënt met de hoogste kosten hierbinnen past. Het is aan het zorgkantoor
      om per doelgroep met de desbetreffende zorgaanbieders passende tarieven af te spreken binnen de ruimte die het
      maximumtarief biedt Hierbij rekening houdend met doelmatigheid en gebaseerd op de voor die doelgroep benodigde
      kosten, oftewel begroting.

      De extra kosten per dag voor de prestatie worden bepaald aan de hand van een begroting. De begroting omvat de
      volgende kostenonderdelen:

        - Personeelskosten: directe en indirecte kosten van het beschikbare zorgteam en behandelaren van het
      expertisecentrum. Dit omvat tevens de vakinhoudelijke bijeenkomsten, interdisciplinaire overleggen, de
      opleidingskosten van het beschikbare personeel voor doelgroepspecifieke problematiek en de kosten die samenhangen
      met visitaties en audits die met regelmaat worden afgenomen;
        - Materiële kosten waaronder bijvoorbeeld ook het lidmaatschap van het landelijk kennisnetwerk.
        - Fysieke omgeving van het expertisecentrum: kosten van huisvesting en inventaris, waaronder kosten die te maken
      hebben met eventuele noodzakelijke beveiliging, doelgroep specifieke aanpassingen van de inventaris of het gebouw;
        - In de begroting zijn de directe en indirecte kosten voor ambulante zorg en consultatie en de hiermee gepaard
      gaande vervoerskosten van het zorgpersoneel afzonderlijk inzichtelijk gemaakt. Onder consultatie wordt mede
      verstaan het adviseren van andere Wlz-zorgaanbieders die zorg leveren aan Wlz-cliënten die niet woonachtig zijn
      in het expertisecentrum maar wel ten minste gediagnosticeerd zijn met het Syndroom van Korsakov en Wlz-zorg met
      verblijf (met of zonder behandeling) ontvangen.

      Vervolgens wordt op deze begroting in mindering gebracht een raming van de opbrengsten van de basisprestaties
      geleverd op de locatie waar de gespecialiseerde zorg wordt geleverd en een prijs per (lig)dag berekend.

