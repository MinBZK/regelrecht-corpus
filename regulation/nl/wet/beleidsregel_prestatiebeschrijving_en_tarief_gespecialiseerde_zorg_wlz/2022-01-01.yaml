  text: |-
    Gelet op artikel 57, eerste lid, onderdelen b en c, van de Wet marktordening gezondheidszorg (Wmg), stelt de
    Nederlandse Zorgautoriteit (NZa) beleidsregels vast met betrekking tot het uitoefenen van de bevoegdheid om
    tarieven en prestatiebeschrijvingen vast te stellen.
  url: https://wetten.overheid.nl/BWBR0045775/2022-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze beleidsregel wordt, tenzij anders vermeld, verstaan onder:

        - *directe kosten:* kosten voor extra inzet van personeel om cliëntgebonden zorg te leveren aan een cliënt of een
      groep cliënten.
        - *indirecte kosten:* kosten die samenhangen met het leveren van zorg niet zijnde directe cliëntgebonden kosten.
      Onder indirecte kosten vallen kosten als deskundigheidsbevordering, opleidingskosten, kosten indirect personeel
      (bestuur, ict, hrm) en kosten voor (zorggebonden) materialen, inventaris en kleine verbouwingen.
        - *Wlz-uitvoerder:* de rechtspersoon die geen zorgverzekeraar is en die zich overeenkomstig
      [artikel 4.1.1 van de Wet langdurige zorg][ref1] (Wlz) heeft aangemeld voor de uitvoering van de [Wlz][ref2],
      daaronder begrepen de met toepassing van [artikel 4.2.4, tweede lid, van de Wlz][ref3] door de Minister van VWS
      aangewezen uitvoerder.
        - *zorgaanbieder:* de natuurlijke persoon of rechtspersoon die beroeps- of bedrijfsmatig zorg verleent, als bedoeld
      in [artikel 1, onderdeel c, onder 1°, van de Wmg][ref4].
        - *expertisecentrum:* een (onderdeel van een) zorgaanbieder die gespecialiseerde zorg levert.
        - *doelgroep:* cliënten met een aanspraak op gespecialiseerde zorg in verband met het Syndroom van Korsakov zoals
      bedoeld in [artikel 2.2, eerste lid, onderdeel c, van de Rlz][ref5].


