  - number: '1.2'
    text: 'In deze wet en de daarop berustende bepalingen wordt onder het Antarctisch milieu mede verstaan:'
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel1
  - number: 1.2.a
    text: de van het Antarctisch milieu afhankelijke en daarmee samenhangende ecosystemen;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel1
  - number: 1.2.b
    text: |-
      de intrinsieke waarde van Antarctica, met inbegrip van de wildernis van Antarctica, de esthetische waarden en de
      waarde van Antarctica als gebied voor het verrichten van wetenschappelijk onderzoek, in het bijzonder onderzoek dat
      essentieel is voor inzicht in het milieu van de gehele aarde;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel1
  - number: 1.2.c
    text: de waarde van het Antarctisch gebied voor het verrichten van wetenschappelijk onderzoek;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel1
  - number: 1.2.d
    text: het klimaat en de samenstelling van de atmosfeer.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel1
  - number: '2.1'
    text: 'Deze wet is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel2
  - number: 2.1.a
    text: |-
      het aan boord houden van afvalstoffen of het lozen vanaf schepen in het mariene milieu of uit luchtvaartuigen
      tijdens de vlucht;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel2
  - number: 2.1.b
    text: |-
      voor zover dit verband houdt met het verzekeren van de veiligheid op zee: in elk geval het ontwerp, de bouw, de
      uitrusting en zeewaardigheid van schepen, het bemannen van schepen, de arbeidsvoorwaarden voor en de bekwaamheid
      van de bemanning, het gebruik van signalen, het onderhouden van verbindingen of het voorkomen van aanvaringen;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel2
  - number: 2.1.c
    text: |-
      voor zover dit verband houdt met het verzekeren van de veiligheid in het luchtruim: in elk geval het ontwerp, de
      bouw, de uitrusting en luchtwaardigheid van luchtvaartuigen, de arbeidsvoorwaarden voor en de bekwaamheid van de
      bemanning van luchtvaartuigen of het voorkomen van botsingen van luchtvaartuigen.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel2
  - number: '2.2'
    text: |-
      Deze wet is, met uitzondering van [artikel 3][ref1], niet van toepassing op scheep- en luchtvaart die geen verband
      houdt met een activiteit.


      [ref1]: https://wetten.overheid.nl/BWBR0009449#Artikel3
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009449
        artikel: '3'
        paragraaf: '1'
  - number: '3.1'
    text: Een ieder neemt in het Antarctisch gebied zo veel mogelijk zorg voor het Antarctisch milieu in acht.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel3
  - number: '3.2'
    text: |-
      De zorg, bedoeld in het eerste lid, houdt in dat een ieder die weet of redelijkerwijs kan vermoeden dat door zijn
      handelen of nalaten nadelige gevolgen voor het Antarctisch milieu kunnen worden veroorzaakt, verplicht is dergelijk
      handelen achterwege te laten voor zover zulks in redelijkheid kan worden gevergd, dan wel alle maatregelen te nemen
      die redelijkerwijs van hem kunnen worden gevergd teneinde die gevolgen te voorkomen of, voor zover die gevolgen
      niet kunnen worden voorkomen, deze zoveel mogelijk te beperken of ongedaan te maken.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel3
  - number: '3.3'
    text: |-
      Onder het voorkomen van nadelige gevolgen voor het Antarctisch milieu als bedoeld in het tweede lid wordt voor wat
      betreft de organisator in ieder geval verstaan het treffen van redelijke preventieve maatregelen, die gericht zijn
      op het verminderen van het risico van milieubedreigende noodsituaties en de mogelijke nadelige gevolgen daarvan.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel3
  - number: '3.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de maatregelen,
      bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel3
  - number: '3.5'
    text: |-
      Het bepaalde in het eerste en tweede lid laat onverlet de uit het burgerlijk recht voortvloeiende aansprakelijkheid
      en de mogelijkheid van rechtspersonen als bedoeld in [artikel 1, boek 2 van het Burgerlijk Wetboek][ref1], en
      [artikel 1, boek 2 van het Burgerlijk Wetboek BES][ref2], om uit dien hoofde in rechte op te treden.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0028744#Artikel1
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0028744
        artikel: '1'
  - number: 3a.1
    text: |-
      De organisator draagt voorafgaand aan de uitvoering van een activiteit zorg voor het treffen van voldoende
      maatregelen om de gezondheid en veiligheid van de mens te waarborgen. Onze Ministers kunnen aan de organisator
      verzoeken daartoe schriftelijke bewijsstukken te overleggen.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel3a
  - number: 3a.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het overleggen van
      de in het eerste lid bedoelde bewijsstukken.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel3a
  - number: 3a.3
    text: |-
      Voor de uitvoering van de maatregelen, bedoeld in het eerste lid, is de organisator niet afhankelijk van de
      ondersteuning door partijen of andere organisatoren, tenzij hij aantoont dat deze zich daartoe in een schriftelijke
      overeenkomst hebben verbonden.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel3a
  - number: 3a.4
    text: |-
      De organisator houdt een voldoende verzekering of andere financiële zekerheid aan ter dekking van de kosten die
      betrekking hebben op opsporings- en reddingsacties, medische zorg en evacuatie.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel3a
  - number: 3a.5
    text: |-
      Voor zover de activiteit plaatsvindt aan boord van een schip of een luchtvaartuig, kan de organisator volstaan
      met het aantonen dat de maatregelen, bedoeld in het eerste lid, en de verzekering of andere financiële zekerheid,
      bedoeld in het vierde lid, door een ander dan de organisator zijn getroffen respectievelijk in stand worden
      gehouden.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel3a
  - number: '4'
    text: |-
      Onze Ministers houden er bij de uitoefening van hun bevoegdheden krachtens deze wet rekening mee dat het belang van
      de bescherming van het Antarctisch milieu in ieder geval vereist dat:
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel4
  - number: 4.a
    text: het ontstaan van afvalstoffen in het Antarctisch gebied zoveel mogelijk wordt voorkomen of beperkt;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel4
  - number: 4.b
    text: |-
      bij de vervaardiging van stoffen, preparaten en andere produkten, die in het Antarctisch gebied worden gebracht,
      wordt gebruik gemaakt van stoffen en materialen die na gebruik voor het doel waarvoor de produkten waren bestemd,
      geen nadelige gevolgen voor het Antarctisch milieu veroorzaken;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel4
  - number: 4.c
    text: |-
      in het Antarctisch gebied te brengen stoffen, preparaten of andere produkten, zo mogelijk, meer dan eenmaal worden
      gebruikt;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel4
  - number: 4.d
    text: |-
      afvalstoffen zo veel mogelijk ofwel, afhankelijk van de plaats van aanvang van de activiteit, in Nederland,
      daaronder begrepen de openbare lichamen, worden verwijderd ofwel in een ander land waar regelingen zijn getroffen
      voor het storten of verbranden van dit afval overeenkomstig internationale overeenkomsten;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel4
  - number: 4.e
    text: |-
      het onttrekken van levende rijkdommen aan hun populatie zo veel mogelijk wordt voorkomen en, voor zover dit niet
      kan worden voorkomen, zo min mogelijk pijn en lijden met zich brengt;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel4
  - number: 4.f
    text: |-
      bij de uitvoering en planning van activiteiten voorrang wordt verleend aan wetenschappelijk onderzoek, waarbij het
      behoud van de waarde van Antarctica als gebied voor het verrichten van wetenschappelijk onderzoek, met name voor
      onderzoek dat essentieel is voor inzicht in het Antarctisch milieu en het milieu van de gehele aarde, voorop staat;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel4
  - number: 4.g
    text: |-
      activiteiten niet anderszins in strijd met de beginselen, neergelegd in artikel 3 van het Protocol worden
      uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel4
  - number: '5'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld ter uitvoering van een maatregel als bedoeld in
      artikel IX, eerste lid, van het Verdrag.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel5
  - number: '6.1'
    text: 'Het is verboden in het Antarctisch gebied:'
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel6
  - number: 6.1.a
    text: zich van gevaarlijke afvalstoffen of van andere afvalstoffen die vast en niet-brandbaar zijn, te ontdoen;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel6
  - number: 6.1.b
    text: |-
      zich van andere afvalstoffen dan bedoeld onder a, die brandbaar zijn en waarvan de houder zich niet buiten het
      Antarctisch gebied kan ontdoen, te ontdoen, anders dan door verbranding in een emissie-arme verbrandingsoven;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel6
  - number: 6.1.c
    text: 'zich van andere afvalstoffen dan bedoeld onder a en b te ontdoen door deze:'
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel6
  - number: 6.1.c.1°
    text: in zoetwatersystemen te brengen, of
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel6
  - number: 6.1.c.2°
    text: in een gebied dat in de Antarctische zomer ijsvrij is, op of in de bodem te brengen;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel6
  - number: 6.1.d
    text: kernontploffingen te laten plaatsvinden of zich te ontdoen van radioactieve afvalstoffen;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel6
  - number: 6.1.e
    text: historische plaatsen of monumenten te beschadigen of te verwijderen;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel6
  - number: 6.1.f
    text: |-
      levende organismen, met uitzondering van gecultiveerde planten en hun voortplantingscellen voor gecontroleerd
      gebruik, exemplaren van levende organismen voor gecontroleerd experimenteel gebruik en planten bestemd als voedsel,
      binnen te brengen;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel6
  - number: 6.1.g
    text: dode dieren of delen daarvan, die niet bestemd zijn als voedsel, binnen te brengen;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel6
  - number: 6.1.h
    text: in afwijking van het bepaalde in onderdeel f, vogels en honden binnen te brengen;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel6
  - number: 6.1.i
    text: opzettelijk niet-steriele aarde binnen te brengen;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel6
  - number: 6.1.j
    text: minerale rijkdommen te exploreren of te exploiteren.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel6
  - number: '6.2'
    text: 'Het is tevens verboden in of vanuit het Antarctisch gebied:'
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel6
  - number: 6.2.a
    text: onderzoek te doen naar de aanwezigheid van minerale rijkdommen;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel6
  - number: 6.2.b
    text: levende rijkdommen aan hun populatie te onttrekken dan wel schadelijk op te treden tegen levende rijkdommen;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel6
  - number: 6.2.c
    text: dode exemplaren van levende rijkdommen, dan wel resten daarvan, buiten het Antarctisch gebied te brengen;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel6
  - number: 6.2.d
    text: |-
      gecultiveerde planten en hun voortplantingscellen voor gecontroleerd gebruik en exemplaren van levende organismen
      voor gecontroleerd experimenteel gebruik binnen te brengen;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel6
  - number: 6.2.e
    text: planten en dode dieren bestemd als voedsel, binnen te brengen;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel6
  - number: 6.2.f
    text: |-
      bestrijdingsmiddelen, polychloorbyfenylen, chips, polystyrene bolletjes of daarmee naar zijn aard vergelijkbaar
      verpakkingsmateriaal binnen te brengen;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel6
  - number: 6.2.g
    text: |-
      speciaal beschermd Antarctisch gebied te betreden, anders dan door een internationale waarnemer voor een inspectie
      als bedoeld in artikel VII van het Verdrag en artikel 14 van het Protocol;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel6
  - number: 6.2.h
    text: zich van afvalwater dat landinwaarts is ontstaan, te ontdoen door dit op of in ijs of sneeuw te brengen;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel6
  - number: 6.2.i
    text: afvalwater in zee te brengen.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel6
  - number: '6.3'
    text: |-
      De in het tweede lid, onder a tot en met i, bedoelde verboden gelden niet indien een activiteit vanuit een ander
      land dat partij is bij het Protocol wordt georganiseerd en de door dat land bij vergunning dan wel anderszins
      gegeven toestemming voor het uitvoeren van de activiteit uitdrukkelijk de toestemming tot het verrichten van de
      betrokken handeling omvat.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel6
  - number: '7.1'
    text: |-
      Voor activiteiten die meer dan een gering of tijdelijk effect kunnen hebben op het Antarctisch milieu wordt bij de
      voorbereiding van een beslissing op de aanvraag om een vergunning een milieueffectrapport gemaakt.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel7
  - number: '7.2'
    text: |-
      De [artikelen 16.42a][ref1], [16.43, vijfde lid][ref2], [16.45 tot en met 16.53b][ref3] en
      [16.139, eerste lid, onder a, van de Omgevingswet][ref4] zijn van overeenkomstige toepassing, met dien verstande
      dat voor «milieu» gelezen wordt: Antarctisch milieu.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0037885#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0037885#Artikel16
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0037885
        artikel: '16'
      - id: ref3
        bwb_id: BWBR0037885
        artikel: '16'
      - id: ref4
        bwb_id: BWBR0037885
        artikel: '16'
  - number: '7.3'
    text: Bij het milieueffectrapport wordt een Engelse vertaling gevoegd.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel7
  - number: 7a.1
    text: De organisator stelt voorafgaand aan elke activiteit een rampenplan op.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel7a
  - number: 7a.2
    text: |-
      Bij het opstellen en tenuitvoerleggen van een rampenplan, bedoeld in het eerste lid, werkt de organisator
      zoveel mogelijk samen met elke partij of andere natuurlijke of rechtspersoon die in het desbetreffende gebied
      een activiteit organiseert of uitvoert. Voor de uitvoering van het rampenplan, bedoeld in het eerste lid, is de
      organisator niet afhankelijk van de ondersteuning door partijen of andere organisatoren, tenzij hij aantoont dat
      deze zich daartoe in een schriftelijke overeenkomst hebben verbonden.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel7a
  - number: 7a.3
    text: |-
      Voor zover de activiteit plaatsvindt aan boord van een schip of een luchtvaartuig, kan de organisator volstaan met
      het aantonen dat het rampenplan, bedoeld in het eerste lid, door een ander dan de organisator is opgesteld.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel7a
  - number: '8.1'
    text: Het is een organisator verboden zonder vergunning van Onze Ministers een activiteit uit te voeren.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel8
  - number: '8.2'
    text: |-
      Het is verboden aan een activiteit deel te nemen, voor de uitvoering waarvan een vergunning in de zin van deze wet
      is vereist, doch niet is verleend.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel8
  - number: '8.3'
    text: |-
      Het in het eerste lid bedoelde verbod geldt niet indien een activiteit wordt georganiseerd vanuit een ander
      land dat partij is bij het Protocol en dat land bij vergunning of anderszins toestemming heeft gegeven voor het
      uitvoeren van de activiteit.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel8
  - number: '9.1'
    text: |-
      Indien de aanvraag daarop uitdrukkelijk mede betrekking heeft, kunnen Onze Ministers, in afwijking van artikel
      6, tweede lid, in een vergunning toestemming verlenen tot de bij dat artikel verboden handelingen, voor zover het
      betreft handelingen:
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel9
  - number: 9.1.a
    text: |-
      ten behoeve van een noodzakelijk wetenschappelijk doel dat niet elders kan worden gediend en mits het voortbestaan
      of het herstel van een plantensoort of diersoort of plaatselijke populatie niet in gevaar wordt gebracht en het
      natuurlijke ecosysteem ter plaatse niet wordt geschaad of bedreigd;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel9
  - number: 9.1.b
    text: |-
      als bedoeld in [artikel 6, tweede lid, onder f][ref1], bovendien ten behoeve van hygiënische of medische
      doeleinden;


      [ref1]: https://wetten.overheid.nl/BWBR0009449#Artikel6
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009449
        artikel: '6'
        paragraaf: '2'
  - number: 9.1.c
    text: |-
      als bedoeld in [artikel 6, tweede lid, onder e][ref1], bovendien ten behoeve van de voedselvoorziening van de
      organisator, de deelnemers aan een activiteit en de in verband met de uitvoering van de activiteit werkzame
      personen;


      [ref1]: https://wetten.overheid.nl/BWBR0009449#Artikel6
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009449
        artikel: '6'
        paragraaf: '2'
  - number: 9.1.d
    text: |-
      als bedoeld in [artikel 6, tweede lid, onder g][ref1], bovendien ten behoeve van niet-wetenschappelijke
      activiteiten met als doel het bezoeken van een historische plaats of een historisch monument in een op grond van
      het tweede lid daartoe aangewezen speciaal beschermd Antarctisch gebied.


      [ref1]: https://wetten.overheid.nl/BWBR0009449#Artikel6
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009449
        artikel: '6'
        paragraaf: '2'
  - number: '9.2'
    text: |-
      Bij regeling van Onze Ministers kan een speciaal beschermd Antarctisch gebied worden aangewezen als bedoeld
      in het eerste lid, onder d, indien het Beheersplan, bedoeld in artikel 5 van bijlage V van het Protocol, niet-
      wetenschappelijke activiteiten uitdrukkelijk toestaat. Die regeling bevat nadere regels over het betreden van het
      aangewezen speciaal beschermd Antarctisch gebied ter bescherming van het Antarctisch milieu.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel9
  - number: '10.1'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de wijze waarop de aanvraag om
      de vergunning moet geschieden en de gegevens die door de aanvrager moeten worden verstrekt met het oog op de
      beslissing op de aanvraag.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel10
  - number: '10.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen adviseurs worden aangewezen, die in de gelegenheid moeten worden gesteld
      advies uit te brengen over het ontwerp van de beschikking op de aanvraag om een vergunning.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel10
  - number: '10.3'
    text: |-
      De voordracht voor een algemene maatregel van bestuur als bedoeld in het eerste of tweede lid, wordt gedaan door
      Onze Ministers.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel10
  - number: '11'
    text: |-
      Op de voorbereiding van een beschikking op de aanvraag om een vergunning zijn
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] en [afdeling 13.2 van de Wet milieubeheer][ref2] van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Afdeling13.2
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0003245
        afdeling: '13.2'
  - number: '12.1'
    text: 'Onze Ministers betrekken bij de beslissing op de aanvraag in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel12
  - number: 12.1.a
    text: |-
      de omvang, de duur en de intensiteit van de activiteit in relatie met het gebied waar de activiteit wordt
      uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel12
  - number: 12.1.b
    text: de cumulatieve effecten van de combinatie met andere activiteiten;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel12
  - number: 12.1.c
    text: de nadelige beïnvloeding door de activiteit van andere activiteiten;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel12
  - number: 12.1.d
    text: |-
      de beschikbaarheid van technologie, procedures en andere mogelijkheden om de nadelige gevolgen voor het milieu die
      de activiteit kan veroorzaken, te voorkomen, dan wel zoveel mogelijk te beperken, voor zover zij niet kunnen worden
      voorkomen;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel12
  - number: 12.1.e
    text: |-
      de deskundigheid van de organisator onderscheidenlijk de in verband met de uitvoering van een activiteit werkzame
      personen;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel12
  - number: 12.1.f
    text: |-
      het rampenplan, bedoeld in [artikel 7a, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009449#Artikel7a
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0009449
        artikel: 7a
        paragraaf: 3a
  - number: 12.1.g
    text: |-
      de maatregelen en verzekering of andere financiële zekerheid, bedoeld in[ artikel 3a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009449#Artikel3a
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0009449
        artikel: 3a
        paragraaf: '1'
  - number: 12.1.h
    text: |-
      de verzekering of andere financiële zekerheid, bedoeld in [artikel 25f][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009449#Artikel25f
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0009449
        artikel: 25f
        paragraaf: 5a
  - number: '12.2'
    text: 'Onze Ministers nemen bij de beslissing op de aanvraag in ieder geval in acht:'
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel12
  - number: 12.2.a
    text: |-
      de voor hen geldende krachtens [artikel 5][ref1] gestelde regels;


      [ref1]: https://wetten.overheid.nl/BWBR0009449#Artikel5
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0009449
        artikel: '5'
        paragraaf: '1'
  - number: 12.2.b
    text: |-
      indien in de vergunning toegang tot of het ondernemen van een activiteit in een speciaal beschermd Antarctisch
      gebied of speciaal beheerd Antarctisch gebied wordt toegestaan: het krachtens artikel 5 van bijlage V van het
      Protocol bepaalde.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel12
  - number: '13.1'
    text: Een vergunning kan in het belang van de bescherming van het Antarctisch milieu worden geweigerd.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel13
  - number: '13.2'
    text: |-
      Een vergunning kan worden geweigerd indien gegronde vrees bestaat dat de vergunninghouder niet overeenkomstig het
      bij of krachtens deze wet bepaalde zal handelen.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel13
  - number: '13.3'
    text: 'Een vergunning wordt in ieder geval geweigerd indien:'
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel13
  - number: 13.3.a
    text: |-
      de Consultatieve Vergadering, ingesteld op grond van artikel IX, eerste lid, van het verdrag inzake Antarctica,
      over het betrokken milieu-effectrapport een negatief oordeel heeft gegeven;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel13
  - number: 13.3.b
    text: onvoldoende zekerheid bestaat dat ernstige nadelige gevolgen voor het Antarctisch milieu kunnen worden voorkomen;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel13
  - number: 13.3.c
    text: |-
      de maatregelen, bedoeld in [artikel 3a][ref1], onvoldoende zijn om de gezondheid en veiligheid van de mens te
      waarborgen;


      [ref1]: https://wetten.overheid.nl/BWBR0009449#Artikel3a
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009449
        artikel: 3a
        paragraaf: '1'
  - number: 13.3.d
    text: |-
      het rampenplan, bedoeld in [artikel 7a][ref1], onvoldoende is om gezondheid en veiligheid, opsporing en redding,
      medische zorg en evacuatie te waarborgen;


      [ref1]: https://wetten.overheid.nl/BWBR0009449#Artikel7a
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009449
        artikel: 7a
        paragraaf: 3a
  - number: 13.3.e
    text: |-
      het rampenplan, bedoeld in [artikel 7a][ref1], onvoldoende is om ongevallen met mogelijk nadelige gevolgen voor het
      Antarctisch milieu te bestrijden.


      [ref1]: https://wetten.overheid.nl/BWBR0009449#Artikel7a
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009449
        artikel: 7a
        paragraaf: 3a
  - number: '14.1'
    text: |-
      In een vergunning wordt duidelijk aangegeven waarop zij betrekking heeft. De aanvraag om de vergunning maakt deel
      uit van de vergunning, voor zover dat in de vergunning is aangegeven.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel14
  - number: '14.2'
    text: Een vergunning kan in het belang van de bescherming van het Antarctisch milieu onder beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel14
  - number: '14.3'
    text: |-
      Aan een vergunning worden de voorschriften verbonden, die nodig zijn ter bescherming van het Antarctisch milieu.
      Voor zover door het verbinden van voorschriften aan de vergunning de nadelige gevolgen die een activiteit voor het
      Antarctisch milieu kan veroorzaken, niet kunnen worden voorkomen, worden aan de vergunning voorschriften verbonden,
      die de grootst mogelijke bescherming bieden tegen die gevolgen.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel14
  - number: '15'
    text: 'De aan een vergunning te verbinden voorschriften houden in ieder geval in:'
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel15
  - number: 15.a
    text: |-
      indien in de vergunning het onttrekken van levende rijkdommen aan hun populatie dan wel schadelijk optreden tegen
      levende rijkdommen, bedoeld in [artikel 6, tweede lid, onder b][ref1], wordt toegestaan:


      [ref1]: https://wetten.overheid.nl/BWBR0009449#Artikel6
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0009449
        artikel: '6'
        paragraaf: '2'
  - number: 15.a.1°
    text: de handeling die wordt toegestaan, alsmede wanneer, waar en door wie de handeling mag worden verricht;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel15
  - number: 15.a.2°
    text: |-
      dat niet meer exemplaren aan hun populatie worden onttrokken dan strikt noodzakelijk is voor het wetenschappelijk
      doel, bedoeld in [artikel 9, onder a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009449#Artikel9
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0009449
        artikel: '9'
        paragraaf: '4'
  - number: 15.a.3°
    text: |-
      dat het voortbestaan of het herstel van een plantensoort of diersoort of plaatselijke populatie niet in gevaar
      wordt gebracht en het natuurlijke ecosysteem ter plaatse niet wordt geschaad of bedreigd;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel15
  - number: 15.a.4°
    text: |-
      dat het onttrekken zo min mogelijk pijn en lijden met zich brengt en uitsluitend letale technieken worden gebruikt
      indien er geen geschikte alternatieve techniek voor bestaat;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel15
  - number: 15.b
    text: |-
      indien in de vergunning het binnenbrengen van gecultiveerde planten en hun voortplantingscellen voor gecontroleerd
      gebruik en exemplaren van levende organismen voor gecontroleerd experimenteel gebruik wordt toegestaan:
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel15
  - number: 15.b.1°
    text: |-
      de soorten, aantallen, leeftijden en geslachten alsmede de voorzorgen die worden genomen om ontsnapping of contact
      met de inheemse flora en fauna te voorkomen;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel15
  - number: 15.b.2°
    text: |-
      dat deze vóór het verlopen van de vergunning uit het Antarctisch gebied worden verwijderd of worden verwijderd
      door verbranding dan wel met behulp van even doeltreffende middelen waardoor risico voor de inheemse flora en fauna
      wordt uitgesloten;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel15
  - number: 15.c
    text: 'indien in de vergunning het binnenbrengen van planten en dode dieren bestemd als voedsel, wordt toegestaan:'
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel15
  - number: 15.c.1°
    text: |-
      dat geslacht pluimvee voordat het wordt verpakt voor verzending naar het Antarctisch gebied, wordt gecontroleerd op
      tekenen van ziekten, zoals de ziekte van Newcastle, tuberculose en gistinfectie;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel15
  - number: 15.c.2°
    text: |-
      dat de niet geconsumeerde delen van dieren en planten onder zorgvuldig gecontroleerde omstandigheden worden
      bewaard en uit het Antarctisch gebied worden verwijderd of worden verwijderd door verbranding in een emissie-arme
      verbrandingsoven of met behulp van even doeltreffende middelen, waardoor risico voor de inheemse flora en fauna
      wordt uitgesloten;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel15
  - number: 15.d
    text: |-
      dat het onbedoeld binnen het Antarctisch gebied brengen van niet-steriele aarde wordt voorkomen door het treffen
      van voorzorgsmaatregelen;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel15
  - number: 15.e
    text: |-
      dat het onbedoeld binnen het Antarctisch gebied brengen van niet in de inheemse flora en fauna aanwezig
      zijnde micro-organismen, zoals virussen, bacteriën, gisten en schimmels, wordt voorkomen door het treffen van
      voorzorgsmaatregelen;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel15
  - number: 15.f
    text: |-
      dat indien wordt toegestaan dat een houder van afvalwater dat landinwaarts is ontstaan, zich van dit afvalwater
      ontdoet door dit op of in ijs te brengen, dit uitsluitend is toegestaan in diepe ijsputten, die niet worden
      aangelegd op bekende stroomlijnen in ijs die eindigen bij ijsvrije gebieden of in gebieden met een hoge afsmelting;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel15
  - number: 15.g
    text: 'dat afvalwater slechts in zee mag worden geloosd, indien:'
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel15
  - number: 15.g.1°
    text: dit door een septic-tank is geleid en
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel15
  - number: 15.g.2°
    text: het lozingspunt zodanig is aangebracht dat het afvalwater onmiddellijk wordt verdund en verspreid;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel15
  - number: 15.h
    text: |-
      dat de te verwijderen afvalstoffen zodanig worden opgeslagen dat verspreiding daarvan naar het Antarctisch milieu
      wordt voorkomen;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel15
  - number: 15.i
    text: |-
      indien in de vergunning toegang tot of het ondernemen van een activiteit in een speciaal beschermd Antarctisch
      gebied wordt toegestaan:
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel15
  - number: 15.i.1°
    text: |-
      de omvang en de ligging van het gedeelte van het desbetreffende speciaal beschermd Antarctisch gebied met
      betrekking waartoe toestemming is verleend, en de activiteit waarvoor zij is verleend;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel15
  - number: 15.i.2°
    text: |-
      dat de organisator en voor een organisator in verband met de uitvoering van een activiteit werkzame personen een
      exemplaar van de vergunning bij zich dragen, indien zij zich in het desbetreffend speciaal beschermd Antarctisch
      gebied bevinden;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel15
  - number: 15.i.3°
    text: |-
      de voorschriften die ter uitvoering van het bepaalde krachtens artikel 5 van bijlage V van het Protocol aan de
      vergunning dienen te worden verbonden;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel15
  - number: 15.j
    text: |-
      dat, indien de organisator in het Antarctisch gebied gebruik maakt van een schip met meer dan 500 passagiers aan
      boord, er niet aan land mag worden gegaan in het Antarctisch gebied;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel15
  - number: 15.k
    text: |-
      dat, indien de organisator in het Antarctisch gebied gebruik maakt van een schip met 500 of minder passagiers aan
      boord:
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel15
  - number: 15.k.1°
    text: |-
      de organisator samenwerkt met de andere in het desbetreffende deel van het Antarctisch gebied aanwezige
      organisatoren, ten einde te voorkomen dat zich op enig moment meer dan één toeristenschip bevindt bij een
      aanlandplaats;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel15
  - number: 15.k.2°
    text: |-
      bij aanlandingen in het Antarctisch gebied, het aantal passagiers, afkomstig van dat aangelande schip, dat
      tegelijkertijd aan wal is, op ieder moment beperkt blijft tot ten hoogste 100 personen;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel15
  - number: 15.k.3°
    text: bij aanlandingen in het Antarctisch gebied, de organisator zorgt voor een verhouding van 1 gids per 20 passagiers;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel15
  - number: 15.l
    text: |-
      dat, in afwijking van de onderdelen j en k, onder 2° en 3°, ten minste de vastgestelde limieten gelden van een
      maatregel als bedoeld in artikel IX, eerste lid, van het Verdrag. Een in de eerste volzin bedoelde limiet geldt met
      ingang van een tijdstip dat in de Staatscourant wordt bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel15
  - number: '16.1'
    text: 'De aan een vergunning te verbinden voorschriften kunnen voorts in ieder geval inhouden:'
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel16
  - number: 16.1.a
    text: |-
      dat daarbij aangegeven metingen, berekeningen en tellingen worden verricht ter bepaling van de mate waarin de
      activiteit nadelige gevolgen voor het Antarctisch milieu veroorzaakt;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel16
  - number: 16.1.b
    text: |-
      dat in een mate als bij het voorschrift aangegeven, onderzoek wordt verricht naar mogelijkheden tot verdergaande
      bescherming van het Antarctisch milieu dan waarin de andere aan de vergunning verbonden voorschriften voorzien;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel16
  - number: 16.1.c
    text: |-
      dat de uitkomsten van daarbij aangegeven metingen, berekeningen en tellingen of onderzoeken worden geregistreerd en
      bewaard dan wel worden gemeld of ter beschikking gesteld van Onze Ministers;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel16
  - number: 16.1.d
    text: |-
      dat wordt voldaan aan daarbij aangegeven eisen ten aanzien van de vakbekwaamheid van de organisator of in verband
      met de uitvoering van een activiteit werkzame personen;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel16
  - number: 16.1.e
    text: |-
      dat aan deelnemers en voor een organisator in verband met de uitvoering van een activiteit werkzame personen
      schriftelijk instructies worden gegeven om handelen in strijd met de vergunning of de daaraan verbonden
      voorschriften tegen te gaan en dat toezicht wordt gehouden op het naleven van die instructies;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel16
  - number: 16.1.f
    text: |-
      dat degene aan wie de vergunning is verleend, financiële zekerheid stelt voor het nakomen van krachtens de
      vergunning voor hem geldende verplichtingen en ter dekking van zijn aansprakelijkheid voor schade die voortvloeit
      uit door de betrokken activiteit veroorzaakte nadelige gevolgen voor het Antarctisch milieu.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel16
  - number: '16.2'
    text: |-
      Bij een voorschrift als bedoeld in het eerste lid, onder f, geven Onze Ministers ten minste aan het bedrag waarvoor
      en de termijn gedurende welke de zekerheid in stand moet worden gehouden, alsmede de voorwaarden waaraan moet
      worden voldaan alvorens de verplichting kan komen te vervallen.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel16
  - number: '16.3'
    text: |-
      Bij een voorschrift als bedoeld in het eerste lid, onder f, kunnen nadere eisen worden gesteld voor gevallen waarin
      aan de verplichting uitvoering wordt gegeven door het sluiten en in stand houden van een verzekering. Daarbij wordt
      rekening gehouden met hetgeen redelijkerwijs door verzekering kan worden gedekt.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel16
  - number: '16.4'
    text: |-
      Indien een voorschrift als bedoeld in het eerste lid, onder f, aan een vergunning is verbonden, kunnen Onze
      Ministers bij het niet nakomen door de houder van de vergunning van een krachtens de vergunning voor hem geldende
      verplichting waarvoor financiële zekerheid is gesteld, bepalen tot welk bedrag zij verhaal zullen nemen op de
      gestelde zekerheid. Onze Ministers kunnen het te verhalen bedrag invorderen bij dwangbevel.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel16
  - number: '17'
    text: 'In een vergunning kan worden bepaald:'
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel17
  - number: 17.a
    text: |-
      dat daarbij aangegeven voorschriften eerst van kracht worden op een daarbij aangegeven tijdstip dan wel wanneer een
      daarbij aangegeven omstandigheid zich voordoet;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel17
  - number: 17.b
    text: dat daarbij aangewezen voorschriften slechts gelden tot een daarbij aangegeven tijdstip dan wel omstandigheid;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel17
  - number: 17.c
    text: |-
      dat daarbij aangewezen voorschriften nadat de vergunning haar gelding heeft verloren, gedurende een daarbij
      aangegeven termijn van kracht blijven.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel17
  - number: '18'
    text: In een vergunning wordt bepaald dat zij slechts geldt voor een daarbij vast te stellen termijn.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel18
  - number: '19.1'
    text: |-
      Een vergunning geldt voor degene aan wie zij is verleend. Deze draagt ervoor zorg dat de aan de vergunning
      verbonden voorschriften worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel19
  - number: '19.2'
    text: |-
      De vergunninghouder overhandigt aan alle deelnemers aan de desbetreffende activiteit een exemplaar van de
      vergunning, vergezeld van een vertaling in de Engelse taal.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel19
  - number: '20.1'
    text: |-
      Indien dit in het belang van de bescherming van het Antarctisch milieu noodzakelijk is, worden beperkingen
      waaronder een vergunning is verleend en voorschriften die daaraan zijn verbonden, door Onze Ministers gewijzigd,
      aangevuld of ingetrokken dan wel worden alsnog beperkingen aangebracht of voorschriften aan een vergunning
      verbonden.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel20
  - number: '20.2'
    text: |-
      Een ieder, met uitzondering van de vergunninghouder, kan Onze Ministers verzoeken een vergunning in het belang van
      de bescherming van het Antarctisch milieu met toepassing van het eerste lid te wijzigen.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel20
  - number: '20.3'
    text: |-
      Met betrekking tot de beslissing ter zake van de inhoud van de beperkingen en voorschriften zijn de
      [artikelen 12][ref1], [14, derde lid][ref2], en [15 tot en met 19][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009449#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0009449#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0009449#Artikel15
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0009449
        artikel: '12'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0009449
        artikel: '14'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0009449
        artikel: '15'
        paragraaf: '4'
  - number: '20.4'
    text: |-
      Op de voorbereiding van de beschikking zijn [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] en
      [afdeling 13.2 van de Wet milieubeheer][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Afdeling13.2
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0003245
        afdeling: '13.2'
  - number: '21.1'
    text: |-
      Op aanvraag van de vergunninghouder kunnen Onze Ministers beperkingen waaronder een vergunning is verleend, en
      voorschriften die daaraan zijn verbonden, wijzigen, aanvullen, of intrekken, dan wel alsnog beperkingen aanbrengen
      of voorschriften aan de vergunning verbinden.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel21
  - number: '21.2'
    text: |-
      Met betrekking tot de beslissing ter zake en de inhoud van die beperkingen en voorschriften zijn de
      [artikelen 12 tot en met 19][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009449#Artikel12
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0009449
        artikel: '12'
        paragraaf: '4'
  - number: '21.3'
    text: |-
      Op de voorbereiding van de beschikking zijn [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] en
      [afdeling 13.2 van de Wet milieubeheer][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Afdeling13.2
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0003245
        afdeling: '13.2'
  - number: '22.1'
    text: |-
      Onze Ministers trekken een vergunning voor een activiteit geheel of gedeeltelijk in indien de activiteit
      ontoelaatbaar nadelige gevolgen voor het Antarctisch milieu veroorzaakt of dreigt te veroorzaken, en door wijziging
      van de vergunning het optreden van die gevolgen onvoldoende kan worden voorkomen.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel22
  - number: '22.2'
    text: |-
      Onze Ministers trekken een vergunning in, voor zover regels, vastgesteld krachtens [artikel 5][ref1], hiertoe
      verplichten.


      [ref1]: https://wetten.overheid.nl/BWBR0009449#Artikel5
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0009449
        artikel: '5'
        paragraaf: '1'
  - number: '22.3'
    text: Een ieder kan Onze Ministers verzoeken een vergunning met toepassing van het eerste lid in te trekken.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel22
  - number: '22.4'
    text: |-
      Met betrekking tot een beslissing als bedoeld in het eerste lid, zijn de [artikelen 13 tot en met 19][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009449#Artikel13
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0009449
        artikel: '13'
        paragraaf: '4'
  - number: '22.5'
    text: |-
      Op de voorbereiding van de beschikking krachtens het eerste lid zijn
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] en [afdeling 13.2 van de Wet milieubeheer][ref2] van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Afdeling13.2
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0003245
        afdeling: '13.2'
  - number: '24'
    text: |-
      Indien zich tijdens de uitvoering van een activiteit een ongewoon voorval voordoet of heeft voorgedaan, waardoor
      gevaar voor de veiligheid van mensenlevens, schepen, luchtvaartuigen of ander materieel en faciliteiten van grote
      waarde of nadelige gevolgen voor het Antarctisch milieu zijn ontstaan of dreigen te ontstaan, zijn de voorschriften
      die bij of krachtens deze wet zijn gesteld, met uitzondering van [artikel 3][ref1], niet van toepassing voor zover
      het betreft maatregelen die onverwijld nodig zijn om de gevolgen van die gebeurtenis te voorkomen of, voor zover
      die gevolgen niet kunnen worden voorkomen, zoveel mogelijk te beperken of ongedaan te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0009449#Artikel3
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0009449
        artikel: '3'
        paragraaf: '1'
  - number: 24a
    text: |-
      Levende organismen, met inbegrip van daaruit voortgekomen nageslacht, die zonder een vergunning binnen het
      Antarctisch gebied zijn gebracht, worden, waar mogelijk, door de organisator van de activiteit verwijderd uit het
      gebied of vernietigd, tenzij verwijdering of vernietiging grotere schadelijke gevolgen zou hebben voor het milieu.
      De organisator van de activiteit neemt alle redelijke maatregelen in acht om de gevolgen van het binnenbrengen te
      beheersen en schade aan de inheemse flora en fauna te voorkomen.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel24a
  - number: '25.1'
    text: |-
      Indien zich tijdens de uitvoering van een activiteit een ongewoon voorval voordoet of heeft voorgedaan, doen de
      organisator van die activiteit of de in verband met de uitvoering van die activiteit werkzame personen hiervan zo
      spoedig mogelijk melding aan Onze Ministers.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel25
  - number: '25.2'
    text: |-
      De organisator of de in verband met de uitvoering van de activiteit werkzame personen verstrekken Onze Ministers
      tevens zo spoedig mogelijk de gegevens met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel25
  - number: 25.2.a
    text: de oorzaken van het voorval en de omstandigheden waaronder het voorval zich heeft voorgedaan;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel25
  - number: 25.2.b
    text: de ten gevolge van het voorval vrijgekomen stoffen, alsmede hun eigenschappen;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel25
  - number: 25.2.c
    text: |-
      andere gegevens die van belang zijn om de aard en de ernst van de gevolgen voor het milieu van het voorval te
      kunnen beoordelen;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel25
  - number: 25.2.d
    text: |-
      de maatregelen die zijn genomen of worden overwogen om de gevolgen van het voorval te voorkomen, te beperken of
      ongedaan te maken;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel25
  - number: 25.2.e
    text: |-
      de maatregelen die worden overwogen om te voorkomen dat een zodanig voorval zich tijdens een activiteit nogmaals
      kan voordoen.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel25
  - number: '25.3'
    text: |-
      Onze Ministers kunnen, in het belang van de bescherming van het Antarctisch milieu aanwijzingen geven ten aanzien
      van de maatregelen, bedoeld in het tweede lid, onder d en e.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel25
  - number: 25a
    text: |-
      In deze paragraaf en in de daarop berustende bepalingen wordt verstaan onder: - *partij:* staat waarvoor bijlage VI
      bij het Protocol van kracht is, overeenkomstig artikel 9 van het Protocol.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel25a
  - number: 25b.1
    text: |-
      De organisator onderneemt onverwijld doeltreffende bestrijdingsacties in een milieubedreigende noodsituatie die het
      gevolg is van zijn activiteit.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel25b
  - number: 25b.2
    text: |-
      Indien de organisator naar het oordeel van Onze Ministers niet voldoet aan het bepaalde in het eerste lid of
      niet onverwijld gevolg geeft aan de aanwijzingen, bedoeld in [artikel 25, derde lid][ref1], kunnen Onze Ministers
      dergelijke acties of andere maatregelen laten ondernemen.


      [ref1]: https://wetten.overheid.nl/BWBR0009449#Artikel25
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel25b
    references:
      - id: ref1
        bwb_id: BWBR0009449
        artikel: '25'
        paragraaf: '5'
  - number: 25c.1
    text: |-
      De organisator die niet onverwijld bestrijdingsacties als bedoeld in [artikel 25b][ref1] onderneemt, is
      aansprakelijk voor de kosten van de bestrijdingsacties die een partij in de desbetreffende milieubedreigende
      noodsituatie onderneemt.


      [ref1]: https://wetten.overheid.nl/BWBR0009449#Artikel25b
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel25c
    references:
      - id: ref1
        bwb_id: BWBR0009449
        artikel: 25b
        paragraaf: 5a
  - number: 25c.2
    text: |-
      Indien de in het eerste lid bedoelde organisator niet de Staat is en geen bestrijdingsacties zijn ondernomen,
      is de organisator aansprakelijk voor een bedrag dat een zo goed mogelijke afspiegeling is van de kosten van de
      bestrijdingsacties die redelijkerwijs hadden moeten worden ondernomen. De organisator betaalt het bedrag ten
      behoeve van het fonds aan Onze Ministers. Onze Ministers maken het ontvangen bedrag over aan het fonds.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel25c
  - number: 25c.3
    text: |-
      Onze Ministers stellen de hoogte van het in het tweede lid bedoelde bedrag vast, mede gelet op de aard en de omvang
      van de milieubedreigende noodsituatie en alle omstandigheden van het geval. Bij ministeriële regeling kunnen nadere
      regels worden gesteld voor het vaststellen van de hoogte van het bedrag.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel25c
  - number: 25c.4
    text: |-
      Wanneer een milieubedreigende noodsituatie mede het gevolg is van een andere activiteit, is elk van de
      organisatoren hoofdelijk aansprakelijk, tenzij hij aantoont dat slechts een gedeelte van de milieubedreigende
      noodsituatie het gevolg is van zijn activiteit, in welk geval hij slechts voor dat gedeelte aansprakelijk is.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel25c
  - number: 25d.1
    text: |-
      De organisator is niet aansprakelijk ingevolge [artikel 25c, eerste en tweede lid][ref1], indien de
      milieubedreigende noodsituatie veroorzaakt is door:


      [ref1]: https://wetten.overheid.nl/BWBR0009449#Artikel25c
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel25d
    references:
      - id: ref1
        bwb_id: BWBR0009449
        artikel: 25c
        paragraaf: 5a
  - number: 25d.1.a
    text: een handelen of nalaten teneinde mensenlevens of de veiligheid te beschermen;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel25d
  - number: 25d.1.b
    text: |-
      een voorval dat gezien de omstandigheden op Antarctica een natuurramp van uitzonderlijke aard vormt en dat niet
      redelijkerwijs had kunnen worden voorzien, mits is voldaan aan [artikel 3, derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009449#Artikel3
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel25d
    references:
      - id: ref1
        bwb_id: BWBR0009449
        artikel: '3'
        paragraaf: '1'
  - number: 25d.1.c
    text: een daad van terrorisme, of
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel25d
  - number: 25d.1.d
    text: een oorlogshandeling, gericht tegen zijn activiteit.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel25d
  - number: 25d.2
    text: |-
      Onze Ministers zijn niet aansprakelijk voor een milieubedreigende noodsituatie die het gevolg is van een door hen
      ondernomen bestrijdingsactie.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel25d
  - number: 25e.1
    text: |-
      In dit artikel wordt verstaan onder: - *BTR:* bijzondere trekkingsrechten zoals omschreven door het Internationaal
      Monetair Fonds;
        - *schip:* vaartuig, ongeacht het type, dat in het mariene milieu wordt ingezet, met inbegrip van
      draagvleugelboten, luchtkussenvaartuigen, afzinkbare vaartuigen, drijvend materieel en vaste of drijvende
      platforms;
        - *tonnage:* brutotonnage berekend overeenkomstig de voorschriften voor de berekening van de tonnage vervat in
      Bijlage I van het op 23 juni 1969 te Londen tot stand gekomen Internationaal Verdrag betreffende de meting van
      schepen, 1969 (Trb. 1970, 122).
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel25e
  - number: 25e.2
    text: |-
      Het maximumbedrag waarvoor de organisator ingevolge [artikel 25c, eerste en tweede lid][ref1], aansprakelijk is,
      bedraagt, behoudens wijziging overeenkomstig de procedure, bedoeld in artikel 9, vierde lid, van bijlage VI bij
      het Protocol:


      [ref1]: https://wetten.overheid.nl/BWBR0009449#Artikel25c
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel25e
    references:
      - id: ref1
        bwb_id: BWBR0009449
        artikel: 25c
        paragraaf: 5a
  - number: 25e.2.a
    text: 'indien bij het tot een milieubedreigende noodsituatie leidende voorval een schip betrokken is:'
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel25e
  - number: 25e.2.a.1°
    text: voor een schip met een tonnage van ten hoogste 2000 ton, een miljoen BTR;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel25e
  - number: 25e.2.a.2°
    text: |-
      voor een schip met een tonnage boven 2000 ton, het volgende bedrag in aanvulling op het in onderdeel 1° bedoelde
      bedrag: '- voor elke ton van 2001 tot en met 30.000 ton, 400 BTR;'
        - voor elke ton van 30.001 tot en met 70.000 ton, 300 BTR;
        - voor elke ton boven 70.000 ton, 200 BTR.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel25e
  - number: 25e.2.b
    text: indien bij het tot een milieubedreigende noodsituatie leidende voorval geen schip betrokken is, drie miljoen BTR.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel25e
  - number: 25e.3
    text: |-
      Indien bij het tot een milieubedreigende noodsituatie leidende voorval een schip is betrokken, doen de
      [artikelen 25c][ref1], [25d][ref2] en [25e][ref3] geen afbreuk aan:


      [ref1]: https://wetten.overheid.nl/BWBR0009449#Artikel25c
      [ref2]: https://wetten.overheid.nl/BWBR0009449#Artikel25d
      [ref3]: https://wetten.overheid.nl/BWBR0009449#Artikel25e
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel25e
    references:
      - id: ref1
        bwb_id: BWBR0009449
        artikel: 25c
        paragraaf: 5a
      - id: ref2
        bwb_id: BWBR0009449
        artikel: 25d
        paragraaf: 5a
      - id: ref3
        bwb_id: BWBR0009449
        artikel: 25e
        paragraaf: 5a
  - number: 25e.3.a
    text: |-
      de aansprakelijkheid of het recht tot beperking van de aansprakelijkheid ingevolge elk toepasselijk internationaal
      verdrag inzake beperking van aansprakelijkheid, of
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel25e
  - number: 25e.3.b
    text: |-
      de uitsluiting van de toepassing van de in een dergelijk verdrag bedoelde beperkingen ten aanzien van bepaalde
      vorderingen, indien er, overeenkomstig het betreffende verdrag, daartoe een voorbehoud is gemaakt,
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel25e
  - number: 25e.4
    text: 'De aansprakelijkheid is niet beperkt, indien de milieubedreigende noodsituatie het gevolg is van:'
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel25e
  - number: 25e.4.a
    text: het handelen of nalaten van de organisator met de opzet een dergelijke noodsituatie te veroorzaken, of
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel25e
  - number: 25e.4.b
    text: |-
      roekeloosheid van de organisator in de wetenschap dat een dergelijke noodsituatie daarvan het resultaat zou kunnen
      zijn.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel25e
  - number: 25e.5
    text: |-
      Een wijziging als bedoeld in het tweede lid, geldt met ingang van een tijdstip dat in de Staatscourant bekend wordt
      gemaakt.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel25e
  - number: 25f.1
    text: |-
      Een organisator houdt een voldoende verzekering of andere financiële zekerheid in stand, ter dekking van zijn
      aansprakelijkheid ingevolge [artikel 25c, eerste en tweede lid][ref1], tot een bedrag berekend overeenkomstig
      [artikel 25e, tweede en derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009449#Artikel25c
      [ref2]: https://wetten.overheid.nl/BWBR0009449#Artikel25e
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel25f
    references:
      - id: ref1
        bwb_id: BWBR0009449
        artikel: 25c
        paragraaf: 5a
      - id: ref2
        bwb_id: BWBR0009449
        artikel: 25e
        paragraaf: 5a
  - number: 25f.2
    text: |-
      Indien de organisator niet aan de verplichting, bedoeld in [artikel 25b][ref1], heeft voldaan, kunnen Onze
      Ministers bepalen tot welk bedrag zij verhaal zullen nemen op de gestelde zekerheid, bedoeld in het eerste
      lid. Onze Ministers kunnen de middelen aanwenden om andere partijen te betalen, teneinde de kosten, bedoeld
      in [artikel 25c, eerste lid][ref2], te voldoen. Onze Ministers kunnen het te verhalen bedrag invorderen bij
      dwangbevel.


      [ref1]: https://wetten.overheid.nl/BWBR0009449#Artikel25b
      [ref2]: https://wetten.overheid.nl/BWBR0009449#Artikel25c
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel25f
    references:
      - id: ref1
        bwb_id: BWBR0009449
        artikel: 25b
        paragraaf: 5a
      - id: ref2
        bwb_id: BWBR0009449
        artikel: 25c
        paragraaf: 5a
  - number: 25g
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld inzake de in
      [artikel 25f][ref1] bedoelde te stellen financiële zekerheid.


      [ref1]: https://wetten.overheid.nl/BWBR0009449#Artikel25f
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel25g
    references:
      - id: ref1
        bwb_id: BWBR0009449
        artikel: 25f
        paragraaf: 5a
  - number: 25h
    text: |-
      Indien een andere partij heeft vastgesteld dat een natuurlijke of rechtspersoon, die in het Antarctisch
      gebied een activiteit uitvoert of organiseert, aansprakelijk is voor een bedrag als bedoeld in
      [artikel 25c, tweede lid][ref1], kunnen Onze Ministers op verzoek van die partij ten behoeve van het fonds betaling
      daarvan vorderen, mits die natuurlijke of rechtspersoon in Nederland is gevestigd of er zijn voornaamste plaats van
      bedrijfsuitoefening of zijn gewone verblijfplaats heeft. Artikel 25c is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009449#Artikel25c
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel25h
    references:
      - id: ref1
        bwb_id: BWBR0009449
        artikel: 25c
        paragraaf: 5a
  - number: 25i.1
    text: |-
      De bevoegdheid tot het instellen van kostenverhaal, bedoeld in [artikel 25c, eerste lid][ref1], verjaart door
      verloop van een periode van drie jaar na de dag waarop de bestrijdingsacties zijn aangevangen of na de dag waarop
      de partij die de vordering instelt op de hoogte was of redelijkerwijze geacht kon worden op de hoogte te zijn van
      de identiteit van organisator, naar gelang welke datum later valt.


      [ref1]: https://wetten.overheid.nl/BWBR0009449#Artikel25c
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel25i
    references:
      - id: ref1
        bwb_id: BWBR0009449
        artikel: 25c
        paragraaf: 5a
  - number: 25i.2
    text: |-
      In geen geval wordt een vordering, bedoeld in het eerste lid, later ingesteld dan vijftien jaar na aanvang van
      de bestrijdingsacties.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel25i
  - number: 25i.3
    text: |-
      De bevoegdheid tot het instellen van een vordering, bedoeld in [artikel 25c, tweede lid][ref1], of
      [artikel 25h][ref2] verjaart door verloop van een periode van vijftien jaar na de dag waarop de partij, bedoeld in
      artikel 25c, tweede lid, of artikel 25h op de hoogte was van de milieubedreigende noodsituatie.


      [ref1]: https://wetten.overheid.nl/BWBR0009449#Artikel25c
      [ref2]: https://wetten.overheid.nl/BWBR0009449#Artikel25h
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel25i
    references:
      - id: ref1
        bwb_id: BWBR0009449
        artikel: 25c
        paragraaf: 5a
      - id: ref2
        bwb_id: BWBR0009449
        artikel: 25h
        paragraaf: 5a
  - number: '26.1'
    text: |-
      Onze Minister van Buitenlandse zaken kan in overeenstemming met Onze Ministers een persoon met de Nederlandse
      nationaliteit aanwijzen als internationale waarnemer.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel26
  - number: '26.2'
    text: Een aanwijzing als bedoeld in het eerste lid wordt gepubliceerd in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel26
  - number: '27'
    text: |-
      Onze Ministers zijn bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van de bij of krachtens
      deze wet gestelde verplichtingen.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel27
  - number: '28'
    text: |-
      Met betrekking tot de handhaving van het bij of krachtens deze wet bepaalde zijn de
      [artikelen 18.2, vierde lid][ref1], [18.4][ref2], [18.4a][ref3], [18.6][ref4], [18.6a][ref5], [18.7][ref6] en
      [18.10][ref7] van de Omgevingswet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0037885#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0037885#Artikel18
      [ref5]: https://wetten.overheid.nl/BWBR0037885#Artikel18
      [ref6]: https://wetten.overheid.nl/BWBR0037885#Artikel18
      [ref7]: https://wetten.overheid.nl/BWBR0037885#Artikel18
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0037885
        artikel: '18'
      - id: ref3
        bwb_id: BWBR0037885
        artikel: '18'
      - id: ref4
        bwb_id: BWBR0037885
        artikel: '18'
      - id: ref5
        bwb_id: BWBR0037885
        artikel: '18'
      - id: ref6
        bwb_id: BWBR0037885
        artikel: '18'
      - id: ref7
        bwb_id: BWBR0037885
        artikel: '18'
  - number: '29'
    text: |-
      Een ieder is verplicht aan internationale waarnemers desgevraagd alle medewerking te verlenen en alle inlichtingen
      te verstrekken die zij redelijkerwijs bij de uitoefening van hun taak behoeven.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel29
  - number: '30'
    text: |-
      Een gedraging in strijd met een voorschrift dat is verbonden aan een krachtens [artikel 8][ref1] verleende
      vergunning, is verboden.


      [ref1]: https://wetten.overheid.nl/BWBR0009449#Artikel8
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0009449
        artikel: '8'
        paragraaf: '4'
  - number: '32.1'
    text: |-
      Het bij of krachtens deze wet bepaalde is mede van toepassing op de Nederlander die zich in het Antarctisch gebied
      bevindt.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel32
  - number: '32.2'
    text: |-
      De Nederlandse strafwet is mede van toepassing op de Nederlander die in het Antarctisch gebied handelt in
      strijd met het bij of krachtens deze wet bepaalde. De eerste volzin is niet van toepassing op de Nederlander die
      ingezetene is van de openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel32
  - number: 32a
    text: Deze wet en de daarop berustende bepalingen zijn mede van toepassing in de openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel32a
  - number: 32b
    text: 'Indien:'
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel32b
  - number: 32b.a
    text: |-
      een aanvraag om een vergunning als bedoeld in [artikel 8][ref1] wordt gedaan door een ingezetene van de openbare
      lichamen, of


      [ref1]: https://wetten.overheid.nl/BWBR0009449#Artikel8
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel32b
    references:
      - id: ref1
        bwb_id: BWBR0009449
        artikel: '8'
        paragraaf: '4'
  - number: 32b.b
    text: |-
      de beperkingen waaronder een vergunning aan een ingezetene van de openbare lichamen is verleend en de
      voorschriften die daaraan zijn verbonden, worden gewijzigd, aangevuld of ingetrokken als bedoeld in
      [artikel 20, eerste lid][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0009449#Artikel20
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel32b
    references:
      - id: ref1
        bwb_id: BWBR0009449
        artikel: '20'
        paragraaf: '4'
  - number: 32b.c
    text: |-
      een ingezetene van de openbare lichamen een verzoek als bedoeld in de [artikelen 20, tweede lid][ref1],
      [21, eerste lid][ref2], of [22, derde lid][ref3], indient, of


      [ref1]: https://wetten.overheid.nl/BWBR0009449#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0009449#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0009449#Artikel22
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel32b
    references:
      - id: ref1
        bwb_id: BWBR0009449
        artikel: '20'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0009449
        artikel: '21'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0009449
        artikel: '22'
        paragraaf: '4'
  - number: 32b.d
    text: |-
      een intrekking van een vergunning als bedoeld in [artikel 22][ref1], die is verleend aan een ingezetene van de
      openbare lichamen, plaatsvindt,


      [ref1]: https://wetten.overheid.nl/BWBR0009449#Artikel22
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel32b
    references:
      - id: ref1
        bwb_id: BWBR0009449
        artikel: '22'
        paragraaf: '4'
  - number: 32c
    text: |-
      Een besluit op grond van deze wet wordt, indien dit is gericht tot een natuurlijke persoon of een rechtspersoon
      die vanuit de openbare lichamen een activiteit organiseert, aangemerkt als een beschikking in de zin van de
      [Wet administratieve rechtspraak BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028455
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel32c
    references:
      - id: ref1
        bwb_id: BWBR0028455
  - number: 32d
    text: |-
      Met betrekking tot de handhaving in de openbare lichamen, van het bij of krachtens deze
      wet bepaalde, zijn de [artikelen 10.1][ref1], [10.3][ref2], [10.4][ref3], [10.6][ref4] en
      [10.8 tot en met 10.11 van de Wet Volkshuisvesting, ruimtelijke ordening en milieubeheer BES][ref5] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0031218#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0031218#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0031218#Artikel10
      [ref5]: https://wetten.overheid.nl/BWBR0031218#Artikel10
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel32d
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0031218
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0031218
        artikel: '10'
      - id: ref4
        bwb_id: BWBR0031218
        artikel: '10'
      - id: ref5
        bwb_id: BWBR0031218
        artikel: '10'
  - number: 32e.1
    text: 'Voor ingezetenen van de openbare lichamen is:'
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel32e
  - number: 32e.1.a
    text: |-
      handelen in strijd met de voorschriften of overtreding van de verboden gegeven in de
      [artikelen 3, eerste lid][ref1], [5][ref2], [6, eerste en tweede lid][ref3], [8][ref4],
      [25, eerste en tweede lid][ref5], [29][ref6] en [30][ref7]:


      [ref1]: https://wetten.overheid.nl/BWBR0009449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009449#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0009449#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0009449#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0009449#Artikel25
      [ref6]: https://wetten.overheid.nl/BWBR0009449#Artikel29
      [ref7]: https://wetten.overheid.nl/BWBR0009449#Artikel30
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel32e
    references:
      - id: ref1
        bwb_id: BWBR0009449
        artikel: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009449
        artikel: '5'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0009449
        artikel: '6'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0009449
        artikel: '8'
        paragraaf: '4'
      - id: ref5
        bwb_id: BWBR0009449
        artikel: '25'
        paragraaf: '5'
      - id: ref6
        bwb_id: BWBR0009449
        artikel: '29'
        paragraaf: '7'
      - id: ref7
        bwb_id: BWBR0009449
        artikel: '30'
        paragraaf: '7'
  - number: 32e.1.a.1°
    text: |-
      voor zover opzettelijk begaan, een misdrijf dat wordt gestraft met gevangenisstraf van ten hoogste twee jaren of
      geldboete van de vierde categorie;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel32e
  - number: 32e.1.a.2°
    text: |-
      voor zover geen misdrijf, een overtreding die wordt gestraft met hechtenis van ten hoogste zes maanden of geldboete
      van de vierde categorie;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel32e
  - number: 32e.1.b
    text: |-
      handelen in strijd met de voorschriften in de [artikelen 19, tweede lid][ref1], en [33][ref2] een overtreding die
      wordt gestraft met hechtenis van ten hoogste zes maanden of geldboete van de vierde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0009449#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0009449#Artikel33
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel32e
    references:
      - id: ref1
        bwb_id: BWBR0009449
        artikel: '19'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0009449
        artikel: '33'
        paragraaf: '8'
  - number: 32e.2
    text: 'Bij de straffen, genoemd in de eerste lid, kan als bijkomende straf worden opgelegd:'
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel32e
  - number: 32e.2.a
    text: |-
      gehele of gedeeltelijke stillegging van de inrichting van de veroordeelde, waarin het delict is begaan, voor een
      tijd van ten hoogste een jaar;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel32e
  - number: 32e.2.b
    text: |-
      verbeurdverklaring van de voorwerpen, genoemd in [artikel 35 van het Wetboek van Strafrecht BES][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel35
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel32e
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '35'
  - number: 32e.2.c
    text: |-
      verbeurdverklaring van voorwerpen, behorende tot de onderneming van een veroordeelde, waarin het delict is
      begaan, voor zover zij soortgelijk zijn aan en met betrekking tot het delict verband houden met die, genoemd in
      [artikel 35 van het Wetboek van Strafrecht BES][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel35
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel32e
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '35'
  - number: 32e.2.d
    text: |-
      gehele of gedeeltelijke ontzetting van bepaalde rechten of gehele of gedeeltelijke ontzegging van bepaalde
      voordelen, welke rechten of voordelen de veroordeelde in verband met zijn inrichting van overheidswege zijn of
      zouden kunnen worden toegekend, voor een tijd van ten hoogste twee jaren.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel32e
  - number: 32e.3
    text: 'Tezamen met de straffen, bedoeld in het eerste en tweede lid, kunnen de volgende maatregelen worden opgelegd:'
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel32e
  - number: 32e.3.a
    text: |-
      onderbewindstelling van de onderneming van de veroordeelde, waarin het delict is begaan, in geval van misdrijf voor
      een tijd van ten hoogste drie jaren en in geval van overtreding voor een tijd van ten hoogste twee jaren, en
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel32e
  - number: 32e.3.b
    text: |-
      het opleggen van de verplichting tot verrichting van hetgeen wederrechtelijk is nagelaten, tenietdoening van
      hetgeen wederrechtelijk is verricht en verrichting van prestaties tot het goedmaken van een en ander, alles op
      kosten van de veroordeelde, voor zover de rechter niet anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel32e
  - number: 32f
    text: |-
      Het [Wetboek van Strafrecht BES][ref1] is mede van toepassing op de ingezetene van de openbare lichamen die in het
      Antarctisch gebied handelt in strijd met het bij of krachtens deze wet bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0028570
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel32f
    references:
      - id: ref1
        bwb_id: BWBR0028570
  - number: '33.1'
    text: |-
      Een organisator stelt binnen zes weken na de beëindiging van de activiteit een verslag op, dat hij terstond ter
      beschikking stelt van Onze Ministers.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel33
  - number: '33.2'
    text: 'Het verslag geeft een nauwkeurige omschrijving van de uitgevoerde activiteit en bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel33
  - number: 33.2.a
    text: |-
      een aanduiding van de gebieden waar de activiteit is uitgevoerd, van de tijdstippen waarop deze gebieden zijn
      betreden en van de duur van het verblijf aldaar;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel33
  - number: 33.2.b
    text: |-
      een beschrijving van de afvalstoffen die tijdens de uitvoering van de activiteit zijn ontstaan en de wijze waarop
      deze afvalstoffen zijn opgeslagen en verwijderd;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel33
  - number: 33.2.c
    text: een beschrijving van de nadelige gevolgen van de activiteit voor het Antarctisch milieu;
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel33
  - number: 33.2.d
    text: |-
      een beschrijving van de maatregelen die in aanvulling op de bij of krachtens deze wet gestelde voorschriften zijn
      genomen om nadelige gevolgen voor het Antarctisch milieu te voorkomen of, voor zover deze gevolgen niet konden
      worden voorkomen, zo veel mogelijk te beperken en ongedaan te maken.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel33
  - number: '33.3'
    text: Het verslag is in de Nederlandse taal gesteld. Bij dit verslag wordt een Engelse vertaling gevoegd.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel33
  - number: '34.1'
    text: |-
      Onze Ministers brengen tweejaarlijks verslag uit aan de Staten-Generaal van belangrijke ontwikkelingen ten aanzien
      van de implementatie van het Protocol.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel34
  - number: '34.2'
    text: |-
      Van informatie die ingevolge het Protocol ter beschikking van het publiek dient te worden gesteld, wordt mededeling
      gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel34
  - number: '36.1'
    text: |-
      De Staat of een andere partij kan, behoudens matiging door de rechter, de te zijnen laste komende kosten van
      het ongedaan maken van door de activiteit veroorzaakte nadelige gevolgen voor het Antarctisch milieu, de kosten
      van het voorkomen van dergelijke gevolgen, dan wel de kosten, bedoeld in [artikel 25c, tweede lid][ref1], en
      [artikel 25h][ref2] verhalen op degene door wiens onrechtmatige daad die kosten zijn veroorzaakt, of op degene die
      anderszins krachtens burgerlijk recht buiten overeenkomst aansprakelijk is voor de gevolgen daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0009449#Artikel25c
      [ref2]: https://wetten.overheid.nl/BWBR0009449#Artikel25h
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0009449
        artikel: 25c
        paragraaf: 5a
      - id: ref2
        bwb_id: BWBR0009449
        artikel: 25h
        paragraaf: 5a
  - number: '36.2'
    text: |-
      Voor de toepassing van het eerste lid is niet vereist dat op het tijdstip waarop de activiteit werd uitgevoerd,
      reeds jegens de overheid of een andere partij onrechtmatig werd gehandeld.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel36
  - number: '36.3'
    text: |-
      In dit artikel wordt verstaan onder: - *partij:* staat waarvoor bijlage VI bij het Protocol van kracht is,
      overeenkomstig artikel 9 van het Protocol.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel36
  - number: '37'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel37
  - number: '38'
    text: 'Deze wet wordt aangehaald als: Wet bescherming Antarctica.'
    url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#Artikel38
