preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is regels te stellen ter bescherming van het
    Antarctisch milieu ter uitvoering van het Protocol betreffende milieubescherming bij het verdrag inzake Antarctica;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0009449/2024-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - activiteit: een activiteit in de zin van
      artikel 3 van het Protocol, zijnde een geheel van onderling samenhangende handelingen in het Antarctisch gebied;
        - afvalstoffen: afvalstoffen in de zin van [artikel 1.1, eerste lid, van de Wet milieubeheer][ref1];
        - afvalwater: afvalwater in de zin van de [Wet milieubeheer][ref2];
        - Antarctisch gebied: gebied gelegen ten zuiden van de 60ste zuidelijke breedtegraad;
        - bestrijdingsacties: redelijke maatregelen die genomen worden na het ontstaan van een milieubedreigende
      noodsituatie met als doel het voorkomen, tot een minimum beperken of beheersen van de gevolgen van die
      milieubedreigende noodsituatie, met inbegrip van het vaststellen van de omvang van de noodsituatie en de gevolgen
      ervan;
        - fonds: door het Secretariaat, bedoeld in Maatregel 1(2003), van het Verdrag ingesteld en beheerd fonds, waarin
      het bedrag, bedoeld in [artikel 25c, tweede lid][ref3], wordt gestort;
        - gevaarlijke afvalstoffen: gevaarlijke afvalstoffen als aangewezen krachtens
      [artikel 1.1, eerste lid, van de Wet milieubeheer][ref4];
        - historische plaats of historisch monument: plaats die onderscheidenlijk monument dat ingevolge artikel 8, tweede
      of derde lid, van bijlage V bij het Protocol als zodanig is aangewezen;
        - inheems: in het Antarctisch gebied voorkomend;
        - internationale waarnemer: persoon aangewezen als waarnemer als bedoeld in artikel VII van het Verdrag en artikel
      14, tweede lid, van het Protocol;
        - levende organismen: levende biologische entiteiten, niet zijnde mensen, met het vermogen tot vermenigvuldiging of
      tot overbrenging van genetisch materiaal, daaronder mede begrepen virussen, viroïden, en dierlijke en plantencellen
      in cultuur;
        - levende rijkdommen: zoogdieren, vogels en eieren van vogels, op land of in zoet water levende ongewervelde dieren
      en planten, in elke fase van hun levenscyclus;
        - milieubedreigende noodsituatie: elk door een ongeval veroorzaakt voorval dat zich, na inwerkingtreding van
      bijlage VI bij het Protocol, heeft voorgedaan en dat leidt tot, of onmiddellijk dreigt te leiden tot, aanmerkelijke
      en schadelijke gevolgen voor het Antarctisch milieu;
        - minerale rijkdommen: niet-levende, niet-vernieuwbare natuurlijke rijkdommen, met inbegrip van fossiele
      brandstoffen en ertshoudende en niet-ertshoudende mineralen;
        - onttrekken aan de populatie: doden, verwonden, gevangen nemen, vastpakken, verwijderen of beschadigen;
        - Onze Ministers: Onze Ministers van Infrastructuur en Waterstaat en van Landbouw, Natuur en Voedselkwaliteit;
        - openbare lichamen: openbare lichamen Bonaire, Sint-Eustatius en Saba;
        - organisator: een natuurlijke of rechtspersoon die een activiteit organiseert en de Nederlandse nationaliteit
      bezit respectievelijk statutair gevestigd is in Nederland of de activiteit organiseert vanuit Nederland;
        - Protocol: Protocol betreffende milieubescherming bij het Verdrag (Trb. 1992, 110);
        - redelijke: passend, praktisch uitvoerbaar en proportioneel en gebaseerd op de beschikbaarheid van objectieve
      criteria en informatie;
        - schadelijk optreden: schadelijk optreden, als bedoeld in artikel 1, onder h, van Bijlage II bij het Protocol;
        - speciaal beheerd Antarctisch gebied: delen van het Antarctisch gebied, die ingevolge artikel 4, eerste lid, van
      bijlage V bij het Protocol als zodanig zijn aangewezen;
        - speciaal beschermd Antarctisch gebied: delen van het Antarctisch gebied, die ingevolge artikel 3, eerste of derde
      lid, van bijlage V bij het Protocol als zodanig zijn aangewezen;
        - Verdrag: het Antarctica Verdrag (Trb. 1965, 148; laatstelijk 1987, 68).


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003245
      [ref3]: https://wetten.overheid.nl/BWBR0009449#Artikel25c
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel1
