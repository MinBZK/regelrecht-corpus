---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_medefinanciering_oververtegenwoordiging_oudere_ziekenfondsverzekerden
regulatory_layer: WET
publication_date: '2005-11-01'
valid_from: '2002-06-26'
bwb_id: BWBR0003933
url: https://wetten.overheid.nl/BWBR0003933/2002-06-26
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het in verband met de tijdelijke oververtegenwoordiging van
    verzekerden van 65 jaar en ouder in de verplichte ziekenfondsverzekering als gevolg van het onder de werking van
    de verplichte ziekenfondsverzekering brengen van personen van 65 jaar en ouder ingevolge de Wet op de toegang
    tot ziektekostenverzekeringen, wenselijk is een regeling te treffen met betrekking tot de medefinanciering door
    ziektekostenverzekeraars van de extra lasten als gevolg van deze tijdelijke oververtegenwoordiging;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003933/2002-06-26#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003933/2002-06-26#Artikel1
  - number: 1.a
    text: |-
      overeenkomsten van ziektekostenverzekering: overeenkomsten van directe verzekering die strekken tot vergoeding
      van kosten van geneeskundige hulp aan personen die naar de omstandigheden beoordeeld hier te lande woonachtig
      zijn of die buiten Nederland woonachtig zijn en een overeenkomst van standaardverzekering als bedoeld in
      [artikel 3, eerste lid, van de Wet op de toegang tot ziektekostenverzekeringen 1998][ref1] hebben afgesloten, met
      uitzondering van overeenkomsten van arbeidsongeschiktheidsverzekering, overeenkomsten van ongevallenverzekering,
      overeenkomsten van reisverzekering en andere overeenkomsten van verzekering waarbij kosten van geneeskundige hulp
      uitsluitend aanvullend worden gedekt;


      [ref1]: https://wetten.overheid.nl/BWBR0009750#Artikel3
    url: https://wetten.overheid.nl/BWBR0003933/2002-06-26#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009750
        artikel: '3'
  - number: 1.b
    text: |-
      ziektekostenverzekeringsbedrijf: het als bedrijf sluiten van overeenkomsten van ziektekostenverzekering
      voor eigen rekening, met inbegrip van het afwikkelen van de in dat bedrijf gesloten overeenkomsten van
      ziektekostenverzekering, ook al wordt daarmee niet beoogd het maken van winst;
    url: https://wetten.overheid.nl/BWBR0003933/2002-06-26#Artikel1
  - number: 1.c
    text: 'verzekeraar: ieder die het ziektekostenverzekeringsbedrijf uitoefent;'
    url: https://wetten.overheid.nl/BWBR0003933/2002-06-26#Artikel1
  - number: 1.d
    text: |-
      ziekenfonds: iedere rechtspersoon, toegelaten overeenkomstig [artikel 34, eerste lid, van de Ziekenfondswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel34
    url: https://wetten.overheid.nl/BWBR0003933/2002-06-26#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '34'
  - number: 1.e
    text: |-
      uitvoeringsorgaan: het uitvoeringsorgaan, bedoeld in
      [artikel 17 van de Wet op de toegang tot ziektekostenverzekeringen 1998][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009750#Artikel17
    url: https://wetten.overheid.nl/BWBR0003933/2002-06-26#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009750
        artikel: '17'
  - number: 1.f
    text: 'Onze Minister: Onze Minister van Financiën.'
    url: https://wetten.overheid.nl/BWBR0003933/2002-06-26#Artikel1
  - number: '2'
    text: |-
      De Pensioen- & Verzekeringskamer beslist voor de toepassing van deze wet of een handeling of een samenstel van
      handelingen al dan niet uitoefening van het ziektekostenverzekeringsbedrijf vormt. Zij beslist ambtshalve dan
      wel op verzoek van hetzij degene die de handeling of het samenstel van handelingen verricht of voornemens is te
      verrichten, hetzij een representatieve organisatie van verzekeraars als bedoeld in [artikel 8, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003933#Artikel8
    url: https://wetten.overheid.nl/BWBR0003933/2002-06-26#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003933
        artikel: '8'
        hoofdstuk: III
  - number: '3'
    text: 'Als verzekeraars worden niet beschouwd:'
    url: https://wetten.overheid.nl/BWBR0003933/2002-06-26#Artikel3
  - number: 3.a
    text: ziekenfondsen;
    url: https://wetten.overheid.nl/BWBR0003933/2002-06-26#Artikel3
  - number: 3.b
    text: organen die publiekrechtelijke ziektekostenregelingen voor ambtenaren uitvoeren;
    url: https://wetten.overheid.nl/BWBR0003933/2002-06-26#Artikel3
  - number: 3.c
    text: |-
      het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0003933/2002-06-26#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '5'
  - number: '4.1'
    text: |-
      Per 1 januari van ieder jaar wordt het aantal verzekerden vastgesteld ingevolge de verplichte
      ziekenfondsverzekering van 65 jaar en ouder, dat hoger is dan het aantal dat verhoudingsgewijs overeenkomt met het
      aantal personen van 65 jaar en ouder in de gehele Nederlandse bevolking, volgens de bevolkingsstatistieken van het
      Centraal Bureau voor de Statistiek.
    url: https://wetten.overheid.nl/BWBR0003933/2002-06-26#Artikel4
  - number: '4.2'
    text: |-
      Per 1 januari van ieder jaar wordt het bedrag vastgesteld van de gemiddelde uitgaven in het voorgaande jaar gedaan
      per verzekerde ingevolge de verplichte ziekenfondsverzekering van 65 jaar en ouder, verminderd met de gemiddelde
      uitgaven in het voorgaande jaar ingevolge de verplichte ziekenfondsverzekering gedaan per verzekerde jonger dan
      65 jaar.
    url: https://wetten.overheid.nl/BWBR0003933/2002-06-26#Artikel4
  - number: '4.3'
    text: |-
      Onze Minister van Volksgezondheid, Welzijn en Sport stelt, in overeenstemming met Onze Minister en Onze Ministers
      van Economische Zaken en van Sociale Zaken en Werkgelegenheid jaarlijks het mede te financieren bedrag vast
      en geeft hiervan kennis aan het uitvoeringsorgaan. Het bedrag wordt verkregen door vermenigvuldiging van het
      krachtens het eerste lid vastgestelde aantal verzekerden met het krachtens het tweede lid vastgestelde bedrag. Bij
      ministeriële regeling kan het Rijk een bijdrage leveren aan de Algemene Kas, bedoeld in de [Ziekenfondswet][ref1],
      ter verlaging van het mede te financieren bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0002460
    url: https://wetten.overheid.nl/BWBR0003933/2002-06-26#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002460
  - number: '4.4'
    text: |-
      Bij algemene maatregel van bestuur worden nadere voorschriften gegeven met betrekking tot de vaststelling van de in
      het eerste en tweede lid bedoelde gegevens.
    url: https://wetten.overheid.nl/BWBR0003933/2002-06-26#Artikel4
  - number: '5.1'
    text: |-
      Het ingevolge [artikel 4, derde lid][ref1], vastgestelde bedrag wordt volgens bij algemene maatregel van bestuur
      vast te stellen, naar leeftijdscategorieën te onderscheiden wegingsfactoren over de verzekerden omgeslagen. De
      omslagbijdrage maakt, behoudens voor zover toepassing is gegeven aan het tweede lid, deel uit van de door de
      verzekeraars aan de verzekerden in rekening te brengen premie.


      [ref1]: https://wetten.overheid.nl/BWBR0003933#Artikel4
    url: https://wetten.overheid.nl/BWBR0003933/2002-06-26#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003933
        artikel: '4'
        hoofdstuk: II
  - number: '5.2'
    text: |-
      Bij de in het eerste lid bedoelde algemene maatregel van bestuur kan worden bepaald dat geen omslag plaatsvindt
      over bij die maatregel aan te duiden verzekerden. De voordracht voor een krachtens [de eerste volzin][ref1] vast te
      stellen maatregel wordt niet gedaan dan nadat het ontwerp aan de beide kamers der Staten-Generaal is overgelegd en
      sedert die overlegging vier weken zijn verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0003933#Artikel5
    url: https://wetten.overheid.nl/BWBR0003933/2002-06-26#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003933
        artikel: '5'
        hoofdstuk: II
  - number: '12.1'
    text: |-
      De verzekeraar verstrekt jaarlijks voor 1 april aan het uitvoeringsorgaan in tweevoud een opgave van het aantal
      verzekerden op 1 januari van dat jaar per leeftijdscategorie, vast te stellen krachtens [artikel 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003933#Artikel5
    url: https://wetten.overheid.nl/BWBR0003933/2002-06-26#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003933
        artikel: '5'
        hoofdstuk: II
  - number: '12.2'
    text: |-
      De verzekeraar doet de opgave vergezeld gaan van een verklaring van een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2, van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0003933/2002-06-26#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '12.3'
    text: |-
      De verzekeraar verstrekt aan het uitvoeringsorgaan binnen een maand de nadere inlichtingen die dit orgaan voor de
      vaststelling van de rechten of verplichtingen van die verzekeraar mocht verlangen.
    url: https://wetten.overheid.nl/BWBR0003933/2002-06-26#Artikel12
  - number: '13.1'
    text: |-
      Het uitvoeringsorgaan stelt per verzekerde per leeftijdscategorie, behoudens voor zover toepassing is gegeven aan
      [artikel 5, tweede lid][ref1], de omslagbijdrage vast. Het uitvoeringsorgaan deelt de vastgestelde omslagbijdragen
      uiterlijk 31 oktober van het lopende kalenderjaar mee aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0003933#Artikel5
    url: https://wetten.overheid.nl/BWBR0003933/2002-06-26#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003933
        artikel: '5'
        hoofdstuk: II
  - number: '13.2'
    text: De omslagbijdrage behoeft de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003933/2002-06-26#Artikel13
  - number: '13.3'
    text: |-
      In geval van onthouding van goedkeuring stelt het uitvoeringsorgaan, met inachtneming van door Onze Minister te
      geven aanwijzingen, de omslagbijdrage opnieuw vast.
    url: https://wetten.overheid.nl/BWBR0003933/2002-06-26#Artikel13
  - number: '13.4'
    text: |-
      Indien Onze Minister na de in het derde lid bedoelde vaststelling aan de omslagbijdrage eveneens goedkeuring
      onthoudt, stelt hij zelf de omslagbijdrage vast.
    url: https://wetten.overheid.nl/BWBR0003933/2002-06-26#Artikel13
  - number: '13.5'
    text: |-
      Het uitvoeringsorgaan stelt op grond van de in [artikel 12, eerste lid][ref1], bedoelde opgave voor iedere
      verzekeraar het totaal van de omslagbijdragen van diens verzekerden vast.


      [ref1]: https://wetten.overheid.nl/BWBR0003933#Artikel12
    url: https://wetten.overheid.nl/BWBR0003933/2002-06-26#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003933
        artikel: '12'
        hoofdstuk: III
  - number: '13.6'
    text: De verzekeraar is het ingevolge het vijfde lid vastgestelde bedrag aan het uitvoeringsorgaan verschuldigd.
    url: https://wetten.overheid.nl/BWBR0003933/2002-06-26#Artikel13
  - number: '13.7'
    text: |-
      De verzekeraar is verplicht het ingevolge het zesde lid verschuldigde bedrag binnen een maand na het eerste
      betalingsverzoek aan het uitvoeringsorgaan te voldoen. Bij overschrijding van deze termijn zijn de wettelijke
      interesten verschuldigd, berekend van het tijdstip waarop de overschrijding is aangevangen.
    url: https://wetten.overheid.nl/BWBR0003933/2002-06-26#Artikel13
  - number: '13.8'
    text: |-
      Het uitvoeringsorgaan kan bepalen dat het verschuldigde bedrag in termijnen door de verzekeraar wordt voldaan en
      dat voorschotten op het verschuldigde bedrag worden betaald.
    url: https://wetten.overheid.nl/BWBR0003933/2002-06-26#Artikel13
  - number: '13.9'
    text: |-
      Het uitvoeringsorgaan stort de van de verzekeraars ontvangen bedragen met bekwame spoed in de Algemene Kas, bedoeld
      in de [Ziekenfondswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002460
    url: https://wetten.overheid.nl/BWBR0003933/2002-06-26#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002460
  - number: '17.1'
    text: |-
      Voor de uitvoering van deze wet kunnen bij of krachtens algemene maatregel van bestuur nadere regelen worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0003933/2002-06-26#Artikel17
  - number: '17.2'
    text: |-
      De voordracht tot het vaststellen van een koninklijk besluit ter uitvoering van deze wet wordt Ons gedaan door
      Onze Minister in overeenstemming met Onze Ministers van Volksgezondheid, Welzijn en Sport, van Economische Zaken
      en van Sociale Zaken en Werkgelegenheid. De Pensioen- & Verzekeringskamer verstrekt Onze Minister desgevraagd de
      inlichtingen die nodig zijn voor de beoordeling van de uitvoerbaarheid van het voorgenomen besluit.
    url: https://wetten.overheid.nl/BWBR0003933/2002-06-26#Artikel17
  - number: '18'
    text: |-
      Tegen een op grond van deze wet genomen besluit kan een belanghebbende beroep instellen bij het College van Beroep
      voor het bedrijfsleven.
    url: https://wetten.overheid.nl/BWBR0003933/2002-06-26#Artikel18
  - number: '25'
    text: Deze wet treedt in werking met ingang van een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0003933/2002-06-26#Artikel25
  - number: '26'
    text: 'Deze wet kan worden aangehaald als: Wet medefinanciering oververtegenwoordiging oudere ziekenfondsverzekerden.'
    url: https://wetten.overheid.nl/BWBR0003933/2002-06-26#Artikel26
