preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om fiscale vereenvoudigingen door te voeren ter
    vermindering van de administratieve lasten van burgers en bedrijven en de uitvoeringskosten van de Belastingdienst
    alsmede ter vermindering van de regeldruk;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0026981/2014-01-01#ArtikelAanhef
