  - number: XXVIa
    text: |-
      Met betrekking tot een op 31 december 2010 bestaande kapitaalverzekering die op grond van
      [artikel 3.116 van de Wet inkomstenbelasting 2001][ref1], zoals dat artikel luidde op 31 december 2010, als
      kapitaalverzekering eigen woning wordt aangemerkt en op grond van artikel 3.116 van de Wet inkomstenbelasting
      2001, zoals dat artikel luidt op 1 januari 2011, niet meer als kapitaalverzekering eigen woning wordt aangemerkt,
      blijft [artikel 10bis.4, derde lid, onderdeel a, van de Wet inkomstenbelasting 2001][ref2] buiten toepassing
      indien de verzekering niet meer voldoet aan de voorwaarden van het tweede lid van dat artikel uitsluitend
      doordat degene met wie de belastingplichtige tot 1 januari 2011 een gezamenlijke huishouding voerde, vanaf 1
      januari 2011 niet als partner als bedoeld in [artikel 5a van de Algemene wet inzake rijksbelastingen][ref3] of
      [artikel 1.2 van de Wet inkomstenbelasting 2001][ref4] van de belastingplichtige wordt aangemerkt.


