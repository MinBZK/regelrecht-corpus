$id: wet_inrichting_landelijk_gebied
regulatory_layer: WET
publication_date: '2016-07-21'
valid_from: '2019-01-01'
bwb_id: BWBR0020748
url: https://wetten.overheid.nl/BWBR0020748/2019-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regels te stellen over de verdeling van bevoegdheden
    tussen Rijk en provincies bij de vaststelling, financiering en uitvoering van het gebiedsgerichte beleid en dat
    om in het kader van dat beleid te komen tot een doelmatiger toepassing van het instrument van de landinrichting
    de bepalingen van de Landinrichtingswet zodanig ingrijpend moeten worden herzien dat het wenselijk is hiervoor een
    geheel nieuwe wettelijke regeling vast te stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *blok:* geheel van in een herverkaveling
      begrepen onroerende zaken;
        - *Dienst landelijk gebied:* Dienst landelijk gebied van het Ministerie van Landbouw, Natuur en Voedselkwaliteit;
        - *eigenaar:* degene die eigenaar is van een tot het blok behorende onroerende zaak en degene aan wie een recht
      van opstal, erfpacht, beklemming, vruchtgebruik, gebruik of bewoning toebehoort waaraan een in het blok begrepen
      onroerende zaak is onderworpen;
        - *herverkaveling:* samenvoeging, verkaveling en verdeling van onroerende zaken met toepassing van
      [hoofdstuk 8, titel 3][ref1];
        - *landinrichting:* maatregelen en voorzieningen gericht op de inrichting van het landelijke gebied met
      gebruikmaking van de bevoegdheden en instrumenten, bedoeld in de [hoofdstukken 4 tot en met 9][ref2];
        - *rechthebbende*: 1°. eigenaar en degene aan wie een niet onder de omschrijving van eigenaar benoemd
      beperkt recht toebehoort waaraan een tot het blok behorende onroerende zaak is onderworpen, 2°. de
      huurder van zulk een zaak, of 3°. degene aan wie met betrekking tot zulk een zaak een recht als bedoeld in
      [artikel 252 van Boek 6 van het Burgerlijk Wetboek][ref3] toebehoort;
        - *openbare registers:* openbare registers als bedoeld in
      [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref4];
        - *Onze Minister:* Onze Minister van Landbouw, Natuur en Voedselkwaliteit.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Hoofdstuk8
      [ref2]: https://wetten.overheid.nl/BWBR0020748#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0005289#Artikel252
      [ref4]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020748
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0020748
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0005289
        artikel: '252'
      - id: ref4
        bwb_id: BWBR0005291
        afdeling: '2'
  - number: '1.2'
    text: |-
      Voor zover niet anders bepaald, wordt in deze wet en de daarop berustende bepalingen verstaan onder: -
      *gedeputeerde staten:* gedeputeerde staten van de provincie waarin het in te richten gebied geheel of grotendeels
      is gelegen;
        - *provincie:* provincie waarin het in te richten gebied geheel of grotendeels is gelegen.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel1
  - number: '2.1'
    text: |-
      Gedeputeerde staten kunnen de op grond van de [hoofdstukken 4 tot en met 8][ref1] van deze
      wet aan hen toekomende bevoegdheden delegeren aan een bestuurscommissie als bedoeld in
      [artikel 81, eerste lid, van de Provinciewet][ref2], of aan een ander orgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel81
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0020748
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0005645
        artikel: '81'
  - number: '2.2'
    text: 'De Dienst landelijk gebied staat desgevraagd gedeputeerde staten en andere openbare lichamen bij:'
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel2
  - number: 2.2.a
    text: |-
      in de uitoefening van de bij of krachtens deze of enige andere wet aan hen toegekende en op landinrichting
      betrekking hebbende bevoegdheden, en
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel2
  - number: 2.2.b
    text: |-
      in de uitvoering van ander beleid gericht op de verbetering van de kwaliteit van het landelijke gebied, voor zover
      het betreft inrichting, gebruik en beheer van daarvoor specifiek in aanmerking komende delen van het landelijke
      gebied.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel2
  - number: '2.3'
    text: |-
      Het bestuur van de Dienst voor het kadaster en de openbare registers besluit na overleg met gedeputeerde staten,
      onderscheidenlijk het bestuur van het openbaar lichaam omtrent de door de dienst te leveren bijstand bij de
      uitoefening van de in het tweede lid, onderdeel a, bedoelde bevoegdheden en de uitvoering van het in het tweede
      lid, onderdeel b, bedoelde beleid.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel2
  - number: '16'
    text: |-
      Landinrichting strekt tot verbetering van de inrichting van het landelijke gebied overeenkomstig de functies van
      dat gebied, zoals deze in het kader van de ruimtelijke ordening zijn aangegeven.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel16
  - number: '17.1'
    text: Gedeputeerde staten kunnen besluiten tot toepassing van landinrichting door vaststelling van een inrichtingsplan.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel17
  - number: '17.2'
    text: 'Een inrichtingsplan bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel17
  - number: 17.2.a
    text: de begrenzing van het in te richten gebied;
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel17
  - number: 17.2.b
    text: een zo nauwkeurig mogelijke aanduiding van de te treffen maatregelen en voorzieningen;
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel17
  - number: 17.2.c
    text: in voorkomend geval een aanduiding van te verwerven onroerende zaken;
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel17
  - number: 17.2.d
    text: een of meer kaarten die met inachtneming van het derde lid zijn vervaardigd; en
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel17
  - number: 17.2.e
    text: |-
      indien een van de in onderdeel b bedoelde maatregelen of voorzieningen herverkaveling betreft, een zo nauwkeurig
      mogelijke raming van de kosten daarvan en het aandeel van die kosten dat ten laste zal worden gebracht van de
      gezamenlijke eigenaren in het te herverkavelen blok.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel17
  - number: '17.3'
    text: 'Op de kaarten, bedoeld in het tweede lid, onderdeel d, worden zo nauwkeurig mogelijk aangegeven:'
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel17
  - number: 17.3.a
    text: de begrenzing van het in te richten gebied;
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel17
  - number: 17.3.b
    text: |-
      in voorkomend geval de begrenzing van ieder blok, indien een van de in het tweede lid, onderdeel b, bedoelde
      maatregelen of voorzieningen herverkaveling betreft;
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel17
  - number: 17.3.c
    text: |-
      in voorkomend geval de te ontwikkelen natuur- en bosgebieden, landschappelijke elementen, waaronder
      cultuurhistorische, aardkundige en natuurwetenschappelijke elementen, en recreatieve voorzieningen;
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel17
  - number: 17.3.d
    text: |-
      in voorkomend geval de te verbeteren en nieuw aan te leggen openbare wegen, waterlopen, dijken of kaden met de
      daarbij behorende kunstwerken;
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel17
  - number: 17.3.e
    text: in voorkomend geval de te verwerven onroerende zaken; en
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel17
  - number: 17.3.f
    text: |-
      in voorkomend geval de maatregelen of voorzieningen voor de verwezenlijking waarvan [artikel 56, eerste lid][ref1],
      kan worden toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel56
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '56'
        hoofdstuk: '8'
        paragraaf: '3'
        afdeling: '4'
  - number: '18.1'
    text: |-
      Op de voorbereiding van het inrichtingsplan of van een wijziging daarvan is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '18.2'
    text: |-
      Voorafgaand aan de terinzagelegging van het ontwerp van het inrichtingsplan of van het ontwerp van een wijziging
      van het inrichtingsplan, voeren gedeputeerde staten daaromtrent overleg met burgemeester en wethouders van de
      betrokken gemeenten en de dagelijkse besturen van de betrokken waterschappen.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel18
  - number: '20'
    text: |-
      Voor zover een inrichtingsplan als een van de maatregelen en voorzieningen, bedoeld in
      [artikel 17, tweede lid, onderdeel b][ref1], voorziet in herverkaveling, kan dat inrichtingsplan ten
      aanzien van die herverkaveling niet meer worden gewijzigd nadat het ontwerp van het ruilplan overeenkomstig
      [artikel 64, eerste lid][ref2], ter inzage is gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0020748#Artikel64
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '17'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0020748
        artikel: '64'
        hoofdstuk: '8'
        paragraaf: '6'
        afdeling: '4'
  - number: '22.1'
    text: |-
      Indien gedeputeerde staten het ten behoeve van de voorbereiding van landinrichting nodig achten dat grond wordt
      betreden of daarop graafwerkzaamheden of metingen worden verricht of tekens worden gesteld, staat de eigenaar van
      de grond of degene aan wie een beperkt recht of gebruiksrecht toebehoort waaraan de grond is onderworpen dit toe.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel22
  - number: '22.2'
    text: |-
      Voor zover een belanghebbende ten gevolge van de toepassing van het eerste lid schade lijdt of zal lijden kennen
      gedeputeerde staten op aanvraag een naar billijkheid te bepalen schadevergoeding toe.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel22
  - number: '22.3'
    text: Gedeputeerde staten kunnen op aanvraag een voorschot op de schadevergoeding toekennen.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel22
  - number: '22.4'
    text: |-
      In dit artikel wordt verstaan onder gedeputeerde staten: gedeputeerde staten van de provincie waar de gronden die
      worden betreden of waarop de in het eerste lid genoemde werkzaamheden worden verricht, geheel of grotendeels zijn
      gelegen.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel22
  - number: '23.1'
    text: 'Geen wijziging wordt gebracht in de rechten en in de gebruikstoestand ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel23
  - number: 23.1.a
    text: |-
      begraafplaatsen, crematoria en bewaarplaatsen als bedoeld in onderscheidenlijk de [artikelen 23][ref1], [49][ref2]
      en [62, eerste lid, onder c, van de Wet op de lijkbezorging][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0005009#Artikel49
      [ref3]: https://wetten.overheid.nl/BWBR0005009#Artikel62
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005009
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0005009
        artikel: '49'
      - id: ref3
        bwb_id: BWBR0005009
        artikel: '62'
  - number: 23.1.b
    text: |-
      gesloten begraafplaatsen dan wel graven of grafkelders als bedoeld in
      [artikel 85 van de Wet op de lijkbezorging][ref1], binnen de termijnen en anders dan op de wijze, omschreven in
      [artikel 46, tweede en derde lid, van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel85
      [ref2]: https://wetten.overheid.nl/BWBR0005009#Artikel46
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005009
        artikel: '85'
      - id: ref2
        bwb_id: BWBR0005009
        artikel: '46'
  - number: '23.2'
    text: |-
      Zonder instemming van Onze Minister van Defensie wordt geen wijziging gebracht in de gebruikstoestand van
      onroerende zaken die een militaire bestemming hebben.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel23
  - number: '23.3'
    text: |-
      Zonder instemming van de eigenaar wordt geen wijziging gebracht in diens recht ten aanzien van gebouwen, behoudens
      in geval van onteigening als bedoeld in [artikel 122 van de onteigeningswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel122
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '122'
  - number: '24'
    text: |-
      Indien in het in te richten gebied, zoals dat wordt begrensd in het inrichtingsplan, gronden zijn gelegen ten
      aanzien waarvan uit anderen hoofde dan deze wet door een tot het Rijk behorend bestuursorgaan besluitvorming
      wordt voorbereid of heeft plaatsgevonden omtrent de aanleg van een infrastructurele voorziening van nationaal
      of regionaal belang, geschiedt de voorbereiding en vaststelling van het inrichtingsplan met inachtneming van het
      bepaalde in dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel24
  - number: '25'
    text: |-
      Voorafgaand aan de vaststelling van het inrichtingsplan voeren gedeputeerde staten overleg omtrent de voorgenomen
      landinrichting met het bestuursorgaan, bedoeld in [artikel 24][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel24
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '24'
        hoofdstuk: '5'
  - number: '26.1'
    text: |-
      Indien in het inrichtingsplan als een van de maatregelen of voorzieningen herverkaveling is opgenomen, behoeft het
      inrichtingsplan, voor zover dit voorziet in de opname in een blok van gronden, ten aanzien waarvan besluitvorming
      omtrent de aanleg van een infrastructurele voorziening door het in [artikel 24][ref1] bedoelde bestuursorgaan wordt
      voorbereid of heeft plaatsgevonden, de goedkeuring van dat bestuursorgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel24
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '24'
        hoofdstuk: '5'
  - number: '26.2'
    text: |-
      De goedkeuring kan worden onthouden op de grond dat de opname in een blok van gronden als bedoeld in het eerste lid
      de verwezenlijking van de desbetreffende infrastructurele voorziening ernstig zou kunnen belemmeren.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel26
  - number: '27'
    text: |-
      Dit hoofdstuk is van toepassing indien in het inrichtingsplan een of meer van de volgende maatregelen of
      voorzieningen worden opgenomen:
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel27
  - number: 27.a
    text: wijziging van het stelsel van wegen, waterlopen, dijken of kaden met de daarbij behorende kunstwerken;
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel27
  - number: 27.b
    text: |-
      veiligstelling, aanleg of ontwikkeling van gebieden van belang uit een oogpunt van natuur- en landschapsbehoud of
      van elementen van landschappelijke, recreatieve, cultuurhistorische, aardkundige of natuurwetenschappelijke waarde;
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel27
  - number: 27.c
    text: uitvoering van andere werken van openbaar nut.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel27
  - number: '28'
    text: 'Het inrichtingsplan voorziet in voorkomend geval in:'
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel28
  - number: 28.a
    text: 'de toewijzing van eigendom van:'
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel28
  - number: 28.a.1°
    text: wegen of waterlopen met de daartoe behorende kunstwerken;
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel28
  - number: 28.a.2°
    text: |-
      gebieden van belang uit een oogpunt van natuur- en landschapsbehoud en van elementen van landschappelijke,
      recreatieve, cultuurhistorische, aardkundige of natuurwetenschappelijke waarde;
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel28
  - number: 28.a.3°
    text: andere voorzieningen van openbaar nut; en
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel28
  - number: 28.b
    text: |-
      de toewijzing en regeling van het beheer en onderhoud van wegen, waterlopen, dijken of kaden met de daartoe
      behorende kunstwerken.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel28
  - number: '29.1'
    text: |-
      De toewijzing, bedoeld in [artikel 28, onderdeel a, onder 1°][ref1], geschiedt aan de daarvoor in aanmerking
      komende openbare lichamen of andere rechtspersonen.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel28
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '28'
        hoofdstuk: '6'
  - number: '29.2'
    text: |-
      Het beheer en het onderhoud van openbare wegen met de daartoe behorende kunstwerken worden toegewezen aan de
      daarvoor in aanmerking komende openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel29
  - number: '29.3'
    text: |-
      In afwijking van het tweede lid kan, indien bijzondere omstandigheden daartoe aanleiding geven, het onderhoud van
      openbare wegen worden toegewezen aan andere rechtspersonen dan openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel29
  - number: '29.4'
    text: |-
      Bij het opstellen van een ontwerp van het inrichtingsplan stellen gedeputeerde staten de in het eerste tot en met
      derde lid bedoelde openbare lichamen en rechtspersonen, voor zover deze de eigendom, het beheer of het onderhoud
      hadden voor de landinrichting, in de gelegenheid hun zienswijze naar voren te brengen.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel29
  - number: '29.5'
    text: |-
      Tenzij een rechtspersoon, niet zijnde een openbaar lichaam, voor de landinrichting de eigendom, het beheer of het
      onderhoud van openbare wegen, waterlopen, dijken of kaden met de daartoe behorende kunstwerken had, geschiedt de
      toewijzing hiervan pas indien overeenstemming is verkregen met de betrokken rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel29
  - number: '29.6'
    text: |-
      De toewijzing van de eigendom, het beheer en het onderhoud van openbare wegen, waterlopen, dijken of kaden met de
      daartoe behorende kunstwerken geschiedt zonder geldelijke verrekening, met dien verstande dat dit in de gegeven
      omstandigheden niet tot onredelijke gevolgen voor het betrokken openbaar lichaam mag leiden.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel29
  - number: '29.7'
    text: |-
      Onttrekking van de eigendom, het beheer en het onderhoud van openbare wegen, waterlopen, dijken of kaden met de
      daartoe behorende kunstwerken aan het Rijk geschiedt niet dan nadat daaromtrent overeenstemming is verkregen met
      Onze Minister wie het aangaat.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel29
  - number: '29.8'
    text: |-
      Tenzij het Rijk voor de landinrichting hiermee reeds was belast, is het bepaalde in het zevende lid van
      overeenkomstige toepassing op de toewijzing aan het Rijk van de eigendom, het beheer en het onderhoud van openbare
      wegen, waterlopen, dijken of kaden met de daartoe behorende kunstwerken.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel29
  - number: '30'
    text: |-
      De eigendom, het beheer en het onderhoud van de gebieden en voorzieningen, bedoeld in
      [artikel 28, onderdeel a, onder 2° en 3°][ref1], worden toegewezen aan:


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel28
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '28'
        hoofdstuk: '6'
  - number: 30.a
    text: de provincie; of
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel30
  - number: 30.b
    text: |-
      een ander openbaar lichaam of een andere rechtspersoon dan de provincie, indien dit lichaam of deze rechtspersoon
      daarmee instemt.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel30
  - number: '31.1'
    text: |-
      Voor zover het openbaar lichaam of de rechtspersoon voorheen niet was belast met het beheer en het onderhoud van
      openbare wegen, waterlopen, dijken of kaden met de daartoe behorende kunstwerken, gaan het beheer en onderhoud,
      in afwijking van de [artikelen 1][ref1] en [2 van de Waterstaatswet 1900][ref2] en de [artikelen 18a][ref3],
      [19][ref4] en [20 van de Wegenwet][ref5], over op het tijdstip van bekendmaking van het inrichtingsplan.


      [ref1]: https://wetten.overheid.nl/BWBR0001867#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0001867#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0001948#Artikel18a
      [ref4]: https://wetten.overheid.nl/BWBR0001948#Artikel19
      [ref5]: https://wetten.overheid.nl/BWBR0001948#Artikel20
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0001867
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0001867
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0001948
        artikel: 18a
      - id: ref4
        bwb_id: BWBR0001948
        artikel: '19'
      - id: ref5
        bwb_id: BWBR0001948
        artikel: '20'
  - number: '31.2'
    text: |-
      Het beheer en het onderhoud van de voorzieningen, bedoeld in het eerste lid, gaan over op een later tijdstip dan
      bedoeld in het eerste lid indien:
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel31
  - number: 31.2.a
    text: aan bestaande voorzieningen verbeteringswerken worden uitgevoerd; of
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel31
  - number: 31.2.b
    text: het nieuwe voorzieningen betreft.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel31
  - number: '32.1'
    text: |-
      Tot het tijdstip, bedoeld in [artikel 31, eerste of tweede lid][ref1], berusten het beheer en het onderhoud
      van de openbare wegen, waterlopen, dijken of kaden met de daartoe behorende kunstwerken bij de beheers- en
      onderhoudsplichtigen die voor de landinrichting daarmee belast waren.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel31
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '31'
        hoofdstuk: '6'
  - number: '32.2'
    text: |-
      In afwijking van het eerste lid berusten vanaf het tijdstip waarop gedeputeerde staten opdracht geven tot de
      uitvoering van de verbeteringswerken tot het tijdstip, bedoeld in [artikel 31, eerste of tweede lid][ref1],
      het beheer en het onderhoud bij gedeputeerde staten van de provincie waarbinnen de in het eerste lid bedoelde
      voorzieningen geheel of grotendeels zijn gelegen, indien het betreft verbetering van deze voorzieningen.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel31
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '31'
        hoofdstuk: '6'
  - number: '32.3'
    text: |-
      Het beheer en het onderhoud van nieuwe voorzieningen als bedoeld in het eerste lid berusten tot het tijdstip,
      bedoeld in [artikel 31, eerste of tweede lid][ref1], bij gedeputeerde staten van de provincie waarbinnen deze
      voorzieningen geheel of grotendeels zijn gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel31
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '31'
        hoofdstuk: '6'
  - number: '33.1'
    text: |-
      In afwijking van de [artikelen 8][ref1] en [9 van de Wegenwet][ref2] kan in het inrichtingsplan de aanduiding
      worden opgenomen van wegen met de daartoe behorende kunstwerken die voorheen voor het openbaar verkeer waren
      opengesteld en die door het enkele feit van deze aanduiding aan het openbaar verkeer worden onttrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0001948#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0001948#Artikel9
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0001948
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0001948
        artikel: '9'
  - number: '33.2'
    text: |-
      Aan wegen met de daartoe behorende kunstwerken die in het inrichtingsplan als openbare weg zijn opgenomen maar
      die voorheen niet voor het openbaar verkeer waren opengesteld, is, in afwijking van de [artikelen 4][ref1] en
      [5 van de Wegenwet][ref2], door het enkele feit van opneming de bestemming van openbare weg gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0001948#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0001948#Artikel5
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0001948
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0001948
        artikel: '5'
  - number: '33.3'
    text: |-
      De in het eerste en tweede lid genoemde rechtsgevolgen gaan in op het tijdstip van bekendmaking van het
      inrichtingsplan.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel33
  - number: '33.4'
    text: |-
      In afwijking van het derde lid kunnen gedeputeerde staten van de provincie waar de betrokken wegen met de daartoe
      behorende kunstwerken geheel of grotendeels zijn gelegen, in voorkomend geval in overeenstemming met gedeputeerde
      staten van de provincies waar de betrokken wegen en kunstwerken mede zijn gelegen, besluiten dat de in dat lid
      bedoelde rechtsgevolgen ingaan op een ander, door hen te bepalen tijdstip, dat voor de onderscheiden wegen met de
      daartoe behorende kunstwerken, verschillend kan zijn.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel33
  - number: '34.1'
    text: |-
      Na bekendmaking van het inrichtingsplan wordt op een door gedeputeerde staten te bepalen tijdstip een akte
      ter zake van de toewijzing, bedoeld in [artikel 28, onderdeel a][ref1], een en ander voor zover de toewijzing
      betrekking heeft op onroerende zaken gelegen buiten een blok, opgemaakt door een door gedeputeerde staten
      aan te wijzen notaris en ondertekend door de voorzitter van gedeputeerde staten en de secretaris, bedoeld in
      [artikel 100 van de Provinciewet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel100
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '28'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0005645
        artikel: '100'
  - number: '34.2'
    text: Door de inschrijving van de akte in de openbare registers wordt de daarin omschreven eigendom verkregen.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel34
  - number: '34.3'
    text: |-
      Voor zover tegen het inrichtingsplan beroep is ingesteld betreffende de in het eerste lid bedoelde toewijzing,
      doen gedeputeerde staten van de uitspraak in beroep mededeling door toezending, ter inschrijving in de openbare
      registers, aan het desbetreffende kantoor van de Dienst voor het kadaster en de openbare registers:
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel34
  - number: 34.3.a
    text: |-
      indien door de uitspraak in beroep de eigendom aan een ander wordt toegewezen dan in de in het eerste lid bedoelde
      akte is vermeld;
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel34
  - number: 34.3.b
    text: |-
      indien de in [artikel 81][ref1] bedoelde ruilakte is ingeschreven in de openbare registers en door de uitspraak in
      beroep de eigendom aan een ander wordt toegewezen dan in de ruilakte is vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel81
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '81'
        hoofdstuk: '8'
        afdeling: '6'
  - number: '34.4'
    text: |-
      Door inschrijving van de uitspraak in beroep in de openbare registers wordt de in die uitspraak omschreven eigendom
      verkregen door de in die uitspraak genoemde openbare lichamen of andere rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel34
  - number: '34.5'
    text: |-
      Indien op grond van [artikel 8:81 van de Algemene wet bestuursrecht][ref1] in samenhang met
      [artikel 46 van de Wet op de Raad van State][ref2] een voorlopige voorziening ter zake van het inrichtingsplan is
      gevraagd en is toegewezen, vindt het eerste lid geen toepassing zolang de werking van het besluit tot vaststelling
      van het inrichtingsplan krachtens de uitspraak van de voorzieningenrechter is opgeschort.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002367#Artikel46
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0002367
        artikel: '46'
  - number: '35.1'
    text: |-
      Met ingang van het tijdstip waarop het ontwerp van het inrichtingsplan ter inzage is gelegd tot het tijdstip waarop
      het inrichtingsplan voor de betrokken onroerende zaken is verwezenlijkt is het, behoudens ontheffing, verboden
      handelingen te verrichten die de verwezenlijking van het inrichtingsplan ernstig belemmeren. De ontheffing wordt
      verleend door gedeputeerde staten van de provincie waar de betrokken onroerende zaken geheel of grotendeels zijn
      gelegen.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel35
  - number: '35.2'
    text: |-
      Na bekendmaking van het inrichtingsplan is het, behoudens ontheffing, eigenaren en gebruiksgerechtigden van
      tot een blok behorende onroerende zaken verboden handelingen te verrichten, of handelingen die door een normale
      bedrijfsvoering worden geëist achterwege te laten, indien daardoor de waarde van hun onroerende zaken zou
      veranderen. De tweede volzin van het eerste lid is van toepassing.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel35
  - number: '35.3'
    text: |-
      Indien de verandering van de waarde, bedoeld in het tweede lid, een waardevermeerdering betreft, behoeft deze niet
      te worden vergoed, tenzij deze vermeerdering het gevolg is van handelingen waarvoor ontheffing is verleend.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel35
  - number: '36.1'
    text: Zodra een inrichtingsplan is bekendgemaakt, kan de uitvoering hiervan ter hand worden genomen.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel36
  - number: '36.2'
    text: Voor zover niet anders is bepaald, zijn gedeputeerde staten belast met de uitvoering.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel36
  - number: '37.1'
    text: Gedeputeerde staten kunnen besluiten het inrichtingsplan in delen in uitvoering te nemen.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel37
  - number: '37.2'
    text: |-
      Gedeputeerde staten kunnen besluiten bepaalde maatregelen of voorzieningen slechts in uitvoering te nemen,
      indien tussen gedeputeerde staten en een ander openbaar lichaam dan het Rijk overeenstemming is verkregen over de
      geldelijke bijdrage van het lichaam in de kosten van deze maatregel of voorziening en over de voorwaarden waaronder
      de vergoeding van deze kosten zal plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel37
  - number: '38.1'
    text: |-
      Gedeputeerde staten van de provincie waar de betrokken werken geheel of voor het grootste deel worden uitgevoerd,
      kunnen bepalen dat met name genoemde werken worden uitgevoerd door openbare lichamen die met het beheer of
      onderhoud daarvan zijn belast of vermoedelijk zullen worden belast, waarbij een doelmatig verband met andere werken
      zo veel mogelijk verzekerd zal zijn.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel38
  - number: '38.2'
    text: |-
      Omtrent de uitvoering van werken waarvan het beheer en het onderhoud vermoedelijk ten laste van het Rijk zullen
      komen, beslist Onze daarbij betrokken Minister, na gedeputeerde staten van de in het eerste lid bedoelde provincie
      te hebben gehoord.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel38
  - number: '39'
    text: |-
      Voor zover toepassing is gegeven aan [artikel 45, derde lid][ref1], kunnen het Rijk en de in dat lid bedoelde
      openbare lichamen en rechtspersonen op de aan hen in tijdelijk gebruik gegeven gronden alle werkzaamheden
      verrichten of doen verrichten, die zij nodig achten ter verwezenlijking van het inrichtingsplan.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel45
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '45'
        hoofdstuk: '8'
        afdeling: '3'
  - number: '40.1'
    text: |-
      Binnen het in te richten gebied kunnen op de terreinen metingen en waarnemingen worden verricht en tekens worden
      gesteld, kan binnen een blok houtgewas worden geplant of worden gekapt en kunnen zoden, aarde, grind en andere
      specie aan de terreinen worden onttrokken of daarop worden neergelegd.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel40
  - number: '40.2'
    text: |-
      Binnen een blok kunnen werken worden uitgevoerd met betrekking tot de ontsluiting, waterbeheersing, inrichting en
      profielopbouw der gronden.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel40
  - number: '40.3'
    text: |-
      Binnen een blok kunnen opstallen worden afgebroken, verbouwd, verplaatst, gebouwd of herbouwd, indien dit naar het
      oordeel van gedeputeerde staten van de provincie waar de betrokken opstal is gelegen nodig is ter verwezenlijking
      van het inrichtingsplan.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel40
  - number: '40.4'
    text: |-
      De uitvoering van de werken, bedoeld in het eerste tot en met derde lid, wordt niet ter hand genomen, dan nadat
      gedeputeerde staten van de provincie waar de betrokken onroerende zaak is gelegen een beschrijving hebben gemaakt
      van die onroerende zaak.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel40
  - number: '41.1'
    text: |-
      De eigenaar van een onroerende zaak of degene aan wie een beperkt recht of gebruiksrecht toebehoort staat toe dat
      de werken, bedoeld in de [artikelen 38 tot en met 40][ref1], worden uitgevoerd en dat daartoe zijn gebouwen en
      terreinen worden betreden.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel38
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '38'
        hoofdstuk: '8'
  - number: '41.2'
    text: |-
      Voor zover een belanghebbende ten gevolge van de toepassing van de [artikelen 38 tot en met 40][ref1] schade lijdt
      of zal lijden, kennen gedeputeerde staten op aanvraag een naar billijkheid te bepalen schadevergoeding toe.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel38
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '38'
        hoofdstuk: '8'
  - number: '41.3'
    text: |-
      Aan de belanghebbende wordt op aanvraag een door gedeputeerde staten te bepalen voorschot op de schadevergoeding
      toegekend.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel41
  - number: '41.4'
    text: |-
      In dit artikel wordt verstaan onder gedeputeerde staten: gedeputeerde staten van de provincie waar de gronden
      die worden betreden of waarop de in het eerste lid bedoelde werken worden uitgevoerd, geheel of grotendeels zijn
      gelegen.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel41
  - number: '42'
    text: |-
      De in deze titel geregelde procedure wordt gevolgd indien herverkaveling als een van de in
      [artikel 17, tweede lid, onderdeel b][ref1], bedoelde maatregelen of voorzieningen in het inrichtingsplan is
      opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel17
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '17'
        hoofdstuk: '4'
  - number: '43.1'
    text: |-
      Voor zover niet anders bepaald, wordt in deze titel verstaan onder gedeputeerde staten: gedeputeerde staten van de
      provincie waarin het blok waarbinnen herverkaveling zal plaatsvinden geheel of grotendeels is gelegen.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel43
  - number: '43.2'
    text: |-
      Indien het blok waarbinnen herverkaveling zal plaatsvinden in meer dan één provincie is gelegen, nemen
      gedeputeerde staten de besluiten, bedoeld in de [artikelen 44][ref1], [45, eerste lid][ref2], [47][ref3] en
      [62, tweede lid][ref4], in overeenstemming met gedeputeerde staten van de andere provincies waarin het blok mede
      is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0020748#Artikel45
      [ref3]: https://wetten.overheid.nl/BWBR0020748#Artikel47
      [ref4]: https://wetten.overheid.nl/BWBR0020748#Artikel62
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '44'
        hoofdstuk: '8'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0020748
        artikel: '45'
        hoofdstuk: '8'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0020748
        artikel: '47'
        hoofdstuk: '8'
        paragraaf: '1'
        afdeling: '4'
      - id: ref4
        bwb_id: BWBR0020748
        artikel: '62'
        hoofdstuk: '8'
        paragraaf: '4'
        afdeling: '4'
  - number: '44'
    text: |-
      Zonder dat wijziging van het inrichtingsplan vereist is, kunnen gedeputeerde staten de grenzen van het blok
      wijzigen tot het tijdstip waarop het ontwerp van het ruilplan overeenkomstig [artikel 64, eerste lid][ref1], ter
      inzage wordt gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel64
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '64'
        hoofdstuk: '8'
        paragraaf: '6'
        afdeling: '4'
  - number: '45.1'
    text: |-
      Indien het belang van de landinrichting zulks vordert, kunnen gedeputeerde staten besluiten tot een blok behorende
      gronden tijdelijk in gebruik te geven. [Artikel 41][ref1] is van overeenkomstige toepassing op degene aan wie de
      betrokken grond tijdelijk in gebruik wordt gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel41
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '41'
        hoofdstuk: '8'
  - number: '45.2'
    text: |-
      Met betrekking tot het tijdelijk in gebruik geven van gronden zijn de ter zake van pacht geldende wettelijke
      bepalingen niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel45
  - number: '45.3'
    text: |-
      De gronden, bedoeld in het eerste lid, kunnen mede omvatten gronden die met toepassing van
      [artikel 56, eerste lid, onderdelen c en d][ref1], worden toegewezen aan het Rijk, openbare lichamen en
      rechtspersonen.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel56
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '56'
        hoofdstuk: '8'
        paragraaf: '3'
        afdeling: '4'
  - number: '46.1'
    text: |-
      Op de voorbereiding van een besluit als bedoeld in [artikel 45, eerste lid][ref1], is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '45'
        hoofdstuk: '8'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '46.2'
    text: |-
      Tegelijk met de kennisgeving, bedoeld in [artikel 3:12, eerste lid, van de Algemene wet bestuursrecht][ref1]
      geven gedeputeerde staten bij aangetekende brief kennis van de terinzagelegging en van de zakelijke inhoud van het
      ontwerp van het besluit aan de bij hen bekende belanghebbenden, waaronder voor zover van toepassing in ieder geval
      worden begrepen:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 46.2.a
    text: |-
      zij die met betrekking tot de gronden, bedoeld in [artikel 45, eerste lid][ref1], voorkomen op de lijst van
      rechthebbenden, bedoeld in [artikel 49][ref2], die onderdeel uitmaakt van het voor het desbetreffende blok in
      voorbereiding zijnde of vastgestelde ruilplan;


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0020748#Artikel49
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '45'
        hoofdstuk: '8'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0020748
        artikel: '49'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '4'
  - number: 46.2.b
    text: |-
      zij die overeenkomstig [artikel 65, eerste of tweede lid][ref1], een pachtovereenkomst met betrekking tot de
      gronden, bedoeld in [artikel 45, eerste lid][ref2], ter registratie hebben ingezonden; en


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0020748#Artikel45
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '65'
        hoofdstuk: '8'
        paragraaf: '6'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0020748
        artikel: '45'
        hoofdstuk: '8'
        afdeling: '3'
  - number: 46.2.c
    text: |-
      de wederpartij, bedoeld in [artikel 65, vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel65
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '65'
        hoofdstuk: '8'
        paragraaf: '6'
        afdeling: '4'
  - number: '47'
    text: |-
      Gedeputeerde staten stellen voor ieder blok een ruilplan en een lijst der geldelijke regelingen vast met
      inachtneming van het bepaalde in deze afdeling.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel47
  - number: '48'
    text: 'Het ruilplan bevat:'
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel48
  - number: 48.a
    text: een lijst van rechthebbenden; en
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel48
  - number: 48.b
    text: een plan van toedeling.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel48
  - number: '49'
    text: |-
      De lijst van rechthebbenden vermeldt voor de gronden binnen het blok zo volledig mogelijk ten aanzien van alle
      rechthebbenden de aard en omvang van het door hen ingebrachte recht.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel49
  - number: '50'
    text: |-
      De lijst van rechthebbenden wordt opgemaakt aan de hand van de basisregistratie kadaster, bedoeld in
      [artikel 48 van de Kadasterwet][ref1], alsmede aan de hand van de openbare registers.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel48
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '48'
  - number: '51.1'
    text: 'Het plan van toedeling bevat:'
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel51
  - number: 51.1.a
    text: de kavelindeling;
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel51
  - number: 51.1.b
    text: de toedeling van rechten;
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel51
  - number: 51.1.c
    text: |-
      de begrenzing van de eigendom van de openbare wegen, waterlopen, dijken of kaden met de daarbij behorende
      kunstwerken, en van de overige voorzieningen van algemeen belang;
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel51
  - number: 51.1.d
    text: |-
      de te handhaven, op te heffen en te vestigen pachtverhoudingen, onder vermelding van de in
      [artikel 54, tweede lid][ref1], bedoelde bepalingen inzake de duur en verlengbaarheid van de pachtovereenkomst;


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel54
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '54'
        hoofdstuk: '8'
        paragraaf: '3'
        afdeling: '4'
  - number: 51.1.e
    text: |-
      de in [artikel 60][ref1] bedoelde regeling, opheffing of vestiging van de beperkte rechten, het recht van huur en
      de lasten die met betrekking tot de onroerende zaken bestaan en


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel60
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '60'
        hoofdstuk: '8'
        paragraaf: '3'
        afdeling: '4'
  - number: 51.1.f
    text: de bepalingen inzake de ingebruikneming van de kavels.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel51
  - number: '51.2'
    text: Het plan van toedeling heeft uitsluitend betrekking op de gronden gelegen in het blok.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel51
  - number: '51.3'
    text: |-
      Bij de opstelling van het plan van toedeling houden gedeputeerde staten en gedeputeerde staten van de andere
      provincies waarin het blok mede is gelegen, rekening met de uitgangspunten, bedoeld in [artikel 63][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel63
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '63'
        hoofdstuk: '8'
        paragraaf: '5'
        afdeling: '4'
  - number: '52.1'
    text: |-
      Iedere eigenaar heeft aanspraak op het verkrijgen van een recht van dezelfde aard als hij had op de in een blok
      gelegen onroerende zaken.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel52
  - number: '52.2'
    text: |-
      De in het eerste lid bedoelde aanspraak bestaat niet ten aanzien van rechten op onroerende zaken die voor
      de verwezenlijking van het inrichtingsplan zijn of worden onteigend. De in het eerste lid bedoelde aanspraak
      bestaat evenwel wel ten aanzien van rechten op onroerende zaken, die in het kader van de realisatie van een
      infrastructurele voorziening als bedoeld in [artikel 26, eerste lid][ref1], zijn onteigend, voor zover de
      onteigende partij aangeeft tegen evenredige inbreng van de hem ingevolge de [onteigeningswet][ref2] toekomende
      schadeloosstelling in aanmerking te willen komen voor toedeling van grond.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0001842
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '26'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0001842
  - number: '52.3'
    text: |-
      Voor zover het belang van de landinrichting zich hiertegen niet verzet, wordt aan iedere eigenaar een recht
      toegedeeld met betrekking tot onroerende zaken van gelijke hoedanigheid en gebruiksbestemming als door hem is
      ingebracht.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel52
  - number: '52.4'
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld omtrent de uitvoering van het tweede lid, tweede volzin, en
      de in het derde lid bedoelde gelijke hoedanigheid en gebruiksbestemming.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel52
  - number: '53.1'
    text: |-
      Iedere pachter heeft aanspraak op het verkrijgen van een recht van dezelfde aard als hij had op de in een blok
      gelegen onroerende zaken.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel53
  - number: '53.2'
    text: |-
      De [artikelen 52, tweede tot en met vierde lid][ref1], [56][ref2] en [58][ref3] zijn van overeenkomstige
      toepassing, met dien verstande dat voor «eigenaar» wordt gelezen: pachter.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0020748#Artikel56
      [ref3]: https://wetten.overheid.nl/BWBR0020748#Artikel58
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '52'
        hoofdstuk: '8'
        paragraaf: '3'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0020748
        artikel: '56'
        hoofdstuk: '8'
        paragraaf: '3'
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0020748
        artikel: '58'
        hoofdstuk: '8'
        paragraaf: '3'
        afdeling: '4'
  - number: '53.3'
    text: |-
      De in het eerste lid bedoelde aanspraak bestaat slechts indien de pachtovereenkomst overeenkomstig
      [artikel 65, eerste lid][ref1], aan gedeputeerde staten ter registratie is ingezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel65
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '65'
        hoofdstuk: '8'
        paragraaf: '6'
        afdeling: '4'
  - number: '54.1'
    text: |-
      Bestaande pachtverhoudingen blijven zo veel mogelijk gehandhaafd. Wanneer het belang van de herverkaveling zulks
      dringend vordert, kan bij het ruilplan een bestaande pachtverhouding worden opgeheven en een nieuwe pachtverhouding
      worden gevestigd in dier voege dat aan een verpachter een pachter uit de in [artikel 53][ref1] bedoelde pachters
      wordt toegewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel53
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '53'
        hoofdstuk: '8'
        paragraaf: '3'
        afdeling: '4'
  - number: '54.2'
    text: |-
      Het ruilplan bepaalt tot welk tijdstip de uit een nieuw gevestigde pachtverhouding voortvloeiende pachtovereenkomst
      zal gelden en of deze overeenkomst, indien deze voor kortere dan de wettelijke duur zal gelden, voor verlenging
      vatbaar zal zijn. Daarbij wordt er zorg voor gedragen dat de pachter en de verpachter zo veel mogelijk dezelfde
      aanspraken houden als zij aan de opgeheven pachtverhouding konden ontlenen.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel54
  - number: '55'
    text: Elke kavel wordt zo gevormd dat deze uitweg heeft op een openbare land- of waterweg en zo mogelijk daaraan grenst.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel55
  - number: '56.1'
    text: |-
      Bij elk blok wordt de totale oppervlakte van alle bij de herverkaveling betrokken gronden tot een maximum van vijf
      procent verminderd met de oppervlakte van alle in het blok opgenomen gronden:
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel56
  - number: 56.1.a
    text: |-
      die in het belang van de herverkaveling benodigd zijn voor het tot stand brengen of verbeteren van openbare wegen
      en waterlopen;
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel56
  - number: 56.1.b
    text: die benodigd zijn voor de aanleg van de met die wegen en waterlopen samenhangende voorzieningen;
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel56
  - number: 56.1.c
    text: |-
      die benodigd zijn voor het verwezenlijken van maatregelen en voorzieningen met betrekking tot de natuur, het
      landschap en de openluchtrecreatie;
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel56
  - number: 56.1.d
    text: die anderszins bestemd zijn voor voorzieningen van openbaar nut.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel56
  - number: '56.2'
    text: |-
      Iedere eigenaar heeft aanspraak op een oppervlakte in kavels die gelijk is aan de oppervlakte van de door hem
      ingebrachte kavels, verminderd met het percentage waarmee de totale oppervlakte van alle in het blok opgenomen
      gronden ingevolge het eerste lid is verminderd. De eerste volzin is niet van toepassing ingeval van onteigening.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel56
  - number: '56.3'
    text: |-
      De totale oppervlakte, bedoeld in het tweede lid, is de oppervlakte van alle in het blok opgenomen gronden,
      verminderd met de oppervlakte van de voor de verwezenlijking van het inrichtingsplan ter onteigening aangewezen
      gronden.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel56
  - number: '56.4'
    text: |-
      Van het tweede lid kan worden afgeweken indien toepassing van dat lid de totstandkoming van een behoorlijke
      herverkaveling in de weg zou staan. Deze afwijking mag, tegen de wil van de eigenaar en van degene die op de
      onroerende zaak een recht van hypotheek of grondrente heeft, ten hoogste vijf procent bedragen van de oppervlakte
      waarop de eigenaar ingevolge het tweede lid aanspraak heeft, met dien verstande dat de toepassing van het eerste
      lid in samenhang met deze afwijking ten aanzien van een eigenaar niet leidt tot de toedeling van een oppervlakte
      die meer dan vijf procent kleiner is dan de oppervlakte van de door die eigenaar ingebrachte kavels.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel56
  - number: '57.1'
    text: |-
      Toewijzing van gronden voor doeleinden van openbaar nut, voor zover daarin is voorzien door middel van toepassing
      van [artikel 56, eerste lid, onderdeel c of d][ref1], vindt plaats tegen betaling van een tussen gedeputeerde
      staten, in overeenstemming met gedeputeerde staten van de andere provincies waarin het blok mede gelegen is, en het
      Rijk, een ander openbaar lichaam of een andere rechtspersoon overeengekomen bedrag, dat niet minder bedraagt dan de
      werkelijke waarde van de grond.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel56
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '56'
        hoofdstuk: '8'
        paragraaf: '3'
        afdeling: '4'
  - number: '57.2'
    text: |-
      Indien de toewijzing grond betreft ten aanzien waarvan de eigenaar of pachter een beroep heeft gedaan op
      [artikel 58, eerste lid][ref1], vindt deze toewijzing in afwijking van het eerste lid plaats tegen betaling van een
      bedrag dat gelijk is aan de in die bepaling omschreven vergoeding, met dien verstande dat indien dit bedrag lager
      zou zijn dan de werkelijke waarde van de grond, toewijzing plaatsvindt tegen deze werkelijke waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel58
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '58'
        hoofdstuk: '8'
        paragraaf: '3'
        afdeling: '4'
  - number: '57.3'
    text: |-
      Behoudens in het geval van [artikel 58, eerste lid][ref1], wordt het door het openbaar lichaam of een andere
      rechtspersoon betaalde bedrag in mindering gebracht op de ingevolge [artikel 90, derde lid][ref2], ten laste van de
      eigenaren vallende uitgaven.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0020748#Artikel90
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '58'
        hoofdstuk: '8'
        paragraaf: '3'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0020748
        artikel: '90'
        hoofdstuk: '10'
  - number: '58.1'
    text: |-
      Voor zover dit bijdraagt aan de landinrichting, ontvangt de eigenaar van onroerende zaken die zijn begrepen in de
      voornemens inzake de toewijzing, bedoeld in [artikel 28, onderdeel a, onder 2° en 3°][ref1], voor zover zulks
      geschiedt met toepassing van [artikel 56, eerste lid, onderdeel c of d][ref2], voor die zaken op aanvraag in
      afwijking van [artikel 56, tweede lid][ref3], een algehele vergoeding in geld.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0020748#Artikel56
      [ref3]: https://wetten.overheid.nl/BWBR0020748#Artikel56
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '28'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0020748
        artikel: '56'
        hoofdstuk: '8'
        paragraaf: '3'
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0020748
        artikel: '56'
        hoofdstuk: '8'
        paragraaf: '3'
        afdeling: '4'
  - number: '58.2'
    text: |-
      In het ruilplan kan worden bepaald dat een eigenaar, in afwijking van [artikel 56, tweede lid][ref1], een algehele
      vergoeding in geld zal ontvangen indien de oppervlakte van zijn in een blok gelegen onroerende zaken zo gering
      is dat de toepassing van [artikel 56, tweede lid][ref2], zou leiden tot de vorming van een niet behoorlijk te
      exploiteren kavel en hij geen redelijk belang heeft bij het verkrijgen van een zodanige kavel.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0020748#Artikel56
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '56'
        hoofdstuk: '8'
        paragraaf: '3'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0020748
        artikel: '56'
        hoofdstuk: '8'
        paragraaf: '3'
        afdeling: '4'
  - number: '59'
    text: |-
      In afwijking van [artikel 51, tweede lid][ref1], kunnen in het plan van toedeling met toestemming van hen die
      bevoegd zijn te beschikken over niet in het blok gelegen onroerende zaken, regelingen worden opgenomen over
      grenswijzigingen, burenrechten en erfdienstbaarheden.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel51
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '51'
        hoofdstuk: '8'
        paragraaf: '3'
        afdeling: '4'
  - number: '60.1'
    text: |-
      Voor zover de onroerende zaken in het plan van toedeling zijn opgenomen, worden de niet onder [artikel 52][ref1]
      begrepen beperkte rechten, het recht van huur en de lasten die met betrekking tot die onroerende zaken bestaan,
      geregeld of opgeheven onder de regeling van de geldelijke gevolgen daarvan. Ruilverkavelings-, herinrichtings-,
      reconstructie- en landinrichtingsrenten worden afgekocht overeenkomstig de daaromtrent geldende wettelijke
      bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel52
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '52'
        hoofdstuk: '8'
        paragraaf: '3'
        afdeling: '4'
  - number: '60.2'
    text: In het belang van de herverkaveling kunnen beperkte rechten worden gevestigd.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel60
  - number: '60.3'
    text: |-
      Hypotheken gaan met behoud van hun rang over op de kavels of gedeelten van kavels die in de plaats van de
      onroerende zaak waarop zij rusten, worden toegedeeld. In de gevallen, bedoeld in [artikel 58][ref1], oefenen de
      hypotheekhouder en degene die op de zaak een recht van grondrente had, hun rechten uit op de wijze als omschreven
      in [artikel 43 van de onteigeningswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel43
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '58'
        hoofdstuk: '8'
        paragraaf: '3'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0001842
        artikel: '43'
  - number: '60.4'
    text: |-
      Conservatoire en executoriale beslagen gaan over op de kavels of gedeelten van kavels die in de plaats van de
      onroerende zaak waarop zij gelegd zijn, worden toegedeeld, alsmede op de geldsommen die in de plaats van kavels of
      ter zake van onderbedeling worden toegekend.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel60
  - number: '61'
    text: |-
      Het verschil in oppervlakte tussen de ingebrachte en de na de toepassing van [artikel 56][ref1] toegedeelde kavels,
      wordt met de eigenaren in geld verrekend.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel56
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '56'
        hoofdstuk: '8'
        paragraaf: '3'
        afdeling: '4'
  - number: '62.1'
    text: 'De lijst der geldelijke regelingen houdt in:'
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel62
  - number: 62.1.a
    text: |-
      de uitkomst van de schatting, bedoeld in [artikel 68, eerste lid, onderdeel a][ref1], alsmede de zo nauwkeurig
      mogelijke opgave van de daaruit op grond van [artikel 90, derde lid][ref2], voortvloeiende kosten voor de betrokken
      eigenaren;


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0020748#Artikel90
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '68'
        hoofdstuk: '8'
        paragraaf: '7'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0020748
        artikel: '90'
        hoofdstuk: '10'
  - number: 62.1.b
    text: |-
      de uitkomst van de schatting, bedoeld in [artikel 68, eerste lid, onderdeel b][ref1], alsmede de zo nauwkeurig
      mogelijke opgave van de daarmee verband houdende geldelijke verrekeningen;


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel68
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '68'
        hoofdstuk: '8'
        paragraaf: '7'
        afdeling: '4'
  - number: 62.1.c
    text: 'een opgave van de geldelijke verrekeningen voor de betrokken eigenaren als gevolg van:'
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel62
  - number: 62.1.c.1°
    text: |-
      de toepassing van de [artikelen 58][ref1] en [61][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0020748#Artikel61
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '58'
        hoofdstuk: '8'
        paragraaf: '3'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0020748
        artikel: '61'
        hoofdstuk: '8'
        paragraaf: '4'
        afdeling: '4'
  - number: 62.1.c.2
    text: |-
      de toepassing van [artikel 60][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel60
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '60'
        hoofdstuk: '8'
        paragraaf: '3'
        afdeling: '4'
  - number: 62.1.c.3°
    text: |-
      de toe te kennen schadevergoedingen, anders dan die bedoeld in [artikel 41][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel41
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '41'
        hoofdstuk: '8'
  - number: 62.1.c.4°
    text: de overige zaken;
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel62
  - number: 62.1.d
    text: |-
      een opgave van de geldelijke verrekeningen voor de betrokken pachters als gevolg van de toepassing van
      [artikel 53][ref1] in samenhang met [artikel 58][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0020748#Artikel58
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '53'
        hoofdstuk: '8'
        paragraaf: '3'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0020748
        artikel: '58'
        hoofdstuk: '8'
        paragraaf: '3'
        afdeling: '4'
  - number: '62.2'
    text: |-
      Voor de bepaling van de in het eerste lid, onderdeel c, onder 1°, bedoelde verrekening stellen gedeputeerde
      staten de agrarische verkeerswaarde van de grond vast met inachtneming van de regels, bedoeld in
      [artikel 63, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel63
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '63'
        hoofdstuk: '8'
        paragraaf: '5'
        afdeling: '4'
  - number: '63.1'
    text: |-
      Bij algemene maatregel van bestuur worden de algemene uitgangspunten ten aanzien van de onderscheiden onderdelen
      van [artikel 51, eerste lid][ref1], vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel51
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '51'
        hoofdstuk: '8'
        paragraaf: '3'
        afdeling: '4'
  - number: '63.2'
    text: |-
      Bij algemene maatregel van bestuur worden de algemene uitgangspunten ten aanzien van de onderscheiden onderdelen
      van [artikel 62, eerste lid][ref1], alsmede de uitgangspunten ten aanzien van de bepaling van de agrarische
      verkeerswaarde, bedoeld in [artikel 62, tweede lid][ref2], vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0020748#Artikel62
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '62'
        hoofdstuk: '8'
        paragraaf: '4'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0020748
        artikel: '62'
        hoofdstuk: '8'
        paragraaf: '4'
        afdeling: '4'
  - number: '64.1'
    text: |-
      Op de voorbereiding van een besluit tot vaststelling van een ruilplan is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '64.2'
    text: |-
      Ten behoeve van het opstellen van het ontwerp, bedoeld in
      [artikel 3:11, eerste lid, van de Algemene wet bestuursrecht][ref1], geven gedeputeerde staten toepassing aan de
      [artikelen 65][ref2] en met [66][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020748#Artikel65
      [ref3]: https://wetten.overheid.nl/BWBR0020748#Artikel66
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020748
        artikel: '65'
        hoofdstuk: '8'
        paragraaf: '6'
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0020748
        artikel: '66'
        hoofdstuk: '8'
        paragraaf: '6'
        afdeling: '4'
  - number: '64.3'
    text: |-
      Tegelijk met de kennisgeving, bedoeld in [artikel 3:12, eerste lid, van de Algemene wet bestuursrecht][ref1]
      geven gedeputeerde staten bij aangetekende brief kennis van de terinzagelegging en van de zakelijke inhoud van het
      ontwerp van het besluit aan de bij hen bekende belanghebbenden, onder wie in ieder geval worden begrepen:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 64.3.a
    text: |-
      zij die voorkomen op de lijst van rechthebbenden, bedoeld in [artikel 49][ref1], welke onderdeel uitmaakt van het
      ontwerpbesluit;


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel49
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '49'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '4'
  - number: 64.3.b
    text: |-
      zij die overeenkomstig [artikel 65, eerste of tweede lid][ref1], een pachtovereenkomst ter registratie hebben
      ingezonden; en


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel65
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '65'
        hoofdstuk: '8'
        paragraaf: '6'
        afdeling: '4'
  - number: 64.3.c
    text: |-
      de wederpartij, bedoeld in [artikel 65, vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel65
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '65'
        hoofdstuk: '8'
        paragraaf: '6'
        afdeling: '4'
  - number: '65.1'
    text: |-
      Pachtovereenkomsten kunnen tot een door gedeputeerde staten te bepalen tijdstip ter registratie aan gedeputeerde
      staten worden ingezonden.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel65
  - number: '65.2'
    text: |-
      Indien pachtovereenkomsten zijn aangegaan na het tijdstip, bedoeld in het eerste lid, kunnen deze uiterlijk vier
      weken na het aangaan daarvan ter registratie worden ingezonden, doch uiterlijk tot een door gedeputeerde staten te
      bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel65
  - number: '65.3'
    text: |-
      Ten aanzien van de tijdstippen, bedoeld in het eerste en tweede lid, is
      [artikel 3:42, eerste lid, van de Algemene wet bestuursrecht][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '65.4'
    text: Van de registratie wordt door gedeputeerde staten een bewijs afgegeven.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel65
  - number: '65.5'
    text: |-
      Gedeputeerde staten zenden aan de wederpartij van degene die een pachtovereenkomst ter registratie heeft ingezonden
      bij aangetekende brief bericht van de inzending ter registratie.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel65
  - number: '65.6'
    text: |-
      De wederpartij kan zijn bedenkingen tegen de registratie binnen twee weken na de dagtekening van de brief, bedoeld
      in het vijfde lid, schriftelijk aan gedeputeerde staten kenbaar maken.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel65
  - number: '65.7'
    text: |-
      Indien overeenkomstig het zesde lid bedenkingen kenbaar zijn gemaakt, stellen gedeputeerde staten, onder
      vaststelling van die bedenkingen, bij aangetekende brief partijen ervan in kennis dat binnen twee weken na de
      dagtekening van deze brief aan gedeputeerde staten wordt gezonden hetzij een door beide partijen gewaarmerkte akte
      waaruit blijkt dat overeenstemming is verkregen, hetzij een gewaarmerkt afschrift van het verzoekschrift waarbij
      de meest gerede partij de beslissing van de pachtkamer van de rechtbank binnen welks rechtsgebied de desbetreffende
      onroerende zaak geheel of gedeeltelijk is gelegen, heeft ingeroepen. De waarmerking van het afschrift geschiedt
      door de griffier van de rechtbank.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel65
  - number: '65.8'
    text: |-
      Indien gedeputeerde staten van mening zijn dat met betrekking tot de ter registratie ingezonden pachtovereenkomst
      ten onrechte [artikel 318, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref1] niet in acht zijn genomen,
      dragen zij zo nodig partijen bij aangetekende brief op de beslissing van de grondkamer in te roepen en binnen
      vier weken na de dagtekening van deze brief een door de secretaris van de grondkamer gewaarmerkt afschrift van het
      verzoekschrift in te zenden.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel318
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '318'
  - number: '65.9'
    text: |-
      Indien gedeputeerde staten van mening zijn dat met betrekking tot de ter registratie ingezonden pachtovereenkomst
      [artikel 317, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref1] niet in acht is genomen, dragen zij zo
      nodig partijen bij aangetekende brief op de beslissing van de pachtkamer van de rechtbank in te roepen en binnen
      vier weken na de dagtekening van deze brief een door de griffier van de rechtbank gewaarmerkt afschrift van het
      verzoekschrift in te zenden.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel317
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '317'
  - number: '65.10'
    text: |-
      Indien aan het zevende tot en met het negende lid geen gevolg is gegeven, hoeft in het ruilplan met het bestaan van
      de pachtovereenkomst geen rekening te worden houden.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel65
  - number: '65.11'
    text: |-
      De grondkamer en de pachtkamer van de rechtbank en in beroep de Centrale Grondkamer en de pachtkamer van het
      gerechtshof Arnhem-Leeuwarden behandelen de verzoeken en vorderingen, bedoeld in het zevende tot en met het negende
      lid, vóór alle andere zaken.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel65
  - number: '66'
    text: |-
      Gedeputeerde staten stellen in overeenstemming met gedeputeerde staten van de andere provincies waarin het blok
      mede gelegen is, op een of meer door hen te bepalen plaatsen en tijdstippen de eigenaren en gebruikers in de
      gelegenheid hun wensen ten aanzien van het plan van toedeling kenbaar te maken.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel66
  - number: '67.1'
    text: |-
      Op de voorbereiding van een besluit tot vaststelling van een lijst der geldelijke regelingen is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '67.2'
    text: |-
      Ten behoeve van het opstellen van het ontwerp, bedoeld in
      [artikel 3:11, eerste lid, van de Algemene wet bestuursrecht][ref1], geven gedeputeerde staten toepassing aan
      artikel 68. Het ontwerp wordt opgesteld met inachtneming van het onherroepelijk geworden ruilplan.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '67.3'
    text: |-
      Tegelijk met de kennisgeving, bedoeld in [artikel 3:12, eerste lid, van de Algemene wet bestuursrecht][ref1]
      geven gedeputeerde staten bij aangetekende brief kennis van de terinzagelegging en van de zakelijke inhoud van het
      ontwerp van het besluit aan de bij hen bekende belanghebbenden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '68.1'
    text: |-
      Gedeputeerde staten geven op een door hen te bepalen tijdstip aan daartoe door hen aan te wijzen schatters opdracht
      tot het schatten van:
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel68
  - number: 68.1.a
    text: de verandering van de waarde van de onroerende zaken als gevolg van de landinrichting voor iedere eigenaar;
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel68
  - number: 68.1.b
    text: |-
      de geldelijke verrekeningen tussen de oude en de nieuwe eigenaar bij overgang van onroerende zaken, ten aanzien
      van:
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel68
  - number: 68.1.b.1°
    text: |-
      de waardeverandering, bedoeld in [artikel 35, tweede en derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel35
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '35'
        hoofdstuk: '7'
  - number: 68.1.b.2°
    text: de waarde van gebouwen, werken en beplantingen;
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel68
  - number: 68.1.b.3°
    text: de andere dan de agrarische waarde van gronden;
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel68
  - number: 68.1.b.4°
    text: de overige zaken.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel68
  - number: '68.2'
    text: |-
      Bij de schatting nemen de schatters de regels, bedoeld in [artikel 63][ref1], in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel63
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '63'
        hoofdstuk: '8'
        paragraaf: '5'
        afdeling: '4'
  - number: '69.1'
    text: |-
      Tegen het besluit, bedoeld in [artikel 45, eerste lid][ref1], en het besluit tot vaststelling van het ruilplan
      onderscheidenlijk de lijst der geldelijke regelingen, kunnen belanghebbenden bij verzoekschrift als bedoeld in
      [artikel 261 van het Wetboek van Burgerlijke rechtsvordering][ref2] in beroep komen bij de rechtbank, binnen het
      rechtsgebied waarvan gedeputeerde staten hun zetel hebben. De [artikelen 6:2][ref3], [6:7 tot en met 6:20][ref4] en
      [6:22 van de Algemene wet bestuursrecht][ref5] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel261
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '45'
        hoofdstuk: '8'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '261'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '6'
  - number: '69.2'
    text: Het verzoekschrift kan door belanghebbende of diens gemachtigde worden ondertekend.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel69
  - number: '69.3'
    text: |-
      Zodra een verzoekschrift is ingediend, zendt de griffier een afschrift daarvan aan gedeputeerde staten.
      Gedeputeerde staten zenden onverwijld aan de griffier:
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel69
  - number: 69.3.a
    text: |-
      een lijst van de belanghebbenden ten aanzien van wie het ruilplan onderscheidenlijk de lijst der geldelijke
      regelingen wordt gewijzigd indien het beroep gegrond is;
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel69
  - number: 69.3.b
    text: |-
      een afschrift van de stukken waarop het ruilplan onderscheidenlijk de lijst der geldelijke regelingen ten aanzien
      van de indiener van het beroep is gebaseerd;
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel69
  - number: 69.3.c
    text: |-
      een afschrift van de tegen het ruilplan onderscheidenlijk de lijst der geldelijke regelingen ingebrachte
      zienswijzen, voor zover samenhangend met het beroep, en
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel69
  - number: 69.3.d
    text: |-
      afschriften van de overige op het ruilplan onderscheidenlijk de lijst der geldelijke regelingen betrekking hebbende
      bescheiden die van belang zijn voor de beoordeling van het beroep.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel69
  - number: '70.1'
    text: |-
      De rechtbank beslist omtrent de wijze waarop het ruilplan onderscheidenlijk de lijst der geldelijke regelingen
      wordt gewijzigd na oproeping van de verzoeker, gedeputeerde staten en de belanghebbenden ten aanzien van wie
      het ruilplan onderscheidenlijk de lijst der geldelijke regelingen wordt gewijzigd indien het beroep gegrond is.
      Belanghebbenden en gedeputeerde staten kunnen bij gemachtigde verschijnen.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel70
  - number: '70.2'
    text: |-
      De beroepen tegen het besluit tot vaststelling van het ruilplan onderscheidenlijk de lijst der geldelijke
      regelingen worden gezamenlijk behandeld.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel70
  - number: '70.3'
    text: |-
      Tegen een beschikking van de rechtbank is geen hoger beroep toegelaten. Voor de belanghebbende die voor
      de rechtbank is verschenen en voor gedeputeerde staten staat beroep in cassatie open overeenkomstig de
      [artikelen 426 tot en met 429 van het Wetboek van Burgerlijke Rechtsvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel426
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '426'
  - number: '71.1'
    text: |-
      De griffier van de rechtbank, of in geval van cassatie de griffier van de Hoge Raad, zendt bij aangetekende brief
      een afschrift van de beschikking aan de opgeroepen belanghebbenden bij het ruilplan onderscheidenlijk de lijst der
      geldelijke regelingen, alsmede aan gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel71
  - number: '71.2'
    text: |-
      Zodra het afschrift van de eindbeschikking van de rechtbank door gedeputeerde staten is ontvangen en deze
      beschikking in kracht van gewijsde is gegaan, wijzigen gedeputeerde staten zonodig het besluit tot vaststelling van
      het ruilplan onderscheidenlijk de lijst der geldelijke regelingen overeenkomstig deze beschikking.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel71
  - number: '72.1'
    text: |-
      De werking van een besluit als bedoeld in [artikel 45, eerste lid][ref1], of van een besluit tot vaststelling van
      een ruilplan als bedoeld in [artikel 47][ref2], wordt opgeschort totdat


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0020748#Artikel47
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '45'
        hoofdstuk: '8'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0020748
        artikel: '47'
        hoofdstuk: '8'
        paragraaf: '1'
        afdeling: '4'
  - number: 72.1.a
    text: de beroepstermijn is verstreken, of
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel72
  - number: 72.1.b
    text: |-
      indien beroep is ingesteld, op het beroep is beslist en, voor zover het een ruilplan als bedoeld in
      [artikel 47][ref1] betreft, de termijn voor het instellen van beroep in cassatie is verstreken, of,


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel47
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '47'
        hoofdstuk: '8'
        paragraaf: '1'
        afdeling: '4'
  - number: 72.1.c
    text: |-
      indien beroep in cassatie is ingesteld, op dat beroep in cassatie is beslist en in het geval de Hoge Raad het
      geding heeft verwezen de rechter, naar wie is verwezen, uitspraak heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel72
  - number: '72.2'
    text: |-
      De werking van een besluit tot vaststelling van een lijst der geldelijke regelingen als bedoeld in
      [artikel 47][ref1], wordt opgeschort totdat de beroepstermijn is verstreken of, indien beroep is ingesteld, op
      het beroep is beslist. Indien cassatie als bedoeld in [artikel 70, derde lid][ref2], leidt tot een vermindering
      van de schuldplichtigheid van een of meer belanghebbenden, worden de geldelijke gevolgen daarvan door de provincie
      gedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0020748#Artikel70
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '47'
        hoofdstuk: '8'
        paragraaf: '1'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0020748
        artikel: '70'
        hoofdstuk: '8'
        paragraaf: '8'
        afdeling: '4'
  - number: '73'
    text: |-
      Zodra het ruilplan onherroepelijk is, geven gedeputeerde staten hiervan kennis aan de Dienst landelijk gebied en de
      Dienst voor het kadaster en de openbare registers.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel73
  - number: '74'
    text: |-
      Zodra de beroepstermijn met betrekking tot een besluit tot vaststelling van de lijst der geldelijke regelingen is
      verstreken of, indien beroep is ingesteld, op het beroep is beslist, geldt de lijst der geldelijke regelingen als
      titel voor de daarin omschreven vorderingen.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel74
  - number: '75'
    text: |-
      Gedeputeerde staten delen zo spoedig mogelijk nadat het ruilplan onherroepelijk is, aan de grondkamer mee welke
      pachtverhoudingen gehandhaafd, welke opgeheven en welke nieuw gevestigd zijn onder vermelding van de namen en
      woonplaatsen van partijen in de pachtverhouding, de onroerende zaken waarop deze betrekking hebben en de bepalingen
      op grond van [artikel 54, tweede lid][ref1], inzake de uit de gevestigde pachtverhoudingen voortvloeiende
      pachtovereenkomsten.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel54
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '54'
        hoofdstuk: '8'
        paragraaf: '3'
        afdeling: '4'
  - number: '76.1'
    text: |-
      De grondkamer ontwerpt de pachtovereenkomsten die uit de gevestigde pachtverhoudingen voortvloeien en neemt daarin
      op de in [artikel 54, tweede lid][ref1], bedoelde bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel54
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '54'
        hoofdstuk: '8'
        paragraaf: '3'
        afdeling: '4'
  - number: '76.2'
    text: |-
      Indien ingevolge [artikel 54, tweede lid][ref1], een overeenkomst die geldt voor een kortere dan de wettelijke duur
      verlengbaar zal zijn, doet de grondkamer daarvan blijken door een op de ontwerppachtovereenkomst gestelde en door
      haar ondertekende verklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel54
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '54'
        hoofdstuk: '8'
        paragraaf: '3'
        afdeling: '4'
  - number: '76.3'
    text: |-
      De grondkamer zendt de ontwerppachtovereenkomst aan hen die daarbij partij zullen zijn en stelt hen in de
      gelegenheid binnen vier weken na toezending de ondertekende overeenkomst aan de grondkamer te doen toekomen.
      Betrokkenen kunnen de door hen overeengekomen pachtprijs alsmede bijzondere bepalingen in de overeenkomst opnemen.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel76
  - number: '76.4'
    text: |-
      Op de in het derde lid bedoelde pachtovereenkomsten vindt de [titel 7.5 van Boek 7 van het Burgerlijk Wetboek][ref1]
      toepassing, met dien verstande dat de grondkamer niet treedt in de beoordeling van de bepalingen van de
      overeenkomst die voortvloeien uit de pachtverhouding zoals deze door het ruilplan is komen vast te staan.


      [ref1]: https://wetten.overheid.nl/BWBR0005290
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0005290
  - number: '77'
    text: |-
      Indien partijen niet binnen de in [artikel 76, derde lid][ref1], gestelde termijn tot inzending van de getekende
      pachtovereenkomst bij de grondkamer zijn overgegaan, maakt de grondkamer een akte in drievoud op, gelijkluidend
      aan de aan partijen gezonden ontwerppachtovereenkomst en bepaalt daarin de pachtprijs. De grondkamer ondertekent de
      akte en zendt een exemplaar daarvan bij aangetekende brief aan elke partij toe.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel76
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '76'
        hoofdstuk: '8'
        afdeling: '5'
  - number: '78.1'
    text: |-
      De in [artikel 77][ref1] bedoelde akte heeft dezelfde kracht als een tussen partijen gesloten, door de grondkamer
      goedgekeurde onderscheidenlijk ter registratie aangeboden pachtovereenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel77
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '77'
        hoofdstuk: '8'
        afdeling: '5'
  - number: '78.2'
    text: |-
      Het opmaken en ondertekenen van de akte is een rechterlijke beschikking van de grondkamer waartegen partijen binnen
      vier weken na de verzending van de in [artikel 77][ref1] bedoelde aangetekende brief beroep kunnen instellen.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel77
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '77'
        hoofdstuk: '8'
        afdeling: '5'
  - number: '78.3'
    text: |-
      De Centrale Grondkamer, beslissende op een beroep als bedoeld in het tweede lid, kan de akte wijzigen met
      uitzondering van bepalingen die voortvloeien uit de pachtverhouding zoals deze door het plan van toedeling is komen
      vast te staan.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel78
  - number: '79.1'
    text: |-
      De grondkamer verzoekt zo spoedig mogelijk na de mededeling van gedeputeerde staten, bedoeld in [artikel 75][ref1],
      partijen in een gehandhaafde pachtverhouding, indien de bestaande pachtovereenkomst ten gevolge van de
      herverkaveling gewijzigd of door een nieuwe overeenkomst moet worden vervangen, binnen vier weken een nieuwe
      overeenkomst ter goedkeuring onderscheidenlijk ter registratie aan de grondkamer te zenden.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel75
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '75'
        hoofdstuk: '8'
        afdeling: '5'
  - number: '79.2'
    text: |-
      De nieuwe overeenkomst eindigt op hetzelfde tijdstip als waarop de overeenkomst waarvoor zij in de plaats treedt,
      zou zijn geëindigd. Indien laatstbedoelde overeenkomst voor de wettelijke duur gold, tekent de grondkamer voor
      zover van toepassing op de nieuwe overeenkomst aan dat deze verlengbaar zal zijn.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel79
  - number: '79.3'
    text: |-
      Indien niet binnen de in het eerste lid bedoelde termijn een overeenkomst ter goedkeuring onderscheidenlijk
      registratie is aangeboden, maakt de grondkamer een akte in drievoud op, inhoudende een gewijzigde of nieuwe
      pachtovereenkomst waarin de gevolgen van de herverkaveling voor de gehandhaafde pachtverhouding worden verwerkt. De
      [artikelen 77, laatste volzin][ref1], en [78][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel77
      [ref2]: https://wetten.overheid.nl/BWBR0020748#Artikel78
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '77'
        hoofdstuk: '8'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0020748
        artikel: '78'
        hoofdstuk: '8'
        afdeling: '5'
  - number: '80.1'
    text: |-
      Pachtovereenkomsten die ingevolge deze afdeling tot stand komen, treden van rechtswege in werking op het tijdstip
      waarop de in [artikel 81][ref1] bedoelde ruilakte in de openbare registers wordt ingeschreven. Op hetzelfde
      tijdstip eindigen de pachtovereenkomsten voor welke de eerstgenoemde pachtovereenkomsten in de plaats treden.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel81
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '81'
        hoofdstuk: '8'
        afdeling: '6'
  - number: '80.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op de rechtsverhoudingen geregeld bij een akte als bedoeld in
      [artikel 77][ref1] of [artikel 79, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel77
      [ref2]: https://wetten.overheid.nl/BWBR0020748#Artikel79
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '77'
        hoofdstuk: '8'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0020748
        artikel: '79'
        hoofdstuk: '8'
        afdeling: '5'
  - number: '81.1'
    text: Zodra het ruilplan onherroepelijk is, maakt een door gedeputeerde staten aan te wijzen notaris de ruilakte op.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel81
  - number: '81.2'
    text: |-
      In de ruilakte wordt opgenomen een kaart van het blok met aanwijzing van de kavels, en voor zover deze zijn gelegen
      binnen het blok de wegen en waterlopen en de gronden die ingevolge [artikel 28][ref1] zijn toegewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel28
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '28'
        hoofdstuk: '6'
  - number: '81.3'
    text: |-
      In de ruilakte wordt voorts opgenomen de in [artikel 28][ref1] bedoelde toewijzing in eigendom voor zover deze
      betrekking heeft op onroerende zaken die binnen het blok zijn gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel28
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '28'
        hoofdstuk: '6'
  - number: '81.4'
    text: |-
      De omschrijving van de kavels, de wegen, waterlopen, dijken of kaden met de daartoe behorende kunstwerken
      en de gronden die op de in het tweede lid bedoelde kaart zijn afgebeeld en die daarop voorzien
      zijn van een nummer, geschiedt door vermelding van het nummer waarmee zij op die kaart voorkomen.
      [Artikel 20, eerste lid, van de Kadasterwet][ref1] is niet van toepassing voor zover het betreft het vermelden van
      de aard en de plaatselijke aanduiding zo deze er is, van onroerende zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel20
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '20'
  - number: '81.5'
    text: |-
      In de ruilakte worden tevens vermeld de hypotheken en de beslagen die door de inschrijving van de ruilakte niet
      meer blijven bestaan.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel81
  - number: '81.6'
    text: |-
      De [artikelen 18, eerste en vijfde lid][ref1], en
      [24, tweede lid, onderdeel b, en vierde lid, tweede zin, van de Kadasterwet][ref2], zijn van overeenkomstige
      toepassing op de ruilakte.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel24
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '24'
  - number: '82.1'
    text: |-
      De ruilakte wordt ondertekend door de voorzitter van gedeputeerde staten en de secretaris, bedoeld in
      [artikel 100 van de Provinciewet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel100
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '100'
  - number: '82.2'
    text: |-
      Zij geldt als titel voor de daarin omschreven rechten. Door de inschrijving van de ruilakte in de openbare
      registers worden de daarin omschreven onroerende zaken en beperkte rechten verkregen.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel82
  - number: '82.3'
    text: |-
      Op grond van de ruilakte wordt in de openbare registers bij elke hypothecaire inschrijving, onderscheidenlijk
      bij elke inschrijving van een beslag aangetekend dat de hypotheek onderscheidenlijk het beslag in het vervolg zal
      rusten op de in de ruilakte aangewezen kavels of gedeelten daarvan, dan wel op de rechten waaraan die kavels of
      gedeelten daarvan zijn onderworpen.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel82
  - number: '82.4'
    text: |-
      De bewaarder van het kadaster en de openbare registers tekent ambtshalve de door de inschrijving van de ruilakte
      niet meer bestaande inschrijvingen van de in [artikel 81, vijfde lid][ref1], bedoelde hypotheken en beslagen aan in
      de basisregistratie kadaster.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel81
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '81'
        hoofdstuk: '8'
        afdeling: '6'
  - number: '82.5'
    text: |-
      De bewaarder van het kadaster en de openbare registers zendt zo spoedig mogelijk per brief aan elke eigenaar van,
      alsmede aan elke beperkt gerechtigde met betrekking tot de onroerende zaak een kennisgeving van het resultaat
      van het bijhouden van de basisregistratie kadaster die op grond van de inschrijving van de ruilakte plaatsvindt.
      De brief vermeldt de dag van de verzending, de in de basisregistratie kadaster vermeld staande gegevens omtrent
      de rechten, de rechthebbenden, bedoeld in de [Kadasterwet][ref1], en de grootte en de kadastrale aanduiding van
      de onroerende zaak waarop de kennisgeving betrekking heeft. [Artikel 56b van de Kadasterwet][ref2] is niet van
      toepassing op het in de eerste volzin bedoelde bijhouden.


      [ref1]: https://wetten.overheid.nl/BWBR0004541
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel56b
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0004541
      - id: ref2
        bwb_id: BWBR0004541
        artikel: 56b
  - number: '83.1'
    text: |-
      Gedeputeerde staten kunnen, in afwijking van [artikel 67, tweede lid][ref1], tweede volzin, bepalen dat het ontwerp
      van het ruilplan en van de lijst der geldelijke regelingen gelijktijdig ter inzage worden gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel67
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '67'
        hoofdstuk: '8'
        paragraaf: '7'
        afdeling: '4'
  - number: '83.2'
    text: |-
      Indien toepassing is gegeven aan het eerste lid en ter zake van het ontwerp van het ruilplan zienswijzen
      zijn ingediend, wordt een besluit omtrent de lijst der geldelijke regelingen eerst genomen nadat het ruilplan
      onherroepelijk is.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel83
  - number: '84.1'
    text: |-
      Indien bij toepassing van [artikel 83][ref1] het onherroepelijke ruilplan anders luidt dan het ter inzage gelegde
      ontwerp, stellen gedeputeerde staten een gewijzigd ontwerp op van de lijst der geldelijke regelingen, waarin de
      geldelijke gevolgen van de wijzigingen in het ruilplan worden opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel83
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '83'
        hoofdstuk: '8'
        afdeling: '7'
  - number: '84.2'
    text: |-
      [Artikel 67][ref1] is van overeenkomstige toepassing op het gewijzigd ontwerp van de lijst der geldelijke
      regelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel67
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '67'
        hoofdstuk: '8'
        paragraaf: '7'
        afdeling: '4'
  - number: '85.1'
    text: |-
      Ruilverkaveling bij overeenkomst is de schriftelijk aan te gane en in de openbare registers in te schrijven
      overeenkomst waarbij drie of meer eigenaren zich verbinden bepaalde, hun toebehorende onroerende zaken samen te
      voegen, de gegeven massa op bepaalde wijze te verkavelen en onder elkaar bij notariële akte te verdelen.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel85
  - number: '85.2'
    text: |-
      Bij een overeenkomst als bedoeld in het eerste lid kunnen mede partijen betrokken zijn die tegen inbreng van
      een geldsom onroerende zaken of tegen inbreng van onroerende zaken een geldsom bedingen, met dien verstande dat
      overeenkomsten waarbij niet meer dan drie partijen zijn betrokken slechts als ruilverkaveling bij overeenkomst
      worden aangemerkt indien alle partijen onroerende zaken inbrengen en ten hoogste één van hen daartegen slechts een
      geldsom bedingt.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel85
  - number: '85.3'
    text: |-
      Een bedrijfsverplaatsing, waarbij de gronden van het achtergelaten bedrijf worden gebruikt om onroerende zaken
      samen te voegen en de gegeven massa op een bepaalde wijze te verkavelen, kan in een overeenkomst als bedoeld in het
      eerste lid worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel85
  - number: '85.4'
    text: |-
      Indien een overeenkomst als bedoeld in het eerste lid onroerende zaken omvat waarop hypotheken, conservatoire
      of executoriale beslagen rusten, is de overeenkomst slechts rechtsgeldig, indien zij door de hypotheekhouders of
      beslagleggers is medeondertekend.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel85
  - number: '85.5'
    text: |-
      De akte, bedoeld in het eerste lid, wordt ondertekend door hen, die daartoe bij de overeenkomst bevoegd worden
      verklaard en wordt ingeschreven in de openbare registers.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel85
  - number: '86.1'
    text: |-
      Door inschrijving van een overeenkomst als bedoeld in [artikel 85, eerste lid][ref1], in de openbare registers
      wordt deze mede verbindend voor degenen die na de inschrijving onder bijzondere titel in de rechten van de
      eigenaren opvolgen.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel85
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '85'
        hoofdstuk: '9'
  - number: '86.2'
    text: |-
      Indien na de inschrijving, bedoeld in het eerste lid, komt vast te staan dat een of meer van de partijen bij
      de overeenkomst geen eigenaar waren, maar in de basisregistratie kadaster als zodanig vermeld stonden, wordt
      de overeenkomst geacht rechtsgeldig tot stand te zijn gekomen en treedt de werkelijke eigenaar in de rechten en
      verplichtingen, die de in zijn plaats opgetreden partij onbevoegdelijk heeft verworven en op zich genomen.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel86
  - number: '87'
    text: |-
      Bij regeling van Onze Minister wordt bepaald welke artikelen of onderdelen daarvan van deze wet in een beding
      in een overeenkomst als bedoeld in [artikel 85, eerste lid][ref1], van overeenkomstige toepassing kunnen worden
      verklaard. Daarbij kunnen nadere voorwaarden worden gesteld waaraan moet worden voldaan alvorens een zodanig beding
      overeenkomstige rechtsgevolgen heeft als de daarin van toepassing verklaarde bepalingen van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel85
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '85'
        hoofdstuk: '9'
  - number: '88'
    text: |-
      Bij algemene maatregel van bestuur worden nadere eisen gesteld, waaraan een overeenkomst als bedoeld in
      [artikel 85, eerste lid][ref1], moet voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel85
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '85'
        hoofdstuk: '9'
  - number: '89'
    text: |-
      De kosten van landinrichting worden gedragen door de provincie, voor zover zij niet worden gedragen door andere
      openbare lichamen en eigenaren met inachtneming van de [artikelen 90][ref1] en [91][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel90
      [ref2]: https://wetten.overheid.nl/BWBR0020748#Artikel91
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '90'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0020748
        artikel: '91'
        hoofdstuk: '10'
  - number: '90.1'
    text: |-
      Ten laste van andere openbare lichamen komen de kosten waartoe zij zich op grond van
      [artikel 37, tweede lid][ref1], of anderszins bij overeenkomst, hebben verplicht.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel37
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '37'
        hoofdstuk: '8'
  - number: '90.2'
    text: |-
      Ten laste van de eigenaren van de in een herverkaveling betrokken onroerende zaken gezamenlijk komen de kosten van
      herverkaveling die gemaakt zijn ten behoeve van het blok, voor zover deze niet gedekt worden door een subsidie of
      bijdrage van overheidswege of voor zover de betaling van deze kosten niet bij overeenkomst is verzekerd.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel90
  - number: '90.3'
    text: |-
      De kosten die ten laste van de eigenaren gezamenlijk komen, worden over de eigenaren omgeslagen zoals bepaald in de
      lijst der geldelijke regelingen. Iedere eigenaar is schuldplichtig voor de over hem omgeslagen kosten.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel90
  - number: '90.4'
    text: |-
      Nadat het besluit tot vaststelling van de lijst der geldelijke regelingen is genomen en de beroepstermijn is
      verstreken, dan wel, indien beroep is ingesteld, door de rechtbank op het beroep is beslist, worden de kosten die
      over de eigenaren worden omgeslagen gecorrigeerd met een door gedeputeerde staten vastgestelde correctiefactor,
      zijnde het quotiënt van de definitieve kosten en de kosten zoals deze oorspronkelijk in de lijst der geldelijke
      regelingen waren opgenomen.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel90
  - number: '91.1'
    text: |-
      Op de heffing en de invordering van de omgeslagen kosten zijn de [artikelen 227][ref1], [227a][ref2], [227b][ref3],
      [228][ref4], [228b][ref5], [228c][ref6], [232][ref7], [232aa][ref8], [232b][ref9], [232c][ref10], [232d][ref11],
      [232e][ref12], [232f][ref13] en [232h van de Provinciewet][ref14] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel227
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel227a
      [ref3]: https://wetten.overheid.nl/BWBR0005645#Artikel227b
      [ref4]: https://wetten.overheid.nl/BWBR0005645#Artikel228
      [ref5]: https://wetten.overheid.nl/BWBR0005645#Artikel228b
      [ref6]: https://wetten.overheid.nl/BWBR0005645#Artikel228c
      [ref7]: https://wetten.overheid.nl/BWBR0005645#Artikel232
      [ref8]: https://wetten.overheid.nl/BWBR0005645#Artikel232aa
      [ref9]: https://wetten.overheid.nl/BWBR0005645#Artikel232b
      [ref10]: https://wetten.overheid.nl/BWBR0005645#Artikel232c
      [ref11]: https://wetten.overheid.nl/BWBR0005645#Artikel232d
      [ref12]: https://wetten.overheid.nl/BWBR0005645#Artikel232e
      [ref13]: https://wetten.overheid.nl/BWBR0005645#Artikel232f
      [ref14]: https://wetten.overheid.nl/BWBR0005645#Artikel232h
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '227'
      - id: ref2
        bwb_id: BWBR0005645
        artikel: 227a
      - id: ref3
        bwb_id: BWBR0005645
        artikel: 227b
      - id: ref4
        bwb_id: BWBR0005645
        artikel: '228'
      - id: ref5
        bwb_id: BWBR0005645
        artikel: 228b
      - id: ref6
        bwb_id: BWBR0005645
        artikel: 228c
      - id: ref7
        bwb_id: BWBR0005645
        artikel: '232'
      - id: ref8
        bwb_id: BWBR0005645
        artikel: 232aa
      - id: ref9
        bwb_id: BWBR0005645
        artikel: 232b
      - id: ref10
        bwb_id: BWBR0005645
        artikel: 232c
      - id: ref11
        bwb_id: BWBR0005645
        artikel: 232d
      - id: ref12
        bwb_id: BWBR0005645
        artikel: 232e
      - id: ref13
        bwb_id: BWBR0005645
        artikel: 232f
      - id: ref14
        bwb_id: BWBR0005645
        artikel: 232h
  - number: '91.2'
    text: De omgeslagen kosten worden geheven bij wege van aanslag.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel91
  - number: '91.3'
    text: |-
      Indien de over een eigenaar omgeslagen kosten geringer zijn dan een bij verordening van provinciale staten, vast te
      stellen bedrag, worden deze kosten niet geheven.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel91
  - number: '91.4'
    text: |-
      Indien met betrekking tot eenzelfde onroerende zaak twee of meer eigenaren kostenplichtig zijn en bij elk van deze
      eigenaren het derde lid geen toepassing vindt, kan de belastingaanslag ten name van een van hen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel91
  - number: '91.5'
    text: 'Indien met toepassing van het vierde lid de belastingaanslag ten name van één kostenplichtige is gesteld, kan:'
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel91
  - number: 91.5.a
    text: |-
      de ontvanger de aanslag op de gehele onroerende zaak verhalen ten name van degene te wiens naam de belastingaanslag
      is gesteld, zonder rekening te houden met de rechten van de overige kostenplichtigen;
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel91
  - number: 91.5.b
    text: |-
      de kostenplichtige die de belastingaanslag heeft voldaan hetgeen hij meer heeft voldaan dan overeenkomt met zijn
      kostenplicht verhalen op de overige kostenplichtigen naar evenredigheid van ieders kostenplicht.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel91
  - number: '91.6'
    text: Van het vijfde lid, aanhef en onderdeel b, kan bij overeenkomst worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel91
  - number: '91.7'
    text: |-
      Bezwaar en beroep als bedoeld in [hoofdstuk V, afdeling 1][ref1], onderscheidenlijk
      [afdeling 2, van de Algemene wet inzake rijksbelastingen][ref2], kunnen niet betreffen de hoogte van de omgeslagen
      kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Afdeling1
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Afdeling2
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0002320
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002320
        afdeling: '2'
  - number: '91.8'
    text: |-
      [Artikel 17, tweede lid, tweede volzin, van de Invorderingswet 1990][ref1] blijft buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel17
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '17'
  - number: '92.1'
    text: 'Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast:'
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel92
  - number: 92.1.a
    text: |-
      de bij besluit van Onze Minister, in overeenstemming met Onze Ministers wie het mede aangaat, aangewezen
      ambtenaren; en
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel92
  - number: 92.1.b
    text: de bij besluit van gedeputeerde staten aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel92
  - number: '92.2'
    text: |-
      Van een besluit als bedoeld in het eerste lid, onderdeel a, wordt mededeling gedaan door plaatsing in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel92
  - number: '93.1'
    text: |-
      Gedeputeerde staten nemen de bij besluit van Onze Minister of Onze Minister wie het aangaat aangeduide bestaande
      verplichtingen van deze minister jegens subsidieaanvragers en -ontvangers over met ingang van het in dat besluit
      genoemde tijdstip en onder de bij het besluit in voorkomend geval gestelde nadere voorwaarden en beperkingen.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel93
  - number: '93.2'
    text: |-
      Bij het besluit worden tevens de aan de minister toekomende, met de desbetreffende subsidie samenhangende
      bevoegdheden jegens de betrokken subsidieaanvragers en -ontvangers aan gedeputeerde staten gedelegeerd, met
      inbegrip van het nemen van besluiten als bedoeld in [titel 4.2 van de Algemene wet bestuursrecht][ref1] en van
      andere met de desbetreffende subsidie samenhangende besluiten.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: '93.3'
    text: |-
      Bij het besluit, bedoeld in het eerste en het tweede lid, kunnen ook andere verplichtingen jegens derden dan de in
      het eerste lid bedoelde verplichtingen aan gedeputeerde staten worden overgedragen, met dien verstande dat slechts
      die verplichtingen voor overdracht in aanmerking komen die door Onze Minister of Onze Minister wie het aangaat zijn
      aangegaan in het kader van de verwezenlijking van het gebiedsgericht beleid.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel93
  - number: '93.4'
    text: Het besluit, bedoeld in het eerste, tweede en derde lid, wordt bekendgemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel93
  - number: '93.5'
    text: |-
      Op de relatie tussen gedeputeerde staten en de subsidieaanvrager of -ontvanger is het recht van toepassing, zoals
      dat gold onmiddellijk voor het tijdstip, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel93
  - number: '93.6'
    text: |-
      Bij regeling van Onze Minister of Onze Minister wie het aangaat kunnen ten aanzien van de in het eerste lid
      bedoelde subsidieaanvragers en -ontvangers:
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel93
  - number: 93.6.a
    text: |-
      in zoverre in afwijking van het vijfde lid aanvullende subsidievoorwaarden worden gesteld, ingeval dat noodzakelijk
      is om te voldoen aan bindende besluiten van organen van de Europese Unie;
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel93
  - number: 93.6.b
    text: |-
      de subsidiebedragen worden aangepast aan de prijs- en loonontwikkeling, voor zover dit voortvloeit uit het recht
      zoals dat gold onmiddellijk voor het in het eerste lid bedoelde tijdstip.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel93
  - number: '93.7'
    text: |-
      Onder «gedeputeerde staten» wordt in dit artikel verstaan: gedeputeerde staten van de provincie waarin de
      subsidiabele activiteiten respectievelijk de activiteiten ten aanzien waarvan de verplichtingen, bedoeld in het
      derde lid, zijn aangegaan geheel of grotendeels plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel93
  - number: '93.8'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel93
  - number: 93a
    text: |-
      In deze paragraaf wordt verstaan onder: - *bestuursakkoord natuur:* samenstel van de door het Rijk en de provincies
      jegens elkaar aangegane verplichtingen, neergelegd in het op 20 september 2011 gesloten onderhandelingsakkoord
      decentralisatie natuur (bijlage 131283 bij Kamerstukken II 2011/12, 30 825, nr. 107), de op 7 december 2011
      gesloten aanvullende overeenkomst (bijlage 144712 bij Kamerstukken II 2011/12, 30 825, nr. 143) en de op 8 februari
      2012 overeengekomen uitvoeringsafspraken (bijlage 153993 bij Kamerstukken II 2011/12, 30 825, nr. 153);
        - *ILG-bestuursovereenkomst:* bestuursovereenkomst voor het investeringstijdvak van 2007 tot en met 2013, gesloten
      op grond van [artikel 7, eerste lid][ref1], zoals dat luidde onmiddellijk voorafgaande aan het tijdstip van
      inwerkingtreding van deze paragraaf;
        - *investeringsbudget landelijk gebied:* investeringsbudget voor het investeringstijdvak lopende van 2007 tot en
      met 2013, verleend op grond van [artikel 8, eerste lid][ref2], zoals dat luidde onmiddellijk voorafgaande aan het
      tijdstip van inwerkingtreding van deze paragraaf;
        - *voorschot:* voorschot van het investeringsbudget landelijk gebied als bedoeld in [artikel 8, tweede lid][ref3],
      zoals dat luidde onmiddellijk voorafgaande aan het tijdstip van inwerkingtreding van deze paragraaf.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0020748#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0020748#Artikel8
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel93a
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '7'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0020748
        artikel: '8'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0020748
        artikel: '8'
        hoofdstuk: '3'
  - number: 93b
    text: |-
      De beschikking tot verlening van het investeringsbudget landelijk gebied en de verplichtingen tussen het Rijk
      en de onderscheiden provincies die voortvloeien uit de ILG-bestuursovereenkomst en uit de verlening van het
      investeringsbudget landelijk gebied vervallen.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel93b
  - number: 93c
    text: |-
      Onze Minister keert aan elke provincie het bedrag uit waarop de provincie overeenkomstig het bestuursakkoord natuur
      aanspraak maakt wegens in de jaren 2007 tot en met 2010 ten laste van het investeringsbudget landelijk gebied
      gedane bestedingen.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel93c
  - number: 93d
    text: |-
      Onze Minister keert voor het jaar 2011 de volgende bedragen uit: - 36.325.000 euro aan de provincie Drenthe;
        - 10.426.000 euro aan de provincie Flevoland;
        - 46.892.000 euro aan de provincie Friesland;
        - 72.091.000 aan de provincie Gelderland;
        - 25.346.000 euro aan de provincie Groningen;
        - 52.430.000 euro aan de provincie Limburg;
        - 57.782.000 euro aan de provincie Noord-Brabant;
        - 77.006.000 euro aan de provincie Noord-Holland;
        - 53.611.000 euro aan de provincie Overijssel;
        - 56.645.000 euro aan de provincie Utrecht;
        - 18.881.000 euro aan de provincie Zeeland;
        - 136.137.000 euro aan de provincie Zuid-Holland.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel93d
  - number: 93e.1
    text: |-
      Op de onderscheiden uitkeringen, bedoeld in de [artikelen 93c][ref1] en [93d][ref2], worden in mindering gebracht
      de voor de in die artikelen genoemde jaren ten behoeve van de provincie overgemaakte voorschotten. Op de uitkering,
      bedoeld in [artikel 93c][ref3], worden tevens in mindering gebracht de voor de jaren 2007 tot en met 2010 aan de
      provincie:


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel93c
      [ref2]: https://wetten.overheid.nl/BWBR0020748#Artikel93d
      [ref3]: https://wetten.overheid.nl/BWBR0020748#Artikel93c
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel93e
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: 93c
        hoofdstuk: '12'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0020748
        artikel: 93d
        hoofdstuk: '12'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0020748
        artikel: 93c
        hoofdstuk: '12'
        paragraaf: '2'
  - number: 93e.1.a
    text: |-
      uit het Europees Landbouwfonds voor Plattelandsontwikkeling op grond van Verordening (EG) nr. 1698/2005 van de Raad
      van 20 september 2005 inzake steun voor plattelandsontwikkeling (ELPO) (PbEU L 277) verstrekte middelen voor in de
      ILG-bestuursovereenkomst genoemde doelen en prestaties ten aanzien van agrarisch natuurbeheer, en
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel93e
  - number: 93e.1.b
    text: |-
      door tussenkomst van de Stichting Groenfonds te ’s Gravenhage en in voorkomend geval de Vereniging Natuurmonumenten
      ter beschikking gestelde rijksmiddelen die de provincie heeft besteed voor de verstrekking van subsidies aan
      particuliere terreinbeherende natuurbeschermingsorganisaties voor verwerving van grond en beëindiging van
      pachtovereenkomsten in de provincie.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel93e
  - number: 93e.2
    text: |-
      Onze Minister stelt, na overleg met gedeputeerde staten van de provincie, de hoogte van de uitkering, bedoeld in
      [artikel 93c][ref1], vast.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel93c
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel93e
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: 93c
        hoofdstuk: '12'
        paragraaf: '2'
  - number: 93e.3
    text: |-
      Onze Minister stelt met betrekking tot de onderscheiden uitkeringen, bedoeld in de [artikelen 93c][ref1] en
      [93d][ref2], het overeenkomstig het eerste lid berekende verschil vast.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel93c
      [ref2]: https://wetten.overheid.nl/BWBR0020748#Artikel93d
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel93e
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: 93c
        hoofdstuk: '12'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0020748
        artikel: 93d
        hoofdstuk: '12'
        paragraaf: '2'
  - number: 93e.4
    text: 'Ingeval het verschil, bedoeld in het derde lid:'
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel93e
  - number: 93e.4.a
    text: |-
      meer is dan nihil, geeft de in dat lid bedoelde vaststelling aanspraak op betaling van het verschil door Onze
      Minister;
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel93e
  - number: 93e.4.b
    text: |-
      minder is dan nihil, geeft de in dat lid bedoelde vaststelling aanspraak op betaling van het verschil door
      gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel93e
  - number: 93e.5
    text: |-
      Zolang de in het tweede en derde lid bedoelde vaststellingen met betrekking tot de uitkering, bedoeld in
      [artikel 93c][ref1], ten aanzien van een of meer provincies nog niet onherroepelijk is, kan Onze Minister de
      vaststellingen ten aanzien van deze provincies en elk van de andere provincies wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel93c
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel93e
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: 93c
        hoofdstuk: '12'
        paragraaf: '2'
  - number: 93f
    text: |-
      De uitkering, bedoeld in [artikel 93d][ref1], wordt in mindering gebracht op het totale bedrag van de in het
      bestuursakkoord natuur voorziene decentralisatie-uitkeringen voor de jaren 2011, 2012 en 2013.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel93d
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel93f
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: 93d
        hoofdstuk: '12'
        paragraaf: '2'
  - number: 93g
    text: |-
      [Artikel 17a van de Financiële-verhoudingswet][ref1] is niet van toepassing op de financiële bijdragen aan de
      provincies, bedoeld in de [artikelen 93c][ref2] en [93d][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel17a
      [ref2]: https://wetten.overheid.nl/BWBR0020748#Artikel93c
      [ref3]: https://wetten.overheid.nl/BWBR0020748#Artikel93d
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel93g
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: 17a
      - id: ref2
        bwb_id: BWBR0020748
        artikel: 93c
        hoofdstuk: '12'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0020748
        artikel: 93d
        hoofdstuk: '12'
        paragraaf: '2'
  - number: 93h.1
    text: |-
      In zoverre in afwijking van [artikel 93b][ref1] blijven, voor zover Onze Minister en Onze Ministers
      wie het mede aangaat met gedeputeerde staten niet anders overeenkomen, tot 1 januari 2014 geldig de in
      de ILG-bestuursovereenkomst aangegane verplichtingen die betrekking hebben op projecten als bedoeld in
      [artikel 3 van de Wet Fonds economische structuurversterking][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel93b
      [ref2]: https://wetten.overheid.nl/BWBR0007788#Artikel3
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel93h
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: 93b
        hoofdstuk: '12'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007788
        artikel: '3'
  - number: 93h.2
    text: |-
      De ingevolge de ILG-bestuursovereenkomst voor de realisatie van de in het eerste lid bedoelde projecten genoemde
      middelen voor:
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel93h
  - number: 93h.2.a
    text: |-
      de jaren 2007 tot en met 2010 zijn begrepen in de uitkering, bedoeld in [artikel 93c][ref1], voor zover de middelen
      in die jaren zijn besteed;


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel93c
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel93h
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: 93c
        hoofdstuk: '12'
        paragraaf: '2'
  - number: 93h.2.b
    text: |-
      het jaar 2011 zijn begrepen in de uitkering, bedoeld in [artikel 93d, eerste en tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel93d
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel93h
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: 93d
        hoofdstuk: '12'
        paragraaf: '2'
  - number: 93h.2.c
    text: |-
      de jaren 2012 en 2013 alsmede de ingevolge de ILG-bestuursovereenkomst voor de realisatie van de in het eerste
      lid bedoelde projecten genoemde middelen voor de jaren 2007 tot en met 2010 die in die jaren niet aan de projecten
      zijn besteed zijn begrepen in de decentralisatie-uitkeringen voor de jaren 2012 en 2013 als voorzien in het
      bestuursakkoord, met inachtneming van [artikel 93f][ref1] en met dien verstande dat op die uitkeringen in mindering
      worden gebracht de in voorkomend geval voor 2012 en 2013 ten laste van de begroting van het Ministerie van
      Landbouw, Natuur en Voedselkwaliteit of van het Ministerie van Infrastructuur en Milieu verstrekte middelen.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel93f
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel93h
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: 93f
        hoofdstuk: '12'
        paragraaf: '2'
  - number: '95.1'
    text: |-
      De [Landinrichtingswet][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0003793
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0003793
  - number: '95.3'
    text: |-
      In afwijking van het tweede lid worden landinrichtingsprojecten ten aanzien waarvan nog geen toepassing
      is gegeven aan [artikel 198 van de Landinrichtingswet][ref1] alsmede herverkavelingen op basis van de
      [Reconstructiewet concentratiegebieden][ref2], vanaf het tijdstip van inwerkingtreding van dit artikel uitgevoerd
      met inachtneming van het bij of krachtens deze wet bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel198
      [ref2]: https://wetten.overheid.nl/BWBR0013399
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '198'
      - id: ref2
        bwb_id: BWBR0013399
  - number: '95.4'
    text: |-
      Bij regeling van Onze Minister wordt ten aanzien van de in het derde lid bedoelde landinrichtingsprojecten
      en herverkavelingen bepaald op welke wijze procedure-onderdelen en besluiten op basis van de
      [Landinrichtingswet][ref1] of de [Reconstructiewet concentratiegebieden][ref2] worden gelijkgesteld met
      procedure-onderdelen en besluiten op basis van deze wet. Bij deze regeling kan, in afwijking van het derde
      lid, worden bepaald dat naar gelang de voortgang of overige omstandigheden van een landinrichtingsproject of
      herverkaveling als bedoeld in het derde lid, bepalingen van deze wet ten aanzien van dat landinrichtingsproject
      of die herverkaveling buiten toepassing blijven dan wel bepalingen uit de [Landinrichtingswet][ref3] of de
      [Reconstructiewet concentratiegebieden][ref4] daarop van toepassing blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0003793
      [ref2]: https://wetten.overheid.nl/BWBR0013399
      [ref3]: https://wetten.overheid.nl/BWBR0003793
      [ref4]: https://wetten.overheid.nl/BWBR0013399
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0003793
      - id: ref2
        bwb_id: BWBR0013399
      - id: ref3
        bwb_id: BWBR0003793
      - id: ref4
        bwb_id: BWBR0013399
  - number: '97'
    text: |-
      Voor zoveel nodig in afwijking van [artikel 10:3, eerste en tweede lid, van de Algemene wet bestuursrecht][ref1]
      zijn alle besluiten rechtsgeldig die zijn genomen door de secretaris van de Centrale Landinrichtingscommissie,
      bedoeld in [artikel 7 van de Landinrichtingswet][ref2], zoals dit luidde voorafgaand aan inwerkingtreding van de
      wet, genoemd in [artikel 96][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003793#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0020748#Artikel96
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel97
