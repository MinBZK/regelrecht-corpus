  - number: '98.2'
    text: |-
      Indien de herinrichtingscommissie ten behoeve van een herinrichtingsproject nog niet de
      uitkomsten van de eerste schatting in een register van uitkomsten der schattingen als bedoeld in
      [artikel 34, eerste lid, van de Herinrichtingswet Oost-Groningen en de Gronings-Drentse Veenkoloniën][ref1]
      heeft vastgelegd, dan wel nog geen lijst der geldelijke regelingen als bedoeld in
      [artikel 108 van de Herinrichtingswet Oost-Groningen en de Gronings-Drentse Veenkoloniën][ref2]
      heeft opgemaakt, gelden voor dat herinrichtingsproject vastgestelde
      besluiten op grond van de [artikelen 33, tweede lid][ref3], onderscheidenlijk
      [107, tweede lid, van de Herinrichtingswet Oost-Groningen en de Gronings-Drentse Veenkoloniën][ref4],
      zoals deze artikelen luidden voorafgaand aan inwerkingtreding van de wet, genoemd in
      [artikel 96][ref5], als besluiten op grond van de [artikelen 33, tweede lid][ref6], onderscheidenlijk
      [107, tweede lid, van de Herinrichtingswet Oost-Groningen en de Gronings-Drentse Veenkoloniën][ref7], zoals deze
      luiden na inwerkingtreding van de wet, genoemd in [artikel 96][ref8].


