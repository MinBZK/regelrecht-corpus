  - number: 111b.1
    text: |-
      De [Reconstructiewet concentratiegebieden][ref1] vervalt op een bij koninklijk besluit te bepalen tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0013399
    url: https://wetten.overheid.nl/BWBR0020748/2019-01-01#Artikel111b
    references:
      - id: ref1
        bwb_id: BWBR0013399
  - number: 111b.2
    text: |-
      De [Reconstructiewet concentratiegebieden][ref1] blijft van toepassing op reconstructieplannen als bedoeld in
      [artikel 11 van die wet][ref2] die reeds waren vastgesteld vóór het tijdstip van inwerkingtreding van dit artikel,
      tenzij deze plannen door provinciale staten zijn of worden ingetrokken, met dien verstande dat in afwijking van
      [artikel 92 van de Reconstructiewet concentratiegebieden][ref3], de kosten van de schadevergoedingen, bedoeld
      in de [artikelen 13, derde lid][ref4], [30, eerste lid][ref5], en [47, vierde lid, van die wet][ref6], ten
      laste van de desbetreffende provincie komen, en dat de [artikelen 7, derde en vierde lid][ref7], [9][ref8],
      [10][ref9], [12, tweede lid, tweede volzin, en derde lid][ref10], [16, derde lid][ref11], [17][ref12] en
      [26, tweede lid, van de Reconstructiewet concentratiegebieden][ref13] niet van toepassing zijn.


