        paragraaf: '3'
  - number: '98.1'
    text: |-
      Indien de landinrichtingscommissie ten behoeve van een landinrichtingsproject nog niet de
      uitkomsten van de eerste schatting in een register van schattingsuitkomsten als bedoeld in
      [artikel 167 van de Landinrichtingswet][ref1] heeft vastgelegd, nog geen plan van toedeling als bedoeld
      in [artikel 196 van de Landinrichtingswet][ref2] heeft ontworpen dan wel nog geen lijst der geldelijke
      regelingen als bedoeld in [artikel 211 van de Landinrichtingswet][ref3] heeft opgemaakt, gelden voor dat
      landinrichtingsproject vastgestelde besluiten op grond van de [artikelen 163][ref4], [195, eerste lid][ref5],
      onderscheidenlijk [210, derde lid, van de Landinrichtingswet][ref6], zoals deze artikelen luidden voorafgaand aan
      de inwerkingtreding van de wet, genoemd in [artikel 96][ref7], als besluiten op grond van de [artikelen 163][ref8],
      [195, eerste lid][ref9], onderscheidenlijk [210, derde lid, van de Landinrichtingswet][ref10], zoals deze luiden na
      inwerkingtreding van de wet, genoemd in [artikel 96][ref11].


