  - number: 111a
    text: |-
      De [artikelen 93 tot en met 95][ref1] vervallen op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen en onderdelen daarvan verschillend kan worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel93
