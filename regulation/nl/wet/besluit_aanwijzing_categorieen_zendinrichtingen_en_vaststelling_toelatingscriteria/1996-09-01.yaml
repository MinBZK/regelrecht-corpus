preamble:
  text: |-
    Gelet op de artikelen D.1.1, D.4.3, E.1 en 1.1 van het Besluit radio-elektrische inrichtingen (Stb. 1988, 552)

    Besluit:
  url: https://wetten.overheid.nl/BWBR0004457/1996-09-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Zendinrichtingen waarvoor een machtiging is vereist worden onderscheiden in zendinrichtingen bestemd voor
      vrijetijdstoepassingen en zendinrichtingen bestemd voor andere doeleinden.
    url: https://wetten.overheid.nl/BWBR0004457/1996-09-01#Artikel1
  - number: '2'
    text: |-
      Zendinrichtingen bestemd voor vrijetijdstoepassingen zijn zendinrichtingen werkende in de 27-MHz-frequentieband ten
      behoeve van niet-ingezetenen en van bedrijven in het beroepsgoederenvervoer.
    url: https://wetten.overheid.nl/BWBR0004457/1996-09-01#Artikel2
  - number: '4'
    text: |-
      Zendinrichtingen bestemd voor andere doeleinden worden ingedeeld in de navolgende categorieën:

      a. zendinrichtingen voor de burgerluchtvaart welke worden gebruikt voor het bevorderen van de veiligheid van de
      luchtvaart en de regelmaat van het luchtverkeer;

      b. zendinrichtingen voor de scheepvaart welke worden gebruikt ten dienste van de veiligheid van de scheepvaart
      danwel ten dienste van het al dan niet openbare verkeer;

      c. zendinrichtingen voor het doen van onderzoekingen;

      d. zendinrichtingen die door ondernemers worden vervaardigd, verhandeld, geëxporteerd, gerepareerd of
      geïnstalleerd;

      e. zendinrichtingen voor ander gebruik.
    url: https://wetten.overheid.nl/BWBR0004457/1996-09-01#Artikel4
  - number: '5'
    text: |-
      Zendinrichtingen voor de burgerluchtvaart worden verdeeld in de navolgende sub-categorieën:

      a. grondstations op luchtvaartterreinen zonder verkeersleiding;

      b. grondstations van luchtvaartmaatschappijen;

      c. mobiele grondstations voor de recreatieve luchtvaart;

      d. zendinrichtingen voor gebruik aan boord van luchtvaartuigen;

      e. grondstations ten behoeve van bijzonder gebruik in de luchtvaartmobiele en luchtvaartnavigatiebanden.
    url: https://wetten.overheid.nl/BWBR0004457/1996-09-01#Artikel5
  - number: '6'
    text: |-
      Zendinrichtingen voor de scheepvaart worden verdeeld in de navolgende sub-categorieën:

      a. maritieme VHE en UHF radiotelefonen;

      b. MF en HF radiotelefonen en radiotelegrafen;

      c. radar;

      d. zendinrichtingen voor satellietcommunicatie.
    url: https://wetten.overheid.nl/BWBR0004457/1996-09-01#Artikel6
  - number: '7'
    text: |-
      Zendinrichtingen voor het doen van onderzoekingen worden verdeeld in de sub-categorieën A, C en N, welke worden
      onderscheiden door de voor elk van deze categorieën toegewezen frequentiebanden en de toegestane zendvermogens,
      zoals is aangegeven in de tabel van de bijlage behorende bij dit besluit.
    url: https://wetten.overheid.nl/BWBR0004457/1996-09-01#Artikel7
  - number: 7a
    text: |-
      Zendinrichtingen die door ondernemers worden vervaardigd, verhandeld, geëxporteerd, gerepareerd of geïnstalleerd
      worden verdeeld in subcategorieën van de klasse I, II en III, overeenkomstig de indeling in de Ondernemersregeling
      zendinrichtingen (Stcrt. 1988, 254).
    url: https://wetten.overheid.nl/BWBR0004457/1996-09-01#Artikel7a
  - number: '8'
    text: |-
      Zendinrichtingen voor ander gebruik worden verdeeld in sub-categorieën van zendinrichtingen bestemd voor:

      a. zakelijke radiocommunicatie (VHF, UHF Radiotelefonen voor landmobiel gebruik, VHF/UHF Radiotelefonen met beperkt
      afstandsbereik voor landmobiel gebruik en HF radiotelefonen voor landmobiel gebruik);

      b. induktieve oproepen;

      c. hoogfrequente oproepen;

      d. radiobeveiliging en Radio alarmering;

      e. radio-afstandsbediening, met uitzondering van zendinrichtingen voor het besturen of bedienen van speelgoed of
      modellen van vaar-, voer- en luchtvaartuigen;

      f. telemetrie;

      g. HF radiotelefonie ten behoeve van gebruik in noodsituaties;

      h. draadloze audioverbindingen;

      i. beproevingsdoeleinden;

      j. het Nederlandse Rode Kruis;

      k. lokale radio-omroep;

      l. militaire TV- en radio-omroep;

      m. walradar;

      n. plaatsbepalingen;

      o. straalverbindingen;

      p. datamonitor en soortgelijke tele-informatiediensten;

      q. verzamelaars van zendinrichtingen welke zendinrichtingen een historische waarde vertegenwoordigen (museum-
      machtiging):

      r. overig gebruik, waarvan de aard van dat gebruik in de aan de machtiging te verbinden voorschriften en
      beperkingen nader is aangegeven.
    url: https://wetten.overheid.nl/BWBR0004457/1996-09-01#Artikel8
  - number: '9'
    text: |-
      Een machtiging ten behoeve van zendinrichtingen voor de burgerluchtvaart kan worden verleend aan natuurlijke
      of rechtspersonen, in overeenstemming met de gestelde regels in de [Luchtvaartwet][ref1] (Stb. 1958, 47) en de
      [Regeling Toezicht Luchtvaart][ref2] (Stb. 1959, 67).


      [ref1]: https://wetten.overheid.nl/BWBR0002267
      [ref2]: https://wetten.overheid.nl/BWBR0002309
    url: https://wetten.overheid.nl/BWBR0004457/1996-09-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002267
      - id: ref2
        bwb_id: BWBR0002309
  - number: '10'
    text: |-
      Een machtiging voor categorieën zendinrichtingen voor de scheepvaart kan aan natuurlijke personen van 16 jaar en
      ouder worden verleend indien dezen in het bezit zijn van een voor de bediening van de zendinrichtingen vereist
      geldig certificaat alsmede aan rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0004457/1996-09-01#Artikel10
  - number: '11'
    text: |-
      1 Een machtiging voor zendinrichtingen voor het doen van onderzoekingen van de categorieën A en C kan worden
      verleend aan natuurlijke personen van 14 jaar en ouder die met gunstig gevolg het examen hebben afgelegd.

      Een machtiging voor zendinrichtingen voor het doen van onderzoekingen van de categorie N kan worden verleend aan
      natuurlijke personen van 12 jaar en ouder die met gunstig gevolg het examen hebben afgelegd.

      2 Een machtiging voor zendinrichtingen voor het doen van onderzoekingen van de categorie A kan worden verleend aan
      verenigingen van radiozendamateurs die volledige rechtsbevoegdheid bezitten.

      3 Een machtiging voor zendinrichtingen voor het doen van onderzoekingen van de categoriën A of C kan worden
      verleend aan onderwijsinstellingen waarvan het doen van onderzoekingen met zendinrichtingen essentieel is voor het
      geven van het onderwijs.

      4 Aan natuurlijke of rechtspersonen welke naar het oordeel van de Minister geacht kunnen worden op enigerlei wijze
      in het belang van de radiowetenschap werkzaam te zijn kan een machtiging worden verleend voor zendinrichtingen voor
      het doen van onderzoekingen van een door de Minister te bepalen categorie, tenzij een bijzonder doel beperktere of
      andere bevoegdheden rechtvaardigt.
    url: https://wetten.overheid.nl/BWBR0004457/1996-09-01#Artikel11
  - number: 11a
    text: |-
      Een machtiging voor zendinrichtingen die door ondernemers worden vervaardigd, verhandeld, geëxporteerd, gerepareerd
      of geïnstalleerd kan alleen aan ondernemers worden verleend indien zij als zodanig zijn ingeschreven in het
      handelsregister van de Kamer van Koophandel en Fabrieken en kunnen aantonen dat zij een redelijk belang hebben bij
      de gevraagde machtiging.
    url: https://wetten.overheid.nl/BWBR0004457/1996-09-01#Artikel11a
  - number: '12'
    text: |-
      Een machtiging ten behoeve van zendinrichtingen voor ander gebruik, alsmede ten behoeve van zendinrichtingen voor
      de burgerluchtvaart en de scheepvaart kan alleen aan natuurlijke- of rechtspersonen worden verleend, indien zij
      kunnen aantonen dat zij een redelijk belang hebben bij het gebruik van de zendinrichtingen.
    url: https://wetten.overheid.nl/BWBR0004457/1996-09-01#Artikel12
  - number: '13'
    text: |-
      Geen machtiging is vereist voor de navolgende categorieën zendinrichtingen als bedoeld in artikel E.1 van het
      Besluit radio elektrische inrichtingen;

      a. telemetrie;

      b. radio-alarmering en radiobeveiliging;

      c. Afstandbesturing, waaronder zendinrichtingen voor het besturen of bedienen van speelgoed of modellen van vaar-,
      voer- en luchtvaartuigen (modelbesturing);

      d. mini hoogfrequent oproepinrichtingen;

      e. draadloze microfonen;

      f. zendinrichtingen bestemd voor spraakoverdracht over korte afstanden in de prive-sfeer;

      g. zendinrichtingen die functioneren volgens het inductieve principe met een of meer horizontaal gelegen
      ringleidingen;

      h. randapparatuur die bestemd is voor aansluiting op de telefoondienst voor de functie koordloos telefoneren en
      daarvoor is goedgekeurd;

      i. randapparatuur die bestemd is voor aansluiting op de autotelefoondienst en daarvoor is goedgekeurd;

      j. zendinrichtingen voor algemene radiocommunicatie in de 27 MHz-frequentieband (MARC);

      k. mobiele VHF/UHF radiotelefonen voor landmobiel gebruik die daadwerkelijk en krachtens een daartoe gesloten
      overeenkomst onderdeel zijn van een besloten netwerk, dat deel is van een gemachtigd radionetwerk met dynamische
      frequentietoewijzing (trunkinginstallatie);

      l. randapparatuur, bestemd voor aansluiting op een openbaar satellietsysteem, ten behoeve van mobiele communicatie,
      die daarvoor is goedgekeurd, met uitzondering van het nood-, spoed- en veiligheidsverkeer.

      m. zendinrichtingen voor digitale Europese koordloze telecommunicatie in de frequentieband van 1880–1900 MHz (DECT
      apparatuur) alsmede in andere frequentiebanden werkende RLANS en HIPERLANS.
    url: https://wetten.overheid.nl/BWBR0004457/1996-09-01#Artikel13
  - number: '14'
    text: |-
      1 De aanwijzing zendinrichtingen categorie C van 28 januari 1987 (Stcrt. 1987, 26) wordt ingetrokken.

      2 Dit besluit treedt in werking met ingang van de inwerkingtreding van de Wet op de telecommunicatievoorzieningen
      en kan worden aangehaald als: Besluit aanwijzing categorieën zendinrichtingen en vaststelling toelatingscriteria.
    url: https://wetten.overheid.nl/BWBR0004457/1996-09-01#Artikel14
