  - number: '39'
    text: |-
      1 Ingetrokken worden:

      a. de landsverordening van den 11den april 1942, houdende verbod tot uitvoer van aloëplanten (P.B. 1942, no.84);

      b. de landsverordening van de 19den juli 1976 tot bescherming van mariene gebieden (P.B. 1976, no. 157);

      c. het Landsbesluit in- en uitvoerverbod bedreigde dieren en planten (P.B. 1992, no. 1).

      2 Artikel 1, onderdeel b, van het Landsbesluit, houdende algemene maatregelen, van de 3den maart 1960 (P.B. 1960,
      no. 25) ter uitvoering van de artikelen 1 en 6 van de Uitvoerverbodenverordening 1944 (P.B. 1944, no. 117) vervalt.

      3 De landsverordening van de 20sten juli 1926, tot bescherming van diersoorten, nuttig voor land- en ooftbouw
      of die langzamerhand uitsterven en op welker voortbestaan prijs wordt gesteld (P.B. 1926, no. 60), wordt
      met ingang van het tijdstip waarop voor een eilandgebied de in artikel 15 van deze landsverordening bedoelde
      eilandsverordening van kracht is geworden voor dat eilandgebied ingetrokken.
    url: https://wetten.overheid.nl/BWBR0028434/2019-01-01#Artikel39
  - number: '40'
    text: |-
      1 De verboden in [artikel 8a, eerste en tweede lid][ref1], of krachtens het derde lid, onderdeel a, gelden niet
      voor het onder zich hebben van soorten, opgenomen in de Bijlagen I en II van het SPAW-protocol die men onder zich
      had op het tijdstip van inwerkingtreding van de Landsverordening grondslagen natuurbeheer en -bescherming.

      2 Het bepaalde in het eerste lid is slechts van toepassing in geval soorten, opgenomen in Bijlage I van het
      CITES-verdrag en in de Bijlagen I en II van het SPAW-protocol binnen zes maanden na inwerkingtreding van
      de Landsverordening grondslagen natuurbeheer en -bescherming zijn geregistreerd in het register, bedoeld in
      [artikel 5, tweede lid, onderdeel b, subonderdeel 1°][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028434#Artikel8a
