  - number: 8a
    text: |-
      1 Het is verboden handelingen of aktiviteiten te verrichten als bedoeld in artikel 11, eerste lid, onderdeel a,
      van het SPAW-protocol, ter zake van plantensoorten, opgenomen in Bijlage I van dat protocol, en zaden, delen of
      produkten van deze plantensoorten.

      2 Het is verboden handelingen of aktiviteiten te verrichten als bedoeld in artikel 11, eerste lid, onderdeel b,
      van het SPAW-protocol, ter zake van diersoorten, opgenomen in Bijlage II van dat protocol, en eieren, delen of
      produkten van deze diersoorten.

      3 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gegeven ter zake van:

      a. de planten- of diersoorten, opgenomen in Bijlage III van het SPAW-protocol, met inachtneming van het bepaalde in
      artikel 11, onderdeel c, van dat protocol; en

      b. andere aangelegenheden ter uitvoering van het SPAW-protocol, onverminderd het bepaalde in
      [artikel 13, eerste lid][ref1], jo. [artikel 15, derde lid][ref2], van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0028434#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0028434#Artikel15
