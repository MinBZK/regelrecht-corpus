  - number: '9'
    text: |-
      1 Het bestuurscollege stelt een maal per vijf jaren een natuurplan vast.

      2 Het natuurplan behoeft de goedkeuring van de eilandsraad.

      3 Het natuurplan bevat in ieder geval:

      a. de uitgangspunten van het natuurbeleid van het desbetreffende openbare lichaam voor de planperiode, met
      inachtneming van de verplichtingen die voortvloeien uit internationale verdragen op het gebied van het natuurbeheer
      en bescherming alsmede uit het natuurbeleidsplan, bedoeld in [artikel 2, eerste lid][ref1];

      b. een overzicht van de actiepunten die in de planperiode zullen worden verwezenlijkt, alsmede de termijn
      waarbinnen dit zal plaatsvinden.

      4 Jaarlijks doet het bestuurscollege vóór 1 juni verslag van de stand van zaken met betrekking tot de uitvoering
      van het natuurplan aan de eilandsraad en Onze Minister.

      5 Bij het opstellen van het natuurplan draagt het bestuurscollege zorg dat dit is afgestemd op het
      natuurbeleidsplan.


      [ref1]: https://wetten.overheid.nl/BWBR0028434#Artikel2
    url: https://wetten.overheid.nl/BWBR0028434/2019-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0028434
        artikel: '2'
        hoofdstuk: II
  - number: '10'
    text: |-
      1 De eilandsraad stelt, voor zover mogelijk, natuurparken in.

      2 Op natuurparken als bedoeld in het Verdrag van Ramsar, het SPAW-protocol of het Biodiversiteitsverdrag, zijn de
      hieraan in deze verdragen gestelde eisen van toepassing.

      3 De eilandsraad die een zodanig natuurpark heeft ingesteld, geeft hiervan kennis aan Onze Minister met vermelding
      van de ter zake relevante informatie.

      4 Onze Minister draagt de gemelde natuurparken voor bij het desbetreffende uitvoerende bureau dat bij deze
      verdragen is ingesteld, met het verzoek tot opname in de bij dat verdrag horende lijst van beschermde gebieden.
    url: https://wetten.overheid.nl/BWBR0028434/2019-01-01#Artikel10
  - number: '11'
    text: |-
      De eilandsraad draagt zorg voor de beheersmaatregelen voor en de bescherming van soorten die vermeld zijn in de
      bijlagen van het Zeeschildpaddenverdrag.

      De eisen die hiervoor krachtens het in het eerste lid genoemde verdrag gelden, zijn van toepassing.
    url: https://wetten.overheid.nl/BWBR0028434/2019-01-01#Artikel11
  - number: '12'
    text: |-
      1 De eilandsraad draagt zorg voor de bescherming van en de beheersmaatregelen voor soorten die vermeld zijn in de
      bijlagen van de Bonn-conventie.

      2 De eisen die hiervoor krachtens het in het eerste lid genoemde verdrag gelden, zijn van toepassing.
    url: https://wetten.overheid.nl/BWBR0028434/2019-01-01#Artikel12
  - number: '13'
    text: |-
      1 De eilandsraad draagt zorg voor de bescherming van en de beheersmaatregelen voor soorten die vermeld zijn in de
      bijlagen van het SPAW-protocol.

      2 De eisen die hieraan krachtens het in het eerste lid genoemde verdrag gesteld worden, zijn van toepassing.
    url: https://wetten.overheid.nl/BWBR0028434/2019-01-01#Artikel13
  - number: '14'
    text: |-
      1 De eilandsraad draagt zorg voor de bescherming van de biologische diversiteit, het verantwoord gebruik van
      haar componenten en de eerlijke en billijke verdeling van de voordelen die uit het gebruik van genetische bronnen
      voortvloeien.

      2 De eisen die hiervoor krachtens het Biodiversiteitsverdrag gelden, zijn van toepassing.
    url: https://wetten.overheid.nl/BWBR0028434/2019-01-01#Artikel14
  - number: '15'
    text: |-
      1 De eilandsraad stelt uiterlijk twee jaren na inwerkingtreding van deze wet voorschriften vast ter uitvoering van
      de verplichtingen die voor de openbare lichamen Bonaire, Sint Eustatius en Saba voortvloeien uit deze wet.

      2 Op verzoek van een bestuurscollege kan Onze Minister geheel of gedeeltelijk voorzien in faciliteiten, middelen
      en bijstand, die noodzakelijk zijn voor de uitvoering van deze wet en de daaruit voortvloeiende regelgeving in het
      desbetreffende openbare lichaam.

      3 Voorzover de eilandsraad nalaat de in het eerste lid genoemde voorschriften binnen de aldaar genoemde
      termijn vast te stellen, kan daarin bij of krachtens algemene maatregel van bestuur, gehoord het desbetreffende
      bestuurscollege, worden voorzien.
    url: https://wetten.overheid.nl/BWBR0028434/2019-01-01#Artikel15
  - number: '16'
    text: |-
      1 Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn belast de daartoe bij besluit van
      Onze minister aangewezen ambtenaren of personen. Een zodanige aanwijzing wordt bekendgemaakt in de Staatscourant.

      2 Voor zover het in het eerste lid bedoelde toezicht betrekking heeft op de naleving van door de openbare lichamen
      Bonaire, Sint Eustatius en Saba ter uitvoering van deze wet gestelde voorschriften, wordt dit toezicht mede
      uitgeoefend door ambtenaren of personen die daartoe door het bestuurscollege worden aangewezen. Een zodanige
      aanwijzing wordt bekendgemaakt in het blad waarin door het desbetreffende openbare lichaam gebruikelijk officiële
      berichten worden bekendgemaakt.

      3 De krachtens het eerste en het tweede lid aangewezen personen zijn, uitsluitend voor zover dat voor de vervulling
      van hun taak redelijkerwijze noodzakelijk is, bevoegd:

      a. alle inlichtingen te vragen;

      b. inzage te verlangen van alle boeken, bescheiden en andere informatiedragers en daarvan afschrift te nemen of
      deze daartoe tijdelijk mee te nemen;

      c. goederen aan opneming en onderzoek te onderwerpen, deze daartoe tijdelijk mee te nemen en daarvan monsters te
      nemen;

      d. alle plaatsen, met uitzondering van woningen zonder de uitdrukkelijke toestemming van de bewoner, te betreden,
      vergezeld van door hen aangewezen personen;

      e. vaartuigen, stilstaande voertuigen en de lading daarvan te onderzoeken;

      f. woningen of tot woning bestemde gedeelten van vaartuigen zonder de uitdrukkelijke toestemming van de bewoner
      binnen te treden.

      4 Zo nodig, wordt de toegang tot een plaats als bedoeld in het derde lid, onderdeel d, verschaft met behulp van de
      sterke arm.

      5 Op het binnentreden van woningen of van tot woning bestemde gedeelten van vaartuigen als bedoeld in het
      derde lid, onderdeel f, is [Titel X van het Derde Boek van het Wetboek van Strafvordering BES][ref1] van
      overeenkomstige toepassing, met uitzondering van de [artikelen 155, vierde lid][ref2], [156, tweede lid][ref3],
      [157, tweede en derde lid][ref4], [158, eerste lid, laatste zinsnede][ref5], en [160, eerste lid][ref6], en
      met dien verstande dat de machtiging, indien het betreft de krachtens het eerste lid aangewezen personen, wordt
      verleend door de procureur-generaal en, indien het betreft de krachtens het tweede lid aangewezen personen, de
      gezaghebber.

      6 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de wijze van taakuitoefening van de
      krachtens het eerste en het tweede lid aangewezen personen.


      [ref1]: https://wetten.overheid.nl/BWBR0028681
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel155
