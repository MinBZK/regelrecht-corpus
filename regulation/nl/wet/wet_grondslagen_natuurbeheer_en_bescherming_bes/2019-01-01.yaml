  - number: 8d
    text: |-
      1 Buiten de territoriale wateren, doch binnen de exclusieve economische zone, heeft Onze Minister’ dezelfde taken
      en bevoegdheden als die, welke voor de openbare lichamen Bonaire, Sint Eustatius of Saba zijn vastgesteld in de
      [artikelen 10 tot en met 14][ref1].

      2 Bij of krachtens algemene maatregel van bestuur kunnen aanvullende beheersregels worden vastgesteld ter behoud
      van de natuur en het milieu van het gebied, bedoeld in het eerste lid.

      3 Indien Onze minister in de uitoefening van de taken en bevoegdheden, bedoeld in het eerste lid, beperkingen of
      verboden aan de vaart oplegt, doet zij dit in overeenstemming met Onze minister van Verkeer en Waterstaat.


