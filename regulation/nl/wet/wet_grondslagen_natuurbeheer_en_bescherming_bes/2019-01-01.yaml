  - number: '38'
    text: |-
      1 Het natuurbeleidsplan, bedoeld in [artikel 2, eerste lid][ref1], wordt voor de eerste keer vastgesteld uiterlijk
      één jaar na het in werking treden van deze wet.

      2 Het natuurplan, bedoeld in [artikel 9, eerste lid][ref2], wordt voor de eerste keer vastgesteld uiterlijk twee
      jaren na het in werking treden van deze wet.

      3 Indien het bestuurscollege nalaat binnen de in het tweede lid genoemde termijn het natuurplan vast te stellen,
      stelt de gezaghebber dit vast.


      [ref1]: https://wetten.overheid.nl/BWBR0028434#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0028434#Artikel9
