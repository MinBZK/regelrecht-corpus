  - number: '2'
    text: |-
      1 Onze Minister stelt een maal per vijf jaren een natuurbeleidsplan voor de openbare lichamen Bonaire,
      Sint Eustatius en Saba vast, waarin mede uitvoering wordt gegeven aan de terzake aangegane internationale
      verplichtingen.

      2 Onze Minister bereidt het natuurbeleidsplan voor in nauw overleg met het bestuurscollege.

      3 Het natuurbeleidsplan bevat in elk geval:

      a. de doelstellingen inzake de natuur en het landschap die in de planperiode moeten worden verwezenlijkt;

      b. een overzicht van prioriteiten op het gebied van de natuur en het landschap, die binnen de planperiode dienen te
      worden aangepakt;

      c. de bij de uitvoering van het beleid in aanmerking te nemen natuurbeschermingswaarden;

      d. een lijst van nationale parken, zowel terrestrisch als marien, die bestaan uit bij eilandsverordening of besluit
      van Onze minister ingestelde natuurparken.

      4 Bij het opstellen van het natuurbeleidsplan houdt Onze Minister rekening met de ruimtelijke ontwikkelingsplannen
      van de openbare lichamen Bonaire, Sint Eustatius en Saba

      5 Het natuurbeleidsplan strekt tot algemeen kader voor het natuurbeleid.

      6 Jaarlijks doet Onze Minister vóór 1 september verslag van de stand van zaken met betrekking tot de uitvoering
      van het natuurbeleidsplan aan de Staten-Generaal. Afschrift van dit verslag wordt mede aangeboden aan het
      bestuurscollege.
    url: https://wetten.overheid.nl/BWBR0028434/2019-01-01#Artikel2
  - number: 2a
    text: |-
      1 Onze minister kan natuurparken instellen ten uitvoering van het Verdrag van Ramsar, het SPAW-protocol of het
      Biodiversiteitsverdrag.

      2 Onze minister bereidt de instelling van een natuurpark voor in nauw overleg met het bestuurscollege.

      3 Onze minister draagt de gemelde natuurparken voor bij het desbetreffende uitvoerende bureau dat bij deze
      verdragen is ingesteld, met het verzoek tot opname in de bij het verdrag horende lijst van beschermde soorten.
    url: https://wetten.overheid.nl/BWBR0028434/2019-01-01#Artikel2a
  - number: '3'
    text: |-
      1 Onze minister kan een Commissie natuurbeheer en bescherming instellen.

      2 De commissie heeft tot taak Onze minister en het bestuurscollege desgevraagd of uit eigen beweging van advies te
      dienen over maatregelen ter uitvoering van deze wet.

      3 Bij ministeriële regeling kunnen nadere regels worden gesteld over de samenstelling, werkwijze en wijze van
      bezoldiging van de leden van de commissie.
    url: https://wetten.overheid.nl/BWBR0028434/2019-01-01#Artikel3
  - number: '4'
    text: |-
      Onze minister is bevoegd tot het verstrekken van vergunningen en certificaten krachtens de artikelen III, IV en
      V van het CITES-verdrag, het toestaan van de uitzondering, bedoeld in artikel VII, zevende lid, van het CITES-
      verdrag.
    url: https://wetten.overheid.nl/BWBR0028434/2019-01-01#Artikel4
  - number: '5'
    text: |-
      1 Onze Minister wijst een beheersinstantie aan.

      2 De beheersinstantie:

      a. is belast met de werkzaamheden, bedoeld in artikel III, tweede lid, onderdelen b, en c, derde lid, onderdeel
      c, vierde lid, onderdeel b, vijfde lid, onderdelen b en c, artikel IV, tweede lid, onderdelen b en c, vijfde lid,
      onderdelen a en b, zesde lid, onderdeel b, artikel V, tweede lid, onderdelen a en b, vierde lid, artikel VI, zesde
      en zevende lid, artikel VII, tweede, derde, vijfde en zesde lid, en artikel 8, zevende lid, van het CITES-verdrag,
      overeenkomstig de desbetreffende of overige voorschriften terzake;

      b. heeft tot taak het bijhouden van de volgende registers:

      1°. een register van in de openbare lichamen Bonaire, Sint Eustatius en Saba gehouden of in bezit zijnde soorten,
      opgenomen in bijlage 1 van het CITES-verdrag en de Bonn-conventie en bijlagen 1 en 2 van het SPAW-protocol;

      2°. een register in de openbare lichamen Bonaire, Sint Eustatius en Saba overeenkomstig het voorschrift, bedoeld in
      Artikel VIII, zesde lid, onderdelen a en b, van het CITES-verdrag;

      3°. een register van personen die diersoorten of plantensoorten, opgenomen in de bijlagen van het CITES-verdrag, in
      gevangenschap doen voorttelen onderscheidenlijk kweken.

      3 De beheersinstantie verstrekt van elke registratie in de registers, bedoeld in het tweede lid, onderdeel b, ten
      1, een bewijs.

      4 Bij ministeriële regeling worden voor de registers bedoeld in het tweede lid, regels gesteld met betrekking tot
      de inhoud, de vorm en het beheer, alsmede met betrekking tot de gegevens en bescheiden die bij de aanmelding voor
      opneming in de registers dienen te worden verstrekt.

      5 De beheersinstantie is bevoegd voor haar taken, bedoeld in het tweede en derde lid, vergoedingen in rekening te
      brengen die bij ministeriële regeling worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028434/2019-01-01#Artikel5
  - number: '6'
    text: |-
      1 Onze Minister wijst één of meer deskundigen of instanties aan als wetenschappelijke autoriteit.

      2 De wetenschappelijke autoriteit heeft de volgende taken:

      1. het afgeven van de verklaringen, bedoeld in artikel III, tweede lid, onderdeel a, derde lid, onderdeel a, en
      vijfde lid, onderdeel a, alsmede artikel IV, tweede lid, onderdeel a en zesde lid, onderdeel a, van het CITES-
      verdrag;

      2. het houden van voortdurend toezicht en de inkennisstelling, bedoeld in artikel IV, derde lid, van het CITES-
      verdrag;

      3. het geven van advies als bedoeld in artikel VIII, vierde lid, onderdeel c, van het CITES-verdrag;

      4. het desgevraagd adviseren van Onze Minister, het bestuurscollege, de beheersinstantie alsmede de ambtenaren,
      bedoeld in de [artikelen 16, eerste lid][ref1], en [18, eerste lid][ref2], over:

      a. de identificatie van specimens als bedoeld in [artikel 7][ref3], of soorten als bedoeld in [artikel 8][ref4]; en

      b. alle andere aangelegenheden betrekking hebbende op het natuurbeheer en de natuurbescherming die hem om advies
      worden voorgelegd.

      3 De wetenschappelijke autoriteit is bevoegd voor haar taken als bedoeld in het tweede lid, vergoedingen in
      rekening te brengen die bij ministeriële regeling worden vastgesteld.


