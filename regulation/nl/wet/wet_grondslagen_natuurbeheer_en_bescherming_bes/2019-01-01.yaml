  - number: 8b
    text: |-
      Bij ministeriële regeling kunnen ten aanzien van de verboden, bedoeld in artikel 11, eerste lid, van het SPAW-
      protocol, vrijstellingen worden verleend als bedoeld in artikel 11, tweede lid, en artikel 14 van dat protocol,
      nadat de Wetenschappelijke en Technische Raadgevende Commissie in evengenoemd artikel 11, tweede lid, de
      gegrondheid van de te verlenen vrijstellingen positief heeft beoordeeld.
    url: https://wetten.overheid.nl/BWBR0028434/2019-01-01#Artikel8b
  - number: 8c
    text: |-
      1 Onverminderd het bepaalde in [artikel 15, derde lid][ref1], van deze wet kunnen bij of krachtens algemene
      maatregel van bestuur regels worden gegeven ter uitvoering van het Verdrag van Ramsar, de Bonn-conventie, het
      Biodiversiteitsverdrag en het Zeeschildpaddenverdrag.

      2 Bij of krachtens algemene maatregel van bestuur als bedoeld in het eerste lid kan worden bepaald dat de
      eilandsraad zorgdraagt voor aangelegenheden vermeld in de in het eerste lid bedoelde verdragen onder opneming van
      een voorziening, bedoeld in [artikel 15, derde lid][ref2], van deze wet.


