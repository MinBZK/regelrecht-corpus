    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. *Onze minister:* Onze Minister van Landbouw, Natuur en Voedselkwaliteit;

      b. *bestuurscollege:* bestuurscollege van het openbaar lichaam Bonaire, Sint Eustatius of Saba;

      c. *eilandsraad:* eilandsraad van het openbaar lichaam Bonaire, Sint Eustatius of Saba;

      d. *commissie:* de commissie, genoemd in [artikel 3][ref1];

      e. *beheersinstantie:* de instantie bedoeld in [artikel 5][ref2];

      f. *wetenschappelijke autoriteit:* autoriteit, bedoeld in [artikel 6][ref3]

      g. *inheemse fauna en flora:* de op de openbare lichamen Bonaire, Sint Eustatius en Saba of in de wateren van de
      genoemde openbare lichamen van nature voorkomende dieren en planten;

      h. *soort:* elke soort, ondersoort of een geografisch geïsoleerde populatie van flora of fauna;

      i. *Verdrag van Ramsar:* de op 2 februari 1971 te Ramsar tot stand gekomen Overeenkomst inzake watergebieden van
      internationale betekenis, in het bijzonder als verblijfplaats van watervogels (Trb. 1975, 84);

      j. *CITES-verdrag:* de op 3 maart 1973 te Washington gesloten Overeenkomst inzake de internationale handel in
      bedreigde in het wild levende dier- en plantsoorten, met bijlagen (Trb. 1975, 23) alsmede de Resoluties van de
      Conferentie van Partijen behorende bij dit verdrag;

      k. *Bonn-conventie:* het op 23 juni 1979 te Bonn tot stand gekomen Verdrag inzake de bescherming van trekkende
      wilde diersoorten, met bijlagen (Trb. 1981, 6);

      l. *SPAW-protocol:* het op 18 januari 1990 te Kingston getekende protocol betreffende de bijzondere beschermde
      gebieden en de in de natuur levende dieren en planten, met bijlagen (Trb. 1990, 115), behorende bij het op 24 maart
      1983 te Cartagena de Indias gesloten Verdrag inzake de bescherming en ontwikkeling van het mariene milieu in het
      Caraïbisch gebied (Trb. 1983, 152);

      m. *Biodiversiteitsverdrag:* het op 5 juni 1992 te Rio de Janeiro tot stand gekomen verdrag inzake de biologische
      diversiteit (Trb. 1992, 164);

      n. *Zeeschildpaddenverdrag:* Inter-Amerikaans Verdrag inzake de bescherming en het behoud van zeeschildpadden, met
      Bijlagen; Caracas, 1 december 1996 (Trb. 1999, 45).

      2 De geldende tekst van de in het eerste lid, onderdelen i tot en met n, genoemde verdragen liggen voor een ieder
      ter inzage bij de beheersinstantie en de commissie.


