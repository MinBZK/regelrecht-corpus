  - number: 7a
    text: |-
      1 Handel in specimens, opgenomen in Bijlage I, II of III van het CITES-verdrag, moet in overeenstemming zijn met
      de bepalingen van onderscheidenlijk artikel III, IV of V van dit verdrag, onverminderd de uitzonderingsgevallen van
      artikel VII, tweede, derde, vijfde en zesde lid, van het CITES-verdrag.

      2 Bij doorvoer of overlading als bedoeld in artikel VII van het CITES-verdrag, moet een specimen voorzien zijn
      van een uitvoer-, wederuitvoer- of aanvoervergunning of -certificaat die in overeenstemming met de bepalingen van
      artikel VI van het CITES-verdrag is afgegeven.

      3 Bij ministeriele regeling kunnen regels worden gegeven ter uitvoering van het CITES-verdrag.
    url: https://wetten.overheid.nl/BWBR0028434/2019-01-01#Artikel7a
  - number: 7b
    text: |-
      1 Bij handel als bedoeld in [artikel 7A, eerste lid][ref1], moeten de krachtens de bepalingen van de artikelen III,
      IV en V van het CITES-verdrag verstrekte vergunningen en certificaten in overeenstemming zijn met de bepalingen van
      artikel VI van dit verdrag.

      2 Vergunningen of certificaten kunnen worden ingetrokken, indien:

      a. de daaraan verbonden voorschriften of beperkingen waaronder deze zijn verleend, niet worden nageleefd;

      b. de gegevens, verstrekt ter verkrijging van de vergunning of het certificaat, zodanig onjuist of onvolledig
      blijken te zijn dat op de aanvraag afwijzend of anders zou zijn beschikt, indien bij de beoordeling daarvan de
      juiste of volledige gegevens bekend waren geweest.

      3 Het model, bedoeld in Bijlage IV van het CITES-verdrag, betreffende vergunningen en certificaten wordt bij
      ministeriële regeling vastgesteld.

      4 De regels opgenomen in de Resoluties van het CITES-verdrag met betrekking tot vergunningen en certificaten
      bedoeld in de artikelen van dit verdrag zijn van toepassing.


