  - number: '34'
    text: |-
      De in [artikel 33, eerste lid][ref1], strafbaar gestelde feiten zijn misdrijven; de overige in dit artikel
      strafbaar gestelde feiten zijn overtredingen.


      [ref1]: https://wetten.overheid.nl/BWBR0028434#Artikel33
    url: https://wetten.overheid.nl/BWBR0028434/2019-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0028434
        artikel: '33'
        hoofdstuk: '6'
        paragraaf: '3'
  - number: '35'
    text: |-
      1 Onverminderd het bepaalde in de [artikelen 35][ref1], [36][ref2] en
      [38b tot en met 38d van het Wetboek van Strafrecht BES][ref3] worden alle, onverschillig waar, ongeoorloofd
      aanwezig bevonden specimens, verbeurd verklaard of aan het verkeer onttrokken.

      2 Verbeurd verklaarde of aan het verkeer onttrokken specimens worden, met inachtneming van de door Onze Minister
      gestelde regels, in beheer gegeven aan een daarbij aan te wijzen persoon of instelling.

      3 Verbeurd verklaarde of aan het verkeer onttrokken levende specimens als bedoeld in het eerste lid worden met
      inachtneming van door Onze Minister te stellen regels teruggezet in de natuur.

      4 Verbeurd verklaarde of aan het verkeer onttrokken levende specimens die afkomstig zijn uit een lidstaat, worden
      op kosten van de eigenaar, de vervoerder, de importeur of diens gemachtigde hetzij teruggezonden naar die lidstaat,
      hetzij verzonden naar een andere lidstaat indien naar het oordeel van Onze Minister aldaar een passender omgeving
      voor het specimen is gewaarborgd.

      5 Verbeurd verklaarde of aan het verkeer onttrokken levende specimens die afkomstig zijn uit een niet-lidstaat,
      worden op kosten van de eigenaar, de vervoerder, de importeur of diens gemachtigde hetzij in de op Bonaire, Sint
      Eustatius of Saba in een door Onze Minister te bepalen passende omgeving ondergebracht, hetzij verzonden naar een
      lidstaat waar naar het oordeel van Onze Minister een passender omgeving voor het specimen is gewaarborgd.

      6 In het uiterste geval kan Onze Minister gelasten dat verbeurd verklaarde of aan het verkeer onttrokken levende
      specimens op kosten van de eigenaar, de vervoerder, de importeur of diens gemachtigde, worden vernietigd met
      inachtneming van door Onze Minister te stellen regels.

      7 Verbeurd verklaarde of aan het verkeer onttrokken dode specimens worden op kosten van de eigenaar, de vervoerder,
      de importeur of diens gemachtigde vernietigd. In bijzondere gevallen kan Onze Minister afwijken van de eerste
      volzin, mits verzekerd is, dat het desbetreffende goed nimmer in het economisch verkeer kan komen.

      8 Ten aanzien van hetgeen krachtens het vierde, vijfde, zesde of zevende lid, verschuldigd is, zijn de
      [artikelen 22][ref4] en [23][ref5] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel36
