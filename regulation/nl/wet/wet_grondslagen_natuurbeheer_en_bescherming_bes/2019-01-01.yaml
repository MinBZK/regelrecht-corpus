  - number: '19'
    text: |-
      Een ieder die betrokken is bij de uitvoering van deze wet en daarbij de beschikking krijgt over gegevens waarvan
      hij het vertrouwelijke karakter kent of redelijkerwijs moet vermoeden, en voor wie niet reeds uit hoofde van
      ambt, beroep of wettelijk voorschrift ter zake van die gegevens een geheimhoudingsplicht geldt, is verplicht tot
      geheimhouding daarvan, behoudens voor zover enig wettelijk voorschrift hem tot bekendmaking verplicht of uit zijn
      taak bij de uitvoering van deze wet de noodzaak tot bekendmaking voortvloeit.
    url: https://wetten.overheid.nl/BWBR0028434/2019-01-01#Artikel19
  - number: '20'
    text: |-
      Onze Minister en het bestuurscollege, voor zover het betreft overtreding van voorschriften van de openbare
      lichamen, zijn bevoegd tot het doen wegnemen, ontruimen, beletten, in de vorige toestand herstellen of het
      verrichten van hetgeen in strijd met de in deze wet en de daarop berustende bepalingen gestelde verplichtingen is
      of wordt gedaan, gehouden of nagelaten.
    url: https://wetten.overheid.nl/BWBR0028434/2019-01-01#Artikel20
  - number: '21'
    text: |-
      1 Een beslissing tot toepassing van bestuursdwang wordt op schrift gesteld en geldt als een beschikking.

      2 De bekendmaking ervan geschiedt aan de overtreder en eventuele andere belanghebbenden.

      3 In de beschikking wordt een termijn gesteld waarbinnen de belanghebbenden de tenuitvoerlegging kunnen voorkomen
      door zelf maatregelen te treffen. De te nemen maatregelen worden in de beschikking vermeld.

      4 Geen termijn behoeft te worden gegund, indien de vereiste spoed zich daartegen verzet.

      5 Indien de situatie dermate spoedeisend is dat Onze Minister of het bestuurscollege de beslissing tot toepassing
      van bestuursdwang niet van te voren op schrift kan zetten, zorgt deze alsnog zo spoedig mogelijk voor de
      opschriftstelling en de bekendmaking.
    url: https://wetten.overheid.nl/BWBR0028434/2019-01-01#Artikel21
  - number: '22'
    text: |-
      1 De overtreder is de kosten verbonden aan de toepassing van bestuursdwang verschuldigd, tenzij deze kosten
      redelijkerwijze niet of niet geheel te zijnen laste behoren te komen.

      2 De beschikking vermeldt dat de toepassing van de bestuursdwang op kosten van de overtreder plaatsvindt.

      3 Indien de kosten geheel of gedeeltelijk niet ten laste van de overtreder zullen worden gebracht, wordt zulks in
      de beschikking vermeld.

      4 Onder de kosten, bedoeld in het eerste lid, worden begrepen de kosten verbonden aan de voorbereiding
      van bestuursdwang, voor zover deze kosten zijn gemaakt na het tijdstip waarop de termijn, bedoeld in
      [artikel 21, derde lid][ref1], is verstreken.

      5 De kosten zijn ook verschuldigd indien de bestuursdwang door opheffing van de onwettige situatie niet of niet
      volledig is uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0028434#Artikel21
    url: https://wetten.overheid.nl/BWBR0028434/2019-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0028434
        artikel: '21'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '23'
    text: |-
      1 Onze Minister of het bestuurscollege, voor zover het betreft overtreding van voorschriften van de openbare
      lichamen, kan van de overtreder bij dwangbevel de verschuldigde kosten, verhoogd met de op de invordering vallende
      kosten invorderen.

      2 Het dwangbevel wordt op kosten van de overtreder bij deurwaardersexploot betekend en levert een executoriale
      titel op in de zin van het [Tweede Boek van het Wetboek van Burgerlijke Rechtsvordering BES][ref1].

      3 Gedurende zes weken na de dag van betekening staat verzet tegen het dwangbevel open door dagvaarding van Staat
      der Nederlanden of het desbetreffende openbare lichaam.

      4 Het verzet schorst de tenuitvoerlegging. Op verzoek van de Staat der Nederlanden of het desbetreffende openbare
      lichaam kan de rechter in eerste aanleg de schorsing van de tenuitvoerlegging opheffen.


      [ref1]: https://wetten.overheid.nl/BWBR0028496
    url: https://wetten.overheid.nl/BWBR0028434/2019-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0028496
  - number: '24'
    text: |-
      De kosten verbonden aan de toepassing van bestuursdwang, zijn bevoorrecht op de zaak ten aanzien waarvan zij
      zijn besteed en worden na de kosten, bedoeld in artikel 1165, onderdeel 4° van het Burgerlijk Wetboek BES uit de
      opbrengst van de zaak betaald.
    url: https://wetten.overheid.nl/BWBR0028434/2019-01-01#Artikel24
  - number: '25'
    text: |-
      Om aan een besluit tot toepassing van bestuursdwang uitvoering te geven, zijn de
      [artikelen 16, derde tot en met vijfde lid][ref1] en [17][ref2] van overeenkomstige toepassing op door Onze
      Minister of het bestuurscollege, voor zover het betreft overtreding van voorschriften van de openbare lichamen, aan
      te wijzen personen.


      [ref1]: https://wetten.overheid.nl/BWBR0028434#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0028434#Artikel17
    url: https://wetten.overheid.nl/BWBR0028434/2019-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0028434
        artikel: '16'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0028434
        artikel: '17'
        hoofdstuk: '5'
  - number: '26'
    text: |-
      Onze Minister of het bestuurscollege, voor zover het betreft overtreding van voorschriften van de openbare
      lichamen, zijn bevoegd gebouwen, terreinen en hetgeen zich daarop bevindt, te verzegelen.
    url: https://wetten.overheid.nl/BWBR0028434/2019-01-01#Artikel26
  - number: '27'
    text: |-
      1 Tot de bevoegdheid tot toepassing van bestuursdwang behoort het meevoeren en opslaan van daarvoor vatbare zaken
      voor zover de toepassing van bestuursdwang dit vereist.

      2 Indien zaken zijn meegevoerd en opgeslagen, doen Onze Minister of het desbetreffende bestuurscollege daarvan
      proces-verbaal opmaken, waarvan afschrift wordt verstrekt aan de belanghebbende.

      3 Onze Minister en het desbetreffende bestuurscollege dragen zorg voor de bewaring van de opgeslagen zaken en geeft
      deze zaken terug aan de rechthebbende.

      4 Onze Minister en het desbetreffende bestuurscollege zijn bevoegd de afgifte op te schorten totdat de
      verschuldigde kosten zijn voldaan. Indien de rechthebbende niet tevens de overtreder is, zijn Onze Minister en het
      bestuurscollege bevoegd de afgifte op te schorten totdat de kosten van bewaring zijn voldaan.
    url: https://wetten.overheid.nl/BWBR0028434/2019-01-01#Artikel27
  - number: '28'
    text: |-
      1 Onze Minister en het bestuurscollege, indien het betreft overtreding van voorschriften van de openbare lichamen,
      zijn bevoegd, indien een opgeslagen zaak niet binnen drie maanden na de opslag kan worden teruggegeven, deze te
      verkopen of, indien verkoop naar hun oordeel niet mogelijk is, de zaak om niet aan een derde in eigendom over te
      dragen of te laten vernietigen.

      2 Gelijke bevoegdheid hebben Onze Minister en het desbetreffende bestuurscollege ook binnen die termijn, zodra de
      aan de toepassing van bestuursdwang verbonden kosten, vermeerderd met de voor de verkoop, de eigendomsoverdracht om
      niet of de vernietiging geraamde kosten, in verhouding tot de waarde van de zaak onevenredig hoog worden.

      3 Verkoop, eigendomsoverdracht of vernietiging vinden niet plaats binnen twee weken na de verstrekking van het
      afschrift van het proces-verbaal betreffende het meevoeren en opslaan, tenzij het gevaarlijke stoffen of eerder aan
      bederf onderhevige stoffen betreft.

      4 Gedurende drie jaren na het tijdstip van verkoop heeft degene die op dat tijdstip eigenaar was, recht op de
      opbrengst van het goed onder aftrek van de aan de toepassing van bestuursdwang verbonden kosten van de verkoop.
    url: https://wetten.overheid.nl/BWBR0028434/2019-01-01#Artikel28
  - number: '29'
    text: |-
      1 Onze Minister en het bestuurscollege, indien het betreft overtreding van voorschriften van de openbare lichamen,
      kunnen in plaats van bestuursdwang toe te passen aan de overtreder een last onder dwangsom opleggen. Voor het
      opleggen van een last onder dwangsom wordt niet gekozen, indien het belang dat het overtreden voorschrift beoogt te
      beschermen, zich daartegen verzet.

      2 Onze Minister of het desbetreffende bestuurscollege stelt de dwangsom vast hetzij op een bedrag ineens
      hetzij op een bedrag per tijdseenheid waarin de last niet is uitgevoerd of op een bedrag per overtreding van de
      last. Zij stellen tevens een bedrag vast waarboven geen dwangsom meer wordt verbeurd. Het vastgestelde bedrag
      dient in redelijke verhouding te staan tot de zwaarte van het geschonden belang en de beoogde werking van de
      dwangsomoplegging.

      3 In de beschikking tot oplegging van een last onder dwangsom die strekt tot het ongedaan maken of het beëindigen
      van een overtreding, wordt een termijn gesteld gedurende welke de overtreder de last kan uitvoeren zonder dat een
      dwangsom wordt verbeurd.
    url: https://wetten.overheid.nl/BWBR0028434/2019-01-01#Artikel29
  - number: '30'
    text: |-
      1 Verbeurde dwangsommen komen toe aan de Staat der Nederlanden of het desbetreffende openbare lichaam.

      2 Onze Minister en het desbetreffende bestuurscollege kunnen bij dwangbevel het verschuldigde bedrag, verhoogd
      met de op de invordering vallende kosten, invorderen. [Artikel 22, tweede, derde en vierde lid][ref1], zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028434#Artikel22
    url: https://wetten.overheid.nl/BWBR0028434/2019-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0028434
        artikel: '22'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '31'
    text: |-
      1 Onze Minister of het desbetreffende bestuurscollege kunnen op verzoek van de overtreder de dwangsom opheffen of
      de looptijd ervan opschorten voor een bepaalde termijn ingeval van blijvende of tijdelijke gehele of gedeeltelijke
      onmogelijkheid voor de overtreder om aan zijn verplichtingen te voldoen.

      2 Onze Minister of het desbetreffende bestuurscollege kunnen op verzoek van de overtreder de dwangsom opheffen
      indien de beschikking een jaar van kracht is geweest zonder dat de dwangsom is verbeurd.
    url: https://wetten.overheid.nl/BWBR0028434/2019-01-01#Artikel31
  - number: '32'
    text: |-
      1 De bevoegdheid tot invordering van verbeurde bedragen verjaart door verloop van één jaar na de dag waarop zij
      zijn verbeurd.

      2 De verjaring wordt geschorst door faillissement en ieder wettelijk beletsel voor invordering van de dwangsom.
    url: https://wetten.overheid.nl/BWBR0028434/2019-01-01#Artikel32
  - number: '33'
    text: |-
      1 Handelen in strijd met de voorschriften gegeven bij of krachtens de [artikelen 7A][ref1], [7B][ref2], [8A][ref3],
      [8B][ref4], [8C][ref5] en [8D, eerste en tweede lid][ref6], of krachtens [artikel 15][ref7], en overtreding van de
      verboden gegeven bij of krachtens de artikelen 7A, 7B, 8A, 8B, 8C en 8D, eerste en tweede lid, of krachtens artikel
      15, wordt, voor zover opzettelijk begaan, gestraft met hetzij gevangenisstraf van ten hoogste vier jaren, hetzij
      geldboete van ten hoogste de zesde categorie van het [Wetboek van Strafrecht BES][ref8], hetzij beide straffen.

      2 Handelen in strijd met de voorschriften gegeven bij of krachtens de [artikelen 7A][ref9], [7B][ref10],
      [8A][ref11], [8B][ref12], [8C][ref13] en [8D, eerste en tweede lid][ref14], of krachtens [artikel 15][ref15], en
      overtreding van de verboden gegeven bij of krachtens de artikelen 7A, 7B, 8A, 8B, 8C en 8D, eerste en tweede lid,
      of krachtens artikel 15, wordt, voor zover niet opzettelijk begaan, gestraft met hetzij hechtenis van ten hoogste
      een jaar, hetzij geldboete van ten hoogste de vijfde categorie van het [Wetboek van Strafrecht BES][ref16], hetzij
      beide straffen.

      3 Handelen in strijd met de bij de [artikelen 17, eerste lid][ref17], en [19][ref18] gegeven voorschriften wordt
      gestraft met hetzij hechtenis van ten hoogste zes maanden, hetzij een geldboete van de vierde categorie van het
      [Wetboek van Strafrecht BES][ref19], hetzij beide straffen.


