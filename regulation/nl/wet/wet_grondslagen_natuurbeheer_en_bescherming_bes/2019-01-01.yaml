  - number: '17'
    text: |-
      1 Een ieder is verplicht aan toezichthouders alle medewerking te verlenen die deze redelijkerwijs kunnen verlangen
      ter uitoefening van hun bevoegdheden.

      2 Zij die uit hoofde van ambt, beroep of wettelijk voorschrift verplicht zijn tot geheimhouding, kunnen het
      verlenen van medewerking weigeren, voor zover hun geheimhoudingsplicht zich daartoe uitstrekt.
    url: https://wetten.overheid.nl/BWBR0028434/2019-01-01#Artikel17
  - number: '18'
    text: |-
      1 Met de opsporing van de bij of krachtens deze wet strafbaar gestelde feiten zijn, naast de in
      [artikel 184 van het Wetboek van Strafvordering BES][ref1] bedoelde personen, belast de daartoe bij besluit van
      Onze minister van Justitie, in overeenstemming met Onze Minister aangewezen ambtenaren of personen. Een zodanige
      aanwijzing wordt bekendgemaakt in de Staatscourant.

      2 Voor zover de in het eerste lid bedoelde opsporing betrekking heeft op feiten die zijn strafbaar gesteld in
      de door de openbare lichamen Bonaire, Sint Eustatius en Saba ter uitvoering van deze wet gestelde voorschriften,
      wordt de opsporing mede uitgeoefend door ambtenaren of personen die daartoe door het bestuurscollege worden
      aangewezen. Een zodanige aanwijzing wordt bekendgemaakt in het blad waarin door het desbetreffende openbare lichaam
      gebruikelijk officiële berichten worden bekendgemaakt.

      3 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de vereisten waaraan de
      krachtens het eerste en het tweede lid aangewezen ambtenaren of personen dienen te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel184
