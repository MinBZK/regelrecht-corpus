  - number: '7'
    text: |-
      In de[ artikelen 7A][ref1], [7B][ref2], [11][ref3], [15][ref4] en [35][ref5], alsmede de daarop berustende bepaling
      wordt verstaan onder:

      a. *specimen:* specimen als bedoeld in artikel I, onderdeel b, van het CITES-verdrag;

      b. *invoer:* iedere handeling die kennelijk rechtstreeks is gericht op het bewerkstelligen van het binnen het
      grondgebied van de openbare lichamen Bonaire, Sint Eustatius of Saba.

      c. *uitvoer:* iedere handeling die kennelijk rechtstreeks is gericht op het bewerkstelligen van het buiten het
      grondgebied van de openbare lichamen Bonaire, Sint Eustatius of Saba.

      d. *wederuitvoer:* de uitvoer van hetgeen tevoren is ingevoerd;

      e. *handel:* de uitvoer, de wederuitvoer, de invoer en het inbrengen vanuit de zee voortkomende dieren en planten;

      f. *aanvoer van uit de zee voortkomen de planten en dieren:* het tot binnen de grenzen van de openbare lichamen
      Bonaire, Sint Eustatius of Saba vervoeren van specimens van soorten, opgenomen in de bijlagen van het CITES-
      verdrag, die zijn gehaald uit zeegebied dat niet tot het rechtsgebied van de openbare lichamen Bonaire, Sint
      Eustatius of Saba;

      g. *doorvoer:* de uitvoer van elk tevoren ingevoerd specimen zonder dat dit in het vrije verkeer is gebracht.


