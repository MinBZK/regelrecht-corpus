      bedoeld in de [artikelen 53][ref2] en [55 tot en met 61 van de Wet maritiem beheer BES][ref3].

      2 Het eerste lid is alleen van toepassing waar het betreft de opsporing van overtredingen van beperkingen of
      verboden opgelegd aan de vaart overeenkomstig [artikel 8D, eerste en derde lid][ref4].


