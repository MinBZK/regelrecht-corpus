preamble:
  text: |-
    Gelet op artikel 8, eerste lid, van de Paspoortwet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0022251/2007-07-20#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      De hoofden van alle posten zijn bevoegd tot het in ontvangst nemen van aanvragen voor reisdocumenten, genoemd in
      [artikel 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022251#Artikel2
    url: https://wetten.overheid.nl/BWBR0022251/2007-07-20#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0022251
        artikel: '2'
  - number: '2'
    text: |-
      1 De hoofden van de in de bijlage onder A genoemde posten zijn bevoegd tot het verstrekken van:

      a. nationale paspoorten;

      b. reisdocumenten voor vluchtelingen;

      c. reisdocumenten voor vreemdelingen;

      d. faciliteitenpaspoorten;

      e. tweede paspoorten en

      f. noodpaspoorten.

      2 De hoofden van de in de bijlage onder B genoemde posten zijn bevoegd tot het verstrekken van Nederlandse
      identiteitskaarten.

      3 De hoofden van alle posten zijn bevoegd tot het verstrekken van laissez-passer’s.
    url: https://wetten.overheid.nl/BWBR0022251/2007-07-20#Artikel2
  - number: '3'
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0022251/2007-07-20#Artikel3
