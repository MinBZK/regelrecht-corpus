        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 20.2a.3
    text: |-
      Artikel 3.3a van deze wet, en de daarop berustende bepalingen zoals die luidden voor het tijdstip
      van inwerkingtreding van artikel I, onderdeel A van de wet van 10 mei 2012 houdende wijziging van de
      Telecommunicatiewet in verband met de Nota frequentiebeleid 2005 (Stb. 2013, 48) blijven van toepassing ten aanzien
      van vergunningen die zijn verleend voor het tijdstip van inwerkingtreding van die wet. De eerste volzin is niet
      langer van toepassing ten aanzien van de daarin genoemde vergunningen indien de looptijd van die vergunningen wordt
      verlengd na het tijdstip van inwerkingtreding van genoemde wet.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel20.2a
  - number: 20.2a.4
    text: |-
      Het frequentieplan zoals dat luidde voor het tijdstip van inwerkingtreding van artikel I, onderdeel A van de
      wet van 10 mei 2012 houdende wijziging van de Telecommunicatiewet in verband met de Nota frequentiebeleid 2005
      (Stb. 2013, 48) blijft van kracht tot het tijdstip waarop een nieuw frequentieplan is vastgesteld op grond van
      [artikel 3.1][ref1] zoals dat luidt na inwerkingtreding van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel20.2a
