---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht-mvp/refs/heads/main/schema/v0.3.1/schema.json
$id: telecommunicatiewet
regulatory_layer: WET
publication_date: '2025-07-23'
valid_from: '2016-10-01'
bwb_id: BWBR0009950
url: https://wetten.overheid.nl/BWBR0009950/2016-10-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het in verband met de algehele liberalisering van de telecommunicatie-
    infrastructuur en de telecommunicatiediensten wenselijk is regels te stellen ter waarborging van een samenhangende
    infrastructuur en ter bevordering van de daadwerkelijke mededinging;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Economische Zaken;'
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.1
  - number: 1.1.b
    text: |-
      *Autoriteit Consument en Markt:* de Autoriteit Consument en Markt, genoemd in
      [artikel 2, eerste lid, van de Instellingswet Autoriteit Consument en Markt][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0033043#Artikel2
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0033043
        artikel: '2'
  - number: 1.1.d
    text: |-
      nationale regelgevende instantie: instantie in een andere lidstaat van de Europese Unie die krachtens het recht
      van die lidstaat is belast met een of meer regelgevende of daarmee verband houdende uitvoerende taken die zijn
      toegekend in de [richtlijnen nrs. 2002/19/EG](32002L0019), [2002/20/EG](32002L0020), [2002/21/EG](32002L0021),
      [2002/22/EG](32002L0022) of [2002/58/EG](32002L0058);
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.1
  - number: 1.1.e
    text: |-
      elektronisch communicatienetwerk: transmissiesystemen, waaronder mede begrepen de schakel- of routeringsapparatuur,
      netwerkelementen die niet actief zijn en andere middelen, die het mogelijk maken signalen over te brengen via
      kabels, radiogolven, optische of andere elektromagnetische middelen, waaronder satellietnetwerken, vaste en
      mobiele terrestrische netwerken, elektriciteitsnetten, voor zover deze voor overdracht van signalen worden gebruikt
      en netwerken voor radio- en televisieomroep en kabeltelevisienetwerken, ongeacht de aard van de overgebrachte
      informatie;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.1
  - number: 1.1.f
    text: |-
      elektronische communicatiedienst: gewoonlijk tegen vergoeding aangeboden dienst die geheel of hoofdzakelijk
      bestaat in het overbrengen van signalen via elektronische communicatienetwerken, waaronder telecommunicatiediensten
      en transmissiediensten op netwerken die voor omroep worden gebruikt, doch niet de dienst waarbij met behulp
      van elektronische communicatienetwerken en -diensten overgebrachte inhoud wordt geleverd of redactioneel wordt
      gecontroleerd. Het omvat niet de diensten van de informatiemaatschappij zoals omschreven in artikel 1 van de
      notificatierichtlijn die niet geheel of hoofdzakelijk bestaan uit het overbrengen van signalen via elektronische
      communicatienetwerken;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.1
  - number: 1.1.g
    text: 'openbare elektronische communicatiedienst: elektronische communicatiedienst die beschikbaar is voor het publiek;'
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.1
  - number: 1.1.h
    text: |-
      openbaar elektronisch communicatienetwerk: elektronisch communicatienetwerk dat geheel of hoofdzakelijk wordt
      gebruikt om openbare elektronische communicatiediensten aan te bieden, waaronder mede wordt begrepen een netwerk,
      bestemd voor het verspreiden van programma's voor zover dit aan het publiek geschiedt;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.1
  - number: 1.1.i
    text: |-
      aanbieden van een elektronisch communicatienetwerk: het bouwen, exploiteren, beheren of beschikbaar stellen van een
      elektronisch communicatienetwerk;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.1
  - number: 1.1.j
    text: |-
      bijbehorende faciliteiten: de bij een elektronisch communicatienetwerk of een elektronische communicatiedienst
      behorende diensten, fysieke infrastructuren en andere faciliteiten of elementen die het aanbieden van diensten via
      dat netwerk of die dienst mogelijk maken of ondersteunen of het potentieel hiertoe bezitten;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.1
  - number: 1.1.k
    text: |-
      netwerkaansluitpunt: fysiek punt waarop een abonnee de toegang tot een openbaar elektronisch communicatienetwerk
      wordt geboden; in het geval van netwerken met schakelings- of routeringsfuncties wordt het netwerkaansluitpunt
      bepaald door middel van een specifiek netwerkadres, dat met een abonneenummer of -naam kan zijn verbonden;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.1
  - number: 1.1.l
    text: |-
      toegang: het aan een andere onderneming beschikbaar stellen van netwerkonderdelen, bijbehorende faciliteiten of
      diensten onder uitdrukkelijke voorwaarden, al dan niet op exclusieve basis, ten behoeve van het aanbieden van
      elektronische communicatiediensten, het aanbieden van diensten voor de informatiemaatschappij of het verspreiden
      van programma’s aan het publiek, door die onderneming;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.1
  - number: 1.1.m
    text: |-
      interconnectie: specifiek type toegang dat wordt gerealiseerd tussen exploitanten van openbare netwerken,
      inhoudende het fysiek en logisch verbinden van openbare communicatienetwerken die door dezelfde of een andere
      onderneming worden gebruikt om het de gebruikers van een onderneming mogelijk te maken te communiceren met die van
      dezelfde of van een andere onderneming of toegang te hebben tot diensten die door een andere onderneming worden
      aangeboden;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.1
  - number: 1.1.n
    text: |-
      gebruiker: natuurlijk persoon of rechtspersoon die gebruik maakt van of verzoekt om een openbare elektronische
      communicatiedienst;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.1
  - number: 1.1.o
    text: |-
      eindgebruiker: natuurlijke persoon of rechtspersoon die van een openbare elektronische communicatiedienst gebruik
      maakt of wil gaan maken en die niet tevens openbare elektronische communicatienetwerken of openbare elektronische
      communicatiediensten aanbiedt;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.1
  - number: 1.1.p
    text: |-
      abonnee: natuurlijke persoon of rechtspersoon die partij is bij een overeenkomst met een aanbieder van openbare
      elektronische communicatiediensten voor de levering van dergelijke diensten;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.1
  - number: 1.1.q
    text: |-
      consument: natuurlijke persoon die gebruik maakt van of verzoekt om een openbare elektronische communicatiedienst
      voor andere dan bedrijfs- of beroepsdoeleinden;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.1
  - number: 1.1.r
    text: |-
      onderneming: onderneming in de zin van artikel 101, eerste lid, van het Verdrag betreffende de werking van de
      Europese Unie;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.1
  - number: 1.1.s
    text: |-
      onderneming die beschikt over een aanmerkelijke marktmacht: onderneming die alleen of tezamen met andere
      ondernemingen over een economische kracht beschikt die haar in staat stelt zich in belangrijke mate onafhankelijk
      van haar concurrenten, klanten en uiteindelijk consumenten te gedragen;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.1
  - number: 1.1.t
    text: |-
      transnationale markt: bij beschikking, bedoeld in artikel 15, vierde lid, van richtlijn nr. 2002/21/EG,
      gedefinieerde markt die de Europese Unie of een aanzienlijk, zich over meer dan één lidstaat uitstrekkend, deel
      daarvan beslaat;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.1
  - number: 1.1.x
    text: |-
      openbare telefoondienst: dienst die voor het publiek beschikbaar is voor direct of indirect uitgaande en
      binnenkomende nationale of internationale gesprekken, met behulp van een nummer of een aantal nummers in een
      nationaal of internationaal nummerplan;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.1
  - number: 1.1.y
    text: |-
      programma: programma als bedoeld in [artikel 1.1 van de Mediawet 2008][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel1
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '1'
  - number: 1.1.z
    text: |-
      kabels: fysieke geleidingsdraden bestemd voor de rechtstreekse overdracht van signalen tussen punten en de bij deze
      fysieke geleidingsdraden behorende ondergrondse ondersteuningswerken, beschermingswerken en signaalinrichtingen,
      alsmede inrichtingen, bestemd om daarin verbinding tot stand te brengen tussen fysieke geleidingsdraden in, op of
      boven openbare gronden enerzijds en fysieke geleidingsdraden in gebouwen en daarmee één geheel vormende gronden
      anderzijds dan wel tussen laatstgenoemde fysieke geleidingsdraden onderling;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.1
  - number: 1.1.aa
    text: 'openbare gronden:'
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.1
  - number: 1.1.aa.1º
    text: |-
      openbare wegen met inbegrip van de daartoe behorende stoepen, glooiingen, bermen, sloten, bruggen, viaducten,
      tunnels, duikers, beschoeiingen en andere werken;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.1
  - number: 1.1.aa.2º
    text: |-
      wateren met de daartoe behorende bruggen, plantsoenen, pleinen en andere plaatsen, die voor eenieder toegankelijk
      zijn;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.1
  - number: 1.1.bb
    text: |-
      nummer: cijfers, letters of andere symbolen, al dan niet in combinatie, die bestemd zijn voor toegang tot of
      identificatie van gebruikers, netwerkexploitanten, diensten, netwerkaansluitpunten of andere netwerkelementen;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.1
  - number: 1.1.cc
    text: 'nummeridentificatie:'
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.1
  - number: 1.1.cc.1º
    text: |-
      faciliteit om het nummer van het oproepende netwerkaansluitpunt dan wel een nummer waarmee een individuele
      gebruiker kan worden geïdentificeerd aan het opgeroepen netwerkaansluitpunt te verstrekken, voordat de verbinding
      tot stand wordt gebracht;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.1
  - number: 1.1.cc.2º
    text: |-
      faciliteit om het nummer van het opgeroepen netwerkaansluitpunt dan wel het nummer waarmee een individuele
      gebruiker kan worden geïdentificeerd aan het oproepende netwerkaansluitpunt te verstrekken, voordat de verbinding
      tot stand wordt gebracht;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.1
  - number: 1.1.dd
    text: |-
      in de handel brengen: het voor de eerste maal afleveren na vervaardiging in de Europese Economische Ruimte, het in
      gebruik nemen na vervaardiging in de Europese Economische Ruimte, het invoeren in de Europese Economische Ruimte
      uit een land daarbuiten, of het in gebruik nemen na invoer uit een land buiten de Europese Economische Ruimte in de
      Europese Economische Ruimte;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.1
  - number: 1.1.ee
    text: |-
      openbaar telecommunicatienetwerk: elektronisch communicatienetwerk dat geheel of gedeeltelijk wordt gebruikt om
      openbare telecommunicatiediensten aan te bieden, voor zover het netwerk niet gebruikt wordt voor het verspreiden
      van programma's;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.1
  - number: 1.1.ff
    text: |-
      openbare telecommunicatiedienst: voor het publiek beschikbare dienst die geheel of gedeeltelijk bestaat in het
      overbrengen van signalen via een elektronisch communicatienetwerk, voor zover deze dienst niet bestaat uit het
      verspreiden van programma's;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.1
  - number: 1.1.gg
    text: 'uitrusting: elk apparaat of vaste installatie;'
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.1
  - number: 1.1.hh
    text: 'apparaten: elektrische en elektronische apparaten;'
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.1
  - number: 1.1.ii
    text: |-
      vaste installatie: een specifieke combinatie van verschillende soorten apparaten en eventuele andere inrichtingen,
      die samengebouwd, geïnstalleerd en bestemd zijn voor permanent gebruik op een van te voren vastgestelde locatie;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.1
  - number: 1.1.jj
    text: 'randapparaten:'
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.1
  - number: 1.1.jj.1°
    text: |-
      uitrusting die bestemd is om op een openbaar telecommunicatienetwerk te worden aangesloten, zodanig dat zij:
      rechtstreeks op netwerkaansluitpunten kan worden aangesloten, of kan dienen voor interactie met een openbaar
      telecommunicatienetwerk via directe of indirecte aansluiting op netwerkaansluitpunten ten behoeve van overbrenging,
      verwerking of ontvangst van informatie;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.1
  - number: 1.1.jj.2°
    text: Radiozendapparaten die geschikt zijn om op een openbaar telecommunicatienetwerk te worden aangesloten;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.1
  - number: 1.1.jj.3°
    text: |-
      Uitrusting voor satellietgrondstations tenzij bij of krachtens [hoofdstuk 10][ref1] anders is bepaald, doch met
      uitsluiting van speciaal geconstrueerde uitrusting die bedoeld is voor gebruik als onderdeel van een openbaar
      telecommunicatienetwerk;


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk10
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0009950
        hoofdstuk: '10'
  - number: 1.1.kk
    text: |-
      radiozendapparaten: uitrusting die naar haar aard bestemd is voor het zenden of het zenden en ontvangen van
      radiocommunicatiesignalen;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.1
  - number: 1.1.ll
    text: |-
      systeem voor voorwaardelijke toegang: elke technische maatregel of regeling waarbij toegang tot een beschermde
      radio- of televisie-omroepdienst in begrijpelijke vorm afhankelijk wordt gemaakt van een abonnement of een andere
      vorm van voorafgaande individuele machtiging;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.1
  - number: 1.1.mm
    text: |-
      applicatieprogramma-interface: een software interface tussen externe toepassingen, die beschikbaar is gesteld door
      omroepen, dienstenleveranciers, alsmede de hulpmiddelen in de eindapparatuur;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.1
  - number: 1.1.nn
    text: |-
      Internationaal Telecommunicatieverdrag: het op 22 december 1992 te Genève tot stand gekomen Statuut en Verdrag
      van de Internationale Unie voor Telecommunicatie met de daarbij behorende bijlagen en reglementen (Trb. 1993,
      138), de op 14 oktober 1994 te Kyoto tot stand gekomen Akten van wijziging van het Statuut en het Verdrag van
      de Internationale Unie voor Telecommunicatie (Trb. 1995, 201) en de op 6 november 1998 te Minneapolis tot stand
      gekomen Akten van wijziging van het Statuut en het Verdrag van de Internationale Unie voor Telecommunicatie (Trb.
      2001, 90);
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.1
  - number: 1.1.oo
    text: |-
      [richtlijn nr. 2002/19/EG](32002L0019): [Richtlijn nr. 2002/19/EG](32002L0019) van het Europees Parlement
      en de Raad van de Europese Unie van 7 maart 2002 inzake de toegang tot en interconnectie van elektronische-
      communicatienetwerken en bijbehorende faciliteiten (Toegangsrichtlijn) (PbEG L 108);
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.1
  - number: 1.1.pp
    text: |-
      [richtlijn nr. 2002/20/EG](32002L0020): [Richtlijn nr. 2002/20/EG](32002L0020) van het Europees Parlement en de
      Raad van de Europese Unie van 7 maart 2002 betreffende de machtiging voor elektronische-communicatienetwerken en
      -diensten (Machtigingsrichtlijn) (PbEG L 108);
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.1
  - number: 1.1.qq
    text: |-
      [richtlijn nr. 2002/21/EG](32002L0021): [Richtlijn nr. 2002/21/EG](32002L0021) van het Europees Parlement en de
      Raad van de Europese Unie van 7 maart 2002 inzake een gemeenschappelijk regelgevingskader voor elektronische-
      communicatienetwerken en -diensten (Kaderrichtlijn) (PbEG L 108);
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.1
  - number: 1.1.rr
    text: |-
      [richtlijn nr. 2002/22/EG](32002L0022): [Richtlijn nr. 2002/22/EG](32002L0022) van het Europees Parlement en de
      Raad van de Europese Unie van 7 maart 2002 inzake de universele dienst en gebruikersrechten met betrekking tot
      elektronische-communicatienetwerken en -diensten (Universeledienstrichtlijn) (PbEG L 108);
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.1
  - number: 1.1.ss
    text: |-
      certificaat: elektronische bevestiging die gegevens voor het verifiëren van een elektronische handtekening met een
      bepaalde persoon verbindt en de identiteit van die persoon bevestigt;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.1
  - number: 1.1.tt
    text: |-
      gekwalificeerd certificaat: certificaat dat voldoet aan de eisen, gesteld krachtens
      [artikel 18.15, tweede lid][ref1], en is afgegeven door een certificatiedienstverlener die voldoet aan de eisen,
      gesteld krachtens [artikel 18.15, eerste lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel18
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '18'
        hoofdstuk: '18'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '18'
        hoofdstuk: '18'
  - number: 1.1.uu
    text: |-
      certificatiedienstverlener: een natuurlijke persoon of rechtspersoon die certificaten afgeeft of andere diensten in
      verband met elektronische handtekeningen verleent;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.1
  - number: 1.1.vv
    text: |-
      middel voor het aanmaken van elektronische handtekeningen: geconfigureerde software of hardware die wordt gebruikt
      om de gegevens voor het aanmaken van elektronische handtekeningen te implementeren;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.1
  - number: 1.1.ww
    text: |-
      veilig middel voor het aanmaken van elektronische handtekeningen: een middel voor het aanmaken van elektronische
      handtekeningen dat voldoet aan de eisen gesteld krachtens [artikel 18.17, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel18
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '18'
        hoofdstuk: '18'
  - number: 1.1.xx
    text: |-
      elektronische handtekening: elektronische handtekening als bedoeld in
      [artikel 15a, vierde lid, van Titel 1, afdeling 1A van Boek 3 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel15a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: 15a
  - number: 1.1.yy
    text: |-
      ondertekenaar: voor de toepassing van deze wet geldt de definitiebepaling van
      [artikel 15a, vijfde lid, van Titel 1, afdeling 1A van Boek 3 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel15a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: 15a
  - number: 1.1.zz
    text: |-
      openbare betaaltelefoon: voor het publiek toegankelijk telefoontoestel waarmee uitgaande gesprekken gevoerd kunnen
      worden en waarvan de betaling voor het gebruik kan geschieden door middel van munten, krediet- of debetkaarten of
      vooruitbetaalde telefoonkaarten;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.1
  - number: 1.1.aaa
    text: |-
      notificatierichtlijn: Richtlijn nr. 98/34/EG van het Europees Parlement en de Raad van de Europese Unie van 22 juni
      1998 betreffende een informatieprocedure op het gebied van normen en technische voorschriften en regels betreffende
      de diensten van de informatiemaatschappij (PbEG L 204);
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.1
  - number: 1.1.bbb
    text: |-
      programmadienst: dienst die geheel of hoofdzakelijk bestaat uit het aanbieden van programma’s aan het algemene
      publiek of een deel daarvan;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.1
  - number: 1.1.ccc
    text: |-
      conformiteitsrichtlijn: richtlijn van het Europees Parlement en de Raad van de Europese Unie, die geheel of
      gedeeltelijk berust op artikel 114 van het Verdrag betreffende de werking van de Europese Unie en regels stelt over
      het op de markt brengen of het gebruik van apparaten;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.1
  - number: 1.1.ddd
    text: 'nummerhouder: degene aan wie de Autoriteit Consument en Markt op aanvraag een nummer heeft toegekend;'
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.1
  - number: 1.1.eee
    text: 'nummergebruiker: degene die een nummer gebruikt;'
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.1
  - number: 1.1.fff
    text: |-
      roamingverordening: op grond van artikel 114 van het Verdrag betreffende de werking van de Europese Unie
      vastgestelde verordening van het Europees Parlement en de Raad van de Europese Unie betreffende roaming op openbare
      mobiele-communicatienetwerken binnen de Unie, en de op grond van die verordening door de Europese Commissie
      vastgestelde uitvoeringshandelingen;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.1
  - number: 1.1.ggg
    text: |-
      bijbehorende diensten: de bij een elektronisch communicatienetwerk of een elektronische communicatiedienst
      behorende diensten die het aanbieden van diensten via dat netwerk of die dienst mogelijk maken of ondersteunen of
      het potentieel hiertoe bezitten;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.1
  - number: 1.1.hhh
    text: |-
      schadelijke interferentie: interferentie die het functioneren van een radionavigatiedienst of van andere
      veiligheidsvoorzieningen in gevaar brengt, of die een overeenkomstig de geldende internationale, communautaire
      of nationale voorschriften werkende radiocommunicatiedienst op een andere wijze ernstig verslechtert, hindert of
      herhaaldelijk onderbreekt;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.1
  - number: 1.1.iii
    text: |-
      BEREC: het orgaan van Europese regelgevende instanties voor elektronische communicatie, opgericht bij Verordening
      (EG) nr. 1211/2009 van het Europees Parlement en de Raad van 25 november 2009 tot oprichting van het Orgaan van
      Europese regelgevende instanties voor elektronische communicatie (BEREC) en het Bureau;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.1
  - number: 1.1.jjj
    text: |-
      Het Bureau: het Bureau als bedoeld in artikel 6 van Verordening (EG) nr. 1211/2009 van het Europees Parlement en
      de Raad van 25 november 2009 tot oprichting van het Orgaan van Europese regelgevende instanties voor elektronische
      communicatie (BEREC) en het Bureau;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.1
  - number: 1.1.kkk
    text: 'ITU: Internationale Unie voor Telecommunicatie.'
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.1
  - number: '1.2'
    text: |-
      De bepalingen vastgesteld bij of krachtens deze wet gelden mede op en met betrekking tot installaties ter zee in de
      zin van de [Wet installaties Noordzee][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002467
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.2
    references:
      - id: ref1
        bwb_id: BWBR0002467
  - number: 1.3.1
    text: |-
      De Autoriteit Consument en Markt draagt er zorg voor dat haar besluiten bijdragen aan het verwezenlijken van de
      doelstellingen als bedoeld in artikel 8, tweede tot en met vijfde lid, van [richtlijn nr. 2002/21/EG](32002L0021)
      in elk geval door:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.3
  - number: 1.3.1.a
    text: |-
      het bevorderen van concurrentie bij het leveren van elektronische communicatienetwerken, elektronische
      communicatiediensten, of bijbehorende faciliteiten, onder meer door efficiënte investeringen op het gebied van
      infrastructuur aan te moedigen en innovaties te steunen;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.3
  - number: 1.3.1.b
    text: de ontwikkeling van de interne markt;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.3
  - number: 1.3.1.c
    text: het bevorderen van belangen van eindgebruikers wat betreft keuze, prijs en kwaliteit.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.3
  - number: 1.3.2
    text: |-
      De Autoriteit Consument en Markt houdt bij de uitoefening van haar taken en bevoegdheden zoveel mogelijk rekening
      met aanbevelingen van de Europese Commissie als bedoeld in artikel 19, eerste lid, van richtlijn nr. 2002/21/EG,
      en met door BEREC gegeven adviezen en gemeenschappelijke standpunten, voor zover die aanbevelingen, adviezen en
      standpunten betrekking hebben op de bij of krachtens deze wet aan de Autoriteit Consument en Markt opgedragen taken
      of verleende bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.3
  - number: 1.3.3
    text: |-
      Indien de Autoriteit Consument en Markt geen toepassing geeft aan een aanbeveling van de Europese Commissie als
      bedoeld in het tweede lid, informeert zij, onder vermelding van de redenen, de Europese Commissie en Onze Minister.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel1.3
  - number: 2.1.1
    text: |-
      Degene die een openbaar elektronisch communicatienetwerk of een openbare elektronische communicatiedienst
      aanbiedt dan wel bijbehorende faciliteiten aanlegt of aanbiedt, met uitzondering van degene die een elektronische
      programmagids aanbiedt, doet daarvan mededeling aan de Autoriteit Consument en Markt.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel2.1
  - number: 2.1.2
    text: |-
      De Autoriteit Consument en Markt stelt vast welke gegevens bij de mededeling aan de Autoriteit Consument en Markt
      worden overgelegd, alsmede de wijze waarop de mededeling wordt gedaan. Die gegevens betreffen in ieder geval
      de naam, het adres, de vestigingsplaats, respectievelijk de woonplaats en een beschrijving van de in het eerste
      lid bedoelde netwerken, diensten of faciliteiten. De Autoriteit Consument en Markt doet hiervan mededeling in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel2.1
  - number: 2.1.3
    text: |-
      De gegevens, bedoeld in het tweede lid, worden slechts verzameld ten behoeve van de goede uitvoering van deze wet
      en zijn beperkt tot hetgeen strikt noodzakelijk is voor het vaststellen van de identiteit en de hoedanigheid van
      degene, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel2.1
  - number: 2.1.4
    text: |-
      De Autoriteit Consument en Markt registreert degene, bedoeld in het eerste lid, na ontvangst van de in dat lid
      bedoelde mededeling en de daarbij behorende gegevens.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel2.1
  - number: 2.1.5
    text: |-
      Voor het aanbieden of afgeven van gekwalificeerde certificaten aan het publiek is een registratie door de
      Autoriteit Consument en Markt vereist van de certificatiedienstverlener die in Nederland een vestiging heeft. Bij
      de aanvraag van een registratie legt de certificatiedienstverlener over:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel2.1
  - number: 2.1.5.a
    text: |-
      documenten, waaruit de overeenstemming met de bij en krachtens [artikel 18.15, eerste en tweede lid][ref1],
      bedoelde eisen blijkt, en


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel18
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '18'
        hoofdstuk: '18'
  - number: 2.1.5.b
    text: |-
      de gegevens waarvoor krachtens [artikel 2.4, vierde lid][ref1], bij ministeriële regeling is bepaald, dat die aan
      de Autoriteit Consument en Markt verstrekt dienen te worden.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel2
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.1.6
    text: |-
      Een certificatiedienstverlener waarvan door een organisatie als bedoeld in [artikel 18.16, eerste lid][ref1], is
      vastgesteld dat wordt voldaan aan de eisen, gesteld bij of krachtens [artikel 18.15, eerste en tweede lid][ref2],
      kan om te voldoen aan het bepaalde krachtens de tweede volzin van het vijfde lid onder a, volstaan met het
      overleggen van een geldig bewijs van die vaststelling.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel18
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '18'
        hoofdstuk: '18'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '18'
        hoofdstuk: '18'
  - number: 2.1.7
    text: |-
      De Autoriteit Consument en Markt is bevoegd te bepalen welke andere gegevens bij de aanvraag van een registratie
      dienen te worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel2.1
  - number: 2.2.1
    text: |-
      De Autoriteit Consument en Markt gaat niet over tot registratie als bedoeld in [artikel 2.1, vierde lid][ref1],
      indien:


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel2
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.2.1.a
    text: |-
      de mededeling geen betrekking heeft op een openbaar elektronisch communicatienetwerk, een openbare elektronische
      communicatiedienst, of bijbehorende faciliteiten, of
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel2.2
  - number: 2.2.1.b
    text: |-
      de op grond van [artikel 2.1, tweede lid][ref1], te overleggen gegevens niet, onvolledig, of niet juist zijn
      verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel2
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.2.2
    text: |-
      De Autoriteit Consument en Markt weigert een registratie als bedoeld in [artikel 2.1, vijfde lid][ref1], indien
      de gevraagde registratie geen betrekking heeft op het aanbieden of afgeven van gekwalificeerde certificaten aan
      het publiek.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel2
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.2.3
    text: |-
      De Autoriteit Consument en Markt kan de registratie van een certificatiedienstverlener weigeren indien de door hem
      op grond van [artikel 2.1, vijfde, zesde of zevende lid][ref1], te overleggen gegevens niet, onvolledig of niet
      juist zijn verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel2
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.2.4
    text: 'De Autoriteit Consument en Markt beëindigt of wijzigt de registratie:'
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel2.2
  - number: 2.2.4.a
    text: indien de grond voor registratie is vervallen;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel2.2
  - number: 2.2.4.b
    text: |-
      indien een certificatiedienstverlener activiteiten of diensten verricht in strijd met het bepaalde bij of krachtens
      deze wet,
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel2.2
  - number: 2.2.4.c
    text: |-
      indien de Autoriteit Consument en Markt heeft vastgesteld dat de certificatiedienstverlener niet of niet geheel
      voldoet aan de eisen bedoeld in [artikel 18.15, eerste en tweede lid][ref1], en de certificatiedienstverlener
      niet binnen de door de Autoriteit Consument en Markt gestelde termijn heeft aangetoond aan deze eisen te voldoen.
      Indien de certificatiedienstverlener aantoont redelijkerwijs niet binnen de gestelde termijn aan de eisen te kunnen
      voldoen, kan de Autoriteit Consument en Markt de termijn verlengen; of


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel18
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '18'
        hoofdstuk: '18'
  - number: 2.2.4.d
    text: |-
      indien de Autoriteit Consument en Markt heeft vastgesteld dat de certificatiedienstverlener de gegevens, bedoeld in
      [artikel 2.1, vijfde lid, onder b][ref1], of wijzigingen daarin niet, onvolledig of niet juist heeft verstrekt, en
      de certificatiedienstverlener niet binnen de door de Autoriteit Consument en Markt gestelde termijn de volledige of
      juiste gegevens alsnog verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel2
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.2.5
    text: |-
      Indien de certificatiedienstverlener aantoont redelijkerwijs niet binnen de gestelde termijn, bedoeld in het vierde
      lid, onder c, aan de eisen, bedoeld in dat onderdeel, te kunnen voldoen, of binnen de gestelde termijn, bedoeld
      in het vierde lid, onder d, alsnog de juiste gegevens, bedoeld in dat onderdeel, te kunnen verstrekken, kan de
      Autoriteit Consument en Markt de termijn verlengen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel2.2
  - number: 2.3.1
    text: |-
      In het belang van de goede uitvoering van deze wet wordt door de Autoriteit Consument en Markt een register van
      de registraties bijgehouden. In het register worden in ieder geval de naam, het adres en de vestigingsplaats,
      respectievelijk de woonplaats van de geregistreerde vermeld.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel2.3
  - number: 2.3.2
    text: |-
      Het register ligt voor eenieder kosteloos ter inzage op een door de Autoriteit Consument en Markt te bepalen
      plaats. De gegevens uit het register zijn kosteloos op elektronische wijze te raadplegen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel2.3
  - number: 2.3.3
    text: 'Bij ministeriële regeling kunnen nadere regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel2.3
  - number: 2.3.3.a
    text: |-
      de door de Autoriteit Consument en Markt in het register te vermelden gegevens anders dan die, bedoeld in het
      eerste lid;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel2.3
  - number: 2.3.3.b
    text: de opzet, structuur en elektronische wijze van raadpleging van het register.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel2.3
  - number: 2.3.4
    text: |-
      Indien de ministeriële regeling, bedoeld in het derde lid, nadere regels stelt over de in het register te vermelden
      gegevens, kan daarbij tevens worden bepaald welke van die gegevens door een certificatiedienstverlener aan de
      Autoriteit Consument en Markt verstrekt dienen te worden tot opname in het register.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel2.3
  - number: 2.3.5
    text: |-
      De geregistreerde geeft aan de Autoriteit Consument en Markt onverwijld alle wijzigingen door die van invloed zijn
      op de registratie of op de in het register opgenomen gegevens die krachtens het vierde lid zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel2.3
  - number: 2.3.6
    text: |-
      De Autoriteit Consument en Markt brengt het register in overeenstemming met de wijzigingen die voortvloeien uit
      [artikel 2.2, vierde lid][ref1], of met de wijzigingen die de Autoriteit Consument en Markt op grond van het vijfde
      lid heeft ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel2
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.3.7
    text: |-
      Onverminderd het zesde lid, kan de Autoriteit Consument en Markt de gegevens met betrekking tot de registratie
      wijzigen indien dit noodzakelijk is om feitelijke onjuistheden van eenvoudige aard weg te nemen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel2.3
  - number: 2.4.1
    text: |-
      De Autoriteit Consument en Markt verstrekt zo spoedig mogelijk na de registratie, bedoeld in
      [artikel 2.1, vierde lid][ref1], aan de desbetreffende geregistreerde een schriftelijke verklaring waaruit blijkt
      dat de mededeling, bedoeld in [artikel 2.1, eerste lid][ref2], aan de Autoriteit Consument en Markt is gedaan.
      Bij de verklaring worden tevens vermeld de geldende wettelijke bepalingen inzake het medegebruik van antenne-
      opstelpunten, antennesystemen of antennes, de gedoogplicht voor de aanleg, instandhouding en opruiming van kabels,
      eind- tot eindverbindingen, alsmede toegang met betrekking tot aanbieders met aanmerkelijke marktmacht.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel2
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.4.2
    text: |-
      De Autoriteit Consument en Markt verstrekt de verklaring, bedoeld in het eerste lid, in afwijking van dat lid,
      binnen een week na ontvangst van een daartoe strekkend schriftelijk verzoek van een geregistreerde als bedoeld in
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel2.4
  - number: '2.5'
    text: |-
      De Autoriteit Consument en Markt is verantwoordelijke in de zin van
      [artikel 1, onderdeel d, van de Wet bescherming persoonsgegevens][ref1] voor de gegevensverzameling, bedoeld in
      [artikel 2.1][ref2] en voor het register, bedoeld in [artikel 2.3][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel2
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '2'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0009950
        artikel: '2'
        hoofdstuk: '2'
  - number: 3.1.1
    text: |-
      Onze Minister stelt na overleg met Onze Minister wie het mede aangaat, een frequentieplan en wijzigingen daarvan
      vast.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.1
  - number: 3.1.2
    text: |-
      Het frequentieplan bevat in ieder geval: a. de bestemmingen van te onderscheiden frequentiebanden, b. de aanwijzing
      van frequentiebanden waarbinnen onder verantwoordelijkheid van Onze Minister wie het mede aangaat bij regeling van
      Onze Minister aan te wijzen publieke taken worden uitgevoerd, c. de aanwijzing van frequentiebanden waarbinnen de
      vergunningen voor het gebruik van frequentieruimte ten behoeve van het verzorgen van taken op het gebied van de
      publieke mediadienst bedoeld in [artikel 1.1 van de Mediawet 2008][ref1], worden verleend zonder toepassing van een
      van de procedures, bedoeld in [artikel 3.10, eerste lid][ref2], d. de aanwijzing van frequentiebanden waarbinnen
      voor bepaalde bestemmingen frequentieruimte al dan niet tezamen met categorieën van radiozendapparaten als bedoeld
      in [artikel 3.9, onder b][ref3], en al dan niet met een meldingsplicht, zonder vergunning mag worden gebruikt, e.
      de aanwijzing van frequentiebanden waarbinnen frequentieruimte voor bepaalde bestemmingen niet zonder vergunning
      mag worden gebruikt, alsmede de aanduiding of vergunningen worden verleend met toepassing van de procedure, bedoeld
      in [artikel 3.10, eerste lid, onder a, onderscheidenlijk b][ref4], dan wel na een nader te maken keuze tussen een
      veiling of vergelijkende toets, f. de aanwijzing van frequentiebanden waarbinnen in bij besluit van Onze Minister
      nader aan te wijzen geografische gebieden frequentieruimte uitsluitend mag worden gebruikt voor het ontvangen
      van signalen, en g. de aanwijzing van frequentiebanden binnen welke voor bepaalde bestemmingen medegebruik kan
      worden opgelegd, met dien verstande dat de aanwijzing, bedoeld in onderdeel e, uitsluitend wordt gedaan voor
      zover dat nodig is om: 1°. te voldoen aan een bindende internationale overeenkomst betreffende het gebruik van
      frequentieruimte; 2°. in die frequentiebanden: – schadelijke interferentie te vermijden, – de technische kwaliteit
      van elektronische communicatienetwerken en -diensten te verzekeren, – een doelmatig gebruik van frequentieruimte te
      waarborgen, of – andere doelstellingen van algemeen belang te vervullen.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.5'
      - id: ref3
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.4'
      - id: ref4
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 3.1.3
    text: |-
      Bij de bestemming en de aanwijzing van frequentiebanden, bedoeld in het tweede lid, onderdelen a en e, kunnen
      ten behoeve van elektronische communicatienetwerken en -diensten in het frequentieplan proportionele en niet-
      discriminerende beperkingen worden opgelegd met betrekking tot de te gebruiken technologie indien dat nodig is om:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.1
  - number: 3.1.3.a
    text: schadelijke interferentie te vermijden;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.1
  - number: 3.1.3.b
    text: de volksgezondheid te beschermen tegen elektromagnetische velden;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.1
  - number: 3.1.3.c
    text: de technische kwaliteit van de dienst te garanderen;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.1
  - number: 3.1.3.d
    text: te zorgen voor zoveel mogelijk gedeeld gebruik van de radiofrequenties;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.1
  - number: 3.1.3.e
    text: een doelmatig gebruik van frequentieruimte te waarborgen;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.1
  - number: 3.1.3.f
    text: een doelstelling van algemeen belang te verwezenlijken;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.1
  - number: 3.1.3.g
    text: te voldoen aan een bindende internationale overeenkomst betreffende het gebruik van frequentieruimte.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.1
  - number: 3.1.4
    text: |-
      Bij de bestemming en de aanwijzing van frequentiebanden, bedoeld in het tweede lid, onderdelen a en e, kunnen
      in het frequentieplan proportionele en niet-discriminerende beperkingen worden opgelegd met betrekking tot de
      soorten elektronische communicatiediensten die worden aangeboden indien dat nodig is om te voldoen aan een bindende
      internationale overeenkomst betreffende het gebruik van frequentieruimte of om een doelstelling van algemeen belang
      te verwezenlijken.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.1
  - number: 3.1.5
    text: |-
      Als een doelstelling van algemeen belang als bedoeld in het derde lid, onderdeel f, en het vierde lid, worden in
      ieder geval aangemerkt:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.1
  - number: 3.1.5.a
    text: de veiligheid van het menselijk leven;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.1
  - number: 3.1.5.b
    text: de bevordering van sociale, regionale of territoriale samenhang;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.1
  - number: 3.1.5.c
    text: het doelmatig gebruik van frequentieruimte;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.1
  - number: 3.1.5.d
    text: het bevorderen van de culturele en taalkundige diversiteit en het pluralisme van de media.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.1
  - number: 3.1.6
    text: |-
      Indien een beperking als bedoeld in het vierde en vijfde lid wordt opgelegd, onderzoekt Onze Minister uiterlijk
      vijf jaar na het opleggen van de beperking, en vervolgens iedere vijf jaar, of de beperking kan worden opgeheven.
      Indien een beperking niet meer nodig is voor de verwezenlijking van een van de in het vierde en vijfde lid genoemde
      doelstellingen, wordt het frequentieplan hierop aangepast.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.1
  - number: 3.1.7
    text: |-
      Onze Minister kan bij ministeriële regeling nadere regels stellen ten aanzien van de inrichting van het
      frequentieplan.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.1
  - number: 3.2.1
    text: |-
      Onze Minister wie het mede aangaat dient al dan niet op verzoek van Onze Minister bij deze een behoefte-
      onderbouwingsplan in, waarin gemotiveerd wordt onderbouwd welke frequentieruimte noodzakelijk is voor de in
      [artikel 3.1, tweede lid, onder b][ref1], bedoelde taken. Het behoefte-onderbouwingsplan wordt telkens na ten
      hoogste drie jaar opnieuw ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 3.2.2
    text: |-
      Onze Minister kan bij ministeriële regeling nadere regels stellen ten aanzien van de inrichting van het behoefte-
      onderbouwingsplan.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.2
  - number: 3.3.1
    text: |-
      Op de voorbereiding van het frequentieplan en wijzigingen daarvan is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing, met dien verstande dat in aanvulling op
      [artikel 3:15, eerste lid, van de Algemene wet bestuursrecht][ref2], ook een gebruiker en een consument zijn
      zienswijze over het ontwerp naar voren kan brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 3.3.2
    text: |-
      Onze Minister stelt geen frequentieplan of een wijziging daarvan vast met betrekking tot de in
      [artikel 3.1, tweede lid, onder b][ref1], bedoelde frequentiebanden zonder dat hij de beschikking heeft over een
      behoefte-onderbouwingsplan, dat niet langer dan een jaar tevoren bij hem is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 3.3.3
    text: |-
      Het eerste en het tweede lid zijn niet van toepassing voor zover de vaststelling van het frequentieplan of de
      wijziging daarvan:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.3
  - number: 3.3.3.a
    text: het gevolg is van een verdrag of een besluit van een volkenrechtelijke organisatie, of
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.3
  - number: 3.3.3.b
    text: noodzakelijk is voor de implementatie van een besluit van een instelling van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.3
  - number: 3.3.4
    text: |-
      Het eerste en tweede lid is voorts niet van toepassing voor zover het frequentieplan of de wijziging daarvan
      betrekking heeft op wijzigingen van ondergeschikte aard.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.3
  - number: 3.3.5
    text: |-
      Het tweede lid is voorts niet van toepassing indien Onze Minister een verzoek heeft gedaan aan Onze Minister wie
      het mede aangaat om binnen drie maanden bij hem een behoefte-onderbouwingsplan in te dienen en aan die uitnodiging
      geen gevolg is gegeven.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.3
  - number: 3.4.1
    text: Onze Minister houdt een openbaar frequentieregister.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.4
  - number: 3.4.2
    text: 'Het frequentieregister geeft aan hoeveel frequentieruimte nog beschikbaar is. Daartoe bevat het frequentieregister:'
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.4
  - number: 3.4.2.a
    text: |-
      een opgave van de nog beschikbare frequentieruimte in de frequentiebanden waarbinnen reeds vergunningen zijn
      verleend met toepassing van de procedure, bedoeld in [artikel 3.10, eerste lid, onder a][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 3.4.2.b
    text: 'een opgave van:'
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.4
  - number: 3.4.2.b.1°
    text: |-
      de op grond van [artikel 3.5][ref1] toegewezen frequentieruimte voor publieke taken;


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.4.2.b.2°
    text: |-
      de vergunningen voor het gebruik van de frequentieruimte, bedoeld in [artikel 3.6, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.4.2.b.3°
    text: |-
      de vergunningen voor het gebruik van de frequentieruimte die is verdeeld met toepassing van een van de procedures,
      bedoeld in [artikel 3.10, eerste lid, onder b tot en met f][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 3.4.2.c
    text: gegevens met betrekking tot de periode gedurende welke de onder b bedoelde frequentieruimte in gebruik is, en
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.4
  - number: 3.4.2.d
    text: de voorschriften en beperkingen die zijn gesteld aan het gebruik van de onder a en b bedoelde frequentieruimte.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.4
  - number: 3.4.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan worden bepaald dat andere gegevens dan de in het tweede
      lid bedoelde gegevens in het frequentieregister worden opgenomen, of dat bepaalde gegevens niet in het register
      worden opgenomen, indien opneming daarvan de veiligheid van de staat zou kunnen schaden, dan wel de opsporing en
      vervolging van strafbare feiten zou kunnen bemoeilijken.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.4
  - number: '3.5'
    text: |-
      Onze Minister wijst in overeenstemming met het frequentieplan uit de aangewezen frequentiebanden, bedoeld in
      [artikel 3.1, tweede lid, onder b][ref1], frequentieruimte voor publieke taken slechts toe aan Onze Minister
      wie het mede aangaat voor zover Onze Minister van oordeel is dat de frequentieruimte, waarop het behoefte-
      onderbouwingsplan, bedoeld in [artikel 3.2][ref2], betrekking heeft, noodzakelijk is voor de betrokken publieke
      taak. Onze Minister kan aan de toewijzing voorschriften en beperkingen verbinden.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 3.5a.1
    text: |-
      In afwijking van [artikel 3.5][ref1] kan Onze Minister, op verzoek van Onze Minister wie het mede aangaat, voor
      korte duur frequentieruimte voor publieke taken toewijzen aan Onze Minister wie het mede aangaat, indien hij
      van oordeel is dat de toewijzing van de desbetreffende frequentieruimte onverwijld nodig en doelmatig is voor de
      uitoefening van de betrokken publieke taak.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.5a
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.5a.2
    text: |-
      [Artikel 3.2][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.5a
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 3.5a.3
    text: Onze Minister kan aan de toewijzing voorschriften en beperkingen verbinden.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.5a
  - number: 3.5b.1
    text: |-
      In afwijking van [artikel 3.5][ref1] kan Onze Minister, vooruitlopend op de ontvangst van een behoefte-
      onderbouwingsplan, op verzoek van Onze Minister wie het mede aangaat, frequentieruimte voor publieke taken
      voorlopig toewijzen aan Onze Minister wie het mede aangaat, indien hij van oordeel is dat de voorlopige toewijzing
      van de frequentieruimte onverwijld nodig is voor de uitoefening van de betrokken publieke taak.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.5b
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.5b.2
    text: |-
      Onze Minister wie het mede aangaat dient binnen zes weken na ontvangst van het verzoek door Onze Minister een
      behoefte-onderbouwingsplan in voor de desbetreffende frequentieruimte.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.5b
  - number: 3.5b.3
    text: |-
      Indien niet binnen de in het tweede lid bedoelde termijn een behoefte-onderbouwingsplan is ontvangen, vervalt de
      voorlopige toewijzing.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.5b
  - number: 3.5b.4
    text: |-
      Indien onze minister wie het mede aangaat een behoefte-onderbouwingsplan heeft ingediend is de voorlopige
      toewijzing van kracht tot het moment waarop door Onze Minister is beslist over een definitieve toewijzing.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.5b
  - number: 3.5b.5
    text: Onze Minister kan aan de voorlopige toewijzing voorschriften en beperkingen verbinden.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.5b
  - number: 3.6.1
    text: |-
      Ten behoeve van de verzorging van de landelijke, regionale en lokale publieke mediadienst verleent Onze Minister,
      binnen de in [artikel 3.1, tweede lid, onder c][ref1], bedoelde frequentiebanden, op aanvraag de vergunningen,
      bedoeld in de [artikelen 3.7][ref2] en [3.8][ref3], ten behoeve van het uitzenden van programmakanalen als bedoeld
      in [artikel 1.1 van de Mediawet 2008][ref4]. De vergunning wordt verleend aan:


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0025028#Artikel1
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref3
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref4
        bwb_id: BWBR0025028
        artikel: '1'
  - number: 3.6.1.a
    text: indien het de landelijke publieke mediadienst betreft, de Stichting Nederlandse Publieke Omroep, en
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.6
  - number: 3.6.1.b
    text: |-
      indien het de regionale of lokale publieke mediadienst betreft, aan de instelling die op grond van
      [hoofdstuk 2, titel 2.3, van de Mediawet 2008][ref1] is aangewezen voor de verzorging van die regionale,
      onderscheidenlijk lokale publieke mediadienst.


      [ref1]: https://wetten.overheid.nl/BWBR0025028
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0025028
  - number: 3.6.2
    text: |-
      De vergunningen worden verleend zonder toepassing van een van de procedures, bedoeld in
      [artikel 3.10, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 3.6.3
    text: |-
      In het belang van een doelmatig gebruik van frequentieruimte, kan Onze Minister, in afwijking van het eerste lid,
      besluiten dat een krachtens de [artikelen 3.7][ref1] of [3.8][ref2] verleende vergunning mede wordt verleend ten
      behoeve van het uitzenden van programmakanalen van een andere publieke media-instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.7.1
    text: |-
      Bij het verlenen van vergunningen voor het gebruik van frequentieruimte op het terrein van de publieke mediadienst,
      bedoeld in [artikel 1.1 van de Mediawet 2008][ref1], wordt het navolgende in acht genomen:


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel1
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '1'
  - number: 3.7.1.a
    text: |-
      voor de algemene programmakanalen van de landelijke publieke mediadienst, bedoeld in
      [artikel 2.50 van de Mediawet 2008][ref1], wordt ten minste één vergunning verleend op zodanige wijze, dat, voor
      zover dat technisch mogelijk is, een landelijk bereik mogelijk is;


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
  - number: 3.7.1.b
    text: |-
      voor iedere provincie wordt aan de media-instelling die voor de desbetreffende provincie op grond van
      [hoofdstuk 2, titel 2.3, van de Mediawet 2008][ref1] is aangewezen voor de verzorging van de regionale publieke
      mediadienst voor ten minste één omroepnet voor radio, een vergunning verleend op zodanige wijze, dat, voor zover
      dat technisch mogelijk is, een provinciaal bereik mogelijk is;


      [ref1]: https://wetten.overheid.nl/BWBR0025028
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0025028
  - number: 3.7.1.c
    text: |-
      indien in een provincie twee of meer regionale publieke media-instellingen op grond van
      [hoofdstuk 2, titel 2.3, van de Mediawet 2008][ref1] zijn aangewezen zal, voor zover dat technisch mogelijk is,
      aan elk van die media-instellingen vergunning worden verleend voor een bereik dat ten minste gelijk is aan de
      onderscheidene verzorgingsgebieden;


      [ref1]: https://wetten.overheid.nl/BWBR0025028
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0025028
  - number: 3.7.1.d
    text: |-
      aan iedere lokale publieke media-instelling die op grond van [hoofdstuk 2, titel 2.3, van de Mediawet 2008][ref1]
      is aangewezen, zal, voor zover dat technisch mogelijk is, en een doelmatig gebruik van frequentieruimte zich
      daartegen niet verzet voor ten minste één omroepnet voor radio vergunning worden verleend voor een bereik dat ten
      minste gelijk is aan het verzorgingsgebied.


      [ref1]: https://wetten.overheid.nl/BWBR0025028
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0025028
  - number: 3.7.2
    text: |-
      Indien toepassing wordt gegeven aan [artikel 3.6, derde lid][ref1], kan de vergunning, bedoeld in het eerste
      lid, aan een andere publieke media-instelling dan de in het eerste lid bedoelde publieke media instelling worden
      verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: '3.8'
    text: |-
      Voor zover een vergunning niet krachtens [artikel 3.7][ref1] dient te worden verleend, kan Onze Minister
      in overeenstemming met Onze Minister van Onderwijs, Cultuur en Wetenschap bij ministeriële regeling regels
      vaststellen met betrekking tot de verlening van extra vergunningen voor het gebruik van frequentieruimte in
      de frequentiebanden, bedoeld in [artikel 3.1, tweede lid, onder c][ref2], ten behoeve van het uitzenden van
      programmakanalen door een landelijke, regionale of lokale publieke media-instelling boven de aantallen, bedoeld in
      artikel 3.7.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 3.8a.1
    text: 'Onze Minister verleent ambtshalve een transitievergunning:'
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.8a
  - number: 3.8a.1.a
    text: aan de houder van een vergunning voor het gebruik van frequentieruimte die wordt herverdeeld, en
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.8a
  - number: 3.8a.1.b
    text: aan degene die bij de herverdeling de nieuwe vergunning voor deze frequentieruimte verwerft.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.8a
  - number: 3.8a.2
    text: |-
      De transitievergunning heeft een looptijd van ten hoogste vier weken, die aanvangt de dag nadat de vergunning
      bedoeld in het eerste lid, onder a, afloopt. Indien dit nodig is om te voorkomen dat de continuïteit van de via
      de vergunde frequentieruimte verleende diensten in gevaar kan komen kan de looptijd van de transitievergunning
      worden verlengd met vier weken. De vergunning bedoeld in het eerste lid, onder b, vangt aan op de dag nadat de
      transitievergunning afloopt.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.8a
  - number: 3.8a.3
    text: |-
      Indien dat naar zijn oordeel in het belang is van de continuïteit van de via de vergunde frequentieruimte verleende
      diensten, legt Onze Minister een partij, bedoeld in het eerste lid, de verplichting op om met andere partijen,
      bedoeld in het eerste lid, een transitieovereenkomst te sluiten. Onze Minister kan deze partijen in het belang
      van de continuïteit van dienstverlening aanvullende of andere verplichtingen opleggen. Eventuele met de in dit lid
      bedoelde verplichtingen verbonden kosten komen voor rekening van de partij op wie de verplichting rust.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.8a
  - number: 3.8a.4
    text: |-
      Onze Minister kan aan de transitievergunning voorschriften en beperkingen verbinden, waaronder het voorschrift
      uitsluitend frequentieruimte te gebruiken in overeenstemming met de afspraken in de transitieovereenkomst bedoeld
      in het derde lid.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.8a
  - number: 3.8a.5
    text: |-
      [Artikel 3.15][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.8a
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: 3.8a.6
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot het eerste
      tot en met vijfde lid.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.8a
  - number: 3.8a.7
    text: |-
      Het eerste tot en met zesde lid is niet van toepassing op vergunningen voor het gebruik van frequentieruimte door
      of ten behoeve van commerciële media-instellingen als bedoeld in [artikel 1.1 van de Mediawet 2008][ref1]. Bij
      ministeriële regeling kan andere frequentieruimte worden aangewezen waarop het eerste tot en met zesde lid niet van
      toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel1
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.8a
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '1'
  - number: '3.9'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot frequentieruimte
      voor het gebruik waarvan geen vergunning is vereist. Deze regels kunnen betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.9
  - number: 3.9.a
    text: het gebruik van de frequentieruimte,
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.9
  - number: 3.9.b
    text: |-
      eisen waaraan bij die regels aan te wijzen categorieën van radiozendapparaten voor bepaalde bestemmingen moeten
      voldoen,
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.9
  - number: 3.9.c
    text: eisen voor gebruikers van frequentieruimte,
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.9
  - number: 3.9.d
    text: een meldingsplicht voor gebruikers, en
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.9
  - number: 3.9.e
    text: de gegevens die aan Onze Minister moeten worden overgelegd alvorens frequentieruimte in gebruik mag worden genomen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.9
  - number: 3.10.1
    text: |-
      De verlening van vergunningen door Onze Minister in andere gevallen dan bedoeld in de [artikelen 3.6][ref1] en
      [3.8a][ref2] geschiedt met toepassing van een van de volgende procedures:


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3a
  - number: 3.10.1.a
    text: op volgorde van binnenkomst van de aanvragen,
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.10
  - number: 3.10.1.b
    text: |-
      op volgorde van binnenkomst van de aanvragen dan wel door middel van een veiling, afhankelijk van het aantal
      aanvragen dat voor bepaalde frequentieruimte is ingediend,
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.10
  - number: 3.10.1.c
    text: door middel van een vergelijkende toets zonder een financieel bod,
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.10
  - number: 3.10.1.d
    text: door middel van een vergelijkende toets met inbegrip van een financieel bod,
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.10
  - number: 3.10.1.e
    text: door middel van een vergelijkende toets, zo nodig gevolgd door een veiling,
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.10
  - number: 3.10.1.f
    text: door middel van een veiling.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.10
  - number: 3.10.2
    text: |-
      De procedures, bedoeld in het eerste lid, onder c tot en met f, worden niet toegepast indien het redelijkerwijs te
      verwachten is dat de voor verdeling beschikbare frequentieruimte voldoende is om aan de vraag te voldoen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.10
  - number: 3.10.3
    text: |-
      Onze Minister neemt, gelet op het belang van een optimale verdeling van frequentieruimte, een besluit omtrent de
      keuze en het tijdstip van aanvang van een van de procedures, bedoeld in het eerste lid, onder c tot en met f..
      Voor zover dat op dat moment reeds mogelijk is, stelt hij bij dat besluit tevens de voorschriften en beperkingen
      vast die aan de vergunning zullen worden verbonden. Onze Minister kan daarbij voorts, met inachtneming van het
      frequentieplan, nader de bestemming vaststellen van de frequentieruimte waarop de keuze betrekking heeft. Op de
      voorbereiding van het besluit is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing. Hij stelt
      beide Kamers der Staten-Generaal in kennis van het ontwerp van het besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 3.10.4
    text: |-
      Voor zover het de verlening van vergunningen voor het gebruik van frequentieruimte door of ten behoeve van
      commerciële media-instellingen als bedoeld in [artikel 1.1 van de Mediawet 2008][ref1] betreft, geschiedt de in het
      derde lid bedoelde keuze in overeenstemming met Onze Minister van Onderwijs, Cultuur en Wetenschap.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel1
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '1'
  - number: 3.10.5
    text: |-
      Voor zover de in het derde lid bedoelde keuze betrekking heeft op het al dan niet toepassen van een financieel
      bod bij de toepassing van de vergelijkende toets, geschiedt deze tevens in overeenstemming met Onze Minister van
      Financiën.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.10
  - number: 3.10.6
    text: |-
      Na de ontvangst van een aanvraag om een vergunning die wordt verleend met toepassing van een van de procedures,
      bedoeld in het eerste lid, onder c tot en met f, neemt Onze Minister:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.10
  - number: 3.10.6.a
    text: binnen 20 weken een besluit als bedoeld in het derde lid, en
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.10
  - number: 3.10.6.b
    text: binnen 40 weken een besluit omtrent de verlening van een vergunning.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.10
  - number: 3.10.7
    text: |-
      Het zesde lid is niet van toepassing indien de naleving van een verdrag of een besluit van een volkenrechtelijke
      organisatie betreffende het gebruik van radiofrequenties of posities in de ruimte het nemen van een besluit binnen
      genoemde termijnen verhindert.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.10
  - number: 3.10.8
    text: |-
      [Artikel 3.18][ref1] is van overeenkomstige toepassing op een besluit als bedoeld in het zesde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: 3.11.1
    text: |-
      Indien vergunningen worden verleend met toepassing van een van de procedures, bedoeld in
      [artikel 3.10, eerste lid, onder b tot en met f][ref1], kan, tenzij [artikel 6.24 van de Mediawet 2008][ref2] van
      toepassing is, bij ministeriële regeling, in het belang van een optimale verdeling dan wel een doelmatig gebruik
      van schaarse frequentieruimte, de maximale hoeveelheid frequentieruimte worden vastgesteld die een natuurlijk
      persoon of een rechtspersoon in de desbetreffende procedure kan verwerven, hetzij louter in die procedure, hetzij
      tezamen met de hoeveelheid frequentieruimte waarover die natuurlijke persoon of die rechtspersoon reeds voor de
      vergunningverlening beschikt. Bij de ministeriële regeling, bedoeld in de eerste volzin, kan worden bepaald voor
      welke periode de maximale hoeveelheid frequentieruimte van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel6
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.11
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.5'
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '6'
  - number: 3.11.2
    text: |-
      Indien een natuurlijke persoon of rechtspersoon deel uitmaakt van een groep als bedoeld in
      [artikel 24b van boek 2 van het Burgerlijk Wetboek][ref1] waartoe een andere rechtspersoon of vennootschap behoort
      die een vergunning heeft of verwerft met betrekking tot frequentieruimte waarvoor een maximum is vastgesteld, wordt
      bij de toepassing van het eerste lid ook die vergunning in aanmerking genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.11
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
  - number: 3.12.1
    text: 'Onze Minister kan op aanvraag vergunning verlenen voor het gebruik van frequentieruimte:'
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.12
  - number: 3.12.1.a
    text: ten behoeve van het doen van experimenten met een looptijd van ten hoogste één jaar,
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.12
  - number: 3.12.1.b
    text: ten behoeve van evenementen voor de duur van het evenement, of
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.12
  - number: 3.12.1.c
    text: ten behoeve van testdoeleinden.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.12
  - number: 3.12.2
    text: |-
      Een vergunning als bedoeld in het eerste lid, wordt niet gebruikt voor het aanbieden van openbare elektronische
      communicatiediensten.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.12
  - number: 3.12.3
    text: |-
      Bij de vergunningverlening kan worden afgeweken van het bepaalde in de [artikelen 3.13, tweede lid][ref1], en
      [3.18, eerste lid, onder a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.12
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.6'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: 3.12.4
    text: |-
      Vergunningen als bedoeld in het eerste lid, worden verleend volgens de procedure, bedoeld in
      [artikel 3.10, eerste lid, onder a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.12
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 3.13.1
    text: |-
      Voor het gebruik van andere frequentieruimte dan die welke in het frequentieplan is aangewezen als
      frequentieruimte waarvan het gebruik zonder vergunning is toegestaan, dan wel die op grond van de
      [artikelen 3.5 tot en met 3.5b][ref1] is toegewezen, is een vergunning vereist van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.13.2
    text: Vergunningen worden slechts verleend in overeenstemming met het frequentieplan.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.13
  - number: 3.14.1
    text: |-
      In het belang van een optimale verdeling en een doelmatig gebruik van frequentieruimte kan een vergunning onder
      beperkingen worden verleend en kunnen er voorschriften aan worden verbonden.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.14
  - number: 3.14.2
    text: |-
      Onverminderd het eerste lid kan aan een vergunning voor het gebruik van frequentieruimte ten behoeve van
      elektronische communicatienetwerken en- diensten het voorschrift worden verbonden dat de frequentieruimte waarop de
      vergunning betrekking heeft, moet worden gebruikt voor de verzorging van bij de vergunning aan te wijzen diensten,
      voor zover dat nodig is voor de verwezenlijking van een doelstelling van algemeen belang. In dat geval kunnen
      de in het eerste lid bedoelde beperkingen en voorschriften tevens betrekking hebben op het belang van een goede
      dienstverlening.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.14
  - number: 3.14.3
    text: 'Als redenen van algemeen belang als bedoeld in het tweede lid, worden in ieder geval aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.14
  - number: 3.14.3.a
    text: de veiligheid van het menselijk leven;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.14
  - number: 3.14.3.b
    text: het bevorderen van de sociale, regionale of territoriale samenhang;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.14
  - number: 3.14.3.c
    text: het doelmatig gebruik van frequentieruimte;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.14
  - number: 3.14.3.d
    text: de bevordering van culturele en taalkundige diversiteit en pluralisme van de media.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.14
  - number: 3.14.4
    text: |-
      Onverminderd het eerste lid kan aan een vergunning het voorschrift worden verbonden dat de frequentieruimte
      waarop de vergunning betrekking heeft moet worden gebruikt voor de toepassing van bij de vergunning aan te wijzen
      technologieën, indien dat nodig is om:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.14
  - number: 3.14.4.a
    text: schadelijke interferentie te vermijden;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.14
  - number: 3.14.4.b
    text: de volksgezondheid te beschermen tegen elektromagnetische velden;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.14
  - number: 3.14.4.c
    text: de technische kwaliteit van de dienst te garanderen;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.14
  - number: 3.14.4.d
    text: te zorgen voor zoveel mogelijk gedeeld gebruik van de radiofrequenties;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.14
  - number: 3.14.4.e
    text: een doelmatige gebruik van frequentieruimte te waarborgen;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.14
  - number: 3.14.4.f
    text: een doelstelling van algemeen belang zoals bedoeld in het derde lid, te verwezenlijken.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.14
  - number: 3.14.5
    text: |-
      Indien een voorschrift als bedoeld in het tweede en vierde lid wordt opgelegd, onderzoekt Onze Minister uiterlijk
      vijf jaar nadat het voorschrift aan de vergunning is verbonden, en vervolgens iedere vijf jaar, of het voorschrift
      kan worden geschrapt. Indien een voorschrift niet meer nodig is voor de verwezenlijking van een van de in het
      tweede en vierde lid genoemde doelstellingen, wordt de vergunning hierop aangepast.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.14
  - number: 3.15.1
    text: |-
      Teneinde een optimaal gebruik van frequentieruimte te waarborgen kan Onze Minister, in overeenstemming met Onze
      Minister van Financiën, bij ministeriële regeling bepalen dat de houder van een vergunning een bedrag verschuldigd
      is voor het gebruik van de frequentieruimte waarop de vergunning betrekking heeft,
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.15
  - number: 3.15.1.a
    text: bij de verlening van de vergunning,
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.15
  - number: 3.15.1.b
    text: bij een verlenging van de vergunning,
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.15
  - number: 3.15.1.c
    text: bij een wijziging van de vergunning,
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.15
  - number: 3.15.1.d
    text: bij een verruiming van de gebruiksmogelijkheden van de vergunning.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.15
  - number: 3.15.2
    text: |-
      In de in het eerste lid bedoelde ministeriële regeling wordt de hoogte van het te betalen bedrag gerelateerd
      aan de economische waarde van de gedurende de looptijd van de vergunning uit het gebruik van de desbetreffende
      frequentieruimte te verwachten voordelen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.15
  - number: 3.16.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de verlening en
      wijziging van vergunningen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.16
  - number: 3.16.2
    text: 'De in het eerste lid bedoelde regels kunnen betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.16
  - number: 3.16.2.a
    text: de eisen die aan een aanvrager worden gesteld om in aanmerking te komen voor een vergunning,
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.16
  - number: 3.16.2.b
    text: |-
      het door Onze Minister uitsluiten van een of meer aanbieders van elektronische communicatienetwerken of
      elektronische communicatiediensten van deelname of verdere deelname aan een van de procedures, bedoeld in
      [artikel 3.10, eerste lid, onder b tot en met f][ref1], indien dat met het oog op de totstandbrenging of
      instandhouding van daadwerkelijke mededinging noodzakelijk is, of indien zij reeds over de maximale hoeveelheid
      frequentieruimte beschikken die met toepassing van [artikel 3.11][ref2] is vastgesteld,


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.16
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.5'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 3.16.2.c
    text: |-
      de toepassing en uitvoering van de procedures, bedoeld in [artikel 3.10, eerste lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.16
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 3.16.2.d
    text: |-
      de criteria die worden toegepast bij een vergelijkende toets als bedoeld in
      [artikel 3.10, eerste lid, onder c tot en met e][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.16
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 3.16.2.e
    text: |-
      de beperkingen waaronder een vergunning kan worden verleend en de voorschriften die aan een vergunning kunnen
      worden verbonden.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.16
  - number: 3.16.3
    text: |-
      Indien een vergunning wordt verleend met toepassing van een van de procedures, bedoeld in
      [artikel 3.10, eerste lid, onder b tot en met f][ref1], wordt een voornemen om een vergunning onder beperkingen
      te verlenen en een voornemen om aan een vergunning voorschriften te verbinden, op passende wijze bekendgemaakt.
      Belanghebbenden, gebruikers en consumenten kunnen tot vier weken na bekendmaking van een voornemen hun zienswijze
      over het voornemen naar voren brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.16
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 3.17.1
    text: |-
      Vergunningen worden verleend voor een bij die vergunning te bepalen termijn die gerelateerd is aan de betrokken
      dienstverlening, het met de vergunningverlening nagestreefde doel en die rekening houdt met een passende periode
      die nodig is voor de afschrijving van investeringen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.17
  - number: 3.17.2
    text: |-
      Een vergunning die is verleend met toepassing van de procedure, bedoeld in
      [artikel 3.10, eerste lid, onder a][ref1], wordt na afloop van de in het eerste lid bedoelde termijn van rechtswege
      telkens voor een bij of krachtens algemene maatregel van bestuur te bepalen periode verlengd, tenzij:


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 3.17.2.a
    text: |-
      Onze Minister uiterlijk twee jaar voor het tijdstip waarop de periode waarvoor de vergunning is verleend,
      onderscheidenlijk is verlengd, is verstreken, besluit dat de vergunning niet wordt verlengd, of
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.17
  - number: 3.17.2.b
    text: de vergunning is verleend voor een bij ministeriële regeling aangewezen gebruik of bij die regeling bepaalde duur.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.17
  - number: 3.17.3
    text: |-
      In afwijking van het bepaalde in het tweede lid, onder b, kan Onze Minister een daar bedoelde vergunning verlengen
      met een door hem te bepalen termijn.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.17
  - number: 3.17.4
    text: |-
      Andere vergunningen dan die, welke zijn verleend met toepassing van de procedure, bedoeld in
      [artikel 3.10, eerste lid, onder a][ref1], worden door Onze Minister slechts verlengd voor zover daartoe bij of
      krachtens algemene maatregel van bestuur regels zijn gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 3.17.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot het
      verlengen van vergunningen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.17
  - number: 3.18.1
    text: 'Een vergunning wordt door Onze Minister geweigerd voor zover:'
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.18
  - number: 3.18.1.a
    text: verlening daarvan in strijd is met het frequentieplan,
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.18
  - number: 3.18.1.b
    text: een doelmatig gebruik van frequentieruimte dit vordert,
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.18
  - number: 3.18.1.c
    text: |-
      reeds een vergunning voor het gebruik van de in de aanvraag gevraagde frequentieruimte is verleend, tenzij gedeeld
      gebruik van frequentieruimte mogelijk is,
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.18
  - number: 3.18.1.d
    text: |-
      deze is gevraagd voor het verspreiden van programma-aanbod ter uitvoering van de publieke mediaopdracht, bedoeld
      in [artikel 2.1 van de Mediawet 2008][ref1], en de vergunning zal worden verleend op één van de wijzen als bedoeld
      in [artikel 3.10][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.18
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 3.18.1.e
    text: |-
      feiten of omstandigheden er naar het oordeel van Onze Minister op duiden dat de veiligheid van de staat of de
      openbare orde door het verlenen van de vergunning in gevaar kan worden gebracht, of
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.18
  - number: 3.18.1.f
    text: |-
      verlening daarvan in strijd zou zijn met de bij of krachtens deze wet, dan wel bij of krachtens de
      [artikelen 6.23][ref1] of [6.24 van de Mediawet 2008][ref2], gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel6
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.18
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '6'
  - number: 3.18.2
    text: 'Een vergunning kan door Onze Minister worden geweigerd voor zover:'
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.18
  - number: 3.18.2.a
    text: |-
      een eerder verleende vergunning is ingetrokken wegens overtreding van bij of krachtens deze wet gestelde regels dan
      wel van de aan de vergunning verbonden voorschriften en beperkingen,
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.18
  - number: 3.18.2.b
    text: |-
      de aanvrager niet heeft voldaan aan op hem rustende verplichtingen, voortvloeiend uit een eerder aan hem verleende
      vergunning,
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.18
  - number: 3.18.2.c
    text: |-
      door het verlenen van de vergunning aan de aanvrager de daadwerkelijke mededinging op de relevante markt in
      aanzienlijke mate zou worden beperkt, met dien verstande dat naar redelijkheid rekening wordt gehouden met
      gerechtvaardigde belangen bij het gebruik van nieuwe technologie, of
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.18
  - number: 3.18.2.d
    text: |-
      de vrees is gewettigd dat door het gewenste signaal van de gebruikte radiozendapparaten ontoelaatbare belemmeringen
      worden veroorzaakt in andere radiozendapparaten, ontvanginrichtingen of elektrische of elektronische inrichtingen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.18
  - number: 3.19.1
    text: 'Een vergunning wordt door Onze Minister ingetrokken indien:'
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.19
  - number: 3.19.1.a
    text: de houder van de vergunning hierom verzoekt, of
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.19
  - number: 3.19.1.b
    text: |-
      de naleving van een bindend besluit van een instelling van de Europese Unie of de nakoming van Nederland bindende
      verdragen en besluiten van volkenrechtelijke organisaties dit vordert.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.19
  - number: 3.19.2
    text: 'Een vergunning kan door Onze Minister worden ingetrokken indien:'
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.19
  - number: 3.19.2.a
    text: |-
      de houder van de vergunning niet meer voldoet aan de aan hem gestelde eisen om in aanmerking te komen voor een
      vergunning,
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.19
  - number: 3.19.2.b
    text: |-
      de houder van de vergunning de bij of krachtens deze wet, dan wel bij of krachtens de [artikelen 6.10][ref1],
      [6.11][ref2], [6.23][ref3] of [6.24 van de Mediawet 2008][ref4] gestelde regels dan wel de aan de vergunning
      verbonden voorschriften en beperkingen niet nakomt,


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0025028#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0025028#Artikel6
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.19
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0025028
        artikel: '6'
      - id: ref4
        bwb_id: BWBR0025028
        artikel: '6'
  - number: 3.19.2.c
    text: een doelmatig gebruik van frequentieruimte dit vordert,
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.19
  - number: 3.19.2.d
    text: |-
      de vrees gewettigd is dat het van kracht blijven van de vergunning ernstig gevaar zal opleveren voor de veiligheid
      van de staat of de openbare orde,
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.19
  - number: 3.19.2.e
    text: de gronden waarop de vergunning is verleend zijn vervallen,
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.19
  - number: 3.19.2.f
    text: |-
      de instandhouding van de vergunning de daadwerkelijke mededinging op de relevante markt in aanzienlijke mate zou
      beperken,
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.19
  - number: 3.19.2.g
    text: |-
      de houder van de vergunning gedurende de periode, bedoeld in [artikel 3.11][ref1] meer frequentieruimte verwerft
      dan de maximale hoeveelheid die met toepassing van artikel 3.11 voor die periode is vastgesteld, of


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.19
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 3.19.2.h
    text: |-
      de vrees is gewettigd dat door het gewenste signaal van de gebruikte radiozendapparaten ontoelaatbare belemmeringen
      worden veroorzaakt in andere radiozendapparaten, ontvanginrichtingen of elektrische of elektronische inrichtingen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.19
  - number: 3.19.3
    text: |-
      Op de gronden, genoemd in het eerste en tweede lid, kan Onze Minister in plaats van de vergunning intrekken deze
      ook wijzigen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.19
  - number: 3.19a.1
    text: |-
      Indien een van de gronden, bedoeld in [artikel 3.19, tweede lid][ref1], van toepassing is, kan Onze Minister in
      plaats van intrekken of wijzigen van een vergunning, de houder van een vergunning verplichten om die vergunning
      overeenkomstig de in het zevende lid, onderdeel a, bedoelde procedure binnen een bij ministeriële regeling te
      bepalen termijn geheel of gedeeltelijk over te dragen aan een natuurlijke of rechtspersoon die een toestemming
      heeft verkregen van Onze Minister. De houder van de vergunning deelt Onze Minister binnen zeven dagen na afloop van
      de in de eerste volzin bedoelde periode mede aan wie de vergunning is overgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.19a
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: 3.19a.2
    text: |-
      Indien na afloop van de in het eerste lid, bedoelde periode overdracht van de vergunning uitblijft, neemt Onze
      Minister de in het zevende lid, onderdeel a, bedoelde procedure tot overdracht ter hand en draagt Onze Minister
      die vergunning geheel of gedeeltelijk over aan de natuurlijke of rechtspersoon die overeenkomstig die bedoelde
      procedure, de hoogste prijs of de minimumprijs heeft geboden voor die vergunning. In het geval meerdere natuurlijke
      of rechtspersonen de hoogste of de minimumprijs hebben geboden, wordt door middel van loting bepaald aan wie van
      die personen de vergunning wordt overgedragen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.19a
  - number: 3.19a.3
    text: |-
      Aan de in het zevende lid, onderdeel a, bedoelde procedure kunnen uitsluitend natuurlijke of rechtspersonen
      deelnemen die op grond van het bepaalde op grond van het zevende lid, onderdeel b, een toestemming als bedoeld in
      het eerste lid, hebben verkregen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.19a
  - number: 3.19a.4
    text: |-
      [Artikel 3.20, tweede tot en met zesde lid][ref1], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.19a
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: 3.19a.5
    text: |-
      De houder van een vergunning aan wie Onze minister kenbaar heeft gemaakt dat hij voornemens is om de in het eerste
      lid, bedoelde verplichting op te leggen, kan uiterlijk binnen een bij ministeriële regeling gestelde periode na de
      datum van kennisgeving van het ontwerpbesluit verzoeken om:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.19a
  - number: 3.19a.5.a
    text: |-
      intrekking van de vergunning op grond van [artikel 3.19, eerste lid, onderdeel a][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.19a
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: 3.19a.5.b
    text: |-
      wijziging van de vergunning op grond van [artikel 3.19, derde lid][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.19a
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: 3.19a.5.c
    text: |-
      toestemming voor overdracht op grond van [artikel 3.20, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.19a
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: 3.19a.6
    text: |-
      Gedurende de procedure, bedoeld in het zevende lid, onderdeel a, en gedurende acht weken na het tijdstip waarop
      de procedure is afgerond, zijn [artikel 3:19, eerste lid, aanhef en onderdeel a, tweede en derde lid][ref1], en
      [artikel 3.20, eerste lid, eerste volzin][ref2], niet van toepassing op de vergunning waarop het ontwerpbesluit,
      bedoeld in het eerste lid, betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.19a
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.6'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: 3.19a.7
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.19a
  - number: 3.19a.7.a
    text: |-
      de door de houder van de vergunning, bedoeld in het eerste lid, of door Onze Minister te volgen procedure om te
      bepalen aan welke natuurlijke of rechtspersoon als bedoeld in het derde lid, de vergunning wordt overgedragen;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.19a
  - number: 3.19a.7.b
    text: |-
      de eisen die worden gesteld aan natuurlijke personen of rechtspersonen, de aanvraag en de procedure om een
      toestemming als bedoeld in het eerste lid te verkrijgen;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.19a
  - number: 3.19a.7.c
    text: |-
      de wijze waarop bepaald wordt welke natuurlijke of rechtspersoon die een toestemming heeft verkregen de vergunning
      verkrijgt;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.19a
  - number: 3.19a.7.d
    text: de bepaling en betaling van de prijs voor de vergunning.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.19a
  - number: 3.20.1
    text: |-
      Een vergunning kan op aanvraag van de houder van die vergunning en een andere natuurlijke persoon of rechtspersoon
      geheel of gedeeltelijk aan die andere natuurlijke persoon of rechtspersoon worden overgedragen met toestemming van
      Onze Minister.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.20
  - number: 3.20.2
    text: |-
      De [artikelen 3.18][ref1], en [3.19, tweede lid, onder g][ref2], zijn van overeenkomstige toepassing. Onze minister
      verleent voorts geen toestemming indien dat met het oog op de totstandbrenging of instandhouding van daadwerkelijke
      mededinging noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.20
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.6'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: 3.20.3
    text: |-
      Indien de aanvraag betrekking heeft op een geheel over te dragen vergunning kan Onze Minister bij het
      toestemmingsbesluit de voorschriften en beperkingen die aan de over te dragen vergunning zijn verbonden, wijzigen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.20
  - number: 3.20.4
    text: |-
      Indien de aanvraag betrekking heeft op een gedeeltelijke overdracht van een vergunning kan Onze Minister bij
      het toestemmingsbesluit de voorschriften en beperkingen verbonden aan de oorspronkelijke vergunning wijzigen en
      aan de andere natuurlijke persoon of rechtspersoon een nieuwe vergunning verlenen. De [artikelen 3.10][ref1], en
      [3.13, tweede lid][ref2], zijn niet van toepassing op de verlening van de in de vorige volzin bedoelde vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.20
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.5'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: 3.20.5
    text: |-
      Alvorens een besluit te nemen als bedoeld in het eerste lid, stelt Onze Minister indien de overdracht van de
      vergunning de daadwerkelijke mededinging op de markt in aanzienlijke mate zou kunnen beperken, de Autoriteit
      Consument en Markt in de gelegenheid hem advies uit te brengen over de overdracht, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.20
  - number: 3.20.6
    text: |-
      Indien de toestemming betrekking heeft op de overdracht van een vergunning voor het gebruik van frequentieruimte
      die bestemd is voor het aanbieden van openbare elektronische communicatienetwerken of openbare elektronische
      communicatiediensten, doet Onze Minister mededeling in de Staatscourant van het besluit tot die toestemming, van
      het al dan niet gewijzigd zijn van de aan de vergunning verbonden voorschriften alsmede van het besluit nieuwe
      voorschriften aan de vergunning te verbinden.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.20
  - number: '3.21'
    text: |-
      In de gevallen waarin samenwerking tussen gebruikers van frequentieruimte noodzakelijk is voor het kunnen gebruiken
      van de aan hen toegewezen frequentieruimte, sluiten de desbetreffende gebruikers binnen een door Onze Minister
      te bepalen periode na de toewijzing als bedoeld in [artikel 3.5][ref1] of de verlening van de vergunning een
      overeenkomst betreffende de voorwaarden tot gezamenlijk gebruik van dat deel van de frequentieruimte. De periode
      kan voor de verschillende soorten gebruikers verschillend worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.21
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.22.1
    text: |-
      Frequentieruimte mag in afwijking van het bepaalde bij of krachtens dit hoofdstuk worden gebruikt, indien dit nodig
      is teneinde toepassing te kunnen geven aan strafvorderlijke bevoegdheden tot het onderzoek van telecommunicatie,
      mits:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.22
  - number: 3.22.1.a
    text: daartoe een last wordt verstrekt door een tot het onderzoek van telecommunicatie bevoegde autoriteit, en
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.22
  - number: 3.22.1.b
    text: |-
      dit plaats vindt met het doel de gegevens, bedoeld in [artikel 13.4, eerste lid][ref1], onderscheidenlijk artikel
      13.4, tweede lid, te achterhalen en het door de aanbieder voldoen aan de vordering van deze gegevens onvoldoende
      het belang van de strafvordering dient.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel13
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.22
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '13'
        hoofdstuk: '13'
  - number: 3.22.2
    text: |-
      Onze Minister kan bij ministeriële regeling vrijstelling verlenen van bij of krachtens dit hoofdstuk geldende
      verplichtingen ter zake van het gebruik van frequentieruimte.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.22
  - number: 3.22.3
    text: |-
      Gebruik van frequentieruimte dat afwijkt van het bepaalde bij of krachtens dit hoofdstuk is voorts toegestaan met
      ontheffing van Onze Minister, indien dit noodzakelijk is:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.22
  - number: 3.22.3.a
    text: |-
      ter voorkoming, beëindiging of opsporing van een misdrijf als omschreven in
      [artikel 67, eerste lid, van het Wetboek van Strafvordering][ref1], dat gezien zijn aard of de samenhang met andere
      strafbare feiten een ernstige inbreuk op de rechtsorde oplevert;


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel67
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.22
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '67'
  - number: 3.22.3.b
    text: |-
      ter vaststelling van de verblijfplaats van een aan te houden persoon op de voet van het bepaalde in
      [artikel 565, tweede lid, van het Wetboek van Strafvordering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel565
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.22
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '565'
  - number: 3.22.3.c
    text: |-
      ter uitvoering van de in de [artikelen 6][ref1] en
      [7 van de Wet op de inlichtingen- en veiligheidsdiensten 2002][ref2] aan de in [artikel 1 van die wet][ref3]
      bedoelde diensten opgedragen taken;


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0013409#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0013409#Artikel1
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.22
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0013409
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0013409
        artikel: '1'
  - number: 3.22.3.d
    text: |-
      ter vaststelling van de plaats waar zich een persoon bevindt van wie moet worden gevreesd dat deze in acuut
      levensgevaar verkeert of ter beëindiging van een zodanig acuut levensgevaar,
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.22
  - number: 3.22.3.e
    text: ten behoeve van oefendoeleinden.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.22
  - number: 3.22.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen eisen worden gesteld waaraan apparatuur die wordt gebruikt
      bij het gebruik van frequentieruimte als bedoeld in het eerste tot en met derde lid, moet voldoen en kunnen
      ambtenaren worden aangewezen die bevoegd zijn tot dat gebruik.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.22
  - number: 3.22.5
    text: |-
      De [Algemene wet bestuursrecht][ref1] is niet van toepassing op de voorbereiding, totstandkoming en
      tenuitvoerlegging van een besluit, genomen bij of krachtens het derde lid, onder a tot en met d, en het vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.22
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: 3.23.1
    text: |-
      Onze Minister houdt een openbaar antenneregister met gegevens betreffende antenne-opstelpunten, antennesystemen
      en antennes.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.23
  - number: 3.23.2
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de soorten gegevens die in het register
      worden opgenomen en degenen die worden verplicht tot het verstrekken van gegevens ten behoeve van het register.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.23
  - number: 3.23.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de inrichting van het register, het
      tijdstip en de wijze waarop de gegevens voor opneming in het register dienen te worden aangeleverd, alsmede de
      wijze waarop van de gegevens kan worden kennis genomen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.23
  - number: 3.23.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan voorts worden bepaald dat bepaalde gegevens niet in het
      register worden opgenomen, indien opneming daarvan de veiligheid van de staat zou kunnen schaden, dan wel de
      opsporing en vervolging van strafbare feiten zou kunnen bemoeilijken.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.23
  - number: 3.24.1
    text: |-
      De gebruikers van bij of krachtens algemene maatregel van bestuur aan te wijzen frequentieruimte, zijn over en weer
      verplicht te voldoen aan redelijke verzoeken tot het medegebruik van antenne-opstelpunten. Hierbij worden in ieder
      geval de technische mogelijkheden in acht genomen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.24
  - number: 3.24.2
    text: |-
      In het geval dat voor het verlenen van medegebruik toestemming van een derde is vereist, is deze daartoe slechts
      gehouden indien het een redelijk verzoek betreft en hij:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.24
  - number: 3.24.2.a
    text: |-
      direct of indirect een relevant economisch belang heeft in de gebruiker, bedoeld in het eerste lid, tot wie het
      verzoek is gericht;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.24
  - number: 3.24.2.b
    text: |-
      deel uitmaakt van een groep als bedoeld in [artikel 24b van boek 2 van het Burgerlijk Wetboek][ref1] waartoe een
      andere groepsmaatschappij als bedoeld in dat artikel behoort, die een direct of indirect relevant economisch belang
      heeft in de gebruiker.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.24
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
  - number: 3.24.3
    text: |-
      De gebruiker, bedoeld in het eerste lid, en de derde die op grond van het tweede lid gehouden is toestemming te
      verlenen, stellen het medegebruik ter beschikking tegen een redelijke vergoeding.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.24
  - number: 3.24.4
    text: |-
      Aanbieders van elektronische communicatienetwerken die bestaan uit radiozendapparaten die geschikt zijn voor het
      verspreiden van programma’s, alsmede aanbieders van antenne-opstelpunten welke bestemd zijn om genoemde netwerken
      te ondersteunen, voldoen aan redelijke verzoeken tot medegebruik van antenne-opstelpunten, antennesystemen of
      antennes. Het tweede en derde lid zijn van overeenkomstige toepassing. Hierbij is bij het medegebruik van de
      genoemde antenne-opstelpunten slechts sprake van een redelijke vergoeding als bedoeld in het derde lid, indien de
      vergoeding efficiënt, transparant en niet-discriminatoir is, en de kosten van de werkelijk afgenomen capaciteit
      weerspiegelt. Daarbij draagt de aanbieder die aan het verzoek tot medegebruik voldoet bij geschillen de bewijslast
      voor de redelijkheid van de vergoeding.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.24
  - number: 3.24.5
    text: |-
      In het geval de voor medegebruik als bedoeld in het vierde lid te betalen vergoeding mede wordt bepaald door een
      door de verlener van het medegebruik zelf voor medegebruik aan een derde te betalen vergoeding mag laatstbedoelde
      vergoeding slechts worden doorberekend voor zover deze vergoeding redelijk is.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.24
  - number: 3.25.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels gesteld worden met betrekking tot het
      bepaalde in [artikel 3.24][ref1]. Hierbij kunnen aan de Autoriteit Consument en Markt taken worden opgedragen en
      bevoegdheden worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.25
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.8'
  - number: 3.25.2
    text: 'De in het eerste lid bedoelde regels kunnen betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.25
  - number: 3.25.2.a
    text: |-
      de door degene, bedoeld in [artikel 3.24, eerste of vierde lid][ref1], te verstrekken informatie over de antenne-
      opstelpunten waarover zij beschikken,


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.25
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.8'
  - number: 3.25.2.b
    text: het reserveren van ruimte op antenne-opstelpunten voor eigen gebruik of voor medegebruik,
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.25
  - number: 3.25.2.c
    text: |-
      de termijnen waarbinnen op een verzoek als bedoeld in [artikel 3.24, eerste of vierde lid][ref1], tot medegebruik
      van een antenne-opstelpunt moet worden beslist,


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.25
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.8'
  - number: 3.25.2.d
    text: |-
      de vergoeding, bedoeld in [artikel 3.24, derde en vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel3.25
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.8'
  - number: 4.1.1
    text: |-
      Onze Minister stelt, na overleg met de Autoriteit Consument en Markt, nummerplannen vast waarin in ieder geval de
      bestemming van de daarin opgenomen nummers wordt aangegeven. In een nummerplan kan voorts:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.1
  - number: 4.1.1.a
    text: worden bepaald dat eenzelfde nummer aan meerdere aanvragers kan worden toegekend;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.1
  - number: 4.1.1.b
    text: |-
      ter bescherming van de consument een maximum worden gesteld aan het tarief van een in het nummerplan opgenomen
      nummer.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.1
  - number: 4.1.2
    text: |-
      Op de voorbereiding van een nummerplan is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 4.1.3
    text: 'Het tweede lid is niet van toepassing indien het vast te stellen nummerplan slechts betrekking heeft op:'
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.1
  - number: 4.1.3.a
    text: |-
      het uitbreiden van nummercapaciteit, welke het gevolg is van een toewijzing van nummers aan Nederland door een
      internationale organisatie,
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.1
  - number: 4.1.3.b
    text: |-
      de implementatie van een besluit van het Europees Parlement en de Raad van de Europese Unie, van de Raad van de
      Europese Unie of van de Europese Commissie, of
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.1
  - number: 4.1.3.c
    text: |-
      overige wijzigingen die van ondergeschikte aard zijn en waarvan in het nummerplan is opgenomen dat op een
      dergelijke wijziging artikel 4.1, tweede lid, niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.1
  - number: 4.1.4
    text: |-
      Het is verboden voor een bestemming die voorkomt in een nummerplan andere nummers te gebruiken dan de nummers die
      in dat plan voor die bestemming zijn opgenomen, en om een nummer dat voorkomt in een nummerplan voor een andere
      bestemming te gebruiken dan de bestemming waarvoor dat nummer in dat plan is opgenomen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.1
  - number: 4.1a
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld ter uitvoering van overeenkomstig artikel 19, eerste en
      derde lid, onderdeel b, van [richtlijn nr. 2002/21/EG](32002L0021) vastgestelde technische uitvoeringsmaatregelen
      inzake de harmonisatie van nummervoorraden in de Europese Unie teneinde de ontwikkeling van pan-Europese diensten
      te ondersteunen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.1a
  - number: 4.2.1
    text: |-
      Nummers die in een nummerplan of in een op grond van het vijfde lid vastgestelde aanwijzing zijn opgenomen kunnen
      op aanvraag door de Autoriteit Consument en Markt worden toegekend aan:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.2
  - number: 4.2.1.a
    text: |-
      een aanbieder van een elektronisch communicatienetwerk ten behoeve van het verzorgen van elektronische
      communicatiediensten over zijn elektronisch communicatienetwerk;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.2
  - number: 4.2.1.b
    text: |-
      een aanbieder van een elektronische communicatiedienst ten behoeve van het verzorgen van zijn elektronische
      communicatiedienst, of
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.2
  - number: 4.2.1.c
    text: een natuurlijke persoon of rechtspersoon ten behoeve van het gebruik van een elektronische communicatiedienst.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.2
  - number: 4.2.2
    text: |-
      Een besluit over een aanvraag om toekenning van nummers wordt binnen drie weken na ontvangst van de aanvraag
      genomen en bekendgemaakt. Indien de aanvraag betrekking heeft op een nummer, waarvan in een nummerplan is
      vastgelegd dat dit wordt toegekend door middel van een procedure van veiling:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.2
  - number: 4.2.2.a
    text: wordt de termijn verlengd met drie weken, en
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.2
  - number: 4.2.2.b
    text: |-
      is [artikel 4:14, eerste lid, van de Algemene wet bestuursrecht][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 4.2.3
    text: |-
      In het belang van een doelmatige toekenning van nummers kan bij ministeriële regeling worden bepaald dat nummers
      voor een bij die regeling aangewezen bestemming of categorie van gevallen, slechts kunnen worden toegekend aan één,
      onderscheidenlijk twee, van de in het eerste lid, onder a tot en met c, bedoelde categorieën van aanvragers.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.2
  - number: 4.2.4
    text: |-
      Een toekenning van nummers kan in het belang van een doelmatig gebruik van nummers onder beperkingen worden
      verleend. In dat belang kunnen aan een toekenning voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.2
  - number: 4.2.5
    text: |-
      Gedurende de voorbereiding van een nummerplan kan de Autoriteit Consument en Markt, in overeenstemming met door
      Onze Minister aan te wijzen bestemmingen en de daarbij behorende nummers, nummers toekennen gedurende een bij dat
      besluit vast te stellen termijn. Het verbod van [artikel 4.1, vierde lid][ref1], is van overeenkomstige toepassing
      op de door Onze Minister aangewezen nummers.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel4
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.2.6
    text: |-
      Indien meer aanvragen met een gelijke voorkeur om toekenning van een bepaald nummer, dan wel bepaalde nummers op
      dezelfde dag bij de Autoriteit Consument en Markt ter behandeling zijn ingediend, besluit de Autoriteit Consument
      en Markt op die aanvragen door middel van het lot. Van deze procedure zijn uitgesloten nummers als bedoeld in het
      zevende lid en nummers als bedoeld in [artikel 4.2b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel4
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.2.7
    text: |-
      Nummers van uitzonderlijke economische waarde worden toegekend door middel van een procedure van veiling, indien
      dit met betrekking tot die nummers in een nummerplan is vastgelegd. De opbrengst van de veiling komt toe aan de
      Staat.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.2
  - number: 4.2.8
    text: 'In afwijking van het bepaalde in het zesde en het zevende lid kan de Autoriteit Consument en Markt:'
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.2
  - number: 4.2.8.a
    text: |-
      besluiten een nummer, niet zijnde een nummer van uitzonderlijke economische waarde, op de dag van aanvraag toe te
      kennen, mits de aanvrager geen specifiek nummer aanvraagt, en
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.2
  - number: 4.2.8.b
    text: |-
      in uitzonderlijke omstandigheden besluiten een nummer van uitzonderlijke economische waarde op de dag van aanvraag
      toe te kennen voor een door de Autoriteit Consument en Markt vast te stellen termijn die niet langer is dan drie
      maanden.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.2
  - number: 4.2.9
    text: |-
      Indien voor de toekenning van een nummer als bedoeld in het zevende lid slechts één aanvrager overeenkomstig de
      bij of krachtens deze wet gestelde regels in aanmerking komt, wordt aan deze aanvrager het nummer toegekend zonder
      toepassing van een veiling.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.2
  - number: 4.2.10
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de
      aanvraagprocedures van nummers als bedoeld in het zevende en achtste lid, met betrekking tot de veilingprocedure en
      met betrekking tot de lotingprocedure.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.2
  - number: 4.2.11
    text: |-
      Het is verboden nummers door Onze Minister aangewezen overeenkomstig het vijfde lid, alsmede nummers voorkomende
      in een nummerplan te gebruiken voor de in de aanwijzing onderscheidenlijk in een nummerplan opgenomen bestemming
      zonder of in afwijking van een toekenning.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.2
  - number: 4.2a.1
    text: |-
      Nummers die worden toegekend door middel van een procedure van veiling worden voor onbepaalde tijd toegekend,
      tenzij Onze Minister in het betreffende nummerplan een maximumduur van de toekenning heeft vastgelegd.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.2a
  - number: 4.2a.2
    text: |-
      Een nummer waarvoor een maximumduur is opgenomen in een nummerplan wordt niet eerder dan een jaar nadat de
      maximumtermijn van de toekenning is verstreken of de toekenning is ingetrokken in gebruik genomen, indien het
      nummer door de daarop volgende toekenning van nummerhouder verandert.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.2a
  - number: 4.2b
    text: |-
      In de gevallen waarin samenwerking tussen nummerhouders noodzakelijk is voor het kunnen gebruiken van een nummer
      dat aan twee of meer nummerhouders is toegekend, sluiten de nummerhouders binnen een periode van ten hoogste zes
      weken nadat het nummer aan hen is toegekend een overeenkomst betreffende de voorwaarden tot gezamenlijk gebruik van
      dat nummer.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.2b
  - number: 4.3.1
    text: 'Een toekenning wordt geweigerd, indien:'
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.3
  - number: 4.3.1.a
    text: |-
      de toekenning in strijd is met het desbetreffende nummerplan of een op grond van [artikel 4.2, vijfde lid][ref1],
      vastgestelde aanwijzing;


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel4
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.3.1.b
    text: |-
      redelijkerwijs is te verwachten dat door de aanvrager niet zal of kan worden voldaan aan het bij of krachtens deze
      wet met betrekking tot nummers bepaalde;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.3
  - number: 4.3.1.c
    text: de toekenning in strijd zou zijn met de bij of krachtens deze wet gestelde regels.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.3
  - number: 4.3.2
    text: 'Een toekenning kan geheel of gedeeltelijk worden geweigerd, indien:'
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.3
  - number: 4.3.2.a
    text: |-
      op grond van de aanvraag redelijkerwijs niet is te verwachten dat het voorgenomen gebruik binnen een jaar, of
      binnen een bij ministeriële regeling voor bij die regeling aan te wijzen categorieën van nummers te bepalen kortere
      termijn, wordt verwezenlijkt;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.3
  - number: 4.3.2.b
    text: |-
      het in de aanvraag omschreven voorgenomen gebruik de toekenning van de gevraagde hoeveelheid nummers niet
      rechtvaardigt;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.3
  - number: 4.3.2.c
    text: |-
      de Autoriteit Consument en Markt eerder een aanvraag heeft geweigerd of een eerdere toekenning heeft opgeschort of
      ingetrokken op grond van [artikel 4.7, derde, vierde of vijfde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel4
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.3.2.d
    text: |-
      uit de aanvraag blijkt dat deze wordt gedaan met de kennelijke bedoeling de bij de aanvraag gevraagde nummers te
      verhandelen;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.3
  - number: 4.3.2.e
    text: het in de aanvraag omschreven voorgenomen gebruik de toekenning van de gevraagde nummers niet noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.3
  - number: 4.3.3
    text: |-
      Met betrekking tot bij ministeriële regeling aangewezen categorieën van nummers kan een toekenning geheel of
      gedeeltelijk worden geweigerd indien:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.3
  - number: 4.3.3.a
    text: de aanvrager gevestigd is buiten de Europese Economische Ruimte;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.3
  - number: 4.3.3.b
    text: |-
      wordt voldaan aan de voorwaarden van
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '3'
  - number: 4.3.4
    text: |-
      Voordat toepassing wordt gegeven aan het derde lid, onderdeel b, kan het Bureau
      bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1], door de Autoriteit
      Consument en Markt om een advies als bedoeld in [artikel 9 van die wet][ref2] worden gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel9
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0013798
        artikel: '9'
  - number: 4.4.1
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald welke gedragingen van een nummergebruiker voor de Autoriteit
      Consument en Markt aanleiding kunnen zijn om:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.4
  - number: 4.4.1.a
    text: de toekenning van een nummer te weigeren, op te schorten of in te trekken,
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.4
  - number: 4.4.1.b
    text: |-
      de aanbieder van een openbare elektronische communicatiedienst een aanwijzing te geven de betaling die gerelateerd
      is aan het betreffende nummer op te schorten overeenkomstig [artikel 7.3a][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel7
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '7'
        hoofdstuk: '7'
  - number: 4.4.1.c
    text: |-
      de aanbieder van een openbare elektronische communicatiedienst een aanwijzing te geven de aankiesbaarheid van het
      desbetreffende nummer op te schorten overeenkomstig [artikel 7.3b, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel7
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '7'
        hoofdstuk: '7'
  - number: 4.4.2
    text: De gedragingen hebben betrekking op het kennelijk misbruik maken van de tarifering van een nummer.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.4
  - number: 4.5.1
    text: De Autoriteit Consument en Markt kan op aanvraag van de nummerhouder een toekenning wijzigen of intrekken.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.5
  - number: 4.5.2
    text: |-
      Op een aanvraag tot wijziging is [artikel 4.3][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel4
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '4'
        hoofdstuk: '4'
  - number: '4.6'
    text: |-
      De Autoriteit Consument en Markt kan op gezamenlijke aanvraag van de desbetreffende nummerhouder en een derde
      toestaan dat de toekenning overgaat op de derde. [Artikel 4.2, vierde lid][ref1], en [artikel 4.3][ref2] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel4
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '4'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.7.1
    text: 'Een toekenning wordt door de Autoriteit Consument en Markt gewijzigd of ingetrokken, indien:'
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.7
  - number: 4.7.1.a
    text: |-
      een wijziging van het desbetreffende nummerplan daartoe noodzaakt, voor zover de nummerhouder aanspraak behoudt op
      toekenning van hetzelfde aantal nummers;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.7
  - number: 4.7.1.b
    text: het doelmatig gebruik van nummers in het algemeen maatschappelijk en economisch belang dit vordert.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.7
  - number: 4.7.2
    text: |-
      Een toekenning wordt voorts door de Autoriteit Consument en Markt gewijzigd indien dit noodzakelijk is om
      feitelijke onjuistheden van eenvoudige aard weg te nemen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.7
  - number: 4.7.3
    text: |-
      Een toekenning wordt voorts door de Autoriteit Consument en Markt ingetrokken op aanwijzing van Onze Minister in
      het belang van de veiligheid van de staat.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.7
  - number: 4.7.4
    text: |-
      Een toekenning kan door de Autoriteit Consument en Markt worden opgeschort voor een door de Autoriteit Consument en
      Markt te bepalen termijn of worden ingetrokken, indien:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.7
  - number: 4.7.4.a
    text: |-
      de nummerhouder of de nummergebruiker de bij of krachtens deze wet met betrekking tot nummers gestelde regels of de
      aan het toekenningsbesluit verbonden voorschriften niet nakomt;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.7
  - number: 4.7.4.b
    text: na de toekenning blijkt dat de aanvraag is gedaan met de kennelijke bedoeling de toegekende nummers te verhandelen;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.7
  - number: 4.7.4.c
    text: de nummerhouder niet meer voldoet aan de voorwaarden om in aanmerking te komen voor toekenning van dat nummer.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.7
  - number: 4.7.5
    text: |-
      Met betrekking tot bij ministeriële regeling aangewezen categorieën van nummers kan een toekenning door de
      Autoriteit Consument en Markt worden opgeschort voor een door de Autoriteit Consument en Markt te bepalen
      termijn die niet langer duurt dan twee weken, indien de Autoriteit Consument en Markt een aanwijzing heeft dat
      de nummergebruiker de bij of krachtens deze wet met betrekking tot nummers gestelde regels niet nakomt of de
      aan het toekenningsbesluit verbonden voorschriften of een gedraging als bedoeld in [artikel 4.4][ref1] verricht.
      De Autoriteit Consument en Markt kan de in de vorige volzin genoemde periode eenmalig met maximaal twee weken
      verlengen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel4
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.8.1
    text: |-
      In het belang van de goede uitvoering van de bij of krachtens de wet aan de Autoriteit Consument en Markt
      opgedragen taken en toegekende bevoegdheden wordt door de Autoriteit Consument en Markt een nummerregister
      bijgehouden dat een overzicht bevat van toekenningen. Het register bevat de vermelding van de naam, het
      adres en de vestigingsplaats, respectievelijk de woonplaats van degene aan wie nummers zijn toegekend. Tevens
      wordt de duur van de toekenning vermeld. De Autoriteit Consument en Markt is verantwoordelijke in de zin van
      [artikel 1, onderdeel d, van de Wet bescherming persoonsgegevens][ref1] voor het register.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel1
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.8
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '1'
  - number: 4.8.2
    text: |-
      Onverminderd het derde lid ligt het register voor eenieder kosteloos ter inzage op een door de Autoriteit Consument
      en Markt te bepalen plaats.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.8
  - number: 4.8.3
    text: |-
      Op verzoek van de nummerhouder wordt, indien het een natuurlijk persoon betreft en het nummer niet uitsluitend
      bedrijfsmatig wordt gebruikt, zijn naam, adres en woonplaats niet opgenomen in het deel van het register dat ter
      inzage ligt.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.8
  - number: 4.9.1
    text: |-
      Indien de nummerhouder de aan hem toegekende nummers in gebruik geeft aan een ander, doet hij dit op een niet-
      discriminerende en transparante wijze met gebruikmaking van objectieve criteria.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.9
  - number: 4.9.2
    text: |-
      De nummerhouder draagt er zorg voor dat het gebruik van de aan hem toegekende nummers in overeenstemming is met het
      bij of krachtens deze wet bepaalde.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.9
  - number: 4.9.3
    text: 'Met betrekking tot bij ministeriële regeling aangewezen categorieën van nummers:'
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.9
  - number: 4.9.3.a
    text: geeft de nummergebruiker een aan hem in gebruik gegeven nummer niet in gebruik aan een ander;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.9
  - number: 4.9.3.b
    text: |-
      registreert de nummerhouder de bij ministeriële regeling vastgestelde gegevens over de nummergebruiker en over het
      gebruik van het nummer.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.9
  - number: 4.10.1
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat een aanbieder van een bij die maatregel aan te wijzen
      categorie van openbare elektronische communicatiediensten verplicht is degene die op grond van een met hem gesloten
      overeenkomst die elektronische communicatiedienst afneemt:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.10
  - number: 4.10.1.a
    text: |-
      de mogelijkheid te bieden het in het kader van de afgenomen elektronische communicatiedienst bij hem in gebruik
      zijnde nummer te blijven gebruiken na beëindiging van de levering van de dienst in het geval de beëindiging van de
      levering plaatsvindt ten gevolge van een rechtsgeldige beëindiging van de overeenkomst;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.10
  - number: 4.10.1.b
    text: |-
      de mogelijkheid te bieden het in het kader van de afgenomen elektronische communicatiedienst bij hem in gebruik
      zijnde nummer te blijven gebruiken indien hij binnen een bepaald gebied van adres verandert, of
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.10
  - number: 4.10.1.c
    text: |-
      de mogelijkheid te bieden het in het kader van de afgenomen elektronische communicatiedienst bij hem in
      gebruik zijnde nummer te blijven gebruiken indien hij er voor kiest een andere bij die maatregel aan te wijzen
      elektronische communicatiedienst af te nemen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.10
  - number: 4.10.2
    text: |-
      Een aanbieder van een krachtens het eerste lid aangewezen categorie van openbare elektronische communicatiediensten
      op wie een verplichting als bedoeld in dat lid, onderdeel a, rust, is tevens verplicht:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.10
  - number: 4.10.2.a
    text: |-
      aan degene met wie hij overeenkomt de desbetreffende openbare elektronische communicatiedienst te leveren de
      mogelijkheid te bieden het voorheen in het kader van die dienst bij diegene in gebruik zijnde nummer te blijven
      gebruiken, en
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.10
  - number: 4.10.2.b
    text: |-
      indien de abonnee tijdig met de aanbieder de levering van de desbetreffende openbare elektronische
      communicatiedienst overeenkomt en daarbij laat weten gebruik te maken van de mogelijkheid bedoeld in het eerste
      lid, onderdeel a, de levering van de dienst via het bij de abonnee in gebruik zijnde nummer zo spoedig mogelijk
      aan te vangen, doch niet later dan de werkdag volgend op de dag waarop de levering van de dienst door de vorige
      aanbieder wordt beëindigd.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.10
  - number: 4.10.3
    text: 'Bij een verplichting opgelegd, krachtens het eerste lid, onderdeel a, gaat:'
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.10
  - number: 4.10.3.a
    text: |-
      in het geval het betreffende nummer is toegekend aan een aanbieder van een openbaar elektronisch
      communicatienetwerk en voor de betreffende openbare elektronische communicatiedienst voortaan het openbare
      elektronisch communicatienetwerk van een andere aanbieder wordt gebruikt, de toekenning van het betreffende nummer
      over op die andere aanbieder van dat netwerk;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.10
  - number: 4.10.3.b
    text: |-
      in het geval het betreffende nummer is toegekend aan de aanbieder van de betreffende openbare elektronische
      communicatiedienst, de toekenning van het betreffende nummer over op degene van wie de betreffende elektronische
      communicatiedienst voortaan wordt afgenomen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.10
  - number: 4.10.4
    text: |-
      De Autoriteit Consument en Markt kan categorieën van nummers aanwijzen waarvoor geldt dat, in het geval een nummer
      uit die categorie na een overgang op grond van het derde lid niet langer in gebruik is, de toekenning van het
      nummer teruggaat naar de aanbieder aan wie het nummer op basis van een aanvraag was toegekend.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.10
  - number: 4.10.5
    text: |-
      Een aanbieder die een nummer behorende tot een door de Autoriteit Consument en Markt op grond van het vierde lid
      aangewezen categorie niet heeft toegekend gekregen op grond van een aanvraag doet, indien hij het nummer niet
      langer in gebruik heeft, hiervan mededeling aan de Autoriteit Consument en Markt. Na ontvangst van de in de vorige
      zin bedoelde mededeling stelt de Autoriteit Consument en Markt de aanbieder naar wie de toekenning van het nummer
      op grond van het vierde lid is teruggegaan hiervan op de hoogte.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.10
  - number: 4.10.6
    text: |-
      De in het derde lid bedoelde aanbieders stellen de Autoriteit Consument en Markt binnen een door de Autoriteit
      Consument en Markt te bepalen termijn en op een door de Autoriteit Consument en Markt te bepalen wijze op de hoogte
      van de toekenningen van nummers die in een door de Autoriteit Consument en Markt te bepalen periode op grond van
      het derde lid van hen op andere aanbieders zijn overgegaan, alsmede van de toekenningen van nummers die op grond
      van het derde lid van andere aanbieders op hen zijn overgegaan. De Autoriteit Consument en Markt maakt de door haar
      bepaalde termijn, wijze en periode, bedoeld in de eerste volzin, bekend in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.10
  - number: 4.10.7
    text: |-
      Een aanbieder van een openbaar elektronisch communicatienetwerk waarover een krachtens het eerste lid aangewezen
      categorie van openbare elektronische communicatiediensten wordt verzorgd:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.10
  - number: 4.10.7.a
    text: |-
      zorgt ervoor dat zijn netwerk zodanig is ingericht dat een aanbieder van die dienst een krachtens het eerste lid
      opgelegde verplichting kan nakomen, en
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.10
  - number: 4.10.7.b
    text: |-
      stelt voor interconnectie verband houdende met een krachtens het eerste lid opgelegde verplichting een
      kostengeoriënteerd tarief vast.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.10
  - number: 4.10.8
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de doorberekening
      van kosten van een krachtens het eerste of tweede lid opgelegde verplichting aan eindgebruikers.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.10
  - number: 4.10.9
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot een krachtens het eerste lid
      opgelegde verplichting.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel4.10
  - number: '5.1'
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt onder een aanbieder van een openbaar elektronisch
      communicatienetwerk mede verstaan degene die in eigen naam en voor eigen rekening kabels ten dienste van een
      dergelijk netwerk aanlegt, instandhoudt en opruimt.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.1
  - number: 5.2.1
    text: |-
      De rechthebbende op of de beheerder van openbare gronden is verplicht te gedogen dat ten dienste van een openbaar
      elektronisch communicatienetwerk kabels in en op deze gronden worden aangelegd, instandgehouden of opgeruimd.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.2
  - number: 5.2.2
    text: |-
      Voor zover het de aanleg, instandhouding of opruiming van andere dan lokale kabels betreft strekt de gedoogplicht
      zich tevens uit tot niet-openbare gronden, uitgezonderd tuinen en erven die met bewoonde percelen één geheel
      vormen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.2
  - number: 5.2.3
    text: |-
      Voor zover het voor het aansluiten van gebruikers op een openbaar elektronisch communicatienetwerk nodig is, strekt
      de gedoogplicht zich wat lokale kabels betreft tevens uit tot niet-openbare gronden, met inbegrip van tuinen en
      erven die met bewoonde percelen één geheel vormen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.2
  - number: 5.2.4
    text: |-
      Voor zover het voor het aansluiten van gebruikers op een openbaar elektronisch communicatienetwerk nodig is, is
      bovendien de rechthebbende op een gebouw verplicht de aanleg, instandhouding of opruiming van netwerkaansluitpunten
      en kabels in en aan dit gebouw te gedogen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.2
  - number: 5.2.5
    text: |-
      Indien ten behoeve van een andere toepassing dan elektronische communicatie bovengrondse ondersteuningswerken zijn
      of worden aangelegd waarmee ten behoeve van die toepassing bovengronds fysieke draden zijn of worden aangelegd,
      is de rechthebbende op of de beheerder van openbare of niet-openbare grond waarboven deze draden zijn of worden
      aangelegd, verplicht te gedogen dat met de uitsluitende gebruikmaking van deze bovengrondse ondersteuningswerken
      tevens kabels ten behoeve van een openbaar elektronisch communicatienetwerk boven de desbetreffende grond worden
      aangelegd, instandgehouden of opgeruimd. Voor de rechthebbende op of de beheerder van de genoemde bovengrondse
      ondersteuningswerken bestaat geen gedoogplicht voor het gebruik laten maken van deze werken.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.2
  - number: 5.2.6
    text: 'Door de aanleg, de instandhouding en de opruiming van kabels wordt:'
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.2
  - number: 5.2.6.a
    text: |-
      geen verandering teweeggebracht in de bestemming van hetgeen waarin, waarop, waarboven of waaraan de kabels zijn of
      worden aangelegd, en
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.2
  - number: 5.2.6.b
    text: |-
      zo min mogelijk verandering in de uiterlijke gedaante en zo min mogelijk belemmering in het gebruik ervan
      teweeggebracht.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.2
  - number: 5.2.7
    text: |-
      Op verzoek van degene op wie de gedoogplicht rust, maakt de aanbieder van een openbaar elektronisch
      communicatienetwerk ter uitvoering van het zesde lid, onder b, gebruik van ondergrondse voorzieningen, die door
      degene op wie de gedoogplicht rust of een derde tegen een marktconforme prijs ter beschikking wordt gesteld, tenzij
      de aanbieder ingeval [artikel 5.15][ref1] van toepassing is, aannemelijk kan maken dat medegebruik als bedoeld
      in [artikel 5.12][ref2] op technische of economische gronden niet haalbaar is. Bij algemene maatregel van bestuur
      kunnen aanvullende voorwaarden worden gesteld met betrekking tot de aanleg en vorm van aan te leggen netwerken
      ingeval van gebruik van voorzieningen als bedoeld in de eerste volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel5
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 5.2.8
    text: |-
      Aan de in het eerste tot en met het vijfde lid opgenomen verplichting om de instandhouding van kabels ten dienste
      van een openbaar elektronisch communicatienetwerk te gedogen komt een einde wanneer de aangelegde kabels gedurende
      een aaneengesloten periode van tien jaar geen deel uitmaken van een openbaar elektronisch communicatienetwerk. In
      dat geval is de aanbieder van een openbaar elektronisch communicatienetwerk verplicht op verzoek van degene op wie
      de gedoogplicht rustte de kabels op te ruimen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.2
  - number: 5.2.9
    text: |-
      Het in of uit gebruik nemen van kabels ten dienste van een openbaar elektronisch communicatienetwerk wordt door de
      aanbieder van het desbetreffende netwerk schriftelijk gemeld aan degene op wie de gedoogplicht rust. De bewijslast
      voor de ingebruikneming ligt bij de aanbieder.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.2
  - number: 5.2.10
    text: |-
      Onverminderd dit artikel gelden de gegeven voorschriften bij of krachtens andere wetten terzake van het gebruik van
      deze gronden, gebouwen of wateren.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.2
  - number: 5.3.1
    text: |-
      De aanbieder van een openbaar elektronisch communicatienetwerk die het voornemen heeft werkzaamheden uit te
      voeren in verband met de aanleg, instandhouding of opruiming van kabels, stelt degene op wie de gedoogplicht rust
      schriftelijk in kennis van dit voornemen en streeft vervolgens naar overeenstemming over de plaats, het tijdstip en
      de wijze van uitvoering van de werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.3
  - number: 5.3.2
    text: |-
      Indien binnen vier weken na de datum van verzending van de schriftelijke kennisgeving geen overeenstemming is
      bereikt, geeft de aanbieder een tweede schriftelijke kennisgeving aan degene op wie de gedoogplicht rust waarin
      een omschrijving van de plaats, het tijdstip, dat niet eerder kan zijn gelegen dan drie weken na verzending van de
      tweede kennisgeving, en de wijze van de uit te voeren werkzaamheden wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.3
  - number: 5.3.3
    text: |-
      Indien degene op wie de gedoogplicht rust tegen deze tweede kennisgeving bedenkingen heeft, kan hij binnen twee
      weken na ontvangst daarvan de Autoriteit Consument en Markt verzoeken een beschikking te geven over de plaats, het
      tijdstip en de wijze van de uit te voeren werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.3
  - number: 5.3.4
    text: |-
      De Autoriteit Consument en Markt geeft de beschikking binnen 2 maanden na ontvangst van het verzoek.
      [Artikel 4:15 van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing indien de Autoriteit
      Consument en Markt aan een andere partij dan de aanvrager om gegevens verzoekt met het oog op de te nemen
      beschikking, alsmede [artikel 12.5, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel12
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '12'
        hoofdstuk: '12'
        paragraaf: '12.2'
  - number: 5.3.5
    text: Het verzoek schorst het recht op uitvoering van de werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.3
  - number: 5.3.6
    text: Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de schriftelijke kennisgeving.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.3
  - number: 5.4.1
    text: |-
      De aanbieder van een openbaar elektronisch communicatienetwerk die het voornemen heeft werkzaamheden uit te voeren
      in of op openbare gronden in verband met de aanleg, instandhouding of opruiming van kabels, gaat slechts over tot
      het verrichten van deze werkzaamheden indien deze:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.4
  - number: 5.4.1.a
    text: |-
      het voornemen daartoe schriftelijk heeft gemeld bij burgemeester en wethouders van de gemeente binnen wier
      grondgebied de uit te voeren werkzaamheden plaats zullen vinden, en
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.4
  - number: 5.4.1.b
    text: |-
      van burgemeester en wethouders instemming heeft verkregen omtrent de plaats, het tijdstip, en de wijze van
      uitvoering van de werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.4
  - number: 5.4.2
    text: |-
      Burgemeester en wethouders nemen het instemmingsbesluit binnen acht weken na ontvangst van de schriftelijke
      melding als bedoeld in het eerste lid, onderdeel a. De termijn van acht weken kan worden verlengd met ten hoogste
      acht weken. Zij kunnen om redenen van openbare orde, veiligheid, het voorkomen of beperken van overlast, de
      bereikbaarheid van gronden of gebouwen, dan wel ondergrondse ordening in het instemmingsbesluit voorschriften
      opnemen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.4
  - number: 5.4.3
    text: 'De voorschriften kunnen slechts betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.4
  - number: 5.4.3.a
    text: de plaats van de werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.4
  - number: 5.4.3.b
    text: |-
      het tijdstip van de werkzaamheden, met dien verstande dat het toegestane tijdstip van aanvang, behoudens
      zwaarwichtige redenen van publiek belang als genoemd in het tweede lid, niet later mag liggen dan 12 maanden na de
      datum van afgifte van het instemmingsbesluit;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.4
  - number: 5.4.3.c
    text: de wijze van uitvoering van de werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.4
  - number: 5.4.3.d
    text: het bevorderen van medegebruik van voorzieningen;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.4
  - number: 5.4.3.e
    text: het afstemmen van de voorgenomen werkzaamheden met beheerders van overige in de grond aanwezige werken.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.4
  - number: 5.4.4
    text: |-
      De gemeenteraad stelt met betrekking tot het verrichten van de werkzaamheden bij verordening regels vast die in
      ieder geval betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.4
  - number: 5.4.4.a
    text: het tijdstip, voorafgaand aan het verrichten van de werkzaamheden, waarop de melding uiterlijk moet zijn gedaan;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.4
  - number: 5.4.4.b
    text: de gegevens die bij de melding moeten worden verstrekt, waaronder het uitvoeringsplan;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.4
  - number: 5.4.4.c
    text: de wijze van uitvoering van de werkzaamheden bij aanleg, instandhouding en opruiming;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.4
  - number: 5.4.4.d
    text: het bevorderen van medegebruik van voorzieningen;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.4
  - number: 5.4.4.e
    text: het afstemmen van de voorgenomen werkzaamheden met beheerders van overige in de grond aanwezige werken;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.4
  - number: 5.4.4.f
    text: de wijze van melding en uitvoering van spoedeisende werkzaamheden in verband
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.4
  - number: 5.4.5
    text: In de verordening wordt onderscheid gemaakt tussen werkzaamheden van al dan niet ingrijpende aard.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.4
  - number: 5.4.6
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de verordening.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.4
  - number: 5.4.7
    text: |-
      Indien een gemeente gedoogplichtig is, vindt [artikel 5.3][ref1] geen toepassing voor zover de belangen van de
      gemeente kunnen worden behartigd in het door burgemeester en wethouders te verlenen instemmingsbesluit.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel5
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.4
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 5.5.1
    text: |-
      Indien voor de aanleg, instandhouding of opruiming van kabels ten dienste van een openbaar elektronisch
      communicatienetwerk zowel een aanvraag voor een besluit als bedoeld in [artikel 5.4, eerste lid, onder b][ref1],
      bij burgemeester en wethouders van de gemeente binnen wiens grondgebied de uit te voeren werkzaamheden plaats
      zullen vinden, als een aanvraag voor een vergunning al dan niet bij een ander bestuursorgaan op grond van een
      andere wet is ingediend, dan stelt de aanvrager burgemeester en wethouders hiervan op de hoogte.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel5
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.5
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 5.5.2
    text: |-
      Burgemeester en wethouders van de desbetreffende gemeente bevorderen op verzoek van de aanvrager een inhoudelijke
      afstemming bij de beoordeling van de aanvragen. De overige betrokken bestuursorganen verlenen de daarvoor benodigde
      medewerking.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.5
  - number: 5.5.3
    text: |-
      [Artikel 5.4, zevende lid][ref1], is van overeenkomstige toepassing in het geval van vergunningverlening als
      bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel5
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.5
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 5.6.1
    text: |-
      In geval van spoedeisende werkzaamheden ten gevolge van een ernstige belemmering of storing van de communicatie is
      het bepaalde bij of krachtens de [artikelen 5.3][ref1] en [5.4, eerste tot en met vierde lid, onder e][ref2], niet
      van toepassing op de instandhouding van kabels ten dienste van een openbaar elektronisch communicatienetwerk en kan
      door de aanbieder van het openbaar elektronische communicatienetwerk worden volstaan met een melding voorafgaand
      aan de uit te voeren werkzaamheden aan degene op wie de gedoogplicht rust.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel5
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.6
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 5.6.2
    text: |-
      Ingeval de werkzaamheden in verband met de instandhouding van kabels worden verricht in of op openbare gronden,
      wordt hiervan door de aanbieder tevens voorafgaand aan de uit te voeren werkzaamheden melding gedaan bij de
      burgemeester van de gemeente binnen wiens grondgebied de werkzaamheden zullen plaatsvinden, of bij een daartoe
      door hem gemachtigd ambtenaar. Ingeval de melding bij de gemachtigde heeft plaatsgevonden stelt de gemachtigde de
      burgemeester zo spoedig mogelijk daarvan in kennis.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.6
  - number: 5.6.3
    text: |-
      Ingeval de openbare orde of gevaar dan wel de vrees voor het ontstaan van gevaar zich verzet tegen de uitvoering
      van de voorgenomen werkzaamheden kan de burgemeester besluiten dat de werkzaamheden op een ander dan het
      voorgenomen tijdstip plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.6
  - number: 5.6.4
    text: Het besluit wordt onverwijld na het tijdstip van ontvangst van de melding genomen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.6
  - number: 5.6.5
    text: |-
      In de verordening, bedoeld in [artikel 5.4, vierde lid][ref1], kan de gemeenteraad om redenen van veiligheid delen
      van een grondgebied aanwijzen waarvoor dit artikel niet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel5
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.6
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 5.7.1
    text: |-
      De aanbieder van een openbaar elektronisch communicatienetwerk vergoedt aan degene op wie de gedoogplicht rust de
      schade voortvloeiend uit de aanleg, instandhouding of opruiming van kabels.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.7
  - number: 5.7.2
    text: |-
      Het recht op schadevergoeding beperkt zich voor rechthebbenden op en beheerders van openbare gronden tot vergoeding
      van de marktconforme kosten van de voorzieningen en van de meerdere marktconforme kosten van onderhoud.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.7
  - number: 5.7.3
    text: |-
      Na het beëindigen van de werkzaamheden in verband met de aanleg, instandhouding of opruiming van kabels brengt de
      aanbieder van een openbaar elektronisch communicatienetwerk de grond terug in de oude staat, tenzij degene op wie
      de gedoogplicht rust, heeft aangegeven hier zelf voor te willen zorgdragen. De aanbieder draagt de marktconforme
      kosten die nodig zijn voor het terugbrengen van de grond in de oude staat.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.7
  - number: 5.7.4
    text: |-
      Onder marktconforme kosten wordt in dit verband verstaan kosten zoals deze door een onderneming onder normale
      omstandigheden in een markteconomie op de desbetreffende markt worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.7
  - number: 5.8.1
    text: |-
      De aanbieder van een openbaar elektronisch communicatienetwerk is verplicht op eigen kosten over te gaan tot het
      nemen van maatregelen ten aanzien van kabels ten dienste van zijn netwerk, waaronder het verplaatsen van kabels, op
      verzoek van:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.8
  - number: 5.8.1.a
    text: degene op wie de gedoogplicht rust,
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.8
  - number: 5.8.1.b
    text: |-
      degene die van de rechthebbende een huurrecht, of een recht van erfpacht of opstal, of een gebruiksrecht strekkende
      tot de oprichting van gebouwen of de uitvoering van werken heeft verkregen,
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.8
  - number: 5.8.2
    text: |-
      Indien degene, bedoeld in het eerste lid, onderdelen a en b, jegens een derde gehouden is grond, die door degene,
      bedoeld in het eerste lid, onderdelen a en b, is bestemd voor het oprichten van een of meer gebouwen, zodanig
      te leveren dat die derde na verkrijging van de grond bij het door of vanwege hem oprichten van een of meer
      gebouwen niet gehinderd wordt door de in de grond aanwezige kabels ten dienste van een openbaar elektronisch
      communicatienetwerk, is het eerste lid van overeenkomstige toepassing. De oprichting van een of meer gebouwen dient
      op het moment dat een verzoek wordt gedaan voldoende bepaalbaar te zijn.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.8
  - number: 5.8.3
    text: |-
      Indien de aanbieder kabels heeft verplaatst op grond van het eerste en tweede lid, en naderhand blijkt dat de door
      gedoogplichtige aangekondigde werkzaamheden, waarvoor deze verplaatsing nodig was, niet hebben plaatsgevonden,
      heeft de aanbieder recht op vergoeding van de door hem gemaakte kosten.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.8
  - number: 5.8.4
    text: |-
      Indien binnen vijf jaar na een verzoek tot het nemen van maatregelen op grond van het eerste of tweede lid opnieuw
      een verzoek wordt gedaan door degene, bedoeld in het eerste lid, onderdelen a en b, komen de daarmee verbonden
      kosten voor rekening van degene, bedoeld in het eerste lid, onderdelen a en b.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.8
  - number: 5.8.5
    text: |-
      In andere gevallen dan bedoeld in het eerste of tweede lid, is de aanbieder slechts verplicht over te gaan tot
      maatregelen, waaronder het verplaatsen van de kabels, indien degene, bedoeld in het eerste lid, onderdelen a en b,
      hem de kosten daarvan vergoedt.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.8
  - number: 5.8.6
    text: |-
      Ingeval een verzoek tot het nemen van maatregelen is gedaan, gaat de aanbieder zo snel mogelijk over tot de
      gevraagde maatregelen, doch niet later dan zestien weken na de datum van ontvangst van het verzoek. Indien het
      verzoek het verplaatsen van kabels betreft gaat de aanbieder zo snel mogelijk over tot de gevraagde verplaatsing,
      doch niet later dan twaalf weken nadat een plaats waar de kabels kunnen worden gelegd beschikbaar is gekomen.
      Het verzoek bevat een omschrijving van de op te richten gebouwen dan wel de uit te voeren werken en in geval het
      verzoek een verplaatsing van kabels betreft voor zover mogelijk een voorstel voor de plaats waar de kabels kunnen
      worden aangelegd.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.8
  - number: 5.9.1
    text: |-
      De aanbieder van een openbaar elektronisch communicatienetwerk is verplicht op verzoek van: a. Onze Minister van
      Infrastructuur en Milieu, b. de beheerder als bedoeld in [artikel 1, eerste lid, van de Spoorwegwet][ref1], of
      c. een waterschap, op eigen kosten over te gaan tot het nemen van maatregelen ten aanzien van kabels ten dienste
      van zijn netwerk, waaronder het verplaatsen van kabels, voor zover deze noodzakelijk zijn voor de uitvoering
      van werken: 1°. waarvoor een ontwerp-tracébesluit als bedoeld in [artikel 11, derde lid, van de Tracéwet][ref2]
      is vastgesteld, 2°. ten behoeve van waterstaatswerken als bedoeld in [artikel 5.5 van de Waterwet][ref3]
      die in beheer zijn bij het Rijk of een waterschap en waarvoor een ontwerp van een projectplan als bedoeld
      in [artikel 5.4, eerste lid, van de Waterwet][ref4] is vastgesteld, ongeacht dat de beheerder, genoemd in de
      onderdelen a tot en met c, op het moment van het verzoek geen rechthebbende is op de betrokken gronden.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006147#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0025458#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0025458#Artikel5
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.9
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0006147
        artikel: '11'
      - id: ref3
        bwb_id: BWBR0025458
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0025458
        artikel: '5'
  - number: 5.9.2
    text: |-
      In afwijking van het eerste lid, heeft de aanbieder recht op vergoeding van de door hem gemaakte kosten ter
      uitvoering van een verzoek als bedoeld in het eerste lid, indien na verloop van drie jaar nadat dat verzoek is
      gedaan, de beheerder geen rechthebbende is op de betrokken gronden, noch een huurrecht, of een recht van erfpacht
      of opstal, of een gebruiksrecht strekkende tot de oprichting van gebouwen of de uitvoering van werken heeft
      verkregen van degene die rechthebbende is op de betrokken gronden.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.9
  - number: 5.9.3
    text: |-
      [Artikel 5.8, derde, vierde en zesde lid][ref1], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel5
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.9
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: '5.10'
    text: |-
      De aanleg, instandhouding en opruiming van kabels ten dienste van een openbaar elektronisch communicatienetwerk
      geschiedt op zodanige wijze dat bomen en beplantingen zoveel mogelijk worden beschermd en de mogelijkheid tot groei
      niet wordt ontnomen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.10
  - number: 5.11.1
    text: |-
      Rechthebbenden op bomen of beplantingen of de beheerders van de grond waarop de bomen of beplantingen zich bevinden
      zijn verplicht op schriftelijk verzoek van de aanbieder van een openbaar elektronisch communicatienetwerk binnen
      twee weken de wortels daarvan in te korten, voor zover deze redelijkerwijs hinderlijk zijn of worden voor de
      instandhouding van kabels ten dienste van het netwerk waardoor de exploitatie van het netwerk in gevaar komt.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.11
  - number: 5.11.2
    text: |-
      In geval van ernstige belemmering of storing van de communicatie kan een aanbieder van een openbaar elektronisch
      communicatienetwerk onmiddellijk tot het inkorten van wortels overgaan, waarna deze zo spoedig mogelijk
      hiervan schriftelijk aan de rechthebbende of beheerder kennis geeft, doch niet later dan de dag volgend op de
      werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.11
  - number: 5.11.3
    text: |-
      De aanbieder van een openbaar elektronisch communicatienetwerk vergoedt aan de rechthebbende of beheerder de schade
      voortvloeiend uit het inkorten van wortels.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.11
  - number: 5.12.1
    text: |-
      Aanbieders van openbare elektronische communicatienetwerken zijn over en weer verplicht te voldoen aan redelijke
      verzoeken tot het medegebruik van de voorzieningen waarop de gedoogplicht van toepassing is. Hierbij worden in
      ieder geval de technische mogelijkheden in acht genomen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.12
  - number: 5.12.2
    text: |-
      In het geval dat voor het verlenen van medegebruik toestemming van een derde is vereist, is deze daartoe slechts
      gehouden indien het een redelijk verzoek betreft en hij:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.12
  - number: 5.12.2.a
    text: |-
      direct of indirect een relevant economisch belang heeft in de aanbieder, bedoeld in het eerste lid, tot wie het
      verzoek is gericht;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.12
  - number: 5.12.2.b
    text: |-
      deel uitmaakt van een groep als bedoeld in [artikel 24b van boek 2 van het Burgerlijk Wetboek][ref1] waartoe een
      andere groepsmaatschappij als bedoeld in dat artikel behoort, die een direct of indirect relevant economisch belang
      heeft in de aanbieder.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.12
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
  - number: 5.12.3
    text: |-
      De aanbieder, bedoeld in het eerste lid, en de derde die op grond van het tweede lid gehouden is toestemming te
      verlenen, stellen het medegebruik ter beschikking tegen een redelijke vergoeding.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.12
  - number: 5.12.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels gesteld worden met betrekking tot het in het
      eerste lid bedoelde medegebruik van voorzieningen en de in het derde lid bedoelde vergoeding.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.12
  - number: 5.13.1
    text: |-
      De kantonrechter van de rechtbank van het arrondissement, waarin de onroerende zaak waarin, waarop of waarboven
      de kabels ten dienste van een openbaar elektronisch communicatienetwerk worden aangelegd, instandgehouden of
      opgeruimd, zich geheel of grotendeels bevindt, is, ongeacht de hoogte van de vordering, bevoegd geschillen inzake
      een eis tot schadevergoeding op grond van dit hoofdstuk te beslissen, alsmede geschillen inzake de hoogte van de
      kosten van het nemen van maatregelen, bedoeld in de [artikelen 5.8][ref1] en [5.9][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel5
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.13
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 5.13.2
    text: Van de uitspraak van de kantonrechter is hoger beroep toegelaten.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.13
  - number: 5.13.3
    text: |-
      De bepalingen van het [Wetboek van Burgerlijke Rechtsvordering][ref1] zijn van toepassing op de geschillen, bedoeld
      in het eerste lid, voor zover daarvan in de voorgaande leden van dit artikel niet is afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.13
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: 5.13.4
    text: |-
      Ook voordat omtrent de schadevergoeding of de hoogte van de kosten overeenstemming verkregen of uitspraak gedaan
      is, kan tot uitvoering van de werkzaamheden, bedoeld in de [artikelen 5.2][ref1], [5.8][ref2], [5.9][ref3] en
      [5.11][ref4], worden overgegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0009950#Artikel5
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.13
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
      - id: ref3
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
      - id: ref4
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 5.14.1
    text: |-
      Indien een gemeente openbare elektronische communicatienetwerken of openbare elektronische communicatiediensten
      aanbiedt, of een belang of zeggenschap heeft in een onderneming die dit doet, zijn de personen die besluiten
      voorbereiden als bedoeld in [artikel 5.4, eerste lid, onder b][ref1], daarbij niet betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel5
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.14
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 5.14.2
    text: |-
      Het voornemen om direct of indirect betrokken te zijn bij het aanbieden van openbare elektronische
      communicatienetwerken of openbare elektronische communicatiediensten wordt bekend gemaakt.
      [Artikel 3:42 van de Algemene wet bestuursrecht][ref1] is van toepassing. Bij de bekendmaking van het voornemen
      wordt de redengeving ervan vermeld. Tevens wordt bekendgemaakt waar en wanneer nadere informatie over het voornemen
      van de te nemen beslissing kan worden verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.14
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 5.14.3
    text: |-
      Bij de toepassing van [artikel 5.4, tweede lid][ref1], bevoordelen burgemeester en wethouders geen ondernemingen
      die openbare elektronische communicatienetwerken aanbieden waarin de gemeente direct of indirect bij betrokken is.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel5
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.14
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 5.14.4
    text: |-
      Een gemeente die direct of indirect betrokken is bij het aanbieden van een openbaar elektronisch
      communicatienetwerk bevordert open en non-discriminatoire toegang tot dit netwerk.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.14
  - number: '5.15'
    text: |-
      Dit hoofdstuk is van overeenkomstige toepassing op de aanleg, instandhouding en opruiming van ondergrondse
      ondersteuningswerken en beschermingswerken waarin of waarop geen fysieke geleidingsdraden bestemd voor de
      rechtstreekse overdracht van signalen tussen punten zijn aangebracht, en die aangelegd worden of zijn met het
      oogmerk deel uit te gaan maken van een openbaar elektronisch communicatienetwerk van degene in wiens naam wordt
      aangelegd of een derde.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.15
  - number: '5.16'
    text: |-
      Voor de toepassing van dit hoofdstuk, met uitzondering van [artikel 5.12][ref1], wordt gelijkgesteld met een
      openbaar elektronisch communicatienetwerk een door Onze Minister aangewezen elektronisch communicatienetwerk dat
      geheel of hoofdzakelijk gebruikt wordt voor publieke taken.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel5
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.16
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: '5.17'
    text: |-
      De [artikelen 17, eerste lid, onder k, van Boek 3 van het Burgerlijk Wetboek][ref1],
      [20, tweede lid, van Boek 5 van het Burgerlijk Wetboek][ref2], [36, vierde lid, Kadasterwet][ref3] en
      [78, derde en vierde lid][ref4], en [155 van de Overgangswet nieuw Burgerlijk Wetboek][ref5] zijn van
      overeenkomstige toepassing op ondergrondse ondersteuningswerken en beschermingswerken als bedoeld in
      [artikel 5.15][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0005288#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0004541#Artikel36
      [ref4]: https://wetten.overheid.nl/BWBR0002565#Artikel78
      [ref5]: https://wetten.overheid.nl/BWBR0002565#Artikel155
      [ref6]: https://wetten.overheid.nl/BWBR0009950#Artikel5
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel5.17
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0005288
        artikel: '20'
      - id: ref3
        bwb_id: BWBR0004541
        artikel: '36'
      - id: ref4
        bwb_id: BWBR0002565
        artikel: '78'
      - id: ref5
        bwb_id: BWBR0002565
        artikel: '155'
      - id: ref6
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 6.1.1
    text: |-
      Een aanbieder van openbare elektronische communicatienetwerken of openbare elektronische communicatiediensten, die
      daarbij de toegang tot eindgebruikers controleert, treedt op verzoek van een aanbieder van openbare elektronische
      communicatienetwerken of openbare elektronische communicatiediensten met die aanbieder in onderhandeling met het
      oog op het sluiten van een overeenkomst op basis waarvan de nodige maatregelen worden genomen, waaronder zo nodig
      door middel van interconnectie van de betrokken netwerken, opdat eind- tot eindverbindingen tot stand worden
      gebracht.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6.1
  - number: 6.1.2
    text: |-
      Aanbieders van elektronische communicatienetwerken of aanbieders van elektronische communicatiediensten mogen
      informatie die voor of tijdens onderhandelingen over interoperabiliteitovereenkomsten aan hen is verstrekt,
      alsmede informatie die bij de uitvoering van de overeenkomst is of kan worden verkregen uitsluitend gebruiken voor
      het doel waarvoor deze informatie is verstrekt, respectievelijk uitsluitend gebruiken voor de uitvoering van de
      overeenkomst. De verkregen of opgeslagen informatie wordt vertrouwelijk behandeld en wordt niet doorgegeven aan
      enige andere partij, in het bijzonder andere afdelingen, dochterondernemingen of partners, die door die informatie
      concurrentievoordeel zouden kunnen behalen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6.1
  - number: 6.1.3
    text: |-
      De Autoriteit Consument en Markt kan op aanvraag van een aanbieder van openbare elektronische communicatienetwerken
      of openbare elektronische communicatiediensten die van mening is dat een andere aanbieder jegens hem de
      verplichting tot onderhandelen niet nakomt, voorschriften geven met betrekking tot de wijze waarop de
      onderhandelingen gevoerd moeten worden, onverminderd het recht van aanbieders gezamenlijk de onderhandelingen te
      beëindigen. De betrokken aanbieders houden zich bij hun onderhandelingen aan de door de Autoriteit Consument en
      Markt gegeven voorschriften.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6.1
  - number: 6.2.1
    text: |-
      Indien de onderhandelingen, bedoeld in [artikel 6.1][ref1], niet resulteren in een overeenkomst tussen de in dat
      artikel bedoelde aanbieders, kan de Autoriteit Consument en Markt op aanvraag van een van hen, voor zover naar het
      oordeel van de Autoriteit Consument en Markt verdere onderhandelingen redelijkerwijs niet meer zullen leiden tot
      een overeenkomst, de andere betrokken aanbieder, voor zover deze daarbij de toegang tot eindgebruikers controleert,
      verplichten de door de aanvrager gewenste eind- tot eindverbindingen tot stand te brengen en te waarborgen onder
      door de Autoriteit Consument en Markt te bepalen voorwaarden, indien de Autoriteit Consument en Markt van oordeel
      is dat de belangen van de andere aanbieder die ertoe geleid hebben dat er geen overeenkomst tot stand is gekomen
      redelijkerwijs niet opwegen tegen de belangen van de indiener van het verzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.2.2
    text: |-
      De Autoriteit Consument en Markt kan voorts ambtshalve, al dan niet in het kader van een aanvraag als bedoeld
      in het eerste lid, aanbieders van openbare elektronische communicatienetwerken of openbare elektronische
      communicatiediensten, die daarbij de toegang tot eindgebruikers controleren, verplichtingen opleggen met betrekking
      tot het tot stand brengen en waarborgen van eind- tot eindverbindingen, indien dit in het voorliggende geval in het
      licht van de doelstellingen, bedoeld in [artikel 1.3][ref1] gerechtvaardigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel1
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '1'
        hoofdstuk: '1'
  - number: 6.2.3
    text: |-
      Op een besluit van de Autoriteit Consument en Markt op een aanvraag als bedoeld in het eerste en tweede lid is
      [artikel 12.5, eerste en derde lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel12
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '12'
        hoofdstuk: '12'
        paragraaf: '12.2'
  - number: 6.2.4
    text: Van een besluit als bedoeld in het eerste of tweede lid wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6.2
  - number: '6.4'
    text: |-
      Voorschriften als bedoeld in artikel 6.1, derde lid, of verplichtingen als bedoeld in artikel 6.2, eerste of tweede
      lid, zijn objectief, transparant, proportioneel en niet-discriminerend.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6.4
  - number: 6.5.1
    text: |-
      Aanbieders van openbare elektronische communicatienetwerken of openbare elektronische communicatiediensten
      die daarbij de toegang tot eindgebruikers controleren zorgen ervoor dat zich in de Europese Unie bevindende
      eindgebruikers toegang hebben tot alle:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6.5
  - number: 6.5.1.a
    text: in de Europese Unie toegekende nummers van een nationaal nummerplan,
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6.5
  - number: 6.5.1.b
    text: nummers van de Europese telefoonnnummerruimte, en
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6.5
  - number: 6.5.1.c
    text: door ITU toegekende nummers,
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6.5
  - number: 6.5.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regel worden gesteld ter waarborging van de
      verplichting, bedoeld in het eerste lid. Deze regels kunnen onder meer betrekking hebben op de vergoedingen voor de
      toegang tot de in het eerste lid, bedoelde nummers.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6.5
  - number: 6.5.3
    text: |-
      De regels, bedoeld in het tweede lid, kunnen voor bij die regels te bepalen categorieën van aanbieders, als bedoeld
      in het eerste lid, verschillen. Bij die regels kunnen taken worden opgedragen en bevoegdheden worden verleend aan
      de Autoriteit Consument en Markt.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6.5
  - number: '6.6'
    text: |-
      [Artikel 6.1, tweede lid][ref1], is van overeenkomstige toepassing op onderhandelingen tot het verkrijgen van
      toegang tot het netwerk van een aanbieder van elektronische communicatienetwerken.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6.6
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '6'
        hoofdstuk: '6'
  - number: 6a.1.1
    text: |-
      De Autoriteit Consument en Markt bepaalt in overeenstemming met de beginselen van het algemene Europese
      mededingingsrecht de relevante markten in de elektronische communicatiesector waarvan de product- of dienstenmarkt
      overeenkomt met een in een aanbeveling als bedoeld in artikel 15, eerste lid, van [richtlijn nr. 2002/21/EG]
      (32002L0021) vermelde product- of dienstenmarkt. De Autoriteit Consument en Markt bepaalt in elk geval zo spoedig
      mogelijk nadat een aanbeveling als bedoeld in de eerste volzin in werking is getreden, de in die volzin bedoelde
      relevante markten.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.1
  - number: 6a.1.2
    text: |-
      De Autoriteit Consument en Markt bepaalt in overeenstemming met de beginselen van het algemene Europese
      mededingingsrecht andere dan de in het eerste lid bedoelde relevante markten in de elektronische communicatiesector
      indien hier naar haar oordeel aanleiding toe is, of indien dit voortvloeit uit [artikel 6a.4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.1
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
  - number: 6a.1.3
    text: |-
      De Autoriteit Consument en Markt onderzoekt de overeenkomstig het eerste en tweede lid, bepaalde relevante markten
      zo spoedig mogelijk, doch voor markten waarvoor nog niet eerder een kennisgeving bij de Europese Commissie is
      gedaan uiterlijk binnen twee jaar, nadat een aanbeveling als bedoeld in artikel 15, eerste lid, van richtlijn
      nr. 2002/21/EG in werking is getreden. De termijn van twee jaar kan door de Autoriteit Consument en Markt worden
      verlengd met zes maanden indien de Autoriteit Consument en Markt met bijstand van BEREC de relevante markten
      onderzoekt.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.1
  - number: 6a.1.4
    text: |-
      De Autoriteit Consument en Markt onderzoekt een transnationale markt zo spoedig mogelijk nadat een beschikking van
      de Europese Commissie die hieraan ten grondslag ligt in werking is getreden en vervolgens op gezette tijden.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.1
  - number: 6a.1.5
    text: 'Het in het derde en vierde lid bedoelde onderzoek is er in ieder geval op gericht om vast te stellen:'
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.1
  - number: 6a.1.5.a
    text: |-
      of de desbetreffende markt al dan niet daadwerkelijk concurrerend is en of hierop ondernemingen die openbare
      elektronische communicatienetwerken, bijbehorende faciliteiten of openbare elektronische communicatiediensten
      aanbieden actief zijn die beschikken over een aanmerkelijke marktmacht, en
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.1
  - number: 6a.1.5.b
    text: |-
      welke verplichtingen als bedoeld in de [artikelen 6a.6 tot en met 6a.10][ref1] en [6a.12 tot en met 6a.15][ref2]
      passend zijn voor de onder a bedoelde ondernemingen die beschikken over een aanmerkelijke marktmacht.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.1
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.2
      - id: ref2
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.3
  - number: 6a.1.6
    text: |-
      Nadat het onderzoek als bedoeld in het derde of vierde lid is afgerond, geeft de Autoriteit Consument en Markt zo
      spoedig mogelijk uitvoering aan de [artikelen 6a.2, eerste lid][ref1], of [6a.3][ref2], doch voor relevante markten
      waarvoor nog niet eerder een kennisgeving bij de Europese Commissie is gedaan uiterlijk binnen de in het derde lid,
      bedoelde termijn van twee jaar. De termijn van twee jaar kan door de Autoriteit Consument en Markt worden verlengd
      met zes maanden indien de Autoriteit Consument en Markt met bijstand van BEREC de relevante markten onderzoekt.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.1
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
      - id: ref2
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
  - number: 6a.1.7
    text: |-
      De Autoriteit Consument en Markt houdt bij de uitoefening van haar taken en bevoegdheden op grond van dit
      hoofdstuk rekening met door de Europese Commissie krachtens artikel 15, tweede lid, van [richtlijn nr. 2002/21/EG]
      (32002L0021) vastgestelde richtsnoeren.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.1
  - number: 6a.1.8
    text: |-
      Bij het beoordelen of twee of meer ondernemingen tezamen beschikken over een economische kracht als bedoeld in
      [artikel 1.1][ref1], hanteert de Autoriteit Consument en Markt in elk geval de criteria bedoeld in bijlage II van
      [richtlijn nr. 2002/21/EG](32002L0021).


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel1
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.1
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '1'
        hoofdstuk: '1'
  - number: 6a.1.9
    text: |-
      De Autoriteit Consument en Markt oefent bij transnationale markten haar taken en bevoegdheden op grond van dit
      hoofdstuk uit in samenspraak met de betrokken nationale regelgevende instanties.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.1
  - number: 6a.2.1
    text: |-
      Indien uit een onderzoek als bedoeld in [artikel 6a.1, derde of vierde lid][ref1], blijkt dat een relevante markt
      onderscheidenlijk een transnationale markt niet daadwerkelijk concurrerend is, stelt de Autoriteit Consument en
      Markt vast welke ondernemingen die openbare elektronische communicatienetwerken, bijbehorende faciliteiten of
      openbare elektronische communicatiediensten aanbieden, beschikken over een aanmerkelijke marktmacht, en:


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
  - number: 6a.2.1.a
    text: |-
      legt zij ieder van hen, voor zover passend, verplichtingen als bedoeld in de
      [artikelen 6a.6 tot en met 6a.10][ref1] of [6a.12 tot en met 6a.15][ref2] op;


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.2
      - id: ref2
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.3
  - number: 6a.2.1.b
    text: |-
      houdt zij eerder opgelegde of in stand gehouden verplichtingen, voor zover zij betrekking hebben op deze markt, in
      stand indien zij nog steeds passend zijn, of
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.2
  - number: 6a.2.1.c
    text: |-
      trekt zij eerder opgelegde of in stand gehouden verplichtingen, voor zover zij betrekking hebben op deze markt, in
      indien zij niet langer passend zijn.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.2
  - number: 6a.2.2
    text: 'De Autoriteit Consument en Markt legt op grond van het eerste lid, onderdeel a:'
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.2
  - number: 6a.2.2.a
    text: |-
      verplichtingen als bedoeld in de [artikelen 6a.6 tot en met 6a.10][ref1] alleen op aan ondernemingen die openbare
      elektronische communicatienetwerken of bijbehorende faciliteiten aanbieden;


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.2
  - number: 6a.2.2.b
    text: |-
      verplichtingen als bedoeld in [artikel 6a.12 tot en met 6a.15][ref1] alleen op, indien de relevante markt
      onderscheidenlijk transnationale markt een eindgebruikersmarkt is en de verplichtingen, bedoeld in de
      [artikelen 6a.6 tot en met 6a.11][ref2] ontoereikend zijn om daadwerkelijke concurrentie te verwezenlijken of de
      belangen van eindgebruikers te beschermen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.3
      - id: ref2
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.2
  - number: 6a.2.3
    text: |-
      Een verplichting als bedoeld in het eerste lid, is passend indien deze gebaseerd is op de aard van het op de
      desbetreffende markt geconstateerde probleem en in het licht van de doelstellingen van [artikel 1.3][ref1]
      proportioneel en gerechtvaardigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel1
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '1'
        hoofdstuk: '1'
  - number: 6a.2.4
    text: |-
      Bij de beoordeling of het opleggen van een verplichting om te voldoen aan redelijke verzoeken tot toegang als
      bedoeld in [artikel 6a.6][ref1] passend is, houdt de Autoriteit Consument en Markt met name rekening met de
      factoren, bedoeld in artikel 12, tweede lid, van [richtlijn nr. 2002/19/EG](32002L0019).


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.2
  - number: 6a.3.1
    text: |-
      Indien uit een onderzoek als bedoeld in [artikel 6a.1, derde of vierde lid][ref1], blijkt dat een relevante markt
      onderscheidenlijk een transnationale markt daadwerkelijk concurrerend is, bepaalt de Autoriteit Consument en Markt
      dit en trekt zij eerder krachtens [artikel 6a.2, eerste lid][ref2], opgelegde of in stand gehouden verplichtingen,
      voor zover zij betrekking hebben op die markt, in.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
      - id: ref2
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
  - number: 6a.3.2
    text: |-
      Indien uit een onderzoek als bedoeld in [artikel 6a.1, derde of vierde lid][ref1], blijkt dat een onderneming op
      een niet daadwerkelijk concurrerende relevante markt onderscheidenlijk transnationale markt moet voldoen aan eerder
      krachtens [artikel 6a.2, eerste lid][ref2], opgelegde of in stand gehouden verplichtingen, trekt de Autoriteit
      Consument en Markt deze verplichtingen, voor zover zij betrekking hebben op die markt, in, indien de onderneming op
      die relevante markt onderscheidenlijk transnationale markt niet beschikt over een aanmerkelijke marktmacht.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
      - id: ref2
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
  - number: 6a.3.3
    text: |-
      Indien uit een onderzoek als bedoeld in [artikel 6a.1, derde of vierde lid][ref1], blijkt dat een relevante
      markt onderscheidenlijk transnationale markt niet daadwerkelijk concurrerend is en de verplichtingen,
      bedoeld in de [artikelen 6a.6 tot en met 6a.11][ref2], toereikend zijn om daadwerkelijke concurrentie te
      verwezenlijken of de belangen van eindgebruikers te beschermen, trekt de Autoriteit Consument en Markt eerder
      krachtens [artikel 6a.2, eerste lid][ref3], opgelegde of in stand gehouden verplichtingen als bedoeld in de
      [artikelen 6a.12 tot en met 6a.15][ref4], voor zover zij betrekking hebben op die markt, in.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref4]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
      - id: ref2
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.2
      - id: ref3
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
      - id: ref4
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.3
  - number: 6a.4.1
    text: |-
      Uiterlijk binnen drie jaar nadat een besluit als bedoeld in [artikel 6a.2, eerste lid][ref1], inzake het opleggen
      of in stand houden van verplichtingen met betrekking tot een onderneming die beschikt over een aanmerkelijke macht
      op een relevante markt in werking is getreden, besluit de Autoriteit Consument en Markt op grond van:


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.4
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
  - number: 6a.4.1.a
    text: |-
      [artikel 6a.2, eerste lid, onderdeel b][ref1], om deze verplichtingen in stand te houden, of


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.4
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
  - number: 6a.4.1.b
    text: |-
      de [artikelen 6a.2, eerste lid, onderdeel c][ref1], of [6a.3][ref2] om deze verplichtingen in te trekken.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.4
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
      - id: ref2
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
  - number: 6a.4.2
    text: |-
      De termijn van drie jaar, bedoeld in het eerste lid, kan in uitzonderlijke gevallen door de Autoriteit Consument
      en Markt worden verlengd met ten hoogste drie jaar indien de Autoriteit Consument en Markt daartoe bij de Europese
      Commissie een gemotiveerd verzoek heeft ingediend en de Europese Commissie niet binnen een maand na ontvangst van
      dat verzoek bezwaar heeft gemaakt tegen de verlenging. Voorts wordt deze termijn verlengd met zes maanden indien
      de Autoriteit Consument en Markt met bijstand van BEREC de relevante markten en de verplichtingen, bedoeld in het
      eerste lid, onderzoekt.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.4
  - number: 6a.4a.1
    text: |-
      Indien naar het oordeel van de Autoriteit Consument en Markt na het opleggen van een verplichting als bedoeld
      in de [artikelen 6a.6 tot en met 6a.10][ref1], voor zover deze passend zijn, die verplichtingen ontoereikend
      zijn gebleken om daadwerkelijke en duurzame op infrastructuur gegronde concurrentie te verwezenlijken op een
      relevante markt onderscheidenlijk een transnationale markt, kan de Autoriteit Consument en Markt die onderneming de
      verplichting opleggen om de activiteiten die verband houden met het aanbieden van door de Autoriteit Consument en
      Markt te bepalen vormen van toegang in een zelfstandig opererende bedrijfseenheid te plaatsen en deze activiteiten
      te leveren aan alle ondernemingen onder dezelfde voorwaarden en prijzen en door middel van dezelfde systemen en
      processen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.4a
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.2
  - number: 6a.4a.2
    text: |-
      De Autoriteit Consument en Markt gaat in het besluit, bedoeld in het eerste lid, in ieder geval in op de volgende
      elementen:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.4a
  - number: 6a.4a.2.a
    text: |-
      de exacte aard en het niveau van de scheiding, waarbij met name de rechtsstatus van de zelfstandig opererende
      bedrijfseenheid wordt vermeld;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.4a
  - number: 6a.4a.2.b
    text: |-
      de identificatie van de activa van de zelfstandig opererende bedrijfseenheid en de producten of diensten die door
      deze bedrijfseenheid worden geleverd;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.4a
  - number: 6a.4a.2.c
    text: |-
      bestuursregelingen om te zorgen voor de onafhankelijkheid van het personeel dat in dienst is bij de afzonderlijke
      bedrijfseenheid, en de dienovereenkomstige stimulerende structuur;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.4a
  - number: 6a.4a.2.d
    text: de voorschriften om te zorgen voor naleving van de wetgeving;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.4a
  - number: 6a.4a.2.e
    text: de voorschriften om te zorgen voor transparantie van de operationele procedures;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.4a
  - number: 6a.4a.2.f
    text: een instrument om de mate van naleving van het besluit, bedoeld in het eerste lid, jaarlijks te meten, en
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.4a
  - number: 6a.4a.2.g
    text: publicatie in het jaarverslag van de resultaten van de meting, bedoeld in onderdeel f.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.4a
  - number: 6a.4a.3
    text: |-
      De Autoriteit Consument en Markt kan in het besluit, bedoeld in het eerste lid, verplichtingen opleggen ten
      aanzien van de elementen, bedoeld in het tweede lid, voor zover dat nodig is om te waarborgen dat de zelfstandige
      bedrijfseenheid de activiteiten die verband houden met het aanbieden van door de Autoriteit Consument en Markt te
      bepalen vormen van toegang aan alle ondernemingen onder dezelfde voorwaarden en prijzen levert.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.4a
  - number: 6a.4a.4
    text: |-
      De Autoriteit Consument en Markt legt het ontwerp van het besluit, bedoeld in het eerste lid, en de gronden die aan
      het ontwerpbesluit ten grondslag liggen voor aan de Europese Commissie, en voegt het volgende bij:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.4a
  - number: 6a.4a.4.a
    text: het bewijs dat het ontwerpbesluit is gerechtvaardigd;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.4a
  - number: 6a.4a.4.b
    text: |-
      een gemotiveerde evaluatie waaruit blijkt dat er binnen een redelijke termijn weinig of geen kans is op
      daadwerkelijke en duurzame op infrastructuur gegronde concurrentie;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.4a
  - number: 6a.4a.4.c
    text: |-
      een analyse van de verwachte impact van het ontwerpbesluit op de Autoriteit Consument en Markt, de onderneming, de
      werknemers van de onderneming, de elektronische communicatiesector als geheel en de stimuli om in deze sector als
      een geheel te investeren, de sociale en territoriale cohesie, en op andere belanghebbenden alsmede de verwachte
      impact op de mededinging op het gebied van infrastructuur en gevolgen voor de consument, en
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.4a
  - number: 6a.4a.4.d
    text: |-
      een analyse van de redenen waarom deze verplichting het efficiëntste middel zou zijn om de geïdentificeerde
      mededingingsproblematiek of markttekortkomingen op te lossen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.4a
  - number: 6a.4a.5
    text: |-
      De Autoriteit Consument en Markt kan de verplichting tot functionele scheiding pas opleggen nadat de Europese
      Commissie ten aanzien van het ontwerpbesluit, bedoeld in het eerste lid, een besluit heeft genomen dat de
      Autoriteit Consument en Markt toestaat een verplichting tot functionele scheiding op te leggen. De Autoriteit
      Consument en Markt stelt in dit besluit tevens vast of ingevolge de in het eerste lid bedoelde verplichting op de
      betrokken relevante markt tevens verplichtingen als bedoeld in de [artikelen 6a.6 tot en met 6a.10][ref1], op grond
      van:


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.4a
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.2
  - number: 6a.4a.5.a
    text: |-
      [artikel 6a.2, eerste lid, onderdeel a][ref1], worden opgelegd,


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.4a
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
  - number: 6a.4a.5.b
    text: |-
      [artikel 6a.2, eerste lid, onderdeel b][ref1], in stand gehouden worden, of


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.4a
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
  - number: 6a.4a.5.c
    text: |-
      [de artikelen 6a.2, eerste lid, onderdeel c][ref1], ingetrokken worden.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.4a
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
  - number: 6a.4a.6
    text: |-
      De Autoriteit Consument en Markt stelt voorts vast of ingevolge het in het eerste lid bedoelde besluit tevens op
      aan het toegangsnetwerk verbonden markten verplichtingen, bedoeld in de [artikelen 6a.6 tot en met 6a.10][ref1] en
      [6a.12 tot en met 6a.15][ref2], op grond van:


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.4a
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.2
      - id: ref2
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.3
  - number: 6a.4a.6.a
    text: |-
      [artikel 6a.2, eerste lid, onderdeel a][ref1], worden opgelegd,


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.4a
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
  - number: 6a.4a.6.b
    text: |-
      [artikel 6a.2, eerste lid, onderdeel b][ref1], in stand gehouden worden, of


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.4a
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
  - number: 6a.4a.6.c
    text: |-
      [de artikelen 6a.2, eerste lid, onderdeel c][ref1], of [6a.3][ref2], ingetrokken worden.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.4a
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
      - id: ref2
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
  - number: 6a.4b.1
    text: |-
      Een onderneming waarvan de Autoriteit Consument en Markt overeenkomstig [artikel 6a.2, eerste lid][ref1], heeft
      vastgesteld dat die beschikt over een aanmerkelijke marktmacht, informeert de Autoriteit Consument en Markt over
      de beslissing van het bestuur van de onderneming om de activiteiten die verband houden met het aanbieden van vormen
      van toegang op groothandelsniveau:


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.4b
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
  - number: 6a.4b.1.a
    text: geheel of grotendeels over te dragen aan een onafhankelijke juridische eenheid met een andere eigenaar, of
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.4b
  - number: 6a.4b.1.b
    text: |-
      voor een belangrijk deel in een zelfstandig opererende bedrijfseenheid te plaatsen, teneinde aan alle ondernemingen
      gelijkwaardige vormen van toegang aan te bieden onder dezelfde voorwaarden en prijzen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.4b
  - number: 6a.4b.2
    text: |-
      Zo spoedig mogelijk, doch uiterlijk binnen twee jaar na ontvangst van een beslissing van het bestuur als bedoeld in
      het eerste lid, stelt de Autoriteit Consument en Markt in een ontwerpbesluit vast of de verplichtingen als bedoeld
      in de [artikelen 6a.6 tot en met 6a.10][ref1] of [6a.12 tot en met 6a.15][ref2] op de betrokken markt en op de aan
      het toegangsnetwerk verbonden markten op grond van:


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.4b
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.2
      - id: ref2
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.3
  - number: 6a.4b.2.a
    text: |-
      [artikel 6a.2, eerste lid, onderdeel a][ref1], worden opgelegd,


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.4b
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
  - number: 6a.4b.2.b
    text: |-
      [artikel 6a.2, eerste lid, onderdeel b][ref1], in stand gehouden worden, of


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.4b
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
  - number: 6a.4b.2.c
    text: |-
      de [artikelen 6a.2, eerste lid, onderdeel c][ref1], of [6a.3][ref2], ingetrokken worden.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.4b
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
      - id: ref2
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
  - number: 6a.4b.3
    text: |-
      De onderneming die de Autoriteit Consument en Markt heeft geïnformeerd over een beslissing, bedoeld in het eerste
      lid, informeert de Autoriteit Consument en Markt tevens zo spoedig mogelijk over wijzigingen van die beslissing en
      over het tijdstip waarop de beslissing is uitgevoerd. Voorts verstrekt de onderneming desgevraagd alle informatie
      die de Autoriteit Consument en Markt nodig heeft voor het nemen van het besluit, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.4b
  - number: 6a.4b.4
    text: |-
      Zo spoedig mogelijk, doch uiterlijk binnen vier weken na vaststelling van het ontwerpbesluit als bedoeld
      in het tweede lid, beslist de Autoriteit Consument en Markt of de verplichtingen als bedoeld in de
      [artikelen 6a.6 tot en met 6a.10][ref1] of [6a.12 tot en met 6a.15][ref2] op de betrokken markt en op de aan het
      toegangsnetwerk verbonden markten op grond van:


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.4b
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.2
      - id: ref2
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.3
  - number: 6a.4b.4.a
    text: |-
      [artikel 6a.2, eerste lid, onderdeel a][ref1], worden opgelegd


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.4b
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
  - number: 6a.4b.4.b
    text: |-
      [artikel 6a.2, eerste lid, onderdeel b][ref1], in stand gehouden worden, of


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.4b
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
  - number: 6a.4b.4.c
    text: |-
      de [artikelen 6a.2, eerste lid, onderdeel c][ref1], of [6a.3][ref2], ingetrokken worden.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.4b
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
      - id: ref2
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
  - number: 6a.4b.5
    text: |-
      Indien de onderneming voor het einde van de in het vierde lid genoemde termijn geen uitvoering heeft gegeven aan
      de beslissing van het bestuur als bedoeld in het eerste lid, stelt de Autoriteit Consument en Markt het besluit als
      bedoeld in het vierde lid eerst vast uiterlijk binnen vier weken nadat de onderneming uitvoering heeft gegeven aan
      die beslissing van het bestuur.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.4b
  - number: 6a.5
    text: |-
      Van een besluit als bedoeld in de [artikelen 6a.2, eerste lid][ref1], [6a.3][ref2], [6a.4a, eerste lid][ref3] en
      [6a.4b, vierde lid][ref4] wordt door de Autoriteit Consument en Markt mededeling gedaan in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref4]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.5
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
      - id: ref2
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
      - id: ref3
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
      - id: ref4
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
  - number: 6a.6.1
    text: |-
      De Autoriteit Consument en Markt kan op grond van [artikel 6a.2, eerste lid][ref1], de verplichting opleggen
      om te voldoen aan redelijke verzoeken tot door de Autoriteit Consument en Markt te bepalen vormen van toegang,
      onder andere indien de Autoriteit Consument en Markt van oordeel is dat het weigeren van toegang of het stellen
      van onredelijke voorwaarden met eenzelfde effect, de ontwikkeling van een door duurzame concurrentie gekenmerkte
      eindgebruikersmarkt zou belemmeren of niet in het belang van de eindgebruiker zou zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.6
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
  - number: 6a.6.2
    text: 'De verplichting, bedoeld in het eerste lid, kan onder meer inhouden dat de desbetreffende onderneming:'
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.6
  - number: 6a.6.2.a
    text: |-
      aanbieders van elektronische communicatiediensten toegang verleent tot bepaalde netwerkelementen of faciliteiten,
      met inbegrip van ontbundelde toegang tot het aansluitnetwerk;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.6
  - number: 6a.6.2.b
    text: te goeder trouw onderhandelt met aanbieders van elektronische communicatiediensten die verzoeken om toegang;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.6
  - number: 6a.6.2.c
    text: reeds verleende toegang tot faciliteiten niet intrekt;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.6
  - number: 6a.6.2.d
    text: |-
      op groothandelsbasis bepaalde diensten aanbiedt voor wederverkoop door aanbieders van elektronische
      communicatiediensten;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.6
  - number: 6a.6.2.e
    text: |-
      open toegang verleent tot technische interfaces, protocollen of andere kerntechnologieën die onmisbaar zijn voor de
      interoperabiliteit van openbare elektronische communicatiediensten of virtuele netwerkdiensten;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.6
  - number: 6a.6.2.f
    text: collocatie of andere vormen van gedeeld gebruik van bijbehorende faciliteiten aanbiedt;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.6
  - number: 6a.6.2.g
    text: |-
      bepaalde diensten aanbiedt die nodig zijn voor de interoperabiliteit van de aan gebruikers geleverde eind- tot
      einddiensten, inclusief faciliteiten voor intelligente netwerkdiensten of roaming binnen mobiele elektronische
      communicatienetwerken;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.6
  - number: 6a.6.2.h
    text: |-
      toegang verleent tot operationele ondersteuningssystemen of vergelijkbare softwaresystemen die nodig zijn om
      eerlijke concurrentie bij het aanbieden van elektronische communicatiediensten te waarborgen;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.6
  - number: 6a.6.2.i
    text: zorgt voor interconnectie van openbare elektronische communicatienetwerken of netwerkfaciliteiten;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.6
  - number: 6a.6.2.j
    text: toegang verschaffen tot bijbehorende diensten.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.6
  - number: 6a.6.3
    text: |-
      De Autoriteit Consument en Markt kan aan de verplichting, bedoeld in het eerste lid, voorschriften verbinden
      betreffende billijkheid, redelijkheid en opportuniteit.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.6
  - number: 6a.6.4
    text: |-
      Indien dit nodig is om de normale werking van het betrokken openbare elektronische communicatienetwerk te
      garanderen, kan de Autoriteit Consument en Markt technische of operationele voorschriften vaststellen die:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.6
  - number: 6a.6.4.a
    text: |-
      een onderneming waarvoor een verplichting geldt als bedoeld in het eerste lid bij het verlenen van toegang in acht
      neemt, of
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.6
  - number: 6a.6.4.b
    text: een onderneming die toegang heeft gekregen op basis van een verzoek als bedoeld in het eerste lid, in acht neemt.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.6
  - number: 6a.6.5
    text: |-
      [Artikel 6.4][ref1] is van overeenkomstige toepassing met betrekking tot voorschriften als bedoeld in het vierde
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.6
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '6'
        hoofdstuk: '6'
  - number: 6a.6.6
    text: |-
      Voor zover dat op grond van de notificatierichtlijn noodzakelijk is, stelt de Autoriteit Consument en Markt de
      voorschriften niet vast dan nadat de voorschriften aan de Europese Commissie in ontwerp zijn medegedeeld en de van
      toepassing zijnde termijnen, bedoeld in artikel 9 van de notificatierichtlijn, zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.6
  - number: 6a.6.7
    text: |-
      Voor zover de voorschriften technische normen of specificaties bevatten, stroken deze met de normen, bedoeld in
      artikel 17, eerste of tweede lid, van [richtlijn nr. 2002/21/EG](32002L0021).
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.6
  - number: 6a.7.1
    text: |-
      De Autoriteit Consument en Markt kan op grond van [artikel 6a.2, eerste lid][ref1], voor door de Autoriteit
      Consument en Markt te bepalen vormen van toegang een verplichting opleggen betreffende het beheersen van de
      hiervoor te rekenen tarieven of kostentoerekening indien uit een marktanalyse blijkt dat de betrokken exploitant
      de prijzen door het ontbreken van werkelijke concurrentie op een buitensporig hoog peil kan handhaven of de marges
      kan uithollen, in beide gevallen ten nadele van de eindgebruikers. Aan de verplichting kunnen door de Autoriteit
      Consument en Markt voorschriften worden verbonden die nodig zijn voor een goede uitvoering van de verplichting.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.7
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
  - number: 6a.7.2
    text: |-
      Een verplichting als bedoeld in het eerste lid kan inhouden dat voor toegang een kostengeoriënteerd
      tarief moet worden gerekend of dat een door de Autoriteit Consument en Markt te bepalen of goed te keuren
      kostentoerekeningssysteem moet worden gehanteerd.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.7
  - number: 6a.7.3
    text: |-
      Indien de Autoriteit Consument en Markt een onderneming heeft verplicht om voor toegang een kostengeoriënteerd
      tarief te rekenen, toont de onderneming aan dat haar tarieven werkelijk kostengeoriënteerd zijn.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.7
  - number: 6a.7.4
    text: |-
      Onverminderd het eerste lid, tweede volzin, kan de Autoriteit Consument en Markt aan een verplichting tot het
      opstellen van een kostentoerekeningssysteem voorschriften verbinden met betrekking tot het overleggen van de
      resultaten van de toepassing van het systeem door de onderneming waarop de verplichting rust.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.7
  - number: 6a.7.5
    text: 'Indien een verplichting tot het opstellen van een kostentoerekeningssysteem is opgelegd:'
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.7
  - number: 6a.7.5.a
    text: |-
      maakt de desbetreffende onderneming, met inachtneming van de door de Autoriteit Consument en Markt gegeven
      voorschriften, op genoegzame wijze bekend een beschrijving van het systeem die ten minste de hoofdcategorieën bevat
      waarin de kosten worden ingedeeld en de voor de toerekening van de kosten toegepaste regels;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.7
  - number: 6a.7.5.b
    text: |-
      onderzoekt de Autoriteit Consument en Markt dan wel een door de Autoriteit Consument en Markt aan te wijzen
      onafhankelijke deskundige derde jaarlijks of er in overeenstemming met het systeem is gehandeld.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.7
  - number: 6a.7.6
    text: |-
      Van de resultaten van het onderzoek, bedoeld in het vijfde lid, onderdeel b, wordt mededeling gedaan in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.7
  - number: 6a.8
    text: |-
      De Autoriteit Consument en Markt kan op grond van [artikel 6a.2, eerste lid][ref1], voor door de Autoriteit
      Consument en Markt te bepalen vormen van toegang de verplichting opleggen om deze toegang onder gelijke
      omstandigheden onder gelijke voorwaarden te verlenen. Deze verplichting houdt tevens in dat de onderneming gelijke
      voorwaarden toepast als die welke onder gelijke omstandigheden gelden voor haarzelf, haar dochterondernemingen of
      haar partnerondernemingen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.8
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
  - number: 6a.9.1
    text: |-
      De Autoriteit Consument en Markt kan op grond [artikel 6a.2, eerste lid][ref1], de verplichting opleggen om door de
      Autoriteit Consument en Markt nader te bepalen informatie met betrekking tot door de Autoriteit Consument en Markt
      te bepalen vormen van toegang bekend te maken. Deze informatie kan onder meer betrekking hebben op:


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.9
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
  - number: 6a.9.1.a
    text: tarieven en andere voorwaarden die bij het verlenen van toegang worden gehanteerd;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.9
  - number: 6a.9.1.b
    text: technische kenmerken en andere eigenschappen van het netwerk.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.9
  - number: 6a.9.2
    text: |-
      De Autoriteit Consument en Markt kan op grond van [artikel 6a.2, eerste lid][ref1], de verplichting opleggen om
      een referentieaanbod bekend te maken waarin een omschrijving is opgenomen van door de Autoriteit Consument en Markt
      te bepalen vormen van toegang. Het referentieaanbod is opgesplitst naar de onderscheiden vormen van toegang en de
      daarbij gehanteerde tarieven en andere voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.9
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
  - number: 6a.9.3
    text: |-
      Indien aan een onderneming waaraan een verplichting als bedoeld in het tweede lid is opgelegd tevens een
      verplichting is opgelegd als bedoeld in [artikel 6a.6][ref1] die betrekking heeft op ontbundelde toegang tot het
      aansluitnetwerk, voldoet het referentieaanbod van de onderneming in elk geval aan bijlage II van [richtlijn nr.
      2002/19/EG](32002L0019).


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.9
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.2
  - number: 6a.9.4
    text: |-
      Indien de Autoriteit Consument en Markt van oordeel is dat het referentieaanbod niet in overeenstemming is met de
      op grond van dit hoofdstuk opgelegde verplichtingen, geeft het de onderneming aanwijzingen met betrekking tot de
      aan te brengen wijzigingen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.9
  - number: 6a.9.5
    text: |-
      Aan een verplichting als bedoeld in het eerste en tweede lid kan de Autoriteit Consument en Markt voorschriften
      verbinden met betrekking tot de mate van detaillering en de wijze van bekendmaking.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.9
  - number: 6a.10.1
    text: |-
      De Autoriteit Consument en Markt kan op grond van [artikel 6a.2, eerste lid][ref1], de verplichting opleggen om een
      gescheiden boekhouding te voeren waarin de opbrengsten en de kosten van de door de Autoriteit Consument en Markt
      te bepalen vormen van toegang, aan de onderneming zelf of aan andere ondernemingen, gescheiden zijn van die van de
      door de ondernemingen verrichte overige activiteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.10
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
  - number: 6a.10.2
    text: |-
      Aan de verplichting tot het voeren van een gescheiden boekhouding kan de Autoriteit Consument en Markt
      voorschriften verbinden met betrekking tot de methode van inrichting van de boekhouding en het aan de Autoriteit
      Consument en Markt verstrekken van boekhoudkundige documenten met inbegrip van gegevens over van derden ontvangen
      inkomsten.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.10
  - number: 6a.11.1
    text: |-
      In uitzonderlijke omstandigheden kan de Autoriteit Consument en Markt aan een onderneming waarvan door de
      Autoriteit Consument en Markt op grond van [artikel 6a.2, eerste lid][ref1], is vastgesteld dat zij beschikt over
      een aanmerkelijke marktmacht bij de aanbieding van openbare elektronische communicatienetwerken of bijbehorende
      faciliteiten, andere bij ministeriële regeling aan te wijzen verplichtingen die verband houden met toegang
      opleggen, voor zover deze passend zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.11
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
  - number: 6a.11.2
    text: |-
      Bij de ministeriële regeling, bedoeld in het eerste lid, kunnen regels worden gesteld met betrekking tot het
      opleggen door de Autoriteit Consument en Markt van bij die regeling aangewezen verplichtingen. Deze regels hebben
      in elk geval betrekking op:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.11
  - number: 6a.11.2.a
    text: de omstandigheden die zich moeten voordoen alvorens deze verplichtingen kunnen worden opgelegd, en
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.11
  - number: 6a.11.2.b
    text: de aard van de verplichtingen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.11
  - number: 6a.11.3
    text: 'De Autoriteit Consument en Markt trekt een besluit als bedoeld in het eerste lid in, indien:'
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.11
  - number: 6a.11.3.a
    text: |-
      het op grond van [artikel 6a.3, eerste lid][ref1], heeft bepaald dat de desbetreffende relevante onderscheidenlijk
      transnationale markt daadwerkelijk concurrerend is;


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.11
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
  - number: 6a.11.3.b
    text: |-
      op grond [artikel 6a.3, tweede lid][ref1], is gebleken dat de onderneming als bedoeld in het eerste lid geen
      aanmerkelijke marktmacht meer heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.11
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
  - number: 6a.11.4
    text: 'De Autoriteit Consument en Markt trekt een besluit als bedoeld in het eerste lid tevens in, indien:'
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.11
  - number: 6a.11.4.a
    text: er geen sprake van uitzonderlijke omstandigheden meer is, of
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.11
  - number: 6a.11.4.b
    text: de opgelegde of in stand gehouden verplichting niet langer passend is.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.11
  - number: 6a.11.5
    text: |-
      Uiterlijk binnen achttien maanden nadat een besluit als bedoeld in het eerste lid in werking is getreden,
      onderzoekt de Autoriteit Consument en Markt of er nog sprake is van uitzonderlijke omstandigheden en of de
      opgelegde of in stand gehouden verplichting nog passend is en besluit de Autoriteit Consument en Markt op grond
      van:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.11
  - number: 6a.11.5.a
    text: het eerste lid om het besluit in stand te houden, of
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.11
  - number: 6a.11.5.b
    text: het vierde lid om het besluit in te trekken.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.11
  - number: 6a.11.6
    text: |-
      [Artikel 6a.2, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.11
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
  - number: 6a.12
    text: |-
      De Autoriteit Consument en Markt kan op grond van [artikel 6a.2, eerste lid][ref1], de verplichting opleggen om:


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.12
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
  - number: 6a.12.a
    text: |-
      bij de levering van door de Autoriteit Consument en Markt te bepalen eindgebruikersdiensten, de eindgebruikers van
      die diensten in gelijke gevallen gelijk te behandelen;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.12
  - number: 6a.12.b
    text: door de Autoriteit Consument en Markt te bepalen eindgebruikersdiensten te ontbundelen van andere diensten, en
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.12
  - number: 6a.12.c
    text: |-
      door de Autoriteit Consument en Markt te bepalen informatie aan door de Autoriteit Consument en Markt te bepalen
      categorieën van eindgebruikers op een door de Autoriteit Consument en Markt te bepalen wijze bekend te maken.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.12
  - number: 6a.13.1
    text: |-
      De Autoriteit Consument en Markt kan op grond van [artikel 6a.2, eerste lid][ref1], verplichtingen met betrekking
      tot de hoogte van eindgebruikerstarieven opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.13
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
  - number: 6a.13.2
    text: |-
      Indien de Autoriteit Consument en Markt een verplichting als bedoeld in het eerste lid oplegt, legt de Autoriteit
      Consument en Markt op grond van [artikel 6a.2, eerste lid][ref1], tevens de verplichting op om een door de
      Autoriteit Consument en Markt te bepalen of goed te keuren kostentoerekeningssysteem te hanteren. De Autoriteit
      Consument en Markt kan op grond van [artikel 6a.2, eerste lid][ref2], de in de vorige volzin bedoelde verplichting
      ook afzonderlijk van een verplichting als bedoeld in het eerste lid opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.13
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
      - id: ref2
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
  - number: 6a.13.3
    text: |-
      Een onderneming aan wie een verplichting als bedoeld in het tweede lid is opgelegd, legt vanaf een door de
      Autoriteit Consument en Markt te bepalen datum elk jaar in de maand mei, over het voorafgaande kalenderjaar het
      resultaat van de toepassing van het desbetreffende kostentoerekeningssysteem over aan de Autoriteit Consument en
      Markt.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.13
  - number: 6a.13.4
    text: |-
      Indien een verplichting als bedoeld in het tweede lid is opgelegd, onderzoekt de Autoriteit Consument en
      Markt of een door de Autoriteit Consument en Markt aan te wijzen onafhankelijke deskundige derde jaarlijks
      nadat het in het derde lid bedoelde resultaat is overgelegd of er in overeenstemming met het desbetreffende
      kostentoerekeningssysteem is gehandeld. Van het resultaat van het onderzoek wordt mededeling gedaan in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.13
  - number: 6a.13.5
    text: |-
      Aan de verplichtingen, bedoeld in het eerste en tweede lid, kunnen door de Autoriteit Consument en Markt nadere
      voorschriften worden verbonden die nodig zijn voor een goede uitvoering van die verplichtingen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.13
  - number: 6a.14.1
    text: |-
      Indien de Autoriteit Consument en Markt op grond van [artikel 6a.2, eerste lid][ref1], een verplichting als
      bedoeld in [artikel 6a.13, eerste lid][ref2], oplegt of in stand houdt, kan de Autoriteit Consument en Markt op
      grond van [artikel 6a.2, eerste lid][ref3], tevens de verplichting opleggen om invoering van nieuwe of gewijzigde
      eindgebruikerstarieven niet plaats te laten vinden dan nadat de Autoriteit Consument en Markt deze tarieven heeft
      goedgekeurd.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.14
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
      - id: ref2
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.3
      - id: ref3
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
  - number: 6a.14.2
    text: |-
      De Autoriteit Consument en Markt beoordeelt binnen drie weken na ontvangst van een verzoek tot goedkeuring, of het
      nieuwe of gewijzigde eindgebruikerstarief in overeenstemming is met de opgelegde of in stand gehouden verplichting,
      bedoeld in [artikel 6a.13, eerste lid][ref1]. Indien gegevens als bedoeld in het zevende lid ontbreken wordt de
      onderneming die het verzoek heeft ingediend binnen drie dagen na ontvangst van het verzoek, hiervan op de hoogte
      gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.14
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.3
  - number: 6a.14.3
    text: |-
      De Autoriteit Consument en Markt kan de termijn, bedoeld in het tweede lid, eerste volzin, eenmaal met drie weken
      verlengen. De Autoriteit Consument en Markt doet hiervan schriftelijk mededeling aan de onderneming die het verzoek
      heeft ingediend.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.14
  - number: 6a.14.4
    text: |-
      Indien de Autoriteit Consument en Markt van oordeel is dat het nieuwe of gewijzigde eindgebruikerstarief
      in overeenstemming is met de opgelegde of in stand gehouden verplichting, bedoeld in
      [artikel 6a.13, eerste lid][ref1], keurt de Autoriteit Consument en Markt de invoering hiervan goed.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.14
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.3
  - number: 6a.14.5
    text: |-
      Indien de Autoriteit Consument en Markt van oordeel is dat het nieuwe of gewijzigde eindgebruikerstarief
      niet in overeenstemming is met de opgelegde of in stand gehouden verplichting, bedoeld in
      [artikel 6a.13, eerste lid][ref1], doet de Autoriteit Consument en Markt hiervan mededeling aan de onderneming die
      het verzoek heeft ingediend. Binnen vier weken na deze mededeling, deelt de Autoriteit Consument en Markt aan de in
      de eerste volzin bedoelde onderneming schriftelijk mede op welke punten niet voldaan is aan de in de eerste volzin
      bedoelde verplichting.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.14
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.3
  - number: 6a.14.6
    text: |-
      De Autoriteit Consument en Markt beoordeelt een verzoek tot goedkeuring volgend op een schriftelijke mededeling als
      bedoeld in het vijfde lid, tweede volzin, binnen twee weken na ontvangst van dit verzoek.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.14
  - number: 6a.14.7
    text: |-
      Uiterlijk op het tijdstip waarop een besluit als bedoeld in [artikel 6a.2, eerste lid][ref1], houdende de oplegging
      of instandhouding van de verplichting om de invoering van nieuwe of gewijzigde eindgebruikerstarieven niet plaats
      te laten vinden dan nadat de Autoriteit Consument en Markt deze tarieven heeft goedgekeurd, in werking treedt,
      stelt de Autoriteit Consument en Markt vast welke gegevens door de desbetreffende onderneming bij een verzoek als
      bedoeld in het tweede lid overgelegd moeten worden, en in welke vorm deze gegevens worden ingediend. De Autoriteit
      Consument en Markt doet hiervan mededeling aan de desbetreffende onderneming.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.14
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
  - number: 6a.15
    text: |-
      Ter uitvoering van artikel 17 van [richtlijn nr. 2002/22/EG](32002L0022) kunnen bij algemene maatregel van
      bestuur andere verplichtingen dan de verplichtingen, bedoeld in de [artikelen 6a.12 tot en met 6a.14][ref1] worden
      aangewezen die de Autoriteit Consument en Markt op grond van [artikel 6a.2, eerste lid][ref2], kan opleggen aan
      ondernemingen die een aanmerkelijke marktmacht hebben op een relevante eindgebruikersmarkt onderscheidenlijk een
      transnationale eindgebruikersmarkt.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.15
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.3
      - id: ref2
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
  - number: 6a.20.1
    text: |-
      In dit artikel wordt verstaan onder openbare onderneming: onderneming waarop een krachtens het publiekrecht
      ingestelde rechtspersoon rechtstreeks of middellijk een dominerende invloed kan uitoefenen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.20
  - number: 6a.20.2
    text: |-
      Indien een onderneming de rechtsvorm van een privaatrechtelijke rechtspersoon heeft, wordt dominerende invloed als
      bedoeld in het eerste lid vermoed te kunnen worden uitgeoefend, wanneer een krachtens het publiekrecht ingestelde
      rechtspersoon rechtstreeks of middellijk:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.20
  - number: 6a.20.2.a
    text: over de meerderheid van de stemrechten, verbonden aan de door de rechtspersoon uitgegeven aandelen beschikt, of
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.20
  - number: 6a.20.2.b
    text: meer dan de helft van de leden van het bestuur of het toezichthoudend orgaan benoemt.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.20
  - number: 6a.20.3
    text: |-
      Een verticaal geïntegreerde openbare onderneming die elektronische communicatienetwerken aanbiedt en daarbij
      beschikt over een economische machtspositie op de gemeenschappelijke markt of op een wezenlijk onderdeel daarvan
      als bedoeld in artikel 102 van het Verdrag betreffende de werking van de Europese Unie, verleent aan andere
      ondernemingen op hun verzoek onder gelijke voorwaarden toegang als die welke onder gelijke omstandigheden gelden
      voor haarzelf of haar dochterondernemingen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.20
  - number: 6a.20.4
    text: |-
      De verplichting, bedoeld in het derde lid, blijft voor een verticaal geïntegreerde openbare onderneming buiten
      toepassing voor zover deze verplichting reeds voortvloeit uit een krachtens [artikel 6a.2, eerste lid][ref1], jo.
      [artikel 6a.8][ref2] door de Autoriteit Consument en Markt opgelegde of instandgehouden verplichting.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.20
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
      - id: ref2
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.2
  - number: 6a.21.1
    text: |-
      De Autoriteit Consument en Markt bepaalt in overeenstemming met de beginselen van het algemene Europese
      mededingingsrecht relevante markten voor het aanbieden van programmadiensten waarvan de kenmerken zodanig zijn dat
      het opleggen van de in de [artikelen 6a.12][ref1], [6a.13, eerste en tweede lid][ref2], [6a.14, eerste lid][ref3],
      en [6a.22][ref4] bedoelde verplichtingen passend kan zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref4]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.21
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.3
      - id: ref2
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.3
      - id: ref3
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.3
      - id: ref4
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.7
  - number: 6a.21.2
    text: |-
      De Autoriteit Consument en Markt onderzoekt de overeenkomstig het eerste lid bedoelde markten zo spoedig mogelijk.
      Het onderzoek is er in ieder geval op gericht om vast te stellen:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.21
  - number: 6a.21.2.a
    text: |-
      of de desbetreffende markt al dan niet daadwerkelijk concurrerend is en of hierop ondernemingen die
      programmadiensten aanbieden actief zijn die beschikken over een aanmerkelijke marktmacht, en
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.21
  - number: 6a.21.2.b
    text: |-
      welke verplichtingen als bedoeld in de [artikelen 6a.12][ref1], [6a.13, eerste en tweede lid][ref2],
      [6a.14, eerste lid][ref3], en [6a.22][ref4] passend zijn voor de onder a bedoelde ondernemingen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref4]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.21
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.3
      - id: ref2
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.3
      - id: ref3
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.3
      - id: ref4
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.7
  - number: 6a.21.3
    text: |-
      Indien uit een onderzoek, bedoeld in tweede lid, blijkt dat een relevante markt niet daadwerkelijk concurrerend is,
      stelt de Autoriteit Consument en Markt vast welke ondernemingen die programmadiensten aanbieden, beschikken over
      een aanmerkelijke marktmacht, en:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.21
  - number: 6a.21.3.a
    text: |-
      legt zij ieder van hen, voor zover passend, verplichtingen als bedoeld in de [artikelen 6a.12][ref1],
      [6a.13, eerste en tweede lid][ref2], [6a.14, eerste lid][ref3], en [6a.22][ref4] op;


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref4]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.21
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.3
      - id: ref2
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.3
      - id: ref3
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.3
      - id: ref4
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.7
  - number: 6a.21.3.b
    text: |-
      houdt zij eerder opgelegde verplichtingen, voor zover zij betrekking hebben op deze markt, in stand indien zij nog
      steeds passend zijn, of
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.21
  - number: 6a.21.3.c
    text: |-
      trekt zij eerder opgelegde verplichtingen, voor zover zij betrekking hebben op deze markt, in, indien zij niet
      langer passend zijn.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.21
  - number: 6a.21.4
    text: |-
      Voor de toepassing van dit artikel wordt onder «eindgebruiker», bedoeld in de
      [artikelen 6a.12 tot en met 6a.14][ref1], verstaan: een natuurlijk persoon of rechtspersoon die gebruik maakt of
      verzoekt om een programmadienst.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.21
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.3
  - number: 6a.21.5
    text: |-
      De [artikelen 6a.1, zesde, zevende en achtste lid][ref1], [6a.2, derde lid][ref2],
      [6a.3, eerste en tweede lid][ref3], [6a.4][ref4], [6a.5][ref5], [6a.13, derde, vierde en vijfde lid][ref6],
      [6a.14, tweede tot en met zevende lid][ref7], [6b.1][ref8], [6b.3][ref9] en [6b.6][ref10] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
