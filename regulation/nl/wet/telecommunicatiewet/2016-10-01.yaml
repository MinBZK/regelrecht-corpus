  - number: 15.1.3
    text: |-
      De Autoriteit Consument en Markt is belast met het toezicht op de naleving van het bepaalde bij of krachtens andere
      bepalingen van deze wet dan bedoeld in het eerste en tweede lid en met het toezicht op de roamingverordening.
      De vorige volzin is niet van toepassing op het bepaalde bij of krachtens de [artikelen 5.1][ref1], [5.4][ref2],
      [5.5][ref3], [5.6, tweede, derde lid, vierde en vijfde lid][ref4], [5.7][ref5], [5.13][ref6] en [5.14][ref7] van
      deze wet en voor zover Onze Minister de geadresseerde is.


