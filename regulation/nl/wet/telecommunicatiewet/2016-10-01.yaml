        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '15.1'
  - number: 15.2.4
    text: |-
      Voor de toepassing van het eerste lid, is van een spoedeisend geval als bedoeld in
      [artikel 5:31, eerste lid, van de Algemene wet bestuursrecht][ref1] in elk geval sprake indien het niet naleven
      van de in het eerste lid bedoelde bepalingen een ernstige en directe bedreiging vormt voor de openbare orde, de
      openbare veiligheid of de volksgezondheid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel15.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 15.2.5
    text: |-
      Voor de toepassing van het tweede lid, is van een spoedeisend geval als bedoeld in
      [artikel 5:31, eerste lid, van de Algemene wet bestuursrecht][ref1] in elk geval sprake indien het niet
      naleven van de in het tweede lid bedoelde bepalingen ernstige economische of bedrijfstechnische problemen
      tot gevolg zal hebben voor andere aanbieders van een openbaar elektronisch communicatienetwerk, een openbare
      elektronische communicatiedienst of bijbehorende faciliteiten of voor gebruikers van een openbaar elektronisch
      communicatienetwerk, of een openbare elektronische communicatiedienst.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel15.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 15.2a.1
    text: |-
      Onze Minister is bevoegd een aanbieder van openbare elektronische communicatienetwerken of -diensten bij ernstig en
      herhaaldelijk niet-nakomen van de verplichtingen gesteld bij of krachtens de in [artikel 15.1, eerste lid][ref1],
      bedoelde bepalingen, wanneer de krachtens [artikel 15.2][ref2] of [15.4][ref3] opgelegde maatregelen tot naleving
      van de bedoelde verplichtingen hebben gefaald, voor een door Onze Minister te bepalen redelijke termijn te
      verbieden nog langer elektronische communicatienetwerken of -diensten aan te bieden.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel15
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel15.2a
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '15.1'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '15.1'
      - id: ref3
        bwb_id: BWBR0009950
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '15.2'
  - number: 15.2a.2
    text: |-
      De Autoriteit Consument en Markt is bevoegd een aanbieder van openbare elektronische communicatienetwerken
      of -diensten bij ernstig en herhaaldelijk niet-nakomen van de verplichtingen gesteld bij of krachtens de in
      [artikel 15.1, tweede lid][ref1], bedoelde bepalingen, wanneer de krachtens [artikel 15.2][ref2] of [15.4][ref3]
      opgelegde maatregelen tot naleving van de bedoelde verplichtingen hebben gefaald, voor een door de Autoriteit
      Consument en Markt te bepalen redelijke termijn te verbieden nog langer elektronische communicatienetwerken of
      -diensten aan te bieden.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel15
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel15.2a
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '15.1'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '15.1'
      - id: ref3
        bwb_id: BWBR0009950
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '15.2'
  - number: 15.2a.3
    text: |-
      Een besluit als bedoeld in het eerste of tweede lid, inhoudende een verbod tot het aanbieden van elektronische
      communicatienetwerken of -diensten voldoet in elk geval aan de volgende eisen:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel15.2a
  - number: 15.2a.3.a
    text: |-
      het verbod is niet in strijd met een of meer doelstellingen als bedoeld in [artikel 1.3][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel1
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel15.2a
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '1'
        hoofdstuk: '1'
  - number: 15.2a.3.b
    text: |-
      het verbod leidt niet tot het niet na kunnen komen door de onderneming van een bij of krachtens de wet opgelegde
      leveringsplicht;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel15.2a
  - number: 15.2a.3.c
    text: |-
      het verbod heeft slechts betrekking op het netwerk of de dienst ten aanzien waarvan de in het eerste of tweede lid
      bedoelde verplichtingen niet zijn nagekomen;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel15.2a
  - number: 15.2a.3.d
    text: |-
      het verbod heeft geen ernstige economische of maatschappelijke problemen tot gevolg voor andere aanbieders van
      een openbaar elektronisch communicatienetwerk, een openbare elektronische communicatiedienst of bijbehorende
      faciliteiten, of voor gebruikers van een openbaar elektronisch communicatienetwerk of een openbare elektronische
      communicatiedienst.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel15.2a
  - number: 15.2a.4
    text: |-
      Van een besluit als bedoeld in het eerste of tweede lid wordt door Onze Minister, onderscheidenlijk de Autoriteit
      Consument en Markt, mededeling gedaan in de Staatscourant. Het treedt niet eerder in werking dan twee weken na
      die mededeling.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel15.2a
  - number: '15.3'
    text: |-
      Indien niet wordt voldaan aan de bij of krachtens deze wet gestelde regels ten aanzien van de aanleg of het gebruik
      van radiozendapparaten, is Onze Minister bevoegd om aan de houder van een desbetreffend radiozendapparaat een
      geheel of gedeeltelijk zendverbod op te leggen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel15.3
  - number: 15.3a
    text: |-
      Ingeval bij of krachtens deze wet regels worden gesteld ter uitvoering van het Internationaal
      Telecommunicatieverdrag dan wel ter uitvoering van verordeningen, richtlijnen of besluiten als bedoeld in
      artikel 288 van het Verdrag inzake de werking van de Europese Unie op het gebied van openbare elektronische
      communicatienetwerken en -diensten, kan overtreding van die regels ook als strafbaar feit worden aangemerkt dan wel
      worden bestraft met een bestuurlijke sanctie indien deze regels in de Engelse taal zijn gesteld en bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel15.3a
  - number: 15.4.1
    text: |-
      Onze Minister kan ingeval van overtreding van een wettelijk voorschrift met het toezicht op de naleving
      waarvan hij ingevolge [artikel 15.1 eerste lid][ref1], is belast of ingeval van overtreding van
      [artikel 5:20 van de Algemene wet bestuursrecht][ref2] een bestuurlijke boete opleggen van ten hoogste € 900.000.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel15.4
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '15.1'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 15.4.2
    text: |-
      De Autoriteit Consument en Markt kan ingeval van overtreding van een wettelijk voorschrift met het toezicht op de
      naleving waarvan zij het ingevolge [artikel 15.1, tweede lid][ref1], is belast een bestuurlijke boete opleggen van
      ten hoogste € 900.000, of, indien dat meer is, 1% van de omzet van de onderneming.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel15
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel15.4
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '15.1'
  - number: 15.4.3
    text: |-
      In afwijking van het tweede lid kan de Autoriteit Consument en Markt aan een onderneming een bestuurlijke boete
      opleggen van ten hoogste € 900.000, of, indien dat meer is, 10% van de omzet van de onderneming, ter zake van:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel15.4
  - number: 15.4.3.a
    text: |-
      overtreding van de bij of krachtens [hoofdstuk 6a][ref1] gestelde regels of van de bij de roamingverordening
      gestelde regels;


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk6a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel15.4
    references:
      - id: ref1
        bwb_id: BWBR0009950
        hoofdstuk: 6a
  - number: 15.4.3.b
    text: |-
      overtreding van een op grond van [artikel 12.2][ref1] genomen besluit, voor zover de overtreding geschiedt door
      een onderneming die beschikt over een aanmerkelijke marktmacht en een bij of krachtens [hoofdstuk 6a][ref2] gesteld
      voorschrift betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk6a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel15.4
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '12'
        hoofdstuk: '12'
        paragraaf: '12.2'
      - id: ref2
        bwb_id: BWBR0009950
        hoofdstuk: 6a
  - number: 15.4.4
    text: |-
      Het College bescherming persoonsgegevens kan ingeval van overtreding van een wettelijk voorschrift met het toezicht
      op de naleving waarvan het ingevolge [artikel 15.1, derde lid][ref1], is belast of ingeval van overtreding van
      [artikel 5:20 van de Algemene wet bestuursrecht][ref2] een bestuurlijke boete opleggen van ten hoogste € 900.000.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel15.4
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '15.1'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 15.4.5
    text: |-
      De bestuurlijke boete die ingevolge het eerste, tweede, derde of vierde lid ten hoogste kan worden opgelegd
      wordt verhoogd met 100%, indien binnen een tijdvak van vijf jaar voorafgaand aan de dagtekening van het van de
      overtreding opgemaakte rapport, bedoeld in [artikel 5:48, eerste lid, van de Algemene wet bestuursrecht][ref1], een
      aan die overtreder voor een eerdere overtreding van eenzelfde of een soortgelijk wettelijk voorschrift opgelegde
      bestuurlijke boete onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel15.4
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 15.7.1
    text: |-
      De ambtenaren, bedoeld in [artikel 15.1, eerste en tweede lid][ref1], zijn bevoegd om bedrijfsruimten en voorwerpen
      te verzegelen, voorzover dat voor de uitoefening van de in [artikel 5:17 van de Algemene wet bestuursrecht][ref2]
      bedoelde bevoegdheden redelijkerwijs noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel15.7
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '15.1'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 15.7.2
    text: |-
      De ambtenaren, bedoeld in [artikel 15.1, eerste en tweede lid][ref1], oefenen de hun in
      [artikel 5:17 van de Algemene wet bestuursrecht][ref2] toegekende bevoegdheid zo nodig uit met behulp van de sterke
      arm.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel15.7
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '15.1'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '15.12'
    text: |-
      De werking van een beschikking van Onze Minister waarmee een bestuurlijke boete is opgelegd, wordt opgeschort
      totdat de beroepstermijn is verstreken of, indien beroep of hoger beroep is ingesteld, op het beroep of hoger
      beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel15.12
  - number: '15.14'
    text: |-
      Verzet schorst de tenuitvoerlegging van een dwangbevel dat strekt tot invordering van een door Onze Minister
      opgelegde bestuurlijke boete.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel15.14
  - number: '15.17'
    text: |-
      In afwijking van de [artikelen 4:7][ref1] en [4:8 van de Algemene wet bestuursrecht][ref2] worden voorafgaand aan
      de beslissing tot toepassing van bestuursdwang waarbij uitrusting uit de handel wordt genomen die niet voldoet aan
      de bij of krachtens [artikel 10.3 onderdeel a, b, c en e][ref3] gestelde eisen, belanghebbenden in de gelegenheid
      gesteld hun zienswijzen naar voren te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel10
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel15.17
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0009950
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: '10.1'
  - number: 16.1.1
    text: |-
      De kosten samenhangend met de werkzaamheden of diensten die Onze Minister verricht ingevolge het bepaalde bij
      of krachtens deze wet, kunnen door Onze Minister ten laste worden gebracht van degene ten behoeve van wie deze
      werkzaamheden worden verricht. Bij of krachtens algemene maatregel van bestuur worden hierover regels gesteld.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel16.1
  - number: 16.1.2
    text: |-
      Bij het vaststellen van de vergoeding kunnen mede worden betrokken kosten, verband houdend met het toezicht op de
      naleving van het bepaalde bij of krachtens deze wet ten aanzien van de desbetreffende werkzaamheden of diensten.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel16.1
  - number: 16.1.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld betreffende de jaarlijkse bijdrage die is
      verschuldigd door gebruikers van radiozendapparaten ter dekking van de kosten die voor Onze Minister voortvloeien
      uit de toepassing van het bij of krachtens deze wet terzake van de elektromagnetische compatibiliteit bepaalde.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel16.1
  - number: 16.1.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld betreffende de jaarlijkse bijdrage die is
      verschuldigd door een aanbieder van een openbaar telecommunicatienetwerk ter dekking van de kosten die voor Onze
      Minister voortvloeien uit de toepassing van het bij of krachtens deze wet terzake van randapparatuur bepaalde.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel16.1
  - number: '18.2'
    text: 'Bij algemene maatregel van bestuur kunnen regels worden gesteld die noodzakelijk zijn voor uitvoering van:'
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.2
  - number: 18.2.a
    text: |-
      [richtlijn nr. 2002/21/EG](32002L0021) of daarmee verband houdende richtlijnen van de Raad van de Europese Unie of
      van het Europees Parlement en de Raad gezamenlijk;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.2
  - number: 18.2.b
    text: |-
      richtlijnen van de Europese Commissie die hun grondslag vinden in artikel 106, derde lid, van het Verdrag
      betreffende de werking van de Europese Unie en die betrekking hebben op de elektronische communicatiesector.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.2
  - number: 18.2a
    text: De Autoriteit Consument en Markt is de nationale regelgevende instantie, bedoeld in de roamingverordening.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.2a
  - number: 18.3.1
    text: |-
      Onze Minister stelt de Autoriteit Consument en Markt in de gelegenheid hem advies uit te brengen over een voornemen
      om krachtens [artikel 3.16, tweede lid onder b][ref1], een of meer aanbieders van het verkrijgen van een vergunning
      uit te sluiten, indien dat met het oog op de totstandbrenging of instandhouding van daadwerkelijke mededinging
      noodzakelijk is, of over het ontwerp van een besluit tot weigering, intrekking of wijziging van een vergunning voor
      zover dit verband houdt met het in aanzienlijke mate beperken van de daadwerkelijke mededinging op de relevante
      markt, bedoeld in de [artikelen 3.18, tweede lid, onder c][ref2], en [3.19, tweede lid, onder f][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.6'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.6'
      - id: ref3
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: 18.3.2
    text: |-
      De Autoriteit Consument en Markt en het Commissariaat voor de Media, bedoeld in
      [artikel 7.1 van de Mediawet 2008][ref1], maken in het belang van een effectieve en efficiënte besluitvorming
      afspraken over de wijze van behandeling van aangelegenheden van wederzijds belang.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel7
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.3
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '7'
  - number: 18.3.3
    text: |-
      Onze Minister en het College bescherming persoonsgegevens, bedoeld in
      [artikel 51 van de Wet bescherming persoonsgegevens][ref1], onderscheidenlijk de Autoriteit Consument en Markt
      en het College bescherming persoonsgegevens, maken in het belang van een effectief en efficiënt toezicht op het
      verwerken van persoonsgegevens overeenkomstig de [hoofdstukken 11][ref2] en [13][ref3] van deze wet afspraken over
      de wijze van behandeling van aangelegenheden van wederzijds belang. Daartoe stellen zij een samenwerkingsprotocol
      vast. Het samenwerkingsprotocol wordt bekendgemaakt in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk11
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk13
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.3
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '51'
      - id: ref2
        bwb_id: BWBR0009950
        hoofdstuk: '11'
      - id: ref3
        bwb_id: BWBR0009950
        hoofdstuk: '13'
  - number: 18.3a
    text: |-
      Andere bestuursorganen dan de Autoriteit Consument en Markt zijn bevoegd uit eigen beweging en verplicht
      desgevraagd Onze Minister de gegevens te verstrekken die noodzakelijk zijn voor de uitvoering en het toezicht op de
      naleving van deze wet door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.3a
  - number: 18.4.1
    text: |-
      De aanbieder van een openbaar elektronisch communicatienetwerk over wiens netwerk internationaal openbaar
      elektronisch communicatieverkeer wordt verzorgd leeft de verplichtingen na die voortvloeien uit het Internationaal
      Telecommunicatieverdrag en uit andere Nederland bindende verdragen of besluiten van volkenrechtelijke organisaties
      terzake van de verzorging van dit verkeer.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.4
  - number: 18.4.2
    text: |-
      Degene die op grond van het bepaalde bij of krachtens [hoofdstuk 3][ref1] gerechtigd is tot het gebruik van
      frequentieruimte of degene die overeenkomstig [artikel 3.4, eerste lid, onderdeel c][ref2], vergunningvrij
      gebruik maakt van frequentieruimte, leeft de verplichtingen na die voortvloeien uit het Internationaal
      Telecommunicatieverdrag en uit andere Nederland bindende verdragen of besluiten van volkenrechtelijke organisaties
      terzake van dit gebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.4
    references:
      - id: ref1
        bwb_id: BWBR0009950
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '18.5'
    text: |-
      Onverminderd het overigens bij of krachtens het Internationaal Telecommunicatieverdrag bepaalde zijn erkende
      ondernemingen in de zin van genoemd verdrag:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.5
  - number: 18.5.a
    text: |-
      de aanbieder van een openbaar elektronisch communicatienetwerk over wiens netwerk internationaal openbaar
      elektronisch communicatieverkeer wordt verzorgd, en
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.5
  - number: 18.5.b
    text: |-
      de aanbieder van een openbaar elektronisch communicatienetwerk die in het kader van zijn aanbod radiozendapparaten
      gebruikt of de aanbieder van een openbaar elektronisch communicatienetwerk dat bestaat uit radiozendapparaten die
      geschikt zijn voor het verspreiden van programma's, wiens uitzendingen schadelijke storingen kunnen veroorzaken in
      de radiodiensten van andere landen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.5
  - number: 18.6.1
    text: |-
      Aanbieders van openbare elektronische communicatienetwerken of openbare elektronische communicatiediensten die
      in Nederland of in een andere lid-staat van de Europese Unie bijzondere of uitsluitende rechten hebben voor het
      verrichten van diensten in andere sectoren dan elektronische communicatie voeren voor onderscheiden activiteiten
      afzonderlijke boekhoudingen, op gelijke wijze als vereist zou zijn wanneer de activiteiten door juridisch
      onafhankelijke ondernemingen zouden worden verricht.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.6
  - number: 18.6.2
    text: |-
      Bij ministeriële regeling kan worden bepaald dat het eerste lid niet van toepassing is op bij die regeling
      aangewezen aanbieders waarvan de jaaromzet in elektronische communicatie-activiteiten binnen de Europese Unie een
      bij die regeling te noemen bedrag niet te boven gaat.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.6
  - number: 18.7.1
    text: |-
      Onze Minister is bevoegd voor een juiste uitvoering van het bepaalde bij of krachtens deze wet van een ieder te
      allen tijde inlichtingen te vorderen voor zover dit redelijkerwijs voor de vervulling van zijn taak nodig is.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.7
  - number: 18.7.2
    text: |-
      De bevoegdheid, bedoeld in het eerste lid, strekt zich met betrekking tot verkeers- en locatiegegevens als
      bedoeld in [artikel 13.2a, eerste lid][ref1], niet verder uit dan de gegevens die de aanbieder van openbare
      elektronische communicatienetwerken of de aanbieder van openbare elektronische communicatiediensten op grond van de
      [artikelen 11.5][ref2] en [11.5a][ref3] is toegestaan te verwerken.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel11
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.7
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '13'
        hoofdstuk: '13'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.1'
      - id: ref3
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.1'
  - number: 18.7.3
    text: |-
      Degene van wie krachtens het eerste lid inlichtingen zijn gevorderd, is verplicht deze onverwijld te geven, maar in
      elk geval binnen de daartoe door Onze Minister te stellen termijn.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.7
  - number: 18.7.4
    text: 'In een vordering op grond van het eerste lid kan wat betreft de te geven inlichtingen worden volstaan met:'
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.7
  - number: 18.7.4.a
    text: het omschrijven van het onderwerp waarover inlichtingen moeten worden gegeven en
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.7
  - number: 18.7.4.b
    text: de bij het verstrekken van de inlichtingen aan te houden mate van detail.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.7
  - number: 18.7.5
    text: |-
      Degene van wie de verstrekking van inlichtingen is gevorderd, is verplicht binnen de door Onze Minister te bepalen
      redelijke termijn alle medewerking te verlenen die deze redelijkerwijs kan vorderen bij het uitoefenen van zijn
      bevoegdheden. [Artikel 5:20, tweede lid, van de Algemene wet bestuursrecht][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.7
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 18.7.6
    text: |-
      Zij die uit hoofde van een ambt, beroep of wettelijk voorschrift verplicht zijn tot geheimhouding, kunnen het
      verlenen van medewerking weigeren, voor zover dit uit hun geheimhoudingsplicht voortvloeit.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.7
  - number: '18.8'
    text: |-
      Met het oog op het bevorderen van een open en concurrerende markt in de elektronische communicatiesector
      maakt de Autoriteit Consument en Markt informatie met betrekking tot aanbieders van openbare elektronische
      communicatienetwerken, bijbehorende faciliteiten of openbare elektronische communicatiediensten op een door de
      Autoriteit Consument en Markt te bepalen wijze bekend voor zover die informatie verband houdt met bij of krachtens
      de [hoofdstukken 4 tot en met 9][ref1] en [11][ref2] van deze wet opgelegde verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk11
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.8
    references:
      - id: ref1
        bwb_id: BWBR0009950
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0009950
        hoofdstuk: '11'
  - number: 18.9.1
    text: |-
      Onze Minister is bevoegd, in overeenstemming met Onze Minister van Veiligheid en Justitie, aanbieders van openbare
      elektronische communicatienetwerken of openbare elektronische communicatiediensten aanwijzingen te geven met
      betrekking tot:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.9
  - number: 18.9.1.a
    text: de instandhouding en de exploitatie van hun openbare elektronische communicatienetwerken, of
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.9
  - number: 18.9.1.b
    text: |-
      het verzorgen en gebruiken van hun openbare elektronische communicatiediensten, wanneer dit noodzakelijk is ter
      beëindiging van strafbaar gedrag jegens een persoon.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.9
  - number: 18.9.2
    text: |-
      Onze Minister is bevoegd, in overeenstemming met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties,
      aanbieders van openbare elektronische communicatienetwerken of openbare elektronische communicatiediensten
      aanwijzingen te geven met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.9
  - number: 18.9.2.a
    text: de instandhouding en de exploitatie van hun openbare elektronische communicatienetwerken, of
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.9
  - number: 18.9.2.b
    text: |-
      het verzorgen en gebruiken van hun openbare elektronische communicatiediensten, wanneer dit noodzakelijk is in het
      belang van de veiligheid van de staat.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.9
  - number: 18.9.3
    text: |-
      Onze Minister kan bij de toepassing van het eerste en tweede lid afwijken van de verplichtingen die ingevolge deze
      wet op aanbieders van openbare elektronische communicatienetwerken of openbare elektronische communicatiediensten
      rusten.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.9
  - number: 18.9.4
    text: |-
      Een aanbieder van een openbaar telecommunicatienetwerk of een openbare telecommunicatiedienst is verplicht een
      aanwijzing als bedoeld in het eerste of tweede lid op te volgen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.9
  - number: 18.9.5
    text: |-
      Indien aanbieders van openbare elektronische communicatienetwerken of openbare elektronische communicatiediensten
      als gevolg van aanwijzingen gegeven op grond van het eerste en tweede lid onevenredig financieel nadeel
      ondervinden, kent Onze Minister aan hen een naar billijkheid te bepalen vergoeding toe.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.9
  - number: '18.10'
    text: |-
      Degene die een telefoongids uitgeeft, neemt op verzoek van een natuurlijke persoon of rechtspersoon die in die gids
      met een telefoonnummer is vermeld, het elektronisch postadres van verzoeker in die gids op tegen redelijke en niet
      discriminerende voorwaarden.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.10
  - number: 18.11.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het aan derden ter
      beschikking stellen van adressen voor elektronische post met bijbehorende gegevens ten behoeve van de samenstelling
      van boeken met elektronische postadressen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.11
  - number: 18.11.2
    text: |-
      De regels, bedoeld in het eerste lid, kunnen onder meer betrekking hebben op de bescherming van persoonsgegevens en
      de persoonlijke levenssfeer.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.11
  - number: 18.12.1
    text: |-
      Indien in deze wet geregelde onderwerpen in het belang van een goede uitvoering van deze wet nadere regeling
      behoeven, kan deze geschieden bij of krachtens algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.12
  - number: 18.12.2
    text: |-
      Bij de regels, bedoeld in het eerste lid, kunnen taken worden opgedragen en bevoegdheden worden verleend aan de
      Autoriteit Consument en Markt.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.12
  - number: 18.13.1
    text: |-
      Onverminderd het overigens bij of krachtens deze wet bepaalde worden de bij of krachtens deze wet te nemen
      maatregelen en regels genomen met inachtneming van het belang van de bescherming van persoonsgegevens en de
      bescherming van de persoonlijke levenssfeer alsmede de bescherming van het brief-, telefoon- en telegraafgeheim en
      het geheim van daarmee vergelijkbare communicatietechnieken.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.13
  - number: 18.13.2
    text: |-
      Onverminderd het overigens bij of krachtens deze wet bepaalde is het eerste lid van overeenkomstige toepassing
      op de bedrijfsvoering door aanbieders van openbare elektronische communicatienetwerken of openbare elektronische
      communicatiediensten.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.13
  - number: '18.14'
    text: |-
      Een krachtens [artikel 9.1, tweede, derde, of vierde lid][ref1], vastgestelde algemene maatregel van bestuur
      wordt aan de beide kamers der Staten-Generaal overgelegd. Hij treedt in werking op een tijdstip dat nadat vier
      weken na de overlegging zijn verstreken bij koninklijk besluit wordt vastgesteld, tenzij binnen die termijn door
      of namens een der kamers of door ten minste een vijfde van het grondwettelijk aantal leden van een der kamers de
      wens te kennen wordt gegeven dat het onderwerp bij wet wordt geregeld. In dat geval wordt een daartoe strekkend
      voorstel van wet zo spoedig mogelijk ingediend. Indien het voorstel van wet wordt ingetrokken of indien een van de
      beide kamers der Staten-Generaal besluit het voorstel niet aan te nemen, wordt de algemene maatregel van bestuur
      ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel9
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.14
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '9'
        hoofdstuk: '9'
  - number: 18.15.1
    text: |-
      Een certificatiedienstverlener die certificaten als gekwalificeerde certificaten aanbiedt of afgeeft aan het
      publiek en in Nederland een vestiging heeft, voldoet aan de eisen, gesteld bij of krachtens algemene maatregel
      van bestuur.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.15
  - number: 18.15.2
    text: |-
      Certificaten die als gekwalificeerd certificaat aan het publiek worden aangeboden of afgegeven, voldoen aan de
      eisen gesteld bij of krachtens algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.15
  - number: 18.15.3
    text: |-
      Een certificatiedienstverlener stelt, alvorens een gekwalificeerd certificaat af te geven, de identiteit van de
      persoon die als ondertekenaar in dat gekwalificeerde certificaat wordt aangeduid, vast aan de hand van de bij
      [artikel 1 van de Wet op de identificatieplicht][ref1] aangewezen geldige documenten.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.15
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 18.16.1
    text: |-
      Onze Minister kan een of meer organisaties aanwijzen die bevoegd zijn certificatiedienstverleners te toetsen op
      overeenstemming met de bij en krachtens deze wet gestelde eisen en daartoe een bewijs van toetsing af te geven.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.16
  - number: 18.16.2
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels gesteld inzake:'
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.16
  - number: 18.16.2.a
    text: de indiening van een aanvraag voor een aanwijzing;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.16
  - number: 18.16.2.b
    text: |-
      de eisen waaraan organisaties en de reglementen van organisaties moeten voldoen om voor een aanwijzing in
      aanmerking te komen;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.16
  - number: 18.16.2.c
    text: voorschriften welke aan een aanwijzing kunnen worden verbonden, waaronder de duur waarvoor de aanwijzing geldt.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.16
  - number: 18.16.3
    text: 'Onze Minister kan een aanwijzing intrekken indien:'
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.16
  - number: 18.16.3.a
    text: |-
      de aangewezen organisatie niet meer voldoet aan de haar gestelde eisen om in aanmerking te komen voor een
      aanwijzing;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.16
  - number: 18.16.3.b
    text: |-
      de aangewezen organisatie de bij of krachtens deze wet gestelde regels, dan wel de aan de aanwijzing verbonden
      voorschriften niet nakomt.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.16
  - number: 18.16a.1
    text: |-
      Een certificatiedienstverlener die in het bezit is van een geldig bewijs van toetsing van een op
      grond van [artikel 18.16, eerste lid][ref1], aangewezen organisatie, wordt vermoed te voldoen aan
      [artikel 18.15, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel18
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.16a
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '18'
        hoofdstuk: '18'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '18'
        hoofdstuk: '18'
  - number: 18.16a.2
    text: |-
      De certificaten die als gekwalificeerd aan het publiek worden aangeboden of afgegeven door
      een certificatiedienstverlener als bedoeld in het eerste lid, worden vermoed te voldoen aan
      [artikel 18.15, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel18
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.16a
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '18'
        hoofdstuk: '18'
  - number: '18.17'
    text: |-
      Degene die een veilig middel voor het aanmaken van elektronische handtekeningen op de markt brengt, zorgt er
      voor dat het veilig middel voldoet aan de bij of krachtens algemene maatregel van bestuur te stellen eisen en,
      ten bewijze daarvan, dat het veilig middel is voorzien van een verklaring van een door Onze Minister aangewezen
      instelling als bedoeld in [artikel 18.17a][ref1] of van een verklaring van een instelling die is aangewezen door de
      bevoegde autoriteiten van een andere lidstaat van de Europese Unie dan wel van een van de overige staten die partij
      zijn bij de Overeenkomst betreffende de Europese Economische Ruimte, dat het middel voldoet aan de eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel18
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.17
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '18'
        hoofdstuk: '18'
  - number: 18.17a.1
    text: |-
      Onze Minister kan een of meer instellingen aanwijzen die zijn belast met het beoordelen van de overeenstemming van
      een veilig middel voor het aanmaken van elektronische handtekeningen met de eisen bedoeld in [artikel 18.17][ref1]
      en het daartoe afgeven van verklaringen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel18
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.17a
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '18'
        hoofdstuk: '18'
  - number: 18.17a.2
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels gesteld inzake:'
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.17a
  - number: 18.17a.2.a
    text: de indiening van een aanvraag voor een aanwijzing;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.17a
  - number: 18.17a.2.b
    text: de eisen waaraan instellingen moeten voldoen om voor een aanwijzing in aanmerking te komen;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.17a
  - number: 18.17a.2.c
    text: voorschriften welke aan een aanwijzing kunnen worden verbonden, waaronder de duur waarvoor de aanwijzing geldt.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.17a
  - number: 18.17a.3
    text: |-
      Onze Minister trekt een aanwijzing in indien de aangewezen instelling niet meer voldoet aan de haar gestelde eisen
      om voor een aanwijzing in aanmerking te komen en de instelling niet binnen een door Onze Minister gestelde termijn
      heeft aangetoond aan de eisen te voldoen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.17a
  - number: 18.17a.4
    text: |-
      Indien de aangewezen instelling aantoont redelijkerwijs niet binnen de gestelde termijn aan de gestelde eisen
      te kunnen voldoen, kan Onze Minister op verzoek van de aangewezen instelling de termijn bedoeld in het derde lid
      verlengen waarbinnen aan de criteria of voorschriften moet zijn voldaan.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.17a
  - number: 18.17a.5
    text: |-
      Onze Minister kan een aanwijzing intrekken indien de aangewezen instelling de bij of krachtens deze wet gestelde
      regels, dan wel de aan een aanwijzing verbonden voorschriften niet nakomt.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.17a
  - number: '18.18'
    text: |-
      Het is de certificatiedienstverlener waarvan de registratie op grond van
      [artikel 2.2, vierde lid, onderdeel b, c, of d][ref1], is beëindigd verboden gekwalificeerde certificaten aan het
      publiek aan te bieden of af te geven zolang hij niet opnieuw is geregistreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel2
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.18
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '2'
        hoofdstuk: '2'
  - number: 18.20.1
    text: |-
      De Autoriteit Consument en Markt verstrekt na een daartoe strekkend verzoek van de Europese Commissie, van
      BEREC dan wel van een nationale regelgevende instantie, de gegevens of inlichtingen die de Europese Commissie,
      respectievelijk BEREC en het Bureau, respectievelijk die nationale regelgevende instantie nodig heeft voor de
      uitoefening van haar taken uit hoofde van het recht van de Europese Unie mits:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.20
  - number: 18.20.1.a
    text: |-
      de geheimhouding, voor zover er naar het oordeel van de Autoriteit Consument en Markt sprake is van
      bedrijfsvertrouwelijke gegevens of inlichtingen, van de gegevens of inlichtingen in voldoende mate is gewaarborgd,
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.20
  - number: 18.20.1.b
    text: |-
      voldoende gewaarborgd is dat de gegevens of inlichtingen niet zullen worden gebruikt voor een ander doel dan
      waarvoor deze zijn verstrekt, en
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.20
  - number: 18.20.1.c
    text: |-
      het verzoek gegevens of inlichtingen betreft die de Autoriteit Consument en Markt uit hoofde van haar taken en
      bevoegdheden op grond van deze wet heeft verkregen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.20
  - number: 18.20.2
    text: |-
      Indien de Autoriteit Consument en Markt van oordeel is dat er sprake is van bedrijfsvertrouwelijke gegevens of
      inlichtingen, vermeldt de Autoriteit Consument en Markt bij het verstrekken van die gegevens of inlichtingen aan de
      Europese Commissie, BEREC en het Bureau onderscheidenlijk de nationale regelgevende instantie, uitdrukkelijk en met
      redenen omkleed dat die informatie niet aan derden ter beschikking mag worden gesteld.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.20
  - number: 18.20.3
    text: |-
      Indien de Autoriteit Consument en Markt aan de Europese Commissie gegevens of inlichtingen verstrekt die de
      Autoriteit Consument en Markt heeft verkregen van een aanbieder van een openbaar elektronisch communicatienetwerk,
      een openbare elektronische communicatiedienst of bijbehorende faciliteiten, stelt de Autoriteit Consument en Markt
      de betreffende aanbieder daarvan op de hoogte.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.20
  - number: 18.21.1
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot de toepassing van overeenkomstig artikel 17,
      vierde lid, van [richtlijn nr. 2002/21/EG](32002L0021) verplicht gestelde normen of specificaties, die gepubliceerd
      zijn in het Publicatieblad van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.21
  - number: 18.21.2
    text: |-
      Een wijziging van de normen of specificaties, bedoeld in het eerste lid, gaat gelden met ingang van de dag waarop
      die wijziging in het Publicatieblad van de Europese Unie is gepubliceerd.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.21
  - number: 18.21.3
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de toepassing van in het Publicatieblad
      van de Europese Unie gepubliceerde normen of specificaties als bedoeld in artikel 17, eerste lid, van [richtlijn
      nr. 2002/21/EG](32002L0021) met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.21
  - number: 18.21.3.a
    text: |-
      bij die regeling aan te wijzen categorieën van elektronische communicatienetwerken, elektronische
      communicatiediensten, bijbehorende faciliteiten, of diensten indien het toepassen van die normen of specificaties
      nodig is voor het waarborgen van eind- tot eindverbindingen of het verbeteren van de keuzevrijheid van gebruikers,
      of
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.21
  - number: 18.21.3.b
    text: |-
      het gebruik van applicatieprogramma-interfaces indien het toepassen van die normen of specificaties nodig is voor
      het bevorderen van de toepassing van open applicatieprogramma-interfaces bij het leveren of aanbieden van digitale
      interactieve televisiediensten.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.21
  - number: 18.22.1
    text: |-
      Een wijziging van [richtlijn nr. 2002/19/EG](32002L0019), [richtlijn nr. 2002/20/EG](32002L0020), [richtlijn
      nr. 2002/21/EG](32002L0021), of [richtlijn nr. 2002/22/EG](32002L0022) gaat voor de toepassing van de
      Telecommunicatiewet gelden met ingang van de dag waarop aan de betrokken wijziging van de desbetreffende richtlijn
      uitvoering moet zijn gegeven, tenzij bij ministerieel besluit dat in de Staatscourant wordt bekendgemaakt, een
      ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.22
  - number: 18.22.2
    text: |-
      Onze Minister doet in de Staatscourant mededeling van de titel, de vindplaats en de datum van inwerkingtreding van
      de roamingverordening.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel18.22
  - number: 19.2.1
    text: |-
      De mededeling, bedoeld in [artikel 2.1, eerste lid][ref1], behoeft niet te worden gedaan door:


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel2
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel19.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '2'
        hoofdstuk: '2'
  - number: 19.2.1.a
    text: |-
      degene die voor de inwerkingtreding van de
      [Wet implementatie Europees regelgevingskader voor de elektronische communicatiesector 2002][ref1] door de
      Autoriteit Consument en Markt is geregistreerd;


      [ref1]: https://wetten.overheid.nl/BWBR0016635
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel19.2
    references:
      - id: ref1
        bwb_id: BWBR0016635
  - number: 19.2.1.b
    text: |-
      de houder van een vergunning voor het gebruik van frequentieruimte waarvoor geen registratie was vereist
      op grond van [artikel 2.1, tweede lid, onder a][ref1], zoals dat luidde voor de inwerkingtreding van de
      [Wet implementatie Europees regelgevingskader voor de elektronische communicatiesector 2002][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0016635
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel19.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0016635
  - number: 19.2.2
    text: |-
      Een registratie die is gedaan op grond van [artikel 2.1, eerste lid][ref1], zoals dat luidde voor de inwerkingtreding
      van de [Wet implementatie Europees regelgevingskader voor de elektronische communicatiesector 2002][ref2], wordt
      aangemerkt als een mededeling als bedoeld in [artikel 2.1, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0016635
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel2
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel19.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0016635
      - id: ref3
        bwb_id: BWBR0009950
        artikel: '2'
        hoofdstuk: '2'
  - number: 19.2.3
    text: |-
      Een vergunning voor het gebruik van frequentieruimte die bestemd is voor het aanbieden van een openbaar
      elektronisch communicatienetwerk of een openbare elektronische communicatiedienst, wordt aangemerkt als een
      mededeling als bedoeld in [artikel 2.1, eerste lid][ref1]. Onze Minister verstrekt de Autoriteit Consument en Markt
      de daarvoor benodigde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel2
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel19.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '2'
        hoofdstuk: '2'
  - number: 19.2.4
    text: |-
      Een op grond van het tweede of derde lid geregistreerde rechtspersoon
      kan tot uiterlijk zes maanden na de inwerkingtreding van de
      [Wet implementatie Europees regelgevingskader voor de elektronische communicatiesector 2002][ref1] de Autoriteit
      Consument en Markt verzoeken om een verklaring als bedoeld in [artikel 2.4, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0016635
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel2
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel19.2
    references:
      - id: ref1
        bwb_id: BWBR0016635
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '2'
        hoofdstuk: '2'
  - number: '19.3'
    text: |-
      De in [artikel 6a.1, tweede lid][ref1], bedoelde relevante markten die nodig zijn voor de in de
      artikelen 27 van [richtlijn nr. 2002/21/EG](32002L0021), 7, derde lid, van [richtlijn nr. 2002/19/
      EG](32002L0019) of 16, derde lid, van [richtlijn nr. 2002/22/EG](32002L0022), bedoelde marktanalyses,
      worden door de Autoriteit Consument en Markt zo spoedig mogelijk na inwerkingtreding van de
      [Wet implementatie Europees regelgevingskader voor de elektronische communicatiesector 2002][ref2] bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0016635
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel19.3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
      - id: ref2
        bwb_id: BWBR0016635
  - number: '19.7'
    text: |-
      Een aanvraag als bedoeld in de [artikelen 3.11, vierde lid][ref1], of
      [6.3, eerste of tweede lid][ref2], zoals deze luidden voor de inwerkingtreding van de
      [Wet implementatie Europees regelgevingskader voor de elektronische communicatiesector 2002][ref3], wordt vanaf dat
      tijdstip aangemerkt als een aanvraag als bedoeld in [artikel 12.2][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0016635
      [ref4]: https://wetten.overheid.nl/BWBR0009950#Artikel12
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel19.7
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.5'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '6'
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0016635
      - id: ref4
        bwb_id: BWBR0009950
        artikel: '12'
        hoofdstuk: '12'
        paragraaf: '12.2'
  - number: '19.8'
    text: |-
      Op een aanvraag om een oordeel als bedoeld in [artikel 7.7][ref1], zoals dat luidde voor de inwerkingtreding van
      de [Wet implementatie Europees regelgevingskader voor de elektronische communicatiesector 2002][ref2], blijven de
      Telecommunicatiewet en de daarop berustende bepalingen van toepassing zoals die luidden voor dat tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0016635
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel19.8
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '7'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0016635
  - number: '19.9'
    text: |-
      Na inwerkingtreding van de
      [Wet implementatie Europees regelgevingskader voor de elektronische communicatiesector 2002][ref1], geldt:


      [ref1]: https://wetten.overheid.nl/BWBR0016635
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel19.9
    references:
      - id: ref1
        bwb_id: BWBR0016635
  - number: 19.9.a
    text: |-
      ten aanzien van de verwerking van verkeersgegevens, bedoeld in [artikel 11.5, tweede lid][ref1], dat de aanbieder
      binnen zes maanden de abonnee de gegevens verstrekt, bedoeld in [artikel 11.5, vierde lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel11
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel19.9
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.1'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.1'
  - number: 19.9.b
    text: |-
      dat de toestemming, bedoeld in [artikel 11.5, derde lid][ref1], niet is vereist voor de verkeersgegevens die reeds
      in gebruik zijn voor het doel dat is genoemd in [artikel 11.5, derde lid, onderdeel a][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel11
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel19.9
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.1'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.1'
  - number: 19.9.c
    text: |-
      ten aanzien van de verkeersgegevens, bedoeld in onderdeel b, dat de aanbieder binnen zes maanden aan de abonnee
      mededeling doet van de informatie, bedoeld in [artikel 11.5, vierde lid][ref1]. De abonnee wordt geacht met
      betrekking tot dit gebruik toestemming te hebben verleend, tenzij hij binnen een termijn van twee maanden na
      verzending van de mededeling schriftelijk aan de desbetreffende aanbieder te kennen heeft gegeven dat voor het
      desbetreffende gebruik geen toestemming wordt gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel11
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel19.9
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.1'
  - number: '19.10'
    text: |-
      Na inwerkingtreding van de
      [Wet implementatie Europees regelgevingskader voor de elektronische communicatiesector 2002][ref1] geldt:


      [ref1]: https://wetten.overheid.nl/BWBR0016635
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel19.10
    references:
      - id: ref1
        bwb_id: BWBR0016635
  - number: 19.10.a
    text: |-
      dat [artikel 11.6][ref1] niet van toepassing is op edities van gedrukte algemeen beschikbare abonneelijsten en
      algemeen beschikbare abonneelijsten die in elektronische vorm, anders dan met gebruikmaking van een elektronisch
      communicatienetwerk of een elektronische communicatiedienst, worden uitgegeven, indien deze edities zijn uitgegeven
      dan wel gereed gemaakt zijn voor uitgifte, voor de datum van inwerkingtreding van dat artikel;


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel11
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel19.10
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.1'
  - number: 19.10.b
    text: |-
      dat een ieder die een algemeen beschikbare abonneelijst uitgeeft of een algemeen beschikbare abonnee-
      informatiedienst verzorgt, binnen zes maanden na inwerkingtreding van [artikel 11.6][ref1] de abonnee van een
      openbare telefoondienst wiens persoonsgegevens op het moment van inwerkingtreding van dat artikel zijn opgenomen
      in de abonneelijst dan wel in het voor de abonnee-informatiedienst gebruikte abonneebestand, op de hoogte stelt
      van de informatie, bedoeld in [artikel 11.6, eerste lid][ref2]. Daarbij wordt aan de abonnee de mogelijkheid
      geboden om verzet aan te tekenen tegen het feit dat hem betreffende persoonsgegevens in de abonneelijst of in het
      voor de abonnee-informatiedienst gebruikte abonneebestand zijn opgenomen. Indien de abonnee verzet aantekent, is
      [artikel 41, tweede lid, van de Wet bescherming persoonsgegevens][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0011468#Artikel41
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel19.10
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.1'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.1'
      - id: ref3
        bwb_id: BWBR0011468
        artikel: '41'
  - number: 20.1.1
    text: |-
      In afwijking van de in [artikel 9.3][ref1] vervatte procedure geldt, voor de toepassing van het bij of krachtens
      deze wet bepaalde voor elk van de in [artikel 9.1, eerste lid, onderdelen a tot en met e][ref2], bedoelde openbare
      elektronische communicatiediensten of voorzieningen KPN B.V. als een krachtens [artikel 9.2][ref3] aangewezen
      aanbieder.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel9
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel20.1
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '9'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '9'
        hoofdstuk: '9'
      - id: ref3
        bwb_id: BWBR0009950
        artikel: '9'
        hoofdstuk: '9'
  - number: 20.1.2
    text: |-
      Aan de uit het vorige lid voortvloeiende verplichting voor KPN B.V. om de in
      [artikel 9.1, eerste lid, onderdelen a tot en met e][ref1], bedoelde openbare elektronische communicatiediensten en
      voorzieningen te verzorgen komt een einde een jaar na het tijdstip waarop:


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel9
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel20.1
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '9'
        hoofdstuk: '9'
  - number: 20.1.2.a
    text: |-
      KPN B.V. Onze Minister schriftelijk heeft medegedeeld een verplichting tot verzorging van een bepaalde dienst of
      voorziening niet langer te willen nakomen, of
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel20.1
  - number: 20.1.2.b
    text: |-
      Onze Minister schriftelijk aan KPN B.V. heeft medegedeeld dat een verplichting tot verzorging van een bepaalde
      dienst of voorziening niet langer bestaat.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel20.1
  - number: 20.2.1
    text: |-
      Een vergunning die is verleend krachtens artikel 13a, eerste lid, van de Wet op de telecommunicatievoorzieningen
      wordt gelijkgesteld met een vergunning, verleend krachtens [artikel 3.3, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel20.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 20.2.2
    text: |-
      Voor de houder van een vergunning als bedoeld in het eerste lid blijft het bepaalde bij of krachtens de artikelen
      13c, 13g, met dien verstande dat in het eerste lid, onderdeel a, vervalt «waaronder technische aftapbaarheid», 13j,
      13k, met uitzondering van het zevende lid, en met dien verstande dat de tweede volzin van het zesde lid komt te
      luiden: De in de eerste volzin bedoelde besluiten van Onze Minister zijn gelijk ten aanzien van alle vergunningen
      die voor hetzelfde technische systeem op hetzelfde tijdstip zijn verleend., 13l, 13n, 13t, voorzover het betreft de
      verwijzing naar artikel 11, eerste tot en met derde lid, en vijfde tot en met zevende lid, 13v, 13x en 13y van de
      Wet op de telecommunicatievoorzieningen van toepassing.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel20.2
  - number: 20.2a.1
    text: |-
      Vergunningen voor het gebruik van frequentieruimte die zijn verleend op grond van [artikel 3.3][ref1] van
      deze wet en de daarop berustende bepalingen zoals die luidden voor het tijdstip van inwerkingtreding van
      artikel I, onderdeel A van de wet van 10 mei 2012 houdende wijziging van de Telecommunicatiewet in verband met
      de Nota frequentiebeleid 2005 (Stb. 2013, 48) dan wel vergunningen of machtigingen die daarmee op grond van
      [artikel 20.2][ref2], onderscheidenlijk [20.3][ref3] zijn gelijkgesteld, blijven van kracht voor de periode
      waarvoor zij zijn verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel20
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel20.2a
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '20'
        hoofdstuk: '20'
      - id: ref3
        bwb_id: BWBR0009950
        artikel: '20'
        hoofdstuk: '20'
  - number: 20.2a.2
    text: |-
      Het gebruik van frequentieruimte dat voor de daarin bedoelde taken was toegestaan op grond van
      [artikel 3.4, eerste lid, onder b, en tweede lid][ref1], van deze wet en de daarop berustende bepalingen, zoals
      die luidden voor het tijdstip van inwerkingtreding van artikel I, onderdeel A van de wet van 10 mei 2012 houdende
      wijziging van de Telecommunicatiewet in verband met de Nota frequentiebeleid 2005 (Stb. 2013, 48), blijft, onder
      de op grond van bovenbedoelde bepalingen aan het gebruik verbonden voorschriften en beperkingen, toegestaan tot het
      tijdstip waarop op grond van [artikel 3.5][ref2] opnieuw door Onze Minister frequentieruimte wordt toegewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel20.2a
    references:
