        paragraaf: '15.1'
  - number: 15.2.2
    text: |-
      De Autoriteit Consument en Markt is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van de
      verplichtingen, gesteld bij of krachtens de in [artikel 15.1, derde lid][ref1], bedoelde bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel15
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel15.2
