  - number: 15.2.1
    text: |-
      Onze Minister is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van de verplichtingen,
      gesteld bij of krachtens de in [artikel 15.1, eerste lid][ref1], bedoelde bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel15
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel15.2
