        artikel: 6b
        hoofdstuk: 6b
      - id: ref6
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 6b.1.2
    text: |-
      In afwijking van het eerste lid kan de Autoriteit Consument en Markt besluiten om de in het eerste lid bedoelde
      procedure niet toe te passen indien het besluit geen aanzienlijke gevolgen heeft voor de desbetreffende markt.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6b.1
  - number: 6b.1.3
    text: |-
      Indien het een besluit op aanvraag betreft, is [artikel 3:18 van de Algemene wet bestuursrecht][ref1] niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6b.1
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 6b.2.1
    text: |-
      Indien een besluit als bedoeld in [artikel 6b.1, eerste lid][ref1], van invloed is op de handel tussen de
      lidstaten, legt de Autoriteit Consument en Markt het ontwerp van het desbetreffende besluit en de gronden die aan
      het ontwerpbesluit ten grondslag liggen, voor aan:


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6b
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6b.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6b
        hoofdstuk: 6b
  - number: 6b.2.1.a
    text: de Europese Commissie,
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6b.2
  - number: 6b.2.1.b
    text: de nationale regelgevende instanties, bedoeld in artikel 7 van richtlijn nr. 2002/21/EG, en
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6b.2
  - number: 6b.2.1.c
    text: BEREC,
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6b.2
  - number: 6b.2.2
    text: |-
      De Autoriteit Consument en Markt neemt het besluit niet dan nadat de in het eerste lid bedoelde termijn van een
      maand is verstreken.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6b.2
  - number: 6b.2.3
    text: |-
      De Autoriteit Consument en Markt houdt bij het nemen van het besluit zoveel mogelijk rekening met de opmerkingen
      die de Europese Commissie, de nationale regelgevende instanties en BEREC met betrekking tot het ontwerp aan de
      Autoriteit Consument en Markt hebben medegedeeld.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6b.2
  - number: 6b.2.4
    text: |-
      Indien de Europese Commissie binnen de termijn, bedoeld in het tweede lid, heeft medegedeeld dat zij van mening
      is dat de bepaling van een relevante markt op grond van [artikel 6a.1, tweede lid][ref1], of de aanwijzing van
      een onderneming met aanmerkelijke marktmacht, bedoeld in [artikel 6a.2, eerste lid, aanhef][ref2], een belemmering
      vormt voor de interne Europese markt of dat zij ernstige twijfels heeft omtrent de verenigbaarheid van het
      ontwerpbesluit met het Unierecht, wacht de Autoriteit Consument en Markt tenminste twee maanden vanaf de datum van
      die mededeling met het vaststellen van het besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6b.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
      - id: ref2
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
  - number: 6b.2.5
    text: |-
      Uiterlijk zes maanden na de dag waarop de Europese Commissie overeenkomstig artikel 7, vijfde lid, onderdeel a, van
      richtlijn nr. 2002/21/EG een beschikking heeft gegeven omtrent een ontwerpbesluit als bedoeld in het vierde lid:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6b.2
  - number: 6b.2.5.a
    text: |-
      brengt de Autoriteit Consument en Markt het ontwerp met betrekking tot de door de Europese Commissie in de
      beschikking aangegeven voorstellen in overeenstemming met het Unierecht, of
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6b.2
  - number: 6b.2.5.b
    text: besluit de Autoriteit Consument en Markt het desbetreffende ontwerpbesluit niet vast te stellen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6b.2
  - number: 6b.2.6
    text: |-
      Van het besluit, bedoeld in het vijfde lid, onder b, doet de Autoriteit Consument en Markt mededeling in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6b.2
  - number: 6b.2.7
    text: |-
      Indien de Europese Commissie binnen de termijn, bedoeld in het tweede lid, heeft medegedeeld dat zij van
      mening is dat een in het ontwerpbesluit voorgestelde verplichting als bedoeld in de [artikelen 6.2][ref1],
      [6a.2, eerste lid, onderdelen a tot en met c][ref2], of [6a.4a, vijfde of zesde lid][ref3], een belemmering vormt
      voor de interne Europese markt of dat zij ernstige twijfels heeft omtrent de verenigbaarheid daarvan met het
      Unierecht, neemt de Autoriteit Consument en Markt het besluit niet dan nadat de termijn van vier maanden vanaf
      de datum van die mededeling is verstreken. In afwijking van deze termijn kan de Autoriteit Consument en Markt het
      besluit nemen zodra de aanbeveling is gedaan of het voorbehoud is ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6b.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
      - id: ref3
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
  - number: 6b.2.8
    text: |-
      Indien de Autoriteit Consument en Markt een verplichting als bedoeld in het zevende lid in overeenstemming brengt
      met een advies van BEREC als bedoeld in artikel 7bis, derde lid, van richtlijn nr. 2002/21/EG, of een aanbeveling
      van de Europese Commissie als bedoeld in artikel 7bis, vijfde lid, onder a, met betrekking tot die verplichting, is
      [artikel 6b.1][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6b
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6b.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6b
        hoofdstuk: 6b
  - number: 6b.2.9
    text: |-
      Indien de Autoriteit Consument en Markt een verplichting als bedoeld in het zevende lid, niet in overeenstemming
      brengt met:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6b.2
  - number: 6b.2.9.a
    text: een advies van BEREC als bedoeld in artikel 7bis, derde lid, van richtlijn nr. 2002/21/EG, of
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6b.2
  - number: 6b.2.9.b
    text: |-
      een aanbeveling van de Europese Commissie als bedoeld in artikel 7bis, vijfde lid, onder a, met betrekking tot
      die verplichting, motiveert de Autoriteit Consument en Markt waarom zij de verplichting in het ontwerpbesluit niet
      wijzigt of intrekt.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6b.2
  - number: 6b.2.10
    text: |-
      De Autoriteit Consument en Markt stuurt een overeenkomstig dit artikel voorbereid besluit in afschrift aan
      de Europese Commissie en BEREC. In het geval van een aanbeveling of een voorbehoud als bedoeld in het zevende
      lid, verstuurt de Autoriteit Consument en Markt het afschrift binnen een maand nadat de aanbeveling is gedaan
      of het voorbehoud is ingetrokken. De termijn van een maand kan door de Autoriteit Consument en Markt worden
      verlengd indien de Autoriteit Consument en Markt de wijziging van het ontwerpbesluit voorbereidt overeenkomstig
      [artikel 6b.1, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6b
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6b.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6b
        hoofdstuk: 6b
  - number: 6b.3.1
    text: |-
      De Autoriteit Consument en Markt kan in uitzonderlijke omstandigheden indien de vereiste spoed zich verzet
      tegen de toepassing van de procedures, bedoeld in de [artikelen 6b.1, eerste lid][ref1], of [6b.2][ref2], die
      procedure buiten toepassing laten bij het nemen van een besluit als bedoeld in de [artikelen 6.2][ref3] en
      [6a.2, eerste lid, onder a][ref4], teneinde de concurrentie te waarborgen of de belangen van de gebruikers te
      beschermen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6b
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6b
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6b.3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6b
        hoofdstuk: 6b
      - id: ref2
        bwb_id: BWBR0009950
        artikel: 6b
        hoofdstuk: 6b
      - id: ref3
        bwb_id: BWBR0009950
        artikel: '6'
        hoofdstuk: '6'
      - id: ref4
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
  - number: 6b.3.2
    text: Een besluit als bedoeld in het eerste lid geldt voor een periode van maximaal 26 weken.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6b.3
  - number: 6b.3.3
    text: |-
      De Autoriteit Consument en Markt stuurt een afschrift van een besluit als bedoeld in het eerste lid aan de Europese
      Commissie, de nationale regelgevende instanties, bedoeld in artikel 7 van richtlijn nr. 2002/21/EG, en BEREC.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6b.3
  - number: 6b.4
    text: |-
      Indien een nationale regelgevende instantie, bedoeld in [artikel 6b.2, eerste lid][ref1], ingevolge artikel 7,
      derde lid, van [richtlijn nr. 2002/21/EG](32002L0021) een ontwerp van een besluit aan de Autoriteit Consument en
      Markt voorlegt, doet de Autoriteit Consument en Markt haar opmerkingen aan die nationale regelgevende instantie
      binnen de door die instantie gestelde termijn toekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6b
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6b.4
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6b
        hoofdstuk: 6b
  - number: 6b.5.1
    text: |-
      Op de voorbereiding van een besluit van de Autoriteit Consument en Markt tot het opleggen, instandhouden of
      intrekken van een verplichting als bedoeld in een op basis van [artikel 6a.11][ref1] tot stand gekomen ministeriële
      regeling is de procedure, bedoeld in [artikel 6b.1][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6b
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6b.5
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.2
      - id: ref2
        bwb_id: BWBR0009950
        artikel: 6b
        hoofdstuk: 6b
  - number: 6b.5.2
    text: |-
      De Autoriteit Consument en Markt legt een ontwerp van een besluit als bedoeld in het eerste lid voor aan de
      Europese Commissie en de nationale regelgevende instanties die overeenkomstig artikel 3, zesde lid, van [richtlijn
      nr. 2002/21/EG](32002L0021) zijn aangemeld.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6b.5
  - number: 6b.5.3
    text: |-
      De Autoriteit Consument en Markt gaat niet over tot het nemen van een besluit als bedoeld in het eerste lid
      dan nadat de Europese Commissie daartoe overeenkomstig artikel 14, tweede lid, van [richtlijn nr. 2002/19/EG]
      (32002L0019) toestemming heeft gegeven. De Autoriteit Consument en Markt houdt daarbij rekening met de door de
      nationale regelgevende instanties gemaakte opmerkingen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6b.5
  - number: 6b.6
    text: |-
      Voor de mogelijkheid van beroep ingevolge [hoofdstuk 8 van de Algemene wet bestuursrecht][ref1] worden als één
      besluit aangemerkt:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6b.6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '8'
  - number: 6b.6.a
    text: |-
      een besluit als bedoeld in [artikel 6a.2, eerste lid][ref1], en de aan een dergelijk besluit ten grondslag liggende
      bepaling van de relevante markt, bedoeld in [artikel 6a.1, eerste of tweede lid][ref2], en het onderzoek van die
      markt, bedoeld in [artikel 6a.1, derde lid][ref3], respectievelijk het onderzoek van een transnationale markt,
      bedoeld in [artikel 6a.1, vierde lid][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref4]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6b.6
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
      - id: ref2
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
      - id: ref3
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
      - id: ref4
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
  - number: 6b.6.b
    text: |-
      een besluit als bedoeld in [artikel 6a.3, eerste, tweede of derde lid][ref1], en de aan een dergelijk besluit
      ten grondslag liggende bepaling van de relevante markt, bedoeld in [artikel 6a.1, eerste of tweede lid][ref2], en
      het onderzoek van die markt als bedoeld in [artikel 6a.1, derde lid][ref3], respectievelijk het onderzoek van een
      transnationale markt als bedoeld in [artikel 6a.1, vierde lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref4]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6b.6
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
      - id: ref2
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
      - id: ref3
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
      - id: ref4
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
  - number: 7.1.1
    text: |-
      Een aanbieder van een openbare elektronische communicatiedienst of een openbaar elektronisch communicatienetwerk
      verstrekt voor of bij het sluiten van een overeenkomst met een consument of een andere hierom verzoekende
      eindgebruiker aan hem de volgende gegevens in een heldere, begrijpelijke vorm op schrift of op een andere te zijner
      beschikking staande en voor hem gemakkelijk toegankelijke duurzame gegevensdrager:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.1
  - number: 7.1.1.a
    text: de naam en het adres van vestiging van de aanbieder;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.1
  - number: 7.1.1.b
    text: de te verstrekken diensten;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.1
  - number: 7.1.1.c
    text: |-
      de geldende tariefstructuur, de belangrijkste tarieven, de wijze waarop informatie verkregen kan worden over de
      geldende tarieven en onderhoudskosten, de wijze waarop betaald kan worden en de kosten die aan deze betalingswijzen
      zijn verbonden;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.1
  - number: 7.1.1.d
    text: |-
      de duur van de overeenkomst alsmede de voorwaarden waaronder de overeenkomst of onderdelen daarvan, kan worden
      verlengd of beëindigd;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.1
  - number: 7.1.1.e
    text: |-
      de schadevergoedingsregeling of terugbetalingsregeling die geldt indien de overeenkomst, voor zover het het
      kwaliteitsniveau van de geleverde dienst betreft, niet wordt nagekomen, en
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.1
  - number: 7.1.1.f
    text: |-
      de wijze waarop gebruik kan worden gemaakt van de geschillencommissie, bedoeld in [artikel 12.1][ref1] of van de
      procedure, bedoeld in [artikel 12.9][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel12
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '12'
        hoofdstuk: '12'
        paragraaf: '12.1'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '12'
        hoofdstuk: '12'
        paragraaf: '12.2'
  - number: 7.1.1.g
    text: |-
      de in [artikel 11.6, tweede lid][ref1], genoemde keuzemogelijkheden van de abonnee met betrekking tot de vraag of
      zijn persoonsgegevens al dan niet zullen worden opgenomen in een abonneelijst en in voor abonnee-informatiediensten
      gebruikte abonneebestanden, en de op te nemen gegevens;


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel11
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.1'
  - number: 7.1.1.h
    text: |-
      de maatregelen die de onderneming neemt of kan nemen in reactie op beveiligings- en integriteitsincidenten of
      bedreigingen en kwetsbaarheden;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.1
  - number: 7.1.1.i
    text: |-
      de criteria voor verstrekking van de compensatie, bedoeld in artikel 7.1a, waaronder in ieder geval de minimale
      duur van de onderbreking en de minimale vergoeding.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.1
  - number: 7.1.2
    text: |-
      Een aanbieder van een openbare elektronische communicatiedienst zorgt ervoor dat de gegevens die hij voor of bij
      het sluiten van de overeenkomst verstrekt, opgenomen worden in de tussen hem en de desbetreffende consument te
      sluiten overeenkomst.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.1
  - number: 7.1.3
    text: Het eerste en tweede lid zijn van overeenkomstige toepassing op aanbieders van programmadiensten.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.1
  - number: 7.1.4
    text: |-
      Bij ministeriële regeling kunnen categorieën van openbare elektronische communicatiediensten of programmadiensten
      worden aangewezen met betrekking waartoe voor de desbetreffende aanbieder de in het eerste en tweede lid bedoelde
      verplichting geheel of gedeeltelijk buiten toepassing blijft.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.1
  - number: 7.1.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ten aanzien van de in het eerste lid genoemde gegevens
      nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.1
  - number: 7.2.1
    text: |-
      Ten minste een maand voordat een voorgenomen wijziging van een beding dat is opgenomen in een overeenkomst van
      kracht wordt:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.2
  - number: 7.2.1.a
    text: |-
      biedt een aanbieder van een openbare elektronische communicatiedienst of een openbaar elektronisch
      communicatienetwerk de abonnee de mogelijkheid om de overeenkomst kosteloos te beëindigen, en
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.2
  - number: 7.2.1.b
    text: |-
      stelt de aanbieder de abonnee op genoegzame wijze op de hoogte van de inhoud van de voorgenomen wijziging en van de
      mogelijkheid om de overeenkomst kosteloos te beëindigen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.2
  - number: 7.2.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing op aanbieders van programmadiensten. Bij ministeriële regeling
      kunnen categorieën van programmadiensten worden aangewezen met betrekking waartoe voor de desbetreffende aanbieder
      de in de vorige volzin bedoelde verplichting geheel of gedeeltelijk buiten toepassing blijft.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.2
  - number: 7.2.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de opmaak
      van de mededeling waarmee de abonnee op de hoogte wordt gesteld van een voorgenomen wijziging, bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.2
  - number: 7.2a.1
    text: |-
      De overeenkomst tussen een aanbieder en een eindgebruiker met betrekking tot de levering van een elektronische
      communicatiedienst of programmadienst kan worden aangegaan voor bepaalde of onbepaalde duur.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.2a
  - number: 7.2a.2
    text: |-
      Een aanbieder biedt een eindgebruiker de mogelijkheid een overeenkomst voor een bepaalde duur met een looptijd van
      ten hoogste twaalf maanden aan te gaan.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.2a
  - number: 7.2a.3
    text: |-
      De overeenkomst die is aangegaan voor een bepaalde duur, kan na verloop van die duur stilzwijgend worden verlengd
      of vernieuwd, mits de abonnee de overeenkomst hierna te allen tijde kosteloos kan opzeggen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.2a
  - number: 7.2a.4
    text: |-
      De overeenkomst die is aangegaan voor een onbepaalde duur, kan door de abonnee te allen tijde kosteloos worden
      opgezegd.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.2a
  - number: 7.2a.5
    text: De bij de opzegging door de abonnee in acht te nemen termijn is in alle gevallen niet langer dan een maand.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.2a
  - number: 7.2a.6
    text: |-
      In afwijking van het vijfde lid kunnen de abonnee, niet zijnde een consument, en de aanbieder, op uitdrukkelijk
      verzoek van die abonnee, een opzegtermijn van ten hoogste drie maanden overeenkomen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.2a
  - number: 7.2a.7
    text: 'Indien er sprake is van een consument:'
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.2a
  - number: 7.2a.7.a
    text: bedraagt de looptijd van een overeenkomst voor een bepaalde duur ten hoogste 24 maanden;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.2a
  - number: 7.2a.7.b
    text: 'biedt een aanbieder van een openbare telefoondienst hem de mogelijkheid een overeenkomst aan te gaan:'
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.2a
  - number: 7.2a.7.b.1°
    text: waarbij geen starttarief in rekening wordt gebracht;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.2a
  - number: 7.2a.7.b.2°
    text: waarbij de gespreksduur in seconden in rekening wordt gebracht, en
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.2a
  - number: 7.2a.7.b.3°
    text: |-
      waarbij, indien de aanbieder ook abonnementen aanbiedt waarbij de gespreksduur niet in seconden in rekening wordt
      gebracht, het tarief, gezien de overige voorwaarden van de overeenkomst, vergelijkbaar is met het tarief bij de
      andere door de aanbieder aangeboden abonnementen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.2a
  - number: 7.3.1
    text: |-
      Bij ministeriële regeling kan worden bepaald dat aanbieders van openbare elektronische communicatienetwerken
      of openbare elektronische communicatiediensten transparante, vergelijkbare, toereikende, actuele, duidelijke en
      volledige informatie bekendmaken over:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.3
  - number: 7.3.1.a
    text: de geldende tarieven,
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.3
  - number: 7.3.1.b
    text: eventuele in rekening gebrachte kosten bij beëindiging van een overeenkomst,
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.3
  - number: 7.3.1.c
    text: |-
      de algemene voorwaarden met betrekking tot de toegang tot en het gebruik van de diensten als bedoeld in bijlage II
      van richtlijn nr. 2002/22/EG die door hen aan eindgebruikers worden aangeboden, of
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.3
  - number: 7.3.1.d
    text: eventuele beperkingen van de toegang tot of het gebruik van diensten en toepassingen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.3
  - number: 7.3.2
    text: |-
      De informatie, bedoeld in het eerste lid, wordt bekendgemaakt in een gemakkelijk toegankelijke vorm. Bij
      ministeriële regeling kunnen regels worden gesteld ten aanzien van de vorm waarin de informatie bekend wordt
      gemaakt.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.3
  - number: 7.3.3
    text: |-
      Een ieder kan de informatie, bedoeld in het eerste lid, kosteloos gebruiken voor het aanbieden van interactieve
      gidsen of soortgelijke technieken die de eindgebruiker in staat stelt zich een onafhankelijk oordeel te vormen over
      de kosten van een alternatief gebruikspatroon.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.3
  - number: 7.3.4
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over het door de aanbieder van openbare elektronische
      communicatienetwerken of openbare elektronische communicatiediensten aan de eindgebruiker en Onze Minister te
      verstrekken informatie met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.3
  - number: 7.3.4.a
    text: |-
      wijzigingen betreffende de toegang tot noodhulpdiensten of de nauwkeurigheid van de op grond van
      [artikel 11.10][ref1] te verstrekken gegevens;


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel11
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.2'
  - number: 7.3.4.b
    text: wijzigingen in de voorwaarden voor beperking van de toegang tot of het gebruik van diensten en toepassingen;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.3
  - number: 7.3.4.c
    text: |-
      de door de aanbieder ingestelde maatregelen bij congestie en de gevolgen daarvan voor de kwaliteit van de
      dienstverlening;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.3
  - number: 7.3.4.d
    text: |-
      de in [artikel 11.6, tweede lid][ref1], genoemde keuzemogelijkheden van de abonnee met betrekking tot de vraag of
      zijn persoonsgegevens in een gids al dan niet zullen worden opgenomen, en de gegevens in kwestie; en


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel11
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.1'
  - number: 7.3.4.e
    text: producten en diensten voor eindgebruikers met een fysieke beperking.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.3
  - number: 7.3a.1
    text: |-
      De Autoriteit Consument en Markt kan aanbieders van openbare elektronische communicatiediensten een aanwijzing
      geven de betaling die gerelateerd is aan het gebruik van bij ministeriële regeling aan te wijzen categorieën van
      nummers op te schorten voor een door de Autoriteit Consument en Markt te bepalen periode, indien de Autoriteit
      Consument en Markt een aanwijzing heeft dat de nummergebruiker niet voldoet aan het gestelde bij of krachtens deze
      wet of een gedraging verricht als bedoeld in [artikel 4.4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel4
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.3a
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '4'
        hoofdstuk: '4'
  - number: 7.3a.2
    text: |-
      De aanbieder van een openbare elektronische communicatiedienst die een aanwijzing, bedoeld in het eerste lid, van
      de Autoriteit Consument en Markt heeft ontvangen, schort de betaling onverwijld op.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.3a
  - number: 7.3a.3
    text: |-
      De in het eerste lid genoemde periode is maximaal vier weken en kan door de Autoriteit Consument en Markt eenmalig
      met maximaal vier weken worden verlengd.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.3a
  - number: 7.3a.4
    text: |-
      De Autoriteit Consument en Markt stelt de nummergebruiker, voorzover deze bij de Autoriteit Consument en Markt
      bekend is, van de aanwijzing op de hoogte.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.3a
  - number: 7.3b.1
    text: |-
      De Autoriteit Consument en Markt kan aanbieders van openbare elektronische communicatiediensten een aanwijzing
      geven de aankiesbaarheid van een nummer uit bij ministeriële regeling aan te wijzen categorieën van nummers op
      te schorten voor een door de Autoriteit Consument en Markt te bepalen periode, indien de Autoriteit Consument en
      Markt een aanwijzing heeft dat de nummergebruiker niet voldoet aan het gestelde bij of krachtens deze wet of een
      gedraging verricht als bedoeld in [artikel 4.4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel4
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.3b
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '4'
        hoofdstuk: '4'
  - number: 7.3b.2
    text: |-
      De aanbieder van een openbare elektronische communicatiedienst die een aanwijzing, bedoeld in het eerste lid, van
      de Autoriteit Consument en Markt heeft ontvangen, schort de aankiesbaarheid onverwijld op.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.3b
  - number: 7.3b.3
    text: |-
      De in het eerste lid genoemde periode is maximaal vier weken en kan door de Autoriteit Consument en Markt eenmalig
      met maximaal vier weken worden verlengd.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.3b
  - number: 7.3b.4
    text: |-
      De Autoriteit Consument en Markt stelt de nummergebruiker, voorzover deze bij de Autoriteit Consument en Markt
      bekend is, van de aanwijzing op de hoogte.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.3b
  - number: 7.3c.1
    text: |-
      Indien de Autoriteit Consument en Markt heeft vastgesteld dat de nummergebruiker met betrekking tot een nummer
      gedurende een bepaalde periode niet heeft voldaan aan het gestelde bij of krachtens deze wet of een gedraging
      heeft verricht als bedoeld in [artikel 4.4][ref1], kan de Autoriteit Consument en Markt hiervan mededeling doen in
      de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel4
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.3c
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '4'
        hoofdstuk: '4'
  - number: 7.3c.2
    text: |-
      De aanbieder van een openbare elektronische communicatiedienst verlangt geen betaling van consumenten voor oproepen
      naar nummers indien:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.3c
  - number: 7.3c.2.a
    text: de nummers zijn genoemd in een mededeling als bedoeld in het eerste lid, en
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.3c
  - number: 7.3c.2.b
    text: de oproepen hebben plaatsgevonden gedurende de periode waarop die mededeling betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.3c
  - number: 7.3c.3
    text: |-
      Indien de consument reeds heeft betaald voor oproepen naar nummers als bedoeld in het tweede lid, betaalt de
      aanbieder de bedragen binnen twee maanden na publicatie van de mededeling als bedoeld in het eerste lid, terug.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.3c
  - number: 7.3d.1
    text: |-
      In aanvulling op de [artikelen 7.3a tot en met 7.3c][ref1] kunnen bij of krachtens algemene maatregel van bestuur
      regels worden gesteld voor aanbieders van openbare elektronische communicatienetwerken of openbare elektronische
      communicatiediensten inzake het blokkeren van de toegang tot een nummer of dienst en het opschorten van de aan dat
      nummer of die dienst gerelateerde betaling indien niet voldaan is aan het gestelde bij of krachtens deze wet of een
      gedraging als bedoeld in [artikel 4.4][ref2] verricht is.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel4
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.3d
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '7'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '4'
        hoofdstuk: '4'
  - number: 7.3d.2
    text: |-
      Bij de regels, bedoeld in het eerste lid, kunnen taken worden opgedragen en bevoegdheden worden verleend aan de
      Autoriteit Consument en Markt.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.3d
  - number: 7.4.1
    text: |-
      Aanbieders van openbare telefoondiensten op een vaste locatie of van openbare betaaltelefoons die krachtens
      [artikel 9.2][ref1] zijn aangewezen en aanbieders van vaste openbare telefoondiensten of van openbare
      betaaltelefoons die langer dan tweeënvijftig weken dergelijke diensten leveren, maken jaarlijks voor 1 april
      op genoegzame wijze een overzicht over het voorafgaande kalenderjaar bekend van de kwaliteit van de door hen
      aangeboden diensten op basis van de in bijlage III van [richtlijn nr. 2002/22/EG](32002L0022) gespecificeerde
      parameters, definities en meetmethoden. Het in de eerste volzin bedoelde overzicht bevat een beschrijving van de
      door de aanbieder genomen maatregelen om gelijkwaardige toegang voor eindgebruikers met een fysieke beperking te
      waarborgen. Het in de eerste volzin bedoelde overzicht wordt voor bekendmaking aan de Autoriteit Consument en Markt
      ter beschikking gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel9
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.4
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '9'
        hoofdstuk: '9'
  - number: 7.4.2
    text: |-
      Bij ministeriële regeling kunnen ten aanzien van de in het eerste lid genoemde verplichtingen nadere regels worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.4
  - number: 7.4.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen, voor zover niet voorzien op grond van het eerste lid,
      regels worden gesteld inzake het:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.4
  - number: 7.4.3.a
    text: |-
      door aanbieders van openbare elektronische communicatiediensten, aanbieders van openbare elektronische
      communicatienetwerken of programmadiensten maken van een periodiek overzicht van de kwaliteit van de door hen
      aangeboden diensten aan de hand van bij of krachtens die algemene maatregel van bestuur te bepalen parameters,
      definities en meetmethoden;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.4
  - number: 7.4.3.b
    text: |-
      door de Autoriteit Consument en Markt, of een door de Autoriteit Consument en Markt aan te wijzen onafhankelijke
      deskundige derde, onderzoeken of het overzicht in overeenstemming is met de desbetreffende regels, en
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.4
  - number: 7.4.3.c
    text: bekendmaken van het overzicht en het ter beschikking stellen daarvan aan de Autoriteit Consument en Markt.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.4
  - number: 7.4.4
    text: |-
      De regels, bedoeld in het derde lid, kunnen verschillen voor bij die regels te bepalen categorieën van openbare
      elektronische communicatiediensten of programmadiensten.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.4
  - number: 7.4.5
    text: |-
      Bij de regels, bedoeld in het tweede en derde lid, kunnen taken worden opgedragen en bevoegdheden worden verleend
      aan de Autoriteit Consument en Markt.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.4
  - number: 7.4a.1
    text: |-
      Aanbieders van openbare elektronische communicatienetwerken waarover internettoegangsdiensten worden geleverd en
      aanbieders van internettoegangsdiensten belemmeren of vertragen geen diensten of toepassingen op het internet,
      tenzij en voor zover de betreffende maatregel waarmee diensten of toepassingen worden belemmerd of vertraagd
      noodzakelijk is:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.4a
  - number: 7.4a.1.a
    text: om de gevolgen van congestie te beperken, waarbij gelijke soorten verkeer gelijk worden behandeld;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.4a
  - number: 7.4a.1.b
    text: |-
      ten behoeve van de integriteit en de veiligheid van het netwerk en de dienst van de betrokken aanbieder of het
      randapparaat van de eindgebruiker;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.4a
  - number: 7.4a.1.c
    text: |-
      om de doorgifte van ongevraagde communicatie als bedoeld in [artikel 11.7, eerste lid][ref1], aan een eindgebruiker
      te beperken, mits de eindgebruiker daarvoor voorafgaand toestemming heeft verleend, of


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel11
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.4a
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.1'
  - number: 7.4a.1.d
    text: ter uitvoering van een wettelijk voorschrift of rechterlijk bevel.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.4a
  - number: 7.4a.2
    text: |-
      Indien een inbreuk op de integriteit of veiligheid van het netwerk of de dienst of een randapparaat van
      een eindgebruiker, bedoeld in het eerste lid, onderdeel b, wordt veroorzaakt door verkeer afkomstig van een
      randapparaat van een eindgebruiker, doet de aanbieder voorafgaand aan het nemen van een maatregel waarmee het
      verkeer wordt belemmerd of vertraagd, melding aan de betrokken eindgebruiker, zodat de eindgebruiker de gelegenheid
      heeft de inbreuk te staken. Wanneer dit wegens de vereiste spoed niet voorafgaand aan het nemen van de maatregel
      mogelijk is, doet de aanbieder zo snel mogelijk melding van de maatregel. Wanneer het een eindgebruiker van een
      andere aanbieder betreft is de eerste volzin niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.4a
  - number: 7.4a.3
    text: |-
      Aanbieders van internettoegangsdiensten stellen de hoogte van tarieven voor internettoegangsdiensten niet
      afhankelijk van de diensten en toepassingen die via deze diensten worden aangeboden of gebruikt.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.4a
  - number: 7.4a.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot het bepaalde
      in het eerste tot en met derde lid. De voordracht voor een krachtens dit lid vast te stellen algemene maatregel
      van bestuur wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is
      overgelegd.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.4a
  - number: 7.4a.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ter voorkoming van een achteruitgang van de dienstverlening
      en een belemmering of vertraging van het verkeer over openbare elektronische communicatienetwerken, nadere
      minimumvoorschriften inzake de kwaliteit van openbare elektronische communicatiediensten worden gesteld aan
      aanbieders van openbare elektronische communicatienetwerken.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.4a
  - number: '7.5'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld inzake het, met inachtneming van het bepaalde bij of
      krachtens [hoofdstuk 11][ref1], aan derden ter beschikking stellen van bij die regels aan te wijzen categorieën
      van nummers met bijbehorende gegevens ten behoeve van de beschikbaarheid van telefoongidsen en van een abonnee-
      informatiedienst.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk11
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.5
    references:
      - id: ref1
        bwb_id: BWBR0009950
        hoofdstuk: '11'
  - number: 7.6.1
    text: |-
      Aanbieders van openbare telefoondiensten of openbare elektronische communicatienetwerken voor zover die worden
      gebruikt om openbare telefoondiensten aan te bieden zorgen ervoor dat de eindgebruikers van dat netwerk en van die
      diensten toegang hebben tot de diensten van een telefonist en tot een abonnee-informatiedienst.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.6
  - number: 7.6.2
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld waaraan de in het eerste lid bedoelde abonnee-
      informatiedienst moet voldoen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.6
  - number: 7.6a.1
    text: |-
      Een aanbieder van een internettoegangsdienst aan een eindgebruiker kan de levering van deze dienst slechts geheel
      of gedeeltelijk beëindigen of opschorten:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.6a
  - number: 7.6a.1.a
    text: op verzoek van de abonnee;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.6a
  - number: 7.6a.1.b
    text: bij een tekortkoming in de nakoming van de betalingsverplichting door de abonnee of faillissement van de abonnee;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.6a
  - number: 7.6a.1.c
    text: |-
      bij bedrog in de zin van [artikel 3:44 van het Burgerlijk Wetboek][ref1] door de abonnee;


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel44
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.6a
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '44'
  - number: 7.6a.1.d
    text: |-
      wanneer de looptijd van de overeenkomst van bepaalde duur tot levering van de internettoegangsdienst afloopt en de
      overeenkomst met instemming van de abonnee niet wordt verlengd of vernieuwd;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.6a
  - number: 7.6a.1.e
    text: ter uitvoering van een wettelijk voorschrift of rechterlijk bevel;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.6a
  - number: 7.6a.1.f
    text: |-
      bij overmacht en onvoorziene omstandigheden in de zin van [artikel 6:258 van het Burgerlijk Wetboek][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel258
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.6a
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '258'
  - number: 7.6a.1.g
    text: |-
      voor zover dit noodzakelijk is ter bescherming van de integriteit en de veiligheid van het netwerk en de dienst van
      de betrokken aanbieder, of het randapparaat van de eindgebruiker, of
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.6a
  - number: 7.6a.1.h
    text: |-
      voor zover dit ten gevolge van het gedrag van de abonnee noodzakelijk is ter bescherming van de veiligheid van een
      natuurlijk persoon die, al dan niet op grond van een arbeidsovereenkomst, arbeid verricht voor de aanbieder van
      de internettoegangsdienst.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.6a
  - number: 7.6a.2
    text: |-
      In aanvulling op het eerste lid kan een aanbieder van een internettoegangsdienst de levering van deze dienst
      met ten hoogste een maand opschorten ter voorkoming van een ongebruikelijk hoge rekening, op voorwaarde dat de
      internettoegangsaanbieder de abonnee vooraf op de hoogte heeft gesteld van zijn voornemen de levering van de
      internettoegangsdienst op te schorten en de abonnee daar geen bezwaar tegen heeft gemaakt binnen een door de
      aanbieder gestelde redelijke termijn.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.6a
  - number: 7.6a.3
    text: |-
      De aanbieder gaat niet over tot een maatregel als bedoeld in het eerste lid, aanhef en onderdeel c, dan nadat hij
      de abonnee schriftelijk op de hoogte heeft gesteld van het voornemen om tot deze maatregel over te gaan, voorzien
      van een schriftelijke motivering omtrent het gestelde bedrog, en hij de abonnee een redelijke termijn heeft geboden
      om op het voornemen en het gestelde bedrog te reageren.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.6a
  - number: 7.6a.4
    text: |-
      Voorafgaand aan het nemen van een maatregel, bedoeld in het eerste lid, onderdeel g, doet de aanbieder melding
      aan de betrokken abonnee, en geeft de abonnee daarbij de gelegenheid de in dit onderdeel bedoelde bedreiging van
      de integriteit en veiligheid van netwerk, dienst of randapparaat weg te nemen. Wanneer dit wegens de vereiste
      spoed niet voorafgaand aan het nemen van de maatregel mogelijk is, doet de aanbieder zo snel mogelijk melding van
      de maatregel.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.6a
  - number: 7.7.1
    text: |-
      Aanbieders van openbare elektronische communicatienetwerken die worden gebruikt om uitgaande gesprekken naar een
      nummer in het nummerplan aan te bieden, openbare betaaltelefoons en openbare telefoondiensten stellen het gebruik
      van alarmnummers kosteloos en zonder toegangsbelemmeringen ter beschikking aan alle gebruikers van hun dienst.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.7
  - number: 7.7.2
    text: |-
      Onder een alarmnummer als bedoeld in het eerste lid, wordt verstaan een nummer dat in een nummerplan als bedoeld in
      [artikel 4.1, eerste lid][ref1], bestemd is als alarmnummer.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel4
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.7
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '4'
        hoofdstuk: '4'
  - number: 7.7.3
    text: |-
      Aanbieders van openbare elektronische communicatienetwerken die worden gebruikt om uitgaande gesprekken naar
      een nummer in het nummerplan aan te bieden, openbare betaaltelefoons en openbare telefoondiensten treffen de
      voorzieningen die noodzakelijk zijn om de ononderbroken toegang tot alarmnummers te waarborgen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.7
  - number: 7.7.4
    text: |-
      Onze Minister kan ontheffing verlenen van het bepaalde in het derde lid, indien het technisch niet uitvoerbaar
      dan wel economisch niet haalbaar is de in dat lid bedoelde voorzieningen te treffen. Een ontheffing kan onder
      beperkingen worden verleend. Onze Minister kan voorschriften verbinden aan een ontheffing.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.7
  - number: 7.7a.1
    text: |-
      Onverminderd [artikel 11.9][ref1], kunnen bij ministeriële regeling regels worden gesteld ter uitvoering van
      bijlage I van richtlijn nr. 2002/22/EG. Deze regels hebben betrekking op het door aanbieders van openbare
      elektronische communicatienetwerken of openbare telefoondiensten aan hun eindgebruikers beschikbaar stellen van
      faciliteiten als bedoeld in de in de eerste volzin bedoelde bijlage I.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel11
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.7a
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.2'
  - number: 7.7a.2
    text: |-
      Een krachtens het eerste lid opgelegde verplichting die strekt tot uitvoering van bijlage I, deel B, van richtlijn
      nr. 2002/22/EG, geldt niet indien deze technisch niet uitvoerbaar dan wel economisch niet haalbaar is.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.7a
  - number: 7.8.1
    text: |-
      Voor zover de andere artikelen van dit hoofdstuk hierin niet voorzien, kunnen bij of krachtens algemene maatregel
      van bestuur regels worden gesteld voor aanbieders van openbare elektronische communicatienetwerken, openbare
      elektronische communicatiediensten, nummergebruikers of programmadiensten inzake de bescherming van natuurlijke
      personen die gebruik maken van of verzoeken om openbare elektronische communicatiediensten, nummergebruikers of
      programmadiensten voor andere dan bedrijfs- of beroepsdoeleinden. De regels kunnen onder meer betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.8
  - number: 7.8.1.a
    text: het bekendmaken van informatie over de geldende tarieven;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.8
  - number: 7.8.1.b
    text: de tarifering van bij ministeriële regeling aangewezen categorieën van nummers;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.8
  - number: 7.8.1.c
    text: |-
      de omstandigheden waaronder een aanbieder de levering van een openbare elektronische communicatiedienst mag
      opschorten of beëindigen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.8
  - number: 7.8.2
    text: |-
      De regels, bedoeld in het eerste lid, kunnen voor bij die regels te bepalen categorieën van openbare elektronische
      communicatienetwerken, openbare elektronische communicatiediensten, nummergebruikers of programmadiensten
      verschillen. Bij die regels kunnen taken worden opgedragen en bevoegdheden worden verleend aan de Autoriteit
      Consument en Markt.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.8
  - number: 7.8.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld voor aanbieders van openbare
      elektronische communicatiediensten en -netwerken waardoor eindgebruikers met een fysieke beperking:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.8
  - number: 7.8.3.a
    text: |-
      toegang tot openbare elektronische communicatiediensten hebben die gelijkwaardig is aan die van de meerderheid van
      de eindgebruikers, en
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.8
  - number: 7.8.3.b
    text: |-
      profiteren van de keuze tussen ondernemingen en diensten die ter beschikking staan van de meerderheid van de
      eindgebruikers.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.8
  - number: '7.9'
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden gesteld met betrekking tot het door een aanbieder van
      een openbaar elektronisch communicatienetwerk of openbare elektronische communicatiedienst innen van gelden
      verschuldigd voor andere diensten dan het door hem geleverde openbare elektronische communicatienetwerk of de door
      hem geleverde openbare elektronische communicatiedienst.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel7.9
  - number: '8.3'
    text: |-
      Onze Minister kan, in overeenstemming met Onze Minister van Onderwijs, Cultuur en Wetenschap, aanbieders van
      openbare elektronische communicatienetwerken die bestaan uit radiozendapparaten die geschikt zijn voor het
      verspreiden van programma-aanbod, verplichten om programma-aanbod uit te zenden dat hem in overeenstemming met
      de [Mediawet][ref1] ter verspreiding wordt aangeboden door instellingen die belast zijn met de verzorging van de
      publieke mediadiensten, bedoeld in [hoofdstuk 2 van de Mediawet 2008][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025028
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel8.3
    references:
      - id: ref1
        bwb_id: BWBR0025028
      - id: ref2
        bwb_id: BWBR0025028
        hoofdstuk: '2'
  - number: 8.4a.1
    text: |-
      Bij ministeriële regeling worden ter uitvoering van een bindend besluit van de Raad van de Europese Unie, van het
      Europees Parlement en de Raad gezamenlijk of van de Europese Commissie, technische voorschriften gegeven voor het
      uitzenden van een televisieprogramma als bedoeld in [artikel 1.1 van de Mediawet 2008][ref1], dat bedoeld is om
      te worden uitgezonden in een aspectverhouding groter dan 4:3, of dat bedoeld is om volledig digitaal te worden
      uitgezonden door middel van een openbaar elektronisch communicatienetwerk.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel1
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel8.4a
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '1'
  - number: 8.4a.2
    text: |-
      Bij ministeriële regeling worden ter uitvoering van een bindend besluit als bedoeld in het eerste lid voorts
      technische eisen gesteld aan openbare elektronische communicatienetwerken met behulp waarvan de uitzending van
      televisieprogramma's op een volledig digitale wijze plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel8.4a
  - number: 8.5.1
    text: |-
      Bij algemene maatregel van bestuur worden ter uitvoering van een bindend besluit van de Raad van de Europese Unie,
      van het Europees Parlement en de Raad gezamenlijk, of van de Europese Commissie regels gegeven met betrekking tot
      het door aanbieders verlenen van toegang tot systemen voor voorwaardelijke toegang die geschikt en bestemd zijn
      voor de uitzending van diensten die kunnen worden ontvangen met behulp van digitale televisie- of radiosystemen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel8.5
  - number: 8.5.2
    text: 'De in het eerste lid bedoelde regels hebben in elk geval betrekking op:'
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel8.5
  - number: 8.5.2.a
    text: de technische mogelijkheden van de systemen voor voorwaardelijke toegang ten behoeve van controleoverdracht;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel8.5
  - number: 8.5.2.b
    text: het verlenen van toegang tot systemen voor voorwaardelijke toegang en de voorwaarden waaronder dit geschiedt, en
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel8.5
  - number: 8.5.2.c
    text: |-
      het voeren van een gescheiden boekhouding voor de activiteiten in verband met het aanbod van systemen voor
      voorwaardelijke toegang en voor overige activiteiten.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel8.5
  - number: 8.5.3
    text: |-
      Bij algemene maatregel van bestuur kunnen ter uitvoering van een bindend besluit als bedoeld in het eerste lid
      regels worden gegeven met betrekking tot het verlenen van licenties door houders van industriële eigendomsrechten
      aan fabrikanten van consumentenapparaten waarin gebruik wordt gemaakt van voorwaardelijke toegangsystemen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel8.5
  - number: 8.5.4
    text: |-
      Bij de regels, bedoeld in het eerste lid, kunnen taken worden opgedragen en bevoegdheden worden verleend aan de
      Autoriteit Consument en Markt.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel8.5
  - number: 8.6.1
    text: |-
      Met het oog op het waarborgen van de toegang van eindgebruikers en eindgebruikers met een fysieke beperking tot
      bij algemene maatregel van bestuur aan te wijzen diensten die op digitale wijze worden uitgezonden en die kunnen
      worden ontvangen met behulp van televisie- of radiosystemen, kunnen bij algemene maatregel van bestuur regels
      worden gegeven met betrekking tot het verlenen van toegang tot applicatieprogramma-interfaces of elektronische
      programmagidsen door aanbieders.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel8.6
  - number: 8.6.2
    text: |-
      De in het eerste lid bedoelde regels hebben ten aanzien van aanbieders van applicatieprogramma-interfaces dan wel
      elektronische programmagidsen in elk geval betrekking op:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel8.6
  - number: 8.6.2.a
    text: |-
      het verlenen van toegang tot applicatieprogramma-interfaces dan wel elektronische programmagidsen, alsmede de
      voorwaarden waaronder dit geschiedt;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel8.6
  - number: 8.6.2.b
    text: het verstrekken van informatie met betrekking tot toegang en de wijze van gebruik van de verstrekte informatie, en
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel8.6
  - number: 8.6.2.c
    text: |-
      het voeren van een gescheiden boekhouding voor de activiteiten in verband met het aanbod van applicatieprogramma-
      interfaces onderscheidenlijk elektronische programmagidsen en voor de overige activiteiten.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel8.6
  - number: 8.6.3
    text: |-
      Bij de regels, bedoeld in het eerste lid, kunnen taken worden opgedragen en bevoegdheden worden verleend aan de
      Autoriteit Consument en Markt.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel8.6
  - number: '8.7'
    text: |-
      Wanneer door de Autoriteit Consument en Markt de in [artikel 6a.6][ref1] bedoelde verplichting wordt opgelegd aan
      een onderneming die openbare elektronische communicatienetwerken aanbiedt die gebruikt worden voor het verspreiden
      van programma's, is deze onderneming tevens verplicht toegang te verlenen tot het door haar samengestelde
      programma-aanbod voor zover dat programma-aanbod niet versleuteld naar alle aangeslotenen op desbetreffende
      netwerken wordt verspreid, met dien verstande dat de gevraagde toegang alleen behoeft te worden verleend:


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel8.7
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.2
  - number: 8.7.a
    text: |-
      in het geval een aanbieder van een programma wenst dat degenen naar wie het programma wordt verspreid, bijdragen in
      de kosten van dat programma, de kosten van de verspreiding hieronder begrepen, en deze aanbieder door de wijze van
      verspreiding hiervoor feitelijk is aangewezen op de onderneming die de openbare elektronische communicatienetwerken
      aanbiedt, en
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel8.7
  - number: 8.7.b
    text: |-
      de onderneming die de openbare elektronische communicatienetwerken aanbiedt geen transparante of objectieve gronden
      heeft om de toegang te weigeren.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel8.7
  - number: 9.1.1
    text: |-
      De volgende diensten en voorzieningen zijn voor iedere eindgebruiker, onafhankelijk van diens geografische locatie,
      tegen een betaalbare prijs en met een bepaalde kwaliteit beschikbaar:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel9.1
  - number: 9.1.1.a
    text: |-
      het naar aanleiding van een redelijk verzoek aansluiten op een openbaar elektronisch communicatienetwerk op een
      vaste locatie;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel9.1
  - number: 9.1.1.b
    text: het leveren van een openbare telefoondienst over de in onderdeel a bedoelde netwerkaansluiting;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel9.1
  - number: 9.1.1.c
    text: openbare betaaltelefoons;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel9.1
  - number: 9.1.1.d
    text: gedrukte of elektronische telefoongidsen;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel9.1
  - number: 9.1.1.e
    text: een abonnee-informatiedienst, en
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel9.1
  - number: 9.1.1.f
    text: |-
      diensten of voorzieningen waardoor eindgebruikers met een fysieke beperking toegang hebben tot de in onderdeel b, d
      en e genoemde diensten en voorzieningen op een niveau gelijkwaardig aan dat van andere eindgebruikers.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel9.1
  - number: 9.1.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de kwaliteit en de aard van de in het
      eerste lid bedoelde diensten en voorzieningen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel9.1
  - number: 9.1.3
    text: |-
      Ter uitvoering van hoofdstuk II van [richtlijn nr. 2002/22/EG](32002L0022), kunnen bij algemene maatregel
      van bestuur andere dan de in het eerste lid bedoelde openbare elektronische communicatiediensten of daarmee
      samenhangende voorzieningen worden aangewezen die voor in die maatregel te bepalen categorieën van eindgebruikers,
      onafhankelijk van hun geografische locatie, beschikbaar moeten zijn tegen een betaalbare prijs en met een bij of
      krachtens die maatregel te bepalen kwaliteit.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel9.1
  - number: 9.1.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de in het eerste of derde lid
      bedoelde prijs. Bij de in de eerste volzin bedoelde regels over de prijs kan onderscheid gemaakt worden tussen
      groepen eindgebruikers.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel9.1
  - number: 9.2.1
    text: |-
      Indien naar het oordeel van Onze Minister de beschikbaarheid, de betaalbaarheid of de kwaliteit
      van een of meer van de openbare elektronische communicatiediensten of voorzieningen, bedoeld in
      [artikel 9.1, eerste of derde lid][ref1], niet door het normale functioneren van de markt wordt of zal kunnen
      worden gegarandeerd, kan Onze Minister bij besluit overeenkomstig de in [artikel 9.3][ref2] geregelde procedure
      een onderneming aanwijzen die de universele dienst in een bij dat besluit te bepalen verzorgingsgebied voor ten
      hoogste tien jaar verzorgt. Onze Minister kan verschillende ondernemingen aanwijzen die verschillende diensten of
      voorzieningen, bedoeld in [artikel 9.1, eerste of derde lid][ref3], aanbieden of verschillende verzorgingsgebieden
      bestrijken.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel9
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel9.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '9'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '9'
        hoofdstuk: '9'
      - id: ref3
        bwb_id: BWBR0009950
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.2.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden ter uitvoering van hoofdstuk II van richtlijn nr. 2002/22/
      EG nadere regels gesteld die van toepassing zijn in het geval een aanwijzing tot verzorging van een of meer tot
      de universele dienst behorende diensten of voorzieningen is gegeven. Hierbij kunnen ter uitvoering van het in
      de eerste volzin genoemde hoofdstuk taken worden opgedragen en bevoegdheden worden verleend aan de Autoriteit
      Consument en Markt.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel9.2
  - number: 9.3.1
    text: |-
      Indien Onze Minister voornemens is over te gaan tot een aanwijzing als bedoeld in [artikel 9.2, eerste lid][ref1],
      stelt Onze Minister vast of de aanwijzing een onredelijke last in de zin van artikel 12, eerste lid, van richtlijn
      nr. 2002/22/EG kan vormen voor degene die wordt aangewezen als universeledienstverlener. Onze Minister kan
      voorafgaand aan die vaststelling de Autoriteit Consument en Markt vragen om advies.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel9
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel9.3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.3.2
    text: |-
      Indien Onze Minister vaststelt dat het aanwijzen van een universeledienstverlener geen onredelijke last
      kan vormen voor degene die wordt aangewezen, wordt de aanbieder, bedoeld in het vierde lid, aangewezen als
      universeledienstverlener. Het derde tot en met negende lid en de [artikelen 9.4][ref1] en [9.5][ref2] zijn niet
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel9
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel9.3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '9'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.3.3
    text: |-
      Indien Onze Minister vaststelt dat de aanwijzing een onredelijke last kan vormen voor degene die wordt aangewezen
      als universeledienstverlener maakt Onze Minister het voornemen over te gaan tot een aanwijzing bekend in de
      Staatscourant. In die bekendmaking worden de te verzorgen dienst of voorziening, het verzorgingsgebied en de
      periode waarvoor de aanwijzing zal gelden vermeld en wordt gewezen op de in het vijfde lid geregelde mogelijkheid
      een bod uit te brengen op de aanwijzing.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel9.3
  - number: 9.3.4
    text: 'Onze Minister maakt op de datum van de in het derde lid bedoelde bekendmaking het voornemen voorts bekend aan:'
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel9.3
  - number: 9.3.4.a
    text: |-
      in het geval van een te verzorgen dienst, bedoeld in [artikel 9.1, eerste lid, onderdeel a:][ref1] de aanbieder
      van het openbare elektronische communicatienetwerk waarop in het verzorgingsgebied de meeste eindgebruikers zijn
      aangesloten;


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel9
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel9.3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.3.4.b
    text: |-
      in het geval van een te verzorgen dienst, bedoeld in [artikel 9.1, eerste lid, onderdeel b tot en met f][ref1]: de
      aanbieder van de te verzorgen openbare elektronische communicatiedienst, of, bij het ontbreken daarvan, een daarmee
      samenhangende dienst, waarvan in het verzorgingsgebied de meeste eindgebruikers gebruik maken; of


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel9
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel9.3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.3.4.c
    text: |-
      in het geval van een te verzorgen voorziening: de aanbieder van de met de te verzorgen voorziening samenhangende
      openbare elektronische communicatiedienst waarvan in het verzorgingsgebied de meeste eindgebruikers gebruik maken.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel9.3
  - number: 9.3.5
    text: |-
      Binnen acht weken na de datum van de in het derde lid, bedoelde bekendmaking kan bij Onze Minister een bod worden
      uitgebracht op de aanwijzing en brengt de aanbieder, bedoeld in het vierde lid, in ieder geval zijn bod uit.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel9.3
  - number: 9.3.6
    text: 'Bij ministeriële regeling wordt bepaald of een bod wordt uitgebracht door:'
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel9.3
  - number: 9.3.6.a
    text: het opgeven van een bedrag per jaar, of
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel9.3
  - number: 9.3.6.b
    text: |-
      het opgeven van een bedrag per in de ministeriële regeling aangewezen eenheid van het gebruik of de af te nemen
      voorziening.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel9.3
  - number: 9.3.7
    text: |-
      Een bod wordt geweigerd indien de bieder naar verwachting de universele dienst niet naar behoren zal kunnen
      verzorgen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel9.3
  - number: 9.3.8
    text: |-
      Degene die het laagste bod heeft uitgebracht, dat niet op grond van het zevende lid is geweigerd, wordt aangewezen
      als universeledienstverlener.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel9.3
  - number: 9.3.9
    text: |-
      Indien uit de in het achtste lid bedoelde vergelijking blijkt dat meer dan een bieder het laagste bod hebben
      uitgebracht, wordt door middel van het lot beslist wie van hen wordt aangewezen als universeledienstverlener.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel9.3
  - number: 9.4.1
    text: |-
      Indien het bod op de in [artikel 9.3, zesde lid, onderdeel a][ref1], bedoelde wijze is uitgebracht, bestaat
      de vergoeding uit het bod, uitgebracht door degene die op grond van artikel 9.3, achtste of negende lid, is
      aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel9
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel9.4
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.4.2
    text: |-
      Indien het bod op de in [artikel 9.3, zesde lid, onderdeel b][ref1], bedoelde wijze is uitgebracht, bestaat de
      vergoeding uit het bod, uitgebracht door degene die op grond van artikel 9.3, achtste of negende lid, is aangewezen
      als universeledienstverlener, vermenigvuldigd met het aantal daadwerkelijk gebruikte eenheden in het betreffende
      kalenderjaar, vermeerderd met het eventueel in de ministeriële regeling op grond van artikel 9.3, zesde lid,
      vastgestelde van het gebruik onafhankelijke bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel9
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel9.4
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.4.3
    text: |-
      In afwijking van het bepaalde in het eerste en tweede lid, kan het in het bod genoemde bedrag door Onze Minister
      gematigd worden voor zover het bod bestaat uit onevenredig meer dan de door Onze Minister verwachte werkelijke
      kosten die de aanbieder maakt als gevolg van de aanwijzing en waartegenover als gevolg van de bij of krachtens
      [artikel 9.1, vierde lid][ref1], gestelde regels omtrent de betaalbaarheid geen vergoeding door eindgebruikers
      staat, met inbegrip van een redelijke winstopslag.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel9
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel9.4
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.4.4
    text: De hoogte van de vergoeding wordt bekendgemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel9.4
  - number: 9.4.5
    text: |-
      Indien het bod op de in [artikel 9.3, zesde lid, onderdeel b][ref1], bedoelde wijze werd uitgebracht verstrekt
      degene die op grond van artikel 9.3, achtste of negende lid, is aangewezen als universeledienstverlener het aantal
      daadwerkelijk in het betreffende kalenderjaar gebruikte eenheden binnen vier weken na het eind van het kalenderjaar
      aan Onze Minister. Bij ministeriële regeling kunnen regels worden gesteld over de wijze waarop de gegevens worden
      verstrekt. Onze Minister publiceert de vergoeding voor het betreffende kalenderjaar in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel9
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel9.4
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.4.6
    text: |-
      Onze Minister betaalt de vergoeding voor het betreffende kalenderjaar uit binnen drie maanden na afloop van het
      kalenderjaar. Deze termijn kan worden verlengd met het aantal dagen waarmee de in het vijfde lid bedoelde termijn
      wordt overschreden.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel9.4
  - number: 9.5.1
    text: |-
      Indien ingevolge [artikel 9.4][ref1] aan degene die is aangewezen als universeledienstverlener, een vergoeding
      wordt toegekend, is eenieder die openbare elektronische communicatiediensten, openbare elektronische
      communicatienetwerken of bijbehorende faciliteiten aanbiedt, en die in het kalenderjaar voorafgaande aan het
      kalenderjaar waarop de te betalen vergoeding betrekking heeft, daaruit in Nederland een hogere omzet realiseert
      dan een bij of krachtens algemene maatregel van bestuur te bepalen bedrag, aan de Autoriteit Consument en Markt een
      bijdrage verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel9
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel9.5
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.5.2
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald hoe de bijdrage, bedoeld in het eerste lid, wordt berekend en
      wanneer deze verschuldigd is.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel9.5
  - number: '9.6'
    text: |-
      Degene die op grond van een aanwijzing als bedoeld in [artikel 9.2, eerste lid][ref1], openbare elektronische
      communicatiediensten of voorzieningen verzorgt, draagt gedurende de looptijd van de aanwijzing niet een
      belangrijk deel of het geheel van zijn aansluitnetwerk over aan een afzonderlijke rechtspersoon met een andere
      eigenaar dan nadat daartoe toestemming van Onze Minister is verkregen. Onze Minister verleent toestemming
      tenzij hij verwacht dat een dergelijke overdracht een nadelige invloed heeft op de levering van de in
      [artikel 9.1, eerste lid, onderdelen a en b][ref2], genoemde diensten. Onze Minister kan voorwaarden opleggen
      overeenkomstig artikel 6, tweede lid, van de Machtigingsrichtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel9
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel9.6
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '9'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '9'
        hoofdstuk: '9'
  - number: 10.1.1
    text: |-
      Het is verboden uitrusting die niet voldoet aan de krachtens [artikel 10.3, onderdeel a, b, c en e][ref1] gestelde
      voorschriften, in de handel te brengen of te verhandelen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel10
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel10.1
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: '10.1'
  - number: 10.1.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over uitzonderingen op het in
      het eerste lid bedoelde verbod.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel10.1
  - number: 10.2.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over speciale maatregelen betreffende
      de ingebruikneming of het gebruik van uitrusting die voldoet aan de bij of krachtens dit hoofdstuk gestelde
      voorschriften. Deze regels betreffen:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel10.2
  - number: 10.2.1.a
    text: |-
      maatregelen om een bestaand of te verwachten probleem in verband met de eisen waar uitrusting aan moet voldoen op
      een bepaalde locatie te verhelpen;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel10.2
  - number: 10.2.1.b
    text: |-
      maatregelen die om veiligheidsredenen genomen worden om openbare elektronische communicatienetwerken of apparaten
      die naar hun aard bestemd zijn voor het zenden of ontvangen van radiocommunicatiesignalen te beschermen, indien
      deze worden gebruikt voor veiligheidsdoeleinden in duidelijk gedefinieerde spectrumsituaties.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel10.2
  - number: 10.2.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de middelen die Onze Minister kan
      gebruiken om het in de handel brengen of verhandelen van radiozendapparaten of categorieën van radiozendapparaten
      te beëindigen of te beperken, indien de vrees is gewettigd dat door de betrokken radiozendapparaten ontoelaatbare
      belemmeringen worden veroorzaakt in het etherverkeer, in andere radiozendapparaten of in ontvangapparaten.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel10.2
  - number: '10.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ter implementatie van conformiteitsrichtlijnen en bijlage II
      van de Overeenkomst betreffende de Europese Economische Ruimte regels worden gesteld, inzake:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel10.3
  - number: 10.3.a
    text: eisen waar uitrusting aan moet voldoen;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel10.3
  - number: 10.3.b
    text: de conformiteitsbeoordeling van uitrusting;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel10.3
  - number: 10.3.c
    text: het aanbrengen van markeringen;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel10.3
  - number: 10.3.d
    text: |-
      de aanwijzing, accreditatie en bevoegdheden van instanties die betrokken kunnen worden bij de
      conformiteitsbeoordeling, alsmede de intrekking van de aanwijzing;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel10.3
  - number: 10.3.e
    text: informatieverplichtingen met betrekking tot uitrusting;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel10.3
  - number: 10.3.f
    text: |-
      de aansluiting van uitrusting op openbare elektronische communicatienetwerken, alsmede het afsluiten of buiten
      gebruikstellen van die uitrusting;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel10.3
  - number: 10.3.g
    text: |-
      de door een aanbieder van een openbaar elektronisch communicatienetwerk te verstrekken informatie over de
      technische specificaties van netwerkaansluitpunten.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel10.3
  - number: '10.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels gesteld worden ter uitvoering van tussen de Europese
      Gemeenschap en derde landen gesloten overeenkomsten inzake wederzijdse erkenning van conformiteitsbeoordelingen
      van uitrusting, ondermeer over de aanwijzing van instanties die betrokken kunnen worden bij de
      conformiteitsbeoordeling, alsmede de intrekking van de aanwijzing.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel10.4
  - number: 10.5.1
    text: |-
      Bij ministeriële regeling worden ter uitvoering van een bindend besluit van de Raad van de Europese
      Unie, van het Europees Parlement en de Raad gezamenlijk of van de Europese Commissie regels gesteld
      ter zake van apparaten bestemd voor de ontvangst en weergave van televisieprogramma’s als bedoeld in
      [artikel 1.1 van de Mediawet 2008][ref1], en van apparaten bestemd voor het ontsleutelen van versleutelde digitale
      televisiesignalen.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel1
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel10.5
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '1'
  - number: 10.5.2
    text: |-
      Het is verboden apparaten als bedoeld in het eerste lid te verkopen, te verhuren of anderszins ter beschikking te
      stellen indien niet wordt voldaan aan de krachtens het eerste lid gestelde regels.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel10.5
  - number: '10.6'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld inzake het maken van reclame
      voor uitrusting waarvan het in de handel brengen of het verhandelen op grond van [artikel 10.1][ref1] of
      [artikel 10.5][ref2] is verboden.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel10
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel10.6
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: '10.1'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: '10.1'
  - number: '10.7'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld inzake de behandeling van klachten
      over elektromagnetische storingen, ondervonden van het gebruik van uitrusting, of over belemmeringen, welke bij het
      gebruik van radiozendapparaten of randapparaten worden ondervonden.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel10.7
  - number: '10.8'
    text: |-
      Voor de toepassing van de [artikelen 10.9 tot en met 10.11][ref1] worden met radiozendapparaten gelijk gesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel10
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel10.8
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: '10.2'
  - number: 10.8.a
    text: |-
      elke samenvoeging van onderdelen geschikt om een radiozendapparaat dan wel een ingevolge het bepaalde onder b
      daarmee gelijkgesteld apparaat te vormen;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel10.8
  - number: 10.8.b
    text: |-
      de bij of krachtens algemene maatregel van bestuur te omschrijven elektrische of elektronische apparaten die
      geschikt zijn om door gebruik tezamen met een radiozendapparaat een radiozendapparaat te vormen met andere
      technische eigenschappen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel10.8
  - number: 10.9.1
    text: |-
      Het aanleggen, het geheel of gedeeltelijk aangelegd aanwezig hebben, of het gebruik van radiozendapparaten
      is slechts toegestaan indien voor het gebruik ervan aan de houder van die radiozendapparaten op grond van
      [hoofdstuk 3][ref1] een vergunning voor het gebruik van frequentieruimte is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel10.9
    references:
      - id: ref1
        bwb_id: BWBR0009950
        hoofdstuk: '3'
  - number: 10.9.2
    text: |-
      In afwijking van het eerste lid, is het aanleggen, het geheel of gedeeltelijk aanwezig hebben, of het gebruik
      van radiozendapparaten zonder dat aan de houder een vergunning is verleend voor het gebruik van frequentieruimte,
      toegestaan, indien:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel10.9
  - number: 10.9.2.a
    text: |-
      krachtens [hoofdstuk 3][ref1] geen vergunning is vereist voor het gebruik van frequentieruimte en, indien voor het
      gebruik melding en registratie verplicht zijn krachtens [artikel 3.9, eerste lid, onder d][ref2], indien melding en
      registratie heeft plaatsgevonden;


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel10.9
    references:
      - id: ref1
        bwb_id: BWBR0009950
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 10.9.2.b
    text: |-
      de houder van het radiozendappararaat met de houder van een vergunning voor het gebruik van frequentieruimte een
      overeenkomst heeft gesloten voor de aanleg en het instandhouden van een radiozendapparaat ten behoeve van het
      verzorgen van diensten van de opdrachtgever waarbij gebruik wordt gemaakt van de aan de opdrachtgever toegewezen
      frequentieruimte;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel10.9
  - number: 10.9.2.c
    text: |-
      deze apparaten worden gebruikt aan boord van andere dan Nederlandse schepen of luchtvaartuigen en daarvoor een
      vergunning is afgegeven in overeenstemming met het Internationaal Telecommunicatieverdrag, of
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel10.9
  - number: 10.9.2.d
    text: |-
      deze apparaten worden gebruikt door niet-ingezetenen van Nederland die tijdelijk hier te lande verblijven en
      daartoe voor Nederland bindende afspraken zijn gemaakt.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel10.9
  - number: 10.10.1
    text: |-
      Onze Minister kan, in afwijking van [artikel 10.9, eerste lid][ref1], een vergunning verlenen voor het aanleggen
      van radiozendapparaten zonder dat aan de houder een vergunning is verleend voor gebruik van frequentieruimte. Een
      vergunning kan onder beperkingen worden verleend. Aan een vergunning kunnen voorschriften worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel10
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel10.10
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: '10.2'
  - number: 10.10.2
    text: 'De vergunning kan worden geweigerd, indien:'
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel10.10
  - number: 10.10.2.a
    text: het ernstige vermoeden bestaat dat de vergunning zal worden misbruikt;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel10.10
  - number: 10.10.2.b
    text: |-
      een eerder verleende vergunning is ingetrokken wegens overtreding van de bij of krachtens deze wet gestelde regels
      dan wel van de aan de vergunning verbonden voorschriften;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel10.10
  - number: 10.10.2.c
    text: de aanvraag niet voldoet aan de bij of krachtens deze wet gestelde regels, of
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel10.10
  - number: 10.10.2.d
    text: de aanvrager naar het oordeel van Onze Minister geen gerechtvaardigd belang heeft bij verlening van de vergunning.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel10.10
  - number: 10.10.3
    text: 'De vergunning kan worden ingetrokken, indien:'
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel10.10
  - number: 10.10.3.a
    text: |-
      de houder van de vergunning de bij of krachtens deze wet gestelde regels dan wel de aan de vergunning verbonden
      voorschriften of beperkingen niet nakomt, of
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel10.10
  - number: 10.10.3.b
    text: de gronden waarop de vergunning is verleend zijn vervallen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel10.10
  - number: 10.11.1
    text: 'Het is verboden:'
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel10.11
  - number: 10.11.1.a
    text: |-
      een radiozendapparaat te gebruiken om aan boord van een schip of luchtvaartuig buiten elk nationaal gebied
      programma's uit te zenden;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel10.11
  - number: 10.11.1.b
    text: een radiozendapparaat, bestemd voor een gebruik als onder a bedoeld, te exploiteren;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel10.11
  - number: 10.11.1.c
    text: |-
      een radiozendapparaat ter beschikking te stellen of aan te leggen in de wetenschap, dat het is bestemd voor een
      gebruik als bedoeld onder a;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel10.11
  - number: 10.11.1.d
    text: |-
      een schip of luchtvaartuig ter beschikking te stellen in de wetenschap, dat dit is bestemd om aan boord daarvan
      uitzendingen te doen als onder a bedoeld.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel10.11
  - number: 10.11.2
    text: |-
      Het is verboden aan overtreding van een der in het eerste lid bedoelde verboden opzettelijk mee te werken door
      daarbij behulpzaam te zijn dan wel daartoe gelegenheid, middelen of inlichtingen te verschaffen. Als handelingen
      van medewerking worden in elk geval beschouwd:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel10.11
  - number: 10.11.2.a
    text: |-
      het ter beschikking stellen van materiaal ten behoeve van het schip of luchtvaartuig dan wel van het
      radiozendapparaat;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel10.11
  - number: 10.11.2.b
    text: het onderhouden of herstellen van het schip of luchtvaartuig dan wel van het radiozendapparaat;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel10.11
  - number: 10.11.2.c
    text: het bevoorraden van het schip of luchtvaartuig;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel10.11
  - number: 10.11.2.d
    text: |-
      het vervoeren van personen of goederen naar of van het schip of luchtvaartuig dan wel het ter beschikking stellen
      van middelen tot dat vervoer;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel10.11
  - number: 10.11.2.e
    text: het vervaardigen van programma's of onderdelen daarvan, bestemd om te worden uitgezonden;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel10.11
  - number: 10.11.2.f
    text: |-
      het geven van opdrachten tot het uitzenden van programma's of onderdelen daarvan dan wel het verlenen van
      bemiddeling bij het verkrijgen van zodanige opdrachten.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel10.11
  - number: 10.11.3
    text: |-
      Het tweede lid blijft buiten toepassing, indien de aldaar bedoelde handelingen worden verricht teneinde in geval
      van nood het schip of luchtvaartuig bij te staan of mensenlevens te beschermen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel10.11
  - number: 10.11.4
    text: |-
      Onder schip of luchtvaartuig wordt in dit artikel mede begrepen elk ander drijvend of door de lucht gedragen
      voorwerp.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel10.11
  - number: '11.1'
    text: 'In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.1
  - number: 11.1.a
    text: |-
      gebruiker: een natuurlijke persoon die gebruik maakt van een openbare elektronische communicatiedienst voor
      particuliere of zakelijke doeleinden zonder noodzakelijkerwijze op die dienst te zijn geabonneerd;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.1
  - number: 11.1.b
    text: |-
      verkeersgegevens: gegevens die worden verwerkt voor het overbrengen van communicatie over een elektronisch
      communicatienetwerk of voor de facturering ervan;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.1
  - number: 11.1.c
    text: |-
      verwerking van verkeersgegevens: verwerking als bedoeld in
      [artikel 1, onderdeel b, van de Wet bescherming persoonsgegevens][ref1], met dien verstande dat de desbetreffende
      handelingen mede betrekking hebben op verkeersgegevens van abonnees die geen natuurlijke personen zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel1
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.1
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '1'
  - number: 11.1.d
    text: |-
      locatiegegevens: gegevens die worden verwerkt in een openbaar elektronisch communicatienetwerk of een openbare
      elektronische communicatiedienst waarmee de geografische positie van de randapparatuur van een gebruiker van een
      openbare elektronische communicatiedienst wordt aangegeven;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.1
  - number: 11.1.e
    text: |-
      communicatie: informatie die wordt uitgewisseld of overgebracht tussen een eindig aantal partijen door middel
      van een openbare elektronische communicatiedienst; dit omvat niet de informatie die via een omroepdienst over een
      elektronisch communicatienetwerk wordt overgebracht, behalve wanneer de informatie kan worden gerelateerd aan de
      identificeerbare abonnee of gebruiker die de informatie ontvangt;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.1
  - number: 11.1.f
    text: |-
      oproep: een door middel van een openbare elektronische communicatiedienst tot stand gebrachte verbinding die
      spraakcommunicatie tussen gebruikers of abonnees over en weer mogelijk maakt;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.1
  - number: 11.1.g
    text: |-
      toestemming van een gebruiker of abonnee: toestemming van een betrokkene als bedoeld in
      [artikel 1, onder i, van de Wet bescherming persoonsgegevens][ref1], met dien verstande dat de toestemming mede
      betrekking kan hebben op gegevens van abonnees die geen natuurlijke personen zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel1
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.1
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '1'
  - number: 11.1.h
    text: |-
      dienst met toegevoegde waarde: dienst die de verwerking vereist van verkeersgegevens of locatiegegevens, niet
      zijnde verkeersgegevens, en die verder gaat dan hetgeen noodzakelijk is voor de overbrenging van een communicatie
      of de facturering daarvan;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.1
  - number: 11.1.i
    text: |-
      elektronisch bericht: tekst-, spraak-, geluids- of beeldbericht dat over een openbaar elektronisch
      communicatienetwerk wordt verzonden en in het netwerk of in de randapparatuur van de ontvanger kan worden
      opgeslagen tot het door de ontvanger wordt opgehaald;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.1
  - number: 11.1.j
    text: |-
      inbreuk in verband met persoonsgegevens: een inbreuk op de beveiliging die resulteert in een onbedoelde of
      onwettige vernietiging, verlies of wijziging van, of een niet geautoriseerde toegang tot persoonsgegevens die
      zijn verstuurd, opgeslagen of anderszins verwerkt in verband met de levering van een openbare elektronische
      communicatiedienst in de Europese Unie;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.1
  - number: 11.1.k
    text: |-
      College bescherming persoonsgegevens: het College bescherming persoonsgegevens, bedoeld in de
      [Wet bescherming persoonsgegevens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011468
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.1
    references:
      - id: ref1
        bwb_id: BWBR0011468
  - number: '11.2'
    text: |-
      Onverminderd de [Wet bescherming persoonsgegevens][ref1] en het overigens bij of krachtens deze wet bepaalde dragen
      de aanbieder van een openbaar elektronisch communicatienetwerk en de aanbieder van een openbare elektronische
      communicatiedienst zorg voor de bescherming van persoonsgegevens en de bescherming van de persoonlijke levenssfeer
      van abonnees en gebruikers van zijn netwerk, onderscheidenlijk zijn dienst.


      [ref1]: https://wetten.overheid.nl/BWBR0011468
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.2
    references:
      - id: ref1
        bwb_id: BWBR0011468
  - number: 11.2a.1
    text: |-
      Onverminderd het [Wetboek van Strafrecht][ref1] en het overigens bij of krachtens deze wet bepaalde, dragen
      de aanbieder van een openbaar elektronisch communicatienetwerk en de aanbieder van een openbare elektronische
      communicatiedienst zorg voor het vertrouwelijke karakter van de communicatie en de daarmee verband houdende
      gegevens via hun netwerken onderscheidenlijk hun diensten.


      [ref1]: https://wetten.overheid.nl/BWBR0001854
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.2a
    references:
      - id: ref1
        bwb_id: BWBR0001854
  - number: 11.2a.2
    text: |-
      De aanbieder van een openbaar elektronisch communicatienetwerk en de aanbieder van een openbare elektronische
      communicatiedienst onthouden zich van het aftappen, afluisteren of anderszins onderscheppen of controleren van de
      communicatie via een openbaar elektronisch communicatienetwerk of openbare elektronische communicatiedienst en de
      daarmee verband houdende gegevens tenzij en voor zover:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.2a
  - number: 11.2a.2.a
    text: de betrokken abonnee voor deze handelingen zijn uitdrukkelijke toestemming heeft gegeven;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.2a
  - number: 11.2a.2.b
    text: |-
      deze handelingen noodzakelijk zijn om de integriteit en de veiligheid van de netwerken en diensten van de betrokken
      aanbieder te waarborgen;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.2a
  - number: 11.2a.2.c
    text: |-
      deze handelingen noodzakelijk zijn voor het overbrengen van informatie via de netwerken en diensten van de
      betrokken aanbieder, of
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.2a
  - number: 11.2a.2.d
    text: deze handelingen noodzakelijk zijn ter uitvoering van een wettelijk voorschrift of rechterlijk bevel.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.2a
  - number: 11.2a.3
    text: |-
      Voorafgaand aan het verkrijgen van toestemming als bedoeld in het tweede lid, onderdeel a, verstrekt de aanbieder
      aan de abonnee de volgende informatie:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.2a
  - number: 11.2a.3.a
    text: de soort gegevens die wordt afgetapt, afgeluisterd, onderschept of gecontroleerd;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.2a
  - number: 11.2a.3.b
    text: de doeleinden waarvoor de gegevens worden afgetapt, afgeluisterd, onderschept of gecontroleerd, en
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.2a
  - number: 11.2a.3.c
    text: de duur van het aftappen, afluisteren, onderscheppen of controleren van de gegevens.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.2a
  - number: 11.2a.4
    text: Een abonnee kan de verleende toestemming, bedoeld in het tweede lid, onderdeel a, op elk moment intrekken.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.2a
  - number: 11.3.1
    text: |-
      De in [artikel 11.2][ref1] bedoelde aanbieders treffen in het belang van de bescherming van persoonsgegevens en
      de bescherming van de persoonlijke levenssfeer van abonnees en gebruikers passende technische en organisatorische
      maatregelen ten behoeve van de veiligheid en beveiliging van de door hen aangeboden netwerken en diensten. De
      maatregelen garanderen, rekening houdend met de stand van de techniek en de kosten van de tenuitvoerlegging, een
      passend beveiligingsniveau dat in verhouding staat tot het desbetreffende risico.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel11
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.1'
  - number: 11.3.2
    text: 'De maatregelen als bedoeld in het eerste lid omvatten in elk geval:'
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.3
  - number: 11.3.2.a
    text: |-
      waarborgen dat slechts daartoe gemachtigd personeel voor wettelijk toegestane doeleinden toegang heeft tot de
      persoonsgegevens,
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.3
  - number: 11.3.2.b
    text: |-
      de bescherming van opgeslagen of verzonden persoonsgegevens tegen onbedoelde of niet toegestane opslag, verwerking,
      toegang, verstrekking, wijziging, verlies, vernietiging, en
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.3
  - number: 11.3.2.c
    text: de invoering van een veiligheidsbeleid met betrekking tot de verwerking van persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.3
  - number: 11.3.3
    text: |-
      De in [artikel 11.2][ref1] bedoelde aanbieders dragen er zorg voor dat de abonnees worden geïnformeerd over:


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel11
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.1'
  - number: 11.3.3.a
    text: |-
      bijzondere risico's voor de doorbreking van de veiligheid of de beveiliging van het aangeboden netwerk of de
      aangeboden dienst;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.3
  - number: 11.3.3.b
    text: |-
      de eventuele middelen waarmee de onder a bedoelde risico's kunnen worden tegengegaan, voor zover het andere
      maatregelen betreft dan die welke de aanbieder op grond van het eerste lid gehouden is te treffen, alsmede een
      indicatie van de verwachte kosten.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.3
  - number: 11.3.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen de in [artikel 11.2][ref1] bedoelde aanbieders in het
      belang van de bescherming van persoonsgegevens en de bescherming van de persoonlijke levenssfeer van abonnees en
      gebruikers nadere verplichtingen en beperkingen worden opgelegd ten behoeve van de veiligheid en beveiliging van de
      door hen aangeboden netwerken en diensten.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel11
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.1'
  - number: 11.3a.1
    text: |-
      De aanbieder van een openbare elektronische communicatiedienst stelt het College bescherming persoonsgegevens
      onverwijld in kennis van een inbreuk op de beveiliging, bedoeld in [artikel 11.3][ref1], die nadelige gevolgen
      heeft voor de bescherming van persoonsgegevens die zijn verwerkt in verband met de levering van een openbare
      elektronische communicatiedienst in de Europese Unie.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel11
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.3a
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.1'
  - number: 11.3a.2
    text: |-
      De aanbieder, bedoeld in het eerste lid, stelt degene wiens persoonsgegevens het betreft onverwijld in kennis van
      een inbreuk in verband met persoonsgegevens indien de inbreuk waarschijnlijk ongunstige gevolgen zal hebben voor
      diens persoonlijke levenssfeer.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.3a
  - number: 11.3a.3
    text: |-
      De kennisgeving aan het College bescherming persoonsgegevens en de persoon wiens persoonsgegevens het betreft,
      omvat in ieder geval de aard van de inbreuk in verband met persoonsgegevens, de instanties waar meer informatie
      over de inbreuk kan worden verkregen en de aanbevolen maatregelen om de negatieve gevolgen van de inbreuk te
      beperken. De kennisgeving aan het College bescherming persoonsgegevens omvat tevens de gevolgen van de inbreuk op
      de persoonsgegevens en de maatregelen die de aanbieder voorstelt of heeft getroffen om de inbreuk aan te pakken.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.3a
  - number: 11.3a.4
    text: |-
      Indien de aanbieder van een openbare elektronische communicatiedienst geen kennisgeving als bedoeld in het tweede
      lid doet, kan het College bescherming persoonsgegevens, indien het van oordeel is dat de inbreuk in verband met
      persoonsgegevens waarschijnlijk ongunstige gevolgen zal hebben voor de persoonlijke levenssfeer van de persoon
      wiens persoonsgegevens het betreft, van de aanbieder verlangen dat hij die persoon alsnog in kennis stelt van de
      inbreuk.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.3a
  - number: 11.3a.5
    text: |-
      De kennisgeving, bedoeld in het tweede lid, is niet vereist indien de aanbieder naar het oordeel van het College
      bescherming persoonsgegevens gepaste technische beschermingsmaatregelen heeft genomen waardoor de persoonsgegevens
      die het betreft, versleuteld of anderszins onbegrijpelijk zijn voor een ieder die geen recht heeft op toegang tot
      die gegevens.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.3a
  - number: 11.3a.6
    text: |-
      De aanbieder van een openbare elektronische communicatiedienst houdt een overzicht bij van alle inbreuken in
      verband met persoonsgegevens. Dit overzicht bevat in elk geval de feiten en de in het derde lid bedoelde gegevens.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.3a
  - number: 11.3a.7
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gegeven met betrekking tot de in dit
      artikel bedoelde eisen met betrekking tot het verstrekken van informatie en de kennisgeving.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.3a
  - number: 11.4.1
    text: 'De aanbieder van een openbare elektronische communicatiedienst is verplicht de abonnee op diens verzoek:'
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.4
  - number: 11.4.1.a
    text: |-
      geleverde elektronische communicatiediensten door middel van geheel of gedeeltelijk niet-gespecificeerde nota's in
      rekening te brengen;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.4
  - number: 11.4.1.b
    text: |-
      de mogelijkheid te bieden kosteloos en op eenvoudige wijze de doorschakeling van oproepen van derden naar het bij
      hem in gebruik zijnde netwerkaansluitpunt ongedaan te maken.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.4
  - number: 11.4.2
    text: |-
      Bij algemene maatregel van bestuur kunnen in het belang van de bescherming van persoonsgegevens en de bescherming
      van de persoonlijke levenssfeer van oproepende gebruikers en opgeroepen abonnees regels worden gesteld met
      betrekking tot het specificeren van nota's voor geleverde elektronische communicatiediensten. Deze regels
      kunnen onder meer betrekking hebben op de toekenning van rechten aan abonnees, de behandeling van klachten, de
      verstrekking van informatie en de vergoeding van kosten. Bij de algemene maatregel van bestuur kunnen aan de
      Autoriteit Consument en Markt taken worden opgedragen en bevoegdheden verleend.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.4
  - number: 11.4.3
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van de keuzemogelijkheden voor de wijze
      van betaling van geleverde elektronische communicatiediensten.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.4
  - number: 11.5.1
    text: |-
      De aanbieder van een openbaar elektronisch communicatienetwerk en de aanbieder van een openbare elektronische
      communicatiedienst verwijderen dan wel anonimiseren de door hen verwerkte en opgeslagen verkeersgegevens met
      betrekking tot abonnees of gebruikers, zodra deze verkeersgegevens niet langer nodig zijn ten behoeve van de
      overbrenging van communicatie, onverminderd het tweede, derde en vijfde lid.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.5
  - number: 11.5.2
    text: |-
      De aanbieder mag verkeersgegevens verwerken die noodzakelijk zijn voor facturering, waaronder het opstellen van
      een factuur voor een abonnee of voor degene die zich tegenover de aanbieder rechtens verbonden heeft die factuur te
      voldoen, dan wel ten behoeve van een betaling van verleende toegang. De verkeersgegevens mogen worden verwerkt tot
      het einde van de wettelijke termijn waarbinnen de factuur in rechte kan worden betwist of de betaling in rechte kan
      worden afgedwongen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.5
  - number: 11.5.3
    text: |-
      De aanbieder van elektronische communicatiediensten mag voorts de in het eerste lid bedoelde verkeersgegevens
      verwerken, voor zover en voor zolang dat noodzakelijk is voor:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.5
  - number: 11.5.3.a
    text: marktonderzoek of verkoopactiviteiten met betrekking tot elektronische communicatiediensten, of
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.5
  - number: 11.5.3.b
    text: de levering van diensten met toegevoegde waarde,
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.5
  - number: 11.5.4
    text: |-
      De aanbieder stelt de abonnee of gebruiker in kennis van de soorten verkeersgegevens die worden verwerkt voor de in
      het tweede en derde lid bedoelde doeleinden alsmede omtrent de duur van de verwerking. Voor zover het de verwerking
      van verkeersgegevens ten behoeve van de doeleinden, bedoeld in het derde lid betreft, wordt de desbetreffende
      informatie verstrekt voorafgaand aan het verkrijgen van de in dat lid bedoelde toestemming van de abonnee of
      gebruiker.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.5
  - number: 11.5.5
    text: |-
      De verwerking van verkeersgegevens in overeenstemming met het eerste tot en met vierde lid mag alleen geschieden
      door personen die werkzaam zijn onder het gezag van de aanbieder voor facturering, verkeersbeheer, behandeling
      van verzoeken om inlichtingen van klanten, opsporing van fraude alsmede marktonderzoek of verkoopactiviteiten
      met betrekking tot elektronische communicatiediensten of de levering van diensten met toegevoegde waarde en moet
      beperkt blijven tot hetgeen noodzakelijk is om die activiteiten te kunnen uitvoeren.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.5
  - number: 11.5.6
    text: |-
      De aanbieder mag de verkeersgegevens verstrekken aan personen en instanties die zijn belast met de berechting van
      enig geschil dan wel de beslissing van een geschil als bedoeld in de [artikelen 12.1][ref1], [12.2][ref2] voor
      zover van toepassing, of [12.9][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel12
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.5
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '12'
        hoofdstuk: '12'
        paragraaf: '12.1'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '12'
        hoofdstuk: '12'
        paragraaf: '12.2'
      - id: ref3
        bwb_id: BWBR0009950
        artikel: '12'
        hoofdstuk: '12'
        paragraaf: '12.2'
  - number: 11.5a.1
    text: |-
      De verwerking van locatiegegevens, niet zijnde verkeersgegevens, betreffende abonnees of gebruikers van openbare
      elektronische communicatienetwerken of openbare elektronische communicatiediensten, is slechts geoorloofd, indien:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.5a
  - number: 11.5a.1.a
    text: deze gegevens zijn geanonimiseerd, of
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.5a
  - number: 11.5a.1.b
    text: |-
      de desbetreffende abonnee of gebruiker voor de verwerking van deze gegevens toestemming heeft gegeven ten behoeve
      van de levering van een dienst met toegevoegde waarde.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.5a
  - number: 11.5a.2
    text: |-
      Voorafgaand aan het verkrijgen van toestemming als bedoeld in het eerste lid, onderdeel b, verstrekt de aanbieder
      van de toegevoegde waardedienst aan de abonnee of gebruiker de volgende informatie:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.5a
  - number: 11.5a.2.a
    text: de soort locatiegegevens die zullen worden verwerkt;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.5a
  - number: 11.5a.2.b
    text: de doeleinden waarvoor de locatiegegevens worden verwerkt;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.5a
  - number: 11.5a.2.c
    text: de duur van de verwerking, en
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.5a
  - number: 11.5a.2.d
    text: |-
      of de gegevens aan een derde zullen worden verstrekt ten behoeve van de levering van de dienst met toegevoegde
      waarde.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.5a
  - number: 11.5a.3
    text: |-
      De verwerking van de gegevens ten behoeve van de levering van een dienst met toegevoegde waarde als bedoeld
      in het eerste lid, onderdeel b, is slechts toegestaan voor zover en voor zolang dat noodzakelijk is voor
      de levering van de desbetreffende dienst. In afwijking van de eerste volzin mag de aanbieder van de dienst
      met toegevoegde waarde die gegevens verwerken die noodzakelijk zijn voor het opstellen van een factuur.
      [Artikel 11.5, tweede lid, laatste volzin][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel11
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.5a
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.1'
  - number: 11.5a.4
    text: |-
      Een abonnee of gebruiker kan de verleende toestemming voor de verwerking van de hem betreffende gegevens op elk
      moment intrekken.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.5a
  - number: 11.5a.5
    text: |-
      De aanbieder van een dienst met toegevoegde waarde biedt aan de abonnee of gebruiker wiens gegevens worden verwerkt
      de mogelijkheid om kosteloos en op eenvoudige wijze de verwerking van diens gegevens tijdelijk te beletten voor
      elke overbrenging van communicatie of elke verbinding met het openbare elektronische communicatienetwerk dat
      gebruikt wordt voor de levering van de desbetreffende dienst.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.5a
  - number: 11.5a.6
    text: |-
      De verwerking van de gegevens mag slechts plaatsvinden door personen die werkzaam zijn onder het gezag van de
      aanbieder of de derde, bedoeld in het tweede lid, onder d, en is beperkt tot die gegevens die noodzakelijk zijn om
      de dienst met toegevoegde waarde te kunnen aanbieden.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.5a
  - number: 11.5b.1
    text: |-
      Certificatiedienstverleners die certificaten aan het publiek afgeven, verwerken alleen persoonsgegevens die van
      de betrokkene zelf of met diens uitdrukkelijke toestemming zijn verkregen, en voor zover de verwerking van deze
      persoonsgegevens voor de afgifte en het beheer van het certificaat is vereist.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.5b
  - number: 11.5b.2
    text: |-
      De in het eerste lid bedoelde persoonsgegevens worden niet voor andere doeleinden verzameld of verwerkt, tenzij de
      betrokkene daarvoor zijn uitdrukkelijke toestemming heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.5b
  - number: 11.5b.3
    text: |-
      In afwijking van het tweede lid is de uitdrukkelijke toestemming van de betrokkene niet vereist, indien de
      verwerking van de in het eerste lid bedoelde persoonsgegevens noodzakelijk is ten behoeve van de opsporing van
      fraude, of indien de verwerking overigens bij of krachtens de wet wordt gevorderd.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.5b
  - number: 11.6.1
    text: |-
      Eenieder die een algemeen beschikbare abonneelijst uitgeeft of een algemeen beschikbare abonnee-informatiedienst
      verzorgt, stelt de abonnee voorafgaand aan opneming van hem betreffende persoonsgegevens in de abonneelijst of in
      het voor de abonnee-informatiedienst gebruikte abonneebestand kosteloos op de hoogte van:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.6
  - number: 11.6.1.a
    text: |-
      de doeleinden van de desbetreffende abonneelijst en de desbetreffende abonnee-informatiedienst en, voor zover het
      een elektronische versie van de abonneelijst betreft, van de gebruiksmogelijkheden op basis van daarin opgenomen
      zoekfuncties, en
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.6
  - number: 11.6.1.b
    text: |-
      de soorten persoonsgegevens die, gelet op de vastgestelde doeleinden van de desbetreffende abonneelijst en
      desbetreffende abonnee-informatiedienst, daarin kunnen worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.6
  - number: 11.6.2
    text: |-
      In een algemeen beschikbare abonneelijst en in het voor een abonnee-informatiedienst gebruikte abonneebestand
      worden uitsluitend persoonsgegevens van een abonnee opgenomen, indien de abonnee daarvoor toestemming heeft
      verleend en blijft deze beperkt tot de door hem daarbij aangegeven persoonsgegevens. Aan het niet opgenomen zijn
      in een abonneelijst of het voor een abonnee-informatiedienst gebruikte abonneebestand mogen geen kosten worden
      verbonden.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.6
  - number: 11.6.3
    text: |-
      Voor zover de verwerking van persoonsgegevens in een algemeen beschikbare abonneelijst en in het voor een abonnee-
      informatiedienst gebruikte abonneebestand betrekking heeft op andere doeleinden dan het bieden van de mogelijkheid
      tot het zoeken van nummers aan de hand van gegevens betreffende de naam in combinatie met gegevens betreffende het
      adres en huisnummer, postcode en woonplaats van de abonnee, is met betrekking tot elk van die andere doeleinden
      afzonderlijke toestemming van de abonnee vereist.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.6
  - number: 11.6.4
    text: |-
      De abonnee heeft het recht om kosteloos hem betreffende persoonsgegevens in een algemeen beschikbare abonneelijst
      of in het voor een abonnee-informatiedienst gebruikte abonneebestand te verifiëren, te laten verbeteren of te laten
      verwijderen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.6
  - number: 11.7.1
    text: |-
      Het gebruik van automatische oproep- en communicatiesystemen zonder menselijke tussenkomst, faxen en elektronische
      berichten voor het overbrengen van ongevraagde communicatie voor commerciële, ideële of charitatieve doeleinden aan
      abonnees of gebruikers is uitsluitend toegestaan, mits de verzender kan aantonen dat de desbetreffende abonnee of
      gebruiker daarvoor voorafgaand toestemming heeft verleend, onverminderd hetgeen is bepaald in het tweede en derde
      lid.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.7
  - number: 11.7.2
    text: |-
      Indien de gebruiker, bedoeld in het eerste lid, een rechtspersoon is dan wel een natuurlijke persoon die handelt
      in de uitoefening van zijn beroep of bedrijf, geldt met betrekking tot het door middel van elektronische berichten
      overbrengen van ongevraagde communicatie voor commerciële, ideële of charitatieve doeleinden dat geen voorafgaande
      toestemming is vereist:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.7
  - number: 11.7.2.a
    text: |-
      indien de verzender bij het overbrengen van de communicatie gebruik maakt van elektronische contactgegevens die
      door de gebruiker daarvoor zijn bestemd en bekendgemaakt, en deze zijn gebruikt in overeenstemming met de door de
      gebruiker aan die contactgegevens verbonden doeleinden, of
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.7
  - number: 11.7.2.b
    text: |-
      indien de gebruiker is gevestigd buiten de Europese Economische Ruimte en voldaan is aan de in het desbetreffende
      land geldende voorschriften met betrekking tot het verzenden van ongevraagde communicatie.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.7
  - number: 11.7.3
    text: |-
      Een ieder die elektronische contactgegevens voor elektronische berichten heeft verkregen in het kader van
      de verkoop van zijn product of dienst mag deze gegevens gebruiken voor het overbrengen van communicatie voor
      commerciële, ideële of charitatieve doeleinden met betrekking tot eigen gelijksoortige producten of diensten, mits
      bij de verkrijging van de contactgegevens aan de klant duidelijk en uitdrukkelijk de gelegenheid is geboden om
      kosteloos en op gemakkelijke wijze verzet aan te tekenen tegen het gebruik van die elektronische contactgegevens,
      en, indien de klant hiervan geen gebruik heeft gemaakt, hem bij elke overgebrachte communicatie de mogelijkheid
      wordt geboden om onder dezelfde voorwaarden verzet aan te tekenen tegen het verder gebruik van zijn elektronische
      contactgegevens. [Artikel 41, tweede lid, van de Wet bescherming persoonsgegevens][ref1] is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel41
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.7
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '41'
  - number: 11.7.4
    text: |-
      Op het gebruik van elektronische berichten voor de in het eerste lid genoemde doeleinden zijn de vereisten
      van [artikel 15e, eerste lid, onderdelen a tot en met c, van boek 3 van het Burgerlijk Wetboek][ref1] van
      overeenkomstige toepassing en bedoeld gebruik bevat geen aanmoedigingen informatie op het internet te raadplegen
      die in strijd is met dat artikel. Bij dat gebruik dienen te allen tijde de volgende gegevens te worden vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel15e
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.7
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: 15e
  - number: 11.7.4.a
    text: de werkelijke identiteit van degene namens wie de communicatie wordt overgebracht, en
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.7
  - number: 11.7.4.b
    text: |-
      een geldig postadres of nummer waaraan de ontvanger een verzoek tot beëindiging van dergelijke communicatie kan
      richten.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.7
  - number: 11.7.5
    text: |-
      Het gebruik van andere dan de in het eerste lid bedoelde middelen voor het overbrengen van ongevraagde communicatie
      voor commerciële, ideële of charitatieve doeleinden is toegestaan met inachtneming van het bepaalde in het zesde
      tot en met twaalfde lid, tenzij de abonnee op de in het zesde lid bedoelde wijze dan wel anderszins te kennen heeft
      gegeven dat hij de ongevraagde communicatie niet wenst te ontvangen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.7
  - number: 11.7.6
    text: |-
      Er is een register waarin de contactgegevens van de abonnee worden opgenomen die daarmee te kennen geeft dat hij
      ongevraagde communicatie als bedoeld in het vijfde lid niet wenst te ontvangen. De inschrijving in het register
      is voor onbepaalde tijd totdat de abonnee te kennen geeft dat zijn contactgegevens uit het register verwijderd
      kunnen worden. Het register wordt gehouden door een door Onze Minister aan te wijzen beheerder. De beheerder is
      verantwoordelijke als bedoeld in [artikel 1, onder d, van de Wet bescherming persoonsgegevens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel1
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.7
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '1'
  - number: 11.7.7
    text: |-
      Het register heeft als doel de abonnee te vrijwaren van de ongevraagde communicatie waarvan hij heeft aangegeven
      dat hij die niet wenst te ontvangen. De contactgegevens van de abonnee die zijn opgenomen in dit register worden
      niet voor enig ander doel gebruikt.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.7
  - number: 11.7.8
    text: |-
      De beheerder blokkeert of verwijdert op verzoek van degene die communicatie als bedoeld in het vijfde lid wil
      overbrengen contactgegevens van abonnees die in het register zijn opgenomen uit aan hem aangeboden bestanden met
      contactgegevens van abonnees, of stelt op verzoek de contactgegevens van abonnees uit het register voor dat doel
      beschikbaar aan degene die ongevraagde communicatie als bedoeld in het vijfde lid wil overbrengen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.7
  - number: 11.7.9
    text: |-
      Het is verboden om communicatie als bedoeld in het vijfde lid over te brengen aan een abonnee die door opname
      van zijn contactgegevens in het register te kennen heeft gegeven deze ongevraagde communicatie niet te willen
      ontvangen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.7
  - number: 11.7.10
    text: |-
      Degene die communicatie als bedoeld in het vijfde lid overbrengt, gebruikt voor het overbrengen van ongevraagde
      communicatie uitsluitend bestanden waaruit de contactgegevens die in het register zijn opgenomen, zijn geblokkeerd
      of verwijderd.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.7
  - number: 11.7.11
    text: |-
      Het negende en tiende lid zijn niet van toepassing op het overbrengen van communicatie als bedoeld in het vijfde
      lid voor zover de contactgegevens zijn verkregen in het kader van de verkoop van een product of dienst of in
      het kader van schenking aan een ideële of charitatieve organisatie en deze worden gebruikt voor het overbrengen
      van communicatie als bedoeld in het vijfde lid met betrekking tot eigen gelijksoortige producten of diensten of
      schenkingen aan de ideële of charitatieve organisatie.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.7
  - number: 11.7.12
    text: |-
      Tijdens elke overgebrachte communicatie wordt tijdens het gesprek gewezen op het register en op de mogelijkheid
      voor de abonnee verzet aan te tekenen tegen het verdere gebruik van zijn elektronische contactgegevens en wordt de
      abonnee de mogelijkheid geboden tot onmiddellijke opname in het register, bedoeld in het zesde lid. Aan de abonnee
      worden in dat geval geen kosten in rekening gebracht van voorzieningen waarmee wordt voorkomen dat hem ongevraagde
      communicatie wordt overgebracht. [Artikel 41, tweede lid, van de Wet bescherming persoonsgegevens][ref1] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel41
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.7
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '41'
  - number: 11.7.13
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.7
  - number: 11.7.13.a
    text: |-
      het blokkeren of verwijderen van contactgegevens van abonnees uit bestanden die gebruikt worden om communicatie
      over te brengen als bedoeld in het vijfde lid, het beschikbaar stellen van contactgegevens van abonnees uit het
      register en de periode gedurende welke de bestanden bewaard blijven en gebruikt kunnen worden;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.7
  - number: 11.7.13.b
    text: de taken, inrichting en verantwoording van de beheerder van het register;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.7
  - number: 11.7.13.c
    text: de toegang tot het register alsmede de inrichting en het gebruik van het register;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.7
  - number: 11.7.13.d
    text: de mogelijkheid van verzet als bedoeld in het twaalfde lid;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.7
  - number: 11.7.13.e
    text: de mogelijkheid van onmiddellijke opname in het register als bedoeld in het twaalfde lid.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.7
  - number: 11.7a.1
    text: |-
      Onverminderd de [Wet bescherming persoonsgegevens][ref1] is het via een elektronisch communicatienetwerk opslaan
      van of toegang verkrijgen tot informatie in de randapparatuur van een gebruiker, alleen toegestaan op voorwaarde
      dat de betrokken gebruiker:


      [ref1]: https://wetten.overheid.nl/BWBR0011468
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.7a
    references:
      - id: ref1
        bwb_id: BWBR0011468
  - number: 11.7a.1.a
    text: |-
      is voorzien van duidelijke en volledige informatie overeenkomstig de [Wet bescherming persoonsgegevens][ref1], in
      ieder geval over de doeleinden waarvoor deze informatie wordt gebruikt, en


      [ref1]: https://wetten.overheid.nl/BWBR0011468
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.7a
    references:
      - id: ref1
        bwb_id: BWBR0011468
  - number: 11.7a.1.b
    text: daarvoor toestemming heeft verleend.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.7a
  - number: 11.7a.2
    text: |-
      De in het eerste lid, onder a en b, genoemde vereisten zijn ook van toepassing in het geval op een andere
      wijze dan door middel van een elektronisch communicatienetwerk wordt bewerkstelligd dat via een elektronisch
      communicatienetwerk informatie wordt opgeslagen of toegang wordt verleend tot op het randapparaat opgeslagen
      informatie.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.7a
  - number: 11.7a.3
    text: 'Het bepaalde in het eerste lid is niet van toepassing indien het de opslag of toegang betreft:'
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.7a
  - number: 11.7a.3.a
    text: met als uitsluitend doel de communicatie over een elektronisch communicatienetwerk uit te voeren,
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.7a
  - number: 11.7a.3.b
    text: |-
      die strikt noodzakelijk is om de door de abonnee of gebruiker gevraagde dienst van de informatiemaatschappij te
      leveren of – mits dit geen of geringe gevolgen heeft voor de persoonlijke levenssfeer van de betrokken abonnee
      of gebruiker – om informatie te verkrijgen over de kwaliteit of effectiviteit van een geleverde dienst van de
      informatiemaatschappij.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.7a
  - number: 11.7a.4
    text: |-
      Een handeling als bedoeld in het eerste lid, die tot doel heeft gegevens over het gebruik van verschillende
      diensten van de informatiemaatschappij door de gebruiker of de abonnee te verzamelen, combineren of analyseren
      zodat de betrokken gebruiker of abonnee anders behandeld kan worden, wordt vermoed een verwerking van
      persoonsgegevens te zijn, als bedoeld in [artikel 1, onderdeel b, van de Wet bescherming persoonsgegevens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel1
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.7a
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '1'
  - number: 11.7a.5
    text: |-
      De toegang van de gebruiker tot een dienst van de informatiemaatschappij die wordt geleverd door of namens een
      krachtens publiekrecht ingestelde rechtspersoon wordt niet afhankelijk gemaakt van het verlenen van toestemming als
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.7a
  - number: 11.7a.6
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen in overeenstemming met Onze Minister van Veiligheid en
      Justitie nadere regels worden gegeven met betrekking tot de in het eerste lid, onder a en b, genoemde vereisten en
      de in het derde lid genoemde uitzonderingen. Het College bescherming persoonsgegevens wordt om advies gevraagd over
      een ontwerp van bedoelde algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.7a
  - number: '11.8'
    text: |-
      De toepassing van de [artikelen 11.6][ref1] en [11.7, vijfde tot en met twaalfde lid][ref2], is beperkt tot
      abonnees die natuurlijke personen zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel11
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.8
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.1'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.1'
  - number: 11.8a.1
    text: |-
      Indien de Autoriteit Consument en Markt met bevoegde nationale instanties in andere lidstaten maatregelen overeen
      komt aangaande grensoverschrijdende samenwerking bij de handhaving van hoofdstuk 11 waarbij grensoverschrijdende
      gegevensstromen betrokken zijn, verstrekt de Autoriteit Consument en Markt de Europese Commissie ruime tijd voordat
      die maatregelen worden vastgelegd een samenvatting van de redenen voor optreden, de geplande afspraken en de
      voorgestelde aanpak.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.8a
  - number: 11.8a.2
    text: |-
      Bij het vastleggen van de maatregelen houdt de Autoriteit Consument en Markt zoveel mogelijk rekening met de door
      de Europese Commissie gemaakte opmerkingen en aanbevelingen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.8a
  - number: 11.9.1
    text: |-
      De aanbieder van een openbaar elektronisch communicatienetwerk en de aanbieder van een openbare elektronische
      communicatiedienst die door middel van dat netwerk of als onderdeel van die dienst nummeridentificatie aanbiedt,
      biedt:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.9
  - number: 11.9.1.a
    text: |-
      aan iedere oproepende gebruiker onderscheidenlijk abonnee mogelijkheden aan om kosteloos de verstrekking van het
      nummer van het oproepende netwerkaansluitpunt dan wel een nummer waarmee een individuele gebruiker kan worden
      geïdentificeerd te blokkeren onderscheidenlijk de verstrekking van nummers van oproepende netwerkaansluitpunten
      dan wel nummers waarmee individuele gebruikers kunnen worden geïdentificeerd voor elke afzonderlijke abonneelijn
      te blokkeren;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.9
  - number: 11.9.1.b
    text: 'aan iedere opgeroepen abonnee mogelijkheden aan om:'
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.9
  - number: 11.9.1.1°
    text: |-
      de verstrekking van het nummer van het oproepende netwerkaansluitpunt dan wel een nummer waarmee een individuele
      gebruiker kan worden geïdentificeerd te verhinderen;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.9
  - number: 11.9.1.2°
    text: |-
      oproepen waarbij de verstrekking van het nummer van het oproepende netwerkaansluitpunt dan wel een nummer waarmee
      een individuele gebruiker kan worden geïdentificeerd is geblokkeerd, te weigeren;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.9
  - number: 11.9.1.3°
    text: |-
      indien nummeridentificatie als bedoeld in [artikel 1.1, onderdeel cc, onder 2°][ref1], wordt aangeboden, kosteloos
      de verstrekking van het nummer van het opgeroepen netwerkaansluitpunt dan wel een nummer waarmee een individuele
      gebruiker kan worden geïdentificeerd aan het oproepende netwerkaansluitpunt te blokkeren.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel1
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.9
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '1'
        hoofdstuk: '1'
  - number: 11.9.2
    text: 'Bij ministeriële regeling worden nadere regels gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.9
  - number: 11.9.2.a
    text: mogelijkheden tot blokkering en weigering;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.9
  - number: 11.9.2.b
    text: |-
      de voorwaarden waaronder de abonnee de identificatie van het nummer van oproepende netwerkaansluitpunten dan wel
      een nummer waarmee een individuele gebruiker kan worden geïdentificeerd kan doen verhinderen;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.9
  - number: 11.9.2.c
    text: |-
      de wijze waarop uitvoering aan nummeridentificatie in het internationale elektronische communicatieverkeer kan
      worden gegeven, en
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.9
  - number: 11.9.2.d
    text: de wijze waarop de aanbieders, gebruikers en abonnees voorlichten over het gebruik van nummeridentificatie.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.9
  - number: 11.10.1
    text: |-
      De aanbieder van een openbaar elektronisch communicatienetwerk en de aanbieder van een openbare elektronische
      communicatiedienst die nummeridentificatie aanbiedt, is verplicht aan de door Onze Minister van Binnenlandse
      Zaken en Koninkrijksrelaties, in overeenstemming met Onze Minister, aangewezen beheerders van een alarmnummer voor
      publieke diensten, indien er elektronische communicatie met een alarmnummer wordt afgewikkeld, gelijktijdig:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.10
  - number: 11.10.1.a
    text: |-
      het nummer van het oproepende netwerkaansluitpunt te verstrekken, ook indien bij dat netwerkaansluitpunt gebruik
      wordt gemaakt van een in [artikel 11.9, tweede lid, onder a][ref1], bedoelde blokkeringsmogelijkheid;


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel11
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.10
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.2'
  - number: 11.10.1.b
    text: |-
      de naam, en de beschikbare adres-, postcode- en woonplaatsgegevens van de abonnee, dan wel de locatie van de
      openbare betaaltelefoon, die onder het desbetreffende nummer is aangesloten, te verstrekken.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.10
  - number: 11.10.2
    text: |-
      De aanbieder van een openbaar elektronisch communicatienetwerk en de aanbieder van een openbare elektronische
      communicatiedienst, die locatiegegevens kan verwerken omtrent abonnees of gebruikers, is verplicht aan de
      aangewezen beheerders van een alarmnummer voor publieke diensten, bedoeld in het eerste lid, indien er communicatie
      over een dergelijk alarmnummer wordt afgewikkeld, gelijktijdig de daarop betrekking hebbende locatiegegevens
      te verstrekken, ook indien de abonnee of gebruiker, voor zover het betreft de locatiegegevens als bedoeld in
      [artikel 11.5a][ref1], op de voet van het vijfde lid van dat artikel, gebruik heeft gemaakt van de mogelijkheid om
      tijdelijk de verwerking van de hem betreffende locatiegegevens te beletten.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel11
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.10
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.1'
  - number: 11.10.3
    text: |-
      De verstrekte nummers, alsmede de in het eerste lid, onder b, en de in het tweede lid, bedoelde gegevens worden
      door de beheerders, bedoeld in het eerste lid, vastgelegd met het oog op de hulpverlening in noodsituaties of de
      bestrijding van het misbruik van een alarmnummer voor publieke diensten. De beheerders zijn verantwoordelijke in de
      zin van [artikel 1, onderdeel d, van de Wet bescherming persoonsgegevens][ref1] voor deze vastlegging.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel1
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.10
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '1'
  - number: 11.10.4
    text: |-
      Verstrekking van nummers en gegevens door de beheerder vindt slechts plaats met het oog op de hulpverlening in
      noodsituaties of de bestrijding van het misbruik van een alarmnummer voor publieke diensten. De beheerder is
      verantwoordelijke in de zin van [artikel 1, onderdeel d, van de Wet bescherming persoonsgegevens][ref1] voor deze
      verstrekkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel1
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.10
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '1'
  - number: 11.10.5
    text: |-
      Verstrekking van nummers en gegevens met het oog op de hulpverlening in noodsituaties vindt slechts plaats aan de
      door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, in overeenstemming met Onze Minister, aangewezen
      publieke diensten belast met hulpverleningstaken.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.10
  - number: 11.10.6
    text: |-
      Verstrekking van nummers en gegevens met het oog op de bestrijding van het misbruik van een alarmnummer
      voor publieke diensten vindt slechts plaats aan degene die op grond van [artikel 141][ref1] of
      [142 van het Wetboek van Strafvordering][ref2] is belast met de opsporing van strafbare feiten.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel142
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.10
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '142'
  - number: 11.10.7
    text: 'De termijn gedurende welke de nummers en gegevens door de beheerder worden bewaard bedraagt ten hoogste:'
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.10
  - number: 11.10.7.a
    text: |-
      twee maanden indien de nummers en gegevens betrekking hebben op gevallen waarin kennelijk sprake is van een verzoek
      om hulpverlening in een noodsituatie;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.10
  - number: 11.10.7.b
    text: |-
      zes maanden indien de nummers en gegevens betrekking hebben op gevallen waarin kennelijk sprake is van misbruik van
      een alarmnummer voor publieke diensten;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.10
  - number: 11.10.7.c
    text: 24 uur in alle overige gevallen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.10
  - number: 11.10.8
    text: |-
      De op grond van het eerste lid aangewezen beheerder vergoedt de kosten die zijn gemoeid met het verstrekken van de
      in het eerste lid, onder a en b, en de in het tweede lid bedoelde gegevens.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.10
  - number: 11.10.9
    text: |-
      De bekendmaking van het besluit tot aanwijzing van de beheerders, bedoeld in het eerste lid, en de publieke
      diensten, bedoeld in het vierde lid, geschiedt door plaatsing in de Staatscourant door Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.10
  - number: 11.10.10
    text: |-
      De beheerders, bedoeld in het eerste lid, zijn bevoegd om ten behoeve van de controle op de effectiviteit van de
      hulpverlening in noodsituaties de bij het alarmnummer voor publieke diensten ingekomen oproepen vast te leggen
      en voor ten hoogste twee maanden te bewaren. Bij de vastlegging worden de datum en het tijdstip van de oproep
      geregistreerd.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.10
  - number: 11.10.11
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de nauwkeurigheid en
      betrouwbaarheid van de te verstrekken gegevens, bedoeld in het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.10
  - number: 11.10a
    text: |-
      Een faciliteit om het nummer van het netwerkaansluitpunt van waaruit een verbinding tot stand wordt gebracht, dan
      wel het nummer waarmee een individuele gebruiker van dat netwerkaansluitpunt kan worden geïdentificeerd aan het
      netwerkaansluitpunt waarmee die verbinding tot stand komt te verstrekken, wordt niet gebruikt om de opgeroepen
      gebruiker onjuiste informatie te verstrekken met betrekking tot dat netwerkaansluitpunt of die individuele
      gebruiker.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.10a
  - number: 11.11.1
    text: |-
      Een abonnee die last heeft van hinderlijke of kwaadwillige oproepen, waarbij de verstrekking van het nummer
      van het oproepende netwerkaansluitpunt is geblokkeerd, kan aan de aanbieder van een openbaar elektronisch
      communicatienetwerk of van een openbare elektronische communicatiedienst verzoeken om het nummer van de
      oproepende abonnee en de beschikbare daarop betrekking hebbende naam-, adres-, postcode- en woonplaatsgegevens,
      te verstrekken.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.11
  - number: 11.11.2
    text: 'Een verzoek als bedoeld in het eerste lid voldoet aan de volgende vereisten:'
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.11
  - number: 11.11.2.a
    text: |-
      het verzoek is schriftelijk en bevat de naam-, adres-, postcode- en woonplaatsgegevens van de verzoeker alsmede het
      nummer waarop de oproepen betrekking hebben, en
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.11
  - number: 11.11.2.b
    text: het verzoek bevat een indicatie van de data en tijdstippen waarop de desbetreffende oproepen hebben plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.11
  - number: 11.11.3
    text: |-
      De verzoeker informeert de aanbieder onverwijld omtrent hinderlijke of kwaadwillige oproepen, die plaats hebben
      gevonden na indiening van het verzoek, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.11
  - number: 11.11.4
    text: |-
      De aanbieder stelt naar aanleiding van het verzoek een onderzoek in, teneinde vast te stellen of tot verstrekking
      van de gegevens, bedoeld in het eerste lid, dient te worden overgegaan.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.11
  - number: 11.11.5
    text: |-
      Indien bij het onderzoek blijkt dat het oproepende nummer toebehoort aan een abonnee van een andere aanbieder,
      verleent de desbetreffende aanbieder op een daartoe strekkend verzoek van de met het onderzoek belaste aanbieder
      medewerking aan het onderzoek en verstrekt, indien het onderzoek daartoe aanleiding geeft, de beschikbare op het
      oproepende nummer betrekking hebbende naam-, adres-, postcode- en woonplaatsgegevens aan de aanbieder die met het
      onderzoek belast is.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.11
  - number: 11.11.6
    text: |-
      Van de gegevensverstrekking aan een verzoeker wordt door de aanbieder mededeling gedaan aan de abonnee, wiens
      gegevens het betreft.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.11
  - number: 11.11.7
    text: 'Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.11
  - number: 11.11.7.a
    text: het onderzoek, bedoeld in het vierde lid;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.11
  - number: 11.11.7.b
    text: de gegevensverstrekking, bedoeld in het vierde lid;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.11
  - number: 11.11.7.c
    text: de medewerkingsverplichting, bedoeld in het vijfde lid;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.11
  - number: 11.11.7.d
    text: de kennisgeving van de verstrekking van de gegevens, bedoeld in het zesde lid.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.11
  - number: 11.12.1
    text: |-
      Aan een aanbieder van een openbaar elektronisch communicatienetwerk en een aanbieder van een openbare elektronische
      communicatiedienst kan door de Autoriteit Consument en Markt ontheffing worden verleend van de verplichtingen die
      voortvloeien uit de [artikelen 11.4, eerste lid, onderdeel b][ref1], en [11.9 tot en met 11.11][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel11
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.12
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.1'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.2'
  - number: 11.12.2
    text: 'Een ontheffing als bedoeld in het eerste lid kan uitsluitend worden verleend, indien:'
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.12
  - number: 11.12.2.a
    text: deze betrekking heeft op abonneelijnen verbonden met analoge centrales, en
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.12
  - number: 11.12.2.b
    text: |-
      nakoming van de desbetreffende verplichtingen technisch niet haalbaar is of onevenredig veel financiële lasten voor
      de aanbieder met zich meebrengt.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.12
  - number: 11.12.3
    text: Een ontheffing kan onder beperkingen worden verleend. Aan een ontheffing kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.12
  - number: 11.13.1
    text: |-
      Aanbieders van openbare elektronische communicatienetwerken en openbare elektronische communicatiediensten
      kunnen de [artikelen 11.5][ref1], [11.5a][ref2] en [11.9, eerste lid][ref3], buiten toepassing laten, indien dit
      noodzakelijk is in het belang van:


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel11
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.13
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.1'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.1'
      - id: ref3
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.2'
  - number: 11.13.1.a
    text: de nationale veiligheid;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.13
  - number: 11.13.1.b
    text: de voorkoming, opsporing en vervolging van strafbare feiten.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.13
  - number: 11.13.2
    text: |-
      De verkeers- en locatiegegevens die de aanbieders van openbare elektronische communicatienetwerken of openbare
      elektronische communicatiediensten bewaren op grond van [artikel 13.2a, tweede lid][ref1], worden door de
      aanbieders niet voor andere doelen verwerkt, tenzij het gegevens betreft waarvan de verwerking op grond van
      de [artikelen 11.5][ref2] en [11.5a][ref3] is toegestaan en de verwerking plaatsvindt met inachtneming van die
      artikelen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel11
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.13
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '13'
        hoofdstuk: '13'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.1'
      - id: ref3
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.1'
  - number: 11.13.3
    text: |-
      Aanbieders van openbare elektronische communicatienetwerken en openbare elektronische communicatiediensten
      mogen, in afwijking van [artikel 11.5, eerste lid][ref1], verkeersgegevens verwerken, indien en voor zolang
      dat noodzakelijk is voor een onderzoek als bedoeld in [artikel 11.11, vierde en vijfde lid][ref2]. De
      verkeersgegevens mogen voor een periode van ten hoogste drie maanden na beëindiging van een onderzoek als bedoeld
      in [artikel 11.11, vierde lid][ref3], door de desbetreffende aanbieders worden bewaard. Na afloop van deze periode
      worden de verkeersgegevens verwijderd.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel11
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11.13
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.1'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.2'
      - id: ref3
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.2'
  - number: 11a.1.1
    text: |-
      Aanbieders van openbare elektronische communicatienetwerken en openbare elektronische communicatiediensten nemen
      passende technische en organisatorische maatregelen om de risico’s voor de veiligheid en de integriteit van hun
      netwerken en diensten te beheersen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11a.1
  - number: 11a.1.2
    text: |-
      Onverminderd het eerste lid nemen aanbieders van openbare telefoondiensten en aanbieders van openbare elektronische
      communicatienetwerken waarover openbare telefoondiensten worden aangeboden alle noodzakelijke maatregelen om de
      beschikbaarheid van de openbare telefoondiensten over de openbare elektronische communicatienetwerken zo volledig
      mogelijk te waarborgen in geval van een technische storing of uitval van het elektriciteitsnetwerk.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11a.1
  - number: 11a.1.3
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld ter uitvoering van de technische uitvoeringsmaatregelen als
      bedoeld in artikel 13bis, vierde lid, Kaderrichtlijn.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11a.1
  - number: 11a.1.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gegeven met betrekking tot de
      in dit artikel bedoelde technische en organisatorische maatregelen en kunnen technische en organisatorische
      eisen worden gesteld aan aanbieders van openbare elektronische communicatienetwerken en openbare elektronische
      communicatiediensten.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11a.1
  - number: 11a.1.5
    text: |-
      Onze Minister kan een aanbieder van openbare elektronische communicatienetwerken en openbare elektronische
      communicatiediensten de verplichting opleggen om binnen een bepaalde termijn een technische of organisatorische
      maatregel te treffen met betrekking tot de veiligheid en integriteit van openbare elektronische
      communicatienetwerken en openbare elektronische communicatiediensten.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11a.1
  - number: 11a.1.6
    text: |-
      Onze Minister kan een aanbieder van openbare elektronische communicatienetwerken en openbare elektronische
      communicatiediensten de verplichting opleggen om binnen een bepaalde termijn een veiligheidscontrole te laten
      uitvoeren door een onafhankelijke deskundige. De aanbieder van openbare elektronische communicatienetwerken en
      openbare elektronische communicatiediensten draagt de kosten van deze controle.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11a.1
  - number: 11a.2.1
    text: |-
      Aanbieders van openbare elektronische communicatienetwerken en openbare elektronische communicatiediensten stellen
      Onze Minister onverwijld in kennis van:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11a.2
  - number: 11a.2.1.a
    text: een inbreuk op de veiligheid,
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11a.2
  - number: 11a.2.1.b
    text: een verlies van integriteit,
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11a.2
  - number: 11a.2.2
    text: |-
      Aanbieders van openbare elektronische communicatienetwerken en openbare elektronische communicatiediensten
      verstrekken onze Minister op zijn verzoek alle informatie die nodig is om de veiligheid en integriteit van hun
      netwerken en diensten te beoordelen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11a.2
  - number: 11a.2.3
    text: |-
      Indien openbaarmaking in het algemeen belang is, kan Onze Minister een inbreuk op de veiligheid en een verlies van
      integriteit, bedoeld in het eerste lid, openbaar maken of de aanbieder verplichten tot openbaarmaking.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11a.2
  - number: 11a.2.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gegeven met betrekking tot de in het
      eerste lid bedoelde kennisgeving, het verstrekken van de in het tweede lid bedoelde informatie, en de in het derde
      lid bedoelde openbaarmaking, en kunnen inbreuken of verliezen als bedoeld in het eerste lid, onderdelen a en b,
      worden aangewezen waarvan Onze Minister in ieder geval in kennis gesteld moet worden.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11a.2
  - number: 11a.3.1
    text: |-
      Een aanbieder van een bij of krachtens algemene maatregel van bestuur aangewezen antenne-opstelpunt als bedoeld
      in [artikel 3.24, vierde lid][ref1], draagt zorg voor de opstelling en de uitvoering van een continuïteitsplan dat
      een beschrijving bevat van de technische en organisatorische maatregelen die de aanbieder neemt om de risico’s voor
      de veiligheid in en op het opstelpunt te beheersen voor zover van belang voor de continuïteit van de verspreiding
      van programma's door middel van openbare elektronische communicatienetwerken die worden ondersteund door dat
      opstelpunt.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11a.3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.8'
  - number: 11a.3.2
    text: |-
      Onze Minister kan een aanbieder als bedoeld in het eerste lid de verplichting opleggen om binnen een bepaalde
      termijn een veiligheidscontrole te laten uitvoeren door een onafhankelijke deskundige, waarvan de kosten worden
      gedragen door de aanbieder.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11a.3
  - number: 11a.3.3
    text: |-
      Indien het continuïteitsplan naar het oordeel van Onze Minister onvoldoende bijdraagt aan de in het eerste lid
      bedoelde continuïteit, kan Onze Minister een aanbieder als bedoeld in het eerste lid de verplichting opleggen om
      binnen een bepaalde termijn een technische of organisatorische maatregel te treffen met het oog op de in het eerste
      lid bedoelde continuïteit.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11a.3
  - number: 11a.3.4
    text: |-
      Voor een aangewezen antenne-opstelpunt dragen de in het eerste lid bedoelde aanbieder of aanbieders en de
      aanbieder of aanbieders van openbare elektronische communicatienetwerken die bestaan uit radiozendapparaten die
      geschikt zijn voor het verspreiden van programma's en die door het aangewezen opstelpunt worden ondersteund,
      zorg voor de opstelling en de uitvoering van een gezamenlijk continuïteitsplan dat voorziet in onderlinge
      afstemming van de maatregelen, bedoeld in het eerste lid, onderscheidenlijk de maatregelen bedoeld in
      [artikel 11a.1, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel11a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11a.3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 11a
        hoofdstuk: 11a
  - number: 11a.3.5
    text: |-
      Indien de in het vierde lid bedoelde aanbieders geen overeenstemming kunnen bereiken over het gezamenlijke
      continuïteitsplan, kan Onze Minister voorschriften geven inzake het tot stand brengen van het plan.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11a.3
  - number: 11a.3.6
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld ten aanzien van het bepaalde in
      dit artikel.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel11a.3
  - number: '12.1'
    text: |-
      Aanbieders van een openbare telefoondienst, andere bij algemene maatregel van bestuur aan te wijzen openbare
      elektronische communicatiediensten of bij algemene maatregel van bestuur aan te wijzen programmadiensten sluiten
      zich aan bij een door Onze Minister van Veiligheid en Justitie erkende geschillencommissie welke geschillen
      behandelt over een overeenkomst met betrekking tot de levering van een openbare elektronische communicatiedienst of
      een programmadienst tussen een hiervoor bedoelde aanbieder en een natuurlijk persoon die voor andere dan bedrijfs-
      of beroepsdoeleinden handelt.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel12.1
  - number: 12.2.1
    text: |-
      Indien er tussen houders van een vergunning, tussen aanbieders, tussen aanbieders en ondernemingen,
      onderscheidenlijk tussen ondernemingen een geschil is ontstaan inzake de nakoming van een op een houder van
      een vergunning, een aanbieder of een onderneming die openbare elektronische communicatienetwerken, bijbehorende
      faciliteiten, openbare elektronische communicatiediensten of programmadiensten aanbiedt op grond van een bij of
      krachtens deze wet of bij de roamingverordening rustende verplichting, kan de Autoriteit Consument en Markt op
      aanvraag van een bij dat geschil betrokken partij het geschil beslechten, tenzij de beslechting van dat geschil op
      grond van deze wet aan een andere instantie is opgedragen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel12.2
  - number: 12.2.2
    text: |-
      Onder een geschil als bedoeld in het eerste lid, wordt mede verstaan een geschil inzake de vraag of, indien
      de in dat lid bedoelde houders van een vergunning, aanbieders, aanbieders en ondernemingen, onderscheidenlijk
      ondernemingen een overeenkomst hebben gesloten op basis van een bij of krachtens deze wet op een of meer van
      hen rustende verplichting, de ter zake daarvan tussen hen bestaande verbintenissen, of de wijze waarop die
      verbintenissen worden nagekomen strijdig zijn, onderscheidenlijk strijdig is met het bij of krachtens deze wet
      bepaalde.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel12.2
  - number: 12.2.3
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing indien een geschil is gerezen tussen degenen,
      bedoeld in [artikel 3.24, eerste en vierde lid][ref1], dan wel tussen een aanbieder en een derde als bedoeld in
      [artikel 5.12, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel5
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel12.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.8'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 12.2.4
    text: |-
      Indien een geschil is gerezen over de redelijkheid van een vergoeding voor medegebruik als bedoeld in
      [artikel 3.24, vierde lid, derde volzin][ref1], draagt de Autoriteit Consument en Markt er zorg voor dat de
      vergoeding voldoet aan de in dat lid gestelde vereisten. De Autoriteit Consument en Markt is daarbij gehouden om
      de bij het geschil betrokken partijen te raadplegen over de mate waarin met de vergoeding aan de vereisten wordt
      voldaan. Indien naar het oordeel van de Autoriteit Consument en Markt niet of onvoldoende aan de vereisten wordt
      voldaan, raadpleegt de Autoriteit Consument en Markt de geschilpartijen opnieuw en geeft het, met inachtneming
      van de door de geschilpartijen verschafte informatie, aanwijzingen voor het alsnog voldoen aan de vereisten.
      De Autoriteit Consument en Markt houdt nadien toezicht op de naleving van de gegeven aanwijzingen. Zij kan de
      aanbieder verplichten periodiek een rapportage over te leggen waarmee de blijvende efficiëntie van de tarieven kan
      worden gecontroleerd.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel12.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.8'
  - number: 12.2.5
    text: |-
      Met uitzondering van geschillen op grond van [artikel 5.12][ref1] is het eerste lid niet van toepassing op
      geschillen voortvloeiend uit [hoofdstuk 5][ref2] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel12.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
      - id: ref2
        bwb_id: BWBR0009950
        hoofdstuk: '5'
  - number: 12.2.6
    text: |-
      Indien nummerhouders als bedoeld in [artikel 4.2b][ref1] geen overeenstemming kunnen bereiken over de voorwaarden
      waaronder de aan hen in gebruik gegeven nummers gezamenlijk in gebruik zullen worden genomen, kan de Autoriteit
      Consument en Markt op aanvraag van een of meer van hen, voorschriften geven inzake het tot stand brengen van een
      overeenkomst als bedoeld in artikel 4.2b.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel4
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel12.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '4'
        hoofdstuk: '4'
  - number: 12.2.7
    text: |-
      Op aanvraag van de gezamenlijke nummerhouders kan de Autoriteit Consument en Markt een besluit als bedoeld in het
      vijfde lid intrekken.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel12.2
  - number: '12.3'
    text: |-
      De Autoriteit Consument en Markt is onbevoegd tot het beslechten van een op grond van [artikel 12.2][ref1]
      voorgelegd geschil, indien de bij dat geschil betrokken partijen de Autoriteit Consument en Markt verzoeken het
      geschil niet langer te behandelen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel12
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel12.3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '12'
        hoofdstuk: '12'
        paragraaf: '12.2'
  - number: 12.5.1
    text: |-
      De Autoriteit Consument en Markt beslist op een aanvraag als bedoeld in [artikel 12.2][ref1] binnen vier maanden
      na ontvangst van die aanvraag. [Artikel 4:15 van de Algemene wet bestuursrecht][ref2] is van overeenkomstige
      toepassing indien de Autoriteit Consument en Markt aan een andere partij dan de aanvrager om gegevens verzoekt met
      het oog op de te nemen beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel12.5
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '12'
        hoofdstuk: '12'
        paragraaf: '12.2'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 12.5.2
    text: |-
      Onverminderd het eerste lid, kan de Autoriteit Consument en Markt in spoedeisende gevallen een voorlopig besluit
      nemen dat tussen de betrokken aanbieders geldt tot het definitieve besluit van de Autoriteit Consument en Markt.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel12.5
  - number: 12.5.3
    text: |-
      In uitzonderlijke gevallen kan de Autoriteit Consument en Markt de termijn, bedoeld in het eerste lid, verlengen.
      De Autoriteit Consument en Markt stelt de desbetreffende aanbieders daarvan in kennis en geeft de termijn aan
      waarbinnen de Autoriteit Consument en Markt het geschil zal beslechten, met dien verstande dat die termijn niet
      langer is dan twee maanden na afloop van de termijn, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel12.5
  - number: '12.6'
    text: |-
      Een bij een geschil betrokken partij volgt de door de Autoriteit Consument en Markt op grond van
      [artikel 12.2][ref1] genomen besluit op. De Autoriteit Consument en Markt kan daarbij termijnen stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel12
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel12.6
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '12'
        hoofdstuk: '12'
        paragraaf: '12.2'
  - number: '12.7'
    text: |-
      Van een besluit als bedoeld in [artikel 12.2][ref1] wordt mededeling gedaan in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel12
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel12.7
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '12'
        hoofdstuk: '12'
        paragraaf: '12.2'
  - number: 12.8.1
    text: |-
      De Autoriteit Consument en Markt overlegt met de desbetreffende nationale regelgevende instantie aan wie
      de bevoegdheid tot het beslechten van geschillen is opgedragen, over de beslechting van een geschil dat
      landsgrensoverschrijdende aspecten heeft en dat overeenkomstig deze paragraaf aan de Autoriteit Consument en Markt
      is voorgelegd, dan wel aan de desbetreffende nationale regelgevende instantie is voorgelegd en door die instantie
      aan de Autoriteit Consument en Markt is voorgelegd.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel12.8
  - number: 12.8.2
    text: |-
      In afwijking van [artikel 12.5, eerste lid][ref1], beslist de Autoriteit Consument en Markt op een aanvraag als
      bedoeld in het eerste lid, binnen 24 weken na ontvangst van die aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel12
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel12.8
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '12'
        hoofdstuk: '12'
        paragraaf: '12.2'
  - number: 12.8.3
    text: |-
      Indien de Autoriteit Consument en Markt of de desbetreffende nationale regelgevende instantie, bedoeld in het
      eerste lid, advies van BEREC heeft gevraagd over de beslechting van een geschil als bedoeld in het eerste lid,
      neemt de Autoriteit Consument en Markt het besluit niet dan nadat BEREC het advies heeft gegeven. In afwachting
      van het advies van BEREC schorst de Autoriteit Consument en Markt de termijn van 24 weken, bedoeld in het tweede
      lid, op.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel12.8
  - number: 12.9.1
    text: |-
      Indien tussen een consument en een aanbieder of een onderneming die openbare elektronische communicatienetwerken
      of openbare elektronische communicatiediensten aanbiedt een geschil is gerezen inzake de schending door die
      aanbieder of onderneming van bij of krachtens deze wet gestelde regels ter uitvoering van [richtlijn nr. 2002/22/
      EG](32002L0022), niet zijnde een geschil als bedoeld in [artikel 12.1][ref1], of inzake de schending door die
      aanbieder of onderneming van de roamingverordening kan de Autoriteit Consument en Markt op aanvraag van de
      desbetreffende consument, het geschil beslechten.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel12
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel12.9
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '12'
        hoofdstuk: '12'
        paragraaf: '12.1'
  - number: 12.9.2
    text: |-
      Indien een consument door de Autoriteit Consument en Markt in het gelijk wordt gesteld en hij voor het beslechten
      van een geschil bij of krachtens [artikel 16.1][ref1] een vergoeding aan de Autoriteit Consument en Markt
      verschuldigd is, kan de Autoriteit Consument en Markt bepalen dat die vergoeding door een aanbieder of onderneming
      als bedoeld in het eerste lid wordt vergoed.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel16
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel12.9
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '16'
        hoofdstuk: '16'
  - number: 12.9.3
    text: |-
      Een bij een geschil betrokken aanbieder of onderneming volgt de door de Autoriteit Consument en Markt op grond van
      het eerste lid gegeven voorschriften op. De Autoriteit Consument en Markt kan daarbij termijnen stellen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel12.9
  - number: 12.9.4
    text: |-
      De [artikelen 12.3][ref1], [12.5][ref2], [12.7][ref3] en [12.8][ref4] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0009950#Artikel12
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel12.9
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '12'
        hoofdstuk: '12'
        paragraaf: '12.2'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '12'
        hoofdstuk: '12'
        paragraaf: '12.2'
      - id: ref3
        bwb_id: BWBR0009950
        artikel: '12'
        hoofdstuk: '12'
        paragraaf: '12.2'
      - id: ref4
        bwb_id: BWBR0009950
        artikel: '12'
        hoofdstuk: '12'
        paragraaf: '12.2'
  - number: 12.10.1
    text: |-
      Indien gebruikers als bedoeld in [artikel 3.21][ref1] aan wie frequentieruimte is toegewezen als bedoeld
      in [artikel 3.5][ref2], dan wel aan wie vergunning is verleend voor het gebruik van frequentieruimte, geen
      overeenstemming kunnen bereiken over de voorwaarden waaronder de aan hen toegewezen frequentieruimte gezamenlijk in
      gebruik zal worden genomen, kan Onze Minister op aanvraag van een of meer van hen, voorschriften geven inzake het
      tot stand brengen van een overeenkomst als bedoeld in artikel 3.21.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel12.10
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.7'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 12.10.2
    text: Op aanvraag van de gezamenlijke gebruikers kan Onze Minister een besluit als bedoeld in het eerste lid intrekken.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel12.10
  - number: 12.10.3
    text: |-
      De [artikelen 12.5, eerste lid][ref1], [12.6][ref2] en [12.7][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel12
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel12.10
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '12'
        hoofdstuk: '12'
        paragraaf: '12.2'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '12'
        hoofdstuk: '12'
        paragraaf: '12.2'
      - id: ref3
        bwb_id: BWBR0009950
        artikel: '12'
        hoofdstuk: '12'
        paragraaf: '12.2'
  - number: 12.11.1
    text: |-
      Op vordering van Onze Minister verstrekken de bij een geschil betrokken partijen binnen twee weken dan wel binnen
      een andere door Onze Minister te bepalen redelijke termijn, aan Onze Minister alle gegevens die relevant zijn voor
      de beoordeling van het geschil.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel12.11
  - number: 12.11.2
    text: |-
      De bij het geschil betrokken partijen zijn verplicht onverwijld, maar in elk geval binnen de door Onze Minister
      gestelde redelijke termijn, alle medewerking te verlenen die deze redelijkerwijs kan vorderen ten behoeve van de
      beoordeling van het geschil.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel12.11
  - number: 13.1.1
    text: |-
      Aanbieders van openbare telecommunicatienetwerken en openbare telecommunicatiediensten stellen hun
      telecommunicatienetwerken en telecommunicatiediensten uitsluitend beschikbaar aan gebruikers indien deze aftapbaar
      zijn.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel13.1
  - number: 13.1.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de technische
      aftapbaarheid van openbare telecommunicatienetwerken en openbare telecommunicatiediensten.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel13.1
  - number: 13.2.1
    text: |-
      Aanbieders van openbare telecommunicatienetwerken zijn verplicht medewerking te verlenen aan de uitvoering
      van een bevel op grond van het [Wetboek van Strafvordering][ref1] dan wel een toestemming op grond van de
      [Wet op de inlichtingen- en veiligheidsdiensten 2002][ref2] tot het aftappen of opnemen van telecommunicatie die
      over hun telecommunicatienetwerken wordt afgewikkeld.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
      [ref2]: https://wetten.overheid.nl/BWBR0013409
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel13.2
    references:
      - id: ref1
        bwb_id: BWBR0001903
      - id: ref2
        bwb_id: BWBR0013409
  - number: 13.2.2
    text: |-
      Aanbieders van openbare telecommunicatiediensten zijn verplicht medewerking te verlenen aan de uitvoering
      van een bevel op grond van het [Wetboek van Strafvordering][ref1] dan wel een toestemming op grond van de
      [Wet op de inlichtingen- en veiligheidsdiensten 2002][ref2] tot het aftappen of opnemen van door hen verzorgde
      telecommunicatie.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
      [ref2]: https://wetten.overheid.nl/BWBR0013409
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel13.2
    references:
      - id: ref1
        bwb_id: BWBR0001903
      - id: ref2
        bwb_id: BWBR0013409
  - number: 13.2.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de te nemen
      organisatorische en personele maatregelen en te treffen voorzieningen met betrekking tot aftappen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel13.2
  - number: 13.2a.1
    text: 'In dit artikel wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel13.2a
  - number: 13.2a.1.a
    text: |-
      *gegevens:* de verkeers- en locatiegegevens, bedoeld in
      [artikel 11.1, onderdeel b respectievelijk onderdeel d][ref1], alsmede de daarmee verband houdende gegevens die
      nodig zijn om de abonnee of gebruiker te identificeren;


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel11
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel13.2a
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.1'
  - number: 13.2a.1.b
    text: |-
      *oproeppoging zonder resultaat:* een communicatie waarbij een telefoonoproep wel tot een verbinding heeft geleid,
      maar onbeantwoord is gebleven of via het netwerkbeheer is beantwoord.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel13.2a
  - number: 13.2a.2
    text: |-
      Aanbieders van openbare telecommunicatienetwerken of openbare telecommunicatiediensten bewaren de in de bij deze
      wet behorende bijlage aangewezen gegevens, voorzover deze in het kader van de aangeboden netwerken of diensten
      worden gegenereerd of verwerkt, ten behoeve van het onderzoeken, opsporen en vervolgen van ernstige misdrijven.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel13.2a
  - number: 13.2a.3
    text: 'De gegevens, bedoeld in het tweede lid, worden door de aanbieders bewaard gedurende een periode van:'
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel13.2a
  - number: 13.2a.3.a
    text: |-
      twaalf maanden voor gegevens in verband met telefonie over een vast of mobiel netwerk, bedoeld in de bij deze wet
      behorende bijlage, onder A, of
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel13.2a
  - number: 13.2a.3.b
    text: |-
      zes maanden voor gegevens in verband met internettoegang, e-mail over het internet en internettelefonie, bedoeld in
      de bij deze wet behorende bijlage, onder B, gerekend vanaf de datum van de communicatie.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel13.2a
  - number: 13.2a.4
    text: |-
      De verplichting, bedoeld in het tweede lid, heeft betrekking op gegevens van oproeppogingen zonder resultaat,
      voorzover deze gegevens door de aanbieders bij het aanbieden van openbare telecommunicatienetwerken of openbare
      telecommunicatiediensten worden gegenereerd, verwerkt en opgeslagen of gelogd.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel13.2a
  - number: 13.2b
    text: |-
      Aanbieders van openbare telecommunicatienetwerken en openbare telecommunicatiediensten voldoen aan een
      vordering op grond van de [artikelen 126hh][ref1], [126ii][ref2], [126nc tot en met 126ni][ref3] en
      [126uc tot en met 126ui van het Wetboek van Strafvordering][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel126hh
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel126ii
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel126nc
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel126uc
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel13.2b
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 126hh
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 126ii
      - id: ref3
        bwb_id: BWBR0001903
        artikel: 126nc
      - id: ref4
        bwb_id: BWBR0001903
        artikel: 126uc
  - number: '13.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het beslechten van geschillen
      tussen aanbieders en de bevoegde autoriteiten over de voorzieningen door middel van welke de door een tap te
      verkrijgen telecommunicatie door aanbieders wordt doorgegeven.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel13.3
  - number: 13.4.1
    text: |-
      Aanbieders van openbare telecommunicatienetwerken en openbare telecommunicatiediensten voldoen onverwijld
      aan een vordering op grond van [artikel 126n][ref1] of [artikel 126na][ref2], dan wel [artikel 126u][ref3]
      of [artikel 126ua, van het Wetboek van Strafvordering][ref4] dan wel een verzoek op grond van
      [artikel 28 van de Wet op de inlichtingen- en veiligheidsdiensten 2002][ref5] tot het verstrekken van gegevens
      over een gebruiker van een openbaar telecommunicatienetwerk dan wel een openbare telecommunicatiedienst en het
      telecommunicatieverkeer met betrekking tot die gebruiker.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel126n
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel126na
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel126u
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel126ua
      [ref5]: https://wetten.overheid.nl/BWBR0013409#Artikel28
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel13.4
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 126n
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 126na
      - id: ref3
        bwb_id: BWBR0001903
        artikel: 126u
      - id: ref4
        bwb_id: BWBR0001903
        artikel: 126ua
      - id: ref5
        bwb_id: BWBR0013409
        artikel: '28'
  - number: 13.4.2
    text: |-
      Aanbieders van openbare telecommunicatienetwerken en openbare telecommunicatiediensten voldoen
      aan een vordering op grond van [artikel 126na, eerste lid][ref1], [126ua, eerste lid][ref2],
      of [126zi van het Wetboek van Strafvordering][ref3] dan wel een verzoek op grond van
      [artikel 29 van de Wet op de inlichtingen- en veiligheidsdiensten 2002][ref4] tot het verstrekken van gegevens
      terzake van naam, adres, postcode, woonplaats, nummer en soort dienst van een gebruiker van een openbaar
      telecommunicatienetwerk dan wel een openbare telecommunicatiedienst.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel126na
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel126ua
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel126zi
      [ref4]: https://wetten.overheid.nl/BWBR0013409#Artikel29
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel13.4
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 126na
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 126ua
      - id: ref3
        bwb_id: BWBR0001903
        artikel: 126zi
      - id: ref4
        bwb_id: BWBR0013409
        artikel: '29'
  - number: 13.4.3
    text: |-
      Aanbieders van openbare telecommunicatienetwerken en openbare telecommunicatiediensten voldoen
      aan een vordering op grond van [artikel 126na, tweede lid][ref1], [126ua, tweede lid][ref2],
      of [126zi van het Wetboek van Strafvordering][ref3] dan wel een verzoek op grond van
      [artikel 29 van de Wet op de inlichtingen- en veiligheidsdiensten 2002][ref4] tot het op bij algemene maatregel van
      bestuur te bepalen wijze achterhalen en verstrekken van de gegevens, bedoeld in het eerste lid.Teneinde aan deze
      verplichtingen te kunnen voldoen bewaren de aanbieders de bij algemene maatregel van bestuur aan te wijzen gegevens
      voor een periode van twaalf maanden, vanaf het tijdstip waarop deze gegevens voor de eerste maal zijn verwerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel126na
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel126ua
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel126zi
      [ref4]: https://wetten.overheid.nl/BWBR0013409#Artikel29
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel13.4
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 126na
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 126ua
      - id: ref3
        bwb_id: BWBR0001903
        artikel: 126zi
      - id: ref4
        bwb_id: BWBR0013409
        artikel: '29'
  - number: 13.4.4
    text: |-
      Bij algemene maatregel van bestuur, op voordracht van Onze Minister van Veiligheid en Justitie, Onze Minister, Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties en Onze Minister van Defensie kunnen regels worden gesteld
      met betrekking tot de wijze waarop de aanbieders aan een vordering of een verzoek, bedoeld in het eerste, tweede
      en derde lid, voldoen, de registratie van statistische gegevens en de termijnen waarbinnen die gegevens beschikbaar
      worden gesteld en de wijze waarop de gegevens, bedoeld in het tweede en derde lid, beschikbaar worden gehouden.
      De voordracht voor een krachtens de eerste volzin vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel13.4
  - number: 13.5.1
    text: |-
      Aanbieders van openbare telecommunicatienetwerken en openbare telecommunicatiediensten zijn
      verplicht gegevens met betrekking tot een bijzondere last dan wel toestemming op grond van de
      [Wet op de inlichtingen- en veiligheidsdiensten 2002][ref1] als bedoeld in [artikel 13.2][ref2] dan wel een
      vordering of een verzoek als bedoeld in [artikel 13.2b][ref3] of [artikel 13.4, eerste, tweede of derde lid][ref4],
      te beveiligen tegen kennisneming door onbevoegden alsmede geheimhouding te betrachten met betrekking tot deze
      gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0013409
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0009950#Artikel13
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel13.5
    references:
      - id: ref1
        bwb_id: BWBR0013409
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '13'
        hoofdstuk: '13'
      - id: ref3
        bwb_id: BWBR0009950
        artikel: '13'
        hoofdstuk: '13'
      - id: ref4
        bwb_id: BWBR0009950
        artikel: '13'
        hoofdstuk: '13'
  - number: 13.5.2
    text: |-
      Aanbieders van openbare telecommunicatienetwerken en openbare telecommunicatiediensten nemen met betrekking tot de
      gegevens die ingevolge [artikel 13.2a, tweede lid][ref1], worden bewaard passende technische en organisatorische
      maatregelen teneinde:


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel13
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel13.5
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '13'
        hoofdstuk: '13'
  - number: 13.5.2.a
    text: |-
      de gegevens te beveiligen tegen vernietiging, tegen verlies of wijziging en niet toegelaten opslag, verwerking,
      toegang of openbaarmaking;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel13.5
  - number: 13.5.2.b
    text: |-
      te waarborgen dat toegang tot de gegevens, bedoeld in onderdeel a, slechts geschiedt door speciaal daartoe bevoegde
      personen;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel13.5
  - number: 13.5.2.c
    text: |-
      de gegevens te kunnen vernietigen na afloop van de periode, bedoeld in [artikel 13.2a, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel13
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel13.5
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '13'
        hoofdstuk: '13'
  - number: 13.5.3
    text: |-
      Aanbieders van openbare telecommunicatienetwerken en openbare telecommunicatiediensten dragen er zorg voor dat de
      gegevens, die ingevolge [artikel 13.2a, tweede lid][ref1], worden bewaard:


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel13
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel13.5
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '13'
        hoofdstuk: '13'
  - number: 13.5.3.a
    text: |-
      dezelfde kwaliteit hebben en worden onderworpen aan dezelfde beveiligings- en beschermingsmaatregelen als de
      gegevens in het netwerk;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel13.5
  - number: 13.5.3.b
    text: |-
      onverwijld worden vernietigd na afloop van de periode, bedoeld in [artikel 13.2a, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel13
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel13.5
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '13'
        hoofdstuk: '13'
  - number: 13.5.4
    text: |-
      Op voordracht van Onze Minister van Veiligheid en Justitie, Onze Minister, Onze Minister van Binnenlandse Zaken
      en Koninkrijksrelaties en Onze Minister van Defensie kunnen bij algemene maatregel van bestuur regels worden
      gesteld met betrekking tot de te nemen maatregelen in verband met de beveiliging en de waarborging bedoeld in het
      eerste, tweede en derde lid. De voordracht voor een krachtens de eerste volzin vast te stellen algemene maatregel
      van bestuur wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is
      overgelegd.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel13.5
  - number: 13.6.1
    text: |-
      De investerings-, exploitatie- en onderhoudskosten voor de technische voorzieningen die door aanbieders van
      openbare telecommunicatienetwerken en openbare telecommunicatiediensten zijn of worden gemaakt teneinde te kunnen
      voldoen aan de [artikelen 13.1][ref1], [13.2a][ref2], [13.4][ref3] en [13.5][ref4] komen te hunnen laste.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0009950#Artikel13
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel13.6
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '13'
        hoofdstuk: '13'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '13'
        hoofdstuk: '13'
      - id: ref3
        bwb_id: BWBR0009950
        artikel: '13'
        hoofdstuk: '13'
      - id: ref4
        bwb_id: BWBR0009950
        artikel: '13'
        hoofdstuk: '13'
  - number: 13.6.2
    text: |-
      Aanbieders van openbare telecommunicatienetwerken en openbare telecommunicatiediensten hebben
      aanspraak op vergoeding uit 's Rijks kas van de door hen gemaakte administratiekosten en
      personeelskosten rechtstreeks voortvloeiend uit het voldoen aan een bijzondere last dan wel een
      toestemming op grond van de [Wet op de inlichtingen- en veiligheidsdiensten 2002][ref1] als bedoeld in
      [artikel 13.2, eerste en tweede lid][ref2], of [artikel 13.2a][ref3] dan wel een vordering of een verzoek als
      bedoeld in [artikel 13.2a][ref4], [artikel 13.2b][ref5] of [artikel 13.4, eerste, tweede of derde lid][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0013409
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0009950#Artikel13
      [ref5]: https://wetten.overheid.nl/BWBR0009950#Artikel13
      [ref6]: https://wetten.overheid.nl/BWBR0009950#Artikel13
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel13.6
    references:
      - id: ref1
        bwb_id: BWBR0013409
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '13'
        hoofdstuk: '13'
      - id: ref3
        bwb_id: BWBR0009950
        artikel: '13'
        hoofdstuk: '13'
      - id: ref4
        bwb_id: BWBR0009950
        artikel: '13'
        hoofdstuk: '13'
      - id: ref5
        bwb_id: BWBR0009950
        artikel: '13'
        hoofdstuk: '13'
      - id: ref6
        bwb_id: BWBR0009950
        artikel: '13'
        hoofdstuk: '13'
  - number: 13.6.3
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot de vaststelling en vergoeding van de kosten,
      bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel13.6
  - number: '13.8'
    text: |-
      Van de verplichtingen die voortvloeien uit dit hoofdstuk kan Onze Minister in overeenstemming met Onze Minister
      van Binnenlandse Zaken en Koninkrijksrelaties, Onze Minister van Defensie en Onze Minister van Veiligheid en
      Justitie in bijzondere gevallen ontheffing verlenen. Een ontheffing kan onder beperkingen worden verleend. Aan een
      ontheffing kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel13.8
  - number: '13.9'
    text: |-
      Onze Minister van Veiligheid en Justitie zendt in overeenstemming met Onze Minister binnen drie jaar na de
      inwerkingtreding van deze wet en vervolgens telkens na drie jaar aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van de wijziging van de [artikelen 13.2a][ref1], [13.4][ref2] en [13.5][ref3] in
      de praktijk, voor zover die wijzigingen betrekking hebben op de implementatie van Richtlijn nr 2006/24/EG van het
      Europees Parlement en de Raad van de Europese Unie.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel13
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel13.9
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '13'
        hoofdstuk: '13'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '13'
        hoofdstuk: '13'
      - id: ref3
        bwb_id: BWBR0009950
        artikel: '13'
        hoofdstuk: '13'
  - number: '13.10'
    text: Na de ondertekening van deze wet wordt de Bijlage behorende bij artikel 13.2a van de Telecommunicatiewet opgenomen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel13.10
  - number: 14.1.1
    text: |-
      In bijzondere omstandigheden in verband met de handhaving van de internationale rechtsorde of met de internationale
      betrekkingen is Onze Minister bevoegd in overeenstemming met Onze Minister van Buitenlandse Zaken aan aanbieders
      van openbare telecommunicatienetwerken en openbare telecommunicatiediensten aanwijzingen te geven met betrekking
      tot de verzorging van telecommunicatie van en naar het buitenland.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel14.1
  - number: 14.1.2
    text: |-
      Onze Minister is bevoegd in overeenstemming met Onze Minister van Veiligheid en Justitie aan aanbieders van
      openbare telecommunicatienetwerken en openbare telecommunicatiediensten aanwijzingen te geven betreffende:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel14.1
  - number: 14.1.2.a
    text: |-
      het gebruik van mededelingen van overheidsinstanties om het publiek te waarschuwen voor dreigende rampen of
      noodsituaties en om de gevolgen van rampen of noodsituaties te verzachten;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel14.1
  - number: 14.1.2.b
    text: |-
      het waarborgen van de communicatie tussen en met hulpdiensten en overheidsinstanties tijdens rampen of
      noodsituaties.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel14.1
  - number: 14.2.1
    text: |-
      Onverminderd de [artikelen 7, eerste lid][ref1], en
      [8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref2] kan, ingeval buitengewone omstandigheden dit
      noodzakelijk maken, bij koninklijk besluit, op voordracht van Onze Minister-President, voor het gehele land of een
      deel daarvan [artikel 14.4, eerste tot en met derde lid][ref3], in werking worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007981#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel14
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel14.2
    references:
      - id: ref1
        bwb_id: BWBR0007981
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007981
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0009950
        artikel: '14'
        hoofdstuk: '14'
  - number: 14.2.2
    text: |-
      Wanneer het in het eerste lid bedoelde besluit is genomen wordt onverwijld een voorstel van wet aan de Tweede
      Kamer der Staten-Generaal gezonden omtrent het voortduren van de werking van de bij dat besluit in werking gestelde
      bepalingen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel14.2
  - number: 14.2.3
    text: |-
      Wordt het voorstel van wet door de Staten-Generaal verworpen, dan worden bij koninklijk besluit, op voordracht
      van Onze Minister-President, de bepalingen die ingevolge het eerste lid in werking zijn gesteld, onverwijld buiten
      werking gesteld.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel14.2
  - number: 14.2.4
    text: |-
      Bij koninklijk besluit, op voordracht van Onze Minister-President, worden de bepalingen die ingevolge het eerste
      lid in werking zijn gesteld, buiten werking gesteld, zodra de omstandigheden dit naar Ons oordeel toelaten.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel14.2
  - number: 14.2.5
    text: |-
      Het besluit, bedoeld in het eerste, derde en vierde lid, wordt op de daarin te bepalen wijze bekendgemaakt. Het
      treedt in werking terstond na de bekendmaking.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel14.2
  - number: 14.2.6
    text: Het besluit, bedoeld in het eerste, derde en vierde lid, wordt in ieder geval geplaatst in het Staatsblad.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel14.2
  - number: '14.3'
    text: |-
      Ingeval voor Nederland of een gedeelte daarvan, op grond van de [artikelen 7, eerste lid][ref1], en
      [8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref2], bepalingen uit de Oorlogswet voor Nederland
      in werking zijn gesteld, oefent Onze Minister de in [artikel 14.4, eerste lid][ref3], bedoelde bevoegdheden uit in
      overeenstemming met Onze Minister van Defensie.


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007981#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel14
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel14.3
    references:
      - id: ref1
        bwb_id: BWBR0007981
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007981
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0009950
        artikel: '14'
        hoofdstuk: '14'
  - number: 14.4.1
    text: |-
      Onze Minister is bevoegd aan aanbieders van openbare telecommunicatienetwerken, openbare telecommunicatiediensten
      en aan gebruikers van de frequentieruimte aanwijzingen te geven met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel14.4
  - number: 14.4.1.a
    text: de instandhouding en exploitatie van hun openbare telecommunicatienetwerken;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel14.4
  - number: 14.4.1.b
    text: het verzorgen en het gebruiken van hun openbare telecommunicatiediensten;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel14.4
  - number: 14.4.1.c
    text: de instandhouding en exploitatie dan wel beperking of beëindiging van het gebruik van hun radiozendapparaten.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel14.4
  - number: 14.4.2
    text: |-
      Onze Minister kan bij toepassing van het eerste lid afwijken van de verplichtingen die ingevolge deze wet op
      aanbieders van openbare telecommunicatienetwerken, openbare telecommunicatiediensten en op gebruikers van de
      frequentieruimte rusten.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel14.4
  - number: 14.4.3
    text: |-
      De aanwijzingen die ingevolge het eerste lid aan aanbieders van openbare telecommunicatienetwerken, openbare
      telecommunicatiediensten en aan gebruikers van de frequentieruimte zijn gegeven, zijn voor deze verbindend.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel14.4
  - number: 14.4.4
    text: |-
      Indien aanbieders van openbare telecommunicatienetwerken, openbare telecommunicatiediensten en gebruikers van de
      frequentieruimte als gevolg van aanwijzingen gegeven op grond van het eerste lid onevenredig financieel nadeel
      ondervinden, kent Onze Minister hen een naar billijkheid te bepalen vergoeding toe.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel14.4
  - number: 14.5.1
    text: |-
      Bij toepassing van artikel 14 van de Wet buitengewone bevoegdheden burgerlijk gezag zijn aanbieders van openbare
      telecommunicatienetwerken, openbare telecommunicatiediensten en gebruikers van de frequentieruimte verplicht de
      op grond van het eerste lid van genoemd artikel aangewezen autoriteiten alle medewerking te verlenen, daaronder
      begrepen het uitvoeren van door die autoriteiten gegeven opdrachten.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel14.5
  - number: 14.5.2
    text: |-
      Bij toepassing van artikel 31 van de Oorlogswet voor Nederland zijn aanbieders van openbare
      telecommunicatienetwerken, openbare telecommunicatiediensten en gebruikers van de frequentieruimte verplicht
      het militair gezag alle medewerking te verlenen, daaronder begrepen het uitvoeren van door dat gezag gegeven
      opdrachten.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel14.5
  - number: 14.6.1
    text: |-
      Onze Minister kan na overleg met Onze Ministers van Binnenlandse Zaken en Koninkrijksrelaties en van Defensie
      regels stellen ten aanzien van de te nemen organisatorische en personele maatregelen en de te treffen bijzondere
      voorzieningen met betrekking tot de voorbereiding van het verzorgen van elektronisch transport van gegevens in
      buitengewone omstandigheden als bedoeld in [artikel 14.2][ref1], alsmede omtrent de aan Onze Minister daaromtrent
      te verstrekken informatie.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel14
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel14.6
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '14'
        hoofdstuk: '14'
  - number: 14.6.2
    text: |-
      De regels, bedoeld in het eerste lid, zijn uitsluitend van toepassing op door Onze Minister na overleg met Onze
      Ministers van Binnenlandse Zaken en Koninkrijksrelaties en van Defensie aan te wijzen aanbieders van openbare
      telecommunicatienetwerken, openbare telecommunicatiediensten en gebruikers van de frequentieruimte.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel14.6
  - number: 14.6.3
    text: |-
      Bij de regeling, bedoeld in het eerste lid, wordt bepaald welke kosten van de uitvoering redelijkerwijze ten laste
      van de aangewezen aanbieders van openbare telecommunicatienetwerken, openbare telecommunicatiediensten en van
      gebruikers van de frequentieruimte dienen te komen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel14.6
  - number: 14.6.4
    text: 'De in het eerste lid bedoelde bijzondere voorzieningen hebben betrekking op:'
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel14.6
  - number: 14.6.4.a
    text: |-
      de beschikbaarheid van openbare telecommunicatienetwerken dan wel delen daarvan, openbare telecommunicatiediensten
      en radiozendapparaten;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel14.6
  - number: 14.6.4.b
    text: de beveiliging van bepaalde onderdelen van een openbaar telecommunicatienetwerk of van radiozendapparaten;
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel14.6
  - number: 14.6.4.c
    text: de afwikkeling van het elektronisch transport van gegevens over een openbaar telecommunicatienetwerk, en
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel14.6
  - number: 14.6.4.d
    text: aanvullende infrastructurele voorzieningen voor het elektronisch transport van gegevens en de beveiliging daarvan.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel14.6
  - number: 15.1.1
    text: |-
