  - number: 6a.22
    text: |-
      Bij algemene maatregel van bestuur kunnen andere verplichtingen dan de verplichtingen, bedoeld in de
      [artikelen 6a.12 tot en met 6a.14][ref1], worden aangewezen die de Autoriteit Consument en Markt op grond van
      [artikel 6a.21, derde lid][ref2], kan opleggen aan ondernemingen die een aanmerkelijke marktmacht hebben bij het
      aanbieden van programmadiensten.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6a.22
    references:
