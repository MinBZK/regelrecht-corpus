        hoofdstuk: '15'
        paragraaf: '15.1'
  - number: 15.2.3
    text: |-
      Het College bescherming persoonsgegevens is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving
      van de verplichtingen, gesteld bij of krachtens de in [artikel 15.1, tweede lid][ref1], bedoelde bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel15
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel15.2
    references:
