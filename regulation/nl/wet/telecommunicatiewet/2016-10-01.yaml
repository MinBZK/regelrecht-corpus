        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 20.2a.5
    text: |-
      Op aanvragen om vergunningen, die zijn ingediend vóór het tijdstip van inwerkingtreding van artikel I, onderdeel
      A, van de wet van 10 mei 2012 houdende wijziging van de Telecommunicatiewet in verband met de Nota frequentiebeleid
      2005 (Stb. 2013, 48), wordt beslist met toepassing van deze wet en de daarop berustende bepalingen zoals die
      luidden vóór het tijdstip van inwerkingtreding van genoemd artikel.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel20.2a
  - number: 20.2a.6
    text: |-
      In afwijking van het bepaalde in het vijfde lid, wordt op aanvragen om vergunningen die zijn ingediend in het kader
      van een procedure die is gestart met een keuze als bedoeld in [artikel 3.3, vijfde lid][ref1], van deze wet zoals
      dat artikel luidde vóór het tijdstip van inwerkingtreding van artikel I, onderdeel A, van de wet van 10 mei 2012
      houdende wijziging van de Telecommunicatiewet in verband met de Nota frequentiebeleid 2005 (Stb. 2013, 48), die is
      bekend gemaakt vóór het tijdstip van inwerkingtreding van genoemd artikel, beslist met toepassing van deze wet en
      de daarop berustende bepalingen zoals die luidden vóór dat tijdstip, ongeacht of die aanvragen zijn ingediend vóór
      of na dat tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel20.2a
    references:
