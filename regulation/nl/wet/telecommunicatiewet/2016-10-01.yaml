        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 20.2a.7
    text: |-
      Op een bezwaar of een beroep dat is gemaakt, onderscheidenlijk is ingesteld, tegen een besluit dat is genomen op
      grond van deze wet en de daarop berustende bepalingen zoals die luidden vóór het tijdstip van inwerkingtreding
      van artikel I, onderdeel A, van de wet van 10 mei 2012 houdende wijziging van de Telecommunicatiewet in verband
      met de Nota frequentiebeleid 2005 (Stb. 2013, 48), blijven, ongeacht of dat bezwaar of dat beroep is gemaakt,
      onderscheidenlijk is ingesteld, vóór of na het tijdstip van inwerkingtreding van genoemd artikel, deze wet en de
      daarop berustende bepalingen van toepassing zoals die luidden vóór dat tijdstip.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel20.2a
  - number: 20.2a.8
