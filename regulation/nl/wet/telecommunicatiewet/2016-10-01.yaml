        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
      - id: ref3
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
      - id: ref4
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 20.11.3
    text: |-
      [Artikel 5.8][ref1] van de Telecommunicatiewet, zoals dat luidde voor het tijdstip van inwerkingtreding van de wet,
      houdende wijziging van de Telecommunicatiewet in verband met een herziening van het nationale beleid ten aanzien
      van de aanleg van kabels ten dienste van openbare elektronische communicatienetwerken, is van toepassing op de
      instandhouding van de in het eerste lid bedoelde kabels en ondersteuningswerken.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel5
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel20.11
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 20.15.1
    text: |-
      Ten aanzien van de mogelijkheid om bezwaar te maken of beroep in te stellen tegen een besluit krachtens de Wet op
      de telecommunicatievoorzieningen dat is bekendgemaakt voor het tijdstip van inwerkingtreding van deze wet, blijft
      het recht zoals het gold voor dat tijdstip van toepassing.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel20.15
  - number: 20.15.2
    text: |-
      Ten aanzien van de behandeling van bezwaar of beroep dat voor het tijdstip van inwerkingtreding van deze wet is
      gemaakt onderscheidenlijk is ingesteld, blijft het recht zoals het gold voor dat tijdstip van toepassing.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel20.15
  - number: 20.15.3
    text: |-
      Ten aanzien van de behandeling van bezwaar of beroep dat op of na het tijdstip van inwerkingtreding van deze wet
      is gemaakt onderscheidenlijk is ingesteld en dat is gericht tegen een besluit waartegen voor dat tijdstip eveneens
      bezwaar is gemaakt onderscheidenlijk beroep is ingesteld, blijft het recht zoals het gold voor dat tijdstip van
      toepassing.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel20.15
  - number: 20.16.1
    text: |-
      Indien een certificatiedienstverlener voorafgaand aan het tijdstip van inwerkingtreding van de ministeriële
      regeling, bedoeld in [artikel 2.3, derde lid, ][ref1]reeds geregistreerd is, vindt verstrekking van de krachtens
      artikel 2.3, vierde lid, aan de Autoriteit Consument en Markt te overleggen gegevens plaats binnen een door de
      Autoriteit Consument en Markt zo spoedig mogelijk na inwerkingtreding van de regeling te bepalen redelijke termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel2
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel20.16
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '2'
        hoofdstuk: '2'
  - number: 20.16.2
    text: |-
      Indien de certificatiedienstverlener aantoont redelijkerwijs niet binnen de gestelde termijn, bedoeld in het eerste
      lid, alsnog de gegevens, bedoeld in dat lid, aan de Autoriteit Consument en Markt te kunnen verstrekken, kan de
      Autoriteit Consument en Markt de termijn verlengen.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel20.16
  - number: 20.16.3
    text: |-
      Indien een certificatiedienstverlener waarop het eerste lid van toepassing is, de krachtens
      [artikel 2.3, vierde lid][ref1], te overleggen gegevens, niet of niet volledig binnen de gestelde termijn, bedoeld
      in het eerste of tweede lid, heeft verstrekt, wordt de registratie beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel2
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel20.16
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '2'
        hoofdstuk: '2'
  - number: 20.16.4
    text: |-
      Indien een aanvraag van een certificatiedienstverlener tot registratie voorafgaand aan het tijdstip van
      inwerkingtreding van de ministeriële regeling, bedoeld in [artikel 2.3, derde lid][ref1], is ingediend, en die
      aanvraag op of na het tijdstip van inwerkingtreding van die regeling tot een registratie leidt, vindt verstrekking
      van de krachtens artikel 2.3, vierde lid, aan de Autoriteit Consument en Markt te overleggen gegevens plaats binnen
      een door de Autoriteit Consument en Markt te bepalen redelijke termijn, die zo spoedig mogelijk na die registratie
      aanvangt. Het tweede en derde lid zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel2
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel20.16
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '2'
        hoofdstuk: '2'
  - number: 20.16.5
    text: |-
      Indien een aanvraag van een certificatiedienstverlener tot registratie na de inwerkingtreding van
      [artikel 2.1, vijfde lid, onder b][ref1], is ingediend, maar voorafgaand aan het tijdstip van de inwerkingtreding
      van de ministeriële regeling, bedoeld in [artikel 2.3, derde lid][ref2], is, onverlet het vierde lid, artikel 2.1,
      vijfde lid, onder b, op die aanvraag niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel2
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel20.16
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '2'
        hoofdstuk: '2'
  - number: 20.16.6
    text: |-
      De ministeriële regeling, bedoeld in [artikel 2.3, derde lid][ref1], heeft jegens de Autoriteit Consument en Markt
      geen werking ten aanzien van de verplichting voor de Autoriteit Consument en Markt in het register gegevens op te
      nemen, die krachtens artikel 2.3, vierde lid, door een certificaatdienstverlener verstrekt dienen te worden binnen
      een termijn als bedoeld in het eerste, tweede of vijfde lid, totdat die termijn verstreken is.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel2
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel20.16
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '2'
        hoofdstuk: '2'
  - number: 20.15a.1
    text: |-
      Op nummers die op het tijdstip van inwerkingtreding van de Wijziging van de Telecommunicatiewet in verband met het
      vaststellen van nadere bepalingen over het gebruik van nummers ter bescherming van de consument zijn gereserveerd
      blijven de [artikelen 4.4][ref1], [4.5][ref2], [4.6][ref3], [4.7][ref4] en [4.8, eerste lid][ref5], van de
      Telecommunicatiewet, zoals deze luidden voor de inwerkingtreding van genoemde wet van toepassing tot het tijdstip
      dat de reservering is beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0009950#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0009950#Artikel4
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel20.15a
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '4'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '4'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0009950
        artikel: '4'
        hoofdstuk: '4'
      - id: ref4
        bwb_id: BWBR0009950
        artikel: '4'
        hoofdstuk: '4'
      - id: ref5
        bwb_id: BWBR0009950
        artikel: '4'
        hoofdstuk: '4'
  - number: 20.15a.2
    text: |-
      Nummerhouders registreren binnen zes maanden na de inwerkingtreding van
      [artikel 4.9, derde lid, onderdeel b][ref1], de nummergebruikers. De nummergebruiker krijgt het nummer op de dag
      van registratie door de nummerhouder van rechtswege in gebruik door de nummerhouder.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel4
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel20.15a
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '4'
        hoofdstuk: '4'
  - number: 20.15a.3
    text: |-
      Op klachten die voor het tijdstip van inwerkingtreding van de Wijziging van de Telecommunicatiewet in verband met
      het vaststellen van nadere bepalingen over het gebruik van nummers ter bescherming van de consument zijn ingediend
      bij een erkende instelling, bedoeld in [artikel 4.11][ref1] van de Telecommunicatiewet, blijven de regels van
      toepassing die golden ten tijde van de indiening van de klacht.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel4
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel20.15a
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '4'
        hoofdstuk: '4'
  - number: '20.18'
    text: |-
      Bij algemene maatregel van bestuur kunnen tot twee jaar na inwerkingtreding van deze wet, in gevallen waarin deze
      wet niet voorziet, regels worden gesteld met betrekking tot de invoering van artikelen van deze wet of onderdelen
      daarvan.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel20.18
  - number: '20.19'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel20.19
  - number: '20.20'
    text: 'Deze wet wordt aangehaald als: Telecommunicatiewet.'
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel20.20
