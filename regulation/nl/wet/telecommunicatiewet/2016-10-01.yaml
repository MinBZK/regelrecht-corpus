        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.7
  - number: 6b.1.1
    text: |-
      Op de voorbereiding van een besluit van de Autoriteit Consument en Markt als bedoeld in de
      [artikelen 6.2][ref1], [6a.2][ref2], [6a.3][ref3], [6a.4a][ref4] en [6b.2, vijfde lid, onderdeel a][ref5], is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref6] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref4]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref5]: https://wetten.overheid.nl/BWBR0009950#Artikel6b
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0009950/2016-10-01#Artikel6b.1
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
      - id: ref3
        bwb_id: BWBR0009950
