        artikel: '20'
        hoofdstuk: '20'
  - number: 15.1.2
    text: |-
      Met het toezicht op de naleving van [artikel 8.1][ref1] is belast het Commissariaat voor de Media, genoemd in
      [artikel 9 van de Mediawet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel9
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel15.1
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '8.1'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: '9'
  - number: 15.1.3
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens andere bepalingen van deze wet dan bedoeld in
      het eerste en tweede lid, alsmede het bepaalde bij [verordening (EG) nr. 2887/2000](onbekend) van het Europees
      Parlement en de Raad van de Europese Unie van 18 december 2000 inzake ontbundelde toegang tot het aansluitnetwerk
      (PbEG L 336/4) zijn belast de bij besluit van het college aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel15.1
  - number: 15.1.4
    text: Van een besluit als bedoeld in het eerste of derde lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel15.1
  - number: 15.2.1
    text: |-
      Onze Minister is bevoegd tot toepassing van bestuursdwang ter handhaving van de verplichtingen, gesteld bij of
      krachtens de in [artikel 15.1, eerste lid][ref1], bedoelde bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel15
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel15.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '15.1'
  - number: 15.2.2
    text: |-
      Het college is bevoegd tot toepassing van bestuursdwang ter handhaving van de verplichtingen, gesteld bij of
      krachtens de in [artikel 15.1, derde lid][ref1], bedoelde bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel15
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel15.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '15.1'
  - number: '15.3'
    text: |-
      Indien niet wordt voldaan aan de bij of krachtens deze wet gestelde regels ten aanzien van de aanleg of het gebruik
      van radiozendapparaten, is Onze Minister bevoegd om aan de houder van een desbetreffend radiozendapparaat een
      geheel of gedeeltelijk zendverbod op te leggen.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel15.3
  - number: 15.4.1
    text: |-
      Ingeval van overtreding van de bij of krachtens de in [artikel 15.1, eerste lid][ref1], bedoelde voorschriften,
      alsmede van [artikel 5:20 van de Algemene wet bestuursrecht][ref2] kan Onze Minister aan de overtreder een boete
      opleggen van ten hoogste € 450 000.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel15.4
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '15.1'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 15.4.2
    text: |-
      Ingeval van overtreding van de bij of krachtens de in [artikel 15.1, derde lid][ref1], bedoelde voorschriften,
      alsmede van [artikel 5:20 van de Algemene wet bestuursrecht][ref2] kan het college aan de overtreder een boete
      opleggen van ten hoogste € 450 000.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel15.4
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '15.1'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 15.4.3
    text: |-
      De hoogte van de boete wordt in ieder geval afgestemd op de ernst en de duur van de overtreding, alsmede op de mate
      waarin de overtreder daarvan een verwijt kan worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel15.4
  - number: 15.4.4
    text: |-
      De bevoegdheid tot het opleggen van een boete vervalt indien terzake van de overtreding op grond waarvan
      de boete kan worden opgelegd, tegen de overtreder een strafvervolging is ingesteld en het onderzoek
      ter terechtzitting een aanvang heeft genomen, dan wel het recht tot strafvervolging is vervallen
      ingevolge[ artikel 37 van de Wet op de economische delicten][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel37
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel15.4
    references:
      - id: ref1
        bwb_id: BWBR0002063
        artikel: '37'
  - number: 15.4.5
    text: |-
      Het recht tot strafvervolging vervalt indien Onze Minister, onderscheidenlijk het college, aan de betrokkene
      terzake van hetzelfde feit reeds een boete heeft opgelegd.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel15.4
  - number: 15.5.1
    text: |-
      Met het onderzoek zijn belast de ambtenaren, bedoeld in
      [artikel 15.1, eerste lid, onderscheidenlijk derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel15
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel15.5
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '15.1'
  - number: 15.5.2
    text: |-
      Ten dienste van het onderzoek beschikken zij over de bevoegdheden die hun in deze paragraaf
      worden toegekend, alsmede, met inachtneming van de daaraan in deze paragraaf gestelde beperkingen,
      over de bevoegdheden die hun zijn toegekend ter uitoefening van het toezicht, bedoeld in
      [artikel 15.1, eerste lid, onderscheidenlijk derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel15
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel15.5
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '15.1'
  - number: '15.6'
    text: |-
      Indien de ambtenaren, bedoeld in [artikel 15.1, eerste lid, onderscheidenlijk derde lid][ref1], in het kader van
      het onderzoek bedoeld in [artikel 15.5][ref2], een redelijk vermoeden hebben dat een bepaalde natuurlijke persoon
      of rechtspersoon een overtreding heeft begaan, is er geen verplichting aan de zijde van die natuurlijke persoon
      of rechtspersoon terzake een verklaring af te leggen. De betrokkenen worden hiervan in kennis gesteld voordat hun
      mondeling terzake om informatie wordt gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel15
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel15.6
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '15.1'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '15.2'
  - number: 15.7.1
    text: |-
      De ambtenaren, bedoeld in [artikel 15.1, eerste lid, onderscheidenlijk derde lid][ref1], zijn
      bevoegd om bedrijfsruimten en voorwerpen te verzegelen, voorzover dat voor de uitoefening van de in
      [artikel 5:17 van de Algemene wet bestuursrecht][ref2] bedoelde bevoegdheden redelijkerwijs noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel15.7
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '15.1'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 15.7.2
    text: |-
      De ambtenaren, bedoeld in [artikel 15.1, eerste lid, onderscheidenlijk derde lid][ref1], oefenen de hun in
      [artikel 5:17 van de Algemene wet bestuursrecht][ref2] toegekende bevoegdheid zo nodig uit met behulp van de sterke
      arm.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel15.7
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '15.1'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 15.8.1
    text: |-
      Indien een ambtenaar als bedoeld in [artikel 15.1, eerste lid, onderscheidenlijk derde lid][ref1], vaststelt dat
      een overtreding is begaan, maakt hij daarvan een rapport op.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel15
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel15.8
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '15.1'
  - number: 15.8.2
    text: 'In het rapport worden in ieder geval vermeld:'
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel15.8
  - number: 15.8.2.a
    text: de feiten en omstandigheden op grond waarvan is vastgesteld dat een overtreding is begaan;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel15.8
  - number: 15.8.2.b
    text: waar en wanneer de feiten, bedoeld onder a, zich hebben voorgedaan;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel15.8
  - number: 15.8.2.c
    text: het overtreden wettelijk voorschrift.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel15.8
  - number: 15.8.3
    text: Een kopie van het rapport wordt gezonden aan degene die de overtreding heeft begaan.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel15.8
  - number: 15.8.4
    text: |-
      Op verzoek van de belanghebbende die het rapport wegens zijn gebrekkige kennis van de Nederlandse taal onvoldoende
      begrijpt, draagt Onze Minister, onderscheidenlijk het college, er zoveel mogelijk zorg voor dat de inhoud van het
      rapport aan de betrokkene wordt meegedeeld in een voor hem begrijpelijke taal.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel15.8
  - number: 15.9.1
    text: |-
      In afwijking van [afdeling 4.1.2 van de Algemene wet bestuursrecht][ref1] wordt de belanghebbende schriftelijk
      opgeroepen om naar keuze schriftelijk of mondeling zijn zienswijze naar voren te brengen omtrent het in
      [artikel 15.8, eerste lid][ref2], bedoelde rapport.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.2
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel15
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel15.9
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.1.2
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '15.2'
  - number: 15.9.2
    text: |-
      Indien de belanghebbende zijn zienswijze mondeling naar voren brengt, draagt Onze Minister, onderscheidenlijk het
      college, er op verzoek van de belanghebbende die de Nederlandse taal onvoldoende begrijpt, zorg voor dat een tolk
      wordt benoemd die de belanghebbende bij het horen kan bijstaan, tenzij redelijkerwijs kan worden aangenomen dat
      daaraan geen behoefte bestaat.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel15.9
  - number: 15.10.1
    text: Een boete wordt opgelegd bij beschikking van Onze Minister, onderscheidenlijk het college.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel15.10
  - number: 15.10.2
    text: 'In de beschikking worden in ieder geval vermeld:'
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel15.10
  - number: 15.10.2.a
    text: de te betalen geldsom, alsmede een toelichting op de hoogte daarvan;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel15.10
  - number: 15.10.2.b
    text: de overtreding terzake waarvan zij is gegeven, alsmede het overtreden voorschrift.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel15.10
  - number: 15.10.3
    text: |-
      Op verzoek van de overtreder die de beschikking wegens zijn gebrekkige kennis van de Nederlandse taal onvoldoende
      begrijpt, draagt Onze Minister, onderscheidenlijk het college, er zoveel mogelijk zorg voor dat de in die
      beschikking vermelde informatie aan de overtreder wordt meegedeeld in een voor hem begrijpelijke taal.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel15.10
  - number: 15.10.4
    text: |-
      De beschikking dient te worden gegeven binnen twaalf weken nadat het rapport, bedoeld in
      [artikel 15.8, eerste lid][ref1], is opgemaakt, tenzij binnen deze termijn het rapport aan het openbaar ministerie
      is gezonden. In dat geval kan een boete worden opgelegd binnen twaalf weken nadat het openbaar ministerie aan Onze
      Minister, onderscheidenlijk het college, heeft meegedeeld dat geen strafvervolging wordt ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel15
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel15.10
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '15.2'
  - number: '15.11'
    text: |-
      De werkzaamheden die verband houden met de uitvoering van de [artikelen 15.9][ref1] en [15.10][ref2] worden
      verricht door personen die niet betrokken zijn geweest bij de opstelling van het in [artikel 15.8][ref3] bedoelde
      rapport en het daaraan voorafgaande onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel15
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel15.11
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '15.2'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '15.2'
      - id: ref3
        bwb_id: BWBR0009950
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '15.2'
  - number: '15.12'
    text: |-
      De werking van een beschikking als bedoeld in [artikel 15.10, eerste lid][ref1], wordt opgeschort totdat de
      beroepstermijn is verstreken of, indien beroep is ingesteld, op het beroep is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel15
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel15.12
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '15.2'
  - number: 15.13.1
    text: Een boete wordt betaald binnen zes weken nadat de beschikking waarbij de boete is opgelegd, in werking is getreden.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel15.13
  - number: 15.13.2
    text: |-
      De boete wordt vermeerderd met de wettelijke rente, te rekenen zes weken vanaf de dag waarop de in het eerste lid
      genoemde beschikking is bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel15.13
  - number: 15.13.3
    text: |-
      Indien niet is betaald binnen de in het eerste lid genoemde termijn, wordt degene die de boete is verschuldigd
      schriftelijk bevolen binnen twee weken alsnog het bedrag van de boete, verhoogd met de krachtens het tweede lid
      verschuldigde rente en de kosten van de aanmaning, te betalen.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel15.13
  - number: 15.14.1
    text: |-
      Bij gebreke van betaling binnen de termijn van twee weken, bedoeld in [artikel 15.13, derde lid][ref1], kan Onze
      Minister, onderscheidenlijk het college, van de overtreder de verschuldigde boete, verhoogd met de krachtens
      [artikel 15.13, tweede lid][ref2], verschuldigde rente en de op de aanmaning en invordering betrekking hebbende
      kosten, invorderen bij dwangbevel.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel15
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel15.14
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '15.2'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '15.2'
  - number: 15.14.2
    text: |-
      Het dwangbevel wordt op kosten van de overtreder bij deurwaardersexploot betekend en levert een executoriale titel
      op in de zin van het [Tweede Boek van het Wetboek van Burgerlijke Rechtsvordering](onbekend).
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel15.14
  - number: 15.14.3
    text: |-
      Gedurende zes weken na de dag van betekening staat verzet tegen het dwangbevel open door dagvaarding van de staat,
      onderscheidenlijk het college.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel15.14
  - number: 15.14.4
    text: |-
      Het verzet schorst de tenuitvoerlegging. Op verzoek van de staat, onderscheidenlijk het college, kan de rechter de
      schorsing van de tenuitvoerlegging opheffen.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel15.14
  - number: 15.14.5
    text: De in het eerste lid bedoelde bedragen komen toe aan de staat.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel15.14
  - number: '15.15'
    text: |-
      In afwijking van [artikel 5:33, eerste lid, eerste volzin, van de Algemene wet bestuursrecht][ref1] komen verbeurde
      dwangsommen toe aan de staat.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel15.15
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '15.16'
    text: De bevoegdheid tot het opleggen van een boete vervalt vijf jaar nadat de overtreding is begaan.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel15.16
  - number: 16.1.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de vergoeding van de kosten die is
      verschuldigd door degene ten behoeve van wie werkzaamheden of diensten zijn verricht ingevolge het bepaalde bij of
      krachtens deze wet voorzover de vergoeding verband houdt met deze werkzaamheden of diensten.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel16.1
  - number: 16.1.2
    text: |-
      Bij het vaststellen van de vergoeding kunnen mede worden betrokken kosten, verband houdend met het toezicht op de
      naleving van het bepaalde bij of krachtens deze wet ten aanzien van de desbetreffende werkzaamheden of diensten.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel16.1
  - number: 16.1.3
    text: |-
      Voorzover de regels, bedoeld in het eerste lid, betrekking hebben op de vaststelling van de hoogte van de
      vergoeding van de kosten van door het college te verrichten werkzaamheden of diensten, betrekt Onze Minister het
      college bij die vaststelling. De betreffende vergoeding wordt opgelegd door het college en voldaan aan het college.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel16.1
  - number: 16.1.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld betreffende de jaarlijkse bijdrage die is
      verschuldigd door gebruikers van radiozendapparaten ter dekking van de kosten die voor de overheid voortvloeien uit
      de toepassing van het bij of krachtens deze wet terzake van de elektromagnetische compatibiliteit bepaalde.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel16.1
  - number: 16.1.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld betreffende de jaarlijkse bijdrage die is
      verschuldigd door een aanbieder van een openbaar telecommunicatienetwerk ter dekking van de kosten die voor de
      overheid voortvloeien uit de toepassing van het bij of krachtens deze wet terzake van randapparatuur bepaalde.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel16.1
  - number: '17.1'
    text: |-
      In afwijking van [artikel 8:7 van de Algemene wet bestuursrecht][ref1] is voor beroep tegen besluiten op grond van
      deze wet de rechtbank te Rotterdam bevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel17.1
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 18.1.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld om te kunnen onderzoeken of bepaalde
      ontwikkelingen in belangrijke mate kunnen bijdragen aan het bereiken van de doelstellingen van deze wet. Deze
      regels kunnen afwijken van het bij of krachtens deze wet bepaalde.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel18.1
  - number: 18.1.2
    text: |-
      Bij de voorbereiding van de regels worden de bij de in de regels te behandelen onderwerpen meest betrokken personen
      of instanties betrokken.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel18.1
  - number: 18.1.3
    text: |-
      Het ontwerp van een regeling krachtens het eerste lid wordt bekendgemaakt in de Staatscourant. Aan eenieder
      wordt de gelegenheid geboden binnen een bij die bekendmaking vast te stellen termijn van ten minste vier weken
      opmerkingen over het ontwerp schriftelijk ter kennis te brengen van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel18.1
  - number: 18.1.4
    text: |-
      De regels vervallen uiterlijk binnen twee jaar na het tijdstip van inwerkingtreding van die regels. Een algemene
      maatregel van bestuur als bedoeld in het eerste lid kan bij koninklijk besluit worden ingetrokken op een bij dat
      besluit te bepalen tijdstip, dat ligt binnen de in de eerste volzin bedoelde termijn.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel18.1
  - number: 18.1.5
    text: |-
      Indien Onze Minister tot het oordeel komt dat een definitieve voorziening terzake wenselijk is, zorgt deze voor
      vervanging van de regels. Indien voor de vervanging een wet nodig is, wordt binnen twee jaar na inwerkingtreding
      van de regels een voorstel van wet ingediend bij de Staten-Generaal. Indien voor de vervanging een algemene
      maatregel van bestuur nodig is, wordt binnen twee jaar na inwerkingtreding van de regels aan Ons een voordracht
      daartoe gedaan.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel18.1
  - number: 18.1.6
    text: |-
      Bij de regels, bedoeld in het eerste lid, kunnen taken worden opgedragen en bevoegdheden worden verleend aan het
      college.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel18.1
  - number: 18.3.1
    text: |-
      Onze Minister stelt de directeur-generaal van de Nederlandse mededingingsautoriteit, bedoeld in
      [artikel 2 van de Mededingingswet][ref1], in de gelegenheid hem advies uit te brengen over het ontwerp
      van een besluit tot weigering of intrekking van een vergunning voorzover dit verband houdt met het
      in aanzienlijke mate beperken van de daadwerkelijke mededinging op de relevante markt, bedoeld in
      [de artikelen 3.6, tweede lid, onder d][ref2], en [3.7, tweede lid, onder f][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel18.3
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref3
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 18.3.2
    text: |-
      Alvorens over te gaan tot een schriftelijke bekendmaking als bedoeld in [artikel 9.2, tweede lid][ref1], stelt
      Onze Minister het college en de directeur-generaal van de Nederlandse mededingingsautoriteit in de gelegenheid hem
      advies uit te brengen over het ontwerp van de bekendmaking.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel9
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel18.3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '9'
        hoofdstuk: '9'
  - number: 18.3.3
    text: |-
      Voorzover bij de uitoefening van bevoegdheden van het college begrippen worden uitgelegd die worden
      gehanteerd bij de toepassing van [artikel 24 van de Mededingingswet][ref1], geschiedt de uitoefening van die
      bevoegdheden overeenkomstig door het college in overeenstemming met de directeur-generaal van de Nederlandse
      mededingingsautoriteit vastgestelde algemene richtlijnen. Van de richtlijnen doet het college mededeling in de
      Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel24
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel18.3
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '24'
  - number: 18.3.4
    text: |-
      Het college en de directeur-generaal van de Nederlandse mededingingsautoriteit maken in het belang van een
      effectieve en efficiënte besluitvorming gezamenlijk afspraken over de wijze van behandeling van aangelegenheden van
      wederzijds belang.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel18.3
  - number: 18.4.1
    text: |-
      De aanbieder van een openbaar telecommunicatienetwerk over wiens netwerk internationaal openbaar
      telecommunicatieverkeer wordt verzorgd leeft de verplichtingen na die voortvloeien uit het Internationaal
      Telecommunicatieverdrag en uit andere Nederland bindende verdragen of besluiten van volkenrechtelijke organisaties
      terzake van de verzorging van dit verkeer.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel18.4
  - number: 18.4.2
    text: |-
      Degene aan wie door Onze Minister een vergunning is verleend voor het gebruik van frequentieruimte, welk gebruik
      schadelijke storingen kan veroorzaken in de radiodiensten van andere landen, leeft de verplichtingen na die
      voortvloeien uit het Internationaal Telecommunicatieverdrag en uit andere Nederland bindende verdragen of besluiten
      van volkenrechtelijke organisaties terzake van dit gebruik.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel18.4
  - number: '18.5'
    text: |-
      Onverminderd het overigens bij of krachtens het Internationaal Telecommunicatieverdrag bepaalde zijn erkende
      ondernemingen in de zin van genoemd verdrag:
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel18.5
  - number: 18.5.a
    text: |-
      de aanbieder van een openbaar telecommunicatienetwerk over wiens telecommunicatienetwerk internationaal openbaar
      telecommunicatieverkeer wordt verzorgd, en
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel18.5
  - number: 18.5.b
    text: |-
      de aanbieder van een openbaar telecommunicatienetwerk die in het kader van zijn aanbod radiozendapparaten gebruikt
      of de aanbieder van een omroepzendernetwerk, wiens uitzendingen schadelijke storingen kunnen veroorzaken in de
      radiodiensten van andere landen.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel18.5
  - number: 18.6.1
    text: |-
      Aanbieders van openbare telecommunicatienetwerken of openbare telecommunicatiediensten die in Nederland of in een
      andere lid-staat van de Europese Unie bijzondere of uitsluitende rechten hebben voor het verrichten van diensten
      in andere sectoren dan telecommunicatie voeren voor onderscheiden activiteiten afzonderlijke boekhoudingen, op
      gelijke wijze als vereist zou zijn wanneer de activiteiten door juridisch onafhankelijke ondernemingen zouden
      worden verricht.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel18.6
  - number: 18.6.2
    text: |-
      Bij ministeriële regeling kan worden bepaald dat het eerste lid niet van toepassing is op bij die regeling
      aangewezen aanbieders waarvan de jaaromzet in telecommunicatie-activiteiten binnen de Europese Unie een bij die
      regeling te noemen bedrag niet te boven gaat.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel18.6
  - number: 18.7.1
    text: |-
      Onze Minister, onderscheidenlijk het college, is bevoegd voor een juiste uitvoering van het bepaalde bij of
      krachtens deze wet van een ieder te allen tijde inlichtingen te vorderen voorzover dit redelijkerwijs voor de
      vervulling van zijn taak nodig is.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel18.7
  - number: 18.7.2
    text: Degene van wie krachtens het eerste lid inlichtingen zijn gevorderd, is verplicht deze te geven.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel18.7
  - number: '18.8'
    text: |-
      Onze Minister kan met betrekking tot de veiligheid en de beveiliging van openbare telecommunicatienetwerken en
      openbare telecommunicatiediensten regels stellen. Deze regels bevatten technische en organisatorische eisen die aan
      aanbieders van openbare telecommunicatienetwerken en openbare telecommunicatiediensten kunnen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel18.8
  - number: 18.9.1
    text: |-
      Onze Minister is bevoegd, in overeenstemming met Onze Minister van Justitie, aanbieders van openbare
      telecommunicatienetwerken en van openbare telecommunicatiediensten aanwijzingen te geven met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel18.9
  - number: 18.9.1.a
    text: de instandhouding en de exploitatie van hun openbare telecommunicatienetwerken, of
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel18.9
  - number: 18.9.1.b
    text: |-
      het verzorgen en gebruiken van hun openbare telecommunicatiediensten, wanneer dit noodzakelijk is ter beëindiging
      van strafbaar gedrag jegens een persoon.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel18.9
  - number: 18.9.2
    text: |-
      Onze Minister is bevoegd, in overeenstemming met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties,
      aanbieders van openbare telecommunicatienetwerken en van openbare telecommunicatiediensten aanwijzingen te geven
      met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel18.9
  - number: 18.9.2.a
    text: de instandhouding en de exploitatie van hun openbare telecommunicatienetwerken, of
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel18.9
  - number: 18.9.2.b
    text: |-
      het verzorgen en gebruiken van hun openbare telecommunicatiediensten, wanneer dit noodzakelijk is in het belang van
      de veiligheid van de staat.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel18.9
  - number: 18.9.3
    text: |-
      Onze Minister kan bij de toepassing van het eerste en tweede lid afwijken van de verplichtingen die ingevolge deze
      wet op aanbieders van openbare telecommunicatienetwerken en van openbare telecommunicatiediensten rusten.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel18.9
  - number: 18.9.4
    text: |-
      Een aanbieder van een openbaar telecommunicatienetwerk of een openbare telecommunicatiedienst is verplicht een
      aanwijzing als bedoeld in het eerste of tweede lid op te volgen.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel18.9
  - number: 18.9.5
    text: |-
      Indien aanbieders van openbare telecommunicatienetwerken en openbare telecommunicatiediensten als gevolg van
      aanwijzingen gegeven op grond van het eerste en tweede lid onevenredig financieel nadeel ondervinden, kent Onze
      Minister aan hen een naar billijkheid te bepalen vergoeding toe.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel18.9
  - number: '18.10'
    text: |-
      Degene die een telefoongids uitgeeft, neemt op verzoek van een natuurlijke persoon of rechtspersoon die in die gids
      met een telefoonnummer is vermeld, het elektronisch postadres van verzoeker in die gids op tegen redelijke en niet
      discriminerende voorwaarden.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel18.10
  - number: 18.11.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het aan derden ter
      beschikking stellen van adressen voor elektronische post met bijbehorende gegevens ten behoeve van de samenstelling
      van boeken met elektronische postadressen.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel18.11
  - number: 18.11.2
    text: |-
      De regels, bedoeld in het eerste lid, kunnen onder meer betrekking hebben op de bescherming van persoonsgegevens en
      de persoonlijke levenssfeer.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel18.11
  - number: 18.12.1
    text: |-
      Indien in deze wet geregelde onderwerpen in het belang van een goede uitvoering van deze wet nadere regeling
      behoeven, kan deze geschieden bij of krachtens algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel18.12
  - number: 18.12.2
    text: |-
      Bij de regels, bedoeld in het eerste lid, kunnen taken worden opgedragen en bevoegdheden worden verleend aan het
      college.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel18.12
  - number: 18.13.1
    text: |-
      Onverminderd het overigens bij of krachtens deze wet bepaalde worden de bij of krachtens deze wet te nemen
      maatregelen en regels genomen met inachtneming van het belang van de bescherming van persoonsgegevens en de
      bescherming van de persoonlijke levenssfeer alsmede de bescherming van het brief-, telefoon- en telegraafgeheim en
      het geheim van daarmee vergelijkbare communicatietechnieken.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel18.13
  - number: 18.13.2
    text: |-
      Onverminderd het overigens bij of krachtens deze wet bepaalde is het eerste lid van overeenkomstige toepassing op
      de bedrijfsvoering door aanbieders van openbare telecommunicatienetwerken en openbare telecommunicatiediensten.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel18.13
  - number: 18.14.1
    text: |-
      De voordracht voor een algemene maatregel van bestuur krachtens de [artikelen 9.1, eerste en tweede lid][ref1],
      [20.1, vierde lid][ref2], en [20.3, vierde lid][ref3], wordt, met uitzondering van de eerste keer dat een
      dergelijke algemene maatregel wordt vastgesteld, niet gedaan dan nadat het ontwerp aan de beide kamers der Staten-
      Generaal is overgelegd. Binnen vier weken na de overlegging kan door of namens een der kamers of door ten minste
      een vijfde van het grondwettelijk aantal leden van een der kamers de wens te kennen worden gegeven dat het in het
      ontwerp te regelen onderwerp bij de wet wordt geregeld. In dat geval wordt een daartoe strekkend voorstel van wet
      zo spoedig mogelijk ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel20
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel18.14
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '9'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '20'
        hoofdstuk: '20'
      - id: ref3
        bwb_id: BWBR0009950
        artikel: '20'
        hoofdstuk: '20'
  - number: 18.14.2
    text: |-
      Een krachtens de [artikelen 3.1, eerste lid][ref1], [4.11, tweede lid][ref2], [4.11, derde lid][ref3],
      [6.1, zevende lid][ref4], en [6.9, vijfde lid][ref5], vastgestelde algemene maatregel van bestuur treedt niet
      eerder in werking dan vier weken na de datum van uitgifte van het Staatsblad waarin hij is geplaatst. Van de
      plaatsing wordt onverwijld mededeling gedaan aan de beide kamers der Staten-Generaal. De eerste en tweede volzin
      vinden de eerste keer dat de maatregel wordt vastgesteld, geen toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0009950#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0009950#Artikel6
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel18.14
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '4'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0009950
        artikel: '4'
        hoofdstuk: '4'
      - id: ref4
        bwb_id: BWBR0009950
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref5
        bwb_id: BWBR0009950
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.3'
  - number: 20.1.1
    text: |-
      KPN Telecom B.V. en haar groepsmaatschappijen als bedoeld in
      [artikel 24b van boek 2 van het Burgerlijk Wetboek][ref1] worden voor twee jaar, voorzover zij aanbieder zijn
      van een vast openbaar telefoonnetwerk, een vaste openbare telefoondienst, en huurlijnen in Nederland, aangewezen
      als een aanbieder van een vast openbaar telefoonnetwerk, een vaste openbare telefoondienst en huurlijnen in
      geheel Nederland die beschikt over een aanmerkelijke macht als bedoeld in [artikel 6.4, eerste lid][ref2], en
      [artikel 7.2, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel7
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel20.1
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref3
        bwb_id: BWBR0009950
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: 20.1.2
    text: |-
      In afwijking van de [artikelen 9.2 tot en met 9.4][ref1], biedt KPN Telecom B.V. tot een jaar nadat
      zij Onze Minister schriftelijk heeft medegedeeld dit niet langer te doen, aan eenieder aan de krachtens
      [artikel 9.1, eerste lid][ref2], aangewezen diensten en daarmee samenhangende voorzieningen die met betrekking tot
      kwaliteit en prijs voldoen aan de krachtens [artikel 9.1, tweede lid][ref3], gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel9
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel20.1
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '9'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '9'
        hoofdstuk: '9'
      - id: ref3
        bwb_id: BWBR0009950
        artikel: '9'
        hoofdstuk: '9'
  - number: 20.1.3
    text: |-
      Koninklijke KPN N.V. die krachtens artikel 4 van de Wet op de telecommunicatievoorzieningen verplicht is de
      telexdienst, bedoeld in artikel 4 van het Besluit opgedragen telecommunicatiediensten en de telegraafdienst,
      bedoeld in artikel 7 van het Besluit opgedragen telecommunicatiediensten te verzorgen, blijft ervoor zorgen dat
      deze diensten met uitzondering van de telexdienst over radio en de radiotelegrafiedienst door haar zelf of door een
      door haar aan te wijzen rechtspersoon aan eenieder op het Nederlandse grondgebied worden aangeboden. Binnen twee
      jaar na inwerkingtreding van deze wet bepaalt Onze Minister aan de hand van door Koninklijke KPN N.V. verstrekte
      gegevens met betrekking tot omvang van het gebruik van deze diensten in hoeverre verplichte voortzetting van deze
      diensten maatschappelijk gewenst is.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel20.1
  - number: 20.1.4
    text: |-
      Bij algemene maatregel van bestuur worden criteria vastgesteld op grond waarvan Onze Minister de hoogte kan
      vaststellen van de tarieven van de opgedragen diensten, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel20.1
  - number: 20.2.1
    text: |-
      Een vergunning die is verleend krachtens artikel 13a, eerste lid, van de Wet op de telecommunicatievoorzieningen
      wordt gelijkgesteld met een vergunning, verleend krachtens [artikel 3.3, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel20.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 20.2.2
    text: |-
      Voor de houder van een vergunning als bedoeld in het eerste lid blijft het bepaalde bij of krachtens de artikelen
      13c, 13g, met dien verstande dat in het eerste lid, onderdeel a, vervalt «waaronder technische aftapbaarheid»,
      13j, 13k, met uitzondering van het zevende lid, 13l, 13n, 13t, voorzover het betreft de verwijzing naar artikel
      11, eerste tot en met derde lid, en vijfde tot en met zevende lid, 13u, 13v, 13x en [13y van de Wet op de
      telecommunicatievoorzieningen](onbekend) van toepassing.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel20.2
  - number: 20.3.1
    text: |-
      Een machtiging die is verleend krachtens artikel 17, eerste lid, van de Wet op de telecommunicatievoorzieningen
      wordt gelijkgesteld met een vergunning, verleend krachtens [artikel 3.3, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel20.3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 20.3.2
    text: |-
      De toekenning van radio-frequenties krachtens artikel 3, tweede lid, van de Wet op de telecommunicatievoorzieningen
      aan de houder van de concessie wordt gelijkgesteld met een vergunning voor het gebruik van frequentieruimte als
      bedoeld in [artikel 3.3, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel20.3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 20.3.3
    text: |-
      Voorzover bij een machtiging die is verleend krachtens artikel 21 van de Wet op de telecommunicatievoorzieningen
      radiofrequenties zijn toegekend, wordt deze toekenning van radiofrequenties gelijkgesteld met een vergunning voor
      het gebruik van frequentieruimte als bedoeld in [artikel 3.3, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel20.3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 20.3.4
    text: |-
      Een vergunning als bedoeld in het eerste, tweede en derde lid, geldt voor een bij algemene maatregel van bestuur
      vast te stellen termijn, waarbij een onderscheid kan worden gemaakt al naar gelang de toepassing waarvoor de
      vergunning is verleend.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel20.3
  - number: 20.4.1
    text: |-
      Regels vastgesteld krachtens de hoofdstukken IV, V en VII van de Wet op de telecommunicatievoorzieningen,
      alsmede het bepaalde bij of krachtens het Besluit radio-elektrische inrichtingen, worden gelijkgesteld met regels
      vastgesteld krachtens de [hoofdstukken 3][ref1], [10][ref2] en [16][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk10
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk16
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel20.4
    references:
      - id: ref1
        bwb_id: BWBR0009950
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0009950
        hoofdstuk: '10'
      - id: ref3
        bwb_id: BWBR0009950
        hoofdstuk: '16'
  - number: 20.4.2
    text: |-
      Apparaten die op het tijdstip van inwerkingtreding van deze wet in gebruik zijn bij de houder van de concessie,
      bedoeld in artikel 3, eerste lid, van de Wet op de telecommunicatievoorzieningen, ten dienste van de uitoefening
      van de aan de houder van de concessie opgedragen taken, worden, voorzover deze niet voldoen aan het bepaalde
      bij of krachtens [hoofdstuk 10 van deze wet][ref1], geacht te voldoen aan het bepaalde bij of krachtens
      [hoofdstuk 10][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk10
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk10
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel20.4
    references:
      - id: ref1
        bwb_id: BWBR0009950
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0009950
        hoofdstuk: '10'
  - number: 20.5.1
    text: |-
      Met betrekking tot de instandhouding, de verplaatsing en de opruiming van kabels en kabelwerken, voorzover de
      kabels en kabelwerken zijn aangelegd met toepassing van hoofdstuk VI van de Wet op de telecommunicatievoorzieningen
      is [hoofdstuk 5][ref1] van deze wet van toepassing met dien verstande, dat kabels en kabelwerken,
      aangelegd in en op openbare gronden als bedoeld in artikel 1, onderdeel g, onder 3°, van de Wet op de
      telecommunicatievoorzieningen worden gelijkgesteld met kabels, aangelegd in en op openbare gronden als bedoeld in
      [artikel 1.1, onderdeel s][ref2], van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel1
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel20.5
    references:
      - id: ref1
        bwb_id: BWBR0009950
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '1'
        hoofdstuk: '1'
  - number: 20.5.2
    text: |-
      Ten aanzien van kabels en kabelwerken, bedoeld in het eerste lid, die deel uitmaken van een telecommunicatienetwerk
      dat tot gebruik strekt van het Ministerie van Defensie geldt dat:
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel20.5
  - number: 20.5.2.a
    text: |-
      gedurende een periode van vijf jaar na het tijdstip van inwerkingtreding van deze wet op de aanleg van kabels
      en kabelwerken ten behoeve van uitbreiding van dat telecommunicatienetwerk [hoofdstuk 5][ref1] van deze wet van
      toepassing is, en


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel20.5
    references:
      - id: ref1
        bwb_id: BWBR0009950
        hoofdstuk: '5'
  - number: 20.5.2.b
    text: |-
      dat tijdens de periode, genoemd onder a, alsmede na afloop van die periode op de kabels en kabelwerken die zijn
      aangelegd voor uitbreiding van dat telecommunicatienetwerk de bepalingen van [hoofdstuk 5][ref1] van deze wet met
      betrekking tot de instandhouding, de verplaatsing en de opruiming van toepassing blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel20.5
    references:
      - id: ref1
        bwb_id: BWBR0009950
        hoofdstuk: '5'
  - number: 20.6.1
    text: |-
      Een nummerplan vastgesteld krachtens artikel 40d van de Wet op de telecommunicatievoorzieningen wordt gelijkgesteld
      met een nummerplan als bedoeld in deze wet.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel20.6
  - number: 20.6.2
    text: |-
      De toekenning of reservering van nummers, bedoeld in artikel 17, elfde lid, van de Wet op de
      telecommunicatievoorzieningen, de toekenning of reservering van nummers alsmede de wijziging daarvan, bedoeld
      in artikel 40d van de Wet op de telecommunicatievoorzieningen, de toekenning van nummers als bedoeld in
      artikel 40e van de Wet op de telecommunicatievoorzieningen, alsmede de toekenning van nummers, bedoeld in
      [artikel 2, derde lid, van de Vergunningenwet kabelgebonden telecommunicatie-infrastructuur][ref1], worden
      gelijkgesteld met een reservering, toekenning of wijziging als bedoeld in [hoofdstuk 4][ref2] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0007973#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel20.6
    references:
      - id: ref1
        bwb_id: BWBR0007973
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0009950
        hoofdstuk: '4'
  - number: 20.7.1
    text: |-
      Een vergunning zonder gebiedsbeperking die is verleend krachtens
      [artikel 2, eerste lid, van de Vergunningenwet kabelgebonden telecommunicatie-infrastructuur][ref1] wordt
      gelijkgesteld met een registratie als aanbieder van een openbaar telecommunicatienetwerk als bedoeld in
      [artikel 2.3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007973#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel2
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel20.7
    references:
      - id: ref1
        bwb_id: BWBR0007973
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '2'
        hoofdstuk: '2'
  - number: 20.7.2
    text: |-
      Voor een geregistreerde als bedoeld in het eerste lid blijven de artikelen 4b van de Wet op de
      telecommunicatievoorzieningen en [21 van de Vergunningenwet kabelgebonden telecommunicatie-infrastructuur][ref1]
      nog van toepassing gedurende vijf jaar na het tijdstip van inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0007973#Artikel21
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel20.7
    references:
      - id: ref1
        bwb_id: BWBR0007973
        artikel: '21'
  - number: 20.8.1
    text: |-
      Ten aanzien van degene op wie ingevolge [artikel 2.1][ref1] een verplichting tot registratie rust, blijft
      [artikel 2.1][ref2] buiten toepassing gedurende zes maanden na het tijdstip van inwerkingtreding van deze wet, en
      indien binnen die termijn een aanvraag tot registratie is ingediend, ook nadien, tot zes weken na de datum van de
      beschikking waarbij op de aanvraag is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel2
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel20.8
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '2'
        hoofdstuk: '2'
  - number: 20.8.2
    text: |-
      Een registratie als bedoeld in artikel 4ac van de Wet op de telecommunicatievoorzieningen wordt gelijkgesteld met
      een registratie als bedoeld in [artikel 2.1][ref1] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel2
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel20.8
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '2'
        hoofdstuk: '2'
  - number: 20.9.1
    text: |-
      Het frequentieplan wordt voor de eerste maal vastgesteld binnen zes maanden na het tijdstip van inwerkingtreding
      van deze wet.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel20.9
  - number: 20.9.2
    text: |-
      Tot het tijdstip waarop het frequentieplan voor de eerste maal is vastgesteld, worden vergunningen voor
      frequentieruimte als bedoeld in [artikel 3.3, eerste lid][ref1], verleend door middel van de procedure op volgorde
      van binnenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel20.9
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 20.9.3
    text: |-
      In afwijking van het tweede lid geldt dat indien een aanvraag voor een vergunning betrekking heeft op
      frequentieruimte die naar het oordeel van Onze Minister behoort tot een categorie van gebruik waarvoor vergunningen
      zullen worden verleend door middel van een veiling of een vergelijkende toets, kan Onze Minister besluiten een van
      genoemde procedures toe te passen.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel20.9
  - number: '20.10'
    text: Het frequentieregister is beschikbaar binnen zes maanden na het tijdstip van inwerkingtreding van deze wet.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel20.10
  - number: 20.11.1
    text: |-
      De instemming, bedoeld in [artikel 11.5, tweede lid, onder b][ref1], is, onverminderd het tweede lid van dit
      artikel, niet vereist voor de op het tijdstip van inwerkingtreding van [artikel 11.5][ref2], met betrekking tot de
      voor het in [artikel 11.5, tweede lid, onder b][ref3], genoemde doel reeds in gebruik zijnde verkeersgegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel11
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel20.11
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.1'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.1'
      - id: ref3
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.1'
  - number: 20.11.2
    text: |-
      Ten aanzien van de verkeersgegevens, bedoeld in het eerste lid, geldt dat de aanbieders, genoemd in
      [artikel 11.5, eerste lid][ref1], binnen een jaar na het tijdstip van inwerkingtreding van [artikel 11.5][ref2] aan
      de abonnee mededeling doen van het gebruik dat van deze verkeersgegevens wordt gemaakt. De abonnee wordt geacht met
      dit gebruik te hebben ingestemd, tenzij deze binnen een termijn van twee maanden na de datum van verzending van de
      mededeling, schriftelijk aan de desbetreffende aanbieder te kennen geeft dat met het gebruik niet wordt ingestemd.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel11
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel20.11
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.1'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.1'
  - number: '20.12'
    text: |-
      [Artikel 11.6][ref1] is niet van toepassing op algemeen beschikbare telefoongidsen en de bestanden van algemeen
      beschikbare abonnee-informatiediensten die zijn uitgegeven voor het tijdstip van inwerkingtreding van dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel11
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel20.12
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.1'
  - number: '20.13'
    text: |-
      Ten aanzien van degene op wie het voorschrift van [artikel 13.1][ref1] van toepassing is, blijft dat artikel
      gedurende negen maanden na het tijdstip van inwerkingtreding van deze wet buiten toepassing, indien de door hem
      aangeboden openbare telecommunicatienetwerken of openbare telecommunicatiediensten nog niet aftapbaar zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel13
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel20.13
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '13'
        hoofdstuk: '13'
  - number: 20.14.1
    text: |-
      Ten aanzien van de instelling die zendtijd als bedoeld in [artikel 1, onder hh, van de Mediawet][ref1] heeft
      verkregen en die ingevolge [artikel 3.3][ref2] een vergunning voor het gebruik van frequentieruimte op het terrein
      van de publieke omroep behoeft, blijft dat artikel voor dat doel buiten toepassing gedurende zes maanden na het
      tijdstip van inwerkingtreding van deze wet, en indien binnen die termijn een aanvraag voor een vergunning is
      ingediend, ook nadien, tot zes weken na de datum van de beschikking waarbij op de aanvraag is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel20.14
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 20.14.2
    text: |-
      Zolang en voorzover [artikel 3.3][ref1] buiten toepassing blijft ten aanzien van het gebruik van
      frequentieruimte op het terrein van de publieke omroep, blijft de Nederlandsche Omroep-Zender-Maatschappij
      «NOZEMA», genoemd in [artikel 1 van de Radio-Omroep-Zender-Wet 1935][ref2], bevoegd gebruik te maken van de
      frequentieruimte op het terrein van de publieke omroep, voorzover die frequentieruimte aan haar overeenkomstig
      [artikel 2 van de Radio-Omroep-Zender-Wet 1935][ref3] door Onze Minister is toegewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0001965#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0001965#Artikel2
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel20.14
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0001965
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0001965
        artikel: '2'
  - number: 20.14.3
    text: |-
      Zolang en voorzover [artikel 3.3][ref1] buiten toepassing blijft ten aanzien van het gebruik van frequentieruimte
      op het terrein van de publieke omroep, blijft de NOZEMA, in afwijking van [artikel 10.16][ref2], bevoegd
      radiozendapparaten aan te leggen en te gebruiken ten behoeve van het verzorgen van diensten, waarbij gebruik wordt
      gemaakt van de frequentieruimte op het terrein van de publieke omroep.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel10
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel20.14
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.2.3
  - number: 20.14.4
    text: |-
      Zolang en voorzover [artikel 3.3][ref1] buiten toepassing blijft ten aanzien van het gebruik van frequentieruimte
      op het terrein van de publieke omroep, blijven de krachtens [artikel 3.3][ref2] gestelde regels ten aanzien van
      het gebruik van frequentieruimte op het terrein van de publieke omroep ten aanzien van de NOZEMA eveneens buiten
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel20.14
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 20.14.5
    text: |-
      De frequentieruimte op het terrein van de publieke omroep die op het tijdstip van inwerkingtreding van deze
      wet overeenkomstig [artikel 2 van de Radio-Omroep-Zender-Wet 1935][ref1] door Onze Minister aan de NOZEMA is
      toegewezen, wordt door de NOZEMA uiterlijk zes maanden na het tijdstip van inwerkingtreding van deze wet aan Onze
      Minister ter beschikking gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001965#Artikel2
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel20.14
    references:
      - id: ref1
        bwb_id: BWBR0001965
        artikel: '2'
  - number: 20.15.1
    text: |-
      Ten aanzien van de mogelijkheid om bezwaar te maken of beroep in te stellen tegen een besluit krachtens de Wet op
      de telecommunicatievoorzieningen dat is bekendgemaakt voor het tijdstip van inwerkingtreding van deze wet, blijft
      het recht zoals het gold voor dat tijdstip van toepassing.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel20.15
  - number: 20.15.2
    text: |-
      Ten aanzien van de behandeling van bezwaar of beroep dat voor het tijdstip van inwerkingtreding van deze wet is
      gemaakt onderscheidenlijk is ingesteld, blijft het recht zoals het gold voor dat tijdstip van toepassing.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel20.15
  - number: 20.15.3
    text: |-
      Ten aanzien van de behandeling van bezwaar of beroep dat op of na het tijdstip van inwerkingtreding van deze wet
      is gemaakt onderscheidenlijk is ingesteld en dat is gericht tegen een besluit waartegen voor dat tijdstip eveneens
      bezwaar is gemaakt onderscheidenlijk beroep is ingesteld, blijft het recht zoals het gold voor dat tijdstip van
      toepassing.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel20.15
  - number: '20.16'
    text: |-
      De tekst van de [Mediawet][ref1] wordt in het Staatsblad geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0004149
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel20.16
    references:
      - id: ref1
        bwb_id: BWBR0004149
  - number: 20.17.1
    text: |-
      De Wet op de telecommunicatievoorzieningen wordt ingetrokken op een bij koninklijk besluit te bepalen tijdstip, dat
      voor de verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel20.17
  - number: 20.17.2
    text: |-
      De [Vergunningenwet kabelgebonden telecommunicatie-infrastructuur][ref1] wordt ingetrokken op een bij koninklijk
      besluit te bepalen tijdstip, dat voor de verschillende artikelen of onderdelen daarvan verschillend kan worden
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007973
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel20.17
    references:
      - id: ref1
        bwb_id: BWBR0007973
  - number: '20.18'
    text: |-
      Bij algemene maatregel van bestuur kunnen tot twee jaar na inwerkingtreding van deze wet, in gevallen waarin deze
      wet niet voorziet, regels worden gesteld met betrekking tot de invoering van artikelen van deze wet of onderdelen
      daarvan.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel20.18
  - number: '20.19'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel20.19
  - number: '20.20'
    text: 'Deze wet wordt aangehaald als: Telecommunicatiewet.'
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel20.20
