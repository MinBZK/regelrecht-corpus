      - id: ref4
        bwb_id: BWBR0009950
        artikel: '18'
        hoofdstuk: '18'
      - id: ref5
        bwb_id: BWBR0009950
        artikel: '18'
        hoofdstuk: '18'
      - id: ref6
        bwb_id: BWBR0009950
        artikel: '18'
        hoofdstuk: '18'
      - id: ref7
        bwb_id: BWBR0009950
