---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: telecommunicatiewet
regulatory_layer: WET
publication_date: '2025-07-23'
valid_from: '2002-05-29'
bwb_id: BWBR0009950
url: https://wetten.overheid.nl/BWBR0009950/2002-05-29
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het in verband met de algehele liberalisering van de telecommunicatie-
    infrastructuur en de telecommunicatiediensten wenselijk is regels te stellen ter waarborging van een samenhangende
    infrastructuur en ter bevordering van de daadwerkelijke mededinging;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel1.1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Verkeer en Waterstaat;'
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel1.1
  - number: 1.1.b
    text: |-
      college: college, genoemd in [artikel 2 van de Wet Onafhankelijke post- en telecommunicatieautoriteit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008807#Artikel2
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0008807
        artikel: '2'
  - number: 1.1.c
    text: |-
      telecommunicatie: iedere overdracht, uitzending of ontvangst van signalen van welke aard ook door middel van
      kabels, radiogolven, optische middelen of andere elektromagnetische middelen;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel1.1
  - number: 1.1.d
    text: |-
      telecommunicatienetwerk: de overdrachtsapparatuur en, waar van toepassing, de routeringsapparatuur en andere
      technische middelen die de overdracht mogelijk maken van signalen tussen netwerkaansluitpunten via kabels,
      radiogolven, optische middelen of andere elektromagnetische middelen;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel1.1
  - number: 1.1.e
    text: |-
      telecommunicatiedienst: dienst die geheel of gedeeltelijk bestaat in de overdracht of routering van signalen over
      een telecommunicatienetwerk;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel1.1
  - number: 1.1.f
    text: 'openbare telecommunicatiedienst: telecommunicatiedienst die beschikbaar is voor het publiek;'
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel1.1
  - number: 1.1.g
    text: |-
      openbaar telecommunicatienetwerk: een telecommunicatienetwerk dat onder meer voor de verrichting van openbare
      telecommunicatiediensten wordt gebruikt of een telecommunicatienetwerk waarmee aan het publiek de mogelijkheid tot
      overdracht van signalen tussen netwerkaansluitpunten ter beschikking gesteld wordt;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel1.1
  - number: 1.1.h
    text: |-
      netwerkaansluitpunt: waar het een openbaar telecommunicatienetwerk betreft, het geheel van verbindingen, met hun
      technische toegangsspecificaties, die deel uitmaken van dit openbaar telecommunicatienetwerk, en nodig zijn om
      toegang te verkrijgen tot dit netwerk en om efficiënt via dit netwerk te kunnen communiceren;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel1.1
  - number: 1.1.i
    text: |-
      huurlijn: aan het publiek ter beschikking stellen van transparante transmissiecapaciteit tussen twee
      netwerkaansluitpunten van een telecommunicatienetwerk, zonder routeringsfuncties waarover gebruikers kunnen
      beschikken als onderdeel van de geleverde huurlijn;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel1.1
  - number: 1.1.j
    text: |-
      bijzondere toegang: toegang tot een telecommunicatienetwerk op andere punten dan de netwerkaansluitpunten die aan
      de meeste gebruikers worden aangeboden;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel1.1
  - number: 1.1.k
    text: |-
      vaste openbare telefoondienst: openbare telecommunicatiedienst die bestaat in de directe overdracht en routering
      van spraak van en naar netwerkaansluitpunten op vaste locaties van een telecommunicatienetwerk, waarvan iedere
      gebruiker van op een dergelijk netwerkaansluitpunt aangesloten apparatuur gebruik kan maken om met een ander
      netwerkaansluitpunt te communiceren;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel1.1
  - number: 1.1.l
    text: |-
      vast openbaar telefoonnetwerk: de elementen van een openbaar telecommunicatienetwerk die geheel of gedeeltelijk
      worden gebruikt voor de levering van de vaste openbare telefoondienst;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel1.1
  - number: 1.1.m
    text: |-
      mobiele openbare telefoondienst: openbare telecommunicatiedienst die bestaat in de directe overdracht en routering
      van spraak en het daarbij tot stand brengen van radiocommunicatie met een mobiele gebruiker die gebruik maakt van
      netwerkaansluitpunten van een telecommunicatienetwerk, die zich niet op vaste locaties bevinden;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel1.1
  - number: 1.1.n
    text: |-
      mobiel openbaar telefoonnetwerk: de elementen van een openbaar telecommunicatienetwerk die geheel of gedeeltelijk
      worden gebruikt voor de levering van de mobiele openbare telefoondienst;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel1.1
  - number: 1.1.o
    text: |-
      omroepnetwerk: technische inrichtingen, of onderdelen daarvan, die worden gebruikt om met gebruik van kabels of
      radioverbindingen tussen punten programma's te verspreiden naar een of meer bij anderen in gebruik zijnde gronden,
      woningen, of niet tot woning dienende gebouwen;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel1.1
  - number: 1.1.p
    text: |-
      omroepzendernetwerk: radiozendapparaten, satellieten daaronder begrepen, die worden gebruikt of mede gebruikt voor
      het verspreiden van programma's;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel1.1
  - number: 1.1.q
    text: |-
      programma: programma als bedoeld in [artikel 1, eerste lid, onder f, van de Mediawet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel1
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '1'
  - number: 1.1.r
    text: |-
      kabels: kabels en de daarbij behorende ondersteuningswerken, beschermingswerken en signaalinrichtingen, alsmede
      inrichtingen, bestemd om daarin verbinding tot stand te brengen tussen kabels in, op of boven openbare gronden
      enerzijds en kabels in gebouwen en daarmee één geheel vormende gronden anderzijds dan wel tussen laatstgenoemde
      kabels onderling;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel1.1
  - number: 1.1.s
    text: 'openbare gronden:'
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel1.1
  - number: 1.1.s.1°
    text: |-
      openbare wegen met inbegrip van de daartoe behorende stoepen, glooiingen, bermen, sloten, bruggen, viaducten,
      tunnels, duikers, beschoeiingen en andere werken;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel1.1
  - number: 1.1.s.2°
    text: |-
      wateren met de daartoe behorende bruggen, plantsoenen, pleinen en andere plaatsen, die voor eenieder toegankelijk
      zijn;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel1.1
  - number: 1.1.t
    text: |-
      nummer: cijfers, letters of andere symbolen, al dan niet in combinatie, die bestemd zijn voor toegang tot of
      identificatie van gebruikers, netwerkexploitanten, diensten, netwerkaansluitpunten of andere netwerkelementen;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel1.1
  - number: 1.1.u
    text: 'nummeridentificatie:'
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel1.1
  - number: 1.1.u.1°
    text: |-
      faciliteit om het nummer van het oproepende netwerkaansluitpunt dan wel een nummer waarmee een individuele
      gebruiker kan worden geïdentificeerd aan het opgeroepen netwerkaansluitpunt te verstrekken, voordat de verbinding
      tot stand wordt gebracht;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel1.1
  - number: 1.1.u.2°
    text: |-
      faciliteit om het nummer van het opgeroepen netwerkaansluitpunt dan wel het nummer waarmee een individuele
      gebruiker kan worden geïdentificeerd aan het oproepende netwerkaansluitpunt te verstrekken, voordat de verbinding
      tot stand wordt gebracht;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel1.1
  - number: 1.1.v
    text: |-
      in de handel brengen: het voor de eerste maal afleveren na vervaardiging in de Europese Economische Ruimte, het
      invoeren in de Europese Economische Ruimte uit een land daarbuiten, alsmede het in gebruik nemen na vervaardiging
      of invoer uit een land buiten de Europese Economische Ruimte in de Europese Economische Ruimte;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel1.1
  - number: 1.1.w
    text: |-
      apparaten: alle elektrische en elektronische apparaten alsmede uitrustingen en installaties, die elektrische of
      elektronische componenten bevatten;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel1.1
  - number: 1.1.x
    text: 'randapparaten:'
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel1.1
  - number: 1.1.x.1°
    text: 'apparaten die bestemd zijn om op een openbaar telecommunicatienetwerk te worden aangesloten, zodanig dat zij:'
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel1.1
  - number: 1.1.x.1°.a
    text: rechtstreeks op netwerkaansluitpunten kunnen worden aangesloten, of
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel1.1
  - number: 1.1.x.1°.b
    text: |-
      kunnen dienen voor interactie met een openbaar telecommunicatienetwerk via directe of indirecte aansluiting op
      netwerkaansluitpunten ten behoeve van de overbrenging, verwerking of ontvangst van informatie;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel1.1
  - number: 1.1.x.2°
    text: radiozendapparaten die geschikt zijn om op een openbaar telecommunicatienetwerk te worden aangesloten;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel1.1
  - number: 1.1.x.3°
    text: |-
      apparaten voor satellietgrondstations tenzij bij of krachtens [hoofdstuk 10][ref1] anders is bepaald, doch met
      uitsluiting van speciaal geconstrueerde apparatuur die bedoeld is voor gebruik als onderdeel van een openbaar
      telecommunicatienetwerk;


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk10
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0009950
        hoofdstuk: '10'
  - number: 1.1.ij
    text: |-
      radiozendapparaten: apparaten die naar hun aard bestemd zijn voor het zenden of het zenden en ontvangen van
      radiocommunicatiesignalen;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel1.1
  - number: 1.1.z
    text: |-
      elektromagnetische compatibiliteit: eigenschap van apparaten, om op bevredigende wijze in hun elektromagnetische
      omgeving te kunnen functioneren zonder zelf elektromagnetische storingen te veroorzaken die ontoelaatbaar zijn voor
      alles wat zich in die omgeving bevindt;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel1.1
  - number: 1.1.aa
    text: |-
      systeem voor voorwaardelijke toegang: een systeem met behulp waarvan toegang verkregen kan worden tot gecodeerde
      programma's of andere diensten die slechts gedecodeerd kunnen worden ontvangen met behulp van een daartoe bestemd
      apparaat door degene die een daartoe strekkende overeenkomst met de aanbieder van het systeem heeft gesloten;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel1.1
  - number: 1.1.bb
    text: |-
      Internationaal Telecommunicatieverdrag: het op 22 december 1992 te Genève tot stand gekomen Statuut en Verdrag
      van de Internationale Unie voor Telecommunicatie met de daarbij behorende bijlagen en reglementen (Trb. 1993,
      138) en de op 14 oktober 1994 te Kyoto tot stand gekomen Akten van wijziging van het Statuut en het Verdrag van de
      Internationale Unie voor Telecommunicatie (Trb. 1995, 201).
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel1.1
  - number: 1.2.1
    text: |-
      De bepalingen vastgesteld bij of krachtens deze wet gelden mede op en met betrekking tot installaties ter zee in de
      zin van de [Wet installaties Noordzee][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002467
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel1.2
    references:
      - id: ref1
        bwb_id: BWBR0002467
  - number: 1.2.2
    text: |-
      Het eerste lid vindt geen toepassing ten aanzien van het gebruik van elektromagnetische golven ten dienste van een
      opsporingsonderzoek of het winnen van delfstoffen als bedoeld in de [Mijnwet continentaal plat][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002504
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel1.2
    references:
      - id: ref1
        bwb_id: BWBR0002504
  - number: 2.1.1
    text: |-
      Voor het aanleggen of aanbieden van een openbaar telecommunicatienetwerk, huurlijnen of een omroepnetwerk, dan
      wel voor het aanbieden van een openbare telecommunicatiedienst of een systeem voor voorwaardelijke toegang is
      een registratie door het college vereist. Het college is bevoegd te bepalen welke gegevens bij de aanvraag om
      een registratie dienen te worden overgelegd, met dien verstande dat het college slechts die gegevens verzamelt
      die nodig zijn voor een goede uitvoering van deze wet. Tot deze gegevens behoren in elk geval de door het college
      aan Onze Minister ter beschikking te stellen gegevens die van belang zijn voor de veiligheid van de staat, de
      strafrechtelijke handhaving van de rechtsorde en de voorbereiding op buitengewone omstandigheden. Het college is
      verantwoordelijke in de zin van [artikel 1, onderdeel d, van de Wet bescherming persoonsgegevens][ref1] voor de
      gegevensverzameling.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel1
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '1'
  - number: 2.1.2
    text: 'Geen registratie is vereist voor inrichtingen of diensten:'
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel2.1
  - number: 2.1.2.a
    text: waarvoor bij of krachtens deze wet een vergunning is vereist;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel2.1
  - number: 2.1.2.b
    text: |-
      die behoren tot bij algemene maatregel van bestuur aangewezen categorie van diensten of van inrichtingen van
      geringe omvang of betekenis.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel2.1
  - number: 2.2.1
    text: |-
      Het college weigert een registratie indien de gevraagde registratie geen betrekking heeft op een openbaar
      telecommunicatienetwerk, huurlijnen, een omroepnetwerk, een openbare telecommunicatiedienst of een systeem voor
      voorwaardelijke toegang.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel2.2
  - number: 2.2.2
    text: |-
      Het college kan een registratie weigeren indien de gevraagde gegevens niet, onvolledig of niet juist zijn
      verstrekt.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel2.2
  - number: 2.2.3
    text: 'Een registratie wordt gewijzigd of beëindigd:'
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel2.2
  - number: 2.2.3.a
    text: op verzoek van de geregistreerde;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel2.2
  - number: 2.2.3.b
    text: indien blijkt dat de gegevens niet of niet langer juist zijn;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel2.2
  - number: 2.2.3.c
    text: indien de grond voor registratie is vervallen;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel2.2
  - number: 2.2.3.d
    text: wegens het verrichten van activiteiten of diensten in strijd met het bepaalde bij of krachtens deze wet, of
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel2.2
  - number: 2.2.3.e
    text: |-
      op aanwijzing van Onze Minister in het belang van de veiligheid van de staat of de strafrechtelijke handhaving van
      de rechtsorde.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel2.2
  - number: 2.2.4
    text: |-
      Er is in het belang van de goede uitvoering van deze wet een register van de registraties. Het college is
      verantwoordelijke in de zin van [artikel 1, onderdeel d, van de Wet bescherming persoonsgegevens][ref1] voor het
      register. Het register ligt voor eenieder kosteloos ter inzage op een door het college te bepalen plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel1
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '1'
  - number: '2.3'
    text: De geregistreerde geeft aan het college onverwijld alle wijzigingen door die van invloed zijn op de registratie.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel2.3
  - number: 3.1.1
    text: |-
      Onze Minister stelt, in overeenstemming met het gevoelen van de ministerraad een frequentieplan vast, dat in ieder
      geval de verdeling van frequentieruimte over te onderscheiden bestemmingen alsmede over categorieën van gebruik
      bevat. Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld ten aanzien van de inrichting van
      het frequentieplan.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.1
  - number: 3.1.2
    text: |-
      Op de voorbereiding van het frequentieplan is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 3.1.3
    text: |-
      Onze Minister maakt de vaststelling van het plan bekend door plaatsing in de Staatscourant. Hierbij wordt
      aangegeven op welke wijze kennis kan worden gekregen van de inhoud van het plan.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.1
  - number: 3.2.1
    text: |-
      Door Onze Minister wordt een frequentieregister bijgehouden, dat een overzicht bevat van frequentieruimtes waarvoor
      krachtens dit hoofdstuk vergunningen zijn verleend, alsmede van de duur waarvoor deze vergunningen gelden.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.2
  - number: 3.2.2
    text: Het register ligt voor eenieder kosteloos ter inzage op een door Onze Minister te bepalen plaats.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.2
  - number: 3.3.1
    text: |-
      Voor het gebruik van frequentieruimte is een vergunning vereist van Onze Minister welke op aanvraag kan worden
      verleend.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.3
  - number: 3.3.2
    text: |-
      Vergunningen voor het gebruik van frequentieruimte ten behoeve van de uitvoering van vitale overheidstaken, van het
      verzorgen van taken op het terrein van de publieke omroep bedoeld in [artikel 1, onder t, van de Mediawet][ref1],
      of ter uitvoering van een wettelijk voorschrift worden bij voorrang verleend. Onverminderd het derde
      lid bepaalt Onze Minister, in overeenstemming met het gevoelen van de ministerraad, in hoeverre en in
      welke omvang vergunningen voor het gebruik van frequentieruimte anders dan voor de uitvoering van de in
      [artikel 13c, eerste lid, van de Mediawet][ref2], genoemde taak van de publieke omroep bij voorrang worden
      verleend. Bij regeling van Onze Minister, in overeenstemming met Onze Minister van Onderwijs, Cultuur
      en Wetenschappen, wordt bij de vaststelling van de omvang van de frequentieruimte die aan de publieke
      omroepinstellingen bij voorrang bij vergunning wordt verleend, bepaald welke technische eigenschappen de
      uitzendingen van de programma's van de publieke omroepinstellingen dienen te hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel13c
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: 13c
  - number: 3.3.3
    text: |-
      Bij het verlenen van vergunningen voor het gebruik van frequentieruimte op het terrein van de publieke omroep wordt
      het navolgende in acht genomen:
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.3
  - number: 3.3.3.a
    text: |-
      voor ieder programmanet als bedoeld in [artikel 40, eerste en derde lid van de Mediawet][ref1], wordt ten minste
      een vergunning verleend op zodanige wijze dat een landelijk bereik van het programma mogelijk is en rekening wordt
      gehouden met [artikel 16 van de Mediawet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel16
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '40'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: '16'
  - number: 3.3.3.b
    text: |-
      voor iedere provincie wordt ten minste één vergunning voor het gebruik van frequentieruimte verleend ten behoeve
      van de uitzending van het radioprogramma, bedoeld in [artikel 1, onder j, van de Mediawet][ref1], van de instelling
      die ten behoeve van de desbetreffende provincie zendtijd voor regionale omroep heeft verkregen, op zodanige wijze,
      dat een provinciaal bereik van het programma mogelijk is;


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel1
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '1'
  - number: 3.3.3.c
    text: |-
      indien in een provincie aan twee of meer regionale omroepinstellingen op grond van de [Mediawet][ref1] zendtijd
      is toegewezen, zal, onverminderd [artikel 3.6][ref2], aan elk van de omroepinstellingen vergunning voor het
      gebruik van frequentieruimte worden verleend voor een bereik dat ten minste gelijk is aan de onderscheidene
      verzorgingsgebieden, voorzover dit technisch mogelijk is;


      [ref1]: https://wetten.overheid.nl/BWBR0004149
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0004149
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.3.3.d
    text: |-
      aan iedere instelling die op grond van de [Mediawet][ref1] voor lokale omroep zendtijd heeft verkregen, zal,
      onverminderd [artikel 3.6][ref2], ten behoeve van de uitzending van haar radioprogramma vergunning voor het gebruik
      van frequentieruimte worden verleend voor een bereik dat ten minste gelijk is aan het verzorgingsgebied van het
      programma, voorzover dit technisch mogelijk is, en een doelmatig gebruik van het frequentiespectrum zich daartegen
      niet verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0004149
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0004149
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.3.4
    text: 'De verlening van vergunningen in andere gevallen dan bedoeld in het tweede lid geschiedt:'
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.3
  - number: 3.3.4.a
    text: op volgorde van binnenkomst van de aanvragen;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.3
  - number: 3.3.4.b
    text: door middel van een vergelijkende toets, al dan niet met inbegrip van een financieel bod, of
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.3
  - number: 3.3.4.c
    text: door middel van een veiling.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.3
  - number: 3.3.5
    text: |-
      De keuze voor toepassing van een van de procedures, bedoeld in het vierde lid, geschiedt door Onze Minister, met
      dien verstande dat voorzover het de verlening van vergunningen voor het gebruik van frequentieruimte door of ten
      behoeve van commerciële omroepinstellingen als bedoeld in [artikel 1, onder dd, van de Mediawet][ref1] betreft, de
      keuze geschiedt door Onze Minister in overeenstemming met Onze Minister van Onderwijs, Cultuur en Wetenschappen.
      Daarbij wordt, met inachtneming van het frequentieplan en het beginsel van non-discriminatie, tevens nader de
      bestemming van de frequentieruimte bepaald waarop de keuze betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel1
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '1'
  - number: 3.3.6
    text: |-
      Voorzover de in het vijfde lid bedoelde keuze betrekking heeft op het al dan niet toepassen van het financiële
      bod bij de toepassing van de vergelijkende toets, geschiedt deze tevens in overeenstemming met Onze Minister van
      Financiën.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.3
  - number: 3.3.7
    text: |-
      Nadat op grond van een op basis van het vijfde en zesde lid gemaakte keuze een vergunning voor een bepaalde
      bestemming is verleend, wordt, zolang er in die bestemming nog houders van vergunningen voor het gebruik van
      frequentieruimte zijn, bij elke volgende uitgifte van frequentieruimte voor die bestemming een vergelijkbare
      procedure toegepast, tenzij dit ten gevolge van gewijzigde omstandigheden betreffende het gebruik van die
      frequentieruimte niet langer leidt tot een optimaal gebruik van frequentieruimte.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.3
  - number: 3.3.8
    text: |-
      De uitvoering van de procedure, bedoeld in het vierde lid, onder b, geschiedt indien het de verlening van
      vergunningen voor het gebruik van frequentieruimte door of ten behoeve van commerciële omroepinstellingen betreft,
      door Onze Minister van Onderwijs, Cultuur en Wetenschappen in overeenstemming met Onze Minister.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.3
  - number: 3.3.9
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden, met inachtneming van [Richtlijn nr. 97/13/EG](onbekend) van
      het Europees Parlement en de Raad van de Europese Unie van 10 april 1997 betreffende een gemeenschappelijk kader
      voor algemene machtigingen en individuele vergunningen op het gebied van telecommunicatiediensten (PbEG L 117),
      regels gesteld terzake van de verlening, wijziging en verlenging van vergunningen. Deze regels hebben in ieder
      geval betrekking op:
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.3
  - number: 3.3.9.a
    text: |-
      de eisen die, voorafgaande aan een van de procedures, bedoeld in het vierde lid, aan een aanvrager worden gesteld
      om in aanmerking te komen voor een vergunning,
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.3
  - number: 3.3.9.b
    text: de toepassing en uitvoering van de procedures, bedoeld in het vierde lid, en
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.3
  - number: 3.3.9.c
    text: de criteria die worden toegepast bij een vergelijkende toets als bedoeld in het vierde lid, onder b.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.3
  - number: 3.3.10
    text: |-
      De vergunning wordt verleend voor een bij die vergunning te bepalen termijn. De vergunning kan worden verlengd met
      een door Onze Minister te bepalen termijn.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.3
  - number: 3.3a.1
    text: |-
      Teneinde een optimaal gebruik van frequentieruimte te waarborgen kan, in overeenstemming met Onze Minister van
      Financiën, en waar het betreft het gebruik van frequentieruimte door commerciële omroepinstellingen mede in
      overeenstemming met Onze Minister van Onderwijs, Cultuur en Wetenschappen, met inachtneming van [richtlijn nr.
      97/13/EG](onbekend) van het Europese Parlement en de Raad van de Europese Unie van 10 april 1997 (pbEG L117)
      betreffende een gemeenschappelijk kader voor algemene machtigingen en individuele vergunningen op het gebied van
      telecommunicatiediensten, bij ministeriële regeling worden bepaald dat de verkrijger of houder van een vergunning,
      de houder van een vergunning van wie de vergunning wordt of is verlengd hieronder begrepen, anders dan een
      vergunning als bedoeld in [artikel 3.3, tweede lid][ref1], voor het gebruik van frequentieruimte voor een op grond
      van [artikel 3.3, vijfde lid][ref2], bepaalde bestemming een eenmalig of periodiek bedrag verschuldigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.3a
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.3a.2
    text: 'De hoogte van het te betalen bedrag is bij:'
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.3a
  - number: 3.3a.2.a
    text: |-
      een eenmalig bedrag gelijk aan een bij de in het eerste lid bedoelde ministeriële regeling vast te stellen bedrag
      gerelateerd aan de in het jaar van vergunningverlening bepaalde contante waarde van de gedurende de looptijd van
      de vergunning uit de exploitatie van de vergunning te verwachten voordelen, dan wel de gedurende de looptijd van de
      vergunning uit de exploitatie van de vergunning te verwachten omzet,
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.3a
  - number: 3.3a.2.b
    text: |-
      een periodiek bedrag gelijk aan een bij de in het eerste lid bedoelde ministeriële regeling te bepalen percentage
      van de in een boekjaar behaalde voordelen die, onder welke naam dan ook, worden verkregen uit de exploitatie van de
      toegekende vergunning, dan wel een bij de ministeriële regeling te bepalen percentage van de in een boekjaar aan de
      exploitatie van de vergunning toe te rekenen omzet.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.3a
  - number: 3.3a.3
    text: |-
      De in het eerste lid bedoelde ministeriële regeling kan nadere regels bevatten over de wijze waarop de in het
      tweede lid, onder a en b, bedoelde voordelen uit de exploitatie van de vergunning of de uit de exploitatie van de
      vergunning te verwachten omzet worden bepaald.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.3a
  - number: 3.3a.4
    text: |-
      De verplichting tot het betalen van een eenmalig of periodiek bedrag bestaat slechts indien de in het eerste lid
      bedoelde ministeriële regeling in werking is getreden voor het tijdstip dat in de aanvraagprocedure is vastgesteld
      als het tijdstip waarop de aanvraag voor de vergunning kan worden ingediend, dan wel, indien het een vergunning
      betreft die wordt verleend op de in [artikel 3.3, vierde lid, onder a][ref1], bedoelde wijze, in werking is
      getreden op het moment dat de aanvraag is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.3a
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.3a.5
    text: |-
      Bij een verlenging van een vergunning voor het gebruik van frequentieruimte kan, in afwijking van het vierde lid,
      in het geval de aanvraag tot verlenging wordt gedaan op een tijdstip waarop Onze Minister het voornemen heeft
      binnen dezelfde bestemming vergunningen te gaan verlenen door middel van een veiling dan wel een vergelijkende
      toets met een financieel bod, de verplichting tot het betalen van een eenmalig of periodiek bedrag ook bestaan
      indien de in het eerste lid bedoelde ministeriële regeling in werking is getreden op een tijdstip gelegen na het
      tijdstip waarop de aanvraag tot verlenging is gedaan, mits:
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.3a
  - number: 3.3a.5.a
    text: |-
      de aanvrager alvorens het besluit tot verlenging wordt genomen wordt gewezen op het bestaan van het bedoelde
      voornemen tot vergunningverlening,
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.3a
  - number: 3.3a.5.b
    text: |-
      het tijdstip van inwerkingtreding van bedoelde ministeriële regeling ligt binnen vier weken na de dag waarop de
      verlening van vergunningen ten gevolge van de veiling dan wel de vergelijkende toets, heeft plaatsgevonden, en
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.3a
  - number: 3.3a.5.c
    text: |-
      de verlening van vergunningen ten gevolge van de veiling dan wel de vergelijkende toets, heeft plaatsgevonden
      binnen een jaar nadat de vergunning is verlengd.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.3a
  - number: 3.3a.6
    text: |-
      In het geval bedoeld in het vijfde lid kan in de in het eerste lid bedoelde ministeriële regeling een onderscheid
      gemaakt worden tussen de houders van een vergunning voor het gebruik van frequentieruimte van wie de vergunning
      reeds een of meerdere malen is verlengd en de houders van een vergunning waarbij dit niet het geval is. Een
      dergelijk onderscheid kan slechts gemaakt worden indien dit nodig is om beide categorieën vergunninghouders voor
      wat betreft de op hen bij of krachtens deze wet voor het gebruik van de frequentieruimte rustende financiële
      verplichtingen in een vergelijkbare positie te brengen.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.3a
  - number: 3.3a.7
    text: |-
      Een verplichting tot betaling van een eenmalig of periodiek bedrag voortvloeiend uit een ministeriële regeling
      die, met gebruikmaking van het vijfde lid, inwerking treedt nadat de vergunning is verlengd bestaat niet indien de
      verlengde vergunning op verzoek wordt ingetrokken, mits het verzoek gedaan is binnen vier weken na inwerkingtreding
      van voornoemde ministeriële regeling.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.3a
  - number: 3.3a.8
    text: 'In het geval dat:'
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.3a
  - number: 3.3a.8.a
    text: |-
      op grond van het eerste lid bij ministeriële regeling is bepaald dat voor het gebruik van frequentieruimte met een
      op grond van [artikel 3.3, vijfde lid][ref1], bepaalde bestemming een eenmalig of periodiek bedrag verschuldigd is,
      zal, zolang er in die bestemming nog houders van vergunningen voor het gebruik van frequentieruimte zijn, houders
      van vergunningen van wie de vergunning is verlengd uitgezonderd, bij elke volgende uitgifte van frequentieruimte
      met die bestemming op een vergelijkbare wijze voor het gebruik van de frequentieruimte een bedrag verschuldigd
      zijn, tenzij dit ten gevolge van gewijzigde omstandigheden betreffende het gebruik van die frequentieruimte niet
      langer leidt tot een optimaal gebruik van frequentieruimte;


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.3a
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.3a.8.b
    text: |-
      voor het gebruik van frequentieruimte met een op grond van [artikel 3.3, vijfde lid][ref1], bepaalde
      bestemming geen gebruik wordt gemaakt van de in het eerste lid geboden mogelijkheid om voor het gebruik van die
      frequentieruimte een eenmalig of periodiek bedrag te vragen wordt, zolang er in die bestemming nog houders van
      vergunningen voor het gebruik van frequentieruimte zijn, houders van vergunningen van wie de vergunning is verlengd
      uitgezonderd, ook bij elke volgende uitgifte met die bestemming van die mogelijkheid geen gebruik gemaakt, tenzij
      dit ten gevolge van gewijzigde omstandigheden betreffende het gebruik van die frequentieruimte niet langer leidt
      tot een optimaal gebruik van frequentieruimte.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.3a
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.3a.9
    text: |-
      Bij de in het eerste lid bedoelde ministeriële regeling kan worden bepaald dat het bedrag verschuldigd uit hoofde
      van een veiling of een vergelijkende toets met de mogelijkheid tot een financieel bod, vermeerderd met een op grond
      van die regeling verschuldigd eenmalig of periodiek bedrag een bepaalde hoogte niet te boven zal gaan.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.3a
  - number: 3.3a.10
    text: |-
      In geval toepassing wordt gegeven aan het bepaalde in het negende lid en de verlening van een vergunning
      plaatsvindt door middel van een veiling, wordt, indien meer dan één geldig bod wordt uitgebracht dat bij verlening
      van de vergunning zou leiden tot financiële verplichtingen gelijk aan of groter dan de op grond van het negende lid
      bij ministeriële regeling bepaalde hoogte, het tot vergunningverlening leidende bod uit deze biedingen bepaald door
      middel van het lot.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.3a
  - number: 3.4.1
    text: |-
      In afwijking van [artikel 3.3][ref1] is geen vergunning vereist voor gebruik van in het frequentieplan aangewezen
      frequentieruimte die:


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.4.1.a
    text: |-
      al dan niet tezamen met bij ministeriële regeling aan te wijzen categorieën van radiozendapparaten voor een in het
      frequentieplan aangegeven bestemming door eenieder mag worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.4
  - number: 3.4.1.b
    text: |-
      tot gebruik strekt van door Onze Minister aan te wijzen overheidsorganen, belast met de zorg voor de veiligheid van
      de staat, de defensie alsmede de handhaving van de rechtsorde.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.4
  - number: 3.4.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld terzake van het gebruik van de aangewezen
      frequentieruimte, bedoeld in het eerste lid, alsmede terzake van de aanwijzing, bedoeld in het eerste lid,
      onderdeel a.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.4
  - number: 3.5.1
    text: |-
      Een vergunning kan in het belang van een goede verdeling van frequentieruimte, alsmede in het belang van een
      ordelijk en doelmatig gebruik van frequentieruimte onder beperkingen worden verleend. In die belangen kunnen aan
      een vergunning voorschriften worden verbonden. Indien de frequentieruimte moet worden gebruikt voor het aanbieden
      van openbare telecommunicatienetwerken of openbare telecommunicatiediensten stelt Onze Minister het college in de
      gelegenheid hem advies uit te brengen ter zake van de omvang van de vergunning alsmede de beperkingen waaronder de
      vergunning wordt verleend en de voorschriften die aan de vergunning worden verbonden.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.5
  - number: 3.5.2
    text: |-
      Onverminderd het eerste lid kan bij een vergunning worden voorgeschreven dat de frequentieruimte waarop de
      vergunning ziet moet worden gebruikt voor de verzorging voor het publiek van bij de vergunning aan te wijzen
      diensten. In dat geval kunnen de in het eerste lid bedoelde beperkingen en voorschriften tevens zien op het belang
      van een goede dienstverlening.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.5
  - number: 3.5.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld terzake van de beperkingen waaronder
      een vergunning kan worden verleend en de voorschriften die op grond van het eerste of tweede lid aan een vergunning
      kunnen worden verbonden.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.5
  - number: 3.5.4
    text: |-
      In het geval frequentieruimte moet worden gebruikt voor de verzorging voor het publiek van diensten als bedoeld in
      het tweede lid, kunnen bij of krachtens algemene maatregel van bestuur in het belang van een goede dienstverlening
      regels worden gesteld voor aanbieders van die diensten.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.5
  - number: 3.6.1
    text: 'Een vergunning wordt door Onze Minister geweigerd indien:'
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.6
  - number: 3.6.1.a
    text: verlening daarvan in strijd is met het frequentieplan;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.6
  - number: 3.6.1.b
    text: een doelmatig gebruik van het frequentiespectrum dit vordert;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.6
  - number: 3.6.1.c
    text: |-
      reeds een vergunning voor het gebruik van de in de aanvraag gevraagde frequentieruimte is verleend, tenzij gedeeld
      gebruik van frequentieruimte mogelijk is;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.6
  - number: 3.6.1.d
    text: |-
      deze is gevraagd voor het verspreiden van programma's, waarvoor geen zendtijd is verkregen op grond van de
      [Mediawet][ref1], of, voorzover toestemming is vereist krachtens de [Mediawet][ref2], deze toestemming niet is
      verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0004149
      [ref2]: https://wetten.overheid.nl/BWBR0004149
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0004149
      - id: ref2
        bwb_id: BWBR0004149
  - number: 3.6.1.e
    text: |-
      feiten of omstandigheden er naar het oordeel van Onze Minister op duiden dat de veiligheid van de staat of de
      openbare orde door het verlenen van de vergunning in gevaar kan worden gebracht, of
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.6
  - number: 3.6.1.f
    text: |-
      verlening daarvan in strijd zou zijn met de bij of krachtens deze wet, dan wel bij of krachtens de
      [artikelen 82e][ref1] of [82f van de Mediawet][ref2], gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel82e
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel82f
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 82e
      - id: ref2
        bwb_id: BWBR0004149
        artikel: 82f
  - number: 3.6.2
    text: 'Een vergunning kan door Onze Minister worden geweigerd, indien:'
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.6
  - number: 3.6.2.a
    text: |-
      een eerder verleende vergunning is ingetrokken wegens overtreding van bij of krachtens deze wet gestelde regels dan
      wel van de aan de vergunning verbonden voorschriften;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.6
  - number: 3.6.2.b
    text: |-
      de aanvrager niet heeft voldaan aan op hem rustende verplichtingen, voortvloeiend uit een eerder aan hem verleende
      vergunning;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.6
  - number: 3.6.2.c
    text: de aanvraag of de aanvrager niet voldoet aan de daarvoor bij of krachtens deze wet gestelde regels, of
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.6
  - number: 3.6.2.d
    text: |-
      door het verlenen van de vergunning aan de aanvrager de daadwerkelijke mededinging op de relevante markt in
      aanzienlijke mate zou worden beperkt, met dien verstande dat naar redelijkheid rekening wordt gehouden met
      gerechtvaardigde belangen bij het gebruik van nieuwe technologie, of
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.6
  - number: 3.6.2.e
    text: |-
      de vrees is gewettigd dat door het verlenen van een vergunning ontoelaatbare belemmeringen worden veroorzaakt door
      het gewenste signaal van radiozendapparaten in andere radiozendapparaten, ontvanginrichtingen of elektrische of
      elektronische inrichtingen.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.6
  - number: 3.7.1
    text: 'Een vergunning wordt door Onze Minister ingetrokken indien:'
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.7
  - number: 3.7.1.a
    text: de houder van de vergunning hierom verzoekt;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.7
  - number: 3.7.1.b
    text: |-
      de naleving van een bindend besluit van een instelling van de Europese Unie of de nakoming van Nederland bindende
      verdragen en besluiten van volkenrechtelijke organisaties dit vordert.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.7
  - number: 3.7.2
    text: 'Een vergunning kan door Onze Minister voorts slechts worden ingetrokken indien:'
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.7
  - number: 3.7.2.a
    text: |-
      de houder van de vergunning niet meer voldoet aan de aan hem gestelde eisen om in aanmerking te komen voor een
      vergunning;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.7
  - number: 3.7.2.b
    text: |-
      de houder van de vergunning de bij of krachtens deze wet, dan wel bij of krachtens de [artikelen 82e][ref1] of
      [82f van de Mediawet][ref2] gestelde regels dan wel de aan de vergunning verbonden voorschriften niet nakomt;


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel82e
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel82f
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 82e
      - id: ref2
        bwb_id: BWBR0004149
        artikel: 82f
  - number: 3.7.2.c
    text: een doelmatig gebruik van het frequentiespectrum dit vordert;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.7
  - number: 3.7.2.d
    text: |-
      de vrees gewettigd is dat het van kracht blijven van de vergunning ernstig gevaar zal opleveren voor de veiligheid
      van de staat of de openbare orde;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.7
  - number: 3.7.2.e
    text: de gronden waarop de vergunning is verleend zijn vervallen, of
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.7
  - number: 3.7.2.f
    text: |-
      de instandhouding van de vergunning de daadwerkelijke mededinging op de relevante markt in aanzienlijke mate zou
      beperken.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.7
  - number: 3.7.3
    text: |-
      Op de gronden, genoemd in het tweede lid, kan Onze Minister in plaats van de vergunning intrekken deze ook
      wijzigen.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.7
  - number: 3.8.1
    text: |-
      Een vergunning kan op aanvraag van de houder van die vergunning aan een ander worden overgedragen met toestemming
      van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.8
  - number: 3.8.2
    text: |-
      Een toestemming kan onder beperkingen worden verleend. Aan een toestemming kunnen voorschriften worden verbonden.
      Deze kunnen worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.8
  - number: 3.8.3
    text: |-
      [Artikel 3.6][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.9.1
    text: |-
      In de gevallen waarin samenwerking tussen vergunninghouders van frequentieruimte noodzakelijk is voor het
      kunnen gebruiken van de aan hen toegewezen frequentieruimte, sluiten de betreffende vergunninghouders binnen een
      periode van ten hoogste zes weken na verlening van de vergunning een overeenkomst betreffende de voorwaarden tot
      gezamenlijk gebruik van dat deel van de frequentieruimte.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.9
  - number: 3.9.2
    text: |-
      Indien vergunninghouders geen overeenstemming kunnen bereiken over de voorwaarden waaronder de frequentieruimte in
      gebruik zal worden genomen, kan Onze Minister op aanvraag van één of meer van hen, de regels vaststellen die tussen
      hen zullen gelden.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.9
  - number: 3.9.3
    text: |-
      Elke vergunninghouder stelt aan Onze Minister binnen twee weken na de datum van de aanvraag de gegevens ter
      beschikking die deze nodig heeft ten behoeve van de voorbereiding van het besluit.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.9
  - number: 3.9.4
    text: Onze Minister beslist binnen twaalf weken na de datum van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.9
  - number: 3.9.5
    text: |-
      Op aanvraag van de gezamenlijke vergunninghouders kan Onze Minister een besluit als bedoeld in het tweede lid
      intrekken.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.9
  - number: 3.10.1
    text: |-
      Onze Minister kan, in overeenstemming met Onze Minister van Justitie, toestemming geven tot een gebruik van de
      frequentieruimte dat afwijkt van het bepaalde bij of krachtens dit hoofdstuk, wanneer dit noodzakelijk is ter
      beëindiging van strafbaar gedrag jegens een persoon.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.10
  - number: 3.10.2
    text: |-
      Onze Minister kan, in overeenstemming met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties
      onderscheidenlijk Onze Minister van Defensie, toestemming geven tot een gebruik van de frequentieruimte dat afwijkt
      van het bepaalde bij of krachtens dit hoofdstuk, wanneer dit noodzakelijk is ter uitvoering van de aan de Algemene
      Inlichtingen- en Veiligheidsdienst onderscheidenlijk Militaire Inlichtingen- en Veiligheidsdienst opgedragen taken
      in de [Wet op de inlichtingen- en veiligheidsdiensten 2002][ref1]. De [Algemene wet bestuursrecht][ref2] is niet
      van toepassing op de voorbereiding, totstandkoming en tenuitvoerlegging van een besluit als bedoeld in de eerste
      volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0013409
      [ref2]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0013409
      - id: ref2
        bwb_id: BWBR0005537
  - number: 3.10.3
    text: |-
      In overeenstemming met Onze Minister van Justitie onderscheidenlijk Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties, kan bij ministeriële regeling van het toestemmingsvereiste, bedoeld in het eerste of tweede
      lid, vrijstelling worden verleend onder bij die regeling te stellen voorschriften.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.10
  - number: 3.10.4
    text: |-
      In afwijking van het eerste lid is gebruik van frequentieruimte dat afwijkt van het bepaalde bij of krachtens
      dit hoofdstuk eveneens mogelijk wanneer dit nodig is teneinde toepassing te kunnen geven aan de strafvorderlijke
      bevoegdheden tot het onderzoek van telecommunicatie, mits:
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.10
  - number: 3.10.4.a
    text: |-
      dit gebruik plaatsvindt met behulp van apparatuur die voldoet aan bij algemene maatregel van bestuur te stellen
      eisen en door bij algemene maatregel van bestuur aan te wijzen ambtenaren;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.10
  - number: 3.10.4.b
    text: daartoe een last wordt verstrekt door een tot het onderzoek van telecommunicatie bevoegde autoriteit, en
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.10
  - number: 3.10.4.c
    text: |-
      dit plaatsvindt met het doel de informatie, bedoeld in [artikel 13.4, eerste lid][ref1], onderscheidenlijk
      [artikel 13.4, tweede lid][ref2], te achterhalen en onverkorte toepassing van [artikel 13.4][ref3] onvoldoende het
      belang van de strafvordering dient.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel13
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '13'
        hoofdstuk: '13'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '13'
        hoofdstuk: '13'
      - id: ref3
        bwb_id: BWBR0009950
        artikel: '13'
        hoofdstuk: '13'
  - number: 3.11.1
    text: |-
      De houders van een vergunning voor het gebruik van frequentieruimte die bestemd is voor het aanbieden van openbare
      telecommunicatienetwerken of openbare telecommunicatiediensten, zijn over en weer verplicht te voldoen aan
      redelijke verzoeken tot het medegebruik van antenne-opstelpunten. Hierbij worden in ieder geval de technische
      mogelijkheden in acht genomen.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.11
  - number: 3.11.2
    text: |-
      In het geval dat voor het verlenen van medegebruik toestemming van een derde is vereist, is deze daartoe slechts
      gehouden indien het een redelijk verzoek betreft en hij:
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.11
  - number: 3.11.2.a
    text: |-
      direct of indirect een relevant economisch belang heeft in de houder, bedoeld in het eerste lid, tot wie het
      verzoek is gericht;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.11
  - number: 3.11.2.b
    text: |-
      deel uitmaakt van een groep als bedoeld in [artikel 24b van boek 2 van het Burgerlijk Wetboek][ref1] waartoe een
      andere groepsmaatschappij als bedoeld in dat artikel behoort, die een direct of indirect relevant economisch belang
      heeft in de houder van een vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.11
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
  - number: 3.11.3
    text: |-
      De houder, bedoeld in het eerste lid, en de derde die op grond van het tweede lid gehouden is toestemming te
      verlenen, stellen het medegebruik ter beschikking tegen een redelijke vergoeding.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.11
  - number: 3.11.4
    text: |-
      Indien de houders, bedoeld in het eerste lid, of de derde, die op grond van het tweede lid gehouden is toestemming
      te verlenen, onderling geen overeenstemming bereiken over het medegebruik kan het college op aanvraag van een der
      partijen de regels vaststellen die tussen hen zullen gelden.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.11
  - number: 3.11.5
    text: |-
      De houders van een vergunning voor het gebruik van frequentieruimte die is bestemd voor het verspreiden van
      programma's, alsmede degenen die in opdracht van die houders door middel van hun omroepzendernetwerk een programma
      verspreiden, zijn over en weer verplicht te voldoen aan redelijke verzoeken tot het medegebruik van antenne-
      opstelpunten, antennesystemen en antennes. Hierbij worden in ieder geval de technische mogelijkheden in acht
      genomen. Het tweede tot en met vierde lid zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.11
  - number: 3.12.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels gesteld worden met betrekking tot antenne-
      opstelpunten en tevens, voor zover het omroepzendernetwerken betreft, met betrekking tot antennesystemen en
      antennes. Hierbij kunnen aan het college taken worden opgedragen en bevoegdheden worden verleend.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.12
  - number: 3.12.2
    text: 'De in het eerste lid bedoelde regels kunnen in ieder geval betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.12
  - number: 3.12.2.a
    text: |-
      de door degene, bedoeld in [artikel 3.11, eerste of vijfde lid][ref1], te verstrekken informatie over de antenne-
      opstelpunten waarover zij beschikken;


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.12
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 3.12.2.b
    text: het reserveren van ruimte op antenne-opstelpunten voor eigen gebruik of voor medegebruik;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.12
  - number: 3.12.2.c
    text: |-
      de termijnen waarbinnen op een verzoek als bedoeld in [artikel 3.11, eerste lid][ref1], tot medegebruik van een
      antenne-opstelpunt moet worden beslist;


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.12
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 3.12.2.d
    text: |-
      de vergoeding, bedoeld in [artikel 3.11, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel3.12
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 4.1.1
    text: |-
      Onze Minister stelt, na overleg met het college, nummerplannen vast waarin in ieder geval de bestemming van de
      daarin opgenomen nummers wordt aangegeven.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel4.1
  - number: 4.1.2
    text: |-
      Op de voorbereiding van een nummerplan is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 4.1.3
    text: |-
      Van de vaststelling van een plan wordt mededeling gedaan door plaatsing in de Staatscourant. Hierbij wordt
      aangegeven op welke wijze kennis kan worden gekregen van de inhoud van het plan.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel4.1
  - number: 4.1.4
    text: |-
      Het is verboden voor een bestemming die voorkomt in een nummerplan andere nummers te gebruiken dan de nummers die
      in dat plan voor die bestemming zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel4.1
  - number: 4.2.1
    text: |-
      Nummers die in een nummerplan of in een op grond van het vijfde lid vastgestelde aanwijzing zijn opgenomen kunnen
      op aanvraag door het college worden toegekend aan:
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel4.2
  - number: 4.2.1.a
    text: |-
      een aanbieder van een openbaar telecommunicatienetwerk ten behoeve van het over zijn telecommunicatienetwerk
      verzorgen van openbare telecommunicatiediensten,
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel4.2
  - number: 4.2.1.b
    text: een aanbieder van een openbare telecommunicatiedienst, of
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel4.2
  - number: 4.2.1.c
    text: een natuurlijke persoon of rechtspersoon die een openbare telecommunicatiedienst gebruikt.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel4.2
  - number: 4.2.2
    text: Op een aanvraag om toekenning van nummers wordt binnen zes weken beslist.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel4.2
  - number: 4.2.3
    text: |-
      In het belang van een doelmatige toekenning van nummers kan bij ministeriële regeling worden bepaald dat nummers
      voor een bij die regeling aangewezen bestemming of categorie van gevallen, slechts kunnen worden toegekend aan één,
      onderscheidenlijk twee, van de in het eerste lid, onder a tot en met c, bedoelde categorieën van aanvragers.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel4.2
  - number: 4.2.4
    text: |-
      Een toekenning van nummers kan in het belang van een doelmatige toekenning onder beperkingen worden verleend. In
      dat belang kunnen aan een toekenning voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel4.2
  - number: 4.2.5
    text: |-
      Gedurende de voorbereiding van een nummerplan kan het college, in overeenstemming met door Onze Minister aan
      te wijzen bestemmingen en de daarbij behorende nummers, nummers toekennen gedurende een bij dat besluit vast te
      stellen termijn. Het verbod van [artikel 4.1, vierde lid][ref1], is van overeenkomstige toepassing op de door Onze
      Minister aangewezen nummers.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel4
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.2.6
    text: |-
      In het geval er meerdere aanvragen om toekenning van nummers voor eenzelfde bestemming bij het college ter
      behandeling voorliggen en bij die aanvragen een gelijke voorkeur wordt uitgesproken voor toekenning van een bepaald
      nummer, dan wel bepaalde nummers kan het college besluiten de aanvragen om toekenning van die nummers verder te
      behandelen volgens een procedure van veiling, dan wel besluiten op die aanvragen te beslissen door middel van het
      lot. In het geval van veiling komt de opbrengst ervan toe aan de staat.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel4.2
  - number: 4.2.7
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de in het zesde lid
      bedoelde procedures. Hierbij kan ten aanzien van de procedure van veiling, met inachtneming van [Richtlijn nr.
      97/13/EG](onbekend) van het Europees Parlement en de Raad van de Europese Unie van 10 april 1997 betreffende
      een gemeenschappelijk kader voor algemene machtigingen en individuele vergunningen op het gebied van
      telecommunicatiediensten, worden afgeweken van de in het tweede lid bedoelde termijn van zes weken.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel4.2
  - number: 4.2.8
    text: |-
      Het is verboden nummers door Onze Minister aangewezen overeenkomstig het vijfde lid, alsmede nummers voorkomende
      in een nummerplan te gebruiken voor de in de aanwijzing onderscheidenlijk in een nummerplan opgenomen bestemming
      zonder of in afwijking van een toekenning.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel4.2
  - number: 4.3.1
    text: 'Een toekenning wordt geweigerd, indien:'
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel4.3
  - number: 4.3.1.a
    text: |-
      de aanvrager niet behoort tot een van de categorieën, genoemd in [artikel 4.2, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel4
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.3.1.b
    text: |-
      de toekenning in strijd is met het desbetreffende nummerplan of een op grond van [artikel 4.2, vijfde lid][ref1],
      vastgestelde aanwijzing;


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel4
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.3.1.c
    text: |-
      redelijkerwijs is te verwachten dat door de aanvrager niet zal of kan worden voldaan aan het bij of krachtens deze
      wet met betrekking tot nummers bepaalde;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel4.3
  - number: 4.3.1.d
    text: |-
      de aanvrager een nummer aanvraagt, behorende tot de in [artikel 4.11, eerste lid][ref1], bedoelde categorieën van
      nummers, en niet bereid is te verklaren dat hij zich zal houden aan de gedragscode, bedoeld in dat artikel;


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel4
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.3.1.e
    text: de toekenning in strijd zou zijn met de bij of krachtens deze wet gestelde regels.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel4.3
  - number: 4.3.2
    text: 'Een toekenning kan geheel of gedeeltelijk worden geweigerd, indien:'
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel4.3
  - number: 4.3.2.a
    text: |-
      op grond van de aanvraag redelijkerwijs niet is te verwachten dat het voorgenomen gebruik binnen een jaar, of
      binnen een bij ministeriële regeling voor bij die regeling aan te wijzen categorieën van nummers te bepalen kortere
      termijn, wordt verwezenlijkt;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel4.3
  - number: 4.3.2.b
    text: |-
      het in de aanvraag omschreven voorgenomen gebruik de toekenning van de gevraagde hoeveelheid nummers niet
      rechtvaardigt;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel4.3
  - number: 4.3.2.c
    text: |-
      een eerdere toekenning is ingetrokken op grond van [artikel 4.7, derde of vierde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel4
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.3.2.d
    text: |-
      uit de aanvraag blijkt dat deze wordt gedaan met de kennelijke bedoeling de bij de aanvraag gevraagde nummers te
      verhandelen.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel4.3
  - number: 4.4.1
    text: |-
      Het college kan op aanvraag nummers reserveren ten behoeve van de aanvrager voor een periode van ten hoogste drie
      jaar. De gereserveerde nummers zijn gedurende de reserveringsduur uitsluitend beschikbaar voor toekenning aan de
      desbetreffende houder van de reservering.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel4.4
  - number: 4.4.2
    text: |-
      De in het eerste lid bedoelde mogelijkheid tot reservering bestaat niet ten aanzien van de op grond van
      [artikel 4.3, tweede lid, onderdeel a][ref1], bij ministeriële regeling aangewezen nummers.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel4
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.4.3
    text: |-
      De [artikelen 4.2][ref1] en [4.3, eerste en tweede lid, onder b en c][ref2], zijn op een reservering van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel4
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '4'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.4.4
    text: |-
      Een reservering kan voorts geheel of gedeeltelijk worden geweigerd, indien op grond van de aanvraag redelijkerwijs
      niet is te verwachten dat het voorgenomen gebruik binnen drie jaar, dan wel, indien de reservering voor een kortere
      periode dan drie jaar wordt aangevraagd, binnen de door de aanvrager gevraagde periode, wordt verwezenlijkt.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel4.4
  - number: 4.4.5
    text: Het is verboden te handelen in strijd met aan een reservering verbonden voorschriften.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel4.4
  - number: 4.5.1
    text: |-
      Een toekenning of reservering kan op aanvraag van de desbetreffende houder van een nummer of houder van een
      reservering worden gewijzigd of worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel4.5
  - number: 4.5.2
    text: |-
      Een wijziging of intrekking van een reservering inhoudende een aanvraag om toekenning van een deel van de voor de
      aanvrager gereserveerde nummers, onderscheidenlijk toekenning van alle voor de aanvrager gereserveerde nummers,
      wordt slechts geweigerd indien:
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel4.5
  - number: 4.5.2.a
    text: de reservering geen betrekking heeft op het voorgenomen gebruik, of
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel4.5
  - number: 4.5.2.b
    text: |-
      naar het oordeel van het college niet aannemelijk is dat de ontwikkeling van de activiteit die ten grondslag ligt
      aan de reservering, de gevraagde toekenning noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel4.5
  - number: 4.5.3
    text: |-
      Met betrekking tot andere aanvragen om een wijziging is [artikel 4.3][ref1], of, indien het een aanvraag om
      wijziging van een reservering betreft, [artikel 4.4][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel4
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '4'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '4'
        hoofdstuk: '4'
  - number: '4.6'
    text: |-
      Het college kan op gezamenlijke aanvraag van de desbetreffende houder van een nummer of reservering en een
      derde toestaan dat de toekenning of reservering overgaat op de derde. [Artikel 4.2, vierde lid][ref1], en
      [artikel 4.3][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel4
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '4'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.7.1
    text: 'Een toekenning of reservering wordt door het college gewijzigd of ingetrokken, indien:'
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel4.7
  - number: 4.7.1.a
    text: |-
      een wijziging van het desbetreffende nummerplan daartoe noodzaakt, voorzover de houder van een nummer of de houder
      van een reservering aanspraak behoudt op toekenning dan wel reservering van hetzelfde aantal nummers;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel4.7
  - number: 4.7.1.b
    text: de redenen die ten grondslag lagen aan de toekenning of reservering zijn vervallen;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel4.7
  - number: 4.7.1.c
    text: het doelmatig gebruik van nummers in het algemeen maatschappelijk en economisch belang dit vordert.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel4.7
  - number: 4.7.2
    text: |-
      Een toekenning of reservering wordt voorts door het college gewijzigd indien dit noodzakelijk is om feitelijke
      onjuistheden van eenvoudige aard weg te nemen.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel4.7
  - number: 4.7.3
    text: |-
      Een toekenning of reservering wordt voorts door het college ingetrokken op aanwijzing van Onze Minister in het
      belang van de veiligheid van de staat.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel4.7
  - number: 4.7.4
    text: 'Een toekenning of reservering kan door het college worden ingetrokken, indien:'
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel4.7
  - number: 4.7.4.a
    text: |-
      de houder van het nummer of de houder van de reservering de bij of krachtens deze wet gestelde regels of de aan het
      betreffende besluit verbonden voorschriften niet nakomt;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel4.7
  - number: 4.7.4.b
    text: |-
      na de toekenning of reservering blijkt dat deze gedaan is met de kennelijke bedoeling de toegekende of
      gereserveerde nummers te verhandelen.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel4.7
  - number: 4.7.5
    text: |-
      Een toekenning of reservering kan voorts worden gewijzigd of ingetrokken indien de erkende instelling, bedoeld
      in [artikel 4.11, eerste lid][ref1], om intrekking vraagt nadat zij van oordeel is dat de houder van een nummer,
      behorende tot de in dat artikel bedoelde categorieën van nummers, in strijd heeft gehandeld met de daar bedoelde
      gedragscode.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel4
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.8.1
    text: |-
      In het belang van de goede uitvoering van de bij of krachtens de wet aan het college opgedragen taken en
      toegekende bevoegdheden wordt door het college een nummerregister bijgehouden dat een overzicht bevat van
      toekenningen en reserveringen. Het register bevat de vermelding van de naam van degene aan wie nummers zijn
      toegekend. Tevens wordt de duur van de reservering vermeld. Het college is verantwoordelijke in de zin van
      [artikel 1, onderdeel d, van de Wet bescherming persoonsgegevens][ref1] voor het register.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel1
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel4.8
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '1'
  - number: 4.8.3
    text: |-
      Op verzoek van de houder van een nummer wordt, indien het een natuurlijk persoon betreft en het nummer niet
      uitsluitend bedrijfsmatig wordt gebruikt, zijn naam, adres en woonplaats niet opgenomen in het deel van het
      register dat ter inzage ligt.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel4.8
  - number: 4.9.1
    text: |-
      Indien de houder van een nummer de aan hem toegekende nummers in gebruik geeft aan een ander, doet hij dit op een
      niet-discriminerende en transparante wijze met gebruikmaking van objectieve criteria.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel4.9
  - number: 4.9.2
    text: |-
      De houder van een nummer draagt er zorg voor dat het gebruik van de aan hem toegekende nummers in overeenstemming
      is met het bij of krachtens dit hoofdstuk bepaalde.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel4.9
  - number: 4.10.1
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat een aanbieder van een bij die maatregel aan te wijzen
      categorie van openbare telecommunicatiediensten verplicht is degene die op grond van een met hem gesloten
      overeenkomst die telecommunicatiedienst afneemt:
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel4.10
  - number: 4.10.1.a
    text: |-
      de mogelijkheid te bieden het in het kader van de afgenomen telecommunicatiedienst bij hem in gebruik zijnde
      nummer te blijven gebruiken indien hij er bij beëindiging van de overeenkomst voor kiest de desbetreffende
      telecommunicatiedienst voortaan van een andere aanbieder af te nemen;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel4.10
  - number: 4.10.1.b
    text: |-
      de mogelijkheid te bieden het in het kader van de afgenomen telecommunicatiedienst bij hem in gebruik zijnde nummer
      te blijven gebruiken indien hij binnen een bepaald gebied van adres verandert, of
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel4.10
  - number: 4.10.1.c
    text: |-
      de mogelijkheid te bieden het in het kader van de afgenomen telecommunicatiedienst bij hem in gebruik zijnde nummer
      te blijven gebruiken indien hij er voor kiest een andere bij die maatregel aan te wijzen telecommunicatiedienst af
      te nemen.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel4.10
  - number: 4.10.2
    text: |-
      Een aanbieder van krachtens het eerste lid aangewezen categorie van telecommunicatiediensten op wie een
      verplichting als bedoeld in dat lid, onderdeel a, rust, is, onverminderd [artikel 6.9][ref1], tevens verplicht aan
      degene met wie hij overeenkomt de desbetreffende telecommunicatiedienst te leveren de mogelijkheid te bieden het
      voorheen in het kader van die dienst bij diegene in gebruik zijnde nummer te blijven gebruiken.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.3'
  - number: 4.10.3
    text: 'Bij een verplichting opgelegd, krachtens het eerste lid, onderdeel a, gaat:'
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel4.10
  - number: 4.10.3.a
    text: |-
      in het geval het betreffende nummer is toegekend aan een aanbieder van een openbaar telecommunicatienetwerk en
      voor de betreffende openbare telecommunicatiedienst voortaan het openbare telecommunicatienetwerk van een andere
      aanbieder wordt gebruikt, de toekenning van het betreffende nummer over op die andere aanbieder van dat netwerk;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel4.10
  - number: 4.10.3.b
    text: |-
      in het geval het betreffende nummer is toegekend aan de aanbieder van de betreffende openbare
      telecommunicatiedienst, de toekenning van het betreffende nummer over op degene van wie de betreffende
      telecommunicatiedienst voortaan wordt afgenomen.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel4.10
  - number: 4.10.4
    text: |-
      Het college kan categorieën van nummers aanwijzen waarvoor geldt dat, in het geval een nummer uit die categorie na
      een overgang op grond van het derde lid niet langer in gebruik is, de toekenning van het nummer teruggaat naar de
      aanbieder aan wie het nummer op basis van een aanvraag was toegekend.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel4.10
  - number: 4.10.5
    text: |-
      Een aanbieder die een nummer behorende tot een door het college op grond van het vierde lid aangewezen categorie
      niet heeft toegekend gekregen op grond van een aanvraag doet, indien hij het nummer niet langer in gebruik heeft,
      hiervan mededeling aan het college. Na ontvangst van de in de vorige zin bedoelde mededeling stelt het college de
      aanbieder naar wie de toekenning van het nummer op grond van het vierde lid is teruggegaan hiervan op de hoogte.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel4.10
  - number: 4.10.6
    text: |-
      De in het derde lid bedoelde aanbieders stellen het college binnen een door het college te bepalen termijn en op
      een door het college te bepalen wijze op de hoogte van de toekenningen van nummers die in een door het college
      te bepalen periode op grond van het derde lid van hen op andere aanbieders zijn overgegaan, alsmede van de
      toekenningen van nummers die op grond van het derde lid van andere aanbieders op hen zijn overgegaan. Het college
      maakt de door hem bepaalde termijn, wijze en periode, bedoeld in de eerste volzin, bekend in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel4.10
  - number: 4.10.7
    text: |-
      Een aanbieder van een openbaar telecommunicatienetwerk waarover een krachtens het eerste lid aangewezen categorie
      van openbare telecommunicatiediensten wordt verzorgd, zorgt ervoor, voorzover een dergelijke verplichting niet
      reeds voortvloeit uit [artikel 6.1][ref1] of [artikel 6.9][ref2], dat zijn netwerk zodanig is ingericht dat een
      aanbieder van die dienst een krachtens het eerste lid opgelegde verplichting kan nakomen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.3'
  - number: 4.10.8
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de doorberekening
      van kosten van een krachtens het eerste lid opgelegde verplichting.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel4.10
  - number: 4.10.9
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot een krachtens het eerste lid
      opgelegde verplichting.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel4.10
  - number: 4.11.1
    text: |-
      Onze Minister kan een instelling erkennen die een gedragscode hanteert inzake de herkenbaarheid en betrouwbaarheid
      van door Onze Minister aan te wijzen categorieën van nummers en met gebruikmaking van via die nummers aangeboden
      diensten. Een erkenning kan onder beperkingen worden verleend. Aan een erkenning kunnen voorschriften worden
      verbonden. Van een erkenning wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel4.11
  - number: 4.11.2
    text: |-
      Onze Minister gaat slechts over tot erkenning van een instelling indien voldaan is aan bij of krachtens algemene
      maatregel van bestuur te stellen eisen die in ieder geval betreffen de onafhankelijkheid van de instelling, de
      objectiviteit van de door haar opgestelde gedragscode en de proportionaliteit van de door de instelling te hanteren
      sancties.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel4.11
  - number: 4.11.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan worden bepaald welke bij die maatregel aan te wijzen
      categorieën van natuurlijke personen of rechtspersonen verplicht zijn zich aan te sluiten bij de instelling.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel4.11
  - number: 4.11.4
    text: |-
      Een erkenning wordt door Onze Minister ingetrokken indien niet meer wordt voldaan aan de voorschriften of de
      regels, bedoeld in het eerste en tweede lid. Van een beschikking tot intrekking van een erkenning wordt mededeling
      gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel4.11
  - number: 5.1.1
    text: |-
      Eenieder is, behoudens [artikel 5.2][ref1] en onverminderd het in dit hoofdstuk geregelde recht
      op schadevergoeding, verplicht de aanleg en instandhouding van kabels ten dienste van een openbaar
      telecommunicatienetwerk of van een omroepnetwerk in en op openbare gronden, alsmede de opruiming daarvan, te
      gedogen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel5
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.1.2
    text: |-
      De in het eerste lid bedoelde verplichting strekt zich, behoudens [artikel 5.3][ref1] en onverminderd het in dit
      hoofdstuk geregelde recht op schadevergoeding, wat betreft interlokale en internationale kabels tevens uit tot alle
      andere gronden, uitgezonderd afgesloten tuinen en erven die met bewoonde percelen één geheel vormen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel5
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.1.3
    text: |-
      Door de aanleg, de instandhouding en de opruiming van kabels wordt geen verandering in de bestemming en zo min
      mogelijk belemmering in het gebruik van de gronden gebracht.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel5.1
  - number: 5.2.1
    text: |-
      De gemeente is belast met de coördinatie van de binnen haar grondgebied door aanbieders van openbare
      telecommunicatienetwerken of van omroepnetwerken uit te voeren werkzaamheden in verband met de aanleg en
      instandhouding van kabels, bedoeld in [artikel 5.1, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel5
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.2.2
    text: |-
      Bij deze coördinatie worden mede betrokken andere werkzaamheden en andere belangen dan waarin door deze wet
      wordt voorzien. De coördinatie mag niet leiden tot een zodanige vertraging van voorgenomen werkzaamheden dat
      redelijkerwijs niet meer kan worden gesproken van gedogen als bedoeld in [artikel 5.1, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel5
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.2.3
    text: |-
      Een aanbieder van een openbaar telecommunicatienetwerk of van een omroepnetwerk gaat slechts over tot het
      verrichten van werkzaamheden als bedoeld in het eerste lid indien deze:
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel5.2
  - number: 5.2.3.a
    text: het voornemen daartoe heeft gemeld bij burgemeester en wethouders van de desbetreffende gemeente, en
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel5.2
  - number: 5.2.3.b
    text: |-
      van burgemeester en wethouders instemming heeft verkregen omtrent tijdstip, plaats en werkwijze van uitvoering van
      de werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel5.2
  - number: 5.2.4
    text: 'De gemeenteraad stelt bij verordening in ieder geval regels vast inzake:'
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel5.2
  - number: 5.2.4.a
    text: het tijdstip, voorafgaand aan het verrichten van de werkzaamheden, waarop de melding uiterlijk moet zijn gedaan;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel5.2
  - number: 5.2.4.b
    text: de gegevens die bij de melding moeten worden verstrekt waaronder het uitvoeringsplan;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel5.2
  - number: 5.2.4.c
    text: de wijze van uitvoering bij aanleg, onderhoud, verplaatsing en opruiming en van medegebruik van voorzieningen.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel5.2
  - number: 5.2.5
    text: |-
      Burgemeester en wethouders kunnen, zonodig in afwijking van de melding, in het instemmingsbesluit het tijdstip van
      aanvang of voltooiing en de wijze van uitvoering van de werkzaamheden vaststellen.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel5.2
  - number: 5.3.1
    text: |-
      Indien de aanbieder van een openbaar telecommunicatienetwerk of van een omroepnetwerk het voornemen
      heeft werkzaamheden uit te voeren in verband met de aanleg en instandhouding van kabels, bedoeld in
      [artikel 5.1, tweede lid][ref1], streeft hij naar overeenstemming met degene op wie een gedoogplicht rust over de
      plaats en wijze van de uitvoering van het werk.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel5
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.3.2
    text: |-
      Bij gebreke van overeenstemming geeft de aanbieder van het netwerk aan degene op wie een gedoogplicht als bedoeld
      in [artikel 5.1, tweede lid][ref1], rust onverwijld een schriftelijke kennisgeving waarin een omschrijving van
      de voorgenomen plaats en de wijze van uitvoering van de werkzaamheden wordt gegeven. Indien degene op wie een
      gedoogplicht rust, tegen de kennisgeving bedenkingen heeft, kan hij na ontvangst daarvan het college verzoeken een
      beschikking te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel5
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.3.3
    text: Het college geeft de beschikking binnen acht weken na ontvangst van het verzoek.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel5.3
  - number: 5.3.4
    text: Het verzoek schorst de uitvoering van het voornemen.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel5.3
  - number: '5.4'
    text: |-
      Het recht op schadevergoeding, verband houdend met de gedoogplicht, bedoeld in [artikel 5.1][ref1], beperkt zich
      voor eigenaren en beheerders van openbare gronden tot vergoeding van de kosten van de voorzieningen en van de
      meerdere kosten van onderhoud.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel5
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel5.4
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.5.1
    text: |-
      Onverminderd [artikel 5.1][ref1] en het in dit hoofdstuk geregelde recht op schadevergoeding, is eenieder verplicht
      ten dienste van een openbaar telecommunicatienetwerk of van een omroepnetwerk te gedogen dat:


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel5
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel5.5
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.5.1.a
    text: |-
      kabels boven gronden, gebouwen en wateren worden aangelegd en instandgehouden, mits zonder aanhechting of
      aanraking;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel5.5
  - number: 5.5.1.b
    text: |-
      in en aan gebouwen, alsmede in en op gronden welke daarmee een geheel vormen, kabels en netwerkaansluitpunten
      worden aangelegd en instandgehouden ten behoeve van aansluitingen in die gebouwen en in naburige gebouwen;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel5.5
  - number: 5.5.1.c
    text: de onder a en b bedoelde kabels en netwerkaansluitpunten worden opgeruimd.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel5.5
  - number: 5.5.2
    text: |-
      Door de aanleg, de instandhouding en de opruiming van kabels wordt geen verandering teweeggebracht in de bestemming
      van hetgeen waarin, waaraan, waarop of waarboven de kabels zijn of worden aangelegd alsmede zo min mogelijk
      verandering in de uiterlijke gedaante en zo min mogelijk belemmering in het gebruik ervan.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel5.5
  - number: 5.5.3
    text: |-
      Op de aanleg van kabels ingevolge dit artikel is het bepaalde bij of krachtens de [artikelen 5.2][ref1] en
      [5.3][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel5
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel5.5
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.6.1
    text: |-
      De aanleg van kabels en netwerkaansluitpunten door de aanbieder van een openbaar telecommunicatienetwerk of van
      een omroepnetwerk in en op gronden, alsmede in en aan gebouwen van anderen brengt geen wijziging in de eigendom van
      hetgeen is aangelegd.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel5.6
  - number: 5.6.2
    text: |-
      Dit artikel is mede van toepassing op kabels en netwerkaansluitpunten aangelegd voor het tijdstip van
      inwerkingtreding van dit artikel.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel5.6
  - number: 5.7.1
    text: |-
      De aanbieder van een openbaar telecommunicatienetwerk of van een omroepnetwerk is verplicht op eigen kosten
      tot verplaatsing van kabels ten dienste van het netwerk over te gaan, indien de verplaatsing nodig is voor de
      oprichting van gebouwen of de uitvoering van werken door of vanwege degene op wie een gedoogplicht rust.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel5.7
  - number: 5.7.2
    text: |-
      In andere gevallen dan bedoeld in het eerste lid, gaat de aanbieder, bedoeld in het eerste lid, slechts over tot
      verplaatsing van kabels, indien de verzoeker hem de kosten daarvan vergoedt.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel5.7
  - number: 5.7.3
    text: |-
      Bij gebreke van overeenstemming over de kosten, bedoeld in het eerste of tweede lid, is
      [artikel 5.3, tweede en derde lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel5
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel5.7
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.8.1
    text: |-
      Rechthebbenden ten aanzien van bomen of beplantingen zijn, behoudens recht op schadevergoeding, verplicht deze op
      schriftelijk verzoek van de aanbieder van een openbaar telecommunicatienetwerk of van een omroepnetwerk binnen twee
      weken op te snoeien dan wel de wortels of takken daarvan in te korten, voorzover deze redelijkerwijs hinderlijk
      zijn of worden voor de aanleg, instandhouding en exploitatie van de in dit lid bedoelde netwerken.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel5.8
  - number: 5.8.2
    text: |-
      In geval van ernstige belemmering of storing van de telecommunicatie kan een aanbieder als bedoeld in dit artikel
      onmiddellijk tot het opsnoeien dan wel inkorten van wortels of takken overgaan, waarna deze zo spoedig mogelijk
      hiervan schriftelijk aan de rechthebbende kennis geeft.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel5.8
  - number: 5.9.1
    text: |-
      De eis tot schadevergoeding als bedoeld in de [artikelen 5.1][ref1], [5.5][ref2] en [5.8][ref3] wordt,
      onafhankelijk van hetgeen gevorderd wordt, aanhangig gemaakt bij de rechtbank van het arrondissement waarin de
      onroerende zaak waaraan schade wordt toegebracht is gelegen. De eis tot schadevergoeding wordt behandeld en beslist
      door de kantonrechter van de rechtbank.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel5
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel5.9
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.9.2
    text: |-
      Indien de onroerende zaak in meer dan een arrondissement is gelegen, wordt de eis aanhangig gemaakt bij een van de
      rechtbanken, ter keuze van de eiser.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel5.9
  - number: 5.9.3
    text: Van de uitspraak van de kantonrechter is hoger beroep toegelaten.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel5.9
  - number: 5.9.4
    text: |-
      De bepalingen van burgerlijk procesrecht zijn van toepassing op de geschillen, bedoeld in het eerste lid, voorzover
      daarvan in de voorgaande leden van dit artikel niet is afgeweken.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel5.9
  - number: 5.9.5
    text: |-
      Ook voordat omtrent de schadevergoeding overeenstemming verkregen of uitspraak gedaan is, kan tot de uitvoering van
      de in de [artikelen 5.1][ref1], [5.5][ref2] en [5.8][ref3] bedoelde werkzaamheden worden overgegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel5
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel5.9
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.10.1
    text: |-
      Aanbieders van openbare telecommunicatienetwerken en van omroepnetwerken zijn over en weer verplicht te voldoen aan
      redelijke verzoeken tot het medegebruik van voorzieningen terzake van aanleg en instandhouding van kabels. Hierbij
      worden in ieder geval de technische mogelijkheden in acht genomen.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel5.10
  - number: 5.10.2
    text: |-
      In het geval dat voor het verlenen van medegebruik toestemming van een derde is vereist, is deze daartoe slechts
      gehouden indien het een redelijk verzoek betreft.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel5.10
  - number: 5.10.3
    text: |-
      De aanbieder, bedoeld in het eerste lid, en de derde die op grond van het tweede lid gehouden is toestemming te
      verlenen, stellen het medegebruik ter beschikking tegen een redelijke vergoeding.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel5.10
  - number: 6.1.1
    text: |-
      Aanbieders van openbare telecommunicatienetwerken of openbare telecommunicatiediensten in Nederland, die daarbij
      de toegang tot netwerkaansluitpunten van eindgebruikers controleren, dragen zorg voor de interconnectie van de
      betrokken telecommunicatienetwerken teneinde te verzekeren dat de daarop aangesloten gebruikers over en weer met
      elkaar kunnen communiceren.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel6.1
  - number: 6.1.2
    text: |-
      Op verzoek van degenen die buiten Nederland openbare telecommunicatienetwerken of openbare telecommunicatiediensten
      aanbieden en daarbij de toegang tot netwerkaansluitpunten van eindgebruikers controleren, dragen de in het eerste
      lid bedoelde aanbieders tevens zorg voor de interconnectie van de betrokken telecommunicatienetwerken met de
      desbetreffende buitenlandse telecommunicatienetwerken teneinde te verzekeren dat de op de netwerken aangesloten
      gebruikers over en weer met elkaar kunnen communiceren.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel6.1
  - number: 6.1.3
    text: |-
      Het college kan ontheffing verlenen van de in het eerste en tweede lid bedoelde verplichting tot interconnectie
      indien er voor de desbetreffende interconnectie andere, technisch en commercieel haalbare mogelijkheden bestaan,
      of indien de desbetreffende interconnectie redelijkerwijs niet kan worden verlangd in het licht van de middelen die
      beschikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel6.1
  - number: 6.1.4
    text: |-
      Onverminderd het derde lid, en onverminderd eventuele verplichtingen uit hoofde van Nederland bindende verdragen
      of besluiten van volkenrechtelijke organisaties kan Onze Minister ontheffing verlenen van de in het tweede lid
      bedoelde verplichting tot interconnectie indien de naleving ervan leidt tot een verstoring van de mededinging.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel6.1
  - number: 6.1.5
    text: Het eerste, tweede, derde en vierde lid zijn van overeenkomstige toepassing op aanbieders van huurlijnen.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel6.1
  - number: 6.1.6
    text: |-
      Onverminderd het derde en vierde lid, dient ter uitvoering van het eerste, tweede en vijfde lid iedere daar
      bedoelde aanbieder met andere daar bedoelde aanbieders in onderhandeling te treden om te komen tot overeenkomsten
      op basis waarvan de interconnectie tot stand komt. In het geval de in de vorige zin bedoelde verplichting dient
      ter uitvoering van het eerste lid kan het college aanbieders bij het uitblijven van een overeenkomst een termijn
      stellen, waarbinnen deze tot stand moet zijn gekomen. Na ommekomst van deze termijn zijn betrokken aanbieders in
      gebreke, tenzij door een of meer van hen een beroep gedaan is op [artikel 6.3, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.1.7
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld inzake de tot stand te brengen
      interconnectie. Deze regels kunnen verschillend worden gesteld ten aanzien van bij die regels te onderscheiden
      categorieën van openbare telecommunicatienetwerken of openbare telecommunicatiediensten.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel6.1
  - number: 6.2.1
    text: |-
      Van overeenkomsten als bedoeld in [artikel 6.1, zesde lid][ref1], en wijzigingen daarin, wordt zo spoedig mogelijk,
      doch uiterlijk binnen een week nadat bedoelde overeenkomsten zijn gesloten, onderscheidenlijk bedoelde wijzigingen
      zijn overeengekomen, een afschrift gedeponeerd bij het college.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.2.2
    text: |-
      Indien het college van oordeel is dat een overeenkomst strijdig is met het bepaalde bij of krachtens deze wet,
      stelt het de partijen daarvan in kennis onder mededeling van de onderdelen die naar zijn oordeel wijziging
      behoeven. Zolang die wijzigingen niet zijn aangebracht, is door betrokken aanbieders niet voldaan aan
      [artikel 6.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.2.3
    text: |-
      Het college kan een afschrift van bij hem gedeponeerde overeenkomsten op verzoek aan belanghebbenden ter
      beschikking stellen, met uitzondering van naar het oordeel van het college als vertrouwelijk aan te merken
      bedrijfsgegevens.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel6.2
  - number: 6.3.1
    text: |-
      Indien aanbieders geen overeenkomst als bedoeld in [artikel 6.1, zesde lid][ref1], tot stand brengen, kan het
      college op aanvraag van een of meer van hen, de regels vaststellen die tussen hen zullen gelden. Een besluit van
      het college laat de mogelijkheid van een buitenlandse aanbieder als bedoeld in [artikel 6.1, tweede lid][ref2], om
      af te zien van de interconnectie onverlet.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.3.2
    text: |-
      Geschillen tussen bij interconnectie als bedoeld in [artikel 6.1][ref1] betrokken aanbieders met betrekking tot
      de vraag of de ter zake tussen hen in verband met interconnectie bestaande verbintenissen, of de wijze waarop deze
      worden nagekomen, strijdig zijn met het bepaalde bij of krachtens deze wet, worden op aanvraag van een of meer van
      de betrokken aanbieders door het college beslecht. In het geval het college van oordeel is dat er sprake is van
      strijd met het bepaalde bij of krachtens deze wet kan hij ter beëindiging van deze situatie regels vaststellen die
      tussen de aanbieders zullen gelden. In voorkomende gevallen treden bedoelde regels in de plaats van de tot dan toe
      bestaande verbintenissen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.3.3
    text: 'Met betrekking tot aanvragen als bedoeld in het eerste en tweede lid geldt dat het college:'
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel6.3
  - number: 6.3.3.a
    text: binnen zes maanden na de datum van de aanvraag op de aanvraag beslist;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel6.3
  - number: 6.3.3.b
    text: |-
      in spoedeisende gevallen een voorlopig besluit neemt, dat tussen de betrokken aanbieders geldt tot het definitieve
      besluit.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel6.3
  - number: 6.3.4
    text: |-
      Het college neemt geen besluit op een aanvraag als bedoeld in het eerste lid indien betrokken aanbieders voor
      het tijdstip van het nemen van het besluit overeenkomstig [artikel 6.2, eerste lid][ref1], het afschrift van een
      tussen hen totstandgekomen overeenkomst bij het college hebben gedeponeerd, welke voldoet aan het bepaalde bij
      of krachtens deze wet, dan wel, indien er sprake is van een buitenlandse aanbieder, deze voor het tijdstip van de
      uitspraak te kennen geeft af te zien van de interconnectie.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.4.1
    text: |-
      De aanbieders van vaste openbare telefoonnetwerken en vaste openbare telefoondiensten, de aanbieders van mobiele
      openbare telefoonnetwerken en mobiele openbare telefoondiensten, en de aanbieders van huurlijnen, die in het
      gebied waarin zij binnen Nederland actief zijn op de markt met betrekking tot de vaste openbare telefoonnetwerken
      of de vaste openbare telefoondienst, onderscheidenlijk op de markt met betrekking tot de mobiele openbare
      telefoonnetwerken of de mobiele openbare telefoondienst, onderscheidenlijk op de markt voor huurlijnen, beschikken
      over een aanmerkelijke macht worden als zodanig aangewezen door het college.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel6.4
  - number: 6.4.2
    text: |-
      Het college wijst tevens aanbieders van mobiele openbare telefoonnetwerken en mobiele openbare telefoondiensten aan
      die op de nationale markt met betrekking tot de vaste en mobiele openbare telefoondienst tezamen, beschikken over
      een aanmerkelijke macht.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel6.4
  - number: 6.4.3
    text: |-
      Als aanbieders met een aanmerkelijke macht op de markt als bedoeld in het eerste en tweede lid worden door het
      college aangewezen de aanbieders die op de relevante markt een aandeel hebben van meer dan vijfentwintig procent.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel6.4
  - number: 6.4.4
    text: |-
      In afwijking van het derde lid kan het college aanbieders die op de onderscheiden markten een aandeel hebben van
      minder dan vijfentwintig procent aanwijzen als aanbieders met een aanmerkelijke macht op de desbetreffende markt,
      dan wel aanbieders die op de onderscheiden markten een aandeel hebben van meer dan vijfentwintig procent niet
      aanwijzen als aanbieders met een aanmerkelijke macht op de desbetreffende markt. In beide gevallen beoordeelt het
      college daarbij het vermogen van de betreffende aanbieder om de marktvoorwaarden te beïnvloeden, zijn omzet in
      verhouding tot de omvang van de markt, zijn beheersing van de middelen van toegang tot de eindgebruikers, zijn
      toegang tot financiële middelen, en zijn ervaring met het verstrekken van producten en diensten op de markt.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel6.4
  - number: '6.5'
    text: |-
      Aanbieders, aangewezen door het college krachtens [artikel 6.4, eerste lid][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel6.5
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 6.5.a
    text: |-
      verstrekken aan andere aanbieders, die krachtens [artikel 6.1][ref1] verzoeken om interconnectie, deze onder
      gelijke voorwaarden onder gelijke omstandigheden;


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel6.5
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.5.b
    text: |-
      verstrekken aan andere aanbieders, die krachtens [artikel 6.1][ref1] verzoeken om interconnectie, deze onder
      gelijke voorwaarden als die welke onder gelijke omstandigheden gelden voor henzelf of hun dochtermaatschappijen;


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel6.5
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.5.c
    text: |-
      verstrekken aan aanbieders als bedoeld in [artikel 6.1][ref1] op aanvraag alle met betrekking tot interconnectie
      benodigde informatie alsmede de voorgenomen wijzigingen die binnen de volgende zes maanden zullen worden ingevoerd;


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel6.5
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.5.d
    text: gebruiken de aan hen verstrekte informatie uitsluitend voor het doel waarvoor deze aan hen werd verstrekt.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel6.5
  - number: 6.6.1
    text: |-
      Aanbieders van vaste openbare telefoonnetwerken, vaste openbare telefoondiensten en van huurlijnen, aangewezen door
      het college krachtens [artikel 6.4, eerste lid][ref1], alsmede aanbieders van mobiele openbare telefoondiensten en
      mobiele openbare telefoonnetwerken aangewezen door het college krachtens [artikel 6.4, tweede lid][ref2], dragen er
      zorg voor dat de tarieven voor interconnectie op transparante wijze worden bepaald en op kosten zijn georiënteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel6.6
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 6.6.2
    text: |-
      Aanbieders van vaste openbare telefoonnetwerken, vaste openbare telefoondiensten en van huurlijnen, aangewezen
      door het college krachtens [artikel 6.4, eerste lid][ref1], dragen er bovendien zorg voor dat de tarieven voor
      interconnectie in voldoende mate zijn uitgesplitst.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel6.6
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 6.6.3
    text: |-
      Ter uitvoering van het eerste lid wordt door de onderscheiden aanbieders een systeem voor de toerekening van de
      kosten voor interconnectie opgesteld. Het systeem behoeft de goedkeuring van het college.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel6.6
  - number: 6.6.4
    text: |-
      Het college dan wel een door het college aan te wijzen bevoegde derde onderzoekt jaarlijks of er in overeenstemming
      met het in het derde lid bedoelde systeem is gehandeld. Van het resultaat van het onderzoek wordt mededeling gedaan
      in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel6.6
  - number: 6.6.5
    text: |-
      Bij ministeriële regeling kunnen ten aanzien van de in het eerste en tweede lid genoemde verplichtingen nadere
      regels worden gesteld. Hierbij kunnen aan het college nadere taken worden opgedragen en bevoegdheden worden
      verleend.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel6.6
  - number: 6.7.1
    text: |-
      Aanbieders van vaste openbare telefoonnetwerken, vaste openbare telefoondiensten en aanbieders van huurlijnen,
      aangewezen door het college krachtens [artikel 6.4, eerste lid][ref1], maken een referentie-interconnectie-
      aanbieding bekend.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel6.7
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 6.7.2
    text: |-
      Een referentie-interconnectie-aanbieding omvat een omschrijving van hetgeen op het gebied van interconnectie wordt
      aangeboden, opgesplitst naar componenten, tarieven en andere daarvan deel uitmakende voorwaarden.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel6.7
  - number: 6.7.3
    text: |-
      Indien het college van oordeel is dat een referentie-interconnectie-aanbieding strijdig is met het bepaalde bij of
      krachtens deze wet stelt het college de betreffende aanbieder daarvan in kennis onder mededeling van de onderdelen
      die naar zijn oordeel wijzigingen behoeven.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel6.7
  - number: 6.8.1
    text: |-
      Aanbieders van vaste openbare telefoonnetwerken, van vaste openbare telefoondiensten en van huurlijnen, aangewezen
      door het college krachtens [artikel 6.4, eerste lid][ref1], die interconnectie bieden aan andere aanbieders, voeren
      gescheiden boekhoudingen voor hun activiteiten in verband met interconnectie en voor hun overige activiteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel6.8
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 6.8.2
    text: |-
      Bij ministeriële regeling kan worden bepaald dat het eerste lid niet van toepassing is op aanbieders waarvan de
      jaaromzet in telecommunicatieactiviteiten in de Europese Unie een bij die regeling te bepalen bedrag niet te boven
      gaat.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel6.8
  - number: 6.9.1
    text: |-
      Aanbieders, aangewezen door het college krachtens [artikel 6.4, eerste lid][ref1], voldoen aan alle redelijke
      verzoeken tot bijzondere toegang.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel6.9
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 6.9.2
    text: |-
      De [artikelen 6.2][ref1], [6.3][ref2] en [6.5][ref3] zijn van overeenkomstige toepassing, met dien verstande
      dat het in [artikel 6.5, onderdelen a en b][ref4], vastgelegde vereiste van non-discriminatie, behoudens het
      bepaalde in het derde lid, mede ziet op de ten behoeve van de totstandbrenging van interconnectie als bedoeld in
      [artikel 6.1][ref5] geboden bijzondere toegang.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0009950#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0009950#Artikel6
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel6.9
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref3
        bwb_id: BWBR0009950
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref4
        bwb_id: BWBR0009950
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref5
        bwb_id: BWBR0009950
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.9.3
    text: |-
      Onverminderd het eerste en tweede lid, is voor aanbieders van vaste openbare telefoonnetwerken of vaste
      openbare telefoondiensten die zijn aangewezen krachtens [artikel 6.4, eerste lid][ref1], [artikel 6.6][ref2]
      van overeenkomstige toepassing ten aanzien van verzoeken om bijzondere toegang gedaan door hen die in of buiten
      Nederland openbare telecommunicatiediensten aanbieden.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel6.9
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 6.9.4
    text: |-
      Onze Minister, onverminderd eventuele verplichtingen uit hoofde van Nederland bindende verdragen of besluiten
      van volkenrechtelijke organisaties, kan ontheffing verlenen van de in het eerste, tweede en derde lid
      neergelegde verplichtingen, indien de bijzondere toegang betrekking heeft op de verzorging van openbare
      telecommunicatiediensten van en naar een ander land, en de naleving van de verplichting leidt tot een verstoring
      van de mededinging.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel6.9
  - number: 6.9.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld inzake de tot stand te brengen
      bijzondere toegang. Deze regels kunnen onderscheiden zijn naar verschillende vormen van bijzondere toegang.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel6.9
  - number: 6.10.1
    text: |-
      In deze bepaling wordt verstaan onder verordening: [verordening (EG) nr. 2887/2000](onbekend) van het Europees
      Parlement en de Raad van de Europese Unie van 18 december 2000 inzake ontbundelde toegang tot het aansluitnetwerk
      (PbEG L 336/4).
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel6.10
  - number: 6.10.2
    text: Het college is de instantie bedoeld in artikel 4 van de verordening.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel6.10
  - number: 6.10.3
    text: |-
      In het kader van het toezicht op de in artikel 3, derde lid, van de verordening opgenomen verplichting tot het
      hanteren van op kosten georiënteerde tarieven voor de ontbundelde toegang tot het aansluitnetwerk en bijbehorende
      faciliteiten wordt door de aangemelde exploitant, bedoeld in artikel 2, onderdeel a, van de verordening, een
      systeem voor de toerekening van de kosten van bedoelde ontbundelde toegang tot het aansluitnetwerk en bijbehorende
      faciliteiten opgesteld. Het systeem behoeft de goedkeuring van het college.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel6.10
  - number: 6.10.4
    text: |-
      Het college dan wel een door het college aan te wijzen bevoegde derde onderzoekt jaarlijks of er in overeenstemming
      met het in het derde lid bedoelde systeem is gehandeld. Van het resultaat van het onderzoek wordt mededeling gedaan
      in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel6.10
  - number: 6.10.5
    text: |-
      [Artikel 6.2][ref1] is van overeenkomstige toepassing op overeenkomsten inzake ontbundelde toegang tot het
      aansluitnetwerk en bijbehorende faciliteiten, als bedoeld in artikel 2, onderdeel a, onderscheidenlijk artikel 2,
      onderdeel i, van de verordening, waarbij een aangemelde exploitant, als bedoeld in artikel 2, onderdeel a, van de
      verordening, partij is.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel6.10
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 7.1.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld ter uitvoering van [richtlijn nr. 90/387/
      EEG](onbekend) van de Raad van de Europese Gemeenschappen van 28 juni 1990 betreffende de totstandbrenging van de
      interne markt voor telecommunicatiediensten door middel van de tenuitvoerlegging van Open Network Provision (ONP)
      (PbEG L 192) en de daarmee samenhangende richtlijnen. Deze regels kunnen verschillen voor bij die regels te bepalen
      openbare telecommunicatienetwerken, openbare telecommunicatiediensten en huurlijnen.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel7.1
  - number: 7.1.2
    text: |-
      Bij de regels, bedoeld in het eerste lid, kunnen taken worden opgedragen en bevoegdheden worden verleend aan het
      college.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel7.1
  - number: 7.2.1
    text: |-
      Het college wijst aanbieders van huurlijnen aan op wie de regels, bedoeld in [artikel 7.1, eerste lid][ref1],
      ter uitvoering van [richtlijn nr. 92/44/EEG](onbekend) van de Raad van de Europese Gemeenschappen van 5 juni 1992
      betreffende de toepassing van Open Network Provision (ONP) op huurlijnen (PbEG L 165) van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel7
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: 7.2.2
    text: |-
      Het college wijst een aanbieder van huurlijnen, bedoeld in het eerste lid, aan voorzover die aanbieder over een
      aanmerkelijke macht op de relevante markt beschikt.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel7.2
  - number: 7.2.3
    text: |-
      Indien er geen aanbieder als bedoeld in het tweede lid is, wijst het college in ieder geval een aanbieder van
      huurlijnen aan.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel7.2
  - number: 7.3.1
    text: |-
      Voor aanbieders van huurlijnen worden de regels, bedoeld in [artikel 7.1, eerste lid][ref1], slechts gesteld
      voorzover deze zijn aangewezen op grond van [artikel 7.2][ref2]. De regels hebben in ieder geval betrekking op:


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel7
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel7.3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.1'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: 7.3.1.a
    text: de voorwaarden voor levering en gebruik;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel7.3
  - number: 7.3.1.b
    text: de capaciteit, kwaliteit en eigenschappen van het aanbod;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel7.3
  - number: 7.3.1.c
    text: |-
      de tarieven met dien verstande dat voor huurlijnen van een aanbieder van huurlijnen als bedoeld in
      [artikel 7.2, tweede lid][ref1], in het gehele land dezelfde vormen van tarifering worden gehanteerd. Het college
      kan ontheffing verlenen van deze verplichting indien er in voldoende mate sprake is van concurrentie op de
      betreffende markt;


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel7
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel7.3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: 7.3.1.d
    text: het verstrekken van informatie over het aanbod ten behoeve van gebruikers, en
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel7.3
  - number: 7.3.1.e
    text: |-
      het voeren van gescheiden boekhoudingen voor de activiteiten in verband met het aanbod van huurlijnen en voor
      overige activiteiten.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel7.3
  - number: 7.3.2
    text: |-
      Onverminderd het bepaalde bij of krachtens [hoofdstuk 6][ref1] kunnen de in [artikel 7.1, eerste lid][ref2],
      bedoelde regels ten aanzien van de aanbieders van huurlijnen, aangewezen krachtens [artikel 6.4, eerste lid][ref3],
      betrekking hebben op de toegang tot het netwerk van die aanbieders.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel6
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel7.3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.1'
      - id: ref3
        bwb_id: BWBR0009950
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 7.4.1
    text: |-
      Onverminderd het bepaalde bij of krachtens [hoofdstuk 9][ref1] hebben de in [artikel 7.1, eerste lid][ref2],
      bedoelde regels ten aanzien van de aanbieders van een vaste openbare telefoondienst of een vast openbaar
      telefoonnetwerk in ieder geval betrekking op:


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk9
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel7
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel7.4
    references:
      - id: ref1
        bwb_id: BWBR0009950
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: 7.4.1.a
    text: de voorwaarden voor levering en gebruik;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel7.4
  - number: 7.4.1.b
    text: de capaciteit, kwaliteit en eigenschappen van het aanbod;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel7.4
  - number: 7.4.1.c
    text: het verstrekken van informatie over het aanbod ten behoeve van gebruikers.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel7.4
  - number: 7.4.2
    text: |-
      De in [artikel 7.1, eerste lid][ref1], bedoelde regels ten aanzien van de aanbieders van een vast openbaar
      telefoonnetwerk of een vaste openbare telefoondienst, aangewezen krachtens [artikel 6.4, eerste lid][ref2], kunnen
      betrekking hebben op: a. de tarieven met dien verstande dat voor de vaste openbare telefoondienst in het gehele
      land dezelfde vormen van tarifering worden gehanteerd. Het college kan ontheffing verlenen van deze verplichting
      indien er in voldoende mate sprake is van concurrentie op de betreffende markt; b. het voeren van gescheiden
      boekhoudingen voor de activiteiten in verband met het aanbod van een vast openbaar telefoonnetwerk of een vaste
      openbare telefoondienst en voor overige activiteiten, en c. de levering van aanvullende faciliteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel7.4
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.1'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 7.4.3
    text: |-
      Onverminderd het bepaalde bij of krachtens [hoofdstuk 6][ref1] kunnen de in [artikel 7.1, eerste lid][ref2],
      bedoelde regels ten aanzien van aanbieders van een vast openbaar telefoonnetwerk, een vaste openbare
      telefoondienst, een mobiel openbaar telefoonnetwerk en van een mobiele openbare telefoondienst, aangewezen
      krachtens [artikel 6.4, eerste lid][ref3], betrekking hebben op de toegang tot het vaste openbare telefoonnetwerk
      onderscheidenlijk het mobiele openbare telefoonnetwerk van die aanbieders.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel6
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel7.4
    references:
      - id: ref1
        bwb_id: BWBR0009950
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.1'
      - id: ref3
        bwb_id: BWBR0009950
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '7.5'
    text: |-
      De in [artikel 7.1, eerste lid][ref1], bedoelde regels hebben voorts betrekking op het, met inachtneming van het
      bepaalde bij of krachtens [hoofdstuk 11][ref2], aan derden ter beschikking stellen van bij die regels aan te wijzen
      categorieën van nummers met bijbehorende gegevens ten behoeve van de beschikbaarheid van telefoongidsen en van een
      abonnee-informatiedienst.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk11
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel7.5
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.1'
      - id: ref2
        bwb_id: BWBR0009950
        hoofdstuk: '11'
  - number: '7.6'
    text: |-
      Een aanbieder van een vast openbaar telefoonnetwerk, van een vaste openbare telefoondienst, alsmede een
      aanbieder van een openbare betaaltelefoon en een aanbieder van een mobiel openbaar telefoonnetwerk en van een
      mobiele openbare telefoondienst stellen het gebruik van oproepnummers voor hulpdiensten kosteloos en zonder
      toegangsbelemmeringen ter beschikking aan alle gebruikers van zijn dienst.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel7.6
  - number: '7.7'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de gevallen waarin en de procedure
      volgens welke de natuurlijke persoon of rechtspersoon die rechtstreeks in zijn belang is getroffen een oordeel van
      het college kan vragen over een maatregel, door een aanbieder van huurlijnen, aangewezen door het college krachtens
      [artikel 7.2][ref1], dan wel door een aanbieder van een vast openbaar telefoonnetwerk of van een vaste openbare
      telefoondienst, genomen in het kader van de geharmoniseerde voorwaarden die betrekking hebben op open en efficiënte
      toegang tot en gebruik van openbare telecommunicatienetwerken en openbare telecommunicatiediensten overeenkomstig
      [richtlijn nr. 90/387/EEG](onbekend) van de Raad van de Europese Gemeenschappen van 28 juni 1990 betreffende de
      totstandbrenging van de interne markt voor telecommunicatiediensten door middel van de tenuitvoerlegging van Open
      Network Provision (ONP) (PbEG L 192).


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel7
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel7.7
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: '7.8'
    text: |-
      Indien een oordeel van het college, gegeven krachtens [artikel 7.7][ref1], inhoudt dat een door de in dat artikel
      bedoelde aanbieder genomen maatregel onredelijk is, kan het college de regels vaststellen die terzake tussen die
      aanbieder en de vrager van het oordeel zullen gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel7
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel7.8
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.4'
  - number: 8.1.1
    text: |-
      De aanbieder van een omroepnetwerk neemt met betrekking tot de door middel van het omroepnetwerk uit te zenden
      programma's [artikel 82i van de Mediawet][ref1] in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel82i
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 82i
  - number: 8.1.2
    text: |-
      De aanbieder van een omroepnetwerk neemt met betrekking tot de vergoedingen die door hem aan de
      op het omroepnetwerk aangeslotenen in rekening worden gebracht, het bepaalde bij of krachtens
      [artikel 82j van de Mediawet][ref1] in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel82j
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 82j
  - number: '8.2'
    text: |-
      Het college kan aan de aanbieder van een omroepnetwerk die in zijn verzorgingsgebied niet beschikt over een
      aanmerkelijke macht op de markt, op diens verzoek geheel of gedeeltelijk ontheffing verlenen van de verplichtingen,
      bedoeld in [artikel 8.1][ref1]. [Artikel 6.4, derde en vierde lid][ref2], is daarbij van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '8.1'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '8.3'
    text: |-
      Onze Minister wijst, in overeenstemming met Onze Minister van Onderwijs, Cultuur en Wetenschappen, ten minste een
      aanbieder van een omroepzendernetwerk aan die door middel van de door hem geëxploiteerde radiozendapparaten de
      programma's uitzendt die hem in overeenstemming met de [Mediawet][ref1] ter uitzending worden aangeboden, door
      instellingen die zendtijd als bedoeld in [artikel 1, onder hh, van de Mediawet][ref2], hebben verkregen en door de
      Stichting Radio Nederland Wereldomroep.


      [ref1]: https://wetten.overheid.nl/BWBR0004149
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel1
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel8.3
    references:
      - id: ref1
        bwb_id: BWBR0004149
      - id: ref2
        bwb_id: BWBR0004149
        artikel: '1'
  - number: '8.4'
    text: |-
      De aanbieder van een omroepnetwerk voert, indien hij zijn omroepnetwerk tevens aanbiedt als openbaar
      telecommunicatienetwerk, een gescheiden boekhouding voor deze onderscheiden activiteiten.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel8.4
  - number: 8.4a.1
    text: |-
      Bij ministeriële regeling worden ter uitvoering van een bindend besluit van de Raad van de Europese Unie,
      van het Europees Parlement en de Raad gezamenlijk of van de Commissie van de Europese Gemeenschappen,
      technische voorschriften gegeven voor het uitzenden van een televisieprogramma als bedoeld in
      [artikel 1, onder h, van de Mediawet][ref1], dat bedoeld is om te worden uitgezonden in een aspectverhouding groter
      dan 4:3, of dat bedoeld is om volledig digitaal te worden uitgezonden door middel van een omroepnetwerk of een
      omroepzendernetwerk.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel1
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel8.4a
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '1'
  - number: 8.4a.2
    text: |-
      Bij ministeriële regeling worden ter uitvoering van een bindend besluit als bedoeld in het eerste lid voorts
      technische eisen gesteld aan omroepnetwerken of omroepzendernetwerken met behulp waarvan de uitzending van
      televisieprogramma's op een volledig digitale wijze plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel8.4a
  - number: 8.5.1
    text: |-
      De aanbieder van een systeem voor voorwaardelijke toegang dat geschikt en bestemd is voor de uitzending van
      diensten die kunnen worden ontvangen met behulp van televisiesystemen, stelt aan de aanbieders van die diensten
      op eerlijke, redelijke en niet-discriminerende voorwaarden, zodanige technische faciliteiten beschikbaar dat de
      desbetreffende diensten door degene die met de aanbieder van het systeem voor voorwaardelijke toegang een daartoe
      strekkende overeenkomst heeft gesloten, kunnen worden ontvangen.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel8.5
  - number: 8.5.2
    text: |-
      De aanbieder van een systeem voor voorwaardelijke toegang voert, indien hij tevens andere activiteiten verricht,
      een gescheiden boekhouding voor deze onderscheiden activiteiten.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel8.5
  - number: 8.5.3
    text: |-
      De aanbieder van een systeem voor voorwaardelijke toegang biedt slechts een systeem aan dat is voorzien van de
      nodige technische mogelijkheden voor een goedkope controleoverdracht. Deze mogelijkheden zijn zodanig ingericht dat
      de aanbieder van een omroepnetwerk de volledige controle kan hebben over de diensten die met behulp van het systeem
      voor voorwaardelijke toegang worden uitgezonden.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel8.5
  - number: 8.5.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen in het belang van de eerlijke, redelijke en niet-
      discriminerende toegang tot systemen voor voorwaardelijke toegang nadere regels worden gegeven met betrekking
      tot het aanbieden van deze systemen. Deze regels kunnen slechts betrekking hebben op de wijze waarop de aanbieder
      van een voorwaardelijk toegangssysteem transportcapaciteit verdeelt en tarieven en andere leveringsvoorwaarden
      vaststelt.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel8.5
  - number: 8.6.1
    text: |-
      Het college is bevoegd ter uitvoering van de in [artikel 8.5, vierde lid][ref1], bedoelde regels aan de aanbieder
      van een systeem voor voorwaardelijke toegang aanwijzingen te geven, indien het van oordeel is dat de wijze
      waarop de aanbieder transportcapaciteit verdeelt, of tarieven en andere leveringsvoorwaarden vaststelt, niet in
      overeenstemming is met die regels.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel8
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel8.6
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '8.3'
  - number: 8.6.2
    text: |-
      De aanbieder van een systeem voor voorwaardelijke toegang is verplicht een aanwijzing als bedoeld in het eerste lid
      op te volgen.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel8.6
  - number: '8.7'
    text: |-
      Indien de aanbieder van een omroepnetwerk en de aanbieder van een programma, als bedoeld in
      [artikel 1, onderdeel f, van de Mediawet][ref1] geen overeenstemming bereiken over de toegang van het aangeboden
      programma tot het desbetreffende omroepnetwerk kan het college op verzoek van de aanbieder van het programma ter
      zake bindende aanwijzingen geven. [Artikel 8.6, tweede lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel8
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel8.7
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '8.4'
  - number: 9.1.1
    text: |-
      In het algemeen maatschappelijk belang worden bij algemene maatregel van bestuur openbare telecommunicatiediensten
      of daarmee samenhangende voorzieningen aangewezen die voor eenieder tegen een betaalbare prijs en een bepaalde
      kwaliteit beschikbaar moeten zijn.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel9.1
  - number: 9.1.2
    text: |-
      In het algemeen maatschappelijk belang worden bij of krachtens algemene maatregel van bestuur regels gesteld over
      de hoogte van de in het eerste lid bedoelde prijs en over het vereiste kwaliteitsniveau. Bij de in de eerste volzin
      bedoelde regels over de hoogte van de prijs kan onderscheid worden gemaakt tussen groepen gebruikers.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel9.1
  - number: 9.2.1
    text: |-
      Indien naar het oordeel van Onze Minister de beschikbaarheid, de betaalbaarheid of de kwaliteit van een of meer van
      de krachtens [artikel 9.1, eerste lid][ref1], aangewezen openbare telecommunicatiediensten of voorzieningen niet
      door het normale functioneren van de markt wordt of zal kunnen worden gegarandeerd, kan Onze Minister bij besluit
      de verzorging van de desbetreffende diensten of voorzieningen in een bij dat besluit te bepalen verzorgingsgebied
      voor ten hoogste vijf jaar opdragen aan degene die overeenkomstig de in dit artikel geregelde procedure wordt
      aangewezen als degene die de laagste totale nettokosten verwacht.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel9
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel9.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.2.2
    text: |-
      Onze Minister maakt het voornemen over te gaan tot een opdracht bekend aan degene die binnen het verzorgingsgebied
      op de relevante markt beschikt over een aanmerkelijke macht. Het voornemen bevat de te verzorgen openbare
      telecommunicatiediensten of voorzieningen, het verzorgingsgebied en de periode waarvoor de opdracht zal worden
      gegeven. [Artikel 6.4, derde en vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel9.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 9.2.3
    text: |-
      Van het voornemen wordt mededeling gedaan door plaatsing in de Staatscourant. Daarbij wordt gewezen op de in het
      vijfde lid geregelde mogelijkheid een aanvraag in te dienen om een opdracht.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel9.2
  - number: 9.2.4
    text: |-
      Binnen acht weken na de datum van de in het tweede lid, eerste volzin, bedoelde bekendmaking wordt door degene
      die binnen het verzorgingsgebied op de relevante markt beschikt over een aanmerkelijke macht aan Onze Minister
      meegedeeld of hij verwacht in aanmerking te komen voor een vergoeding op grond van [artikel 9.3][ref1] indien aan
      hem een opdracht zou worden gegeven. Verwacht de in de vorige zin bedoelde aanbieder in aanmerking te komen voor
      een vergoeding dan deelt hij Onze Minister tevens mee wat per kalenderjaar naar zijn verwachting de hoogte van de
      in [artikel 9.3, eerste lid][ref2], bedoelde nettokosten zullen zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel9
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel9.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '9'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.2.5
    text: |-
      Binnen acht weken na de datum van de in het derde lid bedoelde bekendmaking kan bij Onze Minister door anderen dan
      degene die binnen het verzorgingsgebied op de relevante markt beschikt over een aanmerkelijke macht, een aanvraag
      worden ingediend om een opdracht.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel9.2
  - number: 9.2.6
    text: |-
      De aanvraag bevat in ieder geval een verklaring van de aanvrager of hij verwacht in aanmerking te komen voor een
      vergoeding op grond van [artikel 9.3][ref1], indien aan hem een opdracht zou worden gegeven. Verwacht de aanvrager
      in aanmerking te komen voor een vergoeding dan deelt hij Onze Minister tevens mee wat per kalenderjaar naar zijn
      verwachting de hoogte van de in [artikel 9.3, eerste lid][ref2], bedoelde nettokosten zullen zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel9
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel9.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '9'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.2.7
    text: |-
      Een opdracht wordt geweigerd indien de aanvrager naar verwachting de opdracht niet naar behoren zal kunnen
      verzorgen.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel9.2
  - number: 9.2.8
    text: |-
      De opdracht wordt, na een onderlinge vergelijking van de hoogte van de door aanvragers aan wie de opdracht op
      grond van het zevende lid niet is geweigerd, verwachte totale nettokosten en door aanbieders die binnen het
      verzorgingsgebied op de relevante markt beschikken over een aanmerkelijke macht verwachte totale nettokosten,
      opgedragen aan degene die de laagste totale nettokosten verwacht.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel9.2
  - number: 9.2.9
    text: |-
      Indien op grond van de in het achtste lid bedoelde vergelijking meerdere opdrachten kunnen worden gegeven wordt
      door middel van het lot beslist aan wie de opdracht wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel9.2
  - number: 9.3.1
    text: |-
      Degene die op grond van een opdracht als bedoeld in [artikel 9.2, eerste lid][ref1], openbare
      telecommunicatiediensten of voorzieningen verzorgt kan binnen een half jaar na afloop van een kalenderjaar waarin
      hij die diensten of voorzieningen heeft verzorgd bij het college een aanvraag indienen om vergoeding van de in het
      afgelopen kalenderjaar bij de verzorging gemaakte nettokosten.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel9
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel9.3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.3.2
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent de bij de aanvraag om een vergoeding te verstrekken
      berekening van de in het eerste lid bedoelde nettokosten.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel9.3
  - number: 9.3.3
    text: |-
      Een vergoeding wordt slechts toegekend voorzover naar het oordeel van het college het bestaan en de hoogte van
      de nettokosten op grond van de verstrekte gegevens voldoende is aangetoond. De vergoeding is niet hoger dan de
      door de aanvrager op grond van [artikel 9.2, vierde of zesde lid][ref1], voor het kalenderjaar waarop de aanvraag
      betrekking heeft verwachte nettokosten.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel9
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel9.3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.3.4
    text: |-
      Indien een vergoeding wordt toegekend wordt dit onder vermelding van het te vergoeden bedrag bekend gemaakt in
      de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel9.3
  - number: 9.3.5
    text: |-
      Een vergoeding wordt uitbetaald binnen een week nadat de in [artikel 9.4, vijfde lid][ref1], bedoelde termijn is
      verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel9
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel9.3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.4.1
    text: |-
      Indien ingevolge [artikel 9.3][ref1] aan degene die op grond van een opdracht openbare telecommunicatiediensten
      of voorzieningen verzorgt, een vergoeding wordt toegekend, is eenieder die een openbare telecommunicatiedienst
      aanbiedt behorende tot een krachtens [artikel 9.1, eerste lid][ref2], aangewezen categorie van openbare
      telecommunicatiediensten, en die in het kalenderjaar waarop de te betalen vergoeding betrekking heeft, voor die
      dienst in Nederland een hogere omzet heeft dan een bij ministeriële regeling te bepalen bedrag, aan het college een
      bijdrage verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel9
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel9.4
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '9'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.4.2
    text: |-
      De verschuldigde bijdrage wordt door het college binnen een half jaar na toekenning van de vergoeding vastgesteld
      en aan degene die de bijdrage is verschuldigd, meegedeeld.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel9.4
  - number: 9.4.3
    text: |-
      De bijdrage wordt berekend door de te betalen vergoeding te vermenigvuldigen met de in het vierde lid bedoelde
      breuk.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel9.4
  - number: 9.4.4
    text: |-
      De teller van de breuk bestaat uit de jaaromzet in Nederland van de bijdrageverschuldigde aanbieder in de krachtens
      [artikel 9.1, eerste lid][ref1], aangewezen categorieën van openbare telecommunicatiediensten in het jaar waarop de
      te betalen vergoeding betrekking heeft. De noemer van de breuk bestaat uit de som van de jaaromzetten in Nederland
      van de bijdrageverschuldigde aanbieders in de desbetreffende diensten in het jaar waarop de te betalen vergoeding
      betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel9
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel9.4
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.4.5
    text: De bijdrage wordt betaald binnen vier weken na ontvangst van de beschikking waarin de bijdrage is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel9.4
  - number: 9.4.6
    text: |-
      Op verzoek van degene die op grond van [artikel 9.3][ref1] een vergoeding krijgt toegekend, wordt een door hem te
      betalen bijdrage verrekend met de door hem te ontvangen vergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel9
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel9.4
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '9'
        hoofdstuk: '9'
  - number: '10.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld inzake de voorschriften waaraan apparaten
      moeten voldoen. Deze voorschriften worden onderscheiden in voorschriften betreffende:
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.1
  - number: 10.1.a
    text: de elektromagnetische compatibiliteit;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.1
  - number: 10.1.b
    text: de veiligheid;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.1
  - number: 10.1.c
    text: de interactie met openbare telecommunicatienetwerken;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.1
  - number: 10.1.d
    text: de interactie via openbare telecommunicatienetwerken;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.1
  - number: 10.1.e
    text: de aan te brengen bijzondere voorzieningen, en
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.1
  - number: 10.1.f
    text: een efficiënt gebruik van het frequentiespectrum.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.1
  - number: 10.1a
    text: |-
      Bij ministeriële regeling worden ter uitvoering van een bindend besluit van de Raad van de Europese Unie,
      van het Europees Parlement en de Raad gezamenlijk of van de Commissie van de Europese Gemeenschappen regels
      gesteld ter zake van apparaten bestemd voor de ontvangst en weergave van televisieprogramma's als bedoeld
      [artikel 1, onder h, van de Mediawet][ref1], en van apparaten bestemd voor het ontsleutelen van versleutelde
      digitale televisiesignalen.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel1
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.1a
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '1'
  - number: '10.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld inzake de certificatie van apparaten, die
      per aangewezen categorie van apparaten kunnen verschillen. Deze regels kunnen worden onderscheiden in regels
      betreffende:
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.2
  - number: 10.2.a
    text: |-
      het onderzoek naar de overeenstemming met de in [artikel 10.1][ref1] bedoelde voorschriften;


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel10
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.1.1
  - number: 10.2.b
    text: |-
      de afgifte, het beschikbaar hebben en de intrekking van documenten met betrekking tot apparaten, alsmede het
      aanbrengen van markeringen.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.2
  - number: 10.3.1
    text: |-
      Onze Minister kan instanties aanwijzen die bevoegd zijn de certificatie, bedoeld in [artikel 10.2][ref1], uit te
      voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel10
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.1.1
  - number: 10.3.2
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels gesteld inzake:'
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.3
  - number: 10.3.2.a
    text: de criteria waaraan instanties moeten voldoen om voor aanwijzing in aanmerking te komen;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.3
  - number: 10.3.2.b
    text: de voorschriften welke aan een zodanige aanwijzing kunnen worden verbonden.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.3
  - number: 10.3.3
    text: |-
      Onze Minister kan een aanwijzing intrekken indien niet meer wordt voldaan aan de criteria of voorschriften, bedoeld
      in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.3
  - number: 10.3.4
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van deze wet en vervolgens telkens na vier jaar aan
      de Staten-Generaal een verslag over de doeltreffendheid en doelmatigheid van de toepassing van de certificatie,
      bedoeld in [artikel 10.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel10
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.1.1
  - number: '10.4'
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld inzake:'
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.4
  - number: 10.4.a
    text: |-
      de middelen die Onze Minister kan gebruiken om het in de handel brengen en verhandelen van apparaten of
      categorieën van apparaten te beëindigen of te beperken, indien de betrokken apparaten niet voldoen aan de in
      [artikel 10.1][ref1] bedoelde voorschriften;


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel10
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.4
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.1.1
  - number: 10.4.b
    text: |-
      de behandeling van klachten over elektromagnetische storingen, ondervonden van het gebruik van apparaten, of over
      belemmeringen, welke bij het gebruik van radiozendapparaten of randapparaten worden ondervonden.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.4
  - number: 10.5.1
    text: |-
      Het is verboden apparaten in de handel te brengen indien niet wordt voldaan aan de krachtens [artikel 10.1][ref1]
      of [artikel 10.2][ref2] terzake van de desbetreffende apparaten gestelde voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel10
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.5
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.1.1
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.1.1
  - number: 10.5.2
    text: |-
      Het is verboden apparaten te verhandelen indien niet wordt voldaan aan de in [artikel 10.2, onder b][ref1],
      bedoelde regels betreffende het beschikbaar hebben van documenten en het aanbrengen van markeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel10
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.5
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.1.1
  - number: 10.5.3
    text: |-
      Onverminderd het eerste en tweede lid is het verboden apparaten bedoeld in [artikel 10.1a][ref1] te verkopen, te
      verhuren of anderszins ter beschikking te stellen indien niet wordt voldaan aan de krachtens [artikel 10.1a][ref2]
      terzake van de betreffende apparaten gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel10
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.5
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.1.1
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.1.1
  - number: '10.6'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld inzake het maken van handelsreclame
      voor apparaten waarvan het in de handel brengen of het verhandelen op grond van [artikel 10.5][ref1] is verboden.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel10
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.6
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.1.1
  - number: 10.7.1
    text: |-
      Het bij of krachtens dit hoofdstuk bepaalde is niet van toepassing op het in de handel brengen of het verhandelen
      van apparaten, indien de belanghebbende aantoont dat dit geschiedt om die apparaten:
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.7
  - number: 10.7.1.a
    text: naar een land buiten de Europese Economische Ruimte uit te voeren;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.7
  - number: 10.7.1.b
    text: in overeenstemming te brengen met de krachtens dit hoofdstuk ten aanzien van die apparaten gestelde regels;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.7
  - number: 10.7.1.c
    text: ten toon te stellen op beurzen of soortgelijke exposities;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.7
  - number: 10.7.1.d
    text: te gebruiken voor experimenten.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.7
  - number: 10.7.2
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld inzake het gebruik van apparaten voor activiteiten
      als bedoeld in het eerste lid, onder c en d.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.7
  - number: 10.7.3
    text: |-
      Het bij of krachtens deze titel met betrekking tot de elektromagnetische compatibiliteit bepaalde is voorts niet
      van toepassing op radiozendapparaten ten behoeve van radiozendamateurs voorzover deze apparaten niet in de handel
      verkrijgbaar zijn.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.7
  - number: 10.8.1
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld inzake de installatie van apparaten ter voorkoming van
      elektromagnetische storingen in de werking van een openbaar telecommunicatienetwerk of in om veiligheidsredenen
      gebruikte apparaten die naar hun aard bestemd zijn voor het zenden of ontvangen van radiocommunicatiesignalen.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.8
  - number: 10.8.2
    text: |-
      Indien van de ingebruikneming of het gebruik van een in dit hoofdstuk bedoeld apparaat op een bepaalde plaats
      problemen zijn te verwachten of bestaan in verband met de elektromagnetische compatibiliteit kan Onze Minister:
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.8
  - number: 10.8.2.a
    text: |-
      aan de houder van het apparaat aanwijzingen geven met betrekking tot de ingebruikneming of het gebruik van dat
      apparaat;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.8
  - number: 10.8.2.b
    text: |-
      aan een vergunning voor het gebruik van frequentieruimte op grond van [hoofdstuk 3][ref1] voorschriften verbinden
      met betrekking tot de ingebruikneming of het gebruik van dat apparaat;


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.8
    references:
      - id: ref1
        bwb_id: BWBR0009950
        hoofdstuk: '3'
  - number: 10.8.2.c
    text: |-
      aan de houders van apparaten de ingebruikneming of het gebruik van die apparaten verbieden zonder voorafgaande
      vergunning van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.8
  - number: '10.9'
    text: |-
      Bij de in [artikel 10.8, eerste lid][ref1], bedoelde regeling kunnen categorieën van apparaten van de toepassing
      van het bij of krachtens dit hoofdstuk terzake van de elektromagnetische compatibiliteit bepaalde worden
      uitgezonderd, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel10
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.9
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.2.1
  - number: 10.9.a
    text: zij geen elektromagnetische storingen kunnen veroorzaken of hun werking daardoor niet kan worden aangetast, of
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.9
  - number: 10.9.b
    text: |-
      met betrekking tot de elektromagnetische compatibiliteit van die apparaten reeds regels zijn gesteld ter uitvoering
      van een bindend besluit van een orgaan van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.9
  - number: '10.10'
    text: |-
      Degene die randapparaten als bedoeld in [artikel 1.1, onder x, 1° en 3°][ref1], in de handel brengt, geeft aan of
      deze randapparaten al dan niet bestemd zijn voor aansluiting op een openbaar telecommunicatienetwerk.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel1
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.10
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '1'
        hoofdstuk: '1'
  - number: '10.11'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld betreffende de eisen van
      vakbekwaamheid waaraan moet worden voldaan voor het beroeps- of bedrijfsmatig aanleggen en onderhouden van
      randapparaten.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.11
  - number: '10.12'
    text: |-
      Het is verboden randapparaten aan te sluiten of aangesloten te houden op een openbaar telecommunicatienetwerk
      die niet voldoen aan de krachtens [artikel 10.2][ref1] gestelde regels met betrekking tot het aanbrengen van
      markeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel10
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.12
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.1.1
  - number: '10.15'
    text: 'Voor de toepassing van deze paragraaf worden met radiozendapparaten gelijkgesteld:'
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.15
  - number: 10.15.a
    text: |-
      elke samenvoeging van onderdelen, geschikt om daarmede een radiozendapparaat dan wel ingevolge het bepaalde onder b
      daarmee gelijkgesteld apparaat te vormen;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.15
  - number: 10.15.b
    text: |-
      de bij algemene maatregel van bestuur te omschrijven elektrische of elektronische apparaten die geschikt zijn om
      door gebruik tezamen met een radiozendapparaat een radiozendapparaat te vormen met andere technische eigenschappen.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.15
  - number: 10.16.1
    text: |-
      Het aanleggen, het geheel of gedeeltelijk aangelegd aanwezig hebben, of het gebruik van radiozendapparaten
      is slechts toegestaan indien voor het gebruik ervan aan de houder van die radiozendapparaten op grond van
      [hoofdstuk 3][ref1] een vergunning voor het gebruik van frequentieruimte is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.16
    references:
      - id: ref1
        bwb_id: BWBR0009950
        hoofdstuk: '3'
  - number: 10.16.2
    text: |-
      In afwijking van het eerste lid is het aanleggen, het geheel of gedeeltelijk aangelegd aanwezig hebben, of
      het gebruik van radiozendapparaten zonder dat aan de houder een vergunning is verleend voor het gebruik van
      frequentieruimte, toegestaan, indien:
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.16
  - number: 10.16.2.a
    text: |-
      krachtens [hoofdstuk 3][ref1] geen vergunning is vereist voor het gebruik van frequentieruimte;


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.16
    references:
      - id: ref1
        bwb_id: BWBR0009950
        hoofdstuk: '3'
  - number: 10.16.2.b
    text: |-
      de houder van het radiozendapparaat met de houder van een vergunning voor het gebruik van frequentieruimte een
      overeenkomst heeft gesloten voor de aanleg en het instandhouden van een radiozendapparaat ten behoeve van het
      verzorgen van diensten van de opdrachtgever waarbij gebruik wordt gemaakt van de aan de opdrachtgever toegewezen
      frequentieruimte;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.16
  - number: 10.16.2.c
    text: |-
      deze apparaten worden gebruikt aan boord van andere dan Nederlandse schepen of luchtvaartuigen en daarvoor een
      vergunning is afgegeven in overeenstemming met het Internationaal Telecommunicatieverdrag, of
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.16
  - number: 10.16.2.d
    text: |-
      deze apparaten worden gebruikt door niet-ingezetenen van Nederland die tijdelijk hier te lande verblijven en
      daartoe voor Nederland bindende afspraken zijn gemaakt.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.16
  - number: 10.17.1
    text: |-
      Onze Minister kan, in afwijking van [artikel 10.16, eerste lid][ref1], een vergunning verlenen voor het aanleggen
      van radiozendapparaten zonder dat aan de houder een vergunning is verleend voor gebruik van frequentieruimte. Een
      vergunning kan onder beperkingen worden verleend. Aan een vergunning kunnen voorschriften worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel10
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.17
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.2.3
  - number: 10.17.2
    text: 'De vergunning kan worden geweigerd, indien:'
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.17
  - number: 10.17.2.a
    text: ernstig vermoeden bestaat dat de vergunning zal worden misbruikt;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.17
  - number: 10.17.2.b
    text: |-
      een eerder verleende vergunning is ingetrokken wegens overtreding van de bij of krachtens deze wet gestelde regels
      dan wel van de aan de vergunning verbonden voorschriften;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.17
  - number: 10.17.2.c
    text: de aanvraag niet voldoet aan de daarvoor bij of krachtens deze wet gestelde regels, of
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.17
  - number: 10.17.2.d
    text: de aanvrager naar het oordeel van Onze Minister geen gerechtvaardigd belang heeft bij verlening van de vergunning.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.17
  - number: 10.17.3
    text: 'De vergunning kan worden ingetrokken, indien:'
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.17
  - number: 10.17.3.a
    text: |-
      de houder van de vergunning de bij of krachtens deze wet gestelde regels dan wel de aan de vergunning verbonden
      voorschriften en beperkingen niet nakomt, of
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.17
  - number: 10.17.3.b
    text: de gronden waarop de vergunning is verleend zijn vervallen.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.17
  - number: '10.18'
    text: |-
      [Artikel 10.11][ref1] is van overeenkomstige toepassing op radiozendapparaten.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel10
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.18
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.2.2
  - number: 10.19.1
    text: 'Het is verboden:'
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.19
  - number: 10.19.1.a
    text: |-
      een radiozendapparaat te gebruiken om aan boord van een schip of luchtvaartuig buiten elk nationaal gebied
      programma's uit te zenden;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.19
  - number: 10.19.1.b
    text: een radiozendapparaat, bestemd voor een gebruik als onder a bedoeld, te exploiteren;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.19
  - number: 10.19.1.c
    text: |-
      een radiozendapparaat ter beschikking te stellen of aan te leggen in de wetenschap, dat het is bestemd voor een
      gebruik als bedoeld onder a;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.19
  - number: 10.19.1.d
    text: |-
      een schip of luchtvaartuig ter beschikking te stellen in de wetenschap, dat dit is bestemd om aan boord daarvan
      uitzendingen te doen als onder a bedoeld.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.19
  - number: 10.19.2
    text: |-
      Het is verboden aan overtreding van een der in het eerste lid bedoelde verboden opzettelijk mee te werken door
      daarbij behulpzaam te zijn dan wel daartoe gelegenheid, middelen of inlichtingen te verschaffen. Als handelingen
      van medewerking worden in elk geval beschouwd:
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.19
  - number: 10.19.2.a
    text: |-
      het ter beschikking stellen van materiaal ten behoeve van het schip of luchtvaartuig dan wel van het
      radiozendapparaat;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.19
  - number: 10.19.2.b
    text: het onderhouden of herstellen van het schip of luchtvaartuig dan wel van het radiozendapparaat;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.19
  - number: 10.19.2.c
    text: het bevoorraden van het schip of luchtvaartuig;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.19
  - number: 10.19.2.d
    text: |-
      het vervoeren van personen of goederen naar of van het schip of luchtvaartuig dan wel het ter beschikking stellen
      van middelen tot dat vervoer;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.19
  - number: 10.19.2.e
    text: het vervaardigen van programma's of onderdelen daarvan, bestemd om te worden uitgezonden;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.19
  - number: 10.19.2.f
    text: |-
      het geven van opdrachten tot het uitzenden van programma's of onderdelen daarvan dan wel het verlenen van
      bemiddeling bij het verkrijgen van zodanige opdrachten.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.19
  - number: 10.19.3
    text: |-
      Het tweede lid blijft buiten toepassing, indien de aldaar bedoelde handelingen worden verricht teneinde in geval
      van nood het schip of luchtvaartuig bij te staan of mensenlevens te beschermen.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.19
  - number: 10.19.4
    text: |-
      Onder schip of luchtvaartuig wordt in dit artikel mede begrepen elk ander drijvend of door de lucht gedragen
      voorwerp.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel10.19
  - number: '11.1'
    text: 'In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel11.1
  - number: 11.1.a
    text: |-
      abonnee: een natuurlijke persoon of rechtspersoon die partij is bij een overeenkomst met een aanbieder van openbare
      telecommunicatiediensten voor de levering van dergelijke diensten;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel11.1
  - number: 11.1.b
    text: |-
      gebruiker: iedere natuurlijke persoon die gebruik maakt van een openbare telecommunicatiedienst voor particuliere
      of zakelijke doeleinden zonder noodzakelijkerwijze op die dienst te zijn geabonneerd;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel11.1
  - number: 11.1.c
    text: |-
      verwerking van verkeersgegevens: verwerking als bedoeld in
      [artikel 1, onderdeel b, van de Wet bescherming persoonsgegevens][ref1], met dien verstande dat de desbetreffende
      handelingen mede betrekking hebben op gegevens van abonnees die geen natuurlijke personen zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel1
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel11.1
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '1'
  - number: '11.2'
    text: |-
      Onverminderd de [Wet bescherming persoonsgegevens][ref1] en het overigens bij of krachtens deze wet bepaalde dragen
      de aanbieder van een openbaar telecommunicatienetwerk en de aanbieder van een openbare telecommunicatiedienst
      zorg voor de bescherming van persoonsgegevens en de bescherming van de persoonlijke levenssfeer van abonnees en
      gebruikers van zijn netwerk, onderscheidenlijk zijn dienst.


      [ref1]: https://wetten.overheid.nl/BWBR0011468
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel11.2
    references:
      - id: ref1
        bwb_id: BWBR0011468
  - number: 11.3.1
    text: |-
      De in [artikel 11.2][ref1] bedoelde aanbieders treffen in het belang van de bescherming van persoonsgegevens en
      de bescherming van de persoonlijke levenssfeer van abonnees en gebruikers passende technische en organisatorische
      maatregelen ten behoeve van de veiligheid en beveiliging van de door hen aangeboden netwerken en diensten. De
      maatregelen garanderen, rekening houdend met de stand van de techniek en de kosten van de tenuitvoerlegging, een
      passend beveiligingsniveau dat in verhouding staat tot het desbetreffende risico.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel11
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel11.3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.1'
  - number: 11.3.2
    text: |-
      De in [artikel 11.2][ref1] bedoelde aanbieders dragen er zorg voor dat de abonnees worden geïnformeerd over:


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel11
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel11.3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.1'
  - number: 11.3.2.a
    text: |-
      bijzondere risico's voor de doorbreking van de veiligheid of de beveiliging van het aangeboden netwerk of de
      aangeboden dienst;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel11.3
  - number: 11.3.2.b
    text: |-
      de beschikbare middelen waarmee de onder a bedoelde risico's kunnen worden uitgesloten of verkleind en de kosten
      die daarmee gemoeid zijn.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel11.3
  - number: 11.4.1
    text: 'De aanbieder van een openbare telecommunicatiedienst is verplicht de abonnee op diens verzoek:'
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel11.4
  - number: 11.4.1.a
    text: |-
      geleverde telecommunicatiediensten door middel van geheel of gedeeltelijk niet-gespecificeerde nota's in rekening
      te brengen;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel11.4
  - number: 11.4.1.b
    text: |-
      de mogelijkheid te bieden kosteloos en op eenvoudige wijze de doorschakeling van oproepen van derden naar het bij
      hem in gebruik zijnde netwerkaansluitpunt ongedaan te maken.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel11.4
  - number: 11.4.2
    text: |-
      Bij algemene maatregel van bestuur worden in het belang van de bescherming van persoonsgegevens en de bescherming
      van de persoonlijke levenssfeer regels gesteld met betrekking tot het specificeren van nota's voor geleverde
      telecommunicatiediensten. Daarbij kunnen regels worden gesteld ten aanzien van de keuzemogelijkheden voor de wijze
      van betaling van die diensten.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel11.4
  - number: 11.5.1
    text: |-
      De aanbieder van een openbaar telecommunicatienetwerk en de aanbieder van een openbare telecommunicatiedienst
      dragen in het belang van de bescherming van persoonsgegevens en de bescherming van de persoonlijke levenssfeer bij
      beëindiging van iedere oproep zorg voor de verwijdering of de anonimisering van bij algemene maatregel van bestuur
      aan te wijzen verwerkte verkeersgegevens met betrekking tot abonnees en gebruikers.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel11.5
  - number: 11.5.2
    text: 'In afwijking van het eerste lid kunnen verkeersgegevens slechts worden verwerkt indien en voor zover:'
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel11.5
  - number: 11.5.2.a
    text: |-
      dit noodzakelijk is ten behoeve van het opstellen van een nota voor een abonnee of degene die zich tegenover
      de aanbieder rechtens heeft verbonden die nota te voldoen, dan wel ten behoeve van een betaling terzake van
      interconnectie of bijzondere toegang;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel11.5
  - number: 11.5.2.b
    text: |-
      dit noodzakelijk is ten behoeve van marktonderzoek en verkoopactiviteiten met betrekking tot de eigen
      telecommunicatiediensten en de abonnee daarmee heeft ingestemd;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel11.5
  - number: 11.5.2.c
    text: |-
      dit noodzakelijk is ten behoeve van de berechting van enig geschil, de beslissing van een geschil, bedoeld
      [artikel 12.1][ref1], of het vaststellen van regels als bedoeld in [artikel 6.3][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel11.5
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '12'
        hoofdstuk: '12'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 11.5.2.d
    text: dit noodzakelijk is ten behoeve van het verkeersbeheer;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel11.5
  - number: 11.5.2.e
    text: |-
      dit noodzakelijk is ten behoeve van de verstrekking van inlichtingen aan klanten, voorzover die inlichtingen
      betrekking hebben op de verkeersgegevens die de klanten zelf betreffen;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel11.5
  - number: 11.5.2.f
    text: dit noodzakelijk is ten behoeve van de opsporing van fraude;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel11.5
  - number: 11.5.2.g
    text: dit overigens bij of krachtens de wet is toegestaan.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel11.5
  - number: 11.5.3
    text: |-
      Bij algemene maatregel van bestuur worden ter uitvoering van dit artikel nadere regels gesteld. Deze regels kunnen
      slechts betrekking hebben op de gegevens die in combinatie met verkeersgegevens mogen worden verwerkt, voor welke
      doeleinden die gecombineerde verwerking plaatsvindt, de toegestane verwerkingsduur en de personen die met de
      verwerking van de desbetreffende gegevens zijn belast.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel11.5
  - number: '11.6'
    text: |-
      Eenieder die een algemeen beschikbare telefoongids uitgeeft of een algemeen beschikbare abonnee-informatiedienst
      verzorgt, draagt er zorg voor dat:
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel11.6
  - number: 11.6.a
    text: |-
      in de telefoongids en in het door de abonnee-informatiedienst gebruikte abonneebestand slechts die persoonsgegevens
      worden opgenomen die noodzakelijk zijn om een abonnee te kunnen identificeren, tenzij de abonnee er ondubbelzinnig
      mee heeft ingestemd dat er bijkomende persoonsgegevens worden opgenomen;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel11.6
  - number: 11.6.b
    text: 'op verzoek van de abonnee:'
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel11.6
  - number: 11.6.b.1°
    text: |-
      zijn persoonsgegevens kosteloos niet of niet meer worden opgenomen in de telefoongids en in het door de abonnee-
      informatiedienst gebruikte abonneebestand;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel11.6
  - number: 11.6.b.2°
    text: |-
      zijn persoonsgegevens kosteloos niet of niet meer beschikbaar worden gesteld voor commerciële, ideële of
      charitatieve doeleinden;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel11.6
  - number: 11.6.b.3°
    text: |-
      bij de vermelding van zijn persoonsgegevens in de telefoongids en in het door de abonnee-informatiedienst gebruikte
      abonneebestand zijn adres niet volledig wordt vermeld;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel11.6
  - number: 11.6.b.4°
    text: |-
      bij de vermelding van zijn persoonsgegevens in de telefoongids en in het door de abonnee-informatiedienst gebruikte
      abonneebestand elke verwijzing naar zijn geslacht achterwege wordt gelaten, tenzij dit uit taalkundig oogpunt
      onvermijdelijk is.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel11.6
  - number: 11.7.1
    text: |-
      Het gebruik van automatische oproepsystemen zonder menselijke tussenkomst en faxen voor het doen van ongevraagde
      oproepen voor commerciële, ideële of charitatieve doeleinden aan abonnees is uitsluitend toegestaan, indien de
      desbetreffende abonnee daarvoor voorafgaand toestemming heeft verleend.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel11.7
  - number: 11.7.2
    text: |-
      Het gebruik van andere dan in het eerste lid genoemde systemen voor het doen van ongevraagde oproepen voor
      commerciële, ideële of charitatieve doeleinden aan abonnees is toegestaan, tenzij de desbetreffende abonnee te
      kennen heeft gegeven dat hij oproepen waarbij van deze systemen gebruik wordt gemaakt, niet wenst te ontvangen. Aan
      de abonnee worden in dat geval geen kosten in rekening gebracht van voorzieningen waarmee wordt voorkomen dat hem
      een ongevraagde oproep wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel11.7
  - number: 11.7.3
    text: |-
      Degene die ongevraagd oproepen voor commerciële, ideële of charitatieve doeleinden doet, neemt passende
      maatregelen om ten minste eenmaal per jaar de betrokkenen bekend te maken met de mogelijkheden tot het doen van een
      kennisgeving, bedoeld in het tweede lid. De bekendmaking kan via een of meer dag-, nieuws- of huis-aan-huis-bladen
      of op een andere geschikte wijze plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel11.7
  - number: 11.7.4
    text: |-
      Bij algemene maatregel van bestuur worden in het belang van de bescherming van persoonsgegevens en de bescherming
      van de persoonlijke levenssfeer regels ter uitvoering van het eerste en het tweede lid gesteld. Deze regels hebben
      betrekking op de wijze waarop de toestemming, bedoeld in het eerste lid, wordt gegeven en de kennisgeving, bedoeld
      in het tweede lid, wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel11.7
  - number: '11.8'
    text: |-
      De toepassing van de [artikelen 11.6][ref1] en [11.7][ref2] is beperkt tot abonnees die natuurlijke personen zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel11
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel11.8
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.1'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.1'
  - number: 11.9.1
    text: |-
      Het bepaalde bij of krachtens deze paragraaf is van toepassing op de aanbieder van een openbaar
      telecommunicatienetwerk en de aanbieder van een openbare telecommunicatiedienst die door middel van dat netwerk of
      als onderdeel van die dienst nummeridentificatie aanbiedt bij:
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel11.9
  - number: 11.9.1.a
    text: de vaste openbare telefoondienst;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel11.9
  - number: 11.9.1.b
    text: digitale mobiele openbare telefoondiensten;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel11.9
  - number: 11.9.1.c
    text: digitale geïntegreerde telecommunicatiediensten, of
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel11.9
  - number: 11.9.1.d
    text: andere bij ministeriële regeling aan te wijzen openbare telecommunicatiediensten.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel11.9
  - number: 11.9.2
    text: 'Door de in het eerste lid bedoelde aanbieders worden:'
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel11.9
  - number: 11.9.2.a
    text: |-
      aan iedere oproepende abonnee of gebruiker mogelijkheden aangeboden om kosteloos de verstrekking van het nummer van
      het oproepende netwerkaansluitpunt dan wel een nummer waarmee een individuele gebruiker kan worden geïdentificeerd
      te blokkeren;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel11.9
  - number: 11.9.2.b
    text: 'aan iedere opgeroepen abonnee mogelijkheden aangeboden om:'
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel11.9
  - number: 11.9.2.b.1°
    text: |-
      de verstrekking van het nummer van het oproepende netwerkaansluitpunt dan wel een nummer waarmee een individuele
      gebruiker kan worden geïdentificeerd te verhinderen;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel11.9
  - number: 11.9.2.b.2°
    text: |-
      oproepen waarbij de verstrekking van het nummer van het oproepende netwerkaansluitpunt dan wel een nummer waarmee
      een individuele gebruiker kan worden geïdentificeerd is geblokkeerd, te weigeren;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel11.9
  - number: 11.9.2.b.3°
    text: |-
      indien nummeridentificatie, bedoeld in [artikel 1.1, onderdeel u, onder 2°][ref1], wordt aangeboden, kosteloos
      de verstrekking van het nummer van het opgeroepen netwerkaansluitpunt dan wel een nummer waarmee een individuele
      gebruiker kan worden geïdentificeerd aan het oproepende netwerkaansluitpunt te blokkeren.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel1
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel11.9
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '1'
        hoofdstuk: '1'
  - number: 11.9.3
    text: |-
      Bij ministeriële regeling worden ten aanzien van de in het eerste lid genoemde openbare telecommunicatiediensten
      nadere regels gesteld met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel11.9
  - number: 11.9.3.a
    text: mogelijkheden tot blokkering en weigering;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel11.9
  - number: 11.9.3.b
    text: |-
      de voorwaarden waaronder de in het eerste lid bedoelde aanbieder aan de abonnee de identificatie van het nummer van
      oproepende netwerkaansluitpunten dan wel een nummer waarmee een individuele gebruiker kan worden geïdentificeerd
      kan doen verhinderen;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel11.9
  - number: 11.9.3.c
    text: |-
      de wijze waarop uitvoering aan nummeridentificatie in het internationale telecommunicatieverkeer kan worden
      gegeven, en
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel11.9
  - number: 11.9.3.d
    text: |-
      de wijze waarop de in het eerste lid bedoelde aanbieders, gebruikers en abonnees voorlichten over het gebruik van
      nummeridentificatie.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel11.9
  - number: 11.10.1
    text: |-
      Eenieder die nummeridentificatie aanbiedt, is verplicht aan de door Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties, in overeenstemming met Onze Minister, aangewezen beheerders van een alarmnummer voor publieke
      diensten, indien er telecommunicatie met een alarmnummer wordt afgewikkeld, gelijktijdig:
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel11.10
  - number: 11.10.1.a
    text: |-
      het nummer van het oproepende netwerkaansluitpunt te verstrekken, ook indien bij dat netwerkaansluitpunt gebruik
      wordt gemaakt van een in [artikel 11.9, tweede lid, onder a][ref1], bedoelde blokkeringsmogelijkheid;


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel11
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel11.10
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.2'
  - number: 11.10.1.b
    text: |-
      de naam, en de beschikbare adres-, postcode- en woonplaatsgegevens van de abonnee, dan wel de locatie van de
      openbare betaaltelefoon, die onder het desbetreffende nummer is aangesloten, te verstrekken.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel11.10
  - number: 11.10.2
    text: |-
      De verstrekte nummers, alsmede de in het eerste lid, onder b, bedoelde gegevens worden door de beheerders,
      bedoeld in het eerste lid, vastgelegd met het oog op de hulpverlening in noodsituaties of de bestrijding van
      het misbruik van een alarmnummer voor publieke diensten. De beheerders zijn verantwoordelijke in de zin van
      [artikel 1, onderdeel d, van de Wet bescherming persoonsgegevens][ref1] voor deze vastlegging.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel1
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel11.10
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '1'
  - number: 11.10.3
    text: |-
      Verstrekking van nummers en gegevens door de beheerder vindt slechts plaats met het oog op de hulpverlening in
      noodsituaties of de bestrijding van het misbruik van een alarmnummer voor publieke diensten. De beheerder is
      verantwoordelijke in de zin van [artikel 1, onderdeel d, van de Wet bescherming persoonsgegevens][ref1] voor deze
      verstrekkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel1
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel11.10
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '1'
  - number: 11.10.4
    text: |-
      Verstrekking van nummers en gegevens met het oog op de hulpverlening in noodsituaties vindt slechts plaats aan de
      door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, in overeenstemming met Onze Minister, aangewezen
      publieke diensten belast met hulpverleningstaken.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel11.10
  - number: 11.10.5
    text: |-
      Verstrekking van nummers en gegevens met het oog op de bestrijding van het misbruik van een alarmnummer
      voor publieke diensten vindt slechts plaats aan degene die op grond van [artikel 141][ref1] of
      [142 van het Wetboek van Strafvordering][ref2] is belast met de opsporing van strafbare feiten.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel142
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel11.10
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '142'
  - number: 11.10.6
    text: 'De termijn gedurende welke de nummers en gegevens door de beheerder worden bewaard bedraagt ten hoogste:'
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel11.10
  - number: 11.10.6.a
    text: |-
      een maand indien de nummers en gegevens betrekking hebben op gevallen waarin kennelijk sprake is van een verzoek om
      hulpverlening in een noodsituatie;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel11.10
  - number: 11.10.6.b
    text: |-
      zes maanden indien de nummers en gegevens betrekking hebben op gevallen waarin kennelijk sprake is van misbruik van
      een alarmnummer voor publieke diensten;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel11.10
  - number: 11.10.6.c
    text: 24 uur in alle overige gevallen.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel11.10
  - number: 11.10.7
    text: |-
      De op grond van het eerste lid aangewezen beheerder vergoedt de kosten die zijn gemoeid met het verstrekken van de
      in het eerste lid, onder a en b, bedoelde gegevens.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel11.10
  - number: 11.10.8
    text: |-
      De bekendmaking van het besluit tot aanwijzing van de beheerders, bedoeld in het eerste lid, en de publieke
      diensten, bedoeld in het vierde lid, geschiedt door plaatsing in de Staatscourant door Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel11.10
  - number: 11.10.9
    text: |-
      De beheerders, bedoeld in het eerste lid, zijn bevoegd om ten behoeve van de controle op de effectiviteit van de
      hulpverlening in noodsituaties de bij het alarmnummer voor publieke diensten ingekomen oproepen vast te leggen
      en voor ten hoogste een maand te bewaren. Bij de vastlegging worden de datum en het tijdstip van de oproep
      geregistreerd.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel11.10
  - number: '12.1'
    text: |-
      Aanbieders van een vaste openbare telefoondienst, een mobiele openbare telefoondienst of andere bij algemene
      maatregel van bestuur aan te wijzen openbare telecommunicatiediensten sluiten zich aan bij een van overheidswege
      erkende geschillencommissie welke geschillen behandelt over een overeenkomst met betrekking tot de levering
      van een telecommunicatiedienst tussen een vorenbedoelde aanbieder en een natuurlijk persoon die uitsluitend of
      hoofdzakelijk anders dan in de uitoefening van een beroep of bedrijf handelt.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel12.1
  - number: 13.1.1
    text: |-
      Aanbieders van openbare telecommunicatienetwerken en openbare telecommunicatiediensten stellen hun
      telecommunicatienetwerken en telecommunicatiediensten uitsluitend beschikbaar aan gebruikers indien deze aftapbaar
      zijn.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel13.1
  - number: 13.1.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de technische
      aftapbaarheid van openbare telecommunicatienetwerken en openbare telecommunicatiediensten.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel13.1
  - number: 13.2.1
    text: |-
      Aanbieders van openbare telecommunicatienetwerken zijn verplicht medewerking te verlenen aan
      de uitvoering van een bevoegd gegeven bijzondere last dan wel een toestemming op grond van de
      [Wet op de inlichtingen- en veiligheidsdiensten 2002][ref1] tot het aftappen of opnemen van telecommunicatie die
      over hun telecommunicatienetwerken wordt afgewikkeld.


      [ref1]: https://wetten.overheid.nl/BWBR0013409
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel13.2
    references:
      - id: ref1
        bwb_id: BWBR0013409
  - number: 13.2.2
    text: |-
      Aanbieders van openbare telecommunicatiediensten zijn verplicht medewerking te verlenen aan
      de uitvoering van een bevoegd gegeven bijzondere last dan wel een toestemming op grond van de
      [Wet op de inlichtingen- en veiligheidsdiensten 2002][ref1] tot het aftappen of opnemen van door hen verzorgde
      telecommunicatie.


      [ref1]: https://wetten.overheid.nl/BWBR0013409
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel13.2
    references:
      - id: ref1
        bwb_id: BWBR0013409
  - number: 13.2.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de te nemen
      organisatorische en personele maatregelen en te treffen voorzieningen met betrekking tot aftappen.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel13.2
  - number: '13.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het beslechten van geschillen
      tussen aanbieders en de bevoegde autoriteiten over de voorzieningen door middel van welke de door een tap te
      verkrijgen telecommunicatie door aanbieders wordt doorgegeven.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel13.3
  - number: 13.4.1
    text: |-
      Aanbieders van openbare telecommunicatienetwerken en openbare telecommunicatiediensten zijn verplicht aan de
      autoriteiten de informatie te verstrekken die noodzakelijk is om die autoriteiten in staat te stellen de bij de
      wet in het belang van de strafvordering of in het belang van de veiligheid van de staat geregelde bevoegdheden
      tot het aftappen of opnemen van telecommunicatie, dan wel tot het vorderen van gegevens ter zake van alle verkeer
      dat over een openbaar telecommunicatienetwerk, dan wel met gebruikmaking van openbare telecommunicatiediensten,
      plaatsvindt, te kunnen uitoefenen. Deze verplichting omvat het desgevraagd aan de autoriteiten meedelen van het aan
      een gebruiker verleende nummer en de door hem afgenomen openbare telecommunicatiedienst, en het desgevraagd aan de
      autoriteiten meedelen van de bij een nummer behorende naam-, adres-, postcode- en woonplaatsgegevens.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel13.4
  - number: 13.4.2
    text: |-
      Indien de in het eerste lid bedoelde informatie niet bij de aanbieders van openbare telecommunicatienetwerken en
      openbare telecommunicatiediensten bekend is, zijn zij verplicht de informatie te achterhalen en te verstrekken op
      een bij algemene maatregel van bestuur te bepalen wijze. Teneinde aan deze verplichting te kunnen voldoen, bewaren
      de aanbieders de daartoe benodigde, bij algemene maatregel van bestuur aan te wijzen gegevens, voor een termijn van
      drie maanden, nadat de gegevens voor het eerst zijn verwerkt.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel13.4
  - number: 13.4.3
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de wijze van verstrekking van de
      informatie, bedoeld in het eerste lid, en de wijze waarop daartoe de gegevens beschikbaar worden gehouden.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel13.4
  - number: 13.5.1
    text: |-
      Aanbieders van openbare telecommunicatienetwerken en openbare telecommunicatiediensten zijn
      verplicht gegevens met betrekking tot een bijzondere last dan wel een toestemming op grond van de
      [Wet op de inlichtingen- en veiligheidsdiensten 2002][ref1] als bedoeld in [artikel 13.2][ref2] en
      informatieverstrekkingen als bedoeld in [artikel 13.4][ref3] te beveiligen tegen kennisneming door onbevoegden
      alsmede geheimhouding te betrachten met betrekking tot deze gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0013409
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel13
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel13.5
    references:
      - id: ref1
        bwb_id: BWBR0013409
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '13'
        hoofdstuk: '13'
      - id: ref3
        bwb_id: BWBR0009950
        artikel: '13'
        hoofdstuk: '13'
  - number: 13.5.2
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de te nemen maatregelen in
      verband met de beveiliging, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel13.5
  - number: 13.6.1
    text: |-
      De investerings-, exploitatie- en onderhoudskosten voor de technische voorzieningen die door aanbieders van
      openbare telecommunicatienetwerken en openbare telecommunicatiediensten zijn of worden gemaakt teneinde te kunnen
      voldoen aan de [artikelen 13.1][ref1], [13.4][ref2], en [13.5][ref3] komen te hunnen laste.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel13
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel13.6
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '13'
        hoofdstuk: '13'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '13'
        hoofdstuk: '13'
      - id: ref3
        bwb_id: BWBR0009950
        artikel: '13'
        hoofdstuk: '13'
  - number: 13.6.2
    text: |-
      Aanbieders van openbare telecommunicatienetwerken en openbare telecommunicatiediensten hebben
      aanspraak op vergoeding uit 's Rijks kas van de door hen gemaakte administratiekosten en
      personeelskosten rechtstreeks voortvloeiend uit het voldoen aan een bijzondere last dan wel een
      toestemming op grond van de [Wet op de inlichtingen- en veiligheidsdiensten 2002][ref1] als bedoeld in
      [artikel 13.2, eerste en tweede lid][ref2], onderscheidenlijk het verstrekken van informatie als bedoeld in
      [artikel 13.4][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0013409
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel13
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel13.6
    references:
      - id: ref1
        bwb_id: BWBR0013409
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '13'
        hoofdstuk: '13'
      - id: ref3
        bwb_id: BWBR0009950
        artikel: '13'
        hoofdstuk: '13'
  - number: 13.6.3
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot de vaststelling en vergoeding van de kosten,
      bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel13.6
  - number: '13.8'
    text: |-
      Van de verplichtingen die voortvloeien uit dit hoofdstuk kan Onze Minister in overeenstemming met Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties, Onze Minister van Defensie en Onze Minister van Justitie in bijzondere
      gevallen ontheffing verlenen. Een ontheffing kan onder beperkingen worden verleend. Aan een ontheffing kunnen
      voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel13.8
  - number: '14.1'
    text: |-
      In bijzondere omstandigheden in verband met de handhaving van de internationale rechtsorde of met de internationale
      betrekkingen is Onze Minister bevoegd in overeenstemming met Onze Minister van Buitenlandse Zaken aan aanbieders
      van openbare telecommunicatienetwerken, openbare telecommunicatiediensten en huurlijnen aanwijzingen te geven met
      betrekking tot de verzorging van telecommunicatie van en naar het buitenland.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel14.1
  - number: 14.2.1
    text: |-
      Onverminderd de [artikelen 7, eerste lid][ref1], en
      [8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref2] kan, ingeval buitengewone omstandigheden dit
      noodzakelijk maken, bij koninklijk besluit, op voordracht van Onze Minister-President, voor het gehele land of een
      deel daarvan [artikel 14.4, eerste tot en met derde lid][ref3], in werking worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007981#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel14
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel14.2
    references:
      - id: ref1
        bwb_id: BWBR0007981
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007981
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0009950
        artikel: '14'
        hoofdstuk: '14'
  - number: 14.2.2
    text: |-
      Wanneer het in het eerste lid bedoelde besluit is genomen wordt onverwijld een voorstel van wet aan de Tweede
      Kamer der Staten-Generaal gezonden omtrent het voortduren van de werking van de bij dat besluit in werking gestelde
      bepalingen.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel14.2
  - number: 14.2.3
    text: |-
      Wordt het voorstel van wet door de Staten-Generaal verworpen, dan worden bij koninklijk besluit, op voordracht
      van Onze Minister-President, de bepalingen die ingevolge het eerste lid in werking zijn gesteld, onverwijld buiten
      werking gesteld.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel14.2
  - number: 14.2.4
    text: |-
      Bij koninklijk besluit, op voordracht van Onze Minister-President, worden de bepalingen die ingevolge het eerste
      lid in werking zijn gesteld, buiten werking gesteld, zodra de omstandigheden dit naar Ons oordeel toelaten.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel14.2
  - number: 14.2.5
    text: |-
      Het besluit, bedoeld in het eerste, derde en vierde lid, wordt op de daarin te bepalen wijze bekendgemaakt. Het
      treedt in werking terstond na de bekendmaking.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel14.2
  - number: 14.2.6
    text: Het besluit, bedoeld in het eerste, derde en vierde lid, wordt in ieder geval geplaatst in het Staatsblad.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel14.2
  - number: '14.3'
    text: |-
      Ingeval voor Nederland of een gedeelte daarvan, op grond van de [artikelen 7, eerste lid][ref1], en
      [8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref2], bepalingen uit de Oorlogswet voor Nederland
      in werking zijn gesteld, oefent Onze Minister de in [artikel 14.4, eerste lid][ref3], bedoelde bevoegdheden uit in
      overeenstemming met Onze Minister van Defensie.


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007981#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel14
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel14.3
    references:
      - id: ref1
        bwb_id: BWBR0007981
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007981
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0009950
        artikel: '14'
        hoofdstuk: '14'
  - number: 14.4.1
    text: |-
      Onze Minister is bevoegd aan aanbieders van openbare telecommunicatienetwerken, openbare telecommunicatiediensten,
      huurlijnen en aan gebruikers van de frequentieruimte aanwijzingen te geven met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel14.4
  - number: 14.4.1.a
    text: de instandhouding en exploitatie van hun openbare telecommunicatienetwerken;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel14.4
  - number: 14.4.1.b
    text: het verzorgen en het gebruiken van hun openbare telecommunicatiediensten;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel14.4
  - number: 14.4.1.c
    text: de instandhouding en exploitatie dan wel beperking of beëindiging van het gebruik van hun radiozendapparaten, en
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel14.4
  - number: 14.4.1.d
    text: |-
      het ter beschikking stellen van huurlijnen en het gebruik daarvan, van, naar of in het gebied waarvoor een besluit
      als bedoeld in [artikel 14.2, eerste lid][ref1], van kracht is.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel14
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel14.4
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '14'
        hoofdstuk: '14'
  - number: 14.4.2
    text: |-
      Onze Minister kan bij toepassing van het eerste lid afwijken van de verplichtingen die ingevolge deze wet op
      aanbieders van openbare telecommunicatienetwerken, openbare telecommunicatiediensten, huurlijnen en op gebruikers
      van de frequentieruimte rusten.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel14.4
  - number: 14.4.3
    text: |-
      De aanwijzingen die ingevolge het eerste lid aan aanbieders van openbare telecommunicatienetwerken, openbare
      telecommunicatiediensten, huurlijnen en aan gebruikers van de frequentieruimte zijn gegeven, zijn voor deze
      verbindend.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel14.4
  - number: 14.4.4
    text: |-
      Indien aanbieders van openbare telecommunicatienetwerken, openbare telecommunicatiediensten, huurlijnen en
      gebruikers van de frequentieruimte als gevolg van aanwijzingen gegeven op grond van het eerste lid onevenredig
      financieel nadeel ondervinden, kent Onze Minister hen een naar billijkheid te bepalen vergoeding toe.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel14.4
  - number: 14.5.1
    text: |-
      Bij toepassing van artikel 14 van de Wet buitengewone bevoegdheden burgerlijk gezag zijn aanbieders van openbare
      telecommunicatienetwerken, openbare telecommunicatiediensten, huurlijnen en gebruikers van de frequentieruimte
      verplicht de op grond van het eerste lid van genoemd artikel aangewezen autoriteiten alle medewerking te verlenen,
      daaronder begrepen het uitvoeren van door die autoriteiten gegeven opdrachten.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel14.5
  - number: 14.5.2
    text: |-
      Bij toepassing van artikel 31 van de Oorlogswet voor Nederland zijn aanbieders van openbare
      telecommunicatienetwerken, openbare telecommunicatiediensten, huurlijnen en gebruikers van de frequentieruimte
      verplicht het militair gezag alle medewerking te verlenen, daaronder begrepen het uitvoeren van door dat gezag
      gegeven opdrachten.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel14.5
  - number: 14.6.1
    text: |-
      Onze Minister kan na overleg met Onze Ministers van Binnenlandse Zaken en Koninkrijksrelaties en van Defensie
      voor aanbieders van openbare telecommunicatienetwerken, openbare telecommunicatiediensten, huurlijnen en voor
      gebruikers van de frequentieruimte regels stellen ten aanzien van de door hen te nemen organisatorische en
      personele maatregelen en te treffen bijzondere voorzieningen met betrekking tot de voorbereiding van het verzorgen
      van elektronisch transport van gegevens in buitengewone omstandigheden als bedoeld in [artikel 14.2][ref1] en
      de door hen daarover aan Onze Minister te verstrekken informatie. Bij deze regeling wordt bepaald welke kosten
      van de uitvoering redelijkerwijze ten laste van aanbieders van openbare telecommunicatienetwerken, openbare
      telecommunicatiediensten, huurlijnen en van gebruikers van de frequentieruimte dienen te komen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel14
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel14.6
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '14'
        hoofdstuk: '14'
  - number: 14.6.2
    text: 'De in het eerste lid bedoelde bijzondere voorzieningen hebben betrekking op:'
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel14.6
  - number: 14.6.2.a
    text: |-
      de beschikbaarheid van openbare telecommunicatienetwerken dan wel delen daarvan, openbare telecommunicatiediensten,
      radiozendapparaten en huurlijnen;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel14.6
  - number: 14.6.2.b
    text: de beveiliging van bepaalde onderdelen van een openbaar telecommunicatienetwerk of van radiozendapparaten;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel14.6
  - number: 14.6.2.c
    text: de afwikkeling van het elektronisch transport van gegevens over een openbaar telecommunicatienetwerk, en
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel14.6
  - number: 14.6.2.d
    text: aanvullende infrastructurele voorzieningen voor het elektronisch transport van gegevens en de beveiliging daarvan.
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel14.6
  - number: 15.1.1
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van Onze
      Minister aangewezen ambtenaren, voorzover het betreft de bepalingen die betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel15.1
  - number: 15.1.1.a
    text: |-
      het gebruik van frequentieruimte, met uitzondering van die bepalingen die betrekking hebben op het aanbieden van
      openbare telecommunicatienetwerken of openbare telecommunicatiediensten en niet zien op de technische aspecten van
      het gebruik;
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel15.1
  - number: 15.1.1.b
    text: |-
      omroepzendernetwerken, te weten [artikel 8.3][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel8
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel15.1
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '8.1'
  - number: 15.1.1.c
    text: |-
      het verstrekken van een opdracht tot verzorging van tot de universele dienst behorende diensten of voorzieningen,
      te weten [artikel 9.2, vierde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel9
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel15.1
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '9'
        hoofdstuk: '9'
  - number: 15.1.1.d
    text: |-
      de aan apparatuur te stellen eisen, te weten [hoofdstuk 10][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk10
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel15.1
    references:
      - id: ref1
        bwb_id: BWBR0009950
        hoofdstuk: '10'
  - number: 15.1.1.e
    text: |-
      bevoegd aftappen, te weten [hoofdstuk 13][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk13
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel15.1
    references:
      - id: ref1
        bwb_id: BWBR0009950
        hoofdstuk: '13'
  - number: 15.1.1.f
    text: |-
      buitengewone omstandigheden, te weten [hoofdstuk 14][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk14
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel15.1
    references:
      - id: ref1
        bwb_id: BWBR0009950
        hoofdstuk: '14'
  - number: 15.1.1.g
    text: |-
      verdere onderwerpen, te weten de [artikelen 18.1][ref1], voorzover het bevoegdheden betreft van Onze Minister,
      [18.2][ref2], voorzover het bevoegdheden betreft van Onze Minister, [18.4, tweede lid][ref3], [18.7][ref4],
      voorzover het bevoegdheden betreft van Onze Minister, [18.9][ref5], [18.12][ref6], voorzover het bevoegdheden
      betreft van Onze Minister, [20.2][ref7], voorzover het bevoegdheden betreft van Onze Minister, en [20.14][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0009950#Artikel18
      [ref5]: https://wetten.overheid.nl/BWBR0009950#Artikel18
      [ref6]: https://wetten.overheid.nl/BWBR0009950#Artikel18
      [ref7]: https://wetten.overheid.nl/BWBR0009950#Artikel20
      [ref8]: https://wetten.overheid.nl/BWBR0009950#Artikel20
    url: https://wetten.overheid.nl/BWBR0009950/2002-05-29#Artikel15.1
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '18'
        hoofdstuk: '18'
      - id: ref2
