  - number: 15.1.2
    text: |-
      Met het toezicht op de naleving van [artikel 6a.20, derde lid][ref1], zijn belast de bij besluit van de directeur-
      generaal van de Nederlandse mededingingsautoriteit aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel15.1
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.6
  - number: 15.1.3
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens andere bepalingen van deze wet dan bedoeld in het
      eerste en tweede lid zijn belast de bij besluit van het college aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel15.1
  - number: 15.1.4
    text: |-
      Van een besluit als bedoeld in het eerste, tweede, en derde lid wordt mededeling gedaan door plaatsing in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel15.1
  - number: 15.2.1
    text: |-
      Onze Minister is bevoegd tot toepassing van bestuursdwang ter handhaving van de verplichtingen, gesteld bij of
      krachtens de in [artikel 15.1, eerste lid][ref1], bedoelde bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel15
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel15.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '15.1'
  - number: 15.2.2
    text: |-
      Het college is bevoegd tot toepassing van bestuursdwang ter handhaving van de verplichtingen, gesteld bij of
      krachtens de in [artikel 15.1, derde lid][ref1], bedoelde bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel15
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel15.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '15.1'
  - number: 15.2.3
    text: |-
      Ingeval van overtreding van [artikel 6a.20, derde lid][ref1], kan de directeur-generaal van
      de Nederlandse mededingingsautoriteit de overtreder een last onder dwangsom opleggen. De
      [artikelen 56, tweede tot en met vierde lid][ref2], en [58 van de Mededingingswet][ref3] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel56
      [ref3]: https://wetten.overheid.nl/BWBR0008691#Artikel58
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel15.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.6
      - id: ref2
        bwb_id: BWBR0008691
        artikel: '56'
      - id: ref3
        bwb_id: BWBR0008691
        artikel: '58'
  - number: 15.2.4
    text: |-
      Voor de toepassing van het eerste lid, is vereiste spoed als bedoeld in
      [artikel 5:24, vijfde lid, van de Algemene wet bestuursrecht][ref1] in elk geval aanwezig indien het niet naleven
      van de in het eerste lid bedoelde bepalingen een ernstige en directe bedreiging vormt voor de openbare orde, de
      openbare veiligheid of de volksgezondheid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel15.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 15.2.5
    text: |-
      Voor de toepassing van het tweede lid, is vereiste spoed als bedoeld in
      [artikel 5:24, vijfde lid, van de Algemene wet bestuursrecht][ref1] in elk geval aanwezig indien het niet
      naleven van de in het tweede lid bedoelde bepalingen ernstige economische of bedrijfstechnische problemen
      tot gevolg zal hebben voor andere aanbieders van een openbaar elektronisch communicatienetwerk, een openbare
      elektronische communicatiedienst of bijbehorende faciliteiten of voor gebruikers van een openbaar elektronisch
      communicatienetwerk, of een openbare elektronische communicatiedienst.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel15.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 15.2a.1
    text: |-
      Onze Minister is bevoegd een aanbieder van openbare elektronische communicatienetwerken of -diensten bij ernstig en
      herhaaldelijk niet-nakomen van de verplichtingen gesteld bij of krachtens de in [artikel 15.1, eerste lid][ref1],
      bedoelde bepalingen, wanneer de krachtens [artikel 15.2][ref2] of [15.4][ref3] opgelegde maatregelen tot naleving
      van de bedoelde verplichtingen hebben gefaald, voor een door Onze Minister te bepalen redelijke termijn te
      verbieden nog langer elektronische communicatienetwerken of -diensten aan te bieden.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel15
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel15.2a
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '15.1'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '15.1'
      - id: ref3
        bwb_id: BWBR0009950
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '15.2'
  - number: 15.2a.2
    text: |-
      Het college is bevoegd een aanbieder van openbare elektronische communicatienetwerken of -diensten bij ernstig en
      herhaaldelijk niet-nakomen van de verplichtingen gesteld bij of krachtens de in [artikel 15.1, derde lid][ref1],
      bedoelde bepalingen, wanneer de krachtens [artikel 15.2][ref2] of [15.4][ref3] opgelegde maatregelen tot naleving
      van de bedoelde verplichtingen hebben gefaald, voor een door het college te bepalen redelijke termijn te verbieden
      nog langer elektronische communicatienetwerken of -diensten aan te bieden.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel15
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel15.2a
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '15.1'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '15.1'
      - id: ref3
        bwb_id: BWBR0009950
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '15.2'
  - number: 15.2a.3
    text: |-
      Een besluit als bedoeld in het eerste of tweede lid, inhoudende een verbod tot het aanbieden van elektronische
      communicatienetwerken of -diensten voldoet in elk geval aan de volgende eisen:
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel15.2a
  - number: 15.2a.3.a
    text: |-
      het verbod is niet in strijd met een of meer doelstellingen als bedoeld in [artikel 1.3][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel1
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel15.2a
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '1'
        hoofdstuk: '1'
  - number: 15.2a.3.b
    text: |-
      het verbod leidt niet tot het niet na kunnen komen door de onderneming van een bij of krachtens de wet opgelegde
      leveringsplicht;
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel15.2a
  - number: 15.2a.3.c
    text: |-
      het verbod heeft slechts betrekking op het netwerk of de dienst ten aanzien waarvan de in het eerste of tweede lid
      bedoelde verplichtingen niet zijn nagekomen;
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel15.2a
  - number: 15.2a.3.d
    text: |-
      het verbod heeft geen ernstige economische of maatschappelijke problemen tot gevolg voor andere aanbieders van
      een openbaar elektronisch communicatienetwerk, een openbare elektronische communicatiedienst of bijbehorende
      faciliteiten, of voor gebruikers van een openbaar elektronisch communicatienetwerk of een openbare elektronische
      communicatiedienst.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel15.2a
  - number: 15.2a.4
    text: |-
      Van een besluit als bedoeld in het eerste of tweede lid wordt door Onze Minister, onderscheidenlijk het college,
      mededeling gedaan in de Staatscourant. Het treedt niet eerder in werking dan twee weken na die mededeling.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel15.2a
  - number: '15.3'
    text: |-
      Indien niet wordt voldaan aan de bij of krachtens deze wet gestelde regels ten aanzien van de aanleg of het gebruik
      van radiozendapparaten, is Onze Minister bevoegd om aan de houder van een desbetreffend radiozendapparaat een
      geheel of gedeeltelijk zendverbod op te leggen.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel15.3
  - number: 15.4.1
    text: |-
      Ingeval van overtreding van de bij of krachtens de in [artikel 15.1, eerste lid][ref1], bedoelde voorschriften,
      alsmede van [artikel 5:20 van de Algemene wet bestuursrecht][ref2], kan Onze Minister de overtreder een boete
      opleggen van ten hoogste € 450 000.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel15.4
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '15.1'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 15.4.2
    text: |-
      Het college kan aan een onderneming een boete opleggen van ten hoogste € 450 000, of, indien dat meer is, 10% van
      de relevante omzet van de onderneming in Nederland, ingeval van:
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel15.4
  - number: 15.4.2.a
    text: |-
      overtreding van de bij of krachtens [hoofdstuk 6a][ref1] gestelde voorschriften, met uitzondering van
      [artikel 6a.20][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk6a
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel15.4
    references:
      - id: ref1
        bwb_id: BWBR0009950
        hoofdstuk: 6a
      - id: ref2
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.6
  - number: 15.4.2.b
    text: |-
      overtreding van een op grond van [artikel 12.2][ref1] genomen besluit, voor zover de overtreding geschiedt
      door een onderneming die beschikt over een aanmerkelijke marktmacht en betrekking heeft op een bij of krachtens
      [hoofdstuk 6a][ref2] gesteld voorschrift, met uitzondering van [artikel 6a.20][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk6a
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel15.4
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '12'
        hoofdstuk: '12'
        paragraaf: '12.2'
      - id: ref2
        bwb_id: BWBR0009950
        hoofdstuk: 6a
      - id: ref3
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.6
  - number: 15.4.3
    text: |-
      De directeur-generaal van de Nederlandse mededingingsautoriteit kan aan een onderneming een boete opleggen van ten
      hoogste € 450 000, of, indien dat meer is, 10% van de relevante omzet van de onderneming in Nederland, ingeval van
      overtreding van [artikel 6a.20][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel15.4
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.6
  - number: 15.4.4
    text: |-
      Ingeval van overtreding van de bij of krachtens de in [artikel 15.1, derde lid][ref1],
      bedoelde voorschriften, niet zijnde de voorschriften, bedoeld in het tweede lid, alsmede van
      [artikel 5:20 van de Algemene wet bestuursrecht][ref2], kan het college aan de overtreder een boete opleggen van
      ten hoogste € 450 000.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel15.4
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '15.1'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 15.4.5
    text: |-
      De hoogte van de boete wordt in ieder geval afgestemd op de ernst en de duur van de overtreding, alsmede op de mate
      waarin de overtreder daarvan een verwijt kan worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel15.4
  - number: 15.4.6
    text: |-
      De bevoegdheid tot het opleggen van een boete vervalt indien ter zake van de overtreding op grond waarvan
      de boete kan worden opgelegd, tegen de overtreder een strafvervolging is ingesteld en het onderzoek ter
      terechtzitting een aanvang heeft genomen, dan wel het recht tot strafvervolging is vervallen ingevolge
      [artikel 37 van de Wet op de economische delicten][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel37
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel15.4
    references:
      - id: ref1
        bwb_id: BWBR0002063
        artikel: '37'
  - number: 15.4.7
    text: |-
      Het recht tot strafvervolging vervalt indien Onze Minister, onderscheidenlijk het college, aan betrokkene terzake
      van hetzelfde feit reeds een boete heeft opgelegd.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel15.4
  - number: 15.4.8
    text: 'Als relevante omzet als bedoeld in het tweede en derde lid wordt aangemerkt de omzet van de onderneming:'
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel15.4
  - number: 15.4.8.a
    text: |-
      in het boekjaar voorafgaande aan de beschikking, bedoeld in [artikel 15.10][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel15
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel15.4
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '15.2'
  - number: 15.4.8.b
    text: |-
      berekend op de voet van [artikel 337, zesde lid, van boek 2 van het Burgerlijk Wetboek][ref1] voor de netto-omzet
      en


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel337
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel15.4
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '337'
  - number: 15.4.8.c
    text: |-
      voor zover betrekking hebbend op de omzet die de desbetreffende onderneming had bij het aanbieden van openbare
      elektronische communicatienetwerken, openbare elektronische communicatiediensten en bijbehorende faciliteiten.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel15.4
  - number: 15.5.1
    text: |-
      Met het onderzoek zijn belast de ambtenaren, bedoeld in
      [artikel 15.1, eerste, tweede, onderscheidenlijk derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel15
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel15.5
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '15.1'
  - number: 15.5.2
    text: |-
      Ten dienste van het onderzoek beschikken zij over de bevoegdheden die hun in deze paragraaf
      worden toegekend, alsmede, met inachtneming van de daaraan in deze paragraaf gestelde beperkingen,
      over de bevoegdheden die hun zijn toegekend ter uitoefening van het toezicht, bedoeld in
      [artikel 15.1, eerste lid, onderscheidenlijk derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel15
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel15.5
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '15.1'
  - number: '15.6'
    text: |-
      Indien de ambtenaren, bedoeld in [artikel 15.1, eerste, tweede, onderscheidenlijk derde lid][ref1], in het kader
      van het onderzoek bedoeld in [artikel 15.5][ref2], een redelijk vermoeden hebben dat een bepaalde natuurlijke
      persoon of rechtspersoon een overtreding heeft begaan, is er geen verplichting aan de zijde van die natuurlijke
      persoon of rechtspersoon terzake een verklaring af te leggen. De betrokkenen worden hiervan in kennis gesteld
      voordat hun mondeling terzake om informatie wordt gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel15
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel15.6
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '15.1'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '15.2'
  - number: 15.7.1
    text: |-
      De ambtenaren, bedoeld in [artikel 15.1, eerste, tweede, onderscheidenlijk derde lid][ref1], zijn
      bevoegd om bedrijfsruimten en voorwerpen te verzegelen, voorzover dat voor de uitoefening van de in
      [artikel 5:17 van de Algemene wet bestuursrecht][ref2] bedoelde bevoegdheden redelijkerwijs noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel15.7
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '15.1'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 15.7.2
    text: |-
      De ambtenaren, bedoeld in [artikel 15.1, eerste, tweede, onderscheidenlijk derde lid][ref1], oefenen de hun in
      [artikel 5:17 van de Algemene wet bestuursrecht][ref2] toegekende bevoegdheid zo nodig uit met behulp van de sterke
      arm.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel15.7
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '15.1'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 15.8.1
    text: |-
      Indien een ambtenaar als bedoeld in [artikel 15.1, eerste, tweede, onderscheidenlijk derde lid][ref1], vaststelt
      dat een overtreding is begaan, maakt hij daarvan een rapport op.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel15
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel15.8
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '15.1'
  - number: 15.8.2
    text: 'In het rapport worden in ieder geval vermeld:'
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel15.8
  - number: 15.8.2.a
    text: de feiten en omstandigheden op grond waarvan is vastgesteld dat een overtreding is begaan;
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel15.8
  - number: 15.8.2.b
    text: waar en wanneer de feiten, bedoeld onder a, zich hebben voorgedaan;
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel15.8
  - number: 15.8.2.c
    text: het overtreden wettelijk voorschrift.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel15.8
  - number: 15.8.3
    text: Een kopie van het rapport wordt gezonden aan degene die de overtreding heeft begaan.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel15.8
  - number: 15.8.4
    text: |-
      Op verzoek van de belanghebbende die het rapport wegens zijn gebrekkige kennis van de Nederlandse taal onvoldoende
      begrijpt, draagt Onze Minister, het college, onderscheidenlijk de directeur-generaal van de Nederlandse
      mededingingsautoriteit, er zoveel mogelijk zorg voor dat de inhoud van het rapport aan de betrokkene wordt
      meegedeeld in een voor hem begrijpelijke taal.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel15.8
  - number: 15.9.1
    text: |-
      In afwijking van [afdeling 4.1.2 van de Algemene wet bestuursrecht][ref1] wordt de belanghebbende schriftelijk
      opgeroepen om naar keuze schriftelijk of mondeling zijn zienswijze naar voren te brengen omtrent het in
      [artikel 15.8, eerste lid][ref2], bedoelde rapport.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.2
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel15
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel15.9
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.1.2
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '15.2'
  - number: 15.9.2
    text: |-
      Indien de belanghebbende zijn zienswijze mondeling naar voren brengt, draagt Onze Minister, het college,
      onderscheidenlijk de directeur-generaal van de Nederlandse mededingingsautoriteit, er op verzoek van de
      belanghebbende die de Nederlandse taal onvoldoende begrijpt, zorg voor dat een tolk wordt benoemd die de
      belanghebbende bij het horen kan bijstaan, tenzij redelijkerwijs kan worden aangenomen dat daaraan geen behoefte
      bestaat.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel15.9
  - number: 15.10.1
    text: 'Bij beschikking wordt opgelegd:'
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel15.10
  - number: 15.10.1.a
    text: |-
      een boete als bedoeld in [artikel 15.4, eerste lid][ref1]: door Onze Minister;


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel15
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel15.10
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '15.2'
  - number: 15.10.1.b
    text: |-
      een boete als bedoeld in [artikel 15.4, tweede of vierde lid][ref1]: door het college;


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel15
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel15.10
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '15.2'
  - number: 15.10.1.c
    text: |-
      een boete als bedoeld in [artikel 15.4, derde lid][ref1], en een last onder dwangsom als bedoeld in
      [artikel 15.2, derde lid][ref2]: door de directeur-generaal van de Nederlandse mededingingsautoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel15
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel15.10
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '15.2'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '15.1'
  - number: 15.10.2
    text: 'In de beschikking wordt in elk geval vermeld:'
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel15.10
  - number: 15.10.2.a
    text: de overtreding terzake waarvan zij is gegeven, alsmede het overtreden wettelijk voorschrift;
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel15.10
  - number: 15.10.2.b
    text: indien een boete wordt opgelegd de te betalen geldsom, alsmede een toelichting op de hoogte daarvan;
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel15.10
  - number: 15.10.2.c
    text: indien een last wordt opgelegd de inhoud van de last en de termijn waarvoor deze geldt.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel15.10
  - number: 15.10.3
    text: |-
      Op verzoek van de overtreder die de beschikking wegens zijn gebrekkige kennis van de Nederlandse taal onvoldoende
      begrijpt, draagt Onze Minister, het college, onderscheidenlijk de directeur-generaal van de Nederlandse
      mededingingsautoriteit, er zoveel mogelijk zorg voor dat de in die beschikking vermelde informatie aan de
      overtreder wordt meegedeeld in een voor hem begrijpelijke taal.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel15.10
  - number: 15.10.4
    text: |-
      De beschikking dient te worden gegeven binnen twaalf weken nadat het rapport, bedoeld in
      [artikel 15.8, eerste lid][ref1], is opgemaakt, tenzij binnen deze termijn het rapport aan het openbaar ministerie
      is gezonden. In dat geval kan een boete worden opgelegd binnen twaalf weken nadat het openbaar ministerie aan Onze
      Minister, het college, onderscheidenlijk de directeur-generaal van de Nederlandse mededingingsautoriteit, heeft
      meegedeeld dat geen strafvervolging wordt ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel15
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel15.10
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '15.2'
  - number: '15.11'
    text: |-
      De werkzaamheden die verband houden met de uitvoering van de [artikelen 15.9][ref1] en [15.10][ref2] worden
      verricht door personen die niet betrokken zijn geweest bij de opstelling van het in [artikel 15.8][ref3] bedoelde
      rapport en het daaraan voorafgaande onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel15
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel15.11
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '15.2'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '15.2'
      - id: ref3
        bwb_id: BWBR0009950
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '15.2'
  - number: '15.12'
    text: |-
      De werking van een beschikking als bedoeld in [artikel 15.10, eerste lid][ref1], wordt opgeschort totdat de
      beroepstermijn is verstreken of, indien beroep is ingesteld, op het beroep is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel15
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel15.12
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '15.2'
  - number: 15.13.1
    text: Een boete wordt betaald binnen zes weken nadat de beschikking waarbij de boete is opgelegd, in werking is getreden.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel15.13
  - number: 15.13.2
    text: |-
      De boete wordt vermeerderd met de wettelijke rente, te rekenen zes weken vanaf de dag waarop de in het eerste lid
      genoemde beschikking is bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel15.13
  - number: 15.13.3
    text: |-
      Indien niet is betaald binnen de in het eerste lid genoemde termijn, wordt degene die de boete is verschuldigd
      schriftelijk bevolen binnen twee weken alsnog het bedrag van de boete, verhoogd met de krachtens het tweede lid
      verschuldigde rente en de kosten van de aanmaning, te betalen.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel15.13
  - number: 15.14.1
    text: |-
      Bij gebreke van betaling binnen de termijn van twee weken, bedoeld in [artikel 15.13, derde lid][ref1], kan Onze
      Minister, het college, onderscheidenlijk de directeur-generaal van de Nederlandse mededingingsautoriteit, van de
      overtreder de verschuldigde boete, verhoogd met de krachtens [artikel 15.13, tweede lid][ref2], verschuldigde rente
      en de op de aanmaning en invordering betrekking hebbende kosten, invorderen bij dwangbevel.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel15
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel15.14
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '15.2'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '15.2'
  - number: 15.14.2
    text: |-
      Het dwangbevel wordt op kosten van de overtreder bij deurwaardersexploot betekend en levert een executoriale titel
      op in de zin van het [Tweede Boek van het Wetboek van Burgerlijke Rechtsvordering](onbekend).
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel15.14
  - number: 15.14.3
    text: |-
      Gedurende zes weken na de dag van betekening staat verzet tegen het dwangbevel open door dagvaarding van de staat,
      onderscheidenlijk het college.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel15.14
  - number: 15.14.4
    text: |-
      Het verzet schorst de tenuitvoerlegging. Op verzoek van de staat, onderscheidenlijk het college, kan de rechter de
      schorsing van de tenuitvoerlegging opheffen.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel15.14
  - number: 15.14.5
    text: De in het eerste lid bedoelde bedragen komen toe aan de staat.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel15.14
  - number: '15.15'
    text: |-
      In afwijking van [artikel 5:33, eerste lid, eerste volzin, van de Algemene wet bestuursrecht][ref1] komen verbeurde
      dwangsommen toe aan de staat.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel15.15
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '15.16'
    text: De bevoegdheid tot het opleggen van een boete vervalt vijf jaar nadat de overtreding is begaan.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel15.16
  - number: 16.1.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de vergoeding van de kosten die is
      verschuldigd door degene ten behoeve van wie werkzaamheden of diensten zijn verricht ingevolge het bepaalde bij of
      krachtens deze wet voorzover de vergoeding verband houdt met deze werkzaamheden of diensten.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel16.1
  - number: 16.1.2
    text: |-
      Bij het vaststellen van de vergoeding kunnen mede worden betrokken kosten, verband houdend met het toezicht op de
      naleving van het bepaalde bij of krachtens deze wet ten aanzien van de desbetreffende werkzaamheden of diensten.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel16.1
  - number: 16.1.3
    text: |-
      Voorzover de regels, bedoeld in het eerste lid, betrekking hebben op de vaststelling van de hoogte van de
      vergoeding van de kosten van door het college te verrichten werkzaamheden of diensten, betrekt Onze Minister het
      college bij die vaststelling. De betreffende vergoeding wordt opgelegd door het college en voldaan aan het college.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel16.1
  - number: 16.1.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld betreffende de jaarlijkse bijdrage die is
      verschuldigd door gebruikers van radiozendapparaten ter dekking van de kosten die voor de overheid voortvloeien uit
      de toepassing van het bij of krachtens deze wet terzake van de elektromagnetische compatibiliteit bepaalde.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel16.1
  - number: 16.1.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld betreffende de jaarlijkse bijdrage die is
      verschuldigd door een aanbieder van een openbaar telecommunicatienetwerk ter dekking van de kosten die voor de
      overheid voortvloeien uit de toepassing van het bij of krachtens deze wet terzake van randapparatuur bepaalde.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel16.1
  - number: 17.1.1
    text: |-
      Tegen besluiten die door het college zijn genomen op grond van [hoofdstuk 6][ref1], [6A][ref2], [6B][ref3],
      [12][ref4] of [15][ref5], met uitzondering van besluiten als bedoeld in de [artikelen 15.2a][ref6] en [15.4][ref7],
      kan een belanghebbende beroep instellen bij het College van Beroep voor het bedrijfsleven.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk6a
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk6b
      [ref4]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk12
      [ref5]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk15
      [ref6]: https://wetten.overheid.nl/BWBR0009950#Artikel15
      [ref7]: https://wetten.overheid.nl/BWBR0009950#Artikel15
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel17.1
    references:
      - id: ref1
        bwb_id: BWBR0009950
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0009950
        hoofdstuk: 6a
      - id: ref3
        bwb_id: BWBR0009950
        hoofdstuk: 6b
      - id: ref4
        bwb_id: BWBR0009950
        hoofdstuk: '12'
      - id: ref5
        bwb_id: BWBR0009950
        hoofdstuk: '15'
      - id: ref6
        bwb_id: BWBR0009950
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '15.1'
      - id: ref7
        bwb_id: BWBR0009950
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '15.2'
  - number: 17.1.2
    text: |-
      In afwijking van [artikel 8:7 van de Algemene wet bestuursrecht][ref1] is voor beroep tegen besluiten, niet zijnde
      besluiten als bedoeld in het eerste lid, de rechtbank te Rotterdam bevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel17.1
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 17.1.3
    text: |-
      Ten aanzien van besluiten die door het college zijn genomen op grond van [hoofdstuk 6][ref1], [6A][ref2],
      [6B][ref3], of [12][ref4], blijft [artikel 7:1 van de Algemene wet bestuursrecht][ref5] buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk6a
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk6b
      [ref4]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk12
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel17.1
    references:
      - id: ref1
        bwb_id: BWBR0009950
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0009950
        hoofdstuk: 6a
      - id: ref3
        bwb_id: BWBR0009950
        hoofdstuk: 6b
      - id: ref4
        bwb_id: BWBR0009950
        hoofdstuk: '12'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 18.1.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld om te kunnen onderzoeken of bepaalde
      ontwikkelingen in belangrijke mate kunnen bijdragen aan het bereiken van de doelstellingen van deze wet. Deze
      regels kunnen afwijken van het bij of krachtens deze wet bepaalde.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.1
  - number: 18.1.2
    text: |-
      Bij de voorbereiding van de regels worden de bij de in de regels te behandelen onderwerpen meest betrokken personen
      of instanties betrokken.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.1
  - number: 18.1.3
    text: |-
      Het ontwerp van een regeling krachtens het eerste lid wordt bekendgemaakt in de Staatscourant. Aan eenieder
      wordt de gelegenheid geboden binnen een bij die bekendmaking vast te stellen termijn van ten minste vier weken
      opmerkingen over het ontwerp schriftelijk ter kennis te brengen van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.1
  - number: 18.1.4
    text: |-
      De regels vervallen uiterlijk binnen twee jaar na het tijdstip van inwerkingtreding van die regels. Een algemene
      maatregel van bestuur als bedoeld in het eerste lid kan bij koninklijk besluit worden ingetrokken op een bij dat
      besluit te bepalen tijdstip, dat ligt binnen de in de eerste volzin bedoelde termijn.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.1
  - number: 18.1.5
    text: |-
      Indien Onze Minister tot het oordeel komt dat een definitieve voorziening terzake wenselijk is, zorgt deze voor
      vervanging van de regels. Indien voor de vervanging een wet nodig is, wordt binnen twee jaar na inwerkingtreding
      van de regels een voorstel van wet ingediend bij de Staten-Generaal. Indien voor de vervanging een algemene
      maatregel van bestuur nodig is, wordt binnen twee jaar na inwerkingtreding van de regels aan Ons een voordracht
      daartoe gedaan.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.1
  - number: 18.1.6
    text: |-
      Bij de regels, bedoeld in het eerste lid, kunnen taken worden opgedragen en bevoegdheden worden verleend aan het
      college.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.1
  - number: '18.2'
    text: 'Bij algemene maatregel van bestuur kunnen regels worden gesteld die noodzakelijk zijn voor uitvoering van:'
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.2
  - number: 18.2.a
    text: |-
      [richtlijn nr. 2002/21/EG](onbekend) of daarmee verband houdende richtlijnen van de Raad van de Europese Unie of
      van het Europees Parlement en de Raad gezamenlijk;
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.2
  - number: 18.2.b
    text: |-
      richtlijnen van de Commissie van de Europese Gemeenschappen die hun grondslag vinden in artikel 86, derde
      lid, van het Verdrag tot oprichting van de Europese Gemeenschap en die betrekking hebben op de elektronische
      communicatiesector.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.2
  - number: 18.3.1
    text: |-
      Onze Minister stelt de directeur-generaal van de Nederlandse mededingingsautoriteit, bedoeld in
      [artikel 2 van de Mededingingswet][ref1], in de gelegenheid hem advies uit te brengen over het voornemen om op
      grond van [artikel 3.3, tiende lid][ref2], een of meer aanbieders van het verkrijgen van een vergunning uit te
      sluiten, of over het ontwerp van een besluit tot weigering of intrekking van een vergunning voorzover dit verband
      houdt met het in aanzienlijke mate beperken van de daadwerkelijke mededinging op de relevante markt, bedoeld in
      [de artikelen 3.6, tweede lid, onder d][ref3], en [3.7, tweede lid, onder f][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.3
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref3
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref4
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 18.3.2
    text: |-
      Voorzover bij de uitoefening van bevoegdheden van het college begrippen worden uitgelegd die worden gehanteerd
      bij de toepassing van de [artikelen 24][ref1] en [88 van de Mededingingswet][ref2], geschiedt de uitoefening van
      die bevoegdheden overeenkomstig door het college in overeenstemming met de directeur-generaal van de Nederlandse
      mededingingsautoriteit vastgestelde algemene richtlijnen. Van de richtlijnen doet het college mededeling in de
      Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel88
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.3
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0008691
        artikel: '88'
  - number: 18.3.3
    text: |-
      Het college en de directeur-generaal van de Nederlandse mededingingsautoriteit maken in het belang van een
      effectieve en efficiënte besluitvorming gezamenlijk afspraken over de wijze van behandeling van aangelegenheden van
      wederzijds belang.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.3
  - number: 18.3.4
    text: |-
      Het college en het Commissariaat voor de Media, bedoeld in [artikel 9 van de Mediawet][ref1], maken in het belang
      van een effectieve en efficiënte besluitvorming afspraken over de wijze van behandeling van aangelegenheden van
      wederzijds belang.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel9
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.3
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '9'
  - number: 18.4.1
    text: |-
      De aanbieder van een openbaar elektronisch communicatienetwerk over wiens netwerk internationaal openbaar
      elektronisch communicatieverkeer wordt verzorgd leeft de verplichtingen na die voortvloeien uit het Internationaal
      Telecommunicatieverdrag en uit andere Nederland bindende verdragen of besluiten van volkenrechtelijke organisaties
      terzake van de verzorging van dit verkeer.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.4
  - number: 18.4.2
    text: |-
      Degene aan wie door Onze Minister een vergunning is verleend voor het gebruik van frequentieruimte, welk gebruik
      schadelijke storingen kan veroorzaken in de radiodiensten van andere landen, leeft de verplichtingen na die
      voortvloeien uit het Internationaal Telecommunicatieverdrag en uit andere Nederland bindende verdragen of besluiten
      van volkenrechtelijke organisaties terzake van dit gebruik.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.4
  - number: '18.5'
    text: |-
      Onverminderd het overigens bij of krachtens het Internationaal Telecommunicatieverdrag bepaalde zijn erkende
      ondernemingen in de zin van genoemd verdrag:
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.5
  - number: 18.5.a
    text: |-
      de aanbieder van een openbaar elektronisch communicatienetwerk over wiens netwerk internationaal openbaar
      elektronisch communicatieverkeer wordt verzorgd, en
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.5
  - number: 18.5.b
    text: |-
      de aanbieder van een openbaar elektronisch communicatienetwerk die in het kader van zijn aanbod radiozendapparaten
      gebruikt of de aanbieder van een openbaar elektronisch communicatienetwerk dat bestaat uit radiozendapparaten die
      geschikt zijn voor het verspreiden van programma's, wiens uitzendingen schadelijke storingen kunnen veroorzaken in
      de radiodiensten van andere landen.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.5
  - number: 18.6.1
    text: |-
      Aanbieders van openbare elektronische communicatienetwerken of openbare elektronische communicatiediensten die
      in Nederland of in een andere lid-staat van de Europese Unie bijzondere of uitsluitende rechten hebben voor het
      verrichten van diensten in andere sectoren dan elektronische communicatie voeren voor onderscheiden activiteiten
      afzonderlijke boekhoudingen, op gelijke wijze als vereist zou zijn wanneer de activiteiten door juridisch
      onafhankelijke ondernemingen zouden worden verricht.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.6
  - number: 18.6.2
    text: |-
      Bij ministeriële regeling kan worden bepaald dat het eerste lid niet van toepassing is op bij die regeling
      aangewezen aanbieders waarvan de jaaromzet in elektronische communicatie-activiteiten binnen de Europese Unie een
      bij die regeling te noemen bedrag niet te boven gaat.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.6
  - number: 18.7.1
    text: |-
      Onze Minister, onderscheidenlijk het college, is bevoegd voor een juiste uitvoering van het bepaalde bij of
      krachtens deze wet van een ieder te allen tijde inlichtingen te vorderen voor zover dit redelijkerwijs voor de
      vervulling van zijn taak nodig is.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.7
  - number: 18.7.2
    text: |-
      Degene van wie krachtens het eerste lid inlichtingen zijn gevorderd, is verplicht deze onverwijld te geven, maar in
      elk geval binnen de daartoe door Onze Minister, onderscheidenlijk het college, te stellen termijn.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.7
  - number: 18.7.3
    text: 'In een vordering op grond van het eerste lid kan wat betreft de te geven inlichtingen worden volstaan met:'
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.7
  - number: 18.7.3.a
    text: het omschrijven van het onderwerp waarover inlichtingen moeten worden gegeven en
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.7
  - number: 18.7.3.b
    text: de bij het verstrekken van de inlichtingen aan te houden mate van detail.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.7
  - number: 18.7.4
    text: |-
      Degene van wie de verstrekking van inlichtingen is gevorderd, is verplicht binnen de door
      Onze Minister, onderscheidenlijk het college, te bepalen redelijke termijn alle medewerking
      te verlenen die deze redelijkerwijs kan vorderen bij het uitoefenen van zijn bevoegdheden.
      [Artikel 5:20, tweede lid, van de Algemene wet bestuursrecht][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.7
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 18.7.5
    text: |-
      Met het oog op het bevorderen van een open en concurrerende markt in de elektronische communicatiesector
      maakt het college informatie met betrekking tot aanbieders van openbare elektronische communicatienetwerken,
      bijbehorende faciliteiten of openbare elektronische communicatiediensten op een door het
      college te bepalen wijze bekend voor zover die informatie verband houdt met bij of krachtens de
      [hoofdstukken 4 tot en met 9][ref1] en [11][ref2] van deze wet opgelegde verplichtingen. Van gegevens als bedoeld
      in [artikel 10, eerste lid, onderdeel c, van de Wet openbaarheid van bestuur][ref3] wordt geen mededeling gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk11
      [ref3]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.7
    references:
      - id: ref1
        bwb_id: BWBR0009950
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0009950
        hoofdstuk: '11'
      - id: ref3
        bwb_id: BWBR0005252
        artikel: '10'
  - number: '18.8'
    text: |-
      Onze Minister kan met betrekking tot de veiligheid en de beveiliging van openbare elektronische
      communicatienetwerken en openbare elektronische communicatiediensten regels stellen. Deze regels bevatten
      technische en organisatorische eisen die aan aanbieders van openbare elektronische communicatienetwerken of
      openbare elektronische communicatiediensten kunnen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.8
  - number: 18.9.1
    text: |-
      Onze Minister is bevoegd, in overeenstemming met Onze Minister van Justitie, aanbieders van openbare elektronische
      communicatienetwerken of openbare elektronische communicatiediensten aanwijzingen te geven met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.9
  - number: 18.9.1.a
    text: de instandhouding en de exploitatie van hun openbare elektronische communicatienetwerken, of
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.9
  - number: 18.9.1.b
    text: |-
      het verzorgen en gebruiken van hun openbare elektronische communicatiediensten, wanneer dit noodzakelijk is ter
      beëindiging van strafbaar gedrag jegens een persoon.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.9
  - number: 18.9.2
    text: |-
      Onze Minister is bevoegd, in overeenstemming met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties,
      aanbieders van openbare elektronische communicatienetwerken of openbare elektronische communicatiediensten
      aanwijzingen te geven met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.9
  - number: 18.9.2.a
    text: de instandhouding en de exploitatie van hun openbare elektronische communicatienetwerken, of
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.9
  - number: 18.9.2.b
    text: |-
      het verzorgen en gebruiken van hun openbare elektronische communicatiediensten, wanneer dit noodzakelijk is in het
      belang van de veiligheid van de staat.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.9
  - number: 18.9.3
    text: |-
      Onze Minister kan bij de toepassing van het eerste en tweede lid afwijken van de verplichtingen die ingevolge deze
      wet op aanbieders van openbare elektronische communicatienetwerken of openbare elektronische communicatiediensten
      rusten.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.9
  - number: 18.9.4
    text: |-
      Een aanbieder van een openbaar telecommunicatienetwerk of een openbare telecommunicatiedienst is verplicht een
      aanwijzing als bedoeld in het eerste of tweede lid op te volgen.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.9
  - number: 18.9.5
    text: |-
      Indien aanbieders van openbare elektronische communicatienetwerken of openbare elektronische communicatiediensten
      als gevolg van aanwijzingen gegeven op grond van het eerste en tweede lid onevenredig financieel nadeel
      ondervinden, kent Onze Minister aan hen een naar billijkheid te bepalen vergoeding toe.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.9
  - number: '18.10'
    text: |-
      Degene die een telefoongids uitgeeft, neemt op verzoek van een natuurlijke persoon of rechtspersoon die in die gids
      met een telefoonnummer is vermeld, het elektronisch postadres van verzoeker in die gids op tegen redelijke en niet
      discriminerende voorwaarden.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.10
  - number: 18.11.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het aan derden ter
      beschikking stellen van adressen voor elektronische post met bijbehorende gegevens ten behoeve van de samenstelling
      van boeken met elektronische postadressen.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.11
  - number: 18.11.2
    text: |-
      De regels, bedoeld in het eerste lid, kunnen onder meer betrekking hebben op de bescherming van persoonsgegevens en
      de persoonlijke levenssfeer.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.11
  - number: 18.12.1
    text: |-
      Indien in deze wet geregelde onderwerpen in het belang van een goede uitvoering van deze wet nadere regeling
      behoeven, kan deze geschieden bij of krachtens algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.12
  - number: 18.12.2
    text: |-
      Bij de regels, bedoeld in het eerste lid, kunnen taken worden opgedragen en bevoegdheden worden verleend aan het
      college.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.12
  - number: 18.13.1
    text: |-
      Onverminderd het overigens bij of krachtens deze wet bepaalde worden de bij of krachtens deze wet te nemen
      maatregelen en regels genomen met inachtneming van het belang van de bescherming van persoonsgegevens en de
      bescherming van de persoonlijke levenssfeer alsmede de bescherming van het brief-, telefoon- en telegraafgeheim en
      het geheim van daarmee vergelijkbare communicatietechnieken.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.13
  - number: 18.13.2
    text: |-
      Onverminderd het overigens bij of krachtens deze wet bepaalde is het eerste lid van overeenkomstige toepassing
      op de bedrijfsvoering door aanbieders van openbare elektronische communicatienetwerken of openbare elektronische
      communicatiediensten.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.13
  - number: 18.14.1
    text: |-
      Een krachtens [artikel 9.1, tweede, derde, of vierde lid][ref1], vastgestelde algemene maatregel van bestuur
      wordt aan de beide kamers der Staten-Generaal overgelegd. Hij treedt in werking op een tijdstip dat nadat vier
      weken na de overlegging zijn verstreken bij koninklijk besluit wordt vastgesteld, tenzij binnen die termijn door
      of namens een der kamers of door ten minste een vijfde van het grondwettelijk aantal leden van een der kamers de
      wens te kennen wordt gegeven dat het onderwerp bij wet wordt geregeld. In dat geval wordt een daartoe strekkend
      voorstel van wet zo spoedig mogelijk ingediend. Indien het voorstel van wet wordt ingetrokken of indien een van de
      beide kamers der Staten-Generaal besluit het voorstel niet aan te nemen, wordt de algemene maatregel van bestuur
      ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel9
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.14
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '9'
        hoofdstuk: '9'
  - number: 18.14.2
    text: |-
      Een krachtens de [artikelen 3.1, eerste lid][ref1], [4.11, tweede lid][ref2], of [4.11, derde lid][ref3],
      vastgestelde algemene maatregel van bestuur treedt niet eerder in werking dan vier weken na de datum van uitgifte
      van het Staatsblad waarin hij is geplaatst. Van de plaatsing wordt onverwijld mededeling gedaan aan de beide kamers
      der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel4
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.14
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '4'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0009950
        artikel: '4'
        hoofdstuk: '4'
  - number: 18.15.1
    text: |-
      Een certificatiedienstverlener die certificaten als gekwalificeerde certificaten aanbiedt of afgeeft aan het
      publiek en in Nederland een vestiging heeft, voldoet aan de eisen, gesteld bij of krachtens algemene maatregel
      van bestuur.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.15
  - number: 18.15.2
    text: |-
      Certificaten die als gekwalificeerd certificaat aan het publiek worden aangeboden of afgegeven, voldoen aan de
      eisen gesteld bij of krachtens algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.15
  - number: 18.15.3
    text: |-
      Een certificatiedienstverlener stelt, alvorens een gekwalificeerd certificaat af te geven, de identiteit van de
      persoon die als ondertekenaar in dat gekwalificeerde certificaat wordt aangeduid, vast aan de hand van de bij
      [artikel 1 van de Wet op de identificatieplicht][ref1] aangewezen geldige documenten.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.15
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 18.16.1
    text: |-
      Onze Minister kan een of meer organisaties aanwijzen, die certificatiedienstverleners toetsen op de overeenstemming
      met de bij en krachtens deze wet gestelde eisen, indien de reglementen van de organisatie voldoende waarborgen
      bieden dat een overeenkomstig deze regeling, door de aangewezen organisatie beoordeelde certificatiedienstverlener
      voldoet aan [artikel 18.15, eerste lid][ref1] en dat de door een zodanige certificatiedienstverlener aan het
      publiek aangeboden of afgegeven gekwalificeerde certificaten voldoen aan [artikel 18.15, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel18
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.16
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '18'
        hoofdstuk: '18'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '18'
        hoofdstuk: '18'
  - number: 18.16.2
    text: |-
      Een certificatiedienstverlener die in het bezit is van een geldig bewijs van toetsing van een op grond van het
      eerste lid aangewezen organisatie, wordt vermoed te voldoen aan [artikel 18.15, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel18
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.16
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '18'
        hoofdstuk: '18'
  - number: 18.16.3
    text: |-
      De certificaten die als gekwalificeerd aan het publiek worden aangeboden of afgegeven door
      een certificatiedienstverlener als bedoeld in het tweede lid, worden vermoed te voldoen aan
      [artikel 18.15, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel18
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.16
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '18'
        hoofdstuk: '18'
  - number: 18.16.4
    text: |-
      Een aanwijzing als bedoeld in het eerste lid geldt voor bepaalde tijd, en kan worden ingetrokken indien blijkt dat
      de reglementen van de aangewezen organisatie niet meer de in het eerste lid bedoelde waarborg bieden.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.16
  - number: 18.17.1
    text: |-
      Degene die een veilig middel voor het aanmaken van elektronische handtekeningen op de markt brengt, zorgt ervoor
      dat het veilige middel voldoet aan de bij of krachtens algemene maatregel van bestuur te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.17
  - number: 18.17.2
    text: |-
      Onze Minister kan een instelling aanwijzen die belast is met het beoordelen van de overeenstemming van een veilig
      middel voor het aanmaken van elektronische handtekeningen met de eisen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.17
  - number: 18.17.3
    text: |-
      Degene die een veilig middel voor het aanmaken van elektronische handtekeningen op de markt brengt, zorgt ervoor
      dat dit middel is voorzien van een verklaring van de instelling, bedoeld in het tweede lid, of van een verklaring
      van een door de bevoegde autoriteiten van een andere lidstaat van de Europese Gemeenschap dan wel van een van
      de overige staten die partij zijn bij de Overeenkomst betreffende de Europese Economische Ruimte, aangewezen
      instelling, dat het middel voldoet aan de eisen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.17
  - number: 18.17.4
    text: De verklaring, bedoeld in het derde lid, betreft ofwel een afzonderlijk veilig middel, ofwel een type.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.17
  - number: 18.17.5
    text: |-
      De instelling die in aanmerking wenst te komen voor een aanwijzing als bedoeld in het tweede lid, toont aan dat zij
      voldoet aan de bij of krachtens algemene maatregel van bestuur vastgestelde eisen.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.17
  - number: 18.17.6
    text: |-
      Indien Onze Minister heeft vastgesteld dat de aangewezen instelling niet meer aan de in het vijfde lid bedoelde
      eisen voldoet en de instelling niet binnen een door Onze Minister gestelde termijn heeft aangetoond aan de eisen te
      voldoen, wordt de aanwijzing ingetrokken.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.17
  - number: 18.17.7
    text: |-
      Indien de aangewezen instelling aantoont redelijkerwijs niet binnen de gestelde termijn aan de eisen te kunnen
      voldoen, kan Onze Minister de termijn verlengen.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.17
  - number: '18.18'
    text: |-
      Het is de certificatiedienstverlener waarvan de registratie op grond van
      [artikel 2.2, vierde lid, onderdeel b of c][ref1], is beëindigd verboden gekwalificeerde certificaten aan het
      publiek aan te bieden of af te geven zolang hij niet opnieuw is geregistreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel2
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.18
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '2'
        hoofdstuk: '2'
  - number: '18.19'
    text: |-
      In afwijking van [artikel 24 van de Wet Onafhankelijke post- en telecommunicatieautoriteit][ref1],
      onderscheidenlijk [artikel 91 van de Mededingingswet][ref2], verstrekken het college en de directeur-generaal
      van de Nederlandse mededingingsautoriteit elkaar op verzoek de gegevens of inlichtingen die van betekenis zijn of
      kunnen zijn voor de uitoefening van de taken en bevoegdheden die bij of krachtens de Telecommunicatiewet aan het
      college zijn opgedragen, respectievelijk zijn verleend, mits:


      [ref1]: https://wetten.overheid.nl/BWBR0008807#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel91
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.19
    references:
      - id: ref1
        bwb_id: BWBR0008807
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0008691
        artikel: '91'
  - number: 18.19.a
    text: de geheimhouding van de gegevens of inlichtingen in voldoende mate is gewaarborgd, en
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.19
  - number: 18.19.b
    text: |-
      voldoende is gewaarborgd dat de gegevens of inlichtingen niet zullen worden gebruikt voor een ander doel dan
      waarvoor deze worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.19
  - number: 18.20.1
    text: |-
      Het college verstrekt na een daartoe strekkend verzoek van de Commissie van de Europese Gemeenschappen dan wel van
      een nationale regelgevende instantie, de gegevens of inlichtingen die de Commissie respectievelijk die nationale
      regelgevende instantie nodig heeft voor de uitoefening van haar taken uit hoofde van het Gemeenschapsrecht mits:
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.20
  - number: 18.20.1.a
    text: |-
      de geheimhouding, voor zover er naar het oordeel van het college sprake is van bedrijfsvertrouwelijke gegevens of
      inlichtingen, van de gegevens of inlichtingen in voldoende mate is gewaarborgd,
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.20
  - number: 18.20.1.b
    text: |-
      voldoende gewaarborgd is dat de gegevens of inlichtingen niet zullen worden gebruikt voor een ander doel dan
      waarvoor deze zijn verstrekt, en
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.20
  - number: 18.20.1.c
    text: |-
      het verzoek gegevens of inlichtingen betreft die het college uit hoofde van zijn taken en bevoegdheden op grond van
      deze wet heeft verkregen.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.20
  - number: 18.20.2
    text: |-
      Indien het college van oordeel is dat er sprake is van bedrijfsvertrouwelijke gegevens of inlichtingen, vermeldt
      het college bij het verstrekken van die gegevens of inlichtingen aan de Commissie van de Europese Gemeenschappen
      onderscheidenlijk de nationale regelgevende instantie, uitdrukkelijk en met redenen omkleed dat die informatie niet
      aan derden ter beschikking mag worden gesteld.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.20
  - number: 18.20.3
    text: |-
      Indien het college aan de Commissie van de Europese Gemeenschappen gegevens of inlichtingen verstrekt die
      het college heeft verkregen van een aanbieder van een openbaar elektronisch communicatienetwerk, een openbare
      elektronische communicatiedienst of bijbehorende faciliteiten, stelt het college de betreffende aanbieder daarvan
      op de hoogte.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.20
  - number: 18.21.1
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot de toepassing van overeenkomstig artikel 17,
      vierde lid, van [richtlijn nr. 2002/21/EG](onbekend) verplicht gestelde normen of specificaties, die gepubliceerd
      zijn in het Publicatieblad van de Europese Gemeenschappen.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.21
  - number: 18.21.2
    text: |-
      Een wijziging van de normen of specificaties, bedoeld in het eerste lid, gaat gelden met ingang van de dag waarop
      die wijziging in het Publicatieblad van de Europese Gemeenschappen is gepubliceerd.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.21
  - number: 18.21.3
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de toepassing van in het Publicatieblad
      van de Europese Gemeenschappen gepubliceerde normen of specificaties als bedoeld in artikel 17, eerste lid, van
      [richtlijn nr. 2002/21/EG](onbekend) met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.21
  - number: 18.21.3.a
    text: |-
      bij die regeling aan te wijzen categorieën van elektronische communicatienetwerken, elektronische
      communicatiediensten, bijbehorende faciliteiten, of diensten indien het toepassen van die normen of specificaties
      nodig is voor het waarborgen van eind- tot eindverbindingen of het verbeteren van de keuzevrijheid van gebruikers,
      of
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.21
  - number: 18.21.3.b
    text: |-
      het gebruik van applicatieprogramma-interfaces indien het toepassen van die normen of specificaties nodig is voor
      het bevorderen van de toepassing van open applicatieprogramma-interfaces bij het leveren of aanbieden van digitale
      interactieve televisiediensten.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.21
  - number: '18.22'
    text: |-
      Een wijziging van [richtlijn nr. 2002/19/EG](onbekend), [richtlijn nr. 2002/20/EG](onbekend), [richtlijn nr.
      2002/21/EG](onbekend), of [richtlijn nr. 2002/22/EG](onbekend) gaat voor de toepassing van de Telecommunicatiewet
      gelden met ingang van de dag waarop aan de betrokken wijziging van de desbetreffende richtlijn uitvoering moet
      zijn gegeven, tenzij bij ministerieel besluit dat in de Staatscourant wordt bekendgemaakt, een ander tijdstip wordt
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel18.22
  - number: '19.1'
    text: |-
      [Artikel 1.1][ref1], zoals dat luidde voor inwerkingtreding van de
      [Wet implementatie Europees regelgevingskader voor de elektronische communicatiesector 2002][ref2], is van
      toepassing op de volgende in dit hoofdstuk gebruikte begrippen:


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0016635
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel19.1
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0016635
  - number: 19.1.a
    text: vast openbaar telefoonnetwerk;
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel19.1
  - number: 19.1.b
    text: vaste openbare telefoondienst;
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel19.1
  - number: 19.1.c
    text: mobiel openbaar telefoonnetwerk;
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel19.1
  - number: 19.1.d
    text: mobiele openbare telefoondienst;
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel19.1
  - number: 19.1.e
    text: huurlijn;
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel19.1
  - number: 19.1.f
    text: omroepnetwerk.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel19.1
  - number: 19.2.1
    text: |-
      De mededeling, bedoeld in [artikel 2.1, eerste lid][ref1], behoeft niet te worden gedaan door:


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel2
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel19.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '2'
        hoofdstuk: '2'
  - number: 19.2.1.a
    text: |-
      degene die voor de inwerkingtreding van de
      [Wet implementatie Europees regelgevingskader voor de elektronische communicatiesector 2002][ref1] door het college
      is geregistreerd;


      [ref1]: https://wetten.overheid.nl/BWBR0016635
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel19.2
    references:
      - id: ref1
        bwb_id: BWBR0016635
  - number: 19.2.1.b
    text: |-
      de houder van een vergunning voor het gebruik van frequentieruimte waarvoor geen registratie was vereist
      op grond van [artikel 2.1, tweede lid, onder a][ref1], zoals dat luidde voor de inwerkingtreding van de
      [Wet implementatie Europees regelgevingskader voor de elektronische communicatiesector 2002][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0016635
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel19.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0016635
  - number: 19.2.2
    text: |-
      Een registratie die is gedaan op grond van [artikel 2.1, eerste lid][ref1], zoals dat luidde voor de inwerkingtreding
      van de [Wet implementatie Europees regelgevingskader voor de elektronische communicatiesector 2002][ref2], wordt
      aangemerkt als een mededeling als bedoeld in [artikel 2.1, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0016635
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel2
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel19.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0016635
      - id: ref3
        bwb_id: BWBR0009950
        artikel: '2'
        hoofdstuk: '2'
  - number: 19.2.3
    text: |-
      Een vergunning voor het gebruik van frequentieruimte die bestemd is voor het aanbieden van een openbaar
      elektronisch communicatienetwerk of een openbare elektronische communicatiedienst, wordt aangemerkt als een
      mededeling als bedoeld in [artikel 2.1, eerste lid][ref1]. Onze Minister verstrekt het college de daarvoor
      benodigde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel2
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel19.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '2'
        hoofdstuk: '2'
  - number: 19.2.4
    text: |-
      Een op grond van het tweede of derde lid geregistreerde rechtspersoon
      kan tot uiterlijk zes maanden na de inwerkingtreding van de
      [Wet implementatie Europees regelgevingskader voor de elektronische communicatiesector 2002][ref1] het college
      verzoeken om een verklaring als bedoeld in [artikel 2.4, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0016635
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel2
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel19.2
    references:
      - id: ref1
        bwb_id: BWBR0016635
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '2'
        hoofdstuk: '2'
  - number: '19.3'
    text: |-
      De in [artikel 6a.1, tweede lid][ref1], bedoelde relevante markten die nodig zijn voor de in
      de artikelen 27 van [richtlijn nr. 2002/21/EG](onbekend), 7, derde lid, van [richtlijn nr.
      2002/19/EG](onbekend) of 16, derde lid, van [richtlijn nr. 2002/22/EG](onbekend), bedoelde
      marktanalyses, worden door het college zo spoedig mogelijk na inwerkingtreding van de
      [Wet implementatie Europees regelgevingskader voor de elektronische communicatiesector 2002][ref2] bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0016635
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel19.3
    references:
