        artikel: '19'
        hoofdstuk: '19'
  - number: 19.5.7
    text: |-
      Artikel 6.10, eerste tot en met vierde lid, zoals dat luidde voor de inwerkingtreding van de
      [Wet implementatie Europees regelgevingskader voor de elektronische communicatiesector 2002][ref1], blijft tot
      vierentwintig maanden na die inwerkingtreding van kracht.


      [ref1]: https://wetten.overheid.nl/BWBR0016635
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel19.5
    references:
      - id: ref1
        bwb_id: BWBR0016635
  - number: 19.5.8
    text: |-
      Het college behoudt tot vierentwintig maanden na de inwerkingtreding van de
      [Wet implementatie Europees regelgevingskader voor de elektronische communicatiesector 2002][ref1] de taken en
      bevoegdheden zoals deze voor het tijdstip van inwerkingtreding van die wet in verband met de verplichtingen,
      bedoeld in het eerste tot en met vierde lid, aan hem bij of krachtens de [hoofdstukken 6][ref2] en [7][ref3] zijn
      toegekend of opgedragen, uitgezonderd taken en bevoegdheden die betrekking hebben op de beslechting van geschillen,
      bedoeld in de [artikelen 6.3][ref4], [7.7][ref5] en [7.8][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0016635
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk6
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk7
      [ref4]: https://wetten.overheid.nl/BWBR0009950#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0009950#Artikel7
      [ref6]: https://wetten.overheid.nl/BWBR0009950#Artikel7
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel19.5
    references:
