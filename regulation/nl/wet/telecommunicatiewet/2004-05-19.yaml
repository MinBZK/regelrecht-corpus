  - number: '19.8'
    text: |-
      Op een aanvraag om een oordeel als bedoeld in [artikel 7.7][ref1], zoals dat luidde voor de inwerkingtreding van
      de [Wet implementatie Europees regelgevingskader voor de elektronische communicatiesector 2002][ref2], blijven de
      Telecommunicatiewet en de daarop berustende bepalingen van toepassing zoals die luidden voor dat tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0016635
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel19.8
