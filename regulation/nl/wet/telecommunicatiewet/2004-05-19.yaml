      een besluit als bedoeld in [artikel 6a.18, eerste of tweede lid][ref1], en de aan een dergelijk besluit ten
      grondslag liggende bepaling van de relevante markt, bedoeld in [artikel 6a.1, eerste of tweede lid][ref2],
      het onderzoek van die markt, bedoeld in [artikel 6a.1, derde lid][ref3], respectievelijk het onderzoek van een
