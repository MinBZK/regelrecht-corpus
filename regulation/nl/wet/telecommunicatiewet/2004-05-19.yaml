  - number: 20.1.2
    text: |-
      Aan de uit het vorige lid voortvloeiende verplichting voor KPN Telecom B.V. om de in
      [artikel 9.1, eerste lid][ref1], bedoelde openbare elektronische communicatiediensten en voorzieningen te verzorgen
      komt een einde een jaar na het tijdstip waarop:


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel9
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel20.1
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '9'
        hoofdstuk: '9'
  - number: 20.1.2.a
    text: |-
      KPN Telecom B.V. Onze Minister schriftelijk heeft medegedeeld een verplichting tot verzorging van een bepaalde
      dienst of voorziening niet langer te willen nakomen, of
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel20.1
  - number: 20.1.2.b
    text: |-
      Onze Minister schriftelijk aan KPN Telecom B.V. heeft medegedeeld dat een verplichting tot verzorging van een
      bepaalde dienst of voorziening niet langer bestaat.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel20.1
  - number: 20.2.1
    text: |-
      Een vergunning die is verleend krachtens artikel 13a, eerste lid, van de Wet op de telecommunicatievoorzieningen
      wordt gelijkgesteld met een vergunning, verleend krachtens [artikel 3.3, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel20.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 20.2.2
    text: |-
      Voor de houder van een vergunning als bedoeld in het eerste lid blijft het bepaalde bij of krachtens de artikelen
      13c, 13g, met dien verstande dat in het eerste lid, onderdeel a, vervalt «waaronder technische aftapbaarheid»,
      13j, 13k, met uitzondering van het zevende lid, 13l, 13n, 13t, voorzover het betreft de verwijzing naar artikel
      11, eerste tot en met derde lid, en vijfde tot en met zevende lid, 13u, 13v, 13x en [13y van de Wet op de
      telecommunicatievoorzieningen](onbekend) van toepassing.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel20.2
  - number: 20.3.1
    text: |-
      Een machtiging die is verleend krachtens artikel 17, eerste lid, van de Wet op de telecommunicatievoorzieningen
      wordt gelijkgesteld met een vergunning, verleend krachtens [artikel 3.3, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel20.3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 20.3.2
    text: |-
      De toekenning van radio-frequenties krachtens artikel 3, tweede lid, van de Wet op de telecommunicatievoorzieningen
      aan de houder van de concessie wordt gelijkgesteld met een vergunning voor het gebruik van frequentieruimte als
      bedoeld in [artikel 3.3, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel20.3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 20.3.3
    text: |-
      Voorzover bij een machtiging die is verleend krachtens artikel 21 van de Wet op de telecommunicatievoorzieningen
      radiofrequenties zijn toegekend, wordt deze toekenning van radiofrequenties gelijkgesteld met een vergunning voor
      het gebruik van frequentieruimte als bedoeld in [artikel 3.3, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel20.3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 20.3.4
    text: |-
      Een vergunning als bedoeld in het eerste, tweede en derde lid, geldt voor een bij algemene maatregel van bestuur
      vast te stellen termijn, waarbij een onderscheid kan worden gemaakt al naar gelang de toepassing waarvoor de
      vergunning is verleend.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel20.3
  - number: 20.4.1
    text: |-
      Regels vastgesteld krachtens de hoofdstukken IV, V en VII van de Wet op de telecommunicatievoorzieningen,
      alsmede het bepaalde bij of krachtens het Besluit radio-elektrische inrichtingen, worden gelijkgesteld met regels
      vastgesteld krachtens de [hoofdstukken 3][ref1], [10][ref2] en [16][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk10
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk16
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel20.4
    references:
      - id: ref1
        bwb_id: BWBR0009950
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0009950
        hoofdstuk: '10'
      - id: ref3
        bwb_id: BWBR0009950
        hoofdstuk: '16'
  - number: 20.4.2
    text: |-
      Apparaten die op het tijdstip van inwerkingtreding van deze wet in gebruik zijn bij de houder van de concessie,
      bedoeld in artikel 3, eerste lid, van de Wet op de telecommunicatievoorzieningen, ten dienste van de uitoefening
      van de aan de houder van de concessie opgedragen taken, worden, voorzover deze niet voldoen aan het bepaalde
      bij of krachtens [hoofdstuk 10 van deze wet][ref1], geacht te voldoen aan het bepaalde bij of krachtens
      [hoofdstuk 10][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk10
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk10
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel20.4
    references:
      - id: ref1
        bwb_id: BWBR0009950
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0009950
        hoofdstuk: '10'
  - number: 20.5.1
    text: |-
      Met betrekking tot de instandhouding, de verplaatsing en de opruiming van kabels en kabelwerken, voorzover de
      kabels en kabelwerken zijn aangelegd met toepassing van hoofdstuk VI van de Wet op de telecommunicatievoorzieningen
      is [hoofdstuk 5][ref1] van deze wet van toepassing met dien verstande, dat kabels en kabelwerken,
      aangelegd in en op openbare gronden als bedoeld in artikel 1, onderdeel g, onder 3°, van de Wet op de
      telecommunicatievoorzieningen worden gelijkgesteld met kabels, aangelegd in en op openbare gronden als bedoeld in
      [artikel 1.1, onderdeel s][ref2], van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel1
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel20.5
    references:
      - id: ref1
        bwb_id: BWBR0009950
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '1'
        hoofdstuk: '1'
  - number: 20.5.2
    text: |-
      Ten aanzien van kabels en kabelwerken, bedoeld in het eerste lid, die deel uitmaken van een telecommunicatienetwerk
      dat tot gebruik strekt van het Ministerie van Defensie geldt dat:
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel20.5
  - number: 20.5.2.a
    text: |-
      gedurende een periode van vijf jaar na het tijdstip van inwerkingtreding van deze wet op de aanleg van kabels
      en kabelwerken ten behoeve van uitbreiding van dat telecommunicatienetwerk [hoofdstuk 5][ref1] van deze wet van
      toepassing is, en


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel20.5
    references:
      - id: ref1
        bwb_id: BWBR0009950
        hoofdstuk: '5'
  - number: 20.5.2.b
    text: |-
      dat tijdens de periode, genoemd onder a, alsmede na afloop van die periode op de kabels en kabelwerken die zijn
      aangelegd voor uitbreiding van dat telecommunicatienetwerk de bepalingen van [hoofdstuk 5][ref1] van deze wet met
      betrekking tot de instandhouding, de verplaatsing en de opruiming van toepassing blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel20.5
    references:
      - id: ref1
        bwb_id: BWBR0009950
        hoofdstuk: '5'
  - number: 20.6.1
    text: |-
      Een nummerplan vastgesteld krachtens artikel 40d van de Wet op de telecommunicatievoorzieningen wordt gelijkgesteld
      met een nummerplan als bedoeld in deze wet.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel20.6
  - number: 20.6.2
    text: |-
      De toekenning of reservering van nummers, bedoeld in artikel 17, elfde lid, van de Wet op de
      telecommunicatievoorzieningen, de toekenning of reservering van nummers alsmede de wijziging daarvan, bedoeld
      in artikel 40d van de Wet op de telecommunicatievoorzieningen, de toekenning van nummers als bedoeld in
      artikel 40e van de Wet op de telecommunicatievoorzieningen, alsmede de toekenning van nummers, bedoeld in
      [artikel 2, derde lid, van de Vergunningenwet kabelgebonden telecommunicatie-infrastructuur][ref1], worden
      gelijkgesteld met een reservering, toekenning of wijziging als bedoeld in [hoofdstuk 4][ref2] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0007973#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel20.6
    references:
      - id: ref1
        bwb_id: BWBR0007973
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0009950
        hoofdstuk: '4'
  - number: 20.7.1
    text: |-
      Een vergunning zonder gebiedsbeperking die is verleend krachtens
      [artikel 2, eerste lid, van de Vergunningenwet kabelgebonden telecommunicatie-infrastructuur][ref1] wordt
      gelijkgesteld met een registratie als aanbieder van een openbaar telecommunicatienetwerk als bedoeld in
      [artikel 2.3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007973#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel2
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel20.7
    references:
      - id: ref1
        bwb_id: BWBR0007973
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '2'
        hoofdstuk: '2'
  - number: 20.7.2
    text: |-
      Voor een geregistreerde als bedoeld in het eerste lid blijven de artikelen 4b van de Wet op de
      telecommunicatievoorzieningen en [21 van de Vergunningenwet kabelgebonden telecommunicatie-infrastructuur][ref1]
      nog van toepassing gedurende vijf jaar na het tijdstip van inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0007973#Artikel21
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel20.7
    references:
      - id: ref1
        bwb_id: BWBR0007973
        artikel: '21'
  - number: 20.8.1
    text: |-
      Ten aanzien van degene op wie ingevolge [artikel 2.1][ref1] een verplichting tot registratie rust, blijft
      [artikel 2.1][ref2] buiten toepassing gedurende zes maanden na het tijdstip van inwerkingtreding van deze wet, en
      indien binnen die termijn een aanvraag tot registratie is ingediend, ook nadien, tot zes weken na de datum van de
      beschikking waarbij op de aanvraag is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel2
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel20.8
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '2'
        hoofdstuk: '2'
  - number: 20.8.2
    text: |-
      Een registratie als bedoeld in artikel 4ac van de Wet op de telecommunicatievoorzieningen wordt gelijkgesteld met
      een registratie als bedoeld in [artikel 2.1][ref1] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel2
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel20.8
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '2'
        hoofdstuk: '2'
  - number: 20.9.1
    text: |-
      Het frequentieplan wordt voor de eerste maal vastgesteld binnen zes maanden na het tijdstip van inwerkingtreding
      van deze wet.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel20.9
  - number: 20.9.2
    text: |-
      Tot het tijdstip waarop het frequentieplan voor de eerste maal is vastgesteld, worden vergunningen voor
      frequentieruimte als bedoeld in [artikel 3.3, eerste lid][ref1], verleend door middel van de procedure op volgorde
      van binnenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel20.9
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 20.9.3
    text: |-
      In afwijking van het tweede lid geldt dat indien een aanvraag voor een vergunning betrekking heeft op
      frequentieruimte die naar het oordeel van Onze Minister behoort tot een categorie van gebruik waarvoor vergunningen
      zullen worden verleend door middel van een veiling of een vergelijkende toets, kan Onze Minister besluiten een van
      genoemde procedures toe te passen.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel20.9
  - number: '20.10'
    text: Het frequentieregister is beschikbaar binnen zes maanden na het tijdstip van inwerkingtreding van deze wet.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel20.10
  - number: '20.13'
    text: |-
      Ten aanzien van degene op wie het voorschrift van [artikel 13.1][ref1] van toepassing is, blijft dat artikel
      gedurende negen maanden na het tijdstip van inwerkingtreding van deze wet buiten toepassing, indien de door hem
      aangeboden openbare telecommunicatienetwerken of openbare telecommunicatiediensten nog niet aftapbaar zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel13
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel20.13
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '13'
        hoofdstuk: '13'
  - number: 20.14.1
    text: |-
      Ten aanzien van de instelling die zendtijd als bedoeld in [artikel 1, onder hh, van de Mediawet][ref1] heeft
      verkregen en die ingevolge [artikel 3.3][ref2] een vergunning voor het gebruik van frequentieruimte op het terrein
      van de publieke omroep behoeft, blijft dat artikel voor dat doel buiten toepassing gedurende zes maanden na het
      tijdstip van inwerkingtreding van deze wet, en indien binnen die termijn een aanvraag voor een vergunning is
      ingediend, ook nadien, tot zes weken na de datum van de beschikking waarbij op de aanvraag is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel20.14
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 20.14.2
    text: |-
      Zolang en voorzover [artikel 3.3][ref1] buiten toepassing blijft ten aanzien van het gebruik van
      frequentieruimte op het terrein van de publieke omroep, blijft de Nederlandsche Omroep-Zender-Maatschappij
      «NOZEMA», genoemd in [artikel 1 van de Radio-Omroep-Zender-Wet 1935][ref2], bevoegd gebruik te maken van de
      frequentieruimte op het terrein van de publieke omroep, voorzover die frequentieruimte aan haar overeenkomstig
      [artikel 2 van de Radio-Omroep-Zender-Wet 1935][ref3] door Onze Minister is toegewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0001965#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0001965#Artikel2
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel20.14
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0001965
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0001965
        artikel: '2'
  - number: 20.14.3
    text: |-
      Zolang en voorzover [artikel 3.3][ref1] buiten toepassing blijft ten aanzien van het gebruik van frequentieruimte
      op het terrein van de publieke omroep, blijft de NOZEMA, in afwijking van [artikel 10.16][ref2], bevoegd
      radiozendapparaten aan te leggen en te gebruiken ten behoeve van het verzorgen van diensten, waarbij gebruik wordt
      gemaakt van de frequentieruimte op het terrein van de publieke omroep.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel10
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel20.14
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.2.3
  - number: 20.14.4
    text: |-
      Zolang en voorzover [artikel 3.3][ref1] buiten toepassing blijft ten aanzien van het gebruik van frequentieruimte
      op het terrein van de publieke omroep, blijven de krachtens [artikel 3.3][ref2] gestelde regels ten aanzien van
      het gebruik van frequentieruimte op het terrein van de publieke omroep ten aanzien van de NOZEMA eveneens buiten
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel20.14
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 20.14.5
    text: |-
      De frequentieruimte op het terrein van de publieke omroep die op het tijdstip van inwerkingtreding van deze
      wet overeenkomstig [artikel 2 van de Radio-Omroep-Zender-Wet 1935][ref1] door Onze Minister aan de NOZEMA is
      toegewezen, wordt door de NOZEMA uiterlijk zes maanden na het tijdstip van inwerkingtreding van deze wet aan Onze
      Minister ter beschikking gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001965#Artikel2
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel20.14
    references:
      - id: ref1
        bwb_id: BWBR0001965
        artikel: '2'
  - number: 20.15.1
    text: |-
      Ten aanzien van de mogelijkheid om bezwaar te maken of beroep in te stellen tegen een besluit krachtens de Wet op
      de telecommunicatievoorzieningen dat is bekendgemaakt voor het tijdstip van inwerkingtreding van deze wet, blijft
      het recht zoals het gold voor dat tijdstip van toepassing.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel20.15
  - number: 20.15.2
    text: |-
      Ten aanzien van de behandeling van bezwaar of beroep dat voor het tijdstip van inwerkingtreding van deze wet is
      gemaakt onderscheidenlijk is ingesteld, blijft het recht zoals het gold voor dat tijdstip van toepassing.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel20.15
  - number: 20.15.3
    text: |-
      Ten aanzien van de behandeling van bezwaar of beroep dat op of na het tijdstip van inwerkingtreding van deze wet
      is gemaakt onderscheidenlijk is ingesteld en dat is gericht tegen een besluit waartegen voor dat tijdstip eveneens
      bezwaar is gemaakt onderscheidenlijk beroep is ingesteld, blijft het recht zoals het gold voor dat tijdstip van
      toepassing.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel20.15
  - number: '20.16'
    text: |-
      De tekst van de [Mediawet][ref1] wordt in het Staatsblad geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0004149
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel20.16
    references:
      - id: ref1
        bwb_id: BWBR0004149
  - number: 20.17.1
    text: |-
      De Wet op de telecommunicatievoorzieningen wordt ingetrokken op een bij koninklijk besluit te bepalen tijdstip, dat
      voor de verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel20.17
  - number: 20.17.2
    text: |-
      De [Vergunningenwet kabelgebonden telecommunicatie-infrastructuur][ref1] wordt ingetrokken op een bij koninklijk
      besluit te bepalen tijdstip, dat voor de verschillende artikelen of onderdelen daarvan verschillend kan worden
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007973
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel20.17
    references:
      - id: ref1
        bwb_id: BWBR0007973
  - number: '20.18'
    text: |-
      Bij algemene maatregel van bestuur kunnen tot twee jaar na inwerkingtreding van deze wet, in gevallen waarin deze
      wet niet voorziet, regels worden gesteld met betrekking tot de invoering van artikelen van deze wet of onderdelen
      daarvan.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel20.18
  - number: '20.19'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel20.19
  - number: '20.20'
    text: 'Deze wet wordt aangehaald als: Telecommunicatiewet.'
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel20.20
