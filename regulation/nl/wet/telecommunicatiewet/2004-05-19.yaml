        paragraaf: 6a.1
      - id: ref4
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
  - number: 6b.6.b
    text: |-
      een besluit als bedoeld in [artikel 6a.3, eerste, tweede of derde lid][ref1], en de aan een dergelijk besluit
      ten grondslag liggende bepaling van de relevante markt, bedoeld in [artikel 6a.1, eerste of tweede lid][ref2], en
      het onderzoek van die markt als bedoeld in [artikel 6a.1, derde lid][ref3], respectievelijk het onderzoek van een
      transnationale markt als bedoeld in [artikel 6a.1, vierde lid][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref4]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel6b.6
    references:
