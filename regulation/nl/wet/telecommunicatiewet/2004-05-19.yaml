        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: 19.6.2
    text: |-
      Het college zorgt voor gelijktijdige inwerkingtreding van de besluiten, bedoeld in de
      [artikelen 6a.2, eerste lid][ref1], en [6a.3, eerste lid][ref2], waaraan een relevante markt
      onderscheidenlijk een transnationale markt ten grondslag ligt waarop aanbieders van omroepnetwerken
      actief zijn en waarvoor [artikel 8.7][ref3], zoals dat luidde voor inwerkingtreding van de
      [Wet implementatie Europees regelgevingskader voor de elektronische communicatiesector 2002][ref4], van toepassing
      is.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0016635
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel19.6
    references:
