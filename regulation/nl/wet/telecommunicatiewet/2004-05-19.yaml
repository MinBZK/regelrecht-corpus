        artikel: '6'
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0009950
        artikel: '19'
        hoofdstuk: '19'
  - number: 19.5.3
    text: |-
      Aanbieders van huurlijnennetwerken of huurlijnen die op het tijdstip van inwerkingtreding van de
      [Wet implementatie Europees regelgevingskader voor de elektronische communicatiesector 2002][ref1] door het
      college aangewezen zijn op grond van de [artikelen 6.4, eerste lid][ref2], of [7.2][ref3], zoals die luidden
      voor de inwerkingtreding van die wet, behouden de daaraan verbonden verplichtingen tot de inwerkingtreding van de
      besluiten, bedoeld in [artikel 19.4, derde lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0016635
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0009950#Artikel19
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel19.5
    references:
