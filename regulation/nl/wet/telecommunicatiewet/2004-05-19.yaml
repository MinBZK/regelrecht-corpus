  - number: 19.6.1
    text: |-
      Tot vierentwintig maanden na inwerkingtreding van de
      [Wet implementatie Europees regelgevingskader voor de elektronische communicatiesector 2002][ref1] blijft
      [artikel 8.7][ref2], zoals dat luidde voor dat tijdstip, van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0016635
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel8
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel19.6
