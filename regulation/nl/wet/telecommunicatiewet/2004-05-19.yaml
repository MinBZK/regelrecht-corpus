        bwb_id: BWBR0016635
  - number: 19.6.3
    text: Het eerste lid vervalt bij inwerkingtreding van de besluiten, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel19.6
  - number: 19.6.4
    text: |-
      Een verzoek als bedoeld in [artikel 8.7][ref1], zoals dat luidde voor inwerkingtreding van de
      [Wet implementatie Europees regelgevingskader voor de elektronische communicatiesector 2002][ref2], wordt vanaf het
      tijdstip waarop [artikel 8.7][ref3] niet langer van toepassing is op aanbieders van omroepnetwerken, aangemerkt als
      een aanvraag als bedoeld in [artikel 12.2][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0016635
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0009950#Artikel12
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel19.6
    references:
