        artikel: '7'
        hoofdstuk: '7'
      - id: ref4
        bwb_id: BWBR0009950
        artikel: '19'
        hoofdstuk: '19'
  - number: 19.5.4
    text: |-
      De in het eerste tot en met derde lid bedoelde verplichtingen omvatten mede verplichtingen inzake interconnectie
      als bedoeld in [artikel 6.1, eerste, tweede en vijfde lid][ref1], zoals dat luidde voor de inwerkingtreding van
      de [Wet implementatie Europees regelgevingskader voor de elektronische communicatiesector 2002][ref2], voor zover
      het verzoek met betrekking tot het tot stand brengen van interconnectie uitgaat van een andere aanbieder dan de
      aanbieder, bedoeld in het eerste, tweede, onderscheidenlijk derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0016635
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel19.5
    references:
