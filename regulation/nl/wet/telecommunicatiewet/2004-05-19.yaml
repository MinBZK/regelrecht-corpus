  - number: 19.5.2
    text: |-
      Aanbieders van mobiele openbare telefoonnetwerken of mobiele openbare
      telefoondiensten die op het tijdstip van inwerkingtreding van de
      [Wet implementatie Europees regelgevingskader voor de elektronische communicatiesector 2002][ref1] door het college
      aangewezen zijn op grond van [artikel 6.4, eerste of tweede lid][ref2], zoals dat luidde voor de inwerkingtreding
      van die wet, behouden de daaraan verbonden verplichtingen tot de inwerkingtreding van de besluiten, bedoeld in
      [artikel 19.4, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0016635
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel19
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel19.5
    references:
