  - number: 6b.6.c
    text: |-
      een besluit als bedoeld in [artikel 6a.16, eerste of tweede lid][ref1], en de aan een dergelijk besluit ten
      grondslag liggende bepaling van de relevante markten, bedoeld in [artikel 6a.1, eerste of tweede lid][ref2], en
      het onderzoek van die markten, bedoeld in [artikel 6a.1, derde lid][ref3], respectievelijk het onderzoek van de
      transnationale markten, bedoeld in [artikel 6a.1, vierde lid][ref4];


