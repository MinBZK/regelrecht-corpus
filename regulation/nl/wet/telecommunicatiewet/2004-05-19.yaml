        paragraaf: '12.2'
  - number: '19.7'
    text: |-
      Een aanvraag als bedoeld in de [artikelen 3.11, vierde lid][ref1], of
      [6.3, eerste of tweede lid][ref2], zoals deze luidden voor de inwerkingtreding van de
      [Wet implementatie Europees regelgevingskader voor de elektronische communicatiesector 2002][ref3], wordt vanaf dat
      tijdstip aangemerkt als een aanvraag als bedoeld in [artikel 12.2][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0016635
      [ref4]: https://wetten.overheid.nl/BWBR0009950#Artikel12
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel19.7
    references:
