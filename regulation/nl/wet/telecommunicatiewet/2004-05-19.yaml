        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
      - id: ref2
        bwb_id: BWBR0016635
  - number: 19.4.1
    text: |-
      Het college zorgt voor gelijktijdige inwerkingtreding van besluiten als bedoeld in de
      [artikelen 6a.2, eerste lid][ref1], [6a.3, eerste lid][ref2], en [6a.16, eerste lid][ref3], waaraan een relevante
      markt onderscheidenlijk een transnationale markt ten grondslag ligt waarop aanbieders van vaste openbare
      telefoonnetwerken of vaste openbare telefoondiensten actief zijn die verplichtingen hebben uit hoofde van
      [artikel 19.5, eerste lid][ref4], of uit hoofde van artikel 3, tweede lid, van [verordening (EG) nr. 2887/2000]
      (onbekend) van het Europees Parlement en de Raad van de Europese Unie van 18 december 2000 inzake ontbundelde
      toegang tot het aansluitnetwerk (PbEG L 336).


