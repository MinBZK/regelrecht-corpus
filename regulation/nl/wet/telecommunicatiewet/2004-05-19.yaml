  - number: 19.5.1
    text: |-
      Aanbieders van vaste openbare telefoonnetwerken of vaste openbare
      telefoondiensten die op het tijdstip van inwerkingtreding van de
      [Wet implementatie Europees regelgevingskader voor de elektronische communicatiesector 2002][ref1] door het college
      aangewezen zijn op grond van [artikel 6.4, eerste lid][ref2], zoals dat luidde voor de inwerkingtreding van die
      wet, behouden de aan deze aanwijzing verbonden verplichtingen tot de inwerkingtreding van de besluiten, bedoeld in
      [artikel 19.4, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0016635
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel19
