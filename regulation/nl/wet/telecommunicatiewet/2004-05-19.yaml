  - number: '19.9'
    text: |-
      Na inwerkingtreding van de
      [Wet implementatie Europees regelgevingskader voor de elektronische communicatiesector 2002][ref1], geldt:


      [ref1]: https://wetten.overheid.nl/BWBR0016635
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel19.9
    references:
      - id: ref1
        bwb_id: BWBR0016635
  - number: 19.9.a
    text: |-
      ten aanzien van de verwerking van verkeersgegevens, bedoeld in [artikel 11.5, tweede lid][ref1], dat de aanbieder
      binnen zes maanden de abonnee de gegevens verstrekt, bedoeld in [artikel 11.5, vierde lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel11
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel19.9
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.1'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.1'
  - number: 19.9.b
    text: |-
      dat de toestemming, bedoeld in [artikel 11.5, derde lid][ref1], niet is vereist voor de verkeersgegevens die reeds
      in gebruik zijn voor het doel dat is genoemd in [artikel 11.5, derde lid, onderdeel a][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel11
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel19.9
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.1'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.1'
  - number: 19.9.c
    text: |-
      ten aanzien van de verkeersgegevens, bedoeld in onderdeel b, dat de aanbieder binnen zes maanden aan de abonnee
      mededeling doet van de informatie, bedoeld in [artikel 11.5, vierde lid][ref1]. De abonnee wordt geacht met
      betrekking tot dit gebruik toestemming te hebben verleend, tenzij hij binnen een termijn van twee maanden na
      verzending van de mededeling schriftelijk aan de desbetreffende aanbieder te kennen heeft gegeven dat voor het
      desbetreffende gebruik geen toestemming wordt gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel11
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel19.9
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.1'
  - number: '19.10'
    text: |-
      Na inwerkingtreding van de
      [Wet implementatie Europees regelgevingskader voor de elektronische communicatiesector 2002][ref1] geldt:


      [ref1]: https://wetten.overheid.nl/BWBR0016635
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel19.10
    references:
      - id: ref1
        bwb_id: BWBR0016635
  - number: 19.10.a
    text: |-
      dat [artikel 11.6][ref1] niet van toepassing is op edities van gedrukte algemeen beschikbare abonneelijsten en
      algemeen beschikbare abonneelijsten die in elektronische vorm, anders dan met gebruikmaking van een elektronisch
      communicatienetwerk of een elektronische communicatiedienst, worden uitgegeven, indien deze edities zijn uitgegeven
      dan wel gereed gemaakt zijn voor uitgifte, voor de datum van inwerkingtreding van dat artikel;


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel11
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel19.10
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.1'
  - number: 19.10.b
    text: |-
      een ieder die een algemeen beschikbare abonneelijst uitgeeft of een algemeen beschikbare abonnee-informatiedienst
      verzorgt, binnen zes maanden na inwerkingtreding van [artikel 11.6][ref1] de abonnee van een openbare
      telefoondienst wiens persoonsgegevens op het moment van inwerkingtreding van dat artikel zijn opgenomen in de
      abonneelijst dan wel in het voor de abonnee-informatiedienst gebruikte abonneebestand, op de hoogte stelt van
      de informatie, bedoeld in [artikel 11.6, eerste lid][ref2]. Daarbij wordt aan de abonnee de mogelijkheid geboden
      om verzet aan te tekenen tegen het feit dat hem betreffende persoonsgegevens in de abonneelijst of in het voor
      de abonnee-informatiedienst gebruikte abonneebestand zijn opgenomen. Indien de abonnee verzet aantekent, is
      [artikel 41, tweede lid, van de Wet bescherming persoonsgegevens][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0011468#Artikel41
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel19.10
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.1'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.1'
      - id: ref3
        bwb_id: BWBR0011468
        artikel: '41'
  - number: '19.11'
    text: |-
      Op besluiten die door het college zijn genomen op grond van hoofdstuk 6,
      waartegen bezwaar of beroep kon worden ingesteld voor de inwerkingtreding van de
      [Wet implementatie Europees regelgevingskader voor de elektronische communicatiesector 2002][ref1],
      is, in afwijking van [artikel 17.1, eerste lid][ref2], de rechtbank te Rotterdam bevoegd, en blijft
      [artikel 17.1, derde lid][ref3], buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0016635
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel17
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel19.11
    references:
