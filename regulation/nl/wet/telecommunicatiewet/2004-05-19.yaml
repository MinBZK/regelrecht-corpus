        bwb_id: BWBR0009950
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0016635
  - number: 19.5.5
    text: |-
      Indien vierentwintig maanden na de inwerkingtreding van de
      [Wet implementatie Europees regelgevingskader voor de elektronische communicatiesector 2002][ref1] een aanbieder
      als bedoeld in het eerste tot en met vierde lid verplichtingen heeft op grond van genoemde leden, vervallen deze
      verplichtingen van rechtswege.


      [ref1]: https://wetten.overheid.nl/BWBR0016635
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel19.5
    references:
      - id: ref1
        bwb_id: BWBR0016635
  - number: 19.5.6
    text: |-
      Aanbieders van vaste openbare telefoonnetwerken die op 24 juli 2003 door het college op grond van
      [artikel 6.4, eerste lid][ref1], zijn aangewezen, blijven tot vierentwintig maanden na inwerkingtreding van de
      [Wet implementatie Europees regelgevingskader voor de elektronische communicatiesector 2002][ref2], of indien de
      besluiten, bedoeld in [artikel 19.4, eerste lid][ref3], eerder in werking treden tot dat tijdstip, een aangemelde
      exploitant als bedoeld in artikel 2, onderdeel a, van [verordening (EG) nr. 2887/2000](onbekend) van het Europees
      Parlement en de Raad van de Europese Unie van 18 december 2000 inzake ontbundelde toegang tot het aansluitnetwerk
      (PbEG L 336).


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0016635
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel19
    url: https://wetten.overheid.nl/BWBR0009950/2004-05-19#Artikel19.5
    references:
