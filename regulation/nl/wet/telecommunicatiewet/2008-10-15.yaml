  - number: '20.18'
    text: |-
      Bij algemene maatregel van bestuur kunnen tot twee jaar na inwerkingtreding van deze wet, in gevallen waarin deze
      wet niet voorziet, regels worden gesteld met betrekking tot de invoering van artikelen van deze wet of onderdelen
      daarvan.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel20.18
  - number: '20.19'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel20.19
  - number: '20.20'
