        artikel: '41'
  - number: '19.11'
    text: |-
      Op besluiten die door het college zijn genomen op grond van hoofdstuk 6,
      waartegen bezwaar of beroep kon worden ingesteld voor de inwerkingtreding van de
      [Wet implementatie Europees regelgevingskader voor de elektronische communicatiesector 2002][ref1],
      is, in afwijking van [artikel 17.1, eerste lid][ref2], de rechtbank te Rotterdam bevoegd, en blijft
      [artikel 17.1, derde lid][ref3], buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0016635
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel17
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel19.11
    references:
