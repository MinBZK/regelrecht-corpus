        paragraaf: 6a.3
      - id: ref8
        bwb_id: BWBR0009950
        artikel: 6b
        hoofdstuk: 6b
      - id: ref9
        bwb_id: BWBR0009950
        artikel: 6b
        hoofdstuk: 6b
      - id: ref10
        bwb_id: BWBR0009950
        artikel: 6b
        hoofdstuk: 6b
  - number: 6a.22
    text: |-
      Bij algemene maatregel van bestuur kunnen andere verplichtingen dan de verplichtingen, bedoeld
      in de [artikelen 6a.12 tot en met 6a.14][ref1], worden aangewezen die het college op grond van
      [artikel 6a.21, derde lid][ref2], kan opleggen aan ondernemingen die een aanmerkelijke marktmacht hebben bij het
      aanbieden van programmadiensten.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.22
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.3
      - id: ref2
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.7
  - number: 6b.1.1
    text: |-
      Op de voorbereiding van een besluit van het college als bedoeld in de [artikelen 6.2][ref1], [6a.2][ref2],
      [6a.3][ref3], [6a.16][ref4] en [6a.18][ref5], is [afdeling 3.4 van de Algemene wet bestuursrecht][ref6] van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref4]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref5]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6b.1
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
      - id: ref3
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
      - id: ref4
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.4
      - id: ref5
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.5
      - id: ref6
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 6b.1.2
    text: |-
      In afwijking van het eerste lid kan het college besluiten om de in het eerste lid bedoelde procedure niet toe te
      passen indien het besluit geen aanzienlijke gevolgen heeft voor de desbetreffende markt.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6b.1
  - number: 6b.1.3
    text: |-
      Indien het een besluit op aanvraag betreft, is [artikel 3:18 van de Algemene wet bestuursrecht][ref1] niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6b.1
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 6b.2.1
    text: |-
      Indien een besluit als bedoeld in [artikel 6b.1, eerste lid][ref1], van invloed is op de handel tussen de
      lidstaten, legt het college het ontwerp van het desbetreffende besluit en de gronden die aan het ontwerpbesluit ten
      grondslag liggen, voor aan de Commissie van de Europese Gemeenschappen en aan de nationale regelgevende instanties,
      bedoeld in artikel 7 van [richtlijn nr. 2002/21/EG](onbekend) en stelt het college hen gedurende een maand in de
      gelegenheid daarover opmerkingen te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6b
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6b.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6b
        hoofdstuk: 6b
  - number: 6b.2.2
    text: Het college neemt het besluit niet dan nadat de in het eerste lid bedoelde termijn van een maand is verstreken.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6b.2
  - number: 6b.2.3
    text: |-
      Het college houdt bij het nemen van het besluit zoveel mogelijk rekening met de opmerkingen die de Commissie van
      de Europese Gemeenschappen en de nationale regelgevende instanties met betrekking tot het ontwerp aan het college
      hebben medegedeeld.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6b.2
  - number: 6b.2.4
    text: |-
      Indien de Commissie van de Europese Gemeenschappen binnen de termijn, bedoeld in het tweede lid, heeft medegedeeld
      dat zij van mening is dat het voorgelegde ontwerpbesluit een belemmering vormt voor de interne Europese markt of
      dat zij ernstige twijfels heeft omtrent de verenigbaarheid van het ontwerpbesluit met het Gemeenschapsrecht, wacht
      het college tenminste twee maanden vanaf de datum van die mededeling met het vaststellen van zijn besluit.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6b.2
  - number: 6b.2.5
    text: |-
      Indien de Commissie van de Europese Gemeenschappen overeenkomstig artikel 7, vierde lid, van [richtlijn nr.
      2002/21/EG](onbekend) een beschikking heeft gegeven:
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6b.2
  - number: 6b.2.5.a
    text: |-
      brengt het college het ontwerp met betrekking tot de door de Commissie in de beschikking aangegeven voorstellen in
      overeenstemming met het Gemeenschapsrecht, of
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6b.2
  - number: 6b.2.5.b
    text: |-
      besluit het college het desbetreffende ontwerpbesluit niet vast te stellen. Van dit besluit wordt mededeling gedaan
      in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6b.2
  - number: 6b.2.6
    text: |-
      Het college stuurt een overeenkomstig dit artikel voorbereid besluit in afschrift aan de Commissie van de Europese
      Gemeenschappen.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6b.2
  - number: 6b.3.1
    text: |-
      Het college kan in uitzonderlijke omstandigheden indien de vereiste spoed zich verzet tegen de toepassing van de
      procedures, bedoeld in de [artikelen 6b.1, eerste lid][ref1], of [6b.2][ref2], die procedures buiten toepassing
      laten bij het nemen van een besluit als bedoeld in de [artikelen 6.2][ref3], [6a.2, eerste lid, onder a][ref4],
      [6a.16, eerste lid][ref5], of [6a.18, eerste lid][ref6], ten einde de concurrentie te waarborgen of de belangen van
      de gebruikers te beschermen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6b
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6b
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref5]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref6]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6b.3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6b
        hoofdstuk: 6b
      - id: ref2
        bwb_id: BWBR0009950
        artikel: 6b
        hoofdstuk: 6b
      - id: ref3
        bwb_id: BWBR0009950
        artikel: '6'
        hoofdstuk: '6'
      - id: ref4
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
      - id: ref5
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.4
      - id: ref6
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.5
  - number: 6b.3.2
    text: Een besluit als bedoeld in het eerste lid geldt voor een periode van maximaal 26 weken.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6b.3
  - number: 6b.4
    text: |-
      Indien een nationale regelgevende instantie, bedoeld in [artikel 6b.2, eerste lid][ref1], ingevolge artikel 7,
      derde lid, van [richtlijn nr. 2002/21/EG](onbekend) een ontwerp van een besluit aan het college voorlegt, doet het
      college zijn opmerkingen aan die nationale regelgevende instantie binnen de door die instantie gestelde termijn
      toekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6b
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6b.4
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6b
        hoofdstuk: 6b
  - number: 6b.5.1
    text: |-
      Op de voorbereiding van een besluit van het college tot het opleggen, instandhouden of intrekken van een
      verplichting als bedoeld in een op basis van [artikel 6a.11][ref1] tot stand gekomen ministeriële regeling is de
      procedure, bedoeld in [artikel 6b.1][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6b
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6b.5
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.2
      - id: ref2
        bwb_id: BWBR0009950
        artikel: 6b
        hoofdstuk: 6b
  - number: 6b.5.2
    text: |-
      Het college legt een ontwerp van een besluit als bedoeld in het eerste lid voor aan de Commissie van de Europese
      Gemeenschappen en de nationale regelgevende instanties die overeenkomstig artikel 3, zesde lid, van [richtlijn nr.
      2002/21/EG](onbekend) zijn aangemeld.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6b.5
  - number: 6b.5.3
    text: |-
      Het college gaat niet over tot het nemen van een besluit als bedoeld in het eerste lid dan nadat de Commissie van
      de Europese Gemeenschappen daartoe overeenkomstig artikel 14, tweede lid, van [richtlijn nr. 2002/19/EG](onbekend)
      toestemming heeft gegeven. Het college houdt daarbij rekening met de door de nationale regelgevende instanties
      gemaakte opmerkingen.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6b.5
  - number: 6b.6
    text: |-
      Voor de mogelijkheid van beroep ingevolge [hoofdstuk 8 van de Algemene wet bestuursrecht][ref1] worden als één
      besluit aangemerkt:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6b.6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '8'
  - number: 6b.6.a
    text: |-
