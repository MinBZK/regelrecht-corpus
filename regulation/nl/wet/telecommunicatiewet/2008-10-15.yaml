        hoofdstuk: '20'
  - number: 15.1.2
    text: |-
      Met het toezicht op de naleving van [artikel 6a.20, derde lid][ref1], zijn belast de bij besluit van de raad van
      bestuur van de mededingingsautoriteit aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel15.1
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.6
  - number: 15.1.3
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens andere bepalingen van deze wet dan bedoeld in het
      eerste en tweede lid en met het toezicht op de naleving van de bepalingen van de roamingverordening zijn belast de
      bij besluit van het college aangewezen ambtenaren. De vorige volzin is niet van toepassing op het bepaalde bij of
      krachtens de [artikelen 5.1][ref1], [5.4][ref2], [5.5][ref3], [5.6, tweede, derde lid, vierde en vijfde lid][ref4],
      [5.7][ref5], [5.13][ref6] en [5.14][ref7] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0009950#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0009950#Artikel5
      [ref6]: https://wetten.overheid.nl/BWBR0009950#Artikel5
      [ref7]: https://wetten.overheid.nl/BWBR0009950#Artikel5
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel15.1
