      - id: ref4
        bwb_id: BWBR0009950
        artikel: '9'
        hoofdstuk: '9'
      - id: ref5
        bwb_id: BWBR0009950
        artikel: '9'
        hoofdstuk: '9'
  - number: 20.1.2
    text: |-
      Aan de uit het vorige lid voortvloeiende verplichting voor KPN Telecom B.V. om de in
      [artikel 9.1, eerste lid][ref1], bedoelde openbare elektronische communicatiediensten en voorzieningen te verzorgen
      komt een einde een jaar na het tijdstip waarop:


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel9
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel20.1
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '9'
        hoofdstuk: '9'
  - number: 20.1.2.a
    text: |-
      KPN Telecom B.V. Onze Minister schriftelijk heeft medegedeeld een verplichting tot verzorging van een bepaalde
      dienst of voorziening niet langer te willen nakomen, of
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel20.1
  - number: 20.1.2.b
    text: |-
      Onze Minister schriftelijk aan KPN Telecom B.V. heeft medegedeeld dat een verplichting tot verzorging van een
      bepaalde dienst of voorziening niet langer bestaat.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel20.1
  - number: 20.2.1
    text: |-
      Een vergunning die is verleend krachtens artikel 13a, eerste lid, van de Wet op de telecommunicatievoorzieningen
      wordt gelijkgesteld met een vergunning, verleend krachtens [artikel 3.3, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel20.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 20.2.2
    text: |-
      Voor de houder van een vergunning als bedoeld in het eerste lid blijft het bepaalde bij of krachtens de artikelen
      13c, 13g, met dien verstande dat in het eerste lid, onderdeel a, vervalt «waaronder technische aftapbaarheid»,
      13j, 13k, met uitzondering van het zevende lid, 13l, 13n, 13t, voorzover het betreft de verwijzing naar
      artikel 11, eerste tot en met derde lid, en vijfde tot en met zevende lid, 13v, 13x en 13y van de Wet op de
      telecommunicatievoorzieningen van toepassing.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel20.2
  - number: 20.3.1
    text: |-
      Een machtiging die is verleend krachtens artikel 17, eerste lid, van de Wet op de telecommunicatievoorzieningen
      wordt gelijkgesteld met een vergunning, verleend krachtens [artikel 3.3, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel20.3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 20.3.2
    text: |-
      De toekenning van radio-frequenties krachtens artikel 3, tweede lid, van de Wet op de telecommunicatievoorzieningen
      aan de houder van de concessie wordt gelijkgesteld met een vergunning voor het gebruik van frequentieruimte als
      bedoeld in [artikel 3.3, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel20.3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 20.3.3
    text: |-
      Voorzover bij een machtiging die is verleend krachtens artikel 21 van de Wet op de telecommunicatievoorzieningen
      radiofrequenties zijn toegekend, wordt deze toekenning van radiofrequenties gelijkgesteld met een vergunning voor
      het gebruik van frequentieruimte als bedoeld in [artikel 3.3, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel20.3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 20.3.4
    text: |-
      Een vergunning als bedoeld in het eerste, tweede en derde lid, geldt voor een bij algemene maatregel van bestuur
      vast te stellen termijn, waarbij een onderscheid kan worden gemaakt al naar gelang de toepassing waarvoor de
      vergunning is verleend.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel20.3
  - number: 20.3.5
    text: |-
      Het bepaalde in [artikel 3.3, zevende lid][ref1], alsmede het bepaalde in [artikel 3.3a, achtste lid][ref2],
      is slechts van toepassing op de uitgifte van vergunningen volgende op de verlening van vergunningen die heeft
      plaatsgevonden na 27 juli 2001.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel20.3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '20.4'
    text: |-
      Apparaten die op het tijdstip van inwerkingtreding van deze wet in gebruik zijn bij de houder van de concessie,
      bedoeld in artikel 3, eerste lid, van de Wet op de telecommunicatievoorzieningen, ten dienste van de uitoefening
      van de aan de houder van de concessie opgedragen taken, worden, voorzover deze niet voldoen aan het bepaalde
      bij of krachtens [hoofdstuk 10 van deze wet][ref1], geacht te voldoen aan het bepaalde bij of krachtens
      [hoofdstuk 10][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk10
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk10
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel20.4
    references:
      - id: ref1
        bwb_id: BWBR0009950
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0009950
        hoofdstuk: '10'
  - number: 20.4a.1
    text: |-
      Uitrusting die voldoet aan de bij of krachtens de Telecommunicatiewet vastgestelde regels met betrekking tot de
      elektromagnetische compatibiliteit die van kracht waren op 19 juli 2007, mag in afwijking van [artikel 10.1][ref1]
      van de Telecommunicatiewet, tot 20 juli 2009 in de handel worden gebracht of worden verhandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel10
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel20.4a
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: '10.1'
  - number: 20.4a.2
    text: |-
      Het bepaalde in het eerste lid is slechts van toepassing voorzover de daar bedoelde uitrusting voldoet aan bij of
      krachtens de Telecommunicatiewet gestelde regels die niet zien op elektromagnetische compatibiliteit.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel20.4a
  - number: 20.5.1
    text: |-
      Met betrekking tot de instandhouding, de verplaatsing en de opruiming van kabels en kabelwerken, voorzover de
      kabels en kabelwerken zijn aangelegd met toepassing van hoofdstuk VI van de Wet op de telecommunicatievoorzieningen
      is [hoofdstuk 5][ref1] van deze wet van toepassing met dien verstande, dat kabels en kabelwerken,
      aangelegd in en op openbare gronden als bedoeld in artikel 1, onderdeel g, onder 3°, van de Wet op de
      telecommunicatievoorzieningen worden gelijkgesteld met kabels, aangelegd in en op openbare gronden als bedoeld in
      [artikel 1.1, onderdeel aa][ref2], van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel1
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel20.5
    references:
      - id: ref1
        bwb_id: BWBR0009950
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '1'
        hoofdstuk: '1'
  - number: 20.5.2
    text: |-
      In afwijking van de [artikelen 5.2, achtste lid][ref1], en [5.15][ref2] geldt voor kabels, ondergrondse
      ondersteuningswerken of beschermingswerken in of op openbare gronden, waarin of waarop geen fysieke
      geleidingsdraden bestemd voor de rechtstreekse overdracht van signalen tussen punten zijn aangebracht, die zijn
      aangelegd met het oogmerk deel uit te maken van doch op het tijdstip van inwerkingtreding van de wet houdende
      wijziging van de Telecommunicatiewet in verband met een herziening van het nationale beleid ten aanzien van de
      aanleg van kabels ten dienste van openbare elektronische communicatienetwerken (Stb. 2007, 16) niet in gebruik
      zijn ten dienste van een openbaar elektronisch communicatienetwerk, een gedoogplicht tot 1 januari 2018, tenzij
      de instandhouding van deze voorzieningen de instandhouding van andere reeds in de grond aanwezige werken in
      gevaar brengt of ernstig hindert. De aanbieder meldt aan degene op wie de gedoogplicht rust schriftelijk op
      welke netwerkvoorziening de gedoogplicht betrekking heeft. Daarvan doet hij tevens mededeling aan burgemeester en
      wethouders van de gemeente binnen wier grondgebied de netwerkvoorziening is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel5
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel20.5
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 20.6.1
    text: |-
      Een nummerplan vastgesteld krachtens artikel 40d van de Wet op de telecommunicatievoorzieningen wordt gelijkgesteld
      met een nummerplan als bedoeld in deze wet.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel20.6
  - number: 20.6.2
    text: |-
      De toekenning of reservering van nummers, bedoeld in artikel 17, elfde lid, van de Wet op de
      telecommunicatievoorzieningen, de toekenning of reservering van nummers alsmede de wijziging daarvan, bedoeld
      in artikel 40d van de Wet op de telecommunicatievoorzieningen, de toekenning van nummers als bedoeld in
      artikel 40e van de Wet op de telecommunicatievoorzieningen, alsmede de toekenning van nummers, bedoeld in
      [artikel 2, derde lid, van de Vergunningenwet kabelgebonden telecommunicatie-infrastructuur][ref1], worden
      gelijkgesteld met een reservering, toekenning of wijziging als bedoeld in [hoofdstuk 4][ref2] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0007973#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel20.6
    references:
      - id: ref1
        bwb_id: BWBR0007973
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0009950
        hoofdstuk: '4'
  - number: 20.11.1
    text: |-
      De rechthebbende op of de beheerder van gronden is verplicht te gedogen dat ten dienste van openbare
      elektronische communicatienetwerken kabels, die voor de inwerkingtreding van de wet, houdende wijziging van de
      Telecommunicatiewet in verband met een herziening van het nationale beleid ten aanzien van de aanleg van kabels ten
      dienste van openbare elektronische communicatienetwerken (Stb. 2007, 16), boven deze gronden zijn aangelegd, worden
      instandgehouden of opgeruimd. De eerste volzin is tevens van toepassing op de bij de kabels behorende bovengrondse
      ondersteuningswerken.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel20.11
  - number: 20.11.2
    text: |-
      De [artikelen 5.3 tot en met 5.8][ref1], [5.10][ref2], [5.13][ref3] en [5.14][ref4] van deze wet zijn van
      overeenkomstige toepassing op de in het eerste lid bedoelde kabels en ondersteuningswerken.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0009950#Artikel5
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel20.11
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
      - id: ref3
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
      - id: ref4
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 20.11.3
    text: |-
      [Artikel 5.8][ref1] van de Telecommunicatiewet, zoals dat luidde voor het tijdstip van inwerkingtreding van de wet,
      houdende wijziging van de Telecommunicatiewet in verband met een herziening van het nationale beleid ten aanzien
      van de aanleg van kabels ten dienste van openbare elektronische communicatienetwerken, is van toepassing op de
      instandhouding van de in het eerste lid bedoelde kabels en ondersteuningswerken.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel5
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel20.11
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 20.12.1
    text: |-
      [Artikel 5.14, eerste lid][ref1], is niet van toepassing op een gemeente die openbare elektronische
      communicatienetwerken of openbare elektronische communicatiediensten aanbiedt, voor zover die gemeente op het
      tijdstip van inwerkingtreding van de wet, houdende wijziging van de Telecommunicatiewet in verband met een
      herziening van het nationale beleid ten aanzien van de aanleg van kabels ten dienste van openbare elektronische
      communicatienetwerken (Stb. 2007, 16) deze netwerken of diensten reeds aanbiedt.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel5
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel20.12
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 20.12.2
    text: |-
      [Artikel 5.14, tweede tot en met vierde lid][ref1], is niet van toepassing op een gemeente met een belang
      of zeggenschap in een onderneming die openbare elektronische communicatienetwerken of openbare elektronische
      communicatiediensten aanbiedt, voor zover die gemeente dat belang of die zeggenschap op het tijdstip van
      inwerkingtreding van de wet, houdende wijziging van de Telecommunicatiewet in verband met een herziening van het
      nationale beleid ten aanzien van de aanleg van kabels ten dienste van openbare elektronische communicatienetwerken
      (Stb. 2007, 16) reeds heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel5
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel20.12
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 20.15.1
    text: |-
      Ten aanzien van de mogelijkheid om bezwaar te maken of beroep in te stellen tegen een besluit krachtens de Wet op
      de telecommunicatievoorzieningen dat is bekendgemaakt voor het tijdstip van inwerkingtreding van deze wet, blijft
      het recht zoals het gold voor dat tijdstip van toepassing.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel20.15
  - number: 20.15.2
    text: |-
      Ten aanzien van de behandeling van bezwaar of beroep dat voor het tijdstip van inwerkingtreding van deze wet is
      gemaakt onderscheidenlijk is ingesteld, blijft het recht zoals het gold voor dat tijdstip van toepassing.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel20.15
  - number: 20.15.3
    text: |-
      Ten aanzien van de behandeling van bezwaar of beroep dat op of na het tijdstip van inwerkingtreding van deze wet
      is gemaakt onderscheidenlijk is ingesteld en dat is gericht tegen een besluit waartegen voor dat tijdstip eveneens
      bezwaar is gemaakt onderscheidenlijk beroep is ingesteld, blijft het recht zoals het gold voor dat tijdstip van
      toepassing.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel20.15
  - number: 20.15a.1
    text: |-
      Op nummers die op het tijdstip van inwerkingtreding van de Wijziging van de Telecommunicatiewet in verband met het
      vaststellen van nadere bepalingen over het gebruik van nummers ter bescherming van de consument zijn gereserveerd
      blijven de [artikelen 4.4][ref1], [4.5][ref2], [4.6][ref3], [4.7][ref4] en [4.8, eerste lid][ref5], van de
      Telecommunicatiewet, zoals deze luidden voor de inwerkingtreding van genoemde wet van toepassing tot het tijdstip
      dat de reservering is beëindigd.


