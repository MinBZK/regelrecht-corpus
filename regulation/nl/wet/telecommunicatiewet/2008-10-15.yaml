  - number: 7.1.1
    text: |-
      Een aanbieder van een openbare elektronische communicatiedienst verstrekt voor of bij het sluiten van een
      overeenkomst met een consument aan hem de volgende gegevens op schrift of op een andere te zijner beschikking
      staande en voor hem toegankelijke duurzame gegevensdrager:
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel7.1
  - number: 7.1.1.a
    text: de naam en het adres van vestiging van de aanbieder;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel7.1
  - number: 7.1.1.b
    text: de te verstrekken diensten en de wachttijd bij eerste aansluiting op een openbare elektronische communicatiedienst;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel7.1
  - number: 7.1.1.c
    text: het kwaliteitsniveau van de te verstrekken diensten;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel7.1
  - number: 7.1.1.d
    text: de soorten onderhoudsdiensten;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel7.1
  - number: 7.1.1.e
    text: |-
      de geldende tariefstructuur, de belangrijkste tarieven en de wijze waarop informatie verkregen kan worden over de
      geldende tarieven en onderhoudskosten;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel7.1
  - number: 7.1.1.f
    text: |-
      de duur van de overeenkomst alsmede de voorwaarden waaronder de overeenkomst of onderdelen daarvan, kan worden
      verlengd of beëindigd;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel7.1
  - number: 7.1.1.g
    text: |-
      de schadevergoedingsregeling of terugbetalingsregeling die geldt indien de overeenkomst, voor zover het het
      kwaliteitsniveau van de geleverde dienst betreft, niet wordt nagekomen, en
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel7.1
  - number: 7.1.1.h
    text: |-
      de wijze waarop gebruik kan worden gemaakt van de geschillencommissie, bedoeld in [artikel 12.1][ref1] of van de
      procedure, bedoeld in [artikel 12.9][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel12
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '12'
        hoofdstuk: '12'
        paragraaf: '12.1'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '12'
        hoofdstuk: '12'
        paragraaf: '12.2'
  - number: 7.1.2
    text: |-
      Een aanbieder van een openbare elektronische communicatiedienst zorgt ervoor dat de gegevens die hij voor of bij
      het sluiten van de overeenkomst verstrekt, opgenomen worden in de tussen hem en de desbetreffende consument te
      sluiten overeenkomst.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel7.1
  - number: 7.1.3
    text: Het eerste en tweede lid zijn van overeenkomstige toepassing op aanbieders van programmadiensten.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel7.1
  - number: 7.1.4
    text: |-
      Bij ministeriële regeling kunnen categorieën van openbare elektronische communicatiediensten of programmadiensten
      worden aangewezen met betrekking waartoe voor de desbetreffende aanbieder de in het eerste en tweede lid bedoelde
      verplichting geheel of gedeeltelijk buiten toepassing blijft.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel7.1
  - number: 7.2.1
    text: |-
      Ten minste vier weken voordat een voorgenomen wijziging van een beding dat is opgenomen in een overeenkomst van
      kracht wordt:
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel7.2
  - number: 7.2.1.a
    text: |-
      biedt een aanbieder van een openbare elektronische communicatiedienst de abonnee de mogelijkheid om de overeenkomst
      kosteloos te beëindigen, en
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel7.2
  - number: 7.2.1.b
    text: |-
      stelt de aanbieder de abonnee op genoegzame wijze op de hoogte van de inhoud van de voorgenomen wijziging en van de
      mogelijkheid om de overeenkomst kosteloos te beëindigen.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel7.2
  - number: 7.2.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing op aanbieders van programmadiensten. Bij ministeriële regeling
      kunnen categorieën van programmadiensten worden aangewezen met betrekking waartoe voor de desbetreffende aanbieder
      de in de vorige volzin bedoelde verplichting geheel of gedeeltelijk buiten toepassing blijft.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel7.2
  - number: 7.3.1
    text: |-
      Onverminderd [artikel 11.9][ref1], worden bij ministeriële regeling regels gesteld ter uitvoering van de bijlagen
      I, deel B, en II van [richtlijn nr. 2002/22/EG](onbekend). Deze regels hebben in elk geval betrekking op het
      door aanbieders van openbare telefoonnetwerken aan hun eindgebruikers beschikbaar stellen van faciliteiten als
      bedoeld in de in de eerste volzin bedoelde bijlage I, deel B, en het door aanbieders van openbare telefoondiensten
      bekendmaken van informatie over de geldende tarieven en voorwaarden met betrekking tot de toegang tot en het
      gebruik van die telefoondiensten.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel11
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel7.3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.2'
  - number: 7.3.2
    text: |-
      Het college kan ontheffing verlenen van een krachtens het eerste lid opgelegde verplichting die strekt tot
      uitvoering van bijlage I, deel B, van [richtlijn nr. 2002/22/EG](onbekend), indien deze technisch niet uitvoerbaar
      dan wel economisch niet haalbaar is. Een ontheffing kan onder beperkingen worden verleend. Het college kan
      voorschriften verbinden aan een ontheffing.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel7.3
  - number: 7.3a.1
    text: |-
      Het college kan aanbieders van openbare elektronische communicatiediensten een aanwijzing geven de betaling die
      gerelateerd is aan het gebruik van bij ministeriële regeling aan te wijzen categorieën van nummers op te schorten
      voor een door het college te bepalen periode, indien het college een aanwijzing heeft dat de nummergebruiker niet
      voldoet aan het gestelde bij of krachtens deze wet of een gedraging verricht als bedoeld in [artikel 4.4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel4
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel7.3a
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '4'
        hoofdstuk: '4'
  - number: 7.3a.2
    text: |-
      De aanbieder van een openbare elektronische communicatiedienst die een aanwijzing, bedoeld in het eerste lid, van
      het college heeft ontvangen, schort de betaling onverwijld op.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel7.3a
  - number: 7.3a.3
    text: |-
      De in het eerste lid genoemde periode is maximaal vier weken en kan door het college eenmalig met maximaal vier
      weken worden verlengd.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel7.3a
  - number: 7.3a.4
    text: Het college stelt de nummergebruiker, voorzover deze bij het college bekend is, van de aanwijzing op de hoogte.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel7.3a
  - number: 7.3b.1
    text: |-
      Het college kan aanbieders van openbare elektronische communicatiediensten een aanwijzing geven de aankiesbaarheid
      van een nummer uit bij ministeriële regeling aan te wijzen categorieën van nummers op te schorten voor een door
      het college te bepalen periode, indien het college een aanwijzing heeft dat de nummergebruiker niet voldoet aan het
      gestelde bij of krachtens deze wet of een gedraging verricht als bedoeld in [artikel 4.4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel4
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel7.3b
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '4'
        hoofdstuk: '4'
  - number: 7.3b.2
    text: |-
      De aanbieder van een openbare elektronische communicatiedienst die een aanwijzing, bedoeld in het eerste lid, van
      het college heeft ontvangen, schort de aankiesbaarheid onverwijld op.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel7.3b
  - number: 7.3b.3
    text: |-
      De in het eerste lid genoemde periode is maximaal vier weken en kan door het college eenmalig met maximaal vier
      weken worden verlengd.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel7.3b
  - number: 7.3b.4
    text: Het college stelt de nummergebruiker, voorzover deze bij het college bekend is, van de aanwijzing op de hoogte.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel7.3b
  - number: 7.3c.1
    text: |-
      Indien het college heeft vastgesteld dat de nummergebruiker met betrekking tot een nummer gedurende een bepaalde
      periode niet heeft voldaan aan het gestelde bij of krachtens deze wet of een gedraging heeft verricht als bedoeld
      in [artikel 4.4][ref1], kan het college hiervan mededeling doen in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel4
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel7.3c
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '4'
        hoofdstuk: '4'
  - number: 7.3c.2
    text: |-
      De aanbieder van een openbare elektronische communicatiedienst verlangt geen betaling van consumenten voor oproepen
      naar nummers indien:
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel7.3c
  - number: 7.3c.2.a
    text: de nummers zijn genoemd in een mededeling als bedoeld in het eerste lid, en
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel7.3c
  - number: 7.3c.2.b
    text: de oproepen hebben plaatsgevonden gedurende de periode waarop die mededeling betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel7.3c
  - number: 7.3c.3
    text: |-
      Indien de consument reeds heeft betaald voor oproepen naar nummers als bedoeld in het tweede lid, betaalt de
      aanbieder de bedragen binnen twee maanden na publicatie van de mededeling als bedoeld in het eerste lid, terug.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel7.3c
  - number: 7.4.1
    text: |-
      Aanbieders van openbare telefoondiensten op een vaste locatie of van openbare betaaltelefoons die krachtens
      [artikel 9.2][ref1] zijn aangewezen en aanbieders van vaste openbare telefoondiensten of van openbare
      betaaltelefoons die langer dan tweeënvijftig weken dergelijke diensten leveren, maken jaarlijks voor 1 april
      op genoegzame wijze een overzicht over het voorafgaande kalenderjaar bekend van de kwaliteit van de door hen
      aangeboden diensten op basis van de in bijlage III van [richtlijn nr. 2002/22/EG](onbekend) gespecificeerde
      parameters, definities en meetmethoden. Het in de eerste volzin bedoelde overzicht wordt voor bekendmaking aan het
      college ter beschikking gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel9
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel7.4
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '9'
        hoofdstuk: '9'
  - number: 7.4.2
    text: |-
      Bij ministeriële regeling kunnen ten aanzien van de in het eerste lid genoemde verplichtingen nadere regels worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel7.4
  - number: 7.4.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen, voor zover niet voorzien op grond van het eerste lid,
      regels worden gesteld inzake het:
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel7.4
  - number: 7.4.3.a
    text: |-
      door aanbieders van openbare elektronische communicatiediensten of programmadiensten maken van een periodiek
      overzicht van de kwaliteit van de door hen aangeboden diensten aan de hand van bij of krachtens die algemene
      maatregel van bestuur te bepalen parameters, definities en meetmethoden;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel7.4
  - number: 7.4.3.b
    text: |-
      door het college, of een door het college aan te wijzen onafhankelijke deskundige derde, onderzoeken of het
      overzicht in overeenstemming is met de desbetreffende regels, en
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel7.4
  - number: 7.4.3.c
    text: bekendmaken van het overzicht en het ter beschikking stellen daarvan aan het college.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel7.4
  - number: 7.4.4
    text: |-
      De regels, bedoeld in het derde lid, kunnen verschillen voor bij die regels te bepalen categorieën van openbare
      elektronische communicatiediensten of programmadiensten.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel7.4
  - number: 7.4.5
    text: |-
      Bij de regels, bedoeld in het tweede en derde lid, kunnen taken worden opgedragen en bevoegdheden worden verleend
      aan het college.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel7.4
  - number: '7.5'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld inzake het, met inachtneming van het bepaalde bij of
      krachtens [hoofdstuk 11][ref1], aan derden ter beschikking stellen van bij die regels aan te wijzen categorieën
      van nummers met bijbehorende gegevens ten behoeve van de beschikbaarheid van telefoongidsen en van een abonnee-
      informatiedienst.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk11
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel7.5
    references:
      - id: ref1
        bwb_id: BWBR0009950
        hoofdstuk: '11'
  - number: 7.6.1
    text: |-
      Aanbieders van openbare telefoonnetwerken en openbare telefoondiensten zorgen ervoor dat de eindgebruikers van dat
      netwerk en van die diensten toegang hebben tot de diensten van een telefonist en tot een abonnee-informatiedienst.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel7.6
  - number: 7.6.2
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld waaraan de in het eerste lid bedoelde abonnee-
      informatiedienst moet voldoen.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel7.6
  - number: 7.7.1
    text: |-
      Aanbieders van openbare telefoonnetwerken, openbare betaaltelefoons en openbare telefoondiensten stellen het
      gebruik van alarmnummers kosteloos en zonder toegangsbelemmeringen ter beschikking aan alle gebruikers van hun
      dienst.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel7.7
  - number: 7.7.2
    text: |-
      Onder een alarmnummer als bedoeld in het eerste lid, wordt verstaan een nummer dat in een nummerplan als bedoeld in
      [artikel 4.1, eerste lid][ref1], bestemd is als alarmnummer.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel4
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel7.7
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '4'
        hoofdstuk: '4'
  - number: 7.7.3
    text: |-
      Aanbieders van openbare telefoonnetwerken, openbare betaaltelefoons en openbare telefoondiensten treffen de
      voorzieningen die noodzakelijk zijn om de toegang tot alarmnummers te waarborgen in het geval van congestie in het
      desbetreffende openbare telefoonnetwerk.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel7.7
  - number: 7.7.4
    text: |-
      Onze Minister kan ontheffing verlenen van het bepaalde in het derde lid, indien het technisch niet uitvoerbaar
      dan wel economisch niet haalbaar is de in dat lid bedoelde voorzieningen te treffen. Een ontheffing kan onder
      beperkingen worden verleend. Onze Minister kan voorschriften verbinden aan een ontheffing.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel7.7
  - number: 7.8.1
    text: |-
      Voor zover de andere artikelen van dit hoofdstuk hierin niet voorzien, kunnen bij of krachtens algemene maatregel
      van bestuur regels worden gesteld voor aanbieders van openbare elektronische communicatienetwerken, openbare
      elektronische communicatiediensten, nummergebruikers of programmadiensten inzake de bescherming van natuurlijke
      personen die gebruik maken van of verzoeken om openbare elektronische communicatiediensten, nummergebruikers of
      programmadiensten voor andere dan bedrijfs- of beroepsdoeleinden. De regels kunnen onder meer betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel7.8
  - number: 7.8.1.a
    text: het bekendmaken van informatie over de geldende tarieven;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel7.8
  - number: 7.8.1.b
    text: de tarifering van bij ministeriële regeling aangewezen categorieën van nummers;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel7.8
  - number: 7.8.1.c
    text: |-
      de omstandigheden waaronder een aanbieder de levering van een openbare elektronische communicatiedienst mag
      opschorten of beëindigen.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel7.8
  - number: 7.8.2
    text: |-
      De regels, bedoeld in het eerste lid, kunnen voor bij die regels te bepalen categorieën van openbare elektronische
      communicatienetwerken, openbare elektronische communicatiediensten, nummergebruikers of programmadiensten
      verschillen. Bij die regels kunnen taken worden opgedragen en bevoegdheden worden verleend aan het college.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel7.8
  - number: '8.3'
    text: |-
      Onze Minister wijst, in overeenstemming met Onze Minister van Onderwijs, Cultuur en Wetenschappen, ten minste
      een aanbieder van een openbaar elektronisch communicatienetwerk dat bestaat uit radiozendapparaten die geschikt
      zijn voor het verspreiden van programma's, aan om programma's uit te zenden die hem in overeenstemming met
      de [Mediawet][ref1] ter uitzending worden aangeboden door de Stichting Radio Nederland Wereldomroep of door
      instellingen die zendtijd als bedoeld in [artikel 1, onderdeel hh, van de Mediawet][ref2], hebben verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0004149
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel1
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel8.3
    references:
      - id: ref1
        bwb_id: BWBR0004149
      - id: ref2
        bwb_id: BWBR0004149
        artikel: '1'
  - number: 8.4a.1
    text: |-
      Bij ministeriële regeling worden ter uitvoering van een bindend besluit van de Raad van de Europese Unie,
      van het Europees Parlement en de Raad gezamenlijk of van de Commissie van de Europese Gemeenschappen,
      technische voorschriften gegeven voor het uitzenden van een televisieprogramma als bedoeld in
      [artikel 1, onder h, van de Mediawet][ref1], dat bedoeld is om te worden uitgezonden in een aspectverhouding groter
      dan 4:3, of dat bedoeld is om volledig digitaal te worden uitgezonden door middel van een openbaar elektronisch
      communicatienetwerk.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel1
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel8.4a
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '1'
  - number: 8.4a.2
    text: |-
      Bij ministeriële regeling worden ter uitvoering van een bindend besluit als bedoeld in het eerste lid voorts
      technische eisen gesteld aan openbare elektronische communicatienetwerken met behulp waarvan de uitzending van
      televisieprogramma's op een volledig digitale wijze plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel8.4a
  - number: 8.5.1
    text: |-
      Bij algemene maatregel van bestuur worden ter uitvoering van een bindend besluit van de Raad van de Europese
      Unie, van het Europees Parlement en de Raad gezamenlijk, of van de Commissie van de Europese Gemeenschappen regels
      gegeven met betrekking tot het door aanbieders verlenen van toegang tot systemen voor voorwaardelijke toegang
      die geschikt en bestemd zijn voor de uitzending van diensten die kunnen worden ontvangen met behulp van digitale
      televisie- of radiosystemen.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel8.5
  - number: 8.5.2
    text: 'De in het eerste lid bedoelde regels hebben in elk geval betrekking op:'
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel8.5
  - number: 8.5.2.a
    text: de technische mogelijkheden van de systemen voor voorwaardelijke toegang ten behoeve van controleoverdracht;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel8.5
  - number: 8.5.2.b
    text: het verlenen van toegang tot systemen voor voorwaardelijke toegang en de voorwaarden waaronder dit geschiedt, en
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel8.5
  - number: 8.5.2.c
    text: |-
      het voeren van een gescheiden boekhouding voor de activiteiten in verband met het aanbod van systemen voor
      voorwaardelijke toegang en voor overige activiteiten.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel8.5
  - number: 8.5.3
    text: |-
      Bij algemene maatregel van bestuur kunnen ter uitvoering van een bindend besluit als bedoeld in het eerste lid
      regels worden gegeven met betrekking tot het verlenen van licenties door houders van industriële eigendomsrechten
      aan fabrikanten van consumentenapparaten waarin gebruik wordt gemaakt van voorwaardelijke toegangsystemen.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel8.5
  - number: 8.5.4
    text: |-
      Bij de regels, bedoeld in het eerste lid, kunnen taken worden opgedragen en bevoegdheden worden verleend aan het
      college.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel8.5
  - number: 8.6.1
    text: |-
      Met het oog op het waarborgen van de toegang van eindgebruikers tot bij algemene maatregel van bestuur aan te
      wijzen diensten die op digitale wijze worden uitgezonden en die kunnen worden ontvangen met behulp van televisie-
      of radiosystemen, kunnen bij algemene maatregel van bestuur regels worden gegeven met betrekking tot het verlenen
      van toegang tot applicatieprogramma-interfaces of elektronische programmagidsen door aanbieders.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel8.6
  - number: 8.6.2
    text: |-
      De in het eerste lid bedoelde regels hebben ten aanzien van aanbieders van applicatieprogramma-interfaces dan wel
      elektronische programmagidsen in elk geval betrekking op:
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel8.6
  - number: 8.6.2.a
    text: |-
      het verlenen van toegang tot applicatieprogramma-interfaces dan wel elektronische programmagidsen, alsmede de
      voorwaarden waaronder dit geschiedt;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel8.6
  - number: 8.6.2.b
    text: het verstrekken van informatie met betrekking tot toegang en de wijze van gebruik van de verstrekte informatie, en
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel8.6
  - number: 8.6.2.c
    text: |-
      het voeren van een gescheiden boekhouding voor de activiteiten in verband met het aanbod van applicatieprogramma-
      interfaces onderscheidenlijk elektronische programmagidsen en voor de overige activiteiten.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel8.6
  - number: 8.6.3
    text: |-
      Bij de regels, bedoeld in het eerste lid, kunnen taken worden opgedragen en bevoegdheden worden verleend aan het
      college.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel8.6
  - number: '8.7'
    text: |-
      Wanneer door het college de in artikel 6a.6 bedoelde verplichting wordt opgelegd aan een onderneming die openbare
      elektronische communicatienetwerken aanbiedt die gebruikt worden voor het verspreiden van programma's, is deze
      onderneming tevens verplicht toegang te verlenen tot het door haar samengestelde programma-aanbod voor zover dat
      programma-aanbod niet versleuteld naar alle aangeslotenen op desbetreffende netwerken wordt verspreid, met dien
      verstande dat de gevraagde toegang alleen behoeft te worden verleend:
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel8.7
  - number: 8.7.a
    text: |-
      in het geval een aanbieder van een programma wenst dat degenen naar wie het programma wordt verspreid, bijdragen in
      de kosten van dat programma, de kosten van de verspreiding hieronder begrepen, en deze aanbieder door de wijze van
      verspreiding hiervoor feitelijk is aangewezen op de onderneming die de openbare elektronische communicatienetwerken
      aanbiedt, en
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel8.7
  - number: 8.7.b
    text: |-
      de onderneming die de openbare elektronische communicatienetwerken aanbiedt geen transparante of objectieve gronden
      heeft om de toegang te weigeren.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel8.7
  - number: 9.1.1
    text: |-
      De volgende diensten zijn voor iedere eindgebruiker, onafhankelijk van diens geografische locatie, tegen een
      betaalbare prijs en met een bepaalde kwaliteit beschikbaar:
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel9.1
  - number: 9.1.1.a
    text: |-
      het naar aanleiding van een redelijk verzoek aansluiten op het openbare telefoonnetwerk op een vaste locatie en het
      bieden van toegang tot de openbare telefoondienst op een vaste locatie;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel9.1
  - number: 9.1.1.b
    text: openbare betaaltelefoons;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel9.1
  - number: 9.1.1.c
    text: gedrukte telefoongidsen;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel9.1
  - number: 9.1.1.d
    text: elektronische telefoongidsen, en
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel9.1
  - number: 9.1.1.e
    text: een abonnee-informatiedienst.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel9.1
  - number: 9.1.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de kwaliteit van de in het eerste lid
      bedoelde diensten.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel9.1
  - number: 9.1.3
    text: |-
      Ter uitvoering van hoofdstuk II van [richtlijn nr. 2002/22/EG](onbekend), kunnen bij algemene maatregel van bestuur
      andere dan de in het eerste lid bedoelde openbare elektronische communicatiediensten of daarmee samenhangende
      voorzieningen worden aangewezen die voor in die maatregel te bepalen categorieën van eindgebruikers, onafhankelijk
      van hun geografische locatie, beschikbaar moeten zijn tegen een betaalbare prijs en met een bij of krachtens die
      maatregel te bepalen kwaliteit.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel9.1
  - number: 9.1.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de in het eerste of derde lid
      bedoelde prijs. Bij de in de eerste volzin bedoelde regels over de prijs kan onderscheid gemaakt worden tussen
      groepen eindgebruikers.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel9.1
  - number: 9.2.1
    text: |-
      Indien naar het oordeel van Onze Minister de beschikbaarheid, de betaalbaarheid of de kwaliteit
      van een of meer van de openbare elektronische communicatiediensten of voorzieningen, bedoeld in
      [artikel 9.1, eerste of derde lid][ref1], niet door het normale functioneren van de markt wordt of zal kunnen
      worden gegarandeerd, kan Onze Minister bij besluit de verzorging van de desbetreffende diensten of voorzieningen in
      een bij dat besluit te bepalen verzorgingsgebied voor ten hoogste vijf jaar opdragen aan degene die overeenkomstig
      de in dit artikel geregelde procedure wordt aangewezen als degene die de laagste totale nettokosten verwacht.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel9
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel9.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.2.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden ter uitvoering van hoofdstuk II van [richtlijn nr. 2002/22/
      EG](onbekend) nadere regels gesteld die van toepassing zijn in het geval een opdracht tot verzorging van een of
      meer tot de universele dienst behorende diensten of voorzieningen is gegeven. Hierbij kunnen ter uitvoering van het
      in de eerste volzin genoemde hoofdstuk taken worden opgedragen en bevoegdheden worden verleend aan het college.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel9.2
  - number: 9.2.3
    text: |-
      Onze Minister maakt het voornemen over te gaan tot een opdracht bekend aan de aanbieder van het openbare
      elektronische communicatienetwerk waarop in het verzorgingsgebied de meeste eindgebruikers zijn aangesloten die
      reeds gebruik maken van de openbare elektronische communicatiedienst die wordt opgedragen of, indien er sprake
      is van een op te dragen voorziening, de aanbieder van het openbare elektronische communicatienetwerk waarop in
      het verzorgingsgebied de meeste eindgebruikers zijn aangesloten die gebruik maken van de openbare elektronische
      communicatiedienst waarmee de op te dragen voorziening samenhangt. In het voornemen worden de te verzorgen openbare
      elektronische communicatiedienst of voorziening, het verzorgingsgebied en de periode waarvoor de opdracht zal
      worden gegeven neergelegd.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel9.2
  - number: 9.2.4
    text: |-
      Van het voornemen wordt mededeling gedaan door plaatsing in de Staatscourant. Daarbij wordt gewezen op de in het
      zesde lid geregelde mogelijkheid een aanvraag in te dienen om een opdracht.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel9.2
  - number: 9.2.5
    text: |-
      Binnen acht weken na de datum van de in het derde lid, eerste volzin, bedoelde bekendmaking wordt door de in
      het derde lid bedoelde aanbieder aan Onze Minister meegedeeld of hij verwacht in aanmerking te komen voor een
      vergoeding op grond van [artikel 9.3][ref1] indien aan hem een opdracht zou worden gegeven. Verwacht de in de
      vorige zin bedoelde aanbieder in aanmerking te komen voor een vergoeding dan deelt hij Onze Minister tevens mee wat
      per kalenderjaar naar zijn verwachting de hoogte van de in [artikel 9.3, tweede lid][ref2], bedoelde nettokosten
      zullen zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel9
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel9.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '9'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.2.6
    text: |-
      Binnen acht weken na de datum van de in het vierde lid bedoelde bekendmaking kan bij Onze Minister door anderen dan
      de in het derde lid bedoelde aanbieder, een aanvraag worden ingediend om een opdracht.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel9.2
  - number: 9.2.7
    text: |-
      De aanvraag bevat in ieder geval een verklaring van de aanvrager of hij verwacht in aanmerking te komen voor een
      vergoeding op grond van [artikel 9.3][ref1], indien aan hem een opdracht zou worden gegeven. Verwacht de aanvrager
      in aanmerking te komen voor een vergoeding dan deelt hij Onze Minister tevens mee wat per kalenderjaar naar zijn
      verwachting de hoogte van de in [artikel 9.3, tweede lid][ref2], bedoelde nettokosten zullen zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel9
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel9.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '9'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.2.8
    text: |-
      Een opdracht wordt geweigerd indien de aanvrager naar verwachting de opdracht niet naar behoren zal kunnen
      verzorgen.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel9.2
  - number: 9.2.9
    text: |-
      De opdracht wordt, na een onderlinge vergelijking van de hoogte van de door aanvragers aan wie de opdracht op grond
      van het achtste lid niet is geweigerd, verwachte totale nettokosten en door de in het derde lid bedoelde aanbieders
      verwachte totale nettokosten, opgedragen aan degene die de laagste totale nettokosten verwacht.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel9.2
  - number: 9.2.10
    text: |-
      Indien op grond van de in het negende lid bedoelde vergelijking meerdere opdrachten kunnen worden gegeven wordt
      door middel van het lot beslist aan wie de opdracht wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel9.2
  - number: 9.3.1
    text: |-
      Degene die op grond van een opdracht als bedoeld in [artikel 9.2, eerste lid][ref1], openbare elektronische
      communicatiediensten of voorzieningen verzorgt kan binnen een half jaar na afloop van een kalenderjaar waarin hij
      die diensten of voorzieningen heeft verzorgd bij het college een aanvraag indienen om vergoeding van de in het
      afgelopen kalenderjaar bij de verzorging gemaakte nettokosten.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel9
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel9.3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.3.2
    text: |-
      De nettokosten zijn de kosten die een aanbieder als gevolg van een opdracht voor een bepaalde dienst of voorziening
      maakt en waartegenover als gevolg van de bij of krachtens [artikel 9.1][ref1] gestelde regels omtrent de
      betaalbaarheid geen vergoeding door eindgebruikers staat, verminderd met andere op geld waardeerbare voordelen
      die verband houden met de opdracht, waaronder begrepen immateriële voordelen. Bij ministeriële regeling kunnen ter
      uitvoering van bijlage IV, deel A, van [richtlijn nr. 2002/22/EG](onbekend) nadere regels worden gesteld omtrent de
      berekening van de nettokosten.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel9
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel9.3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.3.3
    text: |-
      Een vergoeding wordt slechts toegekend voorzover naar het oordeel van het college het bestaan en de hoogte van de
      nettokosten op grond van de verstrekte gegevens voldoende is aangetoond. De vergoeding is niet hoger dan de door
      de aanvrager op grond van [artikel 9.2, vijfde of zevende lid][ref1], voor het kalenderjaar waarop de aanvraag
      betrekking heeft verwachte nettokosten.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel9
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel9.3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.3.4
    text: |-
      Indien een vergoeding wordt toegekend wordt dit onder vermelding van het te vergoeden bedrag bekend gemaakt in
      de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel9.3
  - number: 9.3.5
    text: |-
      Een vergoeding wordt uitbetaald binnen een week nadat de in [artikel 9.4, vijfde lid][ref1], bedoelde termijn is
      verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel9
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel9.3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.4.1
    text: |-
      Indien ingevolge [artikel 9.3][ref1] aan degene die op grond van een opdracht een openbare elektronische
      communicatiedienst of voorziening verzorgt, een vergoeding wordt toegekend, is eenieder die een openbare
      elektronische communicatiedienst aanbiedt die behoort tot een voor de desbetreffende opgedragen dienst of
      voorziening bij algemene maatregel van bestuur bepaalde categorie van openbare elektronische communicatiediensten,
      en die in het kalenderjaar waarop de te betalen vergoeding betrekking heeft, voor die dienst in Nederland een
      hogere omzet heeft dan een bij ministeriële regeling te bepalen bedrag, aan het college een bijdrage verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel9
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel9.4
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.4.2
    text: |-
      De verschuldigde bijdrage wordt door het college binnen een half jaar na toekenning van de vergoeding vastgesteld
      en aan degene die de bijdrage is verschuldigd, meegedeeld.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel9.4
  - number: 9.4.3
    text: |-
      De bijdrage wordt berekend door de te betalen vergoeding te vermenigvuldigen met de in het vierde lid bedoelde
      breuk.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel9.4
  - number: 9.4.4
    text: |-
      De teller van de breuk bestaat uit de jaaromzet in Nederland van de bijdrageverschuldigde aanbieder in de
      in het eerste lid bedoelde openbare elektronische communicatiediensten in het jaar waarop de te betalen
      vergoeding betrekking heeft. De noemer van de breuk bestaat uit de som van de jaaromzetten in Nederland van
      de bijdrageverschuldigde aanbieders in de desbetreffende diensten in het jaar waarop de te betalen vergoeding
      betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel9.4
  - number: 9.4.5
    text: De bijdrage wordt betaald binnen vier weken na ontvangst van de beschikking waarin de bijdrage is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel9.4
  - number: 9.4.6
    text: |-
      Op verzoek van degene die op grond van [artikel 9.3][ref1] een vergoeding krijgt toegekend, wordt een door hem te
      betalen bijdrage verrekend met de door hem te ontvangen vergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel9
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel9.4
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '9'
        hoofdstuk: '9'
  - number: 10.1.1
    text: |-
      Het is verboden uitrusting die niet voldoet aan de krachtens [artikel 10.3, onderdeel a, b, c en e][ref1] gestelde
      voorschriften, in de handel te brengen of te verhandelen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel10
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel10.1
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: '10.1'
  - number: 10.1.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over uitzonderingen op het in
      het eerste lid bedoelde verbod.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel10.1
  - number: 10.2.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over speciale maatregelen betreffende
      de ingebruikneming of het gebruik van uitrusting die voldoet aan de bij of krachtens dit hoofdstuk gestelde
      voorschriften. Deze regels betreffen:
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel10.2
  - number: 10.2.1.a
    text: |-
      maatregelen om een bestaand of te verwachten probleem in verband met de eisen waar uitrusting aan moet voldoen op
      een bepaalde locatie te verhelpen;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel10.2
  - number: 10.2.1.b
    text: |-
      maatregelen die om veiligheidsredenen genomen worden om openbare elektronische communicatienetwerken of apparaten
      die naar hun aard bestemd zijn voor het zenden of ontvangen van radiocommunicatiesignalen te beschermen, indien
      deze worden gebruikt voor veiligheidsdoeleinden in duidelijk gedefinieerde spectrumsituaties.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel10.2
  - number: 10.2.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de middelen die Onze Minister kan
      gebruiken om het in de handel brengen of verhandelen van radiozendapparaten of categorieën van radiozendapparaten
      te beëindigen of te beperken, indien de vrees is gewettigd dat door de betrokken radiozendapparaten ontoelaatbare
      belemmeringen worden veroorzaakt in het etherverkeer, in andere radiozendapparaten of in ontvangapparaten.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel10.2
  - number: '10.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ter implementatie van conformiteitsrichtlijnen en bijlage II
      van de Overeenkomst betreffende de Europese Economische Ruimte regels worden gesteld, inzake:
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel10.3
  - number: 10.3.a
    text: eisen waar uitrusting aan moet voldoen;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel10.3
  - number: 10.3.b
    text: de conformiteitsbeoordeling van uitrusting;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel10.3
  - number: 10.3.c
    text: het aanbrengen van markeringen;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel10.3
  - number: 10.3.d
    text: |-
      de aanwijzing, accreditatie en bevoegdheden van instanties die betrokken kunnen worden bij de
      conformiteitsbeoordeling, alsmede de intrekking van de aanwijzing;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel10.3
  - number: 10.3.e
    text: informatieverplichtingen met betrekking tot uitrusting;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel10.3
  - number: 10.3.f
    text: |-
      de aansluiting van uitrusting op openbare elektronische communicatienetwerken, alsmede het afsluiten of buiten
      gebruikstellen van die uitrusting;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel10.3
  - number: 10.3.g
    text: |-
      de door een aanbieder van een openbaar elektronisch communicatienetwerk te verstrekken informatie over de
      technische specificaties van netwerkaansluitpunten.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel10.3
  - number: '10.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels gesteld worden ter uitvoering van tussen de Europese
      Gemeenschap en derde landen gesloten overeenkomsten inzake wederzijdse erkenning van conformiteitsbeoordelingen
      van uitrusting, ondermeer over de aanwijzing van instanties die betrokken kunnen worden bij de
      conformiteitsbeoordeling, alsmede de intrekking van de aanwijzing.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel10.4
  - number: 10.5.1
    text: |-
      Bij ministeriële regeling worden ter uitvoering van een bindend besluit van de Raad van de Europese Unie,
      van het Europees Parlement en de Raad gezamenlijk of van de Commissie van de Europese Gemeenschappen regels
      gesteld ter zake van apparaten bestemd voor de ontvangst en weergave van televisieprogramma’s als bedoeld in
      [artikel 1, onderdeel h, van de Mediawet][ref1], en van apparaten bestemd voor het ontsleutelen van versleutelde
      digitale televisiesignalen.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel1
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel10.5
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '1'
  - number: 10.5.2
    text: |-
      Het is verboden apparaten als bedoeld in het eerste lid te verkopen, te verhuren of anderszins ter beschikking te
      stellen indien niet wordt voldaan aan de krachtens het eerste lid gestelde regels.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel10.5
  - number: '10.6'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld inzake het maken van reclame
      voor uitrusting waarvan het in de handel brengen of het verhandelen op grond van [artikel 10.1][ref1] of
      [artikel 10.5][ref2] is verboden.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel10
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel10.6
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: '10.1'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: '10.1'
  - number: '10.7'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld inzake de behandeling van klachten
      over elektromagnetische storingen, ondervonden van het gebruik van uitrusting, of over belemmeringen, welke bij het
      gebruik van radiozendapparaten of randapparaten worden ondervonden.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel10.7
  - number: '10.8'
    text: |-
      Voor de toepassing van de [artikelen 10.9 tot en met 10.11][ref1] worden met radiozendapparaten gelijk gesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel10
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel10.8
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: '10.2'
  - number: 10.8.a
    text: |-
      elke samenvoeging van onderdelen geschikt om een radiozendapparaat dan wel een ingevolge het bepaalde onder b
      daarmee gelijkgesteld apparaat te vormen;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel10.8
  - number: 10.8.b
    text: |-
      de bij of krachtens algemene maatregel van bestuur te omschrijven elektrische of elektronische apparaten die
      geschikt zijn om door gebruik tezamen met een radiozendapparaat een radiozendapparaat te vormen met andere
      technische eigenschappen.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel10.8
  - number: 10.9.1
    text: |-
      Het aanleggen, het geheel of gedeeltelijk aangelegd aanwezig hebben, of het gebruik van radiozendapparaten
      is slechts toegestaan indien voor het gebruik ervan aan de houder van die radiozendapparaten op grond van
      [hoofdstuk 3][ref1] een vergunning voor het gebruik van frequentieruimte is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel10.9
    references:
      - id: ref1
        bwb_id: BWBR0009950
        hoofdstuk: '3'
  - number: 10.9.2
    text: |-
      In afwijking van het eerste lid, is het aanleggen, het geheel of gedeeltelijk aanwezig hebben, of het gebruik
      van radiozendapparaten zonder dat aan de houder een vergunning is verleend voor het gebruik van frequentieruimte,
      toegestaan, indien:
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel10.9
  - number: 10.9.2.a
    text: |-
      krachtens [hoofdstuk 3][ref1] geen vergunning is vereist voor het gebruik van frequentieruimte en, indien voor het
      gebruik melding en registratie verplicht zijn krachtens [artikel 3.4, tweede lid, onder d][ref2], indien melding en
      registratie heeft plaatsgevonden;


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel10.9
    references:
      - id: ref1
        bwb_id: BWBR0009950
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 10.9.2.b
    text: |-
      de houder van het radiozendappararaat met de houder van een vergunning voor het gebruik van frequentieruimte een
      overeenkomst heeft gesloten voor de aanleg en het instandhouden van een radiozendapparaat ten behoeve van het
      verzorgen van diensten van de opdrachtgever waarbij gebruik wordt gemaakt van de aan de opdrachtgever toegewezen
      frequentieruimte;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel10.9
  - number: 10.9.2.c
    text: |-
      deze apparaten worden gebruikt aan boord van andere dan Nederlandse schepen of luchtvaartuigen en daarvoor een
      vergunning is afgegeven in overeenstemming met het Internationaal Telecommunicatieverdrag, of
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel10.9
  - number: 10.9.2.d
    text: |-
      deze apparaten worden gebruikt door niet-ingezetenen van Nederland die tijdelijk hier te lande verblijven en
      daartoe voor Nederland bindende afspraken zijn gemaakt.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel10.9
  - number: 10.10.1
    text: |-
      Onze Minister kan, in afwijking van [artikel 10.9, eerste lid][ref1], een vergunning verlenen voor het aanleggen
      van radiozendapparaten zonder dat aan de houder een vergunning is verleend voor gebruik van frequentieruimte. Een
      vergunning kan onder beperkingen worden verleend. Aan een vergunning kunnen voorschriften worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel10
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel10.10
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: '10.2'
  - number: 10.10.2
    text: 'De vergunning kan worden geweigerd, indien:'
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel10.10
  - number: 10.10.2.a
    text: het ernstige vermoeden bestaat dat de vergunning zal worden misbruikt;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel10.10
  - number: 10.10.2.b
    text: |-
      een eerder verleende vergunning is ingetrokken wegens overtreding van de bij of krachtens deze wet gestelde regels
      dan wel van de aan de vergunning verbonden voorschriften;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel10.10
  - number: 10.10.2.c
    text: de aanvraag niet voldoet aan de bij of krachtens deze wet gestelde regels, of
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel10.10
  - number: 10.10.2.d
    text: de aanvrager naar het oordeel van Onze Minister geen gerechtvaardigd belang heeft bij verlening van de vergunning.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel10.10
  - number: 10.10.3
    text: 'De vergunning kan worden ingetrokken, indien:'
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel10.10
  - number: 10.10.3.a
    text: |-
      de houder van de vergunning de bij of krachtens deze wet gestelde regels dan wel de aan de vergunning verbonden
      voorschriften of beperkingen niet nakomt, of
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel10.10
  - number: 10.10.3.b
    text: de gronden waarop de vergunning is verleend zijn vervallen.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel10.10
  - number: 10.11.1
    text: 'Het is verboden:'
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel10.11
  - number: 10.11.1.a
    text: |-
      een radiozendapparaat te gebruiken om aan boord van een schip of luchtvaartuig buiten elk nationaal gebied
      programma's uit te zenden;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel10.11
  - number: 10.11.1.b
    text: een radiozendapparaat, bestemd voor een gebruik als onder a bedoeld, te exploiteren;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel10.11
  - number: 10.11.1.c
    text: |-
      een radiozendapparaat ter beschikking te stellen of aan te leggen in de wetenschap, dat het is bestemd voor een
      gebruik als bedoeld onder a;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel10.11
  - number: 10.11.1.d
    text: |-
      een schip of luchtvaartuig ter beschikking te stellen in de wetenschap, dat dit is bestemd om aan boord daarvan
      uitzendingen te doen als onder a bedoeld.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel10.11
  - number: 10.11.2
    text: |-
      Het is verboden aan overtreding van een der in het eerste lid bedoelde verboden opzettelijk mee te werken door
      daarbij behulpzaam te zijn dan wel daartoe gelegenheid, middelen of inlichtingen te verschaffen. Als handelingen
      van medewerking worden in elk geval beschouwd:
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel10.11
  - number: 10.11.2.a
    text: |-
      het ter beschikking stellen van materiaal ten behoeve van het schip of luchtvaartuig dan wel van het
      radiozendapparaat;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel10.11
  - number: 10.11.2.b
    text: het onderhouden of herstellen van het schip of luchtvaartuig dan wel van het radiozendapparaat;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel10.11
  - number: 10.11.2.c
    text: het bevoorraden van het schip of luchtvaartuig;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel10.11
  - number: 10.11.2.d
    text: |-
      het vervoeren van personen of goederen naar of van het schip of luchtvaartuig dan wel het ter beschikking stellen
      van middelen tot dat vervoer;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel10.11
  - number: 10.11.2.e
    text: het vervaardigen van programma's of onderdelen daarvan, bestemd om te worden uitgezonden;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel10.11
  - number: 10.11.2.f
    text: |-
      het geven van opdrachten tot het uitzenden van programma's of onderdelen daarvan dan wel het verlenen van
      bemiddeling bij het verkrijgen van zodanige opdrachten.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel10.11
  - number: 10.11.3
    text: |-
      Het tweede lid blijft buiten toepassing, indien de aldaar bedoelde handelingen worden verricht teneinde in geval
      van nood het schip of luchtvaartuig bij te staan of mensenlevens te beschermen.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel10.11
  - number: 10.11.4
    text: |-
      Onder schip of luchtvaartuig wordt in dit artikel mede begrepen elk ander drijvend of door de lucht gedragen
      voorwerp.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel10.11
  - number: '11.1'
    text: 'In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.1
  - number: 11.1.a
    text: |-
      gebruiker: een natuurlijke persoon die gebruik maakt van een openbare elektronische communicatiedienst voor
      particuliere of zakelijke doeleinden zonder noodzakelijkerwijze op die dienst te zijn geabonneerd;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.1
  - number: 11.1.b
    text: |-
      verkeersgegevens: gegevens die worden verwerkt voor het overbrengen van communicatie over een elektronisch
      communicatienetwerk of voor de facturering ervan;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.1
  - number: 11.1.c
    text: |-
      verwerking van verkeersgegevens: verwerking als bedoeld in
      [artikel 1, onderdeel b, van de Wet bescherming persoonsgegevens][ref1], met dien verstande dat de desbetreffende
      handelingen mede betrekking hebben op verkeersgegevens van abonnees die geen natuurlijke personen zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel1
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.1
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '1'
  - number: 11.1.d
    text: |-
      locatiegegevens: gegevens die worden verwerkt in een elektronisch communicatienetwerk waarmee de geografische
      positie van de randapparatuur van een gebruiker van een openbare elektronische communicatiedienst wordt aangegeven;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.1
  - number: 11.1.e
    text: |-
      communicatie: informatie die wordt uitgewisseld of overgebracht tussen een eindig aantal partijen door middel
      van een openbare elektronische communicatiedienst; dit omvat niet de informatie die via een omroepdienst over een
      elektronisch communicatienetwerk wordt overgebracht, behalve wanneer de informatie kan worden gerelateerd aan de
      identificeerbare abonnee of gebruiker die de informatie ontvangt;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.1
  - number: 11.1.f
    text: |-
      oproep: een door middel van een openbare telefoondienst tot stand gebrachte verbinding die zonder noemenswaardige
      vertraging communicatie tussen gebruikers of abonnees over en weer mogelijk maakt;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.1
  - number: 11.1.g
    text: |-
      toestemming van een gebruiker of abonnee: toestemming van een betrokkene als bedoeld in
      [artikel 1, onder i, van de Wet bescherming persoonsgegevens][ref1], met dien verstande dat de toestemming mede
      betrekking kan hebben op gegevens van abonnees die geen natuurlijke personen zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel1
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.1
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '1'
  - number: 11.1.h
    text: |-
      dienst met toegevoegde waarde: dienst die de verwerking vereist van verkeersgegevens of locatiegegevens, niet
      zijnde verkeersgegevens, en die verder gaat dan hetgeen noodzakelijk is voor de overbrenging van een communicatie
      of de facturering daarvan;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.1
  - number: 11.1.i
    text: |-
      elektronisch bericht: tekst-, spraak-, geluids- of beeldbericht dat over een openbaar elektronisch
      communicatienetwerk wordt verzonden en in het netwerk of in de randapparatuur van de ontvanger kan worden
      opgeslagen tot het door de ontvanger wordt opgehaald.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.1
  - number: '11.2'
    text: |-
      Onverminderd de [Wet bescherming persoonsgegevens][ref1] en het overigens bij of krachtens deze wet bepaalde dragen
      de aanbieder van een openbaar elektronisch communicatienetwerk en de aanbieder van een openbare elektronische
      communicatiedienst zorg voor de bescherming van persoonsgegevens en de bescherming van de persoonlijke levenssfeer
      van abonnees en gebruikers van zijn netwerk, onderscheidenlijk zijn dienst.


      [ref1]: https://wetten.overheid.nl/BWBR0011468
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.2
    references:
      - id: ref1
        bwb_id: BWBR0011468
  - number: 11.3.1
    text: |-
      De in [artikel 11.2][ref1] bedoelde aanbieders treffen in het belang van de bescherming van persoonsgegevens en
      de bescherming van de persoonlijke levenssfeer van abonnees en gebruikers passende technische en organisatorische
      maatregelen ten behoeve van de veiligheid en beveiliging van de door hen aangeboden netwerken en diensten. De
      maatregelen garanderen, rekening houdend met de stand van de techniek en de kosten van de tenuitvoerlegging, een
      passend beveiligingsniveau dat in verhouding staat tot het desbetreffende risico.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel11
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.1'
  - number: 11.3.2
    text: |-
      De in [artikel 11.2][ref1] bedoelde aanbieders dragen er zorg voor dat de abonnees worden geïnformeerd over:


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel11
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.1'
  - number: 11.3.2.a
    text: |-
      bijzondere risico's voor de doorbreking van de veiligheid of de beveiliging van het aangeboden netwerk of de
      aangeboden dienst;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.3
  - number: 11.3.2.b
    text: |-
      de eventuele middelen waarmee de onder a bedoelde risico's kunnen worden tegengegaan, voor zover het andere
      maatregelen betreft dan die welke de aanbieder op grond van het eerste lid gehouden is te treffen, alsmede een
      indicatie van de verwachte kosten.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.3
  - number: 11.4.1
    text: 'De aanbieder van een openbare elektronische communicatiedienst is verplicht de abonnee op diens verzoek:'
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.4
  - number: 11.4.1.a
    text: |-
      geleverde elektronische communicatiediensten door middel van geheel of gedeeltelijk niet-gespecificeerde nota's in
      rekening te brengen;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.4
  - number: 11.4.1.b
    text: |-
      de mogelijkheid te bieden kosteloos en op eenvoudige wijze de doorschakeling van oproepen van derden naar het bij
      hem in gebruik zijnde netwerkaansluitpunt ongedaan te maken.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.4
  - number: 11.4.2
    text: |-
      Bij algemene maatregel van bestuur kunnen in het belang van de bescherming van persoonsgegevens en de bescherming
      van de persoonlijke levenssfeer van oproepende gebruikers en opgeroepen abonnees regels worden gesteld met
      betrekking tot het specificeren van nota's voor geleverde elektronische communicatiediensten. Deze regels
      kunnen onder meer betrekking hebben op de toekenning van rechten aan abonnees, de behandeling van klachten, de
      verstrekking van informatie en de vergoeding van kosten. Bij de algemene maatregel van bestuur kunnen aan het
      college taken worden opgedragen en bevoegdheden verleend.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.4
  - number: 11.4.3
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van de keuzemogelijkheden voor de wijze
      van betaling van geleverde elektronische communicatiediensten.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.4
  - number: 11.5.1
    text: |-
      De aanbieder van een openbaar elektronisch communicatienetwerk en de aanbieder van een openbare elektronische
      communicatiedienst verwijderen dan wel anonimiseren de door hen verwerkte en opgeslagen verkeersgegevens met
      betrekking tot abonnees of gebruikers, zodra deze verkeersgegevens niet langer nodig zijn ten behoeve van de
      overbrenging van communicatie, onverminderd het tweede, derde en vijfde lid.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.5
  - number: 11.5.2
    text: |-
      De aanbieder mag verkeersgegevens verwerken die noodzakelijk zijn voor facturering, waaronder het opstellen van
      een factuur voor een abonnee of voor degene die zich tegenover de aanbieder rechtens verbonden heeft die factuur te
      voldoen, dan wel ten behoeve van een betaling van verleende toegang. De verkeersgegevens mogen worden verwerkt tot
      het einde van de wettelijke termijn waarbinnen de factuur in rechte kan worden betwist of de betaling in rechte kan
      worden afgedwongen.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.5
  - number: 11.5.3
    text: |-
      De aanbieder van elektronische communicatiediensten mag voorts de in het eerste lid bedoelde verkeersgegevens
      verwerken, voor zover en voor zolang dat noodzakelijk is voor:
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.5
  - number: 11.5.3.a
    text: marktonderzoek of verkoopactiviteiten met betrekking tot elektronische communicatiediensten, of
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.5
  - number: 11.5.3.b
    text: de levering van diensten met toegevoegde waarde,
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.5
  - number: 11.5.4
    text: |-
      De aanbieder stelt de abonnee of gebruiker in kennis van de soorten verkeersgegevens die worden verwerkt voor de in
      het tweede en derde lid bedoelde doeleinden alsmede omtrent de duur van de verwerking. Voor zover het de verwerking
      van verkeersgegevens ten behoeve van de doeleinden, bedoeld in het derde lid betreft, wordt de desbetreffende
      informatie verstrekt voorafgaand aan het verkrijgen van de in dat lid bedoelde toestemming van de abonnee of
      gebruiker.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.5
  - number: 11.5.5
    text: |-
      De verwerking van verkeersgegevens in overeenstemming met het eerste tot en met vierde lid mag alleen geschieden
      door personen die werkzaam zijn onder het gezag van de aanbieder voor facturering, verkeersbeheer, behandeling
      van verzoeken om inlichtingen van klanten, opsporing van fraude alsmede marktonderzoek of verkoopactiviteiten
      met betrekking tot elektronische communicatiediensten of de levering van diensten met toegevoegde waarde en moet
      beperkt blijven tot hetgeen noodzakelijk is om die activiteiten te kunnen uitvoeren.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.5
  - number: 11.5.6
    text: |-
      De aanbieder mag de verkeersgegevens verstrekken aan personen en instanties die zijn belast met de berechting van
      enig geschil dan wel de beslissing van een geschil als bedoeld in de [artikelen 12.1][ref1], [12.2][ref2] voor
      zover van toepassing, of [12.9][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel12
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.5
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '12'
        hoofdstuk: '12'
        paragraaf: '12.1'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '12'
        hoofdstuk: '12'
        paragraaf: '12.2'
      - id: ref3
        bwb_id: BWBR0009950
        artikel: '12'
        hoofdstuk: '12'
        paragraaf: '12.2'
  - number: 11.5a.1
    text: |-
      De verwerking van locatiegegevens, niet zijnde verkeersgegevens, betreffende abonnees of gebruikers van openbare
      elektronische communicatienetwerken of openbare elektronische communicatiediensten, is slechts geoorloofd, indien:
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.5a
  - number: 11.5a.1.a
    text: deze gegevens zijn geanonimiseerd, of
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.5a
  - number: 11.5a.1.b
    text: |-
      de desbetreffende abonnee of gebruiker voor de verwerking van deze gegevens toestemming heeft gegeven ten behoeve
      van de levering van een dienst met toegevoegde waarde.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.5a
  - number: 11.5a.2
    text: |-
      Voorafgaand aan het verkrijgen van toestemming als bedoeld in het eerste lid, onderdeel b, verstrekt de aanbieder
      van de toegevoegde waardedienst aan de abonnee of gebruiker de volgende informatie:
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.5a
  - number: 11.5a.2.a
    text: de soort locatiegegevens die zullen worden verwerkt;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.5a
  - number: 11.5a.2.b
    text: de doeleinden waarvoor de locatiegegevens worden verwerkt;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.5a
  - number: 11.5a.2.c
    text: de duur van de verwerking, en
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.5a
  - number: 11.5a.2.d
    text: |-
      of de gegevens aan een derde zullen worden verstrekt ten behoeve van de levering van de dienst met toegevoegde
      waarde.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.5a
  - number: 11.5a.3
    text: |-
      De verwerking van de gegevens ten behoeve van de levering van een dienst met toegevoegde waarde als bedoeld
      in het eerste lid, onderdeel b, is slechts toegestaan voor zover en voor zolang dat noodzakelijk is voor
      de levering van de desbetreffende dienst. In afwijking van de eerste volzin mag de aanbieder van de dienst
      met toegevoegde waarde die gegevens verwerken die noodzakelijk zijn voor het opstellen van een factuur.
      [Artikel 11.5, tweede lid, laatste volzin][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel11
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.5a
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.1'
  - number: 11.5a.4
    text: |-
      Een abonnee of gebruiker kan de verleende toestemming voor de verwerking van de hem betreffende gegevens op elk
      moment intrekken.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.5a
  - number: 11.5a.5
    text: |-
      De aanbieder van een dienst met toegevoegde waarde biedt aan de abonnee of gebruiker wiens gegevens worden verwerkt
      de mogelijkheid om kosteloos en op eenvoudige wijze de verwerking van diens gegevens tijdelijk te beletten voor
      elke overbrenging van communicatie of elke verbinding met het openbare elektronische communicatienetwerk dat
      gebruikt wordt voor de levering van de desbetreffende dienst.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.5a
  - number: 11.5a.6
    text: |-
      De verwerking van de gegevens mag slechts plaatsvinden door personen die werkzaam zijn onder het gezag van de
      aanbieder of de derde, bedoeld in het tweede lid, onder d, en is beperkt tot die gegevens die noodzakelijk zijn om
      de dienst met toegevoegde waarde te kunnen aanbieden.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.5a
  - number: 11.5b.1
    text: |-
      Certificatiedienstverleners die certificaten aan het publiek afgeven, verwerken alleen persoonsgegevens die van
      de betrokkene zelf of met diens uitdrukkelijke toestemming zijn verkregen, en voor zover de verwerking van deze
      persoonsgegevens voor de afgifte en het beheer van het certificaat is vereist.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.5b
  - number: 11.5b.2
    text: |-
      De in het eerste lid bedoelde persoonsgegevens worden niet voor andere doeleinden verzameld of verwerkt, tenzij de
      betrokkene daarvoor zijn uitdrukkelijke toestemming heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.5b
  - number: 11.5b.3
    text: |-
      In afwijking van het tweede lid is de uitdrukkelijke toestemming van de betrokkene niet vereist, indien de
      verwerking van de in het eerste lid bedoelde persoonsgegevens noodzakelijk is ten behoeve van de opsporing van
      fraude, of indien de verwerking overigens bij of krachtens de wet wordt gevorderd.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.5b
  - number: 11.6.1
    text: |-
      Eenieder die een algemeen beschikbare abonneelijst uitgeeft of een algemeen beschikbare abonnee-informatiedienst
      verzorgt, stelt de abonnee voorafgaand aan opneming van hem betreffende persoonsgegevens in de abonneelijst of in
      het voor de abonnee-informatiedienst gebruikte abonneebestand kosteloos op de hoogte van:
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.6
  - number: 11.6.1.a
    text: |-
      de doeleinden van de desbetreffende abonneelijst en de desbetreffende abonnee-informatiedienst en, voor zover het
      een elektronische versie van de abonneelijst betreft, van de gebruiksmogelijkheden op basis van daarin opgenomen
      zoekfuncties, en
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.6
  - number: 11.6.1.b
    text: |-
      de soorten persoonsgegevens die, gelet op de vastgestelde doeleinden van de desbetreffende abonneelijst en
      desbetreffende abonnee-informatiedienst, daarin kunnen worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.6
  - number: 11.6.2
    text: |-
      In een algemeen beschikbare abonneelijst en in het voor een abonnee-informatiedienst gebruikte abonneebestand
      worden uitsluitend persoonsgegevens van een abonnee opgenomen, indien de abonnee daarvoor toestemming heeft
      verleend en blijft deze beperkt tot de door hem daarbij aangegeven persoonsgegevens. Aan het niet opgenomen zijn
      in een abonneelijst of het voor een abonnee-informatiedienst gebruikte abonneebestand mogen geen kosten worden
      verbonden.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.6
  - number: 11.6.3
    text: |-
      Voor zover de verwerking van persoonsgegevens in een algemeen beschikbare abonneelijst en in het voor een abonnee-
      informatiedienst gebruikte abonneebestand betrekking heeft op andere doeleinden dan het bieden van de mogelijkheid
      tot het zoeken van nummers aan de hand van gegevens betreffende de naam in combinatie met gegevens betreffende het
      adres en huisnummer, postcode en woonplaats van de abonnee, is met betrekking tot elk van die andere doeleinden
      afzonderlijke toestemming van de abonnee vereist.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.6
  - number: 11.6.4
    text: |-
      De abonnee heeft het recht om kosteloos hem betreffende persoonsgegevens in een algemeen beschikbare abonneelijst
      of in het voor een abonnee-informatiedienst gebruikte abonneebestand te verifiëren, te laten verbeteren of te laten
      verwijderen.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.6
  - number: 11.7.1
    text: |-
      Het gebruik van automatische oproepsystemen zonder menselijke tussenkomst, faxen en elektronische berichten voor
      het overbrengen van ongevraagde communicatie voor commerciële, ideële of charitatieve doeleinden aan abonnees
      is uitsluitend toegestaan, mits de verzender kan aantonen dat de desbetreffende abonnee daarvoor voorafgaand
      toestemming heeft verleend, onverminderd hetgeen is bepaald in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.7
  - number: 11.7.2
    text: |-
      Een ieder die elektronische contactgegevens voor elektronische berichten heeft verkregen in het kader van
      de verkoop van zijn product of dienst mag deze gegevens gebruiken voor het overbrengen van communicatie voor
      commerciële, ideële of charitatieve doeleinden met betrekking tot eigen gelijksoortige producten of diensten, mits
      bij de verkrijging van de contactgegevens aan de klant duidelijk en uitdrukkelijk de gelegenheid is geboden om
      kosteloos en op gemakkelijke wijze verzet aan te tekenen tegen het gebruik van die elektronische contactgegevens,
      en, indien de klant hiervan geen gebruik heeft gemaakt, hem bij elke overgebrachte communicatie de mogelijkheid
      wordt geboden om onder dezelfde voorwaarden verzet aan te tekenen tegen het verder gebruik van zijn elektronische
      contactgegevens. [Artikel 41, tweede lid, van de Wet bescherming persoonsgegevens][ref1] is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel41
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.7
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '41'
  - number: 11.7.3
    text: |-
      Bij het gebruik van elektronische berichten voor de in het eerste lid genoemde doeleinden dienen te allen tijde de
      volgende gegevens te worden vermeld:
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.7
  - number: 11.7.3.a
    text: de werkelijke identiteit van degene namens wie de communicatie wordt overgebracht, en
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.7
  - number: 11.7.3.b
    text: |-
      een geldig postadres of nummer waaraan de ontvanger een verzoek tot beëindiging van dergelijke communicatie kan
      richten.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.7
  - number: 11.7.4
    text: |-
      Het gebruik van andere dan de in het eerste lid bedoelde middelen voor het overbrengen van ongevraagde communicatie
      voor commerciële, ideële of charitatieve doeleinden aan abonnees is toegestaan, tenzij de desbetreffende abonnee
      te kennen heeft gegeven dat hij communicatie waarbij van deze middelen gebruik wordt gemaakt, niet wenst te
      ontvangen en indien de abonnee bij elke overgebrachte communicatie de mogelijkheid wordt geboden om verzet aan te
      tekenen tegen het verder gebruik van zijn elektronische contactgegevens. Aan de abonnee worden in dat geval geen
      kosten in rekening gebracht van voorzieningen waarmee wordt voorkomen dat hem een ongevraagde communicatie wordt
      overgebracht.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.7
  - number: '11.8'
    text: |-
      De toepassing van de [artikelen 11.6][ref1] en [11.7][ref2] is beperkt tot abonnees die natuurlijke personen zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel11
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.8
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.1'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.1'
  - number: 11.9.1
    text: |-
      De aanbieder van een openbaar elektronisch communicatienetwerk en de aanbieder van een openbare elektronische
      communicatiedienst die door middel van dat netwerk of als onderdeel van die dienst nummeridentificatie aanbiedt,
      biedt:
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.9
  - number: 11.9.1.a
    text: |-
      aan iedere oproepende gebruiker onderscheidenlijk abonnee mogelijkheden aan om kosteloos de verstrekking van het
      nummer van het oproepende netwerkaansluitpunt dan wel een nummer waarmee een individuele gebruiker kan worden
      geïdentificeerd te blokkeren onderscheidenlijk de verstrekking van nummers van oproepende netwerkaansluitpunten
      dan wel nummers waarmee individuele gebruikers kunnen worden geïdentificeerd voor elke afzonderlijke abonneelijn
      te blokkeren;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.9
  - number: 11.9.1.b
    text: 'aan iedere opgeroepen abonnee mogelijkheden aan om:'
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.9
  - number: 11.9.1.1°
    text: |-
      de verstrekking van het nummer van het oproepende netwerkaansluitpunt dan wel een nummer waarmee een individuele
      gebruiker kan worden geïdentificeerd te verhinderen;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.9
  - number: 11.9.1.2°
    text: |-
      oproepen waarbij de verstrekking van het nummer van het oproepende netwerkaansluitpunt dan wel een nummer waarmee
      een individuele gebruiker kan worden geïdentificeerd is geblokkeerd, te weigeren;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.9
  - number: 11.9.1.3°
    text: |-
      indien nummeridentificatie als bedoeld in [artikel 1.1, onderdeel cc, onder 2°][ref1], wordt aangeboden, kosteloos
      de verstrekking van het nummer van het opgeroepen netwerkaansluitpunt dan wel een nummer waarmee een individuele
      gebruiker kan worden geïdentificeerd aan het oproepende netwerkaansluitpunt te blokkeren.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel1
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.9
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '1'
        hoofdstuk: '1'
  - number: 11.9.2
    text: 'Bij ministeriële regeling worden nadere regels gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.9
  - number: 11.9.2.a
    text: mogelijkheden tot blokkering en weigering;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.9
  - number: 11.9.2.b
    text: |-
      de voorwaarden waaronder de abonnee de identificatie van het nummer van oproepende netwerkaansluitpunten dan wel
      een nummer waarmee een individuele gebruiker kan worden geïdentificeerd kan doen verhinderen;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.9
  - number: 11.9.2.c
    text: |-
      de wijze waarop uitvoering aan nummeridentificatie in het internationale elektronische communicatieverkeer kan
      worden gegeven, en
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.9
  - number: 11.9.2.d
    text: de wijze waarop de aanbieders, gebruikers en abonnees voorlichten over het gebruik van nummeridentificatie.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.9
  - number: 11.10.1
    text: |-
      De aanbieder van een openbaar elektronisch communicatienetwerk en de aanbieder van een openbare elektronische
      communicatiedienst die nummeridentificatie aanbiedt, is verplicht aan de door Onze Minister van Binnenlandse
      Zaken en Koninkrijksrelaties, in overeenstemming met Onze Minister, aangewezen beheerders van een alarmnummer voor
      publieke diensten, indien er elektronische communicatie met een alarmnummer wordt afgewikkeld, gelijktijdig:
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.10
  - number: 11.10.1.a
    text: |-
      het nummer van het oproepende netwerkaansluitpunt te verstrekken, ook indien bij dat netwerkaansluitpunt gebruik
      wordt gemaakt van een in [artikel 11.9, tweede lid, onder a][ref1], bedoelde blokkeringsmogelijkheid;


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel11
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.10
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.2'
  - number: 11.10.1.b
    text: |-
      de naam, en de beschikbare adres-, postcode- en woonplaatsgegevens van de abonnee, dan wel de locatie van de
      openbare betaaltelefoon, die onder het desbetreffende nummer is aangesloten, te verstrekken.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.10
  - number: 11.10.2
    text: |-
      De aanbieder van een openbaar elektronisch communicatienetwerk en de aanbieder van een openbare elektronische
      communicatiedienst, die locatiegegevens kan verwerken omtrent abonnees of gebruikers, is verplicht aan de
      aangewezen beheerders van een alarmnummer voor publieke diensten, bedoeld in het eerste lid, indien er communicatie
      over een dergelijk alarmnummer wordt afgewikkeld, gelijktijdig de daarop betrekking hebbende locatiegegevens
      te verstrekken, ook indien de abonnee of gebruiker, voor zover het betreft de locatiegegevens als bedoeld in
      [artikel 11.5a][ref1], op de voet van het vijfde lid van dat artikel, gebruik heeft gemaakt van de mogelijkheid om
      tijdelijk de verwerking van de hem betreffende locatiegegevens te beletten.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel11
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.10
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.1'
  - number: 11.10.3
    text: |-
      De verstrekte nummers, alsmede de in het eerste lid, onder b, en de in het tweede lid, bedoelde gegevens worden
      door de beheerders, bedoeld in het eerste lid, vastgelegd met het oog op de hulpverlening in noodsituaties of de
      bestrijding van het misbruik van een alarmnummer voor publieke diensten. De beheerders zijn verantwoordelijke in de
      zin van [artikel 1, onderdeel d, van de Wet bescherming persoonsgegevens][ref1] voor deze vastlegging.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel1
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.10
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '1'
  - number: 11.10.4
    text: |-
      Verstrekking van nummers en gegevens door de beheerder vindt slechts plaats met het oog op de hulpverlening in
      noodsituaties of de bestrijding van het misbruik van een alarmnummer voor publieke diensten. De beheerder is
      verantwoordelijke in de zin van [artikel 1, onderdeel d, van de Wet bescherming persoonsgegevens][ref1] voor deze
      verstrekkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel1
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.10
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '1'
  - number: 11.10.5
    text: |-
      Verstrekking van nummers en gegevens met het oog op de hulpverlening in noodsituaties vindt slechts plaats aan de
      door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, in overeenstemming met Onze Minister, aangewezen
      publieke diensten belast met hulpverleningstaken.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.10
  - number: 11.10.6
    text: |-
      Verstrekking van nummers en gegevens met het oog op de bestrijding van het misbruik van een alarmnummer
      voor publieke diensten vindt slechts plaats aan degene die op grond van [artikel 141][ref1] of
      [142 van het Wetboek van Strafvordering][ref2] is belast met de opsporing van strafbare feiten.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel142
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.10
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '142'
  - number: 11.10.7
    text: 'De termijn gedurende welke de nummers en gegevens door de beheerder worden bewaard bedraagt ten hoogste:'
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.10
  - number: 11.10.7.a
    text: |-
      twee maanden indien de nummers en gegevens betrekking hebben op gevallen waarin kennelijk sprake is van een verzoek
      om hulpverlening in een noodsituatie;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.10
  - number: 11.10.7.b
    text: |-
      zes maanden indien de nummers en gegevens betrekking hebben op gevallen waarin kennelijk sprake is van misbruik van
      een alarmnummer voor publieke diensten;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.10
  - number: 11.10.7.c
    text: 24 uur in alle overige gevallen.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.10
  - number: 11.10.8
    text: |-
      De op grond van het eerste lid aangewezen beheerder vergoedt de kosten die zijn gemoeid met het verstrekken van de
      in het eerste lid, onder a en b, en de in het tweede lid bedoelde gegevens.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.10
  - number: 11.10.9
    text: |-
      De bekendmaking van het besluit tot aanwijzing van de beheerders, bedoeld in het eerste lid, en de publieke
      diensten, bedoeld in het vierde lid, geschiedt door plaatsing in de Staatscourant door Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.10
  - number: 11.10.10
    text: |-
      De beheerders, bedoeld in het eerste lid, zijn bevoegd om ten behoeve van de controle op de effectiviteit van de
      hulpverlening in noodsituaties de bij het alarmnummer voor publieke diensten ingekomen oproepen vast te leggen
      en voor ten hoogste twee maanden te bewaren. Bij de vastlegging worden de datum en het tijdstip van de oproep
      geregistreerd.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.10
  - number: 11.11.1
    text: |-
      Een abonnee die last heeft van hinderlijke of kwaadwillige oproepen, waarbij de verstrekking van het nummer
      van het oproepende netwerkaansluitpunt is geblokkeerd, kan aan de aanbieder van een openbaar elektronisch
      communicatienetwerk of van een openbare elektronische communicatiedienst verzoeken om het nummer van de
      oproepende abonnee en de beschikbare daarop betrekking hebbende naam-, adres-, postcode- en woonplaatsgegevens,
      te verstrekken.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.11
  - number: 11.11.2
    text: 'Een verzoek als bedoeld in het eerste lid voldoet aan de volgende vereisten:'
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.11
  - number: 11.11.2.a
    text: |-
      het verzoek is schriftelijk en bevat de naam-, adres-, postcode- en woonplaatsgegevens van de verzoeker alsmede het
      nummer waarop de oproepen betrekking hebben, en
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.11
  - number: 11.11.2.b
    text: het verzoek bevat een indicatie van de data en tijdstippen waarop de desbetreffende oproepen hebben plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.11
  - number: 11.11.3
    text: |-
      De verzoeker informeert de aanbieder onverwijld omtrent hinderlijke of kwaadwillige oproepen, die plaats hebben
      gevonden na indiening van het verzoek, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.11
  - number: 11.11.4
    text: |-
      De aanbieder stelt naar aanleiding van het verzoek een onderzoek in, teneinde vast te stellen of tot verstrekking
      van de gegevens, bedoeld in het eerste lid, dient te worden overgegaan.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.11
  - number: 11.11.5
    text: |-
      Indien bij het onderzoek blijkt dat het oproepende nummer toebehoort aan een abonnee van een andere aanbieder,
      verleent de desbetreffende aanbieder op een daartoe strekkend verzoek van de met het onderzoek belaste aanbieder
      medewerking aan het onderzoek en verstrekt, indien het onderzoek daartoe aanleiding geeft, de beschikbare op het
      oproepende nummer betrekking hebbende naam-, adres-, postcode- en woonplaatsgegevens aan de aanbieder die met het
      onderzoek belast is.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.11
  - number: 11.11.6
    text: |-
      Van de gegevensverstrekking aan een verzoeker wordt door de aanbieder mededeling gedaan aan de abonnee, wiens
      gegevens het betreft.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.11
  - number: 11.11.7
    text: 'Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.11
  - number: 11.11.7.a
    text: het onderzoek, bedoeld in het vierde lid;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.11
  - number: 11.11.7.b
    text: de gegevensverstrekking, bedoeld in het vierde lid;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.11
  - number: 11.11.7.c
    text: de medewerkingsverplichting, bedoeld in het vijfde lid;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.11
  - number: 11.11.7.d
    text: de kennisgeving van de verstrekking van de gegevens, bedoeld in het zesde lid.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.11
  - number: 11.12.1
    text: |-
      Aan een aanbieder van een openbaar elektronisch communicatienetwerk en een aanbieder van een openbare elektronische
      communicatiedienst kan door het college ontheffing worden verleend van de verplichtingen die voortvloeien uit de
      [artikelen 11.4, eerste lid, onderdeel b][ref1], en [11.9 tot en met 11.11][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel11
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.12
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.1'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.2'
  - number: 11.12.2
    text: 'Een ontheffing als bedoeld in het eerste lid kan uitsluitend worden verleend, indien:'
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.12
  - number: 11.12.2.a
    text: deze betrekking heeft op abonneelijnen verbonden met analoge centrales, en
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.12
  - number: 11.12.2.b
    text: |-
      nakoming van de desbetreffende verplichtingen technisch niet haalbaar is of onevenredig veel financiële lasten voor
      de aanbieder met zich meebrengt.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.12
  - number: 11.12.3
    text: Een ontheffing kan onder beperkingen worden verleend. Aan een ontheffing kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.12
  - number: 11.13.1
    text: |-
      Aanbieders van openbare elektronische communicatienetwerken en openbare elektronische communicatiediensten
      kunnen de [artikelen 11.5][ref1], [11.5a][ref2] en [11.9, eerste lid][ref3], buiten toepassing laten, indien dit
      noodzakelijk is in het belang van:


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel11
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.13
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.1'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.1'
      - id: ref3
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.2'
  - number: 11.13.1.a
    text: de nationale veiligheid;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.13
  - number: 11.13.1.b
    text: de voorkoming, opsporing en vervolging van strafbare feiten.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.13
  - number: 11.13.2
    text: |-
      Aanbieders van openbare elektronische communicatienetwerken en openbare elektronische communicatiediensten
      mogen, in afwijking van [artikel 11.5, eerste lid][ref1], verkeersgegevens verwerken, indien en voor zolang
      dat noodzakelijk is voor een onderzoek als bedoeld in [artikel 11.11, vierde en vijfde lid][ref2]. De
      verkeersgegevens mogen voor een periode van ten hoogste drie maanden na beëindiging van een onderzoek als bedoeld
      in [artikel 11.11, vierde lid][ref3], door de desbetreffende aanbieders worden bewaard. Na afloop van deze periode
      worden de verkeersgegevens verwijderd.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel11
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel11.13
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.1'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.2'
      - id: ref3
        bwb_id: BWBR0009950
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.2'
  - number: '12.1'
    text: |-
      Aanbieders van een openbare telefoondienst, andere bij algemene maatregel van bestuur aan te wijzen openbare
      elektronische communicatiediensten of bij algemene maatregel van bestuur aan te wijzen programmadiensten sluiten
      zich aan bij een van overheidswege erkende geschillencommissie welke geschillen behandelt over een overeenkomst
      met betrekking tot de levering van een openbare elektronische communicatiedienst of een programmadienst tussen een
      hiervoor bedoelde aanbieder en een natuurlijk persoon die voor andere dan bedrijfs- of beroepsdoeleinden handelt.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel12.1
  - number: 12.2.1
    text: |-
      Indien er tussen houders van een vergunning, tussen aanbieders, tussen aanbieders en ondernemingen,
      onderscheidenlijk tussen ondernemingen een geschil is ontstaan inzake de nakoming van een op een houder van
      een vergunning, een aanbieder of een onderneming die openbare elektronische communicatienetwerken, bijbehorende
      faciliteiten, openbare elektronische communicatiediensten of programmadiensten aanbiedt op grond van een bij of
      krachtens deze wet of bij de roamingverordening rustende verplichting, kan het college op aanvraag van een bij dat
      geschil betrokken partij het geschil beslechten, tenzij de beslechting van dat geschil op grond van deze wet aan
      een andere instantie is opgedragen.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel12.2
  - number: 12.2.2
    text: |-
      Onder een geschil als bedoeld in het eerste lid, wordt mede verstaan een geschil inzake de vraag of, indien
      de in dat lid bedoelde houders van een vergunning, aanbieders, aanbieders en ondernemingen, onderscheidenlijk
      ondernemingen een overeenkomst hebben gesloten op basis van een bij of krachtens deze wet op een of meer van
      hen rustende verplichting, de ter zake daarvan tussen hen bestaande verbintenissen, of de wijze waarop die
      verbintenissen worden nagekomen strijdig zijn, onderscheidenlijk strijdig is met het bij of krachtens deze wet
      bepaalde.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel12.2
  - number: 12.2.3
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing indien een geschil is gerezen tussen degenen,
      bedoeld in [artikel 3.11, vierde lid][ref1], dan wel tussen een aanbieder en een derde als bedoeld in
      [artikel 5.12, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel5
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel12.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.4'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 12.2.4
    text: |-
      Met uitzondering van geschillen op grond van [artikel 5.12][ref1] is het eerste lid niet van toepassing op
      geschillen voortvloeiend uit [hoofdstuk 5][ref2] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel12.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
      - id: ref2
        bwb_id: BWBR0009950
        hoofdstuk: '5'
  - number: 12.2.4
    text: |-
      Met uitzondering van geschillen op grond van [artikel 5.12][ref1] is het eerste lid niet van toepassing op
      geschillen voortvloeiend uit [hoofdstuk 5][ref2] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel12.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
      - id: ref2
        bwb_id: BWBR0009950
        hoofdstuk: '5'
  - number: 12.2.5
    text: |-
      Indien nummerhouders als bedoeld in [artikel 4.2b][ref1] geen overeenstemming kunnen bereiken over de voorwaarden
      waaronder de aan hen in gebruik gegeven nummers gezamenlijk in gebruik zullen worden genomen, kan het college op
      aanvraag van een of meer van hen, voorschriften geven inzake het tot stand brengen van een overeenkomst als bedoeld
      in [artikel 4.2b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel4
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel12.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '4'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '4'
        hoofdstuk: '4'
  - number: 12.2.6
    text: Op aanvraag van de gezamenlijke nummerhouders kan het college een besluit als bedoeld in het vierde lid intrekken.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel12.2
  - number: '12.3'
    text: |-
      Het college is onbevoegd tot het beslechten van een op grond van [artikel 12.2][ref1] voorgelegd geschil, indien de
      bij dat geschil betrokken partijen het college verzoeken het geschil niet langer te behandelen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel12
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel12.3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '12'
        hoofdstuk: '12'
        paragraaf: '12.2'
  - number: 12.4.1
    text: |-
      Op vordering van het college verstrekken de bij een geschil betrokken partijen binnen twee weken dan wel binnen
      een andere door het college te bepalen redelijke termijn, aan het college alle gegevens die relevant zijn voor de
      beoordeling van het geschil.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel12.4
  - number: 12.4.2
    text: |-
      De bij het geschil betrokken partijen zijn verplicht onverwijld, maar in elk geval binnen de door het college
      gestelde redelijke termijn, alle medewerking te verlenen die deze redelijkerwijs kan vorderen ten behoeve van de
      beoordeling van het geschil.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel12.4
  - number: 12.5.1
    text: |-
      Het college beslist op een aanvraag als bedoeld in [artikel 12.2][ref1] binnen zeventien weken na ontvangst van
      die aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel12
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel12.5
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '12'
        hoofdstuk: '12'
        paragraaf: '12.2'
  - number: 12.5.2
    text: |-
      Onverminderd het eerste lid, kan het college in spoedeisende gevallen een voorlopig besluit nemen dat tussen de
      betrokken aanbieders geldt tot het definitieve besluit van het college.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel12.5
  - number: 12.5.3
    text: |-
      In uitzonderlijke gevallen kan het college de termijn, bedoeld in het eerste lid, verlengen. Het college stelt
      de desbetreffende aanbieders daarvan in kennis en geeft de termijn aan waarbinnen het college het geschil zal
      beslechten, met dien verstande dat die termijn niet langer is dan acht weken na afloop van de termijn, bedoeld in
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel12.5
  - number: '12.6'
    text: |-
      Een bij een geschil betrokken partij volgt de door het college op grond van [artikel 12.2][ref1] genomen besluit
      op. Het college kan daarbij termijnen stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel12
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel12.6
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '12'
        hoofdstuk: '12'
        paragraaf: '12.2'
  - number: '12.7'
    text: |-
      Van een besluit als bedoeld in [artikel 12.2][ref1] wordt mededeling gedaan in de Staatscourant. Van gegevens als
      bedoeld in [artikel 10, eerste lid, onderdeel c, van de Wet openbaarheid van bestuur][ref2] wordt geen mededeling
      gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel12.7
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '12'
        hoofdstuk: '12'
        paragraaf: '12.2'
      - id: ref2
        bwb_id: BWBR0005252
        artikel: '10'
  - number: 12.8.1
    text: |-
      Het college overlegt met de desbetreffende nationale regelgevende instantie aan wie de bevoegdheid tot het
      beslechten van geschillen is opgedragen, over de beslechting van een geschil dat landsgrensoverschrijdende aspecten
      heeft en dat overeenkomstig deze paragraaf aan het college is voorgelegd, dan wel aan de desbetreffende nationale
      regelgevende instantie is voorgelegd en door die instantie aan het college is voorgelegd.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel12.8
  - number: 12.8.2
    text: |-
      In afwijking van [artikel 12.5, eerste lid][ref1], beslist het college op een aanvraag als bedoeld in het eerste
      lid, binnen 24 weken na ontvangst van die aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel12
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel12.8
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '12'
        hoofdstuk: '12'
        paragraaf: '12.2'
  - number: 12.9.1
    text: |-
      Indien tussen een consument en een aanbieder of een onderneming die openbare elektronische communicatienetwerken of
      openbare elektronische communicatiediensten aanbiedt een geschil is gerezen inzake de schending door die aanbieder
      of onderneming van bij of krachtens deze wet gestelde regels ter uitvoering van [richtlijn nr. 2002/22/EG]
      (onbekend), niet zijnde een geschil als bedoeld in [artikel 12.1][ref1], of inzake de schending door die aanbieder
      of onderneming van de roamingverordening kan het college op aanvraag van de desbetreffende consument, het geschil
      beslechten.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel12
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel12.9
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '12'
        hoofdstuk: '12'
        paragraaf: '12.1'
  - number: 12.9.2
    text: |-
      Indien een consument door het college in het gelijk wordt gesteld en hij voor het beslechten van een geschil bij
      of krachtens [artikel 16.1][ref1] een vergoeding aan het college verschuldigd is, kan het college bepalen dat die
      vergoeding door een aanbieder of onderneming als bedoeld in het eerste lid wordt vergoed.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel16
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel12.9
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '16'
        hoofdstuk: '16'
  - number: 12.9.3
    text: |-
      Een bij een geschil betrokken aanbieder of onderneming volgt de door het college op grond van het eerste lid
      gegeven voorschriften op. Het college kan daarbij termijnen stellen.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel12.9
  - number: 12.9.4
    text: |-
      De [artikelen 12.3 tot en met 12.5][ref1], [12.7][ref2] en [12.8][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel12
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel12.9
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '12'
        hoofdstuk: '12'
        paragraaf: '12.2'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '12'
        hoofdstuk: '12'
        paragraaf: '12.2'
      - id: ref3
        bwb_id: BWBR0009950
        artikel: '12'
        hoofdstuk: '12'
        paragraaf: '12.2'
  - number: 12.10.1
    text: |-
      Indien houders van een vergunning als bedoeld in [artikel 3.9, eerste lid][ref1], geen overeenstemming kunnen
      bereiken over de voorwaarden waaronder de aan hen toegewezen frequentieruimte gezamenlijk in gebruik zal worden
      genomen, kan Onze Minister op aanvraag van een of meer van hen, voorschriften geven inzake het tot stand brengen
      van een overeenkomst als bedoeld in [artikel 3.9, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel12.10
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 12.10.2
    text: |-
      Op aanvraag van de gezamenlijke vergunninghouders kan Onze Minister een besluit als bedoeld in het eerste lid
      intrekken.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel12.10
  - number: 12.10.3
    text: |-
      De [artikelen 12.4][ref1], [12.5, eerste lid][ref2], [12.6][ref3] en [12.7][ref4] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0009950#Artikel12
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel12.10
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '12'
        hoofdstuk: '12'
        paragraaf: '12.2'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '12'
        hoofdstuk: '12'
        paragraaf: '12.2'
      - id: ref3
        bwb_id: BWBR0009950
        artikel: '12'
        hoofdstuk: '12'
        paragraaf: '12.2'
      - id: ref4
        bwb_id: BWBR0009950
        artikel: '12'
        hoofdstuk: '12'
        paragraaf: '12.2'
  - number: 13.1.1
    text: |-
      Aanbieders van openbare telecommunicatienetwerken en openbare telecommunicatiediensten stellen hun
      telecommunicatienetwerken en telecommunicatiediensten uitsluitend beschikbaar aan gebruikers indien deze aftapbaar
      zijn.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel13.1
  - number: 13.1.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de technische
      aftapbaarheid van openbare telecommunicatienetwerken en openbare telecommunicatiediensten.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel13.1
  - number: 13.2.1
    text: |-
      Aanbieders van openbare telecommunicatienetwerken zijn verplicht medewerking te verlenen aan de uitvoering
      van een bevel op grond van het [Wetboek van Strafvordering][ref1] dan wel een toestemming op grond van de
      [Wet op de inlichtingen- en veiligheidsdiensten 2002][ref2] tot het aftappen of opnemen van telecommunicatie die
      over hun telecommunicatienetwerken wordt afgewikkeld.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
      [ref2]: https://wetten.overheid.nl/BWBR0013409
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel13.2
    references:
      - id: ref1
        bwb_id: BWBR0001903
      - id: ref2
        bwb_id: BWBR0013409
  - number: 13.2.2
    text: |-
      Aanbieders van openbare telecommunicatiediensten zijn verplicht medewerking te verlenen aan de uitvoering
      van een bevel op grond van het [Wetboek van Strafvordering][ref1] dan wel een toestemming op grond van de
      [Wet op de inlichtingen- en veiligheidsdiensten 2002][ref2] tot het aftappen of opnemen van door hen verzorgde
      telecommunicatie.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
      [ref2]: https://wetten.overheid.nl/BWBR0013409
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel13.2
    references:
      - id: ref1
        bwb_id: BWBR0001903
      - id: ref2
        bwb_id: BWBR0013409
  - number: 13.2.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de te nemen
      organisatorische en personele maatregelen en te treffen voorzieningen met betrekking tot aftappen.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel13.2
  - number: 13.2a.1
    text: |-
      Aanbieders van openbare telecommunicatienetwerken en openbare telecommunicatiediensten voldoen aan een vordering
      op grond van [artikel 126n][ref1], [artikel 126u][ref2] of [artikel 126zh van het Wetboek van Strafvordering][ref3]
      dan wel een verzoek op grond van [artikel 28 van de Wet op de inlichtingen- en veiligheidsdiensten 2002][ref4]
      tot het verstrekken van gegevens over een gebruiker van een openbaar telecommunicatienetwerk dan wel een openbare
      telecommunicatiedienst en het telecommunicatieverkeer met betrekking tot die gebruiker.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel126n
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel126u
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel126zh
      [ref4]: https://wetten.overheid.nl/BWBR0013409#Artikel28
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel13.2a
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 126n
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 126u
      - id: ref3
        bwb_id: BWBR0001903
        artikel: 126zh
      - id: ref4
        bwb_id: BWBR0013409
        artikel: '28'
  - number: 13.2a.2
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de wijze waarop de aanbieders
      aan de vordering of het verzoek voldoen en de wijze waarop de gegevens, bedoeld in het eerste lid, beschikbaar
      worden gehouden.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel13.2a
  - number: 13.2b
    text: |-
      Aanbieders van openbare telecommunicatienetwerken en openbare telecommunicatiediensten voldoen aan een
      vordering op grond van de [artikelen 126nc tot en met 126ni][ref1], [126uc tot en met 126ui][ref2] en
      [126zja tot en met 126zp van het Wetboek van Strafvordering][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel126nc
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel126uc
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel126zja
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel13.2b
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 126nc
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 126uc
      - id: ref3
        bwb_id: BWBR0001903
        artikel: 126zja
  - number: '13.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het beslechten van geschillen
      tussen aanbieders en de bevoegde autoriteiten over de voorzieningen door middel van welke de door een tap te
      verkrijgen telecommunicatie door aanbieders wordt doorgegeven.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel13.3
  - number: 13.4.1
    text: |-
      Aanbieders van openbare telecommunicatienetwerken en openbare telecommunicatiediensten voldoen
      aan een vordering op grond van [artikel 126na, eerste lid][ref1], [126ua, eerste lid][ref2],
      of [126zi van het Wetboek van Strafvordering][ref3] dan wel een verzoek op grond van
      [artikel 29 van de Wet op de inlichtingen- en veiligheidsdiensten 2002][ref4] tot het verstrekken van gegevens
      terzake van naam, adres, postcode, woonplaats, nummer en soort dienst van een gebruiker van een openbaar
      telecommunicatienetwerk dan wel een openbare telecommunicatiedienst.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel126na
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel126ua
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel126zi
      [ref4]: https://wetten.overheid.nl/BWBR0013409#Artikel29
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel13.4
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 126na
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 126ua
      - id: ref3
        bwb_id: BWBR0001903
        artikel: 126zi
      - id: ref4
        bwb_id: BWBR0013409
        artikel: '29'
  - number: 13.4.2
    text: |-
      Aanbieders van openbare telecommunicatienetwerken en openbare telecommunicatiediensten voldoen
      aan een vordering op grond van [artikel 126na, tweede lid][ref1], [126ua, tweede lid][ref2],
      of [126zi van het Wetboek van Strafvordering][ref3] dan wel een verzoek op grond van
      [artikel 29 van de Wet op de inlichtingen- en veiligheidsdiensten 2002][ref4] tot het op bij algemene maatregel van
      bestuur te bepalen wijze achterhalen en verstrekken van de gegevens, bedoeld in het eerste lid. Teneinde aan deze
      verplichting te kunnen voldoen bewaren de aanbieders bij algemene maatregel van bestuur aan te wijzen gegevens voor
      een periode van drie maanden, vanaf het tijdstip waarop deze gegevens voor de eerste maal zijn verwerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel126na
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel126ua
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel126zi
      [ref4]: https://wetten.overheid.nl/BWBR0013409#Artikel29
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel13.4
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 126na
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 126ua
      - id: ref3
        bwb_id: BWBR0001903
        artikel: 126zi
      - id: ref4
        bwb_id: BWBR0013409
        artikel: '29'
  - number: 13.4.3
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de wijze waarop de aanbieders
      aan een vordering of een verzoek, bedoeld in het eerste en tweede lid, voldoen en de wijze waarop de gegevens,
      bedoeld in het eerste lid, beschikbaar worden gehouden.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel13.4
  - number: 13.5.1
    text: |-
      Aanbieders van openbare telecommunicatienetwerken en openbare telecommunicatiediensten zijn
      verplicht gegevens met betrekking tot een bijzondere last dan wel een toestemming op grond van de
      [Wet op de inlichtingen- en veiligheidsdiensten 2002][ref1] als bedoeld in [artikel 13.2][ref2] of
      [artikel 13.2a][ref3] dan wel een vordering of een verzoek als bedoeld in [artikel 13.2a][ref4],
      [artikel 13.2b][ref5] of [artikel 13.4, eerste of tweede lid][ref6] te beveiligen tegen kennisneming door
      onbevoegden alsmede geheimhouding te betrachten met betrekking tot deze gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0013409
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0009950#Artikel13
      [ref5]: https://wetten.overheid.nl/BWBR0009950#Artikel13
