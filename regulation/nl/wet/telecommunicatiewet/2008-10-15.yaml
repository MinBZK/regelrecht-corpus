  - number: 20.15a.3
    text: |-
      Op klachten die voor het tijdstip van inwerkingtreding van de Wijziging van de Telecommunicatiewet in verband met
      het vaststellen van nadere bepalingen over het gebruik van nummers ter bescherming van de consument zijn ingediend
      bij een erkende instelling, bedoeld in [artikel 4.11][ref1] van de Telecommunicatiewet, blijven de regels van
      toepassing die golden ten tijde van de indiening van de klacht.


