    text: |-
      Nummerhouders registreren binnen zes maanden na de inwerkingtreding van
      [artikel 4.9, derde lid, onderdeel b][ref1], de nummergebruikers. De nummergebruiker krijgt het nummer op de dag
      van registratie door de nummerhouder van rechtswege in gebruik door de nummerhouder.


