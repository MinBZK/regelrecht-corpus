---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht-mvp/refs/heads/main/schema/v0.3.1/schema.json
$id: telecommunicatiewet
regulatory_layer: WET
publication_date: '2025-07-23'
valid_from: '2008-10-15'
bwb_id: BWBR0009950
url: https://wetten.overheid.nl/BWBR0009950/2008-10-15
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het in verband met de algehele liberalisering van de telecommunicatie-
    infrastructuur en de telecommunicatiediensten wenselijk is regels te stellen ter waarborging van een samenhangende
    infrastructuur en ter bevordering van de daadwerkelijke mededinging;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Economische Zaken;'
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.1
  - number: 1.1.b
    text: |-
      college: college, genoemd in [artikel 2 van de Wet Onafhankelijke post- en telecommunicatieautoriteit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008807#Artikel2
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0008807
        artikel: '2'
  - number: 1.1.c
    text: |-
      raad van bestuur van de mededingingsautoriteit: raad van bestuur van de Nederlandse mededingingsautoriteit als
      bedoeld in [artikel 2 van de Mededingingswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel2
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '2'
  - number: 1.1.d
    text: |-
      nationale regelgevende instantie: instantie in een andere lidstaat van de Europese Unie die krachtens het recht
      van die lidstaat is belast met een of meer regelgevende of daarmee verband houdende uitvoerende taken die zijn
      toegekend in de [richtlijnen nrs. 2002/19/EG](onbekend), [2002/20/EG](onbekend), [2002/21/EG](onbekend), [2002/22/
      EG](onbekend) of [2002/58/EG](onbekend);
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.1
  - number: 1.1.e
    text: |-
      elektronisch communicatienetwerk: transmissiesystemen, waaronder mede begrepen de schakel- of routeringsapparatuur
      en andere middelen, die het mogelijk maken signalen over te brengen via kabels, radiogolven, optische of
      andere elektromagnetische middelen, waaronder satellietnetwerken, vaste en mobiele terrestrische netwerken,
      elektriciteitsnetten, voor zover deze voor overdracht van signalen worden gebruikt en netwerken voor radio- en
      televisieomroep en kabeltelevisienetwerken, ongeacht de aard van de overgebrachte informatie;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.1
  - number: 1.1.f
    text: |-
      elektronische communicatiedienst: gewoonlijk tegen vergoeding aangeboden dienst die geheel of hoofdzakelijk
      bestaat in het overbrengen van signalen via elektronische communicatienetwerken, waaronder telecommunicatiediensten
      en transmissiediensten op netwerken die voor omroep worden gebruikt, doch niet de dienst waarbij met behulp
      van elektronische communicatienetwerken en -diensten overgebrachte inhoud wordt geleverd of redactioneel wordt
      gecontroleerd. Het omvat niet de diensten van de informatiemaatschappij zoals omschreven in artikel 1 van de
      notificatierichtlijn die niet geheel of hoofdzakelijk bestaan uit het overbrengen van signalen via elektronische
      communicatienetwerken;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.1
  - number: 1.1.g
    text: 'openbare elektronische communicatiedienst: elektronische communicatiedienst die beschikbaar is voor het publiek;'
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.1
  - number: 1.1.h
    text: |-
      openbaar elektronisch communicatienetwerk: elektronisch communicatienetwerk dat geheel of hoofdzakelijk wordt
      gebruikt om openbare elektronische communicatiediensten aan te bieden, waaronder mede wordt begrepen een netwerk,
      bestemd voor het verspreiden van programma's voor zover dit aan het publiek geschiedt;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.1
  - number: 1.1.i
    text: |-
      aanbieden van een elektronisch communicatienetwerk: het bouwen, exploiteren, beheren of beschikbaar stellen van een
      elektronisch communicatienetwerk;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.1
  - number: 1.1.j
    text: |-
      bijbehorende faciliteiten: bij een elektronisch communicatienetwerk of een elektronische communicatiedienst
      behorende faciliteiten die het aanbieden van diensten via dat netwerk of die dienst mogelijk maken of ondersteunen,
      alsmede systemen voor voorwaardelijke toegang en elektronische programmagidsen;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.1
  - number: 1.1.k
    text: |-
      netwerkaansluitpunt: fysiek punt waarop een abonnee de toegang tot een openbaar communicatienetwerk wordt geboden;
      in het geval van netwerken met schakelings- of routeringsfuncties wordt het netwerkaansluitpunt bepaald door middel
      van een specifiek netwerkadres, dat met een abonneenummer of -naam kan zijn verbonden;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.1
  - number: 1.1.l
    text: |-
      toegang: het aan een andere onderneming beschikbaar stellen van netwerkonderdelen, bijbehorende faciliteiten
      of diensten onder uitdrukkelijke voorwaarden al dan niet op exclusieve basis ten behoeve van het aanbieden van
      elektronische communicatiediensten of het verspreiden van programma's aan het publiek door die onderneming;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.1
  - number: 1.1.m
    text: |-
      interconnectie: specifiek type toegang dat wordt gerealiseerd tussen exploitanten van openbare netwerken,
      inhoudende het fysiek en logisch verbinden van openbare communicatienetwerken die door dezelfde of een andere
      onderneming worden gebruikt om het de gebruikers van een onderneming mogelijk te maken te communiceren met die van
      dezelfde of van een andere onderneming of toegang te hebben tot diensten die door een andere onderneming worden
      aangeboden;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.1
  - number: 1.1.n
    text: |-
      gebruiker: natuurlijk persoon of rechtspersoon die gebruik maakt van of verzoekt om een openbare elektronische
      communicatiedienst;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.1
  - number: 1.1.o
    text: |-
      eindgebruiker: natuurlijke persoon of rechtspersoon die van een openbare elektronische communicatiedienst gebruik
      maakt of wil gaan maken en die niet tevens openbare elektronische communicatienetwerken of openbare elektronische
      communicatiediensten aanbiedt;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.1
  - number: 1.1.p
    text: |-
      abonnee: natuurlijke persoon of rechtspersoon die partij is bij een overeenkomst met een aanbieder van openbare
      elektronische communicatiediensten voor de levering van dergelijke diensten;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.1
  - number: 1.1.q
    text: |-
      consument: natuurlijke persoon die gebruik maakt van of verzoekt om een openbare elektronische communicatiedienst
      voor andere dan bedrijfs- of beroepsdoeleinden;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.1
  - number: 1.1.r
    text: |-
      onderneming: onderneming in de zin van [artikel 81, eerste lid, van het Verdrag tot oprichting van de Europese
      Gemeenschap](onbekend);
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.1
  - number: 1.1.s
    text: |-
      onderneming die beschikt over een aanmerkelijke marktmacht: onderneming die alleen of tezamen met andere
      ondernemingen over een economische kracht beschikt die haar in staat stelt zich in belangrijke mate onafhankelijk
      van haar concurrenten, klanten en uiteindelijk consumenten te gedragen;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.1
  - number: 1.1.t
    text: |-
      transnationale markt: bij beschikking, bedoeld in artikel 15, vierde lid, van [richtlijn nr. 2002/21/EG](onbekend),
      gedefinieerde markt die ten minste een gedeelte van Nederland beslaat;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.1
  - number: 1.1.u
    text: |-
      huurlijn: publiekelijk ter beschikking gestelde transparante transmissiecapaciteit tussen twee
      netwerkaansluitpunten van een of meer elektronische communicatienetwerken, zonder routeringsfuncties waarover
      gebruikers kunnen beschikken als onderdeel van de geleverde huurlijn;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.1
  - number: 1.1.v
    text: |-
      minimumpakket van huurlijnen: door de Commissie van de Europese Gemeenschappen op grond van de artikelen 17 en
      22 van [richtlijn nr. 2002/21/EG](onbekend) of de artikelen 18 en 37 van [richtlijn nr. 2002/22/EG](onbekend)
      vastgesteld minimumpakket van huurlijnen, zoals vermeld in een lijst van in het Publicatieblad van de Europese
      Gemeenschappen gepubliceerde normen;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.1
  - number: 1.1.w
    text: |-
      openbaar telefoonnetwerk: elektronisch communicatienetwerk dat wordt gebruikt om openbare telefoondiensten aan te
      bieden; het ondersteunt de overdracht tussen netwerkaansluitpunten van spraakcommunicatie en ook andere vormen van
      communicatie, zoals fax en data;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.1
  - number: 1.1.x
    text: 'openbare telefoondienst: dienst die voor het publiek beschikbaar is voor uitgaande en binnenkomende gesprekken;'
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.1
  - number: 1.1.y
    text: |-
      programma: programma als bedoeld in [artikel 1, eerste lid, onder f, van de Mediawet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel1
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '1'
  - number: 1.1.z
    text: |-
      kabels: fysieke geleidingsdraden bestemd voor de rechtstreekse overdracht van signalen tussen punten en de bij deze
      fysieke geleidingsdraden behorende ondergrondse ondersteuningswerken, beschermingswerken en signaalinrichtingen,
      alsmede inrichtingen, bestemd om daarin verbinding tot stand te brengen tussen fysieke geleidingsdraden in, op of
      boven openbare gronden enerzijds en fysieke geleidingsdraden in gebouwen en daarmee één geheel vormende gronden
      anderzijds dan wel tussen laatstgenoemde fysieke geleidingsdraden onderling;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.1
  - number: 1.1.aa
    text: 'openbare gronden:'
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.1
  - number: 1.1.aa.1º
    text: |-
      openbare wegen met inbegrip van de daartoe behorende stoepen, glooiingen, bermen, sloten, bruggen, viaducten,
      tunnels, duikers, beschoeiingen en andere werken;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.1
  - number: 1.1.aa.2º
    text: |-
      wateren met de daartoe behorende bruggen, plantsoenen, pleinen en andere plaatsen, die voor eenieder toegankelijk
      zijn;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.1
  - number: 1.1.bb
    text: |-
      nummer: cijfers, letters of andere symbolen, al dan niet in combinatie, die bestemd zijn voor toegang tot of
      identificatie van gebruikers, netwerkexploitanten, diensten, netwerkaansluitpunten of andere netwerkelementen;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.1
  - number: 1.1.cc
    text: 'nummeridentificatie:'
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.1
  - number: 1.1.cc.1º
    text: |-
      faciliteit om het nummer van het oproepende netwerkaansluitpunt dan wel een nummer waarmee een individuele
      gebruiker kan worden geïdentificeerd aan het opgeroepen netwerkaansluitpunt te verstrekken, voordat de verbinding
      tot stand wordt gebracht;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.1
  - number: 1.1.cc.2º
    text: |-
      faciliteit om het nummer van het opgeroepen netwerkaansluitpunt dan wel het nummer waarmee een individuele
      gebruiker kan worden geïdentificeerd aan het oproepende netwerkaansluitpunt te verstrekken, voordat de verbinding
      tot stand wordt gebracht;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.1
  - number: 1.1.dd
    text: |-
      in de handel brengen: het voor de eerste maal afleveren na vervaardiging in de Europese Economische Ruimte, het in
      gebruik nemen na vervaardiging in de Europese Economische Ruimte, het invoeren in de Europese Economische Ruimte
      uit een land daarbuiten, of het in gebruik nemen na invoer uit een land buiten de Europese Economische Ruimte in de
      Europese Economische Ruimte;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.1
  - number: 1.1.ee
    text: |-
      openbaar telecommunicatienetwerk: elektronisch communicatienetwerk dat geheel of gedeeltelijk wordt gebruikt om
      openbare telecommunicatiediensten aan te bieden, voor zover het netwerk niet gebruikt wordt voor het verspreiden
      van programma's;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.1
  - number: 1.1.ff
    text: |-
      openbare telecommunicatiedienst: voor het publiek beschikbare dienst die geheel of gedeeltelijk bestaat in het
      overbrengen van signalen via een elektronisch communicatienetwerk, voor zover deze dienst niet bestaat uit het
      verspreiden van programma's;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.1
  - number: 1.1.gg
    text: 'uitrusting: elk apparaat of vaste installatie;'
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.1
  - number: 1.1.hh
    text: 'apparaten: elektrische en elektronische apparaten;'
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.1
  - number: 1.1.ii
    text: |-
      vaste installatie: een specifieke combinatie van verschillende soorten apparaten en eventuele andere inrichtingen,
      die samengebouwd, geïnstalleerd en bestemd zijn voor permanent gebruik op een van te voren vastgestelde locatie;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.1
  - number: 1.1.jj
    text: 'randapparaten:'
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.1
  - number: 1.1.jj.1°
    text: |-
      uitrusting die bestemd is om op een openbaar telecommunicatienetwerk te worden aangesloten, zodanig dat zij:
      rechtstreeks op netwerkaansluitpunten kan worden aangesloten, of kan dienen voor interactie met een openbaar
      telecommunicatienetwerk via directe of indirecte aansluiting op netwerkaansluitpunten ten behoeve van overbrenging,
      verwerking of ontvangst van informatie;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.1
  - number: 1.1.jj.2°
    text: Radiozendapparaten die geschikt zijn om op een openbaar telecommunicatienetwerk te worden aangesloten;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.1
  - number: 1.1.jj.3°
    text: |-
      Uitrusting voor satellietgrondstations tenzij bij of krachtens [hoofdstuk 10][ref1] anders is bepaald, doch met
      uitsluiting van speciaal geconstrueerde uitrusting die bedoeld is voor gebruik als onderdeel van een openbaar
      telecommunicatienetwerk;


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk10
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0009950
        hoofdstuk: '10'
  - number: 1.1.kk
    text: |-
      radiozendapparaten: uitrusting die naar haar aard bestemd is voor het zenden of het zenden en ontvangen van
      radiocommunicatiesignalen;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.1
  - number: 1.1.ll
    text: |-
      systeem voor voorwaardelijke toegang: elke technische maatregel of regeling waarbij toegang tot een beschermde
      radio- of televisie-omroepdienst in begrijpelijke vorm afhankelijk wordt gemaakt van een abonnement of een andere
      vorm van voorafgaande individuele machtiging;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.1
  - number: 1.1.mm
    text: |-
      applicatieprogramma-interface: een software interface tussen externe toepassingen, die beschikbaar is gesteld door
      omroepen, dienstenleveranciers, alsmede de hulpmiddelen in de eindapparatuur;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.1
  - number: 1.1.nn
    text: |-
      Internationaal Telecommunicatieverdrag: het op 22 december 1992 te Genève tot stand gekomen Statuut en Verdrag
      van de Internationale Unie voor Telecommunicatie met de daarbij behorende bijlagen en reglementen (Trb. 1993,
      138), de op 14 oktober 1994 te Kyoto tot stand gekomen Akten van wijziging van het Statuut en het Verdrag van
      de Internationale Unie voor Telecommunicatie (Trb. 1995, 201) en de op 6 november 1998 te Minneapolis tot stand
      gekomen Akten van wijziging van het Statuut en het Verdrag van de Internationale Unie voor Telecommunicatie (Trb.
      2001, 90);
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.1
  - number: 1.1.oo
    text: |-
      [richtlijn nr. 2002/19/EG](onbekend): [Richtlijn nr. 2002/19/EG](onbekend) van het Europees Parlement en
      de Raad van de Europese Unie van 7 maart 2002 inzake de toegang tot en interconnectie van elektronische-
      communicatienetwerken en bijbehorende faciliteiten (Toegangsrichtlijn) (PbEG L 108);
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.1
  - number: 1.1.pp
    text: |-
      [richtlijn nr. 2002/20/EG](onbekend): [Richtlijn nr. 2002/20/EG](onbekend) van het Europees Parlement en de
      Raad van de Europese Unie van 7 maart 2002 betreffende de machtiging voor elektronische-communicatienetwerken en
      -diensten (Machtigingsrichtlijn) (PbEG L 108);
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.1
  - number: 1.1.qq
    text: |-
      [richtlijn nr. 2002/21/EG](onbekend): [Richtlijn nr. 2002/21/EG](onbekend) van het Europees Parlement en de
      Raad van de Europese Unie van 7 maart 2002 inzake een gemeenschappelijk regelgevingskader voor elektronische-
      communicatienetwerken en -diensten (Kaderrichtlijn) (PbEG L 108);
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.1
  - number: 1.1.rr
    text: |-
      [richtlijn nr. 2002/22/EG](onbekend): [Richtlijn nr. 2002/22/EG](onbekend) van het Europees Parlement en de
      Raad van de Europese Unie van 7 maart 2002 inzake de universele dienst en gebruikersrechten met betrekking tot
      elektronische-communicatienetwerken en -diensten (Universeledienstrichtlijn) (PbEG L 108);
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.1
  - number: 1.1.ss
    text: |-
      certificaat: elektronische bevestiging die gegevens voor het verifiëren van een elektronische handtekening met een
      bepaalde persoon verbindt en de identiteit van die persoon bevestigt;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.1
  - number: 1.1.tt
    text: |-
      gekwalificeerd certificaat: certificaat dat voldoet aan de eisen, gesteld krachtens
      [artikel 18.15, tweede lid][ref1], en is afgegeven door een certificatiedienstverlener die voldoet aan de eisen,
      gesteld krachtens [artikel 18.15, eerste lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel18
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '18'
        hoofdstuk: '18'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '18'
        hoofdstuk: '18'
  - number: 1.1.uu
    text: |-
      certificatiedienstverlener: een natuurlijke persoon of rechtspersoon die certificaten afgeeft of andere diensten in
      verband met elektronische handtekeningen verleent;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.1
  - number: 1.1.vv
    text: |-
      middel voor het aanmaken van elektronische handtekeningen: geconfigureerde software of hardware die wordt gebruikt
      om de gegevens voor het aanmaken van elektronische handtekeningen te implementeren;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.1
  - number: 1.1.ww
    text: |-
      veilig middel voor het aanmaken van elektronische handtekeningen: een middel voor het aanmaken van elektronische
      handtekeningen dat voldoet aan de eisen gesteld krachtens [artikel 18.17, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel18
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '18'
        hoofdstuk: '18'
  - number: 1.1.xx
    text: |-
      elektronische handtekening: elektronische handtekening als bedoeld in
      [artikel 15a, vierde lid, van Titel 1, afdeling 1A van Boek 3 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel15a
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: 15a
  - number: 1.1.yy
    text: |-
      ondertekenaar: voor de toepassing van deze wet geldt de definitiebepaling van
      [artikel 15a, vijfde lid, van Titel 1, afdeling 1A van Boek 3 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel15a
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: 15a
  - number: 1.1.zz
    text: |-
      openbare betaaltelefoon: voor het publiek toegankelijk telefoontoestel waarmee uitgaande gesprekken gevoerd kunnen
      worden en waarvan de betaling voor het gebruik kan geschieden door middel van munten, krediet- of debetkaarten of
      vooruitbetaalde telefoonkaarten;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.1
  - number: 1.1.aaa
    text: |-
      notificatierichtlijn: [richtlijn nr. 98/34/EG](onbekend) van het Europees Parlement en de Raad van de Europese Unie
      van 22 juni 1998 betreffende een informatieprocedure op het gebied van normen en technische voorschriften en regels
      betreffende de diensten van de informatiemaatschappij (PbEG L 204);
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.1
  - number: 1.1.ccc
    text: |-
      programmadienst: dienst die geheel of hoofdzakelijk bestaat uit het aanbieden van programma’s aan het algemene
      publiek of een deel daarvan;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.1
  - number: 1.1.bbb
    text: |-
      conformiteitsrichtlijn: richtlijn van het Europees Parlement en de Raad van de Europese Unie, die geheel of
      gedeeltelijk berust op artikel 95 van het EG-Verdrag en regels stelt over het op de markt brengen of het gebruik
      van apparaten;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.1
  - number: 1.1.ccc
    text: 'nummerhouder: degene aan wie het college op aanvraag een nummer heeft toegekend;'
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.1
  - number: 1.1.ddd
    text: 'nummergebruiker: degene die een nummer gebruikt;'
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.1
  - number: 1.1.eee
    text: |-
      roamingverordening: verordening nr. 717/2007 van het Europees Parlement en de Raad van de Europese Unie van 27 juni
      2007 betreffende roaming op openbare mobiele telefoonnetwerken binnen de Gemeenschap en tot wijziging van Richtlijn
      2002/21/EG inzake een gemeenschappelijk regelgevingskader voor elektronische-communicatienetwerken en -diensten
      (PbEU L 171).
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.1
  - number: '1.2'
    text: |-
      De bepalingen vastgesteld bij of krachtens deze wet gelden mede op en met betrekking tot installaties ter zee in de
      zin van de [Wet installaties Noordzee][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002467
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.2
    references:
      - id: ref1
        bwb_id: BWBR0002467
  - number: 1.3.1
    text: |-
      Het college draagt er zorg voor dat zijn besluiten bijdragen aan het verwezenlijken van de doelstellingen als
      bedoeld in artikel 8, tweede, derde en vierde lid, van [richtlijn nr. 2002/21/EG](onbekend) in elk geval door:
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.3
  - number: 1.3.1.a
    text: |-
      het bevorderen van concurrentie bij het leveren van elektronische communicatienetwerken, elektronische
      communicatiediensten, of bijbehorende faciliteiten, onder meer door efficiënte investeringen op het gebied van
      infrastructuur aan te moedigen en innovaties te steunen;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.3
  - number: 1.3.1.b
    text: de ontwikkeling van de interne markt;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.3
  - number: 1.3.1.c
    text: het bevorderen van belangen van eindgebruikers wat betreft keuze, prijs en kwaliteit.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.3
  - number: 1.3.2
    text: |-
      Het college houdt bij de uitoefening van zijn taken en bevoegdheden rekening met aanbevelingen van de Commissie
      van de Europese Gemeenschappen als bedoeld in artikel 19, eerste lid, van [richtlijn nr. 2002/21/EG](onbekend),
      voor zover die aanbevelingen betrekking hebben op de bij of krachtens deze wet aan het college opgedragen taken of
      verleende bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.3
  - number: 1.3.3
    text: |-
      Indien het college geen toepassing geeft aan een aanbeveling als bedoeld in het tweede lid, informeert hij, onder
      vermelding van de redenen, de Commissie van de Europese Gemeenschappen en Onze Minister.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.3
  - number: 1.3.4
    text: |-
      Indien het college een besluit neemt, dat aanzienlijke gevolgen voor de desbetreffende markt heeft, onderbouwt
      het college, onder andere op basis van een verantwoording van de voorzienbare relevante gevolgen, zowel in
      kwalitatieve, als voor zover redelijkerwijs mogelijk in kwantitatieve zin dat de maatregel noodzakelijk is voor
      het bereiken van de in het eerste lid genoemde doelstellingen en dat een andere minder ingrijpende maatregel niet
      effectief is.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel1.3
  - number: 2.1.1
    text: |-
      Degene die een openbaar elektronisch communicatienetwerk of een openbare elektronische communicatiedienst
      aanbiedt dan wel bijbehorende faciliteiten aanlegt of aanbiedt, met uitzondering van degene die een elektronische
      programmagids aanbiedt, doet daarvan mededeling aan het college.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel2.1
  - number: 2.1.2
    text: |-
      Het college stelt vast welke gegevens bij de mededeling aan het college worden overgelegd, alsmede de wijze
      waarop de mededeling wordt gedaan. Die gegevens betreffen in ieder geval de naam, het adres, de vestigingsplaats,
      respectievelijk de woonplaats en een beschrijving van de in het eerste lid bedoelde netwerken, diensten of
      faciliteiten. Het college doet hiervan mededeling in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel2.1
  - number: 2.1.3
    text: |-
      De gegevens, bedoeld in het tweede lid, worden slechts verzameld ten behoeve van de goede uitvoering van deze wet
      en zijn beperkt tot hetgeen strikt noodzakelijk is voor het vaststellen van de identiteit en de hoedanigheid van
      degene, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel2.1
  - number: 2.1.4
    text: |-
      Het college registreert degene, bedoeld in het eerste lid, na ontvangst van de in dat lid bedoelde mededeling en de
      daarbij behorende gegevens.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel2.1
  - number: 2.1.5
    text: |-
      Voor het aanbieden of afgeven van gekwalificeerde certificaten aan het publiek is een registratie door het
      college vereist van de certificatiedienstverlener die in Nederland een vestiging heeft. Bij de aanvraag van een
      registratie legt de certificatiedienstverlener documenten over waaruit de overeenstemming met de bij en krachtens
      [artikel 18.15, eerste en tweede lid][ref1], bedoelde eisen blijkt. Het college is bevoegd te bepalen welke andere
      gegevens bij de aanvraag van een registratie dienen te worden overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel18
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '18'
        hoofdstuk: '18'
  - number: 2.1.6
    text: |-
      Een certificatiedienstverlener waarvan door een organisatie als bedoeld in [artikel 18.16, eerste lid][ref1], is
      vastgesteld dat wordt voldaan aan de eisen, gesteld bij of krachtens [artikel 18.15, eerste en tweede lid][ref2],
      kan om te voldoen aan het bepaalde krachtens de tweede volzin van het vijfde lid, volstaan met het overleggen van
      een geldig bewijs van die vaststelling.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel18
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '18'
        hoofdstuk: '18'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '18'
        hoofdstuk: '18'
  - number: 2.2.1
    text: |-
      Het college gaat niet over tot registratie als bedoeld in [artikel 2.1, vierde lid][ref1], indien:


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel2
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.2.1.a
    text: |-
      de mededeling geen betrekking heeft op een openbaar elektronisch communicatienetwerk, een openbare elektronische
      communicatiedienst, of bijbehorende faciliteiten, of
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel2.2
  - number: 2.2.1.b
    text: |-
      de op grond van [artikel 2.1, tweede lid][ref1], te overleggen gegevens niet, onvolledig, of niet juist zijn
      verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel2
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.2.2
    text: |-
      Het college weigert een registratie als bedoeld in [artikel 2.1, vijfde lid][ref1], indien de gevraagde registratie
      geen betrekking heeft op het aanbieden of afgeven van gekwalificeerde certificaten aan het publiek.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel2
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.2.3
    text: |-
      Het college kan de registratie van een certificatiedienstverlener weigeren indien de door hem op grond van
      [artikel 2.1, vijfde of zesde lid][ref1], te overleggen gegevens niet, onvolledig of niet juist zijn verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel2
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.2.4
    text: 'Het college beëindigt of wijzigt de registratie:'
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel2.2
  - number: 2.2.4.a
    text: indien de grond voor registratie is vervallen;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel2.2
  - number: 2.2.4.b
    text: |-
      indien een certificatiedienstverlener activiteiten of diensten verricht in strijd met het bepaalde bij of krachtens
      deze wet, of
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel2.2
  - number: 2.2.4.c
    text: |-
      indien het college heeft vastgesteld dat de certificatiedienstverlener niet of niet geheel voldoet aan de eisen
      bedoeld in [artikel 18.15, eerste en tweede lid][ref1], en de certificatiedienstverlener niet binnen de door
      het college gestelde termijn heeft aangetoond aan deze eisen te voldoen. Indien de certificatiedienstverlener
      aantoont redelijkerwijs niet binnen de gestelde termijn aan de eisen te kunnen voldoen, kan het college de termijn
      verlengen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel18
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '18'
        hoofdstuk: '18'
  - number: 2.3.1
    text: |-
      In het belang van de goede uitvoering van deze wet wordt door het college een register van de registraties
      bijgehouden. In het register worden in ieder geval de naam, het adres en de vestigingsplaats, respectievelijk de
      woonplaats van de geregistreerde vermeld.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel2.3
  - number: 2.3.2
    text: |-
      Het register ligt voor eenieder kosteloos ter inzage op een door het college te bepalen plaats. De gegevens uit het
      register zijn kosteloos op elektronische wijze te raadplegen.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel2.3
  - number: 2.3.3
    text: De geregistreerde geeft aan het college onverwijld alle wijzigingen door die van invloed zijn op de registratie.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel2.3
  - number: 2.3.4
    text: |-
      Het college brengt het register in overeenstemming met de wijzigingen die voortvloeien uit
      [artikel 2.2, vierde lid][ref1], of met de wijzigingen die het college op grond van het derde lid heeft ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel2
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.3.5
    text: |-
      Onverminderd het vierde lid, kan het college de gegevens met betrekking tot de registratie wijzigen indien dit
      noodzakelijk is om feitelijke onjuistheden van eenvoudige aard weg te nemen.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel2.3
  - number: 2.4.1
    text: |-
      Het college verstrekt zo spoedig mogelijk na de registratie, bedoeld in [artikel 2.1, vierde lid][ref1], aan
      de desbetreffende geregistreerde een schriftelijke verklaring waaruit blijkt dat de mededeling, bedoeld in
      [artikel 2.1, eerste lid][ref2], aan het college is gedaan. Bij de verklaring worden tevens vermeld de geldende
      wettelijke bepalingen inzake het medegebruik van antenne-opstelpunten, antennesystemen of antennes, de gedoogplicht
      voor de aanleg, instandhouding en opruiming van kabels, eind- tot eindverbindingen, alsmede toegang met betrekking
      tot aanbieders met aanmerkelijke marktmacht.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel2
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.4.2
    text: |-
      Het college verstrekt de verklaring, bedoeld in het eerste lid, in afwijking van dat lid, binnen een week na
      ontvangst van een daartoe strekkend schriftelijk verzoek van een geregistreerde als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel2.4
  - number: '2.5'
    text: |-
      Het college is verantwoordelijke in de zin van
      [artikel 1, onderdeel d, van de Wet bescherming persoonsgegevens][ref1] voor de gegevensverzameling, bedoeld in
      [artikel 2.1][ref2] en voor het register, bedoeld in [artikel 2.3][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel2
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '2'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0009950
        artikel: '2'
        hoofdstuk: '2'
  - number: 3.1.1
    text: |-
      Onze Minister stelt, in overeenstemming met het gevoelen van de ministerraad een frequentieplan vast, dat in ieder
      geval de verdeling van frequentieruimte over te onderscheiden bestemmingen alsmede over categorieën van gebruik
      bevat. Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld ten aanzien van de inrichting van
      het frequentieplan.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.1
  - number: 3.1.2
    text: |-
      Op de voorbereiding van het frequentieplan is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 3.2.1
    text: |-
      Door Onze Minister wordt een frequentieregister bijgehouden, dat een overzicht bevat van frequentieruimtes waarvoor
      krachtens dit hoofdstuk vergunningen zijn verleend, alsmede van de duur waarvoor deze vergunningen gelden.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.2
  - number: 3.2.2
    text: Het register ligt voor eenieder kosteloos ter inzage op een door Onze Minister te bepalen plaats.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.2
  - number: 3.3.1
    text: |-
      Voor het gebruik van frequentieruimte is een vergunning vereist van Onze Minister welke op aanvraag kan worden
      verleend.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.3
  - number: 3.3.2
    text: |-
      Vergunningen voor het gebruik van frequentieruimte ten behoeve van de uitvoering van vitale overheidstaken, van het
      verzorgen van taken op het terrein van de publieke omroep bedoeld in [artikel 1, onder t, van de Mediawet][ref1],
      of ter uitvoering van een wettelijk voorschrift worden bij voorrang verleend. Onverminderd het derde
      lid bepaalt Onze Minister, in overeenstemming met het gevoelen van de ministerraad, in hoeverre en in
      welke omvang vergunningen voor het gebruik van frequentieruimte anders dan voor de uitvoering van de in
      [artikel 13c, eerste lid, van de Mediawet][ref2], genoemde taak van de publieke omroep bij voorrang worden
      verleend. Bij regeling van Onze Minister, in overeenstemming met Onze Minister van Onderwijs, Cultuur
      en Wetenschappen, wordt bij de vaststelling van de omvang van de frequentieruimte die aan de publieke
      omroepinstellingen bij voorrang bij vergunning wordt verleend, bepaald welke technische eigenschappen de
      uitzendingen van de programma's van de publieke omroepinstellingen dienen te hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel13c
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: 13c
  - number: 3.3.3
    text: |-
      Bij het verlenen van vergunningen voor het gebruik van frequentieruimte op het terrein van de publieke omroep wordt
      het navolgende in acht genomen:
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.3
  - number: 3.3.3.a
    text: |-
      voor ieder programmanet als bedoeld in [artikel 40, eerste en derde lid van de Mediawet][ref1], wordt ten minste
      een vergunning verleend op zodanige wijze dat een landelijk bereik van het programma mogelijk is en rekening wordt
      gehouden met [artikel 16 van de Mediawet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel16
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '40'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: '16'
  - number: 3.3.3.b
    text: |-
      voor iedere provincie wordt ten minste één vergunning voor het gebruik van frequentieruimte verleend ten behoeve
      van de uitzending van het radioprogramma, bedoeld in [artikel 1, onder j, van de Mediawet][ref1], van de instelling
      die ten behoeve van de desbetreffende provincie zendtijd voor regionale omroep heeft verkregen, op zodanige wijze,
      dat een provinciaal bereik van het programma mogelijk is;


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel1
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '1'
  - number: 3.3.3.c
    text: |-
      indien in een provincie aan twee of meer regionale omroepinstellingen op grond van de [Mediawet][ref1] zendtijd
      is toegewezen, zal, onverminderd [artikel 3.6][ref2], aan elk van de omroepinstellingen vergunning voor het
      gebruik van frequentieruimte worden verleend voor een bereik dat ten minste gelijk is aan de onderscheidene
      verzorgingsgebieden, voorzover dit technisch mogelijk is;


      [ref1]: https://wetten.overheid.nl/BWBR0004149
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0004149
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.3.3.d
    text: |-
      aan iedere instelling die op grond van de [Mediawet][ref1] voor lokale omroep zendtijd heeft verkregen, zal,
      onverminderd [artikel 3.6][ref2], ten behoeve van de uitzending van haar radioprogramma vergunning voor het gebruik
      van frequentieruimte worden verleend voor een bereik dat ten minste gelijk is aan het verzorgingsgebied van het
      programma, voorzover dit technisch mogelijk is, en een doelmatig gebruik van het frequentiespectrum zich daartegen
      niet verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0004149
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0004149
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.3.4
    text: 'De verlening van vergunningen in andere gevallen dan bedoeld in het tweede lid geschiedt:'
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.3
  - number: 3.3.4.a
    text: op volgorde van binnenkomst van de aanvragen;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.3
  - number: 3.3.4.b
    text: door middel van een vergelijkende toets, al dan niet met inbegrip van een financieel bod, of
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.3
  - number: 3.3.4.c
    text: door middel van een veiling.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.3
  - number: 3.3.5
    text: |-
      De keuze voor toepassing van een van de procedures, bedoeld in het vierde lid, geschiedt door Onze Minister, met
      dien verstande dat voorzover het de verlening van vergunningen voor het gebruik van frequentieruimte door of ten
      behoeve van commerciële omroepinstellingen als bedoeld in [artikel 1, onder dd, van de Mediawet][ref1] betreft, de
      keuze geschiedt door Onze Minister in overeenstemming met Onze Minister van Onderwijs, Cultuur en Wetenschappen.
      Daarbij kan, met inachtneming van het frequentieplan, tevens nader de bestemming van de frequentieruimte worden
      bepaald waarop de keuze betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel1
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '1'
  - number: 3.3.6
    text: |-
      Voorzover de in het vijfde lid bedoelde keuze betrekking heeft op het al dan niet toepassen van het financiële
      bod bij de toepassing van de vergelijkende toets, geschiedt deze tevens in overeenstemming met Onze Minister van
      Financiën.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.3
  - number: 3.3.7
    text: |-
      Nadat op grond van een op basis van het vijfde en zesde lid gemaakte keuze een vergunning voor een bepaalde
      bestemming is verleend, wordt, zolang er in die bestemming nog houders van vergunningen voor het gebruik van
      frequentieruimte zijn, bij elke volgende uitgifte van frequentieruimte voor die bestemming een vergelijkbare
      procedure toegepast, tenzij dit ten gevolge van gewijzigde omstandigheden betreffende het gebruik van die
      frequentieruimte niet langer leidt tot een optimaal gebruik van frequentieruimte.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.3
  - number: 3.3.8
    text: |-
      De uitvoering van de procedure, bedoeld in het vierde lid, onder b, geschiedt indien het de verlening van
      vergunningen voor het gebruik van frequentieruimte door of ten behoeve van commerciële omroepinstellingen betreft,
      door Onze Minister van Onderwijs, Cultuur en Wetenschappen in overeenstemming met Onze Minister.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.3
  - number: 3.3.9
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden, met inachtneming van [richtlijn nr. 2002/20/EG](onbekend)
      (PbEG L 117), regels gesteld terzake van de verlening, wijziging en verlenging van vergunningen. Deze regels hebben
      in ieder geval betrekking op:
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.3
  - number: 3.3.9.a
    text: |-
      de eisen die, voorafgaande aan een van de procedures, bedoeld in het vierde lid, aan een aanvrager worden gesteld
      om in aanmerking te komen voor een vergunning,
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.3
  - number: 3.3.9.b
    text: de toepassing en uitvoering van de procedures, bedoeld in het vierde lid, en
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.3
  - number: 3.3.9.c
    text: de criteria die worden toegepast bij een vergelijkende toets als bedoeld in het vierde lid, onder b.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.3
  - number: 3.3.10
    text: |-
      Onze Minister kan besluiten dat een of meer aanbieders van openbare elektronische communicatienetwerken of openbare
      elektronische communicatiediensten worden uitgesloten van het verkrijgen van een vergunning voor het gebruik van
      bij dat besluit te bepalen frequentieruimte indien die vergunning wordt verleend volgens een procedure als bedoeld
      in het vierde lid, onder b, of onder c, met dien verstande dat dit slechts kan geschieden indien dat met het oog op
      de totstandbrenging of instandhouding van daadwerkelijke mededinging noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.3
  - number: 3.3.11
    text: |-
      De vergunning wordt verleend voor een bij die vergunning te bepalen termijn. De vergunning kan worden verlengd met
      een door Onze Minister te bepalen termijn.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.3
  - number: 3.3a.1
    text: |-
      Teneinde een optimaal gebruik van frequentieruimte te waarborgen kan, in overeenstemming met Onze Minister van
      Financiën, en waar het betreft het gebruik van frequentieruimte door commerciële omroepinstellingen mede in
      overeenstemming met Onze Minister van Onderwijs, Cultuur en Wetenschappen, met inachtneming van [richtlijn nr.
      2002/20/EG](onbekend), bij ministeriële regeling worden bepaald dat de verkrijger of houder van een vergunning, de
      houder van een vergunning van wie de vergunning wordt of is verlengd hieronder begrepen, anders dan een vergunning
      als bedoeld in [artikel 3.3, tweede lid][ref1], voor het gebruik van frequentieruimte voor een op grond van
      [artikel 3.3, vijfde lid][ref2], bepaalde bestemming een eenmalig of periodiek bedrag verschuldigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.3a
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.3a.2
    text: 'De hoogte van het te betalen bedrag is bij:'
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.3a
  - number: 3.3a.2.a
    text: |-
      een eenmalig bedrag gelijk aan een bij de in het eerste lid bedoelde ministeriële regeling vast te stellen bedrag
      gerelateerd aan de in het jaar van vergunningverlening bepaalde contante waarde van de gedurende de looptijd van
      de vergunning uit de exploitatie van de vergunning te verwachten voordelen, dan wel de gedurende de looptijd van de
      vergunning uit de exploitatie van de vergunning te verwachten omzet,
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.3a
  - number: 3.3a.2.b
    text: |-
      een periodiek bedrag gelijk aan een bij de in het eerste lid bedoelde ministeriële regeling te bepalen percentage
      van de in een boekjaar behaalde voordelen die, onder welke naam dan ook, worden verkregen uit de exploitatie van de
      toegekende vergunning, dan wel een bij de ministeriële regeling te bepalen percentage van de in een boekjaar aan de
      exploitatie van de vergunning toe te rekenen omzet.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.3a
  - number: 3.3a.3
    text: |-
      De in het eerste lid bedoelde ministeriële regeling kan nadere regels bevatten over de wijze waarop de in het
      tweede lid, onder a en b, bedoelde voordelen uit de exploitatie van de vergunning of de uit de exploitatie van de
      vergunning te verwachten omzet worden bepaald.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.3a
  - number: 3.3a.4
    text: |-
      De verplichting tot het betalen van een eenmalig of periodiek bedrag bestaat slechts indien de in het eerste lid
      bedoelde ministeriële regeling in werking is getreden voor het tijdstip dat in de aanvraagprocedure is vastgesteld
      als het tijdstip waarop de aanvraag voor de vergunning kan worden ingediend, dan wel, indien het een vergunning
      betreft die wordt verleend op de in [artikel 3.3, vierde lid, onder a][ref1], bedoelde wijze, in werking is
      getreden op het moment dat de aanvraag is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.3a
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.3a.5
    text: |-
      Bij een verlenging van een vergunning voor het gebruik van frequentieruimte kan, in afwijking van het vierde lid,
      in het geval de aanvraag tot verlenging wordt gedaan op een tijdstip waarop Onze Minister het voornemen heeft
      binnen dezelfde bestemming vergunningen te gaan verlenen door middel van een veiling dan wel een vergelijkende
      toets met een financieel bod, de verplichting tot het betalen van een eenmalig of periodiek bedrag ook bestaan
      indien de in het eerste lid bedoelde ministeriële regeling in werking is getreden op een tijdstip gelegen na het
      tijdstip waarop de aanvraag tot verlenging is gedaan, mits:
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.3a
  - number: 3.3a.5.a
    text: |-
      de aanvrager alvorens het besluit tot verlenging wordt genomen wordt gewezen op het bestaan van het bedoelde
      voornemen tot vergunningverlening,
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.3a
  - number: 3.3a.5.b
    text: |-
      het tijdstip van inwerkingtreding van bedoelde ministeriële regeling ligt binnen vier weken na de dag waarop de
      verlening van vergunningen ten gevolge van de veiling dan wel de vergelijkende toets, heeft plaatsgevonden, en
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.3a
  - number: 3.3a.5.c
    text: |-
      de verlening van vergunningen ten gevolge van de veiling dan wel de vergelijkende toets, heeft plaatsgevonden
      binnen een jaar nadat de vergunning is verlengd.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.3a
  - number: 3.3a.6
    text: |-
      In het geval bedoeld in het vijfde lid kan in de in het eerste lid bedoelde ministeriële regeling een onderscheid
      gemaakt worden tussen de houders van een vergunning voor het gebruik van frequentieruimte van wie de vergunning
      reeds een of meerdere malen is verlengd en de houders van een vergunning waarbij dit niet het geval is. Een
      dergelijk onderscheid kan slechts gemaakt worden indien dit nodig is om beide categorieën vergunninghouders voor
      wat betreft de op hen bij of krachtens deze wet voor het gebruik van de frequentieruimte rustende financiële
      verplichtingen in een vergelijkbare positie te brengen.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.3a
  - number: 3.3a.7
    text: |-
      Een verplichting tot betaling van een eenmalig of periodiek bedrag voortvloeiend uit een ministeriële regeling
      die, met gebruikmaking van het vijfde lid, inwerking treedt nadat de vergunning is verlengd bestaat niet indien de
      verlengde vergunning op verzoek wordt ingetrokken, mits het verzoek gedaan is binnen vier weken na inwerkingtreding
      van voornoemde ministeriële regeling.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.3a
  - number: 3.3a.8
    text: 'In het geval dat:'
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.3a
  - number: 3.3a.8.a
    text: |-
      op grond van het eerste lid bij ministeriële regeling is bepaald dat voor het gebruik van frequentieruimte met een
      op grond van [artikel 3.3, vijfde lid][ref1], bepaalde bestemming een eenmalig of periodiek bedrag verschuldigd is,
      zal, zolang er in die bestemming nog houders van vergunningen voor het gebruik van frequentieruimte zijn, houders
      van vergunningen van wie de vergunning is verlengd uitgezonderd, bij elke volgende uitgifte van frequentieruimte
      met die bestemming op een vergelijkbare wijze voor het gebruik van de frequentieruimte een bedrag verschuldigd
      zijn, tenzij dit ten gevolge van gewijzigde omstandigheden betreffende het gebruik van die frequentieruimte niet
      langer leidt tot een optimaal gebruik van frequentieruimte;


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.3a
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.3a.8.b
    text: |-
      voor het gebruik van frequentieruimte met een op grond van [artikel 3.3, vijfde lid][ref1], bepaalde
      bestemming geen gebruik wordt gemaakt van de in het eerste lid geboden mogelijkheid om voor het gebruik van die
      frequentieruimte een eenmalig of periodiek bedrag te vragen wordt, zolang er in die bestemming nog houders van
      vergunningen voor het gebruik van frequentieruimte zijn, houders van vergunningen van wie de vergunning is verlengd
      uitgezonderd, ook bij elke volgende uitgifte met die bestemming van die mogelijkheid geen gebruik gemaakt, tenzij
      dit ten gevolge van gewijzigde omstandigheden betreffende het gebruik van die frequentieruimte niet langer leidt
      tot een optimaal gebruik van frequentieruimte.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.3a
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.3a.9
    text: |-
      Bij de in het eerste lid bedoelde ministeriële regeling kan worden bepaald dat het bedrag verschuldigd uit hoofde
      van een veiling of een vergelijkende toets met de mogelijkheid tot een financieel bod, vermeerderd met een op grond
      van die regeling verschuldigd eenmalig of periodiek bedrag een bepaalde hoogte niet te boven zal gaan.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.3a
  - number: 3.3a.10
    text: |-
      In geval toepassing wordt gegeven aan het bepaalde in het negende lid en de verlening van een vergunning
      plaatsvindt door middel van een veiling, wordt, indien meer dan één geldig bod wordt uitgebracht dat bij verlening
      van de vergunning zou leiden tot financiële verplichtingen gelijk aan of groter dan de op grond van het negende lid
      bij ministeriële regeling bepaalde hoogte, het tot vergunningverlening leidende bod uit deze biedingen bepaald door
      middel van het lot.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.3a
  - number: 3.4.1
    text: |-
      In afwijking van [artikel 3.3][ref1] is geen vergunning vereist voor gebruik van in het frequentieplan aangewezen
      frequentieruimte die:


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.4.1.a
    text: |-
      al dan niet tezamen met bij ministeriële regeling aan te wijzen categorieën van radiozendapparaten voor een in het
      frequentieplan aangegeven bestemming door eenieder mag worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.4
  - number: 3.4.1.b
    text: |-
      tot gebruik strekt van door Onze Minister aan te wijzen overheidsorganen, belast met de zorg voor de veiligheid van
      de staat, de defensie alsmede de handhaving van de rechtsorde;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.4
  - number: 3.4.1.c
    text: voor een in het frequentieplan aangegeven bestemming vergunningvrij mag worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.4
  - number: 3.4.2
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.4
  - number: 3.4.2.a
    text: het gebruik van aangewezen frequentieruimte, bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.4
  - number: 3.4.2.b
    text: de aanwijzing bedoeld in het eerste lid, onderdeel a;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.4
  - number: 3.4.2.c
    text: eisen voor gebruikers van frequentieruimte;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.4
  - number: 3.4.2.d
    text: een meldings- en registratieplicht voor het gebruik van frequentieruimte als bedoeld in het eerste lid, onder c.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.4
  - number: 3.4a.1
    text: |-
      Indien vergunningen als bedoeld in [artikel 3.3, eerste lid][ref1], worden verleend volgens de procedure bedoeld in
      [artikel 3.3, vierde lid, onder b, of onder c][ref2], kan in het belang van een evenwichtige verdeling van schaarse
      frequentieruimte, voor bij ministeriële regeling aan te wijzen diensten, bij die regeling de maximale hoeveelheid
      frequentieruimte worden vastgesteld die een aanvrager bij verlening van bedoelde vergunningen kan verkrijgen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.4a
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.4a.2
    text: |-
      Indien een aanvrager een onderneming is die rechtstreeks of middellijk een dominerende invloed kan uitoefenen op
      een andere aanvrager worden zij als één aanvrager aangemerkt.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.4a
  - number: 3.4a.3
    text: |-
      Indien de andere aanvrager bedoeld in het tweede lid de rechtsvorm van een privaatrechtelijke rechtspersoon heeft,
      wordt dominerende invloed als bedoeld in het tweede lid vermoed te kunnen worden uitgeoefend wanneer de onderneming
      rechtstreeks of middellijk:
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.4a
  - number: 3.4a.3.a
    text: over de meerderheid van de stemrechten, verbonden aan de door de rechtspersoon uitgegeven aandelen beschikt, of
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.4a
  - number: 3.4a.3.b
    text: meer dan de helft van de leden van het bestuur of het toezichthoudend orgaan benoemt.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.4a
  - number: 3.4a.4
    text: |-
      Dit artikel blijft buiten toepassing als [artikel 82f van de Mediawet][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel82f
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.4a
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 82f
  - number: 3.5.1
    text: |-
      Een vergunning kan in het belang van een goede verdeling van frequentieruimte, alsmede in het belang van een
      ordelijk en doelmatig gebruik van frequentieruimte onder beperkingen worden verleend. In die belangen kunnen aan
      een vergunning voorschriften worden verbonden. Indien de frequentieruimte moet worden gebruikt voor het aanbieden
      van openbare elektronische communicatienetwerken of openbare elektronische communicatiediensten stelt Onze Minister
      het college in de gelegenheid hem advies uit te brengen ter zake van de omvang van de vergunning alsmede de
      beperkingen waaronder de vergunning wordt verleend en de voorschriften die aan de vergunning worden verbonden.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.5
  - number: 3.5.2
    text: |-
      Onverminderd het eerste lid kan bij een vergunning worden voorgeschreven dat de frequentieruimte waarop de
      vergunning ziet moet worden gebruikt voor de verzorging voor het publiek van bij de vergunning aan te wijzen
      diensten. In dat geval kunnen de in het eerste lid bedoelde beperkingen en voorschriften tevens zien op het belang
      van een goede dienstverlening.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.5
  - number: 3.5.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld terzake van de beperkingen waaronder
      een vergunning kan worden verleend en de voorschriften die op grond van het eerste of tweede lid aan een vergunning
      kunnen worden verbonden.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.5
  - number: 3.5.4
    text: |-
      In het geval frequentieruimte moet worden gebruikt voor de verzorging voor het publiek van diensten als bedoeld in
      het tweede lid, kunnen bij of krachtens algemene maatregel van bestuur in het belang van een goede dienstverlening
      regels worden gesteld voor aanbieders van die diensten.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.5
  - number: 3.6.1
    text: 'Een vergunning wordt door Onze Minister geweigerd indien:'
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.6
  - number: 3.6.1.a
    text: verlening daarvan in strijd is met het frequentieplan;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.6
  - number: 3.6.1.b
    text: een doelmatig gebruik van het frequentiespectrum dit vordert;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.6
  - number: 3.6.1.c
    text: |-
      reeds een vergunning voor het gebruik van de in de aanvraag gevraagde frequentieruimte is verleend, tenzij gedeeld
      gebruik van frequentieruimte mogelijk is;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.6
  - number: 3.6.1.d
    text: |-
      deze is gevraagd voor het verspreiden van programma’s, door een instelling die op grond van de [Mediawet][ref1]
      zendtijd heeft verkregen en de vergunning anders dan bij voorrang als bedoeld in [artikel 3.3, tweede lid][ref2],
      wordt verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0004149
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0004149
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.6.1.e
    text: |-
      feiten of omstandigheden er naar het oordeel van Onze Minister op duiden dat de veiligheid van de staat of de
      openbare orde door het verlenen van de vergunning in gevaar kan worden gebracht, of
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.6
  - number: 3.6.1.f
    text: |-
      verlening daarvan in strijd zou zijn met de bij of krachtens deze wet, dan wel bij of krachtens de
      [artikelen 82e][ref1] of [82f van de Mediawet][ref2], gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel82e
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel82f
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 82e
      - id: ref2
        bwb_id: BWBR0004149
        artikel: 82f
  - number: 3.6.2
    text: 'Een vergunning kan door Onze Minister worden geweigerd, indien:'
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.6
  - number: 3.6.2.a
    text: |-
      een eerder verleende vergunning is ingetrokken wegens overtreding van bij of krachtens deze wet gestelde regels dan
      wel van de aan de vergunning verbonden voorschriften;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.6
  - number: 3.6.2.b
    text: |-
      de aanvrager niet heeft voldaan aan op hem rustende verplichtingen, voortvloeiend uit een eerder aan hem verleende
      vergunning;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.6
  - number: 3.6.2.c
    text: de aanvraag of de aanvrager niet voldoet aan de daarvoor bij of krachtens deze wet gestelde regels, of
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.6
  - number: 3.6.2.d
    text: |-
      door het verlenen van de vergunning aan de aanvrager de daadwerkelijke mededinging op de relevante markt in
      aanzienlijke mate zou worden beperkt, met dien verstande dat naar redelijkheid rekening wordt gehouden met
      gerechtvaardigde belangen bij het gebruik van nieuwe technologie, of
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.6
  - number: 3.6.2.e
    text: |-
      de vrees is gewettigd dat door het verlenen van een vergunning ontoelaatbare belemmeringen worden veroorzaakt door
      het gewenste signaal van radiozendapparaten in andere radiozendapparaten, ontvanginrichtingen of elektrische of
      elektronische inrichtingen.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.6
  - number: 3.7.1
    text: 'Een vergunning wordt door Onze Minister ingetrokken indien:'
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.7
  - number: 3.7.1.a
    text: de houder van de vergunning hierom verzoekt;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.7
  - number: 3.7.1.b
    text: |-
      de naleving van een bindend besluit van een instelling van de Europese Unie of de nakoming van Nederland bindende
      verdragen en besluiten van volkenrechtelijke organisaties dit vordert.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.7
  - number: 3.7.2
    text: 'Een vergunning kan door Onze Minister voorts slechts worden ingetrokken indien:'
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.7
  - number: 3.7.2.a
    text: |-
      de houder van de vergunning niet meer voldoet aan de aan hem gestelde eisen om in aanmerking te komen voor een
      vergunning;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.7
  - number: 3.7.2.b
    text: |-
      de houder van de vergunning de bij of krachtens deze wet, dan wel bij of krachtens de [artikelen 82a][ref1],
      [82e][ref2], of [82f van de Mediawet][ref3] gestelde regels dan wel de aan de vergunning verbonden voorschriften
      niet nakomt;


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel82a
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel82e
      [ref3]: https://wetten.overheid.nl/BWBR0004149#Artikel82f
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 82a
      - id: ref2
        bwb_id: BWBR0004149
        artikel: 82e
      - id: ref3
        bwb_id: BWBR0004149
        artikel: 82f
  - number: 3.7.2.c
    text: een doelmatig gebruik van het frequentiespectrum dit vordert;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.7
  - number: 3.7.2.d
    text: |-
      de vrees gewettigd is dat het van kracht blijven van de vergunning ernstig gevaar zal opleveren voor de veiligheid
      van de staat of de openbare orde;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.7
  - number: 3.7.2.e
    text: de gronden waarop de vergunning is verleend zijn vervallen, of
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.7
  - number: 3.7.2.f
    text: |-
      de instandhouding van de vergunning de daadwerkelijke mededinging op de relevante markt in aanzienlijke mate zou
      beperken.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.7
  - number: 3.7.2.g
    text: |-
      de vergunning met toepassing van [artikel 3.4a][ref1] is verleend en de zeggenschap over het gebruik van de
      vergunning is overgegaan naar een andere vergunninghouder aan wie eveneens met toepassing van dat artikel een
      vergunning is verleend voor frequentieruimte met een zelfde bestemming, en daardoor de maximale hoeveelheid
      te verkrijgen frequentieruimte wordt overschreden en rekeninghoudend met de dan geldende omstandigheden
      een evenwichtige verdeling van schaarse frequentieruimte het in stand laten van de vergunning niet langer
      rechtvaardigt.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.7.3
    text: |-
      Op de gronden, genoemd in het tweede lid, kan Onze Minister in plaats van de vergunning intrekken deze ook
      wijzigen.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.7
  - number: 3.8.1
    text: |-
      Een vergunning kan op aanvraag van de houder van die vergunning geheel of gedeeltelijk aan een ander worden
      overgedragen met toestemming van Onze Minister onverminderd hetgeen is bepaald in het derde lid.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.8
  - number: 3.8.2
    text: |-
      De voorschriften en beperkingen die aan een geheel of gedeeltelijk over te dragen vergunning zijn verbonden kunnen
      met het oog op het waarborgen van bestaande belangen worden gewijzigd dan wel aangevuld met nieuwe voorschriften
      of beperkingen.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.8
  - number: 3.8.3
    text: |-
      De [artikelen 3.3, tiende lid][ref1], en [3.6][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.8.4
    text: |-
      Indien de toestemming betrekking heeft op de overdracht van een vergunning voor het gebruik van frequentieruimte
      die bestemd is voor het aanbieden van openbare elektronische communicatienetwerken of openbare elektronische
      communicatiediensten, doet Onze Minister mededeling in de Staatscourant van het besluit tot die toestemming, van
      het al dan niet gewijzigd zijn van de aan de vergunning verbonden voorschriften alsmede van het besluit nieuwe
      voorschriften aan de vergunning te verbinden.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.8
  - number: '3.9'
    text: |-
      In de gevallen waarin samenwerking tussen vergunninghouders van frequentieruimte noodzakelijk is voor het
      kunnen gebruiken van de aan hen toegewezen frequentieruimte, sluiten de betreffende vergunninghouders binnen een
      periode van ten hoogste zes weken na verlening van de vergunning een overeenkomst betreffende de voorwaarden tot
      gezamenlijk gebruik van dat deel van de frequentieruimte.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.9
  - number: 3.10.1
    text: |-
      Onze Minister kan, in overeenstemming met Onze Minister van Justitie, toestemming geven tot een gebruik van de
      frequentieruimte dat afwijkt van het bepaalde bij of krachtens dit hoofdstuk, wanneer dit noodzakelijk is ter
      beëindiging van strafbaar gedrag jegens een persoon.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.10
  - number: 3.10.2
    text: |-
      Onze Minister kan, in overeenstemming met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties
      onderscheidenlijk Onze Minister van Defensie, toestemming geven tot een gebruik van de frequentieruimte dat afwijkt
      van het bepaalde bij of krachtens dit hoofdstuk, wanneer dit noodzakelijk is ter uitvoering van de aan de Algemene
      Inlichtingen- en Veiligheidsdienst onderscheidenlijk Militaire Inlichtingen- en Veiligheidsdienst opgedragen taken
      in de [Wet op de inlichtingen- en veiligheidsdiensten 2002][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013409
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0013409
  - number: 3.10.3
    text: |-
      In overeenstemming met Onze Minister van Justitie onderscheidenlijk Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties of Onze Minister van Defensie, kan bij ministeriële regeling van het toestemmingsvereiste,
      bedoeld in het eerste of tweede lid, vrijstelling worden verleend onder bij die regeling te stellen voorschriften.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.10
  - number: 3.10.4
    text: |-
      In afwijking van het eerste lid is gebruik van frequentieruimte dat afwijkt van het bepaalde bij of krachtens
      dit hoofdstuk eveneens mogelijk wanneer dit nodig is teneinde toepassing te kunnen geven aan de strafvorderlijke
      bevoegdheden tot het onderzoek van telecommunicatie, mits:
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.10
  - number: 3.10.4.a
    text: |-
      dit gebruik plaatsvindt met behulp van apparatuur die voldoet aan bij algemene maatregel van bestuur te stellen
      eisen en door bij algemene maatregel van bestuur aan te wijzen ambtenaren;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.10
  - number: 3.10.4.b
    text: daartoe een last wordt verstrekt door een tot het onderzoek van telecommunicatie bevoegde autoriteit, en
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.10
  - number: 3.10.4.c
    text: |-
      dit plaatsvindt met het doel de gegevens, bedoeld in [artikel 13.4, eerste lid][ref1], onderscheidenlijk
      [artikel 13.4, tweede lid][ref2], te achterhalen en het door de aanbieder voldoen aan de vordering van deze
      gegevens onvoldoende het belang van de strafvordering dient.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel13
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '13'
        hoofdstuk: '13'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '13'
        hoofdstuk: '13'
  - number: 3.10.5
    text: |-
      De [Algemene wet bestuursrecht][ref1] is niet van toepassing op de voorbereiding, totstandkoming en
      tenuitvoerlegging van een besluit, genomen bij of krachtens het eerste tot en met derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: 3.11.1
    text: |-
      De houders van een vergunning voor het gebruik van frequentieruimte die bestemd is voor het aanbieden van openbare
      telecommunicatienetwerken of openbare telecommunicatiediensten, zijn over en weer verplicht te voldoen aan
      redelijke verzoeken tot het medegebruik van antenne-opstelpunten. Hierbij worden in ieder geval de technische
      mogelijkheden in acht genomen.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.11
  - number: 3.11.2
    text: |-
      In het geval dat voor het verlenen van medegebruik toestemming van een derde is vereist, is deze daartoe slechts
      gehouden indien het een redelijk verzoek betreft en hij:
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.11
  - number: 3.11.2.a
    text: |-
      direct of indirect een relevant economisch belang heeft in de houder, bedoeld in het eerste lid, tot wie het
      verzoek is gericht;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.11
  - number: 3.11.2.b
    text: |-
      deel uitmaakt van een groep als bedoeld in [artikel 24b van boek 2 van het Burgerlijk Wetboek][ref1] waartoe een
      andere groepsmaatschappij als bedoeld in dat artikel behoort, die een direct of indirect relevant economisch belang
      heeft in de houder van een vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.11
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
  - number: 3.11.3
    text: |-
      De houder, bedoeld in het eerste lid, en de derde die op grond van het tweede lid gehouden is toestemming te
      verlenen, stellen het medegebruik ter beschikking tegen een redelijke vergoeding.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.11
  - number: 3.11.4
    text: |-
      Aanbieders van elektronische communicatienetwerken die bestaan uit radiozendapparaten die geschikt zijn voor
      het verspreiden van programma’s, alsmede aanbieders van antenne-opstelpunten welke bestemd zijn om genoemde
      genoemde netwerken te ondersteunen, voldoen aan redelijke verzoeken tot medegebruik van antenne-opstelpunten,
      antennesystemen of antennes. Het tweede en derde lid zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.11
  - number: 3.12.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels gesteld worden met betrekking tot het bepaalde
      in [artikel 3.11][ref1]. Hierbij kunnen aan het college taken worden opgedragen en bevoegdheden worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.12
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 3.12.2
    text: 'De in het eerste lid bedoelde regels kunnen in ieder geval betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.12
  - number: 3.12.2.a
    text: |-
      de door degene, bedoeld in [artikel 3.11, eerste of vierde lid][ref1], te verstrekken informatie over de antenne-
      opstelpunten waarover zij beschikken;


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.12
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 3.12.2.b
    text: het reserveren van ruimte op antenne-opstelpunten voor eigen gebruik of voor medegebruik;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.12
  - number: 3.12.2.c
    text: |-
      de termijnen waarbinnen op een verzoek als bedoeld in [artikel 3.11, eerste lid][ref1], tot medegebruik van een
      antenne-opstelpunt moet worden beslist;


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.12
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 3.12.2.d
    text: |-
      de vergoeding, bedoeld in [artikel 3.11, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.12
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: '3.13'
    text: |-
      Onverminderd [artikel 3.12][ref1] is het college bevoegd om op eigen initiatief in concrete gevallen maatregelen
      te nemen die gericht zijn op de verwezenlijking van de in artikel 8, tweede, derde of vierde lid, van [richtlijn
      nr. 2002/21/EG](onbekend) genoemde doelstellingen. Op de voorbereiding van een besluit van het college en op het
      besluit van het college is de Algemene wet bestuursrecht van toepassing. Het college handelt bij gebruikmaking
      van zijn bevoegdheid als bedoeld in de eerste volzin, met inachtneming van bij ministeriële regeling te geven
      voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 4.1.1
    text: |-
      Onze Minister stelt, na overleg met het college, nummerplannen vast waarin in ieder geval de bestemming van de
      daarin opgenomen nummers wordt aangegeven. In een nummerplan kan worden bepaald dat eenzelfde nummer aan meerdere
      aanvragers kan worden toegekend.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.1
  - number: 4.1.2
    text: |-
      Op de voorbereiding van een nummerplan is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 4.1.3
    text: 'Het tweede lid is niet van toepassing indien het vast te stellen nummerplan slechts betrekking heeft op:'
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.1
  - number: 4.1.3.a
    text: |-
      het uitbreiden van nummercapaciteit, welke het gevolg is van een toewijzing van nummers aan Nederland door een
      internationale organisatie,
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.1
  - number: 4.1.3.b
    text: |-
      de implementatie van een besluit van het Europees Parlement en de Raad van de Europese Unie, van de Raad van de
      Europese Unie of van de Commissie van de Europese Gemeenschappen, of
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.1
  - number: 4.1.3.c
    text: |-
      overige wijzigingen die van ondergeschikte aard zijn en waarvan in het nummerplan is opgenomen dat op een
      dergelijke wijziging artikel 4.1, tweede lid, niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.1
  - number: 4.1.4
    text: |-
      Het is verboden voor een bestemming die voorkomt in een nummerplan andere nummers te gebruiken dan de nummers die
      in dat plan voor die bestemming zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.1
  - number: 4.1a
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld ter uitvoering van overeenkomstig artikel 19, tweede lid,
      van [richtlijn nr. 2002/21/EG](onbekend) vastgestelde technische uitvoeringsmaatregelen inzake de harmonisatie van
      nummervoorraden in de Europese Unie teneinde de ontwikkeling van pan-Europese diensten te ondersteunen.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.1a
  - number: 4.2.1
    text: |-
      Nummers die in een nummerplan of in een op grond van het vijfde lid vastgestelde aanwijzing zijn opgenomen kunnen
      op aanvraag door het college worden toegekend aan:
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.2
  - number: 4.2.1.a
    text: |-
      een aanbieder van een elektronisch communicatienetwerk ten behoeve van het verzorgen van elektronische
      communicatiediensten over zijn elektronisch communicatienetwerk;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.2
  - number: 4.2.1.b
    text: |-
      een aanbieder van een elektronische communicatiedienst ten behoeve van het verzorgen van zijn elektronische
      communicatiedienst, of
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.2
  - number: 4.2.1.c
    text: een natuurlijke persoon of rechtspersoon ten behoeve van het gebruik van een elektronische communicatiedienst.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.2
  - number: 4.2.2
    text: |-
      Een besluit over een aanvraag om toekenning van nummers wordt binnen drie weken na ontvangst van de aanvraag
      genomen en bekendgemaakt. Indien de aanvraag betrekking heeft op een nummer, waarvan in een nummerplan is
      vastgelegd dat dit wordt toegekend door middel van een procedure van veiling, wordt de termijn verlengd met drie
      weken.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.2
  - number: 4.2.3
    text: |-
      In het belang van een doelmatige toekenning van nummers kan bij ministeriële regeling worden bepaald dat nummers
      voor een bij die regeling aangewezen bestemming of categorie van gevallen, slechts kunnen worden toegekend aan één,
      onderscheidenlijk twee, van de in het eerste lid, onder a tot en met c, bedoelde categorieën van aanvragers.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.2
  - number: 4.2.4
    text: |-
      Een toekenning van nummers kan in het belang van een doelmatig gebruik van nummers onder beperkingen worden
      verleend. In dat belang kunnen aan een toekenning voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.2
  - number: 4.2.5
    text: |-
      Gedurende de voorbereiding van een nummerplan kan het college, in overeenstemming met door Onze Minister aan
      te wijzen bestemmingen en de daarbij behorende nummers, nummers toekennen gedurende een bij dat besluit vast te
      stellen termijn. Het verbod van [artikel 4.1, derde lid][ref1], is van overeenkomstige toepassing op de door Onze
      Minister aangewezen nummers.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel4
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.2.6
    text: |-
      Indien meer aanvragen met een gelijke voorkeur om toekenning van een bepaald nummer, dan wel bepaalde nummers
      op dezelfde dag bij het college ter behandeling zijn ingediend, besluit het college op die aanvragen door middel
      van het lot. Van deze procedure zijn uitgesloten nummers als bedoeld in het zevende lid en nummers als bedoeld
      in [artikel 4.2b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel4
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.2.7
    text: |-
      Nummers van uitzonderlijke economische waarde worden toegekend door middel van een procedure van veiling, indien
      dit met betrekking tot die nummers in een nummerplan is vastgelegd. De opbrengst van de veiling komt toe aan de
      Staat.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.2
  - number: 4.2.8
    text: 'In afwijking van het bepaalde in het zesde en het zevende lid kan het college:'
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.2
  - number: 4.2.8.a
    text: |-
      besluiten een nummer, niet zijnde een nummer van uitzonderlijke economische waarde, op de dag van aanvraag toe te
      kennen, mits de aanvrager geen specifiek nummer aanvraagt, en
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.2
  - number: 4.2.8.b
    text: |-
      in uitzonderlijke omstandigheden besluiten een nummer van uitzonderlijke economische waarde op de dag van aanvraag
      toe te kennen voor een door het college vast te stellen termijn die niet langer is dan drie maanden.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.2
  - number: 4.2.9
    text: |-
      Indien voor de toekenning van een nummer als bedoeld in het zevende lid slechts één aanvrager overeenkomstig de
      bij of krachtens deze wet gestelde regels in aanmerking komt, wordt aan deze aanvrager het nummer toegekend zonder
      toepassing van een veiling.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.2
  - number: 4.2.10
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de
      aanvraagprocedures van nummers als bedoeld in het zevende en achtste lid, met betrekking tot de veilingprocedure en
      met betrekking tot de lotingprocedure.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.2
  - number: 4.2.11
    text: |-
      Het is verboden nummers door Onze Minister aangewezen overeenkomstig het vijfde lid, alsmede nummers voorkomende
      in een nummerplan te gebruiken voor de in de aanwijzing onderscheidenlijk in een nummerplan opgenomen bestemming
      zonder of in afwijking van een toekenning.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.2
  - number: 4.2a.1
    text: |-
      Nummers die worden toegekend door middel van een procedure van veiling worden voor onbepaalde tijd toegekend,
      tenzij Onze Minister in het betreffende nummerplan een maximumduur van de toekenning heeft vastgelegd.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.2a
  - number: 4.2a.2
    text: |-
      Een nummer waarvoor een maximumduur is opgenomen in een nummerplan wordt niet eerder dan een jaar nadat de
      maximumtermijn van de toekenning is verstreken in gebruik genomen, indien het nummer door de daarop volgende
      toekenning van nummerhouder verandert.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.2a
  - number: 4.2b
    text: |-
      In de gevallen waarin samenwerking tussen nummerhouders noodzakelijk is voor het kunnen gebruiken van een nummer
      dat aan twee of meer nummerhouders is toegekend, sluiten de nummerhouders binnen een periode van ten hoogste zes
      weken nadat het nummer aan hen is toegekend een overeenkomst betreffende de voorwaarden tot gezamenlijk gebruik van
      dat nummer.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.2b
  - number: 4.3.1
    text: 'Een toekenning wordt geweigerd, indien:'
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.3
  - number: 4.3.1.a
    text: |-
      de aanvrager niet behoort tot een van de categorieën, genoemd in [artikel 4.2, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel4
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.3.1.b
    text: |-
      de toekenning in strijd is met het desbetreffende nummerplan of een op grond van [artikel 4.2, vijfde lid][ref1],
      vastgestelde aanwijzing;


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel4
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.3.1.c
    text: |-
      redelijkerwijs is te verwachten dat door de aanvrager niet zal of kan worden voldaan aan het bij of krachtens deze
      wet met betrekking tot nummers bepaalde;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.3
  - number: 4.3.1.e
    text: de toekenning in strijd zou zijn met de bij of krachtens deze wet gestelde regels.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.3
  - number: 4.3.2
    text: 'Een toekenning kan geheel of gedeeltelijk worden geweigerd, indien:'
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.3
  - number: 4.3.2.a
    text: |-
      op grond van de aanvraag redelijkerwijs niet is te verwachten dat het voorgenomen gebruik binnen een jaar, of
      binnen een bij ministeriële regeling voor bij die regeling aan te wijzen categorieën van nummers te bepalen kortere
      termijn, wordt verwezenlijkt;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.3
  - number: 4.3.2.b
    text: |-
      het in de aanvraag omschreven voorgenomen gebruik de toekenning van de gevraagde hoeveelheid nummers niet
      rechtvaardigt;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.3
  - number: 4.3.2.c
    text: |-
      het college eerder een aanvraag heeft geweigerd of een eerdere toekenning heeft opgeschort of ingetrokken op grond
      van [artikel 4.7, derde, vierde of vijfde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel4
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.3.2.d
    text: |-
      uit de aanvraag blijkt dat deze wordt gedaan met de kennelijke bedoeling de bij de aanvraag gevraagde nummers te
      verhandelen;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.3
  - number: 4.3.2.e
    text: het in de aanvraag omschreven voorgenomen gebruik de toekenning van de gevraagde nummers niet noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.3
  - number: 4.3.3
    text: |-
      Met betrekking tot bij ministeriële regeling aangewezen categorieën van nummers kan een toekenning geheel of
      gedeeltelijk worden geweigerd indien:
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.3
  - number: 4.3.3.a
    text: de aanvrager gevestigd is buiten de Europese Economische Ruimte;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.3
  - number: 4.3.3.b
    text: |-
      wordt voldaan aan de voorwaarden van
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '3'
  - number: 4.3.4
    text: |-
      Voordat toepassing wordt gegeven aan het derde lid, onderdeel b, kan het Bureau
      bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1], door het college om
      een advies als bedoeld in [artikel 9 van die wet][ref2] worden gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel9
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0013798
        artikel: '9'
  - number: 4.4.1
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald welke gedragingen van een nummergebruiker voor het college
      aanleiding kunnen zijn om:
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.4
  - number: 4.4.1.a
    text: de toekenning van een nummer te weigeren, op te schorten of in te trekken,
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.4
  - number: 4.4.1.b
    text: |-
      de aanbieder van een openbare elektronische communicatiedienst een aanwijzing te geven de betaling die gerelateerd
      is aan het betreffende nummer op te schorten overeenkomstig [artikel 7.3a][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel7
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '7'
        hoofdstuk: '7'
  - number: 4.4.1.c
    text: |-
      de aanbieder van een openbare elektronische communicatiedienst een aanwijzing te geven de aankiesbaarheid van het
      desbetreffende nummer op te schorten overeenkomstig [artikel 7.3b, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel7
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '7'
        hoofdstuk: '7'
  - number: 4.4.2
    text: De gedragingen hebben betrekking op het kennelijk misbruik maken van de tarifering van een nummer.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.4
  - number: 4.5.1
    text: Het college kan op aanvraag van de nummerhouder een toekenning wijzigen of intrekken.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.5
  - number: 4.5.2
    text: |-
      Op een aanvraag tot wijziging is [artikel 4.3][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel4
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '4'
        hoofdstuk: '4'
  - number: '4.6'
    text: |-
      Het college kan op gezamenlijke aanvraag van de desbetreffende nummerhouder en een derde toestaan dat de toekenning
      overgaat op de derde. [Artikel 4.2, vierde lid][ref1], en [artikel 4.3][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel4
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '4'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.7.1
    text: 'Een toekenning wordt door het college gewijzigd of ingetrokken, indien:'
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.7
  - number: 4.7.1.a
    text: |-
      een wijziging van het desbetreffende nummerplan daartoe noodzaakt, voor zover de nummerhouder aanspraak behoudt op
      toekenning van hetzelfde aantal nummers;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.7
  - number: 4.7.1.b
    text: de redenen die ten grondslag lagen aan de toekenning zijn vervallen;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.7
  - number: 4.7.1.c
    text: het doelmatig gebruik van nummers in het algemeen maatschappelijk en economisch belang dit vordert.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.7
  - number: 4.7.2
    text: |-
      Een toekenning wordt voorts door het college gewijzigd indien dit noodzakelijk is om feitelijke onjuistheden van
      eenvoudige aard weg te nemen.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.7
  - number: 4.7.3
    text: |-
      Een toekenning wordt voorts door het college ingetrokken op aanwijzing van Onze Minister in het belang van de
      veiligheid van de staat.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.7
  - number: 4.7.4
    text: |-
      Een toekenning kan door het college worden opgeschort voor een door het college te bepalen termijn of worden
      ingetrokken, indien:
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.7
  - number: 4.7.4.a
    text: |-
      de nummerhouder of de nummergebruiker de bij of krachtens deze wet gestelde regels of de aan het toekenningsbesluit
      verbonden voorschriften niet nakomt;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.7
  - number: 4.7.4.b
    text: na de toekenning blijkt dat de aanvraag is gedaan met de kennelijke bedoeling de toegekende nummers te verhandelen;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.7
  - number: 4.7.4.c
    text: de nummerhouder niet meer voldoet aan de voorwaarden om in aanmerking te komen voor toekenning van dat nummer.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.7
  - number: 4.7.5
    text: |-
      Met betrekking tot bij ministeriële regeling aangewezen categorieën van nummers kan een toekenning door het college
      worden opgeschort voor een door het college te bepalen termijn die niet langer duurt dan twee weken, indien het
      college een aanwijzing heeft dat de nummergebruiker de bij of krachtens deze wet gestelde regels niet nakomt of de
      aan het toekenningsbesluit verbonden voorschriften of een gedraging als bedoeld in [artikel 4.4][ref1] verricht.
      Het college kan de in de vorige volzin genoemde periode eenmalig met maximaal twee weken verlengen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel4
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.8.1
    text: |-
      In het belang van de goede uitvoering van de bij of krachtens de wet aan het college opgedragen taken
      en toegekende bevoegdheden wordt door het college een nummerregister bijgehouden dat een overzicht
      bevat van toekenningen. Het register bevat de vermelding van de naam van degene aan wie nummers zijn
      toegekend. Tevens wordt de duur van de toekenning vermeld. Het college is verantwoordelijke in de zin van
      [artikel 1, onderdeel d, van de Wet bescherming persoonsgegevens][ref1] voor het register.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel1
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.8
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '1'
  - number: 4.8.2
    text: |-
      Onverminderd het derde lid ligt het register voor eenieder kosteloos ter inzage op een door het college te bepalen
      plaats.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.8
  - number: 4.8.3
    text: |-
      Op verzoek van de nummerhouder wordt, indien het een natuurlijk persoon betreft en het nummer niet uitsluitend
      bedrijfsmatig wordt gebruikt, zijn naam, adres en woonplaats niet opgenomen in het deel van het register dat ter
      inzage ligt.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.8
  - number: 4.9.1
    text: |-
      Indien de nummerhouder de aan hem toegekende nummers in gebruik geeft aan een ander, doet hij dit op een niet-
      discriminerende en transparante wijze met gebruikmaking van objectieve criteria.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.9
  - number: 4.9.2
    text: |-
      De nummerhouder draagt er zorg voor dat het gebruik van de aan hem toegekende nummers in overeenstemming is met het
      bij of krachtens deze wet bepaalde.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.9
  - number: 4.9.3
    text: 'Met betrekking tot bij ministeriële regeling aangewezen categorieën van nummers:'
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.9
  - number: 4.9.3.a
    text: geeft de nummergebruiker een aan hem in gebruik gegeven nummer niet in gebruik aan een ander;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.9
  - number: 4.9.3.b
    text: |-
      registreert de nummerhouder de bij ministeriële regeling vastgestelde gegevens over de nummergebruiker en over het
      gebruik van het nummer.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.9
  - number: 4.10.1
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat een aanbieder van een bij die maatregel aan te wijzen
      categorie van openbare elektronische communicatiediensten verplicht is degene die op grond van een met hem gesloten
      overeenkomst die elektronische communicatiedienst afneemt:
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.10
  - number: 4.10.1.a
    text: |-
      de mogelijkheid te bieden het in het kader van de afgenomen elektronische communicatiedienst bij hem in gebruik
      zijnde nummer te blijven gebruiken na beëindiging van de levering van de dienst in het geval de beëindiging van de
      levering plaatsvindt ten gevolge van een rechtsgeldige beëindiging van de overeenkomst;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.10
  - number: 4.10.1.b
    text: |-
      de mogelijkheid te bieden het in het kader van de afgenomen elektronische communicatiedienst bij hem in gebruik
      zijnde nummer te blijven gebruiken indien hij binnen een bepaald gebied van adres verandert, of
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.10
  - number: 4.10.1.c
    text: |-
      de mogelijkheid te bieden het in het kader van de afgenomen elektronische communicatiedienst bij hem in
      gebruik zijnde nummer te blijven gebruiken indien hij er voor kiest een andere bij die maatregel aan te wijzen
      elektronische communicatiedienst af te nemen.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.10
  - number: 4.10.2
    text: |-
      Een aanbieder van krachtens het eerste lid aangewezen categorie van elektronische communicatiediensten op wie een
      verplichting als bedoeld in dat lid, onderdeel a, rust, is tevens verplicht aan degene met wie hij overeenkomt de
      desbetreffende elektronische communicatiedienst te leveren de mogelijkheid te bieden het voorheen in het kader van
      die dienst bij diegene in gebruik zijnde nummer te blijven gebruiken.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.10
  - number: 4.10.3
    text: 'Bij een verplichting opgelegd, krachtens het eerste lid, onderdeel a, gaat:'
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.10
  - number: 4.10.3.a
    text: |-
      in het geval het betreffende nummer is toegekend aan een aanbieder van een openbaar elektronisch
      communicatienetwerk en voor de betreffende openbare elektronische communicatiedienst voortaan het openbare
      elektronisch communicatienetwerk van een andere aanbieder wordt gebruikt, de toekenning van het betreffende nummer
      over op die andere aanbieder van dat netwerk;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.10
  - number: 4.10.3.b
    text: |-
      in het geval het betreffende nummer is toegekend aan de aanbieder van de betreffende openbare elektronische
      communicatiedienst, de toekenning van het betreffende nummer over op degene van wie de betreffende elektronische
      communicatiedienst voortaan wordt afgenomen.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.10
  - number: 4.10.4
    text: |-
      Het college kan categorieën van nummers aanwijzen waarvoor geldt dat, in het geval een nummer uit die categorie na
      een overgang op grond van het derde lid niet langer in gebruik is, de toekenning van het nummer teruggaat naar de
      aanbieder aan wie het nummer op basis van een aanvraag was toegekend.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.10
  - number: 4.10.5
    text: |-
      Een aanbieder die een nummer behorende tot een door het college op grond van het vierde lid aangewezen categorie
      niet heeft toegekend gekregen op grond van een aanvraag doet, indien hij het nummer niet langer in gebruik heeft,
      hiervan mededeling aan het college. Na ontvangst van de in de vorige zin bedoelde mededeling stelt het college de
      aanbieder naar wie de toekenning van het nummer op grond van het vierde lid is teruggegaan hiervan op de hoogte.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.10
  - number: 4.10.6
    text: |-
      De in het derde lid bedoelde aanbieders stellen het college binnen een door het college te bepalen termijn en op
      een door het college te bepalen wijze op de hoogte van de toekenningen van nummers die in een door het college
      te bepalen periode op grond van het derde lid van hen op andere aanbieders zijn overgegaan, alsmede van de
      toekenningen van nummers die op grond van het derde lid van andere aanbieders op hen zijn overgegaan. Het college
      maakt de door hem bepaalde termijn, wijze en periode, bedoeld in de eerste volzin, bekend in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.10
  - number: 4.10.7
    text: |-
      Een aanbieder van een openbaar elektronisch communicatienetwerk waarover een krachtens het eerste lid aangewezen
      categorie van openbare elektronische communicatiediensten wordt verzorgd:
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.10
  - number: 4.10.7.a
    text: |-
      zorgt ervoor dat zijn netwerk zodanig is ingericht dat een aanbieder van die dienst een krachtens het eerste lid
      opgelegde verplichting kan nakomen, en
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.10
  - number: 4.10.7.b
    text: |-
      stelt voor interconnectie verband houdende met een krachtens het eerste lid opgelegde verplichting een
      kostengeoriënteerd tarief vast.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.10
  - number: 4.10.8
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de doorberekening
      van kosten van een krachtens het eerste lid opgelegde verplichting aan eindgebruikers.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.10
  - number: 4.10.9
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot een krachtens het eerste lid
      opgelegde verplichting.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel4.10
  - number: '5.1'
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt onder een aanbieder van een openbaar elektronisch
      communicatienetwerk mede verstaan degene die in eigen naam en voor eigen rekening kabels ten dienste van een
      dergelijk netwerk aanlegt, instandhoudt en opruimt.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.1
  - number: 5.2.1
    text: |-
      De rechthebbende op of de beheerder van openbare gronden is verplicht te gedogen dat ten dienste van een openbaar
      elektronisch communicatienetwerk kabels in en op deze gronden worden aangelegd, instandgehouden of opgeruimd.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.2
  - number: 5.2.2
    text: |-
      Voor zover het de aanleg, instandhouding of opruiming van andere dan lokale kabels betreft strekt de gedoogplicht
      zich tevens uit tot niet-openbare gronden, uitgezonderd tuinen en erven die met bewoonde percelen één geheel
      vormen.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.2
  - number: 5.2.3
    text: |-
      Voor zover het voor het aansluiten van gebruikers op een openbaar elektronisch communicatienetwerk nodig is, strekt
      de gedoogplicht zich wat lokale kabels betreft tevens uit tot niet-openbare gronden, met inbegrip van tuinen en
      erven die met bewoonde percelen één geheel vormen.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.2
  - number: 5.2.4
    text: |-
      Voor zover het voor het aansluiten van gebruikers op een openbaar elektronisch communicatienetwerk nodig is, is
      bovendien de rechthebbende op een gebouw verplicht de aanleg, instandhouding of opruiming van netwerkaansluitpunten
      en kabels in en aan dit gebouw te gedogen.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.2
  - number: 5.2.5
    text: |-
      Indien ten behoeve van een andere toepassing dan elektronische communicatie bovengrondse ondersteuningswerken zijn
      of worden aangelegd waarmee ten behoeve van die toepassing bovengronds fysieke draden zijn of worden aangelegd,
      is de rechthebbende op of de beheerder van openbare of niet-openbare grond waarboven deze draden zijn of worden
      aangelegd, verplicht te gedogen dat met de uitsluitende gebruikmaking van deze bovengrondse ondersteuningswerken
      tevens kabels ten behoeve van een openbaar elektronisch communicatienetwerk boven de desbetreffende grond worden
      aangelegd, instandgehouden of opgeruimd. Voor de rechthebbende op of de beheerder van de genoemde bovengrondse
      ondersteuningswerken bestaat geen gedoogplicht voor het gebruik laten maken van deze werken.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.2
  - number: 5.2.6
    text: 'Door de aanleg, de instandhouding en de opruiming van kabels wordt:'
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.2
  - number: 5.2.6.a
    text: |-
      geen verandering teweeggebracht in de bestemming van hetgeen waarin, waarop, waarboven of waaraan de kabels zijn of
      worden aangelegd, en
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.2
  - number: 5.2.6.b
    text: |-
      zo min mogelijk verandering in de uiterlijke gedaante en zo min mogelijk belemmering in het gebruik ervan
      teweeggebracht.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.2
  - number: 5.2.7
    text: |-
      Op verzoek van degene op wie de gedoogplicht rust, maakt de aanbieder van een openbaar elektronisch
      communicatienetwerk ter uitvoering van het zesde lid, onder b, gebruik van ondergrondse voorzieningen, die door
      degene op wie de gedoogplicht rust of een derde tegen een marktconforme prijs ter beschikking wordt gesteld, tenzij
      de aanbieder ingeval [artikel 5.15][ref1] van toepassing is, aannemelijk kan maken dat medegebruik als bedoeld
      in [artikel 5.12][ref2] op technische of economische gronden niet haalbaar is. Bij algemene maatregel van bestuur
      kunnen aanvullende voorwaarden worden gesteld met betrekking tot de aanleg en vorm van aan te leggen netwerken
      ingeval van gebruik van voorzieningen als bedoeld in de eerste volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel5
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 5.2.8
    text: |-
      Aan de in het eerste tot en met het vijfde lid opgenomen verplichting om de instandhouding van kabels ten dienste
      van een openbaar elektronisch communicatienetwerk te gedogen komt een einde wanneer de aangelegde kabels gedurende
      een aaneengesloten periode van tien jaar geen deel uitmaken van een openbaar elektronisch communicatienetwerk. In
      dat geval is de aanbieder van een openbaar elektronisch communicatienetwerk verplicht op verzoek van degene op wie
      de gedoogplicht rustte de kabels op te ruimen.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.2
  - number: 5.2.9
    text: |-
      Het in of uit gebruik nemen van kabels ten dienste van een openbaar elektronisch communicatienetwerk wordt door de
      aanbieder van het desbetreffende netwerk schriftelijk gemeld aan degene op wie de gedoogplicht rust. De bewijslast
      voor de ingebruikneming ligt bij de aanbieder.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.2
  - number: 5.2.10
    text: |-
      Onverminderd dit artikel gelden de gegeven voorschriften bij of krachtens andere wetten terzake van het gebruik van
      deze gronden, gebouwen of wateren.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.2
  - number: 5.3.1
    text: |-
      De aanbieder van een openbaar elektronisch communicatienetwerk die het voornemen heeft werkzaamheden uit te
      voeren in verband met de aanleg, instandhouding of opruiming van kabels, stelt degene op wie de gedoogplicht rust
      schriftelijk in kennis van dit voornemen en streeft vervolgens naar overeenstemming over de plaats, het tijdstip en
      de wijze van uitvoering van de werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.3
  - number: 5.3.2
    text: |-
      Indien binnen vier weken na de datum van verzending van de schriftelijke kennisgeving geen overeenstemming is
      bereikt, geeft de aanbieder een tweede schriftelijke kennisgeving aan degene op wie de gedoogplicht rust waarin
      een omschrijving van de plaats, het tijdstip, dat niet eerder kan zijn gelegen dan drie weken na verzending van de
      tweede kennisgeving, en de wijze van de uit te voeren werkzaamheden wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.3
  - number: 5.3.3
    text: |-
      Indien degene op wie de gedoogplicht rust tegen deze tweede kennisgeving bedenkingen heeft, kan hij binnen twee
      weken na ontvangst daarvan het college verzoeken een beschikking te geven over de plaats, het tijdstip en de wijze
      van de uit te voeren werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.3
  - number: 5.3.4
    text: Het college geeft de beschikking binnen acht weken na ontvangst van het verzoek.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.3
  - number: 5.3.5
    text: Het verzoek schorst het recht op uitvoering van de werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.3
  - number: 5.3.6
    text: Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de schriftelijke kennisgeving.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.3
  - number: 5.4.1
    text: |-
      De aanbieder van een openbaar elektronisch communicatienetwerk die het voornemen heeft werkzaamheden uit te voeren
      in of op openbare gronden in verband met de aanleg, instandhouding of opruiming van kabels, gaat slechts over tot
      het verrichten van deze werkzaamheden indien deze:
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.4
  - number: 5.4.1.a
    text: |-
      het voornemen daartoe schriftelijk heeft gemeld bij burgemeester en wethouders van de gemeente binnen wier
      grondgebied de uit te voeren werkzaamheden plaats zullen vinden, en
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.4
  - number: 5.4.1.b
    text: |-
      van burgemeester en wethouders instemming heeft verkregen omtrent de plaats, het tijdstip, en de wijze van
      uitvoering van de werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.4
  - number: 5.4.2
    text: |-
      Burgemeester en wethouders kunnen om redenen van openbare orde, veiligheid, het voorkomen of beperken van overlast,
      de bereikbaarheid van gronden of gebouwen, dan wel ondergrondse ordening in het instemmingsbesluit voorschriften
      opnemen.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.4
  - number: 5.4.3
    text: 'De voorschriften kunnen slechts betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.4
  - number: 5.4.3.a
    text: de plaats van de werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.4
  - number: 5.4.3.b
    text: |-
      het tijdstip van de werkzaamheden, met dien verstande dat het toegestane tijdstip van aanvang, behoudens
      zwaarwichtige redenen van publiek belang als genoemd in het tweede lid, niet later mag liggen dan 12 maanden na de
      datum van afgifte van het instemmingsbesluit;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.4
  - number: 5.4.3.c
    text: de wijze van uitvoering van de werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.4
  - number: 5.4.3.d
    text: het bevorderen van medegebruik van voorzieningen;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.4
  - number: 5.4.3.e
    text: het afstemmen van de voorgenomen werkzaamheden met beheerders van overige in de grond aanwezige werken.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.4
  - number: 5.4.4
    text: |-
      De gemeenteraad stelt met betrekking tot het verrichten van de werkzaamheden bij verordening regels vast die in
      ieder geval betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.4
  - number: 5.4.4.a
    text: het tijdstip, voorafgaand aan het verrichten van de werkzaamheden, waarop de melding uiterlijk moet zijn gedaan;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.4
  - number: 5.4.4.b
    text: de gegevens die bij de melding moeten worden verstrekt, waaronder het uitvoeringsplan;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.4
  - number: 5.4.4.c
    text: de wijze van uitvoering van de werkzaamheden bij aanleg, instandhouding en opruiming;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.4
  - number: 5.4.4.d
    text: het bevorderen van medegebruik van voorzieningen;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.4
  - number: 5.4.4.e
    text: het afstemmen van de voorgenomen werkzaamheden met beheerders van overige in de grond aanwezige werken;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.4
  - number: 5.4.4.f
    text: de wijze van melding en uitvoering van spoedeisende werkzaamheden in verband
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.4
  - number: 5.4.5
    text: In de verordening wordt onderscheid gemaakt tussen werkzaamheden van al dan niet ingrijpende aard.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.4
  - number: 5.4.6
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de verordening.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.4
  - number: 5.4.7
    text: |-
      Indien een gemeente gedoogplichtig is, vindt [artikel 5.3][ref1] geen toepassing voor zover de belangen van de
      gemeente kunnen worden behartigd in het door burgemeester en wethouders te verlenen instemmingsbesluit.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel5
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.4
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 5.5.1
    text: |-
      Indien voor de aanleg, instandhouding of opruiming van kabels ten dienste van een openbaar elektronisch
      communicatienetwerk zowel een aanvraag voor een besluit als bedoeld in [artikel 5.4, eerste lid, onder b][ref1],
      bij burgemeester en wethouders van de gemeente binnen wiens grondgebied de uit te voeren werkzaamheden plaats
      zullen vinden, als een aanvraag voor een vergunning al dan niet bij een ander bestuursorgaan op grond van een
      andere wet is ingediend, dan stelt de aanvrager burgemeester en wethouders hiervan op de hoogte.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel5
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.5
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 5.5.2
    text: |-
      Burgemeester en wethouders van de desbetreffende gemeente bevorderen op verzoek van de aanvrager een inhoudelijke
      afstemming bij de beoordeling van de aanvragen. De overige betrokken bestuursorganen verlenen de daarvoor benodigde
      medewerking.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.5
  - number: 5.5.3
    text: |-
      [Artikel 5.4, zevende lid][ref1], is van overeenkomstige toepassing in het geval van vergunningverlening als
      bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel5
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.5
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 5.6.1
    text: |-
      In geval van spoedeisende werkzaamheden ten gevolge van een ernstige belemmering of storing van de communicatie is
      het bepaalde bij of krachtens de [artikelen 5.3][ref1] en [5.4, eerste tot en met vierde lid, onder e][ref2], niet
      van toepassing op de instandhouding van kabels ten dienste van een openbaar elektronisch communicatienetwerk en kan
      door de aanbieder van het openbaar elektronische communicatienetwerk worden volstaan met een melding voorafgaand
      aan de uit te voeren werkzaamheden aan degene op wie de gedoogplicht rust.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel5
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.6
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 5.6.2
    text: |-
      Ingeval de werkzaamheden in verband met de instandhouding van kabels worden verricht in of op openbare gronden,
      wordt hiervan door de aanbieder tevens voorafgaand aan de uit te voeren werkzaamheden melding gedaan bij de
      burgemeester van de gemeente binnen wiens grondgebied de werkzaamheden zullen plaatsvinden, of bij een daartoe
      door hem gemachtigd ambtenaar. Ingeval de melding bij de gemachtigde heeft plaatsgevonden stelt de gemachtigde de
      burgemeester zo spoedig mogelijk daarvan in kennis.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.6
  - number: 5.6.3
    text: |-
      Ingeval de openbare orde of gevaar dan wel de vrees voor het ontstaan van gevaar zich verzet tegen de uitvoering
      van de voorgenomen werkzaamheden kan de burgemeester besluiten dat de werkzaamheden op een ander dan het
      voorgenomen tijdstip plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.6
  - number: 5.6.4
    text: Het besluit wordt onverwijld na het tijdstip van ontvangst van de melding genomen.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.6
  - number: 5.6.5
    text: |-
      In de verordening, bedoeld in [artikel 5.4, vierde lid][ref1], kan de gemeenteraad om redenen van veiligheid delen
      van een grondgebied aanwijzen waarvoor dit artikel niet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel5
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.6
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 5.7.1
    text: |-
      De aanbieder van een openbaar elektronisch communicatienetwerk vergoedt aan degene op wie de gedoogplicht rust de
      schade voortvloeiend uit de aanleg, instandhouding of opruiming van kabels.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.7
  - number: 5.7.2
    text: |-
      Het recht op schadevergoeding beperkt zich voor rechthebbenden op en beheerders van openbare gronden tot vergoeding
      van de marktconforme kosten van de voorzieningen en van de meerdere marktconforme kosten van onderhoud.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.7
  - number: 5.7.3
    text: |-
      Na het beëindigen van de werkzaamheden in verband met de aanleg, instandhouding of opruiming van kabels brengt de
      aanbieder van een openbaar elektronisch communicatienetwerk de grond terug in de oude staat, tenzij degene op wie
      de gedoogplicht rust, heeft aangegeven hier zelf voor te willen zorgdragen. De aanbieder draagt de marktconforme
      kosten die nodig zijn voor het terugbrengen van de grond in de oude staat.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.7
  - number: 5.7.4
    text: |-
      Onder marktconforme kosten wordt in dit verband verstaan kosten zoals deze door een onderneming onder normale
      omstandigheden in een markteconomie op de desbetreffende markt worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.7
  - number: 5.8.1
    text: |-
      De aanbieder van een openbaar elektronisch communicatienetwerk is verplicht op verzoek van degene op wie de
      gedoogplicht rust op eigen kosten over te gaan tot het nemen van maatregelen ten aanzien van kabels ten dienste
      van zijn netwerk, waaronder het verplaatsen van kabels, voor zover deze noodzakelijk zijn voor de oprichting van
      gebouwen of de uitvoering van werken door of vanwege degene op wie de gedoogplicht rust.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.8
  - number: 5.8.2
    text: |-
      Indien degene op wie de gedoogplicht rust jegens een derde gehouden is grond, die door degene op wie de
      gedoogplicht rust is bestemd voor het oprichten van een of meer gebouwen, zodanig te leveren dat die derde na
      verkrijging van de grond bij het door of vanwege hem oprichten van een of meer gebouwen niet gehinderd wordt door
      de in de grond aanwezige kabels ten dienste van een openbaar elektronisch communicatienetwerk, is het eerste lid
      van overeenkomstige toepassing. De oprichting van een of meer gebouwen dient op het moment dat een verzoek wordt
      gedaan voldoende bepaalbaar te zijn.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.8
  - number: 5.8.3
    text: |-
      Indien de aanbieder kabels heeft verplaatst op grond van het eerste en tweede lid, en naderhand blijkt dat de door
      gedoogplichtige aangekondigde werkzaamheden, waarvoor deze verplaatsing nodig was, niet hebben plaatsgevonden,
      heeft de aanbieder recht op vergoeding van de door hem gemaakte kosten.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.8
  - number: 5.8.4
    text: |-
      Indien binnen vijf jaar na een verzoek tot het nemen van maatregelen op grond van het eerste of tweede lid opnieuw
      een verzoek wordt gedaan door degene op wie de gedoogplicht rust, komen de daarmee verbonden kosten voor rekening
      van degene op wie de gedoogplicht rust.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.8
  - number: 5.8.5
    text: |-
      In andere gevallen dan bedoeld in het eerste of tweede lid, is de aanbieder slechts verplicht over te gaan tot
      maatregelen, waaronder het verplaatsen van de kabels, indien degene op wie de gedoogplicht rust hem de kosten
      daarvan vergoedt.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.8
  - number: 5.8.6
    text: |-
      Ingeval een verzoek tot het nemen van maatregelen is gedaan, gaat de aanbieder zo snel mogelijk over tot de
      gevraagde maatregelen, doch niet later dan zestien weken na de datum van ontvangst van het verzoek. Indien het
      verzoek het verplaatsen van kabels betreft gaat de aanbieder zo snel mogelijk over tot de gevraagde verplaatsing,
      doch niet later dan twaalf weken nadat een plaats waar de kabels kunnen worden gelegd beschikbaar is gekomen.
      Het verzoek bevat een omschrijving van de op te richten gebouwen dan wel de uit te voeren werken en in geval het
      verzoek een verplaatsing van kabels betreft voor zover mogelijk een voorstel voor de plaats waar de kabels kunnen
      worden aangelegd.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.8
  - number: 5.8.7
    text: |-
      Bij gebrek aan overeenstemming over de vraag wie de kosten van de te nemen maatregelen dient te dragen, kan degene
      op wie de gedoogplicht rust dan wel de aanbieder het college verzoeken een beschikking te geven.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.8
  - number: 5.8.8
    text: Het college geeft de beschikking binnen acht weken na ontvangst van het verzoek.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.8
  - number: '5.10'
    text: |-
      De aanleg, instandhouding en opruiming van kabels ten dienste van een openbaar elektronisch communicatienetwerk
      geschiedt op zodanige wijze dat bomen en beplantingen zoveel mogelijk worden beschermd en de mogelijkheid tot groei
      niet wordt ontnomen.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.10
  - number: 5.11.1
    text: |-
      Rechthebbenden op bomen of beplantingen of de beheerders van de grond waarop de bomen of beplantingen zich bevinden
      zijn verplicht op schriftelijk verzoek van de aanbieder van een openbaar elektronisch communicatienetwerk binnen
      twee weken de wortels daarvan in te korten, voor zover deze redelijkerwijs hinderlijk zijn of worden voor de
      instandhouding van kabels ten dienste van het netwerk waardoor de exploitatie van het netwerk in gevaar komt.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.11
  - number: 5.11.2
    text: |-
      In geval van ernstige belemmering of storing van de communicatie kan een aanbieder van een openbaar elektronisch
      communicatienetwerk onmiddellijk tot het inkorten van wortels overgaan, waarna deze zo spoedig mogelijk
      hiervan schriftelijk aan de rechthebbende of beheerder kennis geeft, doch niet later dan de dag volgend op de
      werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.11
  - number: 5.11.3
    text: |-
      De aanbieder van een openbaar elektronisch communicatienetwerk vergoedt aan de rechthebbende of beheerder de schade
      voortvloeiend uit het inkorten van wortels.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.11
  - number: 5.12.1
    text: |-
      Aanbieders van openbare elektronische communicatienetwerken zijn over en weer verplicht te voldoen aan redelijke
      verzoeken tot het medegebruik van de voorzieningen waarop de gedoogplicht van toepassing is. Hierbij worden in
      ieder geval de technische mogelijkheden in acht genomen.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.12
  - number: 5.12.2
    text: |-
      In het geval dat voor het verlenen van medegebruik toestemming van een derde is vereist, is deze daartoe slechts
      gehouden indien het een redelijk verzoek betreft en hij:
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.12
  - number: 5.12.2.a
    text: |-
      direct of indirect een relevant economisch belang heeft in de aanbieder, bedoeld in het eerste lid, tot wie het
      verzoek is gericht;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.12
  - number: 5.12.2.b
    text: |-
      deel uitmaakt van een groep als bedoeld in [artikel 24b van boek 2 van het Burgerlijk Wetboek][ref1] waartoe een
      andere groepsmaatschappij als bedoeld in dat artikel behoort, die een direct of indirect relevant economisch belang
      heeft in de aanbieder.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.12
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
  - number: 5.12.3
    text: |-
      De aanbieder, bedoeld in het eerste lid, en de derde die op grond van het tweede lid gehouden is toestemming te
      verlenen, stellen het medegebruik ter beschikking tegen een redelijke vergoeding.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.12
  - number: 5.12.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels gesteld worden met betrekking tot het in het
      eerste lid bedoelde medegebruik van voorzieningen en de in het derde lid bedoelde vergoeding.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.12
  - number: 5.13.1
    text: |-
      De kantonrechter van de rechtbank van het arrondissement, waarin de onroerende zaak waarin, waarop of waarboven
      de kabels ten dienste van een openbaar elektronisch communicatienetwerk worden aangelegd, instandgehouden of
      opgeruimd, zich geheel of grotendeels bevindt, is, ongeacht de hoogte van de vordering, bevoegd geschillen inzake
      een eis tot schadevergoeding op grond van dit hoofdstuk te beslissen, alsmede geschillen inzake de hoogte van de
      kosten van het nemen van maatregelen, bedoeld in de [artikelen 5.8][ref1] en [5.9][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel5
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.13
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 5.13.2
    text: Van de uitspraak van de kantonrechter is hoger beroep toegelaten.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.13
  - number: 5.13.3
    text: |-
      De bepalingen van het [Wetboek van Burgerlijke Rechtsvordering][ref1] zijn van toepassing op de geschillen, bedoeld
      in het eerste lid, voor zover daarvan in de voorgaande leden van dit artikel niet is afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.13
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: 5.13.4
    text: |-
      Ook voordat omtrent de schadevergoeding of de hoogte van de kosten overeenstemming verkregen of uitspraak gedaan
      is, kan tot uitvoering van de werkzaamheden, bedoeld in de [artikelen 5.2][ref1], [5.8][ref2] en [5.11][ref3],
      worden overgegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel5
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.13
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
      - id: ref3
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 5.14.1
    text: |-
      Gemeenten bieden geen openbare elektronische communicatienetwerken of openbare elektronische communicatiediensten
      aan.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.14
  - number: 5.14.2
    text: |-
      Gemeenten hebben geen belang of zeggenschap in ondernemingen die openbare elektronische communicatienetwerken of
      openbare elektronische communicatiediensten aanbieden.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.14
  - number: 5.14.3
    text: |-
      In afwijking van het tweede lid kunnen gemeenten een minderheidsbelang – tenzij omstandigheden een groter belang
      rechtvaardigen – hebben in een onderneming die tot doel heeft een openbaar elektronisch communicatienetwerk aan te
      leggen, indien het aannemelijk is dat zonder de deelname van de gemeente een vergelijkbaar netwerk niet tot stand
      komt.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.14
  - number: 5.14.4
    text: |-
      Burgemeester en wethouders van een gemeente, die een belang heeft in een onderneming, die openbare elektronische
      netwerken aanbiedt, stellen ten minste een keer in de vijf jaar een rapport vast ter verantwoording van de
      beslissing om het belang te continueren of af te stoten. Zij stellen het college van de OPTA in de gelegenheid
      over het ontwerp van het rapport advies uit te brengen. Het rapport wordt bekend gemaakt met toepassing van
      [artikel 3:42 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.14
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 5.14.5
    text: |-
      Personen die besluiten voorbereiden als bedoeld in [artikel 5.4, eerste lid, onder b][ref1] zijn niet betrokken bij
      besluitvorming of activiteiten in samenhang met het derde lid of vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel5
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.14
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 5.14.6
    text: |-
      Het voornemen een belang te nemen als bedoeld in het derde lid, wordt bekendgemaakt.
      [Artikel 3:42 van de Algemene wet bestuursrecht][ref1] is van toepassing. Bij de bekendmaking van het voornemen
      wordt de omvang van het belang en de redengeving ervan vermeld. Tevens wordt bekendgemaakt waar en wanneer nadere
      informatie over het voornemen van de te nemen beslissing kan worden verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.14
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 5.14.7
    text: |-
      Bij de toepassing van [artikel 5.4, tweede lid][ref1], bevoordelen burgemeester en wethouders geen ondernemingen
      die openbare elektronische communicatienetwerken aanbieden waarin de gemeente een belang heeft, boven concurrerende
      ondernemingen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel5
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.14
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: '5.15'
    text: |-
      Dit hoofdstuk is van overeenkomstige toepassing op de aanleg, instandhouding en opruiming van ondergrondse
      ondersteuningswerken en beschermingswerken waarin of waarop geen fysieke geleidingsdraden bestemd voor de
      rechtstreekse overdracht van signalen tussen punten zijn aangebracht, en die aangelegd worden of zijn met het
      oogmerk deel uit te gaan maken van een openbaar elektronisch communicatienetwerk van degene in wiens naam wordt
      aangelegd of een derde.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.15
  - number: '5.16'
    text: |-
      Voor de toepassing van dit hoofdstuk, met uitzondering van [artikel 5.12][ref1], wordt gelijkgesteld met een
      openbaar elektronisch communicatienetwerk een door Onze Minister aangewezen elektronisch communicatienetwerk dat
      geheel of hoofdzakelijk gebruikt wordt voor vitale overheidstaken.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel5
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.16
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: '5.17'
    text: |-
      De [artikelen 17, eerste lid, onder k, van Boek 3 van het Burgerlijk Wetboek][ref1],
      [20, tweede lid, van Boek 5 van het Burgerlijk Wetboek][ref2], [36, vierde lid, Kadasterwet][ref3] en
      [78, derde en vierde lid][ref4], en [155 van de Overgangswet nieuw Burgerlijk Wetboek][ref5] zijn van
      overeenkomstige toepassing op ondergrondse ondersteuningswerken en beschermingswerken als bedoeld in
      [artikel 5.15][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0005288#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0004541#Artikel36
      [ref4]: https://wetten.overheid.nl/BWBR0002565#Artikel78
      [ref5]: https://wetten.overheid.nl/BWBR0002565#Artikel155
      [ref6]: https://wetten.overheid.nl/BWBR0009950#Artikel5
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel5.17
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0005288
        artikel: '20'
      - id: ref3
        bwb_id: BWBR0004541
        artikel: '36'
      - id: ref4
        bwb_id: BWBR0002565
        artikel: '78'
      - id: ref5
        bwb_id: BWBR0002565
        artikel: '155'
      - id: ref6
        bwb_id: BWBR0009950
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 6.1.1
    text: |-
      Een aanbieder van openbare elektronische communicatienetwerken of openbare elektronische communicatiediensten, die
      daarbij de toegang tot eindgebruikers controleert, treedt op verzoek van een aanbieder van openbare elektronische
      communicatienetwerken of openbare elektronische communicatiediensten met die aanbieder in onderhandeling met het
      oog op het sluiten van een overeenkomst op basis waarvan de nodige maatregelen worden genomen, waaronder zo nodig
      door middel van interconnectie van de betrokken netwerken, opdat eind- tot eindverbindingen tot stand worden
      gebracht.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6.1
  - number: 6.1.2
    text: |-
      Aanbieders van elektronische communicatienetwerken of aanbieders van elektronische communicatiediensten mogen
      informatie die voor of tijdens onderhandelingen over interoperabiliteitovereenkomsten aan hen is verstrekt,
      alsmede informatie die bij de uitvoering van de overeenkomst is of kan worden verkregen uitsluitend gebruiken voor
      het doel waarvoor deze informatie is verstrekt, respectievelijk uitsluitend gebruiken voor de uitvoering van de
      overeenkomst. De verkregen of opgeslagen informatie wordt vertrouwelijk behandeld en wordt niet doorgegeven aan
      enige andere partij, in het bijzonder andere afdelingen, dochterondernemingen of partners, die door die informatie
      concurrentievoordeel zouden kunnen behalen.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6.1
  - number: 6.1.3
    text: |-
      Het college kan op aanvraag van een aanbieder van openbare elektronische communicatienetwerken of openbare
      elektronische communicatiediensten die van mening is dat een andere aanbieder jegens hem de verplichting tot
      onderhandelen niet nakomt, voorschriften geven met betrekking tot de wijze waarop de onderhandelingen gevoerd
      moeten worden, onverminderd het recht van aanbieders gezamenlijk de onderhandelingen te beëindigen. De betrokken
      aanbieders houden zich bij hun onderhandelingen aan de door het college gegeven voorschriften.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6.1
  - number: 6.2.1
    text: |-
      Indien de onderhandelingen, bedoeld in [artikel 6.1][ref1], niet resulteren in een overeenkomst tussen de in
      [dat artikel][ref2] bedoelde aanbieders, kan het college op aanvraag van een van hen, voor zover naar het oordeel
      van het college verdere onderhandelingen redelijkerwijs niet meer zullen leiden tot een overeenkomst, de andere
      betrokken aanbieder, voor zover deze daarbij de toegang tot eindgebruikers controleert, verplichten de door de
      aanvrager gewenste eind- tot eindverbindingen tot stand te brengen en te waarborgen onder door het college te
      bepalen voorwaarden, indien het college van oordeel is dat de belangen van de andere aanbieder die ertoe geleid
      hebben dat er geen overeenkomst tot stand is gekomen redelijkerwijs niet opwegen tegen de belangen van de indiener
      van het verzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.2.2
    text: |-
      Het college kan voorts ambtshalve, al dan niet in het kader van een aanvraag als bedoeld in het eerste lid,
      aanbieders van openbare elektronische communicatienetwerken of openbare elektronische communicatiediensten,
      die daarbij de toegang tot eindgebruikers controleren, verplichtingen opleggen met betrekking tot het tot stand
      brengen en waarborgen van eind- tot eindverbindingen, indien dit in het voorliggende geval in het licht van de
      doelstellingen, bedoeld in [artikel 1.3][ref1] gerechtvaardigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel1
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '1'
        hoofdstuk: '1'
  - number: 6.2.3
    text: |-
      Van een besluit als bedoeld in het eerste of tweede lid wordt mededeling gedaan in de Staatscourant. Van gegevens
      als bedoeld in [artikel 10, eerste lid, onderdeel c, van de Wet openbaarheid van bestuur][ref1] wordt geen
      mededeling gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
  - number: 6.3.1
    text: |-
      Bij algemene maatregel van bestuur kunnen, indien dit in het licht van de doelstellingen, bedoeld in
      [artikel 1.3][ref1] gerechtvaardigd is, categorieën van openbare elektronische communicatiediensten worden
      aangewezen waarvan de aanbieders van de tot een aangewezen categorie behorende diensten en de aanbieders van de
      daarbij betrokken netwerken, voor zover zij de toegang tot eindgebruikers controleren, in Nederland eind- tot
      eindverbindingen tot stand moeten brengen en waarborgen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel1
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '1'
        hoofdstuk: '1'
  - number: 6.3.2
    text: |-
      Op verzoek van aanbieders die buiten Nederland elektronische communicatiediensten aanbieden die behoren tot een
      krachtens het eerste lid aangewezen categorie van diensten, nemen de aanbieders, bedoeld in het eerste lid, de
      nodige maatregelen voor het tot stand brengen en waarborgen van eind- tot eindverbindingen met betrekking tot de in
      het buitenland aangeboden diensten.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6.3
  - number: 6.3.3
    text: |-
      Indien het tot stand brengen van eind- tot eindverbindingen technisch niet uitvoerbaar dan wel economisch niet
      haalbaar is of anderszins het nemen van de vereiste maatregelen redelijkerwijs niet kan worden verlangd in
      het licht van de middelen die beschikbaar zijn, kan het college aan een aanbieder ontheffing verlenen van de
      verplichting, bedoeld in het eerste of tweede lid, tot het tot stand brengen en het waarborgen van eind- tot
      eindverbindingen.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6.3
  - number: 6.3.4
    text: |-
      Onverminderd het derde lid, treedt ter uitvoering van het eerste of, ingeval van een verzoek, tweede lid iedere
      daar bedoelde aanbieder met andere daar bedoelde aanbieders in onderhandeling om overeenkomsten te sluiten op basis
      waarvan maatregelen worden genomen opdat eind- tot eindverbindingen tot stand komen en zijn gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6.3
  - number: '6.4'
    text: |-
      Voorschriften als bedoeld in artikel 6.1, derde lid, of verplichtingen als bedoeld in artikel 6.2, eerste of tweede
      lid, zijn objectief, transparant, proportioneel en niet-discriminerend.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6.4
  - number: 6.5.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voor aanbieders van openbare telefoonnetwerken of openbare
      telefoondiensten regels gesteld:
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6.5
  - number: 6.5.1.a
    text: met betrekking tot het behandelen van oproepen van de Europese telefoonnummeringsruimte;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6.5
  - number: 6.5.1.b
    text: |-
      die er op gericht zijn dat zich in Nederland bevindende abonnees die gebruik maken van een door het college
      krachtens [artikel 4.2, eerste lid][ref1], toegekend niet-geografisch nummer op dit nummer kunnen worden opgeroepen
      door zich in andere lidstaten van de Europese Unie bevindende eindgebruikers;


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel4
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6.5
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '4'
        hoofdstuk: '4'
  - number: 6.5.1.c
    text: |-
      die er op gericht zijn dat zich in andere lidstaten van de Europese Unie bevindende abonnees die gebruik maken van
      een niet-geografisch nummer dat is toegekend door een nationale regelgevende instantie op dit nummer kunnen worden
      opgeroepen door zich in Nederland bevindende eindgebruikers.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6.5
  - number: 6.5.2
    text: |-
      Bij de regels, bedoeld in het eerste lid, kunnen taken worden opgedragen en bevoegdheden worden verleend aan het
      college.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6.5
  - number: '6.6'
    text: |-
      [Artikel 6.1, tweede lid][ref1], is van overeenkomstige toepassing op onderhandelingen tot het verkrijgen van
      toegang tot het netwerk van een aanbieder van elektronische communicatienetwerken.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6.6
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '6'
        hoofdstuk: '6'
  - number: 6a.1.1
    text: |-
      Het college bepaalt in overeenstemming met de beginselen van het algemene Europese mededingingsrecht de relevante
      markten in de elektronische communicatiesector waarvan de product- of dienstenmarkt overeenkomt met een in een
      aanbeveling als bedoeld in artikel 15, eerste lid, van [richtlijn nr. 2002/21/EG](onbekend) vermelde product- of
      dienstenmarkt. Het college bepaalt in elk geval zo spoedig mogelijk nadat een aanbeveling als bedoeld in de eerste
      volzin in werking is getreden, de in die volzin bedoelde relevante markten.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.1
  - number: 6a.1.2
    text: |-
      Het college bepaalt in overeenstemming met de beginselen van het algemene Europese mededingingsrecht andere dan de
      in het eerste lid bedoelde relevante markten in de elektronische communicatiesector indien hier naar zijn oordeel
      aanleiding toe is, of indien dit voortvloeit uit [artikel 6a.4][ref1] of uit artikel 27 van [richtlijn nr. 2002/21/
      EG](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.1
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
  - number: 6a.1.3
    text: Het college onderzoekt de overeenkomstig het eerste en tweede lid bepaalde relevante markten zo spoedig mogelijk.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.1
  - number: 6a.1.4
    text: |-
      Het college onderzoekt een transnationale markt zo spoedig mogelijk nadat een beschikking van de Commissie van de
      Europese Gemeenschappen die hieraan ten grondslag ligt in werking is getreden en vervolgens op gezette tijden.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.1
  - number: 6a.1.5
    text: 'Het in het derde en vierde lid bedoelde onderzoek is er in ieder geval op gericht om vast te stellen:'
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.1
  - number: 6a.1.5.a
    text: |-
      of de desbetreffende markt al dan niet daadwerkelijk concurrerend is en of hierop ondernemingen die openbare
      elektronische communicatienetwerken, bijbehorende faciliteiten of openbare elektronische communicatiediensten
      aanbieden actief zijn die beschikken over een aanmerkelijke marktmacht, en
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.1
  - number: 6a.1.5.b
    text: |-
      welke verplichtingen als bedoeld in de [artikelen 6a.6 tot en met 6a.10][ref1] en [6a.12 tot en met 6a.15][ref2]
      passend zijn voor de onder a bedoelde ondernemingen die beschikken over een aanmerkelijke marktmacht.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.1
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.2
      - id: ref2
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.3
  - number: 6a.1.6
    text: |-
      Nadat het onderzoek als bedoeld in het derde of vierde lid is afgerond, geeft het college zo spoedig mogelijk
      uitvoering aan de [artikelen 6a.2, eerste lid][ref1], of [6a.3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.1
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
      - id: ref2
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
  - number: 6a.1.7
    text: |-
      Het college houdt bij de uitoefening van zijn taken en bevoegdheden op grond van dit hoofdstuk rekening met door de
      Commissie van de Europese Gemeenschappen krachtens artikel 15, tweede lid, van [richtlijn nr. 2002/21/EG](onbekend)
      vastgestelde richtsnoeren.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.1
  - number: 6a.1.8
    text: |-
      Bij het beoordelen of twee of meer ondernemingen tezamen beschikken over een economische kracht als bedoeld
      in [artikel 1.1, onderdeel s][ref1], hanteert het college in elk geval de criteria bedoeld in bijlage II van
      [richtlijn nr. 2002/21/EG](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel1
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.1
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '1'
        hoofdstuk: '1'
  - number: 6a.1.9
    text: |-
      Het college oefent bij transnationale markten zijn taken en bevoegdheden op grond van dit hoofdstuk uit in
      samenspraak met de betrokken nationale regelgevende instanties.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.1
  - number: 6a.2.1
    text: |-
      Indien uit een onderzoek als bedoeld in [artikel 6a.1, derde of vierde lid][ref1], blijkt dat een relevante
      markt onderscheidenlijk een transnationale markt niet daadwerkelijk concurrerend is, stelt het college vast welke
      ondernemingen die openbare elektronische communicatienetwerken, bijbehorende faciliteiten of openbare elektronische
      communicatiediensten aanbieden, beschikken over een aanmerkelijke marktmacht, en:


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
  - number: 6a.2.1.a
    text: |-
      legt hij ieder van hen, voor zover passend, verplichtingen als bedoeld in de
      [artikelen 6a.6 tot en met 6a.10][ref1] of [6a.12 tot en met 6a.15][ref2] op;


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.2
      - id: ref2
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.3
  - number: 6a.2.1.b
    text: |-
      houdt hij eerder opgelegde of in stand gehouden verplichtingen, voor zover zij betrekking hebben op deze markt, in
      stand indien zij nog steeds passend zijn, of
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.2
  - number: 6a.2.1.c
    text: |-
      trekt hij eerder opgelegde of in stand gehouden verplichtingen, voor zover zij betrekking hebben op deze markt, in
      indien zij niet langer passend zijn.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.2
  - number: 6a.2.2
    text: 'Het college legt op grond van het eerste lid, onderdeel a:'
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.2
  - number: 6a.2.2.a
    text: |-
      verplichtingen als bedoeld in de [artikelen 6a.6 tot en met 6a.10][ref1] alleen op aan ondernemingen die openbare
      elektronische communicatienetwerken of bijbehorende faciliteiten aanbieden;


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.2
  - number: 6a.2.2.b
    text: |-
      verplichtingen als bedoeld in [artikel 6a.12 tot en met 6a.15][ref1] alleen op, indien de relevante markt
      onderscheidenlijk transnationale markt een eindgebruikersmarkt is en de verplichtingen, bedoeld in de
      [artikelen 6a.6 tot en met 6a.11][ref2] en [6a.17][ref3] ontoereikend zijn om daadwerkelijke concurrentie te
      verwezenlijken of de belangen van eindgebruikers te beschermen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.3
      - id: ref2
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.2
      - id: ref3
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.4
  - number: 6a.2.3
    text: |-
      Een verplichting als bedoeld in het eerste lid, is passend indien deze gebaseerd is op de aard van het op de
      desbetreffende markt geconstateerde probleem en in het licht van de doelstellingen van [artikel 1.3][ref1]
      proportioneel en gerechtvaardigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel1
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '1'
        hoofdstuk: '1'
  - number: 6a.2.4
    text: |-
      Bij de beoordeling of het opleggen van een verplichting om te voldoen aan redelijke verzoeken tot toegang als
      bedoeld in [artikel 6a.6][ref1] passend is, houdt het college met name rekening met de factoren, bedoeld in artikel
      12, tweede lid, van [richtlijn nr. 2002/19/EG](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.2
  - number: 6a.3.1
    text: |-
      Indien uit een onderzoek als bedoeld in [artikel 6a.1, derde of vierde lid][ref1], blijkt dat een relevante markt
      onderscheidenlijk een transnationale markt daadwerkelijk concurrerend is, bepaalt het college dit en trekt hij
      eerder krachtens [artikel 6a.2, eerste lid][ref2], opgelegde of in stand gehouden verplichtingen, voor zover zij
      betrekking hebben op die markt, in.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
      - id: ref2
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
  - number: 6a.3.2
    text: |-
      Indien uit een onderzoek als bedoeld in [artikel 6a.1, derde of vierde lid][ref1], blijkt dat een onderneming op
      een niet daadwerkelijk concurrerende relevante markt onderscheidenlijk transnationale markt moet voldoen aan eerder
      krachtens [artikel 6a.2, eerste lid][ref2], opgelegde of in stand gehouden verplichtingen, trekt het college deze
      verplichtingen, voor zover zij betrekking hebben op die markt, in, indien de onderneming op die relevante markt
      onderscheidenlijk transnationale markt niet beschikt over een aanmerkelijke marktmacht.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
      - id: ref2
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
  - number: 6a.3.3
    text: |-
      Indien uit een onderzoek als bedoeld in artikel 6a.1, derde of vierde lid, blijkt dat een relevante markt
      onderscheidenlijk transnationale markt niet daadwerkelijk concurrerend is en de verplichtingen, bedoeld in de
      artikelen 6a.6 tot en met 6a.11, toereikend zijn om daadwerkelijke concurrentie te verwezenlijken of de belangen
      van eindgebruikers te beschermen, trekt het college eerder krachtens artikel 6a.2, eerste lid, opgelegde of in
      stand gehouden verplichtingen als bedoeld in de artikelen 6a.12 tot en met 6a.15, voor zover zij betrekking hebben
      op die markt, in.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.3
  - number: 6a.4
    text: |-
      Uiterlijk binnen drie jaar nadat een besluit als bedoeld in artikel 6a.2, eerste lid, inzake het opleggen of in
      stand houden van verplichtingen met betrekking tot een onderneming die beschikt over een aanmerkelijke macht op een
      relevante markt in werking is getreden, besluit het college op grond van:
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.4
  - number: 6a.4.a
    text: artikel 6a.2, eerste lid, onderdeel b, om deze verplichtingen in stand te houden, of
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.4
  - number: 6a.4.b
    text: de artikelen 6a.2, eerste lid, onderdeel c, of 6a.3 om deze verplichtingen in te trekken.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.4
  - number: 6a.5
    text: |-
      Van een besluit als bedoeld in de [artikelen 6a.2, eerste lid][ref1], of [6a.3][ref2]
      wordt door het college mededeling gedaan in de Staatscourant. Van gegevens als bedoeld in
      [artikel 10, eerste lid, onderdeel c, van de Wet openbaarheid van bestuur][ref3] wordt geen mededeling gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref3]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.5
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
      - id: ref2
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
      - id: ref3
        bwb_id: BWBR0005252
        artikel: '10'
  - number: 6a.6.1
    text: |-
      Het college kan op grond van [artikel 6a.2, eerste lid][ref1], de verplichting opleggen om te voldoen aan redelijke
      verzoeken tot door het college te bepalen vormen van toegang, onder andere indien het college van oordeel is
      dat het weigeren van toegang of het stellen van onredelijke voorwaarden met eenzelfde effect, de ontwikkeling
      van een door duurzame concurrentie gekenmerkte eindgebruikersmarkt zou belemmeren of niet in het belang van de
      eindgebruiker zou zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.6
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
  - number: 6a.6.2
    text: 'De verplichting, bedoeld in het eerste lid, kan onder meer inhouden dat de desbetreffende onderneming:'
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.6
  - number: 6a.6.2.a
    text: |-
      aanbieders van elektronische communicatiediensten toegang verleent tot bepaalde netwerkelementen of faciliteiten,
      met inbegrip van ontbundelde toegang tot het aansluitnetwerk;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.6
  - number: 6a.6.2.b
    text: te goeder trouw onderhandelt met aanbieders van elektronische communicatiediensten die verzoeken om toegang;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.6
  - number: 6a.6.2.c
    text: reeds verleende toegang tot faciliteiten niet intrekt;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.6
  - number: 6a.6.2.d
    text: |-
      op groothandelsbasis bepaalde diensten aanbiedt voor wederverkoop door aanbieders van elektronische
      communicatiediensten;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.6
  - number: 6a.6.2.e
    text: |-
      open toegang verleent tot technische interfaces, protocollen of andere kerntechnologieën die onmisbaar zijn voor de
      interoperabiliteit van openbare elektronische communicatiediensten of virtuele netwerkdiensten;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.6
  - number: 6a.6.2.f
    text: |-
      co-locatie of andere vormen van gedeeld gebruik van faciliteiten aanbiedt, inclusief gedeeld gebruik van
      kabelgoten, gebouwen of masten;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.6
  - number: 6a.6.2.g
    text: |-
      bepaalde diensten aanbiedt die nodig zijn voor de interoperabiliteit van de aan gebruikers geleverde eind- tot
      einddiensten, inclusief faciliteiten voor intelligente netwerkdiensten of roaming binnen mobiele elektronische
      communicatienetwerken;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.6
  - number: 6a.6.2.h
    text: |-
      toegang verleent tot operationele ondersteuningssystemen of vergelijkbare softwaresystemen die nodig zijn om
      eerlijke concurrentie bij het aanbieden van elektronische communicatiediensten te waarborgen;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.6
  - number: 6a.6.2.i
    text: zorgt voor interconnectie van openbare elektronische communicatienetwerken of netwerkfaciliteiten.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.6
  - number: 6a.6.3
    text: |-
      Het college kan aan de verplichting, bedoeld in het eerste lid, voorschriften verbinden betreffende billijkheid,
      redelijkheid en opportuniteit.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.6
  - number: 6a.6.4
    text: |-
      Indien dit nodig is om de normale werking van het betrokken openbare elektronische communicatienetwerk te
      garanderen, kan het college technische of operationele voorschriften vaststellen die:
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.6
  - number: 6a.6.4.a
    text: |-
      een onderneming waarvoor een verplichting geldt als bedoeld in het eerste lid bij het verlenen van toegang in acht
      neemt, of
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.6
  - number: 6a.6.4.b
    text: een onderneming die toegang heeft gekregen op basis van een verzoek als bedoeld in het eerste lid, in acht neemt.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.6
  - number: 6a.6.5
    text: |-
      [Artikel 6.4][ref1] is van overeenkomstige toepassing met betrekking tot voorschriften als bedoeld in het vierde
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.6
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '6'
        hoofdstuk: '6'
  - number: 6a.6.6
    text: |-
      Voor zover dat op grond van de notificatierichtlijn noodzakelijk is, stelt het college de voorschriften niet vast
      dan nadat de voorschriften aan de Commissie van de Europese Gemeenschappen in ontwerp zijn medegedeeld en de van
      toepassing zijnde termijnen, bedoeld in artikel 9 van de notificatierichtlijn, zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.6
  - number: 6a.6.7
    text: |-
      Voor zover de voorschriften technische normen of specificaties bevatten, stroken deze met de normen, bedoeld in
      artikel 17, eerste of tweede lid, van [richtlijn nr. 2002/21/EG](onbekend).
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.6
  - number: 6a.7.1
    text: |-
      Het college kan op grond van [artikel 6a.2, eerste lid][ref1], voor door het college te bepalen vormen van toegang
      een verplichting opleggen betreffende het beheersen van de hiervoor te rekenen tarieven of kostentoerekening indien
      uit een marktanalyse blijkt dat de betrokken exploitant de prijzen door het ontbreken van werkelijke concurrentie
      op een buitensporig hoog peil kan handhaven of de marges kan uithollen, in beide gevallen ten nadele van de
      eindgebruikers. Aan de verplichting kunnen door het college voorschriften worden verbonden die nodig zijn voor een
      goede uitvoering van de verplichting.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.7
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
  - number: 6a.7.2
    text: |-
      Een verplichting als bedoeld in het eerste lid kan inhouden dat voor toegang een kostengeoriënteerd tarief moet
      worden gerekend of dat een door het college te bepalen of goed te keuren kostentoerekeningssysteem moet worden
      gehanteerd.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.7
  - number: 6a.7.3
    text: |-
      Indien het college een onderneming heeft verplicht om voor toegang een kostengeoriënteerd tarief te rekenen, toont
      de onderneming aan dat haar tarieven werkelijk kostengeoriënteerd zijn.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.7
  - number: 6a.7.4
    text: |-
      Onverminderd het eerste lid, tweede volzin, kan het college aan een verplichting tot het opstellen van een
      kostentoerekeningssysteem voorschriften verbinden met betrekking tot het overleggen van de resultaten van de
      toepassing van het systeem door de onderneming waarop de verplichting rust.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.7
  - number: 6a.7.5
    text: 'Indien een verplichting tot het opstellen van een kostentoerekeningssysteem is opgelegd:'
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.7
  - number: 6a.7.5.a
    text: |-
      maakt de desbetreffende onderneming, met inachtneming van de door het college gegeven voorschriften, op genoegzame
      wijze bekend een beschrijving van het systeem die ten minste de hoofdcategorieën bevat waarin de kosten worden
      ingedeeld en de voor de toerekening van de kosten toegepaste regels;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.7
  - number: 6a.7.5.b
    text: |-
      onderzoekt het college dan wel een door het college aan te wijzen onafhankelijke deskundige derde jaarlijks of er
      in overeenstemming met het systeem is gehandeld.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.7
  - number: 6a.7.6
    text: |-
      Van de resultaten van het onderzoek, bedoeld in het vijfde lid, onderdeel b, wordt mededeling gedaan in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.7
  - number: 6a.8
    text: |-
      Het college kan op grond van [artikel 6a.2, eerste lid][ref1], voor door het college te bepalen vormen van toegang
      de verplichting opleggen om deze toegang onder gelijke omstandigheden onder gelijke voorwaarden te verlenen.
      Deze verplichting houdt tevens in dat de onderneming gelijke voorwaarden toepast als die welke onder gelijke
      omstandigheden gelden voor haarzelf, haar dochterondernemingen of haar partnerondernemingen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.8
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
  - number: 6a.9.1
    text: |-
      Het college kan op grond [artikel 6a.2, eerste lid][ref1], de verplichting opleggen om door het college nader
      te bepalen informatie met betrekking tot door het college te bepalen vormen van toegang bekend te maken. Deze
      informatie kan onder meer betrekking hebben op:


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.9
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
  - number: 6a.9.1.a
    text: tarieven en andere voorwaarden die bij het verlenen van toegang worden gehanteerd;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.9
  - number: 6a.9.1.b
    text: technische kenmerken en andere eigenschappen van het netwerk.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.9
  - number: 6a.9.2
    text: |-
      Het college kan op grond van [artikel 6a.2, eerste lid][ref1], de verplichting opleggen om een referentieaanbod
      bekend te maken waarin een omschrijving is opgenomen van door het college te bepalen vormen van toegang. Het
      referentieaanbod is opgesplitst naar de onderscheiden vormen van toegang en de daarbij gehanteerde tarieven en
      andere voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.9
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
  - number: 6a.9.3
    text: |-
      Indien aan een onderneming waaraan een verplichting als bedoeld in het tweede lid is opgelegd tevens een
      verplichting is opgelegd als bedoeld in [artikel 6a.6][ref1] die betrekking heeft op ontbundelde toegang tot het
      aansluitnetwerk, voldoet het referentieaanbod van de onderneming in elk geval aan bijlage II van [richtlijn nr.
      2002/19/EG](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.9
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.2
  - number: 6a.9.4
    text: |-
      Indien het college van oordeel is dat het referentieaanbod niet in overeenstemming is met de op grond van dit
      hoofdstuk opgelegde verplichtingen, geeft het de onderneming aanwijzingen met betrekking tot de aan te brengen
      wijzigingen.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.9
  - number: 6a.9.5
    text: |-
      Aan een verplichting als bedoeld in het eerste en tweede lid kan het college voorschriften verbinden met betrekking
      tot de mate van detaillering en de wijze van bekendmaking.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.9
  - number: 6a.10.1
    text: |-
      Het college kan op grond van [artikel 6a.2, eerste lid][ref1], de verplichting opleggen om een gescheiden
      boekhouding te voeren waarin de opbrengsten en de kosten van de door het college te bepalen vormen van toegang,
      aan de onderneming zelf of aan andere ondernemingen, gescheiden zijn van die van de door de ondernemingen verrichte
      overige activiteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.10
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
  - number: 6a.10.2
    text: |-
      Aan de verplichting tot het voeren van een gescheiden boekhouding kan het college voorschriften verbinden met
      betrekking tot de methode van inrichting van de boekhouding en het aan het college verstrekken van boekhoudkundige
      documenten met inbegrip van gegevens over van derden ontvangen inkomsten.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.10
  - number: 6a.11.1
    text: |-
      In uitzonderlijke omstandigheden kan het college aan een onderneming waarvan door het college op grond van
      [artikel 6a.2, eerste lid][ref1], is vastgesteld dat zij beschikt over een aanmerkelijke marktmacht bij de
      aanbieding van openbare elektronische communicatienetwerken of bijbehorende faciliteiten, andere bij ministeriële
      regeling aan te wijzen verplichtingen die verband houden met toegang opleggen, voor zover deze passend zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.11
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
  - number: 6a.11.2
    text: |-
      Bij de ministeriële regeling, bedoeld in het eerste lid, kunnen regels worden gesteld met betrekking tot het
      opleggen door het college van bij die regeling aangewezen verplichtingen. Deze regels hebben in elk geval
      betrekking op:
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.11
  - number: 6a.11.2.a
    text: de omstandigheden die zich moeten voordoen alvorens deze verplichtingen kunnen worden opgelegd, en
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.11
  - number: 6a.11.2.b
    text: de aard van de verplichtingen.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.11
  - number: 6a.11.3
    text: 'Het college trekt een besluit als bedoeld in het eerste lid in, indien:'
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.11
  - number: 6a.11.3.a
    text: |-
      het op grond van [artikel 6a.3, eerste lid][ref1], heeft bepaald dat de desbetreffende relevante onderscheidenlijk
      transnationale markt daadwerkelijk concurrerend is;


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.11
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
  - number: 6a.11.3.b
    text: |-
      op grond [artikel 6a.3, tweede lid][ref1], is gebleken dat de onderneming als bedoeld in het eerste lid geen
      aanmerkelijke marktmacht meer heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.11
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
  - number: 6a.11.4
    text: 'Het college trekt een besluit als bedoeld in het eerste lid tevens in, indien:'
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.11
  - number: 6a.11.4.a
    text: er geen sprake van uitzonderlijke omstandigheden meer is, of
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.11
  - number: 6a.11.4.b
    text: de opgelegde of in stand gehouden verplichting niet langer passend is.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.11
  - number: 6a.11.5
    text: |-
      Uiterlijk binnen achttien maanden nadat een besluit als bedoeld in het eerste lid in werking is getreden,
      onderzoekt het college of er nog sprake is van uitzonderlijke omstandigheden en of de opgelegde of in stand
      gehouden verplichting nog passend is en besluit het college op grond van:
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.11
  - number: 6a.11.5.a
    text: het eerste lid om het besluit in stand te houden, of
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.11
  - number: 6a.11.5.b
    text: het vierde lid om het besluit in te trekken.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.11
  - number: 6a.11.6
    text: |-
      [Artikel 6a.2, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.11
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
  - number: 6a.12
    text: |-
      Het college kan op grond van [artikel 6a.2, eerste lid][ref1], de verplichting opleggen om:


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.12
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
  - number: 6a.12.a
    text: |-
      bij de levering van door het college te bepalen eindgebruikersdiensten, de eindgebruikers van die diensten in
      gelijke gevallen gelijk te behandelen;
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.12
  - number: 6a.12.b
    text: door het college te bepalen eindgebruikersdiensten te ontbundelen van andere diensten, en
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.12
  - number: 6a.12.c
    text: |-
      door het college te bepalen informatie aan door het college te bepalen categorieën van eindgebruikers op een door
      het college te bepalen wijze bekend te maken.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.12
  - number: 6a.13.1
    text: |-
      Het college kan op grond van [artikel 6a.2, eerste lid][ref1], verplichtingen met betrekking tot de hoogte van
      eindgebruikerstarieven opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.13
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
  - number: 6a.13.2
    text: |-
      Indien het college een verplichting als bedoeld in het eerste lid oplegt, legt het college op grond van
      [artikel 6a.2, eerste lid][ref1], tevens de verplichting op om een door het college te bepalen of goed te keuren
      kostentoerekeningssysteem te hanteren. Het college kan op grond van [artikel 6a.2, eerste lid][ref2], de in de
      vorige volzin bedoelde verplichting ook afzonderlijk van een verplichting als bedoeld in het eerste lid opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.13
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
      - id: ref2
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
  - number: 6a.13.3
    text: |-
      Een onderneming aan wie een verplichting als bedoeld in het tweede lid is opgelegd, legt vanaf een door het college
      te bepalen datum elk jaar in de maand mei, over het voorafgaande kalenderjaar het resultaat van de toepassing van
      het desbetreffende kostentoerekeningssysteem over aan het college.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.13
  - number: 6a.13.4
    text: |-
      Indien een verplichting als bedoeld in het tweede lid is opgelegd, onderzoekt het college of een door het college
      aan te wijzen onafhankelijke deskundige derde jaarlijks nadat het in het derde lid bedoelde resultaat is overgelegd
      of er in overeenstemming met het desbetreffende kostentoerekeningssysteem is gehandeld. Van het resultaat van het
      onderzoek wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.13
  - number: 6a.13.5
    text: |-
      Aan de verplichtingen, bedoeld in het eerste en tweede lid, kunnen door het college nadere voorschriften worden
      verbonden die nodig zijn voor een goede uitvoering van die verplichtingen.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.13
  - number: 6a.14.1
    text: |-
      Indien het college op grond van [artikel 6a.2, eerste lid][ref1], een verplichting als bedoeld
      in [artikel 6a.13, eerste lid][ref2], oplegt of in stand houdt, kan het college op grond van
      [artikel 6a.2, eerste lid][ref3], tevens de verplichting opleggen om invoering van nieuwe of gewijzigde
      eindgebruikerstarieven niet plaats te laten vinden dan nadat het college deze tarieven heeft goedgekeurd.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.14
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
      - id: ref2
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.3
      - id: ref3
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
  - number: 6a.14.2
    text: |-
      Het college beoordeelt binnen drie weken na ontvangst van een verzoek tot goedkeuring, of het nieuwe of gewijzigde
      eindgebruikerstarief in overeenstemming is met de opgelegde of in stand gehouden verplichting, bedoeld in
      [artikel 6a.13, eerste lid][ref1]. Indien gegevens als bedoeld in het zevende lid ontbreken wordt de onderneming
      die het verzoek heeft ingediend binnen drie dagen na ontvangst van het verzoek, hiervan op de hoogte gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.14
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.3
  - number: 6a.14.3
    text: |-
      Het college kan de termijn, bedoeld in het tweede lid, eerste volzin, eenmaal met drie weken verlengen. Het college
      doet hiervan schriftelijk mededeling aan de onderneming die het verzoek heeft ingediend.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.14
  - number: 6a.14.4
    text: |-
      Indien het college van oordeel is dat het nieuwe of gewijzigde eindgebruikerstarief in overeenstemming is met de
      opgelegde of in stand gehouden verplichting, bedoeld in [artikel 6a.13, eerste lid][ref1], keurt het college de
      invoering hiervan goed.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.14
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.3
  - number: 6a.14.5
    text: |-
      Indien het college van oordeel is dat het nieuwe of gewijzigde eindgebruikerstarief niet in overeenstemming is
      met de opgelegde of in stand gehouden verplichting, bedoeld in [artikel 6a.13, eerste lid][ref1], doet het college
      hiervan mededeling aan de onderneming die het verzoek heeft ingediend. Binnen vier weken na deze mededeling, deelt
      het college aan de in de eerste volzin bedoelde onderneming schriftelijk mede op welke punten niet voldaan is aan
      de in de eerste volzin bedoelde verplichting.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.14
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.3
  - number: 6a.14.6
    text: |-
      Het college beoordeelt een verzoek tot goedkeuring volgend op een schriftelijke mededeling als bedoeld in het
      vijfde lid, tweede volzin, binnen twee weken na ontvangst van dit verzoek.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.14
  - number: 6a.14.7
    text: |-
      Uiterlijk op het tijdstip waarop een besluit als bedoeld in [artikel 6a.2, eerste lid][ref1], houdende de oplegging
      of instandhouding van de verplichting om de invoering van nieuwe of gewijzigde eindgebruikerstarieven niet plaats
      te laten vinden dan nadat het college deze tarieven heeft goedgekeurd, in werking treedt, stelt het college vast
      welke gegevens door de desbetreffende onderneming bij een verzoek als bedoeld in het tweede lid overgelegd moeten
      worden, en in welke vorm deze gegevens worden ingediend. Het college doet hiervan mededeling aan de desbetreffende
      onderneming.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.14
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
  - number: 6a.15
    text: |-
      Ter uitvoering van artikel 17 van [richtlijn nr. 2002/22/EG](onbekend) kunnen bij algemene maatregel van bestuur
      andere verplichtingen dan de verplichtingen, bedoeld in de [artikelen 6a.12 tot en met 6a.14][ref1] worden
      aangewezen die het college op grond van [artikel 6a.2, eerste lid][ref2], kan opleggen aan ondernemingen die
      een aanmerkelijke marktmacht hebben op een relevante eindgebruikersmarkt onderscheidenlijk een transnationale
      eindgebruikersmarkt.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.15
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.3
      - id: ref2
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
  - number: 6a.16.1
    text: |-
      Een onderneming ten aanzien waarvan op grond van [artikel 6a.2, eerste lid][ref1], is vastgesteld dat zij op één
      relevante markt onderscheidenlijk transnationale markt of op meer relevante markten of transnationale markten
      tezamen, beschikt over een aanmerkelijke marktmacht bij de aanbieding van toegang tot en het gebruik van openbare
      telefoonnetwerken op een vaste locatie, wordt als zodanig aangewezen door het college.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.16
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
  - number: 6a.16.2
    text: |-
      Het college trekt een aanwijzing als bedoeld in het eerste lid in voor zover uit een onderzoek als bedoeld in
      [artikel 6a.1, derde of vierde lid][ref1], blijkt dat:


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.16
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
  - number: 6a.16.2.a
    text: |-
      een relevante markt of transnationale markt die betrekking heeft op de aanbieding van toegang tot en het gebruik
      van openbare telefoonnetwerken op een vaste locatie daadwerkelijk concurrerend is geworden, of
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.16
  - number: 6a.16.2.b
    text: |-
      de desbetreffende onderneming niet langer beschikt over een aanmerkelijke marktmacht bij de aanbieding van toegang
      tot en het gebruik van openbare telefoonnetwerken op een vaste locatie.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.16
  - number: 6a.16.3
    text: |-
      Van een besluit als bedoeld in het eerste of tweede lid wordt door het
      college mededeling gedaan in de Staatscourant. Van gegevens als bedoeld in
      [artikel 10, eerste lid, onderdeel c, van de Wet openbaarheid van bestuur][ref1] wordt geen mededeling gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.16
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
  - number: 6a.17.1
    text: |-
      Een onderneming die krachtens [artikel 6a.16, eerste lid][ref1], is aangewezen draagt, voor zover zij is
      aangewezen, er zorg voor dat voor haar abonnees de voorzieningen beschikbaar zijn die het hen mogelijk maken om
      per oproep door middel van een keuzecode of standaard door middel van een voorkeuze de diensten af te nemen van
      aanbieders die toegang hebben tot haar openbare telefoonnetwerk op een vaste locatie en de openbare telefoondienst,
      of een substantieel onderdeel daarvan, op een vaste locatie aanbieden.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.17
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.4
  - number: 6a.17.2
    text: |-
      De in het eerste lid bedoelde voorkeuze moet door de abonnee op individuele basis kunnen worden gewijzigd door
      middel van het kiezen van een daartoe bestemd nummer uit een door Onze Minister op grond van [artikel 4.1][ref1]
      vastgesteld nummerplan.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel4
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.17
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '4'
        hoofdstuk: '4'
  - number: 6a.17.3
    text: |-
      Het college kan een krachtens [artikel 6a.16, eerste lid][ref1], aangewezen onderneming voorschriften geven met
      betrekking tot de functionaliteit van de voorzieningen, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.17
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.4
  - number: 6a.17.4
    text: |-
      Een onderneming die krachtens [artikel 6a.16, eerste lid][ref1], is aangewezen voldoet, voor zover zij is
      aangewezen, aan redelijke verzoeken tot toegang tot haar openbare telefoonnetwerken op een vaste locatie van
      aanbieders die ten minste een substantieel onderdeel van de openbare telefoondienst op een vaste locatie door
      middel van de in het tweede lid bedoelde keuze of voorkeuze willen aanbieden. De tarieven voor de in de eerste
      volzin bedoelde toegang zijn op kosten georiënteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.17
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.4
  - number: 6a.17.5
    text: |-
      Teneinde te voorkomen dat de abonnees worden ontmoedigd in het gebruik van de in het eerste lid bedoelde
      voorzieningen kunnen bij ministeriële regeling regels worden gesteld met betrekking tot de maximale hoogte van het
      tarief dat voor deze voorzieningen door een krachtens [artikel 6a.16, eerste lid][ref1], aangewezen onderneming aan
      haar abonnees in rekening mag worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.17
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.4
  - number: 6a.18.1
    text: |-
      Een onderneming ten aanzien waarvan op grond van [artikel 6a.2, eerste lid][ref1], is vastgesteld dat zij op
      een relevante markt onderscheidenlijk een transnationale markt beschikt over een aanmerkelijke marktmacht bij
      de aanbieding van een type huurlijn uit het minimumpakket van huurlijnen wordt als zodanig aangewezen door het
      college.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.18
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
  - number: 6a.18.2
    text: |-
      Het college trekt een aanwijzing als bedoeld in het eerste lid in voor zover uit een onderzoek als bedoeld in
      [artikel 6a.1, derde of vierde lid][ref1], blijkt dat:


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.18
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
  - number: 6a.18.2.a
    text: |-
      een relevante markt of transnationale markt waartoe het desbetreffende type huurlijn uit het minimumpakket van
      huurlijnen deel uitmaakt daadwerkelijk concurrerend is geworden, of
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.18
  - number: 6a.18.2.b
    text: |-
      de desbetreffende onderneming niet langer beschikt over een aanmerkelijke marktmacht bij de aanbieding van het type
      huurlijn uit het minimumpakket van huurlijnen waarvoor zij is aangewezen.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.18
  - number: 6a.18.3
    text: |-
      Een aanwijzing als bedoeld in eerste lid vervalt op het tijdstip waarop het desbetreffende type huurlijn uit het
      minimumpakket van huurlijnen geen deel meer uitmaakt van het minimumpakket van huurlijnen.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.18
  - number: 6a.18.4
    text: |-
      Van een besluit als bedoeld in het eerste of tweede lid, wordt door het
      college mededeling gedaan in de Staatscourant. Van gegevens als bedoeld in
      [artikel 10, eerste lid, onderdeel c, van de Wet openbaarheid van bestuur][ref1] wordt geen mededeling gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.18
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
  - number: 6a.19.1
    text: |-
      Een onderneming die krachtens [artikel 6a.18, eerste lid][ref1], is aangewezen, levert op verzoek en binnen een
      redelijke termijn de typen huurlijnen uit het minimumpakket van huurlijnen waarvoor zij is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.19
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.5
  - number: 6a.19.2
    text: |-
      Bij ministeriële regeling worden ter uitvoering van bijlage VII van [richtlijn nr. 2002/22/EG](onbekend) regels
      gesteld ten aanzien van ondernemingen die krachtens [artikel 6a.18, eerste lid][ref1], zijn aangewezen. Daarbij
      kunnen aan het college taken worden opgedragen en bevoegdheden worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.19
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.5
  - number: 6a.20.1
    text: |-
      In dit artikel wordt verstaan onder openbare onderneming: onderneming waarop een krachtens het publiekrecht
      ingestelde rechtspersoon rechtstreeks of middellijk een dominerende invloed kan uitoefenen.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.20
  - number: 6a.20.2
    text: |-
      Indien een onderneming de rechtsvorm van een privaatrechtelijke rechtspersoon heeft, wordt dominerende invloed als
      bedoeld in het eerste lid vermoed te kunnen worden uitgeoefend, wanneer een krachtens het publiekrecht ingestelde
      rechtspersoon rechtstreeks of middellijk:
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.20
  - number: 6a.20.2.a
    text: over de meerderheid van de stemrechten, verbonden aan de door de rechtspersoon uitgegeven aandelen beschikt, of
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.20
  - number: 6a.20.2.b
    text: meer dan de helft van de leden van het bestuur of het toezichthoudend orgaan benoemt.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.20
  - number: 6a.20.3
    text: |-
      Een verticaal geïntegreerde openbare onderneming die elektronische communicatienetwerken aanbiedt en daarbij
      beschikt over een economische machtspositie op de gemeenschappelijke markt of op een wezenlijk onderdeel daarvan
      als bedoeld in artikel 82 van het EG-verdrag, verleent aan andere ondernemingen op hun verzoek onder gelijke
      voorwaarden toegang als die welke onder gelijke omstandigheden gelden voor haarzelf of haar dochterondernemingen.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.20
  - number: 6a.20.4
    text: |-
      De verplichting, bedoeld in het derde lid, blijft voor een verticaal geïntegreerde openbare onderneming buiten
      toepassing voor zover deze verplichting reeds voortvloeit uit een krachtens [artikel 6a.2, eerste lid][ref1], jo.
      [artikel 6a.8][ref2] door het college opgelegde of instandgehouden verplichting.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.20
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
      - id: ref2
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.2
  - number: 6a.21.1
    text: |-
      Het college bepaalt in overeenstemming met de beginselen van het algemene Europese mededingingsrecht relevante
      markten voor het aanbieden van programmadiensten waarvan de kenmerken zodanig zijn dat het opleggen van de in de
      [artikelen 6a.12][ref1], [6a.13, eerste en tweede lid][ref2], [6a.14, eerste lid][ref3], en [6a.22][ref4] bedoelde
      verplichtingen passend kan zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref4]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.21
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.3
      - id: ref2
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.3
      - id: ref3
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.3
      - id: ref4
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.7
  - number: 6a.21.2
    text: |-
      Het college onderzoekt de overeenkomstig het eerste lid bedoelde markten zo spoedig mogelijk. Het onderzoek is er
      in ieder geval op gericht om vast te stellen:
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.21
  - number: 6a.21.2.a
    text: |-
      of de desbetreffende markt al dan niet daadwerkelijk concurrerend is en of hierop ondernemingen die
      programmadiensten aanbieden actief zijn die beschikken over een aanmerkelijke marktmacht, en
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.21
  - number: 6a.21.2.b
    text: |-
      welke verplichtingen als bedoeld in de [artikelen 6a.12][ref1], [6a.13, eerste en tweede lid][ref2],
      [6a.14, eerste lid][ref3], en [6a.22][ref4] passend zijn voor de onder a bedoelde ondernemingen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref4]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.21
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.3
      - id: ref2
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.3
      - id: ref3
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.3
      - id: ref4
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.7
  - number: 6a.21.3
    text: |-
      Indien uit een onderzoek, bedoeld in tweede lid, blijkt dat een relevante markt niet daadwerkelijk concurrerend
      is, stelt het college vast welke ondernemingen die programmadiensten aanbieden, beschikken over een aanmerkelijke
      marktmacht, en:
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.21
  - number: 6a.21.3.a
    text: |-
      legt hij ieder van hen, voor zover passend, verplichtingen als bedoeld in de [artikelen 6a.12][ref1],
      [6a.13, eerste en tweede lid][ref2], [6a.14, eerste lid][ref3], en [6a.22][ref4] op;


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref4]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.21
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.3
      - id: ref2
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.3
      - id: ref3
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.3
      - id: ref4
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.7
  - number: 6a.21.3.b
    text: |-
      houdt hij eerder opgelegde verplichtingen, voor zover zij betrekking hebben op deze markt, in stand indien zij nog
      steeds passend zijn, of
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.21
  - number: 6a.21.3.c
    text: |-
      trekt hij eerder opgelegde verplichtingen, voor zover zij betrekking hebben op deze markt, in, indien zij niet
      langer passend zijn.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.21
  - number: 6a.21.4
    text: |-
      Voor de toepassing van dit artikel wordt onder «eindgebruiker», bedoeld in de
      [artikelen 6a.12 tot en met 6a.14][ref1], verstaan: een natuurlijk persoon of rechtspersoon die gebruik maakt of
      verzoekt om een programmadienst.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.21
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.3
  - number: 6a.21.5
    text: |-
      De [artikelen 6a.1, zesde, zevende en achtste lid][ref1], [6a.2, derde lid][ref2],
      [6a.3, eerste en tweede lid][ref3], [6a.4][ref4], [6a.5][ref5], [6a.13, derde, vierde en vijfde lid][ref6],
      [6a.14, tweede tot en met zevende lid][ref7], [6b.1][ref8], [6b.3][ref9] en [6b.6][ref10] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref4]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref5]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref6]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref7]: https://wetten.overheid.nl/BWBR0009950#Artikel6a
      [ref8]: https://wetten.overheid.nl/BWBR0009950#Artikel6b
      [ref9]: https://wetten.overheid.nl/BWBR0009950#Artikel6b
      [ref10]: https://wetten.overheid.nl/BWBR0009950#Artikel6b
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel6a.21
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 6a
        hoofdstuk: 6a
        paragraaf: 6a.1
      - id: ref2
