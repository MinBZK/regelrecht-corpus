  - number: 13.5.2
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de te nemen maatregelen in
      verband met de beveiliging, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel13.5
  - number: 13.6.1
    text: |-
      De investerings-, exploitatie- en onderhoudskosten voor de technische voorzieningen die door aanbieders van
      openbare telecommunicatienetwerken en openbare telecommunicatiediensten zijn of worden gemaakt teneinde te kunnen
      voldoen aan de [artikelen 13.1][ref1], [13.4][ref2], en [13.5][ref3] komen te hunnen laste.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel13
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel13.6
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '13'
        hoofdstuk: '13'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '13'
        hoofdstuk: '13'
      - id: ref3
        bwb_id: BWBR0009950
        artikel: '13'
        hoofdstuk: '13'
  - number: 13.6.2
    text: |-
      Aanbieders van openbare telecommunicatienetwerken en openbare telecommunicatiediensten hebben
      aanspraak op vergoeding uit 's Rijks kas van de door hen gemaakte administratiekosten en
      personeelskosten rechtstreeks voortvloeiend uit het voldoen aan een bijzondere last dan wel een
      toestemming op grond van de [Wet op de inlichtingen- en veiligheidsdiensten 2002][ref1] als bedoeld in
      [artikel 13.2, eerste en tweede lid][ref2], of [artikel 13.2a][ref3] dan wel een vordering of een verzoek als
      bedoeld in [artikel 13.2a][ref4], [artikel 13.2b][ref5] of [artikel 13.4, eerste of tweede lid][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0013409
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0009950#Artikel13
      [ref5]: https://wetten.overheid.nl/BWBR0009950#Artikel13
      [ref6]: https://wetten.overheid.nl/BWBR0009950#Artikel13
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel13.6
