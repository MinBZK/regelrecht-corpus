        artikel: '17'
        hoofdstuk: '17'
  - number: 20.1.1
    text: |-
      Behoudens de [artikelen 9.3][ref1] en [9.4][ref2] geldt, in afwijking van de in [artikel 9.2][ref3]
      vervatte procedure, voor de toepassing van het bij of krachtens deze wet bepaalde voor elk van de in
      [artikel 9.1, eerste lid][ref4], bedoelde openbare elektronische communicatiediensten of voorzieningen KPN Telecom
      B.V. als een krachtens [artikel 9.2][ref5] aangewezen aanbieder.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0009950#Artikel9
      [ref5]: https://wetten.overheid.nl/BWBR0009950#Artikel9
    url: https://wetten.overheid.nl/BWBR0009950/2008-10-15#Artikel20.1
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '9'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '9'
        hoofdstuk: '9'
      - id: ref3
        bwb_id: BWBR0009950
        artikel: '9'
