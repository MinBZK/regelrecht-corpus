regulatory_layer: WET
publication_date: '2023-12-15'
valid_from: '2024-01-01'
bwb_id: BWBR0049114
url: https://wetten.overheid.nl/BWBR0049114/2024-01-01
preamble:
  text: 'Besluit:'
  url: https://wetten.overheid.nl/BWBR0049114/2024-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0049114/2024-01-01#Artikel1
  - number: 1.a)
    text: |-
      *Minister:* Minister voor Armoedebeleid, Participatie en Pensioenen dan wel de Minister die pensioenen in
      portefeuille heeft;
    url: https://wetten.overheid.nl/BWBR0049114/2024-01-01#Artikel1
  - number: 1.b)
    text: '*regeringscommissaris:* Regeringscommissaris transitie pensioenen;'
    url: https://wetten.overheid.nl/BWBR0049114/2024-01-01#Artikel1
  - number: 1.c)
    text: |-
      *Transitie naar het nieuwe pensioenstelsel:* de wijziging van pensioenovereenkomsten met als doel om te
      voldoen aan het nieuwe kader zoals geïntroduceerd met en conform de vereisten die gelden op grond van de
      [Wet toekomst pensioenen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0048328
    url: https://wetten.overheid.nl/BWBR0049114/2024-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0048328
  - number: '2.1'
    text: Er is een regeringscommissaris transitie pensioenen.
    url: https://wetten.overheid.nl/BWBR0049114/2024-01-01#Artikel2
  - number: '2.2'
    text: |-
      De regeringscommissaris is onder verantwoordelijkheid van de Minister belast met het beoordelen en bevorderen van
      het verloop van de transitie naar het nieuwe pensioenstelsel.
    url: https://wetten.overheid.nl/BWBR0049114/2024-01-01#Artikel2
  - number: '2.3'
    text: De regeringscommissaris zal in elk geval twee keer per jaar advies aan de Minister uitbrengen.
    url: https://wetten.overheid.nl/BWBR0049114/2024-01-01#Artikel2
  - number: '3'
    text: 'De regeringscommissaris transitie pensioenen heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0049114/2024-01-01#Artikel3
  - number: 3.a
    text: |-
      De regeringscommissaris volgt de voortgang van de transitie naar het nieuwe pensioenstelsel en signaleert eventuele
      knelpunten.
    url: https://wetten.overheid.nl/BWBR0049114/2024-01-01#Artikel3
  - number: 3.b
    text: |-
      De regeringscommissaris adviseert de Minister gevraagd en ongevraagd over mogelijke maatregelen om eventuele
      knelpunten in de transitie weg te nemen.
    url: https://wetten.overheid.nl/BWBR0049114/2024-01-01#Artikel3
  - number: 3.c
    text: |-
      De regeringscommissaris bevordert dat bij de transitie betrokken partijen hun verantwoordelijkheid nemen voor
      het tijdig en zorgvuldig doorlopen van de transitie. De regeringscommissaris heeft hiertoe een signalerende en
      adviserende bevoegdheid. De regeringscommissaris zorgt ervoor dat signalen over eventuele knelpunten laagdrempelig
      worden gedeeld. De regeringscommissaris heeft geen toezichthoudende bevoegdheid.
    url: https://wetten.overheid.nl/BWBR0049114/2024-01-01#Artikel3
  - number: 3.d
    text: |-
      De regeringscommissaris stimuleert dat goede voorbeelden die bevorderlijk zijn voor het verloop van de transitie
      worden gedeeld, met in achtneming van de wettelijke kaders.
    url: https://wetten.overheid.nl/BWBR0049114/2024-01-01#Artikel3
  - number: '4.1'
    text: |-
      De regeringscommissaris wordt door het Ministerie van Sociale Zaken en Werkgelegenheid voorzien van ondersteuning
      voor de werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0049114/2024-01-01#Artikel4
  - number: '4.2'
    text: |-
      De regeringscommissaris maakt waar mogelijk gebruik van de faciliteiten van het Ministerie van Sociale Zaken en
      Werkgelegenheid.
    url: https://wetten.overheid.nl/BWBR0049114/2024-01-01#Artikel4
  - number: '4.3'
    text: |-
      De archiefbescheiden van de regeringscommissaris en het bijbehorende bureau worden na beëindiging van de
      werkzaamheden van de regeringscommissaris overgebracht naar het archief van het Ministerie van Sociale Zaken en
      Werkgelegenheid.
    url: https://wetten.overheid.nl/BWBR0049114/2024-01-01#Artikel4
  - number: '5.1'
    text: |-
      Dit besluit treedt in werking met ingang van 1 januari 2024. Indien de Staatscourant waarin dit besluit wordt
      geplaatst, wordt uitgegeven na 1 januari 2024, treedt het in werking met ingang van de dag na de datum van uitgifte
      van de Staatscourant waarin het wordt geplaatst, en werkt het terug tot en met 1 januari 2024.
    url: https://wetten.overheid.nl/BWBR0049114/2024-01-01#Artikel5
  - number: '5.2'
    text: Dit besluit vervalt op een door de Minister te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0049114/2024-01-01#Artikel5
  - number: '6'
    text: 'Dit besluit wordt aangehaald als: Instellingsbesluit regeringscommissaris transitie pensioenen.'
    url: https://wetten.overheid.nl/BWBR0049114/2024-01-01#Artikel6
