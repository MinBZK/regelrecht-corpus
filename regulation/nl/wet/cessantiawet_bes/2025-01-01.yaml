  - number: '14'
    text: |-
      1 Hij die opzettelijk inlichtingen als bedoeld in [artikel 11][ref1] onjuist verstrekt, dan wel een valse
      verklaring aan Onze Minister aflegt, wordt gestraft met gevangenisstraf van ten hoogste een jaar of geldboete van
      de derde categorie.

      2 Overtreding van [artikel 10, derde lid][ref2], dan wel het niet of niet tijdig nakomen van een verplichting op
      grond van de [artikelen 7, eerste lid][ref3], [8, eerste lid][ref4], [11, eerste, tweede en derde lid][ref5], en
      [12][ref6] wordt gestraft met hechtenis van ten hoogste een maand of geldboete van de tweede categorie.

      3 De in het eerste lid strafbaar gestelde feiten zijn misdrijven.

      4 De in het tweede lid strafbaar gestelde feiten zijn overtredingen


