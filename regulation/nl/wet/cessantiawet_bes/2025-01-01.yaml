  - number: 11a
    text: |-
      1 Bij ministeriële regeling kunnen controlevoorschriften worden vastgesteld. Deze voorschriften gaan niet verder
      dan strikt noodzakelijk is voor een juiste uitvoering van deze wet.

      2 De werknemer, dan wel diens nagelaten betrekkingen, zijn verplicht de voorschriften op te volgen en anderszins
      aan Onze Minister desgevraagd de medewerking te verlenen die redelijkerwijs nodig is voor de uitvoering van deze
      wet.

      3 De werknemer, dan wel diens nagelaten betrekkingen, onthouden zich van zeer ernstige misdragingen jegens de met
      de uitvoering van deze wet belaste personen en instanties tijdens het verrichten van hun werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0028304/2025-01-01#Artikel11a
