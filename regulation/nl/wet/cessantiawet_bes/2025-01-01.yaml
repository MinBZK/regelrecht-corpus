  - number: '10'
    text: |-
      1 De cessantia-uitkeringen op grond van deze wet, die niet zijn ingevorderd binnen twee jaar na de eerste dag
      waarop zij konden worden ingevorderd, worden niet meer uitbetaald.

      2 Ieder beding, dat de aansprakelijkheid van de werkgever op grond van deze wet uitsluit of vermindert, is nietig.

      3 Het is de werkgever verboden de voor hem uit de bepalingen van deze wet voortvloeiende kosten geheel of
      gedeeltelijk te verhalen op het loon van de werknemer.

      4 De cessantia-uitkering is

      a. onvervreemdbaar;

      b. niet vatbaar voor verpanding of belening;

      c. behoudens voor zover dit dient tot verhaal van onderhoud, waartoe de werknemer of de gewezen werknemer op
      grond van enige wettelijke bepaling is gehouden, niet vatbaar voor executoriaal of conservatoir beslag, noch voor
      faillissementsbeslag.

      5 Volmacht tot ontvangst van een cessantia-uitkering, onder welke vorm of welke benaming ook verleend, is steeds
      herroepelijk. Elk beding, strijdig met enige bepaling van dit artikellid, is nietig.
    url: https://wetten.overheid.nl/BWBR0028304/2025-01-01#Artikel10
  - number: '11'
    text: |-
      1 Deze wet wordt uitgevoerd door Onze Minister, met dien verstande, dat de heffing van de premie geschiedt door de
      inspecteur en dat de invordering daarvan geschiedt door de ontvanger.

      2 Een ieder is verplicht ten behoeve van de uitvoering van [artikel 4][ref1] alle door Onze Minister verlangde
      inlichtingen te verstrekken, desverlangd schriftelijk en binnen een door Onze Minister te stellen redelijke
      termijn.

      3 De werkgever, die verkeert in de toestand als vermeld in [artikel 4][ref2], is verplicht bij het beëindigen en
      bij het eindigen van de dienstbetrekking Onze Minister onverwijld hieromtrent in te lichten. Onze Minister kan voor
      het verstrekken van deze inlichtingen formulieren beschikbaar stellen waarop de voor het beoordelen van het recht
      van de werknemer op de cessantia-uitkering door Onze Minister gewenste gegevens dienen te worden vermeld en welke
      door de werkgever ondertekend bij Onze Minister dienen te worden ingediend.

      4 Ingeval de dienstbetrekking van de werknemer krachtens het bepaalde in [artikel 3, tweede lid][ref3], dan wel
      anderszins als rechtens ononderbroken dient te worden beschouwd, en de werkgever verkeert in de toestand als
      vermeld in [artikel 4][ref4], geeft de werkgever zo spoedig mogelijk hiervan kennis aan Onze Minister.

      5 Degene aan wie door Onze Minister een cessantia-uitkering als bedoeld in [artikel 4][ref5] geheel of gedeeltelijk
      ten onrechte betaalbaar is gesteld of uitbetaald, geeft onverwijld hiervan kennis aan Onze Minister. Hij is
      verplicht het ten onrechte genotene op eerste vordering van Onze Minister terug te betalen. Het bepaalde in
      [artikel 8][ref6] is van overeenkomstige toepassing.


