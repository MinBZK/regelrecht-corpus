  - number: '7'
    text: |-
      1 Ter zake van de kosten verbonden aan deze wet is een premie verschuldigd, die gezamenlijk wordt geheven met de
      zorgverzekeringspremie.

      2 De premie, bedoeld in het eerste lid, wordt geheven met overeenkomstige toepassing van
      [hoofdstuk IV van de Wet loonbelasting BES][ref1] met dien verstande dat in plaats van «inhoudingsplichtige»
      telkens wordt gelezen «werkgever».

      3 De premie wordt geheven naar een percentage van het loon van de werknemer.

      4 Het premiepercentage, bedoeld in het derde lid, wordt met ingang van elk kalenderjaar voor de periode van één
      jaar vastgesteld bij ministeriële regeling in overeenstemming met Onze Minister van Financiën.

      5 De premie is verschuldigd door de werkgever.

      6 De premie wordt door de inspecteur geheven door middel van afdracht op aangifte.

      7 De premie komt ten gunste van het Rijk.

      8 Ten laste van het Rijk, komen de door Onze Minister verstrekte uitkeringen en alle kosten verbonden aan de
      uitvoering van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0029283#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0028304/2025-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0029283
        hoofdstuk: IV
  - number: 7a
    text: |-
      Voor zover op grond van deze wet niet anders is bepaald is ten aanzien van de premieheffing en invordering op grond
      van [artikel 7][ref1] en de invordering daarvan [hoofdstuk VIII van de Belastingwet BES][ref2] van overeenkomstige
      toepassing.


