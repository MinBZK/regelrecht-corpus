  - number: 1a
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan een uitbreiding dan wel een beperking worden gegeven ten
      aanzien van degene die als werknemer wordt beschouwd:

      a. ten aanzien van vreemdelingen;

      b. ter voorkoming van samenloop op grond van deze wet met een overeenkomstige regeling buiten de openbare lichamen
      Bonaire, Sint Eustatius of Saba;

      c. in de gevallen van tijdelijk verblijf of tijdelijke werkzaamheden binnen de openbare lichamen Bonaire, Sint
      Eustatius of Saba;

      d. ten aanzien van echtgenoten en overige gezinsleden van de werknemer en van de in de onderdelen b en c bedoelde
      personen.
    url: https://wetten.overheid.nl/BWBR0028304/2025-01-01#Artikel1a
  - number: '2'
    text: |-
      1 Indien het loon geheel of gedeeltelijk bestaat uit huisvesting, verstrekkingen in natura, onderricht
      of geldelijke uitkeringen waarvan de grootte niet bij voorbaat vaststaat, zoals provisie, commissie,
      tantième, fooien of vergoedingen voor aangenomen werk, bepalen werkgever en werknemer ter vaststelling van
      het loon per dag de gemiddelde waarde in het economisch verkeer daarvan met overeenkomstige toepassing van
      [artikel 6C van de Wet loonbelasting BES][ref1].

      2 Indien sprake is van een uurloon en het aantal werkuren per week niet bij voorbaat vaststaat wordt het loon per
      dag vastgesteld aan de hand van het gemiddeld aantal werkuren per week in de periode van dertien weken voorafgaand
      aan de dag waarop de dienstbetrekking is geëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0029283#Artikel6c
    url: https://wetten.overheid.nl/BWBR0028304/2025-01-01#Artikel2
    references:
