        artikel: '8'
  - number: '5'
    text: |-
      1 De cessantia-uitkering wordt op grond van [artikel 4][ref1] aan de gewezen werknemer op zijn verzoek door Onze
      Minister toegekend, dan wel, bij zijn overlijden, aan zijn nagelaten betrekkingen op hun verzoek door de werkgever
      of op grond van artikel 4 door Onze Minister toegekend, mits het verzoek binnen twaalf maanden na het einde van de
      dienstbetrekking bij de werkgever dan wel Onze Minister is ingediend. Met het einde van de dienstbetrekking wordt
      voor de toepassing van dit lid gelijkgesteld een in kracht van gewijsde gegane rechterlijke uitspraak waarbij een
      dienstbetrekking als geëindigd wordt verklaard.

      2 Voor de toepassing van het eerste lid wordt onder nagelaten betrekkingen verstaan:

      a. de langstlevende van de echtgenoten;

      b. bij ontstentenis van de persoon, bedoeld in onderdeel a, de kinderen tot wie de overledene in familierechtelijke
      betrekking stond die de leeftijd van 21 jaar nog niet hebben bereikt en niet gehuwd zijn of gehuwd geweest zijn;

      c. bij ontstentenis van de personen, bedoeld in de onderdelen a en b, degenen voor wie de overledene grotendeels in
      de kosten van het bestaan voorzag en met wie hij in gezinsverband leefde, dan wel duurzaam samenwoonde;

      d. bij ontstentenis van de personen, bedoeld in de onderdelen a, b en c, degenen, die de kosten van de laatste
      ziekte en van de begrafenis van de overledene hebben betaald, met dien verstande dat hun recht op de cessantia-
      uitkering reikt tot het bedrag van die kosten.

      3 Onder de kinderen, bedoeld in het tweede lid, onderdeel b, wordt mede verstaan kinderen tot wie de overledene in
      familierechtelijke betrekking stond en die de leeftijd van 25 jaar nog niet hebben bereikt, indien:

      a. hun tijd, behoudens in geval van ziekte of vakantie, geheel of grotendeels in beslag wordt genomen door of in
      verband met het volgen van onderwijs of van beroepsopleiding;

      b. het kind door ziekte of gebreken niet in staat is om met arbeid, die voor zijn krachten is berekend, één derde
      te verdienen van hetgeen lichamelijk en geestelijk gezonde kinderen van gelijke leeftijd en van soortgelijke
      bekwaamheid in staat zijn met arbeid te verdienen.

      4 De betaalbaarstelling van de cessantia-uitkering op grond van het tweede lid geschiedt niet eerder dan zes
      maanden na het einde van de dienstbetrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0028304#Artikel4
