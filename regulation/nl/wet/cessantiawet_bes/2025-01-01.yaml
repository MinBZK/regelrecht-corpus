  - number: '4'
    text: |-
      1 Indien geen of geen tijdige betaling geschiedt van de cessantia-uitkering ten laste van een werkgever, die
      in staat van faillissement is verklaard of aan wie surséance van betaling is verleend, kan de werknemer jegens
      Onze Minister aanspraak maken op de cessantia-uitkering; met dien verstande dat bij de berekening van de door
      Onze Minister toe te kennen cessantia-uitkering het weekloon in aanmerking genomen wordt voor zover dit niet
      een normbedrag overschrijdt, gelijk aan anderhalf maal het weekloon dat wordt afgeleid uit de dagloonbedragen
      zoals deze op grond van [artikel 8, tweede lid, van de Wet ziekteverzekering BES][ref1] zijn of zullen worden
      vastgesteld. Indien het normbedrag niet is een getal in hele dollars en deelbaar door vijf, wordt het gesteld op
      het naast hogere bedrag dat aan deze voorwaarden voldoet.

      2 Onze Minister kan beslissen dat het bepaalde in het eerste lid overeenkomstige toepassing vindt indien een
      werkgever verkeert in de toestand dat hij heeft opgehouden te betalen, terwijl hij niet of nog niet in staat van
      faillissement is verklaard en hem geen of nog geen surséance van betaling is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0028728#Artikel8
    url: https://wetten.overheid.nl/BWBR0028304/2025-01-01#Artikel4
    references:
