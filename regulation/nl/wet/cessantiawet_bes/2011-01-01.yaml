  - number: '14.3'
    text: De in het eerste lid strafbaar gestelde feiten zijn misdrijven.
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel14
  - number: '14.4'
    text: De in het tweede lid strafbaar gestelde feiten zijn overtredingen
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel14
  - number: '15'
    text: |-
      Indien een werknemer op grond van een op 19 juli 1983 geldende regeling of toezegging aanspraak kan maken op een
      uitkering ineens wordt de cessantia-uitkering in mindering gebracht op deze uitkering.
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel15
  - number: '16'
    text: 'Deze wet wordt aangehaald als: Cessantiawet BES.'
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel16
