---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: cessantiawet_bes
regulatory_layer: WET
publication_date: '2024-12-23'
valid_from: '2011-01-01'
bwb_id: BWBR0028304
url: https://wetten.overheid.nl/BWBR0028304/2011-01-01
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel1
  - number: 1.a
    text: '*Onze Minister:* Onze Minister van Sociale Zaken en Werkgelegenheid;'
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel1
  - number: 1.b
    text: |-
      *werkgever:* de werkgever, bedoeld in [artikel 1613a van het Burgerlijk Wetboek BES][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1613a
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1613a
  - number: 1.c
    text: |-
      *werknemer:* de arbeider, bedoeld in [artikel 1613a van het Burgerlijk Wetboek BES][ref1], met uitzondering van
      een persoon werkzaam bij een publiekrechtelijk lichaam en een beambte of leerkracht bij het gesubsidieerd bijzonder
      onderwijs;


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1613a
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1613a
  - number: 1.d
    text: |-
      *cessantia-uitkering:* de eenmalige uitkering, bedoeld in [artikel 3, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028304#Artikel3
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0028304
        artikel: '3'
  - number: 1.e
    text: |-
      *loon:* het loon, bedoeld in de [artikelen 6][ref1] en [9a van de Wet loonbelasting BES][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0029283#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0029283#Artikel9a
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0029283
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0029283
        artikel: 9a
  - number: 1.f
    text: '*weekloon:*'
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel1
  - number: 1.f.1°
    text: 'bij een uurloon: het loon per uur vermenigvuldigd met het aantal werkuren per week van de betrokken werknemer,'
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel1
  - number: 1.f.2°
    text: 'bij een dagloon: het loon per dag vermenigvuldigd met het aantal werkdagen per week van de betrokken werknemer,'
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel1
  - number: 1.f.3°
    text: 'bij een maandloon: het loon per maand vermenigvuldigd met 12 en gedeeld door 52;'
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel1
  - number: 1.g
    text: '*inspecteur:* de bij regeling van Onze Minister van Financiën als zodanig aangewezen functionaris;'
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel1
  - number: 1.h
    text: '*ontvanger:* de bij regeling van Onze Minister van Financiën als zodanig aangewezen functionaris.'
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel1
  - number: '2.1'
    text: |-
      Indien het loon geheel of gedeeltelijk bestaat uit huisvesting, verstrekkingen in natura, onderricht of
      geldelijke uitkeringen waarvan de grootte niet bij voorbaat vaststaat, zoals provisie, commissie, tantième,
      fooien of vergoedingen voor aangenomen werk, bepalen werkgever en werknemer ter vaststelling van het
      loon per dag de gemiddelde waarde in het economisch verkeer daarvan met overeenkomstige toepassing van
      [artikel 6C van de Wet loonbelasting BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029283#Artikel6c
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0029283
        artikel: 6c
  - number: '2.2'
    text: |-
      Indien sprake is van een uurloon en het aantal werkuren per week niet bij voorbaat vaststaat wordt het loon per dag
      vastgesteld aan de hand van het gemiddeld aantal werkuren per week in de periode van dertien weken voorafgaand aan
      de eerste dag waarop de werknemer ziek is geworden.
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel2
  - number: '3.1'
    text: |-
      De werknemer wiens dienstbetrekking eindigt, anders dan door zijn schuld of door een aan hem toe te rekenen
      omstandigheid, wordt door de werkgever een eenmalige uitkering toegekend, gebaseerd op het laatstgenoten loon,
      waarvan de hoogte als volgt wordt berekend:
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel3
  - number: 3.1.a
    text: voor het eerste tot en met het tiende gehele dienstjaar één weekloon per dienstjaar;
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel3
  - number: 3.1.b
    text: voor het elfde tot en met het twintigste gehele dienstjaar een en een kwart maal het weekloon per dienstjaar;
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel3
  - number: 3.1.c
    text: voor de daarop volgende gehele dienstjaren tweemaal het weekloon per dienstjaar.
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel3
  - number: '3.2'
    text: |-
      Voor de toepassing van het eerste lid worden dienstbetrekkingen geacht éénzelfde, niet onderbroken dienstbetrekking
      te vormen in de in [artikel 1615k, eerste lid, van het Burgerlijk Wetboek BES][ref1] genoemde gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1615k
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1615k
  - number: '3.3'
    text: |-
      Van het bepaalde in het eerste lid kan slechts ten gunste van de werknemer worden afgeweken, terwijl van het
      bepaalde in het tweede lid slechts bij collectieve arbeidsovereenkomst kan worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel3
  - number: '3.4'
    text: |-
      Het eerste lid vindt geen toepassing indien een werknemer bij het einde van zijn dienstbetrekking in het genot van
      een pensioen of uitkering bij wijze van pensioen of ouderdomsverzorging wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel3
  - number: '3.5'
    text: |-
      Het vierde lid vindt geen toepassing wanneer het pensioen of de uitkering bij wijze van pensioen of
      ouderdomsverzorging, dat aan de werknemer bij het einde van zijn dienstbetrekking wordt uitgekeerd, minder
      bedraagt dan het dan geldende wettelijk ouderdomspensioen, danwel, het pensioen ingeval daarop het wettelijk
      ouderdomspensioen geheel of gedeeltelijk in mindering wordt gebracht, minder bedraagt dan tweemaal het bedrag van
      het dan geldende wettelijk ouderdomspensioen.
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel3
  - number: '3.6'
    text: |-
      Het vorderingsrecht van de gewezen werknemer op de cessantia-uitkering jegens de werkgever verjaart na verloop van
      één jaar.
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel3
  - number: '4.1'
    text: |-
      Indien geen of geen tijdige betaling geschiedt van de cessantia-uitkering ten laste van een werkgever, die in staat
      van faillissement is verklaard of aan wie surséance van betaling is verleend, kan de werknemer jegens Onze Minister
      aanspraak maken op de cessantia-uitkering; met dien verstande dat bij de berekening van de door Onze Minister
      toe te kennen cessantia-uitkering het weekloon in aanmerking genomen wordt voor zover dit niet een normbedrag
      overschrijdt, gelijk aan anderhalf maal het weekloon dat wordt afgeleid uit de dagloonbedragen zoals deze op grond
      van [artikel 8, tweede lid, van de Wet ziekteverzekering BES][ref1] zijn of zullen worden vastgesteld. Indien het
      normbedrag niet is een getal in hele dollars en deelbaar door vijf, wordt het gesteld op het naast hogere bedrag
      dat aan deze voorwaarden voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0028728#Artikel8
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0028728
        artikel: '8'
  - number: '4.2'
    text: |-
      Onze Minister kan beslissen dat het bepaalde in het eerste lid overeenkomstige toepassing vindt indien een
      werkgever verkeert in de toestand dat hij heeft opgehouden te betalen, terwijl hij niet of nog niet in staat van
      faillissement is verklaard en hem geen of nog geen surséance van betaling is verleend.
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel4
  - number: '5.1'
    text: |-
      De cessantia-uitkering wordt op grond van [artikel 4][ref1] aan de gewezen werknemer op zijn verzoek door Onze
      Minister toegekend, dan wel, bij zijn overlijden, aan zijn nagelaten betrekkingen op hun verzoek door de werkgever
      of op grond van artikel 4 door Onze Minister toegekend, mits het verzoek binnen twaalf maanden na het einde van de
      dienstbetrekking bij de werkgever dan wel Onze Minister is ingediend. Met het einde van de dienstbetrekking wordt
      voor de toepassing van dit lid gelijkgesteld een in kracht van gewijsde gegane rechterlijke uitspraak waarbij een
      dienstbetrekking als geëindigd wordt verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0028304#Artikel4
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0028304
        artikel: '4'
  - number: '5.2'
    text: 'Voor de toepassing van het eerste lid wordt onder nagelaten betrekkingen verstaan:'
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel5
  - number: 5.2.a
    text: de langstlevende van de echtgenoten;
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel5
  - number: 5.2.b
    text: |-
      bij ontstentenis van de persoon, bedoeld in onderdeel a, de kinderen tot wie de overledene in familierechtelijke
      betrekking stond die de leeftijd van 21 jaar nog niet hebben bereikt en niet gehuwd zijn of gehuwd geweest zijn;
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel5
  - number: 5.2.c
    text: |-
      bij ontstentenis van de personen, bedoeld in de onderdelen a en b, degenen voor wie de overledene grotendeels in de
      kosten van het bestaan voorzag en met wie hij in gezinsverband leefde, dan wel duurzaam samenwoonde;
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel5
  - number: 5.2.d
    text: |-
      bij ontstentenis van de personen, bedoeld in de onderdelen a, b en c, degenen, die de kosten van de laatste ziekte
      en van de begrafenis van de overledene hebben betaald, met dien verstande dat hun recht op de cessantia-uitkering
      reikt tot het bedrag van die kosten.
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel5
  - number: '5.3'
    text: |-
      Onder de kinderen, bedoeld in het tweede lid, onderdeel b, wordt mede verstaan kinderen tot wie de overledene in
      familierechtelijke betrekking stond en die de leeftijd van 25 jaar nog niet hebben bereikt, indien:
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel5
  - number: 5.3.a
    text: |-
      hun tijd, behoudens in geval van ziekte of vakantie, geheel of grotendeels in beslag wordt genomen door of in
      verband met het volgen van onderwijs of van beroepsopleiding;
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel5
  - number: 5.3.b
    text: |-
      het kind door ziekte of gebreken niet in staat is om met arbeid, die voor zijn krachten is berekend, één derde
      te verdienen van hetgeen lichamelijk en geestelijk gezonde kinderen van gelijke leeftijd en van soortgelijke
      bekwaamheid in staat zijn met arbeid te verdienen.
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel5
  - number: '5.4'
    text: |-
      De betaalbaarstelling van de cessantia-uitkering op grond van het tweede lid geschiedt niet eerder dan zes maanden
      na het einde van de dienstbetrekking.
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel5
  - number: '7.1'
    text: |-
      Ter zake van de kosten verbonden aan deze wet is een premie verschuldigd, die gezamenlijk wordt geheven met de
      zorgverzekeringspremie.
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel7
  - number: '7.2'
    text: |-
      De premie, bedoeld in het eerste lid, wordt geheven met overeenkomstige toepassing van
      [hoofdstuk III van de Wet loonbelasting BES][ref1] met dien verstande dat in plaats van «inhoudingsplichtige»
      telkens wordt gelezen «werkgever».


      [ref1]: https://wetten.overheid.nl/BWBR0029283#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0029283
        hoofdstuk: III
  - number: '7.3'
    text: De premie wordt geheven naar een percentage van het loon van de werknemer.
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel7
  - number: '7.4'
    text: |-
      Het premiepercentage, bedoeld in het derde lid, wordt met ingang van elk kalenderjaar voor de periode van één jaar
      vastgesteld bij ministeriële regeling in overeenstemming met Onze Minister van Financiën.
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel7
  - number: '7.5'
    text: De premie is verschuldigd door de werkgever.
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel7
  - number: '7.6'
    text: De premie wordt door de inspecteur geheven door middel van afdracht op aangifte.
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel7
  - number: '7.7'
    text: De premie komt ten gunste van het Rijk.
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel7
  - number: '7.8'
    text: |-
      Ten laste van het Rijk, komen de door Onze Minister verstrekte uitkeringen en alle kosten verbonden aan de
      uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel7
  - number: 7a
    text: |-
      Voor zover op grond van deze wet niet anders is bepaald is ten aanzien van de premieheffing en invordering op grond
      van [artikel 7][ref1] en de invordering daarvan [hoofdstuk VIII van de Belastingwet BES][ref2] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028304#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0029244#HoofdstukVIII
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0028304
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0029244
        hoofdstuk: VIII
  - number: '8.1'
    text: |-
      Onze Minister treedt voor het bedrag van een door Onze Minister verstrekte cessantia-uitkering in de rechten van de
      werknemer op de cessantia-uitkering ten opzichte van de werkgever.
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel8
  - number: '8.2'
    text: |-
      De vorderingen van de werknemer en Onze Minister op de werkgever tot nakoming van diens verplichtingen
      op grond van deze wet zijn bevoorrecht op alle goederen van de werkgever en gaan boven alle andere
      voorrechten met uitzondering van die ter zake van de directe belastingen en de voorrechten uit
      de [artikelen 287][ref1] en [288, onder a, van Boek 3 van het Burgerlijk Wetboek BES][ref2] en
      [artikel 284 van Boek 3 van het Burgerlijk Wetboek BES][ref3], voor zover de daar bedoelde kosten zijn gemaakt na
      het ontstaan van de vorderingen van de werknemer of Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel287
      [ref2]: https://wetten.overheid.nl/BWBR0028745#Artikel288
      [ref3]: https://wetten.overheid.nl/BWBR0028745#Artikel284
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '287'
      - id: ref2
        bwb_id: BWBR0028745
        artikel: '288'
      - id: ref3
        bwb_id: BWBR0028745
        artikel: '284'
  - number: '10.1'
    text: |-
      De cessantia-uitkeringen op grond van deze wet, die niet zijn ingevorderd binnen twee jaar na de eerste dag waarop
      zij konden worden ingevorderd, worden niet meer uitbetaald.
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel10
  - number: '10.2'
    text: Ieder beding, dat de aansprakelijkheid van de werkgever op grond van deze wet uitsluit of vermindert, is nietig.
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel10
  - number: '10.3'
    text: |-
      Het is de werkgever verboden de voor hem uit de bepalingen van deze wet voortvloeiende kosten geheel of
      gedeeltelijk te verhalen op het loon van de werknemer.
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel10
  - number: '10.4'
    text: De cessantia-uitkering is
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel10
  - number: 10.4.a
    text: onvervreemdbaar;
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel10
  - number: 10.4.b
    text: niet vatbaar voor verpanding of belening;
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel10
  - number: 10.4.c
    text: |-
      behoudens voor zover dit dient tot verhaal van onderhoud, waartoe de werknemer of de gewezen werknemer op grond
      van enige wettelijke bepaling is gehouden, niet vatbaar voor executoriaal of conservatoir beslag, noch voor
      faillissementsbeslag.
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel10
  - number: '10.5'
    text: |-
      Volmacht tot ontvangst van een cessantia-uitkering, onder welke vorm of welke benaming ook verleend, is steeds
      herroepelijk. Elk beding, strijdig met enige bepaling van dit artikellid, is nietig.
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel10
  - number: '11.1'
    text: |-
      Deze wet wordt uitgevoerd door Onze Minister, met dien verstande, dat de heffing van de premie geschiedt door de
      inspecteur en dat de invordering daarvan geschiedt door de ontvanger.
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel11
  - number: '11.2'
    text: |-
      Een ieder is verplicht ten behoeve van de uitvoering van [artikel 4][ref1] alle door Onze Minister verlangde
      inlichtingen te verstrekken, desverlangd schriftelijk en binnen een door Onze Minister te stellen redelijke
      termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0028304#Artikel4
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0028304
        artikel: '4'
  - number: '11.3'
    text: |-
      De werkgever, die verkeert in de toestand als vermeld in [artikel 4][ref1], is verplicht bij het beëindigen en bij
      het eindigen van de dienstbetrekking Onze Minister onverwijld hieromtrent in te lichten. Onze Minister kan voor het
      verstrekken van deze inlichtingen formulieren beschikbaar stellen waarop de voor het beoordelen van het recht van
      de werknemer op de cessantia-uitkering door Onze Minister gewenste gegevens dienen te worden vermeld en welke door
      de werkgever ondertekend bij Onze Minister dienen te worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0028304#Artikel4
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0028304
        artikel: '4'
  - number: '11.4'
    text: |-
      Ingeval de dienstbetrekking van de werknemer krachtens het bepaalde in [artikel 3, tweede lid][ref1], dan wel
      anderszins als rechtens ononderbroken dient te worden beschouwd, en de werkgever verkeert in de toestand als
      vermeld in [artikel 4][ref2], geeft de werkgever zo spoedig mogelijk hiervan kennis aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0028304#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0028304#Artikel4
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0028304
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0028304
        artikel: '4'
  - number: '11.5'
    text: |-
      Degene aan wie door Onze Minister een cessantia-uitkering als bedoeld in [artikel 4][ref1] geheel of gedeeltelijk
      ten onrechte betaalbaar is gesteld of uitbetaald, geeft onverwijld hiervan kennis aan Onze Minister. Hij is
      verplicht het ten onrechte genotene op eerste vordering van Onze Minister terug te betalen. Het bepaalde in
      [artikel 8][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028304#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0028304#Artikel8
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0028304
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0028304
        artikel: '8'
  - number: '12'
    text: Ter uitvoering van deze wet kunnen bij algemene maatregel van bestuur nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel12
  - number: 12a.1
    text: |-
      Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn de bij ministeriële regeling
      aangewezen functionarissen belast.
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel12a
  - number: 12a.2
    text: |-
      De functionarissen, bedoeld in het eerste lid, zijn uitsluitend bevoegd voor zover dat voor de vervulling van hun
      taak redelijkerwijs noodzakelijk is:
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel12a
  - number: 12a.2.a
    text: alle inlichtingen te vragen;
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel12a
  - number: 12a.2.b
    text: |-
      inzage te verlangen van alle boeken, bescheiden en andere informatiedragers en daarvan afschriften te nemen of deze
      daartoe tijdelijk mee te nemen;
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel12a
  - number: 12a.2.c
    text: alle plaatsen te betreden, met uitzondering van woningen, zonder de uitdrukkelijke toestemming van de bewoner.
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel12a
  - number: 12a.3
    text: |-
      Zo nodig wordt de toegang tot een plaats als bedoeld in het tweede lid, onderdeel c, verschaft met behulp van de
      sterke arm.
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel12a
  - number: 12a.4
    text: |-
      Een ieder is verplicht aan de in het eerste lid bedoelde functionarissen alle medewerking te verlenen die voor de
      toezichtsuitoefening op grond van het tweede lid noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel12a
  - number: '13'
    text: |-
      Alle op grond van deze wet opgemaakte of overgelegde stukken, verzoekschriften en beschikkingen zijn vrij van het
      recht van zegel en van de formaliteit van registratie.
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel13
  - number: '14.1'
    text: |-
      Hij die opzettelijk inlichtingen als bedoeld in [artikel 11][ref1] onjuist verstrekt, dan wel een valse verklaring
      aan Onze Minister aflegt, wordt gestraft met gevangenisstraf van ten hoogste een jaar of geldboete van de derde
      categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0028304#Artikel11
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0028304
        artikel: '11'
  - number: '14.2'
    text: |-
      Overtreding van [artikel 10, derde lid][ref1], dan wel het niet of niet tijdig nakomen van een verplichting op
      grond van de [artikelen 7, eerste lid][ref2], [8, eerste lid][ref3], [11, eerste, tweede en derde lid][ref4], en
      [12][ref5] wordt gestraft met hechtenis van ten hoogste een maand of geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0028304#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0028304#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0028304#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0028304#Artikel11
      [ref5]: https://wetten.overheid.nl/BWBR0028304#Artikel12
    url: https://wetten.overheid.nl/BWBR0028304/2011-01-01#Artikel14
