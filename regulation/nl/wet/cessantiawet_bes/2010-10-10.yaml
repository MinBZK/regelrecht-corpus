$id: cessantiawet_bes
regulatory_layer: WET
publication_date: '2024-12-23'
valid_from: '2010-10-10'
bwb_id: BWBR0028304
url: https://wetten.overheid.nl/BWBR0028304/2010-10-10
articles:
  - number: '1'
    text: |-
      Voor de toepassing van het bepaalde bij of krachtens deze landsverordening wordt verstaan onder: - *Minister:* de
      Minister van Arbeid en Sociale Zaken;
        - *Bank:* de Sociale Verzekeringsbank;
        - *werkgever:* de werkgever, bedoeld in artikel 1613a van het Burgerlijk Wetboek van de Nederlandse Antillen;
        - *werknemer:* de arbeider, bedoeld in artikel 1613a van het Burgerlijk Wetboek van de Nederlandse Antillen, met
      uitzondering van een persoon werkzaam bij een publiekrechtelijk lichaam alsmede een beambte of leerkracht bij het
      gesubsidieerd bijzonder onderwijs;
        - *cessantia-uitkering:* de eenmalige uitkering als bedoeld in artikel 3 lid 1;
        - *loon:* elke uitkering in welke vorm ook welke de werknemer als vergoeding voor zijn arbeid ten laste van zijn
      werkgever geniet, alsook ontvangsten van derden, welke van invloed zijn op de voorwaarden der arbeidsovereenkomst,
      behalve: – vergoeding voor het verrichten van overwerk in de zin van de Arbeidsregeling 1952 (P.B. 1958, no. 24);
      – de toeslag op het loon ingevolge artikel 58 van de Landsverordening Algemene Ouderdomsverzekering (P.B. 1960, no.
      83) en artikel 52 van de Landsverordening Algemene Weduwen- en wezenverzekering (P.B. 1965, no. 194); – de sociale
      verzekeringspremies welke ten laste van de werkgever komen; – vergoeding boven het normale loon voor het tijdelijk
      verrichten van andere dan de normale arbeid, waartoe hij ingevolge arbeidsovereenkomst in het bedrijf van zijn
      werkgever is verplicht; – vergoeding, welke bij uitzondering wordt gegeven voor het verrichten van een boven het
      normale liggende arbeidsprestatie;
        - *weekloon:* bij een uurloon: de geldswaarde van het loon per uur vermenigvuldigd met het aantal werkuren per
      week van de betrokken werknemer; bij een dagloon: de geldswaarde van het loon per dag vermenigvuldigd met het
      aantal werkdagen per week van de betrokken werknemer; bij een maandloon: de geldswaarde van het loon per maand
      vermenigvuldigd met 12 en gedeeld door 52.
    url: https://wetten.overheid.nl/BWBR0028304/2010-10-10#Artikel1
  - number: '2.1'
    text: |-
      Werkgever en werknemer stellen bij de aanvang van het dienstverband en telkens, wanneer het loon gewijzigd wordt,
      het weekloon vast met inachtneming van het daaromtrent in [artikel 1][ref1] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0028304#Artikel1
    url: https://wetten.overheid.nl/BWBR0028304/2010-10-10#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0028304
        artikel: '1'
  - number: '2.2'
    text: |-
      Indien het loon geheel of gedeeltelijk bestaat uit huisvesting, verstrekkingen in natura, onderricht of geldelijke
      uitkeringen waarvan de grootte niet bij voorbaat vast staat zoals provisie, commissie, tantième en fooien, bepalen
      werkgever en werknemer ter vaststelling van het weekloon de gemiddelde geldswaarde daarvan.
    url: https://wetten.overheid.nl/BWBR0028304/2010-10-10#Artikel2
  - number: '2.3'
    text: |-
      Indien het aantal werkuren per week, in het geval een uurloon wordt betaald, niet bij voorbaat vaststaat, bepalen
      werkgever en werknemer, ter vaststelling van het weekloon het te verwachten gemiddelde aantal werkuren per week.
    url: https://wetten.overheid.nl/BWBR0028304/2010-10-10#Artikel2
  - number: '2.4'
    text: |-
      Bij landsbesluit, houdende algemene maatregelen kunnen regelen worden vastgesteld, welke bij de bepaling van de
      geldswaarde van het niet in geld genoten loon moeten worden in acht genomen.
    url: https://wetten.overheid.nl/BWBR0028304/2010-10-10#Artikel2
  - number: '3.1'
    text: |-
      De werknemer wiens dienstbetrekking eindigt, anders dan door zijn schuld of tengevolge van een aan hem toe te
      rekenen omstandigheid, wordt door de werkgever een eenmalige uitkering, gebaseerd op het laatstgenoten loon,
      toegekend, waarvan de hoogte als volgt wordt berekend: voor het eerste tot en met het tiende volle dienstjaar
      één weekloon per dienstjaar; voor het elfde tot en met het twintigste volle dienstjaar een en een kwart maal het
      weekloon per dienstjaar; voor de daarop volgende volle dienstjaren tweemaal het weekloon per dienstjaar. Voor de
      berekening van volle dienstjaren geldt een periode van meer dan zes maanden na het eerste dienstjaar als een vol
      dienstjaar.
    url: https://wetten.overheid.nl/BWBR0028304/2010-10-10#Artikel3
  - number: '3.2'
    text: |-
      Voor de toepassing van het eerste lid worden dienstbetrekkingen geacht éénzelfde, niet onderbroken
      dienstbetrekkingen te vormen in de in artikel 1615k, eerste lid, van het Burgerlijk Wetboek genoemde gevallen.
    url: https://wetten.overheid.nl/BWBR0028304/2010-10-10#Artikel3
  - number: '3.3'
    text: |-
      Van het bepaalde in het eerste lid kan slechts ten gunste van de werknemer worden afgeweken, terwijl van het
      bepaalde in het tweede lid slechts bij collectieve arbeidsovereenkomst kan worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0028304/2010-10-10#Artikel3
  - number: '3.4'
    text: |-
      Het bepaalde in het eerste lid vindt geen toepassing indien een werknemer bij het einde van zijn dienstbetrekking
      in het genot van een pensioen of uitkering bij wijze van pensioen of ouderdomsverzorging wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0028304/2010-10-10#Artikel3
  - number: '3.5'
    text: |-
      Het bepaalde in het vierde lid vindt geen toepassing wanneer het pensioen of de uitkering bij wijze van pensioen
      of ouderdomsverzorging, dat aan de werknemer bij het einde van zijn dienstbetrekking wordt uitgekeerd, minder
      bedraagt dan het dan geldende wettelijk ouderdomspensioen, danwel, het pensioen ingeval daarop het wettelijk
      ouderdomspensioen geheel of gedeeltelijk in mindering wordt gebracht, minder bedraagt dan tweemaal het bedrag van
      het dan geldende wettelijk ouderdomspensioen.
    url: https://wetten.overheid.nl/BWBR0028304/2010-10-10#Artikel3
  - number: '3.6'
    text: |-
      Het vorderingsrecht van de gewezen werknemer op de cessantia-uitkering jegens de werkgever verjaart na verloop van
      één jaar.
    url: https://wetten.overheid.nl/BWBR0028304/2010-10-10#Artikel3
  - number: '4.1'
    text: |-
      Indien geen of geen tijdige betaling geschied van de cessantia-uitkering ten laste van een werkgever, die in
      staat van faillissement is verklaard of aan wie surséance van betaling is verleend, kan de werknemer jegens de
      Bank aanspraak maken op de cessantia-uitkering; met dien verstande dat bij de berekening van de door de Bank
      toe te kennen cessantia-uitkering het weekloon in aanmerking genomen wordt voor zover dit niet een normbedrag
      overschrijdt, gelijk aan anderhalf maal het weekloon dat wordt afgeleid uit de dagloonbedragen zoals deze
      ingevolge artikel 8, tweede lid van de Landsverordening Ziekteverzekering (P.B. 1966, no. 15) zijn of zullen worden
      vastgesteld. Indien het normbedrag niet is een getal in gehele guldens en deelbaar door vijf, wordt het gesteld op
      het naasthogere bedrag dat aan deze voorwaarden voldoet.
    url: https://wetten.overheid.nl/BWBR0028304/2010-10-10#Artikel4
  - number: '4.2'
    text: |-
      De Bank kan beslissen dat het bepaalde in het eerste lid overeenkomstige toepassing vindt indien een werkgever
      verkeert in de toestand dat hij heeft opgehouden te betalen, terwijl hij niet of nog niet in staat van
      faillissement is verklaard en hem geen of nog geen surséance van betaling is verleend.
    url: https://wetten.overheid.nl/BWBR0028304/2010-10-10#Artikel4
  - number: '5.1'
    text: |-
      De cessantia-uitkering wordt krachtens [artikel 4][ref1] aan de gewezen werknemer op zijn verzoek door de
      Bank toegekend, dan wel, bij zijn overlijden, aan zijn nagelaten betrekkingen op hun verzoek door de werkgever
      of krachtens artikel 4 door de Bank toegekend, mits het verzoek binnen twaalf maanden na het einde van de
      dienstbetrekking bij de werkgever onderscheidenlijk de Bank is ingediend. Met het einde van de dienstbetrekking
      wordt voor de toepassing van dit artikellid gelijkgesteld een in kracht van gewijsde gegane rechterlijke uitspraak
      waarbij een dienstbetrekking als geëindigd wordt verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0028304#Artikel4
    url: https://wetten.overheid.nl/BWBR0028304/2010-10-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0028304
        artikel: '4'
  - number: '5.2'
    text: |-
      Voor de toepassing van het vorige lid wordt onder nagelaten betrekkingen verstaan: a. de langstlevende
      der echtgenoten; b. bij ontstentenis van de onder a bedoelde persoon, de kinderen tot wie de overledene in
      familierechtelijke betrekking stond die de leeftijd van 21 jaar nog niet hebben bereikt en niet gehuwd zijn of
      gehuwd geweest zijn; c. bij ontstentenis van vorengenoemde personen, degenen ten aanzien van wie de overledene
      grotendeels in de kosten van het bestaan voorzag en met wie hij in gezinsverband leefde, dan wel duurzaam
      samenwoonde; d. bij ontstentenis van vorengenoemde personen, degenen, die de kosten van de laatste ziekte en van de
      begrafenis van de overledene hebben betaald, met dien verstande dat hun recht op de cessantia-uitkering reikt tot
      het bedrag van die kosten. Onder de onder b bedoelde kinderen zijn mede begrepen de kinderen tot wie de overledene
      in familierechtelijke betrekking stond, die de leeftijd van 25 jaar nog niet hebben bereikt, indien: a. hun tijd,
      behoudens in geval van ziekte of vakantie, geheel of grotendeels in beslag wordt genomen door of in verband met
      het volgen van onderwijs of van beroepsopleiding; b. zij ten gevolge van ziekte of gebreken buiten staat zijn om
      met arbeid, die voor hun krachten is berekend, één derde te verdienen van hetgeen lichamelijk en geestelijk gezonde
      kinderen van gelijke leeftijd en van soortgelijke bekwaamheid in staat zijn met arbeid te verdienen.
    url: https://wetten.overheid.nl/BWBR0028304/2010-10-10#Artikel5
  - number: '5.3'
    text: |-
      De betaalbaarstelling van de cessantia-uitkering ingevolge het vorige lid geschiedt niet eerder dan zes maanden na
      het einde van de dienstbetrekking.
    url: https://wetten.overheid.nl/BWBR0028304/2010-10-10#Artikel5
  - number: '5.4'
    text: |-
      De cessantia-uitkering, welke niet is ingevorderd binnen twee jaren na de eerste dag, waarop zij kon worden
      ingevorderd, wordt niet meer uitbetaald door de Bank.
    url: https://wetten.overheid.nl/BWBR0028304/2010-10-10#Artikel5
  - number: '6.1'
    text: |-
      In de uitvoering van [artikel 4][ref1] van deze landsverordening wordt voorzien door de Bank middels een door haar
      te beheren fonds, genaamd Cessantiafonds.


      [ref1]: https://wetten.overheid.nl/BWBR0028304#Artikel4
    url: https://wetten.overheid.nl/BWBR0028304/2010-10-10#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0028304
        artikel: '4'
  - number: '6.2'
    text: |-
      Het Cessantiafonds bezit de hoedanigheid van rechtspersoon en is gevestigd te Willemstad op Curaçao. Het fonds is
      vrijgesteld van winstbelasting.
    url: https://wetten.overheid.nl/BWBR0028304/2010-10-10#Artikel6
  - number: '6.3'
    text: |-
      Bij landsbesluit, houdende algemene maatregelen worden nader regelen vastgesteld, betreffende het beheer en de
      belegging van de gelden van het Cessantiafonds.
    url: https://wetten.overheid.nl/BWBR0028304/2010-10-10#Artikel6
  - number: '7.1'
    text: |-
      De werkgever is verplicht uiterlijk in de maand juni van ieder kalenderjaar ten behoeve van een in zijn dienst
      zijnde werknemer een bijdrage aan de Bank te doen waarvan het bedrag wordt vastgesteld bij landsbesluit houdende
      algemene maatregelen, de Sociaal-Economische Raad gehoord.
    url: https://wetten.overheid.nl/BWBR0028304/2010-10-10#Artikel7
  - number: '7.2'
    text: |-
      De Bank treedt voor het bedrag van de door haar betaalde cessantia-uitkering in de rechten van de werknemer op de
      cessantia-uitkering jegens de werkgever.
    url: https://wetten.overheid.nl/BWBR0028304/2010-10-10#Artikel7
  - number: '7.3'
    text: |-
      Ten laste van de Bank komen de door de Bank betaalbaar gestelde cessantia-uitkeringen als bedoeld in
      [artikel 4][ref1] van deze landsverordening, alsmede alle andere kosten verbonden aan de uitvoering van artikel 4
      van deze landsverordening.


      [ref1]: https://wetten.overheid.nl/BWBR0028304#Artikel4
    url: https://wetten.overheid.nl/BWBR0028304/2010-10-10#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0028304
        artikel: '4'
  - number: '8.1'
    text: |-
      De voldoening van de in [artikel 7, eerste lid][ref1], bedoelde bijdrage aan de Bank geschiedt middels storting op
      aangifte bij de door de Bank aangewezen betaalinstellingen. De aangifte wordt gelijktijdig met de storting van de
      bijdrage gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028304#Artikel7
    url: https://wetten.overheid.nl/BWBR0028304/2010-10-10#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0028304
        artikel: '7'
  - number: '8.2'
    text: |-
      Indien de bijdrage geheel of gedeeltelijk niet binnen de voorgeschreven tijd is voldaan, wordt de te weinig
      betaalde bijdrage bij wijze van boete verhoogd met één ten honderd van het niet voldane bedrag van de bijdrage voor
      elke maand of gedeelte van een maand dat dat bedrag niet is voldaan. De werkgever is verplicht de boete op eerste
      vordering van de Bank te betalen.
    url: https://wetten.overheid.nl/BWBR0028304/2010-10-10#Artikel8
  - number: '8.3'
    text: |-
      De vorderingen van de werknemer en de Bank op de werkgever tot nakoming van diens verplichting
      ingevolge [artikel 3, eerste lid][ref1], en [artikel 7, eerste lid][ref2], alsmede het tweede
      lid van dit artikel zijn bevoorrecht op alle goederen van de werkgever en gaan boven alle
      andere voorrechten met uitzondering van die ter zake van de directe belastingen, die van de
      [artikelen 287][ref3] en [288, onder a, van Boek 3 van het Burgerlijk Wetboek][ref4], alsmede dat van
      [artikel 284 van Boek 3 van het Burgerlijk Wetboek][ref5], voor zover de daar bedoelde kosten zijn gemaakt na het
      ontstaan van de vorderingen van de werknemer of de Bank.


      [ref1]: https://wetten.overheid.nl/BWBR0028304#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0028304#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Artikel287
      [ref4]: https://wetten.overheid.nl/BWBR0005291#Artikel288
      [ref5]: https://wetten.overheid.nl/BWBR0005291#Artikel284
    url: https://wetten.overheid.nl/BWBR0028304/2010-10-10#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0028304
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0028304
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0005291
        artikel: '287'
      - id: ref4
        bwb_id: BWBR0005291
        artikel: '288'
      - id: ref5
        bwb_id: BWBR0005291
        artikel: '284'
  - number: '9'
    text: |-
      Tegen een beschikking van de directeur van de Bank met betrekking tot de toekenning of betaalbaarstelling van een
      cessantia-uitkering als bedoeld in [artikel 4][ref1], staat voor belanghebbende binnen zes weken na de dag waarop
      deze is gegeven, beroep open bij het Gerecht in eerste aanleg van de Nederlandse Antillen.


      [ref1]: https://wetten.overheid.nl/BWBR0028304#Artikel4
    url: https://wetten.overheid.nl/BWBR0028304/2010-10-10#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0028304
        artikel: '4'
  - number: '10.1'
    text: |-
      De cessantia-uitkeringen als bedoeld in deze landsverordening, welke niet zijn ingevorderd binnen twee jaar na de
      eerste dag waarop zij konden worden ingevorderd, worden niet meer uitbetaald,
    url: https://wetten.overheid.nl/BWBR0028304/2010-10-10#Artikel10
  - number: '10.2'
    text: |-
      Ieder beding, dat de aansprakelijkheid van de werkgever ingevolge de bepalingen van deze landsverordening uitsluit
      of vermindert, is nietig.
    url: https://wetten.overheid.nl/BWBR0028304/2010-10-10#Artikel10
  - number: '10.3'
    text: |-
      Het is de werkgever verboden de voor hem uit de bepalingen van deze landsverordening voortvloeiende kosten geheel
      of gedeeltelijk te verhalen op het loon van de werknemer.
    url: https://wetten.overheid.nl/BWBR0028304/2010-10-10#Artikel10
  - number: '10.4'
    text: De cessantia-uitkering is
    url: https://wetten.overheid.nl/BWBR0028304/2010-10-10#Artikel10
  - number: 10.4.a
    text: onvervreemdbaar;
    url: https://wetten.overheid.nl/BWBR0028304/2010-10-10#Artikel10
  - number: 10.4.b
    text: niet vatbaar voor verpanding of belening;
    url: https://wetten.overheid.nl/BWBR0028304/2010-10-10#Artikel10
  - number: 10.4.c
    text: |-
      behoudens voor zover dit dient tot verhaal van onderhoud, waartoe de werknemer of de gewezen werknemer
      volgens wettelijke regeling is gehouden, niet vatbaar voor executoriaal of conservatoir beslag, noch voor
      faillissementsbeslag.
    url: https://wetten.overheid.nl/BWBR0028304/2010-10-10#Artikel10
  - number: '11.1'
    text: |-
      Een ieder is verplicht ten behoeve van de uitvoering van [artikel 4][ref1] van deze landsverordening alle door
      de Bank verlangde inlichtingen te verstrekken, desverlangd schriftelijk en binnen een door de Bank te stellen
      redelijke termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0028304#Artikel4
    url: https://wetten.overheid.nl/BWBR0028304/2010-10-10#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0028304
        artikel: '4'
  - number: '11.2'
    text: |-
      De werkgever, die verkeert in de toestand als vermeld in [artikel 4][ref1], is verplicht bij het beëindigen en bij
      het eindigen van de dienstbetrekking de Bank onverwijld hieromtrent in te lichten. De Bank kan voor het verstrekken
      van deze inlichtingen formulieren beschikbaar stellen waarop de voor het beoordelen van het recht van de werknemer
      op de cessantia-uitkering door de Bank gewenste gegevens dienen te worden vermeld en welke door de werkgever
      ondertekend bij de Bank dienen te worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0028304#Artikel4
    url: https://wetten.overheid.nl/BWBR0028304/2010-10-10#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0028304
        artikel: '4'
  - number: '11.3'
    text: |-
      Ingeval de dienstbetrekking van de werknemer krachtens het bepaalde in [artikel 3, tweede lid][ref1], dan wel
      anderszins als rechtens ononderbroken dient te worden beschouwd, en de werkgever verkeert in de toestand als
      vermeld in [artikel 4][ref2], geeft de werkgever zo spoedig mogelijk hiervan kennis aan de Bank.


      [ref1]: https://wetten.overheid.nl/BWBR0028304#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0028304#Artikel4
    url: https://wetten.overheid.nl/BWBR0028304/2010-10-10#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0028304
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0028304
        artikel: '4'
  - number: '11.4'
    text: |-
      Degene aan wie door de Bank een cessantia-uitkering als bedoeld in [artikel 4][ref1] geheel of gedeeltelijk ten
      onrechte is betaalbaar gesteld of uitbetaald, geeft onverwijld hiervan kennis aan de Bank. Hij is verplicht het
      ten onrechte genotene op eerste vordering van de Bank terug te betalen. Het bepaalde in [artikel 8][ref2] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028304#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0028304#Artikel8
    url: https://wetten.overheid.nl/BWBR0028304/2010-10-10#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0028304
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0028304
        artikel: '8'
  - number: '12'
    text: |-
      Ter uitvoering van deze landsverordening kunnen nadere regelen worden vastgesteld bij landsbesluit, houdende
      algemene maatregelen.
    url: https://wetten.overheid.nl/BWBR0028304/2010-10-10#Artikel12
  - number: 12a.1
    text: Met het toezicht op de naleving van het bij of krachtens deze landsverordening bepaalde is belast de Bank.
    url: https://wetten.overheid.nl/BWBR0028304/2010-10-10#Artikel12a
  - number: 12a.2
    text: 'De Bank is, uitsluitend voor zover dat voor de vervulling van haar taak redelijkerwijze noodzakelijk is, bevoegd:'
    url: https://wetten.overheid.nl/BWBR0028304/2010-10-10#Artikel12a
  - number: 12a.2.a
    text: alle inlichtingen te vragen;
    url: https://wetten.overheid.nl/BWBR0028304/2010-10-10#Artikel12a
  - number: 12a.2.b
    text: |-
      inzage te verlangen van alle boeken, bescheiden en andere informatiedragers en daarvan afschrift te nemen of deze
      daartoe tijdelijk mee te nemen;
    url: https://wetten.overheid.nl/BWBR0028304/2010-10-10#Artikel12a
  - number: 12a.2.c
    text: |-
      alle plaatsen, met uitzondering van woningen zonder de uitdrukkelijke toestemming van de bewoner, te betreden,
      vergezeld van door hen aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0028304/2010-10-10#Artikel12a
  - number: 12a.3
    text: |-
      Zo nodig, wordt de toegang tot een plaats als bedoeld in het tweede lid, onderdeel c, verschaft met behulp van de
      sterke arm.
    url: https://wetten.overheid.nl/BWBR0028304/2010-10-10#Artikel12a
  - number: 12a.4
    text: |-
      Een ieder is verplicht aan de Bank alle medewerking te verlenen die in het kader van de toezichtsuitoefening op
      grond van het tweede lid wordt gevorderd.
    url: https://wetten.overheid.nl/BWBR0028304/2010-10-10#Artikel12a
  - number: '13'
    text: |-
      Alle ingevolge deze landsverordening opgemaakte of overgelegde stukken, verzoekschriften en beschikkingen zijn vrij
      van het recht van zegel en van de formaliteit van registratie.
    url: https://wetten.overheid.nl/BWBR0028304/2010-10-10#Artikel13
  - number: '14.1'
    text: |-
      Hij die opzettelijk inlichtingen als bedoeld in [artikel 11][ref1] onjuist verstrekt, dan wel een valse verklaring
      aan de Bank aflegt, wordt gestraft met gevangenisstraf van ten hoogste een jaar of geldboete van ten hoogste
      tienduizend gulden.


      [ref1]: https://wetten.overheid.nl/BWBR0028304#Artikel11
    url: https://wetten.overheid.nl/BWBR0028304/2010-10-10#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0028304
        artikel: '11'
  - number: '14.2'
    text: |-
      Overtreding van [artikel 10, tweede lid][ref1], dan wel het niet of niet tijdig nakomen van een der
      verplichtingen gesteld bij of krachtens de [artikelen 7, eerste lid][ref2], [8, eerste lid][ref3],
      [11, eerste, tweede en derde lid][ref4], en [12][ref5] wordt gestraft met hechtenis van ten hoogste een maand of
      geldboete van ten hoogste vijfduizend gulden.


      [ref1]: https://wetten.overheid.nl/BWBR0028304#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0028304#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0028304#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0028304#Artikel11
      [ref5]: https://wetten.overheid.nl/BWBR0028304#Artikel12
    url: https://wetten.overheid.nl/BWBR0028304/2010-10-10#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0028304
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0028304
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0028304
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0028304
        artikel: '11'
      - id: ref5
        bwb_id: BWBR0028304
        artikel: '12'
  - number: '14.3'
    text: De in het eerste lid strafbaar gestelde feiten zijn misdrijven.
    url: https://wetten.overheid.nl/BWBR0028304/2010-10-10#Artikel14
  - number: '14.4'
    text: De in het tweede lid strafbaar gestelde feiten zijn overtredingen
    url: https://wetten.overheid.nl/BWBR0028304/2010-10-10#Artikel14
  - number: '15.1'
    text: |-
      Deze landsverordening, welke kan worden aangehaald als «Cessantia-landsverordening», treedt in werking met ingang
      van een nader bij landsbesluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0028304/2010-10-10#Artikel15
  - number: '15.2'
    text: |-
      Indien een werknemer ingevolge een op het in het eerste lid bedoelde tijdstip bestaande regeling of toezegging van
      de werkgever bij het einde van de dienstbetrekking ten laste van de werkgever aanspraak kan maken op een uitkering
      ineens, wordt de cessantia-uitkering in mindering gebracht op deze uitkering.
    url: https://wetten.overheid.nl/BWBR0028304/2010-10-10#Artikel15
  - number: '15.3'
    text: |-
      In afwijking van het bepaalde in [artikel 7, eerste lid][ref1] is de werkgever verplicht voor het kalenderjaar
      1983 uiterlijk op 31 december 1983 de in dat artikellid bedoelde bijdrage te doen voor de in zijn dienst zijnde
      werknemer.


      [ref1]: https://wetten.overheid.nl/BWBR0028304#Artikel7
    url: https://wetten.overheid.nl/BWBR0028304/2010-10-10#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0028304
        artikel: '7'
