preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de rechtsgebieden en de zetels der rechtbanken en
    kantongerechten opnieuw vast te stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002080/2012-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Er zijn vijf gerechtshoven, waarvan de zetels zijn te Amsterdam, te Arnhem, te 's-Gravenhage, te 's-Hertogenbosch
      en te Leeuwarden.
    url: https://wetten.overheid.nl/BWBR0002080/2012-01-01#Artikel1
  - number: '2'
    text: |-
      Het rechtsgebied van het gerechtshof te Amsterdam bestaat uit de volgende arrondissementen:

      1. Alkmaar

      2. Amsterdam

      3. Haarlem.
    url: https://wetten.overheid.nl/BWBR0002080/2012-01-01#Artikel2
