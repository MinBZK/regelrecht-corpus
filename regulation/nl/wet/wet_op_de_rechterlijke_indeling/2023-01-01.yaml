preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de rechtsgebieden en de zetels der rechtbanken en
    kantongerechten opnieuw vast te stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002080/2023-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Er zijn elf rechtbanken, die als volgt worden aangeduid:

      a. de rechtbank Amsterdam;

      b. de rechtbank Den Haag;

      c. de rechtbank Gelderland;

      d. de rechtbank Limburg;

      e. de rechtbank Midden-Nederland;

      f. de rechtbank Noord-Holland;

      g. de rechtbank Noord-Nederland;

      h. de rechtbank Oost-Brabant;

      i. de rechtbank Overijssel;

      j. de rechtbank Rotterdam;

      k. de rechtbank Zeeland-West-Brabant.
    url: https://wetten.overheid.nl/BWBR0002080/2023-01-01#Artikel1
  - number: '2'
    text: |-
      Er zijn vier gerechtshoven, die als volgt worden aangeduid:

      a. het gerechtshof Amsterdam;

      b. het gerechtshof Arnhem-Leeuwarden;

      c. het gerechtshof Den Haag;

      d. het gerechtshof ’s-Hertogenbosch.
    url: https://wetten.overheid.nl/BWBR0002080/2023-01-01#Artikel2
  - number: '3'
    text: |-
      Het rechtsgebied van een rechtbank onderscheidenlijk gerechtshof omvat het in [paragraaf 2][ref1] onderscheidenlijk
      [paragraaf 3][ref2] als zodanig genoemde arrondissement onderscheidenlijk ressort.


      [ref1]: https://wetten.overheid.nl/BWBR0002080#Paragraaf2
      [ref2]: https://wetten.overheid.nl/BWBR0002080#Paragraaf3
    url: https://wetten.overheid.nl/BWBR0002080/2023-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002080
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002080
        paragraaf: '3'
  - number: '4'
    text: |-
      Het arrondissement Amsterdam omvat het grondgebied van de gemeenten Aalsmeer, Amstelveen, Amsterdam, Diemen, Ouder-
      Amstel en Uithoorn.
    url: https://wetten.overheid.nl/BWBR0002080/2023-01-01#Artikel4
  - number: '5'
    text: |-
      Het arrondissement Den Haag omvat het grondgebied van de gemeenten Alphen aan den Rijn, Bodegraven-Reeuwijk,
      Delft, Gouda, ’s-Gravenhage, Hillegom, Kaag en Braassem, Katwijk, Krimpenerwaard, Leiden, Leiderdorp, Leidschendam-
      Voorburg, Lisse, Midden-Delfland, Nieuwkoop, Noordwijk, Oegstgeest, Pijnacker-Nootdorp, Rijswijk, Teylingen,
      Voorschoten, Waddinxveen, Wassenaar, Westland, Zoetermeer, Zoeterwoude en Zuidplas.
    url: https://wetten.overheid.nl/BWBR0002080/2023-01-01#Artikel5
  - number: 5a
    text: Het arrondissement Gelderland omvat het grondgebied van de provincie Gelderland.
    url: https://wetten.overheid.nl/BWBR0002080/2023-01-01#Artikel5a
  - number: '6'
    text: Het arrondissement Limburg omvat het grondgebied van de provincie Limburg.
    url: https://wetten.overheid.nl/BWBR0002080/2023-01-01#Artikel6
  - number: '7'
    text: |-
      Het arrondissement Midden-Nederland omvat het grondgebied van de provincies Flevoland en Utrecht alsmede van de
      gemeenten Blaricum, Gooise Meren, Hilversum, Huizen, Laren en Wijdemeren.
    url: https://wetten.overheid.nl/BWBR0002080/2023-01-01#Artikel7
  - number: '8'
    text: |-
      Het arrondissement Noord-Holland omvat het grondgebied van de gemeenten Alkmaar, Bergen, Beverwijk, Bloemendaal,
      Castricum Den Helder, Dijk en Waard, Drechterland, Edam-Volendam, Enkhuizen, Haarlem, Haarlemmermeer, Heemskerk,
      Heemstede, Heiloo, Hollands Kroon, Hoorn, Koggenland, Landsmeer, Medemblik, Oostzaan, Opmeer, Purmerend, Schagen,
      Stede Broec, Texel, Uitgeest, Velsen, Watersland, Wormerland, Zaanstad en Zandvoort.
    url: https://wetten.overheid.nl/BWBR0002080/2023-01-01#Artikel8
  - number: '9'
    text: Het arrondissement Noord-Nederland omvat het grondgebied van de provincies Drenthe, Fryslân en Groningen.
    url: https://wetten.overheid.nl/BWBR0002080/2023-01-01#Artikel9
  - number: '10'
    text: |-
      Het arrondissement Oost-Brabant omvat het grondgebied van de gemeenten Asten, Bergeijk, Bernheze, Best, Bladel,
      Boekel, Boxtel, Cranendonck, Deurne, Eersel, Eindhoven, Geldrop-Mierlo, Gemert-Bakel, Heeze-Leende, Helmond, ’s-
      Hertogenbosch, Heusden, Laarbeek, Land van Cuijk, Maashorst, Meierijstad, Nuenen, Gerwen en Nederwetten, Oirschot,
      Oss, Reusel-De Mierden, Sint-Michielsgestel, Someren, Son en Breugel, Valkenswaard, Veldhoven, Vught en Waalre.
    url: https://wetten.overheid.nl/BWBR0002080/2023-01-01#Artikel10
  - number: '11'
    text: Het arrondissement Overijssel omvat het grondgebied van de provincie Overijssel.
    url: https://wetten.overheid.nl/BWBR0002080/2023-01-01#Artikel11
  - number: '12'
    text: |-
      Het arrondissement Rotterdam omvat het grondgebied van de gemeenten Alblasserdam, Albrandswaard, Barendrecht,
      Capelle aan den IJssel, Dordrecht, Goeree-Overflakkee, Gorinchem, Hardinxveld-Giessendam, Hendrik-Ido-Ambacht,
      Hoeksche Waard, Krimpen aan den IJssel, Lansingerland, Maassluis, Molenlanden, Nissewaard, Papendrecht, Ridderkerk,
      Rotterdam, Schiedam, Sliedrecht, Vlaardingen, Voorne aan Zee en Zwijndrecht.
    url: https://wetten.overheid.nl/BWBR0002080/2023-01-01#Artikel12
  - number: '13'
    text: |-
      Het arrondissement Zeeland-West-Brabant omvat het grondgebied van de provincie Zeeland alsmede van de gemeenten
      Alphen-Chaam, Altena, Baarle-Nassau, Bergen op Zoom, Breda, Dongen, Drimmelen, Etten-Leur, Geertruidenberg, Gilze
      en Rijen, Goirle, Halderberge, Hilvarenbeek, Loon op Zand, Moerdijk, Oisterwijk, Oosterhout, Roosendaal, Rucphen,
      Steenbergen, Tilburg, Waalwijk, Woensdrecht en Zundert.
    url: https://wetten.overheid.nl/BWBR0002080/2023-01-01#Artikel13
  - number: '14'
    text: |-
      Het ressort Amsterdam omvat de volgende arrondissementen:

      a. Amsterdam;

      b. Noord-Holland.
    url: https://wetten.overheid.nl/BWBR0002080/2023-01-01#Artikel14
  - number: '15'
    text: |-
      Het ressort Arnhem-Leeuwarden omvat de volgende arrondissementen:

      a. Gelderland;

      b. Midden-Nederland;

      c. Noord-Nederland;

      d. Overijssel.
    url: https://wetten.overheid.nl/BWBR0002080/2023-01-01#Artikel15
  - number: '16'
    text: |-
      Het ressort Den Haag omvat de volgende arrondissementen:

      a. Den Haag;

      b. Rotterdam.
    url: https://wetten.overheid.nl/BWBR0002080/2023-01-01#Artikel16
  - number: '17'
    text: |-
      Het ressort ’s-Hertogenbosch omvat de volgende arrondissementen:

      a. Limburg;

      b. Oost-Brabant;

      c. Zeeland-West-Brabant.
    url: https://wetten.overheid.nl/BWBR0002080/2023-01-01#Artikel17
  - number: '18'
    text: |-
      Indien een herindelingsregeling als bedoeld in
      [artikel 1, eerste lid, onderdeel f, van de Wet algemene regels herindeling][ref1] leidt tot een wijziging van het
      grondgebied van een arrondissement of ressort, heeft die wijziging geen gevolgen voor de rechterlijke bevoegdheid
      in zaken die op de datum van herindeling bij een rechtbank of gerechtshof aanhangig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel1
    url: https://wetten.overheid.nl/BWBR0002080/2023-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003718
        artikel: '1'
  - number: '19'
    text: 'Deze wet wordt aangehaald als: Wet op de rechterlijke indeling.'
    url: https://wetten.overheid.nl/BWBR0002080/2023-01-01#Artikel19
