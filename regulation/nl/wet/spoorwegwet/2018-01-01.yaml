  - number: '37'
    text: |-
      1 Het is een spoorwegonderneming verboden om van hoofdspoorweginfrastructuur gebruik te maken met een
      spoorvoertuig, waarvoor een vergunning voor indienststelling is afgegeven, dat niet in het register, bedoeld in het
      tweede lid, dan wel in het register van een andere staat is ingeschreven.

      2 Onze Minister houdt het register, bedoeld in artikel 33 van richtlijn 2008/57/EG.

      3 Onze Minister draagt op aanvraag zorg voor de inschrijving van spoorvoertuigen, waarvoor een vergunning voor
      indienststelling is afgegeven, in het register, bedoeld in het tweede lid.

      4 De aanvrager voegt bij de aanvraag voor de inschrijving de bij regeling van Onze Minister bepaalde gegevens.

      5 De houder van het spoorvoertuig meldt de wijzigingen met betrekking tot de gegevens, bedoeld in het vierde lid,
      die na de inschrijving optreden, binnen twee weken aan Onze Minister.

      6 Onze Minister kent aan een in te schrijven spoorvoertuig dat niet volledig in een register van een andere
      staat is ingeschreven een Europees voertuignummer toe. De houder van het spoorvoertuig brengt het toegekende
      voertuignummer aan op het spoorvoertuig.

      7 Onze Minister schrapt de inschrijving van een spoorvoertuig:

      a. op verzoek van de houder van het spoorvoertuig;

      b. indien het spoorvoertuig definitief buiten gebruik wordt gesteld, of

      c. in andere bij regeling van Onze Minister aangegeven gevallen.

      8 In afwijking van [artikel 4:14 van de Algemene wet bestuursrecht][ref1] besluit Onze Minister bij verlenging
      van de beslistermijn ten aanzien van de inschrijving in het register, bedoeld in het eerste lid, en het
      schrappen van de inschrijving, bedoeld in het zevende lid, in ieder geval binnen vier maanden nadat alle in
      [artikel 4:2, tweede lid, van de Algemene wet bestuursrecht][ref2] bedoelde informatie is verschaft.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel414
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel42
