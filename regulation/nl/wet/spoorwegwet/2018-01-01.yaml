      1 Een EG-keuringsverklaring als bedoeld in [artikel 8, vijfde lid][ref1], voldoet aan bijlage V van richtlijn
      2008/57/EG.

      2 De afgifte van een EG-keuringsverklaring als bedoeld in [artikel 8, vijfde lid][ref2], geschiedt in
      overeenstemming met artikel 18 en bijlage VI van richtlijn 2008/57/EG.

      3 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de afgifte van de EG-
      keuringsverklaring, bedoeld in [artikel 8, vijfde lid][ref3] en de verklaring, bedoeld in artikel 8, zesde lid.

      4 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de verlening en regels
      over de aanvraag van de vergunning voor indienststelling, bedoeld in [artikel 8, eerste lid][ref4], en van de
      vergunning of nieuwe vergunning voor indienststelling, bedoeld in [artikel 9, derde lid][ref5].

      5 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over het registeren of bewaren van
      gegevens over:

      a. de afgifte van de EG-keuringsverklaring, bedoeld in [artikel 8, vijfde lid][ref6];

      b. de afgifte van de verklaring, bedoeld in [artikel 8, zesde lid][ref7], of [artikel 9, negende lid][ref8], en

      c. de aanvraag en de verlening van de vergunning voor indienststelling, bedoeld in [artikel 8, eerste lid][ref9],
      en van de vergunning voor indienststelling of van de nieuwe vergunning voor indienststelling, bedoeld in
      [artikel 9, derde lid][ref10].


