  - number: '25'
    text: |-
      Deze paragraaf geldt onverkort voor de rechthebbende ten aanzien van de onder of naast de
      hoofdspoorweginfrastructuur gelegen grond, de daarin gelegen werken en daarop gelegen opstallen.
    url: https://wetten.overheid.nl/BWBR0015007/2018-01-01#Artikel25
  - number: '26'
    text: |-
      1 De rechthebbende ten aanzien van een rechtstreeks aan de hoofdspoorweg gelegen station draagt ervoor zorg dat
      reizigers via de in het station aanwezige hallen, tunnels, trappen en liften, met logische en overzichtelijke
      routes, een veilige en adequate toegang hebben tot perrons en spoorvoertuigen.

      2 De verplichtingen van een rechthebbende op grond van het eerste lid omvatten met betrekking tot gehandicapte
      personen en personen met beperkte mobiliteit de naleving van artikel 21 van Verordening (EU) nr. 1371/ 2007 van
      het Europees parlement en de Raad van 23 oktober 2007 betreffende de rechten en verplichtingen van reizigers in het
      treinverkeer (PbEU 2007, L 315).

      3 Onder station wordt in het eerste lid verstaan: een gebouw of werk dat blijkens zijn constructie en inrichting
      geheel of gedeeltelijk is bestemd voor aankomst en vertrek van spoorvoertuigen met het oog op het in-, uit- of
      overstappen van reizigers.

      4 Indien de veilige en adequate toegang tot perrons, laad- of losplaatsen of spoorvoertuigen in het gedrang komt of
      dreigt te komen, geeft Onze Minister aan de betrokken rechthebbende een bindende aanwijzing ter waarborging van die
      toegang. Tevens kan Onze Minister aan de betrokken rechthebbende een bindende aanwijzing geven met betrekking tot
      fysieke voorzieningen ter bevordering van de sociale veiligheid op de stations.

      5 Desgevraagd adviseert de beheerder Onze Minister over de toepassing van het vierde lid.
    url: https://wetten.overheid.nl/BWBR0015007/2018-01-01#Artikel26
  - number: '27'
    text: |-
      1 Een spoorwegonderneming heeft op niet-discriminerende grondslag recht op toegang tot hoofdspoorweginfrastructuur
      voor zover dit het gebruik van spoorvoertuigen betreft en met het oog op het minimumtoegangspakket.

      2 Geen toegang tot hoofdspoorweginfrastructuur als bedoeld in het eerste lid heeft een spoorwegonderneming:

      a. die niet beschikt over een geldige bedrijfsvergunning;

      b. die niet beschikt over een geldig veiligheidscertificaat of proefcertificaat;

      c. die niet voldoet aan de voor haar ingevolge [artikel 55][ref1] geldende verzekeringsplicht;

      d. indien het recht op die toegang niet rechtstreeks voortvloeit uit een toegangsovereenkomst als bedoeld in
      [artikel 59][ref2];

      e. die anderszins niet gerechtigd is van de hoofdspoorweginfrastructuur, bedoeld in het eerste lid, gebruik te
      maken.

      3 Bij algemene maatregel van bestuur kan met inachtneming van artikel 2, tweede lid, van richtlijn 2012/34/EU onder
      bij of krachtens algemene maatregel van bestuur te stellen voorwaarden en beperkingen vrijstelling worden verleend
      van het tweede lid, onderdeel a, en met inachtneming van artikel 3 van richtlijn 2004/49/EG onder bij of krachtens
      algemene maatregel van bestuur te stellen voorwaarden en beperkingen vrijstelling worden verleend van het tweede
      lid, onderdeel b.

      4 Een beheerder heeft in afwijking van het tweede lid, onder d, ten behoeve van de uitoefening van de taken,
      bedoeld in [artikel 16, eerste lid][ref3], als spoorwegonderneming toegang tot hoofdspoorweginfrastructuur als
      bedoeld in het eerste lid zonder dat het recht rechtstreeks voortvloeit uit een toegangsovereenkomst met dien
      verstande dat de beheerder, voor zover het de activiteiten, bedoeld in artikel 53 van richtlijn 2012/34/EU betreft,
      beschikt over verdeelde capaciteit.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel59
      [ref3]: https://wetten.overheid.nl/BWBR0015007#Artikel16
