  - number: '43'
    text: |-
      1 De fabrikant van interoperabiliteitsonderdelen en zijn in Nederland gevestigde gemachtigde die in strijd met
      [artikel 42, tweede lid][ref1], een EG-verklaring van conformiteit of geschiktheid voor gebruik als bedoeld
      in artikel 13, eerste lid, van [richtlijn 2008/57/EG](32008L0057) voor een interoperabiliteitsonderdeel hebben
      afgegeven, zijn verplicht op eerste vordering van Onze Minister en binnen een door hem te stellen termijn het
      verzuim te herstellen. Zij zijn verplicht de daarbij door Onze Minister te geven aanwijzingen op te volgen.

      2 Indien de fabrikant of zijn in Nederland gevestigde gemachtigde niet voldoet aan het eerste lid neemt Onze
      Minister met toepassing van artikel 14 van [richtlijn 2008/57/EG](32008L0057) maatregelen, om het in de handel
      brengen van het betrokken interoperabiliteitsonderdeel te beperken of te verbieden dan wel het uit de handel te
      doen nemen.

      3 Onze Minister besluit binnen vier maanden, nadat hij heeft vastgesteld dat de fabrikant of zijn in Nederland
      gevestigde gemachtigde niet voldoet aan de vordering, bedoeld in het eerste lid, over de maatregelen bedoeld in het
      tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel42
    url: https://wetten.overheid.nl/BWBR0015007/2018-01-01#Artikel43
