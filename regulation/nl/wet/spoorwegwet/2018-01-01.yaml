  - number: '48'
    text: |-
      1 Het is verboden onderhoud en herstel van spoorvoertuigen die beschikken over een volledige inschrijving in het
      register, bedoeld in [artikel 37, tweede lid][ref1] te laten uitvoeren door anderen dan daartoe door Onze Minister
      erkende natuurlijke personen of rechtspersonen.

      2 Een erkenning wordt verleend indien wordt voldaan aan de daarvoor bij regeling van Onze Minister gestelde eisen.

      3 Met een erkenning als bedoeld in het eerste lid wordt gelijkgesteld een erkenning, afgegeven door een daartoe
      bevoegde instantie in een andere lidstaat van de Europese Unie dan wel in een andere staat, niet zijnde een
      lidstaat van de Europese Unie, die partij is bij een daartoe of mede daartoe strekkend verdrag dat Nederland
      bindt, welke erkenning is afgegeven op basis van onderzoekingen die een beschermingsniveau bieden dat ten minste
      gelijkwaardig is aan het niveau dat met de nationale onderzoekingen wordt nagestreefd.

      4 De eisen of nadere eisen, bedoeld in het tweede lid kunnen onder meer betrekking hebben op:

      a. de voor het onderhoud of herstel beschikbare ruimte en de gebruikte apparatuur;

      b. de deskundigheid van de met het onderhoud of herstel belaste personen en

      c. het proces dat bij het onderhoud of herstel wordt toegepast.

      5 Onze Minister kan de erkenning, bedoeld in het tweede lid, onder beperkingen verlenen en daaraan voorschriften
      verbinden met betrekking tot de uit te voeren werkzaamheden.

      6 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over het onderhoud alsmede over de
      aanvraag en het verlenen van een erkenning.

      7 Onze Minister trekt een erkenning in:

      a. op verzoek van degene aan wie deze is verleend;

      b. indien degene, aan wie deze is verleend, niet langer voldoet aan de eisen, bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel37
