  - number: '29'
    text: |-
      Onze Minister schorst de bedrijfsvergunning of trekt deze in, indien:

      a. de vergunninghouder niet meer voldoet aan de bij of krachtens [artikel 28][ref1] toepasselijke eisen of
      voorschriften;

      b. de veiligheid van het spoorverkeer door wijziging van de rechtspositie van de vergunninghouder ingeval van fusie
      of bedrijfsovername naar het oordeel van Onze Minister niet langer is gewaarborgd of

      c. bij herhaling bij onherroepelijk rechterlijk vonnis is vastgesteld dat de vergunninghouder of zijn bestuurders
      het bepaalde bij of krachtens deze wet dan wel de toepasselijke voorschriften inzake arbeidsomstandigheden of
      arbeidstijden hebben overtreden, dan wel bij onherroepelijk vonnis is vastgesteld dat deze het bepaalde bij of
      krachtens deze wet dan wel de toepasselijke voorschriften inzake arbeidsomstandigheden of arbeidstijden in ernstige
      mate hebben overtreden.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel28
