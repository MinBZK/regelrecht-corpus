  - number: 72a
    text: |-
      In afwijking van [artikel 8 van de Instellingswet Autoriteit Consument en Markt][ref1] stellen Onze Minister en de
      Autoriteit Consument en Markt een gemeenschappelijk kader op voor informatie-uitwisseling en samenwerking op het
      gebied van de spoorveiligheid en de concurrentie op de spoorwegmarkt als bedoeld in artikel 56, derde lid, tweede
      alinea, van richtlijn 2012/34/EU.


      [ref1]: https://wetten.overheid.nl/BWBR0033043#Artikel8
    url: https://wetten.overheid.nl/BWBR0015007/2018-01-01#Artikel72a
