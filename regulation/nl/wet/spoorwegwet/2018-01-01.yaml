  - number: '35'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gegeven over de uitvoering van deze paragraaf,
      waaronder regels ten aanzien van:

      a. de verlening, weigering, wijziging, schorsing of intrekking van een veiligheidscertificaat en van een
      proefcertificaat;

      b. de aan een veiligheidscertificaat en een proefcertificaat te verbinden voorschriften en beperkingen;

      c. de bedrijfsprocessen die ten minste in het veiligheidsbeheersysteem zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0015007/2018-01-01#Artikel35
  - number: '36'
    text: |-
      1 Het is een spoorwegonderneming verboden om van hoofdspoorweginfrastructuur gebruik te maken met een spoorvoertuig
      dat voldoet aan alle relevante technische specificaties inzake interoperabiliteit die op het ogenblik van
      indienststelling van kracht zijn, op voorwaarde dat de essentiële eisen voor een groot deel in deze technische
      specificaties inzake interoperabiliteit zijn opgenomen en dat de relevante technische specificatie inzake
      interoperabiliteit inzake rollend materieel in werking is getreden en van toepassing is, waarvoor Onze Minister
      geen vergunning voor indienststelling als bedoeld in het derde lid, respectievelijk aanvullende vergunning voor
      indienststelling als bedoeld in het vijfde lid heeft verleend. Onze Minister kan op aanvraag, na de beheerder te
      hebben gehoord, ontheffing verlenen van dit verbod. De ontheffing kan onder voorwaarden worden verleend. Aan de
      ontheffing kunnen voorschriften worden verbonden.

      2 Het eerste lid geldt niet voor bij algemene maatregel van bestuur met inachtneming van artikel 21 van [richtlijn
      2008/57/EG](32008L0057), aangewezen spoorvoertuigen.

      3 Onze Minister verleent, na de beheerder te hebben gehoord, een vergunning voor indienststelling, indien:

      a. elk subsysteem van het spoorvoertuig voldoet aan de daarvoor geldende technische specificaties inzake
      interoperabiliteit. Indien voor alle structurele subsystemen van een spoorvoertuig een EG-keuringsverklaring is
      afgegeven overeenkomstig de bepalingen van hoofdstuk IV van [richtlijn 2008/57/EG](32008L0057), verleent Onze
      Minister de vergunning voor indienststelling zonder verdere controles;

      b. elk subsysteem van het spoorvoertuig voldoet aan de bij regeling van Onze Minister, met inachtneming van artikel
      17 van [richtlijn 2008/57/EG](32008L0057) vastgestelde, voor dat subsysteem geldende voorschriften ter uitvoering
      van de essentiële eisen van [richtlijn 2008/57/EG](32008L0057);

      c. elk subsysteem van het spoorvoertuig voldoet aan de, bij regeling van Onze Minister daarvoor gegeven
      voorschriften ter uitwerking van de in een of meer technische specificaties inzake interoperabiliteit, bedoeld
      in onderdeel a, opgenomen open punten, anders dan ten behoeve van de verenigbaarheid van een spoorvoertuig met
      de hoofdspoorweginfrastructuur;

      d. elk subsysteem voldoet aan de eisen, bedoeld in artikel 15, eerste en tweede lid, van [richtlijn 2008/57/EG]
      (32008L0057), en

      e. het spoorvoertuig voldoet aan de bij regeling van Onze Minister gestelde voorschriften ten behoeve van de
      verenigbaarheid van een spoorvoertuig met de hoofdspoorweginfrastructuur.

      4 Onze Minister kan op aanvraag, met inachtneming artikel 9 van [richtlijn 2008/57/EG](32008L0057), een voor een
      subsysteem geldende technische specificatie inzake interoperabiliteit buiten toepassing laten.

      5 Onze Minister verleent na de beheerder te hebben gehoord, een aanvullende vergunning voor indienststelling
      indien:

      a. het spoorvoertuig reeds in een andere staat is toegelaten;

      b. een subsysteem van het spoorvoertuig dat is voorzien van een geldige EG-keuringsverklaring voldoet aan de in
      de voor een of meer voor het subsysteem geldende TSI’s opgenomen voorschriften voor de voor Nederland geldende
      specifieke gevallen;

      c. hij voor een subsysteem van het spoorvoertuig zonder geldige EG-keuringsverklaring als bedoeld in artikel 18 van
      [richtlijn 2008/57/EG](32008L0057) geen belangrijk veiligheidsrisico aantoont, en

      d. het spoorvoertuig voldoet aan de voorschriften, bedoeld in het derde lid, onderdeel e.

      6 Het voldoen aan de voorschriften, bedoeld in het derde lid, onderdelen a en b, blijkt uit een geldige EG-
      keuringsverklaring als bedoeld in artikel 18 van [richtlijn 2008/57/EG](32008L0057).

      7 Het voldoen aan de voorschriften, bedoeld in het derde lid, onderdelen c en e, blijkt uit een geldige verklaring
      van een aangemelde instantie of van een keuringsinstantie.

      8 Onze Minister kan aan de vergunning voor indienststelling respectievelijk aanvullende vergunning voor
      indienststelling ten behoeve van de verenigbaarheid van het spoorvoertuig met de hoofdspoorweginfrastructuur
      voorschriften en beperkingen verbinden.

      9 Onze Minister kan op aanvraag, na de beheerder te hebben gehoord, ontheffing verlenen van de voorschriften,
      bedoeld in het derde lid, onderdelen c en e. De ontheffing kan onder beperkingen worden verleend. Aan de ontheffing
      kunnen voorschriften worden verbonden.

      10 Onze Minister kan op aanvraag, met inachtneming van artikel 1, derde lid, van [richtlijn 2008/57/EG]
      (32008L0057), ontheffing verlenen van de technische specificaties respectievelijk de voorschriften, bedoeld in
      het derde lid, onderdelen a respectievelijk b, en van de voorschriften, bedoeld in het vijfde lid, onderdeel b.
      De ontheffing kan onder beperkingen worden verleend. Aan de ontheffing kunnen voorschriften worden verbonden.
      Bij ministeriële regeling kunnen regels worden gesteld ter omschrijving van spoorvoertuigen waarmee op omschreven
      hoofdspoorwegen gebruik gemaakt mag worden en met het oog op het veilig gebruik van die spoorvoertuigen op die
      hoofdspoorwegen alsmede over de procedures die bij ontheffingverlening kunnen gelden.

      11 Bij ministeriële regeling kunnen nadere regels worden gesteld over de toepassing van het eerste lid.
