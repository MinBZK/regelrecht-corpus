  - number: '87'
    text: |-
      1 Overtreding van [artikel 4, vierde lid][ref1], en [artikel 22, eerste lid, onderdelen c en d][ref2], alsmede
      overtreding van de krachtens [hoofdstuk 2][ref3] en de [artikelen 64, tweede lid][ref4], [65, eerste lid][ref5], en
      [hoofdstuk 6, paragraaf 9][ref6] vastgestelde voorschriften, voor zover die overtreding daarbij uitdrukkelijk als
      strafbaar feit is aangemerkt, wordt gestraft met hechtenis van ten hoogste twee maanden of geldboete van de tweede
      categorie.

      2 Overtreding van de [artikelen 3][ref7] en [22, eerste lid, onderdelen a en b][ref8], alsmede overtreding van
      de krachtens [hoofdstuk 6, paragraaf 9][ref9], vastgestelde voorschriften, voor zover die overtreding daarbij
      uitdrukkelijk als strafbaar feit is aangemerkt, wordt gestraft met hechtenis van ten hoogste drie maanden of
      geldboete van de derde categorie.

      3 Overtreding van [artikel 4, eerste, tweede en derde lid][ref10], [artikel 88, derde lid][ref11],
      [artikel 89, tweede, zesde, achtste en negende lid][ref12], wordt gestraft met gevangenisstraf van ten hoogste een
      jaar of geldboete van de vierde categorie.

      4 Bij veroordeling van een persoon die een veiligheidsfunctie uitoefent, wegens overtreding van
      [artikel 4, eerste of tweede lid][ref13], kan hem de bevoegdheid tot het uitoefenen van die functie voor ten
      hoogste vijf jaren worden ontzegd.

      5 Een overtreding die krachtens het eerste lid als strafbaar feit is aangemerkt, wordt niet tevens als beboetbaar
      feit krachtens [artikel 77, eerste lid][ref14], aangemerkt.

      6 De feiten strafbaar gesteld bij dan wel krachtens de in het eerste en tweede lid bedoelde bepalingen zijn
      overtredingen. De in het derde lid strafbaar gestelde feiten zijn misdrijven.


