  - number: 37a
    text: |-
      1 Onze Minister verleent op aanvraag een vergunning voor indienststelling of een aanvullende vergunning voor
      indienststelling voor een type indien hij voor een spoorvoertuig van dat type een dergelijke vergunning heeft
      verleend.

      2 Onze Minister verleent in afwijking van de [artikelen 36, derde en vijfde lid][ref1], en
      [36b, derde en vierde lid][ref2], een vergunning voor indienststelling respectievelijk een aanvullende vergunning
      voor indienststelling, indien het spoorvoertuig overeenstemt met een type dat voorzien is van een geldige
      dergelijke vergunning.

      3 Onze Minister kan de vergunning voor indienststelling voor een type, respectievelijk de aanvullende vergunning
      voor indienststelling voor een type, wijzigen of intrekken indien het type niet of niet langer voldoet aan de
      technische specificaties voor de interoperabiliteitsonderdelen of aan de bij of krachtens de [artikelen 36][ref3]
      of [36b][ref4] geldende eisen op grond waarvan die vergunning is verleend, als die technische specificaties
      of eisen zijn gewijzigd. Indien een spoorvoertuig overeenstemt met een type waarvoor reeds een vergunning voor
      indienststelling is afgegeven, verleent Onze Minister zonder verdere controles een vergunning voor indienststelling
      op basis van een door de aanvrager overgelegde verklaring van overeenstemming met dit type. Indien echter de
      betrokken bepalingen in technische specificaties en nationale voorschriften op grond waarvan voor een voertuigtype
      een vergunning is afgegeven zijn gewijzigd, kan Onze Minister reeds afgegeven vergunningen voor voertuigtypen
      schorsen, wijziging of intrekken. Indien de vergunning moet worden vernieuwd, hebben de criteria die Onze Minister
      controleert alleen betrekking op de gewijzigde voorschriften. De vernieuwing van de typegoedkeuring heeft geen
      invloed op vergunningen voor indienststelling die op grond van eerder goedgekeurde typen zijn afgegeven.

      4 De overeenstemming met een type blijkt uit een verklaring van overeenstemming die voldoet aan de daartoe bij
      regeling van Onze Minister gestelde voorschriften.

      5 In afwijking van [artikel 4:14 van de Algemene wet bestuursrecht][ref5] beslist Onze Minister bij verlenging
      van de beslistermijn op de aanvraag voor de vergunning of aanvullende vergunning, bedoeld in het eerste lid, en
      op de aanvraag voor de vergunning of aanvullende vergunning, bedoeld in het tweede lid, in ieder geval binnen
      vier maanden nadat alle in [artikel 4:2, tweede lid, van de Algemene wet bestuursrecht][ref6] bedoelde informatie
      is verschaft.

      6 In afwijking van [artikel 4:14 van de Algemene wet bestuursrecht][ref7] besluit Onze Minister bij verlenging van
      de beslistermijn over toepassing van het vierde lid in ieder geval binnen vier maanden nadat hij heeft vastgesteld
      dat het type niet of niet langer voldoet aan de bij of krachtens [artikel 36][ref8] en [36b][ref9] gestelde eisen.

      7 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over het onderzoek naar de overeenstemming
      van de productie van het spoorvoertuig waarvoor een vergunning voor indienststelling respectievelijk aanvullende
      vergunning voor indienststelling van het type is verleend, met dat type.


