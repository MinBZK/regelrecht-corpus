  - number: '9'
    text: |-
      1 Het is een beheerder verboden een vernieuwing of verbetering bij hoofdspoorweginfrastructuur in dienst te stellen
      zonder:

      a. voorafgaande indiening van een informatiedossier als bedoeld in het tweede lid, en

      b. een vergunning dan wel nieuwe vergunning voor indienststelling, indien Onze Minister die krachtens het derde lid
      heeft geëist.

      2 Degene die de verbetering of vernieuwing bij hoofdspoorweginfrastructuur aanbesteedt, dient bij Onze Minister een
      informatiedossier in waarin het project beschreven wordt.

      3 Onze Minister eist op basis van het informatiedossier, bedoeld in het tweede lid, een vergunning respectievelijk
      een nieuwe vergunning voor indienststelling, indien de omvang van de voorgenomen verbetering of vernieuwing of de
      mogelijke gevolgen voor de veiligheid van een betrokken subsysteem dat noodzakelijk maakt of maken.

      4 [Artikel 8, tweede, derde en achtste lid][ref1] en het krachtens artikel 8, achtste lid, bepaalde zijn van
      toepassing op de verlening van de vergunning respectievelijk van de nieuwe vergunning voor indienststelling,
      bedoeld in het derde lid, met dien verstande dat die leden van dat artikel toepassing vinden op de verbetering
      of vernieuwing.

      5 Onze Minister kan op aanvraag op andere gronden dan genoemd in artikel 9, eerste lid, van richtlijn 2008/57/EG,
      met inachtneming van artikel 20 van die richtlijn, een of meer technische specificaties inzake interoperabiliteit,
      geheel of gedeeltelijk buiten toepassing laten.

      6 Onze Minister kan op aanvraag voorafgaand aan vergunningverlening als bedoeld in het eerste lid ontheffing
      verlenen van het in het eerste lid genoemde verbod. De ontheffing kan onder beperkingen worden verleend. Aan de
      ontheffing kunnen voorschriften worden verbonden.

      7 Onze Minister neemt een besluit op grond van het derde lid binnen vier maanden na indiening van het
      informatiedossier.

      8 In afwijking van [artikel 4:14 van de Algemene wet bestuursrecht][ref2] neemt Onze Minister bij verlenging van
      de beslistermijn een besluit op grond van het vijfde en zesde lid in ieder geval binnen vier maanden nadat alle in
      [artikel 4:2, tweede lid, van de Algemene wet bestuursrecht][ref3] bedoelde informatie is verschaft.

      9 Het voldoen van het verbeterde of vernieuwde subsysteem aan de krachtens het vierde lid geldende eisen blijkt uit
      de toetsing van een aangemelde instantie of van een keuringsinstantie.


