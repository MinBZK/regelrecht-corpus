  - number: 54a
    text: |-
      Onze Minister kan, met inachtneming van artikel 2, derde lid, van richtlijn 2007/59/EG, ontheffing of vrijstelling
      verlenen van bepalingen van [paragraaf 5][ref1] van dit hoofdstuk. De ontheffing of vrijstelling kan onder
      beperkingen worden verleend. Aan de ontheffing of vrijstelling kunnen voorschriften worden verbonden. Bij
      ministeriële regeling kunnen regels worden gesteld over op welke hoofdspoorwegen en voor welke spoorvoertuigen deze
      ontheffing of vrijstelling mogelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Hoofdstuk3
