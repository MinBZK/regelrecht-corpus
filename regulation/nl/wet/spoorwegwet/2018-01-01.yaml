      1 Met de opsporing van de bij of krachtens deze wet strafbaar gestelde feiten zijn, onverminderd
      [artikel 141 van het Wetboek van Strafvordering][ref1], belast de met betrekking tot deze wet krachtens
      [artikel 17, eerste lid, onderdeel 2°, van de Wet op de economische delicten][ref2] aangewezen
      ambtenaren. Deze ambtenaren zijn tevens belast met de opsporing van de feiten, strafbaar gesteld in de
      [artikelen 179 tot en met 182][ref3] en [184 van het Wetboek van Strafrecht][ref4], voorzover deze feiten
      betrekking hebben op een bevel, vordering of handeling, gedaan of ondernomen door henzelf.

      2 Met de opsporing van de bij of krachtens deze wet strafbaar gestelde feiten zijn voorts belast de bij besluit van
      Onze Minister en Onze Minister van Justitie tezamen aangewezen personen.

      3 Van een besluit als bedoeld in het tweede lid wordt mededeling gedaan door plaatsing in de Staatscourant.


