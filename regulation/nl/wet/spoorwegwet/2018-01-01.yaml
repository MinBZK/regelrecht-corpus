  - number: '60'
    text: |-
      1 Een tussen de beheerder en een gerechtigde gesloten kaderovereenkomst voldoet aan artikel 42 van richtlijn
      2012/34/EU.

      2 Een kaderovereenkomst met een geldigheidsduur van meer dan vijf jaar behoeft de voorafgaande instemming van de
      Autoriteit Consument en Markt.

      3 Bij algemene maatregel van bestuur kunnen ten behoeve van de kaderovereenkomst algemene voorwaarden als
      bedoeld in [artikel 231 van Boek 6 van het Burgerlijk Wetboek][ref1] worden vastgesteld. In dat geval wordt in de
      kaderovereenkomst naar die algemene voorwaarden verwezen.

      4 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot
      kaderovereenkomsten.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel231
    url: https://wetten.overheid.nl/BWBR0015007/2018-01-01#Artikel60
