  - number: '53'
    text: |-
      1 Het is verboden een veiligheidsfunctie anders dan van machinist met volledige bevoegdheid of van machinist met
      beperkte bevoegdheid, binnen het hoofdspoorwegsysteem te doen uitoefenen door een persoon:

      a. die niet voldoet aan [artikel 50, eerste lid][ref1], of

      b. waarvan men weet of redelijkerwijs moet weten dat hij niet voldoet aan de voor de uitoefening van de functie
      krachtens [artikel 49, eerste lid][ref2], gestelde eisen.

      2 Het is verboden de veiligheidsfunctie van machinist met volledige bevoegdheid of van machinist met beperkte
      bevoegdheid binnen het hoofdspoorwegsysteem te doen uitoefenen door een persoon:

      a. die niet voldoet aan [artikel 50, tweede lid][ref3], of

      b. waarvan men weet of redelijkerwijs moet weten dat hij niet voldoet aan de voor de uitoefening van de functie
      krachtens [artikel 49, tweede lid][ref4], gestelde eisen.

      3 Het is verboden de veiligheidsfunctie van machinist met volledige bevoegdheid of van machinist met beperkte
      bevoegdheid te doen uitoefenen door een persoon:

      a. die niet beschikt over een geldige machinistenvergunning;

      b. die niet beschikt over een geldig bevoegdheidsbewijs, of

      c. die niet beschikt over een bevoegdheidsbewijs dat betrekking heeft op de spoorvoertuigen waarmee en op de
      hoofdspoorweginfrastructuur waarvan gebruik wordt gemaakt.

      4 Onze Minister kan het doen uitoefenen van de veiligheidsfunctie van machinist met volledige bevoegdheid of van
      machinist met beperkte bevoegdheid binnen het hoofdspoorwegsysteem door een persoon die volgens hem een ernstige
      bedreiging vormt voor de veiligheid van dat systeem, overeenkomstig artikel 29 van richtlijn 2007/59/EG, voor
      bepaalde of onbepaalde tijd verbieden.


