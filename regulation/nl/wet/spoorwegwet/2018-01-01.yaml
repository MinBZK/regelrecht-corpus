      Bij of krachtens algemene maatregel van bestuur kunnen, met het oog op de veiligheid, regels worden gesteld
      over de bedrijfsvoering en de organisatiestructuur van degene die personen met een veiligheidsfunctie binnen het
      hoofdspoorwegverkeerssysteem beschikbaar stelt.
