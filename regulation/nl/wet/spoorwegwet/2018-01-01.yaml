      1 Een vergunning als bedoeld in artikel 3, onderdeel 14, van richtlijn 2012/34/EU die is verleend door een bevoegde
      instantie van een andere lidstaat aan een aldaar gevestigde spoorwegonderneming, wordt voor de toepassing van deze
      wet gelijkgesteld met een bedrijfsvergunning, verleend op grond van [artikel 28, eerste lid][ref1].

      2 Met een bedrijfsvergunning verleend op grond van [artikel 28, eerste lid][ref2], worden voorts voor de toepassing
      van deze wet gelijkgesteld:

      a. de bij ministeriële regeling omschreven documenten die in het buitenland door het aldaar bevoegde gezag
      zijn afgegeven en die in voldoende mate kunnen gelden als bewijs dat ten minste wordt voldaan aan de in
      [artikel 28, eerste lid][ref3], bedoelde eisen;

      b. een besluit van Onze Minister waarin ten aanzien van een in het buitenland gevestigde spoorwegonderneming is
      verklaard dat ten minste wordt voldaan aan de in [artikel 28, eerste lid][ref4], vermelde eisen.

      3 [Artikel 29][ref5] is van overeenkomstige toepassing op de gelijkstelling krachtens het tweede lid.


