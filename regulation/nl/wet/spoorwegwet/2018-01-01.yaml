  - number: 37b
    text: |-
      1 Het is een spoorwegonderneming verboden om met een verbeterd of vernieuwd spoorvoertuig dat volledig in het
      register, bedoeld in [artikel 37, tweede lid][ref1], is ingeschreven, van hoofdspoorweginfrastructuur gebruik te
      maken zonder:

      a. voorafgaande indiening van een informatiedossier als bedoeld in het tweede lid, en

      b. een vergunning dan wel nieuwe vergunning voor indienststelling, indien Onze Minister die krachtens het derde
      lid, heeft geëist.

      2 Degene die de verbetering of vernieuwing bij een spoorvoertuig aanbesteedt dient bij Onze Minister een
      informatiedossier in, waarin het project beschreven wordt.

      3 Onze Minister eist op basis van het informatiedossier, bedoeld in het tweede lid, een vergunning voor
      indienststelling respectievelijk een nieuwe vergunning voor indienststelling indien de omvang van de voorgenomen
      verbetering of vernieuwing, de mogelijke gevolgen voor de veiligheid van een betrokken subsysteem of de gevolgen
      voor de verenigbaarheid van het spoorvoertuig met de hoofdspoorweginfrastructuur dat noodzakelijk maakt of maken.

      4 De [artikelen 36, derde, vierde en tiende lid][ref2], [36b, derde lid][ref3], en het krachtens het tiende lid van
      artikel 36 bepaalde zijn van toepassing, met dien verstande dat die leden van dat artikel toepassing vinden op de
      verbetering of vernieuwing.

      5 Onze Minister kan op aanvraag, op andere gronden dan genoemd in artikel 9, eerste lid, van richtlijn 2008/57/
      EG en met inachtneming van artikel 20 van die richtlijn, een of meer voor het betrokken subsysteem vastgestelde
      technische specificaties inzake interoperabiliteit buiten toepassing laten.

      6 Onze Minister eist op basis van het informatiedossier, bedoeld in het tweede lid, indien het spoorvoertuig niet
      volledig in het register, bedoeld in [artikel 37, tweede lid][ref4], is ingeschreven, een aanvullende vergunning
      voor indienststelling respectievelijk nieuwe aanvullende vergunning voor indienststelling, indien de gevolgen van
      de verbetering of vernieuwing voor de verenigbaarheid van het spoorvoertuig met de hoofdspoorweginfrastructuur dat
      noodzakelijk maken.

      7 De [artikelen 36, vijfde lid][ref5], [36a, eerste lid][ref6], en [36b, vierde en vijfde lid][ref7], zijn van
      toepassing, met dien verstande dat het slechts toepassing vindt op de verbetering of vernieuwing.

      8 Het is verboden van hoofdspoorweginfrastructuur gebruik te maken met een verbeterd of vernieuwd spoorvoertuig dat
      niet volledig in het register, bedoeld in [artikel 37, tweede lid][ref8], is ingeschreven, zonder:

      a. zonder voorafgaande indiening van een informatiedossier als bedoeld in het tweede lid, en

      b. een aanvullende vergunning voor indienststelling of nieuwe aanvullende vergunning voor indienststelling, indien
      Onze Minister die krachtens het zesde lid heeft geëist.

      9 Het voldoen van de verbetering of vernieuwing bij een spoorvoertuig aan de
      [artikelen 36, derde lid, onderdelen a tot en met c en e][ref9], en [36b, derde lid][ref10], blijkt uit een geldige
      verklaring van een aangemelde instantie of van een keuringsinstantie.

      10 Onze Minister neemt het besluit, bedoeld in het derde en zesde lid, uiterlijk vier maanden na de indiening van
      het volledige informatiedossier als bedoeld in het tweede lid.

      11 In afwijking van [artikel 4:14 van de Algemene wet bestuursrecht][ref11] beslist Onze Minister bij verlenging
      van de beslistermijn op de aanvraag, bedoeld in het vijfde lid, in ieder geval binnen vier maanden nadat alle in
      [artikel 4:2, tweede lid, van de Algemene wet bestuursrecht][ref12] bedoelde informatie is verschaft.


