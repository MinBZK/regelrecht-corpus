  - number: 18a
    text: |-
      1 Een besluit tot verlening of wijziging van een concessie kan worden genomen indien de beheerder niet binnen vier
      dagen na de dag waarop het voorgenomen besluit aan hem is bekendgemaakt aan de concessieverlener heeft doen blijken
      dat hij de concessie niet zonder voorbehoud aanvaardt.

      2 Indien een besluit tot verlening of wijziging van een concessie met inachtneming van het eerste lid is genomen,
      wordt dit besluit binnen vier weken na de dag van bekendmaking van het voorgenomen besluit, bedoeld in het eerste
      lid, gepubliceerd in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0015007/2018-01-01#Artikel18a
  - number: '19'
    text: |-
      1 Ter bescherming van de fysieke integriteit van de hoofdspoorwegen en in het belang van een veilig en ongestoord
      gebruik daarvan, is het binnen de bij of krachtens algemene maatregel van bestuur vast te stellen begrenzingen
      verboden zonder vergunning van Onze Minister gebruik te maken van de hoofdspoorwegen en de daarnaast gelegen
      gronden door:

      a. aan, op, in, onder, boven of naast de hoofdspoorweg, bouwwerken of andere opstallen op te richten of werken,
      inrichtingen, kabels, leidingen of beplantingen aan te brengen, te doen aanbrengen of te hebben, dan wel daarmee
      verband houdende werkzaamheden uit te voeren of te doen uitvoeren;

      b. op, in, onder of naast de hoofdspoorweg vaste stoffen of vloeistoffen te storten of te doen storten, met
      uitzondering van vaste stoffen of vloeistoffen die vrijkomen bij de normale bedrijfsvoering van spoorvoertuigen;

      c. op, in, onder, boven of naast de hoofdspoorweg, voorwerpen te plaatsen of neer te leggen of graafwerk te
      verrichten of deze activiteiten te doen uitvoeren;

      d. licht ontvlambare stoffen te hebben of op te slaan.

      2 De in het eerste lid bedoelde begrenzingen kunnen betrekking hebben op de ruimte naast, onder en boven de
      hoofdspoorweg, zo nodig rekening houdend met de bodemgesteldheid van het terrein waarop en waarin de hoofdspoorweg
      zich bevindt, en kunnen zo nodig verschillend worden vastgesteld al naar gelang de in het eerste lid bedoelde
      handelingen en activiteiten. De begrenzing kan verschillend worden vastgesteld al naar gelang de aard, omvang en
      snelheid van het spoorverkeer op het desbetreffende gedeelte van de hoofdspoorweg.

      3 Het eerste lid is niet van toepassing op het uitvoeren van het beheer van de hoofdspoorweginfrastructuur.

      4 Een vergunning op grond van het eerste lid kan onder beperkingen worden verleend. Aan de vergunning kunnen
      voorschriften worden verbonden in het belang van de in het eerste lid bedoelde doelstellingen. De voorschriften
      kunnen tevens betrekking hebben op het doelmatig gebruik van de hoofdspoorweg en het financieel belang van de Staat
      voor zover dat bij of krachtens algemene maatregel van bestuur is bepaald.

      5 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot het, binnen daarbij aangegeven
      begrenzingen, verrichten van werken, handelingen en activiteiten als bedoeld in het eerste lid, met inachtneming
      van de doelstellingen van dat lid. Ten aanzien van de begrenzingen is het tweede lid van overeenkomstige
      toepassing.

      6 De in het vijfde lid bedoelde regels kunnen onder meer een vrijstelling van de in het eerste lid bedoelde
      vergunningplicht of een verbod op het verrichten van daarbij aangegeven werken, handelingen en activiteiten binnen
      daarbij vast te stellen begrenzingen inhouden, alsmede bijkomende verplichtingen, waaronder het verrichten van
      werken, handelingen en activiteiten te melden, metingen uit te voeren, gegevens te registreren en daarvan opgave te
      doen aan een daarbij aangegeven bestuursorgaan of andere instantie.

      7 Bij ministeriële regeling kunnen over de uitvoering van dit artikel nadere regels worden gesteld, waaronder
      regels in verband met de inwerkingtreding en het toepasselijk zijn van regels.
    url: https://wetten.overheid.nl/BWBR0015007/2018-01-01#Artikel19
  - number: '22'
    text: |-
      1 Het is verboden:

      a. anders dan als rechtmatige gebruiker in te grijpen in de bediening of de werking van installaties van de
      hoofdspoorweginfrastructuur;

      b. de hoofdspoorweginfrastructuur of delen daarvan te beschadigen, te vernielen, te verwijderen, af te breken, te
      verstoren, te verplaatsen of in enig opzicht te wijzigen;

      c. zich op of langs gedeelten van een hoofdspoorweg, met uitzondering van een perron, die niet zijn gelegen in een
      gelijkvloerse kruising met een weg of in een voor het openbaar verkeer openstaande weg, te bevinden of daarop of
      daarlangs dieren te drijven of te laten lopen;

      d. enige handeling op of nabij de hoofdspoorweg te verrichten waardoor het beheer van de
      hoofdspoorweginfrastructuur kan worden gehinderd of belemmerd.

      2 Het eerste lid is niet van toepassing op:

      a. het uitvoeren van het beheer;

      b. de uitoefening van een veiligheidsfunctie;

      c. de uitoefening van een wettelijke taak;

      d. het uitvoeren van werkzaamheden in opdracht van een spoorwegonderneming die beschikt over een
      veiligheidscertificaat als bedoeld in [artikel 32, eerste lid][ref1], of een proefcertificaat als bedoeld in
      [artikel 34][ref2];

      e. de uitoefening van het houderschap van een spoorvoertuig en de uitoefening van werkzaamheden aan een
      spoorvoertuig in opdracht van de houder van het spoorvoertuig, en

      f. de uitoefening van opleidingsactiviteiten voor een veiligheidsfunctie en de beoordeling op het voldoen aan de
      eisen voor een veiligheidsfunctie;

      g. de uitoefening van overige activiteiten in opdracht van de beheerder.

      3 Onze Minister kan ontheffing verlenen van het in het eerste lid vervatte verbod.
      [Artikel 19, vierde lid, tweede en derde volzin][ref3], is van overeenkomstige toepassing.

      4 In het belang van de bescherming van de fysieke integriteit van de hoofdspoorweginfrastructuur en in het belang
      van een veilig en ongestoord gebruik daarvan, kunnen bij ministeriële regeling over de uitvoering van dit artikel
      regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0015007#Artikel19
