  - number: '67'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur wordt geregeld in welke gevallen, onder welke voorwaarden en
      volgens welke procedures een spoorwegonderneming recht heeft op:

      a. toegang tot bij of krachtens algemene maatregel van bestuur omschreven spoorweginfrastructuur;

      b. toegang tot bij of krachtens algemene maatregel van bestuur omschreven dienstvoorzieningen of een deel van
      dienstvoorzieningen;

      c. verlening van bij of krachtens algemene maatregel van bestuur omschreven diensten in dienstvoorzieningen of
      diensten.

      2 Bij of krachtens algemene maatregel van bestuur wordt geregeld in welke gevallen, onder welke voorwaarden en
      volgens welke procedures een exploitant van een dienstvoorziening verplicht is tot het verlenen van toegang als
      bedoeld in het eerste lid, onderdelen a en b, en tot het verlenen van diensten als bedoeld in het eerste lid,
      onderdeel c.

      3 Bij de regels, bedoeld in het eerste en tweede lid, kan onderscheid worden gemaakt naar soort exploitant van
      een dienstvoorziening, soort spoorweginfrastructuur, soort dienstvoorziening en soort dienst. Die regels kunnen
      in ieder geval inhouden dat een exploitant van een dienstvoorziening als bedoeld in artikel 13, derde lid, van
      richtlijn 2012/34/EU een gescheiden boekhouding of een afzonderlijke administratie binnen de boekhouding voert en
      deze ter inzage legt.

      4 Wanneer een dienstvoorziening, voor zover dit een dienstvoorziening betreft als bedoeld in bijlage II, punt 2,
      van richtlijn 2012/34/EU, gedurende ten minste twee opeenvolgende jaren niet is gebruikt en een spoorwegonderneming
      of andere gegadigde aan de exploitant van die dienstvoorziening zijn belangstelling heeft laten blijken
      voor toegang tot die dienstvoorziening, op basis van aangetoonde behoeften, biedt de eigenaar of de bevoegde
      zakelijk gerechtigde de exploitatie van die dienstvoorziening geheel of gedeeltelijk aan voor huur of lease als
      dienstvoorziening, tenzij de exploitant van die dienstvoorziening aantoont dat de dienstvoorziening vanwege een
      lopend reconversieproces niet door een spoorwegonderneming kan worden gebruikt.

      5 Voor zover dit noodzakelijk is voor de aanbieding voor huur of lease, bedoeld in het vierde lid, verleent de
      exploitant of verlenen de exploitanten van die dienstvoorziening medewerking aan die huur of lease.

      6 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld ter uitvoering van het vierde
      en vijfde lid.

      7 De voordracht voor een krachtens het eerste of tweede lid vast te stellen algemene maatregel van bestuur wordt
      niet eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0015007/2018-01-01#Artikel67
  - number: '68'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de voorwaarden en methoden voor
      berekening van vergoedingen die exploitanten van dienstvoorzieningen aan spoorwegondernemingen in rekening
      brengen voor het verlenen van toegang tot spoorweginfrastructuur en dienstvoorzieningen als bedoeld in
      [artikel 67, eerste lid, onderdelen a en b][ref1], alsmede voor het verlenen van diensten in dienstvoorzieningen of
      diensten als bedoeld in artikel 67, eerste lid, onderdeel c.

      2 Bij de regels, bedoeld in het eerste lid, kan onderscheid worden gemaakt naar soort exploitant van een
      dienstvoorziening, soort spoorweginfrastructuur, soort dienstvoorziening en soort dienst. Die regels kunnen in
      ieder geval inhouden dat een exploitant van een dienstvoorziening een gescheiden boekhouding of een afzonderlijke
      administratie binnen de boekhouding voert en deze ter inzage legt.

      3 Exploitanten van dienstvoorzieningen tonen desgevraagd aan spoorwegondernemingen aan dat vergoedingen als
      bedoeld in het eerste lid, die aan die spoorwegondernemingen in rekening zijn gebracht, voldoen aan de bij algemene
      maatregel van bestuur vastgestelde voorwaarden en methoden van berekening van vergoedingen als bedoeld in het
      eerste lid en aan de netverklaring.

      4 Exploitanten van dienstvoorzieningen wenden de vergoedingen, bedoeld in het eerste lid, aan om hun onderneming
      van middelen te voorzien.

      5 De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel67
