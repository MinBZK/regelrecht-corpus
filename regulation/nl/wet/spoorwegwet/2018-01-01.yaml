  - number: '18'
    text: |-
      1 Onze Minister kan een concessie geheel of gedeeltelijk intrekken indien de beheerder de concessie of een voor de
      beheerder geldend wettelijk voorschrift niet naleeft.

      2 Onze Minister gaat niet tot intrekking over dan nadat hij de beheerder de gelegenheid heeft geboden om binnen
      een daartoe te bepalen termijn zijn handelen alsnog in overeenstemming te brengen met de concessie, dan wel het
      wettelijk voorschrift.

      3 Voordat Onze Minister een concessie verleent, wijzigt of geheel of gedeeltelijk intrekt, stelt hij betrokken
      gerechtigden als bedoeld in [artikel 57][ref1] in de gelegenheid om gedurende een door Onze Minister daarbij te
      bepalen termijn van ten hoogste drie weken hun zienswijze naar voren te brengen.

      4 Een concessie wordt niet eerder verleend dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal
      is overgelegd.

      5 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over het verlenen of wijzigen van een
      concessie en over de aan een concessie te verbinden voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel57
