  - number: '44'
    text: |-
      1 Indien Onze Minister vaststelt dat een interoperabiliteitsonderdeel, ondanks het feit dat ten aanzien daarvan een
      EG-verklaring van conformiteit of geschiktheid voor gebruik als bedoeld in artikel 13, eerste lid, van [richtlijn
      2008/57/EG](32008L0057) is afgegeven en ondanks het feit dat het onderdeel overeenkomstig zijn bestemming wordt
      gebruikt, de veiligheid van het verkeer op de hoofdspoorwegen of interoperabiliteit als bedoeld in artikel 2,
      onderdeel b, van richtlijn 2008/57/EG in gevaar brengt, neemt hij met toepassing van artikel 14 van die richtlijn
      maatregelen om het toepassingsgebied van dit onderdeel te beperken, het gebruik ervan te verbieden of het uit de
      handel te doen nemen.

      2 Onze Minister besluit binnen vier maanden, nadat hij heeft vastgesteld dat een interoperabiliteitsonderdeel de
      veiligheid van het verkeer op de hoofdspoorwegen of interoperabiliteit in gevaar brengt, als bedoeld in het eerste
      lid, over de maatregelen bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0015007/2018-01-01#Artikel44
  - number: '46'
    text: |-
      1 Voor elk spoorvoertuig waaraan Onze Minister een voertuignummer als bedoeld in [artikel 37, zesde lid][ref1],
      heeft toegekend, is er een met het onderhoud belaste entiteit.

      2 Het eerste lid geldt niet voor bij ministeriële regeling met inachtneming van artikel 2 van richtlijn 2004/49/EG
      aangewezen spoorvoertuigen.

      3 De met het onderhoud belaste entiteit kan een spoorwegonderneming of infrastructuurbeheerder als bedoeld in
      artikel 3, onderdeel 2, van richtlijn 2012/34/EU of de houder van het spoorvoertuig zijn.

      4 De houder beschikt over een geldig onderhoudscertificaat indien hij de met onderhoud belaste entiteit is van een
      of meer goederenwagens en geen spoorwegonderneming of infrastructuurbeheerder als bedoeld in artikel 3, onderdeel
      2, van richtlijn 2012/34/EU.

      5 Onze Minister verleent op aanvraag een onderhoudscertificaat indien de houder voldoet aan de daartoe bij regeling
      van Onze Minister met inachtneming van artikel 14bis van richtlijn 2004/49/EG vastgestelde eisen.

      6 Een door een daartoe bevoegde instantie met inachtneming van artikel 14bis van richtlijn 2004/49/EG verleende
      certificering wordt met een onderhoudscertificaat als bedoeld in het vierde lid gelijkgesteld.

      7 De met het onderhoud belaste entiteit draagt er zorg voor dat het spoorvoertuig in veilige staat is en
      overeenkomstig de bepalingen in de toepasselijke technische specificaties inzake interoperabiliteit wordt
      onderhouden.

      8 Onze Minister kan het gebruik met een spoorvoertuig van hoofdspoorweginfrastructuur verbieden indien ter zake van
      het spoorvoertuig niet voldaan wordt aan het zevende lid.

      9 De met het onderhoud belaste entiteit is degene die als zodanig in het register, bedoeld in
      [artikel 37, tweede lid][ref2], is ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel37
