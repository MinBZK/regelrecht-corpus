      1 De beheerder draagt er zorg voor dat werkzaamheden aan en nabij de hoofdspoorweg ten behoeve van de
      hoofdspoorweginfrastructuur veilig plaatsvinden. De beheerder treft hiertoe maatregelen waardoor het spoorverkeer
      en de uitvoering van werkzaamheden geen gevaar voor elkaar opleveren.

      2 Bij ministeriële regeling kunnen regels worden gesteld over de veilige uitvoering van werkzaamheden aan of nabij
      de hoofdspoorweg.
    url: https://wetten.overheid.nl/BWBR0015007/2018-01-01#Artikel64
  - number: '65'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden met het oog op een veilig en ongestoord gebruik van
      hoofdspoorwegen regels gesteld. Deze regels kunnen onder meer betrekking hebben op:

      a. aard, uitvoering, plaatsing, bediening en betekenis van seinen;

      b. bewegingen met spoorvoertuigen;

      c. het rijden met spoorvoertuigen op de openbare weg;

      d. het gebruik van overwegen en overpaden;

      e. verplichtingen – in verband met storingen, ongevallen, incidenten en andere onregelmatigheden – van
      spoorwegondernemingen, bestuurders van een spoorvoertuig en andere personen die deelnemen aan het verkeer over
      de hoofdspoorweg.

      2 Een ieder die zich op de hoofdspoorweg bevindt, neemt de voor hem bestemde seinen in acht.
    url: https://wetten.overheid.nl/BWBR0015007/2018-01-01#Artikel65
  - number: '66'
    text: |-
      1 Onze Minister kan onderzoek verrichten naar de oorzaken van ongevallen en incidenten op hoofdspoorwegen en naar
      andere onregelmatigheden in de afwikkeling van het spoorverkeer waardoor de veiligheid van het spoorverkeer of van
      daarbij betrokken personen in gevaar is gebracht of in gevaar gebracht had kunnen worden, indien hij dit onderzoek
      nodig acht ter evaluatie van de wettelijke voorschriften en het beleid op het terrein van de veiligheid van het
      spoorverkeer.

      2 Ten behoeve van het onderzoek hebben de door Onze Minister aangewezen ambtenaren jegens
      spoorwegondernemingen en de beheerder de bevoegdheden, bedoeld in de [artikelen 5:15][ref1] tot
      en met [5:19 van de Algemene wet bestuursrecht][ref2]. De [artikelen 5:12][ref3], [5:13][ref4] en
      [5:20 van de Algemene wet bestuursrecht][ref5] zijn van overeenkomstige toepassing.

      3 Onze Minister onthoudt zich van het onderzoek naar de oorzaken van ongevallen en incidenten op hoofdspoorwegen
      voorzover de Onderzoeksraad voor veiligheid naar het betreffende voorval een onderzoek instelt.


