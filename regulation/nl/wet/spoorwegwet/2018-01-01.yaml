  - number: '71'
    text: |-
      1 Een gerechtigde als bedoeld in [artikel 57][ref1], een spoorwegonderneming, een partij bij een
      toegangsovereenkomst of een kaderovereenkomst als bedoeld in [hoofdstuk 4][ref2] of een andere betrokken partij kan
      bij de Autoriteit Consument en Markt schriftelijk een aanvraag indienen om te onderzoeken of door een beheerder,
      een exploitant van een dienstvoorziening, een spoorwegonderneming jegens de aanvrager sprake is van:

      a. oneerlijke behandeling, discriminatie of anderszins van benadeling als bedoeld in artikel 56, eerste lid, van
      richtlijn 2012/34/EU;

      b. gedrag van een wederpartij bij een toegangsovereenkomst of een kaderovereenkomst dat leidt tot oneerlijke
      behandeling, discriminatie of anderszins van benadeling;

      c. onterechte weigering van toegang tot een dienstvoorziening in geval van een conflict als bedoeld in artikel 13,
      vijfde lid, van richtlijn 2012/34/EU.

      2 De Autoriteit Consument en Markt neemt een besluit inzake een aanvraag als bedoeld in het eerste lid.

      3 Indien de Autoriteit Consument en Markt besluit dat toegang tot een dienstvoorziening als bedoeld in artikel 13,
      vijfde lid, van richtlijn 2012/34/EU ten onrechte is geweigerd, neemt zij voor zover nodig maatregelen om ervoor te
      zorgen dat een passend deel van de beschikbare capaciteit voor de betreffende dienstvoorziening wordt toegekend aan
      de desbetreffende spoorwegonderneming.

      4 De Autoriteit Consument en Markt kan zo nodig een last onder dwangsom opleggen.

      5 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de voor het onderzoek te
      verstrekken gegevens en bescheiden en de daarmee samenhangende uitwerking.

      6 De Autoriteit Consument en Markt stelt met inachtneming van artikel 56, achtste en negende lid, van
      richtlijn 2012/34/EU de termijnen vast waarbinnen zij een besluit als bedoeld in het tweede lid neemt,
      alsmede de termijnen voor het verstrekken van de voor het onderzoek benodigde gegevens en bescheiden.
      [Artikel 4:15 van de Algemene wet bestuursrecht][ref3] is van overeenkomstige toepassing op alle partijen waarbij
      de Autoriteit Consument en Markt in het kader van de besluitvorming informatie opvraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Hoofdstuk4
