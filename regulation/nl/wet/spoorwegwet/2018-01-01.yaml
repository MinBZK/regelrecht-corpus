  - number: '24'
    text: |-
      1 Onverminderd de bij of krachtens andere wetten ter zake gegeven voorschriften wordt aanraking, doorsnijding
      of overbrugging van andere infrastructuur van openbaar nut door hoofdspoorwegen waarvan de aanleg vanwege het
      Rijk is opgedragen of toegestaan, gedoogd door de rechthebbende ten aanzien van die andere infrastructuur. Onder
      infrastructuur van openbaar nut wordt in ieder geval begrepen infrastructuur waarvan het beheer bij of krachtens
      wet is opgedragen en infrastructuur in beheer bij een openbaar lichaam.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over financiering, onderhoud,
      instandhouding, aanleg, uitbreiding, gedeeld gebruik en verdeling van de gebruiksmogelijkheden van kunstwerken
      voorzover deze dienen tot aanraking, doorsnijding of overbrugging als bedoeld in het eerste lid.

      3 Een hoofdspoorweg die is of wordt aangelegd, hersteld, vernieuwd of uitgebreid, wordt voor de toepassing van de
      [Belemmeringenwet Verordeningen][ref1] en de [Belemmeringenwet Privaatrecht][ref2] aangemerkt als openbaar werk van
      algemeen nut.


      [ref1]: https://wetten.overheid.nl/BWBR0001865
      [ref2]: https://wetten.overheid.nl/BWBR0001936
