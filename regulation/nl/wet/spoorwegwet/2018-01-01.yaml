      Een wijziging of aanvulling van richtlijn 2012/34/EU, richtlijn 2004/49/EG, richtlijn 2007/59/EG en van richtlijn
      2008/57/EG gaat voor de toepassing van deze wet en de daarop berustende bepalingen gelden met ingang van de dag
      waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven, tenzij bij ministerieel besluit, dat in
      de Staatscourant wordt bekend gemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0015007/2018-01-01#Artikel92
  - number: '93'
    text: |-
      1 Onze Minister erkent op aanvraag:

      a. aangemelde instanties;

      b. de instanties, belast met de toetsing, bedoeld in [artikel 8, zesde lid][ref1], [artikel 9, zevende lid][ref2],
      [artikel 36, zevende lid][ref3], [artikel 36b, negende lid][ref4], en [artikel 37b, negende lid][ref5].

      2 De instanties, de directeur en het personeel daarvan voldoen ten minste aan de toepasselijke eisen, neergelegd in
      bijlage VIII van [richtlijn 2008/57/EG](32008L0057), en aan de bij ministeriële regeling vastgestelde eisen.

      3 Aan de erkenning kunnen voorschriften en beperkingen worden verbonden.

      4 De instanties verrichten hun werkzaamheden met inachtneming van de toepasselijke bepalingen in bijlage VI
      van richtlijn 2008/57/EG en het Besluit nr. 93/465/EEG van de Raad van de Europese Gemeenschappen van 22 juli
      1993 betreffende de modules voor de verschillende fasen van de overeenstemmingsbeoordelingsprocedures en de
      voorschriften inzake het aanbrengen en het gebruik van de CE-markering van overeenstemming (PbEG L 220).

      5 De instanties stellen na elk onderzoek een onderzoekscertificaat op, in voorkomend geval met vermelding van de
      geldigheidsduur en van de voorwaarden waaronder het geldig is.

      6 Onze Minister trekt de erkenning, bedoeld in het eerste lid, in indien de betrokken instantie niet langer voldoet
      aan de toepasselijke eisen van bijlage VIII van richtlijn 2008/57/EG onderscheidenlijk bijlage VI van richtlijn
      2008/57/EG. Onze Minister kan de erkenning intrekken, indien de betrokken instantie niet langer voldoet aan bijlage
      VIII van richtlijn 2008/57/EG onderscheidenlijk bijlage VI van richtlijn 2008/57/EG of de bij ministeriële regeling
      vastgestelde eisen, bedoeld in het tweede lid.

      7 Onze Minister doet mededeling van een erkenning of van een intrekking van een erkenning door kennisgeving in
      de Staatscourant.


