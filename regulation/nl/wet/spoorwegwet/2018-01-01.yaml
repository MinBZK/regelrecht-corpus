  - number: 71a
    text: |-
      1 Bij de werving, selectie en benoeming van de leden van de Autoriteit Consument en Markt draagt Onze Minister van
      Economische Zaken er zorg voor dat onder de leden passende beroepsbekwaamheid en relevante ervaring bij voorkeur op
      het gebied van spoorwegen of andere netwerkindustrieën zijn vertegenwoordigd.

      2 Een lid van de Autoriteit Consument en Markt neemt geen deel aan de behandeling van en de besluitvorming over
      aangelegenheden die een onderneming uit de spoorwegsector betreffen waarmee hij gedurende het jaar voorafgaand aan
      de start van een procedure een directe of indirecte band onderhield.

      3 Een lid van de Autoriteit Consument en Markt bekleedt gedurende een periode van ten minste een jaar na de datum
      waarop zijn benoeming bij die autoriteit is beëindigd, geen beroepsfunctie of beroepsverantwoordelijkheid bij een
      onderneming of instantie uit de spoorwegsector.
    url: https://wetten.overheid.nl/BWBR0015007/2018-01-01#Artikel71a
  - number: '72'
    text: |-
      1 In afwijking van [artikel 7, eerste lid, van de Instellingswet Autoriteit Consument en Markt][ref1] en
      onverminderd artikel 7, derde lid, van die wet, verstrekt de Autoriteit Consument en Markt de gegevens
      en inlichtingen, bedoeld in artikel 57 van richtlijn 2012/34/EU, alsmede de door de Europese Commissie
      gevraagde informatie ten behoeve van de door die Commissie vast te stellen gedelegeerde handelingen of
      uitvoeringsmaatregelen, bedoeld in richtlijn 2012/34/EU.

      2 [Artikel 7, vierde lid, onderdeel a, van de Instellingswet Autoriteit Consument en Markt][ref2] is niet van
      toepassing op de verstrekking van de gegevens, inlichtingen en informatie, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0033043#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0033043#Artikel7
    url: https://wetten.overheid.nl/BWBR0015007/2018-01-01#Artikel72
