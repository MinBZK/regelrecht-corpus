        artikel: '231'
  - number: '61'
    text: |-
      1 Bij algemene maatregel van bestuur worden regels gesteld over de verdeling van capaciteit. Die regels kunnen
      strekken ter bescherming van het milieu.

      2 Bij de algemene maatregel van bestuur, bedoeld in het eerste lid, worden minimale niveaus van capaciteit
      vastgesteld voor daarbij aangegeven deelmarkten van het goederenvervoer en het personenvervoer en worden regels
      gesteld over de prioriteitscriteria, bedoeld in artikel 47, derde tot en met vijfde lid, van richtlijn 2012/34/EU.

      3 Bij de algemene maatregel van bestuur, bedoeld in het eerste lid, wordt bepaald in welke gevallen capaciteit tot
      een bepaald tijdstip is voorbehouden voor bepaalde soorten gebruik van de hoofdspoorwegen en vanaf welk tijdstip
      deze capaciteit beschikbaar is voor ander gebruik.

      4 De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0015007/2018-01-01#Artikel61
  - number: '62'
    text: |-
      1 Een spoorwegonderneming die een toegangsovereenkomst sluit, is voor het gebruik van hoofdspoorweginfrastructuur
      aan de beheerder ten minste een vergoeding voor het gebruik van hoofdspoorweginfrastructuur met het oog op het
      minimumtoegangspakket verschuldigd. Deze vergoeding is de heffing, bedoeld in artikel 31, derde lid, van richtlijn
      2012/34/EU.

      2 De vergoeding, bedoeld in het eerste lid, kan de heffingen, bedoeld in het zesde lid, onderdelen a en b,
      omvatten.

      3 Onverminderd het tweede lid, kan de vergoeding, bedoeld in het eerste lid, worden vermeerderd met de heffingen en
      bijtellingen, bedoeld in het zesde lid, onderdelen c, d, f en g, of verminderd met de korting, bedoeld in het zesde
      lid, onderdeel e, en de aftrek, bedoeld in het zesde lid, onderdeel f.

      4 Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot het kader, bedoeld in
      artikel 29, eerste lid, van richtlijn 2012/34/EU.

      5 De in het vierde lid bedoelde regels omvatten regels met betrekking tot:

      a. de aan het aan spoorwegondernemingen aangeboden minimumtoegangspakket, bedoeld in het eerste lid, toe te rekenen
      kosten en de methode voor toerekening van die kosten, bedoeld in artikel 30, achtste lid, van richtlijn 2012/34/EU;

      b. de toepassing van de modaliteiten, bedoeld in artikel 31, derde lid, van richtlijn 2012/34/EU en de wijze van
      invoering ervan.

      6 De in het vierde lid bedoelde regels kunnen mede regels omvatten met betrekking tot:

      a. een heffing voor het capaciteitsgebrek van gespecificeerde hoofdspoorweginfrastructuur tijdens periodes van
      overbelasting als bedoeld in artikel 31, vierde lid, van richtlijn 2012/34/EU;

      b. een heffing in verband met de kosten van milieueffecten van de treinexploitatie als bedoeld in artikel 31,
      vijfde lid, van richtlijn 2012/34/EU;

      c. een extra heffing als bedoeld in artikel 32, eerste lid, van richtlijn 2012/34/EU, om zo mogelijk volledige
      dekking van de door de beheerder gemaakte kosten te verkrijgen;

      d. een heffing, met betrekking tot bij of krachtens algemene maatregel van bestuur aangewezen
      hoofdspoorweginfrastructuur, die mede strekt ter dekking van door een ander dan de beheerder gemaakte kosten van
      investeringsprojecten als bedoeld in artikel 32, derde lid, van richtlijn 2012/34/EU;

      e. een korting als bedoeld in artikel 33 van richtlijn 2012/34/EU;

      f. een bijtelling dan wel aftrek in verband met verstoringen van de hoofdspoorweginfrastructuur of met het oog
      op verbetering van de prestaties van de hoofdspoorweginfrastructuur als bedoeld in artikel 35, eerste lid, van
      richtlijn 2012/34/EU;

      g. een heffing voor overeengekomen, maar niet benutte capaciteit als bedoeld in artikel 36 van richtlijn 2012/34/
      EU.

      7 De in het vierde lid bedoelde regels kunnen tevens regels bevatten over de maatstaven en nadere regels over de
      hoogte van de in het eerste lid bedoelde vergoeding.

      8 De vergoeding en de heffingen, bedoeld in het eerste en zesde lid, onderdelen a en b, mogen overeenkomstig
      artikel 31, zesde lid, van richtlijn 2012/34/EU evenredig worden verdeeld over een voldoende aantal treindiensten
      en tijden.

      9 De vergoedingen en heffingen, bedoeld in dit artikel worden door de spoorwegondernemingen aan de beheerder
      betaald.

      10 De beheerder werkt samen met buitenlandse infrastructuurbeheerders met het oog op de invoering van efficiënte
      heffingsregelingen, het coördineren van heffingen en het heffen van rechten voor de exploitatie van treindiensten
      die de landsgrenzen overschrijden, met inachtneming van artikel 37 van richtlijn 2012/34/EU.

      11 De voordracht van een krachtens het vierde lid vast te stellen algemene maatregel van bestuur wordt niet gedaan
      dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0015007/2018-01-01#Artikel62
  - number: '63'
    text: |-
      1 De beheerder stelt een methode vast voor de toerekening van de kosten aan het aan spoorwegondernemingen
      aangeboden minimumtoegangspakket als bedoeld in artikel 30, achtste lid, van richtlijn 2012/34/EU, zulks met
      inachtneming van het krachtens [artikel 62, vijfde lid][ref1], bepaalde.

      2 De methode van toerekening, bedoeld in het eerste lid, behoeft de goedkeuring van de Autoriteit Consument en
      Markt. Op de voorbereiding van een goedkeuringsbesluit is [afdeling 3.4 van de Algemene wet bestuursrecht][ref2]
      van toepassing. Onverminderd [artikel 3:15 van de Algemene wet bestuursrecht][ref3], kunnen gerechtigden hun
      zienswijze naar voren brengen over het voorgenomen goedkeuringsbesluit.

      3 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de goedkeuring,
      bedoeld in het tweede lid, en de daartoe te volgen procedure.

      4 De beheerder toont desgevraagd aan een spoorwegonderneming als bedoeld in [artikel 62, eerste lid][ref4], aan
      dat de overeenkomstig artikel 62 vastgestelde vergoeding en heffingen die aan die spoorwegonderneming in rekening
      zijn gebracht, voldoen aan de bij of krachtens artikel 62, eerste tot en met zevende lid, gestelde regels en aan de
      methode van toerekening, bedoeld in het eerste lid.

      5 De beheerder wendt de door hem ontvangen vergoedingen, bedoeld in
      [artikel 62, eerste, tweede en derde lid][ref5], aan om zijn onderneming van middelen te voorzien.


