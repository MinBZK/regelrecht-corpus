  - number: '28'
    text: |-
      1 Onze Minister verleent op aanvraag een bedrijfsvergunning aan een in Nederland gevestigde onderneming, indien
      deze voldoet aan de vereisten van goede naam, financiële draagkracht en beroepsbekwaamheid alsmede de uit
      [artikel 55][ref1] voortvloeiende verzekeringsplicht.

      2 Onze Minister kan voor bij of krachtens algemene maatregel van bestuur omschreven soorten van gebruik van de
      hoofdspoorweg, bij de verlening van een bedrijfsvergunning een of meer van de bij of krachtens algemene maatregel
      van bestuur aangewezen, in het eerste lid bedoelde eisen geheel of gedeeltelijk buiten toepassing laten. Alsdan is
      een zodanige beperkte bedrijfsvergunning slechts geldig voor het gebruik waarvoor deze is verleend.

      3 Onze Minister beslist binnen dertien weken op de aanvraag.

      4 Aan de vergunning kunnen voorschriften worden verbonden. De vergunning wordt verleend voor onbepaalde tijd.

      5 Onze Minister kan ambtshalve of op aanvraag van de vergunninghouder de vergunning wijzigen, alsnog voorschriften
      aan de vergunning verbinden en de aan de vergunning verbonden voorschriften aanvullen dan wel wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel55
    url: https://wetten.overheid.nl/BWBR0015007/2018-01-01#Artikel28
