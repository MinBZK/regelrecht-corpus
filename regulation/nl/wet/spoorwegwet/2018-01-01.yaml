preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het gelet op richtlijnen 91/440/EEG, 95/18/EG, 96/48/EG, 2001/12/EG,
    2001/13/EG, 2001/14/EG en 2001/16/EG en mede gelet op het belang van de bescherming van het milieu noodzakelijk
    is wettelijke bepalingen vast te stellen inzake de aanleg, het beheer en het gebruik van spoorwegen en dat het
    ter bevordering van een maatschappelijk gewenste benutting van spoorwegen wenselijk is, de verantwoordelijkheid
    van de overheid voor de aanleg van spoorweginfrastructuur vast te leggen, de verantwoordelijkheid voor
    vervoer en spoorweginfrastructuur te scheiden en de publieke belangen die gemoeid zijn met het beheer van
    spoorweginfrastructuur te verzekeren door de invoering van een concessiestelsel voor het beheer, het gebruik van
    spoorwegen te bevorderen door het stellen van transparante en niet-discriminerende voorschriften en dat het voorts
    wenselijk is de wetgeving inzake de spoorwegen overigens te moderniseren;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0015007/2018-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *aangemelde instantie:* aangemelde instantie als bedoeld in artikel 2, onderdeel j, van richtlijn 2008/57/EG;
        - *Autoriteit Consument en Markt:* de Autoriteit Consument en Markt, genoemd in
      [artikel 2, eerste lid, van de Instellingswet Autoriteit Consument en Markt][ref1];
        - *beheerder:* houder van een concessie als bedoeld in [artikel 16, eerste lid][ref2];
        - *bevoegdheidsbewijs:* bevoegdheidsbewijs als bedoeld in artikel 3, onderdeel j, van richtlijn 2007/59/EG;
        - *bijzondere spoorweg:* spoorweg die niet is aangewezen als lokale spoorweg op grond van
      [artikel 2, tweede lid, van de Wet lokaal spoor][ref3], en niet als hoofdspoorweg op grond van [artikel 2][ref4]
      van deze wet;
        - *capaciteit:* capaciteit van de hoofdspoorweginfrastructuur;
        - *dienstvoorziening:* dienstvoorziening als bedoeld in artikel 3, onderdeel 11, van richtlijn 2012/34/EU;
        - *exploitant van een dienstvoorziening:* exploitant van een dienstvoorziening als bedoeld in artikel 3, onderdeel
      12, van richtlijn 2012/34/EU;
        - *gebruik van een hoofdspoorweg:* het met een spoorvoertuig rijden over of stilstaan op een hoofdspoorweg;
        - *gerechtigde:* gerechtigde als bedoeld in [artikel 57][ref5];
        - *hoofdspoorweg:* op grond van [artikel 2][ref6] als hoofdspoorweg aangewezen spoorweg;
        - *hoofdspoorweginfrastructuur:* spoorweginfrastructuur, waarbij de spoorwegen als hoofdspoorwegen zijn aangewezen;
        - *houder van het spoorvoertuig:* de persoon of entiteit die eigenaar is van een spoorvoertuig of het
      recht heeft het te gebruiken, het exploiteert als vervoermiddel en als houder in het register, bedoeld in
      [artikel 37, tweede lid][ref7], is ingeschreven;
        - *internationale passagiersvervoerdienst:* internationale passagiersvervoerdienst als bedoeld in artikel 3,
      onderdeel 5, van richtlijn 2012/34/EU;
        - *interoperabiliteitsonderdeel:* interoperabiliteitsonderdeel als bedoeld in artikel 2, onderdeel f, van richtlijn
      2008/57/EG;
        - *kaderovereenkomst:* kaderovereenkomst als bedoeld in artikel 42 van richtlijn 2012/34/EU;
        - *keuringsinstantie:* instantie aangewezen op grond van [artikel 93][ref8];
        - *lidstaat:* lidstaat van de Europese Unie of een andere staat die partij is bij de Overeenkomst betreffende de
      Europese Economische Ruimte;
        - *machinistenvergunning:* vergunning als bedoeld in artikel 4 van richtlijn 2007/59/EG;
        - *minimumtoegangspakket:* het minimumtoegangspakket, bedoeld in bijlage II, punt 1, bij richtlijn 2012/34/EU;
        - *netverklaring:* netverklaring als bedoeld in artikel 27 van richtlijn 2012/34/EU;
        - *Onze Minister:* Onze Minister van Infrastructuur en Milieu;
        - *rechthebbende:* eigenaar, bezitter of degene die een recht van erfpacht, opstal, vruchtgebruik, gebruik, huur of
      pacht heeft;
        - *spoorvoertuig:* voertuig, bestemd voor het verkeer over spoorwegen;
        - *spoorweg:* weg bestemd voor verkeer over spoorstaven of geleiderails;
        - *spoorweginfrastructuur:* spoorwegen en de daarvan deel uitmakende elementen van spoorweginfrastructuur als
      bedoeld in bijlage I bij richtlijn 2012/34/EU;
        - *spoorwegonderneming:* spoorwegonderneming als bedoeld in artikel 3, onderdeel 1, van richtlijn 2012/34/EU,
      alsmede iedere andere onderneming die gebruik maakt of beoogt te maken van de spoorweg en daarvoor de beschikking
      heeft over tractie;
        - *subsysteem:* subsysteem van structurele aard als bedoeld in bijlage II van richtlijn 2008/57/EG;
        - *technische specificatie inzake interoperabiliteit:* technische specificatie inzake interoperabiliteit als
      bedoeld in artikel 2, onderdeel i, van richtlijn 2008/57/EG;
        - *toegangsovereenkomst:* toegangsovereenkomst als bedoeld in [artikel 59][ref9];
        - *veiligheidsfunctie:* functie van bestuurder van een spoorvoertuig of een andere, bij algemene maatregel van
      bestuur omschreven, functie binnen het spoorwegverkeerssysteem die van aanmerkelijke invloed is op de veiligheid
      van het spoorverkeer;
        - *verbetering:* verbetering als bedoeld in artikel 2, onderdeel m, van richtlijn 2008/57/EG;
        - *vernieuwing:* vernieuwing als bedoeld in artikel 2, onderdeel n, van richtlijn 2008/57/EG.

      2 In deze wet en de daarop berustende bepalingen wordt voorts verstaan onder:

        - *richtlijn 96/48/EG:* richtlijn nr. 96/48/EG van de Raad van de Europese Unie van 23 juli 1996 betreffende de
      interoperabiliteit van het transeuropees hogesnelheidsspoorwegsysteem (PbEG L 235/6);
        - *richtlijn 2001/16/EG:* richtlijn nr. 2001/16/EG van het Europees parlement en de Raad van de Europese Unie
      van 19 maart 2001 betreffende de interoperabiliteit van het conventionele trans-Europese spoorwegsysteem (PbEG
      L 110/1);
        - *richtlijn 2004/49/EG:* richtlijn nr. 2004/49/EG van het Europees parlement en de Raad van de Europese Unie
      van 29 april 2004 inzake de veiligheid op communautaire spoorwegen en tot wijziging van Richtlijn 95/18/EG van
      de Raad betreffende de verlening van vergunningen aan spoorwegondernemingen en van Richtlijn 2001/14/EG van de
      Raad inzake de toewijzing van spoorweginfrastructuurcapaciteit en de heffing van rechten voor het gebruik van
      spoorweginfrastructuur alsmede inzake veiligheidscertificering (Spoorwegveiligheidsrichtlijn) (PbEU L 220/44);
        - *richtlijn 2007/59/EG:* richtlijn nr. 2007/59/EG van het Europees parlement en de Raad van de Europese Unie van
      23 oktober 2007 inzake de certificering van machinisten die locomotieven en treinen op het spoorwegsysteem van de
      Gemeenschap besturen (PbEU L 315/51);
        - *richtlijn 2008/57/EG:* richtlijn nr. 2008/57/EG van het Europees parlement en de Raad van de Europese Unie van
      17 juni 2008 betreffende de interoperabiliteit van het spoorwegsysteem in de Gemeenschap (PbEU L 191/1);
        - *richtlijn 2012/34/EU:* richtlijn 2012/34/EU van het Europees parlement en de Raad van 21 november 2012 tot
      instelling van één Europese spoorwegruimte (PbEU 2012, L 343/32).


