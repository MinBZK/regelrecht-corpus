  - number: '47'
    text: |-
      1 De spoorwegonderneming of de houder van het spoorvoertuig draagt er zorg voor dat een door hen gebruikt
      spoorvoertuig dat volledig in het register, bedoeld in [artikel 37, tweede lid][ref1], is ingeschreven, altijd
      overeenkomstig de op het moment van indienststelling, vernieuwing of verbetering van het spoorvoertuig geldende
      technische specificaties inzake interoperabiliteit wordt geëxploiteerd.

      2 De beheerder draagt er zorg voor dat de hoofdspoorweginfrastructuur, waarvoor hem de concessie, bedoeld
      in [artikel 16, eerste lid][ref2], is verleend, altijd overeenkomstig de op het moment van indienststelling,
      vernieuwing of verbetering van de hoofdspoorweginfrastructuur geldende technische specificaties inzake
      interoperabiliteit wordt beheerd.

      3 Onze Minister kan het gebruik met een spoorvoertuig van hoofdspoorweginfrastructuur verbieden, indien ter zake
      van het spoorvoertuig niet voldaan is aan het eerste lid.

      4 Het is verboden om met een spoorvoertuig dat niet overeenkomstig de essentiële eisen van [richtlijn 2008/57/EG]
      (32008L0057) is geëxploiteerd en onderhouden, van hoofdspoorweginfrastructuur gebruik te maken.


