  - number: '38'
    text: |-
      1 Een EG-keuringsverklaring als bedoeld in de [artikelen 36, zesde lid][ref1], en [36b, derde lid][ref2], voldoet
      aan bijlage V van richtlijn 2008/57/EG.

      2 De afgifte van een EG-keuringsverklaring als bedoeld in de [artikelen 36, zesde lid][ref3], en
      [36b, derde lid][ref4], geschiedt in overeenstemming met artikel 18 en bijlage VI van richtlijn 2008/57/EG.

      3 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de afgifte, vorm en
      inhoud van EG-keuringsverklaringen als bedoeld in de [artikelen 36, zesde lid][ref5], en [36b, derde lid][ref6], en
      over het informatiedossier, bedoeld in [artikel 37b, tweede lid][ref7].

      4 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over de verlening en de aanvraag
      van:

      a. de vergunning voor indienststelling, bedoeld in de [artikelen 36, derde lid][ref8], en [36b, derde lid][ref9],
      en van de vergunning voor indienststelling of van de nieuwe vergunning voor indienststelling, bedoeld in
      [artikel 37b, derde lid][ref10];

      b. de aanvullende vergunning voor indienststelling, bedoeld in de [artikelen 36, vijfde lid][ref11], en
      [36b, vierde lid][ref12], en van aanvullende vergunning voor indienstststelling of van de nieuwe aanvullende
      vergunning voor indienststelling, bedoeld in [artikel 37b, zesde lid][ref13].

      5 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over het registreren of bewaren van
      gegevens over:

      a. de afgifte van de EG-keuringsverklaring, bedoeld in de [artikelen 36, zesde lid][ref14], en
      [36b, derde lid][ref15];

      b. de afgifte van de verklaring, bedoeld in de [artikelen 36, zevende lid][ref16], en
      [artikel 36b, derde lid][ref17], of van de verklaring, bedoeld in [artikel 37b, negende lid][ref18];

      c. de aanvraag en de verlening van de vergunning voor indienststelling, bedoeld in de
      [artikelen 36, derde lid][ref19], en [36b, derde lid][ref20], of van de vergunning voor indienststelling of nieuwe
      vergunning voor indienststelling, bedoeld [artikel 37b, derde lid][ref21], en

      d. de aanvraag en de verlening van de aanvullende vergunning voor indienststelling, bedoeld in de
      [artikelen 36, vijfde lid][ref22], en [36b, vierde lid][ref23], of van de aanvullende vergunning voor
      indienststelling of nieuwe vergunning voor indienststelling, bedoeld in [artikel 37b, zesde lid][ref24].


