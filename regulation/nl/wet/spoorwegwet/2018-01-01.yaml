      1 Degene onder wiens gezag binnen het hoofdspoorwegverkeerssysteem een veiligheidsfunctie wordt uitgeoefend
      verschaft, behoudens bij algemene maatregel van bestuur omschreven uitzonderingen, aan degene die de betrokken
      functie uitoefent, die beschikt over de in [artikel 50, eerste lid][ref1], bedoelde documenten en die naar zijn
      oordeel beschikt over de voor de uitoefening van die functie vereiste specifieke, taakgebonden en bedrijfsgebonden
      kennis en bekwaamheid, een bedrijfspas.

      2 De bedrijfspas voldoet aan de bij of krachtens algemene maatregel van bestuur gestelde eisen.

      3 Het eerste lid geldt niet voor een persoon die binnen het hoofdspoorwegverkeerssysteem de veiligheidsfunctie van
      machinist met volledige bevoegdheid of van machinist met beperkte bevoegdheid uitoefent en aan wie degene onder
      wiens gezag die veiligheidsfunctie wordt uitgeoefend een bevoegdheidsbewijs heeft verstrekt.

      4 De houder van een bedrijfspas en de houder van een bevoegdheidsbewijs als bedoeld in het derde lid zijn verplicht
      die pas onderscheidenlijk dat bewijs op eerste vordering te tonen aan de krachtens de [artikelen 69][ref2] en
      [86][ref3] met het toezicht op de naleving onderscheidenlijk de opsporing van strafbare feiten belaste personen.

      5 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over:

      a. de voor de uitoefening van veiligheidsfuncties vereiste specifieke, taakgebonden en bedrijfsgebonden kennis
      en bekwaamheid;

      b. de geldigheidsduur van bedrijfspassen.


