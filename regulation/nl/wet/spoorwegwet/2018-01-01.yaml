  - number: '16'
    text: |-
      1 Onze Minister verleent een of meer concessies voor het beheer van de hoofdspoorweginfrastructuur. Het beheer
      omvat de zorg voor:

      a. de kwaliteit, betrouwbaarheid en beschikbaarheid van die infrastructuur;

      b. een eerlijke, niet-discriminerende en transparante verdeling van de capaciteit van die infrastructuur zowel ten
      behoeve van de beheerder als ten behoeve van spoorwegondernemingen;

      c. het leiden van het verkeer over die infrastructuur.

      2 Een concessie bevat een beschrijving van de werkzaamheden waarvoor de concessie wordt verleend.

      3 Een concessie voldoet aan de eisen, opgenomen in artikel 30, tweede lid, van richtlijn 2012/34/EU.

      4 Een concessie wordt niet verleend aan een spoorwegonderneming dan met inachtneming van artikel 7, eerste en
      tweede lid, van richtlijn 2012/34/EU.
    url: https://wetten.overheid.nl/BWBR0015007/2018-01-01#Artikel16
  - number: 16a
    text: |-
      1 Een beheerder beschikt bij de uitvoering van de taken, bedoeld in [artikel 16, eerste lid][ref1], anders dan ten
      behoeve van de aanleg van hoofdspoorweginfrastructuur over een geldige veiligheidsvergunning als bedoeld in artikel
      11 van richtlijn 2004/49/EG.

      2 Onze Minister verleent op aanvraag een veiligheidsvergunning aan de beheerder, indien hij beschikt over een
      veiligheidsbeheersysteem dat:

      a. voldoet aan artikel 9, eerste, tweede en derde lid, van richtlijn 2004/49/EG;

      b. op zodanige wijze is geoperationaliseerd dat het een veilig beheer en gebruik van hoofdspoorweginfrastructuur
      mogelijk maakt.

      3 In afwijking van [artikel 4:14 van de Algemene wet bestuursrecht][ref2] beslist Onze Minister bij verlenging
      van de beslistermijn op de aanvraag, bedoeld in het tweede lid, in ieder geval uiterlijk vier maanden nadat
      alle in [artikel 4:2, tweede lid, van de Algemene wet bestuursrecht][ref3] bedoelde informatie is verschaft,
      en neemt het besluit, bedoeld in het vijfde lid, uiterlijk vier maanden nadat hij heeft vastgesteld dat het
      veiligheidsbeheersysteem niet meer voldoet aan het tweede lid.

      4 Een veiligheidsvergunning is ten hoogste vijf jaar geldig.

      5 Onze Minister trekt een veiligheidsvergunning in, indien het veiligheidsbeheersysteem van de beheerder niet meer
      voldoet aan het tweede lid.

      6 De beheerder gebruikt het veiligheidsbeheersysteem, bedoeld in het tweede lid, bij de uitvoering van de taken,
      bedoeld in het eerste lid, ter beheersing van alle uit die taken voortvloeiende risico’s.

      7 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gegeven over de uitvoering van dit
      artikel, waaronder:

      a. regels ten aanzien van de aanvraag van een veiligheidsvergunning, en

      b. nadere regels ten aanzien het veiligheidsbeheersysteem.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel16
