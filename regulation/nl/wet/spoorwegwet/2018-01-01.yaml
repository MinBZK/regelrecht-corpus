  - number: '56'
    text: |-
      De beheerder werkt samen met buitenlandse infrastructuurbeheerders met het oog op efficiënte verdeling en
      exploitatie van treindiensten die de landsgrenzen overschrijden, met inachtneming van de artikelen 40 en 57, zesde
      lid, van richtlijn 2012/34/EU.
    url: https://wetten.overheid.nl/BWBR0015007/2018-01-01#Artikel56
  - number: '57'
    text: |-
      1 Gerechtigd tot het sluiten van een toegangsovereenkomst en een kaderovereenkomst met de beheerder zijn de
      partijen, bedoeld in het tweede lid.

      2 Als aanvrager als bedoeld in artikel 3, onderdeel 19, van richtlijn 2012/34/EU worden aangemerkt:

      a. spoorwegondernemingen die in het bezit zijn van een bedrijfsvergunning of deze hebben aangevraagd, voorzover
      zij daarmee gerechtigd zijn van de hoofdspoorweginfrastructuur gebruik te maken op de wijze waarvoor zij de
      overeenkomst willen sluiten;

      b. concessieverleners als bedoeld in [artikel 20 van de Wet personenvervoer 2000][ref1] ten behoeve van openbaar
      vervoer per trein;

      c. andere natuurlijke personen of rechtspersonen die om commerciële redenen aantoonbaar belang hebben bij de
      verwerving van capaciteit voor het doen vervoeren van personen of lading door middel van spoorvervoerdiensten.

      3 Het verhandelen en het overdragen van capaciteit door een gerechtigde is verboden, met uitzondering van het
      overdragen in de gevallen, bedoeld in artikel 38, eerste lid, laatste alinea, van richtlijn 2012/34/EU. Overtreding
      van het hiervoor gestelde verbod leidt tot uitsluiting van verdere toewijzing van capaciteit.

      4 De spoorwegonderneming die voornemens is capaciteit aan te vragen met het oog op het exploiteren
      van een internationale passagiersvervoerdienst die niet deel uitmaakt van een concessie als bedoeld in
      [artikel 20, eerste of derde lid, van de Wet personenvervoer 2000][ref2], maakt daarvan uiterlijk tien maanden
      voor aanvang van de geldigheidsperiode van de dienstregeling melding aan de Autoriteit Consument en Markt en de
      beheerder.

      5 Het vierde lid is van overeenkomstige toepassing voor wijzigingen van een internationale passagiersvervoerdienst.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel20
