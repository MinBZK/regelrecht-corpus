  - number: '32'
    text: |-
      1 Onze Minister verleent op aanvraag van een spoorwegonderneming een veiligheidscertificaat als bedoeld in artikel
      10 van richtlijn 2004/49/EG bestaande uit:

      a. een A-certificaat voor het veiligheidsbeheersysteem dat wordt verleend indien het veiligheidsbeheersysteem
      voldoet aan artikel 9 en bijlage III van richtlijn 2004/49/EG;

      b. een B-certificaat voor de voorzieningen die de spoorwegonderneming overeenkomstig bijlage IV van richtlijn
      2004/49/EG heeft getroffen om te voldoen aan de bij of krachtens deze wet gestelde voorschriften.

      2 Een veiligheidsbeheersysteem waarvoor door een daartoe bevoegde instantie in een andere lidstaat van de Europese
      Unie een certificaat als bedoeld in artikel 10, tweede lid, onderdeel a, van richtlijn 2004/49/EG is afgegeven,
      wordt voor de verlening van het veiligheidscertificaat gelijkgesteld met een A-certificaat als bedoeld in het
      eerste lid, onderdeel a.

      3 Een veiligheidscertificaat als bedoeld in artikel 10, tweede lid, onderdeel a, van richtlijn 2004/49/EG,
      afgegeven door een daartoe bevoegde instantie in een lidstaat van de Europese Unie wordt ten aanzien van aan de
      grens gelegen, bij algemene maatregel van bestuur aan te wijzen hoofdspoorwegen, en indien wordt voldaan aan bij of
      krachtens algemene maatregel van bestuur te stellen eisen, gelijkgesteld met een B-certificaat als bedoeld in het
      eerste lid, onderdeel b.

      4 [Artikel 16a, derde lid][ref1], is van overeenkomstige toepassing op de in het eerste en derde lid bedoelde
      aanvraag.

      5 Onze Minister verleent op aanvraag aan een beheerder, in afwijking van het eerste lid, een
      veiligheidscertificaat, indien hij beschikt over een op grond van [artikel 16a][ref2] verleende
      veiligheidsvergunning.

      6 Een beheerder gebruikt een op grond van het vierde lid verleend veiligheidscertificaat slechts ten behoeve van de
      uitvoering van de taken, bedoeld in [artikel 16, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel16a
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel16a
