  - number: '34'
    text: |-
      1 Onze Minister kan aan degene die een veiligheidscertificaat heeft aangevraagd of aan de certificaathouder die een
      wijziging van het veiligheidscertificaat heeft aangevraagd een proefcertificaat verlenen.

      2 Het proefcertificaat wordt verleend met het oog op het opdoen van ervaring of het testen van procedures of
      spoorvoertuigen ten behoeve van verlening of wijziging van een veiligheidscertificaat.

      3 Het proefcertificaat is ten hoogste dertien weken geldig en vervalt van rechtswege bij
      de verlening of de wijziging, bedoeld in het tweede lid. Indien toepassing is gegeven aan
      [artikel 32, tweede lid, tweede volzin][ref1], vervalt het proefcertificaat met ingang van de dag na de laatste dag
      van de krachtens die bepaling gestelde termijn.

      4 In afwijking van [artikel 4:14 van de Algemene wet bestuursrecht][ref2] beslist Onze Minister bij verlenging
      van de beslistermijn op de aanvraag bedoeld in het eerste lid, in ieder geval binnen vier maanden nadat
      alle in [artikel 4:2, tweede lid, van de Algemene wet bestuursrecht][ref3] bedoelde informatie is verschaft.
      [Artikel 33, tweede en derde lid][ref4], is van overeenkomstige toepassing.


