  - number: '74'
    text: |-
      Indien door Onze Minister vast te stellen beleidsregels betrekking hebben op de interpretatie van
      mededingingsbegrippen stelt Onze Minister die beleidsregels vast in overeenstemming met Onze Minister van
      Economische Zaken.
    url: https://wetten.overheid.nl/BWBR0015007/2018-01-01#Artikel74
  - number: 74a
    text: |-
      Het is verboden te handelen in strijd met de aan een op grond van deze wet verleende vrijstelling, ontheffing of
      vergunning verbonden voorschriften.
    url: https://wetten.overheid.nl/BWBR0015007/2018-01-01#Artikel74a
  - number: '76'
    text: |-
      1 Onze Minister is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van de bij of krachtens
      deze wet gestelde verplichtingen met uitzondering van de verplichtingen als bedoeld in het tweede lid.

      2 In geval van overtreding van het bepaalde krachtens [artikel 17, eerste lid, onderdeel d][ref1],
      of het bepaalde bij of krachtens de [artikelen 27, eerste lid][ref2],
      [56][ref3], [57 tot en met 62, eerste tot en met achtste lid][ref4],
      [63, eerste lid, tweede lid, eerste volzin, derde en vierde lid][ref5], [67][ref6],
      [68, eerste tot en met derde lid][ref7], [68a][ref8], [68c][ref9], [70, zevende en achtste lid][ref10], kan de
      Autoriteit Consument en Markt de overtreder:

      a. een bestuurlijke boete opleggen;

      b. een last onder dwangsom opleggen.

      3 Op het tweede lid is [artikel 57, eerste en vierde lid, van de Mededingingswet][ref11] van toepassing.


