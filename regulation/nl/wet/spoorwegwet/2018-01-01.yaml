  - number: '8'
    text: |-
      1 Het is een beheerder verboden een nieuwe hoofdspoorweg in dienst te stellen zonder dat Onze Minister daarvoor een
      vergunning voor indienststelling heeft verleend.

      2 Onze Minister verleent de vergunning voor indienststelling indien de desbetreffende subsystemen:

      a. voldoen aan de daarvoor geldende technische specificaties inzake interoperabiliteit;

      b. voldoen aan de krachtens [artikel 6, eerste lid][ref1], vastgestelde regels die bij regeling van Onze Minister,
      met inachtneming artikel 17 van richtlijn 2008/57/EG, voor de subsystemen zijn aangewezen ter uitvoering van de
      essentiële eisen van die richtlijn;

      c. voldoen aan de krachtens [artikel 6, eerste lid][ref2], vastgestelde regels die bij regeling van Onze Minister
      op grond van een technische specificatie inzake interoperabiliteit, bedoeld in onderdeel a, voor de subsystemen
      zijn aangewezen ter verificatie van de interoperabiliteit;

      d. voldoen aan de krachtens [artikel 6, eerste lid][ref3], vastgestelde regels, die bij regeling van Onze
      Minister voor de subsystemen zijn aangewezen ter uitwerking van de in een of meer technische specificaties inzake
      interoperabiliteit, bedoeld in onderdeel a, opgenomen open punten;

      e. voldoen aan de eisen, bedoeld in artikel 15, eerste en tweede lid, van richtlijn 2008/57/EG.

      3 Onze Minister kan op aanvraag, met inachtneming van artikel 9 van richtlijn 2008/57/EG, een of meer technische
      specificaties inzake interoperabiliteit geheel of gedeeltelijk buiten toepassing laten.

      4 Onze Minister kan op aanvraag voorafgaand aan vergunningverlening als bedoeld in het eerste lid ontheffing
      verlenen van het in het eerste lid genoemde verbod. De ontheffing kan onder beperkingen worden verleend. Aan de
      ontheffing kunnen voorschriften worden verbonden.

      5 Het voldoen aan de specificaties, bedoeld in het tweede lid, onderdeel a, en aan de regels, bedoeld in het tweede
      lid, onderdeel b, blijkt uit een geldig afgegeven EG-keuringsverklaring als bedoeld in artikel 18 van richtlijn
      2008/57/EG.

      6 Het voldoen aan de regels, bedoeld in het tweede lid, onderdelen c en d, blijkt uit een geldige verklaring van
      een aangemelde instantie of van een keuringsinstantie.

      7 In afwijking van [artikel 4:14 van de Algemene wet bestuursrecht][ref4] beslist Onze Minister bij
      verlenging van de beslistermijn op de aanvraag voor een vergunning, bedoeld in het eerste lid, en
      de aanvragen, bedoeld in het derde en vierde lid, in ieder geval binnen vier maanden nadat alle in
      [artikel 4:2, tweede lid, van de Algemene wet bestuursrecht][ref5] bedoelde informatie is verschaft.

      8 Onze Minister kan op aanvraag, met inachtneming van artikel 1, derde lid, van richtlijn 2008/57/EG, ontheffing
      verlenen van de technische specificaties, de regels of de eisen, bedoeld in het tweede lid. De ontheffing kan onder
      beperkingen worden verleend. Aan de ontheffing kunnen voorschriften worden verbonden. Bij ministeriële regeling
      kunnen regels worden gesteld ter omschrijving van hoofdspoorwegen waarvoor de ontheffing mogelijk is, met het oog
      op het veilig gebruik van hoofdspoorwegen en over de procedures die bij ontheffingverlening kunnen gelden.


