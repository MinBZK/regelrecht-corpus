      1 Onze Minister kan een bestuurlijke boete opleggen ter zake van overtreding van de [artikelen 19][ref1],
      [36, eerste lid][ref2], [36b, eerste lid][ref3], [37, eerste lid][ref4], [37b, eerste en achtste lid][ref5],
      [51, vierde lid][ref6], [53][ref7], [65, tweede lid][ref8], [74a][ref9], [96, tweede lid][ref10], en [96a][ref11],
      alsmede ter zake van overtreding van de krachtens [hoofdstuk 2][ref12] en de [artikelen 64, tweede lid][ref13],
