      overtreding daarbij uitdrukkelijk als beboetbaar feit is aangemerkt.

      2 Bij ministeriële regeling kunnen regels worden gesteld over de uitoefening van de bevoegdheid, bedoeld in het
      eerste lid.

      3 Een overtreding die krachtens het eerste lid als beboetbaar feit is aangemerkt, wordt niet tevens als strafbaar
      feit krachtens [artikel 87, eerste lid][ref16], aangemerkt.


