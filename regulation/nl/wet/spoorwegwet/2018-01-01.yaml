  - number: 36a
    text: |-
      1 Onze Minister is bevoegd, ter verlening van de in [artikel 36, vijfde lid][ref1], bedoelde aanvullende vergunning
      voor indienststelling aanvullende informatie, uitvoering van risicoanalysen overeenkomstig artikel 6, derde lid,
      onderdeel a, van [richtlijn 2004/49/EG](32004L0049) of tests op de hoofdspoorweginfrastructuur te eisen, teneinde
      de technische verenigbaarheid te toetsen tussen het spoorvoertuig en de hoofdspoorweginfrastructuur, met inbegrip
      van de nationale voorschriften die van toepassing zijn op de openstaande punten in de technische specificaties
      die nodig zijn om deze verenigbaarheid te waarborgen en van de nationale voorschriften die van toepassing zijn op
      de specifieke gevallen die in de betreffende technische specificaties zijn omschreven. Onze Minister bepaalt na
      raadpleging van de aanvrager de draagwijdte en de inhoud van de gevraagde aanvullende informatie, risicoanalysen
      en tests. De beheerder doet, in overleg met de aanvrager, al het mogelijke om ervoor te zorgen dat eventuele
      tests plaatsvinden binnen drie maanden na het verzoek van de aanvrager. Onze Minister is bevoegd van een ieder
      medewerking te vorderen voor zover die redelijkerwijs nodig is om te waarborgen dat de tests plaatsvinden.

      2 Na de goedkeuring van het in artikel 27 van [richtlijn 2008/57/EG](32008L0057) bedoelde referentiedocument
      verricht Onze Minister de toets, bedoeld in het eerste lid, alleen op basis van de in de categorieën B of C van het
      referentiedocument opgenomen nationale voorschriften.

      3 [Artikel 16a, derde lid][ref2], is van overeenkomstige toepassing op:

      a. de aanvragen voor een vergunning of aanvullende vergunning voor indienststelling, bedoeld in
      [artikel 36, derde of vijfde lid][ref3];

      b. de aanvragen, bedoeld in [artikel 36, vierde, negende en tiende lid][ref4].

      4 In afwijking van het derde lid neemt Onze Minister bij verlenging van de beslistermijn een besluit ten aanzien
      van een aanvullende vergunning voor indienststelling als bedoeld in [artikel 36, vijfde lid][ref5], in ieder geval:

      a. uiterlijk twee maanden na indiening van de bij de aanvraag van de aanvullende vergunning voor indienststelling
      behorende gegevens;

      b. uiterlijk een maand na het verstrekken van de aanvullende informatie, bedoeld in het eerste lid, en

      c. uiterlijk een maand na het verstrekken van de resultaten van de tests, bedoeld in het eerste lid.

      5 In afwijking van [artikel 6:7 van de Algemene wet bestuursrecht][ref6] dient de aanvrager een
      bezwaarschrift tegen een beschikking tot weigering van een vergunning of aanvullende vergunning voor
      indienststelling, bedoeld in [artikel 36, derde of vijfde lid][ref7], in binnen een maand. In afwijking van
      [artikel 7:10 van de Algemene wet bestuursrecht][ref8] beslist Onze Minister op dit bezwaarschrift uiterlijk twee
      maanden, gerekend vanaf de dag na die waarop de in de eerste volzin bedoelde termijn is verstreken.

      6 Indien Onze Minister niet binnen de termijn, bedoeld in het vijfde lid, op het bezwaar heeft beslist, is de
      aanvullende vergunning voor indienststelling, bedoeld in [artikel 36, vijfde lid][ref9], drie maanden na afloop van
      die termijn van rechtswege gegeven. Deze van rechtswege gegeven aanvullende vergunning voor indienststelling geldt
      alleen voor de hoofdspoorweginfrastructuur ten aanzien waarvan Onze Minister niet binnen de termijn, bedoeld in
      het vijfde lid, op het bezwaar heeft beslist. De [artikelen 4:20b, tweede en derde lid][ref10], [4:20c][ref11] en
      [4:20d van de Algemene wet bestuursrecht][ref12] zijn van overeenkomstige toepassing.

      7 Wanneer Onze Minister vaststelt dat de houder van de vergunning of de aanvullende vergunning voor
      indienststelling, bedoeld in [artikel 36, derde of vijfde lid][ref13], niet langer aan de eisen voldoet, kan hij
      de vergunning of de aanvullende vergunning voor indienststelling intrekken. Onze Minister past bij intrekking van
      de vergunning of de aanvullende vergunning voor indienststelling, bedoeld in artikel 36, derde of vijfde lid, de
      procedure toe, bedoeld in artikel 10, vijfde lid, van [richtlijn 2004/49/EG](32004L0049). Wanneer Onze Minister
      de aanvullende vergunning voor indienststelling heeft ingetrokken, stelt hij de instantie die de vergunning voor
      indienststelling heeft verleend onverwijld in kennis van die intrekking. Tevens kan Onze Minister de vergunning of
      aanvullende vergunning voor indienststelling intrekken wanneer blijkt dat de vergunninghouder er gedurende het jaar
      dat volgde op de verlening niet het bedoelde gebruik van heeft gemaakt.


