  - number: '124'
    text: |-
      1 In afwijking van [artikel 2, tweede en derde lid][ref1], kunnen spoorwegen als hoofdspoorwegen worden aangewezen,
      indien deze spoorwegen rechtstreeks of middellijk in overwegende mate zijn aangelegd op kosten van het Rijk en naar
      het oordeel van Onze Minister voldoende is komen vast te staan dat gedurende de periode van twee jaar voorafgaand
      aan de datum van inwerkingtreding van [artikel 2, tweede lid][ref2] deze spoorwegen door Railinfrabeheer b.v.,
      gevestigd te Utrecht, werden onderhouden.

      2 Tot 1 januari 2013 kunnen in afwijking van [artikel 2, tweede en derde lid][ref3], spoorwegen als hoofdspoorwegen
      worden aangewezen, indien Railinfrabeheer b.v., of Railinfratrust b.v., gevestigd te Utrecht, of hun rechtsopvolger
      rechthebbende is ten aanzien van deze spoorwegen.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0015007#Artikel2
