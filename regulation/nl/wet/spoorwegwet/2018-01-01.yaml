  - number: 36b
    text: |-
      1 Het is een spoorwegonderneming verboden om van hoofdspoorweginfrastructuur gebruik te maken met een spoorvoertuig
      dat niet voldoet aan alle relevante technische specificaties inzake interoperabiliteit die op het ogenblik van
      de indienststelling van kracht zijn, met inbegrip van spoorvoertuigen waarvoor afwijkingen gelden, of wanneer
      een belangrijk gedeelte van de essentiële eisen niet is opgenomen in één of meer technische specificaties inzake
      interoperabiliteit, waarvoor Onze Minister geen vergunning voor indienststelling, bedoeld in het derde lid,
      respectievelijk aanvullende vergunning voor indienststelling, bedoeld in het vierde lid heeft verleend. Onze
      Minister kan op aanvraag, na de beheerder te hebben gehoord, ontheffing verlenen van dit verbod. De ontheffing kan
      onder voorwaarden worden verleend. Aan de ontheffing kunnen voorschriften worden verbonden.

      2 Het eerste lid geldt niet voor bij algemene maatregel van bestuur met inachtneming van artikel 21 van [richtlijn
      2008/57/EG](32008L0057), aangewezen spoorvoertuigen.

      3 Onze Minister verleent, na de beheerder te hebben gehoord, een vergunning voor indienststelling als volgt:

        - voor de technische aspecten die onder een technische specificatie inzake interoperabiliteit vallen, wordt de
      procedure voor de opstelling van de EG-keuringsverklaring uit artikel 18 van [richtlijn 2008/57/EG](32008L0057)
      toegepast;
        - voor de andere technische aspecten gelden de voorschriften waarvan overeenkomstig artikel 17, derde lid, van
      [richtlijn 2008/57/EG](32008L0057) en artikel 8 van [richtlijn 2004/49/EG](32004L0049) kennis is gegeven.

      4 Onze Minister verleent, na de beheerder te hebben gehoord, een aanvullende vergunning voor indienststelling
      slechts wanneer in een andere lidstaat reeds een vergunning voor indienststelling is verleend.

      5 Onze Minister is bevoegd ter verlening van de aanvullende vergunning voor indienststelling aanvullende
      informatie, de uitvoering van risicoanalysen overeenkomstig artikel 6, derde lid, onderdeel a, van [richtlijn
      2004/49/EG](32004L0049) of tests op de hoofdspoorweginfrastructuur te eisen, teneinde na te gaan of de in artikel
      25, tweede lid, onderdelen c en d, van [richtlijn 2008/57/EG](32008L0057) bedoelde informatie voldoet aan de
      geldende voorschriften zoals die overeenkomstig artikel 8 van [richtlijn 2004/49/EG](32004L0049) aan de Commissie
      zijn meegedeeld.

      Onze Minister legt, na raadpleging van de aanvrager, de reikwijdte en de inhoud van de aanvullende informatie,
      de risicoanalysen of de vereiste tests vast. De beheerder doet, in overleg met de aanvrager, al het mogelijke om
      ervoor te zorgen dat tests kunnen plaatsvinden binnen drie maanden na het verzoek van de aanvrager. Onze Minister
      is bevoegd van een ieder medewerking te vorderen voor zover die redelijkerwijs nodig is om te waarborgen dat de
      tests plaatsvinden.

      6 Na de aanneming van het in artikel 27 van [richtlijn 2008/57/EG](32008L0057) bedoelde referentiedocument, voert
      Onze Minister de in het vijfde lid bedoelde controle echter alleen uit op basis van de nationale voorschriften van
      categorie B of C die in dat referentiedocument zijn opgenomen.

      7 In afwijking van [artikel 4:14 van de Algemene wet bestuursrecht][ref1] neemt Onze Minister bij verlenging
      van de beslistermijn een besluit, bedoeld in het vierde lid, ten aanzien van een aanvullende vergunning voor
      indienststelling in ieder geval:

      a. uiterlijk vier maanden na indiening van de bij de aanvraag voor de aanvullende vergunning voor indienststelling
      behorende gegevens;

      b. uiterlijk binnen twee maanden na het verstrekken van de aanvullende informatie, bedoeld in het vijfde lid, en

      c. uiterlijk binnen twee maanden na het verstrekken van de resultaten van de tests, bedoeld in het vijfde lid.

      8 Onze Minister kan op aanvraag, met inachtneming van artikel 1, derde lid, van [richtlijn 2008/57/EG](32008L0057),
      ontheffing verlenen van de technische specificaties respectievelijk de voorschriften, bedoeld in het derde lid.
      De ontheffing kan onder beperkingen worden verleend. Aan de ontheffing kunnen voorschriften worden verbonden.
      Bij ministeriële regeling kunnen regels worden gesteld ter omschrijving van spoorvoertuigen waarmee op omschreven
      hoofdspoorwegen gebruik gemaakt mag worden en met het oog op het veilig gebruik van die spoorvoertuigen op die
      hoofdspoorwegen alsmede over de procedures die bij ontheffingverlening kunnen gelden.

      9 [Artikel 36a, derde, vijfde tot en met zevende lid][ref2], is van overeenkomstige toepassing.

      10 Bij ministeriële regeling kunnen nadere regels worden gesteld over de toepassing van het eerste lid.


