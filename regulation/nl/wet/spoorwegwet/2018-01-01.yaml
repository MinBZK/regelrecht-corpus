      De rechthebbende ten aanzien van een bijzondere of lokale spoorweg die onder de werking van de [richtlijnen 91/440/
      EEG](31991L0440), [95/18/EG](31995L0018) of [2001/14/EG](32001L0014) valt, verleent aan spoorwegondernemingen recht
      op toegang of gebruik overeenkomstig de in die richtlijnen opgenomen voorschriften en overigens tegen eerlijke,
      redelijke en niet-discriminerende voorwaarden. [Artikel 26][ref1] is van overeenkomstige toepassing. De vergunning,
      bedoeld in artikel 2, onderdeel b, van [richtlijn 95/18/EG](31995L0018), wordt verleend door Onze Minister met
      overeenkomstige toepassing van [hoofdstuk 3, paragraaf 2][ref2].


