  - number: '39'
    text: |-
      1 Het is verboden een interoperabiliteitsonderdeel voor het gebruik binnen het hoofdspoorwegsysteem in de handel
      te brengen, indien ten aanzien daarvan niet een EG-verklaring van conformiteit of geschiktheid voor gebruik als
      bedoeld in artikel 13, eerste lid, van [richtlijn 2008/57/EG](32008L0057), is afgegeven.

      2 Het eerste lid is niet van toepassing op reserveonderdelen voor subsystemen die reeds in dienst zijn gesteld op
      het moment dat de specificaties voor die interoperabiliteitsonderdelen van kracht worden.

      3 Degene die de interoperabiliteitsonderdelen gebruikt zorgt dat deze binnen hun toepassingsgebied worden gebruikt
      overeenkomstig hun bestemming, en dat zij naar behoren worden geïnstalleerd en onderhouden.
    url: https://wetten.overheid.nl/BWBR0015007/2018-01-01#Artikel39
  - number: '40'
    text: |-
      1 Een EG-verklaring van conformiteit of geschiktheid voor gebruik als bedoeld in artikel 13, eerste lid, van
      richtlijn 2008/57/EG, wordt afgegeven:

      a. indien de interoperabiliteitsonderdelen voldoen aan de daaraan in de toepasselijke technische specificatie
      inzake interoperabiliteit gestelde eisen, en

      b. indien de conformiteit of geschiktheid voor gebruik blijkt uit een toetsing van een aangemelde instantie, indien
      een toepasselijke specificatie inzake interoperabiliteit een dergelijke toetsing voorschrijft.

      2 Indien met betrekking tot de in het eerste lid bedoelde onderdelen, andere EG-richtlijnen bestaan ten aanzien van
      andere aspecten dan geregeld in bedoelde technische specificaties, vermelden de verklaringen, bedoeld in dat lid,
      tevens of deze onderdelen aan die andere EG-richtlijnen voldoen.
    url: https://wetten.overheid.nl/BWBR0015007/2018-01-01#Artikel40
  - number: '41'
    text: |-
      1 Een EG-verklaring van conformiteit of geschiktheid voor gebruik als bedoeld in artikel 13, eerste lid, van
      richtlijn 2008/57/EG voldoet aan bijlage IV van die richtlijn.

      2 De afgifte van een EG-verklaring van conformiteit of geschiktheid voor gebruik als bedoeld in artikel 13, eerste
      lid, van richtlijn 2008/57/EG, geschiedt in overeenstemming met artikel 13 en bijlage IV van die richtlijn.

      3 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels gesteld over:

      a. vorm en inhoud van de EG-verklaringen van conformiteit of geschiktheid voor gebruik als bedoeld in artikel 13,
      eerste lid, van richtlijn 2008/57/EG, alsmede over het registreren of bewaren van gegevens of documenten over de
      afgifte, en

      b. het onderzoek naar de overeenstemming van de productie van interoperabiliteitsonderdelen waarvoor goedkeuring
      van het type is verleend, met het goedgekeurde type.
    url: https://wetten.overheid.nl/BWBR0015007/2018-01-01#Artikel41
  - number: '42'
    text: |-
      1 Het is verboden een EG-keuringsverklaring als bedoeld in [artikel 36, zesde lid][ref1], respectievelijk
      [artikel 36b, derde lid][ref2], af te geven indien niet blijkens een geldige verklaring van een aangemelde
      instantie is voldaan aan artikel 36, derde lid, onderdelen a en b, respectievelijk artikel 36b, derde lid.

      2 Het is verboden een EG-verklaring van conformiteit of geschiktheid voor gebruik als bedoeld in artikel 13, eerste
      lid, van [richtlijn 2008/57/EG](32008L0057), voor een interoperabiliteitsonderdeel af te geven, indien niet voldaan
      is aan [artikel 40, eerste lid][ref3].


