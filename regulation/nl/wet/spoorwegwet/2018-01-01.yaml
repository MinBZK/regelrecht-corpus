  - number: '125'
    text: |-
      1 Indien de Staat houder is van alle aandelen in het kapitaal van Railinfratrust b.v., gevestigd te Utrecht, gaan
      op een bij koninklijk besluit te bepalen tijdstip alle vermogensbestanddelen van deze vennootschap om niet onder
      algemene titel over op de Staat.

      2 De overgang van registergoederen ingevolge het eerste lid doet Onze Minister van Financiën onverwijld inschrijven
      in de openbare registers, bedoeld in [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref1].
      [Artikel 24, eerste lid, van Boek 3 van het Burgerlijk Wetboek][ref2] is niet van toepassing.

      3 Ter zake van de overgang, bedoeld in het eerste lid, is geen dividendbelasting, omzetbelasting of
      overdrachtsbelasting verschuldigd. Ter zake van het in ontvangst nemen en het in de openbare registers verwerken is
      geen tarief verschuldigd.

      4 In wettelijke procedures en rechtsgedingen waarbij de in het eerste lid genoemde vennootschap is betrokken,
      treedt met ingang van de het in het eerste lid bedoelde tijdstip de Staat in de plaats van die vennootschap.

      5 Met ingang van het in het eerste lid bedoelde tijdstip is de in het eerste lid genoemde vennootschap ontbonden.
      [Artikel 23 van Boek 2 van het Burgerlijk Wetboek][ref3] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel23
