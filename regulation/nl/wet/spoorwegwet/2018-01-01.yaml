  - number: '33'
    text: |-
      1 Het veiligheidscertificaat is ten hoogste vijf jaar geldig.

      2 Aan het veiligheidscertificaat kunnen beperkingen en voorschriften worden verbonden in het belang van de
      veiligheid op en in de directe nabijheid van de hoofdspoorweg.

      3 Onze Minister kan het veiligheidscertificaat schorsen of intrekken:

      a. wegens handelen in strijd met dit hoofdstuk;

      b. in het belang van de veiligheid op en in de directe nabijheid van de hoofdspoorweg;

      c. indien de bedrijfsvergunning van de certificaathouder is geschorst of ingetrokken;

      d. indien het certificaat, bedoeld in [artikel 32, tweede lid][ref1], door een daartoe bevoegde instantie in een
      andere lidstaat van de Europese Unie is ingetrokken.

      4 Onze Minister kan het veiligheidscertificaat of de daaraan verbonden beperkingen en voorschriften ambtshalve
      of op aanvraag wijzigen, met inachtneming van het belang van de veiligheid op en in de directe nabijheid van de
      hoofdspoorweg.

      5 Onze Minister neemt het besluit, bedoeld in het derde en vierde lid, uiterlijk vier maanden
      nadat hij heeft vastgesteld dat de omstandigheid, genoemd in het derde en vierde lid, zich heeft
      voorgedaan, en beslist, indien een aanvraag als bedoeld in het vierde lid is gedaan, in afwijking van
      [artikel 4:14 van de Algemene wet bestuursrecht][ref2] bij verlenging van de beslistermijn op de aanvraag, in
      ieder geval uiterlijk vier maanden nadat alle in [artikel 4:2, tweede lid, van de Algemene wet bestuursrecht][ref3]
      bedoelde informatie is verschaft.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel414
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel42
