preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het gelet op richtlijnen 91/440/EEG, 95/18/EG, 96/48/EG, 2001/12/EG,
    2001/13/EG, 2001/14/EG en 2001/16/EG en mede gelet op het belang van de bescherming van het milieu noodzakelijk
    is wettelijke bepalingen vast te stellen inzake de aanleg, het beheer en het gebruik van spoorwegen en dat het
    ter bevordering van een maatschappelijk gewenste benutting van spoorwegen wenselijk is, de verantwoordelijkheid
    van de overheid voor de aanleg van spoorweginfrastructuur vast te leggen, de verantwoordelijkheid voor
    vervoer en spoorweginfrastructuur te scheiden en de publieke belangen die gemoeid zijn met het beheer van
    spoorweginfrastructuur te verzekeren door de invoering van een concessiestelsel voor het beheer, het gebruik van
    spoorwegen te bevorderen door het stellen van transparante en niet-discriminerende voorschriften en dat het voorts
    wenselijk is de wetgeving inzake de spoorwegen overigens te moderniseren;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Verkeer en Waterstaat;'
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel1
  - number: 1.b
    text: 'spoorweg: weg bestemd voor verkeer over spoorstaven of geleiderails;'
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel1
  - number: 1.c
    text: |-
      spoorweginfrastructuur: spoorwegen en daarbij behorende spoorweginfrastructuur als bedoeld in bijlage 1, onderdeel
      A, van [Verordening (EEG) nr. 2598/70](31970R2598) van de Europese Commissie van 18 december 1970 (PbEG L 278);
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel1
  - number: 1.d
    text: |-
      rechthebbende: eigenaar, bezitter of degene die een recht van erfpacht, opstal, vruchtgebruik, gebruik, huur of
      pacht heeft;
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel1
  - number: 1.e
    text: 'spoorvoertuig: voertuig, bestemd voor het verkeer over spoorwegen;'
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel1
  - number: 1.f
    text: |-
      spoorwegonderneming: spoorwegonderneming als bedoeld in [richtlijn 95/18/EG](31995L0018) alsmede iedere andere
      onderneming die gebruik maakt of beoogt te maken van de spoorweg en daarvoor de beschikking heeft over tractie;
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel1
  - number: 1.g
    text: |-
      lidstaat: lidstaat van de Europese Unie of een andere staat die partij is bij de Overeenkomst betreffende de
      Europese Economische Ruimte;
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel1
  - number: 1.h
    text: |-
      beheerder: houder van een concessie als bedoeld in [artikel 16, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel16
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 1.i
    text: |-
      keuringsinstantie: instantie aangewezen op grond van [artikel 93][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel93
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '93'
        hoofdstuk: '6'
        paragraaf: '8'
  - number: 1.j
    text: |-
      veiligheidsfunctie: functie van bestuurder van een spoorvoertuig of een andere, bij algemene maatregel van bestuur
      omschreven, functie binnen het spoorwegverkeerssysteem die van aanmerkelijke invloed is op de veiligheid van het
      spoorverkeer;
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel1
  - number: 1.k
    text: |-
      [richtlijn 91/440/EEG](31991L0440): [richtlijn nr. 91/440/EEG](31991L0440) van de Raad van de Europese
      Gemeenschappen van 29 juli 1991 betreffende de ontwikkeling van de spoorwegen in de Gemeenschap (PbEG L 237);
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel1
  - number: 1.l
    text: |-
      [richtlijn 95/18/EG](31995L0018): [richtlijn nr. 95/18/EG](31995L0018) van de Raad van de Europese Unie van 19 juni
      1995 betreffende de verlening van vergunningen aan spoorwegondernemingen (PbEG L 143);
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel1
  - number: 1.m
    text: |-
      [richtlijn 2001/14/EG](32001L0014): [richtlijn nr. 2001/14/EG](32001L0014) van het Europees Parlement en de Raad
      van de Europese Unie van 26 februari 2001 inzake de toewijzing van spoorweginfrastructuurcapaciteit en de heffing
      van rechten voor het gebruik van spoorweginfrastructuur alsmede inzake veiligheidscertificering (PbEG L 75);
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel1
  - number: 1.n
    text: |-
      [richtlijn 96/48/EG](31996L0048): [richtlijn nr. 96/48/EG](31996L0048) van de Raad van de Europese Unie van 23 juli
      1996 betreffende de interoperabiliteit van het transeuropees hoge-snelheidsspoorwegsysteem (PbEG L 235);
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel1
  - number: 1.o
    text: |-
      [richtlijn 2001/16/EG](32001L0016): [richtlijn nr. 2001/16/EG](32001L0016) van het Europees Parlement en de Raad
      van de Europese Unie van 19 maart 2001 betreffende de interoperabiliteit van het conventionele trans-Europese
      spoorwegsysteem (PbEG L 110);
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel1
  - number: 1.p
    text: |-
      Verdrag: Verdrag betreffende het internationale spoorwegvervoer (Trb. 1980, 160), zoals gewijzigd ingevolge het
      op 20 december 1990 te Bern tot stand gekomen Protocol 1990 houdende wijziging van het Verdrag betreffende het
      internationale spoorwegvervoer (COTIF) van 9 mei 1980 (Trb. 1997, 19) en het op 3 juni 1999 te Vilnius tot stand
      gekomen Protocol 1999 inzake de herziening van het Verdrag betreffende het Internationale spoorwegvervoer (COTIF)
      van 9 mei 1980 (Trb. 2000, 70);
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel1
  - number: 1.q
    text: |-
      raad van bestuur NMa: raad van bestuur van de mededingingsautoriteit, bedoeld in
      [artikel 2 van de Mededingingswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel2
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '2'
  - number: '2.1'
    text: |-
      Deze wet is van toepassing op de als zodanig bij koninklijk besluit aangewezen hoofdspoorwegen en lokale spoorwegen
      alsmede op bijzondere spoorwegen.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel2
  - number: '2.2'
    text: 'Een spoorweg wordt als hoofdspoorweg aangewezen, indien:'
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel2
  - number: 2.2.a
    text: |-
      de spoorweg uitsluitend of overwegend bestemd is voor het verrichten van openbaar personenvervoer of
      goederenvervoer ten behoeve van internationale, nationale of regionale verbindingen en
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel2
  - number: 2.2.b
    text: de Staat rechthebbende is ten aanzien van de spoorweg.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel2
  - number: '2.6'
    text: Een besluit op grond van het eerste lid of vijfde lid wordt in het Staatsblad geplaatst.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel2
  - number: '3'
    text: |-
      Het is een ieder verboden zich zodanig te gedragen dat gevaar op de spoorweg wordt veroorzaakt of kan worden
      veroorzaakt of dat het verkeer op de spoorweg wordt gehinderd of kan worden gehinderd.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel3
  - number: '4.1'
    text: |-
      Het is een ieder verboden een veiligheidsfunctie uit te oefenen dan wel op de uitoefening van zodanige functie
      toezicht te houden terwijl hij verkeert onder zodanige invloed van een stof waarvan hij weet of redelijkerwijs moet
      vermoeden dat het gebruik daarvan, al dan niet in combinatie met een andere stof, de vaardigheid tot het uitoefenen
      van die functie of tot het houden van toezicht op de uitoefening van die functie kan verminderen, dat hij niet tot
      het behoorlijk uitoefenen van die functie of tot het behoorlijk uitoefenen van toezicht op de uitoefening van die
      functie in staat moet worden geacht.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel4
  - number: '4.2'
    text: |-
      Het is een ieder verboden een veiligheidsfunctie uit te oefenen dan wel op de uitoefening van zodanige functie
      toezicht te houden na zodanig gebruik van alcoholhoudende drank dat:
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel4
  - number: 4.2.a
    text: |-
      het alcoholgehalte van zijn adem bij een onderzoek hoger blijkt te zijn dan tweehonderdtwintig microgram alcohol
      per liter uitgeademde lucht, dan wel
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel4
  - number: 4.2.b
    text: |-
      het alcoholgehalte van zijn bloed bij een onderzoek hoger blijkt te zijn dan een halve milligram alcohol per
      milliliter bloed.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel4
  - number: '4.3'
    text: |-
      Het is verboden een veiligheidsfunctie te doen uitoefenen dan wel op de uitoefening van zodanige functie toezicht
      te doen houden door een persoon waarvan men weet of redelijkerwijs moet weten dat deze verkeert in een toestand als
      in het eerste of tweede lid is omschreven.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel4
  - number: '4.4'
    text: |-
      Op de eerste vordering van bij of krachtens [artikel 86 van deze wet][ref1] of
      [artikel 141 van het Wetboek van Strafvordering][ref2] met de opsporing van strafbare feiten belaste ambtenaren
      zijn personen die een veiligheidsfunctie uitoefenen dan wel op de uitoefening van zodanige functie toezicht houden,
      of daartoe aanstalten maken, verplicht hun medewerking te verlenen aan een voorlopig onderzoek van uitgeademde
      lucht en daartoe volgens door die ambtenaar te geven aanwijzingen ademlucht te blazen in een door die ambtenaar
      aangewezen apparaat.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel86
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '86'
        hoofdstuk: '6'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '4.5'
    text: |-
      Dit artikel is niet van toepassing voorzover [artikel 8 van de Wegenverkeerswet 1994][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel8
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '8'
  - number: '5'
    text: Onze Minister draagt zorg voor de aanleg, het beheer en het onderhoud van hoofdspoorweginfrastructuur.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel5
  - number: '6.1'
    text: |-
      Hoofdspoorweginfrastructuur voldoet aan de bij of krachtens algemene maatregel van bestuur te stellen regels
      en nadere regels ten aanzien van basiskwaliteit, te weten inrichting, uitrusting en technische eigenschappen,
      waaronder regels over:
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel6
  - number: 6.1.a
    text: algemene kenmerken van de infrastructuur;
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel6
  - number: 6.1.b
    text: aanleg en onderhoud;
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel6
  - number: 6.1.c
    text: beveiliging;
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel6
  - number: 6.1.d
    text: bouwwerken;
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel6
  - number: 6.1.e
    text: telecommunicatievoorzieningen;
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel6
  - number: 6.1.f
    text: kunstwerken;
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel6
  - number: 6.1.g
    text: spoorwegovergangen;
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel6
  - number: 6.1.h
    text: afstandsbediening;
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel6
  - number: 6.1.i
    text: energievoorziening.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel6
  - number: '6.2'
    text: |-
      De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel6
  - number: '7.1'
    text: |-
      Onverminderd de krachtens [artikel 6][ref1] gestelde regels zijn hoofdspoorwegen waar een snelheid van meer dan 40
      kilometer per uur is toegestaan, voorzien van een bij ministeriële regeling te omschrijven systeem van beveiliging.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel6
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '7.2'
    text: |-
      Onverminderd de krachtens [artikel 6][ref1] gestelde regels zijn gedeelten van een hoofdspoorweg die niet zijn
      gelegen in een gelijkvloerse kruising met een weg of in een voor het openbaar verkeer openstaande weg, zodanig
      afgesloten van de omgeving dat het publiek zich niet of slechts met bijzondere moeite op de spoorweg kan begeven.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel6
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '7.3'
    text: Onze Minister kan ontheffing verlenen van het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel7
  - number: '8.1'
    text: |-
      Onverminderd de krachtens [artikel 6][ref1] gestelde regels voldoet hoofdspoorweginfrastructuur waarover
      internationaal verkeer plaatsvindt aan de toepasselijke voorschriften van de [richtlijnen 2001/16/EG](32001L0016)
      en [96/48/EG](31996L0048) of van het Verdrag.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel6
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '8.2'
    text: 'De in het eerste lid bedoelde infrastructuur wordt vermoed te voldoen aan de voorschriften:'
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel8
  - number: 8.2.a
    text: |-
      van [richtlijn 2001/16/EG](32001L0016), indien ter zake een geldige EG-keuringsverklaring als bedoeld in artikel 16
      van die richtlijn is afgegeven;
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel8
  - number: 8.2.b
    text: |-
      van [richtlijn 96/48/EG](31996L0048), indien ter zake een geldige EG-keuringsverklaring als bedoeld in artikel 16
      van die richtlijn is afgegeven;
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel8
  - number: 8.2.c
    text: |-
      van het Verdrag, indien ter zake een geldig goedkeuringscertificaat als bedoeld in bijlage G van het Verdrag is
      afgegeven.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel8
  - number: '9.1'
    text: |-
      Een EG-keuringsverklaring als bedoeld in [artikel 8, tweede lid, onderdelen a of b][ref1], wordt afgegeven indien:


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel8
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 9.1.a
    text: |-
      de spoorweginfrastructuur voldoet aan de toepasselijke technische specificaties inzake interoperabiliteit, bedoeld
      in artikel 2, onderdeel g, van [richtlijn 2001/16/EG](32001L0016), respectievelijk artikel 2, onderdeel g, van
      [richtlijn 96/48/EG](31996L0048);
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel9
  - number: 9.1.b
    text: |-
      ten aanzien van de spoorweginfrastructuur een conformiteitsverklaring als bedoeld in [richtlijn 2001/16/EG]
      (32001L0016), bijlage VI, punt 3, respectievelijk in [richtlijn 96/48/EG](31996L0048), bijlage VI, punt 3, is
      afgegeven door een keuringsinstantie.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel9
  - number: '9.2'
    text: |-
      Een goedkeuringscertificaat als bedoeld in [artikel 8, tweede lid, onderdeel c][ref1], wordt afgegeven indien de
      spoorweginfrastructuur voldoet aan de bij of krachtens algemene maatregel van bestuur gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel8
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '10.1'
    text: |-
      Het is verboden de ingevolge [richtlijnen 2001/16/EG](32001L0016) of [96/48/EG](31996L0048) dan wel het Verdrag
      als zodanig aangemerkte onderdelen van hoofdspoorweginfrastructuur als zodanig in de handel te brengen indien ten
      aanzien daarvan niet zijn afgegeven:
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel10
  - number: 10.1.a
    text: |-
      geldige EG-verklaringen van conformiteit of geschiktheid voor gebruik als bedoeld in artikel 10 van [richtlijn
      2001/16/EG](32001L0016);
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel10
  - number: 10.1.b
    text: |-
      geldige EG-verklaringen van conformiteit of geschiktheid voor gebruik als bedoeld in artikel 10 van [richtlijn
      96/48/EG](31996L0048) of
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel10
  - number: 10.1.c
    text: geldige goedkeuringscertificaten als bedoeld in bijlage G van het Verdrag.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel10
  - number: '10.2'
    text: |-
      Het in het eerste lid, aanhef en onderdelen a en b, bedoelde verbod geldt niet ten aanzien van niet door de
      desbetreffende richtlijnen bestreken toepassing van deze onderdelen.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel10
  - number: '10.3'
    text: |-
      Degene die deze onderdelen gebruikt, zorgt dat deze onderdelen binnen hun toepassingsgebied worden gebruikt
      overeenkomstig hun bestemming, en dat zij naar behoren worden geïnstalleerd en onderhouden.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel10
  - number: '11.1'
    text: |-
      Een EG-verklaring als bedoeld in [artikel 10, eerste lid, onderdelen a of b][ref1], wordt afgegeven indien:


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel10
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 11.1.a
    text: |-
      de desbetreffende onderdelen voldoen aan de toepasselijke technische specificaties inzake interoperabiliteit,
      bedoeld in artikel 2, onderdeel g, van [richtlijn 2001/16/EG](32001L0016), respectievelijk artikel 2, onderdeel g,
      van [richtlijn 96/48/EG](31996L0048);
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel11
  - number: 11.1.b
    text: |-
      de toetsing van onderdeel a is uitgevoerd door een keuringsinstantie, respectievelijk door een keuringsinstantie
      voorzover de technische specificaties dat vereisen.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel11
  - number: '11.2'
    text: |-
      Een goedkeuringscertificaat als bedoeld in [artikel 10, eerste lid, onderdeel c][ref1], wordt afgegeven indien de
      desbetreffende onderdelen voldoen aan de bij of krachtens algemene maatregel van bestuur gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel10
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '11.3'
    text: |-
      Indien met betrekking tot de in het eerste lid bedoelde onderdelen andere EG-richtlijnen bestaan ten aanzien van
      andere aspecten dan geregeld in bedoelde technische specificaties, vermelden de verklaringen, bedoeld in dat lid,
      tevens of de onderdelen aan die andere EG-richtlijnen voldoen.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel11
  - number: '12.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de aanvraag, afgifte, vorm en inhoud
      van EG-keuringsverklaringen als bedoeld in [artikel 8, tweede lid, onderdelen a en b][ref1], EG-verklaringen
      als bedoeld in [artikel 10, eerste lid, onderdelen a en b][ref2], en goedkeuringscertificaten als bedoeld in de
      [artikelen 8, eerste lid, onderdeel c][ref3], en [10, eerste lid, onderdeel c][ref4], alsmede over het registreren
      of bewaren van gegevens of documenten over de aanvraag en afgifte.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0015007#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0015007#Artikel10
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0015007
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0015007
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0015007
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '12.2'
    text: |-
      Met de in het eerste lid bedoelde EG-keuringsverklaringen en EG-verklaringen worden gelijkgesteld zodanige
      verklaringen afgegeven met inachtneming van de [richtlijnen 2001/16/EG](32001L0016) of [96/48/EG](31996L0048) door
      de bevoegde instantie van een andere lidstaat.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel12
  - number: '12.3'
    text: |-
      Met de in het eerste lid bedoelde goedkeuringscertificaten worden gelijkgesteld zodanige certificaten afgegeven met
      inachtneming van het Verdrag door de bevoegde instantie van een andere staat die partij is bij het Verdrag.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel12
  - number: '13.1'
    text: |-
      Het is verboden een EG-keuringsverklaring als bedoeld in [artikel 8, tweede lid, onderdelen a of b][ref1], af te
      geven indien niet is voldaan aan [artikel 9, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel9
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0015007
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '13.2'
    text: |-
      Het is verboden een EG-verklaring als bedoeld in [artikel 10, eerste lid, onderdelen a of b][ref1], af te geven
      indien niet is voldaan aan [artikel 11, eerste of derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel11
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0015007
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '14.1'
    text: |-
      De fabrikant van onderdelen van hoofdspoorweginfrastructuur als bedoeld in [artikel 10, eerste lid][ref1], en zijn
      in Nederland gevestigde gemachtigde, die in strijd met [artikel 13, tweede lid][ref2], een EG-verklaring als daar
      bedoeld hebben afgegeven, zijn verplicht op eerste vordering van Onze Minister en binnen een door deze te stellen
      termijn het verzuim te herstellen. Zij zijn verplicht de daarbij door Onze Minister gegeven aanwijzingen op te
      volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel13
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0015007
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '14.2'
    text: |-
      Indien de fabrikant of zijn in Nederland gevestigde gemachtigde niet voldoet aan het eerste lid, neemt Onze
      Minister met toepassing van artikel 12 van [richtlijn 2001/16/EG](32001L0016) of van [richtlijn 96/48/EG]
      (31996L0048) maatregelen om het in de handel brengen van het betrokken onderdeel te beperken, te verbieden of het
      uit de handel te doen nemen.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel14
  - number: '15'
    text: |-
      Indien Onze Minister vaststelt dat een onderdeel van hoofdspoorweginfrastructuur als bedoeld in
      [artikel 10, eerste lid][ref1], ondanks het feit dat ten aanzien daarvan een EG-verklaring als bedoeld
      in [artikel 10, eerste lid, onderdelen a of b][ref2], is afgegeven en ondanks het feit dat dit onderdeel
      overeenkomstig zijn bestemming wordt gebruikt, de veiligheid van het verkeer op de hoofdspoorwegen of
      interoperabiliteit als bedoeld in artikel 2, onderdeel b, van [richtlijn 96/48/EG](31996L0048) of van [richtlijn
      2001/16/EG](32001L0016) in gevaar brengt, neemt hij met toepassing van de artikelen 12 van deze richtlijnen
      maatregelen om het toepassingsgebied van dit onderdeel te beperken, het gebruik ervan te verbieden of het uit de
      handel te doen nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel10
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0015007
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '16.1'
    text: |-
      Onze Minister verleent een of meer concessies voor het beheer van de hoofdspoorweginfrastructuur. Het beheer omvat
      de zorg voor:
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel16
  - number: 16.1.a
    text: de kwaliteit, betrouwbaarheid en beschikbaarheid van de infrastructuur;
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel16
  - number: 16.1.b
    text: |-
      een eerlijke, niet-discriminerende verdeling van de capaciteit van de infrastructuur zowel ten behoeve van de
      beheerder als ten behoeve van spoorwegondernemingen;
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel16
  - number: 16.1.c
    text: het leiden van het verkeer over de infrastructuur.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel16
  - number: '16.2'
    text: Een concessie bevat een beschrijving van de werkzaamheden waarvoor de concessie wordt verleend.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel16
  - number: '16.3'
    text: Een concessie wordt verleend voor ten minste drie jaar.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel16
  - number: '16.4'
    text: |-
      Een concessie wordt niet verleend aan een spoorwegonderneming dan met inachtneming van artikel 6, derde lid, van
      [richtlijn 91/440/EEG](31991L0440) en de artikelen 4, tweede lid, en 14, tweede lid, van [richtlijn 2001/14/EG]
      (32001L0014).
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel16
  - number: '17.1'
    text: |-
      Aan de concessie worden in elk geval voorschriften, onder meer houdende prestatie-indicatoren, verbonden om te
      waarborgen dat:
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel17
  - number: 17.1.a
    text: de infrastructuur in goede staat verkeert en geschikt is voor het verkeer of ander gebruik waarvoor zij bestemd is;
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel17
  - number: 17.1.b
    text: de infrastructuur veilig en doelmatig bereden kan worden zonder overmatige slijtage aan spoorvoertuigen;
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel17
  - number: 17.1.c
    text: |-
      de risico's van het gebruik en beheer voor de veiligheid van hoofdspoorwegen worden geanalyseerd en dat passende
      maatregelen worden genomen, waaronder het zo nodig buiten dienst stellen van een gedeelte van de hoofdspoorweg,
      om deze risico's afdoende te beheersen, waarbij rekening wordt gehouden met de specifieke vereisten van de te
      verwachten bedrijfsvoering en de stand der techniek;
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel17
  - number: 17.1.d
    text: voldaan wordt aan de [richtlijnen 91/440/EEG](31991L0440) en [2001/14/EG](32001L0014);
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel17
  - number: 17.1.e
    text: de beheerder financieel draagkrachtig en beroepsbekwaam is.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel17
  - number: '17.2'
    text: 'Aan de concessie worden voorts in elk geval voorschriften verbonden ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel17
  - number: 17.2.a
    text: door de beheerder te berekenen tarieven voor diensten aan derden;
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel17
  - number: 17.2.b
    text: |-
      het verstrekken van gegevens aan Onze Minister ten behoeve van het toezicht op de naleving van de concessie
      alsmede ten behoeve van het voldoen aan de verplichtingen die Onze Minister met betrekking tot de hoofdspoorwegen
      heeft ingevolge de [artikelen 116][ref1], [118][ref2] en [122 van de Wet geluidhinder][ref3] ter uitvoering van
      [richtlijn nr. 2002/49/EG](32002L0049) van het Europees Parlement en de Raad van de Europese Unie van 25 juni 2002
      inzake de evaluatie en de beheersing van omgevingslawaai (PbEG L 189);


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel116
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel118
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel122
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '116'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '118'
      - id: ref3
        bwb_id: BWBR0003227
        artikel: '122'
  - number: 17.2.c
    text: |-
      het opstellen van een financiële verantwoording van het uitvoeren van de concessie, welke verantwoording gescheiden
      is van die voor andere werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel17
  - number: '17.3'
    text: |-
      Een wijziging van de technische of functionele eigenschappen van de hoofdspoorweginfrastructuur die de
      gebruiksmogelijkheden van de hoofdspoorwegen aanmerkelijk verandert, behoeft de voorafgaande instemming van Onze
      Minister. De beheerder vermeldt in zijn verzoek om instemming de zienswijzen van betrokken gerechtigden als bedoeld
      in [artikel 57][ref1] en, voorzover de wijziging afwijkt van die zienswijzen, een deugdelijke motivering van die
      afwijking.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel57
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '57'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '18.1'
    text: |-
      Onze Minister kan een concessie geheel of gedeeltelijk intrekken indien de beheerder de concessie of een voor de
      beheerder geldend wettelijk voorschrift niet naleeft.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel18
  - number: '18.2'
    text: |-
      Onze Minister gaat niet tot intrekking over dan nadat hij de beheerder de gelegenheid heeft geboden om binnen
      een daartoe te bepalen termijn zijn handelen alsnog in overeenstemming te brengen met de concessie, dan wel het
      wettelijk voorschrift.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel18
  - number: '18.3'
    text: |-
      Voordat Onze Minister een concessie verleent, wijzigt of geheel of gedeeltelijk intrekt, stelt hij betrokken
      gerechtigden als bedoeld in [artikel 57][ref1] in de gelegenheid om gedurende een door Onze Minister daarbij te
      bepalen termijn van ten hoogste drie weken hun zienswijze naar voren te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel57
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '57'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '18.4'
    text: |-
      Een concessie wordt niet eerder verleend dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal
      is overgelegd.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel18
  - number: '18.5'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over het verlenen of wijzigen van een
      concessie en over de aan een concessie te verbinden voorschriften.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel18
  - number: '19.1'
    text: |-
      Het is verboden zonder vergunning van Onze Minister gebruik te maken van hoofdspoorwegen en de daarnaast gelegen
      gronden door anders dan waartoe deze zijn bestemd:
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel19
  - number: 19.1.a
    text: |-
      binnen de begrenzing van de hoofdspoorweg aan, op, in, onder, boven of naast de hoofdspoorweg, bouwwerken of
      andere opstallen op te richten of werken, inrichtingen, kabels, leidingen of beplantingen aan te brengen, te doen
      aanbrengen of te hebben, dan wel daarmee verband houdende werkzaamheden uit te voeren of te doen uitvoeren;
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel19
  - number: 19.1.b
    text: |-
      binnen de begrenzing van de hoofdspoorweg, op, in, onder of naast de hoofdspoorweg vaste stoffen of vloeistoffen
      te storten of te doen storten, met uitzondering van vaste stoffen of vloeistoffen die vrijkomen bij de normale
      bedrijfsvoering van spoorvoertuigen;
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel19
  - number: 19.1.c
    text: |-
      binnen de begrenzing van de hoofdspoorweg, op, in, onder, boven of naast de hoofdspoorweg, voorwerpen te plaatsen
      of neer te leggen of graafwerk te verrichten of deze activiteiten te doen uitvoeren;
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel19
  - number: 19.1.d
    text: binnen 14 meter van de begrenzing van de hoofdspoorweg licht ontvlambare stoffen te hebben of op te slaan.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel19
  - number: '19.2'
    text: |-
      Een vergunning op grond van het eerste lid kan onder beperkingen worden verleend. Aan de vergunning kunnen
      voorschriften worden verbonden, onder meer ter bescherming van de hoofdspoorweg, in het belang van een veilig en
      doelmatig gebruik ervan of het financieel belang van de Staat.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel19
  - number: '19.3'
    text: Het eerste lid is niet van toepassing op het uitvoeren van het beheer van de hoofdspoorweginfrastructuur.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel19
  - number: '20.1'
    text: |-
      Bij een hoofdspoorweg wordt de begrenzing van de hoofdspoorweg, bedoeld in [artikel 19][ref1], aan weerszijden
      gevormd door een lijn liggend op een afstand:


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel19
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '19'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 20.1.a
    text: |-
      van elf meter bij een hoofdspoorweg op maaiveldniveau gemeten vanaf het hart van het buitenste spoor, zijnde een
      denkbeeldige lijn in de lengterichting van het spoor midden tussen beide spoorstaven;
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel20
  - number: 20.1.b
    text: van zes meter bij een hoofdspoorweg in ingraving gemeten uit de bovenzijde van de ingraving;
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel20
  - number: 20.1.c
    text: van zes meter bij een hoofdspoorweg in ophoging gemeten uit de teen van het talud;
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel20
  - number: 20.1.d
    text: |-
      die gelijk is aan de afstand tussen de bovenkant van de spoorstaaf en het maaiveld horizontaal gemeten vanaf de
      buitenste wand van de tunnel, in een verticale lijn tot het maaiveld, waarbij deze grenzen ten minste gelegen zijn
      op elf meter uit het hart van het spoor, indien het betreft een geboorde, ingegraven of afgezonken tunnel bij een
      hoofdspoorweg;
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel20
  - number: 20.1.e
    text: |-
      bij een hoofdspoorweg op of in een vaste constructie anders dan bedoeld in de onderdelen a tot en met d, van zes
      meter gemeten vanaf een horizontale lijn die ligt op tweemaal de afstand tussen de bovenkant van de spoorstaaf en
      het maaiveld vanaf de buitenste rand van de constructie, waarbij deze grenzen ten minste gelegen zijn op 11 meter
      uit het hart van het buitenste spoor.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel20
  - number: '20.2'
    text: |-
      Indien bij een hoofdspoorweg in ingraving of in ophoging de afstand tussen het hart van het buitenste spoor en de
      bovenkant van de ingraving of teen van het talud minder bedraagt dan vijf meter, wordt de begrenzing vastgesteld
      overeenkomstig het eerste lid, onderdeel a.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel20
  - number: '20.3'
    text: |-
      Indien de bodemgesteldheid daartoe aanleiding geeft, kan bij besluit van Onze Minister, gehoord de beheerder, een
      begrenzing worden vastgesteld die afwijkt van het eerste of tweede lid.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel20
  - number: '21.1'
    text: |-
      Het is verboden zaken te bouwen, neer te leggen, op te richten of aan te leggen die een meter of hoger reiken dan
      het maaiveld aan weerszijden van de hoofdspoorweg bij voor het openbaar verkeer openstaande overwegen buiten de
      bebouwde kom, binnen een vlak dat wordt gevormd door hoekpunten in het hart van het buitenste spoor op vijfhonderd
      meter aan weerszijden van de as van de weg en op elf meter uit het hart van het spoor in de as van de weg.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel21
  - number: '21.2'
    text: |-
      Onze Minister kan ontheffing verlenen van het in het eerste lid vervatte verbod. De ontheffing kan onder
      beperkingen worden verleend. Aan de ontheffing kunnen voorschriften worden verbonden in het belang van een veilig
      en doelmatig gebruik van de spoorweg of het financieel belang van de Staat.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel21
  - number: '22.1'
    text: 'Het is verboden:'
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel22
  - number: 22.1.a
    text: |-
      anders dan als rechtmatige gebruiker in te grijpen in de bediening of de werking van installaties van de
      hoofdspoorweginfrastructuur;
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel22
  - number: 22.1.b
    text: |-
      de hoofdspoorweginfrastructuur of delen daarvan te beschadigen, te vernielen, te verwijderen, af te breken, te
      verstoren, te verplaatsen of in enig opzicht te wijzigen;
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel22
  - number: 22.1.c
    text: |-
      zich op of langs gedeelten van een hoofdspoorweg, met uitzondering van een perron, die niet zijn gelegen in een
      gelijkvloerse kruising met een weg of in een voor het openbaar verkeer openstaande weg, te bevinden of daarop of
      daarlangs dieren te drijven of te laten lopen;
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel22
  - number: 22.1.d
    text: |-
      enige handeling op of nabij de hoofdspoorweg te verrichten waardoor het beheer van de hoofdspoorweginfrastructuur
      kan worden gehinderd of belemmerd.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel22
  - number: '22.2'
    text: 'Het eerste lid is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel22
  - number: 22.2.a
    text: het uitvoeren van het beheer;
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel22
  - number: 22.2.b
    text: de uitoefening van een veiligheidsfunctie;
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel22
  - number: 22.2.c
    text: de uitoefening van een wettelijke taak;
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel22
  - number: 22.2.d
    text: |-
      het uitvoeren van werkzaamheden in opdracht van een spoorwegonderneming die beschikt over een veiligheidsattest als
      bedoeld in [artikel 32, eerste lid][ref1], of een proefattest als bedoeld in [artikel 34][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel34
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '32'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0015007
        artikel: '34'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '22.3'
    text: |-
      Onze Minister kan ontheffing verlenen van het in het eerste lid vervatte verbod.
      [Artikel 21, tweede lid, tweede en derde volzin][ref1], zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel21
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '23'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld ter uitvoering van de
      [artikelen 19 tot en met 22][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel19
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '19'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '24.1'
    text: |-
      Onverminderd de bij of krachtens andere wetten ter zake gegeven voorschriften wordt aanraking, doorsnijding of
      overbrugging van andere infrastructuur van openbaar nut door hoofdspoorwegen waarvan de aanleg vanwege het Rijk
      is opgedragen of toegestaan, gedoogd door de rechthebbende ten aanzien van die andere infrastructuur. Onder
      infrastructuur van openbaar nut wordt in ieder geval begrepen infrastructuur waarvan het beheer bij of krachtens
      wet is opgedragen en infrastructuur in beheer bij een openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel24
  - number: '24.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over financiering, onderhoud,
      instandhouding, aanleg, uitbreiding, gedeeld gebruik en verdeling van de gebruiksmogelijkheden van kunstwerken
      voorzover deze dienen tot aanraking, doorsnijding of overbrugging als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel24
  - number: '24.3'
    text: |-
      Een hoofdspoorweg die is of wordt aangelegd, hersteld, vernieuwd of uitgebreid, wordt voor de toepassing van de
      [Belemmeringenwet Verordeningen][ref1] en de [Belemmeringenwet Privaatrecht][ref2] aangemerkt als openbaar werk van
      algemeen nut.


      [ref1]: https://wetten.overheid.nl/BWBR0001865
      [ref2]: https://wetten.overheid.nl/BWBR0001936
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0001865
      - id: ref2
        bwb_id: BWBR0001936
  - number: '25'
    text: |-
      Deze paragraaf geldt onverkort voor de rechthebbende ten aanzien van de onder of naast de
      hoofdspoorweginfrastructuur gelegen grond, de daarin gelegen werken en daarop gelegen opstallen.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel25
  - number: '26.1'
    text: |-
      De rechthebbende ten aanzien van een rechtstreeks aan de hoofdspoorweg gelegen station draagt ervoor zorg dat
      reizigers, gehandicapten daaronder begrepen, via de in het station aanwezige hallen, tunnels, trappen en liften,
      met logische en overzichtelijke routes, een veilige en adequate toegang hebben tot perrons en spoorvoertuigen.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel26
  - number: '26.2'
    text: |-
      Onder station wordt in het eerste lid verstaan: een gebouw of werk dat blijkens zijn constructie en inrichting
      geheel of gedeeltelijk is bestemd voor aankomst en vertrek van spoorvoertuigen met het oog op het in-, uit- of
      overstappen van reizigers.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel26
  - number: '26.3'
    text: |-
      Indien de veilige en adequate toegang tot perrons, laad- of losplaatsen of spoorvoertuigen in het gedrang komt of
      dreigt te komen, geeft Onze Minister aan de betrokken rechthebbende een bindende aanwijzing ter waarborging van die
      toegang. Tevens kan Onze Minister aan de betrokken rechthebbende een bindende aanwijzing geven met betrekking tot
      fysieke voorzieningen ter bevordering van de sociale veiligheid op de stations.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel26
  - number: '26.4'
    text: Desgevraagd adviseert de beheerder Onze Minister over de toepassing van het derde lid.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel26
  - number: '27.1'
    text: Een spoorwegonderneming heeft op niet-discriminerende grondslag recht op toegang tot hoofdspoorwegen.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel27
  - number: '27.2'
    text: 'Geen toegang tot hoofdspoorwegen heeft een spoorwegonderneming:'
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel27
  - number: 27.2.a
    text: die niet beschikt over een geldige bedrijfsvergunning;
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel27
  - number: 27.2.b
    text: die niet beschikt over een geldig veiligheidsattest of proefattest;
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel27
  - number: 27.2.c
    text: |-
      die niet voldoet aan de voor haar ingevolge [artikel 55][ref1] geldende verzekeringsplicht;


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel55
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '55'
        hoofdstuk: '3'
        paragraaf: '6'
  - number: 27.2.d
    text: |-
      indien het recht op die toegang niet rechtstreeks voortvloeit uit een toegangsovereenkomst als bedoeld in
      [artikel 59][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel59
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '59'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 27.2.e
    text: die anderszins niet gerechtigd is van de hoofdspoorweg gebruik te maken.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel27
  - number: '28.1'
    text: |-
      Onze Minister verleent op aanvraag een bedrijfsvergunning aan een in Nederland gevestigde spoorwegonderneming,
      indien deze voldoet aan de vereisten van goede naam, financiële draagkracht en beroepsbekwaamheid alsmede de uit
      [artikel 55][ref1] voortvloeiende verzekeringsplicht.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel55
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '55'
        hoofdstuk: '3'
        paragraaf: '6'
  - number: '28.2'
    text: |-
      Onze Minister kan voor bij of krachtens algemene maatregel van bestuur omschreven soorten van gebruik van de
      hoofdspoorweg, bij de verlening van een bedrijfsvergunning een of meer van de bij of krachtens algemene maatregel
      van bestuur aangewezen, in het eerste lid bedoelde eisen geheel of gedeeltelijk buiten toepassing laten. Alsdan is
      een zodanige beperkte bedrijfsvergunning slechts geldig voor het gebruik waarvoor deze is verleend.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel28
  - number: '28.3'
    text: Onze Minister beslist binnen dertien weken op de aanvraag.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel28
  - number: '28.4'
    text: Aan de vergunning kunnen voorschriften worden verbonden. De vergunning wordt verleend voor onbepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel28
  - number: '28.5'
    text: |-
      Onze Minister kan ambtshalve of op aanvraag van de vergunninghouder de vergunning wijzigen, alsnog voorschriften
      aan de vergunning verbinden en de aan de vergunning verbonden voorschriften aanvullen dan wel wijzigen.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel28
  - number: '29'
    text: 'Onze Minister schorst de bedrijfsvergunning of trekt deze in, indien:'
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel29
  - number: 29.a
    text: |-
      de vergunninghouder niet meer voldoet aan de bij of krachtens [artikel 28][ref1] toepasselijke eisen of
      voorschriften;


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel28
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 29.b
    text: |-
      de veiligheid van het spoorverkeer door wijziging van de rechtspositie van de vergunninghouder ingeval van fusie of
      bedrijfsovername naar het oordeel van Onze Minister niet langer is gewaarborgd of
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel29
  - number: 29.c
    text: |-
      bij herhaling bij onherroepelijk rechterlijk vonnis is vastgesteld dat de vergunninghouder of zijn bestuurders
      het bepaalde bij of krachtens deze wet dan wel de toepasselijke voorschriften inzake arbeidsomstandigheden of
      arbeidstijden hebben overtreden, dan wel bij onherroepelijk vonnis is vastgesteld dat deze het bepaalde bij of
      krachtens deze wet dan wel de toepasselijke voorschriften inzake arbeidsomstandigheden of arbeidstijden in ernstige
      mate hebben overtreden.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel29
  - number: '30.1'
    text: |-
      Een vergunning als bedoeld in artikel 2, onderdeel b, van [richtlijn 95/18/EG](31995L0018) die is verleend door een
      bevoegde instantie van een andere lidstaat aan een aldaar gevestigde spoorwegonderneming, wordt voor de toepassing
      van deze wet gelijkgesteld met een bedrijfsvergunning, verleend op grond van [artikel 28, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel28
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '30.2'
    text: |-
      Met een bedrijfsvergunning verleend op grond van [artikel 28, eerste lid][ref1], worden voorts voor de toepassing
      van deze wet gelijkgesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel28
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 30.2.a
    text: |-
      de bij ministeriële regeling omschreven documenten die in het buitenland door het aldaar bevoegde gezag
      zijn afgegeven en die in voldoende mate kunnen gelden als bewijs dat ten minste wordt voldaan aan de in
      [artikel 28, eerste lid][ref1], bedoelde eisen;


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel28
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 30.2.b
    text: |-
      een besluit van Onze Minister waarin ten aanzien van een in het buitenland gevestigde spoorwegonderneming is
      verklaard dat ten minste wordt voldaan aan de in [artikel 28, eerste lid][ref1], vermelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel28
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '30.3'
    text: |-
      [Artikel 29][ref1] is van overeenkomstige toepassing op de gelijkstelling krachtens het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel29
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '31'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gegeven over de uitvoering van deze paragraaf,
      waaronder regels over:
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel31
  - number: 31.a
    text: |-
      de toepassing van de in [artikel 28][ref1], eerste lid, bedoelde eisen;


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel28
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 31.b
    text: de verlening, weigering, wijziging, schorsing of intrekking van een bedrijfsvergunning;
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel31
  - number: 31.c
    text: de aan de bedrijfsvergunning te verbinden voorschriften en beperkingen.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel31
  - number: '32.1'
    text: |-
      Onze Minister verleent op aanvraag een veiligheidsattest aan de houder of de aanvrager van een bedrijfsvergunning,
      indien deze aantoont:
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel32
  - number: 32.1.a
    text: |-
      bij het voorgenomen gebruik van de spoorweg te kunnen voldoen aan de bij of krachtens dit hoofdstuk gestelde
      voorschriften en
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel32
  - number: 32.1.b
    text: door toepassing van een adequaat veiligheidszorgsysteem veilig gebruik te kunnen maken van de spoorweg.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel32
  - number: '32.2'
    text: |-
      Onze Minister beslist binnen dertien weken op de aanvraag. Indien de beschikking niet binnen dertien weken
      kan worden gegeven, stelt Onze Minister de aanvrager daarvan in kennis en noemt daarbij een redelijke termijn
      waarbinnen de beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel32
  - number: '33.1'
    text: Het veiligheidsattest is ten hoogste drie jaar geldig.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel33
  - number: '33.2'
    text: |-
      De attesthouder past een adequaat veiligheidszorgsysteem toe, met behulp waarvan wordt gewaarborgd dat de
      spoorwegonderneming:
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel33
  - number: 33.2.a
    text: |-
      bij de normale bedrijfsvoering en bij voorzienbare afwijkingen daarvan geen schade berokkent en niemand onnodig
      hindert of in gevaar brengt en zorgt dat het spoorverkeer zo veel mogelijk zonder verstoringen kan worden
      afgewikkeld;
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel33
  - number: 33.2.b
    text: |-
      rekening houdt met de specifieke vereisten wanneer de normale bedrijfsvoering raakt aan die van andere gebruikers
      van de spoorweg of van de beheerder;
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel33
  - number: 33.2.c
    text: |-
      de aan de bedrijfsvoering verbonden risico's onderkent en passende maatregelen neemt om deze afdoende te beheersen
      en daarbij rekening houdt met de stand der techniek en de binnen de bedrijfstak aanwezige kennis en richtsnoeren
      voor een veilige bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel33
  - number: 33.2.d
    text: |-
      procedures vaststelt en hanteert voor het nemen van corrigerende maatregelen bij afwijkingen en incidenten, alsmede
      voor het voortdurend verbeteren van het veiligheidsniveau met het oog op zich wijzigende omstandigheden en op grond
      van opgedane ervaringen;
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel33
  - number: 33.2.e
    text: |-
      ervoor zorg draagt dat werknemers met een veiligheidsfunctie met het oog op het behouden van hun geschiktheid,
      kennis en bekwaamheid voor de desbetreffende functie de noodzakelijke oefening hebben en de noodzakelijke nadere of
      aanvullende scholing, opleiding en studie volgen.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel33
  - number: '33.3'
    text: Het veiligheidszorgsysteem is passend voor de aard en de omvang van de spoorwegonderneming.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel33
  - number: '33.4'
    text: |-
      Aan het veiligheidsattest kunnen beperkingen en voorschriften worden verbonden in het belang van de veiligheid op
      en in de directe nabijheid van de spoorweg.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel33
  - number: '33.5'
    text: 'Onze Minister kan het veiligheidsattest schorsen of intrekken:'
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel33
  - number: 33.5.a
    text: wegens handelen in strijd met dit hoofdstuk;
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel33
  - number: 33.5.b
    text: in het belang van de veiligheid op en in de directe nabijheid van de spoorweg;
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel33
  - number: 33.5.c
    text: indien de bedrijfsvergunning van de attesthouder is geschorst of ingetrokken.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel33
  - number: '33.6'
    text: |-
      Onze Minister kan het veiligheidsattest of de daaraan verbonden beperkingen en voorschriften ambtshalve of op
      aanvraag wijzigen, met inachtneming van het belang van de veiligheid op en in de directe nabijheid van de spoorweg.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel33
  - number: '33.7'
    text: Overtreding van de voorschriften, bedoeld in het vierde lid, is verboden.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel33
  - number: '34.1'
    text: |-
      Onze Minister kan aan degene die een veiligheidsattest heeft aangevraagd of aan de attesthouder die een wijziging
      van het veiligheidsattest heeft aangevraagd een proefattest verlenen.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel34
  - number: '34.2'
    text: |-
      Het proefattest wordt verleend met het oog op het opdoen van ervaring of het testen van procedures of
      spoorvoertuigen ten behoeve van verlening of wijziging van een veiligheidsattest.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel34
  - number: '34.3'
    text: |-
      Het proefattest is ten hoogste dertien weken geldig en vervalt van rechtswege bij de verlening of de wijziging,
      bedoeld in het tweede lid. Indien toepassing is gegeven aan [artikel 32, tweede lid, tweede volzin][ref1], vervalt
      het proefattest met ingang van de dag na de laatste dag van de krachtens die bepaling gestelde termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel32
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '32'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '34.4'
    text: |-
      [Artikel 33, vierde en vijfde lid][ref1], is op het proefattest van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel33
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '35'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gegeven over de uitvoering van deze paragraaf,
      waaronder regels ten aanzien van:
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel35
  - number: 35.a
    text: de verlening, weigering, wijziging, schorsing of intrekking van een veiligheidsattest en van een proefattest;
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel35
  - number: 35.b
    text: de aan een veiligheidsattest en een proefattest te verbinden voorschriften en beperkingen;
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel35
  - number: 35.c
    text: de bedrijfsprocessen die ten minste in het veiligheidszorgsysteem zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel35
  - number: '36.1'
    text: 'Het is verboden over een hoofdspoorweg te rijden met een spoorvoertuig:'
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel36
  - number: 36.1.a
    text: |-
      waarvoor geen geldige EG-keuringsverklaring of geldig goedkeuringscertificaat als bedoeld in [artikel 37][ref1]
      is afgegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel37
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '37'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 36.1.b
    text: |-
      dat niet voldoet aan de toepasselijke technische specificaties of eisen, bedoeld in [artikel 47][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel47
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '47'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 36.1.c
    text: dat storingen, buitensporige slijtage of schade aan de desbetreffende spoorweginfrastructuur kan veroorzaken;
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel36
  - number: 36.1.d
    text: |-
      dat niet beschikt over de eigenschappen die noodzakelijk zijn om veilig gebruik te kunnen maken van de
      desbetreffende spoorweginfrastructuur.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel36
  - number: '36.2'
    text: |-
      Met een EG-keuringsverklaring als bedoeld in het eerste lid wordt gelijkgesteld een zodanige verklaring afgegeven
      met inachtneming van [richtlijn 2001/16/EG](32001L0016) onderscheidenlijk 96/48/EG door de bevoegde instantie van
      een andere lidstaat.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel36
  - number: '36.3'
    text: |-
      Met een goedkeuringscertificaat als bedoeld in het eerste lid, voorzover afgegeven op basis van het Verdrag wordt
      gelijkgesteld een zodanig certificaat afgegeven met inachtneming van het Verdrag door de bevoegde instantie van een
      andere staat die partij is bij het Verdrag.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel36
  - number: '36.4'
    text: |-
      Tot het bewijs dat een spoorvoertuig is gecontroleerd op het voldoen aan de regels, bedoeld in
      [artikel 38, eerste lid, onderdeel a][ref1], is een geldig inzetcertificaat vereist, afgegeven door Onze Minister,
      de beheerder gehoord.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel38
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '38'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '36.5'
    text: |-
      Onze Minister, de beheerder gehoord, kan het certificaat, bedoeld in het vierde lid, wijzigen of intrekken indien
      niet langer aan de regels, bedoeld in [artikel 38, eerste lid, onderdeel a][ref1], wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel38
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '38'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '36.6'
    text: Het certificaat, bedoeld in het vierde lid, kan onder voorschriften of beperkingen worden afgegeven.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel36
  - number: '36.7'
    text: |-
      Bij ministeriële regeling kunnen categorieën van spoorvoertuigen worden aangewezen, waarop het vierde lid niet van
      toepassing is.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel36
  - number: '37.1'
    text: |-
      Een EG-keuringsverklaring als bedoeld in [artikel 36, eerste lid][ref1], wordt afgegeven indien:


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel36
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 37.1.a
    text: |-
      het spoorvoertuig dan wel de uitrusting daarvan voldoet aan de toepasselijke technische specificaties inzake
      interoperabiliteit, bedoeld in artikel 2, onderdeel g, van [richtlijn 2001/16/EG](32001L0016), respectievelijk
      artikel 2, onderdeel g, van [richtlijn 96/48/EG](31996L0048) en
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel37
  - number: 37.1.b
    text: |-
      ten aanzien van het spoorvoertuig of de uitrusting daarvan een conformiteitsverklaring als bedoeld in [richtlijn
      2001/16/EG](32001L0016), bijlage VI, punt 3, respectievelijk in [richtlijn 96/48/EG](31996L0048), bijlage VI, punt
      3, is afgegeven door een keuringsinstantie.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel37
  - number: '37.2'
    text: |-
      Een goedkeuringscertificaat als bedoeld in [artikel 36, eerste lid][ref1], wordt afgegeven, indien het
      spoorvoertuig of de uitrusting daarvan voldoet aan de bij of krachtens algemene maatregel van bestuur gestelde
      eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel36
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '38.1'
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels of nadere regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel38
  - number: 38.1.a
    text: |-
      de compatibiliteit van spoorvoertuigen met de spoorweginfrastructuur, bedoeld in
      [artikel 36, eerste lid, onderdelen c en d][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel36
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 38.1.b
    text: |-
      de aanvraag, afgifte, wijziging, intrekking, vorm of inhoud van de EG-keuringsverklaringen, de
      goedkeuringscertificaten en de inzetcertificaten, bedoeld in [artikel 36][ref1], en de aan die certificaten te
      verbinden voorschriften of beperkingen, alsmede over het registreren of bewaren van gegevens of documenten over de
      aanvraag, afgifte, wijziging of intrekking;


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel36
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 38.1.c
    text: |-
      het onderzoek naar de overeenstemming van de productie van spoorvoertuigen of uitrusting daarvan, waarvoor een
      goedkeuring van het type is verleend, met het goedgekeurde type.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel38
  - number: '38.2'
    text: |-
      Bij of krachtens de algemene maatregel van bestuur, bedoeld in het eerste lid, kunnen in het belang van de
      veiligheid of de interoperabiliteit van het verkeer over hoofdspoorwegen aanvullende technische specificaties
      worden gesteld op de technische specificaties, bedoeld in [artikel 37, eerste lid, onderdelen a en b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel37
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '37'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '39.1'
    text: |-
      Het is verboden de ingevolge [richtlijnen 2001/16/EG](32001L0016) of [96/48/EG](31996L0048) dan wel het Verdrag dan
      wel krachtens deze wet als zodanig aangewezen onderdelen van spoorvoertuigen of uitrusting daarvan als zodanig in
      de handel te brengen of te gebruiken, indien ten aanzien daarvan niet zijn afgegeven:
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel39
  - number: 39.1.a
    text: |-
      geldige EG-verklaringen van conformiteit of geschiktheid voor gebruik als bedoeld in artikel 10 van [richtlijn
      2001/16/EG](32001L0016);
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel39
  - number: 39.1.b
    text: |-
      geldige EG-verklaringen van conformiteit of geschiktheid voor gebruik als bedoeld in artikel 10 van [richtlijn
      96/48/EG](31996L0048) of
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel39
  - number: 39.1.c
    text: geldige goedkeuringscertificaten.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel39
  - number: '39.2'
    text: |-
      Met een EG-verklaring als bedoeld in het eerste lid, onderdelen a of b, wordt gelijkgesteld een zodanige verklaring
      afgegeven met inachtneming van [richtlijn 2001/16/EG](32001L0016) onderscheidenlijk 96/48/EG door de bevoegde
      instantie van een andere lidstaat.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel39
  - number: '39.3'
    text: |-
      Met een goedkeuringscertificaat als bedoeld in het eerste lid, onderdeel c, voorzover afgegeven op basis van het
      Verdrag wordt gelijkgesteld een zodanig certificaat afgegeven met inachtneming van het Verdrag door de bevoegde
      instantie van een andere staat die partij is bij het Verdrag.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel39
  - number: '40.1'
    text: |-
      Een EG-verklaring als bedoeld in [artikel 39, eerste lid, onderdelen a of b][ref1], wordt afgegeven indien:


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel39
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '39'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 40.1.a
    text: |-
      de desbetreffende onderdelen voldoen aan de toepasselijke technische specificaties inzake interoperabiliteit als
      bedoeld in artikel 2, onderdeel g, van [richtlijn 2001/16/EG](32001L0016), respectievelijk artikel 2, onderdeel g,
      van [richtlijn 96/48/EG](31996L0048);
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel40
  - number: 40.1.b
    text: |-
      de toetsing van onderdeel a is uitgevoerd door een keuringsinstantie, respectievelijk door een keuringsinstantie
      voorzover de technische specificaties dit vereisen.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel40
  - number: '40.2'
    text: |-
      Een goedkeuringscertificaat als bedoeld in [artikel 39, eerste lid, onderdeel c][ref1], wordt afgegeven indien de
      desbetreffende onderdelen voldoen aan de bij of krachtens algemene maatregel van bestuur gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel39
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '39'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '40.3'
    text: |-
      Indien met betrekking tot de in het eerste lid bedoelde onderdelen, andere EG-richtlijnen bestaan ten aanzien van
      andere aspecten dan geregeld in bedoelde technische specificaties, vermelden de verklaringen, bedoeld in dat lid,
      tevens of deze onderdelen aan die andere EG-richtlijnen voldoen.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel40
  - number: '41.1'
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels of nadere regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel41
  - number: 41.1.a
    text: |-
      de aanvraag, afgifte, vorm en inhoud van de EG-verklaringen en de goedkeuringscertificaten, bedoeld in
      [artikel 39][ref1], alsmede over het registreren of bewaren van gegevens of documenten over de aanvraag en afgifte;


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel39
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '39'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 41.1.b
    text: |-
      het onderzoek naar de overeenstemming van de productie van als zodanig aangewezen onderdelen van spoorvoertuigen of
      uitrusting daarvan, waarvoor een goedkeuring van het type is verleend, met het goedgekeurde type.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel41
  - number: '41.2'
    text: |-
      Bij of krachtens de algemene maatregel van bestuur, bedoeld in het eerste lid, kunnen in het belang van de
      veiligheid of de interoperabiliteit van het verkeer over de hoofdspoorwegen aanvullende technische specificaties
      worden gesteld op de technische specificaties, bedoeld in [artikel 40, eerste lid, onderdelen a en b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel40
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '40'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '42.1'
    text: |-
      Het is verboden een EG-keuringsverklaring als bedoeld in [artikel 36, eerste lid][ref1], af te geven indien niet is
      voldaan aan [artikel 37][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel37
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0015007
        artikel: '37'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '42.2'
    text: |-
      Het is verboden een EG-verklaring als bedoeld in [artikel 39, eerste lid, onderdelen a of b][ref1], af te geven
      indien niet is voldaan aan [artikel 40, eerste en derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel40
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '39'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0015007
        artikel: '40'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '43.1'
    text: |-
      De fabrikant van onderdelen van spoorvoertuigen of uitrusting daarvan als bedoeld in
      [artikel 39, eerste lid, onderdelen a of b][ref1], en zijn in Nederland gevestigde gemachtigde die in strijd
      met [artikel 42, tweede lid][ref2], een EG-verklaring als daar bedoeld voor die onderdelen hebben afgegeven,
      zijn verplicht op eerste vordering van Onze Minister en binnen een door deze te stellen termijn het verzuim te
      herstellen. Zij zijn verplicht de daarbij door Onze Minister gegeven aanwijzingen op te volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel42
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '39'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0015007
        artikel: '42'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '43.2'
    text: |-
      Indien de fabrikant of zijn in Nederland gevestigde gemachtigde niet voldoet aan het eerste lid, neemt Onze
      Minister met toepassing van artikel 12 van [richtlijn 2001/16/EG](32001L0016) of van [richtlijn 96/48/EG]
      (31996L0048) maatregelen om het in de handel brengen van het betrokken onderdeel te beperken, te verbieden of het
      uit de handel te doen nemen.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel43
  - number: '44'
    text: |-
      Indien Onze Minister vaststelt dat een onderdeel van een spoorvoertuig of uitrusting daarvan als bedoeld
      in [artikel 39, eerste lid][ref1], ondanks het feit dat ten aanzien daarvan een EG-verklaring als bedoeld
      in [artikel 39, eerste lid, onderdelen a of b][ref2], is afgegeven en ondanks het feit dat dit onderdeel
      overeenkomstig zijn bestemming wordt gebruikt, de veiligheid van het verkeer op de hoofdspoorwegen of
      interoperabiliteit als bedoeld in artikel 2, onderdeel b, van [richtlijn 96/48/EG](31996L0048) of van [richtlijn
      2001/16/EG](32001L0016) in gevaar brengt, neemt hij met toepassing van de artikelen 12 van deze richtlijnen
      maatregelen om het toepassingsgebied van dit onderdeel te beperken, het gebruik ervan te verbieden of het uit de
      handel te doen nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel39
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '39'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0015007
        artikel: '39'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '45'
    text: |-
      De spoorwegonderneming die een krachtens deze wet goedgekeurd spoorvoertuig gebruikt, doet overeenkomstig bij of
      krachtens algemene maatregel van bestuur te stellen regels onverwijld mededeling van:
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel45
  - number: 45.a
    text: |-
      een ernstige beschadiging van het spoorvoertuig, zodanig dat het spoorvoertuig niet op eenvoudige wijze in een
      toestand kan worden gebracht, dat het rijdend vervoerd kan worden zonder de veiligheid van het verkeer op de
      hoofdspoorweg in gevaar te brengen;
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel45
  - number: 45.b
    text: |-
      wijzigingen in constructie, inrichting of uitrusting van het spoorvoertuig ten opzichte van de feitelijke situatie
      bij de goedkeuring;
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel45
  - number: 45.c
    text: de wijziging van eigenaar of houder van dat voertuig of de definitieve buitengebruikstelling daarvan.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel45
  - number: '46.1'
    text: |-
      Onze Minister, de beheerder gehoord, kan ontheffing verlenen van het verbod, bedoeld in
      [artikel 36, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel36
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '46.2'
    text: |-
      Aan een ontheffing kunnen voorschriften of beperkingen worden verbonden in het belang van een veilig en ongestoord
      gebruik van hoofdspoorwegen.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel46
  - number: '46.3'
    text: Overtreding van de voorschriften, bedoeld in het tweede lid, is verboden.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel46
  - number: '47.1'
    text: |-
      De spoorwegonderneming of de houder van een spoorvoertuig draagt er zorg voor dat de door hen gebruikte
      spoorvoertuigen, de uitrusting en de als zodanig aangewezen onderdelen daarvan tijdens het gebruik in het verkeer
      over de hoofdspoorwegen bij voortduring blijven voldoen aan:
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel47
  - number: 47.1.a
    text: |-
      de toepasselijke technische specificaties inzake interoperabiliteit, bedoeld in artikel 2, onderdeel g, van
      [richtlijn 2000/16/EG](32000L0016), respectievelijk artikel 2, onderdeel g, van [richtlijn 96/48/EG](31996L0048);
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel47
  - number: 47.1.b
    text: |-
      de eisen, bedoeld in de [artikelen 37, tweede lid][ref1], [38, eerste lid, onderdeel a, of tweede lid][ref2],
      [40, tweede lid][ref3], of [41, tweede lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0015007#Artikel40
      [ref4]: https://wetten.overheid.nl/BWBR0015007#Artikel41
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '37'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0015007
        artikel: '38'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0015007
        artikel: '40'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0015007
        artikel: '41'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '47.2'
    text: |-
      Voor de toepassing van dit artikel wordt onder houder van een spoorvoertuig verstaan degene die als eigenaar of
      anderszins beschikkingsbevoegde dit voertuig duurzaam als transportmiddel exploiteert.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel47
  - number: '48.1'
    text: |-
      Het is verboden onderhoud en herstel van spoorvoertuigen die van hoofdspoorwegen gebruik maken te laten uitvoeren
      door anderen dan daartoe door Onze Minister erkende natuurlijke personen of rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel48
  - number: '48.2'
    text: 'Een erkenning wordt op aanvraag verleend indien:'
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel48
  - number: 48.2.a
    text: |-
      de natuurlijke persoon of de bestuurders van de rechtspersoon beschikken over een
      met het oog op de erkenning verleende verklaring omtrent het gedrag als bedoeld in
      [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref1] dan wel voldoen aan gelijkwaardige eisen
      van betrouwbaarheid;


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel28
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '28'
  - number: 48.2.b
    text: |-
      de natuurlijke persoon of de bestuurders van de rechtspersoon aantonen dat de onderhouds- en herstelwerkzaamheden
      met de grootste beroepsintegriteit en vakbekwaamheid worden uitgevoerd en
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel48
  - number: 48.2.c
    text: wordt voldaan aan bij algemene maatregel van bestuur gestelde eisen of nadere eisen.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel48
  - number: '48.3'
    text: 'De eisen of nadere eisen, bedoeld in het tweede lid, onderdeel c, kunnen onder meer betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel48
  - number: 48.3.a
    text: de voor het onderhoud of herstel beschikbare ruimte en de gebruikte apparatuur;
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel48
  - number: 48.3.b
    text: de deskundigheid van de met het onderhoud of herstel belaste personen en
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel48
  - number: 48.3.c
    text: het proces dat bij het onderhoud of herstel wordt toegepast.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel48
  - number: '48.4'
    text: |-
      Onze Minister kan de erkenning, bedoeld in het tweede lid, onder beperkingen verlenen en daaraan voorschriften
      verbinden met betrekking tot de uit te voeren werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel48
  - number: '48.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over het onderhoud alsmede over de
      aanvraag en het verlenen van een erkenning.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel48
  - number: '48.6'
    text: 'Onze Minister trekt een erkenning in:'
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel48
  - number: 48.6.a
    text: op verzoek van degene aan wie deze is verleend;
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel48
  - number: 48.6.b
    text: indien degene, aan wie deze is verleend, niet langer voldoet aan de eisen, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel48
  - number: '49.1'
    text: |-
      Personen die binnen het hoofdspoorwegverkeerssysteem een veiligheidsfunctie uitoefenen dienen, behoudens bij
      algemene maatregel van bestuur vastgestelde uitzonderingen, te voldoen aan de bij of krachtens algemene maatregel
      van bestuur voor de uitoefening van die functie gestelde eisen inzake:
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel49
  - number: 49.1.a
    text: minimumleeftijd;
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel49
  - number: 49.1.b
    text: medische en psychologische geschiktheid;
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel49
  - number: 49.1.c
    text: algemene kennis, bekwaamheid en ervaring;
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel49
  - number: 49.1.d
    text: beheersing van de Nederlandse taal.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel49
  - number: '49.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de wijze waarop dient te worden
      aangetoond dat aan de in het eerste lid bedoelde eisen wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel49
  - number: '50.1'
    text: |-
      Personen die binnen het hoofdspoorwegverkeerssysteem een veiligheidsfunctie uitoefenen, beschikken, behoudens bij
      algemene maatregel van bestuur vastgestelde uitzonderingen, over:
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel50
  - number: 50.1.a
    text: |-
      een certificaat van bekwaamheid, afgegeven door een door Onze Minister aangewezen exameninstituut, waaruit blijkt
      dat zij voldoen aan de in [artikel 49, eerste lid, onderdeel c][ref1], bedoelde eisen;


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel49
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '49'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: 50.1.b
    text: |-
      een geldige verklaring van medische geschiktheid en een geldige verklaring van psychologische geschiktheid,
      afgegeven door een door Onze Minister aangewezen keuringsinstituut, waaruit blijkt dat zij voldoen aan de in
      [artikel 49, eerste lid, onderdeel b][ref1], bedoelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel49
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '49'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: '50.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over de afgifte, de inhoud en
      de geldigheid van de in het eerste lid bedoelde documenten alsmede over de aanwijzing van exameninstituten en
      keuringsinstituten.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel50
  - number: '51.1'
    text: |-
      Degene onder wiens gezag binnen het hoofdspoorwegverkeerssysteem een veiligheidsfunctie wordt uitgeoefend
      verschaft, behoudens bij algemene maatregel van bestuur omschreven uitzonderingen, aan degene die de betrokken
      functie uitoefent, die beschikt over de in [artikel 50, eerste lid][ref1], bedoelde documenten en die naar zijn
      oordeel beschikt over de voor de uitoefening van die functie vereiste specifieke, taakgebonden en bedrijfsgebonden
      kennis en bekwaamheid, een bedrijfspas.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel50
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '50'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: '51.2'
    text: De bedrijfspas voldoet aan de bij of krachtens algemene maatregel van bestuur gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel51
  - number: '51.3'
    text: |-
      De houder van de bedrijfspas is verplicht die pas op eerste vordering te tonen aan de krachtens de
      [artikelen 69][ref1] en [86][ref2] met het toezicht op de naleving onderscheidenlijk de opsporing van strafbare
      feiten belaste personen.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel86
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '69'
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0015007
        artikel: '86'
        hoofdstuk: '6'
        paragraaf: '4'
  - number: '51.4'
    text: 'Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel51
  - number: 51.4.a
    text: |-
      de voor de uitoefening van veiligheidsfuncties vereiste specifieke, taakgebonden en bedrijfsgebonden kennis en
      bekwaamheid;
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel51
  - number: 51.4.b
    text: de geldigheidsduur van bedrijfspassen.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel51
  - number: '52'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen, met het oog op de veiligheid, regels worden gesteld over de
      bedrijfsvoering en de organisatiestructuur van degene onder wiens gezag binnen het hoofdspoorwegverkeerssysteem een
      veiligheidsfunctie wordt uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel52
  - number: '53'
    text: 'Het is verboden een veiligheidsfunctie binnen het hoofdspoorwegverkeerssysteem te doen uitoefenen door een persoon:'
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel53
  - number: 53.a
    text: |-
      die niet beschikt over de in [artikel 50, eerste lid][ref1], bedoelde documenten;


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel50
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '50'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: 53.b
    text: |-
      waarvan men weet of redelijkerwijs moet weten dat hij niet voldoet aan de voor de uitoefening van de functie
      gestelde eisen als bedoeld in [artikel 49][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel49
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '49'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: '54'
    text: |-
      Degene onder wiens gezag een persoon die binnen het hoofdspoorwegverkeerssysteem een functie, niet zijnde een
      veiligheidsfunctie, uitoefent die van invloed kan zijn op de veiligheid van het verkeer over hoofdspoorwegen,
      draagt er zorg voor dat die persoon daartoe geschikt is en de nodige kennis en bekwaamheid bezit.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel54
  - number: '55.1'
    text: |-
      De spoorwegonderneming die van de hoofdspoorweg gebruik maakt, is verplicht ter zake van dat gebruik een
      verzekering te sluiten en in stand te houden, waarmee haar uit wettelijke aansprakelijkheid voortvloeiende
      financiële risico's voldoende zijn gedekt.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel55
  - number: '55.2'
    text: |-
      Bij algemene maatregel van bestuur worden bedragen vastgesteld waarboven de verzekeringsplicht zich niet uitstrekt.
      Afzonderlijke bedragen kunnen worden bepaald naar gelang van onder meer de aard van de gebeurtenis, de aard van de
      schade, de grond van de aansprakelijkheid en de aard van de onderneming.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel55
  - number: '55.3'
    text: |-
      [Artikel 6 van de Wet aansprakelijkheidsverzekering motorrijtuigen][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel6
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: '6'
  - number: '56'
    text: 'In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel56
  - number: 56.a
    text: |-
      gerechtigde: gerechtigde als bedoeld in [artikel 57][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel57
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '57'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 56.b
    text: |-
      toegangsovereenkomst: toegangsovereenkomst als bedoeld in [artikel 59][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel59
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '59'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 56.c
    text: 'kaderovereenkomst: kaderovereenkomst als bedoeld in artikel 17 van [richtlijn 2001/14/EG](32001L0014);'
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel56
  - number: 56.d
    text: 'gebruik van een hoofdspoorweg: het met een spoorvoertuig rijden over of stilstaan op een hoofdspoorweg;'
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel56
  - number: 56.e
    text: 'capaciteit: capaciteit van de hoofdspoorweginfrastructuur;'
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel56
  - number: 56.f
    text: 'netverklaring: netverklaring als bedoeld in [richtlijn 2001/14/EG](32001L0014);'
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel56
  - number: 56.g
    text: |-
      gebruiksvergoeding: vergoeding als bedoeld in artikel 8 van [richtlijn 91/440/EEG](31991L0440) en artikel 4 van
      [richtlijn 2001/14/EG](32001L0014).
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel56
  - number: '57'
    text: 'Gerechtigd tot het sluiten van een toegangsovereenkomst en een kaderovereenkomst met de beheerder zijn:'
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel57
  - number: 57.a
    text: |-
      spoorwegondernemingen en hun internationale samenwerkingsverbanden als bedoeld in artikel 3 van [richtlijn 91/440/
      EEG](31991L0440) die in het bezit zijn van een bedrijfsvergunning of deze hebben aangevraagd, voorzover zij daarmee
      gerechtigd zijn van de hoofdspoorwegen gebruik te maken op de wijze waarvoor zij de overeenkomst willen sluiten;
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel57
  - number: 57.b
    text: |-
      concessieverleners als bedoeld in [artikel 20 van de Wet personenvervoer 2000][ref1] ten behoeve van openbaar
      vervoer per trein;


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel20
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '20'
  - number: 57.c
    text: andere bij of krachtens algemene maatregel van bestuur aan te wijzen bestuursorganen, personen of rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel57
  - number: '58.1'
    text: De beheerder stelt jaarlijks, na overleg met betrokken gerechtigden, een netverklaring op.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel58
  - number: '58.2'
    text: |-
      De netverklaring bevat de gegevens, bedoeld in artikel 3 en bijlage I van [richtlijn 2001/14/EG](32001L0014), en
      voorts ten minste:
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel58
  - number: 58.2.a
    text: informatie over voor bepaalde soorten van gebruik voorbehouden capaciteit;
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel58
  - number: 58.2.b
    text: een zakelijke weergave van de inhoud van de geldende kaderovereenkomsten;
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel58
  - number: 58.2.c
    text: een prognose omtrent de ontwikkeling van de capaciteit;
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel58
  - number: 58.2.d
    text: alle overige relevante informatie voor het gebruik van de capaciteit.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel58
  - number: '58.3'
    text: |-
      Met inachtneming van artikel 3, vierde lid, van [richtlijn 2001/14/EG](32001L0014) stelt de beheerder de
      netverklaring tegen vergoeding van ten hoogste de kostprijs algemeen verkrijgbaar en zendt haar aan de betrokken
      spoorwegondernemingen en de raad van bestuur NMa.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel58
  - number: '58.4'
    text: |-
      De beheerder brengt in de netverklaring zo nodig wijzigingen aan. Met inachtneming van artikel 8, vierde
      lid, van [richtlijn 2001/14/EG](32001L0014) en tegen vergoeding van ten hoogste de kostprijs stelt hij de
      gewijzigde netverklaring algemeen verkrijgbaar en doet hij van de wijzigingen mededeling aan de betrokken
      spoorwegondernemingen en aan de raad van bestuur NMa.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel58
  - number: '59.1'
    text: |-
      Een tussen de beheerder en een gerechtigde gesloten overeenkomst over het gebruik van capaciteit bevat in elk geval
      bedingen over:
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel59
  - number: 59.1.a
    text: de door de beheerder te bieden kwaliteit van de hoofdspoorweginfrastructuur;
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel59
  - number: 59.1.b
    text: de gebruiksvergoeding.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel59
  - number: '59.2'
    text: |-
      In de overeenkomst wordt uitgesloten dat overeengekomen capaciteit kan worden overgedragen aan of gebruikt door een
      ander dan een gerechtigde.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel59
  - number: '59.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen ten behoeve van de overeenkomst algemene voorwaarden als bedoeld in
      [artikel 231 van Boek 6 van het Burgerlijk Wetboek][ref1] worden vastgesteld. In dat geval wordt in de overeenkomst
      naar die algemene voorwaarden verwezen.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel231
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '231'
  - number: '60.1'
    text: |-
      Een tussen de beheerder en een gerechtigde gesloten kaderovereenkomst voldoet aan artikel 10, vijfde lid, van
      [richtlijn 91/440/EEG](31991L0440) en artikel 17 van [richtlijn 2001/14/EG](32001L0014).
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel60
  - number: '60.2'
    text: |-
      In een kaderovereenkomst wordt uitgesloten dat overeengekomen capaciteit kan worden overgedragen aan of gebruikt
      door een ander dan een gerechtigde.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel60
  - number: '60.3'
    text: |-
      Een kaderovereenkomst met een geldigheidsduur van meer dan vijf jaar behoeft de voorafgaande instemming van de raad
      van bestuur NMa.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel60
  - number: '60.4'
    text: |-
      Bij algemene maatregel van bestuur kunnen ten behoeve van de kaderovereenkomst algemene voorwaarden als bedoeld
      in [artikel 231 van Boek 6 van het Burgerlijk Wetboek][ref1] worden vastgesteld. In dat geval wordt in de
      kaderovereenkomst naar die algemene voorwaarden verwezen.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel231
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '231'
  - number: '61.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de verdeling van capaciteit. Die regels
      kunnen strekken ter bescherming van het milieu.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel61
  - number: '61.2'
    text: |-
      Bij de algemene maatregel van bestuur, bedoeld in het eerste lid, worden minimale niveaus van capaciteit
      vastgesteld voor daarbij aangegeven deelmarkten van het goederenvervoer en het personenvervoer en worden regels
      gesteld over de prioriteitscriteria, bedoeld in artikel 22, derde tot en met vijfde lid, van [richtlijn 2001/14/
      EG](32001L0014).
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel61
  - number: '61.3'
    text: |-
      Bij of krachtens de algemene maatregel van bestuur, bedoeld in het eerste lid, wordt bepaald in welke gevallen
      capaciteit tot een bepaald tijdstip is voorbehouden voor bepaalde soorten gebruik van de hoofdspoorwegen en vanaf
      welk tijdstip deze capaciteit beschikbaar is voor ander gebruik.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel61
  - number: '61.4'
    text: |-
      De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel61
  - number: '62.1'
    text: |-
      Behoudens het tweede, derde en vijfde lid bedragen de begrote opbrengsten van de gebruiksvergoeding niet meer dan
      de begrote kosten ter zake van de desbetreffende hoofdspoorweginfrastructuur in dat jaar voor de beheerder.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel62
  - number: '62.2'
    text: |-
      Met betrekking tot bij algemene maatregel van bestuur aangewezen hoofdspoorweginfrastructuur kan een
      gebruiksvergoeding worden overeengekomen die mede strekt ter dekking van door een ander dan de beheerder gedane
      uitgaven voor de aanleg van die infrastructuur.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel62
  - number: '62.3'
    text: |-
      Er kan een verhoging worden overeengekomen voor het gebruik van overbelaste hoofdspoorweginfrastructuur gedurende
      periodes van overbelasting en voor de kosten van milieueffecten van het gebruik van hoofdspoorweginfrastructuur die
      niet in de begrote kosten van de beheerder zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel62
  - number: '62.4'
    text: Er kan een korting als bedoeld in artikel 9 van [richtlijn 2001/14/EG](32001L0014) worden overeengekomen.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel62
  - number: '62.5'
    text: |-
      Er kan een aftrek dan wel bijtelling worden overeengekomen in verband met optredende verstoringen en met het oog op
      verbetering van de prestaties van het spoorwegnet.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel62
  - number: '62.6'
    text: |-
      Er kan worden overeengekomen dat de gebruiksvergoeding ook verschuldigd is voor overeengekomen capaciteit die niet
      wordt gebruikt.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel62
  - number: '62.7'
    text: |-
      De overeengekomen gebruiksvergoeding voldoet aan de artikelen 4, vierde en vijfde lid, 7 tot en met 12 en 26, derde
      lid, van [richtlijn 2001/14/EG](32001L0014).
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel62
  - number: '62.8'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de maatstaven en nadere regels
      over de hoogte van de gebruiksvergoeding.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel62
  - number: '62.9'
    text: |-
      De voordracht voor een krachtens het achtste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel62
  - number: '63.1'
    text: |-
      Onderhandelingen tussen een gerechtigde en de beheerder betreffende de hoogte van de gebruiksvergoeding zijn niet
      toegestaan dan na een melding aan en onder toezicht van de raad van bestuur NMa.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel63
  - number: '63.2'
    text: |-
      De raad van bestuur NMa legt, indien de onderhandelingen naar zijn oordeel in strijd zijn met [richtlijn 2001/14/
      EG](32001L0014), aan de overtreder zo nodig een last onder dwangsom op. Aan de last kunnen voorschriften worden
      verbonden inzake het verstrekken van gegevens aan de raad van bestuur NMa. De [artikelen 3, tweede lid][ref1],
      [56, vierde lid][ref2], [62, derde lid][ref3], en [65 van de Mededingingswet][ref4] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel56
      [ref3]: https://wetten.overheid.nl/BWBR0008691#Artikel62
      [ref4]: https://wetten.overheid.nl/BWBR0008691#Artikel65
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0008691
        artikel: '56'
      - id: ref3
        bwb_id: BWBR0008691
        artikel: '62'
      - id: ref4
        bwb_id: BWBR0008691
        artikel: '65'
  - number: '64.1'
    text: |-
      De beheerder bevordert dat werkzaamheden aan en nabij de hoofdspoorweg veilig plaatsvinden. Werkzaamheden aan of
      nabij de hoofdspoorweg, waardoor veilig en ongestoord rijden of stilstaan met spoorvoertuigen niet mogelijk is,
      worden slechts uitgevoerd, indien het betrokken gedeelte van de hoofdspoorweg door de beheerder buiten dienst is
      gesteld.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel64
  - number: '64.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over het verrichten van werkzaamheden
      aan of nabij de hoofdspoorweg.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel64
  - number: '65.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden met het oog op een veilig en ongestoord gebruik van
      hoofdspoorwegen regels gesteld. Deze regels kunnen onder meer betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel65
  - number: 65.1.a
    text: aard, uitvoering, plaatsing, bediening en betekenis van seinen;
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel65
  - number: 65.1.b
    text: bewegingen met spoorvoertuigen;
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel65
  - number: 65.1.c
    text: het rijden met spoorvoertuigen op de openbare weg;
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel65
  - number: 65.1.d
    text: het gebruik van overwegen en overpaden;
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel65
  - number: 65.1.e
    text: |-
      verplichtingen – in verband met storingen, ongevallen, incidenten en andere onregelmatigheden – van
      spoorwegondernemingen, bestuurders van een spoorvoertuig en andere personen die deelnemen aan het verkeer over
      de hoofdspoorweg.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel65
  - number: '65.2'
    text: Een ieder die zich op de hoofdspoorweg bevindt, neemt de voor hem bestemde seinen in acht.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel65
  - number: '66.1'
    text: |-
      Onze Minister kan onderzoek verrichten naar de oorzaken van ongevallen en incidenten op hoofdspoorwegen en naar
      andere onregelmatigheden in de afwikkeling van het spoorverkeer waardoor de veiligheid van het spoorverkeer of van
      daarbij betrokken personen in gevaar is gebracht of in gevaar gebracht had kunnen worden, indien hij dit onderzoek
      nodig acht ter evaluatie van de wettelijke voorschriften en het beleid op het terrein van de veiligheid van het
      spoorverkeer.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel66
  - number: '66.2'
    text: |-
      Ten behoeve van het onderzoek hebben de door Onze Minister aangewezen ambtenaren jegens
      spoorwegondernemingen en de beheerder de bevoegdheden, bedoeld in de [artikelen 5:15][ref1] tot
      en met [5:19 van de Algemene wet bestuursrecht][ref2]. De [artikelen 5:12][ref3], [5:13][ref4] en
      [5:20 van de Algemene wet bestuursrecht][ref5] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '66.3'
    text: |-
      Onze Minister onthoudt zich van het onderzoek naar de oorzaken van ongevallen en incidenten op hoofdspoorwegen
      voorzover de Onderzoeksraad voor veiligheid naar het betreffende voorval een onderzoek instelt.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel66
  - number: '67.1'
    text: |-
      Een rechthebbende ten aanzien van een dienst als bedoeld in artikel 10, zesde lid, van [richtlijn 91/440/EEG]
      (31991L0440) ten behoeve van spoorwegactiviteiten als bedoeld in dat lid, ten aanzien van een voorziening of
      dienst als bedoeld in onderdeel 2 van bijlage II bij [richtlijn 2001/14/EG](32001L0014) of ten aanzien van een bij
      algemene maatregel van bestuur aangewezen, voor het verrichten van vervoer via spoorwegen noodzakelijke voorziening
      of dienst doet een spoorwegonderneming die daarom verzoekt een redelijk aanbod voor het ter beschikking stellen van
      die dienst of voorziening tegen kostengeoriënteerde tarieven en onder voorwaarden die de mededinging niet beperken.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel67
  - number: '67.2'
    text: |-
      De rechthebbende onthoudt zich van iedere vorm van discriminatie tussen degenen jegens wie de in het eerste lid
      bedoelde verplichting geldt.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel67
  - number: '67.3'
    text: |-
      Op de grondslag van hetgeen ingevolge het eerste lid is overeengekomen, stelt de rechthebbende de dienst of
      voorziening ter beschikking. De rechthebbende mag slechts weigeren om de voorziening ter beschikking te stellen,
      indien de spoorwegonderneming onder marktvoorwaarden op een voor haar haalbare andere wijze kan voorzien in de
      behoefte die ten grondslag ligt aan haar verzoek.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel67
  - number: '67.4'
    text: |-
      Indien de beheerder rechthebbende is ten aanzien van een dienst als bedoeld in onderdeel 3 van bijlage II bij
      [richtlijn 2001/14/EG](32001L0014), zijn het eerste tot en met derde lid van overeenkomstige toepassing op een
      zodanige dienst.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel67
  - number: '67.5'
    text: |-
      Indien er in Nederland slechts één rechthebbende is ten aanzien van een dienst als bedoeld in onderdeel 3 of 4 van
      bijlage II bij [richtlijn 2001/14/EG](32001L0014), zijn, onverminderd het vierde lid, het eerste en tweede lid en
      het derde lid, eerste volzin, van overeenkomstige toepassing op een zodanige dienst.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel67
  - number: '68'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld over de kostenoriëntatie, bedoeld in
      [artikel 67, eerste lid][ref1], en nadere regels ter waarborging van de toegang, op een niet-discriminerende
      grondslag, tot diensten en voorzieningen als bedoeld in dat artikel. Die nadere regels kunnen in elk geval inhouden
      dat de rechthebbende:


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel67
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '67'
        hoofdstuk: '5'
  - number: 68.a
    text: 'jaarlijks bekendmaakt:'
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel68
  - number: 68.a.1°
    text: |-
      een indicatie van de tarieven en voorwaarden die hij voornemens is te hanteren voor het ter beschikking stellen van
      de dienst of voorziening aan spoorwegondernemingen;
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel68
  - number: 68.a.2°
    text: een overzicht van de verwachte beschikbaarheid in het volgende kalenderjaar van de dienst of voorziening;
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel68
  - number: 68.b
    text: voor de dienst of voorziening een afzonderlijke boekhouding voert en deze ter inzage legt.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel68
  - number: '69.1'
    text: |-
      Behoudens [artikel 70, tweede lid, aanhef en onder a][ref1], zijn met het toezicht op de naleving van het bepaalde
      bij of krachtens deze wet belast de bij besluit van Onze Minister daartoe aangewezen personen.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel70
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '70'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: '69.2'
    text: |-
      Een besluit als bedoeld in het eerste lid bevat een aanduiding van de voorschriften op naleving waarvan toezicht
      wordt gehouden.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel69
  - number: '69.3'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel69
  - number: '70.1'
    text: |-
      De raad van bestuur NMa is de toezichthoudende instantie, bedoeld in artikel 10, zevende lid, van [richtlijn
      91/440/EEG](31991L0440) en de artikelen 30 en 31 van [richtlijn 2001/14/EG](32001L0014).
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel70
  - number: '70.2'
    text: 'De bij besluit van de raad van bestuur NMa aangewezen ambtenaren van deze autoriteit zijn belast met:'
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel70
  - number: 70.2.a
    text: |-
      voor de toepassing van het eerste lid: het toezicht op de naleving van het bepaalde krachtens
      [artikel 17, eerste lid, onderdeel d][ref1], en het bepaalde bij of krachtens de [artikelen 27, eerste lid][ref2],
      [57 tot en met 63][ref3], [67][ref4], [68][ref5] en [95, eerste volzin][ref6];


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0015007#Artikel57
      [ref4]: https://wetten.overheid.nl/BWBR0015007#Artikel67
      [ref5]: https://wetten.overheid.nl/BWBR0015007#Artikel68
      [ref6]: https://wetten.overheid.nl/BWBR0015007#Artikel95
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0015007
        artikel: '27'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0015007
        artikel: '57'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0015007
        artikel: '67'
        hoofdstuk: '5'
      - id: ref5
        bwb_id: BWBR0015007
        artikel: '68'
        hoofdstuk: '5'
      - id: ref6
        bwb_id: BWBR0015007
        artikel: '95'
        hoofdstuk: '6'
        paragraaf: '9'
  - number: 70.2.b
    text: |-
      voor de toepassing van het eerste lid en [artikel 71][ref1]: het onderzoek, bedoeld in
      [artikel 1 van de Mededingingswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel71
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel1
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '71'
        hoofdstuk: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008691
        artikel: '1'
  - number: '70.3'
    text: Van een besluit als bedoeld in het tweede lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel70
  - number: '70.4'
    text: |-
      Op het tweede lid, onderdeel a, is [artikel 51 van de Mededingingswet][ref1] van toepassing. Op het tweede lid,
      onderdeel b, zijn de [artikelen 52, tweede lid][ref2], en [53 tot en met 55 van de Mededingingswet][ref3] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel52
      [ref3]: https://wetten.overheid.nl/BWBR0008691#Artikel53
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '51'
      - id: ref2
        bwb_id: BWBR0008691
        artikel: '52'
      - id: ref3
        bwb_id: BWBR0008691
        artikel: '53'
  - number: '71.1'
    text: |-
      Een gerechtigde als bedoeld in [artikel 57][ref1] of een andere belanghebbende kan de raad van bestuur NMa
      schriftelijk verzoeken om te onderzoeken of de beheerder, een spoorwegonderneming of een rechthebbende als bedoeld
      in [artikel 67][ref2] of [95][ref3] de verzoeker oneerlijk heeft behandeld, heeft gediscrimineerd of anderszins
      heeft benadeeld als bedoeld in artikel 10, zevende lid, van [richtlijn 91/440/EEG](31991L0440) of artikel 30,
      tweede lid, van [richtlijn 2001/14/EG](32001L0014).


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel67
      [ref3]: https://wetten.overheid.nl/BWBR0015007#Artikel95
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '57'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0015007
        artikel: '67'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0015007
        artikel: '95'
        hoofdstuk: '6'
        paragraaf: '9'
  - number: '71.2'
    text: |-
      Een partij bij een toegangsovereenkomst of een kaderovereenkomst als bedoeld in [hoofdstuk 4][ref1] kan de raad van
      bestuur NMa schriftelijk verzoeken om een oordeel over het gedrag van de wederpartij.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0015007
        hoofdstuk: '4'
  - number: '71.3'
    text: |-
      De raad van bestuur NMa geeft zijn oordeel over de klacht uiterlijk twee maanden na ontvangst van de gegevens en
      bescheiden die voor zijn oordeel nodig zijn.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel71
  - number: '71.4'
    text: |-
      Indien de raad van bestuur NMa van oordeel is dat de klacht gegrond is, legt hij zo nodig een last onder dwangsom
      op.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel71
  - number: '71.5'
    text: |-
      Aan een last als bedoeld in het vierde lid kunnen voorschriften worden verbonden inzake het verstrekken
      van gegevens aan de raad van bestuur NMa. De [artikelen 3, tweede lid][ref1], [56, vierde lid][ref2],
      [62, derde lid][ref3], en [65 van de Mededingingswet][ref4] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel56
      [ref3]: https://wetten.overheid.nl/BWBR0008691#Artikel62
      [ref4]: https://wetten.overheid.nl/BWBR0008691#Artikel65
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0008691
        artikel: '56'
      - id: ref3
        bwb_id: BWBR0008691
        artikel: '62'
      - id: ref4
        bwb_id: BWBR0008691
        artikel: '65'
  - number: '71.6'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot ten behoeve van het onderzoek
      te verstrekken gegevens en bescheiden, alsmede met betrekking tot de termijnen voor het verstrekken van de gegevens
      en bescheiden.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel71
  - number: '72.1'
    text: |-
      De raad van bestuur NMa en de krachtens [artikel 70, tweede lid][ref1], aangewezen ambtenaren gebruiken de gegevens
      of inlichtingen die zij hebben verkregen bij de uitoefening van hun in dat artikel bedoelde taken, uitsluitend
      voor de uitoefening van die taken of van de bij of krachtens de [Mededingingswet][ref2] aan hen opgedragen taken of
      toegekende bevoegdheden.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel70
      [ref2]: https://wetten.overheid.nl/BWBR0008691
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '70'
        hoofdstuk: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008691
  - number: '72.2'
    text: |-
      De raad van bestuur NMa kan desgevraagd aan Onze Minister de voor de uitoefening van diens taak benodigde gegevens
      of inlichtingen verstrekken.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel72
  - number: '72.3'
    text: |-
      Onze Minister kan desgevraagd aan de raad van bestuur NMa de voor de uitoefening van diens taak benodigde gegevens
      of inlichtingen verstrekken.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel72
  - number: '73'
    text: |-
      De raad van bestuur NMa stelt jaarlijks voor 1 juli een verslag op van zijn werkzaamheden ingevolge deze wet in het
      voorafgaande kalenderjaar. Het verslag wordt toegezonden aan Onze Minister en Onze Minister van Economische Zaken
      en algemeen verkrijgbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel73
  - number: '74.1'
    text: |-
      Onze Minister kan beleidsregels vaststellen met betrekking tot de uitoefening van in deze wet aan de raad van
      bestuur NMa toegekende bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel74
  - number: '74.2'
    text: De bekendmaking van de beleidsregels geschiedt door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel74
  - number: '74.3'
    text: |-
      Indien beleidsregels als bedoeld in het eerste lid betrekking hebben op de interpretatie van mededingingsbegrippen,
      stelt Onze Minister die beleidsregels vast in overeenstemming met Onze Minister van Economische Zaken.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel74
  - number: '75'
    text: |-
      De raad van bestuur NMa kan aan degene die jegens een krachtens [artikel 70, tweede lid][ref1], aangewezen
      ambtenaar in strijd handelt met [artikel 5:20 van de Algemene wet bestuursrecht][ref2], een bestuurlijke boete
      opleggen van ten hoogste € 450 000 of, indien het een onderneming of ondernemingsvereniging als bedoeld in
      [artikel 1 van de Mededingingswet][ref3] betreft en indien dat meer is, van ten hoogste 1% van de omzet van de
      onderneming, onderscheidenlijk van de gezamenlijke omzet van de ondernemingen die van de vereniging deel uitmaken,
      in het boekjaar voorafgaande aan de beschikking. De [artikelen 69, tweede en derde lid][ref4], [70][ref5],
      [77 tot en met 79][ref6], [81][ref7] en [82 van de Mededingingswet][ref8] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel70
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0008691#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0008691#Artikel69
      [ref5]: https://wetten.overheid.nl/BWBR0008691#Artikel70
      [ref6]: https://wetten.overheid.nl/BWBR0008691#Artikel77
      [ref7]: https://wetten.overheid.nl/BWBR0008691#Artikel81
      [ref8]: https://wetten.overheid.nl/BWBR0008691#Artikel82
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '70'
        hoofdstuk: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0008691
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0008691
        artikel: '69'
      - id: ref5
        bwb_id: BWBR0008691
        artikel: '70'
      - id: ref6
        bwb_id: BWBR0008691
        artikel: '77'
      - id: ref7
        bwb_id: BWBR0008691
        artikel: '81'
      - id: ref8
        bwb_id: BWBR0008691
        artikel: '82'
  - number: '76.1'
    text: |-
      Onze Minister is bevoegd tot toepassing van bestuursdwang ter handhaving van de bij of krachtens deze wet gestelde
      verplichtingen met uitzondering van de verplichtingen als bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel76
  - number: '76.2'
    text: |-
      In geval van overtreding van het bepaalde krachtens [artikel 17, eerste lid, onderdeel d][ref1], of het bepaalde
      bij of krachtens de [artikelen 27, eerste lid][ref2], [57 tot en met 62][ref3], [63, eerste lid][ref4], [67][ref5],
      [68][ref6] en [95, eerste volzin][ref7], kan de raad van bestuur NMa de natuurlijke persoon of rechtspersoon aan
      wie de overtreding kan worden toegerekend:


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0015007#Artikel57
      [ref4]: https://wetten.overheid.nl/BWBR0015007#Artikel63
      [ref5]: https://wetten.overheid.nl/BWBR0015007#Artikel67
      [ref6]: https://wetten.overheid.nl/BWBR0015007#Artikel68
      [ref7]: https://wetten.overheid.nl/BWBR0015007#Artikel95
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0015007
        artikel: '27'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0015007
        artikel: '57'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0015007
        artikel: '63'
        hoofdstuk: '4'
        paragraaf: '6'
      - id: ref5
        bwb_id: BWBR0015007
        artikel: '67'
        hoofdstuk: '5'
      - id: ref6
        bwb_id: BWBR0015007
        artikel: '68'
        hoofdstuk: '5'
      - id: ref7
        bwb_id: BWBR0015007
        artikel: '95'
        hoofdstuk: '6'
        paragraaf: '9'
  - number: 76.2.a
    text: een bestuurlijke boete opleggen;
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel76
  - number: 76.2.b
    text: een last onder dwangsom opleggen.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel76
  - number: '76.3'
    text: |-
      Op het tweede lid zijn de [artikelen 54a][ref1], [56, tweede tot en met vierde lid][ref2], [57][ref3], [58][ref4],
      [62][ref5] en [64 tot en met 68 van de Mededingingswet][ref6] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel54a
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel56
      [ref3]: https://wetten.overheid.nl/BWBR0008691#Artikel57
      [ref4]: https://wetten.overheid.nl/BWBR0008691#Artikel58
      [ref5]: https://wetten.overheid.nl/BWBR0008691#Artikel62
      [ref6]: https://wetten.overheid.nl/BWBR0008691#Artikel64
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: 54a
      - id: ref2
        bwb_id: BWBR0008691
        artikel: '56'
      - id: ref3
        bwb_id: BWBR0008691
        artikel: '57'
      - id: ref4
        bwb_id: BWBR0008691
        artikel: '58'
      - id: ref5
        bwb_id: BWBR0008691
        artikel: '62'
      - id: ref6
        bwb_id: BWBR0008691
        artikel: '64'
  - number: '77.1'
    text: |-
      Onze Minister kan een bestuurlijke boete opleggen ter zake van overtreding van de
      [artikelen 33, zevende lid][ref1], [36, eerste lid][ref2], [53][ref3], en [96, tweede lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0015007#Artikel53
      [ref4]: https://wetten.overheid.nl/BWBR0015007#Artikel96
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0015007
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0015007
        artikel: '53'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref4
        bwb_id: BWBR0015007
        artikel: '96'
        hoofdstuk: '6'
        paragraaf: '10'
  - number: '77.2'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de uitoefening van de bevoegdheid, bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel77
  - number: '78.1'
    text: Onze Minister legt geen bestuurlijke boete op voorzover de overtreding niet aan de overtreder kan worden verweten.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel78
  - number: '78.2'
    text: |-
      Onze Minister legt geen bestuurlijke boete op, indien de overtreder is overleden. Bij overlijden van de overtreder
      vervalt een opgelegde bestuurlijke boete voorzover de geldsom nog niet is betaald.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel78
  - number: '78.3'
    text: |-
      Onze Minister legt geen bestuurlijke boete op, indien aan de overtreder wegens dezelfde gedraging reeds eerder een
      bestuurlijke boete is opgelegd.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel78
  - number: '78.4'
    text: 'Onze Minister legt geen bestuurlijke boete op, indien tegen de overtreder wegens dezelfde gedraging:'
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel78
  - number: 78.4.a
    text: een strafvervolging is ingesteld en het onderzoek ter terechtzitting is begonnen of
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel78
  - number: 78.4.b
    text: |-
      het recht tot strafvordering is vervallen ingevolge de artikelen [74][ref1]
      of [74c van het Wetboek van Strafrecht][ref2] of ingevolge [artikel 37 van de Wet op de economische delicten][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel74
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel74c
      [ref3]: https://wetten.overheid.nl/BWBR0002063#Artikel37
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '74'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 74c
      - id: ref3
        bwb_id: BWBR0002063
        artikel: '37'
  - number: '78.5'
    text: |-
      Indien de gedraging tevens een strafbaar feit is en de ernst van de overtreding of de omstandigheden waaronder zij
      is begaan daartoe aanleiding geeft, wordt zij aan het openbaar ministerie voorgelegd.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel78
  - number: '78.6'
    text: |-
      Voor een gedraging die aan het openbaar ministerie is voorgelegd, legt Onze Minister slechts een bestuurlijke boete
      op, indien:
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel78
  - number: 78.6.a
    text: het openbaar ministerie heeft medegedeeld van strafvervolging tegen de overtreder af te zien of
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel78
  - number: 78.6.b
    text: |-
      sedert het voorleggen van de gedraging dertien weken zijn verstreken en geen reactie van het openbaar ministerie
      is ontvangen.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel78
  - number: '79.1'
    text: |-
      De bevoegdheid tot het opleggen van een bestuurlijke boete vervalt vijf jaar nadat de overtreding heeft
      plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel79
  - number: '79.2'
    text: |-
      Indien tegen de bestuurlijke boete bezwaar wordt gemaakt of beroep wordt ingesteld, wordt de vervaltermijn
      opgeschort tot onherroepelijk op het bezwaar of beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel79
  - number: '80.1'
    text: 'Voor de overtredingen gelden de volgende vaste bedragen van de bestuurlijke boete:'
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel80
  - number: 80.1.a
    text: |-
      voor overtreding van de [artikelen 36, eerste lid][ref1], en [53][ref2]: € 10 000;


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel53
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0015007
        artikel: '53'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: 80.1.b
    text: |-
      voor overtreding van [artikel 96, eerste lid][ref1]: € 50 000.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel96
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '96'
        hoofdstuk: '6'
        paragraaf: '10'
  - number: '80.2'
    text: |-
      Indien de boete wordt opgelegd voor het overtreden van een bepaling vermeld in het eerste lid is bij de
      vaststelling van de hoogte van deze boete de onderstaande categorie-indeling naar omzet van toepassing met de
      daarbij behorende factor. De omzet is de omzet in het kalenderjaar voorafgaand aan de datum van overtreding. De
      boete wordt vastgesteld door het in het eerste lid vermelde bedrag te vermenigvuldigen met de factor behorende bij
      de onderstaande omzet-categorie: - Categorie I: ondernemingen met een omzet van minder dan € 100 000: factor 0,25.
        - Categorie II: ondernemingen met een omzet van ten minste € 100 000 maar minder dan € 200 000: factor 0,5.
        - Categorie III: ondernemingen met een omzet van ten minste € 200 000 maar minder dan € 500 000: factor 1.
        - Categorie IV: ondernemingen met een omzet van ten minste € 500 000 maar minder dan € 1 000 000: factor 2.
        - Categorie V: ondernemingen met een omzet van meer dan € 1 000 000: factor 3.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel80
  - number: '80.3'
    text: |-
      Indien de gegevens omtrent de omzet niet aan Onze Minister beschikbaar zijn gesteld, kan Onze Minister aan degene
      aan wie de boete wordt opgelegd verzoeken deze gegevens binnen een door hem te stellen termijn te verstrekken.
      Indien de betrokkene niet binnen de gestelde termijn voldoet aan dit verzoek, is bij de vaststelling van de hoogte
      van de in het tweede lid bedoelde boete categorie V van toepassing.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel80
  - number: '80.4'
    text: |-
      De in het eerste en tweede lid vermelde bedragen en factoren kunnen bij algemene maatregel van bestuur worden
      gewijzigd.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel80
  - number: '80.5'
    text: |-
      Onze Minister legt een lagere bestuurlijke boete op, indien de overtreder aannemelijk maakt dat de vastgestelde
      bestuurlijke boete wegens bijzondere omstandigheden te hoog is.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel80
  - number: '80.6'
    text: |-
      Indien de bestuurlijke boete voor een overtreding ingevolge het vierde lid wordt verlaagd, past Onze Minister de
      verlaging voortaan ook toe op bestuurlijke boeten wegens overtredingen die voor de verlaging hebben plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel80
  - number: '81.1'
    text: |-
      De door Onze Minister daartoe aangewezen ambtenaar of de voor de overtreding bevoegde toezichthouder maakt van de
      overtreding een rapport op.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel81
  - number: '81.2'
    text: 'Het rapport is gedagtekend en vermeldt:'
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel81
  - number: 81.2.a
    text: de naam van de overtreder;
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel81
  - number: 81.2.b
    text: de overtreding alsmede het overtreden voorschrift;
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel81
  - number: 81.2.c
    text: zo nodig een aanduiding van de plaats waar en het tijdstip waarop de overtreding is geconstateerd.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel81
  - number: '81.3'
    text: |-
      Een afschrift van het rapport wordt uiterlijk bij de bekendmaking van de beschikking tot oplegging van de
      bestuurlijke boete aan de overtreder toegezonden of uitgereikt.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel81
  - number: '81.4'
    text: |-
      Indien van de overtreding een proces-verbaal, als bedoeld in [artikel 152 van het Wetboek van Strafvordering][ref1],
      is opgemaakt, treedt dit voor de toepassing van deze paragraaf in de plaats van het rapport.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel152
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '152'
  - number: '81.5'
    text: |-
      Op verzoek van de belanghebbende die het rapport wegens zijn gebrekkige kennis van de Nederlandse taal onvoldoende
      begrijpt, draagt Onze Minister er zoveel mogelijk zorg voor dat de inhoud van het rapport aan de betrokkene wordt
      meegedeeld in een voor hem begrijpelijke taal.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel81
  - number: '82.1'
    text: |-
      Onze Minister stelt de overtreder desgevraagd in de gelegenheid de gegevens waarop het opleggen van de bestuurlijke
      boete, dan wel het voornemen daartoe, berust, in te zien en daarvan afschriften te vervaardigen.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel82
  - number: '82.2'
    text: |-
      In afwijking van [afdeling 4.1.2 van de Algemene wet bestuursrecht][ref1] stelt Onze Minister de overtreder in
      de gelegenheid om binnen een redelijke termijn naar keuze schriftelijk of mondeling zijn zienswijze naar voren
      te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.2
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.1.2
  - number: '82.3'
    text: |-
      Indien de overtreder zijn zienswijze mondeling naar voren brengt, zorgt Onze Minister op verzoek van de overtreder
      die de Nederlandse taal onvoldoende beheerst, voor bijstand door een tolk, tenzij redelijkerwijs kan worden
      aangenomen dat daaraan geen behoefte bestaat.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel82
  - number: '82.4'
    text: 'Indien Onze Minister nadat de overtreder zijn zienswijze naar voren heeft gebracht, beslist dat:'
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel82
  - number: 82.4.a
    text: voor de overtreding geen bestuurlijke boete zal worden opgelegd of
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel82
  - number: 82.4.b
    text: |-
      de overtreding met het oog op strafvervolging aan het openbaar ministerie zal worden voorgelegd, wordt dit
      schriftelijk aan de overtreder medegedeeld.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel82
  - number: '83'
    text: |-
      De beschikking tot oplegging van de bestuurlijke boete vermeldt de naam van de overtreder en het bedrag van de
      boete.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel83
  - number: '84.1'
    text: |-
      Degene die aan een handeling van Onze Minister redelijkerwijs de gevolgtrekking kan verbinden dat aan hem een
      bestuurlijke boete zal worden opgelegd, is niet langer verplicht ten behoeve van deze oplegging inlichtingen over
      de overtreding te verstrekken.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel84
  - number: '84.2'
    text: |-
      De overtreder wordt hierop gewezen alvorens hem mondeling wordt gevraagd inlichtingen te verstrekken, en in ieder
      geval wanneer hij in de gelegenheid wordt gesteld over het voornemen tot oplegging van de bestuurlijke boete zijn
      zienswijze naar voren te brengen.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel84
  - number: '85'
    text: |-
      Indien een bestuurlijke boete is opgelegd, dan wel een kennisgeving als bedoeld in
      [artikel 82, vierde lid, onderdeel a][ref1], is verzonden, heeft dit dezelfde rechtsgevolgen als een kennisgeving
      van niet verdere vervolging als bedoeld in [artikel 243 van het Wetboek van Strafvordering][ref2], met dien
      verstande dat [artikel 245a van dat wetboek][ref3] niet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel82
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel243
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel245a
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '82'
        hoofdstuk: '6'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '243'
      - id: ref3
        bwb_id: BWBR0001903
        artikel: 245a
  - number: '86.1'
    text: |-
      Met de opsporing van de bij of krachtens deze wet strafbaar gestelde feiten zijn, onverminderd
      [artikel 141 van het Wetboek van Strafvordering][ref1], belast de met betrekking tot deze wet krachtens
      [artikel 17, eerste lid, onderdeel 2°, van de Wet op de economische delicten][ref2] aangewezen
      ambtenaren. Deze ambtenaren zijn tevens belast met de opsporing van de feiten, strafbaar gesteld in de
      [artikelen 179 tot en met 182][ref3] en [184 van het Wetboek van Strafrecht][ref4], voorzover deze feiten
      betrekking hebben op een bevel, vordering of handeling, gedaan of ondernomen door henzelf.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0002063#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel179
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel184
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref2
        bwb_id: BWBR0002063
        artikel: '17'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '179'
      - id: ref4
        bwb_id: BWBR0001854
        artikel: '184'
  - number: '86.2'
    text: |-
      Met de opsporing van de bij of krachtens deze wet strafbaar gestelde feiten zijn voorts belast de bij besluit van
      Onze Minister en Onze Minister van Justitie tezamen aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel86
  - number: '86.3'
    text: Van een besluit als bedoeld in het tweede lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel86
  - number: '87.1'
    text: |-
      Overtreding van de [artikelen 4, vierde lid][ref1], [19][ref2], [21][ref3],
      [22, eerste lid, onderdelen c en d][ref4], en [51, derde lid][ref5], alsmede overtreding van de krachtens
      [hoofdstuk 2][ref6] en de [artikelen 64, tweede lid][ref7], [65, eerste lid][ref8], en [94][ref9] vastgestelde
      voorschriften, voorzover die overtreding daarbij uitdrukkelijk als strafbaar feit is aangemerkt, wordt gestraft met
      hechtenis van ten hoogste twee maanden of geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0015007#Artikel21
      [ref4]: https://wetten.overheid.nl/BWBR0015007#Artikel22
      [ref5]: https://wetten.overheid.nl/BWBR0015007#Artikel51
      [ref6]: https://wetten.overheid.nl/BWBR0015007#Hoofdstuk2
      [ref7]: https://wetten.overheid.nl/BWBR0015007#Artikel64
      [ref8]: https://wetten.overheid.nl/BWBR0015007#Artikel65
      [ref9]: https://wetten.overheid.nl/BWBR0015007#Artikel94
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '4'
        hoofdstuk: '1'
