        paragraaf: '3'
  - number: '120.2'
    text: |-
      De in het eerste lid bedoelde concessie wordt ook na de daarin bedoelde periode aangemerkt als een
      veiligheidsattest als bedoeld in [artikel 32][ref1], indien de houder voor die dag een aanvraag heeft ingediend
      voor een veiligheidsattest als bedoeld in [artikel 32][ref2] en zolang daarop niet onherroepelijk is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel32
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel120
