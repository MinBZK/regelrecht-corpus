  - number: '116'
    text: |-
      Na de inwerkingtreding van deze wet berusten de hierna genoemde algemene maatregelen van bestuur, voorzover zij
      niet voordien zijn ingetrokken, op de daarbij vermelde artikelen van deze wet:
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel116
  - number: 116.b
    text: |-
      het [Algemeen Reglement Vervoer][ref1] berust op dit artikel;


      [ref1]: https://wetten.overheid.nl/BWBR0002548
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0002548
  - number: '117'
    text: |-
      De schadevergoedingsplicht, bedoeld in
      [artikel 57, eerste en tweede lid, van Boek 5 van het Burgerlijk Wetboek][ref1], rust niet op de eigenaar van een
      erf met een recht van uitweg over de hoofdspoorweg, indien dat recht van kracht was op de dag voorafgaande aan de
      dag waarop [artikel 103, onderdeel a][ref2], in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel103
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '57'
      - id: ref2
        bwb_id: BWBR0015007
        artikel: '103'
        hoofdstuk: '8'
  - number: '118.1'
    text: |-
      Tot en met de eerste dag van de vierde kalendermaand na de dag waarop [artikel 28][ref1] in werking treedt,
      worden houders van een vergunning voor openbaar vervoer per trein, verleend ingevolge de Wet personenvervoer of
      de [Wet personenvervoer 2000][ref2], en houders van een erkenning als spoorwegonderneming, afgegeven door Onze
      Minister, voor de toepassing van deze wet aangemerkt als houders van een bedrijfsvergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011470
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0011470
  - number: '118.2'
    text: |-
      Het eerste lid geldt ook na de daarin bedoelde periode ten aanzien van de in het eerste lid bedoelde houders,
      indien zij voor de afloop van die periode een aanvraag hebben ingediend voor een vergunning als bedoeld in
      [artikel 28][ref1] en zolang als daarop niet onherroepelijk is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel28
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '119.1'
    text: |-
      Vergunningen die ingevolge [artikel 29a van de Spoorwegwet][ref1] (Stb. 1875, 67) zijn verleend en gelden op
      het tijdstip van inwerkingtreding van deze wet, worden vanaf de dag waarop [artikel 28][ref2] in werking treedt,
      aangemerkt als verleend op grond van [artikel 28][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel29a
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0015007#Artikel28
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: 29a
      - id: ref2
        bwb_id: BWBR0015007
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0015007
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '119.2'
    text: |-
      Vergunningaanvragen die ingevolge [artikel 29a van de Spoorwegwet][ref1] (Stb. 1875, 67) door Onze Minister
      in behandeling zijn genomen voor het tijdstip van inwerkingtreding van deze wet, worden vanaf de dag waarop
      [artikel 28][ref2] in werking treedt, aangemerkt als vergunningaanvragen op grond van [artikel 28][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel29a
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0015007#Artikel28
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: 29a
      - id: ref2
        bwb_id: BWBR0015007
        artikel: '28'
