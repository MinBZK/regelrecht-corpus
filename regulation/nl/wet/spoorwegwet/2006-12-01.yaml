      - id: ref9
        bwb_id: BWBR0015007
        artikel: '94'
        hoofdstuk: '6'
        paragraaf: '9'
  - number: '87.2'
    text: |-
      Overtreding van de [artikelen 3][ref1], [22, eerste lid, onderdelen a en b][ref2], en [65, tweede lid][ref3], wordt
      gestraft met hechtenis van ten hoogste drie maanden of geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0015007#Artikel65
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '3'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0015007
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0015007
        artikel: '65'
        hoofdstuk: '4'
        paragraaf: '7'
  - number: '87.3'
    text: |-
      Overtreding van [artikel 4, eerste, tweede en derde lid][ref1], [artikel 88, derde lid][ref2],
      [artikel 89, tweede, zesde, achtste en negende lid][ref3], wordt gestraft met gevangenisstraf van ten hoogste een
      jaar of geldboete van de vierde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel88
      [ref3]: https://wetten.overheid.nl/BWBR0015007#Artikel89
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '4'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0015007
        artikel: '88'
        hoofdstuk: '6'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0015007
        artikel: '89'
        hoofdstuk: '6'
        paragraaf: '4'
  - number: '87.4'
    text: |-
      Bij veroordeling van een persoon die een veiligheidsfunctie uitoefent, wegens overtreding van
      [artikel 4, eerste of tweede lid][ref1], kan hem de bevoegdheid tot het uitoefenen van die functie voor ten hoogste
      vijf jaren worden ontzegd.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel4
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '4'
        hoofdstuk: '1'
  - number: '87.5'
    text: |-
      Bij veroordeling van een persoon die een veiligheidsfunctie uitoefent, wegens overtreding van het bepaalde
      krachtens deze wet, kan hem in die gevallen waarin dit bij algemene maatregel van bestuur is bepaald, de
      bevoegdheid tot het uitoefenen van die functie voor ten hoogste twee jaar worden ontzegd.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel87
  - number: '87.6'
    text: |-
      De feiten strafbaar gesteld bij dan wel krachtens de in het eerste en tweede lid bedoelde bepalingen zijn
      overtredingen. De in het derde lid strafbaar gestelde feiten zijn misdrijven.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel87
  - number: '88.1'
    text: |-
      Een van de bij of krachtens [artikel 86 van deze wet][ref1] of
      [artikel 141 van het Wetboek van Strafvordering][ref2] met de opsporing van strafbare feiten belaste ambtenaren,
      kan een in [artikel 4, eerste lid][ref3], bedoelde persoon van wie, uit het in [artikel 4, vierde lid][ref4],
      bedoelde onderzoek of op andere wijze, naar het oordeel van die ambtenaar gebleken is dat hij onder zodanige
      invloed van het gebruik van een stof als bedoeld in [artikel 4, eerste lid][ref5], verkeert, dat hij onvoldoende
      in staat is een veiligheidsfunctie uit te oefenen dan wel op de uitoefening van zodanige functie toezicht te
      houden, een verbod opleggen tot het uitoefenen van die functie of tot het houden van toezicht daarop, voor de tijd
      gedurende welke redelijkerwijs verwacht mag worden dat deze toestand zal voortduren tot ten hoogste vierentwintig
      uur. De eerste volzin is van overeenkomstige toepassing op degene die aanstalten maakt een veiligheidsfunctie te
      gaan uitoefenen dan wel op de uitoefening van zodanige functie toezicht te houden.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel86
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref3]: https://wetten.overheid.nl/BWBR0015007#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0015007#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0015007#Artikel4
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '86'
        hoofdstuk: '6'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref3
        bwb_id: BWBR0015007
        artikel: '4'
        hoofdstuk: '1'
      - id: ref4
        bwb_id: BWBR0015007
        artikel: '4'
        hoofdstuk: '1'
      - id: ref5
        bwb_id: BWBR0015007
        artikel: '4'
        hoofdstuk: '1'
  - number: '88.2'
    text: |-
      De ambtenaar die een verbod als bedoeld in het eerste lid oplegt, legt dit vast in een beschikking die het tijdstip
      van ingang en de duur van het verbod bevat.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel88
  - number: '88.3'
    text: |-
      Het is degene aan wie een verbod als bedoeld in het eerste lid is opgelegd, verboden een veiligheidsfunctie uit te
      oefenen dan wel op de uitoefening van zodanige functie toezicht te houden, gedurende de tijd waarvoor dat verbod
      geldt.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel88
  - number: '89.1'
    text: |-
      Bij verdenking dat een persoon heeft gehandeld in strijd met [artikel 4, eerste, tweede of derde lid][ref1], kan
      de in [artikel 88, eerste lid][ref2], bedoelde ambtenaar hem bevelen zijn medewerking te verlenen aan een onderzoek
      als bedoeld in [artikel 4, tweede lid, onderdeel a][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel88
      [ref3]: https://wetten.overheid.nl/BWBR0015007#Artikel4
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '4'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0015007
        artikel: '88'
        hoofdstuk: '6'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0015007
        artikel: '4'
        hoofdstuk: '1'
  - number: '89.2'
    text: |-
      Degene aan wie het in het eerste lid bedoelde bevel is gegeven, is verplicht ademlucht te blazen in een voor het
      onderzoek bestemd apparaat en gevolg te geven aan alle door de betrokken ambtenaar ten dienste van het onderzoek
      gegeven aanwijzingen.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel89
  - number: '89.3'
    text: |-
      De in het tweede lid genoemde verplichtingen gelden niet voor de verdachte van wie aannemelijk is, dat het verlenen
      van medewerking aan een ademonderzoek voor hem om bijzondere geneeskundige redenen onwenselijk is.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel89
  - number: '89.4'
    text: |-
      In het geval, bedoeld in het derde lid, dan wel indien de medewerking van de verdachte niet heeft geleid tot
      een voltooid ademonderzoek, kan de betrokken ambtenaar de verdachte vragen of hij zijn toestemming geeft tot
      het verrichten van een onderzoek als bedoeld in [artikel 4, tweede lid, onderdeel b][ref1]. Gelijke bevoegdheid
      heeft de betrokken ambtenaar, indien het vermoeden bestaat dat de verdachte onder invloed van een andere in
      [artikel 4, eerste lid][ref2], bedoelde stof dan alcoholhoudende drank verkeert.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel4
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '4'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0015007
        artikel: '4'
        hoofdstuk: '1'
  - number: '89.5'
    text: |-
      Indien de verdachte zijn op grond van het vierde lid gevraagde toestemming niet verleent, kan de officier
      van justitie, een hulpofficier van justitie of een van de daartoe bij regeling van Onze Minister van Justitie
      aangewezen ambtenaren, aangesteld voor de uitvoering van de politietaak, hem bevelen zich te onderwerpen aan een
      bloedonderzoek.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel89
  - number: '89.6'
    text: |-
      Degene wie is bevolen zich aan een bloedonderzoek te onderwerpen, is verplicht aan dit bevel gevolg te geven en
      zijn medewerking te verlenen. Hem wordt door een arts zoveel bloed afgenomen als voor het onderzoek noodzakelijk
      is.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel89
  - number: '89.7'
    text: |-
      De in het zesde lid genoemde verplichtingen gelden niet voor de verdachte van wie aannemelijk is, dat afname van
      bloed bij hem om bijzondere geneeskundige redenen onwenselijk is.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel89
  - number: '89.8'
    text: |-
      De krachtens het zevende lid van de in het zesde lid genoemde verplichtingen vrijgestelde personen zijn verplicht
      mee te werken aan een door de officier van justitie, door een hulpofficier van justitie of door een van de
      daartoe bij regeling van Onze Minister van Justitie aangewezen ambtenaren, aangesteld voor de uitvoering van de
      politietaak, bevolen onderzoek ten einde op andere wijze dan door bloed- of ademonderzoek het gebruik van de in
      [artikel 4, eerste lid][ref1], bedoelde stoffen of het in [artikel 4, tweede lid, onderdeel b][ref2], genoemde
      gehalte vast te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel4
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '4'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0015007
        artikel: '4'
        hoofdstuk: '1'
  - number: '89.9'
    text: |-
      Indien de verdachte niet in staat is zijn wil kenbaar te maken, kan hem met toestemming van de officier van
      justitie, een hulpofficier van justitie of een van de daartoe bij regeling van Onze Minister van Justitie
      aangewezen ambtenaren, aangesteld voor de uitvoering van de politietaak, door een arts de in het zesde lid bedoelde
      hoeveelheid bloed worden afgenomen, tenzij aannemelijk is dat dit bij hem om bijzondere geneeskundige redenen
      onwenselijk is. Een onderzoek van het bloed vindt niet plaats dan nadat de verdachte in de gelegenheid is gesteld
      zijn toestemming daartoe te geven. Zo nodig kan hem overeenkomstig het vijfde lid worden bevolen zijn medewerking
      te verlenen. De verdachte aan wie een zodanig bevel is gegeven, is verplicht zijn medewerking te verlenen. Indien
      de verdachte weigert zijn medewerking te verlenen, wordt het bloedmonster vernietigd.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel89
  - number: '89.10'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld over de wijze van uitvoering van
      [artikel 4, vierde lid][ref1], en van dit artikel. Deze regels kunnen mede betrekking hebben op de mogelijkheid
      tot het doen verrichten van een tegenonderzoek. Bij regeling van Onze Minister van Justitie worden in de bij die
      algemene maatregel van bestuur aangegeven gevallen voorschriften ter uitvoering van die regels vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel4
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '4'
        hoofdstuk: '1'
  - number: '90'
    text: |-
      In afwijking van [artikel 8:7 van de Algemene wet bestuursrecht][ref1] is voor beroepen tegen besluiten op grond
      van deze wet, met uitzondering van besluiten op grond van de [artikelen 19][ref2] en [21][ref3], de rechtbank te
      Rotterdam bevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0015007#Artikel21
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0015007
        artikel: '19'
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0015007
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '91.1'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat aan het betrokken bestuursorgaan een vergoeding verschuldigd is
      volgens de daarbij vast te stellen tarieven ter zake van het overeenkomstig deze wet aanvragen of verstrekken van
      een bij of krachtens deze wet te nemen besluit, te verstrekken certificaat of ander document.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel91
  - number: '91.2'
    text: |-
      De hoogte van de krachtens het eerste lid vastgestelde tarieven wordt zodanig vastgesteld dat de geraamde baten
      van de vergoedingen voor het betrokken bestuursorgaan niet uitgaan boven de geraamde lasten van het betrokken
      bestuursorgaan ter zake van de behandelingen van de aanvragen en het verstrekken van de besluiten en documenten,
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel91
  - number: '92.1'
    text: |-
      Een wijziging van [richtlijn 91/440/EEG](31991L0440), [richtlijn 95/18/EG](31995L0018), [richtlijn 2001/14/EG]
      (32001L0014), [richtlijn 96/48/EG](31996L0048) en [richtlijn 2001/16/EG](32001L0016) gaat voor de toepassing van
      deze wet gelden met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven,
      tenzij bij ministerieel besluit, dat in de Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel92
  - number: '92.2'
    text: |-
      Onze Minister kan met inachtneming van artikel 7 van [richtlijn 96/48/EG](31996L0048) dan wel van [richtlijn
      2001/16/EG](32001L0016) een technische specificatie inzake interoperabiliteit geheel of gedeeltelijk buiten
      toepassing verklaren.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel92
  - number: '93.1'
    text: 'Onze Minister wijst de instanties aan die zijn belast met:'
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel93
  - number: 93.1.a
    text: |-
      de beoordeling van de conformiteit of van de geschiktheid voor gebruik als bedoeld in de artikelen 13 van de
      [richtlijnen 96/48/EG](31996L0048) en [2001/16/EG](32001L0016) en de afgifte van de bijbehorende EG-verklaringen
      van conformiteit of geschiktheid voor gebruik als bedoeld in de artikelen 10 van deze richtlijnen;
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel93
  - number: 93.1.b
    text: |-
      de goedkeuring als bedoeld in de artikelen 18 van de [richtlijnen 96/48/EG](31996L0048) en [2001/16/EG](32001L0016)
      en de afgifte van de bijbehorende EG-keuringsverklaringen als bedoeld in de artikelen 16 van deze richtlijnen;
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel93
  - number: 93.1.c
    text: |-
      de afgifte van goedkeuringscertificaten als bedoeld in [artikel 8, tweede lid, onderdeel c][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel8
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 93.1.d
    text: |-
      de afgifte van goedkeuringscertificaten als bedoeld in [artikel 36, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel36
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 93.1.e
    text: |-
      het onderzoek, bedoeld in [artikel 38, eerste lid, onderdeel c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel38
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '38'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '93.2'
    text: |-
      De instanties, de directeur en het personeel daarvan voldoen ten minste aan de toepasselijke eisen, neergelegd in
      bijlage VII van [richtlijn 96/48/EG](31996L0048), respectievelijk [richtlijn 2001/16/EG](32001L0016), en aan de bij
      ministeriële regeling vastgestelde eisen.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel93
  - number: '93.3'
    text: Aan de aanwijzing kunnen voorschriften en beperkingen worden verbonden.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel93
  - number: '93.4'
    text: |-
      De instanties verrichten hun werkzaamheden met inachtneming van de toepasselijke bepalingen in bijlage VI van
      [richtlijn 96/48/EG](31996L0048) respectievelijk [richtlijn 2001/16/EG](32001L0016) en het Besluit nr. 93/465/
      EEG van de Raad van de Europese Gemeenschappen van 22 juli 1993 betreffende de modules voor de verschillende fasen
      van de overeenstemmingsbeoordelingsprocedures en de voorschriften inzake het aanbrengen en het gebruik van de CE-
      markering van overeenstemming (PbEG L 220).
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel93
  - number: '93.5'
    text: |-
      De instanties stellen na elk onderzoek een onderzoekscertificaat op, in voorkomend geval met vermelding van de
      geldigheidsduur en van de voorwaarden waaronder het geldig is.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel93
  - number: '93.6'
    text: |-
      Onze Minister trekt de aanwijzing, bedoeld in het eerste lid, in indien de betrokken instantie niet langer voldoet
      aan de toepasselijke eisen van bijlage VII van de desbetreffende richtlijn. Onze Minister kan de aanwijzing
      intrekken, indien de betrokken instantie niet langer voldoet aan bijlage VI van de desbetreffende richtlijn of de
      bij ministeriële regeling vastgestelde eisen, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel93
  - number: '93.7'
    text: |-
      Onze Minister doet mededeling van een aanwijzing of van een intrekking van een aanwijzing door kennisgeving in
      de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel93
  - number: '96.1'
    text: |-
      Spoorwegondernemingen en de beheerder zijn verplicht Onze Minister mondeling, schriftelijk of op andere wijze – dit
      ter keuze van Onze Minister na overleg met de betrokken spoorwegonderneming of betrokken beheerder – alle bij hen
      berustende gegevens te verstrekken en inzage te geven van boeken en bescheiden die betrekking hebben op het gebruik
      of beheer van spoorwegen en het vervoer daarover, voorzover Onze Minister dat redelijkerwijs voor de vervulling van
      zijn taak nodig heeft.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel96
  - number: '96.2'
    text: |-
      Degene van wie krachtens het eerste lid gegevens worden verlangd, is op de door Onze Minister aan te geven wijze
      en binnen de door hem te bepalen termijn verplicht deze volledig en naar waarheid te verstrekken en degene van wie
      inzage wordt verlangd is verplicht deze ongestoord te verlenen.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel96
  - number: '96.3'
    text: |-
      Onze Minister gebruikt gegevens of inlichtingen omtrent een spoorwegonderneming die hij heeft verkregen in verband
      met enige werkzaamheid ten behoeve van de uitvoering van een van zijn taken, uitsluitend voor de uitvoering van
      die taak.
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel96
  - number: '97'
    text: |-
      Voorzover dit noodzakelijk is ter beoordeling van het voldoen aan de bij of krachtens deze wet gestelde
      voorschriften kunnen gegevens betreffende het gedrag van bestuurders, het gedrag van een vergunninghouder en de
      gezondheid van personeel worden verwerkt. Onze Minister is verantwoordelijke voor de verwerking van de gegevens als
      bedoeld in de [Wet bescherming persoonsgegevens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011468
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0011468
  - number: '103'
    text: |-
      De volgende wetten worden ingetrokken op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende
      artikelen of onderdelen daarvan verschillend kan worden vastgesteld:
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel103
