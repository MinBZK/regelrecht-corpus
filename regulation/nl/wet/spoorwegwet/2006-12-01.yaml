        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0015007
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '120.1'
    text: |-
      Een geldende concessie ter uitoefening van de dienst verleend op grond van
      __REF000___________________________________________________________________________________________________________
      ________________________________________________________ (Stb. 118) wordt tot en met de eerste dag van de
      vierde kalendermaand na de dag waarop [artikel 103, onderdeel b][ref2], in werking treedt, aangemerkt als een
      veiligheidsattest als bedoeld in [artikel 32][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001866#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel103
      [ref3]: https://wetten.overheid.nl/BWBR0015007#Artikel32
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel120
