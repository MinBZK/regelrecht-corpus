        paragraaf: '3'
  - number: '121'
    text: |-
      Hoofdspoorweginfrastructuur die in overeenstemming met de daarvoor geldende voorschriften die gelden op de dag
      voorafgaande aan de dag waarop [artikel 6][ref1] in werking treedt, wordt gebruikt, wordt met ingang van de dag
      waarop [dat artikel][ref2] in werking treedt, aangemerkt als in overeenstemming met [dat artikel][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0015007#Artikel6
    url: https://wetten.overheid.nl/BWBR0015007/2006-12-01#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '6'
        hoofdstuk: '2'
