  - number: '33'
    text: |-
      1 Aan het veiligheidscertificaat, verleend door Onze Minister, kunnen beperkingen en voorschriften worden verbonden
      in het belang van de veiligheid op en in de directe nabijheid van de hoofdspoorweg.

      2 Onze Minister kan een door hem verleend veiligheidscertificaat beperken of intrekken indien:

      a. de certificaathouder handelt in strijd met de voorwaarden waaronder het veiligheidscertificaat is verleend of
      uitgebreid, alsmede de aan het veiligheidscertificaat verbonden beperkingen en voorschriften, of

      b. de bedrijfsvergunning van de certificaathouder is geschorst of ingetrokken.

      3 Onze Minister kan het door hem verleende veiligheidscertificaat of de daaraan verbonden beperkingen en
      voorschriften ambtshalve of op aanvraag wijzigen, met inachtneming van het belang van de veiligheid op en in de
      directe nabijheid van de hoofdspoorweg.

      4 Onze Minister neemt het besluit, bedoeld in het tweede en derde lid, uiterlijk vier maanden
      nadat hij heeft vastgesteld dat de omstandigheid, genoemd in het tweede en derde lid, zich heeft
      voorgedaan, en beslist, indien een aanvraag als bedoeld in het derde lid is gedaan, in afwijking van
      [artikel 4:14 van de Algemene wet bestuursrecht][ref1] bij verlenging van de beslistermijn op de aanvraag, in
      ieder geval uiterlijk vier maanden nadat alle in [artikel 4:2, tweede lid, van de Algemene wet bestuursrecht][ref2]
      bedoelde informatie is verschaft.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel414
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel42
