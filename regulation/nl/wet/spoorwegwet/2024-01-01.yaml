  - number: 26r
    text: |-
      1 Onze Minister kan, op aanvraag, een tijdelijke gebruiksvergunning verlenen voor het uitvoeren van tests met
      spoorvoertuigen op de hoofdspoorweginfrastructuur of een gedeelte daarvan. Een tijdelijke gebruiksvergunning kan
      onder beperkingen worden verleend. Aan een tijdelijke gebruiksvergunning kunnen voorschriften worden verbonden.

      2 Onze Minister kan een aanvrager van een voertuigvergunning als bedoeld in [artikel 26k, eerste lid][ref1],
      van een ontheffing als bedoeld in artikel 26k, vijfde lid, of van een typegoedkeuring als bedoeld in
      [artikel 26m, eerste lid][ref2], verzoeken tests uit te voeren met een spoorvoertuig voor zover dat nodig is
      voor een goede beoordeling van de desbetreffende aanvraag. In dat geval verleent Onze Minister een tijdelijke
      gebruiksvergunning als bedoeld in het eerste lid ambtshalve.

      3 De beheerder doet, in overleg met de aanvrager van de tijdelijke gebruiksvergunning, een aanvrager als bedoeld
      in het tweede lid, dan wel een spoorwegonderneming die controles wil uitvoeren als bedoeld in [artikel 26p][ref3],
      al het mogelijke om ervoor te zorgen dat de tests plaats kunnen vinden binnen drie maanden nadat de beheerder een
      verzoek daartoe heeft ontvangen.

      4 Onze Minister kan van eenieder medewerking vorderen die redelijkerwijs noodzakelijk is om te waarborgen dat de
      tests tijdig kunnen plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel26k
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel26m
      [ref3]: https://wetten.overheid.nl/BWBR0015007#Artikel26p
