  - number: 26c
    text: |-
      Het is verboden een subsysteem te construeren, in dienst te stellen of te exploiteren binnen het
      hoofdspoorwegsysteem dat niet voldoet aan de voor dat subsysteem geldende essentiële eisen.
    url: https://wetten.overheid.nl/BWBR0015007/2024-01-01#Artikel26c
  - number: 26ca
    text: |-
      1 Indien voor een subsysteem een EG-keuringsverklaring is opgesteld op basis van de TSI’s en, naargelang het geval,
      overeenkomstig de nationale voorschriften, wordt dat subsysteem geacht te voldoen aan de essentiële eisen.

      2 Een EG-keuringsverklaring als bedoeld in het eerste lid wordt opgesteld na toepassing van de daarvoor geldende
      keuringsprocedures en overeenkomstig de krachtens [artikel 26e, onderdelen b, c en d][ref1], gestelde regels.

      3 Het is verboden een EG-keuringsverklaring op te stellen voor een subsysteem dat niet voldoet aan de essentiële
      eisen.

      4 Subsystemen die conform zijn met geharmoniseerde normen of delen daarvan waarvan de referenties in het
      Publicatieblad van de Europese Unie zijn bekendgemaakt, worden geacht conform te zijn met de essentiële eisen die
      door die normen of delen daarvan worden bestreken.

      5 Onze Minister kan verzoeken om aanvullende verificaties te verrichten ten aanzien van een subsysteem dat is
      voorzien van een EG-keuringsverklaring, indien hij constateert dat het subsysteem niet voldoet aan de essentiële
      eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel26e
    url: https://wetten.overheid.nl/BWBR0015007/2024-01-01#Artikel26ca
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: 26e
        hoofdstuk: 2a
        paragraaf: '2'
  - number: 26d
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over:

      a. de uitvoering van essentiële eisen voor subsystemen die niet volledig door de TSI’s worden bestreken,

      b. eisen die gelden bij het buiten toepassing laten van een TSI of een gedeelte daarvan als bedoeld in
      [artikel 26f, eerste lid][ref1],

      c. technische eisen die toegepast worden in specifieke gevallen waarin de TSI’s niet voorzien,

      d. de verzekering van de technische compatibiliteit van een spoorvoertuig met de hoofdspoorweginfrastructuur,

      e. hoofdspoorweginfrastructuur en spoorvoertuigen die daarvan gebruik maken die niet onder de werkingssfeer van de
      TSI’s vallen,

      f. dringende, tijdelijke en preventieve maatregelen, te nemen ten aanzien van hoofdspoorweginfrastructuur of
      spoorvoertuigen die daarvan gebruik maken, in het bijzonder na een ongeval.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel26f
    url: https://wetten.overheid.nl/BWBR0015007/2024-01-01#Artikel26d
