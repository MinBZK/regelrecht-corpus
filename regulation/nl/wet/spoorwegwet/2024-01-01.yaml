  - number: 16d
    text: |-
      1 Een beheerder gebruikt inkomsten uit het beheer van de hoofdspoorweginfrastructuur slechts voor het financieren
      van eigen activiteiten, met inbegrip van het afbetalen van leningen. De beheerder mag inkomsten gebruiken om
      dividend uit te keren aan de aandeelhouder of eigenaar.

      2 Een beheerder verstrekt direct noch indirect leningen aan spoorwegondernemingen.

      3 Een spoorwegonderneming verstrekt direct noch indirect leningen aan een beheerder.
    url: https://wetten.overheid.nl/BWBR0015007/2024-01-01#Artikel16d
  - number: 16e
    text: |-
      Ten aanzien van een verticaal geïntegreerde onderneming als bedoeld in artikel 3, onderdeel 31, van [richtlijn
      2012/34](32012L0034)/EU kunnen bij of krachtens algemene maatregel van bestuur regels worden gesteld ter uitvoering
      van de artikelen 7, eerste lid, tweede volzin, tweede lid, derde lid, onderdeel d, vierde en vijfde lid, 7 bis,
      tweede lid, onderdeel b, 7 quater, eerste lid, onderdeel a, en 7 quinquies, eerste lid, en vierde tot en met tiende
      lid, van [richtlijn 2012/34](32012L0034)/EU.
    url: https://wetten.overheid.nl/BWBR0015007/2024-01-01#Artikel16e
  - number: 16f
    text: |-
      1 Een beheerder beschikt bij de uitvoering van de taken, bedoeld in [artikel 16, eerste lid][ref1], anders dan ten
      behoeve van de aanleg van hoofdspoorweginfrastructuur over een geldige veiligheidsvergunning.

      2 Onze Minister verleent op aanvraag een veiligheidsvergunning aan de beheerder, indien hij beschikt over een
      veiligheidsbeheersysteem dat:

      a. voldoet aan de krachtens het zevende lid, onderdeel b, gestelde regels;

      b. op zodanige wijze is geoperationaliseerd dat het een veilig beheer en gebruik van hoofdspoorweginfrastructuur
      mogelijk maakt.

      3 In afwijking van [artikel 4:14 van de Algemene wet bestuursrecht][ref2] beslist Onze Minister bij verlenging
      van de beslistermijn op de aanvraag, bedoeld in het tweede lid, in ieder geval uiterlijk vier maanden nadat
      alle in [artikel 4:2, tweede lid, van de Algemene wet bestuursrecht][ref3] bedoelde informatie is verschaft,
      en neemt het besluit, bedoeld in het vijfde lid, uiterlijk vier maanden nadat hij heeft vastgesteld dat het
      veiligheidsbeheersysteem niet meer voldoet aan het tweede lid.

      4 Onze Minister stelt beperkingen aan of trekt een veiligheidsvergunning in, indien het veiligheidsbeheersysteem
      van de beheerder niet meer voldoet aan het tweede lid.

      5 De beheerder gebruikt het veiligheidsbeheersysteem, bedoeld in het tweede lid, bij de uitvoering van de taken,
      bedoeld in het eerste lid, ter beheersing van alle uit die taken voortvloeiende risico’s.

      6 Een beheerder stelt jaarlijks een verslag op met betrekking tot de spoorwegveiligheid dat voldoet aan de
      krachtens het zevende lid, onderdeel d, gestelde regels, en zendt dat verslag voor 31 mei aan Onze Minister.

      7 Bij ministeriële regeling kunnen in het belang van een goede uitvoering van het bij of krachtens de
      spoorwegveiligheidsrichtlijn bepaalde met betrekking tot de veiligheidsvergunning ten minste regels worden gesteld
      over:

      a. de aanvraag van een veiligheidsvergunning als bedoeld in het tweede lid,

      b. eisen waaraan het veiligheidsbeheersysteem, bedoeld in het tweede lid, voldoet,

      c. verlening, wijziging en geldigheidsduur van een veiligheidsvergunning als bedoeld in het tweede lid,

      d. de inhoud van het verslag, bedoeld in het zesde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel16
