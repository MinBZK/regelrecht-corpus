  - number: '49'
    text: |-
      1 Personen die binnen het hoofdspoorwegverkeerssysteem een veiligheidsfunctie anders dan die van machinist met
      volledige bevoegdheid of van machinist met beperkte bevoegdheid uitoefenen, voldoen aan de bij of krachtens
      algemene maatregel van bestuur voor de uitoefening van die functie gestelde eisen inzake:

      a. minimumleeftijd;

      b. medische en psychologische geschiktheid;

      c. algemene kennis, bekwaamheid en ervaring, en

      d. taalbeheersing.

      2 Personen die binnen het hoofdspoorwegverkeerssysteem de veiligheidsfunctie van machinist met volledige
      bevoegdheid of van machinist met beperkte bevoegdheid uitoefenen, voldoen aan de bij of krachtens algemene
      maatregel van bestuur voor de uitoefening van die functie gestelde eisen inzake:

      a. minimumleeftijd;

      b. medische en psychologische geschiktheid;

      c. algemene kennis en vaardigheden;

      d. specifieke vakkennis inzake de spoorvoertuigen en de hoofdspoorweginfrastructuur waarop een bevoegdheidsbewijs
      betrekking kan hebben, en

      e. taalbeheersing.

      3 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de wijze waarop wordt aangetoond dat
      aan de in het eerste lid en tweede lid bedoelde eisen wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0015007/2024-01-01#Artikel49
  - number: '50'
    text: |-
      1 Een persoon die binnen het hoofdspoorwegverkeerssysteem een veiligheidsfunctie anders dan die van machinist
      met volledige bevoegdheid of van machinist met beperkte bevoegdheid uitoefent, beschikt, behoudens bij algemene
      maatregel van bestuur vastgestelde uitzonderingen, over:

      a. één of meer beoordelingen door Onze Minister waaruit blijkt dat hij voldoet aan de krachtens
      [artikel 49, eerste lid][ref1], voor de desbetreffende veiligheidsfunctie vastgestelde eisen inzake algemene
      kennis, bekwaamheid en ervaring en een geldige verklaring van medische geschiktheid en een geldige verklaring van
      psychologische geschiktheid, afgegeven door een door Onze Minister erkend keuringsinstituut, of

      b. een geldige erkenning van beroepskwalificaties als bedoeld in
      [artikel 5 van de Algemene wet erkenning EU-beroepskwalificaties][ref2].

      2 Een persoon die binnen het hoofdspoorwegverkeerssysteem de veiligheidsfunctie van machinist met volledige
      bevoegdheid of van machinist met beperkte bevoegdheid uitoefent, beschikt over:

      a. één of meer beoordelingen van Onze Minister waaruit blijkt dat hij voldoet aan de krachtens
      [artikel 49, tweede lid][ref3], voor de desbetreffende veiligheidsfunctie vastgestelde eisen inzake algemene kennis
      en vaardigheden en een geldige verklaring van medische geschiktheid en een geldige verklaring van psychologische
      geschiktheid, afgegeven door een door Onze Minister erkend keuringsinstituut, of

      b. een geldige machinistenvergunning die in een andere lidstaat van de Europese Unie is afgegeven.

      3 Een persoon die binnen het hoofdspoorwegverkeerssysteem de veiligheidsfunctie van machinist met
      volledige bevoegdheid of van machinist met beperkte bevoegdheid uitoefent beschikt over een geldige
      machinistenvergunning en een geldig bevoegdheidsbewijs dat betrekking heeft op de spoorvoertuigen waarmee en op de
      hoofdspoorweginfrastructuur waarvan gebruik wordt gemaakt.

      4 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over de aanvraag, afgifte en
      geldigheid van de in het eerste lid, onderdeel a, en het tweede lid, onderdeel a, bedoelde beoordelingen,
      verklaringen van medische en psychologische geschiktheid alsmede over de erkenningen van keuringsinstituten.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0023066#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0015007#Artikel49
