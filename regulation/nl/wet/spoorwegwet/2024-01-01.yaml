  - number: 26q
    text: |-
      1 Het is verboden gebruik te maken van de hoofdspoorweginfrastructuur met een spoorvoertuig:

      a. zonder een voor het desbetreffende gedeelte van de hoofdspoorweginfrastructuur geldige voertuigvergunning als
      bedoeld in [artikel 26k, eerste lid][ref1],

      b. dat niet staat ingeschreven in het door Onze Minister gehouden voertuigregister, bedoeld in
      [artikel 26aa, eerste lid][ref2], het voertuigregister van een andere lidstaat of het Europees voertuigregister, en

      c. waarop geen Europees voertuignummer is aangebracht.

      2 Het is verboden gebruik te maken van de hoofdspoorweginfrastructuur met een vernieuwd of verbeterd spoorvoertuig
      waarvoor, in strijd met [artikel 26l][ref3] of de krachtens [artikel 26o, onderdeel e][ref4], gestelde regels, geen
      nieuwe voertuigvergunning is verleend.

      3 Het eerste en tweede lid zijn niet van toepassing, indien Onze Minister een tijdelijke gebruiksvergunning heeft
      verleend als bedoeld in [artikel 26r, eerste lid][ref5].

      4 Onze Minister kan ontheffing of vrijstelling verlenen van de verplichting om te beschikken over een voor het
      desbetreffende gedeelte van de hoofdspoorweginfrastructuur geldige voertuigvergunning als bedoeld in het eerste
      lid, onderdeel a, indien voor die spoorvoertuigen een voertuigvergunning is verleend die geldt voor de met de
      desbetreffende hoofdspoorweginfrastructuur verbonden, dicht bij de grens gelegen spoorweginfrastructuur in de
      aangrenzende lidstaat. Een ontheffing of vrijstelling kan onder beperkingen worden verleend. Aan een ontheffing of
      vrijstelling kunnen voorschriften worden verbonden.

      5 Het eerste lid is niet van toepassing op spoorvoertuigen waarvoor Onze Minister een ontheffing als bedoeld in
      [artikel 26k, vijfde lid][ref6], heeft verleend.

      6 Onze Minister kan, op aanvraag, ontheffing verlenen van het verbod, bedoeld in het eerste lid. Een ontheffing
      kan onder beperkingen worden verleend. Aan een ontheffing kunnen voorschriften worden verbonden. Bij ministeriële
      regeling kunnen regels worden gesteld met betrekking tot de aanvraag en verlening van een ontheffing, ter
      omschrijving van spoorvoertuigen waarmee op omschreven hoofdspoorwegen gebruik gemaakt mag worden, met het oog op
      het veilig gebruik van die spoorvoertuigen op die hoofdspoorwegen en over de procedures die bij verlening van een
      ontheffing gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel26k
