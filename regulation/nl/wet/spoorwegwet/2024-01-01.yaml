      1 Op vergunningen en aanvullende vergunningen voor indienststelling die ingevolge [artikel 36][ref1] van de
      Spoorwegwet zijn verleend, zoals dat artikel luidde tot de inwerkingtreding van het bij koninklijke boodschap
      van 12 mei 2016 ingediende voorstel van wet tot wijziging van de Spoorwegwet ter nadere implementatie van
      drie spoorwegrichtlijnen, en gelden op het tijdstip van inwerkingtreding van het bij koninklijke boodschap
      van 12 mei 2016 ingediende voorstel van wet tot wijziging van de Spoorwegwet ter nadere implementatie van drie
      spoorwegrichtlijnen, zijn de artikelen 36 en 36b van genoemde wet, zoals die luidt met ingang van het tijdstip van
      inwerkingtreding van het bij koninklijke boodschap van 12 mei 2016 ingediende voorstel van wet tot wijziging van de
      Spoorwegwet ter nadere implementatie van drie spoorwegrichtlijnen, van toepassing.

      2 Op aanvragen voor vergunningen en aanvullende vergunningen voor indienststelling die ingevolge [artikel 36][ref2]
      van de Spoorwegwet, zoals dat artikel luidde tot de inwerkingtreding van het bij koninklijke boodschap van
      12 mei 2016 ingediende voorstel van wet tot wijziging van de Spoorwegwet ter nadere implementatie van drie
      spoorwegrichtlijnen, door Onze Minister in behandeling zijn genomen, zijn de artikelen 36 en 36b van genoemde wet,
      zoals die luidt met ingang van het tijdstip van inwerkingtreding van het bij koninklijke boodschap van 12 mei 2016
      ingediende voorstel van wet tot wijziging van de Spoorwegwet ter nadere implementatie van drie spoorwegrichtlijnen,
      van toepassing.


