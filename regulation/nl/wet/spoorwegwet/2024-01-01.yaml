  - number: 26u
    text: |-
      1 Onze Minister besluit, op aanvraag, tot aanmelding van een of meer conformiteitsbeoordelingsinstanties die
      voldoen aan de krachtens [artikel 26z, onderdeel a][ref1], gestelde regels bij de Europese Commissie en de andere
      lidstaten. Een besluit tot aanmelding kan onder beperkingen worden gegeven. Aan een besluit tot aanmelding kunnen
      voorschriften worden verbonden.

      2 De in het eerste lid bedoelde regels bevatten ten minste voorschriften die waarborgen dat:

      a. de conformiteitsbeoordelingsinstantie onafhankelijk en onpartijdig is ten opzichte van de organisatie waarvan
      zij de producten beoordeelt,

      b. de conformiteitsbeoordelingsinstantie beschikt over een gedegen organisatie, en

      c. het personeel van de conformiteitsbeoordelingsinstantie deskundig en integer is.

      3 Wanneer een conformiteitsbeoordelingsinstantie aantoont dat zij voldoet aan de criteria in de toepasselijke
      geharmoniseerde normen of delen ervan waarvan de referentienummers in het Publicatieblad van de Europese Unie
      zijn bekendgemaakt, wordt zij geacht aan de eisen, bedoeld in het eerste lid, te voldoen, op voorwaarde dat de van
      toepassing zijnde geharmoniseerde normen deze eisen dekken.

      4 Een aangemelde instantie is bevoegd om de bij die aanmelding beschreven conformiteitsbeoordelingen uit te voeren
      ten aanzien van interoperabiliteitsonderdelen, subsystemen, spoorvoertuigen en andere producten, bestemd om deel
      uit te maken van het spoorwegsysteem, voor zover die conformiteitsbeoordelingen betrekking hebben op de TSI’s en
      andere toepasselijke Europese voorschriften.

      5 Onze Minister kan bij ministeriële regeling de nationale accreditatie-instantie aanwijzen om de beoordeling van
      aanvragen als bedoeld in het eerste lid te verrichten en controles op door hem aangemelde instanties uit te voeren.

      6 Een aangemelde instantie gaat pas over tot het verrichten van conformiteitsbeoordelingsactiviteiten na de
      mededeling van Onze Minister dat de Europese Commissie en de andere lidstaten geen bezwaren hebben geuit tegen
      de aanmelding.

      7 De Kaderwet zelfstandige bestuursorganen is niet van toepassing op conformiteitsbeoordelingsinstanties die op
      grond van het eerste lid zijn aangemeld.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel26z
    url: https://wetten.overheid.nl/BWBR0015007/2024-01-01#Artikel26u
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: 26z
        hoofdstuk: 2a
        paragraaf: '7'
  - number: 26v
    text: |-
      1 Onze Minister wijst, op aanvraag, een of meer conformiteitsbeoordelingsinstanties aan die voldoen aan de
      krachtens [artikel 26z, onderdeel a][ref1], gestelde regels. Een aanwijzing kan onder beperkingen worden verleend.
      Aan een aanwijzing kunnen voorschriften worden verbonden.

      2 Een aangewezen instantie is bevoegd om de bij die aanwijzing beschreven conformiteitsbeoordelingen uit te
      voeren ten aanzien van subsystemen, spoorvoertuigen en andere producten, bestemd om deel uit te maken van het
      spoorwegsysteem, voor zover die conformiteitsbeoordelingen betrekking hebben op nationale voorschriften.

      3 Onze Minister kan bij ministeriële regeling de nationale accreditatie-instantie aanwijzen om de beoordeling van
      aanvragen als bedoeld in het eerste lid te verrichten en controles op door hem aangemelde instanties uit te voeren.

      4 De Kaderwet zelfstandige bestuursorganen is niet van toepassing op conformiteitsbeoordelingsinstanties die op
      grond van het eerste lid zijn aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel26z
    url: https://wetten.overheid.nl/BWBR0015007/2024-01-01#Artikel26v
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: 26z
        hoofdstuk: 2a
        paragraaf: '7'
  - number: 26w
    text: |-
      1 Een aangemelde of aangewezen instantie verricht de werkzaamheden waarvoor zij is aangemeld of aangewezen volgens
      de krachtens [artikel 26z, onderdeel c][ref1], gestelde regels.

      2 Een aangemelde of aangewezen instantie verstrekt documenten, gegevens en andere informatie aan Onze
      Minister, het Europees Spoorwegbureau of andere conformiteitsbeoordelingsinstanties volgens de krachtens
      [artikel 26z, onderdeel d][ref2], gestelde regels.

      3 Activiteiten van aangemelde of aangewezen instanties mogen uitsluitend worden uitbesteed of door een
      dochteronderneming worden uitgevoerd:

      a. met instemming van de klant,

      b. na melding daarvan bij Onze Minister, en

      c. met inachtneming van de krachtens [artikel 26z, onderdeel e][ref3], gestelde regels.

      4 Aangemelde instanties nemen rechtstreeks dan wel via aangestelde vertegenwoordigers deel aan de werkzaamheden van
      de door de Europese Commissie opgerichte sectorale groep van aangemelde instanties, bedoeld in artikel 44 van de
      interoperabiliteitsrichtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel26z
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel26z
      [ref3]: https://wetten.overheid.nl/BWBR0015007#Artikel26z
