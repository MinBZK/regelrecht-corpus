    text: |-
      Bij ministeriële regeling kunnen in het belang van een goede uitvoering van het bij of krachtens de
      interoperabiliteitsrichtlijn bepaalde met betrekking tot de onderwerpen in deze paragraaf regels worden gesteld,
      waaronder in elk geval regels over:

      a. de eisen voor subsystemen als bedoeld in [artikel 26h, tweede lid][ref1],

      b. de aanvraag van een vergunning voor indienststelling en het dossier, bedoeld in [artikel 26h, derde lid][ref2],

      c. het dossier waarin het project tot vernieuwing of verbetering wordt beschreven, bedoeld in
      [artikel 26i, tweede lid, onderdeel a][ref3],

      d. beoordelingscriteria voor vernieuwingen en verbeteringen van de hoofdspoorweginfrastructuur.


