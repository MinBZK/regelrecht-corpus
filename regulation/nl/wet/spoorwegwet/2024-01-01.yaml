  - number: 51c
    text: |-
      1 Bij de beoordelingen, bedoeld in de [artikelen 50, eerste lid, onderdeel a, en tweede lid, onderdeel a][ref1],
      en [51a, vierde lid, onderdeel b][ref2], maakt Onze Minister onderscheidenlijk degene onder wiens gezag binnen het
      hoofdspoorwegsysteem de veiligheidsfunctie van machinist met volledige bevoegdheid of van machinist met beperkte
      bevoegdheid wordt uitgeoefend, gebruik van door Onze Minister erkende examinatoren.

      2 Onze Minister houdt een register van erkende examinatoren.

      3 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de aanvraag, afgifte en
      geldigheid van de erkenning van examinatoren.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel50
