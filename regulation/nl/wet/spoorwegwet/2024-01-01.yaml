  - number: '16'
    text: |-
      1 Onze Minister verleent een of meer concessies voor het beheer van de hoofdspoorweginfrastructuur. Het beheer
      omvat, met inachtneming van artikel 3, punt 2, van [richtlijn 2012/34](32012L0034)/EU, de zorg voor:

      a. de kwaliteit, betrouwbaarheid en beschikbaarheid van die infrastructuur;

      b. een eerlijke, niet-discriminerende en transparante verdeling van de capaciteit van die infrastructuur zowel ten
      behoeve van de beheerder als ten behoeve van spoorwegondernemingen;

      c. het leiden van het verkeer over die infrastructuur.

      2 Een concessie bevat een beschrijving van de werkzaamheden waarvoor de concessie wordt verleend.

      3 Een concessie voldoet aan de eisen, opgenomen in artikel 30, tweede lid, van richtlijn 2012/34/EU.

      4 Een concessie wordt niet verleend aan een spoorwegonderneming dan met inachtneming van artikel 7 bis van
      [richtlijn 2012/34](32012L0034)/EU.
    url: https://wetten.overheid.nl/BWBR0015007/2024-01-01#Artikel16
  - number: 16a
    text: |-
      1 De leden van de raad van commissarissen en van de raad van bestuur van een beheerder, alsmede de managers die
      rechtstreeks aan hen rapporteren, handelen op een niet-discriminerende manier. Hun onpartijdigheid mag niet door
      belangenconflicten worden aangetast.

      2 Een beheerder is juridisch gescheiden van welke spoorwegonderneming dan ook.

      3 Bij ministeriële regeling worden nadere regels gesteld ter uitvoering van artikel 7 van [richtlijn 2012/34]
      (32012L0034)/EU, meer in het bijzonder over de benoembaarheid van leden van de raad van bestuur en de raad van
      commissarissen van een beheerder, alsmede personen die besluiten nemen met betrekking tot essentiële functies.
    url: https://wetten.overheid.nl/BWBR0015007/2024-01-01#Artikel16a
  - number: 16b
    text: |-
      1 Een beheerder is wat betreft de essentiële functies, met inachtneming van de artikelen 4, tweede lid, 29 en 39
      van [richtlijn 2012/34](32012L0034)/EU onafhankelijk van de rechtspersonen, bedoeld in het tweede lid, ten aanzien
      van organisatie en besluitvorming.

      2 Een spoorwegonderneming of een andere rechtspersoon oefent met betrekking tot de essentiële functies geen
      beslissende invloed uit op de beheerder onverminderd de taken en bevoegdheden van Onze Minister ten aanzien van
      de vaststelling van het heffingskader en het capaciteitstoedelingskader en de specifieke heffingsvoorschriften
      overeenkomstig de artikelen 29 en 39 van [richtlijn 2012/34](32012L0034)/EU.

      3 De mobiliteit van personen belast met de essentiële functies mag niet leiden tot belangenconflicten.

      4 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld ter uitvoering van artikel 7 bis,
      derde en vierde lid, van [richtlijn 2012/34](32012L0034)/EU.
    url: https://wetten.overheid.nl/BWBR0015007/2024-01-01#Artikel16b
  - number: 16c
    text: |-
      1 Indien er geen belangenconflicten ontstaan en de vertrouwelijkheid van bedrijfsgevoelige informatie wordt
      gewaarborgd, kan een beheerder:

      a. functies uitbesteden aan een andere organisatie indien deze geen spoorwegonderneming is, geen zeggenschap over
      een spoorwegonderneming heeft, of niet onder zeggenschap van een spoorwegonderneming staat;

      b. de uitvoering van werkzaamheden en de daarmee verband houdende taken inzake onderhoud en vernieuwing van de
      hoofdspoorweginfrastructuur en de ontwikkeling daarvan, bedoeld in [artikel 16, eerste lid][ref1], uitbesteden aan
      een spoorwegonderneming of onderneming die zeggenschap over de spoorwegonderneming uitoefent, of onder zeggenschap
      van die spoorwegonderneming staat.

      2 De beheerder blijft verantwoordelijk voor de functies, bedoeld in artikel 3, punt 2, van [richtlijn 2012/34]
      (32012L0034)/EU.

      3 Bij ministeriële regeling kunnen regels worden gesteld ter uitvoering van artikel 7 quater, tweede tot en met
      vierde lid, van [richtlijn 2012/34](32012L0034)/EU.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel16
