  - number: '59'
    text: |-
      1 Een tussen de beheerder en een gerechtigde gesloten toegangsovereenkomst over het gebruik van
      hoofdspoorweginfrastructuur voldoet aan het gestelde in artikel 28 van richtlijn 2012/34/EU en bevat in elk geval
      bedingen over:

      a. de door de beheerder te bieden kwaliteit van de hoofdspoorweginfrastructuur;

      b. de vergoeding, bedoeld in [artikel 62, eerste lid][ref1].

      2 In de toegangsovereenkomst wordt capaciteit in de vorm van treinpaden als bedoeld in artikel 3, onderdeel 27, van
      richtlijn 2012/34/EU verdeeld voor maximaal de duur van een dienstregelingsperiode.

      3 In de toegangsovereenkomst wordt voor het gebruik van capaciteit voor in opdracht van de beheerder uit
      te voeren werkzaamheden op of aan hoofdspoorweginfrastructuur ten behoeve van de uitoefening van de taken,
      bedoeld in [artikel 16, eerste lid][ref2], een vergoeding van nihil vastgesteld als vergoeding als bedoeld in
      [artikel 62, eerste, tweede of derde lid][ref3].

      4 Bij algemene maatregel van bestuur kunnen ten behoeve van de overeenkomst algemene voorwaarden als bedoeld in
      [artikel 231 van Boek 6 van het Burgerlijk Wetboek][ref4] worden vastgesteld. In dat geval wordt in de overeenkomst
      naar die algemene voorwaarden verwezen.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel16
