  - number: '55'
    text: |-
      1 De spoorwegonderneming die van de hoofdspoorweginfrastructuur gebruik maakt, is verplicht ter zake van
      dat gebruik een verzekering te sluiten en in stand te houden, waarmee haar uit wettelijke aansprakelijkheid
      voortvloeiende financiële risico's voldoende zijn gedekt.

      2 Bij algemene maatregel van bestuur worden bedragen vastgesteld waarboven de verzekeringsplicht zich niet
      uitstrekt. Afzonderlijke bedragen kunnen worden bepaald naar gelang van onder meer de aard van de gebeurtenis, de
      aard van de schade, de grond van de aansprakelijkheid en de aard van de onderneming.

      3 [Artikel 6 van de Wet aansprakelijkheidsverzekering motorrijtuigen][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel6
    url: https://wetten.overheid.nl/BWBR0015007/2024-01-01#Artikel55
    references:
