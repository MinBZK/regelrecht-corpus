  - number: 123d
    text: |-
      1 Een vergunning voor indienststelling van een spoorvoertuig respectievelijk voor een type spoorvoertuig
      als bedoeld in de [artikelen 36][ref1], 36b en 37a van de Spoorwegwet, zoals die artikelen luidden op de dag
      voorafgaand aan het tijdstip van inwerkingtreding van [hoofdstuk 2a][ref2], blijven na de inwerkingtreding van
      hoofdstuk 2a, geldig voor de duur waarvoor de desbetreffende vergunning door Onze Minister is verleend. Op de
      betreffende vergunning voor indienststelling van een spoorvoertuig respectievelijk voor een type spoorvoertuig
      blijft het recht van toepassing zoals dat voor de inwerkingtreding van hoofdstuk 2a voor de betreffende vergunning
      gold, met dien verstande dat:

      a. op een uitbreiding van het gebruiksgebied in een vergunning voor indienststelling van een spoorvoertuig
      [artikel 26k, vierde lid][ref3], van toepassing is,

      b. op een vernieuwing of verbetering van het desbetreffende spoorvoertuig de [artikelen 26l][ref4] en
      [26q, tweede lid][ref5], van overeenkomstige toepassing zijn.

      2 Een ontheffing als bedoeld in de [artikelen 36, eerste lid][ref6], en 36b, eerste lid, van de Spoorwegwet, zoals
      die artikelen luidden op de dag voorafgaand aan het tijdstip van inwerkingtreding van [hoofdstuk 2a][ref7], blijft
      na de inwerkingtreding van hoofdstuk 2a, geldig voor de duur waarvoor de desbetreffende ontheffing is verleend. Op
      de desbetreffende ontheffing blijft het recht van toepassing zoals dat voor de inwerkingtreding van hoofdstuk 2a
      voor de ontheffing gold.

      3 Aanvragen voor een vergunning voor indienststelling van een spoorvoertuig respectievelijk voor een type
      spoorvoertuig of een ontheffing die voor de inwerkingtreding van [hoofdstuk 2a][ref8] zijn ingediend en waarop op
      de dag dat hoofdstuk 2a in werking treedt nog niet is beslist, worden aangemerkt als volgt:

      a. een aanvraag, ingediend voor een ontheffing op grond van[ artikel 36, eerste lid][ref9], of 36b, eerste lid,
      wordt afhankelijk van het geval aangemerkt als een aanvraag op grond van:

      1°. [artikel 26k, vijfde lid][ref10],

      2°. [artikel 26q, zesde lid][ref11], of

      3°. [artikel 26r, eerste lid][ref12].

      b. een aanvraag, ingediend voor een vergunning op grond van [artikel 36, derde lid][ref13], wordt aangemerkt als
      een aanvraag op grond van [artikel 26k, tweede lid][ref14],

      c. een aanvraag op grond van [artikel 36, vierde lid][ref15], wordt aangemerkt als een aanvraag op grond van
      [artikel 26f, eerste lid][ref16],

      d. een aanvraag, ingediend op grond van [artikel 36, negende lid][ref17], wordt aangemerkt als een aanvraag op
      grond van [artikel 26f, tweede lid][ref18],

      e. een aanvraag, ingediend op grond van [artikel 36, tiende lid][ref19], wordt aangemerkt als een aanvraag op grond
      van [artikel 26k, vijfde lid][ref20],

      f. een aanvraag, ingediend op grond van [artikel 37, derde lid][ref21], wordt aangemerkt als een aanvraag op grond
      van [artikel 26aa, eerste lid][ref22],

      g. een aanvraag, ingediend voor een vergunning voor indienststelling voor een type op grond van artikel 37a, eerste
      lid, wordt aangemerkt als een aanvraag op grond van [artikel 26n][ref23],

      h. een aanvraag, ingediend op grond van artikel 37b, vijfde lid, wordt aangemerkt als een aanvraag op grond van
      [artikel 26f, eerste lid][ref24].

      4 Aanvragen voor een vergunning voor indienststelling van een spoorvoertuig of een ontheffing als bedoeld in
      artikel 36b die voor de inwerkingtreding van [hoofdstuk 2a][ref25] zijn ingediend en waarop op de dag dat hoofdstuk
      2a in werking treedt nog niet is beslist, worden na de inwerkingtreding van hoofdstuk 2a, geacht van rechtswege te
      zijn geweigerd.


