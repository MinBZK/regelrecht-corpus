    text: |-
      1 De beheerder stelt een beheerplan op dat voldoet aan artikel 8, derde lid, van richtlijn 2012/34/EU en aan de
      voorschriften vastgelegd in de aan hem verleende concessie.

      2 Aan de concessie wordt een voorschrift verbonden ten aanzien van de duur van het beheerplan.
    url: https://wetten.overheid.nl/BWBR0015007/2024-01-01#Artikel17a
  - number: 17b
    text: |-
      1 De beheerder vraagt advies aan de gerechtigden, bedoeld in [artikel 57][ref1], met uitzondering van de
      concessieverlener, bedoeld in [artikel 20, eerste lid, van de Wet personenvervoer 2000][ref2], over de bij of
      krachtens algemene maatregel van bestuur aangewezen onderdelen van het beheerplan, bedoeld in [artikel 17a][ref3].

      2 De beheerder stelt de gerechtigden in de gelegenheid met hem overleg te voeren voordat advies wordt uitgebracht.

      3 Het advies, bedoeld in het eerste lid, wordt op een zodanig tijdstip gevraagd dat het van wezenlijke invloed kan
      zijn op het door de beheerder op te stellen beheerplan.

      4 Indien na het advies van de gerechtigden een beslissing wordt genomen ten aanzien van de onderdelen van het
      beheerplan, bedoeld in het eerste lid, worden de gerechtigden door de beheerder zo spoedig mogelijk, doch uiterlijk
      vier weken voor deze gevolg geeft aan de beslissing, schriftelijk hiervan in kennis gesteld. Indien het advies van
      de gerechtigden niet of niet geheel is gevolgd, wordt aan hen tevens meegedeeld, waarom van dat advies is afgeweken
      en wordt hen de gelegenheid geboden binnen vier weken nader te overleggen met de beheerder alvorens deze gevolg
      geeft aan de beslissing.

      5 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de termijnen die bij de
      adviesprocedure en de overlegprocedure, bedoeld in dit artikel, in acht worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel57
