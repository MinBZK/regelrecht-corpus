  - number: 26h
    text: |-
      1 Het is verboden een nieuw subsysteem dat deel uit gaat maken van de hoofdspoorweginfrastructuur in dienst te
      stellen waarvoor Onze Minister geen vergunning voor indienststelling heeft verleend.

      2 Onze Minister verleent, op aanvraag, een vergunning voor indienststelling indien:

      a. voor het subsysteem een geldige EG-keuringsverklaring is opgesteld op basis van de TSI’s en nationale
      voorschriften die gelden op het moment dat de aanvraag wordt ingediend, tenzij voor de toepassing daarvan
      ontheffing is verleend overeenkomstig [artikel 26f][ref1],

      b. het subsysteem technisch compatibel is met de systemen waarin het wordt geïntegreerd,

      c. het subsysteem veilig geïntegreerd wordt in die systemen, en

      d. voor zover van toepassing op het desbetreffende subsysteem, de procedures, bedoeld in artikel 18, vierde lid,
      onderdeel d, van de interoperabiliteitsrichtlijn zijn gevolgd.

      Een vergunning voor indienststelling kan onder beperkingen worden verleend. Aan een vergunning voor
      indienststelling kunnen voorschriften worden verbonden.

      3 De aanvraag gaat vergezeld van een dossier dat compleet is met betrekking tot de eisen, bedoeld in het tweede
      lid.

      4 Onze Minister kan, op aanvraag, met inachtneming van artikel 1 van de interoperabiliteitsrichtlijn ontheffing
      verlenen van het verbod, bedoeld in het eerste lid. Een ontheffing kan onder beperkingen worden verleend. Aan
      een ontheffing kunnen voorschriften worden verbonden. Bij ministeriële regeling kunnen regels worden gesteld
      met betrekking tot de aanvraag en verlening van een ontheffing, ter omschrijving van hoofdspoorwegen waarvoor
      ontheffing mogelijk is, met het oog op het veilig gebruik van die hoofdspoorwegen en over de procedures die bij
      verlening van een ontheffing kunnen gelden.

      5 Onze Minister kan, op aanvraag, voorafgaand aan de vergunningverlening, bedoeld in het tweede lid, ontheffing
      verlenen van het verbod, bedoeld in het eerste lid. Een ontheffing kan onder beperkingen worden verleend. Aan een
      ontheffing kunnen voorschriften worden verbonden.

      6 De conformiteit met en naleving van de op een subsysteem als bedoeld in het eerste lid toepasselijke
      voorschriften wordt tijdens het gebruik ononderbroken gewaarborgd.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel26f
    url: https://wetten.overheid.nl/BWBR0015007/2024-01-01#Artikel26h
