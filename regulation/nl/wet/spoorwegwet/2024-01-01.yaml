  - number: '32'
    text: |-
      1 Onze Minister verleent, op aanvraag, een veiligheidscertificaat aan een spoorwegonderneming met een
      exploitatiegebied dat de hoofdspoorweginfrastructuur, of een gedeelte daarvan, omvat, en zich beperkt tot
      Nederland, indien de spoorwegonderneming:

      a. een veiligheidsbeheersysteem tot stand heeft gebracht dat voldoet aan de krachtens
      [artikel 35, onderdeel a][ref1], gestelde regels, en

      b. in staat is veilig te opereren binnen het in de aanvraag omschreven exploitatiegebied.

      2 De aanvraag gaat vergezeld van een dossier dat compleet is met betrekking tot de eisen, bedoeld in het eerste
      lid.

      3 Onze Minister breidt, op aanvraag van de houder van een door Onze Minister verleend veiligheidscertificaat, het
      exploitatiegebied met betrekking tot de hoofdspoorweginfrastructuur uit van dat veiligheidscertificaat. Het eerste
      en tweede lid zijn van toepassing op een aanvraag tot uitbreiding, met dien verstande dat de beoordeling van Onze
      Minister enkel betrekking heeft op de uitbreiding.

      4 [Artikel 26dd, tweede tot en met zesde lid][ref2], is van toepassing op de besluiten, bedoeld in het eerste en
      derde lid.

      5 Een veiligheidscertificaat als bedoeld in het eerste lid geldt ook zonder uitbreiding van het exploitatiegebied
      voor spoorwegondernemingen die gebruik maken van dicht bij de grens gelegen spoorweginfrastructuur in aangrenzende
      lidstaten, indien dat volgt uit de raadpleging van de daartoe bevoegde autoriteiten in de desbetreffende lidstaten.

      6 Onze Minister verleent, op aanvraag, aan een beheerder, in afwijking van het eerste lid, een
      veiligheidscertificaat, indien hij beschikt over een op grond van [artikel 16f][ref3] verleende
      veiligheidsvergunning.

      7 Een beheerder gebruikt een op grond van het zesde lid verleend veiligheidscertificaat slechts ten behoeve van de
      uitvoering van de taken, bedoeld in [artikel 16, eerste lid][ref4].

      8 Onze Minister is bevoegd om bezoeken, audits en inspecties te verrichten bij, dan wel relevante informatie te
      verlangen van, een spoorwegonderneming in het kader van de beoordeling van een aanvraag als bedoeld in het eerste
      of derde lid.

      9 Onze Minister heeft de bevoegdheden, bedoeld in het achtste lid, eveneens indien het een beoordeling betreft van
      een bij het Europees Spoorwegbureau ingediende aanvraag van een veiligheidscertificaat of een uitbreiding daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel26dd
      [ref3]: https://wetten.overheid.nl/BWBR0015007#Artikel16f
      [ref4]: https://wetten.overheid.nl/BWBR0015007#Artikel16
