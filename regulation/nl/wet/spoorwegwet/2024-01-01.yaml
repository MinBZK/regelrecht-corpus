  - number: '2'
    text: |-
      1 Deze wet is van toepassing op de als zodanig bij koninklijk besluit aangewezen hoofdspoorwegen en op bijzondere
      spoorwegen.

      2 Een spoorweg wordt als hoofdspoorweg aangewezen, indien:

      a. de spoorweg uitsluitend of overwegend bestemd is voor het verrichten van openbaar personenvervoer of
      goederenvervoer ten behoeve van internationale, nationale of regionale verbindingen en

      b. de Staat rechthebbende is ten aanzien van de spoorweg dan wel een beheerder een recht van gebruik, huur of pacht
      heeft.

      3

      4 Een besluit op grond van het eerste lid of derde lid wordt in de Staatscourant geplaatst.
    url: https://wetten.overheid.nl/BWBR0015007/2024-01-01#Artikel2
  - number: '3'
    text: |-
      Het is een ieder verboden zich zodanig te gedragen dat gevaar op de spoorweg wordt veroorzaakt of kan worden
      veroorzaakt of dat het verkeer op de spoorweg wordt gehinderd of kan worden gehinderd.
    url: https://wetten.overheid.nl/BWBR0015007/2024-01-01#Artikel3
  - number: 3a
    text: |-
      Bij ministeriële regeling kunnen in het belang van een goede uitvoering van het bij of krachtens de
      spoorwegveiligheidsrichtlijn bepaalde regels worden gesteld met betrekking tot:

      a. maatregelen op het gebied van veiligheid en risicobeheersing die spoorwegondernemingen, beheerders, houders
      van spoorvoertuigen, met het onderhoud van spoorvoertuigen belaste entiteiten en andere actoren met een potentiële
      invloed op de veiligheid van, op en rond de spoorwegen moeten nemen,

      b. het uitwisselen van informatie met betrekking tot het uitwisselen of overdragen van spoorvoertuigen tussen
      spoorwegondernemingen.
    url: https://wetten.overheid.nl/BWBR0015007/2024-01-01#Artikel3a
  - number: '4'
    text: |-
      1 Het is een ieder verboden een veiligheidsfunctie uit te oefenen dan wel op de uitoefening van zodanige functie
      toezicht te houden terwijl hij verkeert onder zodanige invloed van een stof waarvan hij weet of redelijkerwijs moet
      vermoeden dat het gebruik daarvan, al dan niet in combinatie met een andere stof, de vaardigheid tot het uitoefenen
      van die functie of tot het houden van toezicht op de uitoefening van die functie kan verminderen, dat hij niet tot
      het behoorlijk uitoefenen van die functie of tot het behoorlijk uitoefenen van toezicht op de uitoefening van die
      functie in staat moet worden geacht.

      2 Het is een ieder verboden een veiligheidsfunctie uit te oefenen dan wel op de uitoefening van zodanige functie
      toezicht te houden na zodanig gebruik van alcoholhoudende drank dat:

      a. het alcoholgehalte van zijn adem bij een onderzoek hoger blijkt te zijn dan tweehonderdtwintig microgram alcohol
      per liter uitgeademde lucht, dan wel

      b. het alcoholgehalte van zijn bloed bij een onderzoek hoger blijkt te zijn dan een halve milligram alcohol per
      milliliter bloed.

      3 Het is verboden een veiligheidsfunctie te doen uitoefenen dan wel op de uitoefening van zodanige functie toezicht
      te doen houden door een persoon waarvan men weet of redelijkerwijs moet weten dat deze verkeert in een toestand als
      in het eerste of tweede lid is omschreven.

      4 Op de eerste vordering van bij of krachtens [artikel 86 van deze wet][ref1] of
      [artikel 141 van het Wetboek van Strafvordering][ref2] met de opsporing van strafbare feiten belaste ambtenaren
      zijn personen die een veiligheidsfunctie uitoefenen dan wel op de uitoefening van zodanige functie toezicht houden,
      of daartoe aanstalten maken, verplicht hun medewerking te verlenen aan een voorlopig onderzoek van uitgeademde
      lucht en daartoe volgens door die ambtenaar te geven aanwijzingen ademlucht te blazen in een door die ambtenaar
      aangewezen apparaat.

      5 Dit artikel is niet van toepassing voorzover [artikel 8 van de Wegenverkeerswet 1994][ref3] van toepassing is.


