  - number: '69'
    text: |-
      1 Behoudens [artikel 70, tweede lid][ref1], zijn met het toezicht op de naleving van het bepaalde bij of krachtens
      deze wet belast de bij besluit van Onze Minister daartoe aangewezen personen.

      2 Een besluit als bedoeld in het eerste lid bevat een aanduiding van de voorschriften op naleving waarvan toezicht
      wordt gehouden.

      3 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel70
    url: https://wetten.overheid.nl/BWBR0015007/2024-01-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '70'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: '70'
    text: |-
      1 De Autoriteit Consument en Markt is de toezichthoudende instantie, bedoeld in artikel 55 van richtlijn 2012/34/
      EU.

      2 De Autoriteit Consument en Markt is belast met het toezicht op de naleving van het bepaalde
      bij of krachtens de [artikelen 16a tot en met 16e][ref1], van van het bepaalde krachtens
      [artikel 17, derde lid][ref2], en het bepaalde bij of krachtens de [artikelen 27, eerste lid][ref3], [56][ref4],
      [57 tot en met 63, eerste tot en met vierde lid][ref5], [67][ref6], [68, eerste tot en met derde lid][ref7],
      [68a][ref8] en [68c][ref9],.

      3 De Autoriteit Consument en Markt stelt een redelijke termijn als bedoeld in artikel 13, vierde lid, van richtlijn
      2012/34/EU vast, die in de Staatscourant wordt bekendgemaakt.

      4 De Autoriteit Consument en Markt onderzoekt uit eigen beweging de toestand van de concurrentie op de markt
      voor spoorvervoerdiensten, met name ten aanzien van de in artikel 56, eerste lid, onderdelen a tot en met j, van
      richtlijn 2012/34/EU genoemde onderwerpen en brengt daar jaarlijks een verslag over uit aan Onze Minister.

      5 De Autoriteit Consument en Markt kan in het kader van het onderzoek, bedoeld in het vierde lid, tevens informatie
      vragen die nodig is voor het gebruik voor statistische en marktwaarnemingsdoeleinden.

      6 De Autoriteit Consument en Markt consulteert in ieder geval om de twee jaar de vertegenwoordigers van de
      gebruikers van goederen- en personenvervoerdiensten.

      7 Op verzoek van de Autoriteit Consument en Markt verstrekken de beheerder en een exploitant van een
      dienstvoorziening alle gegevens en bescheiden over de door hen aan spoorwegondernemingen in rekening gebrachte
      vergoedingen, zoals vastgesteld overeenkomstig [artikel 62, eerste tot en met achtste lid][ref10], respectievelijk
      over de vergoedingen, bedoeld in [artikel 68][ref11].

      8 Op verzoek van de Autoriteit Consument en Markt verstrekt een spoorwegonderneming of een exploitant van een
      dienstvoorziening die bij of krachtens deze wet verplicht is om een boekhoudkundige scheiding of een gescheiden
      administratie binnen de boekhouding te voeren de in bijlage VIII van richtlijn 2012/34/EU bedoelde informatie voor
      zover die informatie nodig is in het kader van de uitoefening van de taken, bedoeld in het tweede lid.

      9 Op verzoek van de Autoriteit Consument en Markt verstrekt de beheerder de informatie, bedoeld in artikel 53,
      derde lid, van [richtlijn 2012/34](32012L0034)/EU.


