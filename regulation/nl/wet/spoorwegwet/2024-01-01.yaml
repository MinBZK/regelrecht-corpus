      [artikel 26k, derde lid][ref2],

      c. uitbreiding van het gebruiksgebied als bedoeld in [artikel 26k, vierde lid][ref3],

      d. de gevallen waarin en voorwaarden waaronder een voertuigvergunning ook geldt voor dicht bij de grens gelegen
      spoorweginfrastructuur in aangrenzende lidstaten of dicht bij de grens gelegen hoofdspoorweginfrastructuur, bedoeld
      in [artikel 26k, zevende en achtste lid][ref4], alsmede de daarvoor toe te passen procedure,

      e. vernieuwing en verbetering van spoorvoertuigen als bedoeld in [artikel 26l][ref5],

      f. verlening, wijziging, intrekking en geldigheid van een voertuigvergunning als bedoeld
      in [artikel 26k, tweede lid][ref6], of typegoedkeuring van een spoorvoertuig als bedoeld in
