      Bij of krachtens algemene maatregel van bestuur worden nadere regels gegeven over de uitvoering van deze paragraaf,
      waaronder regels over:

      a. de toepassing van de in [artikel 28][ref1], eerste lid, bedoelde eisen;

      b. de verlening, weigering, wijziging, schorsing of intrekking van een bedrijfsvergunning;

      c. de aan de bedrijfsvergunning te verbinden voorschriften en beperkingen.


