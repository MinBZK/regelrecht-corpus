  - number: 27a
    text: |-
      1 Een spoorwegonderneming die een passagiersvervoersdienst naar het Verenigd Koninkrijk exploiteert, voldoet aan de
      eisen die gelden voor de beveiliging van treinen die door de Kanaaltunnel rijden.

      2 Een spoorwegonderneming informeert Onze Minister jaarlijks over de wijze waarop zij voldoet aan de eisen, bedoeld
      in het eerste lid.

      3 Bij ministeriële regeling worden de eisen, bedoeld in het eerste lid, vastgesteld en kunnen regels worden gesteld
      over de wijze waarop een spoorwegonderneming overeenkomstig het tweede lid Onze Minister informeert.
    url: https://wetten.overheid.nl/BWBR0015007/2024-01-01#Artikel27a
  - number: '28'
    text: |-
      1 Onze Minister verleent op aanvraag een bedrijfsvergunning aan een in Nederland gevestigde onderneming, indien
      deze voldoet aan de vereisten van goede naam, financiële draagkracht en beroepsbekwaamheid alsmede de uit
      [artikel 55][ref1] voortvloeiende verzekeringsplicht.

      2 Onze Minister kan voor bij of krachtens algemene maatregel van bestuur omschreven soorten van gebruik van de
      hoofdspoorweg, bij de verlening van een bedrijfsvergunning een of meer van de bij of krachtens algemene maatregel
      van bestuur aangewezen, in het eerste lid bedoelde eisen geheel of gedeeltelijk buiten toepassing laten. Alsdan is
      een zodanige beperkte bedrijfsvergunning slechts geldig voor het gebruik waarvoor deze is verleend.

      3 Onze Minister beslist binnen dertien weken op de aanvraag.

      4 Aan de vergunning kunnen voorschriften worden verbonden. De vergunning wordt verleend voor onbepaalde tijd.

      5 Onze Minister kan ambtshalve of op aanvraag van de vergunninghouder de vergunning wijzigen, alsnog voorschriften
      aan de vergunning verbinden en de aan de vergunning verbonden voorschriften aanvullen dan wel wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel55
    url: https://wetten.overheid.nl/BWBR0015007/2024-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '55'
        hoofdstuk: '3'
        paragraaf: '6'
  - number: '29'
    text: |-
      Onze Minister schorst de bedrijfsvergunning of trekt deze in, indien:

      a. de vergunninghouder niet meer voldoet aan de bij of krachtens [artikel 28][ref1] toepasselijke eisen of
      voorschriften;

      b. de veiligheid van het spoorverkeer door wijziging van de rechtspositie van de vergunninghouder ingeval van fusie
      of bedrijfsovername naar het oordeel van Onze Minister niet langer is gewaarborgd of

      c. bij herhaling bij onherroepelijk rechterlijk vonnis is vastgesteld dat de vergunninghouder of zijn bestuurders
      het bepaalde bij of krachtens deze wet dan wel de toepasselijke voorschriften inzake arbeidsomstandigheden of
      arbeidstijden hebben overtreden, dan wel bij onherroepelijk vonnis is vastgesteld dat deze het bepaalde bij of
      krachtens deze wet dan wel de toepasselijke voorschriften inzake arbeidsomstandigheden of arbeidstijden in ernstige
      mate hebben overtreden.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel28
    url: https://wetten.overheid.nl/BWBR0015007/2024-01-01#Artikel29
