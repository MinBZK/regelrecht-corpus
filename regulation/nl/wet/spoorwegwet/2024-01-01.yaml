  - number: 26e
    text: |-
      Bij ministeriële regeling kunnen in het belang van een goede uitvoering van het bij of krachtens de
      interoperabiliteitsrichtlijn bepaalde met betrekking tot de onderwerpen in deze paragraaf regels worden gesteld,
      waaronder in elk geval regels over:

      a. subsystemen die kunnen worden vrijgesteld van het verbod, bedoeld in [artikel 26c][ref1],

      b. eisen die van toepassing zijn op subsystemen,

      c. het keuren van subsystemen,

      d. het opstellen van EG-keuringsverklaringen en andere documentatieverplichtingen met betrekking tot subsystemen,

      e. het verzoeken om verificaties, bedoeld in [artikel 26c, zesde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel26c
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel26c
