  - number: '34'
    text: |-
      1 Onze Minister kan bij constatering van een ernstig veiligheidsrisico onmiddellijk tijdelijke
      veiligheidsmaatregelen nemen ten aanzien van de bij het ernstige veiligheidsrisico betrokken actoren, waaronder het
      onmiddellijk opschorten of beperken van de betrokken activiteiten van die actoren.

      2 Onze Minister schort door hem genomen tijdelijke veiligheidsmaatregelen ten aanzien van een spoorwegonderneming
      met een door het Europees Spoorwegbureau verleend veiligheidscertificaat op, indien het resultaat van een
      arbitrageprocedure als bedoeld in artikel 17, vijfde lid, van de spoorwegveiligheidsrichtlijn is dat het
      desbetreffende veiligheidscertificaat niet wordt beperkt of ingetrokken.
    url: https://wetten.overheid.nl/BWBR0015007/2024-01-01#Artikel34
  - number: '35'
    text: |-
      Bij ministeriële regeling kunnen in het belang van een goede uitvoering van het bij of krachtens de
      spoorwegveiligheidsrichtlijn bepaalde met betrekking tot de onderwerpen in deze paragraaf regels worden gesteld,
      waaronder in elk geval regels over:

      a. het veiligheidsbeheersysteem, bedoeld in [artikel 32, eerste lid, onderdeel a][ref1],

      b. de aanvraag en het bijbehorende dossier, bedoeld in [artikel 32, tweede lid][ref2],

      c. de verlening, weigering, wijziging, uitbreiding, geldigheid, schorsing of intrekking van een
      veiligheidscertificaat,

      d. de gevallen waarin en voorwaarden waaronder een veiligheidscertificaat ook geldt voor dicht bij de grens gelegen
      spoorweginfrastructuur in aangrenzende lidstaten, bedoeld in [artikel 32, vijfde lid][ref3], alsmede de daarvoor
      toe te passen procedure,

      e. door Onze Minister te stellen voorschriften en beperkingen, alsmede het nemen van maatregelen als bedoeld in de
      [artikelen 33][ref4] en [34][ref5],

      f. de eisen die gesteld worden aan een beoordelingsinstantie als bedoeld in [artikel 33a][ref6].


