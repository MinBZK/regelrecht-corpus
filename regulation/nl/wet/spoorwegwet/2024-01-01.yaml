  - number: '94'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met het oog op het veilig gebruik
      van bijzondere spoorwegen, waaronder in ieder geval regels over:

      a. technische eigenschappen van de spoorweginfrastructuur;

      b. veiligheidsvoorzieningen en -maatregelen;

      c. seingeving;

      d. opening van spoorwegbruggen;

      e. technische eigenschappen, alsmede goedkeuring en toelating tot het verkeer van spoorvoertuigen;

      f. verkeersgedrag;

      g. voorwaarden waaronder het gebruik van bijzondere spoorwegen is toegestaan; en

      h. rijvaardigheid en rijbevoegdheid.

      2 Bij algemene maatregel van bestuur kunnen categorieën van bijzondere spoorwegen worden onderscheiden.

      3 In afwijking van [artikel 2][ref1], zijn de [artikelen 1 tot en met 4][ref2], [69][ref3], [76, eerste lid][ref4],
      [77][ref5], [80][ref6], [86 tot en met 91][ref7], en [97][ref8] niet van toepassing op een categorie als bedoeld in
      het tweede lid, voor zover dit bij algemene maatregel van bestuur is bepaald.


