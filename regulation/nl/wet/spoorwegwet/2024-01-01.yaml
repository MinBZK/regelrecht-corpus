  - number: 26l
    text: |-
      Voor de vernieuwing of verbetering van een spoorvoertuig waarvoor reeds een voertuigvergunning is verleend als
      bedoeld in [artikel 26k, eerste lid][ref1], is een nieuwe voertuigvergunning vereist indien:

      a. de vernieuwing of verbetering leidt tot een substantiële verandering van de waarden van de parameters voor het
      controleren van de technische compatibiliteit van het spoorvoertuig met het gebruiksgebied op grond waarvan de
      voertuigvergunning is verleend,

      b. de vernieuwing of verbetering het algehele veiligheidsniveau van het spoorvoertuig aantast of aan kan tasten, of

      c. een TSI dat vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel26k
    url: https://wetten.overheid.nl/BWBR0015007/2024-01-01#Artikel26l
