  - number: 26dd
    text: |-
      1 Dit artikel is van toepassing op de besluiten die Onze Minister neemt op grond van:

      a. [artikel 26h, tweede lid][ref1],

      b. [artikel 26k, tweede en vierde lid][ref2],

      c. [artikel 26m, eerste lid][ref3].

      2 Onze Minister deelt uiterlijk een maand na ontvangst van de aanvraag aan de aanvrager mede of alle informatie die
      nodig is voor een goede beoordeling van de aanvraag is verstrekt.

      3 Onze Minister stelt een redelijke termijn voor het indienen van aanvullende informatie indien hij van oordeel is
      dat er onvoldoende informatie voor een goede beoordeling van de aanvraag is verstrekt.

      4 Onze Minister beslist na ontvangst van alle informatie die nodig is voor een goede beoordeling van de aanvraag,
      met inachtneming van [artikel 4:14, derde lid, van de Algemene wet bestuursrecht][ref4], uiterlijk binnen vier
      maanden.

      5 In afwijking van [artikel 6:7 van de Algemene wet bestuursrecht][ref5] wordt een bezwaarschrift tegen een besluit
      ingediend binnen een maand na de bekendmaking van het besluit.

      6 In afwijking van [artikel 7:10, eerste en derde lid, van de Algemene wet bestuursrecht][ref6] beslist
      Onze Minister op een bezwaarschrift uiterlijk binnen twee maanden, gerekend vanaf de dag na die waarop het
      bezwaarschrift is ontvangen.

      7 Bij ministeriële regeling kunnen in het belang van een goede uitvoering van bindende EU-rechtshandelingen van
      algemene strekking nadere regels worden gesteld met betrekking tot de termijnen, bedoeld in dit artikel.


