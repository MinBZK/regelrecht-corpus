  - number: 26i
    text: |-
      1 Het is verboden een vernieuwing of verbetering van de hoofdspoorweginfrastructuur in dienst te stellen zonder dat
      Onze Minister een vergunning voor indienststelling als bedoeld in [artikel 26h, tweede lid][ref1], heeft verleend,
      tenzij Onze Minister heeft geoordeeld dat voor de vernieuwing of verbetering geen vergunning voor indienststelling
      vereist is.

      2 De beoordeling, bedoeld in het eerste lid, vindt plaats:

      a. op basis van een bij Onze Minister ingediend dossier waarin het project tot verbetering of vernieuwing wordt
      beschreven, en

      b. met inachtneming van de krachtens [artikel 26j, onderdeel d][ref2], gestelde regels.

      3 De termijnen, bedoeld in [artikel 26dd, tweede tot en met vierde lid][ref3], zijn van overeenkomstige toepassing
      op de beslissing, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel26h
