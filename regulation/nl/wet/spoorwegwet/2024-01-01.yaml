        artikel: 26k
        hoofdstuk: 2a
        paragraaf: '5'
  - number: 26m
    text: |-
      1 Onze Minister verleent, op aanvraag, een typegoedkeuring voor een spoorvoertuig overeenkomstig de procedure voor
      het verlenen van voertuigvergunningen als bedoeld in [artikel 26k, tweede lid][ref1].

      2 Indien Onze Minister een voertuigvergunning als bedoeld in [artikel 26k, tweede lid][ref2], verleent, dan
      verleent Onze Minister, op verzoek van de aanvrager van de voertuigvergunning, gelijktijdig een typegoedkeuring
      voor een spoorvoertuig die geldt voor hetzelfde gebruiksgebied.

      3 Onze Minister wijzigt een typegoedkeuring voor een spoorvoertuig of trekt deze in indien de TSI’s of nationale
      voorschriften op grond waarvan de desbetreffende typegoedkeuring is verleend, zijn gewijzigd en bij die wijzigingen
      is bepaald dat reeds op basis van die voorschriften verleende typegoedkeuringen gewijzigd of ingetrokken moeten
      worden. Onze Minister voert bij de beoordeling van een wijziging van de typegoedkeuring voor een spoorvoertuig
      enkel controles uit die betrekking hebben op de overeenstemming met de gewijzigde voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel26k
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel26k
