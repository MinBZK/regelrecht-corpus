    text: |-
      1 Deze paragraaf is uitsluitend van toepassing in geval van een aanbesteding als bedoeld in
      [hoofdstuk III, paragraaf 4, van de Wet personenvervoer 2000][ref1] van een concessie voor openbaar vervoer per
      trein, indien:

      a. voor de uitvoering van die concessie sprake is van gebruik van dienstvoorzieningen of van diensten als bedoeld
      in bijlage II, punt 2, onderdelen a, f en i, van richtlijn 2012/34/EU, en

      b. een dergelijke dienstvoorziening of dienst op één locatie uitsluitend bij één exploitant aanwezig is.

      2 Onder exploitant van een dienstvoorziening wordt in deze paragraaf verstaan een exploitant die verantwoordelijk
      is voor het beheer van een of meer dienstvoorzieningen of voor het verrichten van een of meer diensten als bedoeld
      in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Paragraaf4
