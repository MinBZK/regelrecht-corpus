  - number: 122a
    text: |-
      [Artikel 26q, eerste lid, onderdeel a][ref1], is niet van toepassing op een spoorvoertuig dat:

      a. op de dag voorafgaand aan het tijdstip van inwerkingtreding van [hoofdstuk 2a][ref2] in overeenstemming met de
      op 31 december 2004 geldende voorschriften kon worden gebruikt op een hoofdspoorweg;

      b. waarvoor Onze Minister voor 19 juli 2008 een inzetcertificaat heeft verleend als bedoeld in artikel 36a, vierde
      lid, van de Spoorwegwet, zoals dat luidde op 19 juli 2008;

      c. dat voldoet aan de technische voorschriften van de Overeenkomst inzake het wederzijdse gebruik van
      personenrijtuigen en bagagewagens in het internationale verkeer (RIC) in haar laatst geldende redactie, en waarmee
      voor 19 juli 2008 van de hoofdspoorweginfrastructuur gebruik werd gemaakt, of

      d. dat voldoet aan de technische voorschriften van de Overeenkomst inzake het wederzijdse gebruik van
      goederenwagens in het internationale verkeer (RIV) in haar laatst geldende redactie, en waarmee voor 19 juli 2008
      van de hoofdspoorweginfrastructuur gebruik werd gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel26q
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Hoofdstuk2a
    url: https://wetten.overheid.nl/BWBR0015007/2024-01-01#Artikel122a
