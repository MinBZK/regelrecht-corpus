  - number: '80'
    text: |-
      1 De bestuurlijke boete die ten hoogste voor een overtreding als bedoeld in [artikel 77, eerste lid][ref1], kan
      worden opgelegd, is indien begaan door:

      a. een natuurlijke persoon, niet zijnde een onderneming, gelijk aan de geldsom van ten hoogste € 5.700,–;

      b. een onderneming, gelijk aan de geldsom van ten hoogste € 225.000,–.

      2 De hoogte van de bestuurlijke boete wordt in ieder geval afgestemd op de omzet van een onderneming indien de
      overtreder een onderneming is.

      3 Onverminderd het eerste lid en tweede lid kan de op te leggen bestuurlijke boete met 50% worden verhoogd, indien
      op de dag van het constateren van de overtreding nog geen 24 maanden zijn verstreken nadat een eerdere overtreding
      bestaande uit het niet naleven van eenzelfde wettelijke verplichting is geconstateerd en de bestuurlijke boete
      wegens de eerdere overtreding onherroepelijk is geworden.

      4 Indien de gegevens omtrent de omzet van een onderneming, bedoeld in het tweede lid, niet aan Onze Minister
      beschikbaar zijn gesteld, kan Onze Minister aan degene aan wie de bestuurlijke boete wordt opgelegd verzoeken
      deze gegevens binnen een door hem te stellen termijn te verstrekken. Indien de betrokkene niet binnen de gestelde
      termijn voldoet aan dit verzoek, is de hoogte van de boete gelijk aan het maximale boetebedrag, bedoeld in het
      eerste lid, onder b.

      5 De in het eerste lid genoemde bedragen kunnen elke twee jaar, met ingang van 1 januari van een jaar, bij algemene
      maatregel van bestuur worden gewijzigd ten gevolge van de ontwikkeling van de consumentenprijsindex sinds de
      vorige wijziging van deze bedragen. Bij deze wijziging wordt het geldbedrag op een veelvoud van € 5,– naar beneden
      afgerond.

      6 Onze Minister stelt een beleidsregel vast voor de toepassing van dit artikel.


