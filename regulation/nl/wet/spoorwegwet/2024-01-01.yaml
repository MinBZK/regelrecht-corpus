      1 Onze Minister kan een bestuurlijke boete opleggen ter zake van overtreding van de artikelen
      [26a, eerste, tweede en vierde lid][ref1], [26c][ref2], [26ca, derde lid][ref3], [26k, eerste lid][ref4],
      [26q, eerste en tweede lid][ref5], [26r, vierde lid][ref6], [26s, tiende lid][ref7], [26y][ref8],
      [26aa, derde lid, laatste volzin, en vijfde lid][ref9], [51, vierde lid][ref10], [53][ref11],
      [65, tweede lid][ref12], [74a][ref13], [96, tweede lid][ref14], en [96a][ref15], alsmede ter zake van de
      overtreding van de krachtens de [hoofdstukken 1][ref16], [2][ref17], [2a][ref18] en de [artikelen 35][ref19],
      [64, tweede lid][ref20], [65, eerste lid][ref21], [81, tweede lid][ref22], en [hoofdstuk 6, paragraaf 9][ref23]
      vastgestelde voorschriften, voor zover die overtreding daarbij uitdrukkelijk als beboetbaar feit is aangemerkt.

      2 Bij ministeriële regeling kunnen regels worden gesteld over de uitoefening van de bevoegdheid, bedoeld in het
      eerste lid.

      3 Een overtreding die krachtens het eerste lid als beboetbaar feit is aangemerkt, wordt niet tevens als strafbaar
      feit krachtens [artikel 87, eerste lid][ref24], aangemerkt.


