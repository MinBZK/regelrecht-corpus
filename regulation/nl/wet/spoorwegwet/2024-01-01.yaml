      1 Bij ministeriële regeling kunnen in het belang van een goede uitvoering van de spoorwegveiligheidsrichtlijn met
      betrekking tot de onderwerpen in deze paragraaf regels worden gesteld, waaronder in elk geval regels over:

      a. het onderhoudssysteem, bedoeld in [artikel 36, eerste lid][ref1],

      b. de eisen voor het verkrijgen van een ECM-certificaat als bedoeld in [artikel 36, vierde lid][ref2],

      c. het uitbesteden van onderhoudstaken door met het onderhoud belaste entiteiten,

      d. de eisen voor het verkrijgen van een certificaat als bedoeld in [artikel 36, zesde lid][ref3],

      e. de eisen, bedoeld in [artikel 37, tweede lid][ref4].

      2 Bij ministeriële regeling kan in het belang van een goede uitvoering van bindende EU-rechtshandelingen van
      algemene strekking van de Europese Commissie, gebaseerd op de spoorwegveiligheidsrichtlijn:

      a. de verplichting te beschikken over een ECM-certificaat, bedoeld in [artikel 36, derde lid][ref5], worden
      uitgebreid tot met het onderhoud belaste entiteiten van andere spoorvoertuigen dan goederenwagons,

      b. het beschikken over een certificaat als bedoeld in [artikel 36, zesde lid][ref6], verplicht worden gesteld voor
      rechtspersonen die delen van het onderhoudssysteem uitvoeren op basis van een daartoe strekkende overeenkomst met
      een met het onderhoud belaste entiteit.

      3 Bij ministeriële regeling kunnen met inachtneming van de artikelen 2 en 15 van de spoorwegveiligheidsrichtlijn
      spoorvoertuigen worden aangewezen waarop [artikel 36, eerste lid][ref7], of [37, eerste lid][ref8], niet
      of niet geheel van toepassing zijn en kunnen regels worden gesteld met betrekking tot het onderhoud van die
      spoorvoertuigen.


