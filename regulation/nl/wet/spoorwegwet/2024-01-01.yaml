  - number: 26p
    text: |-
      Voordat een spoorwegonderneming een spoorvoertuig gebruikt op de in de voertuigvergunning vermelde
      hoofdspoorweginfrastructuur in het gebruiksgebied, controleert de spoorwegonderneming met inachtneming van de
      krachtens [artikel 26t, onderdeel a][ref1], gestelde regels in ieder geval of:

      a. voor het spoorvoertuig een voertuigvergunning als bedoeld in [artikel 26k, eerste lid][ref2], is verleend,

      b. het spoorvoertuig in een van de registers, bedoeld in [artikel 26aa, eerste lid][ref3], is ingeschreven,

      c. het spoorvoertuig compatibel is met de te berijden hoofdspoorweginfrastructuur, en

      d. het spoorvoertuig correct is geïntegreerd in de samenstelling waarin het bedoeld is te functioneren.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel26t
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel26k
      [ref3]: https://wetten.overheid.nl/BWBR0015007#Artikel26aa
