  - number: 33a
    text: |-
      1 Onze Minister besluit, op aanvraag, tot aanmelding bij het Europees Spoorwegbureau van een of meer
      beoordelingsinstanties die voldoen aan de in [artikel 35, onder f][ref1], gestelde regels.

      2 Een besluit tot aanmelding kan onder beperkingen geschieden. Aan een aanmelding kunnen voorschriften worden
      verbonden.

      3 Een aangemelde beoordelingsinstantie is bevoegd om conformiteitsbeoordelingen uit te voeren ten aanzien van
      interoperabiliteitsonderdelen, subsystemen, spoorvoertuigen en andere producten, bestemd om deel uit te maken van
      het spoorwegsysteem, voor zover die conformiteitsbeoordelingen betrekking hebben op uitvoeringsverordening (EU)
      402/2013.

      4 Onze Minister kan bij ministeriële regeling de nationale accreditatie-instantie aanwijzen om de aanvragen,
      bedoeld in het eerste lid, te beoordelen en om controles uit te voeren op de aangemelde beoordelingsinstanties.

      5 De [Kaderwet zelfstandige bestuursorganen][ref2] is niet van toepassing op beoordelingsinstanties die op grond
      van het eerste lid zijn aangemeld.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0020495
