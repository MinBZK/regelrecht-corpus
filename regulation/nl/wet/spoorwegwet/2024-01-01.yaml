    text: Een beheerder legt een activaregister aan dat voldoet aan artikel 30, zevende lid, van richtlijn 2012/34/EU.
    url: https://wetten.overheid.nl/BWBR0015007/2024-01-01#Artikel16g
  - number: '17'
    text: |-
      1 Aan de concessie worden in elk geval voorschriften verbonden om te waarborgen dat:

      a. de hoofdspoorweginfrastructuur in goede staat verkeert en geschikt is voor het verkeer of ander gebruik waarvoor
      zij bestemd is;

      b. de hoofdspoorweginfrastructuur veilig en doelmatig bereden kan worden zonder overmatige slijtage aan
      spoorvoertuigen;

      c. de risico's van het gebruik en beheer voor de veiligheid van de hoofdspoorweginfrastructuur worden geanalyseerd
      en dat passende maatregelen worden genomen, waaronder het zo nodig buiten dienst stellen van een gedeelte van de
      hoofdspoorweg, om deze risico's afdoende te beheersen, waarbij rekening wordt gehouden met de specifieke vereisten
      van de te verwachten bedrijfsvoering en de stand der techniek;

      d. de beheerder financieel draagkrachtig en beroepsbekwaam is.

      De voorschriften, bedoeld in de onderdelen a tot en met d, kunnen betrekking hebben op door de beheerder op grond
      van de concessie te leveren prestaties.

      2 Aan de concessie worden voorts in elk geval voorschriften verbonden ten aanzien van:

      a. door de beheerder te berekenen tarieven voor diensten aan derden;

      b. het verstrekken van gegevens aan Onze Minister ten behoeve van:

      1°. het toezicht op de naleving van de concessie;

      2°. het voldoen aan de verplichtingen die Onze Minister met betrekking tot de hoofdspoorwegen heeft ingevolge de
      [artikelen 11.6][ref1] en [11.11 van de Wet milieubeheer][ref2] ter uitvoering van richtlijn nr. 2002/49/EG van
      het Europees Parlement en de Raad van de Europese Unie van 25 juni 2002 inzake de evaluatie en de beheersing van
      omgevingslawaai (PbEG L 189);

      3°. het voldoen aan de verplichtingen die Onze Minister met betrekking tot de hoofdspoorwegen heeft ingevolge
      [artikel 20.10, eerste lid, aanhef en onder b, van de Omgevingswet][ref3];

      c. het opstellen van een financiële verantwoording van het uitvoeren van de concessie, welke verantwoording
      gescheiden is van die voor andere werkzaamheden, en

      d. wijzigingen van hoofdspoorweginfrastructuur die de beheerder aanbesteedt en als een verbetering of vernieuwing
      als bedoeld in [artikel 26i, eerste lid][ref4], worden aangemerkt.

      3 Aan de concessie worden voorschriften verbonden om te waarborgen dat:

      a. bij een storing van het treinverkeer spoorwegondernemingen die hierdoor worden getroffen van de verkeersleiding
      volledig en tijdig de relevante informatie krijgen met betrekking tot het leiden van het verkeer, bedoeld in
      artikel 16, eerste lid, onderdeel c;

      b. bij het verlenen van verdere toegang tot het proces van verkeersleiding voor de betrokken spoorwegondernemingen
      plaatsvindt op transparante en niet-discriminerende wijze;

      c. voor de langetermijnplanning van een groot onderhoud of een grote vernieuwing van de hoofdspoorweginfrastructuur
      de aanvragers van capaciteit worden geraadpleegd, zoveel mogelijk rekening wordt gehouden met de door hen geuite
      punten van zorg en de onderhoudswerken op niet-discriminerende wijze worden gepland;

      d. aan de artikelen 7 ter, tweede en derde lid, 7 sexies en 54, eerste lid, derde en vierde volzin, van [richtlijn
      2012/34](32012L0034)/EU en ook overigens aan die richtlijn wordt voldaan.

      4 Aan een concessie kan het voorschrift worden verbonden dat de beheerder, indien hij tekortschiet in het
      verrichten van een bepaalde prestatie, gehouden is een geldsom te voldoen aan Onze Minister.

      5 Indien toepassing is gegeven aan het vierde lid is de concessieverlener niet bevoegd ten aanzien van het
      verrichten van de desbetreffende prestatie aan de concessiehouder een last onder dwangsom op te leggen.
      [Artikel 5:32, eerste lid, van de Algemene wet bestuursrecht][ref5] is niet van toepassing.

      6 Onze Minister kan aan de beheerder een bijzondere volmacht verlenen tot het verrichten van een privaatrechtelijke
      rechtshandeling als bedoeld in [artikel 4.6, eerste lid, van de Comptabiliteitswet 2016][ref6] met betrekking tot
      hoofdspoorweginfrastructuur die aan de staat toebehoort.


