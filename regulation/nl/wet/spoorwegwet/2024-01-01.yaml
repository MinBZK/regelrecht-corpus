preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het gelet op richtlijnen 91/440/EEG, 95/18/EG, 96/48/EG, 2001/12/EG,
    2001/13/EG, 2001/14/EG en 2001/16/EG en mede gelet op het belang van de bescherming van het milieu noodzakelijk
    is wettelijke bepalingen vast te stellen inzake de aanleg, het beheer en het gebruik van spoorwegen en dat het
    ter bevordering van een maatschappelijk gewenste benutting van spoorwegen wenselijk is, de verantwoordelijkheid
    van de overheid voor de aanleg van spoorweginfrastructuur vast te leggen, de verantwoordelijkheid voor
    vervoer en spoorweginfrastructuur te scheiden en de publieke belangen die gemoeid zijn met het beheer van
    spoorweginfrastructuur te verzekeren door de invoering van een concessiestelsel voor het beheer, het gebruik van
    spoorwegen te bevorderen door het stellen van transparante en niet-discriminerende voorschriften en dat het voorts
    wenselijk is de wetgeving inzake de spoorwegen overigens te moderniseren;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0015007/2024-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *aangemelde instantie:* conformiteitsbeoordelingsinstantie die overeenkomstig artikel 37 van de
      interoperabiliteitsrichtlijn bij de Europese Commissie en de lidstaten is aangemeld;
        - *aangewezen instantie:* conformiteitsbeoordelingsinstantie die op grond van [artikel 26v, eerste lid][ref1], door
      Onze Minister is aangewezen;
        - *Autoriteit Consument en Markt:* de Autoriteit Consument en Markt, genoemd in
      [artikel 2, eerste lid, van de Instellingswet Autoriteit Consument en Markt][ref2];
        - *beheer:* uitvoeren van de taken, bedoeld in [artikel 16, eerste lid][ref3];
        - *beheerder:* houder van een concessie als bedoeld in [artikel 16, eerste lid][ref4];
        - *beoordelingsinstantie:* beoordelingsinstantie als bedoeld in artikel 3, onderdeel 14, van uitvoeringsverordening
      (EU) 402/2013;
        - *bevoegdheidsbewijs:* bevoegdheidsbewijs als bedoeld in artikel 3, onderdeel j, van richtlijn 2007/59/EG;
        - *bijzondere spoorweg:* spoorweg die niet is aangewezen als lokale spoorweg op grond van
      [artikel 2, tweede lid, van de Wet lokaal spoor][ref5], en niet als hoofdspoorweg op grond van [artikel 2][ref6]
      van deze wet;
        - *capaciteit:* capaciteit van de hoofdspoorweginfrastructuur;
        - *conformiteitsbeoordelingsinstantie:* conformiteitsbeoordelingsinstantie als bedoeld in artikel 2, onderdeel 42,
      van de interoperabiliteitsrichtlijn;
        - *dienstvoorziening:* dienstvoorziening als bedoeld in artikel 3, onderdeel 11, van richtlijn 2012/34/EU;
        - *ECM-certificaat:* ECM-certificaat als bedoeld in artikel 14 van de spoorwegveiligheidsrichtlijn;
        - *essentiële eisen:* essentiële eisen als bedoeld in artikel 2, onderdeel 9, van de interoperabiliteitsrichtlijn;
        - *essentiële functies:* essentiële functies als bedoeld in artikel 3, onderdeel 2 septies, van [richtlijn 2012/34]
      (32012L0034)/EU;
        - *Europees Spoorwegbureau:* het Spoorwegbureau van de Europese Unie, bedoeld in de spoorwegbureauverordening;
        - *exploitant van een dienstvoorziening:* exploitant van een dienstvoorziening als bedoeld in artikel 3, onderdeel
      12, van richtlijn 2012/34/EU;
        - *exploitatiegebied:* exploitatiegebied als bedoeld in artikel 3, onderdeel 33, van de
      spoorwegveiligheidsrichtlijn;
        - *gebruiksgebied:* gebruiksgebied van een voertuig als bedoeld in artikel 2, onderdeel 32, van de
      interoperabiliteitsrichtlijn;
        - *gebruik van een hoofdspoorweg:* het met een spoorvoertuig rijden over of stilstaan op een hoofdspoorweg;
        - *geharmoniseerde norm:* geharmoniseerde norm als bedoeld in artikel 2, onderdeel 24, van de
      interoperabiliteitsrichtlijn;
        - *gerechtigde:* gerechtigde als bedoeld in [artikel 57][ref7];
        - *hoofdspoorweg:* op grond van [artikel 2][ref8] als hoofdspoorweg aangewezen spoorweg;
        - *hoofdspoorweginfrastructuur:* spoorweginfrastructuur, waarbij de spoorwegen als hoofdspoorwegen zijn aangewezen;
        - *houder van het spoorvoertuig:* de persoon of entiteit die eigenaar is van een spoorvoertuig of het
      recht heeft het te gebruiken, het exploiteert als vervoermiddel en als houder in het register, bedoeld in
      [artikel 26aa, eerste lid][ref9], is ingeschreven;
        - *in de handel brengen:* in de handel brengen als bedoeld in artikel 2, onderdeel 35, van de
      interoperabiliteitsrichtlijn;
        - *internationale passagiersvervoerdienst:* internationale passagiersvervoerdienst als bedoeld in artikel 3,
      onderdeel 5, van richtlijn 2012/34/EU;
        - *interoperabiliteitsonderdeel:* interoperabiliteitsonderdeel als bedoeld in artikel 2, onderdeel 7, van de
      interoperabiliteitsrichtlijn;
        - *kaderovereenkomst:* kaderovereenkomst als bedoeld in artikel 42 van richtlijn 2012/34/EU;
        - *lidstaat:* lidstaat van de Europese Unie of een andere staat die partij is bij de Overeenkomst betreffende de
      Europese Economische Ruimte;
        - *machinistenvergunning:* vergunning als bedoeld in artikel 4 van richtlijn 2007/59/EG;
        - *minimumtoegangspakket:* het minimumtoegangspakket, bedoeld in bijlage II, punt 1, bij richtlijn 2012/34/EU;
        - *netverklaring:* netverklaring als bedoeld in artikel 27 van richtlijn 2012/34/EU;
        - *Onze Minister:* Onze Minister van Infrastructuur en Milieu;
        - *raad van bestuur:* raad van bestuur als bedoeld in artikel 3, onderdeel 33, van [richtlijn 2012/34](32012L0034)/
      EU;
        - *raad van commissarissen:* raad van toezicht als bedoeld in artikel 3, onderdeel 34, van [richtlijn 2012/34]
      (32012L0034)/EU;
        - *rechthebbende:* eigenaar, bezitter of degene die een recht van erfpacht, opstal, vruchtgebruik, gebruik, huur of
      pacht heeft;
        - *spoorvoertuig:* voertuig, bestemd voor het verkeer over spoorwegen;
        - *spoorweg:* weg bestemd voor verkeer over spoorstaven of geleiderails;
        - *spoorweginfrastructuur:* spoorwegen en de daarvan deel uitmakende elementen van spoorweginfrastructuur als
      bedoeld in bijlage I bij richtlijn 2012/34/EU;
        - *spoorwegonderneming:* spoorwegonderneming als bedoeld in artikel 3, onderdeel 1, van richtlijn 2012/34/EU,
      alsmede iedere andere onderneming die gebruik maakt of beoogt te maken van de spoorweg en daarvoor de beschikking
      heeft over tractie;
        - *subsysteem:* subsysteem dat overeen komt met een gebied van structurele aard als bedoeld in bijlage II van de
      interoperabiliteitsrichtlijn;
        - *toegangsovereenkomst:* toegangsovereenkomst als bedoeld in [artikel 59][ref10];
        - *TSI:* technische specificatie inzake interoperabiliteit als bedoeld in artikel 2, onderdeel 11, van de
      interoperabiliteitsrichtlijn;
        - *veiligheidsfunctie:* functie van bestuurder van een spoorvoertuig of een andere, bij algemene maatregel van
      bestuur omschreven, functie binnen het spoorwegverkeerssysteem die van aanmerkelijke invloed is op de veiligheid
      van het spoorverkeer;
        - *verbetering:* verbetering als bedoeld in artikel 2, onderdeel 14, van de interoperabiliteitsrichtlijn;
        - *vernieuwing:* vernieuwing als bedoeld in artikel 2, onderdeel 15, van de interoperabiliteitsrichtlijn;
        - *voertuigvergunning:* vergunning om een voertuig in de handel te brengen als bedoeld in artikel 21 van de
      interoperabiliteitsrichtlijn.

      2 In deze wet en de daarop berustende bepalingen wordt voorts verstaan onder:

        - *richtlijn 2007/59/EG:* richtlijn nr. 2007/59/EG van het Europees parlement en de Raad van de Europese Unie van
      23 oktober 2007 inzake de certificering van machinisten die locomotieven en treinen op het spoorwegsysteem van de
      Gemeenschap besturen (PbEU L 315/51);
        - *richtlijn 2012/34/EU:* richtlijn 2012/34/EU van het Europees parlement en de Raad van 21 november 2012 tot
      instelling van één Europese spoorwegruimte (PbEU 2012, L 343/32);
        - *spoorwegbureauverordening:* verordening (EU) 2016/796 van het Europees Parlement en de Raad van 11 mei 2016
      betreffende het Spoorwegbureau van de Europese Unie en tot intrekking van Verordening (EG) nr. 881/2004 (PbEU 2016,
      L 138);
        - *interoperabiliteitsrichtlijn:* richtlijn (EU) 2016/797 van het Europees Parlement en de Raad van 11 mei 2016
      betreffende de interoperabiliteit van het spoorwegsysteem in de Europese Unie (PbEU 2016, L 138);
        - *spoorwegveiligheidsrichtlijn:* richtlijn (EU) 2016/798 van het Europees Parlement en de Raad van 11 mei 2016
      inzake veiligheid op het spoor (PbEU 2016, L 138);
        - *uitvoeringsverordening (EU) 402/2013:* uitvoeringsverordening (EU) 402/2013 van de Commissie van 30 april 2013
      betreffende de gemeenschappelijke veiligheidsmethode voor risico-evaluatie en -beoordeling en tot intrekking van
      [Verordening (EG) 352/2009](32009R0352) (PbEU 2013, L 121).


