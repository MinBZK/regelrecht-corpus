  - number: '96'
    text: |-
      1 Voor zover het hoofdspoorwegen betreft, zijn spoorwegondernemingen en een beheerder verplicht Onze Minister
      mondeling, schriftelijk of op andere wijze – dit ter keuze van Onze Minister na overleg met de betrokken
      spoorwegonderneming of betrokken beheerder – alle bij hen berustende gegevens te verstrekken en inzage te geven
      van boeken en bescheiden die betrekking hebben op het gebruik of beheer van spoorwegen en het vervoer daarover,
      voorzover Onze Minister dat redelijkerwijs voor de vervulling van zijn taak nodig heeft.

      2 Het eerste lid is van overeenkomstige toepassing op eenieder, voor zover Onze Minister de bij diegene
      berustende informatie redelijkerwijs nodig heeft voor de vervulling van de bij of krachtens deze wet aan hem
      toegekende taken in het belang van een goede uitvoering van het bij of krachtens de spoorwegbureauverordening,
      interoperabiliteitsrichtlijn of spoorwegveiligheidsrichtlijn gestelde.

      3 Degene van wie krachtens het eerste of tweede lid gegevens worden verlangd, is op de door Onze Minister aan te
      geven wijze en binnen de door hem te bepalen termijn verplicht deze volledig en naar waarheid te verstrekken en
      degene van wie inzage wordt verlangd is verplicht deze ongestoord te verlenen.

      4 Onze Minister gebruikt gegevens of inlichtingen omtrent een spoorwegonderneming die hij heeft verkregen
      in verband met enige werkzaamheid ten behoeve van de uitvoering van een van zijn taken, uitsluitend voor de
      uitvoering van die taak of voor een goede uitvoering van het bij of krachtens de spoorwegbureauverordening,
      interoperabiliteitsrichtlijn of spoorwegveiligheidsrichtlijn bepaalde.
    url: https://wetten.overheid.nl/BWBR0015007/2024-01-01#Artikel96
  - number: 96a
    text: |-
      1 Een betrokkene als bedoeld in artikel 15, derde lid, van richtlijn 2012/34/EU verstrekt desgevraagd aan Onze
      Minister binnen de door hem te bepalen termijn de gegevens en inlichtingen die hij nodig heeft om te kunnen voldoen
      aan een verzoek van de Europese Commissie om informatie over het gebruik van de spoorwegnetten en de ontwikkeling
      van de kadervoorwaarden in de spoorwegsector als bedoeld in artikel 15, derde en vierde lid, van richtlijn 2012/34/
      EU.

      2 Bij regeling van Onze Minister kunnen nadere regels worden gesteld over de in het eerste lid bedoelde
      onderwerpen.
    url: https://wetten.overheid.nl/BWBR0015007/2024-01-01#Artikel96a
  - number: '97'
    text: |-
      Voorzover dit noodzakelijk is ter beoordeling van het voldoen aan de bij of krachtens deze wet gestelde
      voorschriften kunnen gegevens betreffende het gedrag van bestuurders, het gedrag van een vergunninghouder en de
      gezondheid van personeel worden verwerkt. Onze Minister is verwerkingsverantwoordelijke voor de verwerking van
      de gegevens.
    url: https://wetten.overheid.nl/BWBR0015007/2024-01-01#Artikel97
