  - number: 26f
    text: |-
      1 Onze Minister kan, op aanvraag, met inachtneming van artikel 7 van de interoperabiliteitsrichtlijn ontheffing
      verlenen van de toepassing van een of meerdere TSI’s of delen daarvan op een subsysteem. Een ontheffing kan onder
      beperkingen worden verleend. Aan een ontheffing kunnen voorschriften worden verbonden.

      2 Onze Minister kan, op aanvraag, ontheffing verlenen van de toepassing van nationale voorschriften op een
      subsysteem. Een ontheffing kan onder beperkingen worden verleend. Aan een ontheffing kunnen voorschriften worden
      verbonden. Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot een ontheffing als bedoeld in
      de eerste volzin. De regels kunnen betrekking hebben op de aanvraag en verlening van een ontheffing, alsmede de aan
      een ontheffing te verbinden voorschriften.

      3 Indien Onze Minister ontheffing als bedoeld in het eerste lid verleent voor een subsysteem waarvoor een
      vergunning voor indienststelling als bedoeld in [artikel 26h, tweede lid][ref1], of een subsysteem dat deel
      uitmaakt van een spoorvoertuig waarvoor een voertuigvergunning als bedoeld in [artikel 26k, tweede lid][ref2],
      wordt aangevraagd, verleent hij, in afwijking van [artikel 26dd, vierde lid][ref3], de desbetreffende vergunning
      niet voordat de procedure, beschreven in artikel 7 van de interoperabiliteitsrichtlijn, is toegepast.

      4 De termijnen, bedoeld in [artikel 26dd, vijfde en zesde lid][ref4], zijn van toepassing op ontheffingen als
      bedoeld in het eerste en tweede lid.


