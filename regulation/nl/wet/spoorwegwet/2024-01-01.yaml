  - number: 51a
    text: |-
      1 Onze Minister verleent op aanvraag een machinistenvergunning indien de machinist:

      a. voldoet aan de krachtens [artikel 49, tweede lid][ref1], vastgestelde eisen inzake minimumleeftijd;

      b. beschikt over een geldige verklaring van medische geschiktheid en een geldige verklaring van psychologische
      geschiktheid als bedoeld in [artikel 50, tweede lid, onderdeel a][ref2], en

      c. beschikt over een geldige beoordeling van Onze Minister waaruit blijkt dat hij voldoet aan de krachtens
      [artikel 49, tweede lid][ref3], vastgestelde eisen inzake algemene kennis en vaardigheden voor de
      veiligheidsfunctie van machinist met volledige bevoegdheid respectievelijk van machinist met beperkte bevoegdheid.

      2 Onze Minister schorst of trekt de machinistenvergunning in, indien de machinist niet langer beschikt over een
      geldige verklaring van medische geschiktheid of een geldige verklaring van psychologische geschiktheid.

      3 Onze Minister houdt een register van machinistenvergunningen.

      4 Degene onder wiens gezag de veiligheidsfunctie van machinist met volledige bevoegdheid of van machinist met
      beperkte bevoegdheid wordt uitgeoefend, verstrekt aan een machinist een bevoegdheidsbewijs indien deze:

      a. voldoet aan de krachtens [artikel 49, tweede lid][ref4], vastgestelde eisen inzake taalbeheersing;

      b. beschikt over een geldige beoordeling van degene onder wiens gezag de veiligheidsfunctie, bedoeld in de
      aanhef, wordt uitgeoefend waaruit blijkt dat hij voldoet aan de krachtens [artikel 49, tweede lid][ref5],
      vastgestelde eisen inzake specifieke vakkennis van de spoorvoertuigen en de hoofdspoorweginfrastructuur waarop het
      bevoegdheidsbewijs betrekking moet hebben, en

      c. beschikt over de voor de uitoefening van die functie vereiste bedrijfsgebonden kennis en bekwaamheid.

      5 Degene die een of meer bevoegdheidsbewijzen heeft verstrekt houdt een register van bevoegdheidsbewijzen.

      6 Degene onder wiens gezag de veiligheidsfunctie van machinist met volledige bevoegdheid of van machinist met
      beperkte bevoegdheid wordt uitgeoefend onderzoekt periodiek of de machinist voldoet aan:

      a. de voor die veiligheidsfunctie krachtens [artikel 49, tweede lid][ref6], vastgestelde eisen inzake
      taalbeheersing;

      b. de krachtens artikel 49, tweede lid, vastgestelde eisen inzake de specifieke vakkennis inzake de spoorvoertuigen
      en de hoofdspoorweginfrastructuur waarop het bevoegdheidsbewijs betrekking heeft, en

      c. aan de voor die veiligheidsfunctie vereiste bedrijfsgebonden kennis en bekwaamheid.

      7 Degene onder wiens gezag de veiligheidsfunctie van machinist wordt uitgeoefend verstrekt bij de beëindiging van
      het dienstverband van de machinist een gewaarmerkte kopie van het op dat moment geldige bevoegdheidsbewijs.

      8 Bij of krachtens algemene maatregel van bestuur worden regels gegeven voor:

      a. de aanvraag, verlening, geldigheidsduur en verlenging van een machinistenvergunning;

      b. de verstrekking van een duplicaat van een machinistenvergunning;

      c. het register van machinistenvergunningen, bedoeld in het derde lid;

      d. de vorm, inhoud en geldigheidsduur van een bevoegdheidsbewijs en de verstrekking van een gewaarmerkte kopie
      daarvan;

      e. het register van bevoegdheidsbewijzen, bedoeld in vijfde lid;

      f. de frequentie van het onderzoek, bedoeld in het zesde lid;

      g. de verplichtingen van degene die de bevoegdheidsbewijzen heeft verstrekt, en

      h. de voor de veiligheidsfunctie van machinist met volledige bevoegdheid en van machinist met beperkte bevoegdheid
      vereiste bedrijfsgebonden kennis en bekwaamheid.


