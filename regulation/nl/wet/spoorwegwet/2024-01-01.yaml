  - number: 26s
    text: |-
      1 Indien een spoorwegonderneming vaststelt dat een spoorvoertuig waarmee zij van de hoofdspoorweginfrastructuur
      gebruik maakt niet aan een van de essentiële eisen voldoet, neemt zij de noodzakelijke corrigerende maatregelen
      om het voertuig en, in voorkomend geval, de spoorvoertuigen van hetzelfde type met de essentiële eisen in
      overeenstemming te brengen. Zij kan Onze Minister, het Europees Spoorwegbureau en de betrokken nationale
      veiligheidsinstanties in de andere lidstaten in kennis stellen van de door haar genomen maatregelen.

      2 Indien een spoorwegonderneming over aanwijzingen beschikt waaruit blijkt dat een spoorvoertuig als bedoeld in het
      eerste lid, reeds ten tijde van de verlening van de voertuigvergunning niet aan de essentiële eisen voldeed, dan
      stelt zij Onze Minister, het Europees Spoorwegbureau en de betrokken nationale veiligheidsinstanties in de andere
      lidstaten daarvan in kennis.

      3 Indien Onze Minister vaststelt dat een spoorvoertuig of type spoorvoertuig bij gebruik op de bedoelde wijze niet
      voldoet aan de essentiële eisen, dan stelt hij de spoorwegonderneming die het spoorvoertuig of type spoorvoertuig
      gebruikt daarvan in kennis en verzoekt de spoorwegonderneming de noodzakelijke corrigerende maatregelen te nemen om
      het spoorvoertuig of de spoorvoertuigen van hetzelfde type in overeenstemming te brengen met de essentiële eisen.

      4 Indien het nemen van de maatregelen, bedoeld in het eerste en derde lid, niet tot conformiteit met de essentiële
      eisen leidt en de non-conformiteit een ernstig veiligheidsrisico vormt, kan Onze Minister in ieder geval:

      a. tijdelijke veiligheidsmaatregelen als bedoeld in [artikel 34][ref1] nemen,

      b. een door hem verleende typegoedkeuring voor het desbetreffende spoorvoertuig schorsen.

      5 Indien de maatregelen die zijn genomen om het ernstige veiligheidsrisico weg te nemen onvoldoende effectief
      blijken en er bewijs wordt geleverd dat reeds ten tijde van de verlening van de voertuigvergunning of
      de typegoedkeuring niet werd voldaan aan de essentiële eisen, kan Onze Minister een door hem verleende
      voertuigvergunning of typegoedkeuring voor een spoorvoertuig intrekken of wijzigen. Indien het niet voldoen aan
      de essentiële eisen slechts beperkt blijft tot een gedeelte van de hoofdspoorweginfrastructuur, dan wijzigt Onze
      Minister de door hem verleende voertuigvergunning of typegoedkeuring voor het spoorvoertuig door slechts het
      desbetreffende gedeelte van de hoofdspoorweginfrastructuur van het gebruiksgebied uit te sluiten.

      6 In afwijking van [artikel 6:7 van de Algemene wet bestuursrecht][ref2] wordt een bezwaarschrift tegen een
      wijziging of intrekking van een voertuigvergunning of typegoedkeuring als bedoeld in het vijfde lid ingediend
      binnen een maand na de bekendmaking van het besluit.

      7 In afwijking van [artikel 7:10, eerste en derde lid, van de Algemene wet bestuursrecht][ref3] beslist Onze
      Minister op het bezwaarschrift, bedoeld in het zesde lid, uiterlijk binnen een maand, gerekend vanaf de dag na
      die waarop het bezwaarschrift is ingediend. Het indienen van een bezwaarschrift schorst het besluit waartegen het
      gericht is.

      8 In afwijking van [artikel 6:7 van de Algemene wet bestuursrecht][ref4] wordt een beroepschrift tegen een
      beslissing op een bezwaarschrift als bedoeld in het zevende lid ingediend binnen twee maanden na de bekendmaking
      van de beslissing op bezwaar.

      9 Onze Minister stelt spoorwegondernemingen die gebruik maken van spoorvoertuigen van hetzelfde type als het
      spoorvoertuig waarvan de voertuigvergunning of typegoedkeuring voor het spoorvoertuig is ingetrokken in kennis
      van die intrekking. Deze spoorwegondernemingen controleren onverwijld of het niet voldoen aan de essentiële eisen
      zich ook voordoet bij de desbetreffende spoorvoertuigen van hetzelfde type en informeren Onze Minister over hun
      bevindingen en genomen maatregelen. Op deze spoorwegondernemingen is de procedure van dit artikel van toepassing.

      10 Het is verboden een spoorvoertuig in de handel te brengen of in de handel te houden dat op basis van een
      ingetrokken typegoedkeuring van een spoorvoertuig is gebouwd. Indien voor de desbetreffende spoorvoertuigen reeds
      een voertuigvergunning is verleend met toepassing van [artikel 26n][ref5], dan vervalt die voertuigvergunning van
      rechtswege.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel67
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel710
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel67
      [ref5]: https://wetten.overheid.nl/BWBR0015007#Artikel26n
    url: https://wetten.overheid.nl/BWBR0015007/2024-01-01#Artikel26s
