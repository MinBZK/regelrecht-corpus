  - number: 26t
    text: |-
      Bij ministeriële regeling kunnen in het belang van een goede uitvoering van het bij of krachtens de
      interoperabiliteitsrichtlijn bepaalde met betrekking tot de onderwerpen in deze paragraaf regels worden gesteld,
      waaronder in elk geval regels over:

      a. de controles, bedoeld in [artikel 26p][ref1],

      b. de verlening en weigering van een ontheffing of vrijstelling als bedoeld in [artikel 26q, vierde lid][ref2],

      c. het testen van spoorvoertuigen op de hoofdspoorweginfrastructuur, bedoeld in [artikel 26r][ref3],

      d. de maatregelen die Onze Minister op grond van [artikel 26s][ref4] kan nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel26p
