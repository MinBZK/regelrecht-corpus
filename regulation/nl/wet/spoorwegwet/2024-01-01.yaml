  - number: 51b
    text: |-
      1 Opleidingactiviteiten met het oog op het verkrijgen van een of meer beoordelingen waaruit blijkt dat voldaan
      wordt aan de krachtens [artikel 49, tweede lid][ref1], vastgestelde eisen inzake algemene kennis en vaardigheden
      en specifieke vakkennis inzake de spoorvoertuigen en de hoofdspoorweginfrastructuur worden slechts verricht door
      daartoe door Onze Minister erkende opleidingsinstituten.

      2 Een krachtens het eerste lid, erkend opleidingsinstituut geeft op billijke en non-discriminatoire wijze toegang
      tot de opleidingsactiviteiten, bedoeld in het eerste lid.

      3 Bij of krachtens algemene maatregel van bestuur worden met inachtneming van artikel 20 van richtlijn 2007/59/EG
      regels gegeven voor de erkenning van de opleidingsinstituten, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel49
