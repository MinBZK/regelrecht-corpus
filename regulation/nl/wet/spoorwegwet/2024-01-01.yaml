  - number: 26z
    text: |-
      Bij ministeriële regeling kunnen in het belang van een goede uitvoering van het bij of krachtens de
      interoperabiliteitsrichtlijn bepaalde met betrekking tot de onderwerpen in deze paragraaf regels worden gesteld,
      waaronder in elk geval regels over:

      a. eisen om te worden aangemeld als bedoeld in [artikel 26u, eerste lid][ref1], of aangewezen als bedoeld in
      [artikel 26v, eerste lid][ref2],

      b. de aanvraag, de procedure en de beoordeling van een aanvraag om aanmelding als bedoeld in
      [artikel 26u, eerste lid][ref3], of aanwijzing als bedoeld in [artikel 26v, eerste lid][ref4],

      c. de uitvoering van conformiteitsbeoordelingen en andere operationele verplichtingen van aangemelde of aangewezen
      instanties, bedoeld in [artikel 26w, eerste lid][ref5],

      d. de verstrekking van documenten, gegevens en andere informatie door aangemelde of aangewezen instanties, bedoeld
      in [artikel 26w, tweede lid][ref6],

      e. de voorwaarden waaronder en wijze waarop een aangemelde of aangewezen instantie haar taken kan uitbesteden of
      kan laten uitvoeren door een dochteronderneming, bedoeld in [artikel 26w, derde lid][ref7],

      f. de overdracht van dossiers, bedoeld in [artikel 26x, tweede lid][ref8],

      g. de activiteiten waarvoor, voorwaarden waaronder en wijze waarop een geaccrediteerde interne instantie als
      bedoeld in [artikel 26y][ref9] conformiteitsbeoordelingsactiviteiten kan uitvoeren.


