  - number: 26cc
    text: |-
      Bij ministeriële regeling kunnen in het belang van een goede uitvoering van het bij of krachtens de
      interoperabiliteitsrichtlijn bepaalde met betrekking tot de onderwerpen in deze paragraaf regels worden gesteld,
      waaronder in elk geval regels over:

      a. informatie die wordt opgenomen in het door Onze Minister gehouden voertuigregister,

      b. de aanvraag, wijziging en schrapping van een inschrijving in het door Onze Minister gehouden voertuigregister,

      c. het Europees voertuignummer, bedoeld in [artikel 26aa, derde lid][ref1],

      d. het register, bedoeld in [artikel 26bb][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel26aa
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel26bb
