    text: |-
      1 Een besluit tot verlening of wijziging van een concessie kan worden genomen indien de beheerder niet binnen vier
      dagen na de dag waarop het voorgenomen besluit aan hem is bekendgemaakt aan de concessieverlener heeft doen blijken
      dat hij de concessie niet zonder voorbehoud aanvaardt.

      2 Indien een besluit tot verlening of wijziging van een concessie met inachtneming van het eerste lid is genomen,
      wordt van dit besluit binnen vier weken na de dag van bekendmaking van het voorgenomen besluit, bedoeld in het
      eerste lid, mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0015007/2024-01-01#Artikel18a
  - number: '22'
    text: |-
      1 Het is verboden:

      a. anders dan als rechtmatige gebruiker in te grijpen in de bediening of de werking van installaties van de
      hoofdspoorweginfrastructuur;

      b. de hoofdspoorweginfrastructuur of delen daarvan te beschadigen, te vernielen, te verwijderen, af te breken, te
      verstoren, te verplaatsen of in enig opzicht te wijzigen;

      c. zich op of langs gedeelten van een hoofdspoorweg, met uitzondering van een perron, die niet zijn gelegen in een
      gelijkvloerse kruising met een weg of in een voor het openbaar verkeer openstaande weg, te bevinden of daarop of
      daarlangs dieren te drijven of te laten lopen;

      d. enige handeling op of nabij de hoofdspoorweg te verrichten waardoor het beheer van de
      hoofdspoorweginfrastructuur kan worden gehinderd of belemmerd.

      2 Het eerste lid is niet van toepassing op:

      a. het uitvoeren van het beheer;

      b. de uitoefening van een veiligheidsfunctie;

      c. de uitoefening van een wettelijke taak;

      d. het uitvoeren van werkzaamheden in opdracht van een spoorwegonderneming die beschikt over een
      veiligheidscertificaat verleend door Onze Minister of het Europees Spoorwegbureau;

      e. de uitoefening van het houderschap van een spoorvoertuig en de uitoefening van werkzaamheden aan een
      spoorvoertuig in opdracht van de houder van het spoorvoertuig, en

      f. de uitoefening van opleidingsactiviteiten voor een veiligheidsfunctie en de beoordeling op het voldoen aan de
      eisen voor een veiligheidsfunctie;

      g. de uitoefening van overige activiteiten in opdracht van de beheerder.

      3 Onze Minister kan ontheffing verlenen van het in het eerste lid vervatte verbod. Aan de ontheffing kunnen
      voorschriften worden verbonden ter bescherming van de fysieke integriteit van de hoofdspoorwegen en in het belang
      van een veilig en ongestoord gebruik daarvan. De voorschriften kunnen tevens betrekking hebben op het doelmatig
      gebruik van de hoofdspoorweg en het financieel belang van de Staat voor zover dat bij of krachtens algemene
      maatregel van bestuur is bepaald.

      4 In het belang van de bescherming van de fysieke integriteit van de hoofdspoorweginfrastructuur en in het belang
      van een veilig en ongestoord gebruik daarvan, kunnen bij ministeriële regeling over de uitvoering van dit artikel
      regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0015007/2024-01-01#Artikel22
  - number: '26'
    text: |-
      1 De rechthebbende ten aanzien van een rechtstreeks aan de hoofdspoorweg gelegen station draagt ervoor zorg dat
      reizigers via de in het station aanwezige hallen, tunnels, trappen en liften, met logische en overzichtelijke
      routes, een veilige en adequate toegang hebben tot perrons en spoorvoertuigen.

      2 De verplichtingen van een rechthebbende op grond van het eerste lid omvatten met betrekking tot gehandicapte
      personen en personen met beperkte mobiliteit de naleving van artikel 21 van Verordening (EU) nr. 1371/ 2007 van
      het Europees parlement en de Raad van 23 oktober 2007 betreffende de rechten en verplichtingen van reizigers in het
      treinverkeer (PbEU 2007, L 315).

      3 Onder station wordt in het eerste lid verstaan: een gebouw of werk dat blijkens zijn constructie en inrichting
      geheel of gedeeltelijk is bestemd voor aankomst en vertrek van spoorvoertuigen met het oog op het in-, uit- of
      overstappen van reizigers.

      4 Indien de veilige en adequate toegang tot perrons, laad- of losplaatsen of spoorvoertuigen in het gedrang komt of
      dreigt te komen, geeft Onze Minister aan de betrokken rechthebbende een bindende aanwijzing ter waarborging van die
      toegang. Tevens kan Onze Minister aan de betrokken rechthebbende een bindende aanwijzing geven met betrekking tot
      fysieke voorzieningen ter bevordering van de sociale veiligheid op de stations.

      5 Desgevraagd adviseert de beheerder Onze Minister over de toepassing van het vierde lid.
    url: https://wetten.overheid.nl/BWBR0015007/2024-01-01#Artikel26
  - number: 26a
    text: |-
      1 Het is verboden interoperabiliteitsonderdelen voor gebruik binnen het hoofdspoorwegsysteem in de handel te
      brengen of voor eigen gebruik te vervaardigen, dan wel interoperabiliteitsonderdelen van diverse herkomst of delen
      daarvan te assembleren:

      a. die niet voldoen aan de voor het desbetreffende interoperabiliteitsonderdeel geldende essentiële eisen,

      b. waarvoor geen EG-verklaring van conformiteit of geschiktheid voor gebruik is opgesteld, en

      c. waarvoor niet is voldaan aan de krachtens [artikel 26b, onderdelen b, c, en d][ref1], gestelde regels.

      2 Het is verboden een EG-verklaring van conformiteit of geschiktheid voor gebruik op te stellen
      voor interoperabiliteitsonderdelen die niet voldoen aan de essentiële eisen en aan de krachtens
      [artikel 26b, onderdelen b, c en d][ref2], gestelde regels.

      3 Interoperabiliteitsonderdelen die conform zijn met geharmoniseerde normen of delen daarvan waarvan de referenties
      in het Publicatieblad van de Europese Unie zijn bekendgemaakt, worden geacht conform te zijn met de essentiële
      eisen die door die normen of delen daarvan worden bestreken.

      4 Interoperabiliteitsonderdelen worden binnen hun toepassingsgebied overeenkomstig hun bestemming gebruikt en naar
      behoren geïnstalleerd en onderhouden.

      5 Onze Minister kan maatregelen nemen ter beperking van de handel in of het gebruik van een van de EG-verklaring
      van conformiteit of geschiktheid voor gebruik voorzien interoperabiliteitsonderdeel dat in de handel is gebracht en
      wordt gebruikt overeenkomstig zijn bestemming, maar dat de naleving van de essentiële eisen in het gedrang dreigt
      te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel26b
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel26b
