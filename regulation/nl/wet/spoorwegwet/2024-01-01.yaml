      wetten in verband met de implementatie van richtlijn (EU) 2016/797 van het Europees Parlement en de Raad van
      11 mei 2016 betreffende de interoperabiliteit van het spoorwegsysteem in de Europese Unie (PbEU 2016, L 138/44),
      richtlijn (EU) 2016/798 van het Europees Parlement en de Raad van 11 mei 2016 inzake veiligheid op het spoor (PbEU
      2016, L 138/102), richtlijn (EU) 2016/2370 van het Europees Parlement en de Raad van 14 december 2016 tot wijziging
      van [Richtlijn 2012/34](32012L0034)/EU, met betrekking tot de openstelling van de markt voor het binnenlands
      passagiersvervoer per spoor en het beheer van de spoorweginfrastructuur (PbEU 2016, L 352/1) en tevens ter goede
      uitvoering van verordening (EU) 2016/796 van het Europees Parlement en de Raad van 11 mei 2016 betreffende het
      Spoorwegbureau van de Europese Unie en tot intrekking van Verordening (EG) nr. 881/2004 (PbEU 2016 L 138/1) en van
