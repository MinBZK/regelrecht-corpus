  - number: 26k
    text: |-
      1 Het is verboden een spoorvoertuig, voor gebruik op de hoofdspoorweginfrastructuur of een gedeelte daarvan, in de
      handel te brengen waarvoor geen voertuigvergunning is verleend door het Europees Spoorwegbureau of Onze Minister.

      2 Onze Minister verleent, op aanvraag, een voertuigvergunning voor een spoorvoertuig, bestemd voor gebruik op de
      hoofdspoorweginfrastructuur of een gedeelte daarvan, met een gebruiksgebied dat zich beperkt tot Nederland, indien:

      a. voor de in het spoorvoertuig aanwezige subsystemen geldige EG-keuringsverklaringen zijn opgesteld op grond
      van de TSI’s en nationale voorschriften die gelden op het moment dat de aanvraag wordt ingediend, tenzij voor de
      toepassing daarvan ontheffing is verleend overeenkomstig [artikel 26f][ref1],

      b. de in het spoorvoertuig aanwezige subsystemen technisch compatibel zijn,

      c. de in het spoorvoertuig aanwezige subsystemen veilig geïntegreerd zijn, en

      d. het spoorvoertuig technisch compatibel is met de hoofdspoorweginfrastructuur in het gebruiksgebied.

      Een vergunning kan onder beperkingen worden verleend. Aan een vergunning kunnen voorschriften worden verbonden.

      3 De aanvraag voor een voertuigvergunning gaat vergezeld van een dossier dat compleet is met betrekking tot de
      eisen, bedoeld in het tweede lid.

      4 Onze Minister breidt, op aanvraag, het gebruiksgebied van een door hem verleende voertuigvergunning uit. Het
      tweede en derde lid zijn van toepassing op een aanvraag tot uitbreiding van het gebruiksgebied, met dien verstande
      dat de beoordeling van Onze Minister enkel betrekking heeft op de uitbreiding.

      5 Onze Minister kan, met inachtneming van artikel 1 van de interoperabiliteitsrichtlijn en de TSI’s, ontheffing
      verlenen van het verbod, bedoeld in het eerste lid. Een ontheffing kan onder beperkingen worden verleend. Aan
      een ontheffing kunnen voorschriften worden verbonden. Bij ministeriële regeling kunnen regels worden gesteld
      met betrekking tot de aanvraag en verlening van een ontheffing, ter omschrijving van spoorvoertuigen waarmee op
      omschreven hoofdspoorwegen gebruik gemaakt mag worden, met het oog op het veilig gebruik van die spoorvoertuigen op
      de hoofdspoorweginfrastructuur, alsmede met betrekking tot de registratie en identificatie van die spoorvoertuigen.

      6 De conformiteit met en naleving van de op een spoorvoertuig bij de indiening van de aanvraag voor een
      voertuigvergunning als bedoeld in het eerste lid toepasselijke voorschriften wordt tijdens het gebruik
      ononderbroken gewaarborgd.

      7 Een voertuigvergunning als bedoeld in het tweede lid geldt ook zonder uitbreiding van het gebruiksgebied voor
      spoorvoertuigen die gebruik maken van dicht bij de grens gelegen spoorweginfrastructuur in aangrenzende lidstaten,
      indien de eventueel daarvoor vereiste raadpleging van de daartoe bevoegde autoriteiten in de desbetreffende
      lidstaten heeft plaatsgevonden.

      8 Een voertuigvergunning, verleend door een daartoe bevoegde autoriteit in een andere lidstaat, geldt ook voor de
      in die voertuigvergunning opgenomen dicht bij de grens gelegen gedeelten van de hoofdspoorweginfrastructuur, voor
      zover de daarvoor vereiste raadpleging van Onze Minister heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel26f
    url: https://wetten.overheid.nl/BWBR0015007/2024-01-01#Artikel26k
