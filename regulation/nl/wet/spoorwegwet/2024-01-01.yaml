  - number: '58'
    text: |-
      1 De beheerder stelt jaarlijks, na overleg met betrokken gerechtigden, een netverklaring op.

      2 De netverklaring bevat informatie betreffende de aard en toegang tot en het gebruik van de
      hoofdspoorweginfrastructuur en bevat in ieder geval:

      a. de informatie en gegevens genoemd in bijlage IV van richtlijn 2012/34/EU;

      b. met inachtneming van artikel 41, tweede lid, van richtlijn 2012/34/EU, de voorwaarden om er voor te zorgen dat
      aan de gerechtvaardigde verwachtingen van de beheerder ten aanzien van toekomstige inkomsten en het toekomstig
      gebruik van de hoofdspoorweginfrastructuur wordt voldaan;

      c. de verwijzing naar de website waar de bij of krachtens [artikel 62, vierde lid][ref1], vastgestelde
      voorschriften zijn gepubliceerd;

      d. in voorkomend geval: een verwijzing naar de websites, bedoeld in de artikelen 27, tweede lid, en 31, tiende lid,
      van richtlijn 2012/34/EU;

      e. in voorkomend geval: de lijst van marktsegmenten, bedoeld in artikel 32, eerste lid, van richtlijn 2012/34/EU;

      f. de informatie en gegevens betreffende de in artikel 32, vijfde lid, van richtlijn 2012/34/EU aan een
      heffingsregeling gestelde vereisten;

      g. een zakelijke weergave van de inhoud van de geldende kaderovereenkomsten;

      h. informatie over voor bepaalde soorten van gebruik voorbehouden capaciteit;

      i. de wijze waarop rekening wordt gehouden met vroegere benuttingsgraden van treinpaden als bedoeld in artikel 52,
      eerste en tweede lid, van richtlijn 2012/34/EU;

      j. een prognose omtrent de ontwikkeling van de capaciteit;

      k. de criteria voor het vaststellen van de nalatigheid van gebruik van toegewezen capaciteit, bedoeld in artikel
      36, van richtlijn 2012/34/EU.

      3 Met inachtneming van artikel 27, eerste en vierde lid, van richtlijn 2012/34/EU stelt de beheerder de
      netverklaring algemeen beschikbaar, zendt haar aan de betrokken spoorwegondernemingen en de Autoriteit Consument en
      Markt en doet mededeling in de Staatscourant van de vaststelling van de netverklaring.

      4 De beheerder brengt in de netverklaring zo nodig wijzigingen aan, met inachtneming van artikel 32, zesde lid, van
      richtlijn 2012/34/EU. Het derde lid is van overeenkomstige toepassing.

      5 Een gerechtigde als bedoeld in het eerste lid kan bij de Autoriteit Consument en Markt een klacht als bedoeld
      in [artikel 71][ref2] indienen, voor zover deze klacht ziet op de in de netverklaring bekend gemaakte gegevens,
      bedoeld in onderdelen 2 en 3 van bijlage IV van richtlijn 2012/34/EU, tot uiterlijk zes weken na de datum van de
      Staatscourant waarin mededeling is gedaan van de vaststelling van de netverklaring of van een wijziging van de
      hiervoor bedoelde onderdelen van de netverklaring.

      6 Bij ministeriële regeling kunnen met betrekking tot de voorwaarden, bedoeld in het tweede lid, onderdeel b,
      nadere regels worden gesteld die onder andere noodzakelijk zijn voor de goede uitvoering van uitvoeringshandelingen
      op grond van artikel 41, derde lid, van richtlijn 2012/34/EU.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel71
