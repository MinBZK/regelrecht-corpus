  - number: 123e
    text: |-
      1 Een aanvullende vergunning voor indienststelling van een spoorvoertuig respectievelijk voor een type
      spoorvoertuig die is verleend op grond van [artikel 36][ref1], 36b of 37a van de Spoorwegwet, zoals die artikelen
      luidden op de dag voorafgaand aan het tijdstip van inwerkingtreding van [hoofdstuk 2a][ref2], blijft na de
      inwerkingtreding van hoofdstuk 2a, geldig voor de duur waarvoor de desbetreffende vergunning door Onze Minister is
      verleend, met dien verstande dat het betreffende besluit tussentijds door het Europees Spoorwegbureau kan worden
      gewijzigd, geschorst of ingetrokken.

      2 Onze Minister zendt de aanvragen om een aanvullende vergunning voor indienststelling van een spoorvoertuig
      respectievelijk voor een type spoorvoertuig op grond van de [artikelen 36][ref3], 36b en 37a van de Spoorwegwet,
      zoals die artikelen luidden op de dag voorafgaand aan het tijdstip van inwerkingtreding van [hoofdstuk 2a][ref4],
      die voor 16 juni 2019 bij hem zijn ingediend en waarop op 15 juni 2019 nog niet is beslist, onverwijld ter verdere
      behandeling door aan het Europees Spoorwegbureau. Onze Minister stelt de desbetreffende aanvrager in kennis van
      de doorzending.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Hoofdstuk2a
