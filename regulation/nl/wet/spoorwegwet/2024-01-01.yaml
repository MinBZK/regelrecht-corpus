  - number: '27'
    text: |-
      1 Een spoorwegonderneming heeft op niet-discriminerende grondslag recht op toegang tot hoofdspoorweginfrastructuur
      voor zover dit het gebruik van spoorvoertuigen betreft en met het oog op het minimumtoegangspakket.

      2 Geen toegang tot hoofdspoorweginfrastructuur als bedoeld in het eerste lid heeft een spoorwegonderneming:

      a. die niet beschikt over een geldige bedrijfsvergunning;

      b. die niet beschikt over een voor het desbetreffende gedeelte van de hoofdspoorweginfrastructuur geldig
      veiligheidscertificaat, verleend door Onze Minister of het Europees Spoorwegbureau;

      c. die niet voldoet aan de voor haar ingevolge [artikel 55][ref1] geldende verzekeringsplicht;

      d. indien het recht op die toegang niet rechtstreeks voortvloeit uit een toegangsovereenkomst als bedoeld in
      [artikel 59][ref2];

      e. die anderszins niet gerechtigd is van de hoofdspoorweginfrastructuur, bedoeld in het eerste lid, gebruik te
      maken.

      3 Bij algemene maatregel van bestuur kan met inachtneming van artikel 2, tweede lid, van richtlijn 2012/34/
      EU onder bij of krachtens algemene maatregel van bestuur te stellen voorwaarden en beperkingen vrijstelling
      worden verleend van het tweede lid, onderdeel a, en met inachtneming van artikel 2, derde lid, of artikel 3 van
      de spoorwegveiligheidsrichtlijn onder bij of krachtens algemene maatregel van bestuur te stellen voorwaarden en
      beperkingen vrijstelling worden verleend van het tweede lid, onderdeel b.

      4 Een beheerder heeft in afwijking van het tweede lid, onder d, ten behoeve van de uitoefening van de taken,
      bedoeld in [artikel 16, eerste lid][ref3], als spoorwegonderneming toegang tot hoofdspoorweginfrastructuur als
      bedoeld in het eerste lid zonder dat het recht rechtstreeks voortvloeit uit een toegangsovereenkomst met dien
      verstande dat de beheerder, voor zover het de activiteiten, bedoeld in artikel 53 van richtlijn 2012/34/EU betreft,
      beschikt over verdeelde capaciteit.

      5 Onze Minister kan ontheffing of vrijstelling verlenen van de verplichting om te beschikken over een voor
      het desbetreffende gedeelte van de hoofdspoorweginfrastructuur geldig veiligheidscertificaat als bedoeld
      het tweede lid, onderdeel b, voor spoorwegondernemingen die gebruik maken van dicht bij de grens gelegen
      hoofdspoorweginfrastructuur, indien die spoorwegondernemingen beschikken over een veiligheidscertificaat dat geldt
      voor met de desbetreffende hoofdspoorweginfrastructuur verbonden, dicht bij de grens gelegen spoorweginfrastructuur
      in de aangrenzende lidstaat. Een ontheffing of vrijstelling kan onder beperkingen worden verleend. Aan een
      ontheffing of vrijstelling kunnen voorschriften worden verbonden. Bij ministeriële regeling kunnen regels worden
      gesteld met betrekking tot deze ontheffingen en vrijstellingen.

      6 Een veiligheidscertificaat, verleend door een daartoe bevoegde autoriteit in een andere lidstaat, geldt ook voor
      de in dat veiligheidscertificaat opgenomen dicht bij de grens gelegen gedeelten van de hoofdspoorweginfrastructuur,
      voor zover Onze Minister daarover door de daartoe bevoegde autoriteiten van de desbetreffende lidstaat is
      geraadpleegd.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel59
      [ref3]: https://wetten.overheid.nl/BWBR0015007#Artikel16
