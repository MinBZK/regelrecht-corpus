  - number: 123c
    text: |-
      Een veiligheidscertificaat als bedoeld in [artikel 32][ref1] respectievelijk een proefcertificaat als bedoeld
      in [artikel 34][ref2] van de Spoorwegwet, zoals die artikelen luidden op de dag voorafgaand aan het tijdstip van
      inwerkingtreding van de Wet houdende implementatie van het vierde spoorwegpakket, blijft na de inwerkingtreding
      van die wet geldig voor de duur waarvoor het betreffende certificaat is verleend. Op een tussentijdse wijziging,
      schorsing of intrekking van het betreffende veiligheidscertificaat zijn met ingang van de dag waarop de Wet
      houdende implementatie van het vierde spoorwegpakket in werking treedt, [artikel 33, tweede en derde lid][ref3], en
      de krachtens [artikel 35, onderdeel c][ref4], gestelde regels, van toepassing.


