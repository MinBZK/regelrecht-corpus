  - number: 26n
    text: |-
      Onze Minister verleent, op aanvraag, zonder verdere controles, een voertuigvergunning als bedoeld in
      [artikel 26k, tweede lid][ref1], voor een spoorvoertuig dat in overeenstemming is met een spoorvoertuig waarvoor
      reeds een typegoedkeuring voor een spoorvoertuig is verleend. De overeenstemming blijkt uit een door de aanvrager
      overgelegde geldige verklaring van conformiteit met het type.


