  - number: '74'
    text: |-
      Indien door Onze Minister vast te stellen beleidsregels betrekking hebben op de interpretatie van
      mededingingsbegrippen stelt Onze Minister die beleidsregels vast in overeenstemming met Onze Minister van
      Economische Zaken.
    url: https://wetten.overheid.nl/BWBR0015007/2024-01-01#Artikel74
  - number: 74a
    text: |-
      Het is verboden te handelen in strijd met de aan een op grond van deze wet verleende vrijstelling,
      ontheffing, vergunning, erkenning, certificaat of andere beschikking verbonden voorschriften.
    url: https://wetten.overheid.nl/BWBR0015007/2024-01-01#Artikel74a
  - number: '76'
    text: |-
      1 Onze Minister is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van de bij of krachtens
      deze wet gestelde verplichtingen met uitzondering van de verplichtingen als bedoeld in het tweede lid.

      2 In geval van overtreding van het bepaalde krachtens [artikel 17, eerste lid, onderdeel d, en derde lid][ref1]
      of het bepaalde bij of krachtens de [artikelen 16a tot en met 16e][ref2][27, eerste lid][ref3],
      [56][ref4], [57 tot en met 62, eerste tot en met achtste lid][ref5],
      [63, eerste lid, tweede lid, eerste volzin, derde en vierde lid][ref6], [67][ref7],
      [68, eerste tot en met derde lid][ref8], [68a][ref9], [68c][ref10], [70, zevende tot en met negende lid][ref11],
      kan de Autoriteit Consument en Markt de overtreder:

      a. een bestuurlijke boete opleggen;

      b. een last onder dwangsom opleggen.

      3 Op het tweede lid is [artikel 57, eerste en vierde lid, van de Mededingingswet][ref12] van toepassing.


