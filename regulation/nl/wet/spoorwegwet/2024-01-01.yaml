  - number: '5'
    text: Onze Minister draagt zorg voor de aanleg en het beheer van hoofdspoorweginfrastructuur.
    url: https://wetten.overheid.nl/BWBR0015007/2024-01-01#Artikel5
  - number: '6'
    text: |-
      1 Hoofdspoorweginfrastructuur voldoet aan de bij of krachtens algemene maatregel van bestuur te stellen regels
      en nadere regels ten aanzien van basiskwaliteit, te weten inrichting, uitrusting en technische eigenschappen,
      waaronder regels over:

      a. aanleg;

      b. beveiliging;

      c. bouwwerken;

      d. telecommunicatievoorzieningen;

      e. kunstwerken;

      f. spoorwegovergangen;

      g. afstandsbediening.

      2 De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.

      3 De krachtens het eerste lid te stellen regels ten aanzien van een onderwerp waarin ook door een besluit van een
      of meer instellingen van de Europese Unie is voorzien, mogen niet in strijd zijn met dat besluit.

      4 In de krachtens het eerste lid te stellen regels kan worden bepaald dat Onze Minister
      bevoegd is op aanvraag van de beheerder ontheffing te verlenen van die regels. In afwijking van
      [artikel 4:14 van de Algemene wet bestuursrecht][ref1] beslist Onze Minister bij verlenging van de
      beslistermijn op de aanvraag voor een ontheffing in ieder geval binnen vier maanden nadat alle in
      [artikel 4:2, tweede lid, van de Algemene wet bestuursrecht][ref2] bedoelde informatie is verschaft.

      5 Een wijziging van de technische of functionele eigenschappen van de hoofdspoorweginfrastructuur die de
      gebruiksmogelijkheden van de hoofdspoorwegen aanmerkelijk verandert, behoeft de voorafgaande instemming van Onze
      Minister. De beheerder vermeldt in zijn verzoek om instemming de zienswijzen van betrokken gerechtigden en, voor
      zover de wijziging afwijkt van die zienswijzen, een deugdelijke motivering van die afwijking.

      6 Het vijfde lid geldt niet voor een wijziging van de technische of functionele eigenschappen, indien het een
      verbetering of vernieuwing betreft waarvoor Onze Minister een vergunning voor indienststelling als bedoeld in
      [artikel 26h, eerste lid][ref3], heeft verleend, of een besluit als bedoeld in [artikel 26i, eerste lid][ref4],
      heeft genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel414
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel42
      [ref3]: https://wetten.overheid.nl/BWBR0015007#Artikel26h
      [ref4]: https://wetten.overheid.nl/BWBR0015007#Artikel26i
