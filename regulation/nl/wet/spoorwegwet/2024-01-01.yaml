  - number: 68c
    text: |-
      1 Onverminderd het bepaalde bij of krachtens [hoofdstuk 5, paragraaf 1][ref1], mag een exploitant van een
      dienstvoorziening in het kader van een aanbesteding als bedoeld in [artikel 68b, eerste lid][ref2], de voorwaarden
      voor toegang, bedoeld in [artikel 67, eerste lid, onderdeel b][ref3], of voor verlening van diensten, bedoeld in
      artikel 67, eerste lid, onderdeel c, of de vergoedingen, bedoeld in [artikel 68, eerste lid][ref4], pas toepassen
      nadat deze voorwaarden of vergoedingen zijn goedgekeurd door de Autoriteit Consument en Markt.

      2 De exploitant van een dienstvoorziening doet het verzoek tot goedkeuring ten minste zes weken voorafgaand aan
      de datum waarop een aanbesteding als bedoeld in [artikel 61, eerste lid, van de Wet personenvervoer 2000][ref5],
      is gestart.

      3 De Autoriteit Consument en Markt beoordeelt binnen zes weken na ontvangst van het verzoek of de voorwaarden
      of vergoedingen, bedoeld in het eerste lid, in overeenstemming zijn met het bepaalde bij of krachtens de
      [artikelen 67, eerste of tweede lid][ref6], of [68][ref7]. Indien gegevens die de Autoriteit Consument en Markt
      noodzakelijk acht voor een beoordeling ontbreken, wordt de exploitant van de dienstvoorziening hiervan binnen
      een week na ontvangst van het verzoek op de hoogte gesteld. Deze exploitant wordt in de gelegenheid gesteld deze
      gegevens binnen een redelijke termijn alsnog aan te leveren in een door de Autoriteit Consument en Markt aan te
      geven vorm.

      4 De Autoriteit Consument en Markt kan de termijn, bedoeld in het derde lid, eerste volzin, eenmaal met zes weken
      verlengen. Zij doet hiervan schriftelijk mededeling aan de exploitant van de dienstvoorziening die het verzoek
      heeft ingediend.

      5 Indien de Autoriteit Consument en Markt van oordeel is dat de voorwaarden of vergoedingen in overeenstemming
      zijn met het bepaalde bij of krachtens de [artikelen 67, eerste of tweede lid][ref8], of [68][ref9], keurt zij de
      toepassing hiervan goed.

      6 Indien de Autoriteit Consument en Markt van oordeel is dat de voorwaarden of vergoedingen niet in overeenstemming
      zijn met het bepaalde bij of krachtens de [artikelen 67, eerste of tweede lid][ref10], of [68][ref11], doet zij
      hiervan mededeling aan de desbetreffende exploitant. Zij deelt hierbij mede op welke punten niet voldaan is aan het
      bepaalde bij of krachtens de artikelen 67, eerste of tweede lid, of 68.

      7 De exploitant van de dienstvoorziening deelt de Autoriteit Consument en Markt binnen vier weken na de datum
      van de mededeling, bedoeld in het zesde lid, schriftelijk mede in hoeverre de voorwaarden of vergoedingen
      worden aangepast aan die mededeling. De Autoriteit Consument en Markt beoordeelt binnen drie weken na ontvangst
      van de mededeling van de exploitant van de dienstvoorziening, bedoeld in de eerste volzin, op het verzoek tot
      goedkeuring, of de voorwaarden of vergoedingen in overeenstemming zijn met het bepaalde bij of krachtens de
      [artikelen 67, eerste of tweede lid][ref12], of [68][ref13].

      8 Artikel 68a is van toepassing op de voorwaarden of vergoedingen die op grond van dit artikel zijn goedgekeurd.

      9 Bij algemene maatregel van bestuur kunnen in afwijking van het eerste lid soorten dienstvoorzieningen of soorten
      diensten als bedoeld in bijlage II, punt 2, onderdelen a, f en i, van richtlijn 2012/34/EU uitgezonderd worden van
      de verplichting, bedoeld in het eerste lid.

      10 De voordracht voor een algemene maatregel van bestuur als bedoeld in het negende lid wordt niet eerder gedaan
      dan nadat de Autoriteit Consument en Markt in de gelegenheid is gesteld advies uit te brengen over het ontwerp van
      dat besluit en niet eerder dan vier weken nadat het ontwerp tezamen met het advies van de Autoriteit Consument en
      Markt aan beide kamers der Staten-Generaal is overgelegd.


