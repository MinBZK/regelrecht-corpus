  - number: 26b
    text: |-
      Bij ministeriële regeling kunnen in het belang van een goede uitvoering van het bij of krachtens de
      interoperabiliteitsrichtlijn bepaalde met betrekking tot de onderwerpen in deze paragraaf regels worden gesteld,
      waaronder in elk geval regels over:

      a. interoperabiliteitsonderdelen die kunnen worden vrijgesteld van de verplichtingen, bedoeld in
      [artikel 26a, eerste lid, onderdelen b en c][ref1],

      b. eisen waaraan interoperabiliteitsonderdelen voldoen,

      c. het keuren van interoperabiliteitsonderdelen,

      d. het opstellen van de EG-verklaring van conformiteit of geschiktheid voor gebruik en andere
      documentatieverplichtingen met betrekking tot interoperabiliteitsonderdelen,

      e. het gebruik, de installatie en het onderhoud van interoperabiliteitsonderdelen,

      f. de door Onze Minister te nemen maatregelen, bedoeld in [artikel 26a, vijfde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel26a
