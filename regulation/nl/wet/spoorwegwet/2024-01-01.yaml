  - number: '36'
    text: |-
      1 Voordat een spoorvoertuig op de hoofdspoorweginfrastructuur wordt gebruikt, is er een met het onderhoud
      belaste entiteit voor dat spoorvoertuig. De met het onderhoud belaste entiteit zorgt dat het desbetreffende
      spoorvoertuig in veilige staat is en past daartoe een onderhoudssysteem toe dat voldoet aan de krachtens
      [artikel 38, eerste lid, onderdeel a][ref1], gestelde regels.

      2 Onze Minister kan het gebruik met een spoorvoertuig van hoofdspoorweginfrastructuur verbieden indien ten aanzien
      van dat spoorvoertuig niet wordt voldaan aan het eerste lid.

      3 De met het onderhoud belaste entiteit van een of meer goederenwagons beschikt over een geldig ECM-certificaat,
      verleend door Onze Minister of een daartoe bevoegde instantie in een andere lidstaat.

      4 Onze Minister verleent, op aanvraag, een ECM-certificaat aan een met het onderhoud belaste entiteit die voldoet
      aan de krachtens [artikel 38, eerste lid, onderdeel b][ref2], gestelde regels.

      5 De verplichting te beschikken over een ECM-certificaat geldt niet voor spoorwegondernemingen of beheerders die
      de met het onderhoud belaste entiteit zijn van een of meer goederenwagons, mits de beoordeling van de voor het ECM-
      certificaat geldende eisen reeds bij de verlening van het veiligheidscertificaat, dan wel de veiligheidsvergunning,
      heeft plaatsgevonden.

      6 Onze Minister verleent, op aanvraag, een certificaat aan een rechtspersoon die in staat is een
      gedeelte van het onderhoudssysteem, bedoeld in het eerste lid, uit te voeren, en voldoet aan de krachtens
      [artikel 38, eerste lid, onderdeel d][ref3], gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0015007#Artikel38
