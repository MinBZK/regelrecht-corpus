        artikel: '32'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0015007
        artikel: '32'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '121'
    text: |-
      Hoofdspoorweginfrastructuur die in overeenstemming met de daarvoor geldende voorschriften die gelden op de dag
      voorafgaande aan de dag waarop [artikel 6][ref1] in werking treedt, wordt gebruikt, wordt met ingang van de dag
      waarop [dat artikel][ref2] in werking treedt, aangemerkt als in overeenstemming met [dat artikel][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0015007#Artikel6
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0015007
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0015007
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '122'
    text: |-
      Een spoorvoertuig dat in overeenstemming met de daarvoor geldende voorschriften die gelden op de dag voorafgaande
      aan de dag waarop [artikel 36][ref1] in werking treedt, kan worden gebruikt op de hoofdspoorweg, wordt met ingang
      van de dag waarop dat artikel in werking treedt, aangemerkt als in overeenstemming met de onderdelen a en b van
      dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel36
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel122
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '123'
    text: |-
      Erkenningen op grond van [artikel 32d, zevende lid, van de Spoorwegwet][ref1] (Stb. 1875, 67) berusten met ingang
      van de dag waarop [artikel 93][ref2] in werking treedt op [artikel 93, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel32d
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel93
      [ref3]: https://wetten.overheid.nl/BWBR0015007#Artikel93
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: 32d
      - id: ref2
        bwb_id: BWBR0015007
        artikel: '93'
        hoofdstuk: '6'
        paragraaf: '8'
      - id: ref3
        bwb_id: BWBR0015007
        artikel: '93'
        hoofdstuk: '6'
        paragraaf: '8'
  - number: '124.1'
    text: |-
      In afwijking van [artikel 2, tweede en vijfde lid][ref1], kunnen spoorwegen als hoofdspoorwegen worden aangewezen,
      indien deze spoorwegen rechtstreeks of middellijk in overwegende mate zijn aangelegd op kosten van het Rijk en naar
      het oordeel van Onze Minister voldoende is komen vast te staan dat gedurende de periode van twee jaar voorafgaand
      aan de datum van inwerkingtreding van [artikel 2, tweede lid][ref2] deze spoorwegen door Railinfrabeheer b.v.,
      gevestigd te Utrecht, werden onderhouden.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel2
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0015007
        artikel: '2'
        hoofdstuk: '1'
  - number: '124.2'
    text: |-
      Tot 1 januari 2013 kunnen in afwijking van [artikel 2, tweede en vijfde lid][ref1], spoorwegen als hoofdspoorwegen
      worden aangewezen, indien Railinfrabeheer b.v., of Railinfratrust b.v., gevestigd te Utrecht, of hun rechtsopvolger
      rechthebbende is ten aanzien van deze spoorwegen.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel2
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '2'
        hoofdstuk: '1'
  - number: '125.1'
    text: |-
      Indien de Staat houder is van alle aandelen in het kapitaal van Railinfratrust b.v., gevestigd te Utrecht, gaan
      op een bij koninklijk besluit te bepalen tijdstip alle vermogensbestanddelen van deze vennootschap om niet onder
      algemene titel over op de Staat.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel125
  - number: '125.2'
    text: |-
      De overgang van registergoederen ingevolge het eerste lid doet Onze Minister van Financiën onverwijld inschrijven
      in de openbare registers, bedoeld in [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref1].
      [Artikel 24, eerste lid, van Boek 3 van het Burgerlijk Wetboek][ref2] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel24
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0005291
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '24'
  - number: '125.3'
    text: |-
      Ter zake van de overgang, bedoeld in het eerste lid, is geen overdrachtsbelasting of omzetbelasting verschuldigd.
      Ter zake van het in ontvangst nemen en het in de openbare registers verwerken is geen tarief verschuldigd.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel125
  - number: '125.4'
    text: |-
      In wettelijke procedures en rechtsgedingen waarbij de in het eerste lid genoemde vennootschap is betrokken, treedt
      met ingang van de het in het eerste lid bedoelde tijdstip de Staat in de plaats van die vennootschap.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel125
  - number: '125.5'
    text: |-
      Met ingang van het in het eerste lid bedoelde tijdstip is de in het eerste lid genoemde vennootschap ontbonden.
      [Artikel 23 van Boek 2 van het Burgerlijk Wetboek][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel23
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '23'
  - number: '126'
    text: |-
      Onze Minister zendt in het jaar 2006 aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van
      deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel126
  - number: '127'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel127
  - number: '128'
    text: 'Deze wet wordt aangehaald als: Spoorwegwet.'
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel128
