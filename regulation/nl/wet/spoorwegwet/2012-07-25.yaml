  - number: '80.2'
    text: |-
      Indien de boete wordt opgelegd voor het overtreden van een bepaling vermeld in het eerste lid is bij de
      vaststelling van de hoogte van deze boete de onderstaande categorie-indeling naar omzet van toepassing met de
      daarbij behorende factor. De omzet is de omzet in het kalenderjaar voorafgaand aan de datum van overtreding. De
      boete wordt vastgesteld door het in het eerste lid vermelde bedrag te vermenigvuldigen met de factor behorende bij
      de onderstaande omzet-categorie: - Categorie I: ondernemingen met een omzet van minder dan € 100 000: factor 0,25.
        - Categorie II: ondernemingen met een omzet van ten minste € 100 000 maar minder dan € 200 000: factor 0,5.
        - Categorie III: ondernemingen met een omzet van ten minste € 200 000 maar minder dan € 500 000: factor 1.
        - Categorie IV: ondernemingen met een omzet van ten minste € 500 000 maar minder dan € 1 000 000: factor 2.
        - Categorie V: ondernemingen met een omzet van meer dan € 1 000 000: factor 3.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel80
  - number: '80.3'
    text: |-
      Indien de gegevens omtrent de omzet niet aan Onze Minister beschikbaar zijn gesteld, kan Onze Minister aan degene
      aan wie de boete wordt opgelegd verzoeken deze gegevens binnen een door hem te stellen termijn te verstrekken.
      Indien de betrokkene niet binnen de gestelde termijn voldoet aan dit verzoek, is bij de vaststelling van de hoogte
      van de in het tweede lid bedoelde boete categorie V van toepassing.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel80
  - number: '80.4'
    text: |-
      De in het eerste en tweede lid vermelde bedragen en factoren kunnen bij algemene maatregel van bestuur worden
      gewijzigd.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel80
  - number: '86.1'
    text: |-
      Met de opsporing van de bij of krachtens deze wet strafbaar gestelde feiten zijn, onverminderd
      [artikel 141 van het Wetboek van Strafvordering][ref1], belast de met betrekking tot deze wet krachtens
      [artikel 17, eerste lid, onderdeel 2°, van de Wet op de economische delicten][ref2] aangewezen
      ambtenaren. Deze ambtenaren zijn tevens belast met de opsporing van de feiten, strafbaar gesteld in de
      [artikelen 179 tot en met 182][ref3] en [184 van het Wetboek van Strafrecht][ref4], voorzover deze feiten
      betrekking hebben op een bevel, vordering of handeling, gedaan of ondernomen door henzelf.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0002063#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel179
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel184
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel86
    references:
