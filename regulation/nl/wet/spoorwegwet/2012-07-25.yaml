        hoofdstuk: '1'
      - id: ref5
        bwb_id: BWBR0015007
        artikel: '4'
        hoofdstuk: '1'
  - number: '88.2'
    text: |-
      De ambtenaar die een verbod als bedoeld in het eerste lid oplegt, legt dit vast in een beschikking die het tijdstip
      van ingang en de duur van het verbod bevat.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel88
  - number: '88.3'
    text: |-
      Het is degene aan wie een verbod als bedoeld in het eerste lid is opgelegd, verboden een veiligheidsfunctie uit te
      oefenen dan wel op de uitoefening van zodanige functie toezicht te houden, gedurende de tijd waarvoor dat verbod
      geldt.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel88
  - number: '89.1'
    text: |-
      Bij verdenking dat een persoon heeft gehandeld in strijd met [artikel 4, eerste, tweede of derde lid][ref1], kan
      de in [artikel 88, eerste lid][ref2], bedoelde ambtenaar hem bevelen zijn medewerking te verlenen aan een onderzoek
      als bedoeld in [artikel 4, tweede lid, onderdeel a][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel88
      [ref3]: https://wetten.overheid.nl/BWBR0015007#Artikel4
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '4'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0015007
        artikel: '88'
        hoofdstuk: '6'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0015007
        artikel: '4'
        hoofdstuk: '1'
  - number: '89.2'
    text: |-
      Degene aan wie het in het eerste lid bedoelde bevel is gegeven, is verplicht ademlucht te blazen in een voor het
      onderzoek bestemd apparaat en gevolg te geven aan alle door de betrokken ambtenaar ten dienste van het onderzoek
      gegeven aanwijzingen.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel89
  - number: '89.3'
    text: |-
      De in het tweede lid genoemde verplichtingen gelden niet voor de verdachte van wie aannemelijk is, dat het verlenen
      van medewerking aan een ademonderzoek voor hem om bijzondere geneeskundige redenen onwenselijk is.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel89
  - number: '89.4'
    text: |-
      In het geval, bedoeld in het derde lid, dan wel indien de medewerking van de verdachte niet heeft geleid tot
      een voltooid ademonderzoek, kan de betrokken ambtenaar de verdachte vragen of hij zijn toestemming geeft tot
      het verrichten van een onderzoek als bedoeld in [artikel 4, tweede lid, onderdeel b][ref1]. Gelijke bevoegdheid
      heeft de betrokken ambtenaar, indien het vermoeden bestaat dat de verdachte onder invloed van een andere in
      [artikel 4, eerste lid][ref2], bedoelde stof dan alcoholhoudende drank verkeert.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel4
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '4'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0015007
        artikel: '4'
        hoofdstuk: '1'
  - number: '89.5'
    text: |-
      Indien de verdachte zijn op grond van het vierde lid gevraagde toestemming niet verleent, kan de officier
      van justitie, een hulpofficier van justitie of een van de daartoe bij regeling van Onze Minister van Justitie
      aangewezen ambtenaren, aangesteld voor de uitvoering van de politietaak, hem bevelen zich te onderwerpen aan een
      bloedonderzoek.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel89
  - number: '89.6'
    text: |-
      Degene wie is bevolen zich aan een bloedonderzoek te onderwerpen, is verplicht aan dit bevel gevolg te geven en
      zijn medewerking te verlenen. Hem wordt door een arts zoveel bloed afgenomen als voor het onderzoek noodzakelijk
      is.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel89
  - number: '89.7'
    text: |-
      De in het zesde lid genoemde verplichtingen gelden niet voor de verdachte van wie aannemelijk is, dat afname van
      bloed bij hem om bijzondere geneeskundige redenen onwenselijk is.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel89
  - number: '89.8'
    text: |-
      De krachtens het zevende lid van de in het zesde lid genoemde verplichtingen vrijgestelde personen zijn verplicht
      mee te werken aan een door de officier van justitie, door een hulpofficier van justitie of door een van de
      daartoe bij regeling van Onze Minister van Justitie aangewezen ambtenaren, aangesteld voor de uitvoering van de
      politietaak, bevolen onderzoek ten einde op andere wijze dan door bloed- of ademonderzoek het gebruik van de in
      [artikel 4, eerste lid][ref1], bedoelde stoffen of het in [artikel 4, tweede lid, onderdeel b][ref2], genoemde
      gehalte vast te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel4
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '4'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0015007
        artikel: '4'
        hoofdstuk: '1'
  - number: '89.9'
    text: |-
      Indien de verdachte niet in staat is zijn wil kenbaar te maken, kan hem met toestemming van de officier van
      justitie, een hulpofficier van justitie of een van de daartoe bij regeling van Onze Minister van Justitie
      aangewezen ambtenaren, aangesteld voor de uitvoering van de politietaak, door een arts de in het zesde lid bedoelde
      hoeveelheid bloed worden afgenomen, tenzij aannemelijk is dat dit bij hem om bijzondere geneeskundige redenen
      onwenselijk is. Een onderzoek van het bloed vindt niet plaats dan nadat de verdachte in de gelegenheid is gesteld
      zijn toestemming daartoe te geven. Zo nodig kan hem overeenkomstig het vijfde lid worden bevolen zijn medewerking
      te verlenen. De verdachte aan wie een zodanig bevel is gegeven, is verplicht zijn medewerking te verlenen. Indien
      de verdachte weigert zijn medewerking te verlenen, wordt het bloedmonster vernietigd.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel89
  - number: '89.10'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld over de wijze van uitvoering van
      [artikel 4, vierde lid][ref1], en van dit artikel. Deze regels kunnen mede betrekking hebben op de mogelijkheid
      tot het doen verrichten van een tegenonderzoek. Bij regeling van Onze Minister van Justitie worden in de bij die
      algemene maatregel van bestuur aangegeven gevallen voorschriften ter uitvoering van die regels vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel4
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '4'
        hoofdstuk: '1'
  - number: '90'
    text: |-
      In afwijking van [artikel 8:7 van de Algemene wet bestuursrecht][ref1] is voor beroepen tegen besluiten op grond
      van deze wet, met uitzondering van besluiten op grond van de [artikelen 19][ref2] en [21][ref3], de rechtbank te
      Rotterdam bevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0015007#Artikel21
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0015007
        artikel: '19'
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0015007
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '91.1'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat aan het betrokken bestuursorgaan een vergoeding verschuldigd
      is volgens de daarbij vast te stellen tarieven ter zake van het overeenkomstig deze wet aanvragen of verstrekken
      van een bij of krachtens deze wet te nemen besluit, te verstrekken certificaat, ander document, beoordeling
      of verklaring of te verrichten inschrijving of wijziging van die inschrijving in het register, bedoeld in
      [artikel 37, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel37
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '37'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '91.2'
    text: |-
      De hoogte van de krachtens het eerste lid vastgestelde tarieven wordt zodanig vastgesteld dat de geraamde baten
      van de vergoedingen voor het betrokken bestuursorgaan niet uitgaan boven de geraamde lasten van het betrokken
      bestuursorgaan ter zake van de behandelingen van de aanvragen en het verstrekken van de besluiten en documenten,
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel91
  - number: '92'
    text: |-
      Een wijziging van richtlijn 91/440/EEG, richtlijn 95/18/EG, richtlijn 2001/14/EG, richtlijn 2004/49/EG, richtlijn
      2007/59/EG en van richtlijn 2008/57/EG gaat voor de toepassing van deze wet en de daarop berustende bepalingen
      gelden met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven, tenzij bij
      ministerieel besluit, dat in de Staatscourant wordt bekend gemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel92
  - number: '93.1'
    text: 'Onze Minister wijst op aanvraag aan:'
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel93
  - number: 93.1.a
    text: aangemelde instanties;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel93
  - number: 93.1.b
    text: |-
      de instanties, belast met de toetsing, bedoeld in [artikel 8, vijfde lid][ref1], [artikel 9, zesde lid][ref2],
      [artikel 36, zevende lid][ref3], en [artikel 37b, negende lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0015007#Artikel36
      [ref4]: https://wetten.overheid.nl/BWBR0015007#Artikel37b
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0015007
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0015007
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0015007
        artikel: 37b
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '93.2'
    text: |-
      De instanties, de directeur en het personeel daarvan voldoen ten minste aan de toepasselijke eisen, neergelegd in
      bijlage VIII van richtlijn 2008/57/EG, en aan de bij ministeriële regeling vastgestelde eisen.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel93
  - number: '93.3'
    text: Aan de aanwijzing kunnen voorschriften en beperkingen worden verbonden.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel93
  - number: '93.4'
    text: |-
      De instanties verrichten hun werkzaamheden met inachtneming van de toepasselijke bepalingen in bijlage VI
      van richtlijn 2008/57/EG en het Besluit nr. 93/465/EEG van de Raad van de Europese Gemeenschappen van 22 juli
      1993 betreffende de modules voor de verschillende fasen van de overeenstemmingsbeoordelingsprocedures en de
      voorschriften inzake het aanbrengen en het gebruik van de CE-markering van overeenstemming (PbEG L 220).
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel93
  - number: '93.5'
    text: |-
      De instanties stellen na elk onderzoek een onderzoekscertificaat op, in voorkomend geval met vermelding van de
      geldigheidsduur en van de voorwaarden waaronder het geldig is.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel93
  - number: '93.6'
    text: |-
      Onze Minister trekt de aanwijzing, bedoeld in het eerste lid, in indien de betrokken instantie niet langer voldoet
      aan de toepasselijke eisen van bijlage VIII van richtlijn 2008/57/EG onderscheidenlijk bijlage VI van richtlijn
      2008/57/EG. Onze Minister kan de aanwijzing intrekken, indien de betrokken instantie niet langer voldoet aan
      bijlage VIII van richtlijn 2008/57/EG onderscheidenlijk bijlage VI van richtlijn 2008/57/EG of de bij ministeriële
      regeling vastgestelde eisen, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel93
  - number: '93.7'
    text: |-
      Onze Minister doet mededeling van een aanwijzing of van een intrekking van een aanwijzing door kennisgeving in
      de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel93
  - number: '96.1'
    text: |-
      Spoorwegondernemingen en de beheerder zijn verplicht Onze Minister mondeling, schriftelijk of op andere wijze – dit
      ter keuze van Onze Minister na overleg met de betrokken spoorwegonderneming of betrokken beheerder – alle bij hen
      berustende gegevens te verstrekken en inzage te geven van boeken en bescheiden die betrekking hebben op het gebruik
      of beheer van spoorwegen en het vervoer daarover, voorzover Onze Minister dat redelijkerwijs voor de vervulling van
      zijn taak nodig heeft.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel96
  - number: '96.2'
    text: |-
      Degene van wie krachtens het eerste lid gegevens worden verlangd, is op de door Onze Minister aan te geven wijze
      en binnen de door hem te bepalen termijn verplicht deze volledig en naar waarheid te verstrekken en degene van wie
      inzage wordt verlangd is verplicht deze ongestoord te verlenen.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel96
  - number: '96.3'
    text: |-
      Onze Minister gebruikt gegevens of inlichtingen omtrent een spoorwegonderneming die hij heeft verkregen in verband
      met enige werkzaamheid ten behoeve van de uitvoering van een van zijn taken, uitsluitend voor de uitvoering van
      die taak.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel96
  - number: '97'
    text: |-
      Voorzover dit noodzakelijk is ter beoordeling van het voldoen aan de bij of krachtens deze wet gestelde
      voorschriften kunnen gegevens betreffende het gedrag van bestuurders, het gedrag van een vergunninghouder en de
      gezondheid van personeel worden verwerkt. Onze Minister is verantwoordelijke voor de verwerking van de gegevens als
      bedoeld in de [Wet bescherming persoonsgegevens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011468
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0011468
  - number: '103'
    text: |-
