        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0015007
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '120.1'
    text: |-
      Een geldende concessie ter uitoefening van de dienst verleend op grond van
      __REF000___________________________________________________________________________________________________________
      ________________________________________________________ (Stb. 118) wordt tot en met de eerste dag van de
      vierde kalendermaand na de dag waarop [artikel 103, onderdeel b][ref2], in werking treedt, aangemerkt als een
      veiligheidsattest als bedoeld in [artikel 32][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001866#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel103
      [ref3]: https://wetten.overheid.nl/BWBR0015007#Artikel32
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0001866
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0015007
        artikel: '103'
        hoofdstuk: '8'
      - id: ref3
        bwb_id: BWBR0015007
        artikel: '32'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '120.2'
    text: |-
      De in het eerste lid bedoelde concessie wordt ook na de daarin bedoelde periode aangemerkt als een
      veiligheidsattest als bedoeld in [artikel 32][ref1], indien de houder voor die dag een aanvraag heeft ingediend
      voor een veiligheidsattest als bedoeld in [artikel 32][ref2] en zolang daarop niet onherroepelijk is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel32
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel120
