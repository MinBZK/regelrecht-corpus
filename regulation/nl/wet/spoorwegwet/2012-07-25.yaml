preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het gelet op richtlijnen 91/440/EEG, 95/18/EG, 96/48/EG, 2001/12/EG,
    2001/13/EG, 2001/14/EG en 2001/16/EG en mede gelet op het belang van de bescherming van het milieu noodzakelijk
    is wettelijke bepalingen vast te stellen inzake de aanleg, het beheer en het gebruik van spoorwegen en dat het
    ter bevordering van een maatschappelijk gewenste benutting van spoorwegen wenselijk is, de verantwoordelijkheid
    van de overheid voor de aanleg van spoorweginfrastructuur vast te leggen, de verantwoordelijkheid voor
    vervoer en spoorweginfrastructuur te scheiden en de publieke belangen die gemoeid zijn met het beheer van
    spoorweginfrastructuur te verzekeren door de invoering van een concessiestelsel voor het beheer, het gebruik van
    spoorwegen te bevorderen door het stellen van transparante en niet-discriminerende voorschriften en dat het voorts
    wenselijk is de wetgeving inzake de spoorwegen overigens te moderniseren;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#ArtikelAanhef
