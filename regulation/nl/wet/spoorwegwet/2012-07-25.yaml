        artikel: '184'
  - number: '86.2'
    text: |-
      Met de opsporing van de bij of krachtens deze wet strafbaar gestelde feiten zijn voorts belast de bij besluit van
      Onze Minister en Onze Minister van Justitie tezamen aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel86
  - number: '86.3'
    text: Van een besluit als bedoeld in het tweede lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel86
  - number: '87.1'
    text: |-
      Overtreding van de [artikelen 4, vierde lid][ref1], [19][ref2], [21][ref3],
      [22, eerste lid, onderdelen c en d][ref4], en [51, vierde lid][ref5], alsmede overtreding van de krachtens
      [hoofdstuk 2][ref6] en de [artikelen 64, tweede lid][ref7], [65, eerste lid][ref8], en [94][ref9] vastgestelde
      voorschriften, voorzover die overtreding daarbij uitdrukkelijk als strafbaar feit is aangemerkt, wordt gestraft met
      hechtenis van ten hoogste twee maanden of geldboete van de tweede categorie.


