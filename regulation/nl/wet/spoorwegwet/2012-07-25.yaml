  - number: '2.1'
    text: |-
      Deze wet is van toepassing op de als zodanig bij koninklijk besluit aangewezen hoofdspoorwegen en lokale spoorwegen
      alsmede op bijzondere spoorwegen.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel2
  - number: '2.2'
    text: 'Een spoorweg wordt als hoofdspoorweg aangewezen, indien:'
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel2
  - number: 2.2.a
    text: |-
      de spoorweg uitsluitend of overwegend bestemd is voor het verrichten van openbaar personenvervoer of
      goederenvervoer ten behoeve van internationale, nationale of regionale verbindingen en
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel2
  - number: 2.2.b
    text: de Staat rechthebbende is ten aanzien van de spoorweg.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel2
  - number: '2.6'
    text: Een besluit op grond van het eerste lid of vijfde lid wordt in het Staatsblad geplaatst.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel2
  - number: '3'
    text: |-
      Het is een ieder verboden zich zodanig te gedragen dat gevaar op de spoorweg wordt veroorzaakt of kan worden
      veroorzaakt of dat het verkeer op de spoorweg wordt gehinderd of kan worden gehinderd.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel3
  - number: '4.1'
    text: |-
      Het is een ieder verboden een veiligheidsfunctie uit te oefenen dan wel op de uitoefening van zodanige functie
      toezicht te houden terwijl hij verkeert onder zodanige invloed van een stof waarvan hij weet of redelijkerwijs moet
      vermoeden dat het gebruik daarvan, al dan niet in combinatie met een andere stof, de vaardigheid tot het uitoefenen
      van die functie of tot het houden van toezicht op de uitoefening van die functie kan verminderen, dat hij niet tot
      het behoorlijk uitoefenen van die functie of tot het behoorlijk uitoefenen van toezicht op de uitoefening van die
      functie in staat moet worden geacht.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel4
  - number: '4.2'
    text: |-
      Het is een ieder verboden een veiligheidsfunctie uit te oefenen dan wel op de uitoefening van zodanige functie
      toezicht te houden na zodanig gebruik van alcoholhoudende drank dat:
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel4
  - number: 4.2.a
    text: |-
      het alcoholgehalte van zijn adem bij een onderzoek hoger blijkt te zijn dan tweehonderdtwintig microgram alcohol
      per liter uitgeademde lucht, dan wel
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel4
  - number: 4.2.b
    text: |-
      het alcoholgehalte van zijn bloed bij een onderzoek hoger blijkt te zijn dan een halve milligram alcohol per
      milliliter bloed.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel4
  - number: '4.3'
    text: |-
      Het is verboden een veiligheidsfunctie te doen uitoefenen dan wel op de uitoefening van zodanige functie toezicht
      te doen houden door een persoon waarvan men weet of redelijkerwijs moet weten dat deze verkeert in een toestand als
      in het eerste of tweede lid is omschreven.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel4
  - number: '4.4'
    text: |-
      Op de eerste vordering van bij of krachtens [artikel 86 van deze wet][ref1] of
      [artikel 141 van het Wetboek van Strafvordering][ref2] met de opsporing van strafbare feiten belaste ambtenaren
      zijn personen die een veiligheidsfunctie uitoefenen dan wel op de uitoefening van zodanige functie toezicht houden,
      of daartoe aanstalten maken, verplicht hun medewerking te verlenen aan een voorlopig onderzoek van uitgeademde
      lucht en daartoe volgens door die ambtenaar te geven aanwijzingen ademlucht te blazen in een door die ambtenaar
      aangewezen apparaat.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel86
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '86'
        hoofdstuk: '6'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '4.5'
    text: |-
      Dit artikel is niet van toepassing voorzover [artikel 8 van de Wegenverkeerswet 1994][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel8
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '8'
  - number: '5'
    text: Onze Minister draagt zorg voor de aanleg, het beheer en het onderhoud van hoofdspoorweginfrastructuur.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel5
  - number: '6.1'
    text: |-
      Hoofdspoorweginfrastructuur voldoet aan de bij of krachtens algemene maatregel van bestuur te stellen regels
      en nadere regels ten aanzien van basiskwaliteit, te weten inrichting, uitrusting en technische eigenschappen,
      waaronder regels over:
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel6
  - number: 6.1.a
    text: algemene kenmerken van de infrastructuur;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel6
  - number: 6.1.b
    text: aanleg en onderhoud;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel6
  - number: 6.1.c
    text: beveiliging;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel6
  - number: 6.1.d
    text: bouwwerken;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel6
  - number: 6.1.e
    text: telecommunicatievoorzieningen;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel6
  - number: 6.1.f
    text: kunstwerken;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel6
  - number: 6.1.g
    text: spoorwegovergangen;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel6
  - number: 6.1.h
    text: afstandsbediening;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel6
  - number: 6.1.i
    text: energievoorziening.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel6
  - number: '6.2'
    text: |-
      De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel6
  - number: '6.3'
    text: |-
      De krachtens het eerste lid te stellen regels ten aanzien van een onderwerp waarin ook door een besluit van een of
      meer instellingen van de Europese Unie is voorzien, mogen niet in strijd zijn met dat besluit.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel6
  - number: '6.4'
    text: |-
      In de krachtens het eerste lid te stellen regels kan worden bepaald dat Onze Minister bevoegd is op aanvraag van de
      beheerder ontheffing verlenen van die regels.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel6
  - number: '8.1'
    text: |-
      Het is een beheerder verboden een nieuwe hoofdspoorweg in dienst te stellen zonder dat Onze Minister daarvoor een
      vergunning voor indienststelling heeft verleend.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel8
  - number: '8.2'
    text: 'Onze Minister verleent de vergunning voor indienststelling indien de desbetreffende subsystemen:'
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel8
  - number: 8.2.a
    text: voldoen aan de daarvoor geldende technische specificaties inzake interoperabiliteit;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel8
  - number: 8.2.b
    text: |-
      voldoen aan de krachtens [artikel 6, eerste lid][ref1], vastgestelde regels die bij regeling van Onze Minister,
      met inachtneming artikel 17 van richtlijn 2008/57/EG, voor de subsystemen zijn aangewezen ter uitvoering van de
      essentiële eisen van die richtlijn;


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel6
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 8.2.c
    text: |-
      voldoen aan de krachtens [artikel 6, eerste lid][ref1], vastgestelde regels die bij regeling van Onze Minister op
      grond van een technische specificatie inzake interoperabiliteit, bedoeld in onderdeel a, voor de subsystemen zijn
      aangewezen ter verificatie van de interoperabiliteit;


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel6
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 8.2.d
    text: |-
      voldoen aan de krachtens [artikel 6, eerste lid][ref1], vastgestelde regels, die bij regeling van Onze Minister
      voor de subsystemen zijn aangewezen ter uitwerking van de in een of meer technische specificaties inzake
      interoperabiliteit, bedoeld in onderdeel a, opgenomen open punten;


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel6
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 8.2.e
    text: voldoen aan de eisen, bedoeld in artikel 15, eerste en tweede lid, van richtlijn 2008/57/EG.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel8
  - number: '8.3'
    text: |-
      Onze Minister kan op aanvraag, met inachtneming van artikel 9 van richtlijn 2008/57/EG, een of meer technische
      specificaties inzake interoperabiliteit geheel of gedeeltelijk buiten toepassing laten.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel8
  - number: '8.4'
    text: |-
      Het voldoen aan de specificaties, bedoeld in het tweede lid, onderdeel a, en aan de regels, bedoeld in het tweede
      lid, onderdeel b, blijkt uit een geldig afgegeven EG-keuringsverklaring als bedoeld in artikel 18 van richtlijn
      2008/57/EG.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel8
  - number: '8.5'
    text: |-
      Het voldoen aan de regels, bedoeld in het tweede lid, onderdelen c en d, blijkt uit een geldige verklaring van een
      aangemelde instantie of van een keuringsinstantie.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel8
  - number: '8.6'
    text: |-
      Onze Minister kan op aanvraag onder bij ministeriële regeling te geven voorwaarden en beperkingen, met inachtneming
      van artikel 1, derde lid, van richtlijn 2008/57/EG, ontheffing verlenen van het tweede lid.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel8
  - number: '9.1'
    text: |-
      Het is een beheerder verboden een vernieuwing of verbetering bij hoofdspoorweginfrastructuur in dienst te stellen
      zonder:
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel9
  - number: 9.1.a
    text: voorafgaande indiening van een informatiedossier als bedoeld in het tweede lid, en
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel9
  - number: 9.1.b
    text: |-
      een vergunning dan wel nieuwe vergunning voor indienststelling, indien Onze Minister die krachtens het derde lid
      heeft geëist.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel9
  - number: '9.2'
    text: |-
      Degene die de verbetering of vernieuwing bij hoofdspoorweginfrastructuur aanbesteedt, dient bij Onze Minister een
      informatiedossier in waarin het project beschreven wordt.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel9
  - number: '9.3'
    text: |-
      Onze Minister eist op basis van het informatiedossier, bedoeld in het tweede lid, een vergunning respectievelijk
      een nieuwe vergunning voor indienststelling, indien de omvang van de voorgenomen verbetering of vernieuwing of de
      mogelijke gevolgen voor de veiligheid van een betrokken subsysteem dat noodzakelijk maakt of maken.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel9
  - number: '9.4'
    text: |-
      [Artikel 8, tweede, derde en zesde lid][ref1] en het krachtens artikel 8, zesde lid, bepaalde zijn van toepassing
      op de verlening van de vergunning respectievelijk van de nieuwe vergunning voor indienststelling, bedoeld in het
      derde lid, met dien verstande dat die leden van dat artikel toepassing vinden op de verbetering of vernieuwing.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel8
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '9.5'
    text: |-
      Onze Minister kan op aanvraag op andere gronden dan genoemd in artikel 9, eerste lid, van richtlijn 2008/57/EG,
      met inachtneming van artikel 20 van die richtlijn, een of meer technische specificaties inzake interoperabiliteit,
      geheel of gedeeltelijk buiten toepassing laten.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel9
  - number: '9.6'
    text: |-
      Het voldoen van het verbeterde of vernieuwde subsysteem aan de krachtens het vierde lid geldende eisen blijkt uit
      de toetsing van een aangemelde instantie of van een keuringsinstantie.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel9
  - number: '12.1'
    text: |-
      Een EG-keuringsverklaring als bedoeld in [artikel 8, vierde lid][ref1], voldoet aan bijlage V van richtlijn
      2008/57/EG.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel8
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '12.2'
    text: |-
      De afgifte van een EG-keuringsverklaring als bedoeld in [artikel 8, vierde lid][ref1], geschiedt in overeenstemming
      met artikel 18 en bijlage VI van richtlijn 2008/57/EG.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel8
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '12.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de afgifte van de EG-
      keuringsverklaring, bedoeld in [artikel 8, vierde lid][ref1] en de verklaring, bedoeld in artikel 8, vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel8
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '12.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de verlening en regels
      over de aanvraag van de vergunning voor indienststelling, bedoeld in [artikel 8, eerste lid][ref1], en van de
      vergunning of nieuwe vergunning voor indienststelling, bedoeld in [artikel 9, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel9
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0015007
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '12.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over het registeren of bewaren van
      gegevens over:
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel12
  - number: 12.5.a
    text: |-
      de afgifte van de EG-keuringsverklaring, bedoeld in [artikel 8, vierde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel8
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 12.5.b
    text: |-
      de afgifte van de verklaring, bedoeld in [artikel 8, vijfde lid][ref1], of [artikel 9, zesde lid][ref2], en


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel9
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0015007
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 12.5.c
    text: |-
      de aanvraag en de verlening van de vergunning voor indienststelling, bedoeld in [artikel 8, eerste lid][ref1],
      en van de vergunning voor indienststelling of van de nieuwe vergunning voor indienststelling, bedoeld in
      [artikel 9, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel9
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0015007
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '13'
    text: |-
      Het is verboden een EG-keuringsverklaring als bedoeld in [artikel 8, vierde lid][ref1], af te geven indien de
      desbetreffende subsystemen niet blijkens een geldige verklaring van een aangemelde instantie voldoen aan artikel 8,
      tweede lid, onderdelen a en b.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel8
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '16.1'
    text: |-
      Onze Minister verleent een of meer concessies voor het beheer van de hoofdspoorweginfrastructuur. Het beheer omvat
      de zorg voor:
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel16
  - number: 16.1.a
    text: de kwaliteit, betrouwbaarheid en beschikbaarheid van de infrastructuur;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel16
  - number: 16.1.b
    text: |-
      een eerlijke, niet-discriminerende verdeling van de capaciteit van de infrastructuur zowel ten behoeve van de
      beheerder als ten behoeve van spoorwegondernemingen;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel16
  - number: 16.1.c
    text: het leiden van het verkeer over de infrastructuur.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel16
  - number: '16.2'
    text: Een concessie bevat een beschrijving van de werkzaamheden waarvoor de concessie wordt verleend.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel16
  - number: '16.3'
    text: Een concessie wordt verleend voor ten minste drie jaar.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel16
  - number: '16.4'
    text: |-
      Een concessie wordt niet verleend aan een spoorwegonderneming dan met inachtneming van artikel 6, derde lid, van
      [richtlijn 91/440/EEG](31991L0440) en de artikelen 4, tweede lid, en 14, tweede lid, van [richtlijn 2001/14/EG]
      (32001L0014).
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel16
  - number: 16a.1
    text: |-
      Een beheerder beschikt bij de uitvoering van de taken, bedoeld in [artikel 16, eerste lid][ref1], anders dan ten
      behoeve van de aanleg van hoofdspoorweginfrastructuur over een geldige veiligheidsvergunning als bedoeld in artikel
      11 van richtlijn 2004/49/EG.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel16
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 16a.2
    text: |-
      Onze Minister verleent op aanvraag een veiligheidsvergunning aan de beheerder, indien hij beschikt over een
      veiligheidszorgsysteem dat:
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel16a
  - number: 16a.2.a
    text: voldoet aan artikel 9, tweede lid, en bijlage III van richtlijn 2004/49/EG, en
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel16a
  - number: 16a.2.b
    text: |-
      op zodanige wijze is geoperationaliseerd dat het een veilig beheer en gebruik van hoofdspoorweginfrastructuur
      mogelijk maakt.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel16a
  - number: 16a.3
    text: Een veiligheidsvergunning is ten hoogste vijf jaar geldig.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel16a
  - number: 16a.4
    text: |-
      Onze Minister trekt een veiligheidsvergunning in, indien het veiligheidszorgsysteem van de beheerder niet meer
      voldoet aan het tweede lid.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel16a
  - number: 16a.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gegeven over de uitvoering van dit
      artikel, waaronder:
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel16a
  - number: 16a.5.a
    text: regels ten aanzien van de aanvraag van een veiligheidsvergunning, en
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel16a
  - number: 16a.5.b
    text: nadere regels ten aanzien het veiligheidszorgsysteem.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel16a
  - number: 16b.1
    text: |-
      Een beheerder houdt een register van infrastructuurvoorzieningen dat voldoet aan artikel 35 van richtlijn 2008/57/
      EG.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel16b
  - number: 16b.2
    text: |-
      Een beheerder stelt jaarlijks een verslag op met betrekking tot de spoorwegveiligheid dat voldoet aan artikel 9,
      vierde lid, van richtlijn 2004/49/EG en zendt dat verslag voor 1 juli aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel16b
  - number: '17.1'
    text: |-
      Aan de concessie worden in elk geval voorschriften, onder meer houdende prestatie-indicatoren, verbonden om te
      waarborgen dat:
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel17
  - number: 17.1.a
    text: de infrastructuur in goede staat verkeert en geschikt is voor het verkeer of ander gebruik waarvoor zij bestemd is;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel17
  - number: 17.1.b
    text: de infrastructuur veilig en doelmatig bereden kan worden zonder overmatige slijtage aan spoorvoertuigen;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel17
  - number: 17.1.c
    text: |-
      de risico's van het gebruik en beheer voor de veiligheid van hoofdspoorwegen worden geanalyseerd en dat passende
      maatregelen worden genomen, waaronder het zo nodig buiten dienst stellen van een gedeelte van de hoofdspoorweg,
      om deze risico's afdoende te beheersen, waarbij rekening wordt gehouden met de specifieke vereisten van de te
      verwachten bedrijfsvoering en de stand der techniek;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel17
  - number: 17.1.d
    text: voldaan wordt aan de [richtlijnen 91/440/EEG](31991L0440) en [2001/14/EG](32001L0014);
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel17
  - number: 17.1.e
    text: de beheerder financieel draagkrachtig en beroepsbekwaam is.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel17
  - number: '17.2'
    text: 'Aan de concessie worden voorts in elk geval voorschriften verbonden ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel17
  - number: 17.2.a
    text: door de beheerder te berekenen tarieven voor diensten aan derden;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel17
  - number: 17.2.b
    text: 'het verstrekken van gegevens aan Onze Minister ten behoeve van:'
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel17
  - number: 17.2.b.1°
    text: het toezicht op de naleving van de concessie;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel17
  - number: 17.2.b.2°
    text: |-
      het voldoen aan de verplichtingen die Onze Minister met betrekking tot de hoofdspoorwegen heeft ingevolge de
      [artikelen 11.6][ref1] en [11.11 van de Wet milieubeheer][ref2] ter uitvoering van richtlijn nr. 2002/49/EG van
      het Europees Parlement en de Raad van de Europese Unie van 25 juni 2002 inzake de evaluatie en de beheersing van
      omgevingslawaai (PbEG L 189);


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '11'
  - number: 17.2.b.3°
    text: |-
      het voldoen aan de verplichtingen die Onze Minister met betrekking tot de hoofdspoorwegen heeft ingevolge
      [artikel 12.13, eerste lid, van de Wet milieubeheer][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel12
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '12'
  - number: 17.2.c
    text: |-
      het opstellen van een financiële verantwoording van het uitvoeren van de concessie, welke verantwoording gescheiden
      is van die voor andere werkzaamheden, en
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel17
  - number: 17.2.d
    text: |-
      wijzigingen van hoofdspoorweginfrastructuur die de beheerder aanbesteedt en als een verbetering of een vernieuwing
      als bedoeld in [artikel 9, eerste lid][ref1], worden aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel9
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '17.3'
    text: |-
      Een wijziging van de technische of functionele eigenschappen van de hoofdspoorweginfrastructuur die de
      gebruiksmogelijkheden van de hoofdspoorwegen aanmerkelijk verandert, behoeft de voorafgaande instemming van Onze
      Minister. De beheerder vermeldt in zijn verzoek om instemming de zienswijzen van betrokken gerechtigden als bedoeld
      in [artikel 57][ref1] en, voorzover de wijziging afwijkt van die zienswijzen, een deugdelijke motivering van die
      afwijking.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel57
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '57'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '17.4'
    text: |-
      Het derde lid geldt niet voor een wijziging van de technische of functionele eigenschappen, indien het verbetering
      of vernieuwing betreft waarvoor Onze Minister een vergunning voor indienststelling respectievelijk nieuwe
      vergunning voor indienststelling als bedoeld in [artikel 9, derde lid][ref1], heeft verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel9
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '18.1'
    text: |-
      Onze Minister kan een concessie geheel of gedeeltelijk intrekken indien de beheerder de concessie of een voor de
      beheerder geldend wettelijk voorschrift niet naleeft.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel18
  - number: '18.2'
    text: |-
      Onze Minister gaat niet tot intrekking over dan nadat hij de beheerder de gelegenheid heeft geboden om binnen
      een daartoe te bepalen termijn zijn handelen alsnog in overeenstemming te brengen met de concessie, dan wel het
      wettelijk voorschrift.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel18
  - number: '18.3'
    text: |-
      Voordat Onze Minister een concessie verleent, wijzigt of geheel of gedeeltelijk intrekt, stelt hij betrokken
      gerechtigden als bedoeld in [artikel 57][ref1] in de gelegenheid om gedurende een door Onze Minister daarbij te
      bepalen termijn van ten hoogste drie weken hun zienswijze naar voren te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel57
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '57'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '18.4'
    text: |-
      Een concessie wordt niet eerder verleend dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal
      is overgelegd.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel18
  - number: '18.5'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over het verlenen of wijzigen van een
      concessie en over de aan een concessie te verbinden voorschriften.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel18
  - number: '19.1'
    text: |-
      Het is verboden zonder vergunning van Onze Minister gebruik te maken van hoofdspoorwegen en de daarnaast gelegen
      gronden door anders dan waartoe deze zijn bestemd:
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel19
  - number: 19.1.a
    text: |-
      binnen de begrenzing van de hoofdspoorweg aan, op, in, onder, boven of naast de hoofdspoorweg, bouwwerken of
      andere opstallen op te richten of werken, inrichtingen, kabels, leidingen of beplantingen aan te brengen, te doen
      aanbrengen of te hebben, dan wel daarmee verband houdende werkzaamheden uit te voeren of te doen uitvoeren;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel19
  - number: 19.1.b
    text: |-
      binnen de begrenzing van de hoofdspoorweg, op, in, onder of naast de hoofdspoorweg vaste stoffen of vloeistoffen
      te storten of te doen storten, met uitzondering van vaste stoffen of vloeistoffen die vrijkomen bij de normale
      bedrijfsvoering van spoorvoertuigen;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel19
  - number: 19.1.c
    text: |-
      binnen de begrenzing van de hoofdspoorweg, op, in, onder, boven of naast de hoofdspoorweg, voorwerpen te plaatsen
      of neer te leggen of graafwerk te verrichten of deze activiteiten te doen uitvoeren;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel19
  - number: 19.1.d
    text: binnen 14 meter van de begrenzing van de hoofdspoorweg licht ontvlambare stoffen te hebben of op te slaan.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel19
  - number: '19.2'
    text: |-
      Een vergunning op grond van het eerste lid kan onder beperkingen worden verleend. Aan de vergunning kunnen
      voorschriften worden verbonden, onder meer ter bescherming van de hoofdspoorweg, in het belang van een veilig en
      doelmatig gebruik ervan of het financieel belang van de Staat.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel19
  - number: '19.3'
    text: Het eerste lid is niet van toepassing op het uitvoeren van het beheer van de hoofdspoorweginfrastructuur.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel19
  - number: '20.1'
    text: |-
      Bij een hoofdspoorweg wordt de begrenzing van de hoofdspoorweg, bedoeld in [artikel 19][ref1], aan weerszijden
      gevormd door een lijn liggend op een afstand:


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel19
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '19'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 20.1.a
    text: |-
      van elf meter bij een hoofdspoorweg op maaiveldniveau gemeten vanaf het hart van het buitenste spoor, zijnde een
      denkbeeldige lijn in de lengterichting van het spoor midden tussen beide spoorstaven;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel20
  - number: 20.1.b
    text: van zes meter bij een hoofdspoorweg in ingraving gemeten uit de bovenzijde van de ingraving;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel20
  - number: 20.1.c
    text: van zes meter bij een hoofdspoorweg in ophoging gemeten uit de teen van het talud;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel20
  - number: 20.1.d
    text: |-
      die gelijk is aan de afstand tussen de bovenkant van de spoorstaaf en het maaiveld horizontaal gemeten vanaf de
      buitenste wand van de tunnel, in een verticale lijn tot het maaiveld, waarbij deze grenzen ten minste gelegen zijn
      op elf meter uit het hart van het spoor, indien het betreft een geboorde, ingegraven of afgezonken tunnel bij een
      hoofdspoorweg;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel20
  - number: 20.1.e
    text: |-
      bij een hoofdspoorweg op of in een vaste constructie anders dan bedoeld in de onderdelen a tot en met d, van zes
      meter gemeten vanaf een horizontale lijn die ligt op tweemaal de afstand tussen de bovenkant van de spoorstaaf en
      het maaiveld vanaf de buitenste rand van de constructie, waarbij deze grenzen ten minste gelegen zijn op 11 meter
      uit het hart van het buitenste spoor.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel20
  - number: '20.2'
    text: |-
      Indien bij een hoofdspoorweg in ingraving of in ophoging de afstand tussen het hart van het buitenste spoor en de
      bovenkant van de ingraving of teen van het talud minder bedraagt dan vijf meter, wordt de begrenzing vastgesteld
      overeenkomstig het eerste lid, onderdeel a.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel20
  - number: '20.3'
    text: |-
      Indien de bodemgesteldheid daartoe aanleiding geeft, kan bij besluit van Onze Minister, gehoord de beheerder, een
      begrenzing worden vastgesteld die afwijkt van het eerste of tweede lid.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel20
  - number: '20.4'
    text: |-
      In afwijking van het eerste lid, onderdeel a, wordt de begrenzing van een deel van de hoofdspoorwegen die
      uitsluitend of overwegend bestemd zijn voor het verrichten van goederenvervoer ten behoeve van de lokale
      ontsluiting van haven- en industriegebieden, gevormd door een lijn liggend op een afstand van drie meter op
      maaiveldniveau, gemeten vanaf het hart van het buitenste spoor. Wanneer ingevolge [artikel 2][ref1] of [124][ref2]
      een spoorweg wordt aangewezen als hoofdspoorweg, wordt daarbij bepaald of de hoofdspoorweg onder het bereik van dit
      lid valt.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel124
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0015007
        artikel: '124'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: '21.1'
    text: |-
      Het is verboden zaken te bouwen, neer te leggen, op te richten of aan te leggen die een meter of hoger reiken dan
      het maaiveld aan weerszijden van de hoofdspoorweg bij voor het openbaar verkeer openstaande overwegen buiten de
      bebouwde kom, binnen een vlak dat wordt gevormd door hoekpunten in het hart van het buitenste spoor op vijfhonderd
      meter aan weerszijden van de as van de weg en op elf meter uit het hart van het spoor in de as van de weg.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel21
  - number: '21.2'
    text: |-
      Onze Minister kan ontheffing verlenen van het in het eerste lid vervatte verbod. De ontheffing kan onder
      beperkingen worden verleend. Aan de ontheffing kunnen voorschriften worden verbonden in het belang van een veilig
      en doelmatig gebruik van de spoorweg of het financieel belang van de Staat.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel21
  - number: '21.3'
    text: |-
      In afwijking van het eerste lid wordt bij een voor het openbaar verkeer openstaande overweg buiten de bebouwde kom
      die onderdeel uitmaakt van een hoofdspoorweg, als bedoeld in [artikel 20, vierde lid][ref1], het vlak, bedoeld in
      het eerste lid, gevormd door hoekpunten in het hart van het buitenste spoor op 50 meter aan weerszijden van de as
      van de weg en op elf meter uit het hart van het spoor in de as van de weg.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel20
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '20'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '22.1'
    text: 'Het is verboden:'
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel22
  - number: 22.1.a
    text: |-
      anders dan als rechtmatige gebruiker in te grijpen in de bediening of de werking van installaties van de
      hoofdspoorweginfrastructuur;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel22
  - number: 22.1.b
    text: |-
      de hoofdspoorweginfrastructuur of delen daarvan te beschadigen, te vernielen, te verwijderen, af te breken, te
      verstoren, te verplaatsen of in enig opzicht te wijzigen;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel22
  - number: 22.1.c
    text: |-
      zich op of langs gedeelten van een hoofdspoorweg, met uitzondering van een perron, die niet zijn gelegen in een
      gelijkvloerse kruising met een weg of in een voor het openbaar verkeer openstaande weg, te bevinden of daarop of
      daarlangs dieren te drijven of te laten lopen;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel22
  - number: 22.1.d
    text: |-
      enige handeling op of nabij de hoofdspoorweg te verrichten waardoor het beheer van de hoofdspoorweginfrastructuur
      kan worden gehinderd of belemmerd.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel22
  - number: '22.2'
    text: 'Het eerste lid is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel22
  - number: 22.2.a
    text: het uitvoeren van het beheer;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel22
  - number: 22.2.b
    text: de uitoefening van een veiligheidsfunctie;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel22
  - number: 22.2.c
    text: de uitoefening van een wettelijke taak;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel22
  - number: 22.2.d
    text: |-
      het uitvoeren van werkzaamheden in opdracht van een spoorwegonderneming die beschikt over een veiligheidsattest als
      bedoeld in [artikel 32, eerste lid][ref1], of een proefattest als bedoeld in [artikel 34][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel34
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '32'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0015007
        artikel: '34'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 22.2.e
    text: |-
      de uitoefening van het houderschap van een spoorvoertuig en de uitoefening van werkzaamheden aan een spoorvoertuig
      in opdracht van de houder, en
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel22
  - number: 22.2.f
    text: |-
      de uitoefening van opleidingsactiviteiten voor een veiligheidsfunctie en de beoordeling op het voldoen aan de eisen
      voor een veiligheidsfunctie.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel22
  - number: '22.3'
    text: |-
      Onze Minister kan ontheffing verlenen van het in het eerste lid vervatte verbod.
      [Artikel 21, tweede lid, tweede en derde volzin][ref1], zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel21
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '23'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld ter uitvoering van de
      [artikelen 19 tot en met 22][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel19
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '19'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '24.1'
    text: |-
      Onverminderd de bij of krachtens andere wetten ter zake gegeven voorschriften wordt aanraking, doorsnijding of
      overbrugging van andere infrastructuur van openbaar nut door hoofdspoorwegen waarvan de aanleg vanwege het Rijk
      is opgedragen of toegestaan, gedoogd door de rechthebbende ten aanzien van die andere infrastructuur. Onder
      infrastructuur van openbaar nut wordt in ieder geval begrepen infrastructuur waarvan het beheer bij of krachtens
      wet is opgedragen en infrastructuur in beheer bij een openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel24
  - number: '24.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over financiering, onderhoud,
      instandhouding, aanleg, uitbreiding, gedeeld gebruik en verdeling van de gebruiksmogelijkheden van kunstwerken
      voorzover deze dienen tot aanraking, doorsnijding of overbrugging als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel24
  - number: '24.3'
    text: |-
      Een hoofdspoorweg die is of wordt aangelegd, hersteld, vernieuwd of uitgebreid, wordt voor de toepassing van de
      [Belemmeringenwet Verordeningen][ref1] en de [Belemmeringenwet Privaatrecht][ref2] aangemerkt als openbaar werk van
      algemeen nut.


      [ref1]: https://wetten.overheid.nl/BWBR0001865
      [ref2]: https://wetten.overheid.nl/BWBR0001936
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0001865
      - id: ref2
        bwb_id: BWBR0001936
  - number: '25'
    text: |-
      Deze paragraaf geldt onverkort voor de rechthebbende ten aanzien van de onder of naast de
      hoofdspoorweginfrastructuur gelegen grond, de daarin gelegen werken en daarop gelegen opstallen.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel25
  - number: '26.1'
    text: |-
      De rechthebbende ten aanzien van een rechtstreeks aan de hoofdspoorweg gelegen station draagt ervoor zorg dat
      reizigers, gehandicapten daaronder begrepen, via de in het station aanwezige hallen, tunnels, trappen en liften,
      met logische en overzichtelijke routes, een veilige en adequate toegang hebben tot perrons en spoorvoertuigen.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel26
  - number: '26.2'
    text: |-
      Onder station wordt in het eerste lid verstaan: een gebouw of werk dat blijkens zijn constructie en inrichting
      geheel of gedeeltelijk is bestemd voor aankomst en vertrek van spoorvoertuigen met het oog op het in-, uit- of
      overstappen van reizigers.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel26
  - number: '26.3'
    text: |-
      Indien de veilige en adequate toegang tot perrons, laad- of losplaatsen of spoorvoertuigen in het gedrang komt of
      dreigt te komen, geeft Onze Minister aan de betrokken rechthebbende een bindende aanwijzing ter waarborging van die
      toegang. Tevens kan Onze Minister aan de betrokken rechthebbende een bindende aanwijzing geven met betrekking tot
      fysieke voorzieningen ter bevordering van de sociale veiligheid op de stations.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel26
  - number: '26.4'
    text: Desgevraagd adviseert de beheerder Onze Minister over de toepassing van het derde lid.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel26
  - number: '27.1'
    text: Een spoorwegonderneming heeft op niet-discriminerende grondslag recht op toegang tot hoofdspoorwegen.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel27
  - number: '27.2'
    text: 'Geen toegang tot hoofdspoorwegen heeft een spoorwegonderneming:'
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel27
  - number: 27.2.a
    text: die niet beschikt over een geldige bedrijfsvergunning;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel27
  - number: 27.2.b
    text: die niet beschikt over een geldig veiligheidsattest of proefattest;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel27
  - number: 27.2.c
    text: |-
      die niet voldoet aan de voor haar ingevolge [artikel 55][ref1] geldende verzekeringsplicht;


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel55
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '55'
        hoofdstuk: '3'
        paragraaf: '6'
  - number: 27.2.d
    text: |-
      indien het recht op die toegang niet rechtstreeks voortvloeit uit een toegangsovereenkomst als bedoeld in
      [artikel 59][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel59
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '59'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 27.2.e
    text: die anderszins niet gerechtigd is van de hoofdspoorweg gebruik te maken.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel27
  - number: '27.3'
    text: |-
      Bij algemene maatregel van bestuur kan met inachtneming van de artikelen 1 en 2 van richtlijn 95/18/EG onder
      daarbij te stellen voorwaarden en beperkingen vrijstelling worden verleend van het tweede lid, onderdeel a,
      en met inachtneming van artikel 3 van richtlijn 2004/49/EG onder daarbij te stellen voorwaarden en beperkingen
      vrijstelling worden verleend van het tweede lid, onderdeel b.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel27
  - number: '28.1'
    text: |-
      Onze Minister verleent op aanvraag een bedrijfsvergunning aan een in Nederland gevestigde spoorwegonderneming,
      indien deze voldoet aan de vereisten van goede naam, financiële draagkracht en beroepsbekwaamheid alsmede de uit
      [artikel 55][ref1] voortvloeiende verzekeringsplicht.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel55
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '55'
        hoofdstuk: '3'
        paragraaf: '6'
  - number: '28.2'
    text: |-
      Onze Minister kan voor bij of krachtens algemene maatregel van bestuur omschreven soorten van gebruik van de
      hoofdspoorweg, bij de verlening van een bedrijfsvergunning een of meer van de bij of krachtens algemene maatregel
      van bestuur aangewezen, in het eerste lid bedoelde eisen geheel of gedeeltelijk buiten toepassing laten. Alsdan is
      een zodanige beperkte bedrijfsvergunning slechts geldig voor het gebruik waarvoor deze is verleend.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel28
  - number: '28.3'
    text: Onze Minister beslist binnen dertien weken op de aanvraag.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel28
  - number: '28.4'
    text: Aan de vergunning kunnen voorschriften worden verbonden. De vergunning wordt verleend voor onbepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel28
  - number: '28.5'
    text: |-
      Onze Minister kan ambtshalve of op aanvraag van de vergunninghouder de vergunning wijzigen, alsnog voorschriften
      aan de vergunning verbinden en de aan de vergunning verbonden voorschriften aanvullen dan wel wijzigen.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel28
  - number: '29'
    text: 'Onze Minister schorst de bedrijfsvergunning of trekt deze in, indien:'
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel29
  - number: 29.a
    text: |-
      de vergunninghouder niet meer voldoet aan de bij of krachtens [artikel 28][ref1] toepasselijke eisen of
      voorschriften;


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel28
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 29.b
    text: |-
      de veiligheid van het spoorverkeer door wijziging van de rechtspositie van de vergunninghouder ingeval van fusie of
      bedrijfsovername naar het oordeel van Onze Minister niet langer is gewaarborgd of
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel29
  - number: 29.c
    text: |-
      bij herhaling bij onherroepelijk rechterlijk vonnis is vastgesteld dat de vergunninghouder of zijn bestuurders
      het bepaalde bij of krachtens deze wet dan wel de toepasselijke voorschriften inzake arbeidsomstandigheden of
      arbeidstijden hebben overtreden, dan wel bij onherroepelijk vonnis is vastgesteld dat deze het bepaalde bij of
      krachtens deze wet dan wel de toepasselijke voorschriften inzake arbeidsomstandigheden of arbeidstijden in ernstige
      mate hebben overtreden.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel29
  - number: '30.1'
    text: |-
      Een vergunning als bedoeld in artikel 2, onderdeel b, van [richtlijn 95/18/EG](31995L0018) die is verleend door een
      bevoegde instantie van een andere lidstaat aan een aldaar gevestigde spoorwegonderneming, wordt voor de toepassing
      van deze wet gelijkgesteld met een bedrijfsvergunning, verleend op grond van [artikel 28, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel28
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '30.2'
    text: |-
      Met een bedrijfsvergunning verleend op grond van [artikel 28, eerste lid][ref1], worden voorts voor de toepassing
      van deze wet gelijkgesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel28
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 30.2.a
    text: |-
      de bij ministeriële regeling omschreven documenten die in het buitenland door het aldaar bevoegde gezag
      zijn afgegeven en die in voldoende mate kunnen gelden als bewijs dat ten minste wordt voldaan aan de in
      [artikel 28, eerste lid][ref1], bedoelde eisen;


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel28
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 30.2.b
    text: |-
      een besluit van Onze Minister waarin ten aanzien van een in het buitenland gevestigde spoorwegonderneming is
      verklaard dat ten minste wordt voldaan aan de in [artikel 28, eerste lid][ref1], vermelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel28
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '30.3'
    text: |-
      [Artikel 29][ref1] is van overeenkomstige toepassing op de gelijkstelling krachtens het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel29
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '31'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gegeven over de uitvoering van deze paragraaf,
      waaronder regels over:
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel31
  - number: 31.a
    text: |-
      de toepassing van de in [artikel 28][ref1], eerste lid, bedoelde eisen;


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel28
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 31.b
    text: de verlening, weigering, wijziging, schorsing of intrekking van een bedrijfsvergunning;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel31
  - number: 31.c
    text: de aan de bedrijfsvergunning te verbinden voorschriften en beperkingen.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel31
  - number: '32.1'
    text: 'Onze Minister verleent op aanvraag een veiligheidsattest aan de aanvrager, indien deze aantoont:'
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel32
  - number: 32.1.a
    text: |-
      bij het voorgenomen gebruik van de spoorweg te kunnen voldoen aan de bij of krachtens dit hoofdstuk gestelde
      voorschriften en
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel32
  - number: 32.1.b
    text: door toepassing van een adequaat veiligheidszorgsysteem veilig gebruik te kunnen maken van de spoorweg.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel32
  - number: '32.2'
    text: |-
      Onze Minister beslist binnen dertien weken op de aanvraag. Indien de beschikking niet binnen dertien weken
      kan worden gegeven, stelt Onze Minister de aanvrager daarvan in kennis en noemt daarbij een redelijke termijn
      waarbinnen de beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel32
  - number: '33.1'
    text: Het veiligheidsattest is ten hoogste vijf jaar geldig.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel33
  - number: '33.2'
    text: |-
      De attesthouder past een adequaat veiligheidszorgsysteem toe, met behulp waarvan wordt gewaarborgd dat de
      spoorwegonderneming:
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel33
  - number: 33.2.a
    text: |-
      bij de normale bedrijfsvoering en bij voorzienbare afwijkingen daarvan geen schade berokkent en niemand onnodig
      hindert of in gevaar brengt en zorgt dat het spoorverkeer zo veel mogelijk zonder verstoringen kan worden
      afgewikkeld;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel33
  - number: 33.2.b
    text: |-
      rekening houdt met de specifieke vereisten wanneer de normale bedrijfsvoering raakt aan die van andere gebruikers
      van de spoorweg of van de beheerder;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel33
  - number: 33.2.c
    text: |-
      de aan de bedrijfsvoering verbonden risico's onderkent en passende maatregelen neemt om deze afdoende te beheersen
      en daarbij rekening houdt met de stand der techniek en de binnen de bedrijfstak aanwezige kennis en richtsnoeren
      voor een veilige bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel33
  - number: 33.2.d
    text: |-
      procedures vaststelt en hanteert voor het nemen van corrigerende maatregelen bij afwijkingen en incidenten, alsmede
      voor het voortdurend verbeteren van het veiligheidsniveau met het oog op zich wijzigende omstandigheden en op grond
      van opgedane ervaringen;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel33
  - number: 33.2.e
    text: |-
      ervoor zorg draagt dat werknemers met een veiligheidsfunctie met het oog op het behouden van hun geschiktheid,
      kennis en bekwaamheid voor de desbetreffende functie de noodzakelijke oefening hebben en de noodzakelijke nadere of
      aanvullende scholing, opleiding en studie volgen.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel33
  - number: '33.3'
    text: Het veiligheidszorgsysteem is passend voor de aard en de omvang van de spoorwegonderneming.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel33
  - number: '33.4'
    text: |-
      Aan het veiligheidsattest kunnen beperkingen en voorschriften worden verbonden in het belang van de veiligheid op
      en in de directe nabijheid van de spoorweg.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel33
  - number: '33.5'
    text: 'Onze Minister kan het veiligheidsattest schorsen of intrekken:'
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel33
  - number: 33.5.a
    text: wegens handelen in strijd met dit hoofdstuk;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel33
  - number: 33.5.b
    text: in het belang van de veiligheid op en in de directe nabijheid van de spoorweg;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel33
  - number: 33.5.c
    text: indien de bedrijfsvergunning van de attesthouder is geschorst of ingetrokken.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel33
  - number: '33.6'
    text: |-
      Onze Minister kan het veiligheidsattest of de daaraan verbonden beperkingen en voorschriften ambtshalve of op
      aanvraag wijzigen, met inachtneming van het belang van de veiligheid op en in de directe nabijheid van de spoorweg.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel33
  - number: '33.7'
    text: Overtreding van de voorschriften, bedoeld in het vierde lid, is verboden.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel33
  - number: '34.1'
    text: |-
      Onze Minister kan aan degene die een veiligheidsattest heeft aangevraagd of aan de attesthouder die een wijziging
      van het veiligheidsattest heeft aangevraagd een proefattest verlenen.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel34
  - number: '34.2'
    text: |-
      Het proefattest wordt verleend met het oog op het opdoen van ervaring of het testen van procedures of
      spoorvoertuigen ten behoeve van verlening of wijziging van een veiligheidsattest.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel34
  - number: '34.3'
    text: |-
      Het proefattest is ten hoogste dertien weken geldig en vervalt van rechtswege bij de verlening of de wijziging,
      bedoeld in het tweede lid. Indien toepassing is gegeven aan [artikel 32, tweede lid, tweede volzin][ref1], vervalt
      het proefattest met ingang van de dag na de laatste dag van de krachtens die bepaling gestelde termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel32
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '32'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '34.4'
    text: |-
      [Artikel 33, vierde en vijfde lid][ref1], is op het proefattest van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel33
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '35'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gegeven over de uitvoering van deze paragraaf,
      waaronder regels ten aanzien van:
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel35
  - number: 35.a
    text: de verlening, weigering, wijziging, schorsing of intrekking van een veiligheidsattest en van een proefattest;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel35
  - number: 35.b
    text: de aan een veiligheidsattest en een proefattest te verbinden voorschriften en beperkingen;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel35
  - number: 35.c
    text: de bedrijfsprocessen die ten minste in het veiligheidszorgsysteem zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel35
  - number: '36.1'
    text: |-
      Het is een spoorwegonderneming verboden om, anders dan voor het testen, van hoofdspoorweginfrastructuur gebruik te
      maken, met een spoorvoertuig waarvoor Onze Minister geen vergunning voor indienststelling als bedoeld in het derde
      lid respectievelijk aanvullende vergunning voor indienststelling als bedoeld in het vijfde lid heeft verleend.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel36
  - number: '36.2'
    text: |-
      Het eerste lid geldt niet voor bij algemene maatregel van bestuur met inachtneming van artikel 21 van richtlijn
      2008/57/EG, aangewezen spoorvoertuigen.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel36
  - number: '36.3'
    text: 'Onze Minister verleent, na de beheerder te hebben gehoord, een vergunning voor indienststelling, indien:'
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel36
  - number: 36.3.a
    text: |-
      elk subsysteem van het spoorvoertuig voldoet aan de daarvoor geldende technische specificaties inzake
      interoperabiliteit;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel36
  - number: 36.3.b
    text: |-
      elk subsysteem van het spoorvoertuig voldoet aan de bij regeling van Onze Minister, met inachtneming van artikel 17
      van richtlijn 2008/57/EG vastgestelde, voor dat subsysteem geldende voorschriften ter uitvoering van de essentiële
      eisen van richtlijn 2008/57/EG;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel36
  - number: 36.3.c
    text: |-
      elk subsysteem van het spoorvoertuig voldoet aan de, bij regeling van Onze Minister daarvoor gegeven
      voorschriften ter uitwerking van de in een of meer technische specificaties inzake interoperabiliteit, bedoeld
      in onderdeel a, opgenomen open punten, anders dan ten behoeve van de verenigbaarheid van een spoorvoertuig met
      de hoofdspoorweginfrastructuur;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel36
  - number: 36.3.d
    text: elk subsysteem voldoet aan de eisen, bedoeld in artikel 15, eerste en tweede lid, van richtlijn 2008/57/EG, en
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel36
  - number: 36.3.e
    text: |-
      het spoorvoertuig voldoet aan de bij regeling van Onze Minister gestelde voorschriften ten behoeve van de
      verenigbaarheid van een spoorvoertuig met de hoofdspoorweginfrastructuur.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel36
  - number: '36.4'
    text: |-
      Onze Minister kan op aanvraag, met inachtneming artikel 9 van richtlijn 2008/57/EG, een voor een subsysteem
      geldende technische specificatie inzake interoperabiliteit buiten toepassing laten.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel36
  - number: '36.5'
    text: 'Onze Minister verleent na de beheerder te hebben gehoord, een aanvullende vergunning voor indienststelling indien:'
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel36
  - number: 36.5.a
    text: het spoorvoertuig reeds in een andere staat is toegelaten;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel36
  - number: 36.5.b
    text: |-
      een subsysteem van het spoorvoertuig dat is voorzien van een geldige EG-keuringsverklaring voldoet aan de in
      de voor een of meer voor het subsysteem geldende TSI’s opgenomen voorschriften voor de voor Nederland geldende
      specifieke gevallen;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel36
  - number: 36.5.c
    text: |-
      hij voor een subsysteem van het spoorvoertuig zonder geldige EG-keuringsverklaring als bedoeld in artikel 18 van
      richtlijn 2008/57/EG geen belangrijk veiligheidsrisico aantoont, en
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel36
  - number: 36.5.d
    text: het spoorvoertuig voldoet aan de voorschriften, bedoeld in het derde lid, onderdeel e.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel36
  - number: '36.6'
    text: |-
      Het voldoen aan de voorschriften, bedoeld in het derde lid, onderdelen a en b, blijkt uit een geldige EG-
      keuringsverklaring als bedoeld in artikel 18 van richtlijn 2008/57/EG.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel36
  - number: '36.7'
    text: |-
      Het voldoen aan de voorschriften, bedoeld in het derde lid, onderdelen c en e, blijkt uit een geldige verklaring
      van een aangemelde instantie of van een keuringsinstantie.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel36
  - number: '36.8'
    text: |-
      Onze Minister kan aan de vergunning voor indienststelling respectievelijk aanvullende vergunning voor
      indienststelling ten behoeve van de verenigbaarheid van het spoorvoertuig met de hoofdspoorweginfrastructuur
      voorschriften en beperkingen verbinden.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel36
  - number: '36.9'
    text: |-
      Onze Minister kan op aanvraag ontheffing verlenen van de voorschriften, bedoeld in het derde lid, onderdelen c
      en e.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel36
  - number: '36.10'
    text: |-
      Onze Minister kan op aanvraag met inachtneming van artikel 1, derde lid, van richtlijn 2008/57/EG, onder daartoe
      bij ministeriële regeling gestelde voorwaarden en beperkingen, ontheffing verlenen van het derde lid, onderdelen a
      en b, en van het vijfde lid, onderdeel b.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel36
  - number: '37.1'
    text: |-
      Het is een spoorwegonderneming verboden om van hoofdspoorweginfrastructuur gebruik te maken met een spoorvoertuig
      dat niet in het register, bedoeld in het tweede lid, dan wel in het register van een andere staat is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel37
  - number: '37.2'
    text: Onze Minister houdt het register, bedoeld in artikel 33 van richtlijn 2008/57/EG.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel37
  - number: '37.3'
    text: |-
      Onze Minister draagt op aanvraag zorg voor de inschrijving van spoorvoertuigen in het register, bedoeld in het
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel37
  - number: '37.4'
    text: De aanvrager voegt bij de aanvraag voor de inschrijving de bij regeling van Onze Minister bepaalde gegevens.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel37
  - number: '37.5'
    text: |-
      De houder meldt de wijzigingen met betrekking tot de gegevens, bedoeld in het vierde lid, die na de inschrijving
      optreden, binnen twee weken aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel37
  - number: '37.6'
    text: |-
      Onze Minister kent aan een in te schrijven spoorvoertuig dat niet volledig in een register van een andere staat
      is ingeschreven een Europees voertuignummer toe. De houder brengt het toegekende voertuignummer aan op het
      spoorvoertuig.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel37
  - number: '37.7'
    text: 'Onze Minister schrapt de inschrijving van een spoorvoertuig:'
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel37
  - number: 37.7.a
    text: op verzoek van de houder;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel37
  - number: 37.7.b
    text: indien het spoorvoertuig definitief buiten gebruik wordt gesteld, of
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel37
  - number: 37.7.c
    text: in andere bij regeling van Onze Minister aangegeven gevallen.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel37
  - number: '37.8'
    text: |-
      De houder van een spoorvoertuig is degene die als houder in het register, bedoeld in het tweede lid, is
      ingeschreven.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel37
  - number: 37a.1
    text: |-
      Onze Minister verleent op aanvraag een vergunning voor indienststelling of een aanvullende vergunning voor
      indienststelling voor een type indien hij voor een spoorvoertuig van dat type een dergelijke vergunning heeft
      verleend.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel37a
  - number: 37a.2
    text: |-
      Onze Minister verleent in afwijking van [artikel 36, derde en vijfde lid][ref1], een vergunning voor
      indienststelling respectievelijk een aanvullende vergunning voor indienststelling, indien het spoorvoertuig
      overeenstemt met een type dat voorzien is van een geldige dergelijke vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel36
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 37a.3
    text: |-
      Onze Minister kan de vergunning voor indienststelling voor een type respectievelijk de aanvullende vergunning voor
      indienststelling voor een type intrekken, indien het type niet langer voldoet aan de krachtens [artikel 36][ref1]
      geldende eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel36
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 37a.4
    text: |-
      De overeenstemming met een type blijkt uit een verklaring van overeenstemming die voldoet aan de daartoe bij
      regeling van Onze Minister gestelde voorschriften.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel37a
  - number: 37a.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over het onderzoek naar de overeenstemming
      van de productie van het spoorvoertuig waarvoor een vergunning voor indienststelling respectievelijk aanvullende
      vergunning voor indienststelling van het type is verleend, met dat type.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel37a
  - number: 37b.1
    text: |-
      Het is een spoorwegonderneming verboden om met een verbeterd of vernieuwd spoorvoertuig dat volledig in het
      register, bedoeld in [artikel 37, tweede lid][ref1], is ingeschreven, van hoofdspoorweginfrastructuur gebruik te
      maken zonder:


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel37
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel37b
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '37'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 37b.1.a
    text: voorafgaande indiening van een informatiedossier als bedoeld in het tweede lid, en
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel37b
  - number: 37b.1.b
    text: |-
      een vergunning dan wel nieuwe vergunning voor indienststelling, indien Onze Minister die krachtens het derde lid,
      heeft geëist.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel37b
  - number: 37b.2
    text: |-
      Degene die de verbetering of vernieuwing bij een spoorvoertuig aanbesteedt dient bij Onze Minister een
      informatiedossier in, waarin het project beschreven wordt.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel37b
  - number: 37b.3
    text: |-
      Onze Minister eist op basis van het informatiedossier, bedoeld in het tweede lid, een vergunning voor
      indienststelling respectievelijk een nieuwe vergunning voor indienststelling indien de omvang van de voorgenomen
      verbetering of vernieuwing, de mogelijke gevolgen voor de veiligheid van een betrokken subsysteem of de gevolgen
      voor de verenigbaarheid van het spoorvoertuig met de hoofdspoorweginfrastructuur dat noodzakelijk maakt of maken.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel37b
  - number: 37b.4
    text: |-
      [Artikel 36, derde, vierde en tiende lid][ref1], en het krachtens tiende lid van dat artikel bepaalde zijn van
      toepassing, met dien verstande dat die leden van dat artikel toepassing vinden op de verbetering of vernieuwing.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel36
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel37b
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 37b.5
    text: |-
      Onze Minister kan op aanvraag, op andere gronden dan genoemd in artikel 9, eerste lid, van richtlijn 2008/57/
      EG en met inachtneming van artikel 20 van die richtlijn, een of meer voor het betrokken subsysteem vastgestelde
      technische specificaties inzake interoperabiliteit buiten toepassing laten.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel37b
  - number: 37b.6
    text: |-
      Onze Minister eist op basis van het informatiedossier, bedoeld in het tweede lid, indien het spoorvoertuig niet
      volledig in het register, bedoeld in [artikel 37, tweede lid][ref1], is ingeschreven, een aanvullende vergunning
      voor indienststelling respectievelijk nieuwe aanvullende vergunning voor indienststelling, indien de gevolgen van
      de de verbetering of vernieuwing voor de verenigbaarheid van het spoorvoertuig met de hoofdspoorweginfrastructuur
      dat noodzakelijk maken.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel37
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel37b
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '37'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 37b.7
    text: |-
      Artikel 36, vijfde lid, is van toepassing, met dien verstande dat het slechts toepassing vindt op de verbetering
      of vernieuwing.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel37b
  - number: 37b.8
    text: |-
      Het is verboden van hoofdspoorweginfrastructuur gebruik te maken met een verbeterd of vernieuwd spoorvoertuig dat
      niet volledig in het register, bedoeld in [artikel 37, tweede lid][ref1], is ingeschreven, zonder:


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel37
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel37b
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '37'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 37b.8.a
    text: zonder voorafgaande indiening van een informatiedossier als bedoeld in het tweede lid, en
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel37b
  - number: 37b.8.b
    text: |-
      een aanvullende vergunning voor indienststelling of nieuwe aanvullende vergunning voor indienststelling, indien
      Onze Minister die krachtens het zesde lid heeft geëist.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel37b
  - number: 37b.9
    text: |-
      Het voldoen van de verbetering of vernieuwing bij een spoorvoertuig aan artikel 36, derde lid, onderdelen a tot en
      met c en e, blijkt uit een geldige verklaring van een aangemelde instantie of van een keuringsinstantie.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel37b
  - number: '38.1'
    text: |-
      Een EG-keuringsverklaring als bedoeld in [artikel 36, zesde lid][ref1], voldoet aan bijlage V van richtlijn
      2008/57/EG.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel36
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '38.2'
    text: |-
      De afgifte van een EG-keuringsverklaring als bedoeld in [artikel 36, zesde lid][ref1], geschiedt in overeenstemming
      met artikel 18 en bijlage VI van richtlijn 2008/57/EG.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel36
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '38.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de afgifte, vorm en inhoud
      van EG-keuringsverklaringen als bedoeld in [artikel 36, zesde lid][ref1], en over het informatiedossier, bedoeld in
      [artikel 37b, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel37b
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0015007
        artikel: 37b
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '38.4'
    text: 'Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over de verlening en de aanvraag van:'
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel38
  - number: 38.4.a
    text: |-
      de vergunning voor indienststelling, bedoeld in [artikel 36, derde lid][ref1], en van de vergunning voor
      indienststelling of van de nieuwe vergunning voor indienststelling, bedoeld in [artikel 37b, derde lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel37b
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0015007
        artikel: 37b
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 38.4.b
    text: |-
      de aanvullende vergunning voor indienststelling, bedoeld in [artikel 36, vijfde lid][ref1], en van aanvullende
      vergunning voor indienstststelling of van de nieuwe aanvullende vergunning voor indienststelling, bedoeld in
      [artikel 37b, zesde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel37b
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0015007
        artikel: 37b
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '38.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over het registreren of bewaren van
      gegevens over:
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel38
  - number: 38.5.a
    text: |-
      de afgifte van de EG-keuringsverklaring, bedoeld in [artikel 36, zesde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel36
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 38.5.b
    text: |-
      de afgifte van de verklaring, bedoeld in [artikel 36, zevende lid][ref1], of van de verklaring, bedoeld in
      [artikel 37b, negende lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel37b
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0015007
        artikel: 37b
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 38.5.c
    text: |-
      de aanvraag en de verlening van de vergunning voor indienststelling, bedoeld in [artikel 36, derde lid][ref1],
      of van de vergunning voor indienststelling of nieuwe vergunning voor indienststelling, bedoeld
      [artikel 37b, derde lid][ref2], en


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel37b
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0015007
        artikel: 37b
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 38.5.d
    text: |-
      de aanvraag en de verlening van de aanvullende vergunning voor indienststelling, bedoeld in
      [artikel 36, vijfde lid][ref1], of van de aanvullende vergunning voor indienststelling of nieuwe vergunning voor
      indienststelling, bedoeld in [artikel 37b, zesde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel37b
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0015007
        artikel: 37b
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '39.1'
    text: |-
      Het is verboden een interoperabiliteitsonderdeel voor het gebruik binnen het spoorwegsysteem in de handel te
      brengen, indien ten aanzien daarvan niet een EG-verklaring van conformiteit of geschiktheid voor gebruik als
      bedoeld in artikel 13, eerste lid, van richtlijn 2008/57/EG, is afgegeven.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel39
  - number: '39.2'
    text: |-
      Degene die de interoperabiliteitsonderdelen gebruikt zorgt dat deze binnen hun toepassingsgebied worden gebruikt
      overeenkomstig hun bestemming, en dat zij naar behoren worden geïnstalleerd en onderhouden.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel39
  - number: '40.1'
    text: |-
      Een EG-verklaring van conformiteit of geschiktheid voor gebruik als bedoeld in artikel 13, eerste lid, van
      richtlijn 2008/57/EG, wordt afgegeven:
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel40
  - number: 40.1.a
    text: |-
      indien de interoperabiliteitsonderdelen voldoen aan de daaraan in de toepasselijke technische specificatie inzake
      interoperabiliteit gestelde eisen, en
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel40
  - number: 40.1.b
    text: |-
      indien de conformiteit of geschiktheid voor gebruik blijkt uit een toetsing van een aangemelde instantie, indien
      een toepasselijke specificatie inzake interoperabiliteit een dergelijke toetsing voorschrijft.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel40
  - number: '40.2'
    text: |-
      Indien met betrekking tot de in het eerste lid bedoelde onderdelen, andere EG-richtlijnen bestaan ten aanzien van
      andere aspecten dan geregeld in bedoelde technische specificaties, vermelden de verklaringen, bedoeld in dat lid,
      tevens of deze onderdelen aan die andere EG-richtlijnen voldoen.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel40
  - number: '41.1'
    text: |-
      Een EG-verklaring van conformiteit of geschiktheid voor gebruik als bedoeld in artikel 13, eerste lid, van
      richtlijn 2008/57/EG voldoet aan bijlage IV van die richtlijn.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel41
  - number: '41.2'
    text: |-
      De afgifte van een EG-verklaring van conformiteit of geschiktheid voor gebruik als bedoeld in artikel 13, eerste
      lid, van richtlijn 2008/57/EG, geschiedt in overeenstemming met artikel 13 en bijlage IV van die richtlijn.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel41
  - number: '41.3'
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen nadere regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel41
  - number: 41.3.a
    text: |-
      vorm en inhoud van de EG-verklaringen van conformiteit of geschiktheid voor gebruik als bedoeld in artikel 13,
      eerste lid, van richtlijn 2008/57/EG, alsmede over het registreren of bewaren van gegevens of documenten over de
      afgifte, en
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel41
  - number: 41.3.b
    text: |-
      het onderzoek naar de overeenstemming van de productie van interoperabiliteitsonderdelen waarvoor goedkeuring van
      het type is verleend, met het goedgekeurde type.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel41
  - number: '42.1'
    text: |-
      Het is verboden een EG-keuringsverklaring als bedoeld in [artikel 36, zesde lid][ref1], af te geven indien niet
      blijkens een geldige verklaring van een aangemelde instantie is voldaan aan artikel 36, derde lid, onderdelen a
      en b.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel36
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '42.2'
    text: |-
      Het is verboden een EG-verklaring van conformiteit of geschiktheid voor gebruik als bedoeld in artikel 13, eerste
      lid, van richtlijn 2008/57/EG, voor een interoperabiliteitsonderdeel af te geven, indien niet voldaan is aan
      [artikel 40, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel40
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '40'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '43.1'
    text: |-
      De fabrikant van interoperabiliteitsonderdelen en zijn in Nederland gevestigde gemachtigde die in strijd met
      [artikel 42, tweede lid][ref1], een EG-verklaring van conformiteit of geschiktheid voor gebruik als bedoeld
      in artikel 13, eerste lid, van richtlijn 2008/57/EG voor een interoperabiliteitsonderdeel hebben afgegeven,
      zijn verplicht op eerste vordering van Onze Minister en binnen een door hem te stellen termijn het verzuim te
      herstellen. Zij zijn verplicht de daarbij door Onze Minister te geven aanwijzingen op te volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel42
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '42'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '43.2'
    text: |-
      Indien de fabrikant of zijn in Nederland gevestigde gemachtigde niet voldoet aan het eerste lid neemt Onze Minister
      met toepassing van artikel 14 van richtlijn 2008/57/EG maatregelen, om het in de handel brengen van het betrokken
      interoperabiliteitsonderdeel te beperken of te verbieden dan wel het uit de handel te doen nemen.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel43
  - number: '44'
    text: |-
      Indien Onze Minister vaststelt dat een interoperabiliteitsonderdeel, ondanks het feit dat ten aanzien daarvan een
      EG-verklaring van conformiteit of geschiktheid voor gebruik als bedoeld in artikel 13, eerste lid, van richtlijn
      2008/57/EG is afgegeven en ondanks het feit dat het onderdeel overeenkomstig zijn bestemming wordt gebruikt, de
      veiligheid van het verkeer op de hoofdspoorwegen of interoperabiliteit als bedoeld in artikel 2, onderdeel b, van
      richtlijn 2008/57/EG in gevaar brengt, neemt hij met toepassing van artikel 14 van die richtlijn maatregelen om het
      toepassingsgebied van dit onderdeel te beperken, het gebruik ervan te verbieden of het uit de handel te doen nemen.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel44
  - number: '46.1'
    text: |-
      Voor elk spoorvoertuig waaraan Onze Minister een voertuignummer als bedoeld in [artikel 37, zesde lid][ref1], heeft
      toegekend, is er een met het onderhoud belaste entiteit.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel37
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '37'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '46.2'
    text: |-
      Het eerste lid geldt niet voor bij ministeriële regeling met inachtneming van artikel 2 van richtlijn 2004/49/EG
      aangewezen spoorvoertuigen.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel46
  - number: '46.3'
    text: |-
      De met het onderhoud belaste entiteit kan een spoorwegonderneming of infrastructuurbeheerder als bedoeld in artikel
      3 van richtlijn 91/440/EG of de houder van het spoorvoertuig zijn.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel46
  - number: '46.4'
    text: |-
      De houder beschikt over een geldig onderhoudscertificaat indien hij de met onderhoud belaste entiteit is van een of
      meer goederenwagens en geen spoorwegonderneming of infrastructuurbeheerder als bedoeld in artikel 3 van richtlijn
      91/440/EG.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel46
  - number: '46.5'
    text: |-
      Onze Minister verleent op aanvraag een onderhoudscertificaat indien de houder voldoet aan de daartoe bij regeling
      van Onze Minister met inachtneming van artikel 14bis van richtlijn 2004/49/EG vastgestelde eisen.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel46
  - number: '46.6'
    text: |-
      Een door een daartoe bevoegde instantie met inachtneming van artikel 14bis van richtlijn 2004/49/EG verleende
      certificering wordt met een onderhoudscertificaat als bedoeld in het vierde lid gelijkgesteld.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel46
  - number: '46.7'
    text: |-
      De met het onderhoud belaste entiteit draagt er zorg voor dat het spoorvoertuig in veilige staat is en
      overeenkomstig de bepalingen in de toepasselijke technische specificaties inzake interoperabiliteit wordt
      onderhouden.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel46
  - number: '46.8'
    text: |-
      Onze Minister kan het gebruik met een spoorvoertuig van hoofdspoorweginfrastructuur verbieden indien ter zake van
      het spoorvoertuig niet voldaan wordt aan het zevende lid.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel46
  - number: '46.9'
    text: |-
      De met het onderhoud belaste entiteit is degene die als zodanig in het register, bedoeld in
      [artikel 37, tweede lid][ref1], is ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel37
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '37'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '47.1'
    text: |-
      De spoorwegonderneming of de houder dragen er zorg voor dat een door hen gebruikt spoorvoertuig dat volledig in
      het register, bedoeld in [artikel 37, tweede lid][ref1], is ingeschreven, overeenkomstig de geldende specificaties
      inzake interoperabiliteit wordt geëxploiteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel37
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '37'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '47.2'
    text: |-
      Onze Minister kan het gebruik met een spoorvoertuig van hoofdspoorweginfrastructuur verbieden indien ter zake van
      het spoorvoertuig niet voldaan is aan het eerste lid.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel47
  - number: '47.3'
    text: |-
      Het is verboden om met een spoorvoertuig dat niet overeenkomstig de essentiële eisen van richtlijn 2008/57/EG is
      geëxploiteerd en onderhouden, van hoofdspoorweginfrastructuur gebruik te maken.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel47
  - number: '48.1'
    text: |-
      Het is verboden onderhoud en herstel van spoorvoertuigen die beschikken over een volledige inschrijving in het
      register, bedoeld in [artikel 37, tweede lid][ref1] te laten uitvoeren door anderen dan daartoe door Onze Minister
      erkende natuurlijke personen of rechtspersonen.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel37
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '37'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '48.2'
    text: Een erkenning wordt verleend indien wordt voldaan aan de daarvoor bij regeling van Onze Minister gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel48
  - number: '48.3'
    text: |-
      Met een erkenning als bedoeld in het eerste lid wordt gelijkgesteld een erkenning, afgegeven door een daartoe
      bevoegde instantie in een andere lidstaat van de Europese Unie dan wel in een andere staat, niet zijnde een
      lidstaat van de Europese Unie, die partij is bij een daartoe of mede daartoe strekkend verdrag dat Nederland
      bindt, welke erkenning is afgegeven op basis van onderzoekingen die een beschermingsniveau bieden dat ten minste
      gelijkwaardig is aan het niveau dat met de nationale onderzoekingen wordt nagestreefd.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel48
  - number: '48.4'
    text: 'De eisen of nadere eisen, bedoeld in het tweede lid, onderdeel c, kunnen onder meer betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel48
  - number: 48.4.a
    text: de voor het onderhoud of herstel beschikbare ruimte en de gebruikte apparatuur;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel48
  - number: 48.4.b
    text: de deskundigheid van de met het onderhoud of herstel belaste personen en
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel48
  - number: 48.4.c
    text: het proces dat bij het onderhoud of herstel wordt toegepast.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel48
  - number: '48.5'
    text: |-
      Onze Minister kan de erkenning, bedoeld in het tweede lid, onder beperkingen verlenen en daaraan voorschriften
      verbinden met betrekking tot de uit te voeren werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel48
  - number: '48.6'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over het onderhoud alsmede over de
      aanvraag en het verlenen van een erkenning.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel48
  - number: '48.7'
    text: 'Onze Minister trekt een erkenning in:'
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel48
  - number: 48.7.a
    text: op verzoek van degene aan wie deze is verleend;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel48
  - number: 48.7.b
    text: indien degene, aan wie deze is verleend, niet langer voldoet aan de eisen, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel48
  - number: '49.1'
    text: |-
      Personen die binnen het hoofdspoorwegverkeerssysteem een veiligheidsfunctie anders dan die van machinist met
      volledige bevoegdheid of van machinist met beperkte bevoegdheid uitoefenen, voldoen aan de bij of krachtens
      algemene maatregel van bestuur voor de uitoefening van die functie gestelde eisen inzake:
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel49
  - number: 49.1.a
    text: minimumleeftijd;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel49
  - number: 49.1.b
    text: medische en psychologische geschiktheid;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel49
  - number: 49.1.c
    text: algemene kennis, bekwaamheid en ervaring, en
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel49
  - number: 49.1.d
    text: taalbeheersing.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel49
  - number: '49.2'
    text: |-
      Personen die binnen het hoofdspoorwegverkeerssysteem de veiligheidsfunctie van machinist met volledige bevoegdheid
      of van machinist met beperkte bevoegdheid uitoefenen, voldoen aan de bij of krachtens algemene maatregel van
      bestuur voor de uitoefening van die functie gestelde eisen inzake:
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel49
  - number: 49.2.a
    text: minimumleeftijd;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel49
  - number: 49.2.b
    text: medische en psychologische geschiktheid;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel49
  - number: 49.2.c
    text: algemene kennis en vaardigheden;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel49
  - number: 49.2.d
    text: |-
      specifieke vakkennis inzake de spoorvoertuigen en de hoofdspoorweginfrastructuur waarop een bevoegdheidsbewijs
      betrekking kan hebben, en
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel49
  - number: 49.2.e
    text: taalbeheersing.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel49
  - number: '49.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de wijze waarop wordt aangetoond dat aan
      de in het eerste lid en tweede lid bedoelde eisen wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel49
  - number: '50.1'
    text: |-
      Een persoon die binnen het hoofdspoorwegverkeerssysteem een veiligheidsfunctie anders dan die van machinist
      met volledige bevoegdheid of van machinist met beperkte bevoegdheid uitoefent, beschikt, behoudens bij algemene
      maatregel van bestuur vastgestelde uitzonderingen, over:
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel50
  - number: 50.1.a
    text: |-
      één of meer beoordelingen door Onze Minister waaruit blijkt dat hij voldoet aan de krachtens
      [artikel 49, eerste lid][ref1], voor de desbetreffende veiligheidsfunctie vastgestelde eisen inzake algemene
      kennis, bekwaamheid en ervaring en een geldige verklaring van medische geschiktheid en een geldige verklaring van
      psychologische geschiktheid, afgegeven door een door Onze Minister erkend keuringsinstituut, of


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel49
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '49'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: 50.1.b
    text: |-
      een geldige erkenning van beroepskwalificaties als bedoeld in
      [artikel 5 van de Algemene wet erkenning EG-beroepskwalificaties][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel5
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '5'
  - number: '50.2'
    text: |-
      Een persoon die binnen het hoofdspoorwegverkeerssysteem de veiligheidsfunctie van machinist met volledige
      bevoegdheid of van machinist met beperkte bevoegdheid uitoefent, beschikt over:
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel50
  - number: 50.2.a
    text: |-
      één of meer beoordelingen van Onze Minister waaruit blijkt dat hij voldoet aan de krachtens
      [artikel 49, tweede lid][ref1], voor de desbetreffende veiligheidsfunctie vastgestelde eisen inzake algemene kennis
      en vaardigheden en een geldige verklaring van medische geschiktheid en een geldige verklaring van psychologische
      geschiktheid, afgegeven door een door Onze Minister erkend keuringsinstituut, of


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel49
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '49'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: 50.2.b
    text: een geldige machinistenvergunning die in een andere lidstaat van de Europese Unie is afgegeven.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel50
  - number: '50.3'
    text: |-
      Een persoon die binnen het hoofdspoorwegverkeerssysteem de veiligheidsfunctie van machinist met volledige
      bevoegdheid of van machinist met beperkte bevoegdheid uitoefent beschikt over een geldige machinistenvergunning
      en een geldig bevoegdheidsbewijs dat betrekking heeft op de spoorvoertuigen waarmee en op de
      hoofdspoorweginfrastructuur waarvan gebruik wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel50
  - number: '50.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over de afgifte, de inhoud en
      de geldigheid van de in het eerste lid, onderdeel a, en het tweede lid, onderdeel a bedoelde beoordelingen en
      verklaringen alsmede over de erkenning van keuringsinstituten.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel50
  - number: '51.1'
    text: |-
      Degene onder wiens gezag binnen het hoofdspoorwegverkeerssysteem een veiligheidsfunctie wordt uitgeoefend
      verschaft, behoudens bij algemene maatregel van bestuur omschreven uitzonderingen, aan degene die de betrokken
      functie uitoefent, die beschikt over de in [artikel 50, eerste lid][ref1], bedoelde documenten en die naar zijn
      oordeel beschikt over de voor de uitoefening van die functie vereiste specifieke, taakgebonden en bedrijfsgebonden
      kennis en bekwaamheid, een bedrijfspas.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel50
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '50'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: '51.2'
    text: De bedrijfspas voldoet aan de bij of krachtens algemene maatregel van bestuur gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel51
  - number: '51.3'
    text: |-
      Het eerste lid geldt niet voor een persoon die binnen het hoofdspoorwegverkeerssysteem de veiligheidsfunctie van
      machinist met volledige bevoegdheid of van machinist met beperkte bevoegdheid uitoefent en aan wie degene onder
      wiens gezag die veiligheidsfunctie wordt uitgeoefend een bevoegdheidsbewijs heeft verstrekt.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel51
  - number: '51.4'
    text: |-
      De houder van een bedrijfspas en de houder van een bevoegdheidsbewijs als bedoeld in het derde lid zijn verplicht
      die pas onderscheidenlijk dat bewijs op eerste vordering te tonen aan de krachtens de [artikelen 69][ref1] en
      [86][ref2] met het toezicht op de naleving onderscheidenlijk de opsporing van strafbare feiten belaste personen.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel86
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '69'
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0015007
        artikel: '86'
        hoofdstuk: '6'
        paragraaf: '4'
  - number: '51.5'
    text: 'Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel51
  - number: 51.5.a
    text: |-
      de voor de uitoefening van veiligheidsfuncties vereiste specifieke, taakgebonden en bedrijfsgebonden kennis en
      bekwaamheid;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel51
  - number: 51.5.b
    text: de geldigheidsduur van bedrijfspassen.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel51
  - number: 51a.1
    text: 'Onze Minister verleent op aanvraag een machinistenvergunning indien de machinist:'
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel51a
  - number: 51a.1.a
    text: |-
      voldoet aan de krachtens [artikel 49, tweede lid][ref1], vastgestelde eisen inzake minimumleeftijd;


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel49
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel51a
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '49'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: 51a.1.b
    text: |-
      beschikt over een geldige verklaring van medische geschiktheid en een geldige verklaring van psychologische
      geschiktheid als bedoeld in [artikel 50, tweede lid, onderdeel a][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel50
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel51a
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '50'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: 51a.1.c
    text: |-
      beschikt over een geldige beoordeling van Onze Minister waaruit blijkt dat hij voldoet aan de krachtens
      [artikel 49, tweede lid][ref1], vastgestelde eisen inzake algemene kennis en vaardigheden voor de
      veiligheidsfunctie van machinist met volledige bevoegdheid respectievelijk van machinist met beperkte bevoegdheid.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel49
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel51a
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '49'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: 51a.2
    text: |-
      Onze Minister schorst of trekt de machinistenvergunning in, indien de machinist niet langer beschikt over een
      geldige verklaring van medische geschiktheid of een geldige verklaring van psychologische geschiktheid.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel51a
  - number: 51a.3
    text: Onze Minister houdt een register van machinistenvergunningen.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel51a
  - number: 51a.4
    text: |-
      Degene onder wiens gezag de veiligheidsfunctie van machinist met volledige bevoegdheid of van machinist met
      beperkte bevoegdheid wordt uitgeoefend, verstrekt aan een machinist een bevoegdheidsbewijs indien deze:
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel51a
  - number: 51a.4.a
    text: |-
      voldoet aan de krachtens [artikel 49, tweede lid][ref1], vastgestelde eisen inzake taalbeheersing;


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel49
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel51a
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '49'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: 51a.4.b
    text: |-
      beschikt over een geldige beoordeling van Onze Minister waaruit blijkt dat hij voldoet aan de krachtens
      [artikel 49, tweede lid][ref1], vastgestelde eisen inzake specifieke vakkennis van de spoorvoertuigen en de
      hoofdspoorweginfrastructuur waarop het bevoegdheidsbewijs betrekking moet hebben, en


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel49
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel51a
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '49'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: 51a.4.c
    text: beschikt over de voor de uitoefening van die functie vereiste bedrijfsgebonden kennis en bekwaamheid.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel51a
  - number: 51a.5
    text: Degene die een of meer bevoegdheidsbewijzen heeft verstrekt houdt een register van bevoegdheidsbewijzen.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel51a
  - number: 51a.6
    text: |-
      Degene onder wiens gezag de veiligheidsfunctie van machinist met volledige bevoegdheid of van machinist met
      beperkte bevoegdheid wordt uitgeoefend onderzoekt periodiek of de machinist voldoet aan:
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel51a
  - number: 51a.6.a
    text: |-
      de voor die veiligheidsfunctie krachtens [artikel 49, tweede lid][ref1], vastgestelde eisen inzake taalbeheersing;


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel49
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel51a
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '49'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: 51a.6.b
    text: |-
      de krachtens artikel 49, tweede lid, vastgestelde eisen inzake de specifieke vakkennis inzake de spoorvoertuigen en
      de hoofdspoorweginfrastructuur waarop het bevoegdheidsbewijs betrekking heeft, en
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel51a
  - number: 51a.6.c
    text: aan de voor die veiligheidsfunctie vereiste bedrijfsgebonden kennis en bekwaamheid.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel51a
  - number: 51a.7
    text: |-
      Degene onder wiens gezag de veiligheidsfunctie van machinist wordt uitgeoefend verstrekt bij de beëindiging van het
      dienstverband van de machinist een gewaarmerkte kopie van het op dat moment geldige bevoegdheidsbewijs.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel51a
  - number: 51a.8
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels gegeven voor:'
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel51a
  - number: 51a.8.a
    text: de aanvraag, verlening, geldigheidsduur en verlenging van een machinistenvergunning;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel51a
  - number: 51a.8.b
    text: de verstrekking van een duplicaat van een machinistenvergunning;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel51a
  - number: 51a.8.c
    text: het register van machinistenvergunningen, bedoeld in het derde lid;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel51a
  - number: 51a.8.d
    text: |-
      de vorm, inhoud en geldigheidsduur van een bevoegdheidsbewijs en de verstrekking van een gewaarmerkte kopie
      daarvan;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel51a
  - number: 51a.8.e
    text: het register van bevoegdheidsbewijzen, bedoeld in vijfde lid;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel51a
  - number: 51a.8.f
    text: de frequentie van het onderzoek, bedoeld in het zesde lid;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel51a
  - number: 51a.8.g
    text: de verplichtingen van degene die de bevoegdheidsbewijzen heeft verstrekt, en
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel51a
  - number: 51a.8.h
    text: |-
      de voor de veiligheidsfunctie van machinist met volledige bevoegdheid en van machinist met beperkte bevoegdheid
      vereiste bedrijfsgebonden kennis en bekwaamheid.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel51a
  - number: 51b.1
    text: |-
      Opleidingactiviteiten met het oog op het verkrijgen van een of meer beoordelingen waaruit blijkt dat voldaan
      wordt aan de krachtens [artikel 49, tweede lid][ref1], vastgestelde eisen inzake algemene kennis en vaardigheden
      en specifieke vakkennis inzake de spoorvoertuigen en de hoofdspoorweginfrastructuur worden slechts verricht door
      daartoe door Onze Minister erkende opleidingsinstituten.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel49
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel51b
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '49'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: 51b.2
    text: |-
      Een krachtens het eerste lid, erkend opleidingsinstituut geeft op billijke en non-discriminatoire wijze toegang tot
      de opleidingsactiviteiten, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel51b
  - number: 51b.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden met inachtneming van artikel 20 van richtlijn 2007/59/EG
      regels gegeven voor de erkenning van de opleidingsinstituten, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel51b
  - number: '52'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen, met het oog op de veiligheid, regels worden gesteld over de
      bedrijfsvoering en de organisatiestructuur van degene onder wiens gezag binnen het hoofdspoorwegverkeerssysteem een
      veiligheidsfunctie wordt uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel52
  - number: '53'
    text: 'Het is verboden een veiligheidsfunctie binnen het hoofdspoorwegverkeerssysteem te doen uitoefenen door een persoon:'
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel53
  - number: 53.a
    text: |-
      die niet beschikt over de in [artikel 50, eerste lid][ref1], bedoelde documenten;


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel50
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '50'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: 53.b
    text: |-
      waarvan men weet of redelijkerwijs moet weten dat hij niet voldoet aan de voor de uitoefening van de functie
      gestelde eisen als bedoeld in [artikel 49][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel49
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '49'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: '54'
    text: |-
      Degene onder wiens gezag een persoon die binnen het hoofdspoorwegverkeerssysteem een functie, niet zijnde een
      veiligheidsfunctie, uitoefent die van invloed kan zijn op de veiligheid van het verkeer over hoofdspoorwegen,
      draagt er zorg voor dat die persoon daartoe geschikt is en de nodige kennis en bekwaamheid bezit.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel54
  - number: '55.1'
    text: |-
      De spoorwegonderneming die van de hoofdspoorweg gebruik maakt, is verplicht ter zake van dat gebruik een
      verzekering te sluiten en in stand te houden, waarmee haar uit wettelijke aansprakelijkheid voortvloeiende
      financiële risico's voldoende zijn gedekt.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel55
  - number: '55.2'
    text: |-
      Bij algemene maatregel van bestuur worden bedragen vastgesteld waarboven de verzekeringsplicht zich niet uitstrekt.
      Afzonderlijke bedragen kunnen worden bepaald naar gelang van onder meer de aard van de gebeurtenis, de aard van de
      schade, de grond van de aansprakelijkheid en de aard van de onderneming.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel55
  - number: '55.3'
    text: |-
      [Artikel 6 van de Wet aansprakelijkheidsverzekering motorrijtuigen][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel6
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: '6'
  - number: '56'
    text: 'In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel56
  - number: 56.a
    text: |-
      gerechtigde: gerechtigde als bedoeld in [artikel 57][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel57
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '57'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 56.b
    text: |-
      toegangsovereenkomst: toegangsovereenkomst als bedoeld in [artikel 59][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel59
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '59'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 56.c
    text: 'kaderovereenkomst: kaderovereenkomst als bedoeld in artikel 17 van [richtlijn 2001/14/EG](32001L0014);'
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel56
  - number: 56.d
    text: 'gebruik van een hoofdspoorweg: het met een spoorvoertuig rijden over of stilstaan op een hoofdspoorweg;'
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel56
  - number: 56.e
    text: 'capaciteit: capaciteit van de hoofdspoorweginfrastructuur;'
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel56
  - number: 56.f
    text: 'netverklaring: netverklaring als bedoeld in [richtlijn 2001/14/EG](32001L0014);'
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel56
  - number: 56.g
    text: |-
      gebruiksvergoeding: vergoeding als bedoeld in artikel 8 van [richtlijn 91/440/EEG](31991L0440) en artikel 4 van
      [richtlijn 2001/14/EG](32001L0014).
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel56
  - number: '57.1'
    text: 'Gerechtigd tot het sluiten van een toegangsovereenkomst en een kaderovereenkomst met de beheerder zijn:'
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel57
  - number: 57.1.a
    text: |-
      spoorwegondernemingen die in het bezit zijn van een bedrijfsvergunning of deze hebben aangevraagd, voorzover zij
      daarmee gerechtigd zijn van de hoofdspoorwegen gebruik te maken op de wijze waarvoor zij de overeenkomst willen
      sluiten;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel57
  - number: 57.1.b
    text: |-
      concessieverleners als bedoeld in [artikel 20 van de Wet personenvervoer 2000][ref1] ten behoeve van openbaar
      vervoer per trein;


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel20
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '20'
  - number: 57.1.c
    text: andere bij of krachtens algemene maatregel van bestuur aan te wijzen bestuursorganen, personen of rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel57
  - number: '57.2'
    text: |-
      De spoorwegonderneming doet uiterlijk tien maanden voor aanvang van de geldigheidsperiode van de dienstregeling,
      bedoeld in artikel 2, onderdeel m, van richtlijn 2001/14/EG waarin hij met het grensoverschrijdend personenvervoer
      wil aanvangen aan de raad van bestuur NMa en de beheerder melding van het voornemen om voor dat vervoer capaciteit
      aan te vragen.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel57
  - number: '57.3'
    text: Het tweede lid is van overeenkomstige toepassing voor wijzigingen van het grensoverschrijdend personenvervoer.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel57
  - number: '58.1'
    text: De beheerder stelt jaarlijks, na overleg met betrokken gerechtigden, een netverklaring op.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel58
  - number: '58.2'
    text: |-
      De netverklaring bevat de gegevens, bedoeld in artikel 3 en bijlage I van [richtlijn 2001/14/EG](32001L0014), en
      voorts ten minste:
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel58
  - number: 58.2.a
    text: informatie over voor bepaalde soorten van gebruik voorbehouden capaciteit;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel58
  - number: 58.2.b
    text: een zakelijke weergave van de inhoud van de geldende kaderovereenkomsten;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel58
  - number: 58.2.c
    text: een prognose omtrent de ontwikkeling van de capaciteit;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel58
  - number: 58.2.d
    text: alle overige relevante informatie voor het gebruik van de capaciteit.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel58
  - number: '58.3'
    text: |-
      Met inachtneming van artikel 3, vierde lid, van [richtlijn 2001/14/EG](32001L0014) stelt de beheerder de
      netverklaring tegen vergoeding van ten hoogste de kostprijs algemeen verkrijgbaar en zendt haar aan de betrokken
      spoorwegondernemingen en de raad van bestuur NMa.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel58
  - number: '58.4'
    text: |-
      De beheerder brengt in de netverklaring zo nodig wijzigingen aan. Met inachtneming van artikel 8, vierde
      lid, van [richtlijn 2001/14/EG](32001L0014) en tegen vergoeding van ten hoogste de kostprijs stelt hij de
      gewijzigde netverklaring algemeen verkrijgbaar en doet hij van de wijzigingen mededeling aan de betrokken
      spoorwegondernemingen en aan de raad van bestuur NMa.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel58
  - number: '59.1'
    text: |-
      Een tussen de beheerder en een gerechtigde gesloten overeenkomst over het gebruik van capaciteit bevat in elk geval
      bedingen over:
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel59
  - number: 59.1.a
    text: de door de beheerder te bieden kwaliteit van de hoofdspoorweginfrastructuur;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel59
  - number: 59.1.b
    text: de gebruiksvergoeding.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel59
  - number: '59.2'
    text: |-
      In de overeenkomst wordt uitgesloten dat overeengekomen capaciteit kan worden overgedragen aan of gebruikt door een
      ander dan een gerechtigde.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel59
  - number: '59.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen ten behoeve van de overeenkomst algemene voorwaarden als bedoeld in
      [artikel 231 van Boek 6 van het Burgerlijk Wetboek][ref1] worden vastgesteld. In dat geval wordt in de overeenkomst
      naar die algemene voorwaarden verwezen.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel231
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '231'
  - number: '60.1'
    text: |-
      Een tussen de beheerder en een gerechtigde gesloten kaderovereenkomst voldoet aan artikel 10, vijfde lid, van
      [richtlijn 91/440/EEG](31991L0440) en artikel 17 van [richtlijn 2001/14/EG](32001L0014).
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel60
  - number: '60.2'
    text: |-
      In een kaderovereenkomst wordt uitgesloten dat overeengekomen capaciteit kan worden overgedragen aan of gebruikt
      door een ander dan een gerechtigde.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel60
  - number: '60.3'
    text: |-
      Een kaderovereenkomst met een geldigheidsduur van meer dan vijf jaar behoeft de voorafgaande instemming van de raad
      van bestuur NMa.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel60
  - number: '60.4'
    text: |-
      Bij algemene maatregel van bestuur kunnen ten behoeve van de kaderovereenkomst algemene voorwaarden als bedoeld
      in [artikel 231 van Boek 6 van het Burgerlijk Wetboek][ref1] worden vastgesteld. In dat geval wordt in de
      kaderovereenkomst naar die algemene voorwaarden verwezen.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel231
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '231'
  - number: '61.1'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld over de verdeling van capaciteit. Die regels kunnen
      strekken ter bescherming van het milieu.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel61
  - number: '61.2'
    text: |-
      Bij de algemene maatregel van bestuur, bedoeld in het eerste lid, worden minimale niveaus van capaciteit
      vastgesteld voor daarbij aangegeven deelmarkten van het goederenvervoer en het personenvervoer en worden regels
      gesteld over de prioriteitscriteria, bedoeld in artikel 22, derde tot en met vijfde lid, van [richtlijn 2001/14/
      EG](32001L0014).
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel61
  - number: '61.3'
    text: |-
      Bij de algemene maatregel van bestuur, bedoeld in het eerste lid, wordt bepaald in welke gevallen capaciteit tot
      een bepaald tijdstip is voorbehouden voor bepaalde soorten gebruik van de hoofdspoorwegen en vanaf welk tijdstip
      deze capaciteit beschikbaar is voor ander gebruik.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel61
  - number: '61.4'
    text: |-
      De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel61
  - number: '62.1'
    text: |-
      Behoudens het tweede, derde en vijfde lid bedragen de begrote opbrengsten van de gebruiksvergoeding niet meer dan
      de begrote kosten ter zake van de desbetreffende hoofdspoorweginfrastructuur in dat jaar voor de beheerder.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel62
  - number: '62.2'
    text: |-
      Met betrekking tot bij algemene maatregel van bestuur aangewezen hoofdspoorweginfrastructuur kan een
      gebruiksvergoeding worden overeengekomen die mede strekt ter dekking van door een ander dan de beheerder gedane
      uitgaven voor de aanleg van die infrastructuur.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel62
  - number: '62.3'
    text: |-
      Er kan een verhoging worden overeengekomen voor het gebruik van overbelaste hoofdspoorweginfrastructuur gedurende
      periodes van overbelasting en voor de kosten van milieueffecten van het gebruik van hoofdspoorweginfrastructuur die
      niet in de begrote kosten van de beheerder zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel62
  - number: '62.4'
    text: Er kan een korting als bedoeld in artikel 9 van [richtlijn 2001/14/EG](32001L0014) worden overeengekomen.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel62
  - number: '62.5'
    text: |-
      Er kan een aftrek dan wel bijtelling worden overeengekomen in verband met optredende verstoringen en met het oog op
      verbetering van de prestaties van het spoorwegnet.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel62
  - number: '62.6'
    text: |-
      Er kan worden overeengekomen dat de gebruiksvergoeding ook verschuldigd is voor overeengekomen capaciteit die niet
      wordt gebruikt.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel62
  - number: '62.7'
    text: |-
      De overeengekomen gebruiksvergoeding voldoet aan de artikelen 4, vierde en vijfde lid, 7 tot en met 12 en 26, derde
      lid, van [richtlijn 2001/14/EG](32001L0014).
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel62
  - number: '62.8'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de maatstaven en nadere regels
      over de hoogte van de gebruiksvergoeding.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel62
  - number: '62.9'
    text: |-
      De voordracht voor een krachtens het achtste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel62
  - number: '63.1'
    text: |-
      Onderhandelingen tussen een gerechtigde en de beheerder betreffende de hoogte van de gebruiksvergoeding zijn niet
      toegestaan dan na een melding aan en onder toezicht van de raad van bestuur NMa.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel63
  - number: '63.2'
    text: |-
      De raad van bestuur NMa legt, indien de onderhandelingen naar zijn oordeel in strijd zijn met [richtlijn 2001/14/
      EG](32001L0014), aan de overtreder zo nodig een last onder dwangsom op. Aan de last kunnen voorschriften worden
      verbonden inzake het verstrekken van gegevens aan de raad van bestuur NMa. De [artikelen 54a][ref1], [62][ref2] en
      [65 van de Mededingingswet][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel54a
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel62
      [ref3]: https://wetten.overheid.nl/BWBR0008691#Artikel65
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: 54a
      - id: ref2
        bwb_id: BWBR0008691
        artikel: '62'
      - id: ref3
        bwb_id: BWBR0008691
        artikel: '65'
  - number: '64.1'
    text: |-
      De beheerder bevordert dat werkzaamheden aan en nabij de hoofdspoorweg veilig plaatsvinden. Werkzaamheden aan of
      nabij de hoofdspoorweg, waardoor veilig en ongestoord rijden of stilstaan met spoorvoertuigen niet mogelijk is,
      worden slechts uitgevoerd, indien het betrokken gedeelte van de hoofdspoorweg door de beheerder buiten dienst is
      gesteld.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel64
  - number: '64.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over het verrichten van werkzaamheden
      aan of nabij de hoofdspoorweg.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel64
  - number: '65.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden met het oog op een veilig en ongestoord gebruik van
      hoofdspoorwegen regels gesteld. Deze regels kunnen onder meer betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel65
  - number: 65.1.a
    text: aard, uitvoering, plaatsing, bediening en betekenis van seinen;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel65
  - number: 65.1.b
    text: bewegingen met spoorvoertuigen;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel65
  - number: 65.1.c
    text: het rijden met spoorvoertuigen op de openbare weg;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel65
  - number: 65.1.d
    text: het gebruik van overwegen en overpaden;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel65
  - number: 65.1.e
    text: |-
      verplichtingen – in verband met storingen, ongevallen, incidenten en andere onregelmatigheden – van
      spoorwegondernemingen, bestuurders van een spoorvoertuig en andere personen die deelnemen aan het verkeer over
      de hoofdspoorweg.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel65
  - number: '65.2'
    text: Een ieder die zich op de hoofdspoorweg bevindt, neemt de voor hem bestemde seinen in acht.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel65
  - number: '66.1'
    text: |-
      Onze Minister kan onderzoek verrichten naar de oorzaken van ongevallen en incidenten op hoofdspoorwegen en naar
      andere onregelmatigheden in de afwikkeling van het spoorverkeer waardoor de veiligheid van het spoorverkeer of van
      daarbij betrokken personen in gevaar is gebracht of in gevaar gebracht had kunnen worden, indien hij dit onderzoek
      nodig acht ter evaluatie van de wettelijke voorschriften en het beleid op het terrein van de veiligheid van het
      spoorverkeer.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel66
  - number: '66.2'
    text: |-
      Ten behoeve van het onderzoek hebben de door Onze Minister aangewezen ambtenaren jegens
      spoorwegondernemingen en de beheerder de bevoegdheden, bedoeld in de [artikelen 5:15][ref1] tot
      en met [5:19 van de Algemene wet bestuursrecht][ref2]. De [artikelen 5:12][ref3], [5:13][ref4] en
      [5:20 van de Algemene wet bestuursrecht][ref5] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '66.3'
    text: |-
      Onze Minister onthoudt zich van het onderzoek naar de oorzaken van ongevallen en incidenten op hoofdspoorwegen
      voorzover de Onderzoeksraad voor veiligheid naar het betreffende voorval een onderzoek instelt.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel66
  - number: '67.1'
    text: |-
      Een rechthebbende ten aanzien van een dienst als bedoeld in artikel 10, zesde lid, van [richtlijn 91/440/EEG]
      (31991L0440) ten behoeve van spoorwegactiviteiten als bedoeld in dat lid, ten aanzien van een voorziening of
      dienst als bedoeld in onderdeel 2 van bijlage II bij [richtlijn 2001/14/EG](32001L0014) of ten aanzien van een bij
      algemene maatregel van bestuur aangewezen, voor het verrichten van vervoer via spoorwegen noodzakelijke voorziening
      of dienst doet een spoorwegonderneming die daarom verzoekt een redelijk aanbod voor het ter beschikking stellen van
      die dienst of voorziening tegen kostengeoriënteerde tarieven en onder voorwaarden die de mededinging niet beperken.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel67
  - number: '67.2'
    text: |-
      De rechthebbende onthoudt zich van iedere vorm van discriminatie tussen degenen jegens wie de in het eerste lid
      bedoelde verplichting geldt.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel67
  - number: '67.3'
    text: |-
      Op de grondslag van hetgeen ingevolge het eerste lid is overeengekomen, stelt de rechthebbende de dienst of
      voorziening ter beschikking. De rechthebbende mag slechts weigeren om de voorziening ter beschikking te stellen,
      indien de spoorwegonderneming onder marktvoorwaarden op een voor haar haalbare andere wijze kan voorzien in de
      behoefte die ten grondslag ligt aan haar verzoek.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel67
  - number: '67.4'
    text: |-
      Indien de beheerder rechthebbende is ten aanzien van een dienst als bedoeld in onderdeel 3 van bijlage II bij
      [richtlijn 2001/14/EG](32001L0014), zijn het eerste tot en met derde lid van overeenkomstige toepassing op een
      zodanige dienst.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel67
  - number: '67.5'
    text: |-
      Indien er in Nederland slechts één rechthebbende is ten aanzien van een dienst als bedoeld in onderdeel 3 of 4 van
      bijlage II bij [richtlijn 2001/14/EG](32001L0014), zijn, onverminderd het vierde lid, het eerste en tweede lid en
      het derde lid, eerste volzin, van overeenkomstige toepassing op een zodanige dienst.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel67
  - number: '68'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld over de kostenoriëntatie, bedoeld in
      [artikel 67, eerste lid][ref1], en nadere regels ter waarborging van de toegang, op een niet-discriminerende
      grondslag, tot diensten en voorzieningen als bedoeld in dat artikel. Die nadere regels kunnen in elk geval inhouden
      dat de rechthebbende:


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel67
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '67'
        hoofdstuk: '5'
  - number: 68.a
    text: 'jaarlijks bekendmaakt:'
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel68
  - number: 68.a.1°
    text: |-
      een indicatie van de tarieven en voorwaarden die hij voornemens is te hanteren voor het ter beschikking stellen van
      de dienst of voorziening aan spoorwegondernemingen;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel68
  - number: 68.a.2°
    text: een overzicht van de verwachte beschikbaarheid in het volgende kalenderjaar van de dienst of voorziening;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel68
  - number: 68.b
    text: voor de dienst of voorziening een afzonderlijke boekhouding voert en deze ter inzage legt.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel68
  - number: '69.1'
    text: |-
      Behoudens [artikel 70, tweede lid, aanhef en onder a][ref1], zijn met het toezicht op de naleving van het bepaalde
      bij of krachtens deze wet belast de bij besluit van Onze Minister daartoe aangewezen personen.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel70
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '70'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: '69.2'
    text: |-
      Een besluit als bedoeld in het eerste lid bevat een aanduiding van de voorschriften op naleving waarvan toezicht
      wordt gehouden.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel69
  - number: '69.3'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel69
  - number: '70.1'
    text: |-
      De raad van bestuur NMa is de toezichthoudende instantie, bedoeld in artikel 10, zevende lid, van [richtlijn
      91/440/EEG](31991L0440) en de artikelen 30 en 31 van [richtlijn 2001/14/EG](32001L0014).
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel70
  - number: '70.2'
    text: 'De bij besluit van de raad van bestuur NMa aangewezen ambtenaren van deze autoriteit zijn belast met:'
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel70
  - number: 70.2.a
    text: |-
      voor de toepassing van het eerste lid: het toezicht op de naleving van het bepaalde krachtens
      [artikel 17, eerste lid, onderdeel d][ref1], en het bepaalde bij of krachtens de [artikelen 27, eerste lid][ref2],
      [57 tot en met 63][ref3], [67][ref4], [68][ref5] en [95, eerste volzin][ref6];


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0015007#Artikel57
      [ref4]: https://wetten.overheid.nl/BWBR0015007#Artikel67
      [ref5]: https://wetten.overheid.nl/BWBR0015007#Artikel68
      [ref6]: https://wetten.overheid.nl/BWBR0015007#Artikel95
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0015007
        artikel: '27'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0015007
        artikel: '57'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0015007
        artikel: '67'
        hoofdstuk: '5'
      - id: ref5
        bwb_id: BWBR0015007
        artikel: '68'
        hoofdstuk: '5'
      - id: ref6
        bwb_id: BWBR0015007
        artikel: '95'
        hoofdstuk: '6'
        paragraaf: '9'
  - number: 70.2.b
    text: |-
      voor de toepassing van het eerste lid en [artikel 71][ref1]: het onderzoek, bedoeld in
      [artikel 1 van de Mededingingswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel71
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel1
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '71'
        hoofdstuk: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008691
        artikel: '1'
  - number: '70.3'
    text: Van een besluit als bedoeld in het tweede lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel70
  - number: '70.4'
    text: |-
      Op het tweede lid, onderdeel a, is [artikel 51 van de Mededingingswet][ref1] van toepassing. Op het tweede lid,
      onderdeel b, zijn de [artikelen 52, tweede lid][ref2], en [53 tot en met 55 van de Mededingingswet][ref3] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel52
      [ref3]: https://wetten.overheid.nl/BWBR0008691#Artikel53
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '51'
      - id: ref2
        bwb_id: BWBR0008691
        artikel: '52'
      - id: ref3
        bwb_id: BWBR0008691
        artikel: '53'
  - number: '71.1'
    text: |-
      Een gerechtigde als bedoeld in [artikel 57][ref1] of een andere belanghebbende kan de raad van bestuur NMa
      schriftelijk verzoeken om te onderzoeken of de beheerder, een spoorwegonderneming of een rechthebbende als bedoeld
      in [artikel 67][ref2] of [95][ref3] de verzoeker oneerlijk heeft behandeld, heeft gediscrimineerd of anderszins
      heeft benadeeld als bedoeld in artikel 10, zevende lid, van [richtlijn 91/440/EEG](31991L0440) of artikel 30,
      tweede lid, van [richtlijn 2001/14/EG](32001L0014).


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel67
      [ref3]: https://wetten.overheid.nl/BWBR0015007#Artikel95
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '57'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0015007
        artikel: '67'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0015007
        artikel: '95'
        hoofdstuk: '6'
        paragraaf: '9'
  - number: '71.2'
    text: |-
      Een partij bij een toegangsovereenkomst of een kaderovereenkomst als bedoeld in [hoofdstuk 4][ref1] kan de raad van
      bestuur NMa schriftelijk verzoeken om een oordeel over het gedrag van de wederpartij.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0015007
        hoofdstuk: '4'
  - number: '71.3'
    text: |-
      De raad van bestuur NMa geeft zijn oordeel over de klacht uiterlijk twee maanden na ontvangst van de gegevens en
      bescheiden die voor zijn oordeel nodig zijn.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel71
  - number: '71.4'
    text: |-
      Indien de raad van bestuur NMa van oordeel is dat de klacht gegrond is, legt hij zo nodig een last onder dwangsom
      op.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel71
  - number: '71.5'
    text: |-
      Aan een last als bedoeld in het vierde lid kunnen voorschriften worden verbonden inzake het verstrekken van
      gegevens aan de raad van bestuur NMa. De [artikelen 54a][ref1] en [65 van de Mededingingswet][ref2] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel54a
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel65
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: 54a
      - id: ref2
        bwb_id: BWBR0008691
        artikel: '65'
  - number: '71.6'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot ten behoeve van het onderzoek
      te verstrekken gegevens en bescheiden, alsmede met betrekking tot de termijnen voor het verstrekken van de gegevens
      en bescheiden.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel71
  - number: '72.1'
    text: |-
      De raad van bestuur NMa en de krachtens [artikel 70, tweede lid][ref1], aangewezen ambtenaren gebruiken de gegevens
      of inlichtingen die zij hebben verkregen bij de uitoefening van hun in dat artikel bedoelde taken, uitsluitend
      voor de uitoefening van die taken of van de bij of krachtens de [Mededingingswet][ref2] aan hen opgedragen taken of
      toegekende bevoegdheden.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel70
      [ref2]: https://wetten.overheid.nl/BWBR0008691
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '70'
        hoofdstuk: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008691
  - number: '72.2'
    text: |-
      Onze Minister kan desgevraagd aan de raad van bestuur NMa de voor de uitoefening van diens taak benodigde gegevens
      of inlichtingen verstrekken.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel72
  - number: '74'
    text: |-
      Indien door Onze Minister vast te stellen beleidsregels betrekking hebben op de interpretatie van
      mededingingsbegrippen stelt Onze Minister die beleidsregels vast in overeenstemming met Onze Minister van
      Economische Zaken.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel74
  - number: '75'
    text: |-
      De raad van bestuur NMa kan aan degene die jegens een krachtens [artikel 70, tweede lid][ref1], aangewezen
      ambtenaar in strijd handelt met [artikel 5:20 van de Algemene wet bestuursrecht][ref2], een bestuurlijke boete
      opleggen van ten hoogste € 450 000 of, indien het een onderneming of ondernemingsvereniging als bedoeld in
      [artikel 1 van de Mededingingswet][ref3] betreft en indien dat meer is, van ten hoogste 1% van de omzet van de
      onderneming, onderscheidenlijk van de gezamenlijke omzet van de ondernemingen die van de vereniging deel uitmaken,
      in het boekjaar voorafgaande aan de beschikking. De [artikelen 69, tweede lid][ref4], [70][ref5], [75a][ref6],
      [77][ref7], [80][ref8] en [82 van de Mededingingswet][ref9] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel70
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0008691#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0008691#Artikel69
      [ref5]: https://wetten.overheid.nl/BWBR0008691#Artikel70
      [ref6]: https://wetten.overheid.nl/BWBR0008691#Artikel75a
      [ref7]: https://wetten.overheid.nl/BWBR0008691#Artikel77
      [ref8]: https://wetten.overheid.nl/BWBR0008691#Artikel80
      [ref9]: https://wetten.overheid.nl/BWBR0008691#Artikel82
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '70'
        hoofdstuk: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0008691
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0008691
        artikel: '69'
      - id: ref5
        bwb_id: BWBR0008691
        artikel: '70'
      - id: ref6
        bwb_id: BWBR0008691
        artikel: 75a
      - id: ref7
        bwb_id: BWBR0008691
        artikel: '77'
      - id: ref8
        bwb_id: BWBR0008691
        artikel: '80'
      - id: ref9
        bwb_id: BWBR0008691
        artikel: '82'
  - number: '76.1'
    text: |-
      Onze Minister is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van de bij of krachtens deze
      wet gestelde verplichtingen met uitzondering van de verplichtingen als bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel76
  - number: '76.2'
    text: |-
      In geval van overtreding van het bepaalde krachtens [artikel 17, eerste lid, onderdeel d][ref1], of het bepaalde
      bij of krachtens de [artikelen 27, eerste lid][ref2], [57 tot en met 62][ref3], [63, eerste lid][ref4], [67][ref5],
      [68][ref6] en [95, eerste volzin][ref7], kan de raad van bestuur NMa de overtreder:


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0015007#Artikel57
      [ref4]: https://wetten.overheid.nl/BWBR0015007#Artikel63
      [ref5]: https://wetten.overheid.nl/BWBR0015007#Artikel67
      [ref6]: https://wetten.overheid.nl/BWBR0015007#Artikel68
      [ref7]: https://wetten.overheid.nl/BWBR0015007#Artikel95
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0015007
        artikel: '27'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0015007
        artikel: '57'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0015007
        artikel: '63'
        hoofdstuk: '4'
        paragraaf: '6'
      - id: ref5
        bwb_id: BWBR0015007
        artikel: '67'
        hoofdstuk: '5'
      - id: ref6
        bwb_id: BWBR0015007
        artikel: '68'
        hoofdstuk: '5'
      - id: ref7
        bwb_id: BWBR0015007
        artikel: '95'
        hoofdstuk: '6'
        paragraaf: '9'
  - number: 76.2.a
    text: een bestuurlijke boete opleggen;
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel76
  - number: 76.2.b
    text: een last onder dwangsom opleggen.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel76
  - number: '76.3'
    text: |-
      Op het tweede lid zijn de [artikelen 54a][ref1], [57][ref2], [58][ref3], [59a][ref4], [62][ref5] en
      [64 tot en met 68 van de Mededingingswet][ref6] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel54a
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel57
      [ref3]: https://wetten.overheid.nl/BWBR0008691#Artikel58
      [ref4]: https://wetten.overheid.nl/BWBR0008691#Artikel59a
      [ref5]: https://wetten.overheid.nl/BWBR0008691#Artikel62
      [ref6]: https://wetten.overheid.nl/BWBR0008691#Artikel64
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: 54a
      - id: ref2
        bwb_id: BWBR0008691
        artikel: '57'
      - id: ref3
        bwb_id: BWBR0008691
        artikel: '58'
      - id: ref4
        bwb_id: BWBR0008691
        artikel: 59a
      - id: ref5
        bwb_id: BWBR0008691
        artikel: '62'
      - id: ref6
        bwb_id: BWBR0008691
        artikel: '64'
  - number: '76.4'
    text: |-
      [Artikel 70b van de Mededingingswet][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel70b
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: 70b
  - number: '77.1'
    text: |-
      Onze Minister kan een bestuurlijke boete opleggen ter zake van overtreding van de
      [artikelen 33, zevende lid][ref1], [36, eerste lid][ref2], [37, eerste lid][ref3],
      [37b, eerste en achtste lid][ref4], [53][ref5], en [96, tweede lid][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0015007#Artikel37
      [ref4]: https://wetten.overheid.nl/BWBR0015007#Artikel37b
      [ref5]: https://wetten.overheid.nl/BWBR0015007#Artikel53
      [ref6]: https://wetten.overheid.nl/BWBR0015007#Artikel96
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0015007
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0015007
        artikel: '37'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0015007
        artikel: 37b
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref5
        bwb_id: BWBR0015007
        artikel: '53'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref6
        bwb_id: BWBR0015007
        artikel: '96'
        hoofdstuk: '6'
        paragraaf: '10'
  - number: '77.2'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de uitoefening van de bevoegdheid, bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel77
  - number: '80.1'
    text: 'Voor de overtredingen gelden de volgende vaste bedragen van de bestuurlijke boete:'
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel80
  - number: 80.1.a
    text: |-
      voor overtreding van de [artikelen 36, eerste lid][ref1], [37, eerste lid][ref2],
      [37b, eerste en achtste lid][ref3], en [53][ref4]: € 10.000;


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0015007#Artikel37b
      [ref4]: https://wetten.overheid.nl/BWBR0015007#Artikel53
    url: https://wetten.overheid.nl/BWBR0015007/2012-07-25#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '4'
