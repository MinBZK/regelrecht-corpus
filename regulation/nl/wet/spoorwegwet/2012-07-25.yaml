  - number: 80.1.b
    text: |-
      voor overtreding van de [artikelen 33, zevende lid][ref1], [96, tweede lid][ref2]: € 50.000.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel96
