  - number: '87.3'
    text: |-
      Overtreding van [artikel 4, eerste, tweede en derde lid][ref1], [artikel 88, derde lid][ref2],
      [artikel 89, tweede, zesde, achtste en negende lid][ref3], wordt gestraft met gevangenisstraf van ten hoogste een
      jaar of geldboete van de vierde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel88
