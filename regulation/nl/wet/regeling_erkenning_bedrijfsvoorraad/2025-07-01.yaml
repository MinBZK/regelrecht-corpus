  - number: 15b
    text: |-
      1 Onverminderd [hoofdstuk 3][ref1] zijn op de bevoegdheid, bedoeld in
      [artikel 46, tweede lid, onderdeel d, van het Kentekenreglement][ref2], het tweede tot en met tiende lid van
      toepassing.

      2 De uitoefening van de bevoegdheid heeft slechts plaats vanaf de locatie die door het erkende
      bedrijf als bedrijfsadres is opgegeven en welke op het uittreksel uit het handelsregister, bedoeld in
      [artikel 22 van de Handelsregisterwet 2007][ref3], als zodanig is vermeld.

      3 De volgende documenten worden opgeslagen in een afsluitbare voorziening als bedoeld in
      [artikel 4, vierde lid][ref4], en worden door het erkende bedrijf vernietigd wanneer ten minste twee en ten hoogste
      drie jaren zijn verstreken sinds de dag van tenaamstelling:

      a. ondertekende verklaringen als bedoeld in [artikel 25a, tweede lid][ref5], en
      [artikel 28a, tweede lid, van het Kentekenreglement][ref6], en

      b. ondertekende machtigingen als bedoeld in [artikel 25a, derde lid][ref7], en
      [artikel 28a, derde lid, van het Kentekenreglement][ref8].

      4 Het erkende bedrijf draagt zorg voor een zodanige registratie van de identiteit van de medewerker die een
      aanvraag tot tenaamstelling feitelijk indient, dat voor de Dienst Wegverkeer te allen tijde eenvoudig kenbaar is
      welke medewerker een bepaalde aanvraag in behandeling heeft genomen.

      5 Indien de aanvrager van een tenaamstelling een natuurlijk persoon is, geschiedt de indiening op basis
      van een door de aanvrager ondertekende verklaring als bedoeld in [artikel 25a, tweede lid][ref9], of
      [artikel 28a, tweede lid, van het Kentekenreglement][ref10] nadat het erkende bedrijf heeft vastgesteld dat de
      identiteit van de aanvrager overeenstemt met het door de aanvrager overgelegde legitimatiebewijs.

      6 De verklaring, bedoeld in het vijfde lid, vermeldt:

      a. de naam en het adres van de aanvrager,

      b. het nummer van het getoonde rijbewijs dan wel het burgerservicenummer en, indien van toepassing, het nummer van
      de mededeling van registratie,

      c. het kenteken van het voertuig dat wordt overgedragen,

      d. de naam en het bedrijfsnummer van het erkende bedrijf waar de aanvraag wordt ingediend, en

      e. de handtekening van de aanvrager.

      7 Nadat de aanvrager de verklaring als bedoeld in het vorige lid heeft overgelegd, gaat het erkende bedrijf over
      tot de indiening van de aanvraag bij de Dienst Wegverkeer. Bij de indiening worden het kenteken en het nummer van
      het getoonde legitimatiebewijs verstrekt aan de Dienst Wegverkeer.

      8 Indien de aanvraag tot tenaamstelling wordt gedaan door een rechtspersoon, en aan het erkende bedrijf hiertoe
      een ondertekende machtiging met bijbehorende bescheiden als bedoeld in [artikel 25a, derde lid][ref11], of
      [artikel 28a, derde lid, van het Kentekenreglement][ref12], is verstrekt, verstrekt het erkende bedrijf de gegevens
      vermeld in artikel 25a, derde lid, onderdeel b, onder 1° tot en met 5°, van het Kentekenreglement, aan de Dienst
      Wegverkeer.

      9 Indien als gevolg van de indiening van een aanvraag voor een natuurlijk persoon of een rechtspersoon een
      tenaamstelling heeft plaatsgevonden welke afwijkt van de verklaring, bedoeld in [artikel 25a, tweede lid][ref13],
      of [artikel 28a, tweede lid][ref14], of van de machtiging bedoeld in artikel 25a, derde lid, of artikel 28a, derde
      lid, van het Kentekenreglement, doet het erkende bedrijf hiervan onverwijld mededeling aan de Dienst Wegverkeer.

      10 Indien blijkt dat de ingediende aanvraag niet door de Dienst Wegverkeer wordt aanvaard, verwijst het erkende
      bedrijf de aanvrager naar de Dienst Wegverkeer.


