  - number: '8'
    text: |-
      1 De aanvrager van de bevoegdheid, bedoeld in [artikel 46, tweede lid, onder c, van het Kentekenreglement][ref1],
      is een voertuigdemontagebedrijf dat:

      a. een omgevingsvergunning als bedoeld in [artikel 3.153 van het Besluit activiteiten leefomgeving][ref2] heeft;

      b. een omgevingsvergunning als bedoeld in [artikel 3.186 van het Besluit activiteiten leefomgeving][ref3] heeft
      voor het demonteren van voertuigen; of

      c. als er geen vergunning als bedoeld in onderdeel a of b vereist is, een melding als bedoeld in
      [artikel 4.574, eerste lid, van het Besluit activiteiten leefomgeving][ref4] heeft gedaan.


