  - number: 15a
    text: |-
      Terstond na de melding dat een voertuig voorgoed buiten gebruik is gesteld, vernietigt het erkende bedrijf de
      overeenkomstig [artikel 10a][ref1] ingenomen kentekenplaten.


      [ref1]: https://wetten.overheid.nl/BWBR0007089#Artikel10a
