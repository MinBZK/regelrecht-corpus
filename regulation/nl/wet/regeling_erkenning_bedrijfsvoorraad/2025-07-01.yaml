  - number: 14a
    text: |-
      1 Terstond na de melding dat een voertuig voorgoed buiten Nederland wordt gebracht, maakt het erkende bedrijf de
      voor dat voertuig overeenkomstig [artikel 10a][ref1] ingenomen kentekenplaten onbruikbaar door deze op zodanige
      wijze doormidden te knippen dat de lamineercode goed leesbaar blijft.

      2 Het erkende bedrijf bewaart de twee helften van de kentekenplaten waarop de laatste tien meldingen, bedoeld in
      [artikel 14, tweede lid][ref2], betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0007089#Artikel10a
