  - number: '15'
    text: |-
      1 Onverminderd [hoofdstuk 3][ref1] zijn op de bevoegdheid, bedoeld in
      [artikel 46, tweede lid, onderdeel c, van het Kentekenreglement][ref2], het tweede tot en met vierde lid van
      toepassing.

      2 De melding dat een voertuig voorgoed buiten gebruik is gesteld, kan door het erkende bedrijf alleen worden gedaan
      voor voertuigen die in het kentekenregister als bedrijfsvoorraad van het erkende bedrijf staan geregistreerd.

      3 Voorafgaand aan de melding dat een voertuig voorgoed buiten gebruik is gesteld, ontwaardt het erkende bedrijf de
      kentekencard dan wel het kentekenbewijs op een door de Dienst Wegverkeer vastgestelde wijze.

      4 Het erkende bedrijf controleert bij toepassing van [artikel 27, achtste lid, van het Kentekenreglement][ref3]
      het legitimatiebewijs van degene die het voertuig overdraagt, alvorens te melden dat het voertuig voorgoed buiten
      gebruik is gesteld. De Dienst Wegverkeer verstrekt aan het erkende bedrijf een vervangend tijdelijk document
      onderscheidenlijk een vervangende tenaamstellingscode.


      [ref1]: https://wetten.overheid.nl/BWBR0007089#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel46
      [ref3]: https://wetten.overheid.nl/BWBR0006951#Artikel27
