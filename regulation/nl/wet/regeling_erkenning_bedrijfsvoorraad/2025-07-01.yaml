  - number: '11'
    text: |-
      1 Het toezicht op het erkende bedrijf bestaat uit het uitvoeren van periodieke controles door de daartoe bevoegde
      ambtenaren. Deze controles kunnen frequenter plaatsvinden indien het vermoeden bestaat dat het erkende bedrijf de
      in het kader van de erkenning geldende eisen en voorschriften niet nakomt.

      2 De in het eerste lid bedoelde ambtenaren moeten desgevraagd behoorlijk in de gelegenheid worden gesteld te
      onderzoeken of het erkende bedrijf voldoet aan de gestelde eisen en voorschriften.

      Het erkende bedrijf dient inzage te geven in de met betrekking tot de erkenning en bevoegdheden te voeren
      administratie en het in [artikel 6, tweede lid, onderdeel e][ref1], bedoelde kwaliteitshandboek. Tevens dient het
      erkende bedrijf op verzoek van bedoelde ambtenaren de voertuigen die in de bedrijfsvoorraad zijn aangemeld, de
      daarbij behorende kentekenplaten alsmede de overeenkomstig [artikel 14a][ref2] bewaarde helften van kentekenplaten
      te tonen.

      3 Ingeval de erkenning of de bevoegdheden worden geschorst of ingetrokken, blijven de voertuigen die op het moment
      waarop de beschikking van kracht wordt in bedrijfsvoorraad staan geregistreerd, als zodanig geregistreerd tot het
      moment waarop het voertuig ophoudt te behoren tot de bedrijfsvoorraad.

      4 Bij de intrekking of schorsing van de erkenning of de bevoegdheden, of de wijziging van de erkenning kan een
      onderscheid gemaakt worden tussen de betrokken vestigingen.


      [ref1]: https://wetten.overheid.nl/BWBR0007089#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007089#Artikel14a
