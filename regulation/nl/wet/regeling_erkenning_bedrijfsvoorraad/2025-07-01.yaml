  - number: '10'
    text: |-
      1 De Dienst Wegverkeer verstrekt in het kader van de erkenning codes aan het erkende bedrijf. Het erkende bedrijf
      draagt er zorg voor dat de codes niet toegankelijk zijn voor onbevoegden.

      2 Het erkende bedrijf ziet er op toe dat de bedrijfsvoorraadpassen en kentekenbewijzen deel II niet door anderen
      dan het personeel van het erkende bedrijf worden gebruikt en neemt ook overigens de noodzakelijke zorgvuldigheid
      ten aanzien van documenten en codes in acht.

      3 De bedrijfsvoorraadpassen mogen slechts worden gebruikt voor voertuigen welke overeenkomstig het bepaalde in
      [artikel 27 van het Kentekenreglement][ref1] in bedrijfsvoorraad worden opgenomen. Het erkende bedrijf mag alleen
      de bedrijfsvoorraadpassen en kentekenbewijzen deel II gebruiken die hiertoe door de Dienst Wegverkeer aan het
      bedrijf zijn verstrekt.

      4 Indien een bedrijfsvoorraadpas verloren is geraakt of teniet is gegaan, dient het erkende bedrijf dit onverwijld
      te melden aan de Dienst Wegverkeer. De werking van de pas wordt dan door de Dienst Wegverkeer geblokkeerd. Ingeval
      de melding telefonisch is gedaan, dient het bedrijf de melding binnen twee weken schriftelijk aan de Dienst
      Wegverkeer te bevestigen. Indien na twee weken na de melding geen schriftelijke bevestiging is ontvangen, wordt de
      werking van de pas hersteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel27
    url: https://wetten.overheid.nl/BWBR0007089/2025-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '27'
  - number: 10a
    text: |-
      1 De erkenninghouder mag een voertuig slechts in bedrijfsvoorraad aanmelden, indien hij de bijbehorende
      kentekenplaten volgens de modellen 18.2A tot en met 18.2E, met uitzondering van kentekenplaten met een donkerblauwe
      achtergrond, 27.1A tot en met 27.1E, 27.30A tot en met 27.31E en 30.1A tot en met 30.4D van de [bijlage bij de
      Regeling kentekens en kentekenplaten](onbekend) in ontvangst heeft genomen. Het aantal in ontvangst te nemen
      kentekenplaten bedraagt één bij voertuigen op twee of drie wielen, landbouw- of bosbouwtrekkers, motorrijtuigen
      met beperkte snelheid, mobiele machines, bromfietsen of aanhangwagens respectievelijk twee bij andere voertuigen.
      Het voorgaande is niet van toepassing indien het voertuigen betreft waarbij alleen bijbehorende donkerblauwe
      kentekenplaten in ontvangst genomen zijn.

      2 Het eerste lid is niet van toepassing indien in de aanmelding tevens melding wordt gemaakt van het voorgoed
      buiten gebruik stellen van het voertuig en van het ontbreken van kentekenplaten.
    url: https://wetten.overheid.nl/BWBR0007089/2025-07-01#Artikel10a
  - number: 10b
    text: |-
      Het is de erkenninghouder niet toegestaan voertuigen die zijn voorzien van lichtblauwe kentekenplaten volgens
      de modellen 18.2A tot en met 18.2E of 27.30A tot en met 27.31E aan te melden in bedrijfsvoorraad, tenzij in de
      aanmelding tevens melding wordt gemaakt van het voorgoed buiten gebruik stellen van het voertuig.
    url: https://wetten.overheid.nl/BWBR0007089/2025-07-01#Artikel10b
  - number: 10c
    text: |-
      Aan een op grond van [artikel 23k van het Besluit voertuigen][ref1] bestaande verplichting wordt gevolg gegeven
      door de tellerstand van een motorrijtuig te verstrekken aan de Dienst Wegverkeer door middel van datacommunicatie-
      apparatuur als bedoeld in [artikel 5][ref2], [6, tweede lid, onderdeel c][ref3], of [9, tiende lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0025554#Artikel23k
