  - number: 4a
    text: In de erkenning worden de vestigingen vermeld waarop de aanvraag betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0007089/2025-07-01#Artikel4a
  - number: '5'
    text: |-
      De aanvrager van de bevoegdheid, bedoeld in [artikel 46, tweede lid, onderdeel d, van het Kentekenreglement][ref1],
      dient te beschikken over voor de bevoegdheid door de Dienst Wegverkeer goedgekeurde datacommunicatie-apparatuur,
      geschikt voor communicatie in een door de Dienst Wegverkeer geaccepteerd netwerk.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel46
    url: https://wetten.overheid.nl/BWBR0007089/2025-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '46'
  - number: '6'
    text: |-
      1 De bevoegdheid, bedoeld in [artikel 46, tweede lid, onderdeel a, van het Kentekenreglement][ref1], heeft
      betrekking op:

      a. de aanvraag van het versneld inschrijven van voertuigen met een afzonderlijk onderzoek van het betrokken
      voertuig en met een afzonderlijke controle op de afdracht van de ter zake van het voertuig verschuldigde
      belastingen en rechten, of

      b. de aanvraag van het versneld inschrijven van voertuigen zonder afzonderlijk onderzoek van het betrokken voertuig
      en zonder afzonderlijke controle op de afdracht van de ter zake van het voertuig verschuldigde belastingen en
      rechten.

      2 Voor zover de aanvraag betrekking heeft op de bevoegdheid, bedoeld in het eerste lid, onderdeel b, is de
      aanvrager van de bevoegdheid in het bezit van:

      a. voor zover van toepassing op de categorie voertuigen waarvoor inschrijving wordt gevraagd: toestemming als
      bedoeld in [artikel 8 van de Wet op de belasting van personenauto’s en motorrijwielen 1992][ref2],

      b. voor zover de aanvraag betrekking heeft op voertuigen, waarvoor een nationale typegoedkeuring is afgegeven: die
      typegoedkeuring dan wel, indien de typegoedkeuring is verleend aan de fabrikant, een machtiging van deze fabrikant
      om gebruik te maken van deze typegoedkeuring,

      c. indien de aanvragen door middel van datacommunicatie worden ingediend: voor de bevoegdheid door de Dienst
      Wegverkeer goedgekeurde datacommunicatie-apparatuur, geschikt voor communicatie in een door de Dienst Wegverkeer
      geaccepteerd netwerk,

      d. voor zover van toepassing op de categorie voertuigen waarvoor kentekenbewijzen worden aangevraagd: een
      algemeen verbindend verklaarde overeenkomst ten behoeve van de afdracht van de door het bedrijf verschuldigde
      afvalbeheerbijdrage voor autowrakken, bedoeld in [artikel 49, eerste lid, onderdeel c, van de wet][ref3], dan wel
      een instemming als bedoeld in [artikel 13, eerste lid, van het Besluit beheer autowrakken][ref4], en

      e. een organisatieschema van het bedrijf en een door de Dienst Wegverkeer goedgekeurd kwaliteitshandboek van het
      bedrijf waarin het volgende staat beschreven:

      1°. voor zover van toepassing op de categorie voertuigen waarvoor inschrijving wordt aangevraagd: de
      functionaliteit van de automatisering,

      2°. de verantwoordelijkheden, bevoegdheden en kennis van afdelingen en personen alsmede de verhouding tussen deze
      afdelingen respectievelijk personen voor zover deze werkzaamheden verrichten in het kader van de aanvraag tot
      versneld inschrijving van voertuigen of daar leiding aan geven, en

      3°. voor zover de aanvraag betrekking heeft op voertuigen, waarvoor een Europese typegoedkeuring is verleend: een
      procesbeschrijving waaruit blijkt dat de certificaten van overeenstemming aanwezig zijn bij de aanvrager op het
      moment van de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0005806#Artikel8
