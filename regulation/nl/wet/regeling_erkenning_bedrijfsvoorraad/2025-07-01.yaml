  - number: '14'
    text: |-
      1 Onverminderd [hoofdstuk 3][ref1] zijn op de bevoegdheid, bedoeld in
      [artikel 46, tweede lid, onderdeel b, van het Kentekenreglement][ref2], het tweede tot en met vijfde lid van
      toepassing.

      2 De melding dat een voertuig voorgoed buiten Nederland wordt gebracht, kan door het erkende bedrijf alleen
      worden gedaan voor voertuigen die in het kentekenregister als bedrijfsvoorraad van het erkende bedrijf staan
      geregistreerd. Bij de melding geeft het erkende bedrijf de lamineercodes van de overeenkomstig [artikel 10a][ref3]
      ingenomen kentekenplaten van het voertuig op.

      3 Na de melding meldt de Dienst Wegverkeer een transactiecode en reikt een kentekenbewijs deel II uit.

      4 Het erkende bedrijf ontwaardt de kentekencard op een door de Dienst Wegverkeer vastgestelde wijze en geeft, in
      geval van levering van het voertuig in Nederland aan een in het buitenland woonachtig dan wel gevestigd persoon de
      kentekencard en het kentekenbewijs deel II aan de persoon die het voertuig naar het buitenland brengt.

      5 Het erkende bedrijf brengt bij de persoon die het voertuig naar het buitenland brengt
      onder de aandacht dat er een verzekering tegen wettelijke aansprakelijkheid als bedoeld de
      [Wet aansprakelijkheidsverzekering motorrijtuigen][ref4] dient te zijn afgesloten alvorens met het voertuig van de
      weg gebruik wordt gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0007089#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel46
      [ref3]: https://wetten.overheid.nl/BWBR0007089#Artikel10a
      [ref4]: https://wetten.overheid.nl/BWBR0002415
