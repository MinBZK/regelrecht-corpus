articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder erkenning: erkenning als bedoeld in
      [artikel 62, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel62
    url: https://wetten.overheid.nl/BWBR0007089/2025-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '62'
  - number: '2'
    text: Als modellen voor bedrijfsvoorraadpassen worden vastgesteld de modellen 1.1 en 1.2 in de bijlage bij deze regeling.
    url: https://wetten.overheid.nl/BWBR0007089/2025-07-01#Artikel2
  - number: '3'
    text: |-
      Als personen en instanties als bedoeld in [artikel 47, eerste lid, onderdeel c, van het Kentekenreglement][ref1],
      door wie een erkenning kan worden aangevraagd en aan wie een erkenning kan worden verleend, worden aangewezen:

      a. de Directie Domeinen van het Ministerie van Financiën, en

      b. verzekeringsmaatschappijen.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel47
    url: https://wetten.overheid.nl/BWBR0007089/2025-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '47'
  - number: '4'
    text: |-
      1 De aanvrager of de onderneming van de aanvrager van een erkenning, bedoeld in
      [artikel 47, eerste lid, onderdeel a of b, van het Kentekenreglement][ref1], dient te zijn
      ingeschreven in het handelsregister, bedoeld in [artikel 2 van de Handelsregisterwet 2007][ref2].
      Uit de inschrijving dient te blijken dat de aanvraag een onderneming als bedoeld in
      [artikel 47, eerste lid, onderdeel a of b, van het Kentekenreglement][ref3] betreft.

      2 De aanvrager van een erkenning, bedoeld in [artikel 3, onderdeel b][ref4], dient in het bezit te
      zijn van een vergunning als bedoeld in [artikel 2:31, eerste lid][ref5], [2:37, eerste lid][ref6], of
      [2:41, eerste lid, van de Wet op het financieel toezicht][ref7].

      3 De aanvrager van een erkenning moet beschikken over een of meer terreinen waarop de bedrijfsvoorraad kan worden
      gestald.

      4 De aanvrager van een erkenning moet beschikken over een goed afsluitbare voorziening, waarin de op de erkenning
      betrekking hebbende bescheiden en documenten kunnen worden opgeborgen.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel47
