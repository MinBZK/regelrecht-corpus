  - number: '7'
    text: |-
      De aanvrager van de bevoegdheid, bedoeld in [artikel 46, tweede lid, onderdeel b, van het Kentekenreglement][ref1]
      beschikt over een afsluitbare voorziening welke naar het oordeel van de Dienst Wegverkeer voldoende bescherming
      tegen inbraak biedt en waarin kentekenbewijzen deel II veilig kunnen worden opgeborgen.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel46
    url: https://wetten.overheid.nl/BWBR0007089/2025-07-01#Artikel7
