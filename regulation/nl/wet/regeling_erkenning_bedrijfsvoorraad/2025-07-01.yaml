  - number: '9'
    text: |-
      1 Het erkende bedrijf moet het bij en krachtens de wet bepaalde omtrent de bedrijfsvoorraad, de erkenning
      alsmede de registratie, het gebruik en de beëindiging van de registratie van de tot de bedrijfsvoorraad behorende
      voertuigen in acht nemen.

      2 Het erkende bedrijf draagt er zorg voor dat bij voortduring wordt voldaan aan de eisen en voorschriften die
      gelden voor de erkenning.

      3 Het erkende bedrijf is verplicht wijzigingen in de bedrijfsactiviteit alsmede wijzigingen in de bedrijfsgegevens,
      voor zover deze van belang kunnen zijn voor de erkenning, onverwijld schriftelijk te melden aan de Dienst
      Wegverkeer.

      4 Het personeel van het erkende bedrijf moet, voor zover dit nodig is in het kader van hun functie, op de hoogte
      zijn van de regels die gelden voor de registratie van voertuigen in en uit bedrijfsvoorraad en de regels en
      voorschriften die gelden voor de erkenning bedrijfsvoorraad en de daaraan verbonden bevoegdheden.

      5 Het erkende bedrijf moet een afschrift van de beschikking waaruit blijkt dat de erkenning is verleend en welke
      bevoegdheden daaraan zijn verbonden, aanwezig hebben. Het erkende bedrijf moet de beschikking op verzoek ter inzage
      geven aan klanten.

      6 Vanaf de buitenkant van het bedrijf is op een door de Dienst Wegverkeer vastgestelde en de Staatscourant
      bekendgemaakte wijze zichtbaar dat de erkenning is verleend en welke bevoegdheden daaraan zijn verbonden.

      7 Het erkende bedrijf draagt er zorg voor dat in de bedrijfsvoorraad slechts worden en zijn opgenomen:

      a. voertuigen die bestemd zijn om te worden verkocht;

      b. voertuigen die bestemd zijn om te worden gedemonteerd indien het erkende bedrijf beschikt over de bevoegdheid,
      bedoeld in [artikel 46, tweede lid, onderdeel c, van het Kentekenreglement][ref1], of

      c. bromfietsen die niet bestemd zijn om te worden verkocht gedurende een eenmalige periode van vier aaneengesloten
      weken.

      8 Het erkende bedrijf draagt er zorg voor dat met voertuigen die nog niet zijn ingeschreven in het
      kentekenregister, alsmede met voertuigen die in de bedrijfsvoorraad van het erkende bedrijf zijn opgenomen,
      geen gebruik wordt gemaakt van de openbare weg zonder dat zij zijn voorzien van een aan het bedrijf opgegeven
      handelaarskenteken.

      9 Het erkende bedrijf bewaart de bedrijfsvoorraadpassen, de kentekenbewijzen deel II, de in het bezit zijnde
      kentekencards van de in bedrijfsvoorraad geregistreerde voertuigen alsmede alle overige in het kader van de
      erkenning aan het erkende bedrijf verstrekte documenten en bescheiden in de in [artikel 4, vierde lid][ref2],
      bedoelde voorziening.

      10 Voor zover het erkende bedrijf in het kader van de erkenning en de daaraan verbonden bevoegdheden gebruik maakt
      van datacommunicatieapparatuur, dient het bedrijf gebruik te maken van de door de Dienst Wegverkeer goedgekeurde
      datacommunicatieapparatuur en de communicatie te laten plaatsvinden in een door deze dienst geaccepteerd netwerk.
      Bij dit gebruik dient het bedrijf de door de Dienst Wegverkeer gegeven aanwijzingen in acht te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0007089#Artikel4
