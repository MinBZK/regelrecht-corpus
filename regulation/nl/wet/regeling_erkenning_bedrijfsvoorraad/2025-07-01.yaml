  - number: '12'
    text: |-
      1 De Dienst Wegverkeer verstrekt aan het erkende bedrijf formulieren ‘centrale afhandeling’ voor de gevallen dat na
      de melding door het bedrijf blijkt dat de registratie van het voertuig in bedrijfsvoorraad niet is toegestaan.

      2 Indien een voertuig ten onrechte in bedrijfsvoorraad is geregistreerd, meldt het erkende bedrijf dit binnen
      twee weken aan de Dienst Wegverkeer. Hiervoor dient het bedrijf gebruik te maken van de door de Dienst Wegverkeer
      verstrekte formulieren ‘correctie-melding bedrijfsvoorraad’.
    url: https://wetten.overheid.nl/BWBR0007089/2025-07-01#Artikel12
  - number: '13'
    text: |-
      1 Onverminderd [hoofdstuk 3][ref1] zijn op de bevoegdheid, bedoeld in
      [artikel 46, tweede lid, onderdeel a, van het Kentekenreglement][ref2], het tweede tot en met vierde lid van
      toepassing.

      2 Het erkende bedrijf dat het voertuig heeft ingeschreven, ziet er op toe dat op het moment waarop het voertuig
      wordt verkocht aan een ander dan een erkend bedrijf, het voertuig te naam wordt gesteld. Het bedrijf verstrekt
      hiertoe de tenaamstellingcode aan degene aan wie het voertuig wordt overgedragen.

      3 In gevallen als bedoeld in [artikel 6, eerste lid, onderdeel b][ref3]:

      a. handelt het erkende bedrijf overeenkomstig het door de Dienst Wegverkeer goedgekeurde kwaliteitshandboek van het
      bedrijf. Wijzigingen in het kwaliteitshandboek worden door de Dienst Wegverkeer goedgekeurd voordat overeenkomstig
      de wijzigingen wordt gehandeld;

      b. vraagt het erkende bedrijf alleen inschrijving van voertuigen die:

      1°. nog niet eerder in gebruik zijn genomen, en

      2°. behoren tot het type waarvoor een nationale typegoedkeuring is verleend aan het erkende bedrijf of aan de
      fabrikant door wie het erkende bedrijf is gemachtigd om van die typegoedkeuring gebruik te maken, dan wel behoren
      tot een type waarvoor een typegoedkeuring als bedoeld in [artikel 22, tweede lid, van de wet][ref4] is verleend en
      waarbij certificaten van overeenstemming aanwezig zijn;

      3°. voor zover de inschrijving betrekking heeft op een aangewezen bromfiets als bedoeld in artikel 20b van de wet,
      behoren tot het type waarvoor aan het erkende bedrijf dat de inschrijving vraagt een aanwijzing als bedoeld in
      artikel 20b van de wet is verleend en waarvoor overeenkomstig [artikel 3.11.3 van de Regeling voertuigen][ref5]
      positief is beslist op een verzoek als bedoeld in dat artikel;

      c. betaalt het erkende bedrijf de voor de aanvraag tot inschrijving verschuldigde tarieven op een door de Dienst
      Wegverkeer te bepalen wijze;

      d. draagt het erkende bedrijf zorg voor een correcte afdracht van de verschuldigde belasting van personenauto's
      en motorrijwielen;

      e. betaalt het erkende bedrijf de verschuldigde afvalbeheerbijdrage voor autowrakken, bedoeld in
      [artikel 49, eerste lid, onderdeel c, van de wet][ref6], dan wel neemt de maatregelen waarop de instemming, bedoeld
      in [artikel 6, tweede lid, onderdeel d][ref7], betrekking heeft;

      f. verstrekt het erkende bedrijf de door de Dienst Wegverkeer te bepalen gegevens met betrekking tot het voertuig,
      welke gegevens overeen dienen te komen met de gegevens op het certificaat van overeenstemming, en

      g. toont het erkende bedrijf op verzoek van daartoe bevoegde ambtenaren de voertuigen waarvoor inschrijving is
      aangevraagd, alsmede de daarbij behorende certificaten van overeenstemming.


