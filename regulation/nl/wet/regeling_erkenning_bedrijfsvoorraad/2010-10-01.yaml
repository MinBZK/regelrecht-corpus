    text: |-
      1 Onverminderd [hoofdstuk 3][ref1] zijn op de bevoegdheid, bedoeld in
      [artikel 46, tweede lid, onderdeel d, van het Kentekenreglement][ref2], het tweede tot en met vijfde lid van
      toepassing.

      2 De melding dat een voertuig voorgoed buiten gebruik is gesteld, kan door het erkende bedrijf alleen worden gedaan
      voor voertuigen die in het kentekenregister als bedrijfsvoorraad van het erkende bedrijf staan geregistreerd.

      3 Voorafgaand aan de melding dat een voertuig voorgoed buiten gebruik is gesteld ontwaardt het erkende bedrijf het
      kentekenbewijs op een door de Dienst Wegverkeer vastgestelde wijze, met dien verstande dat het erkende bedrijf de
      kentekenbewijzen per dag of per week in setjes verzamelt en deze binnen vijf werkdagen naar de Dienst Wegverkeer
      opstuurt tezamen met een ingevulde verklaring van een door de Dienst Wegverkeer vastgesteld model, of dat het
      erkende bedrijf het voorgoed buiten gebruik stellen via geautomatiseerde weg aan de Dienst Wegverkeer meldt en
      de kentekenbewijzen in setjes per kalendermaand verzamelt en deze vervolgens na een door de Dienst Wegverkeer
      vastgestelde periode naar de Dienst Wegverkeer opstuurt tezamen met een ingevulde verklaring van een door de Dienst
      Wegverkeer vastgesteld model.

      Indien het kentekenbewijs niet meer compleet is, dient het bedrijf bij de resterende delen van het kentekenbewijs
      onder vermelding van het bedrijfsnummer een verklaring te voegen waaruit blijkt dat het gehele kentekenbewijs bij
      de opname van het voertuig in bedrijfsvoorraad aan het bedrijf is overgedragen.

      4 Het erkende bedrijf controleert bij toepassing van [artikel 27, negende lid, van het Kentekenreglement][ref3]
      het legitimatiebewijs van degene die het voertuig overdraagt alsmede diens verklaring alvorens te melden dat het
      voertuig voorgoed buiten gebruik is gesteld. Nadat de melding door de Dienst Wegverkeer is geaccepteerd, stuurt
      het erkende bedrijf de verklaring met de resterende delen van het kentekenbewijs op naar de Dienst Wegverkeer
      overeenkomstig het derde lid.

      5 Ten behoeve van de controle op de juiste verwerking van de meldingen van het bedrijf aan de Dienst Wegverkeer
      wordt periodiek door de Dienst Wegverkeer een lijst verzonden aan het erkende bedrijf. Op deze lijst staan de
      gegevens van de als voorgoed buiten gebruik gesteld geregistreerde voertuigen. Opmerkingen naar aanleiding van deze
      lijst dienen schriftelijk bij de Dienst Wegverkeer te worden ingediend.

      6 Alvorens het erkende bedrijf meldt dat het voertuig voorgoed buiten gebruik is gesteld, dient het erkende bedrijf
      het te verstrekken vrijwaringsbewijs, als bedoeld in [artikel 27 van het Kentekenreglement][ref4], te voorzien van
      een stempel waaruit blijkt dat dit vrijwaringsbewijs tevens als certificaat van vernietiging geldt.


