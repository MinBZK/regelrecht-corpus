  - number: 8a
    text: |-
      De aanvrager van de bevoegdheid, bedoeld in [artikel 46, tweede lid, onderdeel f, van het Kentekenreglement][ref1]:

      a. is in het bezit van de bevoegdheid, bedoeld in
      [artikel 46, tweede lid, onderdeel a, van het Kentekenreglement][ref2], of verkrijgt die bevoegdheid uiterlijk
      gelijktijdig met de bevoegdheid, bedoeld in [artikel 46, tweede lid, onderdeel f][ref3], en

      b. beschikt over een afsluitbare voorziening welke naar het oordeel van de Dienst Wegverkeer voldoende bescherming
      tegen inbraak biedt en waarin de in [artikel 15b, vierde lid][ref4], genoemde documenten veilig kunnen worden
      opgeborgen.


