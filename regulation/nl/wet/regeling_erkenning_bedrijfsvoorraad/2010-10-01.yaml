  - number: 4a
    text: In de erkenning worden de vestigingen vermeld waarop de aanvraag betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0007089/2010-10-01#Artikel4a
  - number: '5'
    text: |-
      De aanvrager van de bevoegdheid, bedoeld in
      [artikel 46, tweede lid, onderdeel a, of f, van het Kentekenreglement][ref1], dient te beschikken over voor de
      bevoegdheid door de Dienst Wegverkeer goedgekeurde datacommunicatie-apparatuur, geschikt voor communicatie in een
      door de Dienst Wegverkeer geaccepteerd netwerk.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel46
    url: https://wetten.overheid.nl/BWBR0007089/2010-10-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '46'
  - number: '6'
    text: |-
      1 De bevoegdheid, bedoeld in [artikel 46, tweede lid, onderdeel b, van het Kentekenreglement][ref1], heeft
      betrekking op:

      a. de aanvraag van nog niet tenaamgestelde kentekenbewijzen met een afzonderlijk onderzoek van het betrokken
      voertuig en met een afzonderlijke controle op de afdracht van de ter zake van het voertuig verschuldigde
      belastingen en rechten, of

      b. de aanvraag van nog niet tenaamgestelde kentekenbewijzen zonder afzonderlijk onderzoek van het betrokken
      voertuig en zonder afzonderlijke controle op de afdracht van de ter zake van het voertuig verschuldigde belastingen
      en rechten.

      2 Voor zover de aanvraag betrekking heeft op de bevoegdheid, bedoeld in het eerste lid, onderdeel b, dient de
      aanvrager van de bevoegdheid:

      a. voor zover van toepassing op de categorie voertuigen waarvoor kentekenbewijzen worden aangevraagd, in het bezit
      te zijn van een ingevolge [artikel 8 van de Wet op de belasting van personenauto's en motorrijwielen 1992][ref2]
      aan de aanvrager afgegeven vergunning,

      b. voor zover de aanvraag betrekking heeft op voertuigen, waarvoor een nationale typegoedkeuring is afgegeven, in
      het bezit te zijn van die typegoedkeuring dan wel, indien de typegoedkeuring is verleend aan de fabrikant, door
      deze fabrikant te zijn gemachtigd om gebruik te maken van deze typegoedkeuring,

      c. indien de aanvragen door middel van datacommunicatie worden ingediend, in het bezit te zijn van voor de
      bevoegdheid door de Dienst Wegverkeer goedgekeurde datacommunicatie-apparatuur, geschikt voor communicatie in een
      door de Dienst Wegverkeer geaccepteerd netwerk, en

      d. in het bezit te zijn van een organisatieschema van het bedrijf en een door de Dienst Wegverkeer goedgekeurd
      kwaliteitshandboek van het bedrijf waarin het volgende staat beschreven:

      1º. de procedures, de controle-maatregelen, de technische handelingen alsmede de administratieve handelingen die
      worden verricht met betrekking tot de aanvraag, ontvangst, controle en doorzending van nog niet tenaamgestelde
      kentekenbewijzen,

      2º. voor zover van toepassing op de categorie voertuigen waarvoor kentekenbewijzen worden aangevraagd, de
      functionaliteit van de automatisering,

      3º. de verantwoordelijkheden, bevoegdheden en kennis van afdelingen en personen alsmede de verhouding tussen deze
      afdelingen respectievelijk personen voor zover deze werkzaamheden verrichten in het kader van de aanvraag van nog
      niet tenaamgestelde kentekenbewijzen of daar leiding aan geven, en

      4º. voor zover de aanvraag betrekking heeft op voertuigen, waarvoor een Europese typegoedkeuring is verleend: een
      procesbeschrijving waaruit blijkt dat de certificaten van overeenstemming aanwezig zijn bij de aanvrager op het
      moment van de aanvraag van een nog niet tenaamgesteld kentekenbewijs.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0005806#Artikel8
