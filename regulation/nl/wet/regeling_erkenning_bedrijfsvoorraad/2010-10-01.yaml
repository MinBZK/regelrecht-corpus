    text: |-
      De aanvrager van de bevoegdheid, bedoeld in [artikel 46, tweede lid, onderdeel c, van het Kentekenreglement][ref1],
      dient in het bezit te zijn van de bevoegdheid bedoeld in
      [artikel 46, tweede lid, onderdeel a, van het Kentekenreglement][ref2], of deze tegelijk met de onderhavige
      bevoegdheid aan te vragen en te verkrijgen.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel46
