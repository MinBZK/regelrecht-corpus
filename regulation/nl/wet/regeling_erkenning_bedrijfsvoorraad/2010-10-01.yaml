  - number: '3'
    text: |-
      Als personen en instanties als bedoeld in [artikel 47, eerste lid, onderdeel c, van het Kentekenreglement][ref1],
      door wie een erkenning kan worden aangevraagd en aan wie een erkenning kan worden verleend, worden aangewezen:

      a. de Directie Domeinen van het Ministerie van Financiën, en

      b. verzekeringsmaatschappijen.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel47
    url: https://wetten.overheid.nl/BWBR0007089/2010-10-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '47'
  - number: '4'
    text: |-
      1 De aanvrager of de onderneming van de aanvrager van een erkenning, bedoeld in
      [artikel 47, eerste lid, onderdeel a of b, van het Kentekenreglement][ref1], dient te zijn
      ingeschreven in het handelsregister, bedoeld in [artikel 2 van de Handelsregisterwet 1996][ref2].
      Uit de inschrijving dient te blijken dat de aanvraag een onderneming als bedoeld in
      [artikel 47, eerste lid, onderdeel a of b, van het Kentekenreglement][ref3] betreft.

      2 De aanvrager van een erkenning, bedoeld in
      [artikel 47, eerste lid, onderdeel a of b, van het Kentekenreglement][ref4], dient in het bezit te zijn van:

      a. een omgevingsvergunning als bedoeld in
      [artikel 1.1, eerste lid, van de Wet algemene bepalingen omgevingsrecht][ref5] voor het in werking hebben van
      een inrichting die behoort tot categorie 28.1, onder a, onder 3°, of b, voor zover het betreft het bewerken van
      autowrakken of afgedankte motorfietsen, zoals genoemd in [bijlage I, onder C, bij het Besluit omgevingsrecht][ref6];

      b. een ontvangstbevestiging van een melding als bedoeld in [artikel 8.41 van de Wet milieubeheer][ref7], voor zover
      gedaan voor een inrichting, waar voertuigen worden verkocht, dan wel

      c. een door de Rijksbelastingdienst afgegeven verklaring waaruit blijkt dat een onderneming als bedoeld in
      [artikel 47, eerste lid, onderdeel a of b, van het Kentekenreglement][ref8] wordt uitgeoefend.

      3 De aanvrager van een erkenning, bedoeld in [artikel 3, onderdeel b][ref9], dient in het bezit te zijn van een
      vergunning als bedoeld in [artikel 24 van de Wet toezicht verzekeringsbedrijf 1993][ref10].

      4 De aanvrager van een erkenning moet beschikken over een of meer terreinen waarop de bedrijfsvoorraad kan worden
      gestald.

      5 De aanvrager van een erkenning moet beschikken over een goed afsluitbare voorziening, waarin de op de erkenning
      betrekking hebbende bescheiden en documenten kunnen worden opgeborgen.


