    text: |-
      In deze regeling wordt verstaan onder:



            a
            erkenning:

              erkenning als bedoeld in [artikel 62, eerste lid, van de wet][ref1];



            b
            uitvoerkentekenbewijs:

              kentekenbewijs, bevattende een kenteken als bedoeld in
      [artikel 4, vijfde lid, aanhef en onder a, van het Kentekenreglement][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel4
