  - number: 15b
    text: |-
      1 Onverminderd [hoofdstuk 3][ref1] zijn op de bevoegdheid, bedoeld in
      [artikel 46, tweede lid, onderdeel f, van het Kentekenreglement][ref2], het tweede tot en met dertiende lid van
      toepassing.

      2 De uitoefening van de bevoegdheid heeft slechts plaats vanaf de locatie die door het erkende
      bedrijf als bedrijfsadres is opgegeven en welke op het uittreksel uit het handelsregister, bedoeld in
      [artikel 2 van de Handelsregisterwet 1996][ref3], als zodanig is vermeld.

      3 De Dienst Wegverkeer verstrekt aan het erkende bedrijf genummerde, nog niet tenaamgestelde delen I B welke bij
      de indiening van de aanvraag van een kentekenbewijs of nieuw deel I B door het bedrijf op nummervolgorde worden
      gebruikt. Het erkende bedrijf gebruikt slechts de door de Dienst Wegverkeer aan dit bedrijf verstrekte delen I B.

      4 De volgende documenten worden opgeslagen in een afsluitbare voorziening als bedoeld in
      [artikel 8a, onderdeel b][ref4]:

      a. nog niet tenaamgestelde delen I B;

      b. geprinte delen I B welke onjuist zijn of niet zijn verstrekt aan een koper van een voertuig;

      c. ondertekende verklaringen als bedoeld in [artikel 25a, tweede lid][ref5], en
      [artikel 28a, tweede lid, van het Kentekenreglement][ref6];

      d. ondertekende machtigingen als bedoeld in [artikel 25a, derde lid][ref7], en
      [artikel 28a, derde lid, van het Kentekenreglement][ref8].

      De documenten, bedoeld onder b, c en d, worden door het erkende bedrijf vernietigd wanneer ten minste twee en ten
      hoogste drie jaren zijn verstreken sinds de dag van tenaamstelling.

      5 In geval van vermissing van nog niet gebruikte delen I B doet het bedrijf, onder opgave van de nummers en
      overlegging van een proces verbaal van aangifte van vermissing, daarvan onverwijld mededeling aan de Dienst
      Wegverkeer.

      6 Het erkende bedrijf draagt zorg voor een zodanige registratie van de identiteit van de medewerker die een
      aanvraag voor een kentekenbewijs of deel I B feitelijk indient, dat voor de Dienst Wegverkeer te allen tijde
      eenvoudig kenbaar is welke medewerker een bepaalde aanvraag in behandeling heeft genomen.

      7 Indien de aanvrager van een kentekenbewijs of een deel I B een natuurlijk persoon is als bedoeld in
      [artikel 25a, tweede lid][ref9], of [artikel 28a, tweede lid, van het Kentekenreglement][ref10], geschiedt
      de indiening in aanwezigheid van deze persoon. Nadat de aanvrager zich heeft gelegitimeerd door middel
      van overlegging van een legitimatiebewijs als bedoeld in [artikel 25a, tweede en derde lid][ref11], of
      [artikel 28a, tweede en derde lid, van het Kentekenreglement][ref12], voorzover van toepassing voorzien van de
      daar voorgeschreven mededeling van registratie, en het erkende bedrijf zich er van heeft overtuigd dat dit met
      de identiteit van de aanvrager overeenstemt, legt het bedrijf aan de aanvrager een verklaring als bedoeld in
      [artikel 25a, tweede lid][ref13], of [artikel 28a, tweede lid, van het Kentekenreglement][ref14], ter ondertekening
      voor. De verklaring vermeldt:

      a. de naam en het adres van de aanvrager,

      b. het nummer van het getoonde rijbewijs en, indien van toepassing, het nummer van de mededeling van registratie,

      c. de geboortedatum van de aanvrager,

      d. het kenteken van het voertuig dat wordt overgedragen,

      e. de naam en het bedrijfsnummer van het erkende bedrijf waar de aanvraag wordt ingediend, en f. de handtekening
      van de aanvrager.

      8 Nadat de aanvrager de verklaring als bedoeld in het vorige lid heeft overgelegd, gaat het erkende bedrijf over
      tot de indiening van de aanvraag bij de Dienst Wegverkeer. Bij de indiening worden de volgende gegevens verstrekt
      aan de Dienst Wegverkeer:

      a. de meldcode, de duplicaatcode en het kenteken, vermeld op het na 30 mei 2004 afgegeven deel II dan wel het
      overschrijvingsbewijs, en

      b. het nummer van het getoonde rijbewijs en de geboortedatum van de aanvrager.

      9 9. Indien de aanvraag, bedoeld in het zevende lid, een voertuig betreft waarvoor reeds een nog niet tenaamgesteld
      kentekenbewijs is afgegeven, wordt, voordat het kentekenbewijs aan de aanvrager ter beschikking wordt gesteld, deel
      I A en het na 30 mei 2004 afgegeven deel II dan wel deel I en het overschrijvingsbewijs door het erkende bedrijf
      bestempeld, zodanig dat, duidelijk leesbaar, de juiste datum blijkt waarop het kentekenbewijs is afgegeven. Het
      kentekenbewijs wordt na de indiening terstond aan de aanvrager ter hand gesteld.

      10 Indien de aanvraag van een kentekenbewijs of een deel I B wordt gedaan door een rechtspersoon, en
      aan het erkende bedrijf hiertoe een ondertekende machtiging met bijbehorende bescheiden als bedoeld
      in [artikel 25a, derde lid][ref15], of [artikel 28a, derde lid, van het Kentekenreglement][ref16],
      is verstrekt, verstrekt het erkende bedrijf de gegevens vermeld in
      [artikel 25a, derde lid, onderdeel c, onder 1° tot en met 5°, van het Kentekenreglement][ref17], aan de Dienst
      Wegverkeer. Indien de aanvraag betrekking heeft op een deel I B, meldt het erkende bedrijf tevens de meldcode en de
      duplicaatcode, vermeld op het na 30 mei 2004 afgegeven deel II dan wel het overschrijvingsbewijs.

      11 Indien de aanvraag, bedoeld in het tiende lid, een voertuig betreft, waarvoor reeds een nog niet tenaamgesteld
      kentekenbewijs is afgegeven, wordt, voordat het kentekenbewijs aan de aanvrager ter beschikking wordt gesteld, deel
      I A en het na 30 mei 2004 afgegeven deel II dan wel deel I en het overschrijvingsbewijs door het erkende bedrijf
      bestempeld, zodanig dat, duidelijk leesbaar, de juiste datum blijkt waarop het kentekenbewijs is afgegeven. Het
      kentekenbewijs wordt terstond aan de aanvrager ter beschikking gesteld.

      12 Indien als gevolg van de indiening van een aanvraag voor een natuurlijk persoon of een rechtspersoon een
      tenaamstelling heeft plaatsgevonden welke afwijkt van de verklaring, bedoeld in [artikel 25a, tweede lid][ref18],
      of [artikel 28a, tweede lid][ref19], of van de machtiging bedoeld in [artikel 25a, derde lid][ref20], of
      [artikel 28a, derde lid, van het Kentekenreglement][ref21], doet het erkende bedrijf hiervan onverwijld mededeling
      aan de Dienst Wegverkeer. Delen I B die onjuist zijn ingevuld worden door het bedrijf doorgehaald.

      13 Indien blijkt dat de ingediende aanvraag niet door de Dienst Wegverkeer wordt aanvaard, verwijst het erkende
      bedrijf de aanvrager naar de Dienst Wegverkeer.


