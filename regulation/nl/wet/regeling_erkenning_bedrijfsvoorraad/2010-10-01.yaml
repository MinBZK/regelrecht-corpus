  - number: '13'
    text: |-
      1 Onverminderd [hoofdstuk 3][ref1] zijn op de bevoegdheid, bedoeld in
      [artikel 46, tweede lid, onderdeel b, van het Kentekenreglement][ref2], het tweede tot en met achtste lid van
      toepassing.

      2 Het erkende bedrijf dient vóór de verstrekking van het nog niet tenaamgestelde kentekenbewijs de verschuldigde
      verwijderingsbijdrage voor autowrakken, bedoeld in [artikel 49, eerste lid, onderdeel c, van de wet][ref3], te
      voldoen.

      3 In geval van vermissing van een nog niet tenaamgesteld kentekenbewijs of deel daarvan dient het erkende bedrijf
      onder inlevering van het hiertoe bestemde formulier bij de Dienst Wegverkeer een nieuw kentekenbewijs of deel
      daarvan aan te vragen. Voor zover het voertuig bij de afgifte van het nog niet tenaamgestelde kentekenbewijs als
      niet eerder in gebruik genomen is aangemerkt, dient de aanvraag te zijn voorzien van een afzonderlijke verklaring
      van het erkende bedrijf waaruit blijkt dat het in de aanvraag omschreven voertuig niet eerder in gebruik is
      genomen.

      4 Nog niet tenaamgestelde kentekenbewijzen die niet worden gebruikt dienen, onder vermelding van de relevante
      gegevens, onverwijld in hun geheel bij de Dienst Wegverkeer te worden ingeleverd.

      5 Na ontvangst en vóór tenaamstelling van het kentekenbewijs dient het erkende bedrijf de gegevens op het
      kentekenbewijs te controleren. Indien een onjuistheid in de gegevens wordt geconstateerd, dient het kentekenbewijs
      onder opgave van redenen in zijn geheel, binnen vijf dagen na ontvangst, te worden ingeleverd bij de Dienst
      Wegverkeer met het verzoek een gecorrigeerd kentekenbewijs toe te zenden.

      6 Het erkende bedrijf waaraan het nog niet tenaamgestelde kentekenbewijs is afgegeven, ziet er op toe dat op het
      moment waarop het voertuig wordt verkocht aan een ander dan een erkend bedrijf, het kentekenbewijs te naam wordt
      gesteld. Het bedrijf verstrekt hiertoe het deel I A en het na 30 mei 2004 afgegeven deel II dan wel het deel I en
      het overschrijvingsbewijs aan degene aan wie het voertuig wordt overgedragen.

      7 Tenaamgestelde kentekenbewijzen die niet zullen worden gebruikt dienen uiterlijk vier weken na de tenaamstelling,
      onder vermelding van de relevante gegevens, in zijn geheel te worden ingeleverd bij de Dienst Wegverkeer. De Dienst
      Wegverkeer verstrekt in dat geval aan het erkende bedrijf een nieuw nog niet tenaamgesteld kentekenbewijs met
      hetzelfde kenteken.

      8 Voor zover de bevoegdheid betrekking heeft op de bevoegdheid, bedoeld in
      [artikel 6, eerste lid, onderdeel b][ref4]:

      a. dient het erkende bedrijf te handelen overeenkomstig het door de Dienst Wegverkeer goedgekeurde
      kwaliteitshandboek van het bedrijf. Wijzigingen in het kwaliteitshandboek dienen door de Dienst Wegverkeer te
      worden goedgekeurd voordat overeenkomstig de wijzigingen wordt gehandeld;

      b. mag het erkende bedrijf alleen nog niet tenaamgestelde kentekenbewijzen aanvragen voor voertuigen die:

      1º. nog niet eerder in gebruik zijn genomen, en

      2º. behoren tot het type waarvoor een nationale typegoedkeuring is verleend aan het erkende bedrijf of aan de
      fabrikant door wie het erkende bedrijf is gemachtigd om van die typegoedkeuring gebruik te maken, dan wel behoren
      tot een type waarvoor een typegoedkeuring als bedoeld in [artikel 22, tweede lid, van de wet][ref5] is verleend en
      waarbij certificaten van overeenstemming aanwezig zijn;

      c. dient het erkende bedrijf de voor de aanvraag van kentekenbewijzen verschuldigde tarieven te betalen op een door
      de Dienst Wegverkeer te bepalen wijze;

      d. draagt het erkende bedrijf zorg voor een correcte afdracht van de verschuldigde belasting van personenauto's
      en motorrijwielen;

      e. dient het erkende bedrijf de door de Dienst Wegverkeer te bepalen gegevens met betrekking tot het voertuig te
      verstrekken, welke gegevens overeen dienen te komen met de gegevens op het certificaat van overeenstemming, en

      f. dient het erkende bedrijf op verzoek van daartoe bevoegde ambtenaren de voertuigen waarvoor nog niet
      tenaamgestelde kentekenbewijzen zijn aangevraagd, alsmede de daarbij behorende certificaten van overeenstemming
      te tonen.


