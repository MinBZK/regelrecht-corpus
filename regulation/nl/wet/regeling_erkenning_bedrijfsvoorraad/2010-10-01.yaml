  - number: '12'
    text: |-
      1 Onverminderd [hoofdstuk 3][ref1] zijn op de bevoegdheid, bedoeld in
      [artikel 46, tweede lid, onderdeel a, van het Kentekenreglement][ref2], het tweede tot en met zesde lid van
      toepassing.

      2 Pas nadat het deel I B en het deel II, het deel I B en het overschrijvingsbewijs dan wel voor wat betreft een
      voor 31 mei 2004 afgegeven kentekenbewijs, het deel II en het overschrijvingsbewijs van het voor het betrokken
      voertuig afgegeven kentekenbewijs aan het erkende bedrijf is overgedragen, mag het bedrijf het voertuig voor
      registratie in bedrijfsvoorraad aanmelden.

      3 Pas nadat de Dienst Wegverkeer blijkens een code aan het erkende bedrijf heeft gemeld dat het voertuig in
      bedrijfsvoorraad is geregistreerd, mag het bedrijf een vrijwaringsbewijs uitschrijven.

      4 Nadat het vrijwaringsbewijs is uitgeschreven, dient het erkende bedrijf het deel I B dan wel voor wat betreft een
      voor 31 mei 2004 afgegeven kentekenbewijs, het deel II van voor het betrokken voertuig afgegeven kentekenbewijs op
      de door de Dienst Wegverkeer voorgeschreven wijze te ontwaarden.

      5 De Dienst Wegverkeer verstrekt aan het erkende bedrijf formulieren ‘centrale afhandeling’ voor de gevallen dat na
      de melding door het bedrijf blijkt dat de registratie van het voertuig in bedrijfsvoorraad niet is toegestaan.

      6 Indien een voertuig ten onrechte in bedrijfsvoorraad is geregistreerd, meldt het erkende bedrijf dit binnen
      twee weken aan de Dienst Wegverkeer. Hiervoor dient het bedrijf gebruik te maken van de door de Dienst Wegverkeer
      verstrekte formulieren ‘correctie-melding bedrijfsvoorraad’.


