  - number: '14'
    text: |-
      1 Onverminderd [hoofdstuk 3][ref1] zijn op de bevoegdheid, bedoeld in
      [artikel 46, tweede lid, onderdeel c, van het Kentekenreglement][ref2], het tweede tot en met twaalfde lid van
      toepassing.

      2 De melding dat een voertuig voorgoed buiten Nederland wordt gebracht, kan door het erkende bedrijf alleen
      worden gedaan voor voertuigen die in het kentekenregister als bedrijfsvoorraad van het erkende bedrijf staan
      geregistreerd.

      3 Ten behoeve van het versneld melden dat tot de bedrijfsvoorraad behorende voertuigen voorgoed buiten Nederland
      worden gebracht, verstrekt de Dienst Wegverkeer aan het erkende bedrijf blanco verklaringen welke bij de melding
      door het erkende bedrijf moeten worden gebruikt.

      4 Alvorens over te gaan tot de melding dient het erkende bedrijf een in het eerste lid bedoelde verklaring in te
      vullen of in te laten vullen door degene die het voertuig buiten Nederland brengt.

      5 Het erkende bedrijf dient, indien een voertuig in Nederland wordt overgedragen aan
      een in het buitenland woonachtige of gevestigde persoon, een kopie van het in het in
      [artikel 32, derde lid, van het Kentekenreglement][ref3] bedoelde legitimatiebewijs te maken.

      6 Na de melding meldt de Dienst Wegverkeer een transactiecode en, indien daarom is verzocht, een uitvoerkenteken
      terug. De transactiecode en het uitvoerkenteken worden door het bedrijf op de verklaring vermeld. Door vermelding
      van het uitvoerkenteken op de verklaring krijgt de verklaring mede de functie van uitvoerkentekenbewijs.

      7 Na de melding dient het erkende bedrijf het bedrijfsvoorraad deel I B dan wel het bedrijfsvoorraad deel II van
      het kentekenbewijs met behulp van een stempel van een in de bijlage bij deze regeling vastgesteld model en het
      bedrijfsnummer te bestempelen.

      8 Het erkende bedrijf geeft, in geval van levering van het voertuig in Nederland aan een in het buitenland
      woonachtig dan wel gevestigd persoon, het kentekenbewijs te zamen met het hiertoe bestemde deel van de verklaring
      aan de persoon die het voertuig naar het buitenland brengt.

      9 Het erkende bedrijf brengt bij de persoon die het voertuig naar het buitenland brengt onder de aandacht dat er,
      indien er een uitvoerkentekenbewijs is afgegeven, een verzekering tegen wettelijke aansprakelijkheid als bedoeld de
      [Wet aansprakelijkheidsverzekering motorrijtuigen][ref4] dient te zijn afgesloten alvorens met het voertuig met het
      uitvoerkentekenbewijs van de weg gebruik wordt gemaakt.

      10 Het erkende bedrijf zendt de in het vijfde lid bedoelde kopie van het legitimatiebewijs, alsmede de daartoe
      bestemde doorslag van de uitvoerverklaring respectievelijk het uitvoerkentekenbewijs binnen een week naar de Dienst
      Wegverkeer.

      11 Het erkende bedrijf dient de doorslag van de uitvoerverklaring respectievelijk het uitvoerkentekenbewijs
      gedurende een periode van een jaar te bewaren en op verzoek ter inzage te geven aan de met het toezicht op de
      erkenning belaste ambtenaren.

      12 Het erkende bedrijf dient de verschuldigde tarieven in verband met de aangevraagde uitvoerkentekenbewijzen te
      betalenop een door de Dienst Wegverkeer te bepalen wijze.


