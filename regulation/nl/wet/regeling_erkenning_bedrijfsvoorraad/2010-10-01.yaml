  - number: '8'
    text: |-
      De aanvrager van de bevoegdheid, bedoeld in [artikel 46, tweede lid, onderdeel d, van het Kentekenreglement][ref1],
      is in het bezit van een omgevingsvergunning als bedoeld in
      [artikel 1.1, eerste lid, van de Wet algemene bepalingen omgevingsrecht][ref2] voor het in werking hebben van
      een inrichting die behoort tot categorie 28.1, onder b, voor zover het betreft het bewerken van autowrakken of
      afgedankte motorfietsen, zoals genoemd in [bijlage I, onder C, bij het Besluit omgevingsrecht][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel46
