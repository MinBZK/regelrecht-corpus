    text: |-
      In de bijlage bij deze regeling zijn de volgende modellen opgenomen:

      a. een bedrijfsvoorraadpas: model 1.1, en

      en

      b. een stempel als bedoeld in [artikel 14, zevende lid][ref1]: model 2.1.


