  - number: '10'
    text: |-
      1 De Dienst Wegverkeer verstrekt in het kader van de erkenning codes aan het erkende bedrijf. Het erkende bedrijf
      draagt er zorg voor dat de codes niet toegankelijk zijn voor onbevoegden.

      2 Het erkende bedrijf ziet er op toe dat de bedrijfsvoorraadpassen en de formulieren die bestemd zijn om te dienen
      als vrijwaringsbewijs en bedrijfsvoorraad deel I B niet door anderen dan het personeel van het erkende bedrijf
      worden gebruikt en neemt ook overigens de noodzakelijke zorgvuldigheid ten aanzien van documenten en codes in acht.

      3 De bedrijfsvoorraadpassen en de formulieren die bestemd zijn te dienen als vrijwaringsbewijs en
      bedrijfsvoorraad deel I B mogen slechts worden gebruikt voor voertuigen welke overeenkomstig het bepaalde in
      [artikel 27 van het Kentekenreglement][ref1] in bedrijfsvoorraad worden opgenomen. Het erkende bedrijf mag alleen
      de bedrijfsvoorraadpassen en formulieren gebruiken die hiertoe door de Dienst Wegverkeer aan het bedrijf zijn
      verstrekt.

      4 Indien een bedrijfsvoorraadpas verloren is geraakt of teniet is gegaan, dient het erkende bedrijf dit onverwijld
      te melden aan de Dienst Wegverkeer. De werking van de pas wordt dan door de Dienst Wegverkeer geblokkeerd. Ingeval
      de melding telefonisch is gedaan, dient het bedrijf de melding binnen twee weken schriftelijk aan de Dienst
      Wegverkeer te bevestigen. Indien na twee weken na de melding geen schriftelijke bevestiging is ontvangen, wordt de
      werking van de pas hersteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel27
    url: https://wetten.overheid.nl/BWBR0007089/2010-10-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '27'
  - number: 10a
    text: |-
      1 De erkenninghouder mag een voertuig slechts in bedrijfsvoorraad aanmelden, indien hij de bijbehorende
      kentekenplaten volgens de modellen 18.2A tot en met 18.2C, met uitzondering van kentekenplaten met een donkerblauwe
      achtergrond, 27.1A tot en met 27.10C, 27.30A tot en met 27.31C en 30.1A tot en met 30.4D van de [bijlage bij
      de Regeling kentekens en kentekenplaten](onbekend) in ontvangst heeft genomen. Het aantal in ontvangst te nemen
      kentekenplaten bedraagt één bij voertuigen op twee of drie wielen, bromfietsen of aanhangwagens, respectievelijk
      twee bij voertuigen op meer dan drie wielen. Het voorgaande is niet van toepassing indien het voertuigen betreft
      waarbij alleen bijbehorende donkerblauwe kentekenplaten in ontvangst genomen zijn.

      2 Het eerste lid is niet van toepassing indien in de aanmelding tevens melding wordt gemaakt van het voorgoed
      buiten gebruik stellen van het voertuig en de in [artikel 15, derde lid][ref1], bedoelde verklaring is ingevuld.


      [ref1]: https://wetten.overheid.nl/BWBR0007089#Artikel15
    url: https://wetten.overheid.nl/BWBR0007089/2010-10-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0007089
        artikel: '15'
        hoofdstuk: '4'
  - number: 10b
    text: |-
      Het is de erkenninghouder niet toegestaan voertuigen die zijn voorzien van lichtblauwe kentekenplaten volgens
      de modellen 18.2A tot en met 18.2C of 27.30A tot en met 27.31C aan te melden in bedrijfsvoorraad, tenzij in de
      aanmelding tevens melding wordt gemaakt van het voorgoed buiten gebruik stellen van het voertuig.
    url: https://wetten.overheid.nl/BWBR0007089/2010-10-01#Artikel10b
  - number: '11'
    text: |-
      1 Het toezicht op het erkende bedrijf bestaat uit het uitvoeren van periodieke controles door de daartoe bevoegde
      ambtenaren. Deze controles kunnen frequenter plaatsvinden indien het vermoeden bestaat dat het erkende bedrijf de
      in het kader van de erkenning geldende eisen en voorschriften niet nakomt.

      2 De in het eerste lid bedoelde ambtenaren moeten desgevraagd behoorlijk in de gelegenheid worden gesteld te
      onderzoeken of het erkende bedrijf voldoet aan de gestelde eisen en voorschriften.

      Het erkende bedrijf dient inzage te geven in de met betrekking tot de erkenning en bevoegdheden te voeren
      administratie en het in [artikel 6, tweede lid, onderdeel f][ref1], bedoelde kwaliteitshandboek. Tevens dient het
      erkende bedrijf op verzoek van bedoelde ambtenaren de voertuigen die in de bedrijfsvoorraad zijn aangemeld alsmede
      de daarbij behorende kentekenbewijzen en kentekenplaten te tonen.

      3 Ingeval de erkenning of de bevoegdheden worden geschorst of ingetrokken, blijven de voertuigen die op het moment
      waarop de beschikking van kracht wordt in bedrijfsvoorraad staan geregistreerd, als zodanig geregistreerd tot het
      moment waarop het voertuig ophoudt te behoren tot de bedrijfsvoorraad.

      4 Bij de intrekking of schorsing van de erkenning of de bevoegdheden, of de wijziging van de erkenning kan een
      onderscheid gemaakt worden tussen de betrokken vestigingen.


      [ref1]: https://wetten.overheid.nl/BWBR0007089#Artikel6
    url: https://wetten.overheid.nl/BWBR0007089/2010-10-01#Artikel11
