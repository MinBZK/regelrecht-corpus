  - number: '15'
    text: |-
      1 De ontvanger van een subsidie toont op verzoek van de minister aan dat:

      a. de activiteiten waarvoor de subsidie is verstrekt, zijn verricht, en

      b. is voldaan aan de verplichting, bedoeld in [artikel 14, eerste lid][ref1].

      2 Wat betreft een subsidie voor een haalbaarheidsonderzoek of een interactief of procesgericht onderzoek is aan het
      eerste lid, aanhef en onderdeel a, in elk geval toepassing gegeven, indien de ontvanger van de subsidie een rapport
      overlegt waarin de resultaten van het onderzoek zijn vastgelegd.


