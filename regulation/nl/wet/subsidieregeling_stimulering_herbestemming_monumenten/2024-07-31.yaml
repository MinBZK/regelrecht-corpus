  - number: '11'
    text: |-
      Onverminderd [artikel 4:35 van de Algemene wet bestuursrecht][ref1] wordt de verstrekking van een subsidie in elk
      geval geweigerd, voor zover:

      a. de in de offerte, bedoeld in [artikel 9, derde lid, onderdeel b][ref2], opgenomen kosten naar het oordeel van de
      minister niet redelijk zijn,

      b. met betrekking tot de kosten subsidie is verstrekt op grond van een andere rijkssubsidieregeling,

      c. met de werkzaamheden voor een onderzoek als bedoeld in [artikel 1, eerste lid, onderdelen g, h of i][ref3] is
      begonnen, voordat de aanvraag is ingediend, of

      d. de rechtspersoon, bedoeld in [artikel 6, eerste lid, onderdeel b][ref4], naar het oordeel van de minister
      onvoldoende of geen belang bij de herbestemming van het monument heeft.


