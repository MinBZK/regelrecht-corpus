    text: |-
      1 De minister beslist binnen 13 weken na afloop van de periode, bedoeld in [artikel 10, eerste lid][ref1], op de
      aanvragen in de volgorde van de rangschikking, bedoeld in [artikel 12, tweede lid][ref2], en zonodig met toepassing
      van artikel 12, derde lid.

      2 De subsidie wordt vastgesteld zonder voorafgaande subsidieverlening.

      3 De beschikking tot subsidievaststelling vermeldt:

      a. de aard van het onderzoek, bedoeld in [artikel 1, eerste lid, onderdelen g of i][ref3], waarvoor subsidie wordt
      verstrekt,

      b. of eveneens subsidie wordt verstrekt voor een verduurzamingsonderzoek,

      c. het subsidiebedrag,

      d. het tijdstip waarop het haalbaarheidsonderzoek, hetzij het interactief of procesgericht onderzoek uiterlijk is
      afgerond, en

      e. het tijdstip waarop het verduurzamingsonderzoek uiterlijk is afgerond.


