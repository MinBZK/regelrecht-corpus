  - number: '12'
    text: |-
      1 De minister voorziet in een gelijktijdige beslissing op aanvragen om subsidie met betrekking tot de activiteiten,
      bedoeld in [artikel 5, eerste lid][ref1].

      2 De minister rangschikt de aanvragen in de volgorde als hierna vermeld:

      a. aanvragen ingediend door organisaties als bedoeld in
      [artikel 30 van de Subsidieregeling instandhouding monumenten][ref2], die eigenaar van het desbetreffende monument
      zijn,

      b. aanvragen ingediend door andere aanvragers dan die, bedoeld in onderdeel a.

      3 Indien bij toepassing van het tweede lid het subsidieplafond, bedoeld in
      [artikel 7, eerste lid, onderdeel a][ref3], dreigt te worden overschreden of wordt overschreden door
      subsidieverstrekking aan alle aanvragers in een van de categorieën aanvragen als bedoeld in het tweede
      lid, wordt op de aanvragen in die categorie beslist in de volgorde van de opgave van de kosten, bedoeld in
      [artikel 9, derde lid, onderdeel b][ref4], waarvoor subsidie wordt aangevraagd, waarbij een aanvraag met een lagere
      opgave van de kosten voorrang krijgt. De eventuele kosten voor een verduurzamingsonderzoek blijven daarbij buiten
      beschouwing.

      4 Indien bij toepassing van het tweede lid het subsidieplafond, bedoeld in
      [artikel 7, eerste lid, onderdeel b][ref5], dreigt te worden overschreden of wordt overschreden door
      subsidieverstrekking aan alle aanvragers in een van de categorieën aanvragen als bedoeld in het tweede lid, wordt
      op de aanvragen voor verduurzamingsonderzoeken beslist aan de hand van de volgorde, bedoeld in het derde lid.


