    text: |-
      1 In deze regeling wordt verstaan onder:

        - *minister:* Minister van Onderwijs, Cultuur en Wetenschap;
        - *kerkgebouw:* monument of zelfstandig onderdeel dat in oorsprong uitsluitend of voor een overwegend deel is
      vervaardigd voor het gezamenlijk belijden van de godsdienst of levensovertuiging;
        - *samenstel van monumenten:* **twee of meer monumenten gekenmerkt door hun onderlinge samenhang die mede bepalend
      is voor hun monumentale waarde;
        - *zelfstandig onderdeel:* onderdeel van een monument dat is aan te merken als een zelfstandige bouwkundige
      eenheid;
        - *eigenaar:* natuurlijke persoon of rechtspersoon die het recht van eigendom of een ander zakelijk recht op een
      monument heeft;
        - *herbestemming:* geven van een nieuwe functie aan een monument of een belangrijk deel daarvan;
        - *haalbaarheidsonderzoek:* onderzoek als bedoeld in [artikel 5, eerste lid, onderdeel a, en derde lid][ref1];
        - *verduurzamingsonderzoek:* verduurzamingsonderzoek als bedoeld in
      [artikel 5, eerste lid, onderdeel b, en vijfde lid][ref2];
        - *interactief of procesgericht onderzoek:* onderzoek als bedoeld in [artikel 5, eerste lid, onderdeel c][ref3];
        - *tijdelijke maatregel:* maatregel als bedoeld in [artikel 17][ref4];
        - *subsidiabele kosten:* kosten als bedoeld in [artikel 20][ref5];
        - *subsidietijdvak:* tijdvak van 1 oktober tot en met 30 september in enig jaar;
        - *woonhuis:* monument of zelfstandig onderdeel daarvan dat in oorsprong is vervaardigd voor bewoning of dat voor
      meer dan de helft van de oppervlakte voor bewoning in gebruik is met dien verstande dat niet als woonhuis wordt
      aangemerkt een gebouw dat deel uitmaakt van een geregistreerd museum, een kerkgebouw, kasteel, paleis, hoofdhuis
      van een buitenplaats, landhuis, gebouw van liefdadigheid, molen, gemaal, agrarisch gebouw of watertoren;
        - *erfgoedgemeenschap:* erfgoedgemeenschap als bedoeld in [artikel 6, lid 1a][ref6].

      2 In deze regeling wordt onder monument tevens zelfstandig onderdeel begrepen, tenzij het tegendeel blijkt.


