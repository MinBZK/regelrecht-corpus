  - number: '17'
    text: |-
      1 De minister kan subsidie verstrekken ten behoeve van het treffen van tijdelijke maatregelen die er toe strekken
      om een monument wind- en waterdicht te maken dan wel om verval, verzakking of instorting van een monument te
      voorkomen met het oog op mogelijke herbestemming van een monument.

      2 Subsidie wordt uitsluitend verstrekt, indien met betrekking tot het monument recent een haalbaarheidsonderzoek
      of een interactief of procesgericht onderzoek is ingesteld, of indien op grond van deze regeling een aanvraag om
      subsidie voor een dergelijk onderzoek ingediend. Onder een onderzoek als bedoeld in de eerste volzin wordt mede
      begrepen een ander vergelijkbaar haalbaarheidsonderzoek.

      3 Voor zover een subsidie betrekking heeft op een woonhuis als bedoeld in [artikel 18, tweede lid][ref1], wordt die
      subsidie onverminderd het tweede lid uitsluitend verstrekt, indien met betrekking tot het desbetreffende samenstel
      van monumenten dan wel een of meer onderdelen daarvan recent een haalbaarheidsonderzoek of een interactief of
      procesgericht onderzoek is ingesteld, of indien op grond van deze regeling een aanvraag om subsidie voor een
      dergelijk onderzoek is ingediend. De tweede volzin van het tweede lid is van toepassing.

      4 Maatregelen als bedoeld in het eerste lid hebben betrekking op een of meer monumenten dan wel op een of meer
      zelfstandige onderdelen.

      5 Indien een monument uit zelfstandige onderdelen bestaat of indien er sprake is van een samenstel van monumenten,
      kunnen voor dat monument onderscheidenlijk dat samenstel ten hoogste twee aanvragen om subsidie worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0030544#Artikel18
    url: https://wetten.overheid.nl/BWBR0030544/2024-07-31#Artikel17
