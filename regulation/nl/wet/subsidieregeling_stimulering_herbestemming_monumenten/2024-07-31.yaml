    text: |-
      1 De ontvanger van een subsidie voltooit het haalbaarheidsonderzoek, hetzij het interactief of procesgericht
      onderzoek uiterlijk op het tijdstip, bedoeld in [artikel 13, derde lid][ref1].

      2 De ontvanger van een subsidie voor een verduurzamingsonderzoek voltooit het onderzoek uiterlijk op het tijdstip,
      bedoeld in [artikel 13, derde lid, onderdeel e][ref2].

      3 De ontvanger van een subsidie voor een verduurzamingsonderzoek, legt aan de minister binnen twee maanden na het
      tijdstip, bedoeld in [artikel 13, derde lid][ref3], een rapport over met de resultaten van het onderzoek.

      4 De ontvanger van een subsidie doet onmiddellijk schriftelijk mededeling aan de minister, indien
      aannemelijk is dat de activiteiten waarvoor de subsidie is verstrekt niet voor het tijdstip, bedoeld in
      [artikel 13, derde lid][ref4], zijn verricht dan wel niet of niet geheel zullen worden verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0030544#Artikel13
