  - number: '6'
    text: |-
      1 Subsidie kan worden aangevraagd door:

      a. een eigenaar van een ander monument dan een woonhuis, en

      b. een persoon die optreedt namens een erfgoedgemeenschap.

      1a Een aanvraag als bedoeld in het eerste lid, onderdeel b, kan uitsluitend worden gedaan, indien de
      erfgoedgemeenschap:

      a. een verband is van ten minste vijf natuurlijke personen, die zich als vrijwilligers inzetten voor het behoud van
      het monument of het zelfstandig onderdeel om dit aan toekomstige generaties over te kunnen dragen, en

      b. aantoonbaar gedurende ten minste zes maanden betrokken is bij het monument ten behoeve waarvan subsidie wordt
      gevraagd.

      2 Voor de toepassing van dit artikel wordt onder een ander monument dan een woonhuis tevens begrepen een woonhuis
      dat onderdeel is van een samenstel van monumenten. Subsidie voor een woonhuis als bedoeld in de eerste volzin
      kan uitsluitend worden aangevraagd, indien voor dat samenstel van monumenten dan wel voor een of meer onderdelen
      daarvan tevens subsidie is aangevraagd.
    url: https://wetten.overheid.nl/BWBR0030544/2024-07-31#Artikel6
  - number: '7'
    text: |-
      1 Voor subsidieverstrekking op grond van dit hoofdstuk is per subsidietijdvak is telkens een bedrag beschikbaar
      van:

      a. € 2.255.000,– ten behoeve van haalbaarheidsonderzoeken of interactieve of procesgerichte onderzoeken, en

      b. € 400.000,– ten behoeve van verduurzamingsonderzoeken.

      2 Indien in enig subsidietijdvak een beschikbaar bedrag als bedoeld in het eerste lid, onderdeel a, niet geheel
      wordt verstrekt, kan de minister het resterende bedrag toevoegen aan:

      a. het subsidieplafond, bedoeld in [artikel 19, eerste lid][ref1], voor het zelfde subsidietijdvak, of

      b. het subsidieplafond, bedoeld in het eerste lid, voor het volgende subsidietijdvak.

      3 Indien in enig subsidietijdvak een beschikbaar bedrag als bedoeld in het eerste lid, onderdeel b, niet geheel
      wordt verstrekt, voegt de minister het resterende bedrag toe aan het subsidieplafond, bedoeld in dat onderdeel,
      voor het volgende subsidietijdvak.


      [ref1]: https://wetten.overheid.nl/BWBR0030544#Artikel19
    url: https://wetten.overheid.nl/BWBR0030544/2024-07-31#Artikel7
