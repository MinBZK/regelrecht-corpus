      1 De minister voorziet in een gelijktijdige beslissing op aanvragen om subsidie met betrekking tot de activiteiten,
      bedoeld in [artikel 17, eerste lid][ref1].

      2 De minister rangschikt de aanvragen in de volgorde als hierna vermeld:

      a. aanvragen ingediend door organisaties als bedoeld in
      [artikel 30 van de Subsidieregeling instandhouding monumenten][ref2], en

      b. aanvragen ingediend door andere eigenaaren dan die, bedoeld in onderdeel a.

      3 Indien bij toepassing van het tweede lid het subsidieplafond, bedoeld in [artikel 19, eerste lid][ref3],
      dreigt te worden overschreden of wordt overschreden door subsidieverstrekking aan alle aanvragers in een van de
      categorieën aanvragen als bedoeld in het tweede lid, wordt op de aanvragen in die categorie beslist in de volgorde
      van de opgave van de kosten, bedoeld in [artikel 23, derde lid, onderdeel c][ref4], waarvoor subsidie wordt
      aangevraagd, waarbij een aanvraag met een lagere opgave van de kosten voorrang krijgt.


