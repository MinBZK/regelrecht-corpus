        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '20'
    text: |-
      1 Als subsidiabele kosten worden aangemerkt de rechtstreeks aan het treffen van tijdelijke maatregelen toe te
      rekenen kosten, voor zover de werkzaamheden ter uitvoering van die maatregelen naar het oordeel van de minister
      technisch noodzakelijk zijn en sober en doelmatig zijn.

      2 Kosten als bedoeld in het eerste lid zijn in elk geval:

      a. kosten voor arbeid in het kader van werkzaamheden gericht op het wind- en waterdicht maken van een monument
      dan wel op het voorkomen van verval van een monument, het voorkomen van vervolgschade aan een monument dan wel het
      voorkomen van verzakkingen of instorten van een monument, en

      b. kosten van het materiaal benodigd voor de in onderdeel a bedoelde werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0030544/2024-07-31#Artikel20
  - number: '21'
    text: |-
      1 Niet voor subsidie komen in ieder geval in aanmerking:

      a. kosten voor verwerving van de subsidie,

      b. kosten van overleg,

      c. kosten voor project- of procesmanagement,

      d. kosten van activiteiten in de uitwerkings- of uitvoeringsfase na de subsidieverlening,

      e. kosten van voorlichting of communicatie,

      f. kosten voor de aanschaf van apparatuur of gereedschap ten behoeve van tijdelijke maatregelen,

      g. kosten die de marktconforme tarieven te boven gaan,

      h. kosten van beheers- en gebruikskosten na de voltooiing van de tijdelijke maatregelen,

      i. kosten van uitgevoerde of voltooide tijdelijke maatregelen gemaakt voor het tijdstip van een aanvraag om
      subsidie, en

      j. kosten van werkzaamheden die door de eigenaar van het monument zelf zijn verricht.

      2 Voorts komen niet voor subsidie in aanmerking kosten, voor zover die in geval van schade op grond van een
      verzekering worden vergoed.
    url: https://wetten.overheid.nl/BWBR0030544/2024-07-31#Artikel21
  - number: '22'
    text: |-
      1 De subsidie voor tijdelijke maatregelen bedraagt 70 procent van de subsidiabele kosten.

      2 Het bedrag aan subsidiabele kosten voor tijdelijke maatregelen waarover subsidie kan worden verstrekt, is ten
      minste € 10.000 en ten hoogste € 50.000 per aanvraag.
    url: https://wetten.overheid.nl/BWBR0030544/2024-07-31#Artikel22
  - number: '23'
    text: |-
      1 De subsidie wordt op aanvraag verleend.

      2 De aanvraag wordt ingediend op een door de minister vastgesteld formulier. Daarop wordt in elk geval aangegeven:

      a. op welk monument of welke monumenten dan wel op welk zelfstandig onderdeel of welke zelfstandige onderdelen de
      tijdelijke maatregelen betrekking hebben, en

      b. tot welke soort monumenten, bedoeld in [artikel 2][ref1], het monument behoort.

      3 De aanvraag gaat vergezeld van:

      a. een globale beschrijving van de staat waarin het monument verkeert, en overzichts- en detailfoto’s of tekeningen
      die een duidelijke indruk geven van de structuur van het monument en zijn gebreken,

      b. een daarop gebaseerd activiteitenplan waaruit blijkt op welke plaats aan, op of bij het monument en op welke
      wijze en binnen welke termijn de tijdelijke maatregelen worden uitgevoerd,

      c. een opgave van de kosten waarvoor subsidie wordt aangevraagd en een offerte of een begroting van de uit te
      voeren werkzaamheden die is opgesteld volgens de hoofdstructuur van het Standaardbestek voor de burgerlijke en
      utiliteitsbouw, vastgesteld door de Stichting Stabu,

      d. een actueel rapport als bedoeld in [artikel 15, tweede lid][ref2], met betrekking tot het monument
      of een daarmee gelijk te stellen document dan wel de mededeling dat een aanvraag om subsidie voor een
      haalbaarheidsonderzoek dan wel een interactief of procesgericht onderzoek met betrekking tot het monument is
      ingediend, en

      e. in geval van een monument dat niet op grond van de [Erfgoedwet][ref3], een omgevingsplan
      als bedoeld in [artikel 2.4 van de Omgevingswet][ref4], een omgevingsverordening als bedoeld in
      [artikel 2.6 van de Omgevingswet][ref5], of een gemeentelijke verordening is beschermd, een verklaring van het
      college van burgemeester en wethouders van de desbetreffende gemeente dat het monument van algemeen belang is
      wegens zijn schoonheid, zijn betekenis voor de wetenschap of zijn cultuurhistorische waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0030544#Artikel2
