  - number: '8'
    text: |-
      1 De subsidie voor een haalbaarheidsonderzoek, een interactief of procesgericht onderzoek, danwel een
      verduurzamingsonderzoek, bedraagt 70 procent van de kosten van dat onderzoek.

      2 Het bedrag aan kosten van een onderzoek waarover subsidie kan worden verstrekt, bedraagt:

      a. ten minste € 10.000 en ten hoogste € 15.000 per aanvraag voor een haalbaarheidsonderzoek of een interactief of
      procesgericht onderzoek; en

      b. ten hoogste € 4.000 per aanvraag voor een verduurzamingsonderzoek.
    url: https://wetten.overheid.nl/BWBR0030544/2024-07-31#Artikel8
  - number: '9'
    text: |-
      1 De subsidie wordt op aanvraag verstrekt.

      2 De aanvraag wordt ingediend op een door de minister vastgesteld formulier. Daarop wordt in elk geval aangegeven:

      a. of subsidie wordt aangevraagd voor een haalbaarheidsonderzoek dan wel voor een interactief of procesgericht
      onderzoek,

      b. of, indien subsidie wordt aangevraagd voor een haalbaarheidsonderzoek, eveneens subsidie wordt aangevraagd voor
      een verduurzamingsonderzoek,

      c. op welk monument of welke monumenten dan wel op welk zelfstandig onderdeel of welke zelfstandige onderdelen het
      onderzoek betrekking heeft,

      d. tot welke soort monumenten, bedoeld in [artikel 2][ref1], het monument behoort, en

      e. indien de aanvraag wordt gedaan voor een erfgoedgemeenschap:

      1°. dat de eigenaar van het monument of het zelfstandig onderdeel instemt met de uitvoering van het onderzoek, en

      2°. dat de deelnemers aan de erfgoedgemeenschap uitsluitend als vrijwilliger bij de erfgoedgemeenschap betrokken
      zijn.

      3 De aanvraag gaat vergezeld van:

      a. een beschrijving van de problematiek van de herbestemming en de te onderzoeken mogelijkheden tot herbestemming
      en een mededeling over het tijdstip waarop het haalbaarheidsonderzoek, hetzij het interactief of procesgericht
      onderzoek is afgerond, alsmede in voorkomend geval het tijdstip waarop het verduurzamingsonderzoek is afgerond,

      b. een opgave van de kosten waarvoor subsidie wordt aangevraagd en een offerte,

      c. indien subsidie wordt aangevraagd voor een verduurzamingsonderzoek waarop
      [artikel 5, vijfde lid, onderdeel b][ref2], van toepassing is, een afschrift van het in dat onderdeel bedoelde
      rapport, en

      d. in geval van een monument dat niet op grond van de [Erfgoedwet][ref3], een omgevingsplan
      als bedoeld in [artikel 2.4 van de Omgevingswet][ref4], een omgevingsverordening als bedoeld in
      [artikel 2.6 van de Omgevingswet][ref5], of een gemeentelijke verordening is beschermd, een verklaring van het
      college van burgemeester en wethouders van de desbetreffende gemeente dat het monument van algemeen belang is
      wegens zijn schoonheid, zijn betekenis voor de wetenschap of zijn cultuurhistorische waarde,

      e. indien de aanvraag wordt gedaan voor een erfgoedgemeenschap:

      1°. bewijsstukken waaruit blijkt dat de erfgoedgemeenschap gedurende ten minste zes maanden betrokken is bij het
      behoud van het monument of het zelfstandig onderdeel ten behoeve waarvan subsidie wordt gevraagd, en

      2°. een verklaring van de eigenaar van het monument, waaruit blijkt dat hij medewerking zal verlenen aan de
      uitvoering van het desbetreffende onderzoek.


