      1 Indien de te verstrekken subsidie € 25.000 of meer bedraagt, geeft de minister de beschikking tot
      subsidieverlening binnen 13 weken na afloop van de periode, bedoeld in [artikel 24, eerste lid][ref1], in de
      volgorde van de rangschikking, bedoeld in [artikel 26, tweede lid][ref2], en zonodig met toepassing van artikel 26,
      derde lid.

      2 Indien de te verstrekken subsidie minder dan € 25.000 bedraagt, stelt de minister de subsidie zonder voorafgaande
      subsidieverlening vast binnen 13 weken na afloop van de periode, bedoeld in [artikel 24, eerste lid][ref3], in de
      volgorde van de rangschikking, bedoeld in [artikel 26, tweede lid][ref4], en zonodig met toepassing van artikel 26,
      derde lid.

      3 De beschikking vermeldt de aard van de werkzaamheden waarvoor subsidie wordt verstrekt, het subsidiebedrag en het
      tijdstip waarop de werkzaamheden uiterlijk zijn afgerond.


