  - number: '5'
    text: |-
      1 De minister kan subsidie verstrekken ten behoeve van:

      a. het doen instellen van een onderzoek naar de haalbaarheid van herbestemming van een monument,

      b. het uitvoeren van een verduurzamingsonderzoek in aanvulling op een haalbaarheidsonderzoek,

      c. het doen instellen van een interactief of procesgericht onderzoek naar de herbestemming van een monument.

      2 Een onderzoek als bedoeld in het eerste lid heeft betrekking op een of meer monumenten dan wel op een of meer
      zelfstandige onderdelen.

      2a Indien een onderzoek als bedoeld in het eerste lid geheel of ten dele betrekking heeft op mogelijke nieuwe
      functies voor het desbetreffende monument of zelfstandig onderdeel en de inpassing van deze functies in dat
      monument of zelfstandig onderdeel, houdt het onderzoek uitdrukkelijk rekening met het belang van het behoud van de
      bouwhistorische en cultuurhistorische kenmerken van het monument.

      2b Een onderzoek als bedoeld in het eerste lid komt uitsluitend voor subsidie in aanmerking, indien het betrekking
      heeft op een monument of zelfstandig onderdeel:

      a. dat voor ten minste de helft van de oppervlakte leegstaat, of

      b. waarvan aannemelijk wordt gemaakt dat het naar verwachting binnen drie jaar voor ten minste de helft van de
      oppervlakte leeg zal komen te staan.

      2c Lid 2b is niet van toepassing indien sprake is van een kerkgebouw dat nog als zodanig in gebruik is.

      3 Een haalbaarheidsonderzoek heeft betrekking op een of meer van de volgende onderwerpen:

      a. de bouwhistorische en cultuurhistorische kenmerken van het monument in relatie tot herbestemming,

      b. de bouwkundige staat van het monument,

      c. mogelijke nieuwe functies van het monument, en

      d. de financiële haalbaarheid van de herbestemming van het monument.

      4 De minister verstrekt een subsidie voor een verduurzamingsonderzoek uitsluitend in combinatie met een subsidie
      voor het haalbaarheidsonderzoek waarop het verduurzamingsonderzoek een aanvulling vormt.

      5 Een verduurzamingsonderzoek voldoet ten minste aan de eisen, opgenomen in [bijlage 1][ref1] bij deze regeling en
      houdt uitdrukkelijk rekening met de bouwhistorische en cultuurhistorische kenmerken van het monument aan de hand
      van:

      a. het rapport van het haalbaarheidsonderzoek waarop het een aanvulling vormt, indien dat haalbaarheidsonderzoek
      mede of volledig betrekking heeft op de onderwerpen, bedoeld in het derde lid, onderdeel a; of

      b. een rapport van een reeds uitgevoerd onderzoek met betrekking tot de bouwhistorische en cultuurhistorische
      kenmerken van het monument.

      6 Indien een monument uit meerdere zelfstandige onderdelen bestaat of indien er sprake is van een samenstel van
      monumenten, kan een aanvrager voor dat monument onderscheidenlijk dat samenstel in enig jaar ten hoogste drie
      aanvragen om subsidie indienen.

      7 Onverminderd het zesde lid kan een aanvrager per monument per drie jaar ten hoogste één aanvraag indienen. Indien
      een monument uit meerdere zelfstandige onderdelen bestaat, kan een aanvrager per zelfstandig onderdeel per drie
      jaar ten hoogste één aanvraag indienen.


      [ref1]: https://wetten.overheid.nl/BWBR0030544
