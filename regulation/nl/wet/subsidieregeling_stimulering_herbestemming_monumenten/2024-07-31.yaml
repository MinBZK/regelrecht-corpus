  - number: '25'
    text: |-
      Onverminderd [artikel 4:35 van de Algemene wet bestuursrecht][ref1] wordt de verstrekking van een subsidie in elk
      geval geweigerd, voor zover:

      a. de in de offerte of begroting, bedoeld in [artikel 23, derde lid, onderdeel c][ref2], opgenomen kosten naar het
      oordeel van de minister niet redelijk zijn,

      b. met betrekking tot de subsidiabele kosten subsidie is verstrekt op grond van een andere rijkssubsidieregeling,

      c. voor het monument al eerder subsidie op grond van dit hoofdstuk is verstrekt, en

      d. met het treffen van tijdelijke maatregelen is begonnen, voordat de aanvraag is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel435
