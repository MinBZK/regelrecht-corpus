  - number: '18'
    text: |-
      1 Subsidie kan worden aangevraagd door eigenaren van een ander monument dan een woonhuis.

      2 Voor de toepassing van dit artikel wordt onder een ander monument dan een woonhuis tevens begrepen een woonhuis
      dat onderdeel is van een samenstel van monumenten.
    url: https://wetten.overheid.nl/BWBR0030544/2024-07-31#Artikel18
  - number: '19'
    text: |-
      1 Voor de subsidieverstrekking op grond van dit hoofdstuk is per subsidietijdvak telkens een bedrag van € 720.000,–
      beschikbaar.

      2 Indien in enig subsidietijdvak een beschikbaar bedrag niet geheel wordt verstrekt, kan de minister het resterende
      bedrag toevoegen aan:

      a. het subsidieplafond, bedoeld in [artikel 7, eerste lid][ref1], voor het zelfde subsidietijdvak, of

      b. het subsidieplafond, bedoeld in het eerste lid, voor het volgende subsidietijdvak.


      [ref1]: https://wetten.overheid.nl/BWBR0030544#Artikel7
    url: https://wetten.overheid.nl/BWBR0030544/2024-07-31#Artikel19
