      1 Indien de subsidie € 25.000 of meer bedraagt, toont de ontvanger van een subsidie aan de hand van een
      prestatieverklaring aan dat de activiteiten waarvoor de subsidie is verstrekt, zijn verricht en dat aan de aan
      de subsidie verbonden verplichtingen is voldaan. De minister stelt voor de prestatieverklaring een model vast. De
      prestatieverklaring wordt gevoegd bij de aanvraag, bedoeld in [artikel 30][ref1].

      2 Indien de subsidie minder dan € 25.000 bedraagt, is [artikel 15, eerste lid][ref2], van toepassing. Aan de eerste
      volzin is in elk geval toepassing gegeven, indien de ontvanger van een subsidie een prestatieverklaring als bedoeld
      in het eerste lid overlegt.


