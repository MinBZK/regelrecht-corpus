  - number: '2'
    text: |-
      1 Voor motorrijtuigen op meer dan twee wielen moet de in [artikel 1][ref1] bedoelde aanduiding zodanig zijn
      aangebracht dat deze zowel voor het tegemoetkomende als voor het achteropkomende verkeer duidelijk en goed
      zichtbaar is.

      2 Bij motorrijtuigen op twee wielen moet de in [artikel 1][ref2] bedoelde aanduiding zodanig zijn aangebracht dat
      deze voor het achteropkomende verkeer duidelijk en goed zichtbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0008048#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0008048#Artikel1
