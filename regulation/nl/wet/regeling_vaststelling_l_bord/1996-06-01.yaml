articles:
  - number: '1'
    text: |-
      De aanduiding, bedoeld in de [artikelen 7, onderdeel d][ref1], [8, onderdeel c][ref2],
      [9, eerste lid, onderdeel c][ref3], [79][ref4], [80, onderdeel c][ref5], en
      [81, onderdeel c, van het Reglement rijbewijzen][ref6], bestaat uit een witte hoofdletter ’L’ op een lichtblauwe,
      vierkante achtergrond, die niet retroreflecterend is.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel7
