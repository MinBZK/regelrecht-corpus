      [ref7]: https://wetten.overheid.nl/BWBR0009743
      [ref8]: https://wetten.overheid.nl/BWBR0013409#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0025254/2009-03-01#Artikel3.2
