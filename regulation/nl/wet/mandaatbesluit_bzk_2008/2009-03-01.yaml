preamble:
  text: |-
    Gelet op de Algemene wet bestuursrecht;

    Mede gelet op de Comptabiliteitswet 2001 en het Besluit privaatrechtelijke rechtshandelingen 1996;

    Mede gelet op het Koninklijk besluit van 18 oktober 1988, houdende regeling van de functie en verantwoordelijkheid
    van de secretaris-generaal;

    Besluit vast te stellen het navolgende mandaatbesluit:
  url: https://wetten.overheid.nl/BWBR0025254/2009-03-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. *Ministerie:* het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties;

      b. *Minister:* de Minister van Binnenlandse Zaken en Koninkrijksrelaties;

      c. *stuk:* een schriftelijk stuk dat een besluit inhoudt of een ander schriftelijk stuk dat wordt toegerekend aan
      de Minister;

      d. *diensthoofd:* de plaatsvervangend secretaris-generaal, een directeur-generaal, het hoofd van de Algemene
      Inlichtingen- en Veiligheidsdienst of het hoofd van de Inspectie Openbare Orde en Veiligheid;

      e. *directeur:* de leidinggevende van een in het [Organisatiebesluit BZK 2008][ref1] genoemd dienstonderdeel die
      rechtstreeks ressorteert onder een directeur-generaal, de plaatsvervangend secretaris-generaal, het hoofd van
      de Algemene Inlichtingen- en Veiligheidsdienst of het hoofd van de Inspectie Openbare Orde en Veiligheid, met
      uitzondering van de leidinggevenden die ressorteren onder de korpschef van het Korps landelijke politiediensten;

      f. *mandaat:* de bevoegdheid om namens de Minister besluiten te nemen en stukken af te doen en te ondertekenen;

      g. *werkterrein:* het werkterrein en de taken van de betreffende functionaris en zijn dienstonderdeel
      overeenkomstig het [Organisatiebesluit BZK 2008][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025266
      [ref2]: https://wetten.overheid.nl/BWBR0025266
    url: https://wetten.overheid.nl/BWBR0025254/2009-03-01#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0025266
      - id: ref2
        bwb_id: BWBR0025266
  - number: '1.2'
    text: |-
      Voor de toepassing van dit besluit en de daarop berustende bepalingen wordt met de verlening van mandaat gelijk
      gesteld de verlening van:

      a. volmacht om namens de Minister voor de Staat privaatrechtelijke rechtshandelingen te verrichten;

      b. machtiging om namens de Minister handelingen te verrichten die noch een besluit noch een privaatrechtelijke
      rechtshandeling zijn.
    url: https://wetten.overheid.nl/BWBR0025254/2009-03-01#Artikel1.2
  - number: '2.1'
    text: |-
      Mandaat wordt niet verleend met betrekking tot:

      a. het vaststellen van een algemeen verbindend voorschrift;

      b. het beslissen op een bezwaarschrift tegen een besluit dat persoonlijk door de Minister onderscheidenlijk de
      secretaris-generaal is getekend;

      c. het beslissen op een beroepschrift;

      d. het instellen van een agentschap of baten-lastendienst bij het Ministerie;

      e. het oprichten van een rechtspersoon;

      f. het geven van aanwijzingen aan een ander bestuursorgaan op grond van een wettelijk voorschrift;

      g. het toepassen van aanwijzing 3 van de Aanwijzingen inzake externe contacten van rijksambtenaren;

      h. het vaststellen van het besluit, bedoeld in
      [artikel 2, eerste lid, van het Coördinatiebesluit organisatie en formatie rijksdienst 2007][ref1], houdende de
      vaststelling van de organisatie van het Ministerie;

      i. het uitoefenen van het houderschap van de departementale persoonsregistraties;

      j. het uitoefenen van de op grond van departementale regelgeving aan de Minister voorbehouden bevoegdheden met
      betrekking tot vertrouwensfuncties en veiligheidsonderzoeken;

      k. het instellen van een adviescommissie of klachtencommissie waarvan de voorzitter geen deel uitmaakt van het
      Ministerie en niet werkzaam is onder verantwoordelijkheid van de Minister, en het benoemen en ontslaan van de
      (plaatsvervangend) voorzitter en (plaatsvervangend) leden van die commissie;

      l. het benoemen en ontslaan van departementale vertrouwenspersonen;

      m. het verlenen van goedkeuring aan, het schorsen of het vernietigen van, dan wel het onthouden van goedkeuring aan
      besluiten van een ander bestuursorgaan;

      n. het definitief buiten invordering stellen onderscheidenlijk kwijtschelden van vorderingen op derden vanaf door
      de Minister van Financiën vastgestelde grensbedragen;

      o. het definitief vaststellen van een sectorale arbeidsvoorwaardenovereenkomst waarvoor de Minister
      verantwoordelijk is;

      p. indien het een stuk betreft dat bij de ontvanger de indruk kan wekken dat de ondertekenaar persoonlijk een
      beslissing neemt die door de Minister behoort te worden genomen;

      q. politieke of maatschappelijke aangelegenheden van principiële aard.


      [ref1]: https://wetten.overheid.nl/BWBR0023020#Artikel2
    url: https://wetten.overheid.nl/BWBR0025254/2009-03-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0023020
        artikel: '2'
  - number: '2.2'
    text: |-
      1 Het mandaat is niet van toepassing op het afdoen en ondertekenen van stukken aan:

      a. de Koningin;

      b. de Raad van Ministers (van het Koninkrijk) en daaruit gevormde onderraden en commissies;

      c. de voorzitters van de Eerste en Tweede Kamer der Staten-Generaal en de voorzitters van uit de Kamers gevormde
      commissies;

      d. een minister of een staatssecretaris;

      e. de Raad van State (van het Koninkrijk);

      f. de Algemene Rekenkamer;

      g. de Nationale Ombudsman;

      h. de Gouverneurs van de Nederlandse Antillen en Aruba;

      i. de Ministers van de Nederlandse Antillen en Aruba;

      j. de Gevolmachtigde Ministers van de Nederlandse Antillen en Aruba;

      k. de besturen van de eilandgebieden van de Nederlandse Antillen;

      l. buitenlandse autoriteiten, in rang gelijk aan of hoger dan een minister of een staatssecretaris.

      2 Het eerste lid is niet van toepassing als het stuk van louter informatieve of administratieve aard is, dan wel
      een aangelegenheid betreft van ondergeschikt beleidsmatig of politiek belang.

      3 In afwijking van het eerste lid kan in bijzondere gevallen voor bepaalde aangelegenheden door de Minister aan de
      secretaris-generaal of een diensthoofd mandaat worden verleend.
    url: https://wetten.overheid.nl/BWBR0025254/2009-03-01#Artikel2.2
  - number: '3.1'
    text: |-
      Aan de secretaris-generaal wordt mandaat verleend ten aanzien van aangelegenheden die, gelet op het
      [koninklijk besluit van 18 oktober 1988][ref1], houdende regeling van de functie en verantwoordelijkheid van
      de secretaris-generaal, behoren tot het werkterrein van de secretaris-generaal en die onverminderd dit besluit,
      redelijkerwijs niet behoren te worden voorgelegd aan de Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0004419
    url: https://wetten.overheid.nl/BWBR0025254/2009-03-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0004419
  - number: '3.2'
    text: |-
      Onverminderd dit besluit heeft het mandaat van de secretaris-generaal in ieder geval betrekking op:

      a. het werkterrein van de functionarissen en organisatieonderdelen van het Ministerie, met uitzondering van de
      taken, genoemd in [paragraaf 3.7 van het Organisatiebesluit BZK 2008][ref1];

      b. het beleid en beheer inzake alle aspecten van de bedrijfsvoering van het Ministerie met inbegrip van
      aangelegenheden op organisatorisch, personeel, financieel en materieel gebied;

      c. het vaststellen van de formatie van het Ministerie;

      d. het rechtstreeks leiding geven aan de diensthoofden en overige rechtstreeks onder de secretaris-generaal
      ressorterende functionarissen, voor zover ten aanzien van de directeur-generaal voor de Algemene Bestuursdienst
      niet anders is bepaald;

      e. het nader vaststellen van de inrichting van de onder de plaatsvervangend secretaris-generaal, de directeuren-
      generaal, het hoofd van de Algemene Inlichtingen- en Veiligheidsdienst en het hoofd van de Inspectie Openbare Orde
      en Veiligheid ressorterende dienstonderdelen op grond van het [Organisatiebesluit BZK 2008][ref2];

      f. aangelegenheden die op grond van bovendepartementale regelgeving of afspraken op centraal departementaal niveau
      dienen te worden afgehandeld;

      g. het beslissen op bezwaarschriften;

      h. het optreden als gemachtigd ambtenaar in de zin van de departementale regelgeving met betrekking tot de
      uitvoering van de [Wet openbaarheid van bestuur][ref3];

      i. het behandelen van klachten ingevolge een wettelijke regeling met betrekking tot klachtrecht, waarover door een
      commissie wordt gerapporteerd of geadviseerd;

      j. het vertegenwoordigen van de Minister namens de Staat bij de toepassing van de
      [Wet op de ondernemingsraden][ref4] bij het Ministerie respectievelijk het optreden als bestuurder in de zin van
      [voornoemde wet][ref5] in het overleg met de Groepsondernemingsraad van het Ministerie;

      k. het vertegenwoordigen van de Minister in het departementaal overleg met de centrales van verenigingen van
      ambtenaren, bedoeld in [artikel 113 van het Algemeen Rijksambtenarenreglement][ref6];

      l. personele beheersbeslissingen op grond van het [Beheersbesluit KABGNA/KABGA 1998][ref7] ten aanzien van de
      directeuren van de Kabinetten van de Gouverneurs van de Nederlandse Antillen en Aruba;

      m. de verantwoordelijkheid voor het beheer van de archiefbescheiden bij het Ministerie op grond van de geldende
      regelgeving;

      n. het vertegenwoordigen van de Minister namens de Staat in gerechtelijke procedures waarbij het Ministerie is
      betrokken;

      o. het vaststellen van beleidsregels en circulaires met betrekking tot de aangelegenheden, bedoeld in dit artikel;

      p. het beslissen op bezwaarschriften tegen namens de Minister door het hoofd van de Algemene
      Inlichtingen- en Veiligheidsdienst genomen besluiten met betrekking tot aanvragen als bedoeld in
      [hoofdstuk 4 van de Wet op de inlichtingen- en veiligheidsdiensten 2002][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0025266#Paragraaf3.7
      [ref2]: https://wetten.overheid.nl/BWBR0025266
      [ref3]: https://wetten.overheid.nl/BWBR0005252
      [ref4]: https://wetten.overheid.nl/BWBR0002747
