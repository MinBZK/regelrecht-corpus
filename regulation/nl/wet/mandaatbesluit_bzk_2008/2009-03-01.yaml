  - number: '3.3'
    text: |-
      Het mandaat van de secretaris-generaal is niet van toepassing op het nemen van besluiten en het
      afdoen en ondertekenen van stukken met betrekking tot beslissingen ten aanzien van de directeur-
      generaal voor de Algemene Bestuursdienst, voor zover deze samenhangen met de taken, genoemd in
      [paragraaf 3.7 van het Organisatiebesluit BZK 2008][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025266#Paragraaf3.7
    url: https://wetten.overheid.nl/BWBR0025254/2009-03-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0025266
        paragraaf: '3.7'
  - number: '3.4'
    text: |-
      1 De secretaris-generaal is, voor zover niet anders is bepaald, bevoegd tot het verlenen van ondermandaat aan onder
      hem ressorterende functionarissen ten aanzien van aangelegenheden op het werkterrein van deze functionarissen,
      respectievelijk tot het beperken of het intrekken daarvan.

      2 De secretaris-generaal kan, voor zover niet anders is bepaald, bij het verlenen van ondermandaat tevens de
      bevoegdheid toekennen tot het verlenen van ondermandaat aan een rechtstreeks onder de gemandateerde ressorterende
      functionaris of in bijzondere gevallen aan een andere functionaris, ten aanzien van aangelegenheden op het
      werkterrein van de functionaris.

      3 De secretaris-generaal is bevoegd om in bijzondere gevallen, naast of in plaats van deze paragraaf, mondeling
      of schriftelijk ondermandaat te verlenen aan een onder hem ressorterende functionaris voor een bepaald geval, met
      inachtneming van [artikel 1, derde lid, van het Besluit privaatrechtelijke rechtshandelingen 1996][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007804#Artikel1
    url: https://wetten.overheid.nl/BWBR0025254/2009-03-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0007804
        artikel: '1'
  - number: '3.5'
    text: |-
      De secretaris-generaal verleent ondermandaat bij schriftelijk besluit, na advies van de directeur Constitutionele
      Zaken en Wetgeving, de directeur Financieel-economische Zaken en de directeur Personeel en Organisatie.
    url: https://wetten.overheid.nl/BWBR0025254/2009-03-01#Artikel3.5
  - number: '3.6'
    text: |-
      De secretaris-generaal is bevoegd om de plaatsvervangend secretaris-generaal, ten aanzien van door de
      secretaris-generaal met inachtneming van dit besluit en het [Organisatiebesluit BZK 2008][ref1] vast te stellen
      aangelegenheden, in de bevoegdheden en verantwoordelijkheden van de secretaris-generaal te laten treden.


      [ref1]: https://wetten.overheid.nl/BWBR0025266
    url: https://wetten.overheid.nl/BWBR0025254/2009-03-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0025266
  - number: '3.7'
    text: |-
      De secretaris-generaal is bevoegd om de directeur-generaal Veiligheid, ten aanzien van aangelegenheden met
      betrekking tot het Korps Landelijke Politiediensten in de bevoegdheden en verantwoordelijkheden van de secretaris-
      generaal te laten treden.
    url: https://wetten.overheid.nl/BWBR0025254/2009-03-01#Artikel3.7
  - number: '3.8'
    text: |-
      1 Bij tijdelijke afwezigheid of verhindering van de secretaris-generaal wordt diens mandaat volledig uitgeoefend
      door de plaatsvervangend secretaris-generaal.

      2 Bij gelijktijdige tijdelijke afwezigheid of verhindering van de secretaris-generaal en de plaatsvervangend
      secretaris-generaal wordt het mandaat van de secretaris-generaal bij wijze van waarneming volledig uitgeoefend door
      de directeur-generaal die daartoe bij schriftelijk besluit van de secretaris-generaal in overeenstemming met de
      Minister is aangewezen.

      Bij gebreke van voornoemd besluit of bij afwezigheid van de aangewezen directeur-generaal is een van de
      directeuren-generaal, met uitzondering van de directeur-generaal voor de Algemene Bestuursdienst, naar anciënniteit
      van de benoeming in de functie van directeur-generaal, met de waarneming belast.
    url: https://wetten.overheid.nl/BWBR0025254/2009-03-01#Artikel3.8
  - number: '4.1'
    text: |-
      Aan het diensthoofd wordt mandaat verleend ten aanzien van aangelegenheden die behoren tot het werkterrein van
      het diensthoofd en die, onverminderd dit besluit, redelijkerwijs niet behoren te worden voorgelegd aan een hoger
      bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0025254/2009-03-01#Artikel4.1
  - number: '4.2'
    text: |-
      Onverminderd dit besluit, heeft het mandaat van het diensthoofd in ieder geval betrekking op:

      a. het werkterrein van het diensthoofd en de onder het diensthoofd ressorterende functionarissen en
      dienstonderdelen en het uitoefenen van integraal management dienaangaande met inbegrip van aangelegenheden op
      organisatorisch, personeel, financieel en materieel gebied;

      b. het vaststellen van de formatie van de onder het diensthoofd ressorterende dienstonderdelen;

      c. het leiding geven aan de rechtstreeks onder het diensthoofd ressorterende functionarissen;

      d. het optreden als bestuurder in de zin van de [Wet op de ondernemingsraden][ref1] in het overleg met de
      ondernemingsraad van de onder het diensthoofd ressorterende dienstonderdelen, voor zover niet een onder het
      diensthoofd ressorterende functionaris als zodanig optreedt;

      e. het vertegenwoordigen van de Minister namens de Staat in gerechtelijke procedures waarbij het dienstonderdeel is
      betrokken, onverminderd [artikel 4.3][ref2];

      f. het vaststellen van beleidsregels en circulaires met betrekking tot aangelegenheden op het werkterrein van het
      diensthoofd;

      g. het beheer van de archiefbescheiden van de onder het diensthoofd ressorterende dienstonderdelen op grond van de
      desbetreffende departementale regelgeving;

      h. het afnemen van de eed of de belofte van ambtenaren die worden aangesteld bij een onder het diensthoofd
      ressorterend dienstonderdeel;

      i. het beslissen op bezwaarschriften gericht tegen besluiten inzake aangelegenheden die behoren tot zijn
      werkterrein, met uitzondering van die besluiten die door de Minister, de secretaris-generaal of het diensthoofd
      zijn genomen, onverminderd [artikel 4.3][ref3] en voor zover in wet- en regelgeving niet anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002747
      [ref2]: https://wetten.overheid.nl/BWBR0025254#Artikel4.3
      [ref3]: https://wetten.overheid.nl/BWBR0025254#Artikel4.3
    url: https://wetten.overheid.nl/BWBR0025254/2009-03-01#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0002747
      - id: ref2
        bwb_id: BWBR0025254
        artikel: '4.3'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0025254
        artikel: '4.3'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '4.3'
    text: |-
      1 Het mandaat van het hoofd van de Algemene Inlichtingen- en Veiligheidsdienst
      omvat tevens de bevoegdheid om te besluiten op aanvragen als bedoeld in
      [hoofdstuk 4 van de Wet op de inlichtingen- en veiligheidsdiensten 2002][ref1].

      2 Het eerste lid is niet van toepassing op bezwaarschriften dienaangaande.


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0025254/2009-03-01#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0013409
        hoofdstuk: '4'
  - number: '4.4'
    text: |-
      Het mandaat van de directeur-generaal Bestuur en Koninkrijksrelaties omvat tevens:

      a. de leiding van het overleg met de centrales van overheidspersoneel en de overheidswerkgevers of verenigingen van
      overheidswerkgevers, bedoeld in de Regeling overleg Raad voor het Overheidspersoneelsbeleid;

      b. de bevoegdheid om te beslissen op bezwaarschriften tegen namens de Minister genomen besluiten met betrekking tot
      de uitvoering van de begroting voor Koninkrijksrelaties, met uitzondering van besluiten die door de Minister, de
      secretaris-generaal of de directeur-generaal Bestuur en Koninkrijksrelaties zijn genomen.
    url: https://wetten.overheid.nl/BWBR0025254/2009-03-01#Artikel4.4
  - number: '4.5'
    text: |-
      Het mandaat van de directeur-generaal Organisatie en Bedrijfsvoering Rijk omvat tevens de leiding van het overleg
      met de Sectorcommissie overleg rijkspersoneel, genoemd in het Algemeen Rijksambtenarenreglement.
    url: https://wetten.overheid.nl/BWBR0025254/2009-03-01#Artikel4.5
  - number: '4.6'
    text: |-
      Het mandaat van de directeur-generaal Veiligheid omvat tevens:

      a. de leiding van het overleg met de Commissie voor georganiseerd overleg in politie-ambtenarenzaken, genoemd in
      het [Besluit overleg en medezeggenschap politie 1994][ref1];

      b. de leiding van het overleg met de Commissie Korps landelijke politiediensten, genoemd in het
      [Besluit overleg en medezeggenschap politie 1994][ref2], in de hoedanigheid van gemandateerd korpsbeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0006518
      [ref2]: https://wetten.overheid.nl/BWBR0006518
    url: https://wetten.overheid.nl/BWBR0025254/2009-03-01#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0006518
      - id: ref2
        bwb_id: BWBR0006518
  - number: '4.7'
    text: |-
      Ten aanzien van het mandaat van de directeur-generaal Veiligheid met betrekking tot het beheer van het Korps
      Landelijke Politiediensten geldt het volgende:

      a. [artikel 4.9][ref1] van dit besluit is niet van toepassing;

      b. [artikel 6.2, eerste en tweede lid][ref2], zijn slechts van toepassing op voornoemde dienstonderdelen voor zover
      dit door de directeur-generaal Veiligheid of de korpschef van het Korps Landelijke Politiediensten is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0025254#Artikel4.9
      [ref2]: https://wetten.overheid.nl/BWBR0025254#Artikel6.2
    url: https://wetten.overheid.nl/BWBR0025254/2009-03-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0025254
        artikel: '4.9'
        hoofdstuk: '4'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0025254
        artikel: '6.2'
        hoofdstuk: '6'
  - number: '4.8'
    text: |-
      1 Het mandaat om te beslissen op bezwaarschriften tegen besluiten met betrekking tot een personele aangelegenheid
      wordt uitgeoefend door de plaatsvervangend secretaris-generaal, voor zover ten aanzien van het Korps Landelijke
      politiediensten niet anders is bepaald.

      2 Het mandaat om de Minister namens de Staat in gerechtelijke procedures met betrekking tot een personele
      aangelegenheid te vertegenwoordigen wordt uitgeoefend door de plaatsvervangend secretaris-generaal, voor zover ten
      aanzien van het Korps landelijke politiediensten niet anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0025254/2009-03-01#Artikel4.8
  - number: '4.9'
    text: |-
      Het mandaat van het diensthoofd is niet van toepassing op het nemen van besluiten en het afdoen en ondertekenen van
      stukken met betrekking tot:

      a. de onderdeeloverstijgende kaders van het beleid en beheer inzake alle aspecten van de bedrijfsvoering van
      het Ministerie met inbegrip van aangelegenheden op organisatorisch, personeel, financieel en materieel gebied en
      aangelegenheden met betrekking tot het verrichten van privaatrechtelijke rechtshandelingen;

      b. het nader vaststellen van de inrichting van de onder de diensthoofden ressorterende dienstonderdelen op basis
      van het [Organisatiebesluit BZK 2008][ref1];

      c. aangelegenheden die op grond van bovendepartementale regelgeving of afspraken op centraal departementaal niveau
      dienen te worden afgehandeld;

      d. het vertegenwoordigen van de Minister namens de Staat bij de toepassing van de
      [Wet op de ondernemingsraden][ref2] bij het Ministerie respectievelijk het optreden als bestuurder in de zin van
      [voornoemde wet][ref3] in het overleg met de Groepsondernemingsraad van het Ministerie;

      e. het vertegenwoordigen van de Minister in het departementaal overleg met de centrales van verenigingen van
      ambtenaren, bedoeld in [artikel 113 van het Algemeen Rijksambtenarenreglement][ref4];

      f. personele beheersbeslissingen op grond van het [Beheersbesluit KABGNA/KABGA 1998][ref5] ten aanzien van de
      directeuren van de Kabinetten van de Gouverneurs van de Nederlandse Antillen en Aruba;

      g. het optreden als gemachtigd ambtenaar in de zin van de departementale regelgeving met betrekking tot de
      uitvoering van de [Wet openbaarheid van bestuur][ref6];

      h. het optreden als bevoegd gezag als bedoeld in de
      [Regeling procedure inzake het omgaan met een vermoeden van een misstand][ref7];

      i. het verlenen van ontslag aan een ambtenaar op grond van [artikel 125e van de Ambtenarenwet][ref8];

      j. het vaststellen en ondertekenen van beleidsregels en circulaires met betrekking tot de aangelegenheden, bedoeld
      in dit artikel;

      k. het toekennen van vergoeding van representatiekosten op grond van het
      [Besluit vergoeding representatiekosten rijkspersoneel][ref9].


      [ref1]: https://wetten.overheid.nl/BWBR0025266
      [ref2]: https://wetten.overheid.nl/BWBR0002747
      [ref3]: https://wetten.overheid.nl/BWBR0002747
