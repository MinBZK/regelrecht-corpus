  - number: '4.10'
    text: |-
      1 Het mandaat van het diensthoofd met betrekking tot het aangaan van financiële verplichtingen en het doen van
      uitgaven is beperkt tot het budget dat aan het diensthoofd ter beschikking is gesteld op basis van een door de
      secretaris-generaal en de directeur Financieel-economische Zaken goedgekeurde budgettaire uitwerking van dat deel
      van de begroting waarvoor het diensthoofd verantwoordelijk is.

      2 Het diensthoofd is bevoegd om in afwijking van het eerste lid financiële verplichtingen aan te gaan en uitgaven
      te doen, voor zover aan hem daartoe uitdrukkelijk en schriftelijk mandaat is verleend door de Minister of de
      secretaris-generaal, met instemming van de directeur Financieel-economische Zaken.
    url: https://wetten.overheid.nl/BWBR0025254/2009-03-01#Artikel4.10
  - number: '4.11'
    text: |-
      1 Het diensthoofd is, voor zover niet anders is bepaald, bevoegd tot het verlenen van ondermandaat aan onder
      hem ressorterende functionarissen ten aanzien van aangelegenheden op het werkterrein van deze functionarissen,
      respectievelijk tot het beperken of het intrekken daarvan.

      2 Het diensthoofd kan bij toepassing van de bevoegdheid tot het verlenen van ondermandaat, bedoeld in het eerste
      lid, afwijken van hetgeen in dit besluit is bepaald over het mandaat van de directeur, met uitzondering van
      [artikel 5.8][ref1].

      3 Het diensthoofd is bevoegd om in bijzondere gevallen, naast of in plaats van het
      bepaalde in het eerste en tweede lid, mondeling of schriftelijk ondermandaat te verlenen
      aan een onder hem ressorterende functionaris voor een bepaald geval, met inachtneming van
      [artikel 1, derde lid, van het Besluit privaatrechtelijke rechtshandelingen 1996][ref2].

      4 Het diensthoofd kan, voor zover niet anders is bepaald, bij het verlenen van ondermandaat tevens de bevoegdheid
      toekennen tot het verlenen van ondermandaat aan een rechtstreeks onder de gemandateerde ressorterende functionaris
      of in bijzondere gevallen aan een andere functionaris, ten aanzien van aangelegenheden op het werkterrein van de
      functionaris.


      [ref1]: https://wetten.overheid.nl/BWBR0025254#Artikel5.8
      [ref2]: https://wetten.overheid.nl/BWBR0007804#Artikel1
    url: https://wetten.overheid.nl/BWBR0025254/2009-03-01#Artikel4.11
    references:
      - id: ref1
        bwb_id: BWBR0025254
        artikel: '5.8'
        hoofdstuk: '5'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0007804
        artikel: '1'
  - number: '4.12'
    text: |-
      Het diensthoofd verleent ondermandaat bij schriftelijk besluit, in overeenstemming met de secretaris-generaal en na
      advies van de directeur Financieel-economische Zaken en de directeur Personeel en Organisatie.
    url: https://wetten.overheid.nl/BWBR0025254/2009-03-01#Artikel4.12
  - number: '4.13'
    text: |-
      1 Bij tijdelijke afwezigheid of verhindering van het diensthoofd wordt diens mandaat volledig uitgeoefend door het
      plaatsvervangend diensthoofd.

      2 De aanwijzing van een plaatsvervangend diensthoofd geschiedt door het diensthoofd met inachtneming van het
      [Organisatiebesluit BZK 2008][ref1] en in overeenstemming met de secretaris-generaal.

      3 Bij gelijktijdige tijdelijke afwezigheid of verhindering van het diensthoofd en het plaatsvervangend diensthoofd
      wordt het mandaat van het diensthoofd bij wijze van waarneming volledig uitgeoefend door de functionaris die
      daartoe door het diensthoofd in overeenstemming met de secretaris-generaal is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0025266
    url: https://wetten.overheid.nl/BWBR0025254/2009-03-01#Artikel4.13
    references:
      - id: ref1
        bwb_id: BWBR0025266
  - number: '5.1'
    text: |-
      Aan de directeur wordt mandaat verleend ten aanzien van aangelegenheden die behoren tot het werkterrein van de
      directeur en die, onverminderd dit besluit, redelijkerwijs niet behoren te worden voorgelegd aan een hoger bevoegd
      gezag.
    url: https://wetten.overheid.nl/BWBR0025254/2009-03-01#Artikel5.1
  - number: '5.2'
    text: |-
      Onverminderd dit besluit, heeft het mandaat van de directeur in ieder geval betrekking op:

      a. het werkterrein van de directeur en de onder de directeur ressorterende functionarissen en dienstonderdelen
      en het uitoefenen van integraal management dienaangaande met inbegrip van aangelegenheden op organisatorisch,
      personeel, financieel en materieel gebied;

      b. het leiding geven aan de rechtstreeks onder de directeur ressorterende functionarissen;

      c. het optreden als bestuurder in de zin van de [Wet op de ondernemingsraden][ref1] in het overleg met de
      ondernemingsraad van het desbetreffende dienstonderdeel, voor zover het diensthoofd niet als zodanig optreedt;

      d. het vertegenwoordigen van de Minister namens de Staat in gerechtelijke procedures waarbij het dienstonderdeel
      is betrokken;

      e. het afnemen van de eed of de belofte van ambtenaren bij het dienstonderdeel waarover de directeur de leiding
      voert voor zover het een buitendienst, agentschap of baten-lastendienst betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0002747
    url: https://wetten.overheid.nl/BWBR0025254/2009-03-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0002747
  - number: '5.3'
    text: |-
      De directeur Bedrijfsvoering is met inachtneming van dit besluit bevoegd om stukken af te doen en te ondertekenen
      met betrekking tot het aangaan van (raam)overeenkomsten inzake departementale inkoop voor bewaking en beveiliging,
      bedrijfshulpverlening, schoonmaak, vervoer, groenvoorziening, catering en informatie- en communicatietechnologie.
    url: https://wetten.overheid.nl/BWBR0025254/2009-03-01#Artikel5.3
  - number: '5.4'
    text: |-
      De directeur Financieel-economische Zaken is bevoegd:

      a. tot het af doen en ondertekenen van stukken in verband met de uitvoering van
      [artikel 21 van de Comptabiliteitswet 2001][ref1] en het [Besluit taak FEZ][ref2];

      b. tot het geven van instructies aan de onderdelen die verantwoordelijk zijn voor de financiële bedrijfsvoering
      en control;

      c. tot het inhoudelijk aansturen van onderdelen die zijn betrokken bij het bewaken van en adviseren over de
      uitvoering van de bedrijfsvoering in brede zin;

      d. tot het met inachtneming van dit besluit tekenen en afdoen van stukken met betrekking tot het werkterrein van de
      Centrale Directeur Inkoop.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0005333
    url: https://wetten.overheid.nl/BWBR0025254/2009-03-01#Artikel5.4
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0005333
  - number: '5.5'
    text: |-
      De directeur Personeel en Organisatie is met inachtneming van dit besluit bevoegd:

      a. tot het ondertekenen van procedurele stukken in het kader van de behandeling van bezwaarschriften tegen
      besluiten van of namens de Minister met betrekking tot een personele aangelegenheid;

      b. tot het inschakelen van de landsadvocaat voor ondersteuning of vertegenwoordiging van het Ministerie inzake
      rechtspositionele vraagstukken;

      c. tot het namens de secretaris-generaal ondertekenen van stukken aan de Groepsondernemingsraad
      onderscheidenlijk de centrales van verenigingen van ambtenaren, bedoeld in
      [artikel 113 van het Algemeen Rijksambtenarenreglement][ref1];

      d. tot het ondertekenen van brieven met betrekking tot het voeren van de salarisadministratie bij de directie;

      e. tot het afdoen en ondertekenen van stukken met betrekking tot het aangaan van raamovereenkomsten inzake
      organisatie-advisering, opleiding, scholing, training en assessments bij het Ministerie, en overeenkomsten inzake
      departementale vervoersregelingen, arbeidsomstandigheden, bedrijfsmaatschappelijk werk en kinderopvang;

      f. tot het afdoen en ondertekenen van stukken met betrekking tot de vergoeding van representatiekosten op grond van
      het [Besluit representatiekosten rijkspersoneel][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel113
      [ref2]: https://wetten.overheid.nl/BWBR0006102
    url: https://wetten.overheid.nl/BWBR0025254/2009-03-01#Artikel5.5
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '113'
      - id: ref2
        bwb_id: BWBR0006102
  - number: '5.6'
    text: |-
      De directeur Auditdienst is bevoegd om stukken af te doen en te ondertekenen in verband met de uitvoering van
      [artikel 66 van de Comptabiliteitswet 2001][ref1] en het [Besluit taak DAD][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0007535
    url: https://wetten.overheid.nl/BWBR0025254/2009-03-01#Artikel5.6
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '66'
      - id: ref2
        bwb_id: BWBR0007535
  - number: '5.7'
    text: |-
      De directeur Communicatie en Informatie is met inachtneming van dit besluit bevoegd om stukken af te doen en
      te ondertekenen met betrekking tot het aangaan van raamovereenkomsten inzake de inzet van media ten behoeve van
      departementale voorlichting en communicatie.
    url: https://wetten.overheid.nl/BWBR0025254/2009-03-01#Artikel5.7
  - number: '5.8'
    text: |-
      1 Het mandaat van de directeur is niet van toepassing op het nemen van besluiten en het afdoen en ondertekenen van
      stukken met betrekking tot:

      a. personele aangelegenheden ten aanzien van rechtstreeks onder het diensthoofd ressorterende functionarissen;

      b. het aanstellen van een ambtenaar;

      c. het verlenen van een gratificatie bij ambtsjubileum;

      d. het opleggen van een disciplinaire straf;

      e. het schorsen van een ambtenaar in zijn ambt;

      f. het verlenen van ontslag aan een ambtenaar;

      g. het aanwijzen van een ambtenaar als herplaatsingskandidaat;

      h. het aanwijzen van een groep functies als bedoeld in het Sociaal flankerend beleid sector Rijk 2008–2012;

      i. het vaststellen van beleidsregels en circulaires ten aanzien van aangelegenheden op het werkterrein van het
      diensthoofd, tenzij deze bevoegdheid in hogere regelgeving aan de desbetreffende functionaris is toegekend;

      j. het besluiten tot een reorganisatie;

      k. het toekennen van materiële schadevergoeding vanaf € 2.500,– of immateriële schadevergoeding;

      l. het vaststellen van de formatie van onder het diensthoofd ressorterende dienstonderdelen;

      m. het beslissen op bezwaarschriften;

      n. de onderwerpen genoemd in [artikel 4.9][ref1].

      2 De beperkingen genoemd in het eerste lid, onderdeel b tot en met f, gelden niet voor het mandaat van de directeur
      die leiding geeft aan een baten-lastendienst of agentschap, aan de Projectdirectie Nieuwbouw Justitie & BZK, het
      gemeenschappelijk secretariaat van de Raad voor het openbaar bestuur en de Raad voor de financiële verhoudingen en
      het secretariaat voor de Kiesraad.


      [ref1]: https://wetten.overheid.nl/BWBR0025254#Artikel4.9
    url: https://wetten.overheid.nl/BWBR0025254/2009-03-01#Artikel5.8
    references:
      - id: ref1
        bwb_id: BWBR0025254
        artikel: '4.9'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '5.9'
    text: |-
      1 Het mandaat van de directeur met betrekking tot het aangaan van financiële verplichtingen en het doen van
      uitgaven is beperkt tot het budget dat aan de directeur ter beschikking is gesteld op basis van een door het
      diensthoofd en de DG-Controller goedgekeurde budgettaire uitwerking van dat deel van de begroting waarvoor de
      directeur verantwoordelijk is.

      2 De directeur is bevoegd om in afwijking van het eerste lid financiële verplichtingen aan te gaan en uitgaven te
      doen, voor zover aan hem daartoe uitdrukkelijk en schriftelijk mandaat is verleend door de Minister, de secretaris-
      generaal of het diensthoofd, met instemming van de DG-Controller en binnen het vastgestelde budget dat aan het
      diensthoofd ter beschikking is gesteld.
    url: https://wetten.overheid.nl/BWBR0025254/2009-03-01#Artikel5.9
  - number: '5.10'
    text: |-
      1 De directeur is, voor zover niet anders is bepaald, bevoegd tot het verlenen van ondermandaat aan onder hem
      ressorterende functionarissen ten aanzien van aangelegenheden op het werkterrein van deze functionarissen,
      respectievelijk tot het beperken of het intrekken daarvan.

      2 De directeur kan, voor zover niet anders is bepaald, bij het verlenen van ondermandaat tevens de bevoegdheid
      toekennen tot het verlenen van ondermandaat aan een rechtstreeks onder de gemandateerde ressorterende functionaris
      ten aanzien van aangelegenheden op het werkterrein van de functionaris.

      3 De directeur is bevoegd om in bijzondere gevallen, naast het bepaalde in het eerste en tweede lid, mondeling
      of schriftelijk ondermandaat te verlenen aan een onder hem ressorterende functionaris voor een bepaald geval, met
      inachtneming van [artikel 1, derde lid, van het Besluit privaatrechtelijke rechtshandelingen 1996][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007804#Artikel1
    url: https://wetten.overheid.nl/BWBR0025254/2009-03-01#Artikel5.10
    references:
      - id: ref1
        bwb_id: BWBR0007804
        artikel: '1'
  - number: '5.11'
    text: |-
      1 De directeur verleent ondermandaat bij schriftelijk besluit, in overeenstemming met het diensthoofd en met
      kennisgeving aan de directeur Personeel en Organisatie en de directeur Financieel-economische Zaken.

      2 De door de directeur gemandateerde, bedoeld in [artikel 5.10, eerste lid][ref1], verleent ondermandaat bij
      schriftelijk besluit, in overeenstemming met de directeur en met kennisgeving aan de directeur Personeel en
      Organisatie en aan de directeur Financieel-economische Zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0025254#Artikel5.10
    url: https://wetten.overheid.nl/BWBR0025254/2009-03-01#Artikel5.11
    references:
      - id: ref1
        bwb_id: BWBR0025254
        artikel: '5.10'
        hoofdstuk: '5'
        paragraaf: '4'
  - number: '5.12'
    text: |-
      De rechtstreeks onder de directeur ressorterende leidinggevenden zijn, voor zover door de directeur met toepassing
      van [artikel 5.10, eerste lid][ref1], niet anders is bepaald, ten aanzien van de onder hen ressorterende
      functionarissen bevoegd tot:

      a. het vaststellen van het wekelijkse werkrooster;

      b. het verlenen van vakantieverlof;

      c. het verlenen van buitengewoon verlof van korte duur;

      d. het accorderen van binnenlandse dienstreizen en daarbij gebruikte vervoermiddel;

      e. het voeren respectievelijk de verslaglegging van het gesprek, bedoeld in
      [artikel 71 van het Algemeen Rijksambtenarenreglement][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025254#Artikel5.10
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel71
    url: https://wetten.overheid.nl/BWBR0025254/2009-03-01#Artikel5.12
    references:
      - id: ref1
        bwb_id: BWBR0025254
        artikel: '5.10'
        hoofdstuk: '5'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0001950
        artikel: '71'
  - number: '5.13'
    text: |-
      1 Bij tijdelijke afwezigheid of verhindering van de directeur wordt diens mandaat volledig uitgeoefend door de
      plaatsvervangend directeur.

      2 De aanwijzing van een plaatsvervangend directeur geschiedt door de directeur met inachtneming van het
      [Organisatiebesluit BZK 2008][ref1] en in overeenstemming met het diensthoofd.

      3 Bij gelijktijdige tijdelijke afwezigheid of verhindering van de directeur en de plaatsvervangend directeur wordt
      het mandaat van de directeur bij wijze van waarneming volledig uitgeoefend door de functionaris die daartoe door de
      directeur in overeenstemming met het diensthoofd is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0025266
    url: https://wetten.overheid.nl/BWBR0025254/2009-03-01#Artikel5.13
    references:
      - id: ref1
        bwb_id: BWBR0025266
  - number: '6.1'
    text: |-
      De uitoefening van een mandaat, geschiedt met inachtneming van:

      a. algemene en bijzondere aanwijzingen van hiërarchisch hoger geplaatsten ten aanzien van de uitoefening van het
      mandaat;

      b. departementale richtlijnen met betrekking tot paraaf en medeparaaf en het voorleggen en afdoen van stukken;

      c. de van toepassing zijnde wet- en regelgeving en overige departementale richtlijnen, in
      het bijzonder de [Comptabiliteitswet 2001][ref1], de [Wet op de ondernemingsraden][ref2], het
      [Besluit privaatrechtelijke rechtshandelingen 1996][ref3], het [Besluit taak FEZ][ref4], het departementale
      kader voor externe inhuur, het [Organisatiebesluit BZK 2008][ref5] en (de richtlijnen inzake) administratieve
      organisatiebeschrijvingen.


      [ref1]: https://wetten.overheid.nl/BWBR0013891
      [ref2]: https://wetten.overheid.nl/BWBR0002747
      [ref3]: https://wetten.overheid.nl/BWBR0007804
      [ref4]: https://wetten.overheid.nl/BWBR0005333
      [ref5]: https://wetten.overheid.nl/BWBR0025266
    url: https://wetten.overheid.nl/BWBR0025254/2009-03-01#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0013891
      - id: ref2
        bwb_id: BWBR0002747
      - id: ref3
        bwb_id: BWBR0007804
      - id: ref4
        bwb_id: BWBR0005333
      - id: ref5
        bwb_id: BWBR0025266
  - number: '6.2'
    text: |-
      1 De uitoefening van een mandaat, geschiedt binnen de door de secretaris-generaal vastgestelde kaders met
      betrekking tot het beleid en beheer inzake de bedrijfsvoering van het Ministerie.

      2 De uitoefening van een mandaat, geschiedt met inachtneming van de departementale procedures en richtlijnen.

      3 Afwijking van het eerste lid ten aanzien van een onder het diensthoofd ressorterend dienstonderdeel is slechts
      mogelijk in overeenstemming met de secretaris-generaal, de directeur Financieel-economische Zaken en de directeur
      van het dienstonderdeel binnen de Dienst Concernstaf en Bedrijfsvoering die het aangaat en wordt schriftelijk
      vastgelegd.
    url: https://wetten.overheid.nl/BWBR0025254/2009-03-01#Artikel6.2
  - number: '6.3'
    text: |-
      1 De gemandateerde is verantwoordelijk voor het bijhouden van een of meer doelmatig ingerichte administraties die
      inzicht bieden in het door en namens de gemandateerde gevoerde financiële beheer en beheer van niet-geldelijke
      zaken op grond van diens mandaat.

      2 De directeur Financieel-economische Zaken en de directeur Auditdienst zijn bevoegd om de administraties, bedoeld
      in het eerste lid, te onderzoeken ten behoeve van de uitvoering van taken behorende tot hun werkterrein.
    url: https://wetten.overheid.nl/BWBR0025254/2009-03-01#Artikel6.3
  - number: '6.4'
    text: |-
      1 Ondertekening van besluiten en stukken op grond van mandaat vindt plaats op de volgende wijze:

      (aanduiding Minister),

      voor deze,

      (aanduiding functie gemandateerde),

      (handtekening)

      (naam)

      2 Ondertekening van personele besluiten van de directeur en de door of namens de directeur gemandateerde, bedoeld
      in artikel 5.10, eerste lid, respectievelijk tweede lid, vindt plaats op de volgende wijze:

      (aanduiding Minister),

      voor deze,

      (aanduiding diensthoofd)

      voor deze,

      (aanduiding functie gemandateerde),

      (handtekening)

      (naam)

      3 Het tweede lid is niet van toepassing voor de directeur van een baten-lastendienst of agentschap en de door of
      namens deze directeur gemandateerde, bedoeld in [artikel 5.10, eerste lid, respectievelijk tweede lid][ref1].

      4 Bij ondertekening van besluiten en stukken op grond van volmacht wordt de aanduiding van de Minister voorafgegaan
      door: Namens de Staat der Nederlanden.

      5 Bij ondertekening van besluiten en stukken door een plaatsvervanger of waarnemer wordt de handtekening
      voorafgegaan door: b/a.


      [ref1]: https://wetten.overheid.nl/BWBR0025254#Artikel5.10
    url: https://wetten.overheid.nl/BWBR0025254/2009-03-01#Artikel6.4
    references:
      - id: ref1
        bwb_id: BWBR0025254
        artikel: '5.10'
        hoofdstuk: '5'
        paragraaf: '4'
  - number: '6.5'
    text: |-
      In gevallen waarin dit besluit niet voorziet, beslist de Minister, de secretaris-generaal, of het diensthoofd over
      de doorverlening van zijn mandaat.
    url: https://wetten.overheid.nl/BWBR0025254/2009-03-01#Artikel6.5
  - number: '7.1'
    text: |-
      1 De directeur Personeel en Organisatie is belast met het beheer van dit besluit.

      2 De secretaris-generaal, de diensthoofden, de directeuren, ieder voor zover het hem aangaat, zijn verantwoordelijk
      voor een juiste, volledige en tijdige aanlevering aan de directeur Personeel en Organisatie van de gegevens die een
      goed beheer van dit besluit onderscheidenlijk het mandaatregister mogelijk maken.

      3 Het beheer en de aanlevering van gegevens geschieden met inachtneming van de desbetreffende (richtlijnen inzake)
      administratieve organisatiebeschrijvingen.

      4 De directeur Personeel en Organisatie rapporteert aan de Ministers en de secretaris-generaal over het beheer van
      dit besluit en het centrale mandaatregister.
    url: https://wetten.overheid.nl/BWBR0025254/2009-03-01#Artikel7.1
  - number: '7.2'
    text: |-
      1 De directeur Personeel en Organisatie draagt zorg voor de inrichting en het beheer van een centraal
      mandaatregister.

      2 Het register biedt inzicht in:

      a. de functies en namen van functionarissen aan wie door of namens de Minister (onder)mandaat is (door)verleend,
      met aanduiding van de verleende bevoegdheid;

      b. de functies en namen van functionarissen die de Minister vertegenwoordigen in een (bestuurs)orgaan van een
      rechtspersoon anders dan de Staat, met aanduiding van het (bestuurs)orgaan en de rechtspersoon.

      3 Het register is openbaar.

      4 De directeur Personeel en Organisatie draagt zorg voor de gegevensverstrekking uit het register. Bij de
      uitvoering van deze werkzaamheden pleegt hij zo nodig overleg met de directeur Constitutionele Zaken en Wetgeving
      en de directeur Communicatie en Informatie.
    url: https://wetten.overheid.nl/BWBR0025254/2009-03-01#Artikel7.2
  - number: '7.3'
    text: |-
      1 In afwijking van [artikel 7.2, tweede lid][ref1], worden gegevens met betrekking tot de verlening van
      ondermandaat aan functionarissen in de rang van directeur en daaronder ressorterende functionarissen bij de
      Algemene Inlichtingen- en Veiligheidsdienst opgenomen in een door het hoofd van de Algemene Inlichtingen- en
      Veiligheidsdienst bijgehouden mandaatregister.

      2 Het hoofd van de Algemene Inlichtingen- en Veiligheidsdienst kan in overeenstemming met de secretaris-generaal
      nadere regels stellen ten aanzien van het register, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0025254#Artikel7.2
    url: https://wetten.overheid.nl/BWBR0025254/2009-03-01#Artikel7.3
    references:
      - id: ref1
        bwb_id: BWBR0025254
        artikel: '7.2'
        hoofdstuk: '7'
  - number: '7.4'
    text: |-
      Wijziging van dit besluit geschiedt op initiatief van de directeur Personeel en Organisatie na advies van de
      directeur Financieel-economische Zaken en de directeur Constitutionele Zaken en Wetgeving.
    url: https://wetten.overheid.nl/BWBR0025254/2009-03-01#Artikel7.4
  - number: '8.1'
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na dagtekening van de Staatscourant waarin dit wordt
      geplaatst en werkt terug tot en met 1 november 2008.
    url: https://wetten.overheid.nl/BWBR0025254/2009-03-01#Artikel8.1
  - number: '8.2'
    text: 'Dit besluit wordt aangehaald als: Mandaatbesluit BZK 2008.'
    url: https://wetten.overheid.nl/BWBR0025254/2009-03-01#Artikel8.2
  - number: '8.3'
    text: |-
      Het [Mandaat- en volmachtbesluit secretaris-generaal BZK (MV-besluit secretaris-generaal BZK)][ref1],
      het [Mandaat- en volmachtbesluit diensthoofden BZK (MV-besluit diensthoofden BZK)][ref2], en het
      [Mandaat- en volmachtbesluit directeuren BZK (MV-besluit directeuren BZK)][ref3], worden ingetrokken.


