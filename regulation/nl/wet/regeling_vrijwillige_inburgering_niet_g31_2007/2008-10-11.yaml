  - number: 1.r
    text: |-
      inburgeringsbedrijf: een natuurlijk persoon of rechtspersoon die in het kader van uitoefening van beroep of bedrijf
      de inburgering van personen in Nederland bevordert;
    url: https://wetten.overheid.nl/BWBR0020646/2008-10-11#Artikel1
  - number: 1.s
    text: |-
      persoonlijk inburgeringsbudget: een budget dat door het college of het bestuur, in het kader van een te sluiten
      overeenkomst met een inburgeringsbedrijf, ten behoeve van een inburgeraar ter beschikking wordt gesteld en met
      behulp waarvan de inburgeraar zijn inburgering op een individuele wijze vorm geeft;
    url: https://wetten.overheid.nl/BWBR0020646/2008-10-11#Artikel1
  - number: 1.t
    text: |-
      staatsexamen: het staatsexamen Nederlands als tweede taal I en II, bedoeld in
      [artikel 7.3.1, eerste lid, onderdeel c, van de Wet educatie en beroepsonderwijs][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0020646/2008-10-11#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 1.u
    text: |-
      duale inburgeringsvoorziening: inburgeringsvoorziening die met het oog op de actieve deelname van de inburgeraar
      aan de Nederlandse samenleving mede voorziet in activiteiten die in samenhang, en ten minste voor een deel
      gelijktijdig, met het verwerven van mondelinge en schriftelijke vaardigheden in de Nederlandse taal en kennis van
      de Nederlandse samenleving worden uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0020646/2008-10-11#Artikel1
  - number: 1.v
    text: |-
      taalkennisvoorziening: voorziening die is gericht op de verwerving van de kennis van de Nederlandse
      taal die noodzakelijk is voor het kunnen afronden van een beroepsopleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onderdelen a en b, van de Wet educatie en beroepsonderwijs][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0020646/2008-10-11#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: '2.1'
    text: |-
      De Minister kan aan een gemeente of een samenwerkingsverband, onder de in deze regeling genoemde voorwaarden, een
      financiële bijdrage verlenen teneinde de gemeente of het samenwerkingsverband in staat te stellen inburgeraars deel
      te laten nemen aan:
    url: https://wetten.overheid.nl/BWBR0020646/2008-10-11#Artikel2
  - number: 2.1.a
    text: |-
      een inburgeringsvoorziening of een gecombineerde inburgeringsvoorziening en deze voorziening te laten afsluiten met
      het inburgeringsexamen of het staatsexamen, dan wel
    url: https://wetten.overheid.nl/BWBR0020646/2008-10-11#Artikel2
  - number: 2.1.b
    text: |-
      een taalkennisvoorziening, mits de inburgeraar een beroepsopleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onderdelen a en b, van de Wet educatie en beroepsonderwijs][ref1] volgt of gaat volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0020646/2008-10-11#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: '2.2'
    text: De financiële bijdrage wordt onder voorbehoud van autorisatie van de begrotingswetgever verleend en vastgesteld.
    url: https://wetten.overheid.nl/BWBR0020646/2008-10-11#Artikel2
  - number: '3.1'
    text: |-
      Ten behoeve van het jaar 2007 stelt de Minister ambtshalve een voorschot op de financiële bijdrage vast welke vóór
      26 februari 2007 bekend wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0020646/2008-10-11#Artikel3
  - number: '3.2'
    text: |-
      Ten behoeve van de jaren 2008 en 2009 maakt de Minister voor 15 september 2007, respectievelijk 15 september 2008,
      een indicatief voorschot bekend.
    url: https://wetten.overheid.nl/BWBR0020646/2008-10-11#Artikel3
  - number: '3.3'
    text: |-
      Het college dient voor 15 oktober 2007, respectievelijk 15 oktober 2008, een aanvraag in tot verlening van een
      financiële bijdrage.
    url: https://wetten.overheid.nl/BWBR0020646/2008-10-11#Artikel3
  - number: '3.4'
    text: |-
      De Minister stelt de hoogte van het voorschot, bedoeld in het tweede lid, voor 1 december 2007, respectievelijk
      1 december 2008 vast.
    url: https://wetten.overheid.nl/BWBR0020646/2008-10-11#Artikel3
  - number: '3.5'
    text: Voorschotten worden uiterlijk binnen zes maanden na de vaststelling ervan betaald.
    url: https://wetten.overheid.nl/BWBR0020646/2008-10-11#Artikel3
  - number: '4.1'
    text: |-
      Het college of het bestuur kan aan een inburgeraar een inburgeringsvoorziening of een gecombineerde
      inburgeringsvoorziening aanbieden die op de persoonlijke situatie van de inburgeraar is afgestemd. Indien de
      inburgeraar daarom verzoekt, kan de inburgeringsvoorziening of de inburgeringscomponent van de gecombineerde
      inburgeringsvoorziening worden aangeboden in de vorm van een persoonlijk inburgeringsbudget.
    url: https://wetten.overheid.nl/BWBR0020646/2008-10-11#Artikel4
  - number: '4.2'
    text: |-
      In afwijking van het eerste lid kan het college of bestuur aan een inburgeraar, niet zijnde geestelijke bedienaar,
      een taalkennisvoorziening aanbieden. Indien de inburgeraar daarom verzoekt, kan de taalkennisvoorziening worden
      aangeboden in de vorm van een persoonlijk inburgeringsbudget.
    url: https://wetten.overheid.nl/BWBR0020646/2008-10-11#Artikel4
  - number: '4.3'
    text: |-
      Zowel een inburgeringsvoorziening als een gecombineerde inburgeringsvoorziening bereidt voor op en leidt toe naar
      het inburgeringsexamen of het staatsexamen en omvat het eenmaal kosteloos afleggen van het desbetreffende examen.
    url: https://wetten.overheid.nl/BWBR0020646/2008-10-11#Artikel4
  - number: '4.4'
    text: |-
      Het college of het bestuur draagt er zorg voor dat de inburgeringsvoorziening, dan wel de gecombineerde
      inburgeringsvoorziening, uiterlijk 31 december van het tweede kalenderjaar na het jaar waarin de voorziening is
      vastgesteld, wordt afgesloten door middel van deelname aan het inburgeringsexamen of het staatsexamen.
    url: https://wetten.overheid.nl/BWBR0020646/2008-10-11#Artikel4
  - number: '4.5'
    text: |-
      De inburgeraar is de in [artikel 23, tweede lid, van de wet][ref1] bedoelde eigen bijdrage
      verschuldigd, tenzij hij op last van het college of bestuur, dan wel een andere instantie, genoemd in
      [artikel 21, tweede lid, van de wet][ref2], een gecombineerde inburgeringsvoorziening dient te volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel21
    url: https://wetten.overheid.nl/BWBR0020646/2008-10-11#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0020611
        artikel: '21'
  - number: 4a.1
    text: |-
      Indien een inburgeraar in aanmerking wordt gebracht voor een inburgeringsvoorziening, een gecombineerde
      inburgeringsvoorziening dan wel een taalkennisvoorziening doet het college of het bestuur de inburgeraar terzake
      een aanbod.
    url: https://wetten.overheid.nl/BWBR0020646/2008-10-11#Artikel4a
  - number: 4a.2
    text: |-
      Indien het aanbod, bedoeld in het eerste lid, geheel of gedeeltelijk bestaat uit een persoonlijk
      inburgeringsbudget begeleidt het college of het bestuur de inburgeraar op diens verzoek bij de vormgeving van zijn
      inburgeringsprogramma en de keuze van een inburgeringsbedrijf. Het college of het bestuur beoordeelt het voorstel
      van de inburgeraar en sluit vervolgens een overeenkomst met het inburgeringsbedrijf.
    url: https://wetten.overheid.nl/BWBR0020646/2008-10-11#Artikel4a
  - number: 4a.3
    text: |-
      Indien een inburgeraar tevens geestelijke bedienaar is, wordt hem, onverminderd het bepaalde in het eerste en
      tweede lid, de cursus, bedoeld in [artikel 4.25 van de Regeling inburgering][ref1] aangeboden.


      [ref1]: https://wetten.overheid.nl/BWBR0020657#Artikel4
    url: https://wetten.overheid.nl/BWBR0020646/2008-10-11#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0020657
        artikel: '4'
  - number: '5.1'
    text: |-
      Tegelijkertijd met het doen van het aanbod, bedoeld in [artikel 4a, eerste lid][ref1], informeert het college
      of het bestuur de inburgeraar omtrent de hoofdlijnen van de met hem te sluiten overeenkomst terzake van de
      vaststelling van zijn inburgeringsvoorziening, gecombineerde inburgeringsvoorziening dan wel taalkennisvoorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0020646#Artikel4a
    url: https://wetten.overheid.nl/BWBR0020646/2008-10-11#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020646
        artikel: 4a
        hoofdstuk: '2'
  - number: '5.2'
    text: |-
      Indien de inburgeraar het aanbod, bedoeld in [artikel 4a, eerste lid][ref1], aanvaardt, sluit het college of het
      bestuur de in het eerste lid bedoelde overeenkomst met de inburgeraar.


      [ref1]: https://wetten.overheid.nl/BWBR0020646#Artikel4a
    url: https://wetten.overheid.nl/BWBR0020646/2008-10-11#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020646
        artikel: 4a
        hoofdstuk: '2'
  - number: '5.3'
    text: |-
      De overeenkomst bevat ten minste een omschrijving van de inburgeringsvoorziening, de gecombineerde
      inburgeringsvoorziening dan wel de taalkennisvoorziening, alsmede een omschrijving van de rechten en verplichtingen
      van de inburgeraar ten aanzien van:
    url: https://wetten.overheid.nl/BWBR0020646/2008-10-11#Artikel5
  - number: 5.3.a
    text: |-
      indien van toepassing, de termijn waarbinnen de inburgeraar moet hebben deelgenomen aan het inburgeringsexamen dan
      wel het staatsexamen;
    url: https://wetten.overheid.nl/BWBR0020646/2008-10-11#Artikel5
  - number: 5.3.b
    text: de verschuldigdheid van de eigen bijdrage en de mogelijkheid van betaling in termijnen;
    url: https://wetten.overheid.nl/BWBR0020646/2008-10-11#Artikel5
  - number: 5.3.c
    text: |-
      de verlening van toestemming om de in de [bijlage bij artikel 6.1, tweede lid, van het besluit](onbekend) bedoelde
      (persoons)gegevens welke betrekking hebben op de inburgeraar, op te nemen in het Informatiesysteem Inburgering;
    url: https://wetten.overheid.nl/BWBR0020646/2008-10-11#Artikel5
  - number: 5.3.d
    text: de gevolgen van niet-nakoming van de overeenkomst.
    url: https://wetten.overheid.nl/BWBR0020646/2008-10-11#Artikel5
  - number: '5.4'
    text: De overeenkomst wordt door partijen niet later ondertekend dan 31 december 2009.
    url: https://wetten.overheid.nl/BWBR0020646/2008-10-11#Artikel5
  - number: '6.1'
    text: Indien de inburgeraar het inburgeringsexamen heeft behaald, ontvangt hij het inburgeringsdiploma.
    url: https://wetten.overheid.nl/BWBR0020646/2008-10-11#Artikel6
  - number: '6.2'
    text: Het inburgeringsdiploma wordt uitgereikt door de IB-Groep.
    url: https://wetten.overheid.nl/BWBR0020646/2008-10-11#Artikel6
  - number: '7.1'
    text: |-
      Het college of het bestuur, de exameninstellingen, de IB-Groep en de Minister verstrekken aan de beheerder van het
      Informatiesysteem Inburgering uit eigen beweging of op verzoek kosteloos alle gegevens die noodzakelijk zijn voor
      de uitvoering van de onderhavige regeling.
    url: https://wetten.overheid.nl/BWBR0020646/2008-10-11#Artikel7
  - number: '7.2'
    text: |-
      De IB-Groep verstrekt aan de Minister, alsmede het college of het bestuur, uit eigen beweging of op verzoek alle
      gegevens die noodzakelijk zijn voor de uitvoering van de onderhavige regeling.
    url: https://wetten.overheid.nl/BWBR0020646/2008-10-11#Artikel7
  - number: '7.3'
    text: 'In het Informatiesysteem Inburgering met betrekking tot inburgeraars opgenomen persoonsgegevens worden verwijderd:'
    url: https://wetten.overheid.nl/BWBR0020646/2008-10-11#Artikel7
  - number: 7.3.a
    text: na verloop van twintig jaren, of
    url: https://wetten.overheid.nl/BWBR0020646/2008-10-11#Artikel7
  - number: 7.3.b
    text: indien de betrokken persoon is overleden.
    url: https://wetten.overheid.nl/BWBR0020646/2008-10-11#Artikel7
  - number: '7.4'
    text: |-
      De termijn, bedoeld in het derde lid, onderdeel a, vangt aan op de dag waarop de gegevens in het Informatiesysteem
      Inburgering zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0020646/2008-10-11#Artikel7
  - number: '8.1'
    text: |-
      De inburgeraar die op 1 januari 2007 deelneemt aan een opleiding educatie als bedoeld in
      [artikel 7.3.1, eerste lid, onderdeel d, van de Wet educatie en beroepsonderwijs][ref1], blijft toegelaten tot
      deze opleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0020646/2008-10-11#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: '8.2'
    text: |-
      Het college of het bestuur kan de opleidingen educatie, bedoeld in het eerste lid, gedurende het jaar 2007
      bekostigen uit de financiële bijdrage, bedoeld in [artikel 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020646#Artikel2
    url: https://wetten.overheid.nl/BWBR0020646/2008-10-11#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0020646
        artikel: '2'
        hoofdstuk: '1'
  - number: '9.1'
    text: 'Het college of het bestuur verstrekt de volgende prestatiegegevens:'
    url: https://wetten.overheid.nl/BWBR0020646/2008-10-11#Artikel9
  - number: 9.1.a
    text: |-
      het aantal inburgeraars, niet zijnde geestelijke bedienaar, met wie in respectievelijk 2007, 2008 en 2009 een
      overeenkomst tot vaststelling van een inburgeringsvoorziening is gesloten;
    url: https://wetten.overheid.nl/BWBR0020646/2008-10-11#Artikel9
  - number: 9.1.b
    text: |-
      het aantal inburgeraars, niet zijnde geestelijke bedienaar, met wie in respectievelijk 2007, 2008 en 2009 een
      overeenkomst tot vaststelling van een gecombineerde inburgeringsvoorziening is gesloten;
    url: https://wetten.overheid.nl/BWBR0020646/2008-10-11#Artikel9
  - number: 9.1.c
    text: |-
      het aantal inburgeraars, tevens zijnde geestelijke bedienaar, met wie in respectievelijk 2007, 2008 en 2009 een
      overeenkomst tot vaststelling van een inburgeringsvoorziening is gesloten;
    url: https://wetten.overheid.nl/BWBR0020646/2008-10-11#Artikel9
  - number: 9.1.d
    text: |-
      het aantal in onderdeel a bedoelde inburgeraars dat uiterlijk respectievelijk 31 december 2009, 31 december 2010 en
      31 december 2011 heeft deelgenomen aan het inburgeringsexamen of het staatsexamen;
    url: https://wetten.overheid.nl/BWBR0020646/2008-10-11#Artikel9
  - number: 9.1.e
    text: |-
      het aantal in onderdeel b bedoelde inburgeraars dat uiterlijk respectievelijk 31 december 2009, 31 december 2010 en
      31 december 2011 heeft deelgenomen aan het inburgeringsexamen of het staatsexamen;
    url: https://wetten.overheid.nl/BWBR0020646/2008-10-11#Artikel9
  - number: 9.1.f
    text: |-
      het aantal in onderdeel c bedoelde inburgeraars dat uiterlijk respectievelijk 31 december 2009, 31 december 2010 en
      31 december 2011 heeft deelgenomen aan het inburgeringsexamen of het staatsexamen;
    url: https://wetten.overheid.nl/BWBR0020646/2008-10-11#Artikel9
  - number: 9.1.g
    text: |-
      het aantal in onderdeel c bedoelde inburgeraars dat uiterlijk respectievelijk 31 december 2009, 31 december 2010 en
      31 december 2011 heeft deelgenomen aan het aanvullend praktijkdeel, bedoeld in [artikel 3.8 van het besluit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3
    url: https://wetten.overheid.nl/BWBR0020646/2008-10-11#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '3'
  - number: 9.1.h
    text: |-
      het aantal inburgeraars met wie in respectievelijk 2008 en 2009 een overeenkomst tot vaststelling van een duale
      inburgeringsvoorziening is gesloten;
    url: https://wetten.overheid.nl/BWBR0020646/2008-10-11#Artikel9
  - number: 9.1.i
    text: |-
      het aantal inburgeraars, niet zijnde geestelijke bedienaar, met wie in respectievelijk 2008 en 2009 een
      overeenkomst tot vaststelling van een taalkennisvoorziening is gesloten.
    url: https://wetten.overheid.nl/BWBR0020646/2008-10-11#Artikel9
  - number: '9.2'
    text: |-
      Indien het college of het bestuur toepassing geeft aan [artikel 8, tweede lid][ref1], doet het college of het
      bestuur tevens een opgave van het daarmee gemoeide bedrag, alsmede het aantal opleidingen educatie, bedoeld in
      [artikel 8, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020646#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0020646#Artikel8
    url: https://wetten.overheid.nl/BWBR0020646/2008-10-11#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0020646
        artikel: '8'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0020646
        artikel: '8'
        hoofdstuk: '2'
  - number: '9.3'
    text: |-
      Het college of het bestuur verstrekt de gegevens en de opgave, bedoeld in het eerste lid,
      tezamen met de jaarrekening, bedoeld in [artikel 186 van de Gemeentewet][ref1], welke betrekking
      heeft op het jaar 2011. De jaarrekening is voorzien van de accountantsverklaring, bedoeld in
      [artikel 213, derde lid, van de Gemeentewet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel186
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel213
    url: https://wetten.overheid.nl/BWBR0020646/2008-10-11#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '186'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '213'
  - number: '9.4'
    text: |-
      Het college of het bestuur verstrekt de gegevens en het bedrag, bedoeld in het tweede lid,
      tezamen met de jaarrekening, bedoeld in [artikel 186 van de Gemeentewet][ref1], welke betrekking
      heeft op het jaar 2007. De jaarrekening is voorzien van de accountantsverklaring, bedoeld in
      [artikel 213, derde lid, van de Gemeentewet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel186
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel213
    url: https://wetten.overheid.nl/BWBR0020646/2008-10-11#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '186'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '213'
  - number: '9.5'
    text: |-
      Het college of het bestuur vergewist zich ervan dat de gegevens, bedoeld in het eerste lid, zijn opgenomen in het
      Informatiesysteem Inburgering.
    url: https://wetten.overheid.nl/BWBR0020646/2008-10-11#Artikel9
  - number: '11.1'
    text: |-
      De Minister stelt de financiële bijdrage vast aan de hand van de formule A – Q = [ ( B × C ) + ( D × E ) + ( F ×
      G ) + ( H × I ) + ( J × K ) + ( L × M ) + ( N × O ) + ( R × S ) + ( T × U )] × P waarin wordt voorgesteld: - met de
      letter A: de financiële bijdrage;
        - met de letter B: het aantal inburgeraars, niet zijnde geestelijke bedienaar, met wie in respectievelijk 2007,
      2008 en 2009 een overeenkomst tot vaststelling van een inburgeringsvoorziening is gesloten;
        - met de letter C: de bijdragevergoeding ten aanzien van de vaststelling van een inburgeringsvoorziening, bedoeld
      in letter B;
        - met de letter D: het aantal inburgeraars, niet zijnde geestelijke bedienaar, met wie in respectievelijk 2007,
      2008 en 2009 een overeenkomst tot vaststelling van een gecombineerde inburgeringsvoorziening is gesloten;
        - met de letter E: de bijdragevergoeding ten aanzien van de vaststelling van een gecombineerde
      inburgeringsvoorziening, bedoeld in letter D;
        - met de letter F: het aantal inburgeraars, tevens zijnde geestelijke bedienaar, met wie in respectievelijk 2007,
      2008 en 2009 een overeenkomst tot vaststelling van een inburgeringsvoorziening is gesloten;
        - met de letter G: de bijdragevergoeding ten aanzien van de vaststelling van een inburgeringsvoorziening, bedoeld
      in letter F;
        - met de letter H: het aantal in de letter B bedoelde inburgeraars dat uiterlijk respectievelijk 31 december 2009,
      31 december 2010, 31 december 2011 heeft deelgenomen aan het inburgeringsexamen of het staatsexamen;
        - met de letter I: de bijdragevergoeding ten aanzien van de deelname aan het inburgeringsexamen en het
      staatsexamen, bedoeld in letter H;
        - met de letter J: het aantal in de letter D bedoelde inburgeraars dat uiterlijk respectievelijk 31 december 2009,
      31 december 2010, 31 december 2011 heeft deelgenomen aan het inburgeringsexamen of het staatsexamen;
        - met de letter K: de bijdragevergoeding ten aanzien van de deelname aan het inburgeringsexamen en het
      staatsexamen, bedoeld in letter J;
        - met de letter L: het aantal in de letter F bedoelde inburgeraars dat uiterlijk respectievelijk 31 december 2009,
      31 december 2010, 31 december 2011 heeft deelgenomen aan het inburgeringsexamen of het staatsexamen;
        - met de letter M: de bijdragevergoeding ten aanzien van de deelname aan het inburgeringsexamen en het
      staatsexamen, bedoeld in letter L;
        - met de letter N: het aantal in de letter F bedoelde inburgeraars dat uiterlijk respectievelijk 31 december
      2009, 31 december 2010, 31 december 2011 heeft deelgenomen aan het aanvullend praktijkdeel, bedoeld in
      [artikel 3.8 van het Besluit][ref1];
        - met de letter O: de bijdragevergoeding ten aanzien van de deelname aan het aanvullend praktijkdeel, bedoeld in
      letter N;
        - met de letter P: de door de Minister vast te stellen correctiefactor;
        - met de letter Q: het bedrag, bedoeld in [artikel 9, tweede lid][ref2];
        - met de letter R: het aantal inburgeraars met wie in respectievelijk 2008 en 2009 een overeenkomst tot
      vaststelling van een duale inburgeringsvoorziening is gesloten;
        - met de letter S: de bijdragevergoeding ten aanzien van de vaststelling van een duale inburgeringsvoorziening,
      bedoeld in letter R;
        - met de letter T: het aantal inburgeraars, niet zijnde geestelijke bedienaar, met wie in respectievelijk 2008 en
      2009 een overeenkomst tot vaststelling van een taalkennisvoorziening is gesloten;
        - met de letter U: de bijdragevergoeding ten aanzien van de vaststelling van een taalkennisvoorziening, bedoeld in
      letter T.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020646#Artikel9
    url: https://wetten.overheid.nl/BWBR0020646/2008-10-11#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020646
        artikel: '9'
        hoofdstuk: '3'
  - number: '11.2'
    text: De Minister stelt de financiële bijdrage uiterlijk 1 oktober 2012 vast.
    url: https://wetten.overheid.nl/BWBR0020646/2008-10-11#Artikel11
  - number: '11.3'
    text: |-
      De vastgestelde financiële bijdrage wordt binnen zes maanden na de vaststelling ervan betaald onder verrekening van
      het verleende voorschot.
    url: https://wetten.overheid.nl/BWBR0020646/2008-10-11#Artikel11
  - number: '11.4'
    text: |-
      Indien het voorschot hoger is dan de vastgestelde financiële bijdrage, is de Minister bevoegd het verschil terug
      te vorderen.
    url: https://wetten.overheid.nl/BWBR0020646/2008-10-11#Artikel11
  - number: '12'
    text: Deze regeling treedt in werking met ingang van 1 januari 2007.
    url: https://wetten.overheid.nl/BWBR0020646/2008-10-11#Artikel12
  - number: '13'
    text: 'Deze regeling wordt aangehaald als: Regeling vrijwillige inburgering niet-G31 2007.'
    url: https://wetten.overheid.nl/BWBR0020646/2008-10-11#Artikel13
