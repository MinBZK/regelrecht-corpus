      inburgeringscursus: een cursus welke een inburgeraar in staat stelt mondelinge en schriftelijke vaardigheden in de
      Nederlandse taal en kennis van de Nederlandse samenleving te verwerven, teneinde het inburgeringsexamen te behalen;
    url: https://wetten.overheid.nl/BWBR0020646/2008-10-11#Artikel1
  - number: 1.q
    text: |-
      Informatiesysteem Inburgering: het Informatiesysteem Inburgering, bedoeld in [artikel 47 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel47
    url: https://wetten.overheid.nl/BWBR0020646/2008-10-11#Artikel1
    references:
