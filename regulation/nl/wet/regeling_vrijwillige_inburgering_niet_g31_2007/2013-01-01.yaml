preamble:
  text: |-
    Gelet op artikel 17, vijfde lid, van de Financiële-verhoudingswet en de artikelen 48r en 48s van de Wet Justitie-
    subsidies;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0020646/2013-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. Minister: de Minister van Sociale Zaken en Werkgelegenheid;

      b. wet: de [Wet inburgering][ref1], zoals deze luidde op 31 december 2012;

      c. besluit: het [Besluit inburgering][ref2], zoals dit luidde op 31 december 2012;

      d. college: het college van burgemeester en wethouders van een
      gemeente, niet zijnde een gemeente welke behoort tot de G31, bedoeld in
      [artikel 1, eerste lid, onderdeel b, van het Besluit brede doeluitkering sociaal, integratie en veiligheid][ref3];

      e. samenwerkingsverband: een centrumgemeente of een openbaar lichaam als bedoeld in
      [artikel 8 van de Wet gemeenschappelijke regelingen][ref4] waaraan de deelnemende gemeenten de hen ingevolge deze
      regeling toekomende rechten en de ingevolge deze regeling op hen rustende verplichtingen hebben overgedragen;

      f. bestuur: het bestuur van een openbaar lichaam als bedoeld in
      [artikel 8 van de Wet gemeenschappelijke regelingen][ref5];

      g. Nederlander: ieder die de Nederlandse nationaliteit bezit of op grond van een wettelijke bepaling als
      Nederlander moet worden behandeld;

      h. inburgeraar: de Nederlander, of de rechtmatig in Nederland verblijvende vreemdeling, bedoeld in
      [artikel 5, tweede lid, onderdeel a, van de wet][ref6], of het rechtmatig in Nederland verblijvende familielid
      van voornoemde vreemdeling, of de rechtmatige in Nederland verblijvende vreemdeling van een staat wiens onderdanen
      op grond van bepalingen van verdragen of besluiten van volkenrechtelijke organisaties geen inburgeringsplicht als
      bedoeld in [artikel 7 van de wet][ref7] kan worden opgelegd, en die.

      1°. ouder is dan 15 jaar;

      2°. minder dan acht jaren tijdens de leerplichtige leeftijd in Nederland heeft verbleven, en;

      3°. niet beschikt over een diploma, certificaat of document, bedoeld in [artikel 2.3 van het besluit][ref8];

      4°. niet leerplichtig of kwalificatieplichtig is, dan wel een opleiding volgt waarvan de afronding leidt tot
      uitreiking van een diploma, certificaat of document, bedoeld in [artikel 2.3 van het besluit][ref9];

      5°. geen overeenkomst heeft afgesloten op grond van de [Regeling inburgering allochtone vrouwen niet-G31][ref10],
      de [Regeling inburgering allochtone vrouwen G31][ref11], dan wel het extensieve deel van de Pilot inburgering
      allochtone vrouwen Taal Totaal;

      6°. niet eerder een overeenkomst heeft afgesloten op grond van de onderhavige regeling;

      i. geestelijke bedienaar: de persoon, bedoeld in [artikel 1, onderdeel g, van de wet][ref12];

      j. eigen bijdrage: de bijdrage, bedoeld in [artikel 23, tweede lid, van de wet][ref13];

      k. inburgeringsvoorziening: de inburgeringsvoorzieningen, bedoeld in
      [hoofdstuk 5, paragraaf 2, van de wet][ref14], de [Regeling inburgering allochtone vrouwen G31][ref15], de
      [Regeling inburgering allochtone vrouwen niet-G31][ref16] en het extensieve deel van de Pilot inburgering
      allochtone vrouwen Taal Totaal;

      l. gecombineerde inburgeringsvoorziening: een inburgeringsvoorziening, gecombineerd met een voorziening gericht op
      arbeidsinschakeling als bedoeld in [artikel 20, eerste lid, van de wet][ref17];

      m. inburgeringsexamen: het inburgeringsexamen, bedoeld in [hoofdstuk 4 van de wet][ref18];

      n. exameninstelling: de exameninstelling, bedoeld in [artikel 1, onderdeel i, van de wet][ref19];

      o. inburgeringscursus: een cursus welke een inburgeraar in staat stelt mondelinge en schriftelijke vaardigheden
      in de Nederlandse taal en kennis van de Nederlandse samenleving te verwerven, teneinde het inburgeringsexamen te
      behalen;

      p. Informatiesysteem Inburgering: het Informatiesysteem Inburgering, bedoeld in [artikel 47 van de wet][ref20];

      q. inburgeringsbedrijf: een natuurlijk persoon of rechtspersoon die in het kader van uitoefening van beroep of
      bedrijf de inburgering van personen in Nederland bevordert;

      r. persoonlijk inburgeringsbudget: een budget dat door het college of het bestuur, in het kader van een te sluiten
      overeenkomst met een inburgeringsbedrijf, ten behoeve van een inburgeraar ter beschikking wordt gesteld en met
      behulp waarvan de inburgeraar zijn inburgering op een individuele wijze vorm geeft;

      s. staatsexamen: het staatsexamen Nederlands als tweede taal I en II, bedoeld in
      [artikel 7.3.1, eerste lid, onderdeel c, van de Wet educatie en beroepsonderwijs][ref21];

      t. duale inburgeringsvoorziening: inburgeringsvoorziening die met het oog op de actieve deelname van de inburgeraar
      aan de Nederlandse samenleving mede voorziet in activiteiten die in samenhang, en ten minste voor een deel
      gelijktijdig, met het verwerven van mondelinge en schriftelijke vaardigheden in de Nederlandse taal en kennis van
      de Nederlandse samenleving worden uitgevoerd;

      u. taalkennisvoorziening: voorziening die is gericht op de verwerving van de kennis van de
      Nederlandse taal die noodzakelijk is voor het kunnen afronden van een beroepsopleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onderdelen a en b, van de Wet educatie en beroepsonderwijs][ref22].


