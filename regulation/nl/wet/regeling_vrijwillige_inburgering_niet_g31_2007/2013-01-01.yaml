  - number: '6'
    text: |-
      1 Indien de inburgeraar het inburgeringsexamen heeft behaald, ontvangt hij het inburgeringsdiploma.

      2 Het inburgeringsdiploma wordt uitgereikt door de Minister.
    url: https://wetten.overheid.nl/BWBR0020646/2013-01-01#Artikel6
  - number: '7'
    text: |-
      1 Het college of het bestuur, de exameninstellingen en de Minister verstrekken aan de beheerder van het
      Informatiesysteem Inburgering uit eigen beweging of op verzoek kosteloos alle gegevens die noodzakelijk zijn voor
      de uitvoering van de onderhavige regeling.

      2 De Minister verstrekt aan het college of het bestuur, uit eigen beweging of op verzoek alle gegevens die
      noodzakelijk zijn voor de uitvoering van de onderhavige regeling.

      3 In het Informatiesysteem Inburgering met betrekking tot inburgeraars opgenomen persoonsgegevens worden
      verwijderd:

      a. na verloop van twintig jaren, of

      b. indien de betrokken persoon is overleden.

      4 De termijn, bedoeld in het derde lid, onderdeel a, vangt aan op de dag waarop de gegevens in het
      Informatiesysteem Inburgering zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0020646/2013-01-01#Artikel7
  - number: '8'
    text: |-
      1 De inburgeraar die op 1 januari 2007 deelneemt aan een opleiding educatie als bedoeld in
      [artikel 7.3.1, eerste lid, onderdeel d, van de Wet educatie en beroepsonderwijs][ref1], blijft toegelaten tot
      deze opleiding.

      2 Het college of het bestuur kan de opleidingen educatie, bedoeld in het eerste lid, gedurende het jaar 2007
      bekostigen uit de financiële bijdrage, bedoeld in [artikel 2][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7.3.1
      [ref2]: https://wetten.overheid.nl/BWBR0020646#Artikel2
