  - number: '2'
    text: |-
      1 De Minister kan aan een gemeente of een samenwerkingsverband, onder de in deze regeling genoemde voorwaarden, een
      financiële bijdrage verlenen teneinde de gemeente of het samenwerkingsverband in staat te stellen inburgeraars deel
      te laten nemen aan:

      a. een inburgeringsvoorziening of een gecombineerde inburgeringsvoorziening en deze voorziening te laten afsluiten
      met het inburgeringsexamen of het staatsexamen, dan wel

      b. een taalkennisvoorziening, mits de inburgeraar een beroepsopleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onderdelen a en b, van de Wet educatie en beroepsonderwijs][ref1] volgt of gaat volgen.

      2 De financiële bijdrage wordt onder voorbehoud van autorisatie van de begrotingswetgever verleend en vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7.2.2
    url: https://wetten.overheid.nl/BWBR0020646/2013-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 7.2.2
  - number: '3'
    text: |-
      1 Ten behoeve van het jaar 2007 stelt de Minister ambtshalve een voorschot op de financiële bijdrage vast welke
      vóór 26 februari 2007 bekend wordt gemaakt.

      2 Ten behoeve van de jaren 2008 en 2009 maakt de Minister voor 15 september 2007, respectievelijk 15 september
      2008, een indicatief voorschot bekend.

      3 Het college dient voor 15 oktober 2007, respectievelijk 15 oktober 2008, een aanvraag in tot verlening van een
      financiële bijdrage.

      4 De Minister stelt de hoogte van het voorschot, bedoeld in het tweede lid, voor 1 december 2007, respectievelijk 1
      december 2008 vast.

      5 Voorschotten worden uiterlijk binnen zes maanden na de vaststelling ervan betaald.
    url: https://wetten.overheid.nl/BWBR0020646/2013-01-01#Artikel3
  - number: '4'
    text: |-
      1 Het college of het bestuur kan aan een inburgeraar een inburgeringsvoorziening of een gecombineerde
      inburgeringsvoorziening aanbieden die op de persoonlijke situatie van de inburgeraar is afgestemd. Indien de
      inburgeraar daarom verzoekt, kan de inburgeringsvoorziening of de inburgeringscomponent van de gecombineerde
      inburgeringsvoorziening worden aangeboden in de vorm van een persoonlijk inburgeringsbudget.

      2 In afwijking van het eerste lid kan het college of bestuur aan een inburgeraar, niet zijnde geestelijke
      bedienaar, een taalkennisvoorziening aanbieden. Indien de inburgeraar daarom verzoekt, kan de taalkennisvoorziening
      worden aangeboden in de vorm van een persoonlijk inburgeringsbudget.

      3 Zowel een inburgeringsvoorziening als een gecombineerde inburgeringsvoorziening bereidt voor op en leidt toe naar
      het inburgeringsexamen of het staatsexamen en omvat het eenmaal kosteloos afleggen van het desbetreffende examen.

      4 Het college of het bestuur draagt er zorg voor dat de inburgeringsvoorziening, dan wel de gecombineerde
      inburgeringsvoorziening, uiterlijk 31 december van het tweede kalenderjaar na het jaar waarin de voorziening is
      vastgesteld, wordt afgesloten door middel van deelname aan het inburgeringsexamen of het staatsexamen.

      5 De inburgeraar is de in [artikel 23, tweede lid, van de wet][ref1] bedoelde eigen bijdrage
      verschuldigd, tenzij hij op last van het college of bestuur, dan wel een andere instantie, genoemd in
      [artikel 21, tweede lid, van de wet][ref2], een gecombineerde inburgeringsvoorziening dient te volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel21
    url: https://wetten.overheid.nl/BWBR0020646/2013-01-01#Artikel4
