  - number: '9'
    text: |-
      1 Het college of het bestuur verstrekt de volgende prestatiegegevens:

      a. het aantal inburgeraars, niet zijnde geestelijke bedienaar, met wie in respectievelijk 2007, 2008 en 2009 een
      overeenkomst tot vaststelling van een inburgeringsvoorziening is gesloten;

      b. het aantal inburgeraars, niet zijnde geestelijke bedienaar, met wie in respectievelijk 2007, 2008 en 2009 een
      overeenkomst tot vaststelling van een gecombineerde inburgeringsvoorziening is gesloten;

      c. het aantal inburgeraars, tevens zijnde geestelijke bedienaar, met wie in respectievelijk 2007, 2008 en 2009 een
      overeenkomst tot vaststelling van een inburgeringsvoorziening is gesloten;

      d. het aantal in onderdeel a bedoelde inburgeraars dat uiterlijk respectievelijk 31 december 2009, 31 december 2010
      en 31 december 2011 heeft deelgenomen aan het inburgeringsexamen of het staatsexamen;

      e. het aantal in onderdeel b bedoelde inburgeraars dat uiterlijk respectievelijk 31 december 2009, 31 december 2010
      en 31 december 2011 heeft deelgenomen aan het inburgeringsexamen of het staatsexamen;

      f. het aantal in onderdeel c bedoelde inburgeraars dat uiterlijk respectievelijk 31 december 2009, 31 december 2010
      en 31 december 2011 heeft deelgenomen aan het inburgeringsexamen of het staatsexamen;

      g. het aantal in onderdeel c bedoelde inburgeraars dat uiterlijk respectievelijk 31 december 2009,
      31 december 2010 en 31 december 2011 heeft deelgenomen aan het aanvullend praktijkdeel, bedoeld in
      [artikel 3.8 van het besluit][ref1];

      h. het aantal inburgeraars met wie in respectievelijk 2008 en 2009 een overeenkomst tot vaststelling van een duale
      inburgeringsvoorziening is gesloten;

      i. het aantal inburgeraars, niet zijnde geestelijke bedienaar, met wie in respectievelijk 2008 en 2009 een
      overeenkomst tot vaststelling van een taalkennisvoorziening is gesloten.

      2 Indien het college of het bestuur toepassing geeft aan [artikel 8, tweede lid][ref2], doet het college of het
      bestuur tevens een opgave van het daarmee gemoeide bedrag, alsmede het aantal opleidingen educatie, bedoeld in
      [artikel 8, eerste lid][ref3].

      3 Het college of het bestuur verstrekt de gegevens en de opgave, bedoeld in het eerste lid,
      tezamen met de jaarrekening, bedoeld in [artikel 186 van de Gemeentewet][ref4], welke betrekking
      heeft op het jaar 2011. De jaarrekening is voorzien van de accountantsverklaring, bedoeld in
      [artikel 213, derde lid, van de Gemeentewet][ref5].

      4 Het college of het bestuur verstrekt de gegevens en het bedrag, bedoeld in het tweede lid,
      tezamen met de jaarrekening, bedoeld in [artikel 186 van de Gemeentewet][ref6], welke betrekking
      heeft op het jaar 2007. De jaarrekening is voorzien van de accountantsverklaring, bedoeld in
      [artikel 213, derde lid, van de Gemeentewet][ref7].

      5 Het college of het bestuur vergewist zich ervan dat de gegevens, bedoeld in het eerste lid, zijn opgenomen in het
      Informatiesysteem Inburgering.


