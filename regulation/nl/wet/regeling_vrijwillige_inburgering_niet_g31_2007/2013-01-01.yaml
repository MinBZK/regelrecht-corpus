        artikel: '21'
  - number: 4a
    text: |-
      1 Indien een inburgeraar in aanmerking wordt gebracht voor een inburgeringsvoorziening, een gecombineerde
      inburgeringsvoorziening dan wel een taalkennisvoorziening doet het college of het bestuur de inburgeraar terzake
      een aanbod.

      2 Indien het aanbod, bedoeld in het eerste lid, geheel of gedeeltelijk bestaat uit een persoonlijk
      inburgeringsbudget begeleidt het college of het bestuur de inburgeraar op diens verzoek bij de vormgeving van zijn
      inburgeringsprogramma en de keuze van een inburgeringsbedrijf. Het college of het bestuur beoordeelt het voorstel
      van de inburgeraar en sluit vervolgens een overeenkomst met het inburgeringsbedrijf.

      3 Indien een inburgeraar tevens geestelijke bedienaar is, wordt hem, onverminderd het bepaalde in het eerste en
      tweede lid, de cursus, bedoeld in [artikel 4.25 van de Regeling inburgering][ref1] aangeboden.


      [ref1]: https://wetten.overheid.nl/BWBR0020657#Artikel4.25
    url: https://wetten.overheid.nl/BWBR0020646/2013-01-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0020657
        artikel: '4.25'
  - number: '5'
    text: |-
      1 Tegelijkertijd met het doen van het aanbod, bedoeld in [artikel 4a, eerste lid][ref1], informeert het college
      of het bestuur de inburgeraar omtrent de hoofdlijnen van de met hem te sluiten overeenkomst terzake van de
      vaststelling van zijn inburgeringsvoorziening, gecombineerde inburgeringsvoorziening dan wel taalkennisvoorziening.

      2 Indien de inburgeraar het aanbod, bedoeld in [artikel 4a, eerste lid][ref2], aanvaardt, sluit het college of het
      bestuur de in het eerste lid bedoelde overeenkomst met de inburgeraar.

      3 De overeenkomst bevat ten minste een omschrijving van de inburgeringsvoorziening, de gecombineerde
      inburgeringsvoorziening dan wel de taalkennisvoorziening, alsmede een omschrijving van de rechten en verplichtingen
      van de inburgeraar ten aanzien van:

      a. indien van toepassing, de termijn waarbinnen de inburgeraar moet hebben deelgenomen aan het inburgeringsexamen
      dan wel het staatsexamen;

      b. de verschuldigdheid van de eigen bijdrage en de mogelijkheid van betaling in termijnen;

      c. de verlening van toestemming om de in de [bijlage bij artikel 6.1, tweede lid, van het besluit](onbekend)
      bedoelde (persoons)gegevens welke betrekking hebben op de inburgeraar, op te nemen in het Informatiesysteem
      Inburgering;

      d. de gevolgen van niet-nakoming van de overeenkomst.

      4 De overeenkomst wordt door partijen niet later ondertekend dan 31 december 2009.


      [ref1]: https://wetten.overheid.nl/BWBR0020646#Artikel4a
      [ref2]: https://wetten.overheid.nl/BWBR0020646#Artikel4a
