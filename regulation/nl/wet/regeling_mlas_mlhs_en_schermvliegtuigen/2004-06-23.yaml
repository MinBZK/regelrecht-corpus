  - number: 9a
    text: |-
      Ten behoeve van het tijdelijk gebruik in het Nederlandse luchtruim van in andere lidstaten van de European Civil
      Aviation Conference ingeschreven MLA’s, die niet voorzien zijn van een geldig bewijs van luchtwaardigheid als
      bedoeld in [artikel 3.8 van de Wet luchtvaart](onbekend), gelden de volgende voorschriften en beperkingen:

      a. door het bevoegde gezag van de desbetreffende lidstaat, die het bewijs van inschrijving heeft afgegeven, is
      tevens een bewijs afgegeven waaruit blijkt dat de uitoefening van de luchtvaart met het betrokken luchtvaartuig in
      die staat is toegestaan, en

      b. de door het bevoegd gezag vastgestelde voorwaarden voor en beperkingen van het gebruik van het luchtvaartuig
      worden nagekomen.
    url: https://wetten.overheid.nl/BWBR0015237/2004-06-23#Artikel9a
  - number: '10'
    text: |-
      1 De houder van een MLA, waarvoor een ontheffing als bedoeld in artikel 3.21 van de wet is verleend,
      welke nog geldig is op het tijdstip van inwerkingtreding van deze regeling, dient binnen zes weken na
      het tijdstip van inwerkingtreding van deze regeling een aanvraag tot verlening van een speciaal-BvL in.
      [Artikel 3, tweede lid][ref1], is van toepassing.

      2 Voor de behandeling van de aanvraag als bedoeld in het eerste lid is de aanvrager een vergoeding van € 0,-
      verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0015237#Artikel3
    url: https://wetten.overheid.nl/BWBR0015237/2004-06-23#Artikel10
