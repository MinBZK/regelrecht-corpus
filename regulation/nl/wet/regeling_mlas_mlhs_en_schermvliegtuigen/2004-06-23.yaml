  - number: '4'
    text: |-
      1 Voor het verlengen van de termijn van geldigheid van het speciaal-BvL wordt door de houder een aanvraag ingediend
      bij de minister door middel van een volledig ingevuld en ondertekend formulier, waarvan exemplaren kosteloos bij de
      minister verkrijgbaar zijn.

      2 De aanvraag wordt vergezeld van een verklaring van de houder waaruit blijkt dat:

      a. het MLA nog steeds in luchtwaardige toestand verkeert;

      b. wordt voldaan aan de van toepassing zijnde aanwijzingen, bedoeld in [artikel 2, tweede lid][ref1];

      c. eventuele wijzigingen zijn goedgekeurd door de ontwerper van het MLA;

      d. de minister heeft ingestemd met eventuele wijzigingen in de geluidsproductie; en

      e. het MLA is onderhouden conform de aanwijzingen van de ontwerper van het MLA.


      [ref1]: https://wetten.overheid.nl/BWBR0015237#Artikel2
    url: https://wetten.overheid.nl/BWBR0015237/2004-06-23#Artikel4
    references:
      - id: ref1
