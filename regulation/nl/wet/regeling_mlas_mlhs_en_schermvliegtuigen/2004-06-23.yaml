  - number: '7'
    text: |-
      1 Een MLA mag niet worden gebruikt

      a. indien de maximum startmassa 390 kg of minder bedraagt: binnen een afstand van 4 km van het
      luchtvaartreferentiepunt van een luchtvaartterrein waar geen plaatselijke luchtverkeersleidingsdienst is, dan wel
      binnen een plaatselijk luchtverkeersleidingsgebied, tenzij op het luchtvaartterrein het gebruik van MLA’s door de
      minister of de Minister van Defensie is toegestaan;

      b. boven vogelconcentratiegebieden, zoals deze zijn gepubliceerd in de luchtvaartgids;

      c. boven een concentratie van mensen;

      d. boven aaneengesloten bebouwing ingericht voor het verblijf van mensen;

      e. binnen een horizontale afstand van 1500 m tot de grens van een milieubeschermingsgebied, als bedoeld in
      [artikel 1.2 van de Wet milieubeheer][ref1], en boven dat gebied; en

      f. voor het verrichten van luchtwerk.

      2 In afwijking van het eerste lid, onderdeel f, is het toegestaan zeilvliegtuigen te slepen met een MLA,
      dat is voorzien van een sleepinrichting, die is geaccepteerd door een luchtvaartautoriteit van één der in
      [artikel 2, eerste lid][ref2], genoemde landen.

      3 Het is verboden tijdens de vlucht voorwerpen of stoffen uit het MLA te werpen dan wel te verwijderen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1.2
      [ref2]: https://wetten.overheid.nl/BWBR0015237#Artikel2
    url: https://wetten.overheid.nl/BWBR0015237/2004-06-23#Artikel7
