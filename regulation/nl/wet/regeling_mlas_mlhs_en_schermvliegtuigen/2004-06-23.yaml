  - number: '3'
    text: |-
      1 Een speciaal-BvL wordt aangevraagd door indiening bij de minister van een volledig ingevuld en ondertekend
      formulier waarvan exemplaren kosteloos bij de minister zijn te verkrijgen.

      2 Voor de behandeling van de aanvraag van een speciaal-BvL worden de volgende bescheiden overgelegd:

      a. een document, afgegeven door de luchtvaartautoriteit van het desbetreffende land,
      waaruit blijkt dat het desbetreffende type en configuratie MLA voldoet aan de in
      [artikel 2, eerste lid, onderdeel a, b respectievelijk c][ref1] genoemde luchtwaardigheidseisen;

      b. een verklaring van de houder waaruit blijkt dat wordt voldaan aan de van toepassing zijnde aanwijzingen als
      bedoeld in [artikel 2, tweede lid][ref2];

      c. een vlieghandboek of gebruiksaanwijzing van de fabrikant van het MLA;

      d. een verklaring van de houder, waarin deze verklaart dat de configuratie van het MLA identiek is aan de
      goedgekeurde configuratie;

      e. een geluidmeetrapport, opgesteld door of namens één der in [artikel 2, derde lid][ref3], bedoelde autoriteiten
      dan wel door een door de minister erkende of geaccepteerde organisatie, waaruit blijkt dat aan de in dat lid
      genoemde eisen wordt voldaan;

      f. een uittreksel uit het geluidmeetrapport van de goedgekeurde configuratie; en

      g. een verklaring overeenkomstig de bij deze regeling behorende [bijlage 2][ref4], in tweevoud, van een door de
      minister erkende of geaccepteerde organisatie of persoon, dat het betreffende MLA voor wat betreft de voor de
      geluidsproductie van belang zijnde aspecten overeenstemt met het MLA waaraan de geluidsmetingen zijn uitgevoerd.

      3 Het model van het speciaal-BvL is opgenomen in de bij deze regeling behorende [bijlage 3][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0015237#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0015237#Artikel2
