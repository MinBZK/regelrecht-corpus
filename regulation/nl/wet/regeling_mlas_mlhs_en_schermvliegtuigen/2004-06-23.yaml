  - number: '8'
    text: |-
      1 Onverminderd [artikel 7][ref1] mogen met MLA’s slechts vluchten worden uitgevoerd:

      a. met inachtneming van de blijkens het vlieghandboek van de fabrikant op het luchtvaartuig betrekking hebbende
      gebruiksbeperkingen;

      b. gedurende de daglichtperioden als bedoeld in [artikel 1, onder e, van het Luchtverkeersreglement][ref2];

      c. indien met betrekking tot het MLA een verzekering is gesloten tegen de burgerrechtelijke aansprakelijkheid voor
      dood of letsel van de inzittenden van het MLA en dood of letsel van derden of schade toegebracht aan derden op
      het aardoppervlak.

      2 Onverminderd [artikel 7][ref3] mogen met MLA’s met een maximum startmassa van 390 kg of minder slechts vluchten
      worden uitgevoerd:

      a. van en naar terreinen waarvoor op grond van [artikel 14, tweede lid, onder b, van de Luchtvaartwet][ref4]
      ontheffing is verleend van de verbodsbepalingen als bedoeld in [artikel 14, eerste lid, van de Luchtvaartwet][ref5],
      indien de ontheffing uitdrukkelijk het gebruik van MLA’s toestaat;

      b. van en naar aangewezen burgerluchtvaartterreinen, waarop het gebruik met MLA’s door of namens de minister
      uitdrukkelijk is toegestaan;

      c. van en naar aangewezen militaire luchtvaartterreinen waarop het gebruik met MLA’s door of namens de Minister van
      Defensie uitdrukkelijk is toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0015237#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005775#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0015237#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0002267#Artikel14
      [ref5]: https://wetten.overheid.nl/BWBR0002267#Artikel14
