  - number: '11'
    text: |-
      1 Voor een MLA, waarvoor op grond van [artikel 10, eerste lid][ref1], een speciaal-BvL is aangevraagd en dat niet
      voldoet aan de in [artikel 2, eerste lid][ref2], genoemde eis, wordt een speciaal-BvL slechts verleend en daarna
      verlengd tot uiterlijk drie jaar na het tijdstip van inwerkingtreding van deze regeling.

      2 Met een MLA als bedoeld in het eerste lid mogen slechts vluchten worden uitgevoerd met een mede-inzittende
      indien hetzij de gezagvoerder houder is van een bewijs van bevoegdheid om als gezagvoerder op te treden met
      de bevoegdverklaring recreatief vlieginstructeur (RFI) hetzij de mede-inzittende houder is van een bewijs van
      bevoegdheid voor recreatief vlieger voor vliegtuigen (RPL(A)).


      [ref1]: https://wetten.overheid.nl/BWBR0015237#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0015237#Artikel2
    url: https://wetten.overheid.nl/BWBR0015237/2004-06-23#Artikel11
