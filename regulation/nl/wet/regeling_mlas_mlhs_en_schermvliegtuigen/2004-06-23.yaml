  - number: '12'
    text: |-
      1 Geluidmeetrapporten, die zijn opgemaakt voor het tijdstip van inwerkingtreding van deze regeling en waaruit
      blijkt, dat de geluidsproductie van het desbetreffende MLA niet meer bedraagt dan 60 dB(A), worden aangemerkt als
      geluidmeetrapporten als bedoeld in [artikel 3, tweede lid, onder e][ref1].

      2 Houders van een in Nederland geregistreerd MLA, waarvoor geen geluidmeetrapport als bedoeld in
      [artikel 3, tweede lid, onder e][ref2], is opgemaakt, dan wel waarvoor een geluidmeetrapport is opgemaakt, dat niet
      voldoet aan het eerste lid, dienen uiterlijk 2 april 2005 een uittreksel van een geluidmeetrapport als bedoeld in
      [artikel 3, tweede lid, onder f][ref3], bij de minister ter acceptatie in.

      3 Indien niet binnen de in het tweede lid gestelde termijn een uittreksel als in dat lid bedoeld is ingediend,
      vervalt het aan de houder verleende speciaal-BvL.


      [ref1]: https://wetten.overheid.nl/BWBR0015237#Artikel3
