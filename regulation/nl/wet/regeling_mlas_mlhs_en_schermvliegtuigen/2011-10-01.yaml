preamble:
  text: |-
    Gelet op de artikelen 1, vijfde lid, 17, 22, 44, tweede lid, en 46 van het Besluit luchtwaardigheid en artikel 56
    van het Luchtverkeersreglement;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0015237/2011-10-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. *minister:* Minister van Verkeer en Waterstaat;

      b. *luchtwerk:* een activiteit waarbij het luchtvaartuig wordt gebruikt voor speciale diensten.
    url: https://wetten.overheid.nl/BWBR0015237/2011-10-01#Artikel1
  - number: 1a
    text: |-
      Deze regeling berust op de [artikelen 2, vierde lid][ref1], [9][ref2], en
      [13, aanhef en onderdelen a, b en c, van het Besluit luchtvaartuigen 2008][ref3] en
      [artikel 56 van het Luchtverkeersreglement][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0023922#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0023922#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0023922#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0005775#Artikel56
    url: https://wetten.overheid.nl/BWBR0015237/2011-10-01#Artikel1a
