  - number: '7'
    text: |-
      Het is verboden met een MLA luchtwerk te verrichten, met uitzondering van het slepen van een zeilvliegtuig, als
      bedoeld in [artikel 1, eerste lid, van het Besluit bewijzen van bevoegdheid voor de luchtvaart][ref1], met een
      MLA, dat is voorzien van een sleepinrichting, die is geaccepteerd door een luchtvaartautoriteit van één der in
      [artikel 2, eerste lid][ref2], genoemde landen.


      [ref1]: https://wetten.overheid.nl/BWBR0010629#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0015237#Artikel2
    url: https://wetten.overheid.nl/BWBR0015237/2011-10-01#Artikel7
    references:
      - id: ref1
