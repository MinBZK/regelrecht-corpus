        artikel: '1'
      - id: ref2
        bwb_id: BWBR0015237
        artikel: '2'
        hoofdstuk: II
  - number: '8'
    text: |-
      Onverminderd [artikel 7][ref1] mogen met MLA’s slechts vluchten worden uitgevoerd:

      a. met inachtneming van de blijkens het vlieghandboek van de fabrikant op het luchtvaartuig betrekking hebbende
      gebruiksbeperkingen;

      b. gedurende de daglichtperiode als bedoeld in [artikel 1 van het Luchtverkeersreglement][ref2];

      c. indien met betrekking tot het MLA een verzekering is gesloten tegen de burgerrechtelijke aansprakelijkheid voor
      dood of letsel van de inzittenden van het MLA en dood of letsel van derden of schade toegebracht aan derden op
      het aardoppervlak.


      [ref1]: https://wetten.overheid.nl/BWBR0015237#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005775#Artikel1
    url: https://wetten.overheid.nl/BWBR0015237/2011-10-01#Artikel8
    references:
