        artikel: '56'
  - number: '2'
    text: |-
      1 MLA's voldoen aan een veiligheidsniveau, dat gelijkwaardig is aan de luchtwaardigheidseisen, zoals die zijn
      vastgesteld in een van de navolgende landen overeenkomstig de daarbij genoemde luchtwaardigheidseisen:

      a. Duitsland, de eisen, bedoeld in de Lufttüchtigkeitsforderungen für schwerkraftgesteuerte Ultraleichtflugzeuge of
      in de Lufttüchtigkeitsforderungen für dreiachsgesteuerte Ultraleicht-Flugzeuge;

      b. Groot-Brittannië, de eisen, bedoeld in de British civil airworthiness requirements, CAP 482, Section S; of

      c. Tsjechië, de eisen, bedoeld in de Tsjechische luchtwaardigheidscode, vastgesteld onder nummer 869/91-220.

      De onder a, b en c genoemde eisen zijn als [bijlage A][ref1], [B][ref2] respectievelijk [C][ref3] bij deze
      regeling gevoegd.

      2 MLA's voldoen voorts aan de aanwijzingen, afgegeven door de luchtvaartautoriteit van het in het eerste lid
      genoemde land aan welks luchtwaardigheidseisen het desbetreffende MLA voldoet, alsmede aan de door de minister
      afgegeven aanwijzingen.

      3 Indien een MLA is voorzien van in Duitsland voorgeschreven reddingsapparatuur, voldoet deze apparatuur aan de
      Lufttüchtigkeitsforderungen für Rettungsgeräte für Ultraleicht-Flugzeuge.

      4 De geluidsproductie van de door de luchtvaartautoriteit van één der in het eerste lid genoemde landen
      goedgekeurde configuratie bedraagt niet meer dan 60 dB(A) gemeten volgens de in de bij deze regeling behorende
      [bijlage 1][ref4] beschreven procedure.


      [ref1]: https://wetten.overheid.nl/BWBR0015237
      [ref2]: https://wetten.overheid.nl/BWBR0015237
      [ref3]: https://wetten.overheid.nl/BWBR0015237
      [ref4]: https://wetten.overheid.nl/BWBR0015237
