  - number: '5'
    text: |-
      1 Wijzigingen, die op grond van de bij deze regeling behorende [bijlage 4][ref1] van invloed zijn op de
      geluidsproductie van het MLA, behoeven de instemming van de minister.

      2 De aanvraag voor het verkrijgen van instemming met de wijziging van het MLA wordt in tweevoud ingediend bij de
      minister, middels een volledig ingevuld en ondertekend formulier, waarvan exemplaren kosteloos bij de minister te
      verkrijgen zijn.

      Bij de aanvraag worden de voor de beoordeling noodzakelijke gegevens gevoegd.

      3 Een inspectie van het ontwerp kan onderdeel uitmaken van de beoordelingsprocedure.

      4 De aanvraag wordt tenminste vier weken voor de gewenste datum van verkrijging van instemming ingediend.

      5 Indien naar het oordeel van de minister door de wijziging van het MLA niet meer met het ten
      aanzien van dat MLA afgegeven geluidmeetrapport volstaan kan worden, dient door of namens één der in
      [artikel 3, tweede lid, onder a][ref2], genoemde autoriteiten dan wel door een door de minister erkende of
      geaccepteerde organisatie een nieuw geluidmeetrapport opgesteld te worden en aan de minister toegezonden te worden
      tezamen met een verklaring als bedoeld in [artikel 3, tweede lid, onder g][ref3].

      6 Indien het vijfde lid toepassing vindt, wordt de instemming eerst verleend, nadat de in
      [artikel 3, tweede lid, onderdeel g][ref4], bedoelde verklaring, die op het tijdstip van indiening van de in het
      tweede lid bedoelde aanvraag geldig was, bij de minister is ingeleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0015237
      [ref2]: https://wetten.overheid.nl/BWBR0015237#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0015237#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0015237#Artikel3
