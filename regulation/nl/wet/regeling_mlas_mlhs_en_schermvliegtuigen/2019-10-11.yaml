  - number: '2'
    text: |-
      1 Een speciaal-BvL wordt aangevraagd door indiening bij de minister van een volledig ingevuld en ondertekend
      formulier waarvan exemplaren kosteloos bij de minister zijn te verkrijgen.

      2 Aan de houder van een MLA, MLH, lichte gyrokopter of gemotoriseerd schermvliegtuig wordt een speciaal-BvL
      afgegeven indien de volgende bescheiden worden overgelegd:

      a. een document, afgegeven door de luchtvaartautoriteiten van Duitsland, Groot-Brittannië of Tsjechië waaruit
      blijkt dat het desbetreffende type en configuratie MLA, MLH, lichte gyrokopter of gemotoriseerd schermvliegtuig
      voldoet aan de desbetreffende luchtwaardigheideisen zoals die zijn vastgesteld in één van de genoemde landen;

      b. een verklaring van de houder waaruit blijkt dat wordt voldaan aan de aanwijzingen, afgegeven door de
      luchtvaartautoriteit van het in onderdeel a genoemde land aan wiens luchtwaardigheidseisen de desbetreffende MLA,
      MLH, lichte gyrokopter of het desbetreffende gemotoriseerde schermvliegtuig voldoet en aan de door de minister
      afgegeven aanwijzingen;

      c. een verklaring van de houder, waarin deze verklaart dat de configuratie MLA, MLH, lichte gyrokopter of
      gemotoriseerd schermvliegtuig identiek is aan de goedgekeurde configuratie;

      d. een uittreksel van het geluidmeetrapport, opgesteld door of namens één van de in onderdeel a bedoelde
      autoriteiten dan wel door een door de minister erkende of geaccepteerde organisatie, waaruit blijkt dat de
      geluidsproductie gemeten volgens de in de bij deze regeling behorende [bijlage 1][ref1] beschreven procedure:

      i. voor het desbetreffende type en configuratie MLA of gemotoriseerd schermvliegtuig niet meer dan 60 dB(A)
      bedraagt;

      ii. voor de desbetreffende type en configuratie MLH of lichte gyrokopter niet meer dan 68 dB(A) bedraagt; en

      e. een verklaring, in tweevoud, overeenkomstig de bij deze regeling behorende [bijlage 2][ref2] van een door
      de minister erkende of geaccepteerde organisatie of persoon, dat de desbetreffende MLA, MLH, lichte gyrokopter,
      of het desbetreffende gemotoriseerde schermvliegtuig voor wat betreft de voor de geluidsproductie van belang
      zijnde aspecten overeenstemt met de MLA, MLH, lichte gyrokopter, of het gemotoriseerde schermvliegtuig waaraan de
      geluidsmetingen zijn uitgevoerd.

      3 Indien een MLA of gemotoriseerd schermvliegtuig is voorzien van in Duitsland voorgeschreven reddingsapparatuur,
      voldoet deze apparatuur aan de in Duitsland daarvoor geldende luchtwaardigheidseisen.

      4 Het model van het speciaal-BvL is opgenomen in de bij deze regeling behorende [bijlage 3][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0015237
      [ref2]: https://wetten.overheid.nl/BWBR0015237
