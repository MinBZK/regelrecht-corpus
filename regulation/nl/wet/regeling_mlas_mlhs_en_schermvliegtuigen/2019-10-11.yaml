  - number: '4'
    text: |-
      1 Voor het verlengen van de termijn van geldigheid van het speciaal-BvL wordt door de houder een aanvraag ingediend
      bij de minister door middel van een volledig ingevuld en ondertekend formulier, waarvan exemplaren kosteloos bij de
      minister verkrijgbaar zijn.

      2 De aanvraag wordt vergezeld van een verklaring van de houder waaruit blijkt dat:

      a. de MLA, MLH, lichte gyrokopter of het gemotoriseerde schermvliegtuig nog steeds in luchtwaardige toestand
      verkeert;

      b. wordt voldaan aan de van toepassing zijnde aanwijzingen, bedoeld in [artikel 2, tweede lid, onderdeel b][ref1];

      c. eventuele wijzigingen zijn goedgekeurd door de ontwerper van de MLA, MLH, lichte gyrokopter of het
      gemotoriseerde schermvliegtuig dan wel zijn uitgevoerd conform de voorschriften opgenomen in CS-STAN;

      d. de minister heeft ingestemd met eventuele wijzigingen in de geluidsproductie; en

      e. de MLA, MLH, lichte gyrokopter of het gemotoriseerde schermvliegtuig is onderhouden conform de aanwijzingen van
      de ontwerper van de MLA, MLH, lichte gyrokopter of het gemotoriseerde schermvliegtuig.

      3 De verklaring, bedoeld in het tweede lid, is mede ondertekend door de houder van:

      a. een bewijs van bevoegdheid als bedoeld in [artikel 2.2.][ref2] of
      [artikel 3.2., vijfde lid, van de Regeling bijzondere bevoegdverklaringen luchtwaardigheid][ref3], of

      b. een door de Deutsche Aero Club e.V. of de Deutsche Ultraleichtflugverbandes e.V. afgegeven Erlaubnis für Prüfer
      von Luftfahrtgerät, Klasse 5.

      4 Het derde lid is niet van toepassing op schermvliegtuigen als bedoeld in
      [artikel 1, eerste lid, van het Besluit bewijzen van bevoegheid voor de luchtvaart][ref4], in combinatie met een
      motor.


