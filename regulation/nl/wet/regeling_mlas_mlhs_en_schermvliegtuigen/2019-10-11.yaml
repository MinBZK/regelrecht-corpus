  - number: '9'
    text: |-
      1 De gezagvoerder van een MLA, en voor zover van toepassing een MLH, lichte gyrokopter
      of gemotoriseerd schermvliegtuig is verplicht om tijdens de vlucht naast de in
      [artikel 5, onderdelen a tot en met g van de Regeling vluchtuitvoering][ref1] genoemde documenten het bewijs,
      dat een verzekering bedoeld in [artikel 8, onderdeel c][ref2], is gesloten, een afschrift van deze regeling met
      uitzondering van de [bijlagen][ref3] en de verklaring als bedoeld in [artikel 2, tweede lid, onderdeel e][ref4],
      die door de minister is geaccepteerd, aan boord te hebben.

      2 De gezagvoerder informeert iedere passagier voorafgaand aan de vlucht dat de MLA, MLH, lichte gyrokopter of het
      schermvliegtuig niet is gecertificeerd volgens internationale luchtwaardigheidseisen.

      3 De houder van een MLA, MLH, lichte gyrokopter of gemotoriseerd schermvliegtuig is verplicht om in het
      luchtvaartuig op een voor elke inzittende zichtbare plaats duidelijk leesbaar de volgende waarschuwing aan te
      brengen:

      **Waarschuwing voor inzittenden**

      Dit luchtvaartuig is niet gecertificeerd volgens internationale luchtwaardigheidsvoorschriften. Het
      veiligheidsniveau is niet vastgesteld.

      **Occupant Warning**

      This aircraft has not been certificated to international standards. The safety level has not been determinated.


