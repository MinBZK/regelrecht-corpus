  - number: '5'
    text: |-
      1 Wijzigingen, die op grond van de bij deze regeling behorende [bijlage 4][ref1] van invloed zijn op de
      geluidsproductie van de MLA, MLH, lichte gyrokopter of het gemotoriseerde schermvliegtuig, behoeven de instemming
      van de minister.

      2 De aanvraag voor het verkrijgen van instemming met de wijziging van de MLA, MLH, lichte gyrokopter of het
      gemotoriseerde schermvliegtuig wordt in tweevoud ingediend bij de minister, middels een volledig ingevuld en
      ondertekend formulier, waarvan exemplaren kosteloos bij de minister te verkrijgen zijn.

      Bij de aanvraag worden de voor de beoordeling noodzakelijke gegevens gevoegd.

      3 Een inspectie van het ontwerp kan onderdeel uitmaken van de beoordelingsprocedure.

      4 De aanvraag wordt tenminste vier weken voor de gewenste datum van verkrijging van instemming ingediend.

      5 Indien naar het oordeel van de minister door de wijziging van de MLA, MLH, lichte gyrokopter of het
      gemotoriseerde schermvliegtuig niet meer met het ten aanzien van die MLA, MLH, lichte gyrokopter of dat
      gemotoriseerde schermvliegtuig afgegeven uittreksel van het geluidmeetrapport volstaan kan worden, dient door of
      namens één van de in [artikel 2, tweede lid, onder a][ref2], genoemde autoriteiten dan wel een door de minister
      erkende of geaccepteerde organisatie een nieuw uittreksel op basis van een nieuw geluidmeetrapport opgesteld te
      worden en aan de minister gezonden te worden tezamen met een verklaring als bedoeld in artikel 2, tweede lid, onder
      e.

      6 Indien het vijfde lid toepassing vindt, wordt de instemming eerst verleend, nadat de in
      [artikel 2, tweede lid, onderdeel e][ref3], bedoelde verklaring, die op het tijdstip van indiening van de in het
      tweede lid bedoelde aanvraag geldig was, bij de minister is ingeleverd.


