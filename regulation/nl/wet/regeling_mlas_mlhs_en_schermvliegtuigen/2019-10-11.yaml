---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_mlas_mlhs_en_schermvliegtuigen
regulatory_layer: WET
publication_date: '2020-06-18'
valid_from: '2019-10-11'
bwb_id: BWBR0015237
url: https://wetten.overheid.nl/BWBR0015237/2019-10-11
preamble:
  text: |-
    Gelet op de artikelen 1, vijfde lid, 17, 22, 44, tweede lid, en 46 van het Besluit luchtwaardigheid en artikel 56
    van het Luchtverkeersreglement;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0015237/2019-10-11#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder: - *CS-STAN:* door EASA geaccepteerde methoden en technieken om
      standaardwijzigingen en standaardreparaties uit te voeren en te documenteren (Certification Specifications Standard
      Changes and Standard Repairs);
        - *luchtwerk:* activiteit waarbij het luchtvaartuig wordt gebruikt voor speciale diensten;
        - *minister:* Minister van Infrastructuur en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0015237/2019-10-11#Artikel1
  - number: 1a
    text: |-
      Deze regeling berust op de [artikelen 2, vierde lid][ref1], [9][ref2], en
      [13, aanhef en onderdelen a, b en c, van het Besluit luchtvaartuigen 2008][ref3] en
      [artikel 7 van het Besluit vluchtuitvoering][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0023922#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0023922#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0023922#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0020111#Artikel7
    url: https://wetten.overheid.nl/BWBR0015237/2019-10-11#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0023922
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0023922
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0023922
        artikel: '13'
      - id: ref4
        bwb_id: BWBR0020111
        artikel: '7'
  - number: '2.1'
    text: |-
      Een speciaal-BvL wordt aangevraagd door indiening bij de minister van een volledig ingevuld en ondertekend
      formulier waarvan exemplaren kosteloos bij de minister zijn te verkrijgen.
    url: https://wetten.overheid.nl/BWBR0015237/2019-10-11#Artikel2
  - number: '2.2'
    text: |-
      Aan de houder van een MLA, MLH, lichte gyrokopter of gemotoriseerd schermvliegtuig wordt een speciaal-BvL afgegeven
      indien de volgende bescheiden worden overgelegd:
    url: https://wetten.overheid.nl/BWBR0015237/2019-10-11#Artikel2
  - number: 2.2.a
    text: |-
      een document, afgegeven door de luchtvaartautoriteiten van Duitsland, Groot-Brittannië of Tsjechië waaruit blijkt
      dat het desbetreffende type en configuratie MLA, MLH, lichte gyrokopter of gemotoriseerd schermvliegtuig voldoet
      aan de desbetreffende luchtwaardigheideisen zoals die zijn vastgesteld in één van de genoemde landen;
    url: https://wetten.overheid.nl/BWBR0015237/2019-10-11#Artikel2
  - number: 2.2.b
    text: |-
      een verklaring van de houder waaruit blijkt dat wordt voldaan aan de aanwijzingen, afgegeven door de
      luchtvaartautoriteit van het in onderdeel a genoemde land aan wiens luchtwaardigheidseisen de desbetreffende MLA,
      MLH, lichte gyrokopter of het desbetreffende gemotoriseerde schermvliegtuig voldoet en aan de door de minister
      afgegeven aanwijzingen;
    url: https://wetten.overheid.nl/BWBR0015237/2019-10-11#Artikel2
  - number: 2.2.c
    text: |-
      een verklaring van de houder, waarin deze verklaart dat de configuratie MLA, MLH, lichte gyrokopter of
      gemotoriseerd schermvliegtuig identiek is aan de goedgekeurde configuratie;
    url: https://wetten.overheid.nl/BWBR0015237/2019-10-11#Artikel2
  - number: 2.2.d
    text: |-
      een uittreksel van het geluidmeetrapport, opgesteld door of namens één van de in onderdeel a bedoelde autoriteiten
      dan wel door een door de minister erkende of geaccepteerde organisatie, waaruit blijkt dat de geluidsproductie
      gemeten volgens de in de bij deze regeling behorende [bijlage 1][ref1] beschreven procedure:


      [ref1]: https://wetten.overheid.nl/BWBR0015237
    url: https://wetten.overheid.nl/BWBR0015237/2019-10-11#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0015237
  - number: 2.2.d.i
    text: voor het desbetreffende type en configuratie MLA of gemotoriseerd schermvliegtuig niet meer dan 60 dB(A) bedraagt;
    url: https://wetten.overheid.nl/BWBR0015237/2019-10-11#Artikel2
  - number: 2.2.d.ii
    text: voor de desbetreffende type en configuratie MLH of lichte gyrokopter niet meer dan 68 dB(A) bedraagt; en
    url: https://wetten.overheid.nl/BWBR0015237/2019-10-11#Artikel2
  - number: 2.2.e
    text: |-
      een verklaring, in tweevoud, overeenkomstig de bij deze regeling behorende [bijlage 2][ref1] van een door de
      minister erkende of geaccepteerde organisatie of persoon, dat de desbetreffende MLA, MLH, lichte gyrokopter,
      of het desbetreffende gemotoriseerde schermvliegtuig voor wat betreft de voor de geluidsproductie van belang
      zijnde aspecten overeenstemt met de MLA, MLH, lichte gyrokopter, of het gemotoriseerde schermvliegtuig waaraan de
      geluidsmetingen zijn uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0015237
    url: https://wetten.overheid.nl/BWBR0015237/2019-10-11#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0015237
  - number: '2.3'
    text: |-
      Indien een MLA of gemotoriseerd schermvliegtuig is voorzien van in Duitsland voorgeschreven reddingsapparatuur,
      voldoet deze apparatuur aan de in Duitsland daarvoor geldende luchtwaardigheidseisen.
    url: https://wetten.overheid.nl/BWBR0015237/2019-10-11#Artikel2
  - number: '2.4'
    text: |-
      Het model van het speciaal-BvL is opgenomen in de bij deze regeling behorende [bijlage 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015237
    url: https://wetten.overheid.nl/BWBR0015237/2019-10-11#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0015237
  - number: '4.1'
    text: |-
      Voor het verlengen van de termijn van geldigheid van het speciaal-BvL wordt door de houder een aanvraag ingediend
      bij de minister door middel van een volledig ingevuld en ondertekend formulier, waarvan exemplaren kosteloos bij de
      minister verkrijgbaar zijn.
    url: https://wetten.overheid.nl/BWBR0015237/2019-10-11#Artikel4
  - number: '4.2'
    text: 'De aanvraag wordt vergezeld van een verklaring van de houder waaruit blijkt dat:'
    url: https://wetten.overheid.nl/BWBR0015237/2019-10-11#Artikel4
  - number: 4.2.a
    text: de MLA, MLH, lichte gyrokopter of het gemotoriseerde schermvliegtuig nog steeds in luchtwaardige toestand verkeert;
    url: https://wetten.overheid.nl/BWBR0015237/2019-10-11#Artikel4
  - number: 4.2.b
    text: |-
      wordt voldaan aan de van toepassing zijnde aanwijzingen, bedoeld in [artikel 2, tweede lid, onderdeel b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015237#Artikel2
    url: https://wetten.overheid.nl/BWBR0015237/2019-10-11#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0015237
        artikel: '2'
        hoofdstuk: II
  - number: 4.2.c
    text: |-
      eventuele wijzigingen zijn goedgekeurd door de ontwerper van de MLA, MLH, lichte gyrokopter of het gemotoriseerde
      schermvliegtuig dan wel zijn uitgevoerd conform de voorschriften opgenomen in CS-STAN;
    url: https://wetten.overheid.nl/BWBR0015237/2019-10-11#Artikel4
  - number: 4.2.d
    text: de minister heeft ingestemd met eventuele wijzigingen in de geluidsproductie; en
    url: https://wetten.overheid.nl/BWBR0015237/2019-10-11#Artikel4
  - number: 4.2.e
    text: |-
      de MLA, MLH, lichte gyrokopter of het gemotoriseerde schermvliegtuig is onderhouden conform de aanwijzingen van de
      ontwerper van de MLA, MLH, lichte gyrokopter of het gemotoriseerde schermvliegtuig.
    url: https://wetten.overheid.nl/BWBR0015237/2019-10-11#Artikel4
  - number: '4.3'
    text: 'De verklaring, bedoeld in het tweede lid, is mede ondertekend door de houder van:'
    url: https://wetten.overheid.nl/BWBR0015237/2019-10-11#Artikel4
  - number: 4.3.a
    text: |-
      een bewijs van bevoegdheid als bedoeld in [artikel 2.2.][ref1] of
      [artikel 3.2., vijfde lid, van de Regeling bijzondere bevoegdverklaringen luchtwaardigheid][ref2], of


      [ref1]: https://wetten.overheid.nl/BWBR0038065#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0038065#Artikel3
    url: https://wetten.overheid.nl/BWBR0015237/2019-10-11#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0038065
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0038065
        artikel: '3'
  - number: 4.3.b
    text: |-
      een door de Deutsche Aero Club e.V. of de Deutsche Ultraleichtflugverbandes e.V. afgegeven Erlaubnis für Prüfer von
      Luftfahrtgerät, Klasse 5.
    url: https://wetten.overheid.nl/BWBR0015237/2019-10-11#Artikel4
  - number: '4.4'
    text: |-
      Het derde lid is niet van toepassing op schermvliegtuigen als bedoeld in
      [artikel 1, eerste lid, van het Besluit bewijzen van bevoegheid voor de luchtvaart][ref1], in combinatie met een
      motor.


      [ref1]: https://wetten.overheid.nl/BWBR0010629#Artikel1
    url: https://wetten.overheid.nl/BWBR0015237/2019-10-11#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0010629
        artikel: '1'
  - number: '5.1'
    text: |-
      Wijzigingen, die op grond van de bij deze regeling behorende [bijlage 4][ref1] van invloed zijn op de
      geluidsproductie van de MLA, MLH, lichte gyrokopter of het gemotoriseerde schermvliegtuig, behoeven de instemming
      van de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0015237
    url: https://wetten.overheid.nl/BWBR0015237/2019-10-11#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0015237
  - number: '5.2'
    text: |-
      De aanvraag voor het verkrijgen van instemming met de wijziging van de MLA, MLH, lichte gyrokopter of het
      gemotoriseerde schermvliegtuig wordt in tweevoud ingediend bij de minister, middels een volledig ingevuld en
      ondertekend formulier, waarvan exemplaren kosteloos bij de minister te verkrijgen zijn. Bij de aanvraag worden de
      voor de beoordeling noodzakelijke gegevens gevoegd.
    url: https://wetten.overheid.nl/BWBR0015237/2019-10-11#Artikel5
  - number: '5.3'
    text: Een inspectie van het ontwerp kan onderdeel uitmaken van de beoordelingsprocedure.
    url: https://wetten.overheid.nl/BWBR0015237/2019-10-11#Artikel5
  - number: '5.4'
    text: De aanvraag wordt tenminste vier weken voor de gewenste datum van verkrijging van instemming ingediend.
    url: https://wetten.overheid.nl/BWBR0015237/2019-10-11#Artikel5
  - number: '5.5'
    text: |-
      Indien naar het oordeel van de minister door de wijziging van de MLA, MLH, lichte gyrokopter of het gemotoriseerde
      schermvliegtuig niet meer met het ten aanzien van die MLA, MLH, lichte gyrokopter of dat gemotoriseerde
      schermvliegtuig afgegeven uittreksel van het geluidmeetrapport volstaan kan worden, dient door of namens één
      van de in [artikel 2, tweede lid, onder a][ref1], genoemde autoriteiten dan wel een door de minister erkende of
      geaccepteerde organisatie een nieuw uittreksel op basis van een nieuw geluidmeetrapport opgesteld te worden en aan
      de minister gezonden te worden tezamen met een verklaring als bedoeld in artikel 2, tweede lid, onder e.


      [ref1]: https://wetten.overheid.nl/BWBR0015237#Artikel2
    url: https://wetten.overheid.nl/BWBR0015237/2019-10-11#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0015237
        artikel: '2'
        hoofdstuk: II
  - number: '5.6'
    text: |-
      Indien het vijfde lid toepassing vindt, wordt de instemming eerst verleend, nadat de in
      [artikel 2, tweede lid, onderdeel e][ref1], bedoelde verklaring, die op het tijdstip van indiening van de in het
      tweede lid bedoelde aanvraag geldig was, bij de minister is ingeleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0015237#Artikel2
    url: https://wetten.overheid.nl/BWBR0015237/2019-10-11#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0015237
        artikel: '2'
        hoofdstuk: II
  - number: '7.1'
    text: 'Het is verboden:'
    url: https://wetten.overheid.nl/BWBR0015237/2019-10-11#Artikel7
  - number: 7.1.a
    text: 'met een MLA luchtwerk te verrichten, met uitzondering van:'
    url: https://wetten.overheid.nl/BWBR0015237/2019-10-11#Artikel7
  - number: 7.1.a.1°
    text: |-
      het slepen van een zeilvliegtuig, als bedoeld in
      [artikel 1, eerste lid, van het Besluit bewijzen van bevoegdheid voor de luchtvaart][ref1], met een MLA,
      dat is voorzien van een sleepinrichting, die is geaccepteerd door een luchtvaartautoriteit van één van de in
      [artikel 2, tweede lid, onderdeel a][ref2], genoemde landen, en


      [ref1]: https://wetten.overheid.nl/BWBR0010629#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0015237#Artikel2
    url: https://wetten.overheid.nl/BWBR0015237/2019-10-11#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0010629
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0015237
        artikel: '2'
        hoofdstuk: II
  - number: 7.1.a.2°
    text: |-
      het slepen van een zweefvliegtuig, als bedoeld in
      [artikel 1, eerste lid, van het Besluit bewijzen van bevoegdheid voor de luchtvaart][ref1], met een MLA, die
      is geaccepteerd door de luchtvaartautoriteit van Duitsland inzake luchtwaardigheidseisen voor het slepen van
      zweefvliegtuigen;


      [ref1]: https://wetten.overheid.nl/BWBR0010629#Artikel1
    url: https://wetten.overheid.nl/BWBR0015237/2019-10-11#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0010629
        artikel: '1'
  - number: 7.1.b
    text: met een MLH, lichte gyrokopter of gemotoriseerd schermvliegtuig luchtwerk te verrichten;
    url: https://wetten.overheid.nl/BWBR0015237/2019-10-11#Artikel7
  - number: 7.1.c
    text: |-
      een MLA, MLH, of lichte gyrokopter te gebruiken tegen vergoeding, met baat of voor commerciële doeleinden, met
      uitzondering van het gebruik voor instructie- en examenvluchten ter verkrijging, verlenging of vernieuwing van
      de bevoegdheid tot het vliegen met een MLA, MLH, of lichte gyrokopter als bedoeld in de Regeling bewijzen van
      bevoegdheid en bevoegdverklaringen voor luchtvarenden 2001;
    url: https://wetten.overheid.nl/BWBR0015237/2019-10-11#Artikel7
  - number: 7.1.d
    text: |-
      een gemotoriseerd schermvliegtuig te gebruiken tegen vergoeding, met baat of voor commerciële doeleinden, met
      uitzondering van het gebruik voor instructie- en examenvluchten.
    url: https://wetten.overheid.nl/BWBR0015237/2019-10-11#Artikel7
  - number: '8'
    text: |-
      Onverminderd [artikel 7][ref1] mogen met MLA’s, MLH’s, lichte gyrokopters en schermvliegtuigen slechts vluchten
      worden uitgevoerd:


      [ref1]: https://wetten.overheid.nl/BWBR0015237#Artikel7
    url: https://wetten.overheid.nl/BWBR0015237/2019-10-11#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0015237
        artikel: '7'
        hoofdstuk: III
  - number: 8.a
    text: |-
      met inachtneming van de blijkens het vlieghandboek van de fabrikant op het luchtvaartuig betrekking hebbende
      gebruiksbeperkingen;
    url: https://wetten.overheid.nl/BWBR0015237/2019-10-11#Artikel8
  - number: 8.b
    text: |-
      gedurende de daglichtperiode als bedoeld in [artikel 1 van het Besluit luchtverkeer 2014][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0035899#Artikel1
    url: https://wetten.overheid.nl/BWBR0015237/2019-10-11#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0035899
        artikel: '1'
  - number: 8.c
    text: |-
      indien met betrekking tot de MLA, MLH, lichte gyrokopter of het schermvliegtuig een verzekering is gesloten
      tegen de burgerrechtelijke aansprakelijkheid voor dood of letsel van de inzittenden of derden of andere schade
      toegebracht aan de inzittenden of derden.
    url: https://wetten.overheid.nl/BWBR0015237/2019-10-11#Artikel8
  - number: '9.1'
    text: |-
      De gezagvoerder van een MLA, en voor zover van toepassing een MLH, lichte gyrokopter
      of gemotoriseerd schermvliegtuig is verplicht om tijdens de vlucht naast de in
      [artikel 5, onderdelen a tot en met g van de Regeling vluchtuitvoering][ref1] genoemde documenten het bewijs,
      dat een verzekering bedoeld in [artikel 8, onderdeel c][ref2], is gesloten, een afschrift van deze regeling met
      uitzondering van de [bijlagen][ref3] en de verklaring als bedoeld in [artikel 2, tweede lid, onderdeel e][ref4],
      die door de minister is geaccepteerd, aan boord te hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0024167#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0015237#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0015237
      [ref4]: https://wetten.overheid.nl/BWBR0015237#Artikel2
    url: https://wetten.overheid.nl/BWBR0015237/2019-10-11#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0024167
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0015237
        artikel: '8'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0015237
      - id: ref4
        bwb_id: BWBR0015237
        artikel: '2'
        hoofdstuk: II
  - number: '9.2'
    text: |-
      De gezagvoerder informeert iedere passagier voorafgaand aan de vlucht dat de MLA, MLH, lichte gyrokopter of het
      schermvliegtuig niet is gecertificeerd volgens internationale luchtwaardigheidseisen.
    url: https://wetten.overheid.nl/BWBR0015237/2019-10-11#Artikel9
  - number: '9.3'
    text: |-
      De houder van een MLA, MLH, lichte gyrokopter of gemotoriseerd schermvliegtuig is verplicht om in het
      luchtvaartuig op een voor elke inzittende zichtbare plaats duidelijk leesbaar de volgende waarschuwing aan
      te brengen: **Waarschuwing voor inzittenden** Dit luchtvaartuig is niet gecertificeerd volgens internationale
      luchtwaardigheidsvoorschriften. Het veiligheidsniveau is niet vastgesteld. **Occupant Warning** This aircraft has
      not been certificated to international standards. The safety level has not been determinated.
    url: https://wetten.overheid.nl/BWBR0015237/2019-10-11#Artikel9
  - number: 9a
    text: |-
      Ten behoeve van het tijdelijk gebruik in het Nederlandse luchtruim van in andere lidstaten van de European Civil
      Aviation Conference ingeschreven MLA’s, MLH’s, lichte gyrokopters of schermvliegtuigen, die niet voorzien zijn van
      een geldig bewijs van luchtwaardigheid als bedoeld in [artikel 3.8 van de Wet luchtvaart][ref1], gelden de volgende
      voorschriften en beperkingen:


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0015237/2019-10-11#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
  - number: 9a.a
    text: |-
      door het bevoegde gezag van de desbetreffende lidstaat, die het bewijs van inschrijving heeft afgegeven, is tevens
      een bewijs afgegeven waaruit blijkt dat de uitoefening van de luchtvaart met het betrokken luchtvaartuig in die
      staat is toegestaan, en
    url: https://wetten.overheid.nl/BWBR0015237/2019-10-11#Artikel9a
  - number: 9a.b
    text: |-
      de door het bevoegd gezag vastgestelde voorwaarden voor en beperkingen van het gebruik van het luchtvaartuig worden
      nagekomen.
    url: https://wetten.overheid.nl/BWBR0015237/2019-10-11#Artikel9a
  - number: '13'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant, waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0015237/2019-10-11#Artikel13
  - number: '14'
    text: 'Deze regeling wordt aangehaald als: Regeling MLA’s, MLH’s en schermvliegtuigen.'
    url: https://wetten.overheid.nl/BWBR0015237/2019-10-11#Artikel14
