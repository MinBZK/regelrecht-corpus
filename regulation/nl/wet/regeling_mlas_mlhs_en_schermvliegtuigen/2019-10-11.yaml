  - number: '7'
    text: |-
      1 Het is verboden:

      a. met een MLA luchtwerk te verrichten, met uitzondering van:

      1°. het slepen van een zeilvliegtuig, als bedoeld in
      [artikel 1, eerste lid, van het Besluit bewijzen van bevoegdheid voor de luchtvaart][ref1], met een MLA,
      dat is voorzien van een sleepinrichting, die is geaccepteerd door een luchtvaartautoriteit van één van de in
      [artikel 2, tweede lid, onderdeel a][ref2], genoemde landen, en

      2°. het slepen van een zweefvliegtuig, als bedoeld in
      [artikel 1, eerste lid, van het Besluit bewijzen van bevoegdheid voor de luchtvaart][ref3], met een MLA, die
      is geaccepteerd door de luchtvaartautoriteit van Duitsland inzake luchtwaardigheidseisen voor het slepen van
      zweefvliegtuigen;

      b. met een MLH, lichte gyrokopter of gemotoriseerd schermvliegtuig luchtwerk te verrichten;

      c. een MLA, MLH, of lichte gyrokopter te gebruiken tegen vergoeding, met baat of voor commerciële doeleinden,
      met uitzondering van het gebruik voor instructie- en examenvluchten ter verkrijging, verlenging of vernieuwing
      van de bevoegdheid tot het vliegen met een MLA, MLH, of lichte gyrokopter als bedoeld in de Regeling bewijzen van
      bevoegdheid en bevoegdverklaringen voor luchtvarenden 2001;

      d. een gemotoriseerd schermvliegtuig te gebruiken tegen vergoeding, met baat of voor commerciële doeleinden, met
      uitzondering van het gebruik voor instructie- en examenvluchten.


      [ref1]: https://wetten.overheid.nl/BWBR0010629#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0015237#Artikel2
