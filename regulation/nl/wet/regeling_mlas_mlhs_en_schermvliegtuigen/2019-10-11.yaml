articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *CS-STAN:* door EASA geaccepteerde methoden en technieken om standaardwijzigingen en standaardreparaties uit te
      voeren en te documenteren (Certification Specifications Standard Changes and Standard Repairs);
        - *luchtwerk:* activiteit waarbij het luchtvaartuig wordt gebruikt voor speciale diensten;
        - *minister:* Minister van Infrastructuur en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0015237/2019-10-11#Artikel1
  - number: 1a
