  - number: '8'
    text: |-
      Onverminderd [artikel 7][ref1] mogen met MLA’s, MLH’s, lichte gyrokopters en schermvliegtuigen slechts vluchten
      worden uitgevoerd:

      a. met inachtneming van de blijkens het vlieghandboek van de fabrikant op het luchtvaartuig betrekking hebbende
      gebruiksbeperkingen;

      b. gedurende de daglichtperiode als bedoeld in [artikel 1 van het Besluit luchtverkeer 2014][ref2];

      c. indien met betrekking tot de MLA, MLH, lichte gyrokopter of het schermvliegtuig een verzekering is gesloten
      tegen de burgerrechtelijke aansprakelijkheid voor dood of letsel van de inzittenden of derden of andere schade
      toegebracht aan de inzittenden of derden.


      [ref1]: https://wetten.overheid.nl/BWBR0015237#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0035899#Artikel1
