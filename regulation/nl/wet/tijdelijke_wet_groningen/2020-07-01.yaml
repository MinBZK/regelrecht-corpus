---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: tijdelijke_wet_groningen
regulatory_layer: WET
publication_date: '2023-05-15'
valid_from: '2020-07-01'
bwb_id: BWBR0043252
url: https://wetten.overheid.nl/BWBR0043252/2020-07-01
preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de bestuursrechtelijke afhandeling van verzoeken om
    vergoeding van schade in verband met bodembeweging door de gaswinning uit het Groningenveld en gasopslag bij Norg
    wettelijk te regelen;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet wordt verstaan onder: - *exploitant:* exploitant van een mijnbouwwerk ten behoeve van het winnen van
      gas uit het Groningenveld of van de gasopslag te Norg;
        - *Instituut:* het Instituut Mijnbouwschade Groningen;
        - *Onze Minister:* Onze Minister van Economische Zaken en Klimaat;
        - *schade:* schade die is ontstaan door beweging van de bodem als gevolg van de aanleg of exploitatie van een
      mijnbouwwerk ten behoeve van het winnen van gas uit het Groningenveld of als gevolg van de gasopslag Norg.
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel1
  - number: '2.1'
    text: |-
      Er is een Instituut Mijnbouwschade Groningen. Het Instituut is gevestigd op een door Onze Minister te bepalen
      locatie.
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel2
  - number: '2.2'
    text: Het Instituut vervult zijn taken en bevoegdheden in onafhankelijkheid.
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel2
  - number: '2.3'
    text: 'Het Instituut:'
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel2
  - number: 2.3.a
    text: 'heeft tot taak en is bevoegd schade af te handelen en daartoe:'
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel2
  - number: 2.3.a.a
    text: |-
      aanvragen in behandeling te nemen, voor zover de aanvrager zijn vordering tot vergoeding van schade op de
      exploitant ter zake van de schade waarvoor vergoeding wordt aangevraagd aan de Staat heeft overgedragen;
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel2
  - number: 2.3.a.b
    text: de aanspraak op een vergoeding van schade vast te stellen, en
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel2
  - number: 2.3.a.c
    text: de omvang van de vergoeding van schade of de te treffen maatregelen in natura vast te stellen, en
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel2
  - number: 2.3.b
    text: |-
      heeft tot taak om schade te vergoeden en daartoe aan de aanvrager de vastgestelde vergoeding uit te keren of de
      vastgestelde maatregelen in natura uit te voeren.
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel2
  - number: '2.4'
    text: |-
      Het Instituut is niet bevoegd om een aanvraag om vergoeding van schade te behandelen indien deze schade betreft
      waarvoor:
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel2
  - number: 2.4.a
    text: |-
      voor 31 maart 2017, 12:00 uur een schademelding – of claim is voorgelegd aan het Centrum Veilig Wonen of de
      exploitant;
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel2
  - number: 2.4.b
    text: door de exploitant met de gedupeerde of diens vertegenwoordiger een vaststellingsovereenkomst is gesloten;
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel2
  - number: 2.4.c
    text: |-
      door de gedupeerde of diens vertegenwoordiger met de exploitant onderhandeld wordt met het doel te komen tot een
      vergoeding van de schade;
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel2
  - number: 2.4.d
    text: |-
      een vordering is ingesteld bij de burgerlijke rechter, tenzij de vordering bij de burgerlijke rechter met
      instemming van de gedaagde door de aanvrager wordt ingetrokken; of
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel2
  - number: 2.4.e
    text: de burgerlijke rechter uitspraak heeft gedaan over de aanspraak op en de omvang van de vergoeding van de schade.
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel2
  - number: '2.5'
    text: |-
      Het Instituut kan, indien bijzondere omstandigheden daartoe aanleiding geven, afwijken van het bepaalde in het
      vierde lid, onder a en b, ten einde onbillijkheden van overwegende aard te voorkomen.
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel2
  - number: '2.6'
    text: |-
      Het Instituut voert deze taken en bevoegdheden uit met toepassing
      van de bepalingen van het [Burgerlijk Wetboek][ref1], uitgezonderd
      [artikel 178, aanhef en onderdeel c, van Boek 6 van het Burgerlijk Wetboek][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005289
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel178
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005289
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '178'
  - number: '2.7'
    text: |-
      Indien de aanvrager in de aanvraag aangeeft dat er sprake is van een acuut onveilige situatie of het Instituut op
      basis van de aanvraag zelf het vermoeden heeft dat er sprake is van een acuut onveilige situatie:
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel2
  - number: 2.7.a
    text: |-
      inspecteert het Instituut de situatie onmiddellijk, maar in ieder geval binnen 48 uur na indiening van de aanvraag,
      en treft in overleg met de aanvrager de in het belang van de veiligheid noodzakelijke maatregelen, en
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel2
  - number: 2.7.b
    text: |-
      informeert het Instituut, ten behoeve van de toepassing van de [Woningwet][ref1] in het belang van de veiligheid,
      de betreffende burgemeester binnen 48 uur over het bestaan van de acuut onveilige situatie en de getroffen of te
      treffen maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005181
  - number: '2.8'
    text: |-
      Bij algemene maatregel van bestuur kunnen aan het Instituut andere taken en bevoegdheden worden opgedragen, die
      samenhangen met de taken en bevoegdheden, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel2
  - number: '3.1'
    text: |-
      Ten behoeve van de goede uitvoering van [artikel 2, derde en vierde lid][ref1], verwerkt het Instituut de nodige
      gegevens, waaronder persoonsgegevens. Het Instituut is verwerkingsverantwoordelijke voor deze verwerking.


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Artikel2
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0043252
        artikel: '2'
        hoofdstuk: '2'
  - number: '3.2'
    text: |-
      Ten behoeve van de goede uitwerking van [artikel 2, derde en vierde lid][ref1], verwerkt de exploitant de nodige
      gegevens, waaronder persoonsgegevens. De exploitant is verwerkingsverantwoordelijke voor deze verwerking.


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Artikel2
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0043252
        artikel: '2'
        hoofdstuk: '2'
  - number: '3.3'
    text: |-
      Gelet op artikel 9, tweede lid, onderdeel g, van de Algemene verordening gegevensbescherming is het verbod om
      gegevens over gezondheid te verwerken niet van toepassing indien de verwerking geschiedt door het Instituut of
      de exploitant voor zover deze verwerking noodzakelijk is in het belang van de goede uitvoering en uitwerking van
      [artikel 2, derde en vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Artikel2
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0043252
        artikel: '2'
        hoofdstuk: '2'
  - number: '3.4'
    text: |-
      Het Instituut en de exploitant verstrekken elkaar desgevraagd de informatie, waaronder begrepen de
      persoonsgegevens, bedoeld in het eerste, tweede en derde lid, voor zover die noodzakelijk is in het belang van de
      goede uitvoering van [artikel 2, derde, vierde en zevende lid][ref1], of van de taken en bevoegdheden die op grond
      van artikel 2, achtste lid, aan het Instituut zijn opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Artikel2
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0043252
        artikel: '2'
        hoofdstuk: '2'
  - number: '3.5'
    text: |-
      Het Instituut, de minister van Binnenlandse Zaken en Koninkrijksrelaties en het college van burgemeester en
      wethouders van de betrokken gemeenten verstrekken elkaar desgevraagd de gegevens, waaronder persoonsgegevens,
      over de afhandeling van aanvragen om schadevergoeding en beslissingen in het kader van de uitvoering van de
      versterkingsoperatie die noodzakelijk zijn voor een goede uitvoering van deze wettelijke taak.
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel3
  - number: '4.1'
    text: Het Instituut bestaat uit ten minste drie en ten hoogste vijf leden, onder wie de voorzitter.
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel4
  - number: '4.2'
    text: |-
      In afwijking van [artikel 12, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref1] worden de leden
      van het Instituut benoemd, geschorst en ontslagen bij koninklijk besluit, op voordracht van Onze Minister voor
      Rechtsbescherming.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel12
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '12'
  - number: '4.3'
    text: 'Schorsing en ontslag vinden plaats wegens:'
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel4
  - number: 4.3.a
    text: ongeschiktheid of onbekwaamheid voor de vervulde functie; of
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel4
  - number: 4.3.b
    text: andere zwaarwegende redenen gelegen in de persoon van de betrokkene.
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel4
  - number: '4.4'
    text: De leden van het Instituut worden op eigen verzoek ontslagen door Onze Minister voor Rechtsbescherming.
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel4
  - number: '4.5'
    text: |-
      De leden van het Instituut zijn onpartijdig en hun benoeming vindt plaats op grond van de deskundigheid die nodig
      is voor de uitoefening van de taken en bevoegdheden van het Instituut.
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel4
  - number: '4.6'
    text: |-
      Benoeming vindt plaats voor een periode van ten hoogste vier jaar. De leden van het Instituut kunnen na afloop van
      deze periode aansluitend tweemaal opnieuw worden benoemd voor eenzelfde periode.
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel4
  - number: '4.7'
    text: |-
      Een lid van een het Instituut meldt aan Onze Minister voor Rechtsbescherming alle omstandigheden die van invloed
      zijn of zouden kunnen zijn op hun onpartijdigheid of aanleiding kunnen geven tot een belangenconflict in het kader
      van de schadeafhandeling.
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel4
  - number: '4.8'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de procedure omtrent
      benoeming, schorsing en ontslag en de rechtspositie van de leden van het Instituut.
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel4
  - number: '5.1'
    text: Aan het Instituut staat ter ondersteuning van zijn taken en bevoegdheden een bureau ten dienste.
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel5
  - number: '5.2'
    text: |-
      Onze Minister stelt ten behoeve van de ondersteuning van de uitvoering van taken en bevoegdheden van het Instituut
      voldoende en gekwalificeerd personeel aan het bureau van het Instituut ter beschikking.
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel5
  - number: '6.1'
    text: |-
      Het Instituut kan voor de uitvoering of voorbereiding van bepaalde werkzaamheden commissies instellen, waarvan ook
      anderen dan leden van het Instituut deel uit kunnen maken.
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel6
  - number: '6.2'
    text: |-
      Indien het Instituut aan een commissie mandaat verleent tot het nemen van besluiten op
      grond van [artikel 2, derde lid][ref1], zijn [artikel 3, derde en zesde lid][ref2], en
      [artikel 13 van de Kaderwet zelfstandige bestuursorganen][ref3] van overeenkomstige toepassing op de leden van
      de commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020495#Artikel13
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020495
        artikel: '13'
  - number: '7'
    text: |-
      De leden van het Instituut, het personeel van het Instituut en de door het Instituut ingeschakelde deskundigen
      verlangen of ontvangen van derden geen instructies die op een individuele zaak betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel7
  - number: '8.1'
    text: Het Instituut stelt een bestuursreglement vast.
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel8
  - number: '8.2'
    text: 'Het bestuursreglement bevat regels over:'
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel8
  - number: 8.2.a
    text: de wijze van inrichting van het Instituut;
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel8
  - number: 8.2.b
    text: de wijze van besluitvorming;
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel8
  - number: 8.2.c
    text: het financiële beheer;
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel8
  - number: 8.2.d
    text: de administratieve organisatie;
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel8
  - number: 8.2.e
    text: vervanging van leden; en
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel8
  - number: 8.2.f
    text: vertegenwoordigingsbevoegdheid.
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel8
  - number: '8.3'
    text: |-
      Het Instituut maakt het reglement na de goedkeuring, bedoeld in
      [artikel 11 van de Kaderwet zelfstandige bestuursorganen][ref1], bekend in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel11
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '11'
  - number: '9.1'
    text: |-
      De [artikelen 21][ref1] en [22 van de Kaderwet zelfstandig bestuursorganen][ref2] zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel22
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '22'
  - number: '9.2'
    text: |-
      Aan het jaarverslag, bedoeld in [artikel 18 van de Kaderwet zelfstandig bestuursorganen][ref1], worden in het
      belang van de transparantie omtrent de taakuitoefening en het gevoerde beleid bij algemene maatregel van bestuur
      nadere eisen gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel18
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '18'
  - number: '10.1'
    text: |-
      Het Instituut stelt, met inachtneming van de bepalingen van dit hoofdstuk, een procedure en een werkwijze vast voor
      de behandeling van aanvragen.
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel10
  - number: '10.2'
    text: De procedure en werkwijze van het Instituut kennen een ruimhartige schadeafhandeling als uitgangspunt.
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel10
  - number: '10.3'
    text: Het Instituut publiceert zijn procedure en werkwijze op zijn website.
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel10
  - number: '11.1'
    text: |-
      Een aanvraag om vergoeding van schade wordt ingediend bij het Instituut via een door het Instituut vastgesteld
      formulier.
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel11
  - number: '11.2'
    text: 'De aanvraag bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel11
  - number: 11.2.a
    text: de naam en het adres van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel11
  - number: 11.2.b
    text: de datum;
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel11
  - number: 11.2.c
    text: indien van toepassing, de aard en het adres van het gebouw waarop de aanvraag betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel11
  - number: 11.2.d
    text: indien mogelijk, de datum of een inschatting van de datum waarop de schade is ontstaan;
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel11
  - number: 11.2.e
    text: een aanduiding van de vermoedelijke oorzaak van de schade;
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel11
  - number: 11.2.f
    text: een beschrijving naar eigen inzicht van de aard en de omvang van de schade;
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel11
  - number: 11.2.g
    text: de inschatting van de aanvrager of er sprake zou kunnen zijn van een acuut onveilige situatie;
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel11
  - number: 11.2.h
    text: |-
      een verklaring van de aanvrager van overdracht aan de Staat van de vordering tot vergoeding van schade van de
      aanvrager op de exploitant ter zake van de schade waarvoor vergoeding wordt aangevraagd.
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel11
  - number: '12.1'
    text: |-
      Het Instituut kan ten behoeve van een besluit één of meerdere deskundigen aanwijzen om schade op te nemen en te
      rapporteren over de aard van de schade in het licht van de door het Instituut te maken beoordeling.
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel12
  - number: '12.2'
    text: |-
      De deskundige brengt binnen een door het Instituut gestelde termijn die ten hoogste zes maanden na de aanwijzing
      van de deskundige bedraagt een advies uit over zijn bevindingen.
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel12
  - number: '12.3'
    text: |-
      Indien de deskundige binnen de gestelde termijn geen advies kan uitbrengen, deelt de deskundige dit, onder opgaaf
      van redenen, aan het Instituut mee voor het einde van de termijn en kan het Instituut de termijn met ten hoogste
      zes maanden verlengen. Het Instituut stelt de aanvrager daarvan schriftelijk in kennis.
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel12
  - number: '12.4'
    text: |-
      Indien de aanvrager tegen het besluit, bedoeld in [artikel 13][ref1], in bezwaar gaat, wijst het Instituut
      ambtshalve of op verzoek een deskundige aan, anders dan die bedoeld in het eerste lid, die de aanvrager kan
      bijstaan, tenzij de zaak waarop het betrekking heeft hier evident geen aanleiding voor geeft.


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Artikel13
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0043252
        artikel: '13'
        hoofdstuk: '4'
  - number: '14.1'
    text: |-
      Onze Minister stelt voldoende financiële middelen ter beschikking aan het Instituut ter uitoefening van zijn taken
      en bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel14
  - number: '14.2'
    text: |-
      Onze Minister neemt in zijn begroting het Instituut als afzonderlijke begrotingspost op en voorziet deze post van
      een toelichting.
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel14
  - number: '15.1'
    text: |-
      Onze Minister legt een heffing op aan een exploitant van een mijnbouwwerk ten behoeve van gaswinning uit het
      Groningenveld of de gasopslag bij Norg:
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel15
  - number: 15.1.a
    text: |-
      ter bestrijding van alle kosten gemaakt in verband met de uitvoering van de taken en bevoegdheden bedoeld in
      [artikel 2, derde en zevende lid][ref1], met uitzondering van de kosten die verband houden met de bezoldiging van
      de leden van het Instituut en de huisvestingskosten van het Instituut;


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Artikel2
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0043252
        artikel: '2'
        hoofdstuk: '2'
  - number: 15.1.b
    text: |-
      ter bestrijding van de kosten gemaakt in verband met de uitvoering van de taken en bevoegdheden bedoeld in
      [artikel 2, achtste lid][ref1], indien deze kosten gemaakt zijn ten behoeve van vergoeding van schade als bedoeld
      in deze wet; en


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Artikel2
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0043252
        artikel: '2'
        hoofdstuk: '2'
  - number: 15.1.c
    text: |-
      ter compensatie van het rentevoordeel dat de exploitant ondervindt als gevolg van de afhandeling van schade door
      het Instituut.
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel15
  - number: '15.2'
    text: |-
      De heffing wordt opgelegd aan de exploitant die ten tijde van het bekend worden van de schade, waarop de kosten van
      vergoedingen die de basis vormen voor de heffing betrekking hebben, exploitant is. Indien deze schade bekend wordt
      na sluiting van het mijnbouwwerk, wordt de heffing opgelegd aan degene die de laatste exploitant was.
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel15
  - number: '15.3'
    text: De hoogte van de heffing wordt bij ministeriële regeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel15
  - number: '16.1'
    text: |-
      De rechtbank kan in een beroep tegen een besluit op grond van deze wet op verzoek van een partij of ambtshalve
      de Afdeling bestuursrechtspraak van de Raad van State een rechtsvraag stellen ter beantwoording bij wijze van een
      prejudiciële uitspraak, indien een antwoord op deze vraag nodig is om op het beroep te beslissen en rechtstreeks
      van belang is:
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel16
  - number: 16.1.a
    text: |-
      voor een veelheid aan aanvragen die gegrond zijn op dezelfde of soortgelijke feiten en uit dezelfde of soortgelijke
      samenhangende oorzaken voortkomen; of
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel16
  - number: 16.1.b
    text: |-
      voor beoordeling van talrijke andere uit soortgelijke feiten voortvloeiende beroepen, waarin dezelfde vraag zich
      voordoet.
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel16
  - number: '16.2'
    text: |-
      Alvorens de vraag te stellen, stelt de rechtbank partijen in de gelegenheid zich uit te laten over het voornemen om
      een vraag te stellen, alsmede over de inhoud van de te stellen vraag.
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel16
  - number: '16.3'
    text: |-
      De tussenuitspraak waarbij de vraag wordt gesteld, vermeldt voorts het onderwerp van beroep, de door de rechtbank
      vastgestelde feiten en de door partijen ingenomen standpunten. Tevens bevat de tussenuitspraak een uiteenzetting
      dat met de beantwoording van de vraag wordt voldaan aan het eerste lid, onderdeel a of b. Tegen de tussenuitspraak
      kan slechts hoger beroep worden ingesteld tegelijkertijd met een hoger beroep tegen de uitspraak als bedoeld in
      [artikel 8:66, eerste lid][ref1], of [artikel 8:67, eerste lid, van de Algemene wet bestuursrecht][ref2] van de
      rechtbank of de uitspraak als bedoeld in [artikel 8:86, eerste lid, van de Algemene wet bestuursrecht][ref3] van de
      voorzieningenrechter van de rechtbank.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '16.4'
    text: |-
      De griffier zendt onverwijld een afschrift van de tussenuitspraak aan de Afdeling bestuursrechtspraak. De griffier
      zendt afschriften van de andere op de procedure betrekking hebbende stukken op diens verzoek aan de griffier van de
      Afdeling bestuursrechtspraak.
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel16
  - number: '16.5'
    text: |-
      De rechtbank houdt de beslissing in de beroepsprocedure aan totdat een afschrift van de uitspraak van de Afdeling
      bestuursrechtspraak is ontvangen.
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel16
  - number: '16.6'
    text: |-
      Indien in een andere lopende beroepsprocedure het antwoord op de vraag rechtstreeks van belang is om op
      het beroep te beslissen, kan de rechtbank op verzoek van een partij in die procedure dan wel ambtshalve
      de beslissing aanhouden totdat de Afdeling bestuursrechtspraak uitspraak heeft gedaan. Alvorens te
      beslissen als bedoeld in de eerste zin, stelt de rechtbank de bij de procedure betrokken partijen in de
      gelegenheid zich daarover uit te laten. De rechtbank houdt de beslissing niet aan indien alle partijen
      te kennen hebben gegeven voortzetting van de procedure te verlangen of indien een zwaarwegend belang
      van de indiener van het beroepschrift zich verzet tegen het aanhouden van de procedure. In afwijking van
      [artikel 8:104, derde lid, onder b van de Algemene wet bestuursrecht][ref1] kan de indiener van het beroepschrift
      terstond hoger beroep instellen tegen een beslissing om aan te houden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '17.1'
    text: |-
      Tenzij de Afdeling bestuursrechtspraak, indien van toepassing gehoord de conclusie, bedoeld in
      [artikel 8:12a van de Algemene wet bestuursrecht][ref1], aanstonds beslist overeenkomstig het negende lid, stelt
      zij partijen in de gelegenheid om binnen een door haar te bepalen termijn schriftelijk opmerkingen te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '17.2'
    text: |-
      De Afdeling bestuursrechtspraak kan bepalen dat ook anderen dan partijen binnen een daartoe te bepalen termijn in
      de gelegenheid worden gesteld om schriftelijke opmerkingen te maken. De aankondiging hiervan geschiedt op een door
      de Afdeling bestuursrechtspraak van de Raad van State te bepalen wijze.
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel17
  - number: '17.3'
    text: |-
      Schriftelijke opmerkingen worden ter griffie van de Afdeling bestuursrechtspraak ingediend. De griffier zendt
      onverwijld een afschrift aan partijen.
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel17
  - number: '17.4'
    text: |-
      Indien het belang van de zaak dit geraden doet voorkomen, kan de Afdeling bestuursrechtspraak, hetzij ambtshalve,
      hetzij op een daartoe strekkend verzoek, een termijn bepalen voor mondelinge of schriftelijke toelichting door
      partijen. De Afdeling bestuursrechtspraak kan, indien zij een mondelinge toelichting heeft bevolen, degenen die
      ingevolge het tweede lid schriftelijke opmerkingen hebben gemaakt, uitnodigen ter zitting aanwezig te zijn teneinde
      over hun opmerkingen te worden gehoord.
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel17
  - number: '17.5'
    text: |-
      Een schriftelijke toelichting wordt door de partij ondertekend en ter griffie van de Afdeling bestuursrechtspraak
      ingediend.
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel17
  - number: '17.6'
    text: |-
      Na het verstrijken van de termijn voor het maken van schriftelijke opmerkingen, dan wel na de mondelinge of
      schriftelijke toelichting, kan de voorzitter van de Afdeling bestuursrechtspraak, onder overeenkomstige toepassing
      van [artikel 8:12a van de Algemene wet bestuursrecht][ref1], één van haar leden verzoeken een conclusie te nemen,
      hetzij onmiddellijk, hetzij op een daartoe te bepalen dag. De griffier zendt onverwijld een afschrift van de
      conclusie aan partijen. Partijen kunnen binnen twee weken na verzending van het afschrift van de conclusie hun
      schriftelijk commentaar daarop doen toekomen aan de Afdeling bestuursrechtspraak.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '17.7'
    text: 'De Afdeling bestuursrechtspraak bepaalt de dag waarop zij zal beslissen:'
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel17
  - number: 17.7.a
    text: |-
      na het verstrijken van de termijn voor het maken van schriftelijke opmerkingen, dan wel na de mondelinge of
      schriftelijke toelichting, indien door de voorzitter van Afdeling bestuursrechtspraak van de Raad van State geen
      gebruik is gemaakt van de mogelijkheid bedoeld in het zesde lid, of
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel17
  - number: 17.7.b
    text: |-
      nadat het daartoe op grond van het zesde lid verzochte lid van Afdeling bestuursrechtspraak van de Raad van State
      conclusie heeft genomen.
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel17
  - number: '17.8'
    text: |-
      De Afdeling bestuursrechtspraak kan de vraag herformuleren. Tenzij de herformulering van ondergeschikte betekenis
      is, stelt zij partijen in de gelegenheid om binnen een door haar te bepalen termijn schriftelijke opmerkingen te
      maken.
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel17
  - number: '17.9'
    text: |-
      De Afdeling bestuursrechtspraak ziet af van beantwoording indien zij oordeelt dat de vraag zich niet voor
      beantwoording bij wijze van prejudiciële uitspraak leent of de vraag van onvoldoende gewicht is om beantwoording
      te rechtvaardigen. De Afdeling bestuursrechtspraak kan zich bij de vermelding van de gronden van haar uitspraak
      beperken tot dit oordeel.
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel17
  - number: '17.10'
    text: |-
      Indien het antwoord op de vraag, nadat deze is gesteld, niet meer nodig is om in de procedure, bedoeld in
      [artikel 16, eerste lid][ref1], op het beroep te beslissen, kan de Afdeling bestuursrechtspraak, indien haar dat
      geraden voorkomt, de vraag desondanks beantwoorden met het oog op aanhangige beroepen in soortgelijke zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Artikel16
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0043252
        artikel: '16'
        hoofdstuk: '7'
  - number: '17.11'
    text: |-
      De Afdeling bestuursrechtspraak begroot in haar uitspraak, onder overeenkomstige toepassing van het bepaalde bij en
      krachtens [artikel 8:75 van de Algemene wet bestuursrecht][ref1], de kosten, belanghebbenden en het bestuursorgaan
      ingevolge dit artikel hebben gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '17.12'
    text: |-
      De griffier zendt onverwijld een afschrift van de uitspraak aan de rechtbank en aan partijen. De griffier zendt
      daarbij eveneens een afschrift van de genomen conclusie, indien van toepassing, en van de schriftelijke opmerkingen
      en toelichtingen, bedoeld in het eerste, tweede en vierde lid.
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel17
  - number: '18.1'
    text: |-
      Behoudens indien het antwoord op de vraag niet meer nodig is om op het beroep te beslissen, beslist de
      rechtbank, nadat zij partijen de gelegenheid heeft gegeven zich schriftelijk over de uitspraak van de Afdeling
      bestuursrechtspraak uit te laten, met inachtneming van deze uitspraak.
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel18
  - number: '18.2'
    text: |-
      De rechtbank kan onder de proceskosten waarin een bestuursorgaan of, indien van toepassing, een belanghebbende
      veroordeeld wordt, ook opnemen het door de Afdeling bestuursrechtspraak van de Raad van State begrote bedrag,
      bedoeld in [artikel 17, elfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Artikel17
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0043252
        artikel: '17'
        hoofdstuk: '7'
  - number: '18.3'
    text: |-
      Geen griffierecht wordt geheven van belanghebbenden, het bestuursorgaan en anderen die verschijnen in de
      prejudiciële procedure als bedoeld in [artikel 16][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Artikel16
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0043252
        artikel: '16'
        hoofdstuk: '7'
  - number: '19.1'
    text: |-
      De artikelen [8:10 tot en met 8:12][ref1], [8:14 tot en met 8:20][ref2], [8:23 tot en met 8:28][ref3],
      [8:29 tot en met 8:32a][ref4], [8:35 tot en met 8:40][ref5], [8:45a][ref6], [8:47][ref7],
      [8:60][ref8], [8:60a, tweede lid][ref9], [8:61][ref10], [8:62][ref11], [8:65][ref12];
      [8:77, eerste lid, onderdelen a tot en met e, en derde lid][ref13], [8:78][ref14] en
      [8:79 van de Algemene wet bestuursrecht][ref15] zijn van overeenkomstige toepassing op de behandeling van een
      verzoek om een prejudiciële uitspraak door de Afdeling bestuursrechtspraak.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref7]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref8]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref9]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref10]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref11]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref12]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref13]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref14]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref15]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel19
    references:
