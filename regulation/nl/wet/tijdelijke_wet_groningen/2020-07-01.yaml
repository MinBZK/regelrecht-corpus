        artikel: '8'
      - id: ref13
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref14
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref15
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '19.2'
    text: |-
      De Afdeling bestuursrechtspraak doet op de op grond van [artikel 17, zevende lid][ref1], bepaalde dag schriftelijk
      uitspraak op een verzoek om een prejudiciële beslissing.


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Artikel17
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0043252
        artikel: '17'
        hoofdstuk: '7'
  - number: '20'
    text: |-
      Onverminderd [artikel 39, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref1] zendt Onze Minister
      binnen twee jaar na de inwerkingtreding van deze wet, en vervolgens telkens na drie jaar, aan de Staten-Generaal
      een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk en de noodzaak van het voortduren
      van de maatregelen waarin deze wet voorziet.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel39
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '39'
  - number: '21.1'
    text: |-
      Besluiten van de deelcommissie mijnbouwschade op grond van
      [artikel 3, tweede lid, van het Besluit Mijnbouwschade Groningen][ref1], en de deelcommissie bezwaar, op grond van
      artikel 3, derde lid, van het Besluit Mijnbouwschade Groningen, worden na inwerkingtreding van deze wet aangemerkt
      als besluiten van het Instituut Mijnbouwschade als bedoeld in [artikel 2, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0040584#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0043252#Artikel2
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0040584
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0043252
        artikel: '2'
        hoofdstuk: '2'
  - number: '21.2'
    text: |-
      Aanvragen tot vergoeding van schade die in de periode van 19 maart 2018 tot de datum van inwerkingtreding van deze
      wet in behandeling zijn bij de Tijdelijke Commissie Mijnbouwschade Groningen, worden voor de toepassing van deze
      wet aangemerkt als een aanvraag tot vergoeding van schade als bedoeld in [artikel 2, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Artikel2
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0043252
        artikel: '2'
        hoofdstuk: '2'
  - number: '21.3'
    text: |-
      Schademeldingen die in de periode van 31 maart 2017, 12:00 uur, tot 19 maart 2018 zijn voorgelegd aan
      de Nederlandse Aardolie Maatschappij N.V. of het Centrum Veilig Wonen en in behandeling zijn, worden
      voor de toepassing van deze wet aangemerkt als een aanvraag tot vergoeding van schade als bedoeld in
      [artikel 2, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Artikel2
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0043252
        artikel: '2'
        hoofdstuk: '2'
  - number: '21.4'
    text: Het Instituut neemt de zaken bedoeld in het eerste tot en met derde lid over in de staat waarin deze zich bevinden.
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel21
  - number: '22'
    text: |-
      Aanvragen om vergoeding van schade worden door het Instituut niet in behandeling genomen indien de aanvrager ten
      aanzien van de schade op het moment van inwerkingtreding van deze wet partij is bij:
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel22
  - number: 22.a
    text: de overeenkomst Groningen-NAM inzake regeling vergoeding kosten bodemdaling aardgaswinning 1983, of
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel22
  - number: 22.b
    text: de overeenkomst Rijk-NAM inzake regeling vergoeding kosten bodemdaling aardgaswinning 1983.
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel22
  - number: 22a.1
    text: |-
      Degene die voorafgaand aan de inwerkingtreding van deze wet is benoemd als lid van de Tijdelijke Commissie
      Mijnbouwschade Groningen, is van rechtswege benoemd als lid van het Instituut en de duur van zijn benoeming wordt
      vastgesteld op vier jaar.
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel22a
  - number: 22a.2
    text: |-
      Degene die voorafgaand aan de inwerkingtreding van deze wet is benoemd als voorzitter van Tijdelijke Commissie
      Mijnbouwschade Groningen, is van rechtswege benoemd als voorzitter van het Instituut en de duur van zijn benoeming
      wordt vastgesteld op vier jaar.
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel22a
  - number: 22a.3
    text: |-
      Voor het bepalen van het tijdvak van de benoeming, bedoeld in [artikel 4, zesde lid][ref1], geldt het tijdvak,
      vervuld als lid of voorzitter van de Tijdelijke Commissie Mijnbouwschade Groningen, voorafgaand aan de
      inwerkingtreding van deze wet als een tijdvak, vervuld als lid of voorzitter van het Instituut.


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Artikel4
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0043252
        artikel: '4'
        hoofdstuk: '2'
  - number: '29.1'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan, verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0043252/2020-07-01#Artikel29
  - number: '29.2'
    text: |-
      In afwijking van het eerste lid treedt [artikel 28, aanhef en onderdelen b en c][ref1], in werking met ingang
      van de dag na de datum van uitgifte van het Staatsblad waarin deze wet wordt geplaatst en werkt terug tot en met
      1 januari 2018.


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Artikel28
