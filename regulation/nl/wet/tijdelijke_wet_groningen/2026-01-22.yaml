    text: |-
      1 Onze Minister stelt voldoende financiële middelen ter beschikking aan het Instituut ter uitoefening van zijn
      taken en bevoegdheden.

      2 Onze Minister neemt in zijn begroting het Instituut als afzonderlijke begrotingspost op en voorziet deze post van
      een toelichting.
    url: https://wetten.overheid.nl/BWBR0043252/2026-01-22#Artikel14
  - number: '15'
    text: |-
      1 Onze Minister legt een heffing op aan een exploitant:

      a. ter bestrijding van alle kosten gemaakt in verband met de uitvoering van de taken en bevoegdheden, bedoeld
      in de [artikelen 2, derde lid, onderdelen a en b, zevende en negende lid][ref1] en [12, vierde lid][ref2],
      met uitzondering van de kosten die verband houden met de bezoldiging van de leden van het Instituut, de
      huisvestingskosten van het Instituut en de BTW voor werkzaamheden die door derden worden uitgevoerd in opdracht van
      het Instituut;

      b. ter bestrijding van de kosten gemaakt door de overheid in verband met de uitvoering van overige maatregelen ter
      bestrijding van de nadelige gevolgen van de aanleg of exploitatie van een mijnbouwwerk ten behoeve van het winnen
      van gas uit het Groningenveld, of van de gasopslag Norg of de gasopslag Grijpskerk, met uitzondering van de BTW
      voor werkzaamheden die door derden worden uitgevoerd in opdracht van de overheid;

      c. ter bestrijding van alle kosten gemaakt door de overheid om te voldoen aan [artikel 13ba][ref3] alsmede de
      kosten die daar direct verband mee houden, met uitzondering van de BTW voor werkzaamheden die door derden worden
      uitgevoerd in opdracht van Onze Minister;

      d. ter bestrijding van de kosten gemaakt in verband met de vergoedingen, bedoeld in
      [artikel 13m, eerste lid][ref4], en subsidies op grond van [artikel 13n, eerste en tweede lid][ref5], in
      combinatie met de [artikelen 37b][ref6] en [37c van de Wet op de rechtsbijstand][ref7], en vergoedingen op grond
      van artikel 13n, vierde en vijfde lid; en

      e. ter compensatie van het rentevoordeel dat de exploitant ondervindt als gevolg van de afhandeling van schade
      door het Instituut, als gevolg van de voorbereiding en uitvoering van maatregelen als bedoeld in onderdeel c, en de
      toekenning van de vergoedingen, bedoeld in onderdeel d.

      2 De heffing wordt opgelegd aan de exploitant die ten tijde van het bekend worden van de schade, waarop de kosten
      van vergoedingen die de basis vormen voor de heffing betrekking hebben, exploitant is, respectievelijk aan de
      exploitant die ten tijde van het maken van de kosten, bedoeld in het eerste lid, onderdeel c, exploitant is,
      respectievelijk aan de exploitant die ten tijde van het maken van de kosten, bedoeld in onderdeel d, exploitant is.
      Indien deze schade bekend wordt of deze kosten gemaakt worden na sluiting van het mijnbouwwerk, wordt de heffing
      opgelegd aan degene die de laatste exploitant was.

      3 Onze Minister kan een tussentijdse heffing opleggen voor de kosten die op dat moment gemaakt zijn. De
      tussentijdse heffing wordt verrekend met de definitieve heffing.


