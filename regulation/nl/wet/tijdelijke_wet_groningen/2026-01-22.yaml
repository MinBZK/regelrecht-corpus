  - number: 13ib
    text: |-
      1 In afwijking van [artikel 13i, vierde lid][ref1], kan de eigenaar van een gebouw dat blijkens een beoordeling
      als bedoeld in artikel 13i, eerste lid, of [artikel 13ia, eerste lid][ref2], niet aan de veiligheidsnorm voldoet,
      ervoor kiezen om een overzicht van maatregelen die nodig zijn om het gebouw aan de veiligheidsnorm te laten voldoen
      in eigen beheer op te stellen, nadat hij het voornemen hiertoe aan Onze Minister heeft gemeld, indien:

      a. het gebouw niet constructief verbonden is met een ander gebouw, tenzij alle eigenaren van de constructief
      verbonden gebouwen gezamenlijk en gelijktijdig het overzicht van maatregelen opstellen;

      b. Onze Minister voor het opstellen van het overzicht van maatregelen nog geen openbare aanbesteding heeft gedaan;

      c. nog geen overzicht van maatregelen is opgesteld.

      2 Onze Minister informeert de betrokken gemeente over het voornemen, bedoeld in het eerste lid.

      3 Op verzoek van de eigenaar verstrekt Onze Minister binnen twaalf weken na ontvangst van het verzoek een
      vergoeding voor de kosten van het opstellen van het overzicht, indien de beoordeling voldoet aan de regels, bedoeld
      in [artikel 13h][ref3], en die regels op de juiste wijze zijn toegepast.

      4 Bij ministeriële regeling kunnen regels worden gesteld over de vergoeding, bedoeld in het derde lid.


