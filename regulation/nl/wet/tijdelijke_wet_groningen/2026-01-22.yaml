  - number: 13k
    text: |-
      1 Indien Onze Minister door toedoen van de eigenaar niet kan vaststellen of een gebouw aan de veiligheidsnorm
      voldoet of indien het Onze Minister ook na herhaalde pogingen en een uiterste inspanning niet mogelijk is met
      medewerking van de eigenaar het versterkingsbesluit voor te bereiden, en de belangen van de eigenaar, gebruiker
      of derde belanghebbenden niet worden geschaad, besluit de minister dat een gebouw niet wordt versterkt. De
      minister zendt een afschrift van dit besluit aan het college van de gemeente waarin het gebouw is gelegen,
      en, indien het gebouw of het terrein waarop het staat een rijksmonument is, aan Onze Minister van Onderwijs,
      Cultuur en Wetenschap, en draagt zorg voor inschrijving van dit besluit in de openbare registers, bedoeld in
      [artikel 16 van Boek 3 van het Burgerlijk Wetboek][ref1].

      2 Onze Minister kan ten behoeve van de beoordeling, bedoeld in [artikel 13i, eerste lid][ref2], de uitvoering
      van de versterkingsmaatregelen en voor het gebruik, bedoeld in het derde lid, personen aanwijzen die bevoegd zijn
      met medeneming van de benodigde apparatuur en andere hulpmiddelen, een gebouw met inbegrip van een woning binnen
      te treden.

      3 Indien voor de uitvoering van de versterkingsmaatregelen gebruik moet worden gemaakt van een onroerende zaak
      waarop het versterkingsbesluit geen betrekking heeft, kan Onze Minister besluiten de rechthebbende met wie daarover
      geen overeenstemming is bereikt, behoudens recht op schadevergoeding, de verplichting op te leggen om te gedogen
      dat zijn onroerende zaak wordt gebruikt voor de uitvoering van die maatregelen.

      4 De eigenaar of gebruiker van een gebouw verleent aan een persoon als bedoeld in het tweede lid, binnen de door
      deze persoon gestelde termijn, alle medewerking die deze redelijkerwijs kan vorderen bij de uitoefening van zijn
      bevoegdheden.

      5 De machtiging, bedoeld in [artikel 2, eerste lid, van de Algemene wet op het binnentreden][ref3] wordt gegeven
      door Onze Minister.


