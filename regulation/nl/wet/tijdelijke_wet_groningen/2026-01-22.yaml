  - number: '18'
    text: |-
      1 Behoudens indien het antwoord op de vraag niet meer nodig is om op het beroep te beslissen, beslist de rechtbank,
      nadat zij partijen de gelegenheid heeft gegeven zich schriftelijk over de uitspraak van de Hoge Raad dan wel de
      Afdeling bestuursrechtspraak uit te laten, met inachtneming van deze uitspraak.

      2 De rechtbank kan onder de proceskosten waarin een partij veroordeeld wordt, ook opnemen het door de Hoge Raad dan
      wel de Afdeling bestuursrechtspraak begrote bedrag, bedoeld in [artikel 17, twaalfde lid][ref1].

      3 Geen griffierecht wordt geheven van belanghebbenden, het bestuursorgaan en anderen die verschijnen in de
      prejudiciële procedure als bedoeld in [artikel 16][ref2].


