  - number: 15b
    text: |-
      1 Onze Minister kan aan de provincie Groningen en gemeenten in de provincie Groningen een uitkering als bedoeld
      in [artikel 15a van de Financiële-verhoudingswet][ref1] verstrekken voor activiteiten die gericht zijn op de
      toekomstbestendigheid of de leefbaarheid van de provincie Groningen.

      2 Onze Minister kan een uitkering als bedoeld in [artikel 15a van de Financiële-verhoudingswet][ref2] verstrekken
      aan de gemeenten Eemsdelta, Groningen, Het Hogeland, Midden-Groningen en Oldambt voor activiteiten die verband
      houden met het uitvoeren van de versterking, of voor activiteiten die gericht zijn op de verbetering van de sociale
      cohesie, en aan de provincie Groningen voor activiteiten die deze activiteiten van deze gemeenten ondersteunen.

      3 Bij ministeriële regeling worden regels gesteld over de uitkering, bedoeld in het eerste en tweede lid. Deze
      regels zien ten minste op de vaststelling van de hoogte van de uitkering, de verdeling, de voorwaarden waaronder
      deze verstrekt wordt en de terugvordering van niet of niet rechtmatig bestede middelen.


