  - number: '29'
    text: |-
      1 Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende
      artikelen of onderdelen daarvan, verschillend kan worden vastgesteld, met uitzondering van [artikel 13][ref1],
      dat in werking treedt op het tijdstip waarop artikel I, onderdelen D en E, van het bij koninklijke boodschap
      van 13 oktober 2020 ingediende voorstel van wet tot wijziging van de Tijdelijke wet Groningen in verband met de
      versterking van gebouwen in de provincie Groningen (Kamerstukken 35 603), nadat dat voorstel tot wet is of wordt
      verheven, in werking treedt.

      2 In afwijking van het eerste lid treedt [artikel 28, aanhef en onderdelen b en c][ref2], in werking met ingang
      van de dag na de datum van uitgifte van het Staatsblad waarin deze wet wordt geplaatst en werkt terug tot en met
      1 januari 2018.


