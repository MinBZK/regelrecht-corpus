  - number: '2'
    text: |-
      1 Er is een Instituut Mijnbouwschade Groningen. Het Instituut is gevestigd op een door Onze Minister te bepalen
      locatie.

      2 Het Instituut vervult zijn taken en bevoegdheden in onafhankelijkheid.

      3 Het Instituut:

      a. heeft tot taak en is bevoegd schade af te handelen en daartoe:

      1°. aanvragen in behandeling te nemen, voor zover de aanvrager zijn vordering tot vergoeding van schade op de
      exploitant ter zake van de schade waarvoor vergoeding wordt aangevraagd aan de Staat heeft overgedragen;

      2°. de aanspraak op een vergoeding van schade vast te stellen, en

      3°. de omvang van de vergoeding van schade of, indien de aanvrager dit wenst en de schade zich daarvoor leent, de
      te treffen maatregelen in natura vast te stellen;

      b. heeft tot taak om schade te vergoeden en daartoe aan de aanvrager de vastgestelde vergoeding uit te keren of,
      indien de aanvrager dit wenst en de schade zich daarvoor leent, de te treffen maatregelen in natura uit te voeren;

      c. heeft tot taak een vergoeding voor overlast van ten hoogste een bij of krachtens algemene maatregel van bestuur
      vastgesteld bedrag toe te kennen.

      4 Het Instituut is niet bevoegd om een aanvraag om vergoeding van schade te behandelen indien deze schade betreft
      waarvoor:

      a. voor 31 maart 2017, 12:00 uur een schademelding of -claim is voorgelegd aan het Centrum Veilig Wonen of de
      exploitant;

      b. door de exploitant met de gedupeerde of diens vertegenwoordiger een vaststellingsovereenkomst is gesloten;

      c. door de gedupeerde of diens vertegenwoordiger met de exploitant onderhandeld wordt met het doel te komen tot een
      vergoeding van de schade;

      d. een vordering is ingesteld bij de burgerlijke rechter, tenzij de vordering bij de burgerlijke rechter met
      instemming van de gedaagde door de aanvrager wordt ingetrokken; of

      e. de burgerlijke rechter uitspraak heeft gedaan over de aanspraak op en de omvang van de vergoeding van de schade.

      5 Het Instituut kan, indien bijzondere omstandigheden daartoe aanleiding geven, afwijken van het bepaalde in het
      vierde lid, onder a en b, ten einde onbillijkheden van overwegende aard te voorkomen.

      6 Het Instituut voert deze taken en bevoegdheden uit met toepassing
      van de bepalingen van het [Burgerlijk Wetboek][ref1], uitgezonderd
      [artikel 178, aanhef en onderdeel c, van Boek 6 van het Burgerlijk Wetboek][ref2].

      7 Indien de aanvrager in de aanvraag aangeeft dat er sprake is van een acuut onveilige situatie of het Instituut op
      basis van de aanvraag zelf het vermoeden heeft dat er sprake is van een acuut onveilige situatie:

      a. inspecteert het Instituut de situatie onmiddellijk, maar in ieder geval binnen 48 uur na indiening van de
      aanvraag, en treft in overleg met de aanvrager de in het belang van de veiligheid noodzakelijke maatregelen, en

      b. informeert het Instituut, ten behoeve van de toepassing van de [Woningwet][ref3] in het belang van de
      veiligheid, de betreffende burgemeester binnen 48 uur over het bestaan van de acuut onveilige situatie en de
      getroffen of te treffen maatregelen.

      8 Bij algemene maatregel van bestuur kunnen aan het Instituut andere taken en bevoegdheden worden opgedragen, die
      samenhangen met de taken en bevoegdheden, bedoeld in het derde lid.

      9 Het Instituut is bevoegd om ter uitvoering van zijn taken en bevoegdheden op grond van deze wet met
      het oog op voorkoming of beperking van schade maatregelen te treffen of vergoedingen uit te keren die
      leiden tot versterking van een gebouw, voor zover dit geen versterkingsmaatregelen betreft als bedoeld in
      [artikel 13j, eerste lid, onderdeel a][ref4].

      10 Naast de schade, bedoeld in [artikel 184 van Boek 6 van het Burgerlijk Wetboek][ref5], kan het Instituut aan
      de aanvrager een in redelijkheid te bepalen tegemoetkoming in geld of in natura toekennen voor iedere redelijke
      maatregel die nodig is om te bewerkstelligen dat de schade waarvoor vergoeding wordt toegekend, duurzaam kan worden
      hersteld. Aan de toekenning van deze tegemoetkoming kan het Instituut voorwaarden verbinden.

      11 Bij ministeriële regeling kan aan het Instituut de taak worden opgedragen knelpunten op te lossen die als gevolg
      van de schade zijn ontstaan.

      12 Bij ministeriële regeling wordt de hoogte van de financiële middelen vastgesteld voor de uitgaven van het
      Instituut inzake tegemoetkomingen als bedoeld in het tiende lid en het oplossen van knelpunten als bedoeld in het
      elfde lid.


