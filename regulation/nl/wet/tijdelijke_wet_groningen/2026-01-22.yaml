      1 Besluiten van de deelcommissie mijnbouwschade op grond van
      [artikel 3, tweede lid, van het Besluit Mijnbouwschade Groningen][ref1], en de deelcommissie bezwaar, op grond van
      artikel 3, derde lid, van het Besluit Mijnbouwschade Groningen, worden na inwerkingtreding van deze wet aangemerkt
      als besluiten van het Instituut Mijnbouwschade als bedoeld in [artikel 2, derde lid][ref2].

      2 Aanvragen tot vergoeding van schade die in de periode van 19 maart 2018 tot de datum van inwerkingtreding van
      deze wet in behandeling zijn bij de Tijdelijke Commissie Mijnbouwschade Groningen, worden voor de toepassing van
      deze wet aangemerkt als een aanvraag tot vergoeding van schade als bedoeld in [artikel 2, derde lid][ref3].

      3 Schademeldingen die in de periode van 31 maart 2017, 12:00 uur, tot 19 maart 2018 zijn voorgelegd aan
      de Nederlandse Aardolie Maatschappij N.V. of het Centrum Veilig Wonen en in behandeling zijn, worden
      voor de toepassing van deze wet aangemerkt als een aanvraag tot vergoeding van schade als bedoeld in
      [artikel 2, derde lid][ref4].

      4 Het Instituut neemt de zaken bedoeld in het eerste tot en met derde lid over in de staat waarin deze zich
      bevinden.


