  - number: 13ba
    text: |-
      Onze Minister neemt alle maatregelen die redelijkerwijs van hem gevergd kunnen worden om te voorkomen dat als
      gevolg van de gaswinning uit het Groningenveld de veiligheid wordt geschaad.
    url: https://wetten.overheid.nl/BWBR0043252/2026-01-22#Artikel13ba
  - number: 13c
    text: |-
      1 Er is een Adviescollege Veiligheid Groningen.

      2 Het Adviescollege bestaat uit ten minste drie en ten hoogste vijf leden, onder wie de voorzitter.

      3 Het Adviescollege heeft tot taak Onze Minister te adviseren over:

      a. de regels, bedoeld in de [artikelen 13e, derde lid][ref1], en [13h][ref2], waarbij in de adviezen aandacht wordt
      besteed aan de laatste bouwkundige en seismische inzichten, de laatste inzichten over toekomstige gaswinning, de
      uitvoerbaarheid van de regels en de doeltreffendheid van de regels in de praktijk;

      b. de relatie tussen beweging van de bodem als gevolg van de aanleg of exploitatie van een mijnbouwwerk ten
      behoeve van het winnen van gas uit het Groningenveld of als gevolg van de gasopslag bij Norg of de gasopslag bij
      Grijpskerk, en de veiligheid;

      c. schade die van invloed is op de constructieve veiligheid van gebouwen.

      4 Het Adviescollege raadpleegt bij de voorbereiding van zijn adviezen de colleges en de inspecteur-generaal der
      mijnen over de uitvoerbaarheid van de adviezen en de doeltreffendheid van de adviezen in de praktijk.

      5 Het Adviescollege informeert de colleges en de inspecteur-generaal der mijnen over de wijze waarop hun reacties
      in het advies zijn verwerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Artikel13e
      [ref2]: https://wetten.overheid.nl/BWBR0043252#Artikel13h
