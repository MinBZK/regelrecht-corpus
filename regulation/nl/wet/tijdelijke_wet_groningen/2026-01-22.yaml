  - number: 13ja
    text: |-
      1 In afwijking van [artikel 13j, eerste lid][ref1], neemt Onze Minister een versterkingsbesluit binnen acht
      weken na ontvangst van een aanvraag van de eigenaar van een gebouw die in eigen beheer een overzicht als bedoeld
      in [artikel 13ib, eerste lid][ref2], heeft opgesteld van de maatregelen die nodig zijn om het gebouw aan de
      veiligheidsnorm te laten voldoen.

      2 De aanvraag bevat het overzicht en de beoordeling of het gebouw aan de veiligheidsnorm voldoet, indien de
      beoordeling in eigen beheer is uitgevoerd als bedoeld in [artikel 13ia, eerste lid][ref3].

      3 Onze Minister kan de aanvraag geheel of gedeeltelijk afwijzen indien:

      a. de beoordeling niet voldoet aan de regels, bedoeld in [artikel 13h][ref4], of die regels niet op de juiste
      wijze zijn toegepast; of

      b. het overzicht niet de maatregelen bevat die naar het oordeel van de minister nodig zijn om het gebouw aan de
      veiligheidsnorm te laten voldoen.

      4 Bij ministeriële regeling worden regels gesteld over de bij de aanvraag aan te leveren gegevens.


