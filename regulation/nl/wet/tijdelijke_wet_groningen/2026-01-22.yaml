  - number: '13'
    text: |-
      1 Het Instituut neemt een besluit over vergoeding van schade uiterlijk binnen:

      a. 8 weken na ontvangst van de aanvraag, indien op deze aanvraag wordt beslist zonder dat onderzoek is verricht
      door een door het Instituut aangewezen deskundige, of

      b. 12 weken na ontvangst van het deskundigenadvies.

      2 De termijn, genoemd in het eerste lid, onderdeel a, met uitzondering van de termijn voor besluiten over
      vergoeding van fysieke schade, kan door het Instituut worden verlengd indien het Instituut als gevolg van het grote
      aantal ontvangen of verwachte aanvragen voor een schadesoort niet in staat is de aanvragen binnen die termijn af
      te handelen. Het Instituut informeert de aanvrager schriftelijk binnen twee weken na ontvangst van zijn aanvraag
      binnen welke termijn een besluit wordt genomen op zijn aanvraag.
    url: https://wetten.overheid.nl/BWBR0043252/2026-01-22#Artikel13
  - number: 13a
    text: |-
      1 Dit hoofdstuk, met uitzondering van [artikel 13ba][ref1], is uitsluitend van toepassing op gebouwen in de
      gemeenten Eemsdelta, Groningen, Het Hogeland, Midden-Groningen en Oldambt.

      2 Bij algemene maatregel van bestuur wordt bepaald dat dit hoofdstuk niet van toepassing is, of onderdelen daarvan
      niet van toepassing zijn, op gebouwen of categorieën van gebouwen waarvoor op een andere wijze in de versterking
      wordt voorzien.

      3 In afwijking van het eerste lid kan Onze Minister onderzoeken of een gebouw dat niet gelegen is in de in dat
      lid genoemde gemeenten mogelijk versterking behoeft, indien er een redelijk vermoeden bestaat dat het gebouw
      versterkt moet worden in verband met de gevolgen van beweging van de bodem door aanleg of exploitatie van een
      mijnbouwwerk ten behoeve van het winnen van gas uit het Groningenveld of als gevolg van de gasopslag bij Norg of
      de gasopslag bij Grijpskerk. Indien uit het onderzoek blijkt dat het gebouw mogelijk versterking behoeft, zijn de
      [artikelen 13h tot en met 13m][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Artikel13ba
      [ref2]: https://wetten.overheid.nl/BWBR0043252#Artikel13h
