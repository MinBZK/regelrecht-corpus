  - number: '3'
    text: |-
      1 Ten behoeve van de goede uitvoering van [artikel 2, derde en vierde lid][ref1], verwerkt het Instituut de nodige
      gegevens, waaronder persoonsgegevens. Het Instituut is verwerkingsverantwoordelijke voor deze verwerking.

      2 Ten behoeve van de goede uitwerking van [artikel 2, derde en vierde lid][ref2], verwerkt Onze Minister de nodige
      gegevens, waaronder persoonsgegevens. Onze Minister is verwerkingsverantwoordelijke voor deze verwerking.

      3 Gelet op artikel 9, tweede lid, onderdeel g, van de Algemene verordening gegevensbescherming is het verbod om
      gegevens over gezondheid te verwerken niet van toepassing indien de verwerking geschiedt door het Instituut of
      Onze Minister voor zover deze verwerking noodzakelijk is in het belang van de goede uitvoering en uitwerking van
      [artikel 2, derde, vierde en elfde lid][ref3].

      4 Het Instituut en Onze Minister verstrekken elkaar desgevraagd de informatie, waaronder begrepen de
      persoonsgegevens, bedoeld in het eerste, tweede en derde lid, voor zover die noodzakelijk is in het belang van de
      goede uitvoering van [artikel 2, derde, vierde en zevende lid][ref4], of van de taken en bevoegdheden die op grond
      van artikel 2, achtste lid, aan het Instituut zijn opgedragen.

      5 Het Instituut, Onze Minister en het college van burgemeester en wethouders van de betrokken gemeenten verstrekken
      elkaar desgevraagd of eigener beweging de gegevens, waaronder persoonsgegevens, over de afhandeling van aanvragen
      om schadevergoeding en beslissingen in het kader van de uitvoering van de versterkingsoperatie die noodzakelijk
      zijn voor een goede uitvoering van deze wettelijke taak.

      6 Ten behoeve van de goede uitvoering van het oplossen van knelpunten die als gevolg van de schade zijn ontstaan
      als bedoeld in [artikel 2, elfde lid][ref5], verwerkt het Instituut de nodige gegevens, waaronder persoonsgegevens.

      7 Het Instituut informeert Onze Minister en het college van burgemeester en wethouders van de betrokken gemeenten
      indien het gegronde vermoedens heeft dat een gebouw niet voldoet aan de veiligheidsnorm.

      8 Onze Minister informeert het Instituut indien hij gegronde vermoedens heeft dat sprake is van een acuut onveilige
      situatie als bedoeld in [artikel 2, zevende lid][ref6].

      9 Het Instituut, Onze Minister en het college van burgemeester en wethouders van de betrokken gemeenten verstrekken
      niet de gegevens over gezondheid behoudens voor zover deze gegevens noodzakelijk zijn voor de uitvoering van
      [artikel 2, elfde lid][ref7], en de betrokkene daar uitdrukkelijk zijn instemming aan heeft gegeven.

      10 Bij algemene maatregel van bestuur worden regels gesteld over de wijze waarop Onze Minister en het Instituut
      de uitvoering van de versterking op grond van [hoofdstuk 5][ref8] en de vergoeding van schade op grond van
      [hoofdstuk 2][ref9] op elkaar afstemmen. De voordracht voor een krachtens dit lid vast te stellen algemene
      maatregel van bestuur wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-
      Generaal is overgelegd.

      11 De exploitant verstrekt Onze Minister desgevraagd de gegevens, waaronder persoonsgegevens, voor zover die
      noodzakelijk zijn in het belang van een goede uitvoering van de versterking op grond van [hoofdstuk 5][ref10].


