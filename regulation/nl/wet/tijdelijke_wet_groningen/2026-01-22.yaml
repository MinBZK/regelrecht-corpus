        artikel: 13e
        hoofdstuk: '5'
  - number: 13g
    text: |-
      1 De gemeenteraad stelt een programma van aanpak vast op basis van de risicoprofielen met daarin een prioritering
      van gebouwen die mogelijk versterking behoeven.

      2 Het programma bevat:

      a. uitvoeringskaders voor de versterking binnen de gemeente;

      b. de meerjarige planning voor het opnemen en beoordelen van gebouwen ten behoeve van het nemen van het
      versterkingsbesluit; en

      c. de meerjarige planning voor de uitvoering van de versterkingsmaatregelen aan gebouwen.

      3 De gemeenteraad verzoekt aan:

      a. de inspecteur-generaal der mijnen om een advies over het ontwerp van het programma in relatie tot de veiligheid,
      en

      b. Onze Minister om een oordeel over de uitvoerbaarheid van het ontwerp van het programma.

      4 De inspecteur-generaal der mijnen geeft het advies, bedoeld in het derde lid, onderdeel a, en Onze Minister geeft
      het oordeel, bedoeld in het derde lid, onderdeel b, binnen zes weken na het verzoek van de gemeenteraad.

      5 Indien de programma’s van alle gemeenten gezamenlijk niet uitvoerbaar zijn binnen de beschikbare capaciteit,
      stelt Onze Minister na overleg met de colleges een programma van aanpak vast voor alle betrokken gemeenten, waarbij
      zoveel mogelijk de prioritering van de programma’s van de gemeenten wordt gevolgd.

      6 Onze Minister kan op verzoek van een eigenaar van een gebouw onderzoeken of het gebouw mogelijk versterking
      behoeft, indien de omstandigheden van het geval daartoe aanleiding geven.

      7 Indien uit het onderzoek, bedoeld in het zesde lid, blijkt dat het gebouw mogelijk versterking behoeft,
      informeert Onze Minister de gemeenteraad.

      8 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over het programma en de advisering door de
      inspecteur-generaal der mijnen en kunnen regels worden gesteld over het bepaalde in het zesde en zevende lid.
    url: https://wetten.overheid.nl/BWBR0043252/2026-01-22#Artikel13g
  - number: 13h
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de wijze waarop wordt vastgesteld of een
      gebouw aan de veiligheidsnorm voldoet en de wijze waarop wordt bepaald welke maatregelen nodig zijn om een gebouw
      aan de veiligheidsnorm te laten voldoen.
    url: https://wetten.overheid.nl/BWBR0043252/2026-01-22#Artikel13h
  - number: 13i
    text: |-
      1 Onze Minister beoordeelt of een gebouw aan de veiligheidsnorm voldoet. De beoordeling vindt plaats overeenkomstig
      de prioritering in het programma, tenzij uit het onderzoek, bedoeld in [artikel 13g, zesde lid][ref1], blijkt dat
      er gegronde vermoedens zijn dat sprake is van een acuut onveilige situatie.

      2 Indien een gebouw aan de veiligheidsnorm voldoet, neemt Onze Minister een besluit inhoudende dat het gebouw
      aan de veiligheidsnorm voldoet en geen versterkingsmaatregelen noodzakelijk zijn. Dit besluit bevat zo nodig een
      vergoeding van de door eigenaar geleden schade die een direct gevolg is van de beoordeling of een gebouw aan de
      veiligheidsnorm voldoet. De minister zendt een afschrift van dit besluit aan het college van de gemeente waarin het
      gebouw is gelegen en, indien het gebouw of het terrein waarop het staat een rijksmonument is, aan Onze Minister van
      Onderwijs, Cultuur en Wetenschap.

      3 Indien een gebouw niet aan de veiligheidsnorm voldoet, zendt Onze Minister aan de eigenaar de beoordeling,
      bedoeld in het eerste lid. In die beoordeling is in ieder geval opgenomen de soort maatregelen die nodig zijn om
      het gebouw aan de veiligheidsnorm te laten voldoen, waarbij, voor zover van toepassing, rekening wordt gehouden met
      de monumentale of karakteristieke waarde van het gebouw.

      4 In het geval, bedoeld in het derde lid, wordt in overleg met de eigenaar van het gebouw een versterkingsbesluit
      voorbereid.

      5 De eigenaar van een gebouw kan schriftelijk bij Onze Minister bedenkingen indienen over de beoordeling, bedoeld
      in het derde lid, of een verzoek doen om het gebouw niet te versterken, tot het tijdstip waarop de minister een
      versterkingsbesluit heeft bekendgemaakt.

      6 Indien de eigenaar bedenkingen of een verzoek om niet te versterken als bedoeld in het vijfde lid indient,
      neemt Onze Minister binnen acht weken na ontvangst ervan en met inachtneming van de ingediende bedenkingen een
      versterkingsbesluit of, indien de eigenaar daarom heeft verzocht, een besluit dat het gebouw niet wordt versterkt
      indien daardoor de belangen van gebruikers of derde belanghebbenden niet worden geschaad. In bijzondere gevallen
      verband houdende met de complexiteit daarvan of het aantal te nemen besluiten kan de termijn, genoemd in de eerste
      volzin, eenmaal worden verlengd met ten hoogste zes weken.

      7 Indien een besluit, bedoeld in het zesde lid, wordt genomen dat een gebouw niet wordt versterkt, zendt
      Onze Minister een afschrift hiervan aan het college van de gemeente waarin het gebouw is gelegen en, indien
      het gebouw of het terrein waarop het staat een rijksmonument is, aan Onze Minister van Onderwijs, Cultuur en
      Wetenschap, en draagt de minister zorg voor inschrijving van dit besluit in de openbare registers, bedoeld in
      [artikel 16 van Boek 3 van het Burgerlijk Wetboek][ref2].

      8 De inschrijving in het register, bedoeld in het zevende lid, laat onverlet de mogelijkheid van een eigenaar om
      terug te komen op een keuze om een gebouw niet te versterken. Indien de eigenaar de keuze om een gebouw wel te
      versterken kenbaar maakt aan Onze Minister, neemt Onze Minister een nieuw versterkingsbesluit en draagt tevens zorg
      voor de doorhaling van het eerdere besluit in het register.


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Artikel13g
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel16
