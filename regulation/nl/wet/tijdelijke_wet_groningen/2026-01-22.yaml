  - number: 22b
    text: |-
      1 Een plan van een gemeenteraad dat hetzelfde doel nastreeft als een programma als bedoeld in [artikel 13g][ref1],
      wordt daarmee gelijkgesteld.

      2 Met ingang van de datum van inwerkingtreding van [hoofdstuk 5][ref2] wordt een krachtens
      [artikel 52g van de Mijnbouwwet][ref3]:

      a. vastgesteld risicoprofiel gelijkgesteld met een risicoprofiel als bedoeld in [artikel 13e, eerste lid][ref4];

      b. vastgestelde beoordeling of een gebouw voldoet aan de veiligheidsnorm of een besluit daarover gelijkgesteld met
      een beoordeling als bedoeld in [artikel 13i, eerste lid][ref5];

      c. genomen besluit tot versterken of gesloten overeenkomst tot vergoeding van kosten voor het treffen van
      versterkingsmaatregelen gelijkgesteld met een versterkingsbesluit; en

      d. genomen besluit tot niet-versterken gelijkgesteld met een besluit als bedoeld in [artikel 13i, zesde lid][ref6],
      of [13k, eerste lid][ref7].

      3 Voor de toepassing van het tweede lid, wordt als de datum van de dagtekening, bedoeld in [artikel 13j][ref8], de
      datum van inwerkingtreding van [hoofdstuk 5][ref9] aangemerkt.

      4 Indien een beoordeling heeft plaatsgevonden op een bij ministeriële regeling te bepalen wijze en
      uit die beoordeling blijkt dat een gebouw niet aan de veiligheidsnorm voldoet en de uitvoering van de
      versterkingsmaatregelen nog niet is aangevangen, kan Onze Minister het gebouw laten beoordelen op een bij of
      krachtens [artikel 13h][ref10] voorgeschreven wijze.

      5 Indien een nieuwe beoordeling als bedoeld in het vierde lid plaatsvindt en krachtens
      [artikel 52g van de Mijnbouwwet][ref11] voor het gebouw een besluit is vastgesteld, trekt Onze Minister
      het op grond van het tweede lid daarmee gelijkgestelde besluit in en besluit Onze Minister op basis
      van de nieuwe beoordeling overeenkomstig [artikel 13i, tweede tot en met zevende lid][ref12], en de
      [artikelen 13j tot en met 13m][ref13].

      6 Onze Minister kan een vergoeding verstrekken aan de eigenaar die op grond van het vierde lid in aanmerking komt
      voor een nieuwe beoordeling.

      7 Bij ministeriële regeling kunnen regels worden gesteld over het besluit, bedoeld in het vierde lid, en over de
      vergoeding, bedoeld in het zesde lid.


