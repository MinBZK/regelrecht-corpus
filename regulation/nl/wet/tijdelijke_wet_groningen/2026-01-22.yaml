  - number: '4'
    text: |-
      1 Het Instituut bestaat uit ten minste drie en ten hoogste vijf leden, onder wie de voorzitter.

      2 In afwijking van [artikel 12, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref1] worden de leden
      van het Instituut benoemd, geschorst en ontslagen bij koninklijk besluit, op voordracht van Onze Minister voor
      Rechtsbescherming.

      3 Schorsing en ontslag vinden plaats wegens:

      a. ongeschiktheid of onbekwaamheid voor de vervulde functie; of

      b. andere zwaarwegende redenen gelegen in de persoon van de betrokkene.

      4 De leden van het Instituut worden op eigen verzoek ontslagen door Onze Minister voor Rechtsbescherming.

      5 De leden van het Instituut zijn onpartijdig en hun benoeming vindt plaats op grond van de deskundigheid die nodig
      is voor de uitoefening van de taken en bevoegdheden van het Instituut.

      6 Benoeming vindt plaats voor een periode van ten hoogste vier jaar. De leden van het Instituut kunnen na afloop
      van deze periode aansluitend tweemaal opnieuw worden benoemd voor eenzelfde periode.

      7 Een lid van een het Instituut meldt aan Onze Minister voor Rechtsbescherming alle omstandigheden die van invloed
      zijn of zouden kunnen zijn op hun onpartijdigheid of aanleiding kunnen geven tot een belangenconflict in het kader
      van de schadeafhandeling.

      8 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de procedure omtrent
      benoeming, schorsing en ontslag en de rechtspositie van de leden van het Instituut.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel12
