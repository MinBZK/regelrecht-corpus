  - number: '10'
    text: |-
      1 Het Instituut stelt, met inachtneming van de bepalingen van dit hoofdstuk, een procedure en een werkwijze vast
      voor de behandeling van aanvragen.

      2 De procedure en werkwijze van het Instituut kennen een ruimhartige schadeafhandeling als uitgangspunt.

      3 Het Instituut publiceert zijn procedure en werkwijze op zijn website.
    url: https://wetten.overheid.nl/BWBR0043252/2026-01-22#Artikel10
  - number: '11'
    text: |-
      1 Een aanvraag om vergoeding van schade wordt ingediend bij het Instituut via een door het Instituut vastgesteld
      formulier.

      2 De aanvraag bevat ten minste:

      a. de naam en het adres van de aanvrager;

      b. de datum;

      c. indien van toepassing, de aard en het adres van het gebouw waarop de aanvraag betrekking heeft;

      d. indien mogelijk, de datum of een inschatting van de datum waarop de schade is ontstaan;

      e. een aanduiding van de vermoedelijke oorzaak van de schade;

      f. een beschrijving naar eigen inzicht van de aard en de omvang van de schade;

      g. de inschatting van de aanvrager of er sprake zou kunnen zijn van een acuut onveilige situatie;

      h. een verklaring van de aanvrager van overdracht aan de Staat van de vordering tot vergoeding van schade van de
      aanvrager op de exploitant ter zake van de schade waarvoor vergoeding wordt aangevraagd.
    url: https://wetten.overheid.nl/BWBR0043252/2026-01-22#Artikel11
  - number: '12'
    text: |-
      1 Het Instituut kan ten behoeve van een besluit één of meerdere deskundigen aanwijzen om schade op te nemen en te
      rapporteren over de aard van de schade in het licht van de door het Instituut te maken beoordeling.

      2 De deskundige brengt binnen een door het Instituut gestelde termijn die ten hoogste zes maanden na de aanwijzing
      van de deskundige bedraagt een advies uit over zijn bevindingen.

      3 Indien de deskundige binnen de gestelde termijn geen advies kan uitbrengen, deelt de deskundige dit, onder opgaaf
      van redenen, aan het Instituut mee voor het einde van de termijn en kan het Instituut de termijn met ten hoogste
      zes maanden verlengen. Het Instituut stelt de aanvrager daarvan schriftelijk in kennis.

      4 Indien de aanvrager tegen het besluit, bedoeld in [artikel 13, eerste lid][ref1], in bezwaar gaat, wijst het
      Instituut ambtshalve of op verzoek een deskundige aan, anders dan die bedoeld in het eerste lid, die de aanvrager
      kan bijstaan, tenzij de zaak waarop het betrekking heeft hier evident geen aanleiding voor geeft.

      5 Het Instituut stelt eisen aan de deskundige, waaronder begrepen het aantal keren dat de deskundige
      per aanvraag mag onderzoeken of de schade evident en aantoonbaar uitsluitend een andere oorzaak heeft
      dan beweging van de bodem als gevolg van de aanleg of exploitatie van een mijnbouwwerk als bedoeld in
      [artikel 177a, eerste lid, van Boek 6 van het Burgerlijk Wetboek][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel177a
