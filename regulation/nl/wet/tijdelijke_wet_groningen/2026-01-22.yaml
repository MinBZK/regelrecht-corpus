  - number: 13ia
    text: |-
      1 In afwijking van [artikel 13i, eerste lid][ref1], kan de eigenaar de beoordeling of het gebouw aan de
      veiligheidsnorm voldoet in eigen beheer uitvoeren nadat hij het voornemen hiertoe aan Onze Minister heeft gemeld,
      indien:

      a. het gebouw deel uitmaakt van een programma;

      b. het gebouw niet constructief verbonden is met een ander gebouw, tenzij alle eigenaren van de constructief
      verbonden gebouwen gezamenlijk en gelijktijdig een beoordeling in eigen beheer uitvoeren;

      c. Onze Minister voor de beoordeling van het gebouw nog geen openbare aanbesteding heeft gedaan;

      d. het gebouw niet al is beoordeeld.

      2 Onze Minister informeert de betrokken gemeente over het voornemen, bedoeld in het eerste lid.

      3 Op verzoek van de eigenaar die de beoordeling in eigen beheer uitvoert, verstrekt Onze Minister binnen vijf weken
      na ontvangst van het verzoek een vergoeding voor de kosten van het uitvoeren van de beoordeling, indien aan de
      voorwaarden, genoemd in het eerste lid, onderdelen a tot en met d, is voldaan.

      4 Zodra de beoordeling is uitgevoerd zendt de eigenaar een afschrift van de beoordeling aan Onze Minister.

      5 Indien de beoordeling volgens Onze Minister voldoet aan de regels, bedoeld in [artikel 13h][ref2], en die regels
      op de juiste wijze zijn toegepast, en uit de beoordeling blijkt dat het gebouw aan de veiligheidsnorm voldoet,
      neemt Onze Minister binnen twaalf weken na ontvangst een besluit als bedoeld in [artikel 13i, tweede lid][ref3].

      6 Indien de beoordeling volgens Onze Minister voldoet aan de regels, bedoeld in [artikel 13h][ref4], en die
      regels op de juiste wijze zijn toegepast, en uit de beoordeling blijkt dat het gebouw niet aan de veiligheidsnorm
      voldoet, is [artikel 13i, vierde lid][ref5], van overeenkomstige toepassing, tenzij toepassing wordt gegeven aan
      [artikel 13ib, eerste lid][ref6].

      7 De eigenaar van een gebouw die ervoor kiest om de beoordeling in eigen beheer te laten plaatsvinden, kan tijdens
      de uitvoering hiervan ervoor kiezen deze alsnog door Onze Minister te laten plaatsvinden. Indien nodig wordt daarop
      de vergoeding, bedoeld in het derde lid, aangepast.

      8 Bij ministeriële regeling kunnen regels worden gesteld over de vergoeding, bedoeld in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Artikel13i
