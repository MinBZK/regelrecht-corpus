  - number: 13d
    text: |-
      De inspecteur-generaal der mijnen kan aan Onze Minister gevraagd en ongevraagd adviezen verstrekken over de
      uitvoering van de versterkingsmaatregelen in relatie tot de veiligheid.
    url: https://wetten.overheid.nl/BWBR0043252/2026-01-22#Artikel13d
  - number: 13e
    text: |-
      1 Onze Minister stelt risicoprofielen vast van gebouwen waarvoor nog geen beoordeling als bedoeld in
      [artikel 13i, eerste lid][ref1], heeft plaatsgevonden en actualiseert deze risicoprofielen, indien nodig,
      jaarlijks.

      2 Bij de actualisatie van de risicoprofielen krijgt een gebouw waarvoor een risicoprofiel is vastgesteld, niet een
      lager risicoprofiel.

      3 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over het vaststellen van een
      risicoprofiel en de actualisatie daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Artikel13i
    url: https://wetten.overheid.nl/BWBR0043252/2026-01-22#Artikel13e
