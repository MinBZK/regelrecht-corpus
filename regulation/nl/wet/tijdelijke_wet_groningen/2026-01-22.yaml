      Aanvragen om vergoeding van schade worden door het Instituut niet in behandeling genomen indien de aanvrager ten
      aanzien van de schade op het moment van inwerkingtreding van deze wet partij is bij:

      a. de overeenkomst Groningen-NAM inzake regeling vergoeding kosten bodemdaling aardgaswinning 1983, of

      b. de overeenkomst Rijk-NAM inzake regeling vergoeding kosten bodemdaling aardgaswinning 1983.
    url: https://wetten.overheid.nl/BWBR0043252/2026-01-22#Artikel22
  - number: 22a
    text: |-
      1 Degene die voorafgaand aan de inwerkingtreding van deze wet is benoemd als lid van de Tijdelijke Commissie
      Mijnbouwschade Groningen, is van rechtswege benoemd als lid van het Instituut en de duur van zijn benoeming wordt
      vastgesteld op vier jaar.

      2 Degene die voorafgaand aan de inwerkingtreding van deze wet is benoemd als voorzitter van Tijdelijke Commissie
      Mijnbouwschade Groningen, is van rechtswege benoemd als voorzitter van het Instituut en de duur van zijn benoeming
      wordt vastgesteld op vier jaar.

      3 Voor het bepalen van het tijdvak van de benoeming, bedoeld in [artikel 4, zesde lid][ref1], geldt het
      tijdvak, vervuld als lid of voorzitter van de Tijdelijke Commissie Mijnbouwschade Groningen, voorafgaand aan de
      inwerkingtreding van deze wet als een tijdvak, vervuld als lid of voorzitter van het Instituut.


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Artikel4
