  - number: '17'
    text: |-
      1 Tenzij de Hoge Raad, gehoord de procureur-generaal, dan wel de Afdeling
      bestuursrechtspraak, indien van toepassing na het uitbrengen van een conclusie overeenkomstig
      [artikel 8:12a van de Algemene wet bestuursrecht][ref1], aanstonds beslist overeenkomstig het tiende lid, stelt zij
      partijen in de gelegenheid om binnen een door haar te bepalen termijn schriftelijk opmerkingen te maken.

      2 De Hoge Raad dan wel de Afdeling bestuursrechtspraak kan bepalen dat ook anderen dan partijen binnen een daartoe
      te bepalen termijn in de gelegenheid worden gesteld om schriftelijke opmerkingen te maken. De aankondiging hiervan
      geschiedt op een door de Hoge Raad dan wel de Afdeling bestuursrechtspraak te bepalen wijze.

      3 Schriftelijke opmerkingen worden ter griffie van de Hoge Raad dan wel de Afdeling bestuursrechtspraak ingediend.
      De griffier zendt onverwijld een afschrift aan partijen.

      4 Indien het belang van de zaak dit geraden doet voorkomen, kan de Hoge Raad dan wel de Afdeling
      bestuursrechtspraak, hetzij ambtshalve, hetzij op een daartoe strekkend verzoek, een termijn bepalen voor
      mondelinge of schriftelijke toelichting door partijen. De Hoge Raad dan wel de Afdeling bestuursrechtspraak kan,
      indien een mondelinge toelichting is bevolen, degenen die ingevolge het tweede lid schriftelijke opmerkingen hebben
      gemaakt, uitnodigen ter zitting aanwezig te zijn teneinde over hun opmerkingen te worden gehoord.

      5 Een schriftelijke toelichting wordt door de partij ondertekend en ter griffie van de Hoge Raad dan wel de
      Afdeling bestuursrechtspraak ingediend.

      6 Na het verstrijken van de termijn voor het maken van schriftelijke opmerkingen, dan wel na de
      mondelinge of schriftelijke toelichting, neemt de procureur-generaal bij de Hoge Raad conclusie
      dan wel kan de voorzitter van de Afdeling bestuursrechtspraak, onder overeenkomstige toepassing van
      [artikel 8:12a van de Algemene wet bestuursrecht][ref2], één van haar leden verzoeken een conclusie te nemen,
      hetzij onmiddellijk, hetzij op een daartoe te bepalen dag. De griffier zendt onverwijld een afschrift van de
      conclusie aan partijen. Partijen kunnen binnen twee weken na verzending van het afschrift van de conclusie hun
      schriftelijk commentaar daarop doen toekomen aan de Hoge Raad dan wel de Afdeling bestuursrechtspraak.

      7 De Hoge Raad dan wel de Afdeling bestuursrechtspraak bepaalt de dag waarop de Hoge Raad dan wel de Afdeling
      bestuursrechtspraak zal beslissen:

      a. na het verstrijken van de termijn voor het maken van schriftelijke opmerkingen, dan wel na de mondelinge of
      schriftelijke toelichting, indien door de voorzitter van Afdeling bestuursrechtspraak geen gebruik is gemaakt van
      de mogelijkheid bedoeld in het zesde lid, of

      b. nadat de procureur-generaal bij de Hoge Raad dan wel het daartoe op grond van het zesde lid verzochte lid van
      Afdeling bestuursrechtspraak conclusie heeft genomen.

      8 De Hoge Raad dan wel de Afdeling bestuursrechtspraak kan de vraag herformuleren. Tenzij de herformulering van
      ondergeschikte betekenis is, stelt de Hoge Raad dan wel de Afdeling bestuursrechtspraak partijen in de gelegenheid
      om binnen een door de Hoge Raad dan wel de Afdeling bestuursrechtspraak te bepalen termijn schriftelijke
      opmerkingen te maken.

      9 De Afdeling bestuursrechtspraak zendt de vraag door naar de Hoge Raad indien de vraagstelling de toepassing
      van bepalingen uit het Burgerlijk Wetboek betreft. De Hoge Raad zendt de vraag door naar de Afdeling
      bestuursrechtspraak indien de vraagstelling niet de toepassing van bepalingen uit het Burgerlijk Wetboek betreft.

      10 De Hoge Raad dan wel de Afdeling bestuursrechtspraak ziet af van beantwoording indien de Hoge Raad, gehoord de
      procureur-generaal, dan wel de Afdeling bestuursrechtspraak oordeelt dat de vraag zich niet voor beantwoording bij
      wijze van prejudiciële uitspraak leent of de vraag van onvoldoende gewicht is om beantwoording te rechtvaardigen.
      De Hoge Raad dan wel de Afdeling bestuursrechtspraak kan zich bij de vermelding van de gronden van de uitspraak
      beperken tot dit oordeel.

      11 Indien het antwoord op de vraag, nadat deze is gesteld, niet meer nodig is om in de procedure, bedoeld
      in [artikel 16, eerste lid][ref3], op het beroep te beslissen, kan de Hoge Raad dan wel de Afdeling
      bestuursrechtspraak, indien dat de Hoge Raad dan wel de Afdeling bestuursrechtspraak geraden voorkomt, de vraag
      desondanks beantwoorden met het oog op aanhangige beroepen in soortgelijke zaken.

      12 De Hoge Raad dan wel de Afdeling bestuursrechtspraak begroot in de uitspraak, onder overeenkomstige toepassing
      van het bepaalde bij en krachtens [artikel 8:75 van de Algemene wet bestuursrecht][ref4], de kosten die partijen
      ingevolge dit artikel hebben gemaakt.

      13 De griffier zendt onverwijld een afschrift van de uitspraak aan de rechtbank en aan partijen. De griffier zendt
      daarbij eveneens een afschrift van de genomen conclusie, indien van toepassing, en van de schriftelijke opmerkingen
      en toelichtingen, bedoeld in het eerste, tweede en vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel812a
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel812a
      [ref3]: https://wetten.overheid.nl/BWBR0043252#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel875
