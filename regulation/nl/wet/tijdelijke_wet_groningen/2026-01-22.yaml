        bwb_id: BWBR0043252
        artikel: 13i
        hoofdstuk: '5'
  - number: 13f
    text: |-
      1 Onze Minister zendt een overzicht van de risicoprofielen van gebouwen, bedoeld in
      [artikel 13e, eerste lid][ref1], toe aan het betrokken college en aan de inspecteur-generaal der mijnen.

      2 Op verzoek van de eigenaar verstrekt Onze Minister het risicoprofiel van het gebouw aan de eigenaar nadat dit is
      vastgesteld en informeert de eigenaar over het verdere verloop van de versterking van zijn gebouw.


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Artikel13e
    url: https://wetten.overheid.nl/BWBR0043252/2026-01-22#Artikel13f
