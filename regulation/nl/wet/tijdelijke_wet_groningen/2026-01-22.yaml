  - number: 13m
    text: |-
      1 Onze Minister kan aan de rechtmatige gebruiker van een gebouw, niet zijnde de eigenaar, een vergoeding
      verstrekken voor de door hem geleden schade die een direct gevolg is van:

      a. de beoordeling of het gebouw aan de veiligheidsnorm voldoet; en

      b. de voorbereiding en uitvoering van de versterkingsmaatregelen.

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld inzake de gebruikers die in aanmerking komen voor
      vergoeding alsmede de gegevens die de gebruiker op verzoek van Onze Minister overlegt voor het vaststellen van de
      hoogte van de vergoeding en de wijze waarop de hoogte van de vergoeding wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0043252/2026-01-22#Artikel13m
  - number: 13n
    text: |-
      1 Als een bijzonder doeleinde als bedoeld in [artikel 37b van de Wet op de rechtsbijstand][ref1] waarvoor het
      bestuur van de raad voor rechtsbijstand, bedoeld in [artikel 2 van de Wet op de rechtsbijstand][ref2], subsidie
      verstrekt, wordt aangemerkt het verlenen van rechtsbijstand overeenkomstig de Wet op de rechtsbijstand aan een
      eigenaar van een gebouw bij:

      a. het proces, bedoeld in [artikel 2][ref3], vanaf het indienen van een zienswijze in het kader van de aanvraag om
      vergoeding van schade bij het Instituut

      b. de versterking, bedoeld in [hoofdstuk 5][ref4], vanaf de ontvangst van de beoordeling, bedoeld in
      [artikel 13i, derde lid][ref5].

      2 Het inroepen van advies van een bouwkundige, bodemdeskundige, ecoloog, hydroloog of financiële deskundige in het
      kader van het verlenen van rechtsbijstand, bedoeld in het eerste lid, wordt aangemerkt als een bijzonder doeleinde
      waarvoor het bestuur van de raad voor rechtsbijstand met het oog op de verlening van rechtsbijstand een subsidie
      verstrekt als bedoeld in [artikel 37c van de Wet op de rechtsbijstand][ref6].

      3 Onze Minister voor Rechtsbescherming verleent de goedkeuring, bedoeld in
      [artikel 37b, vijfde lid, van de Wet op de rechtsbijstand][ref7] aan de krachtens artikel 37b, derde lid, of
      [artikel 37c van de Wet op de rechtsbijstand][ref8] vast te stellen regels voor de verstrekking van de subsidies,
      bedoeld in het eerste en tweede lid, niet eerder dan vier weken nadat het ontwerpbesluit tot goedkeuring van
      de door het bestuur van de raad voor rechtsbijstand te stellen regels aan beide Kamers der Staten-Generaal is
      overgelegd.

      4 Het Instituut verstrekt aan de eigenaar van een gebouw een vergoeding voor de kosten die hij maakt voor
      bouwkundig, bodemkundig, ecologisch, hydrologisch en financieel advies ten behoeve van het proces, bedoeld in
      [artikel 2][ref9], vanaf het indienen van een zienswijze in het kader van de aanvraag om vergoeding van schade,
      indien dit advies niet wordt ingeroepen in het kader van het verlenen van rechtsbijstand.

      5 Onze Minister verstrekt aan de eigenaar van een gebouw een vergoeding voor de kosten die hij maakt voor
      bouwkundig, bodemkundig, ecologisch, hydrologisch en financieel advies ten behoeve van de versterking, bedoeld in
      [hoofdstuk 5][ref10], vanaf de ontvangst van de beoordeling, bedoeld in [artikel 13i, derde lid][ref11], en de
      uitvoering van de versterkingsmaatregelen, indien dit advies niet wordt ingeroepen in het kader van het verlenen
      van rechtsbijstand.

      6 Bij algemene maatregel van bestuur kunnen het eerste en vijfde lid van overeenkomstige toepassing worden
      verklaard ten aanzien van besluiten tot versterking van gebouwen of onderdelen daarvan waarop [hoofdstuk 5][ref12],
      op grond van [artikel 13a, tweede lid][ref13], niet van toepassing is verklaard. De voordracht voor een krachtens
      dit lid vast te stellen algemene maatregel van bestuur wordt niet eerder gedaan dan vier weken nadat het ontwerp
      aan beide Kamers der Staten-Generaal is overgelegd.

      7 Bij regeling van Onze Minister worden nadere regels gesteld over het verstrekken van de vergoeding, bedoeld in
      het vierde en vijfde lid.


