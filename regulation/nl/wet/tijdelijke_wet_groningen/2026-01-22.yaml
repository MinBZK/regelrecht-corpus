    text: |-
      De leden van het Instituut, het personeel van het Instituut en de door het Instituut ingeschakelde deskundigen
      verlangen of ontvangen van derden geen instructies die op een individuele zaak betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0043252/2026-01-22#Artikel7
  - number: '8'
    text: |-
      1 Het Instituut stelt een bestuursreglement vast.

      2 Het bestuursreglement bevat regels over:

      a. de wijze van inrichting van het Instituut;

      b. de wijze van besluitvorming;

      c. het financiële beheer;

      d. de administratieve organisatie;

      e. vervanging van leden; en

      f. vertegenwoordigingsbevoegdheid.

      3 Het Instituut maakt het reglement na de goedkeuring, bedoeld in
      [artikel 11 van de Kaderwet zelfstandige bestuursorganen][ref1], bekend in de Staatscourant.


