  - number: 15a
    text: |-
      1 In dit artikel wordt verstaan onder:

        - *batch 1.588:* door de Nationaal Coördinator Groningen benoemde batch van 1.588 gebouwen waarvoor
      versterkingsadviezen zijn opgesteld.

      2 Onze Minister verstrekt jaarlijks aan de gemeenten Eemsdelta, Groningen en Midden-Groningen een uitkering als
      bedoeld in [artikel 15a van de Financiële-verhoudingswet][ref1] om de gemeenten van middelen te voorzien ten
      behoeve van het versterken van gebouwen in batch 1.588.

      3 De gemeenten besteden de uitkering uitsluitend aan:

      a. werkzaamheden voor de versterking van de gebouwen in batch 1.588;

      b. het verstrekken van subsidies voor de versterking van de gebouwen in batch 1.588.

      4 De subsidie, bedoeld in het derde lid, onderdeel b, wordt vastgesteld op een bedrag zodat de eigenaar
      overeenkomstig de versterkingsadviezen de versterkingsmaatregelen kan laten uitvoeren dan wel tot sloop en
      nieuwbouw kan overgaan en het gebouw na de uitvoering van die maatregelen of na de sloop en nieuwbouw van dezelfde
      aard is en ten minste vergelijkbare gebruiksoppervlakte en gebruiksmogelijkheden heeft als de situatie voor de
      uitvoering van die maatregelen of voor de sloop en nieuwbouw, tenzij op verzoek van de eigenaar andere maatregelen
      worden genomen.

      5 Bij ministeriële regeling worden regels gesteld over de uitkering, bedoeld in het tweede lid. Deze regels zien
      ten minste op de vaststelling van de hoogte van de uitkering, de verdeling, de voorwaarden waaronder deze verstrekt
      wordt en de terugvordering van niet of niet rechtmatig bestede middelen.


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel15a
