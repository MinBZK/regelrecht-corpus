  - number: 2a
    text: |-
      1 Onze Minister is aanspreekpunt voor eigenaren van gebouwen die versterking behoeven en coördineert de versterking
      van gebouwen, bedoeld in [hoofdstuk 5][ref1].

      2 Onze Minister neemt alle beslissingen die redelijkerwijs nodig zijn voor de versterking van gebouwen, bedoeld
      in [hoofdstuk 5][ref2].

      3 Onze Minister en het Instituut werken nauw samen en stemmen de uitvoering van de versterking op grond van
      [hoofdstuk 5][ref3] en de vergoeding van de schade op grond van [hoofdstuk 2][ref4] op elkaar af, tenzij eigenaren
      aangeven dat ze deze afstemming niet willen.

      4 Indien de eigenaar van een gebouw dat wenst, wordt de vergoeding van de schade en de versterking van zijn gebouw
      in samenhang behandeld. De eigenaar krijgt de keuze om de vergoeding van de schade, bedoeld in [hoofdstuk 2][ref5],
      en de versterking van zijn gebouw, bedoeld in [hoofdstuk 5][ref6], te laten coördineren door Onze Minister of door
      het Instituut.


