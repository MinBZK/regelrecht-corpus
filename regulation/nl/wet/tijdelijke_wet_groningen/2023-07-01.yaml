publication_date: '2023-05-15'
valid_from: '2023-07-01'
bwb_id: BWBR0043252
url: https://wetten.overheid.nl/BWBR0043252/2023-07-01
preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de bestuursrechtelijke afhandeling van verzoeken om
    vergoeding van schade in verband met bodembeweging door de gaswinning uit het Groningenveld en gasopslag bij Norg
    wettelijk te regelen;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *exploitant:* exploitant van een
      mijnbouwwerk ten behoeve van het winnen van gas uit het Groningenveld of van de gasopslag te Norg of de gasopslag
      bij Grijpskerk;
        - *gebouw:* bouwwerk dat een voor mensen toegankelijke overdekte geheel of gedeeltelijk met wanden omsloten ruimte
      vormt;
        - *Instituut:* het Instituut Mijnbouwschade Groningen;
        - *Onze Minister:* Onze Minister van Economische Zaken en Klimaat;
        - *schade:* schade die is ontstaan door beweging van de bodem als gevolg van de aanleg of exploitatie van een
      mijnbouwwerk ten behoeve van het winnen van gas uit het Groningenveld of als gevolg van de gasopslag Norg of de
      gasopslag bij Grijpskerk;
        - *veiligheidsnorm:* veiligheidsnorm, bedoeld in [artikel 52d, tweede lid, onderdeel a, van de Mijnbouwwet][ref1];
        - *versterkingsbesluit:* besluit als bedoeld in [artikel 13j, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel52d
      [ref2]: https://wetten.overheid.nl/BWBR0043252#Artikel13j
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 52d
      - id: ref2
        bwb_id: BWBR0043252
        artikel: 13j
        hoofdstuk: '5'
  - number: '2.1'
    text: |-
      Er is een Instituut Mijnbouwschade Groningen. Het Instituut is gevestigd op een door Onze Minister te bepalen
      locatie.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel2
  - number: '2.2'
    text: Het Instituut vervult zijn taken en bevoegdheden in onafhankelijkheid.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel2
  - number: '2.3'
    text: 'Het Instituut:'
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel2
  - number: 2.3.a
    text: 'heeft tot taak en is bevoegd schade af te handelen en daartoe:'
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel2
  - number: 2.3.a.1°
    text: |-
      aanvragen in behandeling te nemen, voor zover de aanvrager zijn vordering tot vergoeding van schade op de
      exploitant ter zake van de schade waarvoor vergoeding wordt aangevraagd aan de Staat heeft overgedragen;
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel2
  - number: 2.3.a.2°
    text: de aanspraak op een vergoeding van schade vast te stellen, en
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel2
  - number: 2.3.a.3°
    text: |-
      de omvang van de vergoeding van schade of, indien de aanvrager dit wenst en de schade zich daarvoor leent, de te
      treffen maatregelen in natura vast te stellen;
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel2
  - number: 2.3.b
    text: |-
      heeft tot taak om schade te vergoeden en daartoe aan de aanvrager de vastgestelde vergoeding uit te keren of,
      indien de aanvrager dit wenst en de schade zich daarvoor leent, de te treffen maatregelen in natura uit te voeren;
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel2
  - number: 2.3.c
    text: |-
      heeft tot taak een vergoeding voor overlast van ten hoogste een bij of krachtens algemene maatregel van bestuur
      vastgesteld bedrag toe te kennen.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel2
  - number: '2.4'
    text: |-
      Het Instituut is niet bevoegd om een aanvraag om vergoeding van schade te behandelen indien deze schade betreft
      waarvoor:
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel2
  - number: 2.4.a
    text: |-
      voor 31 maart 2017, 12:00 uur een schademelding – of claim is voorgelegd aan het Centrum Veilig Wonen of de
      exploitant;
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel2
  - number: 2.4.b
    text: door de exploitant met de gedupeerde of diens vertegenwoordiger een vaststellingsovereenkomst is gesloten;
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel2
  - number: 2.4.c
    text: |-
      door de gedupeerde of diens vertegenwoordiger met de exploitant onderhandeld wordt met het doel te komen tot een
      vergoeding van de schade;
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel2
  - number: 2.4.d
    text: |-
      een vordering is ingesteld bij de burgerlijke rechter, tenzij de vordering bij de burgerlijke rechter met
      instemming van de gedaagde door de aanvrager wordt ingetrokken; of
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel2
  - number: 2.4.e
    text: de burgerlijke rechter uitspraak heeft gedaan over de aanspraak op en de omvang van de vergoeding van de schade.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel2
  - number: '2.5'
    text: |-
      Het Instituut kan, indien bijzondere omstandigheden daartoe aanleiding geven, afwijken van het bepaalde in het
      vierde lid, onder a en b, ten einde onbillijkheden van overwegende aard te voorkomen.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel2
  - number: '2.6'
    text: |-
      Het Instituut voert deze taken en bevoegdheden uit met toepassing
      van de bepalingen van het [Burgerlijk Wetboek][ref1], uitgezonderd
      [artikel 178, aanhef en onderdeel c, van Boek 6 van het Burgerlijk Wetboek][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005289
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel178
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005289
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '178'
  - number: '2.7'
    text: |-
      Indien de aanvrager in de aanvraag aangeeft dat er sprake is van een acuut onveilige situatie of het Instituut op
      basis van de aanvraag zelf het vermoeden heeft dat er sprake is van een acuut onveilige situatie:
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel2
  - number: 2.7.a
    text: |-
      inspecteert het Instituut de situatie onmiddellijk, maar in ieder geval binnen 48 uur na indiening van de aanvraag,
      en treft in overleg met de aanvrager de in het belang van de veiligheid noodzakelijke maatregelen, en
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel2
  - number: 2.7.b
    text: |-
      informeert het Instituut, ten behoeve van de toepassing van de [Woningwet][ref1] in het belang van de veiligheid,
      de betreffende burgemeester binnen 48 uur over het bestaan van de acuut onveilige situatie en de getroffen of te
      treffen maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005181
  - number: '2.8'
    text: |-
      Bij algemene maatregel van bestuur kunnen aan het Instituut andere taken en bevoegdheden worden opgedragen, die
      samenhangen met de taken en bevoegdheden, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel2
  - number: '2.9'
    text: |-
      Het Instituut is bevoegd om ter uitvoering van zijn taken en bevoegdheden op grond van deze wet met
      het oog op voorkoming of beperking van schade maatregelen te treffen of vergoedingen uit te keren die
      leiden tot versterking van een gebouw, voor zover dit geen versterkingsmaatregelen betreft als bedoeld in
      [artikel 13j, eerste lid, onderdeel a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Artikel13j
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0043252
        artikel: 13j
        hoofdstuk: '5'
  - number: '2.10'
    text: |-
      Naast de schade, bedoeld in [artikel 184 van Boek 6 van het Burgerlijk Wetboek][ref1], kan het Instituut aan
      de aanvrager een in redelijkheid te bepalen tegemoetkoming in geld of in natura toekennen voor iedere redelijke
      maatregel die nodig is om te bewerkstelligen dat de schade waarvoor vergoeding wordt toegekend, duurzaam kan worden
      hersteld. Aan de toekenning van deze tegemoetkoming kan het Instituut voorwaarden verbinden.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel184
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '184'
  - number: '2.11'
    text: |-
      Bij ministeriële regeling kan aan het Instituut de taak worden opgedragen knelpunten op te lossen die als gevolg
      van de schade zijn ontstaan.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel2
  - number: '2.12'
    text: |-
      Bij ministeriële regeling wordt de hoogte van de financiële middelen vastgesteld voor de uitgaven van het Instituut
      inzake tegemoetkomingen als bedoeld in het tiende lid en het oplossen van knelpunten als bedoeld in het elfde lid.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel2
  - number: 2a.1
    text: |-
      Onze Minister is aanspreekpunt voor eigenaren van gebouwen die versterking behoeven en coördineert de versterking
      van gebouwen, bedoeld in [hoofdstuk 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0043252
        hoofdstuk: '5'
  - number: 2a.2
    text: |-
      Onze Minister neemt alle beslissingen die redelijkerwijs nodig zijn voor de versterking van gebouwen, bedoeld in
      [hoofdstuk 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0043252
        hoofdstuk: '5'
  - number: 2a.3
    text: |-
      Onze Minister en het Instituut werken nauw samen en stemmen de uitvoering van de versterking op grond van
      [hoofdstuk 5][ref1] en de vergoeding van de schade op grond van [hoofdstuk 2][ref2] op elkaar af, tenzij eigenaren
      aangeven dat ze deze afstemming niet willen.


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0043252#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0043252
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0043252
        hoofdstuk: '2'
  - number: 2a.4
    text: |-
      Indien de eigenaar van een gebouw dat wenst, wordt de vergoeding van de schade en de versterking van zijn gebouw
      in samenhang behandeld. De eigenaar krijgt de keuze om de vergoeding van de schade, bedoeld in [hoofdstuk 2][ref1],
      en de versterking van zijn gebouw, bedoeld in [hoofdstuk 5][ref2], te laten coördineren door Onze Minister of door
      het Instituut.


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0043252#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0043252
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0043252
        hoofdstuk: '5'
  - number: '3.1'
    text: |-
      Ten behoeve van de goede uitvoering van [artikel 2, derde en vierde lid][ref1], verwerkt het Instituut de nodige
      gegevens, waaronder persoonsgegevens. Het Instituut is verwerkingsverantwoordelijke voor deze verwerking.


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Artikel2
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0043252
        artikel: '2'
        hoofdstuk: '2'
  - number: '3.2'
    text: |-
      Ten behoeve van de goede uitwerking van [artikel 2, derde en vierde lid][ref1], verwerkt de exploitant de nodige
      gegevens, waaronder persoonsgegevens. De exploitant is verwerkingsverantwoordelijke voor deze verwerking.


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Artikel2
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0043252
        artikel: '2'
        hoofdstuk: '2'
  - number: '3.3'
    text: |-
      Gelet op artikel 9, tweede lid, onderdeel g, van de Algemene verordening gegevensbescherming is het verbod om
      gegevens over gezondheid te verwerken niet van toepassing indien de verwerking geschiedt door het Instituut of
      de exploitant voor zover deze verwerking noodzakelijk is in het belang van de goede uitvoering en uitwerking van
      [artikel 2, derde en vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Artikel2
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0043252
        artikel: '2'
        hoofdstuk: '2'
  - number: '3.4'
    text: |-
      Het Instituut en de exploitant verstrekken elkaar desgevraagd de informatie, waaronder begrepen de
      persoonsgegevens, bedoeld in het eerste, tweede en derde lid, voor zover die noodzakelijk is in het belang van de
      goede uitvoering van [artikel 2, derde, vierde en zevende lid][ref1], of van de taken en bevoegdheden die op grond
      van artikel 2, achtste lid, aan het Instituut zijn opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Artikel2
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0043252
        artikel: '2'
        hoofdstuk: '2'
  - number: '3.5'
    text: |-
      Het Instituut, Onze Minister en het college van burgemeester en wethouders van de betrokken gemeenten verstrekken
      elkaar desgevraagd of eigener beweging de gegevens, waaronder persoonsgegevens, over de afhandeling van aanvragen
      om schadevergoeding en beslissingen in het kader van de uitvoering van de versterkingsoperatie die noodzakelijk
      zijn voor een goede uitvoering van deze wettelijke taak.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel3
  - number: '3.6'
    text: |-
      Het Instituut informeert Onze Minister en het college van burgemeester en wethouders van de betrokken gemeenten
      indien het gegronde vermoedens heeft dat een gebouw niet voldoet aan de veiligheidsnorm.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel3
  - number: '3.7'
    text: |-
      Onze Minister informeert het Instituut indien hij gegronde vermoedens heeft dat sprake is van een acuut onveilige
      situatie als bedoeld in [artikel 2, zevende lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Artikel2
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0043252
        artikel: '2'
        hoofdstuk: '2'
  - number: '3.8'
    text: |-
      Het Instituut, Onze Minister en het college van burgemeester en wethouders van de betrokken gemeenten verstrekken
      niet de gegevens over gezondheid.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel3
  - number: '3.9'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld over de wijze waarop Onze Minister en het Instituut
      de uitvoering van de versterking op grond van [hoofdstuk 5][ref1] en de vergoeding van schade op grond van
      [hoofdstuk 2][ref2] op elkaar afstemmen. De voordracht voor een krachtens dit lid vast te stellen algemene
      maatregel van bestuur wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-
      Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0043252#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0043252
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0043252
        hoofdstuk: '2'
  - number: '3.10'
    text: |-
      De exploitant verstrekt Onze Minister desgevraagd de gegevens, waaronder persoonsgegevens, voor zover die
      noodzakelijk zijn in het belang van een goede uitvoering van de versterking op grond van [hoofdstuk 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0043252
        hoofdstuk: '5'
  - number: '4.1'
    text: Het Instituut bestaat uit ten minste drie en ten hoogste vijf leden, onder wie de voorzitter.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel4
  - number: '4.2'
    text: |-
      In afwijking van [artikel 12, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref1] worden de leden
      van het Instituut benoemd, geschorst en ontslagen bij koninklijk besluit, op voordracht van Onze Minister voor
      Rechtsbescherming.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel12
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '12'
  - number: '4.3'
    text: 'Schorsing en ontslag vinden plaats wegens:'
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel4
  - number: 4.3.a
    text: ongeschiktheid of onbekwaamheid voor de vervulde functie; of
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel4
  - number: 4.3.b
    text: andere zwaarwegende redenen gelegen in de persoon van de betrokkene.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel4
  - number: '4.4'
    text: De leden van het Instituut worden op eigen verzoek ontslagen door Onze Minister voor Rechtsbescherming.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel4
  - number: '4.5'
    text: |-
      De leden van het Instituut zijn onpartijdig en hun benoeming vindt plaats op grond van de deskundigheid die nodig
      is voor de uitoefening van de taken en bevoegdheden van het Instituut.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel4
  - number: '4.6'
    text: |-
      Benoeming vindt plaats voor een periode van ten hoogste vier jaar. De leden van het Instituut kunnen na afloop van
      deze periode aansluitend tweemaal opnieuw worden benoemd voor eenzelfde periode.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel4
  - number: '4.7'
    text: |-
      Een lid van een het Instituut meldt aan Onze Minister voor Rechtsbescherming alle omstandigheden die van invloed
      zijn of zouden kunnen zijn op hun onpartijdigheid of aanleiding kunnen geven tot een belangenconflict in het kader
      van de schadeafhandeling.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel4
  - number: '4.8'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de procedure omtrent
      benoeming, schorsing en ontslag en de rechtspositie van de leden van het Instituut.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel4
  - number: '5.1'
    text: Aan het Instituut staat ter ondersteuning van zijn taken en bevoegdheden een bureau ten dienste.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel5
  - number: '5.2'
    text: |-
      Onze Minister stelt ten behoeve van de ondersteuning van de uitvoering van taken en bevoegdheden van het Instituut
      voldoende en gekwalificeerd personeel aan het bureau van het Instituut ter beschikking.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel5
  - number: '6.1'
    text: |-
      Het Instituut kan voor de uitvoering of voorbereiding van bepaalde werkzaamheden commissies instellen, waarvan ook
      anderen dan leden van het Instituut deel uit kunnen maken.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel6
  - number: '6.2'
    text: |-
      Indien het Instituut aan een commissie mandaat verleent tot het nemen van besluiten op
      grond van [artikel 2, derde lid][ref1], zijn [artikel 3, derde en zesde lid][ref2], en
      [artikel 13 van de Kaderwet zelfstandige bestuursorganen][ref3] van overeenkomstige toepassing op de leden van
      de commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020495#Artikel13
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020495
        artikel: '13'
  - number: '7'
    text: |-
      De leden van het Instituut, het personeel van het Instituut en de door het Instituut ingeschakelde deskundigen
      verlangen of ontvangen van derden geen instructies die op een individuele zaak betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel7
  - number: '8.1'
    text: Het Instituut stelt een bestuursreglement vast.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel8
  - number: '8.2'
    text: 'Het bestuursreglement bevat regels over:'
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel8
  - number: 8.2.a
    text: de wijze van inrichting van het Instituut;
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel8
  - number: 8.2.b
    text: de wijze van besluitvorming;
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel8
  - number: 8.2.c
    text: het financiële beheer;
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel8
  - number: 8.2.d
    text: de administratieve organisatie;
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel8
  - number: 8.2.e
    text: vervanging van leden; en
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel8
  - number: 8.2.f
    text: vertegenwoordigingsbevoegdheid.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel8
  - number: '8.3'
    text: |-
      Het Instituut maakt het reglement na de goedkeuring, bedoeld in
      [artikel 11 van de Kaderwet zelfstandige bestuursorganen][ref1], bekend in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel11
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '11'
  - number: '9.1'
    text: |-
      [Artikel 22 van de Kaderwet zelfstandig bestuursorganen][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel22
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '22'
  - number: '9.2'
    text: |-
      Aan het jaarverslag, bedoeld in [artikel 18 van de Kaderwet zelfstandig bestuursorganen][ref1], worden in het
      belang van de transparantie omtrent de taakuitoefening en het gevoerde beleid bij algemene maatregel van bestuur
      nadere eisen gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel18
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '18'
  - number: '10.1'
    text: |-
      Het Instituut stelt, met inachtneming van de bepalingen van dit hoofdstuk, een procedure en een werkwijze vast voor
      de behandeling van aanvragen.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel10
  - number: '10.2'
    text: De procedure en werkwijze van het Instituut kennen een ruimhartige schadeafhandeling als uitgangspunt.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel10
  - number: '10.3'
    text: Het Instituut publiceert zijn procedure en werkwijze op zijn website.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel10
  - number: '11.1'
    text: |-
      Een aanvraag om vergoeding van schade wordt ingediend bij het Instituut via een door het Instituut vastgesteld
      formulier.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel11
  - number: '11.2'
    text: 'De aanvraag bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel11
  - number: 11.2.a
    text: de naam en het adres van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel11
  - number: 11.2.b
    text: de datum;
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel11
  - number: 11.2.c
    text: indien van toepassing, de aard en het adres van het gebouw waarop de aanvraag betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel11
  - number: 11.2.d
    text: indien mogelijk, de datum of een inschatting van de datum waarop de schade is ontstaan;
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel11
  - number: 11.2.e
    text: een aanduiding van de vermoedelijke oorzaak van de schade;
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel11
  - number: 11.2.f
    text: een beschrijving naar eigen inzicht van de aard en de omvang van de schade;
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel11
  - number: 11.2.g
    text: de inschatting van de aanvrager of er sprake zou kunnen zijn van een acuut onveilige situatie;
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel11
  - number: 11.2.h
    text: |-
      een verklaring van de aanvrager van overdracht aan de Staat van de vordering tot vergoeding van schade van de
      aanvrager op de exploitant ter zake van de schade waarvoor vergoeding wordt aangevraagd.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel11
  - number: '12.1'
    text: |-
      Het Instituut kan ten behoeve van een besluit één of meerdere deskundigen aanwijzen om schade op te nemen en te
      rapporteren over de aard van de schade in het licht van de door het Instituut te maken beoordeling.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel12
  - number: '12.2'
    text: |-
      De deskundige brengt binnen een door het Instituut gestelde termijn die ten hoogste zes maanden na de aanwijzing
      van de deskundige bedraagt een advies uit over zijn bevindingen.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel12
  - number: '12.3'
    text: |-
      Indien de deskundige binnen de gestelde termijn geen advies kan uitbrengen, deelt de deskundige dit, onder opgaaf
      van redenen, aan het Instituut mee voor het einde van de termijn en kan het Instituut de termijn met ten hoogste
      zes maanden verlengen. Het Instituut stelt de aanvrager daarvan schriftelijk in kennis.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel12
  - number: '12.4'
    text: |-
      Indien de aanvrager tegen het besluit, bedoeld in [artikel 13, eerste lid][ref1], in bezwaar gaat, wijst het
      Instituut ambtshalve of op verzoek een deskundige aan, anders dan die bedoeld in het eerste lid, die de aanvrager
      kan bijstaan, tenzij de zaak waarop het betrekking heeft hier evident geen aanleiding voor geeft.


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Artikel13
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0043252
        artikel: '13'
        hoofdstuk: '4'
  - number: '12.5'
    text: |-
      Het Instituut stelt eisen aan de deskundige, waaronder begrepen het aantal keren dat de deskundige
      per aanvraag mag onderzoeken of de schade evident en aantoonbaar uitsluitend een andere oorzaak heeft
      dan beweging van de bodem als gevolg van de aanleg of exploitatie van een mijnbouwwerk als bedoeld in
      [artikel 177a, eerste lid, van Boek 6 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel177a
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: 177a
  - number: '13.1'
    text: 'Het Instituut neemt een besluit over vergoeding van schade uiterlijk binnen:'
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13
  - number: 13.1.a
    text: |-
      8 weken na ontvangst van de aanvraag, indien op deze aanvraag wordt beslist zonder dat onderzoek is verricht door
      een door het Instituut aangewezen deskundige, of
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13
  - number: 13.1.b
    text: 12 weken na ontvangst van het deskundigenadvies.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13
  - number: '13.2'
    text: |-
      De termijn, genoemd in het eerste lid, onderdeel a, kan door het Instituut worden verlengd indien het Instituut
      als gevolg van het grote aantal ontvangen of verwachte aanvragen voor een schadesoort niet in staat is de aanvragen
      binnen die termijn af te handelen. Het Instituut informeert de aanvrager schriftelijk binnen twee weken na
      ontvangst van zijn aanvraag binnen welke termijn een besluit wordt genomen op zijn aanvraag.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13
  - number: 13a.1
    text: |-
      Dit hoofdstuk, met uitzondering van [artikel 13ba][ref1], is uitsluitend van toepassing op gebouwen in de gemeenten
      Eemsdelta, Groningen, Het Hogeland, Midden-Groningen en Oldambt.


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Artikel13ba
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0043252
        artikel: 13ba
        hoofdstuk: '5'
  - number: 13a.2
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald dat dit hoofdstuk niet van toepassing is, of onderdelen daarvan
      niet van toepassing zijn, op gebouwen of categorieën van gebouwen waarvoor op een andere wijze in de versterking
      wordt voorzien.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13a
  - number: 13a.3
    text: |-
      In afwijking van het eerste lid kan Onze Minister onderzoeken of een gebouw dat niet gelegen is in de in dat
      lid genoemde gemeenten mogelijk versterking behoeft, indien er een redelijk vermoeden bestaat dat het gebouw
      versterkt moet worden in verband met de gevolgen van beweging van de bodem door aanleg of exploitatie van een
      mijnbouwwerk ten behoeve van het winnen van gas uit het Groningenveld of als gevolg van de gasopslag bij Norg of
      de gasopslag bij Grijpskerk. Indien uit het onderzoek blijkt dat het gebouw mogelijk versterking behoeft, zijn de
      [artikelen 13h tot en met 13m][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Artikel13h
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0043252
        artikel: 13h
        hoofdstuk: '5'
  - number: 13b
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder: - *Adviescollege:* het Adviescollege
      Veiligheid Groningen, bedoeld in [artikel 13c][ref1];
        - *beschermd monument:* monument als bedoeld in [artikel 1.1 van de Erfgoedwet][ref2] dat op grond van een
      gemeentelijke verordening is aangewezen of een rijksmonument;
        - *college:* college van burgemeester en wethouders van de gemeente Eemsdelta, Groningen, Het Hogeland, Midden-
      Groningen of Oldambt;
        - *programma:* programma van aanpak als bedoeld in [artikel 13g, eerste lid][ref3];
        - *rijksmonument:* monument als bedoeld in [artikel 1.1 van de Erfgoedwet][ref4];
        - *risicoprofiel:* risicoprofiel als bedoeld in [artikel 13e, eerste lid][ref5];
        - *versterkingsmaatregelen:* maatregelen als bedoeld in [artikel 13j, eerste lid, onderdeel a][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Artikel13c
      [ref2]: https://wetten.overheid.nl/BWBR0037521#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0043252#Artikel13g
      [ref4]: https://wetten.overheid.nl/BWBR0037521#Artikel1
      [ref5]: https://wetten.overheid.nl/BWBR0043252#Artikel13e
      [ref6]: https://wetten.overheid.nl/BWBR0043252#Artikel13j
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13b
    references:
      - id: ref1
        bwb_id: BWBR0043252
        artikel: 13c
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0037521
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0043252
        artikel: 13g
        hoofdstuk: '5'
      - id: ref4
        bwb_id: BWBR0037521
        artikel: '1'
      - id: ref5
        bwb_id: BWBR0043252
        artikel: 13e
        hoofdstuk: '5'
      - id: ref6
        bwb_id: BWBR0043252
        artikel: 13j
        hoofdstuk: '5'
  - number: 13ba
    text: |-
      Onze Minister neemt alle maatregelen die redelijkerwijs van hem gevergd kunnen worden om te voorkomen dat als
      gevolg van de gaswinning uit het Groningenveld de veiligheid wordt geschaad.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13ba
  - number: 13c.1
    text: Er is een Adviescollege Veiligheid Groningen.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13c
  - number: 13c.2
    text: Het Adviescollege bestaat uit ten minste drie en ten hoogste vijf leden, onder wie de voorzitter.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13c
  - number: 13c.3
    text: |-
      Het Adviescollege heeft tot taak Onze Minister te adviseren over de regels, bedoeld in de
      [artikelen 13e, derde lid][ref1], en [13h][ref2]. In de adviezen wordt aandacht besteed aan de laatste bouwkundige
      en seismische inzichten, de laatste inzichten over toekomstige gaswinning, de uitvoerbaarheid van de regels en de
      doeltreffendheid van de regels in de praktijk.


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Artikel13e
      [ref2]: https://wetten.overheid.nl/BWBR0043252#Artikel13h
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13c
    references:
      - id: ref1
        bwb_id: BWBR0043252
        artikel: 13e
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0043252
        artikel: 13h
        hoofdstuk: '5'
  - number: 13c.4
    text: |-
      Het Adviescollege raadpleegt bij de voorbereiding van zijn adviezen de colleges en de inspecteur-generaal der
      mijnen over de uitvoerbaarheid van de adviezen en de doeltreffendheid van de adviezen in de praktijk.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13c
  - number: 13c.5
    text: |-
      Het Adviescollege informeert de colleges en de inspecteur-generaal der mijnen over de wijze waarop hun reacties in
      het advies zijn verwerkt.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13c
  - number: 13d
    text: |-
      De inspecteur-generaal der mijnen kan aan Onze Minister gevraagd en ongevraagd adviezen verstrekken over de
      uitvoering van de versterkingsmaatregelen in relatie tot de veiligheid.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13d
  - number: 13e.1
    text: |-
      Onze Minister stelt risicoprofielen vast van gebouwen waarvoor nog geen beoordeling als bedoeld in
      [artikel 13i, eerste lid][ref1], heeft plaatsgevonden en actualiseert deze risicoprofielen, indien nodig,
      jaarlijks.


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Artikel13i
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13e
    references:
      - id: ref1
        bwb_id: BWBR0043252
        artikel: 13i
        hoofdstuk: '5'
  - number: 13e.2
    text: |-
      Bij de actualisatie van de risicoprofielen krijgt een gebouw waarvoor een risicoprofiel is vastgesteld, niet een
      lager risicoprofiel.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13e
  - number: 13e.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over het vaststellen van een
      risicoprofiel en de actualisatie daarvan.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13e
  - number: 13f.1
    text: |-
      Onze Minister zendt een overzicht van de risicoprofielen van gebouwen, bedoeld in [artikel 13e, eerste lid][ref1],
      toe aan het betrokken college en aan de inspecteur-generaal der mijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Artikel13e
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13f
    references:
      - id: ref1
        bwb_id: BWBR0043252
        artikel: 13e
        hoofdstuk: '5'
  - number: 13f.2
    text: |-
      Op verzoek van de eigenaar verstrekt Onze Minister het risicoprofiel van het gebouw aan de eigenaar nadat dit is
      vastgesteld en informeert de eigenaar over het verdere verloop van de versterking van zijn gebouw.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13f
  - number: 13g.1
    text: |-
      De gemeenteraad stelt een programma van aanpak vast op basis van de risicoprofielen met daarin een prioritering van
      gebouwen die mogelijk versterking behoeven.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13g
  - number: 13g.2
    text: 'Het programma bevat:'
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13g
  - number: 13g.2.a
    text: uitvoeringskaders voor de versterking binnen de gemeente;
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13g
  - number: 13g.2.b
    text: |-
      de meerjarige planning voor het opnemen en beoordelen van gebouwen ten behoeve van het nemen van het
      versterkingsbesluit; en
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13g
  - number: 13g.2.c
    text: de meerjarige planning voor de uitvoering van de versterkingsmaatregelen aan gebouwen.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13g
  - number: 13g.3
    text: 'De gemeenteraad verzoekt aan:'
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13g
  - number: 13g.3.a
    text: de inspecteur-generaal der mijnen om een advies over het ontwerp van het programma in relatie tot de veiligheid, en
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13g
  - number: 13g.3.b
    text: Onze Minister om een oordeel over de uitvoerbaarheid van het ontwerp van het programma.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13g
  - number: 13g.4
    text: |-
      De inspecteur-generaal der mijnen geeft het advies, bedoeld in het derde lid, onderdeel a, en Onze Minister geeft
      het oordeel, bedoeld in het derde lid, onderdeel b, binnen zes weken na het verzoek van de gemeenteraad.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13g
  - number: 13g.5
    text: |-
      Indien de programma’s van alle gemeenten gezamenlijk niet uitvoerbaar zijn binnen de beschikbare capaciteit, stelt
      Onze Minister na overleg met de colleges een programma van aanpak vast voor alle betrokken gemeenten, waarbij
      zoveel mogelijk de prioritering van de programma’s van de gemeenten wordt gevolgd.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13g
  - number: 13g.6
    text: |-
      Onze Minister kan op verzoek van een eigenaar van een gebouw onderzoeken of het gebouw mogelijk versterking
      behoeft, indien de omstandigheden van het geval daartoe aanleiding geven.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13g
  - number: 13g.7
    text: |-
      Indien uit het onderzoek, bedoeld in het zesde lid, blijkt dat het gebouw mogelijk versterking behoeft, informeert
      Onze Minister de gemeenteraad.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13g
  - number: 13g.8
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over het programma en de advisering door de
      inspecteur-generaal der mijnen en kunnen regels worden gesteld over het bepaalde in het zesde en zevende lid.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13g
  - number: 13h
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de wijze waarop wordt vastgesteld of een
      gebouw aan de veiligheidsnorm voldoet en de wijze waarop wordt bepaald welke maatregelen nodig zijn om een gebouw
      aan de veiligheidsnorm te laten voldoen.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13h
  - number: 13i.1
    text: |-
      Onze Minister beoordeelt conform de prioritering in het programma van aanpak of een gebouw aan de veiligheidsnorm
      voldoet.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13i
  - number: 13i.2
    text: |-
      Indien een gebouw aan de veiligheidsnorm voldoet, neemt Onze Minister een besluit inhoudende dat het gebouw aan de
      veiligheidsnorm voldoet en geen versterkingsmaatregelen noodzakelijk zijn. De minister zendt een afschrift van dit
      besluit aan het college van de gemeente waarin het gebouw is gelegen en, indien het gebouw of het terrein waarop
      het staat een rijksmonument is, aan Onze Minister van Onderwijs, Cultuur en Wetenschap.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13i
  - number: 13i.3
    text: |-
      Indien een gebouw niet aan de veiligheidsnorm voldoet, zendt Onze Minister aan de eigenaar de beoordeling, bedoeld
      in het eerste lid. In die beoordeling is in ieder geval opgenomen de soort maatregelen die nodig zijn om het
      gebouw aan de veiligheidsnorm te laten voldoen, waarbij, voor zover van toepassing, rekening wordt gehouden met de
      monumentale of karakteristieke waarde van het gebouw.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13i
  - number: 13i.4
    text: |-
      In het geval, bedoeld in het derde lid, wordt in overleg met de eigenaar van het gebouw een versterkingsbesluit
      voorbereid, nadat de eigenaar in de gelegenheid is gesteld schriftelijk kenbaar te maken dat hij zijn vordering
      tot vergoeding van schade op de exploitant ter zake van de kosten van de versterkingsmaatregelen overdraagt aan
      de Staat.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13i
  - number: 13i.5
    text: |-
      De eigenaar van een gebouw kan schriftelijk bij Onze Minister bedenkingen indienen over de beoordeling, bedoeld in
      het derde lid, tot het tijdstip waarop de minister een versterkingsbesluit heeft bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13i
  - number: 13i.6
    text: |-
      Indien de eigenaar bedenkingen als bedoeld in het vijfde lid indient, neemt Onze Minister binnen acht weken na
      ontvangst ervan en met inachtneming van de ingediende bedenkingen een versterkingsbesluit of, indien de eigenaar
      daarom heeft verzocht, een besluit dat het gebouw niet wordt versterkt indien daardoor de belangen van gebruikers
      of derde belanghebbenden niet worden geschaad. In bijzondere gevallen verband houdende met de complexiteit daarvan
      of het aantal te nemen besluiten kan de termijn, genoemd in de eerste volzin, eenmaal worden verlengd met ten
      hoogste zes weken.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13i
  - number: 13i.7
    text: |-
      Indien een besluit, bedoeld in het zesde lid, wordt genomen dat een gebouw niet wordt versterkt, zendt Onze
      Minister een afschrift hiervan aan het college van de gemeente waarin het gebouw is gelegen en, indien het
      gebouw of het terrein waarop het staat een rijksmonument is, aan Onze Minister van Onderwijs, Cultuur en
      Wetenschap, en draagt de minister zorg voor inschrijving van dit besluit in de openbare registers, bedoeld in
      [artikel 16 van Boek 3 van het Burgerlijk Wetboek][ref1], nadat het besluit onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel16
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13i
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '16'
  - number: 13i.8
    text: |-
      De inschrijving in het register, bedoeld in het zevende lid, nadat het besluit onherroepelijk is geworden, laat
      onverlet de mogelijkheid van een eigenaar om terug te komen op een keuze om een gebouw niet te versterken. Indien
      de eigenaar de keuze om een gebouw wel te versterken kenbaar maakt aan Onze Minister, neemt Onze Minister een nieuw
      versterkingsbesluit en draagt tevens zorg voor de doorhaling van het eerdere besluit in het register.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13i
  - number: 13ia.1
    text: |-
      In afwijking van [artikel 13i, eerste lid][ref1], kan de eigenaar de beoordeling of het gebouw aan de
      veiligheidsnorm voldoet in eigen beheer uitvoeren nadat hij het voornemen hiertoe aan Onze Minister heeft gemeld,
      indien:


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Artikel13i
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13ia
    references:
      - id: ref1
        bwb_id: BWBR0043252
        artikel: 13i
        hoofdstuk: '5'
  - number: 13ia.1.a
    text: het gebouw deel uitmaakt van een programma;
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13ia
  - number: 13ia.1.b
    text: |-
      het gebouw niet constructief verbonden is met een ander gebouw, tenzij alle eigenaren van de constructief verbonden
      gebouwen gezamenlijk en gelijktijdig een beoordeling in eigen beheer uitvoeren;
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13ia
  - number: 13ia.1.c
    text: Onze Minister voor de beoordeling van het gebouw nog geen openbare aanbesteding heeft gedaan;
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13ia
  - number: 13ia.1.d
    text: het gebouw niet al is beoordeeld.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13ia
  - number: 13ia.2
    text: Onze Minister informeert de betrokken gemeente over het voornemen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13ia
  - number: 13ia.3
    text: |-
      Op verzoek van de eigenaar die de beoordeling in eigen beheer uitvoert, verstrekt Onze Minister binnen vijf weken
      na ontvangst van het verzoek een vergoeding voor de kosten van het uitvoeren van de beoordeling, indien aan de
      voorwaarden, genoemd in het eerste lid, onderdelen a tot en met d, is voldaan.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13ia
  - number: 13ia.4
    text: Zodra de beoordeling is uitgevoerd zendt de eigenaar een afschrift van de beoordeling aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13ia
  - number: 13ia.5
    text: |-
      Indien de beoordeling volgens Onze Minister voldoet aan de regels, bedoeld in [artikel 13h][ref1], en die regels
      op de juiste wijze zijn toegepast, en uit de beoordeling blijkt dat het gebouw aan de veiligheidsnorm voldoet,
      neemt Onze Minister binnen twaalf weken na ontvangst een besluit als bedoeld in [artikel 13i, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Artikel13h
      [ref2]: https://wetten.overheid.nl/BWBR0043252#Artikel13i
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13ia
    references:
      - id: ref1
        bwb_id: BWBR0043252
        artikel: 13h
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0043252
        artikel: 13i
        hoofdstuk: '5'
  - number: 13ia.6
    text: |-
      Indien de beoordeling volgens Onze Minister voldoet aan de regels, bedoeld in [artikel 13h][ref1], en die
      regels op de juiste wijze zijn toegepast, en uit de beoordeling blijkt dat het gebouw niet aan de veiligheidsnorm
      voldoet, is [artikel 13i, vierde lid][ref2], van overeenkomstige toepassing, tenzij toepassing wordt gegeven aan
      [artikel 13ib, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Artikel13h
      [ref2]: https://wetten.overheid.nl/BWBR0043252#Artikel13i
      [ref3]: https://wetten.overheid.nl/BWBR0043252#Artikel13ib
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13ia
    references:
      - id: ref1
        bwb_id: BWBR0043252
        artikel: 13h
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0043252
        artikel: 13i
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0043252
        artikel: 13ib
        hoofdstuk: '5'
  - number: 13ia.7
    text: |-
      De eigenaar van een gebouw die ervoor kiest om de beoordeling in eigen beheer te laten plaatsvinden, kan tijdens de
      uitvoering hiervan ervoor kiezen deze alsnog door Onze Minister te laten plaatsvinden. Indien nodig wordt daarop de
      vergoeding, bedoeld in het derde lid, aangepast.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13ia
  - number: 13ia.8
    text: Bij ministeriële regeling kunnen regels worden gesteld over de vergoeding, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13ia
  - number: 13ib.1
    text: |-
      In afwijking van [artikel 13i, vierde lid][ref1], kan de eigenaar van een gebouw dat blijkens een beoordeling als
      bedoeld in artikel 13i, eerste lid, of [artikel 13ia, eerste lid][ref2], niet aan de veiligheidsnorm voldoet,
      ervoor kiezen om een overzicht van maatregelen die nodig zijn om het gebouw aan de veiligheidsnorm te laten voldoen
      in eigen beheer op te stellen, nadat hij het voornemen hiertoe aan Onze Minister heeft gemeld, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Artikel13i
      [ref2]: https://wetten.overheid.nl/BWBR0043252#Artikel13ia
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13ib
    references:
      - id: ref1
        bwb_id: BWBR0043252
        artikel: 13i
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0043252
        artikel: 13ia
        hoofdstuk: '5'
  - number: 13ib.1.a
    text: |-
      het gebouw niet constructief verbonden is met een ander gebouw, tenzij alle eigenaren van de constructief verbonden
      gebouwen gezamenlijk en gelijktijdig het overzicht van maatregelen opstellen;
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13ib
  - number: 13ib.1.b
    text: Onze Minister voor het opstellen van het overzicht van maatregelen nog geen openbare aanbesteding heeft gedaan;
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13ib
  - number: 13ib.1.c
    text: nog geen overzicht van maatregelen is opgesteld.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13ib
  - number: 13ib.2
    text: Onze Minister informeert de betrokken gemeente over het voornemen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13ib
  - number: 13ib.3
    text: |-
      Op verzoek van de eigenaar verstrekt Onze Minister binnen twaalf weken na ontvangst van het verzoek een vergoeding
      voor de kosten van het opstellen van het overzicht, indien de beoordeling voldoet aan de regels, bedoeld in
      [artikel 13h][ref1], en die regels op de juiste wijze zijn toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Artikel13h
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13ib
    references:
      - id: ref1
        bwb_id: BWBR0043252
        artikel: 13h
        hoofdstuk: '5'
  - number: 13ib.4
    text: Bij ministeriële regeling kunnen regels worden gesteld over de vergoeding, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13ib
  - number: 13j.1
    text: |-
      Onze Minister neemt binnen een in overleg met de eigenaar te bepalen redelijke termijn, maar uiterlijk binnen één
      jaar na de dagtekening van de beoordeling, bedoeld in [artikel 13i, derde lid][ref1], een versterkingsbesluit dat
      in ieder geval bevat:


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Artikel13i
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13j
    references:
      - id: ref1
        bwb_id: BWBR0043252
        artikel: 13i
        hoofdstuk: '5'
  - number: 13j.1.a
    text: |-
      een overzicht van de te treffen versterkingsmaatregelen die nodig zijn om een gebouw aan de veiligheidsnorm te
      laten voldoen, en
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13j
  - number: 13j.1.b
    text: |-
      de aanspraak van de eigenaar op vergoeding van de kosten voor de uitvoering van de versterkingsmaatregelen,
      bedoeld in onderdeel a, indien de eigenaar zijn vordering tot vergoeding van schade als bedoeld in
      [artikel 13i, vierde lid][ref1], heeft overgedragen aan de Staat.


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Artikel13i
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13j
    references:
      - id: ref1
        bwb_id: BWBR0043252
        artikel: 13i
        hoofdstuk: '5'
  - number: 13j.2
    text: |-
      In bijzondere gevallen verband houdende met de complexiteit daarvan of het aantal te nemen besluiten kan de
      termijn, genoemd in het eerste lid, eenmaal worden verlengd met een redelijke termijn.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13j
  - number: 13j.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden gevallen aangewezen waarvoor de redelijke termijn, bedoeld
      in het eerste lid, maximaal zes maanden bedraagt en waarvoor de verlenging, bedoeld in het tweede lid, maximaal zes
      maanden bedraagt.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13j
  - number: 13j.4
    text: |-
      In afwijking van het eerste lid, onderdeel a, kan een versterkingsbesluit voor een beschermd monument een overzicht
      van de te treffen maatregelen bevatten waardoor de veiligheid verbetert, maar met het oog op het behoud van de
      monumentale waarden niet volledig wordt voldaan aan de veiligheidsnorm.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13j
  - number: 13j.5
    text: |-
      In een versterkingsbesluit kunnen op verzoek van de eigenaar andere maatregelen worden opgenomen om een gebouw
      aan de veiligheidsnorm te laten voldoen dan de versterkingsmaatregelen. Onze Minister bepaalt in hoeverre de extra
      kosten daarvan voor rekening van de eigenaar komen.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13j
  - number: 13j.6
    text: |-
      In een versterkingsbesluit kunnen op verzoek van de eigenaar werkzaamheden worden opgenomen die niet noodzakelijk
      zijn om een gebouw aan de veiligheidsnorm te laten voldoen, indien deze werkzaamheden geen onredelijke vertraging
      opleveren voor het laten voldoen van het gebouw of andere gebouwen aan de veiligheidsnorm. Onze Minister bepaalt in
      hoeverre de werkzaamheden worden uitgevoerd voor rekening van de eigenaar.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13j
  - number: 13j.7
    text: |-
      Onze Minister verbindt aan het versterkingsbesluit de voorwaarde dat de aanspraak, bedoeld in het eerste lid,
      onderdeel b, vervalt indien:
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13j
  - number: 13j.7.a
    text: |-
      door de exploitant met de eigenaar of diens vertegenwoordiger een vaststellingsovereenkomst is gesloten, tenzij dit
      zou leiden tot een onbillijkheid van overwegende aard;
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13j
  - number: 13j.7.b
    text: |-
      door de eigenaar of diens vertegenwoordiger met de exploitant onderhandeld wordt met het doel te komen tot een
      vergoeding van de kosten van de versterkingsmaatregelen;
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13j
  - number: 13j.7.c
    text: |-
      door de eigenaar een vordering is ingesteld bij de burgerlijke rechter, tenzij de vordering bij de burgerlijke
      rechter met instemming van de gedaagde door de eigenaar wordt ingetrokken;
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13j
  - number: 13j.7.d
    text: |-
      de burgerlijke rechter uitspraak heeft gedaan over de aanspraak op en de omvang van de vergoeding van de kosten van
      de versterkingsmaatregelen.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13j
  - number: 13j.8
    text: |-
      Onze Minister kan bij de aanspraak, bedoeld in het eerste lid, onderdeel b, voor zover de versterkingsmaatregelen
      tevens voorzien in herstel van schade en dit redelijk is, rekening houden met de door het Instituut uitgekeerde of
      uit te keren vergoeding van deze schade.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13j
  - number: 13j.9
    text: |-
      Het overzicht van de te treffen versterkingsmaatregelen, bedoeld in het eerste lid, onderdeel a, en de
      aanspraak, bedoeld in het eerste lid, onderdeel b, wordt zodanig vastgesteld dat het gebouw na uitvoering
      van de versterkingsmaatregelen van dezelfde aard is en ten minste vergelijkbare gebruiksoppervlakte en
      gebruiksmogelijkheden heeft als de situatie voor de uitvoering van die maatregelen, tenzij op verzoek van de
      eigenaar andere maatregelen worden genomen.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13j
  - number: 13j.10
    text: |-
      Onze Minister kan naast de voorwaarde, bedoeld in het zevende lid, aan het versterkingsbesluit andere voorwaarden
      verbinden.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13j
  - number: 13j.11
    text: |-
      Indien het versterkingsbesluit betrekking heeft op een rijksmonument zendt Onze Minister onmiddellijk na de
      bekendmaking van het versterkingsbesluit een afschrift van dat besluit aan Onze Minister van Onderwijs, Cultuur en
      Wetenschap en, indien het rijksmonument is gelegen buiten de bebouwde kom aan gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13j
  - number: 13j.12
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de aanspraak, bedoeld in het
      eerste lid, onderdeel b, en kunnen nadere regels worden gesteld over het bepaalde in het zevende en achtste lid.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13j
  - number: 13ja.1
    text: |-
      In afwijking van [artikel 13j, eerste lid][ref1], neemt Onze Minister een versterkingsbesluit binnen acht weken
      na ontvangst van een aanvraag van de eigenaar van een gebouw die in eigen beheer een overzicht als bedoeld
      in [artikel 13ib, eerste lid][ref2], heeft opgesteld van de maatregelen die nodig zijn om het gebouw aan de
      veiligheidsnorm te laten voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Artikel13j
      [ref2]: https://wetten.overheid.nl/BWBR0043252#Artikel13ib
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13ja
    references:
      - id: ref1
        bwb_id: BWBR0043252
        artikel: 13j
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0043252
        artikel: 13ib
        hoofdstuk: '5'
  - number: 13ja.2
    text: |-
      De aanvraag bevat het overzicht en de beoordeling of het gebouw aan de veiligheidsnorm voldoet, indien de
      beoordeling in eigen beheer is uitgevoerd als bedoeld in [artikel 13ia, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Artikel13ia
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13ja
    references:
      - id: ref1
        bwb_id: BWBR0043252
        artikel: 13ia
        hoofdstuk: '5'
  - number: 13ja.3
    text: 'Onze Minister kan de aanvraag geheel of gedeeltelijk afwijzen indien:'
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13ja
  - number: 13ja.3.a
    text: |-
      de beoordeling niet voldoet aan de regels, bedoeld in [artikel 13h][ref1], of die regels niet op de juiste wijze
      zijn toegepast; of


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Artikel13h
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13ja
    references:
      - id: ref1
        bwb_id: BWBR0043252
        artikel: 13h
        hoofdstuk: '5'
  - number: 13ja.3.b
    text: |-
      het overzicht niet de maatregelen bevat die naar het oordeel van de minister nodig zijn om het gebouw aan de
      veiligheidsnorm te laten voldoen.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13ja
  - number: 13ja.4
    text: Bij ministeriële regeling worden regels gesteld over de bij de aanvraag aan te leveren gegevens.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13ja
  - number: 13k.1
    text: |-
      Indien Onze Minister door toedoen van de eigenaar of gebruiker niet kan vaststellen of een gebouw aan de
      veiligheidsnorm voldoet en belangen van de eigenaar, gebruiker of derde belanghebbenden niet worden geschaad,
      besluit de minister dat een gebouw niet wordt versterkt. De minister zendt een afschrift van dit besluit aan het
      college van de gemeente waarin het gebouw is gelegen, en, indien het gebouw of het terrein waarop het staat een
      rijksmonument is, aan Onze Minister van Onderwijs, Cultuur en Wetenschap, en draagt zorg voor inschrijving van dit
      besluit in de openbare registers, bedoeld in [artikel 16 van Boek 3 van het Burgerlijk Wetboek][ref1], nadat het
      besluit onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel16
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13k
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '16'
  - number: 13k.2
    text: |-
      Onze Minister kan ten behoeve van de beoordeling, bedoeld in [artikel 13i, eerste lid][ref1], de uitvoering van
      de versterkingsmaatregelen en voor het gebruik, bedoeld in het derde lid, personen aanwijzen die bevoegd zijn
      met medeneming van de benodigde apparatuur en andere hulpmiddelen, een gebouw met inbegrip van een woning binnen
      te treden.


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Artikel13i
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13k
    references:
      - id: ref1
        bwb_id: BWBR0043252
        artikel: 13i
        hoofdstuk: '5'
  - number: 13k.3
    text: |-
      Indien voor de uitvoering van de versterkingsmaatregelen gebruik moet worden gemaakt van een onroerende zaak waarop
      het versterkingsbesluit geen betrekking heeft, kan Onze Minister besluiten de rechthebbende met wie daarover geen
      overeenstemming is bereikt, behoudens recht op schadevergoeding, de verplichting op te leggen om te gedogen dat
      zijn onroerende zaak wordt gebruikt voor de uitvoering van die maatregelen.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13k
  - number: 13k.4
    text: |-
      De eigenaar of gebruiker van een gebouw verleent aan een persoon als bedoeld in het tweede lid, binnen de door
      deze persoon gestelde termijn, alle medewerking die deze redelijkerwijs kan vorderen bij de uitoefening van zijn
      bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13k
  - number: 13k.5
    text: |-
      De machtiging, bedoeld in [artikel 2, eerste lid, van de Algemene wet op het binnentreden][ref1] wordt gegeven door
      Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0006763#Artikel2
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13k
    references:
      - id: ref1
        bwb_id: BWBR0006763
        artikel: '2'
  - number: 13m.1
    text: |-
      Onze Minister kan aan de rechtmatige gebruiker van een gebouw, niet zijnde de eigenaar, een vergoeding verstrekken
      voor de door hem geleden schade die een direct gevolg is van:
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13m
  - number: 13m.1.a
    text: de beoordeling of het gebouw aan de veiligheidsnorm voldoet; en
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13m
  - number: 13m.1.b
    text: de voorbereiding en uitvoering van de versterkingsmaatregelen.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13m
  - number: 13m.2
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld inzake de gebruikers die in aanmerking komen voor
      vergoeding alsmede de gegevens die de gebruiker op verzoek van Onze Minister overlegt voor het vaststellen van de
      hoogte van de vergoeding en de wijze waarop de hoogte van de vergoeding wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13m
  - number: 13n.1
    text: |-
      Als een bijzonder doeleinde als bedoeld in [artikel 37b van de Wet op de rechtsbijstand][ref1] waarvoor het
      bestuur van de raad voor rechtsbijstand, bedoeld in [artikel 2 van de Wet op de rechtsbijstand][ref2], subsidie
      verstrekt, wordt aangemerkt, het door de eigenaar van een gebouw:


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel37b
      [ref2]: https://wetten.overheid.nl/BWBR0006368#Artikel2
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13n
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: 37b
      - id: ref2
        bwb_id: BWBR0006368
        artikel: '2'
  - number: 13n.1.a
    text: |-
      indienen van een zienswijze in het kader van de aanvraag om vergoeding van schade bij het Instituut en de
      afwikkeling van schade en leveren van inbreng bij de voorbereiding van een versterkingsbesluit na ontvangst van de
      beoordeling, bedoeld in [artikel 13i, derde lid][ref1], en de uitvoering van de versterkingsmaatregelen;


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Artikel13i
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13n
    references:
      - id: ref1
        bwb_id: BWBR0043252
        artikel: 13i
        hoofdstuk: '5'
  - number: 13n.1.b
    text: |-
      maken van bezwaar of het instellen van beroep tegen een besluit van het Instituut of van Onze Minister op grond van
      deze wet.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13n
  - number: 13n.2
    text: |-
      Het inroepen van advies van een bouwkundige of financiële deskundige in het kader van het verlenen van
      rechtsbijstand, bedoeld in het eerste lid, wordt aangemerkt als een bijzonder doeleinde waarvoor het bestuur van
      de raad voor rechtsbijstand met het oog op de verlening van rechtsbijstand een subsidie verstrekt als bedoeld in
      [artikel 37c van de Wet op de rechtsbijstand][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel37c
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13n
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: 37c
  - number: 13n.3
    text: |-
      Onze Minister voor Rechtsbescherming verleent de goedkeuring, bedoeld in
      [artikel 37b, vijfde lid, van de Wet op de rechtsbijstand][ref1] aan de krachtens artikel 37b, derde lid, of
      [artikel 37c van de Wet op de rechtsbijstand][ref2] vast te stellen regels voor de verstrekking van de subsidies,
      bedoeld in het eerste en tweede lid, niet eerder dan vier weken nadat het ontwerpbesluit tot goedkeuring van
      de door het bestuur van de raad voor rechtsbijstand te stellen regels aan beide Kamers der Staten-Generaal is
      overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel37b
      [ref2]: https://wetten.overheid.nl/BWBR0006368#Artikel37c
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13n
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: 37b
      - id: ref2
        bwb_id: BWBR0006368
        artikel: 37c
  - number: 13n.4
    text: |-
      Het Instituut verstrekt aan de eigenaar van een gebouw een vergoeding voor de kosten die hij maakt voor bouwkundig
      en financieel advies ten behoeve van het indienen van een zienswijze in het kader van de aanvraag om vergoeding
      van schade en de afwikkeling van schade, indien dit advies niet wordt ingeroepen in het kader van het verlenen
      van rechtsbijstand.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13n
  - number: 13n.5
    text: |-
      Onze Minister verstrekt aan de eigenaar van een gebouw een vergoeding voor de kosten die hij maakt voor bouwkundig
      en financieel advies ten behoeve van het leveren van inbreng bij de voorbereiding van een versterkingsbesluit
      na ontvangst van de beoordeling, bedoeld in [artikel 13i, derde lid][ref1], en de uitvoering van de
      versterkingsmaatregelen, indien dit advies niet wordt ingeroepen in het kader van het verlenen van rechtsbijstand.


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Artikel13i
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13n
    references:
      - id: ref1
        bwb_id: BWBR0043252
        artikel: 13i
        hoofdstuk: '5'
  - number: 13n.6
    text: |-
      Bij regeling van Onze Minister worden nadere regels gesteld over het verstrekken van de vergoeding, bedoeld in het
      vierde en vijfde lid.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel13n
  - number: '14.1'
    text: |-
      Onze Minister stelt voldoende financiële middelen ter beschikking aan het Instituut ter uitoefening van zijn taken
      en bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel14
  - number: '14.2'
    text: |-
      Onze Minister neemt in zijn begroting het Instituut als afzonderlijke begrotingspost op en voorziet deze post van
      een toelichting.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel14
  - number: '15.1'
    text: 'Onze Minister legt een heffing op aan een exploitant:'
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel15
  - number: 15.1.a
    text: |-
      ter bestrijding van alle kosten gemaakt in verband met de uitvoering van de taken en bevoegdheden, bedoeld in
      [artikel 2, derde lid, onderdelen a en b, en zevende lid][ref1], met uitzondering van de kosten die verband
      houden met de bezoldiging van de leden van het Instituut, de huisvestingskosten van het Instituut en de BTW voor
      werkzaamheden die door derden worden uitgevoerd in opdracht van het Instituut;


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Artikel2
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0043252
        artikel: '2'
        hoofdstuk: '2'
  - number: 15.1.b
    text: |-
      ter bestrijding van de kosten gemaakt in verband met de uitvoering van de taken en bevoegdheden, bedoeld in
      [artikel 2, derde lid, onderdeel c, en achtste lid][ref1], indien deze kosten gemaakt zijn ten behoeve van
      vergoeding van schade als bedoeld in deze wet, met uitzondering van de BTW voor werkzaamheden die door derden
      worden uitgevoerd in opdracht van het Instituut;


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Artikel2
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0043252
        artikel: '2'
        hoofdstuk: '2'
  - number: 15.1.c
    text: |-
      ter bestrijding van alle kosten gemaakt door de overheid voor de voorbereiding en uitvoering van de maatregelen om
      een gebouw aan de veiligheidsnorm te laten voldoen en de maatregelen, bedoeld in [artikel 13j, vierde lid][ref1],
      indien het gebouw een beschermd monument is, alsmede de kosten die daar direct verband mee houden, met uitzondering
      van de BTW voor werkzaamheden die door derden worden uitgevoerd in opdracht van Onze Minister;


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Artikel13j
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0043252
        artikel: 13j
        hoofdstuk: '5'
  - number: 15.1.d
    text: |-
      ter bestrijding van de kosten gemaakt in verband met de vergoedingen, bedoeld in
      [artikel 13m, eerste lid][ref1], en subsidies op grond van [artikel 13n, eerste en tweede lid][ref2], in
      combinatie met de [artikelen 37b][ref3] en [37c van de Wet op de rechtsbijstand][ref4], en vergoedingen op grond
      van artikel 13n, vierde en vijfde lid; en


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Artikel13m
      [ref2]: https://wetten.overheid.nl/BWBR0043252#Artikel13n
      [ref3]: https://wetten.overheid.nl/BWBR0006368#Artikel37b
      [ref4]: https://wetten.overheid.nl/BWBR0006368#Artikel37c
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0043252
        artikel: 13m
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0043252
        artikel: 13n
        hoofdstuk: 5a
      - id: ref3
        bwb_id: BWBR0006368
        artikel: 37b
      - id: ref4
        bwb_id: BWBR0006368
        artikel: 37c
  - number: 15.1.e
    text: |-
      ter compensatie van het rentevoordeel dat de exploitant ondervindt als gevolg van de afhandeling van schade door
      het Instituut, als gevolg van de voorbereiding en uitvoering van maatregelen als bedoeld in onderdeel c, en de
      toekenning van de vergoedingen, bedoeld in onderdeel d.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel15
  - number: '15.2'
    text: |-
      De heffing wordt opgelegd aan de exploitant die ten tijde van het bekend worden van de schade, waarop de kosten
      van vergoedingen die de basis vormen voor de heffing betrekking hebben, exploitant is, respectievelijk aan de
      exploitant die ten tijde van het maken van de kosten, bedoeld in het eerste lid, onderdeel c, exploitant is,
      respectievelijk aan de exploitant die ten tijde van het maken van de kosten, bedoeld in onderdeel d, exploitant is.
      Indien deze schade bekend wordt of deze kosten gemaakt worden na sluiting van het mijnbouwwerk, wordt de heffing
      opgelegd aan degene die de laatste exploitant was.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel15
  - number: '15.3'
    text: De hoogte van de heffing wordt vastgesteld bij ministeriële regeling.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel15
  - number: '15.4'
    text: |-
      Onze Minister kan een tussentijdse heffing opleggen tot ten hoogste het bedrag, bedoeld in het derde lid, voor de
      kosten die op dat moment gemaakt zijn. De tussentijdse heffing wordt verrekend met de definitieve heffing.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel15
  - number: 15a.1
    text: |-
      In dit artikel wordt verstaan onder: - *batch 1.588:* door de Nationaal Coördinator Groningen benoemde batch van
      1.588 gebouwen waarvoor versterkingsadviezen zijn opgesteld.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel15a
  - number: 15a.2
    text: |-
      Onze Minister verstrekt jaarlijks aan de gemeenten Eemsdelta, Groningen en Midden-Groningen een uitkering als
      bedoeld in [artikel 15a van de Financiële-verhoudingswet][ref1] om de gemeenten van middelen te voorzien ten
      behoeve van het versterken van gebouwen in batch 1.588.


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel15a
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: 15a
  - number: 15a.3
    text: 'De gemeenten besteden de uitkering uitsluitend aan:'
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel15a
  - number: 15a.3.a
    text: werkzaamheden voor de versterking van de gebouwen in batch 1.588;
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel15a
  - number: 15a.3.b
    text: het verstrekken van subsidies voor de versterking van de gebouwen in batch 1.588.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel15a
  - number: 15a.4
    text: |-
      De subsidie, bedoeld in het derde lid, onderdeel b, wordt vastgesteld op een bedrag zodat de eigenaar
      overeenkomstig de versterkingsadviezen de versterkingsmaatregelen kan laten uitvoeren dan wel tot sloop en
      nieuwbouw kan overgaan en het gebouw na de uitvoering van die maatregelen of na de sloop en nieuwbouw van dezelfde
      aard is en ten minste vergelijkbare gebruiksoppervlakte en gebruiksmogelijkheden heeft als de situatie voor de
      uitvoering van die maatregelen of voor de sloop en nieuwbouw, tenzij op verzoek van de eigenaar andere maatregelen
      worden genomen.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel15a
  - number: 15a.5
    text: |-
      Bij ministeriële regeling worden regels gesteld over de uitkering, bedoeld in het tweede lid. Deze regels zien ten
      minste op de vaststelling van de hoogte van de uitkering, de verdeling, de voorwaarden waaronder deze verstrekt
      wordt en de terugvordering van niet of niet rechtmatig bestede middelen.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel15a
  - number: 15b.1
    text: |-
      Onze Minister kan aan de provincie Groningen en gemeenten in de provincie Groningen een uitkering als bedoeld
      in [artikel 15a van de Financiële-verhoudingswet][ref1] verstrekken voor activiteiten die gericht zijn op de
      toekomstbestendigheid of de leefbaarheid van de provincie Groningen.


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel15a
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel15b
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: 15a
  - number: 15b.2
    text: |-
      Onze Minister kan een uitkering als bedoeld in [artikel 15a van de Financiële-verhoudingswet][ref1] verstrekken
      aan de gemeenten Eemsdelta, Groningen, Het Hogeland, Midden-Groningen en Oldambt voor activiteiten die verband
      houden met het uitvoeren van de versterking, of voor activiteiten die gericht zijn op de verbetering van de sociale
      cohesie, en aan de provincie Groningen voor activiteiten die deze activiteiten van deze gemeenten ondersteunen.


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel15a
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel15b
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: 15a
  - number: 15b.3
    text: |-
      Bij ministeriële regeling worden regels gesteld over de uitkering, bedoeld in het eerste en tweede lid. Deze regels
      zien ten minste op de vaststelling van de hoogte van de uitkering, de verdeling, de voorwaarden waaronder deze
      verstrekt wordt en de terugvordering van niet of niet rechtmatig bestede middelen.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel15b
  - number: '16.1'
    text: |-
      De rechtbank kan in een beroep tegen een besluit op grond van deze wet op verzoek van een partij of ambtshalve
      de Hoge Raad, wanneer het een rechtsvraag die de toepassing van bepalingen uit het Burgerlijk Wetboek betreft,
      dan wel de Afdeling bestuursrechtspraak, wanneer het overige rechtsvragen betreft, een rechtsvraag stellen ter
      beantwoording bij wijze van een prejudiciële uitspraak, indien een antwoord op deze vraag nodig is om op het beroep
      te beslissen en rechtstreeks van belang is:
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel16
  - number: 16.1.a
    text: |-
      voor een veelheid aan aanvragen die gegrond zijn op dezelfde of soortgelijke feiten en uit dezelfde of soortgelijke
      samenhangende oorzaken voortkomen; of
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel16
  - number: 16.1.b
    text: |-
      voor beoordeling van talrijke andere uit soortgelijke feiten voortvloeiende beroepen, waarin dezelfde vraag zich
      voordoet.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel16
  - number: '16.2'
    text: |-
      Alvorens de vraag te stellen, stelt de rechtbank partijen in de gelegenheid zich uit te laten over het voornemen om
      een vraag te stellen, alsmede over de inhoud van de te stellen vraag.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel16
  - number: '16.3'
    text: |-
      De tussenuitspraak waarbij de vraag wordt gesteld, vermeldt voorts het onderwerp van beroep, de door de rechtbank
      vastgestelde feiten en de door partijen ingenomen standpunten. Tevens bevat de tussenuitspraak een uiteenzetting
      dat met de beantwoording van de vraag wordt voldaan aan het eerste lid, onderdeel a of b. Tegen de tussenuitspraak
      kan slechts hoger beroep worden ingesteld tegelijkertijd met een hoger beroep tegen de uitspraak als bedoeld in
      [artikel 8:66, eerste lid][ref1], of [artikel 8:67, eerste lid, van de Algemene wet bestuursrecht][ref2] van de
      rechtbank of de uitspraak als bedoeld in [artikel 8:86, eerste lid, van de Algemene wet bestuursrecht][ref3] van de
      voorzieningenrechter van de rechtbank.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '16.4'
    text: |-
      De griffier zendt onverwijld een afschrift van de tussenuitspraak aan de Hoge Raad dan wel de Afdeling
      bestuursrechtspraak. De griffier zendt afschriften van de andere op de procedure betrekking hebbende stukken op
      diens verzoek aan de griffier van de Hoge Raad dan wel de Afdeling bestuursrechtspraak.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel16
  - number: '16.5'
    text: |-
      De rechtbank houdt de beslissing in de beroepsprocedure aan totdat een afschrift van de uitspraak van de Hoge Raad
      dan wel de Afdeling bestuursrechtspraak is ontvangen.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel16
  - number: '16.6'
    text: |-
      Indien in een andere lopende beroepsprocedure het antwoord op de vraag rechtstreeks van belang is om op
      het beroep te beslissen, kan de rechtbank op verzoek van een partij in die procedure dan wel ambtshalve de
      beslissing aanhouden totdat de Hoge Raad dan wel de Afdeling bestuursrechtspraak uitspraak heeft gedaan.
      Alvorens te beslissen als bedoeld in de eerste zin, stelt de rechtbank de bij de procedure betrokken
      partijen in de gelegenheid zich daarover uit te laten. De rechtbank houdt de beslissing niet aan indien alle
      partijen te kennen hebben gegeven voortzetting van de procedure te verlangen of indien een zwaarwegend belang
      van de indiener van het beroepschrift zich verzet tegen het aanhouden van de procedure. In afwijking van
      [artikel 8:104, derde lid, onder b van de Algemene wet bestuursrecht][ref1] kan de indiener van het beroepschrift
      terstond hoger beroep instellen tegen een beslissing om aan te houden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '17.1'
    text: |-
      Tenzij de Hoge Raad, gehoord de procureur-generaal, dan wel de Afdeling bestuursrechtspraak, indien van toepassing
      na het uitbrengen van een conclusie overeenkomstig [artikel 8:12a van de Algemene wet bestuursrecht][ref1],
      aanstonds beslist overeenkomstig het tiende lid, stelt zij partijen in de gelegenheid om binnen een door haar te
      bepalen termijn schriftelijk opmerkingen te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '17.2'
    text: |-
      De Hoge Raad dan wel de Afdeling bestuursrechtspraak kan bepalen dat ook anderen dan partijen binnen een daartoe
      te bepalen termijn in de gelegenheid worden gesteld om schriftelijke opmerkingen te maken. De aankondiging hiervan
      geschiedt op een door de Hoge Raad dan wel de Afdeling bestuursrechtspraak te bepalen wijze.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel17
  - number: '17.3'
    text: |-
      Schriftelijke opmerkingen worden ter griffie van de Hoge Raad dan wel de Afdeling bestuursrechtspraak ingediend. De
      griffier zendt onverwijld een afschrift aan partijen.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel17
  - number: '17.4'
    text: |-
      Indien het belang van de zaak dit geraden doet voorkomen, kan de Hoge Raad dan wel de Afdeling bestuursrechtspraak,
      hetzij ambtshalve, hetzij op een daartoe strekkend verzoek, een termijn bepalen voor mondelinge of schriftelijke
      toelichting door partijen. De Hoge Raad dan wel de Afdeling bestuursrechtspraak kan, indien een mondelinge
      toelichting is bevolen, degenen die ingevolge het tweede lid schriftelijke opmerkingen hebben gemaakt, uitnodigen
      ter zitting aanwezig te zijn teneinde over hun opmerkingen te worden gehoord.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel17
  - number: '17.5'
    text: |-
      Een schriftelijke toelichting wordt door de partij ondertekend en ter griffie van de Hoge Raad dan wel de Afdeling
      bestuursrechtspraak ingediend.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel17
  - number: '17.6'
    text: |-
      Na het verstrijken van de termijn voor het maken van schriftelijke opmerkingen, dan wel na de
      mondelinge of schriftelijke toelichting, neemt de procureur-generaal bij de Hoge Raad conclusie
      dan wel kan de voorzitter van de Afdeling bestuursrechtspraak, onder overeenkomstige toepassing van
      [artikel 8:12a van de Algemene wet bestuursrecht][ref1], één van haar leden verzoeken een conclusie te nemen,
      hetzij onmiddellijk, hetzij op een daartoe te bepalen dag. De griffier zendt onverwijld een afschrift van de
      conclusie aan partijen. Partijen kunnen binnen twee weken na verzending van het afschrift van de conclusie hun
      schriftelijk commentaar daarop doen toekomen aan de Hoge Raad dan wel de Afdeling bestuursrechtspraak.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '17.7'
    text: |-
      De Hoge Raad dan wel de Afdeling bestuursrechtspraak bepaalt de dag waarop de Hoge Raad dan wel de Afdeling
      bestuursrechtspraak zal beslissen:
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel17
  - number: 17.7.a
    text: |-
      na het verstrijken van de termijn voor het maken van schriftelijke opmerkingen, dan wel na de mondelinge of
      schriftelijke toelichting, indien door de voorzitter van Afdeling bestuursrechtspraak geen gebruik is gemaakt van
      de mogelijkheid bedoeld in het zesde lid, of
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel17
  - number: 17.7.b
    text: |-
      nadat de procureur-generaal bij de Hoge Raad dan wel het daartoe op grond van het zesde lid verzochte lid van
      Afdeling bestuursrechtspraak conclusie heeft genomen.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel17
  - number: '17.8'
    text: |-
      De Hoge Raad dan wel de Afdeling bestuursrechtspraak kan de vraag herformuleren. Tenzij de herformulering van
      ondergeschikte betekenis is, stelt de Hoge Raad dan wel de Afdeling bestuursrechtspraak partijen in de gelegenheid
      om binnen een door de Hoge Raad dan wel de Afdeling bestuursrechtspraak te bepalen termijn schriftelijke
      opmerkingen te maken.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel17
  - number: '17.9'
    text: |-
      De Afdeling bestuursrechtspraak zendt de vraag door naar de Hoge Raad indien de vraagstelling de toepassing
      van bepalingen uit het Burgerlijk Wetboek betreft. De Hoge Raad zendt de vraag door naar de Afdeling
      bestuursrechtspraak indien de vraagstelling niet de toepassing van bepalingen uit het Burgerlijk Wetboek betreft.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel17
  - number: '17.10'
    text: |-
      De Hoge Raad dan wel de Afdeling bestuursrechtspraak ziet af van beantwoording indien de Hoge Raad, gehoord de
      procureur-generaal, dan wel de Afdeling bestuursrechtspraak oordeelt dat de vraag zich niet voor beantwoording bij
      wijze van prejudiciële uitspraak leent of de vraag van onvoldoende gewicht is om beantwoording te rechtvaardigen.
      De Hoge Raad dan wel de Afdeling bestuursrechtspraak kan zich bij de vermelding van de gronden van de uitspraak
      beperken tot dit oordeel.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel17
  - number: '17.11'
    text: |-
      Indien het antwoord op de vraag, nadat deze is gesteld, niet meer nodig is om in de procedure, bedoeld
      in [artikel 16, eerste lid][ref1], op het beroep te beslissen, kan de Hoge Raad dan wel de Afdeling
      bestuursrechtspraak, indien dat de Hoge Raad dan wel de Afdeling bestuursrechtspraak geraden voorkomt, de vraag
      desondanks beantwoorden met het oog op aanhangige beroepen in soortgelijke zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Artikel16
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0043252
        artikel: '16'
        hoofdstuk: '7'
  - number: '17.12'
    text: |-
      De Hoge Raad dan wel de Afdeling bestuursrechtspraak begroot in de uitspraak, onder overeenkomstige toepassing
      van het bepaalde bij en krachtens [artikel 8:75 van de Algemene wet bestuursrecht][ref1], de kosten die partijen
      ingevolge dit artikel hebben gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '17.13'
    text: |-
      De griffier zendt onverwijld een afschrift van de uitspraak aan de rechtbank en aan partijen. De griffier zendt
      daarbij eveneens een afschrift van de genomen conclusie, indien van toepassing, en van de schriftelijke opmerkingen
      en toelichtingen, bedoeld in het eerste, tweede en vierde lid.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel17
  - number: '18.1'
    text: |-
      Behoudens indien het antwoord op de vraag niet meer nodig is om op het beroep te beslissen, beslist de rechtbank,
      nadat zij partijen de gelegenheid heeft gegeven zich schriftelijk over de uitspraak van de Hoge Raad dan wel de
      Afdeling bestuursrechtspraak uit te laten, met inachtneming van deze uitspraak.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel18
  - number: '18.2'
    text: |-
      De rechtbank kan onder de proceskosten waarin een partij veroordeeld wordt, ook opnemen het door de Hoge Raad dan
      wel de Afdeling bestuursrechtspraak begrote bedrag, bedoeld in [artikel 17, twaalfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Artikel17
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0043252
        artikel: '17'
        hoofdstuk: '7'
  - number: '18.3'
    text: |-
      Geen griffierecht wordt geheven van belanghebbenden, het bestuursorgaan en anderen die verschijnen in de
      prejudiciële procedure als bedoeld in [artikel 16][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Artikel16
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0043252
        artikel: '16'
        hoofdstuk: '7'
  - number: '19.1'
    text: |-
      [Artikel 27gc van de Algemene wet inzake rijksbelastingen][ref1] alsmede
      [artikel 8:62 van de Algemene wet bestuursrecht][ref2] zijn van overeenkomstige toepassing op de behandeling
      van een verzoek om een prejudiciële uitspraak door de Hoge Raad. De artikelen [8:10 tot en met 8:12][ref3],
      [8:14 tot en met 8:20][ref4], [8:23 tot en met 8:28][ref5], [8:29 tot en met 8:32a][ref6],
      [8:35 tot en met 8:40][ref7], [8:45a][ref8], [8:47][ref9], [8:60][ref10], [8:60a, tweede lid][ref11],
      [8:61][ref12], [8:62][ref13], [8:65][ref14]; [8:77, eerste lid, onderdelen a tot en met e, en derde lid][ref15],
      [8:78][ref16] en [8:79 van de Algemene wet bestuursrecht][ref17] zijn van overeenkomstige toepassing op de
      behandeling van een verzoek om een prejudiciële uitspraak door de Afdeling bestuursrechtspraak.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel27gc
