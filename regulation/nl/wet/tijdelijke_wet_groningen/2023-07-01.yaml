        artikel: 13i
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0043252
        artikel: 13k
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0043252
        artikel: 13l
        hoofdstuk: '5'
  - number: 19a.2
    text: |-
      In bijzondere omstandigheden kan de Afdeling bestuursrechtspraak de in het eerste lid genoemde termijn met ten
      hoogste drie maanden verlengen.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel19a
  - number: 19b
    text: |-
      In afwijking van [artikel 1:2 van de Algemene wet bestuursrecht][ref1] is een exploitant geen belanghebbende bij
      een besluit als bedoeld in [artikel 2, derde lid][ref2], of bij een versterkingsbesluit.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0043252#Artikel2
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel19b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0043252
        artikel: '2'
        hoofdstuk: '2'
  - number: '20'
    text: |-
      Onverminderd [artikel 39, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref1] zendt Onze Minister
      binnen twee jaar na de inwerkingtreding van deze wet, en vervolgens telkens na twee jaar, aan de Staten-Generaal
      een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk en de noodzaak van het voortduren
      van de maatregelen waarin deze wet voorziet.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel39
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '39'
  - number: '21.1'
    text: |-
      Besluiten van de deelcommissie mijnbouwschade op grond van
      [artikel 3, tweede lid, van het Besluit Mijnbouwschade Groningen][ref1], en de deelcommissie bezwaar, op grond van
      artikel 3, derde lid, van het Besluit Mijnbouwschade Groningen, worden na inwerkingtreding van deze wet aangemerkt
      als besluiten van het Instituut Mijnbouwschade als bedoeld in [artikel 2, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0040584#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0043252#Artikel2
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0040584
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0043252
        artikel: '2'
        hoofdstuk: '2'
  - number: '21.2'
    text: |-
      Aanvragen tot vergoeding van schade die in de periode van 19 maart 2018 tot de datum van inwerkingtreding van deze
      wet in behandeling zijn bij de Tijdelijke Commissie Mijnbouwschade Groningen, worden voor de toepassing van deze
      wet aangemerkt als een aanvraag tot vergoeding van schade als bedoeld in [artikel 2, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Artikel2
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0043252
        artikel: '2'
        hoofdstuk: '2'
  - number: '21.3'
    text: |-
      Schademeldingen die in de periode van 31 maart 2017, 12:00 uur, tot 19 maart 2018 zijn voorgelegd aan
      de Nederlandse Aardolie Maatschappij N.V. of het Centrum Veilig Wonen en in behandeling zijn, worden
      voor de toepassing van deze wet aangemerkt als een aanvraag tot vergoeding van schade als bedoeld in
      [artikel 2, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Artikel2
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0043252
        artikel: '2'
        hoofdstuk: '2'
  - number: '21.4'
    text: Het Instituut neemt de zaken bedoeld in het eerste tot en met derde lid over in de staat waarin deze zich bevinden.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel21
  - number: '22'
    text: |-
      Aanvragen om vergoeding van schade worden door het Instituut niet in behandeling genomen indien de aanvrager ten
      aanzien van de schade op het moment van inwerkingtreding van deze wet partij is bij:
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel22
  - number: 22.a
    text: de overeenkomst Groningen-NAM inzake regeling vergoeding kosten bodemdaling aardgaswinning 1983, of
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel22
  - number: 22.b
    text: de overeenkomst Rijk-NAM inzake regeling vergoeding kosten bodemdaling aardgaswinning 1983.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel22
  - number: 22a.1
    text: |-
      Degene die voorafgaand aan de inwerkingtreding van deze wet is benoemd als lid van de Tijdelijke Commissie
      Mijnbouwschade Groningen, is van rechtswege benoemd als lid van het Instituut en de duur van zijn benoeming wordt
      vastgesteld op vier jaar.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel22a
  - number: 22a.2
    text: |-
      Degene die voorafgaand aan de inwerkingtreding van deze wet is benoemd als voorzitter van Tijdelijke Commissie
      Mijnbouwschade Groningen, is van rechtswege benoemd als voorzitter van het Instituut en de duur van zijn benoeming
      wordt vastgesteld op vier jaar.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel22a
  - number: 22a.3
    text: |-
      Voor het bepalen van het tijdvak van de benoeming, bedoeld in [artikel 4, zesde lid][ref1], geldt het tijdvak,
      vervuld als lid of voorzitter van de Tijdelijke Commissie Mijnbouwschade Groningen, voorafgaand aan de
      inwerkingtreding van deze wet als een tijdvak, vervuld als lid of voorzitter van het Instituut.


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Artikel4
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0043252
        artikel: '4'
        hoofdstuk: '2'
  - number: 22b.1
    text: |-
      Een plan van een gemeenteraad dat hetzelfde doel nastreeft als een programma als bedoeld in [artikel 13g][ref1],
      wordt daarmee gelijkgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Artikel13g
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel22b
    references:
      - id: ref1
        bwb_id: BWBR0043252
        artikel: 13g
        hoofdstuk: '5'
  - number: 22b.2
    text: |-
      Een risicoprofiel, een beoordeling of een gebouw voldoet aan de veiligheidsnorm of een besluit daarover, een
      besluit tot versterken en een besluit tot niet versterken die krachtens [artikel 52g van de Mijnbouwwet][ref1] zijn
      vastgesteld, respectievelijk genomen, worden met ingang van de datum van inwerkingtreding van [hoofdstuk 5][ref2]
      gelijkgesteld met een risicoprofiel als bedoeld in [artikel 13e, eerste lid][ref3], een beoordeling als bedoeld in
      [artikel 13i, eerste lid][ref4], een versterkingsbesluit, respectievelijk een besluit als bedoeld in artikel 13i,
      zesde lid of [artikel 13k, eerste lid][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel52g
      [ref2]: https://wetten.overheid.nl/BWBR0043252#Hoofdstuk5
      [ref3]: https://wetten.overheid.nl/BWBR0043252#Artikel13e
      [ref4]: https://wetten.overheid.nl/BWBR0043252#Artikel13i
      [ref5]: https://wetten.overheid.nl/BWBR0043252#Artikel13k
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel22b
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 52g
      - id: ref2
        bwb_id: BWBR0043252
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0043252
        artikel: 13e
        hoofdstuk: '5'
      - id: ref4
        bwb_id: BWBR0043252
        artikel: 13i
        hoofdstuk: '5'
      - id: ref5
        bwb_id: BWBR0043252
        artikel: 13k
        hoofdstuk: '5'
  - number: 22b.3
    text: |-
      Voor de toepassing van het tweede lid, wordt als de datum van de dagtekening, bedoeld in [artikel 13j][ref1], de
      datum van inwerkingtreding van [hoofdstuk 5][ref2] aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Artikel13j
      [ref2]: https://wetten.overheid.nl/BWBR0043252#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel22b
    references:
      - id: ref1
        bwb_id: BWBR0043252
        artikel: 13j
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0043252
        hoofdstuk: '5'
  - number: 22b.4
    text: |-
      Indien een beoordeling heeft plaatsgevonden voor een bij ministeriële regeling te bepalen tijdstip en
      uit die beoordeling blijkt dat een gebouw niet aan de veiligheidsnorm voldoet en de uitvoering van de
      versterkingsmaatregelen nog niet is aangevangen, kan Onze Minister op verzoek van de eigenaar het gebouw laten
      beoordelen op een bij of krachtens [artikel 13h][ref1] voorgeschreven wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Artikel13h
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel22b
    references:
      - id: ref1
        bwb_id: BWBR0043252
        artikel: 13h
        hoofdstuk: '5'
  - number: 22b.5
    text: |-
      Indien een nieuwe beoordeling als bedoeld in het vierde lid plaatsvindt en krachtens
      [artikel 52g van de Mijnbouwwet][ref1] voor het gebouw een besluit is vastgesteld, trekt Onze Minister het op grond
      van het tweede lid daarmee gelijkgestelde besluit in en besluit Onze Minister op basis van de nieuwe beoordeling
      overeenkomstig [artikel 13i, tweede tot en met zevende lid][ref2], en de [artikelen 13j tot en met 13m][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel52g
      [ref2]: https://wetten.overheid.nl/BWBR0043252#Artikel13i
      [ref3]: https://wetten.overheid.nl/BWBR0043252#Artikel13j
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel22b
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 52g
      - id: ref2
        bwb_id: BWBR0043252
        artikel: 13i
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0043252
        artikel: 13j
        hoofdstuk: '5'
  - number: 22b.6
    text: |-
      Onze Minister kan een vergoeding verstrekken aan de eigenaar die op grond van het vierde lid in aanmerking komt
      voor een nieuwe beoordeling.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel22b
  - number: 22b.7
    text: Bij ministeriële regeling kunnen regels worden gesteld over de vergoeding, bedoeld in het zesde lid.
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel22b
  - number: '29.1'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan, verschillend kan worden vastgesteld, met uitzondering van [artikel 13][ref1], dat
      in werking treedt op het tijdstip waarop artikel I, onderdelen D en E, van het bij koninklijke boodschap van
      13 oktober 2020 ingediende voorstel van wet tot wijziging van de Tijdelijke wet Groningen in verband met de
      versterking van gebouwen in de provincie Groningen (Kamerstukken 35 603), nadat dat voorstel tot wet is of wordt
      verheven, in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Artikel13
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0043252
        artikel: '13'
        hoofdstuk: '4'
  - number: '29.2'
    text: |-
      In afwijking van het eerste lid treedt [artikel 28, aanhef en onderdelen b en c][ref1], in werking met ingang
      van de dag na de datum van uitgifte van het Staatsblad waarin deze wet wordt geplaatst en werkt terug tot en met
      1 januari 2018.


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Artikel28
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0043252
        artikel: '28'
        hoofdstuk: '8'
  - number: '30'
    text: 'Deze wet wordt aangehaald als: Tijdelijke wet Groningen.'
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel30
