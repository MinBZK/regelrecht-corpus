  - number: '19.2'
    text: |-
      De Hoge Raad dan wel de Afdeling bestuursrechtspraak doet op de op grond van [artikel 17, zevende lid][ref1],
      bepaalde dag schriftelijk uitspraak op een verzoek om een prejudiciële beslissing.


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Artikel17
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0043252
        artikel: '17'
        hoofdstuk: '7'
  - number: 19a.1
    text: |-
      Op een beroep tegen een versterkingsbesluit, een besluit als bedoeld in [artikel 13i, tweede en zesde lid][ref1],
      een besluit als bedoeld in [artikel 13k, eerste en derde lid][ref2], en een besluit als bedoeld in
      [artikel 13l, eerste lid, onderdeel b][ref3], beslist de Afdeling bestuursrechtspraak binnen zes maanden na
      ontvangst van het verweerschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Artikel13i
      [ref2]: https://wetten.overheid.nl/BWBR0043252#Artikel13k
      [ref3]: https://wetten.overheid.nl/BWBR0043252#Artikel13l
    url: https://wetten.overheid.nl/BWBR0043252/2023-07-01#Artikel19a
    references:
