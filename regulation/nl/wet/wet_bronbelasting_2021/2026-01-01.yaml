  - number: '3.2'
    text: |-
      1 Indien ter zake van voordelen als bedoeld in [artikel 3.1][ref1] voorwaarden worden overeengekomen of opgelegd
      (verrekenprijzen) die afwijken van voorwaarden die in het economische verkeer door onafhankelijke partijen zouden
      zijn overeengekomen, worden die voordelen bepaald alsof die laatstbedoelde voorwaarden zouden zijn overeengekomen.

      2 Niet in geld genoten voordelen worden in aanmerking genomen naar de waarde die daaraan in het economische verkeer
      kan worden toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0042952#Artikel3.1
