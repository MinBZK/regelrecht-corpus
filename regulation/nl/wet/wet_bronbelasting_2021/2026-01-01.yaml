  - number: '6.2'
    text: |-
      1 [Artikel 47a van de Algemene wet inzake rijksbelastingen][ref1] is van overeenkomstige toepassing ter zake
      van gegevens en inlichtingen alsmede gegevensdragers die van belang kunnen zijn voor de heffing van de belasting
      waarvan de inhouding is opgedragen aan de inhoudingsplichtige en die in het bezit zijn van:

      a. de voordeelgerechtigde;

      b. een derde die onmiddellijk of middellijk een kwalificerend belang heeft in die inhoudingsplichtige; of

      c. lichamen die deel uitmaken van een kwalificerende eenheid en die gezamenlijk onmiddellijk of middellijk een
      kwalificerend belang hebben in die inhoudingsplichtige.

      2 Het eerste lid is van overeenkomstige toepassing ingeval [artikel 4.2][ref2] toepassing vindt.

      3 [Artikel 52a van de Algemene wet inzake rijksbelastingen][ref3] is van overeenkomstige toepassing ingeval niet of
      niet volledig wordt voldaan aan de informatieverplichting ingevolge het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel47a
      [ref2]: https://wetten.overheid.nl/BWBR0042952#Artikel4.2
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel52a
