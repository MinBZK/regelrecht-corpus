        artikel: '5.2'
  - number: '2.1'
    text: |-
      1 Belastingplichtig voor de belasting is een lichaam dat gerechtigd is tot voordelen als bedoeld in
      [artikel 3.1][ref1] en dat:

      a. naar de omstandigheden beoordeeld in een laagbelastende jurisdictie is gevestigd of volgens de fiscale of andere
      regelgeving van die jurisdictie aldaar is gevestigd;

      b. niet in een laagbelastende jurisdictie is gevestigd, waarbij die voordelen worden toegerekend aan een vaste
      inrichting in een laagbelastende jurisdictie;

      c. volgens de fiscale regelgeving van een staat, niet zijnde Nederland of een laagbelastende jurisdictie, in die
      staat is gevestigd en gerechtigd is tot die voordelen met als hoofddoel of een van de hoofddoelen om de heffing
      van belasting bij een ander te ontgaan en er sprake is van een kunstmatige constructie of transactie of reeks van
      constructies of samenstel van transacties waarbij:

      1°. een constructie of transactie uit verscheidene stappen of onderdelen kan bestaan;

      2°. een constructie of transactie of reeks van constructies of samenstel van transacties als kunstmatig wordt
      beschouwd voor zover zij, onderscheidenlijk het, niet is opgezet op grond van geldige zakelijke redenen die de
      economische realiteit weerspiegelen;

      d. volgens de fiscale regelgeving van de staat waarin de voordeelgerechtigde is gevestigd, niet zijnde een
      laagbelastende jurisdictie, aldaar niet wordt behandeld als de gerechtigde tot die voordelen omdat die staat een
      lichaam waarin die voordeelgerechtigde een belang heeft als gerechtigde tot die voordelen beschouwt; of

      e. volgens de fiscale regelgeving van de staat op grond van wiens recht de voordeelgerechtigde is opgericht,
      niet zijnde een laagbelastende jurisdictie, aldaar niet wordt behandeld als de gerechtigde tot die voordelen
      omdat die voordeelgerechtigde volgens de fiscale regelgeving van die staat niet aldaar is gevestigd, en die
      voordeelgerechtigde niet volgens de fiscale regelgeving van een andere staat in laatstbedoelde staat is gevestigd.

      2 Het eerste lid, onderdeel a, is niet van toepassing indien aannemelijk wordt gemaakt dat de voordeelgerechtigde
      volgens de fiscale regelgeving van een andere staat, niet zijnde een laagbelastende jurisdictie, tevens in die
      staat is gevestigd en aldaar wordt behandeld als de gerechtigde tot de voordelen, bedoeld in het eerste lid,
      aanhef, en die voordeelgerechtigde niet volgens een door die staat met een andere staat gesloten verdrag ter
      voorkoming van dubbele belasting wordt geacht te zijn gevestigd in die andere staat.

      3 Het eerste lid, onderdeel d, is niet van toepassing indien aannemelijk wordt gemaakt dat het lichaam, bedoeld
      in het eerste lid, onderdeel d, volgens de fiscale regelgeving van de staat waarin dat lichaam is gevestigd aldaar
      als de gerechtigde tot de voordelen, bedoeld in het eerste lid, aanhef, wordt beschouwd, in welk geval dat lichaam
      wordt geacht de voordeelgerechtigde, bedoeld in het eerste lid, te zijn.

      4 Het eerste lid, onderdeel e, is niet van toepassing indien er geen achterliggende gerechtigde is die samen met
      een of meer andere lichamen een kwalificerende eenheid vormt en aannemelijk wordt gemaakt dat:

      a. iedere achterliggende gerechtigde die een kwalificerend belang heeft in het lichaam, bedoeld in het eerste lid,
      onderdeel e, volgens de fiscale regelgeving van de staat waarin die achterliggende gerechtigde is gevestigd aldaar
      wordt behandeld als de gerechtigde tot de voordelen, bedoeld in het eerste lid, aanhef, en niet een lichaam is
      waarop zonder tussenkomst van de voordeelgerechtigde het eerste lid, onderdelen a, b, c of d, van toepassing zou
      zijn; of

      b. er geen achterliggende gerechtigde is die een kwalificerend belang heeft in het lichaam, bedoeld in het eerste
      lid, onderdeel e.

      5 Onder een belang als bedoeld in het vierde lid wordt mede verstaan een middellijk belang, mits op het lichaam
      of de lichamen via welke het middellijke belang wordt gehouden het eerste lid, onderdeel e, van toepassing zou
      zijn indien dit lichaam, onderscheidenlijk die lichamen, de voordeelgerechtigde zou, onderscheidenlijk zouden,
      zijn. Van achterliggende gerechtigdheid als bedoeld in het vierde lid is sprake voor zover de gerechtigdheid
      tot de voordelen, bedoeld in het eerste lid, aanhef, rechtstreeks verband houdt met een participatie in de
      voordeelgerechtigde, bedoeld in het eerste lid, onderdeel e.

      6 Indien aan bij ministeriële regeling te stellen voorwaarden wordt voldaan, wordt voor de toepassing van het
      eerste lid, onderdeel c, tenzij de inspecteur het tegendeel aannemelijk maakt, de voordeelgerechtigde geacht
      niet gerechtigd te zijn tot de voordelen met als hoofddoel of een van de hoofddoelen om de heffing van belasting
      bij een ander te ontgaan en wordt geacht sprake te zijn van geldige zakelijke redenen die de economische
      realiteit weerspiegelen. Indien niet aan de voorwaarden, bedoeld in de eerste zin, wordt voldaan, dient de
      voordeelgerechtigde of de inhoudingsplichtige aannemelijk te maken dat:

      a. de voordeelgerechtigde niet gerechtigd is tot de voordelen met als hoofddoel of een van de hoofddoelen om de
      heffing van belasting bij een ander te ontgaan; of

      b. sprake is van geldige zakelijke redenen die de economische realiteit weerspiegelen.

      7 Belastingplichtig voor de belasting is mede een lichaam als bedoeld in
      [artikel 2, elfde lid, van de Wet op de vennootschapsbelasting 1969][ref2] dat gerechtigd is tot voordelen als
      bedoeld in [artikel 3.1][ref3], voor zover een achterliggende gerechtigde die een kwalificerend belang heeft
      in dat lichaam is gevestigd in een staat die dat lichaam niet als een belastingplichtige voor een naar de winst
      geheven belasting beschouwt en die gerechtigde op grond van het eerste lid belastingplichtig zou zijn indien hij
      zonder tussenkomst van dat lichaam de voordeelgerechtigde zou zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0042952#Artikel3.1
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0042952#Artikel3.1
