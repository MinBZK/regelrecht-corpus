  - number: 3.4b
    text: |-
      1 Voor zover de storting op aandelen in een vennootschap bestaat uit aandelen in een andere vennootschap wordt ten
      aanzien van alle aandeelhouders slechts als gestort aangemerkt hetgeen op de laatstbedoelde aandelen is gestort,
      verminderd met hetgeen in contanten is bijbetaald. In afwijking van de eerste zin wordt, ingeval die andere
      vennootschap niet in Nederland is gevestigd, als gestort kapitaal aangemerkt de waarde in het economische verkeer
      van de ingebrachte aandelen ten tijde van de storting, tenzij deze aandelenruil in overwegende mate is gericht op
      het ontgaan of uitstellen van belastingheffing.

      2 In geval van een overgang onder algemene titel in het kader van een splitsing van een rechtspersoon wordt
      ten aanzien van alle aandeelhouders ten hoogste een evenredig gedeelte van het bedrag van het op de aandelen
      in de splitsende rechtspersoon gestorte kapitaal aangemerkt als gestort kapitaal op de door de verkrijgende
      rechtspersonen in het kader van de splitsing toegekende aandelen, en wordt, in geval van een splitsing waarbij
      de splitsende rechtspersoon blijft bestaan, het op de aandelen in de splitsende rechtspersoon gestorte kapitaal
      in dezelfde mate verminderd. Indien in het kader van de splitsing een bijbetaling in contanten plaatsvindt, wordt
      voor de toepassing van de eerste zin het op de aandelen in de splitsende rechtspersoon gestorte kapitaal verminderd
      met deze bijbetaling. In afwijking van de eerste en tweede zin wordt, ingeval de splitsende rechtspersoon niet
      in Nederland is gevestigd, als gestort kapitaal op de door de verkrijgende rechtspersoon in het kader van de
      splitsing uitgereikte aandelen aangemerkt de waarde in het economische verkeer van het vermogen dat als gevolg
      van de splitsing overgaat op de verkrijgende rechtspersoon voor zover het vermogen niet bestaat uit aandelen in
      een in Nederland gevestigde vennootschap, tenzij deze splitsing in overwegende mate is gericht op het ontgaan of
      uitstellen van belastingheffing.

      3 Voor de toepassing van het tweede lid wordt onder een evenredig gedeelte verstaan: een gedeelte dat
      evenredig is aan de verhouding tussen de waarde in het economische verkeer ten tijde van de splitsing van de
      vermogensbestanddelen van de splitsende rechtspersoon die overgaan op de verkrijgende rechtspersoon en de waarde in
      het economische verkeer ten tijde van de splitsing van het gehele vermogen van de splitsende rechtspersoon.

      4 Ingeval de splitsende rechtspersoon in Nederland is gevestigd en de overgang onder algemene titel in het kader
      van een splitsing in overwegende mate is gericht op het ontgaan of uitstellen van belastingheffing, blijft het
      tweede lid, eerste en tweede zin, buiten toepassing en wordt hetgeen bij de splitsing door een aandeelhouder als
      zodanig wordt genoten aangemerkt als een uitdeling van winst door de splitsende rechtspersoon.

      5 In geval van een overgang onder algemene titel in het kader van een fusie van een rechtspersoon wordt:

      a. ingeval in het kader van de fusie aandelen worden toegekend: ten aanzien van alle aandeelhouders ten hoogste
      het bedrag van het op de aandelen in de verdwijnende rechtspersoon gestorte kapitaal verminderd met een bijbetaling
      in contanten die in het kader van de fusie plaatsvindt, aangemerkt als gestort kapitaal op de door de verkrijgende
      rechtspersoon in het kader van de fusie toegekende aandelen; of

      b. ingeval in het kader van de fusie geen aandelen worden toegekend en de aandeelhouder ten tijde van de fusie alle
      aandelen bezit in de verdwijnende en de verkrijgende rechtspersoon: ten aanzien van de aandeelhouder het gestorte
      kapitaal in de verkrijgende rechtspersoon vermeerderd met ten hoogste het op de aandelen in de verdwijnende
      rechtspersoon gestorte kapitaal.

      6 Ingeval de verdwijnende rechtspersoon niet in Nederland is gevestigd, wordt voor de toepassing van het vijfde lid
      als het op de aandelen in de verdwijnende rechtspersoon gestorte kapitaal aangemerkt de waarde in het economische
      verkeer van het vermogen dat als gevolg van de fusie overgaat op de verkrijgende rechtspersoon voor zover het
      vermogen niet bestaat uit aandelen in een in Nederland gevestigde vennootschap, tenzij de fusie in overwegende mate
      is gericht op het ontgaan of uitstellen van belastingheffing.

      7 Een aandelenruil, een splitsing en een fusie worden voor de toepassing van het eerste, tweede, vierde, vijfde
      en zesde lid, tenzij het tegendeel aannemelijk wordt gemaakt, geacht in overwegende mate te zijn gericht op het
      ontgaan of uitstellen van belastingheffing indien de aandelenruil, de splitsing, onderscheidenlijk de fusie,
      niet plaatsvindt op grond van zakelijke overwegingen, zoals herstructurering of rationalisering van de actieve
      werkzaamheden van de bij de aandelenruil, de splitsing, onderscheidenlijk de fusie, betrokken rechtspersonen.
      Bij een splitsing worden zakelijke overwegingen voorts niet aanwezig geacht indien de activa die bij de splitsing
      overgaan op de andere rechtspersoon hoofdzakelijk, onmiddellijk of middellijk, bestaan uit beleggingen, liquide
      middelen daaronder begrepen, of indien hetgeen bij de splitsende rechtspersoon achterblijft hoofdzakelijk,
      onmiddellijk of middellijk, bestaat uit beleggingen, tenzij de beleggingen die overgaan, onderscheidenlijk
      achterblijven, geen afzondering van ingehouden winst representeren.

      8 De rechtspersoon die zekerheid wenst omtrent de vraag of een aandelenruil, een splitsing of een fusie in
      overwegende mate is gericht op het ontgaan of uitstellen van belastingheffing, kan vóór de aandelenruil, de
      splitsing, onderscheidenlijk de fusie, een verzoek indienen bij de inspecteur die daarop bij voor bezwaar vatbare
      beschikking beslist.
