  - number: 3.4a
    text: |-
      1 De voordelen in de vorm van dividenden zijn de voordelen uit hoofde van de gerechtigdheid – rechtstreeks
      of door middel van certificaten – tot de opbrengst van aandelen in, winstbewijzen van, kapitaalverstrekkingen
      als bedoeld in [artikel 10, eerste lid, onderdeel c, van de Wet op de vennootschapsbelasting 1969][ref1]
      aan en geldleningen als bedoeld in artikel 10, eerste lid, onderdeel d, van die wet aan een in
      Nederland gevestigde aan de voordeelgerechtigde gelieerde inhoudingsplichtige als bedoeld in
      [artikel 1.2, eerste lid, onderdeel c, onder 1°, 3°, 4° of 6°][ref2].

      2 Tot de voordelen, bedoeld in het eerste lid, behoren:

      a. onmiddellijke of middellijke uitdelingen van winst, onder welke naam of in welke vorm ook gedaan daaronder
      begrepen hetgeen ter gelegenheid van inkoop van aandelen, anders dan ter tijdelijke belegging, wordt uitgekeerd
      boven het gemiddeld op de desbetreffende aandelen gestorte kapitaal;

      b. hetgeen bij liquidatie op aandelen wordt uitgekeerd boven het gemiddeld op de desbetreffende aandelen gestorte
      kapitaal;

      c. de nominale waarde van aandelen uitgereikt aan aandeelhouders, voor zover niet blijkt dat storting heeft
      plaatsgevonden of zal plaatsvinden, met dien verstande dat bijschrijving op aandelen wordt gelijkgesteld met
      uitreiking van aandelen;

      d. gedeeltelijke teruggaaf van hetgeen op aandelen is gestort, voor zover er zuivere winst is, tenzij tevoren
      de algemene vergadering van aandeelhouders tot deze teruggaaf heeft besloten en de nominale waarde van de
      desbetreffende geplaatste aandelen bij statutenwijziging met een gelijk bedrag is verminderd;

      e. hetgeen wordt uitgekeerd op winstbewijzen, daaronder begrepen hetgeen wordt genoten ter gelegenheid van afkoop
      of inkoop daarvan;

      f. vergoedingen voor kapitaalverstrekkingen als bedoeld in
      [artikel 10, eerste lid, onderdeel c, van de Wet op de vennootschapsbelasting 1969][ref3] en vergoedingen op
      geldleningen als bedoeld in artikel 10, eerste lid, onderdeel d, van die wet;

      g. gehele of gedeeltelijke teruggaaf van hetgeen op bewijzen van deelgerechtigdheid in een fonds voor gemene
      rekening is gestort, voor zover het vermogen van het fonds uitgaat boven hetgeen op de in omloop zijnde bewijzen
      van deelgerechtigdheid is gestort;

      h. het bedrag dat als storting wordt toegerekend aan elk van de bewijzen van deelgerechtigdheid in een fonds voor
      gemene rekening voor zover winsten van dat fonds worden bestemd om te gelden als storting op aan deelgerechtigden
      uit te geven of reeds uitgegeven bewijzen van deelgerechtigdheid;

      i. renten op inleggelden en, in het algemeen, alle vergoedingen voor kapitaalverstrekkingen aan een coöperatie of
      een vereniging op coöperatieve grondslag door leden als zodanig, met uitzondering van de gehele of gedeeltelijke
      teruggaaf van inleggelden.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0042952#Artikel1.2
      [ref3]: https://wetten.overheid.nl/BWBR0002672#Artikel10
