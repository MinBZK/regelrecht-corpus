  - number: '3.1'
    text: |-
      De belasting wordt geheven over de voordelen in de vorm van:

      a. renten als bedoeld in [artikel 3.3][ref1];

      b. royalty’s als bedoeld in [artikel 3.4][ref2];

      c. dividenden als bedoeld in [artikel 3.4a][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0042952#Artikel3.3
