      1 Onverminderd het bepaalde in [artikel 20, tweede lid, van de Algemene wet inzake rijksbelastingen][ref1]
      wordt de naheffingsaanslag opgelegd aan de inhoudingsplichtige dan wel aan de belastingplichtige indien de
