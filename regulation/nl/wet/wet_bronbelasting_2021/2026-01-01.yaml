valid_from: '2026-01-01'
bwb_id: BWBR0042952
url: https://wetten.overheid.nl/BWBR0042952/2026-01-01
preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is een bronbelasting op renten en royalty’s naar
    laagbelastende jurisdicties en in misbruiksituaties te introduceren en enkele antimisbruikbepalingen in de
    dividendbelasting en vennootschapsbelasting te wijzigen om de aanpak van belastingontwijking voortvarend voort
    te zetten;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0042952/2026-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Onder de naam bronbelasting wordt een belasting geheven van het lichaam, bedoeld in [artikel 2.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0042952#Artikel2.1
    url: https://wetten.overheid.nl/BWBR0042952/2026-01-01#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0042952
        artikel: '2.1'
        hoofdstuk: '2'
  - number: '1.2'
    text: |-
      1 Voor de toepassing van deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *voordeelgerechtigde:* een lichaam dat gerechtigd is tot voordelen als bedoeld in [artikel 3.1][ref1], met dien
      verstande dat een lichaam als bedoeld in [artikel 2, elfde lid, van de Wet op de vennootschapsbelasting 1969][ref2]
      wordt aangemerkt als voordeelgerechtigde met betrekking tot voordelen als bedoeld in artikel 3.1 waartoe de houders
      van stemrechten, kapitaalbelangen of winstrechten in dat lichaam door tussenkomst van dat lichaam zijn gerechtigd;
        - *inhoudingsplichtige:* 1°. naamloze vennootschappen; 2°. besloten vennootschappen met beperkte aansprakelijkheid;
      3°. coöperaties en verenigingen op coöperatieve grondslag; 4°. onderlinge waarborgmaatschappijen; 5°.
      verenigingen; 6°. stichtingen; 7°. andere Nederlandse rechtspersonen; 8°. fondsen voor gemene rekening; 9°. naar
      het recht van een andere staat opgerichte of aangegane lichamen als bedoeld in het tweede lid; 10°. lichamen
      als bedoeld in [artikel 2, elfde lid, van de Wet op de vennootschapsbelasting 1969][ref3], behalve voor zover de
      voordeelgerechtigde stemrechten, kapitaalbelangen of winstrechten houdt in dat lichaam en is gevestigd in een staat
      die dat lichaam niet als een belastingplichtige voor een naar de winst geheven belasting beschouwt;
        - *aan de voordeelgerechtigde gelieerde inhoudingsplichtige:* een inhoudingsplichtige: 1°. waarin de
      voordeelgerechtigde onmiddellijk of middellijk een kwalificerend belang heeft; 2°. die onmiddellijk of middellijk
      een kwalificerend belang heeft in de voordeelgerechtigde; 3°. waarin een derde onmiddellijk of middellijk een
      kwalificerend belang heeft, terwijl die derde tevens onmiddellijk of middellijk een kwalificerend belang heeft in
      de voordeelgerechtigde; 4°. waarin de voordeelgerechtigde onmiddellijk of middellijk een belang heeft en waarin
      hij samen met een of meer andere lichamen die met hem een kwalificerende eenheid vormen onmiddellijk of middellijk
      een kwalificerend belang heeft; 5°. die onmiddellijk of middellijk een belang heeft in de voordeelgerechtigde
      en die samen met een of meer andere lichamen die met die inhoudingsplichtige een kwalificerende eenheid vormen
      onmiddellijk of middellijk een kwalificerend belang heeft in de voordeelgerechtigde; of 6°. waarin lichamen die
      deel uitmaken van een kwalificerende eenheid gezamenlijk onmiddellijk of middellijk een kwalificerend belang
      hebben en die lichamen tevens gezamenlijk onmiddellijk of middellijk een kwalificerend belang hebben in de
      voordeelgerechtigde;
        - *kwalificerend belang:* een belang waarmee een zodanige invloed op de besluiten van een lichaam kan worden
      uitgeoefend dat de activiteiten van het lichaam kunnen worden bepaald;
        - *laagbelastende jurisdictie:* een bij ministeriële regeling aangewezen staat die: 1°. op 1 oktober van het
      kalenderjaar dat voorafgaat aan het tijdvak, bedoeld in [artikel 5.1, derde lid][ref4], lichamen niet of naar een
      tarief van minder dan 9% onderwerpt aan een belasting naar de winst; of 2°. is opgenomen in een in het kalenderjaar
      dat voorafgaat aan het tijdvak, bedoeld in [artikel 5.1, derde lid][ref5], geldende EU-lijst van niet-coöperatieve
      rechtsgebieden voor belastingdoeleinden;
        - *vaste inrichting:* een vaste inrichting als bedoeld in
      [artikel 3, vierde tot en met twaalfde lid, van de Wet op de vennootschapsbelasting 1969][ref6];
        - *kwalificerende eenheid:* lichamen die gezamenlijk handelen met als hoofddoel of een van de hoofddoelen om de
      heffing van belasting bij een van die lichamen te ontgaan.

      2 Onder de naar het recht van een andere staat opgerichte of aangegane lichamen, bedoeld in het eerste lid,
      onderdeel b, onder 9°, worden verstaan naar het recht van een andere staat opgerichte of aangegane lichamen:

      a. waarvan de rechtsvorm vergelijkbaar is met die van een lichaam als bedoeld in
      [artikel 2, eerste lid, onderdelen a, b, c, e, f of g, van de Wet op de vennootschapsbelasting 1969][ref7];

      b. waarvan de rechtsvorm niet vergelijkbaar is met die van een lichaam als bedoeld in
      [artikel 2, eerste lid, onderdelen a, b, c, e, f of g, van de Wet op de vennootschapsbelasting 1969][ref8], noch
      met die van een maatschap, vennootschap onder firma, commanditaire vennootschap of een transparant fonds als
      bedoeld in [artikel 2.14bis, zevende lid, van de Wet inkomstenbelasting 2001][ref9], en die lichamen:

      1°. in Nederland zijn gevestigd; of

      2°. niet in Nederland zijn gevestigd en de bezittingen en schulden alsmede de opbrengsten en kosten van een
      dergelijk lichaam volgens de fiscale regelgeving van een staat die dat lichaam als inwoner behandelt worden
      toegerekend aan dat lichaam.

      3 In afwijking van het eerste lid, onderdeel b, worden voor de heffing over de voordelen in de vorm van dividenden
      als bedoeld in [artikel 3.1, onderdeel c][ref10], uitsluitend als inhoudingsplichtige aangemerkt de lichamen,
      bedoeld in het eerste lid, onderdeel b, onder 1°, 2°, 3°, 8° en 10°, de lichamen, bedoeld in het tweede lid,
      onderdeel b, onder 1°, en naar het recht van een andere staat opgerichte of aangegane lichamen waarvan de
      rechtsvorm vergelijkbaar is met die van een lichaam als bedoeld in het eerste lid, onderdeel b, onder 1°, 2°, 3°
      of 8°.

      4 Voor de toepassing van deze wet en de daarop berustende bepalingen worden gelijkgesteld met aandelen in
      vennootschappen als bedoeld in het eerste lid, onderdeel b, onder 1° en 2°:

      a. bewijzen van deelgerechtigdheid in een fonds voor gemene rekening;

      b. lidmaatschapsrechten in een in Nederland gevestigde coöperatie en daarmee op één lijn te stellen bewijzen
      van deelgerechtigdheid tot het vermogen van een in Nederland gevestigde coöperatie of vereniging op coöperatieve
      grondslag;

      c. belangen in een naar het recht van een andere staat opgericht of aangegaan lichaam waarvan de rechtsvorm
      vergelijkbaar is met die van een lichaam als bedoeld in het eerste lid, onderdeel b, onder 1°, 2°, 3° of 8°;

      d. belangen in een lichaam als bedoeld in het tweede lid, onderdeel b, onder 1°.

      5 Voor de toepassing van deze wet en de daarop berustende bepalingen worden de fondsen voor gemene rekening,
      coöperaties, verenigingen op coöperatieve grondslag en lichamen, bedoeld in het vierde lid, gelijkgesteld met
      vennootschappen.

      6 Voor de toepassing van deze wet en de daarop berustende bepalingen wordt onder een
      fonds voor gemene rekening verstaan: een fonds voor gemene rekening als bedoeld in
      [artikel 2, vierde lid, van de Wet op de vennootschapsbelasting 1969][ref11].

      7 Voor de toepassing van deze wet en de daarop berustende bepalingen wordt een naar het recht van een andere staat
      opgericht of aangegaan lichaam ook aangemerkt als voordeelgerechtigde, mits:

      a. de rechtsvorm van dat lichaam vergelijkbaar is met die van een lichaam als bedoeld in
      [artikel 2, eerste lid, onderdelen a, b, c, e, f of g, van de Wet op de vennootschapsbelasting 1969][ref12];

      b. de rechtsvorm van dat lichaam niet vergelijkbaar is met die van een lichaam als bedoeld in
      [artikel 2, eerste lid, onderdelen a, b, c, e, f of g, van die wet][ref13], noch met die van een
      maatschap, vennootschap onder firma, commanditaire vennootschap of een transparant fonds als bedoeld in
      [artikel 2.14bis, zevende lid, van de Wet inkomstenbelasting 2001][ref14], en dat lichaam:

      1°. in Nederland is gevestigd; of

      2°. niet in Nederland is gevestigd en de bezittingen en schulden alsmede de opbrengsten en kosten van dat lichaam
      volgens de fiscale wetgeving van een staat die dat lichaam als inwoner behandelt worden toegerekend aan dat
      lichaam.

      8 In afwijking van het eerste lid, onderdeel e, wordt een staat die voor het eerst bij ministeriële regeling
      wordt aangewezen als staat als bedoeld in het eerste lid, onderdeel e, en in relatie waarmee op het moment van
      die eerste aanwijzing reeds een verdrag ter voorkoming van dubbele belasting van kracht is voor de toepassing van
      deze wet niet eerder als laagbelastende jurisdictie aangemerkt dan nadat sinds dat moment drie kalenderjaren zijn
      verstreken.

      9 Indien voordelen als bedoeld in [artikel 3.1][ref15] op grond van
      [artikel 2.14bis, eerste of tweede lid, van de Wet inkomstenbelasting 2001][ref16] worden toegerekend aan een
      participant in een lichaam als bedoeld in artikel 2.14bis, eerste of tweede lid, van die wet, wordt voor de
      toepassing van deze wet en de daarop berustende bepalingen die participant aangemerkt als de gerechtigde tot de
      voordelen, bedoeld in artikel 3.1.

      10 Bij of krachtens algemene maatregel van bestuur worden regels gesteld voor de beoordeling of
      voor de toepassing van deze wet en de daarop berustende bepalingen een naar het recht van een
      andere staat opgericht of aangegaan lichaam een met de rechtsvorm van een lichaam als bedoeld in
      [artikel 2, eerste lid, onderdelen a, b, c, e, f of g, van de Wet op de vennootschapsbelasting 1969][ref17] of
      een met die van een maatschap, vennootschap onder firma, commanditaire vennootschap of een transparant fonds als
      bedoeld in [artikel 2.14bis, zevende lid, van de Wet inkomstenbelasting 2001][ref18] vergelijkbare rechtsvorm
      heeft. Daarbij kunnen ook regels worden gesteld voor de beoordeling of een naar het recht van een andere staat
      opgericht of aangegaan lichaam naast de rechtsvorm ook voor het overige met een lichaam vergelijkbaar is als
      bedoeld in de eerste zin.


