  - number: '3.4'
    text: |-
      1 De voordelen in de vorm van royalty’s zijn de vergoedingen, bedoeld in het tweede lid, verschuldigd door:

      a. een in Nederland gevestigde aan de voordeelgerechtigde gelieerde inhoudingsplichtige; of

      b. een niet in Nederland gevestigde aan de voordeelgerechtigde gelieerde inhoudingsplichtige voor zover de met die
      vergoedingen corresponderende lasten worden toegerekend aan een vaste inrichting in Nederland.

      2 Voor de toepassing van dit artikel wordt onder royalty’s verstaan: vergoedingen van welke aard dan ook:

      a. voor het gebruik van of het recht op gebruik van:

      1°. een auteursrecht op een werk op het gebied van de letterkunde, kunst of wetenschap, daaronder begrepen
      bioscoopfilms en software;

      2°. een octrooi;

      3°. een fabrieks- of handelsmerk;

      4°. een tekening of model;

      5°. een plan;

      6°. een geheim recept of geheime werkwijze; of

      b. voor inlichtingen omtrent ervaringen op het gebied van nijverheid, handel of wetenschap.

      3 Voor de toepassing van dit artikel wordt onder vaste inrichting mede verstaan: onroerende zaken, rechten,
      schuldvorderingen en werkzaamheden als bedoeld in [artikel 17a van de Wet op de vennootschapsbelasting 1969][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel17a
