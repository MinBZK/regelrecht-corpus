  - number: '1.3'
    text: |-
      1 Indien de oprichting van een inhoudingsplichtige heeft plaatsgevonden naar Nederlands recht, wordt voor de
      toepassing van deze wet en de daarop berustende bepalingen die inhoudingsplichtige geacht in Nederland te zijn
      gevestigd. Een Europese naamloze vennootschap die bij haar oprichting werd beheerst door Nederlands recht, wordt
      voor de toepassing van de eerste zin geacht te zijn opgericht naar Nederlands recht.

      2 Voor de toepassing van deze wet en de daarop berustende bepalingen worden op de BES eilanden gevestigde
      inhoudingsplichtigen die door de toepassing van [artikel 5.2 van de Belastingwet BES][ref1] geacht worden niet op
      de BES eilanden te zijn gevestigd, geacht in Nederland te zijn gevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel5.2
    url: https://wetten.overheid.nl/BWBR0042952/2026-01-01#Artikel1.3
