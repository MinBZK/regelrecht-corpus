  - number: '6.4'
    text: |-
      1 Indien het aan opzet of grove schuld van de inhoudingsplichtige is te wijten dat de verplichting, bedoeld in
      [artikel 6.3, eerste lid][ref1], niet wordt nagekomen, vormt dit een vergrijp ter zake waarvan de inspecteur hem
      een bestuurlijke boete kan opleggen van ten hoogste 100% van de in het tweede lid omschreven grondslag voor de
      boete.

      2 De grondslag voor de boete wordt gevormd door het bedrag aan belasting dat als gevolg van het niet nakomen van de
      verplichting, bedoeld in [artikel 6.3, eerste lid][ref2], niet zou zijn geheven.

      3 Voor de toepassing van dit artikel is [artikel 67o, derde lid, van de Algemene wet inzake rijksbelastingen][ref3]
      van overeenkomstige toepassing.

      4 De bevoegdheid tot het opleggen van een vergrijpboete op grond van het eerste lid vervalt door verloop van vijf
      jaren na afloop van het kalenderjaar waarin de belastingschuld is ontstaan.


