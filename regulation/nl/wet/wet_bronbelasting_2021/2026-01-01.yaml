    text: |-
      1 De voordelen, bedoeld in [artikel 3.1, onderdelen a en b][ref1], worden beschouwd te zijn genoten op het
      tijdstip waarop zij:

      a. betaald of verrekend worden, ter beschikking van de voordeelgerechtigde worden gesteld of rentedragend worden;
      of

      b. vorderbaar en tevens inbaar worden.

      2 Gedurende het tijdvak gerijpte doch aan het einde van dat tijdvak nog niet genoten renten of royalty’s worden
      beschouwd op 31 december van dat tijdvak te zijn genoten.

      3 Voor zover aannemelijk wordt gemaakt dat over een bedrag reeds met toepassing van het tweede lid belasting is
      geheven, behoort dat bedrag niet tot de voordelen, bedoeld in [artikel 3.1, onderdelen a en b][ref2], op het
      moment dat het eerste lid toepassing vindt.

      4 De voordelen, bedoeld in [artikel 3.1, onderdeel c][ref3], worden beschouwd te zijn genoten op het tijdstip
      waarop zij ter beschikking van de voordeelgerechtigde worden gesteld.


