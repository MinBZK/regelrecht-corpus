  - number: '6.3'
    text: |-
      1 De inhoudingsplichtige is gehouden de inspecteur eigener beweging juiste en volledige inlichtingen of gegevens
      die van belang kunnen zijn voor de heffing van de belasting waarvan de inhouding aan hem is opgedragen te
      verstrekken binnen twee weken nadat hem bekend is geworden dat die inlichtingen of gegevens niet, onjuist of
      onvolledig door hem zijn verstrekt.

      2 De verplichting, bedoeld in het eerste lid, wordt nagekomen op de door de inspecteur aangegeven wijze.

      3 De verplichting, bedoeld in het eerste lid, vervalt door verloop van vijf jaren na afloop van het kalenderjaar
      waarin de belastingschuld is ontstaan.
