preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is een bronbelasting op renten en royalty’s naar
    laagbelastende jurisdicties en in misbruiksituaties te introduceren en enkele antimisbruikbepalingen in de
    dividendbelasting en vennootschapsbelasting te wijzigen om de aanpak van belastingontwijking voortvarend voort
    te zetten;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0042952/2021-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Onder de naam bronbelasting wordt een belasting geheven van het lichaam, bedoeld in [artikel 2.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0042952#Artikel2
    url: https://wetten.overheid.nl/BWBR0042952/2021-01-01#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0042952
        artikel: '2'
        hoofdstuk: '2'
  - number: 1.2.1
    text: |-
      Voor de toepassing van deze wet en de daarop berustende bepalingen wordt verstaan onder: - *voordeelgerechtigde:*
      een lichaam dat gerechtigd is tot voordelen als bedoeld in [artikel 3.1][ref1];
        - *inhoudingsplichtige:* 1°. naamloze vennootschappen; 2°. besloten vennootschappen met beperkte
      aansprakelijkheid; 3°. open commanditaire vennootschappen; 4°. andere, al dan niet rechtspersoonlijkheid
      bezittende, vennootschappen waarvan het kapitaal geheel of ten dele in aandelen is verdeeld; 5°.
      coöperaties en verenigingen op coöperatieve grondslag; 6°. onderlinge waarborgmaatschappijen; 7°.
      verenigingen; 8°. stichtingen; 9°. andere rechtspersonen; 10°. fondsen voor gemene rekening als bedoeld in
      [artikel 2, derde lid, van de Wet op de vennootschapsbelasting 1969][ref2]; 11°. doelvermogens; 12°. met de
      lichamen, genoemd onder 1° tot en met 11°, vergelijkbare buitenlandse lichamen;
        - *aan de voordeelgerechtigde gelieerde inhoudingsplichtige:* een inhoudingsplichtige: 1°. waarin de
      voordeelgerechtigde onmiddellijk of middellijk een kwalificerend belang heeft; 2°. die onmiddellijk of middellijk
      een kwalificerend belang heeft in de voordeelgerechtigde; 3°. waarin een derde onmiddellijk of middellijk
      een kwalificerend belang heeft, terwijl die derde tevens onmiddellijk of middellijk een kwalificerend belang
      heeft in de voordeelgerechtigde; 4°. waarin de voordeelgerechtigde onmiddellijk of middellijk een belang
      heeft en waarin hij samen met een of meer andere lichamen die met hem een samenwerkende groep als bedoeld in
      [artikel 10a, zesde lid, van de Wet op de vennootschapsbelasting 1969][ref3] vormen onmiddellijk of middellijk
      een kwalificerend belang heeft; 5°. die onmiddellijk of middellijk een belang heeft in de voordeelgerechtigde en
      die samen met een of meer andere lichamen die met die inhoudingsplichtige een samenwerkende groep als bedoeld in
      [artikel 10a, zesde lid, van de Wet op de vennootschapsbelasting 1969][ref4] vormen onmiddellijk of middellijk
      een kwalificerend belang heeft in de voordeelgerechtigde; of 6°. waarin lichamen die deel uitmaken van een
      samenwerkende groep als bedoeld in [artikel 10a, zesde lid, van de Wet op de vennootschapsbelasting 1969][ref5]
      gezamenlijk onmiddellijk of middellijk een kwalificerend belang hebben en die lichamen tevens gezamenlijk
      onmiddellijk of middellijk een kwalificerend belang hebben in de voordeelgerechtigde;
        - *kwalificerend belang:* een belang waarmee een zodanige invloed op de besluiten van een lichaam kan worden
      uitgeoefend dat de activiteiten van het lichaam kunnen worden bepaald;
        - *laagbelastende jurisdictie:* een bij ministeriële regeling aangewezen staat die: 1°. op 1 oktober van het
      kalenderjaar dat voorafgaat aan het tijdvak, bedoeld in [artikel 5.1, derde lid][ref6], lichamen niet of naar een
      tarief van minder dan 9% onderwerpt aan een belasting naar de winst; of 2°. is opgenomen in een in het kalenderjaar
      dat voorafgaat aan het tijdvak, bedoeld in [artikel 5.1, derde lid][ref7], geldende EU-lijst van niet-coöperatieve
      rechtsgebieden voor belastingdoeleinden;
        - *vaste inrichting:* een vaste inrichting als bedoeld in
      [artikel 3, vierde tot en met twaalfde lid, van de Wet op de vennootschapsbelasting 1969][ref8].


