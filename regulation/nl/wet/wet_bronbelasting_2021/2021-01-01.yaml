  - number: 1.2.2
    text: |-
      In afwijking van het eerste lid, onderdeel e, wordt een staat die voor het eerst bij ministeriële regeling wordt
      aangewezen als staat als bedoeld in het eerste lid, onderdeel e, en in relatie waarmee op het moment van die
      eerste aanwijzing reeds een verdrag ter voorkoming van dubbele belasting van kracht is voor de toepassing van
      deze wet niet eerder als laagbelastende jurisdictie aangemerkt dan nadat sinds dat moment drie kalenderjaren zijn
      verstreken.
    url: https://wetten.overheid.nl/BWBR0042952/2021-01-01#Artikel1.2
  - number: 1.3.1
    text: |-
      Indien de oprichting van een inhoudingsplichtige heeft plaatsgevonden naar Nederlands recht, wordt voor de
      toepassing van deze wet en de daarop berustende bepalingen die inhoudingsplichtige geacht in Nederland te zijn
      gevestigd. Een Europese naamloze vennootschap die bij haar oprichting werd beheerst door Nederlands recht, wordt
      voor de toepassing van de eerste zin geacht te zijn opgericht naar Nederlands recht.
    url: https://wetten.overheid.nl/BWBR0042952/2021-01-01#Artikel1.3
  - number: 1.3.2
    text: |-
      Voor de toepassing van deze wet en de daarop berustende bepalingen worden op de BES eilanden gevestigde
      inhoudingsplichtigen die door de toepassing van [artikel 5.2 van de Belastingwet BES][ref1] geacht worden niet op
      de BES eilanden te zijn gevestigd, geacht in Nederland te zijn gevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel5
    url: https://wetten.overheid.nl/BWBR0042952/2021-01-01#Artikel1.3
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '5'
  - number: 2.1.1
    text: |-
      Belastingplichtig voor de belasting is een lichaam dat gerechtigd is tot voordelen als bedoeld in
      [artikel 3.1][ref1] en dat:


      [ref1]: https://wetten.overheid.nl/BWBR0042952#Artikel3
    url: https://wetten.overheid.nl/BWBR0042952/2021-01-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0042952
        artikel: '3'
        hoofdstuk: '3'
  - number: 2.1.1.a
    text: |-
      naar de omstandigheden beoordeeld in een laagbelastende jurisdictie is gevestigd of volgens de fiscale of andere
      regelgeving van die jurisdictie aldaar is gevestigd;
    url: https://wetten.overheid.nl/BWBR0042952/2021-01-01#Artikel2.1
  - number: 2.1.1.b
    text: |-
      niet in een laagbelastende jurisdictie is gevestigd, waarbij die voordelen worden toegerekend aan een vaste
      inrichting in een laagbelastende jurisdictie;
    url: https://wetten.overheid.nl/BWBR0042952/2021-01-01#Artikel2.1
  - number: 2.1.1.c
    text: |-
      volgens de fiscale regelgeving van een staat, niet zijnde Nederland of een laagbelastende jurisdictie, in die
      staat is gevestigd en gerechtigd is tot die voordelen met als hoofddoel of een van de hoofddoelen om de heffing
      van belasting bij een ander te ontgaan en er sprake is van een kunstmatige constructie of transactie of reeks van
      constructies of samenstel van transacties waarbij:
    url: https://wetten.overheid.nl/BWBR0042952/2021-01-01#Artikel2.1
  - number: 2.1.1.c.1°
    text: een constructie of transactie uit verscheidene stappen of onderdelen kan bestaan;
    url: https://wetten.overheid.nl/BWBR0042952/2021-01-01#Artikel2.1
  - number: 2.1.1.c.2°
    text: |-
      een constructie of transactie of reeks van constructies of samenstel van transacties als kunstmatig wordt beschouwd
      voor zover zij, onderscheidenlijk het, niet is opgezet op grond van geldige zakelijke redenen die de economische
      realiteit weerspiegelen;
    url: https://wetten.overheid.nl/BWBR0042952/2021-01-01#Artikel2.1
  - number: 2.1.1.d
    text: |-
      volgens de fiscale regelgeving van de staat waarin de voordeelgerechtigde is gevestigd, niet zijnde een
      laagbelastende jurisdictie, aldaar niet wordt behandeld als de gerechtigde tot die voordelen omdat die staat een
      lichaam waarin die voordeelgerechtigde een belang heeft als gerechtigde tot die voordelen beschouwt; of
    url: https://wetten.overheid.nl/BWBR0042952/2021-01-01#Artikel2.1
  - number: 2.1.1.e
    text: |-
      volgens de fiscale regelgeving van de staat op grond van wiens recht de voordeelgerechtigde is opgericht,
      niet zijnde een laagbelastende jurisdictie, aldaar niet wordt behandeld als de gerechtigde tot die voordelen
      omdat die voordeelgerechtigde volgens de fiscale regelgeving van die staat niet aldaar is gevestigd, en die
      voordeelgerechtigde niet volgens de fiscale regelgeving van een andere staat in laatstbedoelde staat is gevestigd.
    url: https://wetten.overheid.nl/BWBR0042952/2021-01-01#Artikel2.1
  - number: 2.1.2
    text: |-
      Het eerste lid, onderdeel a, is niet van toepassing indien aannemelijk wordt gemaakt dat de voordeelgerechtigde
      volgens de fiscale regelgeving van een andere staat, niet zijnde een laagbelastende jurisdictie, tevens in die
      staat is gevestigd en aldaar wordt behandeld als de gerechtigde tot de voordelen, bedoeld in het eerste lid,
      aanhef, en die voordeelgerechtigde niet volgens een door die staat met een andere staat gesloten verdrag ter
      voorkoming van dubbele belasting wordt geacht te zijn gevestigd in die andere staat.
    url: https://wetten.overheid.nl/BWBR0042952/2021-01-01#Artikel2.1
  - number: 2.1.3
    text: |-
      Het eerste lid, onderdeel d, is niet van toepassing indien aannemelijk wordt gemaakt dat het lichaam, bedoeld in
      het eerste lid, onderdeel d, volgens de fiscale regelgeving van de staat waarin dat lichaam is gevestigd aldaar
      als de gerechtigde tot de voordelen, bedoeld in het eerste lid, aanhef, wordt beschouwd, in welk geval dat lichaam
      wordt geacht de voordeelgerechtigde, bedoeld in het eerste lid, te zijn.
    url: https://wetten.overheid.nl/BWBR0042952/2021-01-01#Artikel2.1
  - number: 2.1.4
    text: |-
      Het eerste lid, onderdeel e, is niet van toepassing indien aannemelijk wordt gemaakt dat iedere achterliggende
      gerechtigde die al dan niet samen met een of meer andere lichamen die met die achterliggende gerechtigde een
      samenwerkende groep als bedoeld in [artikel 10a, zesde lid, van de Wet op de vennootschapsbelasting 1969][ref1]
      vormen een kwalificerend belang heeft in het lichaam, bedoeld in het eerste lid, onderdeel e, volgens de fiscale
      regelgeving van de staat waarin die achterliggende gerechtigde is gevestigd aldaar wordt behandeld als de
      gerechtigde tot de voordelen, bedoeld in het eerste lid, aanhef, en niet een lichaam is waarop zonder tussenkomst
      van de voordeelgerechtigde het eerste lid, onderdelen a, b, c of d, van toepassing zou zijn. Onder een belang als
      bedoeld in de eerste zin wordt mede verstaan een middellijk belang, mits op het lichaam of de lichamen via welke
      het middellijke belang wordt gehouden het eerste lid, onderdeel e, van toepassing zou zijn indien dit lichaam,
      onderscheidenlijk die lichamen, de voordeelgerechtigde zou, onderscheidenlijk zouden, zijn. Van achterliggende
      gerechtigdheid als bedoeld in de eerste zin is sprake voor zover de gerechtigdheid tot de voordelen, bedoeld in
      het eerste lid, aanhef, rechtstreeks verband houdt met een participatie in de voordeelgerechtigde, bedoeld in het
      eerste lid, onderdeel e.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel10a
    url: https://wetten.overheid.nl/BWBR0042952/2021-01-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 10a
  - number: 2.1.5
    text: |-
      Indien aan bij ministeriële regeling te stellen voorwaarden wordt voldaan, wordt voor de toepassing van het
      eerste lid, onderdeel c, tenzij de inspecteur het tegendeel aannemelijk maakt, de voordeelgerechtigde geacht
      niet gerechtigd te zijn tot de voordelen met als hoofddoel of een van de hoofddoelen om de heffing van belasting
      bij een ander te ontgaan en wordt geacht sprake te zijn van geldige zakelijke redenen die de economische
      realiteit weerspiegelen. Indien niet aan de voorwaarden, bedoeld in de eerste zin, wordt voldaan, dient de
      voordeelgerechtigde of de inhoudingsplichtige aannemelijk te maken dat:
    url: https://wetten.overheid.nl/BWBR0042952/2021-01-01#Artikel2.1
  - number: 2.1.5.a
    text: |-
      de voordeelgerechtigde niet gerechtigd is tot de voordelen met als hoofddoel of een van de hoofddoelen om de
      heffing van belasting bij een ander te ontgaan; of
    url: https://wetten.overheid.nl/BWBR0042952/2021-01-01#Artikel2.1
  - number: 2.1.5.b
    text: sprake is van geldige zakelijke redenen die de economische realiteit weerspiegelen.
    url: https://wetten.overheid.nl/BWBR0042952/2021-01-01#Artikel2.1
  - number: '3.1'
    text: 'De belasting wordt geheven over de voordelen in de vorm van:'
    url: https://wetten.overheid.nl/BWBR0042952/2021-01-01#Artikel3.1
  - number: 3.1.a
    text: |-
      renten als bedoeld in [artikel 3.3][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0042952#Artikel3
    url: https://wetten.overheid.nl/BWBR0042952/2021-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0042952
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.1.b
    text: |-
      royalty’s als bedoeld in [artikel 3.4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0042952#Artikel3
    url: https://wetten.overheid.nl/BWBR0042952/2021-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0042952
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.2.1
    text: |-
      Indien ter zake van voordelen als bedoeld in [artikel 3.1][ref1] voorwaarden worden overeengekomen of opgelegd
      (verrekenprijzen) die afwijken van voorwaarden die in het economische verkeer door onafhankelijke partijen zouden
      zijn overeengekomen, worden die voordelen bepaald alsof die laatstbedoelde voorwaarden zouden zijn overeengekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0042952#Artikel3
    url: https://wetten.overheid.nl/BWBR0042952/2021-01-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0042952
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.2.2
    text: |-
      Niet in geld genoten voordelen worden in aanmerking genomen naar de waarde die daaraan in het economische verkeer
      kan worden toegekend.
    url: https://wetten.overheid.nl/BWBR0042952/2021-01-01#Artikel3.2
  - number: 3.3.1
    text: |-
      De voordelen in de vorm van renten zijn de vergoedingen van welke aard dan ook – kosten daaronder begrepen – uit
      hoofde van geldleningen verschuldigd door:
    url: https://wetten.overheid.nl/BWBR0042952/2021-01-01#Artikel3.3
  - number: 3.3.1.a
    text: een in Nederland gevestigde aan de voordeelgerechtigde gelieerde inhoudingsplichtige; of
    url: https://wetten.overheid.nl/BWBR0042952/2021-01-01#Artikel3.3
  - number: 3.3.1.b
    text: |-
      een niet in Nederland gevestigde aan de voordeelgerechtigde gelieerde inhoudingsplichtige voor zover de met die
      vergoedingen corresponderende lasten worden toegerekend aan een vaste inrichting in Nederland.
    url: https://wetten.overheid.nl/BWBR0042952/2021-01-01#Artikel3.3
  - number: 3.3.2
    text: |-
      Voor de toepassing van dit artikel wordt onder een geldlening verstaan: een schuld die voortvloeit uit een
      overeenkomst van geldlening of een daarmee vergelijkbare overeenkomst.
    url: https://wetten.overheid.nl/BWBR0042952/2021-01-01#Artikel3.3
  - number: 3.4.1
    text: 'De voordelen in de vorm van royalty’s zijn de vergoedingen, bedoeld in het tweede lid, verschuldigd door:'
    url: https://wetten.overheid.nl/BWBR0042952/2021-01-01#Artikel3.4
  - number: 3.4.1.a
    text: een in Nederland gevestigde aan de voordeelgerechtigde gelieerde inhoudingsplichtige; of
    url: https://wetten.overheid.nl/BWBR0042952/2021-01-01#Artikel3.4
  - number: 3.4.1.b
    text: |-
      een niet in Nederland gevestigde aan de voordeelgerechtigde gelieerde inhoudingsplichtige voor zover de met die
      vergoedingen corresponderende lasten worden toegerekend aan een vaste inrichting in Nederland.
    url: https://wetten.overheid.nl/BWBR0042952/2021-01-01#Artikel3.4
  - number: 3.4.2
    text: 'Voor de toepassing van dit artikel wordt onder royalty’s verstaan: vergoedingen van welke aard dan ook:'
    url: https://wetten.overheid.nl/BWBR0042952/2021-01-01#Artikel3.4
  - number: 3.4.2.a
    text: 'voor het gebruik van of het recht op gebruik van:'
    url: https://wetten.overheid.nl/BWBR0042952/2021-01-01#Artikel3.4
  - number: 3.4.2.a.1°
    text: |-
      een auteursrecht op een werk op het gebied van de letterkunde, kunst of wetenschap, daaronder begrepen
      bioscoopfilms en software;
    url: https://wetten.overheid.nl/BWBR0042952/2021-01-01#Artikel3.4
  - number: 3.4.2.a.2°
    text: een octrooi;
    url: https://wetten.overheid.nl/BWBR0042952/2021-01-01#Artikel3.4
  - number: 3.4.2.a.3°
    text: een fabrieks- of handelsmerk;
    url: https://wetten.overheid.nl/BWBR0042952/2021-01-01#Artikel3.4
  - number: 3.4.2.a.4°
    text: een tekening of model;
    url: https://wetten.overheid.nl/BWBR0042952/2021-01-01#Artikel3.4
  - number: 3.4.2.a.5°
    text: een plan;
    url: https://wetten.overheid.nl/BWBR0042952/2021-01-01#Artikel3.4
  - number: 3.4.2.a.6°
    text: een geheim recept of geheime werkwijze; of
    url: https://wetten.overheid.nl/BWBR0042952/2021-01-01#Artikel3.4
  - number: 3.4.2.b
    text: voor inlichtingen omtrent ervaringen op het gebied van nijverheid, handel of wetenschap.
    url: https://wetten.overheid.nl/BWBR0042952/2021-01-01#Artikel3.4
  - number: 3.5.1
    text: |-
      De voordelen, bedoeld in [artikel 3.1][ref1], worden beschouwd te zijn genoten op het tijdstip waarop zij:


      [ref1]: https://wetten.overheid.nl/BWBR0042952#Artikel3
    url: https://wetten.overheid.nl/BWBR0042952/2021-01-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0042952
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.5.1.a
    text: betaald of verrekend worden, ter beschikking van de voordeelgerechtigde worden gesteld of rentedragend worden; of
    url: https://wetten.overheid.nl/BWBR0042952/2021-01-01#Artikel3.5
  - number: 3.5.1.b
    text: vorderbaar en tevens inbaar worden.
    url: https://wetten.overheid.nl/BWBR0042952/2021-01-01#Artikel3.5
  - number: 3.5.2
    text: |-
      Gedurende het tijdvak gerijpte doch aan het einde van dat tijdvak nog niet genoten renten of royalty’s worden
      beschouwd op 31 december van dat tijdvak te zijn genoten.
    url: https://wetten.overheid.nl/BWBR0042952/2021-01-01#Artikel3.5
  - number: 3.5.3
    text: |-
      Voor zover aannemelijk wordt gemaakt dat over een bedrag reeds met toepassing van het tweede lid belasting is
      geheven, behoort dat bedrag niet tot de voordelen, bedoeld in [artikel 3.1][ref1], op het moment dat het eerste lid
      toepassing vindt.


      [ref1]: https://wetten.overheid.nl/BWBR0042952#Artikel3
    url: https://wetten.overheid.nl/BWBR0042952/2021-01-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0042952
        artikel: '3'
        hoofdstuk: '3'
  - number: '4.1'
    text: |-
      De belasting bedraagt het hoogste percentage, bedoeld in
      [artikel 22 van de Wet op de vennootschapsbelasting 1969][ref1], van de voordelen, bedoeld in [artikel 3.1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0042952#Artikel3
    url: https://wetten.overheid.nl/BWBR0042952/2021-01-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0042952
        artikel: '3'
        hoofdstuk: '3'
  - number: '4.2'
    text: |-
      Indien de inhoudingsplichtige de belasting voor zijn rekening neemt, worden voor het berekenen van de belasting
      de voordelen, bedoeld in [artikel 3.1][ref1], vermenigvuldigd met 100/(100-T), waarbij T staat voor het geldende
      percentage van het tarief, bedoeld in [artikel 4.1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0042952#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0042952#Artikel4
    url: https://wetten.overheid.nl/BWBR0042952/2021-01-01#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0042952
        artikel: '3'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0042952
        artikel: '4'
        hoofdstuk: '4'
  - number: 5.1.1
    text: |-
      De belasting wordt geheven door inhouding op de voordelen, bedoeld in [artikel 3.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0042952#Artikel3
    url: https://wetten.overheid.nl/BWBR0042952/2021-01-01#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0042952
        artikel: '3'
        hoofdstuk: '3'
  - number: 5.1.2
    text: |-
      De inhoudingsplichtige houdt de belasting in op het tijdstip waarop de voordelen, bedoeld in [artikel 3.1][ref1],
      worden genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0042952#Artikel3
    url: https://wetten.overheid.nl/BWBR0042952/2021-01-01#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0042952
        artikel: '3'
        hoofdstuk: '3'
  - number: 5.1.3
    text: De inhoudingsplichtige draagt de in een tijdvak ingehouden belasting op aangifte af.
    url: https://wetten.overheid.nl/BWBR0042952/2021-01-01#Artikel5.1
  - number: 5.1.4
    text: |-
      Voor zover de belasting niet op de voordelen, bedoeld in [artikel 3.1][ref1], kan worden ingehouden, wordt de
      belasting geacht te zijn ingehouden op het genietingstijdstip, bedoeld in [artikel 3.5][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0042952#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0042952#Artikel3
    url: https://wetten.overheid.nl/BWBR0042952/2021-01-01#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0042952
        artikel: '3'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0042952
        artikel: '3'
        hoofdstuk: '3'
  - number: '6.1'
    text: |-
      Onverminderd het bepaalde in [artikel 20, tweede lid, van de Algemene wet inzake rijksbelastingen][ref1]
      wordt de naheffingsaanslag opgelegd aan de inhoudingsplichtige dan wel aan de belastingplichtige indien de
      inhoudingsplichtige de belasting die moet worden afgedragen geheel of gedeeltelijk niet heeft betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel20
    url: https://wetten.overheid.nl/BWBR0042952/2021-01-01#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '20'
  - number: 6.2.1
    text: |-
      [Artikel 47a van de Algemene wet inzake rijksbelastingen][ref1] is van overeenkomstige toepassing ter zake van
      gegevens en inlichtingen alsmede gegevensdragers die van belang kunnen zijn voor de heffing van de belasting
      waarvan de inhouding is opgedragen aan de inhoudingsplichtige en die in het bezit zijn van:


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel47a
    url: https://wetten.overheid.nl/BWBR0042952/2021-01-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 47a
  - number: 6.2.1.a
    text: de voordeelgerechtigde;
    url: https://wetten.overheid.nl/BWBR0042952/2021-01-01#Artikel6.2
  - number: 6.2.1.b
    text: een derde die onmiddellijk of middellijk een kwalificerend belang heeft in die inhoudingsplichtige; of
    url: https://wetten.overheid.nl/BWBR0042952/2021-01-01#Artikel6.2
  - number: 6.2.1.c
    text: |-
      lichamen die deel uitmaken van een samenwerkende groep als bedoeld in
      [artikel 10a, zesde lid, van de Wet op de vennootschapsbelasting 1969][ref1] en die gezamenlijk onmiddellijk of
      middellijk een kwalificerend belang hebben in die inhoudingsplichtige.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel10a
    url: https://wetten.overheid.nl/BWBR0042952/2021-01-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 10a
  - number: 6.2.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing ingeval [artikel 4.2][ref1] toepassing vindt.


      [ref1]: https://wetten.overheid.nl/BWBR0042952#Artikel4
    url: https://wetten.overheid.nl/BWBR0042952/2021-01-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0042952
        artikel: '4'
        hoofdstuk: '4'
  - number: 6.2.3
    text: |-
      [Artikel 52a van de Algemene wet inzake rijksbelastingen][ref1] is van overeenkomstige toepassing ingeval niet of
      niet volledig wordt voldaan aan de informatieverplichting ingevolge het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel52a
    url: https://wetten.overheid.nl/BWBR0042952/2021-01-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 52a
  - number: 6.3.1
    text: |-
      De inhoudingsplichtige is gehouden de inspecteur eigener beweging juiste en volledige inlichtingen of gegevens die
      van belang kunnen zijn voor de heffing van de belasting waarvan de inhouding aan hem is opgedragen te verstrekken
      binnen twee weken nadat hem bekend is geworden dat die inlichtingen of gegevens niet, onjuist of onvolledig door
      hem zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0042952/2021-01-01#Artikel6.3
  - number: 6.3.2
    text: De verplichting, bedoeld in het eerste lid, wordt nagekomen op de door de inspecteur aangegeven wijze.
    url: https://wetten.overheid.nl/BWBR0042952/2021-01-01#Artikel6.3
  - number: 6.3.3
    text: |-
      De verplichting, bedoeld in het eerste lid, vervalt door verloop van vijf jaren na afloop van het kalenderjaar
      waarin de belastingschuld is ontstaan.
    url: https://wetten.overheid.nl/BWBR0042952/2021-01-01#Artikel6.3
  - number: 6.4.1
    text: |-
      Indien het aan opzet of grove schuld van de inhoudingsplichtige is te wijten dat de verplichting, bedoeld in
      [artikel 6.3, eerste lid][ref1], niet wordt nagekomen, vormt dit een vergrijp ter zake waarvan de inspecteur hem
      een bestuurlijke boete kan opleggen van ten hoogste 100% van de in het tweede lid omschreven grondslag voor de
      boete.


      [ref1]: https://wetten.overheid.nl/BWBR0042952#Artikel6
    url: https://wetten.overheid.nl/BWBR0042952/2021-01-01#Artikel6.4
    references:
      - id: ref1
        bwb_id: BWBR0042952
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.4.2
    text: |-
      De grondslag voor de boete wordt gevormd door het bedrag aan belasting dat als gevolg van het niet nakomen van de
      verplichting, bedoeld in [artikel 6.3, eerste lid][ref1], niet zou zijn geheven.


      [ref1]: https://wetten.overheid.nl/BWBR0042952#Artikel6
    url: https://wetten.overheid.nl/BWBR0042952/2021-01-01#Artikel6.4
    references:
      - id: ref1
        bwb_id: BWBR0042952
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.4.3
    text: |-
      Voor de toepassing van dit artikel is [artikel 67o, derde lid, van de Algemene wet inzake rijksbelastingen][ref1]
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel67o
    url: https://wetten.overheid.nl/BWBR0042952/2021-01-01#Artikel6.4
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 67o
  - number: 6.4.4
    text: |-
      De bevoegdheid tot het opleggen van een vergrijpboete op grond van het eerste lid vervalt door verloop van vijf
      jaren na afloop van het kalenderjaar waarin de belastingschuld is ontstaan.
    url: https://wetten.overheid.nl/BWBR0042952/2021-01-01#Artikel6.4
  - number: 8.1.1
    text: Deze wet treedt in werking met ingang van 1 januari 2021.
    url: https://wetten.overheid.nl/BWBR0042952/2021-01-01#Artikel8.1
  - number: 8.1.2
    text: |-
      In afwijking van het eerste lid treden [artikel 7.2, onderdelen B en C][ref1], en [artikel 7.3][ref2] in werking
      met ingang van 1 januari 2020, met dien verstande dat artikel 7.2, onderdeel B, voor het eerst toepassing vindt met
      betrekking tot boekjaren die aanvangen op of na 1 januari 2020.


      [ref1]: https://wetten.overheid.nl/BWBR0042952#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0042952#Artikel7
    url: https://wetten.overheid.nl/BWBR0042952/2021-01-01#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0042952
        artikel: '7'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0042952
        artikel: '7'
        hoofdstuk: '7'
  - number: 8.1.3
    text: |-
      In afwijking van het eerste lid treedt [artikel 7.1][ref1] in werking met ingang van 1 januari 2022.


      [ref1]: https://wetten.overheid.nl/BWBR0042952#Artikel7
    url: https://wetten.overheid.nl/BWBR0042952/2021-01-01#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0042952
        artikel: '7'
        hoofdstuk: '7'
  - number: '8.2'
    text: 'Deze wet wordt aangehaald als: Wet bronbelasting 2021.'
    url: https://wetten.overheid.nl/BWBR0042952/2021-01-01#Artikel8.2
