  - number: '5'
    text: |-
      1 De informatie die verkregen is uit het onderzoek van de monsters, als bedoeld in [artikel 3][ref1] en [4][ref2]
      en de informatie verkregen van de leverancier van het pluimvee, dient schriftelijk te worden vastgelegd en te
      worden doorgegeven aan de afnemer. Deze informatie dient ingevuld te worden op het meldingsformulier of het
      koppelpaspoort. Dit formulier gaat met het koppel mee tot en met de slachterij.

      2 De informatie die verkregen is uit het onderzoek als bedoeld in [artikel 3][ref3] dient te worden doorgegeven aan
      de leverancier.

      3 Indien een Salmonella paratyphi B var. Java besmetting bij de onderzoeken, als bedoeld in [artikel 3][ref4] en
      [4][ref5] wordt gevonden, moet deze door de pluimveehouder binnen 48 uur gemeld worden aan het productschap. Op
      verantwoordelijkheid van de pluimveehouder kan hij dit laten doen door het erkende laboratorium.

      3 Zodra op het pluimveebedrijf bij een koppel een Salmonella paratyphi B var. Java besmetting is geconstateerd via
      het onderzoek dat conform [bijlage I][ref6] en/of [bijlage II][ref7] is uitgevoerd, moet de pluimveehouder iedere
      bezoeker hierover informeren zodra de afspraak voor het maken van een bezoek wordt gemaakt. De bezoeker bezoekt het
      betreffende bedrijf na alle andere bezoeken op die dag.


