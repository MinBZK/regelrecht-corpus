  - number: '6'
    text: |-
      1 In het geval dat in een stal bij een koppel vleeskuikens een besmetting met Salmonella is aangetoond dient de
      stal te worden onderzocht op de aanwezigheid van Salmonella.

      2 In het geval dat in het in het eerste lid bedoelde onderzoek Salmonella wordt aangetoond dient de ondernemer de
      stal, na het ruimen van het volgende koppel, te laten ontsmetten door een professioneel ontsmettingsbedrijf.

      3 Indien bij een koppel vleeskuikens een besmetting met Salmonella is aangetoond, dient door de pluimveehouder een
      traceringsonderzoek te worden uitgevoerd samen met een volgens de GVP-code erkende dierenarts, de Gezondheidsdienst
      voor Dieren of een andere deskundige. Het resultaat van dit onderzoek moet schriftelijk worden vastgelegd en
      inzicht kunnen geven in mogelijke oorzaken van de besmetting.

      Naast inzicht in mogelijke oorzaken van de besmetting moeten ook de ondernomen/te ondernemen acties worden
      vastgelegd, waarbij getracht wordt om een volgende besmetting te voorkomen. Het tracerings-, monitorings- en
      bestrijdingsplan in de pluimveevleessector kan daarbij als handleiding worden gebruikt.

      4 Indien de pluimveehouder graan voert afkomstig van eigen teelt of rechtstreeks afkomstig van een andere teler,
      dient van iedere partij graan een monster te worden achtergehouden. Indien bij een koppel vleeskuikens besmetting
      met Salmonella is aangetoond, dient het achtergehouden monster graan te worden onderzocht op de aanwezigheid
      van Salmonella. De monstername en het onderzoek geschieden volgens het werkvoorschrift zoals opgenomen in
      [bijlage IV][ref1] bij dit besluit.

      5 Indien het graan besmet is met Salmonella, mag de rest van de partij graan niet meer aan de vleeskuikens gevoerd
      worden, tenzij het graan zodanig is behandeld, dat het graan niet meer met Salmonella is besmet. Na de behandeling
      van het graan dient ter verificatie opnieuw volgens het werkvoorschrift zoals opgenomen in [bijlage IV][ref2]
      bij dit besluit een Salmonellaonderzoek te worden verricht. Het graan mag uitsluitend gevoerd worden indien het
      verificatieonderzoek uitwijst dat de partij graan niet meer met Salmonella is besmet.

      6 Indien het graan niet de oorzaak is van de Salmonella-besmetting bij de vleeskuikens, aangezien
      traceringsonderzoek inmiddels een andere oorzaak heeft uitgewezen, is het niet noodzakelijk het graan te
      onderzoeken op aanwezigheid van Salmonella.

      7 De pluimveehouder die zelf de in [artikel 4][ref3] bedoelde monsters neemt dient te voldoen aan de
      borgingssystematiek als omschreven in [bijlage VI][ref4].

      7 Nadat in een stal voor de tweede achtereenvolgende keer een Salmonella paratyphi B var. Java is geconstateerd
      via het onderzoek dat conform [bijlage I][ref5] en/of [II][ref6] is uitgevoerd, moet in de betreffende stal een
      leegstandperiode van minimaal 10 dagen in acht worden genomen. Tijdens deze periode kunnen bestrijdingsmaatregelen
      worden genomen.

      8 Na de constatering van een Salmonella paratyphi B var. Java besmetting moet de stal tijdens de in lid 7 genoemde
      leegstandperiode worden gereinigd en ontsmet op de wijze zoals in [bijlage VII][ref7] is omschreven.

      9 Tijdens de in lid 7 genoemde leegstandperiode na de constatering van een Salmonella paratyphi B var. Java
      besmetting moet de stal door een erkende instantie worden onderzocht op de aanwezigheid van Salmonella spp. op de
      wijze zoals in [bijlage VIII][ref8] is omschreven. Indien na de leegstandperiode de stal nog altijd besmet is met
      Salmonella spp. moet de pluimveehouder in overleg met externe deskundigen de verdere aanpak bepalen.

      10 Nadat voor de derde achtereenvolgende keer in een stal een Salmonella paratyphi B var. Java besmetting is
      geconstateerd, dient in de betreffende stal het voersysteem gereinigd en ontsmet te worden en dient tijdens de
      volgende ronde gedurende twee weken aan het drinkwater voor de vleeskuikens een middel met bacteriedodende werking
      te worden toegediend. Deze middelen zijn in de handel vrij verkrijgbaar. De wijze en de toe te dienen hoeveelheid
      moet gedaan worden volgens de aanwijzingen van de fabrikant.

      11 Nadat, met uitzondering van een eerste Salmonella paratyphi B var. Java constatering in de stal, op basis van
      de onderzoeken, omschreven in lid 7 en lid 9, geen Salmonella paratyphi B var. Java meer wordt aangetroffen, dienen
      enkele maatregelen gedurende drie achtereenvolgende ronden te worden uitgevoerd. De erkende instantie voert het
      hygiëne-onderzoek uit en onderzoekt de stal op aanwezigheid van Salmonella spp.

      12 De erkende instantie, als bedoeld in het negende en elfde lid wordt aangewezen door de voorzitter en werkt
      volgens een door het bestuur goedgekeurd protocol.


