    BESLUIT
  url: https://wetten.overheid.nl/BWBR0010846/2005-12-18#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Dit besluit neemt de terminologie, als omschreven in
      [artikel 1 van de Verordening hygiënevoorschriften pluimveehouderij 1999][ref1], over.


      [ref1]: https://wetten.overheid.nl/BWBR0010849#Artikel1
    url: https://wetten.overheid.nl/BWBR0010846/2005-12-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0010849
        artikel: '1'
  - number: '2'
    text: |-
      1 Een hygiëne-onderzoek dient een score te hebben die kleiner of gelijk is aan 1,5.

      2 Indien de score groter dan 1,5 maar kleiner of gelijk aan 3,0 is dan dient tijdens de volgende leegstandperiode
      opnieuw een hygiëne-onderzoek plaats te vinden.

      3 Indien de score groter is dan 3,0 dan dient tijdens de volgende leegstandsperiode te worden ontsmet door een
      professioneel ontsmettingsbedrijf. Na de ontsmetting dient opnieuw een hygiëne-onderzoek plaats te vinden.

      4 Wanneer overeenkomstig
      [bijlage III onder b. van het Besluit protocollen hygiënevoorschriften pluimveehouderij 1999][ref1] de uitkomst
      van twee van de vijf onderdelen van de visuele controle slecht is, worden na de volgende ronde nogmaals een
      hygiëneonderzoek en een visuele controle uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0010848
    url: https://wetten.overheid.nl/BWBR0010846/2005-12-18#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0010848
  - number: 2A
    text: |-
      Indien bij het pluimvee op het vleeskuikenbedrijf in de pluimveevleessector op de wijze zoals beschreven in het
      in [Bijlage II][ref1] opgenomen programma Salmonella is aangetoond, moet het vleeskuikenbedrijf een tracerings-,
      monitorings- en bestrijdingsplan overeenkomstig het model in [Bijlage V][ref2] opstellen en het betreffende plan
      uitvoeren.


      [ref1]: https://wetten.overheid.nl/BWBR0010846
      [ref2]: https://wetten.overheid.nl/BWBR0010846
    url: https://wetten.overheid.nl/BWBR0010846/2005-12-18#Artikel2A
    references:
      - id: ref1
        bwb_id: BWBR0010846
      - id: ref2
        bwb_id: BWBR0010846
  - number: '3'
    text: |-
      Bij binnenkomst van een koppel vleeskuikens op het vleeskuikenbedijf dient dat koppel op de wijze als omschreven in
      [Bijlage I][ref1] bemonsterd te worden.


      [ref1]: https://wetten.overheid.nl/BWBR0010846
    url: https://wetten.overheid.nl/BWBR0010846/2005-12-18#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0010846
  - number: '4'
    text: |-
      1 Bij het afleveren van een koppel vleeskuikens dient dat koppel op de wijze als omschreven in [Bijlage II][ref1]
      en [III][ref2] bemonsterd te zijn.

      2 Het onderzoek op aanwezigheid van Salmonella vindt plaats vanaf de leeftijd van 21 dagen. Indien de vleeskuikens
      worden afgeleverd voordat zij de leeftijd van 34 dagen hebben bereikt mag de monstername eerder plaatsvinden.
      De uitslag van het onderzoek is 14 dagen geldig, te rekenen vanaf de datum van afgifte van de uitslag door het
      laboratorium.

      De uitslag dient minimaal 48 uur voor aflevering aan de slachterij te worden doorgegeven.

      3 De resultaten van het onderzoek op aanwezigheid van Campylobacter moeten maximaal 7 dagen voor de
      afleveringsdatum in het bezit zijn van de ondernemer die een vleeskuikenbedrijf uitoefent. De uitslag dient
      minimaal 48 uur voor aflevering aan de slachterij te worden doorgegeven.

      4 Indien de ondernemer, die een vleeskuikenbedrijf de uitoefent, constateert dat de kratten of containers waarin
      een koppel pluimvee wordt vervoerd niet schoon zijn, is de betreffende ondernemer verplicht hiervan direct melding
      te doen bij het Productschap.

      5 Nadat bij een koppel vleeskuikens een Salmonella paratyhi B var. Java is geconstateerd moet, als de vleeskuikens
      een leeftijd van twee weken hebben bereikt, het onderzoek als omschreven in [Bijlage II][ref3] plaatsvinden. De
      uitslag moet bekend zijn voordat broedeieren voor een volgend koppel worden ingelegd op de broederij.

      6 De monsters, waarvan de wijze van monstername en analyse in de [bijlagen I][ref4], [II][ref5] en [III][ref6] zijn
      omschreven, moeten geanalyseerd worden op alle typen Salmonella. Bij een besmetting moet geanalyseerd worden om
      welk serotype het gaat.


