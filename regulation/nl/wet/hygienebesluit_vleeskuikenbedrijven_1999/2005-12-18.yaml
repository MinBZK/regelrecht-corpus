  - number: '7'
    text: |-
      1 Indien uit de uitslag van het onderzoek, bedoeld in [artikel 3][ref1] en in [artikel 4, tweede lid][ref2],
      blijkt dat een koppel pluimvee besmet is met Salmonella is de ondernemer verplicht er voor zorg te dragen dat het
      betreffende koppel gescheiden van niet besmette koppels wordt gevangen en afgevoerd.

      2 De ondernemer, die een vleeskuikenbedrijf uitoefent, is verplicht schriftelijk afspraken te maken omtrent het
      gescheiden vangen en afleveren en deze op zijn bedrijf aanwezig te hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0010846#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0010846#Artikel4
