  - number: '9'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden regelen gesteld met betrekking tot de inrichting en de
      werkwijze van de verwerkingsbedrijven voor hoog- of gespecificeerd hoog-risicomateriaal, de verwerkingsbedrijven
      voor laag-risico-materiaal en de bedrijven waarin laag-risico-materiaal wordt opgeslagen of wordt voorbewerkt,
      het ophalen, het vervoer, de identificatie en de bewaring van destructiemateriaal, de ten aanzien van het
      destructiemateriaal te voeren administratie, alsmede het eindprodukt van de verwerking.

      2 Bij de in het eerste lid bedoelde maatregel kan worden bepaald dat het bestuur van een produkt-, hoofdbedrijf- of
      bedrijfschap nadere regels kan dan wel moet stellen of andere besluiten kan dan wel moet nemen.

      3 Een krachtens toepassing van het tweede lid vastgestelde verordening of genomen besluit behoeft de goedkeuring
      van Onze Minister.

      4 Een krachtens toepassing van het tweede lid vastgestelde verordening is verbindend voor een ieder, voor zover
      daarin niet anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0002244/2000-03-03#Artikel9
  - number: '10'
    text: |-
      1 Onze Minister stelt voor iedere ondernemer met het oog op een doelmatige voorziening in de verwerking van hoog-
      of gespecificeerd hoog-risicomateriaal het gebied vast waarin deze, met uitsluiting van andere ondernemers, ter
      zake van verwerking van hoog- of gespecificeerd hoog-risicomateriaal werkzaam is. Onze Minister kan in bijzondere
      omstandigheden daarbij aangeven dat daarbij aangewezen categorieën van hoog- of gespecificeerd hoog-risicomateriaal
      niet mogen worden verwerkt dan wel daarbij aangewezen categorieën van hoog- of gespecificeerd hoog-risicomateriaal
      uitsluitend mogen worden verwerkt. Het in de eerste volzin bedoelde gebied kan, voor zover daarover overeenstemming
      bestaat met de andere lid-staat van de Europese Gemeenschap, zich mede uitstrekken tot het grondgebied of een deel
      van het grondgebied van die andere lid-staat. Onze Minister kan tevens voor een buitenlands verwerkingsbedrijf voor
      hoog- of gespecificeerd hoog-risicomateriaal een gebied binnen Nederland aanwijzen, waarin deze, met uitsluiting
      van andere ondernemers, met inachtneming van de door het land van vestiging gestelde regels, ter zake van
      verwerking van hoog- of gespecificeerd hoog-risicomateriaal werkzaam is.

      2 Onze Minister kan in het belang van een doelmatige voorziening in de verwerking van hoog- of gespecificeerd hoog-
      risicomateriaal en met inachtneming van het derde en achtste lid de in het eerste lid bedoelde gebieden wijzigen.

      3 Ingeval een gebied wordt gewijzigd, dan wel wijziging wordt gebracht in de te verwerken categorieën van hoog-
      of gespecificeerd hoog-risicomateriaal, wordt door Onze Minister, de daarbij betrokken ondernemers gehoord,
      vastgesteld:

      a. een aan de ondernemer naar de mate van zijn nadeel tengevolge van de wijziging door het Rijk toe te kennen
      schadeloosstelling;

      b. een door de ondernemer naar de mate van zijn voordeel tengevolge van de wijziging aan het Rijk te betalen
      bedrag.

      4 Een ondernemer kan, als gevolg van overmacht, in afwijking van het bepaalde in het eerste lid, met toestemming
      van Onze Minister, door overdracht tijdelijk zijn werkzaamheden geheel of gedeeltelijk doen verrichten door een of
      meer andere ondernemers.

      5 Overdracht van werkzaamheden, als bedoeld in het vierde lid, kan door Onze Minister voor de duur der overmacht
      aan een ondernemer worden opgelegd. Iedere daarbij door Onze Minister aangewezen ondernemer is verplicht de over te
      dragen werkzaamheden te verrichten. Het derde lid is met betrekking tot het toekennen van schadeloosstelling aan of
      het betalen van een bedrag door de ondernemer van overeenkomstige toepassing. Aan de ondernemer, tegen wie wegens
      handelen of nalaten in strijd met de bij of krachtens deze wet aan hem opgelegde verplichtingen de bijkomende straf
      is uitgesproken, bedoeld in [artikel 7, onder ][ref1], wordt terzake van overdracht van werkzaamheden tijdens de
      duur van deze straf geen schadeloosstelling toegekend.

      6 Bij algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven omtrent de vaststelling van de
      schadeloosstelling en het bedrag, als bedoeld in het derde lid en als bedoeld in het vijfde lid, alsmede omtrent de
      wijze van betaling daarvan.

      7 Van een beschikking ingevolge dit artikel wordt mededeling gedaan in de *Staatscourant*.

      8 Indien de derde of vierde volzin van het eerste lid is toegepast, zijn het derde tot en met zesde lid slechts
      van toepassing, voor zover dat niet in strijd is met het nationale recht van de betrokken andere lid-staat van de
      Europese Gemeenschap.


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel7
