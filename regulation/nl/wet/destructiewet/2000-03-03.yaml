  - number: 4b
    text: |-
      1 Onze Minister kan met betrekking tot het brengen in Nederland en het anders dan in doorvoer buiten Nederland
      brengen van laag-risico-materiaal regelen stellen, anders dan die bedoeld in het tweede lid.

      2 Onze Minister van Landbouw, Natuurbeheer en Visserij kan met het oog op de gezondheid van dieren regelen stellen
      met betrekking tot het brengen in Nederland en het anders dan in doorvoer buiten Nederland brengen van laag-risico-
      materiaal.
    url: https://wetten.overheid.nl/BWBR0002244/2000-03-03#Artikel4b
  - number: 4c
    text: |-
      Voor keuringen of controles die voortvloeien uit de in de [artikelen 4a, vierde en vijfde lid][ref1], en [4b][ref2]
      bedoelde regelen brengt Onze Minister onder wiens verantwoordelijkheid deze keuringen of controles worden
      uitgevoerd, een vergoeding van kosten in rekening overeenkomstig een door hem vastgesteld tarief.


      [ref1]: https://wetten.overheid.nl/BWBR0002244#Artikel4a
      [ref2]: https://wetten.overheid.nl/BWBR0002244#Artikel4b
