  - number: '5'
    text: |-
      1 Het is verboden zonder vergunning van Onze Minister:

      a. een verwerkingsbedrijf voor hoog- of gespecificeerd hoog-risicomateriaal op te richten, in werking te hebben, in
      werking te houden, uit te breiden of te wijzigen;

      b. een bedrijf waarin laag-risico-materiaal wordt opgeslagen of wordt voorbewerkt, dan wel een verwerkingsbedrijf
      waarin laag-risico-materiaal tot ingrediënten van diervoeder of vismeel wordt verwerkt, te beginnen, uit te
      oefenen, uit te breiden of te wijzigen;

      c. een crematorium voor dode paarden op te richten, in werking te hebben, in werking te houden, uit te breiden of
      te wijzigen.

      2 Het is verboden een verwerkingsbedrijf dat laag-risico-materiaal gebruikt voor de bereiding van voeder voor
      gezelschapsdieren of farmaceutische of technische produkten, te beginnen, uit te oefenen, uit te breiden of te
      wijzigen zonder dat registratie daarvan heeft plaatsgevonden in het register van voornoemde verwerkingsbedrijven,
      dat door Onze Minister of een door hem aangewezen orgaan wordt bijgehouden.

      3 De vergunning wordt voor onbepaalde tijd verleend. De inschrijving in het register geschiedt eveneens voor
      onbepaalde tijd.

      4 Voor de behandeling van een aanvraag om een vergunning en een aanvraag tot inschrijving in een register is door
      de aanvrager een vergoeding verschuldigd volgens een door Onze Minister vastgesteld tarief. Onze Minister regelt de
      wijze van betaling van de vergoeding.

      5 Een aanvraag wordt niet in behandeling genomen alvorens de in het vierde lid bedoelde vergoeding is ontvangen.
    url: https://wetten.overheid.nl/BWBR0002244/2000-03-03#Artikel5
  - number: 5a
    text: |-
      1 Onze Minister trekt de vergunning in, indien niet meer wordt voldaan aan het bij of krachtens deze wet bepaalde.
      Onze Minister kan in het belang van een doelmatige voorziening in de verwerking van hoog- of gespecificeerd hoog-
      risico-materiaal aan een vergunning voor de verwerking van dat materiaal beperkingen verbinden.

      2 Onze Minister haalt de inschrijving in het register, bedoeld in [artikel 5, tweede lid][ref1], door, indien niet
      meer wordt voldaan aan het bij of krachtens deze wet bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0002244#Artikel5
    url: https://wetten.overheid.nl/BWBR0002244/2000-03-03#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0002244
        artikel: '5'
  - number: '6'
    text: |-
      1 Het is de ondernemer verboden zonder bijzondere vergunning van Onze Minister ander materiaal dan
      destructiemateriaal ter verwerking in een verwerkingsbedrijf voor hoog- of gespecificeerd hoog-risicomateriaal
      te verzamelen of te doen verzamelen. Bij het verlenen van de vergunning kunnen voorschriften worden gegeven. Een
      vergunning wordt niet verleend dan na overleg met Onze Minister, wie het mede aangaat.

      2 De [artikelen 5, derde lid, eerste volzin][ref1], en [5a, eerste lid][ref2], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002244#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002244#Artikel5a
