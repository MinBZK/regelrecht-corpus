  - number: '29'
    text: Het Destructiebesluit 1942 vervalt.
    url: https://wetten.overheid.nl/BWBR0002244/2000-03-03#Artikel29
  - number: '30'
    text: Deze wet kan worden aangehaald onder de titel "Destructiewet".
