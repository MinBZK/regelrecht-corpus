  - number: '11'
    text: |-
      Hoofden en bestuurders van verwerkingsbedrijven van hoog- of gespecificeerd hoog-risicomateriaal,
      verwerkingsbedrijven van laag-risico-materiaal of bedrijven waarin laag-risico-materiaal wordt opgeslagen of wordt
      voorbewerkt, nemen alle maatregelen die nodig zijn om te verzekeren dat de ter zake van hun categorie van bedrijven
      bij of krachtens deze wet gestelde regels worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0002244/2000-03-03#Artikel11
  - number: '12'
    text: |-
      1 De eigenaar of houder van hoog- of gespecificeerd hoog-risicomateriaal is verplicht het overeenkomstig door Onze
      Minister te stellen regelen te administreren, het aan te geven bij, alsmede het ter beschikking te houden van en af
      te staan aan de ondernemer binnen wiens werkgebied het materiaal zich bevindt.

      2 De ondernemer is verplicht tot het ophalen, het vervoeren en de verwerking van het in het eerste lid bedoelde
      hoog- of gespecificeerd hoog-risicomateriaal, overeenkomstig de bij of krachtens deze wet gegeven regelen.

      3 De eigenaar of houder van laag-risico-materiaal is verplicht zorg te dragen dat dat materiaal overeenkomstig door
      Onze Minister te stellen regelen wordt verpakt, geëtiketteerd en bewaard.
    url: https://wetten.overheid.nl/BWBR0002244/2000-03-03#Artikel12
  - number: '13'
    text: |-
      1 Door Onze Minister kan, zo nodig onder door hem te stellen voorschriften, ontheffing worden verleend van de in
      [artikel 12][ref1] bedoelde verplichtingen ten aanzien van hoog- of gespecificeerd hoog-risicomateriaal, dat door
      bijzondere omstandigheden niet overeenkomstig de bij of krachtens deze wet gegeven regelen kan worden opgehaald,
      vervoerd of onschadelijk gemaakt. Daarbij wordt in elk geval voorzien in de wijze van onschadelijk maken ervan.

      2 [Artikel 12, eerste en tweede lid][ref2], vindt geen toepassing ten aanzien van hoog- of gespecificeerd hoog-
      risicomateriaal dat aan wetenschappelijk onderzoek wordt onderworpen in door Onze Minister aangewezen inrichtingen,
      met inachtneming van door hem gestelde voorschriften.

      3 [Artikel 12][ref3] vindt geen toepassing ten aanzien van dode honden, katten en paarden die overeenkomstig bij
      algemene maatregel van bestuur gestelde regels op andere wijze onschadelijk worden gemaakt. Daarbij kan tevens
      worden voorzien in regels omtrent de inrichting van crematoria voor dode paarden, alsmede het ophalen en het
      vervoeren van dode paarden.

      4 [Artikel 3, tweede lid][ref4], is niet van toepassing op laag-risico-materiaal, dat:

      a. wordt bestemd voor het vervoederen aan dieren, waarvan de eigenaar of houder, dan wel een bedrijf als bedoeld
      in [artikel 5, eerste lid, onder b][ref5], dat voeder voor edelpelsdieren bereidt, op grond van bijzondere
      omstandigheden van Onze Minister een daartoe strekkende ontheffing heeft ontvangen; aan een ontheffing kunnen
      voorschriften worden verbonden;

      b. aan wetenschappelijk onderzoek wordt onderworpen in door Onze Minister aangewezen inrichtingen, met inachtneming
      van door hem gestelde voorschriften.

      5 Met betrekking tot een ontheffing als bedoeld in het eerste, onderscheidenlijk vierde lid kan Onze Minister
      regelen stellen aangaande de vordering van gelden van belanghebbenden ter bestrijding van de kosten, verbonden aan
      de uitvoering van het eerste, onderscheidenlijk vierde, lid.

      6 [Artikel 12, eerste en tweede lid][ref6], vindt geen toepassing ten aanzien van hoog- of gespecificeerd hoog-
      risicomateriaal dat ten gevolge van contact met of beïnvloeding anderszins door splijtstoffen, ertsen, radioactieve
      stoffen of ioniserende stralen uitzendende toestellen zodanig is bestraald of besmet, dat gevaar voor de openbare
      gezondheid te duchten is.


      [ref1]: https://wetten.overheid.nl/BWBR0002244#Artikel12
