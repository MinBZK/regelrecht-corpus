  - number: '17'
    text: |-
      1 Bij plaatselijke verordening worden ten aanzien van hoog-risico-materiaal als bedoeld in
      [artikel 2, eerste lid, onder ][ref1], regelen gesteld ter zake van:

      a. de aangifte en de bewaring door de eigenaar of houder van dat hoog-risico-materiaal;

      b. het ophalen en het vervoer van dat hoog-risico-materiaal;

      c. de overdracht van dat hoog-risico-materiaal aan de ondernemer.

      2 Indien en voor zover onschadelijkmaking plaatsvindt op een wijze als aangegeven in de krachtens
      [artikel 13, derde lid][ref2], gegeven regelen, behoeven de in het eerste lid bedoelde regelen niet te worden
      gesteld.

      3 Indien en voorzover omtrent de in het eerste lid, onder *b* en *c*, genoemde onderwerpen tussen de gemeente en
      de ondernemer een overeenkomst wordt gesloten, behoeft de plaatselijke verordening daaromtrent geen bepalingen
      te bevatten.


      [ref1]: https://wetten.overheid.nl/BWBR0002244#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002244#Artikel13
