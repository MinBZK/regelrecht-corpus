  - number: '7'
    text: |-
      Indien destructiemateriaal zodanig is verpakt in of - in strijd met het bepaalde in [artikel 4, derde lid][ref1] -
      is vermengd met ander materiaal dat dat destructiemateriaal niet zonder aanmerkelijke extra kosten is te verwerken,
      kan de ondernemer deze extra kosten verhalen op degene van wie dat destructiemateriaal afkomstig is. In de eerste
      volzin bedoelde extra kosten kunnen slechts worden verhaald voor zover dat in overeenstemming is met door Onze
      Minister te stellen nadere regelen.


      [ref1]: https://wetten.overheid.nl/BWBR0002244#Artikel4
    url: https://wetten.overheid.nl/BWBR0002244/2000-03-03#Artikel7
