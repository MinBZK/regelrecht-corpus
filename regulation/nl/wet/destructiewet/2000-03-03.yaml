    text: |-
      De eigenaar van destructiemateriaal heeft, volgens bij algemene maatregel van bestuur te stellen regelen, aanspraak
      op een door de ondernemer te betalen vergoeding voor de huiden van eenhoevige en herkauwende dieren, behoudens in
      bij die algemene maatregel van bestuur aangegeven uitzonderingsgevallen.
    url: https://wetten.overheid.nl/BWBR0002244/2000-03-03#Artikel14
  - number: '15'
    text: |-
      1 De eigenaar of houder van een gestorven of in nood gedood slachtdier, hetwelk ingevolge de
      [Vleeskeuringswet][ref1] (*Stb.* 1919, 524) onbruikbaar moet worden gemaakt voor voedsel voor mens en dier, is
      verplicht zorg te dragen, dat het vóór de overdracht aan de ondernemer niet van de huid wordt ontdaan.

      2 Deze verplichting geldt niet met betrekking tot het in het eerste lid bedoelde in nood gedode slachtdier, hetwelk
      in een bijzondere slachtplaats, aangewezen krachtens [artikel 5, tweede lid, van de Vleeskeuringswet][ref2], van de
      huid wordt ontdaan.


