  - number: '25'
    text: |-
      1 Aan de ondernemer, wiens destructor is toegelaten ingevolge het Destructiebesluit 1942, wordt een vergunning, als
      bedoeld in [artikel 5][ref1], verleend. Voor de toepassing van de eerste volzin wordt onder "destructor" verstaan
      een inrichting, uitsluitend of in hoofdzaak bestemd tot het onschadelijkmaken van hoog-risico-materiaal door het te
      verwerken tot nuttige produkten.

      2 De gebiedsindeling, vastgesteld bij beschikking van de Staatssecretaris van Sociale Zaken (Volksgezondheid)
      en de Minister van Landbouw, Visserij en Voedselvoorziening van 2 april 1951, no. 7760, Afdeling Volksgezondheid
      I ( *Stcrt.* 1951, 85), wordt voor de toepassing van het bij of krachtens deze wet bepaalde geacht te zijn
      vastgesteld ingevolge [artikel 10][ref2].

      3 De ondernemer, die op het tijdstip van het inwerkingtreden van deze wet een vergunning heeft tot het verwerken
      van ander materiaal dan hoog-risico-materiaal, wordt voor de toepassing van het bij of krachtens deze wet bepaalde
      geacht deze vergunning te hebben ontvangen ingevolge [artikel 6][ref3].

      4 Gedurende het tijdvak, waarin nog niet een verordening, als bedoeld in [artikel 17, eerste lid][ref4], in
      werking is getreden, geeft de eigenaar of houder van hoog-risico-materiaal terstond kennis van de aanwezigheid van
      dit hoog-risico-materiaal aan het hoofd van de keuringsdienst, bedoeld in [artikel 20][ref5] (*Stb.* 1919, 524),
      dan wel aan de in diens plaats door burgemeester en wethouders aangewezen ambtenaar. Deze kennisgeving geldt als
      aangifte ingevolge [artikel 12, eerste lid][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0002244#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002244#Artikel10
