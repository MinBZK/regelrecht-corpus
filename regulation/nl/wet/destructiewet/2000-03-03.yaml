  - number: '2'
    text: |-
      1 Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder hoog-risico-materiaal dierlijk
      afval, voor zover het betreft:

      a. gestorven slachtdieren, alsmede gestorven voor de landbouwproduktie gehouden dieren, met inbegrip van
      doodgeboren dieren en onvoldragen vruchten;

      b. dieren die in het kader van ziektebestrijdingsmaatregelen zijn gedood;

      c. dierlijk afval, dat ingevolge de [vleeskeuringswet][ref1] of de [Gezondheids- en welzijnswet voor dieren][ref2]
      onbruikbaar moet worden gemaakt voor voedsel voor mens en dier, alsmede alle pluimvee - of delen daarvan -, dat
      ingevolge de [Landbouwwet][ref3] ongeschikt is verklaard voor menselijke consumptie;

      d. alle delen van een geslacht dier, die niet aan de keuring na het slachten zijn onderworpen, met uitzondering van
      huiden, vellen, hoeven, veren, wol, hoornen en andere soortgelijke delen;

      e. alle vlees, met inbegrip van vlees van pluimvee, alsmede vis en wild, en alle levensmiddelen van dierlijke
      oorsprong, die zijn bedorven en derhalve een gevaar voor de gezondheid van mens en dier inhouden;

      f. van buiten de lid-staten van de Europese Gemeenschap of een andere Staat die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte ter invoer aangeboden dieren, vers vlees, daaronder begrepen vlees van
      pluimvee en wild, vis, vlees- en zuivelprodukten, die tijdens de voorgeschreven controle niet blijken te voldoen
      aan de veterinaire voorschriften voor invoer in de Europese Gemeenschap en de andere Staten die partij zijn bij de
      Overeenkomst betreffende de Europese Economische Ruimte, tenzij zij worden teruggevoerd naar het land van herkomst
      dan wel invoer ervan is toegestaan op beperkende voorwaarden die in bepalingen van de Europese Gemeenschap of de
      Overeenkomst betreffende de Europese Economische Ruimte zijn vastgesteld;

      g. dode honden en katten;

      h. dierlijk afval dat residuen van stoffen bevat, die gevaar kunnen opleveren voor de gezondheid van mens of
      dier, daaronder mede begrepen melk, vlees of produkten van dierlijke oorsprong, die door de aanwezigheid van deze
      residuen niet geschikt zijn voor menselijke consumptie;

      i. vissen met klinische verschijnselen van op de mens of op vissen overdraagbare ziekten.

      2 Onze Minister kan ander dan het in het eerste lid bedoelde dierlijk afval aanwijzen als hoog-risico-materiaal.
      Daarbij kan ten aanzien van categorieën van het dierlijk afval, bedoeld in de eerste volzin, worden bepaald dat de
      [artikelen 17, eerste en derde lid][ref4], en [20, derde lid][ref5], van overeenkomstige toepassing zijn.

      3 Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder laag-risico-materiaal dierlijk
      afval van de in het eerste lid bedoelde dieren en vis, dat niet ingevolge het eerste lid als hoog-risico-materiaal
      wordt aangemerkt, met dien verstande dat de ingevolge onderdeel *d* van dat lid daarvan uitgezonderde produkten
      slechts als laag-risico-materiaal worden aangemerkt, voor zover deze worden gebruikt bij de vervaardiging van
      ingrediënten van diervoeder.

      4 Voor de toepassing van het bij of krachtens deze wet bepaalde worden onder laag-risico-materiaal tevens verstaan
      niet voor menselijke consumptie bestemde poten en koppen, uitsluitend afkomstig van pluimvee waarbij noch bij de
      keuring voor het slachten overeenkomstig hoofdstuk VI van bijlage 1 bij [Richtlijn 71/118/EEG](31971L0118) van
      de Raad van de Europese Gemeenschappen van 15 februari 1971 inzake gezondheidsvraagstukken op het gebied van de
      produktie en het in de handel brengen van vers vlees van pluimvee (*PbEG* 1993, L 62), noch bij de keuring van het
      karkas na het slachten overeenkomstig hoofdstuk VIII van die bijlage, klinische verschijnselen van op mens of dier
      overdraagbare ziekten zijn vastgesteld.

      5 Voor de toepassing van het bij of krachtens deze wet bepaalde worden al de in open zee voor de produktie van
      vismeel gevangen vis, alsmede al het vers visafval, afkomstig van bedrijven die voor de menselijke consumptie
      bestemde visprodukten vervaardigen, in afwijking van het eerste lid, aangemerkt als laag-risico-materiaal.

      6 Mengsels van hoog-risico-materiaal en laag-risico-materiaal worden voor de toepassing van het bij of krachtens
      deze wet bepaalde aangemerkt als hoog-risico-materiaal.

      7 Bij regeling van Onze Minister kan als gespecificeerd hoog-risico-materiaal worden aangewezen:

      a. slachtdieren, of delen daarvan;

      b. dierlijk afval.

      8 Mengsels van hoog-risico-materiaal en gespecificeerd hoog-risico-materiaal, dan wel van laag-risico-materiaal en
      gespecificeerd hoog-risico-materiaal worden aangemerkt als gespecificeerd hoog-risico-materiaal.


      [ref1]: https://wetten.overheid.nl/BWBR0001896
      [ref2]: https://wetten.overheid.nl/BWBR0005662
      [ref3]: https://wetten.overheid.nl/BWBR0002252
      [ref4]: https://wetten.overheid.nl/BWBR0002244#Artikel17
      [ref5]: https://wetten.overheid.nl/BWBR0002244#Artikel20
