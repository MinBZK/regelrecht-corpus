      - id: ref1
        bwb_id: BWBR0002244
        artikel: '4'
  - number: '8'
    text: |-
      1 Een vergunning, onderscheidenlijk een inschrijving in het register, bedoeld in [artikel 5, tweede lid][ref1],
      wordt door Onze Minister vervallen verklaard, ingeval het verwerkingsbedrijf voor hoog- of gespecificeerd
      hoog-risicomateriaal of het bedrijf, bedoeld in [artikel 5, eerste lid, onder ][ref2], onderscheidenlijk het
      verwerkingsbedrijf, door de onderneming, anders dan tijdelijk als gevolg van overmacht, buiten werking wordt
      gesteld.

      2 Van een beschikking ingevolge dit artikel wordt mededeling gedaan in de *Staatscourant*.


      [ref1]: https://wetten.overheid.nl/BWBR0002244#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002244#Artikel5
