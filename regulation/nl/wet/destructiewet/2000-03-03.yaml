  - number: '31'
    text: |-
      Deze wet treedt in werking op een door Ons te bepalen tijdstip. Wij behouden Ons voor een ander tijdstip vast te
      stellen, waarop [artikel 23][ref1] in werking treedt, in welk geval artikel 11 van het Destructiebesluit 1942 op
      dat tijdstip vervalt.


