  - number: '3'
    text: |-
      1 Hoog-risico-materiaal wordt onschadelijk gemaakt volgens het bij of krachtens deze wet bepaalde.

      2 Laag-risico-materiaal wordt volgens het bij of krachtens deze wet bepaalde verwerkt tot ingrediënten van
      diervoeder of vismeel, tot voeder voor gezelschapsdieren of tot technische of farmaceutische produkten, dan wel op
      dezelfde wijze als hoog-risico-materiaal onschadelijk gemaakt.

      3 Bij regeling van Onze Minister wordt aangegeven op welke wijze gespecificeerd hoog-risico-materiaal wordt
      verwerkt en onschadelijk gemaakt.

      4

      5 Het eerste lid is niet van toepassing indien bij het nemen van maatregelen als bedoeld in
      [artikel 21 van de Gezondheids- en welzijnswet voor dieren][ref1] onschadelijkmaking door verbranden of begraven
      wordt bevolen.

      6 Onze Minister van Landbouw, Natuurbeheer en Visserij stelt eisen met betrekking tot begraven en verbranden als
      bedoeld in het vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel21
    url: https://wetten.overheid.nl/BWBR0002244/2000-03-03#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '21'
  - number: '4'
    text: |-
      1 Het is verboden destructiemateriaal aan verwerking te onttrekken.

      2 Het is verboden gespecificeerd hoog-risico-materiaal voor welk doel dan ook te gebruiken.

      3 Het is verboden destructiemateriaal, anders dan in een verwerkingbedrijf voor hoog- of voor laag-risico-
      materiaal, te mengen met ander materiaal dan destructiemateriaal.
    url: https://wetten.overheid.nl/BWBR0002244/2000-03-03#Artikel4
  - number: 4a
    text: |-
      1 Het is verboden hoog- of gespecificeerd hoog-risicomateriaal als bedoeld in
      [artikel 2, eerste lid, onder ][ref1]:

      a. van buiten het gebied waar het is ontstaan, te brengen naar het gebied, bedoeld in
      [artikel 10, eerste lid][ref2];

      b. vanuit het gebied, bedoeld in [artikel 10, eerste lid][ref3], naar een ander gebied te brengen.

      2 Onze Minister van Landbouw, Natuurbeheer en Visserij kan met het oog op de gezondheid van dieren in bijzondere
      gevallen ontheffing verlenen van het verbod, bedoeld in het eerste lid.

      3 Het is verboden laag-risico-materiaal in Nederland te brengen en anders dan in doorvoer buiten Nederland te
      brengen, tenzij zulks is toegestaan ingevolge de in [artikel 4][ref4] gestelde regelen.

      4 Het is verboden het eindprodukt van verwerking in Nederland te brengen en het anders dan in doorvoer buiten
      Nederland te brengen, tenzij het voldoet aan de ter zake door Onze Minister van Landbouw, Natuurbeheer en Visserij
      gestelde regelen.

      5 Het is verboden gespecificeerd hoog-risicomateriaal in Nederland te brengen vanuit een land buiten de Europese
      Gemeenschap of vanuit een zodanig land via Nederland naar een ander land binnen de Europese Gemeenschap door te
      voeren, tenzij een Nederland bindend verdrag dat binnenbrengen of doorvoeren toestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002244#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002244#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0002244#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0002244#Artikel4b
    url: https://wetten.overheid.nl/BWBR0002244/2000-03-03#Artikel4a
