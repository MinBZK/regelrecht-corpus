  - number: '23'
    text: |-
      1 Bij algemene maatregel van bestuur kunnen ter uitvoering van een krachtens het Verdrag tot oprichting van
      de Europese Gemeenschap of een ander verdrag tot stand gekomen bindend besluit nadere, zo nodig van deze wet
      afwijkende, regels worden gesteld.

      2 In gevallen waarin de totstandkoming van een algemene maatregel van bestuur niet kan worden afgewacht, kunnen bij
      ministeriële regeling zodanige regels worden gesteld.

      3 De ministeriële regeling vervalt een jaar nadat zij in werking is getreden, of, indien binnen die termijn een
      algemene maatregel van bestuur ter vervanging van die regeling in werking is getreden, op het tijdstip waarop de
      maatregel in werking treedt. De regeling kan door Onze Minister, mits met redenen omkleed, eenmaal met ten hoogste
      een jaar worden verlengd.
    url: https://wetten.overheid.nl/BWBR0002244/2000-03-03#Artikel23
  - number: '24'
    text: |-
      1 Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van Onze
      Minister en Onze Minister van Landbouw, Natuurbeheer en Visserij gezamenlijk aangewezen ambtenaren.

      2 De [artikelen 31][ref1], [31][ref2] en [31][ref3] zijn van overeenkomstige toepassing, met dien verstande dat het
      in [artikel 5:18 van de Algemene wet bestuursrecht][ref4] bedoelde onderzoek ook kan worden uitgevoerd in door Onze
      Minister aangewezen andere laboratoria.

      3 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de *Staatscourant*.


