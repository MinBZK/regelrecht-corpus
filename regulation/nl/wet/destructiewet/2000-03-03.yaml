  - number: '20'
    text: |-
      1 Indien gemeenten, hetzij afzonderlijk, hetzij gezamenlijk, in overeenstemming met de ondernemer een voorziening
      treffen terzake van het op een of meer verzamelplaatsen bijeenbrengen van hoog- of gespecificeerd hoog-
      risicomateriaal, wordt in de deswege te harer laste komende kosten jaarlijks bijgedragen door de ondernemer naar de
      mate van zijn uit de getroffen voorziening voortspruitende voordelen.

      2 Indien tussen de gemeente en de ondernemer geen overeenstemming wordt bereikt omtrent de bijdrage, bedoeld in
      het vorige lid, kan elk der partijen de bemiddeling inroepen van Gedeputeerde Staten of, indien de voorziening
      gemeenten betreft, welke niet in dezelfde provincie liggen, van een commissie uit Gedeputeerde Staten der betrokken
      provinciën.

      3 De gemeente verstrekt jaarlijks aan de ondernemer een bijdrage ter bestrijding van de werkelijke kosten die in
      het desbetreffende jaar zijn gemaakt ter zake van het ophalen van dode honden en katten.
    url: https://wetten.overheid.nl/BWBR0002244/2000-03-03#Artikel20
  - number: '21'
    text: |-
      1 De ondernemers kunnen aan de natuurlijke personen en rechtspersonen die

      a. hoog-risico-materiaal als bedoeld in [artikel 2, eerste lid, onder a][ref1], aanbieden een vergoeding in
      rekening brengen ter zake van het ophalen;

      b. gespecificeerd hoog-risico-materiaal als bedoeld in [artikel 2, zevende, achtste of negende lid][ref2],
      aanbieden een vergoeding in rekening brengen ter zake van het ophalen, vervoeren, voorbewerken, verbranden,
      begraven of op andere wijze onschadelijk maken van dat materiaal.

      2 De totale opbrengst van de vergoedingen overschrijdt de werkelijke kosten van het ophalen, bedoeld in het eerste
      lid, onder a, onderscheidenlijk het ophalen, vervoeren, voorbewerken, verbranden, begraven of op andere wijze
      onschadelijk maken, bedoeld in het eerste lid, onder b, niet.

      3 De werkelijke kosten worden berekend als volgt:

      a. de op jaarbasis door de ondernemers te maken kosten van het ophalen van het hoog-risico-materiaal, bedoeld in
      het eerste lid, onder a, verminderd met de waarde daarvan voorafgaand aan verwerking en het bij regeling van Onze
      Minister vast te stellen percentage van de winst van de ondernemers op de verwerking van dit materiaal;

      b. de op jaarbasis door de ondernemers te maken kosten van het ophalen, vervoeren, voorbewerken, verbranden,
      begraven of op andere wijze onschadelijk maken van het gespecificeerd hoog-risico-materiaal, bedoeld in het eerste
      lid, onder b.

      4 De tariefstelling en wijzigingen daarvan behoeven jaarlijks instemming van Onze Minister. Alvorens instemming
      wordt verleend, wordt het voornemen daartoe schriftelijk medegedeeld aan de beide kamers der Staten-Generaal.
      Instemming wordt niet eerder verleend dan nadat vier weken zijn verstreken na die mededeling. De instemming wordt
      bekend gemaakt in de Staatscourant.

      5 De ondernemer verschaft desgevraagd alle noodzakelijke informatie aan Onze Minister ten behoeve
      van de instemming, bedoeld in het vierde lid. Deze informatie gaat vergezeld van een verklaring
      omtrent de betrouwbaarheid van de informatie, opgesteld door een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002244#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002244#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel393
