preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is ter voorkoming van gevaar, schade of hinder voor de
    openbare gezondheid regelen vast te stellen omtrent het door verwerking tot nuttige producten onschadelijkmaken van
    ondeugdelijk materiaal van dierlijke herkomst;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002244/2000-03-03#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder:

      a. Onze Minister: Onze Minister van Volksgezondheid, Welzijn en Sport;

      b. slachtdieren: eenhoevige dieren, runderen, schapen, geiten, varkens en pluimvee;

      c. dierlijk afval: niet voor menselijke consumptie bestemde dode dieren, vis daaronder begrepen, of delen daarvan,
      en producten van dierlijke oorsprong, met uitzondering van dierlijke uitwerpselen, keukenafval en etensresten;

      d. destructiemateriaal: laag-, hoog-, en gespecificeerd hoog-risico-materiaal als bedoeld in [artikel 2][ref1];

      e. verwerking:

      1°. het verwerken van laag-risico-materiaal tot ingrediënten van diervoeder of vismeel, tot voeder voor
      gezelschapsdieren dan wel tot technische of farmaceutische producten in een verwerkingsbedrijf voor laag-risico-
      materiaal,

      2°. het onschadelijk maken van hoog-risico-materiaal door het te verwerken tot nuttige producten in een
      verwerkingsbedrijf voor hoog-risico-materiaal, dan wel,

      3°. het onschadelijk maken van gespecificeerd hoog-risicomateriaal op andere wijze dan onder 1° en 2° in, door of
      onder verantwoordelijkheid van een verwerkingsbedrijf voor gespecificeerd hoog-risico-materiaal;

      f. gezelschapsdieren: andere dieren dan slachtdieren, welke niet zijn bestemd of worden gehouden voor dierlijke of
      andere productie, en door de mens in of rond het huis worden gehouden en verzorgd;

      g. diervoeder: voeder voor andere dieren dan gezelschapsdieren, met uitzondering van vismeel;

      h. verwerkingsbedrijf voor laag-risico-materiaal: bedrijf waar laag-risico-materiaal wordt verwerkt tot
      ingrediënten van diervoeder of vismeel, tot voeder voor gezelschapsdieren dan wel tot technische of farmaceutische
      producten;

      i. verwerkingsbedrijf voor hoog-risico-materiaal: inrichting, uitsluitend of in hoofdzaak bestemd tot het
      onschadelijkmaken van hoog-risico-materiaal door dit te verwerken tot nuttige producten;

      j. verwerkingsbedrijf voor gespecificeerd hoog-risicomateriaal: inrichting, geschikt voor de verwerking van
      gespecificeerd hoog-risico-materiaal;

      k. ondernemer: natuurlijke of rechtspersoon, aan wie of aan welke een vergunning, als bedoeld in [artikel 5][ref2],
      is verleend ter zake van de verwerking van hoog- of specifiek hoog-risicomateriaal;


      [ref1]: https://wetten.overheid.nl/BWBR0002244#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002244#Artikel5
