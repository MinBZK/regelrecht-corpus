    text: |-
      1 Onze Minister van Landbouw, Natuurbeheer en Visserij kan van het bestuur van een produkt-, een hoofdbedrijf-,
      of een bedrijfschap vorderen regels als bedoeld in [artikel 4][ref1], in een door hem te bepalen omvang, bij
      verordening te stellen.

      2 Een zodanige verordening en krachtens de verordening vastgestelde nadere voorschriften, behoeven de goedkeuring
      van Onze Minister van Landbouw, Natuurbeheer en Visserij.


      [ref1]: https://wetten.overheid.nl/BWBR0002244#Artikel4a
