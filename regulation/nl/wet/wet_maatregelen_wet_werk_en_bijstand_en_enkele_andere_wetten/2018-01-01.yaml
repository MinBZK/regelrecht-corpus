preamble:
  text: >-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.


    Allen die deze zullen zien of horen lezen, saluut! doen te weten:


    Alzo Wij in overweging genomen hebben, dat maatregelen noodzakelijk zijn om sociale zekerheidsuitkeringen in
    stand en toegankelijk te houden, extra ondersteuning te bieden aan mensen die een steuntje in de rug nodig
    hebben, ernstige misdragingen jegens uitvoerders van de sociale zekerheidswetten tegen te gaan en de bijstand meer
    activerend te maken;


    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0035385/2018-01-01#ArtikelAanhef
articles:
  - number: XIX
    text: |-
      Op de schuldenaar op wie op de dag voorafgaand aan de datum van inwerkingtreding van [artikel XVI][ref1] de
      schuldsaneringsregeling natuurlijke personen van toepassing is, is gedurende de periode dat uitvoering wordt
      gegeven aan die regeling artikel XVI niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0035385#ArtikelXVI
    url: https://wetten.overheid.nl/BWBR0035385/2018-01-01#ArtikelXIX
    references:
      - id: ref1
        bwb_id: BWBR0035385
        artikel: XVI
  - number: XX
    text: >-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0035385/2018-01-01#ArtikelXX
  - number: XXI
    text: 'Deze wet wordt aangehaald als: Wet maatregelen Wet werk en bijstand en enkele andere wetten.'
    url: https://wetten.overheid.nl/BWBR0035385/2018-01-01#ArtikelXXI
