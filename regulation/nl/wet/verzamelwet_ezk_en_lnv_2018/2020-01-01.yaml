preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is in enkele wetten op het terrein van het Ministerie
    van Economische Zaken en Klimaat en het Ministerie van Landbouw, Natuur en Voedselkwaliteit wijzigingen van
    wetstechnische of anderszins ondergeschikte aard aan te brengen in verband met geconstateerde verschrijvingen,
    onjuiste verwijzingen, gebreken en leemten.

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0040942/2020-01-01#ArtikelAanhef
articles:
  - number: XVII
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip dat voor de verschillende artikelen of
      onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0040942/2020-01-01#ArtikelXVII
  - number: XVIII
    text: |-
      Deze wet wordt aangehaald als: Verzamelwet EZK en LNV, met vermelding van het jaartal van het Staatsblad waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0040942/2020-01-01#ArtikelXVIII
