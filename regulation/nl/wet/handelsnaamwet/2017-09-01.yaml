  - number: 6b
    text: |-
      De voorzieningenrechter kan op vordering van eiser tijdelijke voortzetting van de vermeende strijd met de
      [artikelen 5][ref1] of [5a][ref2] toestaan onder de voorwaarde dat de verweerder zekerheid stelt voor vergoeding
      van de door eiser geleden schade.


      [ref1]: https://wetten.overheid.nl/BWBR0001906#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0001906#Artikel5a
    url: https://wetten.overheid.nl/BWBR0001906/2017-09-01#Artikel6b
