  - number: '7'
    text: |-
      1 Hij die een handelsnaam voert in strijd met deze wet, wordt gestraft met een geldboete van de tweede categorie.

      2 Het feit wordt beschouwd als overtreding.

      3 Indien tijdens het plegen van de overtreding nog geen twee jaren zijn verlopen sedert een vroegere veroordeling
      van de schuldige wegens gelijke overtreding onherroepelijk is geworden, kan hechtenis van ten hoogste veertien
      dagen of geldboete van de tweede categorie worden opgelegd. Onder vroegere veroordeling wordt mede verstaan een
      vroegere veroordeling door een strafrechter in een andere lidstaat van de Europese Unie wegens soortgelijke feiten.

      4 De ambtenaar van het openbaar ministerie kan, alvorens tot vervolging van het strafbaar feit over te gaan, degene
      die de verboden handelsnaam voert, de wijziging mededelen, die de ambtenaar nodig voorkomt om de onrechtmatigheid
      van de handelsnaam op te heffen; daarbij wordt een bekwame termijn gesteld om die wijziging aan te brengen. Wordt
      die wijziging binnen de gestelde termijn aangebracht, dan is het recht tot strafvordering vervallen.
    url: https://wetten.overheid.nl/BWBR0001906/2017-09-01#Artikel7
  - number: '10'
    text: Deze wet kan worden aangehaald onder de titel "Handelsnaamwet".
    url: https://wetten.overheid.nl/BWBR0001906/2017-09-01#Artikel10
  - number: '11'
    text: |-
      1 Deze wet treedt in werking op een door Ons te bepalen tijdstip.

      2 Indien bij het in werking treden dezer wet een handelsnaam wordt gevoerd in strijd met deze wet kan te dier zake
      gedurende vier maanden na dat tijdstip geen rechtsmiddel worden aangewend.

      3 Wanneer de uitdrukking "niet in strijd met deze wet" aan het slot van [artikelen 3][ref1] en [4][ref2] betreft
      het voeren van een handelsnaam vóór het in werking treden dezer wet, betekent zij: niet in strijd met deze wet,
      indien zij tijdens het voeren van de handelsnaam van kracht geweest ware.


      [ref1]: https://wetten.overheid.nl/BWBR0001906#Artikel3
