        artikel: 5a
  - number: 6c
    text: |-
      1 Indien een handelsnaam wordt gevoerd in strijd met de [artikelen 5][ref1] of [5a][ref2], kan de rechter in
      passende gevallen de schadevergoeding vaststellen als een forfaitair bedrag.

      2 De rechter kan op vordering van degene die de handelsnaam voert gelasten dat op kosten van degene die heeft
      gehandeld in strijd met de [artikelen 3 tot en met 5b][ref3] passende maatregelen worden getroffen tot verspreiding
      van informatie over de uitspraak.


