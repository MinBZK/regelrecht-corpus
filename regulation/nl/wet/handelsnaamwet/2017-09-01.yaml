preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of hooren lezen, salut! doen te weten:

    Alzoo Wij in overweging genomen hebben, dat het noodzakelijk is wettelijke bepalingen vast te stellen omtrent den
    handelsnaam;

    Zoo is het, dat Wij, den Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0001906/2017-09-01#ArtikelAanhef
articles:
  - number: '1'
    text: Onder handelsnaam verstaat deze wet de naam waaronder een onderneming wordt gedreven.
    url: https://wetten.overheid.nl/BWBR0001906/2017-09-01#Artikel1
  - number: '2'
    text: |-
      De handelsnaam gaat over bij erfopvolging en is vatbaar voor overdracht, doch een en ander slechts in verbinding
      met de onderneming, die onder die naam wordt gedreven.
    url: https://wetten.overheid.nl/BWBR0001906/2017-09-01#Artikel2
  - number: '3'
    text: |-
      1 Het is de eigenaar ener onderneming verboden een handelsnaam te voeren, die in strijd met de waarheid aanduidt,
      dat de onderneming, geheel of gedeeltelijk aan een ander zou toebehoren.

      2 Het eerste lid is mede van toepassing, indien de in de handelsnaam voorkomende aanduiding slechts in zo geringe
      mate van de naam van die ander afwijkt, dat dientengevolge bij het publiek verwarring van deze met de eigenaar der
      onderneming, te duchten is.

      3 Het eerste lid is niet van toepassing, indien de handelsnaam en de onderneming afkomstig zijn van iemand, die die
      naam heeft gevoerd niet in strijd met deze wet.
    url: https://wetten.overheid.nl/BWBR0001906/2017-09-01#Artikel3
  - number: '4'
    text: |-
      1 Het is verboden een handelsnaam te voeren, die in strijd met de waarheid aanduidt, dat de onderneming zou
      toebehoren aan een of meer personen, handelende als een vennootschap onder een firma, als een vennootschap
      en commandite of een rederij, of wel aan een naamloze vennootschap, een besloten vennootschap met beperkte
      aansprakelijkheid, een onderlinge waarborgmaatschappij, een coöperatie, een vereniging of aan een stichting.

      2 In de handelsnaam duidt de vermelding van meer dan één persoon, ook al worden hun namen niet genoemd, aan, dat
      de onderneming toebehoort aan personen, handelende als een vennootschap onder een firma; de woorden "en compagnie",
      dat de onderneming toebehoort aan personen, handelende als een vennootschap onder een firma of aan een of meer
      personen, handelende als een vennootschap *en commandite*; het woord "maatschappij", dat de onderneming toebehoort
      aan een naamloze vennootschap, aan een besloten vennootschap met beperkte aansprakelijkheid of aan een vereniging,
      en het woord "fonds" aan een stichting; alles voor zover niet uit de handelsnaam in zijn geheel het tegendeel
      blijkt.

      3 Het eerste lid is niet van toepassing, indien de handelsnaam wordt gevoerd door één persoon zonder vennoten,
      en die naam en de onderneming afkomstig zijn van een vennootschap onder een firma of van een vennootschap *en
      commandite,* die die handelsnaam heeft gevoerd niet in strijd met deze wet.
    url: https://wetten.overheid.nl/BWBR0001906/2017-09-01#Artikel4
  - number: '5'
    text: |-
      Het is verboden een handelsnaam te voeren, die, vóórdat de onderneming onder die naam werd gedreven, reeds door
      een ander rechtmatig gevoerd werd, of die van diens handelsnaam slechts in geringe mate afwijkt, een en ander voor
      zover dientengevolge, in verband met de aard der beide ondernemingen en de plaats, waar zij gevestigd zijn, bij het
      publiek verwarring tussen die ondernemingen te duchten is.
    url: https://wetten.overheid.nl/BWBR0001906/2017-09-01#Artikel5
  - number: 5a
    text: |-
      Het is verboden een handelsnaam te voeren, die het merk bevat, waarop een ander ter onderscheiding van zijn
      fabrieks- of handelswaren recht heeft, dan wel een aanduiding, die van zodanig merk slechts in geringe mate
      afwijkt, voor zover dientengevolge bij het publiek verwarring omtrent de herkomst van de waren te duchten is.
    url: https://wetten.overheid.nl/BWBR0001906/2017-09-01#Artikel5a
  - number: 5b
    text: |-
      Het is verboden een handelsnaam te voeren, welke een onjuiste indruk geeft van de onder die naam gedreven
      onderneming, voor zover dientengevolge misleiding van het publiek te duchten is.
    url: https://wetten.overheid.nl/BWBR0001906/2017-09-01#Artikel5b
  - number: '6'
    text: |-
      1 Indien een handelsnaam wordt gevoerd in strijd met deze wet, kan ieder belanghebbende, onverminderd zijn
      vordering krachtens [titel 3 van Boek 6 van het Burgerlijk Wetboek][ref1], de kantonrechter verzoeken degene die
      de verboden handelsnaam voert, te veroordelen, daarin zodanige door de rechter te bepalen wijziging aan te brengen,
      dat de gestelde onrechtmatigheid wordt opgeheven.

      2 Het verzoekschrift wordt gericht tot de rechtbank van het arrondissement waarin de onderneming is gevestigd, die
      onder de verboden handelsnaam wordt gedreven. Is de onderneming buiten het rijk in Europa gevestigd, doch heeft zij
      in dat rijk een filiaal of bijkantoor, of wordt zij aldaar vertegenwoordigd door een gevolmachtigde handelsagent,
      dan is de rechtbank van het arrondissement waarin dat filiaal of bijkantoor of die handelsagent is gevestigd,
      bevoegd. Indien volgens de voorgaande bepalingen geen rechtbank bevoegd is, is de rechtbank van het arrondissement
      waarin de woonplaats des verzoekers is gelegen bevoegd. Is de onderneming in meer dan één arrondissement gevestigd,
      dan is bevoegd de rechtbank van elk van deze arrondissementen, ter keuze van de verzoeker. Hetzelfde geldt
      ingeval de onderneming buiten het rijk in Europa is gevestigd, doch in meer dan één arrondissement een filiaal of
      bijkantoor heeft of door een gevolmachtigde handelsagent vertegenwoordigd wordt. Het verzoekschrift wordt behandeld
      door de kantonrechter.

      3 Het verzoekschrift wordt aan de wederpartij betekend. De kantonrechter beschikt niet op het verzoekschrift dan na
      verhoor of behoorlijke oproeping van partijen.

      4 De griffier zendt een afschrift van de beslissing van de kantonrechter aan partijen. Binnen een maand na de dag
      van de verzending van dit afschrift kan door hem, die daarbij geheel of gedeeltelijk in het ongelijk is gesteld,
      hoger beroep worden ingesteld bij het gerechtshof, dat in raadkamer beslist. Het derde lid vindt overeenkomstige
      toepassing.

      5 De griffier zendt een afschrift van de beslissing van de het gerechtshof aan partijen. Binnen één maand na de dag
      van de verzending van dit afschrift kan door hem, die daarbij geheel of gedeeltelijk in het ongelijk is gesteld,
      beroep in cassatie worden ingesteld. Het daartoe strekkend verzoekschrift wordt aan de wederpartij betekend.

      6 De rechter kan de voorlopige tenuitvoerlegging van zijn beschikking bevelen.


      [ref1]: https://wetten.overheid.nl/BWBR0005289
    url: https://wetten.overheid.nl/BWBR0001906/2017-09-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005289
  - number: 6a
    text: |-
      1 Het verzoek bedoeld in het eerste lid van het vorige artikel kan ook gedaan worden door de Kamer van Koophandel.

      2 De Kamer van Koophandel, binnen welker ressort de ingevolge [artikel 6, tweede lid][ref1], bevoegde rechter
      zetelt, is tot het doen van het verzoek bevoegd.

      3 Het verzoekschrift wordt door de griffier toegezonden aan de eigenaar van de onderneming, van welke wijziging van
      de handelsnaam wordt verzocht, en zo nodig aan andere belanghebbenden. De kantonrechter beslist niet dan na verhoor
      of behoorlijke oproeping van degenen aan wie het verzoekschrift is toegezonden.

      4 Het vierde, vijfde en zesde lid van het vorige artikel vinden overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001906#Artikel6
    url: https://wetten.overheid.nl/BWBR0001906/2017-09-01#Artikel6a
