$id: handelsregisterwet_2009_bes
regulatory_layer: WET
publication_date: '2022-01-20'
valid_from: '2022-03-02'
bwb_id: BWBR0028503
url: https://wetten.overheid.nl/BWBR0028503/2022-03-02
articles:
  - number: '1'
    text: 'Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0028503/2022-03-02#Artikel1
  - number: 1.a
    text: |-
      *Kamer:* kamer van koophandel en nijverheid als bedoeld in de
      [Wet op de Kamers van Koophandel en Nijverheid BES][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028238
    url: https://wetten.overheid.nl/BWBR0028503/2022-03-02#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0028238
  - number: 1.b
    text: '*Secretaris:* de secretaris van de betreffende kamer van koophandel en nijverheid;'
    url: https://wetten.overheid.nl/BWBR0028503/2022-03-02#Artikel1
  - number: 1.c
    text: |-
      *eigen vermogen:* het op het ogenblik van aangifte volgens de balans van het laatste boekjaar aanwezige, eventueel
      volgens de balans van het lopende boekjaar werkelijk aanwezige, eigen vermogen van de onderneming, rechtspersoon
      of nevenvestiging;
    url: https://wetten.overheid.nl/BWBR0028503/2022-03-02#Artikel1
  - number: 1.d
    text: '*hoofdvestiging:* het door een onderneming als zodanig aangemerkte onderdeel van de onderneming;'
    url: https://wetten.overheid.nl/BWBR0028503/2022-03-02#Artikel1
  - number: 1.e
    text: |-
      *nevenvestiging:* een ondernemingsonderdeel, niet zijnde de hoofdvestiging, dat geheel of ten dele elders is
      ondergebracht in een gebouw of complex van gebouwen, waar duurzaam activiteiten van de onderneming plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0028503/2022-03-02#Artikel1
  - number: 1.f
    text: |-
      *hoofdnederzetting:* de in het openbaar lichaam gelegen nevenvestiging van een buiten het openbaar lichaam
      gevestigde onderneming of, indien er meer nevenvestigingen zijn, de door de onderneming als hoofdnederzetting
      aangemerkte nevenvestiging;
    url: https://wetten.overheid.nl/BWBR0028503/2022-03-02#Artikel1
  - number: 1.g
    text: '*openbaar lichaam:* het openbaar lichaam Bonaire, Sint Eustatius of Saba.'
    url: https://wetten.overheid.nl/BWBR0028503/2022-03-02#Artikel1
  - number: '2.1'
    text: |-
      Er is een handelsregister, waarin ondernemingen en rechtspersonen worden ingeschreven overeenkomstig het bepaalde
      in deze wet.
    url: https://wetten.overheid.nl/BWBR0028503/2022-03-02#Artikel2
  - number: '2.2'
    text: |-
      Het handelsregister wordt gehouden door de Kamers. De Secretaris is belast met het beheer van het handelsregister
      en de in verband daarmee ontvangen gelden.
    url: https://wetten.overheid.nl/BWBR0028503/2022-03-02#Artikel2
  - number: '3.1'
    text: |-
      In het handelsregister worden de ondernemingen ingeschreven die in het openbaar lichaam zijn gevestigd, of in het
      openbaar lichaam een nevenvestiging hebben.
    url: https://wetten.overheid.nl/BWBR0028503/2022-03-02#Artikel3
  - number: '3.2'
    text: |-
      Behoort de onderneming toe aan een natuurlijke persoon, of is een vennootschap onder firma of een commanditaire
      vennootschap aangegaan, dan worden tevens de gegevens daarvan ingeschreven.
    url: https://wetten.overheid.nl/BWBR0028503/2022-03-02#Artikel3
  - number: '3.3'
    text: |-
      Aan de in [artikel 4, eerste lid][ref1], genoemde rechtspersonen, met uitzondering van stichtingen, stichtingen
      particulier fonds en verenigingen, wordt steeds geacht een onderneming toe te behoren.


      [ref1]: https://wetten.overheid.nl/BWBR0028503#Artikel4
    url: https://wetten.overheid.nl/BWBR0028503/2022-03-02#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0028503
        artikel: '4'
  - number: '3.4'
    text: |-
      Het bepaalde in het derde lid is van overeenkomstige toepassing op in het openbaar lichaam gevestigde buitenlandse
      rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0028503/2022-03-02#Artikel3
  - number: '3.5'
    text: |-
      Indien aan een stichting of stichting particulier fonds of een vereniging een onderneming tevens als inschrijving
      van de stichting, de stichting particulier fonds of de vereniging toebehoort die als zodanig overeenkomstig dit
      artikel moet worden ingeschreven, geldt de inschrijving van de onderneming.
    url: https://wetten.overheid.nl/BWBR0028503/2022-03-02#Artikel3
  - number: '3.6'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen activiteiten waarmee niet wordt beoogd vermogensrechtelijk
      voordeel te behalen, voor de toepassing van het eerste lid met een onderneming worden gelijkgesteld.
    url: https://wetten.overheid.nl/BWBR0028503/2022-03-02#Artikel3
  - number: '4.1'
    text: |-
      In het handelsregister worden tevens ingeschreven naamloze vennootschappen, besloten vennootschappen, coöperaties,
      onderlinge waarborgmaatschappijen, stichtingen, stichtingen particulier fonds en verenigingen met volledige
      rechtsbevoegdheid.
    url: https://wetten.overheid.nl/BWBR0028503/2022-03-02#Artikel4
  - number: '4.2'
    text: Verenigingen zonder volledige rechtsbevoegdheid kunnen in het handelsregister worden ingeschreven.
    url: https://wetten.overheid.nl/BWBR0028503/2022-03-02#Artikel4
  - number: '5.1'
    text: |-
      Tot het doen van opgave ter inschrijving in het handelsregister is verplicht degene aan wie een onderneming
      toebehoort of, indien het de inschrijving betreft van een aan een rechtspersoon toebehorende onderneming, ieder der
      bestuurders van de rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0028503/2022-03-02#Artikel5
  - number: '5.2'
    text: |-
      Tot het doen van opgave ter inschrijving in het handelsregister van een rechtspersoon en deponering van een
      authentiek afschrift van de akte en statuten is naast de bestuurders van de rechtspersoon tevens verplicht de
      notaris ten overstaan van wie de akte van oprichting van de rechtspersoon is verleden.
    url: https://wetten.overheid.nl/BWBR0028503/2022-03-02#Artikel5
  - number: '5.3'
    text: |-
      Indien geen van de in het eerste of tweede lid bedoelde personen in het gebied van de bevoegde Kamer is gevestigd,
      is tot het doen van de opgave tevens verplicht degene die in dat gebied belast is met de dagelijkse leiding.
    url: https://wetten.overheid.nl/BWBR0028503/2022-03-02#Artikel5
  - number: '5.4'
    text: |-
      Indien een onderneming buiten het openbaar lichaam is gevestigd, is tot het doen van de opgave tevens verplicht
      degene die belast is met de dagelijkse leiding van de hoofdnederzetting.
    url: https://wetten.overheid.nl/BWBR0028503/2022-03-02#Artikel5
  - number: '5.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen andere personen worden aangewezen die verplicht of bevoegd
      zijn tot het doen van daarbij aangewezen opgaven.
    url: https://wetten.overheid.nl/BWBR0028503/2022-03-02#Artikel5
  - number: '6.1'
    text: |-
      Tot inschrijving van een in het openbaar lichaam gevestigde onderneming of nevenvestiging is bevoegd de Kamer van
      het gebied waarbinnen de onderneming haar hoofdvestiging respectievelijk hoofdnederzetting heeft.
    url: https://wetten.overheid.nl/BWBR0028503/2022-03-02#Artikel6
  - number: '6.2'
    text: |-
      Tot inschrijving van een in het openbaar lichaam gevestigde rechtspersoon is bevoegd de Kamer van het gebied
      waarbinnen de rechtspersoon volgens zijn statuten zijn zetel heeft.
    url: https://wetten.overheid.nl/BWBR0028503/2022-03-02#Artikel6
  - number: '6.3'
    text: |-
      Tot inschrijving van een buiten het openbaar lichaam gevestigde onderneming is bevoegd de Kamer van het gebied
      waarbinnen de onderneming haar hoofdnederzetting heeft.
    url: https://wetten.overheid.nl/BWBR0028503/2022-03-02#Artikel6
  - number: '7.1'
    text: |-
      De tot opgaaf verplichte personen doen, met inachtneming van het bij of krachtens algemene maatregel van
      bestuur bepaalde, de opgaven die de Kamer nodig heeft om ervoor te zorgen dat de bij of krachtens die algemene
      maatregel van bestuur en andere wettelijke bepalingen aangewezen gegevens te allen tijde juist en volledig in het
      handelsregister ingeschreven zijn.
    url: https://wetten.overheid.nl/BWBR0028503/2022-03-02#Artikel7
  - number: '7.2'
    text: Het eerste lid is van overeenkomstige toepassing op het deponeren van bescheiden.
    url: https://wetten.overheid.nl/BWBR0028503/2022-03-02#Artikel7
  - number: '8.1'
    text: |-
      De opgave voor de eerste inschrijving van een onderneming wordt gedaan binnen één week na aanvang van de
      uitoefening van de ondernemingsactiviteiten, met vermelding van de dag van ingang daarvan.
    url: https://wetten.overheid.nl/BWBR0028503/2022-03-02#Artikel8
  - number: '8.2'
    text: |-
      De andere voorgeschreven opgaven worden gedaan uiterlijk één week na het plaatsvinden van het feit ten gevolge
      waarvan de verplichting tot de opgave ontstaat, voor zover bij of krachtens algemene maatregel van bestuur niet
      anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0028503/2022-03-02#Artikel8
  - number: '8.3'
    text: |-
      De verplichting tot het doen van een opgave eindigt zodra die opgave is gedaan door iemand anders die
      daartoe verplicht of bevoegd was of, voor zover het een wijziging betreft als bedoeld in [artikel 9][ref1] of
      [artikel 10][ref2], zodra de Kamer de desbetreffende wijziging heeft ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0028503#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0028503#Artikel10
    url: https://wetten.overheid.nl/BWBR0028503/2022-03-02#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0028503
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0028503
        artikel: '10'
  - number: '9.1'
    text: |-
      De Kamer is ambtshalve bevoegd tot het inschrijven van een wijziging van een gegeven betreffende een onderneming of
      rechtspersoon, indien die wijziging reeds elders in het door haarzelf gehouden register is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0028503/2022-03-02#Artikel9
  - number: '9.2'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat de Kamer ambtshalve bevoegd is tot het inschrijven van
      wijzigingen van daarbij aangewezen gegevens waarvan de Kamer op andere wijze kennis heeft gekregen.
    url: https://wetten.overheid.nl/BWBR0028503/2022-03-02#Artikel9
  - number: '9.3'
    text: |-
      Bij een inschrijving als bedoeld in het eerste en tweede lid vermeldt de Kamer zo mogelijk de dag waarop de
      wijziging is ingegaan.
    url: https://wetten.overheid.nl/BWBR0028503/2022-03-02#Artikel9
  - number: '9.4'
    text: |-
      De Kamer doet van een inschrijving als bedoeld in het eerste en tweede lid onverwijld schriftelijk mededeling aan
      degene die tot het doen van opgave ter inschrijving in het handelsregister verplicht is.
    url: https://wetten.overheid.nl/BWBR0028503/2022-03-02#Artikel9
  - number: '10.1'
    text: |-
      Indien uit het bevolkingsregister blijkt dat degene aan wie een onderneming toebehoort of een andere in verband met
      de onderneming of rechtspersoon in het register ingeschreven persoon is overleden, is de Kamer ambtshalve bevoegd
      dit feit in het register in te schrijven.
    url: https://wetten.overheid.nl/BWBR0028503/2022-03-02#Artikel10
  - number: '10.2'
    text: |-
      [Artikel 9, tweede en derde lid][ref1], is op de inschrijving, bedoeld in het eerste lid, van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028503#Artikel9
    url: https://wetten.overheid.nl/BWBR0028503/2022-03-02#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0028503
        artikel: '9'
  - number: '11.1'
    text: |-
      Het handelsregister en de bescheiden die daarbij krachtens wettelijk voorschrift zijn gedeponeerd, kunnen door een
      ieder per inschrijving of gedeponeerd bescheiden worden ingezien tegen betaling van een vergoeding.
    url: https://wetten.overheid.nl/BWBR0028503/2022-03-02#Artikel11
  - number: '11.2'
    text: |-
      De Kamer verstrekt op verzoek tegen betaling van een vergoeding afschrift van of uittreksel uit hetgeen in het
      handelsregister is ingeschreven of krachtens wettelijk voorschrift aldaar is gedeponeerd.
    url: https://wetten.overheid.nl/BWBR0028503/2022-03-02#Artikel11
  - number: '12.1'
    text: |-
      Op een feit dat door inschrijving of deponering moet worden bekendgemaakt, kan tegenover derden die daarvan
      onkundig waren geen beroep worden gedaan zolang de inschrijving of deponering niet hebben plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0028503/2022-03-02#Artikel12
  - number: '12.2'
    text: |-
      Degene aan wie de onderneming toebehoort, de ingeschreven rechtspersoon of degene die enig feit heeft opgegeven of
      verplicht is enig feit op te geven, kan aan derden die daarvan onkundig waren niet de onjuistheid of onvolledigheid
      van de inschrijving dan wel de deponering tegenwerpen.
    url: https://wetten.overheid.nl/BWBR0028503/2022-03-02#Artikel12
  - number: '13'
    text: |-
      Ter bescherming van de persoonlijke levenssfeer van de personen die in het handelsregister staan ingeschreven
      kunnen bij of krachtens algemene maatregel van bestuur voor daarbij aangewezen gegevens of bescheiden beperkingen
      worden vastgesteld ten aanzien van het bepaalde in [artikel 11][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028503#Artikel11
    url: https://wetten.overheid.nl/BWBR0028503/2022-03-02#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0028503
        artikel: '11'
  - number: '14.1'
    text: |-
      Bij de eerste inschrijving van een onderneming, rechtspersoon of nevenvestiging en vervolgens jaarlijks na het jaar
      van inschrijving is voor elke ingeschreven onderneming, rechtspersoon of nevenvestiging een bijdrage verschuldigd,
      die niet voor elke Kamer hetzelfde hoeft te zijn.
    url: https://wetten.overheid.nl/BWBR0028503/2022-03-02#Artikel14
  - number: '14.2'
    text: |-
      De bijdrage, bedoeld in het eerste lid, wordt bij of krachtens algemene maatregel van bestuur vastgesteld. Hierbij
      kunnen regels worden gesteld over de verhouding naar rechtsvorm en grootte, niet zijnde het maatschappelijk
      kapitaal, in relatie tot de hoogte van de bijdrage tussen de verschillende ondernemingen en rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0028503/2022-03-02#Artikel14
  - number: '14.3'
    text: |-
      De bedragen voor de inschrijving zijn verschuldigd door degene aan wie de onderneming of nevenvestiging behoort.
      Behoort de onderneming of nevenvestiging aan meer dan een persoon, dan zijn deze ieder voor het geheel voor de
      voldoening aansprakelijk. Behoort de onderneming aan een rechtspersoon, dan zijn de bedragen voor de inschrijving
      door de rechtspersoon verschuldigd. De bedragen voor de inschrijving van een stichting, een stichting particulier
      fonds en een vereniging aan wie niet een onderneming toebehoort zijn verschuldigd door de stichting, de
      stichting particulier fonds en de vereniging. Bij ontbinding of omzetting in een buitenlandse rechtspersoon zijn
      respectievelijk de met vereffening belaste personen en de bestuurders hoofdelijk daarvoor aansprakelijk.
    url: https://wetten.overheid.nl/BWBR0028503/2022-03-02#Artikel14
  - number: '14.4'
    text: |-
      De Kamer kan degene die tot het doen van opgave ter inschrijving in het handelsregister verplicht is, ten hoogste
      eenmaal per jaar schriftelijk verzoeken aangifte te doen ten behoeve van de rangschikking van de onderneming. Een
      dergelijk verzoek wordt niet gedaan voordat een jaar is verstreken sinds de aangifte bij de inschrijving of, bij
      gebreke daarvan, sinds de inschrijving heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0028503/2022-03-02#Artikel14
  - number: '14.5'
    text: |-
      De Kamer kan degene die een aangifte ten behoeve van de rangschikking heeft gedaan, schriftelijk verzoeken een
      nadere toelichting op die aangifte te verstrekken.
    url: https://wetten.overheid.nl/BWBR0028503/2022-03-02#Artikel14
  - number: '14.6'
    text: |-
      De Kamer geeft, in haar gebied, kennis aan belanghebbende van de bedragen verschuldigd ingevolge de voorgaande
      bepalingen, welke bedragen dan binnen een maand na dagtekening van de mededeling moeten zijn voldaan.
    url: https://wetten.overheid.nl/BWBR0028503/2022-03-02#Artikel14
  - number: '16'
    text: |-
      Voor het inzien van het handelsregister en de bescheiden die daarbij krachtens wettelijk voorschrift zijn
      gedeponeerd, zijn aan de Kamer de bij ministeriële regeling vast te stellen bedragen verschuldigd.
    url: https://wetten.overheid.nl/BWBR0028503/2022-03-02#Artikel16
  - number: '17'
    text: |-
      Voor het verstrekken van een afschrift van of een uittreksel uit hetgeen in het handelsregister is ingeschreven
      of krachtens wettelijk voorschrift daarbij is gedeponeerd, zijn aan de Kamer de bij ministeriële regeling vast te
      stellen bedragen verschuldigd.
    url: https://wetten.overheid.nl/BWBR0028503/2022-03-02#Artikel17
  - number: '18.1'
    text: |-
      Indien een Kamer of een persoon die belang heeft bij de inschrijving van mening is dat de inschrijving van een
      onderneming, rechtspersoon of nevenvestiging onjuist, onvolledig of in strijd met de openbare orde of de goede
      zeden is of dat een onderneming, rechtspersoon of een nevenvestiging ten onrechte niet is ingeschreven, kan de
      belanghebbende zich bij verzoekschrift wenden tot het gerecht in eerste aanleg van Bonaire, Sint Eustatius en Saba
      dat zittingsplaats heeft in het openbaar lichaam waar de Kamer is gevestigd, bij welke de inschrijving is geschied
      of zou moeten geschieden, met het verzoek de doorhaling, aanvulling of wijziging van het ingeschrevene of de
      inschrijving van de onderneming, rechtspersoon of nevenvestiging te gelasten.
    url: https://wetten.overheid.nl/BWBR0028503/2022-03-02#Artikel18
  - number: '18.2'
    text: |-
      Een ieder, met betrekking tot wie hetgeen in het handelsregister is ingeschreven, onvolledig of onjuist is, of in
      strijd met de openbare orde of de goede zeden, kan, indien degene die het handelsregister houdt weigert of nalaat
      het verzoek tot aanvulling of wijziging te doen, zich op dezelfde wijze met dit verzoek tot het gerecht in eerste
      aanleg wenden.
    url: https://wetten.overheid.nl/BWBR0028503/2022-03-02#Artikel18
  - number: '18.3'
    text: |-
      Indien bij rechterlijke uitspraak hetgeen in het handelsregister is ingeschreven geheel of gedeeltelijk
      onrechtmatig is verklaard, doet de Kamer op verzoek van een belanghebbende daarvan aantekening in het
      handelsregister.
    url: https://wetten.overheid.nl/BWBR0028503/2022-03-02#Artikel18
  - number: '19'
    text: |-
      Degene die verplicht is tot het doen van opgaven voor de inschrijving van een onderneming, rechtspersoon of
      nevenvestiging in het handelsregister, met uitzondering van de notaris ten overstaan van wie de akte van oprichting
      van de rechtspersoon is verleden, zorgt ervoor dat op alle van de onderneming, rechtspersoon of nevenvestiging
      uitgaande brieven, orders, facturen en offertes is vermeld onder welk nummer de onderneming, rechtspersoon of
      nevenvestiging in het handelsregister is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0028503/2022-03-02#Artikel19
  - number: '20'
    text: |-
      Alles wat betreft de inrichting van en het toezicht op het handelsregister, de opgaven voor de inschrijving, de
      inschrijving zelf, de doorhaling, de aanvulling en de wijziging van het ingeschrevene, het ter inzage leggen en
      het geven van afschriften van en uittreksels uit hetgeen ingeschreven is en hetgeen verder nog ter uitvoering van
      deze wet nodig is, wordt, voorzover daarin niet bij deze wet is voorzien, bij of krachtens algemene maatregel van
      bestuur, geregeld.
    url: https://wetten.overheid.nl/BWBR0028503/2022-03-02#Artikel20
  - number: '21.1'
    text: |-
      Hij die opzettelijk een onjuiste of onvolledige opgave doet, bestemd voor inschrijving in het handelsregister,
      wordt gestraft met geldboete van ten hoogste USD 28.000.
    url: https://wetten.overheid.nl/BWBR0028503/2022-03-02#Artikel21
  - number: '21.2'
    text: |-
      Hij die wettelijk gehouden is een opgave te doen voor inschrijving in het handelsregister, wordt, indien het aan
      zijn schuld te wijten is dat die opgaaf gedaan door hemzelf of door een ander onjuist of onvolledig is, gestraft
      met geldboete van ten hoogste USD 11.200.
    url: https://wetten.overheid.nl/BWBR0028503/2022-03-02#Artikel21
  - number: '21.3'
    text: |-
      Hij die niet voldoet aan zijn wettelijke verplichtingen tot het doen van opgave voor inschrijving in het
      handelsregister, wordt gestraft met geldboete van ten hoogste USD 28.000.
    url: https://wetten.overheid.nl/BWBR0028503/2022-03-02#Artikel21
  - number: '21.4'
    text: |-
      Hij die niet voldoet aan zijn wettelijke verplichting tot het op alle van de onderneming, rechtspersoon of
      nevenvestiging uitgaande brieven, orders, facturen en offertes vermelden van het nummer onder welk de onderneming,
      rechtspersoon of nevenvestiging in het handelsregister is ingeschreven, wordt gestraft met geldboete van ten
      hoogste USD 28.000.
    url: https://wetten.overheid.nl/BWBR0028503/2022-03-02#Artikel21
  - number: '21.5'
    text: |-
      De feiten, strafbaar gesteld in het eerste, derde en vierde lid, zijn misdrijven. Het feit strafbaar gesteld in het
      tweede lid, is een overtreding.
    url: https://wetten.overheid.nl/BWBR0028503/2022-03-02#Artikel21
