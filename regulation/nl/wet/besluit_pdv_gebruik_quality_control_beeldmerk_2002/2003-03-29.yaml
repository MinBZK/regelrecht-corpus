preamble:
  text: gehoord het College van deskundigen, op 19 juni 2002 het volgende besluit vastgesteld.
  url: https://wetten.overheid.nl/BWBR0013790/2003-03-29#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Dit besluit verstaat onder:









                  productschap


                  :


                  Productschap Diervoeder;




                  reglement


                  :


                  het als bijlage bij dit besluit opgenomen reglement op het gebruik van het QC-beeldmerk;




                  verificatie-instelling


                  :


                  een onafhankelijke instelling die voldoet aan de voorwaarden gesteld door het productschap en die
      door het productschap is geaccepteerd voor het verrichten van verificatie-audits bij buitenlandse leveranciers
      van voedermiddelen op het voldoen aan de Standard Quality Control of Feed Materials for Animal Feed van het
      productschap;




                  goedgekeurde leverancier


                  :


                  een buitenlandse leverancier van voedermiddelen waarvan een verificatie- instelling heeft vastgesteld
      dat het toegepaste kwaliteitssysteem voldoet aan de Standard Quality Control of Feed Materials for Animal Feed van
      het productschap;




                  QC-beeldmerk


                  :


                  het collectieve beeldmerk Quality Control als opgenomen in de bijlage bij dit besluit.
    url: https://wetten.overheid.nl/BWBR0013790/2003-03-29#Artikel1
  - number: '2'
    text: |-
      1 Iedere goedgekeurde leverancier heeft het recht om het QC-beeldmerk te gebruiken overeenkomstig het in het
      reglement opgenomen model.

      2 Op het gebruik van het QC-beeldmerk zijn de nadere voorschriften van het reglement van toepassing.
    url: https://wetten.overheid.nl/BWBR0013790/2003-03-29#Artikel2
  - number: '3'
    text: Dit besluit treedt in werking daags na publicatie in het Verordeningenblad Bedrijfsorganisatie.
    url: https://wetten.overheid.nl/BWBR0013790/2003-03-29#Artikel3
  - number: '4'
    text: 'Dit besluit wordt aangehaald als: Besluit PDV gebruik Quality Control beeldmerk 2002.'
    url: https://wetten.overheid.nl/BWBR0013790/2003-03-29#Artikel4
  - number: '1'
    text: |-
      Voor de toepassing van dit reglement wordt verstaan onder:









                    1. productschap


                    :


                    Productschap Diervoeder;




                    2. secretaris


                    :


                    secretaris van het productschap;




                    3. verificatie-instelling


                    :


                    een onafhankelijke instelling die voldoet aan de voorwaarden gesteld door het productschap en die
      door het productschap is geaccepteerd voor het verrichten van verificatie-audits bij buitenlandse leveranciers
      van voedermiddelen op het voldoen aan de Standard Quality Control of Feed Materials for Animal Feed van het
      productschap;




                    4. goedgekeurde leverancier


                    :


                    een buitenlandse leverancier van voedermiddelen waarvan een verificatie-instelling heeft vastgesteld
      dat het toegepaste kwaliteitssysteem voldoet aan de Standard Quality Control of Feed Materials for Animal Feed van
      het productschap;




                    5. QC-beeldmerk


                    :


                    het collectieve beeldmerk Quality Control als opgenomen in dit reglement.
    url: https://wetten.overheid.nl/BWBR0013790/2003-03-29#Artikel1
  - number: '2'
    text: |-
      Iedere goedgekeurde leverancier is gerechtigd tot het gebruik van het QC-beeldmerk:

      a. op of bij de bedrijfseenheid waarvoor de goedkeuring is verleend;

      b. op of bij de producten afkomstig van de onder a. bedoelde bedrijfseenheid;

      c. op bescheiden afgegeven door de onder a. bedoelde bedrijfseenheid;

      indien en voor zover het producten betreft die onder de QC-standaard zijn geproduceerd.
    url: https://wetten.overheid.nl/BWBR0013790/2003-03-29#Artikel2
  - number: '3'
    text: |-
      1 Iedere gebruiker van het QC-beeldmerk is verplicht iedere inbreuk die hem ter kennis komt, mede te delen aan de
      verificatie-instelling of het productschap.

      2 Iedere gebruiker van het QC-beeldmerk dan wel de verificatie-instelling is desgevraagd bevoegd tezamen met het
      productschap een vordering in te stellen tegen ieder, die zonder daartoe gerechtigd te zijn, gebruik maakt van het
      QC-beeldmerk of van een daarmee overeenstemmend teken, dan wel in een zodanig geding tussen het productschap dan
      wel de verificatie-instelling en de inbreukmaker zich te voegen of tussen te komen.

      3 Indien het productschap alleen optreedt kan zij - doch is zij niet verplicht - het bijzondere belang van de
      gebruikers laten gelden en in haar eis tot schadevergoeding opnemen de bijzondere schade die een of meer van deze
      gebruikers heeft c.q. hebben geleden.
    url: https://wetten.overheid.nl/BWBR0013790/2003-03-29#Artikel3
  - number: '4'
    text: |-
      Indien wordt geconstateerd dat een gebruiker van het QC-beeldmerk niet voldoet aan dit reglement, is de secretaris,
      namens het bestuur, ten aanzien van hem bevoegd één of meer van de volgende maatregelen te nemen:

      a. waarschuwing

      b. indien van toepassing de goedgekeurde leverancier van de openbare lijst afhalen en de verificatie-instelling
      verzoeken de verklaring van goedkeuring laten intrekken en daarmee ontzegging van de bevoegdheid om, te rekenen
      vanaf een in de beslissing te vermelden tijdstip, het QC-beeldmerk te gebruiken.
    url: https://wetten.overheid.nl/BWBR0013790/2003-03-29#Artikel4
  - number: '5'
    text: |-
      1 De goedgekeurde leverancier is niet meer aan dit reglement gebonden met betrekking tot het QC-beeldmerk, zodra
      het desbetreffende merk is vervallen, nietig verklaard, of doorgehaald.

      2 In afwijking van het bepaalde in het vorige lid, blijft de goedgekeurde leverancier onderworpen aan de sancties,
      als bedoeld in artikel 4, ter zake van overtredingen, die hebben plaatsgevonden ten tijde dat het QC-beeldmerk nog
      ingeschreven was.
    url: https://wetten.overheid.nl/BWBR0013790/2003-03-29#Artikel5
