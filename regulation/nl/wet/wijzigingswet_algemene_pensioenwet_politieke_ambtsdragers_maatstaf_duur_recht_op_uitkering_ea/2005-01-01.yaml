        artikel: '103'
  - number: III
    text: |-
      1 Voor een recht op nabestaanden- of wezenpensioen, ontstaan wegens overlijden tussen 30 juni 1996 en 1 juli 1999
      van een politieke ambtsdrager, gewezen politieke ambtsdrager of gepensioneerde politieke ambtsdrager als bedoeld in
      [artikel 2, tweede lid, onder ][ref1], van een nabestaande of een wees die geen recht heeft op uitkering ingevolge
      de [Algemene nabestaandenwet][ref2] maar wel recht op pensioen of tijdelijke uitkering ingevolge de Algemene
      Weduwen- en Wezenwet zou hebben gehad indien die wet nog van kracht zou zijn geweest, geldt het volgende:

      a. voor de toepassing van de bepalingen inzake samenloop van pensioen en algemeen pensioen over tijd vóór 1
      januari 1986 (inbouwbepalingen) en de bepalingen inzake het recht op een toeslag wegens het ontbreken van recht op
      uitkering ingevolge de [Algemene nabestaandenwet][ref3] heeft [artikel II, eerste lid][ref4], geen werking;

      b. de onder *a* bedoelde toeslag wordt berekend overeenkomstig de artikelen 22a en 67a indien het een toeslag
      op een nabestaandenpensioen betreft en overeenkomstig de artikelen 25a en 70a indien het een toeslag op een
      wezenpensioen betreft;

      c. een toeslag op een nabestaandenpensioen wordt mede berekend over tijd na 31 december 1995, indien en voorzover
      in aanmerking genomen voor de berekening van het pensioen.

      2 Het eerste lid, onder *c*, geldt mede voor een recht op nabestaandenpensioen, ontstaan wegens overlijden
      tussen 26 juni 1996 en 1 juli 1996 van een politieke ambtsdrager, gewezen politieke ambtsdrager of gepensioneerde
      politieke ambtsdrager als bedoeld in [artikel 2, tweede lid, onder ][ref5], van een nabestaande die wegens dat
      overlijden recht heeft verkregen op een tijdelijke weduwenuitkering op grond van de Algemene Weduwen- en Wezenwet,
      na het verstrijken van de duur van die uitkering.

      3 Op een nabestaandenpensioen wordt een toeslag verleend indien degene die recht heeft op dat pensioen:

      a. op 1 januari 1998 recht heeft op nabestaandenuitkering ingevolge de [Algemene nabestaandenwet][ref6], welke
      uitkering vanaf deze datum wordt verminderd wegens inkomen uit of in verband met arbeid; en

      b. het recht op de onder a bedoelde uitkering bestaat ter zake van een overlijden vóór 1 juli 1996; en

      c. de rechthebbende op 1 juli 1996 inkomen genoot als bedoeld onder a.

      4 De toeslag bedoeld in het derde lid bedraagt per pensioentellend jaar:

      a. bij een bruto-inkomen als bedoeld in het derde lid, onder c, dat op 1 juli 1996 gelijk was of minder bedroeg
      dan f 40 000,– op jaarbasis, 2,5 procent van het verschil tussen de bedragen van de nabestaandenuitkering, zoals
      deze voor en na toepassing van de in [artikel 67, eerste lid, van de Algemene nabestaandenwet][ref7] bedoelde
      vermindering zijn vastgesteld;

      b. bij een bruto-inkomen als bedoeld in het derde lid, onder c, dat op 1 juli 1996 meer bedroeg dan f 40 000,– op
      jaarbasis, 2,5 procent van het onder a bedoelde verschil, verminderd met twee derde gedeelte van het inkomen boven
      f 40 000,–, met dien verstande dat de toeslag niet negatief kan zijn.

      5 De toeslag bedoeld in het derde lid is niet hoger dan het bedrag dat met overeenkomstige toepassing van het
      eerste lid zou zijn vastgesteld.

      6 Het recht op de toeslag bedoeld in het derde lid bestaat voor zo lang recht bestaat op nabestaandenuitkering
      ingevolge de [Algemene nabestaandenwet][ref8], maar uiterlijk tot 1 juli 1999.

      7 Bij een verordening als bedoeld in [hoofdstuk 23 van de Algemene pensioenwet politieke ambtsdragers][ref9]
      kan een regeling worden getroffen overeenkomstig het eerste en het tweede lid. Het derde, vierde,
      vijfde en zesde lid zijn van overeenkomstige toepassing op een politieke ambtsdrager, bedoeld in
      [artikel 2, tweede lid, onder d, van de Algemene pensioenwet politieke ambtsdragers][ref10].


