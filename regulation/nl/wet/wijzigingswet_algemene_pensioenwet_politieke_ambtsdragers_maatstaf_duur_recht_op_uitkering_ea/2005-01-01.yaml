preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de maatstaf voor de duur van het recht op uitkering bij
    aftreden als politiek ambtsdrager te wijzigen en enige andere wijzigingen aan te brengen in de Algemene pensioenwet
    politieke ambtsdragers;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008405/2005-01-01#ArtikelAanhef
articles:
  - number: II
    text: |-
      1 Een regeling van nabestaanden- en wezenpensioen, vervat in de [Algemene pensioenwet politieke ambtsdragers][ref1]
      of in een verordening als bedoeld in hoofdstuk 23 van die wet, wordt voor de toepassing van
      [artikel 103 van de Algemene nabestaandenwet][ref2] beschouwd als een pensioenregeling als bedoeld in dat artikel.

      2


