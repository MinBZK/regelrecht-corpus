---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_tot_invoering_van_een_leeftijdsgrens_voor_het_notarisambt_en_oprichting_van_een_notarieel_pensioenfonds
regulatory_layer: WET
publication_date: '2005-11-01'
valid_from: '2003-12-01'
bwb_id: BWBR0002143
url: https://wetten.overheid.nl/BWBR0002143/2003-12-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is een leeftijdsgrens in te voeren voor het bekleden
    van het notarisambt en een wettelijke regeling vast te stellen betreffende de oprichting van een notarieel
    pensioenfonds;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Deze wet verstaat onder: het fonds: het notarieel pensioenfonds, bedoeld in [artikel 4][ref1];
      de Pensioen- & Verzekeringskamer: de Pensioen- & Verzekeringskamer, bedoeld in
      [artikel 2 van de Wet toezicht verzekeringsbedrijf 1993][ref2]; kandidaat-notarissen: de kandidaat-notarissen,
      die met de waarneming van een notariskantoor zijn belast, dan wel werkzaam zijn op een notariskantoor of bij een
      door Onze Minister van Justitie, gehoord het bestuur van het fonds, op haar verzoek aangewezen instelling, die
      behartiging van notariële belangen beoogt.


      [ref1]: https://wetten.overheid.nl/BWBR0002143#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0006509#Artikel2
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002143
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0006509
        artikel: '2'
  - number: '4.1'
    text: |-
      Onze Minister van Justitie draagt zorg dat een notarieel pensioenfonds wordt opgericht, doch alleen indien binnen
      een door hem te stellen termijn een - naar zijn oordeel belangrijke - meerderheid van de notarissen en kandidaat-
      notarissen gezamenlijk zich voor de oprichting heeft uitgesproken. Onze Minister bepaalt op welke wijze de stemming
      wordt gehouden. Notarissen of kandidaat-notarissen, die niet aan de stemming deelnemen of blanco stemmen, worden
      geacht zich voor de oprichting uit te spreken.
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel4
  - number: '4.2'
    text: |-
      Het fonds wordt opgericht in de vorm van een stichting bij notariële akte, waarbij zijn doel wordt omschreven. Van
      de oprichting wordt mededeling gedaan in de Nederlandse Staatscourant.
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel4
  - number: '4.3'
    text: In het bestuur van het fonds moeten notarissen en kandidaat-notarissen zitting hebben.
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel4
  - number: '4.4'
    text: |-
      Het bestuur van het fonds stelt met inachtneming van hetgeen de statuten dienaangaande bepalen een
      pensioenreglement vast. Indien het bestuur het pensioenreglement niet tijdig vaststelt, is Onze Minister van
      Justitie bevoegd dat reglement voor de eerste maal vast te stellen.
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel4
  - number: '4.5'
    text: |-
      Van een wijziging van de statuten alsmede van de vaststelling en wijziging van het pensioenreglement wordt een
      notariële akte opgemaakt.
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel4
  - number: '4.6'
    text: |-
      De statuten en het pensioenreglement benevens de wijzigingen daarin behoeven de voorafgaande goedkeuring van Onze
      Minister van Justitie. Alvorens deze goedkeuring te verlenen dan wel de statuten of het pensioenreglement voor de
      eerste maal vast te stellen hoort Onze Minister van Justitie de Pensioen- & Verzekeringskamer. Van de goedkeuring
      wordt mededeling gedaan in de *Nederlandse Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel4
  - number: '5.1'
    text: Iedere notaris en iedere kandidaat-notaris is deelnemer in het fonds.
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel5
  - number: '5.2'
    text: |-
      De Minister van Justitie, gehoord het bestuur van het fonds, is bevoegd om vrijstelling te verlenen van de
      deelneming op grond dat de betrokken notaris of kandidaat-notaris gemoedsbezwaren heeft tegen elke vorm van
      verzekering.
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel5
  - number: '5.3'
    text: |-
      Het bestuur van het fonds is bevoegd een deelnemer vervallen te verklaren van het deelnemerschap op grond van
      nalatigheid in de voldoening van zijn geldelijke verplichtingen jegens het fonds gedurende een periode van ten
      minste twee jaren. Het bestuur kan hem, die vervallen is verklaard van het deelnemerschap, op diens verzoek opnieuw
      toelaten tot het deelnemerschap onder door het bestuur te stellen voorwaarden.
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel5
  - number: '6.1'
    text: 'Het deelnemerschap geeft recht op pensioen en wel:'
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel6
  - number: 6.1.a
    text: ouderdomspensioen aan deelnemers of gewezen deelnemers;
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel6
  - number: 6.1.b
    text: arbeidsongeschiktheidspensioen aan deelnemers;
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel6
  - number: 6.1.c
    text: |-
      nabestaandenpensioen aan degene die ten tijde van het overlijden van een deelnemer of gewezen deelnemer diens
      partner was in de zin van het pensioenreglement.
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel6
  - number: 6.1.d
    text: |-
      bijzonder nabestaandenpensioen aan degene die de partner in de zin van het pensioenreglement is geweest van een
      overleden deelnemer of gewezen deelnemer doch dit niet meer was ten tijde van diens overlijden.
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel6
  - number: 6.1.e
    text: wezenpensioen aan wezen van overleden deelnemers of gewezen deelnemers;
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel6
  - number: 6.1.f
    text: |-
      ingeval van vermissing van een deelnemer of gewezen deelnemer: tijdelijk pensioen aan degenen die aan zijn
      overlijden recht op pensioen zouden ontlenen.
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel6
  - number: '6.2'
    text: |-
      In het pensioenreglement kunnen pleegkinderen worden gelijkgesteld met kinderen die in familierechtelijke
      betrekkingen tot de deelnemer of gewezen deelnemer staan.
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel6
  - number: '6.3'
    text: |-
      Iedere deelnemer is aan het fonds schuldig een bij het pensioenreglement te bepalen en op actuariële gronden vast
      te stellen premie, die afhankelijk is van de leeftijd van de deelnemer en de hoogte van de pensioenopbouw.
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel6
  - number: '6.4'
    text: |-
      Tot het beroep van notaris of kandidaat-notaris behoren mede werkzaamheden, welke middellijk uit de uitoefening van
      dat beroep voortvloeien.
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel6
  - number: '6.5'
    text: 'Het bestuur van het fonds stelt bij reglement algemene regelen vast ter bepaling:'
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel6
  - number: 6.5.a
    text: welke werkzaamheden middellijk uit het beroep van notaris en kandidaat-notaris voortvloeien;
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel6
  - number: 6.5.b
    text: van de beroepswinst van notarissen, alsmede van het inkomen van kandidaat-notarissen.
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel6
  - number: '6.6'
    text: |-
      Notarissen, kandidaat-notarissen en overeenkomstig [artikel 1][ref1] aangewezen instellingen, alsmede degenen, die
      rechten op uitkering ontlenen aan het pensioenreglement, zijn verplicht tot naleving van het bij of krachtens de
      statuten en de reglementen van het fonds te hunnen aanzien bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0002143#Artikel1
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002143
        artikel: '1'
  - number: 6a
    text: |-
      De artikelen [32e tot en met 32h van de Pensioen- en spaarfondsenwet][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel32a
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0002089
        artikel: 32a
  - number: '7'
    text: 'De statuten of reglementen van het fonds moeten bepalingen inhouden betreffende:'
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel7
  - number: 7.a
    text: de bestemming van het fonds;
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel7
  - number: 7.b
    text: de deelnemers en de rechten en verplichtingen van dezen en van overige belanghebbenden;
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel7
  - number: 7.c
    text: het beheer van het fonds;
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel7
  - number: 7.d
    text: de belegging van het vermogen;
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel7
  - number: 7.e
    text: de benoeming en het ontslag van de bestuursleden;
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel7
  - number: 7.f
    text: de bestemming van het vermogen van het fonds na afloop der vereffening;
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel7
  - number: 7.g
    text: |-
      de wijziging van de statuten en de vaststelling en wijziging van het pensioenreglement en de andere reglementen
      van het fonds, met name ook wat betreft wijziging van de rechten en verplichtingen van de deelnemers, de in
      [artikel 6, eerste lid][ref1], bedoelde personen en van overige belanghebbenden in gevallen, waarin de financiële
      toestand van het fonds daartoe aanleiding geeft.


      [ref1]: https://wetten.overheid.nl/BWBR0002143#Artikel6
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002143
        artikel: '6'
  - number: '8.1'
    text: |-
      Het bestuur van het fonds legt aan de Pensioen- & Verzekeringskamer éénmaal in de vijf jaren - of, zo deze zulks
      nodig acht, binnen kortere termijn - een door een actuaris samengestelde wetenschappelijke balans en verlies- en
      winstrekening alsmede een actuarieel verslag betreffende het fonds over en éénmaal per jaar een door een accountant
      gecontroleerd verslag, waarin een volledig beeld van de financiële toestand van het fonds gegeven wordt en waaruit
      ten genoegen van de Pensioen- & Verzekeringskamer blijkt, of ten aanzien van het fonds wordt voldaan aan de bij
      of krachtens deze wet gegeven voorschriften en of de belangen der bij het fonds betrokken deelnemers, gewezen
      deelnemers en overige belanghebbenden voldoende gewaarborgd zijn.
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel8
  - number: '8.2'
    text: |-
      Door de Pensioen- & Verzekeringskamer kan in bijzondere gevallen, voorwaardelijk of onvoorwaardelijk, voor een
      bepaalde tijd vrijstelling worden verleend van het bepaalde in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel8
  - number: '8.3'
    text: |-
      Het bestuur van het fonds is verplicht aan de Pensioen- & Verzekeringskamer mededeling te doen van alle besluiten
      van algemene strekking.
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel8
  - number: '9.1'
    text: |-
      Tot het samenstellen of controleren van de in [artikel 8][ref1] bedoelde bescheiden, alsmede tot het verrichten
      van andere tot de normale beroepsbezigheden van actuarissen en accountants behorende werkzaamheden ten behoeve van
      het pensioenfonds is tegenover de Pensioen- & Verzekeringskamer alleen bevoegd degene, tegen wiens aanwijzing of
      handhaving bij het fonds de Pensioen- & Verzekeringskamer geen bezwaar heeft gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0002143#Artikel8
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002143
        artikel: '8'
  - number: '9.2'
    text: |-
      De Pensioen- & Verzekeringskamer kan tegen de aanwijzing of handhaving van een actuaris of accountant slechts
      bezwaar maken, indien de betrokkene, naar haar oordeel, niet of niet meer de nodige waarborgen biedt, dat hij de
      hem toevertrouwde taak naar behoren zal vervullen. Het bezwaar wordt schriftelijk ter kennis gebracht van het fonds
      en van de betrokken actuaris of accountant.
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel9
  - number: '9.3'
    text: |-
      Tegen een door de Pensioen- & Verzekeringskamer ingebracht bezwaar kan door het bestuur van het fonds of door
      de actuaris of accountant binnen één maand na de dagtekening van de kennisgeving van het bezwaar beroep worden
      ingesteld bij Onze Minister van Justitie. Deze doet van zijn beslissing mededeling aan het fondsbestuur, aan de
      Pensioen- & Verzekeringskamer en aan de betrokken actuaris of accountant.
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel9
  - number: '10'
    text: |-
      Het bestuur is verplicht aan de personen en instellingen, bedoeld in [artikel 6, zesde lid][ref1], tegen betaling
      van een door het bestuur vast te stellen bedrag een exemplaar van de statuten en reglementen te verschaffen.


      [ref1]: https://wetten.overheid.nl/BWBR0002143#Artikel6
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002143
        artikel: '6'
  - number: '11.1'
    text: |-
      Notarissen, kandidaat-notarissen en overeenkomstig [artikel 1][ref1] aangewezen instellingen, alsmede degenen,
      die rechten op uitkering ontlenen aan het pensioenreglement, zijn, ook nadat zij die hoedanigheid of zodanig recht
      hebben verloren, verplicht aan het bestuur van het fonds of aan een of meer door het bestuur aangewezen personen de
      gegevens te verstrekken, waarvan het bestuur ter vaststelling van deelnemerschap of van de daaruit voortvloeiende
      rechten en verplichtingen de kennisneming wenselijk oordeelt.


      [ref1]: https://wetten.overheid.nl/BWBR0002143#Artikel1
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002143
        artikel: '1'
  - number: '11.2'
    text: |-
      Indien geen of naar het oordeel van het bestuur onvoldoende gegevens worden verstrekt stelt het bestuur niettemin
      het deelnemerschap en de daaruit voortvloeiende rechten en verplichtingen vast.
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel11
  - number: '12.1'
    text: |-
      De in het vorige artikel bedoelde gegevens dienen te worden verstrekt schriftelijk, mondeling en door het verlenen
      van inzage in boeken en andere bescheiden, een en ander ter keuze van hem, die het verstrekken van de gegevens
      vordert en binnen de door deze te bepalen termijn.
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel12
  - number: '12.2'
    text: |-
      Hij aan wie op grond van het vorige lid inzage van boeken en bescheiden is gevraagd, wordt geacht die in zijn bezit
      te hebben, tenzij hij het tegendeel aannemelijk maakt.
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel12
  - number: '12.3'
    text: |-
      Voor een weigering om te voldoen aan een in dit of in het vorig artikel opgelegde verplichting kan niemand zich met
      vrucht beroepen op enige geheimhoudingsplicht, ook niet al mocht deze hem bij enig wetsvoorschrift zijn opgelegd.
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel12
  - number: '13'
    text: |-
      Ieder bestuurder van het fonds draagt er zorg voor, dat het bepaalde bij of krachtens deze wet alsmede de
      bepalingen van de statuten en de reglementen worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel13
  - number: '14.1'
    text: |-
      Ieder bestuurder van het fonds, ieder lid van het personeel en iedere persoon, bedoeld in
      [artikel 11, eerste lid][ref1], is verplicht aan de Pensioen- & Verzekeringskamer de inlichtingen te verstrekken,
      welke deze verlangt.


      [ref1]: https://wetten.overheid.nl/BWBR0002143#Artikel11
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002143
        artikel: '11'
  - number: '14.2'
    text: |-
      Het bepaalde in [artikel 12, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002143#Artikel12
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002143
        artikel: '12'
  - number: '15'
    text: |-
      De [artikelen 55, eerste lid, aanhef, onderdelen a en b, en slot, tweede en derde lid][ref1], [56][ref2] en
      [57 van de Wet toezicht verzekeringsbedrijf 1993][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0006509#Artikel56
      [ref3]: https://wetten.overheid.nl/BWBR0006509#Artikel57
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '55'
      - id: ref2
        bwb_id: BWBR0006509
        artikel: '56'
      - id: ref3
        bwb_id: BWBR0006509
        artikel: '57'
  - number: '16.1'
    text: |-
      Indien de Pensioen- & Verzekeringskamer de gang van zaken bij het fonds hetzij in zijn geheel hetzij op bepaalde
      onderdelen onbevredigend acht, brengt zij haar opmerkingen daarover bij aangetekend schrijven ter kennis van het
      fondsbestuur onder aanwijzing van de haars inziens te volgen gedragslijn.
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel16
  - number: '16.2'
    text: |-
      Het bestuur van het fonds is verplicht zich te gedragen naar de ingevolge het vorige lid door de Pensioen-
      & Verzekeringskamer gegeven aanwijzingen behoudens zijn bevoegdheid binnen één maand na ontvangst van de
      kennisgeving, in het eerste lid bedoeld, bij Ons in beroep te komen door middel van een gemotiveerd beroepschrift,
      waarvan gelijktijdig een afschrift aan de Pensioen- & Verzekeringskamer wordt toegezonden.
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel16
  - number: '16.3'
    text: |-
      Hangende het beroep is, indien de Pensioen- & Verzekeringskamer dit bepaalt, het bestuur van het fonds verplicht de
      aanwijzingen van de Kamer na te komen.
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel16
  - number: '16.4'
    text: |-
      Op het in het tweede lid bedoelde beroep wordt door Ons beslist, de Raad van State, afdeling voor de geschillen van
      bestuur, gehoord, bij een met redenen omkleed besluit.
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel16
  - number: '17'
    text: |-
      Telken jare brengt de Pensioen- & Verzekeringskamer aan Onze Minister van Justitie verslag uit omtrent haar
      bevindingen betreffende de toepassing dezer wet.
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel17
  - number: '18'
    text: |-
      Het fonds is verplicht aan de Pensioen- & Verzekeringskamer de kosten te vergoeden, welke voor haar aan de
      uitvoering van deze wet zijn verbonden.
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel18
  - number: '19'
    text: |-
      [Titel II van de Ambtenarenwet][ref1], voor zover deze betrekking heeft op verrekening met en beslag op pensioen,
      is van overeenkomstige toepassing op een door het fonds uit te keren pensioen.


      [ref1]: https://wetten.overheid.nl/BWBR0001947
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0001947
  - number: '20.1'
    text: |-
      Overdracht, inpandgeving of elke andere handeling, waardoor de deelnemer of gewezen deelnemer enig recht op zijn
      pensioen of zijn aanspraak op pensioen aan een ander toekent, is slechts geldig voor zover beslag op zijn pensioen
      geldig zou zijn bij ontbreken van andere inkomsten.
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel20
  - number: '20.2'
    text: Volmacht tot invordering van het pensioen, onder welke vorm of welke benaming ook verleend, is steeds herroepelijk.
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel20
  - number: '20.3'
    text: Elk beding strijdig met het eerste lid is nietig.
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel20
  - number: '21.1'
    text: |-
      Het is aan ieder verboden, hetgeen hem krachtens zijn ambt, betrekking of hoedanigheid ten gevolge van de
      uitvoering of toepassing dezer wet blijkt of medegedeeld wordt, verder bekend te maken dan dat ambt, die betrekking
      of die hoedanigheid met zich mede brengt.
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel21
  - number: '21.2'
    text: |-
      De Pensioen- & Verzekeringskamer kan, in afwijking van het eerste lid, gegevens of inlichtingen verkregen bij
      de vervulling van de haar ingevolge deze wet opgedragen taak verstrekken aan de autoriteiten die ingevolge de
      [Wet toezicht effectenverkeer 1995][ref1] zijn belast met het toezicht op het effectenverkeer, tenzij:


      [ref1]: https://wetten.overheid.nl/BWBR0007657
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0007657
  - number: 21.2.a
    text: het doel waarvoor de gegevens of inlichtingen zullen worden gebruikt onvoldoende bepaald is;
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel21
  - number: 21.2.b
    text: |-
      het beoogde gebruik van de gegevens of inlichtingen niet past in het kader van het toezicht op financiële markten
      of op natuurlijke personen en rechtspersonen die op die markten werkzaam zijn;
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel21
  - number: 21.2.c
    text: de geheimhouding van de gegevens of inlichtingen niet in voldoende mate is gewaarborgd;
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel21
  - number: 21.2.d
    text: |-
      de verstrekking van de gegevens of inlichtingen redelijkerwijs in strijd is of zou kunnen komen met de belangen die
      deze wet beoogt te beschermen; of
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel21
  - number: 21.2.e
    text: |-
      onvoldoende is gewaarborgd dat de gegevens of inlichtingen niet zullen worden gebruikt voor een ander doel dan
      waarvoor deze worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel21
  - number: '22.1'
    text: |-
      Hij die de overeenkomstig de [artikelen 11][ref1] en [12][ref2] gevorderde gegevens niet, niet tijdig of niet juist
      verstrekt, wordt gestraft met hechtenis van ten hoogste twee maanden of geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002143#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002143#Artikel12
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002143
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0002143
        artikel: '12'
  - number: '22.2'
    text: Het in dit artikel strafbaar gestelde feit is een overtreding.
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel22
  - number: '23.1'
    text: |-
      In zaken betreffende de rechtsvorderingen ter zake van deelneming in en uitkering uit het fonds kunnen partijen in
      persoon procederen.
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel23
  - number: '23.2'
    text: |-
      Indien na aanmaning bij aangetekende brief een ter zake van het deelnemerschap vastgestelde schuld binnen dertig
      dagen niet wordt voldaan, kan het fonds daarna die schuld invorderen bij dwangbevel, medebrengende het recht om de
      goederen van de schuldenaar zonder vonnis aan te tasten.
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel23
  - number: '23.3'
    text: |-
      De in het vorige lid bedoelde aanmaning vermeldt de tekst van het tweede en vijfde tot en met achtste lid van dit
      artikel en van het derde lid van artikel 6.
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel23
  - number: '23.4'
    text: 'Het dwangbevel houdt in:'
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel23
  - number: 23.4.a
    text: de naam en de zetel van het fonds;
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel23
  - number: 23.4.b
    text: de naam, de woonplaats en het adres van de schuldenaar;
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel23
  - number: 23.4.c
    text: het verschuldigde bedrag;
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel23
  - number: 23.4.d
    text: de gronden waarop de vordering berust;
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel23
  - number: 23.4.e
    text: de datum waarop de in het tweede lid bedoelde aanmaning is geschied;
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel23
  - number: 23.4.f
    text: de tekst van het zesde en zevende lid van dit artikel.
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel23
  - number: '23.5'
    text: |-
      De betekening en de tenuitvoerlegging van het dwangbevel geschieden op de wijze, voorgeschreven ten aanzien van
      vonnissen en authentieke akten in het [Wetboek van Burgerlijke Rechtsvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '23.6'
    text: |-
      Het dwangbevel kan niet ten uitvoer worden gelegd voordat acht dagen na de betekening daarvan verstreken zijn.
      Degene aan wie het dwangbevel is gericht, kan gedurende dertig dagen na de betekening door middel van dagvaarding
      in verzet komen bij de rechtbank van het arrondissement waarbinnen hij zijn woon- of verblijfplaats heeft. Het
      verzet wordt behandeld en beslist door de kantonrechter.
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel23
  - number: '23.7'
    text: Het verzet stuit de tenuitvoerlegging van het dwangbevel; een aangevangen tenuitvoerlegging wordt geschorst.
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel23
  - number: '23.8'
    text: Het recht tot invordering bij dwangbevel strekt zich uit tot de kosten van vervolging.
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel23
  - number: '24.1'
    text: 'Bij algemene maatregel van bestuur worden nadere regelen vastgesteld:'
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel24
  - number: 24.1.a
    text: |-
      ter bepaling of een kandidaat-notaris werkzaam is op een notariskantoor of bij een instelling aangewezen
      overeenkomstig [artikel 1][ref1], alsmede omtrent de daar bedoelde aanwijzing en de beëindiging van zodanige
      aanwijzing;


      [ref1]: https://wetten.overheid.nl/BWBR0002143#Artikel1
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002143
        artikel: '1'
  - number: 24.1.b
    text: |-
      omtrent de vrijstelling van de deelneming op grond van gemoedsbezwaren als vermeld in
      [artikel 5, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002143#Artikel5
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002143
        artikel: '5'
  - number: 24.1.c
    text: |-
      betreffende het samenstellen en overleggen van de bescheiden bedoeld in [artikel 8, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002143#Artikel8
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002143
        artikel: '8'
  - number: 24.1.d
    text: |-
      betreffende de kosten, welke het fonds verplicht is aan de Pensioen- & Verzekeringskamer te vergoeden ingevolge
      [artikel 18][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002143#Artikel18
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002143
        artikel: '18'
  - number: '24.2'
    text: |-
      Wij behouden Ons voor ook overigens bij algemene maatregel van bestuur nadere regelen tot uitvoering van deze wet
      te geven.
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel24
  - number: '25'
    text: |-
      Inlichtingen uit de basisadministratie persoonsgegevens en afschriften en uittreksels uit de registers van de
      burgerlijke stand, welke met het oog op deelneming in of uitkering uit het fonds ten aanzien van deelnemers of
      gewezen deelnemers worden gevraagd, zijn vrij van leges.
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel25
  - number: '27'
    text: |-
      Deze wet kan worden aangehaald als "Wet tot invoering van een leeftijdsgrens voor het notarisambt en oprichting van
      een notarieel pensioenfonds".
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel27
  - number: '28'
    text: |-
      Wij bepalen de tijdstippen, waarop de onderdelen van deze wet in werking treden, met dien verstande, dat de
      artikelen 2 en 3 niet in werking treden, alvorens de [artikelen 4][ref1] tot [7][ref2] in werking zijn getreden
      en hetzij


      [ref1]: https://wetten.overheid.nl/BWBR0002143#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002143#Artikel7
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002143
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0002143
        artikel: '7'
  - number: 28.a
    text: het fonds is opgericht, hetzij
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel28
  - number: 28.b
    text: |-
      de ingevolge [artikel 4, eerste lid][ref1], door Onze Minister van Justitie, gestelde termijn is verstreken zonder
      dat naar zijn oordeel een uitspraak als daar bedoeld is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002143#Artikel4
    url: https://wetten.overheid.nl/BWBR0002143/2003-12-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002143
        artikel: '4'
