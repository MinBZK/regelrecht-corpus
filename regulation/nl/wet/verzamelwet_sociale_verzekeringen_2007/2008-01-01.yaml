preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Allen die deze zullen zien of horen lezen, saluut! doen te weten:


    Alzo Wij in overweging genomen hebben, dat het wenselijk is enkele correcties en andere wijzigingen aan te brengen
    in een aantal socialeverzekeringswetten, met name in verband met de inwerkingtreding van de Wet werk en inkomen
    naar arbeidsvermogen;


    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0020804/2008-01-01#ArtikelAanhef
articles:
  - number: XVII
    text: |-
      Na de inwerkingtreding van [artikel III, onderdeel G][ref1], [artikel X, onderdeel K][ref2],
      [artikel XII, onderdeel C][ref3] en [artikel XIV, onderdeel G][ref4] van
      deze wet berust de [Regeling aanwijzing ontwikkelingsorganisaties BEU][ref5]
      mede op [artikel 53, eerste lid, onderdeel b, van de Werkloosheidswet][ref6],
      [artikel 18, tweede lid, onderdeel b, van de Wet werk en inkomen naar arbeidsvermogen][ref7],
      [artikel 64, tweede lid, onderdeel b, van de Ziektewet][ref8] en
      [artikel 81, tweede lid, onderdeel b, van de Wet op de arbeidsongeschiktheidsverzekering][ref9].


