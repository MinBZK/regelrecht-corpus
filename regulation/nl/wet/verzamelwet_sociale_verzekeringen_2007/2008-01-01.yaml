  - number: XVIII
    text: |-
      Na de inwerkingtreding van [artikel XIV, onderdeel F][ref1], van deze wet berust het
      [Besluit werkzaamheden, administratieve voorschriften en kosten eigenrisicodragen ZW][ref2] op
      [artikel 63a, zevende lid, van de Ziektewet][ref3].


