  - number: '24.2'
    text: |-
      De in het eerste lid bedoelde verhoging bedraagt het verschil tussen het bedrag, genoemd in het eerste
      lid, en de uitkering per dag op grond van de [Werkloosheidswet][ref1] of bedoeld in [hoofdstuk II][ref2]
      of [II][ref3] dan wel, indien tegelijkertijd recht bestaat op meerdere uitkeringen op grond van de nieuwe
      [Werkloosheidswet][ref4], het totaalbedrag van die uitkeringen, doch ten hoogste het verschil tussen het
      bedrag, genoemd in het eerste lid, en 70% van het minimumloon, zijnde het minimumloon per maand, bedoeld in
      [artikel 8, eerste lid, onderdeel a, van de Wet minimumloon en minimumvakantiebijslag][ref5], gedeeld door 21,75,
      of, indien het een persoon jonger dan 23 jaar betreft, het minimumloon per maand dat voor zijn leeftijd geldt op
      grond van [artikel 7, derde lid][ref6], en [artikel 8, derde lid, van genoemde wet][ref7], gedeeld door 21,75.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0004045#HoofdstukIIa
      [ref3]: https://wetten.overheid.nl/BWBR0004045#HoofdstukIIb
      [ref4]: https://wetten.overheid.nl/BWBR0004045
      [ref5]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref6]: https://wetten.overheid.nl/BWBR0002638#Artikel7
      [ref7]: https://wetten.overheid.nl/BWBR0002638#Artikel8
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel24
