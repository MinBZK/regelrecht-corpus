        artikel: '7'
  - number: '48.2'
    text: |-
      De in het eerste lid bedoelde verhoging bedraagt het verschil tussen het voor betrokkene geldende bedrag, genoemd
      in het eerste lid, en de uitkering per dag, doch ten hoogste het verschil tussen het voor betrokkene geldende
      bedrag, genoemd in het eerste lid, en 70% van het minimumloon, zijnde het minimumloon per maand, bedoeld in
      [artikel 8, eerste lid, onderdeel a, van de Wet minimumloon en minimumvakantiebijslag][ref1], gedeeld door 21,75,
      of, indien het een persoon jonger dan 23 jaar betreft, het minimumloon per maand dat voor zijn leeftijd geldt op
      grond van [artikel 7, derde lid][ref2], en [artikel 8, derde lid van genoemde wet,][ref3], gedeeld door 21,75.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0002638#Artikel8
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0002638
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0002638
        artikel: '8'
  - number: '48.3'
    text: |-
      Voor de toepassing van het eerste en tweede lid wordt onder uitkering verstaan het totaalbedrag
      aan uitkering per dag op grond van de [Wet werk en inkomen naar arbeidsvermogen][ref1], de
      [Wet op de arbeidsongeschiktheidsverzekering][ref2], de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref3]
      en de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0019057
      [ref2]: https://wetten.overheid.nl/BWBR0002524
      [ref3]: https://wetten.overheid.nl/BWBR0008656
      [ref4]: https://wetten.overheid.nl/BWBR0008657
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0019057
      - id: ref2
        bwb_id: BWBR0002524
      - id: ref3
        bwb_id: BWBR0008656
      - id: ref4
        bwb_id: BWBR0008657
  - number: '48.4'
    text: |-
      Bij ministeriële regeling worden regels gesteld inzake het aanmerken van de in het eerste lid bedoelde
      verhoging als een uitkering op grond van de [Wet werk en inkomen naar arbeidsvermogen][ref1], de
      [Wet op de arbeidsongeschiktheidsverzekering][ref2], de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref3]
      of de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0019057
      [ref2]: https://wetten.overheid.nl/BWBR0002524
      [ref3]: https://wetten.overheid.nl/BWBR0008656
      [ref4]: https://wetten.overheid.nl/BWBR0008657
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0019057
      - id: ref2
        bwb_id: BWBR0002524
      - id: ref3
        bwb_id: BWBR0008656
      - id: ref4
        bwb_id: BWBR0008657
  - number: '48.5'
    text: |-
      De bedragen, genoemd in het eerste lid, worden door Onze Minister herzien op dezelfde wijze en op hetzelfde
      tijdstip als waarop de bedragen, genoemd in [hoofdstuk 3 van de Wet werk en bijstand][ref1] worden herzien, waarna
      de herziene bedragen voor de in het eerste lid genoemde bedragen in de plaats treden.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0015703
        hoofdstuk: '3'
  - number: '49'
    text: |-
      De persoon ten aanzien van wie op de dag, voorafgaande aan die waarop [artikel 39][ref1] in werking treedt, artikel
      8 van de Algemene Arbeidsongeschiktheidswet van toepassing is en over die dag recht heeft op een uitkering op
      grond van die wet, aan wie die uitkering als gevolg van [artikel 39, onderdeel D tot en met F][ref2], niet meer
      wordt betaald, wordt voor de toepassing van de [Toeslagenwet][ref3] geacht een tot uitbetaling komende uitkering
      op grond van de Algemene Arbeidsongeschiktheidswet te hebben, zolang die uitkering zou zijn betaald, indien
      [artikel 39, onderdeel D tot en met F][ref4], niet in werking zou zijn getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0004046#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0004046#Artikel39
      [ref3]: https://wetten.overheid.nl/BWBR0004043
      [ref4]: https://wetten.overheid.nl/BWBR0004046#Artikel39
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0004046
        artikel: '39'
        hoofdstuk: III
        afdeling: I
      - id: ref2
        bwb_id: BWBR0004046
        artikel: '39'
        hoofdstuk: III
        afdeling: I
      - id: ref3
        bwb_id: BWBR0004043
      - id: ref4
        bwb_id: BWBR0004046
        artikel: '39'
        hoofdstuk: III
        afdeling: I
  - number: '51'
    text: |-
      In deze afdeling en de daarop berustende bepalingen wordt verstaan onder
      arbeidsongeschiktheidsuitkering een uitkering op grond van de Algemene Arbeidsongeschiktheidswet of de
      [Wet op de arbeidsongeschiktheidsverzekering][ref1] of beide wetten.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0002524
  - number: '52.1'
    text: |-
      De artikelen 5, 12, tweede tot en met vierde lid, en 23, van de Algemene
      Arbeidsongeschiktheidswet en de [artikelen 18][ref1], [21, tweede tot en met vierde lid][ref2], en
      [32 van de Wet op de arbeidsongeschiktheidsverzekering][ref3], zoals die artikelen luidden op de dag, voorafgaande
      aan die waarop de Wijzigingswet AAW/WAO in werking treedt, blijven van toepassing op de persoon die op die dag
      recht had op een arbeidsongeschiktheidsuitkering en op die dag de leeftijd van 35 jaar heeft bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel32
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '21'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: '32'
  - number: '52.2'
    text: |-
      De artikelen 5, 12, tweede tot en met vierde lid, en artikel 23 van de Algemene Arbeidsongeschiktheidswet, zoals
      die artikelen luidden op de dag, voorafgaande aan die, waarop de Wijzigingswet AAW/WAO in werking treedt, blijven
      van toepassing op de persoon, die op die dag recht had op een arbeidsongeschiktheidsuitkering op grond van artikel
      6, eerste lid, onderdeel *b*, van die wet.
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel52
  - number: '52.3'
    text: |-
      Vanaf de datum dat de Wet terugdringing beroep op de arbeidsongeschiktheidsregelingen (*Stb.* 1993, 412) in werking
      is getreden vinden de voorgaande leden nog slechts toepassing met betrekking tot personen die op die datum de
      leeftijd van 45 jaar hebben bereikt.
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel52
  - number: '53.1'
    text: |-
      De persoon die op de dag, voorafgaande aan die waarop de Wijzigingswet AAW/WAO in werking treedt, recht had op een
      arbeidsongeschiktheidsuitkering, berekend naar een arbeidsongeschiktheid van 80% of meer en op die dag de leeftijd
      van 35 jaar nog niet heeft bereikt, en wiens arbeidsongeschiktheid als gevolg van het bepaalde in de Wijzigingswet
      AAW/WAO met ingang van een later gelegen dag minder bedraagt dan 80%, heeft met ingang van die later gelegen dag
      recht op aanvullende uitkering.
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel53
  - number: '53.2'
    text: |-
      Geen recht op aanvullende uitkering heeft de persoon die niet voldoet aan de voorwaarden voor het recht op
      werkloosheidsuitkering, bedoeld in de [artikelen 15 tot en met 17 van de nieuwe Werkloosheidswet][ref1], of op wie
      een uitsluitingsgrond als bedoeld in [artikel 19 van die wet][ref2] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel19
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '19'
  - number: '53.3'
    text: |-
      De duur van de aanvullende uitkering is voor de persoon, die op de dag, waarop de Wijzigingswet AAW/WAO in werking
      treedt:
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel53
  - number: 53.3.a
    text: 'jonger is dan 23 jaar: één jaar;'
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel53
  - number: 53.3.b
    text: '23 jaar of ouder is, doch jonger dan 30 jaar: twee jaar;'
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel53
  - number: 53.3.c
    text: '30 jaar of ouder is, doch jonger dan 35 jaar: drie jaar.'
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel53
  - number: '53.4'
    text: |-
      Indien de persoon die recht heeft op aanvullende uitkering gedurende de laatste vijf jaar voor de dag, waarop
      de Wijzigingswet AAW/WAO in werking treedt, recht had op een arbeidsongeschiktheidsuitkering berekend naar een
      arbeidsongeschiktheid van 80% of meer, is, in afwijking van het derde lid, de duur van de aanvullende uitkering
      vijf jaar.
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel53
  - number: '53.5'
    text: |-
      Het bedrag van de aanvullende uitkering wordt berekend met overeenkomstige toepassing van de
      [artikelen 44 tot en met 47 van de nieuwe Werkloosheidswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel44
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '44'
  - number: '53.6'
    text: |-
      Dit artikel is slechts van toepassing indien de later gelegen dag, bedoeld in het eerste lid, niet later is gelegen
      dan binnen twee jaar na de dag, waarop de Wijzigingswet AAW/WAO in werking treedt en ten aanzien van de persoon,
      bedoeld in het derde lid, onderdeel *c*, niet eerder dan een jaar na de dag waarop de Wijzigingswet AAW/WAO in
      werking treedt. Onze Minister is bevoegd voor bepaalde categorieën personen andere tijdvakken dan als genoemd in de
      eerste volzin vast te stellen.
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel53
  - number: '54.1'
    text: |-
      De persoon die recht heeft op de aanvullende uitkering, bedoeld in [artikel 53][ref1], heeft na het verstrijken
      van de daarvoor geldende uitkeringsduur aansluitend recht op aanvullende vervolguitkering gedurende een
      jaar, indien hij voldoet aan de voorwaarden, bedoeld in de [artikelen 15][ref2] en [16][ref3], alsmede
      [42, tweede tot en met negende lid][ref4], of [artikel 48, tweede lid, van de nieuwe Werkloosheidswet][ref5] en op
      wie geen uitsluitingsgrond als bedoeld in [artikel 19 van die wet][ref6] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0004046#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0004045#Artikel42
      [ref5]: https://wetten.overheid.nl/BWBR0004045#Artikel48
      [ref6]: https://wetten.overheid.nl/BWBR0004045#Artikel19
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0004046
        artikel: '53'
        hoofdstuk: III
        afdeling: III
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '15'
      - id: ref3
        bwb_id: BWBR0004045
        artikel: '16'
      - id: ref4
        bwb_id: BWBR0004045
        artikel: '42'
      - id: ref5
        bwb_id: BWBR0004045
        artikel: '48'
      - id: ref6
        bwb_id: BWBR0004045
        artikel: '19'
  - number: '54.2'
    text: |-
      Het bedrag van de aanvullende vervolguitkering wordt berekend met overeenkomstige toepassing van de
      [artikelen 51][ref1] en [52 van de nieuwe Werkloosheidswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel52
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '51'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '52'
  - number: '55.1'
    text: |-
      Met betrekking tot de aanvullende uitkering en de aanvullende vervolguitkering zijn de [artikelen 20][ref1],
      [22 tot en met 40][ref2], [76][ref3], [128][ref4] en [129 van de nieuwe Werkloosheidswet][ref5] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel76
      [ref4]: https://wetten.overheid.nl/BWBR0004045#Artikel128
      [ref5]: https://wetten.overheid.nl/BWBR0004045#Artikel129
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '22'
      - id: ref3
        bwb_id: BWBR0004045
        artikel: '76'
      - id: ref4
        bwb_id: BWBR0004045
        artikel: '128'
      - id: ref5
        bwb_id: BWBR0004045
        artikel: '129'
  - number: '55.2'
    text: |-
      De persoon, die in verband met werkloosheid recht heeft op aanvullende uitkering of aanvullende vervolguitkering,
      heeft ter zake van dezelfde werkloosheid geen recht op uitkering op grond van de nieuwe [Werkloosheidswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '55.3'
    text: |-
      De aanvullende uitkering en de aanvullende vervolguitkering worden, voor zover in deze wet of de daarop berustende
      bepalingen niet anders is bepaald, voor de toepassing van wettelijke bepalingen beschouwd als uitkering op grond
      van de nieuwe [Werkloosheidswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '55.4'
    text: |-
      De aanvullende uitkering en de aanvullende vervolguitkering komen ten laste van het Algemeen
      Arbeidsongeschiktheidsfonds, bedoeld in [artikel 34 van de Wet financiering volksverzekeringen][ref1] en het
      Arbeidsongeschiktheidsfonds, bedoeld in [artikel 72 van de Wet op de arbeidsongeschiktheidsverzekering][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004538#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel72
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0004538
        artikel: '34'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '72'
  - number: '55.5'
    text: |-
      Onze Minister stelt regels met betrekking tot de verdeling van de lasten, bedoeld in het vierde lid, over de in dat
      lid genoemde fondsen.
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel55
  - number: '56.1'
    text: |-
      Indien het recht op aanvullende uitkering of aanvullende vervolguitkering op grond van
      [artikel 20, eerste lid, onderdeel ][ref1] geheel of gedeeltelijk is geëindigd, en vervolgens de omstandigheid
      die tot dat eindigen heeft geleid heeft opgehouden te bestaan, zonder dat een recht op uitkering als bedoeld
      in [artikel 15 van die wet][ref2] is ontstaan, herleeft het recht op aanvullende uitkering of aanvullende
      vervolguitkering met overeenkomstige toepassing van [artikel 8 van die wet ][ref3]en de op grond van
      [artikel 21, tweede lid, van die wet][ref4] gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0004045#Artikel21
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '15'
      - id: ref3
        bwb_id: BWBR0004045
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0004045
        artikel: '21'
  - number: '56.2'
    text: |-
      Telkens nadat het recht op aanvullende uitkering of aanvullende vervolguitkering na een gehele eindiging van
      dat recht is herleefd op grond van het eerste lid, eindigt het recht op die uitkering zoveel later dan de in
      [artikel 53, derde of vierde lid][ref1], dan wel in [artikel 54, eerste lid][ref2], genoemde periode als de periode
      tussen de eindiging en de herleving van het recht op die uitkering heeft geduurd.


      [ref1]: https://wetten.overheid.nl/BWBR0004046#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0004046#Artikel54
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0004046
        artikel: '53'
        hoofdstuk: III
        afdeling: III
      - id: ref2
        bwb_id: BWBR0004046
        artikel: '54'
        hoofdstuk: III
        afdeling: III
  - number: '57.1'
    text: |-
      Indien het recht op aanvullende uitkering door het verrichten van arbeid geheel of gedeeltelijk is
      geëindigd en vervolgens na beëindiging van die arbeid een recht op uitkering is ontstaan als bedoeld
      in [artikel 15 van de nieuwe Werkloosheidswet][ref1], herleeft het recht op aanvullende uitkering, voor
      zover geen recht op genoemde uitkering bestaat, met ingang van de dag waarop het recht op die uitkering is
      ontstaan, en overigens met ingang van de eerste dag na het verstrijken van de uitkeringsduur, bedoeld in
      [artikel 42 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel42
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '42'
  - number: '57.2'
    text: |-
      Het eerste lid is slechts van toepassing indien de in het eerste lid bedoelde dag is gelegen binnen een tijdvak
      van:
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel57
  - number: 57.2.a
    text: |-
      twee jaar ten aanzien van de persoon, bedoeld in [artikel 53, derde lid, onderdeel ][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004046#Artikel53
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0004046
        artikel: '53'
        hoofdstuk: III
        afdeling: III
  - number: 57.2.b
    text: |-
      vier jaar ten aanzien van de persoon, bedoeld in [artikel 53, derde lid, onderdeel ][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004046#Artikel53
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0004046
        artikel: '53'
        hoofdstuk: III
        afdeling: III
  - number: 57.2.c
    text: |-
      zes jaar ten aanzien van de persoon, bedoeld in [artikel 53, derde lid, onderdeel ][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004046#Artikel53
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0004046
        artikel: '53'
        hoofdstuk: III
        afdeling: III
  - number: 57.2.d
    text: |-
      tien jaar ten aanzien van de persoon, bedoeld in [artikel 53, vierde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004046#Artikel53
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0004046
        artikel: '53'
        hoofdstuk: III
        afdeling: III
  - number: '57.3'
    text: |-
      Indien het recht op aanvullende uitkering na een gehele eindiging van dat recht is herleefd op grond van het eerste
      lid, is de uitkeringsduur de duur van de aanvullende uitkering die betrokkene als gevolg van die eindiging van het
      eerdere recht niet heeft ontvangen, doch ten hoogste de duur van de periode beginnend op de dag, bedoeld in het
      eerste lid, en eindigend op de laatste dag van het voor betrokkene geldende tijdvak, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel57
  - number: '58'
    text: |-
      Ten aanzien van de persoon, bedoeld in [artikel 53][ref1], is [artikel 2, eerste lid, onderdeel ][ref2] van
      overeenkomstige toepassing, met dien verstande, dat in plaats van de uitkeringsduur op grond van de nieuwe
      [Werkloosheidswet][ref3] in aanmerking wordt genomen de uitkeringsduur op grond van deze afdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0004046#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0004044#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0004046
        artikel: '53'
        hoofdstuk: III
        afdeling: III
      - id: ref2
        bwb_id: BWBR0004044
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0004045
  - number: '59'
    text: |-
      Onze Minister is bevoegd in verband met het recht op aanvullende uitkering nadere en zo nodig afwijkende regels te
      stellen met betrekking tot de voorwaarden, bedoeld in [artikel 53, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004046#Artikel53
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0004046
        artikel: '53'
        hoofdstuk: III
        afdeling: III
  - number: '62'
    text: |-
      De persoon, ten aanzien van wie op de dag, voorafgaande aan die waarop [artikel 60][ref1] in werking treedt, op
      grond van [artikel 17, eerste lid, van de Ziektewet][ref2] het minimumdagloon in aanmerking werd genomen en die op
      de dag van inwerkingtreding van [artikel 60][ref3] op grond van die bepaling voor het minimumdagloon in aanmerking
      zou zijn gekomen als [artikel 17 van de Ziektewet][ref4] niet was vervallen, wordt ten hoogste gedurende de eerste
      zes weken van de ongeschiktheid tot werken voor het minimumdagloon in aanmerking gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0004046#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0004046#Artikel60
      [ref4]: https://wetten.overheid.nl/BWBR0001888#Artikel17
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0004046
        artikel: '60'
        hoofdstuk: IV
        afdeling: I
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '17'
      - id: ref3
        bwb_id: BWBR0004046
        artikel: '60'
        hoofdstuk: IV
        afdeling: I
      - id: ref4
        bwb_id: BWBR0001888
        artikel: '17'
  - number: '63.1'
    text: |-
      De persoon, ten aanzien van wie op de dag voorafgaande aan die waarop [artikel 60][ref1] in werking treedt,
      op grond van [artikel 17, tweede en derde lid, van de Ziektewet][ref2], het minimumdagloon in aanmerking werd
      genomen en op de dag van inwerkingtreding van [artikel 60][ref3] op grond van die bepaling voor het minimumdagloon
      in aanmerking zou zijn gekomen als [artikel 17 van de Ziektewet][ref4] niet was vervallen, wordt zolang hij
      onafgebroken uitkering op grond van de [Ziektewet][ref5] ontvangt voor het minimumdagloon in aanmerking gebracht.
      Voor de toepassing van de eerste volzin wordt de uitkering geacht niet te zijn onderbroken indien perioden waarover
      ziekengeld wordt uitgekeerd elkaar met een onderbreking van minder dan een maand opvolgen.


      [ref1]: https://wetten.overheid.nl/BWBR0004046#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0004046#Artikel60
      [ref4]: https://wetten.overheid.nl/BWBR0001888#Artikel17
      [ref5]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0004046
        artikel: '60'
        hoofdstuk: IV
        afdeling: I
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '17'
      - id: ref3
        bwb_id: BWBR0004046
        artikel: '60'
        hoofdstuk: IV
        afdeling: I
      - id: ref4
        bwb_id: BWBR0001888
        artikel: '17'
      - id: ref5
        bwb_id: BWBR0001888
  - number: '63.2'
    text: |-
      Indien voor de in het eerste lid bedoelde persoon op de dag voorafgaande aan die waarop
      [artikel 60][ref1] in werking treedt, het minimumdagloon in aanmerking werd genomen met toepassing
      van [artikel 17, vierde lid, van de Ziektewet][ref2], wordt voor het recht op toeslag op grond van de
      [Toeslagenwet][ref3] als dagloon aangemerkt 70% van het voor deze persoon in aanmerking genomen minimumdagloon.


      [ref1]: https://wetten.overheid.nl/BWBR0004046#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0004043
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0004046
        artikel: '60'
        hoofdstuk: IV
        afdeling: I
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '17'
      - id: ref3
        bwb_id: BWBR0004043
  - number: '64'
    text: |-
      Voor de toepassing van de [artikelen 62][ref1] en [63][ref2] wordt onder minimumdagloon verstaan, het
      minimumdagloon dat zou zijn vastgesteld als [artikel 16 van de Ziektewet][ref3], zoals dat artikel luidde op de
      dag, voorafgaande aan die waarop [artikel 60][ref4] in werking treedt, niet was vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0004046#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0004046#Artikel63
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0004046#Artikel60
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0004046
        artikel: '62'
        hoofdstuk: IV
        afdeling: II
      - id: ref2
        bwb_id: BWBR0004046
        artikel: '63'
        hoofdstuk: IV
        afdeling: II
      - id: ref3
        bwb_id: BWBR0001888
        artikel: '16'
      - id: ref4
        bwb_id: BWBR0004046
        artikel: '60'
        hoofdstuk: IV
        afdeling: I
  - number: 64a.1
    text: |-
      De persoon die 21 jaar of ouder is, die voor de toepassing van de [Toeslagenwet][ref1]
      niet als gehuwd wordt aangemerkt en voor wie de algemene heffingskorting, bedoeld in
      [artikel 22 van de Wet op de loonbelasting 1964][ref2], maar niet de alleenstaande-ouderkorting, bedoeld in
      [artikel 8.15 van de Wet inkomstenbelasting 2001][ref3], van toepassing is en die recht heeft op uitkering op grond
      van de [Ziektewet][ref4], berekend naar een dagloon dat ten minste gelijk is aan 70% van het minimumloon, heeft
      recht op een verhoging van zijn uitkering op grond van de [Ziektewet][ref5], indien die uitkering per dag, indien
      hij 21 jaar, 22 jaar onderscheidenlijk 23 jaar of ouder is, minder bedraagt dan f 50,33, f 61,78, onderscheidenlijk
      f 79,-.


      [ref1]: https://wetten.overheid.nl/BWBR0004043
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0001888
      [ref5]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel64a
    references:
      - id: ref1
        bwb_id: BWBR0004043
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '22'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0001888
      - id: ref5
        bwb_id: BWBR0001888
  - number: 64a.2
    text: |-
      De in het eerste lid bedoelde verhoging bedraagt het verschil tussen het bedrag, genoemd in het eerste lid, en
      de uitkering per dag op grond van de [Ziektewet][ref1], doch ten hoogste het verschil tussen het voor betrokkene
      geldende bedrag, genoemd in het eerste lid, en 70% van het minimumloon, zijnde het minimumloon per maand, bedoeld
      in [artikel 8, eerste lid, onderdeel a, van de Wet minimumloon en minimumvakantiebijslag][ref2], gedeeld door
      21,75, of, indien het een persoon jonger dan 23 jaar betreft, het minimumloon per maand dat voor zijn leeftijd
      geldt op grond van [artikel 7, derde lid][ref3], en [artikel 8, derde lid, van genoemde wet][ref4], gedeeld door
      21,75.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0002638#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0002638#Artikel8
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel64a
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0002638
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0002638
        artikel: '7'
      - id: ref4
        bwb_id: BWBR0002638
        artikel: '8'
  - number: 64a.3
    text: |-
      Onder het in het eerste lid bedoelde minimumloon wordt verstaan het minimumloon per maand, bedoeld in
      [artikel 8, eerste lid, onderdeel a, van de Wet minimumloon en minimumvakantiebijslag][ref1] of, indien het
      een persoon jonger dan 23 jaar betreft, het minimumloon per maand dat voor zijn leeftijd geldt op grond van
      [artikel 7, derde lid][ref2], en [artikel 8, derde lid, van die wet][ref3], beide vermeerderd met de daarover
      berekende vakantiebijslag, bedoeld in [artikel 15 van die wet][ref4], en vervolgens gedeeld door 21,75.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0002638#Artikel15
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel64a
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0002638
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0002638
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0002638
        artikel: '15'
  - number: 64a.4
    text: |-
      De bedragen, genoemd in het eerste lid, worden door Onze Minister herzien op dezelfde wijze en op hetzelfde
      tijdstip als waarop de bedragen genoemd in [hoofdstuk 3 van de Wet werk en bijstand][ref1] worden herzien, waarna
      de herziene bedragen voor de in het eerste lid genoemde bedragen in de plaats treden.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel64a
    references:
      - id: ref1
        bwb_id: BWBR0015703
        hoofdstuk: '3'
  - number: '66.1'
    text: |-
      De organen, die op grond van deze wet of de daarop berustende bepalingen zijn belast met de uitvoering van
      de [Wet Werkloosheidsvoorziening][ref1], en het Uitvoeringsinstituut werknemersverzekeringen zijn gehouden in
      gezamenlijk overleg al datgene te verrichten, waardoor voor hun personeel mogelijke nadelige gevolgen van de
      invoering van de nieuwe [Werkloosheidswet][ref2] worden voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002470
      [ref2]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0002470
      - id: ref2
        bwb_id: BWBR0004045
  - number: '66.2'
    text: |-
      Onze Minister is bevoegd, na overleg met Onze Minister van Binnenlandse Zaken nadere regels te stellen met
      betrekking tot de overgang van personeel, belast met de uitvoering van de [Wet Werkloosheidsvoorziening][ref1],
      naar het Uitvoeringsinstituut werknemersverzekeringen in verband met de invoering van de nieuwe
      [Werkloosheidswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002470
      [ref2]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0002470
      - id: ref2
        bwb_id: BWBR0004045
  - number: '78.1'
    text: |-
