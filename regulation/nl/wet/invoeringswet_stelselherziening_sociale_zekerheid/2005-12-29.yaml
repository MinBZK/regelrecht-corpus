preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regels te stellen met betrekking tot de intrekking
    van de Werkloosheidswet, de invoering van de nieuwe Werkloosheidswet, de Toeslagenwet, de Wet inkomensvoorziening
    oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers, de Wet, houdende nadere wijziging van de Algemene
    Arbeidsongeschiktheidswet en de Wet op de arbeidsongeschiktheidsverzekering (nadere regeling in verband met
    verminderde gelegenheid tot het verkrijgen van arbeid), de Wet, houdende wijziging van de Algemene Bijstandswet
    met betrekking tot de gelijke behandeling van mannen en vrouwen en gelijkstelling van niet gehuwde personen met
    gehuwden en de Wet, houdende wijziging van de Algemene Ouderdomswet (gelijkstelling niet-gehuwde personen met
    gehuwden of echtgenoten), alsmede regels te stellen met betrekking tot het in het kader van die intrekking en
    invoering noodzakelijke overgangsrecht, en voorts een aantal wetten en regelingen in verband daarmee aan te passen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Sociale Zaken en Werkgelegenheid;'
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel1
  - number: 1.1.b
    text: |-
      [Werkloosheidswet][ref1]: de [Werkloosheidswet][ref2] (*Stb.* 1967, 421) zoals die wet luidde op de dag,
      voorafgaande aan die waarop de nieuwe [Werkloosheidswet][ref3] in werking treedt;


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0004045
      [ref3]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0004045
      - id: ref3
        bwb_id: BWBR0004045
  - number: 1.1.c
    text: |-
      Wet Werkloosheidsvoorziening: de Wet Werkloosheidsvoorziening (*Stb.* 1964, 485) zoals die wet luidde op de dag,
      voorafgaande aan die waarop deze wet in werking treedt;
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel1
  - number: 1.1.d
    text: |-
      nieuwe [Werkloosheidswet][ref1]: het bij koninklijke boodschap van 17 oktober 1985 (kamerstukken II, 1985-1986, 19
      261) ingediende voorstel van wet tot verzekering van werknemers tegen geldelijke gevolgen van werkloosheid, zoals
      dat tot wet wordt verheven;


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: 1.1.e
    text: |-
      [Toeslagenwet][ref1]: het bij koninklijke boodschap van 17 oktober 1985 (kamerstukken II, 1985-
      1986, 19 257) ingediende voorstel van wet tot verlening van toeslagen tot het relevante sociaal
      minimum aan uitkeringsgerechtigden op grond van de [Werkloosheidswet][ref2], de [Ziektewet][ref3], de
      Algemene Arbeidsongeschiktheidswet, de [Wet op de arbeidsongeschiktheidsverzekering][ref4] en de Wet
      arbeidsongeschiktheidsvoorziening militairen, die een of meer personen tot hun financiële last hebben, zoals dat
      tot wet wordt verheven;


      [ref1]: https://wetten.overheid.nl/BWBR0004043
      [ref2]: https://wetten.overheid.nl/BWBR0004045
      [ref3]: https://wetten.overheid.nl/BWBR0001888
      [ref4]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004043
      - id: ref2
        bwb_id: BWBR0004045
      - id: ref3
        bwb_id: BWBR0001888
      - id: ref4
        bwb_id: BWBR0002524
  - number: 1.1.f
    text: |-
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref1]: het bij koninklijke
      boodschap van 17 oktober 1985 (kamerstukken II, 1985-1986, 19 260) ingediende voorstel van wet tot het treffen
      van een inkomensvoorziening voor oudere werkloze werknemers van wie het recht op een uitkering op grond van de
      [Werkloosheidswet][ref2] is geëindigd, zoals dat tot wet wordt verheven;


      [ref1]: https://wetten.overheid.nl/BWBR0004044
      [ref2]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004044
      - id: ref2
        bwb_id: BWBR0004045
  - number: 1.1.g
    text: |-
      Wijzigingswet AAW/WAO: het bij koninklijke boodschap van 17 oktober 1985 (kamerstukken II, 1985-1986,
      19 256) ingediende voorstel van wet tot nadere wijziging van de Algemene Arbeidsongeschiktheidswet en de
      [Wet op de arbeidsongeschiktheidsverzekering][ref1], zoals dat tot wet wordt verheven;


      [ref1]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002524
  - number: 1.1.h
    text: |-
      Wijzigingswet ABW: het bij koninklijke boodschap van 17 oktober 1985 (kamerstukken II, 1985-1986, 19 259)
      ingediende voorstel van wet tot wijziging van de Algemene Bijstandswet met betrekking tot de gelijke behandeling
      van mannen en vrouwen en gelijkstelling van niet gehuwde personen met gehuwden, zoals dat tot wet wordt verheven;
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel1
  - number: 1.1.i
    text: |-
      Wijzigingswet AOW: het bij koninklijke boodschap van 17 oktober 1985 (kamerstukken II, 1985-1986, 19 258)
      ingediende voorstel van wet tot wijziging van de [Algemene Ouderdomswet][ref1] (gelijkstelling niet-gehuwde
      personen met gehuwden of echtgenoten), zoals dat tot wet wordt verheven;


      [ref1]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002221
  - number: 1.1.j
    text: |-
      Uitvoeringsinstituut werknemersverzekeringen: het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '5'
  - number: 1.1.k
    text: 'gemeentebestuur: burgemeester en wethouders.'
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel1
  - number: '1.2'
    text: 'Voor de toepassing van deze wet en van de tot haar uitvoering genomen besluiten wordt gelijkgesteld met:'
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel1
  - number: 1.2.a
    text: 'echtgenoot: geregistreerde partner;'
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel1
  - number: 1.2.b
    text: 'gehuwd: als partner geregistreerd.'
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel1
  - number: '2.1'
    text: |-
      De [Werkloosheidswet][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '2.2'
    text: |-
      De [Werkloosheidswet][ref1] en de daarop berustende bepalingen blijven van toepassing op de rechten, bevoegdheden
      en verplichtingen over tijdvakken gelegen voor de dag waarop de nieuwe [Werkloosheidswet][ref2] in werking treedt,
      voor zover in deze wet of de daarop berustende bepalingen niet anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0004045
  - number: '3.1'
    text: |-
      Vanaf de dag waarop de nieuwe [Werkloosheidswet][ref1] in werking treedt ontstaat geen nieuw recht op uitkering op
      grond van de [Wet Werkloosheidsvoorziening][ref2] als bedoeld in de [artikelen 9, eerste lid][ref3], [10][ref4],
      en [hoofdstuk III][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0002470
      [ref3]: https://wetten.overheid.nl/BWBR0002470#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0002470#Artikel10
      [ref5]: https://wetten.overheid.nl/BWBR0002470#HoofdstukIIIa
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0002470
      - id: ref3
        bwb_id: BWBR0002470
        artikel: '9'
      - id: ref4
        bwb_id: BWBR0002470
        artikel: '10'
      - id: ref5
        bwb_id: BWBR0002470
        hoofdstuk: IIIa
  - number: '3.2'
    text: |-
      Aanvragen om uitkering op grond van de Wet Werkloosheidsvoorziening terzake van rechten, ontstaan vóór
      de in het eerste lid bedoelde dag, kunnen slechts leiden tot toekenning van uitkering op grond van de
      [Wet Werkloosheidsvoorziening][ref1] als bedoeld in de [artikelen 9, eerste lid][ref2], [10][ref3], en
      [hoofdstuk III][ref4], indien deze aanvragen zijn ingediend vóór de eerste dag van de zevende maand na de
      inwerkingtreding van de wet waarmee dit lid werd toegevoegd aan deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002470
      [ref2]: https://wetten.overheid.nl/BWBR0002470#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0002470#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0002470#HoofdstukIIIa
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002470
      - id: ref2
        bwb_id: BWBR0002470
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0002470
        artikel: '10'
      - id: ref4
        bwb_id: BWBR0002470
        hoofdstuk: IIIa
  - number: '4.1'
    text: |-
      De [Werkloosheidswet][ref1] en de daarop berustende bepalingen blijven van toepassing ten aanzien van de persoon
      die op de dag, voorafgaande aan die waarop de nieuwe [Werkloosheidswet][ref2] in werking treedt, recht op uitkering
      op grond van de [Werkloosheidswet][ref3] had, zo lang hij niet de maximum uitkeringsduur op grond van die wet heeft
      bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0004045
      [ref3]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0004045
      - id: ref3
        bwb_id: BWBR0004045
  - number: '4.2'
    text: |-
      Met de in het eerste lid bedoelde persoon wordt, zolang voor hem geen recht op uitkering op grond van de nieuwe
      [Werkloosheidswet][ref1] is ontstaan, gelijkgesteld, de persoon die op de dag, voorafgaande aan die waarop de
      nieuwe [Werkloosheidswet][ref2] in werking treedt, geen recht op uitkering op grond van de [Werkloosheidswet][ref3]
      had, omdat:


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0004045
      [ref3]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0004045
      - id: ref3
        bwb_id: BWBR0004045
  - number: 4.2.a
    text: |-
      het recht op uitkering op grond van die wet was onderbroken door werkaanvaarding of omdat
      [artikel 31, eerste en tweede lid][ref1], zo nodig in verbinding met artikel 39 van die wet op hem van toepassing
      was;


      [ref1]: https://wetten.overheid.nl/BWBR0004046#Artikel31
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004046
        artikel: '31'
        hoofdstuk: II
        afdeling: X
  - number: 4.2.b
    text: |-
      na het intreden van zijn werkloosheid zijn werkgever tijdens het voortbestaan van de dienstbetrekking het loon
      onverminderd doorbetaalde;
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel4
  - number: '4.3'
    text: |-
      De [Werkloosheidswet][ref1] blijft van toepassing ten aanzien van de persoon:


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: 4.3.a
    text: |-
      wiens werkgever op de dag, voorafgaande aan die waarop de nieuwe [Werkloosheidswet][ref1] in werking treedt,
      in staat van faillissement was verklaard, surséance van betaling was verleend of in een toestand verkeerde als
      bedoeld in [artikel 42](onbekend) en die in verband daarmee recht had op een betaling op grond van [hoofdstuk III]
      (onbekend) van laatstgenoemde wet;


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: 4.3.b
    text: |-
      die op de dag, voorafgaand aan die waarop de nieuwe [Werkloosheidswet][ref1] in werking treedt, recht had op
      loonsuppletie op grond van [hoofdstuk III](onbekend);


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '4.4'
    text: |-
      Zolang de [Werkloosheidswet][ref1] op hem van toepassing blijft, wordt de uitkering van de in het eerste of
      tweede lid bedoelde persoon, wiens uitkering niet is berekend naar het minimumdagloon, bedoeld in [artikel 12]
      (onbekend), voor de toepassing van de [Toeslagenwet][ref2] beschouwd als uitkering op grond van de nieuwe
      [Werkloosheidswet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0004043
      [ref3]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0004043
      - id: ref3
        bwb_id: BWBR0004045
  - number: '4.5'
    text: |-
      In afwijking van het eerste lid is [artikel 26 van de Werkloosheidswet][ref1] niet van toepassing op de uitkering
      van de in het eerste, het tweede of het derde lid bedoelde persoon. In dat geval wordt deze persoon voor de
      toepassing van de [Ziektewet][ref2] (*Stb.* 1967, 473) en de Wet op de arbeidsongeschiktheidsverzekering (*Stb.*
      1977, 492) als werknemer in de zin van de nieuwe [Werkloosheidswet][ref3] beschouwd, wordt het Uitvoeringsinstituut
      werknemersverzekeringen als werkgever beschouwd en wordt deze uitkering voor de toepassing van [artikel 3][ref4]
      (*Stb.* 1966, 64) als uitkering op grond van de nieuwe [Werkloosheidswet][ref5] aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0001888
      [ref3]: https://wetten.overheid.nl/BWBR0004045
      [ref4]: https://wetten.overheid.nl/BWBR0002126#Artikel3a
      [ref5]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '26'
      - id: ref2
        bwb_id: BWBR0001888
      - id: ref3
        bwb_id: BWBR0004045
      - id: ref4
        bwb_id: BWBR0002126
        artikel: 3a
      - id: ref5
        bwb_id: BWBR0004045
  - number: '4.6'
    text: |-
      In aansluiting op het eindigen van het recht op uitkering, bedoeld in het eerste lid, heeft de in het eerste of
      tweede lid bedoelde persoon recht op uitkering op grond van de nieuwe [Werkloosheidswet][ref1], tenzij die wet of
      deze wet dat verhindert.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '5.1'
    text: |-
      De [Wet Werkloosheidsvoorziening][ref1] en de daarop berustende bepalingen blijven van toepassing ten aanzien van
      de persoon die op de dag, voorafgaande aan die waarop de nieuwe [Werkloosheidswet][ref2] in werking treedt, recht
      had op uitkering op grond van de Wet Werkloosheidsvoorziening, zolang geen recht op uitkering op grond van de
      nieuwe [Werkloosheidswet][ref3] is ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002470
      [ref2]: https://wetten.overheid.nl/BWBR0004045
      [ref3]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002470
      - id: ref2
        bwb_id: BWBR0004045
      - id: ref3
        bwb_id: BWBR0004045
  - number: '5.2'
    text: |-
      Met de in het eerste lid bedoelde persoon wordt gelijkgesteld, de persoon die op de dag, voorafgaande aan
      die waarop de nieuwe [Werkloosheidswet][ref1] in werking treedt, geen recht op uitkering op grond van de
      [Wet Werkloosheidsvoorziening][ref2] had, omdat:


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0002470
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0002470
  - number: 5.2.a
    text: |-
      het recht op uitkering op grond van die wet was onderbroken door werkaanvaarding of door een omstandigheid als
      bedoeld in [artikel 13, eerste lid][ref1], of [artikel 14, eerste lid, van die wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002470#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0002470#Artikel14
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002470
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0002470
        artikel: '14'
  - number: 5.2.b
    text: |-
      na het intreden van zijn werkloosheid zijn werkgever tijdens het voortbestaan van de dienstbetrekking het loon
      onverminderd doorbetaalde;
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel5
  - number: '5.3'
    text: |-
      In afwijking van het eerste en het tweede lid zijn de Wet Werkloosheidsvoorziening en de daarop berustende
      bepalingen niet meer op de in die leden bedoelde personen van toepassing, indien in de periode gelegen twee jaar
      na de dag waarop de nieuwe [Werkloosheidswet][ref1] in werking is getreden geen recht op uitkering bestaat, omdat
      dat recht is onderbroken door een omstandigheid als bedoeld in [artikel 13, eerste lid, onderdeel ][ref2], of
      [artikel 14, eerste lid, van de Wet Werkloosheidsvoorziening][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0002470#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0002470#Artikel14
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0002470
        artikel: '13'
      - id: ref3
        bwb_id: BWBR0002470
        artikel: '14'
  - number: '5.4'
    text: |-
      De persoon die in de periode gelegen twee jaar na de dag, bedoeld in het derde lid, geen recht op uitkering op
      grond van de [Wet Werkloosheidsvoorziening][ref1] heeft, omdat dat recht is onderbroken door een omstandigheid als
      bedoeld in [artikel 13, eerste lid, onderdeel ][ref2], heeft na afloop van die onderbreking recht op uitkering op
      grond van de nieuwe [Werkloosheidswet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002470
      [ref2]: https://wetten.overheid.nl/BWBR0002470#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002470
      - id: ref2
        bwb_id: BWBR0002470
        artikel: '13'
      - id: ref3
        bwb_id: BWBR0004045
  - number: '5.5'
    text: |-
      Het eerste en tweede lid gelden niet, indien ten aanzien van de in die leden bedoelde persoon tevens
      [artikel 4][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0004046#Artikel4
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004046
        artikel: '4'
        hoofdstuk: II
        afdeling: I
  - number: '6.1'
    text: |-
      In afwijking van de [artikelen 4, eerste lid][ref1], en [5, eerste lid][ref2], is ten aanzien van de persoon
      die op de eerste dag van werkloosheid 57,5 jaar of ouder was en op de dag, voorafgaande aan die waarop de nieuwe
      [Werkloosheidswet][ref3] in werking treedt, recht had op uitkering op grond van de [Werkloosheidswet][ref4] of de
      [Wet Werkloosheidsvoorziening][ref5], de nieuwe [Werkloosheidswet][ref6] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004046#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0004046#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0004045
      [ref4]: https://wetten.overheid.nl/BWBR0004045
      [ref5]: https://wetten.overheid.nl/BWBR0002470
      [ref6]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004046
        artikel: '4'
        hoofdstuk: II
        afdeling: I
      - id: ref2
        bwb_id: BWBR0004046
        artikel: '5'
        hoofdstuk: II
        afdeling: I
      - id: ref3
        bwb_id: BWBR0004045
      - id: ref4
        bwb_id: BWBR0004045
      - id: ref5
        bwb_id: BWBR0002470
      - id: ref6
        bwb_id: BWBR0004045
  - number: '6.2'
    text: |-
      [Artikel 4, tweede lid][ref1], en [artikel 5, tweede lid][ref2], zijn van overeenkomstige toepassing met betrekking
      tot het eerste lid, met dien verstande dat voor de persoon op wie [artikel 4, tweede lid, onderdeel ][ref3], of
      [artikel 5, tweede lid, onderdeel ][ref4], van toepassing is, als eerste dag van werkloosheid wordt beschouwd
      de eerste dag dat hij recht op uitkering op grond van de [Werkloosheidswet][ref5] of vanaf het bereiken van de
      leeftijd van 58 jaar op grond van de [Wet Werkloosheidsvoorziening][ref6] zou hebben gehad.


      [ref1]: https://wetten.overheid.nl/BWBR0004046#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0004046#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0004046#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0004046#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0004045
      [ref6]: https://wetten.overheid.nl/BWBR0002470
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004046
        artikel: '4'
        hoofdstuk: II
        afdeling: I
      - id: ref2
        bwb_id: BWBR0004046
        artikel: '5'
        hoofdstuk: II
        afdeling: I
      - id: ref3
        bwb_id: BWBR0004046
        artikel: '4'
        hoofdstuk: II
        afdeling: I
      - id: ref4
        bwb_id: BWBR0004046
        artikel: '5'
        hoofdstuk: II
        afdeling: I
      - id: ref5
        bwb_id: BWBR0004045
      - id: ref6
        bwb_id: BWBR0002470
  - number: '6.3'
    text: |-
      De arbeidsverhouding van de persoon, bedoeld in het eerste en tweede lid, aan wie door het Rijk ter zake van
      zijn arbeidsverhouding invaliditeitspensioen is verzekerd, wordt als dienstbetrekking in de zin van de nieuwe
      [Werkloosheidswet][ref1] beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '7.1'
    text: |-
      De persoon die op de dag, voorafgaande aan die waarop de nieuwe [Werkloosheidswet][ref1]
      in werking treedt, recht had op uitkering op grond van de [Werkloosheidswet][ref2] of
      [hoofdstuk III van de Wet Werkloosheidsvoorziening][ref3] en op de eerste dag van werkloosheid 47,5
      jaar of ouder is, heeft na afloop van de uitkeringsduur, bedoeld in [artikel 17][ref4] of bedoeld in
      de [Wet Werkloosheidsvoorziening][ref5], recht op uitkering op grond van de Wet inkomensvoorziening
      oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers, tenzij dat anders dan op grond van
      [artikel 2, eerste lid, onderdeel ][ref6], van laatstgenoemde wet wordt verhinderd.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0004045
      [ref3]: https://wetten.overheid.nl/BWBR0002470#HoofdstukIII
      [ref4]: https://wetten.overheid.nl/BWBR0004046#Artikel17
      [ref5]: https://wetten.overheid.nl/BWBR0002470
      [ref6]: https://wetten.overheid.nl/BWBR0002470#Artikel2
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0004045
      - id: ref3
        bwb_id: BWBR0002470
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0004046
        artikel: '17'
        hoofdstuk: II
        afdeling: VI
      - id: ref5
        bwb_id: BWBR0002470
      - id: ref6
        bwb_id: BWBR0002470
        artikel: '2'
  - number: '7.2'
    text: |-
      De persoon die op de dag, voorafgaande aan die waarop de nieuwe [Werkloosheidswet][ref1] in werking treedt,
      recht had op uitkering op grond van [hoofdstuk III](onbekend), heeft met ingang van de dag waarop de nieuwe
      [Werkloosheidswet][ref2] in werking treedt recht op uitkering op grond van de Wet inkomensvoorziening
      oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers, tenzij dat anders dan op grond van
      [artikel 2, eerste lid, onderdeel ][ref3], van laatstgenoemde wet wordt verhinderd.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0004045
      [ref3]: https://wetten.overheid.nl/BWBR0002470#Artikel2
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0004045
      - id: ref3
        bwb_id: BWBR0002470
        artikel: '2'
  - number: '7.3'
    text: |-
      [Artikel 4, tweede lid][ref1], en [artikel 5, tweede lid][ref2], zijn van overeenkomstige toepassing met betrekking
      tot het eerste lid, met dien verstande dat voor de persoon op wie [artikel 4, tweede lid, onderdeel ][ref3], of
      [artikel 5, tweede lid, onderdeel ][ref4], van toepassing is, als eerste dag van werkloosheid wordt beschouwd
      de eerste dag dat hij recht op uitkering op grond van de [Werkloosheidswet][ref5] of vanaf het bereiken van de
      leeftijd van 48 jaar op grond van [Hoofdstuk III van de Wet Werkloosheidsvoorziening][ref6] zou hebben gehad.


      [ref1]: https://wetten.overheid.nl/BWBR0004046#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0004046#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0004046#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0004046#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0004045
      [ref6]: https://wetten.overheid.nl/BWBR0002470#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004046
        artikel: '4'
        hoofdstuk: II
        afdeling: I
      - id: ref2
        bwb_id: BWBR0004046
        artikel: '5'
        hoofdstuk: II
        afdeling: I
      - id: ref3
        bwb_id: BWBR0004046
        artikel: '4'
        hoofdstuk: II
        afdeling: I
      - id: ref4
        bwb_id: BWBR0004046
        artikel: '5'
        hoofdstuk: II
        afdeling: I
      - id: ref5
        bwb_id: BWBR0004045
      - id: ref6
        bwb_id: BWBR0002470
        hoofdstuk: III
  - number: '7.4'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op de persoon, bedoeld in het tweede lid, die op de dag,
      voorafgaande aan die waarop de nieuwe [Werkloosheidswet][ref1] in werking treedt, geen recht had op een uitkering
      op grond van [hoofdstuk III](onbekend), omdat dat recht is onderbroken door werkaanvaarding of een omstandigheid
      als bedoeld in [artikel 5, tweede lid][ref2], doch die na afloop van die onderbreking recht zou hebben gehad op
      deze uitkering, indien dat hoofdstuk niet zou zijn vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0004046#Artikel5
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0004046
        artikel: '5'
        hoofdstuk: II
        afdeling: I
  - number: '8'
    text: |-
      Ter zake van werkloosheid ontstaan voor de dag waarop de nieuwe [Werkloosheidswet][ref1] in werking treedt en in
      verband met die werkloosheid de [artikelen 4 tot en met 7][ref2] niet van toepassing zijn, ontstaat geen recht op
      uitkering op grond van de nieuwe [Werkloosheidswet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0004046#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0004046
        artikel: '4'
        hoofdstuk: II
        afdeling: I
      - id: ref3
        bwb_id: BWBR0004045
  - number: '9'
    text: Onze Minister is bevoegd met betrekking tot deze afdeling nadere en zo nodig afwijkende regels te stellen.
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel9
  - number: '10.1'
    text: |-
      Tot het tijdstip, aangewezen op grond van [artikel 7, eerste lid, van de nieuwe Werkloosheidswet][ref1]
      kunnen ten aanzien van degene die overheidswerknemer is, in de zin van
      [artikel 1, onderdeel l, onder 1, van de Wet overheidspersoneel onder de werknemersverzekeringen][ref2],
      uit hoofde van zijn arbeidsverhouding tot de Stichting Pensioenfonds ABP of een lichaam als bedoeld in
      [artikel 2 van de Wet privatisering ABP][ref3], niet zijnde het Rijk, een provincie, gemeente, waterschap,
      veenschap of veenpolder, bij algemene maatregel van bestuur voorschriften worden gegeven omtrent zijn ten laste van
      die stichting of dat lichaam komende aanspraken bij werkloosheid.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0009267#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0007791#Artikel2
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0009267
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0007791
        artikel: '2'
  - number: '10.2'
    text: |-
      Het eerste lid is niet van toepassing op degene, die overheidswerknemer is uit hoofde van zijn arbeidsverhouding
      tot een lichaam als bedoeld in [artikel 2, onderdelen b tot en met e, van de Wet privatisering ABP](onbekend), mits
      zodanig lichaam krachtens subsidievoorwaarden voorschriften als bedoeld in het eerste lid toepast.
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel10
  - number: '10.3'
    text: |-
      Bij de in het eerste lid bedoelde algemene maatregel van bestuur kunnen voorschriften worden gegeven omtrent
      aanspraken bij werkloosheid ten laste van een lichaam als bedoeld in dat lid van degene, die op de dag,
      voorafgaande aan die waarop de nieuwe [Werkloosheidswet][ref1] in werking treedt, een aanspraak op uitkering
      ontleent aan de algemene maatregel van bestuur op grond van [artikel 6, derde lid, van de Werkloosheidswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel6
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '6'
  - number: '11'
    text: |-
      De personen, bedoeld in de [artikelen 4][ref1] en [6][ref2], worden geacht te voldoen aan de voorwaarde, bedoeld
      in [artikel 17 van de nieuwe Werkloosheidswet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004046#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0004046#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel17
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0004046
        artikel: '4'
        hoofdstuk: II
        afdeling: I
      - id: ref2
        bwb_id: BWBR0004046
        artikel: '6'
        hoofdstuk: II
        afdeling: I
      - id: ref3
        bwb_id: BWBR0004045
        artikel: '17'
  - number: '12.1'
    text: |-
      De persoon die op de dag, onmiddellijk voorafgaande aan het intreden van zijn werkloosheid, werknemer
      in de zin van de nieuwe [Werkloosheidswet][ref1] was en die in de periode van 12 maanden, bedoeld in
      [artikel 17 van die wet][ref2], in weken, gelegen vóór de dag, waarop die wet in werking treedt, arbeid heeft
      verricht als werknemer in de zin van de [Werkloosheidswet][ref3] of de Wet Werkloosheidsvoorziening, dan wel zijn
      militaire dienstplicht of in plaats daarvan vervangende dienst heeft vervuld, wordt met betrekking tot de weken
      waarin hij deze arbeid heeft verricht beschouwd als werknemer in de zin van de nieuwe [Werkloosheidswet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0004045
      [ref4]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '17'
      - id: ref3
        bwb_id: BWBR0004045
      - id: ref4
        bwb_id: BWBR0004045
  - number: '12.2'
    text: |-
      De persoon die op de dag, onmiddellijk voorafgaande aan het intreden van zijn werkloosheid, werknemer
      in de zin van de nieuwe [Werkloosheidswet][ref1] was en die in de periode van 39 weken, bedoeld in
      [artikel 17 van die wet][ref2], in weken vanaf de dag waarop die wet in werking treedt, arbeid heeft verricht
      in een arbeidsverhouding ter zake waarvan hem door het Rijk invaliditeitspensioen is verzekerd, wordt met
      betrekking tot de weken waarin hij deze arbeid heeft verricht beschouwd als werknemer in de zin van de nieuwe
      [Werkloosheidswet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '17'
      - id: ref3
        bwb_id: BWBR0004045
  - number: '12.3'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op de persoon die op de dag onmiddellijk voorafgaande aan het
      intreden van zijn werkloosheid werknemer in de zin van de [Werkloosheidswet][ref1] was en wiens werkloosheid begint
      op de dag waarop de nieuwe [Werkloosheidswet][ref2] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0004045
  - number: '12.4'
    text: |-
      [Artikel 17][ref1] is van overeenkomstige toepassing met betrekking tot het eerste, tweede en derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel17a
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 17a
  - number: '12.5'
    text: |-
      Ten aanzien van de persoon die op de dag, voorafgaande aan die waarop de nieuwe [Werkloosheidswet][ref1] in werking
      treedt, recht had op een arbeidsongeschiktheidsuitkering als bedoeld in [artikel 51][ref2] en die op het tijdstip
      waarop de arbeidsongeschiktheid intrad werknemer was in de zin van de [Werkloosheidswet][ref3], zijn het eerste en
      het vierde lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0004046#Artikel51
      [ref3]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0004046
        artikel: '51'
        hoofdstuk: III
        afdeling: III
      - id: ref3
        bwb_id: BWBR0004045
  - number: '12.6'
    text: Onze Minister is bevoegd met betrekking tot dit artikel nadere en zo nodig afwijkende regels te stellen.
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel12
  - number: '13'
    text: |-
      In afwijking van artikel 22 van de nieuwe [Werkloosheidswet][ref1] stelt het Uitvoeringsinstituut
      werknemersverzekeringen ambtshalve vast of de persoon, bedoeld in [artikel 4][ref2], wiens recht op uitkering
      is geëindigd wegens het bereiken van de maximumuitkeringsduur op grond van de [Werkloosheidswet][ref3] of
      [artikel 4][ref4], en de persoon, bedoeld in [artikel 6][ref5], recht op uitkering op grond van de nieuwe
      [Werkloosheidswet][ref6] hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0004046#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0004045
      [ref4]: https://wetten.overheid.nl/BWBR0004046#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0004046#Artikel6
      [ref6]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0004046
