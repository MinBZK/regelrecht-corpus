  - number: '23'
    text: |-
      In afwijking van de op grond van artikel 12a van de Werkloosheidswet en artikel 5a van de Wet
      Werkloosheidsvoorziening gestelde regels wordt het dagloon, bedoeld in artikel 22, herzien overeenkomstig artikel
      46 van de nieuwe Werkloosheidswet.
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel23
  - number: '24.1'
    text: |-
      De persoon die 21 jaar of ouder is, die voor de toepassing van de [Toeslagenwet][ref1]
      niet als gehuwd wordt aangemerkt en voor wie de algemene heffingskorting, bedoeld in
      [artikel 22 van de Wet op de loonbelasting 1964][ref2], maar niet de alleenstaande-ouderkorting, bedoeld
      in [artikel 8.15 van de Wet inkomstenbelasting 2001][ref3], van toepassing is en die recht heeft op
      uitkering op grond van de [Werkloosheidswet][ref4] of de nieuwe [Werkloosheidswet][ref5] die bij de aanvang
      van de werkloosheid is berekend naar een dagloon dat ten minste gelijk is aan 70% van het minimumloon,
      bedoeld in [artikel 14, tweede lid, van de nieuwe Werkloosheidswet][ref6], heeft recht op een verhoging
      van zijn uitkering op grond van de [Werkloosheidswet][ref7] of bedoeld in [hoofdstuk II][ref8] of
      [IIb van de nieuwe Werkloosheidswet][ref9], indien die uitkering per dag, indien hij 21 jaar, 22 jaar
      onderscheidenlijk 23 jaar of ouder is, minder bedraagt dan f 47,96, f 55,77 onderscheidenlijk f 65,50.


      [ref1]: https://wetten.overheid.nl/BWBR0004043
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0004045
      [ref5]: https://wetten.overheid.nl/BWBR0004045
      [ref6]: https://wetten.overheid.nl/BWBR0004045#Artikel14
      [ref7]: https://wetten.overheid.nl/BWBR0004045
      [ref8]: https://wetten.overheid.nl/BWBR0004045#HoofdstukIIa
      [ref9]: https://wetten.overheid.nl/BWBR0004045#HoofdstukIIb
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel24
    references:
      - id: ref1
