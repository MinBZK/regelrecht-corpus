        artikel: '14'
      - id: ref5
        bwb_id: BWBR0004045
  - number: '15'
    text: |-
      De [artikelen 36][ref1] en [37 van de nieuwe Werkloosheidswet][ref2] zijn van overeenkomstige toepassing op de
      uitkering op grond van de [Werkloosheidswet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '36'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '37'
      - id: ref3
        bwb_id: BWBR0004045
  - number: '16'
    text: |-
      Indien aan een werknemer als bedoeld in [artikel 5][ref1] of [6][ref2], uitkering op grond van de
      [Wet Werkloosheidsvoorziening][ref3] is toegekend over een periode, waarover recht op uitkering op grond van de
      nieuwe [Werkloosheidswet][ref4] bestaat, is het Uitvoeringsinstituut werknemersverzekeringen bevoegd de uitkering
      over die periode tot ten hoogste het bedrag van die toegekende uitkering, zonder machtiging van de werknemer, te
      betalen aan het betrokken gemeentebestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0004046#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0004046#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0002470
      [ref4]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004046
        artikel: '5'
        hoofdstuk: II
        afdeling: I
      - id: ref2
        bwb_id: BWBR0004046
        artikel: '6'
        hoofdstuk: II
        afdeling: I
      - id: ref3
        bwb_id: BWBR0002470
      - id: ref4
        bwb_id: BWBR0004045
  - number: '17.1'
    text: |-
      In afwijking van [artikel 42, eerste en tweede lid][ref1], en [artikel 49 van de nieuwe Werkloosheidswet][ref2] is
      de uitkeringsduur voor de persoon, bedoeld in [artikel 4][ref3] en [artikel 5, vierde lid][ref4], die op de eerste
      dag van de werkloosheid:


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel49
      [ref3]: https://wetten.overheid.nl/BWBR0004046#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0004046#Artikel5
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '42'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '49'
      - id: ref3
        bwb_id: BWBR0004046
        artikel: '4'
        hoofdstuk: II
        afdeling: I
      - id: ref4
        bwb_id: BWBR0004046
        artikel: '5'
        hoofdstuk: II
        afdeling: I
  - number: 17.1.a
    text: |-
      jonger is dan 22,5 jaar, indien hij aantoont in de periode van drie jaar aan het intreden van zijn werkloosheid
      onmiddellijk voorafgaande, ten minste gedurende twee en een half jaar als werknemer in de zin van de
      [Werkloosheidswet][ref1] of de [Wet Werkloosheidsvoorziening][ref2] in een dienstbetrekking van 8 of meer uren per
      week te hebben gestaan: een half jaar;


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0002470
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0002470
  - number: 17.1.b
    text: '22,5 jaar of ouder is, doch jonger dan 29,5 jaar: één jaar;'
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel17
  - number: 17.1.c
    text: '29,5 jaar of ouder is, doch jonger dan 34,5 jaar: anderhalf jaar;'
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel17
  - number: 17.1.d
    text: '34,5 jaar of ouder is, doch jonger dan 57,5 jaar: twee jaar.'
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel17
  - number: '17.2'
    text: |-
      Voor de werknemer, bedoeld in het eerste lid, onderdeel *a*, *b* en *c*, wordt de uitkeringsduur verlengd met een
      half jaar, indien hij aantoont in de periode van vijf jaar aan het intreden van zijn werkloosheid onmiddellijk
      voorafgaande, ten minste gedurende drie jaar als werknemer in de zin van de [Werkloosheidswet][ref1] of de
      [Wet Werkloosheidsvoorziening][ref2] in een dienstbetrekking van 8 of meer uren per week te hebben gestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0002470
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0002470
  - number: '17.3'
    text: |-
      Perioden waarin de persoon, bedoeld in [artikel 4][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0004046#Artikel4
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0004046
        artikel: '4'
        hoofdstuk: II
        afdeling: I
  - number: 17.3.a
    text: |-
      voor de dag, waarop de nieuwe [Werkloosheidswet][ref1] in werking treedt ter zake van een geëindigde
      dienstbetrekking van 8 of meer uren per week recht had op een arbeidsongeschiktheidsuitkering op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref2] berekend naar een arbeidsongeschiktheid van 80% of meer;


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0002524
  - number: 17.3.b
    text: |-
      voor of vanaf de dag, waarop de nieuwe [Werkloosheidswet][ref1] in werking treedt ter zake van een geëindigde
      dienstbetrekking van 8 of meer uren per week op grond waarvan hem door het Rijk invaliditeitspensioen was
      verzekerd, recht had op een arbeidsongeschiktheidsuitkering berekend naar een arbeidsongeschiktheid van 80% of
      meer;


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: 17.3.c
    text: |-
      voor de dag, waarop de nieuwe [Werkloosheidswet][ref1] in werking treedt, recht had op een
      arbeidsongeschiktheidsuitkering op grond van hoofdstuk III van de Wet arbeidsongeschiktheidsvoorziening militairen
      berekend naar een arbeidsongeschiktheid van 80% of meer;


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: 17.3.d
    text: |-
      voor de dag, waarop de nieuwe [Werkloosheidswet][ref1] in werking treedt, ter zake van een geëindigde
      dienstbetrekking van 8 of meer uren per week recht had op een uitkering op grond van de [Ziektewet][ref2] over de
      maximale duur, bedoeld in [artikel 29, tweede lid, van die wet][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0001888
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel29
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0001888
      - id: ref3
        bwb_id: BWBR0001888
        artikel: '29'
  - number: 17.3.e
    text: |-
      anders dan genoemd in onderdeel *a* tot en met *d*, voor of vanaf de dag, waarop de nieuwe [Werkloosheidswet][ref1]
      in werking treedt, recht had op een uitkering, die naar aard en strekking overeenkomt met een uitkering als bedoeld
      in onderdeel *a* of *d*;


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '17.4'
    text: |-
      Tijdens de duur op grond van dit artikel is [artikel 34, vierde en vijfde lid, van de nieuwe Werkloosheidswet][ref1]
      niet van toepassing. Tevens worden, in afwijking van [artikel 34, zesde lid, van de nieuwe Werkloosheidswet][ref2],
      tijdens de duur op grond van dit artikel, inkomsten uit ouderdomspensioen niet op de uitkering in mindering
      gebracht, voor zover zij door de werknemer reeds vóór het intreden van zijn werkloosheid werden genoten naast de
      inkomsten uit het beroep, waaruit hij werkloos is.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel34
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '34'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '34'
  - number: '17.5'
    text: |-
      [Artikel 42, vierde tot en met negende lid, van de nieuwe Werkloosheidswet][ref1] is van overeenkomstige toepassing
      met betrekking tot de periode van twee en een half jaar, bedoeld in het eerste lid, en de periode van drie jaar,
      bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel42
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '42'
  - number: '17.6'
    text: |-
      De [artikelen 43][ref1] en [76 van de nieuwe Werkloosheidswet][ref2] zijn van overeenkomstige toepassing met
      betrekking tot de uitkeringsduur, bedoeld in het eerste en het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel76
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '43'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '76'
  - number: '18'
    text: |-
      Indien het recht op uitkering op grond van de [Werkloosheidswet][ref1] van de persoon, bedoeld in
      [artikel 4, eerste en tweede lid][ref2], door het verrichten van arbeid als werknemer is geëindigd en vervolgens
      na beëindiging van die arbeid op een tijdstip, gelegen binnen vijf jaar na inwerkingtreding van de nieuwe
      [Werkloosheidswet][ref3], recht op uitkering is ontstaan op grond van de nieuwe [Werkloosheidswet][ref4],
      zonder dat aan de voorwaarde, bedoeld in [artikel 42, tweede lid, onderdeel ][ref5] wordt voldaan,
      wordt de duur van die uitkering voor zover de werknemer ter zake van het eerstbedoelde recht aan de in
      [artikel 17, eerste en tweede lid][ref6], genoemde voorwaarden voldeed, verlengd met de duur, bedoeld in die leden.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0004046#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0004045
      [ref4]: https://wetten.overheid.nl/BWBR0004045
      [ref5]: https://wetten.overheid.nl/BWBR0004045#Artikel42
      [ref6]: https://wetten.overheid.nl/BWBR0004046#Artikel17
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0004046
        artikel: '4'
        hoofdstuk: II
        afdeling: I
      - id: ref3
        bwb_id: BWBR0004045
      - id: ref4
        bwb_id: BWBR0004045
      - id: ref5
        bwb_id: BWBR0004045
        artikel: '42'
      - id: ref6
        bwb_id: BWBR0004046
        artikel: '17'
        hoofdstuk: II
        afdeling: VI
  - number: '19'
    text: |-
      Indien het recht op uitkering op grond van de Wet Werkloosheidsvoorziening van de persoon, bedoeld in
      [artikel 5, eerste en tweede lid][ref1], door het verrichten van arbeid als werknemer geheel of gedeeltelijk
      is geëindigd en vervolgens na beëindiging van die arbeid op een tijdstip, gelegen binnen vijf jaar na
      inwerkingtreding van de nieuwe [Werkloosheidswet][ref2], recht op uitkering is ontstaan op grond van de nieuwe
      [Werkloosheidswet][ref3], zonder dat aan de voorwaarde, bedoeld in [artikel 42, tweede lid, onderdeel ][ref4]
      wordt voldaan, wordt de duur van die uitkering verlengd met de duur van de uitkering op grond van de
      [Wet Werkloosheidsvoorziening][ref5], die de werknemer als gevolg van de eindiging van het recht op uitkering op
      grond van de [Wet Werkloosheidsvoorziening][ref6] niet heeft ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0004046#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0004045
      [ref3]: https://wetten.overheid.nl/BWBR0004045
      [ref4]: https://wetten.overheid.nl/BWBR0004045#Artikel42
      [ref5]: https://wetten.overheid.nl/BWBR0002470
      [ref6]: https://wetten.overheid.nl/BWBR0002470
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0004046
        artikel: '5'
        hoofdstuk: II
        afdeling: I
      - id: ref2
        bwb_id: BWBR0004045
      - id: ref3
        bwb_id: BWBR0004045
      - id: ref4
        bwb_id: BWBR0004045
        artikel: '42'
      - id: ref5
        bwb_id: BWBR0002470
      - id: ref6
        bwb_id: BWBR0002470
  - number: '20'
    text: |-
      In afwijking van [artikel 42, eerste en tweede lid][ref1], en [artikel 49 van de nieuwe Werkloosheidswet][ref2],
      eindigt de uitkeringsduur voor de persoon, bedoeld in [artikel 6][ref3], op de eerste dag van de maand waarin hij
      de leeftijd van 65 jaar bereikt. Het [vierde lid van artikel 17][ref4] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel49
      [ref3]: https://wetten.overheid.nl/BWBR0004046#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0004046#Artikel17
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '42'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '49'
      - id: ref3
        bwb_id: BWBR0004046
        artikel: '6'
        hoofdstuk: II
        afdeling: I
      - id: ref4
        bwb_id: BWBR0004046
        artikel: '17'
        hoofdstuk: II
        afdeling: VI
  - number: '21.1'
    text: |-
      De persoon die op de dag, onmiddellijk voorafgaande aan het intreden van zijn werkloosheid, werknemer in de zin
      van de nieuwe [Werkloosheidswet][ref1] was, wordt voor de toepassing van de [artikelen 17 , onderdeel ][ref2], en
      [17][ref3] als werknemer in de zin van die wet beschouwd gedurende de periode waarin hij:


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel17b
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '17'
      - id: ref3
        bwb_id: BWBR0004045
        artikel: 17b
  - number: 21.1.a
    text: |-
      voor de dag, waarop de nieuwe [Werkloosheidswet][ref1] in werking treedt, als werknemer in de zin van de
      [Werkloosheidswet][ref2] of de [Wet Werkloosheidsvoorziening][ref3] in dienstbetrekking heeft gestaan dan wel zijn
      militaire dienstplicht of in plaats daarvan vervangende dienst heeft vervuld;


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0004045
      [ref3]: https://wetten.overheid.nl/BWBR0002470
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0004045
      - id: ref3
        bwb_id: BWBR0002470
  - number: 21.1.b
    text: |-
      vanaf de dag, waarop de nieuwe [Werkloosheidswet][ref1] in werking treedt, een arbeidsverhouding had ter zake
      waarvan hem door het Rijk invaliditeitspensioen was verzekerd.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '21.2'
    text: |-
      Ten aanzien van de persoon, bedoeld in [artikel 12, derde en vijfde lid, is het eerste lid, onderdeel ][ref1], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004046#Artikel12
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel21
