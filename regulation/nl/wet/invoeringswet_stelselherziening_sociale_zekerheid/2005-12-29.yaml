  - number: '22.3'
    text: |-
      Indien voor de persoon, bedoeld in de [artikelen 4][ref1], [5, vierde lid][ref2], en [6][ref3], op
      de dag voorafgaande aan die waarop de nieuwe [Werkloosheidswet][ref4] op hem van toepassing wordt, het
      minimumdagloon in aanmerking werd genomen met toepassing van [artikel 12](onbekend) of [5][ref5], wordt
      voor het recht op toeslag op grond van de [Toeslagenwet][ref6] als dagloon aangemerkt 70% van het voor deze
      persoon in aanmerking genomen minimumdagloon. In afwijking van de op grond van [artikel 12](onbekend) en
      [artikel 5][ref7] gestelde regels wordt het dagloon, bedoeld in [artikel 22][ref8], herzien overeenkomstig
      [artikel 46 van de nieuwe Werkloosheidswet][ref9].


      [ref1]: https://wetten.overheid.nl/BWBR0004046#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0004046#Artikel5
