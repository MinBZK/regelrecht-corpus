        afdeling: I
      - id: ref5
        bwb_id: BWBR0002470
        artikel: '14'
      - id: ref6
        bwb_id: BWBR0004045
        artikel: '27'
  - number: '14.2'
    text: |-
      Bij het gebruik maken van de bevoegdheid, bedoeld in
      [artikel 27, eerste en tweede lid, van de nieuwe Werkloosheidswet][ref1], kan het Uitvoeringsinstituut
      werknemersverzekeringen de uitkering niet verder weigeren en de uitkeringsduur niet verder beperken
      dan de mate waarin en de duur waarover uitsluiting of verlaging van de uitkering op grond van
      [artikel 31, eerste lid, onderdeel ][ref2], zonodig in verbinding met [artikel 39 van de Werkloosheidswet][ref3]
      of [artikel 14 van de Wet Werkloosheidsvoorziening][ref4] nog zou hebben plaatsgehad, indien de nieuwe
      [Werkloosheidswet][ref5] niet in werking was getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0004046#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel39
      [ref4]: https://wetten.overheid.nl/BWBR0002470#Artikel14
      [ref5]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '27'
      - id: ref2
        bwb_id: BWBR0004046
        artikel: '31'
        hoofdstuk: II
        afdeling: X
      - id: ref3
