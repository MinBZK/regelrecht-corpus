      - id: ref2
        bwb_id: BWBR0004046
        artikel: '17'
        hoofdstuk: II
        afdeling: VI
  - number: '21.5'
    text: Onze Minister is bevoegd met betrekking tot dit artikel nadere en zo nodig afwijkende regels te stellen.
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel21
  - number: '22.1'
    text: |-
      Ten aanzien van de persoon, bedoeld in de [artikelen 4][ref1], [5, vierde lid][ref2], en [6][ref3],
      bedraagt de uitkering per dag 70% van het dagloon dat gold op de dag, voorafgaande aan die waarop de nieuwe
      [Werkloosheidswet][ref4] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0004046#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0004046#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0004046#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0004046
        artikel: '4'
        hoofdstuk: II
        afdeling: I
      - id: ref2
        bwb_id: BWBR0004046
        artikel: '5'
        hoofdstuk: II
        afdeling: I
      - id: ref3
        bwb_id: BWBR0004046
        artikel: '6'
        hoofdstuk: II
        afdeling: I
      - id: ref4
        bwb_id: BWBR0004045
  - number: '22.2'
    text: |-
      Indien voor de persoon, bedoeld in de [artikelen 4][ref1], [5, vierde lid][ref2], en [6][ref3], op de dag
      voorafgaande aan die waarop de nieuwe [Werkloosheidswet][ref4] op hem van toepassing wordt als dagloon het
      minimumdagloon in aanmerking werd genomen, blijft, zodra de nieuwe [Werkloosheidswet][ref5] op hem van toepassing
      wordt, het minimumdagloon voor hem gelden zolang hij voldoet aan de voorwaarden zoals deze op de dag voorafgaande
      aan die waarop de nieuwe [Werkloosheidswet][ref6] in werking treedt op grond van de [Werkloosheidswet][ref7] of de
      [Wet Werkloosheidsvoorziening][ref8] en de daarop berustende bepalingen zijn gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004046#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0004046#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0004046#Artikel6
