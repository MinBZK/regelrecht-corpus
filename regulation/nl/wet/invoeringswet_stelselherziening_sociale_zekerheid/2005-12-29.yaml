  - number: '21.3'
    text: |-
      Met betrekking tot de periode voor de dag, waarop de nieuwe [Werkloosheidswet][ref1] in werking treedt, is
      [artikel 17, derde lid][ref2], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0004046#Artikel17
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel21
    references:
