  - number: '24.3'
    text: |-
      De bedragen, genoemd in het eerste lid, worden door Onze Minister herzien op dezelfde wijze en op hetzelfde
      tijdstip als waarop de bedragen genoemd in [hoofdstuk 3 van de Wet werk en bijstand][ref1] worden herzien, waarna
      de herziene bedragen voor de in het eerste lid genoemde bedragen in de plaats treden.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0015703
        hoofdstuk: '3'
  - number: '26'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen laat, op zijn verzoek, tot de vrijwillige
      werkloosheidsverzekering, bedoeld in [hoofdstuk III van de nieuwe Werkloosheidswet][ref1], toe de persoon, jonger
      dan 65 jaar, die op de dag, waarop de nieuwe [Werkloosheidswet][ref2] in werking treedt:


      [ref1]: https://wetten.overheid.nl/BWBR0004045#HoofdstukIII
      [ref2]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0004045
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004045
  - number: 26.a
    text: |-
      buiten Nederland woont en aldaar een dienstbetrekking vervult en wiens werkgever binnen Nederland woont of
      gevestigd is; of
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel26
  - number: 26.b
    text: Nederlander is en die werkzaamheden verricht in een ontwikkelingsland.
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel26
  - number: '27.1'
    text: |-
      Het verzoek om toelating tot de vrijwillige werkloosheidsverzekering op grond van [artikel 26][ref1], dient te
      worden ingediend binnen drie maanden na de dag, waarop de nieuwe [Werkloosheidswet][ref2] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0004046#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0004046
        artikel: '26'
        hoofdstuk: II
        afdeling: IX
      - id: ref2
        bwb_id: BWBR0004045
  - number: '27.2'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen is bevoegd te verklaren dat een verzoek om toelating, ingediend na
      afloop van de in het eerste lid gestelde termijn, geacht wordt tijdig te zijn ingekomen, indien de persoon die het
      verzoek heeft gedaan, redelijkerwijs niet geacht kan worden in verzuim te zijn geweest.
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel27
  - number: '28'
    text: |-
      Met inachtneming van hetgeen in de [Ziektewet][ref1] met betrekking tot de vrijwillige verzekering op grond
      van die wet overigens is bepaald, laat het Uitvoeringsinstituut werknemersverzekeringen de persoon, bedoeld in
      [artikel 26][ref2], die niet op grond van de [Ziektewet][ref3] is verzekerd, tegelijkertijd tot die verzekering
      toe.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0004046#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0004046
        artikel: '26'
        hoofdstuk: II
        afdeling: IX
      - id: ref3
        bwb_id: BWBR0001888
  - number: '29'
    text: |-
      Met betrekking tot het recht op uitkering, bedoeld in [artikel 15 van de nieuwe Werkloosheidswet][ref1] en de
      duur van de uitkering, bedoeld in de [artikelen 42][ref2] en [49 van de nieuwe Werkloosheidswet][ref3], van
      de persoon, bedoeld in [artikel 26][ref4], worden van de periode voorafgaande aan de dag, waarop de nieuwe
      [Werkloosheidswet][ref5] in werking treedt slechts in aanmerking genomen de weken waarin hij:


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel42
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel49
      [ref4]: https://wetten.overheid.nl/BWBR0004046#Artikel26
      [ref5]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '42'
      - id: ref3
        bwb_id: BWBR0004045
        artikel: '49'
      - id: ref4
        bwb_id: BWBR0004046
        artikel: '26'
        hoofdstuk: II
        afdeling: IX
      - id: ref5
        bwb_id: BWBR0004045
  - number: 29.a
    text: |-
      arbeid heeft verricht als werknemer in de zin van de [Werkloosheidswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: 29.b
    text: |-
      arbeid heeft verricht in een arbeidsverhouding ter zake waarvan hem door het Rijk invaliditeitspensioen is
      verzekerd;
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel29
  - number: 29.c
    text: zijn militaire dienstplicht of in plaats daarvan vervangende dienst heeft vervuld;
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel29
  - number: 29.d
    text: |-
      arbeid heeft verricht als werknemer in de zin van de [Wet Werkloosheidsvoorziening][ref1] en voor werkzaamheden
      buiten Nederland is uitgezonden in het kader van ontwikkelingssamenwerking, of werkzaam is voor een
      volkenrechtelijke organisatie, waarvan Nederland lid is dan wel waarvan de werkzaamheden door Nederland worden
      ondersteund.


      [ref1]: https://wetten.overheid.nl/BWBR0002470
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002470
  - number: '30'
    text: |-
      [Hoofdstuk III van de nieuwe Werkloosheidswet][ref1] is, voor zover daarvan in deze afdeling niet is afgeweken,
      van overeenkomstige toepassing met betrekking tot de vrijwillige werkloosheidsverzekering van de persoon, bedoeld
      in [artikel 26][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004045#HoofdstukIII
      [ref2]: https://wetten.overheid.nl/BWBR0004046#Artikel26
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0004045
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004046
        artikel: '26'
        hoofdstuk: II
        afdeling: IX
  - number: '31'
    text: |-
      Een wachtgeldfonds als bedoeld in[ artikel 102 van de nieuwe Werkloosheidswet][ref1] respectievelijk het Algemeen
      Werkloosheidsfonds, bedoeld in [artikel 103, van die wet][ref2] is een voortzetting van een fonds als bedoeld in
      [artikel 20, tweede lid, van de Werkloosheidswet][ref3] respectievelijk een voortzetting van het fonds, bedoeld in
      [hoofdstuk II van die wet](onbekend), in de vorm van een afzonderlijk beheerd en geadministreerd onderdeel van het
      Uitvoeringsinstituut werknemersverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel102
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel103
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel20
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '102'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '103'
      - id: ref3
        bwb_id: BWBR0004045
        artikel: '20'
  - number: '32.1'
    text: |-
      De persoon, bedoeld in [artikel 6][ref1], is verzekerd bij het Uitvoeringsinstituut werknemersverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0004046#Artikel6
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0004046
        artikel: '6'
        hoofdstuk: II
        afdeling: I
  - number: '32.2'
    text: |-
      Het gemeentebestuur waarvan de persoon, bedoeld in [artikel 6][ref1], uitkering ontvangt, meldt die persoon aan bij
      het Uitvoeringsinstituut werknemersverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0004046#Artikel6
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0004046
        artikel: '6'
        hoofdstuk: II
        afdeling: I
  - number: '34.1'
    text: |-
      Tot een nader bij algemene maatregel van bestuur te bepalen tijdstip blijft
      [artikel 45 van de nieuwe Werkloosheidswet][ref1] en hetgeen in [hoofdstuk IX van de nieuwe Werkloosheidswet][ref2]
      met betrekking tot [artikel 45 van die wet][ref3] is bepaald, buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0004045#HoofdstukIX
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel45
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '45'
      - id: ref2
        bwb_id: BWBR0004045
        hoofdstuk: IX
      - id: ref3
        bwb_id: BWBR0004045
        artikel: '45'
  - number: '34.2'
    text: |-
      Voor de toepassing van de nieuwe [Werkloosheidswet][ref1] wordt voor de berekening van een uitkering waarop op
      grond van die wet aanspraak bestaat, tot een in het eerste lid bedoelde tijdstip, als dagloon beschouwd: hetgeen
      de werknemer tijdens het ontvangen van de uitkering bij een vijfdaagse werkweek gemiddeld per dag zou hebben kunnen
      verdienen in het beroep dat hij gewoonlijk uitoefende.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '34.3'
    text: Onze Minister stelt met betrekking tot de vaststelling van het dagloon nadere regels.
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel34
  - number: '34.4'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan, zo nodig in afwijking van de door Onze Minister op grond van
      het derde lid gestelde regels, regels stellen met betrekking tot de vaststelling van het dagloon voor één of meer
      categorieën van werknemers. Deze regels behoeven goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel34
  - number: '34.5'
    text: |-
      De in het derde en vierde lid bedoelde regels bevatten voor zover nodig bepalingen op grond waarvan
      voor een werknemer die naast een loondervingsuitkering op grond van de nieuwe [Werkloosheidswet][ref1]
      een uitkering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref2],
      de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref3] of de
      [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref4] ontvangt, dan wel een uitkering ontvangt
      die naar aard en strekking daarmee overeenkomt op grond van een regeling voor de persoon, bedoeld in
      [artikel 7, eerste lid, van de nieuwe Werkloosheidswet][ref5], berekend naar een arbeidsongeschiktheid van minder
      dan 80%, een evenredige verlaging van het dagloon plaatsvindt, overeenkomend met een percentage dat gelijk is aan
      het verschil tussen 100 en het midden van de arbeidsongeschiktheidsklasse, waarin de werknemer is ingedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0002524
      [ref3]: https://wetten.overheid.nl/BWBR0008656
      [ref4]: https://wetten.overheid.nl/BWBR0008657
      [ref5]: https://wetten.overheid.nl/BWBR0004045#Artikel7
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0002524
      - id: ref3
        bwb_id: BWBR0008656
      - id: ref4
        bwb_id: BWBR0008657
      - id: ref5
        bwb_id: BWBR0004045
        artikel: '7'
  - number: '34.6'
    text: |-
      Onverminderd het bepaalde in artikel 46 van de nieuwe [Werkloosheidswet][ref1] kunnen de in het derde en vierde lid
      bedoelde regels bepalingen bevatten op grond waarvan het dagloon tijdens de uitkering kan worden herzien.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '36'
    text: |-
      Totdat het bij koninklijke boodschap van 4 mei 1983 ingediende voorstel van wet houdende algemene regeling van
      beslag op loon, sociale uitkeringen en andere periodieke betalingen (kamerstukken II, 1982/83, 17 897) tot wet
      is verheven en in werking is getreden, luiden [artikel 40, eerste lid, van de nieuwe Werkloosheidswet][ref1],
      [artikel 25, eerste lid, van de Toeslagenwet][ref2] en
      __REF002___________________________________________________________________________________________________________
      _________ als volgt:


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0004043#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0004044#Artikel25
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '40'
      - id: ref2
        bwb_id: BWBR0004043
        artikel: '25'
      - id: ref3
        bwb_id: BWBR0004044
        artikel: '25'
  - number: '36.1'
    text: 'De uitkering is:'
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel36
  - number: 36.1.a
    text: onvervreemdbaar;
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel36
  - number: 36.1.b
    text: niet vatbaar voor verpanding of belening;
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel36
  - number: 36.1.c
    text: |-
      behoudens voor zover dit dient tot verhaal van levensonderhoud waartoe de betrokkene volgens de wet is gehouden,
      niet vatbaar voor executoriaal of conservatoir beslag, noch voor faillissementsbeslag.
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel36
  - number: '37.1'
    text: |-
      Vanaf de dag, waarop de nieuwe [Werkloosheidswet][ref1] in werking treedt, vindt geen vergoeding aan de gemeente
      plaats van de kosten, bedoeld in [artikel 40, onderdeel ][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0002470#Artikel40
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0002470
        artikel: '40'
  - number: '37.2'
    text: |-
      Het Rijk verstrekt gedurende vier perioden van twaalf maanden vanaf de dag waarop de nieuwe
      [Werkloosheidswet][ref1] in werking treedt, aan de gemeente een uitkering, die is gebaseerd op de kosten die over
      het dienstjaar 1984 op grond van [artikel 40, onderdeel ][ref2] aan de gemeente zijn vergoed.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0002470#Artikel40
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0002470
        artikel: '40'
  - number: '37.3'
    text: |-
      De uitkering, bedoeld in het tweede lid, bedraagt gedurende de eerste tot en met de vierde periode van 12 maanden
      vanaf de dag waarop de nieuwe [Werkloosheidswet][ref1] in werking treedt, onderscheidenlijk 80%, 60%, 40% en 20%
      van de in het tweede lid bedoelde kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '37.4'
    text: Vanaf 1 januari 1991 verstrekt het Rijk aan de gemeente een uitkering van f 1050,- per toegewezen aanvraag.
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel37
  - number: '37.5'
    text: |-
      Onze Minister is bevoegd de verstrekte uitkering, bedoeld in het tweede en het vierde lid, gedeeltelijk terug te
      vorderen of te verrekenen, indien het gemeentebestuur niet of in onvoldoende mate voldoet aan zijn verplichtingen,
      bedoeld in [artikel 26, eerste lid, van de Wet Werkloosheidsvoorziening][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002470#Artikel26
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0002470
        artikel: '26'
  - number: '37.6'
    text: |-
      Onze Minister is bevoegd met betrekking tot de wijze van verstrekking van de in dit artikel bedoelde uitkeringen
      nadere regels te stellen.
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel37
  - number: '38'
    text: |-
      Beslissingen en uitkeringen op grond van dit hoofdstuk of de daarop berustende bepalingen worden,
      voor zover de [Werkloosheidswet][ref1] of de [Wet Werkloosheidsvoorziening][ref2] en de op die wetten
      berustende bepalingen niet van toepassing blijven, voor de toepassing van wettelijke bepalingen beschouwd
      als beslissingen en uitkeringen op grond van de nieuwe [Werkloosheidswet][ref3], onderscheidenlijk de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0002470
      [ref3]: https://wetten.overheid.nl/BWBR0004045
      [ref4]: https://wetten.overheid.nl/BWBR0004044
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0002470
      - id: ref3
        bwb_id: BWBR0004045
      - id: ref4
        bwb_id: BWBR0004044
  - number: '43.1'
    text: |-
      Ten aanzien van de persoon, die op de dag, voorafgaande aan die waarop deze wet in werking treedt, recht had op
      een arbeidsongeschiktheidsuitkering op grond van de Algemene Arbeidsongeschiktheidswet, berekend naar een grondslag
      als bedoeld in artikel 10, derde en vierde lid, van die wet, zoals die leden luidden op de dag, voorafgaande aan
      die waarop deze wet in werking treedt, worden de wijzigingen van de Algemene Arbeidsongeschiktheidswet als vervat
      in [artikel 39, onderdeel D tot en met F en Q][ref1], geacht niet te hebben plaatsgevonden zolang de betrokkene
      voldoet aan de voorwaarden, bedoeld in [artikel 10, derde of vierde lid][ref2], in verbinding met [artikel 10]
      (onbekend), zoals die leden luidden op de dag, voorafgaande aan die waarop deze wet in werking treedt, doch
      uiterlijk tot een binnen een jaar na die dag gelegen tijdstip, waarop op grond van [artikel 10](onbekend), zoals
      dat artikel luidde op de dag, voorafgaande aan die waarop deze wet in werking treedt, het inkomen opnieuw zou
      dienen te worden vastgesteld, indien de in voornoemd [artikel 10](onbekend) bedoelde perioden op één jaar zouden
      zijn gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004046#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0004046#Artikel10
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0004046
        artikel: '39'
        hoofdstuk: III
        afdeling: I
      - id: ref2
        bwb_id: BWBR0004046
        artikel: '10'
        hoofdstuk: II
        afdeling: II
  - number: '43.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing ten aanzien van de persoon, bedoeld in artikel V van de wet van
      29 december 1982, *Stb.* 737, zoals dat artikel luidde op de dag, voorafgaande aan die waarop deze wet in werking
      treedt. Ten aanzien van de in de vorige volzin bedoelde persoon blijft de wijziging van de Wet van 29 december 1982
      (*Stb.* 737) als vervat in [artikel 42][ref1], buiten toepassing tot het tijdstip, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004046#Artikel42
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0004046
        artikel: '42'
        hoofdstuk: III
        afdeling: I
  - number: '43.3'
    text: |-
      Voor de persoon, bedoeld in het eerste of tweede lid, wordt de toeslag op grond van de [Toeslagenwet][ref1] vanaf
      de dag waarop de in het eerste dan wel tweede lid bedoelde wijzigingen op hem van toepassing worden, ten minste
      vastgesteld op het verschil tussen de arbeidsongeschiktheidsuitkering waarop recht zou hebben bestaan indien de
      wijzigingen van de Algemene Arbeidsongeschiktheidswet als vervat in [artikel 39, onderdeel D en E][ref2], en de
      wijziging, bedoeld in [artikel 42][ref3], niet zouden hebben plaatsgevonden, en de som van de uitkeringen op grond
      van de Algemene Arbeidsongeschiktheidswet en de [Wet op de arbeidsongeschiktheidsverzekering][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0004043
      [ref2]: https://wetten.overheid.nl/BWBR0004046#Artikel39
      [ref3]: https://wetten.overheid.nl/BWBR0004046#Artikel42
      [ref4]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0004043
      - id: ref2
        bwb_id: BWBR0004046
        artikel: '39'
        hoofdstuk: III
        afdeling: I
      - id: ref3
        bwb_id: BWBR0004046
        artikel: '42'
        hoofdstuk: III
        afdeling: I
      - id: ref4
        bwb_id: BWBR0002524
  - number: '43.4'
    text: |-
      Het derde lid is van toepassing zolang de betrokkene voldoet aan de voorwaarden, bedoeld in
      [artikel 10, derde en vierde lid][ref1], in verbinding met [artikel 10](onbekend), zoals die leden luidden op de
      dag, voorafgaande aan die waarop deze wet in werking treedt, doch uiterlijk tot het tijdstip waarop op grond van
      [artikel 10](onbekend), zoals die leden luidden op de dag voorafgaande aan die waarop deze wet in werking treedt,
      het inkomen voor de eerste keer na inwerkingtreding van deze wet opnieuw zou dienen te worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004046#Artikel10
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0004046
        artikel: '10'
        hoofdstuk: II
        afdeling: II
  - number: '43.5'
    text: |-
      De in het eerste en tweede lid bedoelde persoon, wiens grondslag was vastgesteld, of zou zijn vastgesteld indien
      artikel 90, eerste lid, onderdeel *a*, van de Algemene Arbeidsongeschiktheidswet niet op hem van toepassing was
      geweest, met toepassing van artikel 10, derde lid, onderdeel *b* , onderscheidenlijk artikel 10, vierde lid,
      onderdeel *b*, van die wet, zoals dat artikel luidde op de dag, voorafgaande aan die waarop deze wet in werking
      treedt, wordt, zolang hij ongehuwd is en een eigen kind of pleegkind heeft dat jonger is dan 18 jaar, dat tot zijn
      huishouden behoort of grotendeels op zijn kosten wordt onderhouden, vanaf het in het eerste lid bedoelde tijdstip
      tot een bij algemene maatregel van bestuur te bepalen datum voor de toepassing van de [Toeslagenwet][ref1] als
      gehuwd aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0004043
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0004043
  - number: '43.6'
    text: |-
      Het verschil tussen het bedrag aan arbeidsongeschiktheidsuitkering, dat op grond van het eerste en het tweede lid
      wordt uitbetaald en het bedrag aan arbeidsongeschiktheidsuitkering dat zou worden uitbetaald indien het eerste
      lid niet zou hebben gegolden, wordt volgens door Onze Minister te stellen regels door het Uitvoeringsinstituut
      werknemersverzekeringen, ten laste van het Toeslagenfonds, bedoeld in [artikel 31 van de Toeslagenwet][ref1],
      ten gunste gebracht van het Algemeen Arbeidsongeschiktheidsfonds, bedoeld in
      [artikel 34 van de Wet financiering volksverzekeringen][ref2], onderscheidenlijk het Arbeidsongeschiktheidsfonds,
      bedoeld in [artikel 72 van de Wet op de arbeidsongeschiktheidsverzekering][ref3]. Voor de toepassing van de
      eerste volzin wordt onder arbeidsongeschiktheidsuitkering verstaan zowel uitkering op grond van de Algemene
      Arbeidsongeschiktheidswet als uitkering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0004538#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel72
      [ref4]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: '31'
      - id: ref2
        bwb_id: BWBR0004538
        artikel: '34'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: '72'
      - id: ref4
        bwb_id: BWBR0002524
  - number: '43.7'
    text: |-
      Het bedrag aan arbeidsongeschiktheidsuitkering op grond van de Wet op de arbeidsongeschiktheidsverzekering, dat
      zou worden uitbetaald dan wel meer zou worden uitbetaald indien het eerste lid niet zou hebben gegolden, wordt
      volgens door Onze Minister te stellen regels door het Uitvoeringsinstituut werknemersverzekeringen, ten laste van
      het Arbeidsongeschiktheidsfonds, bedoeld in [artikel 72 van de Wet op de arbeidsongeschiktheidsverzekering][ref1],
      ten gunste gebracht van het Algemeen Arbeidsongeschiktheidsfonds, bedoeld in
      [artikel 34 van de Wet financiering volksverzekeringen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0004538#Artikel34
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '72'
      - id: ref2
        bwb_id: BWBR0004538
        artikel: '34'
  - number: '43.8'
    text: |-
      Ten aanzien van de persoon, bedoeld in het eerste of tweede lid, blijft de [Toeslagenwet][ref1] buiten toepassing
      tot de dag waarop de in het eerste dan wel tweede lid bedoelde wijzigingen op hem van toepassing worden.


      [ref1]: https://wetten.overheid.nl/BWBR0004043
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0004043
  - number: 43a.1
    text: |-
      Voor de persoon, bedoeld in [artikel 43, tweede lid][ref1], wiens arbeidsongeschiktheidsuitkering op de dag
      voorafgaande aan de dag waarop de in [artikel 43, tweede lid][ref2] bedoelde wijziging op hem van toepassing wordt
      is verhoogd met toepassing van[ artikel 22 van de Wet op de arbeidsongeschiktheidsverzekering][ref3], wordt de
      toeslag op grond van de [Toeslagenwet][ref4] vanaf laatstgenoemde dag doch niet eerder dan vanaf de dag waarop
      geen recht meer bestaat op de toeslag, bedoeld in [artikel 43, derde lid][ref5], vastgesteld op het verschil
      tussen de arbeidsongeschiktheidsuitkering waarop op de dag voorafgaande aan dat tijdstip recht zou hebben bestaan
      indien de wijziging bedoeld in [artikel 42][ref6] niet zou hebben plaatsgevonden en de uitkering op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0004046#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0004046#Artikel43
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel22
      [ref4]: https://wetten.overheid.nl/BWBR0004043
      [ref5]: https://wetten.overheid.nl/BWBR0004046#Artikel43
      [ref6]: https://wetten.overheid.nl/BWBR0004046#Artikel42
      [ref7]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0004046
        artikel: '43'
        hoofdstuk: III
        afdeling: II
      - id: ref2
        bwb_id: BWBR0004046
        artikel: '43'
        hoofdstuk: III
        afdeling: II
      - id: ref3
        bwb_id: BWBR0002524
        artikel: '22'
      - id: ref4
        bwb_id: BWBR0004043
      - id: ref5
        bwb_id: BWBR0004046
        artikel: '43'
        hoofdstuk: III
        afdeling: II
      - id: ref6
        bwb_id: BWBR0004046
        artikel: '42'
        hoofdstuk: III
        afdeling: I
      - id: ref7
        bwb_id: BWBR0002524
  - number: 43a.2
    text: |-
      Het eerste lid is van toepassing voor zolang de betrokkene gehuwd is dan wel een eigen kind of pleegkind heeft
      dat jonger is dan 18 jaar en dat tot zijn huishouden behoort of grotendeels op zijn kosten wordt onderhouden,
      doch uiterlijk zolang [artikel 22 van de Wet op de arbeidsongeschiktheidsverzekering][ref1] wordt toegepast of
      tot het tijdstip waarop de echtgenoot van betrokkene aanspraak verkrijgt op een ouderdomspensioen op grond van de
      [Algemene Ouderdomswet][ref2] (*Stb.* 1985, 181).


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0002221
  - number: 43a.3
    text: 'Voor de toepassing van het tweede lid wordt:'
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel43a
  - number: 43a.3.a
    text: als ongehuwd aangemerkt degene die duurzaam gescheiden leeft van de persoon met wie hij gehuwd is.
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel43a
  - number: 43a.3.b
    text: als pleegkind aangemerkt een kind dat als een eigen kind wordt onderhouden en opgevoed.
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel43a
  - number: '44.1'
    text: |-
      Ten aanzien van de persoon, die op de dag voorafgaande aan die waarop deze wet in werking treedt, recht had op een
      arbeidsongeschiktheidsuitkering op grond van de Algemene Arbeidsongeschiktheidswet, berekend met toepassing van
      artikel 10, vijfde lid, van die wet, zoals dat lid luidde op de dag voorafgaande aan die waarop deze wet in werking
      treedt, en wiens arbeidsongeschiktheidsuitkering op grond van de Algemene Arbeidsongeschiktheidswet op de dag
      waarop deze wet in werking treedt niet wordt berekend met toepassing van artikel 10, eerste lid, van die wet, wordt
      de voor hem geldende grondslag vermenigvuldigd met de factor 8/7.
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel44
  - number: '44.2'
    text: |-
      Indien toepassing van het eerste lid leidt tot een grondslag, die hoger is dan het bedrag van de grondslag, bedoeld
      in artikel 10, eerste lid, van de Algemene Arbeidsongeschiktheidswet, wordt in afwijking van het eerste lid de
      grondslag vastgesteld op dat bedrag.
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel44
  - number: '45.1'
    text: |-
      De uitkeringsgerechtigde op grond van de Algemene Arbeidsongeschiktheidswet en de Wet op de
      arbeidsongeschiktheidsverzekering, die zowel op de dag, voorafgaande aan die waarop deze wet in werking
      treedt, als op de dag waarop deze wet in werking treedt, recht had op een arbeidsongeschiktheidsuitkering
      op grond van een van die of van beide wetten, berekend naar een arbeidsongeschiktheid van 55 tot
      65% of 65 tot 80%, heeft, zolang hij in dezelfde arbeidsongeschiktheidsklasse blijft ingedeeld, in
      afwijking van artikel 12, eerste lid, van de Algemene Arbeidsongeschiktheidswet, onderscheidenlijk
      [artikel 21, tweede lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref1], recht op een
      arbeidsongeschiktheidsuitkering die per dag, de zaterdagen en de zondagen niet meegerekend, bedraagt bij een
      arbeidsongeschiktheid van: 55-65%: 44% van de grondslag onderscheidenlijk van 100/108 maal het dagloon of het
      vervolgdagloon 65-80%: 57% van de grondslag onderscheidenlijk van 100/108 maal het dagloon of het vervolgdagloon.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel21
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '21'
  - number: '45.2'
    text: |-
      Voor de toepassing van het eerste lid wordt te rekenen vanaf 30 januari 1986 een herziening van een
      arbeidsongeschiktheidsuitkering als bedoeld in artikel 28 van de Algemene Arbeidsongeschiktheidswet of
      [artikel 38 van de Wet op de arbeidsongeschiktheidsverzekering][ref1], geacht niet te hebben plaatsgevonden,
      indien de uitkeringsgerechtigde binnen 48 weken na de herziening weer wordt ingedeeld in dezelfde
      arbeidsongeschiktheidsklasse als voor die herziening.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel38
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '38'
  - number: '46.1'
    text: |-
      De persoon, die zowel op de dag, voorafgaande aan die waarop deze wet in werking treedt, als op de dag,
      waarop deze wet in werking treedt, recht had op arbeidsongeschiktheidsuitkering op grond van de Algemene
      Arbeidsongeschiktheidswet en op laatstbedoelde dag de leeftijd van 23 jaar nog niet heeft bereikt, heeft, indien
      zijn arbeidsongeschiktheidsuitkering niet was berekend met toepassing van artikel 10, vijfde lid, van de Algemene
      Arbeidsongeschiktheidswet, zoals dat lid luidde op de dag, voorafgaande aan die waarop deze wet in werking treedt,
      zolang hij de leeftijd van 23 jaar niet heeft bereikt recht op een arbeidsongeschiktheidsuitkering berekend naar
      een grondslag, die voor een uitkeringsgerechtigde van 18 jaar f 62,63, van 19 jaar f 72,97, van 20 jaar f 83,31, en
      van 21 en 22 jaar f 93,64 bedraagt.
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel46
  - number: '46.2'
    text: |-
      Artikel 10, vijfde lid, van de Algemene Arbeidsongeschiktheidswet is op de grondslag, bedoeld in het eerste lid,
      van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel46
  - number: '47'
    text: |-
      Voor de toepassing van artikel 6, eerste lid, onderdeel *a*, van de Algemene Arbeidsongeschiktheidswet, worden
      ten aanzien van de verzekerde, wiens arbeidsongeschiktheid is ingetreden voor de dag, waarop [artikel 39][ref1]
      in werking treedt, de wijzigingen, vervat in de onderdelen C en D van dat artikel geacht niet te hebben
      plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0004046#Artikel39
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0004046
        artikel: '39'
        hoofdstuk: III
        afdeling: I
  - number: '48.1'
    text: |-
      De persoon, die 21 jaar of ouder is, die voor de toepassing van de [Toeslagenwet][ref1]
      niet als gehuwd wordt aangemerkt en voor wie de algemene heffingskorting, bedoeld in
      [artikel 22 van de Wet op de loonbelasting 1964][ref2], maar niet de alleenstaande-ouderkorting,
      bedoeld in [artikel 8.15 van de Wet inkomstenbelasting 2001][ref3], van toepassing is en die
      recht heeft op uitkering op grond van de [Wet werk en inkomen naar arbeidsvermogen][ref4], de
      [Wet op de arbeidsongeschiktheidsverzekering][ref5], de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref6]
      of de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref7] of meer van deze wetten
      gezamenlijk, in verband met een arbeidsongeschiktheid van 80% of meer, en berekend naar een
      dagloon als bedoeld in [artikel 13 van de Wet werk en inkomen naar arbeidsvermogen ][ref8]dan wel
      [artikel 14 van de Wet op de arbeidsongeschiktheidsverzekering][ref9] of een vervolgdagloon als bedoeld in
      [artikel 21b van de Wet op de arbeidsongeschiktheidsverzekering][ref10], dat ten minste gelijk is aan 70% van het
      minimumloon, bedoeld in [artikel 12, eerste lid, onderdeel b, van de Wet werk en inkomen naar arbeidsvermogen][ref11]
      en [13, tweede lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref12], of berekend
      naar een grondslag die ten minste gelijk is aan 70% van het minimumloon als bedoeld in
      [artikel 8, zevende lid, van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref13], of
      [artikel 7, tweede lid, van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref14], heeft recht op en
      verhoging van zijn uitkering, indien zijn uitkering per dag, indien hij 21 jaar, 22 jaar, onderscheidenlijk 23 jaar
      of ouder is, minder bedraagt dan € 28,09, € 34,46, onderscheidenlijk € 44,25.


      [ref1]: https://wetten.overheid.nl/BWBR0004043
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0019057
      [ref5]: https://wetten.overheid.nl/BWBR0002524
      [ref6]: https://wetten.overheid.nl/BWBR0008656
      [ref7]: https://wetten.overheid.nl/BWBR0008657
      [ref8]: https://wetten.overheid.nl/BWBR0019057#Artikel13
      [ref9]: https://wetten.overheid.nl/BWBR0002524#Artikel14
      [ref10]: https://wetten.overheid.nl/BWBR0002524#Artikel21b
      [ref11]: https://wetten.overheid.nl/BWBR0019057#Artikel12
      [ref12]: https://wetten.overheid.nl/BWBR0002524#Artikel13
      [ref13]: https://wetten.overheid.nl/BWBR0008656#Artikel8
      [ref14]: https://wetten.overheid.nl/BWBR0008657#Artikel7
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel48
