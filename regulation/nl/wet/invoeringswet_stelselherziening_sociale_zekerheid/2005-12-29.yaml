        artikel: '4'
        hoofdstuk: II
        afdeling: I
      - id: ref5
        bwb_id: BWBR0004046
        artikel: '6'
        hoofdstuk: II
        afdeling: I
      - id: ref6
        bwb_id: BWBR0004045
  - number: '14.1'
    text: |-
      Indien ten aanzien van de persoon, bedoeld in artikel 4, op de dag, voorafgaande aan die waarop de nieuwe
      [Werkloosheidswet][ref1] op hem van toepassing wordt, [artikel 31, eerste lid, onderdeel ][ref2], zo nodig in
      verbinding met [artikel 39 van de Werkloosheidswet][ref3] van toepassing was en ten aanzien van de persoon, bedoeld
      in [artikel 6][ref4], op dat tijdstip [artikel 14 van de Wet Werkloosheidsvoorziening][ref5] van toepassing was,
      wordt deze toepassing voortgezet, tenzij het Uitvoeringsinstituut werknemersverzekeringen met gebruikmaking van
      zijn bevoegdheid, bedoeld in [artikel 27, eerste en tweede lid, van de nieuwe Werkloosheidswet][ref6], anders
      beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0004046#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel39
      [ref4]: https://wetten.overheid.nl/BWBR0004046#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0002470#Artikel14
      [ref6]: https://wetten.overheid.nl/BWBR0004045#Artikel27
    url: https://wetten.overheid.nl/BWBR0004046/2005-12-29#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0004046
        artikel: '31'
        hoofdstuk: II
        afdeling: X
