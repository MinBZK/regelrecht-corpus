      [33, eerste lid, van de Ziektewet][ref3], 1, onderdeel *h*, van de
      Organisatiewet Sociale Verzekering, [6, eerste lid, onderdeel ][ref4],
      [9, vierde lid, van de Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref5]
      en [26, derde lid, onderdeel ][ref6], zoals deze luiden op de dag, waarop deze wet in werking treedt, wordt na
      "[Toeslagenwet][ref7]" op de gebruikelijke wijze ingevoegd de jaargang en het nummer van het *Staatsblad* waarin de
      [Toeslagenwet][ref8] is geplaatst.


