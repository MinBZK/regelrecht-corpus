  - number: '17'
    text: |-
      1 In afwijking van [artikel 42, eerste en tweede lid][ref1], en [artikel 49 van de nieuwe Werkloosheidswet][ref2]
      is de uitkeringsduur voor de persoon, bedoeld in [artikel 4][ref3] en [artikel 5, vierde lid][ref4], die op de
      eerste dag van de werkloosheid:

      a. jonger is dan 22,5 jaar, indien hij aantoont in de periode van drie jaar aan het intreden van zijn
      werkloosheid onmiddellijk voorafgaande, ten minste gedurende twee en een half jaar als werknemer in de zin van de
      [Werkloosheidswet][ref5] of de [Wet Werkloosheidsvoorziening][ref6] in een dienstbetrekking van 8 of meer uren per
      week te hebben gestaan: een half jaar;

      b. 22,5 jaar of ouder is, doch jonger dan 29,5 jaar: één jaar;

      c. 29,5 jaar of ouder is, doch jonger dan 34,5 jaar: anderhalf jaar;

      d. 34,5 jaar of ouder is, doch jonger dan 57,5 jaar: twee jaar.

      2 Voor de werknemer, bedoeld in het eerste lid, onderdeel *a*, *b* en *c*, wordt de uitkeringsduur verlengd met
      een half jaar, indien hij aantoont in de periode van vijf jaar aan het intreden van zijn werkloosheid onmiddellijk
      voorafgaande, ten minste gedurende drie jaar als werknemer in de zin van de [Werkloosheidswet][ref7] of de
      [Wet Werkloosheidsvoorziening][ref8] in een dienstbetrekking van 8 of meer uren per week te hebben gestaan.

      3 Perioden waarin de persoon, bedoeld in [artikel 4][ref9]:

      a. voor de dag, waarop de nieuwe [Werkloosheidswet][ref10] in werking treedt ter zake van een geëindigde
      dienstbetrekking van 8 of meer uren per week recht had op een arbeidsongeschiktheidsuitkering op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref11] berekend naar een arbeidsongeschiktheid van 80% of meer;

      b. voor of vanaf de dag, waarop de nieuwe [Werkloosheidswet][ref12] in werking treedt ter zake van een geëindigde
      dienstbetrekking van 8 of meer uren per week op grond waarvan hem door het Rijk invaliditeitspensioen was
      verzekerd, recht had op een arbeidsongeschiktheidsuitkering berekend naar een arbeidsongeschiktheid van 80% of
      meer;

      c. voor de dag, waarop de nieuwe [Werkloosheidswet][ref13] in werking treedt, recht had op een
      arbeidsongeschiktheidsuitkering op grond van hoofdstuk III van de Wet arbeidsongeschiktheidsvoorziening militairen
      berekend naar een arbeidsongeschiktheid van 80% of meer;

      d. voor de dag, waarop de nieuwe [Werkloosheidswet][ref14] in werking treedt, ter zake van een geëindigde
      dienstbetrekking van 8 of meer uren per week recht had op een uitkering op grond van de [Ziektewet][ref15] over de
      maximale duur, bedoeld in [artikel 29, tweede lid, van die wet][ref16];

      e. anders dan genoemd in onderdeel *a* tot en met *d*, voor of vanaf de dag, waarop de nieuwe
      [Werkloosheidswet][ref17] in werking treedt, recht had op een uitkering, die naar aard en strekking overeenkomt met
      een uitkering als bedoeld in onderdeel *a* of *d*;

      worden in aanmerking genomen voor de periode van twee en een half jaar, bedoeld in het eerste lid, en de periode
      van drie jaar, bedoeld in het tweede lid.

      4 Tijdens de duur op grond van dit artikel is
      [artikel 34, vierde en vijfde lid, van de nieuwe Werkloosheidswet][ref18] niet van toepassing. Tevens worden,
      in afwijking van [artikel 34, zesde lid, van de nieuwe Werkloosheidswet][ref19], tijdens de duur op grond van
      dit artikel, inkomsten uit ouderdomspensioen niet op de uitkering in mindering gebracht, voor zover zij door de
      werknemer reeds vóór het intreden van zijn werkloosheid werden genoten naast de inkomsten uit het beroep, waaruit
      hij werkloos is.

      5 [Artikel 42, vierde tot en met negende lid, van de nieuwe Werkloosheidswet][ref20] is van overeenkomstige
      toepassing met betrekking tot de periode van twee en een half jaar, bedoeld in het eerste lid, en de periode van
      drie jaar, bedoeld in het tweede lid.

      6 De [artikelen 43][ref21] en [76 van de nieuwe Werkloosheidswet][ref22] zijn van overeenkomstige toepassing met
      betrekking tot de uitkeringsduur, bedoeld in het eerste en het tweede lid.


