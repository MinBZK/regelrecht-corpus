  - number: '3'
    text: |-
      1 Vanaf de dag waarop de nieuwe [Werkloosheidswet][ref1] in werking treedt ontstaat geen nieuw recht op uitkering
      op grond van de [Wet Werkloosheidsvoorziening][ref2] als bedoeld in de [artikelen 9, eerste lid][ref3], [10][ref4],
      en [hoofdstuk III][ref5].

      2 Aanvragen om uitkering op grond van de Wet Werkloosheidsvoorziening terzake van rechten, ontstaan vóór
      de in het eerste lid bedoelde dag, kunnen slechts leiden tot toekenning van uitkering op grond van de
      [Wet Werkloosheidsvoorziening][ref6] als bedoeld in de [artikelen 9, eerste lid][ref7], [10][ref8], en
      [hoofdstuk III][ref9], indien deze aanvragen zijn ingediend vóór de eerste dag van de zevende maand na de
      inwerkingtreding van de wet waarmee dit lid werd toegevoegd aan deze wet.


