  - number: '19'
    text: |-
      Indien het recht op uitkering op grond van de Wet Werkloosheidsvoorziening van de persoon, bedoeld in
      [artikel 5, eerste en tweede lid][ref1], door het verrichten van arbeid als werknemer geheel of gedeeltelijk
      is geëindigd en vervolgens na beëindiging van die arbeid op een tijdstip, gelegen binnen vijf jaar na
      inwerkingtreding van de nieuwe [Werkloosheidswet][ref2], recht op uitkering is ontstaan op grond van de nieuwe
      [Werkloosheidswet][ref3], zonder dat aan de voorwaarde, bedoeld in [artikel 42, tweede lid, onderdeel ][ref4]
      wordt voldaan, wordt de duur van die uitkering verlengd met de duur van de uitkering op grond van de
      [Wet Werkloosheidsvoorziening][ref5], die de werknemer als gevolg van de eindiging van het recht op uitkering op
      grond van de [Wet Werkloosheidsvoorziening][ref6] niet heeft ontvangen.


