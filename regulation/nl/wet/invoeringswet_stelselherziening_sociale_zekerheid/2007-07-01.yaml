  - number: '4'
    text: |-
      1 De [Werkloosheidswet][ref1] en de daarop berustende bepalingen blijven van toepassing ten aanzien van de persoon
      die op de dag, voorafgaande aan die waarop de nieuwe [Werkloosheidswet][ref2] in werking treedt, recht op uitkering
      op grond van de [Werkloosheidswet][ref3] had, zo lang hij niet de maximum uitkeringsduur op grond van die wet heeft
      bereikt.

      2 Met de in het eerste lid bedoelde persoon wordt, zolang voor hem geen recht op uitkering op grond van de nieuwe
      [Werkloosheidswet][ref4] is ontstaan, gelijkgesteld, de persoon die op de dag, voorafgaande aan die waarop de
      nieuwe [Werkloosheidswet][ref5] in werking treedt, geen recht op uitkering op grond van de [Werkloosheidswet][ref6]
      had, omdat:

      a. het recht op uitkering op grond van die wet was onderbroken door werkaanvaarding of omdat
      [artikel 31, eerste en tweede lid][ref7], zo nodig in verbinding met artikel 39 van die wet op hem van toepassing
      was;

      b. na het intreden van zijn werkloosheid zijn werkgever tijdens het voortbestaan van de dienstbetrekking het loon
      onverminderd doorbetaalde;

      doch die, zodra de omstandigheid, bedoeld in onderdeel *a* of *b*, niet meer op hem van toepassing is vervolgens
      wel recht op uitkering op grond van die wet zou hebben gehad, indien die wet niet zou zijn ingetrokken.

      3 De [Werkloosheidswet][ref8] blijft van toepassing ten aanzien van de persoon:

      a. wiens werkgever op de dag, voorafgaande aan die waarop de nieuwe [Werkloosheidswet][ref9] in werking treedt,
      in staat van faillissement was verklaard, surséance van betaling was verleend of in een toestand verkeerde als
      bedoeld in [artikel 42](onbekend) en die in verband daarmee recht had op een betaling op grond van [hoofdstuk III]
      (onbekend) van laatstgenoemde wet;

      b. die op de dag, voorafgaand aan die waarop de nieuwe [Werkloosheidswet][ref10] in werking treedt, recht had op
      loonsuppletie op grond van [hoofdstuk III](onbekend);

      voor de duur van de betaling of de duur van de loonsuppletie.

      4 Zolang de [Werkloosheidswet][ref11] op hem van toepassing blijft, wordt de uitkering van de in het eerste of
      tweede lid bedoelde persoon, wiens uitkering niet is berekend naar het minimumdagloon, bedoeld in [artikel 12]
      (onbekend), voor de toepassing van de [Toeslagenwet][ref12] beschouwd als uitkering op grond van de nieuwe
      [Werkloosheidswet][ref13].

      5 In afwijking van het eerste lid is [artikel 26 van de Werkloosheidswet][ref14] niet van toepassing op de
      uitkering van de in het eerste, het tweede of het derde lid bedoelde persoon. In dat geval wordt deze persoon
      voor de toepassing van de [Ziektewet][ref15] (*Stb.* 1967, 473) en de Wet op de arbeidsongeschiktheidsverzekering
      (*Stb.* 1977, 492) als werknemer in de zin van de nieuwe [Werkloosheidswet][ref16] beschouwd, wordt het
      Uitvoeringsinstituut werknemersverzekeringen als werkgever beschouwd en wordt deze uitkering voor de toepassing van
      [artikel 3][ref17] (*Stb.* 1966, 64) als uitkering op grond van de nieuwe [Werkloosheidswet][ref18] aangemerkt.

      6 In aansluiting op het eindigen van het recht op uitkering, bedoeld in het eerste lid, heeft de in het eerste of
      tweede lid bedoelde persoon recht op uitkering op grond van de nieuwe [Werkloosheidswet][ref19], tenzij die wet of
      deze wet dat verhindert.


