  - number: '12'
    text: |-
      1 De persoon die op de dag, onmiddellijk voorafgaande aan het intreden van zijn werkloosheid, werknemer
      in de zin van de nieuwe [Werkloosheidswet][ref1] was en die in de periode van 12 maanden, bedoeld in
      [artikel 17 van die wet][ref2], in weken, gelegen vóór de dag, waarop die wet in werking treedt, arbeid heeft
      verricht als werknemer in de zin van de [Werkloosheidswet][ref3] of de Wet Werkloosheidsvoorziening, dan wel zijn
      militaire dienstplicht of in plaats daarvan vervangende dienst heeft vervuld, wordt met betrekking tot de weken
      waarin hij deze arbeid heeft verricht beschouwd als werknemer in de zin van de nieuwe [Werkloosheidswet][ref4].

      2 De persoon die op de dag, onmiddellijk voorafgaande aan het intreden van zijn werkloosheid, werknemer
      in de zin van de nieuwe [Werkloosheidswet][ref5] was en die in de periode van 36 weken, bedoeld in
      [artikel 17 van die wet][ref6], in weken vanaf de dag waarop die wet in werking treedt, arbeid heeft verricht
      in een arbeidsverhouding ter zake waarvan hem door het Rijk invaliditeitspensioen is verzekerd, wordt met
      betrekking tot de weken waarin hij deze arbeid heeft verricht beschouwd als werknemer in de zin van de nieuwe
      [Werkloosheidswet][ref7].

      3 Het eerste lid is van overeenkomstige toepassing op de persoon die op de dag onmiddellijk voorafgaande aan het
      intreden van zijn werkloosheid werknemer in de zin van de [Werkloosheidswet][ref8] was en wiens werkloosheid begint
      op de dag waarop de nieuwe [Werkloosheidswet][ref9] in werking treedt.

      4 [Artikel 17][ref10] is van overeenkomstige toepassing met betrekking tot het eerste, tweede en derde lid.

      5 Ten aanzien van de persoon die op de dag, voorafgaande aan die waarop de nieuwe [Werkloosheidswet][ref11] in
      werking treedt, recht had op een arbeidsongeschiktheidsuitkering als bedoeld in [artikel 51][ref12] en die op het
      tijdstip waarop de arbeidsongeschiktheid intrad werknemer was in de zin van de [Werkloosheidswet][ref13], zijn het
      eerste en het vierde lid van overeenkomstige toepassing.

      6 Onze Minister is bevoegd met betrekking tot dit artikel nadere en zo nodig afwijkende regels te stellen.


