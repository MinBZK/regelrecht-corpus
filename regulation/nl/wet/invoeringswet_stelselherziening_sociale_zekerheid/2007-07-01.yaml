  - number: '57'
    text: |-
      1 Indien het recht op aanvullende uitkering door het verrichten van arbeid geheel of gedeeltelijk is
      geëindigd en vervolgens na beëindiging van die arbeid een recht op uitkering is ontstaan als bedoeld
      in [artikel 15 van de nieuwe Werkloosheidswet][ref1], herleeft het recht op aanvullende uitkering, voor
      zover geen recht op genoemde uitkering bestaat, met ingang van de dag waarop het recht op die uitkering is
      ontstaan, en overigens met ingang van de eerste dag na het verstrijken van de uitkeringsduur, bedoeld in
      [artikel 42 van die wet][ref2].

      2 Het eerste lid is slechts van toepassing indien de in het eerste lid bedoelde dag is gelegen binnen een tijdvak
      van:

      a. twee jaar ten aanzien van de persoon, bedoeld in [artikel 53, derde lid, onderdeel ][ref3];

      b. vier jaar ten aanzien van de persoon, bedoeld in [artikel 53, derde lid, onderdeel ][ref4];

      c. zes jaar ten aanzien van de persoon, bedoeld in [artikel 53, derde lid, onderdeel ][ref5];

      d. tien jaar ten aanzien van de persoon, bedoeld in [artikel 53, vierde lid][ref6];

      te rekenen vanaf de later gelegen dag, bedoeld in [artikel 53, eerste lid][ref7].

      3 Indien het recht op aanvullende uitkering na een gehele eindiging van dat recht is herleefd op grond van het
      eerste lid, is de uitkeringsduur de duur van de aanvullende uitkering die betrokkene als gevolg van die eindiging
      van het eerdere recht niet heeft ontvangen, doch ten hoogste de duur van de periode beginnend op de dag, bedoeld in
      het eerste lid, en eindigend op de laatste dag van het voor betrokkene geldende tijdvak, bedoeld in het tweede lid.


