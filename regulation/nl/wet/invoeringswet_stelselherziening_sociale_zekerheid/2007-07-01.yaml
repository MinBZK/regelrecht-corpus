  - number: '44'
    text: |-
      1 Ten aanzien van de persoon, die op de dag voorafgaande aan die waarop deze wet in werking treedt, recht had op
      een arbeidsongeschiktheidsuitkering op grond van de Algemene Arbeidsongeschiktheidswet, berekend met toepassing van
      artikel 10, vijfde lid, van die wet, zoals dat lid luidde op de dag voorafgaande aan die waarop deze wet in werking
      treedt, en wiens arbeidsongeschiktheidsuitkering op grond van de Algemene Arbeidsongeschiktheidswet op de dag
      waarop deze wet in werking treedt niet wordt berekend met toepassing van artikel 10, eerste lid, van die wet, wordt
      de voor hem geldende grondslag vermenigvuldigd met de factor 8/7.

      2 Indien toepassing van het eerste lid leidt tot een grondslag, die hoger is dan het bedrag van de grondslag,
      bedoeld in artikel 10, eerste lid, van de Algemene Arbeidsongeschiktheidswet, wordt in afwijking van het eerste lid
      de grondslag vastgesteld op dat bedrag.
    url: https://wetten.overheid.nl/BWBR0004046/2007-07-01#Artikel44
  - number: '45'
    text: |-
      1 De uitkeringsgerechtigde op grond van de Algemene Arbeidsongeschiktheidswet en de Wet op de
      arbeidsongeschiktheidsverzekering, die zowel op de dag, voorafgaande aan die waarop deze wet in werking
      treedt, als op de dag waarop deze wet in werking treedt, recht had op een arbeidsongeschiktheidsuitkering
      op grond van een van die of van beide wetten, berekend naar een arbeidsongeschiktheid van 55 tot
      65% of 65 tot 80%, heeft, zolang hij in dezelfde arbeidsongeschiktheidsklasse blijft ingedeeld, in
      afwijking van artikel 12, eerste lid, van de Algemene Arbeidsongeschiktheidswet, onderscheidenlijk
      [artikel 21, tweede lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref1], recht op een
      arbeidsongeschiktheidsuitkering die per dag, de zaterdagen en de zondagen niet meegerekend, bedraagt bij een
      arbeidsongeschiktheid van:

      55-65%: 44% van de grondslag onderscheidenlijk van 100/108 maal het dagloon of het vervolgdagloon

      65-80%: 57% van de grondslag onderscheidenlijk van 100/108 maal het dagloon of het vervolgdagloon.

      2 Voor de toepassing van het eerste lid wordt te rekenen vanaf 30 januari 1986 een herziening van een
      arbeidsongeschiktheidsuitkering als bedoeld in artikel 28 van de Algemene Arbeidsongeschiktheidswet of
      [artikel 38 van de Wet op de arbeidsongeschiktheidsverzekering][ref2], geacht niet te hebben plaatsgevonden,
      indien de uitkeringsgerechtigde binnen 48 weken na de herziening weer wordt ingedeeld in dezelfde
      arbeidsongeschiktheidsklasse als voor die herziening.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel38
    url: https://wetten.overheid.nl/BWBR0004046/2007-07-01#Artikel45
