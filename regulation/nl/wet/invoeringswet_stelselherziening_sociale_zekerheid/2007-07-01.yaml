  - number: '22'
    text: |-
      1 Ten aanzien van de persoon, bedoeld in de [artikelen 4][ref1], [5, vierde lid][ref2], en [6][ref3],
      bedraagt de uitkering per dag 70% van het dagloon dat gold op de dag, voorafgaande aan die waarop de nieuwe
      [Werkloosheidswet][ref4] in werking treedt.

      2 Indien voor de persoon, bedoeld in de [artikelen 4][ref5], [5, vierde lid][ref6], en [6][ref7], op de dag
      voorafgaande aan die waarop de nieuwe [Werkloosheidswet][ref8] op hem van toepassing wordt als dagloon het
      minimumdagloon in aanmerking werd genomen, blijft, zodra de nieuwe [Werkloosheidswet][ref9] op hem van toepassing
      wordt, het minimumdagloon voor hem gelden zolang hij voldoet aan de voorwaarden zoals deze op de dag voorafgaande
      aan die waarop de nieuwe [Werkloosheidswet][ref10] in werking treedt op grond van de [Werkloosheidswet][ref11] of
      de [Wet Werkloosheidsvoorziening][ref12] en de daarop berustende bepalingen zijn gesteld.

      3 Indien voor de persoon, bedoeld in de [artikelen 4][ref13], [5, vierde lid][ref14], en [6][ref15], op de dag
      voorafgaande aan die waarop de nieuwe [Werkloosheidswet][ref16] op hem van toepassing wordt, het minimumdagloon in
      aanmerking werd genomen met toepassing van [artikel 12](onbekend) of [5][ref17], wordt voor het recht op toeslag
      op grond van de [Toeslagenwet][ref18] als dagloon aangemerkt 70% van het voor deze persoon in aanmerking genomen
      minimumdagloon.

      In afwijking van de op grond van [artikel 12](onbekend) en [artikel 5][ref19] gestelde regels wordt het dagloon,
      bedoeld in [artikel 22][ref20], herzien overeenkomstig [artikel 46 van de nieuwe Werkloosheidswet][ref21].


