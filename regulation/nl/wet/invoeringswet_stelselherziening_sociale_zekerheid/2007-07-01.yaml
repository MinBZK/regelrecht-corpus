  - number: '6'
    text: |-
      1 In afwijking van de [artikelen 4, eerste lid][ref1], en [5, eerste lid][ref2], is ten aanzien van de persoon
      die op de eerste dag van werkloosheid 57,5 jaar of ouder was en op de dag, voorafgaande aan die waarop de nieuwe
      [Werkloosheidswet][ref3] in werking treedt, recht had op uitkering op grond van de [Werkloosheidswet][ref4] of de
      [Wet Werkloosheidsvoorziening][ref5], de nieuwe [Werkloosheidswet][ref6] van toepassing.

      2 [Artikel 4, tweede lid][ref7], en [artikel 5, tweede lid][ref8], zijn van overeenkomstige
      toepassing met betrekking tot het eerste lid, met dien verstande dat voor de persoon op wie
      [artikel 4, tweede lid, onderdeel ][ref9], of [artikel 5, tweede lid, onderdeel ][ref10], van toepassing
      is, als eerste dag van werkloosheid wordt beschouwd de eerste dag dat hij recht op uitkering op grond
      van de [Werkloosheidswet][ref11] of vanaf het bereiken van de leeftijd van 58 jaar op grond van de
      [Wet Werkloosheidsvoorziening][ref12] zou hebben gehad.

      3 De arbeidsverhouding van de persoon, bedoeld in het eerste en tweede lid, aan wie door het Rijk ter zake van
      zijn arbeidsverhouding invaliditeitspensioen is verzekerd, wordt als dienstbetrekking in de zin van de nieuwe
      [Werkloosheidswet][ref13] beschouwd.


