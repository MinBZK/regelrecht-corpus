  - number: '55'
    text: |-
      1 Met betrekking tot de aanvullende uitkering en de aanvullende vervolguitkering zijn de [artikelen 20][ref1],
      [22 tot en met 40][ref2], [76][ref3], [128][ref4] en [129 van de nieuwe Werkloosheidswet][ref5] van overeenkomstige
      toepassing.

      2 De persoon, die in verband met werkloosheid recht heeft op aanvullende uitkering of aanvullende vervolguitkering,
      heeft ter zake van dezelfde werkloosheid geen recht op uitkering op grond van de nieuwe [Werkloosheidswet][ref6].

      3 De aanvullende uitkering en de aanvullende vervolguitkering worden, voor zover in deze wet of de daarop
      berustende bepalingen niet anders is bepaald, voor de toepassing van wettelijke bepalingen beschouwd als uitkering
      op grond van de nieuwe [Werkloosheidswet][ref7].

      4 De aanvullende uitkering en de aanvullende vervolguitkering komen ten laste van het Algemeen
      Arbeidsongeschiktheidsfonds, bedoeld in [artikel 34 van de Wet financiering volksverzekeringen][ref8] en het
      Arbeidsongeschiktheidsfonds, bedoeld in [artikel 72 van de Wet op de arbeidsongeschiktheidsverzekering][ref9].

      5 Onze Minister stelt regels met betrekking tot de verdeling van de lasten, bedoeld in het vierde lid, over de in
      dat lid genoemde fondsen.


