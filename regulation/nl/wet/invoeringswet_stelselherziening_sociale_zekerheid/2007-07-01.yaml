  - number: '48'
    text: |-
      1 De persoon, die 21 jaar of ouder is, die voor de toepassing van de [Toeslagenwet][ref1]
      niet als gehuwd wordt aangemerkt en voor wie de algemene heffingskorting, bedoeld in
      [artikel 22 van de Wet op de loonbelasting 1964][ref2], maar niet de alleenstaande-ouderkorting,
      bedoeld in [artikel 8.15 van de Wet inkomstenbelasting 2001][ref3], van toepassing is en die
      recht heeft op uitkering op grond van de [Wet werk en inkomen naar arbeidsvermogen][ref4], de
      [Wet op de arbeidsongeschiktheidsverzekering][ref5], de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref6]
      of de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref7] of meer van deze wetten
      gezamenlijk, in verband met een arbeidsongeschiktheid van 80% of meer, en berekend naar een
      dagloon als bedoeld in [artikel 13 van de Wet werk en inkomen naar arbeidsvermogen ][ref8]dan wel
      [artikel 14 van de Wet op de arbeidsongeschiktheidsverzekering][ref9] of een vervolgdagloon als bedoeld in
      [artikel 21b van de Wet op de arbeidsongeschiktheidsverzekering][ref10], dat ten minste gelijk is aan 70% van het
      minimumloon, bedoeld in [artikel 12, eerste lid, onderdeel b, van de Wet werk en inkomen naar arbeidsvermogen][ref11]
      en [13, tweede lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref12], of berekend
      naar een grondslag die ten minste gelijk is aan 70% van het minimumloon als bedoeld in
      [artikel 8, zevende lid, van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref13], of
      [artikel 7, tweede lid, van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref14], heeft recht op en
      verhoging van zijn uitkering, indien zijn uitkering per dag, indien hij 21 jaar, 22 jaar, onderscheidenlijk 23 jaar
      of ouder is, minder bedraagt dan € 28,09, € 34,46, onderscheidenlijk € 44,25.

      2 De in het eerste lid bedoelde verhoging bedraagt het verschil tussen het voor betrokkene geldende bedrag, genoemd
      in het eerste lid, en de uitkering per dag, doch ten hoogste het verschil tussen het voor betrokkene geldende
      bedrag, genoemd in het eerste lid, en 70% van het minimumloon, zijnde het minimumloon per maand, bedoeld in
      [artikel 8, eerste lid, onderdeel a, van de Wet minimumloon en minimumvakantiebijslag][ref15], gedeeld door 21,75,
      of, indien het een persoon jonger dan 23 jaar betreft, het minimumloon per maand dat voor zijn leeftijd geldt op
      grond van [artikel 7, derde lid][ref16], en [artikel 8, derde lid van genoemde wet,][ref17], gedeeld door 21,75.

      3 Voor de toepassing van het eerste en tweede lid wordt onder uitkering verstaan het totaalbedrag
      aan uitkering per dag op grond van de [Wet werk en inkomen naar arbeidsvermogen][ref18], de
      [Wet op de arbeidsongeschiktheidsverzekering][ref19], de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref20]
      en de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref21].

      4 Bij ministeriële regeling worden regels gesteld inzake het aanmerken van de in het eerste lid bedoelde
      verhoging als een uitkering op grond van de [Wet werk en inkomen naar arbeidsvermogen][ref22], de
      [Wet op de arbeidsongeschiktheidsverzekering][ref23], de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref24]
      of de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref25].

      5 De bedragen, genoemd in het eerste lid, worden door Onze Minister herzien op dezelfde wijze en op hetzelfde
      tijdstip als waarop de bedragen, genoemd in [hoofdstuk 3 van de Wet werk en bijstand][ref26] worden herzien, waarna
      de herziene bedragen voor de in het eerste lid genoemde bedragen in de plaats treden.


