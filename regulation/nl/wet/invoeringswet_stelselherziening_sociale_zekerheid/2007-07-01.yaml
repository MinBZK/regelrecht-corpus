  - number: '37'
    text: |-
      1 Vanaf de dag, waarop de nieuwe [Werkloosheidswet][ref1] in werking treedt, vindt geen vergoeding aan de gemeente
      plaats van de kosten, bedoeld in [artikel 40, onderdeel ][ref2].

      2 Het Rijk verstrekt gedurende vier perioden van twaalf maanden vanaf de dag waarop de nieuwe
      [Werkloosheidswet][ref3] in werking treedt, aan de gemeente een uitkering, die is gebaseerd op de kosten die over
      het dienstjaar 1984 op grond van [artikel 40, onderdeel ][ref4] aan de gemeente zijn vergoed.

      3 De uitkering, bedoeld in het tweede lid, bedraagt gedurende de eerste tot en met de vierde periode van 12 maanden
      vanaf de dag waarop de nieuwe [Werkloosheidswet][ref5] in werking treedt, onderscheidenlijk 80%, 60%, 40% en 20%
      van de in het tweede lid bedoelde kosten.

      4 Vanaf 1 januari 1991 verstrekt het Rijk aan de gemeente een uitkering van f 1050,- per toegewezen aanvraag.

      5 Onze Minister is bevoegd de verstrekte uitkering, bedoeld in het tweede en het vierde lid, gedeeltelijk terug te
      vorderen of te verrekenen, indien het gemeentebestuur niet of in onvoldoende mate voldoet aan zijn verplichtingen,
      bedoeld in [artikel 26, eerste lid, van de Wet Werkloosheidsvoorziening][ref6].

      6 Onze Minister is bevoegd met betrekking tot de wijze van verstrekking van de in dit artikel bedoelde uitkeringen
      nadere regels te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0002470#Artikel40
