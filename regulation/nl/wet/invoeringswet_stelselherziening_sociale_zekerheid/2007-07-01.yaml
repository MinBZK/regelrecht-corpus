  - number: 64a
    text: |-
      1 De persoon die 21 jaar of ouder is, die voor de toepassing van de [Toeslagenwet][ref1]
      niet als gehuwd wordt aangemerkt en voor wie de algemene heffingskorting, bedoeld in
      [artikel 22 van de Wet op de loonbelasting 1964][ref2], maar niet de alleenstaande-ouderkorting, bedoeld in
      [artikel 8.15 van de Wet inkomstenbelasting 2001][ref3], van toepassing is en die recht heeft op uitkering op grond
      van de [Ziektewet][ref4], berekend naar een dagloon dat ten minste gelijk is aan 70% van het minimumloon, heeft
      recht op een verhoging van zijn uitkering op grond van de [Ziektewet][ref5], indien die uitkering per dag, indien
      hij 21 jaar, 22 jaar onderscheidenlijk 23 jaar of ouder is, minder bedraagt dan f 50,33, f 61,78, onderscheidenlijk
      f 79,-.

      2 De in het eerste lid bedoelde verhoging bedraagt het verschil tussen het bedrag, genoemd in het eerste lid, en
      de uitkering per dag op grond van de [Ziektewet][ref6], doch ten hoogste het verschil tussen het voor betrokkene
      geldende bedrag, genoemd in het eerste lid, en 70% van het minimumloon, zijnde het minimumloon per maand, bedoeld
      in [artikel 8, eerste lid, onderdeel a, van de Wet minimumloon en minimumvakantiebijslag][ref7], gedeeld door
      21,75, of, indien het een persoon jonger dan 23 jaar betreft, het minimumloon per maand dat voor zijn leeftijd
      geldt op grond van [artikel 7, derde lid][ref8], en [artikel 8, derde lid, van genoemde wet][ref9], gedeeld door
      21,75.

      3 Onder het in het eerste lid bedoelde minimumloon wordt verstaan het minimumloon per maand, bedoeld in
      [artikel 8, eerste lid, onderdeel a, van de Wet minimumloon en minimumvakantiebijslag][ref10] of, indien het
      een persoon jonger dan 23 jaar betreft, het minimumloon per maand dat voor zijn leeftijd geldt op grond van
      [artikel 7, derde lid][ref11], en [artikel 8, derde lid, van die wet][ref12], beide vermeerderd met de daarover
      berekende vakantiebijslag, bedoeld in [artikel 15 van die wet][ref13], en vervolgens gedeeld door 21,75.

      4 De bedragen, genoemd in het eerste lid, worden door Onze Minister herzien op dezelfde wijze en op hetzelfde
      tijdstip als waarop de bedragen genoemd in [hoofdstuk 3 van de Wet werk en bijstand][ref14] worden herzien, waarna
      de herziene bedragen voor de in het eerste lid genoemde bedragen in de plaats treden.


