  - number: '23'
    text: |-
      In afwijking van de op grond van artikel 12a van de Werkloosheidswet en artikel 5a van de Wet
      Werkloosheidsvoorziening gestelde regels wordt het dagloon, bedoeld in artikel 22, herzien overeenkomstig artikel
      46 van de nieuwe Werkloosheidswet.
    url: https://wetten.overheid.nl/BWBR0004046/2007-07-01#Artikel23
  - number: '24'
    text: |-
      1 De persoon die 21 jaar of ouder is, die voor de toepassing van de [Toeslagenwet][ref1]
      niet als gehuwd wordt aangemerkt en voor wie de algemene heffingskorting, bedoeld in
      [artikel 22 van de Wet op de loonbelasting 1964][ref2], maar niet de alleenstaande-ouderkorting, bedoeld in
      [artikel 8.15 van de Wet inkomstenbelasting 2001][ref3], van toepassing is en die recht heeft op uitkering
      op grond van de [Werkloosheidswet][ref4] of de nieuwe [Werkloosheidswet][ref5] die bij de aanvang van de
      werkloosheid is berekend naar een dagloon dat ten minste gelijk is aan 70% van het minimumloon, bedoeld in
      [artikel 14, tweede lid, van de nieuwe Werkloosheidswet][ref6], heeft recht op een verhoging van zijn uitkering op
      grond van de [Werkloosheidswet][ref7] of [hoofdstuk II van de nieuwe Werkloosheidswet][ref8], indien die uitkering
      per dag, indien hij 21 jaar, 22 jaar onderscheidenlijk 23 jaar of ouder is, minder bedraagt dan f 47,96, f 55,77
      onderscheidenlijk f 65,50.

      2 De in het eerste lid bedoelde verhoging bedraagt het verschil tussen het bedrag, genoemd in het eerste lid, en de
      uitkering per dag op grond van de [Werkloosheidswet][ref9] of [hoofdstuk II van de nieuwe Werkloosheidswet][ref10]
      dan wel, indien tegelijkertijd recht bestaat op meerdere uitkeringen op grond van de nieuwe
      [Werkloosheidswet][ref11], het totaalbedrag van die uitkeringen, doch ten hoogste het verschil tussen het
      bedrag, genoemd in het eerste lid, en 70% van het minimumloon, zijnde het minimumloon per maand, bedoeld in
      [artikel 8, eerste lid, onderdeel a, van de Wet minimumloon en minimumvakantiebijslag][ref12], gedeeld door 21,75,
      of, indien het een persoon jonger dan 23 jaar betreft, het minimumloon per maand dat voor zijn leeftijd geldt op
      grond van [artikel 7, derde lid][ref13], en [artikel 8, derde lid, van genoemde wet][ref14], gedeeld door 21,75.

      3 De bedragen, genoemd in het eerste lid, worden door Onze Minister herzien op dezelfde wijze en op hetzelfde
      tijdstip als waarop de bedragen genoemd in [hoofdstuk 3 van de Wet werk en bijstand][ref15] worden herzien, waarna
      de herziene bedragen voor de in het eerste lid genoemde bedragen in de plaats treden.


      [ref1]: https://wetten.overheid.nl/BWBR0004043
