  - number: '79'
    text: |-
      1 Waar in deze wet nummeringen van artikelen en van leden van artikelen en aanduidingen van onderdelen van
      artikelen worden aangehaald van:

      a. de nieuwe [Werkloosheidswet][ref1]

      b. de [Toeslagenwet][ref2]

      c. de Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers

      d. de Wijzigingswet AAW/WAO

      e. de Wijzigingswet ABW

      worden deze door Onze Minister in overeenstemming gebracht met de nummering en de aanduiding, zoals deze komen te
      luiden indien de voorstellen van de onder *a* tot en met *e* bedoelde wetten tot wet zijn verheven.

      2 De tekst van deze wet, zoals die luidt na toepassing van het eerste lid, wordt door Onze Minister van Justitie in
      het *Staatsblad* geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0004043
