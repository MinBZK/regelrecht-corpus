  - number: '51'
    text: |-
      In deze afdeling en de daarop berustende bepalingen wordt verstaan onder
      arbeidsongeschiktheidsuitkering een uitkering op grond van de Algemene Arbeidsongeschiktheidswet of de
      [Wet op de arbeidsongeschiktheidsverzekering][ref1] of beide wetten.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0004046/2007-07-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0002524
  - number: '52'
    text: |-
      1 De artikelen 5, 12, tweede tot en met vierde lid, en 23, van de Algemene
      Arbeidsongeschiktheidswet en de [artikelen 18][ref1], [21, tweede tot en met vierde lid][ref2], en
      [32 van de Wet op de arbeidsongeschiktheidsverzekering][ref3], zoals die artikelen luidden op de dag, voorafgaande
      aan die waarop de Wijzigingswet AAW/WAO in werking treedt, blijven van toepassing op de persoon die op die dag
      recht had op een arbeidsongeschiktheidsuitkering en op die dag de leeftijd van 35 jaar heeft bereikt.

      2 De artikelen 5, 12, tweede tot en met vierde lid, en artikel 23 van de Algemene Arbeidsongeschiktheidswet, zoals
      die artikelen luidden op de dag, voorafgaande aan die, waarop de Wijzigingswet AAW/WAO in werking treedt, blijven
      van toepassing op de persoon, die op die dag recht had op een arbeidsongeschiktheidsuitkering op grond van artikel
      6, eerste lid, onderdeel *b*, van die wet.

      3 Vanaf de datum dat de Wet terugdringing beroep op de arbeidsongeschiktheidsregelingen (*Stb.* 1993, 412) in
      werking is getreden vinden de voorgaande leden nog slechts toepassing met betrekking tot personen die op die datum
      de leeftijd van 45 jaar hebben bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel18
