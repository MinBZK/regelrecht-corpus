  - number: '78'
    text: |-
      1 In de [artikelen 36, eerste lid, van de nieuwe Werkloosheidswet][ref1], 48, eerste lid, van de Algemene
      Arbeidsongeschiktheidswet, [57, eerste lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref2],
      [33, eerste lid, van de Ziektewet][ref3], 1, onderdeel *h*, van de
      Organisatiewet Sociale Verzekering, [6, eerste lid, onderdeel ][ref4],
      [9, vierde lid, van de Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref5]
      en [26, derde lid, onderdeel ][ref6], zoals deze luiden op de dag, waarop deze wet in werking treedt, wordt na
      "[Toeslagenwet][ref7]" op de gebruikelijke wijze ingevoegd de jaargang en het nummer van het *Staatsblad* waarin de
      [Toeslagenwet][ref8] is geplaatst.

      2 In de [artikelen 37, eerste lid, van de nieuwe Werkloosheidswet][ref9],
      [21, eerste lid, van de Toeslagenwet][ref10], 49, eerste lid, van de Algemene Arbeidsongeschiktheidswet, [57][ref11],
      [33][ref12], en [26, derde lid, onderdeel ][ref13], zoals deze luiden op de dag, waarop deze wet in werking
      treedt, wordt na "[Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref14]"
      op de gebruikelijke wijze ingevoegd de jaargang en het nummer van het *Staatsblad*, waarin de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref15] is geplaatst.

      3 In de [artikelen 2, eerste lid, onderdeel ][ref16], [1, eerste lid, onderdeel ][ref17], zoals deze luiden op de
      dag, waarop deze wet in werking treedt, wordt na "[Werkloosheidswet][ref18]" op de gebruikelijke wijze ingevoegd de
      jaargang en het nummer van het *Staatsblad* waarin de nieuwe [Werkloosheidswet][ref19] is geplaatst.


