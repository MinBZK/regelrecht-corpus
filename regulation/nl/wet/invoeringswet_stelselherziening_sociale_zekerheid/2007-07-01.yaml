    text: Hetgeen nog ter uitvoering van deze wet nodig is, wordt door Onze Minister geregeld.
    url: https://wetten.overheid.nl/BWBR0004046/2007-07-01#Artikel80
  - number: '81'
    text: |-
      1 Deze wet, met uitzondering van [artikel 40, onderdeel S][ref1],
      de nieuwe [Werkloosheidswet][ref2], de [Toeslagenwet][ref3], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref4], de Wijzigingswet
      AAW/WAO, de Wijzigingswet ABW en de Wijzigingswet AOW treden in werking op een bij koninklijk besluit te bepalen
      tijdstip, dat voor de verschillende wetten en artikelen of onderdelen daarvan verschillend kan worden gesteld.

      2 [Artikel 40, onderdeel S][ref5], treedt in werking op 1 januari 1987.


