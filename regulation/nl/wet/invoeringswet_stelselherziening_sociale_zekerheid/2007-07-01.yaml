      1 De persoon die recht heeft op de aanvullende uitkering, bedoeld in [artikel 53][ref1], heeft na het
      verstrijken van de daarvoor geldende uitkeringsduur aansluitend recht op aanvullende vervolguitkering gedurende
      een jaar, indien hij voldoet aan de voorwaarden, bedoeld in de [artikelen 15][ref2] en [16][ref3], alsmede
      [42, tweede tot en met negende lid][ref4], of [artikel 48, tweede lid, van de nieuwe Werkloosheidswet][ref5] en op
      wie geen uitsluitingsgrond als bedoeld in [artikel 19 van die wet][ref6] van toepassing is.

      2 Het bedrag van de aanvullende vervolguitkering wordt berekend met overeenkomstige toepassing van de
      [artikelen 51][ref7] en [52 van de nieuwe Werkloosheidswet][ref8].


