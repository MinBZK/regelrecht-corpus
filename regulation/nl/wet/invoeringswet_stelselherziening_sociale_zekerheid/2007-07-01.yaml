  - number: '7'
    text: |-
      1 De persoon die op de dag, voorafgaande aan die waarop de nieuwe [Werkloosheidswet][ref1]
      in werking treedt, recht had op uitkering op grond van de [Werkloosheidswet][ref2] of
      [hoofdstuk III van de Wet Werkloosheidsvoorziening][ref3] en op de eerste dag van werkloosheid 47,5
      jaar of ouder is, heeft na afloop van de uitkeringsduur, bedoeld in [artikel 17][ref4] of bedoeld in
      de [Wet Werkloosheidsvoorziening][ref5], recht op uitkering op grond van de Wet inkomensvoorziening
      oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers, tenzij dat anders dan op grond van
      [artikel 2, eerste lid, onderdeel ][ref6], van laatstgenoemde wet wordt verhinderd.

      2 De persoon die op de dag, voorafgaande aan die waarop de nieuwe [Werkloosheidswet][ref7] in werking
      treedt, recht had op uitkering op grond van [hoofdstuk III](onbekend), heeft met ingang van de dag waarop de
      nieuwe [Werkloosheidswet][ref8] in werking treedt recht op uitkering op grond van de Wet inkomensvoorziening
      oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers, tenzij dat anders dan op grond van
      [artikel 2, eerste lid, onderdeel ][ref9], van laatstgenoemde wet wordt verhinderd.

      3 [Artikel 4, tweede lid][ref10], en [artikel 5, tweede lid][ref11], zijn van overeenkomstige
      toepassing met betrekking tot het eerste lid, met dien verstande dat voor de persoon op wie
      [artikel 4, tweede lid, onderdeel ][ref12], of [artikel 5, tweede lid, onderdeel ][ref13], van toepassing
      is, als eerste dag van werkloosheid wordt beschouwd de eerste dag dat hij recht op uitkering op
      grond van de [Werkloosheidswet][ref14] of vanaf het bereiken van de leeftijd van 48 jaar op grond van
      [Hoofdstuk III van de Wet Werkloosheidsvoorziening][ref15] zou hebben gehad.

      4 Het eerste lid is van overeenkomstige toepassing op de persoon, bedoeld in het tweede lid, die op de dag,
      voorafgaande aan die waarop de nieuwe [Werkloosheidswet][ref16] in werking treedt, geen recht had op een uitkering
      op grond van [hoofdstuk III](onbekend), omdat dat recht is onderbroken door werkaanvaarding of een omstandigheid
      als bedoeld in [artikel 5, tweede lid][ref17], doch die na afloop van die onderbreking recht zou hebben gehad op
      deze uitkering, indien dat hoofdstuk niet zou zijn vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
