  - number: '21'
    text: |-
      1 De persoon die op de dag, onmiddellijk voorafgaande aan het intreden van zijn werkloosheid, werknemer in de zin
      van de nieuwe [Werkloosheidswet][ref1] was, wordt voor de toepassing van de [artikelen 17 , onderdeel ][ref2], en
      [17][ref3] als werknemer in de zin van die wet beschouwd gedurende de periode waarin hij:

      a. voor de dag, waarop de nieuwe [Werkloosheidswet][ref4] in werking treedt, als werknemer in de zin van de
      [Werkloosheidswet][ref5] of de [Wet Werkloosheidsvoorziening][ref6] in dienstbetrekking heeft gestaan dan wel zijn
      militaire dienstplicht of in plaats daarvan vervangende dienst heeft vervuld;

      b. vanaf de dag, waarop de nieuwe [Werkloosheidswet][ref7] in werking treedt, een arbeidsverhouding had ter zake
      waarvan hem door het Rijk invaliditeitspensioen was verzekerd.

      2 Ten aanzien van de persoon, bedoeld in [artikel 12, derde en vijfde lid, is het eerste lid, onderdeel ][ref8],
      van overeenkomstige toepassing.

      3 Met betrekking tot de periode voor de dag, waarop de nieuwe [Werkloosheidswet][ref9] in werking treedt, is
      [artikel 17, derde lid][ref10], van overeenkomstige toepassing.

      4 Met betrekking tot de periode vanaf de dag, waarop de nieuwe [Werkloosheidswet][ref11] in werking treedt, is
      [artikel 17, derde lid, onderdeel ][ref12], van overeenkomstige toepassing.

      5 Onze Minister is bevoegd met betrekking tot dit artikel nadere en zo nodig afwijkende regels te stellen.


