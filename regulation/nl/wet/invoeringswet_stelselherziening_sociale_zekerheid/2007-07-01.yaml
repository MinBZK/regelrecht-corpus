  - number: '18'
    text: |-
      Indien het recht op uitkering op grond van de [Werkloosheidswet][ref1] van de persoon, bedoeld in
      [artikel 4, eerste en tweede lid][ref2], door het verrichten van arbeid als werknemer is geëindigd en vervolgens
      na beëindiging van die arbeid op een tijdstip, gelegen binnen vijf jaar na inwerkingtreding van de nieuwe
      [Werkloosheidswet][ref3], recht op uitkering is ontstaan op grond van de nieuwe [Werkloosheidswet][ref4],
      zonder dat aan de voorwaarde, bedoeld in [artikel 42, tweede lid, onderdeel ][ref5] wordt voldaan,
      wordt de duur van die uitkering voor zover de werknemer ter zake van het eerstbedoelde recht aan de in
      [artikel 17, eerste en tweede lid][ref6], genoemde voorwaarden voldeed, verlengd met de duur, bedoeld in die leden.


