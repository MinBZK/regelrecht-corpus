  - number: '14'
    text: |-
      1 Indien ten aanzien van de persoon, bedoeld in artikel 4, op de dag, voorafgaande aan die waarop de nieuwe
      [Werkloosheidswet][ref1] op hem van toepassing wordt, [artikel 31, eerste lid, onderdeel ][ref2], zo nodig in
      verbinding met [artikel 39 van de Werkloosheidswet][ref3] van toepassing was en ten aanzien van de persoon, bedoeld
      in [artikel 6][ref4], op dat tijdstip [artikel 14 van de Wet Werkloosheidsvoorziening][ref5] van toepassing was,
      wordt deze toepassing voortgezet, tenzij het Uitvoeringsinstituut werknemersverzekeringen met gebruikmaking van
      zijn bevoegdheid, bedoeld in [artikel 27, eerste en tweede lid, van de nieuwe Werkloosheidswet][ref6], anders
      beslist.

      2 Bij het gebruik maken van de bevoegdheid, bedoeld in
      [artikel 27, eerste en tweede lid, van de nieuwe Werkloosheidswet][ref7], kan het Uitvoeringsinstituut
      werknemersverzekeringen de uitkering niet verder weigeren en de uitkeringsduur niet verder beperken
      dan de mate waarin en de duur waarover uitsluiting of verlaging van de uitkering op grond van
      [artikel 31, eerste lid, onderdeel ][ref8], zonodig in verbinding met [artikel 39 van de Werkloosheidswet][ref9]
      of [artikel 14 van de Wet Werkloosheidsvoorziening][ref10] nog zou hebben plaatsgehad, indien de nieuwe
      [Werkloosheidswet][ref11] niet in werking was getreden.


