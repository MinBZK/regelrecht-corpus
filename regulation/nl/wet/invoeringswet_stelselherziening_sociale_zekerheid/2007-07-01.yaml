  - number: '5'
    text: |-
      1 De [Wet Werkloosheidsvoorziening][ref1] en de daarop berustende bepalingen blijven van toepassing ten aanzien
      van de persoon die op de dag, voorafgaande aan die waarop de nieuwe [Werkloosheidswet][ref2] in werking treedt,
      recht had op uitkering op grond van de Wet Werkloosheidsvoorziening, zolang geen recht op uitkering op grond van de
      nieuwe [Werkloosheidswet][ref3] is ontstaan.

      2 Met de in het eerste lid bedoelde persoon wordt gelijkgesteld, de persoon die op de dag, voorafgaande aan
      die waarop de nieuwe [Werkloosheidswet][ref4] in werking treedt, geen recht op uitkering op grond van de
      [Wet Werkloosheidsvoorziening][ref5] had, omdat:

      a. het recht op uitkering op grond van die wet was onderbroken door werkaanvaarding of door een omstandigheid als
      bedoeld in [artikel 13, eerste lid][ref6], of [artikel 14, eerste lid, van die wet][ref7];

      b. na het intreden van zijn werkloosheid zijn werkgever tijdens het voortbestaan van de dienstbetrekking het loon
      onverminderd doorbetaalde;

      doch die, zodra de omstandigheid, bedoeld in onderdeel *a* of *b*, niet meer op hem van toepassing is vervolgens
      wel recht op uitkering op grond van die wet heeft.

      3 In afwijking van het eerste en het tweede lid zijn de Wet Werkloosheidsvoorziening en de daarop berustende
      bepalingen niet meer op de in die leden bedoelde personen van toepassing, indien in de periode gelegen twee jaar
      na de dag waarop de nieuwe [Werkloosheidswet][ref8] in werking is getreden geen recht op uitkering bestaat, omdat
      dat recht is onderbroken door een omstandigheid als bedoeld in [artikel 13, eerste lid, onderdeel ][ref9], of
      [artikel 14, eerste lid, van de Wet Werkloosheidsvoorziening][ref10].

      4 De persoon die in de periode gelegen twee jaar na de dag, bedoeld in het derde lid, geen recht op uitkering op
      grond van de [Wet Werkloosheidsvoorziening][ref11] heeft, omdat dat recht is onderbroken door een omstandigheid als
      bedoeld in [artikel 13, eerste lid, onderdeel ][ref12], heeft na afloop van die onderbreking recht op uitkering op
      grond van de nieuwe [Werkloosheidswet][ref13].

      5 Het eerste en tweede lid gelden niet, indien ten aanzien van de in die leden bedoelde persoon tevens
      [artikel 4][ref14] van toepassing is.


