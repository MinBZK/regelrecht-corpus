preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regels te stellen met betrekking tot de intrekking
    van de Werkloosheidswet, de invoering van de nieuwe Werkloosheidswet, de Toeslagenwet, de Wet inkomensvoorziening
    oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers, de Wet, houdende nadere wijziging van de Algemene
    Arbeidsongeschiktheidswet en de Wet op de arbeidsongeschiktheidsverzekering (nadere regeling in verband met
    verminderde gelegenheid tot het verkrijgen van arbeid), de Wet, houdende wijziging van de Algemene Bijstandswet
    met betrekking tot de gelijke behandeling van mannen en vrouwen en gelijkstelling van niet gehuwde personen met
    gehuwden en de Wet, houdende wijziging van de Algemene Ouderdomswet (gelijkstelling niet-gehuwde personen met
    gehuwden of echtgenoten), alsmede regels te stellen met betrekking tot het in het kader van die intrekking en
    invoering noodzakelijke overgangsrecht, en voorts een aantal wetten en regelingen in verband daarmee aan te passen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004046/2007-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Sociale Zaken en Werkgelegenheid;

      b. [Werkloosheidswet][ref1]: de [Werkloosheidswet][ref2] (*Stb.* 1967, 421) zoals die wet luidde op de dag,
      voorafgaande aan die waarop de nieuwe [Werkloosheidswet][ref3] in werking treedt;

      c. Wet Werkloosheidsvoorziening: de Wet Werkloosheidsvoorziening (*Stb.* 1964, 485) zoals die wet luidde op de dag,
      voorafgaande aan die waarop deze wet in werking treedt;

      d. nieuwe [Werkloosheidswet][ref4]: het bij koninklijke boodschap van 17 oktober 1985 (kamerstukken II, 1985-1986,
      19 261) ingediende voorstel van wet tot verzekering van werknemers tegen geldelijke gevolgen van werkloosheid,
      zoals dat tot wet wordt verheven;

      e. [Toeslagenwet][ref5]: het bij koninklijke boodschap van 17 oktober 1985 (kamerstukken II, 1985-
      1986, 19 257) ingediende voorstel van wet tot verlening van toeslagen tot het relevante sociaal
      minimum aan uitkeringsgerechtigden op grond van de [Werkloosheidswet][ref6], de [Ziektewet][ref7], de
      Algemene Arbeidsongeschiktheidswet, de [Wet op de arbeidsongeschiktheidsverzekering][ref8] en de Wet
      arbeidsongeschiktheidsvoorziening militairen, die een of meer personen tot hun financiële last hebben, zoals dat
      tot wet wordt verheven;

      f. [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref9]: het bij
      koninklijke boodschap van 17 oktober 1985 (kamerstukken II, 1985-1986, 19 260) ingediende voorstel van wet tot het
      treffen van een inkomensvoorziening voor oudere werkloze werknemers van wie het recht op een uitkering op grond van
      de [Werkloosheidswet][ref10] is geëindigd, zoals dat tot wet wordt verheven;

      g. Wijzigingswet AAW/WAO: het bij koninklijke boodschap van 17 oktober 1985 (kamerstukken II, 1985-1986,
      19 256) ingediende voorstel van wet tot nadere wijziging van de Algemene Arbeidsongeschiktheidswet en de
      [Wet op de arbeidsongeschiktheidsverzekering][ref11], zoals dat tot wet wordt verheven;

      h. Wijzigingswet ABW: het bij koninklijke boodschap van 17 oktober 1985 (kamerstukken II, 1985-1986, 19 259)
      ingediende voorstel van wet tot wijziging van de Algemene Bijstandswet met betrekking tot de gelijke behandeling
      van mannen en vrouwen en gelijkstelling van niet gehuwde personen met gehuwden, zoals dat tot wet wordt verheven;

      i. Wijzigingswet AOW: het bij koninklijke boodschap van 17 oktober 1985 (kamerstukken II, 1985-1986, 19 258)
      ingediende voorstel van wet tot wijziging van de [Algemene Ouderdomswet][ref12] (gelijkstelling niet-gehuwde
      personen met gehuwden of echtgenoten), zoals dat tot wet wordt verheven;

      j. Uitvoeringsinstituut werknemersverzekeringen: het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref13].

      k. gemeentebestuur: burgemeester en wethouders.

      2 Voor de toepassing van deze wet en van de tot haar uitvoering genomen besluiten wordt gelijkgesteld met:

      a. echtgenoot: geregistreerde partner;

      b. gehuwd: als partner geregistreerd.


