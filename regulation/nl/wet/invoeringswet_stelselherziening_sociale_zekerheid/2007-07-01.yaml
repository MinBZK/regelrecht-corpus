    text: |-
      In afwijking van [artikel 42, eerste en tweede lid][ref1], en [artikel 49 van de nieuwe Werkloosheidswet][ref2],
      eindigt de uitkeringsduur voor de persoon, bedoeld in [artikel 6][ref3], op de eerste dag van de maand waarin hij
      de leeftijd van 65 jaar bereikt. Het [vierde lid van artikel 17][ref4] is van overeenkomstige toepassing.


