  - number: '53'
    text: |-
      1 De persoon die op de dag, voorafgaande aan die waarop de Wijzigingswet AAW/WAO in werking treedt, recht had
      op een arbeidsongeschiktheidsuitkering, berekend naar een arbeidsongeschiktheid van 80% of meer en op die dag
      de leeftijd van 35 jaar nog niet heeft bereikt, en wiens arbeidsongeschiktheid als gevolg van het bepaalde in de
      Wijzigingswet AAW/WAO met ingang van een later gelegen dag minder bedraagt dan 80%, heeft met ingang van die later
      gelegen dag recht op aanvullende uitkering.

      2 Geen recht op aanvullende uitkering heeft de persoon die niet voldoet aan de voorwaarden voor het recht op
      werkloosheidsuitkering, bedoeld in de [artikelen 15 tot en met 17 van de nieuwe Werkloosheidswet][ref1], of op wie
      een uitsluitingsgrond als bedoeld in [artikel 19 van die wet][ref2] van toepassing is.

      3 De duur van de aanvullende uitkering is voor de persoon, die op de dag, waarop de Wijzigingswet AAW/WAO in
      werking treedt:

      a. jonger is dan 23 jaar: één jaar;

      b. 23 jaar of ouder is, doch jonger dan 30 jaar: twee jaar;

      c. 30 jaar of ouder is, doch jonger dan 35 jaar: drie jaar.

      4 Indien de persoon die recht heeft op aanvullende uitkering gedurende de laatste vijf jaar voor de dag, waarop
      de Wijzigingswet AAW/WAO in werking treedt, recht had op een arbeidsongeschiktheidsuitkering berekend naar een
      arbeidsongeschiktheid van 80% of meer, is, in afwijking van het derde lid, de duur van de aanvullende uitkering
      vijf jaar.

      5 Het bedrag van de aanvullende uitkering wordt berekend met overeenkomstige toepassing van de
      [artikelen 44 tot en met 47 van de nieuwe Werkloosheidswet][ref3].

      6 Dit artikel is slechts van toepassing indien de later gelegen dag, bedoeld in het eerste lid, niet later is
      gelegen dan binnen twee jaar na de dag, waarop de Wijzigingswet AAW/WAO in werking treedt en ten aanzien van de
      persoon, bedoeld in het derde lid, onderdeel *c*, niet eerder dan een jaar na de dag waarop de Wijzigingswet AAW/
      WAO in werking treedt. Onze Minister is bevoegd voor bepaalde categorieën personen andere tijdvakken dan als
      genoemd in de eerste volzin vast te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel44
