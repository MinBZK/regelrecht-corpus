  - number: '26'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen laat, op zijn verzoek, tot de vrijwillige
      werkloosheidsverzekering, bedoeld in [hoofdstuk III van de nieuwe Werkloosheidswet][ref1], toe de persoon, jonger
      dan 65 jaar, die op de dag, waarop de nieuwe [Werkloosheidswet][ref2] in werking treedt:

      a. buiten Nederland woont en aldaar een dienstbetrekking vervult en wiens werkgever binnen Nederland woont of
      gevestigd is; of

      b. Nederlander is en die werkzaamheden verricht in een ontwikkelingsland.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#HoofdstukIII
      [ref2]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0004046/2007-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0004045
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004045
  - number: '27'
    text: |-
      1 Het verzoek om toelating tot de vrijwillige werkloosheidsverzekering op grond van [artikel 26][ref1], dient te
      worden ingediend binnen drie maanden na de dag, waarop de nieuwe [Werkloosheidswet][ref2] in werking treedt.

      2 Het Uitvoeringsinstituut werknemersverzekeringen is bevoegd te verklaren dat een verzoek om toelating, ingediend
      na afloop van de in het eerste lid gestelde termijn, geacht wordt tijdig te zijn ingekomen, indien de persoon die
      het verzoek heeft gedaan, redelijkerwijs niet geacht kan worden in verzuim te zijn geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0004046#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0004046/2007-07-01#Artikel27
