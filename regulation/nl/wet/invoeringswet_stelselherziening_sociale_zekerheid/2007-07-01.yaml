    text: |-
      1 Indien het recht op aanvullende uitkering of aanvullende vervolguitkering op grond van
      [artikel 20, eerste lid, onderdeel ][ref1] geheel of gedeeltelijk is geëindigd, en vervolgens de omstandigheid
      die tot dat eindigen heeft geleid heeft opgehouden te bestaan, zonder dat een recht op uitkering als bedoeld
      in [artikel 15 van die wet][ref2] is ontstaan, herleeft het recht op aanvullende uitkering of aanvullende
      vervolguitkering met overeenkomstige toepassing van [artikel 8 van die wet ][ref3]en de op grond van
      [artikel 21, tweede lid, van die wet][ref4] gestelde regels.

      2 Telkens nadat het recht op aanvullende uitkering of aanvullende vervolguitkering na een gehele eindiging van
      dat recht is herleefd op grond van het eerste lid, eindigt het recht op die uitkering zoveel later dan de in
      [artikel 53, derde of vierde lid][ref5], dan wel in [artikel 54, eerste lid][ref6], genoemde periode als de periode
      tussen de eindiging en de herleving van het recht op die uitkering heeft geduurd.


