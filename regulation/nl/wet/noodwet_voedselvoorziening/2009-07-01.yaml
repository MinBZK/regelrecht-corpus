        artikel: '6'
        hoofdstuk: III
  - number: '16'
    text: |-
      Tegen een op grond van deze wet genomen besluit kan een belanghebbende beroep instellen bij het College van Beroep
      voor het bedrijfsleven.
    url: https://wetten.overheid.nl/BWBR0002392/2009-07-01#Artikel16
  - number: '17'
    text: |-
      Bij algemene maatregel van bestuur worden regelen gesteld betreffende tegemoetkoming in de kosten van de krachtens
      dit hoofdstuk verleende medewerking.
    url: https://wetten.overheid.nl/BWBR0002392/2009-07-01#Artikel17
  - number: '18'
    text: |-
      Bij algemene maatregel van bestuur wijzen Wij de autoriteiten aan, die onder daarbij vast te stellen regelen
      in enig gebied de bevoegdheden, welke krachtens deze wet, de [Distributiewet][ref1], de [Hamsterwet][ref2], de
      [Vorderingswet][ref3], de [Prijzennoodwet][ref4], de [Landbouwwet][ref5] en de [Algemene douanewet][ref6] aan
      Onze Minister toekomen, uitoefenen voor zolang in een der in [artikel 4, tweede lid][ref7], genoemde gevallen
      de verbinding tussen dat gebied en Onze Minister verbroken is. Ons besluit wordt mede bekend gemaakt in de
      Staatscourant.


