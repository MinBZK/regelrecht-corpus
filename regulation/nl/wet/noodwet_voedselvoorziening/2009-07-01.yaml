  - number: '25'
    text: |-
      Het is verboden ter zake van een aanvraag om een ontheffing, vergunning of restitutie, onjuiste of onvolledige
      gegevens te verstrekken.
    url: https://wetten.overheid.nl/BWBR0002392/2009-07-01#Artikel25
  - number: '26'
    text: |-
      1 In afwijking van [artikel 5 van de Wet op de economische delicten][ref1] is Onze Minister bevoegd tot oplegging
      van een last onder bestuursdwang ter handhaving van de krachtens de [artikelen 6][ref2], [9][ref3] en [10][ref4]
      vastgestelde verplichtingen.

      2 Voor de in bezit genomen produkten wordt als schadeloosstelling toegekend een bedrag, gelijk aan de prijs,
      onderscheidenlijk vergoeding, welke bij inlevering, onderscheidenlijk terbeschikkinghouding ter nakoming van een
      krachtens [artikel 10][ref5] opgelegde verplichting zou zijn uitgekeerd, een en ander verminderd met de op de
      inbezitneming vallende kosten.


