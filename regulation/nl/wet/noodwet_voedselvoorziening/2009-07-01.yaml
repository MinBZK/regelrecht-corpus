  - number: '29'
    text: |-
      1 Indien in deze wet geregelde onderwerpen in het belang van een goede uitvoering van de wet nadere regeling
      behoeven, kan deze geschieden bij door Onze Minister vast te stellen regeling.

      2 Een gedraging in strijd met een bepaling in zodanige regeling is een strafbaar feit, voorzover uitdrukkelijk als
      zodanig aangeduid.
    url: https://wetten.overheid.nl/BWBR0002392/2009-07-01#Artikel29
  - number: '31'
    text: |-
      Krachtens deze wet vastgestelde regelen treden, tenzij daarbij anders is bepaald, in werking met ingang van de dag
      na die van hun bekendmaking. Zij kunnen bepalen, dat zij onmiddellijk na hun bekendmaking in werking treden.
    url: https://wetten.overheid.nl/BWBR0002392/2009-07-01#Artikel31
  - number: '32'
    text: |-
      1 Besluiten, door Onze Minister krachtens de [artikelen 2][ref1], [3][ref2], [6][ref3], [7][ref4], [8][ref5],
      [9][ref6], [10][ref7], [12][ref8], 13, [15][ref9], [23][ref10] en [29][ref11] vastgesteld, worden in de
      *Staatscourant* bekend gemaakt.

      2 Indien het landsbelang dit naar zijn oordeel noodzakelijk maakt, kan Onze Minister een besluit, bedoeld in het
      eerste lid, op andere wijze bekend maken.


