  - number: '15'
    text: |-
      1 Ten aanzien van de uitoefening van bevoegdheden, welke hem toekomen ingevolge het bepaalde bij of krachtens
      deze wet en de [Distributiewet][ref1], kan Onze Minister de medewerking vorderen van een bestuur van een
      bedrijfslichaam. [Artikel 6, derde lid][ref2], is van overeenkomstige toepassing.

      2 Indien de van het bestuur van het bedrijfslichaam gevorderde medewerking bestaat in het stellen van nadere regels
      bij verordening, behoeft zodanige verordening de goedkeuring van Onze Minister en indien het voorschrift waarbij
      de medewerking gevorderd is, door Onze Minister is vastgesteld in overeenstemming met Onze Minister van Economische
      Zaken, mede van die Minister.

      3 Krachtens de verordening genomen besluiten behoeven, voor zover dit bij de vordering van de medewerking, bedoeld
      in het eerste lid, is bepaald, de goedkeuring van de daarbij aangewezen autoriteit.

      4 Regelen, bedoeld in het tweede lid, en nadere regelen, bedoeld in het derde lid, zijn verbindend voor een ieder,
      voorzover daarbij niet anders is bepaald.

      5 Besluiten zonder algemene gelding, tot het nemen waarvan medewerking is gevorderd, kunnen worden genomen ten
      aanzien van een ieder, voorzover bij die vordering niet anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0001997
      [ref2]: https://wetten.overheid.nl/BWBR0002392#Artikel6
    url: https://wetten.overheid.nl/BWBR0002392/2009-07-01#Artikel15
