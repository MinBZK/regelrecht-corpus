preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is regelen te stellen, ten einde in geval van oorlog,
    oorlogsgevaar of andere buitengewone omstandigheden de voedselvoorziening te verzekeren;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002392/2009-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Voor de toepassing van het bepaalde bij of krachtens deze wet wordt verstaan onder:

      Onze Minister: Onze Minister van Landbouw en Visserij;

      landbouw: akkerbouw, weidebouw, veehouderij, pluimveehouderij, bijenhouderij, tuinbouw - daaronder begrepen
      fruitteelt en het kweken van bomen, bloemen en bloembollen -, teelt van griendhout en elke andere vorm van
      bodemcultuur met uitzondering van bosbouw;

      produkten:

      a. alle voortbrengselen, welke, al dan niet na bewerking of verwerking, kunnen dienen als voedsel voor mens of
      dier, alsmede de bij bewerking of verwerking van die voortbrengselen verkregen derivaten en afvallen;

      b. de niet reeds onder *a* begrepen, al dan niet bewerkte of verwerkte voortbrengselen van de landbouw en de
      visserij, alsmede de bij bewerking of verwerking van die voortbrengselen verkregen derivaten en afvallen;

      bedrijfslichaam: een bedrijfslichaam als bedoeld in [artikel 66 van de Wet op de bedrijfsorganisatie][ref1];

      College: College van Beroep voor het bedrijfsleven.

      2 Voor de toepassing van het bepaalde bij of krachtens deze wet wordt mede verstaan onder:

      handelaren: tussenpersonen;

      visserij: mosselteelt, oesterteelt en viskwekerij.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel66
    url: https://wetten.overheid.nl/BWBR0002392/2009-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '66'
  - number: '2'
    text: |-
      1 Er is in iedere provincie een voedselcommissaris, die door Ons wordt benoemd en ontslagen.

      2 Onze Minister bepaalt het ambtsgebied van de voedselcommissaris, al dan niet in afwijking van het gebied van de
      desbetreffende provincie.

      3 De voedselcommissaris is, tenzij het tegendeel blijkt, onder de bevelen van Onze Minister belast met de
      uitvoering van de krachtens deze wet vastgestelde regelen.
    url: https://wetten.overheid.nl/BWBR0002392/2009-07-01#Artikel2
  - number: '3'
    text: |-
      Onze Minister kan in door hem te bepalen gebieden voedselcommissarissen aanwijzen, die in die gebieden belast zijn
      met de uitvoering van krachtens deze wet vastgestelde regelen.
    url: https://wetten.overheid.nl/BWBR0002392/2009-07-01#Artikel3
  - number: '4'
    text: |-
      1 Onverminderd de [artikelen 7, eerste lid,][ref1] en
      [8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref2] kunnen, ingeval buitengewone omstandigheden
      dit noodzakelijk maken, bij koninklijk besluit, op voordracht van Onze Minister-President, voor het gehele land of
      een gedeelte daarvan de [artikelen 6 tot en met 14][ref3] gezamenlijk of afzonderlijk in werking worden gesteld.

      2 Wanneer het in het eerste lid bedoelde besluit is genomen, wordt onverwijld een voorstel van wet aan de Tweede
      Kamer gezonden omtrent het voortduren van de werking van de bij dat besluit in werking gestelde bepalingen.

      3 Wordt het voorstel van wet door de Staten-Generaal verworpen, dan worden bij koninklijk besluit, op voordracht
      van Onze Minister-President, de bepalingen die ingevolge het eerste lid in werking zijn gesteld, onverwijld buiten
      werking gesteld.

      4 Bij koninklijk besluit, op voordracht van Onze Minister-President, worden de bepalingen die ingevolge het eerste
      lid in werking zijn gesteld, buiten werking gesteld, zodra de omstandigheden dit naar Ons oordeel toelaten.

      5 Het besluit, bedoeld in het eerste, derde en vierde lid, wordt op de daarin te bepalen wijze bekendgemaakt. Het
      treedt in werking terstond na de bekendmaking.

      6 Het besluit, bedoeld in het eerste, derde en vierde lid, wordt in ieder geval geplaatst in het *Staatsblad*.


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007981#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0002392#Artikel6
