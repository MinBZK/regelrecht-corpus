  - number: '24'
    text: |-
      1 Ieder, die ingevolge het bij of krachtens deze wet bepaalde in het bezit dient te zijn van een of meer
      bescheiden, is verplicht die bescheiden steeds bij zich te hebben bij gedragingen met betrekking tot welke het
      bezit van zodanige bescheiden verplicht is gesteld.

      2 Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit
      van Onze Minister of bij besluit van een in [artikel 2][ref1] onderscheidenlijk [artikel 3][ref2] bedoelde
      voedselcommissaris aangewezen personen.


      [ref1]: https://wetten.overheid.nl/BWBR0002392#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002392#Artikel3
