  - number: '22'
    text: |-
      1 Zolang de [artikelen 6-14][ref1] in werking zijn, is een ieder verplicht bij het verrichten van gedragingen,
      genoemd in [artikel 6, tweede lid][ref2], ten aanzien van de desbetreffende produkten die zorg aan te wenden, welke
      onder de met betrekking tot de voedselvoorziening bestaande omstandigheden redelijkerwijze kan worden verwacht.

      2 Het bepaalde bij het vorige lid is van overeenkomstige toepassing bij het verrichten van gedragingen, in
      [artikel 9, eerste lid][ref3], genoemd.


