---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht-mvp/refs/heads/main/schema/v0.3.1/schema.json
$id: noodwet_voedselvoorziening
regulatory_layer: WET
publication_date: '1999-06-29'
valid_from: '2015-01-01'
bwb_id: BWBR0002392
url: https://wetten.overheid.nl/BWBR0002392/2015-01-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is regelen te stellen, ten einde in geval van oorlog,
    oorlogsgevaar of andere buitengewone omstandigheden de voedselvoorziening te verzekeren;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002392/2015-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Voor de toepassing van het bepaalde bij of krachtens deze wet wordt verstaan onder: Onze Minister: Onze Minister
      van Landbouw en Visserij; landbouw: akkerbouw, weidebouw, veehouderij, pluimveehouderij, bijenhouderij, tuinbouw
        - daaronder begrepen fruitteelt en het kweken van bomen, bloemen en bloembollen -, teelt van griendhout en elke
      andere vorm van bodemcultuur met uitzondering van bosbouw; produkten:
    url: https://wetten.overheid.nl/BWBR0002392/2015-01-01#Artikel1
  - number: 1.1.a
    text: |-
      alle voortbrengselen, welke, al dan niet na bewerking of verwerking, kunnen dienen als voedsel voor mens of dier,
      alsmede de bij bewerking of verwerking van die voortbrengselen verkregen derivaten en afvallen;
    url: https://wetten.overheid.nl/BWBR0002392/2015-01-01#Artikel1
  - number: 1.1.b
    text: |-
      de niet reeds onder *a* begrepen, al dan niet bewerkte of verwerkte voortbrengselen van de landbouw en de visserij,
      alsmede de bij bewerking of verwerking van die voortbrengselen verkregen derivaten en afvallen.
    url: https://wetten.overheid.nl/BWBR0002392/2015-01-01#Artikel1
  - number: '1.2'
    text: |-
      Voor de toepassing van het bepaalde bij of krachtens deze wet wordt mede verstaan onder: handelaren:
      tussenpersonen; visserij: mosselteelt, oesterteelt en viskwekerij.
    url: https://wetten.overheid.nl/BWBR0002392/2015-01-01#Artikel1
  - number: '2.1'
    text: Er is in iedere provincie een voedselcommissaris, die door Ons wordt benoemd en ontslagen.
    url: https://wetten.overheid.nl/BWBR0002392/2015-01-01#Artikel2
  - number: '2.2'
    text: |-
      Onze Minister bepaalt het ambtsgebied van de voedselcommissaris, al dan niet in afwijking van het gebied van de
      desbetreffende provincie.
    url: https://wetten.overheid.nl/BWBR0002392/2015-01-01#Artikel2
  - number: '2.3'
    text: |-
      De voedselcommissaris is, tenzij het tegendeel blijkt, onder de bevelen van Onze Minister belast met de uitvoering
      van de krachtens deze wet vastgestelde regelen.
    url: https://wetten.overheid.nl/BWBR0002392/2015-01-01#Artikel2
  - number: '3'
    text: |-
      Onze Minister kan in door hem te bepalen gebieden voedselcommissarissen aanwijzen, die in die gebieden belast zijn
      met de uitvoering van krachtens deze wet vastgestelde regelen.
    url: https://wetten.overheid.nl/BWBR0002392/2015-01-01#Artikel3
  - number: '4.1'
    text: |-
      Onverminderd de [artikelen 7, eerste lid,][ref1] en
      [8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref2] kunnen, ingeval buitengewone omstandigheden
      dit noodzakelijk maken, bij koninklijk besluit, op voordracht van Onze Minister-President, voor het gehele land of
      een gedeelte daarvan de [artikelen 6 tot en met 12][ref3] gezamenlijk of afzonderlijk in werking worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007981#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0002392#Artikel6
    url: https://wetten.overheid.nl/BWBR0002392/2015-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007981
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007981
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0002392
        artikel: '6'
        hoofdstuk: III
  - number: '4.2'
    text: |-
      Wanneer het in het eerste lid bedoelde besluit is genomen, wordt onverwijld een voorstel van wet aan de Tweede
      Kamer gezonden omtrent het voortduren van de werking van de bij dat besluit in werking gestelde bepalingen.
    url: https://wetten.overheid.nl/BWBR0002392/2015-01-01#Artikel4
  - number: '4.3'
    text: |-
      Wordt het voorstel van wet door de Staten-Generaal verworpen, dan worden bij koninklijk besluit, op voordracht
      van Onze Minister-President, de bepalingen die ingevolge het eerste lid in werking zijn gesteld, onverwijld buiten
      werking gesteld.
    url: https://wetten.overheid.nl/BWBR0002392/2015-01-01#Artikel4
  - number: '4.4'
    text: |-
      Bij koninklijk besluit, op voordracht van Onze Minister-President, worden de bepalingen die ingevolge het eerste
      lid in werking zijn gesteld, buiten werking gesteld, zodra de omstandigheden dit naar Ons oordeel toelaten.
    url: https://wetten.overheid.nl/BWBR0002392/2015-01-01#Artikel4
  - number: '4.5'
    text: |-
      Het besluit, bedoeld in het eerste, derde en vierde lid, wordt op de daarin te bepalen wijze bekendgemaakt. Het
      treedt in werking terstond na de bekendmaking.
    url: https://wetten.overheid.nl/BWBR0002392/2015-01-01#Artikel4
  - number: '4.6'
    text: Het besluit, bedoeld in het eerste, derde en vierde lid, wordt in ieder geval geplaatst in het *Staatsblad*.
    url: https://wetten.overheid.nl/BWBR0002392/2015-01-01#Artikel4
  - number: '6.1'
    text: |-
      Onze Minister kan regelen vaststellen betreffende een of meer der in het tweede lid van dit artikel genoemde
      gedragingen.
    url: https://wetten.overheid.nl/BWBR0002392/2015-01-01#Artikel6
  - number: '6.2'
    text: |-
      De in het eerste lid bedoelde gedragingen zijn: het telen, kweken, fokken, vangen, broeden, bereiden, vervaardigen,
      oogsten, voorhanden hebben, in voorraad hebben, bewaren, opslaan, inzamelen, bewerken, verwerken, gebruiken,
      verbruiken, vervoederen, verpakken, slachten, vervoeren, aanvoeren, veilen, ontvangen, afleveren, te koop
      aanbieden, kopen en vervreemden van produkten.
    url: https://wetten.overheid.nl/BWBR0002392/2015-01-01#Artikel6
  - number: '6.3'
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald, in welke gevallen Onze Minister regelen, bedoeld in het eerste
      lid, ten aanzien van ondernemingen, waarin daarbij aan te wijzen bedrijven op het gebied van industrie, handel en
      ambacht worden uitgeoefend, niet vaststelt dan in overeenstemming met Onze Minister van Economische Zaken.
    url: https://wetten.overheid.nl/BWBR0002392/2015-01-01#Artikel6
  - number: '7.1'
    text: Onze Minister kan regelen vaststellen betreffende de prijzen voor produkten.
    url: https://wetten.overheid.nl/BWBR0002392/2015-01-01#Artikel7
  - number: '7.2'
    text: |-
      [Artikel 6, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002392#Artikel6
    url: https://wetten.overheid.nl/BWBR0002392/2015-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002392
        artikel: '6'
        hoofdstuk: III
  - number: '8.1'
    text: |-
      Onze Minister kan regelen vaststellen betreffende het betalen van een geldsom ter zake van een of meer der in
      [artikel 6, tweede lid][ref1], genoemde gedragingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002392#Artikel6
    url: https://wetten.overheid.nl/BWBR0002392/2015-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002392
        artikel: '6'
        hoofdstuk: III
  - number: '8.2'
    text: |-
      Onze Minister kan in door hem te bepalen gevallen of groepen van gevallen tot gehele of gedeeltelijke restitutie
      overgaan van hetgeen ingevolge het bepaalde krachtens het eerste lid is betaald.
    url: https://wetten.overheid.nl/BWBR0002392/2015-01-01#Artikel8
  - number: '9.1'
    text: |-
      Onze Minister kan regelen vaststellen, betreffende het bereiden, vervaardigen, voorhanden hebben, in voorraad
      hebben, bewaren, opslaan, bewerken, verwerken, gebruiken, verbruiken, vervoeren, ontvangen, afleveren, te koop
      aanbieden, kopen, huren, verhuren en vervreemden van:
    url: https://wetten.overheid.nl/BWBR0002392/2015-01-01#Artikel9
  - number: 9.1.a
    text: grondstoffen, hulpstoffen en verpakkingsmateriaal voor produkten;
    url: https://wetten.overheid.nl/BWBR0002392/2015-01-01#Artikel9
  - number: 9.1.b
    text: |-
      fust, machines, werktuigen en gereedschappen - alsmede onderdelen daarvan -, welke worden gebezigd bij het telen,
      kweken, fokken, vangen, winnen, broeden, bereiden, vervaardigen, oogsten, bewaren, opslaan, bewerken, verwerken,
      verpakken of slachten van produkten;
    url: https://wetten.overheid.nl/BWBR0002392/2015-01-01#Artikel9
  - number: 9.1.c
    text: |-
      merken, kentekenen, alsmede stempels en andere werktuigen, waarmede merken en kentekenen kunnen worden vervaardigd
      of aangebracht, een en ander voorzover krachtens enige bepaling van deze wet regelen zijn vastgesteld betreffende
      het voorzien zijn van produkten, verpakkingsmateriaal en fust van zodanige merken of kentekenen, dan wel het
      voorzien zijn van produkten, verpakkingsmateriaal en fust van zodanige merken of kentekenen als vereiste wordt
      gesteld voor de bevoegdheid tot enige gedraging met betrekking tot die produkten, dat verpakkingsmateriaal en dat
      fust.
    url: https://wetten.overheid.nl/BWBR0002392/2015-01-01#Artikel9
  - number: '9.2'
    text: |-
      [Artikel 6, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002392#Artikel6
    url: https://wetten.overheid.nl/BWBR0002392/2015-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002392
        artikel: '6'
        hoofdstuk: III
  - number: '10.1'
    text: |-
      Onze Minister kan regelen vaststellen betreffende het ter beschikking houden van produkten en van goederen, bedoeld
      in [artikel 9][ref1], voor of het inleveren daarvan bij een door hem aan te wijzen lichaam, orgaan of persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0002392#Artikel9
    url: https://wetten.overheid.nl/BWBR0002392/2015-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002392
        artikel: '9'
        hoofdstuk: III
  - number: '10.2'
    text: |-
      [Artikel 6, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002392#Artikel6
    url: https://wetten.overheid.nl/BWBR0002392/2015-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002392
        artikel: '6'
        hoofdstuk: III
  - number: '10.3'
    text: |-
      Voor de ingeleverde produkten en goederen wordt door Onze Minister de op het tijdstip van het opleggen van de
      verplichting tot inlevering voor die produkten en goederen krachtens [artikel 7][ref1] of enig ander wettelijk
      voorschrift vastgestelde prijs uitbetaald of, bij het ontbreken daarvan, de dan in de betrokken bedrijfstak voor
      die produkten en goederen gebruikelijke prijs.


      [ref1]: https://wetten.overheid.nl/BWBR0002392#Artikel7
    url: https://wetten.overheid.nl/BWBR0002392/2015-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002392
        artikel: '7'
        hoofdstuk: III
  - number: '10.4'
    text: |-
      Onze Minister kent aan degene, die ingevolge dit artikel produkten of goederen ter beschikking houdt en ten gevolge
      daarvan schade lijdt, welke redelijkerwijze niet of niet geheel te zijnen laste behoort te blijven, op zijn verzoek
      een naar billijkheid te bepalen schadevergoeding uit ’s Lands kas toe.
    url: https://wetten.overheid.nl/BWBR0002392/2015-01-01#Artikel10
  - number: '11.1'
    text: |-
      Krachtens de [artikelen 6-10][ref1] vastgestelde regelen kunnen onder meer de bepaling inhouden, dat bij of
      krachtens die regelen gegeven voorschriften niet gelden, indien en voorzover vrijstelling of op aanvraag ontheffing
      of vergunning is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002392#Artikel6
    url: https://wetten.overheid.nl/BWBR0002392/2015-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002392
        artikel: '6'
        hoofdstuk: III
  - number: '11.2'
    text: |-
      Aan de vrijstellingen, ontheffingen en vergunningen kunnen voorschriften worden verbonden. Zij kunnen onder
      beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0002392/2015-01-01#Artikel11
  - number: '11.3'
    text: |-
      De ontheffingen en vergunningen, zomede de restituties, bedoeld in [artikel 8, tweede lid][ref1], kunnen worden
      ingetrokken, indien de te harer verkrijging verstrekte gegevens zodanig onjuist of onvolledig blijken, dat op de
      aanvraag een andere beslissing zou zijn genomen, als bij de beoordeling de juiste omstandigheden volledig bekend
      waren geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0002392#Artikel8
    url: https://wetten.overheid.nl/BWBR0002392/2015-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002392
        artikel: '8'
        hoofdstuk: III
  - number: '12.1'
    text: |-
      Onze Minister kan bepalen, dat degenen, die een of meer der in [artikel 6, tweede lid][ref1], en
      [artikel 9, eerste lid][ref2], genoemde gedragingen verrichten of plegen te verrichten, verplicht zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0002392#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002392#Artikel9
    url: https://wetten.overheid.nl/BWBR0002392/2015-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002392
        artikel: '6'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0002392
        artikel: '9'
        hoofdstuk: III
  - number: 12.1.a
    text: |-
      nauwgezet, volledig en naar waarheid aantekening te houden betreffende die gedragingen en daarbij de door Onze
      Minister of de door hem aangewezen lichamen, organen of personen gegeven voorschriften na te leven;
    url: https://wetten.overheid.nl/BWBR0002392/2015-01-01#Artikel12
  - number: 12.1.b
    text: |-
      boeken en bescheiden betreffende die gedragingen aan de lichamen, organen of personen, die Onze Minister daartoe
      heeft aangewezen, op eerste vordering te tonen of tegen bewijs van ontvangst af te geven of te zenden.
    url: https://wetten.overheid.nl/BWBR0002392/2015-01-01#Artikel12
  - number: '12.2'
    text: |-
      [Artikel 6, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002392#Artikel6
    url: https://wetten.overheid.nl/BWBR0002392/2015-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002392
        artikel: '6'
        hoofdstuk: III
  - number: '13.1'
    text: |-
      Onze Minister kan bepalen, dat verordeningen of andere besluiten, door een orgaan van een bedrijfslichaam krachtens
      deze wet, de [Landbouwwet][ref1] of de [Wet op de bedrijfsorganisatie][ref2] vastgesteld, geheel of gedeeltelijk
      worden geschorst. Hij kan in verband daarmee nadere regels vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0002252
      [ref2]: https://wetten.overheid.nl/BWBR0002058
    url: https://wetten.overheid.nl/BWBR0002392/2015-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002252
      - id: ref2
        bwb_id: BWBR0002058
  - number: '14.1'
    text: |-
      Indien het naar het oordeel van het dagelijks bestuur van een bedrijfslichaam in een der gevallen, genoemd in
      het [tweede lid van artikel 4][ref1], niet mogelijk is, dat het bestuur, een commissie uit het midden van het
      bestuur of een orgaan, bedoeld in [artikel 88a van de Wet op de Bedrijfsorganisatie][ref2], bijeenkomt, oefent het
      dagelijks bestuur de aan het bestuur, die commissie of dat orgaan toekomende bevoegdheden uit.


      [ref1]: https://wetten.overheid.nl/BWBR0002392#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002058#Artikel88a
    url: https://wetten.overheid.nl/BWBR0002392/2015-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002392
        artikel: '4'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0002058
        artikel: 88a
  - number: '14.2'
    text: |-
      Indien het naar het oordeel van de voorzitter van een bedrijfslichaam in zodanig geval niet mogelijk is, dat het
      dagelijks bestuur bijeenkomt, oefent hij de aan het dagelijks bestuur toekomende bevoegdheden uit. Indien hij in
      zodanig geval tevens van oordeel is, dat tengevolge van bedoelde omstandigheden het bestuur, een commissie uit het
      bestuur of een orgaan, bedoeld in [artikel 88a van de Wet op de Bedrijfsorganisatie][ref1], niet kan bijeenkomen,
      oefent hij ook de aan het bestuur, die commissie of dat orgaan toekomende bevoegdheden uit.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel88a
    url: https://wetten.overheid.nl/BWBR0002392/2015-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: 88a
  - number: '14.3'
    text: |-
      Zo spoedig mogelijk legt het dagelijks bestuur, onderscheidenlijk de voorzitter aan het bestuur verantwoording af
      van hetgeen krachtens de vorige leden is verricht.
    url: https://wetten.overheid.nl/BWBR0002392/2015-01-01#Artikel14
  - number: '17'
    text: |-
      Bij algemene maatregel van bestuur worden regelen gesteld betreffende tegemoetkoming in de kosten van de krachtens
      dit hoofdstuk verleende medewerking.
    url: https://wetten.overheid.nl/BWBR0002392/2015-01-01#Artikel17
  - number: '18'
    text: |-
      Bij algemene maatregel van bestuur wijzen Wij de autoriteiten aan, die onder daarbij vast te stellen regelen
      in enig gebied de bevoegdheden, welke krachtens deze wet, de [Distributiewet][ref1], de [Hamsterwet][ref2], de
      [Vorderingswet][ref3], de [Prijzennoodwet][ref4], de [Landbouwwet][ref5] en de [Algemene douanewet][ref6] aan
      Onze Minister toekomen, uitoefenen voor zolang in een der in [artikel 4, tweede lid][ref7], genoemde gevallen
      de verbinding tussen dat gebied en Onze Minister verbroken is. Ons besluit wordt mede bekend gemaakt in de
      Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0001997
      [ref2]: https://wetten.overheid.nl/BWBR0002389
      [ref3]: https://wetten.overheid.nl/BWBR0002393
      [ref4]: https://wetten.overheid.nl/BWBR0003734
      [ref5]: https://wetten.overheid.nl/BWBR0002252
      [ref6]: https://wetten.overheid.nl/BWBR0023746
      [ref7]: https://wetten.overheid.nl/BWBR0002392#Artikel4
    url: https://wetten.overheid.nl/BWBR0002392/2015-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0001997
      - id: ref2
        bwb_id: BWBR0002389
      - id: ref3
        bwb_id: BWBR0002393
      - id: ref4
        bwb_id: BWBR0003734
      - id: ref5
        bwb_id: BWBR0002252
      - id: ref6
        bwb_id: BWBR0023746
      - id: ref7
        bwb_id: BWBR0002392
        artikel: '4'
        hoofdstuk: III
  - number: '21'
    text: |-
      In afwijking van [artikel 8:72, tweede lid, van de Algemene wet bestuursrecht][ref1] werkt een vernietiging vanaf
      het tijdstip, waarop zij wordt uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002392/2015-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '22.1'
    text: |-
      Zolang de [artikelen 6-12][ref1] in werking zijn, is een ieder verplicht bij het verrichten van gedragingen,
      genoemd in [artikel 6, tweede lid][ref2], ten aanzien van de desbetreffende produkten die zorg aan te wenden, welke
      onder de met betrekking tot de voedselvoorziening bestaande omstandigheden redelijkerwijze kan worden verwacht.


      [ref1]: https://wetten.overheid.nl/BWBR0002392#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002392#Artikel6
    url: https://wetten.overheid.nl/BWBR0002392/2015-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002392
        artikel: '6'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0002392
        artikel: '6'
        hoofdstuk: III
  - number: '22.2'
    text: |-
      Het bepaalde bij het vorige lid is van overeenkomstige toepassing bij het verrichten van gedragingen, in
      [artikel 9, eerste lid][ref1], genoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0002392#Artikel9
    url: https://wetten.overheid.nl/BWBR0002392/2015-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002392
        artikel: '9'
        hoofdstuk: III
  - number: '23.1'
    text: |-
      Onze Minister kan ten aanzien van degenen, die een of meer der in [artikel 6, tweede lid][ref1], en
      [artikel 9, eerste lid][ref2], genoemde gedragingen verrichten of plegen te verrichten, regelen vaststellen
      betreffende het beantwoorden van vragen en verstrekken van gegevens, welke naar het oordeel van Onze Minister nodig
      zijn ter voorbereiding of uitvoering van enige krachtens deze wet te nemen of genomen maatregel, aan lichamen,
      organen of personen, die Onze Minister daartoe heeft aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0002392#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002392#Artikel9
    url: https://wetten.overheid.nl/BWBR0002392/2015-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002392
        artikel: '6'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0002392
        artikel: '9'
        hoofdstuk: III
  - number: '23.2'
    text: |-
      [Artikel 6, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002392#Artikel6
    url: https://wetten.overheid.nl/BWBR0002392/2015-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002392
        artikel: '6'
        hoofdstuk: III
  - number: '24.1'
    text: |-
      Ieder, die ingevolge het bij of krachtens deze wet bepaalde in het bezit dient te zijn van een of meer bescheiden,
      is verplicht die bescheiden steeds bij zich te hebben bij gedragingen met betrekking tot welke het bezit van
      zodanige bescheiden verplicht is gesteld.
    url: https://wetten.overheid.nl/BWBR0002392/2015-01-01#Artikel24
  - number: '24.2'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van
      Onze Minister of bij besluit van een in [artikel 2][ref1] onderscheidenlijk [artikel 3][ref2] bedoelde
      voedselcommissaris aangewezen personen.


      [ref1]: https://wetten.overheid.nl/BWBR0002392#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002392#Artikel3
    url: https://wetten.overheid.nl/BWBR0002392/2015-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002392
        artikel: '2'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002392
        artikel: '3'
        hoofdstuk: II
  - number: '25'
    text: |-
      Het is verboden ter zake van een aanvraag om een ontheffing, vergunning of restitutie, onjuiste of onvolledige
      gegevens te verstrekken.
    url: https://wetten.overheid.nl/BWBR0002392/2015-01-01#Artikel25
  - number: '26.1'
    text: |-
      In afwijking van [artikel 5 van de Wet op de economische delicten][ref1] is Onze Minister bevoegd tot oplegging
      van een last onder bestuursdwang ter handhaving van de krachtens de [artikelen 6][ref2], [9][ref3] en [10][ref4]
      vastgestelde verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002392#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0002392#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0002392#Artikel10
    url: https://wetten.overheid.nl/BWBR0002392/2015-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002063
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0002392
        artikel: '6'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0002392
        artikel: '9'
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0002392
        artikel: '10'
        hoofdstuk: III
  - number: '26.2'
    text: |-
      Voor de in bezit genomen produkten wordt als schadeloosstelling toegekend een bedrag, gelijk aan de prijs,
      onderscheidenlijk vergoeding, welke bij inlevering, onderscheidenlijk terbeschikkinghouding ter nakoming van een
      krachtens [artikel 10][ref1] opgelegde verplichting zou zijn uitgekeerd, een en ander verminderd met de op de
      inbezitneming vallende kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0002392#Artikel10
    url: https://wetten.overheid.nl/BWBR0002392/2015-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002392
        artikel: '10'
        hoofdstuk: III
  - number: '27'
    text: |-
      Hetgeen krachtens [artikel 8][ref1] is verschuldigd, kan door Onze Minister bij dwangbevel worden ingevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0002392#Artikel8
    url: https://wetten.overheid.nl/BWBR0002392/2015-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002392
        artikel: '8'
        hoofdstuk: III
  - number: '29.1'
    text: |-
      Indien in deze wet geregelde onderwerpen in het belang van een goede uitvoering van de wet nadere regeling
      behoeven, kan deze geschieden bij door Onze Minister vast te stellen regeling.
    url: https://wetten.overheid.nl/BWBR0002392/2015-01-01#Artikel29
  - number: '29.2'
    text: |-
      Een gedraging in strijd met een bepaling in zodanige regeling is een strafbaar feit, voorzover uitdrukkelijk als
      zodanig aangeduid.
    url: https://wetten.overheid.nl/BWBR0002392/2015-01-01#Artikel29
  - number: '31'
    text: |-
      Krachtens deze wet vastgestelde regelen treden, tenzij daarbij anders is bepaald, in werking met ingang van de dag
      na die van hun bekendmaking. Zij kunnen bepalen, dat zij onmiddellijk na hun bekendmaking in werking treden.
    url: https://wetten.overheid.nl/BWBR0002392/2015-01-01#Artikel31
  - number: '32.1'
    text: |-
      Besluiten, door Onze Minister krachtens de [artikelen 2][ref1], [3][ref2], [6][ref3], [7][ref4], [8][ref5],
      [9][ref6], [10][ref7], [12][ref8], [23][ref9] en [29][ref10] vastgesteld, worden in de *Staatscourant* bekend
      gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0002392#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002392#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002392#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0002392#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0002392#Artikel8
      [ref6]: https://wetten.overheid.nl/BWBR0002392#Artikel9
      [ref7]: https://wetten.overheid.nl/BWBR0002392#Artikel10
      [ref8]: https://wetten.overheid.nl/BWBR0002392#Artikel12
      [ref9]: https://wetten.overheid.nl/BWBR0002392#Artikel23
      [ref10]: https://wetten.overheid.nl/BWBR0002392#Artikel29
    url: https://wetten.overheid.nl/BWBR0002392/2015-01-01#Artikel32
