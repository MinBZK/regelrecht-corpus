preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat de Participatiewet op onderdelen als hard wordt ervaren, dat
    belanghebbenden hierdoor bestaansonzekerheid kunnen ondervinden, dat uitvoerders te weinig ruimte zien om
    belanghebbenden in individuele gevallen te kunnen helpen en belanghebbenden te weinig ondersteuning ervaren
    richting arbeidsmarkt;

    Zo is het dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-Generaal,
    hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0051679/2026-01-01#ArtikelAanhef
articles:
  - number: IVa
    text: |-
      Onze Minister van Sociale Zaken en Werkgelegenheid zendt binnen drie jaar na de inwerkingtreding van deze wet aan
      de Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0051679/2026-01-01#ArtikelIVa
  - number: V
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor verschillende artikelen of
      onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0051679/2026-01-01#ArtikelV
  - number: VI
    text: 'Deze wet wordt aangehaald als: Participatiewet in balans.'
    url: https://wetten.overheid.nl/BWBR0051679/2026-01-01#ArtikelVI
