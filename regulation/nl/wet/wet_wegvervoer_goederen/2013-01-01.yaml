$id: wet_wegvervoer_goederen
regulatory_layer: WET
publication_date: '2008-12-09'
valid_from: '2013-01-01'
bwb_id: BWBR0024800
url: https://wetten.overheid.nl/BWBR0024800/2013-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om de regelgeving voor de toelating tot het beroep
    van goederenvervoerder over de weg en voor de toelating tot de markt van het goederenvervoer over de weg te
    versoberen, om de administratieve lasten voor de goederenvervoerders te verminderen en de handhaafbaarheid van de
    regelgeving te verbeteren, mede gelet op de eerste richtlijn van de Raad van de Europese Gemeenschap van 23 juli
    1962 betreffende de vaststelling van gemeenschappelijke regels voor bepaalde soorten goederenvervoer over de weg
    (Pb EG 70), verordening (EEG) nr. 881/92 van de Raad van de Europese Gemeenschappen van 26 maart 1992 betreffende
    de toegang tot de markt van het goederenvervoer over de weg in de Gemeenschap van of naar het grondgebied van een
    Lidstaat of over het grondgebied van een of meer Lid-Staten (PbEG L 95), verordening (EEG) nr. 3118/93 van de Raad
    van Europese Gemeenschappen van 25 oktober 1993 tot vaststelling van de voorwaarden waaronder vervoerders worden
    toegelaten tot het binnenlands goederenvervoer over de weg in een Lid-Staat waarin zij niet gevestigd zijn (PbEG
    L 279) en op richtlijn nr. 96/26/EG van de Raad van de Europese Unie van 29 april 1996 inzake de toegang tot het
    beroep van vervoerder van goederen-, respectievelijk personenvervoer over de weg, nationaal en internationaal,
    en inzake de wederzijdse erkenning van diploma’s, certificaten en andere titels ter vergemakkelijking van de
    uitoefening van het recht van vrije vestiging van bedoelde vervoerondernemers (PbEG L 124);

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *beroepsrichtlijn voor het wegvervoer:* de
      bij regeling van Onze Minister aangewezen beroepsrichtlijn voor het wegvervoer;
        - *beroepsvervoer:* vervoer van goederen met een of meer vrachtauto’s dat tegen vergoeding van een of meer derden
      wordt verricht, niet zijnde eigen vervoer;
        - *bestuurdersattest:* bestuurdersattest als bedoeld in de marktverordening voor het wegvervoer;
        - *cabotageverordening voor het wegvervoer:* de bij regeling van Onze Minister aangewezen cabotageverordening voor
      het wegvervoer;
        - *CEMT-vergunning:* de vergunning die door het Secretariaat van de Europese Conferentie van Ministers van Verkeer
      (CEMT) wordt uitgegeven voor het verrichten van grensoverschrijdend goederenvervoer;
        - *communautaire vergunning:* communautaire vergunning als bedoeld in de marktverordening voor het wegvervoer;
        - *eigen vervoer:* vervoer van goederen met een of meer vrachtauto’s dat voor eigen rekening wordt verricht
      dan wel als werkzaamheid van ondersteunende aard die direct samenhangt met de hoofdwerkzaamheid binnen de
      bedrijfsactiviteiten;
        - *integriteitsverklaring beroepsvervoer:* een verklaring van Onze Minister van Justitie dat uit een onderzoek met
      betrekking tot het gedrag van de betrokken natuurlijke persoon of rechtspersoon ingesteld, gelet op het risico voor
      de samenleving alsmede het risico voor een behoorlijke beroepsuitoefening niet gebleken is van bezwaren tegen die
      natuurlijke persoon of rechtspersoon;
        - *lidstaat:* lidstaat van de Europese Unie;
        - *marktverordening voor het wegvervoer:* de bij regeling van Onze Minister aangewezen marktverordening voor het
      wegvervoer;
        - *motorrijtuig:* voertuig als bedoeld in [artikel 1, eerste lid, onderdeel c, van de Wegenverkeerswet 1994][ref1];
        - *NIWO:* Stichting Nationale en Internationale Wegvervoer Organisatie;
        - *Onze Minister:* Onze Minister van Verkeer en Waterstaat;
        - *vervoerder:* de natuurlijke persoon, de rechtspersoon, de vennootschap zonder rechtspersoonlijkheid of de
      maatschap voor wiens rekening en risico het beroepsvervoer of het eigen vervoer wordt verricht;
        - *vrachtauto:* motorrijtuig, motorrijtuig met aanhangwagen of samenstel van motorrijtuig en oplegger, ingericht
      voor het vervoer van goederen;
        - *vrijstellingsrichtlijn voor het wegvervoer:* de bij regeling van Onze Minister aangewezen vrijstellingsrichtlijn
      voor het wegvervoer.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel1
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '1'
  - number: 1.2.1
    text: |-
      In deze wet en de daarop berustende bepalingen wordt onder beroepsvervoer onderscheidenlijk eigen vervoer mede
      verstaan de ledige ritten en het laden en lossen van zaken in een vrachtauto in verband met dit vervoer.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel1.2
  - number: 1.2.2
    text: |-
      In deze wet en de daarop berustende bepalingen wordt onder rechtspersoon mede verstaan de vennootschap zonder
      rechtspersoonlijkheid en de maatschap.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel1.2
  - number: 1.2.3
    text: |-
      Een natuurlijk persoon die goederen vervoert met een communautaire vergunning van een derde of met een vergunning
      als bedoeld in [artikel 7.1, eerste lid][ref1], van een derde, verricht beroepsvervoer indien hij de vrachtauto
      waarmee de goederen worden vervoerd in eigendom heeft of de vrachtauto hem anderszins tegen vergoeding ter
      beschikking is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel7
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel1.2
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '7'
        hoofdstuk: '7'
  - number: 1.2.4
    text: |-
      Het binnenlands vervoer van goederen ten behoeve van een andere rechtspersoon geschiedt voor de toepassing van deze
      wet voor eigen rekening indien:
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel1.2
  - number: 1.2.4.a
    text: |-
      die rechtspersoon samen met de vervoerder al dan niet met een of meer andere rechtspersonen ingevolge een
      beschikking op basis van [artikel 15 van de Wet op de vennootschapsbelasting 1969][ref1], als een fiscale eenheid
      wordt aangemerkt, of


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel15
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel1.2
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '15'
  - number: 1.2.4.b
    text: |-
      die rechtspersoon samen met de vervoerder al dan niet met een of meer andere rechtspersonen ingevolge een
      beschikking op basis van [artikel 7 van de Wet op de omzetbelasting 1968][ref1], als één onderneming wordt
      aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel7
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel1.2
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '7'
  - number: '1.3'
    text: 'Deze wet is van toepassing op het beroepsvervoer en het eigen vervoer dat wordt verricht:'
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel1.3
  - number: 1.3.a
    text: door een in Nederland gevestigde vervoerder;
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel1.3
  - number: 1.3.b
    text: in Nederland door een buiten Nederland gevestigde vervoerder.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel1.3
  - number: 2.1.1
    text: 'De marktverordening voor het wegvervoer is van overeenkomstige toepassing op het:'
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.1
  - number: 2.1.1.a
    text: binnenlands beroepsvervoer door een in Nederland gevestigde vervoerder;
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.1
  - number: 2.1.1.b
    text: binnenlands beroepsvervoer door een in een andere lidstaat gevestigde vervoerder;
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.1
  - number: 2.1.1.c
    text: |-
      grensoverschrijdend beroepsvervoer, bedoeld in de punten 2, 3 en 5 van de bij de vrijstellingsrichtlijn voor het
      wegvervoer behorende bijlage I, door een in Nederland gevestigde vervoerder voor trajecten over het grondgebied
      van lidstaten.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.1
  - number: 2.1.2
    text: |-
      De marktverordening voor het wegvervoer is in afwijking van het eerste lid niet van overeenkomstige toepassing op
      het beroepsvervoer door een in Nederland gevestigde vervoerder dat wordt verricht met een of meer vrachtauto’s met
      een laadvermogen van niet meer dan 500 kg.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.1
  - number: 2.1.3
    text: |-
      De marktverordening voor het wegvervoer is in afwijking van het eerste lid niet van overeenkomstige toepassing op
      het binnenlands beroepsvervoer door een in Nederland gevestigde vervoerder:
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.1
  - number: 2.1.3.a
    text: |-
      dat vanwege de aard van de vervoerde zaken of de geringe afstand die wordt afgelegd, slechts een geringe weerslag
      op de vervoersmarkt heeft, en dat na overleg met de Commissie van de Europese Gemeenschappen, bij regeling van Onze
      Minister is aangewezen;
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.1
  - number: 2.1.3.b
    text: |-
      dat vanwege de aard van de vervoerde zaken of de geringe afstand die wordt afgelegd, slechts een geringe weerslag
      op de vervoersmarkt heeft en vanwege onvoorziene omstandigheden, in afwachting van de voltooiing van het overleg
      met de Commissie van de Europese Gemeenschappen, tijdelijk bij regeling van Onze Minister is aangewezen, of
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.1
  - number: 2.1.3.c
    text: dat is genoemd in punt 1 van de bij de vrijstellingsrichtlijn voor het wegvervoer behorende bijlage I.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.1
  - number: 2.1.4
    text: |-
      De marktverordening voor het wegvervoer is in afwijking van het eerste lid niet van overeenkomstige toepassing op
      het binnenlands beroepsvervoer door in een andere lidstaat gevestigde vervoerder, dat is opgenomen in de bij de
      vrijstellingsrichtlijn voor het wegvervoer behorende bijlage I.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.1
  - number: 2.1.5
    text: |-
      De marktverordening voor het wegvervoer is niet van toepassing op het grensoverschrijdend beroepsvervoer door
      een in een andere lidstaat gevestigde vervoerder, dat is opgenomen in de bij de vrijstellingsrichtlijn voor het
      wegvervoer behorende bijlage I.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.1
  - number: '2.2'
    text: |-
      Bij regeling van Onze Minister kan, met inachtneming van de overgangsbepalingen van een verdrag betreffende de
      toetreding van een of meer staten tot de Europese Unie, in afwijking van de cabotageverordening voor het wegvervoer
      of van de marktverordening van het wegvervoer, het in Nederland verrichten van binnenlands beroepsvervoer
      onderscheidenlijk grensoverschrijdend beroepsvervoer, door een vervoerder uit een bovenbedoelde lidstaat verboden
      worden.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.2
  - number: 2.3.1
    text: |-
      Het is een in Nederland gevestigde vervoerder verboden grensoverschrijdend beroepsvervoer te verrichten voor
      trajecten op het grondgebied van andere staten dan lidstaten, zonder te beschikken over:
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.3
  - number: 2.3.1.a
    text: een geldige CEMT-vergunning, of
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.3
  - number: 2.3.1.b
    text: |-
      één of meerdere daarvoor geldige ritmachtigingen op grond van een verdrag voor het grensoverschrijdend
      goederenvervoer met een andere staat.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.3
  - number: 2.3.2
    text: |-
      De NIWO verleent slechts een CEMT-vergunning dan wel een ritmachtiging voor het verrichten van grensoverschrijdend
      beroepsvervoer aan de in Nederland gevestigde vervoerders, die houder zijn van een communautaire vergunning.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.3
  - number: 2.3.3
    text: |-
      Het is een vervoerder, die niet gevestigd is in een lidstaat verboden om in Nederland beroepsvervoer te verrichten
      zonder te beschikken over:
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.3
  - number: 2.3.3.a
    text: een geldige CEMT-vergunning, of
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.3
  - number: 2.3.3.b
    text: |-
      één of meerdere daarvoor geldige ritmachtigingen op grond van een verdrag voor het goederenvervoer tussen Nederland
      met de staat waarin de vervoerder is gevestigd.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.3
  - number: 2.3.4
    text: |-
      Bij regeling van Onze Minister worden regels gesteld ter uitvoering van het eerste en derde lid en van besluiten
      van de Conferentie van Europese Ministers van Transport. Daartoe behoren in elk geval regels over:
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.3
  - number: 2.3.4.a
    text: de aanvraag tot verlening van een CEMT-vergunning of een ritmachtiging;
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.3
  - number: 2.3.4.b
    text: de verlening, het gebruik en de intrekking van een CEMT-vergunning of een ritmachtiging;
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.3
  - number: 2.3.4.c
    text: de op de ritmachtiging te vermelden gegevens, en
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.3
  - number: 2.3.4.d
    text: de aan de CEMT-vergunning of de ritmachtiging te verbinden voorschriften.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.3
  - number: 2.3.5
    text: |-
      Het is een in Nederland gevestigde vervoerder verboden grensoverschrijdend eigen vervoer te verrichten voor
      trajecten op het grondgebied van andere staten dan lidstaten, zonder te beschikken over een daarvoor geldende door
      de NIWO verleende ritmachtiging, op grond van een verdrag voor het grensoverschrijdend goederenvervoer met een
      andere staat.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.3
  - number: 2.3.6
    text: |-
      Het is een vervoerder, die niet gevestigd is in een lidstaat verboden om in Nederland eigen vervoer te verrichten
      zonder te beschikken over één of meerdere daarvoor geldige ritmachtigingen op grond van een verdrag voor het
      goederenvervoer tussen Nederland met de staat waarin de vervoerder is gevestigd.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.3
  - number: 2.3.7
    text: |-
      Ter uitvoering van een besluit van de Conferentie van Europese Ministers van Transport, of van een verdrag met
      betrekking tot het grensoverschrijdend goederenvervoer, kan bij regeling van Onze Minister vrijstelling worden
      verleend van het verbod, bedoeld in het eerste, derde, vijfde of zesde lid.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.3
  - number: 2.4.1
    text: |-
      De andere staten dan lidstaten, die partij zijn bij de Overeenkomst betreffende de Europese Economische Ruimte
      worden voor de toepassing van de cabotageverordening voor het wegvervoer en van de marktverordening voor het
      wegvervoer en van de [artikelen 2.1 tot en met 2.3][ref1] en [2.5][ref2] gelijkgesteld met een lidstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024800#Artikel2
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0024800
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.4.2
    text: |-
      Voor zover dit uit een verdrag van de Europese Gemeenschap met een staat voortvloeit,
      wordt die staat voor de toepassing van de marktverordening voor het wegvervoer en van
      [artikel 2.1, eerste lid, onderdeel c en vijfde lid][ref1], [artikel 2.3][ref2] en [artikel 2.5][ref3] met een
      lidstaat gelijk gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024800#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0024800#Artikel2
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0024800
        artikel: '2'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0024800
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.4.3
    text: |-
      De door de staten die partij zijn bij de Overeenkomst betreffende de Europese Economische Ruimte verleende
      soortgelijke vervoervergunningen en attesten voor bestuurders worden voor de toepassing van de cabotageverordening
      voor het wegvervoer en van de marktverordening voor het wegvervoer en van [artikel 2.1][ref1] gelijkgesteld met
      communautaire vergunningen onderscheidenlijk met bestuurdersattesten.


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel2
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.4.4
    text: Onze Minister doet van de staten waarop het tweede lid van toepassing is, mededeling in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.4
  - number: '2.5'
    text: |-
      Het is verboden om bij het verrichten van beroepsvervoer anders dan bedoeld in
      [artikel 2.1, tweede, derde, vierde of vijfde lid][ref1], in strijd te handelen met artikel 3, eerste lid, artikel
      5, vierde lid, of artikel 6, vierde lid, van de marktverordening voor het wegvervoer.


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel2
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.6.1
    text: |-
      Het is verboden beroepsvervoer of eigen vervoer te verrichten met een vrachtauto ten aanzien waarvan in strijd
      wordt gehandeld met de bij regeling van Onze Minister aangewezen bepalingen die zijn vastgesteld bij of krachtens
      de [Wegenverkeerswet 1994][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0006622
  - number: 2.6.2
    text: Het eerste lid is van overeenkomstige toepassing op het doen verrichten van beroepsvervoer.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.6
  - number: 2.7.1
    text: |-
      Het is de houder van een communautaire vergunning of van een vergunning als bedoeld in
      [artikel 7.1, eerste lid][ref1], verboden om een gewaarmerkte kopie van die vergunning al dan niet tegen betaling
      ter beschikking te stellen aan een derde ten behoeve van het verrichten van beroepsvervoer.


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel7
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '7'
        hoofdstuk: '7'
  - number: 2.7.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing op degene aan wie door de houder van een vergunning een
      gewaarmerkte kopie van die vergunning ter beschikking is gesteld.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.7
  - number: 2.8.1
    text: |-
      Een vervoerder die een natuurlijk persoon is, heeft toegang tot het beroep van beroepsvervoerder en is gemachtigd
      tot het verrichten van binnenlands en grensoverschrijdend beroepsvervoer, indien:
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.8
  - number: 2.8.1.a
    text: hij voldoet aan de eisen van betrouwbaarheid, financiële draagkracht en vakbekwaamheid, of
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.8
  - number: 2.8.1.b
    text: |-
      hij voldoet aan de eisen van betrouwbaarheid en financiële draagkracht en een andere natuurlijk persoon die de
      vervoeractiviteiten permanent en daadwerkelijk leidt, voldoet aan de eisen van betrouwbaarheid en vakbekwaamheid,
      en
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.8
  - number: 2.8.1.c
    text: |-
      er geen sprake is van een geval waarin op basis van [artikel 3.2, eerste lid][ref1], dan wel [3.4, eerste lid][ref2],
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref3] kan worden toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0024800#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013798#Artikel3
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.8
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '3'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0024800
        artikel: '3'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0013798
        artikel: '3'
  - number: 2.8.2
    text: |-
      Een vervoerder die een rechtspersoon is, heeft toegang tot het beroep van beroepsvervoerder en is gemachtigd tot
      het verrichten van binnenlands en grensoverschrijdend beroepsvervoer indien:
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.8
  - number: 2.8.2.a
    text: hij voldoet aan de eisen van financiële draagkracht;
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.8
  - number: 2.8.2.b
    text: |-
      de een of meer natuurlijke personen die de vervoeractiviteiten permanent en daadwerkelijk leiden, voldoen aan de
      eisen van betrouwbaarheid, en
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.8
  - number: 2.8.2.c
    text: ten minste een van de onder b bedoelde natuurlijke personen voldoet aan de eis van vakbekwaamheid, en
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.8
  - number: 2.8.2.d
    text: |-
      er geen sprake is van een geval waarin op basis van [artikel 3.2, eerste lid][ref1], dan wel [3.4, eerste lid][ref2],
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref3] kan worden toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0024800#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013798#Artikel3
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.8
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '3'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0024800
        artikel: '3'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0013798
        artikel: '3'
  - number: 2.8.3
    text: |-
      De vervoerder die een natuurlijk persoon of een rechtspersoon anders dan een vennootschap zonder
      rechtspersoonlijkheid of maatschap is, heeft bij faillissement geen toegang tot het beroep van beroepsvervoerder en
      is niet meer gemachtigd tot het verrichten van binnenlands en grensoverschrijdend beroepsvervoer met ingang van de
      dag waarop de curator aan de NIWO heeft verklaard dat vervoeractiviteiten zijn gestaakt dan wel waarop de daarvoor
      door de NIWO gestelde termijn ongebruikt is verstreken.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.8
  - number: 2.8.4
    text: |-
      Bij regeling van Onze Minister worden met inachtneming van de beroepsrichtlijn voor het wegvervoer regels gesteld
      over de eisen van financiële draagkracht en vakbekwaamheid, bedoeld in het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.8
  - number: 2.9.1
    text: |-
      De NIWO kan een vervoerder ten behoeve van de tijdelijke voortzetting van de vervoeractiviteiten gedurende
      ten hoogste een jaar toegang tot het beroep van beroepsvervoerder verlenen en machtigen tot het verrichten
      van binnenlands en grensoverschrijdend beroepsvervoer indien als gevolg van overlijden of lichamelijke of
      wettelijke onbekwaamheid van een natuurlijk persoon niet meer wordt voldaan aan de eisen van betrouwbaarheid en
      vakbekwaamheid, bedoeld in [artikel 2.8, eerste onderscheidenlijk tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel2
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.9.2
    text: |-
      De NIWO kan de periode van een jaar, bedoeld in het eerste lid, in bijzondere omstandigheden met maximaal zes
      maanden verlengen.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.9
  - number: 2.9.3
    text: |-
      De NIWO kan een vervoerder die een natuurlijk persoon is en niet voldoet aan de eis van vakbekwaamheid, bedoeld
      in [artikel 2.8, eerste lid][ref1], toegang tot het beroep van beroepsvervoerder verlenen en machtigen tot het
      verrichten van binnenlands en grensoverschrijdend beroepsvervoer ten behoeve van de definitieve voortzetting van
      vervoeractiviteiten, indien hij:


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel2
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.9.3.a
    text: permanent en daadwerkelijk leiding geeft aan de vervoeractiviteiten;
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.9
  - number: 2.9.3.b
    text: |-
      beschikt over tien jaar ervaring in de leiding van de vervoeractiviteiten van een
      vervoerder waaraan een communautaire vergunning dan wel een vergunning als bedoeld in
      [artikel 5, eerste lid, van de Wet goederenvervoer over de weg][ref1] is verleend, en


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel5
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '5'
  - number: 2.9.3.c
    text: ten minste drie jaar ervaring heeft in de leiding van de voort te zetten vervoeractiviteiten.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.9
  - number: 2.9.4
    text: |-
      De NIWO trekt de verlening van de toegang tot het beroep van beroepsvervoerder en de machtiging tot het verrichten
      van binnenlands en grensoverschrijdend beroepsvervoer, bedoeld in het derde lid, in met ingang van de dag dat de
      natuurlijke persoon, niet langer permanent en daadwerkelijk leiding geeft aan de vervoeractiviteiten.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.9
  - number: 2.10.1
    text: |-
      Een natuurlijk persoon of een rechtspersoon voldoet aan de eis van betrouwbaarheid door overlegging van een niet
      ouder dan drie maanden zijnde integriteitsverklaring beroepsvervoer.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.10
  - number: 2.10.2
    text: |-
      De [artikelen 29][ref1], [30, tweede lid][ref2], [32][ref3], [33][ref4],
      [34 tot en met 38 van de Wet justitiële en strafvorderlijke gegevens][ref5] en het krachtens
      [artikel 30, derde lid, van die wet][ref6] bepaalde zijn van overeenkomstige toepassing op de afgifte van de
      integriteitsverklaring beroepsvervoer, met dien verstande dat Onze Minister van Justitie de afgifte van die
      verklaring tevens weigert indien bij rechterlijke uitspraak is vastgesteld dat:


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0014194#Artikel32
      [ref4]: https://wetten.overheid.nl/BWBR0014194#Artikel33
      [ref5]: https://wetten.overheid.nl/BWBR0014194#Artikel34
      [ref6]: https://wetten.overheid.nl/BWBR0014194#Artikel30
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0014194
        artikel: '30'
      - id: ref3
        bwb_id: BWBR0014194
        artikel: '32'
      - id: ref4
        bwb_id: BWBR0014194
        artikel: '33'
      - id: ref5
        bwb_id: BWBR0014194
        artikel: '34'
      - id: ref6
        bwb_id: BWBR0014194
        artikel: '30'
  - number: 2.10.2.a
    text: de aanvrager de geldende voorschriften inzake de financiële arbeidsvoorwaarden niet is nagekomen, of
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.10
  - number: 2.10.2.b
    text: |-
      een rechtspersoon, terwijl de aanvrager een permanent en daadwerkelijk leidinggevende was, de geldende
      voorschriften inzake de financiële arbeidsvoorwaarden niet is nagekomen.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.10
  - number: 2.10.3
    text: |-
      Onze Minister van Justitie geeft in afwijking van het tweede lid, de afgifte van de integriteitsverklaring
      beroepsvervoer af, indien:
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.10
  - number: 2.10.3.a
    text: |-
      de niet-nakoming van de geldende voorschriften inzake de financiële arbeidsvoorwaarden indien herhaald, gelet op
      de overige omstandigheden van het geval, niet aan een behoorlijke uitoefening van de taak als beroepsvervoerder
      onderscheidenlijk als permanent en daadwerkelijk leidinggevende in de weg zal staan,
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.10
  - number: 2.10.3.b
    text: de rechterlijke uitspraak, bedoeld in het tweede lid, is vernietigd.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.10
  - number: 2.10.4
    text: |-
      De griffier van een gerecht als bedoeld in [artikel 2 van de Wet op de rechterlijke organisatie][ref1] verstrekt
      aan Onze Minister van Justitie een afschrift van een uitspraak als bedoeld in het tweede lid onderscheidenlijk in
      het derde lid, onderdeel b.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel2
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '2'
  - number: 2.10.5
    text: |-
      Bij regeling van Onze Minister van Justitie kunnen nadere regels worden gegeven voor de verstrekking van het
      afschrift, bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.10
  - number: 2.10.6
    text: |-
      Voor het in behandeling nemen van een aanvraag tot afgifte van een integriteitsverklaring beroepsvervoer kan Onze
      Minister van Justitie een vergoeding van kosten verlangen, die niet hoger is dan een bij of krachtens algemene
      maatregel van bestuur vast te stellen bedrag.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.10
  - number: 2.10.7
    text: |-
      Een rechtspersoon of een natuurlijk persoon, wiens land van oorsprong of herkomst een andere lidstaat is, voldoet
      aan de eis van betrouwbaarheid door overlegging van een niet ouder dan drie maanden zijnde document of verklaring
      die Nederland op grond van de beroepsrichtlijn voor het wegvervoer, voor het voldoen aan de eis van betrouwbaarheid
      moet erkennen.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.10
  - number: 2.10.8
    text: |-
      De andere staten dan lidstaten die partij zijn bij de Overeenkomst betreffende de Europese Economische Ruimte,
      worden voor de toepassing van het zevende lid gelijk gesteld met lidstaten.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.10
  - number: 2.10.9
    text: |-
      Voorzover dit uit een verdrag van de Gemeenschap met een staat voortvloeit, wordt die staat voor de toepassing
      van het zevende lid gelijk gesteld met een lidstaat. Onze Minister doet van deze gelijkstelling mededeling in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.10
  - number: 2.10.10
    text: |-
      De NIWO kan indien zij twijfelt aan de betrouwbaarheid van een rechtspersoon of een natuurlijk persoon ook anders
      dan bij de aanvraag tot verlening of verlenging van de communautaire vergunning de overlegging vorderen van een
      integriteitsverklaring beroepsvervoer dan wel van een document of verklaring als bedoeld in het zevende lid, die
      niet ouder is dan drie maanden.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.10
  - number: 2.11.1
    text: |-
      Het is een vervoerder verboden vervoer te verrichten met gebruikmaking van bestuurders van vrachtauto’s die niet
      bij hem in dienstbetrekking zijn.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.11
  - number: 2.11.2
    text: |-
      Ten blijke van de in het eerste lid bedoelde dienstbetrekking wordt door de vervoerder en de bestuurder van een
      vrachtauto gezamenlijk een verklaring opgesteld waarin in ieder geval wordt vermeldt dat:
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.11
  - number: 2.11.2.a
    text: het vervoer voor rekening en risico van de vervoerder wordt verricht; en
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.11
  - number: 2.11.2.b
    text: tussen de vervoerder en de bestuurder van een vrachtauto sprake is van een loons- en gezagsverhouding.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.11
  - number: 2.11.3
    text: Onze Minster stelt het model vast van de in het tweede lid bedoelde verklaring.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.11
  - number: 2.11.4
    text: |-
      Bij regeling van Onze Minister worden regels gegeven over de gevallen waarin Onze Minister ontheffing kan verlenen
      van het in het eerste lid vermelde verbod, alsmede over de in die gevallen benodigde documenten.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.11
  - number: 2.11.5
    text: Een ontheffing kan onder beperkingen worden verleend en aan een ontheffing kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.11
  - number: 2.11.6
    text: |-
      Door overtreding van het verbod, bedoeld in het eerste lid, wordt niet langer voldaan aan de eis van
      betrouwbaarheid.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.11
  - number: 2.12.1
    text: |-
      Het bestuurdersattest wordt verleend voor de periode dat de bestuurder ingevolge de
      [Wet arbeid vreemdelingen][ref1] gerechtigd is arbeid te verrichten doch ten hoogste voor een periode van vijf
      jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0007149
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0007149
  - number: 2.12.2
    text: |-
      De NIWO kan de geldigheid van het bestuurdersattest verlengen tot een periode van ten hoogste vijf jaar indien
      de periode waarin de bestuurder ingevolge de [Wet arbeid vreemdelingen][ref1] gerechtigd is arbeid te verrichten,
      is verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0007149
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0007149
  - number: 2.13.1
    text: |-
      Het is verboden om beroepsvervoer te verrichten indien met betrekking tot dat vervoer geen vrachtbrief is
      opgemaakt.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.13
  - number: 2.13.2
    text: 'Het verbod, bedoeld in het eerste lid, is niet van toepassing op binnenlands beroepsvervoer dat:'
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.13
  - number: 2.13.2.a
    text: wordt verricht met een of meer vrachtauto’s met een toegestaan laadvermogen van niet meer dan 500 kg, of
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.13
  - number: 2.13.2.b
    text: bij regeling van Onze Minister is aangewezen.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.13
  - number: 2.13.3
    text: 'Bij ministeriële regeling worden regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.13
  - number: 2.13.3.a
    text: de inhoud van de vrachtbrief voor het binnenlands beroepsvervoer, en
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.13
  - number: 2.13.3.b
    text: het gebruik van de vrachtbrief voor het binnenlands en het grensoverschrijdend beroepsvervoer.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel2.13
  - number: 3.1.1
    text: 'De NIWO beslist binnen acht weken na ontvangst daarvan op de aanvraag door een vervoerder:'
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel3.1
  - number: 3.1.1.a
    text: tot verlening of verlenging van een communautaire vergunning;
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel3.1
  - number: 3.1.1.b
    text: tot verlening of verlenging van een bestuurdersattest;
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel3.1
  - number: 3.1.1.c
    text: |-
      tot verlening en machtiging als bedoeld in [artikel 2.9][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel2
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '2'
        hoofdstuk: '2'
  - number: 3.1.1.d
    text: tot verlening van een CEMT-vergunning of van een ritmachtiging.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel3.1
  - number: 3.1.2
    text: |-
      De NIWO neemt een aanvraag als bedoeld in het eerste lid niet eerder in behandeling dan nadat zij de daarvoor
      krachtens [artikel 4.6, eerste lid, onderdeel a][ref1], verschuldigde vergoeding heeft ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel4
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '4'
        hoofdstuk: '4'
  - number: 3.1.3
    text: Indien de NIWO niet tijdig heeft beslist, is de aanvraag toegewezen.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel3.1
  - number: 3.2.1
    text: |-
      De NIWO weigert de verlening of verlenging van een communautaire vergunning in het geval en onder de voorwaarden
      van [artikel 3 van de Wet bevordering integriteitsbeoordelingen openbaar bestuur][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel3
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '3'
  - number: 3.2.2
    text: |-
      Voordat de NIWO toepassing geeft aan het eerste lid, kan zij het Bureau
      bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8, van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1], om een advies als
      bedoeld in [artikel 9 van die wet][ref2] vragen.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel9
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0013798
        artikel: '9'
  - number: 3.3.1
    text: |-
      De NIWO weigert de verlening van een CEMT-vergunning indien daarvan vermoedelijk geen, onvoldoende of slechts voor
      bilateraal vervoer gebruik zal worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel3.3
  - number: 3.3.2
    text: |-
      Bij regeling van Onze Minister kunnen nadere regels worden gesteld voor de verdeling van de voor de in Nederland
      gevestigde vervoerders in het kalenderjaar beschikbare CEMT-vergunningen en ritmachtigingen.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel3.3
  - number: 3.4.1
    text: |-
      De NIWO gaat over tot intrekking van de communautaire vergunning, in het geval en onder de voorwaarden, bedoeld in
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel3
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '3'
  - number: 3.4.2
    text: |-
      Voordat de NIWO toepassing geeft aan het eerste lid, kan zij het Bureau
      bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8, van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1], om een advies als
      bedoeld in [artikel 9 van die wet][ref2] vragen.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel9
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0013798
        artikel: '9'
  - number: 3.5.1
    text: 'De NIWO trekt een aan een in Nederland gevestigde vervoerder verleende CEMT-vergunning of ritmachtiging in:'
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel3.5
  - number: 3.5.1.a
    text: op verzoek van de vervoerder;
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel3.5
  - number: 3.5.1.b
    text: indien de vervoerder niet meer beschikt over een geldige communautaire vergunning, of
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel3.5
  - number: 3.5.1.c
    text: |-
      de daartoe krachtens [artikel 2.3, vierde lid][ref1], vastgestelde gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel2
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '2'
        hoofdstuk: '2'
  - number: 3.5.2
    text: |-
      De NIWO kan een aan een in Nederland gevestigde vervoerder verleende CEMT-vergunning intrekken indien de vervoerder
      daarvan geen, onvoldoende of slechts voor bilateraal vervoer gebruik heeft gemaakt.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel3.5
  - number: 3.6.1
    text: |-
      De vervoerder levert een vervallen of ingetrokken communautaire vergunning, CEMT-vergunning,
      ritmachtiging, verlening en machtiging als bedoeld in [artikel 2.9][ref1], vergunning als bedoeld in
      [artikel 7.1, eerste lid][ref2], of een vervallen of ingetrokken bestuurdersattest bij de NIWO in binnen één week
      na de vervaldatum, onderscheidenlijk de datum van inwerkingtreding van de beschikking tot intrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024800#Artikel7
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0024800
        artikel: '7'
        hoofdstuk: '7'
  - number: 3.6.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing op de verstrekte gewaarmerkte kopieën van de vervallen of
      ingetrokken communautaire vergunning of van het vervallen of ingetrokken bestuurdersattest.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel3.6
  - number: 4.1.1
    text: 'De NIWO is belast met:'
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel4.1
  - number: 4.1.1.a
    text: de verlening, verlenging en intrekking van een communautaire vergunning;
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel4.1
  - number: 4.1.1.b
    text: de verlening en intrekking van een bestuurdersattest;
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel4.1
  - number: 4.1.1.c
    text: de verlening en intrekking van een CEMT-vergunning of een ritmachtiging;
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel4.1
  - number: 4.1.1.d
    text: |-
      de verlening en machtiging, bedoeld in [artikel 2.9][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel2
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '2'
        hoofdstuk: '2'
  - number: 4.1.1.e
    text: |-
      het onderzoek, bedoeld in [artikel 7.1, derde en vierde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel7
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '7'
        hoofdstuk: '7'
  - number: 4.1.1.f
    text: |-
      de intrekking van een vergunning, bedoeld in [artikel 7.2, eerste en tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel7
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '7'
        hoofdstuk: '7'
  - number: 4.1.1.g
    text: ondersteuning van onderhandelingen in het kader van verdragen over goederenvervoer, en met
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel4.1
  - number: 4.1.1.h
    text: |-
      het beheer van gegevensbestanden en de verstrekking van gegevens uit die bestanden, uit hoofde van haar publieke
      taken.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel4.1
  - number: 4.1.2
    text: Bij regeling van Onze Minister kan de NIWO belast worden met andere taken ten aanzien van het goederenvervoer.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel4.1
  - number: 4.1.3
    text: |-
      Op de NIWO is de [Kaderwet zelfstandige bestuursorganen][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020495
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0020495
  - number: '4.2'
    text: |-
      De beleidsregels die de NIWO vaststelt in verband met haar taken als bedoeld in [artikel 4.1][ref1] worden bekend
      gemaakt in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel4
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.3.1
    text: 'Het bestuur van de NIWO is samengesteld uit:'
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel4.3
  - number: 4.3.1.a
    text: |-
      leden die worden benoemd door representatieve organisaties die de onderscheiden belangen ten aanzien van het
      goederenvervoer vertegenwoordigen en door Onze Minister zijn aangewezen, en
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel4.3
  - number: 4.3.1.b
    text: twee onafhankelijke leden die worden benoemd door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel4.3
  - number: 4.3.2
    text: |-
      Bij regeling van Onze Minister wordt per representatieve organisatie het aantal te benoemen bestuursleden bepaald,
      dat ten hoogste 40% van het totaal aantal bestuursleden kan bedragen.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel4.3
  - number: 4.3.3
    text: |-
      De in het eerste lid bedoelde organisaties kunnen de door hen benoemde leden van het bestuur van de NIWO schorsen
      en ontslaan.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel4.3
  - number: 4.3.4
    text: Onze Minister kan de door hem benoemde onafhankelijke leden van het bestuur van de NIWO schorsen en ontslaan.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel4.3
  - number: 4.3.5
    text: |-
      De leden van het bestuur van de NIWO worden benoemd voor een periode van drie jaar welke periode met ten hoogste
      drie jaar kan worden verlengd.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel4.3
  - number: 4.3.6
    text: De in het eerste lid bedoelde organisaties wijzen plaatsvervangers aan voor de door hen benoemde leden.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel4.3
  - number: 4.3.7
    text: De vergaderingen van het bestuur kunnen worden bijgewoond door ambtenaren die door Onze Minister zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel4.3
  - number: 4.4.1
    text: |-
      De NIWO brengt geen wijziging aan in haar statuten of neemt geen besluit tot opheffing dan na instemming door Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel4.4
  - number: 4.4.2
    text: De NIWO maakt jaarlijks een begroting van baten en lasten op, die de instemming van Onze Minister behoeft.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel4.4
  - number: 4.4.3
    text: |-
      De [artikelen 10:28 tot en met 10:31 van de Algemene wet bestuursrecht][ref1] zijn van overeenkomstige toepassing
      op het eerste en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '10'
  - number: 4.4.4
    text: 'De NIWO vermeldt in het jaarverslag in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel4.4
  - number: 4.4.4.a
    text: |-
      het aantal houders van een communautaire vergunning, van een CEMT-vergunning of van een vergunning als bedoeld in
      [artikel 7.1, eerste lid][ref1] op de eerste dag van het kalenderjaar en op de laatste dag van het voorafgaande
      kalenderjaar;


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel7
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '7'
        hoofdstuk: '7'
  - number: 4.4.4.b
    text: |-
      het aantal gewaarmerkte kopieën van de vergunningen, bedoeld in onderdeel a op de eerste en op de laatste dag van
      het voorafgaande kalenderjaar;
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel4.4
  - number: 4.4.4.c
    text: |-
      het aantal communautaire vergunningen, bestuurdersattesten, CEMT-vergunningen en ritmachtigingen, dat in het
      voorafgaande kalenderjaar is verleend, verlengd of ingetrokken;
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel4.4
  - number: 4.4.4.d
    text: het aantal gewaarmerkte kopieën van de in het voorafgaande kalenderjaar verleende communautaire vergunningen;
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel4.4
  - number: 4.4.4.e
    text: |-
      het aantal vergunningen als bedoeld in [artikel 7.1, eerste lid][ref1], dat in het voorafgaande kalenderjaar is
      ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel7
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '7'
        hoofdstuk: '7'
  - number: 4.5.1
    text: |-
      Onze Minister kan aan de NIWO aanwijzingen van algemene aard geven met betrekking tot de uitvoering van de in
      [artikel 4.1][ref1], bedoelde taken.


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel4
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.5.2
    text: Bij regeling van Onze Minister kunnen nadere regels worden gesteld over de uitoefening van het toezicht op de NIWO.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel4.5
  - number: 4.6.1
    text: |-
      Ter dekking van de kosten van uitvoering van de bij of krachtens [artikel 4.1][ref1] aan de NIWO opgedragen
      werkzaamheden:


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel4
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.6.1.a
    text: |-
      is de aanvrager aan de NIWO een vergoeding verschuldigd voor het in behandeling nemen van een aanvraag tot
      verlening of verlenging van een communautaire vergunning, tot verlening of verlenging van een bestuurdersattest,
      tot verlening van een CEMT-vergunning of van een ritmachtiging of tot de verlening en machtiging, bedoeld in
      [artikel 2.9][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel2
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '2'
        hoofdstuk: '2'
  - number: 4.6.1.b
    text: is de houder van een communautaire vergunning jaarlijks een vergoeding aan de NIWO verschuldigd;
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel4.6
  - number: 4.6.1.c
    text: |-
      is de houder van een vergunning als bedoeld in [artikel 7.1, eerste lid][ref1], jaarlijks een vergoeding aan de
      NIWO verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel7
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '7'
        hoofdstuk: '7'
  - number: 4.6.2
    text: De NIWO stelt de tarieven van de vergoedingen, bedoeld in het eerste lid vast.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel4.6
  - number: 4.6.3
    text: |-
      De tarieven voor de vergoedingen, bedoeld in het eerste lid, onderdeel a, worden zodanig vastgesteld dat de begrote
      baten van die vergoedingen niet uitgaan boven de begrote kosten ter zake van de behandeling van de in het eerste
      lid bedoelde aanvragen.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel4.6
  - number: 4.6.4
    text: |-
      De tarieven voor de vergoedingen, bedoeld in het eerste lid, onderdelen b en c, worden zodanig vastgesteld
      dat de begrote baten van die vergoedingen niet uitgaan boven de begrote lasten van de taken, bedoeld in
      [artikel 4.1][ref1], anders dan de behandeling van aanvragen.


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel4
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.6.5
    text: Onder de in het vierde lid bedoelde lasten wordt mede verstaan de bijdragen aan reserves van de NIWO.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel4.6
  - number: 4.6.6
    text: |-
      De NIWO maakt de besluiten tot vaststelling van de tarieven van de vergoedingen, bedoeld in het
      eerste lid, bekend in de Staatscourant met vermelding van de dagtekening van het besluit van Onze
      Minister waarbij de goedkeuring is verleend of met vermelding van de omstandigheid dat ingevolge
      [artikel 10:31, vierde lid, van de Algemene wet bestuursrecht][ref1], een besluit tot goedkeuring wordt geacht te
      zijn genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '10'
  - number: 5.1.1
    text: |-
      Met het toezicht op de naleving van de marktverordening voor het wegvervoer en het bepaalde bij of krachtens deze
      wet zijn belast:
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel5.1
  - number: 5.1.1.a
    text: |-
      de bij of krachtens [artikel 141 van het Wetboek van Strafvordering][ref1] aangewezen ambtenaren;


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: 5.1.1.b
    text: de bij besluit van Onze Minister daartoe aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel5.1
  - number: 5.1.2
    text: |-
      Van een besluit als bedoeld in het eerste lid, onderdeel c, wordt mededeling gedaan door plaatsing in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel5.1
  - number: 5.2.1
    text: |-
      Onze Minister is bevoegd tot toepassing van bestuursdwang ter handhaving van de marktverordening voor het
      wegvervoer en van het bepaalde bij of krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel5.2
  - number: 5.2.2
    text: |-
      In afwijking van [artikel 5:24, derde lid, van de Algemene wet bestuursrecht][ref1], kan de beschikking tot
      toepassing van bestuursdwang bekend worden gemaakt aan de bestuurder van de vrachtauto ten aanzien waarvan
      bestuursdwang zal worden toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 5.2.3
    text: |-
      In geval van overtreding van [artikel 3.6][ref1] kan de NIWO de vervoerder een last onder dwangsom opleggen
      teneinde die overtreding ongedaan te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel3
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '3'
        hoofdstuk: '3'
  - number: '5.3'
    text: |-
      De Nederlandse strafwet is mede van toepassing op de in Nederland gevestigde vervoerder die zich buiten Nederland
      schuldig maakt aan een overtreding van het bepaalde bij of krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel5.3
  - number: 5.4.1
    text: |-
      De ambtenaren, die op basis van [artikel 17 van de Wet op de economische delicten][ref1] zijn belast met de
      opsporing van overtredingen van deze wet, zijn bevoegd het vervoer van goederen dat wordt verricht in strijd
      met de [artikelen 2.3, eerste en derde lid][ref2] en [2.5][ref3] te beletten en een mechanisch hulpmiddel aan te
      brengen of te doen aanbrengen op de vrachtauto waarmee de overtreding is gepleegd waardoor wordt verhinderd dat de
      vrachtauto wordt weggereden, teneinde de overtreding te doen ophouden.


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0024800#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0024800#Artikel2
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel5.4
    references:
      - id: ref1
        bwb_id: BWBR0002063
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0024800
        artikel: '2'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0024800
        artikel: '2'
        hoofdstuk: '2'
  - number: 5.4.2
    text: |-
      Het aangebrachte mechanisch hulpmiddel wordt verwijderd nadat de overtreding is opgehouden dan wel na het
      aanbrengen achtenveertig uren zijn verstreken en de kosten van het aanbrengen en het verwijderen ervan zijn
      voldaan.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel5.4
  - number: 5.4.3
    text: |-
      De betrokken ambtenaar maakt van het aanbrengen van het mechanisch hulpmiddel, bedoeld in het eerste lid,
      proces-verbaal op. Hij zendt dit proces-verbaal binnen vierentwintig uur aan de officier van justitie in het
      arrondissement waarin de rechtbank is gelegen waar het aanbrengen van het mechanisch hulpmiddel, bedoeld in het
      eerste lid, is geschied. Een afschrift van het proces-verbaal wordt gelijktijdig uitgereikt of toegezonden aan
      de bestuurder.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel5.4
  - number: 5.5.1
    text: |-
      Elke belanghebbende kan tegen het aanbrengen van het mechanisch hulpmiddel, bedoeld in
      [artikel 5.4, eerste lid][ref1], gedurende vier weken een beroepsschrift indienen bij de rechtbank, bedoeld in
      [artikel 5.4, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0024800#Artikel5
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel5.5
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '5'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0024800
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.5.2
    text: |-
      Indien de rechtbank het beroepschrift gegrond acht, kan zij bepalen dat ten laste van de Staat der Nederlanden een
      vergoeding wordt toegekend.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel5.5
  - number: 5.5.3
    text: |-
      Tegen de beschikking van de rechtbank staat het Openbaar Ministerie binnen twee weken en de belanghebbende binnen
      twee weken nadat zij hem betekend werd, hoger beroep open bij het gerechtshof.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel5.5
  - number: 5.5.4
    text: |-
      Tegen de beschikking van het gerechtshof staat het Openbaar Ministerie binnen twee weken en de belanghebbende
      binnen twee weken nadat zij hem betekend werd, beroep in cassatie open.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel5.5
  - number: 7.1.1
    text: |-
      Het verbod, bedoelt in [artikel 2.1, eerste lid][ref1], geldt niet voor binnenlands
      beroepsvervoer door een vervoerder die beschikt over een geldige vergunning als bedoeld in
      [artikel 5, eerste lid, van de Wet goederenvervoer over de weg][ref2], die vóór de inwerkingtreding van deze wet
      is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005443#Artikel5
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0005443
        artikel: '5'
  - number: 7.1.2
    text: De vergunning, bedoeld in het eerste lid, blijft voor onbepaalde tijd geldig.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel7.1
  - number: 7.1.3
    text: 'De NIWO onderzoekt iedere vijf jaar indien de vervoerder een natuurlijk persoon is of :'
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel7.1
  - number: 7.1.3.a
    text: hij voldoet aan de eisen van betrouwbaarheid, financiële draagkracht en vakbekwaamheid, of
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel7.1
  - number: 7.1.3.b
    text: |-
      hij voldoet aan de eisen van betrouwbaarheid en financiële draagkracht en de natuurlijk persoon die de
      vervoeractiviteiten permanent en daadwerkelijk leidt, voldoet aan de eisen van betrouwbaarheid en vakbekwaamheid.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel7.1
  - number: 7.1.4
    text: 'De NIWO onderzoekt iedere vijf jaar indien de vervoerder een rechtspersoon is of:'
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel7.1
  - number: 7.1.4.a
    text: hij voldoet aan de eisen van betrouwbaarheid en financiële draagkracht;
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel7.1
  - number: 7.1.4.b
    text: |-
      de een of meer natuurlijke personen die de vervoeractiviteiten permanent en daadwerkelijk leiden, voldoen aan de
      eisen van betrouwbaarheid, en
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel7.1
  - number: 7.1.4.c
    text: ten minste een van de onder b bedoelde natuurlijke personen voldoet aan de eisen van vakbekwaamheid.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel7.1
  - number: 7.1.5
    text: |-
      Het krachtens [artikel 2.8, vierde lid][ref1], met betrekking tot de eis van financiële draagkracht
      bepaalde, [artikel 2.10][ref2], het krachtens [artikel 2.10, derde lid][ref3], bepaalde en het krachtens
      [artikel 30, derde lid, van de Wet justitiële en strafvorderlijke gegevens][ref4] bepaalde, zijn van
      overeenkomstige toepassing op de vergunning, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024800#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0024800#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0014194#Artikel30
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0024800
        artikel: '2'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0024800
        artikel: '2'
        hoofdstuk: '2'
      - id: ref4
        bwb_id: BWBR0014194
        artikel: '30'
  - number: 7.1.6
    text: |-
      Het bij of krachtens [artikel 21, eerste, of tweede lid, van het Besluit goederenvervoer over de weg][ref1],
      bepaalde zoals dat luidde op de dag voor de inwerkingtreding van deze wet, is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005496#Artikel21
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0005496
        artikel: '21'
  - number: 7.2.1
    text: |-
      De NIWO trekt de vergunning, bedoeld in [artikel 7.1, eerste lid][ref1], in:


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel7
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.2.1.a
    text: |-
      indien niet meer wordt voldaan aan de eisen van betrouwbaarheid, financiële draagkracht en vakbekwaamheid, bedoeld
      in [artikel 7.1, derde, vijfde en zesde lid onderscheidenlijk vierde tot en met zesde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel7
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.2.1.b
    text: op verzoek van de vergunninghouder;
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel7.2
  - number: 7.2.1.c
    text: indien de vervoerder zijn vervoersactiviteiten heeft gestaakt, of
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel7.2
  - number: 7.2.1.d
    text: |-
      indien de een of meer natuurlijke personen die vóór de inwerkingtreding van deze wet de vervoeractiviteiten
      van de vervoerder permanent en daadwerkelijk leidden en voldeden aan de eis van vakbekwaamheid, bedoeld
      in [artikel 7.1, derde en zesde lid onderscheidenlijk vierde en zesde lid][ref1], niet langer permanent en
      daadwerkelijk leiding geven aan die vervoeractiviteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel7
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.2.2
    text: |-
      De NIWO kan de vergunning, bedoeld in [artikel 7.1, eerste lid][ref1], intrekken in het geval en onder de
      voorwaarden, bedoeld in [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel3
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '7'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0013798
        artikel: '3'
  - number: 7.2.3
    text: |-
      Voordat de NIWO toepassing geeft aan het tweede lid, kan zij het Bureau
      bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8, van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1], om een advies als
      bedoeld in [artikel 9 van die wet][ref2] vragen.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel9
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0013798
        artikel: '9'
  - number: 7.2.4
    text: |-
      De vergunning, bedoeld in [artikel 7.1, eerste lid][ref1], vervalt van rechtswege met ingang van het tijdstip van:


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel7
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.2.4.a
    text: |-
      overlijden dan wel intreden van wettelijke onbekwaamheid van de natuurlijke persoon waaraan de vergunning is
      verleend, of
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel7.2
  - number: 7.2.4.b
    text: ontbinding van de rechtspersoon waaraan de vergunning is verleend.
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel7.2
  - number: 7.2.5
    text: |-
      [Artikel 2.9, eerste en tweede lid][ref1] is van overeenkomstige toepassing indien als
      gevolg van overlijden of lichamelijke of wettelijke onbekwaamheid van een natuurlijk persoon
      niet meer wordt voldaan aan de eisen van betrouwbaarheid en vakbekwaamheid, bedoeld in
      [artikel 7.1, derde, vijfde en zesde lid onderscheidenlijk vierde tot en met zesde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024800#Artikel7
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0024800
        artikel: '7'
        hoofdstuk: '7'
  - number: '7.3'
    text: |-
      Een vergunning als bedoeld in [artikel 13, eerste lid, van de Wet goederenvervoer over de weg][ref1], die is
      verleend voor de inwerkingtreding van deze wet, wordt gedurende haar geldigheidsperiode aangemerkt als een
      verlening en machtiging ten behoeve van de tijdelijke voortzetting van vervoeractiviteiten als bedoeld in
      [artikel 2.9][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0024800#Artikel2
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel7.3
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0024800
        artikel: '2'
        hoofdstuk: '2'
  - number: '8.2'
    text: |-
      Een wijziging van de bijlage, behorende bij de vrijstellingsrichtlijn voor het wegvervoer gaat voor de toepassing
      van de [artikel 2.1, eerste lid, onderdeel c, derde lid, onderdeel c, vierde en vijfde lid][ref1], gelden met
      ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel2
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '2'
        hoofdstuk: '2'
  - number: '8.6'
    text: |-
      De [Wet goederenvervoer over de weg][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0005443
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel8.6
    references:
      - id: ref1
        bwb_id: BWBR0005443
  - number: '8.8'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip. Bij koninklijk besluit kunnen andere
      tijdstippen worden vastgesteld waarop de onderdelen van [artikel 8.4][ref1] in werking treden.


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel8
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel8.8
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '8'
        hoofdstuk: '8'
  - number: '8.9'
    text: 'Deze wet wordt aangehaald als: Wet wegvervoer goederen.'
    url: https://wetten.overheid.nl/BWBR0024800/2013-01-01#Artikel8.9
