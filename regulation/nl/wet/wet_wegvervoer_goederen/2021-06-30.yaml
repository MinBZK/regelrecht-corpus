preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om de regelgeving voor de toelating tot het beroep
    van goederenvervoerder over de weg en voor de toelating tot de markt van het goederenvervoer over de weg te
    versoberen, om de administratieve lasten voor de goederenvervoerders te verminderen en de handhaafbaarheid van de
    regelgeving te verbeteren, mede gelet op de eerste richtlijn van de Raad van de Europese Gemeenschap van 23 juli
    1962 betreffende de vaststelling van gemeenschappelijke regels voor bepaalde soorten goederenvervoer over de weg
    (Pb EG 70), verordening (EEG) nr. 881/92 van de Raad van de Europese Gemeenschappen van 26 maart 1992 betreffende
    de toegang tot de markt van het goederenvervoer over de weg in de Gemeenschap van of naar het grondgebied van een
    Lidstaat of over het grondgebied van een of meer Lid-Staten (PbEG L 95), verordening (EEG) nr. 3118/93 van de Raad
    van Europese Gemeenschappen van 25 oktober 1993 tot vaststelling van de voorwaarden waaronder vervoerders worden
    toegelaten tot het binnenlands goederenvervoer over de weg in een Lid-Staat waarin zij niet gevestigd zijn (PbEG
    L 279) en op richtlijn nr. 96/26/EG van de Raad van de Europese Unie van 29 april 1996 inzake de toegang tot het
    beroep van vervoerder van goederen-, respectievelijk personenvervoer over de weg, nationaal en internationaal,
    en inzake de wederzijdse erkenning van diploma’s, certificaten en andere titels ter vergemakkelijking van de
    uitoefening van het recht van vrije vestiging van bedoelde vervoerondernemers (PbEG L 124);

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *beroepsverordening voor het wegvervoer:* de
      bij regeling van Onze Minister aangewezen beroepsverordening voor het wegvervoer;
        - *beroepsvervoer:* vervoer van goederen met een of meer vrachtauto's dat tegen vergoeding van een of meer derden
      wordt verricht, niet zijnde eigen vervoer;
        - *bestuurdersattest:* bestuurdersattest als bedoeld in de marktverordening voor het wegvervoer;
        - *cabotagevervoer:* binnenlands beroepsvervoer door een niet in Nederland gevestigde vervoerder;
        - *CEMT-vergunning:* de vergunning die door het Secretariaat van de Europese Conferentie van Ministers van Verkeer
      (CEMT) wordt uitgegeven voor het verrichten van grensoverschrijdend goederenvervoer;
        - *communautaire vergunning:* communautaire vergunning als bedoeld in de marktverordening voor het wegvervoer;
        - *eigen vervoer:* vervoer van goederen met een of meer vrachtauto's dat voor eigen rekening wordt verricht
      dan wel als werkzaamheid van ondersteunende aard die direct samenhangt met de hoofdwerkzaamheid binnen de
      bedrijfsactiviteiten;
        - *lidstaat:* lidstaat van de Europese Unie;
        - *marktverordening voor het wegvervoer:* de bij regeling van Onze Minister aangewezen marktverordening voor het
      wegvervoer;
        - *NIWO:* de in [artikel 4.1][ref1] bedoelde organisatie;
        - *Onze Minister:* Onze Minister van Infrastructuur en Milieu;
        - *vervoerder:* de natuurlijke persoon, de rechtspersoon, de vennootschap zonder rechtspersoonlijkheid of de
      maatschap voor wiens rekening en risico het beroepsvervoer of het eigen vervoer wordt verricht;
        - *vervoersmanager:* vervoersmanager als bedoeld in de beroepverordening voor het wegvervoer;
        - *vrachtauto:* motorvoertuig of een samenstel van voertuigen, dat uitsluitend wordt gebruikt voor vervoer van
      goederen.


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel4
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '4'
        hoofdstuk: '4'
  - number: 1.2.1
    text: |-
      In deze wet en de daarop berustende bepalingen wordt onder beroepsvervoer onderscheidenlijk eigen vervoer mede
      verstaan de ledige ritten en het laden en lossen van zaken in een vrachtauto in verband met dit vervoer.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel1.2
  - number: 1.2.2
    text: |-
      In deze wet en de daarop berustende bepalingen wordt onder rechtspersoon mede verstaan de vennootschap zonder
      rechtspersoonlijkheid en de maatschap.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel1.2
  - number: 1.2.3
    text: |-
      Een natuurlijk persoon die goederen vervoert met een communautaire vergunning van een derde of met een vergunning
      als bedoeld in [artikel 7.1, eerste lid][ref1], van een derde, verricht beroepsvervoer indien hij de vrachtauto
      waarmee de goederen worden vervoerd in eigendom heeft of de vrachtauto hem anderszins tegen vergoeding ter
      beschikking is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel7
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel1.2
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '7'
        hoofdstuk: '7'
  - number: 1.2.4
    text: |-
      Het binnenlands vervoer van goederen ten behoeve van een andere rechtspersoon geschiedt voor de toepassing van deze
      wet voor eigen rekening indien:
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel1.2
  - number: 1.2.4.a
    text: |-
      die rechtspersoon samen met de vervoerder al dan niet met een of meer andere rechtspersonen ingevolge een
      beschikking op basis van [artikel 15 van de Wet op de vennootschapsbelasting 1969][ref1], als een fiscale eenheid
      wordt aangemerkt, of


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel15
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel1.2
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '15'
  - number: 1.2.4.b
    text: |-
      die rechtspersoon samen met de vervoerder al dan niet met een of meer andere rechtspersonen ingevolge een
      beschikking op basis van [artikel 7 van de Wet op de omzetbelasting 1968][ref1], als één onderneming wordt
      aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel7
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel1.2
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '7'
  - number: '1.3'
    text: 'Deze wet is van toepassing op het beroepsvervoer en het eigen vervoer dat wordt verricht:'
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel1.3
  - number: 1.3.a
    text: door een in Nederland gevestigde vervoerder;
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel1.3
  - number: 1.3.b
    text: in Nederland door een buiten Nederland gevestigde vervoerder.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel1.3
  - number: 2.1.1
    text: |-
      De communautaire vergunning is de Nederlandse vergunning voor de uitoefening van het beroep van ondernemer van
      goederenvervoer over de weg, bedoeld in de beroepsverordening voor het wegvervoer, heeft een geldigheidsduur van
      maximaal vijf jaar en kan telkens voor vijf jaar worden verlengd.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.1
  - number: 2.1.2
    text: |-
      Een vervoerder heeft geen toegang respectievelijk geen toegang meer tot het beroep van wegvervoerondernemer
      indien op basis van [artikel 3.2, eerste lid][ref1], respectievelijk [3.4, eerste lid][ref2],
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref3] jegens de vervoerder
      toepassing vindt.


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0024800#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013798#Artikel3
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '3'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0024800
        artikel: '3'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0013798
        artikel: '3'
  - number: 2.1.3
    text: |-
      De beroepsverordening voor het wegvervoer is van toepassing op het beroepsvervoer door een in Nederland gevestigde
      ondernemer dat wordt verricht met één of meer vrachtauto's met een laadvermogen van meer dan 500 kilogram.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.1
  - number: 2.1.4
    text: |-
      De NIWO is de bevoegde instantie voor de beroepsverordening voor het wegvervoer en de marktverordening voor het
      wegvervoer.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.1
  - number: 2.1.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt onder daarbij te stellen voorwaarden een gehele of
      gedeeltelijke vrijstelling verleend van de beroepsverordening voor het wegvervoer aan een in Nederland gevestigde
      vervoerder die uitsluitend binnenlands beroepsvervoer verrichten dat slechts een geringe weerslag heeft op de
      vervoermarkt wegens de aard van de vervoerde goederen of de geringe afstand die wordt afgelegd.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.1
  - number: 2.1.6
    text: |-
      De voordracht voor een krachtens het vijfde lid vast te stellen algemene maatregel van bestuur wordt niet gedaan
      dan vier weken nadat het ontwerp aan de beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.1
  - number: 2.2.1
    text: |-
      Het is een in een andere lidstaat gevestigde vervoerder verboden om in Nederland cabotagevervoer te verrichten in
      strijd met daaromtrent bij of krachtens de marktverordening voor het wegvervoer bepaalde.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.2
  - number: 2.2.2
    text: |-
      Bij regeling van Onze Minister kan, met inachtneming van de overgangsbepalingen van een verdrag betreffende de
      toetreding van één of meer staten tot de Europese Unie, in afwijking van de marktverordening voor het wegvervoer,
      het in Nederland verrichten van grensoverschrijdend beroepsvervoer of cabotagevervoer worden verboden.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.2
  - number: 2.2.3
    text: Het verrichten van beroepsvervoer in strijd met een krachtens het tweede lid vastgesteld verbod, is verboden.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.2
  - number: 2.2.4
    text: |-
      De vervoerder overlegt ter plaatse indien een toezichthouder belast met het toezicht op de naleving van de
      marktverordening voor het wegvervoer die heeft gevorderd, de op grond van die verordening vereiste duidelijke
      bewijzen dat het cabotagevervoer in overeenstemming met die verordening geschiedt.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.2
  - number: 2.2.5
    text: Cabotagevervoer door een vervoerder die niet in een lidstaat is gevestigd, is verboden.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.2
  - number: 2.2.6
    text: |-
      Ter uitvoering van een besluit van de Conferentie van Europese Ministers van Transport of van een bilateraal
      verdrag met een staat, niet zijnde een EU-lidstaat of een daarmee gelijkgestelde staat, kan bij of krachtens
      algemene maatregel van bestuur vrijstelling worden verleend van het verbod, bedoeld in het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.2
  - number: 2.2.7
    text: |-
      De voordracht voor een krachtens het zesde lid vast te stellen algemene maatregel van bestuur wordt niet gedaan dan
      vier weken nadat het ontwerp aan de beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.2
  - number: 2.3.1
    text: |-
      Het is een in Nederland gevestigde vervoerder verboden grensoverschrijdend beroepsvervoer te verrichten voor
      trajecten op het grondgebied van andere staten dan lidstaten, zonder te beschikken over:
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.3
  - number: 2.3.1.a
    text: een geldige CEMT-vergunning, of
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.3
  - number: 2.3.1.b
    text: |-
      één of meerdere daarvoor geldige ritmachtigingen op grond van een verdrag voor het grensoverschrijdend
      goederenvervoer met een andere staat.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.3
  - number: 2.3.2
    text: |-
      De NIWO verleent slechts een CEMT-vergunning dan wel een ritmachtiging voor het verrichten van grensoverschrijdend
      beroepsvervoer aan de in Nederland gevestigde vervoerders, die houder zijn van een communautaire vergunning.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.3
  - number: 2.3.3
    text: |-
      Het is een vervoerder die niet gevestigd is in een lidstaat verboden om naar of vanuit Nederland
      grensoverschrijdend beroepsvervoer te verrichten zonder te beschikken over:
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.3
  - number: 2.3.3.a
    text: een daarvoor geldige CEMT-vergunning, of
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.3
  - number: 2.3.3.b
    text: |-
      één of meer daarvoor geldende ritmachtigingen op grond van een verdrag voor het goederenvervoer tussen Nederland
      met de staat waarin de vervoerder is gevestigd.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.3
  - number: 2.3.4
    text: |-
      Bij regeling van Onze Minister worden regels gesteld ter uitvoering van het eerste en derde lid en van besluiten
      van de Conferentie van Europese Ministers van Transport. Daartoe behoren in elk geval regels over:
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.3
  - number: 2.3.4.a
    text: de aanvraag tot verlening van een CEMT-vergunning of een ritmachtiging;
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.3
  - number: 2.3.4.b
    text: de verlening, het gebruik en de intrekking van een CEMT-vergunning of een ritmachtiging;
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.3
  - number: 2.3.4.c
    text: de op de ritmachtiging te vermelden gegevens, en
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.3
  - number: 2.3.4.d
    text: de aan de CEMT-vergunning of de ritmachtiging te verbinden voorschriften.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.3
  - number: 2.3.5
    text: |-
      Het is een in Nederland gevestigde vervoerder verboden grensoverschrijdend eigen vervoer te verrichten voor
      trajecten op het grondgebied van andere staten dan lidstaten, zonder te beschikken over een daarvoor geldende door
      de NIWO verleende ritmachtiging, op grond van een verdrag voor het grensoverschrijdend goederenvervoer met een
      andere staat.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.3
  - number: 2.3.6
    text: |-
      Het is een vervoerder, die niet gevestigd is in een lidstaat verboden om in Nederland eigen vervoer te verrichten
      zonder te beschikken over één of meerdere daarvoor geldige ritmachtigingen op grond van een verdrag voor het
      goederenvervoer tussen Nederland met de staat waarin de vervoerder is gevestigd.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.3
  - number: 2.3.7
    text: |-
      Ter uitvoering van een besluit van de Conferentie van Europese Ministers van Transport, of van een verdrag met
      betrekking tot het grensoverschrijdend goederenvervoer, kan bij regeling van Onze Minister vrijstelling worden
      verleend van het verbod, bedoeld in het eerste, derde, vijfde of zesde lid.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.3
  - number: 2.4.1
    text: |-
      De andere staten dan lidstaten, die partij zijn bij de Overeenkomst betreffende de Europese Economische Ruimte,
      worden voor de toepassing van de marktverordening voor het wegvervoer en van deze wet gelijk gesteld met een
      lidstaat.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.4
  - number: 2.4.2
    text: |-
      Voor zover dit uit een verdrag van de Europese Unie met een staat voortvloeit, wordt die staat voor de toepassing
      van de marktverordening voor het wegvervoer en deze wet met een lidstaat gelijk gesteld.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.4
  - number: 2.4.3
    text: |-
      De door de staten, bedoeld in het eerste en tweede lid, verleende soortgelijke vervoervergunningen en attesten voor
      bestuurders worden voor de toepassing van de marktverordening voor het wegvervoer gelijkgesteld met communautaire
      vergunningen onderscheidenlijk met bestuurdersattesten.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.4
  - number: 2.4.4
    text: Onze Minister doet van de staten waarop het tweede lid van toepassing is mededeling in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.4
  - number: 2.5.1
    text: |-
      Het is een in Nederland of in een andere lidstaat gevestigde vervoerder verboden om beroepsvervoer te verrichten
      zonder geldige daartoe verleende communautaire vergunning.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.5
  - number: 2.5.2
    text: |-
      Het is een in Nederland of in een andere lidstaat gevestigde vervoerder verboden beroepsvervoer te verrichten
      zonder de aanwezigheid in de vrachtauto van een eensluidend gewaarmerkt afschrift van de communautaire vergunning,
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.5
  - number: 2.5.3
    text: |-
      Het is een in Nederland gevestigde vervoerder verboden om grensoverschrijdend beroepsvervoer of cabotagevervoer
      te verrichten in strijd met het bij of krachtens de marktverordening voor het wegvervoer bepaalde omtrent het
      bestuurdersattest.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.5
  - number: 2.5.4
    text: |-
      Het is een in een andere lidstaat gevestigde vervoerder verboden om naar of vanuit Nederland beroepsvervoer, dan
      wel binnen Nederland cabotagevervoer te verrichten in strijd met het bij of krachtens de marktverordening voor het
      wegvervoer bepaalde omtrent het bestuurdersattest.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.5
  - number: 2.6.1
    text: |-
      Het is verboden beroepsvervoer of eigen vervoer te verrichten met een vrachtauto ten aanzien waarvan in strijd
      wordt gehandeld met de bij regeling van Onze Minister aangewezen bepalingen die zijn vastgesteld bij of krachtens
      de [Wegenverkeerswet 1994][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0006622
  - number: 2.6.2
    text: Het eerste lid is van overeenkomstige toepassing op het doen verrichten van beroepsvervoer.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.6
  - number: 2.7.1
    text: |-
      Het is de houder van een communautaire vergunning of van een vergunning als bedoeld in
      [artikel 7.1, eerste lid][ref1], verboden om een gewaarmerkte kopie van die vergunning al dan niet tegen betaling
      ter beschikking te stellen aan een derde ten behoeve van het verrichten van beroepsvervoer.


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel7
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '7'
        hoofdstuk: '7'
  - number: 2.7.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing op degene aan wie door de houder van een vergunning een
      gewaarmerkte kopie van die vergunning ter beschikking is gesteld.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.7
  - number: 2.8.1
    text: |-
      De voorwaarden betreffende de betrouwbaarheidseis voor een vervoerder, bedoeld in de beroepsverordening voor het
      wegvervoer zijn:
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.8
  - number: 2.8.1.a
    text: |-
      de overlegging van een niet ouder dan twee maanden zijnde met het oog op de uitoefening
      van de functie van wegvervoerder verleende verklaring omtrent het gedrag als bedoeld in
      [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel28
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.8
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '28'
  - number: 2.8.1.b
    text: |-
      het ontbreken van een minder dan twee jaar oud zijnde onherroepelijke rechterlijke uitspraak waarbij is vastgesteld
      dat de vervoerder de geldende voorschriften inzake de financiële arbeidsvoorwaarden niet is nagekomen, en
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.8
  - number: 2.8.1.c
    text: |-
      het ontbreken van een minder dan twee jaar oud zijnde onherroepelijke veroordeling en onherroepelijke sanctie
      jegens de vervoerder, wegens zeer ernstige inbreuk op de communautaire wetgeving, die bij de beroepsverordening
      voor het wegvervoer als zodanig is aangewezen;
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.8
  - number: 2.8.1.d
    text: |-
      het aantal minder dan twee jaar oud zijnde onherroepelijke veroordelingen of onherroepelijke sancties jegens
      de vervoerder wegens de bij regeling van Onze Minister, met inachtneming van het daaromtrent krachtens de
      beroepsverordening voor het wegvervoer bepaalde, aangewezen ernstige inbreuken op de communautaire wetgeving,
      overschrijdt niet de daarvoor bij die regeling vastgestelde grenzen, en
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.8
  - number: 2.8.1.e
    text: |-
      de één of meer aangewezen vervoersmanagers zijn niet ingevolge de beroepsverordening voor het wegvervoer, door een
      bevoegde instantie voor die verordening, ongeschikt verklaard om de leiding te hebben over de vervoeractiviteiten
      van een vervoerder of zijn na een dergelijke ongeschiktverklaring gerehabiliteerd.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.8
  - number: 2.8.2
    text: |-
      De voorwaarden betreffende de betrouwbaarheidseis voor een vervoersmanager, bedoeld in artikel 6 van de
      beroepsverordening voor het wegvervoer zijn:
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.8
  - number: 2.8.2.a
    text: |-
      de overlegging van een niet ouder dan twee maanden zijnde met het oog op de uitoefening
      van de functie van vervoermanager verleende verklaring omtrent het gedrag als bedoeld in
      [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel28
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.8
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '28'
  - number: 2.8.2.b
    text: |-
      het ontbreken van een minder dan twee jaar oud zijnde onherroepelijke rechterlijke uitspraak als bedoeld in het
      eerste lid, onderdeel b, waarbij hij de leiding had over de vervoeractiviteiten van de betrokken vervoerder;
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.8
  - number: 2.8.2.c
    text: |-
      het ontbreken van een minder dan twee jaar oud zijnde onherroepelijke veroordeling of onherroepelijke sanctie
      jegens hem, wegens een bij de beroepsverordening voor het wegvervoer als zeer ernstig aangewezen inbreuk op
      communautaire wetgeving;
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.8
  - number: 2.8.2.d
    text: |-
      het aantal minder dan twee jaar oud zijnde onherroepelijke veroordelingen en onherroepelijke sancties wegens de
      bij regeling van Onze Minister, met inachtneming van het daaromtrent krachtens de beroepsverordening voor het
      wegvervoer bepaalde, aangewezen ernstige inbreuken op de communautaire wetgeving overschrijdt niet de daarvoor bij
      die regeling vastgestelde grenzen, en
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.8
  - number: 2.8.2.e
    text: |-
      het ontbreken van een veroordeling en van een sanctie als bedoeld in het eerste lid, onderdeel c, waarbij hij de
      leiding had over de vervoeractiviteiten van de betrokken vervoerder.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.8
  - number: 2.8.3
    text: |-
      Voor de toepassing van het eerste lid, onderdelen c en d en van het tweede lid, onderdelen c, d en e, worden
      veroordelingen en sancties, die vóór 4 december 2011 onherroepelijk zijn geworden, niet in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.8
  - number: 2.8.4
    text: |-
      Bij regeling van Onze Minister kunnen met inachtneming van de beroepsverordening voor het wegvervoer en
      de marktverordening voor het wegvervoer regels worden gesteld over de eisen van financiële draagkracht en
      vakbekwaamheid.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.8
  - number: 2.8a.1
    text: |-
      De NIWO verklaart in afwijking van [artikel 2.8, eerste lid][ref1], een vervoerder die niet voldoet aan onderdelen
      b of c van dat artikellid, als betrouwbaar, indien het verlies van de betrouwbaarheid een onevenredig strenge
      sanctie is.


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel2
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.8a
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.8a.2
    text: |-
      De NIWO verklaart in afwijking van [artikel 2.8, tweede lid][ref1], een vervoersmanager, die niet voldoet aan
      onderdelen b, c of e van dat artikellid, als betrouwbaar, indien het verlies van de betrouwbaarheid een onevenredig
      strenge sanctie is.


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel2
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.8a
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.8a.3
    text: |-
      De bekendmaking van een beschikking inhoudende het verlies van de betrouwbaarheid van een vervoerder geschiedt
      in één geschrift met de bekendmaking van het daarmee samenhangende besluit tot schorsing of intrekking van diens
      communautaire vergunning.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.8a
  - number: 2.8a.4
    text: |-
      De bekendmaking van een beschikking inhoudende het verlies van de betrouwbaarheid van de vervoersmanager geschiedt
      in één geschrift met de bekendmaking van het daarmee samenhangende besluit tot ongeschiktverklaring van de
      vervoersmanager.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.8a
  - number: 2.8a.5
    text: |-
      De toestemming van Onze Minister is vereist voor het nemen van een besluit van de NIWO als bedoeld in het eerste of
      tweede lid, behoudens voor zover bij algemene maatregel van bestuur anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.8a
  - number: 2.8a.6
    text: |-
      De toestemming kan slechts worden onthouden vanwege strijd met het recht of met het gelijkheidsbeginsel in het
      belang van een eerlijke mededinging op de markt voor het beroepsvervoer.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.8a
  - number: 2.8a.7
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de toepassing van het eerste, tweede
      en vijfde lid, en kunnen andere maatregelen voor rehabilitatie of maatregelen van gelijke werking en nadere regels
      voor de betrouwbaarheid worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.8a
  - number: 2.8a.8
    text: |-
      De voordracht voor een algemene maatregel van bestuur als bedoeld in het zevende lid wordt niet eerder gedaan dan
      vier weken nadat het ontwerp daarvoor aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.8a
  - number: 2.9.1
    text: |-
      De NIWO verstrekt aan Onze Minister onverwijld na ontvangst van een aanvraag tot verlening of verlenging van een
      communautaire vergunning een afschrift daarvan.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.9
  - number: 2.9.2
    text: |-
      De NIWO meldt aan Onze Minister na ontvangst van de daartoe strekkende melding van de vervoerder, welke één of meer
      natuurlijke personen de vervoerder als vervoersmanagers heeft aangewezen.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.9
  - number: 2.9.3
    text: |-
      De NIWO meldt aan Onze Minister de naam van een vervoersmanager die zij ingevolge de beroepsverordening voor het
      wegvervoer vanwege het niet voldoen aan de betrouwbaarheidseis, ongeschikt heeft verklaard om de leiding te hebben
      over de vervoeractiviteiten van een vervoerder.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.9
  - number: 2.9.4
    text: |-
      Onze Minister en de NIWO verwerken persoonsgegevens ten behoeve van uitvoering van de beroepsverordening en de
      marktverordening en het bij of krachtens deze wet gestelde, in het bijzonder in het belang van de handhaving van de
      vereisten voor de toegang tot het beroep van vervoerder en de betrouwbaarheid van de vervoersmanager.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.9
  - number: 2.9.5
    text: |-
      Onze Minister en de NIWO zijn verwerkingsverantwoordelijke, voor de in het vierde lid bedoelde door hen verwerkte
      gegevens.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.9
  - number: 2.9.6
    text: |-
      De griffier van een gerecht als bedoeld in [artikel 2 van de Wet op de rechterlijke organisatie][ref1] verstrekt
      aan Onze Minister van Veiligheid en Justitie een afschrift van een:


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel2
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '2'
  - number: 2.9.6.a
    text: |-
      uitspraak waarbij is vastgesteld dat de vervoerder de geldende voorschriften inzake de financiële
      arbeidsvoorwaarden niet is nagekomen, en
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.9
  - number: 2.9.6.b
    text: uitspraak waarbij een in onderdeel a bedoelde uitspraak is vernietigd.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.9
  - number: 2.9.7
    text: Bij regeling van Onze Minister kunnen regels worden gegeven voor de toepassing van het vierde lid.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.9
  - number: 2.10.1
    text: |-
      Onze Minister wijst een exameninstituut aan dat verantwoordelijk is voor de organisatie en de certificering van de
      examens, bedoeld in de beroepsverordening voor het wegvervoer.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.10
  - number: 2.10.2
    text: |-
      Onze Minister kan de aanwijzing, bedoeld in het eerste lid, intrekken indien het exameninstituut zijn taak ernstig
      verwaarloost of niet voldoet aan de beroepsverordening voor het wegvervoer.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.10
  - number: 2.11.1
    text: |-
      Het is een vervoerder verboden beroepsvervoer te verrichten met gebruikmaking van bestuurders van vrachtauto’s die
      niet bij hem in dienstbetrekking zijn.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.11
  - number: 2.11.2
    text: |-
      Ten blijke van de in het eerste lid bedoelde dienstbetrekking wordt door de vervoerder en de bestuurder van een
      vrachtauto gezamenlijk een verklaring opgesteld waarin in ieder geval wordt vermeldt dat:
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.11
  - number: 2.11.2.a
    text: het vervoer voor rekening en risico van de vervoerder wordt verricht; en
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.11
  - number: 2.11.2.b
    text: tussen de vervoerder en de bestuurder van een vrachtauto sprake is van een loons- en gezagsverhouding.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.11
  - number: 2.11.3
    text: Onze Minster stelt het model vast van de in het tweede lid bedoelde verklaring.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.11
  - number: 2.11.4
    text: |-
      Bij regeling van Onze Minister worden regels gegeven over de gevallen waarin Onze Minister ontheffing kan verlenen
      van het in het eerste lid vermelde verbod, alsmede over de in die gevallen benodigde documenten.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.11
  - number: 2.11.5
    text: Een ontheffing kan onder beperkingen worden verleend en aan een ontheffing kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.11
  - number: 2.12.1
    text: |-
      Het bestuurdersattest wordt verleend voor de periode dat de bestuurder ingevolge de
      [Wet arbeid vreemdelingen][ref1] gerechtigd is arbeid te verrichten doch ten hoogste voor een periode van vijf
      jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0007149
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0007149
  - number: 2.12.2
    text: |-
      De NIWO kan de geldigheid van het bestuurdersattest verlengen tot een periode van ten hoogste vijf jaar indien
      de periode waarin de bestuurder ingevolge de [Wet arbeid vreemdelingen][ref1] gerechtigd is arbeid te verrichten,
      is verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0007149
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0007149
  - number: 2.13.1
    text: 'Het is verboden om beroepsvervoer te verrichten of te doen verrichten indien:'
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.13
  - number: 2.13.1.a
    text: met betrekking tot dat vervoer geen vrachtbrief is opgemaakt; of
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.13
  - number: 2.13.1.b
    text: |-
      de volledig en juist ingevulde vrachtbrief niet getoond kan worden bij de eerste vordering door de op grond van
      [artikel 5.1, eerste lid][ref1], aangewezen personen.


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel5
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '5'
        hoofdstuk: '5'
  - number: 2.13.2
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld over de vrachtbrief. Deze regels kunnen onder meer
      betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.13
  - number: 2.13.2.a
    text: de inhoud van de vrachtbrief voor het binnenlands beroepsvervoer;
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.13
  - number: 2.13.2.b
    text: |-
      het aanwijzen van het binnenlands beroepsvervoer waarop het verbod, bedoeld in het eerste lid, niet van toepassing
      is;
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.13
  - number: 2.13.2.c
    text: het gebruik van de vrachtbrief voor het binnenlands en het grensoverschrijdend beroepsvervoer; en
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.13
  - number: 2.13.2.d
    text: de verantwoordelijkheidsverdeling tussen afzender en vervoerder aangaande het verbod, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel2.13
  - number: 3.1.1
    text: 'De NIWO beslist binnen acht weken na ontvangst daarvan op de aanvraag door een vervoerder:'
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel3.1
  - number: 3.1.1.a
    text: tot verlening of verlenging van een communautaire vergunning;
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel3.1
  - number: 3.1.1.b
    text: tot verlening of verlenging van een bestuurdersattest, of
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel3.1
  - number: 3.1.1.c
    text: tot verlening van een CEMT-vergunning of van een ritmachtiging.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel3.1
  - number: 3.1.2
    text: |-
      De NIWO neemt een aanvraag als bedoeld in het eerste lid niet eerder in behandeling dan nadat zij de daarvoor
      krachtens [artikel 4.6, eerste lid, onderdeel a][ref1], verschuldigde vergoeding heeft ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel4
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '4'
        hoofdstuk: '4'
  - number: 3.1.3
    text: Indien de NIWO niet tijdig heeft beslist, is de aanvraag toegewezen.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel3.1
  - number: 3.2.1
    text: |-
      De NIWO weigert de verlening of verlenging van een communautaire vergunning in het geval en onder de voorwaarden
      van [artikel 3 van de Wet bevordering integriteitsbeoordelingen][ref1] door het openbaar bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel3
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '3'
  - number: 3.2.2
    text: |-
      Voordat de NIWO toepassing geeft aan het eerste lid, kan zij het Bureau
      bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8, van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1], om een advies als
      bedoeld in [artikel 9 van die wet][ref2] vragen.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel9
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0013798
        artikel: '9'
  - number: 3.2.3
    text: |-
      De NIWO weigert de verlening of verlenging van de communautaire vergunning of de verlening of intrekking van een
      bestuurdersattest indien de vervoerder niet of niet meer voldoet aan de vereisten voor de uitoefening van het
      beroep van wegvervoerondernemer van de beroepsverordening voor het wegvervoer.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel3.2
  - number: 3.2.4
    text: |-
      De NIWO verklaart een vervoersmanager ongeschikt om leiding te hebben over de vervoeractiviteiten van een
      vervoerder indien hij niet langer voldoet aan de eis van betrouwbaarheid van de beroepsverordening voor het
      wegvervoer.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel3.2
  - number: 3.2.5
    text: |-
      De NIWO gaat over tot intrekking of schorsing van de communautaire vergunning of van een bestuurdersattest volgens
      de daarvoor geldende procedure van de beroepsverordening voor het wegvervoer indien de vervoerder niet meer voldoet
      aan de vereisten voor de uitoefening van het beroep van wegvervoerondernemer van die verordening.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel3.2
  - number: 3.2.6
    text: |-
      De NIWO vermeldt bij een besluit tot intrekking van een communautaire vergunning vanwege het niet meer voldoen aan
      de betrouwbaarheidseis, een termijn voor rehabilitatie vast.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel3.2
  - number: 3.2.7
    text: |-
      Een vervoerder waarvan de communautaire vergunning wegens het niet voldoen aan de betrouwbaarheidseis door de NIWO
      is geschorst, is na het verstrijken van de termijn van die schorsing, voor de toepassing van de beroepsverordening
      voor het wegvervoer, de marktverordening voor het wegvervoer en van deze wet gerehabiliteerd.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel3.2
  - number: 3.2.8
    text: |-
      Een vervoerder waarvan de NIWO de communautaire vergunning vanwege het niet voldoen aan de betrouwbaarheidseis
      heeft ingetrokken is na afloop van de termijn, bedoeld in het zesde lid, voor de toepassing van de
      beroepsverordening voor het wegvervoer, de marktverordening voor het wegvervoer en van deze wet gerehabiliteerd.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel3.2
  - number: 3.2.9
    text: |-
      Een vervoersmanager die vanwege het niet voldoen aan de betrouwbaarheidseis, door de NIWO ongeschikt is verklaard
      om zijn functie uit te oefenen, is na het verstrijken van de termijn voor de ongeschiktverklaring, voor de
      toepassing van de beroepsverordening voor het wegvervoer, de marktverordening voor het wegvervoer en van deze wet
      gerehabiliteerd.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel3.2
  - number: 3.3.1
    text: |-
      De NIWO kan de verlening van een CEMT-vergunning weigeren indien daarvan vermoedelijk geen, onvoldoende of slechts
      voor bilateraal vervoer gebruik zal worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel3.3
  - number: 3.3.2
    text: |-
      Bij regeling van Onze Minister kunnen nadere regels worden gesteld voor de verdeling van de voor de in Nederland
      gevestigde vervoerders in het kalenderjaar beschikbare CEMT-vergunningen en ritmachtigingen.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel3.3
  - number: 3.4.1
    text: |-
      De NIWO gaat over tot schorsing of intrekking van de communautaire vergunning, in het geval en onder de voorwaarden,
      bedoeld in [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel3
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '3'
  - number: 3.4.2
    text: |-
      Voordat de NIWO toepassing geeft aan het eerste lid, kan zij het Bureau
      bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8, van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1], om een advies als
      bedoeld in [artikel 9 van die wet][ref2] vragen.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel9
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0013798
        artikel: '9'
  - number: 3.5.1
    text: 'De NIWO trekt een aan een in Nederland gevestigde vervoerder verleende CEMT-vergunning of ritmachtiging in:'
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel3.5
  - number: 3.5.1.a
    text: op verzoek van de vervoerder;
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel3.5
  - number: 3.5.1.b
    text: indien de vervoerder niet meer beschikt over een geldige communautaire vergunning, of
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel3.5
  - number: 3.5.1.c
    text: |-
      de daartoe krachtens [artikel 2.3, vierde lid][ref1], vastgestelde gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel2
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '2'
        hoofdstuk: '2'
  - number: 3.5.2
    text: |-
      De NIWO kan een aan een in Nederland gevestigde vervoerder verleende CEMT-vergunning intrekken indien de vervoerder
      daarvan geen, onvoldoende of slechts voor bilateraal vervoer gebruik heeft gemaakt.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel3.5
  - number: 3.6.1
    text: |-
      De vervoerder levert een vervallen of ingetrokken communautaire vergunning, CEMT-vergunning, ritmachtiging,
      vergunning als bedoeld in [artikel 7.1, eerste lid][ref1], of een vervallen of ingetrokken bestuurdersattest bij
      de NIWO in binnen één week na de vervaldatum, onderscheidenlijk de datum van inwerkingtreding van de beschikking
      tot intrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel7
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '7'
        hoofdstuk: '7'
  - number: 3.6.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing op de verstrekte gewaarmerkte kopieën van de vervallen of
      ingetrokken communautaire vergunning of van het vervallen of ingetrokken bestuurdersattest.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel3.6
  - number: 4.1.1
    text: |-
      Er is een Nationale en Internationale Wegvervoer Organisatie, in het maatschappelijk verkeer aangeduid als NIWO. De
      organisatie bezit rechtspersoonlijkheid en is gevestigd te Rijswijk.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel4.1
  - number: 4.1.2
    text: 'De NIWO is belast met:'
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel4.1
  - number: 4.1.2.a
    text: |-
      de taken van de bevoegde instantie voor beroepsverordening voor het wegvervoer en van de bevoegde instantie voor de
      marktverordening voor het wegvervoer;
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel4.1
  - number: 4.1.2.b
    text: de verlening en intrekking van een CEMT-vergunning of een ritmachtiging;
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel4.1
  - number: 4.1.2.c
    text: |-
      het onderzoek, bedoeld in [artikel 7.1, derde en vierde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel7
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '7'
        hoofdstuk: '7'
  - number: 4.1.2.d
    text: |-
      de intrekking van een vergunning, bedoeld in [artikel 7.2, eerste en tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel7
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '7'
        hoofdstuk: '7'
  - number: 4.1.2.e
    text: de ondersteuning van onderhandelingen in het kader van verdragen over goederenvervoer;
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel4.1
  - number: 4.1.2.f
    text: |-
      het beheer van gegevensbestanden en de verstrekking van gegevens uit die bestanden, uit hoofde van haar publieke
      taken, en
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel4.1
  - number: 4.1.2.g
    text: het houden van een elektronisch register met de bij regeling van Onze Minister daarvoor bepaalde gegevens.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel4.1
  - number: 4.1.3
    text: Bij regeling van Onze Minister kan de NIWO belast worden met andere taken ten aanzien van het goederenvervoer.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel4.1
  - number: 4.1.4
    text: |-
      Op de NIWO is de [Kaderwet zelfstandige bestuursorganen][ref1] van toepassing, met uitzondering van
      [artikel 15 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020495
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel15
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0020495
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '15'
  - number: 4.2.1
    text: De NIWO stelt ten behoeve van haar werkwijze een reglement op, dat de goedkeuring van Onze Minister behoeft.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel4.2
  - number: 4.2.2
    text: 'Het reglement, bedoeld in het eerste lid, omvat in elk geval bepalingen omtrent:'
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel4.2
  - number: 4.2.2.a
    text: |-
      de wijze waarop invulling wordt gegeven aan [artikel 19 van de Kaderwet zelfstandige bestuursorganen][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel19
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '19'
  - number: 4.2.2.b
    text: werkwijze van directie en raad van advies.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel4.2
  - number: '4.3'
    text: De NIWO heeft een directie en een raad van advies.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel4.3
  - number: 4.3a.1
    text: 'De directie:'
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel4.3a
  - number: 4.3a.1.a
    text: is belast met de dagelijkse leiding van de NIWO;
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel4.3a
  - number: 4.3a.1.b
    text: bestaat uit maximaal twee leden;
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel4.3a
  - number: 4.3a.1.c
    text: vertegenwoordigt de NIWO in en buiten rechte;
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel4.3a
  - number: 4.3a.1.d
    text: |-
      verstrekt de raad van advies tijdig de voor de uitoefening van diens taak benodigde inlichtingen en andere
      gegevens, en
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel4.3a
  - number: 4.3a.1.e
    text: |-
      verstrekt aan Onze minister het advies van de Raad van advies inzake de in
      [artikel 4.3, tweede lid, onder b][ref1], bedoelde documenten.


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel4
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel4.3a
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.3a.2
    text: Het lidmaatschap van de directie is onverenigbaar met het lidmaatschap van de raad van advies.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel4.3a
  - number: 4.3a.3
    text: |-
      In geval van schorsing of ontstentenis van een lid van de directie voorziet Onze Minister in de waarneming van
      diens functie.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel4.3a
  - number: 4.3a.4
    text: |-
      De leden van de directie worden benoemd voor een tijdvak van maximaal vier jaar en zijn aansluitend éénmalig voor
      een tijdvak van maximaal vier jaar herbenoembaar. In het geval van bijzondere omstandigheden binnen de organisatie
      van de NIWO kan een lid van de directie bij afloop van de tweede benoemingstermijn terstond opnieuw worden benoemd
      voor een tijdvak van maximaal twee jaar.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel4.3a
  - number: 4.3a.5
    text: |-
      De directie kan onder haar verantwoordelijkheid de vertegenwoordiging, bedoeld in het derde lid, opdragen aan een
      of meer directieleden of andere personen. Zij kan bepalen dat deze vertegenwoordiging uitsluitend betrekking heeft
      op bepaalde onderdelen van de taak van de NIWO dan wel op bepaalde aangelegenheden.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel4.3a
  - number: 4.3b.1
    text: |-
      De raad van advies adviseert de directie gevraagd of ongevraagd over de uitvoering van de aan de directie
      opgedragen taken en belangrijke bestuursbesluiten van de directie.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel4.3b
  - number: 4.3b.2
    text: 'De raad van advies ziet toe op:'
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel4.3b
  - number: 4.3b.2.a
    text: de opzet en de werking van de interne risicobeheersings- en controlesystemen;
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel4.3b
  - number: 4.3b.2.b
    text: de financiële jaarverslaggeving en het opstellen van de begroting, en
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel4.3b
  - number: 4.3b.2.c
    text: de naleving van de toepasselijke wet- en regelgeving.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel4.3b
  - number: 4.3b.3
    text: De raad van advies bestaat uit drie leden, onder wie de voorzitter.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel4.3b
  - number: 4.3b.4
    text: Onze Minister benoemt, schorst en ontslaat de leden van de raad van advies.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel4.3b
  - number: 4.3b.5
    text: Bij de benoeming van de voorzitter hoort Onze Minister de raad van advies.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel4.3b
  - number: 4.3b.6
    text: |-
      De leden van de raad van advies hebben op persoonlijke titel zitting in de raad van advies en oefenen hun functie
      uit zonder last of ruggespraak.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel4.3b
  - number: 4.3b.7
    text: |-
      De voorzitter en de overige leden van de raad van advies worden benoemd voor een tijdvak van vier jaren en zijn
      aansluitend eenmalig voor een tijdvak van vier jaren herbenoembaar.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel4.3b
  - number: 4.3b.8
    text: |-
      Aan de leden van de raad van advies kan tussentijds op eigen verzoek, dan wel om zwaarwichtige reden ontslag worden
      verleend.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel4.3b
  - number: 4.3b.9
    text: |-
      Zolang in een vacature van de raad van advies niet is voorzien, vormen de overblijvende leden de raad van advies,
      met de bevoegdheid van de volledige raad van advies. Betreft het de vacature van de voorzitter, dan wijzen de
      overblijvende leden uit hun midden een lid aan dat tijdelijk als voorzitter fungeert.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel4.3b
  - number: 4.3b.10
    text: |-
      Indien een lid wordt benoemd ter vervanging van een tussentijds opengevallen plaats, bepaalt Onze Minister het
      tijdvak van benoeming.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel4.3b
  - number: 4.3c.1
    text: |-
      Onze Minister kan aan de leden van de raad van advies, ten laste van de NIWO, een vergoeding toekennen voor hun
      werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel4.3c
  - number: 4.3c.2
    text: |-
      De leden van de raad van advies hebben aanspraak op vergoeding van de door hen in de uitoefening van hun functie
      gemaakte reis- en verblijfkosten.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel4.3c
  - number: 4.3c.3
    text: De NIWO voorziet in het secretariaat van de raad van advies.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel4.3c
  - number: 4.4.1
    text: De NIWO maakt jaarlijks een begroting van baten en lasten op, die de instemming van Onze Minister behoeft.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel4.4
  - number: 4.4.2
    text: |-
      De [artikelen 10:28 tot en met 10:31 van de Algemene wet bestuursrecht][ref1] zijn van overeenkomstige toepassing
      op het eerste en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '10'
  - number: 4.4.3
    text: 'De NIWO vermeldt in het jaarverslag in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel4.4
  - number: 4.4.3.a
    text: |-
      het aantal houders van een communautaire vergunning, van een CEMT-vergunning of van een vergunning als bedoeld in
      [artikel 7.1, eerste lid][ref1] op de eerste dag van het kalenderjaar en op de laatste dag van het voorafgaande
      kalenderjaar;


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel7
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '7'
        hoofdstuk: '7'
  - number: 4.4.3.b
    text: |-
      het aantal gewaarmerkte kopieën van de vergunningen, bedoeld in onderdeel a op de eerste en op de laatste dag van
      het voorafgaande kalenderjaar;
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel4.4
  - number: 4.4.3.c
    text: |-
      het aantal communautaire vergunningen, bestuurdersattesten, CEMT-vergunningen en ritmachtigingen, dat in het
      voorafgaande kalenderjaar is verleend, verlengd of ingetrokken;
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel4.4
  - number: 4.4.3.d
    text: het aantal gewaarmerkte kopieën van de in het voorafgaande kalenderjaar verleende communautaire vergunningen;
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel4.4
  - number: 4.4.3.e
    text: |-
      het aantal vergunningen als bedoeld in [artikel 7.1, eerste lid][ref1], dat in het voorafgaande kalenderjaar is
      ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel7
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '7'
        hoofdstuk: '7'
  - number: 4.5.1
    text: |-
      Onze Minister kan aan de NIWO aanwijzingen van algemene aard geven met betrekking tot de uitvoering van de in
      [artikel 4.1][ref1], bedoelde taken.


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel4
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.5.2
    text: Bij regeling van Onze Minister kunnen nadere regels worden gesteld over de uitoefening van het toezicht op de NIWO.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel4.5
  - number: 4.6.1
    text: |-
      Ter dekking van de kosten van uitvoering van de bij of krachtens [artikel 4.1][ref1] aan de NIWO opgedragen
      werkzaamheden:


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel4
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.6.1.a
    text: |-
      is de aanvrager aan de NIWO een vergoeding verschuldigd voor het in behandeling nemen van een aanvraag tot
      verlening of verlenging van een communautaire vergunning, tot verlening of verlenging van een bestuurdersattest,
      tot verlening van een CEMT-vergunning of van een ritmachtiging;
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel4.6
  - number: 4.6.1.b
    text: is de houder van een communautaire vergunning jaarlijks een vergoeding aan de NIWO verschuldigd;
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel4.6
  - number: 4.6.1.c
    text: |-
      is de houder van een vergunning als bedoeld in [artikel 7.1, eerste lid][ref1], jaarlijks een vergoeding aan de
      NIWO verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel7
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '7'
        hoofdstuk: '7'
  - number: 4.6.2
    text: De NIWO stelt de tarieven van de vergoedingen, bedoeld in het eerste lid vast.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel4.6
  - number: 4.6.3
    text: |-
      De tarieven voor de vergoedingen, bedoeld in het eerste lid, onderdeel a, worden zodanig vastgesteld dat de begrote
      baten van die vergoedingen niet uitgaan boven de begrote kosten ter zake van de behandeling van de in het eerste
      lid bedoelde aanvragen.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel4.6
  - number: 4.6.4
    text: |-
      De tarieven voor de vergoedingen, bedoeld in het eerste lid, onderdelen b en c, worden zodanig vastgesteld
      dat de begrote baten van die vergoedingen niet uitgaan boven de begrote lasten van de taken, bedoeld in
      [artikel 4.1][ref1], anders dan de behandeling van aanvragen.


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel4
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.6.5
    text: Onder de in het vierde lid bedoelde lasten wordt mede verstaan de bijdragen aan reserves van de NIWO.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel4.6
  - number: 4.6.6
    text: |-
      De NIWO maakt de besluiten tot vaststelling van de tarieven van de vergoedingen, bedoeld in het
      eerste lid, bekend in de Staatscourant met vermelding van de dagtekening van het besluit van Onze
      Minister waarbij de goedkeuring is verleend of met vermelding van de omstandigheid dat ingevolge
      [artikel 10:31, vierde lid, van de Algemene wet bestuursrecht][ref1], een besluit tot goedkeuring wordt geacht te
      zijn genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '10'
  - number: 4.7.1
    text: |-
      Waar in deze wet dan wel de [Kaderwet zelfstandige bestuursorganen][ref1] de goedkeuring van Onze Minister is
      vereist, verleent dan wel onthoudt deze die goedkeuring binnen zes weken na de datum van ontvangst van de aan
      goedkeuring onderhevige stukken, met uitzondering van de in [artikel 2.8a, vijfde lid][ref2] vereiste toestemming.


      [ref1]: https://wetten.overheid.nl/BWBR0020495
      [ref2]: https://wetten.overheid.nl/BWBR0024800#Artikel2
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0020495
      - id: ref2
        bwb_id: BWBR0024800
        artikel: '2'
        hoofdstuk: '2'
  - number: 4.7.2
    text: |-
      Met goedkeuring dan wel instemming wordt gelijkgesteld het verstrijken van de in het eerste lid bedoelde termijn
      zonder dat de goedkeuring dan wel de instemming is verleend of onthouden.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel4.7
  - number: '4.8'
    text: |-
      Zolang de begroting niet is goedgekeurd, is de directie gerechtigd gedurende ten hoogste zes maanden van het nieuwe
      boekjaar voor iedere maand uitgaven te doen ter grootte van 115% van een twaalfde deel van de begroting van het
      voorafgaande boekjaar.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel4.8
  - number: 4.9.1
    text: |-
      Indien de NIWO een bij of krachtens een andere wet dan deze wet opgedragen taak naar het oordeel van Onze Minister
      niet langer naar behoren verricht, kan Onze Minister de nodige voorzieningen treffen na overleg met Onze Minister
      wie het aangaat.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel4.9
  - number: 4.9.2
    text: |-
      Beleidsregels omtrent de uitoefening van de bij of krachtens andere wetten dan deze wet aan de NIWO opgedragen
      taken worden door Onze Minister vastgesteld in overeenstemming met Onze Minister wie het aangaat.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel4.9
  - number: 5.1.1
    text: |-
      Met het toezicht op de naleving van de beroepsverordening voor het wegvervoer, de marktverordening voor het
      wegvervoer en van het bepaalde bij of krachtens deze wet zijn belast:
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel5.1
  - number: 5.1.1.a
    text: |-
      de bij of krachtens [artikel 141 van het Wetboek van Strafvordering][ref1] aangewezen ambtenaren;


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: 5.1.1.b
    text: de bij besluit van Onze Minister daartoe aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel5.1
  - number: 5.1.2
    text: |-
      Van een besluit als bedoeld in het eerste lid, onderdeel b wordt mededeling gedaan door plaatsing in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel5.1
  - number: 5.2.1
    text: |-
      Onze Minister is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van het bepaalde bij of
      krachtens de beroepsverordening voor het wegvervoer, van de marktverordening voor het wegvervoer of van de bij of
      krachtens deze wet gestelde verplichtingen.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel5.2
  - number: 5.2.2
    text: |-
      In afwijking van [artikel 5:24, derde lid, van de Algemene wet bestuursrecht][ref1], kan de beschikking tot
      toepassing van bestuursdwang bekend worden gemaakt aan de bestuurder van de vrachtauto ten aanzien waarvan
      bestuursdwang zal worden toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 5.2.3
    text: |-
      In geval van overtreding van [artikel 3.6][ref1] kan de NIWO de vervoerder een last onder dwangsom opleggen
      teneinde die overtreding ongedaan te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel3
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '3'
        hoofdstuk: '3'
  - number: '5.3'
    text: |-
      De Nederlandse strafwet is mede van toepassing op de in Nederland gevestigde vervoerder die zich buiten Nederland
      schuldig maakt aan een overtreding van het bepaalde bij of krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel5.3
  - number: 5.4.1
    text: |-
      De ambtenaren, die op basis van [artikel 17 van de Wet op de economische delicten][ref1] zijn belast met de
      opsporing van overtredingen van deze wet, zijn bevoegd het vervoer van goederen dat wordt verricht in strijd
      met de [artikelen 2.3, eerste en derde lid][ref2] en [2.5][ref3] te beletten en een mechanisch hulpmiddel aan te
      brengen of te doen aanbrengen op de vrachtauto waarmee de overtreding is gepleegd waardoor wordt verhinderd dat de
      vrachtauto wordt weggereden, teneinde de overtreding te doen ophouden.


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0024800#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0024800#Artikel2
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel5.4
    references:
      - id: ref1
        bwb_id: BWBR0002063
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0024800
        artikel: '2'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0024800
        artikel: '2'
        hoofdstuk: '2'
  - number: 5.4.2
    text: |-
      Het aangebrachte mechanisch hulpmiddel wordt verwijderd nadat de overtreding is opgehouden dan wel na het
      aanbrengen achtenveertig uren zijn verstreken en de kosten van het aanbrengen en het verwijderen ervan zijn
      voldaan.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel5.4
  - number: 5.4.3
    text: |-
      De betrokken ambtenaar maakt van het aanbrengen van het mechanisch hulpmiddel, bedoeld in het eerste lid,
      proces-verbaal op. Hij zendt dit proces-verbaal binnen vierentwintig uur aan de officier van justitie in het
      arrondissement waarin de rechtbank is gelegen waar het aanbrengen van het mechanisch hulpmiddel, bedoeld in het
      eerste lid, is geschied. Een afschrift van het proces-verbaal wordt gelijktijdig uitgereikt of toegezonden aan
      de bestuurder.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel5.4
  - number: 5.5.1
    text: |-
      Elke belanghebbende kan tegen het aanbrengen van het mechanisch hulpmiddel, bedoeld in
      [artikel 5.4, eerste lid][ref1], gedurende vier weken een beroepsschrift indienen bij de rechtbank, bedoeld in
      [artikel 5.4, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0024800#Artikel5
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel5.5
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '5'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0024800
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.5.2
    text: |-
      Indien de rechtbank het beroepschrift gegrond acht, kan zij bepalen dat ten laste van de Staat der Nederlanden een
      vergoeding wordt toegekend.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel5.5
  - number: 5.5.3
    text: |-
      Tegen de beschikking van de rechtbank staat het Openbaar Ministerie binnen twee weken en de belanghebbende binnen
      twee weken nadat zij hem betekend werd, hoger beroep open bij het gerechtshof.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel5.5
  - number: 5.5.4
    text: |-
      Tegen de beschikking van het gerechtshof staat het Openbaar Ministerie binnen twee weken en de belanghebbende
      binnen twee weken nadat zij hem betekend werd, beroep in cassatie open.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel5.5
  - number: 7.1.1
    text: |-
      De verboden, bedoeld in [artikel 2.5][ref1], gelden niet voor binnenlands beroepsvervoer
      door een vervoerder die beschikt over een geldige vergunning als bedoeld in
      [artikel 5, eerste lid, van de Wet goederenvervoer over de weg][ref2], die vóór de inwerkingtreding van deze wet
      is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005443#Artikel5
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0005443
        artikel: '5'
  - number: 7.1.2
    text: De vergunning, bedoeld in het eerste lid, blijft voor onbepaalde tijd geldig.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel7.1
  - number: 7.1.3
    text: 'De NIWO onderzoekt iedere vijf jaar indien de vervoerder een natuurlijk persoon is of :'
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel7.1
  - number: 7.1.3.a
    text: hij voldoet aan de eisen van betrouwbaarheid, financiële draagkracht en vakbekwaamheid, of
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel7.1
  - number: 7.1.3.b
    text: |-
      hij voldoet aan de eisen van betrouwbaarheid en financiële draagkracht en de natuurlijk persoon die de
      vervoeractiviteiten permanent en daadwerkelijk leidt, voldoet aan de eisen van betrouwbaarheid en vakbekwaamheid.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel7.1
  - number: 7.1.4
    text: 'De NIWO onderzoekt iedere vijf jaar indien de vervoerder een rechtspersoon is of:'
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel7.1
  - number: 7.1.4.a
    text: hij voldoet aan de eisen van betrouwbaarheid en financiële draagkracht;
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel7.1
  - number: 7.1.4.b
    text: |-
      de een of meer natuurlijke personen die de vervoeractiviteiten permanent en daadwerkelijk leiden, voldoen aan de
      eisen van betrouwbaarheid, en
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel7.1
  - number: 7.1.4.c
    text: ten minste een van de onder b bedoelde natuurlijke personen voldoet aan de eisen van vakbekwaamheid.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel7.1
  - number: 7.1.5
    text: |-
      De [artikelen 2.8][ref1] en [2.8a][ref2] en de artikel 7 van de beroepsverordening voor het wegvervoer zijn van
      overeenkomstige toepassing op de vergunning, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024800#Artikel2
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0024800
        artikel: '2'
        hoofdstuk: '2'
  - number: 7.1.6
    text: |-
      Het bij of krachtens [artikel 21, eerste, of tweede lid, van het Besluit goederenvervoer over de weg][ref1],
      bepaalde zoals dat luidde op de dag voor de inwerkingtreding van deze wet, is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005496#Artikel21
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0005496
        artikel: '21'
  - number: 7.2.1
    text: |-
      De NIWO trekt de vergunning, bedoeld in [artikel 7.1, eerste lid][ref1], in:


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel7
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.2.1.a
    text: |-
      indien niet meer wordt voldaan aan de eisen van betrouwbaarheid, financiële draagkracht en vakbekwaamheid, bedoeld
      in [artikel 7.1, derde, vijfde en zesde lid onderscheidenlijk vierde tot en met zesde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel7
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.2.1.b
    text: op verzoek van de vergunninghouder;
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel7.2
  - number: 7.2.1.c
    text: indien de vervoerder zijn vervoersactiviteiten heeft gestaakt, of
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel7.2
  - number: 7.2.1.d
    text: |-
      indien de een of meer natuurlijke personen die vóór de inwerkingtreding van deze wet de vervoeractiviteiten
      van de vervoerder permanent en daadwerkelijk leidden en voldeden aan de eis van vakbekwaamheid, bedoeld
      in [artikel 7.1, derde en zesde lid onderscheidenlijk vierde en zesde lid][ref1], niet langer permanent en
      daadwerkelijk leiding geven aan die vervoeractiviteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel7
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.2.2
    text: |-
      De NIWO kan de vergunning, bedoeld in [artikel 7.1, eerste lid][ref1], intrekken in het geval en onder de
      voorwaarden, bedoeld in [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel3
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '7'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0013798
        artikel: '3'
  - number: 7.2.3
    text: |-
      Voordat de NIWO toepassing geeft aan het tweede lid, kan zij het Bureau
      bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8, van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1], om een advies als
      bedoeld in [artikel 9 van die wet][ref2] vragen.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel9
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0013798
        artikel: '9'
  - number: 7.2.4
    text: |-
      De vergunning, bedoeld in [artikel 7.1, eerste lid][ref1], vervalt van rechtswege met ingang van het tijdstip van:


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel7
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.2.4.a
    text: |-
      overlijden dan wel intreden van wettelijke onbekwaamheid van de natuurlijke persoon waaraan de vergunning is
      verleend, of
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel7.2
  - number: 7.2.4.b
    text: ontbinding van de rechtspersoon waaraan de vergunning is verleend.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel7.2
  - number: 7.2.5
    text: |-
      Artikel 13 van de beroepsverordening voor het wegvervoer is van overeenkomstige toepassing
      indien als gevolg van overlijden of lichamelijk of wettelijke onbekwaamheid van een natuurlijk
      persoon niet meer wordt voldaan aan de eisen van betrouwbaarheid en vakbekwaamheid, bedoeld in
      [artikel 7.1, derde, vijfde en zesde lid onderscheidenlijk vierde tot en met zesde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel7
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '7'
        hoofdstuk: '7'
  - number: 8.1.1
    text: |-
      Tegen een op grond van de beroepsverordening voor het wegvervoer, van de marktverordening van het wegvervoer
      of van deze wet genomen besluit, kan een belanghebbende beroep instellen bij het College van Beroep voor het
      bedrijfsleven.
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel8.1
  - number: 8.1.2
    text: |-
      In afwijking van het eerste lid kan een belanghebbende indien de ingevolge [artikel 2.8a, vijfde lid][ref1]
      vereiste toestemming van Onze Minister ontbreekt, geen beroep instellen tegen een beschikking van de NIWO
      inhoudende het verlies van de betrouwbaarheid als bedoeld in artikel 2.8a, derde en vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel2
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '2'
        hoofdstuk: '2'
  - number: '8.6'
    text: |-
      De [Wet goederenvervoer over de weg][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0005443
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel8.6
    references:
      - id: ref1
        bwb_id: BWBR0005443
  - number: '8.8'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip. Bij koninklijk besluit kunnen andere
      tijdstippen worden vastgesteld waarop de onderdelen van [artikel 8.4][ref1] in werking treden.


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel8
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel8.8
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '8'
        hoofdstuk: '8'
  - number: '8.9'
    text: 'Deze wet wordt aangehaald als: Wet wegvervoer goederen.'
    url: https://wetten.overheid.nl/BWBR0024800/2021-06-30#Artikel8.9
