regulatory_layer: WET
publication_date: '2008-09-19'
valid_from: '2002-12-26'
bwb_id: BWBR0005255
url: https://wetten.overheid.nl/BWBR0005255/2002-12-26
preamble:
  text: |-
    Gelet op artikel 3, eerste en vierde lid, van de Wet op de uitoefening van de diergeneeskunde 1990 (Stb. 214);

    Besluit:
  url: https://wetten.overheid.nl/BWBR0005255/2002-12-26#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Deze regeling verstaat onder:


              *Wet:*


              [Wet op de uitoefening van de diergeneeskunde 1990][ref1] (Stb. 214);




              *richtlijn No. 78/1026/EEG:*


              Richtlijn van de Raad van 18 december 1978, No. 78/1026/EEG inzake de onderlinge erkenning van
      diploma's, certificaten en andere titels van dierenarts, tevens houdende maatregelen tot vergemakkelijking van de
      daadwerkelijke uitoefening van het recht van vestiging en het vrij verrichten van diensten (Pb EG L 362), zoals
      deze sindsdien is gewijzigd;




              *richtlijn No. 78/1027/EEG:*


              Richtlijn van de Raad van 18 december 1978, No. 78/1027/EEG, inzake de coördinatie van de wettelijke en
      bestuursrechtelijke bepalingen betreffende de werkzaamheden van dierenarts (Pb EG L 362), zoals deze sindsdien
      is gewijzigd.




              *lid-staat:*


              lid-staat van de Europese Gemeenschap.


      [ref1]: https://wetten.overheid.nl/BWBR0004730
    url: https://wetten.overheid.nl/BWBR0005255/2002-12-26#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004730
  - number: '2'
    text: |-
      Tot de uitoefening van de diergeneeskunde in haar volle omvang zijn, onverminderd het bepaalde in
      [artikelen 3][ref1] en [4][ref2], toegelaten de onderdanen van de lidstaten, aan wie een in de bijlage en artikel
      4 van richtlijn No. 78/1026/EEG bedoeld diploma of getuigschrift, is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0005255#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005255#Artikel4
    url: https://wetten.overheid.nl/BWBR0005255/2002-12-26#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005255
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005255
        artikel: '4'
  - number: '3'
    text: |-
      Indien een in de bijlage bij de richtlijn No. 78/1026/EEG genoemd diploma of getuigschrift in een lid-staat is
      verkregen ter afsluiting van een opleiding die is aangevangen vóór het tijdstip van de tenuitvoerlegging van die
      richtlijn of nà dat tijdstip maar dan wel ter afsluiting van een vóór die tenuitvoerlegging aangevangen opleiding
      dan wel indien de benaming van het diploma of getuigschrift niet overeenstemt met de in de voornoemde bijlage
      voor die lid-staat opgesomde benamingen van diploma's of getuigschriften, dient de betrokken onderdaan daarnaast
      te beschikken over een officieel gewaarmerkte verklaring, afgegeven door de bevoegde autoriteit van de lid-
      staat waar dat diploma of getuigschrift is afgegeven, waarin wordt verklaard dat het diploma van die onderdaan in
      overeenstemming is met artikel 1 van de richtlijn No. 78/1027/EEG welke verklaring in het geval van een afwijkende
      benaming tevens moet inhouden, dat ook de benaming is gelijkgesteld met die vermeld in de bijlage bij de richtlijn
      No. 78/1026/EEG, ten aanzien van die lid-staat.
    url: https://wetten.overheid.nl/BWBR0005255/2002-12-26#Artikel3
  - number: '4.1'
    text: |-
      Indien het diploma of getuigschrift van een onderdaan van een lid-staat met betrekking tot de uitoefening van
      de diergeneeskunde in haar volle omvang in de lid-staat is afgegeven vóór het tijdstip van tenuitvoerlegging
      van de richtlijn No. 78/1027/EEG in deze lid-staat ter afsluiting van een opleiding die niet beantwoordt aan
      de minimumeisen van die richtlijn, dan wel indien het diploma of getuigschrift betreft dat is afgegeven ná
      het tijdstip van de tenuitvoerlegging van die richtlijn doch ter afsluiting van een opleiding reeds daarvoor
      aangevangen, dient de betrokken onderdaan te beschikken over een officieel gewaarmerkte verklaring afgegeven door
      de bevoegde autoriteit van de onderhavige lid-staat; waarin wordt verklaard dat deze onderdaan de diergeneeskunde
      in haar volle omvang gedurende drie opeenvolgende jaren daadwerkelijk heeft uitgeoefend alsmede daartoe bevoegd was
      in het tijdstip van vijf jaren dat aan de afgifte van de verklaring voorafging.
    url: https://wetten.overheid.nl/BWBR0005255/2002-12-26#Artikel4
  - number: '4.2'
    text: 'De verklaring bedoeld in het eerste lid is eveneens vereist in het geval dat:'
    url: https://wetten.overheid.nl/BWBR0005255/2002-12-26#Artikel4
  - number: 4.2.a
    text: |-
      het diploma of getuigschrift is afgegeven aan een onderdaan van de Bondsrepubliek Duitsland doch dit diploma
      of getuigschrift werd verkregen in de voormalige Duitse Democratische Republiek en het vorenbedoelde diploma of
      getuigschrift de bevoegdheid geeft tot de uitoefening van de diergeneeskunde op het gehele grondgebied van de
      Bondsrepubliek Duitsland;
    url: https://wetten.overheid.nl/BWBR0005255/2002-12-26#Artikel4
  - number: 4.2.b
    text: |-
      het diploma of getuigschrift is afgegeven aan een onderdaan van de Italiaanse Republiek welke onderdaan dit
      diploma of getuigschrift heeft verkregen ter afsluiting van een opleiding waarmee vóór 1 januari 1985 een aanvang
      is gemaakt, tenzij het vorenbedoelde diploma of getuigschrift vergezeld gaat van een verklaring van een in Italië
      ter zake bevoegde aurotiteit, inhoudende dat het diploma of getuigschrift strekt ter afsluiting van een opleiding
      die volledig in overeenstemming is met de richtlijn No. 78/1027/EEG en in het bijzonder met de daarbij behorende
      bijlage.
    url: https://wetten.overheid.nl/BWBR0005255/2002-12-26#Artikel4
  - number: '5'
    text: |-
      Deze regeling treedt in werking met ingang van hetzelfde tijdstip als waarop [artikel 3 van de wet][ref1] in
      werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0004730#Artikel3
    url: https://wetten.overheid.nl/BWBR0005255/2002-12-26#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004730
        artikel: '3'
  - number: '6'
    text: |-
      Deze regeling kan worden aangehaald als: Regeling toelating onderdanen EEG lid-staten tot de uitoefening van de
      diergeneeskunde.
    url: https://wetten.overheid.nl/BWBR0005255/2002-12-26#Artikel6
