---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_instelling_kustwacht
regulatory_layer: WET
publication_date: '2019-05-28'
valid_from: '2007-01-01'
bwb_id: BWBR0020546
url: https://wetten.overheid.nl/BWBR0020546/2007-01-01
preamble:
  text: |-
    Handelende in overeenstemming met de Ministers van Binnenlandse Zaken en Koninkrijksrelaties, voor
    Vreemdelingenzaken en Integratie, van Financiën, van Justitie, van Landbouw, Natuur en Voedselkwaliteit en van
    Economische Zaken;

    In overeenstemming met het Kabinetsbesluit van 10 maart 2006 betreffende de Kustwacht in Nederland (Kamerstukken
    II, 2005/06, 30490 nr. 1, van 13 maart 2006);

    Besluiten:
  url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel1
  - number: 1.a
    text: 'de Ministers: de Minister van Verkeer en Waterstaat en de Minister van Defensie;'
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel1
  - number: 1.b
    text: |-
      de Ministers wie het mede aangaat: de Ministers van Binnenlandse Zaken en Koninkrijksrelaties, voor
      Vreemdelingenzaken en Integratie, van Financiën, van Justitie, van Landbouw, Natuur en Voedselkwaliteit en van
      Economische Zaken;
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel1
  - number: 1.c
    text: 'Betrokken diensten: organisaties van de Ministers en van de Ministers wie het mede aangaat;'
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel1
  - number: 1.d
    text: |-
      Kustwachtcentrum: het Kustwachtcentrum te Den Helder van het Ministerie van Defensie dat dient als
      informatiecentrum voor de uitvoering van kustwachttaken en fungeert als operationeel commandocentrum, nationaal
      maritiem en aëronautisch reddingscoördinatiecentrum, centrale meldkamer en maritieme assistentiedienst;
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel1
  - number: 1.e
    text: |-
      Handhavingsplan: plan waarin de gewenste output van de Kustwacht op het gebied van handhaving is geformuleerd voor
      het komende jaar met een doorkijk naar de vier jaren daarna, op basis van de beleidsdoelen en beleidsprioriteiten,
      opgesteld door de Permanente Kontaktgroep Handhaving Noordzee onder de verantwoordelijkheid van de Minister van
      Justitie, en vastgesteld door de Ministerraad;
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel1
  - number: 1.f
    text: |-
      Dienstverleningsplan: plan waarin de gewenste output van de Kustwacht op het gebied van dienstverlening is
      geformuleerd voor het komende jaar met een doorkijk naar de vier jaren daarna, op basis van de beleidsdoelen en
      beleidsprioriteiten, opgesteld door de Directeur-generaal Rijkswaterstaat, onder de verantwoordelijkheid van de
      Minister van Verkeer en Waterstaat en vastgesteld in de Ministerraad;
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel1
  - number: 1.g
    text: |-
      Activiteitenplan en Begroting: het door de Directeur Kustwacht opgestelde en door de Ministerraad vastgestelde
      plan waarin is vastgelegd welke producten in het kader van de kustwachttaken in het komende jaar worden geleverd
      met een doorkijk naar de vier jaren daarna, welke middelen daarmee zijn gemoeid en welke prioriteitsvolgorde
      bij de uitvoering wordt gehanteerd, waarvan een overzichtsbegroting deel uitmaakt en dat is gebaseerd op het
      Handhavingsplan, het Dienstverleningsplan, en een maatschappelijke belangenafweging ten aanzien van de uit te
      voeren kustwachttaken gegeven de daarvoor beschikbare middelen;
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel1
  - number: 1.h
    text: |-
      Informatieplan Kustwacht: het door de Directeur Kustwacht opgestelde en door de Raad voor de Kustwacht vastgestelde
      plan waarin op basis van de kustwachttaken de informatieproducten en werkwijze van het informatiecentrum
      van de Kustwacht worden omschreven inclusief de daarvoor benodigde middelen en relaties op het gebied van
      gegevensuitwisseling met de betrokken diensten;
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel1
  - number: 1.i
    text: |-
      Sturingsmodel Kustwacht: document dat door de Raad voor de Kustwacht wordt vastgesteld en waarin nader wordt
      omschreven op welke wijze de in dit besluit omschreven aansturing van de Kustwacht plaatsvindt en waarin het
      financieel spelregelkader voor de kosten van de Kustwacht is opgenomen.
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel1
  - number: '2.1'
    text: |-
      Er is een Kustwacht Nederland (hierna de Kustwacht), in internationaal verband aangeduid als Netherlands
      Coastguard.
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel2
  - number: '2.2'
    text: |-
      De Kustwacht is beheersmatig ondergebracht te Den Helder bij het Commando Zeestrijdkrachten van het Ministerie
      van Defensie.
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel2
  - number: '2.3'
    text: De Kustwacht beschikt over een Kustwachtcentrum.
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel2
  - number: '2.4'
    text: |-
      De Kustwacht beschikt over personeel, vaartuigen en vliegtuigen van diensten van de Ministers en de Ministers wie
      het mede aangaat.
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel2
  - number: '3.1'
    text: Er is een directeur Kustwacht.
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel3
  - number: '3.2'
    text: 'De directeur Kustwacht:'
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel3
  - number: 3.2.a
    text: wordt benoemd door de Minister van Defensie, gehoord de Raad voor de Kustwacht;
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel3
  - number: 3.2.b
    text: heeft de dagelijkse leiding over de Kustwacht;
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel3
  - number: 3.2.c
    text: |-
      stelt op basis van het Handhavingsplan en het Dienstverleningsplan het Activiteitenplan en Begroting en het
      Informatieplan Kustwacht op;
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel3
  - number: 3.2.d
    text: |-
      draagt zorg voor een doelmatige en doeltreffende uitvoering van de door de Ministerraad opgedragen taken, zoals
      vastgesteld in het Activiteitenplan en Begroting en binnen de financiële randvoorwaarden daarvan;
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel3
  - number: 3.2.e
    text: |-
      legt aan de Raad voor de Kustwacht verantwoording af over de realisatie van het Activiteitenplan en Begroting en
      stelt hiertoe viermaandelijks een voortgangsrapportage en een jaarverslag op;
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel3
  - number: 3.2.f
    text: |-
      geeft gevraagd en ongevraagd advies aan de Raad voor de Kustwacht ten aanzien van zaken die voor de uitvoering van
      de taken van de Kustwacht van belang zijn;
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel3
  - number: 3.2.g
    text: adviseert de Permanente Kontaktgroep Handhaving Noordzee en de Directeur-generaal Rijkswaterstaat;
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel3
  - number: 3.2.h
    text: volgt met betrekking tot de hem opgedragen taken de aanwijzingen op van de Raad voor de Kustwacht.
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel3
  - number: '4'
    text: 'De kustwachttaken omvatten:'
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel4
  - number: '4.1'
    text: 'Dienstverlening:'
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel4
  - number: 4.1.a
    text: nood-, spoed- en veiligheidsverkeer;
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel4
  - number: 4.1.b
    text: opsporing en redding;
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel4
  - number: 4.1.c
    text: rampen- en incidentenbestrijding;
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel4
  - number: 4.1.d
    text: maritieme hulpverlening;
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel4
  - number: 4.1.e
    text: verkeersdiensttaken;
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel4
  - number: 4.1.f
    text: vaarwegmarkering;
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel4
  - number: 4.1.g
    text: zeeverkeersonderzoek.
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel4
  - number: '4.2'
    text: 'Handhaving in het kader van:'
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel4
  - number: 4.2.a
    text: de algemene politietaak;
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel4
  - number: 4.2.b
    text: het douanetoezicht;
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel4
  - number: 4.2.c
    text: de grensbewaking;
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel4
  - number: 4.2.d
    text: de wetgeving met betrekking tot milieu, visserij, mijnbouw, en scheepvaart.
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel4
  - number: '5'
    text: |-
      De prioritering van de in [artikel 4][ref1] genoemde taken wordt vastgesteld in het Activiteitenplan en Begroting.


      [ref1]: https://wetten.overheid.nl/BWBR0020546#Artikel4
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020546
        artikel: '4'
        paragraaf: '2'
  - number: '6.1'
    text: 'Het werkgebied van de Kustwacht omvat:'
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel6
  - number: 6.1.a
    text: de territoriale zee en de Exclusieve Economische Zone;
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel6
  - number: 6.1.b
    text: |-
      de Waddenzee, het IJsselmeer inclusief de randmeren, en de Zuid-Hollandse en Zeeuwse stromen, voor wat betreft
      opsporing en redding;
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel6
  - number: 6.1.c
    text: |-
      het vluchtinlichtingengebied (Flight Information Region/FIR) Amsterdam, voor wat betreft de aëronautische opsporing
      en redding.
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel6
  - number: '6.2'
    text: |-
      Indien nodig voor de nakoming van (inter)nationale afspraken, verdragen of Europese regelgeving, wordt het
      werkgebied van de Kustwacht dienovereenkomstig uitgebreid.
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel6
  - number: '7'
    text: |-
      Het Kustwachtcentrum dient als informatiecentrum ten behoeve van de effectieve en efficiënte uitvoering van
      kustwachttaken, conform het Informatieplan Kustwacht.
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel7
  - number: '8.1'
    text: |-
      De Ministerraad stelt het Handhavingsplan, het Dienstverleningsplan, het Activiteitenplan en Begroting, en het
      jaarverslag van de Kustwacht vast.
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel8
  - number: '8.2'
    text: |-
      De Minister van Verkeer en Waterstaat coördineert, in overeenstemming met de Minister van Defensie en de Ministers
      wie het mede aangaat, de voorbereiding van de in het eerste lid genoemde besluitvorming in de Ministerraad.
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel8
  - number: '8.3'
    text: |-
      De in het tweede lid genoemde Ministers dragen ieder afzonderlijk ministeriële verantwoordelijkheid voor de
      werkzaamheden die door de Kustwacht voor hen worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel8
  - number: '8.4'
    text: |-
      De Minister van Defensie is verantwoordelijk voor de organisatie en het beheer van de Kustwacht en de uitvoering
      van kustwachttaken als omschreven in het Activiteitenplan en Begroting.
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel8
  - number: '9.1'
    text: Er is een Raad voor de Kustwacht.
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel9
  - number: '9.2'
    text: 'De Raad voor de Kustwacht heeft tot taak:'
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel9
  - number: 9.2.a
    text: |-
      het bijstaan van de Minister van Verkeer en Waterstaat bij diens activiteiten genoemd in [artikel 8][ref1], waarbij
      de Raad ondermeer adviseert ten aanzien van de integrale afweging van de maatschappelijke belangen ten aanzien van
      de kustwachttaken;


      [ref1]: https://wetten.overheid.nl/BWBR0020546#Artikel8
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0020546
        artikel: '8'
        paragraaf: '3'
  - number: 9.2.b
    text: |-
      het benoemen van beleidsprioriteiten voor het Handhavingsplan dat in opdracht van de Raad voor de Kustwacht door de
      Permanente Kontaktgroep Handhaving Noordzee wordt opgesteld;
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel9
  - number: 9.2.c
    text: |-
      het benoemen van beleidsprioriteiten voor het Dienstverleningsplan dat in opdracht van de Raad voor de Kustwacht
      door de Hoofdingenieur-Directeur van de Dienst Noordzee van Rijkswaterstaat namens de Directeur-Generaal van
      Rijkswaterstaat wordt opgesteld;
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel9
  - number: 9.2.d
    text: het vaststellen en onderhouden van het Sturingsmodel Kustwacht en van het Informatieplan Kustwacht;
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel9
  - number: 9.2.e
    text: |-
      indien nodig als besluitvormend orgaan op te treden ten aanzien van knelpunten die bij de uitvoering van de
      kustwachttaken ontstaan;
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel9
  - number: 9.2.f
    text: het voorbereiden van besluitvorming over de financiering van de Kustwacht.
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel9
  - number: '9.3'
    text: 'In de Raad voor de Kustwacht hebben zitting:'
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel9
  - number: 9.3.a
    text: de Directeur-Generaal Rijkswaterstaat van het Ministerie van Verkeer en Waterstaat (voorzitter);
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel9
  - number: 9.3.b
    text: de Directeur-Generaal Transport en Luchtvaart van het Ministerie van Verkeer en Waterstaat;
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel9
  - number: 9.3.c
    text: de Commandant Zeestrijdkrachten van het Ministerie van Defensie;
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel9
  - number: 9.3.d
    text: de Directeur Operationeel Beleid, Behoeftestellingen en Plannen van het Ministerie van Defensie;
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel9
  - number: 9.3.e
    text: de Directeur-Generaal Belastingdienst van het Ministerie van Financiën;
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel9
  - number: 9.3.f
    text: de Directeur-Generaal van het Ministerie van Landbouw, Natuur en Voedselkwaliteit, belast met visserijzaken;
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel9
  - number: 9.3.g
    text: de Directeur-Generaal Veiligheid van het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties; en
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel9
  - number: 9.3.h
    text: |-
      de Directeur-Generaal Wetgeving, Internationale Aangelegenheden, Integratie en Vreemdelingenzaken van het
      Ministerie van Justitie.
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel9
  - number: '9.4'
    text: Het secretariaat wordt gevoerd door Rijkswaterstaat.
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel9
  - number: '9.5'
    text: De Raad voor de Kustwacht stelt een huishoudelijk reglement vast.
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel9
  - number: '10'
    text: |-
      De Minister van Justitie coördineert de voorbereiding van het Handhavingsplan en de aansturing van de uitvoering
      daarvan door de Kustwacht. Hij draagt zorg voor afstemming van de handhavingsaanpak met de Minister van Verkeer en
      Waterstaat en de Ministers wie het mede aangaat.
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel10
  - number: '11.1'
    text: Er is een Permanente Kontaktgroep Handhaving Noordzee (hierna PKHN).
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel11
  - number: '11.2'
    text: |-
      De PKHN heeft tot taak de Minister van Justitie bij te staan bij diens werkzaamheden genoemd in [artikel 10][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020546#Artikel10
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0020546
        artikel: '10'
        paragraaf: '3'
  - number: '11.3'
    text: |-
      De PKHN stelt in opdracht van de Raad voor de Kustwacht een Handhavingsplan op, rekening houdend met de door de
      Raad voor de Kustwacht aangegeven beleidsprioriteiten.
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel11
  - number: '11.4'
    text: 'In de PKHN hebben zitting:'
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel11
  - number: 11.4.a
    text: de Officier van Justitie Noordzeezaken van het Openbaar Ministerie (voorzitter);
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel11
  - number: 11.4.b
    text: de Voorzitter van het Managementteam Belastingdienst/Douane West van het Ministerie van Financiën;
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel11
  - number: 11.4.c
    text: de Hoofdinspecteur Algemene Inspectiedienst van het Ministerie van Landbouw, Natuur en Voedselkwaliteit;
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel11
  - number: 11.4.d
    text: de Directeur Operaties Koninklijke Marechaussee van het Ministerie van Defensie;
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel11
  - number: 11.4.e
    text: |-
      het Hoofd Dienst Waterpolitie van het Korps Landelijke Politiediensten van het Ministerie van Binnenlandse Zaken
      en Koninkrijksrelaties;
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel11
  - number: 11.4.f
    text: |-
      het Hoofd Handhaving en Incidentenaanpak van de Dienst Noordzee Rijkswaterstaat van het Ministerie van Verkeer
      en Waterstaat;
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel11
  - number: 11.4.g
    text: de Hoofdinspecteur Zeevaart van de Inspectie Verkeer en Waterstaat van het Ministerie van Verkeer en Waterstaat; en
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel11
  - number: 11.4.h
    text: de plaatsvervangend inspecteur-generaal der Mijnen van het Ministerie van Economische Zaken.
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel11
  - number: '11.5'
    text: |-
      De Minister van Verkeer en Waterstaat benoemt in overeenstemming met de Ministers wie het mede aangaat de
      voorzitter van de PKHN.
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel11
  - number: '11.6'
    text: De voorzitter vertegenwoordigt de PKHN in de Raad voor de Kustwacht.
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel11
  - number: '11.7'
    text: |-
      De voorzitter heeft zitting in het Kustwachtdriemanschap en is in opdracht van de Raad voor de Kustwacht
      gedelegeerd opdrachtgever op het gebied van handhaving.
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel11
  - number: '11.8'
    text: De Directeur Kustwacht neemt zitting in de PKHN als adviseur.
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel11
  - number: '11.9'
    text: Het secretariaat van de PKHN wordt gevoerd door het Openbaar Ministerie.
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel11
  - number: '11.10'
    text: De PKHN stelt een huishoudelijk reglement vast.
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel11
  - number: '12.1'
    text: De Minister van Verkeer en Waterstaat is verantwoordelijk voor het opstellen van het Dienstverleningsplan.
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel12
  - number: '12.2'
    text: |-
      De Hoofdingenieur-Directeur van de Dienst Noordzee van Rijkswaterstaat stelt, namens de Directeur-Generaal
      Rijkswaterstaat, in opdracht van de Raad voor de Kustwacht een dienstverleningsplan op, rekening houdend met de
      door de Raad voor de Kustwacht aangegeven beleidsprioriteiten.
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel12
  - number: '12.3'
    text: |-
      De Hoofdingenieur-Directeur van de Dienst Noordzee van Rijkswaterstaat is in opdracht van de Raad voor de Kustwacht
      en namens de Directeur-Generaal Rijkswaterstaat gedelegeerd opdrachtgever voor de dienstverleningstaken in het
      Kustwachtdriemanschap.
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel12
  - number: '13.1'
    text: Er is een Kustwachtdriemanschap.
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel13
  - number: '13.2'
    text: 'Het Kustwachtdriemanschap bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel13
  - number: 13.2.a
    text: de Hoofdingenieur-Directeur van de Dienst Noordzee van Rijkswaterstaat;
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel13
  - number: 13.2.b
    text: de voorzitter van de PKHN;
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel13
  - number: 13.2.c
    text: de Directeur Kustwacht.
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel13
  - number: '13.3'
    text: |-
      Onverlet de verantwoordelijkheid van de Directeur Kustwacht voor de uitvoering van het Activiteitenplan en
      Begroting, bewaakt het Kustwachtdriemanschap in opdracht van de Raad voor de Kustwacht, aan de hand van het
      Handhavingsplan, het Dienstverleningsplan en de voortgangsrapportages van de Directeur Kustwacht, de voorbereiding,
      uitvoering en verantwoording van het Activiteitenplan en Begroting en lost daarin zonodig knelpunten op, of legt
      besluiten daartoe voor aan de Raad voor de Kustwacht.
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel13
  - number: '13.4'
    text: |-
      De voorzitter van de PKHN en de Hoofdingenieur-Directeur informeren de diensten van de betrokken departementen over
      knelpunten in de uitvoering van het Activiteitenplan en Begroting en de besluitvorming daarover.
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel13
  - number: '13.5'
    text: |-
      Besluiten binnen het Kustwachtdriemanschap worden, gehoord het advies van de Directeur Kustwacht, door de
      voorzitter PKHN en de Hoofdingenieur-Directeur van de Dienst Noordzee van Rijkswaterstaat gezamenlijk genomen, en
      zij leggen daarover verantwoording af aan de Raad voor de Kustwacht.
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel13
  - number: '13.6'
    text: De Directeur Kustwacht voert in het vijfde lid bedoelde besluiten uit voor zover deze kustwachttaken betreffen.
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel13
  - number: '13.7'
    text: Het secretariaat wordt gevoerd door Rijkswaterstaat.
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel13
  - number: '13.8'
    text: Het Kustwachtdriemanschap stelt een huishoudelijk reglement vast.
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel13
  - number: '14'
    text: |-
      Bij optreden op het gebied van opsporing en redding binnen gebieden die gemeentelijk zijn ingedeeld, functioneert
      de Directeur Kustwacht, met inachtneming van zijn verantwoordelijkheid voor de operationele coördinatie op zee,
      onder de bestuurlijke verantwoordelijkheid van het betreffende bevoegde gezag.
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel14
  - number: '15.1'
    text: De Kustwacht hanteert een kas/verplichtingenstelsel.
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel15
  - number: '15.2'
    text: |-
      De uitgaven van de Kustwacht drukken op de begroting van het Ministerie van Defensie, met uitzondering van de
      kosten van materieel en personeel dat tijdelijk of structureel ter beschikking wordt gesteld aan de Kustwacht door
      de betrokken diensten.
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel15
  - number: '15.3'
    text: Een financieel spelregelkader wordt nader uitgewerkt in het Sturingsmodel Kustwacht.
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel15
  - number: '16.1'
    text: |-
      Voor de uitvoering van de Kustwachttaken heeft de Directeur Kustwacht de beschikking over personeel van het
      Ministerie van Defensie en op tijdelijke basis over personeel van de betrokken diensten.
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel16
  - number: '16.2'
    text: |-
      Bij het Kustwachtcentrum zijn liaisons werkzaam afkomstig van de Algemene Inspectie Dienst, Rijkswaterstaat, de
      Douane, de Koninklijke Marechaussee, het Korps Landelijke Politiediensten en het Openbaar Ministerie.
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel16
  - number: '16.3'
    text: |-
      De liasons nemen namens hun organisaties deel aan de voorbereiding en de – door de Directeur Kustwacht
      gecoördineerde – uitvoering van het Activiteitenplan en Begroting.
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel16
  - number: '16.4'
    text: |-
      De betrokken diensten zijn verantwoordelijk voor de bekwaamheid van het personeel dat zij aan de Directeur
      Kustwacht ter beschikking stellen.
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel16
  - number: '17.1'
    text: |-
      De Directeur Kustwacht heeft, overeenkomstig het Activiteitenplan en Begroting, de beschikking over schepen en
      vliegtuigen met hun bemanningen afkomstig van de betrokken diensten.
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel17
  - number: '17.2'
    text: |-
      De in het eerste lid bedoelde capaciteit aan schepen en vliegtuigen kan alleen dan voor niet-Kustwachttaken ingezet
      worden wanneer de Directeur Kustwacht heeft aangegeven dat de uitvoering van het Activiteitenplan en Begroting
      zulks toelaat.
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel17
  - number: '17.3'
    text: |-
      De Directeur Kustwacht kan, ingeval van opsporing en redding, rampenbestrijding, dringend noodzakelijke opsporing
      van strafbare feiten en incidenten, op eerste aanzegging onmiddellijk de beschikking krijgen over één of meer van
      de in het eerste lid bedoelde schepen of vliegtuigen. De Directeur Kustwacht legt hierover achteraf verantwoording
      af aan het Kustwachtdriemanschap.
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel17
  - number: '17.4'
    text: |-
      De Directeur Kustwacht kan met derden (niet zijnde de betrokken diensten) bindende afspraken maken over het aan hem
      ter beschikking stellen van schepen en vliegtuigen met hun bemanning.
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel17
  - number: '17.5'
    text: |-
      De Directeur Kustwacht bepaalt de wijze waarop de hem ter beschikking staande schepen en vliegtuigen worden
      ingezet, onverlet de verantwoordelijkheid van de gezagvoerders voor de veiligheid van hun schip dan wel vliegtuig
      en hun bemanning.
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel17
  - number: '17.6'
    text: |-
      De schepen en vliegtuigen bedoeld in het eerste lid zijn in Kustwachtkleuren geschilderd, respectievelijk zijn
      voorzien van het Kustwachtlogo. De schepen en vliegtuigen bedoeld in het vierde lid voeren de Kustwachtvlag,
      onderscheidenlijk zijn van het Kustwachtlogo voorzien.
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel17
  - number: '18.1'
    text: |-
      Tussen de Directeur Kustwacht en de hoofden van de betreffende diensten worden operationele overeenkomsten
      gesloten ter uitwerking van [artikel 16][ref1] en [artikel 17, eerste, tweede, derde en vijfde lid][ref2] en waarin
      tenminste uitgangspunten, randvoorwaarden, procedures en wijzen van informatie-uitwisseling voor de inzet van
      personeel en eenheden worden geregeld.


      [ref1]: https://wetten.overheid.nl/BWBR0020546#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0020546#Artikel17
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0020546
        artikel: '16'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0020546
        artikel: '17'
        paragraaf: '4'
  - number: '18.2'
    text: |-
      De in [artikel 17, vierde lid][ref1], bedoelde afspraken betreffen tenminste de in
      [artikel 17, vijfde en zesde lid][ref2], genoemde onderwerpen, uitgangspunten, randvoorwaarden, procedures en
      wijzen van informatie-uitwisseling voor de inzet van eenheden.


      [ref1]: https://wetten.overheid.nl/BWBR0020546#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0020546#Artikel17
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0020546
        artikel: '17'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0020546
        artikel: '17'
        paragraaf: '4'
  - number: '19'
    text: Dit besluit wordt in 2009 door de Raad voor de Kustwacht geëvalueerd.
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel19
  - number: '20'
    text: |-
      De [Beschikking instelling Permanente Kontaktgroep Handhaving Noordzee][ref1] (10 december 1996/Nr. S/J-96005633
      Directoraat-Generaal Scheepvaart en Maritieme Zaken, Stcrt. 243) wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0008401
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0008401
  - number: '21'
    text: 'Dit besluit wordt aangehaald als: Besluit instelling Kustwacht.'
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel21
  - number: '22'
    text: |-
      Dit besluit treedt in werking met ingang van 1 januari 2007. Indien de Staatscourant waarin dit besluit wordt
      geplaatst wordt gepubliceerd na 30 december 2006, treedt het in werking met ingang van de tweede dag na de
      dagtekening van de Staatscourant waarin het wordt geplaatst, en werkt het terug tot en met 1 januari 2007.
    url: https://wetten.overheid.nl/BWBR0020546/2007-01-01#Artikel22
