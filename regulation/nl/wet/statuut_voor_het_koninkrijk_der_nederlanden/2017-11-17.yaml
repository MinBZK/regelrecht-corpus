        artikel: '55'
        paragraaf: '5'
  - number: '4'
    text: |-
      1 De koninklijke macht wordt in aangelegenheden van het Koninkrijk uitgeoefend door de Koning als hoofd van het
      Koninkrijk.

      2 De wetgevende macht wordt in aangelegenheden van het Koninkrijk uitgeoefend door de wetgever van het Koninkrijk.
      Bij voorstellen van rijkswet vindt de behandeling plaats met inachtneming van de [artikelen 15 t/m 21][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002154#Artikel15
    url: https://wetten.overheid.nl/BWBR0002154/2017-11-17#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002154
        artikel: '15'
        paragraaf: '2'
  - number: '5'
    text: |-
      1 Het koningschap met de troonopvolging, de in het Statuut genoemde organen van het Koninkrijk, de uitoefening van
      de koninklijke en de wetgevende macht in aangelegenheden van het Koninkrijk worden voor zover het Statuut hierin
      niet voorziet geregeld in de [Grondwet][ref1] voor het Koninkrijk.

      2 De [Grondwet][ref2] neemt de bepalingen van het Statuut in acht.

      3 Op een voorstel tot verandering in de [Grondwet][ref3], houdende bepalingen betreffende aangelegenheden van het
      Koninkrijk, alsmede op het ontwerp van wet, dat er grond bestaat een zodanig voorstel in overweging te nemen, zijn
      de [artikelen 15 t/m 20][ref4] van toepassing.


