preamble:
  text: |-
    Preambule

    Nederland, Aruba, Curaçao en Sint Maarten,

    constaterende dat Nederland, Suriname en de Nederlandse Antillen in 1954 uit vrije wil hebben verklaard in het
    Koninkrijk der Nederlanden een nieuwe rechtsorde te aanvaarden, waarin zij de eigen belangen zelfstandig behartigen
    en op voet van gelijkwaardigheid de gemeenschappelijke belangen verzorgen en wederkerig bijstand verlenen, en
    hebben besloten in gemeen overleg het Statuut voor het Koninkrijk vast te stellen;

    constaterende dat de statutaire band met Suriname is beëindigd met ingang van 25 november 1975 door wijziging van
    het Statuut bij rijkswet van 22 november 1975, Stb. 617, PbNA 233;

    constaterende dat Aruba uit vrije wil heeft verklaard deze rechtsorde als land te aanvaarden met ingang van
    1 januari 1986 voor een periode van tien jaar en met ingang van 1 januari 1996 voor onbepaalde tijd;

    overwegende dat Curaçao en Sint Maarten elk uit vrije wil hebben verklaard deze rechtsorde als land te aanvaarden;

    hebben besloten in gemeen overleg het Statuut voor het Koninkrijk als volgt nader vast te stellen.
  url: https://wetten.overheid.nl/BWBR0002154/2017-11-17#ArtikelAanhef
articles:
  - number: '1'
    text: Het Koninkrijk omvat de landen Nederland, Aruba, Curaçao en Sint Maarten.
    url: https://wetten.overheid.nl/BWBR0002154/2017-11-17#Artikel1
  - number: 1a
    text: |-
      De Kroon van het Koninkrijk wordt erfelijk gedragen door Hare Majesteit Juliana, Prinses van Oranje-Nassau en bij
      opvolging door Hare wettige opvolgers.
    url: https://wetten.overheid.nl/BWBR0002154/2017-11-17#Artikel1a
  - number: '2'
    text: |-
      1 De Koning voert de regering van het Koninkrijk en van elk der landen. Hij is onschendbaar, de ministers zijn
      verantwoordelijk.

      2 De Koning wordt in Aruba, Curaçao en Sint Maarten vertegenwoordigd door de Gouverneur. De bevoegdheden,
      verplichtingen en verantwoordelijkheid van de Gouverneur als vertegenwoordiger van de regering van het Koninkrijk
      worden geregeld bij rijkswet of in de daarvoor in aanmerking komende gevallen bij algemene maatregel van
      rijksbestuur.

      3 De rijkswet regelt hetgeen verband houdt met de benoeming en het ontslag van de Gouverneur. De benoeming en het
      ontslag geschieden door de Koning als hoofd van het Koninkrijk.
    url: https://wetten.overheid.nl/BWBR0002154/2017-11-17#Artikel2
  - number: '3'
    text: |-
      1 Onverminderd hetgeen elders in het Statuut is bepaald, zijn aangelegenheden van het Koninkrijk:

      a. de handhaving van de onafhankelijkheid en de verdediging van het Koninkrijk;

      b. de buitenlandse betrekkingen;

      c. het Nederlanderschap;

      d. de regeling van de ridderorden, alsmede van de vlag en het wapen van het Koninkrijk;

      e. de regeling van de nationaliteit van schepen en het stellen van eisen met betrekking tot de veiligheid en de
      navigatie van zeeschepen, die de vlag van het Koninkrijk voeren, met uitzondering van zeilschepen;

      f. het toezicht op de algemene regelen betreffende de toelating en uitzetting van Nederlanders;

      g. het stellen van algemene voorwaarden voor toelating en uitzetting van vreemdelingen;

      h. de uitlevering.

      2 Andere onderwerpen kunnen in gemeen overleg tot aangelegenheden van het Koninkrijk worden verklaard.

      [Artikel 55][ref1] is daarbij van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002154#Artikel55
    url: https://wetten.overheid.nl/BWBR0002154/2017-11-17#Artikel3
    references:
      - id: ref1
