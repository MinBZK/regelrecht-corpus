  - number: 60a
    text: |-
      1 De door de eilandsraden van Curaçao en Sint Maarten bij eilandsverordening
      vastgestelde ontwerpen voor een Staatsregeling van Curaçao, onderscheidenlijk van Sint
      Maarten, verkrijgen op het tijdstip van inwerkingtreding van de [artikelen I][ref1] en
      [II van de Rijkswet wijziging Statuut in verband met de opheffing van de Nederlandse Antillen][ref2] de staat van
      Staatsregeling van Curaçao, onderscheidenlijk van Sint Maarten, indien:

      a. het gevoelen van de regering van het Koninkrijk is ingewonnen voordat het ontwerp aan de betrokken eilandsraad
      is aangeboden, onderscheidenlijk voordat een initiatiefontwerp door de betrokken eilandsraad in onderzoek is
      genomen

      b. het ontwerp door de betrokken eilandsraad met ten minste twee derden van de uitgebrachte stemmen is aanvaard en

      c. de regering van het Koninkrijk met het door de betrokken eilandsraad vastgestelde ontwerp heeft ingestemd.

      2 Indien een ontwerp door een eilandsraad is aanvaard met een kleinere meerderheid dan twee derden van de
      uitgebrachte stemmen, dan wordt voldaan aan de voorwaarde genoemd in het eerste lid, onder *b*, indien de
      eilandsraad na de stemming over het ontwerp is ontbonden en het ontwerp met een volstrekte meerderheid van de
      uitgebrachte stemmen is aanvaard door de in verband met die ontbinding nieuw gekozen eilandsraad.

      3 Indien een ontwerp door een eilandsraad is aanvaard met een kleinere meerderheid dan twee derden van de
      uitgebrachte stemmen en de betrokken eilandsraad niet is ontbonden, dan wordt die eilandsraad door de gezaghebber
      ontbonden. Het besluit tot ontbinding behelst de uitschrijving van de verkiezing van een nieuwe eilandsraad binnen
      twee maanden en de eerste samenkomst van de nieuwe eilandsraad binnen drie maanden na de datum van het besluit
      tot ontbinding. Indien de nieuw gekozen eilandsraad het ontwerp aanvaardt met een volstrekte meerderheid van de
      uitgebrachte stemmen, wordt voldaan aan de voorwaarde genoemd onder *b* van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0028249#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0028249#ArtikelII
    url: https://wetten.overheid.nl/BWBR0002154/2017-11-17#Artikel60a
