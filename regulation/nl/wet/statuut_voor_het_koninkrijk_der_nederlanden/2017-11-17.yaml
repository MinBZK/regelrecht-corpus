  - number: 12a
    text: |-
      Bij rijkswet worden voorzieningen getroffen voor de behandeling van bij rijkswet aangewezen geschillen tussen het
      Koninkrijk en de landen.
    url: https://wetten.overheid.nl/BWBR0002154/2017-11-17#Artikel12a
  - number: '13'
    text: |-
      1 Er is een Raad van State van het Koninkrijk.

      2 Indien de regering van Aruba, Curaçao of Sint Maarten, de wens daartoe te kennen geeft, benoemt de Koning
      voor Aruba, Curaçao onderscheidenlijk Sint Maarten, in de Raad van State een lid, wiens benoeming geschiedt in
      overeenstemming met de Regering van het betrokken land.

      Zijn ontslag geschiedt na overleg met deze regering.

      3 De staatsraden voor Aruba, Curaçao en Sint Maarten nemen deel aan de werkzaamheden van de Raad van State ingeval
      de Raad of een afdeling van de Raad wordt gehoord over ontwerpen van rijkswetten en algemene maatregelen van
      rijksbestuur, die in Aruba, Curaçao onderscheidenlijk Sint Maarten, zullen gelden, of over andere aangelegenheden,
      die overeenkomstig [artikel 11][ref1] Aruba, Curaçao onderscheidenlijk Sint Maarten raken.

      4 Bij algemene maatregel van rijksbestuur kunnen ten opzichte van genoemde staatsraden voorschriften worden
      vastgesteld, welke afwijken van de bepalingen van de [Wet op de Raad van State][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002154#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002367
    url: https://wetten.overheid.nl/BWBR0002154/2017-11-17#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002154
        artikel: '11'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002367
  - number: '14'
    text: |-
      1 Regelen omtrent aangelegenheden van het Koninkrijk worden - voor zover de betrokken materie geen regeling in de
      [Grondwet][ref1] vindt en behoudens de internationale regelingen en het bepaalde in het derde lid - bij rijkswet of
      in de daarvoor in aanmerking komende gevallen bij algemene maatregel van rijksbestuur vastgesteld.

      De rijkswet of de algemene maatregel van rijksbestuur kan het stellen van nadere regelen opdragen of overlaten aan
      andere organen. Het opdragen of het overlaten aan de landen geschiedt aan de wetgever of de regering der landen.

      2 Indien de regeling niet aan de rijkswet is voorbehouden, kan zij geschieden bij algemene maatregel van
      rijksbestuur.

      3 Regelen omtrent aangelegenheden van het Koninkrijk, welke niet in Aruba, Curaçao of Sint Maarten gelden, worden
      bij wet of algemene maatregel van bestuur vastgesteld.

      4 Naturalisatie van personen, die woonachtig zijn in Aruba, Curaçao of Sint Maarten, geschiedt bij of krachtens
      de rijkswet.


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0002154/2017-11-17#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: '15'
    text: |-
      1 De Koning zendt een ontwerp van rijkswet gelijktijdig met de indiening bij de Staten-Generaal aan de
      vertegenwoordigende lichamen van Aruba, Curaçao en Sint Maarten.

      2 Bij een voordracht tot een voorstel van rijkswet, uitgaande van de Staten-Generaal, geschiedt de toezending van
      het voorstel door de Tweede Kamer terstond nadat het bij de Kamer aanhangig is gemaakt.

      3 De Gevolmachtigde Minister van Aruba, Curaçao of Sint Maarten, is bevoegd aan de Tweede Kamer voor te stellen een
      voordracht tot een voorstel van rijkswet te doen.
    url: https://wetten.overheid.nl/BWBR0002154/2017-11-17#Artikel15
  - number: '16'
    text: |-
      Het vertegenwoordigende lichaam van het land, waarin de regeling zal gelden, is bevoegd vóór de openbare
      behandeling van het ontwerp in de Tweede Kamer dit te onderzoeken en zo nodig binnen een daarvoor te bepalen
      termijn daaromtrent schriftelijk verslag uit te brengen.
    url: https://wetten.overheid.nl/BWBR0002154/2017-11-17#Artikel16
  - number: '17'
    text: |-
      1 De Gevolmachtigde Minister van het land, waarin de regeling zal gelden, wordt in de gelegenheid gesteld in de
      kamers der Staten-Generaal de mondelinge behandeling van het ontwerp van rijkswet bij te wonen en daarbij zodanige
      voorlichting aan de kamers te verstrekken als hij gewenst oordeelt.

      2 Het vertegenwoordigende lichaam van het land, waarin de regeling zal gelden, kan besluiten voor de behandeling
      van een bepaald ontwerp in de Staten-Generaal één of meer bijzondere gedelegeerden af te vaardigen, die eveneens
      gerechtigd zijn de mondelinge behandeling bij te wonen en daarbij voorlichting te geven.

      3 De Gevolmachtigde Ministers en de bijzondere gedelegeerden zijn niet gerechtelijk vervolgbaar voor hetgeen zij in
      de vergadering van de kamers der Staten-Generaal hebben gezegd of aan haar schriftelijk hebben overgelegd.

      4 De Gevolmachtigde Ministers en de bijzondere gedelegeerden zijn bevoegd bij de behandeling in de Tweede Kamer
      wijzigingen in het ontwerp voor te stellen.
    url: https://wetten.overheid.nl/BWBR0002154/2017-11-17#Artikel17
  - number: '18'
    text: |-
      1 De Gevolmachtigde Minister van het land, waarin de regeling zal gelden, wordt vóór de eindstemming over een
      voorstel van rijkswet in de kamers der Staten-Generaal in de gelegenheid gesteld zich omtrent dit voorstel uit te
      spreken. Indien de Gevolmachtigde Minister zich tegen het voorstel verklaart, kan hij tevens de kamer verzoeken de
      stemming tot de volgende vergadering aan te houden. Indien de Tweede Kamer nadat de Gevolmachtigde Minister zich
      tegen het voorstel heeft verklaard dit aanneemt met een geringere meerderheid dan drie vijfden van het aantal der
      uitgebrachte stemmen, wordt de behandeling geschorst en vindt nader overleg omtrent het voorstel plaats in de raad
      van ministers.

      2 Wanneer in de vergadering van de kamers bijzondere gedelegeerden aanwezig zijn, komt de in het eerste lid
      bedoelde bevoegdheid aan de door het vertegenwoordigende lichaam daartoe aangewezen gedelegeerde.
    url: https://wetten.overheid.nl/BWBR0002154/2017-11-17#Artikel18
  - number: '19'
    text: |-
      De [artikelen 17][ref1] en [18][ref2] zijn voor de behandeling in de verenigde vergadering van de Staten-Generaal
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002154#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0002154#Artikel18
    url: https://wetten.overheid.nl/BWBR0002154/2017-11-17#Artikel19
