        artikel: '35'
        paragraaf: '2'
  - number: '12'
    text: |-
      1 Indien de Gevolmachtigde Minister van Aruba, Curaçao of Sint Maarten, onder aanwijzing van de gronden, waarop hij
      ernstige benadeling van zijn land verwacht, heeft verklaard, dat zijn land niet ware te binden aan een voorgenomen
      voorziening, houdende algemeen bindende regelen, kan de voorziening niet in dier voege, dat zij in het betrokken
      land geldt, worden vastgesteld, tenzij de verbondenheid van het land in het Koninkrijk zich daartegen verzet.

      2 Indien de Gevolmachtigde Minister van Aruba, Curaçao of Sint Maarten, ernstig bezwaar heeft tegen het
      aanvankelijk oordeel van de raad van ministers over de eis van gebondenheid, bedoeld in het eerste lid, dan wel
      over enige andere aangelegenheid, aan de behandeling waarvan hij heeft deelgenomen, wordt op zijn verzoek het
      overleg, zo nodig met inachtneming van een daartoe door de raad van ministers te bepalen termijn, voortgezet.

      3 Het hiervoren bedoeld overleg geschiedt tussen de minister-president, twee ministers, de Gevolmachtigde Minister
      en een door de betrokken regering aan te wijzen minister of bijzonder gemachtigde.

      4 Wensen meerdere Gevolmachtigde Ministers aan het voortgezette overleg deel te nemen, dan geschiedt dit
      overleg tussen deze Gevolmachtigde Ministers, een even groot aantal ministers en de minister-president. Het
      [tweede lid van artikel 10][ref1] is van overeenkomstige toepassing.

      5 De raad van ministers oordeelt overeenkomstig de uitkomst van het voortgezette overleg. Wordt van de gelegenheid
      tot het plegen van voortgezet overleg niet binnen de bepaalde termijn gebruik gemaakt, dan bepaalt de raad van
      ministers zijn oordeel.


      [ref1]: https://wetten.overheid.nl/BWBR0002154#Artikel10
    url: https://wetten.overheid.nl/BWBR0002154/2017-11-17#Artikel12
