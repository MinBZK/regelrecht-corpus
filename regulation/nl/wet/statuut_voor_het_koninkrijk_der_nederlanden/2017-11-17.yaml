  - number: '20'
    text: |-
      Bij rijkswet kunnen nadere regels worden gesteld ten aanzien van het bepaalde in de [artikelen 15 t/m 19][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002154#Artikel15
    url: https://wetten.overheid.nl/BWBR0002154/2017-11-17#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002154
        artikel: '15'
        paragraaf: '2'
  - number: '21'
    text: |-
      Indien, na gepleegd overleg met de Gevolmachtigde Ministers van Aruba, Curaçao en Sint Maarten, in geval van oorlog
      of in andere bijzondere gevallen, waarin onverwijld moet worden gehandeld, het naar het oordeel van de Koning
      onmogelijk is het resultaat van het in [artikel 16][ref1] bedoelde onderzoek af te wachten, kan van de bepaling van
      dat artikel worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0002154#Artikel16
    url: https://wetten.overheid.nl/BWBR0002154/2017-11-17#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002154
        artikel: '16'
        paragraaf: '2'
  - number: '22'
    text: |-
      1 De regering van het Koninkrijk draagt zorg voor de afkondiging van rijkswetten en algemene maatregelen
      van rijksbestuur. Zij geschiedt in het land, waar de regeling zal gelden in het officiële publikatieblad. De
      landsregeringen verlenen daartoe de nodige medewerking.

      2 Zij treden in werking op het in of krachtens die regelingen te bepalen tijdstip.

      3 Het formulier van afkondiging der rijkswetten en der algemene maatregelen van rijksbestuur vermeldt, dat de
      bepalingen van het Statuut voor het Koninkrijk zijn in acht genomen.
    url: https://wetten.overheid.nl/BWBR0002154/2017-11-17#Artikel22
  - number: '23'
    text: |-
      1 De rechtsmacht van de Hoge Raad der Nederlanden ten aanzien van rechtszaken in Aruba, Curaçao en Sint Maarten,
      alsmede op Bonaire, Sint Eustatius en Saba, wordt geregeld bij rijkswet.

      2 Indien de regering van Aruba, Curaçao of Sint Maarten dit verzoekt, wordt bij deze rijkswet de mogelijkheid
      geopend, dat aan de Raad een lid, een buitengewoon of een adviserend lid wordt toegevoegd.
    url: https://wetten.overheid.nl/BWBR0002154/2017-11-17#Artikel23
  - number: '24'
    text: |-
      1 Overeenkomsten met andere mogendheden en met volkenrechtelijke organisaties, welke Aruba, Curaçao of Sint Maarten
      raken, worden gelijktijdig met de overlegging aan de Staten-Generaal aan het vertegenwoordigende lichaam van Aruba,
      Curaçao onderscheidenlijk Sint Maarten overgelegd.

      2 Ingeval de overeenkomst ter stilzwijgende goedkeuring aan de Staten-Generaal is overgelegd, kan de Gevolmachtigde
      Minister binnen de daartoe voor de kamers der Staten-Generaal gestelde termijn de wens te kennen geven dat de
      overeenkomst aan de uitdrukkelijke goedkeuring van de Staten-Generaal zal worden onderworpen.

      3 De voorgaande leden zijn van overeenkomstige toepassing ten aanzien van opzegging van internationale
      overeenkomsten, het eerste lid met dien verstande, dat van het voornemen tot opzegging mededeling aan het
      vertegenwoordigende lichaam van Aruba, Curaçao onderscheidenlijk Sint Maarten wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0002154/2017-11-17#Artikel24
  - number: '25'
    text: |-
      1 Aan internationale economische en financiële overeenkomsten bindt de Koning Aruba, Curaçao of Sint Maarten, niet,
      indien de regering van het land, onder aanwijzing van de gronden, waarop zij van de binding benadeling van het land
      verwacht, heeft verklaard, dat het land niet dient te worden verbonden.

      2 Internationale economische en financiële overeenkomsten zegt de Koning voor wat Aruba, Curaçao of Sint Maarten
      betreft, niet op, indien de regering van het land, onder aanwijzing van de gronden, waarop zij van de opzegging
      benadeling van het land verwacht, heeft verklaard, dat voor het land geen opzegging dient plaats te vinden.
      Opzegging kan niettemin geschieden, indien het met de bepalingen der overeenkomst niet verenigbaar is, dat het land
      van de opzegging wordt uitgesloten.
    url: https://wetten.overheid.nl/BWBR0002154/2017-11-17#Artikel25
  - number: '26'
    text: |-
      Indien de regering van Aruba, Curaçao of Sint Maarten, de wens te kennen geeft, dat een internationale economische
      of financiële overeenkomst wordt aangegaan, welke uitsluitend voor het betrokken land geldt, zal de regering van
      het Koninkrijk medewerken tot een zodanige overeenkomst, tenzij de verbondenheid van het land in het Koninkrijk
      zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0002154/2017-11-17#Artikel26
  - number: '27'
    text: |-
      1 Aruba, Curaçao en Sint Maarten worden in een zo vroeg mogelijk stadium betrokken in de voorbereiding van
      overeenkomsten met andere mogendheden, welke hen overeenkomstig [artikel 11][ref1] raken. Zij worden tevens
      betrokken in de uitvoering van overeenkomsten, die hen aldus raken en voor hen verbindend zijn.

      2 Nederland, Aruba, Curaçao en Sint Maarten treffen een onderlinge regeling over de samenwerking tussen de landen
      ten behoeve van de totstandkoming van regelgeving of andere maatregelen die noodzakelijk zijn voor de uitvoering
      van overeenkomsten met andere mogendheden.

      3 Indien de belangen van het Koninkrijk geraakt worden door het uitblijven van regelgeving of andere maatregelen
      die noodzakelijk zijn voor de uitvoering van een overeenkomst met andere mogendheden in een van de landen, terwijl
      de overeenkomst pas voor dat land kan worden bekrachtigd als de regelgeving of andere maatregelen gereed zijn,
      kan een algemene maatregel van rijksbestuur, of indien nodig een rijkswet, bepalen op welke wijze uitvoering wordt
      gegeven aan die overeenkomst.

      4 Indien de regelgeving of andere maatregelen ter uitvoering van de betreffende overeenkomst door het land zijn
      getroffen, wordt de algemene maatregel van rijksbestuur of de rijkswet ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0002154#Artikel11
    url: https://wetten.overheid.nl/BWBR0002154/2017-11-17#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002154
        artikel: '11'
        paragraaf: '2'
  - number: '28'
    text: |-
      Op de voet van door het Koninkrijk aangegane internationale overeenkomsten kunnen Aruba, Curaçao en Sint Maarten
      desgewenst als lid tot volkenrechtelijke organisaties toetreden.
    url: https://wetten.overheid.nl/BWBR0002154/2017-11-17#Artikel28
  - number: '29'
    text: |-
      1 Het aangaan of garanderen van een geldlening buiten het Koninkrijk ten name of ten laste van een der landen
      geschiedt in overeenstemming met de regering van het Koninkrijk.

      2 De raad van ministers verenigt zich met het aangaan of garanderen van zodanige geldlening, tenzij de belangen van
      het Koninkrijk zich daartegen verzetten.
    url: https://wetten.overheid.nl/BWBR0002154/2017-11-17#Artikel29
  - number: '30'
    text: |-
      1 Aruba, Curaçao en Sint Maarten verlenen aan de strijdkrachten, welke zich op hun gebied bevinden, de hulp en
      bijstand, welke deze in de uitoefening van hun taak behoeven.

      2 Bij landsverordening worden regelen gesteld om te waarborgen, dat de krijgsmacht van het Koninkrijk in Aruba,
      Curaçao en Sint Maarten haar taak kan vervullen.
    url: https://wetten.overheid.nl/BWBR0002154/2017-11-17#Artikel30
  - number: '31'
    text: |-
      1 Personen, die woonachtig zijn in Aruba, Curaçao en Sint Maarten, kunnen niet dan bij landsverordening tot dienst
      in de krijgsmacht dan wel tot burgerdienstplicht worden verplicht.

      2 Aan de Staatsregeling is voorbehouden te bepalen, dat de dienstplichtigen, dienende bij de landmacht, zonder hun
      toestemming niet dan krachtens een landsverordening naar elders kunnen worden gezonden.
    url: https://wetten.overheid.nl/BWBR0002154/2017-11-17#Artikel31
  - number: '32'
    text: |-
      In de strijdkrachten voor de verdediging van Aruba, Curaçao en Sint Maarten, zullen zoveel mogelijk personen, die
      in deze landen woonachtig zijn, worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0002154/2017-11-17#Artikel32
  - number: '33'
    text: |-
      1 Ten behoeve van de verdediging geschiedt de vordering in eigendom en in gebruik van goederen, de beperking van
      het eigendoms- en gebruiksrecht, de vordering van diensten en de inkwartieringen niet dan met inachtneming van bij
      rijkswet te stellen algemene regelen, welke tevens voorzieningen inhouden omtrent de schadeloosstelling.

      2 Bij deze rijkswet worden nadere regelingen waar mogelijk aan landsorganen opgedragen.
    url: https://wetten.overheid.nl/BWBR0002154/2017-11-17#Artikel33
  - number: '34'
    text: |-
      1 De Koning kan ter handhaving van de uit- of inwendige veiligheid, in geval van oorlog of oorlogsgevaar of ingeval
      bedreiging of verstoring van de inwendige orde en rust kan leiden tot wezenlijke aantasting van belangen van het
      Koninkrijk, elk gedeelte van het grondgebied in staat van oorlog of in staat van beleg verklaren.

      2 Bij of krachtens rijkswet wordt de wijze bepaald, waarop zodanige verklaring geschiedt, en worden de gevolgen
      geregeld.

      3 Bij die regeling kan worden bepaald, dat en op welke wijze bevoegdheden van organen van het burgerlijk gezag
      ten opzichte van de openbare orde en de politie geheel of ten dele op andere organen van het burgerlijk gezag
      of op het militaire gezag overgaan en dat de burgerlijke overheden in het laatste geval te dezen aanzien aan de
      militaire ondergeschikt worden. Omtrent het overgaan van bevoegdheden vindt waar mogelijk overleg met de regering
      van het betrokken land plaats. Bij die regeling kan worden afgeweken van de bepalingen betreffende de vrijheid
      van drukpers, het recht van vereniging en vergadering, zomede betreffende de onschendbaarheid van woning en het
      postgeheim.

      4 Voor het in staat van beleg verklaarde gebied kunnen in geval van oorlog op de wijze, bij rijkswet bepaald,
      het militaire strafrecht en de militaire strafrechtspleging geheel of ten dele op een ieder van toepassing worden
      verklaard.
    url: https://wetten.overheid.nl/BWBR0002154/2017-11-17#Artikel34
  - number: '35'
    text: |-
      1 Aruba, Curaçao en Sint Maarten dragen in overeenstemming met hun draagkracht bij in de kosten, verbonden aan
      de handhaving van de onafhankelijkheid en de verdediging van het Koninkrijk, zomede in de kosten, verbonden aan
      de verzorging van andere aangelegenheden van het Koninkrijk, voor zover deze strekt ten gunste van Aruba, Curaçao
      onderscheidenlijk Sint Maarten.

      2 De in het eerste lid bedoelde bijdrage van Aruba, Curaçao of Sint Maarten, wordt door de raad van ministers voor
      een begrotingsjaar of enige achtereenvolgende begrotingsjaren vastgesteld.

      [Artikel 12][ref1] is van overeenkomstige toepassing, met dien verstande, dat beslissingen worden genomen met
      eenparigheid van stemmen.

      3 Indien de in het tweede lid bedoelde vaststelling niet tijdig plaats heeft, geldt in afwachting daarvan voor
      de duur van ten hoogste een begrotingsjaar de overeenkomstig dat lid voor het laatste begrotingsjaar vastgestelde
      bijdrage.

      4 De voorgaande leden zijn niet van toepassing ten aanzien van de kosten van voorzieningen, waarvoor bijzondere
      regelingen zijn getroffen.


      [ref1]: https://wetten.overheid.nl/BWBR0002154#Artikel12
    url: https://wetten.overheid.nl/BWBR0002154/2017-11-17#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002154
        artikel: '12'
        paragraaf: '2'
  - number: '36'
    text: Nederland, Aruba, Curaçao en Sint Maarten verlenen elkander hulp en bijstand.
    url: https://wetten.overheid.nl/BWBR0002154/2017-11-17#Artikel36
  - number: '37'
    text: |-
      1 Nederland, Aruba, Curaçao en Sint Maarten zullen zoveel mogelijk overleg plegen omtrent alle aangelegenheden,
      waarbij belangen van twee of meer van de landen zijn betrokken. Daartoe kunnen bijzondere vertegenwoordigers worden
      aangewezen en gemeenschappelijke organen worden ingesteld.

      2 Als aangelegenheden, bedoeld in dit artikel, worden onder meer beschouwd:

      a. de bevordering van de culturele en sociale betrekkingen tussen de landen;

      b. de bevordering van doelmatige economische, financiële en monetaire betrekkingen tussen de landen;

      c. vraagstukken inzake munt- en geldwezen, bank- en deviezenpolitiek;

      d. de bevordering van de economische weerbaarheid door onderlinge hulp en bijstand van de landen;

      e. de beroeps- en bedrijfsuitoefening van Nederlanders in de landen;

      f. aangelegenheden, de luchtvaart betreffende, waaronder begrepen het beleid inzake het ongeregelde luchtvervoer;

      g. aangelegenheden, de scheepvaart betreffende;

      h. de samenwerking op het gebied van telegrafie, telefonie en radioverkeer.
    url: https://wetten.overheid.nl/BWBR0002154/2017-11-17#Artikel37
  - number: '38'
    text: |-
      1 Nederland, Aruba, Curaçao en Sint Maarten kunnen onderling regelingen treffen.

      2 In onderling overleg kan worden bepaald, dat zodanige regeling en de wijziging daarvan bij rijkswet of algemene
      maatregel van rijksbestuur wordt vastgesteld.

      3 Omtrent privaatrechtelijke en strafrechtelijke onderwerpen van interregionale of internationale aard kunnen bij
      rijkswet regelen worden gesteld, indien omtrent deze regelen overeenstemming tussen de regeringen der betrokken
      landen bestaat.

      4 In het onderwerp van de zetelverplaatsing van rechtspersonen wordt bij rijkswet voorzien. Omtrent deze
      voorziening is overeenstemming tussen de regeringen der landen vereist.
    url: https://wetten.overheid.nl/BWBR0002154/2017-11-17#Artikel38
  - number: 38a
    text: |-
      De landen kunnen bij onderlinge regeling voorzieningen treffen voor de behandeling van onderlinge geschillen. Het
      tweede lid van [artikel 38][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002154#Artikel38
    url: https://wetten.overheid.nl/BWBR0002154/2017-11-17#Artikel38a
    references:
      - id: ref1
        bwb_id: BWBR0002154
        artikel: '38'
        paragraaf: '3'
  - number: '39'
    text: |-
      1 Het burgerlijk en handelsrecht, de burgerlijke rechtsvordering, het strafrecht, de strafvordering, het
      auteursrecht, de industriële eigendom, het notarisambt, zomede bepalingen omtrent maten en gewichten worden in
      Nederland, Aruba, Curaçao en Sint Maarten zoveel mogelijk op overeenkomstige wijze geregeld.

      2 Een voorstel tot ingrijpende wijziging van de bestaande wetgeving op dit stuk wordt niet bij het
      vertegenwoordigende lichaam ingediend - dan wel door het vertegenwoordigende lichaam in behandeling genomen -
      alvorens de regeringen in de andere landen in de gelegenheid zijn gesteld van haar zienswijze hieromtrent te doen
      blijken.
    url: https://wetten.overheid.nl/BWBR0002154/2017-11-17#Artikel39
  - number: '40'
    text: |-
      Vonnissen, door de rechter in Nederland, Aruba, Curaçao of Sint Maarten gewezen, en bevelen, door hem
      uitgevaardigd, mitsgaders grossen van authentieke akten, aldaar verleden, kunnen in het gehele Koninkrijk ten
      uitvoer worden gelegd, met inachtneming van de wettelijke bepalingen van het land, waar de tenuitvoerlegging plaats
      vindt.
    url: https://wetten.overheid.nl/BWBR0002154/2017-11-17#Artikel40
  - number: '41'
    text: |-
      1 Nederland, Aruba, Curaçao en Sint Maarten behartigen zelfstandig hun eigen aangelegenheden.

      2 De belangen van het Koninkrijk zijn mede een voorwerp van zorg voor de landen.
    url: https://wetten.overheid.nl/BWBR0002154/2017-11-17#Artikel41
  - number: '42'
    text: |-
      1 In het Koninkrijk vindt de staatsinrichting van Nederland regeling in de [Grondwet][ref1], die van Aruba, Curaçao
      en Sint Maarten in de Staatsregelingen van Aruba, van Curaçao en van Sint Maarten.

      2 De Staatsregelingen van Aruba, van Curaçao en van Sint Maarten worden vastgesteld bij landsverordening.
      Elk voorstel tot verandering van de Staatsregeling wijst de voorgestelde verandering uitdrukkelijk aan. Het
      vertegenwoordigende lichaam kan het ontwerp van een zodanige landsverordening niet aannemen dan met twee derden der
      uitgebrachte stemmen.


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0002154/2017-11-17#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: '43'
    text: |-
      1 Elk der landen draagt zorg voor de verwezenlijking van de fundamentele menselijke rechten en vrijheden, de
      rechtszekerheid en de deugdelijkheid van het bestuur.

      2 Het waarborgen van deze rechten, vrijheden, rechtszekerheid en deugdelijkheid van bestuur is aangelegenheid van
      het Koninkrijk.
    url: https://wetten.overheid.nl/BWBR0002154/2017-11-17#Artikel43
  - number: '44'
    text: |-
      1 Een landsverordening tot wijziging van de Staatsregeling voor wat betreft:

      a. de artikelen, betrekking hebbende op de fundamentele menselijke rechten en vrijheden;

      b. de bepalingen, betrekking hebbende op de bevoegdheden van de Gouverneur;

      c. de artikelen, betrekking hebbende op de bevoegdheden van de vertegenwoordigende lichamen van de landen;

      d. de artikelen, betrekking hebbende op de rechtspraak,

      wordt overgelegd aan de regering van het Koninkrijk. Zij treedt niet in werking dan nadat de regering van het
      Koninkrijk haar instemming hiermede heeft betuigd.

      2 Een ontwerp-landsverordening betreffende de voorgaande bepalingen wordt niet aan het vertegenwoordigende lichaam
      aangeboden, noch bij een initiatief-ontwerp door dit lichaam in onderzoek genomen dan nadat het gevoelen der
      regering van het Koninkrijk is ingewonnen.
    url: https://wetten.overheid.nl/BWBR0002154/2017-11-17#Artikel44
  - number: '45'
    text: |-
      Wijzigingen in de [Grondwet][ref1] betreffende:

      a. de artikelen, betrekking hebbende op de fundamentele menselijke rechten en vrijheden;

      b. de bepalingen, betrekking hebbende op de bevoegdheden van de regering;

      c. de artikelen, betrekking hebbende op de bevoegdheden van het vertegenwoordigende lichaam;

      d. de artikelen, betrekking hebbende op de rechtspraak,

      worden - onverminderd het bepaalde in [artikel 5][ref2] - geacht in de zin van [artikel 10][ref3] Aruba, Curaçao en
      Sint Maarten te raken.


      [ref1]: https://wetten.overheid.nl/BWBR0001840
      [ref2]: https://wetten.overheid.nl/BWBR0002154#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0002154#Artikel10
    url: https://wetten.overheid.nl/BWBR0002154/2017-11-17#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0001840
      - id: ref2
        bwb_id: BWBR0002154
        artikel: '5'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0002154
        artikel: '10'
        paragraaf: '2'
  - number: '46'
    text: |-
      1 De vertegenwoordigende lichamen worden gekozen door de ingezetenen van het betrokken land, tevens Nederlanders,
      die de door de landen te bepalen leeftijd, welke niet hoger mag zijn dan 25 jaren, hebben bereikt. Iedere kiezer
      brengt slechts één stem uit. De verkiezingen zijn vrij en geheim. Indien de noodzaak daartoe blijkt, kunnen
      de landen beperkingen stellen. Iedere Nederlander is verkiesbaar met dien verstande, dat de landen de eis van
      ingezetenschap en een leeftijdsgrens kunnen stellen.

      2 De landen kunnen aan Nederlanders die geen ingezetenen van het betrokken land zijn, het recht toekennen
      vertegenwoordigende lichamen te kiezen, alsmede aan ingezetenen van het betrokken land die geen Nederlander zijn,
      het recht vertegenwoordigende lichamen te kiezen en het recht daarin gekozen te worden, een en ander mits daarbij
      tenminste de vereisten voor ingezetenen die tevens Nederlander zijn, in acht worden genomen.
    url: https://wetten.overheid.nl/BWBR0002154/2017-11-17#Artikel46
  - number: '47'
    text: |-
      1 De ministers en de leden van het vertegenwoordigende lichaam in de landen leggen, alvorens hun betrekking te
      aanvaarden, een eed of belofte van trouw aan de Koning en het Statuut af.

      2 De ministers en de leden van het vertegenwoordigende lichaam in Aruba, Curaçao en Sint Maarten leggen de eed of
      belofte af in handen van de vertegenwoordiger van de Koning.
    url: https://wetten.overheid.nl/BWBR0002154/2017-11-17#Artikel47
  - number: '48'
    text: De landen nemen bij hun wetgeving en bestuur de bepalingen van het Statuut in acht.
    url: https://wetten.overheid.nl/BWBR0002154/2017-11-17#Artikel48
  - number: '49'
    text: |-
      Bij rijkswet kunnen regels worden gesteld omtrent de verbindendheid van wetgevende maatregelen, die in strijd zijn
      met het Statuut, een internationale regeling, een rijkswet of een algemene maatregel van rijksbestuur.
    url: https://wetten.overheid.nl/BWBR0002154/2017-11-17#Artikel49
  - number: '50'
    text: |-
      1 Wetgevende en bestuurlijke maatregelen in Aruba, Curaçao en Sint Maarten, die in strijd zijn met het Statuut,
      een internationale regeling, een rijkswet of een algemene maatregel van rijksbestuur, dan wel met belangen, welker
      verzorging of waarborging aangelegenheid van het Koninkrijk is, kunnen door de Koning als hoofd van het Koninkrijk
      bij gemotiveerd besluit worden geschorst en vernietigd. De voordracht tot vernietiging geschiedt door de raad van
      ministers.

      2 Voor Nederland wordt in dit onderwerp voor zover nodig in de [Grondwet][ref1] voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0002154/2017-11-17#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: '51'
    text: |-
      1 Wanneer een orgaan in Aruba, Curaçao of Sint Maarten niet of niet voldoende voorziet in hetgeen het ingevolge
      het Statuut, een internationale regeling, een rijkswet of een algemene maatregel van rijksbestuur moet verrichten,
      kan, onder aanwijzing van de rechtsgronden en de beweegredenen, waarop hij berust, een algemene maatregel van
      rijksbestuur bepalen op welke wijze hierin wordt voorzien.

      2 Voor Nederland wordt in dit onderwerp voor zover nodig in de [Grondwet][ref1] voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0002154/2017-11-17#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: '52'
    text: |-
      De landsverordening kan aan de Koning als hoofd van het Koninkrijk en aan de Gouverneur als orgaan van het
      Koninkrijk met goedkeuring van de Koning bevoegdheden met betrekking tot landsaangelegenheden toekennen.
    url: https://wetten.overheid.nl/BWBR0002154/2017-11-17#Artikel52
  - number: '53'
    text: |-
      Indien Aruba, Curaçao of Sint Maarten de wens daartoe te kennen geven, wordt het onafhankelijke toezicht op de
      besteding der geldmiddelen overeenkomstig de begroting van Aruba, Curaçao onderscheidenlijk Sint Maarten, door
      de Algemene Rekenkamer uitgeoefend. In dat geval worden na overleg met de Rekenkamer bij rijkswet regelen gesteld
      omtrent de samenwerking tussen de Rekenkamer en het betrokken land. Alsdan zal de regering van het land op
      voordracht van het vertegenwoordigende lichaam iemand kunnen aanwijzen, die in de gelegenheid wordt gesteld deel te
      nemen aan de beraadslagingen over alle aangelegenheden van het betrokken land.
    url: https://wetten.overheid.nl/BWBR0002154/2017-11-17#Artikel53
  - number: '55'
    text: |-
      1 Wijziging van dit Statuut geschiedt bij rijkswet.

      2 Een voorstel tot wijziging, door de Staten-Generaal aangenomen, wordt door de Koning niet goedgekeurd, alvorens
      het door Aruba, Curaçao en Sint Maarten is aanvaard. Deze aanvaarding geschiedt bij landsverordening.

      Deze landsverordening wordt niet vastgesteld alvorens het ontwerp door de Staten in twee lezingen is goedgekeurd.
      Indien het ontwerp in eerste lezing is goedgekeurd met twee derden der uitgebrachte stemmen, geschiedt de
      vaststelling terstond. De tweede lezing vindt plaats binnen een maand nadat het ontwerp in eerste lezing is
      goedgekeurd.

      3 Indien en voor zover een voorstel tot wijziging van het Statuut afwijkt van de [Grondwet][ref1], wordt het
      voorstel behandeld op de wijze, als de [Grondwet][ref2] voor voorstellen tot verandering in de [Grondwet][ref3]
      bepaalt, met dien verstande, dat de beide kamers in tweede lezing de voorgestelde verandering bij volstrekte
      meerderheid der uitgebrachte stemmen kunnen aannemen.


      [ref1]: https://wetten.overheid.nl/BWBR0001840
      [ref2]: https://wetten.overheid.nl/BWBR0001840
      [ref3]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0002154/2017-11-17#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0001840
      - id: ref2
        bwb_id: BWBR0001840
      - id: ref3
        bwb_id: BWBR0001840
  - number: '56'
    text: |-
      Op het tijdstip van inwerkingtreding van het Statuut bestaande autoriteiten, verbindende wetten, verordeningen en
      besluiten blijven gehandhaafd totdat zij door andere, met inachtneming van dit Statuut, zijn vervangen. Voor zover
      het Statuut zelf in enig onderwerp anders voorziet, geldt de regeling van het Statuut.
    url: https://wetten.overheid.nl/BWBR0002154/2017-11-17#Artikel56
  - number: '57'
    text: |-
      Wetten en algemene maatregelen van bestuur, die in de Nederlandse Antillen golden, hebben de staat van rijkswet,
      onderscheidenlijk van algemene maatregel van rijksbestuur, met dien verstande, dat zij, voor zover zij ingevolge
      het Statuut bij landsverordening kunnen worden gewijzigd, de staat hebben van landsverordening.
    url: https://wetten.overheid.nl/BWBR0002154/2017-11-17#Artikel57
  - number: 57a
    text: |-
      Bestaande rijkswetten, wetten, landsverordeningen, algemene maatregelen van rijksbestuur, algemene maatregelen
      van bestuur en andere regelingen en besluiten die in strijd zijn met een verandering in het Statuut, blijven
      gehandhaafd, totdat daarvoor met inachtneming van het Statuut een voorziening is getroffen.
    url: https://wetten.overheid.nl/BWBR0002154/2017-11-17#Artikel57a
  - number: '58'
    text: |-
      1 Aruba kan bij landsverordening verklaren dat het de rechtsorde neergelegd in het Statuut ten aanzien van Aruba
      wil beëindigen.

      2 Het voorstel van een zodanige landsverordening gaat bij indiening vergezeld van een schets van een toekomstige
      constitutie, houdende tenminste bepalingen inzake de grondrechten, regering, vertegenwoordigend orgaan, wetgeving
      en bestuur, rechtspraak en wijziging van de constitutie.

      3 De Staten kunnen het voorstel niet goedkeuren dan met een meerderheid van twee derden van de stemmen van het
      aantal zitting hebbende leden.
    url: https://wetten.overheid.nl/BWBR0002154/2017-11-17#Artikel58
  - number: '59'
    text: |-
      1 Binnen zes maanden nadat de Staten van Aruba het in [artikel 58][ref1] genoemde voorstel hebben goedgekeurd
      wordt een bij landsverordening geregeld referendum gehouden, waarbij de kiesgerechtigden voor de Staten zich kunnen
      uitspreken over het goedgekeurde voorstel.

      2 Het goedgekeurde voorstel wordt niet als landsverordening vastgesteld dan nadat bij het referendum een
      meerderheid van het aantal kiesgerechtigden voor het voorstel heeft gestemd.


      [ref1]: https://wetten.overheid.nl/BWBR0002154#Artikel58
    url: https://wetten.overheid.nl/BWBR0002154/2017-11-17#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0002154
        artikel: '58'
        paragraaf: '5'
  - number: '60'
    text: |-
      1 Na vaststelling van de landsverordening overeenkomstig de [artikelen 58][ref1] en [59][ref2] en goedkeuring van
      de toekomstige constitutie door de Staten van Aruba met een meerderheid van ten minste twee derden van de stemmen
      van het aantal zitting hebbende leden wordt overeenkomstig het gevoelen van de regering van Aruba bij koninklijk
      besluit het tijdstip van beëindiging van de in het Statuut neergelegde rechtsorde ten aanzien van Aruba bepaald.

      2 Dit tijdstip ligt ten hoogste een maand na de datum van vaststelling van de constitutie. Deze vaststelling vindt
      plaats ten hoogste een jaar na de datum van het in [artikel 59][ref3] bedoelde referendum.


      [ref1]: https://wetten.overheid.nl/BWBR0002154#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0002154#Artikel59
      [ref3]: https://wetten.overheid.nl/BWBR0002154#Artikel59
    url: https://wetten.overheid.nl/BWBR0002154/2017-11-17#Artikel60
