  - number: '61'
    text: |-
      Het Statuut treedt in werking op het tijdstip van de plechtige afkondiging, nadat het bevestigd is door de Koning.

      Alvorens de bevestiging geschiedt, behoeft het Statuut aanvaarding voor Nederland op de wijze, in
      de [Grondwet][ref1] voorzien; voor Suriname en voor de Nederlandse Antillen door een besluit van het
      vertegenwoordigende lichaam.

      Dit besluit wordt genomen met twee derden der uitgebrachte stemmen. Wordt deze meerderheid niet verkregen, dan
      worden de Staten ontbonden en wordt door de nieuwe Staten bij volstrekte meerderheid der uitgebrachte stemmen
      beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0002154/2017-11-17#Artikel61
    references:
      - id: ref1
