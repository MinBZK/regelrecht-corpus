  - number: 60b
    text: |-
      1 De door de eilandsraden van Curaçao en Sint Maarten bij eilandsverordening
      vastgestelde ontwerp-landsverordeningen van Curaçao, onderscheidenlijk Sint Maarten,
      verkrijgen op het tijdstip van inwerkingtreding van de [artikelen I][ref1] en
      [II van de Rijkswet wijziging Statuut in verband met de opheffing van de Nederlandse Antillen][ref2] de staat van
      landsverordeningen van het land Curaçao, onderscheidenlijk Sint Maarten.

      2 De door het Bestuurscollege van Curaçao of Sint Maarten bij eilandsbesluit of eilandsbesluit,
      houdende algemene maatregelen, vastgestelde ontwerp-landsbesluiten onderscheidenlijk
      ontwerp-landsbesluiten, houdende algemene maatregelen van Curaçao, onderscheidenlijk Sint
      Maarten, verkrijgen op het tijdstip van inwerkingtreding van de [artikelen I][ref3] en
      [II van de Rijkswet wijziging Statuut in verband met de opheffing van de Nederlandse Antillen][ref4] de staat van
      landsbesluit, onderscheidenlijk landsbesluit, houdende algemene maatregelen van Curaçao, onderscheidenlijk Sint
      Maarten.


