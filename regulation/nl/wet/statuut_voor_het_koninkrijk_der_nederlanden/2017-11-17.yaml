  - number: 60c
    text: |-
      De Bestuurscolleges van Curaçao en Sint Maarten kunnen met elkaar en één of meer regeringen van de landen
      van het Koninkrijk ontwerp-onderlinge regelingen treffen die de staat van onderlinge regeling in de zin van
      [artikel 38, eerste lid][ref1], krijgen op het tijdstip van inwerkingtreding van de [artikelen I][ref2] en
      [II van de Rijkswet wijziging Statuut in verband met de opheffing van de Nederlandse Antillen][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002154#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0028249#ArtikelI
      [ref3]: https://wetten.overheid.nl/BWBR0028249#ArtikelII
