  - number: '6'
    text: |-
      1 De aangelegenheden van het Koninkrijk worden in samenwerking van Nederland, Aruba, Curaçao en Sint Maarten
      behartigd overeenkomstig de navolgende bepalingen.

      2 Bij de behartiging van deze aangelegenheden worden waar mogelijk de landsorganen ingeschakeld.
    url: https://wetten.overheid.nl/BWBR0002154/2017-11-17#Artikel6
  - number: '7'
    text: |-
      De raad van ministers van het Koninkrijk is samengesteld uit de door de Koning benoemde ministers en de door de
      regering van Aruba, Curaçao onderscheidenlijk Sint Maarten benoemde Gevolmachtigde Minister.
    url: https://wetten.overheid.nl/BWBR0002154/2017-11-17#Artikel7
  - number: '8'
    text: |-
      1 De Gevolmachtigde Ministers handelen namens de regeringen van hun land, die hen benoemen en ontslaan.

      Zij moeten de staat van Nederlander bezitten.

      2 De regering van het betrokken land bepaalt wie de Gevolmachtigde Minister bij belet of ontstentenis vervangt.

      Hetgeen in dit Statuut is bepaald voor de Gevolmachtigde Minister, is van overeenkomstige toepassing met betrekking
      tot zijn plaatsvervanger.
    url: https://wetten.overheid.nl/BWBR0002154/2017-11-17#Artikel8
  - number: '9'
    text: |-
      1 De Gevolmachtigde Minister legt, alvorens zijn betrekking te aanvaarden, in handen van de Gouverneur een eed
      of belofte van trouw aan de Koning en het Statuut af. Het formulier voor de eed of belofte wordt vastgesteld bij
      algemene maatregel van rijksbestuur.

      2 In Nederland vertoevende, legt de Gevolmachtigde Minister de eed of belofte af in handen van de Koning.
    url: https://wetten.overheid.nl/BWBR0002154/2017-11-17#Artikel9
  - number: '10'
    text: |-
      1 De Gevolmachtigde Minister neemt deel aan het overleg in de vergaderingen van de raad van ministers en van de
      vaste colleges en bijzondere commissies uit de raad over aangelegenheden van het Koninkrijk, welke het betrokken
      land raken.

      2 De regeringen van Aruba, Curaçao en Sint Maarten zijn ieder gerechtigd - indien een bepaald onderwerp haar
      daartoe aanleiding geeft - naast de Gevolmachtigde Minister tevens een minister met raadgevende stem te doen
      deelnemen aan het in het vorig lid bedoelde overleg.
    url: https://wetten.overheid.nl/BWBR0002154/2017-11-17#Artikel10
  - number: '11'
    text: |-
      1 Voorstellen tot verandering in de [Grondwet][ref1], houdende bepalingen betreffende aangelegenheden van het
      Koninkrijk, raken Aruba, Curaçao en Sint Maarten.

      2 Ten aanzien van de defensie wordt aangenomen, dat de defensie van het grondgebied van Aruba, Curaçao of Sint
      Maarten, zomede overeenkomsten of afspraken betreffende een gebied, dat tot hun belangensfeer behoort, Aruba,
      Curaçao onderscheidenlijk Sint Maarten raken.

      3 Ten aanzien van de buitenlandse betrekkingen wordt aangenomen, dat buitenlandse betrekkingen, wanneer belangen
      van Aruba, Curaçao of Sint Maarten in het bijzonder daarbij betrokken zijn, dan wel wanneer de voorziening daarin
      gewichtige gevolgen voor deze belangen kan hebben, Aruba, Curaçao onderscheidenlijk Sint Maarten raken.

      4 De vaststelling van de bijdrage in de kosten, bedoeld in [artikel 35][ref2], raakt Aruba, Curaçao
      onderscheidenlijk Sint Maarten.

      5 Voorstellen tot naturalisatie worden geacht Aruba, Curaçao en Sint Maarten slechts te raken, indien het personen
      betreft, die woonachtig zijn in het betrokken land.

      6 De regeringen van Aruba, Curaçao en Sint Maarten kunnen aangeven welke aangelegenheden van het Koninkrijk,
      behalve die, in het eerste tot en met het vierde lid genoemd, hun land raken.


      [ref1]: https://wetten.overheid.nl/BWBR0001840
      [ref2]: https://wetten.overheid.nl/BWBR0002154#Artikel35
    url: https://wetten.overheid.nl/BWBR0002154/2017-11-17#Artikel11
