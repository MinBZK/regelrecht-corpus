  - number: 3.11.1
    text: |-
      Een wijziging van gegevens als bedoeld in [artikel 3.14 van het besluit][ref1] wordt doorgegeven via een daartoe
      beschikbaar gesteld middel.


      [ref1]: https://wetten.overheid.nl/BWBR0035091#Artikel3
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel3.11
    references:
      - id: ref1
        bwb_id: BWBR0035091
        artikel: '3'
  - number: 3.11.2
    text: |-
      Bij een kennisgeving van een wijziging als bedoeld in het eerste wordt het registratienummer, bedoeld in
      [artikel 4.7, eerste lid, onder j, van het besluit][ref1], van degene op wie de wijziging betrekking heeft en de
      door te geven wijziging, dan wel wijzigingen, vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0035091#Artikel4
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel3.11
    references:
