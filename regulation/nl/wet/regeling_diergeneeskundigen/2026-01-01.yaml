preamble:
  text: |-
    Gelet op Richtlijn nr. 2005/36/EG van het Europees Parlement en de Raad van de Europese Unie van 7 september 2005
    betreffende de erkenning van beroepskwalificaties (PbEU 2005, L 255) en artikel 33 van de Algemene wet erkenning
    EG-beroepskwalificaties, de artikelen 1.1, eerste lid, derde gedachtestreepje, onder 3°, 7.7, 8.22, tweede lid, en
    8.36, vijfde lid, en 10.1, eerste lid, van de Wet dieren, de artikelen 3.1, derde lid, 3.4, derde lid, 3.6, derde
    en vierde lid, 3.16, 3.18, 4.4, 5.5 en 5.7, eerste en tweede lid, van het Besluit diergeneeskundigen en artikel 5.8
    van het Besluit diergeneesmiddelen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#ArtikelAanhef
articles:
  - number: 1.1.1
    text: |-
      In deze regeling wordt verstaan onder: - *besluit:* [Besluit diergeneeskundigen][ref1];
        - *betrokken staat:* betrokken staat als bedoeld in
      [artikel 1 van de Algemene wet erkenning EU-beroepskwalificaties][ref2];
        - *bevoegd gezag:* bestuur van de onderwijsinstelling;
        - *biobeveiligingsmaatregelen:* maatregelen als bedoeld in artikel 10, eerste lid, onderdeel b, van [verordening
      (EU) nr. 2016/429](32016R0429), ter bescherming van de bioveiligheid;
        - *bioveiligheidsplan:* een beschrijving van de te treffen biobeveiligingsmaatregelen en een analyse van de
      bioveiligheid waar deze maatregelen op gebaseerd zijn;
        - *commissie:* Commissie buitenslands gediplomeerde diergeneeskundigen;
        - *daartoe beschikbaar gesteld middel:* beschikbaar gesteld formulier als bedoeld in
      [artikel 4:4 van de Algemene wet bestuursrecht][ref3] of geopende elektronische weg als bedoeld in
      [artikel 2:15 van die wet][ref4];
        - *eindbeslissing:* schriftelijke uitspraak van het veterinair tuchtcollege of het veterinair beroepscollege
      waarmee: 1°. de bij het veterinair tuchtcollege of het veterinair beroepscollege ingediende klacht wordt afgedaan;
      2°. de behandeling van de klacht wordt gestaakt in verband met de intrekking van de klacht op of na de zitting;
      3°. de klager niet-ontvankelijk wordt verklaard; 4°. de klacht kennelijk ongegrond wordt verklaard; 5°. de zaak
      wordt afgehandeld na het intrekken van de klacht op grond van [artikel 8.23, tweede lid, van de wet][ref5]; 6°. een
      wrakingsverzoek wordt afgehandeld; 7°. een verschoningsverzoek wordt afgehandeld;
        - *leerplan dierfysiotherapie:* leerplan dierfysiotherapie, bedoeld in de bijlage bij deze regeling;
        - *migrerende beroepsbeoefenaar:* migrerende beroepsbeoefenaar als bedoeld in
      [artikel 1 van de Algemene wet erkenning EU-beroepskwalificaties][ref6];
        - *minister:* Minister van Landbouw, Visserij, Voedselzekerheid en Natuur;
        - *titel na een opleiding:* diploma, certificaat of andere titel die door een daartoe aangewezen bevoegde
      autoriteit van een betrokken staat is afgegeven ter afsluiting van een beroepsopleiding;
        - *Richtlijn nr. 2005/36/EG:* [Richtlijn nr. 2005/36/EG](32005L0036) van het Europees Parlement en de Raad van de
      Europese Unie van 7 september 2005 betreffende de erkenning van beroepskwalificaties (PbEU 2005, L 255);
        - *verordening (EU) nr. 2016/429:* [verordening (EU) 2016/429](32016R0429) van het Europees Parlement en de Raad
      van 9 maart 2016 betreffende overdraagbare dierziekten en tot wijziging en intrekking van bepaalde handelingen op
      het gebied van diergezondheid (‘diergezondheidswetgeving’) (PbEU 2016, L 84);
        - *verordening (EU) nr. 2019/2035:* gedelegeerde verordening (EU) 2019/2035 van de Commissie van 28 juni 2019 tot
      aanvulling van Verordening (EU) 2016/429 van het Europees Parlement en de Raad wat betreft regels voor inrichtingen
      waar landdieren worden gehouden en broederijen, alsmede voor de traceerbaarheid van bepaalde gehouden landdieren en
      broedeieren (PbEU 2019, L 314).


