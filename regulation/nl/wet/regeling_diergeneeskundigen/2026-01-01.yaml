    text: ten minste één jaar heeft gewerkt;
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel2.12
  - number: 2.12.b
    text: ten minste 3.000 eerste inseminaties bij runderen heeft uitgevoerd; en
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel2.12
  - number: 2.12.c
    text: ten minste 1.000 embryotransplantaties heeft uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel2.12
  - number: '2.13'
    text: |-
      Het certificaat, bedoeld in [artikel 1, derde lid, van de Regeling certificaten groen beroepsonderwijs][ref1], is
      een certificaat als bedoeld in [artikel 3.6, eerste lid, van het besluit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0032494#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0035091#Artikel3
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0032494
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0035091
        artikel: '3'
  - number: '3.1'
    text: |-
      Een aanvraag tot toelating als bedoeld in [artikel 3.13 van het besluit][ref1] door een persoon, bedoeld in de
      [artikelen 3.1, eerste lid][ref2], [3.4, eerste lid][ref3] of [3.6, eerste lid, van het besluit][ref4], wordt
      ingediend via een daartoe beschikbaar gesteld middel.


      [ref1]: https://wetten.overheid.nl/BWBR0035091#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0035091#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0035091#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0035091#Artikel3
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0035091
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0035091
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0035091
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0035091
        artikel: '3'
  - number: 3.2.1
    text: |-
      Een aanvraag als bedoeld in [artikel 3.1][ref1] omvat:


      [ref1]: https://wetten.overheid.nl/BWBR0035238#Artikel3
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0035238
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.2.1.a
    text: |-
      de gegevens, bedoeld in [artikel 4.7, eerste lid, onderdelen a tot en met i, van het besluit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0035091#Artikel4
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0035091
        artikel: '4'
  - number: 3.2.1.b
    text: gegevens betreffende de beroepsuitoefening, en
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel3.2
  - number: 3.2.1.c
    text: |-
      een bewijsstuk, dan wel bewijsstukken, waaruit blijkt dat degene die toelating aanvraagt voldoet
      aan de voorwaarden, bedoeld in de [artikelen 3.1, eerste lid][ref1], [3.4, eerste lid][ref2],
      [3.6, eerste lid, van het besluit][ref3], die aan de toelating worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0035091#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0035091#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0035091#Artikel3
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0035091
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0035091
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0035091
        artikel: '3'
  - number: 3.2.2
    text: |-
      Van een bewijsstuk als bedoeld in het eerste lid, onder c, kan een kopie worden verstrekt die is gewaarmerkt door
      het bevoegd gezag of een notaris.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel3.2
  - number: 3.3.1
    text: |-
      Onverminderd de bescheiden, bedoeld in [artikel 3.2][ref1], verstrekt een persoon als bedoeld in
      [artikel 3.1][ref2] die werkzaam is of is geweest in een ander land dan Nederland en die voornemens is zijn
      beroep in Nederland uit te oefenen of te hervatten, bij zijn aanvraag een document niet ouder dan drie maanden,
      waaruit blijkt dat ten aanzien van hem geen maatregel berustend op een in het buitenland gegeven rechterlijke,
      tuchtrechtelijke of bestuursrechtelijke beslissing van kracht is op grond waarvan hij zijn rechten tot het
      beroepsmatig verrichten van diergeneeskundige handelingen in het land waar de beslissing is gegeven, geheel of
      gedeeltelijk, tijdelijk of blijvend heeft verloren.


      [ref1]: https://wetten.overheid.nl/BWBR0035238#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0035238#Artikel3
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0035238
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0035238
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.3.2
    text: |-
      Indien het document, bedoeld in het eerste lid, niet wordt afgegeven door de bevoegde autoriteiten, wordt
      dit vervangen door een attest afgegeven door een bevoegde gerechtelijke autoriteit, een andere bevoegde
      overheidsautoriteit, een notaris of een bevoegde beroepsvereniging in het betreffende land waaruit blijkt dat
      betrokkene tegenover die instantie of functionaris onder ede, dan wel plechtig heeft verklaard dat ten aanzien van
      hem geen maatregel van kracht is als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel3.3
  - number: 3.3.3
    text: |-
      Van een document of attest, bedoeld in het eerste of tweede lid, wordt het originele exemplaar verstrekt dan wel
      een kopie daarvan die is gewaarmerkt door de instelling die het document of attest heeft afgegeven dan wel door
      een notaris.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel3.3
  - number: 3.3.4
    text: |-
      Voor zover betrokkene voldoende aannemelijk maakt dat hij redelijkerwijs niet in staat is een document of attest
      als bedoeld in het eerste of tweede lid, dan wel een kopie daarvan als bedoeld in het derde lid, te verstrekken,
      wordt hij in de gelegenheid gesteld een eigen verklaring over te leggen inhoudende dat tegen hem geen maatregel van
      kracht is als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel3.3
  - number: 3.3.5
    text: |-
      Het eerste tot en met vierde lid is onverkort van toepassing voor degene die eerder in het register, bedoeld in
      [artikel 4.3, eerste lid, van de wet][ref1] is geregistreerd en wiens registratie niet is doorgehaald.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel4
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '4'
  - number: 3.4.1
    text: |-
      Een aanvraag tot het verkrijgen van erkenning van beroepskwalificaties als bedoeld in de
      [Algemene wet erkenning EU-beroepskwalificaties][ref1] ten behoeve van de toelating tot het beroepsmatig verrichten
      van diergeneeskundige handelingen als bedoeld in [artikel 3.1, eerste lid][ref2], [3.4, eerste lid][ref3], en
      [3.6, eerste lid, van het besluit][ref4], door migrerende beroepsbeoefenaars wordt ingediend via een daartoe
      beschikbaar gesteld middel.


      [ref1]: https://wetten.overheid.nl/BWBR0023066
      [ref2]: https://wetten.overheid.nl/BWBR0035091#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0035091#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0035091#Artikel3
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0023066
      - id: ref2
        bwb_id: BWBR0035091
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0035091
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0035091
        artikel: '3'
  - number: 3.4.2
    text: |-
      Een aanvraag als bedoeld in het eerste lid wordt tevens aangemerkt als een aanvraag tot toelating als bedoeld in
      [artikel 3.13 van het besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035091#Artikel3
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0035091
        artikel: '3'
  - number: '3.5'
    text: |-
      Bij de aanvraag, bedoeld in [artikel 3.4, eerste lid][ref1], worden verstrekt:


      [ref1]: https://wetten.overheid.nl/BWBR0035238#Artikel3
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0035238
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 3.5.a
    text: |-
      de documenten, bedoeld in
      __REF000___________________________________________________________________________________________________________
      _;


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel13
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '13'
  - number: 3.5.b
    text: |-
      de gegevens, bedoeld in [artikel 3.2, onder a en b][ref1], en,


      [ref1]: https://wetten.overheid.nl/BWBR0035238#Artikel3
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0035238
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.5.c
    text: |-
      indien de aanvraag en de documenten, bedoeld in
      [artikel 13, eerste lid, onderdelen b, c en e, van de Algemene wet erkenning EU-beroepskwalificaties][ref1] in een
      andere dan de Nederlandse, Duitse of Engelse taal zijn gesteld, een door een beëdigde tolk of vertaler opgestelde
      vertaling daarvan in één van deze talen.


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel13
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '13'
  - number: 3.6.1
    text: |-
      Ingeval de minister op grond van [artikel 11 van de Algemene wet erkenning EU-beroepskwalificaties][ref1] een
      compenserende maatregel noodzakelijk acht en betrokkene een proeve van bekwaamheid gaat afleggen, informeert de
      minister hem over:


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel11
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '11'
  - number: 3.6.1.a
    text: de vakken waarop de proeve van bekwaamheid betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel3.6
  - number: 3.6.1.b
    text: de wijze waarop de proeve van bekwaamheid wordt afgenomen;
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel3.6
  - number: 3.6.1.c
    text: de kosten van de proeve.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel3.6
  - number: 3.6.2
    text: De minister stelt betrokkene zo spoedig mogelijk op de hoogte van het resultaat van de proeve van bekwaamheid.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel3.6
  - number: '3.7'
    text: |-
      Ingeval de minister op grond van [artikel 11 van de Algemene wet erkenning EU-beroepskwalificaties][ref1] een
      compenserende maatregel noodzakelijk acht en betrokkene een aanpassingsstage gaat afleggen, informeert de minister
      hem over:


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel11
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '11'
  - number: 3.7.a
    text: de vakken waarop de aanpassingsstage betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel3.7
  - number: 3.7.b
    text: de wijze waarop de aanpassingsstage wordt uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel3.7
  - number: 3.7.c
    text: de duur van de aanpassingsstage;
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel3.7
  - number: 3.7.d
    text: in voorkomend geval de aanvullende opleiding die deel uitmaakt van de aanpassingsstage.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel3.7
  - number: '3.8'
    text: |-
      Een aanvraag tot toelating tot het beroepsmatig verrichten van diergeneeskundige handelingen als bedoeld in
      [artikel 3.1, eerste lid][ref1], [3.4, eerste lid][ref2], en [3.6, eerste lid, van het besluit][ref3] door personen
      die geen beroep op de [Richtlijn 2005/36/EG](32005L0036) kunnen doen, wordt ingediend via een daartoe beschikbaar
      gesteld middel.


      [ref1]: https://wetten.overheid.nl/BWBR0035091#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0035091#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0035091#Artikel3
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0035091
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0035091
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0035091
        artikel: '3'
  - number: 3.9.1
    text: |-
      Bij een aanvraag tot toelating tot het beroepsmatig verrichten van diergeneeskundige handelingen als bedoeld in
      [artikel 3.1, eerste lid][ref1], [3.4, eerste lid][ref2], en [3.6, eerste lid, van het besluit][ref3] door een
      persoon als bedoeld in [artikel 3.8][ref4] worden de volgende gegevens en documenten verstrekt:


      [ref1]: https://wetten.overheid.nl/BWBR0035091#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0035091#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0035091#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0035238#Artikel3
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel3.9
    references:
      - id: ref1
        bwb_id: BWBR0035091
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0035091
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0035091
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0035238
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 3.9.1.a
    text: |-
      de gegevens, bedoeld in [artikel 3.2, eerste lid, onder a en b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0035238#Artikel3
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel3.9
    references:
      - id: ref1
        bwb_id: BWBR0035238
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.9.1.b
    text: een kopie van het deel van het paspoort dat de persoonsgegevens bevat;
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel3.9
  - number: 3.9.1.c
    text: |-
      het getuigschrift inzake het betreffende beroep dat door het in het land van herkomst daartoe bij of krachtens de
      [wet][ref1] bevoegd verklaarde gezag aan hem is afgegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0030250
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel3.9
    references:
      - id: ref1
        bwb_id: BWBR0030250
  - number: 3.9.1.d
    text: |-
      het programma van de opleiding tot het betreffende beroep, onderverdeeld in theorie- en praktijkvakken, met opgave
      van de duur van het onderwijs in die vakken, afkomstig van de instelling waarbij het getuigschrift is behaald;
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel3.9
  - number: 3.9.1.e
    text: cijferlijsten en beoordelingen van studieresultaten, praktijkperioden of -stages, en dergelijke;
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel3.9
  - number: 3.9.1.f
    text: |-
      indien in het land van herkomst een door een overheidsorgaan of een organisatie van beoefenaren van het
      desbetreffende beroep ingesteld register in stand wordt gehouden: een bewijs van inschrijving van hem in dat
      register, niet ouder dan zes maanden;
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel3.9
  - number: 3.9.1.g
    text: |-
      een document niet ouder dan drie maanden waaruit blijkt dat ten aanzien van hem geen maatregel berustend op een
      in het buitenland gegeven rechterlijke, tuchtrechtelijke of bestuursrechtelijke beslissing van kracht is op grond
      waarvan hij zijn rechten tot het beroepsmatig uitoefenen van diergeneeskundige handelingen in het land waar de
      beslissing is gegeven, geheel of gedeeltelijk, tijdelijk of blijvend heeft verloren;
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel3.9
  - number: 3.9.1.h
    text: bewijsstukken van eventuele beroepservaring.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel3.9
  - number: 3.9.2
    text: |-
      De documenten, bedoeld onder c tot en met h, zijn gesteld, dan wel door een beëdigd vertaler vertaald, in de
      Nederlandse, Engelse of Duitse taal. Van deze documenten kunnen kopieën worden verstrekt die zijn gewaarmerkt door
      de instelling die deze heeft afgegeven of door een notaris.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel3.9
  - number: 3.9.3
    text: |-
      Voor zover betrokkene voldoende aannemelijk maakt dat hij redelijkerwijs niet in staat is een document als bedoeld
      in het eerste lid, onder g, dan wel een kopie daarvan als bedoeld in het tweede lid, te verstrekken, wordt hij in
      de gelegenheid gesteld een eigen verklaring over te leggen inhoudende dat tegen hem geen maatregel van kracht is
      als bedoeld in het eerste lid, onder g.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel3.9
  - number: '3.10'
    text: |-
      De [artikelen 3.6][ref1] en [3.7][ref2] zijn van overeenkomstige toepassing ten aanzien van de aanvragen door
      personen als bedoeld in [artikel 3.8][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0035238#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0035238#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0035238#Artikel3
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel3.10
