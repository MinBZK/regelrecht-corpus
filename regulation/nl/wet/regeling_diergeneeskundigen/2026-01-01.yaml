  - number: 4.10.1.a
    text: |-
      de gegevens, bedoeld in [artikel 4.7, eerste lid, onderdelen a tot en met i, van het besluit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0035091#Artikel4
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel4.10
    references:
