  - number: '2.2'
    text: |-
      Een opleiding als bedoeld in [artikel 3.4, eerste lid, onderdeel b, van het besluit][ref1] geeft ten minste
      uitvoering aan het leerplan dierfysiotherapie, opgenomen in de bijlage bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0035091#Artikel3
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0035091
        artikel: '3'
  - number: 2.3.1
    text: Het bevoegd gezag van een opleiding stelt een examencommissie in.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel2.3
  - number: 2.3.2
    text: 'De examencommissie bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel2.3
  - number: 2.3.2.a
    text: de directeur van de opleiding;
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel2.3
  - number: 2.3.2.b
    text: |-
      de door het bevoegd gezag, na overleg met de directie, aan te wijzen docenten die belast zijn met de verzorging van
      het onderwijs in de dierfysiotherapeutische vakken, en
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel2.3
  - number: 2.3.2.c
    text: een stagebegeleider.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel2.3
  - number: 2.3.3
    text: Het bevoegd gezag van een opleiding benoemt uit de leden van de examencommissie een voorzitter.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel2.3
  - number: 2.3.4
    text: |-
      De examencommissie is belast met de zorg voor de organisatie van het examen en een goede gang van zaken tijdens het
      examen, waaronder in ieder geval wordt verstaan:
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel2.3
  - number: 2.3.4.a
    text: |-
      het bepalen van de data en tijdstippen voor het afleggen van de onderdelen van het examen en bekendmaking daarvan
      aan de kandidaten;
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel2.3
  - number: 2.3.4.b
    text: het afnemen van het examen, en
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel2.3
  - number: 2.3.4.c
    text: het vaststellen van de uitslag van het examen.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel2.3
  - number: 2.3.5
    text: De examencommissie wijst examinatoren aan die zijn belast met het afnemen van de onderdelen van het examen.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel2.3
  - number: 2.3.6
    text: |-
      De examencommissie besluit bij meerderheid van stemmen. Bij het staken van de stemmen geeft de stem van de
      voorzitter de doorslag.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel2.3
  - number: 2.4.1
    text: |-
      Het bevoegd gezag kan één of meer deskundigen aanwijzen, welke niet aan de school zijn verbonden, die mede het
      examen afnemen.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel2.4
  - number: 2.4.2
    text: De aanwijzing, bedoeld in het eerste lid, geschiedt voor een bepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel2.4
  - number: 2.5.1
    text: De minister kan ten behoeve van het examen gecommitteerden aanwijzen.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel2.5
  - number: 2.5.2
    text: |-
      Gecommitteerden hebben tot taak zich een oordeel te vormen over het niveau van het examen, de gang van zaken
      tijdens het examen en de naleving van de bij deze regeling gegeven voorschriften.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel2.5
  - number: 2.5.3
    text: |-
      Gecommitteerden kunnen het afnemen van examenonderdelen bijwonen en kennis nemen van het schriftelijk werk van
      de kandidaten.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel2.5
  - number: 2.5.4
    text: |-
      De leden van de examencommissie, bedoeld in [artikel 2.3, eerste lid][ref1], het bevoegd gezag van een opleiding en
      de deskundigen, bedoeld in [artikel 2.4, eerste lid][ref2], verschaffen de gecommitteerden de inlichtingen die zij
      voor hun taak nodig hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0035238#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0035238#Artikel2
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0035238
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0035238
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.5.5
    text: |-
      De gecommitteerden brengen aan de minister verslag uit van hun bevindingen. Een afschrift van het verslag wordt
      toegezonden aan het bevoegd gezag van de opleiding waarvan het examen is onderzocht.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel2.5
  - number: '2.6'
    text: |-
      Tot het examen, bedoeld in [artikel 3.4, eerste lid, onderdeel c, van het besluit][ref1], wordt toegelaten degene
      die:


      [ref1]: https://wetten.overheid.nl/BWBR0035091#Artikel3
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0035091
        artikel: '3'
  - number: 2.6.a
    text: voldaan heeft aan de eisen gesteld in het leerplan dierfysiotherapie, en
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel2.6
  - number: 2.6.b
    text: de stage, bedoeld in het leerplan dierfysiotherapie, met de beoordeling goed of voldoende heeft afgerond.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel2.6
  - number: 2.7.1
    text: De stage, bedoeld in het leerplan dierfysiotherapie, wordt door de stagebegeleider van de kandidaat beoordeeld.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel2.7
  - number: 2.7.2
    text: |-
      De stagebegeleider drukt zijn beoordeling van kennis, vaardigheid, beroepshouding en inzicht van de kandidaat uit
      in één van de volgende beoordelingen:
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel2.7
  - number: 2.7.2.a
    text: goed;
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel2.7
  - number: 2.7.2.b
    text: voldoende;
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel2.7
  - number: 2.7.2.c
    text: onvoldoende.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel2.7
  - number: 2.8.1
    text: |-
      Het examen, bedoeld in [artikel 3.4, eerste lid, onderdeel c, van het besluit][ref1], bestaat uit de volgende
      onderdelen:


      [ref1]: https://wetten.overheid.nl/BWBR0035091#Artikel3
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel2.8
    references:
      - id: ref1
        bwb_id: BWBR0035091
        artikel: '3'
  - number: 2.8.1.a
    text: onderzoek en behandeling van pathologische afwijkingen bij een paard, en
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel2.8
  - number: 2.8.1.b
    text: onderzoek en behandeling van pathologische afwijkingen bij een hond.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel2.8
  - number: 2.8.2
    text: Ieder examenonderdeel wordt door ten minste twee examinatoren beoordeeld.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel2.8
  - number: 2.8.3
    text: |-
      De examinatoren drukken hun beoordeling van kennis, vaardigheid, beroepshouding en inzicht van de kandidaat in het
      examenonderdeel onafhankelijk van elkaar uit in een cijfer van 1 tot en met 10, in de vorm van gehele cijfers.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel2.8
  - number: 2.8.4
    text: |-
      De eindcijfers van de examenonderdelen worden door de examinatoren in onderling overleg vastgesteld. Indien de
      examinatoren niet tot overeenstemming kunnen komen, beslist de voorzitter van de examencommissie.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel2.8
  - number: 2.8.5
    text: |-
      Nadat de uitslag van alle examenonderdelen is vastgesteld, wordt de uitslag van het examen vastgesteld door de
      examencommissie.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel2.8
  - number: 2.8.6
    text: |-
      De examencommissie draagt er zorg voor dat het ten behoeve van het behalen van de opleiding gemaakte schriftelijke
      werk gedurende een jaar na afloop van het laatste examenonderdeel ter inzage voor de kandidaat ter beschikking
      blijft.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel2.8
  - number: 2.9.1
    text: |-
      De examencommissie deelt een kandidaat zo spoedig mogelijk, doch uiterlijk binnen vier
      weken nadat het laatste examenonderdeel is afgelegd, de uitslag van het examen, bedoeld in
      [artikel 3.4, eerste lid, onderdeel c, van het besluit][ref1], mee.


      [ref1]: https://wetten.overheid.nl/BWBR0035091#Artikel3
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0035091
        artikel: '3'
  - number: 2.9.2
    text: |-
      Een kandidaat is geslaagd indien de examenonderdelen, genoemd in [artikel 2.8, eerste lid][ref1], ten minste met
      een cijfer 6 zijn beoordeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0035238#Artikel2
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0035238
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.9.3
    text: |-
      Een kandidaat heeft recht op een herexamen indien één van de examenonderdelen, genoemd in
      [artikel 2.8, eerste lid][ref1], met een cijfer 5 en het andere examenonderdeel met ten minste het cijfer 6 is
      beoordeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0035238#Artikel2
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0035238
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.9.4
    text: In alle andere gevallen is de kandidaat gezakt.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel2.9
  - number: '2.10'
    text: |-
      De [artikelen 7.60 tot en met 7.63 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] zijn van
      overeenkomstige toepassing op de beoordeling van de stage, de beoordeling van de examenonderdelen en de uitslag van
      het examen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 2.11.1
    text: |-
      De kwalificatie van embryotransplanteur of embryotransplanteur/-winner, bedoeld in
      [artikel 3.6, eerste lid, van het besluit][ref1] heeft ten minste betrekking op de volgende onderwerpen:


      [ref1]: https://wetten.overheid.nl/BWBR0035091#Artikel3
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel2.11
    references:
      - id: ref1
        bwb_id: BWBR0035091
        artikel: '3'
  - number: 2.11.1.a
    text: verzorgen van kunstmatige inseminatie;
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel2.11
  - number: 2.11.1.b
    text: verzorgen van spermawinning;
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel2.11
  - number: 2.11.1.c
    text: adviseren over vruchtbaarheid en voortplanting, en
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel2.11
  - number: 2.11.1.d
    text: verzorgen van embryotransplantatie.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel2.11
  - number: 2.11.2
    text: |-
      De kwalificatie van embryotransplanteur of embryotransplanteur/-winner, bedoeld in
      [artikel 3.6, eerste lid, van het besluit][ref1] heeft ten minste betrekking op de volgende onderwerpen:


      [ref1]: https://wetten.overheid.nl/BWBR0035091#Artikel3
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel2.11
    references:
