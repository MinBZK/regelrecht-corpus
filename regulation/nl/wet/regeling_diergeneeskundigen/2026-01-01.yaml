  - number: 2.11.3
    text: |-
      Voor de toelating tot embryotransplanteur of embryotransplaneur/-winner zijn in ieder geval de in het eerste
      onderscheidenlijk tweede lid genoemde onderdelen van de kwalificatie behaald.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel2.11
  - number: '2.12'
    text: |-
      Degene die de kwalificatie van embryotransplanteur of embryotransplanteur/-winner, bedoeld in
      [artikel 3.6, eerste lid, van het besluit][ref1] wenst te behalen, toont aan ten genoegen van de examencommissie,
      bedoeld in [artikel 7.4.5 van de Wet educatie en beroepsonderwijs][ref2], dat hij onder verantwoordelijkheid van
      een gekwalificeerd embryotransplanteur of embryotransplanteur/-winner:


      [ref1]: https://wetten.overheid.nl/BWBR0035091#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel2.12
    references:
