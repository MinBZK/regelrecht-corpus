  - number: '3.13'
    text: |-
      Aanvragen, bedoeld in dit hoofdstuk, worden ondertekend of zijn, voor zover de aanvraag wordt
      gedaan langs elektronische weg, voorzien van een elektronische handtekening als bedoeld in
      [artikel 20a, eerste lid, van de Dienstenregeling centraal loket en interne markt informatiesysteem][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0026766#Artikel20a
