        artikel: '23'
  - number: 3.12.2
    text: |-
      Dienstverrichters als bedoeld in het eerste lid zijn toegelaten tot het verrichten van diergeneeskundige
      handelingen als bedoeld in [artikel 4.1, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel4
