        bwb_id: BWBR0035091
        artikel: '4'
  - number: 3.11.3
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing voor de migrerende beroepsbeoefenaar die een erkenning
      van beroepskwalificaties als bedoeld in de [Algemene wet erkenning EU-beroepskwalificaties][ref1] is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0023066
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel3.11
    references:
      - id: ref1
        bwb_id: BWBR0023066
  - number: 3.12.1
    text: |-
      Voor het verrichten van diergeneeskundige handelingen door diergeneeskundigen
      als bedoeld in de [artikelen 3.1, eerste lid][ref1], [3.4, eerste lid][ref2], en
      [3.6, eerste lid, van het besluit][ref3] verstrekt een dienstverrichter als bedoeld in
      [artikel 21 van de Algemene wet erkenning EU-beroepskwalificaties][ref4] voorafgaand aan de eerste
      dienstverrichting in Nederland via een daartoe beschikbaar gesteld middel de documenten, bedoeld in
      __REF004___________________________________________________________________________________________________________
      ___________.


      [ref1]: https://wetten.overheid.nl/BWBR0035091#Artikel3
