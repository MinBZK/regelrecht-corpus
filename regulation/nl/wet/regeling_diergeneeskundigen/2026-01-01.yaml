        artikel: '6'
        hoofdstuk: '6'
  - number: 6.3.3
    text: |-
      Aan personen als bedoeld in de [artikelen 6.1, tweede lid][ref1], en [6.2, tweede lid][ref2], tegen wie op of na
      de zitting een wrakingsverzoek wordt ingediend, wordt een vergoeding toegekend van € 80 indien het wrakingsverzoek
      wordt toegewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0035238#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0035238#Artikel6
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel6.3
