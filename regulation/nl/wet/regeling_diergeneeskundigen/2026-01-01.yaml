  - number: 4.10.1.b
    text: gegevens betreffende de beroepsuitoefening, en
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel4.10
  - number: 4.10.1.c
    text: |-
      de door een betrokken staat verleende titel na een opleiding op het gebied van de diergeneeskunde die voldoet aan
      de eisen in [artikel 4.5][ref1], dan wel de [artikelen 4.6][ref2], [4.7][ref3] of [4.8][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0035238#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0035238#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0035238#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0035238#Artikel4
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel4.10
