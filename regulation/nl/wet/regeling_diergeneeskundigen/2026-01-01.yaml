  - number: '4.1'
    text: |-
      Een aanvraag tot registratie als bedoeld in [artikel 4.1 van het besluit][ref1] door een dierenarts die in
      Nederland zijn opleiding heeft genoten, wordt ingediend via een daartoe beschikbaar gesteld middel.


      [ref1]: https://wetten.overheid.nl/BWBR0035091#Artikel4
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0035091
        artikel: '4'
  - number: 4.2.1
    text: |-
      Een aanvraag als bedoeld in [artikel 4.1][ref1], omvat:


      [ref1]: https://wetten.overheid.nl/BWBR0035238#Artikel4
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0035238
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.2.1.a
    text: |-
      de gegevens, bedoeld in [artikel 4.7, eerste lid, onderdelen a tot en met i, van het besluit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0035091#Artikel4
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0035091
        artikel: '4'
  - number: 4.2.1.b
    text: gegevens betreffende de beroepsuitoefening, en
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel4.2
  - number: 4.2.1.c
    text: |-
      het origineel getuigschrift waaruit blijkt dat aan de degene die de registratie aanvraagt op grond van het
      afleggen van een examen van een opleiding in het wetenschappelijk onderwijs door een universiteit dan wel de Open
      Universiteit waarop de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] betrekking heeft, de graad
      Master op het gebied van de diergeneeskunde is verleend of het getuigschrift waaruit blijkt dat hij het afsluitend
      examen van de opleiding diergeneeskunde, bedoeld in de Wet op het hoger onderwijs en wetenschappelijk onderzoek,
      met goed gevolg heeft afgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: 4.2.2
    text: |-
      Van een bewijsstuk als bedoeld in het tweede lid, onder c, kan een kopie worden verstrekt die is gewaarmerkt door
      het bevoegd gezag of door een notaris.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel4.2
  - number: 4.3.1
    text: |-
      In afwijking van [artikel 4.2, eerste lid, onder c][ref1], kan bij de aanvraag tot registratie als bedoeld in
      [artikel 4.1 van het besluit][ref2] een verklaring van het bevoegd gezag worden verstrekt dat betrokkene de
      opleiding met goed gevolg heeft afgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0035238#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0035091#Artikel4
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0035238
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0035091
        artikel: '4'
  - number: 4.3.2
    text: |-
      De registratie wordt doorgehaald indien betrokkene niet binnen drie maanden na registratie alsnog het origineel
      getuigschrift of bewijsstukken daarvan als bedoeld in [artikel 4.2, eerste lid][ref1], dan wel een kopie daarvan
      als bedoeld in artikel 4.2, tweede lid, heeft verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0035238#Artikel4
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0035238
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '4.4'
    text: |-
      [Artikel 3.3][ref1] is van overeenkomstige toepassing voor de dierenarts die zijn opleiding in Nederland heeft
      genoten en die werkzaam is of is geweest in een ander land dan Nederland en voornemens is zijn beroep in Nederland
      uit te oefenen of te hervatten.


      [ref1]: https://wetten.overheid.nl/BWBR0035238#Artikel3
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0035238
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '4.5'
    text: |-
      De titel na een opleiding op het gebied van de diergeneeskunde, bedoeld in
      [artikel 1.1, eerste lid, derde gedachtestreepje, onder 3°, van de wet][ref1] voldoet aan artikel 21, eerste lid,
      in samenhang met artikel 38 en bijlage V, onder 5.4.2, van [Richtlijn nr. 2005/36/EG](32005L0036).


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel1
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '1'
  - number: '4.6'
    text: |-
      Indien de titel na een opleiding op het gebied van de diergeneeskunde, bedoeld in [artikel 4.5][ref1], niet voldoet
      aan de benaming, genoemd in bijlage V, onder 5.4.2, van [Richtlijn nr. 2005/36/EG](32005L0036), gaat de titel
      vergezeld van een verklaring, afgegeven door de bevoegde autoriteit in de desbetreffende betrokken staat waarin
      wordt bevestigd dat de titel:


      [ref1]: https://wetten.overheid.nl/BWBR0035238#Artikel4
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0035238
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.6.a
    text: |-
      is afgegeven ter afsluiting van een opleiding die in overeenstemming is met de voorschriften van artikel 38 van
      [Richtlijn nr. 2005/36/EG](32005L0036), en
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel4.6
  - number: 4.6.b
    text: |-
      door de bevoegde autoriteit van de desbetreffende betrokken staat gelijk wordt gesteld aan de titel,
      onderscheidenlijk de titels waarvan de benamingen is, onderscheidenlijk zijn opgenomen in bijlage V, onder 5.4.2,
      van [Richtlijn nr. 2005/36/EG](32005L0036).
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel4.6
  - number: 4.7.1
    text: |-
      Indien de titel na een opleiding op het gebied van de diergeneeskunde, bedoeld in [artikel 4.5][ref1], niet voldoet
      aan de eisen, bedoeld in artikel 38 van [Richtlijn nr. 2005/36/EG](32005L0036), en is afgegeven ter afsluiting
      van een opleiding die is begonnen voor de referentiedatum, genoemd in bijlage V, onder 5.4.2, van [Richtlijn nr.
      2005/36/EG](32005L0036), gaat de titel vergezeld van een verklaring, afgegeven door de bevoegde autoriteit in de
      desbetreffende betrokken staat waarin wordt bevestigd dat de bezitter van de titel de werkzaamheden van dierenarts
      gedurende ten minste drie opeenvolgende jaren tijdens de vijf jaren voorafgaande aan de afgifte van de verklaring
      daadwerkelijk en op wettige wijze heeft uitgeoefend.


      [ref1]: https://wetten.overheid.nl/BWBR0035238#Artikel4
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0035238
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.7.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing op een titel na een opleiding op het gebied van de diergeneeskunde
      als bedoeld in het eerste lid die is afgegeven door de bevoegde autoriteit op het grondgebied van de voormalige
      Duitse Democratische Republiek ter afsluiting van een opleiding, welke is begonnen voor 3 oktober 1990.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel4.7
  - number: 4.8.1
    text: |-
      Indien de titel na een opleiding op het gebied van de diergeneeskunde, bedoeld in [artikel 4.5][ref1], is
      afgegeven:


      [ref1]: https://wetten.overheid.nl/BWBR0035238#Artikel4
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel4.8
    references:
      - id: ref1
        bwb_id: BWBR0035238
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.8.1.a
    text: |-
      door de bevoegde autoriteit van het voormalige Tsjecho-Slowakije, of ter verwerving waarvan de opleiding voor
      1 januari 1993 is begonnen, voor zover het de Tsjechische Republiek of Slowakije betreft;
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel4.8
  - number: 4.8.1.b
    text: |-
      door de bevoegde autoriteit van de voormalige Sovjet-Unie, of ter verwerving waarvan de opleiding voor 20 augustus
      1991 is begonnen, voor zover het Estland betreft;
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel4.8
  - number: 4.8.1.c
    text: |-
      door de bevoegde autoriteit van de voormalige Sovjet-Unie, of ter verwerving waarvan de opleiding voor 21 augustus
      1991 is begonnen, voor zover het Letland betreft;
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel4.8
  - number: 4.8.1.d
    text: |-
      door de bevoegde autoriteit van de voormalige Sovjet-Unie, of ter verwerving waarvan de opleiding voor 11 maart
      1990 is begonnen, voor zover het Litouwen betreft;
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel4.8
  - number: 4.8.1.e
    text: |-
      door de bevoegde autoriteit van het voormalige Joegoslavië, of ter verwerving waarvan de opleiding voor 25 juni
      1991 is begonnen, voor zover het Slovenië betreft;
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel4.8
  - number: 4.8.1.f
    text: |-
      door de bevoegde autoriteit van het voormalige Joegoslavië, of ter verwerving waarvan de opleiding voor 8 oktober
      1991 is begonnen, voor zover het Kroatië betreft;
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel4.8
  - number: 4.8.2
    text: |-
      De titel gaat vergezeld van een verklaring, afgeven door de bevoegde autoriteit in de desbetreffende betrokken
      staat waarin wordt bevestigd dat:
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel4.8
  - number: 4.8.2.a
    text: |-
      de titel op het grondgebied van de betrokken staat dezelfde rechtsgeldigheid heeft als titels na een opleiding op
      het gebied van de diergeneeskunde die door de bevoegde autoriteit van de betrokken staat worden afgegeven, en
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel4.8
  - number: 4.8.2.b
    text: |-
      de bezitter van de titel de werkzaamheden van dierenarts gedurende ten minste drie opeenvolgende jaren tijdens de
      vijf jaren voorafgaande aan de afgifte van de verklaring daadwerkelijk en op wettige wijze heeft uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel4.8
  - number: 4.8.3
    text: |-
      Voor zover het Estland betreft wordt, in afwijking van het tweede lid, onderdeel b, in de verklaring bevestigd dat
      de bezitter van de titel de werkzaamheden van dierenarts gedurende ten minste vijf opeenvolgende jaren tijdens de
      zeven jaren voorafgaande aan de afgifte van de verklaring daadwerkelijk en op wettige wijze heeft uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel4.8
  - number: '4.9'
    text: |-
      Een aanvraag tot registratie door dierenartsen wier opleiding voldoet aan [artikel 4.5][ref1], dan wel ten aanzien
      van wie een uitzondering als bedoeld in de [artikelen 4.6][ref2], [4.7][ref3] of [4.8][ref4] van toepassing is,
      wordt ingediend via een daartoe beschikbaar gesteld middel.


      [ref1]: https://wetten.overheid.nl/BWBR0035238#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0035238#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0035238#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0035238#Artikel4
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel4.9
