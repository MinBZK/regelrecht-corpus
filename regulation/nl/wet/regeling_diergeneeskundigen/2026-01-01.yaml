  - number: 4.18a.1
    text: |-
      De commissie bestaat uit een voorzitter, tevens lid, alsmede uit tenminste twee leden-deskundigen per
      diergeneeskundig beroep. De leden-deskundigen zijn deskundig ter zake van de opleiding tot het desbetreffende
      beroep of ter zake van de uitoefening van dat beroep.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel4.18a
  - number: 4.18a.2
    text: 'De diergeneeskundige beroepen, bedoeld in het eerste lid, zijn:'
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel4.18a
  - number: 4.18a.2.a
    text: dierenartsen;
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel4.18a
  - number: 4.18a.2.b
    text: dierenartsassistenten paraveterinair;
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel4.18a
  - number: 4.18a.2.c
    text: dierenfysiotherapeuten; en
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel4.18a
  - number: 4.18a.2.d
    text: embryotransplanteurs/-winners.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel4.18a
  - number: 4.18a.3
    text: De Minister benoemt en ontslaat de voorzitter en de andere leden van de commissie.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel4.18a
  - number: 4.18a.4
    text: |-
      De leden worden voor een periode van vier jaar benoemd, na afloop waarvan zij één maal voor een periode van
      maximaal vier jaar kunnen worden herbenoemd. De zittingsduur van een tussentijds benoemd lid eindigt op het
      tijdstip waarop de zittingsduur van degene in wiens plaats hij is benoemd, eindigt.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel4.18a
  - number: 4.18a.5
    text: |-
      De leden, bedoeld in het eerste lid, tweede volzin, worden niet benoemd dan nadat de Minister een organisatie
      die naar zijn oordeel voldoende representatief is voor de instellingen die opleiden tot het desbetreffende beroep
      onderscheidenlijk voor de beoefenaren van dat beroep, heeft uitgenodigd binnen een door hem aan te geven termijn
      een voordracht tot benoeming te doen en deze voordracht is gedaan, onderscheidenlijk de termijn voor het doen van
      een voordracht is verstreken.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel4.18a
  - number: 4.18a.6
    text: |-
      De Minister benoemt voor de voorzitter en voor elk van de andere leden een plaatsvervanger. Zij worden door de
      Minister ontslagen.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel4.18a
  - number: 4.18a.7
    text: |-
      De voorzitter, de leden en plaatsvervangende leden kunnen op eigen verzoek of wegens ongeschiktheid, onbekwaamheid
      of op andere zwaarwegende gronden door de Minister worden geschorst of ontslagen.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel4.18a
  - number: 4.18a.8
    text: De Minister kan één of meer ambtenaren aanwijzen als adviserend lid van de commissie.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel4.18a
  - number: 4.18a.9
    text: De Minister voorziet in een secretariaat van de commissie.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel4.18a
  - number: 4.19a
    text: Een advies van de commissie bevat de gronden waarop het berust.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel4.19a
  - number: 4.20a.1
    text: |-
      De commissie stelt haar eigen werkwijze vast met inachtneming van het bepaalde in de Algemene wet erkenning EU-
      beroepskwalificaties en in de [hoofstukken 2][ref1], [3][ref2] en [4][ref3] van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0035238#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0035238#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0035238#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel4.20a
    references:
      - id: ref1
        bwb_id: BWBR0035238
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0035238
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0035238
        hoofdstuk: '4'
  - number: 4.20a.2
    text: De commissie kan externe deskundigen raadplegen.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel4.20a
  - number: 4.20a.3
    text: |-
      De commissie beraadslaagt en brengt advies uit in de overeenkomstig [artikel 4.18A, eerste lid][ref1], voor het
      desbetreffende beroep bedoelde samenstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0035238#Artikel4
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel4.20a
    references:
      - id: ref1
        bwb_id: BWBR0035238
        artikel: '4'
        hoofdstuk: 4a
  - number: 4.21a
    text: |-
      Op de werkzaamheden van de voorzitter en de leden is het [Besluit vergoedingen adviescolleges en commissies][ref1]
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0025279
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel4.21a
    references:
      - id: ref1
        bwb_id: BWBR0025279
  - number: '5.1'
    text: |-
      Indien een diergeneesmiddel een stof bevat als bedoeld in bijlage II bij [Richtlijn 96/22/EG](31996L0022), waarvan
      toepassing is toegestaan op grond van artikel 4 van die richtlijn, verstrekt de dierenarts aan de houder de
      volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel5.1
  - number: 5.1.a
    text: het doel van de behandeling; en
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel5.1
  - number: 5.1.b
    text: de wijze van toediening van het diergeneesmiddel.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel5.1
  - number: '5.2'
    text: |-
      Een dierenarts die een voorschriftplichtig diergeneesmiddel zelf toepast, verstrekt aan de houder van een
      voedselproducerend dier de gegevens, bedoeld in artikel 108, tweede lid, van [verordening (EU) nr. 2019/6]
      (31906R2019).
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel5.2
  - number: 5.8.1
    text: |-
      Diergeneesmiddelen die werkzame stoffen bevatten behorende tot de groep van derde en vierde generatie
      cefalosporinen en fluoroquinolonen en geneesmiddelen waarvoor een handelsvergunning als bedoeld in
      [artikel 40, eerste lid, van de Geneesmiddelenwet][ref1] is verleend en welke een antimicrobiële werking bezitten,
      worden aangewezen als diergeneesmiddelen, bedoeld in [artikel 5.7, eerste lid, van het besluit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0035091#Artikel5
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel5.8
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '40'
      - id: ref2
        bwb_id: BWBR0035091
        artikel: '5'
  - number: 5.8.2
    text: |-
      De gevoeligheidsbepaling wordt uitgevoerd in overeenstemming met de eisen die ingevolge de geldende goede
      veterinaire praktijken, waaronder gidsen voor goede praktijken als bedoeld in [artikel 8.44 van de wet][ref1], aan
      een betrouwbare gevoeligheidsbepaling worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel8
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel5.8
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '8'
  - number: '5.9'
    text: |-
      In deze paragraaf wordt verstaan onder: - *EAN-code:* European Article Numbering code;
        - *kalf:* rund dat bestemd is voor de productie van vlees en dat ouder is dan veertien dagen en niet ouder is dan
      twaalf maanden;
        - *konijn:* konijn dat bestemd is voor de fokkerij of de productie van vlees;
        - *koppel:* groep dieren met dezelfde gezondheidsstatus die in dezelfde stal of binnen dezelfde ruimte worden
      geplaatst of gehouden en die een epidemiologische eenheid vormen;
        - *rund:* rund dat bestemd is voor de productie van melk of vlees, niet zijnde een kalf.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel5.9
  - number: '5.10'
    text: |-
      De melding, bedoeld in [artikel 5.8, eerste lid, van het besluit][ref1], wordt gedaan van het voorschrijven ten
      behoeve van de aflevering van antimicrobiële diergeneesmiddelen voor toepassing bij en van de toepassing van
      antimicrobiële diergeneesmiddelen bij:


      [ref1]: https://wetten.overheid.nl/BWBR0035091#Artikel5
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel5.10
    references:
      - id: ref1
        bwb_id: BWBR0035091
        artikel: '5'
  - number: 5.10.a
    text: |-
      kippen of kalkoenen, indien de houder van deze dieren 250 of meer kippen of kalkoenen houdt ten behoeve van de
      productie van vlees, consumptie-eieren of broedeieren;
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel5.10
  - number: 5.10.b
    text: runderen, indien de houder van deze dieren 5 of meer runderen houdt ten behoeve van de productie van melk of vlees;
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel5.10
  - number: 5.10.c
    text: kalveren, indien de houder van deze dieren 5 of meer kalveren houdt ten behoeve van de productie van vlees;
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel5.10
  - number: 5.10.d
    text: varkens, indien de houder van deze dieren 5 of meer varkens houdt ten behoeve van de productie van vlees;
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel5.10
  - number: 5.10.e
    text: |-
      konijnen, indien de houder van deze dieren 250 of meer konijnen houdt ten behoeve van de fokkerij of de productie
      van vlees;
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel5.10
  - number: 5.10.f
    text: |-
      geiten, indien de houder van deze dieren 25 of meer geiten houdt ten behoeve van de fokkerij of de productie van
      melk of vlees.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel5.10
  - number: 5.11.1
    text: |-
      Bij de melding, bedoeld in [artikel 5.8, eerste lid, van het besluit][ref1], worden de volgende gegevens verstrekt:


      [ref1]: https://wetten.overheid.nl/BWBR0035091#Artikel5
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel5.11
    references:
      - id: ref1
        bwb_id: BWBR0035091
        artikel: '5'
  - number: 5.11.1.a
    text: |-
      de naam van de dierenarts of een andere persoon als bedoeld in [artikel 4.1, eerste lid, van de wet][ref1], die het
      diergeneesmiddel heeft afgeleverd of toegepast en het nummer waaronder hij is opgenomen in het register, bedoeld in
      [artikel 4.3, eerste lid, van de wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel4
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel5.11
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0030250
        artikel: '4'
  - number: 5.11.1.b
    text: |-
      de naam en het adres van de houder van dieren aan wie het diergeneesmiddel is afgeleverd of bij wiens dieren
      het diergeneesmiddel is toegepast en het unieke registratienummer, bedoeld in artikel 93, slot, van verordening
      (EU) nr. 2016/429, of het unieke erkenningsnummer, bedoeld in artikel 2, onderdeel 16, van verordening (EU) nr.
      2019/2035, dat aan de inrichting waarop de dieren worden gehouden is toegekend, dat aan hem is toegekend;
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel5.11
  - number: 5.11.1.c
    text: de datum van aflevering of toepassing van het diergeneesmiddel;
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel5.11
  - number: 5.11.1.d
    text: de naam en het registratienummer van het diergeneesmiddel;
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel5.11
  - number: 5.11.1.e
    text: indien beschikbaar, de EAN-code van het diergeneesmiddel;
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel5.11
  - number: 5.11.1.f
    text: de afgeleverde of toegepaste hoeveelheid van het diergeneesmiddel;
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel5.11
  - number: 5.11.1.g
    text: |-
      de diersoort, diercategorie, subcategorie en leeftijdscategorie, ten behoeve waarvan het diergeneesmiddel is
      afgeleverd of waarbij het diergeneesmiddel is toegepast.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel5.11
  - number: 5.11.2
    text: |-
      Indien de melding wordt gedaan ten aanzien van een diergeneesmiddel dat bij kippen of kalkoenen wordt toegepast,
      worden per koppel tevens de volgende gegevens verstrekt:
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel5.11
  - number: 5.11.2.a
    text: |-
      het unieke subregistratienummer, bedoeld in [artikel 5a.1, derde lid, van de Regeling houders van dieren]
      (onbekend), dat aan de inrichting is toegekend voor het doel waarvoor het koppel wordt gehouden;
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel5.11
  - number: 5.11.2.b
    text: de aanduiding van de stal waarin het koppel wordt gehouden;
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel5.11
  - number: 5.11.2.c
    text: de indruk van de gezondheidssituatie van de dieren;
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel5.11
  - number: 5.11.2.d
    text: de klinische diagnose.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel5.11
  - number: 5.12.1
    text: |-
      De dierenarts of een andere persoon als bedoeld in [artikel 4.1, eerste lid, van de wet][ref1], doet de
      melding, bedoeld in [artikel 5.8, eerste lid, van het besluit][ref2], binnen twee weken na de dag waarop hij het
      diergeneesmiddel heeft afgeleverd of toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0035091#Artikel5
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel5.12
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0035091
        artikel: '5'
  - number: 5.12.2
    text: |-
      Indien het diergeneesmiddel wordt toegepast bij kalkoenen, wordt de melding, in afwijking van het eerste lid,
      gedaan binnen twee weken na afvoer van de dieren van de locatie waar de dieren worden gehouden.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel5.12
  - number: '5.13'
    text: |-
      Een dierenarts stelt het bedrijfsgezondheidsplan en het bedrijfsbehandelplan, bedoeld in
      [artikel 5.9, eerste lid, van het besluit][ref1], op op basis van de specifieke situatie op het bedrijf van de
      houder, bedoeld in [artikel 1.28, eerste lid, van het Besluit houders van dieren][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0035091#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0035217#Artikel1
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel5.13
    references:
      - id: ref1
        bwb_id: BWBR0035091
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0035217
        artikel: '1'
  - number: 5.14.1
    text: 'Het bedrijfsgezondheidsplan bevat:'
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel5.14
  - number: 5.14.1.a
    text: |-
      de naam van de dierenarts die het plan heeft opgesteld en het nummer waaronder hij is opgenomen in het register,
      bedoeld in [artikel 4.3, eerste lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel4
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel5.14
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '4'
  - number: 5.14.1.b
    text: de naam van de houder voor wie het plan wordt opgesteld;
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel5.14
  - number: 5.14.1.c
    text: |-
      het unieke registratienummer, bedoeld in artikel 93, slot, van verordening (EU) nr. 2016/429, of het unieke
      erkenningsnummer, bedoeld in artikel 2, onderdeel 16, van verordening (EU) nr. 2019/2035 dat aan de inrichting
      waarop de dieren worden gehouden is toegekend;
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel5.14
  - number: 5.14.1.d
    text: de datum van opstellen van het plan;
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel5.14
  - number: 5.14.1.e
    text: de diersoort en diercategorie;
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel5.14
  - number: 5.14.1.f
    text: een analyse van de diergezondheidssituatie van de dieren en de inzet van diergeneesmiddelen bij deze dieren;
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel5.14
  - number: 5.14.1.g
    text: |-
      een overzicht van maatregelen die worden getroffen ter verbetering van de diergezondheidssituatie van de dieren,
      waaronder in ieder geval maatregelen gericht op vermindering van de toepassing van antimicrobiële middelen bij de
      dieren, aan welke maatregelen een uitvoeringstermijn wordt verbonden.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel5.14
  - number: 5.14.2
    text: Het bedrijfsgezondheidsplan wordt door de dierenarts en de houder ondertekend.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel5.14
  - number: 5.14.3
    text: |-
      Het eerste lid, onderdelen f en g, is niet van toepassing op het opstellen van het bedrijfsgezondheidsplan voor een
      houder van ander pluimvee dan kippen of kalkoenen.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel5.14
  - number: 5.15.1
    text: |-
      Indien het bedrijfsgezondheidsplan wordt opgesteld voor een houder van pluimvee, bevat het plan tevens het uniek
      subregistratienummer, bedoeld in [artikel 5a.1, derde lid, van de Regeling houders van dieren][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035248#Artikel5a
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel5.15
    references:
      - id: ref1
        bwb_id: BWBR0035248
        artikel: 5a
  - number: 5.15.2
    text: |-
      Indien het bedrijfsgezondheidsplan wordt opgesteld voor een houder van kippen of kalkoenen, omvat de analyse,
      bedoeld in [artikel 5.14, onderdeel f][ref1], ten minste de volgende onderdelen:


      [ref1]: https://wetten.overheid.nl/BWBR0035238#Artikel5
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel5.15
    references:
      - id: ref1
        bwb_id: BWBR0035238
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: 5.15.2.a
    text: reiniging en ontsmetting;
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel5.15
  - number: 5.15.2.b
    text: voer;
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel5.15
  - number: 5.15.2.c
    text: drinkwater;
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel5.15
  - number: 5.15.2.d
    text: klimaat;
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel5.15
  - number: 5.15.2.e
    text: technische resultaten van de dieren, waaronder uitval, voederconversie en groei;
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel5.15
  - number: 5.15.2.f
    text: strooisel;
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel5.15
  - number: 5.15.2.g
    text: aangevoerde dieren;
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel5.15
  - number: 5.15.2.h
    text: hakdermatitis;
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel5.15
  - number: 5.15.2.i
    text: voetzoollaesies;
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel5.15
  - number: 5.15.2.j
    text: bezettingsdichtheid;
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel5.15
  - number: 5.15.2.k
    text: uitladen.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel5.15
  - number: 5.15.3
    text: |-
      Indien het bedrijfsgezondheidsplan wordt opgesteld voor een houder van pluimvee bevat het plan tevens een
      bioveiligheidsplan. Het bioveiligheidsplan gaat in op de getroffen en te nemen biobeveiligingsmaatregelen met
      betrekking tot:
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel5.15
  - number: 5.15.3.a
    text: hygiënezones;
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel5.15
  - number: 5.15.3.b
    text: plaagdieren en wilde vogels;
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel5.15
  - number: 5.15.3.c
    text: bezoekers en personeel;
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel5.15
