      Aan de voorzitter, de overige leden en hun plaatsvervangers worden reis- en verblijfskosten toegekend
      overeenkomstig hetgeen daarover is overeengekomen in de laatstelijk afgesloten collectieve arbeidsovereenkomst
      die is gesloten voor de ambtenaren die krachtens een arbeidsovereenkomst met de Staat werkzaam zijn op basis van
      declaratie achteraf.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel6.5
  - number: 7.3.1
    text: |-
      Van het verbod, bedoeld in [artikel 2.8, eerste lid, van de wet][ref1] en voor zover wordt voldaan aan
      [artikel 2.7, eerste lid, van het besluit][ref2], wordt tot 1 januari 2019 vrijstelling verleend voor het verkorten
      van de boven- of ondersnavel bij kalkoenen en kippen, mits:


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0035091#Artikel2
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel7.3
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0035091
        artikel: '2'
  - number: 7.3.1.a
    text: de ingreep is verricht wanneer het dier jonger is dan tien dagen;
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel7.3
  - number: 7.3.1.b
    text: de ingreep dient ter voorkoming van pikkerij en kannibalisme;
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel7.3
  - number: 7.3.1.c
    text: |-
      het dier gehouden wordt of aantoonbaar bestemd is om te worden gehouden in een huisvestingssysteem waarin de
      kippen of kalkoenen zich vrijelijk over de vloer van de stal of op en naar verschillende niveaus van de stal kunnen
      bewegen of in een aangepast kooihuisvestingssysteem, en
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel7.3
  - number: 7.3.1.d
    text: |-
      gebruik gemaakt wordt van de infraroodmethode om de snavels te verkorten, met uitzondering van de gevallen waarin
      het dier is geïmporteerd en waarvan in het land van herkomst de snavel niet is verkort of het dier nakomeling is
      van een jong moederdier.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel7.3
  - number: 7.3.2
    text: 'In afwijking van het eerste lid, aanhef, geldt de vrijstelling voor:'
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel7.3
  - number: 7.3.2.a
    text: dieren die dienen als moederdieren van trager groeiende vleeskuikens tot 1 september 2026; en
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel7.3
  - number: 7.3.2.b
    text: |-
      dieren die dienen als legouderdieren of (over)grootouderdieren, eendagskuikens van kippen bestemd voor de export of
      kalkoenen tot 1 september 2028.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel7.3
  - number: 7.3.3
    text: |-
      In afwijking van het eerste lid, aanhef, geldt de vrijstelling voor pluimvee dat op moment van inwerkingtreding van
      deze regeling wordt gehouden in verandastallen met geïntegreerde plastic voerpannen, tot 1 januari 2027.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel7.3
  - number: 7.4.1
    text: |-
      Van het verbod, bedoeld in [artikel 2.8, eerste lid, van de wet][ref1] en
      [artikel 2.7, tweede lid, van het besluit][ref2] wordt, voor zover aan het eerste lid van laatstbedoeld artikel
      wordt voldaan, aan de houder van runderen vrijstelling verleend voor het verrichten van de ingreep, bedoeld in
      [artikel 2.6, onderdeel d, van het besluit][ref3] bij runderen, naast de bij of krachtens enig ander wettelijk
      voorschrift voorgeschreven of toegestane identificatie-ingrepen.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0035091#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0035091#Artikel2
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel7.4
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0035091
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0035091
        artikel: '2'
  - number: 7.4.2
    text: |-
      De houder van de runderen is slechts vrijgesteld indien de ingreep vóór 1 juni 2019 deel uitmaakte van zijn
      bedrijfsvoering en hij zich daartoe vóór 1 augustus 2019 bij de minister aanmeldt met gebruikmaking van een door de
      minister beschikbaar gesteld middel.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel7.4
  - number: 7.4.3
    text: |-
      De vrijstelling heeft betrekking op de door de houder op zijn bedrijf, met het daaraan toegewezen UBN, gehouden
      runderen.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel7.4
  - number: 7.4.4
    text: De vrijstelling vervalt bij overdracht of een andere wijziging in de juridische vorm of structuur van het bedrijf.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel7.4
  - number: 7.4.5
    text: De vrijstelling is niet van toepassing op runderen die zijn geboren na 31 december 2024.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel7.4
  - number: 7.4.6
    text: De vrijstelling geldt tot 1 januari 2027.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel7.4
  - number: '7.5'
    text: |-
      Van het verbod, bedoeld in [artikel 2.8, eerste lid, van de wet][ref1] en
      [artikel 2.7, tweede lid, van het besluit][ref2] wordt, voor zover aan het eerste lid van laatstbedoeld artikel
      wordt voldaan, vrijstelling verleend voor het verrichten van ten hoogste twee lichamelijke ingrepen bedoeld in
      [artikel 2.6, onderdelen b en c, van het besluit][ref3] wanneer onder toepassing van artikel 38 van verordening
      (EU) nr. 2019/2035 de conventionele oormerken worden vervangen door een nieuw conventioneel oormerk en een
      elektronisch merk, naast de bij of krachtens enig ander wettelijk voorschrift voorgeschreven of toegestane
      identificatie-ingrepen.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0035091#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0035091#Artikel2
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel7.5
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0035091
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0035091
        artikel: '2'
  - number: '7.6'
    text: |-
      Van het verbod, bedoeld in [artikel 2.8, eerste lid, van de wet][ref1] wordt voor zover wordt voldaan aan
      [artikel 2.7, eerste lid, van het besluit][ref2], tot 1 juli 2028 vrijstelling verleend voor het verwijderen van
      een deel van de achterste teen bij mannelijke kippen, mits:


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0035091#Artikel2
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel7.6
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0035091
        artikel: '2'
  - number: 7.6.a
    text: het dier niet ouder is dan twee dagen, en
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel7.6
  - number: 7.6.b
    text: het dier bestemd is voor de fokkerij waarbij nakomelingen gewoonlijk worden gehouden voor menselijke consumptie.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel7.6
  - number: '7.7'
    text: |-
      Voordat een injecteerbare transponder bij een hond wordt aangebracht, identificeert de houder van de hond zich bij
      aanbrenger van de injecteerbare transponder met het registratienummer van de houder.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel7.7
  - number: 7.8.1
    text: |-
      De registratie, bedoeld in [artikel 2.9, eerste lid, van het besluit][ref1], wordt gedaan binnen een week nadat de
      injecteerbare transponder bij het dier is aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0035091#Artikel2
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel7.8
    references:
      - id: ref1
        bwb_id: BWBR0035091
        artikel: '2'
  - number: 7.8.2
    text: 'Bij de registratie wordt vermeld:'
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel7.8
  - number: 7.8.2.a
    text: de datum waarop de injecteerbare transponder is aangebracht;
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel7.8
  - number: 7.8.2.b
    text: de identificatiecode van het dier;
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel7.8
  - number: 7.8.2.c
    text: |-
      het nummer dat degene die de injecteerbare transponder heeft aangebracht heeft verkregen bij de registratie,
      bedoeld in [artikel 2.9, derde lid, van het besluit][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0035091#Artikel2
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel7.8
    references:
      - id: ref1
        bwb_id: BWBR0035091
        artikel: '2'
  - number: 7.8.2.d
    text: het praktijkadres van degene die de injecteerbare transponder heeft aangebracht.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel7.8
  - number: 7.8.3
    text: |-
      In afwijking van het eerste lid wordt de registratie, bedoeld in [artikel 2.9 van het besluit][ref1], gedaan binnen
      twee werkdagen indien het dier een hond betreft. Bij de registratie van een hond wordt in aanvulling op het tweede
      lid vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0035091#Artikel2
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel7.8
    references:
      - id: ref1
        bwb_id: BWBR0035091
        artikel: '2'
  - number: 7.8.3.a
    text: dat de registratie een hond betreft; en
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel7.8
  - number: 7.8.3.b
    text: het registratienummer van de houder van de hond.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel7.8
  - number: 7.8.4
    text: Bij de registratie van een paardachtige wordt in aanvulling op het tweede lid de diersoort vermeld.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel7.8
  - number: 7.9.1
    text: |-
      Bij de registratie, bedoeld in [artikel 2.9, derde lid, van het besluit][ref1], wordt vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0035091#Artikel2
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel7.9
    references:
      - id: ref1
        bwb_id: BWBR0035091
        artikel: '2'
  - number: 7.9.1.a
    text: naam, adres en burgerservicenummer van degene die de registratie doet;
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel7.9
  - number: 7.9.1.b
    text: het adres of de adressen waarop de degene die de registratie doet injecteerbare transponders geleverd krijgt;
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel7.9
  - number: 7.9.1.c
    text: het nummer van inschrijving in het handelsregister; en
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel7.9
  - number: 7.9.1.d
    text: |-
      gegevens waaruit blijkt dat degene die de registratie doet beroepsmatig met een zekere regelmaat injecteerbare
      transponders aanbrengt als bedoeld in [artikel 8b.9 van de Regeling houders van dieren][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035248#Artikel8b
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel7.9
    references:
      - id: ref1
        bwb_id: BWBR0035248
        artikel: 8b
  - number: 7.9.2
    text: |-
      Indien degene die de registratie doet injecteerbare transponders aanbrengt bij paardachtigen, wordt in aanvulling
      op het eerste lid het registratienummer vermeld dat is verkregen van een instantie waaraan de minister mandaat en
      machtiging heeft verleend tot het nemen van besluiten en het verrichten van overige handelingen die verband houden
      met [artikel 38t, eerste lid][ref1], voor paardachtigen als bedoeld in artikel 5, eerste lid, onderdeel a, van
      [verordening (EU) 262/2015](32015R0262).


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel38t
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel7.9
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 38t
  - number: '8.1'
    text: Deze regeling treedt in werking met ingang van 1 juli 2014.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel8.1
  - number: '8.2'
    text: 'Deze regeling wordt aangehaald als: Regeling diergeneeskundigen.'
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel8.2
