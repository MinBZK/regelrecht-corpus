  - number: 6.1.1
    text: |-
      Aan de voorzitter van het veterinair tuchtcollege wordt een vaste vergoeding per maand toegekend, waarbij
      de salarisschaal wordt vastgesteld op 20% van het maximum overeenkomstig schaal 15 als overeengekomen in de
      laatstelijk afgesloten collectieve arbeidsovereenkomst die is gesloten voor de ambtenaren die krachtens een
      arbeidsovereenkomst met de Staat werkzaam zijn.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel6.1
  - number: 6.1.2
    text: |-
      Aan de overige leden en hun plaatsvervangers van het veterinair tuchtcollege wordt een vergoeding per
      eindbeslissing toegekend van € 95.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel6.1
  - number: 6.2.1
    text: |-
      Aan de voorzitter van het veterinair beroepscollege wordt een vaste vergoeding per maand toegekend, waarbij
      de salarisschaal wordt vastgesteld op 10% van het maximum overeenkomstig schaal 17 als overeengekomen in de
      laatstelijk afgesloten collectieve arbeidsovereenkomst die is gesloten voor de ambtenaren die krachtens een
      arbeidsovereenkomst met de Staat werkzaam zijn.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel6.2
  - number: 6.2.2
    text: |-
      Aan de overige leden en hun plaatsvervangers van het veterinair beroepscollege wordt een vergoeding per
      eindbeslissing toegekend van € 95.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel6.2
  - number: 6.3.1
    text: |-
      Indien een bij het veterinair tuchtcollege of het veterinair beroepscollege aanhangig gemaakte zaak vijf
      werkdagen of minder voorafgaand aan de zitting wordt ingetrokken, wordt aan de personen bedoeld in de
      [artikelen 6.1, tweede lid][ref1], en [6.2, tweede lid][ref2], een vergoeding toegekend van € 50.


      [ref1]: https://wetten.overheid.nl/BWBR0035238#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0035238#Artikel6
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0035238
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0035238
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.3.2
    text: |-
      Aan personen als bedoeld in de [artikelen 6.1, tweede lid][ref1], en [6.2, tweede lid][ref2], tegen wie vijf
      werkdagen of minder voorafgaand aan de zitting een wrakingsverzoek wordt ingediend, wordt een vergoeding toegekend
      van € 50 indien het wrakingsverzoek is toegewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0035238#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0035238#Artikel6
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel6.3
    references:
