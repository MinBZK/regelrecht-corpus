        paragraaf: '2'
  - number: 4.10.1.d
    text: |-
      een document niet ouder dan drie maanden, waaruit blijkt dat ten aanzien van degene die de registratie aanvraagt
      geen maatregel berustend op een in het buitenland gegeven rechterlijke, tuchtrechtelijke of bestuursrechtelijke
      beslissing van kracht is, op grond waarvan hij zijn rechten tot de uitoefening van de diergeneeskunde in het land
      waar de beslissing is gegeven, geheel of gedeeltelijk, tijdelijk of blijvend heeft verloren.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel4.10
  - number: 4.10.2
    text: |-
      Indien het document, bedoeld in het eerste lid, onder d, niet wordt afgegeven door de bevoegde autoriteiten,
      wordt dit vervangen door een attest afgegeven door een bevoegde gerechtelijke autoriteit, een andere bevoegde
      overheidsautoriteit, een notaris of een bevoegde beroepsvereniging in het betreffende land waaruit blijkt dat
      betrokkene tegenover die instantie of functionaris onder ede, dan wel plechtig, heeft verklaard dat ten aanzien van
      hem geen maatregel van kracht is als bedoeld in het eerste lid, onder d.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel4.10
  - number: 4.10.3
    text: |-
      Voor zover betrokkene voldoende aannemelijk maakt dat hij redelijkerwijs niet in staat is een document of attest
      als bedoeld in het eerste lid, onder d, of het tweede lid te verstrekken, wordt hij in de gelegenheid gesteld een
      eigen verklaring over te leggen inhoudende dat tegen hem geen maatregel van kracht is als bedoeld in het eerste
      lid, onder d.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel4.10
  - number: 4.10.4
    text: |-
      Van een bewijsstuk als bedoeld in het eerste lid, onder c of d, of van het attest, bedoeld in het tweede lid, kan
      een kopie worden verstrekt die is gewaarmerkt door het bevoegd gezag of door een notaris.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel4.10
  - number: 4.10.5
    text: |-
      De titel, bedoeld in het eerste lid, onder c, is gesteld, dan wel door een beëdigd vertaler vertaald, in de taal
      waarin de getuigschriften zijn weergegeven in bijlage V van de [Richtlijn 2005/36/EG](32005L0036). Het document,
      bedoeld in het tweede lid, onder d, of het attest, bedoeld in het tweede lid, zijn gesteld, dan wel door een
      beëdigd vertaler vertaald, in het Nederlands, Engels of Duits.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel4.10
  - number: 4.11.1
    text: |-
      Migrerende beroepsbeoefenaars die beschikken over een door betrokken staat verleende titel na
      een opleiding op het gebied van de diergeneeskunde die niet voldoet aan de eisen, bedoeld in
      [artikel 4.5][ref1], en ten aanzien van wie evenmin een uitzondering als bedoeld in [artikel 4.6][ref2],
      [4.7][ref3] of [4.8][ref4] van toepassing is of over een opleidingstitel, onder 2˚, als bedoeld in
      [artikel 1 van de Algemene wet erkenning EU-beroepskwalificaties][ref5], worden niet geregistreerd dan nadat door
      de minister erkenning van beroepskwalificaties is verleend tot het beroepsmatig verrichten van diergeneeskundige
      handelingen.


