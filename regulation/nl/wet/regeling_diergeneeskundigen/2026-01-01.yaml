  - number: 1.1.2
    text: |-
      Met [Richtlijn nr. 2005/36/EG](32005L0036) worden voor de toepassing van deze regeling gelijkgesteld de
      Overeenkomst betreffende de Europese Economische Ruimte, in het bijzonder waar het gaat om bijlage VII, en de
      Overeenkomst tussen de Europese Gemeenschap en haar lidstaten, enerzijds, en de Zwitserse Bondsstaat, anderzijds,
      over het vrije verkeer van personen, in het bijzonder waar het gaat om bijlage III.
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel1.1
  - number: '2.1'
    text: |-
      De kwalificatie van dierenartsassistent paraveterinair, bedoeld in [artikel 3.1, eerste lid, van het besluit][ref1]
      heeft ten minste betrekking op de volgende onderwerpen:


