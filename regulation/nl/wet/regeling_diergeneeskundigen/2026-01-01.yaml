  - number: 3.10a
    text: |-
      De Minister vraagt voordat hij een besluit neemt op een aanvraag als bedoeld in de [artikelen 3.4][ref1] of
      [3.8][ref2], aan de commissie advies. De commissie betrekt bij haar advies de noodzaak van het afleggen van
      een proeve van bekwaamheid respectievelijk van een aanpassingsstage als bedoeld in de [artikelen 3.6][ref3],
      [3.7][ref4] en [3.10][ref5].


