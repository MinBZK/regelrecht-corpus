      [ref3]: https://wetten.overheid.nl/BWBR0035091#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0023066#Artikel21
      [ref5]: https://wetten.overheid.nl/BWBR0023066#Artikel23
    url: https://wetten.overheid.nl/BWBR0035238/2026-01-01#Artikel3.12
