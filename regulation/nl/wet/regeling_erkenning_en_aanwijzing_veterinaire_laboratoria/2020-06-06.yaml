preamble:
  text: |-
    Gelet op artikel 6, eerste en derde lid, en bijlage X, hoofdstuk C, onderdeel 2, van verordening (EG) nr. 999/2001
    van het Europees Parlement en de Raad van de Europese Unie van 22 mei 2001 houdende vaststelling van voorschriften
    inzake preventie, bestrijding en uitroeiing van bepaalde overdraagbare spongiforme encefalopathieën (PbEG L 147);

    Gelet op bijlage B, hoofdstuk I, punt 2, en hoofdstuk II, punt 2, van richtlijn nr. 88/407/EEG van de Raad van
    14 juni 1988 tot vaststelling van de veterinairrechtelijke voorschriften van toepassing op het intracommunautaire
    handelsverkeer in sperma van runderen en de invoer daarvan (PbEG L 194);

    Gelet op beschikking nr. 2001/618/EG van de Commissie van de Europese Gemeenschappen van 23 juli 2001 betreffende
    aanvullende garanties ten aanzien van de ziekte van Aujeszky voor het intracommunautaire handelsverkeer van
    varkens, betreffende criteria voor de over deze ziekte te verstrekken gegevens en houdende intrekking van de
    Beschikkingen 93/24/EEG en 93/244/EEG (PbEG L 215);

    Gelet op beschikking nr. 2003/100/EG van de Commissie van de Europese Gemeenschappen van 13 februari 2003 tot
    vaststelling van minimumeisen voor fokprogramma’s ter verkrijging van resistentie tegen overdraagbare spongiforme
    encefalopathieën bij schapen (PbEU L 41);

    Gelet op beschikking nr. 2004/226/EG van de Commissie van de Europese Gemeenschappen houdende erkenning van tests
    voor de opsporing van antilichamen tegen runderbrucellose in het kader van Richtlijn 64/432/EEG van de Raad (PbEU
    L 68);

    Gelet op beschikking nr. 2004/558/EG van de Commissie van de Europese Gemeenschappen van 15 juli 2004 tot
    uitvoering van Richtlijn 64/432/EEG van de Raad voor wat betreft aanvullende garanties voor het intracommunautaire
    handelsverkeer in runderen ten aanzien van infectieuze boviene rhinotracheïtis en de goedkeuring van de door
    sommige lidstaten ingediende uitroeiingsprogramma’s (PbEU L 249);

    Gelet op artikel 10, 77, 78, 80 en 94 van de Gezondheids- en welzijnswet voor dieren;

    Gelet op artikel 19, 22a, 22b van de Landbouwwet;

    Gelet op artikel 5 van het Besluit inzake het in de handel brengen van dieren en producten en de toepassing van
    maatregelen met betrekking tot in Nederland gebrachte dieren en producten;

    Gelet op artikel 9 van het Besluit eisen dierlijk sperma en spermawincentra;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#ArtikelAanhef
