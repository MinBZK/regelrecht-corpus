    text: 'NRL: Nationaal Referentie Laboratorium.'
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel1
  - number: 1a
    text: |-
      De Minister is bevoegd tot aanwijzing van nationale referentielaboratoria als bedoeld in artikel 100, eerste lid,
      eerste zin, van verordening (EU) 2017/625, ten aanzien van onderwerpen die de [Gezondheids- en welzijnswet voor
      dieren](onbekend) betreffen.
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel1a
  - number: '2.1'
    text: |-
      De onderzoeken, bedoeld in [bijlage 1][ref1], worden uitgevoerd met de in die bijlage opgenomen testmethodes voor
      het desbetreffende onderzoek, door een daartoe door de minister ingevolge artikel 37 van verordening (EU) 2017/625
      erkend laboratorium.


      [ref1]: https://wetten.overheid.nl/BWBR0019575
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0019575
  - number: '2.2'
    text: |-
      De minister verleent een erkenning aan een laboratorium voor een of meer in [bijlage 1][ref1] opgenomen
      testmethodes, indien is voldaan aan artikel 37 van verordening (EU) 2017/625 en [artikel 6, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0019575
      [ref2]: https://wetten.overheid.nl/BWBR0019575#Artikel6
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0019575
      - id: ref2
        bwb_id: BWBR0019575
        artikel: '6'
        paragraaf: '2'
  - number: '2.3'
    text: |-
      In aanvulling op de artikelen 37, vierde lid, en 38 van verordening (EU) 2017/625 voldoet een erkend laboratorium
      als bedoeld in het eerste lid, aan de [artikelen 13 tot en met 16][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019575#Artikel13
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0019575
        artikel: '13'
        paragraaf: '4'
  - number: '3.1'
    text: |-
      De onderzoeken, bedoeld in [bijlage 2][ref1], worden uitgevoerd met de in die bijlage opgenomen testmethodes voor
      het desbetreffende onderzoek door een daartoe door de minister ingevolge deze regeling erkend laboratorium wanneer
      het onderzoek plaatsvindt ten behoeve van uitvoer naar een land, niet zijnde een lidstaat of een andere staat die
      partij is bij het EER-Verdrag.


      [ref1]: https://wetten.overheid.nl/BWBR0019575
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0019575
  - number: '3.2'
    text: |-
      De minister verleent een erkenning aan een laboratorium voor een of meer in [bijlage 2][ref1] opgenomen
      testmethodes, indien is voldaan aan [paragraaf 2][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0019575
      [ref2]: https://wetten.overheid.nl/BWBR0019575#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0019575
      - id: ref2
        bwb_id: BWBR0019575
        paragraaf: '2'
  - number: '3.3'
    text: |-
      Een erkend laboratorium als bedoeld in het eerste lid voldoet aan [paragraaf 4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019575#Paragraaf4
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0019575
        paragraaf: '4'
  - number: '4.1'
    text: |-
      Voor het verrichten van één of meer in [bijlage 2][ref1] opgenomen testmethoden kan de minister op aanvraag een
      laboratorium, gevestigd in een andere lidstaat van de Europese Unie dan wel in een staat, niet zijnde een lidstaat
      van de Europese Unie, die partij is bij een daartoe strekkend of mede daartoe strekkend Verdrag dat Nederland
      bindt, gelijkstellen met een op grond van [artikel 3][ref2] erkend laboratorium.


      [ref1]: https://wetten.overheid.nl/BWBR0019575
      [ref2]: https://wetten.overheid.nl/BWBR0019575#Artikel3
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0019575
      - id: ref2
        bwb_id: BWBR0019575
        artikel: '3'
        paragraaf: '1'
  - number: '4.2'
    text: |-
      Een besluit tot gelijkstelling, bedoeld in het eerste lid, wordt genomen indien het laboratorium door de bevoegde
      autoriteiten van de lidstaat of staat is erkend voor het verrichten van de in [bijlage 2][ref1] opgenomen
      testmethode, op basis van criteria waardoor een gelijkwaardig kwaliteits- en betrouwbaarheidsniveau wordt bereikt
      als op basis van de eisen in onderhavige regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0019575
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0019575
  - number: '4.3'
    text: |-
      Bij een aanvraag tot gelijkstelling, bedoeld in het eerste lid, worden documenten overgelegd waaruit blijkt dat het
      laboratorium voldoet aan het bepaalde in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel4
  - number: '5'
    text: Het laboratorium is gelegen op Nederlands grondgebied.
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel5
  - number: '6.1'
    text: |-
      Het laboratorium is door de RvA, of een andere accreditatieorganisatie die aantoonbaar voldoet aan ISO 17011 en
      ondertekenaar is van de meerzijdige overeenkomst van het Europese netwerk van accreditatie geaccrediteerd, conform
      NEN-EN-ISO/IEC 17025, voor de testmethode waarvoor de erkenning wordt aangevraagd.
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel6
  - number: '6.2'
    text: |-
      Indien het laboratorium een erkenning aanvraagt voor een testmethode als bedoeld in [bijlage 2][ref1], uitgezonderd
      de testmethodes, genoemd in bijlage 2, onder 3, 4, 6, 8, 12 tot en met 15, 22 en 24, is mede uit een audit,
      uitgevoerd door het bevoegde Nationaal Referentie Laboratorium, gebleken dat de testmethode overeenkomstig de
      door het laboratorium in het kader van de accreditatie, bedoeld in het eerste lid, opgestelde documentatie en
      analysevoorschriften wordt uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0019575
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0019575
  - number: '6.3'
    text: |-
      Indien het laboratorium een erkenning aanvraagt voor een testmethode als bedoeld in [bijlage 1][ref1], uitgezonderd
      de testmethodes, genoemd in de bijlage, onder 4, 5, 7, 12, 14, 18 tot en met 20, is mede uit een audit, uitgevoerd
      door het bevoegde NRL, gebleken dat de testmethode overeenkomstig de door het laboratorium in het kader van
      de accreditatie, bedoeld in artikel 37, vierde lid, onderdeel e, van verordening (EU) 2017/625, opgestelde
      documentatie en analysevoorschriften wordt uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0019575
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0019575
  - number: '7'
    text: |-
      Indien het laboratorium niet beschikt over de accreditatie, bedoeld in [artikel 6, eerste lid][ref1], wordt voldaan
      aan de volgende voorwaarden:


      [ref1]: https://wetten.overheid.nl/BWBR0019575#Artikel6
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0019575
        artikel: '6'
        paragraaf: '2'
  - number: 7.a
    text: de aanvraag voor de accreditatie is ingediend bij de RvA, en
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel7
  - number: 7.b
    text: |-
      mede uit een audit, uitgevoerd door het bevoegde Nationaal Referentie Laboratorium, is gebleken dat de testmethode,
      bedoeld in [bijlage 2][ref1], uitgezonderd de testmethodes, genoemd onder 3, 4, 6, 8, 12 tot en met 15, 22
      en 24, overeenkomstig de door het laboratorium in het kader van die accreditatie opgestelde documentatie en
      analysevoorschriften wordt uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0019575
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0019575
  - number: '8'
    text: |-
      Het laboratorium heeft deelgenomen aan een ringtest, georganiseerd door het bevoegde Nationaal Referentie
      Laboratorium, waaruit is gebleken dat het laboratorium de testmethode voldoende nauwkeurig uitvoert.
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel8
  - number: 8a
    text: |-
      Een laboratorium dat een erkenning voor de testmethode, bedoeld in [bijlage 1][ref1], onder 10, aanvraagt, is met
      gunstig resultaat beoordeeld door het laboratorium, genoemd in artikel 1 van beschikking 2000/258/EG, en voldoet
      aan de bepalingen die de Europese Commissie vaststelt op grond van artikel 3 van genoemde beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0019575
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0019575
  - number: '9.1'
    text: |-
      De aanvraag voor een erkenning als bedoeld in [artikel 2][ref1] of [3][ref2] wordt gedaan op een door de minister
      ter beschikking gesteld middel.


      [ref1]: https://wetten.overheid.nl/BWBR0019575#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019575#Artikel3
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0019575
        artikel: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0019575
        artikel: '3'
        paragraaf: '1'
  - number: '9.2'
    text: 'Bij de aanvraag worden in ieder geval de volgende gegevens overgelegd:'
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel9
  - number: 9.2.a
    text: |-
      bij een aanvraag als bedoeld in [artikel 2][ref1]: het bewijs van accreditatie, bedoeld in artikel 37, vierde lid,
      onderdeel e, van [verordening 2017/625](32525R2017);


      [ref1]: https://wetten.overheid.nl/BWBR0019575#Artikel2
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0019575
        artikel: '2'
        paragraaf: '1'
  - number: 9.2.b
    text: |-
      bij een aanvraag als bedoeld in [artikel 3][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0019575#Artikel3
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0019575
        artikel: '3'
        paragraaf: '1'
  - number: 9.2.b.1
    text: |-
      het bewijs van accreditatie, bedoeld in [artikel 6, eerste lid][ref1], of een kopie van de aanvraag voor een
      accreditatie, bedoeld in [artikel 7, onderdeel a][ref2], en


      [ref1]: https://wetten.overheid.nl/BWBR0019575#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0019575#Artikel7
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0019575
        artikel: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0019575
        artikel: '7'
        paragraaf: '2'
  - number: 9.2.b.2
    text: |-
      indien [artikel 7][ref1] van toepassing is, de door het laboratorium in het kader van de accreditatie, opgestelde
      documentatie en analysevoorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0019575#Artikel7
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0019575
        artikel: '7'
        paragraaf: '2'
  - number: '9.3'
    text: |-
      Bij een aanvraag voor een erkenning voor een testmethode als bedoeld in [bijlage 1][ref1], onder 1, wordt tevens
      een technische omschrijving van het elektronisch in- en uitslagregister, bedoeld in [artikel 16, onder c][ref2],
      overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0019575
      [ref2]: https://wetten.overheid.nl/BWBR0019575#Artikel16
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0019575
      - id: ref2
        bwb_id: BWBR0019575
        artikel: '16'
        paragraaf: '4'
  - number: '9.4'
    text: |-
      Bij een aanvraag voor een erkenning voor de testmethode, bedoeld in [bijlage 1][ref1], onder 10, worden tevens
      documenten overgelegd waaruit blijkt dat het laboratorium voldoet aan het bepaalde in [artikel 8a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0019575
      [ref2]: https://wetten.overheid.nl/BWBR0019575#Artikel8a
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0019575
      - id: ref2
        bwb_id: BWBR0019575
        artikel: 8a
        paragraaf: '2'
  - number: '11'
    text: |-
      Indien de erkenning, bedoeld in [artikel 3][ref1] is verleend terwijl het laboratorium niet beschikt over de
      accreditatie, bedoeld in [artikel 6, eerste lid][ref2], dient het laboratorium binnen zes maanden na de datum
      waarop de erkenning, bedoeld in artikel 3 is verleend, geaccrediteerd te zijn overeenkomstig artikel 6, eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0019575#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0019575#Artikel6
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0019575
        artikel: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0019575
        artikel: '6'
        paragraaf: '2'
  - number: '12.1'
    text: |-
      Het laboratorium verricht een onderzoek als bedoeld in [bijlage 2][ref1], met de testmethode waarvoor het
      laboratorium erkend is.


      [ref1]: https://wetten.overheid.nl/BWBR0019575
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0019575
  - number: '12.2'
    text: |-
      Het laboratorium voert de testmethodes uit met reagentia of testkits waarvan de uitgangswaarden voldoen aan de
      Europese regelgeving of goede laboratoriumpraktijken, zoals gecontroleerd door het bevoegde Nationaal Referentie
      Laboratorium.
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel12
  - number: '13.1'
    text: |-
      Het laboratorium meldt niet-negatieve testresultaten, voor zover de testresultaten
      betrekking hebben op een aangewezen besmettelijke dierziekte als bedoeld in de
      __REF000___________________________________________________________________________________________________________
      ________________________, onmiddellijk telefonisch en per fax of elektronisch aan de NVWA en stuurt de monsters
      direct naar het bevoegde Nationaal Referentie Laboratorium voor bevestigingsonderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel2
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '2'
  - number: '13.2'
    text: |-
      In afwijking van het eerste lid, stuurt het laboratorium monsters die niet-negatieve testresultaten geven van
      het onderzoek, bedoeld in [bijlage 1][ref1], onder 8, en [bijlage 2][ref2], onder 7, enkel aan het bevoegde
      Nationaal Referentie Laboratorium, indien het testresultaat een uitslag van een test uitgevoerd volgens de gE-Elisa
      testmethode betreft. Het laboratorium meldt daarnaast niet-negatieve testresultaten van het onderzoek, bedoeld in
      bijlage 1, onder 8, en bijlage 2, onder 7, eveneens in afwijking van het eerste lid, enkel aan de NVWA, indien het
      testresultaat een uitslag van een test uitgevoerd volgens de gE-Elisa testmethode betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0019575
      [ref2]: https://wetten.overheid.nl/BWBR0019575
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0019575
      - id: ref2
        bwb_id: BWBR0019575
  - number: '13.3'
    text: |-
      In afwijking van het eerste lid, stuurt het laboratorium monsters die niet-negatieve testresultaten geven op
      Trichinellose direct naar het Rijksinstituut voor Volksgezondheid en Milieu, te Bilthoven.
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel13
  - number: '13.4'
    text: |-
      Bij het melden van een niet-negatieve uitslag aan de NVWA, als bedoeld in het eerste lid, vermeldt het laboratorium
      telkens:
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel13
  - number: 13.4.a
    text: |-
      het met het desbetreffende monster corresponderende UBN, indien het monster afkomstig is van een dier dat zich in
      Nederland bevindt, dan wel
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel13
  - number: 13.4.b
    text: |-
      het land van herkomst van het desbetreffende monster en de NAW-gegevens van het bedrijf waar het dier waar het
      monster van afkomstig is gehouden wordt, indien het monster afkomstig is van een dier dat zich buiten Nederland
      bevindt.
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel13
  - number: '14'
    text: |-
      Het laboratorium rapporteert elk kwartaal aan de NVWA elektronisch over de in dat kwartaal uitgevoerde onderzoeken,
      bedoeld in [bijlage 1][ref1] en [2][ref2], alsmede over de uitslagen van die onderzoeken, overeenkomstig een door
      de NVWA opgesteld format.


      [ref1]: https://wetten.overheid.nl/BWBR0019575
      [ref2]: https://wetten.overheid.nl/BWBR0019575
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0019575
      - id: ref2
        bwb_id: BWBR0019575
  - number: '15.1'
    text: |-
      Het laboratorium verleent medewerking aan periodieke monitoring, uitgevoerd door het Nationaal Referentie
      Laboratorium.
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel15
  - number: '15.2'
    text: 'De in het eerste lid bedoelde monitoring bestaat in ieder geval per erkenning uit:'
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel15
  - number: 15.2.a
    text: |-
      ten minste 2 ringtesten per jaar, dan wel ten minste 1 ringtest per jaar indien het laboratorium de ringtesten in
      de voorgaande 3 jaren steeds met goed gevolg heeft afgelegd en effectieve monitoring door het bevoegde Nationaal
      Referentie Laboratorium gewaarborgd blijft;
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel15
  - number: 15.2.b
    text: een controle inzake de nauwkeurigheid van de testmethode en de betrouwbaarheid van testuitslagen.
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel15
  - number: '15.3'
    text: 'In aanvulling op het tweede lid bestaat de in het eerste lid bedoelde monitoring uit:'
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel15
  - number: 15.3.a
    text: |-
      ten minste één keer per jaar een audit voor een testmethode als bedoeld in [bijlage 1][ref1], onder 1 tot en met 3,
      6, 8 tot en met 11, 13, 15 tot en met 17, 21 tot en met 24 en [bijlage 2][ref2], onder 1, 2, 5, 7, 9 tot en met 11,
      16 tot en met 21 en 23;


      [ref1]: https://wetten.overheid.nl/BWBR0019575
      [ref2]: https://wetten.overheid.nl/BWBR0019575
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0019575
      - id: ref2
        bwb_id: BWBR0019575
  - number: 15.3.b
    text: |-
      het uitvoeren van controletesten op monsters met een negatieve testuitslag, die zijn onderzocht met een testmethode
      als bedoeld in [bijlage 1][ref1], onder 2, 3, 8, 13, 15 en 21 tot en met 24 en [bijlage 2][ref2], onder 1, 2, 7, 9
      tot en met 11, 16 tot en met 21 en 23.


      [ref1]: https://wetten.overheid.nl/BWBR0019575
      [ref2]: https://wetten.overheid.nl/BWBR0019575
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0019575
      - id: ref2
        bwb_id: BWBR0019575
  - number: '15.4'
    text: |-
      Indien een laboratorium beschikt over meer dan één erkenning, worden de audits, bedoeld in het derde lid, onder a,
      gecombineerd uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel15
  - number: '15.5'
    text: |-
      Het laboratorium dat is erkend voor een testmethode als bedoeld in [bijlage 1][ref1], onder 2, 3, 8, 13, 15 en 21
      tot en met 24 en [bijlage 2][ref2], onder 1, 2, 7, 9 tot en met 11, 16 tot en met 21 en 23, zendt jaarlijks 10%
      van de onderzochte monsters met een negatieve testuitslag, tot een maximum van 250 monsters per testmethode, aan
      het bevoegde Nationaal Referentie Laboratorium, tenzij het door het bevoegde Nationaal Referentie Laboratorium
      in kennis is gesteld van het feit dat in het betrokken kalenderjaar reeds 250 of meer monsters, onderzocht met de
      desbetreffende testmethode, zijn ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0019575
      [ref2]: https://wetten.overheid.nl/BWBR0019575
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0019575
      - id: ref2
        bwb_id: BWBR0019575
  - number: '16'
    text: |-
      Onverminderd de voorgaande artikelen, dient een laboratorium dat erkend is voor een testmethode als bedoeld in
      [bijlage 1][ref1], onder 1:


      [ref1]: https://wetten.overheid.nl/BWBR0019575
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0019575
  - number: 16.a
    text: te voldoen aan artikel 6, derde lid, van de TSE-verordening;
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel16
  - number: 16.b
    text: |-
      geen inzage te verlenen in of geen mededelingen te doen over resultaten van de onderzoeken, anders dan aan de
      ambtenaren, belast met het toezicht op de naleving van deze regeling, aan medewerkers van Wageningen Bioveterinary
      Research, te Lelystad, die werkzaamheden verrichten in het kader van de uitvoering van de taken, bedoeld in bijlage
      X, hoofdstukken A en C, van de TSE-verordening, alsmede aan medewerkers van de RvA, die werkzaamheden verrichten in
      het kader van het verlenen van de accreditatie, bedoeld in [artikel 6, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0019575#Artikel6
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0019575
        artikel: '6'
        paragraaf: '2'
  - number: 16.c
    text: |-
      een elektronisch in- en uitslagregister van de monsters operationeel te hebben dat is gekoppeld aan een
      elektronisch register van de NVWA of van een andere door de NVWA aangewezen organisatie op een zodanige wijze dat
      de minister op ieder gewenst moment een koppeling kan leggen tussen de monsters en het individuele rund, waarvan
      het monster afkomstig is;
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel16
  - number: 16.d
    text: |-
      maandelijks aan de minister te rapporteren over de in die maand uitgevoerde onderzoeken, bedoeld in
      [bijlage 1][ref1], onder 1, de uitslagen van die onderzoeken en de leeftijd van de onderzochte dieren,
      overeenkomstig een door de minister opgesteld format.


      [ref1]: https://wetten.overheid.nl/BWBR0019575
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0019575
  - number: '17.1'
    text: |-
      De minister kan de erkenning, bedoeld in [artikel 3][ref1], schorsen voor een door hem te bepalen termijn indien
      het laboratorium niet voldoet aan één of meer voorwaarden en verplichtingen als bedoeld in [paragraaf 2][ref2]
      of [4][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0019575#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0019575#Paragraaf2
      [ref3]: https://wetten.overheid.nl/BWBR0019575#Paragraaf4
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0019575
        artikel: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0019575
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0019575
        paragraaf: '4'
  - number: '17.2'
    text: |-
      In geval van een schorsing van de erkenning als bedoeld in het eerste lid, voert het laboratorium de
      desbetreffende testmethode niet uit. Indien de erkenning wordt geschorst omdat het laboratorium niet voldoet aan
      [artikel 11][ref1], kan de minister besluiten dat het laboratorium de testmethode mag blijven verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0019575#Artikel11
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0019575
        artikel: '11'
        paragraaf: '4'
  - number: '17.3'
    text: |-
      De minister kan de erkenning, bedoeld in [artikel 3][ref1], intrekken indien:


      [ref1]: https://wetten.overheid.nl/BWBR0019575#Artikel3
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0019575
        artikel: '3'
        paragraaf: '1'
  - number: 17.3.a
    text: het laboratorium zich niet houdt aan het tweede lid;
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel17
  - number: 17.3.b
    text: |-
      na afloop van de schorsing, bedoeld in het eerste lid, blijkt dat het laboratorium nog steeds niet voldoet aan één
      of meer voorwaarden en verplichtingen als bedoeld in [paragraaf 2][ref1] of [4][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0019575#Paragraaf2
      [ref2]: https://wetten.overheid.nl/BWBR0019575#Paragraaf4
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0019575
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0019575
        paragraaf: '4'
  - number: 17.3.c
    text: |-
      blijkt dat binnen een periode van twaalf maanden na afloop van de schorsingstermijn, bedoeld in het eerste lid, het
      laboratorium opnieuw niet voldoet aan één of meer voorwaarden en verplichtingen als bedoeld in [paragraaf 2][ref1]
      of [4][ref2], of


      [ref1]: https://wetten.overheid.nl/BWBR0019575#Paragraaf2
      [ref2]: https://wetten.overheid.nl/BWBR0019575#Paragraaf4
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0019575
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0019575
        paragraaf: '4'
  - number: 17.3.d
    text: |-
      het laboratorium niet voldoet aan één of meer voorwaarden en verplichtingen als bedoeld in [paragraaf 2][ref1]
      of [4][ref2], en naar het oordeel van de minister afbreuk is gedaan aan de correctheid en betrouwbaarheid van de
      resultaten van het onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0019575#Paragraaf2
      [ref2]: https://wetten.overheid.nl/BWBR0019575#Paragraaf4
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0019575
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0019575
        paragraaf: '4'
  - number: '17.4'
    text: |-
      Voordat een besluit tot schorsing of intrekking wordt genomen, wordt het laboratorium in de gelegenheid gesteld
      binnen een bepaalde termijn alsnog aan de voorwaarden en verplichtingen als bedoeld in [paragraaf 2][ref1] of
      [4][ref2] te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0019575#Paragraaf2
      [ref2]: https://wetten.overheid.nl/BWBR0019575#Paragraaf4
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0019575
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0019575
        paragraaf: '4'
  - number: '17.5'
    text: |-
      De minister kan de erkenning met onmiddellijke ingang intrekken indien sprake is van een situatie als bedoeld in
      het derde lid, onderdeel d, en het belang van de dier- en volksgezondheid een intrekking met onmiddellijke ingang
      vereist.
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel17
  - number: '18.1'
    text: |-
      De minister kan een besluit tot gelijkstelling als bedoeld in [artikel 4][ref1] schorsen of intrekken indien het
      laboratorium niet voldoet aan de voorwaarden genoemd in [artikel 4, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0019575#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0019575#Artikel4
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0019575
        artikel: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0019575
        artikel: '4'
        paragraaf: '1'
  - number: '18.2'
    text: |-
      [Artikel 17][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019575#Artikel17
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0019575
        artikel: '17'
        paragraaf: '5'
  - number: '19'
    text: |-
      Wageningen Bioveterinary Research, te Lelystad voert de ingevolge de TSE-verordening te verrichten onderzoeken op
      overdraagbare spongiforme encefalopathieën uit, met uitzondering van het onderzoek, bedoeld in de bijlage, onder 1,
      dat wordt uitgevoerd door op grond van [artikel 3][ref1] erkende laboratoria.


      [ref1]: https://wetten.overheid.nl/BWBR0019575#Artikel3
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0019575
        artikel: '3'
        paragraaf: '1'
  - number: '20'
    text: |-
      De Gezondheidsdienst voor Dieren is aangewezen om de onderzoeken, bedoeld in [bijlage 1][ref1], onder 2, voor
      zover het betrekking heeft op testen voor de screening van individuele dieren, 3, voor zover het betrekking heeft
      op de monitoring van runderen, onder 16 tot en met 19 en 23, voor zover het betrekking heeft op de monitoring, uit
      te voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0019575
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0019575
  - number: 20a
    text: |-
      Plant Research International BV, Business Unit Biointeracties, bijen@wur, te Wageningen voert de onderzoeken uit,
      te verrichten ingevolge artikel 7, vierde lid, van verordening (EU) nr. 206/2010 van de Commissie van 12 maart 2010
      tot vaststelling van lijsten van derde landen en gebieden, of delen daarvan, waaruit bepaalde dieren en vers vlees
      in de Europese Unie mogen worden binnengebracht, en van de voorschriften inzake veterinaire certificering (PbEU
      L 73).
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel20a
  - number: 20c
    text: |-
      Wageningen Bioveterinary Research, te Lelystad wordt aangewezen als laboratorium, bedoeld in artikel 57, aanhef
      en onderdeel a, van Richtlijn nr. 2006/88/EG van de Raad van de Europese Gemeenschappen van 24 oktober 2006,
      betreffende veterinairrechtelijke voorschriften voor aquacultuurdieren en de producten daarvan en betreffende de
      preventie en bestrijding van bepaalde ziekten bij waterdieren (PbEG L 328).
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel20c
  - number: 20d
    text: |-
      Wageningen Bioveterinary Research, te Lelystad, wordt aangewezen als laboratorium, bedoeld in Bijlage V,
      onderdeel 3, van verordening (EU) nr. 139/2013 van de Europese Commissie van 7 januari 2013 tot vaststelling
      van de veterinairrechtelijke voorschriften voor de invoer van bepaalde vogels in de Unie en de desbetreffende
      quarantainevoorschriften (PbEU L 47).
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel20d
  - number: 20e
    text: |-
      Innovative Modern Agriculture IMA - Wageningen B.V. wordt aangewezen als testlaboratorium als bedoeld in hoofdstuk
      IV, onderdeel 1, van beschikking nr. 2006/968/EG van de Commissie van de Europese Gemeenschappen van 15 december
      2006 tot uitvoering van Verordening (EG) nr. 21/2004 van de Raad wat betreft richtsnoeren en procedures voor de
      elektronische identificatie van schapen en geiten (Pb L 401).
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel20e
  - number: 20g.1
    text: Het is verboden te werken met een levend mond- en klauwzeervirus.
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel20g
  - number: 20g.2
    text: 'Het verbod, bedoeld in het eerste lid, is niet van toepassing op in Nederland gevestigde laboratoria die:'
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel20g
  - number: 20g.2.a
    text: 'zijn opgenomen in:'
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel20g
  - number: 20g.2.a.1
    text: |-
      deel A van bijlage XI bij [richtlijn 2003/85/EG](32003L0085), voor zover zij met dit virus werken voor onderzoek en
      diagnostiek, of
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel20g
  - number: 20g.2.a.2°
    text: |-
      deel B van bijlage XI bij [richtlijn 2003/85/EG](32003L0085), voor zover zij met dit virus werken voor de
      vervaardiging van geïnactiveerde antigenen voor de aanmaak van vaccins, of vaccins zelf, en
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel20g
  - number: 20g.2.b
    text: |-
      ten minste functioneren met inachtneming van de normen, opgenomen in onderdeel 1 van bijlage XII bij [richtlijn
      2003/85/EG](32003L0085).
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel20g
  - number: 20h.1
    text: |-
      Het is verboden het virus van Afrikaanse varkenspest, klassieke varkenspest of aviaire influenza, het genoom of
      de antigenen ervan of de vaccins tegen het virus in het kader van onderzoek, diagnose of productie, te hanteren of
      te gebruiken.
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel20h
  - number: 20h.2
    text: |-
      Het verbod, bedoeld in het eerste lid, is niet van toepassing op plaatsen, inrichtingen of laboratoria die zijn
      erkend door de minister.
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel20h
  - number: 20h.3
    text: 'De minister verleent een erkenning indien:'
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel20h
  - number: 20h.3.a
    text: het hanteren of het gebruik uitsluitend geschiedt voor onderzoek, diagnose of productie, en
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel20h
  - number: 20h.3.b
    text: |-
      op de plaats, de inrichting of het laboratorium maatregelen zijn genomen om de bioveiligheid te waarborgen,
      overeenkomstig:
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel20h
  - number: 20h.3.b.1°
    text: |-
      voor Afrikaanse varkenspest: hoofdstuk VIII van de bijlage bij beschikking 2003/422/EG van de Commissie van 26 mei
      2003 tot goedkeuring van een handboek voor de diagnose van Afrikaanse varkenspest (Pb L 143);
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel20h
  - number: 20h.3.b.2°
    text: |-
      voor klassieke varkenspest: hoofdstuk IX van de bijlage bij beschikking 2002/106/EG van de Commissie van
      1 februari 2002 houdende goedkeuring van een diagnosehandboek tot vaststelling van diagnostische procedures,
      bemonsteringsprocedures en criteria voor de evaluatie van de resultaten van laboratoriumtests voor de bevestiging
      van klassieke varkenspest (Pb L 39);
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel20h
  - number: 20h.3.b.3°
    text: |-
      voor aviaire influenza: hoofdstuk XIV van de bijlage bij beschikking 2006/437/EG van de Commissie van 4 augustus
      2006 tot goedkeuring van een diagnosehandboek voor aviaire influenza overeenkomstig [Richtlijn 2005/94/EG]
      (32005L0094) van de Raad (Pb L 237).
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel20h
  - number: 20h.4
    text: |-
      De aanvraag voor een erkenning als bedoeld in het tweede lid wordt bij de minister ingediend met gebruikmaking van
      een daartoe bestemd aanvraagformulier. Bij de aanvraag worden in elk geval documenten overgelegd waaruit blijkt dat
      op de plaats, de inrichting of het laboratorium wordt voldaan aan het derde lid, onder b.
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel20h
  - number: 20h.5
    text: |-
      De minister kan een erkenning als bedoeld in het tweede lid schorsen voor een door hem te bepalen termijn indien op
      de plaats, de inrichting of het laboratorium niet wordt voldaan aan het derde lid, onder a of b.
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel20h
  - number: 20h.6
    text: 'De minister kan een erkenning als bedoeld in het tweede lid, intrekken indien:'
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel20h
  - number: 20h.6.a
    text: |-
      na afloop van de schorsing, bedoeld in het derde lid, blijkt dat op de plaats, de inrichting of het laboratorium
      nog steeds niet wordt voldaan aan het derde lid, onder a of b;
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel20h
  - number: 20h.6.b
    text: |-
      blijkt dat binnen een periode van twaalf maanden na afloop van de schorsingstermijn, bedoeld in het derde lid,
      blijkt dat op de plaats, de inrichting of het laboratorium wederom niet wordt voldaan aan het derde lid, onder a
      of b.
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel20h
  - number: 20h.7
    text: |-
      Voordat een besluit tot schorsing of intrekking wordt genomen, wordt de belanghebbende van de plaats, de inrichting
      of het laboratorium in de gelegenheid gesteld binnen een bepaalde termijn alsnog aan het derde lid, onder a en b,
      te voldoen.
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel20h
  - number: 20h.8
    text: |-
      De minister kan de erkenning met onmiddellijke ingang intrekken indien het belang van de dier- of volksgezondheid
      een intrekking met onmiddellijke ingang vereist.
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel20h
  - number: '21'
    text: |-
      Wageningen Bioveterinary Research, te Lelystad, en het Rijksinstituut voor Volksgezondheid en Milieu,
      te Bilthoven, verstrekken de resultaten van: - de audit, bedoeld in [artikel 6, tweede lid][ref1], en
      [artikel 7, aanhef en onder twee][ref2],
        - de ringtest, bedoeld in [artikel 8][ref3], en
        - de werkzaamheden, bedoeld in [artikel 15][ref4], uitsluitend aan de NVWA en het desbetreffende laboratorium.


      [ref1]: https://wetten.overheid.nl/BWBR0019575#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0019575#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0019575#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0019575#Artikel15
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0019575
        artikel: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0019575
        artikel: '7'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0019575
        artikel: '8'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0019575
        artikel: '15'
        paragraaf: '4'
  - number: '22'
    text: |-
      Erkenningen die zijn verleend op grond van de Regeling erkenning laboratoria snelle BSE-testen worden geacht te
      zijn verleend op grond van deze regeling.
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel22
  - number: '23'
    text: |-
      Deze regeling berust mede op het [Besluit uitvoering verordening officiële controles diergezondheid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0042383
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0042383
  - number: '26'
    text: De Regeling erkenning laboratoria snelle BSE-testen wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel26
  - number: '27'
    text: 'Deze regeling wordt aangehaald als: Regeling erkenning en aanwijzing veterinaire laboratoria.'
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel27
  - number: '28'
    text: Deze regeling treedt in werking met ingang van 1 maart 2006.
    url: https://wetten.overheid.nl/BWBR0019575/2020-06-06#Artikel28
