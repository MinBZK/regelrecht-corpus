        artikel: '3'
  - number: '2'
    text: |-
      De onderzoeken, bedoeld in de bijlage, worden uitgevoerd met de in die bijlage opgenomen testmethodes, door een
      daartoe door de minister ingevolge deze regeling erkend of aangewezen laboratorium.
    url: https://wetten.overheid.nl/BWBR0019575/2017-07-01#Artikel2
  - number: '3'
    text: |-
      1 De minister kan, indien naar zijn oordeel is voldaan aan de voorwaarden, bedoeld in [paragraaf 2][ref1], een
      erkenning verlenen aan een laboratorium voor één of meer in de bijlage opgenomen testmethodes.

      2 Indien een laboratorium bestaat uit verschillende vestigingen, beschikt elke vestiging over een afzonderlijke
      erkenning.


      [ref1]: https://wetten.overheid.nl/BWBR0019575#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0019575/2017-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0019575
        paragraaf: '2'
  - number: '4'
    text: |-
      1 Voor het verrichten van één of meer in de bijlage opgenomen testmethoden kan de minister op aanvraag een
      laboratorium, gevestigd in een andere lidstaat van de Europese Unie dan wel in een staat, niet zijnde een lidstaat
      van de Europese Unie, die partij is bij een daartoe strekkend of mede daartoe strekkend Verdrag dat Nederland
      bindt, gelijkstellen met een op grond van de onderhavige regeling erkend laboratorium.

      2 Een besluit tot gelijkstelling, bedoeld in het eerste lid, wordt genomen indien het laboratorium door de bevoegde
      autoriteiten van de lidstaat of staat is erkend voor het verrichten van de in de bijlage opgenomen testmethode, op
      basis van criteria waardoor een gelijkwaardig kwaliteits- en betrouwbaarheidsniveau wordt bereikt als op basis van
      de eisen in onderhavige regeling.

      3 Bij een aanvraag tot gelijkstelling, bedoeld in het eerste lid, worden documenten overgelegd waaruit blijkt dat
      het laboratorium voldoet aan het bepaalde in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0019575/2017-07-01#Artikel4
  - number: '5'
    text: Het laboratorium is gelegen op Nederlands grondgebied.
    url: https://wetten.overheid.nl/BWBR0019575/2017-07-01#Artikel5
  - number: '6'
    text: |-
      1 Het laboratorium is door de RvA, of een andere accreditatieorganisatie die aantoonbaar voldoet aan ISO 17011 en
      ondertekenaar is van de meerzijdige overeenkomst van het Europese netwerk van accreditatie geaccrediteerd, conform
      NEN-EN-ISO/IEC 17025, voor de testmethode waarvoor de erkenning wordt aangevraagd.

      2 Indien het laboratorium een erkenning aanvraagt voor een testmethode als bedoeld in de bijlage, uitgezonderd
      de testmethodes genoemd in de bijlage, onder 4, 5, 7, 13, 17 tot en met 20, 30, 34 en 36, is mede uit een audit,
      uitgevoerd door het bevoegde Nationaal Referentie Laboratorium, gebleken dat de testmethode overeenkomstig de
      door het laboratorium in het kader van de accreditatie, bedoeld in het eerste lid, opgestelde documentatie en
      analysevoorschriften wordt uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0019575/2017-07-01#Artikel6
  - number: '7'
    text: |-
      Indien het laboratorium niet beschikt over de accreditatie, bedoeld in [artikel 6, eerste lid][ref1], wordt voldaan
      aan de volgende voorwaarden:

      a. de aanvraag voor de accreditatie is ingediend bij de RvA, en

      b. mede uit een audit, uitgevoerd door het bevoegde Nationaal Referentie Laboratorium, is gebleken dat de
      testmethode, bedoeld in de bijlage, uitgezonderd de testmethodes genoemd onder 4, 5, 7, 13, 17 tot en met 20, 30,
      34 en 36, overeenkomstig de door het laboratorium in het kader van die accreditatie opgestelde documentatie en
      analysevoorschriften wordt uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0019575#Artikel6
    url: https://wetten.overheid.nl/BWBR0019575/2017-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0019575
        artikel: '6'
        paragraaf: '2'
  - number: '8'
    text: |-
      Het laboratorium heeft deelgenomen aan een ringtest, georganiseerd door het bevoegde Nationaal Referentie
      Laboratorium, waaruit is gebleken dat het laboratorium de testmethode voldoende nauwkeurig uitvoert.
    url: https://wetten.overheid.nl/BWBR0019575/2017-07-01#Artikel8
  - number: 8a
    text: |-
      Een laboratorium dat een erkenning voor de testmethode, bedoeld in de bijlage, onder 10, aanvraagt, is met gunstig
      resultaat beoordeeld door het laboratorium, genoemd in artikel 1 van beschikking 2000/258/EG, en voldoet aan de
      bepalingen die de Europese Commissie vaststelt op grond van artikel 3 van genoemde beschikking.
    url: https://wetten.overheid.nl/BWBR0019575/2017-07-01#Artikel8a
  - number: '9'
    text: |-
      1 De aanvraag voor een erkenning als bedoeld in [artikel 3][ref1] wordt bij de NVWA ingediend met gebruikmaking van
      een daartoe bestemd aanvraagformulier.

      2 Bij het aanvraagformulier worden in ieder geval de volgende gegevens overgelegd:

      a. het bewijs van accreditatie, bedoeld in [artikel 6, eerste lid][ref2], of een kopie van de aanvraag voor een
      accreditatie, bedoeld in [artikel 7, onderdeel 1][ref3], en

      b. indien [artikel 7][ref4] van toepassing is, de door het laboratorium in het kader van de accreditatie,
      opgestelde documentatie en analysevoorschriften.

      3 Bij een aanvraag voor een erkenning voor een testmethode als bedoeld in de bijlage, onder 1, wordt tevens een
      technische omschrijving van het elektronisch in- en uitslagregister, bedoeld in [artikel 16, onder c][ref5],
      overgelegd.

      4 Bij een aanvraag voor een erkenning voor de testmethode, bedoeld in de bijlage, onder 10, worden tevens
      documenten overgelegd waaruit blijkt dat het laboratorium voldoet aan het bepaalde in [artikel 8a][ref6].


