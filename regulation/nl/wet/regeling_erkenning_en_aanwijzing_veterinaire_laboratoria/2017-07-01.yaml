  - number: '11'
    text: |-
      Indien de erkenning is verleend terwijl het laboratorium niet beschikt over de accreditatie, bedoeld in
      [artikel 6, eerste lid][ref1], dient het laboratorium binnen zes maanden na de datum waarop de erkenning is
      verleend, geaccrediteerd te zijn overeenkomstig artikel 6, eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0019575#Artikel6
    url: https://wetten.overheid.nl/BWBR0019575/2017-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0019575
        artikel: '6'
        paragraaf: '2'
  - number: '12'
    text: |-
      1 Het laboratorium verricht een onderzoek als bedoeld in de bijlage, met de testmethode waarvoor het laboratorium
      erkend is.

      2 Het laboratorium voert de testmethodes uit met reagentia of testkits waarvan de uitgangswaarden voldoen aan de
      Europese regelgeving of goede laboratoriumpraktijken, zoals gecontroleerd door het bevoegde Nationaal Referentie
      Laboratorium.
    url: https://wetten.overheid.nl/BWBR0019575/2017-07-01#Artikel12
  - number: '13'
    text: |-
      1 Het laboratorium meldt niet-negatieve testresultaten, voor zover de testresultaten
      betrekking hebben op een aangewezen besmettelijke dierziekte als bedoeld in de
      __REF000___________________________________________________________________________________________________________
      ________________________, onmiddellijk telefonisch en per fax of elektronisch aan de NVWA en stuurt de monsters
      direct naar het bevoegde Nationaal Referentie Laboratorium voor bevestigingsonderzoek.

      2 In afwijking van het eerste lid, stuurt het laboratorium monsters die niet-negatieve testresultaten geven van
      het onderzoek, bedoeld in de bijlage onder 8, enkel aan het bevoegde Nationaal Referentie Laboratorium, indien het
      testresultaat een uitslag van een test uitgevoerd volgens de gE-Elisa testmethode betreft. Het laboratorium meldt
      daarnaast niet-negatieve testresultaten van het onderzoek, bedoeld in de bijlage onder 8, eveneens in afwijking van
      het eerste lid, enkel aan de NVWA, indien het testresultaat een uitslag van een test uitgevoerd volgens de gE-Elisa
      testmethode betreft.

      3 In afwijking van het eerste lid, stuurt het laboratorium monsters die niet-negatieve testresultaten geven op
      Trichinellose direct naar het Rijksinstituut voor Volksgezondheid en Milieu, te Bilthoven.

      4 Bij het melden van een niet-negatieve uitslag aan de NVWA, als bedoeld in het eerste lid, vermeldt het
      laboratorium telkens:

      a. het met het desbetreffende monster corresponderende UBN, indien het monster afkomstig is van een dier dat zich
      in Nederland bevindt, dan wel

      b. het land van herkomst van het desbetreffende monster en de NAW-gegevens van het bedrijf waar het dier waar het
      monster van afkomstig is gehouden wordt, indien het monster afkomstig is van een dier dat zich buiten Nederland
      bevindt.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel2
    url: https://wetten.overheid.nl/BWBR0019575/2017-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '2'
  - number: '14'
    text: |-
      Het laboratorium rapporteert elk kwartaal aan de NVWA elektronisch over de in dat kwartaal uitgevoerde onderzoeken,
      bedoeld in de bijlage, alsmede over de uitslagen van die onderzoeken, overeenkomstig een door de NVWA opgesteld
      format.
    url: https://wetten.overheid.nl/BWBR0019575/2017-07-01#Artikel14
  - number: '15'
    text: |-
      1 Het laboratorium verleent medewerking aan periodieke monitoring, uitgevoerd door het Nationaal Referentie
      Laboratorium.

      2 De in het eerste lid bedoelde monitoring bestaat in ieder geval per erkenning uit:

      a. ten minste 2 ringtesten per jaar, dan wel ten minste 1 ringtest per jaar indien het laboratorium de ringtesten
      in de voorgaande 3 jaren steeds met goed gevolg heeft afgelegd en effectieve monitoring door het bevoegde Nationaal
      Referentie Laboratorium gewaarborgd blijft;

      b. een controle inzake de nauwkeurigheid van de testmethode en de betrouwbaarheid van testuitslagen.

      3 De in het eerste lid bedoelde monitoring bestaat voor de testmethodes genoemd onder 1 tot en met 3, 6, 8 tot
      en met 12, 14 tot en met 16, 21 tot en met 29, 31 tot en met 33 en 35, in de bijlage, in aanvulling op het tweede
      lid, uit:

      a. ten minste één keer per jaar een audit;

      b. het uitvoeren van controletesten op monsters met een negatieve testuitslag, die door het erkende laboratorium
      onderzocht zijn met een testmethode als bedoeld in de bijlage onder 2, 8, 12, 14 tot en met 16, 21 tot en met 25,
      31 tot en met 33 en 35, waarvoor Wageningen Bioveterinary Research als bevoegd Nationaal Referentie Laboratorium
      is aangewezen.

      4 Indien een laboratorium beschikt over meer dan één erkenning, worden de audits, bedoeld in het derde lid, onder
      a, gecombineerd uitgevoerd.

      5 Het laboratorium dat is erkend voor een testmethode als bedoeld in de bijlage onder 2, 8, 12, 14 tot en met
      16, 21 tot en met 25, 31 tot en met 33 en 35, zendt jaarlijks 10% van de onderzochte monsters met een negatieve
      testuitslag, tot een maximum van 250 monsters per testmethode, aan het bevoegde Nationaal Referentie Laboratorium,
      tenzij het door het bevoegde Nationaal Referentie Laboratorium in kennis is gesteld van het feit dat in het
      betrokken kalenderjaar reeds 250 of meer monsters, onderzocht met de desbetreffende testmethode, zijn ontvangen.
    url: https://wetten.overheid.nl/BWBR0019575/2017-07-01#Artikel15
  - number: '16'
    text: |-
      Onverminderd de voorgaande artikelen, dient een laboratorium dat erkend is voor een testmethode als bedoeld in de
      bijlage, onder 1:

      a. te voldoen aan artikel 6, derde lid, van de TSE-verordening;

      b. geen inzage te verlenen in of geen mededelingen te doen over resultaten van de onderzoeken, anders dan aan de
      ambtenaren, belast met het toezicht op de naleving van deze regeling, aan medewerkers van Wageningen Bioveterinary
      Research, te Lelystad, die werkzaamheden verrichten in het kader van de uitvoering van de taken, bedoeld in bijlage
      X, hoofdstukken A en C, van de TSE-verordening, alsmede aan medewerkers van de RvA, die werkzaamheden verrichten in
      het kader van het verlenen van de accreditatie, bedoeld in artikel 6, eerste lid;

      c. een elektronisch in- en uitslagregister van de monsters operationeel te hebben dat is gekoppeld aan een
      elektronisch register van de NVWA of van een andere door de NVWA aangewezen organisatie op een zodanige wijze dat
      de minister op ieder gewenst moment een koppeling kan leggen tussen de monsters en het individuele rund, waarvan
      het monster afkomstig is;

      d. maandelijks aan de minister te rapporteren over de in die maand uitgevoerde onderzoeken, bedoeld in de bijlage,
      onder 1, de uitslagen van die onderzoeken en de leeftijd van de onderzochte dieren, overeenkomstig een door de
      minister opgesteld format.
    url: https://wetten.overheid.nl/BWBR0019575/2017-07-01#Artikel16
  - number: '17'
    text: |-
      1 De minister kan de erkenning, bedoeld in [artikel 3][ref1], schorsen voor een door hem te bepalen termijn indien
      het laboratorium niet voldoet aan één of meer voorwaarden en verplichtingen als bedoeld in [paragraaf 2][ref2]
      of [4][ref3].

      2 In geval van een schorsing van de erkenning als bedoeld in het eerste lid, voert het laboratorium de
      desbetreffende testmethode niet uit. Indien de erkenning wordt geschorst omdat het laboratorium niet voldoet aan
      [artikel 11][ref4], kan de minister besluiten dat het laboratorium de testmethode mag blijven verrichten.

      3 De minister kan de erkenning, bedoeld in [artikel 3][ref5], intrekken indien:

      a. het laboratorium zich niet houdt aan het tweede lid;

      b. na afloop van de schorsing, bedoeld in het eerste lid, blijkt dat het laboratorium nog steeds niet voldoet aan
      één of meer voorwaarden en verplichtingen als bedoeld in [paragraaf 2][ref6] of [4][ref7];

      c. blijkt dat binnen een periode van twaalf maanden na afloop van de schorsingstermijn, bedoeld in het eerste
      lid, het laboratorium opnieuw niet voldoet aan één of meer voorwaarden en verplichtingen als bedoeld in
      [paragraaf 2][ref8] of [4][ref9], of

      d. het laboratorium niet voldoet aan één of meer voorwaarden en verplichtingen als bedoeld in [paragraaf 2][ref10]
      of [4][ref11], en naar het oordeel van de minister afbreuk is gedaan aan de correctheid en betrouwbaarheid van de
      resultaten van het onderzoek.

      4 Voordat een besluit tot schorsing of intrekking wordt genomen, wordt het laboratorium in de gelegenheid gesteld
      binnen een bepaalde termijn alsnog aan de voorwaarden en verplichtingen als bedoeld in [paragraaf 2][ref12] of
      [4][ref13] te voldoen.

      5 De minister kan de erkenning met onmiddellijke ingang intrekken indien sprake is van een situatie als bedoeld in
      het derde lid, onderdeel d, en het belang van de dier- en volksgezondheid een intrekking met onmiddellijke ingang
      vereist.


