preamble:
  text: |-
    Gelet op artikel 6, eerste en derde lid, en bijlage X, hoofdstuk C, onderdeel 2, van verordening (EG) nr. 999/2001
    van het Europees Parlement en de Raad van de Europese Unie van 22 mei 2001 houdende vaststelling van voorschriften
    inzake preventie, bestrijding en uitroeiing van bepaalde overdraagbare spongiforme encefalopathieën (PbEG L 147);

    Gelet op bijlage B, hoofdstuk I, punt 2, en hoofdstuk II, punt 2, van richtlijn nr. 88/407/EEG van de Raad van
    14 juni 1988 tot vaststelling van de veterinairrechtelijke voorschriften van toepassing op het intracommunautaire
    handelsverkeer in sperma van runderen en de invoer daarvan (PbEG L 194);

    Gelet op beschikking nr. 2001/618/EG van de Commissie van de Europese Gemeenschappen van 23 juli 2001 betreffende
    aanvullende garanties ten aanzien van de ziekte van Aujeszky voor het intracommunautaire handelsverkeer van
    varkens, betreffende criteria voor de over deze ziekte te verstrekken gegevens en houdende intrekking van de
    Beschikkingen 93/24/EEG en 93/244/EEG (PbEG L 215);

    Gelet op beschikking nr. 2003/100/EG van de Commissie van de Europese Gemeenschappen van 13 februari 2003 tot
    vaststelling van minimumeisen voor fokprogramma’s ter verkrijging van resistentie tegen overdraagbare spongiforme
    encefalopathieën bij schapen (PbEU L 41);

    Gelet op beschikking nr. 2004/226/EG van de Commissie van de Europese Gemeenschappen houdende erkenning van tests
    voor de opsporing van antilichamen tegen runderbrucellose in het kader van Richtlijn 64/432/EEG van de Raad (PbEU
    L 68);

    Gelet op beschikking nr. 2004/558/EG van de Commissie van de Europese Gemeenschappen van 15 juli 2004 tot
    uitvoering van Richtlijn 64/432/EEG van de Raad voor wat betreft aanvullende garanties voor het intracommunautaire
    handelsverkeer in runderen ten aanzien van infectieuze boviene rhinotracheïtis en de goedkeuring van de door
    sommige lidstaten ingediende uitroeiingsprogramma’s (PbEU L 249);

    Gelet op artikel 10, 77, 78, 80 en 94 van de Gezondheids- en welzijnswet voor dieren;

    Gelet op artikel 19, 22a, 22b van de Landbouwwet;

    Gelet op artikel 5 van het Besluit inzake het in de handel brengen van dieren en producten en de toepassing van
    maatregelen met betrekking tot in Nederland gebrachte dieren en producten;

    Gelet op artikel 9 van het Besluit eisen dierlijk sperma en spermawincentra;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0019575/2017-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. TSE-verordening: [verordening (EG) nr. 999/2001](onbekend) van het Europees Parlement en de Raad van de Europese
      Unie van 22 mei 2001 houdende vaststelling van voorschriften inzake preventie, bestrijding en uitroeiing van
      bepaalde overdraagbare spongiforme encefalopathieën (PbEG L 147);

      b. verordening (EG) nr. 882/2004: verordening (EG) nr. 882/2004 van het Europees Parlement en de Raad van 29
      april 2004 inzake officiële controles op de naleving van de wetgeving inzake diervoeders en levensmiddelen en de
      voorschriften inzake diergezondheid en dierenwelzijn;

      c. verordening (EG) nr. 2075/2005: verordening (EG) nr. 2075/2005 van de Commissie van 5 december 2005 tot
      vaststelling van specifieke voorschriften voor de officiële controles op Trichinella in vlees;

      d. verordening (EG) nr. 1162/2009: verordening (EG) nr. 1162/2009 van de Commissie van 30 november 2009 tot
      vaststelling van overgangsmaatregelen voor de uitvoering van de Verordeningen (EG) nr. 853/2004, (EG) nr. 854/2004
      en (EG) nr. 882/2004 van het Europees Parlement en de Raad;

      e. [richtlijn 64/432/EEG](onbekend): [richtlijn nr. 64/432/EEG](onbekend) van de Raad van 26 juni 1964 inzake
      veterinairrechtelijke vraagstukken op het gebied van het intracommunautaire handelsverkeer in runderen en varkens
      (PbEG L 121);

      f. [richtlijn 88/407/EEG](onbekend): [richtlijn nr. 88/407/EEG](onbekend) van de Raad van 14 juni 1988 tot
      vaststelling van de veterinairrechtelijke voorschriften van toepassing op het intracommunautaire handelsverkeer in
      sperma van runderen en de invoer daarvan (PbEG L 194);

      g. richtlijn 2003/85/EG: richtlijn nr. 2003/85/EG van de Raad van de Europese Unie van 29 september 2003 tot
      vaststelling van communautaire maatregelen voor de bestrijding van mond- en klauwzeer, tot intrekking van Richtlijn
      85/511/EEG en van de Beschikkingen 89/531/EEG en 91/665/EEG, en tot wijziging van Richtlijn 92/46/EEG (PbEU L 306);

      h. beschikking 2000/258/EG: beschikking nr. 2000/258/EG van de Raad van de Europese Unie van 20 maart 2000 houdende
      aanwijzing van een specifiek instituut dat verantwoordelijk is voor de vaststelling van de criteria die nodig zijn
      voor de normalisatie van de serologische tests om de doelmatigheid van antirabiësvaccins te controleren;

      i. beschikking 2001/618/EG: beschikking nr. 2001/618/EG van de Commissie van de Europese Gemeenschappen van 23
      juli 2001 betreffende aanvullende garanties ten aanzien van de ziekte van Aujeszky voor het intracommunautaire
      handelsverkeer van varkens, betreffende criteria voor de over deze ziekte te verstrekken gegevens en houdende
      intrekking van de Beschikkingen 93/24/EEG en 93/244/EEG (PbEG L 215);

      j. beschikking 2003/100/EG: beschikking nr. 2003/100/EG van de Commissie van de Europese Gemeenschappen van
      13 februari 2003 tot vaststelling van minimumeisen voor fokprogramma’s ter verkrijging van resistentie tegen
      overdraagbare spongiforme encefalopathieën bij schapen (PbEU L 41);

      k. beschikking 2004/226/EG: beschikking nr. 2004/226/EG van de Commissie van de Europese Gemeenschappen houdende
      erkenning van tests voor de opsporing van antilichamen tegen runderbrucellose in het kader van [Richtlijn 64/432/
      EEG](onbekend) van de Raad (PbEU L 68);

      l. beschikking 2004/558/EG: beschikking nr. 2004/558/EG van de Commissie van de Europese Gemeenschappen van 15
      juli 2004 tot uitvoering van [Richtlijn 64/432/EEG](onbekend) van de Raad voor wat betreft aanvullende garanties
      voor het intracommunautaire handelsverkeer in runderen ten aanzien van infectieuze boviene rhinotracheïtis en de
      goedkeuring van de door sommige lidstaten ingediende uitroeiïngsprogramma’s (PbEU L 249);

      m. richtlijn 92/66/EEG: richtlijn 92/66/EEG van de Raad van 14 juli 1992 tot vaststelling van communautaire
      maatregelen voor de bestrijding van de ziekte van Newcastle (PbEG 1992, L 260);

      n. verordening (EG) nr. 2073/2005: verordening (EG) nr. 2073/2005 van de Commissie van 15 november 2005 inzake
      microbiologische criteria voor levensmiddelen (PbEG 2005, L 338);

      o. NVWA: Nederlandse Voedsel- en Warenautoriteit;

      p. RvA: Raad voor Accreditatie;

      q. UBN: uniek bedrijfsnummer als bedoeld in
      [artikel 3, eerste lid, van de Regeling identificatie en registratie van dieren][ref1];

      r. WBVR: Wageningen Bioveterinary Research;

      s. OIE: World Organisation for Animal Health;

      t. minister: Minister van Economische Zaken;

      u. richtlijn 92/65/EEG: Richtlijn 92/65/EEG van de Raad van 13 juli 1992 tot vaststelling van de
      veterinairrechtelijke voorschriften voor het handelsverkeer en de invoer in de Gemeenschap van dieren, sperma,
      eicellen en embryo's waarvoor ten aanzien van de veterinairrechtelijke voorschriften geen specifieke communautaire
      regelgeving als bedoeld in bijlage A, onder I, van Richtlijn 90/425/EEG geldt (PbEG L 268);

      v. richtlijn 90/429/EG: Richtlijn nr. 90/429/EEG van de Raad van de Europese Gemeenschappen van 26 juni 1990 tot
      vaststelling van de veterinairrechtelijke voorschriften van toepassing op het intracommunautaire handelsverkeer in
      sperma van varkens en de invoer daarvan (PbEG L 224);

      w. richtlijn 2009/156/EG: Richtlijn 2009/156/EG van de Raad van 30 november 2009 tot vaststelling van
      veterinairrechtelijke voorschriften voor het verkeer van paardachtigen en de invoer van paardachtigen uit derde
      landen (PbEG L 192);

      x. richtlijn 91/68/EG: Richtlijn 91/68/EEG van de Raad van 28 januari 1991 inzake veterinairrechtelijke
      voorschriften voor het intracommunautaire handelsverkeer in schapen en geiten (PbEG L 046);

      y. beschikking 90/242/EEG: Beschikking 90/242/EEG van de Raad van 21 mei 1990 inzake een financiële actie van de
      Gemeenschap voor de uitroeiing van schape- en geitebrucellose (PbEG L 97);

      z. verordening (EG) nr. 2073/2005: verordening van de Commissie van 15 november 2005 inzake microbiologische
      criteria voor levensmiddelen (PbEGL 338);

      aa. verordening (EG) nr. 2160/2003: verordening (EG) nr. 2160/2003 van het Europees Parlement en de Raad van 17
      november 2003 inzake de bestrĳding van salmonella en andere specifieke door voedsel overgedragen zoönoseverwekkers
      (PbEG L 325);

      ab. verordening (EU) nr. 200/2010: verordening (EU) nr. 200/2010 van de Commissie van 10 maart 2010 ter uitvoering
      van Verordening (EG) nr. 2160/2003 van het Europees Parlement en de Raad wat betreft een doelstelling van de Unie
      voor het verminderen van de prevalentie van serotypen Salmonella bij volwassen vermeerderingskoppels van Gallus
      gallus (PbEU L 61);

      ac. verordening (EU) nr. 517/2011: verordening (EU) nr. 517/2011 van de Commissie van 25 mei 2011 ter uitvoering
      van Verordening (EG) nr. 2160/2003 van het Europees Parlement en de Raad wat betreft een doelstelling van de Unie
      voor het verminderen van de prevalentie van bepaalde serotypes van salmonella bij legkippen van Gallus gallus en
      tot wijziging van verordening (EG) nr. 2160/2003 en verordening (EU) nr. 200/2010 van de Commissie (PbEU L 138);

      ad. verordening (EU) nr. 200/2012: verordening (EU) nr. 200/2012 van de Commissie van 8 maart 2012 tot vaststelling
      van een doelstelling van de Unie voor het terugdringen van Salmonella enteritidis en Salmonella typhimurium bij
      koppels slachtkuikens, als vastgesteld in verordening (EG) nr. 2160/2003 van het Europees Parlement en de Raad
      (PbEU L 71);

      ae. verordening (EU) nr. 1190/2012: verordening (EU) nr. 1190/2012 van de Commissie van 12 december 2012 tot
      vaststelling van een doelstelling van de Unie voor het terugdringen van Salmonella enteritidis en Salmonella
      typhimurium bij koppels kalkoenen, als vastgesteld in Verordening (EG) nr. 2160/2003 van het Europees Parlement en
      de Raad (PbEU L 340);

      af. verordening (EG) nr. 1266/2007: verordening (EG) nr. 1266/2007 van de Commissie van de Europese Gemeenschappen
      van 26 oktober 2007 tot vaststelling van uitvoeringsbepalingen voor richtlijn 2000/75/EG van de Raad van de
      Europese Unie wat betreft bestrijding, monitoring, surveillance en beperkingen op de verplaatsingen van bepaalde
      dieren van vatbare soorten in verband met bluetongue (PbEG L 283);

      ag. richtlijn 91/68/EG: Richtlijn 91/68/EEG van de Raad van 28 januari 1991 inzake veterinairrechtelijke
      voorschriften voor het intracommunautaire handelsverkeer in schapen en geiten (PbEG L 46).


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel3
