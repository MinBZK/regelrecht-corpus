    text: |-
      1 Wageningen Bioveterinary Research, te Lelystad is aangewezen om de onderzoeken, bedoeld in de bijlage, onder 1
      tot en met 10 en 12 tot en met 25, uit te voeren.

      2 De Gezondheidsdienst voor Dieren is aangewezen om de onderzoeken, bedoeld in de bijlage onder 2, voor zover
      het betrekking heeft op testen voor de screening van individuele dieren, 3, voor zover het betrekking heeft op de
      monitoring van runderen, onder 26, 27, 28 en 29 uit te voeren.
