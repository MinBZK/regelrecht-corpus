preamble:
  text: Gelet op artikel 10 a, eerste en tweede lid, en artikel 11 van het Reglement voor de binnenvisserij 1985;
  url: https://wetten.overheid.nl/BWBR0014543/2005-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Als zoetwatervis wordt aangewezen vis behorende tot de vissoorten aal, snoekbaars, baars, snoek, zeelt, brasem,
      karper, ruisvoorn en blankvoorn.
    url: https://wetten.overheid.nl/BWBR0014543/2005-01-01#Artikel1
  - number: '2.1'
    text: |-
      Degene die zoetwatervis aanvoert, degene die in de uitoefening van een beroep of bedrijf zoetwatervis afneemt en
      degene die bemiddeling verleent bij het veilen van zoetwatervis zijn verplicht dagelijks een administratie bij te
      houden van de overdracht en de opslag van zoetwatervis.
    url: https://wetten.overheid.nl/BWBR0014543/2005-01-01#Artikel2
  - number: '2.2'
    text: |-
      Degene die bemiddeling verleent bij het veilen van zoetwatervis is verplicht er voor zorg te dragen dat op of
      bij de op de veiling aanwezige zoetwatervis de naam van de aanvoerder is vermeld alsmede de herkomst van de
      zoetwatervis.
    url: https://wetten.overheid.nl/BWBR0014543/2005-01-01#Artikel2
  - number: '3.1'
    text: |-
      In het geval een aanvoerder van zoetwatervis meer dan 5 kilogram zoetwatervis onder zich houdt, moet uit de
      administratie, bedoeld in [artikel 2][ref1], blijken:


      [ref1]: https://wetten.overheid.nl/BWBR0014543#Artikel2
    url: https://wetten.overheid.nl/BWBR0014543/2005-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0014543
        artikel: '2'
  - number: 3.1.a
    text: de vissoort;
    url: https://wetten.overheid.nl/BWBR0014543/2005-01-01#Artikel3
  - number: 3.1.b
    text: per vissoort de hoeveelheid;
    url: https://wetten.overheid.nl/BWBR0014543/2005-01-01#Artikel3
  - number: 3.1.c
    text: de plaats van opslag;
    url: https://wetten.overheid.nl/BWBR0014543/2005-01-01#Artikel3
  - number: 3.1.d
    text: de datum van aanvoer van de zoetwatervis en de datum van verkoop;
    url: https://wetten.overheid.nl/BWBR0014543/2005-01-01#Artikel3
  - number: 3.1.e
    text: herkomst van de zoetwatervis;
    url: https://wetten.overheid.nl/BWBR0014543/2005-01-01#Artikel3
  - number: 3.1.f
    text: de naam van de afnemer.
    url: https://wetten.overheid.nl/BWBR0014543/2005-01-01#Artikel3
  - number: '3.2'
    text: |-
      In het geval de zoetwatervis zonder bemiddeling van een veiling of visafslag wordt verkocht, moet uit de
      administratie van de afnemer blijken:
    url: https://wetten.overheid.nl/BWBR0014543/2005-01-01#Artikel3
  - number: 3.2.a
    text: de vissoort;
    url: https://wetten.overheid.nl/BWBR0014543/2005-01-01#Artikel3
  - number: 3.2.b
    text: per vissoort de hoeveelheid;
    url: https://wetten.overheid.nl/BWBR0014543/2005-01-01#Artikel3
  - number: 3.2.c
    text: de datum van aanvoer van de zoetwatervis en de datum van verkoop;
    url: https://wetten.overheid.nl/BWBR0014543/2005-01-01#Artikel3
  - number: 3.2.d
    text: de naam van de aanvoerder en diens woonadres;
    url: https://wetten.overheid.nl/BWBR0014543/2005-01-01#Artikel3
  - number: 3.2.e
    text: de herkomst van de zoetwatervis.
    url: https://wetten.overheid.nl/BWBR0014543/2005-01-01#Artikel3
  - number: '3.3'
    text: |-
      In het geval de zoetwatervis via de bemiddeling van een veiling ter verkoop wordt aangeboden, moet uit de
      administratie van de veiling blijken:
    url: https://wetten.overheid.nl/BWBR0014543/2005-01-01#Artikel3
  - number: 3.3.a
    text: de vissoort;
    url: https://wetten.overheid.nl/BWBR0014543/2005-01-01#Artikel3
  - number: 3.3.b
    text: per vissoort de hoeveelheid;
    url: https://wetten.overheid.nl/BWBR0014543/2005-01-01#Artikel3
  - number: 3.3.c
    text: de naam van de aanvoerder;
    url: https://wetten.overheid.nl/BWBR0014543/2005-01-01#Artikel3
  - number: 3.3.d
    text: de naam van de afnemer;
    url: https://wetten.overheid.nl/BWBR0014543/2005-01-01#Artikel3
  - number: 3.3.e
    text: de datum van de aanvoer van de zoetwatervis en de datum van verkoop;
    url: https://wetten.overheid.nl/BWBR0014543/2005-01-01#Artikel3
  - number: 3.3.f
    text: de herkomst van de zoetwatervis.
    url: https://wetten.overheid.nl/BWBR0014543/2005-01-01#Artikel3
  - number: '4.1'
    text: |-
      Alle bewijsstukken of bescheiden waarin de gegevens, bedoeld [artikel 3][ref1], zijn vastgelegd, dienen vanaf het
      tijdstip van hun opstelling of verkrijging tot het tijdstip waarop drie kalenderjaren zijn verlopen, te worden
      bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0014543#Artikel3
    url: https://wetten.overheid.nl/BWBR0014543/2005-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0014543
        artikel: '3'
  - number: '4.2'
    text: |-
      Op eerste vordering van een bevoegde ambtenaar van de Algemene Inspectiedienst van het Ministerie van Landbouw,
      Natuur en Voedselkwaliteit dienen de bewijsstukken of bescheiden als bedoeld in het eerste lid te worden
      overgelegd.
    url: https://wetten.overheid.nl/BWBR0014543/2005-01-01#Artikel4
  - number: '5'
    text: |-
      Deze regeling is niet van toepassing op een inrichting waarvoor een vergunning ingevolge
      [artikel 3, eerste lid, onder a of c, van de Drank- en Horecawet][ref1] is vereist, of waarvan de ondernemer
      inschrijfplichtig is bij het Bedrijfschap Horeca en op de gespecialiseerde ondernemingen die bedrijfsmatig aan
      particulieren visproducten verkopen.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel3
    url: https://wetten.overheid.nl/BWBR0014543/2005-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '3'
  - number: '6.1'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0014543/2005-01-01#Artikel6
  - number: '6.2'
    text: 'Deze regeling wordt aangehaald als: Regeling eisen aan administratie inzake zoetwatervis.'
    url: https://wetten.overheid.nl/BWBR0014543/2005-01-01#Artikel6
