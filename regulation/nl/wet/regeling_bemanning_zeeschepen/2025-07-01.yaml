        bwb_id: BWBR0051068
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.5'
  - number: 4.5.18.4
    text: |-
      De minister kan bij de toepassing van het derde of vierde lid bepalen binnen welke tijdsduur de voor te schrijven
      wijzigingen moeten zijn uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.18
  - number: 4.6.1.1
    text: |-
      Een aanvraag voor een certificaat maritieme arbeid of een voorlopig certificaat maritieme arbeid wordt schriftelijk
      ingediend bij een op grond van [artikel 39, eerste lid, van de wet][ref1] aangewezen ambtenaar of rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel39
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.6.1
