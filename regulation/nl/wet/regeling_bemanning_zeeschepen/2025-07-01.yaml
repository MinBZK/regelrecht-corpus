  - number: 3.6.1.1
    text: |-
      Een door de minister als keuringsarts aangewezen geneeskundige voldoet aan de voorwaarden opgenomen in
      [bijlage 10][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0051068
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.6.1
    references:
      - id: ref1
        bwb_id: BWBR0051068
  - number: 3.6.1.2
    text: |-
      Een door de minister als keuringsarts erkend geneeskundige voldoet aan de voorwaarden opgenomen in
      [bijlage 11][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0051068
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.6.1
    references:
      - id: ref1
        bwb_id: BWBR0051068
  - number: 3.6.2.1
    text: 'De keuringsarts controleert voorafgaand aan de keuring:'
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.6.2
  - number: 3.6.2.1.a
    text: het identiteitsbewijs van de keurling;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.6.2
  - number: 3.6.2.1.b
    text: |-
      de keuringsstatus van de keurling, teneinde na te gaan of de keurling reeds door een andere keuringsarts is
      afgekeurd;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.6.2
  - number: 3.6.2.1.c
    text: |-
      in geval de keurling afkomstig is uit of woont in een door de Wereldgezondheidsorganisatie aangewezen risicogebied,
      de uitslag van een onderzoek op tuberculose dat niet langer dan één maand voorafgaand aan de keuring heeft
      plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.6.2
  - number: 3.6.2.1.d
    text: |-
      indien van toepassing, een geldige ontheffing als bedoeld in [artikel 3.6.3, vierde lid, van het besluit][ref1],
      afgegeven namens de minister door de Medisch Adviseur Scheepvaart.


      [ref1]: https://wetten.overheid.nl/BWBR0050941#Artikel3
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.6.2
    references:
      - id: ref1
        bwb_id: BWBR0050941
        artikel: '3'
  - number: 3.6.3.1
    text: |-
      De keuring vindt plaats met inachtneming van de keuringsaanwijzingen en overeenkomstig de medische maatstaven
      opgenomen in bijlage 12 en appendix A tot en met E van Guidelines on the medical examinations of seafarers van de
      International Labour Office, Sectoral Activities Programme van de International Migration Organization 2013 (ILO/
      IMO/JMS/2011/12).
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.6.3
  - number: 3.6.3.2
    text: De instructies van de Medisch Adviseur Scheepvaart tijdens de keuring worden opgevolgd.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.6.3
  - number: 3.6.3.3
    text: |-
      Bij de keuring maakt de keuringsarts gebruik van het keuringsformulier, opgenomen in
      [bijlage 13][ref1]. De keuringsarts bewaart het keuringsformulier en eventuele andere stukken die
      betrekking hebben op het onderzoek gedurende de termijn en op de wijze, bepaald bij of krachtens de
      [Wet op de geneeskundige behandelingsovereenkomst][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0051068
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Afdeling5
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.6.3
    references:
      - id: ref1
        bwb_id: BWBR0051068
      - id: ref2
        bwb_id: BWBR0005290
        afdeling: '5'
  - number: 3.6.3.4
    text: |-
      De keuring van de algemene lichamelijke geschiktheid omvat een onderzoek naar de voorheen doorgemaakte ziekten en
      overkomen ongevallen (anamnese), de in de familie voorkomende erfelijke en chronische ziekten (familieanamnese),
      een algemene beoordeling van de geestelijke gesteldheid van de keurling, chemisch onderzoek van urine, alsmede een
      algemeen onderzoek van het lichaam, het gezichtsorgaan en het gehoororgaan op een dusdanige wijze dat kan worden
      vastgesteld of de kandidaat voldoet aan de maatstaven, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.6.3
  - number: 3.6.4.1
    text: |-
      Indien op grond van de medische eisen, bedoeld in [artikel 3.6.3, eerste lid][ref1], een specialistisch rapport is
      voorgeschreven of bij twijfel of wordt voldaan aan de medische eisen, vraagt de keuringsarts informatie op bij de
      behandelend arts.


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel3
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.6.4
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: 3.6.4.2
    text: |-
      Bij het ontbreken van voldoende informatie verwijst de keuringsarts de keurling voor een deelonderzoek naar een
      specialist.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.6.4
  - number: 3.6.4.3
    text: |-
      De keuring wordt door de keuringsarts afgerond na ontvangst van de informatie van de behandelend arts of de uitslag
      van het specialistisch deelonderzoek.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.6.4
  - number: 3.6.5.1
    text: |-
      De keuringsarts die een keuring heeft verricht waarvan de uitslag gunstig is, overhandigt aan de keurling een
      geneeskundige verklaring zeevaart ter ondertekening door de keurling.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.6.5
  - number: 3.6.5.2
    text: Op de verklaring worden in ieder geval de functiecategorie, geldigheidsduur en -gebied vermeld.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.6.5
  - number: 3.6.5.3
    text: |-
      De keuringsarts bekrachtigt de door de keurling ondertekende geneeskundige verklaring zeevaart met zijn
      handtekening en naamstempel.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.6.5
  - number: 3.6.5.4
    text: |-
      Het model voor de geneeskundige verklaring zeevaart is opgenomen in [bijlage 14][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0051068
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.6.5
    references:
      - id: ref1
        bwb_id: BWBR0051068
  - number: 3.6.6.1
    text: |-
      Indien de afgifte van een geneeskundige verklaring zeevaart wordt geweigerd, deelt de keuringsarts dit aan de
      keurling mede onder vermelding van de reden of redenen tot afkeuring. De keuringsarts deelt tevens mede dat de
      keurling recht heeft op een herkeuring.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.6.6
  - number: 3.6.6.2
    text: |-
      De keuringsarts overhandigt aan de keurling een exemplaar van de verklaring van medische ongeschiktheid en vermeldt
      daarop de reden of redenen tot afkeuring.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.6.6
  - number: 3.6.6.3
    text: |-
      De weigering tot afgifte kan slechts geschieden indien de volledige keuring is uitgevoerd overeenkomstig de
      [artikelen 3.6.3][ref1] en [3.6.4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0051068#Artikel3
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.6.6
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.6'
      - id: ref2
        bwb_id: BWBR0051068
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: 3.6.6.4
    text: |-
      Van iedere afkeuring voor de zeevaart doet de keuringsarts onverwijld mededeling aan de Medisch Adviseur
      Scheepvaart door middel van een verklaring van medische ongeschiktheid, waarin de reden of redenen tot afkeuring
      zijn vermeld.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.6.6
  - number: 3.6.6.5
    text: |-
      Indien de keuringsarts bij een onderzoek op grond van [artikel 33, tweede lid, van de wet][ref1] bemerkt dat de
      keurling tijdelijk dan wel blijvend ongeschikt is voor de zeevaart, handelt hij als beschreven in het eerste tot en
      met vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel33
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.6.6
    references:
      - id: ref1
        bwb_id: BWBR0050681
        artikel: '33'
  - number: 3.6.6.6
    text: |-
      De keurling die een herkeuring wenst, richt zich daartoe tot een medisch scheidsrechter als bedoeld in
      [artikel 32, eerste lid, van de wet][ref1] onder overlegging van diens exemplaar van het de verklaring van
      medische ongeschiktheid.


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel32
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.6.6
    references:
      - id: ref1
        bwb_id: BWBR0050681
        artikel: '32'
  - number: 3.6.6.7
    text: |-
      Het model voor de verklaring van medische ongeschiktheid is het model, opgenomen in
      [bijlage 6.3 van de Binnenvaartregeling][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025958
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.6.6
    references:
      - id: ref1
        bwb_id: BWBR0025958
  - number: 3.6.7.1
    text: |-
      Indien de keuringsarts de geneeskundige verklaring zeevaart niet kan afgeven vanwege tijdelijke ongeschiktheid kan
      herkeuring uitsluitend plaatsvinden door dezelfde keuringsarts die de keurling ongeschikt heeft bevonden, tenzij de
      keurling gebruik wenst te maken van het recht tot herkeuring door een aangewezen medisch scheidsrechter.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.6.7
  - number: 3.6.7.2
    text: |-
      Indien de keuringsarts de geneeskundige verklaring zeevaart niet kan afgeven vanwege blijvende ongeschiktheid kan
      herkeuring uitsluitend plaatsvinden door een aangewezen medisch scheidsrechter.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.6.7
  - number: 3.6.8.1
    text: |-
      Bij het uitvoeren van een herkeuring zijn de [artikelen 3.6.3][ref1] en [3.6.4][ref2] van overeenkomstige
      toepassing, met dien verstande dat reeds door de keuringsarts in orde bevonden onderdelen van de keuring niet
      behoeven te worden herhaald tenzij over de uitslag twijfel bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0051068#Artikel3
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.6.8
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.6'
      - id: ref2
        bwb_id: BWBR0051068
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: 3.6.8.2
    text: |-
      In voorkomende gevallen kan de herkeuring bestaan uit het uitsluitend beoordelen van de ter beschikking staande
      medische gegevens.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.6.8
  - number: 3.6.8.3
    text: |-
      Ingeval van een gunstige uitslag van de herkeuring is artikel [3.6.5][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel3
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.6.8
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: 3.6.8.4
    text: |-
      Indien de medisch scheidsrechter de geneeskundige verklaring zeevaart niet kan afgeven zijn het
      [eerste en vijfde lid van artikel 3.6.6][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel3
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.6.8
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: 3.6.8.5
    text: |-
      Voor de afgifte van een ontheffing als bedoeld in [artikel 32, vijfde lid, van de wet][ref1] brengt de medisch
      scheidsrechter advies uit aan de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel32
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.6.8
    references:
      - id: ref1
        bwb_id: BWBR0050681
        artikel: '32'
  - number: 3.7.1
    text: 'Een training als bedoeld in deze regeling:'
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.7.1
  - number: 3.7.1.a
    text: wordt verzorgd door een door de minister erkend trainingsinstituut; en
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.7.1
  - number: 3.7.1.b
    text: is door de minister erkend.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.7.1
  - number: 3.7.2.1
    text: Een trainingsinstituut dient een aanvraag om erkenning schriftelijk in bij de minister.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.7.2
  - number: 3.7.2.2
    text: 'Een aanvraag als bedoeld in het eerste lid bevat ten minste de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.7.2
  - number: 3.7.2.2.a
    text: de naam van het trainingsinstituut; en
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.7.2
  - number: 3.7.2.2.b
    text: |-
      een afschrift van het door het trainingsinstituut gehanteerde management- en kwaliteitssysteem, alsmede een rapport
      betreffende het functioneren ervan opgemaakt door een van het trainingsinstituut onafhankelijke instantie of
      certificerende instelling.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.7.2
  - number: 3.7.3
    text: 'Een trainingsinstituut wordt door de minister erkend voor een periode van niet meer dan vijf jaar:'
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.7.3
  - number: 3.7.3.a
    text: |-
      indien de documentbeoordeling van het management- en kwaliteitssysteem op de volgende onderdelen akkoord is
      bevonden door de Inspectie Leefomgeving en Transport:
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.7.3
  - number: 3.7.3.a.1°
    text: Het deelnemers inschrijving- en registratiesysteem;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.7.3
  - number: 3.7.3.a.2°
    text: Het deelnemers competentie- of certificaat register;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.7.3
  - number: 3.7.3.a.3°
    text: Het competentie management van docenten en instructeurs;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.7.3
  - number: 3.7.3.a.4°
    text: Het kwaliteitsmanagement van de lesmiddelen en de faciliteiten;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.7.3
  - number: 3.7.3.a.5°
    text: Het kwaliteitsmanagement van de afzonderlijke trainingen;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.7.3
  - number: 3.7.3.a.6°
    text: |-
      Het vastgesteld beleid met betrekking tot de bescherming van persoonsgegevens op grond van [Verordening (EU)
      2016/679](32016R0679) van het Europees Parlement en de Raad van 27 april 2016 betreffende de bescherming van
      natuurlijke personen in verband met de verwerking van persoonsgegevens en betreffende het vrije verkeer van die
      gegevens en tot intrekking van [Richtlijn 95/46/EG](31995L0046) (algemene verordening gegevensbescherming) (PbEU
      2009/L 119), bij het gebruik van computer en online registratie van de trainingen, Learning Management Systemen
      (LMS), e-learning, les en assessment applicaties met het bijbehorende cursisten identificatie systeem, indien van
      toepassing;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.7.3
  - number: 3.7.3.a.7°
    text: het vastgestelde examenreglement; en
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.7.3
  - number: 3.7.3.b
    text: |-
      na een positieve documentbeoordeling, zo nodig nadat de werking van het management- en kwaliteitssysteem van het
      trainingsinstituut op de locatie van het trainingsinstituut door de Inspectie Leefomgeving en Transport positief
      is beoordeeld.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.7.3
  - number: 3.7.4.1
    text: |-
      Het management- en kwaliteitssysteem voldoet aan NEN-EN-ISO 9001 of een gelijkwaardig management- en
      kwaliteitssysteem voor wat betreft productontwikkeling en productkwaliteitszorg.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.7.4
  - number: 3.7.4.2
    text: |-
      De werking van het management- en kwaliteitssysteem van een trainingsinstituut als bedoeld in
      [artikel 3.7.3, eerste lid, onder a][ref1], wordt beoordeeld door een onafhankelijke certificerende instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel3
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.7.4
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.7'
  - number: 3.7.4.3
    text: Het trainingsinstituut beschikt over een register van afgegeven bekwaamheidsbewijzen of trainingscertificaten.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.7.4
  - number: 3.7.4.4
    text: Het trainingsinstituut voldoet aan de eisen opgenomen in artikel 11 van [richtlijn (EU) 2022/993](32022L0993).
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.7.4
  - number: 3.7.4.5
    text: |-
      In afwijking van het vierde lid voldoet het trainingsinstituut in het geval van trainingen die niet voortkomen uit
      [richtlijn (EU) 2022/993](32022L0993) aan de eisen vastgelegd in de toepasselijke verdragen en codes.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.7.4
  - number: 3.7.5.1
    text: Een erkend trainingsinstituut dient voor elke afzonderlijke training een aanvraag om erkenning in bij de minister.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.7.5
  - number: 3.7.5.2
    text: 'Een aanvraag als bedoeld in het eerste lid bevat ten minste de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.7.5
  - number: 3.7.5.2.a
    text: de naam van de training;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.7.5
  - number: 3.7.5.2.b
    text: het door het trainingsinstituut tijdens de training te gebruiken lesmateriaal;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.7.5
  - number: 3.7.5.2.c
    text: een opgave van de voor de training te gebruiken apparatuur;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.7.5
  - number: 3.7.5.2.d
    text: |-
      een lesplan, dat inzicht geeft in de inhoud en tijdsduur van de training en de te volgen examenprocedures of
      assessment procedure; en
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.7.5
  - number: 3.7.5.2.e
    text: het format van het bekwaamheidsbewijs of het trainingscertificaat dat wordt afgegeven door het trainingsinstituut.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.7.5
  - number: 3.7.5.3
    text: 'Een training wordt door de minister erkend indien:'
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.7.5
  - number: 3.7.5.3.a
    text: 'ten behoeve van de documentbeoordeling ten minste de volgende onderdelen zijn overgelegd:'
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.7.5
  - number: 3.7.5.3.a.1°
    text: het lesplan;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.7.5
  - number: 3.7.5.3.a.2°
    text: het te gebruiken lesmateriaal;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.7.5
  - number: 3.7.5.3.a.3°
    text: de competentiecriteria van docenten en instructeurs; en
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.7.5
  - number: 3.7.5.3.b
    text: |-
      na een positieve documentbeoordeling de uitvoering van de training positief beoordeeld wordt, waarbij het bijwonen
      van een training of een onderdeel daarvan door een aangewezen ambtenaar onderdeel van de beoordeling kan zijn.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.7.5
  - number: 3.7.5.3
    text: Een training wordt erkend voor een periode van niet meer dan vijf jaar.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.7.5
  - number: 3.7.6.1
    text: |-
      Een onderdeel van een training kan door een ander trainingsinstituut worden uitgevoerd indien dat instituut voor
      dat onderdeel erkend is door de minister.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.7.6
  - number: 3.7.6.2
    text: |-
      Indien een trainingsinstituut gebruik maakt van oefenobjecten op een locatie van derden en dit onderdeel geheel
      zelf verzorgt, blijkt dit uit de opgave van het lesmateriaal bedoeld in [artikel 3.7.5, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel3
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.7.6
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.7'
  - number: 3.7.7
    text: |-
      Indien een simulator deel uitmaakt van een training voldoet deze training/simulatie aan de eisen opgenomen in
      sectie A-I/12, deel A, van de STCW-code en aan de eisen die voortkomen uit de Leidraad Maritieme Simulator van de
      Inspectie Leefomgeving en Transport.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.7.7
  - number: 3.7.8.1
    text: |-
      Indien het gebruik van reddingmiddelen deel uitmaakt van een training voldoen de reddingsmiddelen aan de
      eisen opgenomen in de bij resolutie MSC.48(66) van de Algemene Vergadering van de IMO aangenomen Code inzake
      reddingsmiddelen (International Life-Saving Appliance Code, LSA-code);
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.7.8
  - number: 3.7.8.2
    text: |-
      Certificering en beproeving van de gebruikte reddingmiddelen voldoen aan de eisen opgenomen in [richtlijn 2014/90/
      EU](32014L0090) van het Europees Parlement en de Raad van 23 juli 2014 inzake uitrusting van zeeschepen en tot
      intrekking van [Richtlijn 96/98/EG](31996L0098) van de Raad (PbEU 2014, L 257).
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.7.8
  - number: 3.7.8.3
    text: Overige gebruikte trainingsmiddelen voldoen aan de vigerende wettelijke eisen en industriestandaarden.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.7.8
  - number: 3.7.9.1
    text: 'De minister kan de erkenning van een trainingsinstituut intrekken, indien:'
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.7.9
  - number: 3.7.9.1.a
    text: |-
      de certificerende instelling, bedoeld in [artikel 3.7.4, tweede lid][ref1], de certificering van het management- en
      kwaliteitsborgingssysteem heeft ingetrokken; of


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel3
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.7.9
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.7'
  - number: 3.7.9.1.b
    text: |-
      er bij een tussentijdse controle dusdanige tekortkomingen zijn vastgesteld dat de kwaliteit van het
      trainingsinstituut niet langer is gegarandeerd.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.7.9
  - number: 3.7.9.2
    text: 'De minister kan de erkenning van een training intrekken, indien:'
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.7.9
  - number: 3.7.9.2.a
    text: niet meer voldaan wordt aan de eisen gesteld aan het verlenen van de erkenning; of
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.7.9
  - number: 3.7.9.2.b
    text: |-
      bij een tussentijdse controle dusdanige tekortkomingen zijn vastgesteld dat de kwaliteit van de training niet
      langer is gegarandeerd.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.7.9
  - number: 3.7.10
    text: |-
      Bij beëindiging van een trainingsinstituut of trainingen verzorgd door een trainingsinstituut wordt het register,
      bedoeld in [artikel 3.7.4, derde lid][ref1], overgedragen aan de minister, die dit register gedurende ten minste
      vijftig jaar bewaart.


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel3
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.7.10
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.7'
  - number: 3.8.1.1
    text: |-
      In afwijking van de [artikelen 3.1.1 tot en met 3.1.4 van het besluit][ref1] is op de afgifte en het vernieuwen van
      een vaarbevoegdheidsbewijs voor het dienstdoen op zeilschepen van minder dan 500 GT dit artikel van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0050941#Artikel3
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.8.1
    references:
      - id: ref1
        bwb_id: BWBR0050941
        artikel: '3'
  - number: 3.8.1.2
    text: |-
      Een vaarbevoegdheidsbewijs voor het dienstdoen op zeilschepen van minder dan 500 GT wordt door de minister
      afgegeven indien de aanvrager met de daarvoor benodigde bekwaamheidsbewijzen en diensttijd aantoont ten minste te
      voldoen aan de desbetreffende minimumeisen in de [artikelen 3.8.4 tot en met 3.8.8][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel3
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.8.1
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.8'
  - number: 3.8.1.3
    text: |-
      Een bekwaamheidsbewijs voor de zeilvaart mag ten hoogste vier jaar voor de afgifte van het gevraagde
      vaarbevoegdheidsbewijs zijn afgegeven.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.8.1
  - number: 3.8.1.4
    text: Een vaarbevoegdheidsbewijs is geldig tot ten hoogste vijf jaar na de datum van afgifte.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.8.1
  - number: 3.8.1.5
    text: |-
      Een geldig vaarbevoegdheidsbewijs of een aanvulling daarop kan worden vernieuwd indien de houder heeft dienstgedaan
      in een naar het oordeel van de minister relevante functie waarvoor een vaarbevoegdheid is vereist en die door de
      houder op grond van de aan hem toegekende vaarbevoegdheden mocht worden vervuld of in een andere, bij regeling van
      de minister vastgestelde, daarmee vergelijkbare functie, gedurende ten minste:
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.8.1
  - number: 3.8.1.5.a
    text: |-
      diensttijd zeilschepen minder dan 500 GT van één seizoen in de periode van vijf jaar voorafgaand aan de datum van
      de aanvraag tot vernieuwing; of
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.8.1
  - number: 3.8.1.5.b
    text: |-
      diensttijd zeilschepen minder dan 500 GT van een half seizoen in de periode van zes maanden voorafgaand aan de
      datum van de aanvraag tot vernieuwing.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.8.1
  - number: 3.8.2.1
    text: |-
      Een vaarbevoegdheidsbewijs of een aanvulling daarop waarvan de geldigheid niet langer dan vijf jaar is verstreken,
      wordt op aanvraag vernieuwd indien de houder:
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.8.2
  - number: 3.8.2.1.a
    text: |-
      een opleiding heeft gevolgd als bedoeld in de [artikelen 3.4.22][ref1] of [3.4.23][ref2] en deze met succes heeft
      afgerond;


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0051068#Artikel3
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.8.2
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.4'
      - id: ref2
        bwb_id: BWBR0051068
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 3.8.2.1.b
    text: |-
      gedurende ten minste een diensttijd zeilschepen minder dan 500 GT van een half seizoen in de periode van zes
      maanden voorafgaand aan de datum van de aanvraag tot vernieuwing in een naar het oordeel van de minister relevante
      functie boven de sterkte heeft dienstgedaan; of
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.8.2
  - number: 3.8.2.1.c
    text: |-
      gedurende ten minste een diensttijd zeilschepen minder dan 500 GT van een half seizoen in de periode van zes
      maanden voorafgaand aan de datum van de aanvraag tot vernieuwing in een naar het oordeel van de minister relevante
      maar lagere functie heeft dienstgedaan dan waarvoor zijn ongeldig geworden vaarbevoegdheidsbewijs gold.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.8.2
  - number: 3.8.2.2
    text: |-
      De minister geeft op aanvraag een vaarbevoegdheidsbewijs af met een geldigheidsduur van ten hoogste zes maanden
      voor de vervulling van een functie als bedoeld in het eerste lid, onderdeel c.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.8.2
  - number: 3.8.2.3
    text: |-
      Een vaarbevoegdheidsbewijs waarvan de geldigheid langer dan vijf jaar is verstreken, wordt op aanvraag vernieuwd
      indien de houder voorafgaand aan de aanvraag een opleiding heeft gevolgd als bedoeld in de [artikelen 3.4.22][ref1]
      of [3.4.23][ref2] en deze met succes heeft afgerond.


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0051068#Artikel3
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.8.2
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.4'
      - id: ref2
        bwb_id: BWBR0051068
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 3.8.3.1
    text: |-
      Een vaarbevoegdheidsbewijs dat verloren is gegaan kan door de minister worden vervangen door een duplicaat, waarvan
      de einddatum overeenkomt met de einddatum op het originele document.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.8.3
  - number: 3.8.3.2
    text: |-
      Indien de aanvrager van een duplicaat aanspraak kan maken op vernieuwing van het vaarbevoegdheidsbewijs, wordt hem
      desgevraagd met inachtneming van het derde lid een vaarbevoegdheidsbewijs afgegeven.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.8.3
  - number: 3.8.4
    text: |-
      Voor de afgifte van een vaarbevoegdheidsbewijs voor de functie kapitein zeilvaart met de beperking tot zeilschepen
      van minder dan 500 GT op reizen in de vaargebieden zeilvaart III en IV, is ten minste vereist:
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.8.4
  - number: 3.8.4.a
    text: het bekwaamheidsbewijs stuurman grote zeilvaart;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.8.4
  - number: 3.8.4.b
    text: het bekwaamheidsbewijs basisveiligheid;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.8.4
  - number: 3.8.4.c
    text: het bekwaamheidsbewijs medische eerste hulp aan boord;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.8.4
  - number: 3.8.4.d
    text: het bekwaamheidsbewijs medische zorg aan boord;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.8.4
  - number: 3.8.4.f
    text: het algemeen certificaat maritieme radiocommunicatie; en
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.8.4
  - number: 3.8.4.g
    text: een diensttijd zeilschepen minder dan 500 GT van twee seizoenen als wachtstuurman zeilvaart.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.8.4
  - number: 3.8.5.1
    text: |-
      Voor de afgifte van een vaarbevoegdheidsbewijs voor de functie kapitein zeilvaart met de beperking tot zeilschepen
      van minder dan 500 GT op reizen in de vaargebieden zeilvaart I, II en IIIA, is ten minste vereist:
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.8.5
  - number: 3.8.5.1.a
    text: het bekwaamheidsbewijs stuurman kleine zeilvaart;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.8.5
  - number: 3.8.5.1.b
    text: het bekwaamheidsbewijs basisveiligheid;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.8.5
  - number: 3.8.5.1.c
    text: het bekwaamheidsbewijs medische eerste hulp aan boord;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.8.5
  - number: 3.8.5.1.e
    text: het beperkt certificaat maritieme radiocommunicatie; en
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.8.5
  - number: 3.8.5.1.f
    text: |-
      een diensttijd zeilschepen minder dan 500 GT van twee seizoenen als wachtstuurman zeilvaart aan boord van
      zeilschepen, waarbij ten hoogste één seizoen op binnenwater is behaald.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.8.5
  - number: 3.8.5.2
    text: |-
      In afwijking van het eerste lid, aanhef en onderdeel f, volstaat een diensttijd van twee seizoenen als
      wachtstuurman zeilvaart aan boord van zeilschepen op binnenwater voor de afgifte van een vaarbevoegdheidsbewijs als
      kapitein zeilvaart met de beperking tot zeilschepen van minder dan 500 GT op reizen in de vaargebieden zeilvaart I
      en II.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.8.5
  - number: 3.8.6
    text: |-
      Voor de afgifte van een vaarbevoegdheidsbewijs als wachtstuurman zeilvaart met de beperking tot zeilschepen van
      minder dan 500 GT op reizen in de vaargebieden zeilvaart III en IV, is ten minste vereist:
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.8.6
  - number: 3.8.6.a
    text: het bekwaamheidsbewijs stuurman kleine zeilvaart;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.8.6
  - number: 3.8.6.b
    text: het bekwaamheidsbewijs basisveiligheid;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.8.6
  - number: 3.8.6.c
    text: het bekwaamheidsbewijs medische eerste hulp aan boord;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.8.6
  - number: 3.8.6.e
    text: het algemeen certificaat maritieme radiocommunicatie; en
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.8.6
  - number: 3.8.6.f
    text: de leeftijd van achttien jaar.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.8.6
  - number: 3.8.7
    text: |-
      Voor de afgifte van een vaarbevoegdheidsbewijs als wachtstuurman zeilvaart met de beperking tot zeilschepen van
      minder dan 500 GT op reizen in de vaargebieden zeilvaart I, II en IIIA, is ten minste vereist:
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.8.7
  - number: 3.8.7.a
    text: het bekwaamheidsbewijs stuurman kleine zeilvaart;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.8.7
  - number: 3.8.7.b
    text: het bekwaamheidsbewijs basisveiligheid;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.8.7
  - number: 3.8.7.c
    text: het bekwaamheidsbewijs medische eerste hulp aan boord;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.8.7
  - number: 3.8.7.e
    text: het beperkt certificaat maritieme radiocommunicatie; en
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.8.7
  - number: 3.8.7.f
    text: de leeftijd van achttien jaar.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.8.7
  - number: 3.8.8
    text: |-
      Voor de afgifte van een vaarbevoegdheidsbewijs als gezel zeilvaart met de beperking tot zeilschepen van minder dan
      500 GT, is ten minste vereist:
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.8.8
  - number: 3.8.8.a
    text: |-
      een schriftelijke verklaring van de kapitein van een Nederlands zeilschip dat de aanvrager heeft aangetoond te
      voldoen aan de eisen van bekwaamheid, bedoeld in sectie A-II/4 van de STCW-code;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.8.8
  - number: 3.8.8.b
    text: het bekwaamheidsbewijs basisveiligheid;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.8.8
  - number: 3.8.8.c
    text: |-
      een diensttijd van 1 seizoen als aankomend gezel zeilvaart, die op een zeilschip in de zeevaart of de binnenvaart
      is behaald. In geval van de binnenvaart wordt minimaal 180 vaardagen, in de functie van deksman of hoger,
      geregistreerd in een dienstboekje als bedoeld in [artikel 5.11 van de Binnenvaartregeling][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0025958#Artikel5
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.8.8
    references:
      - id: ref1
        bwb_id: BWBR0025958
        artikel: '5'
  - number: 3.8.8.d
    text: de leeftijd van zestien jaar.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.8.8
  - number: 3.8.9.1
    text: |-
      Een bekwaamheidsbewijs stuurman grote zeilvaart of stuurman kleine zeilvaart wordt afgegeven door het Landelijke
      Examenbureau voor de Beroepszeilvaart.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.8.9
  - number: 3.8.9.2
    text: Het Landelijk Examenbureau, bedoeld in het eerste lid, heeft rechtspersoonlijkheid.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.8.9
  - number: 3.8.9.3
    text: |-
      Aan het Landelijk Examenbureau zijn een Examencommissie, een College van Gecommitteerden en een College van
      Toezicht verbonden.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.8.9
  - number: 3.8.9.4
    text: |-
      De Examencommissie bestaat uit deskundigen uit het vakgebied en is belast met het opstellen van examens en de
      uitvoering daarvan.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.8.9
  - number: 3.8.9.5
    text: |-
      Het College van Gecommitteerden bestaat ten minste uit één vertegenwoordiger van de bedrijfstak, een
      vertegenwoordiger van de werknemers in de bedrijfstak, een vertegenwoordiger van de bekwaamheidsbewijshouders en
      een vertegenwoordiger van het onderwijs voor de beroepszeilvaart.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.8.9
  - number: 3.8.9.6
    text: Het College van Gecommitteerden kan worden aangevuld met deskundigen uit de Handelsvaart of de Koninklijke Marine.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.8.9
  - number: 3.8.9.7
    text: 'Het College van Gecommitteerden heeft tot taak:'
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.8.9
  - number: 3.8.9.7.a
    text: het opzetten en bewaken van beroepsprofielen;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.8.9
  - number: 3.8.9.7.b
    text: het vaststellen van de eindtermen documenten;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.8.9
  - number: 3.8.9.7.c
    text: het goedkeuren van het door het bestuur van het Examenbureau opgestelde examenreglement; en
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.8.9
  - number: 3.8.9.7.d
    text: het bewaken van het kwaliteitsniveau van de schriftelijke en mondelinge examens.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.8.9
  - number: 3.8.9.8
    text: |-
      Het College van Toezicht is ten minste samengesteld uit één vertegenwoordiger van de bedrijfstak, een
      vertegenwoordiger van het onderwijs voor de beroepszeilvaart en een onafhankelijke jurist. Het College kiest uit
      zijn midden een voorzitter.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.8.9
  - number: 3.8.9.9
    text: |-
      Het Landelijk Examenbureau zendt jaarlijks aan de minister een rapportage van kwaliteitscontroles van het
      gehanteerde management- en kwaliteitssysteem, alsmede een afschrift van het rapport betreffende het functioneren
      ervan opgemaakt door een van het Landelijk Examenbureau onafhankelijke instantie of certificerende instelling.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.8.9
  - number: 3.8.9.10
    text: |-
      De rapportages, bedoeld in het negende lid, bevatten ten minste de geconstateerde tekortkomingen en de daaruit
      voortvloeiende acties voor verbetering.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.8.9
  - number: 3.8.9.11
    text: |-
      De bevoegdheid van het Landelijke Examenbureau tot het afgeven van de bekwaamheidsbewijzen, bedoeld in het eerste
      lid, kan worden ingetrokken, indien naar de mening van de minister uit de kwaliteitscontrole blijkt dat er ernstige
      tekortkomingen zijn geconstateerd, dan wel dat onvoldoende uitvoering wordt gegeven aan het implementeren van
      acties ter verbetering, waardoor de kwaliteit van de examinering onvoldoende is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.8.9
  - number: 3.9.1.1
    text: |-
      De [artikelen 4][ref1], [8][ref2], [9][ref3], [20, eerste en tweede lid][ref4], [68][ref5] en
      [69 van de wet][ref6] zijn van overeenkomstige toepassing op een Caribisch-Nederlands schip dat verder vaart dan
      de gebiedsbegrenzingen, bedoeld in [artikel 41b, tweede lid, van de Regeling veiligheid zeeschepen][ref7], doch
      binnen de Caribische handelszone.


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0050681#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0050681#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0050681#Artikel20
      [ref5]: https://wetten.overheid.nl/BWBR0050681#Artikel68
      [ref6]: https://wetten.overheid.nl/BWBR0050681#Artikel69
      [ref7]: https://wetten.overheid.nl/BWBR0017728#Artikel41b
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.9.1
    references:
      - id: ref1
        bwb_id: BWBR0050681
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0050681
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0050681
        artikel: '9'
      - id: ref4
        bwb_id: BWBR0050681
        artikel: '20'
      - id: ref5
        bwb_id: BWBR0050681
        artikel: '68'
      - id: ref6
        bwb_id: BWBR0050681
        artikel: '69'
      - id: ref7
        bwb_id: BWBR0017728
        artikel: 41b
  - number: 3.9.1.2
    text: |-
      Het bemanningscertificaat, bedoeld in [artikel 20, eerste lid, van de wet][ref1], wordt opgenomen in het SCV-
      veiligheidscertificaat, bedoeld in de [artikelen 5d][ref2] of [5e van de Regeling veiligheid zeeschepen][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0017728#Artikel5d
      [ref3]: https://wetten.overheid.nl/BWBR0017728#Artikel5e
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.9.1
    references:
      - id: ref1
        bwb_id: BWBR0050681
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0017728
        artikel: 5d
      - id: ref3
        bwb_id: BWBR0017728
        artikel: 5e
  - number: 3.9.2.1
    text: |-
      De kapitein, diens plaatsvervanger of de werktuigkundige van een Caribisch-Nederlands schip is, voor zover dat
      vereist is op grond van het bemanningscertificaat, bedoeld in [artikel 3.9.1][ref1], in het bezit van:


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel3
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.9.2
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.9'
  - number: 3.9.2.1.a
    text: |-
      een geldig certificaat voor de op het bemanningscertificaat genoemde functie, afgegeven volgens hoofdstuk 10, deel
      A, onderdelen 1 en 2, van de SCV-code;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.9.2
  - number: 3.9.2.1.b
    text: een bekwaamheidsbewijs basisveiligheid;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.9.2
  - number: 3.9.2.1.c
    text: |-
      een geldige geneeskundige verklaring zeevaart of een gelijkwaardige verklaring afgegeven door een andere
      verdragspartij bij de SCV-code; en
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.9.2
  - number: 3.9.2.1.d
    text: |-
      een basiscertificaat marifonie, een beperkt certificaat maritieme radiocommunicatie of een algemeen certificaat
      maritieme radiocommunicatie als bedoeld in [artikel 12 van de Examenregeling frequentiegebruik 2008][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024285#Artikel12
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.9.2
    references:
      - id: ref1
        bwb_id: BWBR0024285
        artikel: '12'
  - number: 3.9.2.2
    text: 'Overige op het bemanningscertificaat genoemde bemanningsleden:'
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.9.2
  - number: 3.9.2.2.1°
    text: hebben de leeftijd van 16 jaar bereikt;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.9.2
  - number: 3.9.2.2.2°
    text: zijn in het bezit van het bekwaamheidsbewijs basisveiligheid; en
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.9.2
  - number: 3.9.2.2.3°
    text: |-
      zijn in het bezit van een geldige geneeskundige verklaring zeevaart of een gelijkwaardige verklaring afgegeven door
      een andere partij bij de SCV-code.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.9.2
  - number: 3.9.2.3
    text: |-
      Een geldig bemanningscertificaat, afgegeven door een andere verdragspartij bij de SCV-code volgens hoofdstuk 10,
      deel A, artikelen 1 en 2, van de SCV-code, onderdeel a, wordt door de minister vernieuwd indien de aanvrager:
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.9.2
  - number: 3.9.2.3.a
    text: |-
      met een door de scheepsbeheerder ondertekende verklaring als bedoeld in hoofdstuk 10, deel A, artikel 13.1, van
      de SCV-code heeft aangetoond gedurende drie jaar voorafgaand aan de vernieuwing ten minste 45 dagen te hebben
      dienstgedaan in een functie waarvoor het te vernieuwen certificaat is vereist, of met goed gevolg een door de
      minister erkende training heeft afgerond voor de op het bemanningscertificaat genoemde functie die ten minste
      voldoet aan bijlage 11, paragraaf 1 of 2, van de SCV-code; en
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.9.2
  - number: 3.9.2.3.b
    text: |-
      in het bezit is van een geldige geneeskundige verklaring zeevaart of een gelijkwaardige verklaring afgegeven door
      een andere verdragspartij bij de SCV-code.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.9.2
  - number: 3.9.2.4
    text: |-
      Een door de minister afgegeven certificaat dat verloren is gegaan kan worden vervangen door een duplicaat
      certificaat, waarvan de einddatum overeenkomt met de einddatum op het originele document.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.9.2
  - number: 3.9.2.5
    text: |-
      Een certificaat of verklaring als bedoeld in het eerste lid wordt door de houder op verzoek getoond
      aan een ambtenaar van de Inspectie Leefomgeving of Transport, alsmede aan de personen aangewezen in
      [artikel 184 van het Wetboek van Strafvordering BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel184
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.9.2
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '184'
  - number: 3.9.3
    text: |-
      De [artikelen 31 tot en met 34 van de wet][ref1] en [paragraaf 3.6 van het besluit][ref2] zijn van
      overeenkomstige toepassing ten aanzien van de verkrijging van een geldige geneeskundige verklaring zeevaart als
      bedoeld in [artikel 3.9.2][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0050941#Paragraaf3.6
      [ref3]: https://wetten.overheid.nl/BWBR0051068#Artikel3
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.9.3
    references:
      - id: ref1
        bwb_id: BWBR0050681
        artikel: '31'
      - id: ref2
        bwb_id: BWBR0050941
        paragraaf: '3.6'
      - id: ref3
        bwb_id: BWBR0051068
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.9'
  - number: 3.9.4.1
    text: |-
      De kapitein van een Caribisch-Nederlands schip is in het bezit van een geldig certificaat Boatmaster Grade 3
      als bedoeld in artikel 5, deel A, van hoofdstuk 10, van de SCV-code of een ten minste gelijkwaardig certificaat
      afgegeven door een andere partij bij de SCV-code, indien de schipper:
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.9.4
  - number: 3.9.4.1.a
    text: |-
      tegen vergoeding vracht of passagiers vervoert of tegen vergoeding gelegenheid biedt tot uitoefening van sport of
      vrijetijdsbesteding; en
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.9.4
  - number: 3.9.4.1.b
    text: |-
      met diens schip op een afstand niet verder dan de gebiedsbegrenzingen, bedoeld in
      [artikel 41b, tweede lid, van de Regeling veiligheid zeeschepen][ref1], vaart.


      [ref1]: https://wetten.overheid.nl/BWBR0017728#Artikel41b
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.9.4
    references:
      - id: ref1
        bwb_id: BWBR0017728
        artikel: 41b
  - number: 3.9.4.2
    text: |-
      Een certificaat Boatmaster Grade 3 als bedoeld in het eerste lid, aanhef wordt door de minister afgegeven indien
      de aanvrager:
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.9.4
  - number: 3.9.4.2.a
    text: achttien jaar of ouder is;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.9.4
  - number: 3.9.4.2.b
    text: |-
      met goed gevolg een door de minister erkende training heeft afgerond die ten minste voldoet aan de eisen voor Grade
      3, bijlage 11, paragraaf 1, van de SCV-code; en
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.9.4
  - number: 3.9.4.2.c
    text: |-
      in het bezit is van geldige geneeskundige verklaring zeevaart, een gelijkwaardige verklaring afgegeven door een
      andere partij bij de SCV-code of een geldige door een arts ingevulde verklaring medische geschiktheid lokaal
      varende Caribisch-Nederlandse schepen, waaruit blijkt dat de keurling medisch geschikt is voor de functie kapitein
      lokaal varende Caribisch-Nederlandse schepen; en
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.9.4
  - number: 3.9.4.2.d
    text: |-
      een basiscertificaat marifonie, een beperkt certificaat maritieme radiocommunicatie of een algemeen certificaat
      maritieme radiocommunicatie als bedoeld in [artikel 12 van de Examenregeling frequentiegebruik 2008][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024285#Artikel12
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.9.4
    references:
      - id: ref1
        bwb_id: BWBR0024285
        artikel: '12'
  - number: 3.9.4.3
    text: Een certificaat Boatmaster Grade 3 als bedoeld in het eerste lid heeft een geldigheid van ten hoogste drie jaar.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.9.4
  - number: 3.9.4.4
    text: |-
      Een certificaat Boatmaster Grade 3 als bedoeld in het eerste lid wordt door de minister vernieuwd indien de
      aanvrager:
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.9.4
  - number: 3.9.4.4.a
    text: |-
      met een door de scheepsbeheerder ondertekenende verklaring als bedoeld in hoofdstuk 10, deel A, artikel 13.1, van
      de SCV-code heeft aangetoond dat gedurende drie jaar voorafgaand aan de vernieuwing ten minste vijfenveertig dagen
      is dienstgedaan in een functie waarvoor het certificaat Boatmaster Grade 3 is vereist, of dat met goed gevolg een
      door de minister erkende training heeft afgerond die ten minste voldoet aan de eisen voor Grade 3, bijlage 11,
      paragraaf 1, van de SCV-code; en
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.9.4
  - number: 3.9.4.4.b
    text: |-
      in het bezit is van een geldige geneeskundige verklaring zeevaart of een geldige door een arts ingevulde verklaring
      medische geschiktheid lokaal varende Caribisch-Nederlandse schepen, waaruit blijkt dat de keurling medisch geschikt
      is voor de functie kapitein lokaal varende Caribisch-Nederlandse schepen.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.9.4
  - number: 3.9.4.5
    text: |-
      Een certificaat dat verloren is gegaan kan door de minister worden vervangen door een duplicaat certificaat,
      waarvan de einddatum overeenkomt met de einddatum op het originele document.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.9.4
  - number: 3.9.4.6
    text: |-
      Een certificaat als bedoeld in het eerste lid wordt door de houder op verzoek getoond aan een
      ambtenaar van de Inspectie Leefomgeving of Transport alsmede aan de personen aangewezen in
      [artikel 184 van het Wetboek van Strafvordering BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel184
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.9.4
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '184'
  - number: 3.9.5.1
    text: |-
      Indien ten minste één van de vragen van de verklaring medische geschiktheid lokaal varende Caribisch-Nederlandse
      schepen als bedoeld in [artikel 3.9.4, tweede lid, onderdeel c][ref1], met ‘ja’ is beantwoord, is de aanvrager in
      eerste aanleg niet medisch geschikt.


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel3
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.9.5
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.9'
  - number: 3.9.5.2
    text: |-
      Een aanvrager die in eerste aanleg niet medisch geschikt is kan verzoeken om een herbeoordeling bij een
      keuringsarts, waarna de aanvrager bij een positieve beoordeling een geneeskundige verklaring zeevaart verstrekt
      krijgt.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.9.5
  - number: 3.9.5.3
    text: |-
      Een geldige door een arts ingevulde verklaring medische geschiktheid lokaal varende Caribisch-Nederlandse schepen
      als bedoeld in [artikel 3.9.4, tweede lid, onderdeel c][ref1], heeft een geldigheid van ten hoogste drie jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel3
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.9.5
    references:
