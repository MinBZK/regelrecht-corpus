        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.9'
  - number: 3.9.6
    text: |-
      Het model van de certificaten, bedoeld in de [artikelen 3.9.2][ref1] en [3.9.4][ref2], is opgenomen in bijlage 10
      van de SCV-code.


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0051068#Artikel3
