    text: de handtekening van de scheepsbeheerder.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.1.2
  - number: 2.1.3
    text: |-
      Met toepassing van [artikel 5:17 van de Algemene wet bestuursrecht][ref1] kan de scheepsbeheerder worden verplicht
      de bemanningslijsten over een bepaalde periode van één of meer van zijn zeeschepen onverwijld aan de minister toe
      te sturen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.1.3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 2.2.1
    text: |-
      Vrijstelling als bedoeld in [artikel 19, eerste lid, van de wet][ref1] wordt verleend aan een houder van een
      vaarbevoegdheidsbewijs die de nationaliteit bezit van Australië, Canada, Chili, China, Ethiopië, Filippijnen,
      Georgië, Ghana, Hong Kong, India, Indonesië, Jamaica, Kaapverdië, Montenegro, Nieuw-Zeeland, Oekraïne, Oman,
      Pakistan, Peru, de Russische Federatie, Singapore, Turkije, Verenigd Koninkrijk, Verenigde Staten van Amerika,
      Vietnam of Zuid-Afrika.


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel19
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.2.1
    references:
      - id: ref1
        bwb_id: BWBR0050681
        artikel: '19'
  - number: 2.2.2
    text: |-
      De scheepsbeheerder die een persoon uit één van de in [artikel 2.2.1][ref1] genoemde staten als kapitein op
      een zeeschip aanstelt, beschikt over een geldig, aan deze scheepsbeheerder gerichte toestemming als bedoeld in
      [artikel 19, vierde lid, van de wet][ref2] waarop de naam van die persoon is vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0050941#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0050681#Artikel19
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.2.2
    references:
      - id: ref1
        bwb_id: BWBR0050941
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0050681
        artikel: '19'
  - number: 2.2.3.1
    text: |-
      De toestemming, bedoeld in [artikel 2.2.2][ref1], is te allen tijde beschikbaar aan boord van het zeeschip waarop
      een persoon uit één van de in [artikel 2.2.1][ref2] genoemde staten als kapitein dienstdoet.


      [ref1]: https://wetten.overheid.nl/BWBR0050941#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0050941#Artikel2
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.2.3
    references:
      - id: ref1
        bwb_id: BWBR0050941
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0050941
        artikel: '2'
  - number: 2.2.3.2
    text: De scheepsbeheerder bewaart een kopie van de toestemming bij de bemanningslijst van het zeeschip.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.2.3
  - number: 2.2.4
    text: |-
      Vrijstelling als bedoeld in [artikel 19, eerste lid, van de wet][ref1] wordt verleend aan een houder van een
      vaarbevoegdheidsbewijs die de nationaliteit bezit van een lidstaat van de Europese Unie, van een andere staat die
      partij is bij de Overeenkomst inzake de Europese Economische Ruimte of Zwitserland.


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel19
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.2.4
    references:
      - id: ref1
        bwb_id: BWBR0050681
        artikel: '19'
  - number: 2.2.5.1
    text: |-
      De commissies, bedoeld in [artikel 19, vijfde lid, van de wet][ref1], verstrekken informatie over de arbeidsmarkt
      voor Nederlandse zeevarenden in het afgelopen jaar vóór 1 oktober aan de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel19
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.2.5
    references:
      - id: ref1
        bwb_id: BWBR0050681
        artikel: '19'
  - number: 2.2.5.2
    text: 'De informatie, bedoeld in het eerste lid, omvat ten minste:'
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.2.5
  - number: 2.2.5.2.a
    text: het aantal zeevarenden op Nederlandse vloot, gerangschikt naar functie, leeftijd en nationaliteit;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.2.5
  - number: 2.2.5.2.b
    text: |-
      het aantal Nederlandse officieren dat in het verstreken jaar voor het eerst, anders dan als stagiair, is gemonsterd
      op Nederlandse zeeschepen;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.2.5
  - number: 2.2.5.2.c
    text: het aantal beschikbare stageplaatsen;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.2.5
  - number: 2.2.5.2.d
    text: het aantal Nederlandse studenten dat als stagiair is geplaatst;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.2.5
  - number: 2.2.5.2.e
    text: het aantal buitenlandse studenten dat als stagiair is geplaatst, alsmede de nationaliteit van deze stagiairs, en
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.2.5
  - number: 2.2.5.2.f
    text: |-
      het aantal afgegeven geldige toestemmingen tot het aanstellen van een persoon in een andere nationaliteit in de
      functie van kapitein tot 1 oktober, uitgesplitst naar aantal scheepsbeheerders dat aanvragen heeft ingediend en
      nationaliteit van de kapitein.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.2.5
  - number: 2.2.6.1
    text: |-
      Ingeval de privaatrechtelijke regelingen, bedoeld in [artikel 19, vierde lid, van de wet][ref1], zijn vervallen
      zonder dat de werkgevers- en werknemersorganisaties in de sector koopvaardij en zeegaande waterbouw hebben voorzien
      in de vervanging hiervan, geeft de Minister van Infrastructuur en Waterstaat nog gedurende zes maanden na de
      vervaldatum op aanvraag vaarbevoegdheidsbewijzen van erkenning af ten behoeve van scheepsbeheerders die vallen
      onder deze sectoren, zonder dat een bewijs van toestemming is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel19
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.2.6
    references:
      - id: ref1
        bwb_id: BWBR0050681
        artikel: '19'
  - number: 2.2.6.2
    text: |-
      In het geval, bedoeld in het eerste lid, zijn de [artikelen 2.2.2][ref1] en [2.2.3][ref2] van deze regeling niet
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0051068#Artikel2
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.2.6
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0051068
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 2.3.1.1
    text: De minister geeft een monsterboekje af aan degene die bij de aanvraag voldoet aan het tweede lid.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.3.1
  - number: 2.3.1.2
    text: 'Voor de afgifte van een monsterboekje komt uitsluitend in aanmerking, degene die aantoont:'
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.3.1
  - number: 2.3.1.2.a
    text: |-
      een zee-arbeidsovereenkomst of zee-arbeidsovereenkomst in de zeevisserij te zijn aangegaan of zal aangaan, dan wel
      deelneemt of zal deelnemen aan een maatschapsovereenkomst of vennootschap onder firma in de zeevisserij; of
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.3.1
  - number: 2.3.1.2.b
    text: een opleiding te volgen voor een functie waarvoor een vaarbevoegdheidsbewijs vereist is.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.3.1
  - number: 2.3.1.3
    text: |-
      Indien wordt aangetoond dat het monsterboekje nodig is ten behoeve van de uitoefening van hun beroep aan boord van
      een zeeschip, komen tevens de volgende personen voor de afgifte van een monsterboekje in aanmerking:
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.3.1
  - number: 2.3.1.3.a
    text: nautisch/technisch surveyor van erkende organisaties;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.3.1
  - number: 2.3.1.3.b
    text: registerloods;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.3.1
  - number: 2.3.1.3.c
    text: gecertificeerde Noordzeeloods;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.3.1
  - number: 2.3.1.3.d
    text: |-
      schipper zoute veren als bedoeld in [artikel 2.10 van de Binnenvaartregeling][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0025958#Artikel2
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.3.1
    references:
      - id: ref1
        bwb_id: BWBR0025958
        artikel: '2'
  - number: 2.3.1.3.e
    text: maritiem wetenschappelijk onderzoeker;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.3.1
  - number: 2.3.1.3.f
    text: personeel met dienstverlenende taken aan boord van zeeschepen;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.3.1
  - number: 2.3.1.3.g
    text: nautisch of technisch onderhoudspersoneel;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.3.1
  - number: 2.3.1.3.h
    text: nautisch of technisch ondersteunend personeel;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.3.1
  - number: 2.3.1.3.i
    text: medewerker van nautische of technische inspecties van scheepsbeheerders;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.3.1
  - number: 2.3.1.3.j
    text: |-
      detacheringsmedewerker, te werk gesteld via een uitzendbureau of een detacheringsbureau, voor het verrichten van
      werkzaamheden aan boord van zeeschepen;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.3.1
  - number: 2.3.1.3.k
    text: ambtenaar belast met toezichthoudende of handhavende taken aan boord van zeeschepen;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.3.1
  - number: 2.3.1.3.l
    text: degene die het monsterboekje naar het oordeel van de minister ten behoeve van zijn beroepsuitoefening nodig heeft;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.3.1
  - number: 2.3.1.3.m
    text: |-
      andere zeevarenden dan bedoeld in [artikel 2.3.1, tweede lid, onderdeel a][ref1], die in het bezit zijn van een
      geldig Nederlands vaarbevoegdheidsbewijs.


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel2
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.3.1
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.3.2.1
    text: 'Bij het verzoek om afgifte van een monsterboekje worden de volgende bescheiden overgelegd:'
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.3.2
  - number: 2.3.2.1.a
    text: een geldig paspoort of ander geldig nationaliteitsbewijs van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.3.2
  - number: 2.3.2.1.b
    text: een recente pasfoto;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.3.2
  - number: 2.3.2.1.c
    text: het burgerservicenummer van de aanvrager indien deze de Nederlandse nationaliteit heeft;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.3.2
  - number: 2.3.2.1.d
    text: |-
      de bewijsstukken, waarmee wordt aangetoond dat de aanvrager voldoet aan [artikel 2.3.1, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel2
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.3.2
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.3.2.1.e
    text: |-
      zo nodig aanvullende informatie die nodig is om de gegevens, bedoeld in [artikel 2.3.3, eerste lid][ref1], in het
      monsterboekje te kunnen opnemen.


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel2
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.3.2
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.3.2.2
    text: In plaats van de in het eerste lid, onderdeel a, bedoelde bescheiden kunnen kopieën daarvan worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.3.2
  - number: 2.3.2.3
    text: |-
      In plaats van het in het eerste lid, onderdeel c, bedoelde burgerservicenummer kan, indien de aanvrager zijn
      hoofdverblijf niet in Nederland heeft, worden volstaan met bescheiden die in het land van herkomst gebruikelijk
      zijn.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.3.2
  - number: 2.3.2.4
    text: |-
      De aanvraag wordt niet eerder in behandeling genomen dan nadat het tarief, bedoeld in
      [artikel 79, eerste lid, aanhef en onderdeel c, van de wet][ref1], is betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel79
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.3.2
    references:
      - id: ref1
        bwb_id: BWBR0050681
        artikel: '79'
  - number: 2.3.3.1
    text: 'Alvorens het monsterboekje af te geven, tekent de minister in elk geval de volgende gegevens erin aan:'
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.3.3
  - number: 2.3.3.1.a
    text: 'van de zeevarende:'
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.3.3
  - number: 2.3.3.1.a.1°
    text: achternaam en voornamen;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.3.3
  - number: 2.3.3.1.a.2°
    text: plaats en datum van geboorte; en
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.3.3
  - number: 2.3.3.1.a.3°
    text: nationaliteit;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.3.3
  - number: 2.3.3.1.b
    text: de plaats en datum van afgifte;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.3.3
  - number: 2.3.3.1.c
    text: de datum, waarop de geldigheid vervalt.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.3.3
  - number: 2.3.3.2
    text: 'Voorts bevat het monsterboekje:'
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.3.3
  - number: 2.3.3.2.a
    text: een recente pasfoto;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.3.3
  - number: 2.3.3.2.b
    text: de handtekening van de houder.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.3.3
  - number: 2.3.3.3
    text: Een monsterboekje is slechts geldig indien het de handtekening van de zeevarende bevat.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.3.3
  - number: 2.3.3.4
    text: |-
      De kapitein tekent in het monsterboekje van de zeevarende aan, dan wel reikt een alternatieve diensttijdverklaring
      als bedoeld in [artikel 22, derde lid, van de wet][ref1] uit aan een zeevarende, waarin is aangegeven:


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel22
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.3.3
    references:
      - id: ref1
        bwb_id: BWBR0050681
        artikel: '22'
  - number: 2.3.3.4.a
    text: de dag en plaats van aanmonstering;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.3.3
  - number: 2.3.3.4.b
    text: de dag en plaats van afmonstering;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.3.3
  - number: 2.3.3.4.c
    text: de functie waarin de zeevarende heeft dienstgedaan;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.3.3
  - number: 2.3.3.4.d
    text: |-
      de naam en roepletters van het zeeschip en voor een passagiersschip van meer dan 100 GT of meer of een zeeschip,
      niet zijnde een passagiersschip, van 300 GT of meer, het IMO-nummer of ingeval het ontbreken daarvan het CFR-
      nummer;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.3.3
  - number: 2.3.3.4.e
    text: het brutotonnage van het zeeschip of de scheepslengte in geval van een vissersvaartuig;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.3.3
  - number: 2.3.3.4.f
    text: het vermogen van de hoofdvoortstuwingsinstallatie in kW;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.3.3
  - number: 2.3.3.4.g
    text: |-
      het soort zeeschip, onderscheiden naar handelsvaartschip, vissersvaartuig, zeilschip, alsmede werktuiglijke
      voortbeweging door middel van een inwendige verbrandingsmotor, een elektrische voortstuwingsinstallatie of door een
      stoomturbine of gasturbine gedreven voortstuwingsinstallatie;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.3.3
  - number: 2.3.3.4.h
    text: |-
      het type zeeschip, indien van toepassing, onderscheiden naar olietankschip, chemicaliëntankschip,
      vloeibaargastankschip, IGF-schip, hogesnelheidschip of passagiersschip.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.3.3
  - number: 2.3.3.5
    text: |-
      In het monsterboekje dan wel de alternatieve diensttijdverklaring wordt het loon noch enige gedragsbeoordeling
      opgenomen.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.3.3
  - number: 2.3.4.1
    text: |-
      Bij de aanvraag van een vervangend monsterboekje wegens verlies van het reeds afgegeven monsterboekje overlegt
      de aanvrager naast de in [artikel 2.3.2, eerste lid][ref1], genoemde bescheiden, een verklaring over inzake de
      vermissing van het monsterboekje.


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel2
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.3.4
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.3.4.2
    text: |-
      De [artikelen 2.3.1, tweede lid][ref1], [2.3.2][ref2] en [2.3.3][ref3] zijn van overeenkomstige toepassing bij de
      afgifte van een monsterboekje wegens verlies van het eerder afgegeven monsterboekje.


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0051068#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0051068#Artikel2
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.3.4
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0051068
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref3
        bwb_id: BWBR0051068
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.3.5.1
    text: |-
      Het bevoegd gezag van een door de minister erkende training als bedoeld in [artikel 24, vierde lid][ref1], of
      [25, vijfde lid, van de wet][ref2] is bevoegd tot het maken van aantekeningen in het monsterboekje betreffende het
      door de zeevarende met goed gevolg hebben afgerond van die training.


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0050681#Artikel25
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.3.5
    references:
      - id: ref1
        bwb_id: BWBR0050681
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0050681
        artikel: '25'
  - number: 2.3.5.2
    text: |-
      Een monsterboekje is ongeldig, indien een ander dan een van de in het eerste lid bedoelde personen de daarbij
      genoemde aantekeningen of wijzigingen heeft aangebracht.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.3.5
  - number: 2.3.5.3
    text: |-
      Degene die onbevoegd aantekeningen of wijzigingen heeft aangebracht in een monsterboekje, draagt de kosten van de
      vervanging van dat monsterboekje.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.3.5
  - number: 2.3.6.1
    text: |-
      De kapitein bewaart het monsterboekje aan boord van het zeeschip na de aanmonstering en geeft het aan de zeevarende
      terug bij de afmonstering.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.3.6
  - number: 2.3.6.2
    text: |-
      Indien de kapitein het monsterboekje niet kan teruggeven aan de zeevarende, doet hij het toekomen aan de
      scheepsbeheerder die het, onder vermelding van de reden voor het niet teruggeven, zendt aan de minister.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel2.3.6
  - number: 3.1.1.1
    text: |-
      Bij de aanvraag om afgifte van een vaarbevoegdheidsbewijs of een bekwaamheidsbewijs legt de aanvrager de volgende
      bescheiden over aan de minister:
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.1.1
  - number: 3.1.1.1.a
    text: een door hem ingevuld en ondertekend aanvraagformulier;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.1.1
  - number: 3.1.1.1.b
    text: een geldig paspoort of ander geldig nationaliteitsbewijs van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.1.1
  - number: 3.1.1.1.c
    text: een recente pasfoto;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.1.1
  - number: 3.1.1.1.d
    text: het burgerservicenummer van de aanvrager indien deze de Nederlandse nationaliteit heeft;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.1.1
  - number: 3.1.1.1.e
    text: het kennisbewijs of bekwaamheidsbewijs op grond waarvan afgifte wordt gevraagd;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.1.1
  - number: 3.1.1.1.f
    text: de voor het gewenste vaarbevoegdheidsbewijs vereiste bekwaamheidsbewijzen en schriftelijke bewijzen;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.1.1
  - number: 3.1.1.1.g
    text: |-
      een geldige geneeskundige verklaring zeevaart, bedoeld in [artikel 31, eerste lid, van de wet][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel31
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.1.1
    references:
      - id: ref1
        bwb_id: BWBR0050681
        artikel: '31'
  - number: 3.1.1.1.h
    text: een bewijs dat is voldaan aan de vereiste goedgekeurde diensttijd voor het gewenste bewijs.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.1.1
  - number: 3.1.1.2
    text: |-
      Voor de vernieuwing van een vaarbevoegdheidsbewijs is het eerste lid, met uitzondering van onderdeel e, van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.1.1
  - number: 3.1.2.1
    text: |-
      Voor de vernieuwing van een vaarbevoegdheidsbewijs voor een functie in de dekdienst als bedoeld in de
      [artikelen 3.2.2][ref1] en [3.2.3 van het besluit][ref2] wordt de diensttijd in aanmerking genomen die is opgedaan
      in een functie als kapitein of officier in de dekdienst aan boord van zeeschepen van 100 GT of meer niet zijnde
      vissersvaartuigen, of vissersvaartuigen met een lengte van 45 meter of meer.


      [ref1]: https://wetten.overheid.nl/BWBR0050941#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0050941#Artikel3
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.1.2
    references:
      - id: ref1
        bwb_id: BWBR0050941
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0050941
        artikel: '3'
  - number: 3.1.2.2
    text: |-
      Indien diensttijd is opgedaan aan boord van zeeschepen van minder dan 100 GT, niet zijnde vissersvaartuigen of
      vissersvaartuigen met een lengte van minder dan 45 meter, wordt bij vernieuwing van een vaarbevoegdheidsbewijs
      voor een functie in de dekdienst als bedoeld in de [artikelen 3.2.2][ref1] en [3.2.3 van het besluit][ref2] het
      vaarbevoegdheidsbewijs beperkt tot zeeschepen van minder dan 3.000 GT.


      [ref1]: https://wetten.overheid.nl/BWBR0050941#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0050941#Artikel3
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.1.2
    references:
      - id: ref1
        bwb_id: BWBR0050941
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0050941
        artikel: '3'
  - number: 3.1.2.3
    text: |-
      Voor de vernieuwing van een vaarbevoegdheidsbewijs voor een functie in de dekdienst als bedoeld in de
      [artikelen 3.2.4 tot en met 3.2.8 van het besluit][ref1] wordt de diensttijd in aanmerking genomen die is opgedaan
      in een functie als kapitein of officier in de dekdienst aan boord van zeeschepen.


      [ref1]: https://wetten.overheid.nl/BWBR0050941#Artikel3
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.1.2
    references:
      - id: ref1
        bwb_id: BWBR0050941
        artikel: '3'
  - number: 3.1.2.4
    text: |-
      Aanvullend op het eerste lid kan de diensttijd in aanmerking worden genomen die is opgedaan aan boord van
      zeeschepen van minder dan 100 GT, indien er geen sprake is van ophoging van de vaarbevoegdheid en indien ten minste
      24 maanden diensttijd kan worden aangetoond.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.1.2
  - number: 3.1.2.5
    text: |-
      Voor de vernieuwing van een vaarbevoegdheidsbewijs voor een functie in de dekdienst als bedoeld in de
      [artikelen 3.4.2 tot en met 3.4.9][ref1] wordt de diensttijd in aanmerking genomen die is opgedaan in een functie
      als kapitein of officier in de dekdienst aan boord van zeeschepen.


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel3
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.1.2
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 3.1.2.6
    text: |-
      Voor de vernieuwing van een vaarbevoegdheidsbewijs voor een functie in de machinekamerdienst als bedoeld in de
      [artikelen 3.2.11 tot en met 3.2.13][ref1] of [3.4.11 tot en met 3.4.13 van het besluit][ref2] wordt de diensttijd
      in aanmerking genomen die is opgedaan als officier in de machinekamerdienst aan boord van zeeschepen met een
      hoofdvoortstuwingsinstallatie van 750 kW of meer.


      [ref1]: https://wetten.overheid.nl/BWBR0050941#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0050941#Artikel3
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.1.2
    references:
      - id: ref1
        bwb_id: BWBR0050941
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0050941
        artikel: '3'
  - number: 3.1.2.7
    text: |-
      Indien de diensttijd is opgedaan aan boord van zeeschepen met een hoofdvoortstuwingsinstallatie van minder dan
      750 kW wordt bij de vernieuwing van een vaarbevoegdheidsbewijs voor een functie in de machinekamerdienst als
      bedoeld in de [artikelen 3.2.11 tot en met 3.2.13 van het besluit][ref1], het vaarbevoegdheidsbewijs beperkt tot
      zeeschepen met een hoofdvoortstuwingsinstallatie van minder dan 3.000 kW.


      [ref1]: https://wetten.overheid.nl/BWBR0050941#Artikel3
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.1.2
    references:
      - id: ref1
        bwb_id: BWBR0050941
        artikel: '3'
  - number: 3.1.2.8
    text: |-
      Aanvullend op het zesde lid kan de diensttijd in aanmerking worden genomen die is opgedaan aan boord van zeeschepen
      met een hoofdvoortstuwingsinstallatie van minder dan 750 kW, indien er geen sprake is van ophoging van de
      vaarbevoegdheid en indien 24 maanden diensttijd kan worden aangetoond.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.1.2
  - number: 3.1.3.1
    text: |-
      Aanvullend op [artikel 3.1.2][ref1] wordt de diensttijd opgedaan in de functie van een maritiem officier, eerste
      maritiem officier of stuurman-werktuigkundige vissersvaartuigen voor de helft daarvan in aanmerking genomen
      voor de vernieuwing van een vaarbevoegdheidsbewijs als officier in de dekdienst en voor de helft daarvan voor de
      vernieuwing van een vaarbevoegdheidsbewijs als officier in de machinekamerdienst.


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel3
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.1.3
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 3.1.3.2
    text: |-
      Aanvullend op [artikel 3.1.2][ref1] komt voor de vernieuwing van een vaarbevoegdheidsbewijs van een maritiem
      officier, eerste maritiem officier of stuurman-werktuigkundige vissersvaartuigen de diensttijd, opgedaan in een
      functie als kapitein of officier in de dekdienst en de diensttijd, opgedaan in een functie als officier in de
      machinekamerdienst, in aanmerking.


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel3
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.1.3
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 3.1.3.3
    text: |-
      Voor de berekening van de opgedane diensttijd in 2 functies tezamen als bedoeld in het tweede lid wordt slechts de
      diensttijd in acht genomen voor zover deze zich in gelijke mate verhoudt.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.1.3
  - number: 3.1.4.1
    text: |-
      Voor de vernieuwing van een vaarbevoegdheidsbewijs voor een functie als kapitein of officier aan boord van een
      zeeschip in de dekdienst, wordt de diensttijd opgedaan in een relevante functie aan boord van een zeeschip in de
      handelsvaart, zeevisvaart of zeezeilvaartgelijkgesteld, met dien verstande dat er op het moment van de aanvraag tot
      vernieuwing geen sprake is van ophoging van de vaarbevoegdheid.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.1.4
  - number: 3.1.4.2
    text: |-
      Voor de vernieuwing van een vaarbevoegdheidsbewijs voor een functie als officier aan boord van een zeeschip in de
      dekdienst, waarbij er sprake is van ophoging van de vaarbevoegdheid, wordt diensttijd opgedaan op zeeschepen in
      de handelsvaart, zeevisvaart of zeezeilvaart gelijkgesteld, met dien verstande dat in de bedrijfstak waarvoor de
      vernieuwing van het vaarbevoegdheidsbewijs is aangevraagd, ten minste drie maanden diensttijd is opgedaan in een
      functie als officier waarvoor een vaarbevoegdheidsbewijs is vereist.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.1.4
  - number: 3.1.4.3
    text: |-
      In afwijking van het tweede lid wordt voor de vernieuwing van een vaarbevoegdheidsbewijs voor een functie als
      officier aan boord van een zeeschip in de dekdienst, waarbij er sprake is van ophoging van de vaarbevoegdheid,
      diensttijd opgedaan op vissersvaartuigen met een lengte van 45 meter of meer gelijkgesteld aan diensttijd op
      zeeschepen in de handelsvaart.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.1.4
  - number: 3.1.4.4
    text: |-
      Voor de vernieuwing van een vaarbevoegdheidsbewijs voor een functie aan boord van een zeeschip als officier in
      de machinekamerdienst, wordt de diensttijd opgedaan in een relevante functie aan boord van een zeeschip in de
      handelsvaart of zeevisvaart, gelijkgesteld.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.1.4
  - number: 3.1.4.5
    text: |-
      De diensttijd opgedaan als wachtofficier, navigatieofficier of commandant op zeeschepen van de Koninklijke Marine
      van 500 GT of meer wordt gelijkgesteld met diensttijd als bedoeld in het eerste lid. In het geval deze diensttijd
      wordt gebruikt voor het vernieuwen van een vaarbevoegdheidsbewijs, waarbij er sprake is van ophoging van de
      vaarbevoegdheid, dan is het tweede lid van toepassing.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.1.4
  - number: 3.1.4.6
    text: |-
      De diensttijd opgedaan als wachtofficier of technisch officier van de technische dienst op zeeschepen van de
      Koninklijke Marine met een hoofdvoortstuwingsinstallatie van 750 kW of meer, voor zover daadwerkelijk diensttijd
      is opgedaan in de technische centrale en machinekamer wordt gelijkgesteld met diensttijd als bedoeld in het vijfde
      lid.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.1.4
  - number: 3.1.4.7
    text: |-
      Voor de berekening van de diensttijd, bedoeld in het eerste tot en met zesde lid, wordt de diensttijd, opgedaan
      in één van de functies als maritiem officier en in de functie stuurman-werktuigkundige vissersvaartuigen,
      herleid naar diensttijd, opgedaan in de functies als stuurman of werktuigkundige, overeenkomstig het bepaalde in
      [artikel 3.1.3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel3
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.1.4
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 3.1.5
    text: |-
      Voor de vernieuwing van een bekwaamheidsbewijs, is [artikel 3.1.1][ref1] van overeenkomstige toepassing, met
      uitzondering van onderdeel f, en met dien verstande dat de in onderdeel h vereiste diensttijd is opgedaan:


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel3
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.1.5
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 3.1.5.a
    text: |-
      aan boord van olie- of chemicaliëntankschepen, indien het betreft het bekwaamheidsbewijs basis ladingbehandeling
      olie- en chemicaliëntankschepen;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.1.5
  - number: 3.1.5.b
    text: aan boord van gastankschepen, indien het betreft het bekwaamheidsbewijs basis ladingbehandeling gastankschepen;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.1.5
  - number: 3.1.5.c
    text: |-
      aan boord van olie- en chemicaliëntankschepen, indien het betreft het bekwaamheidsbewijs ladingbehandeling olie- en
      chemicaliëntankschepen voor gevorderden;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.1.5
  - number: 3.1.5.d
    text: |-
      aan boord van gastankschepen, indien het betreft het bekwaamheidsbewijs ladingbehandeling gastankschepen voor
      gevorderden.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.1.5
  - number: 3.1.6.1
    text: |-
      Vergelijkbare functies als bedoeld in [artikel 3.1.3, derde lid, van het besluit][ref1] zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0050941#Artikel3
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.1.6
    references:
      - id: ref1
        bwb_id: BWBR0050941
        artikel: '3'
  - number: 3.1.6.1.a
    text: 'voor de functies van kapitein, eerste stuurman of wachtstuurman:'
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.1.6
  - number: 3.1.6.1.a.1°
    text: registerloods;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.1.6
  - number: 3.1.6.1.a.2°
    text: Noordzeeloods;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.1.6
  - number: 3.1.6.1.a.3°
    text: nautisch surveyor van zeeschepen van een erkende organisatie;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.1.6
  - number: 3.1.6.1.a.4°
    text: medewerker van nautische inspecties van scheepsbeheerders;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.1.6
  - number: 3.1.6.1.a.5°
    text: ambtenaar van de Inspectie Leefomgeving en Transport, voor zover betrokken bij het toezicht op zeeschepen;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.1.6
  - number: 3.1.6.1.a.6°
    text: |-
      simulatorinstructeur op een door de Inspectie Leefomgeving en Transport erkende simulator voor
      stuurhuisactiviteiten Nautisch A, zoals opgenomen in de Leidraad maritieme simulatoren;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.1.6
  - number: 3.1.6.1.a.7°
    text: |-
      schipper zoute veren als bedoeld in [artikel 2.10 van de Binnenvaartregeling][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0025958#Artikel2
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.1.6
    references:
      - id: ref1
        bwb_id: BWBR0025958
        artikel: '2'
  - number: 3.1.6.1.a.8°
    text: schipper van een zeegaand reddingvaartuig van de Koninklijke Nederlandse Redding Maatschappij (KNRM).
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.1.6
  - number: 3.1.6.1.b
    text: 'voor de functie van werktuigkundige:'
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.1.6
  - number: 3.1.6.1.b.1°
    text: technisch surveyor van zeeschepen van een erkende organisatie;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.1.6
  - number: 3.1.6.1.b.2°
    text: medewerker van technische inspecties van scheepsbeheerders;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.1.6
  - number: 3.1.6.1.b.3°
    text: |-
      ambtenaar van de Inspectie Leefomgeving en Transport, voor zover daadwerkelijk betrokken bij het toezicht op
      zeeschepen;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.1.6
  - number: 3.1.6.1.b.4°
    text: |-
      simulatorinstructeur op een door de Inspectie Leefomgeving en Transport erkende simulator machinekameractiviteiten
      Technisch A, zoals opgenomen in de Leidraad maritieme simulatoren;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.1.6
  - number: 3.1.6.1.b.5°
    text: werktuigkundige, werkzaam in de binnenvaart;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.1.6
  - number: 3.1.6.1.b.6°
    text: werktuigkundige, werkzaam op elektriciteitscentrales, gemalen en de procesindustrie;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.1.6
  - number: 3.1.6.1.b.7°
    text: werktuigkundige, werkzaam op zeeschepen zonder eigen voortstuwing;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.1.6
  - number: 3.1.6.1.b.8°
    text: werktuigkundige, werkzaam op installaties in de offshore-industrie; en
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.1.6
  - number: 3.1.6.1.b.9°
    text: inbedrijfsteller scheepsinstallaties.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.1.6
  - number: 3.1.6.2
    text: De minister kan andere functies dan de functies, bedoeld in het eerste lid, als vergelijkbare functie aanmerken.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.1.6
  - number: 3.1.6.3
    text: |-
      Een vaarbevoegdheidsbewijs of een aanvulling daarop kan worden vernieuwd indien de houder daarvan in de periode van
      vijf jaar voorafgaand aan de datum van de aanvraag tot vernieuwing, ten minste vierentwintig maanden een functie
      als bedoeld in het eerste of tweede lid heeft vervuld.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.1.6
  - number: 3.1.6.4
    text: |-
      De bevoegdheden waarvoor het vernieuwde vaarbevoegdheidsbewijs geldig is, zijn niet ruimer dan die, welke bij
      aanvang van de vergelijkbare functie bestonden.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.1.6
  - number: 3.1.7.1
    text: |-
      Bij de aanvraag om erkenning van een vaarbevoegdheidsbewijs of een bekwaamheidsbewijs op grond van voorschrift
      I/10 van het STCW-verdrag of hoofdstuk I, voorschrift 7, van het STCW F-verdrag, legt de aanvrager de volgende
      bescheiden over aan de minister:
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.1.7
  - number: 3.1.7.1.a
    text: een door hem ingevuld en ondertekend aanvraagformulier;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.1.7
  - number: 3.1.7.1.b
    text: een geldig identiteitsbewijs waaruit zijn nationaliteit blijkt;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.1.7
  - number: 3.1.7.1.c
    text: een recente pasfoto;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.1.7
  - number: 3.1.7.1.d
    text: het vaarbevoegdheidsbewijs of een bekwaamheidsbewijs waarvan erkenning wordt gevraagd; en
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.1.7
  - number: 3.1.7.1.e
    text: |-
      de geneeskundige verklaring zeevaart, bedoeld in [artikel 31, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel31
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.1.7
    references:
      - id: ref1
        bwb_id: BWBR0050681
        artikel: '31'
  - number: 3.1.7.2
    text: |-
      Indien het vaarbevoegdheidsbewijs waarvan erkenning wordt gevraagd de functie kapitein betreft en is afgegeven door
      de bevoegde autoriteit van een staat, niet zijnde een lidstaat van de Europese Unie, een andere staat die partij is
      bij de Overeenkomst betreffende de Europese Economische Ruimte of de Bondsstaat Zwitserland, overlegt de aanvrager
      tevens het bewijs van schriftelijke toestemming, bedoeld in [artikel 19, vierde lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel19
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.1.7
    references:
      - id: ref1
        bwb_id: BWBR0050681
        artikel: '19'
  - number: 3.1.7.3
    text: |-
      Een vaarbevoegdheidsbewijs of een bekwaamheidsbewijs als bedoeld in het eerste lid afgegeven door een staat als
      bedoeld in het tweede lid, heeft een geldigheidsduur die gelijk is aan die van het door de bevoegde autoriteit van
      die staat afgegeven oorspronkelijke bewijs, maar niet langer dan vijf jaar.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.1.7
  - number: 3.1.7.4
    text: |-
      Het eerste lid is niet van toepassing op de aanvraag van een vaarbevoegdheidsbewijs door een migrerende
      beroepsbeoefenaar als bedoeld in [artikel 2 van de Regeling erkenning EU-beroepskwalificaties zeevisserij][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024144#Artikel2
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.1.7
    references:
      - id: ref1
        bwb_id: BWBR0024144
        artikel: '2'
  - number: 3.1.7.5
    text: |-
      Het tweede lid is niet van toepassing op de aanvraag om erkenning van een vaarbevoegdheidsbewijs voor het
      dienstdoen in de functie van schipper op vissersvaartuigen.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.1.7
  - number: 3.1.8
    text: |-
      Bij een aanvraag om afgifte van een bewijs van aanvraag om erkenning van een vaarbevoegdheidsbewijs als bedoeld in
      [artikel 27, vierde lid, van de wet][ref1] overlegt de aanvrager naast de in [artikel 3.1.7, eerste lid][ref2],
      bedoelde bescheiden, tevens een verklaring van:


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0051068#Artikel3
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.1.8
    references:
      - id: ref1
        bwb_id: BWBR0050681
        artikel: '27'
      - id: ref2
        bwb_id: BWBR0051068
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 3.1.8.a
    text: |-
      de zeewerkgever omtrent het afgesloten zijn van een arbeidsovereenkomst, waarbij de aanvrager zich heeft verbonden
      arbeid aan boord van een zeeschip te verrichten; en
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.1.8
  - number: 3.1.8.b
    text: |-
      de scheepsbeheerder omtrent de authenticiteit van de door de aanvrager overgelegde bescheiden en de juistheid van
      de door deze verstrekte gegevens, voor zover dit door hem kan worden beoordeeld.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.1.8
  - number: 3.2.1
    text: |-
      Voor de afgifte van een vaarbevoegdheidsbewijs voor een functie aan boord van een zeeschip, niet zijnde een
      zeilschip van minder dan 500 GT, is de aanvrager in het bezit van de in [bijlage 1][ref1] en [2][ref2]
      vastgestelde kennisbewijzen en bekwaamheidsbewijzen en wordt ten minste voldaan aan de vastgestelde
      diensttijdvereisten.


      [ref1]: https://wetten.overheid.nl/BWBR0051068
      [ref2]: https://wetten.overheid.nl/BWBR0051068
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.2.1
    references:
      - id: ref1
        bwb_id: BWBR0051068
      - id: ref2
        bwb_id: BWBR0051068
  - number: 3.3.1
    text: |-
      Voor de afgifte van het bekwaamheidsbewijs basis ladingbehandeling olie- en chemicaliëntankschepen, bedoeld
      in [artikel 3.3.1, eerste lid, van het besluit][ref1], is de aanvrager in het bezit van het bekwaamheidsbewijs
      basisveiligheid en heeft de aanvrager met goed gevolg een door de minister erkende training afgerond die voldoet
      aan sectie A-V/1-1, eerste lid, van de STCW-code.


      [ref1]: https://wetten.overheid.nl/BWBR0050941#Artikel3
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.3.1
    references:
      - id: ref1
        bwb_id: BWBR0050941
        artikel: '3'
  - number: 3.3.2
    text: |-
      Voor de afgifte van het bekwaamheidsbewijs olietankschepen voor gevorderden, bedoeld in
      [artikel 3.3.1, tweede lid, van het besluit][ref1], is de aanvrager in het bezit van het bekwaamheidsbewijs basis
      ladingbehandeling olie- en chemicaliëntankschepen en heeft de aanvrager met goed gevolg een door de minister
      erkende training afgerond die voldoet aan sectie A-V/1-1, tweede lid, van de STCW-code.


      [ref1]: https://wetten.overheid.nl/BWBR0050941#Artikel3
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.3.2
    references:
      - id: ref1
        bwb_id: BWBR0050941
        artikel: '3'
  - number: 3.3.3
    text: |-
      Voor de afgifte van het bekwaamheidsbewijs ladingbehandeling chemicaliëntankschepen voor gevorderden, bedoeld in
      [artikel 3.3.1, derde lid, van het besluit][ref1], is de aanvrager in het bezit van het bekwaamheidsbewijs basis
      ladingbehandeling olie- en chemicaliëntankschepen en heeft de aanvrager met goed gevolg een door de minister
      erkende training afgerond die voldoet aan sectie A-V/1-1, derde lid, van de STCW-code.


      [ref1]: https://wetten.overheid.nl/BWBR0050941#Artikel3
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.3.3
    references:
      - id: ref1
        bwb_id: BWBR0050941
        artikel: '3'
  - number: 3.3.4
    text: |-
      Voor de afgifte van het bekwaamheidsbewijs basis ladingbehandeling gastankschepen, bedoeld in
      [artikel 3.3.2, eerste lid, van het besluit][ref1], is de aanvrager in het bezit van het bekwaamheidsbewijs
      basisveiligheid en heeft de aanvrager met goed gevolg een door de minister erkende training afgerond die voldoet
      aan sectie A-V/1-2, eerste lid, van de STCW-code.


      [ref1]: https://wetten.overheid.nl/BWBR0050941#Artikel3
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.3.4
    references:
      - id: ref1
        bwb_id: BWBR0050941
        artikel: '3'
  - number: 3.3.5
    text: |-
      Voor de afgifte van het bekwaamheidsbewijs ladingbehandeling gastankschepen voor gevorderden, bedoeld in
      [artikel 3.3.2, tweede lid, van het besluit][ref1], is de aanvrager in het bezit van het bekwaamheidsbewijs basis
      ladingbehandeling gastankschepen en heeft de aanvrager met goed gevolg een door de minister erkende training
      afgerond die voldoet aan sectie A-V/1-2, tweede lid, van de STCW-code.


      [ref1]: https://wetten.overheid.nl/BWBR0050941#Artikel3
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.3.5
    references:
      - id: ref1
        bwb_id: BWBR0050941
        artikel: '3'
  - number: 3.3.6
    text: |-
      Voor de afgifte van het schriftelijk bewijs dienstverlening aan passagiers, bedoeld in
      [artikel 3.3.3, tweede lid, van het besluit][ref1], heeft de aanvrager met goed gevolg een training afgerond die
      voldoet aan sectie A-V/2, tweede lid, van de STCW-code.


      [ref1]: https://wetten.overheid.nl/BWBR0050941#Artikel3
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.3.6
    references:
      - id: ref1
        bwb_id: BWBR0050941
        artikel: '3'
  - number: 3.3.7
    text: |-
      Voor de afgifte van het bekwaamheidsbewijs of schriftelijk bewijs groepsbegeleiding, bedoeld in
      [artikel 3.3.3, derde lid, van het besluit][ref1], heeft de aanvrager met goed gevolg een training afgerond die
      voldoet aan sectie A-V/2, derde lid, van de STCW-code.


      [ref1]: https://wetten.overheid.nl/BWBR0050941#Artikel3
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.3.7
    references:
      - id: ref1
        bwb_id: BWBR0050941
        artikel: '3'
  - number: 3.3.8
    text: |-
      Voor de afgifte van het bekwaamheidsbewijs of schriftelijk bewijs crisisbeheersing en menselijk gedrag, bedoeld in
      [artikel 3.3.3, vierde lid, van het besluit][ref1], heeft de aanvrager met goed gevolg een door de minister erkende
      training afgerond die voldoet aan sectie A-V/2, vierde lid, van de STCW-code.


      [ref1]: https://wetten.overheid.nl/BWBR0050941#Artikel3
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.3.8
    references:
      - id: ref1
        bwb_id: BWBR0050941
        artikel: '3'
  - number: 3.3.9
    text: |-
      Voor de afgifte van het bekwaamheidsbewijs of schriftelijk bewijs passagiersveiligheid, ladingveiligheid en
