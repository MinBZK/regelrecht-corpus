                    verlichting en waterafvoer


                    norm A3.1, zesde lid, onderdeel g




                    airconditioning


                    norm A3.1, zevende lid, onderdeel b




                    verwarmingssysteem


                    norm A3.1, zevende lid, onderdeel d
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.2
  - number: 4.1.2.2
    text: |-
      Het in het eerste lid bedoelde verwarmingssysteem en de airconditioning kunnen in alle verblijven permanent een
      temperatuur van 20 graden Celsius onderhouden.
