  - number: 4.5.18.3
    text: |-
      Was een vissersvaartuig voor 12 mei 1977 in aanbouw of werd het op of voor die datum verbouwd, dan kan de minister,
      na overleg met de betrokken organisaties van scheepsbeheerders en vissers, ontheffingen verlenen, welke nodig zijn
      om het vissersvaartuig te laten voldoen aan de eisen gesteld in de [artikelen 4.5.3 tot en met 4.5.15][ref1], voor
      zover hij dit mogelijk acht, daarbij rekening houdende met alle praktische problemen welke zich bij de toepassing
      voordoen.


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel4
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.18
    references:
