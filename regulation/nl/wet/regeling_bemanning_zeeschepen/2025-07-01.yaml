      [ref3]: https://wetten.overheid.nl/BWBR0051068#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0051068#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0051068#Artikel4
