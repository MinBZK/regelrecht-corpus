  - number: 4.1.24.1.a
    text: |-
      een buitenlands zeeschip dat op grond van voor Nederland geldende rechtsregels gerechtigd is de vlag van het
      Koninkrijk te gaan voeren en waarvan de kiel is gelegd op of na 20 augustus 2013;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.24
  - number: 4.1.24.1.b
    text: een zeeschip met een innovatief ontwerp of een innovatieve bouwwijze.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.24
  - number: 4.1.24.2
    text: |-
      Een afwijking als bedoeld in het eerste lid wordt slechts toegestaan na overleg met de betrokken organisaties van
      scheepsbeheerders en zeevarenden en onder daarbij te stellen wezenlijk gelijkwaardige voorschriften als bedoeld in
      artikel VI, derde lid, van het MLC-verdrag.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.24
  - number: 4.1.25.1
    text: |-
      Voor de aanvang van de bouw van een zeeschip of een verbouwing of andere wijziging die van invloed is op de
      eisen aan de huisvesting en voorzieningen aan boord, wordt aan de minister een plan overgelegd. Dit plan bevat de
      volgende elementen:
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.25
  - number: 4.1.25.1.a
    text: de plaats en de algemene indeling van de verblijven;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.25
  - number: 4.1.25.1.b
    text: |-
