  - number: 4.1.25.1.f
    text: |-
      eventuele verzoeken tot de toepassing van [artikel 4.1.24][ref1], waarbij wordt aangegeven van welke van de in dat
      artikel genoemde bepalingen afwijking wordt gevraagd; en


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel4
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.25
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.1.25.1.g
    text: |-
      de resultaten van het overleg met de betrokken organisaties van scheepsbeheerders en zeevarenden, voor zover dit
      overleg is voorgeschreven in de in dit lid genoemde bepalingen.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.25
  - number: 4.1.25.2
    text: |-
      Met de bouw, verbouwing of andere wijziging als bedoeld in het eerste lid wordt niet gestart totdat het in het
      eerste lid bedoelde plan is goedgekeurd en eventuele ontheffingen zijn verleend.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.25
  - number: 4.1.25.3
    text: De bouw, verbouwing of wijziging wordt uitgevoerd overeenkomstig het goedgekeurde plan.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.25
  - number: 4.2.1
    text: 'Deze paragraaf is van toepassing:'
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.1
  - number: 4.2.1.a
    text: |-
      een zeeschip, niet zijnde een vissersvaartuig, waarvan de kiel is gelegd of de bouw in een overeenkomstige fase van
      ontwikkeling was voor 20 augustus 2013; en
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.1
  - number: 4.2.1.b
    text: |-
      een zeeschip, niet zijnde een vissersvaartuig, dat ontworpen is om traditionele vaardigheden en zeemanschap aan te
      moedigen en te bevorderen en dat als levend cultuurmonument volgens de traditionele beginselen van zeemanschap en
      techniek wordt bestuurd.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.1
  - number: 4.2.2.1
    text: Verblijven van een zeeschip zijn midscheeps of in het achterschip gelegen.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.2
  - number: 4.2.2.2
    text: |-
      In bijzondere gevallen kan de minister, indien de in het eerste lid voorgeschreven ligging in verband met
      de grootte, het type, de vaart of de beoogde dienst van het zeeschip niet wenselijk of praktisch onmogelijk
      wordt geacht, ontheffing verlenen van het eerste lid en toestaan dat verblijven in het voorschip achter het
      aanvaringsschot zijn gelegen.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.2
  - number: 4.2.2.3
    text: |-
      Er zijn afzonderlijke dagverblijven en slaapverblijven aanwezig, met uitzondering van op een zeeschip van minder
      dan 200 GT.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.2
  - number: 4.2.2.4
    text: Op een zeeschip zijn afzonderlijke dagverblijven en slaapverblijven voor officieren ingericht.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.2
  - number: 4.2.2.5
    text: Een slaapverblijf is zodanig gelegen dat de vloer boven de referentielastlijn ligt.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.2
  - number: 4.2.2.6
    text: |-
      De minister kan ontheffing verlenen van het vijfde lid voor een passagiersschip, een sleepboot, aannemersmaterieel
      of zeeschepen van minder dan 500 GT mits maatregelen zijn getroffen voor voldoende verlichting en ventilatie en het
      verblijf niet onder dienstgangen zijn gelegen.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.2
  - number: 4.2.2.7
    text: |-
      Op een zeeschip is het geluidniveau in de verblijven volgens een door de minister vast te stellen methode bepaald
      en de resultaten van deze bepaling worden aan de minister ter beschikking gesteld.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.2
  - number: 4.2.2.8
    text: In een slaapverblijf of recreatieverblijf is een aansluiting op het centraal antennesysteem aanwezig.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.2
  - number: 4.2.2.9
    text: |-
      Voor een sleepboot, aannemersmaterieel of andere zeeschepen van minder dan 500 GT kan de minister ontheffing
      verlenen van de voorschriften in het derde en vierde lid.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.2
  - number: 4.2.3.1
    text: |-
      Luiken, deuren en kappen in of op een dag- of slaapverblijf, uitkomende in de vrije lucht, zijn zodanig van een
      waterkering voorzien en kunnen gesloten worden, dat geen regen of overkomend zeewater kan binnendringen. De plaats
      en het aantal van de toegangen tot een dag- of slaapverblijf is zo gekozen dat de veiligheid voldoende verzekerd
      is. Een toegang kan aan beide zijden gemakkelijk en snel worden geopend en heeft een voldoende doorgang.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.3
  - number: 4.2.3.2
    text: |-
      Dekken die een dag- of slaapverblijf boven en onder afsluiten, en schotten die deze van de buitenlucht afsluiten,
      zijn waterdicht.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.3
  - number: 4.2.3.3
    text: |-
      Een houten vloerdek is behoorlijk gebreeuwd en gepekt. Een stalen vloerdek is bedekt met hout of ander materiaal,
      dat warmte slecht geleidt en van voldoende dikte is. Indien de vloeren van samengesteld materiaal zijn vervaardigd,
      zijn de verbindingen met de wanden naar boven afgerond.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.3
  - number: 4.2.3.4
    text: |-
      Van de verplichting tot het aanbrengen van de in het derde lid voorgeschreven bedekking van een stalen vloerdek
      kan de minister ontheffing verlenen voor zeeschepen, die uitsluitend worden gebruikt voor reizen in de tropen of in
      andere gebieden met vergelijkbare klimaatomstandigheden.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.3
  - number: 4.2.3.5
    text: |-
      Als het stalen bovendek van een dag- en slaapverblijf aan de buitenlucht of aan de invloed van enige warmtebron aan
      boord is blootgesteld, is:
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.3
  - number: 4.2.3.5.a
    text: het aan de bovenzijde met hout van ten minste vijf centimeter dik bekleed;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.3
  - number: 4.2.3.5.b
    text: de bovenzijde met ander deugdelijk en gelijkwaardig isolatiemateriaal bekleed; of
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.3
  - number: 4.2.3.5.c
    text: aan de onderzijde een bekleding met een even groot isolerend vermogen aangebracht.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.3
  - number: 4.2.3.6
    text: |-
      Een aangebracht plafond als bedoeld in het vierde lid, onderdelen a en b, aansluitend tegen de dekbalken, is geheel
      of gedeeltelijk wegneembaar.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.3
  - number: 4.2.3.7
    text: |-
      Een ruimte die als slaapverblijf dient, is door goed afsluitende schotten gescheiden van alle andere ruimten
      die niet uitsluitend voor verblijf zijn aangewezen. Indien de inrichting van het zeeschip dit noodzakelijk
      maakt, kunnen één of meer deuren in die schotten zijn aangebracht. De slaapverblijven staan niet rechtstreeks in
      verbinding met dagverblijven, ruimten voor sanitaire doeleinden, ziekenverpleging en ontspanning, bestemd voor
      gebruik door de zeevarenden, noch met de kombuis of de bakkerij.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.3
  - number: 4.2.3.8
    text: |-
      Het vijfde lid is niet van toepassing op de ruimten voor de toiletten, wastafels, badkuipen en douches, bedoeld in
      [artikel 4.2.12, zesde tot en met negende lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel4
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.3
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 4.2.3.9
    text: |-
      De in het vijfde lid bedoelde schotten zijn van staal of ander deugdelijk materiaal doelmatig vervaardigd en zo
      goed mogelijk waterdicht en gasdicht.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.3
  - number: 4.2.3.10
    text: |-
      De buitenwanden van een dag- of slaapverblijf zijn van staal of ander deugdelijk materiaal vervaardigd en voldoende
      geïsoleerd.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.3
  - number: 4.2.3.11
    text: |-
      Een schot van een machinekamerschacht, van een kombuis en andere een ruimte waarin warmte wordt ontwikkeld, is zo
      nodig met een isolerende laag bedekt, opdat geen warmte-uitstraling naar de aangrenzende verblijven of gangen naar
      die verblijven plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.3
  - number: 4.2.3.12
    text: |-
      Schotten in een dag- of slaapverblijf zijn vervaardigd van deugdelijk materiaal, waarin zich niet gemakkelijk
      ongedierte kan nestelen.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.3
  - number: 4.2.3.13
    text: |-
      Een dag- of slaapverblijf, ziekenverblijf of ontspanningsruimte is zodanig geïsoleerd dat overmatige condensatie of
      te hoge temperatuur wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.3
  - number: 4.2.3.14
    text: |-
      De hoogte tussen de dekken van een verblijf is zodanig dat de bemanning zich daarin vrij kan bewegen. Gemeten
      vanaf de onderkant van de in het verblijf doorlopende dekbalken, dan wel van de onderkant van het plafond tot de
      bovenkant van de vloerbedekking is deze hoogte ten minste 2 meter. Indien naar het oordeel van de minister hierdoor
      geen vermindering van het comfort van de bemanning ontstaat, kan hij van deze hoogte ontheffing verlenen maar niet
      minder dan 1,9 meter.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.3
  - number: 4.2.3.15
    text: |-
      Hoofdstoom- en afvoerleidingen van lieren en andere hulpwerktuigen zijn buiten een dag- of slaapverblijf en zo
      mogelijk buiten de gangen naar deze gehouden.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.3
  - number: 4.2.3.16
    text: |-
      Indien leidingen, andere dan bedoeld in het vijftiende lid, door een dag- of slaapverblijf of door een gang naar
      een zodanig verblijf lopen, zijn deze zo nodig afdoende geïsoleerd. Flenskoppelingen van leidingen zijn slechts bij
      hoge uitzondering in een dag- of slaapverblijf aangebracht. Lucht- en overvloeileidingen van tanks mogen niet in
      een dag- of slaapverblijf of in een gang in een zodanig verblijf uitmonden.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.3
  - number: 4.2.3.17
    text: Ankerkettingen lopen niet door een dag- of slaapverblijf, tenzij zij door zware stalen kokers zijn beschermd.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.3
  - number: 4.2.3.18
    text: |-
      Een ruimte gebruikt voor het stallen van vee of pluimvee is niet op hetzelfde dek gelegen als een dag- of
      slaapverblijf, tenzij op een afstand van ten minste 5 meter van de deuren van een verblijf.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.3
  - number: 4.2.3.19
    text: |-
      Het achttiende lid is niet van toepassing indien een verblijf volkomen door ononderbroken waterdichte of gasdichte
      schotten van die ruimten is afgescheiden.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.3
  - number: 4.2.3.20
    text: |-
      In een dag- of slaapverblijf zijn de huid en de eindschotten van de bovenbouw met hout bekleed of op soortgelijke
      wijze bekleed met ander deugdelijk materiaal. Indien de ruimte tussen wand en wegering niet voor ratten
      ontoegankelijk is gemaakt, is zij op een aantal plaatsen toegankelijk voor onderzoek en reiniging.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.3
  - number: 4.2.3.21
    text: |-
      De bekleding van een verblijf is vervaardigd van materiaal, waarvan het oppervlak gemakkelijk kan worden
      schoongehouden en dat waarborgt, dat ongedierte er zich niet gemakkelijk in kan nestelen.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.3
  - number: 4.2.3.22
    text: |-
      De wanden en plafonds van een dag- of slaapverblijf kan gemakkelijk worden schoongehouden en zijn geschilderd in
      een lichte kleur. Indien betimmering met een edele houtsoort is toegepast, kan met een voor die houtsoort passende
      bewerking worden volstaan.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.3
  - number: 4.2.3.23
    text: Er zijn voldoende middelen aanwezig zijn voor het afvoeren van water uit een dag- of slaapverblijf.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.3
  - number: 4.2.4
    text: |-
      [Artikel 4.2.3][ref1] is van overeenkomstige toepassing op een ruimte voor sanitaire doeleinden, ziekenverpleging
      of ontspanning, bestemd voor gebruik door een zeevarende, met dien verstande, dat de bekleding en de isolatie van
      wanden slechts daar behoeft te worden aangebracht waar dit door de minister nodig wordt geoordeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel4
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.4
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 4.2.5.1
    text: Een dag- of slaapverblijf op een zeeschip van 200 GT of meer is aangesloten op een luchtbehandelingsinstallatie.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.5
  - number: 4.2.5.2
    text: |-
      Het eerste lid is niet van toepassing op een zeeschip dat uitsluitend wordt ingezet op reizen in gebieden waar naar
      het oordeel van de minister een dergelijke installatie wegens de omstandigheden niet noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.5
  - number: 4.2.5.3
    text: |-
      Een radiohut en een centrale controlekamer in de machinekamer zijn op de in het eerste lid genoemde installatie,
      dan wel op een afzonderlijke luchtbehandelingsinstallatie, aangesloten.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.5
  - number: 4.2.5.4
    text: |-
      De luchtbehandelingsinstallatie is zodanig ontworpen dat ten opzichte van de buitenlucht te allen tijde een
      behaaglijke temperatuur en relatieve vochtigheid wordt gehandhaafd en een voldoende aantal luchtwisselingen wordt
      bereikt.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.5
  - number: 4.2.5.5
    text: |-
      De luchtbehandelingsinstallatie is aangepast aan de omstandigheden welke op zee kunnen voorkomen en veroorzaakt
      geen hinderlijk lawaai of trillingen.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.5
  - number: 4.2.5.6
    text: Voor het overige voldoet de luchtbehandelingsinstallatie aan door de minister te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.5
  - number: 4.2.6.1
    text: |-
      Op een zeeschip dat ingevolge het bepaalde in [artikel 4.2.5, eerste lid][ref1], niet behoeft te zijn uitgerust
      met een luchtbehandelingsinstallatie, zijn de in de volgende leden genoemde voorzieningen getroffen teneinde te
      voorzien in verwarming en ventilering van de verblijven.


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel4
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.6
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 4.2.6.2
    text: |-
      Een verblijf is aangesloten op een doeltreffende verwarmingsinrichting die buiten het verblijf is opgesteld en die
      is aangepast aan de klimaatomstandigheden. De verwarming geschiedt door toevoer van stoom, heet water, warme lucht,
      of een ander geschikt middel, dan wel door middel van elektriciteit.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.6
  - number: 4.2.6.3
    text: |-
      De verwarmingsinrichting en de plaats en wijze van opstelling daarvan voldoen aan door de minister te stellen
      eisen.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.6
  - number: 4.2.6.4
    text: Radiatoren in een verblijf zijn doelmatig geplaatst en waar nodig afgeschermd.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.6
  - number: 4.2.6.5
    text: |-
      Het bepaalde in het tweede lid is niet van toepassing op een zeeschip dat uitsluitend wordt gebruikt voor reizen in
      de tropen of in andere gebieden met vergelijkbare klimaatomstandigheden.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.6
  - number: 4.2.6.6
    text: |-
      Het verwarmingssysteem is in gebruik zolang leden van de bemanning aan boord verblijven en de omstandigheden dit
      vereisen.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.6
  - number: 4.2.6.7
    text: |-
      De verwarmingsinstallatie is van een zodanige capaciteit dat onder normale klimatologische omstandigheden die
      tijdens de reis kunnen worden ondervonden, in alle verblijven steeds een temperatuur van ten minste 20 graden
      Celsius kan worden onderhouden.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.6
  - number: 4.2.6.8
    text: |-
      Een verblijf doeltreffend geventileerd en wel zodanig dat de lucht in bevredigende toestand blijft zonder dat
      hinderlijke tocht wordt veroorzaakt.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.6
  - number: 4.2.6.9
    text: |-
      Een zeeschip dat regelmatig wordt gebruikt voor reizen in de tropen of in andere gebieden met vergelijkbare
      klimaatomstandigheden, is uitgerust met mechanische ventilatiemiddelen of met elektrisch aangedreven waaiers, met
      dien verstande dat slechts één van deze middelen is aangebracht in een ruimte waar dit een voldoende ventilatie
      verzekert.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.6
  - number: 4.2.6.10
    text: |-
      Een zeeschip dat uitsluitend wordt gebruikt voor reizen in gebieden buiten die genoemd in het zesde lid, is
      uitgerust met mechanische ventilatiemiddelen of elektrisch aangedreven waaiers.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.6
  - number: 4.2.6.11
    text: |-
      Voor een zeeschip dat uitsluitend wordt gebruikt voor reizen in koude streken, kan de minister ontheffing verlenen
      van het tiende lid.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.6
  - number: 4.2.6.12
    text: |-
      Het vermogen dat nodig is om de ventilatiemiddelen, bedoeld in het zesde en zevende lid, aan te drijven is, wanneer
      dit praktisch mogelijk is, beschikbaar zolang leden van de bemanning aan boord verblijven en de omstandigheden
      dit vereisen.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.6
  - number: 4.2.6.13
    text: Een toilet is onafhankelijk van andere gedeelten van een verblijf naar de buitenlucht geventileerd.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.6
  - number: 4.2.6.14
    text: |-
      Het bepaalde in het dertiende lid is ook van toepassing op een zeeschip dat is voorzien van een
      luchtbehandelingsinstallatie.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.6
  - number: 4.2.7.1
    text: Een verblijf is naar het oordeel van de minister behoorlijk verlicht.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.7
  - number: 4.2.7.2
    text: Het daglicht heeft voldoende toegang tot een dag- of slaapverblijf.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.7
  - number: 4.2.7.3
    text: |-
      De minister kan voor een passagiersschip, een sleepboot of aannemersmaterieel bijzondere regelingen met betrekking
      tot verlichting van verblijven treffen.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.7
  - number: 4.2.7.4
    text: Een verblijf is voorzien van elektrisch licht.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.7
  - number: 4.2.7.5
    text: In een slaapverblijf is een elektrische leeslamp aan het hoofdeinde van elke slaapplaats aangebracht.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.7
  - number: 4.2.7.6
    text: |-
      Indien geen twee onafhankelijke elektriciteitsbronnen voor verlichting aanwezig zijn, is een ander doeltreffend
      verlichtingsmiddel voor noodgevallen aangebracht.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.7
  - number: 4.2.8.1
    text: |-
      Aan boord van een zeeschip, niet zijnde een passagiersschip, beschikt iedere zeevarende over een eigen
      slaapverblijf. Wanneer de grootte en indeling van het zeeschip en de werkzaamheden waarvoor het wordt gebruikt, dit
      niet toelaten kan de minister hiervan ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.8
  - number: 4.2.8.2
    text: |-
      De eerste stuurman, de hoofdwerktuigkundige en de andere officieren en chefs van diensten beschikken over een
      afzonderlijk slaapverblijf.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.8
  - number: 4.2.8.3
    text: |-
      Indien zich niet een omstandigheid voordoet als bedoeld in [artikel 4.2.17, tweede lid][ref1], kan de minister
      ontheffing van het tweede lid verlenen, met dien verstande dat ten hoogste twee officieren in één slaapverblijf
      worden ondergebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel4
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.8
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 4.2.8.4
    text: |-
      In een slaapverblijf voor onderofficieren worden ten hoogste twee personen ondergebracht. Van de overige
      zeevarenden maken ten hoogste twee zeevarenden van hetzelfde slaapverblijf gebruik, met uitzondering van aan boord
      van een passagiersschip, waar het maximaal toegestane aantal zeevarenden in één slaapverblijf vier bedraagt.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.8
  - number: 4.2.8.5
    text: |-
      Voor slaapverblijven aan boord van een zeilschip, een zeeschip van minder dan 400 GT, een sleepboot of
      aannemersmaterieel, kan de minister ontheffing verlenen van het vierde lid.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.8
  - number: 4.2.8.6
    text: |-
      Op een zeeschip van 3.000 GT of meer beschikken de eerste stuurman en de hoofdwerktuigkundige over een aan het
      slaapverblijf grenzend dagverblijf.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.8
  - number: 4.2.8.7
    text: |-
      Op een zeeschip van 500 GT of meer zijn de slaapverblijven voor de leden van het dekpersoneel, het
      machinekamerpersoneel en het personeel van de civiele dienst per categorie gescheiden zijn, een en ander naar het
      oordeel van de minister.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.8
  - number: 4.2.8.8
    text: |-
      Het onderbrengen van de bemanning geschiedt zodanig dat de wachten gescheiden zijn en vrije wachtsgasten
      (daglieden) geen slaapverblijf met wachtdoenden delen. Wanneer de grootte en indeling van het zeeschip en de
      werkzaamheden waarvoor het wordt gebruikt, dit niet toelaten kan de minister hiervan ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.8
  - number: 4.2.8.9
    text: Op een slaapverblijf is duidelijk het aantal zeevarenden vermeld waarvoor deze is bestemd.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.8
  - number: 4.2.9.1
    text: |-
      Een slaapverblijf is zodanig uitgevoerd en ingericht dat de netheid wordt bevorderd en redelijk comfort aan de
      zeevarenden is verzekerd.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.9
  - number: 4.2.9.2
    text: 'Het vloeroppervlak van een slaapverblijf voor gezellen ingericht voor één persoon, bedraagt ten minste:'
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.9
  - number: 4.2.9.2.a
    text: |-
      op een zeeschip, niet zijnde een passagiersschip:







                        (i)


                        van minder dan 500 GT:


                        3,00 vierkante meter




                        (ii)


                        van 500 GT of meer en minder dan 1.000 GT:


                        3,25 vierkante meter




                        (iii)


                        van 1.000 GT of meer en minder dan 3.000 GT:


                        3,75 vierkante meter




                        (iv)


                        van 3.000 GT of meer en minder dan 10.000 GT:


                        4,25 vierkante meter




                        (v)


                        van 10.000 GT of meer:


                        4,75 vierkante meter
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.9
  - number: 4.2.9.2.b
    text: |-
      op een passagiersschip:







                        (i)


                        van minder dan 1.000 GT:


                        3,00 vierkante meter




                        (ii)


                        van 1.000 GT of meer en minder dan 3.000 GT:


                        3,25 vierkante meter




                        (iii)


                        van 3.000 ton of meer:


                        3,75 vierkante meter
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.9
  - number: 4.2.9.3
    text: |-
      Het vloeroppervlak van een slaapverblijf voor gezellen ingericht voor meer dan één persoon, bedraagt per persoon
      ten minste:
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.9
  - number: 4.2.9.3.a
    text: |-
      op een zeeschip, niet zijnde een passagiersschip:







                        (i)


                        van minder dan 500 GT:


                        2,00 vierkante meter




                        (ii)


                        van 500 GT of meer en minder dan 1.000 GT:


                        2,25 vierkante meter




                        (iii)


                        van 1.000 GT of meer en minder dan 3.000 GT:


                        2,75 vierkante meter




                        (iv)


                        van 3.000 GT of meer en minder dan 10.000 GT:


                        3,25 vierkante meter




                        (v)


                        van 10.000 GT of meer:


                        3,75 vierkante meter
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.9
  - number: 4.2.9.3.b
    text: |-
      op passagiersschepen:







                        (i)


                        van minder dan 1.000 GT:


                        2,00 vierkante meter




                        (ii)


                        van 1.000 GT of meer en minder dan 3.000 GT:


                        2,35 vierkante meter




                        (iii)


                        van 3.000 GT of meer:


                        3,00 vierkante meter
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.9
  - number: 4.2.9.4
    text: |-
      Het vloeroppervlak van een slaapverblijf voor officieren die niet de beschikking hebben over een eigen dagverblijf,
      bedraagt per persoon ten minste op een zeeschip van:







                    (i)


                    minder dan 500 GT:


                    4,0 vierkante meter




                    (ii)


                    500 GT of meer en minder dan 1.000 GT:


                    5,0 vierkante meter




                    (iii)


                    1.000 GT of meer en minder dan 3.000 GT:


                    6,5 vierkante meter




                    (iv)


                    3.000 GT of meer:


                    7,5 vierkante meter
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.9
  - number: 4.2.9.5
    text: |-
      Het vloeroppervlak wordt gemeten tussen de wanden van het verblijf. Kleine of onregelmatig gevormde oppervlakken
      die de beschikbare ruimte niet daadwerkelijk vergroten en niet voor plaatsing van meubilair geschikt zijn, worden
      niet mee gemeten.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.9
  - number: 4.2.9.6
    text: Een aan het verblijf verbonden badkamer wordt bij de berekening van het vloeroppervlak buiten beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.9
  - number: 4.2.9.7
    text: |-
      In een slaapverblijf voor elke zeevarende een kledingkast aanwezig met een hoogte van ten minste 1,75 meter en met
      een dwarsdoorsnede van ten minste 0,2 meter. De kledingkast is voorzien van een legplank en van een roe waaraan
      kleding op kleerhangers kan worden gehangen, alsmede van een slot of van lippen voor een hangslot.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.9
  - number: 4.2.9.8
    text: |-
      In een slaapverblijf is voor elke zeevarende is een lade of soortgelijke ruimte aanwezig met een inhoud van ten
      minste 60 kubieke decimeter. Deze ruimte kan met de kledingkast één geheel uitmaken.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.9
  - number: 4.2.9.9
    text: In een slaapverblijf is een tafel of lessenaar met een gemakkelijke zitgelegenheid aanwezig.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.9
  - number: 4.2.9.10
    text: |-
      Een slaapverblijf is uitgerust met een spiegel, kastjes voor toiletbenodigdheden, een boekenrek en een voldoende
      aantal kleerhangers. Voor patrijspoorten zijn gordijnen of jaloezieën aangebracht.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.9
  - number: 4.2.9.11
    text: |-
      De meubelen zijn vervaardigd van glad, hard materiaal dat niet kromtrekt of roest en waarin zich geen ongedierte
      kan nestelen.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.9
  - number: 4.2.9.12
    text: |-
      Onverminderd het zesde en zevende lid is een slaapverblijf voor officieren voorzien van een wastafel met warm
      en koud stromend zoet water, die is aangesloten op een afvoer. De wastafel mag zich ook in een aan het verblijf
      verbonden eigen badkamer bevinden.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.9
  - number: 4.2.9.13
    text: Voor elke zeevarende is een afzonderlijke slaapplaats beschikbaar.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.9
  - number: 4.2.9.14
    text: |-
      Slaapplaatsen zijn behoorlijk van elkaar gescheiden en afzonderlijk toegankelijk. Er zijn niet meer dan twee
      slaapplaatsen boven elkaar aangebracht.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.9
  - number: 4.2.9.15
    text: |-
      Op een zeeschip van 500 GT of meer zijn langs het scheepsboord ter plaatse van patrijspoorten geen slaapplaatsen
      boven elkaar aanwezig.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.9
  - number: 4.2.9.16
    text: |-
      De onderkant van de onderste slaapplaats is meer dan 30 centimeter boven de vloer gelegen. De afstand tussen de
      onderkant van de onderste slaapplaats en de onderkant van de bovenste slaapplaats en de afstand tussen de onderkant
      van de bovenste slaapplaats en de onderkant van het plafond is 75 centimeter of meer.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.9
  - number: 4.2.9.17
    text: |-
      Aan de onderkant van de bovenste slaapplaats is een stofdichte bodem van hout, zeildoek of ander geschikt materiaal
      aangebracht.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.9
  - number: 4.2.9.18
    text: Een slaapplaats is, binnenwerks gemeten, 2 meter of meer lang en 0,80 meter of meer breed.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.9
  - number: 4.2.9.19
    text: |-
      Een slaapplaats is vervaardigd van hout, of van deugdelijk hard materiaal, dat niet gemakkelijk roest. De
      constructie is zodanig dat er zich geen ongedierte in kan nestelen en deze gemakkelijk kan worden schoongemaakt.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.9
  - number: 4.2.9.20
    text: |-
      Indien een slaapplaats uit buizen is samengesteld, zijn in deze buizen geen openingen aanwezig die aan ongedierte
      toegang kunnen verlenen. Houten kooiplanken zijn uitneembaar.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.9
  - number: 4.2.9.21
    text: |-
      Een slaapplaats is voorzien van een vaste of los ingelegde staaldraadmatras of van een andere ondermatras van
      daarmede gelijkwaardige constructie en een bovenmatras van doeltreffend materiaal. Bij gebruik van een matras met
      binnenvering of van een schuimrubbermatras kan een ondermatras vervallen.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.9
  - number: 4.2.9.22
    text: Een slaapplaats is niet gelegen onder de opening van een luchtkoker.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.9
  - number: 4.2.10.1
    text: |-
      Op een zeeschip van 200 GT of meer zijn voldoende dagverblijven aanwezig die zijn gescheiden van de slaapverblijven
      en zo dicht mogelijk bij de kombuis zijn gelegen.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.10
  - number: 4.2.10.2
    text: 'Er is een afzonderlijk dagverblijf:'
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.10
  - number: 4.2.10.2.a
    text: 'aan boord van een zeeschip van 400 GT of meer en minder dan 1.000 GT:'
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.10
  - number: 4.2.10.2.a.1°
    text: voor de kapitein en de officieren;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.10
  - number: 4.2.10.2.a.2°
    text: voor de gezellen.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.10
  - number: 4.2.10.2.b
    text: 'aan boord van een zeeschip van 1.000 GT of meer:'
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.10
  - number: 4.2.10.2.b.1°
    text: voor de kapitein en de officieren;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.10
  - number: 4.2.10.2.b.2°
    text: voor de gezellen van het dekpersoneel;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.10
  - number: 4.2.10.2.b.3°
    text: voor de gezellen van het machinekamerpersoneel.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.10
  - number: 4.2.10.3
    text: |-
      In het tweede lid, onderdeel b, onder 2 en 3, is tevens van toepassing op ‘onderofficieren’ onderscheidenlijk
      ‘overige gezellen’.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.10
  - number: 4.2.10.4
    text: |-
      De minister kan na overleg met de betrokken organisaties van scheepsbeheerders en zeevarenden ontheffing verlenen
      van het tweede lid, onder b, en toestaan dat voor de gezellen één gezamenlijk dagverblijf is ingericht.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.10
  - number: 4.2.10.5
    text: |-
      Voor het personeel van de civiele dienst is een afzonderlijk dagverblijf ingericht of wordt behoorlijke gelegenheid
      tot gebruik van maaltijden in één van de dagverblijven gegeven.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.10
  - number: 4.2.10.6
    text: |-
      De grootte en inrichting en het aantal tafels en zitbanken of stoelen, vastgezet of verplaatsbaar, van een
      dagverblijf zijn voldoende voor het grootste aantal personen dat gelijktijdig van het verblijf gebruik kan maken.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.10
  - number: 4.2.10.7
    text: |-
      Het vloeroppervlak van de dagverblijven voor officieren en gezellen is niet minder dan één vierkante meter per
      zitplaats.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.10
  - number: 4.2.10.8
    text: |-
      Indien bijzondere omstandigheden dit noodzakelijk maken, kan de minister voor een passagiersschip ontheffing
      verlenen van het tweede en vierde tot en met zevende lid.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.10
  - number: 4.2.10.9
    text: 'Voor de bemanningsleden zijn te allen tijde beschikbaar:'
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.10
  - number: 4.2.10.9.a
    text: |-
      een koelkast op een gemakkelijk toegankelijke plaats en voldoende groot, gezien het aantal personen dat van het
      dagverblijf of de dagverblijven gebruik maakt;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.10
  - number: 4.2.10.9.b
    text: voorzieningen voor het verstrekken van warme dranken; en
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.10
  - number: 4.2.10.9.c
    text: voorzieningen voor het verstrekken van gekoeld water.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.10
  - number: 4.2.10.10
    text: |-
      Indien een pantry niet in rechtstreekse verbinding staat met een dagverblijf is deze voorzien van voldoende
      kastruimte voor het opbergen van eetgerei en een geschikte gelegenheid voor het schoonmaken daarvan.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.10
  - number: 4.2.10.11
    text: |-
      De bovenkanten van tafels, banken en stoelen zijn vervaardigd van vochtwerend materiaal, zonder barsten, dat
      gemakkelijk is schoon te houden.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.10
  - number: 4.2.11.1
    text: |-
      Van het open dek van een zeeschip zijn één of meer gedeelten toegankelijk voor de zeevarenden wanneer zij geen
      dienst hebben.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.11
  - number: 4.2.11.2
    text: |-
      Op een zeeschip van 500 GT of meer zijn voor de officieren en voor de gezellen ontspanningsruimten aanwezig,
      gelegen op een daartoe geschikte plaats en op passende wijze ingericht.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.11
  - number: 4.2.11.3
    text: |-
      Wanneer buiten de dagverblijven niet is voorzien in afzonderlijke ontspanningsruimten, zijn deze dagverblijven op
      zodanige wijze ingericht, gemeubileerd en uitgerust, dat zij als ontspanningsruimte kunnen dienstdoen.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.11
  - number: 4.2.11.4
    text: |-
      In een ontspanningsruimte is ten minste een boekenkast aanwezig en wordt gelegenheid geboden tot lezen en schrijven
      en zo mogelijk tot gezelschapsspelen.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.11
  - number: 4.2.11.5
    text: |-
      Op een zeeschip van 8.000 GT of meer is een bibliotheek aanwezig, waar films kunnen worden vertoond en naar
      televisie kan worden gekeken. Er is tevens voorzien in een ruimte waar men kan knutselen of gezelschapsspelen kan
      beoefenen. Er is een zwembad aanwezig tenzij, naar het oordeel van de minister, de inrichting van het zeeschip
      daartoe onvoldoende mogelijkheid biedt.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.11
  - number: 4.2.12.1
    text: |-
      Op een zeeschip zijn op een geschikte plaats voor officieren en gezellen sanitaire voorzieningen aanwezig,
      bestaande uit ten minste een toilet, een badkuip of douche en een wastafel met warm en koud stromend zoet water
      voor iedere zes personen of minder, die niet beschikken over de sanitaire voorzieningen als bedoeld in het vierde,
      vijfde en zesde lid, met dien verstande dat het aantal toiletten op een zeeschip ten minste bedraagt:






                    400 tot 500 GT


                    ten minste 2




                    500 tot 800 GT


                    ten minste 3




                    800 tot 3.000 GT


                    ten minste 4




                    3.000 GT of meer


                    ten minste 6
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.12
  - number: 4.2.12.2
    text: |-
      Bij de berekeningen van het aantal voorzieningen wordt bij meer dan zes zeevarenden of een veelvoud van zes
      zeevarenden, een aantal van twee zeevarenden of minder verwaarloosd.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.12
  - number: 4.2.12.3
    text: Voor vrouwelijke zeevarenden staan afzonderlijke sanitaire voorzieningen ter beschikking.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.12
  - number: 4.2.12.4
    text: De beschikbaarheid van de toiletten is gelijkelijk over de groepen van officieren en gezellen verdeeld.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.12
  - number: 4.2.12.5
    text: |-
      Op een zeeschip van 500 GT of meer zijn ten behoeve van de officieren toiletten in de nabijheid van hun
      slaapverblijven beschikbaar.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.12
  - number: 4.2.12.6
    text: |-
      Op een zeeschip van 5.000 GT of meer, en niet meer dan 15.000 GT, zijn ten minste vijf éénpersoons slaapverblijven
      voor officieren aanwezig met een eigen badkamer, die is voorzien van een toilet, een badkuip of douche en een
      wastafel met warm en koud stromend zoet water. De wastafel mag zich in het slaapverblijf bevinden.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.12
  - number: 4.2.12.7
    text: |-
      Op een zeeschip van 10.000 GT of meer en niet meer dan 15.000 GT zijn de slaapverblijven van alle overige
      officieren voorzien van een daaraan verbonden eigen badkamer, dan wel van een badkamer die op dezelfde wijze
      is uitgerust en is gelegen in een ruimte tussen twee slaapverblijven en die vanuit deze slaapverblijven direct
      bereikbaar is.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.12
  - number: 4.2.12.8
    text: |-
      Op een zeeschip van 15.000 GT of meer zijn de éénpersoons slaapverblijven voor de officieren voorzien van een
      daaraan verbonden eigen badkamer. De badkamer is uitgerust van een toilet, een badkuip of douche en een wastafel
      met warm en koud stromend zoet water. De wastafel mag zich in het slaapverblijf bevinden.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.12
  - number: 4.2.12.9
    text: |-
      Op een zeeschip van 25.000 GT of meer, met uitzondering van een passagiersschip, is per twee gezellen een badkamer
      aanwezig in een ruimte tussen twee aangrenzende slaapverblijven en van daaruit rechtstreeks te bereiken, of een
      badkamer gelegen tegenover deze verblijven. De badkamer is uitgerust met een toilet, een badkuip of douche en een
      wastafel met warm en koud stromend zoet water.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.12
  - number: 4.2.12.10
    text: |-
      Op een zeeschip van 5.000 GT of meer, met uitzondering van een passagiersschip, is een slaapverblijf voor gezellen
      voorzien van een wastafel met koud en warm stromend zoet water die is aangesloten op een afvoer, met uitzondering
      van een wastafel die aanwezig is in een badkamer overeenkomstig het zesde lid.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.12
  - number: 4.2.12.11
    text: |-
      Een zeeschip van 1.600 GT of meer, met uitzondering van een zeeschip waarop het gehele machinekamerpersoneel de
      beschikking heeft over een eigen slaapverblijf en een badkamer per één of twee slaapverblijven, zijn kleedruimten
      aanwezig, die:
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.12
  - number: 4.2.12.11.a
    text: |-
      buiten de machinekamer zijn gelegen, en gemakkelijk bereikbaar zijn vanuit de machinekamer. Deze ruimten kunnen
      door het machinekamerpersoneel vanuit de machinekamer worden bereikt zonder dat men in de open lucht komt; en
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.12
  - number: 4.2.12.11.b
    text: |-
      zijn voorzien van een kledingkast voor een zeevarende alsmede van badkuipen of douches en wastafels met warm en
      koud stromend zoet water.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.12
  - number: 4.2.12.12
    text: 'Een zeeschip van 1.600 GT of meer is voorzien van:'
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.12
  - number: 4.2.12.12.a
    text: |-
      een aparte toiletruimte, met een toilet en een wastafel met warm en koud stromend zoet water, die gemakkelijk
      bereikbaar is vanaf het navigatie brugdek en bedoeld voor diegenen die daar hun werk verrichten; en
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.12
  - number: 4.2.12.12.b
    text: |-
      een toilet en een wastafel met warm en koud stromend zoet water, gemakkelijk bereikbaar vanuit de machinekamer,
      indien deze voorzieningen niet zijn aangebracht in de onmiddellijke nabijheid van de centrale controlekamer in
      de machinekamer.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.12
  - number: 4.2.12.13
    text: |-
      Op een zeeschip met meer dan 100 zeevarenden, kan de minister ontheffing verlenen het eerste tot en met tiende lid
      en een vermindering van het aantal wastafels, badkuipen en douches toestaan.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.12
  - number: 4.2.13.1
    text: |-
      Sanitaire ruimten en voorzieningen als bedoeld in [artikel 4.2.12][ref1] met uitzondering van ruimten die zijn
      verbonden met hutten, voldoen aan de volgende eisen:


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel4
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.13
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 4.2.13.1.a
    text: de vloer bestaat uit deugdelijk, duurzaam en gemakkelijk te reinigen materiaal, dat ondoordringbaar is voor vocht;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.13
  - number: 4.2.13.1.b
    text: |-
      schotten zijn vervaardigd van staal of ander deugdelijk materiaal, dat tot ten minste 23 centimeter boven de vloer
      waterdicht is;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.13
  - number: 4.2.13.1.c
    text: toiletten zijn op voldoende wijze van elkaar zijn gescheiden en gemakkelijk bereikbaar;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.13
  - number: 4.2.13.1.d
    text: |-
      een toilet is van een ruime afvoer voorzien en kan afzonderlijk door middel van een vaste inrichting gemakkelijk
      worden doorgespoeld, zodanig, dat geen stank wordt verspreid;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.13
  - number: 4.2.13.1.e
    text: |-
      wastafels en badkuipen zijn van voldoende afmetingen en zijn vervaardigd van deudelijk materiaal, met een glad
      oppervlak, niet onderhevig aan scheuren, schilferen of roesten; en
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.13
  - number: 4.2.13.1.f
    text: |-
      de vloer van een ruimte, waarin een toilet of een wasgelegenheid is ondergebracht, is voorzien van een behoorlijke
      waterafvoer.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.13
  - number: 4.2.13.2
    text: |-
      Een toilet staat niet rechtstreeks in verbinding met slaapverblijven, en met een doodlopende gang tussen
      de slaapverblijven en de toiletten, met dien verstande, dat dit niet geldt voor een toilet tussen twee
      slaapverblijven, welke tezamen voor niet meer dan vier personen zijn bestemd.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.13
  - number: 4.2.13.3
    text: |-
      Een toilet is van een zodanig model en de afvoer is zodanig ingericht, dat de kans op verstopping zo klein mogelijk
      is en het schoonhouden vergemakkelijkt wordt.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.13
  - number: 4.2.14.1
    text: |-
      Er zijn voldoende voorzieningen voor het wassen, drogen en strijken van kleding, in een mate die in overeenstemming
      is met het aantal bemanningsleden en de normale duur van de reis. Deze voorzieningen zijn aangebracht op een
      gemakkelijk vanuit de hutten te bereiken plaats.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.14
  - number: 4.2.14.2
    text: 'De voorzieningen bestaan uit:'
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.14
  - number: 4.2.14.2.a
    text: wasmachines;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.14
  - number: 4.2.14.2.b
    text: droogtrommels of behoorlijk verwarmde en geventileerde droogkamers; en
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.14
  - number: 4.2.14.2.c
    text: strijkijzers en strijkplanken of gelijkwaardige voorzieningen.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.14
  - number: 4.2.14.3
    text: |-
      Op een zeeschip van minder dan 250 GT mag van het eerste en tweede lid worden afgeweken, mits andere voorzieningen
      zijn getroffen die naar het oordeel van de minister genoegzaam zijn.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.14
  - number: 4.2.14.4
    text: |-
      Nabij de slaapverblijven is voldoende behoorlijk geventileerde bergruimte om oliegoed en natte of vuile kleding op
      te hangen.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.14
  - number: 4.2.14.5
    text: |-
      Op een zeeschip van minder dan 400 GT mogen kledingstukken als bedoeld in het vierde lid in een goed sluitende kast
      in het slaapverblijf worden opgeborgen, mits deze kast op een ruimte buiten het verblijf ventileert.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.14
  - number: 4.2.15.1
    text: |-
      Op een zeeschip met een bemanning van 15 of meer zeevarenden aan boord dat reizen van meer dan 3 dagen maakt, is
      een afzonderlijk ziekenverblijf aanwezig.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.15
  - number: 4.2.15.2
    text: Het ziekenverblijf is doelmatig gelegen en is gemakkelijk bereikbaar.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.15
  - number: 4.2.15.3
    text: |-
      Het ziekenverblijf is zo groot dat de verpleging naar behoren kan geschieden en de zieken of gewonden gerieflijk
      zijn gehuisvest. Zieken of gewonden kunnen op gemakkelijke wijze in en uit het verblijf worden gebracht.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.15
  - number: 4.2.15.4
    text: |-
      De verlichting, ventilatie en verwarming voldoen aan de eisen voor de verblijven, bedoeld in de
      [artikelen 4.2.2 tot en met 4.2.7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel4
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.15
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 4.2.15.5
    text: |-
      Het ziekenverblijf is voorzien van voldoende wasgelegenheid met toebehoren en een afvoer van vuil water. De
      wasgelegenheid is voorzien van warm en koud stromend zoet water.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.15
  - number: 4.2.15.6
    text: |-
      Indien het aantal zeevarenden dat niet beschikt over een eigen slaapverblijf minder dan 30 bedraagt, is het
      ziekenverblijf voorzien van één slaapplaats. Bedraagt dat aantal zeevarenden 30 of meer, is het ziekenverblijf
      voorzien van twee slaapplaatsen, of zoveel meer als in verband met de omstandigheden van de reis door de minister
      wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.15
  - number: 4.2.15.7
    text: |-
      Indien voor passagiers geen ziekenverblijf aanwezig is, mogen de passagiers in het ziekenverblijf worden opgenomen
      en gelden de voorschriften van het vijfde lid voor de zeevarenden en de passagiers gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.15
  - number: 4.2.15.8
    text: |-
      Slaapplaatsen zijn niet boven elkaar geplaatst. De inrichting van de slaapplaatsen voldoet ten minste aan de eisen,
      bedoeld in het elfde lid en [artikel 4.2.9, dertiende tot en met tweeëntwintigste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel4
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.15
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 4.2.15.9
    text: |-
      In of in de onmiddellijke nabijheid van het ziekenverblijf zijn een toilet en een daaraan toegevoegde badkamer
      beschikbaar. Deze zijn van het ziekenverblijf afgescheiden en zijn uitsluitend bestemd voor gebruik door patiënten.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.15
  - number: 4.2.15.10
    text: |-
      Indien een arts tot de bemanning behoort is een ruimte bij het ziekenverblijf ingericht als apotheek en
      verbandkamer, die van het ziekenverblijf is afgescheiden.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.15
  - number: 4.2.15.11
    text: |-
      Het ziekenverblijf wordt niet voor andere doeleinden dan het verplegen of behandelen van zieken en gewonden
      gebruikt.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.15
  - number: 4.2.15.12
    text: |-
      Op een zeeschip dat krachtens het eerste lid niet van een ziekenverblijf is voorzien, kan voor een zieke of gewonde
      een éénpersoonsslaapverblijf beschikbaar worden gesteld, waarin de slaapplaats als ziekenkooi is ingericht. Is
      het aantal zeevarenden minder dan zes, kan worden volstaan met een als ziekenkooi ingerichte slaapplaats in een
      slaapverblijf.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.15
  - number: 4.2.15.13
    text: |-
      Indien iemand aan een ernstige of aan een besmettelijke ziekte lijdt, wordt getracht deze, afgezonderd van alle
      anderen, te verplegen.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.15
  - number: 4.2.16.1
    text: |-
      Een zeeschip dat geregeld wordt gebruikt voor reizen in de tropen of in andere gebieden met vergelijkbare
      klimaatomstandigheden is uitgerust met tenten over de aan de zon blootgestelde dekken boven de verblijven en over
      de voor ontspanning bestemde dekruimten.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.16
  - number: 4.2.16.2
    text: |-
      Aan boord van een zeeschip dat niet is voorzien van een luchtbehandelingsinstallatie en dat geregeld havens aandoet
      waar malaria voorkomt of kan voorkomen, zijn de dag-, nacht- en ziekenverblijven tegen binnendringen van muggen
      beschermd door het aanbrengen van passende horren voor patrijspoorten, luchtkokers, en deuren die toegang geven tot
      het open dek.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.16
  - number: 4.2.16.3
    text: |-
      Op een zeeschip van meer dan 3.000 GT is zowel voor de dekdienst als voor de machinedienst een afzonderlijke ruimte
      als kantoor beschikbaar.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.16
  - number: 4.2.17.1
    text: |-
      Onverminderd het tweede lid kan de minister, na overleg met de betrokken organisaties van scheepsbeheerders
      en zeevarenden, hetzij in een incidenteel geval, hetzij algemeen, ontheffing of vrijstelling verlenen van de
      [artikelen 4.2.2 tot en met 4.2.16][ref1], onder zo nodig door hem te stellen voorwaarden of beperkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel4
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.17
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 4.2.17.2
    text: |-
      De minister kan voor een zeeschip aan boord waarvan vanwege de samenstelling van de bemanning rekening wordt
      gehouden met de belangen van bemanningsleden die verschillende gewoonten van godsdienstige en maatschappelijke
      aard hebben, na overleg met de betrokken organisaties van scheepsbeheerders en zeevarenden ontheffing verlenen van
      het bepaalde in de [artikelen 4.2.8, eerste en vierde lid, onder d][ref1], [4.2.9, tweede en derde lid][ref2],
      en [4.2.12, eerste tot en met het derde en negende lid][ref3], onder zo nodig door hem te stellen voorwaarden of
      beperkingen, mits de hiervoor bedoelde organisaties ter zake overeenstemming hebben bereikt. Op oude schepen blijft
      van toepassing het bepaalde in de [artikelen 46 tot en met 64 van het koninklijk besluit][ref4] van 15 mei 1937,
      Stb. 242, zoals gewijzigd bij koninklijk besluit van 5 juni 1975, Stb. 327.


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0051068#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0051068#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0001985#Artikel46
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.17
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0051068
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref3
        bwb_id: BWBR0051068
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref4
        bwb_id: BWBR0001985
        artikel: '46'
  - number: 4.2.18
    text: |-
      Onverminderd [artikel 4.2.19, eerste lid][ref1], zijn de [artikelen 4.2.2 tot en met 4.2.16][ref2] niet van
      toepassing op een zeeschip, niet zijnde een vissersvaartuig, waarvan de kiel is gelegd of de bouw zich in een
      overeenkomstige fase van ontwikkeling bevond voor 1 augustus 1983.


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0051068#Artikel4
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.18
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0051068
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 4.2.19.1
    text: |-
      De minister kan na overleg met de betrokken organisaties van scheepsbeheerders en zeevarenden, bepalen, dat geheel
      of gedeeltelijk wordt voldaan aan de [artikelen 4.2.2 tot en met 4.2.16][ref1] door een zeeschip als bedoeld in
      [artikel 4.2.17, eerste lid][ref2], dat:


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0051068#Artikel4
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.19
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0051068
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 4.2.19.1.a
    text: hetzij de Nederlandse nationaliteit verkrijgt;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.19
  - number: 4.2.19.1.b
    text: |-
      hetzij ingrijpende veranderingen in de bouw of grote reparaties ondergaat volgens een tevoren ontworpen plan,
      echter niet ten gevolge van een ongeval of ramp.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.19
  - number: 4.2.19.2
    text: |-
      De minister kan voorschrijven dat de te treffen voorzieningen, bedoeld in het eerste lid, binnen een bepaalde
      termijn worden aangebracht.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.19
  - number: 4.2.19.3
    text: |-
      Voorzieningen als bedoeld in het eerste lid worden uitsluitend voorgeschreven voor zover deze redelijk en
      uitvoerbaar zijn.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.2.19
  - number: 4.3.1
    text: Deze paragraaf is niet van toepassing op een vissersvaartuig.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.3.1
  - number: 4.3.2.1
    text: |-
      Voor de bevoorrading van een zeeschip met levensmiddelen die voldoen aan de in
      [artikel 4, derde lid, van de wet][ref1] bedoelde eisen, worden de soorten en hoeveelheden mee te nemen
      levensmiddelen bepaald op basis van:


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel4
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.3.2
    references:
      - id: ref1
        bwb_id: BWBR0050681
        artikel: '4'
  - number: 4.3.2.1.a
    text: het aantal zeevarenden aan boord;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.3.2
  - number: 4.3.2.1.b
    text: de duur van de reis;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.3.2
  - number: 4.3.2.1.c
    text: de aard van de reis;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.3.2
  - number: 4.3.2.1.d
    text: de mogelijkheid tot het aanvullen van voorraden in aanloophavens; en
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.3.2
  - number: 4.3.2.1.e
    text: de religieuze achtergrond en de culturele gewoonten van de zeevarenden.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.3.2
  - number: 4.3.2.2
    text: |-
      De voorraden levensmiddelen worden opgeslagen in de in [artikel 4.1.19, derde lid][ref1], bedoelde bergplaatsen.


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel4
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.3.2
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.3.3.1
    text: |-
      Voor de bevoorrading van een zeeschip met drinkwater wordt de benodigde hoeveelheid vastgesteld op basis van de in
      [artikel 4.3.2, eerste lid][ref1], genoemde criteria, alsmede op basis van de mogelijkheid van aanvulling gedurende
      de reis met behulp van een voorziening om drinkwater te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel4
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.3.3
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.3.3.2
    text: |-
      In geval van onvoorziene omstandigheden tijdens de reis kan de kapitein de hoeveelheid drinkwater per zeevarende
      rantsoeneren.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.3.3
  - number: 4.3.3.3
    text: |-
      Het drinkwater wordt opgeslagen in de in [artikel 4.1.19, vierde lid][ref1], bedoelde of andere daarvoor geschikte
      tanks die schoon zijn en zo zijn afgesloten dat daarin geen vreemde bestanddelen komen.


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel4
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.3.3
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.3.3.4
    text: 'Het drinkwater wordt slechts in de drinkwatertank geleid:'
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.3.3
  - number: 4.3.3.4.a
    text: met een aanvoerslang die vrij van de kade wordt gehouden;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.3.3
  - number: 4.3.3.4.b
    text: nadat ten minste één minuut het water op volle aanvoerdruk uit de aanvoerslang heeft gestroomd;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.3.3
  - number: 4.3.3.4.c
    text: 'indien tijdens het laden per ton drinkwater wordt toegevoegd:'
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.3.3
  - number: 4.3.3.4.c.1°
    text: een gestabiliseerd hypochloriet in zodanige hoeveelheid, dat minstens 0,7 gram vrij chloor per ton vrijkomt;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.3.3
  - number: 4.3.3.4.c.2°
    text: |-
      een hoeveel gestabiliseerd hypochloriet met een hoeveelheid ammoniumzout, zodat ten minste 2,5 gram monochlooramine
      (NHCl) per ton ontstaat; of
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.3.3
  - number: 4.3.3.4.c.3°
    text: |-
      een door de minister toegestane stof in een zodanige hoeveelheid dat minstens 0,7 gram vrij chloor per ton water
      vrijkomt; en
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.3.3
  - number: 4.3.3.4.d
    text: indien de in onderdeel c genoemde stoffen behoorlijk door het drinkwater worden gemengd.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.3.3
  - number: 4.3.3.5
    text: |-
      Een drinkwatertank die voor inspectie, onderhoud, of anderszins is betreden, wordt gereinigd door de tank te vullen
      met drinkwater waarin 10 gram vrij chloor per ton drinkwater is gemengd.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.3.3
  - number: 4.3.3.6
    text: |-
      De drinkwatertank wordt slechts bevoorraad met drinkwater als dat water ten minste twee uur lang in de tank is
      geweest en daarna is uitgepompt
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.3.3
  - number: 4.3.4.1
    text: |-
      Peilstokken of andere instrumenten die gebruikt worden om het restant drinkwater in tanks op te meten, zijn vóór
      ieder gebruik gereinigd. Zij worden opgeborgen op een plaats waar het gevaar van besmetting het geringst is.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.3.4
  - number: 4.3.4.2
    text: |-
      Bij het gebruik van metalen roestvrije tapelines die worden geborgen in een doos waarin enkele formalinetabletten
      aanwezig zijn, is het afzonderlijk reinigen niet nodig.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.3.4
  - number: 4.3.4.3
    text: |-
      De kapitein ziet erop toe dat de persoon belast met het peilen, onmiddellijk vóór hij gaat peilen, zijn handen
      wast.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.3.4
  - number: 4.3.5.1
    text: |-
      In kombuizen en pantry’s moet bij elke drinkwaterkraan een opschrift ‘drinkwater’ en bij elke zoutwaterkraan een
      opschrift ‘zoutwater’ aangebracht zijn.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.3.5
  - number: 4.3.5.2
    text: |-
      Na vertrek uit een haven wordt de zoutwaterleiding, welke voor afwas van keuken- en eetgerei dient, buiten de
      driemijlsgrens geruime tijd doorgespoeld, voordat deze voor afwasdoeleinden gebruikt mag worden.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.3.5
  - number: 4.3.6.1
    text: De voorraad sterke drank aan boord is niet groter dan 0,1 liter per zeevarende per reisdag.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.3.6
  - number: 4.3.6.2
    text: |-
      Het aantal reisdagen wordt vastgesteld gerekend vanaf de dag van vertrek tot en met de dag van aankomst
      in de eerstvolgende haven waar het zeeschip weer zal worden bevoorraad als vastgesteld overeenkomstig
      [artikel 4.3.2, eerste lid, onderdeel d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel4
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.3.6
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.3.7.1
    text: |-
      Een inspectie als bedoeld in [artikel 4.1.1, derde lid, van het besluit][ref1] wordt ten minste één keer per maand
      uitgevoerd overeenkomstig het bepaalde in norm A3.2, zevende lid, van het MLC-verdrag.


      [ref1]: https://wetten.overheid.nl/BWBR0050941#Artikel4
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.3.7
    references:
      - id: ref1
        bwb_id: BWBR0050941
        artikel: '4'
  - number: 4.3.7.2
    text: De bevindingen van de inspectie worden in het scheepsdagboek vermeld.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.3.7
  - number: 4.3.7.3
    text: |-
      Voor het uitvoeren van een inspectie van het drinkwater worden alle noodzakelijke hygiënemaatregelen genomen om
      besmetting van het drinkwater te voorkomen.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.3.7
  - number: 4.4.1
    text: 'Deze paragraaf is uitsluitend van toepassing op een van een dek voorzien vissersvaartuig:'
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.1
  - number: 4.4.1.a
    text: waarvoor het bouwcontract of het contract voor ingrijpende verbouwing op of na 15 november 2019 is gegund;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.1
  - number: 4.4.1.b
    text: |-
      waarvoor het bouwcontract of het contract voor ingrijpende verbouwing voor 15 november 2019 is gegund en dat drie
      of meer jaar na die datum wordt opgeleverd; of
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.1
  - number: 4.4.1.c
    text: 'waarvan, bij gebrek aan een bouwcontract, op of na 15 november 2019:'
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.1
  - number: 4.4.1.c.1°
    text: de kiel is gelegd;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.1
  - number: 4.4.1.c.2°
    text: de bouw als een herkenbaar specifiek type vaartuig begint; of
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.1
  - number: 4.4.1.c.3°
    text: |-
      de assemblage is begonnen, die ten minste 50.000 kilogram of 1 procent van de geschatte massa van alle
      constructiemateriaal omvat, waarbij de kleinste van de twee hoeveelheden bepalend is.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.1
  - number: 4.4.2.1
    text: In alle verblijven is voldoende stahoogte.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.2
  - number: 4.4.2.2
    text: |-
      Voor verblijven waar de vissers geacht worden gedurende langere tijd achtereen te staan, is de stahoogte ten minste
      twee meter.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.2
  - number: 4.4.3.1
    text: |-
      Vanuit visruimen en machinekamers zijn geen directe openingen naar slaapverblijven, met uitzondering van
      nooduitgangen.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.3
  - number: 4.4.3.2
    text: |-
      Directe openingen naar slaapverblijven vanuit kombuizen, opslagruimten, droogkamers of gemeenschappelijke sanitaire
      ruimten worden, waar redelijk en uitvoerbaar, vermeden, tenzij uitdrukkelijk elders anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.3
  - number: 4.4.3.3
    text: |-
      In afwijking van het eerste en tweede lid zijn in een vissersvaartuig met een lengte van 24 meter of meer geen
      directe openingen naar slaapverblijven vanuit visruimen, machineruimten, kombuizen, opslagruimten, droogkamers of
      gemeenschappelijke sanitaire ruimten, met uitzondering van nooduitgangen.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.3
  - number: 4.4.3.4
    text: Het derde lid sluit de aanwezigheid van gedeelde sanitaire ruimten tussen twee slaapverblijven niet uit.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.3
  - number: 4.4.3.5
    text: |-
      Het gedeelte van een schot dat in het derde lid bedoelde ruimten scheidt van slaapverblijven alsmede de
      buitenwanden van die ruimten zijn doelmatig vervaardigd van staal of van ander goedgekeurd materiaal en zijn water-
      en gasdicht.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.3
  - number: 4.4.3.6
    text: Verblijven zijn voor zover nodig voorzien van nooduitgangen.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.3
  - number: 4.4.4.1
    text: Verblijven zijn voldoende geïsoleerd.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.4
  - number: 4.4.4.2
    text: |-
      Materialen die zijn gebruikt voor de constructie van interne wanden, lambrisering en bekleding, evenals vloeren en
      verbindingselementen zijn geschikt voor het beoogde doel en dragen bij tot een gezonde omgeving.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.4
  - number: 4.4.4.3
    text: In verblijven is voldoende waterafvoer.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.4
  - number: 4.4.4.4
    text: |-
      Aan het gestelde in het eerste tot en met derde lid wordt in ieder geval voldaan indien norm A3.1, zesde lid,
      onderdelen b en g, van het MLC-verdrag, zoals die luidde op 15 november 2019, is toegepast.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.4
  - number: 4.4.5
    text: |-
      Alle praktische maatregelen worden getroffen om verblijven voor de bemanning van vissersvaartuigen te beschermen
      tegen vliegen en andere insecten, met name wanneer het vissersvaartuig actief is in door muggen geteisterde
      gebieden.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.5
  - number: 4.4.6.1
    text: Verblijven worden geventileerd, rekening houdend met de klimatologische omstandigheden.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.6
  - number: 4.4.6.2
    text: |-
      Het ventilatiesysteem zorgt constant en onder alle weers- en klimatologische omstandigheden voor voldoende verse
      lucht wanneer er vissers aan boord zijn.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.6
  - number: 4.4.6.3
    text: |-
      Aan het gestelde in het eerste en tweede lid wordt in ieder geval voldaan indien norm A3.1, zevende lid,
      onderdeel b, en leidraad B3.1.2 van het C188-verdrag, zoals die luidde op 15 november 2019, is toegepast.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.6
  - number: 4.4.7.1
    text: Verblijven worden voldoende verwarmd, rekening houdend met de klimatologische omstandigheden.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.7
  - number: 4.4.7.2
    text: |-
      Onverminderd het eerste lid wordt een vissersvaartuig met een lengte van 24 meter of meer, met uitzondering van een
      vissersvaartuig dat uitsluitend in tropische gebieden actief is, voldoende verwarmd door middel van een geschikt
      verwarmingssysteem.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.7
  - number: 4.4.7.3
    text: |-
      Het verwarmingssysteem, bedoeld in het tweede lid, zorgt, voor zover nodig, onder alle omstandigheden voor warmte
      en is operationeel wanneer vissers aan boord zijn.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.7
  - number: 4.4.7.4
    text: |-
      Een vissersvaartuig met een lengte van 24 meter of meer is, voorzien van airconditioning in verblijven, op de
      brug, in de radiokamer en in de gecentraliseerde machinecontrolekamer, met uitzondering van een vissersvaartuig dat
      regelmatig actief is in gebieden waar de gematigde klimatologische omstandigheden geen airconditioning vereisen.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.7
  - number: 4.4.7.5
    text: |-
      Aan het gestelde in het eerste tot en met vierde lid wordt in ieder geval voldaan indien norm A3.1, zevende lid,
      onderdelen b en d, en leidraad B3.1.3, tweede en derde lid, van het MLC-verdrag, zoals die luidde op 15 november
      2019, is toegepast.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.7
  - number: 4.4.8.1
    text: Een verblijf is behoorlijk verlicht.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.8
  - number: 4.4.8.2
    text: Indien uitvoerbaar zijn verblijven met zowel daglicht als kunstlicht verlicht.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.8
  - number: 4.4.8.3
    text: Slaapverblijven kunnen worden afgeschermd van daglicht.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.8
  - number: 4.4.8.4
    text: In aanvulling op het eerste lid is in iedere kooi voldoende leesverlichting aanwezig.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.8
  - number: 4.4.8.5
    text: |-
      Aan het gestelde in het eerste tot en met vierde lid wordt in ieder geval voldaan indien leidraad B3.1.4, eerste
      lid, van het MLC-verdrag, zoals die luidde op 15 november 2019, is toegepast.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.8
  - number: 4.4.9.1
    text: Slaapverblijven zijn voorzien van noodverlichting.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.9
  - number: 4.4.9.2
    text: |-
      Indien eetverblijven, gangen of andere ruimten nooduitgang zijn en niet zijn voorzien van noodverlichting, zijn
      deze voorzien van permanente nachtverlichting
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.9
  - number: 4.4.9.3
    text: |-
      Een vissersvaartuig met een lengte van 24 meter of meer is in alle delen van de verblijven waar de bemanning
      zich vrij kan bewegen, voorzien van verlichting die ten minste zodanig is dat een persoon met een normaal
      gezichtsvermogen in staat is een normaal gedrukte krant op een heldere dag te lezen.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.9
  - number: 4.4.10.1
    text: |-
      Indien het ontwerp, de afmetingen of het gebruik van het vissersvaartuig dat toelaat, zijn slaapverblijven zodanig
      geplaatst dat de gevolgen van bewegingen en versnellingen van het vissersvaartuig tot een minimum beperkt blijven.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.10
  - number: 4.4.10.2
    text: Slaapverblijven zijn achter het aanvaringsschot gelegen.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.10
  - number: 4.4.11.1
    text: |-
      Het aantal personen per slaapverblijf en het vloeroppervlak per persoon, exclusief de ruimte ingenomen door
      kooien en kasten, is zodanig dat, rekening houdend met het gebruik van het vissersvaartuig, de vissers aan boord
      beschikken over voldoende ruimte en comfort.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.11
  - number: 4.4.11.2
    text: |-
      Aan het gestelde in het eerste lid wordt in ieder geval voldaan indien het vloeroppervlak per persoon in een
      slaapverblijf voor gezellen of in een gecombineerd slaapverblijf voor officieren en gezellen, exclusief de ruimte
      ingenomen door kooien en kasten, ten minste bedraagt:
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.11
  - number: 4.4.11.2.a
    text: 'op een vissersvaartuig met een lengte van 13 tot 19 meter: 0,75 vierkante meter;'
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.11
  - number: 4.4.11.2.b
    text: 'op een vissersvaartuig met een lengte van 19 tot 24 meter: 1 vierkante meter.'
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.11
  - number: 4.4.11.3
    text: |-
      In aanvulling op het eerste en tweede lid is op een vissersvaartuig met een lengte van 24 meter of meer maar minder
      dan 45 meter, het vloeroppervlak per persoon in een slaapverblijf, exclusief de ruimte ingenomen door kooien en
      kasten, ten minste 1,5 vierkante meter.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.11
  - number: 4.4.11.4
    text: |-
      In aanvulling op het eerste en tweede lid is op een vissersvaartuig met een lengte van 45 meter of meer het
      vloeroppervlak per persoon in een slaapverblijf, exclusief de ruimte ingenomen door kooien en kasten, ten minste
      2 vierkante meter.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.11
  - number: 4.4.12.1
    text: Tenzij uitdrukkelijk anders bepaald, is het toegestane aantal personen per slaapverblijf niet meer dan zes.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.12
  - number: 4.4.12.2
    text: |-
      Op een vissersvaartuig met een lengte van 24 meter of meer is het toegestane aantal personen per slaapverblijf niet
      meer dan vier.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.12
  - number: 4.4.12.3
    text: |-
      De minister kan ontheffing verlenen van het tweede lid, indien het vereiste vanwege de grootte, het type of het
      beoogde gebruik van het vissersvaartuig naleving onredelijk of niet uitvoerbaar is.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.12
  - number: 4.4.12.4
    text: |-
      Tenzij uitdrukkelijk anders bepaald en indien uitvoerbaar zijn voor officieren één of meer afzonderlijke
      slaapverblijven aanwezig.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.12
  - number: 4.4.12.5
    text: |-
      Het maximumaantal personen dat in een slaapverblijf kan worden ondergebracht, is duidelijk leesbaar en onuitwisbaar
      vermeld op een duidelijk zichtbare plaats in de slaapruimte.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.12
  - number: 4.4.13.1
    text: |-
      Op een vissersvaartuig met een lengte van 24 meter of meer beschikken officieren, waar mogelijk, over een apart
      slaapverblijf. In geen geval zal het slaapverblijf voor officieren meer dan twee kooien bevatten.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.13
  - number: 4.4.13.2
    text: |-
      De minister kan in bepaalde gevallen ontheffing verlenen van het eerste lid, indien het vereiste vanwege de
      grootte, het type of het beoogde gebruik van het vissersvaartuig naleving onredelijk of niet uitvoerbaar is.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.13
  - number: 4.4.14.1
    text: Kooien hebben geschikte afmetingen voor één persoon en de matrassen zijn vervaardigd van geschikt materiaal.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.14
  - number: 4.4.14.2
    text: |-
      Op een vissersvaartuig met een lengte van 24 meter of meer zijn de binnenmaten van kooien ten minste 200 bij
      80 centimeter.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.14
  - number: 4.4.15.1
    text: |-
      Slaapverblijven zijn zodanig gelegen en ingericht dat een redelijk comfort voor de vissers is gewaarborgd en
      netheid wordt bevorderd.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.15
  - number: 4.4.15.2
    text: |-
      Slaapverblijven zijn ingericht met kooien, individuele kasten voor kleding en andere persoonlijke eigendommen en
      een geschikt schrijfoppervlak.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.15
  - number: 4.4.15.3
    text: |-
      Slaapverblijven op een vissersvaartuig met een lengte van 24 meter of meer zijn voorzien van een schrijftafel met
      stoel.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.15
  - number: 4.4.15.4
    text: |-
      De slaapverblijven zijn waar mogelijk zodanig geplaatst en uitgerust dat mannen en vrouwen over voldoende privacy
      beschikken.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.15
  - number: 4.4.16.1
    text: |-
      Een vissersvaartuig is voorzien van geschikte eetverblijven die, waar mogelijk, gescheiden zijn van de
      slaapverblijven.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.16
  - number: 4.4.16.2
    text: Eetverblijven zijn zo dicht mogelijk bij de kombuis gelegen, maar zijn niet gelegen voor het aanvaringsschot.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.16
  - number: 4.4.16.3
    text: Eetverblijven op een vissersvaartuig met een lengte van 24 meter of meer zijn gescheiden van slaapverblijven.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.16
  - number: 4.4.17.1
    text: De afmetingen en uitrusting van een eetverblijf zijn geschikt voor het aantal personen aan boord.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.17
  - number: 4.4.17.2
    text: |-
      Op een vissersvaartuig met een lengte van 12 meter of meer zijn te allen tijde een koelkast met voldoende
      capaciteit en voorzieningen voor het bereiden van warme en koude dranken beschikbaar.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.17
  - number: 4.4.18.1
    text: |-
      Voor alle personen zijn sanitaire voorzieningen aanwezig, bestaande uit toiletten, wastafels, en baden of douches
      al naar gelang het gebruik van het vissersvaartuig. Deze voorzieningen voldoen ten minste aan de minimumnormen op
      het gebied van gezondheid en hygiëne en aan redelijke kwaliteitsnormen.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.18
  - number: 4.4.18.2
    text: Sanitaire voorzieningen zijn zodanig uitgevoerd dat verontreiniging van andere ruimten uitgesloten is.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.18
  - number: 4.4.18.3
    text: Sanitaire voorzieningen bieden redelijke privacy.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.18
  - number: 4.4.18.4
    text: |-
      Aan het gestelde in het eerste tot en met derde lid wordt in ieder geval voldaan indien norm A3.1, elfde lid,
      onderdelen a tot en met c, van het MLC-verdrag, zoals die luidde op 15 november 2019, is toegepast.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.18
  - number: 4.4.19.1
    text: |-
      Koud en warm stromend water zijn in zodanig voldoende mate beschikbaar voor alle vissers en alle overige personen
      aan boord dat een behoorlijke hygiëne mogelijk is.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.19
  - number: 4.4.19.2
    text: |-
      Sanitaire voorzieningen zijn voorzien van ventilatie met de buitenlucht, die onafhankelijk is van overige
      verblijven.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.19
  - number: 4.4.19.3
    text: |-
      Oppervlakken in sanitaire verblijven zijn eenvoudig en doeltreffend te reinigen. Vloeren zijn voorzien van een
      antislip laag.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.19
  - number: 4.4.19.4
    text: |-
      Onverminderd het eerste tot en met derde lid zijn op een vissersvaartuig met een lengte van 24 meter of meer voor
      vissers, die niet beschikken over een eigen slaapverblijf met bijbehorende sanitaire voorzieningen, ten minste een
      bad of douche, een toilet en een wasbak per vier of minder vissers aanwezig.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.19
  - number: 4.4.19.5
    text: |-
      Aan het gestelde in het eerste tot en met vierde lid wordt in ieder geval voldaan indien norm A3.1, zevende lid,
      onderdeel c, en elfde lid, onderdelen a tot en met d en f, en leidraad B3.1.7, eerste lid tot en met derde lid, van
      het MLC-verdrag, zoals die luidde op 15 november 2019, is toegepast.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.19
  - number: 4.4.20.1
    text: |-
      Er zijn voorzieningen voor het wassen en drogen van kleding beschikbaar, rekening houdend met het gebruik van het
      vissersvaartuig.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.20
  - number: 4.4.20.2
    text: |-
      Onverminderd het eerste lid zijn op een vissersvaartuig met een lengte van 24 meter of meer toereikende
      voorzieningen voor het wassen, drogen en strijken van kleding beschikbaar.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.20
  - number: 4.4.20.3
    text: |-
      Onverminderd het eerste lid zijn op een vissersvaartuig met een lengte van 45 meter of meer toereikende
      voorzieningen voor het wassen, drogen en strijken van kleding beschikbaar die zijn gelegen in een van de
      slaapverblijven, eetverblijven en toiletten afgescheiden ruimte, die voldoende is geventileerd en verwarmd en is
      voorzien van waslijnen of andere middelen voor het drogen van kleding.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.20
  - number: 4.4.21.1
    text: Indien nodig wordt een slaapverblijf beschikbaar gemaakt als ziekenverblijf voor een zieke of gewonde visser.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.21
  - number: 4.4.21.2
    text: |-
      Op een vissersvaartuig van meer dan 950 GT die met een bemanning van 15 vissers of meer een reis van meer dan drie
      dagen maakt, of een vissersvaartuig met een lengte van 45 meter of meer ongeacht het aantal bemanningsleden en de
      duur van de reis, is een apart ziekenverblijf aanwezig waar medische zorg kan worden verleend.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.21
  - number: 4.4.21.3
    text: Het ziekenverblijf is adequaat uitgerust en verkeert te allen tijde in hygiënische staat.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.21
  - number: 4.4.22
    text: |-
      Op een gemakkelijk bereikbare plaats buiten de slaapverblijven is een ruimte beschikbaar voor het ophangen van
      spullen voor gebruik bij slecht weer en andere persoonlijke beschermingsmiddelen.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.22
  - number: 4.4.23.1
    text: Aan vissers aan boord worden eetgerei, beddengoed en ander linnengoed verstrekt.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.23
  - number: 4.4.23.2
    text: |-
      De kosten van het in het eerste lid bedoelde linnengoed kunnen worden ingehouden als exploitatiekosten
      indien daartoe is voorzien in de zee-arbeidsovereenkomst in de zeevisserij, de toepasselijke collectieve
      arbeidsovereenkomst of de maatschapsovereenkomst op grond waarvan de vissers werk verrichten.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.23
  - number: 4.4.24.1
    text: |-
      Een vissersvaartuig met een lengte van 24 meter of meer beschikt over geschikte recreatieve voorzieningen en
      -diensten voor alle vissers aan boord.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.24
  - number: 4.4.24.2
    text: Indien geschikt kunnen eetverblijven worden gebruikt voor recreatie.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.24
  - number: 4.4.25
    text: |-
      Vissers aan boord krijgen, voor zover mogelijk en binnen redelijke grenzen, toegang tot communicatievoorzieningen
      tegen een redelijke kostprijs die de totale kostprijs voor de eigenaar van het vissersvaartuig niet overstijgt.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.25
  - number: 4.4.26.1
    text: |-
      Aan boord zijn kookvoorzieningen en kookgerei beschikbaar. Tenzij uitdrukkelijk anders bepaald en indien
      uitvoerbaar zijn deze ondergebracht in een afzonderlijke kombuis.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.26
  - number: 4.4.26.2
    text: |-
      Een kombuis of de kookplaats indien geen afzonderlijke kombuis aanwezig is, is van voldoende afmetingen, goed
      verlicht, geventileerd en naar behoren uitgerust en onderhouden.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.26
  - number: 4.4.26.3
    text: Een vissersvaartuig met een lengte van 24 meter of meer beschikt over een afzonderlijke kombuis.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.26
  - number: 4.4.27
    text: |-
      Tanks of flessen met butaan- of propaangas voor het koken in een kombuis zijn geplaatst op het open dek en afdoende
      beschermd tegen externe hittebronnen en andere externe invloeden.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.27
  - number: 4.4.28.1
    text: |-
      Aan boord is een geschikte plaats met voldoende capaciteit aanwezig voor de opslag van levensmiddelen zodat deze
      droog, koel en goed geventileerd kunnen worden bewaard en bederf wordt voorkomen. Waar mogelijk worden koelkasten
      of andere voorzieningen voor opslag bij lage temperaturen gebruikt.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.28
  - number: 4.4.28.2
    text: |-
      Een vissersvaartuig met een lengte van 12 meter of meer beschikt over een provisiekamer, een koelkast en andere
      voorzieningen voor opslag bij lagere temperaturen.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.28
  - number: 4.4.29.1
    text: |-
      Aan boord is voldoende voeding en drinkwater aanwezig voor de vissers aan boord, gelet op de duur en aard van de
      reis.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.29
  - number: 4.4.29.2
    text: |-
      Voeding en drinkwater zijn voor wat betreft de voedingswaarde, kwaliteit, kwantiteit en variatie geschikt, waarbij
      ook rekening is gehouden met de voorschriften en gebruiken omtrent voeding die voortvloeien uit de religie en
      cultuur van de vissers.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.29
  - number: 4.4.30.1
    text: |-
      Verblijven worden schoon en bewoonbaar gehouden en zijn vrij van goederen en voorraden die niet tot de persoonlijke
      eigendommen van de visser behoren en niet zijn bedoeld voor hun veiligheid of redding in geval van nood.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.30
  - number: 4.4.30.2
    text: Een kombuis en de opslagvoorzieningen voor levensmiddelen worden in een hygiënische staat gehouden.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.30
  - number: 4.4.30.3
    text: Afval wordt bewaard in goed afgesloten containers en tijdig afgevoerd uit de ruimten waar voedsel wordt bereid.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.30
  - number: 4.4.31.1
    text: |-
      Aan boord van een vissersvaartuig met een lengte van meer dan 24 meter wordt door of op gezag van de schipper
      eenmaal per reis of ten minste eenmaal per maand inspecties uitgevoerd om te waarborgen dat:
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.31
  - number: 4.4.31.1.a
    text: verblijven schoon, aanvaardbaar bewoonbaar, veilig en in een goede staat van onderhoud verkeren;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.31
  - number: 4.4.31.1.b
    text: voedsel- en watervoorraden toereikend zijn; en
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.31
  - number: 4.4.31.1.c
    text: |-
      kombuis, ruimten en uitrusting voor de opslag van voedsel hygiënisch zijn en in een goede staat van onderhoud
      verkeren.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.31
  - number: 4.4.31.2
    text: |-
      De bevindingen van deze inspecties en de getroffen maatregelen om eventuele tekortkomingen te verhelpen worden
      vermeld in het scheepsdagboek.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.31
  - number: 4.4.32
    text: |-
      De minister kan na overleg met de betrokken organisaties van scheepsbeheerders en vissers ontheffing verlenen
      van de artikelen van deze [paragraaf][ref1] waardoor, zonder discriminatie, rekening kan worden gehouden met de
      belangen van vissers met onderling verschillende en bijzondere religieuze en sociale gewoonten, op voorwaarde
      dat deze ontheffing niet ertoe leidt dat de algemene algehele omstandigheden minder gunstig zijn dan die welke
      voortvloeien uit de toepassing van deze paragraaf.


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.4.32
    references:
      - id: ref1
        bwb_id: BWBR0051068
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: 4.5.1
    text: |-
      Deze paragraaf is van toepassing op een vissersvaartuig, niet zijnde een vissersvaartuig als bedoeld in
      [artikel 4.4.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel4
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.1
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: 4.5.2.1
    text: Verblijven zijn midscheeps of in het achterschip gelegen.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.2
  - number: 4.5.2.2
    text: |-
      In bijzondere gevallen kan de minister ontheffing verlenen van het eerste lid indien de grootte, het type of het
      beoogde gebruik van het naleving naleving onredelijk of niet uitvoerbaar is.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.2
  - number: 4.5.2.3
    text: |-
      Er zijn voldoende dagverblijven aanwezig, gescheiden van de slaapverblijven en zo dicht mogelijk bij de kombuis
      gelegen. Indien op een vissersvaartuig met een lengte van minder dan 24 meter een afzonderlijk dagverblijf niet
      mogelijk is, kan worden volstaan met een gecombineerd dag- en slaapverblijf.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.2
  - number: 4.5.2.4
    text: |-
      Op een vissersvaartuig met een lengte van 60 meter of meer zijn zowel voor de kapitein en de officieren als voor de
      gezellen afzonderlijke dagverblijven aanwezig.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.2
  - number: 4.5.3.1
    text: |-
      De plaats, de toegangen, de constructie en de indeling van een dag- of slaapverblijf ten opzichte van een andere
      ruimte is zodanig dat de veiligheid, de bescherming tegen weersinvloeden en overkomend zeewater en de isolatie
      tegen hitte en kou, overmatig lawaai of tegen uitwaseming van andere ruimten, voldoende zijn verzekerd.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.3
  - number: 4.5.3.2
    text: |-
      De inrichting van de toegangen tot een dag- of slaapverblijf is zodanig, dat deze toegangen steeds aan beide zijden
      gemakkelijk en vlug kunnen worden geopend en voldoende doorgang laten.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.3
  - number: 4.5.3.3
    text: |-
      Indien de minister dit noodzakelijk acht, is een dag- of slaapverblijf op naar zijn oordeel doelmatige plaatsen
      voorzien van nooduitgangen.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.3
  - number: 4.5.3.4
    text: |-
      Het materiaal en de constructie van de dekken in een dag- of slaapverblijf zijn goedgekeurd door de minister. Het
      oppervlak van deze dekken is ondoordringbaar voor vocht en gemakkelijk schoon te houden.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.3
  - number: 4.5.3.5
    text: |-
      Indien de vloeren zijn vervaardigd uit samengesteld materiaal, zijn de verbindingen met de wanden naar boven
      afgerond om spleten of naden te vermijden.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.3
  - number: 4.5.3.6
    text: |-
      Indien het stalen bovendek van een dag- of slaapverblijf aan de buitenlucht of aan de invloed van enige warmtebron
      aan boord is blootgesteld, wordt deze aan de bovenzijde met hout ter dikte van ten minste 5 centimeter of met ander
      deugdelijk en gelijkwaardig isolatiemateriaal bekleed, dan welis aan de onderzijde een bekleding met even groot
      isolerend vermogen aangebracht.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.3
  - number: 4.5.3.7
    text: |-
      In een dag- en slaapverblijf is aansluitend tegen de dekbalken een plafond aangebracht, dat geheel of gedeeltelijk
      wegneembaar is.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.3
  - number: 4.5.3.8
    text: |-
      Een slaapverblijf staat niet rechtstreeks in verbinding met visruimen, opslagplaatsen voor vismeel, ruimten waarin
      werktuigen zijn opgesteld, kombuizen, lampenhutten, verfhutten, bergruimten, droogkamers, gemeenschappelijke
      wasplaatsen en toiletten.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.3
  - number: 4.5.3.9
    text: |-
      Het gedeelte van een schot dat de in het achtste lid bedoelde ruimten scheidt van slaapverblijven alsmede de
      buitenwanden van die ruimten zijn doelmatig vervaardigd van staal of van ander goedgekeurd materiaal en zijn water-
      en gasdicht.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.3
  - number: 4.5.3.10
    text: |-
      Buitenschotten van een dag- of slaapverblijf zijn doelmatig geïsoleerd. Schotten van een machinekamerschacht,
      een kombuis en van een andere ruimte waarin warmte wordt ontwikkeld, zijn doelmatig geïsoleerd dat geen
      warmteuitstraling plaatsvindt naar aangrenzende verblijven of gangen van de verblijven. Tevens vindt bescherming
      plaats tegen warmteuitstraling van stoom of warmwaterleidingen.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.3
  - number: 4.5.3.11
    text: |-
      Schotten in een dag- of slaapverblijf zijn vervaardigd van goedgekeurd materiaal waarin zich geen ongedierte kan
      nestelen.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.3
  - number: 4.5.3.12
    text: |-
      Een dag- of slaapverblijf en gangen in de verblijven zijn voldoende geïsoleerd om condensatie en te hoge
      temperaturen te voorkomen.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.3
  - number: 4.5.3.13
    text: |-
      De hoogte van een dag- of slaapverblijf tussen de dekken, gemeten van de onderkant van het plafond tot de bovenkant
      van de vloerbedekking, bedraagt op alle plaatsen waar de bemanning zich vrij moet kunnen bewegen, 2 meter of meer.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.3
  - number: 4.5.3.14
    text: |-
      Hoofdstoom- en afvoerleidingen van lieren en andere hulpwerktuigen zijn buiten de dag- en slaapverblijven en zo
      mogelijk buiten de gangen naar deze verblijven aangelegd.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.3
  - number: 4.5.3.15
    text: |-
      Waar de leidingen, bedoeld in het dertiende de lid, door de gangen lopen, zijn deze voorzien van een doelmatige
      isolatie en omkasting.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.3
  - number: 4.5.3.16
    text: |-
      Flenskoppelingen van leidingen zijn niet in een dag- of slaapverblijf aangebracht. Indien dit niet uitvoerbaar is,
      kan de minister, hiervan ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.3
  - number: 4.5.3.17
    text: |-
      Lucht- en overvloeileidingen van tanks monden niet uit in een dag- of slaapverblijf of in een gang naar een zodanig
      verblijf.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.3
  - number: 4.5.3.18
    text: Ankerkettingen lopen niet door een dag- of slaapverblijf, tenzij deze zijn beschermd door zware kokers.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.3
  - number: 4.5.3.19
    text: |-
      In dag- en slaapverblijven zijn de huid en de eindschotten van de bovenbouw met hout bekleed of op soortgelijke
      wijze van een bekleding van ander deugdelijk materiaal voorzien.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.3
  - number: 4.5.3.20
    text: |-
      De wanden en plafonds van dag- en slaapverblijven zijn gemakkelijk schoon te houden. Indien deze zijn geschilderd,
      is dit gebeurd in een lichte kleur.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.3
  - number: 4.5.3.21
    text: Er zijn voldoende middelen aanwezig zijn voor het afvoeren van water uit een dag- of slaapverblijf.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.3
  - number: 4.5.3.22
    text: |-
      Alle praktische maatregelen worden getroffen om verblijven voor de bemanning vanvissersvaartuigen te beschermen
      tegen vliegen en andere insecten, met name wanneer het vissersvaartuig actief is in door muggen geteisterde
      gebieden.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.3
  - number: 4.5.4
    text: |-
      De bepalingen van [artikel 4.5.3][ref1] zijn van overeenkomstige toepassing op sanitaire ruimten, verblijven voor
      ziekenverpleging en ontspanning, bestemd voor gebruik door de vissers met dien verstande dat de bekleding en de
      isolatie van wanden slechts daar is aangebracht, waar dit door de minister nodig wordt geoordeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel4
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.4
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.5'
  - number: 4.5.5.1
    text: Verblijven worden geventileerd, rekening houdend met de klimatologische omstandigheden.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.5
  - number: 4.5.5.2
    text: Het ventilatiesysteem zorgt constant voor voldoende verse lucht wanneer er vissers aan boord zijn.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.5
  - number: 4.5.5.3
    text: |-
      Een vissersvaartuig dat regelmatig wordt ingezet voor reizen in de tropen of in andere gebieden met vergelijkbare
      klimatologische omstandigheden, is uitgerust met mechanische ventilatiemiddelen of met elektrisch aangedreven
      waaiers, met dien verstande dat slechts één van deze middelen behoeft te zijn aangebracht in ruimten waar dit een
      voldoende ventilatie verzekert.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.5
  - number: 4.5.5.4
    text: |-
      Een vissersvaartuig dat wordt ingezet op reizen in gebieden anders dan bedoeld in het tweede lid, is uitgerust met
      mechanische ventilatiemiddelen of met elektrisch aangedreven waaiers.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.5
  - number: 4.5.5.5
    text: |-
      Voor een vissersvaartuig dat geregeld wordt ingezet op reizen in koude streken, kan de minister ontheffing van het
      derde lid verlenen.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.5
  - number: 4.5.5.6
    text: |-
      Het vermogen dat nodig is om de ventilatiemiddelen, bedoeld in het tweede en derde lid, aan te drijven, is
      beschikbaar gedurende de gehele tijd dat er vissers aan boord verblijven of werken en de omstandigheden dit
      vereisen.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.5
  - number: 4.5.5.7
    text: Toiletten zijn onafhankelijk van andere gedeelten van een verblijf op de buitenlucht geventileerd.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.5
  - number: 4.5.6.1
    text: Verblijven worden voldoende verwarmd, rekening houdend met de klimatologische omstandigheden.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.6
  - number: 4.5.6.2
    text: De verwarming geschiedt door toevoer van stoom, heet water, warme lucht of elektriciteit.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.6
  - number: 4.5.6.3
    text: |-
      De verwarmingsinrichting en de plaats en wijze van opstelling daarvan voldoet aan door de minister te stellen
      eisen.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.6
  - number: 4.5.6.4
    text: Het verwarmingssysteem is in gebruik zolang er vissers aan boord zijn en wanneer de omstandigheden dat vereisen.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.6
  - number: 4.5.6.5
    text: Radiatoren in een verblijf zijn doelmatig geplaatst en waar nodig afgeschermd.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.6
  - number: 4.5.6.6
    text: |-
      De verwarmingsinrichting heeft vermogen waarmee onder normale klimatologische omstandigheden die tijdens de reis
      kunnen worden ondervonden, in verblijven een temperatuur van ten minste 20 graden Celsius kan worden onderhouden.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.6
  - number: 4.5.7.1
    text: Verblijven zijn van voldoende verlichting voorzien.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.7
  - number: 4.5.7.2
    text: Indien uitvoerbaar zijn verblijven met zowel daglicht als kunstlicht verlicht.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.7
  - number: 4.5.7.3
    text: Slaapverblijven kunnen worden afgeschermd van daglicht.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.7
  - number: 4.5.7.4
    text: In iedere kooi is in aanvulling op de normale verlichting van het slaapverblijf voldoende leesverlichting aanwezig.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.7
  - number: 4.5.8.1
    text: |-
      Met inachtneming van het tweede lid, is een slaapverblijf ten hoogste bestemd voor het hieronder vermelde aantal
      vissers:
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.8
  - number: 4.5.8.1.a
    text: 'een slaapverblijf voor officieren:'
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.8
  - number: 4.5.8.1.a.1°
    text: 'op een vissersvaartuig met een lengte van 60 meter en meer: één visser;'
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.8
  - number: 4.5.8.1.a.2°
    text: 'op een vissersvaartuig met een lengte van minder dan 60 meter: twee vissers;'
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.8
  - number: 4.5.8.1.b
    text: 'een slaapverblijf voor gezellen:'
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.8
  - number: 4.5.8.1.b.1°
    text: 'op een vissersvaartuig met een lengte van 60 meter en meer: twee vissers;'
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.8
  - number: 4.5.8.1.b.2°
    text: 'op een vissersvaartuig met een lengte van 35 tot 60 meter: vier vissers;'
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.8
  - number: 4.5.8.1.b.3°
    text: 'op een vissersvaartuig met een lengte van minder dan 35 meter: zes vissers.'
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.8
  - number: 4.5.8.2
    text: |-
      Op een vissersvaartuig met een lengte van minder dan 35 meter kan het slaapverblijf voor officieren en dat voor
      gezellen worden gecombineerd tot één verblijf voor ten hoogste zes vissers.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.8
  - number: 4.5.8.3
    text: |-
      Op een vissersvaartuig met een lengte van 35 meter en meer zijn voor het dekpersoneel, het machinekamerpersoneel en
      het personeel voor de civiele dienst afzonderlijke slaapverblijven beschikbaar.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.8
  - number: 4.5.8.4
    text: |-
      Voor zover dit praktisch uitvoerbaar is, zijn de slaapverblijven van wachtdoende vissers gescheiden van niet
      wachtdoende of vrije vissers.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.8
  - number: 4.5.8.5
    text: |-
      Het maximumaantal personen dat in een slaapverblijf kan worden ondergebracht, is duidelijk leesbaar en onuitwisbaar
      vermeld op een duidelijk zichtbare plaats in de slaapruimte.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.8
  - number: 4.5.9.1
    text: |-
      Slaapverblijven zijn zodanig gelegen en ingericht dat een redelijk comfort voor de vissers is gewaarborgd en
      netheid wordt bevorderd.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.9
  - number: 4.5.9.2
    text: |-
      Het vloeroppervlak per persoon in een slaapverblijf voor gezellen of in een gecombineerd slaapverblijf voor
      officieren en gezellen als bedoeld in [artikel 4.5.8, tweede lid][ref1], met uitzondering van de ruimte ingenomen
      door slaapplaatsen en kasten, bedraagt ten minste op een vissersvaartuig:







                    (i)


                    met een lengte van 13 tot 19 meter:


                    0,5 vierkante meter




                    (ii)


                    met een lengte van 19 tot 26 meter:


                    0,75 vierkante meter




                    (iii)


                    met een lengte van 26 tot 35 meter:


                    0,9 vierkante meter




                    (iv)


                    met een lengte van 35 meter en meer:


                    1,0 vierkante meter


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel4
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.9
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.5'
  - number: 4.5.9.3
    text: |-
      Het vloeroppervlak per persoon in een slaapverblijf voor officieren, met uitzondering van de ruimte ingenomen door
      slaapplaatsen en kasten, bedraagt ten minste:








                    (i)


                    met een lengte van minder dan 60 meter:



                    2,0 vierkante meter




                    (ii)


                    met een lengte van 60 meter en meer:



                    2,5 vierkante meter
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.9
  - number: 4.5.9.4
    text: |-
      In een slaapverblijf is voor iedere visser een kledingkast aanwezig met een hoogte van ten minste 1,75 meter en
      een dwarsdoorsnede van ten minste 0,2 vierkante meter, voorzien van een legplank en een roede waaraan kleding op
      kleerhangers kan worden gehangen. De kast is voorzien van een slot of van lippen voor een hangslot.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.9
  - number: 4.5.9.5
    text: |-
      In een slaapverblijf is voor iedere bewoner een lade of soortgelijke ruimte aanwezig met een inhoud van tenminste
      60 kubieke decimeter.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.9
  - number: 4.5.9.6
    text: |-
      In een slaapverblijf is een tafel of lessenaar met een gemakkelijke zitgelegenheid aanwezig. De tafel of lessenaar
      mag vast, inklapbaar of uitschuifbaar zijn.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.9
  - number: 4.5.9.7
    text: |-
      Een slaapverblijf is uitgerust met een spiegel, kastjes voor toiletbenodigdheden, een boekenrek en een voldoende
      aantal kleerhaken.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.9
  - number: 4.5.9.8
    text: |-
      Een slaapverblijf voor officieren is voorzien van een wastafel, de nodigelegkasten of laden, gordijnen, handdoek-
      en deurhaken en doelmatige vloerbedekking.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.9
  - number: 4.5.9.9
    text: |-
      De meubelen zijn vervaardigd van glad, hard materiaal dat niet kromtrekt of roest en waarin zich geen ongedierte
      kan nestelen.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.9
  - number: 4.5.9.10
    text: Voor de patrijspoorten in een slaapverblijf zijn gordijnen of jaloezieën aangebracht.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.9
  - number: 4.5.9.11
    text: Voor elke visser is een afzonderlijke slaapplaats beschikbaar.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.9
  - number: 4.5.9.12
    text: Slaapplaatsen zijn behoorlijk van elkaar gescheiden en afzonderlijk toegankelijk.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.9
  - number: 4.5.9.13
    text: Er zijn niet meer dan twee slaapplaatsen boven elkaar aangebracht.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.9
  - number: 4.5.9.14
    text: De onderkant van de onderste slaapplaats is meer dan 30 centimeter boven de vloer gelegen.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.9
  - number: 4.5.9.15
    text: |-
      De afstand tussen de onderkant van de onderste slaapplaats en de onderkant van de bovenste slaapplaats en de
      afstand tussen de onderkant van de bovenste slaapplaats en de onderkant van het plafond 75 centimeter of meer.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.9
  - number: 4.5.9.16
    text: |-
      Aan de onderkant van de bovenste slaapplaats is een stofdichte bodem van hout, zeildoek of ander geschikt materiaal
      aangebracht.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.9
  - number: 4.5.9.17
    text: Een slaapplaats is, binnenwerks gemeten, 2 meter of meer lang en 0,68 meter of meer breed.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.9
  - number: 4.5.9.18
    text: |-
      Een slaapplaats is van hout of van deugdelijk hard materiaal dat niet gemakkelijk roest, vervaardigd. De
      constructie is zodanig dat er zich geen ongedierte in kan nestelen en de slaapplaats gemakkelijk kan worden
      schoongemaakt.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.9
  - number: 4.5.9.19
    text: |-
      Indien een slaapplaats uit buizen is samengesteld, zijn in deze buizen geen openingen aanwezig die aan ongedierte
      toegang kunnen verlenen. Houten kooiplanken zijn uitneembaar.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.9
  - number: 4.5.9.20
    text: |-
      Een slaapplaats is voorzien van een matras van deugdelijk materiaal. Als vulling voor matrassen is geen materiaal
      gebruikt waarin zich ongedierte kan nestelen.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.9
  - number: 4.5.9.21
    text: Onder de opening van een luchtkoker is geen slaapplaats aanwezig.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.9
  - number: 4.5.10.1
    text: |-
      De grootte en inrichting en het aantal tafels en zitbanken of stoelen, vastgezet of verplaatsbaar, van een
      dagverblijf zijn voldoende voor het grootste aantal personen dat gelijktijdig van het verblijf gebruik kan maken.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.10
  - number: 4.5.10.2
    text: |-
      Tenzij pantry’s aanwezig zijn die in rechtstreekse verbinding staan met een dagverblijf, is in deze voldoende
      kastruimte aanwezig voor het opbergen van eetgerei, alsmede een geschikte gelegenheid voor het schoonmaken daarvan.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.10
  - number: 4.5.10.3
    text: |-
      De bovenkanten van tafels, zitbanken of stoelen zijn vervaardigd van vochtwerend materiaal, zonder barsten, dat
      gemakkelijk is schoon te houden.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.10
  - number: 4.5.10.4
    text: |-
      Waar dit uitvoerbaar is, is een dagverblijf zodanig ontworpen, gemeubileerd en uitgerust dat deze gelegenheid biedt
      tot ontspanning.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.10
  - number: 4.5.10.5
    text: Indien een radiodistributie-installatie aanwezig is, zijn dagverblijven daarop aangesloten.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.10
  - number: 4.5.11.1
    text: |-
      Een vissersvaartuig is voorzien van voldoende sanitaire voorzieningen, met inbegrip van wastafels, douches en
      toiletten.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.11
  - number: 4.5.11.2
    text: |-
      Voor vissers die gebruik maken van een slaapverblijf dat niet is voorzien van eigen sanitair, zijn de volgende
      voorzieningen aanwezig:







                    (i)


                    voor zes vissers of minder:


                    één wastafel




                    (ii)


                    voor acht vissers of minder:


                    één douche




                    (iii)


                    één toilet voor acht vissers of minder:


                    één toilet
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.11
  - number: 4.5.11.3
    text: |-
      Bij de berekening wordt een aantal van drie vissers of minder ten aanzien van douches en toiletten en een aantal
      van twee vissers of minder ten aanzien van wastafels, verwaarloosd.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.11
  - number: 4.5.12.1
    text: 'Een sanitaire ruimte bestemd voor gemeenschappelijk gebruik voldoet aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.12
  - number: 4.5.12.1.a
    text: de vloer bestaat uit deugdelijk, duurzaam en gemakkelijk te reinigen materiaal, dat ondoordringbaar is voor vocht;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.12
  - number: 4.5.12.1.b
    text: |-
      schotten zijn van staal of ander deugdelijk materiaal vervaardigd en tot een hoogte van ten minste 25 centimeter
      boven de vloer waterdicht uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.12
  - number: 4.5.12.1.c
    text: toiletten zijn op voldoende wijze van elkaar zijn gescheiden en gemakkelijk bereikbaar;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.12
  - number: 4.5.12.1.d
    text: |-
      een toilet is van een ruime afvoer voorzien en kan afzonderlijk door middel van een vaste inrichting gemakkelijk
      worden doorgespoeld, zodanig, dat geen stank wordt verspreid;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.12
  - number: 4.5.12.1.e
    text: |-
      wastafels en badkuipen zijn van voldoende afmetingen en zijn vervaardigd van deugdelijk materiaal, met een glad
      oppervlak, niet onderhevig aan scheuren, schilferen of roesten; en
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.12
  - number: 4.5.12.1.f
    text: |-
      de vloer van een ruimte, waarin een toilet of een wasgelegenheid is ondergebracht, is voorzien van een behoorlijke
      waterafvoer.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.12
  - number: 4.5.12.2
    text: |-
      Een toilet staat niet rechtstreeks in verbinding met slaapverblijven, en met een doodlopende gang tussen
      de slaapverblijven en de toiletten, met dien verstande, dat dit niet geldt voor een toilet tussen twee
      slaapverblijven, welke tezamen voor niet meer dan vier personen zijn bestemd.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.12
  - number: 4.5.12.3
    text: |-
      Een toilet is van een zodanig model en de afvoer is zodanig ingericht, dat de kans op verstopping zo klein mogelijk
      is en het schoonhouden vergemakkelijkt wordt.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.12
  - number: 4.5.12.4
    text: |-
      De afvoer van het toilet loopt niet door drinkwatertanks en, indien uitvoerbaar, niet onderdeks door dag- of
      slaapverblijven.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.12
  - number: 4.5.12.5
    text: |-
      Het eerste lid, onderdelen a, b, d, e en f, is mede van toepassing op wastafels in slaapverblijven en op sanitaire
      ruimten die rechtstreeks in verbinding staan met slaapverblijven.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.12
  - number: 4.5.13.1
    text: |-
      Op een vissersvaartuig met een lengte van 35 meter of meer zijn voorzieningen voor het wassen en drogen van kleding
      beschikbaar, rekening houdend met het gebruik van het vissersvaartuig.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.13
  - number: 4.5.13.2
    text: De wasplaats voor kleding bevat geschikte spoelbakken die zijn voorzien van een afvoer.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.13
  - number: 4.5.13.3
    text: De wasplaats kan in een badkamer worden geplaatst indien niet in een afzonderlijke wasruimte kan worden voorzien.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.13
  - number: 4.5.13.4
    text: De spoelbakken zijn voorzien van stromend koud en warm zoet water.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.13
  - number: 4.5.13.5
    text: |-
      Onverminderd het eerste lid zijn toereikende voorzieningen voor het wassen, drogen en strijken van kleding
      beschikbaar die zijn gelegen in een van de slaapverblijven, eetverblijven en toiletten afgescheiden ruimte, die
      voldoende is geventileerd en verwarmd en is voorzien van waslijnen of andere middelen voor het drogen van kleding.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.13
  - number: 4.5.14
    text: |-
      Buiten, nabij de slaapverblijven is voldoende behoorlijk geventileerde bergruimte om oliegoed en natte of vuile
      kleding op te hangen.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.14
  - number: 4.5.15.1
    text: |-
      Op een vissersvaartuig met een lengte van 45 meter of meer is een afzonderlijk ziekenverblijf aanwezig dat voldoet
      aan [artikel 4.2.15][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel4
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.15
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 4.5.15.2
    text: |-
      Op een vissersvaartuig met een lengte van 35 tot 45 meter kan voor een zieke of gewonde een éénpersoons
      slaapverblijf beschikbaar worden gesteld, waarin de slaapplaats als ziekenkooi is ingericht.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.15
  - number: 4.5.15.3
    text: |-
      Op een vissersvaartuig met een lengte van minder dan 35 meter kan worden volstaan met een als ziekenkooi ingerichte
      slaapplaats in een slaapverblijf.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.15
  - number: 4.5.15.4
    text: |-
      De ziekenkooi is zodanig ingericht dat de zieke er gemakkelijk met de matras kan worden ingebracht en uitgenomen,
      waartoe zo nodig de schotten wegneembaar moeten zijn.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.15
  - number: 4.5.15.5
    text: |-
      Indien een visser aan een ernstige of aan een besmettelijke ziekte lijdt, wordt getracht deze, afgezonderd van alle
      anderen, te verplegen.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.15
  - number: 4.5.16.1
    text: Een verblijf wordt schoon en in behoorlijk bewoonbare toestand gehouden.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.16
  - number: 4.5.16.2
    text: |-
      Goederen en voorraden die niet het persoonlijk eigendom zijn van de gebruikers van het verblijf, worden daar niet
      opgeborgen.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.16
  - number: 4.5.16.3
    text: |-
      Ten minste éénmaal per week wordt door de schipper of een daarvoor door hem aangewezen officier een inspectie van
      een verblijf gehouden, waarbij hij zich door een of meer leden van de bemanning doet vergezellen.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.16
  - number: 4.5.16.4
    text: |-
      De bevindingen van deze inspecties en de getroffen maatregelen om eventuele tekortkomingen te verhelpen worden
      vermeld in het scheepsdagboek.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.16
  - number: 4.5.17
    text: |-
      Indien tijdens de reis gebreken ontstaan aan de in deze paragraaf omschreven voorzieningen, is de schipper
      verantwoordelijk om deze zo spoedig mogelijk te verhelpen.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.17
  - number: 4.5.18.1
    text: |-
      De minister kan, na overleg met de betrokken organisaties van scheepsbeheerders en vissers ontheffing verlenen
      van de [artikelen 4.5.2 tot en met 4.5.15][ref1], indien deze afwijkingen voordelen meebrengen welke tot resultaat
      hebben dat de inrichting over het geheel genomen niet minder gunstig is dan die welke het gevolg zou zijn van
      volledige toepassing van deze paragraaf.


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel4
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.5.18
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.5'
  - number: 4.5.18.2
    text: |-
      Voor een vissersschip dat voor 12 mei 1977 was afgebouwd, kan de minister, na overleg met de betrokken organisaties
      van scheepsbeheerders en vissers, wanneer het vissersvaartuig wordt ingeschreven in het register als bedoeld in
      [artikel 4 van het Besluit registratie vissersvaartuigen 1998][ref1] of wanneer ingrijpende veranderingen in de
      bouw of grote reparaties aan het vissersvaartuig worden uitgevoerd volgens een tevoren ontworpen plan en niet ten
      gevolge van een ongeval of ramp, ontheffing verlenen om het vissersvaartuig te laten voldoen aan de eisen gesteld
      in de [artikelen 4.5.2 tot en met 4.5.15][ref2], voor zover hij dit mogelijk acht, daarbij rekening houdende met
      alle praktische problemen welke zich bij de toepassing voordoen.


      [ref1]: https://wetten.overheid.nl/BWBR0009353#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0051068#Artikel4
