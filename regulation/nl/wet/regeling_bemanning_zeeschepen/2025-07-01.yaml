  - number: 3.5.11
    text: |-
      Voor de afgifte van het bekwaamheidsbewijs scheepskok, bedoeld in
      [artikel 2.4.4, tweede lid, van het besluit][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0050941#Artikel2
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.5.11
    references:
      - id: ref1
        bwb_id: BWBR0050941
        artikel: '2'
  - number: 3.5.11.a
    text: |-
      is de aanvrager in het bezit van een vaarbevoegdheidsbewijs als scheepskok, afgegeven voor 1 februari 2002, en
      heeft hij na de verkrijging van dat vaarbevoegdheidsbewijs een diensttijd behaald van ten minste 36 maanden als
      scheepskok bij een Nederlandse zeewerkgever; of
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.5.11
  - number: 3.5.11.b
    text: |-
      heeft de aanvrager een diensttijd behaald van ten minste één maand in de kombuis van een zeeschip en is hij in het
      bezit van een kennisbewijs van een opleiding tot kok die ten minste de volgende aspecten bevat:
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.5.11
  - number: 3.5.11.b.1°
    text: praktische kookvaardigheden;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.5.11
  - number: 3.5.11.b.2°
    text: voeding en persoonlijke hygiëne;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.5.11
  - number: 3.5.11.b.3°
    text: opslag van levensmiddelen;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.5.11
  - number: 3.5.11.b.4°
    text: voorraadcontrole;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.5.11
  - number: 3.5.11.b.5°
    text: milieubescherming; en
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.5.11
  - number: 3.5.11.b.6°
    text: gezondheid en veiligheid met betrekking tot maaltijdverzorging.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel3.5.11
  - number: 3.5.12
    text: |-
      Voor de afgifte van het bekwaamheidsbewijs wetgeving en openbaar gezag, bedoeld in
