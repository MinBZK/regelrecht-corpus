  - number: 1.2.b
    text: |-
      meevarende relaties en familie van zeevarenden, die geen werkzaamheden verrichten die onderdeel uitmaken van de
      normale werkzaamheden aan boord;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel1.2
  - number: 1.2.c
    text: |-
      militairen, inspecteurs en loodsen als bedoeld in [artikel 1, eerste lid, onderdeel b, van de Loodsenwet][ref1];


