    text: |-
      Voor de afgifte van een bekwaamheidsbewijs aanvulling-W reizen nabij de kust in de EEZ, om in aanmerking te komen
      voor een vaarbevoegdheidsbewijs hoofdwerktuigkundige als bedoeld in [artikel 3.2.13 van het besluit][ref1] heeft
      de aanvrager met goed gevolg een door de minister erkende training afgerond die de in [bijlage 8][ref2] genoemde
      onderdelen beslaat.


      [ref1]: https://wetten.overheid.nl/BWBR0050941#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0051068
