    text: |-
      Het model, bedoeld in [artikel 4.6.8, derde lid][ref1], bevat een opsomming van de eisen, bedoeld in het eerste
      lid, die op het desbetreffende zeeschip van toepassing zijn. Daarbij wordt voor wat betreft de voorschriften met
      betrekking tot huisvesting en voorzieningen voor zeevarenden onderscheid gemaakt tussen de verschillende typen
      zeeschepen, bedoeld in [paragraaf 4.1][ref2] en [4.2][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0051068#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0051068#Hoofdstuk4
