    text: |-
      In afwijking van [artikel 4.1.4, eerste lid][ref1], zijn voor een commercieel jacht als wezenlijk gelijkwaardige
      bepalingen als bedoeld in artikel VI, derde lid, van het MLC-verdrag de in de onderstaande tabel opgenomen normen
      ten aanzien van de minimale vloeroppervlakte voor slaapverblijven, tezamen met het tweede en derde lid, van
      toepassing:







                    Grootte commercieel jacht


                    Type slaapverblijf


                    Minimale vloeroppervlakte






                    tot 500 GT


                    eenpersoonsslaapverblijf zonder eigen sanitaire voorzieningen


                    3,6 vierkante meter




                    eenpersoonsslaapverblijf met eigen sanitaire voorzieningen


