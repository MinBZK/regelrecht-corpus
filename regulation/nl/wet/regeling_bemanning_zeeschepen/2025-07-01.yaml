      arbeid deel I, aan de hand waarvan de scheepsbeheerder een verklaring naleving maritieme arbeid deel II opstelt die
      in overeenstemming is met de [artikelen 4.6.3][ref1] en [4.6.8, vierde lid][ref2], en, voor zover van toepassing,
      [artikel 4.6.6, derde lid][ref3].


