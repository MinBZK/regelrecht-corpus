  - number: 3.9.8
    text: |-
      Een geldig certificaat dat op grond van hoofdstuk 10 van de SCV-code is afgegeven door een andere verdragspartij
      bij de SCV-code dat ten minste gelijkwaardig is met een certificaat als bedoeld in de [artikelen 3.9.2][ref1] en
      [3.9.4][ref2] wordt daaraan gelijkgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0051068#Artikel3
