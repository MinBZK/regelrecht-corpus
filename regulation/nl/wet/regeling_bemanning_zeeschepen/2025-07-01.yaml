        paragraaf: '4.1'
  - number: 4.1.5.2
    text: |-
      Tot de wezenlijk gelijkwaardige bepalingen, bedoeld in het eerste lid, behoort het vereiste dat een commercieel
      jacht de volgende voorzieningen biedt:
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.5
  - number: 4.1.5.2.a
    text: een dagverblijf dat per zeevarende ten minste 1,5 vierkante meter zitplaats biedt;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.5
  - number: 4.1.5.2.b
    text: |-
      een ruimte aan dek die toegankelijk is voor de zeevarenden die geen dienst hebben en per zeevarende ten minste
      1,5 vierkante meter zitplaats biedt; en
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.5
  - number: 4.1.5.2.c
    text: |-
      een aanvullende ruimte die per officier ten minste 1,5 vierkante meter zitplaats biedt en, voor zover deze ruimte
      is gesitueerd op de brug, alleen wordt gebruikt als het zeeschip niet varende is.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.5
  - number: 4.1.5.3
    text: |-
      Voor zover het vloeroppervlak van slaapverblijven voor officieren ingevolge het eerste lid minder dan 7,5 vierkante
      meter bedraagt, zijn in deze verblijven een tv en een dvd-speler of gelijkwaardige apparatuur beschikbaar.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.5
  - number: 4.1.6.1
    text: |-
      In afwijking van [artikel 4.1.4, eerste lid][ref1], kunnen, met het oog op de functionaliteit, de stabiliteit of
      anderszins de veiligheid van een zeeschip van minder dan 500 GT, als wezenlijk gelijkwaardige bepaling als bedoeld
      in artikel VI, derde lid, van het MLC-verdrag slaapverblijven onder de referentielastlijn worden geplaatst, mits
      tevens wordt voldaan aan het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel4
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.6
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.1.6.2
    text: 'Slaapverblijven als bedoeld in het eerste lid voldoen aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.6
  - number: 4.1.6.2.a
    text: de bovenzijde van de vloer ligt niet meer dan twee meter onder de referentielastlijn;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.6
  - number: 4.1.6.2.b
    text: |-
      voor de stahoogte wordt geen ontheffing als bedoeld in [artikel 4.1.3, eerste lid][ref1], verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel4
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.6
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.1.6.2.c
    text: |-
      in het slaapverblijf wordt continue klimaatbeheersing toegepast die adequaat condensvorming en vocht gerelateerde
      geuren bestrijdt;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.6
  - number: 4.1.6.2.d
    text: vanuit het slaapverblijf zijn ten minste twee adequate vluchtwegen aanwezig;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.6
  - number: 4.1.6.2.e
    text: in het waterdichte compartiment van het slaapverblijf is een bilge-alarm aanwezig;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.6
  - number: 4.1.6.2.f
    text: |-
      de lichtsterkte van de verlichting is variabel instelbaar om het gebrek aan daglicht naar behoefte van de
      zeevarende te kunnen compenseren; en
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.6
  - number: 4.1.6.2.g
    text: er worden materialen en kleuren voor wand- en vloerbedekking toegepast gericht op ruimtebeleving.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.6
  - number: 4.1.7.1
    text: |-
      Op een passagiersschip of een zeeschip voor bijzondere doeleinden is het overeenkomstig norm A3.1, zesde lid,
      onderdeel d, van het MLC-verdrag toegestaan slaapverblijven onder de referentielastlijn te plaatsen.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.7
  - number: 4.1.7.2
    text: |-
      In afwijking van norm A3.1, zesde lid, onderdeel d, van het MLC-verdrag kunnen als wezenlijk gelijkwaardige
      bepaling als bedoeld in artikel VI, derde lid, van het MLC-verdrag slaapverblijven onder werkgangen worden
      geplaatst, indien deze slaapverblijven zodanig zijn geïsoleerd dat wordt voldaan aan de normen voor geluidsisolatie
      tussen slaapverblijven en dagverblijven van de bij resolutie A.468(12) door de Algemene Vergadering van de
      Internationale Maritieme Organisatie aangenomen Code over geluidsniveaus op zeeschepen. Voor een zeeschip van meer
      dan 1.600 GT en indien het betreffende zeeschip is gebouwd op of na 1 juli 2014 is resolutie MSC.337 (91) van de
      Internationale Maritieme Organisatie over geluidsniveaus op zeeschepen van toepassing.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.7
  - number: 4.1.7.3
    text: 'Slaapverblijven als bedoeld in het eerste en tweede lid voldoen aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.7
  - number: 4.1.7.3.a
    text: |-
      in het slaapverblijf wordt continue klimaatbeheersing toegepast die adequaat condensvorming en vocht gerelateerde
      geuren bestrijdt; en
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.7
  - number: 4.1.7.3.b
    text: |-
      de lichtsterkte van de verlichting is variabel instelbaar om het gebrek aan daglicht naar behoefte van de
      zeevarende te kunnen compenseren.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.7
  - number: 4.1.8.1
    text: |-
      De minister kan ontheffing verlenen van norm A3.1, zesde lid, onderdeel c, van het MLC-verdrag voor het plaatsen
      van slaapverblijven voor midscheeps, indien de grootte, het type of de beoogde dienst van het zeeschip een andere
      ligging praktisch onmogelijk maakt.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.8
  - number: 4.1.8.2
    text: |-
      Voor een zeeschip voor bijzondere doeleinden kan de minister, na overleg met de betrokken organisaties van
      scheepsbeheerders en zeevarenden, ontheffing verlenen van norm A3.1, zesde lid, onderdeel d, van het MLC-verdrag
      voor het plaatsen van slaapverblijven zonder daglicht boven de lastlijn, indien de grootte, het type of de beoogde
      dienst van het zeeschip een andere ligging praktisch onmogelijk maakt en de lichtsterkte van de verlichting in
      de slaapverblijven variabel instelbaar is om het gebrek aan daglicht naar behoefte van de zeevarende te kunnen
      compenseren.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.8
  - number: 4.1.8.3
    text: |-
      In afwijking van [artikel 4.1.4, eerste lid][ref1], en in overeenstemming met norm A3.1, achtste lid, van het MLC-
      verdrag zijn op een passagiersschip slaapverblijven toegestaan waar geen daglicht kan toetreden indien:


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel4
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.8
    references:
