  - number: 4.1.1.1
    text: |-
      Tenzij in een voorschrift van deze paragraaf uitdrukkelijk is bepaald dat dat voorschrift wel van toepassing is op
      een in onderdeel a of c bedoeld zeeschip, is deze paragraaf niet van toepassing op:
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.1
  - number: 4.1.1.1.a
    text: |-
      een zeeschip waarvan de kiel is gelegd of de bouw in een overeenkomstige fase van ontwikkeling was voor 20 augustus
      2013, niet zijnde een vissersvaartuig;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.1
  - number: 4.1.1.1.b
    text: een vissersvaartuig; en
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.1
  - number: 4.1.1.1.c
    text: |-
      een zeeschip dat ontworpen is om traditionele vaardigheden en zeemanschap aan te moedigen en te bevorderen en dat
      als levend cultuurmonument volgens de traditionele beginselen van zeemanschap en techniek wordt bestuurd.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.1
  - number: 4.1.1.2
    text: |-
      De [artikelen 4.1.4 tot en met 4.1.8][ref1] zijn niet van toepassing op een zeeschip van minder dan 500 GT
      waarop de zeevarenden ten hoogste 13 uur per etmaal en ten hoogste 84 uur in elke periode van 7 dagen aan boord
      verblijven, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel4
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.1
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.1.1.2.a
    text: per zeevarende een zitplaats in een dagverblijf beschikbaar is; en
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.1
  - number: 4.1.1.2.b
    text: per 6 zeevarenden of minder een toiletruimte, een wastafel en een bad of douche beschikbaar is.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.1
  - number: 4.1.2.1
    text: |-
      De verblijven voldoen aan de in de onderstaande tabel opgenomen onderdelen van normen van het MLC-verdrag:






                    stahoogte


                    norm A3.1, zesde lid, onderdeel a, eerste volzin




                    isolatie


                    norm A3.1, zesde lid, onderdeel b




                    te gebruiken materialen


