        paragraaf: '4.1'
  - number: 4.1.4.2
    text: |-
      In aanvulling op norm A3.1, negende lid, onderdeel e, van het MLC-verdrag bedraagt de binnenwerks gemeten lengte
      van een slaapplaats ten minste 2.000 mm.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.4
  - number: 4.1.4.3
    text: Slaapverblijven zijn achter het aanvaringsschot gelegen.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.4
  - number: 4.1.4.4
    text: |-
      Slaapverblijven voldoen voorts aan de normering van de in de onderstaande tabel opgenomen leidraden dan wel
      onderdelen van leidraden van het MLC-verdrag:






                    elektrische leeslamp


                    leidraad B3.1.4, tweede lid




