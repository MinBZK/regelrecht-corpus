  - number: 4.1.8.8.a
    text: leidraad B3.1.5, tweede lid, van het MLC-verdrag dat slaapverblijven eigen sanitaire voorzieningen hebben;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.8
  - number: 4.1.8.8.b
    text: |-
      leidraad B3.1.5, derde lid, van het MLC-verdrag dat slaapverblijven zodanig zijn ingericht dat de wachten
      afgescheiden zijn en overdag werkende zeevarenden zijn gescheiden van ’s nachts werkende zeevarenden.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.8
