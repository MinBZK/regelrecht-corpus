        paragraaf: '4.2'
  - number: 4.6.3.1
    text: 'In de verklaring naleving maritieme arbeid deel II wordt vermeld:'
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.6.3
  - number: 4.6.3.1.a
    text: |-
      de maatregelen en procedures om te waarborgen dat voortdurend wordt voldaan aan de i eisen, bedoeld in
      [artikel 4.2.1, eerste lid, van het besluit][ref1], en de voorgestelde maatregelen om voortdurende verbetering van
      de naleving te waarborgen;


      [ref1]: https://wetten.overheid.nl/BWBR0050941#Artikel4
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.6.3
    references:
      - id: ref1
        bwb_id: BWBR0050941
        artikel: '4'
  - number: 4.6.3.1.b
    text: |-
      de maatregelen die worden getroffen indien blijkt dat niet wordt voldaan aan de i eisen, bedoeld in
      [artikel 4.2.1, eerste lid, van het besluit][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0050941#Artikel4
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.6.3
    references:
      - id: ref1
        bwb_id: BWBR0050941
        artikel: '4'
  - number: 4.6.3.1.c
    text: |-
      welke personen zijn aangewezen voor het toepassen van de in de onderdelen a en b bedoelde maatregelen en
      procedures.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.6.3
  - number: 4.6.3.2
    text: |-
      De verklaring naleving maritieme arbeid deel II wordt opgesteld in overeenstemming met de normering van leidraad
      B5.1.3, tweede tot en met vierde lid, van het MLC-verdrag.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.6.3
  - number: 4.6.4.1
    text: Een certificaat maritieme arbeid heeft een geldigheidsduur van ten hoogste vijf jaar.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.6.4
  - number: 4.6.4.2
    text: |-
      Tijdens de geldigheidsduur van het certificaat maritieme arbeid wordt het zeeschip onderworpen aan een tussentijdse
      inspectie die plaatsvindt tussen de tweede en derde verjaardatum van het certificaat.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.6.4
  - number: 4.6.4.3
    text: Van een goed verlopen tussentijdse inspectie wordt aantekening gemaakt op het certificaat.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.6.4
  - number: 4.6.4.4
    text: |-
      Het onderzoek ter verlenging van een certificaat maritieme arbeid vindt plaats voor de vijfde verjaardatum van
      het certificaat.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.6.4
  - number: 4.6.4.5
    text: |-
      Ter verkrijging van een certificaat maritieme arbeid bij een tussentijdse inspectie als bedoeld in het tweede lid
      en bij een verlengingsinspectie als bedoeld in het vierde lid:
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.6.4
  - number: 4.6.4.5.a
    text: |-
      wordt onderzocht of het zeeschip voldoet aan de eisen als bedoeld in [artikel 37, eerste lid, van de wet][ref1] en
      aan de voorschriften genoemd op de toepasselijke verklaring naleving maritieme arbeid deel I; en


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel37
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.6.4
    references:
      - id: ref1
        bwb_id: BWBR0050681
        artikel: '37'
  - number: 4.6.4.5.b
    text: |-
      wordt beoordeeld of de verklaring naleving maritieme arbeid deel II voldoet aan [artikel 4.6.3][ref1], en of op
      basis van de inhoud van die verklaring voldoende is gewaarborgd dat de in onderdeel a bedoelde eisen die op het
      desbetreffende zeeschip van toepassing zijn, voortdurend worden nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel4
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.6.4
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.6'
  - number: 4.6.4.6
    text: |-
      Indien het onderzoek ter verlenging wordt afgerond binnen drie maanden voor de vervaldatum van het bestaande
      certificaat, is het nieuwe certificaat maritieme arbeid geldig vanaf de datum waarop de verlengingsinspectie is
      afgerond voor een tijdvak dat ten hoogste loopt tot vijf jaar na de vervaldatum van het bestaande certificaat.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.6.4
  - number: 4.6.4.7
    text: |-
      Indien het onderzoek ter verlenging meer dan drie maanden voor de vervaldatum van het bestaande certificaat wordt
      afgerond, is het nieuwe certificaat maritieme arbeid geldig voor vijf jaar gerekend vanaf de datum waarop de
      verlengingsinspectie is afgerond.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.6.4
  - number: 4.6.5.1
    text: |-
      De uitkomsten van een inspectie als bedoeld in [artikel 4.6.4, tweede en vierde lid][ref1], worden door de
      betrokken ambtenaar of degene die namens een rechtspersoon de inspectie heeft uitgevoerd, opgenomen in een
      inspectierapport, waarbij alle eventuele zwaarwegende tekortkomingen uitdrukkelijk worden vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel4
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.6.5
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.6'
  - number: 4.6.5.2
    text: |-
      De datum waarop wordt vastgesteld dat een zwaarwegende tekortkoming is verholpen, wordt eveneens aangetekend op
      het inspectierapport.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.6.5
  - number: 4.6.5.3
    text: |-
      Een afschrift van het inspectierapport wordt in de werktaal van het zeeschip en in het Engels, indien de werktaal
      geen Engels is en het zeeschip internationale reizen maakt, verstrekt aan de kapitein.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.6.5
  - number: 4.6.5.4
    text: |-
      De kapitein verstrekt op verzoek een afschrift van het inspectierapport alsmede van het certificaat maritieme
      arbeid en de verklaring naleving maritieme arbeid in het Engels of in de werktaal van het zeeschip aan krachtens
      [artikel 39, eerste lid, van de wet][ref1] aangewezen ambtenaren, aan inspecteurs van een havenstaat of aan
      vertegenwoordigers van scheepsbeheerders of zeevarenden.


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel39
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.6.5
    references:
      - id: ref1
        bwb_id: BWBR0050681
        artikel: '39'
  - number: 4.6.5.5
    text: |-
      Een afschrift van het inspectierapport wordt aan boord van het zeeschip op een duidelijk zichtbare en voor de
      bemanning toegankelijke plaats beschikbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.6.5
  - number: 4.6.6.1
    text: 'Een voorlopig certificaat maritieme arbeid kan worden afgegeven met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.6.6
  - number: 4.6.6.1.a
    text: een nieuw zeeschip bij de oplevering;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.6.6
  - number: 4.6.6.1.b
    text: een zeeschip dat op grond van voor Nederland geldende rechtsregels onder de vlag van het Koninkrijk gaat varen;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.6.6
  - number: 4.6.6.1.c
    text: een zeeschip dat in het beheer komt van een andere scheepsbeheerder.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.6.6
  - number: 4.6.6.2
    text: Een voorlopig certificaat maritieme arbeid kan eenmalig worden afgegeven voor een tijdvak van ten hoogste 26 weken.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.6.6
  - number: 4.6.6.3
    text: |-
      In afwijking van [artikel 4.6.3, eerste lid, onderdelen a en b][ref1], worden de maatregelen en procedures in de
      verklaring naleving maritieme arbeid deel II zoveel als mogelijk vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel4
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.6.6
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.6'
  - number: 4.6.6.4
    text: |-
      De scheepsbeheerder toont aan dat de kapitein op de hoogte is van de eisen van het MLC-verdrag en zijn
      verantwoordelijkheden voor de uitvoering en de naleving van de voor het desbetreffende zeeschip geldende regels en
      procedures voor de naleving van het MLC-verdrag.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.6.6
  - number: 4.6.6.5
    text: |-
      Het zeeschip wordt met het oog op een voorlopig certificaat als bedoeld in het eerste lid onderworpen aan een
      onderzoek als bedoeld in [artikel 4.6.4, vijfde lid, onderdeel a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel4
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.6.6
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.6'
  - number: 4.6.7
    text: |-
      Onverminderd [artikel 4.2.2 van het besluit][ref1] vervalt een voor dat zeeschip afgegeven certificaat maritieme
      arbeid indien:


      [ref1]: https://wetten.overheid.nl/BWBR0050941#Artikel4
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.6.7
    references:
      - id: ref1
        bwb_id: BWBR0050941
        artikel: '4'
  - number: 4.6.7.a
    text: |-
      het zeeschip wordt onttrokken aan zijn oorspronkelijke bestemming, waardoor het niet meer als zeeschip wordt
      gebruikt;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.6.7
  - number: 4.6.7.b
    text: |-
      het zeeschip van bestemming wijzigt zonder dat een verbouwing of wijziging van de inrichting als bedoeld in
      [artikel 4.2.2, eerste lid, onderdeel a, van het besluit][ref1] plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0050941#Artikel4
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.6.7
    references:
      - id: ref1
        bwb_id: BWBR0050941
        artikel: '4'
  - number: 4.6.8.1
    text: |-
      Het model van het certificaat maritieme arbeid is opgenomen in [bijlage 16][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0051068
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.6.8
    references:
      - id: ref1
        bwb_id: BWBR0051068
  - number: 4.6.8.2
    text: |-
      Het model van het voorlopige certificaat maritieme arbeid is opgenomen in [bijlage 17][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0051068
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.6.8
    references:
      - id: ref1
        bwb_id: BWBR0051068
  - number: 4.6.8.3
    text: |-
      Het model van de verklaring naleving maritieme arbeid, deel I, is opgenomen in [bijlage 18][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0051068
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.6.8
    references:
      - id: ref1
        bwb_id: BWBR0051068
  - number: 4.6.8.4
    text: |-
      Het model van de verklaring naleving maritieme arbeid, deel II, is opgenomen in [bijlage 19][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0051068
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.6.8
    references:
      - id: ref1
        bwb_id: BWBR0051068
  - number: 4.6.8.5
    text: |-
      De documenten, bedoeld in het eerste tot en met vierde lid, zijn slechts geldig indien ze zijn opgesteld
      overeenkomstig de in de bijlagen bij deze regeling opgenomen modellen en naar waarheid zijn ingevuld.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.6.8
  - number: 4.6.9.1
    text: |-
      Een erkenning als bedoeld in [artikel 39, vierde lid, van de wet][ref1] kan worden verleend aan rechtspersonen die
      voldoen aan de volgende criteria:


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel39
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.6.9
    references:
      - id: ref1
        bwb_id: BWBR0050681
        artikel: '39'
  - number: 4.6.9.1.a
    text: |-
      de rechtspersoon beschikt over een gecertificeerd kwaliteitssysteem, waarin de procedures alsmede het beheer van
      alle documentatie met betrekking tot de onderzoeken waarvoor de aanwijzing geldt zijn geborgd;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.6.9
  - number: 4.6.9.1.b
    text: |-
      de rechtspersoon heeft de beschikking over een wereldwijd netwerk van voldoende en bekwaam personeel met voldoende
      en actuele kennis van het MLC-verdrag en de Nederlandse wettelijke vereisten voor de afgifte van een certificaat
      maritieme arbeid, alsmede diensttijd met betrekking tot het onderzoeken van zeeschepen; en
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.6.9
  - number: 4.6.9.1.c
    text: de rechtspersoon voert een onafhankelijke bedrijfsvoering en kan daarover verantwoording afleggen.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.6.9
  - number: 4.6.9.2
    text: |-
      Een rechtspersoon als bedoeld in het eerste lid houdt kantoor in Nederland en heeft met de minister een
      overeenkomst gesloten met betrekking tot de taken die zij in het kader van de aanwijzing uitvoert, waarin de in
      leidraad B5.1.2 van het MLC-verdrag genoemde onderwerpen zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.6.9
  - number: 4.6.9.3
    text: |-
      Rechtspersonen die zijn erkend op grond van [verordening (EG) nr. 391/2009](32009R0391) van het Europees Parlement
      en de Raad van 23 april 2009 inzake gemeenschappelijke voorschriften en normen voor met de inspectie en controle
      van schepen belaste organisaties (PbEU 2009, L 131), worden geacht te voldoen aan de erkenningscriteria, bedoeld in
      het eerste lid, onderdeel c, en het tweede lid.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.6.9
  - number: 4.6.9.4
    text: Een erkenning wordt verleend voor onbepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.6.9
  - number: 4.6.9.5
    text: |-
      Een erkenning kan worden ingetrokken indien de rechtspersoon waaraan de erkenning is verleend, niet meer voldoet
      aan een van de criteria, genoemd in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.6.9
  - number: 4.6.9.6
    text: Een besluit tot erkenning of intrekking van een erkenning wordt bekend gemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.6.9
  - number: 4.6.10.1
    text: |-
      Een rechtspersoon die is erkend overeenkomstig [artikel 4.6.9][ref1] en die is aangewezen op grond van
      [artikel 6, tweede lid, van de Schepenwet][ref2], kan de minister verzoeken om een aanwijzing als bedoeld in
      [artikel 39, eerste lid, van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0001876#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0050681#Artikel39
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.6.10
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.6'
      - id: ref2
        bwb_id: BWBR0001876
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0050681
        artikel: '39'
  - number: 4.6.10.2
    text: |-
      Een aanwijzing wordt ingetrokken indien de erkenning, bedoeld in [artikel 4.6.9][ref1], wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel4
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.6.10
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.6'
  - number: 4.6.10.3
    text: |-
      Een aanwijzing kan worden ingetrokken indien de aangewezen rechtspersoon handelt in strijd met een voorschrift dat
      is verbonden aan de aanwijzing of in strijd met de overeenkomst, bedoeld in [artikel 4.6.9][ref1], tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel4
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.6.10
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.6'
  - number: 4.6.10.4
    text: |-
      Een aanwijzing kan worden geschorst indien door een handeling of nalaten van de aangewezen rechtspersoon ernstig
      gevaar voor de veiligheid kan of is ontstaan.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.6.10
  - number: 4.7.1
    text: |-
      De minister geeft op aanvraag een visserij-arbeidscertificaat als bedoeld in
      [artikel 38, eerste lid, van de wet][ref1] af indien na onderzoek blijkt dat voor dat vissersvaartuig ten minste
      wordt voldaan aan:


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel38
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.7.1
    references:
      - id: ref1
        bwb_id: BWBR0050681
        artikel: '38'
  - number: 4.7.1.a
    text: |-
      de minimumleeftijd, gesteld bij of krachtens [artikel 3.2, eerste en tweede lid, van de Arbeidstijdenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel3
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.7.1
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: '3'
  - number: 4.7.1.b
    text: |-
      het geneeskundig onderzoek, bedoeld in [artikel 31 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel31
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.7.1
    references:
      - id: ref1
        bwb_id: BWBR0050681
        artikel: '31'
  - number: 4.7.1.c
    text: |-
      de bemanningssamenstelling, bedoeld in [artikel 20 van de wet][ref1], alsmede de rusttijden, gesteld bij of
      krachtens [paragraaf 5.2][ref2] en krachtens [artikel 5:12, tweede lid, van de Arbeidstijdenwet][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Paragraaf5.2
      [ref3]: https://wetten.overheid.nl/BWBR0007671#Artikel5
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.7.1
    references:
      - id: ref1
        bwb_id: BWBR0050681
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0007671
        paragraaf: '5.2'
      - id: ref3
        bwb_id: BWBR0007671
        artikel: '5'
  - number: 4.7.1.d
    text: |-
      de bemanningslijst, bedoeld in [artikel 21 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel21
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.7.1
    references:
      - id: ref1
        bwb_id: BWBR0050681
        artikel: '21'
  - number: 4.7.1.e
    text: |-
      de overeenkomst op grond waarvan een visser aan boord werkzaam is, bedoeld in
      [artikel 7, tweede lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel7
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.7.1
    references:
      - id: ref1
        bwb_id: BWBR0050681
        artikel: '7'
  - number: 4.7.1.f
    text: |-
      de repatriëring, bedoeld in [artikel 7, tweede lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel7
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.7.1
    references:
      - id: ref1
        bwb_id: BWBR0050681
        artikel: '7'
  - number: 4.7.1.g
    text: |-
      de betaling aan vissers, bedoeld in [7, tweede lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel7
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.7.1
    references:
      - id: ref1
        bwb_id: BWBR0050681
        artikel: '7'
  - number: 4.7.1.h
    text: |-
      het verblijf, voeding en drinkwater, bedoeld in [artikel 4, derde lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel4
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.7.1
    references:
      - id: ref1
        bwb_id: BWBR0050681
        artikel: '4'
  - number: 4.7.1.i
    text: |-
      de voorzieningen voor zieke zeevarenden aan boord en medische zorg, bedoeld in
      [artikel 7, tweede lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel7
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.7.1
    references:
      - id: ref1
        bwb_id: BWBR0050681
        artikel: '7'
  - number: 4.7.1.j
    text: |-
      de arbeidsomstandigheden en ongevallenpreventie aan boord, bedoeld in [artikel 7, tweede lid, van de wet][ref1];
      en


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel7
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.7.1
    references:
      - id: ref1
        bwb_id: BWBR0050681
        artikel: '7'
  - number: 4.7.1.k
    text: |-
      de bescherming tegen beroepsgerelateerde ziekte, ongeval of overlijden, bedoeld in
      [artikel 7, tweede lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel7
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.7.1
    references:
      - id: ref1
        bwb_id: BWBR0050681
        artikel: '7'
  - number: 4.7.2
    text: |-
      Het model voor het visserij-arbeidscertificaat voor vissersvaartuigen is opgenomen in [bijlage 20][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0051068
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.7.2
    references:
      - id: ref1
        bwb_id: BWBR0051068
  - number: 4.7.3
    text: Het visserij-arbeidscertificaat heeft een geldigheidsduur van ten hoogste vijf jaar.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.7.3
  - number: 4.7.4
    text: |-
      De [artikelen 4.6.3 tot en met 4.6.7][ref1] zijn van overeenkomstige toepassing op het visserij-arbeidscertificaat.


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel4
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.7.4
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.6'
  - number: 4.8.1
    text: |-
      Na het uitvoeren van een inspectie als bedoeld in [artikel 4.6.3, tweede, derde of vierde lid][ref1], worden door
      de betrokken ambtenaar of degene die namens een rechtspersoon de inspectie heeft uitgevoerd, de volgende gegevens
      in het register, bedoeld in [artikel 77 van de wet][ref2], geregistreerd:


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0050681#Artikel77
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.8
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.6'
      - id: ref2
        bwb_id: BWBR0050681
        artikel: '77'
  - number: 4.8.1.a
    text: naam van het zeeschip;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.8
  - number: 4.8.1.b
    text: IMO-nummer van het zeeschip;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.8
  - number: 4.8.1.c
    text: naam van de scheepsbeheerder van het zeeschip;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.8
  - number: 4.8.1.d
    text: |-
      naam van de op grond van [artikel 39, eerste lid, van de wet][ref1] aangewezen ambtenaar of degene die namens een
      rechtspersoon de inspectie heeft uitgevoerd;


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel39
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.8
    references:
      - id: ref1
        bwb_id: BWBR0050681
        artikel: '39'
  - number: 4.8.1.e
    text: datum en plaats van de inspectie;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.8
  - number: 4.8.1.f
    text: de resultaten van vraaggesprekken met zeevarenden aan boord;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.8
  - number: 4.8.1.h
    text: informatie betreffende eventuele inbreuken op de wetgeving, opgelegde sancties en aanhouding van het zeeschip; en
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.8
  - number: 4.8.1.i
    text: gerapporteerde arbeidsongevallen.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.8
  - number: 4.8.2
    text: |-
      Rechtspersonen die zijn aangewezen op grond van [artikel 39, eerste lid, van de wet][ref1], dragen er zorg voor
      dat de in het eerste lid bedoelde inspectiegegevens in het register worden geregistreerd op de door de minister bij
      die aanwijzing voorgeschreven wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel39
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.8
    references:
      - id: ref1
        bwb_id: BWBR0050681
        artikel: '39'
  - number: 4.8.3
    text: |-
      De minister brengt binnen zes maanden na afloop van een kalenderjaar een verslag uit van de in het desbetreffende
      jaar uitgevoerde inspecties.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.8
  - number: 4.9.1
    text: |-
      In deze paragraaf wordt verstaan onder ‘klager’: zeevarende die op grond van de [artikelen 6][ref1] of
      [40, eerste lid, van de wet][ref2], een klacht indient.


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0050681#Artikel40
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.9.1
    references:
      - id: ref1
        bwb_id: BWBR0050681
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0050681
        artikel: '40'
  - number: 4.9.2.1
    text: |-
      In een klachtenprocedure als bedoeld in [artikel 6 van de wet][ref1] wordt ten minste opgenomen:


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel6
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.9.2
    references:
      - id: ref1
        bwb_id: BWBR0050681
        artikel: '6'
  - number: 4.9.2.1.a
    text: |-
      bij welke persoon of personen aan boord een klacht kan worden ingediend, waarbij klachten in ieder geval bij de
      kapitein kunnen worden ingediend;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.9.2
  - number: 4.9.2.1.b
    text: |-
      bij welke vertegenwoordiger van de scheepsbeheerder die niet tot de zeevarenden aan boord behoort, een klacht kan
      worden ingediend;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.9.2
  - number: 4.9.2.1.c
    text: |-
      de gegevens als bedoeld in [artikel 4.9.3, derde lid][ref1], waar een klacht kan worden ingediend;


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel4
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.9.2
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.9'
  - number: 4.9.2.1.d
    text: |-
      de naam van één of meer vertrouwenspersonen aan boord die zeevarenden onpartijdig kunnen adviseren over het
      indienen van een klacht en klagers kunnen bijstaan bij het doorlopen van de klachtenprocedure en kan helpen bij het
      voorkomen van nadelige behandeling vanwege het feit dat diegene een klacht heeft ingediend; en
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.9.2
  - number: 4.9.2.1.e
    text: |-
      volgens welke procedure een klacht wordt behandeld waarbij leidraad B5.1.5, tweede lid, van het MLC-verdrag in acht
      wordt genomen.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.9.2
  - number: 4.9.2.2
    text: 'De klachtenprocedure, bedoeld in het eerste lid, stelt geen beperkingen aan het recht van de klager:'
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.9.2
  - number: 4.9.2.2.a
    text: zich door iemand te laten vergezellen of vertegenwoordigen;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.9.2
  - number: 4.9.2.2.b
    text: |-
      om te allen tijde zijn klacht rechtstreeks bij de kapitein of de vertegenwoordiger van de scheepsbeheerder, bedoeld
      in het eerste lid, onderdeel b, in te dienen;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.9.2
  - number: 4.9.2.2.c
    text: om klachten in te dienen betreffende een vermoedelijke schending van het MLC-verdrag of het C188-verdrag.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.9.2
  - number: 4.9.3.1
    text: |-
      Een klacht als bedoeld in [artikel 40, eerste lid, van de wet][ref1] wordt ingediend bij de voor de
      klachtenbehandeling door de Inspecteur-Generaal van de Inspectie Leefomgeving en Transport aangewezen ambtenaren
      van die inspectie. De Inspecteur-Generaal draagt zorg voor een vertrouwelijke behandeling van de klacht.


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel40
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.9.3
    references:
      - id: ref1
        bwb_id: BWBR0050681
        artikel: '40'
  - number: 4.9.3.2
    text: |-
      Indien een erkende rechtspersoon als bedoeld in [artikel 4.6.9][ref1] een melding ontvangt van een klacht, zorgt
      deze erkende rechtspersoon ervoor dat de klacht wordt ingediend bij de in het eerste lid bedoelde ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel4
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.9.3
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.6'
  - number: 4.9.3.3
    text: 'Schriftelijk ingediende klachten worden gericht aan de Inspectie Leefomgeving en Transport, te bereiken via:'
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.9.3
  - number: 4.9.3.3.a
    text: 'het postadres: Postbus 16191, IPC 525, 2500 BD Den Haag, Nederland; of'
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.9.3
  - number: 4.9.3.3.b
    text: de website [http://www.ILenT.nl](http://www.ILenT.nl).
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.9.3
  - number: 4.9.3.4
    text: 'Een klacht is ontvankelijk indien:'
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.9.3
  - number: 4.9.3.4.a
    text: |-
      deze een vermoedelijke schending van het MLC-verdrag, het Verdrag betreffende werk in de visserijsector of een
      vermeend onrechtmatig bevel van de kapitein betreft;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.9.3
  - number: 4.9.3.4.b
    text: het voorval waarop de klacht betrekking heeft minder dan zes maanden geleden heeft plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.9.3
  - number: 4.9.3.4.c
    text: de klacht in het Engels of het Nederlands is gesteld; en
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.9.3
  - number: 4.9.3.4.d
    text: de klacht voldoende gedetailleerde informatie bevat om onderzoek naar de klacht te kunnen doen.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.9.3
  - number: 4.9.3.5
    text: Aan de klager wordt zo spoedig mogelijk na het indienen van de klacht medegedeeld of de klacht ontvankelijk is.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.9.3
  - number: 4.9.3.6
    text: 'Indien de klacht ontvankelijk is:'
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.9.3
  - number: 4.9.3.6.a
    text: |-
      wordt nagegaan of het een individuele klacht of een algemene klacht betreft en wordt nagegaan waarop de klacht
      betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.9.3
  - number: 4.9.3.6.b
    text: |-
      wordt de klager gevraagd of hij zijn klacht wil handhaven indien zijn anonimiteit, gelet op de aard van de klacht,
      niet gewaarborgd kan worden;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.9.3
  - number: 4.9.3.6.c
    text: |-
      wordt nagegaan of de klachtenprocedure, bedoeld in [artikel 6, eerste lid, van de wet][ref1], is doorlopen
      en indien dat niet het geval is, wordt de klacht niet verder behandeld, tenzij blijkt dat de klager die
      klachtenprocedure niet heeft gebruikt uit angst voor de gevolgen daarvan of wegens een andere goede reden als
      bedoeld in leidraad B5.2.2, vierde lid, van het MLC-verdrag;


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel6
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.9.3
    references:
      - id: ref1
        bwb_id: BWBR0050681
        artikel: '6'
  - number: 4.9.3.6.d
    text: |-
      wordt nagegaan waarom het doorlopen van de klachtenprocedure, bedoeld in
      [artikel 6, eerste lid, van de wet][ref1], niet heeft geleid tot een oplossing van de klacht;


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel6
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.9.3
    references:
      - id: ref1
        bwb_id: BWBR0050681
        artikel: '6'
  - number: 4.9.3.6.e
    text: |-
      worden, indien de aard van de klacht en noodzakelijke waarborgen voor de klager dit toelaten, de kapitein, de
      scheepsbeheerder en eventueel andere bij de klacht betrokken personen in de gelegenheid gesteld hun standpunt
      kenbaar te maken;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.9.3
  - number: 4.9.3.6.f
    text: wordt nagegaan of de klacht aan boord eenvoudig kan worden opgelost;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.9.3
  - number: 4.9.3.6.g
    text: |-
      wordt een klacht zo nodig onderzocht door het uitoefenen van toezicht als bedoeld in
      [hoofdstuk 6 van de wet][ref1] of in het kader van een inspectie als bedoeld in [artikel 4.6.3][ref2] waarbij niet
      wordt gemeld dat de inspectie het gevolg is van een klacht; en


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0051068#Artikel4
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.9.3
    references:
      - id: ref1
        bwb_id: BWBR0050681
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0051068
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.6'
  - number: 4.9.3.6.h
    text: |-
      worden de conclusie en eventuele maatregelen op basis van het onderzoek naar de klacht medegedeeld aan de klager
      of aan een door de klager opgegeven contactpersoon of belangenorganisatie, op een wijze die de gewenste anonimiteit
      van de klager in acht neemt.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.9.3
  - number: '5.1'
    text: |-
      De voorzitter, de plaatsvervangende voorzitters, de leden, de plaatsvervangende leden, de secretaris en
      de plaatsvervangende secretarissen van het tuchtcollege voor de scheepvaart leggen voor de aanvang van hun
      werkzaamheden ten overstaan van de president van het College van Beroep voor het bedrijfsleven de eed of belofte
      af overeenkomstig het volgende formulier: ‘Ik zweer/verklaar dat ik middellijk noch onmiddellijk, onder welke
      naam of voorwendsel ook, voor het verkrijgen van mijn benoeming tot voorzitter/plaatsvervangend voorzitter/ lid/
      plaatsvervangend lid/secretaris/plaatsvervangend secretaris van het tuchtcollege voor de scheepvaart aan iemand
      iets heb gegeven of beloofd, noch zal geven of beloven; ik zweer/verklaar dat ik nimmer enige giften of geschenken
      hoegenaamd zal aannemen of ontvangen van enig persoon van wie ik weet of vermoed dat hij een zaak heeft of zal
      krijgen bij het tuchtcollege voor de scheepvaart; ik zweer/beloof dat ik mij niet op enige wijze zal inlaten
      met partijen of hun raadslieden of gemachtigden over enige zaak die bij het tuchtcollege voor de scheepvaart
      aanhangig is, of waarvan ik weet of kan vermoeden dat deze bij het tuchtcollege voor de scheepvaart aanhangig zal
      worden gemaakt; ik zweer/beloof dat ik geheim zal houden de gegevens waarover ik bij de uitoefening van mijn taak
      de beschikking krijg en waarvan ik het vertrouwelijk karakter ken of redelijkerwijs moet vermoeden, behoudens
      voor zover enig wettelijk voorschrift mij tot mededeling verplicht of uit mijn taak de noodzaak tot mededeling
      voortvloeit, alsmede al hetgeen in de raadkamer over aanhangige zaken is geuit; ik zweer/beloof dat ik mijn taak
      in het tuchtcollege voor de scheepvaart met eerlijkheid, nauwgezetheid en onpartijdigheid, zonder aanzien van
      personen, zal uitoefenen en dat ik niets zal doen dat het aanzien van het tuchtcollege voor de scheepvaart kan
      schaden. Zo waarlijk helpe mij God Almachtig! / Dat verklaar en beloof ik!’ Op .......... heeft .......... (1) ten
      overstaan van de president van het College van Beroep voor het bedrijfsleven (2) te .......... de bovenstaande eed/
      belofte afgelegd. (1) .......... (2) ..........
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel5.1
  - number: 5.2.1
    text: |-
      De leden, de plaatsvervangende leden en de plaatsvervangende secretarissen ontvangen voor het bijwonen van een
      zitting van het tuchtcollege voor de scheepvaart een vacatiegeld van € 342.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel5.2
  - number: 5.2.2
    text: |-
      De voorzitter of de plaatsvervangende voorzitters ontvangen voor het voorbereiden van een zitting, het leiden
      van een zitting en het voorbereiden van een uitspraak na afloop van een zitting van het tuchtcollege voor de
      scheepvaart een vacatiegeld van € 684 per zaak.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel5.2
  - number: 5.2.3
    text: |-
      De plaatsvervangende secretaris ontvangt voor het uitschrijven van een concept van een uitspraak een vacatiegeld
      van € 342 per zaak.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel5.2
  - number: 5.2.4
    text: |-
      De voorzitter of de plaatsvervangende voorzitter ontvangt voor het nemen van een beslissing als bedoeld in
      [artikel 49, eerste lid, van de wet][ref1], en voor het beproeven van een minnelijke schikking als bedoeld in
      [artikel 49, vierde lid, van de wet][ref2], een vacatiegeld van € 228.


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0050681#Artikel49
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0050681
        artikel: '49'
      - id: ref2
        bwb_id: BWBR0050681
        artikel: '49'
  - number: 5.2.5
    text: |-
      De voorzitter, plaatsvervangend voorzitter en de plaatsvervangende secretaris ontvangt voor werkzaamheden die
      verband houden met het algemene functioneren van het tuchtcollege een vacatiegeld van € 684 per dag.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel5.2
  - number: 5.2.6
    text: |-
      De plaatsvervangende secretaris ontvangt voor werkzaamheden die verband houden met het algemene functioneren van
      het tuchtcollege een vacatiegeld van € 342 per dag.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel5.2
  - number: 6.1.1
    text: |-
      Een certificaat uitvoering beveiligingstaken, afgegeven op grond van sectie A-VI/6, negende lid, van de STCW-code,
      wordt gelijkgesteld met een bekwaamheidsbewijs uitvoering beveiligingstaken, afgegeven op grond van artikel 3.5.9.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel6.1
  - number: 6.1.2
    text: |-
      Een certificaten bewustwording scheepsbeveiliging, afgegeven op grond van sectie A-VI/6, vijfde lid, van de
      STCW-code, wordt gelijkgesteld met een bekwaamheidsbewijs uitvoering beveiligingstaken, afgegeven op grond van
      [artikel 3.5.10][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel3
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 6.2.1
    text: |-
      Een op grond van [artikel 1 van de Erkenningsregeling trainingen zeevaartbemanning][ref1], zoals dat luidde voor
      de dag van inwerkingtreding van deze regeling, afgegeven erkenning behoudt zijn geldigheid gedurende de op de
      erkenning aangegeven einddatum.


      [ref1]: https://wetten.overheid.nl/BWBR0013363#Artikel1
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0013363
        artikel: '1'
  - number: 6.2.2
    text: |-
      [Artikel 3.7.1, onderdeel a][ref1], is tot 1 januari 2027 niet van toepassing op
      een trainingsinstituut dat één of meer erkende trainingen verzorgt op grond van
      [artikel 1 van de ingetrokken Erkenningsregeling trainingen zeevaartbemanning][ref2], met dien verstande dat
      de aanvraag om de erkenning van het trainingsinstituut, bedoeld in artikel 3.7.1, onderdeel a, niet later dan
      1 januari 2026 is ingediend bij de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013363#Artikel1
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.7'
      - id: ref2
        bwb_id: BWBR0013363
        artikel: '1'
  - number: 6.3.1
    text: |-
      Op een zeeschip als bedoeld in [artikel 4.2.18, eerste lid][ref1], blijven de
      [artikelen 46 tot en met 67 van het ingetrokken Schepelingenbesluit][ref2] van toepassing, zoals deze luidden voor
      de inwerkingtreding van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0001985#Artikel46
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0001985
        artikel: '46'
  - number: 6.3.2
    text: |-
      Op een bestaand vissersvaartuig als bedoeld in [artikel 4.5.18, eerste lid][ref1], zijn de
      [artikelen 68 tot en met 84 van het ingetrokken Schepelingenbesluit][ref2], zoals deze luidden voor 12 mei 1977
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0001985#Artikel68
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.5'
      - id: ref2
        bwb_id: BWBR0001985
        artikel: '68'
  - number: '6.4'
    text: |-
      De volgende regelingen worden ingetrokken: - [Erkenningsregeling trainingen zeevaartbemanning][ref1];
