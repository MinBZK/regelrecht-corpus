                    325
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.2
  - number: 4.1.3.1
    text: |-
      De minister kan, na overleg met de betrokken organisaties van scheepsbeheerders en zeevarenden, ontheffing verlenen
      van norm A3.1, zesde lid, onderdeel a, eerste volzin, van het MLC-verdrag indien de verminderde hoogte van de
      desbetreffende verblijven redelijk is, en niet tot ongemak voor de zeevarenden leidt.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.3
  - number: 4.1.3.2
    text: Er wordt geen ontheffing verleend voor een hoogte van de verblijven van minder dan 1.930 mm.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.3
  - number: 4.1.3.3
    text: |-
      Voor een zeeschip van minder dan 200 GT kan de minister, na overleg met de betrokken organisaties van
      scheepsbeheerders en zeevarenden en met inachtneming van de grootte van het zeeschip en het aantal opvarenden
      aan boord, ontheffing verlenen van norm A3.1, zevende lid, onderdeel b, van het MLC-verdrag ten aanzien van
      airconditioning.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.3
  - number: 4.1.4.1
    text: |-
