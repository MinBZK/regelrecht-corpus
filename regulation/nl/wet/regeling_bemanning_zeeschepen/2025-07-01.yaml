articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder: - *besluit:* [Besluit bemanning zeeschepen][ref1];
        - *bestaand vissersvaartuig:* vissersvaartuig waarvan de kiel is gelegd voor 12 mei 1977;
        - *Caribische handelszone:* Caribische handelszone (Caribbean Trading Area) als bedoeld in hoofdstuk 1, artikel 3,
      onderdeel 6, van de SCV-code;
        - *commercieel jacht:* zeeschip van minder dan 3.000 GT met een loodlijnlengte van 24 meter of meer, dat is
      ontworpen en gebouwd en uitsluitend wordt gebruikt voor het bedrijfsmatig vervoer van 12 of minder passagiers en
      waarop de LY2-code dan wel de LY3-code, bedoeld in [artikel 1 van de Regeling veiligheid zeeschepen][ref2] kan
      worden toegepast;
        - *crebo:* centraal register beroepsopleidingen;
        - *croho:* centraal register opleidingen hoger onderwijs;
        - *diensttijd zeilschepen minder dan 500 GT:* diensttijd in een bepaalde functie aan boord van in de vaart zijnde
      zeilschepen van minder dan 500 GT, uitgedrukt in seizoenen;
        - *ETO:* elektrotechnisch officier;
        - *garnalenkotter:* vissersvaartuig van 125 GT of minder, met een lengte van minder dan
      24 meter met een hoofdvoortstuwingsinstallatie van minder dan 750 kW, gebruikt voor de vangst
      van garnalen waarvoor een bemanningscertificaat is afgegeven voor reizen die zich niet verder
      uitstrekken dan beperkte wateren vissersvaartuigen en waarvoor een vergunning als bedoeld in
      [artikel 36, eerste lid, van de Uitvoeringsregeling visserij][ref3] voor het vangen van garnalen is afgegeven;
        - *keuring:* medisch onderzoek als bedoeld in [artikel 3.6.2, eerste lid, van het besluit][ref4];
        - *keurling:* natuurlijke persoon die zich aan een keuring onderwerpt;
        - *minister:* Minister van Infrastructuur en Waterstaat;
        - *marof-N:* maritiem officier als bedoeld in [artikel 1 van het besluit][ref5], die gespecialiseerd is in het
      nautische vakgebied;
        - *marof-T:* maritiem officier als bedoeld in [artikel 1.1 van het besluit][ref6], die gespecialiseerd is in het
      technische vakgebied;
        - *onderofficier:* gezel die dienst doet in een toezichthoudende functie of in een functie met bijzondere
      verantwoordelijkheid en die door de zeewerkgever als zodanig wordt beschouwd;
        - *passagiers:* alle personen aan boord, met uitzondering van: 1°. de kapitein en de zeevarenden; 2°. andere
      personen, die in welke hoedanigheid ook, aan boord ten behoeve van het schip in dienst of tewerkgesteld zijn; 3°.
      kinderen, die op de dag van inscheping de leeftijd van een jaar nog niet hebben bereikt;
        - *referentielastlijn:* a. voor een zeeschip waarop het Uitwateringsverdrag van toepassing is, de lijn voor
      zomeruitwatering als bedoeld in bijlage 1, voorschrift 6, tweede lid, onderdeel a, van het Uitwateringsverdrag; of
      b. voor een zeeschip waarop het Uitwateringsverdrag niet van toepassing is, de lijn parallel aan de ontwerplastlijn
      gelegen op een afstand van 20 procent van de holte naar de mal als bedoeld in bijlage 1, voorschrift 3, vijfde
      lid, van het Uitwateringsverdrag, maar niet meer dan 1 meter onder het vrijboorddek als bedoeld in bijlage 1,
      voorschrift 3, negende lid, van het Uitwateringsverdrag;
        - *schelpdiervaartuig:* vissersvaartuig met een lengte van minder dan 45 meter met een
      hoofdvoortstuwingsinstallatie van minder dan 1.125 kW, gebruikt voor de vangst van schelpdieren waarvoor
      een bemanningscertificaat is afgegeven voor reizen die zich niet verder uitstrekken dan beperkte wateren
      vissersvaartuigen;
        - *seizoen:* periode van 180 kalenderdagen, al dan niet aaneengesloten;
        - *SCV-code:* in februari 2001 onder auspiciën van de IMO opgestelde en bij circulaire SLS.14/Circ.396, als
      voor het Koninkrijk der Nederlanden geldende equivalente regeling, aangemelde Code voor de veiligheid van
      kleine commerciële zeeschepen waarmee reizen worden ondernomen in het Caribisch gebied (Code of Safety for Small
      Commercial Vessels);
        - *sleepboot:* zeeschip, in hoofdzaak bestemd voor het slepen of bergen van vaartuigen, en waarmee in de regel geen
      andere personen of goederen worden vervoerd dan die welke tot de eigen bemanning en uitrusting of tot die van het
      gesleept wordende, te slepen of te bergen object behoren, dan wel bij het bergingswerk nodig zijn;
        - *Uitwateringsverdrag:* op 5 april 1966 te Londen tot stand gekomen Internationaal Verdrag betreffende de
      uitwatering van zeeschepen (Trb. 1966, 275) en de bij dat verdrag behorende bindende protocollen, aanhangsels en
      bijlagen;
        - *vaargebied zeilvaart I:* gebied dat zich uitstrekt van de monding van de Eems over de Duitse Wadden, begrensd
      door de laagwaterlijn op het Noordzeestrand van de Duitse Waddeneilanden tot de oostpunt van Spiekeroog, en
      vervolgens van de lijn van de oostpunt van Spiekeroog – Harleboei – vuurschip Weser – vuurschip Elbe I en de
      Elbemonding tot Brunsbüttel, begrensd door de rode boeienlijn, tevens omvattend het Noord-Oostzeekanaal, het
      Kielerfjord, de westelijke Oostzee, Belten en Sont, begrensd door de lijn Grenaa – Kullen in het Noorden en in het
      Oosten door de lijn Falster Bo – Cap Arkona, inclusief het bodden- en haffengebied ten zuiden van Rügen;
        - *vaargebied zeilvaart II:* gebied kustwater van 25 mijl uit de kust te beginnen dwars van Nieuwpoort tot de
      monding van de Elbe (Elbe I) en de Eider (Toenning), tevens omvattend het Noord-Oostzeekanaal en de westelijke
      Oostzee, Belten en Sont en het Kattegat in het Noorden begrensd door de lijn Skagen – Göteborg en in het Oosten
      door de lijn Simrishamn – oostkust Bornholm -Stettin, met dien verstande dat Bornholm in het Oosten op maximaal
      25 mijl gepasseerd mag worden;
        - *vaargebied zeilvaart III:* gehele Oostzee, de Noordzee, in het Noorden begrensd door de lijn van 63° 30’
      Noorderbreedte (tot niet meer dan 25 mijl uit de Noorse kust) – 61° Noorderbreedte, 1° Westerlengte – Strathie
      Head verbonden met de lijn van Barony Point – Mull – oostkust Colonsay -Islay (Ardmore Point) – Inishowen Head
      (Noord-Ierland) en vervolgens in het Zuidwesten van Old Head of Kinsale (Zuid-Ierland nabij Cork Harbour) naar
      48° Noorderbreedte, 6° Westerlengte (ca. 25 mijl west van Pointe du Raz) tot de zuidoever van de Gironde (45°
      Noorderbreedte, 2° 35’ Westerlengte); tot vaargebied III behoort tevens de gehele Middellandse Zee vanaf de Straat
      van Gibraltar;
        - *vaargebied zeilvaart IIIA:* zuidelijke Noordzee, in het noorden begrensd door de parallel van 53° Noorderbreedte
      en in het zuiden begrensd door de lijn Calais-Dover, alsmede de wateren tot 30 mijl uit de Europese kusten binnen
      het vaargebied zeilvaart III;
        - *vaargebied zeilvaart IV:* onbeperkt vaargebied;
        - *verblijf:* dag- of slaapverblijf en alle ruimten voor sanitaire doeleinden, voedselvoorziening, ziekenverpleging
      en recreatie aan boord van een zeeschip, bestemd voor gebruik door zeevarenden;
        - *zeeschip voor bijzondere doeleinden:* zeeschip waarop de SPS-code of de SPS-code 2008 van toepassing is.


