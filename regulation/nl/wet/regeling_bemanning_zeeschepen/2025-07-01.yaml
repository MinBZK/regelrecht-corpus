  - number: 3.9.7
    text: |-
      Het model van de verklaring medische geschiktheid lokaal varende Caribisch-Nederlandse schepen, bedoeld in
      [artikel 3.9.4, tweede lid, onderdeel c][ref1], is opgenomen in [bijlage 15][ref2].


