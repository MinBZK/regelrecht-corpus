        bwb_id: BWBR0051068
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.1.8.3.a
    text: |-
      de lichtsterkte van de verlichting variabel instelbaar is om het gebrek aan daglicht naar behoefte van de
      zeevarende te kunnen compenseren; en
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.8
  - number: 4.1.8.3.b
    text: materialen en kleuren voor wand- en vloerbedekking worden toegepast die zijn gericht op ruimtebeleving.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.8
  - number: 4.1.8.4
    text: |-
      Voor een zeeschip van minder dan 3.000 GT, niet zijnde een passagiersschip of een zeeschip voor bijzondere
      doeleinden, kan de minister, na overleg met de betrokken organisaties vanscheepsbeheerders en zeevarenden,
      ontheffing verlenen van norm A3.1, negende lid, onderdeel a, van het MLC-verdrag dat voor elke zeevarende een
      individueel slaapverblijf beschikbaar moet zijn.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.8
  - number: 4.1.8.5
    text: |-
      Voor een zeeschip van minder dan 3.000 GT, een passagiersschip of voor een zeeschip voor bijzondere doeleinden kan
      de minister in overeenstemming met norm A3.1, negende lid, onderdeel g, van het MLC-verdrag ontheffing verlenen
      van norm A3.1, negende lid, onderdeel f, van het MLC-verdrag met betrekking tot het minimale vloeroppervlak van
      individuele slaapverblijven, indien daarmee kan worden voorzien in individuele slaapverblijven. Deze individuele
      slaapverblijven zijn nooit kleiner dan 3,75 vierkante meter.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.8
  - number: 4.1.8.6
    text: |-
      Voor een zeeschip van minder dan 3.000 GT kan de minister, na overleg met de betrokken organisaties van
      scheepsbeheerders en zeevarenden, ontheffing verlenen van norm A3.1, negende lid, onderdeel m, van het MLC-verdrag
      met betrekking tot aan slaapverblijven grenzende individuele verblijven.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.8
  - number: 4.1.8.7
    text: |-
      Voor een zeeschip van minder dan 200 GT kan de minister, na overleg met de betrokken organisaties van
      scheepsbeheerders en zeevarenden en met inachtneming van de grootte van het zeeschip en het aantal opvarenden
      aan boord, ontheffing verlenen van norm A.3.1, negende lid, onderdelen f en h tot en met l, van het MLC-verdrag
      met betrekking tot het minimale vloeroppervlak, met dien verstande dat de vloeroppervlakte van individuele
      slaapverblijven ten minste 3 vierkante meter is, de vloeroppervlakte van slaapverblijven voor meer dan één persoon
      ten minste 2 vierkante meter per persoon is, en de vloeroppervlakte van slaapverblijven voor officieren ten minste
      4 vierkante meter.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.8
  - number: 4.1.8.8
    text: 'De minister kan ontheffing verlenen van de normering van:'
