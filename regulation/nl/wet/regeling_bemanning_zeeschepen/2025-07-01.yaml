  - number: 4.1.11.2
    text: |-
      Sanitaire voorzieningen voldoen voorts aan de normering van de in de onderstaande tabel genoemde onderdelen van
      leidraden van het MLC-verdrag:






                    wastafels en baden


                    leidraad B3.1.7, eerste lid




                    toiletten


                    leidraad B3.1.7, tweede lid




                    inrichting van sanitaire ruimten bestemd voor meer dan één persoon


                    leidraad B3.1.7, derde lid
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.11
  - number: 4.1.12.1
    text: |-
      Voor een zeeschip van minder dan 3.000 GT kan de minister, na overleg met de betrokken organisaties van
      scheepsbeheerders en zeevarenden, ontheffing verlenen van norm A3.1, elfde lid, onderdeel b, van het MLC-
      verdrag ten aanzien van de toegankelijkheid van sanitaire ruimten vanaf de navigatiebrug, de machinekamer of het
      controlecentrum van de machinekamer.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.12
  - number: 4.1.12.2
    text: |-
      Voor een passagiersschip dat doorgaans geen reizen maakt van langer dan vier uur kan, in afwijking van
      [artikel 4.1.11, eerste lid][ref1], en in overeenstemming met norm A3.1, elfde lid, onderdeel e, van het MLC-
      verdrag, het aantal sanitaire voorzieningen worden beperkt tot een toilet, een wasbak en een badkuip of douche per
      tien zeevarenden indien aan de wal aanvullende sanitaire voorzieningen aanwezig zijn en de sanitaire voorzieningen
      aan de wal en aan boord tezamen voldoen aan norm A3.1, elfde lid, onderdeel c, van het MLC-verdrag.


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel4
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.12
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.1.12.3
    text: |-
      Op zeeschip van minder dan 200 GT is norm A3.1, elfde lid, onderdeel d, van het MLC-verdrag ten aanzien van
      wastafels in slaapverblijven, niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.12
  - number: 4.1.13.1
    text: |-
      Op een zeeschip met een bemanning van 15 of meer zeevarenden aan boord dat reizen van meer dan drie dagen maakt, is
      een afzonderlijk ziekenverblijf aanwezig dat voldoet aan norm A3.1, twaalfde lid, van het MLC-verdrag.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.13
  - number: 4.1.13.2
    text: |-
      Een ziekenverblijf voldoet aan de normering die is genoemde in leidraad B3.1.8, eerste, tweede en vierde lid, van
      het MLC-verdrag ten aanzien van ontwerp en inrichting, met dien verstande dat sanitaire voorzieningen die deel
      uitmaken van het ziekenverblijf en uitsluitend vanuit dat verblijf toegankelijk zijn met een deur kunnen worden
      afgesloten.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.13
  - number: 4.1.13.3
    text: 'Het aantal bedden in een ziekenverblijf bedraagt:'
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.13
  - number: 4.1.13.3.a
    text: |-
      op een zeeschip waar het aantal zeevarenden dat verblijft in slaapverblijven voor meer dan één persoon, minder is
      dan 30: één bed;
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.13
  - number: 4.1.13.3.b
    text: |-
      op een zeeschip waar het aantal zeevarenden dat verblijft in slaapverblijven voor meer dan één persoon, 30 of meer
      is: twee bedden die niet boven elkaar gelegen zijn.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.13
  - number: 4.1.13.4
    text: |-
      Op een passagiersschip is bij voorkeur een apart ziekenverblijf voor passagiers aanwezig. Indien er geen apart
      ziekenverblijf voor passagiers is, worden de passagiers voor de toepassing van het derde lid meegeteld als
      zeevarenden.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.13
  - number: 4.1.13.5
    text: |-
      Op een zeeschip dat een internationale reis van meer dan drie dagen maakt met een bemanning en overig personeel
      van honderd personen of meer die, in welke hoedanigheid ook, aan boord ten behoeve van het zeeschip in dienst of
      tewerkgesteld zijn, inclusief stagiairs en leerlingen alsmede personen die werkzaam zijn als loods, is een verblijf
      ingericht als apotheek en verbandkamer dat grenst aan het ziekenverblijf en dat kan worden afgesloten.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.13
  - number: 4.1.13.6
    text: |-
      Op een zeeschip waar, gelet op het eerste lid, geen ziekenverblijf aanwezig is, is een eenpersoons slaapverblijf
      beschikbaar dat als ziekenkooi kan worden ingericht. Op een zeeschip met minder dan zes zeevarenden, kan worden
      volstaan met een als ziekenkooi ingerichte slaapplaats in een slaapverblijf. Dit slaapverblijf is gemakkelijk
      toegankelijk.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.13
  - number: 4.1.13.7
    text: Ziekenverblijven worden uitsluitend gebruikt voor medische doeleinden.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.13
  - number: 4.1.14.1
    text: |-
      Aan boord zijn in overeenstemming met norm A3.1, zeventiende lid, van het MLC-verdrag recreatieve voorzieningen die
      voldoen aan de normering van de in de onderstaande tabel opgenomen onderdelen van leidraden van het MLC-verdrag:






                    boekenkast en meubilair voor lezen, schrijven en gezelschapsspellen


                    leidraad B3.1.11, tweede lid




                    televisie en radio


                    leidraad B3.1.11, vierde lid, onderdeel b




                    vertoning van films


                    leidraad B3.1.11, vierde lid, onderdeel c




                    bibliotheek


                    leidraad B3.1.11, vierde lid, onderdeel f




                    elektronische apparatuur


                    leidraad B3.1.11, vierde lid, onderdeel h




                    telefoon-, e-mail- en internetverbinding


                    leidraad B3.1.11, vierde lid, onderdeel j, en achtste lid
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.14
  - number: 4.1.14.2
    text: |-
      Aan boord van een zeeschip van 8.000 GT of meer zijn voorts recreatieve voorzieningen aanwezig die voldoen aan de
      normering van de in de onderstaande tabel opgenomen onderdelen van leidraden van het MLC-verdrag:






                    sportvoorzieningen


                    leidraad B3.1.11, vierde lid, onderdeel d




                    zwembad


                    leidraad B3.1.11, vierde lid, onderdeel e




                    faciliteiten voor creatieve bezigheden


                    leidraad B3.1.11, vierde lid, onderdeel g




                    bar


                    leidraad B3.1.11, vierde lid, onderdeel i
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.14
  - number: 4.1.14.3
    text: |-
      Op een zeeschip van 500 GT of meer is voor de voorzieningen, bedoeld in het eerste lid, ten minste één afzonderlijk
      verblijf beschikbaar.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.14
  - number: 4.1.14.4
    text: |-
      Op zeeschip van kleiner dan 500 GT kunnen in plaats van een afzonderlijk recreatieverblijf de dagverblijven zodanig
      worden ingericht en uitgerust, dat zij als ontspanningsruimte dienst kunnen doen.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.14
  - number: 4.1.14.5
    text: |-
      Op zeeschip van 8.000 GT of meer zijn voor de voorzieningen, bedoeld in het eerste en tweede lid, naast een
      afzonderlijke ruimte voor het zwembad, ten minste twee verblijven aanwezig waarin voldoende ruimte is voor het
      tegelijkertijd uitoefenen van verschillende recreatieve bezigheden.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.14
  - number: 4.1.15
    text: |-
      De minister kan, na overleg met de betrokken organisaties van scheepsbeheerders en zeevarenden, ontheffing verlenen
      van [artikel 4.1.14, tweede lid][ref1], ten aanzien van de aanwezigheid van een zwembad, indien dit gelet op de
      inrichting van het zeeschip niet goed te realiseren is.


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel4
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.15
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.1.16.1
    text: |-
      Aan boord zijn de onderstaande voorzieningen aanwezig, die voldoen aan de in de onderstaande tabel opgenomen
      onderdelen van normen en de normering van de onderdelen van leidraden van het MLC-verdrag:






                    wasvoorzieningen


                    norm A3.1, dertiende lid, en leidraad B3.1.7, vierde lid




                    ruimte op het open dek


                    norm A3.1, veertiende lid




                    kantoren


                    norm A3.1, vijftiende lid, eerste volzin
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.16
  - number: 4.1.16.2
    text: |-
      Op een zeeschip van 1.600 GT of meer is een kleedruimte voor machinekamerpersoneel aanwezig, die voldoet aan de
      normering van leidraad B3.1.9 van het MLC-verdrag, tenzij al het machinekamerpersoneel de beschikking heeft over
      een slaapverblijf voor niet meer dan twee personen met een bijbehorende sanitaire ruimte waar een bad of douche
      aanwezig is. De kleedruimte voor machinekamerpersoneel is vanuit de machinekamer binnendoor te bereiken.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.16
  - number: 4.1.16.3
    text: |-
      Indien het desbetreffende zeeschip regelmatig havens aandoet waar doorgaans muggen aanwezig zijn, zijn
      voorzieningen aan boord aanwezig tegen het binnendringen van muggen in de verblijven en ruimten die toegang geven
      tot het open dek.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.16
  - number: 4.1.16.4
    text: |-
      De in leidraad B3.1.10 van het MLC-verdrag genoemde benodigdheden zijn in voldoende hoeveelheden voor de
      zeevarenden aan boord beschikbaar.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.16
  - number: 4.1.17.1
    text: |-
      Voor een zeeschip van minder dan 3.000 GT kan de minister, na overleg met de betrokken organisaties van
      scheepsbeheerders en zeevarenden, ontheffing verlenen van norm A3.1, vijftiende lid, van het MLC-verdrag ten
      aanzien van kantoren.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.17
  - number: 4.1.17.2
    text: |-
      Voor een zeeschip van minder dan 200 GT kan de minister, na overleg met de betrokken organisaties van
      scheepsbeheerders en zeevarenden en met inachtneming van de grootte van het zeeschip en het aantal opvarenden aan
      boord, ontheffing verlenen van norm A.3.1, dertiende lid, van het MLC-verdrag ten aanzien van wasvoorzieningen,
      indien de zeevarenden van het desbetreffende zeeschip aan de wal voldoende toegang hebben tot wasvoorzieningen.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.17
  - number: 4.1.18
    text: |-
      Voor een zeeschip waarop zeevarenden werkzaam zijn met uiteenlopende gewoonten van godsdienstige of sociale aard,
      kan de minister, na overleg met de betrokken organisaties van scheepsbeheerders en zeevarenden en onder daarbij te
      stellen voorschriften, ontheffing verlenen van norm A3.1 van het MLC-verdrag, mits dit niet leidt tot situaties die
      voor één of meer zeevarenden aan boord van het desbetreffende zeeschip minder gunstig zijn dan zonder het verlenen
      van die ontheffing het geval zou zijn.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.18
  - number: 4.1.19.1
    text: |-
      Een zeeschip is uitgerust met voldoende kooktoestellen en keukengerei voor het bereiden van maaltijden van
      voldoende hoeveelheid, kwaliteit en voedingswaarde, voor de zeevarenden aan boord.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.19
  - number: 4.1.19.2
    text: |-
      Op een zeeschip met een lengte van 35 meter of meer is voor het bereiden van voedsel en warme dranken een
      afzonderlijk verblijf ingericht als kombuis, die voldoende uitgerust is om goede, gevarieerde en voedzame
      maaltijden efficiënt te kunnen bereiden, in voldoende aantallen en rekening houdend met verschillende godsdienstige
      en culturele gebruiken van zeevarenden. De kombuis is aangesloten op een systeem van koud en warm drinkwater.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.19
  - number: 4.1.19.3
    text: |-
      Voor de opslag van levensmiddelen zijn van andere ruimten afgesloten bergplaatsen aanwezig, die zodanig zijn
      geventileerd of gekoeld dat de voeding in goede toestand blijft.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.19
  - number: 4.1.19.4
    text: |-
      Een zeeschip is uitgerust met drinkwatertanks die door cofferdammen zijn gescheiden van olietanks en verzameltanks
      voor vuil water, en zodanig zijn geconstrueerd dat bij het leegpompen geen restanten achterblijven en de hygiëne
      van het drinkwater wordt gewaarborgd. Pijpleidingen, van welke aard ook, mogen niet door drinkwatertanks lopen.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.19
  - number: 4.1.19.5
    text: |-
      Dit artikel is tevens van toepassing op een zeeschip als bedoeld in
      [artikel 4.4.1, eerste lid, onderdelen a en c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel4
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.19
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: 4.1.20.1
    text: |-
      Materialen en producten die voldoen aan de in leidraad B3.1.1, vijfde lid, B3.1.5, negende lid, B3.1.7, tweede
      en derde lid, onderdeel b, en B3.1.10, eerste lid, onderdeel b, van het MLC-verdrag genoemde omschrijving worden
      aangemerkt als goedgekeurde materialen en producten.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.20
  - number: 4.1.20.2
    text: |-
      Materialen of producten die op grond van de daarop van toepassing zijnde regelgeving een CE-markering hebben,
      worden aangemerkt als goedgekeurde materialen of producten als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.20
  - number: 4.1.21.1
    text: De verblijven worden schoon, bewoonbaar en in een goede staat van onderhoud gehouden.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.21
  - number: 4.1.21.2
    text: |-
      Ten minste eenmaal per maand worden de verblijven ten behoeve van de naleving van het eerste lid door de kapitein
      of een door hem aangewezen officier, in aanwezigheid van één of meer leden van de bemanning, geïnspecteerd. De
      bevindingen van deze inspectie worden vermeld in het scheepsdagboek.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.21
  - number: 4.1.21.3
    text: |-
      Zolang zeevarenden aan boord zijn, wordt met betrekking tot de verwarming van de verblijven aan boord voldaan aan
      leidraad B3.1.3, eerste lid, van het MLC-verdrag.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.21
  - number: 4.1.21.4
    text: |-
      Dit artikel is tevens van toepassing op een zeeschip als bedoeld in
      [artikel 4.4.1, eerste lid, onderdelen a en c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel4
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.21
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: 4.1.22.1
    text: |-
      De scheepsbeheerder draagt er zorg voor dat voor de verzending van e-mail aan boord aanwezige internetfaciliteiten
      voor alle zeevarende toegankelijk zijn en dat postverzending geschiedt in overeenstemming met leidraad B3.1.11,
      vijfde lid, van het MLC-verdrag.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.22
  - number: 4.1.22.2
    text: |-
      Voor het gebruik van telefoon-, e-mail- en internetverbindingen kan de scheepsbeheerder een vergoeding voor de
      gebruikskosten vragen, in overeenstemming met leidraad B3.11, achtste lid, van het MLC-verdrag. De overige in
      [artikel 4.1.14][ref1] bedoelde voorzieningen staan kosteloos ter beschikking van de zeevarenden.


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel4
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.22
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.1.22.3
    text: |-
      De scheepsbeheerder zorgt ervoor dat omgang met familie en vrienden van zeevarenden geschiedt in overeenstemming
      met de normering van leidraad B3.1.11, zesde en zevende lid, van het MLC-verdrag.
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.22
  - number: 4.1.22.4
    text: |-
      De in [artikel 4.1.14][ref1] bedoelde voorzieningen worden overeenkomstig de in leidraad B3.1.11, eerste lid, van
      het MLC-verdrag genoemde doelstellingen ten minste eenmaal per drie jaar door of namens de kapitein geïnspecteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel4
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.22
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.1.22.5
    text: |-
      Dit artikel is tevens van toepassing op een zeeschip als bedoeld in
      [artikel 4.1.1, eerste lid, onderdelen a en c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel4
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.22
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.1.23.1
    text: |-
      Aan boord zijn de nodige voorzieningen voor het elektronisch of op andere wijze raadplegen van de overeenkomst
      tussen de Associatie van reders van de Europese Gemeenschap (ECSA) en de Europese Federatie van vervoerswerknemers
      (European Transport Workers' Federation – ETF) inzake het Verdrag betreffende maritieme arbeid (PbEG 2009, L124).
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.23
  - number: 4.1.23.2
    text: |-
      Het eerste lid is tevens van toepassing op een zeeschip als bedoeld in
      [artikel 4.1.1, eerste lid, onderdeel a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel4
    url: https://wetten.overheid.nl/BWBR0051068/2025-07-01#Artikel4.1.23
    references:
      - id: ref1
        bwb_id: BWBR0051068
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.1.24.1
    text: |-
      De minister kan ontheffing verlenen van de [artikelen 4.1.2][ref1], [4.1.4, eerste en vierde lid][ref2],
      [4.1.9][ref3], [4.1.11][ref4], [4.1.13][ref5], [4.1.14., eerste tot en met vijfde lid][ref6], en
      [4.1.16, eerste en tweede lid][ref7], voor:


      [ref1]: https://wetten.overheid.nl/BWBR0051068#Artikel4
