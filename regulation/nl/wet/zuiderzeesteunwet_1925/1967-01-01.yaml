preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of hooren lezen, salut! doen te weten:

    Alzoo Wij in overweging genomen hebben, dat ingevolge artikel 3 der Wet van den 14den Juni 1918 (Staatsblad n°.
    354) tot afsluiting en droogmaking van de Zuiderzee, bij de wet behooren te worden geregeld en vastgesteld de
    maatregelen ter tegemoetkoming aan de Zuiderzeevisschersbevolking en andere personen, wegens de schade, welke de
    afsluiting hun mocht berokkenen;

    Zoo is het, dat Wij, den Raad van State gehoord en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0001925/1967-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Deze wet verstaat onder:

      a. "belanghebbenden", hen die op 25 Juli 1918 hoofdmiddel van bestaan vonden in de uitoefening van de visscherij
      op de Zuiderzee of in het bedrijf van scheepsbouwer, scheepshersteller, mastenmaker, blokmaker, zeilmaker,
      nettenmaker, nettenhandelaar, taander, touwslager, mandenmaker, kistenmaker, kuiper, smid, loodgieter, koperslager,
      vischrooker, vischzouter, vischvervoerder, commissionnair of handelaar in visch, vischventer, leverancier van
      scheepsbenoodigdheden, vischafslager, vischcontroleur, wiervisscher, commissionnair of handelaar in zeegras,
      eendenhouder of nesthandelaar, voor zooverre het gegrond was op de visscherij op de Zuiderzee.

      Zij, die op 25 Juli 1918 inkomsten trokken uit fondsen, waaraan Zuiderzeevisschers een deel der besomming plegen
      af te dragen (zoogenaamde Visschersfondsen), benevens op dien datum in Zuiderzeegemeenten woonachtige visschers,
      die de visscherij ter Noordzee uitoefenen, doch hun bedrijf na afsluiting niet kunnen voortzetten en weduwen van
      belanghebbenden kunnen voor toepassing dezer wet met belanghebbenden worden gelijkgesteld.

      b. "Minister", Onzen Minister, met de uitvoering van deze wet belast.
    url: https://wetten.overheid.nl/BWBR0001925/1967-01-01#Artikel1
  - number: 1a
    text: |-
      Voor de toepassing van deze wet worden, voorzover zij niet belanghebbende zijn ingevolge [artikel 1][ref1], met
      belanghebbenden gelijkgesteld:

      a. zij, die geboren zijn vóór 1 januari 1913 en in 1950, 1951 of 1952 in het bezit waren van een vergunning, als
      bedoeld in [artikel 17 van de Visserijwet][ref2], tot uitoefening van de IJsselmeervisserij;

      b. zij, die geboren zijn vóór 1 januari 1913 en in 1950, 1951 of 1952 als knecht of medeschipper werkzaam
      zijn geweest aan boord van een vaartuig, waarmede houders van een vergunning, als onder *a* bedoeld, de
      IJsselmeervisserij uitoefenden, mits zij gedurende tenminste 15 jaren, waarin begrepen het tijdvak van 1 mei 1947
      tot 1 mei 1950, zonder wezenlijke onderbreking hoofdmiddel van bestaan in die visserij hebben gevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0001925#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002416#Artikel17
    url: https://wetten.overheid.nl/BWBR0001925/1967-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0001925
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002416
        artikel: '17'
  - number: '2'
    text: |-
      1 De autoriteiten, colleges en ambtenaren, daartoe door Ons of door Onzen Minister aangewezen, zijn verplicht tot
      het verstrekken van opgaven, inlichtingen en adviezen en het verleenen van medewerking in verband met de uitvoering
      van deze wet.
    url: https://wetten.overheid.nl/BWBR0001925/1967-01-01#Artikel2
  - number: '3'
    text: |-
      Tot het geven van advies met betrekking tot de ingevolge deze wet te nemen maatregelen en tot bijstand in de
      uitvoering daarvan wordt eene Generale Commissie ingesteld, wier samenstelling, taak, bevoegdheid en werkwijze bij
      algemeenen maatregel van bestuur wordt geregeld.

      2 In dezen algemeenen maatregel van bestuur worden ook regelen gesteld voor de instelling van plaatselijke
      commissiën, welke aan de Generale Commissie advies uitbrengen.
    url: https://wetten.overheid.nl/BWBR0001925/1967-01-01#Artikel3
  - number: '5'
    text: |-
      1 Aan belanghebbenden en aan hunne kinderen kan op hun verzoek Nijverheidsonderwijs worden verstrekt, als bedoeld
      in [artikel 1, eerste en tweede lid, en derde lid, sub ][ref1], der Nijverheidsonderwijswet.

      2 Voor zooverre dit onderwijs niet reeds ingevolge de bepalingen dier wet kosteloos of onder toekenning van
      toelagen kan worden genoten, kan het worden verstrekt onder geheele of gedeeltelijke vergoeding van schoolgeld,
      leergeld of andere kosten, c. q. onder toekenning van toelagen, die tot het genieten er van in staat stellen.

      3 Indien belanghebbenden en hunne kinderen zich wenschen te bekwamen voor eenig handwerk, ambacht, bedrijf of
      eenigen anderen werkkring, in de opleiding waarvoor het in het eerste lid van dit artikel bedoelde onderwijs niet
      kan voorzien, wordt door of vanwege Onzen Minister beslist of, en zoo ja, in hoeverre, de daaraan verbonden kosten
      worden vergoed.


      [ref1]: https://wetten.overheid.nl/BWBR0001925#Artikel1
    url: https://wetten.overheid.nl/BWBR0001925/1967-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001925
        artikel: '1'
  - number: '6'
    text: |-
      1 Ter verkrijging van arbeid en bij de keuze van een beroep zal aan belanghebbenden en hun kinderen hulp en
      voorlichting worden verschaft, terwijl - voorzover zij in eigen bedrijf werkzaam zijn - bij gebleken wenselijkheid
      mede de mogelijkheid tot verplaatsing of vervorming van hun bedrijven dan wel tot inrichting van nieuwe bedrijven
      of tot het ter hand nemen van ander werk zal worden onderzocht, een en ander voorzover naar het oordeel van Onze
      Minister nog verband bestaat tussen de omstandigheden, waarin belanghebbenden of hun kinderen verkeren, en de
      afsluiting der Zuiderzee of de inpolderingen in het IJsselmeer.

      2 Wanneer het ingesteld onderzoek gunstige resultaten doet verwachten, doch de verplaatsing of vervorming van
      bedrijf dan wel de inrichting van een nieuw bedrijf of het ter hand nemen van ander werk zou worden bemoeilijkt
      door omstandigheden, welke verband houden met de liquidatie van een eigen bedrijf, voor zoover dit behoort tot
      de in [artikel 1 sub ][ref1] genoemde bedrijven, kunnen aan belanghebbenden, naar door Ons te stellen regelen,
      tegemoetkomingen in geld worden verleend ter vergemakkelijking van die liquidatie.

      3 Ongeacht de tegemoetkoming, bedoeld in het tweede lid van dit artikel kunnen de in verband met het aanvaarden van
      een werkkring bestede kosten binnen ter beoordeeling van Onzen Minister redelijke grenzen worden vergoed, terwijl
      mede toelagen kunnen worden verleend, die het elders ter hand nemen van arbeid of bedrijf kunnen vergemakkelijken.


      [ref1]: https://wetten.overheid.nl/BWBR0001925#Artikel1
    url: https://wetten.overheid.nl/BWBR0001925/1967-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001925
        artikel: '1'
  - number: 6a
    text: |-
      Bij algemene maatregel van bestuur worden regelen vastgesteld omtrent vergoeding van waardevermindering van
      vissersvaartuigen en netwerk, welke voor de IJsselmeervisserij zijn gebezigd.
    url: https://wetten.overheid.nl/BWBR0001925/1967-01-01#Artikel6a
  - number: '7'
    text: |-
      1 Aan belanghebbenden kan, onder voorwaarde van aflossing, uiterlijk in vijftien jaren en tegen vergoeding van
      rente, met een maximum van 5 % en een minimum van 3 % 's jaars, voor ieder geval door of vanwege Onzen Minister te
      bepalen, crediet worden verleend, voor zooverre het moet strekken tot voortzetting, verplaatsing of vervorming van
      eenig bedrijf of inrichting van een nieuw bedrijf.

      2 De termijn, waarbinnen aflossing van crediet moet plaats hebben en het tijdstip, waarop de rente moet worden
      betaald, kan op verzoek van belanghebbenden door of vanwege Onzen Minister worden uitgesteld, indien voor
      inwilliging een geldige reden bestaat.

      3 Bij ontbinding van een vennootschap of stichting en bij faillissement zijn de nog verschuldigde gelden terstond
      opvorderbaar, terwijl opvordering dier gelden eveneens kan plaats hebben in geval van wanprestatie of beëindiging
      van het bedrijf.

      4 Het crediet wordt slechts verleend onder schriftelijk beding, dat de credietnemer zijn roerende of onroerende
      goederen niet zal belasten met pand of hypotheek, pand- of verbandbrieven op schepen daaronder begrepen, tenzij
      na daartoe vooraf bekomen schriftelijke machtiging van Onzen Minister. Bij de credietverleening zal voorts worden
      overeengekomen, dat bij niet-nakoming van dit beding de schuld terstond opvorderbaar wordt en dat de schuldenaar
      deswege een boete zal verbeuren ten beloope van tien ten honderd van de hoofdsom der schuld. Voor de voldoening
      dezer boete zal de credietnemer als regel persoonlijke zekerheid moeten stellen.
    url: https://wetten.overheid.nl/BWBR0001925/1967-01-01#Artikel7
  - number: '8'
    text: |-
      1 De credietverleening kan door Ons worden opgedragen aan eene instelling, die zich daarmede in het bijzonder,
      met inachtneming van door Ons te geven voorschriften belast, in welk geval het Rijk volledig garant blijft voor de
      geldelijke nadeelen, welke uit de credietverleening mochten voortvloeien.

      2 Vorderingen aan kapitaal en verschuldigde renten, welke de in het vorige lid bedoelde instelling niet heeft
      kunnen innen, gaan van rechtswege op het Rijk over.

      3 Zolang een opdracht, als in het eerste lid van dit artikel bedoeld, niet wordt verstrekt, zal de credietverlening
      door of namens Onze Minister geschieden.
    url: https://wetten.overheid.nl/BWBR0001925/1967-01-01#Artikel8
  - number: '9'
    text: |-
      De uit de credietverleening voortspruitende vorderingen van het Rijk zijn bevoorrecht op de roerende en onroerende
      goederen van den schuldenaar. De bevoorrechte vorderingen nemen rang onmiddellijk na pand en hypotheek.
    url: https://wetten.overheid.nl/BWBR0001925/1967-01-01#Artikel9
  - number: '10'
    text: |-
      1 Is het verschuldigde niet binnen den bepaalden tijd voldaan, dan wordt daarvan door of vanwege Onzen Minister
      kennis gegeven aan den Ontvanger der directe belastingen onder wiens kantoor de schuldenaar gevestigd is. De
      Ontvanger zendt aan dezen eene aanmaning om binnen tien dagen aan zijne verplichting tot betaling te voldoen, onder
      kennisgeving, dat hij daartoe anders door middelen, bij de wet bepaald, zal worden gedwongen. In de aanmaning wordt
      het bedrag der vordering, zooveel mogelijk gespecificeerd, vermeld.

      2 Wordt aan deze aanmaning niet voldaan, dan vaardigt de Ontvanger een dwangbevel uit, medebrengende het recht van
      parate executie.

      3 Het dwangbevel wordt beteekend en ten uitvoer gelegd op de wijze, bij het
      [Wetboek van Burgerlijke Rechtsvordering][ref1] ten aanzien van vonnissen en authentieke akten voorgeschreven, en
      kan in het geheele Rijk ten uitvoer worden gelegd.

      4 De beteekening en de tenuitvoerlegging van de dwangbevelen geschieden door ambtenaren der directe belastingen.

      5 Na de beteekening van het dwangbevel kan uitsluitend worden betaald ten kantore, waaraan de ambtenaar, houder van
      het dwangbevel, verbonden is of, bij inbeslagneming, in handen van dien ambtenaar.

      6 De kosten van vervolging worden berekend volgens de bepalingen, betrekkelijk de kosten van vervolging inzake
      directe belastingen. Het recht van parate executie strekt zich uit tot deze kosten.

      7 Verzet tegen de tenuitvoerlegging van de dwangbevelen kan niet tegen de wettigheid of de hoegrootheid van de
      vordering zijn gericht, noch gegrond zijn op de bewering, dat de aanmaning niet zou zijn ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0001925/1967-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '11'
    text: |-
      Terugvordering van betaalde vorderingen en kosten heeft plaats bij dagvaarding van den ambtenaar, te wiens kantore
      de betaling is geschied, voor de rechtbank van het arrondissement, waarin dat kantoor is gevestigd.
    url: https://wetten.overheid.nl/BWBR0001925/1967-01-01#Artikel11
  - number: '12'
    text: |-
      1 Aan belanghebbenden kan, naar door Ons te stellen regelen, voorkeur worden verleend tot het kosteloos verkrijgen
      van vergunning tot uitoefening der visscherij op de afgesloten Zuiderzee.

      2 Voorkeursrecht, noch verkregen vergunning, zijn voor overdracht vatbaar, tenzij terzake vooraf de toestemming van
      Onzen Minister is verkregen.
    url: https://wetten.overheid.nl/BWBR0001925/1967-01-01#Artikel12
  - number: '13'
    text: |-
      1 Leidt de afsluiting van de Zuiderzee, of leiden de inpolderingen in het IJsselmeer tot zodanige omstandigheden,
      dat inkomsten ontleend aan de IJsselmeervisserij, aan belanghebbenden en hun gezinnen, of andere personen met
      wier verzorging zij naar het oordeel van Onze Minister zijn belast, gaan ontbreken en zijn zij niet in staat
      door aanwending van eigen arbeidskracht of uitoefening van een beroep of bedrijf zich voldoende middelen tot
      levensonderhoud te verschaffen, dan wordt hun, naar door Ons te stellen regelen, een geldelijke tegemoetkoming
      verleend.

      2 Deze tegemoetkoming kan door belanghebbenden, die op 16 December 1927 jonger dan vijf en twintig jaar waren in
      den regel gedurende ten hoogste drie jaar, en voor zoover zij vijf en twintig of ouder doch jonger dan vijf en
      dertig jaar zijn, in den regel gedurende ten hoogste vijf jaar worden genoten.

      3 Het bepaalde in het vorige lid is niet van toepassing:

      a. op de belanghebbende, die in het jaar 1950, 1951 of 1952 in het bezit is geweest van een vergunning, als bedoeld
      in [artikel 17 van de Visserijwet][ref1], tot uitoefening van de IJsselmeervisserij;

      b. op de belanghebbende, die in 1950, 1951 of 1952 als knecht of medeschipper aan boord van het vaartuig, waarmede
      vergunninghouders, als hierboven bedoeld, de visserij uitoefenden, werkzaam zijn geweest en daarin sedert 1 mei
      1947 tot het verlaten van de IJsselmeervisserij, zonder wezenlijke onderbreking, hoofdmiddel van bestaan hebben
      gevonden;

      c. op, nadat deze de 65-jarige leeftijd hebben bereikt, met belanghebbenden gelijkgestelde weduwen van
      belanghebbenden, onder *a.* bedoeld, voor zoveel haar overleden echtgenoten aanspraak op geldelijke tegemoetkoming
      konden maken, of bij staken van het bedrijf zouden hebben kunnen maken, alsmede op, nadat deze 65-jarige leeftijd
      hebben bereikt, met belanghebbenden gelijkgestelde weduwen van belanghebbenden, onder *b* bedoeld, voor zoveel
      haar overleden echtgenoten aanspraak op geldelijke tegemoetkoming konden maken of bij staken van het bedrijf zouden
      hebben kunnen maken en in 1950, 1951 of 1952 mede-eigenaars waren van het schip, aan boord waarvan zij de visserij
      uitoefenden en voor hun aandeel in de eigendom volledig het risico droegen van het bedrijf.

      4 In andere gevallen zal omtrent den tijdsduur der tegemoetkoming naar gelang van omstandigheden door of vanwege
      Onzen Minister worden beslist, met dien verstande, dat de tegemoetkoming aan belanghebbenden, die bij het in
      werking treden van deze wet zestig jaar of ouder zijn, in den regel zal worden verleend voor den duur van hun
      leven.


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel17
