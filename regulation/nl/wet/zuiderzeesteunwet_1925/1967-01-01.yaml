  - number: '14'
    text: |-
      Hetgeen ter uitvoering van deze wet noodig is, wordt - voor zoover niet anders is bepaald - bij algemeenen
      maatregel van bestuur geregeld.
    url: https://wetten.overheid.nl/BWBR0001925/1967-01-01#Artikel14
  - number: '15'
    text: |-
      Deze wet kan worden aangehaald onder den titel van "Zuiderzeesteunwet", met vermelding van den jaargang en het
      nummer van het *Staatsblad,* waarin zij is geplaatst.
    url: https://wetten.overheid.nl/BWBR0001925/1967-01-01#Artikel15
  - number: '16'
    text: De bepalingen dezer wet treden in werking op door Ons vast te stellen tijdstippen.
    url: https://wetten.overheid.nl/BWBR0001925/1967-01-01#Artikel16
