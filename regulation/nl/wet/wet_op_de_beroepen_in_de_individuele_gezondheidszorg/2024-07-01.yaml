  - number: '111'
    text: |-
      In de algemene maatregel van bestuur, bedoeld in [artikel 8, eerste lid][ref1], kan voor personen die
      hun getuigschrift hebben behaald vóór het tijdstip van inwerkingtreding van deze maatregel een van
      [artikel 8, tweede lid][ref2], afwijkende aanvangsdatum worden vastgesteld vanaf welke de in de maatregel
      aangegeven periode begint te lopen.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel8
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel111
