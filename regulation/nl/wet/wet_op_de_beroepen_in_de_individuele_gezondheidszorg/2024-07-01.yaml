      - id: ref9
        bwb_id: BWBR0006251
        artikel: '67'
        hoofdstuk: VII
        paragraaf: '4'
      - id: ref10
        bwb_id: BWBR0006251
        artikel: 67b
        hoofdstuk: VII
        paragraaf: '4'
      - id: ref11
        bwb_id: BWBR0006251
        artikel: '70'
        hoofdstuk: VII
        paragraaf: '4'
      - id: ref12
        bwb_id: BWBR0006251
        artikel: '71'
        hoofdstuk: VII
        paragraaf: '4'
  - number: 48a.5
    text: |-
      Tegen een beslissing als bedoeld in het tweede lid kan binnen zes weken na de dag van verzending van het afschrift
      van die beslissing bij het centrale tuchtcollege beroep worden ingesteld door:
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel48a
  - number: 48a.5.a
    text: de inspecteur, voor zover het verzoek is afgewezen, of voor zover hij niet-ontvankelijk is verklaard;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel48a
  - number: 48a.5.b
    text: de beroepsbeoefenaar, voor zover het verzoek is toegewezen.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel48a
  - number: 48a.6
    text: |-
      Op de procedure in beroep zijn de [artikelen 56, tweede lid][ref1], [61][ref2], [63][ref3], [63a][ref4],
      [65d, eerste, tweede, vierde en vijfde lid][ref5], [65e][ref6], [67][ref7], [67b][ref8], [70][ref9] en [71][ref10]
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel61
      [ref3]: https://wetten.overheid.nl/BWBR0006251#Artikel63
      [ref4]: https://wetten.overheid.nl/BWBR0006251#Artikel63a
      [ref5]: https://wetten.overheid.nl/BWBR0006251#Artikel65d
      [ref6]: https://wetten.overheid.nl/BWBR0006251#Artikel65e
      [ref7]: https://wetten.overheid.nl/BWBR0006251#Artikel67
      [ref8]: https://wetten.overheid.nl/BWBR0006251#Artikel67b
      [ref9]: https://wetten.overheid.nl/BWBR0006251#Artikel70
      [ref10]: https://wetten.overheid.nl/BWBR0006251#Artikel71
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel48a
