  - number: 48a.7
    text: |-
      Bij de toepassing van de in het vierde en zesde van overeenkomstige toepassing verklaarde artikelen, dient waar in
      die artikelen onderscheidenlijk wordt gesproken over «klager, beklaagde of klacht» te worden gelezen inspecteur,
      beroepsbeoefenaar en verzoek. Bij de toepassing van [artikel 65d, eerste lid][ref1], dient waar gesproken wordt van
      «zijn klacht», gelezen te worden: het beroep.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel65d
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel48a
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: 65d
        hoofdstuk: VII
        paragraaf: '4'
  - number: '49.1'
    text: |-
      Degene aan wie een boete als bedoeld in [artikel 48, eerste lid, onder c][ref1], is opgelegd, wordt door Onze
      Minister bij gedagtekende brief uitgenodigd de verschuldigde geldboete binnen de gestelde termijn dan wel met
      inachtneming van de gestelde termijnen te betalen.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel48
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '48'
        hoofdstuk: VII
        paragraaf: '2'
  - number: '49.2'
    text: |-
      Indien de schuldenaar niet binnen de gestelde termijn betaalt, maant Onze Minister hem schriftelijk aan om alsnog
      binnen tien dagen na dagtekening van de aanmaning te betalen.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel49
  - number: 49a.1
    text: |-
      De beslissing tot het opleggen van een geldboete levert een executoriale titel op, die met toepassing van het
      [Wetboek van Burgerlijke Rechtsvordering][ref1] ten uitvoer kan worden gelegd. De secretaris van het tuchtcollege
      verstrekt een afschrift van de beslissing aan de partij die tot de tenuitvoerlegging van de beslissing kan
      overgaan, opgemaakt in executoriale vorm.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel49a
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: 49a.2
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld over de tenuitvoerlegging van een beslissing als
      bedoeld in [artikel 48, eerste lid, onder c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel48
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel49a
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '48'
        hoofdstuk: VII
        paragraaf: '2'
  - number: 49b
    text: |-
      Op een veroordeling in de kosten bedoeld in [artikel 69, vijfde lid][ref1], is [artikel 49a][ref2] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel49a
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel49b
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '69'
        hoofdstuk: VII
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: 49a
        hoofdstuk: VII
        paragraaf: '2'
  - number: '50.1'
    text: |-
      In gevallen waarin een der in [artikel 48, eerste lid, onder e, f en g, tweede en vierde lid][ref1], omschreven
      maatregelen is opgelegd, kan, zo bijzondere omstandigheden zulks wettigen, bij koninklijk besluit worden bepaald
      dat de betrokkene in de hem ontzegde bevoegdheid wordt hersteld dan wel dat de aan de betrokkene opgelegde
      beperkingen worden opgeheven, dat hij, tenzij een buiten de opgelegde maatregel staande weigeringsgrond aanwezig
      blijkt, wederom in het register zal kunnen worden ingeschreven onderscheidenlijk dat de voorwaarden die de
      betrokkene bij die maatregel werden gesteld, komen te vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel48
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '48'
        hoofdstuk: VII
        paragraaf: '2'
  - number: '50.2'
    text: |-
      In een besluit krachtens het eerste lid kunnen, al dan niet met een beperking tot een in dat besluit te bepalen
      proeftijd, voorwaarden worden gesteld, door de betrokkene, in het register ingeschreven staande, in acht te
      nemen. Indien blijkt dat de betrokkene zich schuldig heeft gemaakt aan niet-naleving van een gestelde voorwaarde,
      kan, onder intrekking van dat besluit, bij koninklijk besluit worden bepaald dat de opgelegde maatregel opnieuw
      van kracht wordt. In een besluit krachtens het eerste lid, dat aan betrokkene het recht verleent wederom in het
      register te worden ingeschreven, kan ook worden bepaald dat dit recht eerst zal ingaan zodra de betrokkene aan
      vooraf te vervullen bijzondere voorwaarden, in dat besluit omschreven, zal hebben voldaan.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel50
  - number: '50.3'
    text: |-
      De voordracht tot een besluit krachtens het eerste of tweede lid, tweede volzin, wordt gedaan door Onze Minister.
      Alvorens zodanige voordracht wordt gedaan, wint Onze Minister het advies in bij het tuchtcollege dat de maatregel
      heeft opgelegd.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel50
  - number: '50.4'
    text: |-
      Indien toepassing wordt gegeven aan het eerste lid, wordt de bevoegdheid van een verpleegkundige als bedoeld in
      [artikel 5, eerste lid, tweede volzin][ref1], wederom in het register vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel5
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '5'
        hoofdstuk: II
        paragraaf: '1'
  - number: '51'
    text: |-
      Niemand kan andermaal ingevolge de bepalingen van dit hoofdstuk worden berecht ter zake van enig in
      [artikel 47, eerste lid][ref1], bedoeld handelen of nalaten waaromtrent te zijnen aanzien een onherroepelijk
      geworden tuchtrechtelijke eindbeslissing is genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel47
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '47'
        hoofdstuk: VII
        paragraaf: '1'
  - number: '52'
    text: |-
      Herziening van een onherroepelijk geworden tuchtrechtelijke eindbeslissing waarbij een in
      [artikel 48, eerste, tweede of vierde lid][ref1], omschreven maatregel werd opgelegd, is mogelijk, wanneer
      naderhand omstandigheden zijn gebleken die naar ernstig vermoeden tot een afwijkende beslissing zouden hebben
      geleid, indien zij tijdig bekend waren geworden. Bij algemene maatregel van bestuur worden hieromtrent nadere
      regels gesteld. De herziening zal niet kunnen leiden tot een wijziging in hetgeen voorheen was beslist, ten nadele
      van de betrokkene.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel48
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '48'
        hoofdstuk: VII
        paragraaf: '2'
  - number: '53.1'
    text: 'Er zijn drie regionale tuchtcolleges die zijn gevestigd te:'
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel53
  - number: 53.1.a
    text: Amsterdam;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel53
  - number: 53.1.b
    text: ’s-Hertogenbosch;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel53
  - number: 53.1.c
    text: Zwolle.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel53
  - number: '53.2'
    text: |-
      Bij algemene maatregel van bestuur wordt het Europese deel van Nederland in gebieden ingedeeld, waarvan elk het
      rechtsgebied van een regionaal tuchtcollege uitmaakt.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel53
  - number: '53.3'
    text: Het centrale tuchtcollege is gevestigd te 's-Gravenhage.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel53
  - number: 53a.1
    text: De terechtzittingen en de vooronderzoeken vinden plaats in de vestigingsplaats van het regionale tuchtcollege.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel53a
  - number: 53a.2
    text: |-
      De voorzitter van een regionaal tuchtcollege kan in het belang van de behandeling van een zaak, bepalen dat een
      terechtzitting of een vooronderzoek in het kader van die zaak op een andere plaats plaatsvindt dan bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel53a
  - number: '54.1'
    text: 'Bevoegd tot het behandelen van een zaak in eerste aanleg is:'
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel54
  - number: 54.1.a
    text: het regionale tuchtcollege van het rechtsgebied waarin de beklaagde zijn woonplaats heeft; of
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel54
  - number: 54.1.b
    text: |-
      het regionale tuchtcollege binnen wiens rechtsgebied de gedraging waarop de zaak betrekking heeft, heeft
      plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel54
  - number: '54.2'
    text: 'Bevoegd tot het behandelen van een zaak in eerste aanleg tegen meerdere beklaagden is:'
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel54
  - number: 54.2.a
    text: het regionale tuchtcollege van het rechtsgebied waarin één van de beklaagden zijn woonplaats heeft; of
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel54
  - number: 54.2.b
    text: |-
      het regionale tuchtcollege van het rechtsgebied waarin een op alle beklaagden betrekking hebbende gedraging heeft
      plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel54
  - number: '54.3'
    text: |-
      In het geval geen der regionale tuchtcolleges op grond van het eerste of tweede lid bevoegd is tot het behandelen
      van een zaak, is het regionale tuchtcollege te Amsterdam bevoegd.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel54
  - number: '54.4'
    text: |-
      Indien de beklaagde in een zaak tevens lid-beroepsgenoot of plaatsvervangend lid-beroepsgenoot is van het
      regionale tuchtcollege waar het klaagschrift is ingediend, kan de voorzitter in het belang van een onafhankelijke
      behandeling, de zaak ter behandeling verwijzen naar een ander regionaal tuchtcollege. De zaak wordt in het
      behandelend regionale tuchtcollege behandeld door leden die daartoe door de voorzitter zijn aangewezen. Bij die
      aanwijzing draagt de voorzitter er zorg voor dat een onafhankelijke behandeling is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel54
  - number: '54.5'
    text: |-
      Indien een klaagschrift is ingediend bij een onbevoegd regionaal tuchtcollege, verwijst de voorzitter van dat
      tuchtcollege de zaak onverwijld door naar een bevoegd regionaal tuchtcollege. De klager wordt gelijktijdig over de
      verwijzing geïnformeerd. De voorzitter kan een zaak tevens verwijzen naar een ander tuchtcollege wanneer tegen een
      beklaagde bij meerdere regionale tuchtcolleges zaken aanhangig zijn gemaakt. Bij verwijzing geldt als de datum van
      indiening van het klaagschrift de datum van de indiening bij het verwijzende college.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel54
  - number: 54a
    text: |-
      Indien een herindelingsregeling als bedoeld in
      [artikel 1, eerste lid, onderdeel f, van de Wet algemene regels herindeling][ref1] leidt tot een wijziging van het
      rechtsgebied van een regionaal tuchtcollege of indien het rechtsgebied van een regionaal tuchtcollege op basis van
      [artikel 53, tweede lid][ref2], wordt gewijzigd, heeft die wijziging geen gevolgen voor de bevoegdheid in zaken die
      op de datum van herindeling bij dat tuchtcollege aanhangig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel53
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel54a
    references:
      - id: ref1
        bwb_id: BWBR0003718
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '53'
        hoofdstuk: VII
        paragraaf: '3'
  - number: '55.1'
    text: |-
      Een regionaal tuchtcollege heeft rechtsgeleerde leden van wie één tevens voorzitter is, alsmede, voor elk van de
      in [artikel 47, tweede lid][ref1], of krachtens [artikel 36a, eerste lid][ref2], aangegeven categorieën van aan
      tuchtrechtspraak onderworpen personen, leden-beroepsgenoten. Van het college maken mede deel uit plaatsvervangende
      rechtsgeleerde leden, benevens voor elk van de in de eerste volzin bedoelde categorieën, plaatsvervangende leden-
      beroepsgenoten.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel36a
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '47'
        hoofdstuk: VII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: 36a
        hoofdstuk: IV
  - number: '55.2'
    text: |-
      Aan de behandeling van een zaak wordt deelgenomen door de voorzitter, een ander rechtsgeleerd lid en drie
      leden-beroepsgenoten, benoemd voor de categorie waartoe de beklaagde behoort, een en ander met de mogelijkheid
      van plaatsvervanging. In afwijking van het bepaalde in de eerste volzin kan de voorzitter bepalen dat aan de
      behandeling van een zaak die hem daartoe geschikt voorkomt, wordt deelgenomen door de voorzitter en door twee
      leden-beroepsgenoten, benoemd voor de categorie waartoe de beklaagde behoort, een en ander met de mogelijkheid
      van plaatsvervanging. Indien de zaak naar het oordeel van een van deze leden ongeschikt is voor behandeling
      overeenkomstig het bepaalde in de tweede volzin, wordt de behandeling voortgezet met toepassing van de eerste
      volzin.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel55
  - number: '55.3'
    text: |-
      De voorzitter en zijn plaatsvervanger of zijn plaatsvervangers worden bij koninklijk besluit op voordracht van Onze
      Minister voor de tijd van zes jaar benoemd en zijn herbenoembaar. Op hun verzoek wordt hun bij koninklijk besluit
      tussentijds ontslag verleend. Hun wordt in ieder geval ontslag verleend met het bereiken van de zeventigjarige
      leeftijd. [Artikel 46h, derde lid, van de Wet rechtspositie rechterlijke ambtenaren][ref1] is te hunnen aanzien van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46h
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 46h
  - number: '55.4'
    text: |-
      De overige leden en plaatsvervangende leden worden bij besluit van Onze Minister voor de tijd van zes
      jaar benoemd en zijn herbenoembaar. Op hun verzoek wordt hun door Onze Minister tussentijds ontslag
      verleend. Hun wordt in ieder geval ontslag verleend met het bereiken van de zeventigjarige leeftijd.
      [Artikel 5, eerste lid, van de Wet rechtspositie rechterlijke ambtenaren][ref1] is ten aanzien van de in de
      eerste volzin bedoelde personen, voor zover zij rechtsgeleerden zijn, van overeenkomstige toepassing. De leden-
      beroepsgenoten en de plaatsvervangende leden-beroepsgenoten worden benoemd uit personen die ingeschreven staan in
      het desbetreffende register. Voor de besluiten, als bedoeld in de eerste, tweede en derde zin, wordt geen mandaat
      verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel5
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '5'
  - number: '55.5'
    text: |-
      De leden van de tuchtcolleges blijven na het verstrijken van hun benoemingstermijn of na hun ontslag vanwege het
      bereiken van de zeventigjarige leeftijd, bevoegd om deel te nemen aan de verdere behandeling van en de beslissing
      over klachten, aan de behandeling waarvan zij voor het verstrijken van hun benoemingstermijn of hun ontslag reeds
      hebben deelgenomen.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel55
  - number: '55.6'
    text: |-
      Het college heeft één of meer secretarissen, allen rechtsgeleerden. Zij worden bij besluit van Onze Minister
      aangewezen. De aanwijzing eindigt met ingang van de datum dat de uitoefening van de functie van secretaris
      geen onderdeel meer uitmaakt van de werkzaamheden van de betreffende ambtenaar. Degenen die als secretaris
      zijn aangewezen bij een regionaal tuchtcollege zijn tevens aangewezen als secretaris bij de andere regionale
      tuchtcolleges.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel55
  - number: '55.7'
    text: |-
      De leden van een regionaal tuchtcollege zijn tevens plaatsvervangend lid van de overige regionale tuchtcolleges.
      Indien een voorzitter of plaatsvervangend voorzitter op grond van de eerste volzin plaatsvervangend rechtsgeleerd
      lid is bij de andere regionale tuchtcolleges, is hij bij die andere regionale tuchtcolleges tevens plaatsvervangend
      voorzitter.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel55
  - number: 55bis
    text: |-
      Een benoeming van een plaatsvervangend lid van een regionaal tuchtcollege vervalt wanneer dat plaatsvervangend
      lid als:
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel55bis
  - number: 55bis.a
    text: |-
      plaatsvervangend rechtsgeleerd lid is benoemd en wordt benoemd tot rechtsgeleerd lid bij een regionaal
      tuchtcollege;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel55bis
  - number: 55bis.b
    text: |-
      plaatsvervangend lid-beroepsgenoot is benoemd en voor hetzelfde beroep wordt benoemd als lid-beroepsgenoot bij een
      regionaal tuchtcollege.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel55bis
  - number: 55ter.1
    text: De regionale tuchtcolleges stellen een gemeenschappelijk reglement van orde vast.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel55ter
  - number: 55ter.2
    text: |-
      Onverminderd [artikel 54, vierde lid][ref1], bevat het reglement van orde in ieder geval regels over deelname van
      de leden aan de behandeling van een zaak.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel54
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel55ter
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '54'
        hoofdstuk: VII
        paragraaf: '3'
  - number: 55ter.3
    text: |-
      De vaststelling van het reglement van orde geschiedt door de voorzitters van de drie regionale tuchtcolleges
      gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel55ter
  - number: 55a.1
    text: |-
      Onze Minister draagt zorg voor de indienstneming van ambtenaren, die klagers kunnen adviseren bij het opstellen en
      wijzigen van hun klacht.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel55a
  - number: 55a.2
    text: Bij ministeriële regeling kunnen regels worden gesteld ter uitvoering van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel55a
  - number: '56.1'
    text: |-
      Het centrale tuchtcollege heeft rechtsgeleerde leden van wie één tevens voorzitter is, alsmede, voor elk van de
      in [artikel 47, tweede lid][ref1], of krachtens [artikel 36a, eerste lid][ref2], aangegeven categorieën van aan
      tuchtrechtspraak onderworpen personen, leden-beroepsgenoten. Van het college maken mede deel uit plaatsvervangende
      rechtsgeleerde leden, benevens voor elk van de in de eerste volzin bedoelde categorieën, plaatsvervangende leden-
      beroepsgenoten.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel36a
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '47'
        hoofdstuk: VII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: 36a
        hoofdstuk: IV
  - number: '56.2'
    text: |-
      Aan de behandeling van een zaak wordt deelgenomen door de voorzitter, door twee andere rechtsgeleerde leden en door
      twee leden-beroepsgenoten, benoemd voor de categorie waartoe de beklaagde behoort, een en ander met de mogelijkheid
      van plaatsvervanging.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel56
  - number: '56.3'
    text: |-
      Ten aanzien van de benoeming en het ontslag van de voorzitter en zijn plaatsvervanger of zijn plaatsvervangers
      en van de overige leden en plaatsvervangende leden is [artikel 55, derde, vierde lid en vijfde lid][ref1], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel55
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '55'
        hoofdstuk: VII
        paragraaf: '3'
  - number: '56.4'
    text: |-
      Indien de beklaagde in een zaak tevens lid-beroepsgenoot of plaatsvervangend lid-beroepsgenoot is van het centrale
      tuchtcollege wordt de zaak behandeld door leden die daartoe door de voorzitter zijn aangewezen. Bij die aanwijzing
      draagt de voorzitter er zorg voor dat een onafhankelijke behandeling is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel56
  - number: '56.5'
    text: |-
      De [artikelen 55, zesde lid, eerste en tweede volzin][ref1], en [55ter][ref2], zijn van overeenkomstige toepassing,
      met dien verstande dat het reglement van orde als bedoeld in artikel 55ter, eerste lid, voor het centrale
      tuchtcollege gezamenlijk wordt vastgesteld door de voorzitter en de plaatsvervangend voorzitters van dat college.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel55ter
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '55'
        hoofdstuk: VII
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: 55ter
        hoofdstuk: VII
        paragraaf: '3'
  - number: '57.1'
    text: |-
      De voorzitter van een tuchtcollege kan ten aanzien van twee of meer met elkaar samenhangende zaken bepalen dat zij
      door het college ter terechtzitting gezamenlijk worden behandeld.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel57
  - number: '57.2'
    text: |-
      Ingeval in deze zaken de beklaagden tot verschillende in [artikel 47, tweede lid][ref1], of krachtens
      [artikel 36a, eerste lid][ref2], aangegeven categorieën behoren, wordt aan het onderzoek ter terechtzitting door
      het ingevolge [artikel 55, tweede lid][ref3], onderscheidenlijk [artikel 56, tweede lid][ref4], vereiste aantal
      leden-beroepsgenoten of plaatsvervangende leden-beroepsgenoten van elk van de betrokken categorieën deelgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel36a
      [ref3]: https://wetten.overheid.nl/BWBR0006251#Artikel55
      [ref4]: https://wetten.overheid.nl/BWBR0006251#Artikel56
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '47'
        hoofdstuk: VII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: 36a
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0006251
        artikel: '55'
        hoofdstuk: VII
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0006251
        artikel: '56'
        hoofdstuk: VII
        paragraaf: '3'
  - number: '57.3'
    text: |-
      Ingeval is geklaagd over een arts ter zake van verrichtingen op het gebied van de uitoefening
      der artsenijbereidkunst, wordt in het tuchtcollege ten minste één der plaatsen, bij
      [artikel 55, tweede lid][ref1], onderscheidenlijk [artikel 56, tweede lid][ref2], toegewezen aan leden-
      beroepsgenoten, vervuld door een lid-beroepsgenoot of plaatsvervangend lid-beroepsgenoot, die op grond van
      [artikel 61, tiende of elfde lid, van de Geneesmiddelenwet][ref3] mede bevoegd is geneesmiddelen ter hand te
      stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel56
      [ref3]: https://wetten.overheid.nl/BWBR0021505#Artikel61
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '55'
        hoofdstuk: VII
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '56'
        hoofdstuk: VII
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0021505
        artikel: '61'
  - number: '59.1'
    text: |-
      De benoeming van een lid-beroepsgenoot of plaatsvervangend lid-beroepsgenoot van een regionaal tuchtcollege of van
      het centrale tuchtcollege eindigt:
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel59
  - number: 59.1.a
    text: indien zijn inschrijving in het register wordt doorgehaald;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel59
  - number: 59.1.b
    text: bij de schorsing van zijn bevoegdheid om de aan de inschrijving verbonden rechten uit te oefenen;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel59
  - number: 59.1.c
    text: |-
      bij een beslissing waarbij ten aanzien van hem een maatregel als bedoeld in
      [artikel 48, eerste lid, onder e of g, of tweede lid][ref1], is opgelegd onherroepelijk is geworden; of


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel48
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '48'
        hoofdstuk: VII
        paragraaf: '2'
  - number: 59.1.d
    text: |-
      indien het lid-beroepsgenoot of plaatsvervangend lid-beroepsgenoot op grond van de artikelen 5a, [7 onder e][ref1],
      of [7a][ref2] in de uitoefening van zijn beroep wordt beperkt.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel7a
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '7'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: 7a
        hoofdstuk: II
        paragraaf: '1'
  - number: '59.2'
    text: |-
      Een nog niet onherroepelijk geworden beslissing tot oplegging te zijnen aanzien van een van de in
      [artikel 48, eerste lid, onder e, f of g of tweede lid][ref1], bedoelde maatregelen heeft, indien zij is gegeven
      met toepassing van het aan het slot van de tweede volzin van het achtste of het in het negende lid van dat artikel
      bepaalde, voor een lid-beroepsgenoot of plaatsvervangend lid-beroepsgenoot van een regionaal tuchtcollege of van
      het centrale tuchtcollege tot gevolg dat hij in zijn functie bij dat college van rechtswege is geschorst.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel48
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '48'
        hoofdstuk: VII
        paragraaf: '2'
  - number: '59.3'
    text: |-
      Een nog niet onherroepelijk geworden beslissing tot oplegging te zijnen aanzien van een van de in
      [artikel 80, eerste lid][ref1], bedoelde maatregelen heeft, indien zij is gegeven met toepassing van het aan
      het slot van het derde lid of het in het vijfde lid van dat artikel bepaalde, voor een lid-beroepsgenoot of
      plaatsvervangend lid-beroepsgenoot van een regionaal tuchtcollege of van het centrale tuchtcollege tot gevolg dat
      hij in zijn functie bij dat college van rechtswege is geschorst.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel80
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '80'
        hoofdstuk: VIII
  - number: '60'
    text: |-
      Het in de [artikelen 46c, onderdelen b en c][ref1], [46ca, eerste lid, onderdeel d][ref2],
      [46d, tweede lid][ref3], [46f][ref4], [46i][ref5], met uitzondering van het eerste lid, onderdeel c,
      [46j][ref6], [46l, eerste lid, aanhef en onderdelen a en c, en derde lid][ref7], [46m][ref8], [46o][ref9]
      en [46p van de Wet rechtspositie rechterlijke ambtenaren][ref10] bepaalde is van overeenkomstige
      toepassing ten aanzien van de leden en de plaatsvervangende leden van de regionale tuchtcolleges en
      van het centrale tuchtcollege, met dien verstande dat de in het [vijfde lid van artikel 46p][ref11]
      bedoelde mededeling te hunnen aanzien eveneens wordt gedaan aan Onze Minister. De
      [artikelen 13a][ref12], [13b, uitgezonderd het eerste lid, onderdelen b en c, en vierde lid][ref13], en
      [13c tot en met 13g van de Wet op de rechterlijke organisatie][ref14] zijn van overeenkomstige toepassing ten
      aanzien van gedragingen van deze leden en plaatsvervangende leden, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46c
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel46ca
      [ref3]: https://wetten.overheid.nl/BWBR0008365#Artikel46d
      [ref4]: https://wetten.overheid.nl/BWBR0008365#Artikel46f
      [ref5]: https://wetten.overheid.nl/BWBR0008365#Artikel46i
      [ref6]: https://wetten.overheid.nl/BWBR0008365#Artikel46j
      [ref7]: https://wetten.overheid.nl/BWBR0008365#Artikel46l
      [ref8]: https://wetten.overheid.nl/BWBR0008365#Artikel46m
      [ref9]: https://wetten.overheid.nl/BWBR0008365#Artikel46o
      [ref10]: https://wetten.overheid.nl/BWBR0008365#Artikel46p
      [ref11]: https://wetten.overheid.nl/BWBR0008365#Artikel46p
      [ref12]: https://wetten.overheid.nl/BWBR0001830#Artikel13a
      [ref13]: https://wetten.overheid.nl/BWBR0001830#Artikel13b
      [ref14]: https://wetten.overheid.nl/BWBR0001830#Artikel13c
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel60
    references:
      - id: ref1
