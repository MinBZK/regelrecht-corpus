  - number: 60.a
    text: |-
      voor de overeenkomstige toepassing van die artikelen onder «het betrokken gerechtsbestuur» wordt verstaan: de
      voorzitter van het regionaal tuchtcollege onderscheidenlijk centrale tuchtcollege; en
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel60
  - number: 60.b
    text: |-
      de procureur-generaal niet verplicht is aan het verzoek, bedoeld in [artikel 13a][ref1], te voldoen, indien de
      verzoeker redelijkerwijs onvoldoende belang heeft bij een onderzoek als bedoeld in datzelfde artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel13a
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: 13a
  - number: '61'
    text: |-
      De leden, plaatsvervangende leden en secretarissen van de tuchtcolleges is het verboden zich over een zaak
      die bij hun college aanhangig is of naar zij weten of vermoeden zal worden, in te laten in enig onderhoud met
      belanghebbenden of van dezen enige bijzondere inlichting of schriftuur dienaangaande aan te nemen.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel61
  - number: '62.1'
    text: |-
      De leden en de plaatsvervangende leden van de tuchtcolleges ontvangen een vacatiegeld, alsmede vergoeding van reis-
      en verblijfkosten en van verdere verschotten, een en ander overeenkomstig door Onze Minister te stellen regels.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel62
  - number: '62.2'
    text: |-
      In de daarvoor in aanmerking komende gevallen kan bij koninklijk besluit, in afwijking van het
      eerste lid, aan de voorzitter, een ander lid of plaatsvervangend lid dat met toepassing van
      [artikel 66, eerste lid, tweede volzin][ref1], vooronderzoek verricht, of de secretaris van een tuchtcollege een
      salaris worden toegekend op een bij dat besluit te bepalen voet. In dat geval geniet de betrokkene bovendien een
      tijdelijke toelage voor kinderen, een vakantieuitkering, een ziektekostenvergoeding, een vergoeding van reis- en
      verblijfkosten, een vergoeding van verplaatsingskosten, alsmede een spaarpremie, overeenkomstig de bepalingen welke
      te dien aanzien voor de burgerlijke rijksambtenaren bij de ministeries zijn of zullen worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel66
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '66'
        hoofdstuk: VII
        paragraaf: '4'
  - number: 62a.1
    text: |-
      De leden, plaatsvervangende leden en de secretarissen van een tuchtcollege leggen voorafgaand aan de aanvang van
      hun werkzaamheden voor het college de eed of belofte af, volgens het formulier zoals dat is vastgesteld in de
      bijlage bij deze wet.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel62a
  - number: 62a.2
    text: |-
      De voorzitter legt de eed of de belofte af ten overstaan van een plaatsvervangend voorzitter. De overige in het
      eerste lid bedoelde personen leggen de eed of belofte af ten overstaan van de voorzitter of een plaatsvervangend
      voorzitter.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel62a
  - number: 62a.3
    text: Bij een herbenoeming worden de in het eerste lid bedoelde personen niet opnieuw beëdigd.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel62a
  - number: 62b
    text: |-
      De in [artikel 62a, eerste lid][ref1], bedoelde personen zijn verplicht tot geheimhouding van de gegevens waarover
      zij bij de uitvoering van hun taak de beschikking krijgen en waarvan zij het vertrouwelijke karakter kennen of
      redelijkerwijs moeten vermoeden, behoudens voor zover enig wettelijk voorschrift hen tot mededeling verplicht of
      uit hun taak de noodzaak tot mededeling voortvloeit.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel62a
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel62b
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: 62a
        hoofdstuk: VII
        paragraaf: '3'
  - number: '63'
    text: |-
      Een lid van een tuchtcollege, dat voor de behandeling van een zaak zitting heeft in dat
      college, kan zich verschonen en kan worden gewraakt, indien er te zijnen aanzien feiten of
      omstandigheden bestaan, waardoor de rechterlijke onpartijdigheid schade zou kunnen lijden. De
      [artikelen 512 tot en met 524 van het Wetboek van Strafvordering][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel512
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '512'
  - number: 63a
    text: |-
      In afwijking van [artikel 55][ref1] wordt aan de behandeling van een verzoek tot wraking of verschoning slechts
      deelgenomen door drie rechtsgeleerde leden, van wie één tevens voorzitter is.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel55
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel63a
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '55'
        hoofdstuk: VII
        paragraaf: '3'
  - number: '64.1'
    text: |-
      Het centrale tuchtcollege waakt tegen nodeloze vertraging in de behandeling van zaken door de regionale
      tuchtcolleges.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel64
  - number: '64.2'
    text: |-
      Het centrale tuchtcollege kan zich de stukken, betrekking hebbende op een bij een regionaal tuchtcollege aanhangige
      zaak, doen overleggen en een termijn stellen, waarbinnen het regionale tuchtcollege het vooronderzoek dan wel het
      onderzoek op de terechtzitting moet sluiten.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel64
  - number: '64.3'
    text: |-
      Indien het regionale tuchtcollege hieraan niet voldoet, kan het centrale tuchtcollege de behandeling van de zaak
      aan een ander regionaal tuchtcollege overdragen.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel64
  - number: '65.1'
    text: |-
      Een zaak wordt in eerste aanleg bij het bevoegde regionale tuchtcollege aanhangig gemaakt door indiening van een
      klaagschrift door:
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel65
  - number: 65.1.a
    text: een rechtstreeks belanghebbende;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel65
  - number: 65.1.b
    text: degene die aan de beklaagde een opdracht heeft verstrekt;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel65
  - number: 65.1.c
    text: |-
      degene bij wie of het bestuur van een instelling waarbij de beklaagde werkzaam of voor het verlenen van individuele
      gezondheidszorg ingeschreven is;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel65
  - number: 65.1.d
    text: de inspecteur.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel65
  - number: '65.2'
    text: De inhoud van het klaagschrift moet voldoen aan de daaromtrent bij algemene maatregel van bestuur te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel65
  - number: '65.3'
    text: |-
      De vooronderzoeker kan, indien de zaak hem daartoe geschikt voorkomt, bij het horen van de klager en de beklaagde,
      een minnelijke oplossing beproeven.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel65
  - number: '65.4'
    text: |-
      Indien een minnelijke oplossing mogelijk blijkt, wordt deze op schrift gesteld en door de klager en de beklaagde
      ondertekend. Met een aldus vastgestelde minnelijke oplossing geeft de klager te kennen zijn klacht in te trekken.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel65
  - number: '65.5'
    text: |-
      De bevoegdheid tot het indienen van een klaagschrift vervalt door verjaring in tien jaren. De termijn van verjaring
      vangt aan op de dag na die waarop het desbetreffende handelen of nalaten is geschied.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel65
  - number: '65.6'
    text: |-
      Indien naar zijn oordeel de behandeling van de zaak door het tuchtcollege geen uitstel gedoogt zonder groot nadeel
      voor het belang van de bescherming van de individuele gezondheidszorg, verzoekt de inspecteur het tuchtcollege de
      zaak met spoed te behandelen.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel65
  - number: '65.7'
    text: |-
      De inspecteur is verplicht ter zake van door hem ingediende klaagschriften aan de ambtenaren van het openbaar
      ministerie de door hen gevraagde inlichtingen te verstrekken. Hij kan de in de eerste volzin bedoelde ambtenaren
      ook uit eigen beweging ter zake inlichten.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel65
  - number: 65a.1
    text: De secretaris van het tuchtcollege heft van de indiener van het klaagschrift een griffierecht van € 50.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel65a
  - number: 65a.2
    text: |-
      Indien het een klaagschrift betreft tegen twee of meer beroepsbeoefenaren en dat ten aanzien van elke
      beroepsbeoefenaar betrekking heeft op hetzelfde feitencomplex of samenhangende feitencomplexen, is eenmaal
      griffierecht verschuldigd.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel65a
  - number: 65a.3
    text: |-
      De secretaris wijst de indiener van het klaagschrift op de verschuldigdheid van het griffierecht en deelt
      hem mee dat het verschuldigde bedrag binnen vier weken na de dag van verzending van zijn mededeling dient te
      zijn bijgeschreven op het daarbij aangegeven bankrekeningnummer. Indien het bedrag niet binnen deze termijn
      is bijgeschreven, verklaart de voorzitter de klager niet-ontvankelijk, tenzij redelijkerwijs niet kan worden
      geoordeeld dat de klager ten aanzien van de betaling in verzuim is geweest.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel65a
  - number: 65a.4
    text: |-
      In afwijking van het eerste lid wordt geen griffierecht geheven indien een klaagschrift wordt ingediend door de
      inspecteur.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel65a
  - number: 65a.5
    text: Indien de klacht geheel of gedeeltelijk gegrond wordt verklaard, wordt het griffierecht aan de klager terugbetaald.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel65a
  - number: 65a.6
    text: |-
      Onze Minister kan het in het eerste lid bedoelde bedrag wijzigen voor zover de consumentenprijsindex daartoe
      aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel65a
  - number: 65b.1
    text: |-
      De secretaris van het college zendt een afschrift van het klaagschrift aan de beklaagde zodra het griffierecht
      is betaald.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel65b
  - number: 65b.2
    text: |-
      De secretaris van een college zendt aan de inspecteur een periodiek geaggregeerd overzicht van de ingediende
      klaagschriften. Bij ministeriële regeling kunnen nadere regels worden gesteld over het geaggregeerd overzicht
      bedoeld in de eerste volzin.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel65b
  - number: 65c.1
    text: |-
      De klager kan zijn klacht tot uiterlijk twee weken voor de behandeling van de zaak op de terechtzitting
      schriftelijk wijzigen of aanvullen.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel65c
  - number: 65c.2
    text: |-
      De secretaris verstrekt de beklaagde een afschrift van de schriftelijke wijziging. De beklaagde wordt in de
      gelegenheid gesteld te worden gehoord over de wijziging, dan wel aanvulling van de klacht.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel65c
  - number: 65d.1
    text: |-
      De klager kan zijn klacht tot aan de uitspraak door het tuchtcollege intrekken. De secretaris bericht de beklaagde
      indien een klager zijn klacht heeft ingetrokken.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel65d
  - number: 65d.2
    text: 'Indien de klacht wordt ingetrokken, wordt de behandeling daarvan gestaakt, tenzij:'
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel65d
  - number: 65d.2.a
    text: de beklaagde schriftelijk verklaart voortzetting van de behandeling te verlangen;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel65d
  - number: 65d.2.b
    text: |-
      het tuchtcollege beslist dat de behandeling van de klacht om redenen, aan het algemeen belang ontleend, moet worden
      voortgezet.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel65d
  - number: 65d.3
    text: |-
      Indien om redenen van algemeen belang wordt beslist tot voortzetting van de klacht wordt de inspecteur voor het
      vervolg van de zaak als klager aangemerkt. De secretaris bericht de inspecteur over de voortzetting van de klacht.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel65d
  - number: 65d.4
    text: Indien de beklaagde overlijdt, wordt de behandeling van de klacht gestaakt.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel65d
  - number: 65d.5
    text: |-
      Indien de klager overlijdt, kan het tuchtcollege om redenen van algemeen belang beslissen dat de behandeling van de
      klacht wordt voortgezet. Het derde lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel65d
  - number: 65e
    text: |-
      De klager en de beklaagde kunnen zich laten vertegenwoordigen door een gemachtigde en zich laten bijstaan door
      een raadsman. De gemachtigde, niet zijnde een advocaat, legt desgevraagd ten bewijze van de machtiging een
      schriftelijke volmacht over. De voorzitter van het regionale tuchtcollege kan slechts weigeren een persoon, niet
      zijnde een advocaat, als gemachtigde of als raadsman toe te laten, indien er duidelijke aanwijzingen zijn dat door
      de toelating van die persoon een behoorlijke uitoefening van de tuchtrechtspraak zal worden belemmerd. De weigering
      wordt door de voorzitter schriftelijk gemotiveerd.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel65e
  - number: 65f
    text: |-
      Onze Minister kan ambtenaren van de Inspectie gezondheidszorg en jeugd aanwijzen aan wie dezelfde bevoegdheden
      toekomen als waarover de inspecteur, bedoeld in [artikel 65, eerste lid, onderdeel d][ref1], beschikt voor het
      voeren van een procedure bij een tuchtcollege in eerste aanleg als bedoeld in deze paragraaf of in beroep als
      bedoeld in [paragraaf 5][ref2] van dit hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0006251#HoofdstukVII
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel65f
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '65'
        hoofdstuk: VII
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0006251
        hoofdstuk: VII
        paragraaf: '5'
  - number: '66.1'
    text: |-
      Na verzending van het afschrift, bedoeld in [artikel 65b, eerste lid][ref1], gelast de voorzitter van het regionale
      tuchtcollege een vooronderzoek. De voorzitter draagt het vooronderzoek op aan een of meer leden, plaatsvervangende
      leden of de secretaris van het regionale tuchtcollege.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel65b
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: 65b
        hoofdstuk: VII
        paragraaf: '4'
  - number: '66.2'
    text: |-
      Het vooronderzoek kan zich mede uitstrekken tot andere dan in het klaagschrift vermelde feiten en omstandigheden.
      De vooronderzoeker stelt de klager en de beklaagde in de gelegenheid door hem te worden gehoord. Hij kan de
      betrokken inspecteur, alsmede getuigen en deskundigen horen; ten aanzien van de getuigen en deskundigen is
      [artikel 68][ref1] van overeenkomstige toepassing, met dien verstande dat de oproeping, het verzoek tot dagvaarding
      en het doen afleggen van de eed of belofte geschieden door de vooronderzoeker.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel68
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '68'
        hoofdstuk: VII
        paragraaf: '4'
  - number: '66.3'
    text: |-
      Bij de vervulling van de hem op grond van het eerste en het tweede lid toekomende taak is de vooronderzoeker
      bevoegd, vergezeld van de door hem aangewezen personen, elke plaats te betreden teneinde een onderzoek te
      verrichten waarvan het uitvoeren ter betrokken plaatse door hem noodzakelijk wordt geoordeeld. Ingeval tijdens
      zodanig onderzoek de orde wordt verstoord of hem tegenstand wordt geboden, kan de vooronderzoeker de hulp van
      de sterke arm inroepen. De voorzitter van het regionale tuchtcollege is bevoegd een machtiging als bedoeld in
      [artikel 2 van de Algemene wet op het binnentreden][ref1] te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0006763#Artikel2
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0006763
        artikel: '2'
  - number: '66.4'
    text: |-
      De vooronderzoeker kan de klager, de beklaagde en anderen verzoeken om binnen een door hem te bepalen termijn
      inlichtingen te geven en onder hen berustende stukken in te zenden. Indien de klager of de beklaagde niet voldoet
      aan het verzoek, kan het regionale tuchtcollege daaruit de gevolgtrekkingen maken die hem geraden voorkomen.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel66
  - number: '66.5'
    text: |-
      Tijdens de behandeling van een zaak op de terechtzitting kan het regionale tuchtcollege de vooronderzoeker
      opdragen alsnog een aanvullend onderzoek in te stellen. Het tweede en derde lid zijn te dezen van overeenkomstige
      toepassing. Het aanvullend onderzoek wordt gesloten door de zaak wederom naar een terechtzitting te verwijzen.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel66
  - number: '66.6'
    text: |-
      De vooronderzoeker, die tevens lid of plaatsvervangend lid is van het regionale tuchtcollege en die een
      vooronderzoek in een zaak heeft verricht, neemt, op straffe van nietigheid, geen deel aan de behandeling van die
      zaak op de terechtzitting.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel66
  - number: '67.1'
    text: |-
      De klager en de beklaagde worden in de gelegenheid gesteld de behandeling van de zaak op de terechtzitting bij te
      wonen en tijdens de behandeling te worden gehoord.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel67
  - number: '67.2'
    text: |-
      De klager en de beklaagde worden gedurende een termijn van tenminste zes dagen in de gelegenheid gesteld van de
      processtukken kennis te nemen. De laatste dag van de in de eerste volzin genoemde termijn ligt tenminste acht dagen
      vóór de aanvang van het onderzoek op de terechtzitting.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel67
  - number: '67.3'
    text: |-
      Indien dit noodzakelijk is in het belang van de bescherming van de persoonlijke levenssfeer van derden, bepaalt
      de voorzitter van het tuchtcollege dat het kennisnemen van bepaalde processtukken of gedeelten ervan niet wordt
      toegestaan aan de klager persoonlijk, maar uitsluitend aan een gemachtigde, die arts of advocaat is, dan wel van de
      voorzitter bijzondere toestemming heeft verkregen.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel67
  - number: 67a.1
    text: |-
      Tenzij reeds is bepaald dat de zaak ter terechtzitting zal worden behandeld, kan door de voorzitter dan wel door
      het regionale tuchtcollege in raadkamer een eindbeslissing worden gegeven, inhoudende dat:
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel67a
  - number: 67a.1.a
    text: het college kennelijk onbevoegd is;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel67a
  - number: 67a.1.b
    text: de klager kennelijk niet-ontvankelijk is;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel67a
  - number: 67a.1.c
    text: de klacht kennelijk ongegrond is; of
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel67a
  - number: 67a.1.d
    text: de klacht kennelijk van onvoldoende gewicht is.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel67a
  - number: 67a.2
    text: |-
      [Artikel 69, zesde lid][ref1], en [72, eerste lid][ref2], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel72
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel67a
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '69'
        hoofdstuk: VII
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '72'
        hoofdstuk: VII
        paragraaf: '4'
  - number: 67b.1
    text: |-
      De voorzitter van het tuchtcollege kan bepalen dat de beklaagde of de klager wordt opgeroepen om in persoon op
      de zitting te verschijnen teneinde hun standpunten toe te lichten of het college inlichtingen te verschaffen. Zij
      worden opgeroepen door de secretaris. De klager en de beklaagde zijn verplicht aan de oproeping gevolg te geven.
      Partijen worden hierop gewezen.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel67b
  - number: 67b.2
    text: |-
      Indien de beklaagde of de klager, hoewel behoorlijk opgeroepen niet op de zitting verschijnt, kan het college
      daaruit de gevolgtrekkingen maken die het geraden voorkomt.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel67b
  - number: '68.1'
    text: |-
      Het regionale tuchtcollege kan getuigen en deskundigen ter terechtzitting oproepen en horen. Ieder die als getuige
      of deskundige is opgeroepen, is verplicht aan de oproeping gevolg te geven.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel68
  - number: '68.2'
    text: |-
      De klager en de beklaagde kunnen getuigen en deskundigen ter terechtzitting uitnodigen of bij deurwaardersexploit
      oproepen; in geval van oproeping gelden voor hen dezelfde verplichtingen als voor getuigen en deskundigen,
      opgeroepen door het tuchtcollege.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel68
  - number: '68.3'
    text: |-
      Verschijnt een getuige of een deskundige op de oproeping niet, dan doet de officier van
      justitie op verzoek van het college hem dagvaarden, desverzocht met bevel tot medebrenging.
      [Artikel 6:1:5 van het Wetboek van Strafvordering][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel6
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '6'
  - number: '68.4'
    text: |-
      De voorzitter van het college doet de getuigen de eed of belofte afleggen dat zij de gehele waarheid en niets
      dan de waarheid zullen zeggen. De getuigen en deskundigen zijn verplicht op de gestelde vragen te antwoorden,
      onderscheidenlijk de van hen gevorderde diensten te verlenen. De deskundigen zijn gehouden hun taak onpartijdig en
      naar beste weten te verrichten.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel68
  - number: '68.5'
    text: |-
      Ten aanzien van de getuigen en deskundigen zijn de
      [artikelen 217 tot en met 219 van het Wetboek van Strafvordering][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel217
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '217'
  - number: '68.6'
    text: |-
      De getuigen en deskundigen, opgeroepen door het tuchtcollege, ontvangen, desverkiezende op vertoon van hun
      oproeping of dagvaarding, uit ’s Rijks kas schadeloosstelling, door de voorzitter van het college te begroten
      overeenkomstig het bij of krachtens de [Wet griffierechten burgerlijke zaken][ref1] bepaalde. De voorzitter begroot
      op overeenkomstige wijze de schadeloosstelling voor getuigen en deskundigen, opgeroepen of uitgenodigd ingevolge
      het tweede lid, welke ten laste komt van degene door wie zij zijn opgeroepen of uitgenodigd. Deurwaarders ontvangen
      voor de werkzaamheden verricht ingevolge het tweede lid, van hun opdrachtgever een vergoeding overeenkomstig de
      bepalingen van het tarief van justitiekosten en salarissen in burgerlijke zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0028899
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0028899
  - number: 68a.1
    text: |-
      Indien naar aanleiding van het vooronderzoek of de behandeling ter terechtzitting van een klacht als bedoeld
      in [artikel 47][ref1] een vermoeden is gerezen dat een beklaagde mogelijk ongeschikt is om zijn beroep uit te
      oefenen als bedoeld in [artikel 79][ref2], stelt de voorzitter de inspecteur daarvan op de hoogte. De voorzitter
      zendt de stukken waarop het vermoeden van de mogelijke ongeschiktheid van de beroepsbeoefenaar is gebaseerd aan
      de inspecteur.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel79
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel68a
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '47'
        hoofdstuk: VII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '79'
        hoofdstuk: VIII
  - number: 68a.2
    text: |-
      De voorzitter die een vermoeden als bedoeld in het eerste lid heeft geuit, neemt geen deel aan de behandeling van
      een zaak tegen die beroepsbeoefenaar, als bedoeld in [artikel 79][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel79
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel68a
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '79'
        hoofdstuk: VIII
  - number: '69.1'
    text: |-
      Binnen twee maanden na sluiting van het onderzoek op de terechtzitting wordt de eindbeslissing van het regionale
      tuchtcollege uitgesproken.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel69
  - number: '69.2'
    text: 'Een in het eerste lid bedoelde beslissing strekt tot:'
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel69
  - number: 69.2.a
    text: het niet-ontvankelijk verklaren van de klager,
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel69
  - number: 69.2.b
    text: het ongegrond verklaren van de klacht, of
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel69
  - number: 69.2.c
    text: het gegrond verklaren van de klacht.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel69
  - number: '69.3'
    text: |-
      Indien het regionale tuchtcollege de klacht gegrond verklaart, kan het tuchtcollege een maatregel als bedoeld in
      [artikel 48, eerste, tweede en vierde lid][ref1], opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel48
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '48'
        hoofdstuk: VII
        paragraaf: '2'
  - number: '69.4'
    text: |-
      Een maatregel als bedoeld in [artikel 48, eerste, tweede en vierde lid][ref1], wordt niet opgelegd indien dit
      door het regionale tuchtcollege raadzaam wordt geacht in verband met de geringe ernst van het handelen of nalaten,
      de omstandigheden waaronder het handelen of nalaten heeft plaatsgevonden, dan wel omstandigheden die zich nadien
      hebben voorgedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel48
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '48'
        hoofdstuk: VII
        paragraaf: '2'
  - number: '69.5'
    text: |-
      Indien het regionale tuchtcollege de klacht geheel of gedeeltelijk gegrond verklaart en een maatregel oplegt als
      bedoeld in het derde lid, kan het in zijn beslissing opnemen dat de kosten, of een deel daarvan, die de klager in
      verband met de behandeling van de klacht redelijkerwijs heeft moeten maken, door de beklaagde aan wie de maatregel
      wordt opgelegd aan de klager worden vergoed. Bij of krachtens algemene maatregel van bestuur kunnen nadere regels
      worden gesteld over welke kosten vergoed kunnen worden, wat de hoogte van de te vergoeden kosten is en over de
      tenuitvoerlegging van de beslissing van het regionale tuchtcollege.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel69
  - number: '69.6'
    text: De beslissing is met redenen omkleed en wordt op schrift gesteld.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel69
  - number: '70.1'
    text: |-
      Het regionale tuchtcollege behandelt de zaak in een openbare terechtzitting. Het college kan evenwel om gewichtige
      redenen bepalen dat de behandeling geheel of gedeeltelijk met gesloten deuren zal plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel70
  - number: '70.2'
    text: |-
      De eindbeslissing van het regionale tuchtcollege van een zaak die in een openbare terechtzitting is behandeld,
      wordt in het openbaar uitgesproken.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel70
  - number: '70.3'
    text: |-
      Bij de openbare uitspraak van een beslissing worden de naam, de voornamen, de hoedanigheid en de woonplaats van de
      bij de zaak betrokken patiënt, van de klager en van de getuigen weggelaten.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel70
  - number: '70.4'
    text: |-
      Tijd en plaats van een openbare terechtzitting of openbare uitspraak worden overeenkomstig bij algemene maatregel
      van bestuur te stellen regels bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel70
  - number: '71'
    text: |-
      Het regionale tuchtcollege kan om redenen, aan het algemeen belang ontleend, bepalen dat zijn eindbeslissing
      geheel of gedeeltelijk in de *Staatscourant* zal worden bekendgemaakt en aan door hem aangewezen tijdschriften
      of nieuwsbladen ter bekendmaking zal worden aangeboden, een en ander met weglating van de namen, voornamen en
      woonplaatsen van de in de beslissing genoemde personen alsmede van de daarin voorkomende andere gegevens die
      omtrent deze personen een aanwijzing bevatten.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel71
  - number: '72.1'
    text: |-
      Van de eindbeslissing van het regionale tuchtcollege wordt, binnen een week na de uitspraak daarvan, een afschrift
      gezonden aan:
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel72
  - number: 72.1.a
    text: de klager;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel72
  - number: 72.1.b
    text: de beklaagde;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel72
  - number: 72.1.c
    text: de inspecteur;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel72
  - number: 72.1.d
    text: de secretaris van het centrale tuchtcollege;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel72
  - number: 72.1.e
    text: Onze Minister van Defensie, ingeval de beslissing betrekking heeft op een persoon die militair is.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel72
  - number: '72.2'
    text: |-
      Van een eindbeslissing waarbij een der in [artikel 48, eerste lid, onder b tot en met g, tweede en vierde lid][ref1],
      omschreven maatregelen is opgelegd, wordt voorts binnen een week na de uitspraak daarvan een afschrift gezonden aan
      Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel48
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '48'
        hoofdstuk: VII
        paragraaf: '2'
  - number: '73.1'
    text: |-
      Tegen een eindbeslissing van het regionale tuchtcollege kan binnen zes weken na de dag van verzending van het
      afschrift van die beslissing bij het centrale tuchtcollege beroep worden ingesteld door:
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel73
  - number: 73.1.a
    text: |-
      de klager, voor zover zijn klacht ongegrond is verklaard, hij niet-ontvankelijk is verklaard, het college kennelijk
      onbevoegd is, of voor zover de klacht kennelijk van onvoldoende gewicht is;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel73
  - number: 73.1.b
    text: de beklaagde;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel73
  - number: 73.1.c
    text: de inspecteur.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel73
  - number: '73.2'
    text: |-
      Het beroep wordt schriftelijk ingesteld. De inhoud van het beroepschrift moet voldoen aan de daaromtrent bij
      algemene maatregel van bestuur te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel73
  - number: '73.3'
    text: |-
      Artikel 65a is van overeenkomstige toepassing, met dien verstande dat waar in dat artikel wordt gesproken over
      «klaagschrift» daar voor de toepassing van dat artikel «beroepschrift» moet worden gelezen.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel73
  - number: '73.4'
    text: |-
      De secretaris van het college zendt een afschrift van het beroepschrift aan de klager, de beklaagde en de
      inspecteur, voor zover het beroepschrift niet door hen is ingediend, zodra het griffierecht is betaald.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel73
  - number: '73.5'
    text: |-
      De personen, bedoeld in het vierde lid, kunnen binnen zes weken na de datum van verzending van een afschrift
      van het beroepschrift als bedoeld in het vierde lid, incidenteel beroep instellen. De voorschriften omtrent de
      procedure in beroep zijn van toepassing, tenzij in deze paragraaf anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel73
  - number: '73.6'
    text: |-
      De in het eerste lid, onder a tot en met c, bedoelde personen worden door de voorzitter van het centrale
      tuchtcollege in de gelegenheid gesteld om binnen vier weken na toezending van de gronden van het incidenteel beroep
      schriftelijk hun zienswijze met betrekking tot het incidenteel beroep kenbaar te maken.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel73
  - number: '73.7'
    text: |-
      Wanneer het beroepschrift na afloop van de termijn, bedoeld in het eerste lid, is ingediend, blijft niet-
      ontvankelijkverklaring op grond daarvan achterwege, indien de indiener aantoont dat hij het beroep heeft ingesteld
      zo spoedig als dit redelijkerwijs verlangd kon worden.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel73
  - number: '73.8'
    text: |-
      Het centrale tuchtcollege kan degene die beroep heeft ingesteld niet-ontvankelijk verklaren, het beroep verwerpen
      of het beroep gegrond verklaren.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel73
  - number: '73.9'
    text: |-
      Indien het centrale tuchtcollege het beroep gegrond verklaart dan wel bij de behandeling van het beroep op andere
      dan de in het beroepschrift aangevoerde gronden tot het oordeel komt dat de in eerste aanleg gegeven beslissing
      niet kan worden gehandhaafd, vernietigt het deze beslissing en doet de zaak alsdan zelf af.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel73
  - number: '73.10'
    text: |-
      Indien tegen de eindbeslissing van het regionale tuchtcollege door twee of meer personen beroep is ingesteld en
      tenminste twee van hen ontvankelijk zijn, worden deze beroepen gezamenlijk behandeld.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel73
  - number: '73.11'
    text: |-
      De [artikelen 65, zevende lid][ref1], en [65d][ref2], zijn van overeenkomstige toepassing, met dien verstande dat
      waar in dat artikel wordt gesproken over «klaagschrift» daar voor de toepassing van dat artikel «beroepschrift»
      moet worden gelezen.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel65d
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '65'
        hoofdstuk: VII
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: 65d
        hoofdstuk: VII
        paragraaf: '4'
  - number: 73a.1
    text: |-
      De voorzitter van het centrale tuchtcollege kan kennelijk niet-ontvankelijke en kennelijk ongegronde beroepen,
      alsmede beroepen die naar zijn oordeel niet zullen leiden tot een andere beslissing dan die van het regionale
      tuchtcollege, binnen zes weken nadat zij zijn ingesteld, bij met redenen omklede beslissing afwijzen.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel73a
  - number: 73a.2
    text: |-
      [Artikel 69, zesde lid][ref1], en [72, eerste lid][ref2], zijn van overeenkomstige toepassing


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel72
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel73a
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '69'
        hoofdstuk: VII
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '72'
        hoofdstuk: VII
        paragraaf: '4'
  - number: 73b.1
    text: |-
      Tegen een beslissing als bedoeld in [artikel 73a, eerste lid][ref1], kunnen de klager en de beklaagde binnen
      veertien dagen na de verzending van het afschrift van de beslissing, schriftelijk verzet doen bij het centrale
      tuchtcollege.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel73a
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel73b
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: 73a
        hoofdstuk: VII
        paragraaf: '5'
  - number: 73b.2
    text: |-
      Alvorens te beslissen op het verzet, stelt het centrale tuchtcollege klager en beklaagde in de gelegenheid te
      worden gehoord.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel73b
  - number: 73b.3
    text: |-
      Het verzet wordt behandeld in een samenstelling van het centrale tuchtcollege waarvan degene die de in
      [artikel 73a bedoelde][ref1] beslissing heeft genomen geen deel uitmaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel73a
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel73b
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: 73a
        hoofdstuk: VII
        paragraaf: '5'
  - number: 73b.4
    text: 'De beslissing op verzet is met redenen omkleed en strekt tot:'
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel73b
  - number: 73b.4.a
    text: niet-ontvankelijkverklaring van het verzet;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel73b
  - number: 73b.4.b
    text: ongegrondverklaring van het verzet; of
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel73b
  - number: 73b.4.c
    text: gegrondverklaring van het verzet.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel73b
  - number: 73b.5
    text: |-
      Indien het centrale tuchtcollege het verzet niet-ontvankelijk of ongegrond verklaart, blijft de beslissing
      waartegen verzet was gedaan in stand.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel73b
  - number: 73b.6
    text: |-
      Indien het verzet gegrond wordt verklaard, vervalt de beslissing waartegen verzet was gedaan en wordt de
      behandeling van de zaak voortgezet.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel73b
  - number: 73b.7
    text: |-
      Tegen de beslissing op verzet staat geen rechtsmiddel open. Van de beslissing zendt de voorzitter onverwijld een
      afschrift aan de [artikel 72][ref1] genoemde personen.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel72
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel73b
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '72'
        hoofdstuk: VII
        paragraaf: '4'
  - number: 73b.8
    text: |-
      In afwijking van het zesde lid kan het centrale tuchtcollege zonder behandeling ter terechtzitting uitspraak
      doen op de klacht, indien het verzet gegrond is en nader onderzoek of nadere behandeling redelijkerwijs niet kan
      bijdragen aan de beoordeling van de klacht.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel73b
  - number: '74.1'
    text: |-
      Indien een beroepschrift afkomstig is van een persoon die niet bevoegd is tot het instellen van beroep, niet
      tijdig is ingediend of niet voldoet aan de krachtens [artikel 73, tweede lid][ref1], gestelde eisen, kan het
      centrale tuchtcollege op voorstel van de voorzitter zonder verder onderzoek, in raadkamer, een beslissing geven,
      welke strekt tot het niet-ontvankelijk verklaren van degene die het beroep heeft ingesteld. De beslissing is
      met redenen omkleed en wordt op schrift gesteld. In andere dan in de eerste volzin bedoelde gevallen kan de
      voorzitter, alvorens de zaak naar een terechtzitting te verwijzen, een vooronderzoek op de voet van het in
      [artikel 66, tweede en derde lid][ref2], bepaalde gelasten.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel73
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel66
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '73'
        hoofdstuk: VII
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '66'
        hoofdstuk: VII
        paragraaf: '4'
  - number: '74.2'
    text: |-
      Op de behandeling in beroep zijn de [artikelen 66, vijfde en zesde lid][ref1], [67][ref2], [67b][ref3], [68][ref4],
      [68a][ref5], en [69 tot en met 72][ref6] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel67
      [ref3]: https://wetten.overheid.nl/BWBR0006251#Artikel67b
      [ref4]: https://wetten.overheid.nl/BWBR0006251#Artikel68
      [ref5]: https://wetten.overheid.nl/BWBR0006251#Artikel68a
      [ref6]: https://wetten.overheid.nl/BWBR0006251#Artikel69
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '66'
        hoofdstuk: VII
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '67'
        hoofdstuk: VII
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0006251
        artikel: 67b
        hoofdstuk: VII
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0006251
        artikel: '68'
        hoofdstuk: VII
        paragraaf: '4'
      - id: ref5
        bwb_id: BWBR0006251
        artikel: 68a
        hoofdstuk: VII
        paragraaf: '4'
      - id: ref6
        bwb_id: BWBR0006251
        artikel: '69'
        hoofdstuk: VII
        paragraaf: '4'
  - number: '74.3'
    text: |-
      Het centrale tuchtcollege kan het regionale tuchtcollege dat de beslissing waartegen beroep is ingesteld, heeft
      gegeven, uitnodigen inlichtingen te verstrekken.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel74
  - number: '74.4'
    text: |-
      Het centrale tuchtcollege kan mede oordelen over onderdelen van de beslissing van het regionale tuchtcollege,
      waartegen in het beroepschrift geen bezwaren zijn aangevoerd.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel74
  - number: '74.5'
    text: |-
      Indien alleen de beklaagde beroep heeft ingesteld, kan het centrale tuchtcollege slechts met eenparigheid van
      stemmen een beslissing geven die een wijziging te zijnen nadele brengt in hetgeen door het regionale tuchtcollege
      was beslist.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel74
  - number: '74.6'
    text: |-
      De eindbeslissing van het centrale tuchtcollege van een zaak die in een openbare terechtzitting is behandeld, wordt
      in het openbaar uitgesproken.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel74
  - number: '74.7'
    text: |-
      Een afschrift van de beslissing van het centrale tuchtcollege wordt mede toegezonden aan het regionale tuchtcollege
      dat in eerste aanleg besliste.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel74
  - number: '75'
    text: |-
      Tegen een beslissing van het centrale tuchtcollege staat geen andere voorziening open dan cassatie in het belang
      der wet.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel75
  - number: '76.1'
    text: |-
      De secretaris van het centrale tuchtcollege bewaart en registreert de hem overeenkomstig
      [artikel 72, eerste lid][ref1], toegezonden beslissingen.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel72
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '72'
        hoofdstuk: VII
        paragraaf: '4'
  - number: '76.2'
    text: |-
      De secretaris van het centrale tuchtcollege verstrekt desgevraagd aan de tuchtcolleges, de leden van de
      rechterlijke macht en de ambtenaren van het openbaar ministerie inlichtingen omtrent onherroepelijke beslissingen.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel76
  - number: '76.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen omtrent het in het eerste en het tweede lid bepaalde nadere regels worden
      gesteld. Daarbij kunnen de in het eerste lid gestelde verplichtingen, voor zover zulks uit het oogpunt van een
      goede rechtsbedeling toelaatbaar is, worden beperkt.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel76
  - number: '77'
    text: |-
      De secretarissen van de tuchtcolleges kunnen aan degene die daarom verzoekt, tegen betaling der kosten, afschriften
      van onherroepelijke beslissingen van de tuchtcolleges verstrekken. Zodanige afschriften worden niet dan na
      machtiging van de voorzitter van het college dat de desbetreffende beslissing heeft gegeven, verstrekt. Een
      verzoek daartoe wordt alleen toegestaan ingeval de verzoeker heeft aangetoond dat hij daarbij belang heeft. In de
      afschriften worden de in de desbetreffende beslissingen vermelde namen, voornamen en woonplaatsen van de klagers,
      de beklaagden, de getuigen en de deskundigen weggelaten.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel77
  - number: '78'
    text: |-
      De tuchtcolleges brengen jaarlijks vóór 1 april verslag uit omtrent hun werkzaamheden in het afgelopen
      kalenderjaar. Dit verslag wordt, tegen betaling der kosten, algemeen verkrijgbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel78
  - number: '79.1'
    text: |-
      Het regionale tuchtcollege is bevoegd op schriftelijke voordracht van een inspecteur een voorziening te
      treffen, ertoe strekkende een beroepsbeoefenaar die in een der in het [artikel 47, tweede lid][ref1] vermelde
      hoedanigheden in een register ingeschreven staat, uit dat register te doen verwijderen dan wel diens uitoefening
      van het betrokken beroep met bijzondere waarborgen te omkleden indien de beroepsbeoefenaar moet worden geacht de
      geschiktheid tot het uitoefenen dan wel tot het zonder zodanige waarborgen uitoefenen van dat beroep te missen,
      wegens:


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel47
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '47'
        hoofdstuk: VII
        paragraaf: '1'
  - number: 79.1.1°
    text: zijn geestelijke of lichamelijke gesteldheid; of
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel79
  - number: 79.1.2°
    text: |-
      zijn gewoonte van drankmisbruik of van misbruik van middelen, bedoeld in de [artikelen 2][ref1] en
      [3 van de Opiumwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001941#Artikel3
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001941
        artikel: '3'
  - number: '79.2'
    text: |-
      Overeenkomstig het eerste lid is het regionale tuchtcollege tevens bevoegd op schriftelijke voordracht van een
      inspecteur een voorziening te treffen, ten aanzien van een beroepsbeoefenaar die ten hoogste een jaar voordat de
      voordracht wordt ingediend in een register heeft ingeschreven gestaan. De voordracht wordt in dat geval geacht te
      strekken tot ontzegging tot het recht op wederinschrijving.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel79
  - number: '79.3'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat de inspecteur in bij de maatregel omschreven gevallen tot
      het doen van een voordracht niet mag overgaan dan na overleg met een of meer andere inspecteurs.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel79
  - number: '79.4'
    text: |-
      Onze Minister kan ambtenaren van de Inspectie gezondheidszorg en jeugd aanwijzen aan wie dezelfde bevoegdheden
      toekomen als waarover de inspecteur, bedoeld in het eerste lid, beschikt voor het voeren van een procedure als
      bedoeld in dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel79
  - number: 79a.1
    text: |-
      Bevoegd tot het behandelen van een voordracht in eerste aanleg is het regionale tuchtcollege van het rechtsgebied
      waarin de beroepsbeoefenaar zijn woonplaats heeft.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel79a
  - number: 79a.2
    text: |-
      Indien de beroepsbeoefenaar geen woonplaats heeft in een rechtsgebied van een van de regionale tuchtcolleges, is
      het regionale tuchtcollege te Amsterdam bevoegd tot het behandelen van de voordracht.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel79a
  - number: 79a.3
    text: |-
      Indien een voordracht als bedoeld in [artikel 79, eerste lid][ref1], wordt gedaan tegen een lid-beroepsgenoot
      of plaatsvervangend lid-beroepsgenoot dat tevens lid is van het regionale tuchtcollege waar de voordracht wordt
      gedaan, kan de voorzitter in het belang van een onafhankelijke behandeling, de zaak ter behandeling verwijzen
      naar een ander regionaal tuchtcollege. De zaak wordt in het behandelend regionale tuchtcollege behandeld door
      leden die daartoe door de voorzitter zijn aangewezen. Bij die aanwijzing draagt de voorzitter er zorg voor dat een
      onafhankelijke behandeling is gewaarborgd.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel79
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel79a
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '79'
        hoofdstuk: VIII
  - number: '80.1'
    text: |-
      Een voorziening, bedoeld in [artikel 79, eerste lid][ref1], kan bestaan in het opleggen van een der volgende
      maatregelen ten aanzien van de betrokkene:


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel79
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '79'
        hoofdstuk: VIII
  - number: 80.1.a
    text: |-
      binding aan bijzondere voorwaarden om het beroep uit te oefenen waarvoor de beroepsbeoefenaar in het register is
      ingeschreven;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel80
  - number: 80.1.b
    text: |-
      gedeeltelijke ontzegging van de bevoegdheid in het register ingeschreven staande het betrokken beroep uit te
      oefenen;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel80
  - number: 80.1.c
    text: doorhaling van de inschrijving in het register.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel80
  - number: '80.2'
    text: De maatregelen, bedoeld in het eerste lid, onder *a* en *b*, kunnen ook gezamenlijk worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel80
  - number: '80.3'
    text: |-
      Een maatregel, bedoeld in het eerste lid, onder *a* of *b*, wordt eerst van kracht bij het onherroepelijk worden
      van de beslissing waarbij hij is opgelegd, tenzij het regionale tuchtcollege, indien het belang van de bescherming
      van de individuele gezondheidszorg zulks vordert, bij zijn beslissing heeft bepaald dat hij onmiddellijk van kracht
      wordt.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel80
  - number: '80.4'
    text: |-
      De maatregel van doorhaling van de inschrijving in het register wordt vanwege Onze Minister ten uitvoer gelegd
      zodra de beslissing waarbij hij is opgelegd, onherroepelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel80
  - number: '80.5'
    text: |-
      Bij het opleggen van de maatregel van doorhaling van de inschrijving kan het regionale tuchtcollege tevens, indien
      het belang van de individuele gezondheidszorg zulks vordert, bij wijze van voorlopige voorziening, een maatregel
      als bedoeld in [artikel 48, eerste lid, onder d of e][ref1], opleggen. Deze voorziening wordt terstond van kracht
      en wordt vanwege Onze Minister onverwijld ten uitvoer gelegd; de voorlopige voorziening blijft in afwijking
      van artikel 48, eerste lid, onderdeel d, van kracht totdat de beslissing tot doorhaling van de inschrijving
      onherroepelijk is geworden dan wel in beroep is vernietigd. Artikel 48, tiende lid, is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel48
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '48'
        hoofdstuk: VII
        paragraaf: '2'
  - number: '80.6'
    text: |-
      Indien toepassing is gegeven aan [artikel 79, tweede lid][ref1], kan de voorziening worden opgelegd tot ontzegging
      van het recht op wederinschrijving.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel79
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '79'
        hoofdstuk: VIII
  - number: '81.1'
    text: |-
      Ingeval de omstandigheden op grond waarvan een maatregel, bedoeld in
      [artikel 80, eerste lid, onder a, b of c][ref1], was opgelegd, hebben opgehouden te bestaan, kan bij koninklijk
      besluit worden bepaald dat de voorwaarden die de betrokkene bij die maatregel werden gesteld, komen te vervallen,
      dat hij in de hem ontzegde bevoegdheid wordt hersteld, onderscheidenlijk dat hij, tenzij een buiten de opgelegde
      maatregel staande weigeringsgrond aanwezig blijkt, wederom in het register zal kunnen worden ingeschreven. In
      laatstbedoeld geval kan bij dat besluit worden bepaald dat het recht wederom in het register te worden ingeschreven
      eerst zal ingaan zodra de betrokkene aan vooraf te vervullen bijzondere voorwaarden, in dat besluit omschreven, zal
      hebben voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel80
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '80'
        hoofdstuk: VIII
  - number: '81.2'
    text: |-
      De voordracht tot een besluit krachtens het eerste lid wordt gedaan door Onze Minister. Alvorens zodanige
      voordracht wordt gedaan, wint Onze Minister het advies in bij het regionale tuchtcollege dat de maatregel heeft
      opgelegd.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel81
  - number: '82'
    text: |-
      Aan de behandeling van een zaak wordt deelgenomen door de voorzitter, een ander rechtsgeleerd lid en drie leden-
      beroepsgenoten die behoren tot de categorie arts of gezondheidszorgpsycholoog, een en ander met de mogelijkheid
      van plaatsvervanging.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel82
  - number: '83.1'
    text: |-
      Een voordracht als bedoeld in [artikel 79, tweede lid][ref1], dient een omschrijving van de ter zake dienende
      feiten en omstandigheden te bevatten en te vermelden welke der in [artikel 80, eerste lid][ref2], bedoelde
      maatregelen worden voorgesteld en, zo het een maatregel als in dat lid, onder a en b, omschreven betreft, de inhoud
      daarvan. [Artikel 65, zesde lid][ref3], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel79
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel80
      [ref3]: https://wetten.overheid.nl/BWBR0006251#Artikel65
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '79'
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '80'
        hoofdstuk: VIII
      - id: ref3
        bwb_id: BWBR0006251
        artikel: '65'
        hoofdstuk: VII
        paragraaf: '4'
  - number: '83.2'
    text: |-
      Van een voordracht als bedoeld in het eerste lid zendt de secretaris van het regionale tuchtcollege een afschrift
      aan degene op wie de voordracht betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel83
  - number: '83.3'
    text: |-
      De voorzitter van het regionale tuchtcollege kan besluiten dat een zaak om een voorziening te treffen, bedoeld
      in [artikel 79, eerste lid][ref1], gevoegd wordt behandeld met een zaak, bedoeld in [artikel 47][ref2], indien de
      voordracht en het klaagschrift betrekking hebben op dezelfde beroepsbeoefenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel79
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel47
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '79'
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '47'
        hoofdstuk: VII
        paragraaf: '1'
  - number: '83.4'
    text: |-
      Bij de gevoegde behandeling van een zaak als bedoeld in het derde lid, is het college voor de behandeling van een
      zaak bedoeld in [artikel 79, eerste lid][ref1], samengesteld uit de voorzitter, een gemeenschappelijk rechtsgeleerd
      lid en drie leden-beroepsgenoten die behoren tot de categorie arts of de categorie gezondheidszorgpsycholoog
      en voor de behandeling van een zaak, bedoeld in [artikel 47][ref2], uit de voorzitter, het gemeenschappelijk
      rechtsgeleerde lid en drie leden-beroepsgenoten, benoemd voor de categorie waartoe de beklaagde behoort, een en
      ander met de mogelijkheid van plaatsvervanging.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel79
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel47
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '79'
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '47'
        hoofdstuk: VII
        paragraaf: '1'
  - number: '83.5'
    text: |-
      De inspecteur en degene op wie de voordracht betrekking heeft, kunnen zich doen vertegenwoordigen door een
      gemachtigde en zich doen bijstaan door een raadsman. De gemachtigde moet, desgevraagd, zijn bevoegdheid aantonen
      door het overleggen van een schriftelijke volmacht. Advocaten, als gemachtigden optredende, zijn tot deze
      overlegging niet gehouden. De voorzitter van het regionale tuchtcollege kan slechts weigeren een persoon die
      geen advocaat is als gemachtigde of als raadsman toe te laten, indien er duidelijke aanwijzingen zijn dat door de
      toelating van die persoon een behoorlijke uitoefening van de rechtspraak zal worden belemmerd. De weigering wordt
      door de voorzitter schriftelijk gemotiveerd.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel83
  - number: '83.6'
    text: |-
      Na verzending van het afschrift, bedoeld in het tweede lid, gelast de voorzitter een vooronderzoek, dat zich
      mede kan uitstrekken tot andere dan in de voordracht vermelde feiten en omstandigheden. De voorzitter draagt
      het vooronderzoek op aan een of meer leden of plaatsvervangende leden of aan de secretaris van het regionale
      tuchtcollege. Degene die het vooronderzoek verricht stelt degene op wie de voordracht betrekking heeft, en de
      inspecteur die de voordracht heeft gedaan, in de gelegenheid door hem te worden gehoord. Hij kan voorts getuigen
      en deskundigen horen; ten aanzien van de getuigen en deskundigen is [artikel 68][ref1] van overeenkomstige
      toepassing, met dien verstande dat de oproeping, het verzoek tot dagvaarding en het doen afleggen van de eed
      of belofte geschieden door degene die het vooronderzoek verricht. Van de uitkomsten van het vooronderzoek
      wordt aan de inspecteur mededeling gedaan voordat de zaak ter rechtszitting in behandeling wordt genomen.
      [Artikel 66, derde en zesde lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel66
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '68'
        hoofdstuk: VII
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '66'
        hoofdstuk: VII
        paragraaf: '4'
  - number: '83.7'
    text: Het vooronderzoek wordt gesloten met verwijzing naar een rechtszitting.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel83
  - number: '83.8'
    text: |-
      Degene op wie de voordracht betrekking heeft, en de inspecteur die de voordracht heeft gedaan, worden in de
      gelegenheid gesteld de behandeling van de zaak ter rechtszitting bij te wonen en tijdens de behandeling te worden
      gehoord. Zij worden gedurende een termijn van tenminste zes dagen in de gelegenheid gesteld van de processtukken
      kennis te nemen. De laatste dag van deze termijn ligt tenminste acht dagen vóór de aanvang van het onderzoek ter
      rechtszitting.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel83
  - number: '83.9'
    text: |-
      Ten aanzien van de getuigen en deskundigen is [artikel 68][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel68
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '68'
        hoofdstuk: VII
        paragraaf: '4'
  - number: '83.10'
    text: |-
      Tijdens de behandeling van een zaak ter rechtszitting kan het regionale tuchtcollege een of meer leden,
      plaatsvervangende leden of de secretaris opdragen alsnog een aanvullend vooronderzoek in te stellen. Het vierde lid
      is te dezen van overeenkomstige toepassing. Het aanvullende vooronderzoek wordt gesloten door de zaak wederom naar
      een rechtszitting te verwijzen.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel83
  - number: '83.11'
    text: |-
      Het regionale tuchtcollege kan, indien het termen daartoe aanwezig acht, de betrokkene schriftelijk aanzeggen dat
      het belang van de zaak vordert dat hij zijn medewerking verleent aan een te zijnen aanzien door of vanwege een of
      meer artsen of gezondheidszorgpsychologen, door het regionale tuchtcollege hiertoe als deskundigen aangewezen, uit
      te voeren geneeskundig onderzoek. De kosten van het onderzoek komen ten laste van de Staat. Indien de betrokkene
      de van hem verlangde medewerking geheel of gedeeltelijk onthoudt, kan het regionale tuchtcollege bij zijn op de
      voordracht te geven beslissing deze omstandigheid in zijn overwegingen betrekken.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel83
  - number: '83.12'
    text: |-
      Zolang het regionale tuchtcollege zijn onderzoek van de zaak ter rechtszitting niet heeft beëindigd, kan de
      inspecteur de door hem gedane voordracht intrekken, in welk geval de behandeling van de zaak wordt gestaakt,
      tenzij degene op wie de voordracht betrekking heeft schriftelijk heeft verklaard voortzetting van de behandeling
      te verlangen. Evenzo kan de inspecteur zijn voordracht zo nodig nog wijzigen of aanvullen. In zodanig geval wordt
      aan degene op wie de voordracht betrekking heeft, een afschrift van de aldus herziene voordracht verstrekt en
      wordt deze in de gelegenheid gesteld alsnog te worden gehoord. Indien degene op wie de voordracht betrekking heeft,
      overlijdt, wordt de behandeling van de zaak gestaakt.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel83
  - number: '83.13'
    text: |-
      Binnen twee maanden na sluiting van het onderzoek ter rechtszitting wordt de eindbeslissing van het
      regionale tuchtcollege uitgesproken. De eindbeslissing strekt hetzij tot het opleggen van een der in
      [artikel 80, eerste lid][ref1], omschreven maatregelen, hetzij tot het afwijzen van de voordracht. Zij is
      met redenen omkleed en wordt op schrift gesteld. Bij de keuze van de op te leggen maatregel kan het regionale
      tuchtcollege afwijken van hetgeen in de voordracht werd voorgesteld, met dien verstande dat de in artikel 80,
      eerste lid, onder c, omschreven maatregel niet dan in overeenstemming met de voordracht kan worden opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel80
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '80'
        hoofdstuk: VIII
  - number: '83.14'
    text: |-
      Ten aanzien van de behandeling van de zaak ter rechtszitting en het uitspreken van de beslissing is
      [artikel 70, eerste, derde en vierde lid][ref1], van overeenkomstige toepassing. Een beslissing, strekkende tot het
      opleggen van een der in [artikel 80, eerste lid][ref2], omschreven maatregelen, wordt in het openbaar uitgesproken.
      Ten aanzien van een beslissing, strekkende tot het afwijzen van de voordracht, kan het regionale tuchtcollege
      om redenen, aan het algemeen belang ontleend, bepalen dat zij in het openbaar wordt uitgesproken, met dien
      verstande dat zodanige beslissing in elk geval in het openbaar wordt uitgesproken indien de zaak in een openbare
      rechtszitting is behandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel70
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel80
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '70'
        hoofdstuk: VII
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '80'
        hoofdstuk: VIII
  - number: '83.15'
    text: |-
      Van de eindbeslissing van het regionale tuchtcollege wordt binnen een week na de uitspraak daarvan, een afschrift
      gezonden aan:
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel83
  - number: 83.15.a
    text: degene op wie de voordracht betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel83
  - number: 83.15.b
    text: de inspecteur die de voordracht heeft gedaan;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel83
  - number: 83.15.c
    text: |-
      de inspecteurs van de Inspectie gezondheidszorg en jeugd, die daartoe bij algemene maatregel van bestuur zijn
      aangewezen;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel83
  - number: 83.15.d
    text: de secretaris van het centrale tuchtcollege;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel83
  - number: 83.15.e
    text: |-
      Onze Minister, ingeval de beslissing strekt tot het opleggen van een der in [artikel 80, eerste lid][ref1],
      omschreven maatregelen;


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel80
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '80'
        hoofdstuk: VIII
  - number: 83.15.f
    text: Onze Minister van Defensie, ingeval de beslissing betrekking heeft op een persoon die militair is.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel83
  - number: '84.1'
    text: |-
      Tegen een eindbeslissing van het regionale tuchtcollege kan degene op wie de voordracht betrekking heeft, alsmede
      de betrokken inspecteur, binnen zes weken na de dag van verzending van het afschrift van die beslissing bij het
      centrale tuchtcollege beroep instellen.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel84
  - number: '84.2'
    text: |-
      Ten aanzien van de samenstelling van het centrale tuchtcollege bij de behandeling van zodanig beroep is
      [artikel 56, tweede lid][ref1], van overeenkomstige toepassing, met dien verstande dat de in die bepaling aan
      leden-beroepsgenoten toegewezen plaatsen in alle gevallen worden ingenomen door leden of plaatsvervangende leden
      van het college, benoemd uit de personen die in het desbetreffende register als arts of gezondheidszorgpsycholoog
      ingeschreven staan.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel56
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '56'
        hoofdstuk: VII
        paragraaf: '3'
  - number: '84.3'
    text: |-
      De [artikelen 73, tweede tot en met tiende lid][ref1], en [83, vijfde en twaalfde lid][ref2], zijn van
      overeenkomstige toepassing. In geval van intrekking van een ingesteld beroep door degene op wie de voordracht
      betrekking heeft, wordt de behandeling in beroep gestaakt, tenzij het college zijn onderzoek van de zaak ter
      rechtszitting reeds heeft beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel73
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel83
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '73'
        hoofdstuk: VII
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '83'
        hoofdstuk: VIII
  - number: '84.4'
    text: |-
      Indien een beroepschrift afkomstig is van een persoon die niet bevoegd is tot het instellen van beroep,
      niet tijdig is ingediend of niet voldoet aan de krachtens het derde lid met overeenkomstige toepassing van
      [artikel 73, tweede lid][ref1], gestelde eisen, kan het centrale tuchtcollege op voorstel van degene die het
      vooronderzoek heeft verricht zonder verder onderzoek, in raadkamer, een beslissing geven, welke strekt tot het
      niet-ontvankelijk verklaren van degene die het beroep heeft ingesteld. De beslissing is met redenen omkleed en
      wordt op schrift gesteld. In andere dan in de eerste volzin bedoelde gevallen kan de voorzitter, alvorens de zaak
      naar een rechtszitting te verwijzen, een vooronderzoek op de voet van [artikel 83, zesde en zevende lid][ref2],
      gelasten.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel73
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel83
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '73'
        hoofdstuk: VII
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '83'
        hoofdstuk: VIII
  - number: '84.5'
    text: |-
      Op de behandeling in beroep en de uitspraak van de eindbeslissing
      zijn de [artikelen 74, derde tot en met vijfde lid][ref1], en
      [83, achtste tot en met elfde lid, dertiende lid, met uitzondering van de tweede volzin, en veertiende lid][ref2],
      van overeenkomstige toepassing, met dien verstande dat de beslissing van het centrale tuchtcollege eveneens in het
      openbaar wordt uitgesproken indien de beslissing van het regionale tuchtcollege, waartegen beroep is ingesteld, in
      het openbaar werd uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel74
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel83
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '74'
        hoofdstuk: VII
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '83'
        hoofdstuk: VIII
  - number: '84.6'
    text: |-
      Ten aanzien van de toezending van afschriften van de eindbeslissing van het centrale tuchtcollege is
      [artikel 83, vijftiende lid][ref1], van overeenkomstige toepassing, met dien verstande dat een afschrift mede wordt
      toegezonden aan het centrale tuchtcollege.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel83
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '83'
        hoofdstuk: VIII
  - number: '84.7'
    text: |-
      Met betrekking tot de overeenkomstig het zesde lid juncto [artikel 83, vijftiende lid][ref1], aan de secretaris
      van het centrale tuchtcollege toegezonden afschriften van de beslissingen is [artikel 76][ref2] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel83
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel76
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '83'
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '76'
        hoofdstuk: VII
        paragraaf: '6'
  - number: '84.8'
    text: |-
      Indien degene op wie de voordracht betrekking heeft in een zaak tevens lid-beroepsgenoot of plaatsvervangend lid-
      beroepsgenoot is van het centrale tuchtcollege wordt de zaak behandeld door leden die daartoe door de voorzitter
      zijn aangewezen. Bij die aanwijzing draagt de voorzitter er zorg voor dat een onafhankelijke behandeling is
      gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel84
  - number: '85'
    text: |-
      Ten aanzien van het centrale tuchtcollege is met betrekking tot zaken die bij dat college ingevolge een krachtens
      [artikel 84][ref1] ingesteld beroep aanhangig zijn, [artikel 62][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel84
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel62
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '84'
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '62'
        hoofdstuk: VII
        paragraaf: '3'
  - number: 85a.1
    text: |-
      De inspecteur kan een beroepsbeoefenaar die in een der in [artikel 47, tweede lid][ref1], vermelde hoedanigheden
      in een register ingeschreven staat, een last tot onmiddellijke onthouding van de beroepsactiviteiten voor het
      betrokken beroep opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel47
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel85a
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '47'
        hoofdstuk: VII
        paragraaf: '1'
  - number: 85a.2
    text: 'Een last als bedoeld in het eerste lid kan worden opgelegd indien:'
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel85a
  - number: 85a.2.a
    text: |-
      gedragingen van de beroepsbeoefenaar hebben geleid tot ernstige benadeling van de gezondheid van personen of
      een aanmerkelijke kans daarop, dan wel indien die gedragingen blijk geven van een persoonlijkheid die zich niet
      verdraagt met het door hem uitgeoefende beroep, en
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel85a
  - number: 85a.2.b
    text: |-
      de gedragingen van de beroepsbeoefenaar van zodanige aard zijn dat het belang van de volksgezondheid meebrengt
      dat de beroepsbeoefenaar zijn beroepsactiviteiten staakt totdat een regionaal tuchtcollege als bedoeld in
      [artikel 47, derde lid][ref1], over dat handelen heeft geoordeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel47
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel85a
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '47'
        hoofdstuk: VII
        paragraaf: '1'
  - number: 85a.3
    text: |-
      De in het eerste lid bedoelde last eindigt acht weken na de dag waarop de last aan de beroepsbeoefenaar is bekend
      gemaakt, tenzij de inspecteur binnen die periode van acht weken tegen de beroepsbeoefenaar bij het regionale
      tuchtcollege een klaagschrift heeft ingediend dan wel met betrekking tot die beroepsbeoefenaar een voordracht als
      bedoeld in [artikel 79][ref1] heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel79
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel85a
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '79'
        hoofdstuk: VIII
  - number: 85a.4
    text: |-
      Indien de inspecteur met inachtneming van het derde lid een zaak aanhangig heeft gemaakt bij het regionale
      tuchtcollege, blijft de in het eerste lid bedoelde last van kracht totdat dat tuchtcollege een einduitspraak heeft
      gedaan.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel85a
  - number: 85a.5
    text: |-
      Indien de inspecteur binnen de periode van acht weken afziet van het indienen van een tuchtklacht dan wel het
      doen van een voordracht als bedoeld in [artikel 79][ref1], doet hij daarvan zo spoedig mogelijk mededeling aan de
      beroepsbeoefenaar. De last komt daarmee ten einde. In de mededeling wordt de datum vermeld waarop de last ten einde
      is gekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel79
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel85a
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '79'
        hoofdstuk: VIII
  - number: 85a.6
    text: |-
      De inspecteur meldt de beroepsbeoefenaar aan wie hij een last heeft opgelegd na het verstrijken van de periode van
      acht weken zo spoedig mogelijk dat de last is beëindigd indien hij niet binnen die periode een tuchtklacht heeft
      ingediend dan wel een voordracht heeft gedaan als bedoeld in [artikel 79][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel79
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel85a
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '79'
        hoofdstuk: VIII
  - number: 85a.7
    text: |-
      De inspecteur vermeldt in zijn klaagschrift dan wel de voordracht dat aan de betrokken beroepsbeoefenaar een last
      als bedoeld in het eerste lid is opgelegd.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel85a
  - number: 85a.8
    text: |-
      De secretaris zendt het afschrift van het klaagschrift dan wel van de voordracht zo spoedig mogelijk aan de
      betrokken beroepsbeoefenaar.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel85a
  - number: 85b
    text: |-
      Indien de inspecteur een zaak aanhangig heeft gemaakt dan wel een voordracht heeft gedaan bij het regionale
      tuchtcollege als bedoeld in [artikel 85a, derde lid][ref1], behandelt het tuchtcollege de zaak overeenkomstig
      [artikel 65, zesde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel85a
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel65
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel85b
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: 85a
        hoofdstuk: VIIIA
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '65'
        hoofdstuk: VII
        paragraaf: '4'
  - number: '86.1'
    text: |-
      Met het toezicht op de naleving van de krachtens deze wet geregelde opleidingen, alsmede de krachtens
      [artikel 40][ref1] gestelde voorschriften en de voorschriften waarvan overtreding in [hoofdstuk X][ref2] strafbaar
      is gesteld, zijn belast de ambtenaren van de Inspectie gezondheidszorg en jeugd.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0006251#HoofdstukX
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '40'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0006251
        hoofdstuk: X
  - number: '86.2'
    text: |-
      Met het toezicht op de naleving van een last tot onmiddellijke onthouding van de beroepsactiviteiten als bedoeld in
      [artikel 85a][ref1] zijn belast de bij besluit van Onze Minister aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel85a
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: 85a
        hoofdstuk: VIIIA
  - number: '87.1'
    text: |-
      De met het toezicht belaste ambtenaren beschikken niet over de bevoegdheden, genoemd in de [artikelen 5:18][ref1]
      en [5:19 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
