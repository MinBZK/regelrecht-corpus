        artikel: '34'
        hoofdstuk: III
        afdeling: '2'
  - number: '94'
    text: |-
      Indien in deze wet geregelde onderwerpen in het belang van een goede uitvoering van de wet nadere regeling
      behoeven, kan deze geschieden bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel94
  - number: '95'
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van deze wet aan de beide Kamers der Staten-Generaal
      een verslag over de wijze waarop zij is toegepast.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel95
  - number: '96.1'
    text: |-
      Degene die bij het verrichten van handelingen op het gebied van de individuele gezondheidszorg buiten noodzaak
      benadeling of een aanmerkelijke kans op benadeling van de gezondheid van een ander veroorzaakt, wordt, indien
      hij weet of ernstige reden heeft om te vermoeden dat hij bij het verrichten van die handelingen benadeling of een
      aanmerkelijke kans op benadeling van de gezondheid van een ander veroorzaakt, gestraft met gevangenisstraf van ten
      hoogste twee jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel96
  - number: '96.2'
    text: |-
      Degene die bij het verrichten van handelingen op het gebied van de individuele gezondheidszorg buiten noodzaak
      benadeling of een aanmerkelijke kans op benadeling van de gezondheid van een ander veroorzaakt, wordt gestraft met
      hechtenis van ten hoogste een jaar of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel96
  - number: '96.3'
    text: |-
      Bij veroordeling wegens een der in het eerste of tweede lid omschreven feiten kan de betrokkene tevens worden
      ontzet van het recht het betrokken beroep uit te oefenen.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel96
  - number: '96.4'
    text: |-
      Indien het feit, bedoeld in het eerste lid, zwaar lichamelijk letsel ten gevolge heeft, wordt de schuldige gestraft
      met gevangenisstraf van ten hoogste vier jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel96
  - number: '96.5'
    text: |-
      Indien het feit, bedoeld in het eerste lid, de dood ten gevolge heeft, wordt de schuldige gestraft met
      gevangenisstraf van ten hoogste zes jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel96
  - number: 96a.1
    text: |-
      Indien tegen de verdachte van overtreding van [artikel 96][ref1] ernstige bezwaren zijn gerezen en de bescherming
      van de volksgezondheid dat dringend vordert, is de officier van justitie, zolang de behandeling ter terechtzitting
      nog niet is aangevangen, bevoegd, gehoord de Inspectie gezondheidszorg en jeugd, de verdachte bij aan deze te
      betekenen kennisgeving als voorlopige maatregel te bevelen zich van bepaalde handelingen te onthouden.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel96
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel96a
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '96'
        hoofdstuk: X
  - number: 96a.2
    text: |-
      De verdachte kan tegen het bevel binnen veertien dagen na de betekening in beroep komen bij het gerecht waar de
      zaak wordt vervolgd of vervolgd zal worden. Het gerecht beslist zo spoedig mogelijk. De verdachte wordt gehoord,
      althans behoorlijk opgeroepen.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel96a
  - number: 96a.3
    text: |-
      [Artikel 28, tweede en derde lid][ref1], en de
      [artikelen 30 tot en met 32 van de Wet op de economische delicten][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0002063#Artikel30
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel96a
    references:
