  - number: '99.2'
    text: |-
      Op dezelfde wijze wordt gestraft degene die, hoewel zijn inschrijving in het desbetreffende register is
      doorgehaald ten gevolge van een onherroepelijk geworden overeenkomstig [artikel 48, eerste lid, onder f][ref1],
      of [80, eerste lid, onder c][ref2], opgelegde maatregel, dan wel een maatregel berustende op een in het buitenland
      gegeven rechterlijke, tuchtrechtelijke of bestuursrechtelijke beslissing op grond waarvan de ingeschrevene zijn
      rechten ter zake van de uitoefening van het betrokken beroep blijvend geheel heeft verloren, handelt in strijd met
      het in [artikel 4, tweede lid][ref3], of [17, tweede lid][ref4], gestelde verbod.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel80
