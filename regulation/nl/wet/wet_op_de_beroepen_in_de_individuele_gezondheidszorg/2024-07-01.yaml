        artikel: '8'
        hoofdstuk: II
        paragraaf: '1'
  - number: '145'
    text: |-
      De Wet van 1 juni 1865, *Stb.* 60, regelende de uitoefening der geneeskunst, de Wet van 24 juni 1876, *Stb.*
      117, houdende regeling van de voorwaarden tot verkrijging der afzonderlijke bevoegdheid tot uitoefening der
      tandheelkunst en van de uitoefening dier kunst, de Wet van 25 december 1878, *Stb.* 222, houdende regeling der
      voorwaarden tot verkrijging der bevoegdheid van arts, tandarts, apotheker, vroedvrouw en apothekersbediende, de
      Wet tot bescherming van het diploma van verpleegkundige (*Stb.* 1921, 702), de Wet van 30 december 1926, *Stb.*
      454, tot herziening van de uitvoering van de Wet van 29 juni 1925, *Stb.* 282 (volledige tandprothese), de Medische
      Tuchtwet (*Stb.* 1928, 222), de Wet van 18 mei 1929, *Stb.* 257, tot het in de gelegenheid stellen van hen, die
      ingevolge de wet van 30 december 1926 (*Stb.* 454) geen visum op hun bewijs van vestiging hebben ontvangen, om
      alsnog van hun practische bekwaamheid te doen blijken, de Wet van 13 mei 1939, *Stb.* 801, tot nadere voorzieningen
      inzake de tandheelkunde, de Wet van 11 juli 1957, *Stb.* 330, houdende aanvullende bepalingen tot het verlenen van
      de bevoegdheid van tandheelkundige, de Wet van 18 december 1957, *Stb.* 589, tot regeling van de toelating van in
      Indonesië bevoegde Nederlandse tandartsen en vroedvrouwen tot de uitoefening van de praktijk in Nederland, de Wet
      op de paramedische beroepen (*Stb.* 1963, 113), de Wet op de ziekenverzorgers en ziekenverzorgsters (*Stb.* 1963,
      289), alsmede de Wet inzake de tandprothetici (*Stb.* 1989, 329) worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel145
  - number: '146'
    text: |-
      Waar in deze wet "Wet op de beroepen in de individuele gezondheidszorg (*Stb.* 1993, 655)" voorkomt, worden bij
      plaatsing van deze wet in het *Staatsblad* na "*Stb.*" ingevoegd de jaargang en het nummer van het *Staatsblad*
      waarin deze wet wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel146
  - number: '147.1'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel147
  - number: '147.2'
    text: |-
      Voorts kan het tijdstip van inwerkingtreding van de artikelen 3 tot en met 7, 12, 100, 104, eerste lid, onder
      a, tweede en zesde lid, en 105, eerste en derde lid, per bij koninklijk besluit aan te wijzen regio verschillend
      worden gesteld ten aanzien van degenen die in Nederland woonachtig zijn en vóór het in het eerste lid bedoelde
      tijdstip de bevoegdheid tot het voeren van de titel van verpleegkundige hebben verkregen.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel147
  - number: '148'
    text: 'Deze wet kan worden aangehaald als: Wet op de beroepen in de individuele gezondheidszorg.'
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel148
