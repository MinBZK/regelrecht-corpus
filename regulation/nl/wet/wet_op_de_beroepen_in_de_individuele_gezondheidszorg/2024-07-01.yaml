  - number: '88'
    text: |-
      De beoefenaren van een op grond van [artikel 3][ref1], [34][ref2] of [36a][ref3] gereguleerd beroep zijn verplicht
      geheimhouding in acht te nemen ten opzichte van al datgene wat hem bij het uitoefenen van zijn beroep op het
      gebied van de individuele gezondheidszorg als geheim is toevertrouwd, of wat daarbij als geheim te zijner kennis is
      gekomen of wat daarbij te zijner kennis is gekomen en waarvan hij het vertrouwelijke karakter moest begrijpen.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0006251#Artikel36a
