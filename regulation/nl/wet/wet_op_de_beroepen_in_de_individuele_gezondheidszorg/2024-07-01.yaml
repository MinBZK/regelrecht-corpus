  - number: '100.2'
    text: |-
      Onze Minister is bevoegd een bestuurlijke boete van ten hoogste het bedrag dat is vastgesteld voor de derde
      categorie, bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref1] op te leggen ter zake van een
      gedraging die in strijd is met het bepaalde bij of krachtens: - [artikel 4, tweede lid][ref2];
        - [artikel 17, tweede lid][ref3];
        - [artikel 34, vierde lid][ref4];
        - [artikel 35][ref5];
        - [artikel 36a, derde lid, tweede volzin][ref6];
        - [artikel 38][ref7];
        - [artikel 40][ref8];
        - [artikel 41, derde lid, onder b][ref9];
        - [artikel 48, eerste lid, onder d, e, en g][ref10];
        - [artikel 48, tweede lid][ref11];
        - [artikel 80, eerste lid, onder a of b][ref12];
        - [artikel 88][ref13];
        - [artikel 96][ref14];
        - [artikel 105, derde lid][ref15];
        - [artikel 108, tweede lid][ref16].


