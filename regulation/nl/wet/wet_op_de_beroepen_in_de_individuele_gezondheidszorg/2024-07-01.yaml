      beroep voor de eerste maal toepassing wordt gegeven aan [artikel 8][ref1], [34][ref2] of [40][ref3], dan wel een
      algemene maatregel van bestuur, inhoudende intrekking van een algemene maatregel van bestuur waarbij ten aanzien
      van een bepaald beroep toepassing is gegeven aan artikel 8, 34 of 40, wordt niet eerder gedaan dan vier weken nadat
      het ontwerp aan beide Kamers der Staten-Generaal is overgelegd.


