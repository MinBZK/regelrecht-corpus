  - number: '101'
    text: |-
      Degene die handelt in strijd met een krachtens [artikel 40][ref1] gesteld voorschrift voor zover dit is aangeduid
      als strafbaar feit wordt gestraft met geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel40
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '40'
        hoofdstuk: V
  - number: '102.1'
    text: |-
      De in [artikel 96, eerste lid][ref1], strafbaar gestelde feiten zijn misdrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel96
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '96'
        hoofdstuk: X
  - number: '102.2'
    text: |-
      De in de [artikelen 96, tweede lid][ref1], [97][ref2], [98][ref3], [99][ref4] en [101][ref5] strafbaar gestelde
      feiten zijn overtredingen.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel96
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel97
      [ref3]: https://wetten.overheid.nl/BWBR0006251#Artikel98
      [ref4]: https://wetten.overheid.nl/BWBR0006251#Artikel99
      [ref5]: https://wetten.overheid.nl/BWBR0006251#Artikel101
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '96'
        hoofdstuk: X
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '97'
        hoofdstuk: X
      - id: ref3
        bwb_id: BWBR0006251
        artikel: '98'
        hoofdstuk: X
      - id: ref4
        bwb_id: BWBR0006251
        artikel: '99'
        hoofdstuk: X
      - id: ref5
        bwb_id: BWBR0006251
        artikel: '101'
        hoofdstuk: X
  - number: '103.1'
    text: |-
      Indien tijdens het plegen van een strafbaar feit, omschreven in [artikel 97][ref1], nog geen vier jaren
      zijn verlopen sedert een vroegere veroordeling van de schuldige wegens een strafbaar feit, omschreven in de
      [artikelen 96][ref2] en 97, onherroepelijk is geworden, kan hechtenis van ten hoogste zes maanden of geldboete van
      de derde categorie worden opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel97
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel96
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '97'
        hoofdstuk: X
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '96'
        hoofdstuk: X
  - number: '103.2'
    text: |-
      Indien tijdens het plegen van een strafbaar feit, omschreven in [artikel 96, eerste lid][ref1], nog geen vier
      jaren zijn verlopen sedert een vroegere veroordeling van de schuldige wegens een strafbaar feit, omschreven in de
      artikelen 96 en [97][ref2], onherroepelijk is geworden, kan de gevangenisstraf met een derde worden verhoogd.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel96
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel97
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '96'
        hoofdstuk: X
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '97'
        hoofdstuk: X
  - number: '103.3'
    text: |-
      Indien tijdens het plegen van een strafbaar feit, omschreven in [artikel 96, tweede lid][ref1], nog geen vier
      jaren zijn verlopen sedert een vroegere veroordeling van de schuldige wegens een strafbaar feit, omschreven in de
      artikelen 96 en [97][ref2], onherroepelijk is geworden, kan hechtenis voor de duur van een jaar en vier maanden
      worden opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel96
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel97
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '96'
        hoofdstuk: X
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '97'
        hoofdstuk: X
  - number: '103.4'
    text: |-
      Onder vroegere veroordeling als bedoeld in dit artikel wordt mede verstaan een vroegere veroordeling door een
      strafrechter in een andere lidstaat van de Europese Unie wegens feiten soortgelijk aan de feiten, bedoeld in de
      [artikelen 96][ref1] en [97][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel96
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel97
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '96'
        hoofdstuk: X
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '97'
        hoofdstuk: X
  - number: '105.1'
    text: |-
      Degenen die de bevoegdheid hadden verkregen tot het voeren van de titel van verpleegkundige vóór het tijdstip
      waarop [artikel 3, eerste lid][ref1], ten aanzien van het desbetreffende beroep in werking is getreden, wordt
      inschrijving in het desbetreffende register niet geweigerd vanwege het niet voldoen aan de ter zake van de genoten
      opleiding bij of krachtens [hoofdstuk III][ref2] voor inschrijving in dat register gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006251#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006251
        hoofdstuk: III
  - number: '105.2'
    text: |-
      Met de in het eerste lid bedoelde personen worden gelijkgesteld degenen die een op de bekwaamheid tot de
      uitoefening van een daar bedoeld beroep dan wel op het voeren van de daar bedoelde titel betrekking hebbend
      getuigschrift hebben verkregen ter afsluiting van een wettelijk geregelde opleiding welke vóór het tijdstip waarop
      [artikel 3, eerste lid][ref1], ten aanzien van het desbetreffende beroep in werking is getreden, is aangevangen en
      eerst nadien is voltooid.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel3
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
  - number: '105.3'
    text: |-
      Ingeval de in het eerste lid bedoelde bevoegdheid of toelating onder beperkingen of voorwaarden is verleend, mag de
      betrokkene, in het register ingeschreven staande, het desbetreffende beroep slechts uitoefenen met inachtneming van
      die beperkingen of voorwaarden. Bij inschrijving van de betrokkene in het register wordt in de in de vorige volzin
      bedoelde gevallen in het register een aantekening geplaatst, inhoudende een omschrijving van die beperkingen of
      voorwaarden. Indien de bevoegdheid of de toelating voor een bepaalde tijd is verleend, wordt de inschrijving van de
      betrokkene na afloop van die tijd doorgehaald. [Artikel 12][ref1] is van overeenkomstige toepassing ten aanzien van
      de in de tweede volzin bedoelde aantekening.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel12
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '12'
        hoofdstuk: II
        paragraaf: '1'
  - number: '105.4'
    text: 'Het derde lid, eerste volzin, is niet van toepassing ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel105
  - number: 105.4.a
    text: de in artikel 7, eerste volzin, van de Wet van 24 juni 1876, *Stb.* 117, bedoelde tandartsen;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel105
  - number: 105.4.b
    text: |-
      degenen aan wie een met de bevoegdheid van de onder a bedoelde tandartsen overeenkomende bevoegdheid of toelating
      krachtens artikel 7*a* en 7*d* van de onder *a* genoemde wet was verleend;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel105
  - number: 105.4.c
    text: |-
      degenen die krachtens artikel 1 van de Wet van 18 december 1957, *Stb.* 589, waren toegelaten tot het uitoefenen
      van de tandheelkundige praktijk in Nederland.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel105
  - number: '107.1'
    text: |-
      Voor de toepassing van [artikel 34, vierde lid][ref1], worden met degenen die een krachtens
      [artikel 34, eerste lid][ref2], geregelde of aangewezen opleiding tot een beroep dat ook wettelijk geregeld was
      vóór de datum van inwerkingtreding van [artikel 34][ref3], hebben voltooid, gelijkgesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0006251#Artikel34
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '34'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '34'
        hoofdstuk: III
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0006251
        artikel: '34'
        hoofdstuk: III
        afdeling: '2'
  - number: 107.1.a
    text: |-
      personen die vóór het tijdstip waarop voor het desbetreffende beroep een algemene maatregel van bestuur krachtens
      [artikel 34, derde lid][ref1], in werking treedt de bevoegdheid hadden verkregen tot de uitoefening van het
      desbetreffende beroep dan wel de bevoegdheid hadden verkregen tot het voeren van een op dat beroep betrekking
      hebbende titel;


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel34
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '34'
        hoofdstuk: III
        afdeling: '2'
  - number: 107.1.b
    text: |-
      personen die een wettelijk geregelde opleiding tot het desbetreffende beroep vóór het tijdstip waarop voor dat
      beroep een algemene maatregel van bestuur krachtens [artikel 34, derde lid][ref1], in werking treedt, hebben
      aangevangen en nadien hebben voltooid;


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel34
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '34'
        hoofdstuk: III
        afdeling: '2'
  - number: 107.1.c
    text: |-
      personen, andere dan de onder *a* en *b* bedoelde, die het betreffende beroep hebben uitgeoefend gedurende een
      aaneengesloten periode van tenminste zes maanden in het tijdvak van vijf jaren, onmiddellijk voorafgaande aan het
      tijdstip waarop voor dat beroep een algemene maatregel van bestuur krachtens [artikel 34, derde lid][ref1], in
      werking treedt en ten aanzien van wie Onze Minister op hun daartoe strekkende aanvrage heeft verklaard dat hun
      verworven vakbekwaamheid geacht kan worden gelijkwaardig of nagenoeg gelijkwaardig te zijn aan de vakbekwaamheid
      welke uit het voltooid hebben van de krachtens [artikel 34, eerste lid][ref2], geregelde of aangewezen opleiding
      tot het desbetreffende beroep kan worden afgeleid.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel34
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '34'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '34'
        hoofdstuk: III
        afdeling: '2'
  - number: '107.2'
    text: |-
      De beoordeling of de vakbekwaamheid van een persoon als bedoeld in het eerste lid, onder *c*, geacht kan worden
      gelijkwaardig of nagenoeg gelijkwaardig te zijn aan die welke mag worden afgeleid uit het voltooid hebben van
      de krachtens [artikel 34, eerste lid][ref1], geregelde of aangewezen opleiding tot het desbetreffende beroep,
      geschiedt aan de hand van het bezit van door Onze Minister aangewezen getuigschriften, door het afnemen van een
      proef, of, ter beoordeling van Onze Minister, op andere wijze, eventueel nadat de betrokkene gelegenheid is gelaten
      tot het volgen van aanvullende opleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel34
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '34'
        hoofdstuk: III
        afdeling: '2'
  - number: '107.3'
    text: |-
      Een aanvrage als bedoeld in het eerste lid, onder *c*, is slechts ontvankelijk indien zij wordt ingediend binnen
      zes maanden na het tijdstip waarop een algemene maatregel van bestuur als bedoeld in [artikel 34, derde lid][ref1],
      ten aanzien van het desbetreffende beroep in werking is getreden. Later ingediende aanvragen kunnen slechts in
      behandeling worden genomen indien een aannemelijke oorzaak voor de vertraging aanwezig is, en in dat geval slechts
      binnen twee maanden nadat de oorzaak heeft opgehouden te werken.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel34
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '34'
        hoofdstuk: III
        afdeling: '2'
  - number: 107a
    text: |-
      Voor de toepassing van [artikel 34, vierde lid][ref1], worden met degenen die een krachtens
      [artikel 34, eerste lid][ref2], geregelde of aangewezen opleiding tot een beroep dat niet wettelijk geregeld
      was vóór de datum van inwerkingtreding van [artikel 34][ref3], hebben voltooid, gelijkgesteld: personen wier
      verworven vakbekwaamheid, gelet op het bezit van een door Onze Minister aangewezen getuigschrift, geacht kan
      worden gelijkwaardig of nagenoeg gelijkwaardig te zijn aan de vakbekwaamheid welke uit het voltooid hebben van
      de krachtens [artikel 34, eerste lid][ref4], geregelde of aangewezen opleiding tot het desbetreffende beroep kan
      worden afgeleid.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0006251#Artikel34
      [ref4]: https://wetten.overheid.nl/BWBR0006251#Artikel34
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel107a
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '34'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '34'
        hoofdstuk: III
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0006251
        artikel: '34'
        hoofdstuk: III
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0006251
        artikel: '34'
        hoofdstuk: III
        afdeling: '2'
  - number: '108.1'
    text: |-
      Aan degene die vóór het tijdstip waarop dit artikel in werking is getreden de bevoegdheid tot uitoefening van
      heilgymnastiek en massage hadden verkregen krachtens artikel 8, eerste lid, van de Wet op de paramedische beroepen
      (*Stb.* 1963, 113) dan wel op de in artikel 41, tweede of vierde lid, van die wet omschreven voet, is het recht
      voorbehouden de titel van heilgymnast-masseur te voeren.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel108
  - number: '108.2'
    text: |-
      Het is degene wie het recht tot het voeren van de in het eerste lid geregelde titel niet toekomt, verboden die
      titel of een daarop gelijkende benaming te voeren.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel108
  - number: '108.3'
    text: |-
      Tot het gebied van deskundigheid van de personen, bedoeld in het eerste lid, wordt gerekend het verrichten
      van bij algemene maatregel van bestuur te omschrijven handelingen op het gebied van de bewegingstherapie en de
      massagetherapie, voor zover zij liggen op het gebied van de geneeskunst en het verrichten ervan geschiedt op grond
      van een door een arts afgegeven verwijzing die aan bij de maatregel te stellen eisen voldoet.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel108
  - number: '108.4'
    text: |-
      Tot het gebied van deskundigheid van de personen, bedoeld in het eerste lid, wordt mede gerekend het verrichten
      van handelingen, rechtstreeks betrekking hebbende op een persoon en ertoe strekkende diens gezondheidstoestand te
      bevorderen of te bewaken, welke overeenkomen met de handelingen, bedoeld in het derde lid, doch niet liggende op
      het gebied van de geneeskunst.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel108
  - number: '109.1'
    text: |-
      De krachtens de Medische Tuchtwet (*Stb.* 1928, 222) opgelegde maatregelen behouden na de intrekking van die wet
      hun rechtskracht.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel109
  - number: '109.2'
    text: |-
      De op het tijdstip van die intrekking aanhangige zaken worden nog op de voet van het bij of krachtens de Medische
      Tuchtwet bepaalde afgehandeld, met dien verstande evenwel dat daarbij geen maatregel opgelegd kan worden wegens
      feiten ter zake waarvan geen maatregelen zouden kunnen worden opgelegd overeenkomstig hoofdstuk VII of VIII van de
      onderhavige wet.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel109
  - number: '110'
    text: |-
      Ingeval overeenkomstig de Medische Tuchtwet bij onherroepelijk geworden beslissing de in artikel 5, eerste lid,
      onder 5°, van die wet vermelde maatregel is opgelegd, wordt deze naar zijn rechtsgevolgen gelijkgesteld met een
      krachtens [artikel 48, eerste lid, onder f][ref1], of [artikel 80, eerste lid, onder c][ref2], dan wel met een
      krachtens [artikel 48, vierde lid][ref3], opgelegde maatregel, zulks naar gelang de betrokkene op het tijdstip van
      onherroepelijk worden van bedoelde beslissing al dan niet in het desbetreffende register ingeschreven stond.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel80
      [ref3]: https://wetten.overheid.nl/BWBR0006251#Artikel48
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel110
