  - number: '87.2'
    text: |-
      De met het toezicht belaste ambtenaren zijn, voor zover dat voor de vervulling van hun taak noodzakelijk is en in
      afwijking van [artikel 5:20, tweede lid, van de Algemene wet bestuursrecht][ref1] en van [artikel 88][ref2] van
      deze wet, bevoegd tot inzage van de patiëntendossiers. Voor zover de betrokken beroepsbeoefenaar uit hoofde van
      zijn beroep tot geheimhouding van het dossier verplicht is, geldt gelijke verplichting voor de betrokken ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel88
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel87
