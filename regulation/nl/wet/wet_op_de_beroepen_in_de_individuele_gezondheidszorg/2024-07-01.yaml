    text: |-
      Beoefenaren van een beroep dat vergelijkbaar is met dat van arts, tandarts, verloskundige, verpleegkundige,
      physician assistant of klinisch technoloog en die zijn verbonden aan een buitenlandse krijgsmacht, worden voor de
      toepassing van [artikel 35][ref1] gelijkgesteld met de op grond van hoofdstuk IV aangewezen personen, indien zij:


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel35
