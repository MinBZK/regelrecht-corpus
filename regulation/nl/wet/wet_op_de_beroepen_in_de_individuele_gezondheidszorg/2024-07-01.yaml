        artikel: '1'
  - number: 36.14.a
    text: de artsen;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel36
  - number: 36.14.b
    text: de tandartsen;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel36
  - number: 36.14.c
    text: |-
      de verloskundigen, doch dezen uitsluitend voor zover het betreft handelingen, in de aanhef van dit lid bedoeld,
      die overeenkomstig het bij of krachtens [hoofdstuk III][ref1] bepaalde worden gerekend tot hun gebied van
      deskundigheid;


      [ref1]: https://wetten.overheid.nl/BWBR0006251#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0006251
        hoofdstuk: III
  - number: 36.14.d
    text: |-
      verpleegkundigen, die behoren tot een ter bevordering van een goede uitoefening van de individuele gezondheidszorg
      bij ministeriële regeling aan te wijzen categorie, doch dezen uitsluitend:
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel36
  - number: 36.14.d.1°
    text: |-
      voor zover een onder a, b of c bedoelde beroepsbeoefenaar de diagnose heeft gesteld met betrekking tot de patiënt
      voor wie het geneesmiddel is bestemd,
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel36
  - number: 36.14.d.2°
    text: voor zover medische protocollen en standaarden ter zake van het voorschrijven van UR-geneesmiddelen worden gevolgd,
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel36
  - number: 36.14.d.3°
    text: |-
      binnen de bij de regeling te stellen beperkingen ten aanzien van de reikwijdte van de in de aanhef bedoelde
      bevoegdheid, en
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel36
  - number: 36.14.d.4°
    text: voor zover van die bevoegdheid een aantekening in het register is gemaakt;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel36
  - number: 36.14.e
    text: |-
      bij ministeriële regeling aan te wijzen categorieën van verpleegkundigen, behorend tot een wettelijk erkend
      specialisme, een en ander met inachtneming van de beperkingen, bij de regeling te stellen,
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel36
  - number: 36.14.f
    text: |-
      de physician assistants, doch deze uitsluitend voor zover het betreft handelingen, in de aanhef van dit lid
      bedoeld, die overeenkomstig het bij of krachtens [hoofdstuk III][ref1] bepaalde worden gerekend tot hun gebied
      van deskundigheid.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0006251
        hoofdstuk: III
  - number: '36.15'
    text: |-
      Het ontwerp van de ministeriële regeling, bedoeld in het veertiende lid, onder d, treedt niet eerder in werking dan
      vier weken nadat het ontwerp is overgelegd aan beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel36
  - number: 36a.1
    text: |-
      Bij algemene maatregel van bestuur kan in afwijking van [artikel 36][ref1] van deze wet en van
      [artikel 1, eerste lid, onderdeel pp, van de Geneesmiddelenwet][ref2] bij wijze van experiment worden bepaald,
      dat voor een termijn van maximaal vijf jaar een bij de maatregel omschreven categorie van beroepsbeoefenaren, die
      werkzaam is op het gebied van de individuele gezondheidszorg en die met goed gevolg een bij de maatregel aangewezen
      opleiding met betrekking tot de aan te wijzen voorbehouden handeling heeft afgerond, wordt aangewezen als zijnde
      bevoegd tot het verrichten van in die maatregel aangewezen handelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0021505#Artikel1
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '36'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0021505
        artikel: '1'
  - number: 36a.2
    text: |-
      Op de in de maatregel omschreven categorie van beroepsbeoefenaren is [artikel 35a][ref1] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel35a
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: 35a
        hoofdstuk: IV
  - number: 36a.3
    text: |-
      Bij de maatregel kan aan de in het eerste lid omschreven categorie van beroepsbeoefenaren gedurende de in dat lid
      bedoelde periode het recht verleend worden een in de maatregel aan te geven titel te voeren. Gedurende deze periode
      is het aan anderen verboden deze titel of een daarop gelijkende benaming te voeren.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel36a
  - number: 36a.4
    text: |-
      Voor zover het derde lid, tweede volzin, en de [artikelen 4, tweede lid][ref1],
      [17, tweede lid][ref2], en [34, vierde lid][ref3], een verbod inhouden op het voeren van een titel,
      is dat verbod niet van toepassing in het geval dat een beroepsbeoefenaar aan wie op grond van
      [artikel 12, eerste lid, van de Algemene wet erkenning EU-beroepskwalificaties][ref4] gedeeltelijke toegang is
      verleend tot een beroep, behorende tot een categorie van beroepsbeoefenaren als bedoeld in het eerste lid, zijn
      beroepswerkzaamheden uitoefent onder de beroepstitel van zijn staat van herkomst of oorsprong.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0006251#Artikel34
      [ref4]: https://wetten.overheid.nl/BWBR0023066#Artikel12
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '17'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0006251
        artikel: '34'
        hoofdstuk: III
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0023066
        artikel: '12'
  - number: 36a.5
    text: |-
      Met een recept als bedoeld in [artikel 1, eerste lid, onderdeel pp, van de Geneesmiddelenwet][ref1] wordt
      voor de toepassing van dit artikel gelijkgesteld een document dat is opgesteld door een met naam en werkadres
      aangeduide beroepsbeoefenaar, die behoort tot de bij de maatregel omschreven categorie van beroepsbeoefenaren
      die op grond van de maatregel bevoegd is tot het voorschrijven van UR-geneesmiddelen als bedoeld in
      artikel 1, eerste lid, onderdeel s, van de Geneesmiddelenwet, en waarin aan een persoon als bedoeld in
      [artikel 61, eerste lid, onderdeel a of b, van de Geneesmiddelenwet][ref2], een voorschrift wordt gegeven om een
      met zijn stofnaam of merknaam aangeduid geneesmiddel in de aangegeven hoeveelheid, sterkte en wijze van gebruik ter
      hand te stellen aan een te identificeren patiënt en dat is ondertekend door de desbetreffende beroepsbeoefenaar dan
      wel, zonder te zijn ondertekend met een zodanige code is beveiligd dat een daartoe bevoegde persoon of instantie de
      authenticiteit ervan kan vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0021505#Artikel61
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0021505
        artikel: '61'
  - number: 36a.6
    text: |-
      [Artikel 47][ref1] is van overeenkomstige toepassing op de bij de maatregel omschreven categorie van
      beroepsbeoefenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel47
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '47'
        hoofdstuk: VII
        paragraaf: '1'
  - number: 36a.7
    text: |-
      De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel36a
  - number: 36a.8
    text: |-
      Indien voor het verstrijken van de in het eerste lid bedoelde termijn een voorstel van wet tot wijziging van
      [artikel 36][ref1] in de zin van de in het eerste lid bedoelde algemene maatregel van bestuur wordt ingediend bij
      de Tweede Kamer der Staten-Generaal, wordt de in het eerste lid bedoelde termijn verlengd, met een maximum van vijf
      jaren en vervalt op


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel36
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '36'
        hoofdstuk: IV
  - number: 36a.8.a
    text: het moment van inwerkingtreding van de bedoelde wijzigingswet, danwel
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel36a
  - number: 36a.8.b
    text: het moment dat de bedoelde wijzigingswet wordt ingetrokken of verworpen door een der Kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel36a
  - number: 36b.1
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat door Onze Minister een tijdelijk register wordt
      ingesteld en beheerd waarin beroepsbeoefenaren van een in de maatregel, bedoeld in [artikel 36a, eerste lid][ref1],
      omschreven categorie voor de duur van het in die maatregel bedoelde experiment, op hun aanvraag worden
      ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel36a
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel36b
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: 36a
        hoofdstuk: IV
  - number: 36b.2
    text: |-
      Met betrekking tot de registers, bedoeld in het eerste lid, zijn de [artikel 3, eerste en vijfde lid][ref1],
      [4 eerste, tweede en derde lid][ref2], [6, onderdeel a][ref3], en 8 niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0006251#Artikel6
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel36b
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0006251
        artikel: '6'
        hoofdstuk: II
        paragraaf: '1'
  - number: 36b.3
    text: |-
      Indien voor het betreffende beroep op grond van het eerste lid een tijdelijk register is ingesteld, gaat dat
      tijdelijk register op het tijdstip dat de wet, bedoeld in [artikel 36a, achtste lid, onder a][ref1], in werking
      treedt, over in het in die wet voor dat beroep op grond van [artikel 3][ref2] ingestelde register. Het tweede lid
      is vanaf dat tijdstip niet langer van toepassing ten aanzien van dat register.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel36a
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel3
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel36b
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: 36a
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
  - number: 36b.4
    text: |-
      In afwijking van [artikel 8, eerste lid][ref1], geldt voor de beroepsbeoefenaar die is ingeschreven
      in een tijdelijk register, dat op grond van het derde lid is overgegaan in een register als bedoeld in
      [artikel 3, eerste lid][ref2], dat de inschrijving een half jaar na de inwerkingtreding van de wet, bedoeld in
      [artikel 36a, achtste lid, onder a][ref3], wordt doorgehaald.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0006251#Artikel36a
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel36b
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '8'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0006251
        artikel: 36a
        hoofdstuk: IV
  - number: 36b.5
    text: |-
      In afwijking van het vierde lid, geldt voor degene die op de datum, bedoeld in het vierde lid, korter dan vijf jaar
      ingeschreven is, als datum, bedoeld in [artikel 8, eerste lid][ref1], de datum van vijf jaar na die van de eerste
      inschrijving in het register, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel8
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel36b
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '8'
        hoofdstuk: II
        paragraaf: '1'
  - number: 36b.6
    text: |-
      Na het eindigen van het experiment, blijft de beroepsbeoefenaar die was ingeschreven in het tijdelijk register ter
      zake van enig in [artikel 47, eerste lid][ref1], bedoeld handelen of nalaten gedurende de tijd dat hij ingeschreven
      stond, aan de tuchtrechtspraak onderworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel47
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel36b
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '47'
        hoofdstuk: VII
        paragraaf: '1'
  - number: 36b.7
    text: |-
      Indien toepassing gegeven wordt aan het zesde lid, geeft het tuchtcollege een oordeel over de gegrondheid van de
      klacht, met dien verstande dat geen maatregelen bedoeld in [artikel 48, eerste lid][ref1], opgelegd kunnen worden.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel48
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel36b
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '48'
        hoofdstuk: VII
        paragraaf: '2'
  - number: 36b.8
    text: |-
      Indien de termijn, bedoeld in [artikel 36a, eerste lid][ref1], vervalt, anders dan door toepassing van artikel
      36a, achtste lid, onder a, bestaat gedurende een half jaar na het verstrijken van die termijn de bevoegdheid tot
      het indienen van een klaagschrift, bedoeld in [artikel 65, eerste lid][ref2]. Van de datum waarop deze bevoegdheid
      aanvangt, wordt mededeling gedaan in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel36a
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel65
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel36b
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: 36a
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '65'
        hoofdstuk: VII
        paragraaf: '4'
  - number: 36b.9
    text: |-
      Na het eindigen van het experiment, kunnen leden-beroepsgenoten en plaatsvervangende leden-beroepsgenoten van
      de tuchtcolleges, bedoeld in de [artikelen 55, eerste lid][ref1] en [56, eerste lid][ref2], bij besluit van Onze
      Minister benoemd worden, voor zover dit noodzakelijk is voor de behandeling van zaken over klachten die tot een
      half jaar na het eindigen van het experiment zijn ingediend. Deze leden en plaatsvervangende leden worden benoemd
      uit personen die ten tijde van het experiment waren ingeschreven in het tijdelijk register.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel56
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel36b
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '55'
        hoofdstuk: VII
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '56'
        hoofdstuk: VII
        paragraaf: '3'
  - number: 36b.10
    text: |-
      Indien de termijn, bedoeld in [artikel 36a, eerste lid][ref1], vervalt, anders dan door toepassing van artikel 36a,
      achtste lid, onder a, blijven de aantekeningen die op grond van [artikel 9][ref2] in het tijdelijk register zijn
      geplaatst gedurende vijf jaar raadpleegbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel36a
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel9
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel36b
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: 36a
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '9'
        hoofdstuk: II
        paragraaf: '1'
  - number: '37.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels overeenkomstig [artikel 36][ref1] worden gesteld met betrekking
      tot bij de maatregel omschreven handelingen op het gebied van de individuele gezondheidszorg, niet vallende onder
      dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel36
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '36'
        hoofdstuk: IV
  - number: '37.2'
    text: |-
      Bij algemene maatregel van bestuur kan voorts worden bepaald dat de [artikelen 35][ref1] en [36][ref2] met
      betrekking tot bij de maatregel omschreven handelingen niet langer gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel36
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '35'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '36'
        hoofdstuk: IV
  - number: '37.3'
    text: |-
      Indien niet binnen zes maanden na de inwerkingtreding van een algemene maatregel van bestuur als bedoeld in het
      eerste of tweede lid bij de Tweede Kamer der Staten-Generaal een wetsvoorstel is ingediend tot wijziging van
      [artikel 36][ref1] overeenkomstig die maatregel, alsook indien zodanig voorstel wordt ingetrokken of verworpen,
      wordt de maatregel onverwijld ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel36
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '36'
        hoofdstuk: IV
  - number: 37a
    text: |-
      Dit hoofdstuk is niet van toepassing op handelingen voor zover ten aanzien van die handelingen bij of krachtens
      andere wetten regels zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel37a
  - number: '38'
    text: |-
      Het is degene die zijn bevoegdheid tot het verrichten van een bij of krachtens de
      [artikelen 36 tot en met 37][ref1] omschreven handeling ontleent aan het bij of krachtens die artikelen bepaalde
      verboden aan een ander opdracht te geven tot het verrichten van die handeling, tenzij:


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel36
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '36'
        hoofdstuk: IV
  - number: 38.a
    text: |-
      in gevallen waarin zulks redelijkerwijs nodig is aanwijzingen worden gegeven omtrent het verrichten van de
      handeling en toezicht door de opdrachtgever op het verrichten van de handeling en de mogelijkheid tot tussenkomst
      van een zodanig persoon voldoende zijn verzekerd en
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel38
  - number: 38.b
    text: |-
      hij redelijkerwijs mag aannemen dat degene aan wie de opdracht wordt gegeven, in aanmerking genomen het onder *a*
      bepaalde, beschikt over de bekwaamheid die vereist is voor het behoorlijk verrichten van de handeling.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel38
  - number: '39.1'
    text: |-
      Indien een goede uitoefening van individuele gezondheidszorg zulks vordert, wordt bij algemene maatregel van
      bestuur bepaald dat tot het gebied van deskundigheid van personen, behorende tot een der in het tweede lid genoemde
      categorieën, wordt gerekend het verrichten van bij de maatregel aangewezen categorieën van handelingen, behorende
      tot de bij of krachtens de [artikelen 36][ref1] en [37][ref2] omschreven categorieën van handelingen, zonder
      toezicht door de opdrachtgever en zonder diens tussenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel37
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '36'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '37'
        hoofdstuk: IV
  - number: '39.2'
    text: 'Ingevolge het eerste lid kunnen de volgende categorieën van personen worden aangewezen:'
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel39
  - number: 39.2.a
    text: |-
      categorieën van personen die in een bij het eerste lid bedoelde algemene maatregel van bestuur aangewezen register
      staan ingeschreven;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel39
  - number: 39.2.b
    text: |-
      categorieën van personen die een krachtens [artikel 34, eerste lid][ref1], geregelde of aangewezen opleiding hebben
      voltooid;


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel34
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '34'
        hoofdstuk: III
        afdeling: '2'
  - number: 39.2.c
    text: categorieën van personen, behorende tot de onder *a* of *b* bedoelde categorieën van personen.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel39
  - number: '40'
    text: |-
      Bij algemene maatregel van bestuur kunnen, indien zulks noodzakelijk is gebleken ter bevordering van een goede
      uitoefening van individuele gezondheidszorg, voor degenen die in een register als bedoeld in [artikel 3][ref1]
      staan ingeschreven of die een beroep uitoefenen waarvan de opleiding krachtens [artikel 34, eerste lid][ref2], is
      geregeld of aangewezen, regels worden gesteld inhoudende:


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel34
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '34'
        hoofdstuk: III
        afdeling: '2'
  - number: 40.a
    text: |-
      een verplichting in bij de maatregel aangegeven gevallen van een door hen gegeven behandeling aan een bij de
      maatregel aangewezen inspecteur van de Inspectie gezondheidszorg en jeugd opgave te doen overeenkomstig regels, bij
      de maatregel gesteld;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel40
  - number: 40.b
    text: |-
      een verplichting om bij de maatregel aangegeven gegevens te vermelden op het recept, bedoeld in
      [artikel 1, eerste lid, onder pp, van de Geneesmiddelenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel1
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '1'
  - number: 40.c
    text: |-
      een verbod om een overeenkomst die hun bijzondere voordelen verschaft, aan te gaan met bij de maatregel aangewezen
      categorieën van personen.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel40
  - number: '41.1'
    text: |-
      In afwijking van het in [artikel 6, onder a][ref1], bepaalde wordt aan een persoon die niet voldoet aan de ter zake
      van de genoten opleiding bij of krachtens [hoofdstuk III][ref2] voor inschrijving in een register gestelde eisen,
      inschrijving in het register deswege niet geweigerd:


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0006251#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '6'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006251
        hoofdstuk: III
  - number: 41.1.a
    text: |-
      indien hij in het buitenland een door Onze Minister aangewezen getuigschrift heeft verkregen dat als zodanig
      door Onze Minister is erkend en dat geldt als bewijs van een verworven vakbekwaamheid die geacht kan worden
      gelijkwaardig te zijn aan de vakbekwaamheid welke uit het voldoen aan vorenbedoelde eisen mag worden afgeleid;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel41
  - number: 41.1.b
    text: |-
      indien Onze Minister, gelet op een door de betrokkene in het buitenland verkregen getuigschrift en op de daarnaast
      opgedane beroepservaring en gevolgde opleiding, hem op aanvrage een verklaring heeft afgegeven, inhoudende dat
      tegen zijn inschrijving in het register voor wat zijn vakbekwaamheid betreft geen bedenkingen bestaan;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel41
  - number: 41.1.c
    text: |-
      indien hij ten aanzien van het betrokken beroep in het bezit is van een erkenning van beroepskwalificaties
      ofwel aan hem gedeeltelijke toegang is verleend tot het betrokken beroep als bedoeld in de
      [Algemene wet erkenning EU-beroepskwalificaties][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023066
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0023066
  - number: '41.2'
    text: |-
      Onze Minister kan ten aanzien van een door hem krachtens het eerste lid, onder a, aangewezen getuigschrift de
      toepasselijkheid van deze bepaling op belanghebbenden afhankelijk stellen van de nationaliteit der betrokkenen,
      met dien verstande evenwel dat die bepaling ten aanzien van een aangewezen getuigschrift van een lidstaat van de
      Europese Unie alsmede van een andere overeenkomstsluitende staat in elk geval van toepassing dient te zijn op de
      onderdanen van de lidstaten van die Unie.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel41
  - number: '41.3'
    text: 'Bij afgifte van een verklaring als bedoeld in het eerste lid, onder b, kan Onze Minister daarin bepalen:'
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel41
  - number: 41.3.a
    text: |-
      dat de gelet op die verklaring tot stand gekomen inschrijving in het register op een in de verklaring aangegeven
      tijdstip zal worden doorgehaald;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel41
  - number: 41.3.b
    text: |-
      dat de betrokkene, in het register ingeschreven staande, zijn beroep slechts zal mogen uitoefenen met inachtneming
      van in de verklaring omschreven beperkingen.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel41
  - number: '41.4'
    text: |-
      Behoudens in bijzondere gevallen kan een verklaring zonder toepassing van het derde lid slechts worden afgegeven,
      indien het door de betrokkene in het buitenland verkregen getuigschrift naar het oordeel van Onze Minister kan
      gelden als bewijs van verworven vakbekwaamheid die de in het eerste lid, onder a, bedoelde gelijkwaardigheid bezit.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel41
  - number: '41.5'
    text: |-
      Onze Minister stelt voor elk daarvoor in aanmerking komend beroep een commissie van deskundigen in, die
      tot taak heeft hem op zijn verzoek of uit eigen beweging van advies te dienen inzake de toepassing van
      dit artikel en ten aanzien van het verlenen van een erkenning van beroepskwalificaties als bedoeld in de
      [Algemene wet erkenning EU-beroepskwalificaties][ref1]. Bij algemene maatregel van bestuur worden de samenstelling,
      taak en werkwijze van de commissie geregeld. Bij algemene maatregel van bestuur kunnen regels worden gesteld met
      betrekking tot het afleggen van een kennis- en vaardighedentoets en het daarvoor in rekening te brengen tarief.


      [ref1]: https://wetten.overheid.nl/BWBR0023066
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0023066
  - number: '41.6'
    text: |-
      De buitenslands gediplomeerde komt de keuze, bedoeld in
      [artikel 11, vierde lid, van de Algemene wet erkenning EU-beroepskwalificaties][ref1] niet toe in de bij
      ministeriële regeling aangewezen gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel11
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '11'
  - number: '41.7'
    text: |-
      Van een besluit krachtens het eerste lid, onder a, of het tweede lid, wordt mededeling gedaan in de
      *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel41
  - number: '41.8'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het in rekening
      brengen van een tarief voor de aanvraag van een verklaring als bedoeld in het eerste lid, onder b.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel41
  - number: '42.1'
    text: 'Bij algemene maatregel van bestuur worden regels gesteld, waarbij wordt bepaald:'
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel42
  - number: 42.1.a
    text: |-
      welke gegevens of bescheiden bij de aanvrage om een verklaring als bedoeld in
      [artikel 41, eerste lid, onder b][ref1], aan Onze Minister moeten worden verstrekt of overgelegd en op welke wijze
      haar indiening behoort te geschieden;


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel41
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '41'
        hoofdstuk: VI
        paragraaf: '1'
  - number: 42.1.b
    text: |-
      welke bewijsstukken omtrent de toepasselijkheid van [artikel 41][ref1] aan Onze Minister moeten worden overgelegd
      bij de aanvrage om inschrijving in het register met toepassing van dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel41
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '41'
        hoofdstuk: VI
        paragraaf: '1'
  - number: '42.2'
    text: |-
      Onverminderd het in [artikel 7][ref1] bepaalde, wordt in gevallen waarin toepassing werd gegeven aan
      [artikel 41, derde lid, onder a][ref2], de inschrijving van de betrokkene op het daarvoor geldende tijdstip
      doorgehaald.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel41
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '7'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '41'
        hoofdstuk: VI
        paragraaf: '1'
  - number: '42.3'
    text: |-
      Bij inschrijving van een persoon in het register met toepassing van [artikel 41][ref1] wordt in het register een
      desbetreffende aantekening geplaatst, waarbij, ingeval Onze Minister toepassing heeft gegeven aan het derde lid van
      dat artikel, tevens wordt omschreven hetgeen daarbij is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel41
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '41'
        hoofdstuk: VI
        paragraaf: '1'
  - number: '42.4'
    text: |-
      Van de totstandkoming van een inschrijving ten aanzien waarvan toepassing werd gegeven aan
      [artikel 41, derde lid][ref1], wordt op bij algemene maatregel van bestuur te bepalen wijze kennisgegeven, met
      omschrijving van hetgeen daarbij werd bepaald. Van een krachtens het tweede lid van het onderhavige artikel
      verrichte doorhaling van een inschrijving wordt eveneens op bij algemene maatregel van bestuur te bepalen wijze
      kennisgegeven. In kennisgevingen als bedoeld in het onderhavige lid worden de naam, de woonplaats en het BIG-nummer
      van de betrokkene vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel41
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '41'
        hoofdstuk: VI
        paragraaf: '1'
  - number: '42.5'
    text: |-
      Onverminderd hetgeen ingevolge [artikel 12, tweede lid][ref1], met betrekking tot de ingeschrevene geldt, wordt aan
      een ieder die zulks verlangt, medegedeeld of een inschrijving in het register met toepassing van [artikel 41][ref2]
      is tot stand gekomen, met, ingeval ten aanzien van de aldus tot stand gekomen inschrijving toepassing werd gegeven
      aan het derde lid van dat artikel, een omschrijving van hetgeen daarbij werd bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel41
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '12'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '41'
        hoofdstuk: VI
        paragraaf: '1'
  - number: '42.6'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld over de termijnen waarbinnen de gegevens,
      bescheiden en bewijsstukken als bedoeld in het eerste lid, moeten worden verstrekt, onderscheidenlijk worden
      ingediend.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel42
  - number: '43.1'
    text: |-
      Ten aanzien van een migrerende beroepsbeoefenaar als bedoeld in de Algemene wet erkenning EU-beroepskwalificaties,
      die buiten Nederland in een der lidstaten van de Europese Unie dan wel in een van de andere overeenkomstsluitende
      staten gevestigd is als beoefenaar van een in [artikel 3][ref1] genoemd beroep en aan de in het tweede lid
      omschreven voorwaarden voldoet, blijven ter zake van de diensten die hij in de uitoefening van dat beroep verleent
      aan een persoon hier te lande, buiten toepassing:


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel3
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
  - number: 43.1.a
    text: |-
      het in [artikel 4, tweede lid][ref1], gestelde verbod, voor zover het de titel betreft, waarvan het voeren
      voorbehouden is aan degenen die in de op dat beroep betrekking hebbende hoedanigheid in het desbetreffende register
      ingeschreven staan;


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel4
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
  - number: 43.1.b
    text: |-
      het in [artikel 35, eerste lid][ref1], gestelde verbod, voor zover het handelingen betreft, waartoe de onder a
      bedoelde personen bevoegd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel35
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '35'
        hoofdstuk: IV
  - number: '43.2'
    text: 'De in het eerste lid bedoelde voorwaarden zijn:'
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel43
  - number: 43.2.a
    text: |-
      de betrokkene dient in een van de lidstaten dan wel in een van de andere overeenkomstsluitende staten een op de
      bekwaamheid tot het uitoefenen van zijn beroep betrekking hebbend getuigschrift te hebben verkregen, dat krachtens
      [artikel 41, eerste lid, onder a][ref1], is aangewezen, ofwel de beroepskwalificaties van de betrokkene zijn
      overeenkomstig [artikel 27 van de Algemene wet erkenning EU-beroepskwalificaties][ref2] geverifieerd;


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0023066#Artikel27
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '41'
        hoofdstuk: VI
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0023066
        artikel: '27'
  - number: 43.2.b
    text: |-
      ten aanzien van hem geen maatregel als bedoeld in [artikel 6, onderdeel e][ref1], van kracht is en voor
      zover zijn rechten ter zake van de uitoefening van zijn beroep in de lidstaat onderscheidenlijk een
      andere overeenkomstsluitende staat waar hij gevestigd is, beperkt is op grond van een in dat land gegeven
      rechterlijke, tuchtrechtelijke of bestuursrechtelijke beslissing, hij zich houdt aan de in dat land opgelegde
      bevoegdheidsbeperking;


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel6
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '6'
        hoofdstuk: II
        paragraaf: '1'
  - number: 43.2.c
    text: |-
      de betrokkene dient aan Onze Minister te hebben gemeld dat hij als beoefenaar van het desbetreffende beroep in
      Nederland diensten verleent en dient de volgende bescheiden te hebben overgelegd:
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel43
  - number: 43.2.c.1°
    text: |-
      een bewijsstuk, niet ouder dan twaalf maanden, waaruit blijkt dat hij de desbetreffende werkzaamheden in de
      lidstaat onderscheidenlijk de andere overeenkomstsluitende staat waar hij gevestigd is, wettig uitoefent;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel43
  - number: 43.2.c.2°
    text: een bewijsstuk dat hij het onder a bedoelde getuigschrift heeft verkregen;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel43
  - number: 43.2.c.3°
    text: een bewijs van de nationaliteit van de betrokkene.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel43
  - number: '43.3'
    text: |-
      De verplichting tot het overleggen van bescheiden als bedoeld in het tweede lid, onderdeel c, geldt niet indien
      ten behoeve van de betrokkene als beoefenaar van het desbetreffende beroep door Onze Minister een beroepskaart
      is afgegeven.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel43
  - number: '43.4'
    text: |-
      In geval van een dienstverlening in Nederland, ten aanzien waarvan het eerste lid van toepassing is, is de
      betrokkene, indien de in dat lid, onder a, bedoelde personen aan tuchtrechtspraak overeenkomstig deze wet
      onderworpen zijn, ter zake van hetgeen door hem in het kader van die dienstverlening wordt verricht, eveneens aan
      bedoelde rechtspraak onderworpen.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel43
  - number: '44.1'
    text: |-
      Voor de toepassing van de [artikelen 41, eerste lid, onder a, en tweede lid][ref1], en
      [43, tweede lid, onder a][ref2], wordt met een onderdaan van een lidstaat van de Europese Unie onderscheidenlijk
      een andere overeenkomstsluitende staat, die in het bezit is van een krachtens eerstgenoemde bepaling aangewezen
      getuigschrift van een van de lidstaten van die Unie onderscheidenlijk een andere overeenkomstsluitende staat,
      gelijkgesteld de onderdaan van een lidstaat onderscheidenlijk een andere overeenkomstsluitende staat, die vóór een
      door Onze Minister vast te stellen tijdstip een op de bekwaamheid tot het uitoefenen van zijn beroep betrekking
      hebbend ander getuigschrift van een van de lidstaten onderscheidenlijk een andere overeenkomstsluitende staat
      heeft verkregen indien hij, blijkens een door een lidstaat onderscheidenlijk een andere overeenkomstsluitende staat
      afgegeven verklaring, zijn beroep in de loop van een door Onze Minister aangegeven tijdvak, aan de afgifte van die
      verklaring voorafgaande, tenminste gedurende een door Onze Minister aangegeven aaneengesloten periode daadwerkelijk
      en op wettige wijze heeft uitgeoefend.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel43
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '41'
        hoofdstuk: VI
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '43'
        hoofdstuk: VI
        paragraaf: '1'
  - number: '44.2'
    text: |-
      Onze Minister kan bepalen dat het eerste lid van overeenkomstige toepassing is ten aanzien van een onderdaan van
      een lidstaat van de Europese Unie of van een andere overeenkomstsluitende staat, die een op de bekwaamheid tot
      het uitoefenen van zijn beroep betrekking hebbend ander getuigschrift van een van de lidstaten of van een andere
      overeenkomstsluitende staat heeft verkregen ter afsluiting van een opleiding betreffende een door Onze Minister
      aangewezen beroep, welke vóór het krachtens het vorige lid vastgestelde tijdstip is aangevangen en eerst nadien
      is voltooid.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel44
  - number: '44.3'
    text: |-
      De krachtens het eerste lid vast te stellen tijdstippen, tijdvakken en perioden kunnen voor onderscheidene
      categorieën van gevallen verschillend zijn.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel44
  - number: '45.1'
    text: Ten aanzien van degenen
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel45
  - number: 45.1.a
    text: |-
      die in het buitenland een door Onze Minister aangewezen getuigschrift hebben verkregen dat geldt als bewijs van een
      verworven vakbekwaamheid die geacht kan worden gelijkwaardig te zijn aan de vakbekwaamheid welke uit het voldoen
      aan de desbetreffende krachtens [artikel 34, eerste lid][ref1], gestelde eisen mag worden afgeleid,


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel34
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '34'
        hoofdstuk: III
        afdeling: '2'
  - number: 45.1.b
    text: |-
      aan wie Onze Minister, gelet op een door de betrokkene in het buitenland verkregen getuigschrift en op de daarnaast
      opgedane beroepservaring en gevolgde opleiding, op aanvrage een verklaring heeft afgegeven, inhoudende dat hun
      vakbekwaamheid gelijkwaardig of nagenoeg gelijkwaardig kan worden geacht aan de vakbekwaamheid welke uit het
      voldoen aan de desbetreffende krachtens [artikel 34, eerste lid][ref1], gestelde eisen mag worden afgeleid, of,


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel34
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '34'
        hoofdstuk: III
        afdeling: '2'
  - number: 45.1.c
    text: |-
      aan wie Onze Minister ten aanzien van het betrokken beroep een erkenning van
      beroepskwalificaties ofwel gedeeltelijke toegang tot het betrokken beroep als bedoeld in de
      [Algemene wet erkenning EU-beroepskwalificaties][ref1] heeft verleend,


      [ref1]: https://wetten.overheid.nl/BWBR0023066
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0023066
  - number: '45.2'
    text: |-
      Het eerste lid is niet van toepassing voor zover ten aanzien van de betrokkene een maatregel, berustende op een
      in het buitenland gegeven rechterlijke, tuchtrechtelijke of bestuursrechtelijke beslissing, van kracht is, op
      grond waarvan hij zijn rechten ter zake van de uitoefening van het betrokken beroep in het land waar de beslissing
      gegeven is, geheel of gedeeltelijk, tijdelijk of blijvend, heeft verloren.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel45
  - number: '45.3'
    text: |-
      De [artikelen 41, tweede, vijfde, zevende en achtste lid][ref1], en [artikel 42, eerste lid, onder a][ref2], zijn
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel42
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '41'
        hoofdstuk: VI
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '42'
        hoofdstuk: VI
        paragraaf: '1'
  - number: '45.4'
    text: |-
      Voor de toepassing van [artikel 96, derde lid][ref1], wordt met degene die voldoet aan de krachtens
      [artikel 34, eerste lid][ref2], gestelde eisen gelijkgesteld degene die in het bezit is van een krachtens het
      eerste lid, onder a, aangewezen getuigschrift of aan wie een verklaring als bedoeld in het eerste lid, onder b,
      is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel96
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel34
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '96'
        hoofdstuk: X
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '34'
        hoofdstuk: III
        afdeling: '2'
  - number: '46'
    text: |-
      In hetgeen verder ter uitvoering van de richtlijnen van de Europese Unie alsmede van de Overeenkomst betreffende
      de Europese Economische Ruimte en van de op 21 juni 1999 te Luxemburg totstandgekomen Overeenkomst tussen de
      Europese Gemeenschap en haar lidstaten, enerzijds, en de Zwitserse Bondsstaat anderzijds, over het vrije verkeer
      van personen (Trb. 2000, 16 en 86), betreffende beoefenaren van beroepen op het gebied van de individuele
      gezondheidszorg regeling behoeft, wordt voorzien door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel46
  - number: '47.1'
    text: |-
      Degene die in een der in het tweede lid vermelde hoedanigheden in een register ingeschreven staat, is onderworpen
      aan tuchtrechtspraak ter zake van:
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel47
  - number: 47.1.a
    text: |-
      enig handelen of nalaten in strijd met de zorg die die beroepsbeoefenaar in die hoedanigheid behoort te betrachten
      ten opzichte van:
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel47
  - number: 47.1.a.1°
    text: degene, met betrekking tot wiens gezondheidstoestand hij bijstand verleent of zijn bijstand is ingeroepen;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel47
  - number: 47.1.a.2°
    text: degene die, in nood verkerende, bijstand met betrekking tot zijn gezondheidstoestand behoeft;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel47
  - number: 47.1.a.3°
    text: de naaste betrekkingen van de onder 1° en 2° bedoelde personen;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel47
  - number: 47.1.b
    text: enig ander dan onder a bedoeld handelen of nalaten in strijd met hetgeen een behoorlijk beroepsbeoefenaar betaamt.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel47
  - number: '47.2'
    text: |-
      De in het eerste lid bedoelde hoedanigheden zijn die van: arts, tandarts, apotheker, gezondheidszorgpsycholoog,
      psychotherapeut, fysiotherapeut, verloskundige, verpleegkundige, physician assistant, orthopedagoog-generalist,
      klinisch technoloog.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel47
  - number: '47.3'
    text: |-
      De tuchtrechtspraak wordt in eerste aanleg uitgeoefend door regionale tuchtcolleges en in beroep door een centraal
      tuchtcollege.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel47
  - number: '47.4'
    text: |-
      In geval van doorhaling van een inschrijving in het register blijft de betrokkene ter zake van enig in het eerste
      lid bedoeld handelen of nalaten gedurende de tijd dat hij ingeschreven stond, aan de tuchtrechtspraak onderworpen.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel47
  - number: '48.1'
    text: |-
      Het berechtende college kan ten aanzien van een aan de tuchtrechtspraak onderworpen persoon een van de volgende
      tuchtrechtelijke maatregelen opleggen:
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel48
  - number: 48.1.a
    text: waarschuwing;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel48
  - number: 48.1.b
    text: berisping;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel48
  - number: 48.1.c
    text: geldboete van ten hoogste € 4 500;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel48
  - number: 48.1.d
    text: |-
      schorsing van de bevoegdheid de aan de inschrijving verbonden bevoegdheden uit te oefenen voor ten hoogste één
      jaar;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel48
  - number: 48.1.e
    text: |-
      gedeeltelijke ontzegging van de bevoegdheid in het register ingeschreven staande het betrokken beroep uit te
      oefenen;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel48
  - number: 48.1.f
    text: doorhaling van de inschrijving in het register;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel48
  - number: 48.1.g
    text: |-
      binding aan bijzondere voorwaarden om het beroep uit te oefenen waarvoor de beroepsbeoefenaar in het register is
      ingeschreven.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel48
  - number: '48.2'
    text: |-
      Bij de maatregel van doorhaling van de inschrijving in het register kan het berechtende college aan de
      beroepsbeoefenaar, indien gedragingen van de beroepsbeoefenaar een gevaar kunnen opleveren voor de veiligheid
      van personen, beperkingen opleggen met betrekking tot het beroepsmatig handelen op het gebied van de individuele
      gezondheidszorg.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel48
  - number: '48.3'
    text: |-
      De volgende maatregelen kunnen gezamenlijk worden opgelegd en gelden voor de toepassing van de aanhef van het
      eerste lid en van [artikel 69, derde lid][ref1], als één maatregel:


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel69
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '69'
        hoofdstuk: VII
        paragraaf: '4'
  - number: 48.3.a
    text: de maatregelen, bedoeld in het eerste lid, onder c en d;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel48
  - number: 48.3.b
    text: de maatregelen, bedoeld in het eerste lid, onder d en e;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel48
  - number: 48.3.c
    text: de maatregelen, bedoeld in het eerste lid, onder e en g.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel48
  - number: '48.4'
    text: |-
      In gevallen waarin de berechting plaatsvindt met toepassing van [artikel 47, vierde lid][ref1], kan, in plaats van
      de in het eerste lid van het onderhavige artikel, onder *f*, bedoelde maatregel, als maatregel worden opgelegd een
      ontzegging van het recht wederom in het register te worden ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel47
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '47'
        hoofdstuk: VII
        paragraaf: '1'
  - number: '48.5'
    text: |-
      Opgelegde geldboeten komen ten bate van de Staat. Bij het opleggen van een geldboete kunnen twee of meer termijnen
      worden vastgesteld, waarin zij moet worden voldaan.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel48
  - number: '48.6'
    text: |-
      De maatregel van doorhaling, bedoeld in het eerste lid, onder f, wordt vanwege Onze Minister ten uitvoer gelegd.
      Indien de maatregel van doorhaling van de inschrijving niet ten uitvoer kan worden gelegd omdat de inschrijving
      reeds om andere redenen is doorgehaald, geldt de datum van de om andere reden uitgevoerde doorhaling als datum
      waarop de maatregel is uitgevoerd. Onze Minister doet hiervan mededeling aan de betrokkene.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel48
  - number: '48.7'
    text: |-
      De maatregelen, genoemd in het eerste lid, onder d en f, kunnen voorwaardelijk worden opgelegd en worden alsdan
      niet ten uitvoer gelegd dan nadat het college dat de maatregel heeft opgelegd, zulks heeft gelast op grond dat de
      betrokkene binnen een bij die oplegging te bepalen proeftijd van ten hoogste twee jaar een gestelde voorwaarde niet
      is nagekomen.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel48
  - number: '48.8'
    text: |-
      Een maatregel als bedoeld in het eerste lid, onder *c, d* of *f*, kan niet ten uitvoer worden gelegd zolang de
      beslissing waarbij hij is opgelegd, niet onherroepelijk is geworden. Een maatregel als in dat lid, onder e, g,
      tweede of in het vierde lid bedoeld, wordt eerst bij het onherroepelijk worden van de desbetreffende beslissing van
      kracht, tenzij het college, indien het belang van de bescherming van de individuele gezondheidszorg zulks vordert,
      bij zijn beslissing heeft bepaald dat hij onmiddellijk van kracht wordt. Bij toepassing van het zevende lid gaat de
      in dat lid bedoelde proeftijd eerst bij het onherroepelijk worden van de desbetreffende beslissing in.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel48
  - number: '48.9'
    text: |-
      Bij een beslissing tot het opleggen van de maatregel van doorhaling van de inschrijving kan het college tevens,
      indien het belang van de bescherming van de individuele gezondheidszorg zulks vordert, bij wijze van voorlopige
      voorziening een maatregel als bedoeld in het eerste lid, onder d of e, opleggen. Deze maatregelen kunnen bij wijze
      van de voorlopige voorziening gezamenlijk worden opgelegd. De voorlopige voorziening wordt terstond van kracht en
      wordt vanwege Onze Minister onverwijld ten uitvoer gelegd. De voorlopige voorziening blijft van kracht totdat de
      beslissing tot doorhaling van de inschrijving onherroepelijk is geworden dan wel in beroep is vernietigd.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel48
  - number: '48.10'
    text: |-
      Een tot het eerste lid, onder d, strekkende maatregel of voorlopige voorziening wordt ten uitvoer gelegd door het
      plaatsen van een aantekening van de maatregel in het register overeenkomstig het bepaalde in [artikel 9][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel9
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '9'
        hoofdstuk: II
        paragraaf: '1'
  - number: '48.11'
    text: |-
      Indien het belang van de individuele gezondheidszorg dat vordert kan het tuchtcollege bij het opleggen van een
      maatregel als bedoeld in het eerste lid, onder b en c, besluiten tot openbaarmaking van de opgelegde maatregel, al
      dan niet met de gronden waarop zij berust, op de door hem te bepalen wijze.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel48
  - number: 48a.1
    text: |-
      De inspecteur ziet toe of een beroepsbeoefenaar de op grond van [artikel 48, zevende lid][ref1], aan de maatregel
      verbonden voorwaarden naleeft.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel48
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel48a
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '48'
        hoofdstuk: VII
        paragraaf: '2'
  - number: 48a.2
    text: |-
      Het regionale tuchtcollege beslist op verzoek van de inspecteur over de tenuitvoerlegging van de maatregel, indien
      de beroepsbeoefenaar aan wie de voorwaardelijke maatregel is opgelegd, de aan de maatregel verbonden voorwaarden
      niet heeft nageleefd.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel48a
  - number: 48a.3
    text: |-
      De inspecteur is in zijn verzoek niet-ontvankelijk wanneer het verzoek later wordt ingediend dan drie maanden na
      het verstrijken van de proeftijd.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel48a
  - number: 48a.4
    text: |-
      De [artikelen 54][ref1], [55, tweede lid][ref2], [61][ref3], [63][ref4], [63a][ref5], [65, zesde lid][ref6],
      [65d, eerste, tweede, vierde en vijfde lid][ref7], [65e][ref8], [67][ref9], [67b][ref10], [70][ref11] en
      [71][ref12] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel55
      [ref3]: https://wetten.overheid.nl/BWBR0006251#Artikel61
      [ref4]: https://wetten.overheid.nl/BWBR0006251#Artikel63
      [ref5]: https://wetten.overheid.nl/BWBR0006251#Artikel63a
      [ref6]: https://wetten.overheid.nl/BWBR0006251#Artikel65
      [ref7]: https://wetten.overheid.nl/BWBR0006251#Artikel65d
      [ref8]: https://wetten.overheid.nl/BWBR0006251#Artikel65e
      [ref9]: https://wetten.overheid.nl/BWBR0006251#Artikel67
      [ref10]: https://wetten.overheid.nl/BWBR0006251#Artikel67b
      [ref11]: https://wetten.overheid.nl/BWBR0006251#Artikel70
      [ref12]: https://wetten.overheid.nl/BWBR0006251#Artikel71
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel48a
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '54'
