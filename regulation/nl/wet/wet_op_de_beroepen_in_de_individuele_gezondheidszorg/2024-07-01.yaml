  - number: 100a
    text: 'Onze Minister is bevoegd een last onder dwangsom op te leggen:'
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel100a
  - number: 100a.a
    text: |-
      aan een beroepsbeoefenaar die handelt in strijd met een krachtens [artikel 85a][ref1] opgelegde last tot
      onmiddellijke onthouding van de beroepsactiviteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel85a
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel100a
