    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel92
  - number: 92.1.b
    text: |-
      zij in het land van de krijgsmacht waaraan zij verbonden zijn, als beoefenaar van het betreffende beroep, bevoegd
      zijn tot het verrichten van de handelingen als bedoeld in [artikel 36][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel36
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel92
