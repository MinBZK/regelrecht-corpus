        hoofdstuk: IV
  - number: 92.1.c
    text: |-
      zij hun beroep uitoefenen ten behoeve van: - personeel behorende tot de krijgsmacht waaraan de beroepsbeoefenaar
      is verbonden;
        - personeel behorende tot een andere buitenlandse krijgsmacht;
        - degenen met wie het personeel, bedoeld onder a en b, duurzaam samenleeft, of
        - militaire ambtenaren als bedoeld in [artikel 1, onderdeel a, van de Wet ambtenaren defensie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001952#Artikel1
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel92
