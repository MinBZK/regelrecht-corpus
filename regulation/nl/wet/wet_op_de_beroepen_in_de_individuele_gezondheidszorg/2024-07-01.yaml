        hoofdstuk: VIIIA
  - number: 100a.b
    text: |-
      ter zake van een gedraging die in strijd is met [artikel 87, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel87
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel100a
