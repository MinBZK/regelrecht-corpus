  - number: '99.1'
    text: |-
      Degene die, hoewel hij in de uitoefening van zijn bevoegdheden is geschorst ten gevolge van een onherroepelijk
      geworden overeenkomstig [artikel 48, eerste lid onder d][ref1], en 48, tweede lid opgelegde maatregel, een
      maatregel berustende op een in het buitenland gegeven rechterlijke, tuchtrechtelijke of bestuursrechtelijke
      beslissing op grond waarvan de ingeschrevene zijn rechten ter zake van de uitoefening van het betrokken
      beroep tijdelijk geheel heeft verloren, dan wel een maatregel, bij wijze van voorlopige voorziening opgelegd
      overeenkomstig [artikel 80, vijfde lid][ref2], tijdens de duur dier schorsing handelt in strijd met het in
      [artikel 4, tweede lid][ref3], of [17, tweede lid][ref4], gestelde verbod, wordt gestraft met hechtenis van ten
      hoogste drie maanden of geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel80
      [ref3]: https://wetten.overheid.nl/BWBR0006251#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0006251#Artikel17
