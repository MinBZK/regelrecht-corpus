preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is:

    de tot dusverre geldende wettelijke regeling op het gebied van de uitoefening van de geneeskunst, inhoudende een
    het gehele gebied der geneeskunst bestrijkend verbod van beroepsuitoefening zonder hiertoe wettelijk verleende
    bevoegdheid, te vervangen door een regeling welke een ruimer gebied van individuele gezondheidszorg bestrijkt
    en waarbij slechts het verrichten van bij de wet aangewezen categorieën van handelingen wordt voorbehouden aan
    categorieën van daartoe overeenkomstig de wet gekwalificeerden, terwijl het voeren van wettelijk beschermde
    beroepstitels uitsluitend toekomt aan degenen die in de voor de desbetreffende beroepen overeenkomstig de wet
    ingestelde registers ingeschreven staan en ten aanzien van andere beroepen op het gebied van de individuele
    gezondheidszorg voorzien wordt in de mogelijkheid tot het regelen van de opleiding tot die beroepen;

    voor onderscheidene categorieën van overeenkomstig de wet gekwalificeerden een aan de gebleken behoeften aangepaste
    regeling van tuchtrechtspraak in het leven te roepen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *andere overeenkomstsluitende staat:* staat,
      niet zijnde een lidstaat van de Europese Unie of een andere staat die partij is bij de Overeenkomst betreffende de
      Europese Economische Ruimte of Zwitserland;
        - *BIG-nummer:* nummer, bedoeld in [artikel 3, tweede lid][ref1];
        - *erkend specialistenregister:* een specialistenregister ten aanzien waarvan op grond van
      [artikel 14, eerste lid][ref2], de specialistentitel is erkend, dan wel een specialistenregister dat op grond van
      [artikel 16][ref3] in het leven is geroepen;
        - *geneeskunst:* gebied van de individuele gezondheidszorg in het kader waarvan handelingen worden verricht, die:
      a. ertoe strekken een persoon van een ziekte te genezen; b. ertoe strekken een persoon voor het ontstaan van een
      ziekte te behoeden; c. ertoe strekken de gezondheidstoestand van een persoon te beoordelen; d. ertoe strekken
      verloskundige bijstand bij een persoon te verlenen; e. gericht zijn op het afnemen van bloed bij een persoon
      dan wel het wegnemen van weefsel, voor andere doeleinden dan die bedoeld onder a tot en met d; f. gericht zijn
      op het wegnemen van weefsel bij een overledene en het verrichten van sectie; g. gericht zijn op het aanbrengen,
      modificeren, herstructureren en wegnemen van weefsel bij een persoon, voor andere doeleinden dan die bedoeld onder
      a tot en met d;
        - *individuele gezondheidszorg:* zorg die rechtstreeks betrekking heeft op een persoon en ertoe strekt diens
      gezondheid te bevorderen of te bewaken, het onderzoeken en het geven van raad daaronder begrepen, waaronder
      geneeskunst;
        - *inspecteur:* de inspecteur van de Inspectie gezondheidszorg en jeugd;
        - *Onze Minister:* Onze Minister voor Medische Zorg;
        - *register:* een overeenkomstig [artikel 3, eerste lid][ref4], of [artikel 36b, eerste lid][ref5], ingesteld
      register;
        - *vooronderzoeker:* degene die op grond van [artikel 66, eerste lid][ref6], tot het verrichten van een
      vooronderzoek is aangewezen dan wel dit onderzoek als aangewezene heeft verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0006251#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0006251#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0006251#Artikel36
      [ref6]: https://wetten.overheid.nl/BWBR0006251#Artikel66
