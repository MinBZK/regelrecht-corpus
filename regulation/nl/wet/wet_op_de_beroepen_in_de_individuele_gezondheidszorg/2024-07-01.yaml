  - number: '92.3'
    text: |-
      De in het eerste lid bedoelde personen worden voor de toepassing van in andere wetten opgenomen bepalingen,
      betrekking hebbende op degenen die in het desbetreffende register ingeschreven staan, gelijkgesteld met
      laatstbedoelde personen, voor zover zulks noodzakelijk is in verband met het verrichten van de in het eerste lid
      bedoelde werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel92
  - number: '93'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van het gebruik van een bij de
      maatregel aangegeven onderscheidingsteken door degenen die in een bij de maatregel aangewezen register ingeschreven
      staan of aan wie krachtens [artikel 34, derde lid][ref1], het recht is voorbehouden een krachtens dat artikellid
      aangegeven titel te voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel34
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel93
