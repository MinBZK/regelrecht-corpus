  - number: '36.14'
    text: |-
      Tot het voorschrijven van UR-geneesmiddelen als bedoeld in
      [artikel 1, eerste lid, onder s, van de Geneesmiddelenwet][ref1] zijn bevoegd:


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel1
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel36
    references:
