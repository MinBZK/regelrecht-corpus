  - number: '3.1'
    text: |-
      Er worden registers ingesteld, waarin degenen die aan de daarvoor bij en krachtens deze wet gestelde
      voorwaarden voldoen, op hun aanvrage worden ingeschreven, onderscheidenlijk als: arts, tandarts, apotheker,
      gezondheidszorgpsycholoog, psychotherapeut, fysiotherapeut, verloskundige, verpleegkundige, physician assistant,
      orthopedagoog-generalist, klinisch technoloog.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel3
  - number: '3.2'
    text: |-
      Bij elke inschrijving worden in het register vermeld de naam, voornamen, geslacht, geboortedatum, nationaliteit en
      adres van de betrokkene en het nummer en het tijdstip van inschrijving. Bij ministeriële regeling kunnen gegevens
      worden aangewezen die ten behoeve van het identificeren van beroepsbeoefenaren bij de inschrijving worden vermeld.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel3
  - number: '3.3'
    text: |-
      De naam, de voorletters, het geslacht, het BIG-nummer en het betreffende beroep en specialisme van een
      ingeschrevene zijn openbaar. Bij ministeriële regeling kunnen andere gegevens worden aangewezen die openbaar zijn
      om een beroepsbeoefenaar in het register te kunnen vinden.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel3
  - number: '3.4'
    text: |-
      Indien de inschrijving van een beroepsbeoefenaar plaatsvindt op basis van een gedeeltelijke toegang als
      bedoeld in [artikel 12, eerste lid, van de Algemene wet erkenning EU-beroepskwalificaties][ref1], wordt
      dit bij de inschrijving aangetekend, waarbij wordt vermeld voor welke beroepswerkzaamheden de gedeeltelijke
      toegang geldt en onder welke beroepstitel die beroepsbeoefenaar zijn beroepswerkzaamheden op grond van
      [artikel 12, derde lid][ref2], uitvoert.


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel12
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '12'
        hoofdstuk: II
        paragraaf: '1'
  - number: '3.5'
    text: Elk register wordt ingesteld en beheerd door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel3
  - number: '3.6'
    text: |-
      De registers worden ingesteld ten einde te kunnen voldoen aan een verzoek om informatie als bedoeld in
      [artikel 12][ref1] en ten behoeve van het toezicht op de uitvoering van de [artikelen 4][ref2] en [17][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0006251#Artikel17
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '12'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0006251
        artikel: '17'
        hoofdstuk: II
        paragraaf: '2'
  - number: '3.7'
    text: |-
      De regionale tuchtcolleges en het centraal tuchtcollege hebben voor de uitoefening van hun taak als bedoeld in
      [hoofdstuk VII][ref1], toegang tot de informatie in de registers. Bij ministeriële regeling kunnen daarover nadere
      regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#HoofdstukVII
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006251
        hoofdstuk: VII
  - number: '4.1'
    text: |-
      Onverminderd [artikel 48, eerste lid, onder d][ref1], is aan degene die in een register ingeschreven staat het
      recht voorbehouden de in [artikel 3, eerste lid][ref2], aan de hoedanigheid waarin zij ingeschreven wordt, gegeven
      benaming als titel te voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel3
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '48'
        hoofdstuk: VII
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
  - number: '4.2'
    text: |-
      Het is degene wie het recht tot het voeren van een in deze wet geregelde titel niet toekomt op grond van het
      eerste lid, verboden deze titel, een daarop gelijkende benaming dan wel een op die titel betrekking hebbend
      onderscheidingsteken, aangegeven met toepassing van [artikel 93][ref1] of daarmee in hoofdzaak overeenstemmend,
      te voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel93
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '93'
        hoofdstuk: IX
  - number: '4.3'
    text: |-
      Waar in deze wet of in daarop berustende bepalingen personen met een der in [artikel 3, eerste lid][ref1], vermelde
      benamingen worden aangeduid, worden, voor zover niet anders blijkt, daaronder verstaan degenen die in het betrokken
      register ingeschreven staan.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel3
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
  - number: '4.4'
    text: |-
      Voor zover het tweede lid, en de [artikelen 17, tweede lid][ref1], [34, vierde lid][ref2],
      en [36a, derde lid, tweede volzin][ref3], een verbod inhouden op het voeren van een titel, is
      dat verbod niet van toepassing in het geval dat een beroepsbeoefenaar, aan wie op grond van
      [artikel 12, eerste lid, van de Algemene wet erkenning EU-beroepskwalificaties][ref4] gedeeltelijke toegang is
      verleend tot een op grond van het eerste lid aangewezen beroep, zijn beroepswerkzaamheden uitoefent onder de
      beroepstitel van zijn staat van herkomst of oorsprong.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0006251#Artikel36a
      [ref4]: https://wetten.overheid.nl/BWBR0023066#Artikel12
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '17'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '34'
        hoofdstuk: III
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0006251
        artikel: 36a
        hoofdstuk: IV
      - id: ref4
        bwb_id: BWBR0023066
        artikel: '12'
  - number: 4a
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald in welke gevallen en op welke wijze de
      beoefenaar van een beroep als bedoeld in [artikel 3, eerste lid][ref1], en van een beroep als bedoeld
      in[ artikel 36a, eerste lid][ref2], voor zover daarvoor een tijdelijk register als bedoeld in
      [artikel 36b, eerste lid][ref3], is ingesteld, het publiek kenbaar maakt onder welk BIG-nummer hij is
      ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel36a
      [ref3]: https://wetten.overheid.nl/BWBR0006251#Artikel36b
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: 36a
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0006251
        artikel: 36b
        hoofdstuk: IV
  - number: '5.1'
    text: |-
      Onze minister is bevoegd op de aanvrage tot inschrijving in een register te beslissen. Onze Minister is voorts
      bevoegd te beslissen op de aanvraag van een verpleegkundige tot vermelding in het register van de bevoegdheid
      van de aanvrager de krachtens [artikel 36, veertiende lid][ref1], aangewezen UR-geneesmiddelen voor te schrijven.
      De vermelding houdt mede in de aanduiding van de categorie van verpleegkundigen waartoe de aanvrager behoort.
      Onze Minister is bevoegd een vermelding als bedoeld in de vorige volzin door te halen indien de betrokken
      verpleegkundige niet meer voldoet aan de krachtens artikel 36, veertiende lid, onder d, gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel36
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '36'
        hoofdstuk: IV
  - number: '5.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over het bedrag dat voor de behandeling van
      een aanvraag als bedoeld in het eerste lid moet worden betaald alsmede over de wijze van indiening van een aanvrage
      en de daarbij te verstrekken gegevens of bescheiden, nodig voor de beoordeling van een aanvraag als bedoeld in het
      eerste lid. Het in de eerste volzin bedoelde bedrag wordt zodanig bepaald dat daarmee de kosten van de behandeling
      van een aanvraag als bedoeld in het eerste lid worden betaald.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel5
  - number: '5.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan een bedrag worden vastgesteld dat per in de maatregel
      aangewezen periode aan ingeschreven beroepsbeoefenaren in rekening wordt gebracht voor het ingeschreven zijn in het
      register. Het in de eerste volzin bedoelde bedrag wordt zodanig bepaald dat daarmee de kosten, verbonden aan het in
      het register ingeschreven zijn, worden gedekt.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel5
  - number: '5.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de uitvoering van
      [artikel 6, onderdeel f][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel6
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '6'
        hoofdstuk: II
        paragraaf: '1'
  - number: '6'
    text: 'De inschrijving wordt geweigerd:'
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel6
  - number: 6.a
    text: |-
      indien de aanvrager niet voldoet aan de in [hoofdstuk III][ref1] bedoelde opleidingseisen;


      [ref1]: https://wetten.overheid.nl/BWBR0006251#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006251
        hoofdstuk: III
  - number: 6.b
    text: |-
      indien de aanvrager ingevolge in kracht van gewijsde gegane rechterlijke uitspraak onder curatele is gesteld wegens
      lichamelijke of geestelijke toestand;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel6
  - number: 6.c
    text: indien de aanvrager ingevolge rechterlijke uitspraak ontzet is van het recht het betrokken beroep uit te oefenen;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel6
  - number: 6.d
    text: indien zulks voortvloeit uit een op grond van deze wet jegens de aanvrager genomen maatregel;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel6
  - number: 6.e
    text: |-
      indien ten aanzien van de aanvrager een maatregel, berustende op een in het buitenland gegeven rechterlijke,
      tuchtrechtelijke of bestuursrechtelijke beslissing, van kracht is op grond waarvan de aanvrager zijn rechten ter
      zake van de uitoefening van het betrokken beroep in het land waar de beslissing is gegeven tijdelijk of blijvend
      geheel heeft verloren,
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel6
  - number: 6.f
    text: indien de aanvrager de Nederlandse taal niet voldoende beheerst om zijn beroep in Nederland uit te kunnen oefenen.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel6
  - number: '7'
    text: 'De inschrijving wordt doorgehaald:'
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel7
  - number: 7.a
    text: in geval van overlijden van de ingeschrevene;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel7
  - number: 7.b
    text: op verzoek van de ingeschrevene;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel7
  - number: 7.c
    text: |-
      indien de ingeschrevene in een der in [artikel 6, onder b of c][ref1], genoemde omstandigheden is komen te
      verkeren;


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel6
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '6'
        hoofdstuk: II
        paragraaf: '1'
  - number: 7.d
    text: indien zulks voortvloeit uit een op grond van deze wet jegens de ingeschrevene genomen maatregel;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel7
  - number: 7.e
    text: |-
      indien ten aanzien van de ingeschrevene een maatregel, berustende op een in het buitenland gegeven rechterlijke,
      tuchtrechtelijke of bestuursrechtelijke beslissing van kracht is, op grond waarvan de ingeschrevene zijn rechten
      ter zake van de uitoefening van het betrokken beroep in het land waar de beslissing is gegeven tijdelijk of
      blijvend geheel heeft verloren;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel7
  - number: 7.f
    text: |-
      indien zulks voortvloeit uit een maatregel, berustend op een op grond van de [Wet medisch tuchtrecht BES][ref1]
      opgelegde maatregel, op grond waarvan de ingeschrevene zijn rechten ter zake van de uitoefening van het betrokken
      beroep tijdelijk of blijvend geheel heeft verloren.


      [ref1]: https://wetten.overheid.nl/BWBR0028542
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0028542
  - number: 7a.1
    text: |-
      Onze Minister kan [artikel 6, onderdeel e][ref1], en [artikel 7, onderdeel e][ref2], buiten toepassing laten of
      daarvan afwijken voor zover toepassing gelet op het belang dat deze bepalingen beogen te beschermen, zal leiden tot
      een onbillijkheid van overwegende aard.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel7
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '6'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '7'
        hoofdstuk: II
        paragraaf: '1'
  - number: 7a.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing ten aanzien van besluiten, bedoeld in [artikel 10][ref1], die
      strekken tot het plaatsen van een aantekening als bedoeld in [artikel 9, tweede lid, onderdeel a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel9
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '10'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '9'
        hoofdstuk: II
        paragraaf: '1'
  - number: '8.1'
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald dat de inschrijving in een bij de maatregel aangewezen register
      wordt doorgehaald indien na de in het tweede lid bedoelde datum een bij de maatregel aangegeven periode is
      verstreken.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel8
  - number: '8.2'
    text: 'De in het eerste lid bedoelde datum is de meest recente van de volgende data:'
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel8
  - number: 8.2.a
    text: |-
      de datum waarop de ingeschrevene een bij of krachtens [hoofdstuk III][ref1] of [VI][ref2] aangewezen getuigschrift
      of een in [artikel 41, eerste lid, onder b][ref3], bedoelde verklaring of de datum waarop de ingeschrevene een
      diploma heeft behaald op grond waarvan de ingeschrevene een erkenning van beroepskwalificaties als bedoeld in de
      [Algemene wet erkenning EU-beroepskwalificaties][ref4] heeft verkregen;


      [ref1]: https://wetten.overheid.nl/BWBR0006251#HoofdstukIII
      [ref2]: https://wetten.overheid.nl/BWBR0006251#HoofdstukVI
      [ref3]: https://wetten.overheid.nl/BWBR0006251#Artikel41
      [ref4]: https://wetten.overheid.nl/BWBR0023066
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006251
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0006251
        hoofdstuk: VI
      - id: ref3
        bwb_id: BWBR0006251
        artikel: '41'
        hoofdstuk: VI
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0023066
  - number: 8.2.b
    text: |-
      de naar aanleiding van een aanvrage van de ingeschrevene in het register aangetekende datum voorafgaand waaraan hij
      in de in het eerste lid bedoelde periode overeenkomstig door Onze Minister gestelde regels met goed gevolg scholing
      heeft afgerond of de datum van toelating tot een opleiding die leidt tot een wettelijk erkend specialisme als
      bedoeld in [artikel 14, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel14
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '14'
        hoofdstuk: II
        paragraaf: '2'
  - number: 8.2.c
    text: |-
      de naar aanleiding van een aanvrage van de ingeschrevene in het register aangetekende datum voorafgaande waaraan de
      ingeschrevene op het desbetreffende gebied van de beroepsuitoefening werkzaamheden heeft verricht die wat betreft
      duur in de in het eerste lid bedoelde periode voldoen aan bij algemene maatregel van bestuur te stellen regelen.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel8
  - number: '8.3'
    text: |-
      In afwijking van het eerste lid wordt de inschrijving van een specialist, waarvoor een regeling geldt als bedoeld
      in [artikel 15, eerste lid][ref1], in het in het eerste lid bedoelde register niet doorgehaald zolang deze als
      specialist is ingeschreven in een erkend specialistenregister.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel15
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '15'
        hoofdstuk: II
        paragraaf: '2'
  - number: '8.4'
    text: |-
      Op een aanvrage als bedoeld in het tweede lid, onder b of c, is [artikel 5][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel5
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '5'
        hoofdstuk: II
        paragraaf: '1'
  - number: '8.5'
    text: |-
      De doorhaling blijft achterwege zolang niet is beslist op een reeds ingediende aanvrage tot aantekening van een
      datum als bedoeld in het tweede lid, onder b of c.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel8
  - number: '8.6'
    text: |-
      Ingeval ten aanzien van een bepaald register toepassing is gegeven aan het eerste lid wordt, onverminderd het
      bepaalde in [artikel 6][ref1], inschrijving in dat register geweigerd indien de aanvrager niet in de krachtens het
      eerste lid vastgestelde periode, voorafgaande aan de indiening van de aanvrage tot inschrijving, een getuigschrift,
      een verklaring of een diploma als bedoeld in het tweede lid heeft verkregen dan wel een scholing of tijdvak van
      werkzaamheid als bedoeld in dat lid heeft afgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel6
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '6'
        hoofdstuk: II
        paragraaf: '1'
  - number: '8.7'
    text: 'Onze Minister kan:'
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel8
  - number: 8.7.a
    text: |-
      eisen vaststellen waaraan de aard van de werkzaamheden, bedoeld in het tweede lid, onder *c*, voor de toepassing
      van dit artikel moeten voldoen;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel8
  - number: 8.7.b
    text: |-
      al dan niet op het gebied van de individuele gezondheidszorg liggende werkzaamheden aanwijzen die voor
      de toepassing van dit artikel worden gelijkgesteld met werkzaamheden op het desbetreffende gebied der
      beroepsuitoefening.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel8
  - number: '9.1'
    text: |-
      In het register wordt, indien zulks voortvloeit uit een op grond van deze wet genomen maatregel of besluit, een
      aantekening geplaatst van:
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel9
  - number: 9.1.a
    text: |-
      een opgelegde berisping indien dit op grond van [artikel 48, elfde lid][ref1], door het regionale tuchtcollege of
      het centraal tuchtcollege is beslist;


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel48
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '48'
        hoofdstuk: VII
        paragraaf: '2'
  - number: 9.1.b
    text: |-
      een opgelegde geldboete indien dit op grond van [artikel 48, elfde lid][ref1], door het regionale tuchtcollege of
      het centraal tuchtcollege is beslist;


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel48
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '48'
        hoofdstuk: VII
        paragraaf: '2'
  - number: 9.1.c
    text: |-
      de schorsing van de bevoegdheid, bedoeld in [artikel 48, eerste lid, onder d][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel48
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '48'
        hoofdstuk: VII
        paragraaf: '2'
  - number: 9.1.d
    text: de voorwaarden die zijn opgelegd;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel9
  - number: 9.1.e
    text: de gedeeltelijke ontzegging van de bevoegdheid het betrokken beroep uit te oefenen;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel9
  - number: 9.1.f
    text: |-
      de doorhaling van de inschrijving in het register op grond van [artikel 7, onder c, d of e][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel7
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '7'
        hoofdstuk: II
        paragraaf: '1'
  - number: 9.1.g
    text: de ontzegging van het recht wederom in het register te worden ingeschreven;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel9
  - number: 9.1.h
    text: |-
      het eindigen van een schorsing, anders dan ten gevolge van het verstrijken van de in een maatregel vastgestelde
      tijdsduur;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel9
  - number: 9.1.i
    text: |-
      het niet langer gelden van de onder e bedoelde voorwaarden, anders dan ten gevolge van het verstrijken van de
      proeftijd, en van de onder f bedoelde ontzegging;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel9
  - number: 9.1.j
    text: |-
      de bevoegdheid van een krachtens [artikel 5][ref1] aangewezen beroepsbeoefenaar om de krachtens
      [artikel 36, veertiende lid][ref2], aangewezen UR-geneesmiddelen voor te schrijven, onder vermelding van de
      categorie van beroepsbeoefenaren waartoe de betrokken beroepsbeoefenaar behoort;


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel36
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '5'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '36'
        hoofdstuk: IV
  - number: 9.1.k
    text: |-
      de op grond van [artikel 48, tweede lid][ref1], opgelegde beperkingen met betrekking tot het beroepsmatig handelen
      op het gebied van de individuele gezondheidszorg;


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel48
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '48'
        hoofdstuk: VII
        paragraaf: '2'
  - number: 9.1.l
    text: |-
      de beslissing als bedoeld in [artikel 48a, tweede lid][ref1], tot de tenuitvoerlegging van een voorwaardelijke
      maatregel;


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel48a
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: 48a
        hoofdstuk: VII
        paragraaf: '2'
  - number: 9.1.m
    text: |-
      de last tot onmiddellijke onthouding van de beroepsactiviteiten, bedoeld in [artikel 85a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel85a
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: 85a
        hoofdstuk: VIIIA
  - number: '9.2'
    text: |-
      In het register wordt ten aanzien van een geregistreerd of voormalig geregistreerd beroepsbeoefenaar een
      aantekening geplaatst van:
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel9
  - number: 9.2.a
    text: |-
      een in het buitenland gegeven rechterlijke, tuchtrechtelijke of bestuursrechtelijke beslissing op grond waarvan
      de beroepsbeoefenaar zijn rechten ter zake van de uitoefening van het recht het betrokken beroep uit te oefenen
      in het land waar de beslissing is gegeven tijdelijk of blijvend geheel of gedeeltelijk heeft verloren. Indien
      die rechterlijke uitspraak tevens inhoudt een beperking in het recht om andere beroepen in de individuele
      gezondheidszorg uit te oefenen, wordt die beperking eveneens aangetekend.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel9
  - number: 9.2.b
    text: |-
      een op grond van de [Wet medisch tuchtrecht BES][ref1] gegeven tuchtrechtelijke beslissing op grond waarvan de
      beroepsbeoefenaar zijn rechten ter zake van de uitoefening van het betrokken beroep op Bonaire, St. Eustatius en
      Saba tijdelijk of blijvend geheel of gedeeltelijk dan wel voorwaardelijk heeft verloren. Indien die tuchtrechtelijk
      beslissing tevens inhoudt een beperking in het recht om andere beroepen in de individuele gezondheidszorg uit te
      oefenen, wordt die beperking eveneens aangetekend.


      [ref1]: https://wetten.overheid.nl/BWBR0028542
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0028542
  - number: '9.3'
    text: |-
      In het register wordt een aantekening geplaatst van een aan de beroepsbeoefenaar op grond van de
      [Wet kwaliteit, klachten en geschillen zorg][ref1] gegeven bevel of aanwijzing, indien dat bevel of die aanwijzing
      inhoudt dat aan de betrokkene een beperking is opgelegd in de uitoefening van het betrokken beroep.


      [ref1]: https://wetten.overheid.nl/BWBR0037173
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0037173
  - number: '9.4'
    text: |-
      In het register wordt ten aanzien van een geregistreerd of voormalig geregistreerd beroepsbeoefenaar een
      aantekening geplaatst van:
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel9
  - number: 9.4.a
    text: |-
      rechterlijke uitspraken inhoudende de ontzetting van of beperking op het recht het betrokken beroep uit te oefenen.
      Indien die rechterlijke uitspraak tevens inhoudt een ontzetting van of beperking in het recht om ook andere
      beroepen in de individuele gezondheidszorg uit te oefenen, wordt die ontzetting of beperking eveneens aangetekend.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel9
  - number: 9.4.b
    text: |-
      een op grond van [artikel 14c, tweede lid, van het Wetboek van Strafrecht][ref1] gestelde bijzondere voorwaarde
      waaruit een inperking voortvloeit van de bevoegdheid het betrokken beroep uit te oefenen. Indien die bijzondere
      voorwaarde tevens inhoudt een beperking van de bevoegdheid om andere beroepen in de individuele gezondheidszorg uit
      te oefenen, wordt die inperking eveneens aangetekend.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel14c
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 14c
  - number: '9.5'
    text: 'Bij een aantekening als bedoeld in het eerste tot en met vierde lid wordt vermeld:'
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel9
  - number: 9.5.a
    text: |-
      de datum waarop van de schorsing een aantekening wordt geplaatst alsmede de duur van de schorsing, indien die reeds
      bekend is;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel9
  - number: 9.5.b
    text: |-
      de datum waarop de berisping, de geldboete, de in het eerste lid bedoelde voorwaarden, de ontzegging, de
      doorhaling, de ontzegging van het recht op wederinschrijving, de last tot onmiddellijke onthouding van de
      beroepsactiviteiten of het bevel of de aanwijzing, bedoeld in het derde lid, zijn gaan gelden alsmede, ingeval de
      voorwaarden of de in het tweede lid bedoelde maatregel tot een proeftijd zijn beperkt, de duur daarvan dan wel
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel9
  - number: 9.5.c
    text: |-
      de datum waarop de schorsing of de last tot onmiddellijke onthouding van de beroepsactiviteiten is geëindigd of
      vanaf welke de in eerste lid bedoelde voorwaarden of de in het tweede en derde lid bedoelde maatregelen niet langer
      gelden.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel9
  - number: '9.6'
    text: |-
      Indien de in het tweede lid bedoelde aantekening in het register is geplaatst, geldt de in het buitenland
      dan wel de op grond van de [Wet medisch tuchtrecht BES][ref1] opgelegde bevoegdheidsbeperking ook voor de
      beroepsuitoefening in Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0028542
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0028542
  - number: '9.7'
    text: |-
      De in het eerste, tweede, derde, vierde en achtste lid bedoelde aantekening wordt gedurende een bij algemene
      maatregel van bestuur bepaalde termijn in het register vermeld en daarbij wordt indien bekend de aard van het
      verwijt vermeld dat tot de aantekening heeft geleid, alsmede een met redenen omklede toelichting op een genomen
      maatregel als bedoeld in [artikel 48, eerste lid, onder b en c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel48
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '48'
        hoofdstuk: VII
        paragraaf: '2'
  - number: '9.8'
    text: |-
      In het register wordt voorts een aantekening geplaatst van een maatregel als bedoeld in
      [artikel 7, eerste lid, onderdelen b en c, van de Wet medisch tuchtrecht BES][ref1], indien dit op grond van
      artikel 7, vijfde lid, van de Wet medisch tuchtrecht BES, door het College is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0028542#Artikel7
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0028542
        artikel: '7'
  - number: '10.1'
    text: |-
      Iedere inschrijving, aantekening of doorhaling in een register geschiedt op grond van een daartoe strekkende
      gedagtekende beschikking.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel10
  - number: '10.2'
    text: |-
      Onze Minister zendt een afschrift van een beschikking als bedoeld in het
      eerste lid aan de beheerder van het register van zorgaanbieders, bedoeld in
      [artikel 14 van de Wet aanvullende bepalingen verwerking persoonsgegevens in de zorg][ref1] en, indien de
      inschrijving, aantekening of doorhaling een arts, een psychotherapeut of een orthopedagoog-generalist betreft, de
      beheerder van de autorisatielijst van jeugdhulpaanbieders, bedoeld in [artikel 7.2.7 van de Jeugdwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0023864#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0023864
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '7'
  - number: '11.1'
    text: 'Onze Minister draagt zorg voor openbare kennisgeving van:'
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel11
  - number: 11.1.a
    text: |-
      hetgeen op grond van [artikel 9][ref1] in het register is aangetekend en vermeld, met dien verstande dat van de
      aan een beroepsbeoefenaar opgelegde voorwaarden uitsluitend wordt kennisgegeven in de bij algemene maatregel van
      bestuur aan te geven gevallen;


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel9
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '9'
        hoofdstuk: II
        paragraaf: '1'
  - number: 11.1.b
    text: |-
      de maatregelen bedoeld in [artikel 48, eerste lid, onderdelen b en c][ref1], welke op grond van
      [artikel 36a, zesde lid][ref2], zijn opgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel36a
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '48'
        hoofdstuk: VII
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: 36a
        hoofdstuk: IV
  - number: 11.1.c
    text: |-
      de wederinschrijving van een persoon ingeval op grond van onderdeel a openbaar kennis is gegeven van een eerdere
      doorhaling van de voorafgaande wederinschrijving van die persoon.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel11
  - number: '11.2'
    text: |-
      In de openbare kennisgeving worden de naam en de woonplaats van de betrokkene vermeld. Bij de openbare kennisgeving
      als bedoeld in het eerste lid, onderdeel a en c, wordt eveneens het BIG-nummer vermeld. De openbare kennisgeving
      geschiedt op bij algemene maatregel van bestuur te regelen wijze en voor de daarbij vast te stellen duur, met dien
      verstande dat de kennisgeving in ieder geval in de *Staatscourant* geschiedt.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel11
  - number: '12.1'
    text: Aan de betrokkene wordt op diens verlangen medegedeeld wat te zijnen aanzien in het register vermeld staat.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel12
  - number: '12.2'
    text: 'Aan een ieder die zulks verlangt, wordt medegedeeld:'
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel12
  - number: 12.2.a
    text: |-
      of een persoon in een register ingeschreven staat alsmede de ten aanzien van die persoon opgenomen gegevens die bij
      ministeriële regeling op grond van [artikel 3, derde lid][ref1], zijn aangewezen;


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel3
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
  - number: 12.2.b
    text: |-
      hetgeen ten aanzien van een beroepsbeoefenaar op grond van [artikel 9][ref1] in het register is aangetekend en
      vermeld, met dien verstande dat van de aan een beroepsbeoefenaar opgelegde voorwaarden uitsluitend mededeling wordt
      gedaan in de bij algemene maatregel van bestuur aan te geven gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel9
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '9'
        hoofdstuk: II
        paragraaf: '1'
  - number: '12.3'
    text: |-
      De verstrekking van mededelingen, bedoeld in het tweede lid, anders dan aan bestuursorganen en daaronder
      ressorterende diensten, geschiedt, voor zover zij schriftelijk plaats vindt, tegen betaling van een vergoeding
      volgens een bij algemene maatregel van bestuur vast te stellen tarief.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel12
  - number: '13'
    text: |-
      De in de registers opgenomen gegevens kunnen tevens worden gebruikt ten behoeve van de uitvoering van de
      [Noodwet geneeskundigen][ref1], de [Wet marktordening gezondheidszorg][ref2] en de toezending van informatie,
      de volksgezondheid betreffende, door de Inspectie gezondheidszorg en jeugd of door andere door Onze Minister
      aangewezen bestuursorganen aan de in registers ingeschreven personen.


      [ref1]: https://wetten.overheid.nl/BWBR0002758
      [ref2]: https://wetten.overheid.nl/BWBR0020078
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002758
      - id: ref2
        bwb_id: BWBR0020078
  - number: 13a.1
    text: |-
      Onverminderd [hoofdstuk 11 van de Wet bescherming persoonsgegevens][ref1] kan Onze
      Minister besluiten de bevoegde autoriteiten van andere staten dan de staten bedoeld in
      [artikel 31a, eerste lid, van de Algemene wet erkenning EU-beroepskwalificaties][ref2] onverwijld in kennis
      te stellen van een in Nederland door een rechterlijke instantie of een andere bij of krachtens de wet bevoegde
      instantie aan een beroepsbeoefenaar opgelegd verbod of een opgelegde beperking van een beroep dat op grond van
      [artikel 3][ref3], [34][ref4] of [36a][ref5] is gereguleerd.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Hoofdstuk11
      [ref2]: https://wetten.overheid.nl/BWBR0023066#Artikel31a
      [ref3]: https://wetten.overheid.nl/BWBR0006251#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0006251#Artikel34
      [ref5]: https://wetten.overheid.nl/BWBR0006251#Artikel36a
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0011468
        hoofdstuk: '11'
      - id: ref2
        bwb_id: BWBR0023066
        artikel: 31a
      - id: ref3
        bwb_id: BWBR0006251
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0006251
        artikel: '34'
        hoofdstuk: III
        afdeling: '2'
      - id: ref5
        bwb_id: BWBR0006251
        artikel: 36a
        hoofdstuk: IV
  - number: 13a.2
    text: |-
      Een kennisgeving op grond van een besluit als bedoeld in het eerste lid kan slechts plaatsvinden indien het
      opgelegd verbod of de opgelegde beperking van kracht is en Onze Minister over informatie beschikt waaruit blijkt
      dat de beroepsbeoefenaar in de staat waaraan de kennisgeving wordt gedaan woonachtig is, woonachtig is geweest,
      zijn beroep heeft uitgeoefend, uitoefent of voornemens is uit te oefenen.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel13a
  - number: 13a.3
    text: 'De kennisgeving bevat de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel13a
  - number: 13a.3.a
    text: naam, adres, woonplaats, geboortedatum van de beroepsbeoefenaar;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel13a
  - number: 13a.3.b
    text: het betrokken beroep;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel13a
  - number: 13a.3.c
    text: de instantie die het verbod of de beperking heeft opgelegd;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel13a
  - number: 13a.3.d
    text: de reikwijdte van de beperking of het verbod; en
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel13a
  - number: 13a.3.e
    text: de periode gedurende welke de beperking of het verbod van kracht is.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel13a
  - number: 13a.4
    text: De instanties, bedoeld in het eerste lid, verstrekken Onze Minister de gegevens, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel13a
  - number: 13a.5
    text: |-
      Indien een verbod of een beperking is ingesteld voor onbepaalde tijd, stelt Onze Minister de bevoegde autoriteiten,
      bedoeld in het eerste lid, onverwijld in kennis van de beëindiging daarvan.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel13a
  - number: 13a.6
    text: |-
      Indien tegen een op grond van het eerste lid genomen besluit bezwaar of beroep aanhangig wordt gemaakt, deelt
      Onze Minister dit mede aan de bevoegde autoriteiten van de landen die op grond van het eerste lid in kennis zijn
      gesteld.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel13a
  - number: 13b.1
    text: |-
      Indien bij besluit van Onze Minister inschrijving in een register is geweigerd, de afgifte van een
      verklaring van vakbekwaamheid wordt geweigerd of een beroepsbeoefenaar de bevoegdheid zijn beroep uit te
      oefenen heeft verloren omdat hij de aanvraag tot inschrijving of tot afgifte van een verklaring gebaseerd
      heeft op valse kwalificaties, kan Onze Minister besluiten, onverminderd de hoofdstuk V van de Algemene
      verordening gegevensbescherming, de bevoegde autoriteiten van andere staten dan de staten bedoeld in
      [artikel 31a, eerste lid, van de Algemene wet erkenning EU-beroepskwalificaties][ref1], daarvan in kennis stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel31a
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel13b
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: 31a
  - number: 13b.2
    text: |-
      [Artikel 13a, tweede tot en met zesde lid][ref1], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel13a
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel13b
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: 13a
        hoofdstuk: II
        paragraaf: '1'
  - number: 13c.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan worden bepaald dat het nummer, bedoeld in
      [artikel 3, tweede lid][ref1], wordt gebruikt ter bevordering van transparantie inzake financiële betrekkingen
      tussen beroepsbeoefenaren als bedoeld in artikel 3, eerste lid, en bedrijven in een daartoe gehouden register.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel3
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel13c
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
  - number: 13c.2
    text: |-
      Bij toepassing van het eerste lid, zendt Onze Minister jaarlijks aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van het in het eerste lid bedoelde register.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel13c
  - number: '14.1'
    text: |-
      Indien een organisatie van beoefenaren van een beroep als bedoeld in [artikel 3][ref1], voor de inschrijving van
      beroepsbeoefenaren die een bijzondere deskundigheid hebben verworven met betrekking tot de uitoefening van een
      deelgebied van hun beroep, een specialistenregister heeft en daaraan een titel is verbonden, kan Onze Minister
      bepalen dat die titel als wettelijk erkende specialistentitel wordt aangemerkt. Een aanvraag daartoe wordt gedaan
      door het bestuur van de organisatie; het bestuur kan de bevoegdheid daartoe overdragen aan het orgaan, bedoeld in
      het tweede lid, onder d.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel3
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
  - number: '14.2'
    text: |-
      Een dergelijk besluit neemt Onze Minister uitsluitend indien dat wenselijk is ter bevordering van de goede
      uitoefening van de individuele gezondheidszorg en indien aan de volgende voorwaarden is voldaan:
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel14
  - number: 14.2.a
    text: |-
      de organisatie is, naar het oordeel van Onze Minister, voldoende representatief voor de beoefenaren van het
      betrokken beroep;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel14
  - number: 14.2.b
    text: de organisatie is een vereniging met volledige rechtsbevoegdheid;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel14
  - number: 14.2.c
    text: |-
      de organisatie stelt regels waarin in ieder geval worden vastgelegd - de procedure voor de besluitvorming binnen de
      organisatie met betrekking tot het instellen van een specialistenregister,
        - de taken en samenstelling van de verschillende organen en
        - het bedrag dat, ter dekking van de kosten, voor de behandeling van een aanvraag voor inschrijving en voor
      erkenning van een opleidingsinstelling, onderscheidenlijk opleider, is verschuldigd;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel14
  - number: 14.2.d
    text: |-
      de organisatie kent een orgaan dat - belast is met het besluit tot instelling van een specialistenregister, en
        - regels stelt met betrekking tot de eisen die gesteld worden aan de inschrijving als specialist en aan de
      erkenning van opleidingsinstellingen, onderscheidenlijk opleiders, voor een specialisme;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel14
  - number: 14.2.e
    text: |-
      de organisatie kent tevens een orgaan dat is belast met - de inschrijving van specialisten,
        - de erkenning van opleidingsinstellingen, onderscheidenlijk de opleiders en
        - het toezicht op de uitvoering van de regels door de erkende opleidingsinstellingen, onderscheidenlijk opleiders.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel14
  - number: '14.3'
    text: |-
      Een door een orgaan als bedoeld in het tweede lid, onder d, vastgestelde regeling is in overeenstemming met de
      bij of krachtens het Verdrag tot oprichting van de Europese Gemeenschap of de Overeenkomst betreffende de Europese
      Economische Ruimte gestelde regels en de op 21 juni 1999 te Luxemburg totstandgekomen Overeenkomst tussen de
      Europese Gemeenschap en haar lidstaten, enerzijds, en de Zwitserse Bondsstaat anderzijds, over het vrije verkeer
      van personen (Trb. 2000, 16 en 86).
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel14
  - number: '14.4'
    text: |-
      De regelingen, bedoeld in het tweede lid, onder c en d, behoeven de instemming van Onze Minister; de instemming kan
      worden onthouden wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel14
  - number: '14.5'
    text: Inschrijving in een erkend specialistenregister is niet afhankelijk van het lidmaatschap van de organisatie.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel14
  - number: '14.6'
    text: |-
      Inschrijving in een erkend specialistenregister is uitsluitend mogelijk voor personen die in het betrokken register
      zijn ingeschreven.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel14
  - number: '14.7'
    text: |-
      Aan een ieder die zulks verlangt wordt door de beheerder van een erkend specialistenregister meegedeeld of een
      persoon in het specialistenregister is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel14
  - number: '14.8'
    text: |-
      Onze Minister kan een orgaan als bedoeld in het tweede lid, onder d, met betrekking tot de in dit artikel
      bedoelde taken in verband met bindende besluiten van de Europese Gemeenschap alsmede ter bevordering van de
      goede uitoefening van de individuele gezondheidszorg aanwijzingen geven. Alvorens daartoe over te gaan hoort hij
      het betrokken orgaan. Een aanwijzing kan niet inhouden dat een specialistenregister voor een bepaald deelgebied
      tot stand dient te worden gebracht. Een aanwijzing heeft geen betrekking op een individuele specialist,
      opleidingsinstelling of opleider.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel14
  - number: '14.9'
    text: |-
      Onze Minister kan een op grond van het eerste lid genomen besluit intrekken indien niet meer wordt voldaan aan het
      bepaalde in dit artikel.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel14
  - number: '14.10'
    text: |-
      Het orgaan, bedoeld in het tweede lid, onder d, verstrekt desgevraagd aan Onze Minister de voor de uitoefening van
      zijn taak benodigde inlichtingen. Onze Minister kan inzage vorderen van zakelijke gegevens en bescheiden voor zover
      dat voor de vervulling van zijn taak redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel14
  - number: '14.11'
    text: |-
      De [Kaderwet zelfstandige bestuursorganen][ref1] is van toepassing op een orgaan als bedoeld in het tweede
      lid, onder e, voor zover dit orgaan werkzaamheden uitoefent met betrekking tot een erkend specialistenregister.
      In afwijking van de eerste volzin is [artikel 22 van de Kaderwet zelfstandige bestuursorganen][ref2] niet van
      toepassing, voor zover het besluiten betreft ter zake van de inschrijving.


      [ref1]: https://wetten.overheid.nl/BWBR0020495
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel22
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0020495
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '22'
  - number: '14.12'
    text: 'In de Staatscourant wordt mededeling gedaan van:'
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel14
  - number: 14.12.a
    text: de besluiten van Onze Minister krachtens het eerste, vierde, achtste en negende lid;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel14
  - number: 14.12.b
    text: vaststelling en wijziging van een regeling als bedoeld in het tweede lid, onder c en d.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel14
  - number: '15.1'
    text: |-
      Een regeling als bedoeld in [artikel 14, tweede lid, onder d][ref1], kan mede inhouden dat degene die de opleiding
      tot specialist heeft voltooid wordt ingeschreven als specialist voor een bij de regeling bepaalde periode en dat
      een aansluitende hernieuwde inschrijving slechts plaatsvindt indien de specialist gedurende een bij die regeling
      bepaald tijdvak, voorafgaand aan de indiening van de aanvraag tot hernieuwde inschrijving, regelmatig op het
      desbetreffende deelgebied van de beroepsuitoefening werkzaam is geweest dan wel het beroep zal uitoefenen onder de
      bij de hernieuwde inschrijving aan te geven scholingsvoorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel14
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '14'
        hoofdstuk: II
        paragraaf: '2'
  - number: '15.2'
    text: 'Indien in een regeling toepassing is gegeven aan het eerste lid kunnen in die regeling:'
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel15
  - number: 15.2.a
    text: |-
      eisen worden vastgesteld waaraan de werkzaamheden, bedoeld in het eerste lid, voor de toepassing van dat lid moeten
      voldoen;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel15
  - number: 15.2.b
    text: |-
      al dan niet op het gebied van de individuele gezondheidszorg liggende werkzaamheden worden aangewezen die voor
      de toepassing van het eerste lid worden gelijkgesteld met werkzaamheden op het desbetreffende deelgebied der
      beroepsuitoefening;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel15
  - number: 15.2.c
    text: |-
      tevens eisen worden gesteld ter zake van deelname aan deskundigheidsbevorderende activiteiten gedurende de in het
      eerste lid bedoelde periode van werkzaam zijn.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel15
  - number: '15.3'
    text: |-
      Een regeling als bedoeld in het eerste lid biedt aan degene die niet opnieuw als specialist wordt ingeschreven
      vanwege het niet voldoen aan de daartoe gestelde eisen, de mogelijkheid wederom als specialist te worden
      ingeschreven zodra door het volgen van scholing, die is afgestemd op het kennis- en vaardigheidsniveau van
      betrokkene, opnieuw wordt voldaan aan de eisen voor zodanige inschrijving.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel15
  - number: '15.4'
    text: |-
      In gevallen waarin toepassing is gegeven aan [artikel 14, eerste lid][ref1], is de beroepsorganisatie gehouden
      van elke inschrijving als specialist en van elke doorhaling van een zodanige inschrijving opgave te doen aan Onze
      Minister. Van elke inschrijving en van elke doorhaling van een inschrijving wordt een gedagtekende aantekening
      in het register geplaatst. Indien een inschrijving als specialist is doorgehaald op grond van een regeling als
      bedoeld in het eerste lid, vindt de in de eerste en tweede volzin bedoelde opgave, onderscheidenlijk aantekening,
      alleen plaats indien de desbetreffende persoon niet binnen vier weken na de doorhaling wederom als specialist is
      ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel14
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '14'
        hoofdstuk: II
        paragraaf: '2'
  - number: '15.5'
    text: |-
      Onverminderd hetgeen ingevolge [artikel 12, tweede lid][ref1], met betrekking tot de ingeschrevene geldt, wordt aan
      een ieder die zulks verlangt, medegedeeld of de betrokkene is ingeschreven als specialist.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel12
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '12'
        hoofdstuk: II
        paragraaf: '1'
  - number: '15.6'
    text: |-
      Doorhaling van een inschrijving in het register of schorsing van de bevoegdheid de aan de inschrijving verbonden
      rechten uit te oefenen, heeft tot gevolg dat de inschrijving van de betrokkene als specialist is vervallen,
      onderscheidenlijk dienovereenkomstig is geschorst. Van elke doorhaling of schorsing wordt mededeling gedaan aan de
      betrokken organisatie.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel15
  - number: '16'
    text: |-
      Indien op een bepaald deelgebied van een beroep als bedoeld in [artikel 3][ref1] geen erkend specialistenregister
      bestaat en zulks in verband met bindende besluiten van de Europese Gemeenschap wel noodzakelijk is, dan wel dat ter
      bevordering van de goede uitoefening van de individuele gezondheidszorg gewenst is, kunnen bij algemene maatregel
      van bestuur ter zake regels worden gesteld. [Artikel 15][ref2] is op een bij die regels in het leven geroepen
      specialistenregister van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel15
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '15'
        hoofdstuk: II
        paragraaf: '2'
  - number: '17.1'
    text: |-
      Het recht om een specialistentitel te voeren is voorbehouden aan degenen die zijn ingeschreven in het
      desbetreffende erkende specialistenregister.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel17
  - number: '17.2'
    text: |-
      Het is degene wie het recht tot het voeren van een krachtens deze wet erkende specialisten-titel niet toekomt op
      grond van het eerste lid, verboden deze titel of een daarop gelijkende benaming te voeren.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel17
  - number: '17.3'
    text: |-
      Voor zover het tweede lid, en de [artikelen 4, tweede lid][ref1], [34, vierde lid][ref2], en
      [36a, derde lid, tweede volzin][ref3], een verbod inhouden op het voeren van een titel, is dat verbod niet van
      toepassing in het geval dat een beroepsbeoefenaar met toepassing van artikel 4 septies van Richtlijn nr. 2005/36/
      EG van het Europees Parlement en de Raad van de Europese Unie van 7 september 2005 betreffende de erkenning
      van beroepskwalificaties (PbEU 2005, L 255) door een organisatie als bedoeld in [artikel 14, eerste lid][ref4],
      gedeeltelijk is toegelaten tot een beroep waarvan de beoefenaar de bevoegdheid heeft een titel te voeren, en
      die beroepsbeoefenaar zijn beroepswerkzaamheden uitoefent onder de beroepstitel van zijn staat van herkomst of
      oorsprong.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0006251#Artikel36a
      [ref4]: https://wetten.overheid.nl/BWBR0006251#Artikel14
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '34'
        hoofdstuk: III
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0006251
        artikel: 36a
        hoofdstuk: IV
      - id: ref4
        bwb_id: BWBR0006251
        artikel: '14'
        hoofdstuk: II
        paragraaf: '2'
  - number: '18'
    text: |-
      Om in het desbetreffende register als arts te kunnen worden ingeschreven, wordt vereist het bezit van een
      getuigschrift waaruit blijkt dat de betrokkene voldoet aan de daartoe bij algemene maatregel van bestuur gestelde
      opleidingseisen.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel18
  - number: '19.1'
    text: |-
      Tot het gebied van deskundigheid van de arts wordt gerekend het verrichten van handelingen op het gebied van de
      geneeskunst.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel19
  - number: '19.2'
    text: |-
      In de gevallen waarin een huisarts dan wel een arts die in die hoedanigheid in dienst is van het Ministerie van
      Defensie, op grond van de [Geneesmiddelenwet][ref1] bevoegd is geneesmiddelen te bereiden of ter hand te stellen,
      behoort het bereiden of ter hand stellen mede tot het gebied van zijn deskundigheid.


      [ref1]: https://wetten.overheid.nl/BWBR0021505
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0021505
  - number: '20'
    text: |-
      Om in het desbetreffende register als tandarts te kunnen worden ingeschreven, wordt vereist het bezit van een
      getuigschrift waaruit blijkt dat de betrokkene voldoet aan de daartoe bij algemene maatregel van bestuur gestelde
      opleidingseisen.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel20
  - number: '21'
    text: |-
      Tot het gebied van deskundigheid van de tandarts wordt gerekend het verrichten van handelingen op het gebied van
      de tandheelkunst.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel21
  - number: '22'
    text: |-
      Om in het desbetreffende register als apotheker te kunnen worden ingeschreven, wordt vereist het bezit van een
      getuigschrift waaruit blijkt dat de betrokkene voldoet aan de daartoe bij algemene maatregel van bestuur gestelde
      opleidingseisen
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel22
  - number: '23'
    text: |-
      Tot het gebied van deskundigheid van de apotheker worden gerekend het bereiden van geneesmiddelen, het bewaren van
      geneesmiddelen onder de daarvoor volgens de stand van de wetenschap geschikte omstandigheden, het ter hand stellen,
      bedoeld in [artikel 1, eerste lid, onder ll, van de Geneesmiddelenwet][ref1], het geven van advies aan de patiënten
      aan wie geneesmiddelen ter hand worden gesteld over het gebruik daarvan, het bewaken van het gebruik van de aan
      patiënten ter hand gestelde geneesmiddelen.


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel1
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '1'
  - number: '24'
    text: |-
      Om in het desbetreffende register als gezondheidszorgpsycholoog te kunnen worden ingeschreven, wordt vereist het
      bezit van een getuigschrift waaruit blijkt dat de betrokkene voldoet aan de daartoe bij algemene maatregel van
      bestuur gestelde opleidingseisen.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel24
  - number: '25'
    text: |-
      Tot het gebied van deskundigheid van de gezondheidszorgpsycholoog wordt gerekend het verrichten van psychologisch
      onderzoek, het beoordelen van de resultaten daarvan alsmede het toepassen van bij algemene maatregel van
      bestuur aan te wijzen psychologische behandelingsmethoden ten aanzien van een persoon met het oog op diens
      gezondheidstoestand.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel25
  - number: '26.1'
    text: |-
      Om in het desbetreffende register als psychotherapeut te kunnen worden ingeschreven, wordt vereist het bezit
      van een getuigschrift waaruit blijkt dat de betrokkene voldoet aan de daartoe bij algemene maatregel van bestuur
      gestelde opleidingseisen.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel26
  - number: '26.2'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat met een getuigschrift als bedoeld in het eerste lid
      wordt gelijkgesteld een bewijs van een krachtens [artikel 14][ref1] onderscheidenlijk [artikel 16][ref2] verleende
      erkenning als specialist op een bij de maatregel aangewezen deelgebied van de uitoefening van een beroep waarop een
      register betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel16
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '14'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '16'
        hoofdstuk: II
        paragraaf: '2'
  - number: '27'
    text: |-
      Tot het gebied van deskundigheid van de psychotherapeut wordt gerekend het onderzoeken en het volgens bij algemene
      maatregel van bestuur aan te wijzen methoden beïnvloeden van stemmingen, gedragingen en houdingen van een persoon
      met een psychische stoornis, afwijking of klacht, teneinde deze te doen verdwijnen of te verminderen.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel27
  - number: '28'
    text: |-
      Om in het desbetreffende register als fysiotherapeut te kunnen worden ingeschreven, wordt vereist het bezit van een
      getuigschrift waaruit blijkt dat de betrokkene voldoet aan de daartoe bij algemene maatregel van bestuur gestelde
      opleidingseisen.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel28
  - number: '29.1'
    text: |-
      Tot het gebied van deskundigheid van de fysiotherapeut wordt gerekend het verrichten van bij algemene maatregel
      van bestuur te omschrijven handelingen op het gebied van de fysiotherapie, voor zover zij liggen op het gebied van
      de geneeskunst.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel29
  - number: '29.2'
    text: |-
      Tot het gebied van deskundigheid van de fysiotherapeut wordt mede gerekend het verrichten van handelingen,
      rechtstreeks betrekking hebbende op een persoon en ertoe strekkende diens gezondheidstoestand te bevorderen of
      te bewaken, welke overeenkomen met de krachtens het eerste lid omschreven handelingen, doch niet liggende op het
      gebied van de geneeskunst.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel29
  - number: '30'
    text: |-
      Om in het desbetreffende register als verloskundige te kunnen worden ingeschreven, wordt vereist het bezit van een
      getuigschrift waaruit blijkt dat de betrokkene voldoet aan de daartoe bij algemene maatregel van bestuur gestelde
      opleidingseisen.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel30
  - number: '31'
    text: |-
      Tot het gebied van deskundigheid van de verloskundige wordt gerekend het verrichten van bij algemene maatregel van
      bestuur te omschrijven handelingen op het gebied van de verloskunst alsmede het verrichten van bij de maatregel
      te omschrijven andere handelingen, een en ander met inachtneming van de beperkingen, bij de maatregel te stellen.
      Bij of krachtens de maatregel kunnen geneesmiddelen of medische hulpmiddelen worden aangewezen waarvan het
      voorschrijven, toedienen onderscheidenlijk toepassen tot het deskundigheidsgebied van de verloskundige behoort en
      kan apparatuur worden aangewezen waarvan het gebruik tot het deskundigheidsgebied van de verloskundige behoort.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel31
  - number: '32'
    text: |-
      Om in het desbetreffende register als verpleegkundige te kunnen worden ingeschreven, wordt vereist het bezit
      van een getuigschrift waaruit blijkt dat de betrokkene voldoet aan de daartoe bij algemene maatregel van bestuur
      gestelde opleidingseisen dan wel voor zover het betreft het diploma van een beroepsopleiding als bedoeld in de
      [Wet educatie en beroepsonderwijs][ref1], voldoet aan de bij en krachtens die wet voor de afgifte van dat diploma
      gestelde vereisten.


      [ref1]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0007625
  - number: '33'
    text: 'Tot het gebied van deskundigheid van de verpleegkundige wordt gerekend:'
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel33
  - number: 33.a
    text: het verrichten van handelingen op het gebied van observatie, begeleiding, verpleging en verzorging;
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel33
  - number: 33.b
    text: |-
      het ingevolge opdracht van een beroepsbeoefenaar op het gebied van de individuele gezondheidszorg verrichten van
      handelingen in aansluiting op diens diagnostische en therapeutische werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel33
  - number: 33a
    text: |-
      Om in het betreffende register als physician assistant te kunnen worden ingeschreven, wordt vereist het bezit
      van een getuigschrift waaruit blijkt dat de betrokkene voldoet aan de daartoe bij algemene maatregel van bestuur
      gestelde opleidingseisen.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel33a
  - number: 33b
    text: |-
      Tot het gebied van deskundigheid van de physician assistant wordt gerekend het verrichten van bij algemene
      maatregel van bestuur te omschrijven handelingen op het deelgebied van de geneeskunst waarbinnen de physician
      assistant is opgeleid, een en ander met inachtneming van de beperkingen, bij de maatregel te stellen. Deze
      handelingen omvatten het onderzoeken, behandelen en begeleiden van patiënten met veel voorkomende aandoeningen
      binnen dat deelgebied van de geneeskunst.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel33b
  - number: 33c
    text: |-
      Om in het betreffende register als klinisch technoloog te kunnen worden ingeschreven, wordt vereist het bezit
      van een getuigschrift waaruit blijkt dat de betrokkene voldoet aan de daartoe bij algemene maatregel van bestuur
      gestelde opleidingseisen.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel33c
  - number: 33d.1
    text: 'Tot het gebied van deskundigheid van de klinisch technoloog wordt gerekend:'
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel33d
  - number: 33d.1.a
    text: |-
      het optimaliseren van bestaande technisch medische handelingen alsmede het ontwerpen en ontwikkelen van nieuwe
      diagnostische methoden en therapieën met behulp van technologie.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel33d
  - number: 33d.1.b
    text: |-
      het verrichten van bij algemene maatregel van bestuur te omschrijven handelingen binnen het technisch medische
      deelgebied van de geneeskunst waarin de klinisch technoloog is opgeleid, een en ander met inachtneming van de
      beperkingen bij de maatregel te stellen.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel33d
  - number: 33e
    text: |-
      Om in het desbetreffende register als orthopedagoog-generalist te kunnen worden ingeschreven, wordt vereist het
      bezit van een getuigschrift waaruit blijkt dat de betrokkene voldoet aan de daartoe bij algemene maatregel van
      bestuur gestelde opleidingseisen.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel33e
  - number: 33f
    text: |-
      Tot het gebied van deskundigheid van de orthopedagoog-generalist wordt gerekend het verrichten van onderzoek
      en diagnostiek en het behandelen en begeleiden van zich in een persoonlijke afhankelijkheidsrelatie bevindende
      personen met leer-, gedrags-, en ontwikkelingsproblemen.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel33f
  - number: '34.1'
    text: |-
      Bij algemene maatregel van bestuur kan ter bevordering van een goede uitoefening van individuele gezondheidszorg de
      opleiding tot een bij de maatregel aangewezen beroep worden geregeld of aangewezen.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel34
  - number: '34.2'
    text: |-
      Indien toepassing wordt gegeven aan het eerste lid, wordt tevens bij de maatregel het gebied van deskundigheid
      omschreven van personen die de krachtens het eerste lid geregelde of aangewezen opleiding hebben voltooid. Bij of
      krachtens de maatregel kunnen geneesmiddelen worden aangewezen waarvan het toedienen tot het deskundigheidsgebied
      behoort van personen, die de krachtens het eerste lid geregelde of aangewezen opleiding hebben voltooid, en
      kan apparatuur worden aangewezen waarvan het gebruik tot het deskundigheidsgebied behoort van personen, die de
      krachtens het eerste lid geregelde of aangewezen opleiding hebben voltooid.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel34
  - number: '34.3'
    text: |-
      Aan degenen die de krachtens het eerste lid geregelde of aangewezen opleiding tot dat beroep hebben voltooid, is
      het recht voorbehouden een bij algemene maatregel van bestuur aangegeven titel te voeren.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel34
  - number: '34.4'
    text: |-
      Het is degene wie het recht tot het voeren van een krachtens het derde lid geregelde titel niet toekomt, verboden
      deze titel, een daarop gelijkende benaming dan wel een op die titel betrekking hebbend onderscheidingsteken,
      aangegeven met toepassing van [artikel 93][ref1] of daarmee in hoofdzaak overeenstemmend, te voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel93
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '93'
        hoofdstuk: IX
  - number: '34.5'
    text: |-
      Voor zover het vierde lid, en de [artikelen 4, tweede lid][ref1], [17, tweede lid][ref2], en
      [36a, derde lid, tweede volzin][ref3], een verbod inhouden op het voeren van een titel, is
      dat verbod niet van toepassing in het geval dat een beroepsbeoefenaar aan wie op grond van
      [artikel 12, eerste lid, van de Algemene wet erkenning EU-beroepskwalificaties][ref4] gedeeltelijke toegang is
      verleend tot een beroep als bedoeld in het eerste lid, zijn beroepswerkzaamheden uitoefent onder de beroepstitel
      van zijn staat van herkomst of oorsprong.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0006251#Artikel36a
      [ref4]: https://wetten.overheid.nl/BWBR0023066#Artikel12
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '17'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0006251
        artikel: 36a
        hoofdstuk: IV
      - id: ref4
        bwb_id: BWBR0023066
        artikel: '12'
  - number: '35.1'
    text: |-
      Het is anderen dan de op grond van dit hoofdstuk aangewezen personen in de bij of krachtens dit hoofdstuk
      aangewezen gevallen, verboden om buiten noodzaak beroepsmatig de handelingen, genoemd in [artikel 36][ref1], te
      verrichten ten aanzien van personen, tenzij:


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel36
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '36'
        hoofdstuk: IV
  - number: 35.1.a
    text: |-
      zulks geschiedt ingevolge een opdracht van een persoon die zijn bevoegdheid ontleent aan het bepaalde bij of
      krachtens de [artikelen 36][ref1], [36a, eerste lid][ref2], of [37, eerste lid][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel36a
      [ref3]: https://wetten.overheid.nl/BWBR0006251#Artikel37
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '36'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0006251
        artikel: 36a
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0006251
        artikel: '37'
        hoofdstuk: IV
  - number: 35.1.b
    text: |-
      hij redelijkerwijs mag aannemen dat hij beschikt over de bekwaamheid die vereist is voor het behoorlijk uitvoeren
      van de opdracht; en
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel35
  - number: 35.1.c
    text: hij, voor zover de opdrachtgever aanwijzingen heeft gegeven, handelt overeenkomstig die aanwijzingen.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel35
  - number: '35.2'
    text: |-
      Met inachtneming van het eerste lid is de opdrachtnemer bevoegd tot het verrichten van de in het eerste lid
      bedoelde handeling.
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel35
  - number: 35a.1
    text: |-
      De op grond van [artikel 36][ref1] bevoegde personen zijn tot het verrichten van de handelingen, genoemd in artikel
      36, uitsluitend bevoegd voor zover zij redelijkerwijs mogen aannemen dat zij beschikken over de bekwaamheid die
      vereist is voor het behoorlijk verrichten van die handelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel36
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '36'
        hoofdstuk: IV
  - number: 35a.2
    text: |-
      Indien de bevoegde personen niet voldoen aan het vereiste van bekwaamheid als bedoeld in het eerste lid, worden
      zij voor de toepassing van de [artikelen 35, eerste lid, onder a][ref1], [38][ref2] en [39][ref3], aangemerkt als
      personen die hun bevoegdheid ontlenen aan het bij [artikel 36][ref4] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0006251#Artikel39
      [ref4]: https://wetten.overheid.nl/BWBR0006251#Artikel36
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '35'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '38'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0006251
        artikel: '39'
        hoofdstuk: IV
      - id: ref4
        bwb_id: BWBR0006251
        artikel: '36'
        hoofdstuk: IV
  - number: '36.1'
    text: |-
      Tot het verrichten van heelkundige handelingen - waaronder worden verstaan handelingen, liggende op het gebied van
      de geneeskunst, waarbij de samenhang der lichaamsweefsels wordt verstoord en deze zich niet direct herstelt - zijn
      bevoegd:
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel36
  - number: 36.1.a
    text: de artsen,
    url: https://wetten.overheid.nl/BWBR0006251/2024-07-01#Artikel36
  - number: 36.1.b
    text: de tandartsen,
