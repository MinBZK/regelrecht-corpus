  - number: '92.1'
    text: |-
      Ten aanzien van degene die als beoefenaar van een beroep dat geregeld is in deze wet of waarvan de opleiding
      krachtens [artikel 34, eerste lid][ref1], is geregeld of aangewezen, is verbonden aan een in Nederland
      verblijvend onderdeel van een bondgenootschappelijke krijgsmacht, blijven ter zake van de werkzaamheden die
      hij in de uitoefening van dat beroep verricht met betrekking tot personeel, behorende tot een onderdeel van die
      bondgenootschappelijke krijgsmacht, alsmede met betrekking tot degenen met wie dat personeel duurzaam samenleeft,
      buiten toepassing:


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel34
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '34'
        hoofdstuk: III
        afdeling: '2'
  - number: 92.1.a
    text: |-
      het in [artikel 4, tweede lid][ref1], gestelde verbod, voor zover het de titel betreft, waarvan het voeren
      voorbehouden is aan degenen die in de op dat beroep betrekking hebbende hoedanigheid in het desbetreffende register
      ingeschreven staan;


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel4
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
  - number: 92.1.b
    text: |-
      het in [artikel 35, eerste lid][ref1], gestelde verbod, voor zover het handelingen betreft, waartoe de onder *a*
      bedoelde personen bevoegd zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel35
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '35'
        hoofdstuk: IV
  - number: 92.1.c
    text: |-
      het in [artikel 34, vierde lid][ref1], gestelde verbod, voor zover het de titel betreft waarvan het voeren
      voorbehouden is aan degenen die de krachtens [artikel 34, eerste lid][ref2], geregelde of aangewezen opleiding tot
      het betrokken beroep hebben voltooid.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel34
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '34'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '34'
        hoofdstuk: III
        afdeling: '2'
  - number: '92.2'
    text: |-
      Voor de toepassing van [artikel 96][ref1] wordt de in het eerste lid bedoelde persoon ter zake van de in dat
      lid aangegeven werkzaamheden gelijkgesteld met degene die in het desbetreffende register ingeschreven staat
      onderscheidenlijk degene die een krachtens [artikel 34, eerste lid][ref2], geregelde of aangewezen opleiding tot
      een bepaald beroep heeft voltooid.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel96
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel34
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '96'
        hoofdstuk: X
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '34'
        hoofdstuk: III
        afdeling: '2'
  - number: '92.3'
    text: |-
      De in het eerste lid bedoelde persoon die een in deze wet geregeld beroep uitoefent wordt voor de toepassing van in
      andere wetten opgenomen bepalingen, betrekking hebbende op degenen die in het desbetreffende register ingeschreven
      staan, gelijkgesteld met laatstbedoelde personen, voor zover zulks noodzakelijk is in verband met het verrichten
      van de in het eerste lid bedoelde werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel92
  - number: '93'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van het gebruik van een bij de
      maatregel aangegeven onderscheidingsteken door degenen die in een bij de maatregel aangewezen register ingeschreven
      staan of aan wie krachtens [artikel 34, derde lid][ref1], het recht is voorbehouden een krachtens dat artikellid
      aangegeven titel te voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel34
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '34'
        hoofdstuk: III
        afdeling: '2'
  - number: '94'
    text: |-
      Indien in deze wet geregelde onderwerpen in het belang van een goede uitvoering van de wet nadere regeling
      behoeven, kan deze geschieden bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel94
  - number: '95'
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van deze wet aan de beide Kamers der Staten-Generaal
      een verslag over de wijze waarop zij is toegepast.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel95
  - number: '96.1'
    text: |-
      Degene die, hetzij niet ingeschreven staande in een register, hetzij wel in een register ingeschreven staande doch
      bij het verrichten van handelingen op het gebied van de individuele gezondheidszorg kennelijk tredende buiten de
      grenzen van hetgeen overeenkomstig [hoofdstuk III][ref1] tot zijn gebied van deskundigheid wordt gerekend, bij
      het verrichten van handelingen op het gebied van de individuele gezondheidszorg buiten noodzaak schade of een
      aanmerkelijke kans op schade aan de gezondheid van een ander veroorzaakt, wordt gestraft met hechtenis van ten
      hoogste drie maanden of geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0006251
        hoofdstuk: III
  - number: '96.2'
    text: |-
      Indien de in het eerste lid bedoelde persoon weet of ernstige reden heeft om te vermoeden dat hij schade of een
      aanmerkelijke kans op schade aan de gezondheid van een ander veroorzaakt, wordt hij gestraft met gevangenisstraf
      van ten hoogste zes maanden of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel96
  - number: '96.3'
    text: |-
      Bij veroordeling wegens een der in het eerste of tweede lid omschreven feiten kan de betrokkene tevens worden
      ontzet van het recht het betrokken beroep uit te oefenen.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel96
  - number: '96.4'
    text: |-
      Het in het eerste lid bepaalde geldt niet voor zover degene die een krachtens [artikel 34, eerste lid][ref1],
      geregelde of aangewezen opleiding heeft voltooid bij het verrichten van de in het eerste lid bedoelde handelingen
      niet getreden is buiten de grenzen van hetgeen overeenkomstig het krachtens [artikel 34, tweede lid][ref2],
      bepaalde tot zijn gebied van deskundigheid wordt gerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel34
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '34'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '34'
        hoofdstuk: III
        afdeling: '2'
  - number: 96a.1
    text: |-
      Indien tegen de verdachte van overtreding van [artikel 96][ref1] ernstige bezwaren zijn gerezen en de bescherming
      van de volksgezondheid dat dringend vordert, is de officier van justitie, zolang de behandeling ter terechtzitting
      nog niet is aangevangen, bevoegd, gehoord de Inspectie voor de Gezondheidszorg, de verdachte bij aan deze te
      betekenen kennisgeving als voorlopige maatregel te bevelen zich van bepaalde handelingen te onthouden.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel96
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel96a
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '96'
        hoofdstuk: X
  - number: 96a.2
    text: |-
      De verdachte kan tegen het bevel binnen veertien dagen na de betekening in beroep komen bij het gerecht waar de
      zaak wordt vervolgd of vervolgd zal worden. Het gerecht beslist zo spoedig mogelijk. De verdachte wordt gehoord,
      althans behoorlijk opgeroepen.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel96a
  - number: 96a.3
    text: |-
      [Artikel 28, tweede en derde lid][ref1], en de
      [artikelen 30 tot en met 32 van de Wet op de economische delicten][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0002063#Artikel30
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel96a
    references:
      - id: ref1
        bwb_id: BWBR0002063
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0002063
        artikel: '30'
  - number: 96b
    text: |-
      Indien tegen de verdachte van overtreding van [artikel 96][ref1] ernstige bezwaren zijn gerezen en de
      bescherming van de volksgezondheid dat dringend vordert, kan het met de behandeling van de zaak belaste
      gerecht voor de behandeling ter terechtzitting, op de vordering van het openbaar ministerie, op de voordracht
      van de rechter-commissaris, met het gerechtelijk vooronderzoek belast, en, indien de zaak te zijner zitting
      wordt behandeld, mede ambtshalve, de verdachte, gehoord de Inspectie voor de Gezondheidszorg, als voorlopige
      maatregel bevelen zich van bepaalde handelingen te onthouden. [Artikel 29, tweede en derde lid][ref2], en de
      [artikelen 30 tot en met 32 van de Wet op de economische delicten][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel96
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0002063#Artikel30
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel96b
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '96'
        hoofdstuk: X
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '29'
        hoofdstuk: III
        paragraaf: '6'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0002063
        artikel: '30'
  - number: '97'
    text: |-
      Degene die handelt in strijd met het in [artikel 35, eerste lid][ref1], of [38][ref2] gestelde verbod wordt
      gestraft met hechtenis van ten hoogste drie maanden of geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel38
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '35'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '38'
        hoofdstuk: IV
  - number: '98.1'
    text: |-
      Degene die een beperking van bevoegdheid of een voorwaarde, overeenkomstig [artikel 41, derde lid, onder b][ref1],
      [48, eerste lid, onder e][ref2], [80, eerste lid, onder b][ref3], of [105, derde lid][ref4], onderscheidenlijk
      overeenkomstig [artikel 80, eerste lid, onder a][ref5], of [105, derde lid][ref6], opgelegd om door de betrokkene
      in het register ingeschreven staande te worden inachtgenomen, niet naleeft, wordt gestraft met hechtenis van ten
      hoogste drie maanden of geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel48
      [ref3]: https://wetten.overheid.nl/BWBR0006251#Artikel80
      [ref4]: https://wetten.overheid.nl/BWBR0006251#Artikel105
      [ref5]: https://wetten.overheid.nl/BWBR0006251#Artikel80
      [ref6]: https://wetten.overheid.nl/BWBR0006251#Artikel105
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '41'
        hoofdstuk: VI
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '48'
        hoofdstuk: VII
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0006251
        artikel: '80'
        hoofdstuk: VIII
      - id: ref4
        bwb_id: BWBR0006251
        artikel: '105'
        hoofdstuk: XI
      - id: ref5
        bwb_id: BWBR0006251
        artikel: '80'
        hoofdstuk: VIII
      - id: ref6
        bwb_id: BWBR0006251
        artikel: '105'
        hoofdstuk: XI
  - number: '98.2'
    text: |-
      Op dezelfde wijze wordt gestraft degene die handelt in strijd met een ingevolge [artikel 96a][ref1] of
      [artikel 96b][ref2] gegeven bevel zich van bepaalde handelingen te onthouden.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel96a
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel96b
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: 96a
        hoofdstuk: X
      - id: ref2
        bwb_id: BWBR0006251
        artikel: 96b
        hoofdstuk: X
  - number: '99.1'
    text: |-
      Degene die, hoewel zijn inschrijving in het desbetreffende register is geschorst ten gevolge van een onherroepelijk
      geworden overeenkomstig [artikel 48, eerste lid, onder d][ref1], opgelegde maatregel dan wel een maatregel, bij
      wijze van voorlopige voorziening opgelegd overeenkomstig [artikel 80, vijfde lid][ref2], tijdens de duur dier
      schorsing handelt in strijd met het in [artikel 4, tweede lid][ref3], of [17, tweede lid][ref4], gestelde verbod,
      wordt gestraft met hechtenis van ten hoogste drie maanden of geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel80
      [ref3]: https://wetten.overheid.nl/BWBR0006251#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0006251#Artikel17
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel99
    references:
      - id: ref1
