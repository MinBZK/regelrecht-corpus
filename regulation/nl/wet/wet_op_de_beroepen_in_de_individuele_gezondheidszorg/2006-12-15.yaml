        artikel: '34'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '34'
        hoofdstuk: III
        afdeling: '2'
  - number: '107.2'
    text: |-
      De beoordeling of de vakbekwaamheid van een persoon als bedoeld in het eerste lid, onder *c*, geacht kan worden
      gelijkwaardig of nagenoeg gelijkwaardig te zijn aan die welke mag worden afgeleid uit het voltooid hebben van
      de krachtens [artikel 34, eerste lid][ref1], geregelde of aangewezen opleiding tot het desbetreffende beroep,
      geschiedt aan de hand van het bezit van door Onze Minister aangewezen getuigschriften, door het afnemen van een
      proef, of, ter beoordeling van Onze Minister, op andere wijze, eventueel nadat de betrokkene gelegenheid is gelaten
      tot het volgen van aanvullende opleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel34
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '34'
        hoofdstuk: III
        afdeling: '2'
  - number: '107.3'
    text: |-
      Een aanvrage als bedoeld in het eerste lid, onder *c*, is slechts ontvankelijk indien zij wordt ingediend binnen
      zes maanden na het tijdstip waarop een algemene maatregel van bestuur als bedoeld in [artikel 34, derde lid][ref1],
      ten aanzien van het desbetreffende beroep in werking is getreden. Later ingediende aanvragen kunnen slechts in
      behandeling worden genomen indien een aannemelijke oorzaak voor de vertraging aanwezig is, en in dat geval slechts
      binnen twee maanden nadat de oorzaak heeft opgehouden te werken.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel34
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '34'
        hoofdstuk: III
        afdeling: '2'
  - number: 107a
    text: |-
      Voor de toepassing van de [artikelen 34, vierde lid][ref1], en [96][ref2] worden met degenen die een krachtens
      [artikel 34, eerste lid][ref3], geregelde of aangewezen opleiding tot een beroep dat niet wettelijk geregeld
      was vóór de datum van inwerkingtreding van [artikel 34][ref4], hebben voltooid, gelijkgesteld: personen wier
      verworven vakbekwaamheid, gelet op het bezit van een door Onze Minister aangewezen getuigschrift, geacht kan
      worden gelijkwaardig of nagenoeg gelijkwaardig te zijn aan de vakbekwaamheid welke uit het voltooid hebben van
      de krachtens [artikel 34, eerste lid][ref5], geregelde of aangewezen opleiding tot het desbetreffende beroep kan
      worden afgeleid.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel96
      [ref3]: https://wetten.overheid.nl/BWBR0006251#Artikel34
      [ref4]: https://wetten.overheid.nl/BWBR0006251#Artikel34
      [ref5]: https://wetten.overheid.nl/BWBR0006251#Artikel34
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel107a
