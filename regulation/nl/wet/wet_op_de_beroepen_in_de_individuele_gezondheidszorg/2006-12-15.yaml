  - number: '108.1'
    text: |-
      Aan degene die vóór het tijdstip waarop dit artikel in werking is getreden de bevoegdheid tot uitoefening van
      heilgymnastiek en massage hadden verkregen krachtens artikel 8, eerste lid, van de Wet op de paramedische beroepen
      (*Stb.* 1963, 113) dan wel op de in artikel 41, tweede of vierde lid, van die wet omschreven voet, is het recht
      voorbehouden de titel van heilgymnast-masseur te voeren.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel108
  - number: '108.2'
    text: |-
      Het is degene wie het recht tot het voeren van de in het eerste lid geregelde titel niet toekomt, verboden die
      titel of een daarop gelijkende benaming te voeren.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel108
  - number: '108.3'
    text: |-
      Tot het gebied van deskundigheid van de personen, bedoeld in het eerste lid, wordt gerekend het verrichten
      van bij algemene maatregel van bestuur te omschrijven handelingen op het gebied van de bewegingstherapie en de
      massagetherapie, voor zover zij liggen op het gebied van de geneeskunst en het verrichten ervan geschiedt op grond
      van een door een arts afgegeven verwijzing die aan bij de maatregel te stellen eisen voldoet.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel108
  - number: '108.4'
    text: |-
      Tot het gebied van deskundigheid van de personen, bedoeld in het eerste lid, wordt mede gerekend het verrichten
      van handelingen, rechtstreeks betrekking hebbende op een persoon en ertoe strekkende diens gezondheidstoestand te
      bevorderen of te bewaken, welke overeenkomen met de handelingen, bedoeld in het derde lid, doch niet liggende op
      het gebied van de geneeskunst.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel108
  - number: '109.1'
    text: |-
      De krachtens de Medische Tuchtwet (*Stb.* 1928, 222) opgelegde maatregelen behouden na de intrekking van die wet
      hun rechtskracht.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel109
  - number: '109.2'
    text: |-
      De op het tijdstip van die intrekking aanhangige zaken worden nog op de voet van het bij of krachtens de Medische
      Tuchtwet bepaalde afgehandeld, met dien verstande evenwel dat daarbij geen maatregel opgelegd kan worden wegens
      feiten ter zake waarvan geen maatregelen zouden kunnen worden opgelegd overeenkomstig hoofdstuk VII of VIII van de
      onderhavige wet.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel109
  - number: '110.1'
    text: |-
      Ingeval overeenkomstig de Medische Tuchtwet bij onherroepelijk geworden beslissing de in artikel 5, eerste lid,
      onder 4°, van die wet vermelde maatregel is opgelegd, wordt deze naar zijn rechtsgevolgen gelijkgesteld met een
      krachtens [artikel 48, eerste lid, onder d][ref1], opgelegde maatregel.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel48
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '48'
        hoofdstuk: VII
        paragraaf: '2'
  - number: '110.2'
    text: |-
      Ingeval overeenkomstig de Medische Tuchtwet bij onherroepelijk geworden beslissing de in artikel 5, eerste lid,
      onder 5°, van die wet vermelde maatregel is opgelegd, wordt deze naar zijn rechtsgevolgen gelijkgesteld met een
      krachtens [artikel 48, eerste lid, onder f][ref1], of [artikel 80, eerste lid, onder c][ref2], dan wel met een
      krachtens [artikel 48, derde lid][ref3], opgelegde maatregel, zulks naar gelang de betrokkene op het tijdstip van
      onherroepelijk worden van bedoelde beslissing al dan niet in het desbetreffende register ingeschreven stond.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel80
      [ref3]: https://wetten.overheid.nl/BWBR0006251#Artikel48
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel110
