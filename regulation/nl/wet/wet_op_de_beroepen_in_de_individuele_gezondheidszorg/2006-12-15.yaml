        hoofdstuk: II
        paragraaf: '2'
  - number: '99.2'
    text: |-
      Op dezelfde wijze wordt gestraft degene die, hoewel zijn inschrijving in het desbetreffende register is
      doorgehaald ten gevolge van een onherroepelijk geworden overeenkomstig [artikel 48, eerste lid, onder f][ref1], of
      [80, eerste lid, onder c][ref2], opgelegde maatregel, handelt in strijd met het in [artikel 4, tweede lid][ref3],
      of [17, tweede lid][ref4], gestelde verbod.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel80
      [ref3]: https://wetten.overheid.nl/BWBR0006251#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0006251#Artikel17
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '48'
        hoofdstuk: VII
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '80'
        hoofdstuk: VIII
      - id: ref3
        bwb_id: BWBR0006251
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0006251
        artikel: '17'
        hoofdstuk: II
        paragraaf: '2'
  - number: '100'
    text: |-
      Degene die handelt in strijd met het in [artikelen 4, tweede lid][ref1], [17, tweede lid][ref2],
      [34, vierde lid][ref3], of [108, tweede lid][ref4], gestelde verbod, wordt gestraft met geldboete van de tweede
      categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0006251#Artikel34
      [ref4]: https://wetten.overheid.nl/BWBR0006251#Artikel108
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '17'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0006251
        artikel: '34'
        hoofdstuk: III
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0006251
        artikel: '108'
        hoofdstuk: XI
  - number: 100a
    text: |-
      Onze Minister is bevoegd tot toepassing van bestuursdwang ter handhaving van de in een krachtens
      [artikel 87a][ref1] gegeven bevel gestelde verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel87a
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel100a
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: 87a
        hoofdstuk: IX
  - number: '101'
    text: |-
      Degene die handelt in strijd met een krachtens [artikel 40, vierde lid][ref1], gesteld voorschrift voor zover dit
      is aangeduid als strafbaar feit wordt gestraft met geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel40
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '40'
        hoofdstuk: V
  - number: '102.1'
    text: |-
      De in [artikel 96, tweede lid][ref1], strafbaar gestelde feiten zijn misdrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel96
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '96'
        hoofdstuk: X
  - number: '102.2'
    text: |-
      De in de [artikelen 96, eerste lid][ref1], en [97 tot en met 101][ref2] strafbaar gestelde feiten zijn
      overtredingen.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel96
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel97
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '96'
        hoofdstuk: X
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '97'
        hoofdstuk: X
  - number: '103.1'
    text: |-
      Indien tijdens het plegen van een strafbaar feit, omschreven in de [artikelen 96, eerste lid][ref1], en [97][ref2],
      nog geen vier jaren zijn verlopen sedert een vroegere veroordeling van de schuldige wegens een strafbaar feit,
      omschreven in de [artikelen 96][ref3] en [97][ref4], onherroepelijk is geworden, kan hechtenis van ten hoogste zes
      maanden of geldboete van de derde categorie worden opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel96
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel97
      [ref3]: https://wetten.overheid.nl/BWBR0006251#Artikel96
      [ref4]: https://wetten.overheid.nl/BWBR0006251#Artikel97
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '96'
        hoofdstuk: X
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '97'
        hoofdstuk: X
      - id: ref3
        bwb_id: BWBR0006251
        artikel: '96'
        hoofdstuk: X
      - id: ref4
        bwb_id: BWBR0006251
        artikel: '97'
        hoofdstuk: X
  - number: '103.2'
    text: |-
      Indien tijdens het plegen van een strafbaar feit, omschreven in [artikel 96, tweede lid][ref1], nog geen vier
      jaren zijn verlopen sedert een vroegere veroordeling van de schuldige wegens een strafbaar feit, omschreven in de
      [artikelen 96][ref2] en [97][ref3], onherroepelijk is geworden, kan gevangenisstraf van ten hoogste een jaar of
      geldboete van de vierde categorie worden opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel96
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel96
      [ref3]: https://wetten.overheid.nl/BWBR0006251#Artikel97
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '96'
        hoofdstuk: X
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '96'
        hoofdstuk: X
      - id: ref3
        bwb_id: BWBR0006251
        artikel: '97'
        hoofdstuk: X
  - number: '104.1'
    text: |-
      Ten aanzien van degenen die de bevoegdheid hadden verkregen of waren toegelaten tot de uitoefening van een
      in het vierde lid genoemd beroep, dan wel een ander in het vijfde lid genoemd beroep reeds uitoefenden, dan
      wel de bevoegdheid hadden verkregen tot het voeren van de titel van verpleegkundige vóór het tijdstip waarop
      [artikel 3, eerste lid][ref1], ten aanzien van het desbetreffende beroep in werking is getreden, blijven gedurende
      zes maanden na dat tijdstip en, indien binnen dat tijdstip overeenkomstig het bij en krachtens [artikel 5][ref2]
      bepaalde een aanvrage voor inschrijving in het desbetreffende register is ingediend, ook nadien totdat op hun
      aanvrage onherroepelijk is beslist, buiten toepassing:


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel5
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '5'
        hoofdstuk: II
        paragraaf: '1'
  - number: 104.1.a
    text: |-
      het in [artikel 4, tweede lid][ref1], gestelde verbod, voor zover het de titel betreft, waarvan het voeren
      voorbehouden is aan degenen die in de op dat beroep betrekking hebbende hoedanigheid in het desbetreffende register
      ingeschreven staan;


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel4
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
  - number: 104.1.b
    text: |-
      het in [artikel 35, eerste lid][ref1], gestelde verbod, voor zover het handelingen betreft waartoe de onder *a*
      bedoelde personen op dat tijdstip bevoegd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel35
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '35'
        hoofdstuk: IV
  - number: '104.2'
    text: |-
      Ingeval een aanvrage als bedoeld in het eerste lid wordt ingediend na het verstrijken van de in dat lid bedoelde
      termijn, is, indien voor deze vertraging een aannemelijke oorzaak aanwezig is en de aanvrage is ingediend binnen
      twee maanden nadat de oorzaak heeft opgehouden te werken, vanaf de datum van indiening van de aanvrage het eerste
      lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel104
  - number: '104.3'
    text: |-
      De in de aanhef van het eerste lid bedoelde personen zijn, indien de in dat lid, onder *a*, bedoelde personen aan
      tuchtrechtspraak overeenkomstig deze wet onderworpen zijn, eveneens aan bedoelde rechtspraak onderworpen en worden
      voor de toepassing van [artikel 96][ref1] gelijkgesteld met degenen die in het desbetreffende register ingeschreven
      staan.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel96
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '96'
        hoofdstuk: X
  - number: '104.4'
    text: 'De in het eerste lid bedoelde beroepen zijn die van: arts, tandarts, apotheker, fysiotherapeut, verloskundige.'
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel104
  - number: '104.5'
    text: 'De in het eerste lid bedoelde andere beroepen zijn die van: gezondheidszorgpsycholoog, psychotherapeut.'
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel104
  - number: '104.6'
    text: |-
      De in het eerste lid bedoelde personen worden voor de toepassing van in andere wetten opgenomen bepalingen,
      betrekking hebbende op degenen die in het desbetreffende register ingeschreven staan, gedurende de in het eerste
      lid bedoelde periode gelijkgesteld met degenen die in dat register ingeschreven staan.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel104
  - number: '105.1'
    text: |-
      Degenen die de bevoegdheid hadden verkregen of waren toegelaten tot de uitoefening van een in
      [artikel 104, vierde lid][ref1], genoemd beroep, dan wel de bevoegdheid hadden verkregen tot het voeren van
      de titel van verpleegkundige vóór het tijdstip waarop [artikel 3, eerste lid][ref2], ten aanzien van het
      desbetreffende beroep in werking is getreden, wordt inschrijving in het desbetreffende register niet geweigerd
      vanwege het niet voldoen aan de ter zake van de genoten opleiding bij of krachtens [hoofdstuk III][ref3] voor
      inschrijving in dat register gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel104
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0006251#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '104'
        hoofdstuk: XI
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0006251
        hoofdstuk: III
  - number: '105.2'
    text: |-
      Met de in het eerste lid bedoelde personen worden gelijkgesteld degenen die een op de bekwaamheid tot de
      uitoefening van een daar bedoeld beroep dan wel op het voeren van de daar bedoelde titel betrekking hebbend
      getuigschrift hebben verkregen ter afsluiting van een wettelijk geregelde opleiding welke vóór het tijdstip waarop
      [artikel 3, eerste lid][ref1], ten aanzien van het desbetreffende beroep in werking is getreden, is aangevangen en
      eerst nadien is voltooid.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel3
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
  - number: '105.3'
    text: |-
      Ingeval de in het eerste lid bedoelde bevoegdheid of toelating onder beperkingen of voorwaarden is verleend, mag de
      betrokkene, in het register ingeschreven staande, het desbetreffende beroep slechts uitoefenen met inachtneming van
      die beperkingen of voorwaarden. Bij inschrijving van de betrokkene in het register wordt in de in de vorige volzin
      bedoelde gevallen in het register een aantekening geplaatst, inhoudende een omschrijving van die beperkingen of
      voorwaarden. Indien de bevoegdheid of de toelating voor een bepaalde tijd is verleend, wordt de inschrijving van de
      betrokkene na afloop van die tijd doorgehaald. [Artikel 12][ref1] is van overeenkomstige toepassing ten aanzien van
      de in de tweede volzin bedoelde aantekening.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel12
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '12'
        hoofdstuk: II
        paragraaf: '1'
  - number: '105.4'
    text: 'Het derde lid, eerste volzin, is niet van toepassing ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel105
  - number: 105.4.a
    text: de in artikel 7, eerste volzin, van de Wet van 24 juni 1876, *Stb.* 117, bedoelde tandartsen;
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel105
  - number: 105.4.b
    text: |-
      degenen aan wie een met de bevoegdheid van de onder a bedoelde tandartsen overeenkomende bevoegdheid of toelating
      krachtens artikel 7*a* en 7*d* van de onder *a* genoemde wet was verleend;
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel105
  - number: 105.4.c
    text: |-
      degenen die krachtens artikel 1 van de Wet van 18 december 1957, *Stb.* 589, waren toegelaten tot het uitoefenen
      van de tandheelkundige praktijk in Nederland.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel105
  - number: '106.1'
    text: |-
      Degenen die vóór het tijdstip waarop [artikel 3, eerste lid][ref1], ten aanzien van het beroep van psychotherapeut
      in werking is getreden, een op de bekwaamheid tot de uitoefening van het beroep van psychotherapeut
      gerichte opleiding dan wel de opleiding tot psychiater hebben voltooid en die niet voldoen aan de krachtens
      [artikel 26, eerste lid][ref2], gestelde eisen voor inschrijving in het register van psychotherapeuten,
      wordt inschrijving in dat register deswege niet geweigerd indien de aanvrage is ingediend overeenkomstig
      [artikel 104, eerste of tweede lid][ref3], en Onze Minister heeft verklaard dat hun verworven vakbekwaamheid voor
      de toepassing van deze wet geacht kan worden gelijkwaardig te zijn aan de vakbekwaamheid welke uit het voldoen aan
      vorenbedoelde eisen kan worden afgeleid.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0006251#Artikel104
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '26'
        hoofdstuk: III
        paragraaf: '5'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0006251
        artikel: '104'
        hoofdstuk: XI
  - number: '106.2'
    text: |-
      Met de in het eerste lid bedoelde personen worden gelijkgesteld degenen die een in dat lid bedoelde opleiding
      hebben gevolgd welke vóór het in dat lid bedoelde tijdstip is aangevangen en eerst nadien is voltooid.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel106
  - number: '106.3'
    text: |-
      De beoordeling of de vakbekwaamheid van een persoon als bedoeld in het eerste lid voor de toepassing van deze
      wet geacht kan worden gelijkwaardig te zijn aan die welke mag worden afgeleid uit het voldoen aan de krachtens
      [artikel 26, eerste lid][ref1], gestelde eisen, geschiedt aan de hand van het bezit van door Onze Minister
      aangewezen getuigschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel26
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '26'
        hoofdstuk: III
        paragraaf: '5'
        afdeling: '1'
  - number: '107.1'
    text: |-
      Voor de toepassing van de [artikelen 34, vierde lid][ref1], en [96][ref2] worden met degenen die een krachtens
      [artikel 34, eerste lid][ref3], geregelde of aangewezen opleiding tot een beroep dat ook wettelijk geregeld was
      vóór de datum van inwerkingtreding van [artikel 34][ref4], hebben voltooid, gelijkgesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel96
      [ref3]: https://wetten.overheid.nl/BWBR0006251#Artikel34
      [ref4]: https://wetten.overheid.nl/BWBR0006251#Artikel34
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '34'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '96'
        hoofdstuk: X
      - id: ref3
        bwb_id: BWBR0006251
        artikel: '34'
        hoofdstuk: III
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0006251
        artikel: '34'
        hoofdstuk: III
        afdeling: '2'
  - number: 107.1.a
    text: |-
      personen die vóór het tijdstip waarop voor het desbetreffende beroep een algemene maatregel van bestuur krachtens
      [artikel 34, derde lid][ref1], in werking treedt de bevoegdheid hadden verkregen tot de uitoefening van het
      desbetreffende beroep dan wel de bevoegdheid hadden verkregen tot het voeren van een op dat beroep betrekking
      hebbende titel;


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel34
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '34'
        hoofdstuk: III
        afdeling: '2'
  - number: 107.1.b
    text: |-
      personen die een wettelijk geregelde opleiding tot het desbetreffende beroep vóór het tijdstip waarop voor dat
      beroep een algemene maatregel van bestuur krachtens [artikel 34, derde lid][ref1], in werking treedt, hebben
      aangevangen en nadien hebben voltooid;


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel34
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '34'
        hoofdstuk: III
        afdeling: '2'
  - number: 107.1.c
    text: |-
      personen, andere dan de onder *a* en *b* bedoelde, die het betreffende beroep hebben uitgeoefend gedurende een
      aaneengesloten periode van tenminste zes maanden in het tijdvak van vijf jaren, onmiddellijk voorafgaande aan het
      tijdstip waarop voor dat beroep een algemene maatregel van bestuur krachtens [artikel 34, derde lid][ref1], in
      werking treedt en ten aanzien van wie Onze Minister op hun daartoe strekkende aanvrage heeft verklaard dat hun
      verworven vakbekwaamheid geacht kan worden gelijkwaardig of nagenoeg gelijkwaardig te zijn aan de vakbekwaamheid
      welke uit het voltooid hebben van de krachtens [artikel 34, eerste lid][ref2], geregelde of aangewezen opleiding
      tot het desbetreffende beroep kan worden afgeleid.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel34
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel107
    references:
      - id: ref1
