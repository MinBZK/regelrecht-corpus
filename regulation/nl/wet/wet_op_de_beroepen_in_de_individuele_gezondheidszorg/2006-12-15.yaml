---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_op_de_beroepen_in_de_individuele_gezondheidszorg
regulatory_layer: WET
publication_date: '2023-09-13'
valid_from: '2006-12-15'
bwb_id: BWBR0006251
url: https://wetten.overheid.nl/BWBR0006251/2006-12-15
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is:

    de tot dusverre geldende wettelijke regeling op het gebied van de uitoefening van de geneeskunst, inhoudende een
    het gehele gebied der geneeskunst bestrijkend verbod van beroepsuitoefening zonder hiertoe wettelijk verleende
    bevoegdheid, te vervangen door een regeling welke een ruimer gebied van individuele gezondheidszorg bestrijkt
    en waarbij slechts het verrichten van bij de wet aangewezen categorieën van handelingen wordt voorbehouden aan
    categorieën van daartoe overeenkomstig de wet gekwalificeerden, terwijl het voeren van wettelijk beschermde
    beroepstitels uitsluitend toekomt aan degenen die in de voor de desbetreffende beroepen overeenkomstig de wet
    ingestelde registers ingeschreven staan en ten aanzien van andere beroepen op het gebied van de individuele
    gezondheidszorg voorzien wordt in de mogelijkheid tot het regelen van de opleiding tot die beroepen;

    voor onderscheidene categorieën van overeenkomstig de wet gekwalificeerden een aan de gebleken behoeften aangepaste
    regeling van tuchtrechtspraak in het leven te roepen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze wet en de daarop berustende bepalingen worden onder handelingen op het gebied van de individuele
      gezondheidszorg naast de in het tweede lid omschreven handelingen verstaan alle andere verrichtingen - het
      onderzoeken en het geven van raad daaronder begrepen -, rechtstreeks betrekking hebbende op een persoon en ertoe
      strekkende diens gezondheid te bevorderen of te bewaken.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel1
  - number: '1.2'
    text: 'In deze wet en de daarop berustende bepalingen worden onder handelingen op het gebied van de geneeskunst verstaan:'
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel1
  - number: 1.2.a
    text: |-
      alle verrichtingen - het onderzoeken en het geven van raad daaronder begrepen -, rechtstreeks betrekking hebbende
      op een persoon en ertoe strekkende hem van een ziekte te genezen, hem voor het ontstaan van een ziekte te behoeden
      of zijn gezondheidstoestand te beoordelen, dan wel verloskundige bijstand te verlenen;
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel1
  - number: 1.2.b
    text: het bij een persoon afnemen van bloed of wegnemen van weefsel voor andere doeleinden dan die, bedoeld onder *a*;
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel1
  - number: 1.2.c
    text: het wegnemen van weefsel bij een overledene en het verrichten van sectie.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel1
  - number: '2.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt onder Onze Minister verstaan Onze Minister van
      Volksgezondheid, Welzijn en Sport.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel2
  - number: '2.2'
    text: |-
      In de [hoofdstukken VII][ref1] en [VIII][ref2] en de daarop berustende bepalingen worden onder Onze Ministers
      verstaan Onze Minister van Volksgezondheid, Welzijn en Sport en van Justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#HoofdstukVII
      [ref2]: https://wetten.overheid.nl/BWBR0006251#HoofdstukVIII
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006251
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0006251
        hoofdstuk: VIII
  - number: '2.3'
    text: |-
      In deze wet wordt onder een andere overeenkomstsluitende staat verstaan een staat, niet zijnde een lid-Staat van
      de Europese Economische Gemeenschap, die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte
      of Zwitserland.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel2
  - number: '2.4'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt onder register verstaan een overeenkomstig
      [artikel 3, eerste lid][ref1], ingesteld register.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel3
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
  - number: '2.5'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt onder erkend specialistenregister verstaan een
      specialistenregister ten aanzien waarvan [artikel 14, eerste lid][ref1], is toegepast, dan wel een
      specialistenregister dat met toepassing van [artikel 16][ref2] in het leven is geroepen.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel16
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '14'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '16'
        hoofdstuk: II
        paragraaf: '2'
  - number: '3.1'
    text: |-
      Er worden registers ingesteld, waarin degenen die aan de daarvoor bij en krachtens deze wet gestelde
      voorwaarden voldoen, op hun aanvrage worden ingeschreven, onderscheidenlijk als: arts, tandarts, apotheker,
      gezondheidszorgpsycholoog, psychotherapeut, fysiotherapeut, verloskundige, verpleegkundige.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel3
  - number: '3.2'
    text: |-
      Bij elke inschrijving worden in het register vermeld de naam, voornamen, geslacht, geboortedatum, nationaliteit en
      adres van de betrokkene en het nummer en het tijdstip van inschrijving.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel3
  - number: '3.3'
    text: Elk register wordt ingesteld en beheerd door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel3
  - number: '3.4'
    text: |-
      De registers worden ingesteld ten einde te kunnen voldoen aan een verzoek om informatie als bedoeld in
      [artikel 12][ref1] en ten behoeve van het toezicht op de uitvoering van de [artikelen 4][ref2] en [17][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0006251#Artikel17
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '12'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0006251
        artikel: '17'
        hoofdstuk: II
        paragraaf: '2'
  - number: '4.1'
    text: |-
      Aan degenen die in een register ingeschreven staan, is het recht voorbehouden de in [artikel 3, eerste lid][ref1],
      aan de hoedanigheid waarin zij ingeschreven worden, gegeven benaming als titel te voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel3
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
  - number: '4.2'
    text: |-
      Het is degene wie het recht tot het voeren van een in deze wet geregelde titel niet toekomt op grond van het
      eerste lid, verboden deze titel, een daarop gelijkende benaming dan wel een op die titel betrekking hebbend
      onderscheidingsteken, aangegeven met toepassing van [artikel 93][ref1] of daarmee in hoofdzaak overeenstemmend,
      te voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel93
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '93'
        hoofdstuk: IX
  - number: '4.3'
    text: Zolang een inschrijving in een register geschorst is, wordt de betrokkene gelijkgesteld met een niet-ingeschrevene.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel4
  - number: '4.4'
    text: |-
      Waar in deze wet of in daarop berustende bepalingen personen met een der in [artikel 3, eerste lid][ref1], vermelde
      benamingen worden aangeduid, worden, voor zover niet anders blijkt, daaronder verstaan degenen die in het betrokken
      register ingeschreven staan.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel3
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
  - number: '5.1'
    text: Onze minister is bevoegd op de aanvrage tot inschrijving in een register te beslissen.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel5
  - number: '5.2'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld over het bedrag dat voor de behandeling van de aanvrage
      moet worden betaald alsmede over de wijze van indiening van een aanvrage en de daarbij te verstrekken gegevens
      of bescheiden, nodig voor de beoordeling van de aanvrage. Het in de eerste volzin bedoelde bedrag wordt zodanig
      bepaald dat daarmee de kosten van de behandeling van de aanvrage worden betaald.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel5
  - number: '6'
    text: 'De inschrijving wordt geweigerd:'
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel6
  - number: 6.a
    text: |-
      indien de aanvrager niet voldoet aan de in [hoofdstuk III][ref1] bedoelde opleidingseisen;


      [ref1]: https://wetten.overheid.nl/BWBR0006251#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006251
        hoofdstuk: III
  - number: 6.b
    text: |-
      indien de aanvrager ingevolge in kracht van gewijsde gegane rechterlijke uitspraak onder curatele is gesteld wegens
      geestelijke stoornis;
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel6
  - number: 6.c
    text: indien de aanvrager ingevolge rechterlijke uitspraak ontzet is van het recht het betrokken beroep uit te oefenen;
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel6
  - number: 6.d
    text: indien zulks voortvloeit uit een op grond van deze wet jegens de aanvrager genomen maatregel.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel6
  - number: '7'
    text: 'De inschrijving wordt doorgehaald:'
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel7
  - number: 7.a
    text: in geval van overlijden van de ingeschrevene;
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel7
  - number: 7.b
    text: op verzoek van de ingeschrevene;
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel7
  - number: 7.c
    text: |-
      indien de ingeschrevene in een der in [artikel 6, onder b of c][ref1], genoemde omstandigheden is komen te
      verkeren;


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel6
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '6'
        hoofdstuk: II
        paragraaf: '1'
  - number: 7.d
    text: indien zulks voortvloeit uit een op grond van deze wet jegens de ingeschrevene genomen maatregel.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel7
  - number: '9.1'
    text: |-
      In het register wordt, indien zulks voortvloeit uit een op grond van deze wet genomen maatregel of besluit, een
      aantekening geplaatst van:
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel9
  - number: 9.1.a
    text: de schorsing van een inschrijving;
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel9
  - number: 9.1.b
    text: de voorwaarden die een ingeschrevene zijn opgelegd;
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel9
  - number: 9.1.c
    text: |-
      de gedeeltelijke ontzegging van de bevoegdheid in het register ingeschreven staande het betrokken beroep uit te
      oefenen;
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel9
  - number: 9.1.d
    text: |-
      het eindigen van een schorsing, anders dan ten gevolge van het verstrijken van de in een maatregel vastgestelde
      tijdsduur;
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel9
  - number: 9.1.e
    text: |-
      het niet langer gelden van de onder *b* bedoelde voorwaarden, anders dan ten gevolge van het verstrijken van de
      proeftijd, en van de onder *c* bedoelde ontzegging.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel9
  - number: '9.2'
    text: 'Bij een aantekening als bedoeld in het eerste lid wordt vermeld:'
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel9
  - number: 9.2.a
    text: |-
      de datum waarop van de schorsing een aantekening wordt geplaatst alsmede de duur van de schorsing, indien die reeds
      bekend is;
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel9
  - number: 9.2.b
    text: |-
      de datum waarop de in het eerste lid bedoelde voorwaarden of ontzegging zijn gaan gelden alsmede, ingeval de
      voorwaarden tot een proeftijd zijn beperkt, de duur daarvan dan wel
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel9
  - number: 9.2.c
    text: |-
      de datum waarop de schorsing is geëindigd of vanaf welke de in het eerste lid bedoelde voorwaarden of ontzegging
      niet langer gelden.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel9
  - number: '10'
    text: |-
      Iedere inschrijving, aantekening of doorhaling in een register geschiedt op grond van een daartoe strekkende
      gedagtekende beschikking.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel10
  - number: '11.1'
    text: 'Onze Minister draagt zorg voor openbare kennisgeving van:'
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel11
  - number: 11.1.a
    text: |-
      hetgeen op grond van [artikel 9][ref1] in het register is aangetekend en vermeld, met dien verstande dat van de aan
      een ingeschrevene opgelegde voorwaarden uitsluitend wordt kennisgegeven in de bij algemene maatregel van bestuur
      aan te geven gevallen;


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel9
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '9'
        hoofdstuk: II
        paragraaf: '1'
  - number: 11.1.b
    text: |-
      de ter tenuitvoerlegging van een op grond van deze wet genomen maatregel verrichte doorhaling van een inschrijving,
      met vermelding van de grond waarop de doorhaling berust;
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel11
  - number: 11.1.c
    text: |-
      de inschrijving van een persoon ingeval de voorafgaande inschrijving van die persoon ter tenuitvoerlegging van een
      op grond van deze wet genomen maatregel is doorgehaald.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel11
  - number: '11.2'
    text: |-
      In de openbare kennisgeving worden de naam en de woonplaats van de betrokkene vermeld. De openbare kennisgeving
      geschiedt op bij algemene maatregel van bestuur te regelen wijze, met dien verstande dat zij in ieder geval in de
      *Staatscourant* geschiedt.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel11
  - number: '12.1'
    text: Aan de betrokkene wordt op diens verlangen medegedeeld wat te zijnen aanzien in het register vermeld staat.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel12
  - number: '12.2'
    text: 'Aan een ieder die zulks verlangt, wordt medegedeeld:'
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel12
  - number: 12.2.a
    text: of een persoon in een register ingeschreven staat;
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel12
  - number: 12.2.b
    text: of de inschrijving van een persoon in een register geschorst is;
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel12
  - number: 12.2.c
    text: |-
      of ten aanzien van een ingeschrevene een maatregel, inhoudende een gedeeltelijke ontzegging van de bevoegdheid in
      het register ingeschreven staande het betrokken beroep uit te oefenen, van kracht is, met, zo dit het geval is, een
      omschrijving van de inhoud van de maatregel;
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel12
  - number: 12.2.d
    text: |-
      in bij algemene maatregel van bestuur aan te geven gevallen: of ten aanzien van een ingeschrevene voorwaarden zijn
      gesteld, met, zo dit het geval is, een omschrijving van die voorwaarden en, ingeval deze tot een proeftijd zijn
      beperkt, een vermelding van de duur daarvan.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel12
  - number: '12.3'
    text: |-
      De verstrekking van mededelingen, bedoeld in het tweede lid, anders dan aan bestuursorganen en daaronder
      ressorterende diensten, geschiedt, voor zover zij schriftelijk plaats vindt, tegen betaling van een vergoeding
      volgens een bij algemene maatregel van bestuur vast te stellen tarief.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel12
  - number: '13'
    text: |-
      De in de registers opgenomen gegevens kunnen tevens worden gebruikt ten behoeve van de uitvoering van de
      [Noodwet geneeskundigen][ref1], de [Wet marktordening gezondheidszorg][ref2] en de toezending van informatie,
      de volksgezondheid betreffende, door het Staatstoezicht op de volksgezondheid of door andere door Onze Minister
      aangewezen bestuursorganen aan de in registers ingeschreven personen.


      [ref1]: https://wetten.overheid.nl/BWBR0002758
      [ref2]: https://wetten.overheid.nl/BWBR0020078
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002758
      - id: ref2
        bwb_id: BWBR0020078
  - number: '14.1'
    text: |-
      Indien een organisatie van beoefenaren van een beroep als bedoeld in [artikel 3][ref1], voor de inschrijving van
      beroepsbeoefenaren die een bijzondere deskundigheid hebben verworven met betrekking tot de uitoefening van een
      deelgebied van hun beroep, een specialistenregister heeft en daaraan een titel is verbonden, kan Onze Minister
      bepalen dat die titel als wettelijk erkende specialistentitel wordt aangemerkt. Een aanvraag daartoe wordt gedaan
      door het bestuur van de organisatie; het bestuur kan de bevoegdheid daartoe overdragen aan het orgaan, bedoeld in
      het tweede lid, onder d.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel3
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
  - number: '14.2'
    text: |-
      Een dergelijk besluit neemt Onze Minister uitsluitend indien dat wenselijk is ter bevordering van de goede
      uitoefening van de individuele gezondheidszorg en indien aan de volgende voorwaarden is voldaan:
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel14
  - number: 14.2.a
    text: |-
      de organisatie is, naar het oordeel van Onze Minister, voldoende representatief voor de beoefenaren van het
      betrokken beroep;
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel14
  - number: 14.2.b
    text: de organisatie is een vereniging met volledige rechtsbevoegdheid;
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel14
  - number: 14.2.c
    text: |-
      de organisatie stelt regels waarin in ieder geval worden vastgelegd - de procedure voor de besluitvorming binnen de
      organisatie met betrekking tot het instellen van een specialistenregister,
        - de taken en samenstelling van de verschillende organen en
        - het bedrag dat, ter dekking van de kosten, voor de behandeling van een aanvraag voor inschrijving en voor
      erkenning van een opleidingsinstelling, onderscheidenlijk opleider, is verschuldigd;
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel14
  - number: 14.2.d
    text: |-
      de organisatie kent een orgaan dat - belast is met het besluit tot instelling van een specialistenregister, en
        - regels stelt met betrekking tot de eisen die gesteld worden aan de inschrijving als specialist en aan de
      erkenning van opleidingsinstellingen, onderscheidenlijk opleiders, voor een specialisme;
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel14
  - number: 14.2.e
    text: |-
      de organisatie kent tevens een orgaan dat is belast met - de inschrijving van specialisten,
        - de erkenning van opleidingsinstellingen, onderscheidenlijk de opleiders en
        - het toezicht op de uitvoering van de regels door de erkende opleidingsinstellingen, onderscheidenlijk opleiders.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel14
  - number: '14.3'
    text: |-
      Een door een orgaan als bedoeld in het tweede lid, onder d, vastgestelde regeling is in overeenstemming met de
      bij of krachtens het Verdrag tot oprichting van de Europese Gemeenschap of de Overeenkomst betreffende de Europese
      Economische Ruimte gestelde regels en de op 21 juni 1999 te Luxemburg totstandgekomen Overeenkomst tussen de
      Europese Gemeenschap en haar lidstaten, enerzijds, en de Zwitserse Bondsstaat anderzijds, over het vrije verkeer
      van personen (Trb. 2000, 16 en 86).
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel14
  - number: '14.4'
    text: |-
      De regelingen, bedoeld in het tweede lid, onder c en d, behoeven de instemming van Onze Minister; de instemming kan
      worden onthouden wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel14
  - number: '14.5'
    text: Inschrijving in een erkend specialistenregister is niet afhankelijk van het lidmaatschap van de organisatie.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel14
  - number: '14.6'
    text: |-
      Inschrijving in een erkend specialistenregister is uitsluitend mogelijk voor personen die in het betrokken register
      zijn ingeschreven.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel14
  - number: '14.7'
    text: |-
      Aan een ieder die zulks verlangt wordt door de beheerder van een erkend specialistenregister meegedeeld of een
      persoon in het specialistenregister is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel14
  - number: '14.8'
    text: |-
      Onze Minister kan organen van de organisatie met betrekking tot de in dit artikel bedoelde taken in verband met
      bindende besluiten van de Europese Gemeenschap alsmede ter bevordering van de goede uitoefening van de individuele
      gezondheidszorg aanwijzingen van algemene aard geven. Alvorens daartoe over te gaan hoort hij het betrokken orgaan.
      Een aanwijzing kan niet inhouden dat een specialistenregister voor een bepaald deelgebied tot stand dient te worden
      gebracht.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel14
  - number: '14.9'
    text: |-
      Onze Minister kan een op grond van het eerste lid genomen besluit intrekken indien niet meer wordt voldaan aan het
      bepaalde in dit artikel.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel14
  - number: '14.10'
    text: |-
      De organen van de organisatie verstrekken desgevraagd aan Onze Minister de voor de uitoefening van zijn taak
      benodigde inlichtingen. Onze Minister kan inzage vorderen van zakelijke gegevens en bescheiden voor zover dat voor
      de vervulling van zijn taak redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel14
  - number: '14.11'
    text: |-
      Onze Minister zendt elke vier jaar aan de Staten-Generaal een verslag over de doeltreffendheid en doelmatigheid van
      het functioneren van de in het tweede lid, onder e, bedoelde organen.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel14
  - number: '14.12'
    text: 'In de Staatscourant wordt mededeling gedaan van:'
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel14
  - number: 14.12.a
    text: de besluiten van Onze Minister krachtens het eerste, vierde, achtste en negende lid;
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel14
  - number: 14.12.b
    text: vaststelling en wijziging van een regeling als bedoeld in het tweede lid, onder c en d.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel14
  - number: '15.1'
    text: |-
      Een regeling als bedoeld in [artikel 14, tweede lid, onder d][ref1], kan mede inhouden dat degene die de opleiding
      tot specialist heeft voltooid wordt ingeschreven als specialist voor een bij de regeling bepaalde periode en dat
      een aansluitende hernieuwde inschrijving slechts plaatsvindt indien de specialist gedurende een bij die regeling
      bepaald tijdvak, voorafgaand aan de indiening van de aanvraag tot hernieuwde inschrijving, regelmatig op het
      desbetreffende deelgebied van de beroepsuitoefening werkzaam is geweest dan wel het beroep zal uitoefenen onder de
      bij de hernieuwde inschrijving aan te geven scholingsvoorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel14
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '14'
        hoofdstuk: II
        paragraaf: '2'
  - number: '15.2'
    text: 'Indien in een regeling toepassing is gegeven aan het eerste lid kunnen in die regeling:'
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel15
  - number: 15.2.a
    text: |-
      eisen worden vastgesteld waaraan de werkzaamheden, bedoeld in het eerste lid, voor de toepassing van dat lid moeten
      voldoen;
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel15
  - number: 15.2.b
    text: |-
      al dan niet op het gebied van de individuele gezondheidszorg liggende werkzaamheden worden aangewezen die voor
      de toepassing van het eerste lid worden gelijkgesteld met werkzaamheden op het desbetreffende deelgebied der
      beroepsuitoefening;
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel15
  - number: 15.2.c
    text: |-
      tevens eisen worden gesteld ter zake van deelname aan deskundigheidsbevorderende activiteiten gedurende de in het
      eerste lid bedoelde periode van werkzaam zijn.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel15
  - number: '15.3'
    text: |-
      Een regeling als bedoeld in het eerste lid biedt aan degene die niet opnieuw als specialist wordt ingeschreven
      vanwege het niet voldoen aan de daartoe gestelde eisen, de mogelijkheid wederom als specialist te worden
      ingeschreven zodra door het volgen van scholing, die is afgestemd op het kennis- en vaardigheidsniveau van
      betrokkene, opnieuw wordt voldaan aan de eisen voor zodanige inschrijving.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel15
  - number: '15.4'
    text: |-
      In gevallen waarin toepassing is gegeven aan [artikel 14, eerste lid][ref1], is de beroepsorganisatie gehouden
      van elke inschrijving als specialist en van elke doorhaling van een zodanige inschrijving opgave te doen aan Onze
      Minister. Van elke inschrijving en van elke doorhaling van een inschrijving wordt een gedagtekende aantekening
      in het register geplaatst. Indien een inschrijving als specialist is doorgehaald op grond van een regeling als
      bedoeld in het eerste lid, vindt de in de eerste en tweede volzin bedoelde opgave, onderscheidenlijk aantekening,
      alleen plaats indien de desbetreffende persoon niet binnen vier weken na de doorhaling wederom als specialist is
      ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel14
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '14'
        hoofdstuk: II
        paragraaf: '2'
  - number: '15.5'
    text: |-
      Onverminderd hetgeen ingevolge [artikel 12, tweede lid][ref1], met betrekking tot de ingeschrevene geldt, wordt aan
      een ieder die zulks verlangt, medegedeeld of de betrokkene is ingeschreven als specialist.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel12
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '12'
        hoofdstuk: II
        paragraaf: '1'
  - number: '15.6'
    text: |-
      Doorhaling van een inschrijving in het register of schorsing van een inschrijving in het register brengt
      van rechtswege mee dat de inschrijving van de betrokkene als specialist is vervallen, onderscheidenlijk
      dienovereenkomstig geschorst is. Van elke doorhaling of schorsing van een inschrijving in het register wordt
      mededeling gedaan aan de betrokken organisatie.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel15
  - number: '16'
    text: |-
      Indien op een bepaald deelgebied van een beroep als bedoeld in [artikel 3][ref1] geen erkend specialistenregister
      bestaat en zulks in verband met bindende besluiten van de Europese Gemeenschap wel noodzakelijk is, dan wel dat ter
      bevordering van de goede uitoefening van de individuele gezondheidszorg gewenst is, kunnen bij algemene maatregel
      van bestuur ter zake regels worden gesteld. [Artikel 15][ref2] is op een bij die regels in het leven geroepen
      specialistenregister van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel15
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '15'
        hoofdstuk: II
        paragraaf: '2'
  - number: '17.1'
    text: |-
      Het recht om een specialistentitel te voeren is voorbehouden aan degenen die zijn ingeschreven in het
      desbetreffende erkende specialistenregister.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel17
  - number: '17.2'
    text: |-
      Het is degene wie het recht tot het voeren van een krachtens deze wet erkende specialisten-titel niet toekomt op
      grond van het eerste lid, verboden deze titel of een daarop gelijkende benaming te voeren.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel17
  - number: '18'
    text: |-
      Om in het desbetreffende register als arts te kunnen worden ingeschreven, wordt vereist het bezit van een
      getuigschrift waaruit blijkt dat de betrokkene voldoet aan de daartoe bij algemene maatregel van bestuur gestelde
      opleidingseisen.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel18
  - number: '19.1'
    text: |-
      Tot het gebied van deskundigheid van de arts wordt gerekend het verrichten van handelingen op het gebied van de
      geneeskunst.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel19
  - number: '19.2'
    text: |-
      In de gevallen waarin de arts bij of krachtens de [Wet op de Geneesmiddelenvoorziening][ref1] (*Stb.* 1958, 408)
      bevoegd is de artsenijbereidkunst uit te oefenen behoort het verrichten van handelingen op het gebied van de
      artsenijbereidkunst mede tot het gebied van zijn deskundigheid.


      [ref1]: https://wetten.overheid.nl/BWBR0002290
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002290
  - number: '20'
    text: |-
      Om in het desbetreffende register als tandarts te kunnen worden ingeschreven, wordt vereist het bezit van een
      getuigschrift waaruit blijkt dat de betrokkene voldoet aan de daartoe bij algemene maatregel van bestuur gestelde
      opleidingseisen.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel20
  - number: '21'
    text: |-
      Tot het gebied van deskundigheid van de tandarts wordt gerekend het verrichten van handelingen op het gebied van
      de tandheelkunst.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel21
  - number: '22'
    text: |-
      Om in het desbetreffende register als apotheker te kunnen worden ingeschreven, wordt vereist het bezit van een
      getuigschrift waaruit blijkt dat de betrokkene voldoet aan de daartoe bij algemene maatregel van bestuur gestelde
      opleidingseisen
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel22
  - number: '23'
    text: |-
      Tot het gebied van deskundigheid van de apotheker wordt gerekend het verrichten van handelingen op het gebied van
      de artsenijbereidkunst.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel23
  - number: '24'
    text: |-
      Om in het desbetreffende register als gezondheidszorgpsycholoog te kunnen worden ingeschreven, wordt vereist het
      bezit van een getuigschrift waaruit blijkt dat de betrokkene voldoet aan de daartoe bij algemene maatregel van
      bestuur gestelde opleidingseisen.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel24
  - number: '25'
    text: |-
      Tot het gebied van deskundigheid van de gezondheidszorgpsycholoog wordt gerekend het verrichten van psychologisch
      onderzoek, het beoordelen van de resultaten daarvan alsmede het toepassen van bij algemene maatregel van
      bestuur aan te wijzen psychologische behandelingsmethoden ten aanzien van een persoon met het oog op diens
      gezondheidstoestand.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel25
  - number: '26.1'
    text: |-
      Om in het desbetreffende register als psychotherapeut te kunnen worden ingeschreven, wordt vereist het bezit
      van een getuigschrift waaruit blijkt dat de betrokkene voldoet aan de daartoe bij algemene maatregel van bestuur
      gestelde opleidingseisen.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel26
  - number: '26.2'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat met een getuigschrift als bedoeld in het eerste lid
      wordt gelijkgesteld een bewijs van een krachtens [artikel 14][ref1] onderscheidenlijk [artikel 16][ref2] verleende
      erkenning als specialist op een bij de maatregel aangewezen deelgebied van de uitoefening van een beroep waarop een
      register betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel16
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '14'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '16'
        hoofdstuk: II
        paragraaf: '2'
  - number: '27'
    text: |-
      Tot het gebied van deskundigheid van de psychotherapeut wordt gerekend het onderzoeken en het volgens bij algemene
      maatregel van bestuur aan te wijzen methoden beïnvloeden van stemmingen, gedragingen en houdingen van een persoon
      met een psychische stoornis, afwijking of klacht, teneinde deze te doen verdwijnen of te verminderen.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel27
  - number: '28'
    text: |-
      Om in het desbetreffende register als fysiotherapeut te kunnen worden ingeschreven, wordt vereist het bezit van een
      getuigschrift waaruit blijkt dat de betrokkene voldoet aan de daartoe bij algemene maatregel van bestuur gestelde
      opleidingseisen.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel28
  - number: '29.1'
    text: |-
      Tot het gebied van deskundigheid van de fysiotherapeut wordt gerekend het verrichten van bij algemene maatregel
      van bestuur te omschrijven handelingen op het gebied van de fysiotherapie, voor zover zij liggen op het gebied van
      de geneeskunst.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel29
  - number: '29.2'
    text: |-
      Tot het gebied van deskundigheid van de fysiotherapeut wordt mede gerekend het verrichten van handelingen,
      rechtstreeks betrekking hebbende op een persoon en ertoe strekkende diens gezondheidstoestand te bevorderen of
      te bewaken, welke overeenkomen met de krachtens het eerste lid omschreven handelingen, doch niet liggende op het
      gebied van de geneeskunst.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel29
  - number: '30'
    text: |-
      Om in het desbetreffende register als verloskundige te kunnen worden ingeschreven, wordt vereist het bezit van een
      getuigschrift waaruit blijkt dat de betrokkene voldoet aan de daartoe bij algemene maatregel van bestuur gestelde
      opleidingseisen.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel30
  - number: '31'
    text: |-
      Tot het gebied van deskundigheid van de verloskundige wordt gerekend het verrichten van bij algemene maatregel van
      bestuur te omschrijven handelingen op het gebied van de verloskunst alsmede het verrichten van bij de maatregel te
      omschrijven andere handelingen, een en ander met inachtneming van de beperkingen, bij de maatregel te stellen.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel31
  - number: '32'
    text: |-
      Om in het desbetreffende register als verpleegkundige te kunnen worden ingeschreven, wordt vereist het bezit
      van een getuigschrift waaruit blijkt dat de betrokkene voldoet aan de daartoe bij algemene maatregel van bestuur
      gestelde opleidingseisen dan wel voor zover het betreft het diploma van een beroepsopleiding als bedoeld in de
      [Wet educatie en beroepsonderwijs][ref1], voldoet aan de bij en krachtens die wet voor de afgifte van dat diploma
      gestelde vereisten.


      [ref1]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0007625
  - number: '33'
    text: 'Tot het gebied van deskundigheid van de verpleegkundige wordt gerekend:'
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel33
  - number: 33.a
    text: het verrichten van handelingen op het gebied van observatie, begeleiding, verpleging en verzorging;
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel33
  - number: 33.b
    text: |-
      het ingevolge opdracht van een beroepsbeoefenaar op het gebied van de individuele gezondheidszorg verrichten van
      handelingen in aansluiting op diens diagnostische en therapeutische werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel33
  - number: '34.1'
    text: |-
      Bij algemene maatregel van bestuur kan ter bevordering van een goede uitoefening van individuele gezondheidszorg de
      opleiding tot een bij de maatregel aangewezen beroep worden geregeld of aangewezen.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel34
  - number: '34.2'
    text: |-
      Indien toepassing wordt gegeven aan het eerste lid, wordt tevens bij de maatregel het gebied van deskundigheid
      omschreven van personen die de krachtens het eerste lid geregelde of aangewezen opleiding hebben voltooid.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel34
  - number: '34.3'
    text: |-
      Aan degenen die de krachtens het eerste lid geregelde of aangewezen opleiding tot dat beroep hebben voltooid, is
      het recht voorbehouden een bij algemene maatregel van bestuur aangegeven titel te voeren.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel34
  - number: '34.4'
    text: |-
      Het is degene wie het recht tot het voeren van een krachtens het derde lid geregelde titel niet toekomt, verboden
      deze titel, een daarop gelijkende benaming dan wel een op die titel betrekking hebbend onderscheidingsteken,
      aangegeven met toepassing van [artikel 93][ref1] of daarmee in hoofdzaak overeenstemmend, te voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel93
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '93'
        hoofdstuk: IX
  - number: '35.1'
    text: |-
      Het is degene die niet behoort tot de personen die hun bevoegdheid tot het verrichten van een handeling ontlenen
      aan het bepaalde bij of krachtens de [artikelen 36][ref1] en [37][ref2] verboden buiten noodzaak beroepsmatig die
      handeling te verrichten, tenzij:


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel37
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '36'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '37'
        hoofdstuk: IV
  - number: 35.1.a
    text: |-
      zulks geschiedt ingevolge een opdracht van een persoon die zijn bevoegdheid ontleent aan het bepaalde bij of
      krachtens de [artikelen 36][ref1] en [37][ref2] en


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel37
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '36'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '37'
        hoofdstuk: IV
  - number: 35.1.b
    text: |-
      hij redelijkerwijs mag aannemen dat hij beschikt over de bekwaamheid die vereist is voor het behoorlijk uitvoeren
      van de opdracht en
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel35
  - number: 35.1.c
    text: hij, voor zover de opdrachtgever aanwijzingen heeft gegeven, heeft gehandeld overeenkomstig die aanwijzingen.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel35
  - number: '35.2'
    text: |-
      Met inachtneming van het bepaalde in het eerste lid is de opdrachtnemer bevoegd tot het verrichten van de in het
      eerste lid bedoelde handeling.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel35
  - number: '36.1'
    text: |-
      Tot het verrichten van heelkundige handelingen - waaronder worden verstaan handelingen, liggende op het gebied van
      de geneeskunst, waarbij de samenhang der lichaamsweefsels wordt verstoord en deze zich niet direct herstelt - zijn
      bevoegd:
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel36
  - number: 36.1.a
    text: de artsen,
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel36
  - number: 36.1.b
    text: de tandartsen,
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel36
  - number: 36.1.c
    text: de verloskundigen,
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel36
  - number: '36.2'
    text: 'Tot het verrichten van verloskundige handelingen zijn bevoegd:'
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel36
  - number: 36.2.a
    text: de artsen,
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel36
  - number: 36.2.b
    text: |-
      de verloskundigen, doch dezen uitsluitend voor zover het betreft handelingen, in de aanhef van dit lid bedoeld,
      die overeenkomstig het bij of krachtens [hoofdstuk III][ref1] bepaalde worden gerekend tot hun gebied van
      deskundigheid.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0006251
        hoofdstuk: III
  - number: '36.3'
    text: 'Tot het verrichten van endoscopieën zijn bevoegd: de artsen.'
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel36
  - number: '36.4'
    text: 'Tot het verrichten van catheterisaties zijn bevoegd:'
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel36
  - number: 36.4.a
    text: de artsen,
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel36
  - number: 36.4.b
    text: |-
      de verloskundigen, doch dezen uitsluitend voor zover het betreft handelingen, in de aanhef van dit lid bedoeld,
      die overeenkomstig het bij of krachtens [hoofdstuk III][ref1] bepaalde worden gerekend tot hun gebied van
      deskundigheid.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0006251
        hoofdstuk: III
  - number: '36.5'
    text: 'Tot het geven van injekties zijn bevoegd:'
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel36
  - number: 36.5.a
    text: de artsen,
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel36
  - number: 36.5.b
    text: de tandartsen,
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel36
  - number: 36.5.c
    text: de verloskundigen,
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel36
  - number: '36.6'
    text: 'Tot het verrichten van punkties zijn bevoegd:'
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel36
  - number: 36.6.a
    text: de artsen,
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel36
  - number: 36.6.b
    text: |-
      de verloskundigen, doch dezen uitsluitend voor zover het betreft handelingen, in de aanhef van dit lid bedoeld,
      die overeenkomstig het bij of krachtens [hoofdstuk III][ref1] bepaalde worden gerekend tot hun gebied van
      deskundigheid.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0006251
        hoofdstuk: III
  - number: '36.7'
    text: 'Tot het brengen onder narcose zijn bevoegd:'
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel36
  - number: 36.7.a
    text: de artsen,
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel36
  - number: 36.7.b
    text: |-
      de tandartsen, doch dezen uitsluitend voor zover het betreft handelingen, in de aanhef van dit lid bedoeld, die
      overeenkomstig het bij [hoofdstuk III][ref1] bepaalde worden gerekend tot hun gebied van deskundigheid.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0006251
        hoofdstuk: III
  - number: '36.8'
    text: |-
      Tot het verrichten van handelingen, op het gebied van de individuele gezondheidszorg, met gebruikmaking van
      radioactieve stoffen of toestellen die ioniserende stralen uitzenden, zijn bevoegd:
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel36
  - number: 36.8.a
    text: de artsen,
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel36
  - number: 36.8.b
    text: de tandartsen,
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel36
  - number: '36.9'
    text: 'Tot het verrichten van electieve cardioversie zijn bevoegd: de artsen.'
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel36
  - number: '36.10'
    text: 'Tot het toepassen van defibrillatie zijn bevoegd: de artsen.'
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel36
  - number: '36.11'
    text: 'Tot het toepassen van electroconvulsieve therapie zijn bevoegd: de artsen.'
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel36
  - number: '36.12'
    text: 'Tot steenvergruizing voor geneeskundige doeleinden zijn bevoegd: de artsen.'
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel36
  - number: '36.13'
    text: |-
      Tot het verrichten van handelingen ten aanzien van menselijke geslachtscellen en embryo's, gericht op het anders
      dan op natuurlijke wijze tot stand brengen van een zwangerschap, zijn bevoegd: de artsen.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel36
  - number: '36.14'
    text: |-
      De personen, genoemd in het eerste tot en met dertiende lid, zijn tot het verrichten van de desbetreffende
      handelingen uitsluitend bevoegd voor zover zij redelijkerwijs mogen aannemen dat zij beschikken over de bekwaamheid
      die vereist is voor het behoorlijk verrichten van die handelingen. De personen, genoemd in het eerste tot en
      met het dertiende lid, die niet voldoen aan het bepaalde in de eerste volzin, worden voor de toepassing van de
      [artikelen 35, eerste lid, onder ][ref1], [38][ref2] en [39][ref3] aangemerkt als personen die hun bevoegdheid
      ontlenen aan het in dit artikel bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0006251#Artikel39
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '35'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '38'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0006251
        artikel: '39'
        hoofdstuk: IV
  - number: '37.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels overeenkomstig [artikel 36][ref1] worden gesteld met betrekking
      tot bij de maatregel omschreven handelingen op het gebied van de individuele gezondheidszorg, niet vallende onder
      dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel36
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '36'
        hoofdstuk: IV
  - number: '37.2'
    text: |-
      Bij algemene maatregel van bestuur kan voorts met betrekking tot bij de maatregel omschreven handelingen, vallende
      onder [artikel 36][ref1], wijziging worden gebracht ter zake van de in [artikel 36][ref2] vervatte toekenning van
      bevoegdheid, alsook worden bepaald dat de [artikelen 35][ref3] en [36][ref4] met betrekking tot bij de maatregel
      omschreven handelingen niet langer gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0006251#Artikel35
      [ref4]: https://wetten.overheid.nl/BWBR0006251#Artikel36
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '36'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '36'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0006251
        artikel: '35'
        hoofdstuk: IV
      - id: ref4
        bwb_id: BWBR0006251
        artikel: '36'
        hoofdstuk: IV
  - number: '37.3'
    text: |-
      Indien niet binnen zes maanden na de inwerkingtreding van een algemene maatregel van bestuur als bedoeld in het
      eerste of tweede lid bij de Tweede Kamer der Staten-Generaal een wetsvoorstel is ingediend tot wijziging van
      [artikel 36][ref1] overeenkomstig die maatregel, alsook indien zodanig voorstel wordt ingetrokken of verworpen,
      wordt de maatregel onverwijld ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel36
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '36'
        hoofdstuk: IV
  - number: '38'
    text: |-
      Het is degene die zijn bevoegdheid tot het verrichten van een bij of krachtens de [artikelen 36][ref1] en
      [37][ref2] omschreven handeling ontleent aan het bij of krachtens die artikelen bepaalde verboden aan een ander
      opdracht te geven tot het verrichten van die handeling, tenzij:


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel37
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '36'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '37'
        hoofdstuk: IV
  - number: 38.a
    text: |-
      in gevallen waarin zulks redelijkerwijs nodig is aanwijzingen worden gegeven omtrent het verrichten van de
      handeling en toezicht door de opdrachtgever op het verrichten van de handeling en de mogelijkheid tot tussenkomst
      van een zodanig persoon voldoende zijn verzekerd en
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel38
  - number: 38.b
    text: |-
      hij redelijkerwijs mag aannemen dat degene aan wie de opdracht wordt gegeven, in aanmerking genomen het onder *a*
      bepaalde, beschikt over de bekwaamheid die vereist is voor het behoorlijk verrichten van de handeling.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel38
  - number: '39.1'
    text: |-
      Indien een goede uitoefening van individuele gezondheidszorg zulks vordert, wordt bij algemene maatregel van
      bestuur bepaald dat tot het gebied van deskundigheid van personen, behorende tot een der in het tweede lid genoemde
      categorieën, wordt gerekend het verrichten van bij de maatregel aangewezen categorieën van handelingen, behorende
      tot de bij of krachtens de [artikelen 36][ref1] en [37][ref2] omschreven categorieën van handelingen, zonder
      toezicht door de opdrachtgever en zonder diens tussenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel37
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '36'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '37'
        hoofdstuk: IV
  - number: '39.2'
    text: 'Ingevolge het eerste lid kunnen de volgende categorieën van personen worden aangewezen:'
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel39
  - number: 39.2.a
    text: |-
      categorieën van personen die in een bij het eerste lid bedoelde algemene maatregel van bestuur aangewezen register
      staan ingeschreven;
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel39
  - number: 39.2.b
    text: |-
      categorieën van personen die een krachtens [artikel 34, eerste lid][ref1], geregelde of aangewezen opleiding hebben
      voltooid;


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel34
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '34'
        hoofdstuk: III
        afdeling: '2'
  - number: 39.2.c
    text: categorieën van personen, behorende tot de onder *a* of *b* bedoelde categorieën van personen.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel39
  - number: '40.1'
    text: |-
      Degene die in een register als bedoeld in [artikel 3][ref1] staat ingeschreven of die een beroep uitoefent waarvan
      de opleiding krachtens [artikel 34, eerste lid][ref2], is geregeld of aangewezen, en die zijn beroep uitoefent
      anders dan in het kader van een instelling als bedoeld in de [Kwaliteitswet zorginstellingen][ref3], organiseert
      zijn beroepsuitoefening op zodanige wijze en voorziet zich zodanig van materieel, dat een en ander leidt of
      redelijkerwijze moet leiden tot verantwoorde zorg.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0007850
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '34'
        hoofdstuk: III
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0007850
  - number: '40.2'
    text: |-
      Het uitvoeren van het eerste lid omvat mede de systematische bewaking, beheersing en verbetering van de kwaliteit
      van de zorg.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel40
  - number: '40.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen, indien het niveau van de uitoefening van de individuele gezondheidszorg
      dit vereist, regels worden gesteld met betrekking tot de uitvoering van het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel40
  - number: '40.4'
    text: |-
      Bij algemene maatregel van bestuur kunnen voorts, indien zulks noodzakelijk is gebleken ter bevordering
      van een goede uitoefening van individuele gezondheidszorg, voor degenen die in een register als bedoeld
      in [artikel 3][ref1] staan ingeschreven of die een beroep uitoefenen waarvan de opleiding krachtens
      [artikel 34, eerste lid][ref2], is geregeld of aangewezen, regels worden gesteld inhoudende:


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel34
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '34'
        hoofdstuk: III
        afdeling: '2'
  - number: 40.4.a
    text: |-
      een verplichting in bij de maatregel aangegeven gevallen van een door hen gegeven behandeling aan een bij de
      maatregel aangewezen inspecteur van de volksgezondheid opgave te doen overeenkomstig regels, bij de maatregel
      gesteld;
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel40
  - number: 40.4.b
    text: |-
      een verplichting om bij de maatregel aangegeven gegevens te vermelden op het recept, bedoeld in
      [artikel 1, eerste lid, onder ][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel1
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0002290
        artikel: '1'
  - number: 40.4.c
    text: |-
      een verbod om een overeenkomst die hun bijzondere voordelen verschaft, aan te gaan met bij de maatregel aangewezen
      categorieën van personen;
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel40
  - number: 40.4.d
    text: eisen met betrekking tot de rechten van personen aan wie gezondheidszorg wordt verleend.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel40
  - number: '41.1'
    text: |-
      In afwijking van het in [artikel 6, onder a][ref1], bepaalde wordt aan een persoon die niet voldoet aan de ter zake
      van de genoten opleiding bij of krachtens [hoofdstuk III][ref2] voor inschrijving in een register gestelde eisen,
      inschrijving in het register deswege niet geweigerd:


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0006251#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '6'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006251
        hoofdstuk: III
  - number: 41.1.a
    text: |-
      indien hij in het buitenland een door Onze Minister aangewezen getuigschrift heeft verkregen dat geldt als bewijs
      van een verworven vakbekwaamheid die geacht kan worden gelijkwaardig te zijn aan de vakbekwaamheid welke uit het
      voldoen aan vorenbedoelde eisen mag worden afgeleid;
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel41
  - number: 41.1.b
    text: |-
      indien Onze Minister, gelet op een door de betrokkene in het buitenland verkregen getuigschrift en op de daarnaast
      opgedane beroepservaring en gevolgde opleiding, hem op aanvrage een verklaring heeft afgegeven, inhoudende dat
      tegen zijn inschrijving in het register voor wat zijn vakbekwaamheid betreft geen bedenkingen bestaan;
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel41
  - number: 41.1.c
    text: |-
      indien aan hem ten aanzien van het betrokken beroep een EG-verklaring als bedoeld in de Algemene wet erkenning EG-
      hoger-onderwijsdiploma’s dan wel in de [Algemene wet erkenning EG-beroepsopleidingen][ref1] is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0006781
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0006781
  - number: '41.2'
    text: |-
      Onze Minister kan ten aanzien van een door hem krachtens het eerste lid, onder *a*, aangewezen getuigschrift de
      toepasselijkheid van deze bepaling op belanghebbenden afhankelijk stellen van de nationaliteit der betrokkenen, met
      dien verstande evenwel dat die bepaling ten aanzien van een aangewezen getuigschrift van een lid-Staat der Europese
      Economische Gemeenschap alsmede van een andere overeenkomstsluitende staat in elk geval van toepassing dient te
      zijn op de onderdanen van de lid-Staten van die gemeenschap.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel41
  - number: '41.3'
    text: 'Bij afgifte van een verklaring als bedoeld in het eerste lid, onder *b*, kan Onze Minister daarin bepalen:'
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel41
  - number: 41.3.a
    text: |-
      dat de gelet op die verklaring tot stand gekomen inschrijving in het register op een in de verklaring aangegeven
      tijdstip zal worden doorgehaald;
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel41
  - number: 41.3.b
    text: |-
      dat de betrokkene, in het register ingeschreven staande, zijn beroep slechts zal mogen uitoefenen met inachtneming
      van in de verklaring omschreven beperkingen.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel41
  - number: '41.4'
    text: |-
      Behoudens in bijzondere gevallen kan een verklaring zonder toepassing van het derde lid slechts worden afgegeven,
      indien het door de betrokkene in het buitenland verkregen getuigschrift naar het oordeel van Onze Minister kan
      gelden als bewijs van verworven vakbekwaamheid die de in het eerste lid, onder *a*, bedoelde gelijkwaardigheid
      bezit.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel41
  - number: '41.5'
    text: |-
      Onze Minister stelt voor elk daarvoor in aanmerking komend beroep een commissie van deskundigen in, die tot taak
      heeft hem op zijn verzoek of uit eigen beweging van advies te dienen inzake de toepassing van dit artikel en ten
      aanzien van het afgeven van een EG-verklaring als bedoeld in de Algemene wet erkenning EG-hoger-onderwijsdiploma’s
      dan wel in de [Algemene wet erkenning EG-beroepsopleidingen][ref1]. Bij algemene maatregel van bestuur worden de
      samenstelling, taak en werkwijze van de commissie geregeld. Bij algemene maatregel van bestuur kunnen regels worden
      gesteld met betrekking tot het afleggen van een kennis- en vaardighedentoets en het daarvoor in rekening te brengen
      tarief.


      [ref1]: https://wetten.overheid.nl/BWBR0006781
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0006781
  - number: '41.6'
    text: |-
      Van een besluit krachtens het eerste lid, onder *a*, of het tweede lid, wordt mededeling gedaan in de
      *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel41
  - number: '42.1'
    text: |-
      Onverminderd het in [artikel 6, onder b tot en met d][ref1], bepaalde wordt de inschrijving van een persoon op
      wie [artikel 41][ref2] van toepassing is, geweigerd indien te zijnen aanzien een maatregel, berustende op een in
      het buitenland gegeven rechterlijke, tuchtrechtelijke of bestuursrechtelijke beslissing, van kracht is, op grond
      waarvan hij zijn rechten ter zake van de uitoefening van het betrokken beroep in het land waar de beslissing
      gegeven is, geheel of gedeeltelijk, tijdelijk of blijvend, heeft verloren.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel41
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '6'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '41'
        hoofdstuk: VI
        paragraaf: '1'
  - number: '42.2'
    text: 'Bij algemene maatregel van bestuur worden regels gesteld, waarbij wordt bepaald:'
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel42
  - number: 42.2.a
    text: |-
      welke gegevens of bescheiden bij de aanvrage om een verklaring als bedoeld in
      [artikel 41, eerste lid, onder b][ref1], aan Onze Minister moeten worden verstrekt of overgelegd en op welke wijze
      haar indiening behoort te geschieden;


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel41
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '41'
        hoofdstuk: VI
        paragraaf: '1'
  - number: 42.2.b
    text: |-
      welke bewijsstukken omtrent de toepasselijkheid van [artikel 41][ref1] aan Onze Minister moeten worden overgelegd
      bij de aanvrage om inschrijving in het register met toepassing van dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel41
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '41'
        hoofdstuk: VI
        paragraaf: '1'
  - number: '42.3'
    text: |-
      Onverminderd het in [artikel 7][ref1] bepaalde, wordt in gevallen waarin toepassing werd gegeven aan
      [artikel 41, derde lid, onder a][ref2], de inschrijving van de betrokkene op het daarvoor geldende tijdstip
      doorgehaald. Een met toepassing van [artikel 41][ref3] tot stand gekomen inschrijving wordt voorts doorgehaald
      ingeval ten aanzien van de betrokkene omstandigheden als bedoeld in het eerste lid inmiddels zijn ingetreden of
      alsnog bekend geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel41
      [ref3]: https://wetten.overheid.nl/BWBR0006251#Artikel41
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '7'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '41'
        hoofdstuk: VI
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0006251
        artikel: '41'
        hoofdstuk: VI
        paragraaf: '1'
  - number: '42.4'
    text: |-
      Bij inschrijving van een persoon in het register met toepassing van [artikel 41][ref1] wordt in het register een
      desbetreffende aantekening geplaatst, waarbij, ingeval Onze Minister toepassing heeft gegeven aan het derde lid van
      dat artikel, tevens wordt omschreven hetgeen daarbij is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel41
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '41'
        hoofdstuk: VI
        paragraaf: '1'
  - number: '42.5'
    text: |-
      Van de totstandkoming van een inschrijving ten aanzien waarvan toepassing werd gegeven aan
      [artikel 41, derde lid][ref1], wordt op bij algemene maatregel van bestuur te bepalen wijze kennisgegeven,
      met omschrijving van hetgeen daarbij werd bepaald. Van een krachtens het derde lid van het onderhavige artikel
      verrichte doorhaling van een inschrijving wordt eveneens op bij algemene maatregel van bestuur te bepalen wijze
      kennisgegeven. In kennisgevingen als bedoeld in het onderhavige lid worden de naam en de woonplaats van de
      betrokkene vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel41
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '41'
        hoofdstuk: VI
        paragraaf: '1'
  - number: '42.6'
    text: |-
      Onverminderd hetgeen ingevolge [artikel 12, tweede lid][ref1], met betrekking tot de ingeschrevene geldt, wordt aan
      een ieder die zulks verlangt, medegedeeld of een inschrijving in het register met toepassing van [artikel 41][ref2]
      is tot stand gekomen, met, ingeval ten aanzien van de aldus tot stand gekomen inschrijving toepassing werd gegeven
      aan het derde lid van dat artikel, een omschrijving van hetgeen daarbij werd bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel41
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '12'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '41'
        hoofdstuk: VI
        paragraaf: '1'
  - number: '43.1'
    text: |-
      Ten aanzien van een onderdaan van een lid-Staat der Europese Economische Gemeenschap of van een andere
      overeenkomstsluitende staat, die buiten Nederland in een der lid-Staten van die gemeenschap dan wel in een van de
      andere overeenkomstsluitende staten gevestigd is als beoefenaar van een in [artikel 3][ref1] genoemd beroep en aan
      de in het tweede lid omschreven voorwaarden voldoet, blijven ter zake van de diensten die hij in de uitoefening van
      dat beroep verleent aan een persoon hier te lande, buiten toepassing:


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel3
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
  - number: 43.1.a
    text: |-
      het in [artikel 4, tweede lid][ref1], gestelde verbod, voor zover het de titel betreft, waarvan het voeren
      voorbehouden is aan degenen die in de op dat beroep betrekking hebbende hoedanigheid in het desbetreffende register
      ingeschreven staan;


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel4
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
  - number: 43.1.b
    text: |-
      het in [artikel 35, eerste lid][ref1], gestelde verbod, voor zover het handelingen betreft, waartoe de onder *a*
      bedoelde personen bevoegd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel35
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '35'
        hoofdstuk: IV
  - number: '43.2'
    text: 'De in het eerste lid bedoelde voorwaarden zijn:'
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel43
  - number: 43.2.a
    text: |-
      de betrokkene dient in een der lid-Staten dan wel in een van de andere overeenkomstsluitende staten een op de
      bekwaamheid tot het uitoefenen van zijn beroep betrekking hebbend getuigschrift te hebben verkregen, dat krachtens
      [artikel 41, eerste lid, onder ][ref1], is aangewezen;


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel41
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '41'
        hoofdstuk: VI
        paragraaf: '1'
  - number: 43.2.b
    text: |-
      zijn rechten ter zake van de uitoefening van zijn beroep in de lid-Staat onderscheidenlijk een andere
      overeenkomstsluitende staat waar hij gevestigd is mogen aan geen beperkingen krachtens een maatregel als bedoeld in
      [artikel 42, eerste lid][ref1], onderworpen zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel42
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '42'
        hoofdstuk: VI
        paragraaf: '1'
  - number: 43.2.c
    text: |-
      de betrokkene dient aan Onze Minister te hebben gemeld dat hij als beoefenaar van het desbetreffende beroep in
      Nederland diensten verleent en dient de volgende bescheiden te hebben overgelegd:
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel43
  - number: 43.2.c.1°
    text: |-
      een bewijsstuk, niet ouder dan twaalf maanden, waaruit blijkt dat hij de desbetreffende werkzaamheden in de lid-
      Staat onderscheidenlijk de andere overeenkomstsluitende staat waar hij gevestigd is, wettig uitoefent;
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel43
  - number: 43.2.c.2°
    text: een bewijsstuk dat hij het onder *a* bedoelde getuigschrift heeft verkregen.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel43
  - number: '43.3'
    text: |-
      In geval van een dienstverlening in Nederland, ten aanzien waarvan het eerste lid van toepassing is, is de
      betrokkene, indien de in dat lid, onder *a*, bedoelde personen aan tuchtrechtspraak overeenkomstig deze wet
      onderworpen zijn, ter zake van hetgeen door hem in het kader van die dienstverlening wordt verricht, eveneens
      aan bedoelde rechtspraak onderworpen en wordt hij ter zake van deze verrichtingen voor de toepassing van
      [artikel 96][ref1] met die personen gelijkgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel96
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '96'
        hoofdstuk: X
  - number: '44.1'
    text: |-
      Voor de toepassing van de [artikelen 41, eerste lid, onder a, en tweede lid][ref1], en
      [43, tweede lid, onder a][ref2], wordt met een onderdaan van een lid-Staat der Europese Economische Gemeenschap
      onderscheidenlijk een andere overeenkomstsluitende staat, die in het bezit is van een krachtens eerstgenoemde
      bepaling aangewezen getuigschrift van een der lid-Staten van die gemeenschap onderscheidenlijk een andere
      overeenkomstsluitende staat, gelijkgesteld de onderdaan van een lid-Staat onderscheidenlijk een andere
      overeenkomstsluitende staat, die vóór een door Onze Minister vast te stellen tijdstip een op de bekwaamheid tot
      het uitoefenen van zijn beroep betrekking hebbend ander getuigschrift van een der lid-Staten onderscheidenlijk een
      andere overeenkomstsluitende staat heeft verkregen indien hij, blijkens een door een lid-Staat onderscheidenlijk
      een andere overeenkomstsluitende staat afgegeven verklaring, zijn beroep in de loop van een door Onze Minister
      aangegeven tijdvak, aan de afgifte van die verklaring voorafgaande, tenminste gedurende een door Onze Minister
      aangegeven aaneengesloten periode daadwerkelijk en op wettige wijze heeft uitgeoefend.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel43
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '41'
        hoofdstuk: VI
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '43'
        hoofdstuk: VI
        paragraaf: '1'
  - number: '44.2'
    text: |-
      Onze Minister kan bepalen dat het eerste lid van overeenkomstige toepassing is ten aanzien van een onderdaan van
      een lid-Staat der Europese Economische Gemeenschap of van een andere overeenkomstsluitende staat, die een op de
      bekwaamheid tot het uitoefenen van zijn beroep betrekking hebbend ander getuigschrift van een der lid-Staten of van
      een andere overeenkomstsluitende staat heeft verkregen ter afsluiting van een opleiding betreffende een door Onze
      Minister aangewezen beroep, welke vóór het krachtens het vorige lid vastgestelde tijdstip is aangevangen en eerst
      nadien is voltooid.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel44
  - number: '44.3'
    text: |-
      De krachtens het eerste lid vast te stellen tijdstippen, tijdvakken en perioden kunnen voor onderscheidene
      categorieën van gevallen verschillend zijn.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel44
  - number: '45.1'
    text: Ten aanzien van degenen
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel45
  - number: 45.1.a
    text: |-
      die in het buitenland een door Onze Minister aangewezen getuigschrift hebben verkregen dat geldt als bewijs van een
      verworven vakbekwaamheid die geacht kan worden gelijkwaardig te zijn aan de vakbekwaamheid welke uit het voldoen
      aan de desbetreffende krachtens [artikel 34, eerste lid][ref1], gestelde eisen mag worden afgeleid,


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel34
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '34'
        hoofdstuk: III
        afdeling: '2'
  - number: 45.1.b
    text: |-
      aan wie Onze Minister, gelet op een door de betrokkene in het buitenland verkregen getuigschrift en op de daarnaast
      opgedane beroepservaring en gevolgde opleiding, op aanvrage een verklaring heeft afgegeven, inhoudende dat hun
      vakbekwaamheid gelijkwaardig of nagenoeg gelijkwaardig kan worden geacht aan de vakbekwaamheid welke uit het
      voldoen aan de desbetreffende krachtens [artikel 34, eerste lid][ref1], gestelde eisen mag worden afgeleid, of,


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel34
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '34'
        hoofdstuk: III
        afdeling: '2'
  - number: 45.1.c
    text: |-
      aan wie Onze Minister ten aanzien van het betrokken beroep een EG-verklaring als
      bedoeld in de [Algemene wet erkenning EG-hoger-onderwijsdiplopa’s][ref1] dan wel in de
      [Algemene wet erkenning EG-beroepsopleidingen][ref2] heeft afgegeven,


      [ref1]: https://wetten.overheid.nl/BWBR0006317
      [ref2]: https://wetten.overheid.nl/BWBR0006781
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0006317
      - id: ref2
        bwb_id: BWBR0006781
  - number: '45.2'
    text: |-
      Het eerste lid is niet van toepassing voor zover ten aanzien van de betrokkene een maatregel, berustende op een
      in het buitenland gegeven rechterlijke, tuchtrechtelijke of bestuursrechtelijke beslissing, van kracht is, op
      grond waarvan hij zijn rechten ter zake van de uitoefening van het betrokken beroep in het land waar de beslissing
      gegeven is, geheel of gedeeltelijk, tijdelijk of blijvend, heeft verloren.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel45
  - number: '45.3'
    text: |-
      De [artikelen 41, tweede, vijfde en zesde lid][ref1], en [42, tweede lid, onder ][ref2], zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel42
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '41'
        hoofdstuk: VI
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '42'
        hoofdstuk: VI
        paragraaf: '1'
  - number: '45.4'
    text: |-
      Voor de toepassing van [artikel 96, derde lid][ref1], wordt met degene die voldoet aan de krachtens
      [artikel 34, eerste lid][ref2], gestelde eisen gelijkgesteld degene die in het bezit is van een krachtens het
      eerste lid, onder *a*, aangewezen getuigschrift of aan wie een verklaring als bedoeld in het eerste lid, onder *b*,
      is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel96
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel34
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '96'
        hoofdstuk: X
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '34'
        hoofdstuk: III
        afdeling: '2'
  - number: '46'
    text: |-
      In hetgeen verder ter uitvoering van de richtlijnen der Europese Economische Gemeenschap alsmede van de
      Overeenkomst betreffende de Europese Economische Ruimte en van de op 21 juni 1999 te Luxemburg totstandgekomen
      Overeenkomst tussen de Europese Gemeenschap en haar lidstaten, enerzijds, en de Zwitserse Bondsstaat anderzijds,
      over het vrije verkeer van personen (Trb. 2000, 16 en 86), betreffende beoefenaren van beroepen op het gebied van
      de individuele gezondheidszorg regeling behoeft, wordt voorzien door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel46
  - number: '47.1'
    text: |-
      Degene die in een der in het tweede lid vermelde hoedanigheden in een register ingeschreven staat, is onderworpen
      aan tuchtrechtspraak ter zake van:
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel47
  - number: 47.1.a
    text: 'enig handelen of nalaten in strijd met de zorg die hij in die hoedanigheid behoort te betrachten ten opzichte van:'
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel47
  - number: 47.1.a.1°
    text: degene, met betrekking tot wiens gezondheidstoestand hij bijstand verleent of zijn bijstand is ingeroepen;
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel47
  - number: 47.1.a.2°
    text: degene die, in nood verkerende, bijstand met betrekking tot zijn gezondheidstoestand behoeft;
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel47
  - number: 47.1.a.3°
    text: de naaste betrekkingen van de onder 1° en 2° bedoelde personen;
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel47
  - number: 47.1.b
    text: |-
      enig ander dan onder *a* bedoeld handelen of nalaten in die hoedanigheid in strijd met het belang van een goede
      uitoefening van individuele gezondheidszorg.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel47
  - number: '47.2'
    text: |-
      De in het eerste lid bedoelde hoedanigheden zijn die van: arts, tandarts, apotheker, gezondheidszorgpsycholoog,
      psychotherapeut, fysiotherapeut, verloskundige, verpleegkundige.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel47
  - number: '47.3'
    text: |-
      De tuchtrechtspraak wordt in eerste aanleg uitgeoefend door regionale tuchtcolleges en in beroep door een centraal
      tuchtcollege.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel47
  - number: '47.4'
    text: |-
      In geval van schorsing of doorhaling van een inschrijving in het register blijft de betrokkene ter zake van enig
      in het eerste lid bedoeld handelen of nalaten gedurende de tijd dat hij ingeschreven stond, aan de tuchtrechtspraak
      onderworpen.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel47
  - number: '48.1'
    text: |-
      Het berechtende college kan ten aanzien van een aan de tuchtrechtspraak onderworpen persoon een van de volgende
      tuchtrechtelijke maatregelen opleggen:
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel48
  - number: 48.1.a
    text: waarschuwing;
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel48
  - number: 48.1.b
    text: berisping;
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel48
  - number: 48.1.c
    text: geldboete van ten hoogste € 4 500;
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel48
  - number: 48.1.d
    text: schorsing van de inschrijving in het register voor ten hoogste één jaar;
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel48
  - number: 48.1.e
    text: |-
      gedeeltelijke ontzegging van de bevoegdheid in het register ingeschreven staande het betrokken beroep uit te
      oefenen;
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel48
  - number: 48.1.f
    text: doorhaling van de inschrijving in het register.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel48
  - number: '48.2'
    text: |-
      De maatregelen, bedoeld in het eerste lid, onder *c* en *d*, kunnen ook gezamenlijk worden opgelegd en gelden
      alsdan voor de toepassing van de aanhef van het eerste lid en van [artikel 69, tweede lid][ref1], als één
      maatregel.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel69
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '69'
        hoofdstuk: VII
        paragraaf: '4'
  - number: '48.3'
    text: |-
      In gevallen waarin de berechting plaatsvindt met toepassing van [artikel 47, vierde lid][ref1], kan, in plaats van
      de in het eerste lid van het onderhavige artikel, onder *f*, bedoelde maatregel, als maatregel worden opgelegd een
      ontzegging van het recht wederom in het register te worden ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel47
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '47'
        hoofdstuk: VII
        paragraaf: '1'
  - number: '48.4'
    text: |-
      Opgelegde geldboeten komen ten bate van de Staat. Bij het opleggen van een geldboete kunnen twee of meer termijnen
      worden vastgesteld, waarin zij moet worden voldaan.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel48
  - number: '48.5'
    text: |-
      De maatregelen van schorsing en van doorhaling van de inschrijving in het register worden vanwege Onze Minister ten
      uitvoer gelegd.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel48
  - number: '48.6'
    text: |-
      Schorsing van de inschrijving in het register kan voorwaardelijk worden opgelegd en wordt alsdan niet ten uitvoer
      gelegd dan nadat het college dat de maatregel heeft opgelegd, zulks heeft gelast op grond dat de betrokkene binnen
      een bij die oplegging te bepalen proeftijd van ten hoogste twee jaar een gestelde voorwaarde niet is nagekomen.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel48
  - number: '48.7'
    text: |-
      Een maatregel als bedoeld in het eerste lid, onder *c, d* of *f*, kan niet ten uitvoer worden gelegd zolang de
      beslissing waarbij hij is opgelegd, niet onherroepelijk is geworden. Een maatregel als in dat lid, onder *e*, of
      in het derde lid bedoeld, wordt eerst bij het onherroepelijk worden van de desbetreffende beslissing van kracht,
      tenzij het college, indien het belang van de bescherming van de individuele gezondheidszorg zulks vordert, bij zijn
      beslissing heeft bepaald dat hij onmiddellijk van kracht wordt. Bij toepassing van het zesde lid gaat de in dat lid
      bedoelde proeftijd eerst bij het onherroepelijk worden van de desbetreffende beslissing in.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel48
  - number: '48.8'
    text: |-
      Bij het opleggen van de maatregel van doorhaling van de inschrijving kan het college tevens, indien het belang van
      de bescherming van de individuele gezondheidszorg zulks vordert, bij wijze van voorlopige voorziening, schorsing
      van de inschrijving opleggen. Deze voorziening wordt terstond van kracht en wordt vanwege Onze Minister onverwijld
      ten uitvoer gelegd; de inschrijving blijft geschorst totdat de beslissing tot doorhaling van de inschrijving
      onherroepelijk is geworden dan wel in beroep is vernietigd.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel48
  - number: '48.9'
    text: |-
      Een tot schorsing strekkende maatregel of voorlopige voorziening wordt ten uitvoer gelegd door het plaatsen van een
      aantekening van de schorsing in het register overeenkomstig het bepaalde in [artikel 9][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel9
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '9'
        hoofdstuk: II
        paragraaf: '1'
  - number: '49.1'
    text: |-
      Degene aan wie een boete als bedoeld in [artikel 48, eerste lid, onder c][ref1], is opgelegd, wordt door een door
      Onze Minister aan te wijzen ambtenaar bij gedagtekende brief uitgenodigd de verschuldigde geldboete binnen de
      gestelde termijn dan wel met inachtneming van de gestelde termijnen te betalen.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel48
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '48'
        hoofdstuk: VII
        paragraaf: '2'
  - number: '49.2'
    text: |-
      Indien de schuldenaar niet binnen de gestelde termijn betaalt, maant de ambtenaar hem schriftelijk aan om alsnog
      binnen tien dagen na dagtekening van de aanmaning te betalen.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel49
  - number: '49.3'
    text: |-
      Indien de schuldenaar na de aanmaning in gebreke blijft, kan de invordering van de verschuldigde geldboete en de
      aanmaningskosten geschieden bij een door de ambtenaar uit te vaardigen dwangbevel.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel49
  - number: '49.4'
    text: |-
      De betekening en de tenuitvoerlegging van een dwangbevel geschieden door de zorg van de ontvanger, bedoeld
      in [artikel 2, eerste lid, onderdeel i, van de Invorderingswet 1990][ref1] en door de belastingdeurwaarder,
      bedoeld in [artikel 2, eerste lid, onder j, van die wet][ref2] met toepassing van de [artikelen 13][ref3] en
      [14 van die wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0004770#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0004770#Artikel14
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0004770
        artikel: '13'
      - id: ref4
        bwb_id: BWBR0004770
        artikel: '14'
  - number: '49.5'
    text: |-
      Zolang de ontvanger met de zorg voor de invordering is belast, kan hij een vordering doen op grond van
      [artikel 19 van de Invorderingswet 1990][ref1] alsmede verrekenen op grond van artikel 24 van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel19
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '19'
  - number: '49.6'
    text: |-
      De ontvanger kan zolang hij met de zorg voor de invordering is belast onder door hem te stellen voorwaarden aan
      een schuldenaar voor een bepaalde tijd schriftelijk uitstel van betaling verlenen. Gedurende het uitstel wordt de
      dwanginvordering geschorst. Het uitstel kan tussentijds schriftelijk worden beëindigd.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel49
  - number: '49.7'
    text: |-
      Met betrekking tot het verzet tegen de tenuitvoerlegging van een dwangbevel is
      [artikel 17 van de Invorderingswet 1990][ref1] van overeenkomstige toepassing met dien verstande dat in dat artikel
      voor "de ontvanger die het dwangbevel heeft uitgevaardigd" telkens moet worden gelezen: de met de tenuitvoerlegging
      van het dwangbevel belaste ontvanger.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel17
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '17'
  - number: '49.8'
    text: |-
      De kosten van aanmaning en van verdere vervolging worden berekend op de voet
      van de [Kostenwet invordering rijksbelastingen][ref1] (*Stb.* 1969, 83). De
      [artikelen 6 en 7 van de Invorderingswet 1990][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002645
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel6
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0002645
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '6'
  - number: '50.1'
    text: |-
      In gevallen waarin een der in [artikel 48, eerste lid, onder ][ref1], omschreven maatregelen is opgelegd, kan,
      zo bijzondere omstandigheden zulks wettigen, bij koninklijk besluit worden bepaald dat de betrokkene in de hem
      ontzegde bevoegdheid wordt hersteld, onderscheidenlijk dat hij, tenzij een buiten de opgelegde maatregel staande
      weigeringsgrond aanwezig blijkt, wederom in het register zal kunnen worden ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel48
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '48'
        hoofdstuk: VII
        paragraaf: '2'
  - number: '50.2'
    text: |-
      In een besluit krachtens het eerste lid kunnen, al dan niet met een beperking tot een in dat besluit te bepalen
      proeftijd, voorwaarden worden gesteld, door de betrokkene, in het register ingeschreven staande, in acht te
      nemen. Indien blijkt dat de betrokkene zich schuldig heeft gemaakt aan niet-naleving van een gestelde voorwaarde,
      kan, onder intrekking van dat besluit, bij koninklijk besluit worden bepaald dat de opgelegde maatregel opnieuw
      van kracht wordt. In een besluit krachtens het eerste lid, dat aan betrokkene het recht verleent wederom in het
      register te worden ingeschreven, kan ook worden bepaald dat dit recht eerst zal ingaan zodra de betrokkene aan
      vooraf te vervullen bijzondere voorwaarden, in dat besluit omschreven, zal hebben voldaan.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel50
  - number: '50.3'
    text: |-
      De voordracht tot een besluit krachtens het eerste of tweede lid, tweede volzin, wordt gedaan door Onze Ministers.
      Alvorens zodanige voordracht wordt gedaan, wint Onze Minister het advies in van het tuchtcollege dat de maatregel
      heeft opgelegd.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel50
  - number: '51'
    text: |-
      Niemand kan andermaal ingevolge de bepalingen van dit hoofdstuk worden berecht ter zake van enig in
      [artikel 47, eerste lid][ref1], bedoeld handelen of nalaten waaromtrent te zijnen aanzien een onherroepelijk
      geworden tuchtrechtelijke eindbeslissing is genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel47
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '47'
        hoofdstuk: VII
        paragraaf: '1'
  - number: '52'
    text: |-
      Herziening van een onherroepelijk geworden tuchtrechtelijke eindbeslissing waarbij een in
      [artikel 48, eerste of derde lid][ref1], omschreven maatregel werd opgelegd, is mogelijk, wanneer naderhand
      omstandigheden zijn gebleken die naar ernstig vermoeden tot een afwijkende beslissing zouden hebben geleid, indien
      zij tijdig bekend waren geworden. Bij algemene maatregel van bestuur worden hieromtrent nadere regels gesteld. De
      herziening zal niet kunnen leiden tot een wijziging in hetgeen voorheen was beslist, ten nadele van de betrokkene.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel48
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '48'
        hoofdstuk: VII
        paragraaf: '2'
  - number: '53.1'
    text: |-
      Bij algemene maatregel van bestuur wordt het land in gebieden ingedeeld, waarvan elk het ambtsgebied van een
      regionaal tuchtcollege uitmaakt. Bij de maatregel wordt tevens voor elk der regionale tuchtcolleges de plaats van
      vestiging binnen zijn ambtsgebied aangewezen.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel53
  - number: '53.2'
    text: Het centrale tuchtcollege is gevestigd te 's-Gravenhage.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel53
  - number: '54.1'
    text: |-
      Bevoegd tot het behandelen van een zaak in eerste aanleg is het regionale tuchtcollege binnen welks ambtsgebied de
      te berechten persoon zijn woonplaats heeft.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel54
  - number: '54.2'
    text: |-
      Welk regionaal tuchtcollege bevoegd is in gevallen waarin de betrokkene geen bekende woonplaats hier te lande
      heeft, wordt bij algemene maatregel van bestuur bepaald.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel54
  - number: '55.1'
    text: |-
      Een regionaal tuchtcollege telt twee rechtsgeleerde leden van wie één tevens voorzitter is, alsmede, voor elk van
      de in [artikel 47, tweede lid][ref1], aangegeven categorieën van aan tuchtrechtspraak onderworpen personen, drie
      leden-beroepsgenoten. Van het college maken mede deel uit plaatsvervangende rechtsgeleerde leden, benevens voor elk
      van de in de eerste volzin bedoelde categorieën, plaatsvervangende leden-beroepsgenoten.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel47
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '47'
        hoofdstuk: VII
        paragraaf: '1'
  - number: '55.2'
    text: |-
      Aan de behandeling van een zaak wordt deelgenomen door de voorzitter, door het andere rechtsgeleerde lid en door de
      drie leden-beroepsgenoten, benoemd voor de categorie waartoe degene over wie is geklaagd, behoort, een en ander met
      de mogelijkheid van plaatsvervanging. In afwijking van het bepaalde in de eerste volzin kan de voorzitter bepalen
      dat aan de behandeling van een zaak die hem daartoe geschikt voorkomt, wordt deelgenomen door de voorzitter en door
      twee leden-beroepsgenoten, benoemd voor de categorie waartoe degene over wie is geklaagd, behoort, een en ander
      met de mogelijkheid van plaatsvervanging. Indien de zaak naar het oordeel van een van deze leden ongeschikt is voor
      behandeling overeenkomstig het bepaalde in de tweede volzin, wordt de behandeling voortgezet met toepassing van de
      eerste volzin.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel55
  - number: '55.3'
    text: |-
      De voorzitter en zijn plaatsvervanger of zijn plaatsvervangers worden bij koninklijk besluit op voordracht
      van Onze Ministers voor het leven benoemd. Op hun verzoek wordt hun bij koninklijk besluit tussentijds
      ontslag verleend. Hun wordt in ieder geval ontslag verleend met het bereiken van de zeventigjarige leeftijd.
      [Artikel 48, eerste lid, van de Wet op de rechterlijke organisatie][ref1] is te hunnen aanzien van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel48
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '48'
  - number: '55.4'
    text: |-
      De overige leden en plaatsvervangende leden worden bij koninklijk besluit op voordracht van Onze Minister voor
      de tijd van zes jaar benoemd. Zij zijn herbenoembaar. Op hun verzoek wordt hun bij koninklijk besluit tussentijds
      ontslag verleend. Hun wordt in ieder geval ontslag verleend met het bereiken van de zeventigjarige leeftijd.
      [Artikel 48, eerste lid, van de Wet op de rechterlijke organisatie][ref1] is ten aanzien van de in de eerste volzin
      bedoelde personen, voor zover zij rechtsgeleerden zijn, van overeenkomstige toepassing. De leden-beroepsgenoten en
      de plaatsvervangende leden-beroepsgenoten worden benoemd uit personen die ingeschreven staan in het desbetreffende
      register.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel48
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '48'
  - number: '55.5'
    text: |-
      Het college heeft een secretaris en één of meer plaatsvervangende secretarissen, allen rechtsgeleerden. Zij worden
      bij koninklijk besluit op voordracht van Onze Ministers benoemd, geschorst en ontslagen.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel55
  - number: '56.1'
    text: |-
      Het centrale tuchtcollege telt drie rechtsgeleerde leden van wie één tevens voorzitter is, alsmede, voor elk van
      de in [artikel 47, tweede lid][ref1], aangegeven categorieën van aan tuchtrechtspraak onderworpen personen, twee
      leden-beroepsgenoten. Van het college maken mede deel uit plaatsvervangende rechtsgeleerde leden, benevens voor elk
      van de in de eerste volzin bedoelde categorieën, plaatsvervangende leden-beroepsgenoten.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel47
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '47'
        hoofdstuk: VII
        paragraaf: '1'
  - number: '56.2'
    text: |-
      Aan de behandeling van een zaak wordt deelgenomen door de voorzitter, door de twee andere rechtsgeleerde leden en
      door de twee leden-beroepsgenoten, benoemd voor de categorie waartoe degene over wie is geklaagd, behoort, een en
      ander met de mogelijkheid van plaatsvervanging.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel56
  - number: '56.3'
    text: |-
      Ten aanzien van de benoeming en het ontslag van de voorzitter en zijn plaatsvervanger of zijn plaatsvervangers
      en van de overige leden en plaatsvervangende leden is [artikel 55, derde onderscheidenlijk vierde lid][ref1], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel55
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '55'
        hoofdstuk: VII
        paragraaf: '3'
  - number: '56.4'
    text: |-
      [Artikel 55, vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel55
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '55'
        hoofdstuk: VII
        paragraaf: '3'
  - number: '57.1'
    text: |-
      De voorzitter van een tuchtcollege kan ten aanzien van twee of meer met elkaar samenhangende zaken bepalen dat zij
      door het college ter terechtzitting gezamenlijk worden behandeld.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel57
  - number: '57.2'
    text: |-
      Ingeval in deze zaken degenen over wie is geklaagd, tot verschillende in [artikel 47, tweede lid][ref1], aangegeven
      categorieën behoren, wordt aan het onderzoek ter terechtzitting door het ingevolge [artikel 55, tweede lid][ref2],
      onderscheidenlijk [artikel 56, tweede lid][ref3], vereiste aantal leden-beroepsgenoten of plaatsvervangende leden-
      beroepsgenoten van elk van de betrokken categorieën deelgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel55
      [ref3]: https://wetten.overheid.nl/BWBR0006251#Artikel56
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '47'
        hoofdstuk: VII
        paragraaf: '1'
