  - number: '61'
    text: |-
      De leden, plaatsvervangende leden, secretarissen en plaatsvervangende secretarissen van de tuchtcolleges is het
      verboden zich over een zaak die bij hun college aanhangig is of naar zij weten of vermoeden zal worden, in te laten
      in enig onderhoud met belanghebbenden of van dezen enige bijzondere inlichting of schriftuur dienaangaande aan
      te nemen.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel61
  - number: '62.1'
    text: |-
      De leden, de plaatsvervangende leden, de secretarissen en de plaatsvervangende secretarissen van de tuchtcolleges
      ontvangen een vacatiegeld, alsmede vergoeding van reis- en verblijfkosten en van verdere verschotten, een en ander
      overeenkomstig door Onze Minister te stellen regels.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel62
  - number: '62.2'
    text: |-
      In de daarvoor in aanmerking komende gevallen kan bij koninklijk besluit, in afwijking van het
      eerste lid, aan de voorzitter, een ander lid of plaatsvervangend lid dat met toepassing van
      [artikel 66, eerste lid, tweede volzin][ref1], vooronderzoek verricht, of de secretaris van een tuchtcollege een
      salaris worden toegekend op een bij dat besluit te bepalen voet. In dat geval geniet de betrokkene bovendien een
      tijdelijke toelage voor kinderen, een vakantieuitkering, een ziektekostenvergoeding, een vergoeding van reis- en
      verblijfkosten, een vergoeding van verplaatsingskosten, alsmede een spaarpremie, overeenkomstig de bepalingen welke
      te dien aanzien voor de burgerlijke rijksambtenaren bij de ministeries zijn of zullen worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel66
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '66'
        hoofdstuk: VII
        paragraaf: '4'
  - number: '63'
    text: |-
      Een lid van een tuchtcollege, dat voor de behandeling van een zaak zitting heeft in dat
      college, kan zich verschonen en kan worden gewraakt, indien er te zijnen aanzien feiten of
      omstandigheden bestaan, waardoor de rechterlijke onpartijdigheid schade zou kunnen lijden. De
      [artikelen 512 tot en met 524 van het Wetboek van Strafvordering][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel512
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '512'
  - number: '64.1'
    text: |-
      Het centrale tuchtcollege waakt tegen nodeloze vertraging in de behandeling van zaken door de regionale
      tuchtcolleges.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel64
  - number: '64.2'
    text: |-
      Het centrale tuchtcollege kan zich de stukken, betrekking hebbende op een bij een regionaal tuchtcollege aanhangige
      zaak, doen overleggen en een termijn stellen, waarbinnen het regionale tuchtcollege het vooronderzoek dan wel het
      onderzoek op de terechtzitting moet sluiten.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel64
  - number: '64.3'
    text: |-
      Indien het regionale tuchtcollege hieraan niet voldoet, kan het centrale tuchtcollege de behandeling van de zaak
      aan een ander regionaal tuchtcollege overdragen.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel64
  - number: '65.1'
    text: |-
      Een zaak wordt in eerste aanleg bij het bevoegde regionale tuchtcollege aanhangig gemaakt door een schriftelijke
      klacht van:
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel65
  - number: 65.1.a
    text: een rechtstreeks belanghebbende;
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel65
  - number: 65.1.b
    text: degene die aan degene over wie wordt geklaagd, een opdracht heeft verstrekt;
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel65
  - number: 65.1.c
    text: |-
      degene bij wie of het bestuur van een instelling waarbij degene over wie wordt geklaagd, werkzaam of voor het
      verlenen van individuele gezondheidszorg ingeschreven is;
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel65
  - number: 65.1.d
    text: |-
      de hoofdinspecteur of de regionale inspecteur van het Staatstoezicht op de volksgezondheid, wie de aangelegenheid
      uit hoofde van de hem toevertrouwde belangen aangaat.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel65
  - number: '65.2'
    text: De inhoud van het klaagschrift moet voldoen aan de daaromtrent bij algemene maatregel van bestuur te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel65
  - number: '65.3'
    text: |-
      Degene die het vooronderzoek verricht kan, indien de zaak hem daartoe geschikt voorkomt, bij het horen van de
      klager en degene over wie is geklaagd, een minnelijke oplossing beproeven.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel65
  - number: '65.4'
    text: |-
      Indien een minnelijke oplossing mogelijk blijkt, wordt deze op schrift gesteld en door de klager en degene over wie
      is geklaagd, ondertekend. Met een aldus vastgestelde minnelijke oplossing geeft de klager te kennen zijn klacht in
      te trekken.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel65
  - number: '65.5'
    text: |-
      De bevoegdheid tot het indienen van een klaagschrift vervalt door verjaring in tien jaren. De termijn van verjaring
      vangt aan op de dag na die waarop het desbetreffende handelen of nalaten is geschied.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel65
  - number: '65.6'
    text: |-
      Indien naar zijn oordeel de behandeling van de zaak door het tuchtcollege geen uitstel gedoogt zonder groot nadeel
      voor het belang van de bescherming van de individuele gezondheidszorg, verzoekt de in het eerste lid, onder *d*,
      bedoelde inspecteur het tuchtcollege de zaak met spoed te behandelen.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel65
  - number: '65.7'
    text: |-
      Nadat een klaagschrift is ingediend, zendt de voorzitter van het college een afschrift daarvan aan degene over wie
      is geklaagd.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel65
  - number: '65.8'
    text: |-
      De hoofdinspecteur of de regionale inspecteur is verplicht ter zake van door hem ingediende klaagschriften aan de
      ambtenaren van het openbaar ministerie de door hen gevraagde inlichtingen te verstrekken. De hoofdinspecteur of de
      regionale inspecteur kan de in de eerste volzin bedoelde ambtenaren ook uit eigen beweging ter zake inlichten.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel65
  - number: '65.9'
    text: |-
      De klager en degene over wie is geklaagd, kunnen zich doen vertegenwoordigen door een gemachtigde en zich doen
      bijstaan door een raadsman. De gemachtigde moet, desgevraagd, zijn bevoegdheid aantonen door het overleggen van
      een schriftelijke volmacht. Advocaten en procureurs, als gemachtigden optredende, zijn tot deze overlegging niet
      gehouden. De voorzitter van het regionale tuchtcollege kan slechts weigeren een persoon die geen advocaat of
      procureur is als gemachtigde of als raadsman toe te laten, indien er duidelijke aanwijzingen zijn dat door de
      toelating van die persoon een behoorlijke uitoefening van de rechtspraak zal worden belemmerd. De weigering wordt
      door de voorzitter schriftelijk gemotiveerd.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel65
  - number: '65.10'
    text: |-
      In geval van intrekking van de klacht wordt de behandeling daarvan gestaakt, tenzij degene over wie is geklaagd,
      schriftelijk heeft verklaard voortzetting van de behandeling te verlangen, het tuchtcollege heeft beslist dat de
      behandeling van de klacht om redenen, aan het algemeen belang ontleend, moet worden voortgezet of het tuchtcollege
      het onderzoek van de zaak op de terechtzitting reeds heeft beëindigd.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel65
  - number: '65.11'
    text: Indien degene over wie is geklaagd, overlijdt, wordt de behandeling van de klacht gestaakt.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel65
  - number: '66.1'
    text: |-
      Na verzending van het afschrift, bedoeld in [artikel 65, zevende lid][ref1], gelast de voorzitter van het
      regionale tuchtcollege een vooronderzoek. De voorzitter draagt het vooronderzoek op aan een of meer leden of
      plaatsvervangende leden of aan de secretaris of plaatsvervangend secretaris van het regionale tuchtcollege.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel65
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '65'
        hoofdstuk: VII
        paragraaf: '4'
  - number: '66.2'
    text: |-
      Het vooronderzoek kan zich mede uitstrekken tot andere dan in het klaagschrift vermelde feiten en omstandigheden.
      Degene die door de voorzitter op grond van het eerste lid is aangewezen om het vooronderzoek te verrichten stelt
      de klager en degene over wie is geklaagd, in de gelegenheid door hem te worden gehoord. Hij kan de betrokken
      hoofdinspecteur of regionale inspecteur, alsmede getuigen en deskundigen horen; ten aanzien van de getuigen en
      deskundigen is [artikel 68][ref1] van overeenkomstige toepassing, met dien verstande dat de oproeping, het verzoek
      tot dagvaarding en het doen afleggen van de eed of belofte geschieden door degene die het vooronderzoek verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel68
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '68'
        hoofdstuk: VII
        paragraaf: '4'
  - number: '66.3'
    text: |-
      Bij de vervulling van de hem op grond van het eerste en het tweede lid toekomende taak is degene die het
      vooronderzoek verricht bevoegd, vergezeld van de door hem aangewezen personen, elke plaats te betreden teneinde een
      onderzoek te verrichten waarvan het uitvoeren ter betrokken plaatse door hem noodzakelijk wordt geoordeeld. Ingeval
      tijdens zodanig onderzoek de orde wordt verstoord of hem tegenstand wordt geboden, kan degene die het vooronderzoek
      verricht de hulp van de sterke arm inroepen. De voorzitter van het regionale tuchtcollege is bevoegd een machtiging
      als bedoeld in [artikel 2 van de Algemene wet op het binnentreden][ref1] te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0006763#Artikel2
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0006763
        artikel: '2'
  - number: '66.4'
    text: |-
      Indien tijdens het vooronderzoek blijkt dat de klacht afkomstig is van een tot klagen niet bevoegde, dat
      het klaagschrift niet voldoet aan de krachtens [artikel 65, tweede lid][ref1], gestelde eisen, dat de klacht
      kennelijk ongegrond is of dat de klacht van onvoldoende gewicht is, kan het college op voorstel van degene die het
      vooronderzoek heeft verricht, zonder verder onderzoek, in raadkamer, een eindbeslissing geven, welke in het eerste
      en tweede geval tot het niet-ontvankelijk verklaren van klager en in het derde en vierde geval tot het afwijzen van
      de klacht strekt. De eindbeslissing is met redenen omkleed en wordt op schrift gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel65
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '65'
        hoofdstuk: VII
        paragraaf: '4'
  - number: '66.5'
    text: |-
      Indien geen toepassing is gegeven aan het vierde lid, wordt het vooronderzoek gesloten met verwijzing naar een
      terechtzitting.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel66
  - number: '66.6'
    text: |-
      Tijdens de behandeling van een zaak op de terechtzitting kan het regionale tuchtcollege degene die het
      vooronderzoek heeft verricht opdragen alsnog een aanvullend onderzoek in te stellen. Het tweede en derde lid zijn
      te dezen van overeenkomstige toepassing. Het aanvullend onderzoek wordt gesloten door de zaak wederom naar een
      terechtzitting te verwijzen.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel66
  - number: '66.7'
    text: |-
      Een lid of plaatsvervangend lid van het tuchtcollege, dat met toepassing van het eerste lid, tweede volzin, een
      vooronderzoek in een zaak heeft verricht, neemt, op straffe van nietigheid, geen deel aan de behandeling van die
      zaak op de terechtzitting.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel66
  - number: '67.1'
    text: |-
      De klager en degene over wie is geklaagd, worden in de gelegenheid gesteld de behandeling van de zaak op de
      terechtzitting bij te wonen en tijdens de behandeling te worden gehoord.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel67
  - number: '67.2'
    text: |-
      De klager en degene over wie is geklaagd, worden gedurende een termijn van tenminste zes dagen in de gelegenheid
      gesteld van de processtukken kennis te nemen. De laatste dag van de in de eerste volzin genoemde termijn ligt
      tenminste acht dagen vóór de aanvang van het onderzoek op de terechtzitting.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel67
  - number: '67.3'
    text: |-
      Indien dit noodzakelijk is in het belang van de bescherming van de persoonlijke levenssfeer van derden, bepaalt
      de voorzitter van het tuchtcollege dat het kennisnemen van bepaalde processtukken of gedeelten ervan niet wordt
      toegestaan aan de klager persoonlijk, maar uitsluitend aan een gemachtigde, die arts, advocaat of procureur is, dan
      wel van de voorzitter bijzondere toestemming heeft verkregen.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel67
  - number: '68.1'
    text: |-
      Het regionale tuchtcollege kan getuigen en deskundigen ter terechtzitting oproepen en horen. Ieder die als getuige
      of deskundige is opgeroepen, is verplicht aan de oproeping gevolg te geven.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel68
  - number: '68.2'
    text: |-
      De klager en degene over wie is geklaagd, kunnen getuigen en deskundigen ter terechtzitting uitnodigen of bij
      deurwaardersexploit oproepen; in geval van oproeping gelden voor hen dezelfde verplichtingen als voor getuigen en
      deskundigen, opgeroepen door het tuchtcollege.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel68
  - number: '68.3'
    text: |-
      Verschijnt een getuige of een deskundige op de oproeping niet, dan doet de officier van
      justitie op verzoek van het college hem dagvaarden, desverzocht met bevel tot medebrenging.
      [Artikel 556 van het Wetboek van Strafvordering][ref1] (*Stb.* 1925, 343), de tweede volzin van het eerste lid en
      de tweede volzin van het vierde lid zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel556
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '556'
  - number: '68.4'
    text: |-
      De voorzitter van het college doet de getuigen de eed of belofte afleggen dat zij de gehele waarheid en niets
      dan de waarheid zullen zeggen. De getuigen en deskundigen zijn verplicht op de gestelde vragen te antwoorden,
      onderscheidenlijk de van hen gevorderde diensten te verlenen. De deskundigen zijn gehouden hun taak onpartijdig en
      naar beste weten te verrichten.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel68
  - number: '68.5'
    text: |-
      Ten aanzien van de getuigen en deskundigen zijn de
      [artikelen 217 tot en met 219 van het Wetboek van Strafvordering][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel217
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '217'
  - number: '68.6'
    text: |-
      De getuigen en deskundigen, opgeroepen door het tuchtcollege, ontvangen, desverkiezende op vertoon van hun
      oproeping of dagvaarding, uit ’s Rijks kas schadeloosstelling, door de voorzitter van het college te begroten
      overeenkomstig het bij of krachtens de [Wet tarieven in burgerlijke zaken][ref1] (*Stb.* 1843, 41) bepaalde. De
      voorzitter begroot op overeenkomstige wijze de schadeloosstelling voor getuigen en deskundigen, opgeroepen of
      uitgenodigd ingevolge het tweede lid, welke ten laste komt van degene door wie zij zijn opgeroepen of uitgenodigd.
      Deurwaarders ontvangen voor de werkzaamheden verricht ingevolge het tweede lid, van hun opdrachtgever een
      vergoeding overeenkomstig de bepalingen van het tarief van justitie-kosten en salarissen in burgerlijke zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0001852
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0001852
  - number: '69.1'
    text: |-
      Binnen twee maanden na sluiting van het onderzoek op de terechtzitting wordt de eindbeslissing van het regionale
      tuchtcollege uitgesproken.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel69
  - number: '69.2'
    text: |-
      Een in het eerste lid bedoelde beslissing strekt hetzij tot het niet-ontvankelijk verklaren van de klager, hetzij
      tot het afwijzen van de klacht, hetzij tot het opleggen van een der in [artikel 48, eerste en derde lid][ref1],
      omschreven maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel48
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '48'
        hoofdstuk: VII
        paragraaf: '2'
  - number: '69.3'
    text: De beslissing is met redenen omkleed en wordt op schrift gesteld.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel69
  - number: '70.1'
    text: |-
      Het regionale tuchtcollege behandelt de zaak in een openbare terechtzitting. Het college kan evenwel om gewichtige
      redenen bepalen dat de behandeling geheel of gedeeltelijk met gesloten deuren zal plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel70
  - number: '70.2'
    text: |-
      Een beslissing, strekkende tot het opleggen van een der in [artikel 48, eerste en derde lid][ref1], omschreven
      maatregelen, wordt in het openbaar uitgesproken. Ten aanzien van een beslissing van een andere dan in de eerste
      volzin aangegeven strekking kan het college om redenen, aan het algemeen belang ontleend, bepalen dat zij in
      het openbaar wordt uitgesproken, met dien verstande dat zodanige beslissing in elk geval in het openbaar wordt
      uitgesproken indien de zaak in een openbare terechtzitting is behandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel48
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '48'
        hoofdstuk: VII
        paragraaf: '2'
  - number: '70.3'
    text: |-
      Bij de openbare uitspraak van een beslissing worden de naam, de voornamen, de hoedanigheid en de woonplaats van de
      bij de zaak betrokken patiënt, van de klager en van de getuigen weggelaten.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel70
  - number: '70.4'
    text: |-
      Tijd en plaats van een openbare terechtzitting of openbare uitspraak worden overeenkomstig bij algemene maatregel
      van bestuur te stellen regels bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel70
  - number: '71'
    text: |-
      Het regionale tuchtcollege kan om redenen, aan het algemeen belang ontleend, bepalen dat zijn eindbeslissing
      geheel of gedeeltelijk in de *Staatscourant* zal worden bekendgemaakt en aan door hem aangewezen tijdschriften
      of nieuwsbladen ter bekendmaking zal worden aangeboden, een en ander met weglating van de namen, voornamen en
      woonplaatsen van de in de beslissing genoemde personen alsmede van de daarin voorkomende andere gegevens die
      omtrent deze personen een aanwijzing bevatten.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel71
  - number: '72.1'
    text: |-
      Van de eindbeslissing van het regionale tuchtcollege wordt, binnen een week na de uitspraak daarvan, een afschrift
      gezonden aan:
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel72
  - number: 72.1.a
    text: de klager;
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel72
  - number: 72.1.b
    text: degene over wie is geklaagd;
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel72
  - number: 72.1.c
    text: |-
      de hoofdinspecteur en de regionale inspecteur van het Staatstoezicht op de volksgezondheid, wie de aangelegenheid
      uit hoofde van de hun toevertrouwde belangen aangaat;
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel72
  - number: 72.1.d
    text: de secretaris van het centrale tuchtcollege;
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel72
  - number: 72.1.e
    text: Onze Minister van Defensie, ingeval de beslissing betrekking heeft op een persoon die militair is.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel72
  - number: '72.2'
    text: |-
      Van een eindbeslissing waarbij een der in [artikel 48, eerste lid, onder ][ref1], omschreven maatregelen is
      opgelegd, wordt voorts binnen een week na de uitspraak daarvan een afschrift gezonden aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel48
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '48'
        hoofdstuk: VII
        paragraaf: '2'
  - number: '73.1'
    text: |-
      Tegen een eindbeslissing van het regionale tuchtcollege kan binnen zes weken na de dag van verzending van het
      afschrift van die beslissing bij het centrale tuchtcollege beroep worden ingesteld door:
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel73
  - number: 73.1.a
    text: de klager, voor zover zijn klacht is afgewezen, of voor zover hij niet-ontvankelijk is verklaard;
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel73
  - number: 73.1.b
    text: degene over wie is geklaagd;
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel73
  - number: 73.1.c
    text: |-
      de in [artikel 65, eerste lid, onder d][ref1], bedoelde hoofdinspecteur en regionale inspecteur.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel65
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '65'
        hoofdstuk: VII
        paragraaf: '4'
  - number: '73.2'
    text: |-
      Het beroep wordt schriftelijk ingesteld. De inhoud van het beroepschrift moet voldoen aan de daaromtrent bij
      algemene maatregel van bestuur te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel73
  - number: '73.3'
    text: |-
      Wanneer het beroepschrift na afloop van de termijn, bedoeld in het eerste lid, is ingediend, blijft niet-
      ontvankelijkverklaring op grond daarvan achterwege, indien de indiener aantoont dat hij het beroep heeft ingesteld
      zo spoedig als dit redelijkerwijs verlangd kon worden.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel73
  - number: '73.4'
    text: |-
      Het centrale tuchtcollege kan degene die beroep heeft ingesteld niet-ontvankelijk verklaren, het beroep verwerpen
      of het beroep gegrond verklaren.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel73
  - number: '73.5'
    text: |-
      Indien het centrale tuchtcollege het beroep gegrond verklaart dan wel bij de behandeling van het beroep op andere
      dan de in het beroepschrift aangevoerde gronden tot het oordeel komt dat de in eerste aanleg gegeven beslissing
      niet kan worden gehandhaafd, vernietigt het deze beslissing en doet de zaak alsdan zelf af.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel73
  - number: '73.6'
    text: |-
      Indien tegen de eindbeslissing van het regionale tuchtcollege door twee of meer personen beroep is ingesteld en
      tenminste twee van hen ontvankelijk zijn, worden deze beroepen gezamenlijk behandeld.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel73
  - number: '73.7'
    text: |-
      [ Artikel 65, achtste tot en met elfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel65
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '65'
        hoofdstuk: VII
        paragraaf: '4'
  - number: '74.1'
    text: |-
      Indien een beroepschrift afkomstig is van een persoon die niet bevoegd is tot het instellen van beroep, niet
      tijdig is ingediend of niet voldoet aan de krachtens [artikel 73, tweede lid][ref1], gestelde eisen, kan het
      centrale tuchtcollege op voorstel van de voorzitter zonder verder onderzoek, in raadkamer, een beslissing geven,
      welke strekt tot het niet-ontvankelijk verklaren van degene die het beroep heeft ingesteld. De beslissing is
      met redenen omkleed en wordt op schrift gesteld. In andere dan in de eerste volzin bedoelde gevallen kan de
      voorzitter, alvorens de zaak naar een terechtzitting te verwijzen, een vooronderzoek op de voet van het in
      [artikel 66, tweede en derde lid][ref2], bepaalde gelasten.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel73
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel66
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '73'
        hoofdstuk: VII
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '66'
        hoofdstuk: VII
        paragraaf: '4'
  - number: '74.2'
    text: |-
      Op de behandeling in beroep zijn de [artikelen 66, zesde en zevende lid][ref1], en [67 tot en met 72][ref2], met
      uitzondering van het [tweede lid van artikel 70][ref3], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel67
      [ref3]: https://wetten.overheid.nl/BWBR0006251#Artikel70
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '66'
        hoofdstuk: VII
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '67'
        hoofdstuk: VII
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0006251
        artikel: '70'
        hoofdstuk: VII
        paragraaf: '4'
  - number: '74.3'
    text: |-
      Het centrale tuchtcollege kan het regionale tuchtcollege dat de beslissing waartegen beroep is ingesteld, heeft
      gegeven, uitnodigen inlichtingen te verstrekken.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel74
  - number: '74.4'
    text: |-
      Het centrale tuchtcollege kan mede oordelen over onderdelen van de beslissing van het regionale tuchtcollege,
      waartegen in het beroepschrift geen bezwaren zijn aangevoerd.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel74
  - number: '74.5'
    text: |-
      Indien alleen degene over wie is geklaagd, beroep heeft ingesteld, kan het centrale tuchtcollege slechts met
      eenparigheid van stemmen een beslissing geven die een wijziging te zijnen nadele brengt in hetgeen door het
      regionale tuchtcollege was beslist.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel74
  - number: '74.6'
    text: |-
      Een beslissing van het centrale tuchtcollege waarbij een der in [artikel 48, eerste en derde lid][ref1], omschreven
      maatregelen wordt opgelegd of gehandhaafd, wordt in het openbaar uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel48
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '48'
        hoofdstuk: VII
        paragraaf: '2'
  - number: '74.7'
    text: |-
      Ten aanzien van een beslissing van een andere dan in het zesde lid aangegeven strekking kan het centrale
      tuchtcollege om redenen, aan het algemeen belang ontleend, bepalen dat zij in het openbaar wordt uitgesproken, met
      dien verstande dat zodanige beslissing in elk geval in het openbaar wordt uitgesproken indien de beslissing van het
      regionale tuchtcollege, waartegen beroep is ingesteld, in het openbaar werd uitgesproken of de zaak in beroep in
      een openbare terechtzitting is behandeld.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel74
  - number: '74.8'
    text: |-
      Een afschrift van de beslissing van het centrale tuchtcollege wordt mede toegezonden aan het regionale tuchtcollege
      dat in eerste aanleg besliste.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel74
  - number: '75'
    text: |-
      Tegen een beslissing van het centrale tuchtcollege staat geen andere voorziening open dan cassatie in het belang
      der wet.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel75
  - number: '76.1'
    text: |-
      De secretaris van het centrale tuchtcollege bewaart en registreert de hem overeenkomstig
      [artikel 72, eerste lid][ref1], toegezonden beslissingen.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel72
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '72'
        hoofdstuk: VII
        paragraaf: '4'
  - number: '76.2'
    text: |-
      De secretaris van het centrale tuchtcollege verstrekt desgevraagd aan de tuchtcolleges, de leden van de
      rechterlijke macht en de ambtenaren van het openbaar ministerie inlichtingen omtrent onherroepelijke beslissingen.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel76
  - number: '76.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen omtrent het in het eerste en het tweede lid bepaalde nadere regels worden
      gesteld. Daarbij kunnen de in het eerste lid gestelde verplichtingen, voor zover zulks uit het oogpunt van een
      goede rechtsbedeling toelaatbaar is, worden beperkt.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel76
  - number: '77'
    text: |-
      De secretarissen van de tuchtcolleges kunnen aan degene die daarom verzoekt, tegen betaling der kosten, afschriften
      van onherroepelijke beslissingen van de tuchtcolleges verstrekken. Zodanige afschriften worden niet dan na
      machtiging van de voorzitter van het college dat de desbetreffende beslissing heeft gegeven, verstrekt. Een
      verzoek daartoe wordt alleen toegestaan ingeval de verzoeker heeft aangetoond dat hij daarbij belang heeft. In de
      afschriften worden de in de desbetreffende beslissingen vermelde namen, voornamen en woonplaatsen van de klagers,
      degenen over wie is geklaagd, de getuigen en de deskundigen weggelaten.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel77
  - number: '78'
    text: |-
      De tuchtcolleges brengen jaarlijks vóór 1 april verslag uit omtrent hun werkzaamheden in het afgelopen
      kalenderjaar. Dit verslag wordt, tegen betaling der kosten, algemeen verkrijgbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel78
  - number: '79.1'
    text: Er is een college van medisch toezicht, dat gevestigd is te 's-Gravenhage.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel79
  - number: '79.2'
    text: |-
      Het college is bevoegd in gevallen waarin de in het derde lid bedoelde inspecteur een voordracht ter zake heeft
      gedaan, een voorziening te treffen, ertoe strekkende een persoon die in een register ingeschreven staat, uit
      dat register te doen verwijderen dan wel diens uitoefening van het betrokken beroep met bijzondere waarborgen te
      omkleden, indien hij wegens zijn geestelijke of lichamelijke gesteldheid of wegens zijn gewoonte van drankmisbruik
      of van misbruik van middelen, bedoeld in de [artikelen 2 en 3 van de Opiumwet][ref1] (*Stb.* 1976, 425), moet
      worden geacht de geschiktheid tot het uitoefenen dan wel tot het zonder zodanige waarborgen uitoefenen van dat
      beroep te missen.


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel2
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '2'
  - number: '79.3'
    text: |-
      Een voordracht, bedoeld in het tweede lid, wordt gedaan door de inspecteur van het hiertoe bij algemene maatregel
      van bestuur aangewezen onderdeel van het staatstoezicht op de volksgezondheid, die bevoegd is ter plaatse waar
      degene op wie de voordracht betrekking heeft, zijn beroep uitoefent. Bij algemene maatregel van bestuur kan tevens
      worden bepaald dat deze inspecteur in bij de maatregel omschreven gevallen tot het doen van een voordracht niet
      mag overgaan dan na overleg met een of meer andere inspecteurs van het Staatstoezicht op de volksgezondheid, bij de
      maatregel aangewezen.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel79
  - number: '80.1'
    text: |-
      Een voorziening, bedoeld in [artikel 79, tweede lid][ref1], kan bestaan in het opleggen van een der volgende
      maatregelen ten aanzien van de betrokkene:


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel79
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '79'
        hoofdstuk: VIII
  - number: 80.1.a
    text: |-
      binding van de bevoegdheid in het register ingeschreven staande het betrokken beroep uit te oefenen aan bijzondere
      voorwaarden;
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel80
  - number: 80.1.b
    text: |-
      gedeeltelijke ontzegging van de bevoegdheid in het register ingeschreven staande het betrokken beroep uit te
      oefenen;
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel80
  - number: 80.1.c
    text: doorhaling van de inschrijving in het register.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel80
  - number: '80.2'
    text: De maatregelen, bedoeld in het eerste lid, onder *a* en *b*, kunnen ook gezamenlijk worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel80
  - number: '80.3'
    text: |-
      Een maatregel, bedoeld in het eerste lid, onder *a* of *b*, wordt eerst van kracht bij het onherroepelijk
      worden van de beslissing waarbij hij is opgelegd, tenzij het college bij zijn beslissing heeft bepaald dat hij
      onmiddellijk van kracht wordt.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel80
  - number: '80.4'
    text: |-
      De maatregel van doorhaling van de inschrijving in het register wordt vanwege Onze Minister ten uitvoer gelegd
      zodra de beslissing waarbij hij is opgelegd, onherroepelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel80
  - number: '80.5'
    text: |-
      Bij het opleggen van de maatregel van doorhaling van de inschrijving kan het college tevens, bij wijze van
      voorlopige voorziening, schorsing van de inschrijving opleggen. Deze voorziening wordt terstond van kracht
      en wordt vanwege Onze Minister onverwijld ten uitvoer gelegd; de inschrijving blijft geschorst totdat de
      beslissing tot doorhaling van de inschrijving onherroepelijk is geworden dan wel in beroep is vernietigd.
      [Artikel 48, negende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel48
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '48'
        hoofdstuk: VII
        paragraaf: '2'
  - number: '81.1'
    text: |-
      Ingeval de omstandigheden op grond waarvan een maatregel, bedoeld in
      [artikel 80, eerste lid, onder a, b of c][ref1], was opgelegd, hebben opgehouden te bestaan, kan bij koninklijk
      besluit worden bepaald dat de voorwaarden die de betrokkene bij die maatregel werden gesteld, komen te vervallen,
      dat hij in de hem ontzegde bevoegdheid wordt hersteld, onderscheidenlijk dat hij, tenzij een buiten de opgelegde
      maatregel staande weigeringsgrond aanwezig blijkt, wederom in het register zal kunnen worden ingeschreven. In
      laatstbedoeld geval kan bij dat besluit worden bepaald dat het recht wederom in het register te worden ingeschreven
      eerst zal ingaan zodra de betrokkene aan vooraf te vervullen bijzondere voorwaarden, in dat besluit omschreven, zal
      hebben voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel80
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '80'
        hoofdstuk: VIII
  - number: '81.2'
    text: |-
      De voordracht tot een besluit krachtens het eerste lid wordt gedaan door Onze Ministers. Alvorens zodanige
      voordracht wordt gedaan, wint Onze Minister het advies in van het college dat de maatregel heeft opgelegd.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel81
  - number: '82.1'
    text: |-
      Het college van medisch toezicht telt twee rechtsgeleerde leden, van wie één tevens voorzitter is, alsmede
      drie leden-artsen. Van het college maken mede deel uit plaatsvervangende rechtsgeleerde leden, benevens
      plaatsvervangende leden-artsen.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel82
  - number: '82.2'
    text: |-
      Aan de behandeling van een zaak wordt deelgenomen door de voorzitter, door het andere rechtsgeleerde lid en door de
      drie leden-artsen, een en ander met de mogelijkheid van plaatsvervanging.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel82
  - number: '82.3'
    text: |-
      Ten aanzien van de benoeming en het ontslag van de voorzitter en zijn plaatsvervanger is
      [artikel 55, derde lid][ref1], van overeenkomstige toepassing. Ten aanzien van de benoeming en het ontslag van de
      overige leden en plaatsvervangende leden is [artikel 55, vierde lid][ref2], van overeenkomstige toepassing, met
      dien verstande dat de leden-artsen en de plaatsvervangende leden-artsen worden benoemd uit personen die als arts
      ingeschreven staan in het desbetreffende register.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel55
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '55'
        hoofdstuk: VII
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '55'
        hoofdstuk: VII
        paragraaf: '3'
  - number: '82.4'
    text: |-
      Het college heeft een secretaris en een plaatsvervangende secretaris, beiden rechtsgeleerden. Zij worden bij
      koninklijk besluit op voordracht van Onze Ministers benoemd, geschorst en ontslagen.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel82
  - number: '82.5'
    text: |-
      Ten aanzien van de leden, de plaatsvervangende leden, de secretaris en de plaatsvervangende secretaris is
      [artikel 61][ref1] van overeenkomstige toepassing. Ten aanzien van de leden en de plaatsvervangende leden zijn
      voorts de [artikelen 60][ref2] en [63][ref3] van overeenkomstige toepassing. Ten aanzien van de leden-artsen en de
      plaatsvervangende leden-artsen is bovendien [artikel 59][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel60
      [ref3]: https://wetten.overheid.nl/BWBR0006251#Artikel63
      [ref4]: https://wetten.overheid.nl/BWBR0006251#Artikel59
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '61'
        hoofdstuk: VII
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '60'
        hoofdstuk: VII
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0006251
        artikel: '63'
        hoofdstuk: VII
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0006251
        artikel: '59'
        hoofdstuk: VII
        paragraaf: '3'
  - number: '82.6'
    text: |-
      [Artikel 62][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel62
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '62'
        hoofdstuk: VII
        paragraaf: '3'
  - number: '83.1'
    text: |-
      Het treffen van een voorziening, bedoeld in [artikel 79, tweede lid][ref1], wordt door de inspecteur schriftelijk
      aan het college van medisch toezicht voorgedragen. De voordracht dient een omschrijving van de ter zake dienende
      feiten en omstandigheden te bevatten en te vermelden welke der in [artikel 80, eerste lid][ref2], bedoelde
      maatregelen worden voorgesteld en, zo het een maatregel als in dat lid, onder *a* en *b*, omschreven betreft, de
      inhoud daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel79
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel80
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '79'
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '80'
        hoofdstuk: VIII
  - number: '83.2'
    text: |-
      Van een voordracht als bedoeld in het eerste lid zendt de voorzitter van het college een afschrift aan degene op
      wie de voordracht betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel83
  - number: '83.3'
    text: |-
      De betrokken inspecteur en degene op wie de voordracht betrekking heeft, kunnen zich doen vertegenwoordigen
      door een gemachtigde en zich doen bijstaan door een raadsman. De gemachtigde moet, desgevraagd, zijn bevoegdheid
      aantonen door het overleggen van een schriftelijke volmacht. Advocaten en procureurs, als gemachtigden optredende,
      zijn tot deze overlegging niet gehouden. De voorzitter van het college van medisch toezicht kan slechts weigeren
      een persoon die geen advocaat of procureur is als gemachtigde of als raadsman toe te laten, indien er duidelijke
      aanwijzingen zijn dat door de toelating van die persoon een behoorlijke uitoefening van de rechtspraak zal worden
      belemmerd. De weigering wordt door de voorzitter schriftelijk gemotiveerd.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel83
  - number: '83.4'
    text: |-
      Na verzending van het afschrift, bedoeld in het tweede lid, gelast de voorzitter een vooronderzoek, dat zich
      mede kan uitstrekken tot andere dan in de voordracht vermelde feiten en omstandigheden. De voorzitter draagt
      het vooronderzoek op aan een of meer leden of plaatsvervangende leden of aan de secretaris of plaatsvervangende
      secretaris van het college. Degene die het vooronderzoek verricht stelt degene op wie de voordracht betrekking
      heeft, en de inspecteur die de voordracht heeft gedaan, in de gelegenheid door hem te worden gehoord. Hij
      kan voorts getuigen en deskundigen horen; ten aanzien van de getuigen en deskundigen is [artikel 68][ref1]
      van overeenkomstige toepassing, met dien verstande dat de oproeping, het verzoek tot dagvaarding en het doen
      afleggen van de eed of belofte geschieden door degene die het vooronderzoek verricht. Van de uitkomsten van het
      vooronderzoek wordt aan de inspecteur mededeling gedaan voordat de zaak ter rechtszitting in behandeling wordt
      genomen. [Artikel 66, derde en zevende lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel66
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '68'
        hoofdstuk: VII
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '66'
        hoofdstuk: VII
        paragraaf: '4'
  - number: '83.5'
    text: Het vooronderzoek wordt gesloten met verwijzing naar een rechtszitting.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel83
  - number: '83.6'
    text: |-
      Degene op wie de voordracht betrekking heeft, en de inspecteur die de voordracht heeft gedaan, worden in de
      gelegenheid gesteld de behandeling van de zaak ter rechtszitting bij te wonen en tijdens de behandeling te worden
      gehoord. Zij worden gedurende een termijn van tenminste zes dagen in de gelegenheid gesteld van de processtukken
      kennis te nemen. De laatste dag van deze termijn ligt tenminste acht dagen vóór de aanvang van het onderzoek ter
      rechtszitting.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel83
  - number: '83.7'
    text: |-
      Ten aanzien van de getuigen en deskundigen is [artikel 68][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel68
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '68'
        hoofdstuk: VII
        paragraaf: '4'
  - number: '83.8'
    text: |-
      Tijdens de behandeling van een zaak ter rechtszitting kan het college een of meer leden of plaatsvervangende leden,
      de secretaris of de plaatsvervangende secretaris opdragen alsnog een aanvullend vooronderzoek in te stellen. Het
      vierde lid is te dezen van overeenkomstige toepassing. Het aanvullende vooronderzoek wordt gesloten door de zaak
      wederom naar een rechtszitting te verwijzen.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel83
  - number: '83.9'
    text: |-
      Het college kan, indien het termen daartoe aanwezig acht, de betrokkene schriftelijk aanzeggen dat het belang
      van de zaak vordert dat hij zijn medewerking verleent aan een te zijnen aanzien door of vanwege een of meer
      artsen, door het college hiertoe als deskundigen aangewezen, uit te voeren geneeskundig onderzoek. De kosten
      van het onderzoek komen ten laste van de Staat. Indien de betrokkene de van hem verlangde medewerking geheel of
      gedeeltelijk onthoudt, kan het college bij zijn op de voordracht te geven beslissing deze omstandigheid in zijn
      overwegingen betrekken.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel83
  - number: '83.10'
    text: |-
      Zolang het college zijn onderzoek van de zaak ter rechtszitting niet heeft beëindigd, kan de inspecteur de door
      hem gedane voordracht intrekken, in welk geval de behandeling van de zaak wordt gestaakt, tenzij degene op wie
      de voordracht betrekking heeft schriftelijk heeft verklaard voortzetting van de behandeling te verlangen. Evenzo
      kan de inspecteur zijn voordracht zo nodig nog wijzigen of aanvullen. In zodanig geval wordt aan degene op wie
      de voordracht betrekking heeft, een afschrift van de aldus herziene voordracht verstrekt en wordt deze in de
      gelegenheid gesteld alsnog te worden gehoord. Indien degene op wie de voordracht betrekking heeft, overlijdt, wordt
      de behandeling van de zaak gestaakt.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel83
  - number: '83.11'
    text: |-
      Binnen twee maanden na sluiting van het onderzoek ter rechtszitting wordt de eindbeslissing van het college
      uitgesproken. De eindbeslissing strekt hetzij tot het opleggen van een der in [artikel 80, eerste lid][ref1],
      omschreven maatregelen, hetzij tot het afwijzen van de voordracht. Zij is met redenen omkleed en wordt op schrift
      gesteld. Bij de keuze van de op te leggen maatregel kan het college afwijken van hetgeen in de voordracht werd
      voorgesteld, met dien verstande dat de in [artikel 80, eerste lid, onder c][ref2], omschreven maatregel niet dan in
      overeenstemming met de voordracht kan worden opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel80
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel80
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '80'
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '80'
        hoofdstuk: VIII
  - number: '83.12'
    text: |-
      Ten aanzien van de behandeling van de zaak ter rechtszitting en het uitspreken van de beslissing is
      [artikel 70, eerste, derde en vierde lid][ref1], van overeenkomstige toepassing. Een beslissing, strekkende tot het
      opleggen van een der in [artikel 80, eerste lid][ref2], omschreven maatregelen, wordt in het openbaar uitgesproken.
      Ten aanzien van een beslissing, strekkende tot het afwijzen van de voordracht, kan het college om redenen, aan
      het algemeen belang ontleend, bepalen dat zij in het openbaar wordt uitgesproken, met dien verstande dat zodanige
      beslissing in elk geval in het openbaar wordt uitgesproken indien de zaak in een openbare rechtszitting is
      behandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel70
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel80
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '70'
        hoofdstuk: VII
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '80'
        hoofdstuk: VIII
  - number: '83.13'
    text: 'Van de eindbeslissing van het college wordt binnen een week na de uitspraak daarvan, een afschrift gezonden aan:'
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel83
  - number: 83.13.a
    text: degene op wie de voordracht betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel83
  - number: 83.13.b
    text: de inspecteur die de voordracht heeft gedaan;
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel83
  - number: 83.13.c
    text: |-
      de inspecteurs van het Staatstoezicht op de volksgezondheid, die daartoe bij algemene maatregel van bestuur zijn
      aangewezen;
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel83
  - number: 83.13.d
    text: de secretaris van het centrale tuchtcollege;
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel83
  - number: 83.13.e
    text: |-
      Onze Minister, ingeval de beslissing strekt tot het opleggen van een der in [artikel 80, eerste lid][ref1],
      omschreven maatregelen;


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel80
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '80'
        hoofdstuk: VIII
  - number: 83.13.f
    text: Onze Minister van Defensie, ingeval de beslissing betrekking heeft op een persoon die militair is.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel83
  - number: '84.1'
    text: |-
      Tegen een eindbeslissing van het college van medisch toezicht kan degene op wie de voordracht betrekking heeft,
      alsmede de betrokken inspecteur, binnen zes weken na de dag van verzending van het afschrift van die beslissing bij
      het centrale tuchtcollege beroep instellen.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel84
  - number: '84.2'
    text: |-
      Ten aanzien van de samenstelling van het centrale tuchtcollege bij de behandeling van zodanig beroep is
      [artikel 56, tweede lid][ref1], van overeenkomstige toepassing, met dien verstande dat de in die bepaling aan
      leden-beroepsgenoten toegewezen plaatsen in alle gevallen worden ingenomen door leden of plaatsvervangende leden
      van het college, benoemd uit de personen die in het desbetreffende register als arts ingeschreven staan.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel56
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '56'
        hoofdstuk: VII
        paragraaf: '3'
  - number: '84.3'
    text: |-
      De [artikelen 73, tweede tot en met zesde lid][ref1], en [83, derde en tiende lid][ref2], zijn van overeenkomstige
      toepassing. In geval van intrekking van een ingesteld beroep door degene op wie de voordracht betrekking heeft,
      wordt de behandeling in beroep gestaakt, tenzij het college zijn onderzoek van de zaak ter rechtszitting reeds
      heeft beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel73
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel83
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '73'
        hoofdstuk: VII
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '83'
        hoofdstuk: VIII
  - number: '84.4'
    text: |-
      Indien een beroepschrift afkomstig is van een persoon die niet bevoegd is tot het instellen van beroep,
      niet tijdig is ingediend of niet voldoet aan de krachtens het derde lid met overeenkomstige toepassing van
      [artikel 73, tweede lid][ref1], gestelde eisen, kan het centrale tuchtcollege op voorstel van degene die het
      vooronderzoek heeft verricht zonder verder onderzoek, in raadkamer, een beslissing geven, welke strekt tot het
      niet-ontvankelijk verklaren van degene die het beroep heeft ingesteld. De beslissing is met redenen omkleed en
      wordt op schrift gesteld. In andere dan in de eerste volzin bedoelde gevallen kan de voorzitter, alvorens de zaak
      naar een rechtszitting te verwijzen, een vooronderzoek op de voet van [artikel 83, vierde en vijfde lid][ref2],
      gelasten.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel73
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel83
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '73'
        hoofdstuk: VII
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '83'
        hoofdstuk: VIII
  - number: '84.5'
    text: |-
      Op de behandeling in beroep en de uitspraak van de eindbeslissing
      zijn de [artikelen 74, derde tot en met vijfde lid][ref1], en
      [83, zesde tot en met negende lid, elfde lid, met uitzondering van de tweede volzin, en twaalfde lid][ref2],
      van overeenkomstige toepassing, met dien verstande dat de beslissing van het centrale tuchtcollege eveneens in
      het openbaar wordt uitgesproken indien de beslissing van het college van medisch toezicht, waartegen beroep is
      ingesteld, in het openbaar werd uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel74
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel83
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '74'
        hoofdstuk: VII
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '83'
        hoofdstuk: VIII
  - number: '84.6'
    text: |-
      Ten aanzien van de toezending van afschriften van de eindbeslissing van het centrale tuchtcollege is
      [artikel 83, dertiende lid][ref1], van overeenkomstige toepassing, met dien verstande dat een afschrift mede wordt
      toegezonden aan het college van medisch toezicht.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel83
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '83'
        hoofdstuk: VIII
  - number: '84.7'
    text: |-
      Met betrekking tot de overeenkomstig het zesde lid juncto [artikel 83, dertiende lid][ref1], aan de secretaris van
      het centrale tuchtcollege toegezonden afschriften van de beslissingen is [artikel 76][ref2] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel83
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel76
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '83'
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '76'
        hoofdstuk: VII
        paragraaf: '6'
  - number: '85'
    text: |-
      Ten aanzien van het centrale tuchtcollege is met betrekking tot zaken die bij dat college ingevolge een krachtens
      [artikel 84][ref1] ingesteld beroep aanhangig zijn, [artikel 62][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel84
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel62
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '84'
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '62'
        hoofdstuk: VII
        paragraaf: '3'
  - number: '86.1'
    text: |-
      Met het toezicht op de naleving van de krachtens deze wet geregelde opleidingen, alsmede de bij of krachtens
      [artikel 40, eerste, derde en vierde lid][ref1], gestelde voorschriften en de in deze wet opgenomen strafbepalingen
      zijn belast de bij besluit van Onze Minister aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel40
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '40'
        hoofdstuk: V
  - number: '86.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel86
  - number: '87'
    text: |-
      De toezichthouders beschikken niet over de bevoegdheden, genoemd in de [artikelen 5:18][ref1] en
      [5:19 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 87a
    text: |-
      Indien de in [artikel 86][ref1] bedoelde personen van oordeel zijn dat
      [artikel 40, eerste tot en met derde lid][ref2], niet of in onvoldoende of op onjuiste wijze wordt nageleefd,
      kunnen zij de desbetreffende beroepsbeoefenaar een schriftelijk bevel geven. De beroepsbeoefenaar is verplicht
      binnen de daarbij gestelde termijn aan het bevel te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel86
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel40
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel87a
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '86'
        hoofdstuk: IX
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '40'
        hoofdstuk: V
  - number: '88'
    text: |-
      Een ieder is verplicht geheimhouding in acht te nemen ten opzichte van al datgene wat hem bij het uitoefenen van
      zijn beroep op het gebied van de individuele gezondheidszorg als geheim is toevertrouwd, of wat daarbij als geheim
      te zijner kennis is gekomen of wat daarbij te zijner kennis is gekomen en waarvan hij het vertrouwelijke karakter
      moest begrijpen.
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel88
  - number: '90'
    text: |-
      Bij algemene maatregel van bestuur als bedoeld in de [hoofdstukken II][ref1], [III][ref2], [VI][ref3] en [XI][ref4]
      en in [artikel 93][ref5] kan worden bepaald dat Onze Minister met betrekking tot onderwerpen die in de maatregel
      worden geregeld, nadere regels kan dan wel moet stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0006251#HoofdstukIII
      [ref3]: https://wetten.overheid.nl/BWBR0006251#HoofdstukVI
      [ref4]: https://wetten.overheid.nl/BWBR0006251#HoofdstukXI
      [ref5]: https://wetten.overheid.nl/BWBR0006251#Artikel93
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0006251
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0006251
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0006251
        hoofdstuk: VI
      - id: ref4
        bwb_id: BWBR0006251
        hoofdstuk: XI
      - id: ref5
        bwb_id: BWBR0006251
        artikel: '93'
        hoofdstuk: IX
  - number: '91'
    text: |-
      Een algemene maatregel van bestuur waarbij ten aanzien van een bij de maatregel aangewezen beroep voor de eerste
      maal toepassing wordt gegeven aan [artikel 8][ref1], [34][ref2] of [40][ref3], dan wel een algemene maatregel
      van bestuur, inhoudende intrekking van een algemene maatregel van bestuur waarbij ten aanzien van een bepaald
      beroep toepassing is gegeven aan [artikel 8][ref4], [34][ref5] of [40][ref6], wordt niet vastgesteld dan nadat
      het ontwerp daarvan in de *Staatscourant* is geplaatst. Omtrent het ontwerp staat voor een ieder gedurende dertien
      weken, te rekenen vanaf het tijdstip van plaatsing, de gelegenheid open zienswijzen ter kennis van Onze Minister te
      brengen. Gelijktijdig met de plaatsing in de *Staatscourant* wordt het ontwerp aan beide Kamers der Staten-Generaal
      overgelegd. Alvorens een ontwerp van een zodanig maatregel in de *Staatscourant* wordt geplaatst, wordt door of
      vanwege Onze Minister overleg gepleegd met de naar zijn oordeel representatieve organisaties van beoefenaren van
      het beroep waarop de maatregel betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0006251#Artikel40
      [ref4]: https://wetten.overheid.nl/BWBR0006251#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0006251#Artikel34
      [ref6]: https://wetten.overheid.nl/BWBR0006251#Artikel40
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel91
    references:
      - id: ref1
