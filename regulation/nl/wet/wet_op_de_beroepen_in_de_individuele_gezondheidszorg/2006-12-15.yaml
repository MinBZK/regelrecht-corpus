  - number: '111'
    text: |-
      Ingeval toepassing wordt gegeven aan [artikel 8, eerste lid][ref1], kunnen bij algemene maatregel van
      bestuur bescheiden, verkregen door personen als bedoeld in de [artikelen 105, eerste en tweede lid][ref2], en
      [106, eerste lid][ref3], worden aangewezen die voor de toepassing van [artikel 8][ref4] worden gelijkgesteld met
      een getuigschrift als bedoeld in het tweede lid, onder *a*, van dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel105
      [ref3]: https://wetten.overheid.nl/BWBR0006251#Artikel106
      [ref4]: https://wetten.overheid.nl/BWBR0006251#Artikel8
