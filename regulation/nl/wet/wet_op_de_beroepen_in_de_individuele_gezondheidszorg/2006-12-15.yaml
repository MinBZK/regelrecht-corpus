        hoofdstuk: VII
        paragraaf: '3'
  - number: '57.3'
    text: |-
      Ingeval is geklaagd over een arts ter zake van verrichtingen op het gebied van de uitoefening der
      artsenijbereidkunst, wordt in het tuchtcollege ten minste één der plaatsen, bij [artikel 55, tweede lid][ref1],
      onderscheidenlijk [artikel 56, tweede lid][ref2], toegewezen aan leden-beroepsgenoten,
      vervuld door een lid-beroepsgenoot of plaatsvervangend lid-beroepsgenoot, die op grond van de
      [Wet op de Geneesmiddelenvoorziening][ref3] (*Stb.* 1958, 408) bevoegd is mede de artsenijbereidkunst uit te
      oefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel56
      [ref3]: https://wetten.overheid.nl/BWBR0002290
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '55'
        hoofdstuk: VII
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '56'
        hoofdstuk: VII
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0002290
  - number: '59.1'
    text: |-
      Doorhaling van zijn inschrijving in het desbetreffende register, schorsing van die inschrijving ingevolge
      toepassing van [artikel 48, eerste lid, onder d][ref1], alsook het onherroepelijk worden van een beslissing
      waarbij te zijnen aanzien een van de maatregelen, bedoeld in de [artikelen 48, eerste lid, onder e][ref2], en
      [80, eerste lid, onder a en b][ref3], is opgelegd, heeft voor een lid-beroepsgenoot of plaatsvervangend lid-
      beroepsgenoot van een regionaal tuchtcollege of van het centrale tuchtcollege tot gevolg dat zijn functie bij dat
      college van rechtswege een einde neemt.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel48
      [ref3]: https://wetten.overheid.nl/BWBR0006251#Artikel80
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '48'
        hoofdstuk: VII
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '48'
        hoofdstuk: VII
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0006251
        artikel: '80'
        hoofdstuk: VIII
  - number: '59.2'
    text: |-
      Een nog niet onherroepelijk geworden beslissing tot oplegging te zijnen aanzien van een van de in
      [artikel 48, eerste lid, onder e en f][ref1], bedoelde maatregelen heeft, indien zij is gegeven met toepassing van
      het aan het slot van de tweede volzin van het zevende lid of het in het achtste lid van dat artikel bepaalde, voor
      een lid-beroepsgenoot of plaatsvervangend lid-beroepsgenoot van een regionaal tuchtcollege of van het centrale
      tuchtcollege tot gevolg dat hij in zijn functie bij dat college van rechtswege is geschorst.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel48
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '48'
        hoofdstuk: VII
        paragraaf: '2'
  - number: '59.3'
    text: |-
      Een nog niet onherroepelijk geworden beslissing tot oplegging te zijnen aanzien van een van de in
      [artikel 80, eerste lid][ref1], bedoelde maatregelen heeft, indien zij is gegeven met toepassing van het aan
      het slot van het derde lid of het in het vijfde lid van dat artikel bepaalde, voor een lid-beroepsgenoot of
      plaatsvervangend lid-beroepsgenoot van een regionaal tuchtcollege of van het centrale tuchtcollege tot gevolg dat
      hij in zijn functie bij dat college van rechtswege is geschorst.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel80
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '80'
        hoofdstuk: VIII
  - number: '60'
    text: |-
      Het in de [artikelen 46c, tweede en derde lid][ref1], [46d, tweede lid][ref2], [46f][ref3],
      [46g, eerste en tweede lid][ref4], [46i, met uitzondering van het eerste lid, onderdeel c][ref5],
      [46j][ref6], [46l, eerste lid, aanhef en onderdelen a en c, en derde lid][ref7], [46m][ref8], [46o][ref9] en
      [46p, eerste tot en met vijfde lid, van de Wet rechtspositie rechterlijke ambtenaren][ref10] bepaalde is van
      overeenkomstige toepassing ten aanzien van de leden en de plaatsvervangende leden van de regionale tuchtcolleges
      en van het centrale tuchtcollege, met dien verstande dat de in het [vijfde lid van artikel 46p][ref11] bedoelde
      mededeling te hunnen aanzien eveneens wordt gedaan aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46c
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel46d
      [ref3]: https://wetten.overheid.nl/BWBR0008365#Artikel46f
      [ref4]: https://wetten.overheid.nl/BWBR0008365#Artikel46g
      [ref5]: https://wetten.overheid.nl/BWBR0008365#Artikel46i
      [ref6]: https://wetten.overheid.nl/BWBR0008365#Artikel46j
      [ref7]: https://wetten.overheid.nl/BWBR0008365#Artikel46l
      [ref8]: https://wetten.overheid.nl/BWBR0008365#Artikel46m
      [ref9]: https://wetten.overheid.nl/BWBR0008365#Artikel46o
      [ref10]: https://wetten.overheid.nl/BWBR0008365#Artikel46p
      [ref11]: https://wetten.overheid.nl/BWBR0008365#Artikel46p
    url: https://wetten.overheid.nl/BWBR0006251/2006-12-15#Artikel60
    references:
      - id: ref1
