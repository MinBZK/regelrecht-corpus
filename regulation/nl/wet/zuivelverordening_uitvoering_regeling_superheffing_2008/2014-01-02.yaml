preamble:
  text: |-
    Gelet op:

    de artikelen 65 tot en met 84 van Verordening (EG) nr. 1234/2007 van de Raad van de Europese Unie van 22 oktober
    2007 houdende een gemeenschappelijke ordening van de landbouwmarkten en specifieke bepalingen voor een aantal
    landbouwproducten (PbEU, L299);

    Verordening (EG) nr. 595/2004 van de Commissie van 30 maart 2004 houdende vaststelling van uitvoeringsbepalingen
    van Verordening (EG) nr. 1788/2003 van de Raad tot vaststelling een heffing in de sector melk en zuivelproducten
    (PbEU L94);

    de artikelen 6, 8, 11, 12, 14, 18, 21, 22, 25 en 26 van de Regeling superheffing 2008; en de artikelen 95 en 96 van
    de Wet op de bedrijfsorganisatie;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0025323/2014-01-02#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze verordening worden de definities gehanteerd van [artikel 1 van de Regeling superheffing 2008][ref1]. In
      aanvulling daarop wordt verstaan onder: - voorzitter: de voorzitter van het productschap;
        - registratienummer: het door het productschap gehanteerde registratienummer van de producent;
        - regeling: de [Regeling superheffing 2008][ref2];
        - superheffing: de in [paragraaf 2][ref3] van de regeling bedoelde heffing;


      [ref1]: https://wetten.overheid.nl/BWBR0023701#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0023701
      [ref3]: https://wetten.overheid.nl/BWBR0025323#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0025323/2014-01-02#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0023701
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0023701
      - id: ref3
        bwb_id: BWBR0025323
        paragraaf: '2'
  - number: '2'
    text: |-
      De in de [artikelen 3][ref1], [4][ref2] en [5][ref3] van deze verordening bedoelde opgaven worden volledig, naar
      waarheid en met inachtneming van de voorgeschreven onderscheidingen en aanwijzingen gedaan en worden gedateerd en
      ondertekend bij het productschap ingediend binnen de gestelde termijnen en met de voorgeschreven periodiciteit.


      [ref1]: https://wetten.overheid.nl/BWBR0025323#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0025323#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0025323#Artikel5
    url: https://wetten.overheid.nl/BWBR0025323/2014-01-02#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0025323
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0025323
        artikel: '4'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0025323
        artikel: '5'
        paragraaf: '2'
  - number: '3'
    text: |-
      De koper doet vóór 15 mei in de volgende heffingsperiode aan het productschap opgave van de bij hem geregistreerde
      natuurlijke of rechtspersonen met een quotum die in de heffingsperiode geen melk hebben geleverd, onder vermelding
      van naam, adres en registratienummer.
    url: https://wetten.overheid.nl/BWBR0025323/2014-01-02#Artikel3
  - number: '4.1'
    text: |-
      De koper doet ten aanzien van in de heffingsperiode van producenten ontvangen melk vóór 15 mei in de volgende
      heffingsperiode aan het productschap opgave, op de door het productschap voorgeschreven wijze, van: - het totaal
      van de feitelijk geleverde hoeveelheden melk;
        - het gemiddelde vetgehalte van het totaal van de feitelijk geleverde hoeveelheden melk;
        - het totaal van de toegedeelde kilogrammen melk en vet waarover de producenten beschikken;
        - het totaal van de hoeveelheden melk, na correctie per producent, van de feitelijk geleverde hoeveelheden melk
      op grond van de vergelijking van het geconstateerde gemiddelde vetgehalte met het voor de producent geldende
      representatieve vetgehalte; en van de per producent geleverde hoeveelheden melk, onderscheiden naar: - de feitelijk
      geleverde hoeveelheden melk, in totaal en per maand;
        - de hoeveelheid vet van die melk, in totaal en per maand;
        - de hoeveelheden melk, na correctie van de feitelijk geleverde hoeveelheden melk op grond van de vergelijking
      van het geconstateerde gemiddelde vetgehalte met het voor de producent geldende representatieve vetgehalte; onder
      vermelding van naam, adres, registratienummer van de producent.
    url: https://wetten.overheid.nl/BWBR0025323/2014-01-02#Artikel4
  - number: '4.2'
    text: |-
      De koper doet ten aanzien van in de heffingsperiode van anderen dan producenten ontvangen melk desgevraagd opgave
      aan het productschap van: - de, per leverancier, aan de koper geleverde hoeveelheden melk, alsmede de hoeveelheid
      vet van die melk onder vermelding van naam en adres van de leverancier, en/of
        - het totaal van de door anderen dan de producenten aan de koper geleverde hoeveelheden melk en de totale
      hoeveelheid vet van die melk.
    url: https://wetten.overheid.nl/BWBR0025323/2014-01-02#Artikel4
  - number: '5'
    text: |-
      De producent die in een heffingsperiode hoeveelheden melk en/of andere zuivelproducten rechtstreeks verkoopt of
      overdraagt doet vóór 15 mei in de volgende heffingsperiode daarvan opgave aan het productschap, op een door het
      productschap voorgeschreven formulier.
    url: https://wetten.overheid.nl/BWBR0025323/2014-01-02#Artikel5
  - number: '6.1'
    text: |-
      Het melkequivalent van room en boter wordt vastgesteld overeenkomstig artikel 12, eerste lid, onderdeel a en b, van
      de commissieverordening.
    url: https://wetten.overheid.nl/BWBR0025323/2014-01-02#Artikel6
  - number: '6.2'
    text: |-
      Voor de vaststelling van het melkequivalent van kaas wordt 1 kg kaas gelijkgesteld met 9,5 kg melk. Rekening
      houdend met het drogestofgehalte en het vetgehalte van de betrokken kaassoort kan een lagere factor dan 9,5
      worden gehanteerd, indien de producent ten genoegen van het productschap aantoont dat voor de bereiding van die
      kaassoort een lagere hoeveelheid melk wordt gebruikt. Dit geldt niet, indien de kaas is bereid uit melk waaraan
      vet is onttrokken en het betrokken melkvet bij de vaststelling van de grondslag voor de eventuele heffing niet
      is meegeteld.
    url: https://wetten.overheid.nl/BWBR0025323/2014-01-02#Artikel6
  - number: '6.3'
    text: |-
      Voor de vaststelling van het melkequivalent van andere zuivelproducten dan bedoeld in het eerste en tweede lid
      wordt: '- indien het yoghurt, pap, vla en andere vloeibare zuivelproducten betreft, de factor 1 gehanteerd;'
        - indien het kwark betreft, de factor 3 gehanteerd.
    url: https://wetten.overheid.nl/BWBR0025323/2014-01-02#Artikel6
  - number: '6.4'
    text: |-
      Indien de in het derde lid bedoelde producten zijn bereid uit melk waaraan melkvet is onttrokken en het betrokken
      melkvet bij de vaststelling van de grondslag voor de eventuele heffing is meegeteld, wordt met inachtneming hiervan
      een lagere hoeveelheid vastgesteld.
    url: https://wetten.overheid.nl/BWBR0025323/2014-01-02#Artikel6
  - number: '6.5'
    text: |-
      Indien de in het derde lid bedoelde producten zijn bereid uit melk waaraan melkvet is toegevoegd, en het betrokken
      melkvet bij de vaststelling van de grondslag voor de eventuele heffing niet is meegeteld, wordt met inachtneming
      hiervan een hogere hoeveelheid vastgesteld.
    url: https://wetten.overheid.nl/BWBR0025323/2014-01-02#Artikel6
  - number: '7'
    text: |-
      De koper stelt de in [artikel 4][ref1] bedoelde hoeveelheden melk en vet vast overeenkomstig het bepaalde
      bij en krachtens de [Zuivelverordening 2005, Grondslag uitbetaling boerderijmelk][ref2] (Verordeningenblad
      Bedrijfsorganisatie, 25 november 2005, nr. 67), dan wel op grond van een andere methodiek welke naar het oordeel
      van de voorzitter voldoende waarborgen biedt voor een nauwkeurige vaststelling.


      [ref1]: https://wetten.overheid.nl/BWBR0025323#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0017209
    url: https://wetten.overheid.nl/BWBR0025323/2014-01-02#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0025323
        artikel: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017209
  - number: '8'
    text: |-
      De koper zendt aan de producent die superheffing is verschuldigd, een nota waarop het bedrag is vermeld dat wordt
      ingehouden ingevolge [artikel 18 van de regeling][ref1]. Op de nota warden tevens de gegevens vermeld op basis
      waarvan het te innen bedrag is berekend.


      [ref1]: https://wetten.overheid.nl/BWBR0023701#Artikel18
    url: https://wetten.overheid.nl/BWBR0025323/2014-01-02#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0023701
        artikel: '18'
  - number: '9'
    text: |-
      De in [artikel 6, derde lid, van de regeling][ref1] bedoelde melding wordt gedaan op een door het productschap
      voorgeschreven formulier. De in [artikel 6, derde lid, van de regeling][ref2] bedoelde datum is 16 februari in de
      betrokken heffingsperiode.


      [ref1]: https://wetten.overheid.nl/BWBR0023701#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0023701#Artikel6
    url: https://wetten.overheid.nl/BWBR0025323/2014-01-02#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0023701
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0023701
        artikel: '6'
  - number: '10'
    text: |-
      De in [artikel 8, vijfde lid, van de regeling][ref1] bedoelde datum is 1 december in de betrokken heffingsperiode.


      [ref1]: https://wetten.overheid.nl/BWBR0023701#Artikel8
    url: https://wetten.overheid.nl/BWBR0025323/2014-01-02#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0023701
        artikel: '8'
  - number: '11.1'
    text: |-
      De in [artikel 11, eerste lid, van de regeling][ref1] bedoelde kennisgeving wordt gedaan op een door
      het productschap voorgeschreven formulier. De in [artikel 11, derde lid, van de regeling][ref2] bedoelde
      datum is 15 januari in de betrokken heffingsperiode voor overdrachten op basis van [artikel 7][ref3]
      of [8 van de regeling][ref4] en 31 maart in de betrokken heffingsperiode voor overdrachten op basis van
      [artikel 9 van de regeling][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0023701#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0023701#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0023701#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0023701#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0023701#Artikel9
    url: https://wetten.overheid.nl/BWBR0025323/2014-01-02#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0023701
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0023701
        artikel: '11'
      - id: ref3
        bwb_id: BWBR0023701
        artikel: '7'
      - id: ref4
        bwb_id: BWBR0023701
        artikel: '8'
      - id: ref5
        bwb_id: BWBR0023701
        artikel: '9'
  - number: '11.2'
    text: |-
      Bij het in het eerste lid bedoelde formulier worden documenten gevoegd ten bewijze van de overdracht alsmede de
      overeenkomst met betrekking tot de overgang van het quotum.
    url: https://wetten.overheid.nl/BWBR0025323/2014-01-02#Artikel11
  - number: '12'
    text: |-
      De in [artikel 14, derde lid][ref1] juncto [artikel 11, eerste lid, van de regeling][ref2] bedoelde kennisgeving
      wordt gedaan op een door het productschap voorgeschreven formulier.


      [ref1]: https://wetten.overheid.nl/BWBR0023701#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0023701#Artikel11
    url: https://wetten.overheid.nl/BWBR0025323/2014-01-02#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0023701
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0023701
        artikel: '11'
  - number: '13'
    text: |-
      De in [artikel 18, derde lid, van de regeling][ref1] bedoelde opgave wordt gedaan op een door het productschap
      voorgeschreven formulier. De in [artikel 18, derde lid, van de regeling][ref2] bedoelde datum is 16 februari in de
      betrokken heffingsperiode.


      [ref1]: https://wetten.overheid.nl/BWBR0023701#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0023701#Artikel18
    url: https://wetten.overheid.nl/BWBR0025323/2014-01-02#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0023701
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0023701
        artikel: '18'
  - number: '14'
    text: |-
      Het in [artikel 21, eerste lid, van de regeling][ref1] bedoelde verzoek wordt gedaan op een door het productschap
      voorgeschreven formulier. De in [artikel 21, tweede lid, van de regeling][ref2] bedoelde datum is 31 augustus in de
      betrokken heffingsperiode.


      [ref1]: https://wetten.overheid.nl/BWBR0023701#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0023701#Artikel21
    url: https://wetten.overheid.nl/BWBR0025323/2014-01-02#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0023701
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0023701
        artikel: '21'
  - number: '15.1'
    text: |-
      De in [artikel 25, derde lid, van de regeling][ref1] bedoelde verzoeken worden gedaan op een door het productschap
      voorgeschreven formulier.


      [ref1]: https://wetten.overheid.nl/BWBR0023701#Artikel25
    url: https://wetten.overheid.nl/BWBR0025323/2014-01-02#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0023701
        artikel: '25'
  - number: '15.2'
    text: |-
      De in [artikel 25, derde lid, van de regeling][ref1] bedoelde datum is: - voor permanente omzetting 1 januari in de
      betrokken heffingsperiode;
        - voor tijdelijke omzetting 16 februari in de betrokken heffingsperiode.


      [ref1]: https://wetten.overheid.nl/BWBR0023701#Artikel25
    url: https://wetten.overheid.nl/BWBR0025323/2014-01-02#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0023701
        artikel: '25'
  - number: '15.3'
    text: De producent kan in de heffingsperiode maximaal 30.000 kg quotum tijdelijk omzetten.
    url: https://wetten.overheid.nl/BWBR0025323/2014-01-02#Artikel15
  - number: '16'
    text: |-
      De [Zuivelverordening uitvoering regeling superheffing 2004][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0016873
    url: https://wetten.overheid.nl/BWBR0025323/2014-01-02#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0016873
  - number: '17'
    text: |-
      Deze verordening treedt in werking op de dag na publicatie in het Verordeningenblad Bedrijfsorganisatie en werkt
      terug tot en met 1 april 2008.
    url: https://wetten.overheid.nl/BWBR0025323/2014-01-02#Artikel17
  - number: '18'
    text: Deze verordening wordt aangehaald als Zuivelverordening uitvoering Regeling superheffing 2008.
    url: https://wetten.overheid.nl/BWBR0025323/2014-01-02#Artikel18
