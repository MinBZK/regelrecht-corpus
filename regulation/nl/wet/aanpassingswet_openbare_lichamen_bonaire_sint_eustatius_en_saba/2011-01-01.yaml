  - number: 6.16.1
    text: |-
      Bij regeling van Onze Minister van Financiën kunnen met het oog op een goede invoering van de in de
      [artikelen 6.2 tot en met 6.11][ref1] genoemde wetten aanvullende regels van overgangsrecht worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028129#Artikel6
    url: https://wetten.overheid.nl/BWBR0028129/2011-01-01#Artikel6.16
    references:
      - id: ref1
        bwb_id: BWBR0028129
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: 6.16.2
    text: |-
      Bij een regeling als bedoeld in het eerste lid kan worden bepaald dat
      [artikel 6, eerste lid, van de Invoeringswet openbare lichamen Bonaire, Sint Eustatius en Saba][ref1] niet van
      toepassing is op beslissingen van de Bank van de Nederlandse Antillen die betrekking hebben op activiteiten die
      voorafgaande aan het van toepassing worden in de openbare lichamen Bonaire, Sint Eustatius en Saba van een in
      de [artikelen 6.2][ref2], [6.3][ref3], [6.4][ref4] of [6.5 tot en met 6.11][ref5] genoemde wet hoofdzakelijk of
      uitsluitend in of vanuit Curaçao of Sint Maarten plaatsvonden.


