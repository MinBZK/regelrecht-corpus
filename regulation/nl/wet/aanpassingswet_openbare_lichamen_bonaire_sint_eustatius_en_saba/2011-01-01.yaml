  - number: '6.15'
    text: |-
      De Wet melding ongebruikelijke transacties BES is van overeenkomstige toepassing op ongebruikelijke transacties als
      bedoeld in artikel 11 van de Landsverordening melding ongebruikelijke transacties, ten aanzien waarvan ten tijde
      van de inwerkingtreding van [artikel 6.5][ref1] nog niet aan de in artikel 11 van die landsverordening bedoelde
      meldingsplicht is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028129#Artikel6
