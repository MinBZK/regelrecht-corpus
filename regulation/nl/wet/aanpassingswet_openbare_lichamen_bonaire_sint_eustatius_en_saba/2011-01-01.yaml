  - number: 11.34.3
    text: |-
      Voor de toepassing van het tweede lid worden in de in dat lid genoemde wetten tijdens de overgangsperiode voor
      «de Minister van Arbeid en Sociale Zaken» respectievelijk «de Sociale Verzekeringsbank» gelezen «Onze Minister van
      Sociale Zaken en Werkgelegenheid».
    url: https://wetten.overheid.nl/BWBR0028129/2011-01-01#Artikel11.34
  - number: 11.34.4
    text: |-
      Indien noodzakelijk voor een goede uitvoering van de in het tweede lid genoemde wetten tijdens de overgangsperiode,
      wordt de tekst daarvan gelezen in het licht van de tekst van die wetten zoals die komt te luiden na het tijdstip
      van inwerkingtreding. De toepassing van de eerste zin leidt niet tot een uitkomst ten nadele van de belanghebbende.
    url: https://wetten.overheid.nl/BWBR0028129/2011-01-01#Artikel11.34
  - number: 11.34.5
    text: Bij ministeriele regeling kunnen nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0028129/2011-01-01#Artikel11.34
