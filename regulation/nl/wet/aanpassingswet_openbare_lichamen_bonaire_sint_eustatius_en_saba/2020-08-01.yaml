  - number: '16.1'
    text: |-
      1 De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld waarbij aan de inwerkingtreding
      van artikelen of onderdelen daarvan uit [hoofdstuk 10][ref1] terugwerkende kracht kan worden verleend tot en met
      1 januari 2011.

      2 De [artikelen 8.6a][ref2], [8.64, onderdelen III0B, QQQQQA, AAAAAAC, AAAAAAE, AAAAAAF, WWWWWWWA][ref3] en
      [13.2, onderdeel CA][ref4], treden in werking uiterlijk één jaar nadat één of meer artikelen van deze wet in
      werking zijn getreden.

      3 De [artikelen 2.3a][ref5], [8.6b][ref6], [8.20, onderdelen Ca, DDa, DDb, EEa en FFa][ref7],
      [8.64, onderdelen AAAAAAB, AAAAAAD en CCCCCCCA][ref8], en [13.2, onderdeel CB][ref9], treden in werking uiterlijk
      twee jaar nadat één of meer artikelen van deze wet in werking zijn getreden.


