  - number: '6.13'
    text: |-
      Een op het tijdstip van inwerkingtreding van [artikel 6.3][ref1] van kracht zijnde inbewaringneming op grond van
      artikel 5 van de Landsverordening meldingsplicht grensoverschrijdende geldtransporten, blijft van kracht totdat
      zij overeenkomstig [artikel 5 van de Wet grensoverschrijdende geldtransporten BES][ref2] is geëindigd. Als tijdstip
      waarop de termijn van inbewaringneming voor de toepassing van die wet is aangevangen, geldt het tijdstip waarop de
      inbewaringneming feitelijk is aangevangen.


      [ref1]: https://wetten.overheid.nl/BWBR0028129#Artikel6.3
      [ref2]: https://wetten.overheid.nl/BWBR0028165#Artikel5
