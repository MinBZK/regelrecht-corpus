  - number: '6.12'
    text: |-
      Assurantiebemiddelaars die ten tijde van de inwerkingtreding van [artikel 6.2][ref1] waren ingeschreven in het
      register, bedoeld in artikel 4 van de Landsverordening Assurantiebemiddelingsbedrijf, worden, indien zij op dat
      moment kantoor hielden op Bonaire, Sint Eustatius of Saba, van rechtswege ingeschreven in het register, bedoeld in
      [artikel 4 van de Wet assurantiebemiddelingsbedrijf BES][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028129#Artikel6.2
      [ref2]: https://wetten.overheid.nl/BWBR0028566#Artikel4
