  - number: '11.34'
    text: |-
      1 Dit artikel is van toepassing in de openbare lichamen Bonaire, Sint Eustatius en Saba en verstaat onder:

      a. tijdstip van transitie: het tijdstip bedoeld in
      [artikel 1, onderdeel a, van de Invoeringswet openbare lichamen Bonaire, Sint Eustatius en Saba][ref1];

      b. het tijdstip van inwerkingtreding: het tijdstip waarop de [artikelen 11.18][ref2], [11.21][ref3], [11.22][ref4],
      [11.28][ref5] en [11.32][ref6] van de Aanpassingswet openbare lichamen Bonaire, Sint Eustatius en Saba in werking
      treden;

      c. overgangsperiode: de periode vanaf het tijdstip van transitie tot het tijdstip van inwerkingtreding.

      2 Tijdens de overgangsperiode worden de volgende wetten en daarop berustende bepalingen uitgevoerd door Onze
      Minister van Sociale Zaken en Werkgelegenheid:

      a. de [Cessantiawet BES][ref7];

      b. de [Wet algemene ouderdomsverzekering BES][ref8];

      c. de [Wet algemene weduwen- en wezenverzekering BES][ref9];

      d. de [Wet ongevallenverzekering BES][ref10], met uitzondering van de bepalingen inzake geneeskundige behandeling
      en verpleging;

      e. de [Wet ziekteverzekering BES][ref11], met uitzondering van de bepalingen inzake geneeskundige behandeling en
      verpleging.

      3 Voor de toepassing van het tweede lid worden in de in dat lid genoemde wetten tijdens de overgangsperiode voor
      «de Minister van Arbeid en Sociale Zaken» respectievelijk «de Sociale Verzekeringsbank» gelezen «Onze Minister van
      Sociale Zaken en Werkgelegenheid».

      4 Indien noodzakelijk voor een goede uitvoering van de in het tweede lid genoemde wetten tijdens de
      overgangsperiode, wordt de tekst daarvan gelezen in het licht van de tekst van die wetten zoals die komt te luiden
      na het tijdstip van inwerkingtreding. De toepassing van de eerste zin leidt niet tot een uitkomst ten nadele van
      de belanghebbende.

      5 Bij ministeriele regeling kunnen nadere regels worden gesteld.


