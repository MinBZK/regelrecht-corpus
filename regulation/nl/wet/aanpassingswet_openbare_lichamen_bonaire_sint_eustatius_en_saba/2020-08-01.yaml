  - number: '6.16'
    text: |-
      1 Bij regeling van Onze Minister van Financiën kunnen met het oog op een goede invoering van de in de
      [artikelen 6.2 tot en met 6.11][ref1] genoemde wetten aanvullende regels van overgangsrecht worden gesteld.

      2 Bij een regeling als bedoeld in het eerste lid kan worden bepaald dat
      [artikel 6, eerste lid, van de Invoeringswet openbare lichamen Bonaire, Sint Eustatius en Saba][ref2] niet van
      toepassing is op beslissingen van de Bank van de Nederlandse Antillen die betrekking hebben op activiteiten die
      voorafgaande aan het van toepassing worden in de openbare lichamen Bonaire, Sint Eustatius en Saba van een in
      de [artikelen 6.2][ref3], [6.3][ref4], [6.4][ref5] of [6.5 tot en met 6.11][ref6] genoemde wet hoofdzakelijk of
      uitsluitend in of vanuit Curaçao of Sint Maarten plaatsvonden.


