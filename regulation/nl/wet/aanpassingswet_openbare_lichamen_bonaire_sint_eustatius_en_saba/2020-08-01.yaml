preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat met de eilandgebieden Bonaire, Sint Eustatius en Saba is overeengekomen
    dat zij een staatsrechtelijke positie krijgen binnen het Nederlandse staatsbestel en het in verband hiermee
    wenselijk is wetten en de Nederlands-Antilliaanse regelingen, die ingevolge de Invoeringswet BES als wet van
    toepassing blijven in de openbare lichamen Bonaire, Sint Eustatius en Saba, aan te passen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0028129/2020-08-01#ArtikelAanhef
