  - number: '11.33'
    text: |-
      Onze Minister van Sociale Zaken en Werkgelegenheid kan bij ministeriële regeling de bedragen genoemd in:

      a. [artikel 7, eerste lid][ref1], [7a, eerste lid, en derde lid, onderdeel e][ref2],
      [26, eerste en vierde lid, van de Wet algemene ouderdomsverzekering BES][ref3],

      b. [artikel 11, eerste en derde lid][ref4], [12, eerste, tweede en derde lid][ref5], en
      [29, eerste en vierde lid, van de Wet algemene weduwen- en wezenverzekering BES][ref6],

      c. [artikel 9, eerste lid, van de Wet minimumlonen BES][ref7], en

      d. [artikel 5, negende lid, van de Wet ongevallenverzekering BES][ref8],

      eenmalig aanpassen met ingang van de transitiedatum, bedoeld in
      [artikel 1, onderdeel a, van de Invoeringswet openbare lichamen Bonaire, Sint Eustatius en Saba][ref9] of 1 januari
      van het daaropvolgende kalenderjaar.


