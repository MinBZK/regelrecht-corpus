preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regels te stellen betreffende een afzonderlijke
    inkomensvoorziening voor kunstenaars, die niet over voldoende middelen beschikken om in de noodzakelijke kosten van
    bestaan te voorzien;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0009344/2004-07-23#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      ln deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Sociale Zaken en Werkgelegenheid;

      b. burgemeester en wethouders: burgemeester en wethouders van de gemeente, bedoeld in [artikel 19][ref1];

      c. adviserende instelling: de instelling bedoeld in [artikel 26][ref2];

      d. kunstenaar: degene die hier te lande werkzaam is in een beroep of bedrijf ter uitoefening van de scheppende,
      uitvoerende of toegepaste kunst.


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0009344#Artikel26
