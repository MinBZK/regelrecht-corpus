  - number: '30'
    text: |-
      1 Burgemeester en wethouders voeren ten behoeve van een getrouwe weergave van de uitvoering en een effectief
      uitvoeringsproces een zodanige administratie dat de juiste, volledige en tijdige vastlegging zijn gewaarborgd van:

      a. de beslissingen over aanvragen, onderzoeken, uitkeringen, vorderingen en verplichtingen en de hieruit
      voortvloeiende betalingen en ontvangsten;

      b. de hierop betrekking hebbende bescheiden;

      c. het onderzoek dat is verricht naar de juistheid en de volledigheid van de verstrekte gegevens en de overgelegde
      bescheiden.

      2 Onze Minister stelt, na overleg met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, regels aangaande
      de in het eerste lid bedoelde administratie.
    url: https://wetten.overheid.nl/BWBR0009344/2004-07-23#Artikel30
  - number: '31'
    text: |-
      1 De adviserende instelling voert ten behoeve van een getrouwe weergave van de uitvoering van de haar toevertrouwde
      taak een zodanige administratie dat de juiste, volledige en tijdige vastlegging zijn gewaarborgd van:

      a. de ingevolge [artikel 26][ref1] verstrekte adviezen;

      b. de hierop betrekking hebbende bescheiden;

      c. het onderzoek dat is verricht naar de juistheid en de volledigheid van de door de aanvrager verstrekte gegevens
      en de overgelegde bescheiden.

      2 Onze Minister kan, na overleg met Onze Minister van Onderwijs, Cultuur en Wetenschap, regels stellen aangaande de
      in het eerste lid bedoelde administratie.


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel26
    url: https://wetten.overheid.nl/BWBR0009344/2004-07-23#Artikel31
