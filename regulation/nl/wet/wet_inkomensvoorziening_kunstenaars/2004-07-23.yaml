    text: |-
      Kosten van een uitkering worden van de kunstenaar teruggevorderd voor zover hij naderhand met betrekking
      tot de periode waarover de uitkering is verleend over in aanmerking te nemen middelen als bedoeld in
      [paragraaf 3.4 van de Wet werk en bijstand][ref1] beschikt of kan beschikken.


