  - number: '9'
    text: |-
      1 De uitkering bedraagt per kalendermaand voor:

      a. een alleenstaande: f1.152,88 ;

      b. een alleenstaande ouder: het bedrag gelijk aan de som van de voor een dergelijk persoon geldende bijstandsnorm,
      bedoeld in [artikel 21, onderdeel b, van de Wet werk en bijstand][ref1] en de maximale toeslag, bedoeld in
      [artikel 25, tweede lid, van de Wet werk en bijstand][ref2], verminderd met het verschil tussen het maandelijkse
      bedrag voor een alleenstaande, bedoeld in onderdeel a, enerzijds en de voor een alleenstaande geldende
      bijstandsnorm, bedoeld in [artikel 21, onderdeel a, van de Wet werk en bijstand][ref3], vermeerderd met de
      voormelde maximale toeslag, anderzijds;

      c. gehuwden: het bedrag gelijk aan de voor dergelijke personen geldende bijstandsnorm, bedoeld in
      [artikel 21, onderdeel c, van de Wet werk en bijstand][ref4], verminderd met het verschil tussen het maandelijkse
      bedrag voor een alleenstaande, bedoeld in onderdeel a, enerzijds en de voor een alleenstaande geldende
      bijstandsnorm, bedoeld in [artikel 21, onderdeel a, van de Wet werk en bijstand][ref5], vermeerderd met de maximale
      toeslag, bedoeld in [artikel 25, tweede lid, van de Wet werk en bijstand][ref6], anderzijds.

      2 Indien de echtgenoot van de kunstenaar in een omstandigheid verkeert als bedoeld in
      [artikel 5, eerste lid, onder b, c of d][ref7], wordt de hoogte van de uitkering vastgesteld op het bedrag voor een
      alleenstaande of voor een alleenstaande ouder.

      3 Vooruitlopend op de definitieve vaststelling van de hoogte van de uitkering, bedoeld in [artikel 10][ref8], wordt
      op de uitkering, het inkomen van de kunstenaar en zijn gezin in mindering gebracht voorzover de som van het bedrag,
      genoemd in het eerste lid, en het inkomen in een kalendermaand waarin recht op uitkering bestaat meer bedraagt dan
      het bedrag genoemd in respectievelijk [het tweede lid, onder a, b of c van artikel 10][ref9].


