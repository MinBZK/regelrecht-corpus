  - number: 2a
    text: |-
      1 Van het vermogen gebonden in een door de kunstenaar of zijn gezin in eigendom bewoonde woning met bijbehorend erf
      blijft bij de toepassing van deze wet en de daarop berustende bepalingen buiten beschouwing:

      a. het vermogen voorzover dit minder bedraagt dan het bedrag genoemd in
      [artikel 34, tweede lid, onderdeel d, van de Wet werk en bijstand][ref1], en

      b. het bedrag waarmee het bij de aanvang van de uitkeringsverlening aanwezige overige vermogen minder bedraagt dan
      de toepasselijke vermogensgrens, bedoeld in [artikel 34, derde lid, van de Wet werk en bijstand][ref2].

      2 Onder een woning, bedoeld in het eerste lid, wordt mede verstaan een woonschip.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel34
