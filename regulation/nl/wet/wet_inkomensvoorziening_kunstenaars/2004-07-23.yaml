  - number: '6'
    text: |-
      1 Het recht op uitkering wordt beëindigd, indien de kunstenaar:

      a. of zijn gezin over vermogen is komen te beschikken of over een inkomen gelijk aan of hoger dan het voor hem
      geldende bedrag, bedoeld in [artikel 4, onder a][ref1];

      b. niet kan aantonen met zijn werkzaamheden als kunstenaar gedurende een bij algemene maatregel van bestuur te
      bepalen periode tenminste het in die maatregel bepaalde bruto-inkomen of bruto-omzet te hebben verworven;

      c. of zijn echtgenoot daarom verzoekt.

      2 Burgemeester en wethouders onderzoeken regelmatig of de omstandigheden bedoeld in het eerste lid, onderdelen a of
      b, zich voordoen.

      3 Onze Minister kan, na overleg met Onze Minister van Onderwijs, Cultuur en Wetenschap, nadere regels stellen
      omtrent de regelmaat waarmee onderzoeken als bedoeld in het tweede lid moeten plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel4
    url: https://wetten.overheid.nl/BWBR0009344/2004-07-23#Artikel6
