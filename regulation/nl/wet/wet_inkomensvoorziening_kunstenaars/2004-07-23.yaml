        artikel: '17'
        hoofdstuk: II
        paragraaf: '5'
  - number: '37'
    text: |-
      1 Onze Minister verleent op verzoek van de gemeente voorschotten op de vergoeding.

      2 Voor zover de uitvoering van deze wet door burgemeester en wethouders, dan wel de administratie bedoeld in
      [artikel 30][ref1], ernstige tekortkomingen vertoont, kan Onze Minister besluiten de voorschotten lager vast te
      stellen dan uit de krachtens het derde lid gestelde regels zou voortvloeien.

      3 Onze Minister stelt regels aangaande het verlenen van voorschotten.


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel30
    url: https://wetten.overheid.nl/BWBR0009344/2004-07-23#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0009344
        artikel: '30'
        hoofdstuk: V
        paragraaf: '2'
  - number: '38'
    text: |-
      1 Onze Minister stelt de vergoeding vast binnen een jaar na ontvangst van de kostenopgave bedoeld in
      [artikel 36, tweede lid][ref1].

      2 Indien de kostenopgave niet is ontvangen binnen 18 maanden na het kalenderjaar waarop deze betrekking heeft dan
      wel niet is voorzien van de verklaring bedoeld in [artikel 36, tweede lid][ref2], kan Onze Minister de vergoeding
      over dat jaar ambtshalve vaststellen.

      3 Onze Minister kan een vergoeding geheel of gedeeltelijk weigeren en een reeds betaalde vergoeding geheel of
      gedeeltelijk terugvorderen of verrekenen indien:

      a. het uitkering betreft die is verleend in strijd met het bij en krachtens deze wet bepaalde;

      b. niet is voldaan aan het bepaalde bij en krachtens [artikel 30][ref3];

      c. het uitkering betreft die niet of niet volledig overeenkomstig [hoofdstuk IV][ref4] is of wordt teruggevorderd.

      4 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de
      toepassing van het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0009344#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0009344#Artikel30
      [ref4]: https://wetten.overheid.nl/BWBR0009344#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0009344/2004-07-23#Artikel38
