  - number: '42'
    text: |-
      In afwijking van [artikel 8:69 van de Algemene wet bestuursrecht][ref1] kan de rechter in beroep of hoger beroep
      het bedrag waarop de boete is vastgesteld ook ten nadele van de belanghebbende wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel869
    url: https://wetten.overheid.nl/BWBR0009344/2004-07-23#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 8:69
  - number: '46'
    text: |-
      Het recht tot strafvordering vervalt indien burgemeester en wethouders aan de belanghebbende ter zake van hetzelfde
      feit reeds een boete hebben opgelegd.
    url: https://wetten.overheid.nl/BWBR0009344/2004-07-23#Artikel46
  - number: '50'
    text: |-
      Als adviserende instelling wordt met ingang van de inwerkingtreding van deze wet erkend de Stichting Kunstenaars &
      Cultuur en Ondernemerschap te Amsterdam, zulks mede met toepassing van [artikel 26, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel26
    url: https://wetten.overheid.nl/BWBR0009344/2004-07-23#Artikel50
