  - number: '8'
    text: |-
      1 De uitkering wordt voorlopig verleend in de vorm van een renteloze geldlening.

      2 De uitkering van de kunstenaar, bedoeld in [artikel 4a][ref1], wordt verleend in de vorm van een geldlening
      onder verband van hypotheek of verpanding tot een bedrag gelijk aan het bedrag van het vermogen, bedoeld in
      [artikel 4a][ref2].

      3 Indien de uitkering wordt verleend in de vorm van een geldlening onder verband van hypotheek of verpanding komen
      de kosten verbonden aan de taxatie van de waarde van de woning, aan de hypotheekakte en aan de inschrijving van
      de hypotheek, alsmede de bijkomende kosten, ten laste van de kunstenaar. Voor deze kosten kunnen burgemeester en
      wethouders uitkering verlenen die begrepen wordt onder de geldlening onder verband van hypotheek of verpanding.

      4 Indien uitkering in de vorm van een geldlening onder verband van hypotheek of verpanding is verleend tot het
      bedrag, bedoeld in het tweede lid, en het recht op uitkering wordt voortgezet, wordt het vermogen gebonden in de
      door de kunstenaar of zijn gezin in eigendom bewoonde woning opnieuw vastgesteld. Indien blijkt, dat het vermogen
      met ten minste een bij algemene maatregel van bestuur te bepalen bedrag is toegenomen wordt de uitkeringsverlening
      in de vorm van een geldlening onder verband van hypotheek of verpanding voortgezet tot een bedrag gelijk aan het
      bedrag waarmee het vermogen is toegenomen. Het derde lid is van overeenkomstige toepassing.

      5 Indien na beëindiging van uitkeringsverlening onder verband van hypotheek of verpanding opnieuw recht op
      uitkering bestaat, wordt deze verleend met toepassing van de laatst gevestigde hypotheek of verpanding.

      6 Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de vaststelling van de waarde van
      de woning en de voorwaarden waaronder de uitkering in de vorm van een geldlening onder verband van hypotheek of
      verpanding wordt verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel4a
      [ref2]: https://wetten.overheid.nl/BWBR0009344#Artikel4a
    url: https://wetten.overheid.nl/BWBR0009344/2004-07-23#Artikel8
