  - number: '4'
    text: |-
      De kunstenaar heeft recht op uitkering indien hij:

      a. of zijn gezin niet over vermogen beschikt en het inkomen:

      1° van een alleenstaande lager is dan f 1.646,97 ;

      2° van een alleenstaande ouder lager is dan f 2.117,53 ;

      3° van gehuwden lager is dan f 2.352,82 ;

      b. hetzij gedurende een zekere periode als kunstenaar werkzaam is geweest en met deze werkzaamheden gedurende een
      bij algemene maatregel van bestuur te bepalen periode ten minste het in die maatregel te bepalen bruto-inkomen of
      bruto-omzet heeft verworven;

      c. hetzij de aanvraag op grond van deze wet heeft ingediend binnen 12 maanden nadat hij met goed gevolg een
      opleiding op het gebied van de kunst, een voortgezette opleiding op het gebied van de kunst, of een voortgezette
      opleiding bouwkunst als bedoeld in de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] heeft
      voltooid, voorzover deze opleiding gericht is op de uitoefening van het kunstenaarschap, dan wel een daarmee
      vergelijkbare, door Onze Minister van Onderwijs, Cultuur en Wetenschap aan te wijzen, opleiding heeft voltooid.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0009344/2004-07-23#Artikel4
    references:
