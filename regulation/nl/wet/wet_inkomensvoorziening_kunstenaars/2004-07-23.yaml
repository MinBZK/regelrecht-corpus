  - number: '16'
    text: |-
      1 Burgemeester en wethouders weigeren de uitkering tijdelijk geheel of gedeeltelijk, indien de kunstenaar:

      a. blijk heeft gegeven van een tekortschietend besef van verantwoordelijkheid voor de voorziening in het bestaan;

      b. een verplichting als bedoeld in [artikel 15, eerste lid, of tweede lid, onderdelen a, b, d en e][ref1], niet of
      niet behoorlijk is nagekomen; of

      c. de verplichting bedoeld in [artikel 15, tweede lid, onderdeel c][ref2], niet binnen de daarvoor door
      burgemeester en wethouders vastgestelde termijn is nagekomen.

      2 Een maatregel als bedoeld in het eerste lid wordt afgestemd op de ernst van de gedraging, de mate waarin de
      kunstenaar de gedraging verweten kan worden en de omstandigheden waarin hij verkeert. Van het opleggen van een
      maatregel wordt in elk geval afgezien, indien elke vorm van verwijtbaarheid ontbreekt.

      3 Indien het niet tijdig nakomen van de verplichting, bedoeld in [artikel 15, tweede lid, onderdeel c][ref3],
      niet heeft geleid tot het ten onrechte of tot een te hoog bedrag verlenen van uitkering, kunnen burgemeester en
      wethouders afzien van het opleggen van een maatregel als bedoeld in het eerste lid en volstaan met het geven van
      een schriftelijke waarschuwing ter zake van het niet tijdig nakomen van de verplichting, tenzij het niet tijdig
      nakomen van de verplichting plaatsvindt binnen een periode van twee jaar te rekenen vanaf de datum waarop eerder
      aan de kunstenaar een zodanige waarschuwing is gegeven.

      4 Indien daarvoor dringende redenen aanwezig zijn kunnen burgemeester en wethouders besluiten af te zien van het
      opleggen van een maatregel als bedoeld in het eerste lid.

      5 Bij algemene maatregel van bestuur kunnen met betrekking tot het eerste en tweede lid nadere regels worden
      gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0009344#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0009344#Artikel15
