  - number: '17'
    text: |-
      1 Indien de belanghebbende de verplichting bedoeld in [artikel 15, tweede lid, onderdeel c][ref1], niet of niet
      behoorlijk is nagekomen door geen, onjuiste of onvolledige mededelingen te doen, leggen burgemeester en wethouders
      hem een boete op van ten hoogste € 2 269.

      2 De hoogte van de boete wordt afgestemd op de ernst van de gedraging, de mate waarin de belanghebbende de
      gedraging verweten kan worden en de omstandigheden waarin hij verkeert.

      Van het opleggen van een boete wordt in elk geval afgezien, indien elke vorm van verwijtbaarheid ontbreekt.

      3 Indien het niet of niet behoorlijk nakomen van de verplichting, bedoeld in
      [artikel 15, tweede lid, onderdeel c][ref2], niet heeft geleid tot het ten onrechte of tot een te hoog bedrag
      verlenen van uitkering kunnen burgemeester en wethouders afzien van het opleggen van een boete als bedoeld in het
      eerste lid en volstaan met het geven van een schriftelijke waarschuwing ter zake van het niet of niet behoorlijk
      nakomen van de verplichting, tenzij het niet of niet behoorlijk nakomen van de verplichting plaatsvindt binnen
      een periode van twee jaar te rekenen vanaf de datum waarop eerder aan de belanghebbende een zodanige waarschuwing
      is gegeven.

      4 Indien daarvoor dringende redenen aanwezig zijn kunnen burgemeester en wethouders besluiten af te zien van het
      opleggen van een boete.

      5 Degene aan wie een boete is opgelegd is verplicht desgevraagd aan burgemeester en wethouders de inlichtingen te
      verstrekken die voor de tenuitvoerlegging van de boete van belang zijn.

      6 Voor zover de boete nog niet is geïnd vervalt zij door het overlijden van degene aan wie zij is opgelegd.

      7 Bij algemene maatregel van bestuur worden met betrekking tot het eerste en tweede lid nadere regels gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0009344#Artikel15
