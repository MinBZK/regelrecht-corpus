    text: |-
      1 Onze Minister verleent op verzoek van de adviserende instelling voorschotten op de vergoeding.

      2 Voor zover de uitvoering van deze wet door de adviserende instelling, dan wel de administratie bedoeld in
      [artikel 31][ref1], ernstige tekortkomingen vertoont, kan Onze Minister besluiten de voorschotten lager vast te
      stellen dan uit de krachtens het derde lid gestelde regels zou voortvloeien.

      3 Onze Minister kan regels stellen aangaande het verlenen van voorschotten.


