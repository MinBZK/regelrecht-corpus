  - number: '10'
    text: |-
      1 Uiterlijk in het kalenderjaar volgend op het kalenderjaar waarin de uitkering is verleend en binnen acht
      weken nadat de kunstenaar de benodigde gegevens heeft verstrekt, wordt de hoogte van de uitkering, bedoeld
      in [artikel 9][ref1], definitief vastgesteld en wordt de uitkering, overeenkomstig het derde lid, omgezet in
      een bedrag om niet, voorzover de kunstenaar en zijn gezin geen in aanmerking te nemen vermogen hebben en de
      uitkering niet is verstrekt in de vorm van een geldlening onder verband van hypotheek of verpanding als bedoeld in
      [artikel 8, tweede lid][ref2].

      2 De inhoudingsplichtige verstrekt gelijktijdig met zijn gegevensverstrekking aan de inspecteur bedoeld in
      [artikel 101 van de uitvoeringsregeling loonbelasting 2001][ref3] aan de kunstenaar een jaaropgave.

      3 Bij de definitieve vaststelling van de hoogte van de uitkering, bedoeld in het eerste lid, wordt op het bedrag,
      genoemd in [artikel 9, eerste lid][ref4], het inkomen van de kunstenaar en zijn gezin over het kalenderjaar waarin
      uitkering is verleend, in mindering gebracht, voorzover de som van dat bedrag en het naar een gemiddeld maandbedrag
      omgerekende inkomen meer bedraagt dan:

      a. f 2.058,71  voor een alleenstaande;

      b. f 2.646,91  voor een alleenstaande ouder;

      c. f 2.941,03  voor gehuwden.

      4 Indien het bedrag van de verleende uitkering, bedoeld in [artikel 9][ref5]:

      a. lager is dan de definitief vastgestelde hoogte van de uitkering, wordt voor het verschil ambtshalve uitkering
      verleend en wordt de als renteloze geldlening verleende uitkering omgezet in een bedrag om niet;

      b. gelijk is aan de definitief vastgestelde hoogte van de uitkering, wordt de als renteloze geldlening verleende
      uitkering omgezet in een bedrag om niet;

      c. hoger is dan de definitief vastgestelde hoogte van de uitkering, wordt de als renteloze geldlening verleende
      uitkering omgezet in een bedrag om niet tot een bedrag gelijk aan de definitief vastgestelde hoogte van de
      uitkering.

      5 Indien de verleende uitkering, bedoeld in [artikel 9][ref6], als gevolg van het opleggen van een maatregel als
      bedoeld in [artikel 16][ref7], tijdelijk geheel of gedeeltelijk is geweigerd, of als gevolg van het opleggen van
      een boete op grond van deze of een andere wet is gekort, wordt bij de vaststelling van de hoogte van de ambtshalve
      toe te kennen uitkering, bedoeld in het derde lid, onder a, de verleende uitkering in aanmerking genomen alsof de
      maatregel niet was opgelegd respectievelijk de korting niet had plaatsgevonden.

      6 Indien de uitkering is verleend in de vorm van een geldlening onder verband van hypotheek of verpanding wordt:

      a. de ambtshalve toe te kennen uitkering, bedoeld in het derde lid, onder a, begrepen onder die geldlening;

      b. bij toepassing van het derde lid, onder c, het verschil tussen de definitief vastgestelde hoogte van de
      uitkering en het bedrag van de verleende uitkering, bedoeld in [artikel 9][ref8], teruggevorderd.


