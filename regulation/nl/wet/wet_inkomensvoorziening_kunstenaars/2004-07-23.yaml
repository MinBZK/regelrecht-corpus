  - number: 23d
    text: |-
      1 Een uitkering die als gevolg van een besluit als bedoeld in [artikel 16][ref1] ten onrechte of tot een te hoog
      bedrag is verleend, wordt van de kunstenaar teruggevorderd.

      2 Hetgeen anderszins onverschuldigd is betaald wordt teruggevorderd voor zover de kunstenaar dit redelijkerwijs had
      kunnen begrijpen.

      3 Terugvordering als bedoeld in het tweede lid vindt niet plaats, indien de betreffende kosten zijn gemaakt meer
      dan twee jaar vóór de datum van verzending van het besluit tot terugvordering.


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel16
