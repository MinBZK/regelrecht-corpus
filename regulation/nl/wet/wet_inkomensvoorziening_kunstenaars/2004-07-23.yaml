  - number: 23f
    text: Terugvordering geschiedt door burgemeester en wethouders van de gemeente die de uitkering heeft verleend.
    url: https://wetten.overheid.nl/BWBR0009344/2004-07-23#Artikel23f
  - number: 23g
    text: |-
      1 Het besluit tot terugvordering vermeldt hetgeen teruggevorderd wordt, de termijn of termijnen waarbinnen
      moet worden betaald, alsmede dat het besluit, bij gebreke van tijdige betaling, op de wijze als omschreven in
      [artikel 23h][ref1] zal worden tenuitvoergelegd.

      2 De persoon van wie kosten van de uitkering worden teruggevorderd is verplicht desgevraagd aan burgemeester en
      wethouders de inlichtingen te verstrekken die voor terugvordering ingevolge dit hoofdstuk van belang zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel23h
    url: https://wetten.overheid.nl/BWBR0009344/2004-07-23#Artikel23g
    references:
