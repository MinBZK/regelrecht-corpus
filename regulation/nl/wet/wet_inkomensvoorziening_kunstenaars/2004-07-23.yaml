  - number: '39'
    text: |-
      1 Het Rijk vergoedt de door de adviserende instelling gemaakte uitvoeringskosten overeenkomstig de krachtens het
      derde lid, onder a, gestelde regels.

      2 De adviserende instelling declareert de in een kalenderjaar gemaakte kosten door middel van een
      kostenopgave over dat jaar. Deze opgave is voorzien van een verklaring van een registeraccountant
      of een Accountant-Administratieconsulent ten aanzien van wie bij de inschrijving in het in
      [artikel 36, eerste lid, van de Wet op de Accountants-Administratieconsulenten][ref1] bedoelde register een
      aantekening is geplaatst als bedoeld in [artikel 36, derde lid][ref2], van die wet.

      3 Onze Minister stelt regels inzake:

      a. de vergoeding van gemaakte uitvoeringskosten;

      b. de wijze en het tijdstip van declareren, alsmede de daarbij door de adviserende instelling nader te verstrekken
      gegevens;

      c. de in het tweede lid bedoelde verklaring en het onderzoek dat resulteert in deze verklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0002856#Artikel36
    url: https://wetten.overheid.nl/BWBR0009344/2004-07-23#Artikel39
