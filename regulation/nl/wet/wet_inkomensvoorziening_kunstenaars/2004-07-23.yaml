  - number: '18'
    text: |-
      1 Indien burgemeester en wethouders jegens de kunstenaar een handeling verrichten waaraan deze in redelijkheid
      de gevolgtrekking kan verbinden dat aan hem wegens een bepaalde gedraging een boete zal worden opgelegd, is de
      kunstenaar niet langer verplicht terzake van die gedraging enige verklaring af te leggen, voor zover het betreft de
      boeteoplegging. De kunstenaar wordt hiervan in kennis gesteld alvorens hem mondeling om informatie wordt gevraagd.

      2 Indien burgemeester en wethouders voornemens zijn om aan de kunstenaar een boete op te leggen, wordt hiervan
      kennis gegeven aan de kunstenaar onder vermelding van de gronden waarop het voornemen berust. De kennisgeving is
      een handeling als bedoeld in het eerste lid.

      3 Op verzoek van de kunstenaar die de in het vorige lid bedoelde kennisgeving wegens zijn gebrekkige kennis van de
      Nederlandse taal onvoldoende begrijpt, dragen burgemeester en wethouders er zoveel mogelijk zorg voor dat de in die
      kennisgeving vermelde gronden aan de kunstenaar worden medegedeeld in een voor hem begrijpelijke taal.

      4 In afwijking van [afdeling 4.1.2 van de Algemene wet bestuursrecht][ref1] stellen burgemeester en wethouders de
      kunstenaar in de gelegenheid om naar keuze schriftelijk of mondeling zijn zienswijze naar voren te brengen voordat
      de boete wordt opgelegd.

      5 Indien de kunstenaar zijn zienswijze mondeling naar voren brengt, dragen burgemeester en wethouders er op
      verzoek van de kunstenaar die de Nederlandse taal onvoldoende begrijpt, zorg voor dat een tolk wordt benoemd die de
      kunstenaar kan bijstaan, tenzij redelijkerwijs kan worden aangenomen dat daaraan geen behoefte bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.2
    url: https://wetten.overheid.nl/BWBR0009344/2004-07-23#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.1.2
  - number: 18a
    text: |-
      1 Het besluit waarbij de boete wordt opgelegd vermeldt de termijn of de termijnen waarbinnen deze moet worden
      betaald, alsmede de wijze waarop het besluit, bij gebreke van tijdige betaling, overeenkomstig [artikel 18d][ref1]
      zal worden tenuitvoergelegd.

      2 Op verzoek van de kunstenaar die het in het eerste lid bedoelde besluit wegens zijn gebrekkige kennis van de
      Nederlandse taal onvoldoende begrijpt, dragen burgemeester en wethouders er zoveel mogelijk zorg voor dat de in dat
      besluit vermelde informatie aan de kunstenaar wordt medegedeeld in een voor hem begrijpelijke taal.

      3 Bij of krachtens algemene maatregel van bestuur kunnen met betrekking tot het eerste lid nadere regels worden
      gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel18d
    url: https://wetten.overheid.nl/BWBR0009344/2004-07-23#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0009344
        artikel: 18d
        hoofdstuk: II
        paragraaf: '5'
  - number: 18b
    text: |-
      1 Een boete wordt niet opgelegd zolang de gedraging wordt onderzocht door het openbaar ministerie.

      2 De oplegging van een boete blijft definitief achterwege indien ter zake van de gedraging tegen de kunstenaar een
      strafvervolging is ingesteld en het onderzoek ter terechtzitting een aanvang heeft genomen, dan wel het recht tot
      strafvordering is vervallen ingevolge [artikel 74 van het Wetboek van Strafrecht][ref1].

      3 Het openbaar ministerie doet van een omstandigheid als bedoeld in het eerste en tweede lid mededeling aan
      burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel74
    url: https://wetten.overheid.nl/BWBR0009344/2004-07-23#Artikel18b
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '74'
  - number: 18c
    text: |-
      1 Een boete wordt opgelegd binnen een jaar nadat burgemeester en wethouders de kunstenaar overeenkomstig
      [artikel 18, vierde lid][ref1], in de gelegenheid hebben gesteld zijn zienswijze naar voren te brengen. Indien
      terzake aangifte is gedaan of proces-verbaal is opgemaakt en ingezonden vangt de termijn van een jaar aan op de
      dag na die waarop het openbaar ministerie aan burgemeester en wethouders heeft medegedeeld dat geen strafvervolging
      wordt ingesteld.

      2 Een boete wordt in elk geval niet opgelegd na verloop van vijf jaren nadat de desbetreffende gedraging heeft
      plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel18
    url: https://wetten.overheid.nl/BWBR0009344/2004-07-23#Artikel18c
    references:
      - id: ref1
        bwb_id: BWBR0009344
        artikel: '18'
        hoofdstuk: II
        paragraaf: '5'
  - number: 18d
    text: |-
      1 Het besluit waarbij een boete is opgelegd levert een executoriale titel op in de zin van het
      [Tweede Boek van het Wetboek van Burgerlijke Rechtsvordering][ref1]. De titel heeft mede betrekking op de rente en
      kosten, bedoeld in het zevende lid.

      2 Indien degene aan wie een boete is opgelegd een uitkering op grond van deze wet of een uitkering op grond
      van de [Wet inkomensvoorziening oudere en gedeeltelijke arbeidsongeschikte werkloze werknemers][ref2],
      de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref3] of de
      [Wet werk en bijstand][ref4] ontvangt, wordt het besluit waarbij de boete is opgelegd tenuitvoergelegd door
      verrekening met die bijstand of uitkering.

      3 Indien degene aan wie een boete is opgelegd inmiddels een uitkering op grond van deze wet of een uitkering als
      bedoeld in het tweede lid ontvangt van een andere gemeente dan de gemeente die de boete heeft opgelegd, betaalt die
      andere gemeente het bedrag van die boete, zonder dat daarvoor een machtiging nodig is van de kunstenaar, op haar
      verzoek aan de gemeente die de boete heeft opgelegd.

      4 Indien degene aan wie een boete is opgelegd een uitkering ontvangt op grond van de [Werkloosheidswet][ref5],
      de [Ziektewet][ref6], de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref7],
      de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref8], de
      [Wet op de arbeidsongeschiktheidsverzekering][ref9], de [Toeslagenwet][ref10], de [Algemene Ouderdomswet][ref11],
      de [Algemene nabestaandenwet][ref12] of de [Wet arbeid en zorg][ref13], betaalt het Uitvoeringsinstituut
      werknemersverzekeringen, onderscheidenlijk de Sociale verzekeringsbank het bedrag van die boete, zonder dat
      daarvoor diens machtiging nodig is op haar verzoek aan de gemeente die de boete heeft opgelegd.

      5 Indien degene aan wie een boete is opgelegd geen uitkering op grond van deze wet of een uitkering als bedoeld
      in het tweede of vierde lid ontvangt of meer ontvangt, dan wel ten aanzien van zodanige uitkering toepassing
      van het derde en vierde lid niet mogelijk is, wordt het besluit waarbij de boete is opgelegd bij gebreke van
      tijdige betaling met toepassing van het [Wetboek van Burgerlijke Rechtsvordering][ref14] op zijn kosten betekend
      en tenuitvoergelegd.

      6 De tenuitvoerlegging van een besluit waarbij een boete is opgelegd vindt plaats met toepassing van het tweede,
      derde of vierde lid, dan wel van het vijfde lid, dan wel van het tweede, derde of vierde lid in combinatie met het
      vijfde lid.

      7 Bij gebreke van tijdige betaling wordt de verschuldigde boete verhoogd met de wettelijke rente en de op de
      invordering betrekking hebbende kosten.

      8 De betekening en tenuitvoerlegging ingevolge het vijfde lid kan geschieden door de deurwaarder, bedoeld in
      [artikel 231, tweede lid, onderdeel ][ref15]. [Artikel 256 van die wet][ref16] is van overeenkomstige toepassing.

      9 Op het executoriaal beslag ingevolge dit artikel door burgemeester en wethouders op loon, sociale uitkeringen
      of andere periodieke betalingen, welke derden verschuldigd zijn of worden aan degene aan wie een boete is
      opgelegd, zijn de [artikelen 479][ref17], behoudens [artikel 479][ref18] van overeenkomstige toepassing. De
      in [artikel 479][ref19] aan de raad voor de kinderbescherming toegekende bevoegdheid komt gelijkelijk toe aan
      burgemeester en wethouders.

      10 De tenuitvoerlegging van een besluit met toepassing van dit artikel geschiedt zodanig dat de kunstenaar blijft
      beschikken over een inkomen gelijk aan de beslagvrije voet bedoeld in de [artikelen 475][ref20] en [475][ref21].

      11 Het tiende lid geldt niet zolang de kunstenaar zijn verplichting bedoeld in [artikel 17, vijfde lid][ref22],
      niet of niet behoorlijk nakomt.


