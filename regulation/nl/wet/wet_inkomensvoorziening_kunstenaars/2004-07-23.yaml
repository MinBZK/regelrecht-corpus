  - number: 23i
    text: |-
      Onder kosten van een uitkering in de zin van dit hoofdstuk wordt verstaan de door de gemeente betaalde uitkering
      verhoogd met de loonbelasting en de premies volksverzekeringen waarvoor de gemeente die de uitkering verstrekt
      krachtens de [Wet op de loonbelasting 1964][ref1] inhoudingsplichtige is, alsmede met de ziekenfondspremie, voor
      zover deze belasting en premies niet verrekend kunnen worden met de belastingdienst en het Uitvoeringsinstituut
      werknemersverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0002471
    url: https://wetten.overheid.nl/BWBR0009344/2004-07-23#Artikel23i
    references:
      - id: ref1
        bwb_id: BWBR0002471
  - number: '25'
    text: |-
      De uitvoering van deze wet berust bij burgemeester en wethouders en, voor zover het de advisering bedoeld in
      [artikel 26][ref1] betreft, de daar bedoelde instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel26
    url: https://wetten.overheid.nl/BWBR0009344/2004-07-23#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0009344
        artikel: '26'
        hoofdstuk: V
        paragraaf: '1'
  - number: '26'
    text: |-
      1 Onze Minister erkent één instelling als de adviserende instelling.

      2 De adviserende instelling heeft tot taak burgemeester en wethouders van advies te dienen of:

      a. de aanvraag is ingediend door een kunstenaar als bedoeld in [artikel 1, onder d][ref1], of
      aan de eisen bedoeld in [artikel 4, onder b en c][ref2], voldaan wordt of aan de eisen bedoeld in
      [artikel 47, eerste lid, aanhef en onder c][ref3]; of

      b. de uitkering moet worden beëindigd om de reden bedoeld in [artikel 6, eerste lid, aanhef en onder b][ref4].

      3 Om voor erkenning als de adviserende instelling in aanmerking te komen is tenminste vereist dat de aanvragende
      instelling:

      a. een rechtspersoon met volledige rechtsbevoegdheid is;

      b. blijkens haar statuten tot doel heeft of mede tot doel heeft taken als bedoeld in het tweede lid te vervullen.

      4 Aan een erkenning kunnen voorschriften worden verbonden.

      5 Een erkenning geldt voor onbepaalde tijd.


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009344#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0009344#Artikel47
      [ref4]: https://wetten.overheid.nl/BWBR0009344#Artikel6
