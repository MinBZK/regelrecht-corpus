  - number: '15'
    text: |-
      1 Burgemeester en wethouders kunnen aan de uitkering verplichtingen verbinden die verband houden met de aard en het
      doel van deze wet, die strekken tot vermindering of beëindiging van het beroep op deze wet of verplichtingen die
      zij nodig achten voor een doelmatige bedrijfs- en beroepsuitoefening.

      2 De kunstenaar is verplicht:

      a. naar behoren een administratie te voeren en daarin desgevraagd inzage te verlenen aan burgemeester en
      wethouders;

      b. zich naar vermogen in te spannen om met zijn kunst zelfstandig in het bestaan te voorzien;

      c. aan burgemeester en wethouders op verzoek of onverwijld uit eigen beweging mededeling te doen van alle feiten
      en omstandigheden waarvan hem redelijkerwijs duidelijk moet zijn dat zij van invloed kunnen zijn op het recht op
      uitkering, het geldend maken van het recht op uitkering, de hoogte of de duur van de uitkering, of op het bedrag
      dat aan hem als uitkering wordt betaald;

      d. ervoor zorg te dragen dat hij als kunstenaar in de zin van deze wet is ingeschreven bij de Centrale organisatie
      werk en inkomen, genoemd in [hoofdstuk 4 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1].

      e. aan burgemeester en wethouders desgevraagd een document als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref2] terstond ter inzage te verstrekken, voorzover dit
      redelijkerwijs nodig is voor de uitvoering van deze wet.

      3 De verplichtingen, bedoeld in het tweede lid, onderdelen c en e, gelden ook voor de echtgenoot van de kunstenaar.

      4 Burgemeester en wethouders stellen bij de uitvoering van deze wet ten aanzien van een belanghebbende op wie de
      verplichting bedoeld in het tweede lid, onderdeel e, rust, de identiteit vast aan de hand van een document als
      bedoeld in [artikel 1 van de Wet op de identificatieplicht][ref3] en nemen de aard en het nummer daarvan op in
      de administratie.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0006297#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0006297#Artikel1
