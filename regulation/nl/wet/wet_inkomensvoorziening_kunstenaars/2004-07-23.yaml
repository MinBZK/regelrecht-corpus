  - number: '13'
    text: |-
      1 Het recht op uitkering bestaat, al dan niet aaneengesloten, gedurende ten hoogste 4 jaar.

      2 Het recht op uitkering eindigt in elk geval tien jaar na de dag met ingang van welke voor de eerste maal
      uitkering op grond van deze wet werd toegekend.
    url: https://wetten.overheid.nl/BWBR0009344/2004-07-23#Artikel13
  - number: '14'
    text: |-
      1 Het recht op uitkering gaat niet eerder in dan de dag waarop de uitkering is aangevraagd.

      2 Indien de belanghebbende gehuwd is wordt de aanvraag door de echtgenoten gezamenlijk ingediend, dan wel door een
      van hen met schriftelijke toestemming van de ander.

      3 De aanvraag wordt afgewezen indien niet voldaan wordt aan het tweede lid.

      4 Indien beide echtgenoten recht hebben op uitkering:

      a. wordt ieders individuele inkomen verminderd met de individuele beroepskosten;

      b. wordt bij de toepassing van [artikel 6, eerste lid, onderdeel b][ref1], slechts acht geslagen op ieders
      individuele bruto-inkomen of bruto-omzet;

      c. bedraagt de som van hun uitkeringen ten hoogste het bedrag bedoeld in
      [artikel 9, tweede lid, onderdeel c][ref2]; en

      d. wordt bij de definitieve vaststelling van de hoogte van de uitkering, bedoeld in [artikel 10][ref3], het in
      [artikel 10, tweede lid, onder c][ref4], genoemde bedrag aangehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0009344#Artikel9
