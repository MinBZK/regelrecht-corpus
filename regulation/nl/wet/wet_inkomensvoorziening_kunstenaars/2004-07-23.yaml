    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. inkomen: de in aanmerking te nemen middelen, bedoeld in [paragraaf 3.4 van de Wet werk en bijstand][ref1];

      b. vermogen: de in aanmerking te nemen middelen, bedoeld in [paragraaf 3.4 van de Wet werk en bijstand][ref2], met
      uitzondering van het vermogen noodzakelijk voor de uitoefening van het beroep van kunstenaar;

      c. beroepskosten: de kosten ter verwerving van het inkomen als kunstenaar;

      d. kinderbijslag: kinderbijslag op grond van de [Algemene Kinderbijslagwet][ref3].

      2 Bij algemene maatregel van bestuur worden regels gesteld voor de vaststelling van het vermogen noodzakelijk voor
      de uitoefening van het beroep van kunstenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Paragraaf3.4
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Paragraaf3.4
