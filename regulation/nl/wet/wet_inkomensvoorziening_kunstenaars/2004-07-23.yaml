        paragraaf: '1'
  - number: '32'
    text: |-
      De [artikelen 63 tot en met 68 van de Wet werk en bijstand][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel63
    url: https://wetten.overheid.nl/BWBR0009344/2004-07-23#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '63'
  - number: '33'
    text: |-
      1 Onze Minister is verantwoordelijk voor het toezicht op de uitvoering van deze wet.

      2 Dit toezicht wordt onder gezag van Onze Minister uitgeoefend door de Inspectie Werk en Inkomen,
      genoemd in [hoofdstuk 7 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1],
      onder leiding van het hoofd van die inspectie. De [artikelen 37][ref2], [38][ref3], [42][ref4] en
      [44 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref5] zijn van overeenkomstige toepassing.

      3 Burgemeester en wethouders en de adviserende instelling verstrekken desgevraagd aan Onze Minister kosteloos alle
      inlichtingen die hij voor de uitoefening van het toezicht nodig heeft en verlenen hem inzage in de administratie,
      bedoeld in [artikel 30, eerste lid][ref6], onderscheidenlijk [artikel 31, eerste lid][ref7].

      4 Ten behoeve van het toezicht, bedoeld in het eerste lid, dienen burgemeester en wethouders jaarlijks bij Onze
      Minister een verslag in over de uitvoering van deze wet. Het verslag omvat mede de kostenopgave, bedoeld in
      [artikel 36, tweede lid][ref8]. Het verslag is voorzien van een verklaring van de accountant, belast met de in
      [artikel 213 van de Gemeentewet][ref9] voorgeschreven controle omtrent de juistheid en volledigheid van verstrekte
      gegevens. Het verslag wordt kosteloos verstrekt.

      5 Bij ministeriële regeling worden regels gesteld inzake het verslag en over de verklaring en het onderzoek dat
      resulteert in deze verklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk7
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel38
