        artikel: '26'
        hoofdstuk: V
        paragraaf: '1'
  - number: '28'
    text: |-
      1 Onze Minister regelt in een besluit tot intrekking van de erkenning zo nodig de gevolgen van die intrekking.

      2 Een besluit tot erkenning of tot intrekking van de erkenning bepaalt de dag waarop de erkenning,
      onderscheidenlijk de intrekking ingaat. Het besluit wordt in de Staatscourant geplaatst.
    url: https://wetten.overheid.nl/BWBR0009344/2004-07-23#Artikel28
  - number: '29'
    text: |-
      Onze Minister oefent de hem in [de artikelen 26][ref1], [27][ref2] en [28][ref3] verleende taken en bevoegdheden
      uit in overeenstemming met Onze Minister van Onderwijs, Cultuur en Wetenschap.


