  - number: '34'
    text: |-
      Onze Minister kan aan burgemeester en wethouders, nadat zij gedurende acht weken in de gelegenheid zijn gesteld
      hun zienswijze naar voren te brengen, aanwijzingen geven met betrekking tot een goede uitvoering van deze wet. Hij
      treedt daarbij niet in de besluitvorming in individuele gevallen.
    url: https://wetten.overheid.nl/BWBR0009344/2004-07-23#Artikel34
  - number: '35'
    text: |-
      1 Burgemeester en wethouders en de adviserende instelling verstrekken desgevraagd kosteloos aan Onze Minister de
      inlichtingen die hij voor de informatievoorziening en de beleidsvorming met betrekking tot deze wet nodig heeft.

      2 Burgemeester en wethouders en de adviserende instelling zijn verplicht ten behoeve van de statistiek gegevens
      inzake de uitvoering van deze wet te verzamelen en kosteloos aan Onze Minister te verstrekken.

      3 Onze Minister kan na overleg met Onze Minister van Onderwijs, Cultuur en Wetenschap regels stellen met betrekking
      tot het verstrekken van de in het eerste en tweede lid bedoelde inlichtingen en gegevens.
    url: https://wetten.overheid.nl/BWBR0009344/2004-07-23#Artikel35
  - number: '36'
    text: |-
      1 Het Rijk vergoedt:

      a. de ten laste van de gemeente gebleven kosten van uitkeringen, waaronder begrepen de bedragen die de gemeente
      in verband hiermee ontvangt door de toepassing van [artikel 17][ref1], alsmede de loonbelasting, premies
      volksverzekeringen en ziekenfondspremie die daarover verschuldigd zijn;

      b. de door de gemeente gemaakte uitvoeringskosten overeenkomstig de krachtens het derde lid, onder a, gestelde
      regels.

      2 Burgemeester en wethouders declareren de in een kalenderjaar gemaakte kosten door middel van een kostenopgave
      over dat jaar.

      3 Onze Minister stelt regels inzake:

      a. de vergoeding van gemaakte uitvoeringskosten;

      b. de wijze en het tijdstip van declareren, alsmede de daarbij door burgemeester en wethouders nader te verstrekken
      gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel17
    url: https://wetten.overheid.nl/BWBR0009344/2004-07-23#Artikel36
    references:
      - id: ref1
