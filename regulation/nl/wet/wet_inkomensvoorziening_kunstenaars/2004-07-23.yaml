  - number: '19'
    text: |-
      1 Het recht op uitkering bestaat jegens burgemeester en wethouders van de gemeente waar de belanghebbende
      woonplaats heeft.

      2 Burgemeester en wethouders stellen het recht op uitkering op aanvraag vast.

      3 Burgemeester en wethouders besluiten gehoord het advies van de instelling bedoeld in [artikel 26][ref1] of:

      a. de aanvraag is ingediend door een kunstenaar als bedoeld in [artikel 1, onder d][ref2], of
      aan de eisen bedoeld in [artikel 4, onder b en c][ref3], voldaan wordt of aan de eisen bedoeld in
      [artikel 47, eerste lid, aanhef en onder c][ref4]; of

      b. de uitkering moet worden beëindigd om de reden bedoeld in [artikel 6, eerste lid, aanhef en onder b][ref5].

      4 Een verzoek om advies als bedoeld in het derde lid, onderdeel a, wordt eerst gedaan nadat is vastgesteld dat de
      aanvraag aan de andere dan de in het derde lid bedoelde eisen voldoet.

      5 Bij algemene maatregel van bestuur kan worden bepaald dat het recht op uitkering bestaat jegens burgemeester en
      wethouders van een bij die maatregel aan te wijzen gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel26
