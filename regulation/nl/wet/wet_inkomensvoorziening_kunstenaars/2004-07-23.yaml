  - number: 23h
    text: |-
      1 Het besluit tot terugvordering levert een executoriale titel op in de zin van het
      [Tweede Boek van het Wetboek van Burgerlijke Rechtsvordering][ref1].

      2 Artikel 18d is van overeenkomstige toepassing, met dien verstande dat indien het gemiddeld inkomen van de
      kunstenaar gedurende drie jaar de beslagvrije voet bedoeld in de [artikelen 475][ref2] en [475][ref3] niet te boven
      is gegaan, burgemeester en wethouders de aflossingsbedragen lager vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel475d
