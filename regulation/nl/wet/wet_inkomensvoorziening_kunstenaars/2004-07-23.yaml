  - number: '5'
    text: |-
      1 Geen recht op uitkering heeft de kunstenaar die:

      a. algemene bijstand op grond van de [Wet werk en bijstand][ref1] ontvangt;

      b. buiten Nederland zijn woonplaats heeft of die in Nederland zijn woonplaats heeft doch die, langer dan de
      gebruikelijke vakantieduur, verblijf houdt buiten Nederland, tenzij dat verblijf noodzakelijk is in verband met
      de beroepsuitoefening;

      c. niet rechtmatig verblijf houdt in de zin van
      [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref2];

      d. rechtens zijn vrijheid ontnomen is; of

      e. de eerste dag van de maand waarin hij 65 jaar wordt heeft bereikt;

      f. die onbetaald verlof geniet als bedoeld in [artikel 1, onderdeel g, van de Werkloosheidswet][ref3] of die
      gehuwd is met een zodanig persoon, voorzover diens gebrek aan middelen daarvan het gevolg is, tenzij belanghebbende
      alleenstaande ouder is en hij verlof geniet als bedoeld in [hoofdstuk 6 van de Wet arbeid en zorg][ref4].

      2 Bij algemene maatregel van bestuur kan worden bepaald dat hier te lande verblijvende vreemdelingen, anders dan
      die bedoeld in [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref5], recht op uitkering
      hebben, onverminderd de overige vereisten voor dat recht:

      a. ter uitvoering van een verdrag dan wel een besluit van een volkenrechtelijke organisatie, of

      b. vreemdelingen die, na rechtmatig verblijf te hebben gehouden in de zin van
      [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref6], rechtmatig in Nederland verblijf hebben
      als bedoeld in [artikel 8, onder g of h, van de Vreemdelingenwet 2000][ref7].

      3 Het eerste lid, onderdeel d, is niet van toepassing op bij algemene maatregel van bestuur aan te wijzen
      categorieën personen waarbij tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende maatregel
      plaatsvindt buiten een penitentiaire inrichting, een inrichting voor verpleging van ter beschikking
      gestelden, of een inrichting voor justitiële jeugdbescherming zijnde een landelijke voorziening als bedoeld in
      [artikel 65 van de Wet op de jeugdhulpverlening][ref8].


