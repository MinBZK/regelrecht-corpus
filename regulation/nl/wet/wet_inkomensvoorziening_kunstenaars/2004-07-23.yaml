  - number: 19a
    text: |-
      1 Indien de kunstenaar de voor de verlening van de uitkering van belang zijnde gegevens of de gevorderde
      bewijsstukken niet, niet tijdig of onvolledig heeft verstrekt en hem dit te verwijten valt, dan wel indien de
      kunstenaar anderszins onvoldoende medewerking verleent aan het onderzoek, schorten burgemeester en wethouders het
      recht op uitkering op:

      a. vanaf de eerste dag van de periode waarop het verzuim betrekking heeft, of

      b. vanaf de dag van het verzuim indien niet kan worden bepaald op welke periode dit verzuim betrekking heeft.

      2 Indien bij de beoordeling van het recht op een uitkering blijkt dat het door een kunstenaar verstrekte adres van
      hemzelf of van zijn echtgenoot afwijkt van het adres waaronder de betrokkene in de gemeentelijke basisadministratie
      persoonsgegevens staat ingeschreven, schorten burgemeester en wethouders het recht op een uitkering op.

      3 Geen opschorting vindt plaats indien:

      a. de afwijking redelijkerwijs geen gevolgen kan hebben voor het recht op of de hoogte van de uitkering;

      b. de kunstenaar van de afwijking redelijkerwijs geen verwijt kan worden gemaakt, of;

      c. daarvoor naar het oordeel van burgemeester en wethouders dringende redenen aanwezig zijn.

      4 Burgemeester en wethouders doen schriftelijk mededeling van de opschorting, bedoeld in het eerste en tweede lid,
      aan de kunstenaar en stellen hem daarbij in de gelegenheid binnen een door hen te stellen termijn het verzuim te
      herstellen.

      5 De opschorting wordt beëindigd zodra het burgemeester en wethouders gebleken is dat de afwijking niet meer
      bestaat. Indien de afwijking ook na de krachtens het vierde lid gestelde termijn nog bestaat, herzien burgemeester
      en wethouders het besluit tot toekenning van de uitkering of trekken zij dit in met ingang van de eerste dag
      waarover het recht op een uitkering is opgeschort.
    url: https://wetten.overheid.nl/BWBR0009344/2004-07-23#Artikel19a
  - number: '20'
    text: |-
      1 Onverminderd het elders in deze wet bepaalde terzake van herziening of intrekking van een besluit tot toekenning
      van uitkering en terzake van weigering van uitkering, herzien burgemeester en wethouders een dergelijk besluit of
      trekken zij dat in:

      a. indien een gedraging als bedoeld in [artikel 16, eerste lid][ref1], of het niet of niet behoorlijk nakomen van
      een daar bedoelde verplichting heeft geleid tot het ten onrechte of tot een te hoog bedrag verlenen van uitkering;

      b. indien anderszins de uitkering ten onrechte of tot een te hoog bedrag is verleend.

      2 Als de belanghebbende in het geval, bedoeld in [artikel 19a, eerste lid][ref2], het verzuim niet herstelt binnen
      de daarvoor gestelde termijn, trekken burgemeester en wethouders na het verstrijken van deze termijn het besluit
      tot toekenning van uitkering in met ingang van de eerste dag waarover het recht op uitkering is opgeschort.

      3 Indien daarvoor dringende redenen aanwezig zijn kunnen burgemeester en wethouders besluiten geheel of
      gedeeltelijk van herziening of intrekking af te zien.


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0009344#Artikel19a
