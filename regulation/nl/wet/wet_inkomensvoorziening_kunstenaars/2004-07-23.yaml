  - number: '21'
    text: |-
      1 Burgemeester en wethouders betalen de uitkering maandelijks achteraf.

      2 In afwijking van het eerste lid wordt de vakantietoeslag, voor zover niet reeds eerder betaald, jaarlijks betaald
      in de maand juni over de aan die maand voorafgaande 12 maanden, dan wel in de maand waarin de uitkering eindigt.
    url: https://wetten.overheid.nl/BWBR0009344/2004-07-23#Artikel21
  - number: '22'
    text: |-
      1 De uitkering is niet vatbaar voor vervreemding, verpanding of beslag.

      2 Een machtiging tot het in ontvangst nemen van de uitkering, onder welke vorm of welke benaming ook verleend, is
      steeds herroepelijk.

      3 Elk beding strijdig met dit artikel is nietig.
    url: https://wetten.overheid.nl/BWBR0009344/2004-07-23#Artikel22
  - number: '23'
    text: |-
      Kosten van de uitkering worden door de gemeente teruggevorderd in de gevallen en naar de regels aangegeven in dit
      hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0009344/2004-07-23#Artikel23
  - number: 23a
    text: |-
      1 In afwijking van artikel 23 kunnen burgemeester en wethouders, op verzoek van kunstenaar, besluiten gedeeltelijk
      van terugvordering of gedeeltelijk van verdere terugvordering van de uitkering af te zien, indien:

      a. redelijkerwijs te voorzien is dat de kunstenaar niet zal kunnen voortgaan met het betalen van zijn schulden;

      b. redelijkerwijs te voorzien is dat een schuldregeling met betrekking tot alle vorderingen, behoudens de in het
      tweede lid bedoelde, van de overige schuldeisers zonder een zodanig besluit niet tot stand zal komen; en

      c. de vordering van de gemeente wegens de teruggevorderde uitkering ten minste zal worden voldaan naar
      evenredigheid met de vorderingen van de schuldeisers van gelijke rang.

      2 Het eerste lid is niet van toepassing ten aanzien van:

      a. de terugvordering van de uitkering als gevolg van verwijtbaar gedrag van de kunstenaar;

      b. vorderingen welke door pand of hypotheek op een goed of goederen zijn gedekt, behoudens voor zover zij niet op
      die goederen verhaald kunnen worden.

      3 Het besluit tot het gedeeltelijk afzien van terugvordering of tot het gedeeltelijk afzien van verdere
      terugvordering treedt niet in werking voordat een schuldregeling overeenkomstig het eerste lid tot stand is
      gekomen.

      4 Het besluit tot het gedeeltelijk afzien van terugvordering of tot het gedeeltelijk afzien van verdere
      terugvordering wordt ingetrokken of ten nadele van de kunstenaar gewijzigd indien:

      a. niet binnen twaalf maanden nadat dat besluit is bekendgemaakt, een schuldregeling is tot stand gekomen die
      voldoet aan de eisen bedoeld in het eerste lid;

      b. de kunstenaar zijn schuld aan de gemeente niet overeenkomstig de schuldregeling voldoet; of

      c. onjuiste of onvolledige gegevens zijn verstrekt en de verstrekking van juiste of volledige gegevens tot een
      ander besluit zou hebben geleid.

      5 Bij ministeriële regeling kunnen met betrekking tot dit artikel nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0009344/2004-07-23#Artikel23a
  - number: 23b
    text: |-
      In afwijking van artikel 23 kunnen burgemeester en wethouders, onder voorwaarden die Onze Minister kan stellen,
      besluiten van terugvordering af te zien indien het terug te vorderen bedrag een door Onze Minister vast te stellen
      bedrag niet te boven gaat.
    url: https://wetten.overheid.nl/BWBR0009344/2004-07-23#Artikel23b
  - number: 23c
    text: |-
      1 In afwijking van [artikel 23][ref1] kunnen burgemeester en wethouders besluiten van terugvordering of van verdere
      terugvordering af te zien, indien de kunstenaar:

      a. gedurende vijf jaar volledig aan zijn betalingsverplichtingen heeft voldaan;

      b. gedurende vijf jaar niet volledig aan zijn betalingsverplichtingen heeft voldaan, maar het achterstallige bedrag
      over die periode, vermeerderd met de daarover verschuldigde wettelijke rente en de op de invordering betrekking
      hebbende kosten, alsnog heeft betaald;

      c. gedurende vijf jaar geen betalingen heeft verricht en niet aannemelijk is dat hij deze op enig moment zal gaan
      verrichten; of

      d. een bedrag, overeenkomend met ten minste 50% van de restsom in één keer aflost.

      2 De in het eerste lid, onder *a* en *b*, genoemde termijn is drie jaar indien:

      a. het gemiddeld inkomen van de kunstenaar in die periode de beslagvrije voet bedoeld in de [artikelen 475][ref2]
      en [475][ref3] niet te boven is gegaan; en

      b. de terugvordering niet het gevolg is van het niet of niet behoorlijk nakomen van de verplichting,
      bedoeld in [artikel 15, tweede lid, onderdeel c][ref4], of de [artikelen 28, tweede lid][ref5], en
      [29, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref6].

      3 Het eerste lid is niet van toepassing ten aanzien van vorderingen welke door pand of hypotheek op een goed of
      goederen zijn gedekt, behoudens voorzover zij niet op die goederen verhaald kunnen worden.

      4 Bij ministeriële regeling kunnen met betrekking tot dit artikel nadere regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel475d
