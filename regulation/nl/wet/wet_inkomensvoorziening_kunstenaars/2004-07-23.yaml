  - number: '3'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. woonplaats: de woonplaats bedoeld in de [artikelen 10, eerste lid][ref1], en
      [11 van Boek 1 van het Burgerlijk Wetboek][ref2];

      b. echtgenoot of gehuwde:

      1.° degene die naar burgerlijk recht als zodanig wordt aangemerkt;

      2. degene die een geregistreerd partnerschap is aangegaan;

      3.° de ongehuwde die met een ander een gezamenlijke huishouding voert, tenzij het betreft een bloedverwant in de
      eerste graad of een bloedverwant in de tweede graad indien er bij één van de bloedverwanten in de tweede graad
      sprake is van zorgbehoefte;

      c. ongehuwde: mede degene die duurzaam gescheiden leeft van de persoon met wie hij gehuwd is;

      d. gezamenlijke huishouding: een gezamenlijke huishouding als bedoeld in
      [artikel 3, tweede tot en met vijfde lid, van de Wet werk en bijstand][ref3];

      e. alleenstaande: de ongehuwde die geen tot zijn last komende kinderen heeft en geen gezamenlijke huishouding voert
      met een ander, tenzij het betreft een bloedverwant in de eerste graad of een bloedverwant in de tweede graad indien
      er bij één van de bloedverwanten in de tweede graad sprake is van zorgbehoefte;

      f. alleenstaande ouder: de ongehuwde die de volledige zorg heeft voor een of meer tot zijn last komende kinderen
      en geen gezamenlijke huishouding voert met een ander tenzij het betreft een bloedverwant in de eerste graad of
      een bloedverwant in de tweede graad indien er bij één van de bloedverwanten in de tweede graad sprake is van
      zorgbehoefte;

      g. gezin:

      1°. de kunstenaar en zijn echtgenoot tezamen;

      2°. de kunstenaar, zijn echtgenoot en de tot hun last komende minderjarige kinderen tezamen;

      3°. de alleenstaande kunstenaar en de tot zijn last komende kinderen tezamen;

      h. kind: het in Nederland woonachtige eigen kind of stiefkind;

      i. ten laste komend kind: het kind jonger dan 18 jaar voor wie de alleenstaande ouder of de gehuwde aanspraak op
      kinderbijslag kan maken.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel3
