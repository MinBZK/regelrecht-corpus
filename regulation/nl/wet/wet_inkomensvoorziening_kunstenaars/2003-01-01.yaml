  - number: '49'
    text: |-
      Onze Minister zendt in overeenstemming met Onze Minister van Onderwijs, Cultuur en Wetenschappen, drie jaar na de
      inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze
      wet in de praktijk, met dien verstande dat wat betreft de doeltreffendheid en de effecten van artikel 10 in de
      praktijk de genoemde ministers verslag uitbrengen binnen anderhalf jaar na de inwerkingtreding van deze wet.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel49
  - number: '50'
    text: |-
      Als adviserende instelling wordt met ingang van de inwerkingtreding van deze wet erkend de Stichting
      Voorzieningsfonds voor Kunstenaars te 's-Gravenhage, zulks mede met toepassing van [artikel 26, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel26
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel50
